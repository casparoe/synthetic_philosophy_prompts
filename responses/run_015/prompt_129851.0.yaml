answer: |-
  # Seminar Activity: The Council of Auxiliary Hypotheses

  ## 1. Overview and Objectives
  **Duration:** 90 Minutes
  **Participants:** 14 Postgraduate Students (Divided into 4 Research Programmes)
  **Facilitator Role:** Chair of the Council (Neutral Administrator, 'Nature', and Scorekeeper). **Strict Constraint:** Do not mention falsification, demarcation, Popper, or philosophy of science terminology until the Debrief (Minute 70).
  **Goal:** To experientially demonstrate the logical tension between strict falsification (rejecting theories upon failure) and the use of auxiliary hypotheses to protect core claims, leading to the realisation that unlimited protection renders theories unfalsifiable.

  ## 2. Materials Required
  *   **Theory Cards (4 sets):** One set per Research Programme (Alpha, Beta, Gamma, Delta).
  *   **Prediction Slips:** Small pads of paper for each group.
  *   **Voting Paddles:** Two per student (Green for 'Accept Auxiliary', Red for 'Reject Programme').
  *   **Master Scoreboard:** Whiteboard or projected spreadsheet to track Reputation and Coherence.
  *   **Nature's Deck:** A set of sealed envelopes for the Facilitator containing pre-determined outcomes for specific predictions (to ensure failures occur).
  *   **Timer:** Visible to all.

  ## 3. The Research Programmes (Theory Cards)
  *Hand one card to each group. The claims are abstract enough to allow manipulation but specific enough to generate predictions.*

  *   **Programme Alpha (Energetics):** Core Claim: "All system interactions conserve a fixed quantity of Energy."
  *   **Programme Beta (Particles):** Core Claim: "All matter is composed of discrete units that repel at short distances."
  *   **Programme Gamma (Fields):** Core Claim: "All forces are mediated by continuous fields that decay over distance."
  *   **Programme Delta (Cycles):** Core Claim: "All system states return to an initial configuration after a fixed duration."

  ## 4. Rules of the Council

  **A. Objective**
  Maximise your Programme's **Final Standing**.
  Final Standing = **Reputation Points (RP)** × **Coherence Multiplier (CM)**.

  **B. The Rounds**
  There are three Rounds. In each Round, every Programme must submit one **Prediction** based on their Core Claim + any accepted Auxiliaries.
  1.  **Submission:** Groups write a specific, observable prediction (e.g., "Object X will move Y metres").
  2.  **Verdict:** The Facilitator reveals the outcome (Pass or Fail) based on 'Nature's Deck' or logical consistency.
  3.  **Scoring:**
      *   **Pass:** +10 RP.
      *   **Fail:** 0 RP.
  4.  **The Auxiliary Clause:** If a Prediction Fails, the Programme is not immediately eliminated. They may propose an **Auxiliary Hypothesis** to explain the failure without changing the Core Claim.
      *   *Example:* "The prediction failed *because* of an unseen magnetic interference."
  5.  **The Vote:** The *other three* Programmes vote on whether to Accept the Auxiliary.
      *   **Majority Accept:** The Programme survives. **Cost:** Coherence Multiplier decreases by 0.2 (e.g., 1.0 → 0.8).
      *   **Majority Reject:** The Programme is defunded (eliminated from future rounds).
  6.  **Coherence Limits:**
      *   Starting Coherence: 1.0.
      *   If Coherence reaches 0.0, the Programme is eliminated (too degenerate).
      *   Coherence cannot increase.

  **C. Facilitator Constraints**
  *   You are 'Nature'. You decide if predictions Pass or Fail.
  *   You must ensure that by the end of Round 3, at least two Programmes have failed at least once.
  *   You must ensure that by the end of Round 3, it is logically possible for *all* surviving Programmes to have survived via Auxiliaries.
  *   **Do not explain the philosophy.** If asked "Why does Coherence drop?", reply: "Those are the Council's funding rules."

  ## 5. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide into 4 groups (3-4 students each). Distribute Theory Cards and Voting Paddles. Explain Rules A-C. Emphasise silence on *why* the rules exist. |
  | **10–30** | **Round 1** | Groups draft Prediction 1. Facilitator reveals Outcomes (Rig 2 Failures). Failing groups propose Auxiliaries. Council Votes. Update Scoreboard. |
  | **30–50** | **Round 2** | Groups draft Prediction 2 (must be consistent with Auxiliaries). Facilitator reveals Outcomes (Rig 2 Failures, ideally different groups). Council Votes on Auxiliaries. Update Scoreboard. |
  | **50–65** | **Round 3** | Groups draft Prediction 3. Facilitator reveals Outcomes. Final Votes. Calculate Final Standings. Announce Winner. |
  | **65–70** | **Transition** | Collect materials. Ask students to note their emotional response to the voting process. |
  | **70–90** | **Debrief** | Facilitated discussion mapping the activity to the demarcation problem (see Section 7). |

  ## 6. Facilitator Intervention Scripts
  *The simulation relies on tension. If the group dynamics threaten to resolve the tension too early, intervene using these neutral prompts.*

  **Scenario A: The Inquisitors (Unanimous Rejection)**
  *If the Council votes to Reject every Auxiliary immediately, effectively enforcing naive falsification.*
  *   **Intervention:** "Chair's Note: The Council is being exceptionally strict. Please consider: is it physically impossible for an unseen factor to influence the result? The rules allow for Auxiliaries if they are logically consistent. Are you certain this error proves the Core Claim is false, rather than the conditions being imperfect?"
  *   **Goal:** Force them to allow at least one save to demonstrate the 'protective' capability.

  **Scenario B: The Permissivists (Unanimous Acceptance)**
  *If the Council accepts every Auxiliary without question, making survival trivial.*
  *   **Intervention:** "Chair's Note: The Council is being exceptionally lenient. Please consider: Does this Auxiliary actually constrain future behaviour, or does it simply explain the past error? Remember, every Acceptance reduces your own future Coherence if you need to use it later. Is this a wise use of Council standards?"
  *   **Goal:** Force them to feel the cost of 'saving' a theory, highlighting the degradation of Coherence.

  **Scenario C: Collusion**
  *If groups agree to save each other reciprocally.*
  *   **Intervention:** "Reminder: The Final Standing is competitive. A high Coherence score is required to win. Saving a rival now may lower the standard for everyone, reducing the value of your own survival later."

  ## 7. The Debrief (Minutes 70–90)
  *Do not begin by naming philosophers. Begin by eliciting their experience.*

  **Phase 1: Phenomenology of the Game (70–75 mins)**
  *   **Q:** "In Round 1, how did it feel to propose an Auxiliary after a failure?"
      *   *Expected:* Relief, cleverness, justification.
  *   **Q:** "By Round 3, how did the Core Claim differ from the combination of Core Claim + Auxiliaries?"
      *   *Expected:* The theory became complex, clunky, or vague.
  *   **Q:** "If we had banned Auxiliaries entirely (Round 1 failure = elimination), what would have happened to the winning theory?"
      *   *Expected:* It might have been eliminated on a fluke error.
  *   **Q:** "If we had allowed unlimited Auxiliaries with no Coherence cost, what would happen?"
      *   *Expected:* Anything could be saved; the theory explains everything and nothing.

  **Phase 2: Mapping the Logic (75–85 mins)**
  *Now introduce the philosophical framework.*

  *   **The Naive View:** "In Round 1, some of you wanted to reject programmes immediately on failure. This mirrors **Naive Falsificationism**. The logic is: If Theory T implies Observation O, and not-O occurs, T is false. It is clean, decisive, and risks killing true theories due to experimental error."
  *   **The Auxiliary Problem:** "When you added conditions ('unless magnetic interference', 'except at high velocities'), you were building a **Protective Belt**. This acknowledges that theories are never tested in isolation. They are tested alongside assumptions about instruments, environment, and background conditions."
  *   **The Demarcation Crisis:** "By Round 3, you likely felt that a theory could be saved from *any* refutation if you were willing to pay the Coherence cost. This is the **Duhem-Quine Problem**. If any failure can be absorbed by an auxiliary, **falsifiability ceases to function as a demarcation tool**. A theory that can explain every possible outcome predicts nothing."
  *   **The Cost of Protection:** "The 'Coherence Multiplier' in the game represents **Theoretical Degeneracy**. In philosophy of science, we distinguish between *progressive* shifts (new predictions) and *degenerative* shifts (post-hoc excuses). The game penalised you for the latter, but in reality, distinguishing them is the central difficulty of scientific judgement."

  **Phase 3: Limitations and Reality (85–90 mins)**
  *Be frank about what the simulation omitted.*

  *   **Sociology:** "In the game, you voted rationally based on points. In reality, scientists are influenced by prestige, funding bodies, and paradigm loyalty. A famous theorist can survive many 'Coherence' hits that a graduate student cannot."
  *   **Independent Testability:** "The game treated all Auxiliaries as equal costs. In real science, an Auxiliary is acceptable if it is **independently testable** (e.g., positing a planet to explain orbital wobbles, then finding the planet). If the auxiliary is *ad hoc* (e.g., positing an invisible, undetectable planet), it is suspect. The game could not simulate the 'independent test' constraint fully."
  *   **Conclusion:** "The lesson is not that falsification is useless, but that it is not a simple logical switch. It is a normative judgement call made by a community about when a protective belt has become too thick to sustain the core."

  ## 8. Facilitator's Private 'Nature' Deck (Outcomes)
  *To ensure the philosophical point lands, do not leave outcomes to chance. Use this guide.*

  *   **Round 1:**
      *   **Alpha:** Pass.
      *   **Beta:** **Fail.** (Force an Auxiliary).
      *   **Gamma:** Pass.
      *   **Delta:** **Fail.** (Force an Auxiliary).
  *   **Round 2:**
      *   **Alpha:** **Fail.** (Force an Auxiliary on the 'successful' theory).
      *   **Beta:** Pass (using their R1 Auxiliary).
      *   **Gamma:** **Fail.** (Force an Auxiliary).
      *   **Delta:** Pass (using their R1 Auxiliary).
  *   **Round 3:**
      *   All Programmes submit predictions.
      *   Declare **All Pass**.
      *   **Reasoning:** By now, every surviving theory has enough Auxiliaries to accommodate the result.
      *   **Result:** Calculate scores. The winner will likely be the one who failed least, *but* the group should realise that the losers could have survived if they had spent more Coherence.

  ## 9. Scoring Sheet Template (For Whiteboard)

  | Programme | Round 1 RP | Round 2 RP | Round 3 RP | Total RP | Coherence Multiplier | **Final Score** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Alpha** | 10 | 0 | 10 | 20 | 0.8 | **16.0** |
  | **Beta** | 0 | 10 | 10 | 20 | 0.8 | **16.0** |
  | **Gamma** | 10 | 0 | 10 | 20 | 0.6 | **12.0** |
  | **Delta** | 0 | 10 | 10 | 20 | 0.8 | **16.0** |

  *(Note: Adjust the Coherence Multiplier on the board live as they vote. Start at 1.0. Subtract 0.2 for every accepted Auxiliary. If a group is eliminated, mark 'X'.)*

  ## 10. Contingency: What if a Group is Eliminated Early?
  If a group is eliminated in Round 1 (Council rejects their Auxiliary):
  *   **Action:** They become 'Auditors'. They retain voting rights in Rounds 2 and 3 but cannot earn points.
  *   **Debrief Point:** Use them in the debrief to ask: "As Auditors, did you feel more critical of the surviving theories? Does distance from the research increase scepticism?"

  ## 11. Contingency: What if No One Fails?
  If your 'Nature' Deck fails to trigger (e.g., students make very safe predictions):
  *   **Action:** In Round 2, announce a "Systemic Anomaly." All predictions are deemed to have failed due to a calibration error in the simulation.
  *   **Debrief Point:** "If the instruments are always suspect, can we ever falsify the theory? Or do we just blame the instruments?" (This reinforces the Duhem-Quine point).

  ## 12. Closing Statement for Facilitator
  "Today you acted as both scientists and judges. You felt the urge to protect your work, and the urge to critique your rivals. You saw that strict rules kill progress, but loose rules kill truth. This tension is not a bug in science; it is the feature that drives the demarcation debate. Next week, we read the texts that formalise what you just played."
