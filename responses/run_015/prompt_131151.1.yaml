      *   **Constraints:** One paragraph, no more than 250 words.

  2.  **Brainstorming Core Commitments:**
      *   **Ubuntu:** "I am because we are." Personhood is earned/constituted through right relationships. Moral responsibility is shared but grounded in individual capacity to harmonize. Focus on restoration, not just punishment. Community is constitutive, not just aggregate.
      *   **Liberal Individualism:** Persons are prior to communities. Rights/duties attach to individuals. Contracts are between individuals. Groups are instrumental aggregates.
      *   **The School's Model:**
          *   Mediator selection (network centrality) fits relationalism (position matters more than impartiality).
          *   Cluster registration (group as signatory) fits collectivism/relationalism.
          *   Void-on-fracture (group existence condition for moral obligation) is the tricky part. It suggests moral obligation depends on the *structure* existing, not just the act.
      *   **Critique:** Ubuntu emphasizes *humanity* and *restoration*. If the cluster fractures, Ubuntu would likely demand *more* restoration to rebuild the humanity, not void the agreement. Voiding suggests the obligation was contingent on the group's stability, which leans towards a structuralist collectivism rather than ethical relationalism.
      *   **Liberal Accommodation:** Liberals see groups as contracts. If the "party" (cluster) dissolves, the contract is void. This fits liberal contract theory applied to groups, not necessarily relational ontology.
      *   **Sharpest Test:** The void-on-fracture clause. Ubuntu says relationships *make* us; breaking them requires repair, not nullification of moral debt. A liberal instrumental view says if the entity dissolves, the contract ends.

