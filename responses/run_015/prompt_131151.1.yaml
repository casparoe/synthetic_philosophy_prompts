answer: |-
  This design presupposes a structuralist ontology where moral agency and identity derive from network stability rather than individual character. While administrators invoke Ubuntu, the void-on-fracture clause contradicts Ubuntu's ethical relationalism, which holds that personhood is earned through sustaining connections; thus, fracture demands intensified restoration, not moral nullification. This rule tacitly imports a collectivist contractualism Ubuntu would reject, treating the cluster as a contingent instrument rather than a constitutive moral source. Liberal individualism can accommodate the network mediator and cluster agreement by viewing the group as a corporate legal entity whose dissolution voids contracts, consistent with instrumental association. However, the void-on-fracture clause serves as the sharpest test between views. A genuine relational ontology insists moral responsibility persists precisely because relationships are fragile and constitutive of the self; voiding the agreement prioritizes structural stability over the continuous work of becoming human through others. Consequently, the program requires a metaphysics where group existence conditions moral obligation, distinct from Ubuntu's demand for unconditional relational repair. While the mediator selection accommodates relationalism, only the void clause strictly necessitates a structuralist over a restorative framework, revealing a divergence between the school's administrative convenience and authentic African ethical commitments regarding the inviolability of communal bonds.
