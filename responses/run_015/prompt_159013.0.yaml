      *   (4) vs (5): This *could* dissolve if the argument is strictly utilitarian aggregation. If insect farming reduces vertebrate suffering more than it adds insect suffering, it holds. But the user needs to ensure they aren't treating insect death in (4) as intrinsically bad while treating it as instrumentally acceptable in (5).

