answer: |-
  **MEMORANDUM**

  **TO:** Grant Review Board
  **FROM:** Committee on AI Alignment & Value Learning
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Proposal #402 (Philosopher-in-the-Loop Reward Modeling)

  ### 1. Executive Summary
  The Committee recommends **Funding with Conditions**.

  While the proposal offers a pragmatic approach to reducing noise in reward modeling, the Committee is divided on the epistemological validity of using moral testimony as ground truth. To proceed, the research team must reframe moral expert verdicts not as *authoritative labels*, but as *structured data points* subject to scrutiny, diversification, and reason-giving requirements.

  ### 2. Proposal Overview
  Proposal #402 seeks to develop a value-learning system where a panel of professional ethicists serves as "moral experts." Their judgments on edge-case scenarios will generate target labels for a reward model, weighted by their expressed confidence. The goal is to bypass the inconsistency of layperson feedback and accelerate alignment on complex normative issues.

  ### 3. Committee Deliberation
  The Committee vote was split 50/50, reflecting a central tension in meta-ethics applied to AI safety:

  *   **The Majority View (Pro-Funding):** Moral testimony is a legitimate source of evidence. Humans routinely defer to moral experts (judges, ethicists, community elders) to refine their own moral intuitions. In high-stakes AI alignment, relying on untrained crowd-sourcing introduces dangerous noise. Expert consensus provides a stable "north star" for initial training.
  *   **The Minority View (Skeptical):** Moral judgment is non-delegable. Relying on testimony creates an accountability gap. If the system harms humans based on a philosopher's verdict, responsibility is obscured. Furthermore, mimicking verdicts without understanding underlying reasons leads to brittle moral reasoning.

  ### 4. The Strongest Objection: The "Understanding Constraint" & Accountability
  The Committee acknowledges the strength of the skeptical position, specifically the argument derived from the **Pessimistic View of Moral Testimony** (e.g., Hills, Hopkins).

  The objection is not merely that philosophers might be wrong. It is that *moral understanding requires grasping the reasons why an action is right or wrong, not merely knowing that it is.*

  If a reward model is trained solely on the *verdicts* of experts (e.g., "Action A is impermissible"), it learns to mimic the output of moral reasoning without internalizing the normative structure. This creates two specific risks:
  1.  **Fragility:** The system will fail in out-of-distribution scenarios where the expert rules do not explicitly apply, because it lacks the underlying "moral map."
  2.  **Accountability Obfuscation:** By treating expert verdicts as data, the engineering team may abdicate responsibility for the system's values. If the AI acts harmfully based on a weighted consensus of utilitarians, the engineers cannot claim they were merely "following the data," nor can the philosophers be held liable for the deployment context.

  This objection suggests that outsourcing moral labeling is not just epistemically risky, but morally hazardous, as it treats normative truth as an empirical commodity to be extracted rather than a responsibility to be shouldered.

  ### 5. Decision & Rationale
  Despite the strength of the objection, a blanket rejection would stall valuable empirical research into how human normative reasoning can be formalized. Moral testimony is unavoidable in AI development; developers already implicitly encode their own moral views. Making this process explicit via a panel is preferable to hidden bias.

  Therefore, we will **Fund with Conditions**. The grant is awarded on the premise that the project investigates moral testimony *critically*, rather than treating it as a solved input mechanism.

  ### 6. Criteria for Using Moral Testimony in Value-Learning
  To mitigate the risks outlined above, the grantee must adhere to the following four criteria regarding the use of moral testimony:

  **A. The Reason-Giving Requirement**
  Verdicts alone are insufficient. The expert panel must provide structured natural language justifications for their labels. The reward model must be trained to attend to the *reasons* provided, not just the binary classification. This addresses the "Understanding Constraint" by forcing the system to associate outcomes with normative arguments.

  **B. Moral Pluralism**
  The panel cannot represent a single school of thought (e.g., predominantly utilitarian). It must represent conflicting normative frameworks (deontological, virtue-ethical, care ethics, etc.). Disagreement between experts must be preserved as a feature of the dataset (e.g., as uncertainty estimates) rather than averaged away. The system must learn to recognize moral *ambiguity*, not just moral *truth*.

  **C. The Accountability Chain**
  The proposal must establish a clear chain of responsibility. The engineering team retains final liability for deployment. The expert panel serves in an advisory capacity only. The final report must explicitly state that expert labels are *provisional hypotheses* about human values, not ground truth.

  **D. Dynamic Calibration**
  The system must include a mechanism for "moral feedback loops" where layperson input can override or flag expert consensus. If the system's behavior (driven by expert labels) conflicts with the revealed preferences of affected users, the expert weights must be downgradable. Moral testimony cannot be static.

  ### 7. Next Steps
  The Principal Investigator is requested to submit a revised budget and methodology section within 14 days demonstrating how these four criteria will be technically implemented. Specifically, we require a schema for how "reason-giving" will be tokenized and weighted in the loss function.

  **Signed,**

  *Committee Chair*
  *AI Alignment & Value Learning Grant Committee*
