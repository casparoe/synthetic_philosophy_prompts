prompt: |-
  I've been going down the moral testimony rabbit hole and I'm stuck on how to apply it. I'm on the commitee for a small grant to build a value-learning system. The proposal says it will use a panel of philosophers as moral experts and turn their verdicts into target labels for the reward model, with confidence weights. Half the committee says moral testimony is a legitimate source of evidence, half says moral judgments can't be delegated and this makes the system unaccountable. Draft the committee's decision memo -- fund, fund with conditions, or reject -- with a clear recommendation, criteria for when moral testimony can be used in value-learning research, and an honest treatment of the strongest objection.
