answer: |-
  ### 1. The mapping

  To evaluate the economist's claim, we must align the formal components of ordinary decision under uncertainty with the impartial-observer setup. The isomorphism holds only if we accept specific interpretations of the variables.

  | Component | Ordinary Decision (e.g., Insurance) | Impartial Observer (Veil of Ignorance) |
  | :--- | :--- | :--- |
  | **Agent** | A single persisting individual. | A fictional "observer" or chooser behind the veil. |
  | **States** | External events (fire, no fire). | Identity assignments (being Person 1, Person 2...) |
  | **Outcomes** | Asset states contingent on events. | Social allocations contingent on identity. |
  | **Utility** | $u(x)$, fixed across states. | $u_i(x)$, varies by identity (state-dependent). |
  | **Probabilities** | Empirical frequencies or subjective beliefs. | Stipulated moral probabilities (usually $1/n$). |
  | **Norm** | Prudential rationality (maximize own EU). | Moral rationality (maximize social EU). |
  | **Experience** | Agent experiences the realized outcome. | No single agent experiences the "social" outcome. |

  The critical tension lies in the utility row. In ordinary risk, the utility function represents the agent's fixed tastes. In the veil setup, the "utility" is a function of which person you turn out to be. The mapping requires treating identity as a state variable that switches not just the outcome, but the *metric* by which the outcome is valued.

  ### 2. Where the analogy is fine

  Formally, the economist is correct that the *structure* is identical. If you grant the setup above, the vNM representation theorem applies to the observer just as it does to an insurer. The Pareto condition maps cleanly to ex ante efficiency: if every possible identity prefers lottery A to B, the observer must too. The axioms of completeness, transitivity, continuity, and independence constrain the social ordering exactly as they constrain individual choice. These structural parallels are not noise; they ensure that if the observer is rational in the vNM sense, their preferences are representable by an expected utility function. This formal validity is why the argument is seductive. It successfully translates moral constraints into rationality constraints *within the model*. However, formal isomorphism does not guarantee ethical validity. The analogy works mathematically but fails ontologically, which is where the economist's normative conclusion collapses.

  ### 3. Where it breaks

  The economist's claim that prioritarianism is "irrational risk-aversion" fails because the analogy smuggles in substantive ethical premises as technical assumptions. There are five load-bearing disanalogies.

  First, **state-dependent utility**. In standard vNM theory, utility is defined over outcomes, independent of the state. Here, the state (identity) determines the utility function itself ($u_i$ vs $u_j$). To maximize expected utility across states with different utility functions, you must compare utility levels across persons. Standard decision theory does not permit this; it only ranks outcomes for a fixed utility function. The move from "maximize EU" to "sum of utilities" requires assuming $u_i$ and $u_j$ are measured in comparable units. This is not a decision-theoretic fact; it is an interpersonal comparison assumption hidden inside the state-definition.

  Second, **no persisting subject**. Prudential rationality governs a single entity that exists across all states. If I buy fire insurance, *I* am safe or *I* am burnt. Behind the veil, the chooser is a fiction. No single subject experiences the "average utility." Therefore, the norm of "prudential rationality" does not apply. Calling a deviation from average utilitarianism "irrational" category-errors a moral weighting parameter as a psychological consistency constraint. There is no self to be consistent.

  Third, **risk-neutrality over utility**. The economist argues EU implies utilitarianism. This is false. EU requires linearity over *probabilities*, not over *utility levels*. An observer can satisfy all vNM axioms while having a concave utility function over individual utilities (prioritarianism). To get utilitarianism, you must assume the observer is risk-neutral regarding the distribution of utility itself. This is a moral stance on inequality, not a requirement of rationality. Prioritarianism is not irrational risk-aversion; it is risk-aversion over a different domain (welfare distributions) that remains fully consistent with vNM.

  Fourth, **units and scaling**. vNM utilities are unique only up to positive affine transformation ($u' = au + b$). The sum $\sum u_i$ is meaningless unless the zeros ($b$) and units ($a$) are fixed across all individuals. Ordinary decision under uncertainty never faces this because there is only one utility function. The veil argument silently assumes a "similar capacity for satisfaction" to fix these scales. Without this extra premise, the aggregation theorem yields a weighted sum where the weights are arbitrary artifacts of scaling, not moral equalities.

  Fifth, **adopting preferences**. The observer must adopt Person $i$'s preferences when in state $i$. This is the "extended preferences" assumption. Rationality does not require me to value what you value if I were you; it requires me to value what *I* value. Requiring the observer to adopt others' utility functions is an ethical demand for empathy, not a logical constraint on choice. The economist treats this adoption as given, but it is the very thing that needs justification.

  ### 4. Does the conclusion survive?

  The conclusion does not survive intact. The claim that "accepting expected utility for individuals plus impartiality commits you to average utilitarianism" is false without extra, unstated premises. To rescue the argument, the economist must explicitly add: (1) interpersonal comparability of utility units (fixing zeros and scales), (2) risk-neutrality over the distribution of utility (ruling out prioritarianism), and (3) the moral stipulation that identity probabilities are equal (rather than empirical). Once these are laid bare, the argument is no longer "just ordinary decision under uncertainty." It is a specific ethical theory built on top of decision theory. Prioritarianism is not irrational; it simply rejects the extra premise of risk-neutrality over utility levels. The economist's attempt to close discussion by appealing to rationality fails because he has conflated moral parameters with logical constraints. The veil argument provides a representation, not a justification. It shows what utilitarianism looks like if you accept these premises, not why you must accept them.

  ### 5. A better analogy, if there is one

  The executor/architect picture is superior because it abandons the pretense of prudential choice. An executor dividing an estate does not face a risk of becoming the beneficiaries; she faces a duty to weigh their claims. This correctly identifies the problem as one of aggregation rather than self-interest. However, it does not solve the scaling problem. The executor still needs a rule to compare Beneficiary A's joy against Beneficiary B's pain. If the architect analogy imports a specific weighting rule (e.g., "maximize total floor space"), it begs the question just as the veil does. Ultimately, no analogy solves the interpersonal comparison problem because decision theory is inherently intrapersonal. The argument looks best without an analogy: as a direct moral axiom that social welfare is a function of comparable individual welfares. Drop the veil; it obscures more than it reveals.
