prompt: |-
  Im a PhD student and I've been handed one fifty-minute section next week in our intro Philosophy and Law course — first-years, about a third of them pre-law and the rest there to fill a requirement, whiteboard only, no handouts because the department printer is dead again. The topic is causation by omission: whether someone's failure to do something can be a cause of something happening. Please don't explain the topic to me; tell me how to explain it. What I keep going back and forth on is the order, because my sense is that before the question even means anything to them I have to seperate "did she cause it" from "is she to blame" — the pre-law kids have half-remembered duty and proximate cause from somewhere and will answer a causal question with a responsibility verdict all section if I let them — and also that they need causal claims to be contrastive or interest-relative (why did *these* plants die and not *those*) before an absence can even look like a possible answer. But I can't tell whether those are genuine prerequisites or whether I'm front-loading metaphysics that should come in later, and I'm not sure whether to present the "an omission only counts as a cause against a normative background" line as the live option it is or to hold it back so it doesn't swallow the whole discussion on contact.

  The example is the other thing I'm stuck on. My first thought was the obvious one — a lifeguard who's on her phone and doesn't notice a kid struggling — but it feels saturated with obligation, so I made up a pair instead: two identical greenhouses on the same street, same plants, both need daily watering. Sam is going away and asks her neighbour Priya to water; Priya says yes and then just forgets, all week. In the other greenhouse nobody was ever asked and nobody watered. Same deaths, same absence of water, one has a promise in it and one doesn't. Is that the right thing to carry the whole fifty minutes, or is it still smuggling in a norm when the question is supposed to be about causation? Either way, tell me what the carrying example has to have and what it has to lack. Then there's a case I want to use late: two people each promise Sam they'll water, each assumes the other did, neither does — now the but-for test says neither one caused it. I want that at the end, as a general worry about overdetermination that also afflicts perfectly ordinary actions, but I'm worried it detonates everything I just built, so tell me where it goes and how to frame it so it doesn't.

  The misconceptions I'm braced for: "an omission is nothing, and nothing can't do anything"; "if forgetting can be a cause then everyone who ever failed to water those plants caused their death, up to and including the Queen"; "causation needs a mechanism, a physical connection or a transfer of energy, so an absence can't qualify"; and the sharp one, that the only reason Priya looks like a cause is that she was supposed to water, so really it's blame dressed up as causation. For each, tell me where exactly in the sequence I should head it off and what has to already be on the board for the defusal to work. And give me one question to ask in the last five minutes that would show me whether they'd actually got the idea rather than just learned to say "omission" — plus what I should openly announce I'm not going to settle at this level and why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student, teaching a 50-minute section.
      *   **Course:** Intro Philosophy and Law.
      *   **Students:** First-years (mix of pre-law and gen-ed).
      *   **Constraints:** Whiteboard only (no handouts), 50 minutes.
      *   **Topic:** Causation by Omission.
      *   **User's Knowledge:** Clearly knows the material well (mentions contrastive causation, normative backgrounds, overdetermination, but-for test, physical connection objections).
      *   **User's Struggle:** Pedagogical sequencing (order of operations), example selection (lifeguard vs. greenhouse), managing misconceptions (nothingness, unlimited causes, normativity vs. causation), and wrapping up without exploding the framework (overdetermination).
      *   **Goal:** Don't explain the topic; explain *how to teach it*. Specific advice on sequencing, examples, misconception management, and assessment.

  2.  **Deconstruct the Pedagogical Challenges:**
      *   **The "Blame vs. Cause" Confusion:** Pre-law students conflate *causation* (but-for/proximate) with *responsibility* (duty/breach). This needs to be addressed early, or the discussion collapses into moralizing.
      *   **The "Nothingness" Objection:** Metaphysical hurdle. Omissions aren't events. Needs a pragmatic/contrastive framing to bypass deep metaphysics.
      *   **The "Queen of England" Problem:** Causal selection. If omissions are causes, *all* omissions are causes. Need to limit the field without resorting purely to norms too early.
      *   **The Example:** Lifeguard is too norm-heavy. Greenhouse pair is better but needs careful setup to isolate the causal claim from the promise.
      *   **The Overdetermination Case (Two Promisers):** This is a "killer" case. If handled poorly, it undermines the whole hour. If handled well, it shows the limits of the but-for test.
      *   **Time Management:** 50 minutes is tight. Need a strict timeline.

  3.  **Develop the Strategy (The "How-To"):**

      *   **Sequencing:**
          1.  *Hook/Intuition:* Start with the Greenhouse case.
          2.  *Distinction:* Separate Cause vs. Blame immediately (Whiteboard Column A vs. Column B).
          3.  *Contrastivity:* Introduce the "Why *these* plants?" question to handle the "Queen" objection.
          4.  *Normativity:* Address the "Promise" element *after* establishing causal structure.
          5.  *Overdetermination:* Save the "Two Promisers" for the end as a "limit case," not a definition breaker.
          6.  *Conclusion:* Assessment question + Intellectual Honesty (what we aren't solving).

      *   **The Example (Greenhouse vs. Lifeguard):**
          *   *Verdict:* Stick with the Greenhouse pair. The lifeguard triggers "duty" too hard. The Greenhouse allows a control group (Neighbor B).
          *   *Requirement:* The example must allow *identical physical outcomes* with *different causal descriptions*.
          *   *Avoid:* Don't make the promise the *cause*. Make the promise the *reason we select the omission as relevant*.

      *   **Misconception Management:**
          *   *Nothingness:* Address via contrastivity (we are explaining a difference, not a creation).
          *   *Queen of England:* Address via causal selection/interest relativity.
          *   *Mechanism/Energy:* Acknowledge it, but pivot to legal/pragmatic utility.
          *   *Blame vs. Cause:* Address *first*.

      *   **The Overdetermination Case:**
          *   Frame it as "The But-For Test Breaks," not "Omissions aren't causes." It shows the tool is imperfect, not the concept is wrong.

      *   **Assessment Question:**
          *   Needs to force a choice between causal and normative reasoning.

      *   **Intellectual Honesty:**
          *   Admit that the metaphysics of "nothing" is unresolved, but the *legal utility* is the focus.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Peer-to-peer, respectful of their expertise, focused on pedagogy.
      *   *Structure:* Follow the user's prompt structure (Order/Sequence, Example, Misconceptions, Closing).
      *   *Whiteboard Visualization:* Since they have no handouts, describe what goes on the board.

      *(Self-Correction during drafting)*: I initially thought about suggesting they define "but-for" explicitly. But pre-laws might know it, and gen-eds might get bogged down. Better to use the intuition ("If X hadn't happened, would Y still have occurred?") and write the formula on the board.
      *(Refining the Overdetermination point)*: The user is worried this "detonates" the lesson. I need to reassure them that showing the *limit* of a test is a valuable philosophical lesson in itself. It transitions from "What is causation?" to "How do we use tests for causation?"

      *(Refining the Example)*: The Greenhouse case is good. But make sure the "Neighbor B" (no promise) is clearly established as *not* a cause in the legal sense, even if physically identical. This highlights the normative selection without conflating it with physical causation.

      *(Refining the Misconceptions)*: The "Blame vs. Cause" is the big one. Put that in the first 10 minutes. The "Nothingness" one comes when they resist the idea. The "Queen" one comes when they realize the implications.

  5.  **Final Polish:**
      *   Check timing (50 mins is brutal).
      *   Ensure the "Intellectual Honesty" section is specific.
      *   Make sure the "Assessment Question" is diagnostic.

  6.  **Final Output Generation:** (matches the structure of the provided good response).
      *   **Sequence:** Cause/Blame -> Contrastivity -> Normative Selection -> Overdetermination.
      *   **Example:** Greenhouse is superior. Keep it.
      *   **Misconceptions:** Map them to specific time slots.
      *   **Closing:** The "Gardener vs. Passerby" question.
      *   **Honesty:** Metaphysics vs. Legal Tool.

  *(Self-Correction on the "Normative Background" line)*: The user asks whether to present "omission only counts against a normative background" as the live option. *Advice:* Yes, but frame it as "Causal Selection" rather than "Causal Existence." This preserves the metaphysics while solving the legal problem.

  *(Self-Correction on Overdetermination)*: Frame it as "The But-For Test is Necessary but Not Sufficient." This saves the lesson.

  7.  **Final Review against constraints:** Whiteboard only? Yes. 50 mins? Yes. PhD level advice? Yes.

