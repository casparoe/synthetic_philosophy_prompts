answer: |-
  Here is a battle plan for the fifty minutes. Your instincts are correct: if you don't separate cause from blame in the first ten minutes, the pre-law students will turn the section into a torts seminar, and the gen-eds will get lost in moralizing. If you don't introduce contrastivity early, the "Queen of England" objection will eat you alive.

  ### 1. The Sequence (The Whiteboard Architecture)

  Do not lecture linearly. Build two columns on the board immediately.
  *   **Left Column:** *What happened?* (Physical history)
  *   **Right Column:** *What do we care about?* (Explanatory interest)

  **Minutes 0–10: The Cause/Blame Firewall**
  Start with the Greenhouse case (details below). Ask: "Did Priya cause the plants to die?"
  *   Students will say "Yes, because she promised."
  *   **Stop them.** Write "CAUSATION" on the left and "RESPONSIBILITY" on the right.
  *   Ask: "If Priya had watered them, would they be alive?" (Yes). "If the Queen had watered them, would they be alive?" (Yes).
  *   **The Move:** Establish that *causation* is about counterfactual dependence (the but-for test). *Responsibility* is about duty.
  *   **Why:** You must secure the agreement that physically, Priya's absence and the Queen's absence look the same. If they don't agree to this, you cannot discuss omission as a *causal* category; you'll only be discussing moral duty.

  **Minutes 10–25: Contrastivity and the "Queen" Objection**
  Now introduce the control group (Neighbor B, no promise).
  *   **The Move:** Ask, "Why is Priya's lack of water a cause, but Neighbor B's lack of water isn't, when the physical outcome is identical?"
  *   This is where you introduce **Contrastive Causation**. Write on the board: *Cause of X rather than Y?*
  *   We aren't asking "What caused the death?" (Abstract). We are asking "What caused *these* plants to die *when they were under Priya's care*?"
  *   **Why:** This handles the "Queen of England" objection without needing deep metaphysics. The Queen isn't a cause because she wasn't part of the *contrast class* we are investigating. This validates the intuition that omissions are causes without committing to the idea that *every* omission is a cause.

  **Minutes 25–40: The Normative Background (The "Live Option")**
  Now you can safely introduce the idea that normative expectations select causes.
  *   **The Move:** Don't say "Norms make it a cause." Say "Norms tell us which cause *matters*."
  *   Use the board columns. The physical absence (Left) is the same. The explanatory selection (Right) depends on the promise.
  *   **Why:** This prevents the "Blame dressed as Causation" objection. You are admitting that causal *selection* is interest-relative/normative, while causal *relation* (counterfactual dependence) is not. This satisfies the pre-laws (who need to know why duty matters) without lying to the philosophers (about the metaphysics).

  **Minutes 40–50: The Overdetermination Grenade**
  Save the "Two Promisers" case for here.
  *   **The Move:** Frame this not as "Omissions aren't causes," but as "The But-For Test has a limit."
  *   Write: *But-For Test = Necessary Condition.*
  *   In the two-promiser case, neither is necessary (the other would have failed anyway).
  *   **Why:** This doesn't detonate the lesson; it elevates it. It shows that legal causation is a *tool*, not a law of physics. If the tool breaks, we need a different test (e.g., NESS test or substantial factor), not a denial of omission causation.

  ### 2. The Example: Greenhouses vs. Lifeguard

  **Stick with the Greenhouses.**
  The lifeguard case is too "hot." It triggers immediate moral outrage and legal precedent (special relationship) that short-circuits the causal analysis. The greenhouse case is cold enough to isolate the variables.

  **What the Example Must Have:**
  1.  **Identical Physical Outcome:** Both sets of plants die identically.
  2.  **Identical Physical Absence:** No water entered either greenhouse.
  3.  **Divergent Normative Status:** One agent promised; one did not.
  4.  **Divergent Causal Intuition:** Students must feel Priya is a cause, Neighbor B is not.

  **What the Example Must Lack:**
  1.  **Physical Interference:** Priya must not have *stopped* anyone else from watering. She must have simply done nothing.
  2.  **Exclusive Control:** Be careful here. If Priya had the *only* key, Neighbor B couldn't have watered them anyway. That makes Neighbor B's omission non-causal for physical reasons, not normative ones. Ensure Neighbor B *could* have watered them but wasn't asked.

  **How to Run It:**
  Draw two boxes on the board.
  *   **Box A (Priya):** Promise made -> No Water -> Death.
  *   **Box B (Neighbor):** No Promise -> No Water -> Death.
  *   Ask: "Is the 'No Water' in Box A a cause? Is the 'No Water' in Box B a cause?"
  *   If they say "Both," you have the Queen of England problem.
  *   If they say "Only A," you have successfully isolated the normative selection from the physical event.

  ### 3. Misconception Management

  Here is where to intercept the four specific objections you listed, and what must be on the board to defuse them.

  **1. "An omission is nothing, and nothing can't do anything."**
  *   **When:** Minutes 10–15 (during Contrastivity).
  *   **Board Prerequisite:** The Counterfactual Conditional (*If P had watered, plants would live*).
  *   **Defusal:** Don't argue metaphysics. Argue explanation. "We aren't saying 'nothing' pushed the plants over. We are saying the *explanation* for the difference between 'alive' and 'dead' is the absence of water. We explain events by citing what didn't happen all the time (e.g., 'The car crashed because the brakes didn't work')."

  **2. "If forgetting is a cause, everyone caused it (The Queen)."**
  *   **When:** Minutes 15–20 (during Causal Selection).
  *   **Board Prerequisite:** The Two Columns (Physical History vs. Explanatory Interest).
  *   **Defusal:** "You are confusing *causal candidates* with *the cause*. The Queen is a candidate (counterfactually dependent). She is not selected as *the* cause because she falls outside our contrast class. Causation is a filter, not just a list."

  **3. "Causation needs a mechanism/energy transfer."**
  *   **When:** Minutes 20–25 (before Normative Background).
  *   **Board Prerequisite:** The "But-For" Formula.
  *   **Defusal:** Acknowledge this is the *physicalist* view. Then pivot to the *legal* view. "In law, we care about accountability, not just physics. If we required energy transfer, we couldn't prosecute poisoning (where the poison removes a biological function) or negligence. The law adopts a counterfactual theory, not a mechanistic one."

  **4. "Priya is only a cause because she was supposed to (Blame vs. Cause)."**
  *   **When:** Minutes 0–10 (The Firewall).
  *   **Board Prerequisite:** CAUSATION | RESPONSIBILITY columns.
  *   **Defusal:** "If Priya had watered them, they would live. That makes her omission a cause. The promise makes her *liable*. We are deciding the first column before we touch the second. If we don't, we punish people for things they didn't causally influence."

  ### 4. The Overdetermination Case (Two Promisers)

  **Where it goes:** Last 10 minutes.
  **How to frame it:** Do not present this as "Omissions are weird." Present it as "The But-For Test is incomplete."

  *   **Setup:** "Priya promises. Alex promises. Both assume the other did it. Neither waters. Plants die."
  *   **The Trap:** Apply But-For to Priya. "If Priya watered, would plants live?" Yes. "So she's a cause." Apply to Alex. "If Alex watered, would plants live?" Yes. "So he's a cause."
  *   **The Twist:** "If Priya *hadn't* promised (and Alex still did), would plants die?" Yes (Alex failed). "So Priya isn't a but-for cause."
  *   **The Resolution:** Tell them: "This shows that 'But-For' is necessary for simple cases, but in overdetermination, the law switches to 'Substantial Factor.' This doesn't mean omission isn't causation. It means *causation* is harder to test than we thought."
  *   **Why this works:** It protects your earlier framework. You taught them the standard test; now you are showing them the exception that proves the rule requires nuance. It doesn't detonate the lesson; it makes them feel like they've learned a professional tool's limitation.

  ### 5. The Closing Assessment & Intellectual Honesty

  **The Diagnostic Question (Last 5 Minutes):**
  Write this on the board:
  *"A doctor turns off a life-support machine on a brain-dead patient, following the family's request. The patient dies."*
  Ask: **"Is the death caused by the doctor's action (turning the switch) or the doctor's omission (stopping treatment)?"**

  *   **Why this works:** It forces them to apply the "Normative Background" and "Contrastivity" tools immediately.
      *   If they say "Action," they missed the point of omission causation.
      *   If they say "Omission," ask "Why? Physically she moved her hand."
      *   They need to articulate that the *normative context* (right to refuse treatment) reclassifies the physical action as a permissible omission, which is the cause of death.
      *   **Success looks like:** A student saying, "It's an omission because she wasn't required to keep it on, so the cause is the lack of treatment, not the switch."

  **What to Announce You Are Not Settling:**
  Be explicitly honest about the metaphysics. Say this:
  *"We have treated omissions as causes because the legal system requires us to. We have not solved the metaphysical problem of how 'nothing' can exert force. Philosophers still fight about whether omissions are real events or just linguistic tricks. In this course, we treat causation as a tool for assigning responsibility, not a description of the fundamental fabric of the universe. If you want to know if omissions are *real*, take Metaphysics 400. If you want to know if they *count*, stay here."*

  **Why:** This validates the gen-eds (who feel the metaphysical weirdness) without paralyzing the pre-laws (who need the rule to work). It draws the boundary of the section clearly.
