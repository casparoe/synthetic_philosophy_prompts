answer: |-
  Good morning, everyone. Welcome to 'Collective Minds?'. It's genuinely lovely to see such a mix of faces around the table—roughly half of you spend your days waist-deep in ant colonies, and the other half spend yours waist-deep in the literature on consciousness. Having those two groups in the same room is precisely the point.

  I've been asked to kick us off, and I want to use these few minutes to set a specific philosophical constraint on our discussions, rather than just offering a warm welcome. I want us to take Douglas Hofstadter's 'ant-fugue' thought experiment seriously. You know the one: the idea that a colony of ants, organised into complex symbolic structures, might literally constitute a single subject—'Aunt Hillary'—rather than merely simulating one.

  The reason I want this to do structural work today is that it constrains how we speak. It is very tempting, even for us biologists, to slip into shorthand. We might say an ant 'decides' to forage, or that the colony 'chooses' a new nest site. But if the Aunt Hillary hypothesis is live, that language is potentially misleading in both directions. If the colony is the subject, the individual ant isn't deciding anything any more than a neuron decides to fire. But conversely, if the colony is *not* a subject, then attributing agency to the collective is just a metaphor.

  So, for the next two days, I'd like us to hold that tension. We shouldn't cheerfully assume the colony is just a bag of individuals, but nor can we declare it a unified conscious entity. That is exactly what is up for grabs.

  This brings me to a slightly niche twist I'd like us to keep in mind. If there is a collective mind here, it is unlikely to look like a central controller. There is no little ant sitting in the queen's chamber pulling levers. Instead, we might think of collective cognition as a kind of recursive echo. It's distributed feedback loops that only look intentional from the outside.

  There is some emerging, cautious talk connecting this to predictive processing. The suggestion is that the colony, as a system, might act to minimise surprise across its network, regulating internal states against environmental perturbations. But please, let's treat this as a provocative model, not a settled fact. We don't yet know if the maths of predictive processing maps onto pheromone trails in a way that sustains genuine cognition, or if it's just a useful analogy.

  This means we need to be rigorous about separating our ground. What is well-established is that colonies solve complex problems through distributed signalling. We know the mechanisms of task allocation and communication are robust. What is genuinely contested is whether those mechanisms amount to a unified phenomenology. Does Aunt Hillary feel like anything? Does the fugue analogy survive objections about the lack of a unified perspective?

  I mention this because I want this workshop to be a space where we can admit when we don't know. When a biologist says 'the colony knows where the food is,' and a philosopher asks 'in what sense?', that friction is where the progress happens. We aren't here to resolve the hard problem of consciousness by Tuesday afternoon, but we are here to ensure our categories are sharp enough to cut reality at the joints.

  So, let's be careful with our attributions of agency. Let's be cautious with our models of prediction. And let's enjoy the uncertainty.

  Thank you for coming. I'm going to hand over to our first speaker now.
