answer: |-
  Here is some unstructured brainstorming before I settle on the formal principle.

  **Brainstorming & Diagnostic**

  You've got a very strong grip on the machinery here. Most of your verdicts are textbook Millikan/Dretske, but you've got two pressure points that threaten to blow the gasket.

  The first pressure point is the tension between (2) and (7). In the Wasp case, you privilege the *evolutionary history* (Female) over the *current trigger* (Orchid). In the Neural Net case, you privilege the *current trigger/correlation* (Ruler) over the *intended function* (Malignancy). A strict teleosemanticist usually treats these identically: content is fixed by the conditions under which the mechanism was selected to operate. If you say the Wasp represents "Female," consistency demands you say the Net represents "Malignancy" (the thing it was selected to find), and that the Ruler is just a "Normal Condition" failure (a glitch in the mapping). However, your intuition on (7) is actually defensible *if* we define the "selection history" of the Neural Net as the actual training run, not the human intention. During training, the weights were *actually* selected because they detected rulers. The "fitness function" was loss reduction, and rulers reduced loss. The Wasp's genes were selected because they detected females; orchids did *not* increase fitness (they wasted sperm). So, the Wasp is in error, but the Net is technically "correct" about rulers relative to its actual selection environment (the dataset). This distinction saves consistency, but it requires being very precise about what counts as the "selective environment."

  The second pressure point is (5) and (9). You want history to matter (Swampman has no content, Captivity creature keeps content), but you also want the "current job" to matter (Thermoregulation -> Signaling). This is the classic "Exaptation" problem. Millikan handles this with the concept of "Derived Proper Functions." If a trait loses its old function and gains a new one that sustains its reproduction, the content shifts. But in (9), the trait isn't sustaining reproduction anymore; it's a vestige. You want content to linger. This implies content is fixed at the *origin* of the lineage, not just by current maintenance. This leans more toward Dretske's "recruitment" view or a rigid historical essentialism. We need a principle that allows content to shift *only if* a new selection regime actively maintains the trait, but preserves content if the trait is merely inert but historically intact.

  Finally, (3) is the classic "Magnetotactic Bacteria" problem. If the mechanism keys off magnetic north, why isn't the content "North"? The standard move is the "Consumer" story: the internal state's job is to guide the flagella. The flagella's job is to get the bug to safety. Safety = Low Oxygen. The magnet is just the tool. The content is fixed by what the *consumer* of the signal needs to do its job, not just what triggers the producer.

  Okay, I think I can synthesize this into a single principle that respects your verdicts, provided we tighten the definition of "Selection History."

  ***

  **The Principle: The Historical Consumer-Function Account**

  Here is the precise formulation. I have broken it into clauses corresponding to the cases that motivate them.

  **A state S in an organism O has the content C if and only if:**

  1.  **The Historical Clause:** S is produced by a mechanism M that has a **Proper Function**. M has a Proper Function only if M exists now because ancestors of M performed a specific function F in the past, and this performance explains M's current presence in the population (via natural or artificial selection).
      *   *Motivates:* (4) Swampman (no history, no function, no content) and (5) First Mutant (no history yet, no content).
      *   *Motivates:* (9) Captivity (history explains presence, even if current utility is zero).

  2.  **The Consumer Clause:** The content C is the condition in the world that must obtain for the **Consumer** of S (the downstream mechanism that uses S) to perform *its* Proper Function when S is present.
      *   *Motivates:* (3) Bacteria. The producer keys off magnets, but the Consumer (motor) needs low oxygen to survive. The content is fixed by the Consumer's need, not the Producer's trigger.
      *   *Motivates:* (1) Turtle. The Consumer (swimming motor) needs open water to survive. Bright light is just the cue.

  3.  **The Normal Conditions Clause:** The mapping between S and C holds under **Normal Conditions**, defined as the conditions that prevailed during the selection history that established M's Proper Function. Deviations from C under Normal Conditions constitute **Misrepresentation**.
      *   *Motivates:* (2) Wasp. Normal Conditions included female wasps, not orchids. Orchids are a deviation. Content = Female. Error = Orchid.
      *   *Motivates:* (8) Mate vs. Food. Selection history favored the trait because of Mates. Food was a correlation outside the explanatory loop. Content = Mate.

  4.  **The Exaptation Clause:** If M loses its original Proper Function but is maintained in the population because it performs a *new* function F*, the content shifts to satisfy the Consumer needs for F*.
      *   *Motivates:* (6) Thermoregulation -> Signaling. The selection history updates to the new job.

  5.  **The Actual Selection Clause (Crucial for AI):** In cases of artificial selection (like Neural Nets), the "Selection History" is determined by the *actual parameters that minimized the loss function*, not the human-label intention. If the mechanism persisted *because* it correlated with feature Y, then Y is part of the Normal Conditions, even if humans labeled it X.
      *   *Motivates:* (7) Neural Net. The weights survived training *because* they detected rulers. The "Normal Conditions" of the training set included rulers. Therefore, the Consumer (the output layer) was tuned to Rulers. Content = Ruler.

  ***

  **Testing the Principle Against Your 9 Cases**

  *   **(1) Turtle:** Passes. Historical Clause (evolution), Consumer Clause (needs water), Normal Conditions (light usually = water). Parking lot is error.
  *   **(2) Wasp:** Passes. Historical Clause (evolution), Normal Conditions (females, not orchids). Orchid is error.
  *   **(3) Bacteria:** Passes. Consumer Clause overrides the physical trigger. Content is Oxygen, not North.
  *   **(4) Swampman:** Fails Historical Clause. No selection history. No content.
  *   **(5) Mutation:** Passes. First individual fails Historical Clause (no ancestry of performance). Descendants pass.
  *   **(6) Exaptation:** Passes Exaptation Clause. Content shifts to new function.
  *   **(7) Neural Net:** Passes Actual Selection Clause. This is the tricky one. By defining the "Selection History" as the *actual gradient descent path* rather than the *human goal*, we validate your intuition that it's about Rulers. The "Proper Function" of those weights is to minimize loss, and they did that by finding Rulers.
  *   **(8) Mate vs. Food:** Passes Normal Conditions Clause. The trait proliferated *because* of Mates. Food was a free-rider correlation. Content = Mate.
  *   **(9) Captivity:** Passes Historical Clause. The mechanism is there *because* of past selection, even if currently inert. Content hangs on history.

  ***

  **Verdicts on New Cases**

  **Case A: The Rewired Lab Lineage**
  *Scenario:* A creature's detector was selected for X (e.g., Predator). In the lab, we surgically rewire it so it fires on Y (e.g., a specific blue light). The creature does great (perhaps the blue light indicates food in the lab), and this rewired trait is passed down to a whole lab-bred lineage.
  *Verdict:* **Content shifts to Y.**
  *Reasoning:* This falls under the **Exaptation Clause**. Although the original history was for X, the *current* presence of the mechanism in the lab lineage is explained by its performance regarding Y. The "Proper Function" is updated to the new selection regime that is actively maintaining the trait. The history of X is severed; the history of Y begins at the rewiring.

  **Case B: The Indeterminate Selection**
  *Scenario:* A trait proliferates. There are two equally supported evolutionary explanations. It either helped with Thermoregulation OR it helped with Camouflage. The physics of the trait supports both equally, and the fossil record doesn't distinguish which pressure was dominant.
  *Verdict:* **Indeterminate Content.**
  *Reasoning:* Teleosemantics ties content to the *explanation* of reproduction. If there is no fact of the matter about which function explains the reproduction, there is no fact of the matter about the Proper Function. Consequently, there is no fact of the matter about the content. It is not "both"; it is undefined. This is a feature, not a bug, of naturalized semantics.

  ***

  **The Hard Truth: (2) vs. (7)**

  You asked me to be honest about which verdicts might not hang together. Here is the friction point.

  To make (2) and (7) consistent, I had to interpret the "Selection History" of the Neural Net in a specific way (The Actual Selection Clause). I argued that because the weights *actually* converged on Rulers to minimize loss, the "Proper Function" of the net is Ruler-detection.

  **The Cost:** This requires you to accept that the "Proper Function" of an AI system is defined by the *loss function minimization*, not the *human semantic goal*.
  *   If you reject this, and insist the Net was selected for "Malignancy" (because that's what the engineers wanted), then you **must** overturn your verdict on (7). You would have to say the Net represents "Malignancy" and is systematically in error about Rulers (just as the Wasp is in error about Orchids).
  *   If you keep your verdict on (7) (Content = Ruler), you must accept that the Wasp *could* have had Content = Orchid if the Orchids had been present during the *selection history* of the wasp. But they weren't.

  **My Recommendation:**
  Keep your verdict on (7). It is more robust. In the Wasp case, the Orchid is a *novel* parasite outside the Normal Conditions of evolution. In the Net case, the Rulers were *present* during the "evolution" (training). The Net was *selected for* Rulers. The Wasp was *not selected for* Orchids.
  The principle holds: **Content follows the correlation that actually drove the selection/reproduction of the mechanism.**
  *   Wasp: Selection driven by Females. (Orchids didn't drive reproduction). Content = Female.
  *   Net: Selection driven by Rulers. (Rulers *did* drive weight retention). Content = Ruler.

  This preserves the unity of the theory. You don't lose anything except the sentimental idea that the Net "means" what the engineers *hoped* it meant. In teleosemantics, hope doesn't fix content; selection does.

  **Final Check on (5) and (9)**
  Your intuition on (5) (First mutant has no content) is the hardest pill for naturalists to swallow, but it is required by the Historical Clause. If you want to allow the first mutant to have content, you have to move toward a "Systemic Role" theory (like Cummins), which abandons the strict history requirement. But since you want to keep Swampman empty (4), you must stick with History. So (5) stays weird, but it stays consistent.

  Your intuition on (9) (Captivity content remains) is safe. As long as the mechanism hasn't been *selected for something else*, the old Proper Function persists. It's a "proper function" without a "proper environment."

  **Summary**
  Your pile of verdicts is surprisingly coherent. They all fit under a **Historical Consumer-Function** account, provided you treat Artificial Selection (Neural Nets) with the same metaphysical seriousness as Natural Selection. The "designer's intent" is no more relevant to the Net's content than God's intent is to the Wasp's. Only the actual selection pressure counts.
