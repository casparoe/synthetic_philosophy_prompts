answer: |-
  Your teacher is not actually a moral relativist. If she were, she could not consistently condemn factory farming or the exclusion of girls from school, because in both cases, the prevailing local culture accepts the practice. A strict relativist believes the moral truth is *created* by the culture's approval.

  Instead, your teacher is operating as a **Context-Sensitive Universalist** (likely a Liberal Humanist or Capabilities Theorist). She uses the word "relative" to mean "context matters for interpretation," not "context determines truth."

  Here are the four hidden rules driving her verdicts, the prediction for the upcoming case, and the test case to expose her actual framework.

  ### 1. The Hidden Rules
  Based on her verdicts, she is applying these four principles consistently:

  *   **Rule 1: The Moral/Conventional Distinction.**
      *   *Logic:* Some cultural differences are just "manners" (etiquette), while others are "morals" (harm/rights).
      *   *Evidence:* Refusing a gift is just manners (not wrong). Eating dog is a moral difference but harmless (not wrong).
  *   **Rule 2: The Harm/Autonomy Threshold.**
      *   *Logic:* Cultural practices are permissible *unless* they cause objective harm (suffering) or violate basic autonomy (freedom/opportunity).
      *   *Evidence:* Factory farming causes suffering (wrong). Keeping girls out of school violates autonomy/opportunity (wrong).
  *   **Rule 3: The "False Consciousness" Clause.**
      *   *Logic:* Local acceptance or happiness does not justify harm. People can be socialized to accept their own oppression.
      *   *Evidence:* Girls/parents being "happy" with no school doesn't settle it; people "get used to stuff." Factory farming being "normal" doesn't fix it.
  *   **Rule 4: The Ethnocentrism Check.**
      *   *Logic:* We cannot judge a practice solely because it is *different* from ours; we must judge it based on harm.
      *   *Evidence:* Eating dog is okay because judging it would be ethnocentric (no clear harm), whereas factory farming is wrong even though it is *our* norm.

  ### 2. Prediction: The Painful Ritual Case
  **Verdict:** She will likely rule this **Wrong**.

  **Why?**
  *   **Harm:** It involves physical pain. Under Rule 2, pain requires justification.
  *   **Autonomy:** It involves children. Even if the kids "consent," she will apply Rule 3 (False Consciousness). She will argue that children in an isolated community cannot give valid informed consent because they don't know alternatives, and adults who underwent it are biased survivors ("it made them who they are" is exactly the kind of rationalization she rejected in the girls' school case).
  *   **Cohesion is not enough:** She will argue that "community bonding" is not a sufficient reason to inflict pain on minors, just as "economic efficiency" isn't a sufficient reason for factory farming.

  **The Only Exception:** She might allow it *only if* she can be convinced the pain is temporary/symbolic (like a vaccine or a tattoo) rather than damaging (like mutilation). But given her stance on the girls' school, she is skeptical of "tradition" overriding well-being.

  ### 3. The Test Case
  To figure out which rule is her *primary* driver, you need to separate **Harm** (pain is bad) from **Autonomy** (choice is good). Her verdict on the ritual relies on both (kids + pain). You need a case that has one but not the other.

  **Throw this case at her:**
  > "Imagine an isolated community of **consenting adults**. They voluntarily undergo a painful, scarring ritual to join the leadership. Everyone knows the pain beforehand, no one is forced, and it holds their society together. Is this wrong?"

  **How to interpret her answer:**

  *   **If she says "It's Wrong":**
      *   **Her Rule is Objective Harm.** She believes pain/suffering is intrinsically bad, even if chosen. This means she is a **Paternalist**.
      *   *Implication:* She condemns the ritual because *pain* is bad, not just because they are kids.
  *   **If she says "It's Okay":**
      *   **Her Rule is Autonomy/Consent.** She believes adults can choose to endure pain for meaning.
      *   *Implication:* She condemns the *kids'* ritual specifically because they are **minors** (Rule 2: Protection of Vulnerable), not because the ritual itself is inherently evil. This makes her a **Liberal**.
  *   **If she says "It depends on the pain level":**
      *   **Her Rule is Capabilities.** She is weighing whether the ritual enhances or diminishes their ability to function (Nussbaum's Capabilities Approach).
      *   *Implication:* She is a **Soft Universalist** who balances cultural value against physical cost.

  **Why this works:**
  This case removes the "False Consciousness" variable (since they are consenting adults) and the "Ethnocentrism" variable (since it's isolated). It forces her to choose between **Respect for Choice** and **Prevention of Suffering**. This distinguishes whether her objection to the girls' school was about *lack of choice* or *loss of opportunity*, and whether her objection to the ritual will be about *age* or *pain*.
