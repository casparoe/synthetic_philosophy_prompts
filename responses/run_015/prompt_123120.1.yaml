answer: |-
  You are right to feel that the existing literature misses this specific carving. The standard "When in Rome" debates focus on the visitor's duty to *adapt*, not the visitor's power to *alter*. The development economics literature touches on "aid dependency" or "distortion," but that is macro-level and intentional. The game-theory literature on norms (Bicchieri, Elster, etc.) focuses on how norms sustain themselves, not how they are hijacked by transient agents.

  There is no established single term for this. The closest existing concepts are **pecuniary externalities** (where one agent's transaction changes prices for others) and **norm diffusion**, but neither captures the crucial element of *transience* combined with *insulation from consequences*.

  Since you asked for a carving rather than a label hunt, I propose we coin this:

  ### **Unaccountable Norm Seeding (UNS)**

  **Definition:** *A causal structure in which a transient agent introduces a behavioral standard into a local equilibrium, shifting the baseline expectations of permanent residents, while remaining insulated from the long-term costs or consequences of that shift.*

  Here is the carving you asked for, separating UNS from the adjacent concepts you listed.

  ### 1. The Carving (Distinctions)

  *   **(a) Vs. Complicity:** Complicity requires an existing structure you are joining. UNS is *generative*. The visitor is not participating in a bad practice; they are inadvertently funding the creation of a new one. The moral geometry is not "joining the crowd" but "being the first pebble in the avalanche."
  *   **(b) Vs. Inefficacy:** The inefficacy literature (e.g., Nefsky, Lawson) puzzles over how individual acts contribute to harm when no single act seems to make a difference. In UNS, every individual act *does* make a difference (the server gets the money, the vendor gets the profit). The harm is not in the act's inefficacy, but in its *efficacy* accumulating without feedback.
  *   **(c) Vs. Free Riding:** Free riding is taking a benefit without paying. UNS is *over-paying* to create a benefit that becomes a burden. It is the inverse: **Forced Riding**. The locals are forced onto a new track they didn't choose.
  *   **(d) Vs. Threshold Dynamics:** Threshold models (Schelling, Granovetter) explain *how* norms flip. UNS explains *who* triggers the flip and *why* they don't care. Standard threshold models assume the agents are part of the population that must live with the result. UNS isolates the *trigger* from the *population*.

  ### 2. The Edge Cases

  **Does it matter that the visitor leaves?**
  Yes. This is the defining feature of UNS. If the visitor stays, they become subject to the new norm (e.g., they now have to tip everyone else, or pay inflated prices). This "skin in the game" normally regulates behavior. The *exit* creates the **Accountability Gap**. If the agent is permanent, it's just "Norm Entrepreneurship." If they are transient, it's UNS.

  **Does visibility matter?**
  No. This is a crucial distinction from standard norm enforcement. If you tip via an app and no one sees, but the server's expectation of income rises, UNS has occurred. The mechanism is not *social pressure* (others seeing you); it is *preference adaptation* (the recipient adjusting their baseline). The "audience" is the recipient, not the peer group.

  **What about "good" norms (queuing, anti-bribery)?**
  This is the test of whether UNS is a moral category or a causal one.
  *   **Causal View:** The mechanism is identical. You shifted the equilibrium without accountability.
  *   **Moral View:** We praise the queuing visitor because the *outcome* increases local welfare (efficiency). We blame the tipping visitor because the *outcome* decreases local welfare (wage instability).
  *   **The Carving:** UNS is a **structural category**. It becomes a **moral category** only when paired with a theory of value (e.g., utilitarianism) or a theory of rights (e.g., local self-determination).
      *   *However*, there is a deontological argument: Even if the norm is "better" (queuing), UNS violates **Local Sovereignty**. The locals did not choose to change. The visitor imposed a change without bearing the risk. Therefore, UNS is *pro-tanto* morally suspect, even when the outcome is beneficial, because it treats the local culture as a sandbox rather than a sovereign system.

  **Is anything owed afterwards?**
  If you accept UNS as a moral category, then **yes**. If you trigger a norm shift you don't have to live with, you incur a debt to those who do.
  *   *Compensation:* In the tipping case, the visitor has effectively promised the server a wage supplement they cannot guarantee. The "debt" is the uncertainty introduced.
  *   *Restraint:* The stronger obligation is prospective. Once you recognize yourself as a potential UNS agent (a wealthy tourist in a low-cost economy), you have a duty to *match local signals*, not home signals.

  ### 3. The Core Question: Moral or Causal?

  You asked: *"Is this a moral category at all, or just a causal one that we only notice when we disapprove of the norm that got exported?"*

  This is the pivot point. I argue it is **both**, but in different layers.

  **Layer 1: Causal (The Mechanism)**
  Mechanically, UNS is neutral. It describes a specific type of market/social failure: **Asymmetric Signal Injection**. The visitor sends a "price" or "behavior" signal that is decoupled from the local cost-of-living or social contract. This is purely descriptive.

  **Layer 2: Moral (The Accountability Gap)**
  However, the *asymmetry* itself carries moral weight. In most moral frameworks, **accountability** is a prerequisite for legitimate intervention.
  *   If I change the rules of a game I am playing, I must be subject to the new rules.
  *   If I change the rules and then leave the table, I am acting as a **dictator**, not a player.

  Therefore, UNS is a moral category because it describes a **violation of reciprocity**. The visitor extracts the moral satisfaction of being "generous" or "polite" (by their own lights) without purchasing the risk that comes with that generosity. They privatize the virtue (feeling good about tipping) and socialize the risk (wage instability for locals).

  **Conclusion on the Valence**
  We praise the queuing visitor and blame the tipping visitor not just because of the outcome, but because:
  1.  **Queuing** usually lowers transaction costs for everyone (Pareto improvement).
  2.  **Tipping** usually creates wage dependency and price distortion (Pareto deterioration for some).

  But if a visitor started a queue that *slowed everyone down* (e.g., a complex, polite ritual queue), and then left, we should blame them just as we blame the tipper. The "goodness" of the norm doesn't excuse the **Unaccountable Seeding**.

  ### Summary Definition for Your Use

  If you need to use this in conversation or writing, here is the precise formulation:

  > **Unaccountable Norm Seeding:** The introduction of a behavioral or economic standard by a transient agent that shifts the local equilibrium, characterized by the agent's immunity to the long-term consequences of that shift. It is distinct from cultural imperialism (lack of intent) and free-riding (over-contribution rather than under-contribution). Its moral weight derives from the asymmetry between the agent's power to change the system and their insulation from the system's subsequent performance.

  You are chewing on a genuine gap in the literature. It sits at the intersection of travel ethics, development economics, and norm theory. The "Exit-Externality" is the specific mechanism that makes it distinct from standard norm diffusion.
