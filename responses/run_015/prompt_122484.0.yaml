answer: |-
  Dear colleague, it is a pleasure to engage with this pivot in your thinking, and I find your intuition here deeply sympathetic, particularly given your background in systems where physical constraints obviously dictate outcomes regardless of observation. You are asking for the exposure points of your view, the conditions under which it would have to be surrendered, and I think the place to start is with the unease you already feel about the paraphrase working too well. The most fatal defeater for your position would be if it turned out that the re-description test is logically incapable of failing, which would render it trivial. If every historical explanation can be construed as requiring a non-human element because even human beliefs depend on brains and brains depend on biology, then your test grants participant status to everything from microbes to moon phases, and the distinction between participant and scenery collapses. For your view to be wrong in the strongest sense, it would have to be true that there is no explanatory gain in distinguishing between a cause that operates through human meaning and a cause that operates despite it. If the difference is merely tonal, as you worry, then you have not escaped determinism but merely softened its edges, and the view becomes pernicious because it claims a distinction where there is only a continuum of causal chains. A defender of your position must concede that if the test cannot identify a single case where the paraphrase fails, the test is broken, but they should rightly brush off the demand that the non-human cause operate in total isolation from human perception, since history is by definition a human record. The fatal error would be insisting that a non-human actor must be unmediated, whereas the viable position is that it must be irreducible.

  Less fatal but still deeply awkward would be the instability of what counts as the best available explanation. Since historiography shifts, what looks indispensable today might look like scenery tomorrow as new archives open or new social theories emerge. If the ontological status of a volcano depends on the current fashion in historical theory, then your test makes reality contingent on historiography, which is an uncomfortable pill for a scientist to swallow. You would have to concede that your test is epistemic rather than ontological, telling us about our explanations rather than the world itself, but you can brush off the worry that this makes it arbitrary, provided you anchor the test in physical constraints that remain constant even if our descriptions of them change. Another awkward defeater is the problem of pre-emption. If a volcanic eruption causes a crop failure, but the community migrates because they believe the gods are angry rather than because they are hungry, the human belief pre-empts the physical cause in the explanatory chain. If this happens often enough, the non-human cause recedes into a trigger rather than a participant. You must concede that in many micro-histories the paraphrase will succeed, but you can brush off the implication that this invalidates the macro-historical claim, since aggregate outcomes often revert to physical constraints even when individual actions do not.

  Regarding your specific collapse worries, the triviality objection holds only if you cannot draw a line where the paraphrase definitively fails. You need a case where the human meaning is present but insufficient to account for the outcome. The pernicious determinism worry holds only if you claim the non-human cause dictates the specific outcome rather than constraining the field of possible outcomes. You are not arguing that the volcano decides the policy, but that the volcano removes certain policies from the realm of the physically possible. If you can maintain that distinction, you avoid hard determinism. As for the concrete case you requested, consider the demographic collapse of the Black Death in fourteenth-century England. The explanatory work done by Yersinia pestis here is irreducible to human belief. While people interpreted the plague as divine wrath or miasma, and their responses were mediated by those beliefs, the subsequent rise in real wages and the breakdown of serfdom cannot be paraphrased away into a story about what peasants believed or wanted. The Statute of Laborers attempted to freeze wages by force of law and human decree, but it failed repeatedly over decades. The explanation for this failure requires the physical absence of laborers. No amount of belief in the legitimacy of feudalism could resurrect the dead workers. The bacterium created a physical constraint on the economic system that human meaning could not override. You cannot retrodict the wage surge solely from the beliefs of the survivors; you must mention the mortality rate caused by the pathogen. Here the non-human cause is not scenery, because the scenery changed the structural limits of the stage itself, forcing the actors to improvise in ways their script did not allow.

  This leads to the verdict on falsifiability. Your test is not falsifiable in the strict sense of a laboratory hypothesis because you cannot rerun history with the volcano removed to see if the outcome changes. However, it is not thereby unfalsifiable in a way that renders it useless. It is falsifiable in the sense that if historians can successfully construct a complete explanation of the Black Death's economic consequences using only social relations and beliefs, without referencing the demographic shock, your test fails. The risk is that you might qualify the test so heavily that no such explanation could ever count as complete, which would protect the view at the cost of making it vacuous. For a view of this kind, this is not a fatal problem but a permanent tension. Philosophical claims about explanation often reside in this space where they are judged by their utility and coherence rather than by knockout empirical refutation. The danger is not that the test is unfalsifiable, but that it becomes a mere restatement of the claim that physical reality matters, which no one denies, whereas your ambition is to show that physical reality matters in a specific explanatory way that is distinct from human agency.

  So, to answer your question directly on what would have to be true for the view to be wrong: it would have to be true that every historical outcome attributed to a non-human cause could be fully explained by the internal logic of human beliefs and decisions, such that the physical event was merely an occasion and not a constraint. It would also have to be true that the distinction between constraint and determination is illusory, meaning that any physical constraint inevitably dictates the human response sufficiently to erase agency. If you find that the paraphrase works even in the case of the Black Death wages, or that the failure of the Statute of Laborers can be explained solely by shifting class consciousness without reference to population density, then your test collapses. But if you hold that there are physical limits that belief cannot transgress, then your view stands, provided you accept that the non-human participates by setting the boundaries of the possible rather than writing the script. Your unease about the paraphrase working too well is likely a sign that you are looking at cases where the physical constraint was loose enough for human meaning to dominate, which is exactly what your test should predict. The test is not wrong because the paraphrase often works; it is only wrong if the paraphrase always works. Given your career in geosciences, you know that boundary conditions often sit quietly until they suddenly do not, and I suspect your philosophical intuition is tracking that same reality, where the non-human waits in the wings until the human script runs up against a wall it cannot talk its way through.
