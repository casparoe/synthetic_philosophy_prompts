  **Tier 2: Moderate**
  **(1) Democratic self-determination by existing residents over local land-use rules:** This ground is moderate because procedural self-governance holds moral weight but is ethically constrained when it infringes upon the regional right to housing or freedom of movement.

  **Tier 3: Weak**
  **(3) Preservation of neighborhood character as a collective cultural good:** This ground is weak because subjective aesthetic preferences and cultural continuity generally yield to the fundamental human necessity of shelter in moral prioritization.
  **(2) Protection of property values as investment-backed expectations:** This ground is weak because protecting private asset inflation from market competition constitutes an economic interest rather than a defensible moral right against societal needs.

  **Tier 4: Incoherent**
  **(5) An intergenerational trustee argument that present residents hold an obligation to preserve affordable housing stock for future in-migrants rather than to exclude them:** This ground is incoherent because its stated normative duty to avoid exclusion logically precludes using it to justify blocking construction that facilitates in-migration.

  ***

  **Conflated Grounds:** Grounds **(2) Property Values** and **(3) Neighborhood Character** are most frequently conflated in public NIMBY discourse.

  **Distortion of Policy Evaluation:** Homeowners often recast financial anxieties about asset depreciation as concerns about aesthetic or cultural loss, which obscures the distributional conflict and makes exclusionary policies appear altruistic rather than self-interested, thereby hindering honest debates about supply and affordability.
