answer: |-
  You have correctly identified that "entrenchment" is too broad a bucket. In legal theory and constitutional design, the three situations you describe are distinct problems with distinct names and distinct solutions. They all stem from the same root cause: **you have placed your meta-rules (the rules about rules) on the same logical level as your object-rules (the rules about games).**

  When the "Rule to Change Rules" is just Rule 12 in a list of 30, you create a flat hierarchy where a temporary majority can rewrite the foundation of the group's authority.

  Here is how I would cut up these three cases, the specific names for the logical traps, and how to handle them in your rewrite.

  ---

  ### Case 1: Asymmetric Entrenchment
  **The Technical Name:** *Procedural Asymmetry* or *Unilateral Entrenchment.*

  You asked if the problem is simply that the bar for getting out is higher than the bar for getting in. **Yes.** That is the specific moral hazard.

  *   **Hard-In / Hard-Out (2/3 to pass, 2/3 to remove):** This is a **Protected Rule**. It is not inherently problematic. It signals that the group considers this rule foundational. It treats the current majority and the future majority equally (both need 2/3).
  *   **Hard-In / Easy-Out (2/3 to pass, 1/2 to remove):** This is an **Experimental Rule**. It is also not inherently unfair. It makes the rule easy to discard if it turns out to be bad. It privileges the future majority, which is generally considered democratic.
  *   **Easy-In / Hard-Out (1/2 to pass, 2/3 to remove):** This is **Unilateral Entrenchment**. This is the "cheat" you felt in the first case. It allows a transient majority (51%) to bind all future majorities (up to 66%). It violates the **Principle of Continuity**: the idea that a current group cannot permanently diminish the sovereignty of a future group.

  **The Boundary Case:**
  Imagine a rule that says, "This rule can never be changed." That is absolute entrenchment. In law, this is often deemed void because a sovereign body cannot destroy its own sovereignty. In your group, it creates a "dead hand" problem where past players control future players.

  **Recommendation for the Binder:**
  You need a **Hierarchy Clause**. Separate your binder into "Constitution" (Meta-Rules) and "Bylaws" (House Rules).
  *   *Forbidden:* No Bylaw may alter the procedure for amending the Constitution.
  *   *Forbidden:* No rule may impose a higher voting threshold for its own removal than was required for its adoption (unless that higher threshold is already in the Constitution).

  ### Case 2: Rule Identity and Temporal Entrenchment
  **The Technical Name:** *The Continuity Problem* (specifically regarding *Amendment vs. Re-enactment*).

  This is not the same phenomenon as Case 1. Case 1 is about *vote thresholds*; Case 2 is about **Rule Identity**.

  The "one-word trick" works because your rules rely on **Formalism** (the literal text) rather than **Intentionalism** (the substance of the rule). When you changed one word, formally it became a "new" rule (Rule 12-B), so the "one-year clock" reset. Substantively, it was still Rule 12.

  **Is it a different issue?**
  Yes. Case 1 is about *power dynamics* (majority vs. supermajority). Case 2 is about *drafting loopholes* (definition of "same rule").

  **The Boundary Case:**
  If you change a rule from "No running" to "No sprinting," is that a new rule? If you change "No running" to "Running allowed on Tuesdays," is that a new rule?
  *   *Safe Boundary:* If the *legal effect* of the rule remains substantially the same, the "age" of the rule carries over.
  *   *Unsafe Boundary:* If the change alters the core obligation, it is a new rule.

  **Recommendation for the Binder:**
  You need a **Substantive Continuity Clause**.
  *   *Drafting:* "For the purpose of time-based restrictions, an amended rule retains the original adoption date of the rule unless the amendment substantively alters the rule's effect. Trivial changes (grammar, formatting, clarifying language) do not reset the clock."
  *   *The "Poison Pill" Fix:* Alternatively, forbid time-based entrenchment entirely. It is notoriously difficult to enforce without a judge. It is cleaner to say: "No rule may become harder to amend over time."

  ### Case 3: The Transition Paradox
  **The Technical Name:** *The Transitory Problem* (or *Inter-temporal Conflict of Laws*).

  This is the distinct animal you suspected it was. This is not about fairness; it is about **Logical Validity**.

  In your third case, you encountered a logical crash.
  *   Old Rule: "Changes need 2/3."
  *   New Proposal: "Changes need 1/2."
  *   Vote: 60%.

  If the Old Rule counts the vote, the proposal fails. If the New Rule counts the vote, the proposal passes. But the New Rule *does not exist yet* until the vote passes. Therefore, the Old Rule must count the vote.

  **Is it in the same family?**
  No. Cases 1 and 2 are about *abuse of power*. Case 3 is about *incoherence*. It is a bug in the system's logic, not a feature of its politics.

  **The Standard Solution:**
  In constitutional law, this is settled: **The existing procedure governs the adoption of the new procedure.** You must climb the ladder to change the ladder. If the Old Rule requires 2/3, you need 2/3 to lower it to 1/2. If you only have 60%, the proposal fails.

  **Recommendation for the Binder:**
  You need an **Explicit Transition Clause**. Do not leave this to interpretation.
  *   *Drafting:* "Any proposal to amend the rules for changing rules must pass according to the voting threshold *currently in effect* at the time of the vote. The new threshold applies only to proposals made after the amendment has passed."

  ---

  ### Summary: How to Rewrite the Binder

  You suspect these are different patterns because they are. To fix this, you need to introduce **Hierarchy**. As long as Rule 12 (Change Rules) is equal to Rule 5 (No Beer on the Table), you will keep having these problems.

  **1. Create a "Constitution" Section.**
  Move the "Rule to Change Rules" out of the numbered list of house rules. Put it in a preamble or Section 1.
  *   *Why:* This establishes that the *process* is more important than the *content*.

  **2. Forbid Asymmetric Entrenchment (Fixes Case 1).**
  *   *Clause:* "No rule may require a higher voting threshold for its own repeal or amendment than was required for its initial adoption."
  *   *Exception:* "Except for rules designated as 'Constitutional,' which require a [Supermajority] for both adoption and repeal."

  **3. Define Rule Identity (Fixes Case 2).**
  *   *Clause:* "Amendments do not reset time-based restrictions unless the amendment fundamentally alters the rule's obligation. The Group Moderator [or a designated referee] rules on whether a change is substantive or trivial."
  *   *Better yet:* Avoid time-based restrictions entirely. They are legally messy in informal groups. Use vote thresholds instead.

  **4. Resolve the Transition Paradox (Fixes Case 3).**
  *   *Clause:* "Proposals to change the voting thresholds must pass under the *old* thresholds. The new threshold takes effect immediately after the vote is certified."

  ### The "One-Word" Answer
  If you want a single concept to forbid that covers the "spirit" of all three complaints, it is this: **A current majority may not reduce the decision-making power of a future majority.**

  *   Case 1 violated this by letting 51% bind 66%.
  *   Case 2 violated this by letting the "Year 1" group bind the "Year 2" group via a time-lock.
  *   Case 3 was just a logic error, but the solution (Old Rule Counts) protects the future majority's right to know what rules they are playing under.

  If you encode that principle into your preamble, you won't need to memorize the edge cases. When a proposal comes up, ask: "Does this make it harder for the group next year to change their mind than it is for us today?" If yes, it's forbidden.
