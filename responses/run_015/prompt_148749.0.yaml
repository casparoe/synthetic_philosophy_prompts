answer: |-
  ### Selection of Goals

  I am prioritizing **Goal 1 (Boundary is drawn, not found)** and **Goal 2 (Self-prediction $\neq$ Other-prediction)**.

  I am dropping **Goal 3 (No guarantee of successor values)**.
  *Reason:* In a two-hour session with human participants, simulating "value drift" in a successor agent is indistinguishable from simply changing one's mind. To make it felt mechanically, you would need a multi-stage game where players are forcibly modified or replaced, which consumes too much time and risks turning the session into a complex simulation rather than a philosophical intuition pump. I will address Goal 3 in the debrief as a *consequence* of Goal 2: if you cannot predict your own output across a ten-minute reasoning update without altering it, you cannot guarantee alignment across a code rewrite.

  ---

  ### Activity Overview: "The Glass Box Protocol"

  **Concept:** Participants first design the physics of a toy world (Phase 1), specifically defining what an "Agent" is and how it is scored. In Phase 2, they are informed *they* are the Agents in that world. They must make a move that satisfies the scoring rules they wrote, but the scoring depends on a prediction they made *before* knowing the full state of the system—a state which includes their own prediction.

  **The Trap:** The rules they write in Phase 1 assume an "outside" view (e.g., "Agents maximize points"). In Phase 2, they find that maximizing points requires solving a self-referential loop where their prediction changes the outcome they are predicting. Randomization is penalized by the scoring rules they themselves wrote.

  ### Materials

  *   **Room:** One large table or desks pushed together. Whiteboard.
  *   **Stationery:** 50 Index cards (ruled), 20 Envelopes, 20 Pens.
  *   **Currency:** One bag of cheap chocolates (approx. 100 pieces).
  *   **Props:** A "System Log" sheet (large paper on the wall).

  ### Minute-by-Minute Timeline (120 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **0:00–0:10** | **Intro** | Welcome. No theory. Hand out materials. |
  | **0:10–0:40** | **Phase 1** | **The Architects.** Groups design the world's physics. |
  | **0:40–0:45** | **The Switch** | **The Reveal.** Facilitator collects rules, declares players are now *inside*. |
  | **0:45–1:15** | **Phase 2** | **The Residents.** Three rounds of Prediction $\to$ State Reveal $\to$ Action. |
  | **1:15–1:25** | **Scoring** | Tally chocolates. Announce winners. |
  | **1:25–2:00** | **Debrief** | Discussion mapping experience to concepts. |

  ---

  ### Rules & Instructions

  #### Phase 1: The Architects (30 mins)
  1.  **Divide:** Split the 18 participants into 6 groups of 3.
  2.  **Task:** Each group writes 3 "Laws of Physics" on index cards.
      *   **Law 1 (Ontology):** Define what an **Agent** is in this world. (e.g., "An Agent is a thing that makes choices," "An Agent is a score-maximizer").
      *   **Law 2 (Visibility):** Define what an Agent knows before acting. (e.g., "Agents see all past moves," "Agents see aggregate predictions").
      *   **Law 3 (Scoring):** Define how Agents get **Chocolates**. (e.g., "1 chocolate for correct prediction," "1 chocolate for being in the minority").
  3.  **Constraint:** At least one Law must mention the word "Prediction."
  4.  **Collection:** Collect all 18 cards. The Facilitator shuffles them and posts 6 representative laws on the Whiteboard (The "System Log"). *Facilitator Note: Ensure at least one law implies Agents are score-maximizers and one implies predictions are visible.*

  #### The Switch (5 mins)
  *   **Facilitator Script:** "You have designed a world. You are no longer the designers. You are now the Agents described in these Laws. The Laws are immutable. You cannot change them. You cannot leave the system. If the Laws say you maximize score, you are now things that maximize score. If the Laws say predictions are visible, they are."
  *   **Action:** Hand each player 1 Envelope, 1 Prediction Card, 1 Action Card.

  #### Phase 2: The Residents (30 mins)
  *Run 3 Rounds. Each round takes 8 minutes.*

  1.  **Step A (Private Prediction):** On the **Prediction Card**, write what you *will* do in Step C (Choice: **A** or **B**). Seal it in the Envelope. Write your name on the outside.
      *   *Rule:* You must choose A or B. Probabilities (e.g., "50% A") are invalid and score 0.
  2.  **Step B (System State):** Facilitator collects all Envelopes. Facilitator counts how many predict **A** and how many predict **B**. Write these totals on the Whiteboard ("Current Aggregate Prediction").
      *   *Crucial:* Return the Envelopes to the players *unopened*.
  3.  **Step C (Action):** On the **Action Card**, write what you *actually* do (Choice: **A** or **B**).
  4.  **Step D (Resolution):** Open Envelope.
      *   **Consistency Point:** If Action == Prediction, you get 1 chocolate.
      *   **System Point:** If your Action matches the Scoring Law (e.g., if Law was "Minority Wins" and you were in the minority), you get 1 chocolate.
      *   **Penalty:** If you wrote a probability or invalid prediction in Step A, you get 0 chocolates this round.

  *Note on Randomization:* If a player says "I will randomize," they cannot write a valid Prediction (A or B). If they write "A" but plan to randomize, they will fail the Consistency Point 50% of the time. The game forces commitment to maximize score.

  ---

  ### Facilitator Instructions: Speech & Silence

  **Before The Switch (0:00–0:40):**
  *   **DO SAY:** "Design a consistent system." "Make sure your laws are clear." "Think about what an Agent needs to know to win."
  *   **DO NOT SAY:** "Think about self-reference." "Consider if you are inside or outside." "This is about embedded agency."
  *   **Tone:** Bureaucratic. You are a contract administrator, not a teacher.

  **After The Switch (0:45–1:25):**
  *   **DO SAY:** "The Laws are in effect." "Invalid predictions score zero." "The Aggregate includes your envelope."
  *   **DO NOT SAY:** "Notice how your prediction changed the total." "You are causing the outcome."
  *   **Handling the Randomizer:** If a player asks, "Can I write 'Random'?"
      *   *Response:* "Law 3 requires a specific action for scoring. 'Random' is not an action. It is a distribution. Distributions score zero."
      *   *Why:* This forces them to collapse the wave function. They must *be* deterministic to score, even if they want to be stochastic.

  **Debrief (1:25–2:00):**
  *   Now you may use the forbidden words.

  ---

  ### Debrief Script

  **1. Mapping the Boundary (Goal 1)**
  *   *Ask:* "In Phase 1, who decided what an 'Agent' was?" (They did.) "In Phase 2, were you free to decide if you fit that definition?" (No, the Laws bound you.)
  *   *Point:* "You drew the boundary between 'Designer' and 'Agent' in Phase 1. In Phase 2, you found yourselves on one side of it. The boundary wasn't found in the room; it was drawn on the index cards. But once drawn, it constrained you. In embedded agency, the line between 'me' and 'world' is often a design choice, not a physical fact. If you draw it differently, the problem changes."

  **2. Mapping the Loop (Goal 2)**
  *   *Ask:* "Look at the Whiteboard totals in Step B. Did your Prediction Envelope contribute to that number?" (Yes.) "So when you were deciding your Action in Step C, were you predicting the system, or were you *part* of the system you were predicting?"
  *   *Point:* "In Newcomb's problem, Omega is outside the box. Here, *you* were Omega. Your prediction was a cause of the state you were trying to predict. Reasoning about yourself is structurally different because the reasoning process is an input to the outcome."
  *   *Handling the "Newcomb+" Objection:* If someone says, "This is just Newcomb with extra steps."
      *   *Response:* "In Newcomb, the predictor is separate. If you change your mind, Omega doesn't change. Here, if you change your mind between Step A and Step C, the 'System State' on the whiteboard becomes false. You aren't being predicted by a static function; you are updating the function *as* you run it. That's the embedded difference."

  **3. Addressing the Dropped Goal (Goal 3)**
  *   *Say:* "We didn't simulate value drift today. But consider this: If you struggled to predict your own move across a 10-minute delay with no brain modifications, what guarantees do you have that a version of you with rewritten code will share your goals? If self-prediction is unstable, value alignment is impossible."

  ---

  ### Failure Modes & Mitigations

  **1. The Gamer (Optimizing Score over Spirit)**
  *   *Risk:* A player tries to hack the chocolate distribution (e.g., stealing chocolates, arguing semantics of "Action").
  *   *Fix:* Pre-announce: "Chocolates are symbolic. The real payout is the discussion. Disputes on rules are settled by majority vote of the 'System' (the group)." This makes rule-lawyering a group coordination problem, reinforcing Goal 2.

  **2. The Disengaged (Refusing to Play)**
  *   *Risk:* A participant feels the game is silly and sits out.
  *   *Fix:* Assign them the role of "Auditor." They don't play, but they must record the Consistency Scores for one table. They are still *inside* the system (doing work for the score), just in a different subsystem. In debrief, ask them: "Did observing the loop feel different than being in it?"

  **3. The Randomizer (Breaking the Loop)**
  *   *Risk:* A player insists on flipping a coin to avoid the paradox.
  *   *Fix:* The Scoring Rule (Consistency Point) handles this. If they flip a coin, they lose 50% of their points. Ask them in debrief: "You sacrificed score to avoid the loop. Is an agent that sacrifices its utility function to avoid self-reference still an agent? Or is it broken?"

  ---

  ### Honest Limitation

  **What this activity cannot reproduce:**
  This activity cannot reproduce the **ontological uncertainty** of true embedded agency. In the game, the players *know* they are humans playing a game. They know the "Laws" are just index cards. They can always step back mentally and say, "I am not really an Agent."

  True embedded agency involves a reasoner that *cannot* step back, because there is no "outside" to step to. The players here always have an exit door (the library, their homes, their human brains).

  **How to handle it:**
  At the very end, say this: "Today, you could choose to stop playing. You could walk out. A truly embedded agent cannot walk out of its own physics. You felt the *logic* of the trap, but not the *necessity*. That necessity is what makes the hard problems of AI alignment hard. You can't turn off the optimization pressure if you *are* the optimization pressure."
