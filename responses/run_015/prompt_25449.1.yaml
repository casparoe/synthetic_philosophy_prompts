prompt: |-
  I'm on my university's faculty senate rules committee and we're stuck. We're revising how we vote on tenure-track hiring decisions. Right now we use simple plurality — whoever gets the most votes wins, even if a majority of the department actually ranked them last. Some of us want to switch to ranked-choice (instant runoff) or approval voting. But one committee member keeps bringing up Arrow's impossibility theorem and saying, look, no voting system can be truly fair, so why bother changing anything — we should just stick with plurality and move on. This has kind of paralyzed the discussion and we're supposed to have a recommendation by next meeting.

  Can you draft a short memo for me to circulate? It should recommend a specific voting method for our hiring decisions and give reasons. It needs to take the Arrow-based objection seriously — not just handwave it away, but explain what Arrow's theorem actually does and doesn't imply for a practical choice like ours. The memo should have a clear bottom-line recommendation we can vote on, and it should be honest about the downsides of whatever method we pick.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** University Faculty Senate Rules Committee.
      *   **Problem:** Revising voting method for tenure-track hiring decisions. Current method is simple plurality (criticized for allowing winners disliked by the majority).
      *   **Conflict:** Some want Ranked-Choice (RCV) or Approval Voting. One member cites Arrow's Impossibility Theorem to argue *no* system is fair, so don't change anything (status quo bias).
      *   **Task:** Draft a short memo recommending a specific voting method.
      *   **Requirements:**
          *   Take Arrow's Theorem seriously (explain what it does/doesn't imply).
          *   Provide a clear bottom-line recommendation.
          *   Be honest about downsides/trade-offs.
          *   Tone: Professional, academic, persuasive but balanced.
          *   Deadline: Need a recommendation for the next meeting.

  2.  **Deconstruct Arrow's Impossibility Theorem:**
      *   *What it says:* No ranked voting system can satisfy a specific set of "fairness" criteria (unrestricted domain, non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) *all the time* when there are 3+ options.
      *   *What it doesn't say:* It doesn't say all systems are equally bad. It doesn't say we shouldn't vote. It doesn't apply to Approval Voting (which uses ratings, not rankings). It doesn't mean "fairness is impossible," just "perfect fairness across all theoretical criteria is impossible."
      *   *Relevance to Hiring:* Hiring isn't a mass election. It's a small committee, usually few candidates (often 1-3 finalists). The "paradoxes" Arrow highlights are rarer in small N contexts.

  3.  **Evaluate Voting Methods for Hiring:**
      *   *Plurality (Current):* Simple. Bad for nuanced decisions. Encourages strategic voting. Can elect a polarizing candidate.
      *   *Ranked-Choice/IRV:* Better for consensus. Mitigates "spoiler" effect. More complex to count. Can still have monotonicity issues (ranking higher hurts you).
      *   *Approval Voting:* Simple (Yes/No for each). Encourages honest voting. Hard to gauge intensity of preference.
      *   *Borda Count:* Assigns points based on rank. Good for consensus, but susceptible to strategic ranking (burying opponents).
      *   *Consensus/Qualitative:* Often best for hiring, but needs a voting fallback.

      *Decision:* For tenure-track hiring, the goal is usually *consensus* and *avoiding a candidate the majority strongly opposes*. Ranked-Choice (specifically Instant Runoff or a simple ranked tally) is generally superior to Plurality for this. However, **Approval Voting** is often easier to explain and avoids some of Arrow's specific constraints (since it's cardinal, not ordinal). But in academic hiring, *ranking* is more natural than *approval* (we usually agree everyone is "approved" but differ on who is *best*).
      *Actually, for a Faculty Senate Committee memo regarding hiring:* The most robust alternative to Plurality that addresses the "majority dislikes the winner" problem is **Ranked-Choice Voting (Instant Runoff)** or a **Modified Borda Count**.
      *Wait, let's look at the Arrow objection again.* Arrow applies to *ordinal* rankings. Approval voting escapes Arrow's theorem technically. However, in hiring, "Approval" might be too low a bar (everyone is hireable, who is *best*?).
      *Better approach:* Acknowledge Arrow, but pivot to **Ranked-Choice Voting (RCV)** because it directly solves the specific complaint (plurality winners being ranked last by the majority). It's the standard reform for this specific problem.
      *Alternative:* **Score Voting (Range Voting)**. This avoids Arrow (cardinal vs ordinal) and captures intensity. But might be too complex for a Senate memo.
      *Let's stick with RCV (Instant Runoff)* as the primary recommendation because it's the direct antidote to the "plurality winner hated by majority" scenario described in the prompt. It's recognizable and defensible.
      *Wait, one more consideration:* In hiring, often there is only *one* position. RCV is designed for single-winner elections. This fits perfectly.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and actionable.
      *   **Opening:** Acknowledge the stalemate and the goal (better hiring decisions).
      *   **Addressing Arrow's Theorem:** This is crucial.
          *   Validate the colleague's point (mathematically correct).
          *   Clarify the scope (theoretical limits vs. practical improvement).
          *   Note that "perfect" shouldn't be the enemy of "better."
          *   Mention that Arrow applies to ranked systems, but even within those, some are *less* prone to paradoxes in small groups.
      *   **The Recommendation:** Ranked-Choice Voting (Instant Runoff).
      *   **Why RCV?**
          *   Solves the "majority dislike" problem.
          *   Encourages broad support rather than polarizing bases.
          *   Reduces strategic voting compared to plurality.
      *   **Honest Downsides:**
          *   More complex to count.
          *   Can still have theoretical flaws (monotonicity), though rare in small committees.
          *   Requires voter education.
      *   **Implementation:** Keep it simple for the committee.
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to be respectful of the Arrow argument (don't call it "wrong," call it "theoretically sound but practically limiting").
      *   Needs to sound like it comes from a peer, not a lecturer.
      *   Needs to be concise (Faculty Senators are busy).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I dismiss Arrow too quickly?
      *   *Fix:* Make sure to explicitly state that Arrow proves no system is *perfect*, not that all systems are *equal*. Use the "engineering" analogy (no bridge is perfect, but some hold weight better).
      *   *Critique:* Is RCV the best for hiring?
      *   *Fix:* In hiring, sometimes a "Condorcet" method (pairwise comparison) is better, but RCV is more widely understood. I will recommend RCV but acknowledge that for very small candidate pools (2-3), it functions similarly to a majority runoff.
      *   *Critique:* What about Approval Voting?
      *   *Fix:* I should mention it as an alternative but explain why RCV fits the "ranking" nature of hiring better. Actually, to keep the memo focused, I'll stick to one strong recommendation. RCV is the direct answer to the "plurality winner ranked last" complaint.
      *   *Wait, Arrow and Approval:* Approval voting is *not* subject to Arrow's Theorem (which applies to ordinal rankings). I should mention this as a side note to show deep understanding, but stick with RCV as the recommendation because faculty prefer ranking candidates. Actually, mentioning Approval Voting's immunity to Arrow might be a strong counter-argument to the colleague. Let's weave that in. *Decision:* I will recommend **Ranked-Choice** because it aligns better with how faculty evaluate candidates (ordering preference), but I will note that while Arrow limits ranked systems, it doesn't mean we can't improve.

      *Revised Plan:* I'll recommend **Ranked-Choice Voting (Instant Runoff)**. It directly addresses the prompt's specific pain point (winner ranked last by majority). I will address Arrow by framing it as a limit on *perfection*, not *improvement*.

  7.  **Final Polish:** Check length, clarity, and ensure the "Bottom Line" is distinct. (Self-correction: Ensure I mention that hiring is often qualitative, and voting is just the final step).

  8.  **Final Output Generation** (Proceeding to draft based on these thoughts).

      *Wait, one nuance:* In hiring, often the goal is to find the *best* candidate, not just a majority winner. Sometimes a Condorcet winner exists. RCV doesn't always pick the Condorcet winner. However, for a memo intended to break a deadlock, RCV is the standard "reform" alternative to Plurality. I will stick with that but add a caveat about small candidate pools.

      *Actually, let's consider the "Arrow Colleague".* If I recommend Approval Voting, I can literally say "Arrow doesn't apply here." That might be a stronger intellectual counter. But do faculty want to "approve" or "rank"? Usually rank. I'll stick with RCV but acknowledge the Arrow point deeply.
      *Better yet:* I will recommend **Ranked-Choice** but explicitly mention that while Arrow limits ranked systems, the specific failure mode of Plurality (the "majority hate" scenario) is mathematically less likely in RCV.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate Rules Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Method for Tenure-Track Hiring Decisions

  **Bottom Line Recommendation**
  I recommend the Committee adopt **Ranked-Choice Voting (Instant Runoff)** for tenure-track hiring decisions, replacing the current simple plurality system.

  **Context**
  Our current plurality system allows a candidate to win with the most first-place votes, even if a majority of the committee ranks them last. This risks hiring polarizing candidates who lack broad departmental support. While some members have proposed Approval Voting, Ranked-Choice Voting (RCV) better aligns with the qualitative nature of faculty evaluations, where distinguishing between "acceptable" and "preferred" is critical.

  **Addressing Arrow's Impossibility Theorem**
  One concern raised is Arrow's Impossibility Theorem, which proves that no ranked voting system can satisfy all fairness criteria simultaneously (specifically when there are three or more options). This objection is mathematically valid but practically paralyzing.

  1.  **Imperfection $\neq$ Equivalence:** Arrow's theorem demonstrates that a *perfect* system is impossible, not that all systems are *equally flawed*. Engineering bridges is subject to physical limits, but we do not conclude that all bridge designs are equally safe. Similarly, we can choose a system that minimizes specific risks relevant to hiring.
  2.  **Specific vs. General Fairness:** The theorem highlights theoretical paradoxes that arise in specific, often rare, configurations. It does not negate the empirical reality that RCV significantly reduces the likelihood of the specific failure mode we are trying to solve: a winner opposed by the majority.
  3.  **Scope of Application:** Arrow's theorem applies to ordinal (ranked) systems. While Approval Voting escapes the theorem technically, it sacrifices the nuance of preference intensity essential to hiring. We should not reject a superior ranked system solely because it cannot be theoretically perfect.

  **Why Ranked-Choice Voting?**
  *   **Majority Support:** RCV ensures the winning candidate has broad support. If no one gets a majority of first-place votes, the lowest-ranked candidate is eliminated and votes are redistributed. This prevents a candidate disliked by the majority from winning via vote-splitting.
  *   **Honest Voting:** Faculty can rank their genuine first choice without fear of "wasting" their vote, reducing strategic gaming.
  *   **Consensus Building:** It incentivizes candidates (and their supporters) to seek broad acceptance rather than just a passionate minority base.

  **Trade-Offs and Downsides**
  We must be transparent about the costs of this change:
  *   **Complexity:** RCV is slightly more complex to count than plurality, though manageable for a committee of our size.
  *   **Monotonicity:** In rare theoretical cases, ranking a candidate higher can theoretically hurt them (a flaw Arrow's theorem implies is unavoidable in ranked systems). However, this is statistically rare in small-committee hiring contexts.
  *   **Education:** Committee members will need a brief orientation on how to fill out the ballot to ensure valid rankings.

  **Next Steps**
  I propose we draft language to implement RCV for the next hiring cycle, including a simple guide for committee members. This moves us from a system that *can* ignore majority will to one that *actively seeks* consensus, acknowledging that while no system is mathematically perfect, this is a substantial practical improvement.

  I look forward to discussing this at our next meeting.
