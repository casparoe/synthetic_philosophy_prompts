prompt: |-
  I'm a software engineer with no philosophy background (my last formal contact with any of this was a statistics course years ago), and I own the estimation process for my team of eight. Every two weeks we commit to sprint-sized work, and twice a year leadership asks us for multi-quarter numbers that end up in customer-facing commitments. Our track record is bad in a consistent direction: we hit the two-to-three-sprint items roughly on time but blow well past the multi-quarter ones, and I've been asked to fix this. A friend pointed me at the planning fallacy and at "reference class forecasting" as the standard remedy: stop reasoning from the inside of this particular project ("the schema is 80% mapped, the only tricky part is the cutover") and instead ask how long projects *like this one* have actually taken, then adjust from there.

  I like the idea, but when I tried to run it I hit what I assume is a well-known wall: the forecast depends entirely on which "projects like this one" you average over. Our upcoming ingestion rewrite belongs to the class of all rewrites we've done (n=4, overran badly), the class of projects touching the payments vendor (n=9, mixed), the class of projects led by this particular tech lead (n=11, mostly on time), and the class of projects started during quarters when we were also on-call-heavy (n=7, catastrophic). Nothing in the method tells me which average to trust, and narrower classes seem more relevant but have fewer members and noisier averages. My teammate says this makes the whole thing circular: the mechanical procedure that was supposed to remove judgment just relocates it, because I pick the class with the same gut that produced the bad estimates in the first place. He adds a second objection — our data is survivorship-biased, since the only past projects we have completion times for are ones that shipped, and the two we know of that got cancelled mid-flight never generated a number at all, so even the averages we can compute are drawn from a filtered class.

  Please turn what philosophy and statistics actually know about this — the reference class problem proper, not just "use the outside view" — into a procedure my team can run in about twenty minutes per estimate at planning, with no statistician and nothing fancier than a spreadsheet over our Jira export. I need the questions to ask in order, what counts as a sufficient answer at each step, where the procedure outputs a number, and where it should stop and explicitly hand the decision to a person because the remaining question is one of judgment or values rather than facts. It has to handle at least these cases: a class with only three or four members; a genuinely first-of-a-kind project where no class has any obvious claim; and a project that differs from its natural class in one known, directional way (we've used this exact vendor before, but never with this much existing load on the system). Then run the procedure on three estimates we actually face: the ingestion rewrite described above; a two-sprint refactor of our notification service, where the class data says these run about 60% over but the assigned engineer has produced a detailed task-level breakdown showing it fits comfortably; and a greenfield internal tool the sponsoring VP wants scoped by Friday. I expect the procedure to give at least one answer I won't like — please don't sand it down to keep me comfortable — and please be explicit about what the procedure fundamentally cannot do, including whether my teammate's circularity charge is ultimately right or whether there's a principled (if imperfect) response to it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the User and the Problem:**
      *   **User Persona:** Software Engineer, owns estimation for a team of 8. No philosophy background, some stats background (years ago). Pragmatic, needs actionable tools (spreadsheet/Jira), not theory for theory's sake.
      *   **The Problem:** Consistent underestimation on long-term (multi-quarter) projects, okay on short-term (2-3 sprint) projects. Leadership needs reliable long-term numbers for customer commitments.
      *   **Proposed Solution:** Reference Class Forecasting (RCF) / Outside View.
      *   **The Obstacles:**
          1.  *The Reference Class Problem:* Which class to choose? (Rewrites vs. Vendor vs. Lead vs. Load). Narrower = more relevant but noisier (small $n$). Broader = more data but less relevant.
          2.  *Circularity Objection:* Choosing the class requires judgment, which is the same judgment that caused the bad estimates initially.
          3.  *Survivorship Bias:* Data only exists for shipped projects, not cancelled ones (which might have been time-sinks).
      *   **Requirements:**
          *   Turn philosophy/stats knowledge into a 20-minute procedure.
          *   No statistician, just spreadsheet/Jira.
          *   Specific steps, questions, exit criteria.
          *   Handle edge cases: Small $n$ (3-4), First-of-a-kind, Known directional difference.
          *   Run the procedure on 3 specific scenarios (Ingestion Rewrite, Notification Refactor, Greenfield Tool).
          *   Must give at least one uncomfortable answer.
          *   Explicitly address limitations and the circularity charge.

  2.  **Philosophical & Statistical Grounding (Mental Sandbox):**
      *   *Reference Class Problem:* Identified by Reichenbach, popularized in this context by Kahneman & Tversky (Inside vs. Outside View) and Flyvbjerg (Planning Fallacy in infrastructure). The core issue is indeed that any object belongs to infinite classes.
      *   *The "Solution":* There is no *perfect* statistical solution. It's a trade-off between *relevance* (similarity) and *statistical power* (sample size). The standard advice is "broaden until you have enough data, narrow until you have homogeneity."
      *   *Circularity:* The teammate is partially right but cynical. Judgment isn't eliminated; it's *constrained*. Instead of judging "how long will this take?", you judge "which past projects are truly similar?". This is easier because it's retrospective and concrete, not prospective and hypothetical.
      *   *Survivorship Bias:* Real issue. Need to account for "kill projects" or add a buffer for uncertainty.
      *   *Small $n$:* Use wider intervals (prediction intervals vs. confidence intervals) or Bayesian priors (too complex for this user? Keep it simple: use ranges, not means).
      *   *First-of-a-kind:* Analogical reasoning. Find the *closest* analogy, even if imperfect, and apply a high uncertainty multiplier.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Goal:* Move from "Gut Feel" to "Constrained Judgment."
      *   *Step 1: Define the Candidate Classes.* (5 mins). List the obvious ones (Tech, Team, Context).
      *   *Step 2: Filter for Data Quality.* (5 mins). Check $n$. Check for survivorship (did anything die?).
      *   *Step 3: Select the "Base" Class.* (5 mins). Rule: Largest $n$ that doesn't violate obvious dissimilarity.
      *   *Step 4: Adjust for Known Differences.* (5 mins). Qualitative adjustment based on specific deltas.
      *   *Output:* A range, not a point. A confidence level.
      *   *Handoff:* If classes conflict wildly or $n < 3$, flag for leadership risk acceptance.

  4.  **Addressing the Specific Constraints:**
      *   *Small $n$:* Don't use the mean. Use the *max* or *85th percentile* of the small sample.
      *   *First-of-a-kind:* Use "Analogous Complexity" class (e.g., "Big Backend Changes" even if tech is new).
      *   *Directional Difference:* Apply a "Delta Factor" (e.g., +20% for load).
      *   *Circularity:* Address this in the "Limitations" section. It's not circular; it's *calibrated*.

  5.  **Running the Scenarios:**
      *   *Scenario 1: Ingestion Rewrite.*
          *   Classes: Rewrites ($n=4$, bad), Vendor ($n=9$, mixed), Lead ($n=11$, good), Load ($n=7$, catastrophic).
          *   Conflict: Rewrites say "disaster," Lead says "fine."
          *   Resolution: "Rewrites" is the most *causal* class (nature of work). "Lead" is a mitigating factor. "Load" is a risk factor.
          *   Uncomfortable Truth: The estimate must reflect the "Rewrite" history, not the "Lead" history. The Lead's track record might be on *new* work, not *rewrites*.
      *   *Scenario 2: Notification Refactor.*
          *   Class Data: +60% overrun.
          *   Inside View: Engineer says "I broke it down, it's fine."
          *   Conflict: Outside view vs. Inside view.
          *   Resolution: RCF says trust the class. Inside view is where the planning fallacy lives.
          *   Uncomfortable Truth: Tell the engineer their breakdown is likely optimistic. Use the class data.
      *   *Scenario 3: Greenfield Tool.*
          *   Class: None (First-of-a-kind).
          *   Resolution: Find nearest analogy (e.g., "Internal Dashboards").
          *   Output: Wide range + "Discovery Phase" recommendation.

  6.  **Refining the Philosophy/Stats Content:**
      *   Need to mention *Hajek* or *Reichenbach* lightly? No, keep it practical. Focus on Kahneman/Lovallo (Inside/Outside) and Flyvbjerg.
      *   The "Circularity" charge: It's the *Problem of Induction*. We assume the future resembles the past. We can't prove it. But we must act. The procedure makes the assumption explicit.
      *   Survivorship: Add a "Graveyard Buffer."

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the problem (Reference Class Problem is real).
      *   **The Procedure:** Step-by-step, timed, spreadsheet-friendly.
      *   **The Edge Cases:** How the procedure handles $n<5$, First-of-a-kind, Deltas.
      *   **The Application:** Running the 3 scenarios.
      *   **The Hard Truths (Limitations):** Addressing circularity, survivorship, and what the model can't do.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Yes, if data is pre-prepared (Jira export). The procedure assumes a maintained "History Sheet." I need to mention that maintaining the history is a separate ongoing task.
      *   *Critique:* Is the "Uncomfortable Truth" uncomfortable enough?
      *   *Fix:* For the Refactor, explicitly state: "Ignore the engineer's breakdown for the commitment number." That will sting. For the Rewrite, explicitly state: "Your Tech Lead's past success is irrelevant to the structural risk of rewrites."
      *   *Critique:* Did I answer the circularity charge?
      *   *Fix:* Yes, in the limitations. It's not circular, it's *hierarchical*. Judgment is moved from "predicting time" to "selecting similarity," which is a more tractable cognitive task.

  9.  **Final Polish:** Ensure tone is respectful of the engineer's expertise but firm on the statistical reality. Use formatting (bolding, lists) to make it skimmable/actionable. (Proceed to generate output based on this thought process).

  *(Self-Correction on the "Circularity" point)*: I need to be careful not to dismiss the teammate entirely. He is philosophically astute. The response should validate his insight but explain why the procedure is still *better* than the status quo, even if not perfect. It reduces variance in judgment, even if it doesn't eliminate bias.

  *(Self-Correction on Survivorship)*: How to handle cancelled projects in a spreadsheet? If they don't have a "completion time," they have a "time invested." That's a lower bound on the cost of failure. I should include that.

  *(Final check on constraints)*: 20 mins? Yes. Spreadsheet? Yes. 3 scenarios? Yes. Limitations? Yes.

  Let's write it.cw
answer: |-
  This is a sophisticated problem that cuts to the core of inductive reasoning. Your teammate is channeling Nelson Goodman's "New Riddle of Induction" and the classic Reference Class Problem (Reichenbach, 1949): *Any individual event belongs to infinite classes, and different classes yield different probabilities.*

  He is also right about the circularity risk: if you choose the reference class based on the estimate you *want*, you haven't solved the planning fallacy; you've just automated it.

  However, statistics and decision theory (specifically the work of Daniel Kahneman, Dan Lovallo, and Bent Flyvbjerg on the "Outside View") suggest that while you cannot eliminate judgment, you can **constrain** it. You move the judgment from "predicting the future" (hard, biased) to "categorizing the past" (easier, verifiable).

  Here is a 20-minute procedure designed for a spreadsheet, followed by the application to your three scenarios and a direct address of the philosophical limitations.

  ---

  # The "Constrained Outside View" Protocol (20 Minutes)

  **Prerequisite:** A maintained "History Sheet" (Jira export) containing: Project Name, Type, Tech Stack, Team Lead, Context (e.g., on-call load), Planned Weeks, Actual Weeks, Status (Shipped/Cancelled).

  ### Phase 1: Class Generation & Filtering (5 Minutes)
  **Goal:** Generate candidate classes and eliminate those with insufficient data.

  1.  **List Candidate Classes:** Write down every way you can categorize the new project based on columns in your History Sheet.
      *   *Examples:* "Schema Rewrites," "Payment Vendor Integrations," "Projects led by [Name]," "Q3/Q4 Projects."
  2.  **Apply the $N \ge 5$ Rule:** Discard any class with fewer than 5 historical entries.
      *   *Why:* With $N < 5$, the mean is statistically meaningless and dominated by outliers.
      *   *Exception:* If *no* class has $N \ge 5$, keep the top 3 largest classes regardless of size (see Edge Cases below).
  3.  **Check for Survivorship:** Look at the "Status" column for remaining classes.
      *   If >20% of projects in a class were "Cancelled," mark this class as **High Risk**. Do not discard it; the cancellation rate *is* data.

  ### Phase 2: Selection & Baseline (5 Minutes)
  **Goal:** Pick the single "Base Class" that drives the estimate.

  1.  **The Causality Test:** Ask: "Which feature is most likely to *cause* delays?"
      *   *Rule:* Structural complexity (e.g., "Rewrite") beats Personnel (e.g., "Lead Name") beats Context (e.g., "On-call load").
      *   *Reasoning:* A good lead can mitigate load, but a rewrite inherently involves unknown debt. Structural risks dominate human variance.
  2.  **Select the Base Class:** Choose the class that passes the Causality Test and has the largest $N$.
  3.  **Calculate the Baseline:**
      *   Compute the **Ratio** for each project in the class: $\text{Actual Weeks} / \text{Planned Weeks}$.
      *   Take the **Median Ratio** (not Mean, to resist outliers).
      *   *Output:* `Base Multiplier`. (e.g., 1.6 means projects take 60% longer than planned).

  ### Phase 3: Adjustment & Uncertainty (5 Minutes)
  **Goal:** Adjust for known differences and define the range.

  1.  **Apply Directional Deltas:** Does the new project differ from the Base Class in a known, directional way?
      *   *Example:* "Same vendor, but 2x load."
      *   *Action:* Add a fixed percentage buffer (e.g., +15%) to the `Base Multiplier`. Do not subtract. *Never* adjust downward based on "this time is different" optimism.
  2.  **Calculate the Range:**
      *   `Optimistic` = $\text{Inside View Estimate} \times \text{Base Multiplier}$
      *   `Pessimistic` = $\text{Inside View Estimate} \times (\text{Base Multiplier} + \text{Standard Deviation of Ratios})$
      *   *Note:* If $N$ is small (5-7), use the **Max Ratio** from history instead of the Median for the Pessimistic case.
  3.  **Survivorship Buffer:** If the Base Class had cancelled projects, add a "Risk Phase" to the timeline (e.g., +2 weeks for discovery) or explicitly state the probability of cancellation in the commitment.

  ### Phase 4: The Handoff (5 Minutes)
  **Goal:** Decide if this is a math problem or a values problem.

  1.  **Check Variance:** Is the `Pessimistic` number more than 50% larger than the `Optimistic` number?
      *   **Yes:** Stop. This is not an estimation problem; it is a **Scope/Risk problem**. Hand off to leadership: "We cannot commit to a date, only a budget for discovery."
      *   **No:** Proceed to commitment.
  2.  **Document the Class:** Write down *which* class was used. This creates accountability for future calibration.

  ---

  # Edge Case Handling

  *   **Small $N$ (3-4 members):** Do not use the Median. Use the **Maximum** historical ratio. Treat the estimate as a "Best Case" scenario. Explicitly flag to leadership: "Data is sparse; this is a lower bound."
  *   **First-of-a-Kind:** You must force an analogy. Do not say "no data." Find the class with the closest *cognitive load* (e.g., "Greenfield" $\rightarrow$ "Complex Integrations"). Use the `Max Ratio` of that proxy class and add a +25% "Unknown Unknowns" buffer.
  *   **Directional Difference:** If the project is like the class *except* for one known stressor (e.g., load), apply a linear adjustment. If the stressor is non-linear (e.g., "new language we don't know"), revert to First-of-a-Kind rules.

  ---

  # Application to Your Scenarios

  Here is the procedure running on your three specific cases.

  ### 1. The Ingestion Rewrite
  *   **Inputs:**
      *   Class A (Rewrites): $N=4$, Avg Overrun 100% (Ratio 2.0).
      *   Class B (Vendor): $N=9$, Avg Overrun 20% (Ratio 1.2).
      *   Class C (Lead): $N=11$, Avg Overrun 5% (Ratio 1.05).
      *   Class D (High Load): $N=7$, Avg Overrun 150% (Ratio 2.5).
  *   **Procedure Run:**
      *   *Filter:* All $N \ge 4$. (Rewrites is borderline small, but keep it).
      *   *Causality Test:* "Rewrite" is structural. "Lead" is personnel. "Load" is context. Structural wins. **Base Class = Rewrites.**
      *   *Adjustment:* We are also in a High Load quarter. This is a known directional stressor.
      *   *Calculation:* Base Ratio (2.0) + Load Delta (conservatively +0.5) = **2.5 Multiplier**.
      *   *Inside View:* Let's say your team estimates 10 weeks.
      *   *Output:* **25 Weeks.**
  *   **The Uncomfortable Truth:** Your Tech Lead's track record (Class C) is **discarded**. The procedure dictates that the *nature of the work* (rewrite) historically overwhelms the *skill of the lead*. If you use the Lead's class, you are ignoring the base rate of rewrites. You must commit to ~6 months, not the 3 months the inside view suggests.

  ### 2. Notification Service Refactor
  *   **Inputs:**
      *   Class (Refactors): $N=8$, Avg Overrun 60% (Ratio 1.6).
      *   Inside View: Engineer breakdown says 4 weeks.
  *   **Procedure Run:**
      *   *Filter:* $N=8$ is sufficient.
      *   *Causality:* Refactor is the structural class.
      *   *Conflict:* Engineer says "I broke it down, the class data doesn't apply."
      *   *Rule:* The Outside View overrides the Inside View for commitments. The breakdown is subject to the planning fallacy; the class data captures the hidden complexity the breakdown missed.
      *   *Output:* $4 \text{ weeks} \times 1.6 = $ **6.5 Weeks.**
  *   **The Uncomfortable Truth:** You must tell the engineer: "Your breakdown is useful for task assignment, but useless for commitment. The data shows people like you miss things like this 60% of the time. We are committing to 7 weeks."

  ### 3. Greenfield Internal Tool (VP wants scope by Friday)
  *   **Inputs:**
      *   Class: None (First-of-a-kind).
      *   Proxy Class: "Internal Dashboards" ($N=6$, Ratio 1.4).
  *   **Procedure Run:**
      *   *Rule:* First-of-a-kind $\rightarrow$ Use Proxy Max Ratio + Unknown Buffer.
      *   *Max Ratio from Proxy:* 2.0 (one project went double).
      *   *Buffer:* +25% for "New Tech." Total Multiplier = 2.5.
      *   *Inside View:* VP wants a number. Team guesses 8 weeks.
      *   *Output:* **20 Weeks.**
      *   *Variance Check:* Range is 8 weeks (Inside) to 20 weeks (Outside). Variance > 50%.
      *   *Handoff:* **Stop.** Do not give a date.
      *   *Recommendation:* "We cannot scope this. We commit to a 2-week Discovery Sprint to reduce uncertainty, after which we will apply this protocol again."
  *   **The Uncomfortable Truth:** You must tell the VP "No." Giving a number now is lying. The procedure forces you to convert a "date commitment" into a "budget for information gathering."

  ---

  # Limitations & The Circularity Charge

  You asked for explicit honesty about what this cannot do.

  ### 1. Is my teammate right about circularity?
  **Verdict:** He is philosophically correct but pragmatically wrong.
  *   **The Charge:** Selecting the reference class requires judgment. If I am biased to want a short estimate, I will choose the "Tech Lead" class instead of the "Rewrite" class.
  *   **The Defense:** This is not circular; it is **hierarchical**.
      *   *Old Judgment:* "How long will this take?" (Requires simulating the future, which humans are terrible at).
      *   *New Judgment:* "Which past bucket does this fit in?" (Requires comparing concrete attributes, which humans are better at).
      *   By forcing you to write down the class name (Phase 4, Step 2), we make the judgment auditable. Next quarter, leadership can ask: "Why did you use the 'Lead' class instead of the 'Rewrite' class?" You cannot be audited on a gut feeling, but you can be audited on a classification rule. The procedure reduces the *degrees of freedom* for bias, even if it doesn't eliminate them.

  ### 2. Survivorship Bias
  The procedure handles this partially (Phase 1, Step 3), but it cannot fix missing data.
  *   **The Hard Truth:** If your company deletes Jira tickets for cancelled projects, your data is poisoned. No spreadsheet formula fixes this.
  *   **Mitigation:** If you suspect survivorship bias (e.g., "I remember two big failures that aren't in Jira"), you must manually inject them into the History Sheet as "Cancelled - 12 weeks invested." Treat "weeks invested" as the cost. If you cannot do this, you must add a generic "Organizational Risk Buffer" (e.g., +10%) to all estimates to account for the invisible graveyard.

  ### 3. The "Black Swan" Problem
  This procedure assumes the future is statistically similar to the past.
  *   **Failure Mode:** If your infrastructure provider changes pricing, or a key vendor goes bankrupt, historical classes are useless.
  *   **Mitigation:** This is why Phase 4 (The Handoff) exists. If the variance is too high, the procedure forces you to admit ignorance rather than producing a precise, wrong number.

  ### 4. Small $N$ Instability
  With $N=4$ (like your Rewrites class), one outlier skews the median.
  *   **The Hard Truth:** You cannot fix this with math. You only have 4 data points.
  *   **Mitigation:** The procedure dictates using the **Max** ratio for small $N$. This is conservative. It essentially says, "Assume the next project will be as bad as the worst one we've seen." This will feel unfair to the team, but it is the only statistically honest way to handle sparse data without a Bayesian prior (which requires a statistician).

  ### Summary of What This Buys You
  This procedure will not give you "true" numbers. There is no such thing. It will give you **defensible** numbers.
  *   When you miss the date, you can show leadership: "We used the Rewrite class, which has historically overrun by 100%. We estimated based on that. Here is the variance."
  *   This shifts the conversation from "You are bad at estimating" to "This class of work is inherently volatile. Do we want to continue doing Rewrites, or do we want to budget for the volatility?"

  That is the only fix available to you. The rest is wishful thinking.
