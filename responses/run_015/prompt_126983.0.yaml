answer: |-
  Port Haven, a coastal municipality, issues five-year "climate-adaptation visas" to workers who construct sea walls, pay local taxes, and obey municipal police and zoning codes without eligibility for permanent residency. Upstream, across a national border, a farming community relies on groundwater aquifers that the sea wall's drainage system intentionally diverts, reducing their crop yield significantly, though Port Haven's laws do not govern them. Meanwhile, a remote panel of hydrologists advises the council via video link; they never enter the jurisdiction, are not bound by Port Haven's laws, and receive research grants contingent on the project's approval, yet hold no property or residence there.

  **Principle Application**
  Under **All Subjected Persons (ASP)**, the visa-holders are included because they are coerced by Port Haven's legal order (police, taxes, zoning); the farmers are excluded because they remain under their own state's jurisdiction and face no legal coercion from Port Haven; the hydrologists are excluded because they are not subject to the municipality's enforcement mechanisms. Under **All Affected Interests (AAI)**, the visa-holders are included because their livelihood and residence are fundamentally shaped by the decision; the farmers are included because the project physically alters their water supply and economic viability; the hydrologists are excluded because their financial stake is merely contractual and professional, lacking the fundamental rights-based weight of residence or livelihood security required to trigger democratic inclusion.

  **Structural Feature**
  The work is being done by the distinction between **legal coercion** versus **causal externality**. ASP draws the boundary at the reach of enforceable law, while AAI draws it at the reach of physical or economic consequence. The visa-holders sit at the intersection (both coerced and affected), the farmers highlight the gap (affected but not coerced), and the hydrologists test the threshold of "interest" (affected financially but not fundamentally).

  **Dropping the Five-Year Limit**
  If the five-year limit is removed and visa-holders reside indefinitely without voting rights, the normative justification for their exclusion collapses even if the ASP criteria are technically met. Permanent subjection without representation transforms a temporary administrative arrangement into a structure of permanent disenfranchisement, violating the democratic intuition that long-term subjection requires membership. It breaks the moral plausibility of treating them as "guests" rather than permanent subjects requiring a voice.

  **ASP Defender's Attack**
  A defender of ASP would attack the inclusion of the farmers under AAI by arguing that "affected interests" is boundless and administratively impossible. They would contend that because the farmers are not subject to Port Haven's coercive enforcement, they lack the reciprocal relationship necessary for democratic legitimacy; their remedy lies through their own government or international trade law, not by diluting Port Haven's demos. They would argue that including everyone causally affected turns every local election into a global plebiscite, destroying the capacity for decisive local self-government.
