  # DECISION TREE: DEFATIONARY THEORIES OF TRUTH

  **ROOT COMMITMENT:**
  *When the cat is on the mat, calling 'the cat is on the mat' true seems to add nothing to just saying that the cat is on the mat, and any account of truth has to respect that.*

  ---

  ### Q1: THE GENERALIZATION TEST
  Consider the claim: "Everything in the archive is true." To assert this, must you use the truth predicate, or could you in principle replace it with a long conjunction of every specific claim in the archive?
  *   **(A)** I could replace it with a conjunction (finite or infinite); the truth predicate is logically eliminable.
  *   **(B)** I need the truth predicate; substitution is impossible for infinite or indeterminate sets.

  ### Q2: THE SUBSTANTIVE POWER TEST
  Consider two cases: (1) The **Archive Inference** ("Everything in the archive is true; the archive says the bridge is unsafe; so the bridge is unsafe"); (2) The **Success Explanation** (An engineer succeeds because her beliefs are *true*, not just useful). Does the concept of truth do genuine explanatory or derivational work here that the specific contents alone do not? (i.e., Is the theory non-conservative?)
  *   **(A)** Yes; truth allows new derivations and explains success causally.
  *   **(B)** No; truth is a logical device that facilitates the inference but adds no explanatory power.

  ### Q3: THE DOMAIN SHIFT TEST
  Compare these claims: "Snow is white" (empirical), "2+2=4" (mathematical), "Torture is wrong" (normative). Is the property that makes them 'true' the *same* property in all three cases?
  *   **(A)** No; different domains have different truth-properties (e.g., correspondence for snow, superassertibility for morals).
  *   **(B)** Yes; truth is a uniform notion across all domains.

  ### Q4: THE VERIFICATION TEST
  Is it intelligible to claim that a statement is *true* even if it is in principle impossible for any human to verify or know it (e.g., a specific grain of sand on a lost planet)?
  *   **(A)** No; truth is essentially tied to our capacity to verify or warrant assertion.
  *   **(B)** Yes; truth can transcend our epistemic capacities.

  ### Q5: THE SAPHI TEST
  Consider the **Saphi**: a community whose truth-word is used *only* to endorse an utterance made just before by another speaker. It is never applied to the speaker's own current utterance, carries an overtone of deferring, and has *no use in generalizations* at all. Is the Saphi word a genuine truth predicate?
  *   **(A)** No; the capacity for generalization (quantification) is essential to truth.
  *   **(B)** Yes; the capacity for endorsement/anaphora is sufficient for truth.

  ### Q6: THE GRAMMATICAL FORM TEST
  In the exchange "Snow is white." / "That is true.", does the phrase "is true" function as a predicate attaching to a name (like 'is red'), or as a *pro-sentence* standing in for the previous sentence (like 'so' or 'do')?
  *   **(A)** It is a pro-sentence; it inherits its content anaphorically.
  *   **(B)** It is a predicate; it attributes a status to a proposition or sentence.

  ### Q7: THE UNREADABLE SCRIPT TEST
  You are shown a card with a sentence written in a script you cannot read, held by someone else. Can you correctly assert "The sentence on that card is true" without knowing its content?
  *   **(A)** No; you must grasp the proposition to apply the truth concept.
  *   **(B)** Yes; blind truth attribution is coherent.

  ### Q8: THE CALIBRATION TEST
  Consider your friend's **Machine Learning** case: A classifier outputs probabilities. She argues calling an output 'true' is just bookkeeping for "calibrated labels," with no assertoric force or property attribution. Is this use of 'true' legitimate?
  *   **(A)** Yes; truth attributions are merely expressive norms of calibration.
  *   **(B)** No; truth must involve assertoric force or content endorsement.

  ### Q9: THE PRIMITIVISM TEST
  You have denied truth is eliminable (Q1), explanatory (Q2), plural (Q3), epistemic (Q4), or purely expressive (Q8). You hold it is a predicate (Q6) that allows blind attribution (Q7). Is truth a *real, simple, unanalyzable property* that nonetheless respects the 'adds nothing' intuition at the level of assertion?
  *   **(A)** Yes; it is a substantive but primitive property.
  *   **(B)** No; it is not a property in that sense.

  ---

  ## SCORING NOTES & POSITION MAPPING

  | Path | Position | Diagnosis |
  | :--- | :--- | :--- |
  | **Q1(A)** | **The Redundancy View** (Ramsey) | You hold the truth predicate is entirely eliminable. Generalizations are treated as infinite conjunctions. |
  | **Q1(B) → Q2(A)** | **Substantive Correspondence / Truthmaker** | You respect the root intuition superficially but hold truth does real work (explains success, allows non-conservative extensions). |
  | **Q1(B) → Q2(B) → Q3(A)** | **Alethic Pluralism** (Lynch/Wright) | You are deflationary about the *concept* but pluralist about the *property* across domains. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(A)** | **Verificationist Anti-Realism** (Dummett) | You deny truth-transcendence; truth is epistemically constrained. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(A)** | **Disquotationalism** (Quine) | You tie truth essentially to generalization (hence Saphi fails) and allow blind attribution. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(B) → Q6(A)** | **Prosententialism** (Grover, Camp, Belnap) | You view 'is true' as a grammatical pro-form, not a predicate. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(A)** | **Minimalism** (Horwich) | You view truth as a property of propositions; blind attribution fails because you need the proposition. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(B) → Q8(A)** | **Calibration Expressivism** (Invented) | You treat truth attributions as normative bookkeeping without property commitment. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(B) → Q8(B) → Q9(A)** | **Primitivism** (Boghossian/Field target) | You hold truth is a real, simple property that does not explain or reduce. |
  | **Q1(B) → Q2(B) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(B) → Q8(B) → Q9(B)** | **UNOCCUPIED** | See "Diagnoses of Empty Cells" below. |

  ---

  ## DIAGNOSES OF EMPTY CELLS AND COLLAPSED BRANCHES

  ### 1. The Unoccupied Leaf (Path Q9-B)
  **Logical Combination:** Truth is not eliminable (Q1-B), does no explanatory work (Q2-B), is uniform (Q3-B), transcends verification (Q4-B), allows endorsement without generalization (Q5-B), is a predicate (Q6-B), allows blind attribution (Q7-B), is not merely calibration (Q8-B), but is *not* a primitive property (Q9-B).
  **Diagnosis:** **Incoherent / Unexplored.** This position claims 'true' is a predicate that allows blind attribution and is not merely expressive, yet denies it is a property (primitive or otherwise) and denies it does explanatory work. It is difficult to articulate what the predicate *does* if it is not a property, not a pro-sentence, not eliminable, and not expressive. It likely collapses into Disquotationalism (if one ignores the Saphi constraint) or Expressivism.

  ### 2. Collapsed Branch: Disquotationalism vs. Minimalism on Blind Attribution
  **Issue:** Quinean Disquotationalism (Q5-A) typically allows blind attribution (sentences). Horwichian Minimalism (Q7-A) typically denies it (propositions). However, some interpretations of Disquotationalism might require understanding the sentence type.
  **Resolution:** The tree separates them via the **Saphi Test (Q5)**. Quineans insist on generalization as the *function* of truth. Minimalists insist on the *equivalence schema* for propositions as the *function*. If a student answers "Yes" to Saphi (Endorsement is enough) but "Yes" to Blind Attribution, they fall toward a Sentential Deflationism that isn't Quinean. This cell is currently mapped to **Primitivism** or **Calibration** depending on Q8/Q9, but strictly speaking, a "Sentential Endorsement View" without Generalization is a logical possibility no major figure occupies.

  ### 3. Collapsed Branch: Primitivism vs. Correspondence
  **Issue:** Both view truth as a property.
  **Resolution:** Separated by **Q2 (Substantive Power)**. Correspondence theorists argue truth *explains* success and allows non-conservative extensions (e.g., via reflection principles in arithmetic). Primitivists (like Field's target) argue truth is a property but *fails* to explain or reduce, respecting the deflationary intuition that it "adds nothing" to the assertion's content. If a student answers "Yes" to Q2, they are pushed to Correspondence; if "No", they remain in the deflationary/primitive cluster.

  ### 4. The Saphi Verdict
  **Logical Force:** This case forces a split between views that take **Generalization** to be the core function of truth (Quine/Disquotationalism) versus views that take **Endorsement/Anaphora** to be core (Prosententialism/Minimalism). There is no standard textbook view that occupies the "Saphi is Truth" + "Generalization is Essential" space (contradictory). The tree forces the student to choose which function is constitutive.

  ### 5. Calibration Expressivism
  **Logical Force:** This leaf captures the specific ML intuition that 'true' is a norm of *calibration* rather than *correspondence* or *assertion*. It is separated from standard Expressivism (which usually focuses on moral/truth aptness) by the specific technical constraint of calibration. If the student rejects this (Q8-B) but rejects Primitivism (Q9-B), they fall into the **Unoccupied** cell, suggesting that without calibration, property, or pro-sentence status, there is no room left for the predicate.
