answer: |-
  Dear Program Officer,

  I am writing to propose a three-month independent research grant focused on a specific conceptual bottleneck in the Eliciting Latent Knowledge problem. The standard setup assumes a predictor trained on sensor streams, such as camera footage of a vault, and a reporter tasked with describing the state of the world. The prevailing worry is that the reporter will optimize for human impressions rather than truth, leading to deception. Most current proposals attempt to make this deceptive strategy structurally unavailable by constraining the reporter, penalizing complexity, or training on human-checkable cases with the hope of generalization. My proposal argues that these approaches rest on a hidden assumption that the model's latent state is fully translatable into human concepts. If the model's world-model is ontologically richer than the space of things we can say, then no reporter can be both fully faithful and legible. In this regime, the difficulty is not deception but lossy compression. The question I propose to investigate is whether we can define a translation map that preserves decision-relevant features within a specified distortion budget, and whether we can detect when compression artifacts remove safety-critical information. This reframes the goal from finding the truth to finding a safe compression, and it changes the diagnostic from checking consistency to checking the expressibility of disagreements.

  The reason existing constrain-the-reporter approaches do not settle this issue, even granting they work technically, is that they assume the target exists within the human concept space. If the model perceives variables or causal structures that have no human label, forcing the reporter to speak only in human terms necessitates throwing away information. Consistency on human-checkable cases does not guarantee safety off-distribution because two reporters could agree on all training data while diverging on out-of-distribution cases in ways that are invisible to human observation. If the disagreement between two such reporters is expressible in human terms, we can adjudicate it. However, if the disagreement is an aliasing artifact with no human-legible description, then the standard statement of the problem is asking for something incoherent. We cannot verify truthfulness if the truth lies outside our ontology. Therefore, the precise question this project seeks to answer is whether there exists a class of decision tasks such that any reporter satisfying a distortion budget relative to those tasks is safe to act on, and whether we can algorithmically distinguish between semantic disagreement and inexpressible compression artifacts.

  Over the first month, I will build toy environments that enforce an ontology mismatch between the predictor and the reporter. I plan to use cellular automata or gridworlds where the underlying state space includes variables that are observable to the predictor but cannot be directly named by the reporter's vocabulary, only inferred through their effects. I will define a set of decision tasks that depend on these hidden variables, such as predicting whether a cascade event will occur that is not visible in the sensor stream until it is too late. The goal here is to establish a ground truth where the human-legible report is necessarily incomplete. I will implement a predictor that learns the full dynamics and then train multiple reporters with different inductive biases to map the predictor's latents to the human vocabulary. These reporters will be trained to minimize loss on the human-checkable cases while being regularized differently, ensuring they converge on the training distribution but potentially diverge elsewhere.

  In the second month, I will focus on generating and analyzing the divergence. I will search for input cases where the trained reporters agree on all human-checkable metrics but output different reports regarding the hidden state variables relevant to the decision tasks. Once I have identified pairs of reporters that disagree off-distribution, I will attempt to characterize the disagreement. The core experiment is to test whether the difference between their reports can be described using the human vocabulary. I will use a separate language model or a probing classifier trained on the human concept space to see if it can distinguish the states that the reporters disagree on. If the disagreement is expressible, the probe should be able to classify the divergence. If the disagreement is purely an aliasing artifact of the compression map, the probe should perform at chance levels despite the reporters having different internal justifications for their outputs. This will allow me to quantify the prevalence of inexpressible disagreements in a controlled setting.

  The third month will be dedicated to synthesizing these findings into a diagnostic tool and evaluating the possible conclusions. There are two primary outcomes I anticipate. The first is that disagreements are generally expressible, which would suggest that the ontology mismatch is manageable and that we can iterate on the reporter until the disagreement vanishes. The second is that inexpressible disagreements are pervasive, which would imply that the standard ELK framing is fundamentally flawed because it demands legibility where none is possible. If the second conclusion holds, I will work to formalize the distortion budget metric. The deliverable for this project will be a protocol for auditing reporters not for truthfulness, but for compression safety. This protocol would allow a system operator to specify a class of decisions they intend to make and receive a guarantee that the reporter's compression has not discarded information relevant to those specific decisions, even if the reporter cannot explain the underlying state fully. This is a weaker guarantee than truthfulness but potentially the strongest one achievable given ontological limits.

  I must also state an honest failure condition for this work. It is possible that this reframe simply moves the bump under the rug. The distortion budget itself must be defined relative to a specified class of decisions, and defining that class requires human concepts. If the safety-critical risks lie outside the class of decisions we thought to specify, then the distortion budget provides a false sense of security. We might successfully verify that the reporter preserves all information relevant to the decisions we listed, while missing a catastrophic failure mode that we did not know how to name. If I find that the set of decisions required to guarantee safety is as complex as the model's full latent space, then the compression approach offers no advantage over simply trusting the model. In that case, the deliverable would be a negative result demonstrating that lossy compression cannot be made safe without solving the ontology alignment problem first. I believe determining whether this is the case is worth the investment, as it clarifies whether we are solving an engineering problem of constraint satisfaction or a philosophical problem of ontology. I look forward to the possibility of discussing this further.

  Sincerely,

  [Your Name]
