answer: |-
  Dr. Aris, a Principal Investigator leading a node in the NeuroGen Consortium, must decide whether to incur a modest administrative cost to embed an irreversible "Open-Data Charter" into her lab's operating bylaws, delegating preliminary negative result publication to an independent biostatistician. The Consortium Board, lacking legal leverage, audits her institutional design to predict her future compliance; their audit is 80% reliable, yielding false positives (predicting sharing when she plans to withhold) and false negatives (predicting withholding when she plans to share). If the Board predicts she will withhold data, they exclude her node, costing her access to pooled patient cohorts and a $2M grant; if included, she faces a later choice where withholding negative results offers a moderate reputational and financial advantage over sharing, with no legal penalty for reneging. The Board's exclusion decision happens *before* data generation, based solely on the observable presence or absence of the Charter, yet Aris knows that once included, her causal power to withhold remains intact regardless of her prior bylaw adoption.

  **Verdicts and Rational Analysis**

  A purely causal, ex-post rational agent (CDT) at the **execution stage** (after inclusion) should withhold the data. At this point, the Board's decision is fixed; sharing yields no causal benefit regarding grant access and incurs a reputational cost, so maximizing current utility dictates defection. At the **commitment stage**, a sophisticated CDT agent faces dynamic inconsistency: she recognizes she *should* adopt the Charter to secure the 80% probability of inclusion (expected value of grant > cost), but she also knows she *will not* follow through at the execution stage. A structural or evidential account (EDT) recommends both adopting the Charter and sharing the data, treating the present action as diagnostic of a cooperative "type" that sustains the correlation between architecture and prediction, thereby validating the initial investment.

  **The Persistence of the Gap**

  The gap between commitment and execution persists because this is not a standard Newcomb problem. In Newcomb's Problem, the agent's choice is logically correlated with the predictor's past act. Here, the correlation exists between the *institutional architecture* and the prediction, but the *final decision* to share is causally decoupled from the prediction once inclusion is secured. The "noisy observability of self-binding architecture" does the work: because the predictor reads the *rules* rather than the *mind*, the agent can theoretically game the system by adopting the rules (to pass the audit) and then violating them (to maximize payoff). If the predictor became **perfect**, the scenario collapses into Newcomb's Problem, where the decision to withhold becomes evidence that one never truly had the Charter, forcing EDT/CDT convergence on cooperation. If **legal enforcement** were added, the payoff matrix changes such that the cost of withholding exceeds the benefit, making compliance the dominant causal strategy regardless of prediction.

  **The Causal Defense**

  A defender of pure causal rationality would attack the premise that "restructuring one's decision architecture" is genuinely available as a rational option without external enforcement. They would argue that without a court or regulator to impose a penalty for overriding the Charter, the "binding" is metaphysically illusory; the future self remains a distinct utility-maximizer with the causal power to ignore past bylaws. Therefore, adopting the Charter is merely a costly signal with no causal leverage over the future act, and a rational agent should not pay the cost for a constraint they know they will causally override when the stakes arrive.
