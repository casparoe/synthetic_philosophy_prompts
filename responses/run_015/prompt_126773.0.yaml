          *   Format: One paragraph for the scenario, followed by a walkthrough of verdicts (Causal vs. Evidential/Structural), analysis of the gap, the role of noisy observability, counterfactuals (perfect predictor/legal enforcement), and the Causal Defense critique.

  2.  **Drafting the Scenario (One Paragraph):**
