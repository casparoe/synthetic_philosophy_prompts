      *   *CDT Attack:* "Binding" is impossible without causal leverage. Restructuring is just a move in the game, not a change in rationality.

      *Wait, one nuance:* If CDT knows she will defect at execution, she knows the Charter is effectively "cheap talk" at the execution stage. If the Board knows CDT agents defect, they won't trust the Charter. But the Board audits *architecture*, not *type*. If the architecture *makes* sharing default but allows override, CDT says override. If the architecture *makes* sharing hard but possible, CDT weighs cost. The prompt says "binds her future self." I must treat the binding as effective *unless* she actively chooses to break it. CDT says break it if benefit > cost of breaking.
