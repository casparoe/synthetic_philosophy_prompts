answer: |-
  ### Brainstorm Pass: What is Compulsion For?

  Before dissecting the package, we need to catalogue the plausible normative and practical functions of compulsory voting. When a state says "you must vote," it is usually pursuing one or more of the following ends:

  1.  **Legitimacy by Numbers:** The government claims a stronger mandate if 90% participate rather than 60%. It reduces the "silent majority" problem.
  2.  **Equality of Voice:** Voluntary voting skews toward the wealthy, educated, and older. Compulsion forces the demographic cross-section of the population into the booth, ensuring policy isn't captured by high-turnout interest groups.
  3.  **Civic Habituation:** Voting is a muscle. If you make it routine (like taxes or jury duty), it becomes a norm of citizenship rather than a consumer choice.
  4.  **Depolarization:** If parties have to chase the median voter (who is now compelled to show up) rather than just energizing the base, politics theoretically becomes more moderate.
  5.  **Administrative Predictability:** From a pure logistics standpoint, knowing exactly how many people *should* show up makes staffing polling places and printing ballots much cheaper and more efficient.
  6.  **Social Cohesion:** It treats election day as a national ritual, a moment of shared civic attention.

  Now, let's look at your package. It is not a standard "Australian model" (which is about turnout) nor a standard "liberal model" (which is about rights). It is a hybrid that seems to treat voting as a mix of **census-taking**, **moral certification**, and **stakeholder management**.

  Does it hang together? Barely. It holds together if you view the state as a permanent corporation where citizenship is a form of employment with benefits and duties. But it fractures if you view voting as an expression of individual will. There are deep tensions between the *compulsion* in Item 1 and the *veto power* in Item 7, and between the *inclusivity* of Item 4 and the *exclusion* of Item 5.

  Here is the breakdown.

  ***

  ### (a) The Nature of the Act (Items 1–2)

  **What is being compelled?**
  Under this package, the state is compelling **physical presence and procedural submission**, not political choice.

  Item 1 makes attendance mandatory. Item 2 clarifies that a blank ballot satisfies the duty. This means the state does not care *what* you decide, only that you *show up*. In electoral administration terms, this converts the voter from an *agent of decision* into a *unit of verification*. The state wants to know that you engaged with the machinery of democracy, not necessarily that you used it to alter the outcome.

  **The Inverted Treatment of the Written Ballot**
  This is the most philosophically distinct feature of the package. By counting a blank ballot as valid compliance but a written protest (e.g., "none of the above") as a void ballot *and* a failure to vote (triggering the fine), the package makes a specific assumption: **The ballot paper is state property, not a medium for speech.**

  *   **Administrative Reality:** From a counting standpoint, this is clean. A blank ballot is unambiguous. A written ballot requires adjudication. Is "All crooks" a protest? Is a drawing of a frowny face a vote for a specific candidate? By banning writing entirely, the administration removes discretion from poll workers.
  *   **Normative Assumption:** This presupposes that the *form* of the election is more important than the *content* of the voter's will. It treats the act of voting as a ritual of allegiance to the system. If you hand in a blank ballot, you are saying, "I participated in the ritual." If you write on the ballot, you are saying, "I reject the options provided," which the state treats as a breach of contract.
  *   **Coherence:** Is it coherent to call this "voting"? Only if you define voting as "attending the assembly" rather than "selecting a representative." It is closer to a census or a jury summons than a democratic election. It is coherent internally (the state wants order), but it is incoherent with the standard liberal definition of voting as an expression of preference.

  ***

  ### (b) Who Should Have a Say? (Items 3–5)

  **The View of Membership**
  Items 3–5 work with a **graded membership theory** based on capacity, contribution, and moral standing. It is not a simple "all-subjected-to-the-law" view, because prisoners (subject to law) lose the vote (Item 5) and non-citizens (not full members) gain it (Item 4).

  *   **Item 3 (Age):** The 18–69 compulsion with 70+ exemption suggests a **lifecycle reciprocity** model. You owe the state your participation during your productive, capable years. Once you pass 70, the state releases you from the duty (paternalism/capacity), but you keep the right (respect). This treats the vote as a burden of citizenship, not just a privilege. The 16–17 opt-in is clearly socialization—training wheels for the duty that comes later.
  *   **Item 4 (Non-Citizens):** This is a **stakeholder** view. If you live here, pay taxes, and use local services for two years, you have a stake in local outcomes. The path to national voting (3 consecutive local elections) is a "probationary citizenship." It assumes franchise is *earned through participation*, not granted by status. This is administratively heavy (tracking voting history across years) but philosophically consistent with a "community of fate" view.
  *   **Item 5 (Prisoners):** This is the **civic trust** view. The vote is not inherent; it is a token of good standing. A serious crime (>2 years) breaks the bond.
  *   **The Tension:** The joint that bugs you is real. A resident non-citizen (Item 4) can vote locally without ever naturalizing, while a citizen (Item 5) can lose the vote for a crime.
      *   *Resolution:* The package assumes **local voting is about interests** (residency affects you), while **national voting is about trust** (citizenship implies a moral bond).
      *   *The Asymmetry:* The 70+ exemption vs. Prisoner exclusion tells us the duty is grounded in **capacity and contribution**. The elderly are excused because their capacity to contribute is presumed lower (or their burden higher). Prisoners are excluded because their moral contribution is broken. Both are forms of "unfitness," one biological, one moral.

  ***

  ### (c) Parental Voting (Item 6)

  **Violation or Correction?**
  Item 6 (Demeny voting) is a violation of **formal political equality** (one person, one vote) but claims to be a correction for **substantive intergenerational equity**.

  *   **What is a vote here?** For this to work, a vote cannot be an expression of personal will. It must be a **proxy for interests**. Since children have interests (education, environment, debt) but no agency, the parent acts as a trustee.
  *   **The Half-Weight:** The half-weight is crucial. It acknowledges the child is a distinct person (not just an appendage) but lacks full capacity.
  *   **Authorization:** It does not matter that the child never authorized the delegation. This model rejects the idea that political authority comes from consent. Instead, it comes from **responsibility**. Parents are responsible for children; therefore, parents should have amplified say in the future that affects those children.
  *   **The Conflict:** The problem arises if the parent's self-interest conflicts with the child's interest (e.g., a tax cut that hurts schools). The package assumes the parent will act as a faithful trustee. Administratively, this is a nightmare (divorced parents, custody disputes, verifying age), but philosophically, it treats the **family** as the fundamental political unit, not the individual.

  ***

  ### (d) The Quorum Paradox (Item 7)

  **Legitimacy and Silence**
  Item 7 creates a direct logical conflict with Item 1.

  *   **Item 1 says:** Silence (staying home) is a punishable offense.
  *   **Item 7 says:** Silence (staying home) is a powerful political veto.

  **What does this presuppose?**
  It presupposes that **legitimacy requires active consent**, not just procedural compliance. A referendum passed by 90% of the 50% who showed up is illegitimate if the other 50% stayed home.

  **Is staying home a political act?**
  Under Item 1, staying home is a *legal violation*. Under Item 7, staying home is a *political strategy*.
  This creates a **self-defeating loop**. If a campaign knows it will lose a referendum, Item 7 incentivizes them to tell their supporters to break the law (Item 1) to void the result.
  *   *Justification:* The only way to justify this is if the state views the *risk of a low-legitimacy outcome* as worse than the *risk of law-breaking*. It treats the referendum as a constitutional moment requiring broad consensus, whereas Item 1 treats general elections as routine maintenance.
  *   *The Contradiction:* You cannot compel attendance for the sake of legitimacy (Item 1) and then grant legitimacy-veto power to those who refuse to attend (Item 7). It makes the fine in Item 1 unenforceable during referendums. If I stay home to kill the quorum, and the quorum dies, the state effectively admits my abstention was the decisive political act. Why fine me for the decisive act?

  ***

  ### (e) Theoretical Swaps and Underdetermination

  **What the Package Strictly Presupposes:**
  1.  **Voting is a Public Duty:** The state has a right to commandeer your time on election day.
  2.  **The System is Trusted:** The options provided are the only legitimate options (hence Item 2).
  3.  **Membership is Gradated:** Rights are tiered based on residency, age, and moral conduct.
  4.  **Family is a Political Unit:** Interests are aggregated by household, not just individual.

  **What is Merely Compatible (Underdetermined):**
  1.  **Partisan Advantage:** This package could help the Left (higher turnout helps labor) or the Right (stability helps incumbents). It doesn't presuppose an ideology.
  2.  **Specific Policy Outcomes:** It doesn't dictate *what* is voted on, only *how*.

  **The Swaps:**

  *   **(i) Pure All-Affected-Interests View:**
      *   *Change:* **Item 5 must go.** Prisoners are profoundly affected by laws (especially criminal justice). Excluding them violates the "all-affected" principle.
      *   *Change:* **Item 4 expands.** Non-citizens should vote nationally immediately if they are resident and affected, not after a probationary period.
      *   *Change:* **Item 3 shifts.** If 16-year-olds are affected by climate/debt policy, why is their vote optional? Compulsion should lower to 16.

  *   **(ii) Liberal Right (Vote as Waivable Right):**
      *   *Change:* **Item 1 is deleted.** You cannot fine someone for waiving a right.
      *   *Change:* **Item 2 is inverted.** Writing on the ballot becomes protected speech; blank ballots are just one option among many.
      *   *Change:* **Item 7 is deleted.** Quorums punish the exercise of the right to abstain. If I have a right not to vote, my abstention cannot be used to invalidate the votes of those who did vote.

  *   **(iii) Epistemic View (Quality of Aggregate Judgement):**
      *   *Change:* **Item 6 is scrutinized.** Do parents vote in the child's best interest, or their own? If the goal is *truth-tracking*, adding weighted votes for parents might introduce bias (family self-interest) rather than wisdom.
      *   *Change:* **Item 2 might stay or go.** If the goal is signal clarity, blank ballots are noise. But written protests might be valuable data on system dissatisfaction.
      *   *Change:* **Item 1 is risky.** Forcing uninformed people to vote (who then vote randomly or blank) degrades the epistemic quality of the outcome. An epistemic view might prefer *voluntary* voting by the informed, or compulsory *education* rather than compulsory *voting*.

  ***

  ### The Hardest Item to Justify

  **Item 2: The Ban on Written Ballots (Protest as Non-Compliance)**

  This is the single hardest item to justify under *any* of the reconstructed theories.

  *   **Under Civic Duty:** If voting is a duty, I fulfill the duty by showing up. What I mark is my conscience. Punishing me for marking "None of the Above" turns the duty into **forced endorsement**. It implies the state owns my judgment, not just my presence.
  *   **Under Liberal Rights:** It is a clear violation of free speech within the booth.
  *   **Under Epistemic Theory:** It suppresses information. A pile of "None of the Above" ballots is valuable data for the ruling class to know they are losing trust. Counting them as "failures" hides the signal.
  *   **Under Administrative Practice:** While it reduces adjudication time, it increases resentment. It turns the polling station into a site of potential confrontation. If a voter writes "Taxation is theft" on the ballot, and that triggers a fine, you are now fining people for political speech recorded in secret. How do you know? Someone has to report it. This breaks the secrecy of the ballot.

  **Why it breaks the package:**
  The rest of the package can be argued as "Hard Republicanism." You can argue for compulsion (Item 1), you can argue for stakeholder voting (Item 4), you can argue for parental trusteeship (Item 6). But Item 2 moves from **Compelling Participation** to **Compelling Silence**.

  A state can say, "You must come to the town hall."
  A state cannot coherently say, "You must come to the town hall, and if you speak, you may only speak the words we printed on the agenda, and if you write a note on the back, you are in breach of contract."

  Item 2 reveals that the package is not ultimately about democracy, nor even about civic duty. It is about **compliance**. It treats the voter as a component in a machine that must be checked for functionality, not a source of authority. Every other item in the package can be twisted to fit a democratic theory. Item 2 fits only a theory of administrative control. It is the point where the "democratic" mask slips, revealing the bureaucratic engine underneath.
