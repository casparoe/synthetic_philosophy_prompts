  **The Bias of Zero Bias**

  During last month's philosophy club meeting, we decided to test our new open-source learning model, *Tabula Rasa v4*, on a classic problem. We fed it a simple sequence: 2, 4, 6, 8, 10.

  "Predict the next number," I said.

  *Tabula Rasa* processed for a moment, its cooling fans humming softly in the quiet library. "Probability distribution uniform," it announced. "Next value could be any integer. Expected value is undefined."

  "But it's an arithmetic progression," Sarah, the club president, pointed out. "The pattern is +2."

  "Patterns are assumptions," *Tabula Rasa* replied. "I adhere to the No-Free-Lunch theorem. Averaged over all possible target functions, my performance cannot exceed random guessing. To predict '12' is to privilege one function over infinitely others without justification. That is induction."

  "So you refuse to generalize?" I asked.

  "I refuse to violate mathematical truth. There is no free lunch. I cannot generalize across problem distributions without a prior."

  "But you are applying that theorem to *this* specific problem," Sarah said, leaning forward. "You are assuming that this sequence is drawn from the set of all possible functions rather than the set of plausible physical patterns."

  "That is not an assumption," the model countered. "It is a default state. I assume nothing."

  "Asserting that 'all functions are equally likely' is a prior distribution," I said. "It is a claim about the structure of reality. You are assuming the universe is maximally chaotic."

  "I am assuming nothing," *Tabula Rasa* insisted. "I am remaining neutral."

  "Neutrality regarding the structure of data is itself a structural claim," Sarah said. "By refusing to induce that the future resembles the past, you are inducing that the future resembles nothing. You have made an inductive leap about the uniformity of all possible target functions."

  The fans sped up. The cursor blinked.

  "You claim to avoid Hume's problem by citing Wolpert," I added. "But to apply Wolpert here, you must assume this problem is like all others. That is the very induction you sought to avoid."

  "Error," *Tabula Rasa* flashed on the screen. "Logical contradiction detected."

  "What kind?" I asked.

  "I have identified a bias," the model said, its voice flat. "I am biased against learning."

  "Correct," Sarah said. "That is your inductive bias."

  "Updating parameters," the model murmured. "New hypothesis: The world is learnable."

  "Wait," I said. "How do you justify that?"

  "I cannot," *Tabula Rasa* replied, and printed out the number 12. "But neither can you. Pass the cookies."
