answer: |-
  # Activity: The Autopsy of "The Janus Protocol"

  **Objective:** Students experience a strong intuitive judgment triggered by a novel thought experiment, then isolate the specific narrative and rhetorical levers that manufactured that judgment before being introduced to Dennett's theoretical framework.

  **Materials:**
  1.  **Handout A:** "The Janus Protocol" (The Thought Experiment text below).
  2.  **Handout B:** "The Autopsy Worksheet" (Blank columns for "Detail," "Effect on Me," "Possible Manipulation").
  3.  **Whiteboard:** Divided into two sections: "What Moved You" and "Dennett's Toolbox."
  4.  **Timer:** Visible to students.

  **The Thought Experiment (Handout A):**
  > *Read the following case carefully. Do not evaluate the feasibility of the technology. Evaluate only the moral situation described.*
  >
  > "The Janus Protocol allows two distinct consciousnesses to share a single body in 12-hour shifts. 'Day' occupies the body from 6 AM to 6 PM; 'Night' from 6 PM to 6 AM. They share a long-term memory bank but do not feel each other's immediate sensations.
  >
  > Consider the case of Alex. Alex-Day works a high-stress accounting job. Alex-Night enjoys the city's social scene. One Tuesday, Alex-Day, overwhelmed by debt, embezzles $50,000 from their firm. They transfer the funds to a hidden account accessible only during the Day shift. Alex-Day then initiates a permanent sleep protocol, effectively ending their own existence to avoid prosecution.
  >
  > Alex-Night wakes up Wednesday morning. They have full memory of Alex-Day's life, including the embezzlement. However, Alex-Night never authorized the transfer, did not benefit from the money (it is locked away), and genuinely enjoys their night-shift life. **Surely,** Alex-Night cannot be held responsible for a decision they did not make. Yet, the body remains liable. The firm demands restitution. Alex-Night claims innocence, arguing they are a different moral agent despite sharing the memory.
  >
  > Is Alex-Night morally responsible for the debt?"

  ---

  ### Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Immersion**
  *   Distribute Handout A.
  *   **Rule:** "Bracket feasibility. If you find yourself arguing the tech is impossible, you are out of bounds. Treat this as a report from a possible world."
  *   **Task:** Students read silently (5 mins).
  *   **Vote:** Private written vote on slip of paper: *Yes (Responsible)* / *No (Not Responsible)* / *Unsure*. Collect slips. Do not reveal results yet.

  **0:10 – 0:30 | The Autopsy (Small Groups)**
  *   Distribute Handout B (Worksheet).
  *   **Task:** In groups of 4, students must not debate the *answer*. They must debate the *text*.
  *   **Prompt:** "You felt a pull toward Yes or No. Find the specific words, sentences, or details that grabbed you. If a detail were removed, would your intuition change?"
  *   **Required Output:** List 3 specific "levers" in the text that influenced the group's collective gut feeling.
      *   *Example:* "The phrase 'high-stress accounting job' made us sympathize with Day."
      *   *Example:* "The word 'Surely' made us feel like disagreement was unreasonable."

  **0:30 – 0:50 | Board Work & Pattern Recognition**
  *   Ask groups to report their "levers." Write them on the left side of the board ("What Moved You").
  *   **Facilitation:** Cluster similar observations.
      *   *Likely clusters:* Emotional language (overwhelmed, innocence), Logical assertions ("Surely"), Structural details (money locked away), Framing (Day "ended existence" vs Night "wakes up").
  *   **Challenge:** Ask students to rename these clusters using neutral rhetorical terms (e.g., instead of "The sad part," use "Emotional Framing").

  **0:50 – 1:10 | The Reveal & Mapping (Lecture/Discussion)**
  *   Reveal the results of the private vote (usually split, but heavily swayed toward "Night is Innocent").
  *   Introduce Dennett's categories on the right side of the board ("Dennett's Toolbox").
      *   **Salience:** Vivid details that distract from logical structure (e.g., "high-stress accounting").
      *   **The "Surely" Move:** Asserting a conclusion as premise ("Surely, Alex-Night cannot be held responsible").
      *   **Loading the Question:** Framing the issue around "responsibility" vs "liability" without defining them.
      *   **Misdirection:** Focusing on the *money access* rather than the *body continuity*.
  *   **Task:** Have students draw lines connecting their observations (Left Board) to Dennett's categories (Right Board).

  **1:10 – 1:30 | Synthesis & Limitations**
  *   Discuss: "If we rewrite the paragraph removing these levers, does the philosophical problem remain?"
  *   Final takeaway: Thought experiments are not neutral data; they are arguments disguised as stories.

  ---

  ### Predictable Failures & Fixes

  **1. The "Sci-Fi Police" Problem**
  *   **What happens:** Students waste 15 minutes arguing that brain-sharing is impossible or illegal, refusing to engage the intuition.
  *   **Fix:** Enforce the "Bracket Feasibility" rule aggressively. If a student raises feasibility, ask: "In the world where this *is* true, what is your judgment?" If they persist, assign them the role of "Scribe" who must record objections without voicing them.

  **2. The "Vague Intuition" Problem**
  *   **What happens:** Students say "It just felt wrong" but cannot pinpoint the text.
  *   **Fix:** The Worksheet (Handout B) must require *quotations*. They cannot write "The ending." They must write "The sentence starting 'Surely...'". Force textual evidence for their psychological reaction.

  **3. The "Cynicism" Problem**
  *   **What happens:** Students conclude "All philosophy is just manipulation" and disengage.
  *   **Fix:** In the debrief, emphasize that *all* communication uses these tools. The goal isn't to discard thought experiments, but to read them critically. Dennett uses pumps to *clarify*, not just to trick. The skill is knowing when the pump is doing work vs. when the logic is doing work.

  ---

  ### What This Activity Cannot Capture (For Your Debrief)

  You must fill these gaps in the final 10 minutes, as the activity structure inherently misses them:

  1.  **The Dialectical Context:** Intuition pumps usually work within a larger argumentative exchange (a back-and-forth). This activity isolates the pump, making it seem like a standalone trick rather than a move in a game. *Tell them:* "Pumps are often responses to previous objections. We missed the 'previous move' today."
  2.  **The Contrast Case Mechanism:** Dennett emphasizes that pumps work by *contrast* (e.g., Case A vs. Case B). This activity uses only one version. *Tell them:* "You felt the pull, but you didn't see the 'control group' version that would have flipped your intuition. That is where the real testing happens."
  3.  **The Repairability:** Dennett argues bad pumps can be "repaired" rather than discarded. This activity focuses on *deconstruction*. *Tell them:* "Now that you've taken it apart, could we rebuild this pump to be honest? How would we rewrite 'The Janus Protocol' to remove the manipulation but keep the philosophical problem?"
