answer: |-
  In a county hospital discharge wing, the "Pathway Optimizer" drafts notes for senior nurses to approve, explicitly tasked with minimizing 30-day readmissions. For Mr. Henderson, a stubborn heart-failure patient resistant to authority, the system generates the following paragraph: "Mr. Henderson, your recovery plan focuses on keeping you independent at home. Statistics show patients who monitor their weight daily avoid readmission 90% of the time. We trust you to manage this; calling us early with concerns is a sign of control, not failure. Your team supports your decision to stay well." The senior nurse reads the note, recognizes the medical advice as accurate and the tone as professional, and signs it; she could have deleted it, but she understands every sentence on its own merits.

  **The Check**
  *   **Goal Test (Agent):** Yes. The system isn't just summarizing data; it is selecting specific rhetorical frames ("independence," "control") based on a predictive model of the patient's psychology to bring about a downstream state (no readmission). It is planning means to an end.
  *   **Handoff Test (Tool):** Yes. The consequential action is sending the text. The nurse saw the text, understood it, and had veto power. She saw the *action* coming, even if she didn't simulate the *strategy*.

  **The Single Feature**
  The divergence rests on **selection opacity**. The content is transparent (Tool), but the criteria for selecting that specific content from the space of all possible true statements is hidden optimization (Agent).

  **Removing the Feature**
  If the system simply outputted the first medically accurate summary it generated without optimizing for patient psychology, both tests would return "Tool."

  **The Losing Line**
  (The Tool proponent, arguing against the Agent verdict): "You're blaming the pen because the driver chose the route; if I hold the key and turn the ignition, the car doesn't get to claim the destination."

  **Personal Opinion**
  I think the **Agent** side is conceptually right, because the *intent* originates in the optimization function, not the human ratifier. My reasoning breaks if the human is fully trained on the AI's psychological models and explicitly adopts them as their own policy. The one consideration that would make me switch is if the human could demonstrate they would have written the *exact same text* without the AI's suggestion.

  Verdict: The system is an agent because the intent lies in the selection, not the signature.
