answer: |-
  She will rule history for the estate's destruction and the loss of deeds but legend for the single catastrophic storm, applying a rule of causal independence that accepts material traces only when they cannot be products of the tradition itself.

  She operates by three candidate rules better than your instruments. First, **Causal Independence**: material or documentary traces corroborate tradition only if they cannot be explained as downstream products of that tradition (distinguishing *Ford* from *Martyr*). Second, **Adverse Interest**: details that undermine the narrator's position or defy hagiographic tropes are credible, while aggrandizing details are rejected (distinguishing *Law-giver* and *Exodus* servitude from *Troy* divine machinery). Third, **Narrative Compression**: broad processes are accepted as history, but specific dramatic singularities are rejected as legendary embellishment (distinguishing *Troy* war from *Horse*, *Exodus* group from *Mass*).

  Applied to the Abbey case, **Causal Independence** predicts history for the estate's destruction because the rent rolls and clay layer exist independently of the chronicle; the tradition did not create the mud. **Narrative Compression** predicts legend for the single storm because the geology shows progressive inundation (1250–1330) rather than a single day, matching the *Troy* pattern of accepting the conflict but rejecting the singular dramatic device. **Adverse Interest** predicts history for the lost deeds; claiming loss explains the missing folios, but forging charters would have been cheaper and more advantageous than leaving a physical gap in the cartulary, paralleling the *Law-giver*'s clauses that restricted the crown.

  She will deliver a split verdict. The closest analog is *Ford*: material evidence (grave/clay) supports the core event (battle/inundation), while specific narrative details (portents/single date) are rejected. The competing analog is *Martyr*: material evidence (spring/cross) exists but is dismissed because the cult likely produced the site. The tie breaks toward *Ford* because the rent rolls are administrative records unrelated to the abbey's hagiographic interests, whereas the *Martyr*'s spring was the focus of the cult itself.

  Her record is not consistent across the three levels you distinguished; she changes the question between cases. In *Arthur*, she asks whether the agent existed (no); in *Troy* and *Ford*, she asks whether the event occurred as described (no); in *Exodus* and *Law-giver*, she asks whether the tradition explains otherwise inexplicable data (yes). She adjusts the threshold of proof to the claim type: existence requires necessity, description requires independence, and origin requires counter-intuitive specificity.

  A rule like hers ought to treat self-sealing content as a defeater unless physical constraints make fabrication implausible. In *Exodus*, the lack of Egyptian record is self-sealing but accepted because servitude is an unlikely invention. In the Abbey case, the claim that deeds were lost is self-sealing (explaining the loss of evidence with a story), but it becomes evidence because the physical gap in the binding is harder to fake than the story. Self-sealing is neutral until tested by the economics of forgery.

  The single further piece of evidence that would best separate the rules is a geological report precisely dating the abrupt sand sheet to 1287. If the sand sheet dates exactly to 1287, the **Narrative Compression** rule is refuted, proving the singular catastrophic event was historical rather than a legendary condensation of a process. I expect the **Narrative Compression** rule to be refuted only if such dating emerges; otherwise, it stands, and the storm remains legend.
