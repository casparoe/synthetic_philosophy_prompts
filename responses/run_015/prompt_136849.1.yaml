  **Mechanics:** Each round, pairs choose Option S (Safe) or Option R (Risky). Resolve Risky via d100 roll. Safe yields 10 tokens guaranteed. Risky yields 0 or $V$ based on probability $p$. Payoff tables are public; choices are private.
  *   Round 1: $p=50\%$, $V=15$ (EV 7.5). *Consensus: Safe.*
  *   Round 2: $p=20\%$, $V=40$ (EV 8). *Consensus: Safe.*
  *   Round 3: $p=10\%$, $V=200$ (EV 20). *Shift begins.*
  *   Round 4: $p=1\%$, $V=5,000$ (EV 50). *Risky dominates.*
  *   Round 5: $p=0.1\%$, $V=100,000$ (EV 100). *Fanaticism.*

  Reveal outcomes immediately. If a pair hits 0 tokens, they are "bankrupt" but receive a 5-token bailout to continue playing (crucial for experiencing the final round).

  **Debrief Plan:**
  1.  **Mapping:** Ask pairs to plot their choices. Highlight Rounds 1-2 as intuitive risk-aversion driven by psychological **probability weighting** (overweighting small risks of loss). Contrast with Rounds 4-5 where **value scaling** overwhelms probability; the magnitude of $V$ forces **dominance** regardless of $p$. This demonstrates that if utility is linear, EV fanaticism is rational.
  2.  **Predictable Failures:** Students may refuse Round 5 due to "ruin aversion," fearing zero payoff. They might view tokens as having diminishing marginal utility.
      *   *Recovery:* If most reject Round 5, reveal the EV calculations publicly. Ask: "If you played this 1,000 times, which wins?" This shifts perspective from single-case intuition to long-run frequency, isolating the EV principle.
  3.  **Simulation Limitations:** The game cannot reproduce **diminishing marginal utility of welfare**. In the game, 100,000 points is strictly 10,000 times better than 10 points. In reality, surviving vs. dying (or modest comfort vs. infinite bliss) involves non-linear utility curves.
      *   *Facilitator Supply:* You must verbally explain that fanaticism relies on linear utility assumptions. Real-world agents reject Pascal's Mugging because utility saturates or probabilities are epistemically unstable, not because the math is wrong. The game proves the math; you must supply the metaphysical critique. Note that the "bailout" rule artificially removes the risk of ruin, which is necessary to isolate EV reasoning from survival instincts. Without the bailout, risk-of-ruin dominates EV, masking the fanaticism. The facilitator must clarify that standard decision theory assumes no ruin threshold, whereas human psychology imposes one.

  **Timing:** 10 mins setup, 25 mins play, 45 mins debrief/lecture.
