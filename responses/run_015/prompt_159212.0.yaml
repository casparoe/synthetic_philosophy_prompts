          *   It distinguishes between *causal responsibility* (the system failed) and *moral/role responsibility* (you didn't do your job).
          *   This aligns with Strawson: We suspend reactive attitudes for the *cause* (objective), but reinstate them for the *response* (participant).
      *   **Conclusion:** The practice is a "controlled suspension" of reactive attitudes, not an elimination. The inconsistencies the user sees are the seams showing.

  5.  **Refining the Tone:**

