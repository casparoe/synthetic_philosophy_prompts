answer: |-
  # JOINT STATEMENT ON THE ORIGINS OF MACHINE INTELLIGENCE
  **Date:** October 26, 2023
  **Signatories:** The Proponent of the Turing "Child Machine" Hypothesis (Turing-Defender) and The Proponent of the Innate Structure Hypothesis (Nativist-Defender).

  Following a period of adversarial collaboration, we issue this statement to clarify our points of consensus, precisely formulate our remaining disagreements, identify the empirical cruxes that bear on these disagreements, and register pre-commitments regarding evidence that would adjudicate the dispute.

  ## I. AREAS OF CONSENSUS

  We agree on the following propositions regarding learning, education, structure, and evidence:

  1.  **Definition of General Intelligence:** We define "General Intelligence" (GI) functionally as the capacity of a system to adapt to a wide variety of novel environments and tasks, achieving performance comparable to an adult human, without task-specific re-engineering.
  2.  **Necessity of Interaction:** We agree that intelligence does not manifest in a vacuum. Both sides accept that a system requires interaction with an environment (data, sensory input, reward signals) to develop intelligent behavior. There is no "pre-loaded" adult-level knowledge that bypasses the need for experience.
  3.  **Existence of Initial State:** We agree that no learning system begins as a true *tabula rasa* in the physical sense. Even a "randomly connected network" (as Turing described) possesses a physical architecture, an activation function, and a learning rule. The dispute is not about the *existence* of an initial state, but about the *specificity* of that state relative to the target tasks.
  4.  **Role of Education:** We agree that "education" (curated data, reinforcement, instruction) is the mechanism by which the system's parameters are adjusted. We disagree only on the extent to which education *creates* cognitive structure versus *triggering* or *parameterizing* pre-existing cognitive structure.
  5.  **Empirical Adjudication:** We agree that this is not a purely philosophical dispute. It is an empirical hypothesis about computational learning theory and cognitive science. The validity of either view depends on the performance of actual systems under controlled constraints (specifically data efficiency and systematicity).
  6.  **Verbal Clarification on "Structure":** We acknowledge that a portion of our prior dispute was verbal. We agree to distinguish between **Domain-General Structure** (e.g., gradient descent, backpropagation, attention mechanisms, memory buffers) and **Domain-Specific Structure** (e.g., innate grammatical categories, object permanence modules, intuitive physics engines). The Turing-Defender argues Domain-General Structure is sufficient; the Nativist-Defender argues Domain-Specific Structure is necessary.

  ## II. PRECISE FORMULATIONS OF DISAGREEMENT

  We formulate our opposing positions such that each signatory affirms the wording of their own position without conceding the other.

  | **The Turing-Defender Position (Learning-First)** | **The Nativist-Defender Position (Structure-First)** |
  | :--- | :--- |
  | "A system initialized with **only domain-general learning architectures** (e.g., generic neural topologies and general-purpose optimization rules), when subjected to sufficient educational input and computational scaling, will develop the functional equivalents of domain-specific structures internally." | "A system initialized with **only domain-general learning architectures** will fail to achieve human-level General Intelligence within realistic data and time budgets, because the hypothesis space is too vast to be constrained by data alone without **innate domain-specific inductive biases**." |
  | "The 'structure' required for intelligence is an *emergent property* of the learning process, not a *precondition* of it." | "The 'structure' required for intelligence is a *precondition* of effective learning, evolved to constrain the hypothesis space to tractable subsets relevant to the organism's niche." |

  ## III. CRUXES, EVIDENCE, AND PRE-REGISTERED PREDICTIONS

  We identify three specific cruxes where our predictions diverge. For each crux, we specify the evidence that bears on it and our respective predictions.

  ### Crux 1: Sample Efficiency in High-Level Cognition
  **Question:** Can a system with only domain-general architecture learn complex, structured tasks (e.g., natural language syntax, causal reasoning) with human-level sample efficiency?

  *   **Accepted Evidence:** Experiments measuring the amount of data (tokens, interactions, or hours) required for a system to reach human-level performance on standardized reasoning benchmarks, controlling for compute.
  *   **Turing-Defender Prediction:** As computational scale increases, the data efficiency gap between "structured" and "unstructured" systems will close. A sufficiently large generic model will match human sample efficiency via latent structure discovery.
  *   **Nativist-Defender Prediction:** Generic models will exhibit a hard plateau in sample efficiency. They will require orders of magnitude more data than humans to learn the same structured rules, indicating the lack of innate constraints.

  ### Crux 2: Systematic Generalization (Out-of-Distribution)
  **Question:** Can a system generalize rules to novel combinations of symbols or concepts it has never encountered during training (e.g., understanding "the red ball is above the blue square" when trained only on "blue ball above red square")?

  *   **Accepted Evidence:** Tests of compositional generalization (e.g., SCAN dataset, COGS) where training and testing distributions differ systematically.
  *   **Turing-Defender Prediction:** With appropriate architectural scale and training diversity, domain-general systems will demonstrate robust systematic generalization indistinguishable from systems with innate compositional biases.
  *   **Nativist-Defender Prediction:** Domain-general systems will fail at systematic generalization outside their training distribution unless explicit compositional inductive biases are hard-coded into the architecture.

  ### Crux 3: The Nature of "Learned Structure"
  **Question:** If a generic system succeeds, does it internally represent information using structures isomorphic to human cognitive modules (e.g., grammar trees, causal graphs)?

  *   **Accepted Evidence:** Mechanistic interpretability studies (probing internal representations, attention heads, and activation patterns) to identify if human-like structural primitives emerge.
  *   **Turing-Defender Prediction:** Interpretability analysis will reveal that successful generic systems spontaneously develop internal representations functionally isomorphic to domain-specific modules (e.g., "grammar neurons") because they are optimal solutions.
  *   **Nativist-Defender Prediction:** Successful systems will rely on high-dimensional statistical correlations that mimic structural behavior without instantiating true structural representations, making them brittle in edge cases where humans are robust.

  ## IV. NOTE ON VERBAL DISPUTE

  We conclude that a subset of our historical disagreement was verbal regarding the definition of **"Innate."**

  *   **The Confusion:** The Turing-Defender often uses "unstructured" to mean "lacking task-specific knowledge," while the Nativist-Defender hears "lacking physical constraints." Conversely, the Nativist-Defender uses "innate" to mean "genetically specified architectural bias," while the Turing-Defender hears "magical pre-loaded knowledge."
  *   **The Resolution:** We agree that **all** machines have "innate" physical architecture. The substantive dispute is not about *whether* there is innate structure, but about the **granularity and specificity** of that structure.
      *   If the Turing-Defender concedes that a "learning rule" is a form of "innate structure," the Nativist-Defender must clarify that they require *content-rich* structure (e.g., priors about objects or agents), not just *procedural* structure (e.g., backpropagation).
      *   Once this distinction is made, the dispute is no longer verbal but empirical: *Is procedural structure sufficient to derive content-rich structure from data alone?*

  **Signed,**

