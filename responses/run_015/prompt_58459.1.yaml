answer: |-
  Here is the specification list for a theory of composition (mereology) that balances folk intuition with scientific rigor, followed by the critical analysis of constraints you requested.

  ### The Desiderata List

  **1. Ordinary Object Validation**
  *   **What:** The theory must affirm that standard medium-sized dry goods (chairs, rocks, dogs) exist as single units, not just as clouds of atoms.
  *   **Why:** If the theory says chairs don't exist (Nihilism), it fails the "everyday counting" test. Language and physics both rely on treating these clusters as causal agents (e.g., "the chair broke the fall," not "the atoms arranged chair-wise broke the fall").

  **2. Artifact Intentionality Sensitivity**
  *   **What:** The theory must distinguish between a functional artifact (assembled bookshelf) and a mere pile of parts (disassembled bookshelf in the garage), even if the material contact is identical.
  *   **Why:** Artifacts depend on human purpose. A pile of wood and a shelf are materially similar but ontologically distinct in how we count and use them. A theory ignoring intentionality cannot explain why the garage pile doesn't count as a shelf yet.

  **3. Bond Strength Discrimination**
  *   **What:** The theory must distinguish between parts that are merely touching (stacked coins) and parts that are physically bonded (glued coins), without relying solely on human interest.
  *   **Why:** Physics treats chemical bonds differently than proximity. If the theory counts stacked coins as a single object just because they touch, it overgenerates (Universalism). If it denies the glued coins are a unit, it undergenerates. The physical causal integration matters.

  **4. Functional Integration Over Origin**
  *   **What:** The theory must allow a part to belong to a whole based on current systemic function, regardless of its history (e.g., a transplanted heart beating in a new body).
  *   **Why:** Biology treats organisms as functional systems. If composition depended on original origin, a transplanted organ would remain part of the donor, which contradicts medical and biological reality. The *system* defines the whole, not the *history*.

  **5. Scattered vs. Unified Ontology**
  *   **What:** The theory must explain why "all the plastic in the ocean" is a collection, but "a chair" is an object, without arbitrary line-drawing.
  *   **Why:** We need to count the plastic for policy, but it lacks the causal unity of a chair. A theory that treats them identically (both are objects or neither are) fails to capture the difference in how they behave and persist.

  **6. Process/Pattern Identity**
  *   **What:** The theory must account for entities that maintain form while replacing all matter continuously (e.g., a wave, a flame, a living organism).
  *   **Why:** Physics and biology recognize dynamic stable states. If the theory requires strict matter-constancy (the same atoms must stay), it denies the existence of waves and organisms. The *structure* must be allowed to constitute the object, not just the *stuff*.

  **7. Tolerance for Boundary Vagueness**
  *   **What:** The theory must allow that there is no precise atom where a chair ends and the air begins, without collapsing into "nothing exists."
  *   **Why:** Macroscopic objects have fuzzy edges (dust, surface atoms). Demanding sharp boundaries forces a mismatch with physical reality. The theory must handle "ontic vagueness" or admit our concepts are vague, without denying the object.

  **8. Diachronic Resilience (Persistence)**
  *   **What:** The theory must explain when a thing survives part replacement (Ship of Theseus) and when it ceases to exist (shredded chair).
  *   **Why:** Objects change. If losing one screw makes a bookshelf cease to exist, counting becomes impossible. If replacing every plank keeps it the same, we need a limit. The theory must define the *threshold* of destruction.

  ***

  ### Distinctions The Theory Cannot Collapse

  A viable theory must keep these conceptual lanes separate. If it merges them, it fails the biologist or physicist test.

  1.  **Existence vs. Convenience:** The theory must distinguish between things that exist independently of us (rocks, hearts) and things that exist only because we find them useful to group (constellations, "the plastic in the ocean"). Collapsing this makes ontology purely linguistic, which physics rejects.
  2.  **Touching vs. Stuck vs. Working:** Mere contact (touching) cannot be treated the same as chemical bonding (stuck), which cannot be treated the same as functional interdependence (working). A theory that equates touching with bonding fails physics; a theory that equates bonding with function fails biology (e.g., a dead heart is bonded but not functioning).
  3.  **Heap vs. Organism vs. Scattered:** A heap (sand) has no internal organization. An organism (dog) has self-maintaining organization. A scattered object (archipelago) has spatial separation. Treating a dog like a heap ignores biology; treating a heap like a dog ignores physics.

  ***

  ### Critical Analysis of Requirements

  **Non-Negotiable Requirements**
  *   **Ordinary Object Validation (#1):** If you can't count chairs, you can't do everyday life.
  *   **Functional Integration Over Origin (#4):** Biology demands this. A heart is defined by its role in the circulatory system, not where it grew.
  *   **Process/Pattern Identity (#6):** Physics demands this. Denying waves or flames because matter flows through them is scientifically illiterate.

  **Prejudices (Camp-Specific Biases)**
  *   **Demand for Sharp Boundaries (part of #7):** The insistence that there *must* be a specific atom where the object ends is a prejudice from classical logic. Reality is likely fuzzy; demanding precision here is a human bias, not a worldly fact.
  *   **Matter-Constancy (Counter to #6):** The intuition that an object must be made of the *same stuff* to persist is a folk prejudice. Processes refute this.

  **Incompatible Pairs (Tensions)**
  *   **Artifact Intentionality (#2) vs. Functional Integration (#4):** Intentionality is mind-dependent; Function is often mind-independent. A theory struggles to explain why a *natural* rock is an object (function/physics) but a *broken* chair might not be (lack of function), while a *broken* heart is still a heart (origin/structure). Balancing human purpose with biological reality is the hardest tension.
  *   **Tolerance for Vagueness (#7) vs. Diachronic Resilience (#8):** If boundaries are vague, it is hard to define exactly *when* enough parts are lost that the object ceases to exist. You cannot have perfect tolerance for fuzziness and a precise threshold for destruction simultaneously.

  **The "Killer" Requirement**
  *   **The Requirement:** **Non-Arbitrary Discrimination of Causal Unity.**
      *   *Definition:* The theory must explain *why* composition occurs in some cases (glued coins, hearts) and not others (scattered plastic, stacked coins) based on objective causal facts, not just human interest or brute fact.
  *   **Why it knocks out simple views:**
      *   **Knocks out "Always-Compose" (Universalism):** Universalism says *any* parts make a whole. It cannot distinguish the glued coins from the coins-plus-chair. It fails discrimination.
      *   **Knocks out "Never-Compose" (Nihilism):** Nihilism says *no* parts make a whole. It denies causal unity exists at the macro level. It fails the "Unity" test.
      *   **Knocks out "Brute Sometimes" (Brutalism):** Views that say "composition just happens sometimes" without a rule fail the "Non-Arbitrary" test. They offer no spec, just a shrug.
  *   **Score:** This is the only constraint that forces a theory to do actual work rather than taking an extreme shortcut.
