answer: |-
  There is no single, universally established noun in common parlance that captures exactly this combination of bookkeeping asymmetry, date-shifting, and mechanism drift. However, in the philosophy of science and critical reasoning, the structural move you are describing is known as an **Immunization Strategy**.

  For your column, the most defensible concept is **Asymmetric Immunization**.

  Here is the breakdown of the concept, its edges, and how it handles the specific distinctions you raised.

  ### 1. The Core Concept: Immunization Strategy
  In critical rationalism (specifically the work of Hans Albert and Karl Popper), "immunization" describes the practice of protecting a theory from refutation by making adjustments that are not themselves tested. A theory is scientifically robust if it risks being wrong. A theory is immunized if it arranges its terms so that it cannot be wrong.

  Your forecasters are engaging in immunization. They possess a "hard core" (the mechanism: population outstrips food, resources run out) and a "protective belt" (the date, the specific resource, the definition of collapse). When data strikes the protective belt (the date passes), they adjust the belt rather than the core.

  ### 2. Your Two Moves: Auxiliary Adjustment vs. Concept Stretching
  Your intuition about "date-shifting" and "mechanism drift" is correct and maps onto established logical distinctions within immunization.

  *   **Date-Shifting (Auxiliary Adjustment):** This is the claim that an external, temporary factor interfered with the mechanism. (e.g., "The Green Revolution was a one-off reprieve.") Logically, this adds an **auxiliary hypothesis**. It is defensible *if* the auxiliary hypothesis is independently testable. It becomes immunization when the auxiliary hypothesis is unfalsifiable (e.g., "The reprieve was caused by temporary factors" without specifying which ones, or specifying ones that cannot be measured).
  *   **Mechanism Drift (Concept Stretching):** This is when the definition of the predicted event changes to match whatever happens. (e.g., Predicting "physical exhaustion" of oil, then claiming vindication from a "price spike.") This is **concept stretching**. It renders the original prediction vacuous because the term "exhaustion" now covers both physical absence and economic scarcity.

  **Verdict:** These are the two joints of the mechanism. You should name them as such. They are distinct logical errors: one protects the *timing*, the other protects the *outcome*.

  ### 3. The Asymmetry: Essential or Incidental?
  You asked whether the asymmetry (doom forecasts get a pass; boom forecasts do not) belongs inside the definition.

  Logically, immunization can apply to anything (e.g., a religious prophecy of salvation). However, for the *sociological phenomenon* you are writing about, the asymmetry is **definitional**.

  If a fusion forecaster says, "I was right but early," and the scientific community accepts it, that is **honest lag**. If a famine forecaster says, "I was right but early," and the scientific community accepts it, that is **Asymmetric Immunization**.

  The asymmetry exists because the cost of error is perceived differently. A false positive on fusion is a disappointment; a false negative on famine is a moral hazard. Forecasters exploit this moral asymmetry to gain logical immunity. Therefore, for your column, you should treat the asymmetry as part of the concept. It is not just that they are immunizing; it is that they are **selectively immunizing** based on the valence of the prediction.

  ### 4. Boundary Case: The Arrhenius Forecast (Valid Lag vs. Immunization)
  You asked about a nineteenth-century calculation linking carbon to temperature that was vindicated after a long lag. Is this the same phenomenon?

  **No.** The distinction lies in **Model Revision**.

  *   **Valid Scientific Lag:** When the prediction failed to materialize on schedule, climate scientists did not simply say, "Wait longer." They investigated *why* the warming was delayed. They discovered aerosols, ocean heat uptake, and carbon cycle feedbacks. They **updated the model**. The core mechanism (greenhouse effect) remained, but the quantitative understanding of the system changed to account for the delay.
  *   **Immunized Forecast:** The Malthusian or Limits to Growth forecasters typically do not update the model. They do not say, "Our understanding of agricultural yield functions was wrong." They say, "The yield functions were right, but the input data was temporarily anomalous."

  **The Test:** If the forecaster uses the miss to refine the *mechanism*, it is science. If they use the miss to refine the *excuse*, it is immunization.

  ### 5. The Withdrawal Point: When does delay become withdrawal?
  You asked at what point delay stops being a defence and starts being a withdrawal.

  In the philosophy of research programmes (Imre Lakatos), a theory becomes "degenerating" when the protective belt becomes more complex than the hard core.

  **The Definition:** Delay becomes withdrawal when the **explanation for the delay requires more assumptions than the prediction itself.**

  *   *Example:* "Famine will happen by 1900." (1 Assumption)
  *   *Misses.*
  *   *Revision:* "Famine will happen by 2000, unless technology intervenes, but technology is finite, though policy might change, though climate might shift..." (10 Assumptions).

  When the "unless" clause grows larger than the "will" clause, the forecast has effectively been withdrawn, even if the words remain. A practical rule of thumb for your column: **If the reason for the delay was not specified in the original forecast, the delay is an ad hoc rescue.**

  ### 6. Recommended Terminology for Print
  "Immunization Strategy" is accurate but academic. "Moving the Goalposts" is too colloquial and implies cheating rather than structural rigidity.

  For your column, I recommend using **Asymmetric Falsifiability**.

  *   **Why:** It highlights the bookkeeping error you identified. It points out that the forecast accepts confirmation but rejects disconfirmation.
  *   **How to define it in text:** "A forecast is asymmetrically falsifiable when misses are treated as delays, but hits are treated as vindications. In this system, time only flows in one direction: toward the catastrophe. If the catastrophe arrives, the model was right. If it does not, the model was early. There is no state in which the model is wrong."

  This phrasing is difficult for a forecaster to refute because it describes the *structure of their argument*, not the *truth of their claim*. They can argue they are right; they cannot argue that they don't treat misses as delays.

  ### Summary for your Column
  *   **Concept:** Asymmetric Immunization (or Asymmetric Falsifiability).
  *   **The Two Moves:** Auxiliary Adjustment (Date-shifting) and Concept Stretching (Mechanism drift).
  *   **The Asymmetry:** Essential to the definition. It distinguishes this from honest scientific uncertainty.
  *   **The Boundary:** Valid forecasts update the *model* when wrong; immunized forecasts update the *context*.
  *   **The Withdrawal:** When the excuses outweigh the prediction.

  This framework allows you to critique the *method* without needing to prove the *catastrophe* won't happen. It leaves the door open for them to be right eventually, but closes the door on their current bookkeeping.
