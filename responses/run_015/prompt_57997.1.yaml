      *Okay, let's finalize the four theses.*

      1.  **The Conceptual Contradiction Thesis:** Universalization makes the act description logically impossible.
      2.  **The Causal Self-Defeat Thesis:** Universalization makes the *goal* of the act impossible to achieve (empirically).
