      *   *Thesis 3: The Volitional Self-Defeat Thesis.* (Focus: Agent's Will). I cannot *will* this as a universal law because I want my letter to work.
      *   *Thesis 4: The Threshold/Coordination Thesis.* (Focus: "Everyone" as a critical mass). It's not literally everyone, but enough people to tip the scale.

