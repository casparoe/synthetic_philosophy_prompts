      *   *Indistinguishability:* In QM/StatMech, identical particles are indistinguishable. Counting microstates requires $1/N!$ (Gibbs correction). Taurek might be arguing that treating people as distinguishable units to be summed is like ignoring the Gibbs paradox. *Correction:* Actually, Taurek cares about the *individuality* of the loss, not the indistinguishability. If anything, he argues against treating them as a *collective* fluid. So, maybe the issue is about *ensembles*.
      *   *Macrostate vs. Microstate:* Saving 5 is a macrostate description. Saving *this specific person* is a microstate description. Taurek prioritizes the microstate perspective (the individual experience) over the macrostate (the group statistic).
