  10. **Final Polish:** Ensure the distinction between *impossibility* and *difficulty* is clear. Arrow proves impossibility under *strict* axioms, not impossibility of useful approximation.

  *(Self-Correction on the "Individual Rationality" mapping)*: The prompt asks to map Arrow's conditions to "axioms of individual rationality scaled up." I need to be careful here. Standard rational choice theory *does* assume Transitivity and sometimes IIA (independence from irrelevant alternatives is often linked to Luce's choice axiom or similar in individual psychology, though behavioural econ shows violations). I should highlight that individual rationality is descriptive/normative mix, whereas Arrow is purely normative/axiomatic.

  Let's assemble the response.

