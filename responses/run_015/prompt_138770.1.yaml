prompt: |-
  In my reading group on AI alignment someone keeps saying that RLHF is just social choice, and that Arrow's theorem kills it: if no aggregation rule can have unrestricted domain, Pareto, independence of irrelevant alternatives and non-dictatorship while staying transitive, then there's no such thing as "what humans want" for a model to be aligned to, so we should stop aggregating and just optimise one well-specified objective (or hand the decision to a single principal).

  What I want audited is the analogy underneath that: a group's preferences are like a single person's — the will of the people is like a person's will, and Arrow's conditions are just the axioms of individual rationality scaled up (transitivity as coherence, IIA as menu-independence, Pareto as more-is-better, unrestricted domain as being able to rank anything, non-dictatorship as no one consideration always winning). Give me the correspondence table first, then take it apart: where does the mapping break — IIA surely isn't a rationality condition at all and individuals are themselves menu-dependent, nobody inside a person misreports their own tastes the way voters do strategically, Arrow throws away intensities and interpersonal comparisons that individual decision-making uses, and what would a "dictator" even be inside one agent? Then tell me which of those disanalogies actually carry weight for the conclusion he wants and which are noise.

  Does "there is no coherent thing that humans want" survive, or does Arrow only show that no rule satisfies all those conditions jointly, while leaving plenty of room for rules that behave fine on structured profiles like single-peaked ones? And if group-as-person is the wrong analogy, what's a better one for aggregating a bunch of people's preferences into one training objective? Answer in British English please, and fairly tightly — I'm presenting this tomorow.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** AI Alignment reading group.
      *   **Opposing View:** RLHF is social choice; Arrow's Impossibility Theorem proves "what humans want" doesn't exist; therefore, stop aggregating and optimize for a single principal/objective.
      *   **Task:** Audit the analogy (Group Preferences $\approx$ Individual Preferences).
      *   **Requirements:**
          1.  Provide a correspondence table (Arrow's conditions vs. Individual Rationality).
          2.  Take the analogy apart (where does it break?).
          3.  Evaluate which disanalogies matter for the conclusion ("stop aggregating").
          4.  Address the "no coherent thing humans want" claim (Arrow's scope vs. structured profiles).
          5.  Suggest a better analogy for aggregating preferences into a training objective.
          6.  **Style:** British English, fairly tight/concise (for a presentation tomorrow).

  2.  **Deconstruct the Opposing Argument:**
      *   Premise 1: RLHF aggregates human preferences (Social Choice).
      *   Premise 2: Arrow's Theorem applies to this aggregation.
      *   Premise 3: Arrow's Theorem implies no rational aggregate preference order exists.
      *   Conclusion: "What humans want" is incoherent; switch to single principal/objective.
      *   *Core Analogy:* A collective of humans is structurally identical to the sub-components of a single human mind.

  3.  **Drafting the Correspondence Table:**
      *   Need to map Social Choice terms to Individual Rationality terms as the user suggested, but critically.
      *   *Unrestricted Domain:* Any logical preference profile vs. Any conceivable mental state.
      *   *Pareto:* If everyone prefers X, group prefers X vs. If all sub-systems prefer X, agent prefers X.
      *   *IIA:* Ranking X/Y depends only on X/Y vs. Preference X/Y independent of Z.
      *   *Transitivity:* Group order is transitive vs. Individual order is transitive.
      *   *Non-Dictatorship:* No single voter dictates vs. No single sub-system dictates.

  4.  **Taking the Analogy Apart (The Critique):**
      *   *IIA:* Is IIA a rationality condition for individuals? Not really. Context effects (attraction effect, compromise effect) are common in psychology. Individuals violate IIA all the time. So why demand it of groups?
      *   *Strategic Voting:* Voters lie. Internal sub-systems (desires, impulses) don't "lie" in the same game-theoretic sense; they just exist.
      *   *Intensity & Interpersonal Comparison:* Arrow assumes ordinal utility. Individuals feel *intensity* (pain vs. mild annoyance). RLHF often uses ratings/scores (cardinal-ish), not just rankings.
      *   *The "Dictator":* In a person, a "dictator" might be a compulsion or a dominant value. It's not necessarily bad. In a democracy, it's tyranny.
      *   *Coherence:* Individuals are often *not* transitive or coherent. We have cognitive dissonance. Demanding group coherence when individuals lack it is a high bar.

  5.  **Evaluating Weight for the Conclusion:**
      *   *Does "no coherent thing humans want" survive?* No. Arrow says no rule satisfies *all 5 conditions*. Drop IIA (often done in practice) or Unrestricted Domain (real preferences are structured), and aggregation works.
      *   *Single Principal:* This solves Arrow by imposing Dictatorship. But is it *desirable*? That's a normative claim, not a mathematical necessity.
      *   *Key Disanalogy:* RLHF isn't trying to build a perfect voting system for a nation; it's fitting a reward model to data. It's statistical, not axiomatic.

  6.  **Better Analogy:**
      *   Not "Group as Person."
      *   Maybe "Group as Dataset" or "Market Mechanism."
      *   Or "Reflective Equilibrium" (iterative adjustment).
      *   Actually, the best fit is **Statistical Learning / Curve Fitting**. We aren't finding a metaphysical "Will of the People"; we are minimising loss on a distribution of preferences.

  7.  **Refining the Argument (British English & Tone):**
      *   Use "optimise," "behaviour," "programme."
      *   Keep it punchy. Avoid waffle.
      *   Structure clearly for presentation notes.

  8.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Table:* Keep it clean.
      *   *Breakdown:* Focus on IIA and Intensity. Those are the killers.
      *   *Conclusion:* Arrow is a boundary condition, not a stop sign.
      *   *Alternative:* Reward Modeling as estimation, not voting.

  9.  **Self-Correction/Review during drafting:**
