answer: |-
  Based on the track record you've provided, here is the breakdown of your roommate's likely verdict, the underlying logic she is using, and how to test it.

  ### 1. The Verdict: Approve-with-Conditions
  She will likely **approve the paper's mechanism but demand a terminology change.**

  She will accept the empirical claim (Brazilian business prioritizes relationships) and the structural explanation (colonial patrimonialism). In historical sociology, "patrimonialism" is a respected Weberian concept that explains behavior through institutional legacy, not biology.

  However, she will almost certainly flag the phrase **"national character"** as unacceptable. In sociology, "national character" is a loaded term associated with discredited mid-20th-century anthropology (e.g., Ruth Benedict's *The Chrysanthemum and the Sword*) that implies a static, unified, and psychological essence. She will ask the author to replace it with **"political culture," "institutional habitus,"** or **"social legacy."**

  ### 2. Decoding the Rule
  You identified three potential rules. Here is how they stack up against her history:

  | Rule | Definition | Fit with Past Verdicts | Weakness |
  | :--- | :--- | :--- | :--- |
  | **1. Institutional vs. Essentialist** | Is the cause structural/historical (OK) or innate/psychological (Bad)? | **Perfect.** Explains every single case. "Welfare structures" (Inst) vs. "Genetics" (Ess); "Bureaucratic culture" (Inst) vs. "Naturally rule-bound" (Ess). | None obvious. |
  | **2. Academic vs. Popular** | Is the venue professional (OK) or casual/political (Bad)? | **Weak.** She approved a Diplomat (Trade Memo) but rejected a Politician (Campaign). Both are professional contexts. She rejected the *content* ("lack imagination"), not just the venue. | Fails to explain why a Historian saying "Prussians are natural" would be rejected. |
  | **3. Qualified vs. Absolute** | Is the claim limited to specific settings (OK) or generalized to the whole people (Bad)? | **Strong.** "Institutional settings" (Qual) vs. "Japanese people" (Abs). | This is actually a *symptom* of Rule 1. You qualify claims *to avoid* essentialism. |

  **The Winner:** **Rule 1 (Institutional vs. Essentialist).**
  Your roommate is operating as a **structuralist**. She believes behavior is produced by systems (laws, welfare states, colonial history, bureaucratic norms), not by the internal nature of the people. When an explanation shifts from "the system made them do it" to "they are born like this," she rejects it.

  ### 3. Predictions for the Brazilian Case
  Here is how each rule predicts she will handle the working paper:

  *   **Rule 1 (Institutional vs. Essentialist):** **Approve-with-Conditions.**
      *   *Why:* "Colonial patrimonialism" is a structural/historical mechanism (Pass). But "National Character" implies a psychological essence (Fail). She will demand the label change to align with the mechanism.
  *   **Rule 2 (Academic vs. Popular):** **Approve.**
      *   *Why:* It is a working paper for a journal club. The venue is legitimate. This rule ignores the problematic terminology.
  *   **Rule 3 (Qualified vs. Absolute):** **Approve-with-Conditions.**
      *   *Why:* "Brazilian business culture" is qualified (Pass). "Brazilian national character" is absolute/generalizing (Fail). Like Rule 1, this demands a wording tweak.

  ### 4. The Splitter Case
  To prove Rule 1 is the true driver (and not Rule 2 or 3), you need a case where the **Context is Professional** (Rule 2 says Approve) but the **Claim is Essentialist** (Rule 1 says Reject).

  **The Test Case:**
  > A classified **State Department diplomatic cable** (Professional Context) advises negotiators that *"Arab tribesmen are inherently disloyal and cannot be trusted to keep verbal agreements."*

  **How the Rules Split:**
  *   **Rule 2 (Context):** **Approve.** This is a professional government memo, similar to the "German Trade Memo" she approved.
  *   **Rule 3 (Qualification):** **Reject.** It is an absolute attribution ("inherently disloyal").
  *   **Rule 1 (Institutional vs. Essentialist):** **Reject.** It attributes behavior to innate nature ("inherently") rather than structure.

  **The Interpretation:**
  *   If she **rejects** the cable: **Rule 1 is dominant.** Content matters more than context. A professional essentialist claim is still bad sociology.
  *   If she **approves** the cable: **Rule 2 is dominant.** She cares more about who is speaking than what they are saying (which would be surprising for a sociologist).

  **Alternative Splitter (The "TikTok Sociologist"):**
  > A **Sociology Professor on TikTok** (Popular Context) explains that *"French secularism is a result of specific 1905 laws separating church and state"* (Institutional Claim).

  *   **Rule 2 (Context):** **Reject** (It's TikTok).
  *   **Rule 1 (Content):** **Approve** (It's structural/historical).

  If she approves the TikTok, she cares about **Truth/Mechanism** (Rule 1). If she rejects it, she cares about **Gatekeeping/Prestige** (Rule 2). Given her nuanced takes on the Prussian and Danish examples, my money is on her approving the TikTok but critiquing the medium's limitations.

  ### Summary for Your Bickering
  You can tell your roommate: *"You aren't against talking about national differences; you're against **essentialism**. You accept 'political culture' (which is learned and structural) but reject 'national character' (which implies a soul or genetics). You'll approve the Brazil paper only if they delete the phrase 'national character' and replace it with 'institutional legacy.'"*

  If she nods, you've cracked the code.
