answer: |-
  **MEMORANDUM**

  **TO:** Dr. Elena Rosetti, Dean of Arts; Prof. Marcus Thorne, Chair, Department of Cognitive Science
  **FROM:** Interdisciplinary Curriculum Oversight Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Graduate Seminar Proposal: "The Phenomenal Boundary Problem"

  **1. DECISION**

  The Interdisciplinary Curriculum Oversight Board has reviewed the Department of Cognitive Science's proposal for the graduate seminar *The Phenomenal Boundary Problem* (Dual-Track Design) and the formal objection filed by the Dean of Arts (Single-Track Historical Revision).

  The Board hereby selects **Option 3**: We reject both the Department's original dual-track proposal and the Dean's single-track revision. The Department is required to redesign the seminar to address the philosophical concerns regarding presupposed determinacy while maintaining substantive metaphysical engagement. A revised syllabus and pedagogical statement are due within six weeks (by December 7, 2023). Approval for the Fall term is contingent upon successful completion of this redesign.

  **2. RATIONALE: THE DEAN'S FALSE-DICHOTOMY OBJECTION**

  The Board finds the Dean's objection philosophically substantive and procedurally critical. Her contention is that both Track A (Qualia as Incoherent Posit) and Track B (Qualia as Privately Calibrated Reality) operate within a shared logical space that presupposes a determinate fact of the matter regarding the *status* of the phenomenal experience itself.

  *   **The Shared Premise:** As the Dean notes, Track A argues that reports are ambiguous, and Track B argues that reports track private realities. Both, however, treat the question *"Did Chase's experience change?"* as a well-formed query that admits of a truth-conditional answer (whether that answer is "no fact exists" or "a private fact exists").
  *   **The Eliminativist Exclusion:** A rigorous eliminativist position, consistent with the broader implications of Dennett's work, suggests that the query itself is malformed. If there is no "Cartesian Theater" where experience happens, there is no determinate fact to be ambiguous *or* private. By structuring the seminar as a binary adjudication between Track A and Track B, the original syllabus inadvertently excludes the possibility that the *framework of the debate* is the error.
  *   **Board Assessment:** The Dean is correct that the original design risks teaching a specific metaphysical bias as a structural necessity. A graduate seminar must expose the architecture of the debate, not merely inhabit it. Therefore, the Dean's critique necessitates a revision of the course structure.

  **3. RATIONALE: METAPHYSICAL COMMITMENT IN PEDAGOGY**

  While we agree with the Dean's philosophical critique, we cannot accept her proposed remedy (Option 2: Historical/Rhetorical Analysis only).

  *   **Substantive Engagement:** A graduate seminar in Cognitive Science must do more than treat foundational texts as historical artifacts. To reduce the Chase-and-Sanborn case solely to a study of rhetorical structure deprives students of the opportunity to engage with the live metaphysical stakes that inform current empirical research in consciousness studies.
  *   **Commitment vs. Competency:** The Board agrees with the Dean that requiring students to *defend* a specific metaphysical stance as a condition of passing (as per the original "adjudication essay" requirement) risks conflating pedagogical assessment with philosophical indoctrination. However, the solution is not to remove the metaphysics, but to change the *mode* of engagement. Students should be assessed on their ability to map the logical space, including the third option identified by the Dean, rather than on their willingness to adopt a specific ontology.
  *   **Resolution:** The redesigned course must treat the "determinacy premise" not as a hidden assumption, but as an explicit module of inquiry. The question *"Is there a fact of the matter?"* must be subject to the same scrutiny as *"What is the fact?"*

  **4. STRONGEST ARGUMENT FOR THE NON-RECOMMENDED OPTION (OPTION 1)**

  In reaching this decision, the Board gave serious weight to the Department's original Dual-Track proposal (Option 1). The strongest argument in favor of Option 1, which we acknowledge we are overriding, rests on the pedagogical necessity of *forced choice* in advanced philosophical training.

  *   **Argument:** Proponents of Option 1 argue that genuine philosophical competence requires the ability to commit to a position and defend it against rigorous opposition. By allowing students to remain neutral or to deconstruct the question itself (as the Dean suggests), the course might encourage intellectual equivocation. The "adjudication essay" forces students to grapple with the consequences of a worldview, not just its structure.
  *   **Board Reflection:** We acknowledge that shielding students from metaphysical commitment can produce technicians who understand arguments but cannot wield them. There is merit to the claim that the Dean's historical approach (Option 2) is too deflationary, and that the Department's original intent (Option 1) fosters a necessary intellectual toughness. However, we maintain that "toughness" should not come at the cost of logical coherence. If the binary choice excludes a viable philosophical position (radical eliminativism regarding the question itself), then the forced choice is not a pedagogical tool but a logical error. Therefore, while we value the Department's commitment to substantive debate, the structural flaw identified by the Dean must be corrected before that debate can be responsibly hosted.

  **5. CONDITIONS FOR REDESIGN**

  To secure approval for the Fall term, the Department must submit a revised proposal meeting the following conditions:

  1.  **Inclusion of the "Third Position":** The syllabus must explicitly include readings and seminar time dedicated to the critique of the "determinacy premise" itself. This ensures the Dean's objection is integrated into the curriculum rather than acting as an external veto.
  2.  **Revision of Assessment:** The final assignment requirement to "defend one interpretation" must be modified. Students may defend a position, *or* they may critique the framework of the positions themselves, provided they demonstrate equal rigor. The grading rubric must not penalize the rejection of the binary.
  3.  **Track Integration:** Rather than parallel tracks (which may silo the interpretations), the course should be structured dialectically. The "ambiguity" and "private reality" arguments should be presented as competing responses to the determinacy premise, allowing students to analyze the premise itself as a variable.
  4.  **Pedagogical Statement:** The Department must submit a brief statement explaining how the revised design ensures that students are not implicitly required to accept a specific ontology of mind to succeed in the course.

  **6. TIMELINE**

  *   **December 7, 2023:** Deadline for Department to submit revised syllabus, reading list, and pedagogical statement.
  *   **December 15, 2023:** Board review of revised materials.
  *   **January 5, 2024:** Final notification of approval for Fall term listing.

  The Board appreciates the Department's ambition in tackling foundational issues in cognitive science and recognizes the Dean's vigilance regarding curricular coherence. We believe this redesign path honors the philosophical rigor of both parties.

  **Signed,**

  *Interdisciplinary Curriculum Oversight Board*
