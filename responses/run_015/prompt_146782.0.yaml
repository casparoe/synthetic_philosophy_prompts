answer: |-
  The mist clung to the harbour walls of Morwenna Bay, dampening the sound of the gulls. Elias sat on the quay, mending a tear in a trawl net. His wrist-comm chimed softly. A neighbour, passing by with a crate of mackerel, had paused to ask after his daughter's recovery. The interaction was logged; five attention credits settled into his account. It was enough for a loaf of bread and a tin of oil.

  When the System had arrived five years prior, replacing the volatile currency of the old world, Elias had welcomed it. It seemed to restore a natural order. Value was derived from presence, from the weave of community life. To be useful was to be noticed; to be noticed was to eat. It felt like *oikonomia*—the management of the household, where exchange served the finite goal of sufficiency. One worked to live, not lived to work.

  He stood, brushing salt from his trousers, and walked toward the Exchange Hall. It was a converted warehouse, once filled with crates, now filled with silence and the blue glow of screens. People moved through the aisles not looking at the goods—grain, fuel, medicine—but at their ledgers.

  Elias approached the counter for winter wool. He needed a new jumper; the damp was seeping into his bones. He scanned his wrist. The clerk, a young man named Thomas, frowned at the screen.

  'Insufficient balance for the Merino blend,' Thomas said, not meeting Elias's eyes. 'But we have the synthetic.'

  'I had enough last week,' Elias said. 'I fixed the Hendersons' roof. That should have accrued.'

  'The Hendersons down-weighted the interaction,' Thomas replied, finally looking up. 'Said the conversation lacked depth. Algorithm adjusted the yield.'

  Elias sighed and took the synthetic. It would itch. As he turned, he saw Sarah near the fuel pumps. She was a widow who lived three doors down. Her storehouse was known to be full; her husband had been a skilled carpenter before the sickness took him. Yet, she stood hovering over a transaction terminal, her fingers flying across the glass.

  'Sarah?' Elias touched her shoulder. She flinched. 'You buying extra kerosene? The winter allocation is capped.'

  She turned, her face illuminated by the cold light of the interface. 'I'm not buying, Elias. I'm trading.'

  'Trading fuel credits for what? You've no use for more than your ration.'

  'For accumulation,' she said, as if it were obvious. 'The rate of return on social engagement is up two per cent if you cluster transactions in the evening slot. I'm building a reserve.'

  'A reserve for what?' Elias asked. 'The goods are here. The bay is closed. Nothing comes in from the outside.'

  Sarah smiled, a tight, brittle expression. 'You still think of credits as tickets for goods, don't you? That's the old thinking.' She tapped her wrist, showing him the number. It was a staggering figure, far beyond what any household could spend in a lifetime. 'This isn't about the wool or the oil. It's about the score. If the number stops growing, the System marks you as inactive. Inactive accounts get deprioritised for maintenance. I'm securing my status.'

  Elias looked from her glowing wrist to the rows of untouched goods behind her. There were coats nobody wore because the owners were busy farming credits instead of working. There was food left to rot in storage because the distributors were too engaged in performative conversations to log the delivery.

  He walked out into the mist, the synthetic jumper scratchy against his neck. He understood now. The System had been designed to measure value, but it had become the thing valued. In the old days, men sought money to buy land or bread. Now, they sought attention to buy numbers. The circle of exchange, once closed by the satisfaction of a need, had broken open. There was no finish line. No moment where one could say, 'I have enough,' and rest.

  Back at his cottage, his daughter asked if he had brought bread. He placed the loaf on the table. His wrist chimed again. A friend had sent a message of concern regarding his mood. Three credits arrived.

  Elias looked at the bread, then at the glowing number on his wrist. He realised with a cold heaviness that if he ate the bread, the hunger would end. But if he spent the credits, the desire for more would remain. The household was no longer a place of rest, but a factory for infinite growth. He turned off the wrist-comm, plunging the room into silence, but the quiet felt temporary, like a breath held before the next demand.
