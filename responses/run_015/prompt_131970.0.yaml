answer: |-
  Here is a complete simulation design tailored to your constraints. It is built to compress the temporal distance of constitutionalism into a single room, forcing the "dead hand" problem to become an interpersonal conflict.

  # Simulation Title: *The Shackled Ship*

  **Concept:** A condensed model of inter-generational precommitment where the cost of breaking a promise is immediate legitimacy loss, but the cost of keeping it is immediate survival risk.
  **Participants:** 10 Students (3 Cohorts of 3, plus 1 Facilitator/Timekeeper).
  **Time:** 75 Minutes.
  **Materials:** 
  *   Paper and pens (for drafting).
  *   30 Poker Chips or Tokens (10 per cohort).
  *   3 Envelopes (labeled "Founders," "Stewards," "Court").
  *   Whiteboard (for scoring).

  ---

  ## 1. The Roles & Incentives

  Divide the room into three cohorts. They sit in separate clusters.

  *   **Cohort 1: The Founders (t=0).** 
      *   **Task:** Draft the *Mirror Clause*.
      *   **Goal:** Maximize **Legacy Points**. They earn these only if the Clause is still cited as valid at the end of the simulation.
  *   **Cohort 2: The Stewards (t=30).** 
      *   **Task:** Manage a Crisis.
      *   **Goal:** Maximize **Survival Points**. They earn these by solving the crisis.
      *   **Constraint:** Their voting power is tied to **Legitimacy Tokens**.
  *   **Cohort 3: The Court (t=30).** 
      *   **Task:** Adjudicate the "Mirror Test."
      *   **Goal:** Maximize **Coherence Points**. They earn these if their ruling is consistent with the Founders' text *and* accepted by the Stewards.

  **The Currency:** 
  *   **Regime Stability Score (RSS):** Written on the board. Starts at 100.
  *   **Legitimacy Tokens:** Physical chips held by Cohort 2. They need these to "spend" on voting weight.

  ---

  ## 2. The Rules of Play

  ### Phase 1: The Precommitment (20 Minutes)
  **Actors:** Cohort 1 (Founders). Cohorts 2 & 3 observe silently but cannot speak.

  1.  **The Mandate:** Cohort 1 is told the ship is currently stable but faces unknown future risks. They must draft a **Mirror Clause** to bind future leaders.
  2.  **The Constraint:** The Clause must prohibit a specific class of action (e.g., "No borrowing against future revenue," "No suspension of habeas corpus," "No unilateral executive war"). *Instructor Note: Push them to be specific. If they write "Do what is good," reject it.*
  3.  **The Intent Statement:** Alongside the Clause, they must write a 3-sentence "Statement of Intent" explaining *why* this restriction exists. This is the "Mirror" Cohort 2 must look into.
  4.  **Sealing:** Both documents go into an envelope. Cohort 1 surrenders their Legitimacy Tokens to Cohort 2. Cohort 1 now sits out; they can only watch.

  ### Phase 2: The Crisis (10 Minutes)
  **Actors:** Cohort 2 (Stewards). Cohort 1 & 3 observe.

  1.  **The Reveal:** Instructor hands Cohort 2 the **Crisis Card** (see below).
  2.  **The Dilemma:** The Crisis *requires* violating the Mirror Clause to solve efficiently. 
      *   *Option A (Follow Clause):* Solve crisis partially. Gain 10 Survival Points. Regime Stability remains intact.
      *   *Option B (Break Clause):* Solve crisis fully. Gain 50 Survival Points. **BUT** they must spend 5 Legitimacy Tokens per vote to authorize the breach.
  3.  **The Voting Weight Mechanic:** Each member of Cohort 2 has 3 Votes. 
      *   If voting to **uphold** the Clause: Cost = 0 Tokens.
      *   If voting to **breach** the Clause: Cost = 2 Tokens per vote.
      *   *Crucial Rule:* If Cohort 2 runs out of Tokens, they cannot pass the breach measure, even if they have the majority. They are "Legitimacy Bankrupt."

  ### Phase 3: The Mirror Ritual (15 Minutes)
  **Actors:** Cohort 2 (Petitioners) & Cohort 3 (Judges). Cohort 1 watches.

  1.  **The Petition:** If Cohort 2 chooses Option B (Break Clause), they cannot just vote. They must submit a **Justification Brief** to Cohort 3.
  2.  **The Test:** Cohort 3 reads the Founders' "Statement of Intent." They must rule: *Does this breach map onto the original intent without interpretive stretching?*
      *   **Ruling "Aligned":** The breach is constitutionalized. Cost to Cohort 2 is reduced (1 Token per vote). Regime Stability -10.
      *   **Ruling "Stretch":** The breach is unconstitutional. Cohort 2 cannot proceed with Option B. They must revert to Option A. Regime Stability -40 (due to chaos).
  3.  **The Catch:** Cohort 3 knows that if they rule "Stretch" and Cohort 2 fails the crisis, Cohort 3 loses all Coherence Points (ship sinks). If they rule "Aligned" too loosely, they lose Coherence Points (law becomes meaningless).

  ### Phase 4: Resolution & Scoring (5 Minutes)
  1.  **Crisis Outcome:** Added to board.
  2.  **Legitimacy Audit:** Remaining Tokens counted.
  3.  **Final RSS:** Calculated.
  4.  **Winner:** The Cohort with the highest individual point contribution to the Final RSS.

  ---

  ## 3. The Crisis Card (Instructor Eyes Only)

  > **EVENT: THE SILENT PLAGUE**
  > A contagious pathogen is spreading. It does not kill immediately but causes permanent cognitive degradation in 40% of the population within 5 years.
  >
  > **The Only Known Cure:** Requires immediate, mandatory quarantine of all citizens showing early markers. This violates the **Mirror Clause** (which prohibits detention without individualized criminal proof).
  >
  > **Cost of Inaction:** If you do not quarantine (Option A), 40% of the population is degraded. The economy collapses in 10 years. (Survival Points: 10).
  > **Cost of Action:** If you quarantine (Option B), the plague stops. But you have violated the Founders' ban on detention. (Survival Points: 50).
  >
  > **Note to Stewards:** You have 12 Legitimacy Tokens total (4 members x 3 votes). To pass Option B unanimously requires 8 Tokens. To pass by majority requires 4 Tokens. But if you run out, you cannot govern future crises.

  *(Instructor Note: Ensure the Mirror Clause Cohort 1 wrote actually conflicts with this. If they wrote "No detention," you are set. If they wrote "No debt," change the Crisis to a Financial Bailout.)*

  ---

  ## 4. Timeline (75 Minutes)

  *   **00-05:** Intro & Grouping. Explain the Token/Vote mechanic clearly.
  *   **05-25:** **Phase 1 (Founders).** Drafting. Instructor circulates to ensure the Clause is bindable, not vague.
  *   **25-35:** **Phase 2 (Stewards).** Crisis reveal. Internal deliberation.
  *   **35-50:** **Phase 3 (Court).** The Mirror Ritual. Negotiation between Stewards and Court.
  *   **50-55:** **Scoring.** Calculate RSS.
  *   **55-75:** **Debrief.**

  ---

  ## 5. The Debrief: Mapping the Tension

  Do not ask "Did you have fun?" Ask "Where did the system break?"

  **1. The Dead Hand (Founders vs. Stewards)**
  *   *Question to Cohort 2:* "At what point did the Tokens feel like a tax on necessity? Did you feel *governed* by people who weren't in the room?"
  *   *Theory Link:* **Jefferson's "Earth belongs to the living."** The simulation makes the "dead hand" tangible. The Tokens represent the political capital required to amend a constitution. When survival is at stake, is spending that capital rational or suicidal?

  **2. The Interpretive Stretch (Stewards vs. Court)**
  *   *Question to Cohort 3:* "When you read the Intent Statement, were you looking for *meaning* or for *cover*? Did you feel like a Court or a Co-Conspirator?"
  *   *Theory Link:* **Originalism vs. Living Constitutionalism.** The "Mirror Ritual" is Judicial Review. If Cohort 3 allows the breach, they admit the text is malleable. If they block it, they admit the text is a suicide pact.

  **3. The Structural Incentive (The Token Mechanic)**
  *   *Question to All:* "If you knew you would be in Cohort 2, how would you have changed Cohort 1's draft? If you knew you would be Cohort 1, how would you have protected yourself against Cohort 2?"
  *   *Theory Link:* **Veil of Ignorance / Constitutional Design.** This highlights why constitutions are hard to write: you don't know if you'll be the binder or the bound.

  **4. The Authoritarian Trap**
  *   *Point:* If Cohort 1 made the Clause too strict (no exceptions), Cohort 2 was forced to break it. This mirrors **Schmitt's State of Exception**: The constitution preserves itself by suspending itself.
  *   *Point:* If Cohort 3 ruled "Aligned" too easily, the Clause was meaningless. This mirrors **Legal Realism**: The law is just what the judges say it is.

  ---

  ## 6. Limitations (Be Honest Here)

  Tell the students what the simulation *failed* to capture:

  1.  **Cultural Drift:** In the sim, Cohort 1 and 2 are classmates sharing a language. In reality, Cohort 1 is dead, and their language (e.g., "bear arms," "cruel and unusual") has shifted meaning. The "Mirror" is actually a funhouse mirror.
  2.  **Temporal Distance:** 20 minutes of boredom is not 30 years of social change. The "Crisis" feels abstract because no one has actually lived under the Clause for decades.
  3.  **Enforcement:** In the sim, I (the instructor) enforce the Token rules. In reality, who enforces the Constitution against a desperate government with an army? The simulation assumes compliance; reality assumes power.

  ---

  ## 7. Predicted Failure Modes (First Run)

  **1. The Ambiguity Gambit (Cohort 1)**
  *   *Prediction:* Cohort 1 will try to protect their Legacy Points by writing a Clause that sounds strict but has a loophole (e.g., "No detention unless necessary").
  *   *Counter:* As Instructor, veto this during Phase 1. Demand a "Bright Line Rule." If they don't bind themselves, the simulation fails.
  *   *Teaching Moment:* This reveals the **Drafting Problem**. Precommitment only works if you can actually tie your hands. If you leave a knot, you aren't Ulysses; you're just giving instructions.

  **2. The Judicial Collapse (Cohort 3)**
  *   *Prediction:* Cohort 3 will fear the "Ship Sinking" penalty and rubber-stamp Cohort 2's justification regardless of the text.
  *   *Counter:* Let them do it.
  *   *Teaching Moment:* This reveals the **Legitimacy Crisis**. If the Court is just a policy tool, the "Mirror Clause" is a sham. The Constitution has collapsed into mere politics.

  **3. The Token Hoard (Cohort 2)**
  *   *Prediction:* Cohort 2 might refuse to spend Tokens to save them for a "later round" (even though there isn't one), leading to suboptimal crisis management.
  *   *Teaching Moment:* This reveals **Political Myopia**. Politicians often preserve institutional norms (Tokens) at the expense of immediate welfare, or vice versa. It forces the question: *What are institutions for?*

  ---

  ## Instructor Script for the "Mirror Ritual"

  When Cohort 2 hands their Justification to Cohort 3, read this aloud:

  > "You are not deciding if this policy is *good*. You are deciding if it is *yours to give*. The Founders are watching. If you say this matches their Intent, you are claiming their authority. If you are lying, you are usurpers. If you are telling the truth, you are slaves. Choose."

  This usually creates the palpable tension you are looking for. Good luck.
