      *   Was the Arbiter's job interpretation or legislation?

  11. **Final Review against constraints:**
      *   10 people? Yes (3 groups of 3, 1 facilitator/float or 3-3-4).
      *   75 mins? Yes.
      *   Philosophy/Politics background? Yes (theory heavy debrief).
      *   Materials? Paper, tokens.
      *   Payoff? Points.
      *   Predictable errors? Included.

      *(Self-Correction on Group Size)*: 10 people. 3 Groups. 3-3-4 is best. Group 3 (Arbiters) needs to be decisive. Let's make Group 3 the "Judiciary" (3 people), Group 1 "Founders" (3 people), Group 2 "Stewards" (4 people).

      *(Refining the "Mirror Clause")*: The prompt says "Cohort 2 can only invoke past commitments if they can demonstrate... present values map onto original intent." This implies Cohort 2 *wants* to use the past to justify something, OR they are bound by it.
      *   Let's clarify: The Clause *forbids* Action X unless Intent Y is proven.
      *   Crisis requires Action X.
      *   Stewards must prove Intent Y to Arbiters.

