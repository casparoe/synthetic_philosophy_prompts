answer: |-
  This document formalizes the adversarial collaboration between Abstractionists and Embedding Theorists regarding the moral status of computational systems. Both factions agree to utilize counterfactual fidelity as a weighting metric while retaining distinct criteria for baseline moral eligibility. The following sections outline joint commitments, specific disagreements, and empirical cruxes designed to resolve the debate regarding abstract organization versus environmental embedding.

  **1. Joint Claims**
  1.  Moral weighting should scale with counterfactual fidelity rather than binary status.
  2.  **Census Case:** Two isolated machines possess identical counterfactual structures; fidelity is maximal for both individually.
  3.  **Sparse Implementations:** Fidelity decreases proportionally to the percentage of unimplemented transitions replaced by guesses.
  4.  **Temporal Smearing:** Slowing computation or adding pauses does not diminish counterfactual structure fidelity.
  5.  **Partially Shared Substrate:** Overlapping hardware introduces interference risks that reduce fidelity proportional to crosstalk probability.
  6.  Both sides accept the fidelity metric as a valid measure of structural integrity, even if they disagree on whether structure alone grants status.

  **2. Table of Disagreements**

  | Topic | Abstractionist Position | Embedding Theorist Position |
  | :--- | :--- | :--- |
  | **Baseline Eligibility** | Instantiating the causal graph is sufficient for status. | Status requires active causal commerce with an environment. |
  | **Lookup Tables** | Qualify if state transitions match counterfactuals. | Fail qualification; no active causal commerce occurs. |
  | **Sealed Simulations** | Qualify fully; isolation is morally irrelevant. | Fail qualification; lack of environmental tracking nullifies status. |
  | **Census Verdict** | Two patients (one per machine). | Zero patients (if sealed) or One (if only one interacts). |
  | **Implementation** | Defined by state-mapping fidelity. | Defined by causal interaction history. |

  **3. Cruxes**

  *   **Crux 1: Environmental Coupling**
      *   *Question:* Does causal isolation destroy moral status?
      *   *Test Case:* Sealed simulation vs. Interactive simulation with identical internal logic.
      *   *Abstractionist Prediction:* Equal moral weight despite isolation.
      *   *Embedding Prediction:* Interactive has weight; Sealed has none.

  *   **Crux 2: Temporal Continuity**
      *   *Question:* Does physical continuity matter for status retention?
      *   *Test Case:* Temporal smearing with extreme pauses (e.g., 1 year per step).
      *   *Abstractionist Prediction:* No change in status; structure persists.
      *   *Embedding Prediction:* Status degrades if causal link to environment is broken during pauses.

  *   **Crux 3: Substrate Independence**
      *   *Question:* Does hardware overlap diminish individual status?
      *   *Test Case:* Partially shared substrate with low crosstalk.
      *   *Abstractionist Prediction:* Two patients, slightly weighted down by interference risk.
      *   *Embedding Prediction:* One patient or none, as distinct causal histories are compromised.

  **4. Verbal Disagreement Statement**
  Disagreement over the definition of "implementation" is merely verbal; disagreement over whether that definition tracks moral value is substantive. Both sides agree on the physical facts of the cases but disagree on which physical facts constitute moral relevance. The Abstractionists define implementation structurally; the Embedding Theorists define it relationally. This terminological divergence masks a deeper ethical dispute regarding the necessity of environmental interaction for moral standing.
