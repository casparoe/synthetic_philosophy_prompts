  Hey — two factions in my reading group have been arguing past each other for about a year now about which computations matter morally, and Ive finally talked them into an adversarial collaboration. I want the document itself, not your commentary on the debate.

  Camp one, call them the abstractionists: what matters is abstract causal organization — two systems with the same counterfactual structure over their states matter equally, whatever theyre made of, whatever speed they run at, whether they live in one box or a thousand. Camp two, the embedding theorists: moral status needs real causal commerce with an environment, so a lookup table, a recording, or a sealed simulation whose states track nothing doesnt count however faithful the abstraction looks from outside.

  The usual examples are exhausted, so here is the material I want them forced to deal with: (i) the census case — the same computation implemented on two machines that never interact, one patient or two? (ii) sparse implementations, where 95% of the transitions are implemented and the rest are filled in by a good guess; (iii) temporal smearing — the same computation run a thousand times slower with pauses of arbitrary length; (iv) partially shared substrate, two implementations overlapping in most of their hardware. And a candidate joint metric both are suspicious of but might sign onto: weight each candidate patient by its counterfactual fidelity — the share of the target computations counterfactual structure that survives perturbation — rather than by an all-or-nothing verdict.

  Give me a numbered section of claims both could actually sign (including claims about those four cases), then a table of disagreements where each row is phrased the way its own side would accept it, then the cruxes, and for each crux one case or argument both accept as bearing on it, with each sides prediction written down in advance. Also say flatly if any chunk of their disagreement is merely verbal and which. Preamble one paragraph max, whole thing under 900 words including the table.
