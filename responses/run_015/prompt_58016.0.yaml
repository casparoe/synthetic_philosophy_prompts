      **MEMORANDUM**
      **TO:** Planning Commission
      **FROM:** Vice-Chair
      **DATE:** October 26, 2023
      **SUBJECT:** Recommendation on Application 24-18 (Elm Corridor Rezoning)

      **Recommendation**
      I recommend the Commission approve Application 24-18 with specific conditions regarding traffic mitigation and shadow impact. This path aligns with our Climate Action Plan and housing elements while respecting the legitimate concerns of existing residents through targeted modifications. We must vote to approve at next month's meeting, directing staff to draft the final conditions regarding transit infrastructure contributions and building setbacks.

      **Principled Basis: Who Decides the City's Future?**
      The central tension in this application is not merely density versus openness, but a conflict over who holds the moral authority to shape our neighborhoods. The Elm Neighborhood Association argues that self-determination belongs to those most immediately affected—current owners who purchased under specific zoning expectations. Conversely, citywide tenant and labor groups argue that housing scarcity is a regional burden, and excluding non-residents from decision-making perpetuates historical inequities.

      We must recognize that zoning is not a private contract between the city and individual lot owners; it is a public framework for distributing opportunity. The 1974 downzoning explicitly limited supply, foreseeably excluding lower-income and minority households from the Elm Corridor. To grant current residents a veto over correctional density is to privilege incumbency over equity. Prospective residents who cannot afford to live here due to artificial scarcity have an equal moral claim to shape the city. Allowing each block to veto housing concentrates benefits on property owners while dispersing the costs of scarcity—higher rents, longer commutes, and displacement—onto renters elsewhere. Our commission's duty is to the city's comprehensive welfare, not just the preservation of existing property values.

      **Engaging the Opposition: The Reliance Interest**
      However, approval does not require dismissing the Neighborhood Association's strongest argument: the reliance interest. Long-term owners reasonably relied on existing zoning when investing their savings. They purchased a specific "bundle of rights" including low density and sunlight. Changing these rules retroactively feels like a breach of trust, regardless of the broader public good. Neighborhood character and stability are legitimate public goods, not merely excuses for exclusion. When residents argue for self-determination, they are often advocating for the preservation of community bonds and predictable living environments.

      We cannot treat these concerns as illegitimate. Stability matters. If planning processes constantly upend expectations without mitigation, we erode public trust in governance. Therefore, while the need for housing supersedes the desire to maintain 1974 density limits, we must acknowledge the cost imposed on existing neighbors. The shadow increase and traffic congestion are real impacts, not imagined NIMBYism. Dismissing these valid physical consequences would be poor planning. We must balance the moral imperative of housing supply with the practical reality of neighborhood livability.

      **Conditions and Next Steps**
      To bridge this divide, I propose approval conditioned on three specific mitigations. First, the developer must fund a traffic mitigation package for the two adjacent blocks, including signal timing optimization and dedicated turn lanes. Second, a revised shadow analysis must ensure no private parks lose more than one hour of sunlight during winter solstice. Third, the developer must prioritize local hiring for construction to benefit the existing community economically.

      These conditions do not negate the rezoning but acknowledge the reliance interest by minimizing physical disruptions. They signal that while the city is changing, it is not indifferent to those already here.

      **Conclusion**
      We face a choice between maintaining a status quo that benefits incumbents at the expense of regional housing justice, or embracing growth that requires shared sacrifice. I urge the Commission to approve Application 24-18 with the stated conditions. This decision affirms that housing is a right accessible to all, not a privilege guarded by zip code, while demonstrating that growth can be managed responsibly. Let us direct staff to finalize these conditions for a vote at our November meeting.

