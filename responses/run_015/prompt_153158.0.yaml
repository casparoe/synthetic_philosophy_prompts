answer: |-
  You have identified a genuine gap in the standard taxonomy of intergenerational ethics and discounting. You are correct: this is not **pure time preference** (valuing now over later), nor is it standard **risk discounting** (probability of failure), nor is it simple **institutional distrust** (belief that actors will act badly).

  There is no single, canonical term in the literature that captures this specific "broken chain" penalty. However, your observation sits at the intersection of three distinct bodies of work. If you are looking for the closest existing conceptual handles, they are:

  1.  **Precommitment Technology (Schelling/Elster):** The "unbroken chain" (trust, endowment) functions as a *Ulysses Pact* or binding commitment device. The "broken chain" (democracy, flexible foundation) lacks the technological capacity to bind its future self.
  2.  **Diachronic Identity of Collective Agents (Parfit applied to Institutions):** This is the philosophical core. People intuitively treat institutions without fixed charters as lacking *diachronic identity*. If the entity can rewrite its mission, it is not the "same" agent in 200 years. Therefore, the obligation does not transfer.
  3.  **Value Lock-In (Longtermism/Bostrom):** In existential risk literature, this is the problem of ensuring current values or goals persist through time. A trust is a lock-in mechanism; a democracy is a value-updating mechanism.

  ### Proposed Definition: "Custodial Continuity Discounting"

  Since a standard term doesn't exist, if you wish to label this in writing or debate, the most precise descriptive term would be **Custodial Continuity Discounting** (or the **Continuity-Conditional Valuation Heuristic**).

  **Precise Definition:**
  > A cognitive and ethical heuristic where the present value assigned to a future benefit is contingent not on the *time horizon* or the *statistical risk* of loss, but on the perceived **ontological stability of the intervening agent**.
  >
  > Value is preserved only if the custodial chain possesses **structural immutability** (rules that cannot be changed by the agents themselves). If the custodian has the agency to alter its own mandate, the future benefit is discounted heavily, regardless of the custodian's current trustworthiness.

  ### Drawing the Edges: How it Differs from Related Concepts

  To use this precisely, you need to distinguish it from the concepts you already ruled out. Here is the boundary work:

  #### 1. Vs. Institutional Distrust
  *   **Institutional Distrust:** "I believe the future actors *will not* want to honor this commitment." (A claim about *will* or *incentives*).
  *   **Custodial Continuity:** "I believe the future entity *cannot* honor this commitment because it will not be the same entity." (A claim about *identity* or *capacity*).
  *   **The Test:** If you ask a proponent, "What if we elect only virtuous people to the government for 200 years?" the Distrust theorist says, "Okay, then it works." The Continuity theorist says, "No, because the *next* election could change the rules. The structure itself is permeable."

  #### 2. Vs. Pure Time Preference (Hyperbolic Discounting)
  *   **Time Preference:** Value decays as a function of $t$ (time). $V = Benefit / (1+r)^t$.
  *   **Continuity Discounting:** Value decays as a function of $C$ (continuity). $V = Benefit \times P(Chain\_Intact)$.
  *   **The Test:** As you noted, people accept high *risk* (e.g., market volatility in a trust) if the *chain* is unbroken. They reject low *risk* (e.g., stable government policy) if the *chain* is breakable. This proves the discount rate is tied to structure, not time.

  #### 3. Vs. The Principal-Agent Problem
  *   **Principal-Agent:** Focuses on misaligned incentives between the owner (future generations) and the manager (current government).
  *   **Continuity:** Focuses on the **succession mechanism**. In a trust, the successor trustee is bound by the original charter (the Principal's voice echoes). In a democracy, the successor government derives legitimacy from the *current* electorate, effectively silencing the original Principal.

  ### Why This Matters for Your Debates

  Recognizing this distinction allows you to reframe long-term planning arguments.

  *   **The Nuclear Waste Problem:** We don't just need a safe box; we need a **social technology** that mimics a trust. The failure of nuclear warning markers isn't just about language decay; it's about the assumption that the *political entity* reading the warning will feel bound by the *political entity* that buried the waste.
  *   **Climate Policy:** The resistance to long-term climate debt isn't just about cost; it's that voters intuitively know a democratic mandate cannot bind a future parliament. They are applying a **Continuity Discount** to legislation that lacks constitutional or trust-like rigidity.

  ### Key References to Ground Your Argument
  If you need to cite literature that skirts this concept without naming it directly:
  *   **Thomas Schelling,** *Choice and Consequence* (on commitment strategies).
  *   **Jon Elster,** *Ulysses and the Sirens* (on binding the future self).
  *   **Derek Parfit,** *Reasons and Persons* (specifically on identity over time, applied analogously to institutions).
  *   **Nick Bostrom,** *The Vulnerable World Hypothesis* (discusses "lock-in" of governance structures).
  *   **Legal Theory:** Look for discussions on **"The Rule Against Perpetuities"** vs. **"Dynastic Trusts."** The law explicitly recognizes the tension between allowing long-term control and allowing future generations autonomy.

  **Summary:** You haven't missed a term; you've identified a heuristic that usually hides inside discussions of "commitment devices." Calling it **Custodial Continuity Discounting** is philosophically sound and distinguishes it from mere distrust or time preference. It highlights that for many people, **obligation requires identity**, and flexible institutions lack identity over deep time.
