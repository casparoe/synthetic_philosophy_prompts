answer: |-
  The break is at **(1)**.

  Your friend's chain is valid, but it rests on a category error about what a dramatic representation *is*. Premise (1) assumes that a film depicting a real person functions as **testimony** (a report of specific events) rather than **modeling** (a simulation of causal dynamics).

  It looked fine going in because film has **indexical allure**. Unlike a novel, a biopic uses light and sound recorded from physical reality. It *looks* like a documentary. This phenomenological similarity tricks us into assigning it the same epistemic rules as surveillance footage or a sworn deposition. But a biopic is not a record of an event; it is a reconstruction of a *pattern*.

  Here is the price of repairing (1), broken down by your four constraints.

  ### 1. The Pretense Repair (Walton-style)
  If you say biopics don't assert facts but invite make-believe, you risk making the documentary indistinguishable from the drama. If *Schindler's List* is just a game of pretend, why isn't *Shoah*?

  **The Fix:** You must distinguish **indexical truth** from **iconic truth**.
  *   **Documentary:** Asserts indexical connection. The light hitting the lens bounced off the actual subject. The assertion is: "This person was present."
  *   **Biopic:** Asserts iconic connection. The light bounced off an actor. The assertion is: "This *pattern of behavior* is present."

  **Cost:** You lose the ability to treat the disclaimer card as a truth-claim.
  Regarding horn (5): If the film is a model, the disclaimer ("Based on a true story") is not an assertion that the *script* is true. It is an assertion that the *parameters* of the model are derived from reality. It functions like a label on a flight simulator: "Modeled on a 747." It doesn't assert the simulator can fly; it asserts the controls map to the real plane. This dissolves the paradox. The disclaimer isn't stacking a lie; it's defining the boundary of the simulation.

  ### 2. The Hedged Assertion Repair
  If you keep assertion but hedge it, you must define the content precisely. The friend treats "X said Y" as the unit of truth. You need to shift the unit to "X was the kind of agent for whom Y is a plausible output in context Z."

  **The Content:** The film asserts **counterfactual plausibility**, not **verbatim accuracy**.
  *   **Translation/Subtitles:** We accept these because we understand the assertion is "This is the semantic content," not "These are the phonemes."
  *   **Composite Character:** Passes the test if the composite preserves the *functional role* of the original colleagues. If the real lawyer had two allies who slowed her down, and the film has one ally who slows her down, the *causal truth* is preserved.
  *   **Invented Confrontation:** Fails the test if it contradicts the *character truth*. If the historical record shows a loving relationship, and the film invents a hateful confrontation for drama, it violates the hedged assertion. It asserts a psychological falsehood, even if no transcript exists to contradict it.

  **Cost:** You make the ethical evaluation much harder. You can no longer point to a transcript and say "Lie." You have to argue about psychology and motive. It shifts the burden from **fact-checking** to **interpretive fidelity**. The audience must be competent enough to judge plausibility, which is a high bar.

  ### 3. Keeping (4): Obligations to the Dead
  You prefer keeping (4). If you reject (1) but keep (4), you change the nature of the wrong done to the dead.

  **The Fix:** The wrong is not **fabrication of record** (they can't correct the transcript); it is **distortion of legacy** (they can't correct the impression).
  *   **Premise (1) Rejected:** We admit the film isn't claiming to be a transcript.
  *   **Premise (4) Kept:** We admit the dead have a right not to have their moral character slandered by popular culture.

  **Cost:** You pay in **enforceability**.
  If the wrong is "lying about words," you can prove it with a recording. If the wrong is "distorting the moral reality of a life," you enter a war of interpretations. The filmmaker can always say, "This reveals the *deeper* truth of their struggle." The estate can say, "This makes them look cruel."
  By keeping (4), you grant the dead a right to **reputational integrity**, but you lose the objective metric to defend it. You are left arguing about "essence" rather than "event." This is a heavier, more metaphysical burden, but it aligns better with why we actually feel uneasy about the biopic (it feels *unfair* to the person, not just *inaccurate*).

  ### 4. Narrative History vs. Biopic
  Your friend's step (6) is actually the strongest part of her argument. If you fix (1) correctly, **narrative history and biopics stand or fall together.**

  **The Difference:** There is no epistemic difference, only a **conventional** one.
  *   **Text:** Signals "authorial voice." When a historian writes, "Washington felt anxious," the reader understands this as an inference based on evidence.
  *   **Film:** Signals "witness." When an actor plays Washington sweating, the viewer experiences it as a direct observation.

  **Cost:** If you let narrative history off the hook, you **must** let the biopic off the hook, provided both adhere to the "hedged assertion" of plausibility.
  If you condemn the biopic for inventing dialogue while allowing the historian to invent dialogue (which they do in all readable history), you are discriminating based on **medium**, not **method**.
  *   **The Price:** You must admit that readable history is also a form of fiction-making. It fills gaps with "empathetic inference." If the biopic is lying, the historian is too. If the historian is practicing legitimate reconstruction, so is the biopic.
  *   **The Trap:** If you try to save history but condemn the film, you must argue that the *visual medium* creates a stronger illusion of truth that overrides the audience's critical faculties. This is an empirical claim about psychology, not logic. It suggests the audience is more gullible with images than words. If you accept that, you are arguing for censorship based on audience incompetence, not filmmaker ethics.

  ### Summary of the Repair
  Reject **(1)**. A biopic asserts **fidelity to character and causal dynamics**, not **fidelity to transcript**.

  *   **Why it looked fine:** Film mimics the sensory experience of witnessing, tricking us into applying testimony rules to art.
  *   **What you pay:**
      1.  **Epistemic Humility:** You admit we rarely know "what happened" in a way that satisfies a transcript, whether in history or film.
      2.  **Evaluation Difficulty:** You can't just check sources; you have to judge psychological plausibility.
      3.  **Genre Equality:** You must judge historians by the same standard as directors. If invented dialogue is a sin, it is a sin in both. If it is a tool for truth, it is a tool in both.

  Your friend's argument is a rigorous defense of **positivism** applied to **hermeneutics**. It fails because human communication (translation, history, art) relies on semantic equivalence, not bitwise identity. The "lie" only exists if you demand the map be the territory.
