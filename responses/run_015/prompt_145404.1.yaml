answer: |-
  The gap is **non-ergodicity**. In ergodic systems, time averages (one player over many rounds) equal ensemble averages (many players over one round). Your game breaks this: multiplicative dynamics ensure the geometric mean (time) stays below the arithmetic mean (ensemble). Volatility drains compound growth, causing individual wealth to decay even when the expected value rises.

  The carving distinguishes **ensemble probability** (cross-sectional) from **time probability** (longitudinal). The "average player" doesn't exist; there are only lucky survivors and a ruined majority. The ensemble average is dominated by rare, extreme outliers, making it irrelevant for a single trajectory.

  Pooling independent players constitutes **risk pooling**. By aggregating independent trials, the group's relative variance shrinks per the Law of Large Numbers. The pool's value evolves near the arithmetic mean because losses in one sub-account are subsidized by gains in another. This transforms the multiplicative decay of individuals into the additive growth of the collective. It fails under correlation because variance does not cancel; everyone moves together, preserving non-ergodicity. Unlike insurance (transferring risk for a premium), this eliminates idiosyncratic risk through aggregation. Unlike ordinary diversification (reducing portfolio variance), this restores ergodicity, allowing the group to capture the ensemble average as a time average.

  The **Kelly Criterion** belongs to the time-average perspective. It calculates the stake fraction that maximizes the geometric growth rate, ensuring the time average remains positive. In your game, Kelly prescribes staking 20% ($f^* = 2p - 1$), not 50%. Staking Kelly aligns individual strategy with the constraints of non-ergodicity, prioritizing survival over expected value. It acknowledges that you cannot spend the ensemble average; you can only spend what your specific trajectory yields. The pooling maneuver essentially allows the group to behave as a single Kelly-optimized entity without reducing individual stakes, provided risks remain independent.
