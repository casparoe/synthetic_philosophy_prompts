answer: |-
  Let's start with the facts. Your summary is remarkably clean. You have the timeline, the players, and the technical details right.

  **Fact Check:**
  *   **Timeline:** *The Supper at Emmaus* was unveiled in 1937. Bredius authenticated it. The Boymans Museum bought it.
  *   **Göring:** The painting traded to Göring was *Christ with the Adulteress*. He traded 200+ looted works for it.
  *   **Arrest & Confession:** Van Meegeren was arrested in 1945 for collaboration (selling national heritage to the enemy). To avoid the death penalty or life imprisonment for treason, he confessed to forgery.
  *   **Proof:** He painted *Jesus Among the Doctors* in a studio under guard to prove capability.
  *   **Sentence/Death:** Sentenced to one year in 1947. He died of a heart attack in December 1947, shortly after the verdict, having served very little time.
  *   **Science:** You are correct on the binder. He used phenol-formaldehyde resin (a Bakelite precursor) and baked the canvases to harden the paint, fooling the solvent tests of the day.
  *   **Current Status:** They hang in major museums (Boijmans, Rijksmuseum, National Gallery London) explicitly labeled as Van Meegeren.

  Your facts hold up. Now, let's run the case through your taxonomy.

  ### 1. The Three Concepts

  **Re-anchoring**
  *The Phenomenon:* The paintings crashed in value upon exposure, then recovered significant value as "Van Meegerens."
  *   **Autographic/Performance:** This account predicts the recovery best. The object is the residue of an act. Before exposure, the act was misidentified (Vermeer's). After exposure, the act is correctly identified (Meegeren's). The "residue" didn't change, only the label on the performance. The value recovery confirms that the premium is on the *certainty of the act*, not necessarily the *fame of the name* (since Meegeren was mediocre, yet his forgeries are valuable).
  *   **Documentary:** Predicts a crash (it is no longer evidence of the 17th century). To explain the recovery, it must bolt on the idea that a document of a *crime* is historically valuable. It treats the painting as evidence of 1930s deception rather than 1660s piety.
  *   **Surface:** This account is embarrassed. The surface did not change. The aesthetic experience (light, color, composition) remained identical. If value is solely what meets the eye, the price should not have fluctuated. The recovery proves the premium was never in the object's matter.
  *   **Relational/Conversational:** Predicts the recovery well. The painting's slot in the conversation shifted from "Vermeer's late religious period" to "The apex of art historical deception." The narrative became richer, securing its place in the museum.

  *Verdict:* Re-anchoring confirms that value is not intrinsic to the physical object (embarrassing Surface) but is intrinsic to the *narrative of origin* (supporting Autographic and Relational).

  **Palimpsest Value**
  *The Phenomenon:* The object now carries two histories: the fake 17th-century provenance and the real 20th-century creation. It becomes a work *about* forgery.
  *   **Does this require a fifth category?** No, but it stretches the **Relational** view to its limit. The "conversation" is no longer just about art history; it is about the sociology of trust. The painting is now a node in a conversation about expertise, gullibility, and nationalism.
  *   **Documentary** also handles this: it is a "compound document." It tells the truth about Meegeren and a lie about Vermeer.
  *   **Autographic** struggles here. It wants a single origin point. A palimpsest suggests dual authorship (Meegeren the painter, Vermeer the ghost).
  *   **Surface** ignores it completely.

  *Verdict:* Exposure adds value because it adds *narrative complexity*. This supports the Relational view: the more a work can sustain critical discourse (even discourse about its own falsity), the higher its value.

  **The Recoil**
  *The Phenomenon:* Fakes are often destroyed or locked away. They are treated as contaminating, not just worthless.
  *   **Source of Negativity:**
      *   **Documentary:** This is the primary source of the recoil. A fake is a corrupted data point. In a museum (an archive of truth), a fake is toxic because it threatens the integrity of the entire collection. It is a virus in the database.
      *   **Autographic:** There is a moral violation. The artist's hand is sacred; forging it is a form of identity theft. The recoil is moral disgust.
      *   **Surface:** Cannot explain the recoil. If it looks good, it should be displayed.
      *   **Relational:** The fake breaks the trust required for the conversation to function. If we cannot trust attributions, the conversation halts.
  *   **Verdict:** The "contamination" language is purely **Documentary**. We destroy fakes for the same reason we burn forged passports: not because the paper is ugly, but because the information is poisonous to the system.

  ### 2. Running it the Other Direction

  **Does the episode confirm or embarrass the taxonomy?**
  *   **Surface View:** Your friend is closer than you are, but both of you are missing the distinction between *aesthetic value* and *artworld value*. The Surface view is refuted as a theory of *market and institutional value*. The price crashed, and the museum label changed, despite the pixels remaining the same. However, you are right that the *phenomenological experience* of looking at *Emmaus* hasn't changed. The Surface view survives as a theory of *vision*, but dies as a theory of *art*.
  *   **Autographic View:** Confirmed, but with a twist. The "act" that matters is the one we *believe* happened. When the belief changed, the value changed. This suggests the "act" is a social construct, not just a physical event.
  *   **Documentary View:** Confirmed. The recoil and the vaulting of other fakes show that museums prioritize historical truth over aesthetic pleasure.
  *   **Relational View:** Confirmed. The Van Meegerens are more valuable now than when they were thought to be Vermeers because the story is more unique. There are many Vermeers; there is only one Van Meegeren hoax.

  **The Hitler Diaries vs. Van Meegeren**
  *   **The Difference:** This is the killer test for your taxonomy.
      *   **Hitler Diaries:** Purely **Documentary** objects. Their value was 100% in their claim to be evidence of Hitler's hand. Once proven fake, they are lies with no aesthetic surface to redeem them. They go to the vault.
      *   **Van Meegerens:** **Hybrid** objects. They have high **Surface** value (they are beautiful paintings) and high **Relational** value (the story is compelling).
  *   **Why the different fate?** The Diaries failed the Documentary test and had no Surface backup. The Van Meegerens failed the Documentary test but passed the Surface and Relational tests.
  *   **Conclusion:** It's not just "how good they are at what they do." It's that paintings have multiple value vectors (Surface + Document + Relation), whereas historical documents usually have only one (Document). When the Document vector fails, the painting can survive on Surface/Relation; the diary cannot.

  ### 3. The Blind Spots

  You asked where the frame goes quiet. Here are the questions all four accounts decline to answer:

  1.  **The Ethics of Complicity:** None of the four accounts explain why *we* feel foolish. When we look at a Van Meegeren now, we feel a pang of embarrassment *for* Bredius and the museum. The taxonomy treats the viewer as an evaluator, not a participant in the shame. We need a **Psychological** or **Empathetic** category to account for the viewer's emotional investment in the truth.
  2.  **The Material Time-Travel:** The Bakelite issue. The painting is physically *of* the 1930s, chemically speaking. The **Surface** view ignores chemistry. The **Documentary** view sees it as a lie. But the object is a physical time capsule of 1930s industrial materials. None of the four accounts fully grapple with the object as a *chemical artifact* distinct from its *visual* or *historical* identity.
  3.  **The "As-If" Experience:** Can we enjoy the painting *as if* it were a Vermeer, knowing it isn't? Walton's theory of "categories of art" suggests we can't perceive it correctly without the right category. But viewers report they still enjoy it. The taxonomy doesn't explain how we hold two contradictory categories (Vermeer-style / Meegeren-made) in our heads simultaneously without cognitive dissonance destroying the aesthetic experience.

  **Final Verdict:**
  Your friend is right that the Surface view cannot explain the *affair* (the market crash, the arrest, the museum labels). You are right that the Surface view explains the *painting* (why we still look at it). The Van Meegeren case proves that art is not one thing. It is a Document, a Surface, and a Relation woven together. When you cut the Document thread, the Surface and Relation hold the object up, but it hangs differently. The Diaries had no Surface or Relation to hold them, so they fell.

  The recovery of value (Re-anchoring) proves the premium is in the **Narrative of Origin** (Relational/Autographic), not the Object (Surface). The Recoil proves the museum is primarily a **Archive** (Documentary), not a Gallery (Surface). The Van Meegeren survives because it is a great Gallery piece that became a great Archive piece about lying.
