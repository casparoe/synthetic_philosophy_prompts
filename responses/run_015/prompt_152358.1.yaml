prompt: |-
  I just finished a long argument with a friend about the Sleeping Beauty problem and whether self-locating belief is genuinely distinct from ordinary belief updated under amnesia. I now need to present the core idea to a first-year philosophy seminar—no formal logic background, about thirty minutes with a whiteboard—without letting the group leave thinking it is only about counting awakenings. Plan the teaching sequence: the order in which the coin-flip protocol, the amnesia mechanism, and the centered versus uncentered distinction must be introduced so that the disagreement between one-third and one-half credence feels like a structural feature rather than a trick; the single concrete scenario that carries the idea (use the modified version in which Beauty is interviewed twice on Heads and once on Tails, is warned that the interviewer will ask the exact same question each time, and knows she will retain no memory of any prior answer, but is not told whether she is in the first or second interview); the misconceptions they will predictably bring in or form (treating the awakening itself as causal evidence about Sunday’s coin, conflating long-run frequency with subjective credence, and assuming amnesia erases the subject rather than just her information); the precise point in the sequence where each misconception should be intercepted; a brief check for understanding that demonstrates they have grasped self-location rather than memorized the arithmetic; and what must be explicitly left out at this level—named and set aside—such as the full centered-world semantic framework or analogies to the Doomsday argument. Please write your answer in American English.
