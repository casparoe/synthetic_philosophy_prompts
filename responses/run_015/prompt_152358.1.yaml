answer: |-
  **Teaching Plan: Self-Locating Belief and the Modified Sleeping Beauty**
  **Time:** 30 Minutes
  **Audience:** First-Year Philosophy Seminar (No Formal Logic)
  **Tools:** Whiteboard, Markers (Black, Red, Blue)

  ### I. The Setup and Protocol (Minutes 0–7)
  **Goal:** Establish the physical facts without triggering immediate intuition pumps.
  **Whiteboard:** Draw a simple timeline.

  1.  **The Coin (Minute 0–2):**
      *   Draw a coin. Label it "Fair."
      *   State clearly: "On Sunday, we flip the coin. It is Heads or Tails. Probability is 50/50. Everyone agrees on this."
      *   *Intercept Misconception (Causal Evidence):* Explicitly state: "Nothing Beauty does during the week changes the coin. The coin is already settled before she opens her eyes."

  2.  **The Protocol (Minute 2–5):**
      *   **Write the Rule:**
          *   **Heads:** Beauty is interviewed **twice** (Interview A, Interview B).
          *   **Tails:** Beauty is interviewed **once** (Interview A).
      *   **The Amnesia:** "Between interviews, she is given a drug. She forgets the interview happened. She does not know if this is her first time or second time."
      *   **The Question:** "In every interview, the interviewer asks: 'What is your credence (degree of belief) that the coin landed Heads?'"

  3.  **The Scenario Freeze (Minute 5–7):**
      *   Ask the class to imagine they are Beauty. They have just woken up. The interviewer is in front of them.
      *   **Ask:** "Raise your hand if you think the answer is 1/2. Raise your hand if you think the answer is 2/3." (Note: In this modified version, the 'counting' intuition leads to 2/3 Heads).
      *   Acknowledge the split. Do not solve it yet.

  ### II. The Structural Conflict (Minutes 7–20)
  **Goal:** Move the debate from "counting" to "information types."
  **Whiteboard:** Create two columns: "The World" vs. "My Place in the World."

  1.  **The Halfer Position (The World) (Minute 7–12):**
      *   **Argument:** "I know the coin is fair. Waking up was guaranteed to happen regardless of the coin result. I have learned nothing new about the *coin*."
      *   **Write:** "Uncentered Belief: What is the state of the universe?"
      *   **Key Point:** From the outside (God's eye view), the coin is 50/50. Beauty's belief should match the objective chance.

  2.  **The Thirder Position (My Place) (Minute 12–17):**
      *   **Argument:** "If we run this experiment 100 times, there will be roughly 150 interviews. 100 of those interviews happen in Heads-worlds. If I am a random interview, I am likely in a Heads-world."
      *   **Intercept Misconception (Frequency vs. Credence):** Students will say, "But that's just long-run frequency."
      *   **Correction:** "It isn't just about the long run. It is about *sampling*. If you wake up, you are sampling a moment of experience. There are more experience-moments in the Heads scenario."
      *   **Write:** "Self-Locating Belief: Where am I in the timeline?"

  3.  **The Core Distinction (Minute 17–20):**
      *   Draw a stick figure (Beauty).
      *   **Draw two bubbles:**
          1.  "Coin is Heads" (Fact about the world).
          2.  "It is Interview A" (Fact about *me* right now).
      *   **Explain:** "The disagreement isn't about math. It's about whether 'waking up' gives you information about the Coin (Halfer says No) or information about your Location in the schedule (Thirder says Yes)."
      *   **Intercept Misconception (Amnesia Erasing Subject):** Students often think amnesia makes her a "new person."
      *   **Correction:** "She is the same person. She just lacks the *indexical* information of 'when' she is. She knows *who* she is, but not *which day* it is."

  ### III. Intercepting Misconceptions (Minutes 20–25)
  **Goal:** Explicitly address the predictable errors before they solidify.

  1.  **Causal Evidence (Revisit):**
      *   "Does waking up *cause* the coin to be Heads?" No.
      *   "Does waking up *signal* that Heads is more likely?" Only if you think your current existence is a random sample of all possible awakenings.

  2.  **Frequency vs. Credence:**
      *   Clarify: "Credence is what you use to bet *this time*. If you bet on Heads every time you wake up, you win more often in this specific protocol. That is why the 2/3ers feel justified."

  3.  **The Nature of Amnesia:**
      *   Clarify: "Amnesia doesn't reset the universe. It resets her *access* to the universe. The puzzle exists because she knows the protocol but cannot locate herself within it."

  ### IV. Check for Understanding (Minutes 25–28)
  **Goal:** Verify they grasp self-location, not just the arithmetic.
  **Activity:** "The Interviewer's Hint."

  *   **Pose this question to the class:** "Suppose the interviewer whispers to Beauty: 'This is your **first** interview.' Does her credence in Heads change?"
  *   **Correct Answer:** Yes.
      *   If it's the first interview, it could be Heads (Interview A) or Tails (Interview A). Since both coins allow for a first interview, the probability returns to 1/2.
      *   If the interviewer said, "This is your **second** interview," she would know for certain it is Heads (since Tails only has one).
  *   **Why this works:** If they only learned "counting," they might not see why locating herself changes the coin probability. If they understand self-location, they see that knowing *where* she is removes the sampling bias.
  *   **Ask:** "Why did the number change?" Look for answers like "She knows where she is on the timeline" rather than "The math changed."

  ### V. Wrap-Up and Exclusions (Minutes 28–30)
  **Goal:** Define the boundaries of the lesson.

  1.  **Summary:** "We have seen that rational people can disagree because they weigh two different kinds of information differently: objective chance (the coin) vs. subjective location (the awakening)."
  2.  **What We Left Out (Explicitly State):**
      *   "We are **not** using formal 'centered-world semantics.' We talked about 'where am I' instead of technical possible worlds."
      *   "We are **not** connecting this to the Doomsday Argument or Anthropic Principle. Those are huge topics for later weeks."
      *   "We are **not** solving who is right. Philosophers still debate this. The goal was to understand *why* they debate."

  3.  **Final Whiteboard Image:**
      *   Leave the "World vs. My Place" columns visible as they leave.

  ---

  ### Instructor Notes for Delivery

  *   **Tone:** Keep it investigative. You are not teaching the "right" answer; you are teaching the "real question."
  *   **The Modified Protocol:** Be vigilant. Students who have read about Sleeping Beauty online will expect Tails=2 awakenings. Correct them gently: "In *this* seminar, we are using the Inverse Protocol to test the logic, not the tradition."
  *   **Whiteboard Management:** Do not erase the "Heads=2 / Tails=1" rule. Keep it visible the entire time so the structural constraint is always in view.
  *   **Handling the "Counting" Objection:** If a student says, "This is just counting," reply: "Counting is the *result*. The *reason* we count is that we treat awakenings as samples. The Halfer refuses to sample. That is the structural clash."
