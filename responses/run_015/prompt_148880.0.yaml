prompt: |-
  I've been arguing with a friend who builds distributed systems about whether moral philosophy can be formalized the way consensus algorithms are, and I realized my grasp of Scanlon's contractualism is too shallow to defend my side. I'm a longtime reader of rationalist forums with mostly self-taught philosophy, but I understand federated agreement protocols—quorum slices, subjective trust thresholds, Byzantine fault models, and the distinction between a local veto and a global rejection rule—much better than I understand moral theory.

  Could you restate Scanlon's contractualist framework, particularly the aggregation problem, in that vocabulary? By the aggregation problem I mean the idea that wrongness is defined by principles no one could reasonably reject, combined with the claim that we cannot simply pool individual complaints the way a utilitarian sums utilities; each person's burden has to be justified separately. Translate the core pieces—reasonable rejection, the non-aggregability of burdens, and the idea that justification is owed to each individual—into distributed-systems terms as precisely and honestly as you can. For each, say what maps cleanly (for instance, a node refusing a proposal that violates its local consistency conditions), what survives only with distortion (say, treating 'reasonableness' as a latency bound or a Byzantine-fault tolerance parameter), and what has no expression at all in that vocabulary. Then give me the residue report: does the absence of a native concept like 'justification owed specifically to you' or 'non-interchangeable burden' show that contractualism is smuggling in irreducibly moral content, or does it show that my framework is missing a primitive? I want to know whether my intuition—that this is just consensus with extra steps—is missing something real, and please don't import the target framework's hidden assumptions about agreement being sufficient.
reasoning: |-
