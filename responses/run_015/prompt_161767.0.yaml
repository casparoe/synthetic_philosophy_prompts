  6.  **Developing the Leibnizian Critique:**
      *   *On SIA/SSA:* Both assume a "random draw." But there is no urn from which God draws souls. God intellects all possibles and wills the best compossible series.
      *   *On Wrinkle 2 (Duplicates):* If two observers are qualitatively identical, they are numerically identical. There cannot be two distinct monads with exactly the same predicates. So the "counting" strategy of SIA collapses. You cannot count what cannot be distinct.
