prompt: |-
  I'm advising a small philosphy-of-physics group that can fund about three post-docs for two years. We're specifically interested in the Born-rule problem within Everettian quantum mechanics, but we're tired of the same old arguements. Which open questions or lines of work should we actually prioritise — not just what's unresolved, but what matters most if our goal is to figure out whether MWI can underpin quantum information theory without smuggling in classical probability? I'm particularly curious about the tension between decision-theoretic derivations in the style of Deutsch and Wallace and more recent attempts to ground branch weights in symmetry arguments or self-locating uncertainty. Rank them: which is upstream of the others, which is tractable for philosophers rather than physicists, and which would you deprioritise because solving it wouldn't change the practial interpretation of quantum randomness certification? Defend the ordering with explicit criteria — tractability, dependency, and whether the answer actually shifts anything outside pure metaphysics. No need for a reading list; just the agenda and why.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Client:** Small philosophy-of-physics group.
      *   **Resources:** Funding for 3 post-docs for 2 years.
      *   **Topic:** Born-rule problem within Everettian Quantum Mechanics (EQM/MWI).
      *   **Constraint/Goal:** Move beyond "same old arguments." Focus on whether MWI can underpin Quantum Information Theory (QIT) *without* smuggling in classical probability.
      *   **Specific Interest:** Tension between Decision-Theoretic (Deutsch-Wallace) vs. Symmetry/Self-Locating Uncertainty approaches.
      *   **Deliverable:** Ranked agenda (priorities), defended by criteria (tractability for philosophers, dependency/upstream nature, impact on practical interpretation/QIT).
      *   **Exclusion:** No reading list, just agenda and justification.

  2.  **Deconstruct the Core Problem:**
      *   The "Born Rule Problem" in EQM is essentially: How do you get probabilities (specifically $|\psi|^2$) out of a deterministic, unitary theory where everything happens?
      *   *Standard Approaches:*
          *   Decision Theory (DT): Rational agents *act* as if probabilities exist (Deutsch, Wallace).
          *   Self-Locating Uncertainty (SLU): Ignorance about *which* branch you are on (Sebens, Carroll).
          *   Symmetry/Envariance: Deriving weights from invariance under transformations (Zurek, though often seen as physics-heavy).
      *   *The User's Specific Angle:* Can MWI underpin QIT without classical probability? This is crucial. QIT relies on randomness certification, cryptography, etc. If EQM's "probability" is just a measure of existence or rational betting, does it break QIT protocols that assume objective chance or frequentist limits?

  3.  **Evaluate Potential Research Lines:**

      *   *Line A: Refining Decision Theory (DW).*
          *   *Status:* Heavily debated. Many objections (incoherence, circularity).
          *   *Pros:* Philosophically rich.
          *   *Cons:* Might be a dead end for *physics*. Even if DW works, does it justify QIT security proofs?
          *   *Verdict:* Downgrade. It's downstream of the ontology.

      *   *Line B: Self-Locating Uncertainty (SLU) + Indexicality.*
          *   *Status:* Gaining traction (Carroll/Sebens).
          *   *Pros:* Connects better to epistemic states needed for QIT.
          *   *Cons:* Requires a clear account of "branching" and "observer."
          *   *Verdict:* High priority. It addresses the *epistemic* gap needed for information theory.

      *   *Line C: The Ontology of Branching (Decoherence & Structure).*
          *   *Status:* Often assumed fixed.
          *   *Pros:* Upstream. You can't have SLU or DT without well-defined branches.
          *   *Cons:* Very technical (physics-heavy).
          *   *Verdict:* Critical upstream constraint. Philosophers need to analyze the *stability* criteria, not do the math.

      *   *Line D: EQM and Quantum Information Protocols (The "Smuggling" Check).*
          *   *Status:* Neglected. Most EQM work is foundational, not applied.
          *   *Pros:* Directly addresses the user's goal (QIT underpinning).
          *   *Cons:* Requires knowledge of QIT.
          *   *Verdict:* Highest priority. This is the "so what?" test.

      *   *Line E: Symmetry/Envariance.*
          *   *Status:* Zurek's domain.
          *   *Pros:* Derives weights without agents.
          *   *Cons:* Often relies on assumptions that look like probability already.
          *   *Verdict:* Medium priority. Good for cross-checking, but less philosophical leverage than SLU.

  4.  **Develop the Ranking Criteria:**
      *   *Upstream/Dependency:* Does solving this make other problems easier or obsolete?
      *   *Tractability (Philosophers):* Can a philosopher actually make progress, or does it require solving open math problems?
      *   *Impact (Outside Metaphysics):* Does it change how we view QIT, randomness certification, or experimental practice?

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Draft 1 (Mental):* 1. Fix branching. 2. Fix SLU. 3. Check QIT. 4. Ignore DT.
      *   *Critique 1:* Too blunt. Need to explain *why* DT is deprioritized (it's about rationality, not ontology). Need to emphasize the QIT link.

      *   *Draft 2 (Refining):*
          *   Priority 1: The Epistemic-Operational Link (QIT). If EQM can't do QIT, nothing else matters.
          *   Priority 2: The Ontology of Branches (Upstream). SLU needs branches.
          *   Priority 3: SLU vs. DT. SLU wins for QIT.
          *   Deprioritize: Pure DT axioms.

      *   *Refining for the User's Constraints:* The user wants to know about the tension between DT and Symmetry/SLU. I need to frame the ranking around *that* tension but resolve it via the QIT goal.

      *   *Finalizing the Ranking:*
          1.  **Operational Equivalence in QIT Protocols:** (The "Smuggling" Test).
          2.  **The Ontology of Branch Individuation:** (The Upstream Constraint).
          3.  **Self-Locating Uncertainty vs. Decision Theory:** (The Epistemic Mechanism).
          4.  **Symmetry/Envariance Derivations:** (The Cross-Check).
          5.  **Pure Decision-Theoretic Axiomatization:** (Deprioritize).

  6.  **Fleshing out the Justifications (applying criteria):**

      *   *Item 1 (QIT):* Impact is high (practical). Tractability is medium (conceptual analysis of protocols). Upstream? No, it's the final test.
      *   *Item 2 (Branches):* Upstream (high). Tractability (high for philosophers of physics). Impact (high, determines if SLU is even possible).
      *   *Item 3 (SLU vs DT):* Tractability (high). Impact (medium/high). SLU is better for QIT because QIT needs epistemic uncertainty, not just betting behavior.
      *   *Item 4 (Symmetry):* Tractability (low/medium). Impact (medium).
      *   *Item 5 (DT):* Deprioritize. It solves "how to act," not "what is the world." QIT needs the latter.

  7.  **Review against "Tired of same old arguments":**
      *   Avoid rehashing Wallace's proofs.
      *   Focus on the *interface* between EQM and Information Theory.
      *   Focus on the *stability* of branches (FAPP vs. Fundamental).

  8.  **Final Polish:** Ensure tone is advisory, direct, and rigorous. Check word count and formatting. (Self-Correction: Make sure to explicitly address the "smuggling classical probability" concern).

      *   *Key Insight:* The "smuggling" happens when we assume the *statistics* of measurement outcomes match the *weights* of branches without explaining why a single observer experiences frequencies. The QIT angle forces this out into the open.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is a prioritized research agenda for your three post-docs, ranked by **dependency** (upstream constraints), **tractability** (philosophical leverage vs. technical physics), and **external impact** (whether it resolves the "smuggling" worry for Quantum Information Theory).

  ### 1. Operational Equivalence: EQM in Quantum Information Protocols
  **Priority:** Critical / Immediate
  **Role:** The "So What?" Test (Impact)

  **The Project:**
  Do not start with the derivation of the Born rule. Start by auditing specific Quantum Information Theory (QIT) protocols (e.g., BB84 key distribution, randomness expansion, teleportation) to identify exactly where "classical probability" is implicitly assumed in the security proofs. Map these assumptions onto the Everettian ontology.
  *   **Specific Question:** In a security proof that relies on an eavesdropper's inability to predict measurement outcomes, does "prediction" require objective chance, or is epistemic uncertainty within EQM sufficient? If EQM replaces "random outcome" with "branching," does the entropy calculation in the security proof hold without importing a frequentist assumption?
  *   **Why First?** This is your goal criterion. If EQM cannot underpin QIT without smuggling, the metaphysical derivation of the Born rule is practically irrelevant. This defines the success conditions for the other projects.
  *   **Tractability:** High for philosophers. It requires conceptual analysis of existing proofs, not new physics.
  *   **Dependency:** Downstream (it tests the output of the other projects), but logically primary for setting the agenda.

  ### 2. The Ontology of Branch Individuation and Stability
  **Priority:** High / Upstream
  **Role:** The Foundation (Dependency)

  **The Project:**
  Both Self-Locating Uncertainty (SLU) and Decision Theory (DT) fail if "branches" are not well-defined entities prior to the probability assignment. Current EQM relies on decoherence, but decoherence is approximate (FAPP). For QIT, we need to know if the "branch count" or "branch weight" is stable enough to support information-theoretic bounds.
  *   **Specific Question:** Can we define a criterion for branch individuation that is robust enough to support self-location but does not presuppose the Born weights? If branches are fuzzy, does SLU collapse into vagueness that breaks QIT precision?
  *   **Why Second?** This is the most upstream metaphysical constraint. You cannot have uncertainty about *which* branch you are on (SLU) if the "which" is ill-defined. Solving this constrains the viable SLU models.
  *   **Tractability:** High. This is classic philosophy of physics (structure, ontology, emergence) rather than formal physics.
  *   **Impact:** High. If branches are not ontologically robust, EQM cannot support the discrete logic required for QIT.

  ### 3. Self-Locating Uncertainty (SLU) vs. Decision Theory (DT)
  **Priority:** Medium / Core Mechanism
  **Role:** The Epistemic Engine (Tractability)

  **The Project:**
  Prioritize SLU (e.g., Carroll/Sebens style) over DT (Deutsch/Wallace style) for this specific grant goal. DT derives how a rational agent *bets*; SLU derives what an agent *knows*. QIT security relies on an agent's lack of knowledge (entropy), not their betting preferences.
  *   **Specific Question:** Can SLU be formalized without presupposing the very probabilities it seeks to derive? Specifically, does the "Principle of Indifference" over branches require a prior measure (smuggling) to avoid the "counting problem" (where one might count branches rather than weight them)?
  *   **Why Third?** DT is downstream of epistemology. If you can't ground the *uncertainty* (SLU), the *decision* (DT) is moot. Furthermore, DT is less relevant to QIT; a cryptographic protocol doesn't care if a hacker is rational, it cares if they are ignorant.
  *   **Tractability:** High. This is epistemology and philosophy of probability.
  *   **Impact:** Medium/High. Resolving this determines if EQM offers a genuine epistemic account of randomness or just a pragmatic one.

  ### 4. Symmetry and Envariance Arguments
  **Priority:** Low / Cross-Check
  **Role:** The Physics Constraint (Dependency)

  **The Project:**
  Investigate Zurek-style envariance (environment-assisted invariance) not as a derivation of probability, but as a constraint on SLU. Symmetry arguments suggest that branch weights are physical properties independent of observers.
  *   **Specific Question:** Do symmetry arguments fix the "measure problem" in SLU (i.e., why weight by amplitude squared rather than branch count) without invoking decision-theoretic axioms?
  *   **Why Fourth?** These arguments are often physics-heavy and tend to assume the tensor product structure that EQM is trying to justify. They are useful as a sanity check for SLU but are less tractable for philosophers to advance independently.
  *   **Tractability:** Medium/Low. Requires close engagement with technical quantum formalism.
  *   **Impact:** Medium. It helps rule out "branch counting" but doesn't solve the epistemic access problem.

  ### 5. Refining Decision-Theoretic Axioms (Deutsch-Wallace)
  **Priority:** Deprioritize
  **Role:** The Dead End (Impact)

  **The Project:**
  Do not fund work aimed at patching the axioms of Decision Theory (e.g., tweaking Diachronic Consistency or Branching Indifference).
  *   **Why Deprioritize?**
      1.  **Wrong Tool for QIT:** QIT requires objective limits on information access, not norms of rationality. Even if DW succeeds, it only shows a rational agent *acts as if* probabilities exist. It does not show that the *world* supports the entropy calculations needed for randomness certification.
      2.  **Diminishing Returns:** This literature is saturated. New axiom tweaks are met with new counter-examples.
      3.  **Smuggling Risk:** DT is the most accused of smuggling classical probability in via the "rationality" norms.
  *   **Tractability:** Low. The debate is entrenched.
  *   **Impact:** Low. Solving this changes metaphysics, not the viability of EQM for information theory.

  ### Summary of Strategy

  **The Logic of the Order:**
  1.  **QIT Audit (Project 1)** defines the target. If EQM fails here, the rest is academic.
  2.  **Branch Ontology (Project 2)** ensures the target exists. You can't locate yourself on a branch that isn't real.
  3.  **SLU (Project 3)** provides the mechanism for ignorance required by QIT.
  4.  **Symmetry (Project 4)** constrains the weights assigned in SLU.
  5.  **Decision Theory (Project 5)** is set aside because "how to bet" is less fundamental than "what is known" for your specific goals.

  **Why this avoids the "Same Old Arguments":**
  Most EQM funding goes to Project 5 (tweaking DT) or abstract derivations of the Born Rule. By forcing the post-docs to start with **Quantum Information Protocols (Project 1)**, you force the metaphysics to answer to operational constraints. This shifts the debate from "Is probability real?" to "Is this ontology sufficient for cryptography?" If the answer to the latter is no, the former doesn't matter. This is the most efficient way to determine if MWI can underpin QIT without smuggling.
