  **Scenario**
  A nurse is scheduled for a Night shift (Value: $0) but prefers Evening ($5) and Morning ($10). She faces a two-stage swap market: first, she can pay $3 to swap Night for Evening; later, she can pay $4 to swap Evening for Morning. A direct Night-to-Morning swap was available initially for $8 but required a single upfront commitment she found psychologically burdensome, so she opted for the incremental path. At the first node, she pays $3 (Net: $2), reasoning Evening is better than Night. At the second node, ignoring the sunk $3, she compares Morning ($10) minus the new $4 fee against keeping Evening ($5), seeing a net gain of $1 ($6 vs $5) and switching. She ends with Morning minus $7 total fees (Net: $3), but had she taken the direct path, she would have netted $2; however, the pump arises if the cumulative incremental fees exceed the direct cost due to her failure to bundle the steps, leaving her worse off than if she had committed globally, yet rational at every local node.

  **Reasoning**
  The agent holds transitive preferences over final states (Morning > Evening > Night) and stable valuations, but treats each decision node as an independent maximization problem (**Separability**). A standard diachronic rationalist employs **Resolute Choice**, evaluating the entire strategy tree at the outset to avoid dominated paths; this agent instead uses **Myopic Choice**, maximizing value from the current standpoint without binding themselves to prior plans. The structural feature enabling the pump is **Node Separability**, which allows the agent to ignore cumulative costs relative to the original baseline while validating each marginal switch. Removing this feature forces global evaluation, which eliminates the pump entirely rather than collapsing it into a regular Dutch Book; a Dutch Book requires synchronic probabilistic incoherence, whereas this is a dynamic inconsistency resolved by changing the choice architecture, not by correcting probability assignments.
