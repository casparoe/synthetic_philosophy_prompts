answer: |-
  You are describing a specific, coupled dynamic that sits at the intersection of **Campbell's Law**, **Gresham's Law**, and **Rent-Seeking**, but you are correct that none of those terms individually capture the *reflexive feedback loop* between metric degradation and participant selection.

  The rationalist canon (Moloch, Goodhart, Tragedy of the Commons) tends to treat the system as a static pressure cooker. Your observation adds a *time* dimension and a *selection* dimension: the system evolves to select for the very agents that accelerate its decay, while third-party extractors tighten the screws.

  Here is the breakdown of the neighboring concepts, where they fit, where they fail, and the proposed term for the specific animal you are tracking.

  ### The Neighboring Concepts

  **1. Campbell's Law (The Metric Degradation)**
  *   **The Concept:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."
  *   **Where it fits:** This is your Feature One. As transcripts inflate (corruption), admissions leans harder on them or narrower proxies (distortion).
  *   **Where it fails:** Campbell's Law describes the *corruption of the measure*. It does not inherently describe the *selection of the participants*. It implies the process gets noisy, but not necessarily that the noise selects for a specific type of agent who then accelerates the noise. It lacks the "dropout makes the trap tighter" mechanic.

  **2. Gresham's Law / Adverse Selection (The Participant Selection)**
  *   **The Concept:** "Bad money drives out good." In labor markets (Akerlof's Lemons), if buyers can't distinguish quality, they pay average prices, driving high-quality sellers out of the market.
  *   **Where it fits:** This is your Feature Two. Honest/low-gaming candidates drop out because the cost of signaling honestly is too high relative to the noisy return. The remaining field is disproportionately composed of those willing/able to game.
  *   **Where it fails:** Standard Adverse Selection usually results in market *collapse* (no one trades). In your scenario, the market doesn't collapse; it *intensifies*. The race speeds up. Gresham's Law explains who leaves, but not why the remaining participants escalate the waste rather than settling into a low-trust equilibrium.

  **3. Costly Signaling (The Waste)**
  *   **The Concept:** Signals must be expensive to be honest (e.g., a peacock's tail).
  *   **Where it fits:** Explains the aggregate waste (the arms race).
  *   **Where it fails:** Costly signaling theory assumes the signal remains *honest* because of the cost. In your scenario, the signal is becoming *dishonest* (grade inflation, AI-polished portfolios) but is treated as honest. Furthermore, standard signaling doesn't account for the *concentrated winners* (the prep companies) who have an incentive to prevent the signal from becoming truly honest again.

  **4. Rent-Seeking (The Concentrated Winners)**
  *   **The Concept:** Increasing one's share of existing wealth without creating new wealth.
  *   **Where it fits:** Explains the test prep companies, credentialing vendors, and ranking agencies. They are the "concentrated winners" you identified.
  *   **Where it fails:** Rent-seeking describes the *extractors*, not the *competitors*. It doesn't explain the internal dynamics of the applicant pool or the degradation of the criteria themselves.

  ### The Gap

  The missing piece is the **coupling**.
  In a standard Moloch trap, the incentives escalate. In your scenario, the *mechanism of evaluation* degrades, which changes the *optimal strategy* for participants, which changes the *population* of participants, which further degrades the *mechanism of evaluation*.

  It is a **positive feedback loop between metric corruption and agent selection.**

  ### The Coined Term: **Degenerative Selection**

  Since there is no canonical term that binds the metric collapse (Campbell) to the agent selection (Gresham) in a runaway loop, I propose **Degenerative Selection**.

  **Definition:**
  A systemic dynamic in a positional competition where:
  1.  **Metric Collapse:** Evaluation criteria degrade under gaming pressure, leading evaluators to narrow reliance to increasingly gameable proxies.
  2.  **Agent Selection:** Participants unwilling or unable to game the proxies drop out, leaving a pool disproportionately composed of high-gaming agents.
  3.  **Reflexive Acceleration:** The remaining high-gaming agents accelerate the degradation of the proxies, which further tightens the selection for gaming ability, creating a runaway loop that benefits third-party extractors while reducing the functional quality of the selected cohort.

  **Why this fits:**
  It captures the "degradation" (the signal quality drops), the "selection" (the population shifts), and the "loop" (each feeds the other). It distinguishes itself from a standard arms race by noting that the *quality of the winner* may actually decrease (hollowing out) even as the *cost to win* increases.

  ### Boundary Cases

  To ensure this term is tight and not just a synonym for "arms race," here are the boundary cases:

  **1. False Positive (Looks like it, isn't): The Standard Price War**
  *   **Scenario:** Two gas stations across the street from each other drop prices to undercut one another. Margins vanish.
  *   **Why it's not Degenerative Selection:**
      *   *Metric:* Price is not degrading; it is functioning perfectly as a signal of undercutting.
      *   *Selection:* The stations aren't changing their internal nature to become "better at price wars" in a way that breaks the concept of selling gas.
      *   *Quality:* The gas doesn't get worse (necessarily).
      *   *Extractors:* There are no third-party vendors profiting specifically from the *mechanism* of the price war itself.
      *   *Verdict:* This is a standard **Bertrand Competition** / Moloch trap. No metric collapse, no agent selection shift.

  **2. False Negative (Is it, but looks different): The Scientific Replication Crisis**
  *   **Scenario:** Researchers face "publish or perish." They p-hack to get significant results. Journals demand novelty over robustness. Honest researchers who can't produce flashy results leave academia or stop publishing. The remaining field is dominated by those skilled at producing publishable (but fragile) results. Journals (extractors) profit from submission fees and prestige.
  *   **Why it IS Degenerative Selection:**
      *   *Metric:* "Significance" becomes a gameable proxy for "truth."
      *   *Selection:* Rigorous scientists are selected out; p-hackers are selected in.
      *   *Reflexive:* As p-hacking becomes common, journals demand even more novelty/complexity to filter, which requires more p-hacking.
      *   *Verdict:* This often gets labeled just "Goodhart's Law," but that misses the *population shift*. Calling it **Degenerative Selection** highlights that the *community itself* is evolving to be worse at science, not just that the metrics are broken.

  ### Summary
  You are circling **Degenerative Selection**. It is a specific, pathological subtype of a multipolar trap where the *measurement system* and the *participant pool* co-evolve toward lower fidelity, locked in place by concentrated extractors who profit from the friction.

  It is **Campbell's Law** (metrics break) eating itself via **Gresham's Law** (honest agents leave), fueled by **Rent-Seekers** (who keep the fire burning).
