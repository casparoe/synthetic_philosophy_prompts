  # The Rescuer's Tree: A Decision Map for Taurek's Problem

  **How to use this:** Start at the top. Answer each question based on your gut reaction to the concrete case provided. Follow the branch until you reach a leaf. The whole walk-through takes about ten minutes.

  ### The Decision Tree

  **Q1. The Difference (Distinctions 1, 5, 7)**
  *Case:* You can save David (1) or a Group (5). All are strangers. All will die soon if not saved. All have an equal claim to your help.
  *Question:* Does the fact that there are **five** rather than **one** make *any* difference to what you ought to do?
  *   **No:** Go to **Q2**.
  *   **Yes:** Go to **Q3**.

  **Q2. The Method (Distinction 3)**
  *Case:* Since numbers don't matter, how do you choose?
  *Question:* Do you give each *person* an equal chance, or each *group* a chance?
  *   **Each Person (Coin Flip):** → **Leaf A: The Equal Chancer**
  *   **Each Group (Weighted):** → **Leaf B: The Proportionalist**
  *   *(Empty Cell: "Save the One because he is nearer." Why: Arbitrary/Unattractive)*

  **Q3. The Force (Distinction 2)**
  *Case:* Numbers matter. Does saving the five become **required**, or is it merely **allowed** (you could still save David)?
  *   **Required:** Go to **Q4**.
  *   **Allowed:** Go to **Q5**.

  **Q4. The Mechanism (Distinction 3 — Maya's Case)**
  *Case:* You can save **David (1)** with **100% certainty**. Or you can save the **Group (5)** with an **80% chance** (correlated: all live or all die). Expected lives: 1 vs 4.
  *Question:* Do you save the **One Certain** life or the **Five Probable** lives?
  *   **Five Probable (Maximize Expectation):** Go to **Q6**.
  *   **One Certain (Prioritize Certainty):** → **Leaf C: The Certainty Prioritarian**
  *   *(Empty Cell: "Flip a coin." Why: Incoherent if numbers are required)*

  **Q5. The Reason (Distinction 2, 7)**
  *Case:* You are allowed to save either. Why do the numbers matter at all?
  *Question:* Do they matter generally, or only because the claims are otherwise **equal**?
  *   **Generally (Reason to prefer):** → **Leaf D: The Permissive Aggregator**
  *   **Only if Equal (Tie-Breaker):** → **Leaf E: The Tie-Breaker**
  *   *(Empty Cell: "Numbers matter but count against the five." Why: Unvisited/Incoherent)*

  **Q6. The Constraint (Distinctions 4, 6)**
  *Case:* Saving the five requires **pushing David** into the fire (killing him), not just walking away. Or: The five lose a **finger** each, David loses his **life**.
  *Question:* Do the numbers still force you to save the five?
  *   **Yes (Numbers Trump):** → **Leaf F: The Pure Aggregator**
  *   **No (Constraints Trump):** Go to **Q7**.

  **Q7. The Threshold (Distinction 6)**
  *Case:* Five lose a finger. David loses a life.
  *Question:* Does the difference in **stakes** change your duty?
  *   **Yes (Stakes Matter):** → **Leaf G: The Threshold Deontologist**
  *   **No (Killing is Absolute):** → **Leaf H: The Constraint Holder**
  *   *(Empty Cell: "Save the fingers." Why: Unattractive)*

  **Q8. The Pattern (Distinction 8)**
  *Case:* You will face this choice **100 times** in your career.
  *Question:* Must you save the one **at least sometimes**, or maximize every time?
  *   **Maximize Every Time:** → **Leaf F: The Pure Aggregator** (Revisited)
  *   **Distribute Choices:** → **Leaf I: The Distributor**

  ---

  ### The Leaves (Positions)

  | Leaf | Position Name | The Uncomfortable Thing to Swallow |
  | :--- | :--- | :--- |
  | **A** | **The Equal Chancer** | You must flip a coin, accepting a 50% chance that *all five* die. |
  | **B** | **The Proportionalist** | You give the group a 5/6 chance, but might still let all five die. |
  | **C** | **The Certainty Prioritarian** | You let four expected lives die to secure one certain life. |
  | **D** | **The Permissive Aggregator** | You may let the five die even though you could have saved them. |
  | **E** | **The Tie-Breaker** | If the five are slightly 'worse' people, their numbers stop counting. |
  | **F** | **The Pure Aggregator** | You must push David into the fire if it saves the five. |
  | **G** | **The Threshold Deontologist** | You must let five lose fingers to save one life (if killing is involved). |
  | **H** | **The Constraint Holder** | You must let five die rather than get your own hands dirty. |
  | **I** | **The Distributor** | You must deliberately choose the 'worse' outcome sometimes to be fair. |
  | **J** | *(No Settled Name)* | **Diminishing Weight:** 5 > 1, but 100 is not much > 5. (Uncomfortable: Arbitrary cutoff points). |

  *(Note: Leaf J is located at Q4/Q6 intersection where one accepts numbers count but rejects linear aggregation.)*

  ---

  ### Testing Your Case: Maya's Device

  You suspected Maya's Case (1 Certain vs. 5 @ 80% Correlated) separates "adding lives" from "adding chances." The tree confirms this at **Q4**.

  *   **The Split:** It separates **Leaf F (Pure Aggregator/Expected Value)** from **Leaf C (Certainty Prioritarian)**.
  *   **What it separates:** It distinguishes judging a choice by its **expected outcome** (4.8 lives > 1 life) from judging it by **individual security** (100% chance > 80% chance).
  *   **Verdict:** Your suspicion is correct. Most students who say "Numbers Count" stumble here. If they save the five, they are aggregating *expectations*. If they save the one, they are aggregating *certainties* or prioritizing the *individual claim* over the *group probability*. This is the sharpest knife in the tree for cutting through vague "utilitarian" labels.

  ---

  ### The Final Three Deliverables

  **1. Two leaves the tree does not separate (and the case that does)**
  *   **The Leaves:** **Leaf D (Permissive Aggregator)** and **Leaf E (The Tie-Breaker)**.
  *   **Why:** In the standard case (5 strangers vs. 1 stranger, equal stakes), both positions permit saving the one. The tree asks if numbers matter "generally" or "only if equal," but in practice, respondents often conflate "permission" with "tie-breaking."
  *   **The Case to Prise Them Apart:** **The Unequal Claims Case.** Suppose David is a convicted murderer and the five are pediatric surgeons.
      *   **The Tie-Breaker** says numbers no longer matter (claims aren't equal); you might save David based on other criteria.
      *   **The Permissive Aggregator** says numbers still add weight to the five, even if their claims are slightly less pure; the five still pull harder than David.

  **2. Which normative question is the tree answering?**
  *   The tree answers: **"What the agent ought to do" (Obligation/Duty).**
  *   Evidence: The branches distinguish between *Must* (Required) and *May* (Permitted). A tree about "What is Best" would not have a "Permitted" branch (it would always be best to save the five). A tree about "What is Permitted" would not have a "Required" branch (saving the one is always permitted unless prohibited).

  **3. Which branches would redraw if answering a different question?**
  *   **If answering "What is Best?" (Value):**
      *   **Q3 (The Force)** collapses. There is no "Allowed" branch; saving the five is always *better*, even if not *required*. Leaves D and E vanish into F.
      *   **Q8 (The Pattern)** becomes irrelevant. It is always best to maximize every time; distribution has no intrinsic value.
  *   **If answering "What is Permitted?" (Rights):**
      *   **Q3 (The Force)** inverts. The "Required" branch becomes the problem. If saving the one is *permitted*, the branch leads to "Rights Holder."
      *   **Q6 (The Constraint)** expands. If the question is "May I kill David?", the answer is likely "No" regardless of the numbers, merging Leaves F, G, and H into a single "Constraint" leaf.
