      *   The "two-week overlap" is the smoking gun. During those two weeks, "You 1" and "You 2" have different experiences. They diverge. If they diverge, they are numerically distinct.
      *   Killing "You 1" makes it murder/suicide, not travel.

  7.  **Survival vs. Identity:**
      *   Derek Parfit's distinction is crucial here.
      *   *Identity:* Numerical sameness (A is B).
