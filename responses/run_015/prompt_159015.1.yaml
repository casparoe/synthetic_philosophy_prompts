  5.  **Identifying the Breaks in the Analogy:**
      *   *Break 1: Branching.* Anaesthesia has one waker. Teleport has two wakers (initially).
      *   *Break 2: Physical Continuity.* Anaesthesia keeps the brain running (mostly). Teleport replaces it (gradually) then creates a *separate* instance.
      *   *Break 3: The "Gap".* In anaesthesia, the gap is in experience. In teleport, the gap is in *location* and *substrate*, but the real issue is the *divergence* of experience during the two weeks.
