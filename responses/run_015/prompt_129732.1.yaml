answer: |-
  You have a very sharp intuition for this. You've correctly identified that "missing evidence" is used by both serious historians and pseudohistorians, but the *reason* for the missing evidence changes everything.

  There is one principle that captures your gut feelings across all these cases. It is called **Consilience** (or the "Web of Verification").

  ### The Principle: Consilience
  **Real history must fit into a web of independent evidence.**
  History isn't just old books talking about other old books. Real history has to align with tree rings (dendrochronology), ice cores (climate data), astronomy (eclipse records), geology (volcanic layers), and genetics (DNA).

  *   **Real Historical Hypotheses:** Add a new thread to the web without cutting existing ones. They explain missing evidence through **natural processes** (decay, fire, loss).
  *   **Pseudohistory:** Cuts through the web. It requires you to ignore independent data (like tree rings or Chinese records) to work. It explains missing evidence through **human intent** (conspiracy, erasure, forgery).

  Here is how this rule applies to your specific cases.

  ### 1. Why Phantom Time feels different (but still fails)
  You noted that Heribert Illig's "Phantom Time" (inventing 300 years) feels closer to a debate than Fomenko. You're right. Illig used architectural styles and calendar quirks, which sounds academic. Fomenko just uses math and vibes.

  **However, under the Consilience Rule, both fail.**
  To make Phantom Time work, you have to believe that:
  1.  Christian monks forged European records.
  2.  **AND** the Chinese Empire, who were keeping independent astronomical records at the exact same time, also faked their logs to match the European lie.
  3.  **AND** trees grew 300 extra rings of growth during that period for no reason.

  Because it requires cutting the "threads" of astronomy and biology to save the "thread" of architectural confusion, it is pseudohistory.

  ### 2. The Verdict on Your Olmec Palm-Leaf Case
  **Verdict: Valid Historical Hypothesis (Not Pseudohistory)**

  Your Olmec idea passes the Consilience Rule.
  *   **Does it cut the web?** No. It fits with biology (palm leaves rot in humid jungles). It fits with anthropology (later Maya used perishable bark paper). It fits with archaeology (we see Olmec iconography that looks like writing, e.g., the Cascajal Block).
  *   **Missing Evidence:** You attribute the lack of writing to **Preservation Bias** (nature destroyed it), not **Erasure** (enemies destroyed it).

  Historians actually debate this exact point. Because your hypothesis relies on known physical decay rather than a conspiracy to hide the leaves, it is methodologically sound, even if we can't prove it's true yet.

  ### 3. The Verdict on the Library of Alexandria (Acid Rain vs. Fire)
  **Verdict: Pseudohistory**

  Here is where the Consilience Rule catches the claim immediately.
  *   **The Claim:** The library was destroyed by acid rain from a *nearby* volcano.
  *   **The Web Check:** Geology.
  *   **The Problem:** There are **no active volcanoes near Alexandria, Egypt.** The nearest significant volcanoes are in Italy (Vesuvius/Etna) or Greece (Thera), hundreds of miles away across the sea.

  For this theory to be true, you would have to ignore basic geography and geology. While papyrus *would* rot from acid rain, the source of the rain is geologically impossible for that location.
  *   **If they claimed "Distant Volcano":** It becomes an **Unproven Theory**. It would need to align with ice-core data showing a massive eruption at the exact time of the Library's decline.
  *   **Because they claim "Nearby":** It is **Pseudohistory**. It requires you to believe in a volcano that doesn't exist to explain away the historical accounts of fire.

  ### Summary of Your Rule
  To decide if something is real history or made-up, ask:
  **"Does this theory require me to ignore science (geology, astronomy, biology) to believe it?"**

  *   **Atlantis/Aliens:** Ignores archaeology/engineering. (Fake)
  *   **Fomenko/Phantom Time:** Ignores astronomy/tree rings. (Fake)
  *   **Olmec Leaves:** Uses biology (rotting) to explain gaps. (Real Hypothesis)
  *   **Black Death/Volcano:** Uses climate science (ice cores) to modify causes. (Real Debate)
  *   **Alexandria/Volcano:** Ignores geography (no nearby volcano). (Fake)

  Your gut was right: The Olmec idea is the only one on your list that respects the "Web of Verification." Keep trusting that instinct.
