  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Collective Responsibility for the First World War and the Fischer Controversy
  **Participating Camps:** Collective Intentionalists (Camp One) and Structural Attributivists (Camp Two)
  **Date:** October 26, 2023

  ## I. STATEMENT OF AGREED CLAIMS

  The undersigned parties affirm the following propositions as established premises for further inquiry. These claims represent the intersection of historical consensus regarding the Fischer Controversy and shared philosophical ground regarding the nature of agency.

  1.  **Regarding Fritz Fischer's Archival Findings:** Both camps agree that Fritz Fischer's research demonstrated that specific elements within the German political and military elite (specifically Chancellor Bethmann-Hollweg and the General Staff) entertained expansionist war aims and were willing to risk a general European conflict in July 1914 to achieve them. Both camps agree Fischer did not prove that every member of the German government, let alone the populace, held this specific intention.
  2.  **Regarding Critiques of Fischer:** Both camps acknowledge that Fischer's critics successfully demonstrated that the German leadership acted under significant perceived duress regarding encirclement and the timeline of Russian mobilization. The decision for war was not a unilateral fiat but a reactive sequence within a multi-polar alliance system.
  3.  **Regarding the July Crisis Decision Structure:** It is undisputed that the German state possessed a hierarchical command structure capable of executing mobilization orders (specifically the Schlieffen Plan) with high efficiency. However, it is also undisputed that the German public was not consulted on the specific diplomatic ultimatums issued in July 1914, and public enthusiasm ("the spirit of 1914") post-dated the critical decision windows.
  4.  **Regarding the Distinction Between Blame and Culpability:** Both camps agree that *collective blame* (attributing a moral fault to a group entity) is conceptually distinct from the *sum of individual culpability* (aggregating the moral faults of specific members). Both camps agree that one cannot automatically infer the former from the latter without a mediating theory of group agency or structural connection.

  ## II. TABLE OF DISAGREEMENTS

  The following table outlines the substantive divergences between the two camps. Each position is articulated in terms acceptable to its proponents, avoiding caricature.

  | Feature of Inquiry | Camp One: Collective Intentionalists | Camp Two: Structural Attributivists |
  | :--- | :--- | :--- |
  | **Primary Criterion for Responsibility** | Responsibility requires a *shared intention*. A nation is only responsible if its members participate in a joint commitment akin to Michael Bratman's model of shared cooperative activity, involving interlocking intentions and mutual responsiveness. | Responsibility arises from *participation in structural processes*. Following Iris Marion Young, liability attaches to agents who contribute to the structural processes that produce outcomes, regardless of whether they share a unified mental state. |
  | **Interpretation of Fischer's Evidence** | Fischer's evidence isolates the *mens rea* of a specific clique. Because the broader population and lower bureaucracy did not share the specific intention to provoke a general war, the entity "Germany" cannot be said to have intentionally initiated the conflict. | Fischer's evidence reveals the *operational logic* of the German state apparatus. The specific mental states of the elite are less relevant than the fact that the state's institutional machinery was positioned to escalate the crisis inevitably. |
  | **The Status of the State** | The state is a fictional agent unless it can be shown to possess a unified will constituted by the interlocking intentions of its constituents. Without this, "Germany" is merely a shorthand for specific individuals. | The state is a real structural entity with causal powers. It acts through roles and institutions that constrain and direct individual behavior, generating outcomes that cannot be reduced to individual choices alone. |
  | **Implication for the Populace** | The general population bears no collective blame for the outbreak of war unless it can be proven they knowingly endorsed the specific aggressive intentions of the elite as part of a joint project. | The general population bears political responsibility insofar as they sustained the institutions (through taxes, loyalty, or passive compliance) that enabled the state's aggressive posture, even without specific knowledge of policy details. |

  ## III. CRUXES AND TEST CASES

  The collaboration identifies two fundamental cruxes that prevent reconciliation of the above positions. For each crux, a concrete test case is proposed. Each camp records its prediction regarding what the case demonstrates prior to adjudication.

  ### Crux 1: Hierarchical Institutions and Joint Commitment
  **The Philosophical Question:** Can a rigid, top-down hierarchy instantiate a Bratman-style joint commitment, or does the lack of bidirectional responsiveness among subordinates negate collective intentionality?

  **The Test Case:** *The Execution of the Schlieffen Plan (August 1914).*
  This episode involves the rapid mobilization of millions of conscripts and railway workers who followed orders to invade Belgium and France. These actors did not negotiate the plan; they executed it.

  *   **Camp One Prediction:** This case demonstrates a *lack* of collective intention. The railway workers and conscripts acted on coerced or isolated intentions (obedience, duty) that did not mesh with the elite's intention (preventive war) in a way that satisfies the requirement for mutual responsiveness. Therefore, the invasion was an act of the elite *using* the nation, not an act *by* the nation.
  *   **Camp Two Prediction:** This case demonstrates *structural agency*. The seamless execution of the plan proves the state functioned as a unified agent. The lack of bidirectional communication is irrelevant; the institutional roles defined the action. The nation acted because the structure integrated individual actions into a single systemic outcome.

  ### Crux 2: Awareness and the Social-Connection Model
  **The Philosophical Question:** Does Young's social-connection model require a threshold of shared awareness among the population to ground responsibility, or does mere participation in the background structures suffice?

  **The Test Case:** *The Hypothetical "Ignorant Citizenry" Scenario.*
  Consider a historical scenario where the state censors all diplomatic correspondence, and the citizenry genuinely believes the war is purely defensive, while the state institutions are objectively the aggressor (as Fischer alleged).

  *   **Camp One Prediction:** In this scenario, the citizenry is exonerated from collective blame. Without awareness of the aggressive policy, they cannot form the shared intention required for joint action. To blame them is to commit a category error regarding moral agency.
  *   **Camp Two Prediction:** In this scenario, the citizenry retains political responsibility. Under the social-connection model, responsibility is forward-looking and structural. By benefiting from the state's security and economic structure, and by failing to disrupt the institutions that produced the aggression, the citizenry remains implicated regardless of subjective ignorance.

  ## IV. ANALYSIS OF VERBAL DISPUTE

  The collaboration concludes that a significant portion of the disagreement is verbal, though it rests upon a substantive metaphysical divergence.

  **1. The Verbal Component:**
  The camps are utilizing the term "Responsibility" (and colloquially, "Blame") to denote two distinct concepts.
  *   **Camp One** employs a *Retrospective Moral Liability* concept. For them, "Germany is responsible" is synonymous with "Germany is morally guilty," which necessitates intent.
  *   **Camp Two** employs a *Prospective Political Responsibility* concept (aligned with Young). For them, "Germany is responsible" is synonymous with "Germany is the appropriate agent to address the harms caused and reform the structures that caused them," which necessitates causal connection but not necessarily guilt.

  When Camp One says, "The nation cannot be blamed," they mean, "The nation cannot be held morally guilty." When Camp Two says, "The nation bears responsibility," they mean, "The nation is the locus of obligation for repair and reform." If both parties explicitly distinguished between *Moral Guilt* and *Political Liability*, the apparent contradiction in their conclusions regarding the German populace would largely dissolve.

  **2. The Substantive Component:**
  However, the disagreement is not *merely* verbal. There remains a metaphysical dispute regarding **Group Agency**.
  *   Camp One holds that group agency is *reducible* to the psychological states of individuals (specifically, their interlocking intentions).
  *   Camp Two holds that group agency is *emergent* from structural relations and exists independently of the psychological states of the individuals occupying the roles.

  Even if the terminology were standardized, Camp One would still deny that the German state possessed the *capacity* to intend war in a meaningful sense beyond the sum of its leaders' minds. Camp Two would affirm that capacity. Therefore, while the practical implications regarding punishment might be resolved by clarifying definitions, the theoretical disagreement regarding the ontology of the state remains substantive.
