answer: |-
  Here is the 90-minute battle plan. It is designed to prevent the "definition drift" you described by anchoring every abstract concept to a single, concrete clinical analogy.

  ### 1. The Carrying Example: Myopia (Nearsightedness)
  **Do not use PKU.** Your instinct to worry is correct. Residents will silo PKU as "Mendelian exception" and fail to transfer the logic to MDD. Do not use IQ (too charged) or Height (too abstract).

  **Use Myopia.**
  *   **What it must have:** High heritability (~0.8, similar to the "strong genetic signal" they expect), clear polygenic architecture (like MDD), clear environmental drivers (near-work, lack of sunlight), and a **reliable intervention** (glasses/contacts/laser).
  *   **What it must lack:** Stigma (unlike addiction), political charge (unlike IQ), and "brain mystery" (unlike MDD).
  *   **Why:** It allows you to say, "Myopia is 80% heritable. Does that mean glasses don't work?" The answer is obviously "No." This kills the "Genetic = Immutable" myth instantly without needing to debate single-gene vs. polygenic architecture.

  ---

  ### 2. The Sequence of Ideas (Dependencies)
  You cannot explain Misconception B until Misconception A is resolved. Here is the dependency chain. If you break this order, they will revert to "40% of *me* is genes."

  1.  **Variance vs. Cause (Minute 0–15):**
      *   *Concept:* Heritability explains why Patient A differs from Patient B, not why Patient A has the disease.
      *   *Dependency:* This is the foundation. If they think $h^2$ applies to an individual, nothing else makes sense.
      *   *Action:* Start with the resident's quote: "Depression is 40% genetic." Correct it immediately: "In this specific population, 40% of the *differences* in who gets depressed are associated with genetic differences."

  2.  **The Ratio ($V_G / V_P$) (Minute 15–35):**
      *   *Concept:* Heritability is a fraction. The denominator is Total Variance (Genes + Environment + Error).
      *   *Dependency:* You need this to explain why changing the environment changes the heritability number without changing the DNA.
      *   *Action:* Use Myopia. In a population where everyone reads 10 hours a day, environmental variance is low $\rightarrow$ Heritability looks high. In a population with random reading habits, environmental variance is high $\rightarrow$ Heritability looks lower.

  3.  **Immutability (Minute 35–50):**
      *   *Concept:* High $h^2$ does not mean unchangeable.
      *   *Dependency:* Relies on The Ratio. If you change the environment (glasses/diet/therapy), you change the denominator or the mean, even if $V_G$ stays the same.
      *   *Action:* "Myopia is 80% heritable. Do glasses work? Yes. MDD is 40% heritable. Does therapy work? Yes."

  4.  **Between-Group Fallacy (Minute 50–65):**
      *   *Concept:* Within-population $h^2$ cannot explain between-population mean differences.
      *   *Dependency:* Relies on Variance vs. Cause.
      *   *Action:* Two cornfields (Lewontin's classic). Same seeds, different soil. High $h^2$ within fields, but the difference *between* fields is 100% soil.

  5.  **The "Environment Equalization" & "Obesogenic" Paradox (Minute 65–75):**
      *   *Concept:* Addressing your specific question about the two "heritability went up" scenarios.
      *   *Placement:* Put them here, together. They are the **same mathematical mistake** (ignoring the ratio), even if the biological mechanisms differ.
      *   *The Mistake:* Residents think "Heritability went up, so genes got stronger."
      *   *The Correction:*
          *   *Case A (Equalized Environment):* $V_E$ shrank. Denominator shrank. Fraction ($h^2$) grew. Genes didn't change.
          *   *Case B (Obesogenic Environment):* This is often Gene-Environment Interaction. In a calorie-scarce environment, genetic propensity for obesity is masked (everyone is thin). In a calorie-rich environment, genetic differences are *unmasked* (some get fat, some don't). $V_G$ expression increased. Genes didn't change, *penetrance* did.
      *   *Takeaway:* In both cases, the **genes did not get stronger.** The *context* changed how much the genes mattered for variance.

  6.  **Heritability of Treatment Response (Minute 75–85):**
      *   *Decision:* **Absorb it.** Do not defer.
      *   *Why:* This is the only part that feels like *psychiatry* to them. It validates their clinical observation that "Patient A responds to SSRI, Patient B doesn't."
      *   *Concept:* Yes, response to treatment has variance. Yes, that variance can be partitioned. If $h^2$ of response is high, it means genetic differences predict who gets better *given the treatment*. It does not mean the treatment only works on "genetic" depression.
      *   *Risk:* Keep it to 10 minutes. Do not drift into pharmacogenomics testing (commercial pitfalls). Keep it on the *statistic*.

  7.  **Clinical Application & Assessment (Minute 85–90):**
      *   *Goal:* Patient communication.
      *   *Script:* "Depression runs in families, and we see that in the data. But that number describes groups, not you. For you, it's about how your biology interacts with your life. The good news is that just because it runs in families doesn't mean it's fixed."

  ---

  ### 3. The Misconception Kill-Order
  Address them exactly when they naturally arise in the sequence above.

  1.  **"40% of *my* depression is genes."**
      *   *Kill at Minute 5.*
      *   *Method:* The "Single Patient" test. Ask: "If I sequence this patient, can I find the 40%?" (No). "Can I find the 60% environment?" (No). "Then what does the number measure?" (The spread of the group).
  2.  **"So therapy is just noise / It's fixed."**
      *   *Kill at Minute 40 (Immutability section).*
      *   *Method:* The Myopia/Glasses analogy. High $h^2$ + Effective Intervention = Compatible.
  3.  **"Heritability explains why Group A is sicker than Group B."**
      *   *Kill at Minute 55 (Between-Group section).*
      *   *Method:* The Cornfield analogy. Keep it visual.
  4.  **"Environment equalization made the genes stronger."**
      *   *Kill at Minute 70 (Ratio section).*
      *   *Method:* The Fraction. Write $h^2 = V_G / (V_G + V_E)$ on the board. Cross out $V_E$. Ask what happens to the fraction.

  ---

  ### 4. The Final Assessment Question
  Do not ask them to define heritability. Ask them to predict a change in the statistic based on a clinical intervention.

  **The Question:**
  > "We develop a new psychotherapy that is equally effective for every single patient, regardless of their genetic background or trauma history. It eliminates symptoms in 100% of cases. If we measure the heritability of *depressive symptoms* in this treated population, what happens to the $h^2$ estimate compared to the untreated population?"

  **The Answer:**
  > **It goes to zero.**
  > **Why:** Because there is no longer any *variance* in the phenotype ($V_P = 0$). If everyone is healthy, genes cannot explain differences.
  > *(Note: If they argue "liability," accept it, but push for "observed symptoms." The point is that $h^2$ describes the variance present in the room.)*

  **Why this works:** It proves they understand that $h^2$ is a property of the **population's variance**, not a property of the **trait's essence**.

  ---

  ### 5. What to Explicitly Skip
  Name these omissions at the start so they don't hunt for them later.

  1.  **Falconer's Formula / ACE Math:** Do not derive the twin correlation math. It consumes 20 minutes and adds zero clinical value.
  2.  **Molecular Mechanisms:** Do not discuss SNPs, GWAS pipelines, or "missing heritability" mechanics. They only need to know GWAS finds many small effects, not how the chip works.
  3.  **Epigenetics:** It is a distraction. It invites the "so environment changes genes?" confusion. Ban the word for this session.
  4.  **Specific Gene Names:** No 5-HTT, no BDNF. Keep it at the level of "Genetic Variance."

  ### Summary of the "Why" for the Order
  You start with **Variance** because without it, they interpret the number as **Causation**.
  You move to **Ratio** because without it, they interpret the number as **Fixed**.
  You move to **Immutability** because without it, they interpret the number as **Fatalistic**.
  You end with **Treatment Response** because that is the only place where they see **Utility**.

