answer: |-
  Here are ten interview questions designed to press M.'s thesis, anticipate her defensive reclassifications, and force her into corners where she must either accept counter-intuitive conclusions or abandon the sharp distinctions she relies on.

  ### 1. The Speech Act Misfire
  **Question:** "Your friend argues that blame is a form of moral address, like a promise or a command, which structurally misfires if the speaker exempts themselves from the norm—much like a command misfires if the commander says, 'I won't obey this either.' If blame is a speech act that changes the normative landscape between two people, why isn't hypocrisy a *constitutive* defect in the act itself, rather than just evidence of a defect in the speaker?"

  *   **Anticipated Reply:** "That conflates the *act* with the *agent*. The norm still binds the target. The hypocrite's insincerity is an epistemic defeater—it makes us doubt they believe the norm—not a structural bar to invoking it."
  *   **Follow-up/Trap:** "But if I make a promise I intend to break, we say I haven't promised, not that I'm an insincere promiser. If the 'authority' to blame doesn't require the blamer to be subject to the norm in the same way as the target, aren't you reducing blame to a mere *command*? And if it's just a command, where is the 'moral address' you claim to be defending?"

  ### 2. The 'You're One to Talk' Practice
  **Question:** "In ordinary conversation, when someone retorts 'you're one to talk,' the conversation usually stops. The target doesn't say, 'You're right, but you're being ugly,' they act as if the blamer has lost the *right* to speak. If standing were just about the authority to invoke a norm, and hypocrisy were just a vice, why does our practice treat this rebuttal as a *shutdown* move rather than a critique of the blamer's character?"

  *   **Anticipated Reply:** "Because social etiquette treats unfairness as a conversation-stopper. But etiquette isn't morality. You *can* blame, you just *shouldn't* because it's rude."
  *   **Follow-up/Trap:** "If it's just etiquette, then the hypocrite's blame is still *valid*, just impolite. But when we say 'you're one to talk,' we imply the blame is *void*, not just rude. Are you really willing to say that the universal human intuition that hypocrisy voids authority is just a confusion about manners?"

  ### 3. The Epistemic Defeater and Avowed Self-Blame
  **Question:** "You argue that past violations are evidence of insincerity. But consider the 'Avowed Hypocrite': someone who says, 'I do this constantly, it's terrible, and I'm reproaching myself for it, but you must not do it.' They have neutralized the epistemic defeater by admitting the vice. On your view, does this person now have *perfect* standing?"

  *   **Anticipated Reply:** "Yes. If they sincerely accept the norm and acknowledge their failure, they have the authority to invoke the norm against others."
  *   **Follow-up/Trap:** "So if I say, 'I am a thief, I hate myself for it, but you must not steal,' I have the same standing as a honest person? If the target feels no obligation to listen to me, is that just their error, or does it suggest that authority requires more than just sincere avowal?"

  ### 4. The Smoking Mother (Application)
  **Question:** "Let's apply that to the smoking mother telling her daughter not to vape. If she says, 'I smoked for thirty years, it ruined my health, don't do it,' she is sincere. She is not an unreliable detector of harm. By your lights, does her history of violation do *nothing* to her authority to blame, provided she is honest about it?"

  *   **Anticipated Reply:** "It makes her blaming tragic, perhaps painful to hear, but it doesn't remove her authority. The norm against vaping still binds the daughter."
  *   **Follow-up/Trap:** "But if the daughter says, 'You don't get to tell me what to do with my body when you destroyed yours,' and we feel she is *right*, what is she denying? If she's not denying the mother's authority, what is the 'you don't get to' cashing out to? Is it just 'I don't want to hear it'?"

  ### 5. The Institutional Case
  **Question:** "You rely heavily on psychological states like sincerity. But consider the university condemning fossil fuels while holding fossil assets. Institutions don't have minds; they can't be 'sincere' or 'insincere' in the introspective sense. Yet we say the university lacks standing to blame the lobby. How does your theory handle hypocrisy where there is no psychology to defect?"

  *   **Anticipated Reply:** "Institutions have proxies for sincerity: their policies, their public commitments. The endowment contradicts the policy, which is an institutional form of insincerity."
  *   **Follow-up/Trap:** "If the contradiction between endowment and speech is what matters, isn't that a *structural* lack of authority, not an epistemic clue about a mind? If the structure contradicts the speech, the speech is void. Why isn't individual hypocrisy the same: a structural contradiction between life and speech that voids the blame?"

  ### 6. Prospective Hypocrisy
  **Question:** "Consider the person who blames you today for a vice they fully intend to commit tomorrow, explicitly to bind themselves. There is no past violation to serve as evidence of insincerity. They sincerely want the norm to hold. Yet, blaming you to save themselves feels like a misuse of you. Is this just unfairness, or do they lack standing *in the moment*?"

  *   **Anticipated Reply:** "It's a clear case of unfairness. They are using you as a means to their own moral improvement. But they still have the authority to invoke the norm."
  *   **Follow-up/Trap:** "If they have the authority, then you have a duty to listen. But intuitively, you have the right to say, 'Don't use me for your project.' If you have the right to reject the blame entirely, isn't that what 'lacking standing' just means?"

  ### 7. Asymmetric Exposure
  **Question:** "You focus on compliance: did the blamer violate the norm? But what about *difficulty*? If I comply with a norm only because I have no temptation to break it, and you break it under immense pressure, do I have standing to blame you? Or does standing track whether I demand more of you than I demand of myself *under comparable pressure*?"

  *   **Anticipated Reply:** "Standing tracks compliance. If I complied and you didn't, the norm binds you. Your difficulty is relevant to excuse, not to my standing."
  *   **Follow-up/Trap:** "So the psychopath who feels no temptation to kill has *more* standing to blame the struggling saint than the saint has to blame the psychopath? If your theory implies that moral immunity grants superior authority to blame, isn't that a reductio of the compliance-only view?"

  ### 8. The Cost of the Distinction (Standing vs. Ought)
  **Question:** "You draw a sharp line between having standing and whether one all-things-considered *should* blame. But if every hypocrite retains standing but should never exercise it because it's unfair or ugly, what theoretical work is 'standing' doing? Is it not just an idle wheel if the practical output is always 'do not blame'?"

  *   **Anticipated Reply:** "It explains why the norm remains in force. We can acknowledge the hypocrite is right about the norm, even if we reject their delivery."
  *   **Follow-up/Trap:** "But if we reject their delivery in every case of hypocrisy, aren't we acknowledging that the *person* is essential to the blame? If the person is essential, and the person is compromised, how is the authority not compromised? Are you preserving 'standing' just to save the norm, at the cost of making the blamer irrelevant?"

  ### 9. The Source of Authority
  **Question:** "If standing is just the authority to invoke a norm that binds the target, where does that authority come from? Is it granted by the norm itself, or by the relationship between the blamer and the target?"

  *   **Anticipated Reply:** "It comes from the norm. The norm binds us all, so we all have the authority to invoke it."
  *   **Follow-up/Trap:** "If the norm grants the authority directly, then the blamer is just a megaphone. But blame is personal; it's addressed *from* someone *to* someone. If the blamer is just a megaphone, why does it matter who speaks? And if it does matter who speaks, doesn't their relationship to the norm matter?"

  ### 10. Falsifiability
  **Question:** "To close: philosophy requires that a thesis be falsifiable. What feature of our actual blaming practice—what specific reaction, intuition, or pattern of judgment—would you have to concede you cannot explain if you encountered it? Is there any case where you would admit, 'Yes, here the hypocrite truly lacks standing'?"

  *   **Anticipated Reply:** (Open)
  *   **Follow-up/Trap:** (Listen closely. If she says "No," press: "Then your theory is immune to practice, which makes it a definition, not an explanation." If she names a case, press: "Then why isn't *that* case the rule, rather than the exception?")
