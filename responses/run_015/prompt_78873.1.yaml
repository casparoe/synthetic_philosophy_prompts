answer: |-
  The rain in Ostral did not fall so much as it hovered, a grey mist that clung to the wool coats of the pedestrians and darkened the limestone of the Ministry buildings. Elias Thorne wiped his spectacles with a handkerchief that smelled of stale tobacco and ink, then looked at the clock on the wall of the Registry. It was ten minutes to noon.

  The Register of the Constitution lay open on his desk. It was a massive thing, bound in leather that had cracked with age, its pages thick enough to resist the bleed of the iron-gall ink he used. Elias was the Registrar, a title that sounded grander than the work felt. He was a clerk with a key, a man whose signature turned bills into laws and laws into history.

  On the desk beside the Register lay the Continuity Act. It had passed the Assembly yesterday afternoon. The vote count was stamped on the cover: 51 percent in favor. It contained two operative clauses. The first amended Article I to permit the entrenchment of specific social provisions. The second entrenched the Veterans' Pension Fund against any future reduction.

  Under normal circumstances, Elias would have enrolled it by now. The Clerk of the Assembly had delivered it an hour ago, certified as correct. But the normal circumstances of the Republic of Meridia had been fraying for sixty years, and yesterday the thread had snapped.

  A knock at the door interrupted his thought. Before he could answer, Corinne Valt pushed her way in. She was a lawyer for the Veterans' Coalition, sharp-eyed and wearing a suit that had seen better decades. Behind her hovered Joris, a junior clerk from the Attorney General's office, looking pale and holding a briefcase like a shield.

  "You haven't signed it, Elias," Corinne said. It wasn't a question.

  "It is noon yet," Elias said. "The Act arrives before noon, it is enrolled that day. That is the custom."

  "Custom," Joris muttered. He stepped into the room, shaking the rain from his umbrella. "The Attorney General advises that enrolment be withheld pending judicial review. The vote was a bare majority, Elias. Fifty-one percent. Article II requires two-thirds."

  "Article II requires two-thirds unless Article II has been amended," Corinne countered. She pulled a chair out and sat without invitation. "And it was amended. Forty years ago. The Threshold Act. Lowered the requirement to simple majority for social legislation."

  "The Threshold Act was passed by a simple majority," Joris said, his voice trembling slightly. "If the Clarion Act is void, the Threshold Act is void. If the Threshold Act is void, the requirement reverts to two-thirds. If the requirement is two-thirds, the Continuity Act is void."

  Elias looked at the open ledger. The line for today's date was blank. "We are back to the Clarion Act."

  Sixty years ago, the Assembly had passed the Clarion Act. It was short. It resolved an ambiguity in Article II regarding whether the "procedure in force" meant the procedure before an amendment or the procedure the amendment itself created. The Clarion Act said it meant the procedure *before* the vote. It seemed harmless. A rule of timing. But the Clarion Act itself had been an amendment. To be valid, it had to follow the procedure in force *before* the vote. But the rule it created was the only thing that made the procedure clear.

  "It's the bootstrap," Joris said. He was reciting now, likely from a memo prepared by a senior partner. "The Clarion Act defines the rule that validates the Clarion Act. It pulls itself up by its own laces. Logic says that's impossible. A rule cannot create the authority it needs to exist."

  "Logic says a lot of things," Corinne said. She leaned forward, her hands clasped on the leather of the desk. "Sixty years of legislation rest on the Clarion Act. Thousands of contracts. Property titles. The very existence of the Assembly's current structure. If you void the Clarion Act, you void the Threshold Act. If you void the Threshold Act, you void the Continuity Act. But you don't stop there. You void every amendment passed since the Clarion Act. You void the tax code. You void the boundary changes. You void the Republic's authority to collect revenue."

  "That is a pragmatic argument, not a legal one," Joris said.

  "It is the only argument that matters when the alternative is anarchy," Corinne snapped. She turned to Elias. "You know what this means for Marta Kael."

  Elias flinched. He knew Marta. She waited in the anteroom, wrapped in a shawl that smelled of damp wool and camphor. Her husband had died in the Border Skirmishes thirty years ago. Her pension was tied to the Fund. The Continuity Act didn't just protect the Fund; it authorized the arrears payment she needed to keep her house. If the Act was not enrolled today, the payment window closed. If the Act was enrolled and later declared void, she would have to return the money she hadn't yet received, and the debt would ruin her.

  "Marta understands the risk," Elias said quietly.

  "She understands that you hold the pen," Corinne said. "She doesn't understand Article II. She doesn't care about the Clarion Act. She cares about whether she eats next month."

  Joris shifted his weight. "If you enrol it, you certify that the procedure was valid. You are not just a notary, Elias. The Register is constitutive. Article III says an amendment takes effect upon enrolment. Your entry fixes the reality. If you write it down, the courts will treat it as law until they strike it down. If you refuse, it dies here."

  "And if I refuse, and the Clarion Act is valid?" Elias asked. "Then I have just invalidated a lawful amendment. I have usurped the Assembly."

  "If you sign, and the Clarion Act is void, you have enrolled a nullity. You have tainted the Register." Joris opened his briefcase and pulled out a sheet of paper. "The Attorney General suggests an entry under protest. Note the discrepancy in the vote count. Note the reliance on the Clarion Act."

  "You can't do that," Corinne said. "The Register records facts. It does not record doubts. If you annotate it, you invite every court in the country to interpret your annotation. You turn the Registry into a tribunal."

  Elias looked at the pen. It was a heavy thing, balanced for weight rather than comfort. He had enrolled the Emergency Powers Act during the Flood Crisis. He had enrolled the Trade Integration Treaty. He had never hesitated. The procedure was either followed or it wasn't. The Assembly certified the procedure. His job was to transcribe.

  But the Clarion Act was different. It was the foundation stone that claimed to lay itself.

  "The bootstrap argument," Elias said, looking at Joris. "It assumes that a rule cannot apply to itself."

  "It's a logical priority," Joris said. "The rule must exist before it can be applied. The Clarion Act didn't exist until it was passed. So it couldn't govern its own passage."

  "Unless," Corinne said, "the authority to amend comes from the Constitution itself, not from the previous amendment. Article II says 'Any provision... may be amended by the procedure set out in Article II.' It doesn't say 'by the procedure set out in Article II as it existed yesterday.' It says Article II. Article II is a living thing. It changes. When you change it, you are using the power Article II gives you. The power includes the power to define how the power is used."

  "That is circular," Joris insisted. "It allows any majority to validate its own act. If fifty-one percent can decide that fifty-one percent is enough, then the Constitution means nothing. It becomes whatever the Assembly says it is at any given moment."

  "And if the Constitution means nothing because sixty years of it was a hallucination?" Corinne's voice rose. "Then what are we? We are not a legal order. We are a gang with a flag. If you tell the people of Meridia that their land titles are void because of a semantic trick in a law their grandfathers passed, they will not care about your logic. They will care about their homes."

  Elias stood up and walked to the window. The rain had thickened. Below, in the square, people hurried under umbrellas. A tram clattered over the cobblestones, sparks flying from the rail. Life continued, indifferent to the paradox in the room.

  He thought of the first time he had seen the Register. He was twenty. The old Registrar, a man named Havel, had shown him the page where the Clarion Act was enrolled. Havel had run a finger over the ink. "This is the hinge," Havel had said. "Everything swings on this."

  Havel had signed it. He had died ten years ago.

  Elias turned back to the room. "Marta is out there."

  "Yes," Corinne said.

  "If I sign, and the courts strike it down in a year, she loses the house then."

  "If you don't sign, she loses it now," Corinne said. "And everyone else loses nothing. The status quo holds. The Fund remains unprotected. The threshold remains ambiguous."

  "The threshold doesn't remain ambiguous," Joris said. "If you refuse enrolment, you force the question. The Supreme Court will have to rule on the Clarion Act. It might uphold it. It might not. But at least it will be a decision of law, not an administrative fiat."

  "An administrative fiat," Elias repeated. "Is that what you call my duty?"

  "I call it restraint," Joris said. "You are not a judge. You are a custodian. If the document is facially irregular, you should not record it as valid."

  "Is it facially irregular?" Elias asked. "It bears the seal of the Assembly. It bears the signature of the Speaker. It states the vote count. The vote count is fifty-one percent. Is that irregular?"

  "Under Article II, yes," Joris said.

  "Under Article II as amended by the Threshold Act, no," Corinne said.

  "Which Article II is in force?" Elias asked. "That is the question."

  "That is the question the Clarion Act answers," Corinne said. "It says the procedure before the vote counts. Before the Continuity Act vote, the Threshold Act was in force. The Threshold Act said fifty-one percent. Therefore, the Continuity Act is valid. Unless the Threshold Act is void. Which depends on the Clarion Act. Which depends on whether a rule can validate itself."

  Joris rubbed his temples. "It is a vicious circle. You cannot derive validity from validity. There must be a ground outside the system."

  "The ground is the people," Corinne said. "They treat the Clarion Act as law. They treat the Threshold Act as law. They treat the Assembly as legitimate. A constitution is not a math problem. It is a promise. If you break the promise because the math is ugly, you break the country."

  "And if you keep the promise by lying about the math?" Joris shot back. "Then you teach them that law is a sham. That power is the only truth. Is that the lesson you want the Registry to teach?"

  Elias sat down. The clock ticked. Noon approached.

  He picked up the pen. The nib was fresh, sharp enough to catch on the fiber of the paper. He looked at the blank line. *Date. Hour. Title. Status.*

  If he wrote *Validly Adopted*, he took a side. He affirmed the bootstrap. He told Marta she could keep her home, and he told Joris that logic was subordinate to stability.

  If he wrote *Enrolled Under Protest*, he invited the chaos Corinne feared. He turned the Registry into a battleground. Every copy of the Constitution would have a footnote. Every judge would have an opinion.

  If he refused to write, he stalled. But Article III said effect upon enrolment. No enrolment, no effect. Marta loses.

  He thought of the Republic. It was small. Poor. It had survived the War of the Peaks, the Flood, the Trade Embargoes. It had survived because people believed the paper in the Register mattered more than the guns in the barracks. If the paper was revealed to be a trick, would the guns stay quiet?

  "Elias," Corinne said softly. "The rain is getting worse. She has no umbrella."

  He looked at the door. He could see the shadow of her shawl through the frosted glass. She was standing still. She had been standing there for an hour.

  "Joris," Elias said. "If I enrol this, and the Court voids it later, is the enrolment itself a crime?"

  "No," Joris said. "It is a discretionary act. You are protected by official immunity. But the record will show you ignored a clear defect."

  "And if I don't enrol it?"

  "Then you are sued for dereliction of duty," Corinne said. "The Assembly will compel you. They have the votes."

  "They have the votes because of the Threshold Act," Joris said. "Which is void if the Clarion Act is void."

  "Enough," Elias said.

  The room went silent. The only sound was the rain against the glass and the hum of the radiator.

  He looked at the two of them. Corinne, fighting for the woman in the hall. Joris, fighting for the integrity of the text. Both were right. Both were wrong. The law was a machine that had to run, but the gears were made of words, and words could slip.

  The Clarion Act had been enrolled sixty years ago. Havel had signed it. Havel had known. They all had known. The ambiguity was there in the text. They had chosen to ignore it because the alternative was to start over. To start over meant blood.

  Elias dipped the pen. The ink welled up, black and glossy.

  "There is no ground outside the system," Elias said. He spoke to the desk, to the book. "We are inside the circle. We cannot jump out."

  "We can acknowledge the circle," Joris said.

  "No," Elias said. "To acknowledge it is to break it."

  He lowered the pen to the paper. The tip touched the surface. The fiber absorbed the ink instantly.

  He wrote the date. *14th of Rainfall, Year 75.*
  He wrote the hour. *12:00.*
  He wrote the title. *Continuity Act.*

  He paused at the status column. The standard entry was *Adopted in Conformity.*

  Corinne held her breath. Joris closed his eyes.

  Elias thought of Marta's hands, worn from work, resting on the cane she didn't need but carried for dignity. He thought of the young clerks who would come after him, reading this entry. Would they see a lie? Or would they see the moment the Republic chose to continue?

  He moved the pen. He did not write *Adopted in Conformity.* He did not write *Under Protest.*

  He wrote *Enrolled.*

  Just *Enrolled.*

  It was a factual statement. The document was in the book. It did not certify the validity of the process, only the fact of the record. It kicked the question to the courts, where it belonged, but it gave Marta the document she needed to claim her arrears today. It left the door open for the Supreme Court to strike it down tomorrow, but it kept the roof over her head tonight.

  "Is that enough?" Corinne asked, her voice tight.

  "It is what the Register allows," Elias said. He blew on the ink to dry it. "I do not judge the law. I record it."

  "You recorded a ambiguity," Joris said. "Now every clerk in the country has to decide what 'Enrolled' means."

  "Let them decide," Elias said. He closed the ledger. The sound was heavy, final. "That is their job. Not mine."

  He stood up and walked to the door. He opened it. Marta was there, just as he expected. She looked up at him, her eyes clouded with cataracts and worry.

  "It is done, Marta," he said.

  She didn't ask about the votes. She didn't ask about the Articles. She nodded, once, and touched the brim of her hat. "Thank you, Registrar."

  She turned and walked down the hall, her steps lighter than they had been when she arrived.

  Elias closed the door and returned to the desk. Joris was packing his briefcase. Corinne was staring at the closed book.

  "You left it open," Joris said. "The question."

  "The question is always open," Elias said. He wiped the pen and placed it back in the stand. "We just have to live inside it."

  He picked up the next file. It was a request for a name change. Simple. Unambiguous. He opened it, dipped the pen, and began to write. Outside, the rain continued to fall, washing the streets clean, one layer at a time.
