prompt: |-
  I've been mulling over this inside view vs outside view stuff for a while (planning fallacy, base rates, all that) and I keep getting stuck on what I think is called the reference class problem. Can you write a dialogue between a startup founder and a friend who keeps bringing up base rates, where they're trying to settle what probablity to assign to the startup suceeding? The founder argues from the inside view — the specific things that are different about their case — and the friend pushes the outside view — the base rate for companies like theirs. I want them to actually grapple with each other's strongest version, not take turns giving speeches: the founder should press the point that being different is exactly why the base rate doesn't apply, and the friend should press back that every founder thinks that, and that "founders who think they're different" is itself a reference class with its own base rate. And I want them to land somewhere at the end — is one of them just wrong, or is the right move some kind of blend, and if it's a blend, how do you decide the weights? Neither of them should be a strawman.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** Inside View vs. Outside View (Planning Fallacy, Base Rates, Reference Class Problem).
      *   **Characters:** Startup Founder (Inside View advocate) vs. Friend (Outside View advocate).
      *   **Conflict:** Determining the probability of the startup's success.
      *   **Key Requirement 1:** Strongest versions of arguments (no strawmen). Founder must argue *why* they are exceptional; Friend must argue *why* that claim is statistically predictable.
      *   **Key Requirement 2:** The "Reference Class Problem" must be central (i.e., how do you choose the right group to compare against?).
      *   **Key Requirement 3:** Resolution. They can't just agree to disagree. They need to land on a synthesis or a method for weighting the views.
      *   **Tone:** Intellectual, respectful, grappling, realistic.

  2.  **Character Conception:**
      *   **Founder (Alex):** Passionate, detail-oriented, believes in the unique value prop, feels the statistics ignore the nuance of *their* execution.
      *   **Friend (Jordan):** Analytical, skeptical but supportive, understands the psychology of overconfidence, insists on structural reality.
      *   **Setting:** A casual setting to lower defenses, maybe a coffee shop or a late-night kitchen table. Let's go with a kitchen table, late night. It implies intimacy and seriousness.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. Alex is raising money or setting expectations. Jordan brings up the stats.
      *   **The Inside View (Alex):** Alex lists specific advantages (team, tech, timing). The argument: "We aren't average."
      *   **The Outside View (Jordan):** Jordan brings up the base rate (e.g., 1 in 10 succeed). The argument: "Everyone says they aren't average."
      *   **The Reference Class Problem (The Core Conflict):**
          *   Alex: "Don't compare us to *all* startups. Compare us to *this specific kind*."
          *   Jordan: "If you narrow the class enough, the sample size disappears. Also, 'founders who think they are special' is a class with a bad track record."
      *   **The Turn/Deepening:** Alex admits the bias exists but argues it's necessary for action. Jordan admits the base rate is blunt but necessary for calibration.
      *   **The Resolution/Synthesis:** How to combine them?
          *   Idea: Start with the outside view as the prior, then adjust based on specific evidence (Bayesian update).
          *   Idea: Use the outside view for resource planning (cash runway) and inside view for motivation/execution.
          *   Decision: The Bayesian approach feels most intellectually honest for this prompt. Start with base rate, adjust up or down based on *verifiable* inside factors, not just feelings.

  4.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Critique:* Is Jordan sounding too cynical?
      *   *Fix:* Make sure Jordan validates Alex's hard work. The point isn't that Alex will fail, but that probability needs to be honest.
      *   *Critique:* Is Alex sounding too delusional?
      *   *Fix:* Give Alex concrete differentiators (e.g., a specific partnership or tech breakthrough) so the "inside view" isn't just wishful thinking.
      *   *Critique:* Is the ending satisfying?
      *   *Fix:* Avoid a perfect "aha!" moment. Make it a practical agreement on *how* to use the numbers, rather than agreeing on a single number.

  5.  **Focusing on the Reference Class Problem:**
      *   This is the trickiest part. I need to make sure they explicitly discuss *which* group they are comparing Alex to.
      *   Alex wants the class to be: "Y Combinated, B2B SaaS, ex-FAANG founders."
      *   Jordan points out: "Even within that, most fail."
      *   Jordan's killer point: "The class of 'people who think their case is unique' has a base rate."

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Alex pacing, Jordan drinking coffee.
      *   *Middle:* The back-and-forth on the "10% chance."
      *   *Climax:* The meta-reference class argument.
      *   *End:* The Bayesian compromise.

  7.  **Final Polish:** Check the rhythm. Ensure they interrupt each other naturally. Make sure the intellectual concepts are explained through conversation, not lecture. (e.g., instead of defining "Reference Class Problem," show them fighting over which class to use).

  **(Self-Correction Note):** I need to make sure I don't solve it *too* easily. The reference class problem is famously difficult in philosophy (Nelson Goodman). I should acknowledge that the "right" class is subjective, but the *process* of choosing it matters.

  8.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Founder vs. Friend? Yes.
      *   Inside vs. Outside? Yes.
      *   Reference Class Problem highlighted? Yes.
      *   No strawmen? Yes.
      *   Resolution reached? Yes.

