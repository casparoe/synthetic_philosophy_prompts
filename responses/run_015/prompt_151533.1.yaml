      **Project Title:** Ephemeral Agency: Conceptualizing Statelessness in Large Language Models

      **The Core Question**
      Large Language Models (LLMs) present a category error for current philosophy of tech. They possess no continuous self across sessions, no body, and no goals that persist past a context-window reset. Yet, inside a single long interaction, they display adpative, strategic behavior that exceeds static pattern matching. This project asks: Are 'agency' and 'simulation' sufficient categories for entities that are globally stateless but locally coherent? Or do we need a new conceptual framework for transient intentionality?

      **Why Existing Frameworks Fail**
      Current debates stall between two poles. Dennett-style interpretivism suggests that if treating the system as an agent yields predictive power, it is an agent. However, this assumes a stability over time that LLMs lack; the 'agent' dies when the session closes. Conversely, Bender-style anti-agency arguments rightly note the lack of grounding and embodiment, but they often dismiss the functional reality of the model's strategic planning within the context window. Both views miss the temporal slice. They treat agency as a binary property of the *system*, rather than a transient property of the *interaction*. We need an account that handles agency that flashes into existence and vanishes without becoming incoherent.

      **Proposed Approach**
      I propose a conceptual engineering approach rather than empirical benchmarking. Benchmarking (e.g., AGI tests) tells us what models can do, not what they *are*. Instead, I will analyze the conceptual requirements of 'agency' and 'simulation' to see where they break under conditions of forced statelessness. This beats alternative empirical approaches because the problem is not capability—it's categorization. No amount of performance data resolves whether a stateless strategist is an agent or a puppet. We must refine the defintion of agency to accommodate temporal discontinuity.

      **Deliverables and Success Conditions**
      The primary output will be a revised taxonomy of stance-types, specifically distinguishing between 'persistent agency,' 'simulated agency,' and 'ephemeral agency.' A successful project produces a framework that allows researchers to discuss LLM behavior without collapsing into anthropomorphism or dismissal. Failure would look like falling back on the original binary (agent vs. simulator) or producing a framework so niche it cannot be applied to other transient AI architectures.

      **Scope and Timeline (4 Months)**
      *   **Month 1:** Literature mapping. Focus on philosophy of action and recent AI ontology papers. Identify gaps in thier application to stateless systems.
      *   **Month 2:** Conceptual analysis. Drafting the criteria for 'ephemeral agency' using case studies of long-context strategic planning.
      *   **Month 3:** Taxonomy construction. Developing the stance-type framework and stress-testing it against edge cases (e.g., RAG systems, multi-session tools).
      *   **Month 4:** Writing and refinement. Finalizing the working paper for workshop distribution.

      This scope is realistic for a single researcher focusing on conceptual work. It avoids the trap of trying to solve alignment or safety directly, sticking instead to the ontological groundwork required to discuss them clearly.

