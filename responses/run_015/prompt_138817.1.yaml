prompt: |-
  Hey — I'm a PhD student in philosophy (I mostly work on causation and interventionist stuff, with a side habit of reading about the arrow of time that my supervisor thinks is a distraction) and this spring I'm TA-ing a first-year seminar called Time, Physics and Fiction. We just did Memento, and this week it's Tenet, and I really don't want the session to turn into 90 minutes of "lol the physics is fake" followed by everyone going home still thinking entropy is some kind of force. So: please act as a philosopher of physics who also writes serious film criticism, and before you give me the reading, spend a paragraph or two brainstorming — lay out the distinctions you plan to use, and flag which ones are standard kit and which ones you're improvising on the spot for this film.

  Here's where I'm stuck, and it's more specific than "is the movie accurate." The script's word "inversion" seems to me to be at least three different theses run together, and I want to know which one the film is actually committed to. I've started using a distinction of my own and I'd like you to work with it (and tell me if its junk): *weak inversion* = only the psychological and causal arrows are flipped for the subject, while their internal entropy still increases along our forward direction, so physically they're unremarkable and its just that their experience and agency run the other way; *strong inversion* = the subject's entropy gradient is anti-aligned with the worlds, so their entropy falls as ours rises, heat exchange goes weird, and their "memories" are really anti-records — correlations with what we call the future. Which one does Tenet need for its big set pieces to work, and which one does it seem to have in, say, the opera siege with the inverted bullet, the freeway chase with the flipped car and the reverse-driving, and the turnstile/sauna scene where the characters are told they have to breathe inverted air and deal with inverted heat? I've also been applying what I call the *seam test*: at every point where an inverted system touches a non-inverted one, does the joint system still obey the second law in the environments forward direction, or does the film quietly let the whole worlds entropy bookkeeping go? Run the seam test on those same scenes and tell me what you find.

  Three more things I want, and then the teaching bit. First: the underlying-dynamics-versus-boundary-condition point — the reason we think the arrow needs a low-entropy past rather than asymmetric laws at all — seems to me to cut *in favour* of the film in one way and against it in another, and I can't get straight which. Does a movie full of objects whose entropy runs backwards actually need to violate the time-symmetric dynamics, or is it "just" handing itself absurdly fine-tuned correlations of the kind the Boltzmann-fluctuation literature says we never see? Relatedly: Neil — the character who turns out to have known the protagonist for years from his own point of view and walks knowingly into a death we've already seen — is the one place I think the film does something the philosophy papers don't, so I want you to take him seriously rather than as a plot device. What does his case tell us about whether memory and agency are just functions of the entropy gradient, and can his choices be choices at all given that the film also insists that what's happened has happened? My worry is that "ignorance is our ammunition" is smuggling in a deliberative agent on top of a fixed block where there's no room for one. Second: which two clips, about eight minutes each, should I actually screen? I've got the room for maybe fifteen minutes of film and the rest has to be discussion, so give me the two scenes, the one question I should put to the room *before* I name any of these distinctions, and how the debrief maps what they say onto the thermodynamic / causal / psychological arrows. Third, and honestly most useful: what will predictably go wrong when I run this, and where is the film straightforwardly teaching a confusion that I'd have to undo afterwards — versus the thing it shows you that the standard entropy-gradient-and-Past-Hypothesis discussion doesn't, because I'd rather not just use Nolan as a punching bag. Don't bother with citations or reading lists, I can find those myself, and please don't quote any dialogue from memory — paraphrase the scenes instead of inventing lines, since I'll be writing the handout straight from what you give me.
