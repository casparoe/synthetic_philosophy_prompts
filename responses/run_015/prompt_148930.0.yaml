          3.  Separate undermining disanalogies from decorative ones.
          4.  Evaluate if the analogy survives as a heuristic or collapses into metaphor.
          5.  Propose a tighter analogy if one exists.
          6.  **Constraint:** Conclude with a single line beginning "Verdict:".

  2.  **Initial Knowledge Retrieval & Analysis:**
      *   *Hofstadter's Typogenetics:* In *GEB*, Hofstadter creates a toy system called "typogenetics" to illustrate how symbols can manipulate themselves. It's a pedagogical device, not a rigorous biological theory.
      *   *The Popular Analogy:* DNA $\approx$ Gödel Sentence. Cell $\approx$ Formal System. Replication $\approx$ Self-reference.
      *   *The Irreducibility Claim:* Because of the self-reference, you can't explain life *just* by chemistry (similar to how truth isn't just provability).
      *   *Critical Biological Facts:* DNA doesn't encode the *entire* interpreter. Ribosomes, polymerases, tRNAs, amino acids, energy gradients (ATP), and membrane structures are largely *not* encoded in the DNA sequence itself (they are inherited cytoplasmically or structurally). This is the "Chicken and Egg" problem solved by autopoiesis theory, not Gödelian logic.
      *   *Gödel's Theorem:* Relies on arithmetic, consistency, and provability within a closed formal system. Biology is open, thermodynamic, and error-prone.

  3.  **Drafting the Audit (Task 1):**
      *   *Formal System:* The biochemical machinery of the cell (transcription/translation apparatus).
      *   *Gödel Numbering:* The Genetic Code (codon-to-amino-acid mapping).
