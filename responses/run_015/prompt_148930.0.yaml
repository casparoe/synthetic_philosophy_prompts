      *   *Proof Predicate:* The process of phenotypic expression (does this genotype yield a viable phenotype?).

  4.  **Identifying Breaks in Mapping (Task 2):**
      *   *Interpreter Encoding:* DNA does *not* encode the full interpreter. Ribosomes contain rRNA (encoded) but also proteins (encoded), yet the *assembly* requires existing ribosomes. More critically, the amino acids, ATP, and lipid membranes are not encoded; they are environmental/structural inheritances. This breaks the "closed system" requirement of Gödel.
