  # JOINT STATEMENT ON THE MORAL STATUS OF COMPATRIOTS

  **Issued by:** A Political Associative Nationalist and an Institutional Cosmopolitan
  **Subject:** Findings following adversarial collaboration on special moral claims among compatriots

  ## I. AGREED CLAIMS

  Following a series of structured dialogues, the undersigned parties affirm the following points of consensus regarding the moral landscape of citizenship and global obligation:

  1.  **Distinction of Moral Reasons:** We agree that a coherent moral theory must distinguish between agent-neutral reasons (reasons applicable to any moral actor regardless of identity) and agent-relative reasons (reasons that apply specifically to an actor in virtue of their particular relationships or roles). The debate between us concerns whether citizenship generates the latter.
  2.  **Variation in State Capacity:** We acknowledge the empirical fact that modern states vary widely in their capacity to protect, represent, and provide for their residents. Consequently, the practical impact of any moral obligation attributed to citizenship depends heavily on the institutional strength of the specific state in question.
  3.  **Rejection of Ethnic Nationalism:** We jointly reject the proposition that ethnicity, race, shared culture, or location of birth as such ground any special moral claims. Any special obligations arising from citizenship must be justified through political or institutional features, not pre-political identities.
  4.  **Existence of Special Obligations:** We agree that uncontroversial special obligations exist in other domains of human life, such as duties to family, friends, or explicit promisees. The dispute is not about the existence of special obligations generally, but whether political citizenship belongs in this category.
  5.  **Functional Similarity of Networks:** We observe that digital and economic globalization has made certain transnational cooperative networks functionally similar in some respects to domestic political communities, particularly regarding the capacity for coordinated action and mutual aid across borders.
  6.  **Normative vs. Practical Debate:** We agree that the core debate concerns the normative status of citizenship itself, not merely the practical difficulty of global redistribution. Even if global redistribution were administratively feasible, we would still disagree on whether citizens are morally permitted or required to prioritize one another.

  ## II. AREAS OF DISAGREEMENT

  While we share the foundational claims above, we remain divided on the normative implications of political association. The following table summarizes our divergent positions using wording each party accepts as accurate to their view.

  | Question | Political Associative Nationalist Position | Institutional Cosmopolitan Position |
  | :--- | :--- | :--- |
  | **Is citizenship a source of associative duty comparable to friendship or promise?** | **Yes.** Shared democratic citizenship constitutes a cooperative practice that generates intrinsic obligations of solidarity and priority, irreducible to universal duties. | **No.** Citizenship per se does not create agent-relative reasons. Special obligations arise only from direct causal relationships, explicit commitments, or specific institutional roles. |
  | **Does the moral arbitrariness of birth location undermine citizenship-based priority?** | **No.** While birth is arbitrary, associative obligations are constructed through shared institutions and ongoing participation, not merely by accident of origin. | **Yes.** Birth location is morally arbitrary and undermines priority unless the institution in question is voluntarily joined or explicitly committed to. |
  | **May state agents legitimately give stronger weight to citizens' interests in policy decisions?** | **Yes.** This is a necessary expression of democratic accountability and the specific associative bond between the state and its members. | **Only Instrumentally.** State agents may prioritize citizens only to maintain legitimate institutions that ultimately serve everyone, or due to remedial responsibilities toward those they govern. |

  ## III. CRUXES AND EMPIRICAL/NORMATIVE TESTS

  We have identified three sub-questions (cruxes) where resolving the underlying uncertainty might move at least one party toward the other's position. For each crux, we specify a concrete case or argument bearing on the issue and record our respective predictions regarding the moral intuition or outcome that case should produce.

  ### Crux 1: Functional Equivalence and Associative Bonds
  **Question:** Does the functional equivalence between domestic and transnational cooperative networks undermine the nationalist's claim that citizenship creates a unique associative bond?

  *   **Test Case (B): Digital Coordination Emergency.**
      *   *Scenario:* Citizens of State A can, through low-cost digital coordination, provide direct emergency aid to non-citizens in State B faster and more effectively than their own government can provide aid to its own citizens.
  *   **Predictions:**
      *   *Nationalist Prediction:* Even if transnational aid is more efficient, citizens retain a special duty to prioritize their own domestic institutional channels. The associative bond is defined by the political relationship, not merely the efficiency of aid delivery. Prioritizing the foreign recipients would undermine the domestic cooperative scheme.
      *   *Cosmopolitan Prediction:* If the transnational network functions effectively as a cooperative scheme, the moral distinction between compatriot and non-compatriot dissolves in this context. Agents should follow the path of effective aid, suggesting citizenship holds no intrinsic priority when functional equivalence is established.

  ### Crux 2: State Officials and Special Obligations
  **Question:** Can the cosmopolitan consistently allow state officials stronger obligations to citizens without implicitly granting citizenship special moral status?

  *   **Test Case (A): Climate Budget Allocation.**
      *   *Scenario:* A democratic state must decide whether to allocate a fixed budget to domestic climate-adaptation infrastructure or to contribute the equivalent sum to an international climate-loss-and-damage mechanism. Both options save comparable numbers of lives.
  *   **Predictions:**
      *   *Nationalist Prediction:* The state is morally required to prioritize domestic infrastructure. This is not merely instrumental but reflects the specific mandate of the democratic association to protect its own members. To do otherwise would be a betrayal of the associative obligation.
      *   *Cosmopolitan Prediction:* State officials may prioritize domestic infrastructure only because they are institutionally designed to serve that population (remedial responsibility) or to maintain stability. However, if the international mechanism were equally institutionalized and reliable, the preference for citizens would vanish. The obligation is to the role, not the compatriot.

  ### Crux 3: Mandatory Service and Global Alternatives
  **Question:** Whether a mandatory domestic service obligation (e.g., military conscription) can be justified on associative grounds if an equally effective voluntary global service scheme exists.

  *   **Test Argument/Case: Conscription vs. Voluntary Global Service.**
      *   *Scenario:* State A considers instituting military conscription to defend its borders. A voluntary global service scheme exists that could provide equivalent security guarantees through international cooperation, but requires citizens to serve abroad or under foreign command.
  *   **Predictions:**
      *   *Nationalist Prediction:* Mandatory domestic service is justified because the obligation is to the specific political community that guarantees the citizen's rights. The associative bond requires mutual sacrifice within the specific unit of the state, regardless of global alternatives.
      *   *Cosmopolitan Prediction:* Mandatory domestic service is difficult to justify if a voluntary global scheme achieves the same security ends. Requiring service based solely on birth-based citizenship, when a voluntary cooperative alternative exists, highlights the moral arbitrariness of the border rather than the necessity of the association.
