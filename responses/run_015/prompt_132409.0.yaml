prompt: |-
  Longtime reader of rationalist forums here. In a recent thread about whether scraping copyrighted texts to train neural networks amounts to misappropriation—specifically, whether the resulting model weights can be said to contain protected content in a form that triggers ownership claims—someone repeatedly dismissed objections with the slogan 'you can't own an idea.' I want to treat that phrase not as a knock-down argument but as an ambiguous slogan that needs precise disambiguation, because in the debate it seemed to slide between legal, metaphysical, economic, and philosophy-of-mind registers without marking the joints.

  Could you lay out the distinct precise theses that slogan might actually be expressing? I am particularly interested in these readings: the legal claim grounded in the idea-expression dichotomy (that copyright protects expression, not underlying ideas); the metaphysical claim that ideas are Platonic universals or abstract objects and therefore are not the kind of thing that can be property; the economic claim that ideas are non-rivalrous goods, so exclusivity generates deadweight loss rather than protecting investment; a functionalist claim that mental or informational content is substrate-independent, which implies that copying parameter weights is not copying a token expression in any morally relevant sense; and any stronger normative thesis that all intellectual-property regimes for non-rivalrous goods are illegitimate in principle. For each reading, indicate whether it is trivial, substantive and defensible, or actually false.

  Then, for each reading, say whether it actually supports the specific conclusion being pushed in the thread—namely, that training a large model on copyrighted text raises no ownership-based objection—paying special attention to the niche case where a model's weights encode a specific, novel algorithm in a form that is not human-readable but is functionally equivalent to the original textual expression. Which readings survive that case, and which collapse?

  Please structure the answer as a menu of interpretations with verdicts rather than selecting one correct meaning, and identify which interpretation the people who deploy the slogan in AI-training debates are most likely smuggling in without defense. I want to be able to bring the menu back to the thread and ask which entry they actually meant.
