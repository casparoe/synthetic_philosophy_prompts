answer: |-
  This document outlines the **Selection Integrity Procedure (SIP)**. It is designed to be the meta-protocol your committee uses to draft the one-page rules for readers. It is not the rule itself; it is the test every rule must pass.

  ### 1. The Ordered Questions (The Decision Protocol)

  Committees must answer these questions in sequence. If an answer is **NO** at a "Stop" point, the group-conscious element is discarded. If an answer requires a value judgment not grounded in evidence, the matter is referred to the Senate.

  **Q1: Legal Permissibility.**
  *   *Question:* Does current law or binding regulation explicitly forbid or require this specific mechanism for this specific pool?
  *   *Sufficient Answer:* Written opinion from General Counsel citing specific statute or case law.
  *   *Stop Point:* If Counsel advises the mechanism is illegal (e.g., a quota in admissions), the procedure **STOPS**.
  *   *Exception:* If Counsel advises the mechanism is *mandated* (e.g., Board composition), the procedure proceeds to Q2 only to determine implementation safeguards, not validity.

  **Q2: Evidentiary Basis for Disadvantage.**
  *   *Question:* Is there empirical data showing the identified group is under-represented relative to the relevant denominator *and* that this under-representation is not fully explained by neutral factors (e.g., pipeline availability)?
  *   *Sufficient Answer:* Institutional data compared to national census or qualified-pool data over a 5-year rolling average.
  *   *Stop Point:* If the data shows parity or the gap is explained by pipeline constraints, the procedure **STOPS**. (You cannot fix a selection process problem with a selection process tool if the problem is in the pipeline).

  **Q3: Nexus and Necessity.**
  *   *Question:* Is there evidence that group membership is a reliable proxy for the specific institutional goal (e.g., educational benefit, patient trust, legislative compliance) *and* that race/group-blind alternatives have failed to achieve this goal?
  *   *Sufficient Answer:* Internal review of past cycles showing group-blind methods failed to meet the goal, or external peer-reviewed evidence linking the trait to the outcome.
  *   *Stop Point:* If the link is assumed rather than demonstrated, the procedure **STOPS**.

  **Q4: Burden Allocation.**
  *   *Question:* Can we identify specifically who bears the cost of this selection choice, and is that burden proportional to the benefit gained?
  *   *Sufficient Answer:* A statement identifying the "loser" (e.g., "The applicant in the 90th percentile who is not selected") and the "gainer" (e.g., "The institution's legitimacy").
  *   *Hand-Off Point:* If the burden falls on specific individuals (rejected applicants) while the benefit is diffuse (institutional reputation), this is a **VALUE JUDGMENT**. The Committee records the trade-off and refers it to the Senate for policy direction. The Committee does not decide this alone.

  **Q5: Sunset and Review.**
  *   *Question:* Is there a defined metric for success that, if achieved, ends the policy?
  *   *Sufficient Answer:* "This policy expires when group X reaches Y% of the cohort for three consecutive years."
  *   *Hand-Off Point:* If the policy is intended to be permanent, this is a **VALUE JUDGMENT**. Refer to Senate. A remedial tool cannot be permanent by definition.

  ---

  ### 2. Vindication of Distinctions

  Your proposed distinctions are necessary. Here is how the procedure codifies them:

  *   **Reordering vs. Pool Expansion:**
      *   *Vindication:* The procedure treats these differently. **Reordering** (taking a seat from A to give to B) triggers Q4 (Burden Allocation) strictly. **Pool Expansion** (adding funding/seats to admit B without rejecting A) bypasses Q4 but requires a budget sign-off. Most committees attempt reordering while claiming expansion; the procedure forces them to declare which it is.
  *   **The Denominator:**
      *   *Vindication:* Q2 requires the denominator to be specified. For Admissions, the denominator must be the **Qualified Applicant Pool** (legal safety). For the Board, the denominator may be the **General Population** (legislative requirement). Mixing these (e.g., using general population to justify admissions) is a procedural failure.
  *   **Cost Bearers:**
      *   *Vindication:* Q4 explicitly separates the *applicant* (who loses a seat) from the *patient* (who risks care) from the *institution* (which risks legitimacy). A procedure that treats these costs as identical is rejected.
  *   **Floor vs. Ceiling:**
      *   *Vindication:* **Floors** (minimums) are treated as remedial (permitted under Q1 if not quotas). **Ceilings** (maximums) are treated as exclusionary. The procedure flags any mechanism that caps a group as a presumptive legal violation (Stop at Q1).
  *   **Proxy Validity:**
      *   *Vindication:* Q5 addresses this. If a policy runs for two generations, the "disadvantage" proxy may rot into "privilege." The procedure mandates a data review every 3 years. If the socio-economic diversity *within* the protected group collapses (e.g., only wealthy members of Group X benefit), the proxy is broken, and the procedure **STOPS** at Q3.

  ---

  ### 3. The Missing Distinction

  **Remedial Justice vs. Functional Utility.**

  You must distinguish between fixing a *past wrong* (Remedial) and securing a *future benefit* (Functional).
  *   **Remedial:** "We select this way because the institution historically excluded this group." This requires evidence of *institutional* discrimination. It is morally potent but legally risky (requires specific findings of past guilt).
  *   **Functional:** "We select this way because a diverse cohort improves learning/patient care." This is legally safer (Grutter-style logic) but morally thinner.
  *   **Why it matters:** Committees often conflate them. They use Functional arguments to pass Legal review, then use Remedial arguments to silence moral critics. The Procedure requires the Committee to declare which justification is primary. If they claim Remedial, they must produce evidence of institutional harm (Q2). If they claim Functional, they must produce evidence of educational/clinical benefit (Q3). You cannot use both interchangeably.

  ---

  ### 4. Application to Cases

  Here is the procedure applied honestly to your three contexts.

  **Case A: First-Year Undergraduate Admission (30k applications, 2k places)**
  *   **Q1 (Legal):** Quotas forbidden. Individual assessment required. *Pass.*
  *   **Q2 (Evidence):** Data shows under-representation relative to qualified pool. *Pass.*
  *   **Q3 (Nexus):** Does group membership predict educational benefit? Evidence is mixed/contested. Committee must rely on "diversity of experience" argument. *Pass with caution.*
  *   **Q4 (Burden):** Specific rejected applicants bear the cost. Benefit is diffuse (campus climate). *Hand-Off to Senate.* The Committee cannot authorize this burden without Senate policy confirming that "diversity" outweighs "individual ranking."
  *   **Q5 (Sunset):** Current practice has no sunset. *Hand-Off to Senate.*
  *   **Verdict:** The current practice **FAILS** the procedure as written by staff. It requires Senate authorization to proceed because it imposes individual burdens for diffuse benefits without a sunset clause. The Committee must draft a rule that includes a review date and explicit Senate mandate.

  **Case B: Clinical Training Places (40 places, Patient Risk)**
  *   **Q1 (Legal):** Individual merit paramount. *Pass.*
  *   **Q2 (Evidence):** Under-representation exists. *Pass.*
  *   **Q3 (Nexus):** Does group membership correlate with clinical competence or patient safety? *FAIL.* There is little evidence that Group X membership inherently makes a safer clinician than Group Y, absent specific language/cultural skills which should be tested directly.
  *   **Verdict:** The procedure **STOPS** at Q3. Using group membership as a proxy for clinical training selection is indefensible under this protocol because the "Functional Utility" (patient safety) cannot be proxied by demographics. Selection must be based on demonstrated competency (e.g., cultural humility assessments), not identity. This contradicts current practice if identity is being used as a shorthand for competency.

  **Case C: Hospital Board Appointment (Legal 40% Quota)**
  *   **Q1 (Legal):** National rule mandates 40%. *Pass (Mandatory).*
  *   **Q2 (Evidence):** Under-representation is the trigger for the law. *Pass.*
  *   **Q3 (Nexus):** Compliance is the goal. *Pass.*
  *   **Q4 (Burden):** The burden falls on the "recurring names" (exclusion of the 'old guard') and potentially on governance efficiency if the pool is thin.
  *   **Q5 (Sunset):** The law has no sunset. *Hand-Off to Senate.*
  *   **Verdict:** The procedure **PASSES** on compliance, but flags a secondary risk. The "thin pool" issue suggests the problem is not selection but *recruitment*. The Committee must recommend a parallel pipeline program. Relying on the same handful of names risks tokenism, which undermines the Functional Utility of the Board. The rule must state: "Compliance is mandatory, but recruitment must expand the eligible pool to prevent tokenism."

  ---

  ### 5. Limitations and Integrity Checks

  **Unresolvable Conflicts:**
  No procedure can settle the Senate's core disagreement: **Is merit individual or systemic?**
  *   One side believes merit is an objective property of the file (test scores, grades).
  *   The other believes merit is contextual and systemic barriers distort the file.
  *   The Procedure treats this as a Value Hand-Off (Q4). It forces the Senate to vote on the definition of merit. Do not expect the Procedure to solve this; it only exposes it.

  **Systematic Misclassifications:**
  *   **Intersectionality:** The procedure struggles with applicants who belong to multiple groups (e.g., disadvantaged race + advantaged class). It may over-credit them or under-credit them depending on which "denominator" is used.
  *   **Bureaucratic Drift:** Over time, "group membership" becomes a box to tick rather than a consideration of experience. The Procedure cannot prevent readers from ignoring the nuance in a 2-hour training.

  **Detecting Laundering (The Chair's Checklist):**
  To tell if a committee is reverse-engineering a decision, look for these three signs:
  1.  **The Unanimous Value Vote:** If the Committee votes unanimously on a Q4 (Burden) or Q5 (Sunset) question, they are laundering. Value disagreements *must* produce dissent or a referral to Senate. Unanimity on values suggests the dissenters were pressured to conform.
  2.  **The "Evidence" Shell Game:** If the Committee cites "national data" for Q2 when the rule requires "institutional data," they are avoiding the hard work of measuring your own house.
  3.  **The Permanent Temporary:** If the "Sunset" date is pushed back more than once without a change in the underlying data, the policy has shifted from Remedial to Permanent. This requires a new Senate mandate. If they do it administratively, they are violating the Procedure.

  **Final Note to the Chair:**
  You asked for a procedure that might rule against your own history. In Case B (Clinical), this procedure suggests that using identity as a proxy for skill is unsafe. This may feel like a betrayal of the access scheme that admitted you. But the integrity of the procedure depends on its willingness to say "No" even when it hurts. Your admission was a correction of a specific historical exclusion; this procedure ensures future corrections are based on current evidence, not past debts. That is the only way the document survives the Senate and the Courts.
