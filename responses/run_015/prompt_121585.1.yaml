answer: |-
  Here is a complete plan for your 75-minute session. It is designed to be physically active, logically rigorous, and philosophically open-ended. It respects your constraint to avoid lecture-up-front and forces the participants to generate the contradiction themselves.

  # Activity: The Simultaneity Tribunal

  **Goal:** To physically demonstrate that two observers following the exact same rules for determining "Now" will disagree on the order of distant events, forcing a choice between "one is wrong" or "Now is not universal."
  **Space:** Football field or gym (needs a clear 20-meter straight line).
  **Props:** 10 Cones, 1 Long Measuring Tape, 2 Whistles, 4 Stopwatches (phones), 1 Deck of Index Cards (see below), 2 Colored Flags (or distinct shirts).

  ## 1. Setup & Roles (10 Minutes)

  Do not explain *why* you are doing this. Explain *what* they are doing. You are the "Referee."

  **The Field:**
  1.  Mark a **Center Point** (0m).
  2.  Mark **Left** (-10m) and **Right** (+10m).
  3.  Mark a **Start Line** for the Moving Observer at -5m (so they pass Center at the moment of the event).

  **The Roles (14 Students):**
  *   **Observer A (1 person):** Stands at Center (0m). Stationary.
  *   **Observer B (1 person):** Walks at a steady, brisk pace from Left to Right, passing Center at the exact moment the "Events" happen.
  *   **Event Triggers (2 people):** Stand at Left and Right. They hold flags.
  *   **Messengers (4 people):** Two for A, Two for B. They walk at a fixed "Speed of Light" (e.g., exactly 1 meter per second). *Crucial:* They must maintain this pace regardless of who sends them.
  *   **Scribes (4 people):** Two for A, Two for B. They hold stopwatches and record data.
  *   **Judges (6 people):** They do not move. They collect the data cards and analyze the contradiction.

  **The Rules (Hand out Index Card Set 1):**
  > **THE LAW OF SIGNALS**
  > 1. **Constant Speed:** Messengers always travel at 1 meter/second. No running. No slowing down.
  > 2. **The Midpoint Rule:** You do not know when a distant event happened until a Messenger returns.
  >    *   If you send a Messenger at $T_{send}$ and they return at $T_{return}$...
  >    *   The Event happened at $T_{event} = (T_{send} + T_{return}) / 2$.
  > 3. **The Relativity Rule:** Observer B is allowed to consider themselves "stationary." Observer A is moving relative to B. Both are equally valid.

  ## 2. The Simulation (20 Minutes)

  Run two trials.

  **Trial 1: Observer A (The Embankment)**
  1.  Observer A stands at 0m. Messengers stand next to A.
  2.  Event Triggers at -10m and +10m raise flags *simultaneously* (you, the Referee, whistle once).
  3.  Messengers walk to the flags, touch the Trigger's shoulder, and walk back.
  4.  Scribes record $T_{send}$ (0) and $T_{return}$ (20 seconds).
  5.  **Calculation:** Scribes calculate $T_{event}$. (Result: 10 seconds for both).
  6.  **Conclusion A:** "Left and Right happened at the same time."

  **Trial 2: Observer B (The Train)**
  1.  Observer B starts at -5m and begins walking at 1 meter/second toward the Right.
  2.  *Timing is key:* B must pass the Center Point (0m) exactly when you whistle the Event. (Practice this once).
  3.  B's Messengers walk at 1 meter/second relative to B. (This is hard to physically simulate perfectly without vectors, so use this workaround):
      *   *Workaround:* B's Messengers walk at 1 m/s on the ground, but B *measures* their speed as 1 m/s.
      *   *Simpler Physicalization:* Have B's Messengers walk at 1 m/s. Because B is moving toward the Right signal, the Right Messenger has less distance to cover to meet B on the return leg than the Left Messenger does.
  4.  Event Triggers raise flags (same whistle as before).
  5.  Messengers return to B. Because B has moved toward the Right, the Right Messenger returns *before* the Left Messenger.
  6.  Scribes record $T_{send}$ (0) and $T_{return}$ (different times).
      *   Right Return: ~15 seconds (B walked toward it).
      *   Left Return: ~25 seconds (B walked away from it).
  7.  **Calculation:** Scribes calculate $T_{event}$ using the Midpoint Rule.
      *   Right Event: $7.5$ seconds.
      *   Left Event: $12.5$ seconds.
  8.  **Conclusion B:** "Right happened before Left."

  ## 3. The Tribunal (20 Minutes)

  Gather the **Judges**. Hand them the data sheets from Team A and Team B.

  **The Task:**
  > "You are the Supreme Court of Physics. Team A and Team B followed the exact same Laws (Index Card 1). They used the same Messengers. They witnessed the same Flags.
  >
  > **Verdict Options:**
  > 1. **Team A is Right, Team B is Wrong.** (Explain why B's measurement was invalid).
  > 2. **Team B is Right, Team A is Wrong.** (Explain why A's measurement was invalid).
  > 3. **Both are Right.** (Explain how two different 'Pasts' can be true).
  > 4. **Neither is Right.** (There is a truth they both missed).
  >
  > You have 15 minutes to reach a unanimous verdict. You must present your reasoning."

  *While they debate, circulate. If they say "B moved, so B is distorted," remind them of Rule 3 (The Relativity Rule). If they say "It's just signal delay," remind them they used the Midpoint Rule to correct for delay.*

  ## 4. The Debrief & Philosophy (25 Minutes)

  Bring everyone together. Do not give a lecture. Use their verdict to drive the three claims.

  ### Part 1: Mapping the Three Claims (10 Minutes)
  Write these three sentences on the board. Ask the group to map their activity to them.

  1.  **Determinism:** "The future is fixed by the past + laws."
  2.  **Eternalism:** "Future events exist now, just in a different location."
  3.  **Relativity of Simultaneity:** "There is no frame-independent fact about what is happening 'Now' at a distance."

  **Guide the conversation:**
  *   "Did this activity prove **Determinism**?"
      *   *Answer:* No. We didn't talk about causes or laws of motion. We only talked about *when* things happened. You can have a Block Universe where the future is random (quantum), but still *exists*.
  *   "Did this activity prove **Relativity of Simultaneity**?"
      *   *Answer:* Yes. This is Claim 3. It's the physics result. Team A and Team B disagree on "Now."
  *   "How did we get from Claim 3 to **Eternalism** (Claim 2)?"
      *   *Prompt:* "If Team B says the Right Event is 'already happened' and Team A says it is 'happening now'... and both are valid... does the Right Event exist for Team A?"
      *   *Goal:* Have them articulate the Rietdijk–Putnam move. If B's "past" is A's "present," then A's "present" must be as real as B's "past." Therefore, the future (A's future) is as real as the past.

  ### Part 2: The Hidden Master Clock (7 Minutes)
  *This addresses your first specific constraint.*

  **The Reveal:**
  > "I lied. Well, I omitted something. What if, underneath the field, there is a Hidden Master Clock? A true, God's-eye 'Now' that neither Team A nor Team B can measure because the Messengers are tricked by motion. This is called **Lorentzian Ether Theory**."

  **The Question:**
  > "If I told you this was true, does it change the data you collected? No. Does it change the physics predictions? No. So why do physicists reject the Master Clock? Why prefer the Block Universe?"

  **Discussion Points:**
  *   **Parsimony:** Why posit an unmeasurable "True Now" if it does no work?
  *   **Ontology:** If the Master Clock exists, then "Existence" is frame-relative (only the Master's "Now" is real). If the Block Universe exists, "Existence" is absolute (everything is real), but "Now" is relative.
  *   **The Feeling:** Ask them: "Which feels more uncomfortable? That there's a secret time you can't know, or that your future is already sitting there?"

  ### Part 3: The "Cheapness" Objection (5 Minutes)
  *This addresses your second specific constraint.*

  **The Prompt:**
  > "Observer B was just walking at 1 meter per second. A slow walk. Are you telling me that because I walked past you, my 'slice' of the universe tilted enough to include events that were in your future? That feels cheap. Like the conclusion was packed into the premise."

  **The Explanation:**
  *   Acknowledge the validity of the feeling. In our activity, the distances were small (10m).
  *   **Scale it up:** "If Observer B walks past you on the street, and there is an alien fleet in the Andromeda Galaxy (2.5 million light years away)..."
  *   "The tilt is small ($v/c$), but the distance is huge."
  *   "That small tilt, multiplied by 2.5 million light years, means the alien's 'Now' for the walker could be 'Invading Earth' while for the stander it is 'Still Building Ships.'"
  *   **Virtue or Bug?** Ask: "Is it a virtue that a simple walk connects us to the deep future? Or does it mean 'Real' is the wrong word for what we are measuring?"

  ### Part 4: Predictable Failures & Limitations (3 Minutes)
  *Be honest about what the activity couldn't do.*

  1.  **The "Light Delay" Objection:**
      *   *Prediction:* Someone will say, "B just saw the light sooner because they walked toward it. It's an illusion."
      *   *Response:* Remind them of the **Midpoint Rule**. We didn't judge by *seeing*. We judged by *calculating* after correcting for travel time. The disagreement survives the correction.
  2.  **The "Feeling" Gap:**
      *   *Honest Admission:* "This activity made you *calculate* the Block Universe. It did not make you *feel* it. You still feel time flowing. That's because our brains are biological clocks, not relativistic observers. You have to accept the math even if your intuition screams."
  3.  **Determinism vs. Eternalism:**
      *   *Clarification:* "Remember, even if the Block Universe is true, it doesn't mean you couldn't have chosen differently. It just means whatever you choose is 'there' in the block. Don't let physics kill your free will before you've studied philosophy."

  ## Index Card Content

  **Card Set 1 (Rules):**
  > **PHYSICS PROTOCOL**
  > 1. **$c$ is Constant:** Messengers move at 1 m/s for everyone, regardless of who sends them.
  > 2. **Operational "Now":** An event is "Now" at time $T$ if a signal sent at $T - d/c$ returns at $T + d/c$.
  > 3. **No Privilege:** No observer is "really" stationary. Motion is only relative.

  **Card Set 2 (For Judges):**
  > **THE QUESTION**
  > Team A says: Events L and R were Simultaneous.
  > Team B says: Event R happened before Event L.
  >
  > **If "Real" means "Happening Now":**
  > Is Event R real for Team A?
  > Is Event R real for Team B?
  > Can "Real" be relative?
  >
  > **If "Real" cannot be relative:**
  > What does that imply about Event R for Team A?

  ## What Will Predictably Go Wrong (Instructor Notes)

  1.  **The "Moving Messenger" Glitch:** In Trial 2, physically having the messengers move at $c$ relative to a moving observer is impossible without vector math.
      *   *Fix:* Don't over-explain the vector. Just enforce the result: The messenger returning from the "front" meets the observer sooner because the observer walked toward them. Trust the geometry of the field.
  2.  **The Determinism Conflation:** Students will inevitably say, "So the future is determined."
      *   *Fix:* Keep a "Determinism Parking Lot" on the whiteboard. Write their comments there and say, "We will address this at the end." Then, in Part 1, explicitly separate *existence* from *causality*.
  3.  **The "It's Just Perspective" Resistance:** Students will treat "Now" like "Left/Right." (i.e., "It's just relative, nothing deep.")
      *   *Fix:* Push the **Existence** angle. "If I say the future doesn't exist, and you say it does (because it's your past), and we are both right... do you see the problem?"

  ## Final Outcome Check
  By the end, students should be able to say:
  *   "I accept **Relativity of Simultaneity** because we proved it with the messengers."
  *   "I am unsure about **Eternalism** because it requires assuming 'Real' can't be relative, which is a philosophical choice, not a physics one."
  *   "I reject **Determinism** as a conclusion from this, because existence isn't the same as causation."

  This structure gives them the physical intuition of the tilt, the logical space to question the metaphysics, and the honesty to admit where the physics ends and the philosophy begins.
