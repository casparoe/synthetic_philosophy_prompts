  If self is lost, are wrong and right the same?
  Who guards the soul when reason loses might?
  The just man suffers, stripped of every name.

  The deed is done, without a trace or claim,
  Without a witness, who defines the right?
  The ring hides all, leaving no self to blame.

  Is goodness real within a hollow frame?
  Does justice die in unremembered night?
  The just man suffers, stripped of every name,
  The ring hides all, leaving no self to blame.
