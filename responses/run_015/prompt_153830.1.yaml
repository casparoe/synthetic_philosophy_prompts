      *   **Audience:** Mixed group (Moral Philosophers + Practicing Legal Mediators w/o philosophy background).
      *   **Tone/Style:** Rigorous enough for philosophers, accessible enough for mediators (no jargon), no bibliography/citations/quotes.
      *   **Format:** Opening remarks for a one-day workshop.

  2.  **Determine the Structure of the Remarks:**
      *   **Welcome & Context:** Acknowledge the diverse audience and the purpose of the day.
      *   **The Core Problem:** Introduce the tension between individual moral psychology and organizational reality.
      *   **The Strawsonian Hook:** Introduce reactive attitudes (resentment/gratitude) without getting bogged down in academic exegesis.
      *   **The Metaphor Trap:** Address the temptation to treat institutional attitudes as merely figurative.
      *   **The Structural Shift:** Argue that if institutions *do* hold these attitudes, the *mechanics* of repair change (apology, restitution, policy).
      *   **Boundaries of Agency:** Define what institutions can and cannot do based on this framework.
      *   **Call to Collaboration:** Invite both groups to work together on this problem.
      *   **Closing:** Set the stage for the first session.

  3.  **Drafting - Section by Section:**

      *   *Welcome:* Need to bridge the gap. Philosophers deal in concepts; mediators deal in conflicts. Both care about accountability.
      *   *The Core Problem:* When a university harms a student, or a corporation harms a community, who says "sorry"? The CEO? The PR team? Is it real?
      *   *Strawsonian Concepts:* P.F. Strawson talked about reactive attitudes as the glue of moral community. Resentment implies a demand for respect. Can a *corporation* feel resentment? Can it *feel* gratitude? Or is it just policy?
      *   *The "Just Metaphor" Objection:* Many say "Corporations don't have feelings." I need to push back. If we treat it as metaphor, we let institutions off the hook too easily. If we treat it as real (structurally), the stakes change.
      *   *Structural Requirements:* A person apologizes with remorse. An institution apologizes with *change*. Remorse is internal; institutional repair is external/structural. This is the key pivot.
      *   *Boundaries:* Institutions can't forgive (maybe), but they can restore standing. They can't feel guilt, but they can accept liability. We need to map the limits.
      *   *Collaboration:* Philosophers need the mediators' reality check. Mediators need the philosophers' conceptual clarity.
      *   *Closing:* Let's get to work.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is "Strawsonian reactive attitudes" too jargon-heavy?
      *   *Fix:* Define it immediately in plain English. "The emotional responses that hold us accountable to one another."
      *   *Critique:* Is it too academic for mediators?
      *   *Fix:* Use concrete examples (universities, corporations) frequently. Focus on the *practice* of mediation and settlement.
      *   *Critique:* Is it too simple for philosophers?
      *   *Fix:* Ensure the distinction between "metaphorical" and "structural" is sharp. Don't dumb down the ontological claim about institutional agency.

  5.  **Drafting the Content (incorporating the thesis):**
      *   *Opening:* Welcome everyone. Acknowledge the unusual pairing.
      *   *The Question:* When an organization harms someone, what does repair look like?
      *   *The Philosophical Lens:* Introduce the idea of reactive attitudes (resentment, gratitude) as expectations of goodwill.
      *   *The Pivot:* Can an institution hold these? If yes, it's not about a "corporate soul," it's about "corporate stance."
      *   *The Consequence:* If an institution resents, it demands respect through policy, not tone. If it apologizes, it must change structure, not just express sadness.
      *   *The Limits:* Institutions can't offer genuine personal remorse. They offer institutional restitution. Knowing the difference prevents failed mediations.
      *   *The Goal:* Define the boundaries of institutional moral agency.

  6.  **Review against Constraints:**
      *   No bibliography/citations? Check.
      *   No direct quotes? Check.
      *   Rigorous but accessible? Check.
      *   Focus on structural requirements of repair? Check.

  7.  **Final Polish:** (Self-Correction during drafting)
