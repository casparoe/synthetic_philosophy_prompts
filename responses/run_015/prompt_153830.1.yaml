  *(Self-Correction Note)*: I need to be careful not to definitively answer the question myself, but rather frame it as the guiding problem for the workshop, while still making the requested case that applying these attitudes *changes the structural requirements*. The prompt asks me to "Make the case," so I should take a stance while inviting exploration. I will argue that treating it as non-metaphorical is more productive for repair.

  *(Refining the "Make the Case" instruction)*: The prompt says "Make the case that applying reactive attitudes to institutions is not just metaphorical but changes the structural requirements of moral repair." So I must advocate for this position in the remarks, not just pose it as a question.

