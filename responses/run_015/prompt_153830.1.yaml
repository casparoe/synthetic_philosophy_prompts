answer: |-
  Good morning. It is a privilege to welcome you to this workshop on institutional moral repair. Looking around this room, I see a deliberate and necessary collision of worlds. On one side, we have moral philosophers accustomed to analyzing the architecture of responsibility. On the other, we have legal mediators who navigate the messy, high-stakes reality of conflict resolution every day. Usually, these two groups speak in different languages and at different times. Today, we are speaking to each other, because the problem we are tackling cannot be solved by theory alone, nor by practice alone.

  Our guiding question for the day is deceptively simple: When a large organization—a university, a corporation, or a state agency—causes harm, what does it actually mean for that organization to make amends?

  To answer this, we need to borrow a specific lens from moral philosophy, one that I will keep free of technical weight. We are going to look at what we might call "reactive attitudes." These are the emotional responses that knit a moral community together. When you treat me with disrespect, I feel resentment. When you go out of your way to help me, I feel gratitude. These are not just private feelings; they are demands. Resentment, for example, is a way of saying, "I expect to be treated with respect, and you failed to do so."

  Traditionally, philosophers have argued that these attitudes belong only to individuals. A person can feel resentment; a person can feel remorse. An organization, being a piece of paper and a set of bylaws, has no heart to break and no nervous system to fire with anger. Therefore, the argument goes, when we say a corporation is "sorry" or "offended," we are speaking metaphorically.

  I want to challenge that assumption today. I propose that treating institutional reactive attitudes as merely metaphorical is not only philosophically weak, but it is practically dangerous for the work of repair. If we dismiss institutional resentment or institutional gratitude as fiction, we misunderstand what is required to fix the relationship between an organization and the people it impacts.

  When we say an institution holds a reactive attitude, we are not saying it has a soul. We are saying it takes a stance. When a university disciplines a student, it is not merely processing data; it is expressing a judgment about community standards. When a corporation settles a claim, it is not just moving capital; it is acknowledging a breach of expectation.

  If we accept that institutions can genuinely bear these stances—not metaphorically, but structurally—it changes the requirements for moral repair.

  Consider the difference between a personal apology and an institutional one. If I hurt you, my apology requires genuine remorse. I must feel the weight of what I did. If I say the words without the feeling, I am lying, and the repair fails. But an institution cannot feel. If an institution tries to mimic personal remorse, it often comes across as hollow, performative, or manipulative. We have all seen press releases that say "we are deeply saddened" while the harmful policy remains in place.

  However, if we view the institution through the lens of reactive attitudes, we see that its "remorse" must look different. An institution cannot offer emotional vulnerability, but it can offer structural vulnerability. It can expose its decision-making processes to scrutiny. It can change the incentives that led to the harm. It can bind its future self to new rules.

  This is the core distinction we need to explore today. For an individual, moral repair is often about restoring emotional standing. For an institution, moral repair is about restoring structural trust. An institutional apology is not valid because the CEO cried during a testimony; it is valid because the organization altered the machinery that caused the pain.

  This distinction draws a clear line around what institutions can and cannot meaningfully do.

  Institutions cannot forgive. Forgiveness is a personal release of resentment that only the victim can grant. An institution can pardon, or it can drop charges, but it cannot forgive in the moral sense. Conversely, individuals cannot provide the kind of repair an institution owes. A manager cannot apologize for a systemic culture of harassment simply by saying they are sorry; they must demonstrate that the culture has changed.

  This is where the work of the mediators in this room becomes vital. You know better than anyone what happens when these lines are blurred. You see the frustration when a victim demands emotional accountability from a bureaucracy that is only capable of procedural accountability. You see the failure when an organization offers a check and a statement of regret, expecting the conflict to end, while the victim sees no change in the power dynamics that hurt them.

  And this is where the philosophers are equally essential. We need you to help us define the boundaries of this agency. If an institution takes a moral stance, what are the limits of that stance? Can an institution be a victim? Can it be a moral agent without being a moral patient? We need conceptual clarity to prevent these discussions from collapsing into confusion.

  Our goal for the day is not to produce a final theory of institutional personhood. Our goal is to map the terrain of repair. We need to determine when an institutional response is sufficient and when it is a category error. We need to understand that applying reactive attitudes to organizations is not about pretending they are people. It is about holding them to a standard of accountability that matches their power.

  If we treat institutional attitudes as real, we demand more than words. We demand architecture. We demand that the organization reconfigure itself to prove that the harm will not be repeated. That is a heavier lift than saying "I'm sorry," but it is the only lift that an organization is actually capable of carrying.

  I invite you to bring your sharpest questions and your hardest cases to the table. Let us spend the day rigorously examining where the individual ends and the institution begins, and how we can build a path to repair that honors both.

  Thank you, and let us begin.
