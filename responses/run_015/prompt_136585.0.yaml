  ### Margin Comments (Copy/Paste Ready)

  **[Next to Q1 Para 1]**
  ⚠️ **Major Error:** You have swapped the definitions. The *Negative* Heuristic protects the hard core (forbids modus tollens against it). The *Positive* Heuristic is the forward-looking guide for developing the belt. You have described them in reverse.

  **[Next to Q1 Para 2]**
  Good definition of progressive/degenerating shifts. However, you haven't explicitly defined "superseded rather than refuted" here as requested (you do this well in Q2b, but it belongs in Q1).

  **[Next to Q2(a) Para 3]**
  ⚠️ **Critical Misreading:** The text says parameters were *estimated by fitting* to the Bay Islands survey (1978). A 2011 run on the same data is accommodation, not prediction. For Lakatos, accommodating known facts does not constitute a progressive shift (it's ad hoc). This error changes your classification of EP from degenerating to progressive.

  **[Next to Q2(b) Para 4]**
  Excellent. You correctly distinguish the AP prediction (temporally novel, not fitted) from the EP accommodation. This shows a solid grasp of the "novel fact" requirement for supersession.

  **[Next to Q2(c) Para 5]**
  Good nuance on the retrospective nature of the judgment ("verdict we can make only now"). Be careful with the first sentence ("was being irrational")—Lakatos argues we *cannot* judge rationality in the moment, only historically. The second sentence corrects the first, but the contradiction is noted.

  **[End of Script]**
  Strong understanding of the rivalry and historical aspects of Lakatos (Q2b/c), but undermined by the heuristic definition swap (Q1) and the accommodation/prediction confusion (Q2a). Review the specific definitions of the heuristics and the strict requirement for *temporally novel* corroboration.
