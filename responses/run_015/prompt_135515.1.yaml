answer: |-
  The ink on the page was still wet, which was the first impossibility. The second was that the page was dated three days hence, according to the wall chronometer, yet it sat in a box marked *Completed Transactions: Cycle 49*.

  Elara did not look at the chronometer. In the Archive, clocks were decorative, like the brass astrolabes gathering dust on the high shelves. They measured the rotation of the local station, not the rotation of the universe. Outside the thick quartz windows, the stars did not rise or set; they hung in a slow, dizzying spiral, the visible proof of the cosmos turning upon its axis. Here, in the Gödel metric, time was not a river. It was a labyrinth.

  She adjusted her spectacles and looked at the handwriting. It was hers. The loop of the *g*, the sharp cross of the *t*. There was no doubt.

  *East Wing. Combustion event. Origin: Fuse box B. Casualties: None. Structural loss: Moderate.*

  She ran a finger over the paper. It felt warm. In her line of work, one learned quickly that *before* and *after* were local privileges, not universal laws. There was no privileged simultaneity. Two events could be separated by space and time, yet lie on the same closed curve. You could walk far enough in a straight line and arrive home before you left.

  Elara placed the note into a folder labeled *Effect: Fire*. She did not have a folder for *Cause*. In this geometry, causes were often found in the future of their effects.

  "Still fighting the taxonomy?"

  Kael stood in the doorway. He held a tray of tea that steamed in the still air. He was a junior cataloger, still young enough to be troubled by the topology of their existence.

  "The taxonomy fights back," Elara said, taking the tea. "Did you file the rainfall logs?"

  "I tried. But the rain in the valley happened after the flood, Elara. I can't file the flood as a consequence of rain if the rain hasn't fallen yet."

  "File by causality, Kael. Not by the clock. The moisture caused the swell. The order of the paperwork must reflect the chain of agency, not the position of the stars."

  Kael sat on the edge of her desk, looking weary. "It's getting harder to tell the difference. Sometimes I write a report and feel like I'm transcribing a memory of something I haven't done. It makes me feel... hollow. Like a character in a book that's already been read."

  "That is the illusion of the global coordinate," Elara said softly. "You are looking for a universal 'Now'. It does not exist."

  "It means we have no choice," Kael insisted, his voice dropping. "If the curve closes, the end is written in the beginning. If I drink this tea, it is because I always drank this tea. The loop is a cage."

  Elara picked up her pen. She hovered it over a fresh sheet of paper. "Look at this pen. If I push it, it moves. That is local causality. The push precedes the motion in every frame, on every curve. That is real. That is my will."

  "But where does the push come from?"

  "From me. Here. Now." She tapped the desk. "The universe may rotate, Kael. The light cones may tip until they touch their own tails. But I am not the universe. I am a point within it. My decisions are local events. They are valid, even if the road circles back to them."

  "It feels like fate," Kael said.

  "It feels like fate because you are trying to see the whole map at once," Elara replied. "We live in the tangent, not the curve. We only ever experience the immediate next step. The fact that the path loops is a property of the geometry, not the walker."

  She turned back to the note about the fire. The wet ink shimmered.

  "What will you do?" Kael asked, nodding at the paper. "Warn them? Shut down Fuse Box B?"

  Elara considered this. In a universe of closed timelike curves, information was as conserved as energy. If she warned them, and they prevented the fire, then the note would never be written. If the note was never written, she would not warn them. The loop would break, and the manifold would tear. But she knew, with the quiet certainty of an archivist, that the manifold did not tear.

  "If I stop it," Elara said, "then this paper becomes a lie. And I do not file lies."

  "So you let it burn?"

  "I let it happen. Just as I let the rain fall after the flood. My job is to witness the chain, not to sever it."

  She picked up the note and walked to the filing cabinets. They were arranged in a spiral, mimicking the rotation of the outer stars. She slid the folder into the slot. It fit perfectly, as if the drawer had been waiting for the thickness of that specific paper.

  A smell reached her then. Acrid. Sharp. Ozone and burning insulation.

  Kael stood up, sniffing the air. "East Wing?"

  "Fuse Box B," Elara said. She did not move toward the door. The alarm bells began to ring, a sound that seemed to come from the future and the past simultaneously, vibrating in the dust motes dancing in the light.

  "We should go," Kael said, panic rising.

  "In a moment. I have to stamp the receipt."

  "Elara, the fire—"

  "The fire is an event. It is occurring locally. The cause is electrical failure. The effect is smoke. I am filing the record of the cause." She pressed the stamp down onto the logbook. *THUD.* "There. Causality preserved."

  She stood and smoothed her skirt. The smoke was thickening near the ceiling, drifting in strange eddies, caught in the subtle Coriolis forces of the room's ventilation, or perhaps the rotation of the world itself.

  Kael stared at her, then at the smoke, then at the logbook. "You knew."

  "I remembered," Elara corrected. "Or I predicted. The distinction requires a universal time. We don't have one."

  She walked past him toward the stairs, stepping carefully. She was not fleeing the fire, nor was she rushing to meet it. She was simply moving along her worldline. The fire was just another feature of the landscape, like a hill or a valley.

  As they entered the corridor, the heat washed over them. It was real. It hurt. It was not a simulation, not a dream. The pain was local. The choice to walk away was local.

  "Does it bother you?" Kael asked, coughing slightly as they moved away from the East Wing. "Knowing that you wrote the history before you lived it?"

  Elara looked at her hands. They were steady. She thought of the ink drying on the page before the fuse had even sparked. She thought of the stars spiraling outside, endless and returning.

  "The script is written," Elara said, watching the smoke curl upward, twisting against the rotation of the ceiling fans. "But I am the one holding the pen. And until the ink is dry, the sentence is not finished."

  They walked on, the alarm bells fading behind them, leaving only the sound of their footsteps on the stone floor, marking out a rhythm that was theirs alone, in a universe that had forgotten how to keep time.
