      *   Ensure fairness: Marcus isn't just "wrong"; he's using standard compatibilist moves. Elena is pressing the incompatibilist/hard determinist line.
      *   *Self-Correction on Move 3:* Marcus says Peircean selects a branch. Actually, in Peirceanism, there *are* no unactualized branches in the same way. He might be conflating models. I need to point out this technical slippage.
