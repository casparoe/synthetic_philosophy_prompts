          *   *Key Concept:* Peircean (only actual future is real) vs. Ockhamist (many futures real, one actual).
          *   *Assessment:* This is a sophisticated move. Peirceanism denies truth values to future contingents until they happen. If the prophecy is true *now*, Peirceanism struggles unless the prophecy is about the *current* trajectory.

      *   **Move 4 (Elena): "Fatalism with Extra Steps".**
