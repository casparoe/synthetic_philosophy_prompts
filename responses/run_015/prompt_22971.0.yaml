answer: |-
  This is a fantastic question. You have spotted the exact pressure point where Anscombe's moral philosophy meets political reality, and you are right to be suspicious of the "consequentialism is bad" caricature. That summary turns her into a rule-worshipper, whereas she was actually concerned with the **integrity of moral language** and the **description of human action.**

  For a novel set in 1956 Oxford, getting this nuance right will give your character genuine intellectual weight. Here is a walkthrough of the distinction, how it applies to Truman, and an analysis of the "gap" you've identified regarding the Potsdam justification.

  ### 1. The Distinction: Intention vs. Foresight
  Anscombe's argument relies on a specific conception of **intention**. It is not merely a psychological state (what you feel in your head); it is the description under which the action is chosen.

  *   **Choosing as a Means:** If I kill you *in order to* get your money, your death is part of my plan. It is the means. I cannot achieve my end without your death.
  *   **Foreseeing as a Side Effect:** If I bomb a munitions factory to stop war production, and I know with certainty that workers inside will die, their death is *foreseen* but not *intended* (in the strict Anscombian sense). My plan is "destroy factory." If, by some miracle, the workers survived but the factory was destroyed, my plan would still be fully successful.

  **Anscombe's Move:** She argues that in the case of Hiroshima and Nagasaki (and area bombing generally), the death and destruction of the civilian population **cannot** be categorized as a side effect.

  Why? Because the *mechanism* by which the bomb was supposed to work was the shock of total destruction. The strategy was not "destroy military targets and hope the government surrenders." The strategy was "demonstrate to the government that we can erase their cities." Therefore, the erasure of the city (and the people in it) is the **instrument** of coercion. You cannot have the coercion without the destruction. Thus, the killing is intended as a means.

  ### 2. Applying it to Truman
  Anscombe's pamphlet is short and blunt. She does not spend much time on the technicalities of Double Effect; she assumes the Catholic/Classical tradition is understood. Her focus is on the label "murder."

  She argues that Truman is a murderer because he ordered an act that, by definition, involves the intentional killing of the innocent. She rejects the idea that "Head of State" grants a license to do what is forbidden to individuals.

  **The Key Textual Point:** Anscombe writes that if you accept Truman's justification, you are accepting that "murder" is no longer a useful word. If we can kill innocents for a "sufficiently good" outcome, then the prohibition on murder is not absolute; it is conditional. For Anscombe, a conditional prohibition on murder is no prohibition at all.

  ### 3. Addressing Your Sticking Point: The Potsdam "General Principle"
  You wrote: *"The justification she reports... is basically that they had the bomb and they could use it, which doesn't obviously slot into either side of her distinction."*

  This is a very sharp observation. You are sensing that the Allied justification wasn't necessarily "We need to kill civilians to win" (Means), nor was it "We are targeting military sites and civilians will die" (Side Effect). It was closer to: **"We possess a weapon of war, war is legal, therefore using this weapon is legal."**

  Does this expose a gap in Anscombe's framework?

  **Anscombe's Counter-Move:**
  Anscombe anticipates this. She argues that the "General Principle" of Total War (that anything goes if it shortens the conflict) is itself a corruption of morality. She would argue that the justification "We had the bomb" implicitly admits that the *capacity for destruction* was the point.

  If the justification is "We used the weapon we possessed to force surrender," Anscombe asks: *How does the weapon force surrender?*
  *   If the answer is "By destroying military targets," then why target Hiroshima and Nagasaki (cities)?
  *   If the answer is "By showing them we can destroy cities," then the destruction of the city is the **means**.

  So, within her framework, the "General Principle" justification **collapses into the "Means" category.** She forces the defender of Truman to admit that the civilian destruction was the method of coercion.

  **Is there a genuine gap?**
  There is a tension, but it might not be where you think it is.
  *   **The Tension:** The tension lies between **Legal Positivism** (Truman acted within the laws of war as then understood) and **Natural Law** (Anscombe's view that there are moral absolutes higher than state law).
  *   **The "Gap":** The gap you are sensing is that Anscombe's Means/Side-Effect distinction is designed for individual ethics, and she is applying it to **statecraft**.
      *   A critic might say: "The State doesn't have 'intentions' in the same way a person does; it has strategic objectives."
      *   Anscombe's reply (and this is crucial for your novel): She insists that the State is made of people making choices. To say "The State did it" is a way of evaporating moral responsibility. She is fighting against the **abstraction of evil**.

  **Does the distinction do less work than she wants?**
  In this specific instance, yes and no.
  *   **No:** The distinction successfully categorizes the act as murder *if* you accept her premise that targeting cities = intending death.
  *   **Yes:** The distinction doesn't solve the problem of **competing moral obligations**. Truman had an obligation to protect American soldiers. Anscombe prioritizes the obligation not to murder innocents. The "Means/Side-Effect" distinction doesn't tell you which obligation wins; it only tells you what kind of act you are performing. Anscombe fills this gap with **Absolutism**: You simply cannot murder, regardless of the obligation to save soldiers.

  So, it is not a logical gap in her essay; it is a **foundational clash**. She isn't trying to prove the distinction balances the outcomes; she is trying to prove the distinction reveals the nature of the act.

  ### 4. How to Handle This in Your Novel
  If you are writing a scene where a character challenges Anscombe (or a character based on her) on this, here is how to make it philosophically accurate without bogging down in jargon.

  **The Challenge (Your Character):**
  "The Allies didn't choose to kill the innocent as a *means*, Professor. They chose to end the war. The bomb was the tool. The deaths were the inevitable shadow of that tool. They didn't wake up thinking 'How many children can we kill today?' They thought 'How do we stop the killing?'"

  **The Anscombe Response:**
  "But you are describing the *motive* (stopping the war), not the *action*. If I poison a village's water supply to demoralize the army hiding there, my motive is victory. But my action is 'killing villagers.' You cannot say the deaths are a side effect if the demoralization *depends* on the deaths. If the villagers lived but the army surrendered, the weapon would have failed. Therefore, their death was the method. And if you say the method is justified by the motive, you have abolished the concept of murder."

  **The "Potsdam" Angle:**
  If your character pushes the "We had the weapon" angle:
  *   **Character:** "It was a weapon of war. We declared we would use it. That was the principle."
  *   **Anscombe:** "Then the principle was 'We may kill innocents if we have the technology to do so.' That is not a principle of justice. It is a principle of brigandage. You are arguing that might makes right."

  ### 5. Summary for Your Drafting
  1.  **Don't make her a Consequentialist Hunter:** She isn't arguing that consequences don't matter. She is arguing that **descriptions of actions matter.** "Murder" is a specific description that cannot be washed away by "Good Outcome."
  2.  **The "Gap" is the Point:** The friction you feel regarding the Potsdam justification is the exact friction Anscombe wants to highlight. She wants to show that modern political language is designed to hide the reality of murder. When Truman says "Military Necessity," Anscombe hears "Murder."
  3.  **Fixing the Framework:** You don't need to fix the gap for her. In 1956, she believes there is no gap. The "General Principle" is simply false. If your novel needs a critique, let it come from a different character (perhaps a pragmatic don or a veteran) who argues that **responsibility for the greater good** requires getting your hands dirty. Anscombe's tragedy (and strength) is that she believes you cannot get your hands dirty without becoming unclean.

  **Atmospheric Note:** In 1956, this wasn't just academic. The Suez Crisis was brewing (happened later that year). The memory of the Blitz was fresh. The Cold War was heating up. Anscombe's argument was terrifying to many because it suggested that the "Good War" (WWII) involved mass murder by the Allies. Your characters should react with a mix of admiration for her courage and horror at her implications.

  **Key Quote to keep in mind (paraphrased):** "People say 'You can't make an omelet without breaking eggs.' I am saying that if the eggs are innocent people, you don't get to make the omelet." (Anscombe didn't say exactly this, but it captures the spirit of *Mr. Truman's Degree*).

  Actually, a better real quote to capture her tone is: *"We have lost the concept of murder."* Use that. That is the heart of her argument.
