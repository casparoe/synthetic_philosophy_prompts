  9.  (Final check on Anscombe's text): In *Mr. Truman's Degree*, she explicitly says: "It is meaningless to talk of 'justifiable murder'." She attacks the idea that the "end justifies the means." She specifically targets the *choice* of method. The method was "destruction of cities." The inhabitants were not side effects; they were the medium of destruction.

