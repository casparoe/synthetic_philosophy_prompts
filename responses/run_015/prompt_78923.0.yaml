      *   **Deadline:** Tuesday (session), Wednesday (CS deadline). High pressure.
      *   **Tone:** Intellectual, skeptical, precise, looking for philosophical depth but grounded in technical reality. They want to know *why* this isn't just hand-waving.

  2.  **Deconstruct the Core Question:**
      *   **The Tension:** Proof in ROM (independent random outputs) vs. Reality (SHA-256, deterministic, dependent outputs).
      *   **The Ask:** What is the coherent philosophical position that licenses this?
      *   **Specific Sub-questions:**
          *   Is it a claim about SHA-256's statistics?
          *   Is it about scoping attacks?
          *   Is it about burden of proof?
          *   Is it a heuristic?
