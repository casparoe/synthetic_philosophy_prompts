      *   *Case 2 Nuance:* The user mentions "implicit exception... applied retroactively." This is very close to what Nancy Cartwright discusses regarding *ceteris paribus* laws in physics/economics. The law holds "all else being equal," but "all else" is defined by when the law works.
      *   *Unified Concept:* Both are ways of managing the **Duhem-Quine problem**. The core theory isn't tested in isolation; it's tested with auxiliary assumptions. Case 1 changes the auxiliary assumptions about classification. Case 2 changes the auxiliary assumptions about boundary conditions.
