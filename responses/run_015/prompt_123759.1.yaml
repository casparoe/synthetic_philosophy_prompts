answer: |-
  This is a sophisticated observation that cuts to the heart of the **demarcation problem** in the philosophy of science. You have identified two distinct strategies for managing the tension between empirical data and theoretical commitment.

  To answer your primary question directly: **There is no single, standard term that exclusively groups these two specific manifestations together.** However, they are both recognized instances of what Karl Popper called **Immunizing Stratagems** and what Imre Lakatos described as adjustments to the **Protective Belt** of a research programme.

  While they share a logical structure (preserving a core claim against falsification), philosophy of science generally treats them as **epistemically distinct** based on whether the adjustment generates new knowledge or merely protects the old.

  Here is a breakdown of how to articulate this distinction for your seminar, the terminology you should use, and the principled reasons for treating them differently.

  ---

  ### 1. The Umbrella Concept: Immunization and the Protective Belt

  Both cases fall under the broad umbrella of **Theory Protection**. In the context of the **Duhem-Quine Thesis** (which states that hypotheses cannot be tested in isolation, only as part of a web of beliefs), any counterexample can be deflected by adjusting a different part of the web.

  *   **Popper's Term:** **Immunizing Stratagem.** Popper argued that a theory is only scientific if it is falsifiable. If you adjust the theory to accommodate every failure, you immunize it against falsification, rendering it unscientific.
  *   **Lakatos's Term:** **Protective Belt Adjustment.** Lakatos softened Popper's view. He argued that all research programmes have a "hard core" (the central theory) and a "protective belt" (auxiliary hypotheses). Adjusting the belt is normal science; the key is whether the adjustment is *progressive* or *degenerating*.

  Your two cases are different ways of adjusting the protective belt.

  ### 2. Distinguishing the Two Mechanisms

  While both protect the induction, they function differently regarding **ontological commitment** and **heuristic power**.

  #### Case 1: Taxonomic Subdivision (Differentiation)
  *   **Mechanism:** The class $A$ is split into $A_1$ and $A_2$. The law holds for $A_1$.
  *   **Philosophical Classification:** This is often **Legitimate Refinement** (or *Specification*), provided it meets certain criteria.
  *   **Why it is often acceptable:** In biology, discovering a counterexample (e.g., egg-laying mammals) often reveals a deeper structural reality (monotremes vs. placentals). The subdivision is not just a linguistic trick; it posits a **new natural kind** with independent properties.
  *   **The Danger:** If the subdivision is defined *solely* by the failure (e.g., "All swans are white, except for the non-white subclass"), this is the **No True Scotsman Fallacy**.
  *   **The Demarcation:** It is scientific **if and only if** the new subclass ($A_2$) can be identified by *independent criteria* before the test is run. If you can identify the subclass via physiology or genetics *before* checking the reproduction method, it is a progressive discovery.

  #### Case 2: Retroactive Domain Restriction (Insulation)
  *   **Mechanism:** The law holds, but an implicit "unless" clause is added based on the failure itself.
  *   **Philosophical Classification:** This is a classic **Ad Hoc Hypothesis** (specifically, a *degenerating problemshift*).
  *   **Why it is problematic:** You noted the clause is "constructed using knowledge of the failure itself." In philosophy of science, this violates the requirement of **independent testability**. The exception is not a new theory; it is a linguistic shield.
  *   **Connection to *Ceteris Paribus*:** This resembles an abuse of *ceteris paribus* (all else being equal) laws. As philosopher Nancy Cartwright has argued, many scientific laws only hold in "nomological machines." However, if the conditions for the machine are defined *retroactively* by when the law works, the law becomes tautological.
  *   **The Demarcation:** This is unscientific dogmatism because it reduces the empirical content of the theory without increasing its explanatory power.

  ### 3. Are They the Same Underlying Phenomenon?

  Logically, **yes**. Epistemically, **no**.

  *   **Logically:** Both utilize the **Duhem-Quine loophole**. They both say, "The core theory is not wrong; our understanding of the domain/conditions was incomplete." Both resist falsification by redefining the scope of application.
  *   **Epistemically:** They lie on opposite sides of the **Lakatosian Line**.
      *   **Case 1 (Taxonomy)** is potentially a **Progressive Problemshift**. It leads to new questions (What distinguishes $A_1$ from $A_2$?), new predictions, and deeper structural understanding.
      *   **Case 2 (Meteorology)** is a **Degenerating Problemshift**. It leads to no new predictions. It merely explains away the past. The "hidden clause" has no content other than "when the model fails."

  ### 4. How to Articulate This in Your Seminar

  To frame this effectively, I suggest avoiding the search for a single noun to name the pair. Instead, frame it as a **spectrum of theoretical resilience**.

  Here is a proposed vocabulary for your presentation:

  1.  **The Shared Logic:** Call it **"Scope Restriction to Preserve Inductive Core."** Acknowledge that both move the goalposts to save the central claim.
  2.  **The Critical Distinction:** Introduce the criterion of **Independent Testability** (Popper/Lakatos).
      *   *Case 1* passes if the taxonomic marker is observable *independently* of the trait being generalized.
      *   *Case 2* fails because the "anomalous condition" is defined *by* the violation.
  3.  **The "Grue" Comparison:** You are correct that this is not *Grue*. *Grue* is about **projectibility** (what justifies projecting a predicate into the future). Your cases are about **falsifiability** (what happens when a projection fails). Your cases are closer to the **Quinean web of belief** than Goodman's paradox.

  ### 5. Summary of Boundaries

  | Feature | Case 1: Taxonomic Subdivision | Case 2: Retroactive Domain Restriction |
  | :--- | :--- | :--- |
  | **Logical Form** | "All $A$ are $B$" $\rightarrow$ "All $A_1$ are $B$" | "If $P$ then $Q$" $\rightarrow$ "If $P$ (and not $E$) then $Q$" |
  | **Status of Exception** | Posits a distinct entity/kind ($A_2$). | Posits a vague condition ($E$) defined by failure. |
  | **Testability** | **High:** Can we identify $A_2$ before testing $B$? | **None:** $E$ is only known after $Q$ fails. |
  | **Lakatosian Status** | **Progressive** (if it yields new research). | **Degenerating** (protects core without new insight). |
  | **Fallacy Risk** | *No True Scotsman* (if no independent marker). | *Ad Hoc Hypothesis* / *Special Pleading*. |

  ### Recommendation for Your Argument

  If you need a title or a conceptual hook, consider framing this as **"The Paradox of Theoretical Resilience."**

  You can argue that standard philosophy of science (Popper/Lakatos) focuses heavily on Case 2 (ad hocness) as the villain. However, Case 1 shows that **the same logical move (restricting scope) is sometimes the engine of scientific progress** (e.g., Newtonian physics being restricted to non-relativistic speeds, or "fish" being subdivided to exclude tetrapods).

  The principled reason to treat them differently is **heuristic fertility**.
  *   If the restriction opens new lines of inquiry (Case 1), it is **Differentiation**.
  *   If the restriction closes off inquiry by making the theory unfalsifiable (Case 2), it is **Immunization**.

  There is no single word for "Differentiation vs. Immunization," but describing them as **Progressive vs. Degenerating Scope Restrictions** within a **Lakatosian Research Programme** will resonate strongly with a philosophy of science audience.
