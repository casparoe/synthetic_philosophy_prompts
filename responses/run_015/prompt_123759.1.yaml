  3.  **Evaluating "Established Names":**
      *   Is there a single term for *both*? Not really. They fall under the broad umbrella of "Theory Protection" or "Immunization against Falsification."
      *   *Case 1:* Often called "Taxonomic Revision," "Differentiation," or "Specification." In Lakatosian terms, this could be a *progressive problemshift* if it leads to new predictions.
      *   *Case 2:* Often called "Ad Hoc Hypothesis," "Immunizing Stratagem" (Popper), or "Degenerating Problemshift." The specific "retroactive domain restriction" sounds like *Ceteris Paribus* abuse or *No True Scotsman* fallacy in a scientific context.
      *   *Connection to "Grue":* User is right; it's not Grue. Grue is about projectibility. This is about *falsifiability*.
      *   *Connection to "Ad Hoc":* Case 2 is definitely ad hoc. Case 1 is *potentially* ad hoc but often legitimate.

  4.  **Structuring the Response:**
      *   **Acknowledge and Validate:** The observation is sharp and philosophically significant. It touches on the demarcation problem.
      *   **Address Question 1 (Established Name):** No single specific term covers *exactly* this dichotomy, but they fall under **Immunizing Stratagems** (Popper) or adjustments to the **Protective Belt** (Lakatos).
      *   **Analyze Case 1 (Taxonomy):** Connect to *Natural Kinds* and *Progressive Problemshifts*. It's often legitimate refinement (differentiation). Distinguish from "No True Scotsman."
      *   **Analyze Case 2 (Meteorology):** Connect to *Ad Hoc Hypotheses* and *Ceteris Paribus* clauses. This is likely a *Degenerating Problemshift*. The "retroactive" nature is key.
      *   **Distinguish the Two:**
          *   *Heuristic Power:* Does it generate new tests? (Case 1: Yes, Case 2: No).
          *   *Independence:* Is the exception testable independently? (Case 1: Yes, Case 2: No).
          *   *Ontological Commitment:* Case 1 posits real structure; Case 2 posits a linguistic save.
      *   **Philosophical Frameworks:**
          *   *Popper:* Ad hocness vs. Falsifiability.
          *   *Lakatos:* Research Programmes (Hard Core vs. Protective Belt).
          *   *Kuhn:* Normal Science (puzzle solving vs. crisis).
