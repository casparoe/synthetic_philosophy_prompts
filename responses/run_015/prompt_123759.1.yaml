      *   *Case 2 Analysis:* This is **Ad Hoc Domain Restriction**. Specifically, an abuse of *Ceteris Paribus* clauses. It's a Degenerating Problemshift.
      *   *The "Same or Different" Question:* They are structurally similar (saving the core) but epistemically distinct (one builds knowledge, one hoards it).
      *   *Seminar Advice:* Focus on *independent testability* as the demarcation criterion.

  7.  **Final Polish:** Ensure the tone is academic but accessible. Check that I answer the specific questions (Name? Distinguish? Same/Different?). Make sure to reference the specific philosophers (Popper, Lakatos, Kuhn, Cartwright).

      *(Self-Correction during drafting)*: I should explicitly mention the *No True Scotsman* fallacy for Case 1, as that's the logical form, but distinguish when it becomes scientific (when the subclass has independent properties). For Case 2, emphasize the *retroactive* nature as the hallmark of non-science (post-diction vs. prediction).

