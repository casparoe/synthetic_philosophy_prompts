      *   *Case 2 (Meteorology):* This sounds like *immunizing stratagem* (Popper), *degenerating problemshift* (Lakatos), or *protection belt* adjustment. Specifically, the "retroactive" nature suggests *post-hoc rationalization* or *curve fitting*. It feels more like *special pleading*.
      *   *Commonality:* Both preserve the core claim against falsification. This is the heart of the *Duhem-Quine Thesis* (holism) and *Lakatosian Research Programmes*.
      *   *Difference:* Case 1 expands knowledge (new kind); Case 2 obscures ignorance (vague exception).
