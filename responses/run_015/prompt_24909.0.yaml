prompt: |-
  I'm a software engineer by training, with no formal background in philosophy. Over the past year I've found myself returning repeatedly to Lewis Carroll's "What the Tortoise Said to Achilles" — the short dialogue where the Tortoise accepts modus ponens as a premise but still refuses to accept the conclusion, forcing Achilles into an infinite regress of ever-more-nested conditional statements. The problem seems to me to cut deep: it's not just a puzzle about logic, but about what it means for any formal system — a compiler, a type-checker, an automated theorem prover, a reasoning engine in an AI — to actually follow a rule rather than merely have the rule represented somewhere inside it.

  I'd like to spend some of my limited self-study time over the next six to twelve months understanding what's actually at stake in this problem and where the interesting open questions are. I'm not aiming to publish or become a specialist. What I want is to identify the two or three open questions in this vicinity whose answers would most change how a technically-minded person thinks about the foundations of reasoning — whether in logic, computation, or AI.

  Could you give me a prioritized shortlist of open questions related to Carroll's tortoise and the justification of deduction, and defend the ordering? For each question, I'd want to know: (1) why it's upstream of other issues — what else depends on it; (2) whether it's tractable for someone with a programming and formal-systems background rather than professional philosophy training; and (3) what a resolution would actually look like and whether it would matter for anything beyond philosophical completeness — for how we build systems, write proofs, or understand inference. I'm less interested in a survey of the literature than in a reasoned judgment about where the leverage is.
