  **Q (Comp Sci):** Complexity classes describe algorithms, not agents. Why does hardness license philosophical conclusions?
  **A:** Norms must guide action. If identifying the required belief state is computationally harder than any physical computer can solve, the state is undefined for the agent. Hardness isn't merely slowness; it is impossibility in principle for bounded systems.
  **Note:** Depends on P≠NP. If P=NP, objection collapses.

  **Q (Hostile Epi):** Isn't this just the old ideals vs. performance distinction? Norms evaluate, not guide.
  **A:** Evaluation requires specifiability. You cannot evaluate an agent against a target they cannot identify. Intractability makes the target invisible, not merely distant. It is not a high bar; it is a missing bar.
  **Note:** **PREEMPT THIS.** Acknowledge evaluation-only norms, argue lack of force.

  **Q (Kantian):** "Ought implies can" means logical or physical possibility. Computational difficulty is not impossibility.
  **A:** "Can" implies capacity. If the universe ends before the calculation completes, you effectively cannot do it. Resource-explosiveness makes it physically impossible for finite beings to comply.
  **Note:** Soft on "relevant time." Needs defense of temporal bounds.

  **Q (Metaphysician 1):** Is this claim about rationality as such, or only creatures with an architecture like ours?
  **A:** It concerns any finite agent. Infinity aside, any system with bounded storage faces the threshold. It is metaphysical regarding finitude, not contingent on specific human neural architecture.
  **Note:** Assumes finitude is necessary for agency.

  **Q (Metaphysician 2):** Does discontinuous explosion really block smooth trade-offs?
  **A:** Yes. Below the threshold, compliance is cheap. Above it, impossible. No intermediate state allows partial compliance that counts as satisfying the norm. The cliff edge breaks gradient-based optimization.
  **Note:** **PREEMPT THIS.** Admit threshold fuzzy in practice. Vulnerable to sorites.

  **Q (Ethicist):** If intractability dissolves epistemic norms, does it dissolve moral requirements? Calculating utility is hard too.
  **A:** Moral norms often target actions, not total state coherence. Epistemic coherence requires global consistency checks across all beliefs. Action norms are local; coherence norms are holistic.
  **Note:** Soft if moral norms require global consistency.

  **Q (Political Phil):** Isn't the solution institutional division of cognitive labor? We defer to experts or tools.
  **A:** Deference helps, but the agent must still verify coherence of trusted sources. If verifying the consortium's output is intractable, deference doesn't solve the individual's normative gap.
  **Note:** Assumes individual verification required. Social epistemology might deny.

  **Q (Sympathetic Epi):** Your fallback norm is calibration to resources. Isn't that just pragmatism renamed?
  **A:** No. Pragmatism weighs truth against cost. Calibration makes resource-limitation constitutive of the norm itself. It is not a trade-off; it is the definition of rationality for bounded agents.
  **Note:** Risks collapsing into relativism about rationality.

  **Q (Hope Nobody Asks):** Where exactly is the threshold? If it is vague, isn't the norm vague?
  **A:** The threshold varies, but the existence of *some* threshold is guaranteed by complexity theory. Vagueness doesn't negate the cliff; it just blurs the edge.
  **Note:** Dangerous. Vagueness undermines "unspecifiable" claim. Pivot to "indeterminacy."

  **Q (General):** Why average-case hardness? Worst-case is standard.
  **A:** Agents face natural distributions, not adversarial ones. If hardness persists on natural distributions, worst-case safety nets fail. Average-case hardness closes the "easy in practice" escape route.
  **Note:** Depends on average-case results holding for belief sets.
