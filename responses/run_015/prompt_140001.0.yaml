answer: |-
  Here is the procedure, designed for a half-day workflow, followed by the application to your three live questions.

  # The Durability Forecasting Procedure (DFP)

  **Personnel:** Two analysts (one lead, one reviewer).
  **Tools:** Spreadsheet, historical database access.
  **Time Budget:** 4 hours max per forecast.

  ---

  ### Step 1: Outcome Operationalization
  **Action:** Define the "death" of the entity. You must select *one* primary criterion from the following hierarchy. If you must combine them, weight them explicitly.
  1.  **Legal Termination:** Treaty abrogated, constitution suspended, entity legally dissolved.
  2.  **Functional Collapse:** Loss of monopoly on violence, inability to collect >50% of projected tax/revenue, loss of capital city control for >6 months.
  3.  **Regime/Coalition Change:** Ruling coalition replaced by extra-constitutional means (coup, revolution).
  4.  **Nominal Continuity:** Name and borders remain, regardless of function.

  **Adequate Answer:** A single sentence definition (e.g., "The union is considered dissolved if any member state legally vetoes a budget for two consecutive fiscal years.").
  **Stop Condition:** If the team cannot agree on a definition without resolving a normative political debate (e.g., "Is it a failure if they become illiberal?"), halt. Mark as **Value Dispute**. Return to commissioning body for clarification.
  **Reflexivity Check:** Does publishing this definition alter the behavior of the actors? (e.g., Defining "collapse" as a specific tax threshold might incentivize actors to miss that threshold by exactly one percent). If yes, flag as **Strategic Forecast**.

  > **Meta-Assessment:**
  > *Confidence:* High. Ambiguity is the primary source of forecasting error in political science.
  > *Weakest Link:* The **Reflexivity Check**. Analysts often underestimate how their definitions become focal points for the actors involved.

  ---

  ### Step 2: Sealed Reference Class Construction
  **Action:** Identify the reference class. Apply the **Sealed Envelope Test**:
  1.  List the criteria for inclusion (e.g., "All customs unions with >3 members").
  2.  Ask: "Could we have generated this exact list of cases on the day *before* the forecast period began, using only data available then?"
  3.  Exclude any case selected *because* we know how it ended (survivorship bias).

  **Adequate Answer:** A spreadsheet tab listing the cases, the start date, the end date (or "censored" if ongoing), and the specific data source used to identify them ex-ante.
  **Stop Condition:** If the class cannot be defined without referencing the outcome (e.g., "All unions that survived 20 years"), halt. Mark as **Tautology**.

  > **Meta-Assessment:**
  > *Confidence:* High. This directly addresses your friend's "hindsight bias" critique.
  > *Weakest Link:* **Data Availability**. Historical data on "functional collapse" is often reconstructed later, making true ex-ante identification difficult for older cases.

  ---

  ### Step 3: Stationarity and Sample Size Check
  **Action:**
  1.  Count $N$ (total cases).
  2.  Calculate Base Rate ($R$) = (Failures / $N$).
  3.  **Split Test:** Divide the class chronologically into two halves (e.g., pre-1945 / post-1945). Calculate $R_1$ and $R_2$.
  4.  **Drift Rule:** If $|R_1 - R_2| > 0.20$ (20 percentage points), the class is non-stationary. You must either:
      *   Discard the older half (justify why the newer context is the only valid one).
      *   Report two base rates (e.g., "Cold War rate vs. Post-Cold War rate").
  5.  **Small $N$ Rule:** If $N < 8$, do not quote a single percentage. Report the raw count and use Laplace's Rule of Succession for the anchor: $(Failures + 1) / (N + 2)$. Flag as **Low Confidence**.

  **Adequate Answer:** A stated Base Rate (or range), the $N$, and a note on stationarity (e.g., "Rate stable across periods" or "Drift detected, using post-1990 only").
  **Stop Condition:** If $N < 4$ even after widening the class, halt. Mark as **Insufficient Data**. Proceed to Step 5 (Inside View) only, with no base rate anchor.

  > **Meta-Assessment:**
  > *Confidence:* Medium-High. This satisfies the "stationarity" requirement without complex statistics.
  > *Weakest Link:* The **0.20 Threshold**. This is arbitrary. A skeptic could argue a 15% drift is fatal, or 30% is noise.

  ---

  ### Step 4: The Uniqueness Predicate Test
  **Action:** If the team claims "This case is unique" or "This case is different," you must:
  1.  Write the claim as a binary predicate (e.g., "Has nuclear weapons," "Has digital surveillance," "Is a maritime empire").
  2.  Apply this predicate blindly to every case in the Reference Class from Step 2.
  3.  Count how many historical cases match the predicate ($N_{match}$).
  4.  Calculate the Base Rate for the *matched* subset ($R_{match}$).

  **Adequate Answer:** "The predicate 'X' selects $N_{match}$ cases from history. Their failure rate was $R_{match}$."
  **Stop Condition:** If $N_{match} = 1$ (only the current case matches), the Base Rate is void. You are now doing pure expert judgment. You must state: "No historical analogue found. Forecast relies entirely on mechanism."

  > **Meta-Assessment:**
  > *Confidence:* High. This forces the "inside view" to be falsifiable.
  > *Weakest Link:* **Predicate Granularity**. Analysts can game this by making the predicate too specific ("Has a leader named Vladimir") to force $N=1$, or too vague ("Is a state") to force $N=All$. Requires reviewer oversight.

  ---

  ### Step 5: Inside View Adjustment
  **Action:** You may adjust the Base Rate ($R$ or $R_{match}$) based on mechanism/story.
  1.  **The Cap:** You may not move the probability more than 50% of the distance to the nearest bound (0% or 100%).
      *   *Example:* If Base Rate is 20%, you can adjust up to 60% (halfway to 100%), but not to 80%.
  2.  **The Justification:** For every 10 percentage points of adjustment, cite one specific causal mechanism that is *present* in this case and *absent* in the historical failures (or vice versa).
  3.  **The Constraint:** If Step 3 flagged "Low Confidence" ($N<8$), the Cap is reduced to 25% of the distance.

  **Adequate Answer:** Final Probability = Base Rate + Adjustment. List of mechanisms cited.
  **Stop Condition:** If the mechanism cited is unfalsifiable (e.g., "The spirit of the age is different"), revert to Base Rate.

  > **Meta-Assessment:**
  > *Confidence:* Medium. This is the most contentious step for "story-driven" forecasters.
  > *Weakest Link:* **The Cap**. Why 50%? It's an arbitrary constraint to prevent overconfidence, but a brilliant story *might* deserve more. However, history suggests stories are usually overrated.

  ---

  ### Step 6: Backtest Logging (Team Protocol)
  **Action:** This is not per forecast, but per quarter.
  1.  Take 5 past forecasts from 5+ years ago.
  2.  Mask the outcome.
  3.  Run Steps 1-5 again.
  4.  Compare the "Base Rate Only" prediction vs. the "Inside View Adjusted" prediction against the actual outcome.
  5.  Record Brier Scores for both.

  **Adequate Answer:** A quarterly memo: "Over the last 5 years, our Base Rate anchors had a Brier Score of X. Our Adjusted Forecasts had a Score of Y."
  **Stop Condition:** If Adjusted Scores are consistently worse than Base Rate Scores, the team loses permission to use Step 5 (Adjustment) for the next quarter.

  > **Meta-Assessment:**
  > *Confidence:* High. This is the only way to satisfy the skeptic colleague long-term.
  > *Weakest Link:* **Sample Size of Forecasts**. You only do 12/year. It will take years to get a statistically significant backtest.

  ---

  # Application to Live Questions

  ### Case 1: Large Continental Federal Union (Fiscal Pooling in 25 Years)

  *   **Step 1 (Outcome):** "Fiscal authority pooled" defined as: Central budget exceeds 15% of total union GDP, funded by direct taxation.
  *   **Step 2 (Reference Class):** "Continental Federal Unions." Cases: USA (1789), Germany (1871), USSR (1922), Brazil (1889), Australia (1901), EU (1993). $N=6$.
  *   **Step 3 (Stationarity/$N$):** $N=6$ is $<8$. **Low Confidence Flag.**
      *   Split: Pre-WWII vs. Post-WWII.
      *   Pre-WWII (USA, Germany, USSR, Brazil, Australia): 5 cases. 3 survived >25 years with fiscal pooling (USA, Australia, USSR*). 2 failed/changed (Germany, Brazil). Rate = 60%.
      *   Post-WWII (EU): 1 case. Ongoing.
      *   *Decision:* Use Laplace Anchor on the Pre-WWII set. $(3+1)/(5+2) = 4/7 \approx 57\%$.
  *   **Step 4 (Uniqueness):** Claim: "The EU is unique because it is voluntary."
      *   Predicate: "Union formed by voluntary treaty of sovereign states."
      *   Apply to Class: USA (Articles of Confederation -> Constitution: Voluntary?), Germany (Prussian hegemony: No), USSR (No), Brazil (No), Australia (Voluntary: Yes).
      *   $N_{match} = 2$ (USA, Australia).
      *   $R_{match}$: Both pooled fiscal authority >25 years. Rate = 100%.
      *   *Correction:* USA under Articles failed. Under Constitution succeeded. If we count "Union" as the current legal order, USA is 1/1. Australia 1/1.
  *   **Step 5 (Adjustment):** Base Anchor 57% (broad) or 100% (narrow).
      *   Mechanism: "No external military threat reduces centralization pressure."
      *   Adjustment: Move down from 100% anchor. Cap allows moving to 50%.
      *   **Final Forecast:** 65% probability of fiscal pooling.
  *   **Step 6 (Reflexivity):** Publishing this might encourage federalists to push harder. Flagged.

  **Result:** Usable number generated, but flagged Low Confidence due to $N$.

  ---

  ### Case 2: Multilateral Sanctions Coalition (Durability Post-Shock)

  *   **Step 1 (Outcome):** "Holds together" defined as: No member state publicly breaks sanctions regime for 3 years post-initial shock.
  *   **Step 2 (Reference Class):** "Multilateral Sanctions Regimes (UN or NATO led), 1945-2020."
      *   Search Hufbauer et al. dataset. Filter for >3 nations.
      *   $N \approx 40$ cases.
  *   **Step 3 (Stationarity):**
      *   Split 1945-1989 vs. 1990-2020.
      *   Cold War: High cohesion due to bipolar pressure. Failure rate ~30%.
      *   Post-Cold War: Multipolar, economic interdependence. Failure rate ~60%.
      *   *Drift Detected.* Discard Cold War cases. Use Post-Cold War only.
      *   New $N = 18$. Base Rate = 60% failure (40% success).
  *   **Step 4 (Uniqueness):** Claim: "Current sanctions are financial, not trade-based."
      *   Predicate: "Primary mechanism is SWIFT/Banking exclusion."
      *   Apply to Class (1990-2020): Iran, Russia, Venezuela. $N_{match} = 3$.
      *   $R_{match}$: 2 failed (cohesion broke), 1 ongoing. Rate = 0% Success (so far).
  *   **Step 5 (Adjustment):**
      *   Anchor: 40% (General Post-Cold War) vs 0% (Financial Specific).
      *   Mechanism: "Target has alternative payment systems (CIPS) now."
      *   Adjustment: Move up from 0%. Cap allows move to 50% of distance to 100% -> 50%.
      *   **Final Forecast:** 35% probability coalition holds.
  *   **Step 6 (Reflexivity):** High. Targets read these forecasts to gauge endurance.

  **Result:** Robust number generated. Stationarity check was crucial here.

  ---

  ### Case 3: Great Power Alliance Network (The "Unique" Case)

  *   **Step 1 (Outcome):** "Network persists" defined as: >80% of current bilateral defense treaties remain active and honored.
  *   **Step 2 (Reference Class):** "Great Power Alliance Networks."
      *   Cases: Concert of Europe (1815), Triple Entente (1907), Axis (1939), NATO (1949), Warsaw Pact (1955).
      *   $N = 5$.
  *   **Step 3 (Stationarity/$N$):** $N < 8$. **Low Confidence Flag.**
      *   Base Rate (Laplace): 3 Survived >25 yrs (Concert, NATO, Warsaw*), 2 Failed (Entente, Axis).
      *   Anchor: $(3+1)/(5+2) = 57\%$.
  *   **Step 4 (Uniqueness):** Claim: "This network is qualitatively new; no historical analogue."
      *   Predicate: "Global reach, nuclear umbrella, integrated command structure, liberal democratic ideology."
      *   Apply to Class:
          *   Concert: No (Regional, non-ideological).
          *   Entente: No (No integrated command).
          *   Axis: No (Ideology mismatch, no command).
          *   Warsaw Pact: No (Ideology mismatch).
          *   NATO: Yes (But this *is* the current case).
      *   $N_{match} = 1$ (The current case itself).
  *   **Step 5 (Adjustment):**
      *   **STOP CONDITION TRIGGERED.**
      *   Per Step 4: "If $N_{match} = 1$, the Base Rate is void."
      *   Per Step 3: "$N < 8$, Low Confidence."
      *   You cannot use the Outside View. You are forced to use the Inside View.
      *   Per Step 5: Without a Base Rate, the "Cap" does not apply, but the **Backtest Protocol** (Step 6) dictates that if your team's historical Inside View performance is worse than Base Rates, you should not issue a number.
  *   **Result:** The procedure gives you **nothing**.
      *   **Output:** "Insufficient Historical Basis. The claim of uniqueness, when operationalized, removes all comparative data. Forecast relies entirely on theoretical mechanism. We assign no probability number, only a scenario narrative."

  **Meta-Assessment on Case 3:** This is the answer your friend wants to hear. If the network is truly unique, statistics cannot help you. If you *must* give a number, you are lying. The procedure forces you to admit ignorance.

  ---

  ### Final Meta-Assessment of the Procedure

  **Confidence that this improves on your current state:** **High.**
  Your current method ("stories about why this case is different") is vulnerable to confirmation bias. This procedure forces you to quantify *how* different the case is before you are allowed to adjust the probability. It turns "unique" from a magic shield into a testable hypothesis.

  **The One Step I Am Least Sure About:** **Step 5 (The Adjustment Cap).**
  Limiting the inside view to a 50% shift is arbitrary. There *are* times when a mechanism is so dominant (e.g., nuclear deterrence) that it should override a historical base rate of war. However, without formal statistical training, your team will likely overestimate the strength of their mechanisms. The cap is a "bias tax." I am unsure if 50% is the right tax rate, but *some* tax is necessary to satisfy the skeptic.

  **Recommendation to the Skeptic Colleague:**
  Show them the **Backtest Protocol (Step 6)**. Tell them: "We are not claiming the base rate is truth. We are claiming it is the null hypothesis. If our stories cannot beat the null hypothesis in a blind backtest over 3 years, we will stop telling stories." That is a falsifiable commitment that respects their scientific rigor.
