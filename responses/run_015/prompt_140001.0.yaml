      *(Refining the "Inside View Adjustment")*: How to limit it without stats? A simple rule: "The inside view adjustment cannot exceed 50% of the distance between the base rate and the extreme (0% or 100%)." Or, "You must provide three historical analogues that match your 'unique' predicate to justify moving the anchor." Let's go with the "Three Analogues" rule or a "Max Shift" rule. The "Three Analogues" rule is more robust for historians. If you can't find 3 historical matches for your 'unique' feature, you can't move the anchor more than 10 percentage points.

      *(Refining Stationarity)*: How to check instability in a spreadsheet? Compare first half vs. second half of the time series. If the difference is > 2x, flag it.

