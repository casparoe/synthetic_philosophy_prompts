          *   **Outcomes:** $O_3=\$12k$, $O_2=\$11.5k$, $O_1=\$11k$.
          *   **$t_0$:** $V_0(12k, t_3) = 9,960$. $V_0(11k, t_1) = 9,900$. Prefers $O_3$.
          *   **$t_1$:** $V_1(12k, t_3) = 12,000 \times 0.75 = 9,000$. $V_1(11k, t_1 \text{ net}) = 11,000$. Prefers Amend.
          *   **$t_2$:** $V_2(11.5k, t_2) = 11,500$. $V_2(11k, t_1) = 11,000$. *Wait, needs reversal.*
          *   **Final Numbers:** Fee = $\$1,000$ each. $O_3=\$12k, O_2=\$11k, O_1=\$10k$.
          *   $t_0$: $12k \times 0.85 (t_3) = 10,200$. $10k \times 0.95 (t_1) = 9,500$. ($O_3 \succ O_1$).
          *   $t_1$: $12k \times 0.70 (2yr) = 8,400$. $10k \times 1.0 (now) = 10,000$. ($O_1 \succ O_3$).
          *   $t_2$: $11k \times 0.80 (1yr) = 8,800$. $10k \times 1.0 (now) = 10,000$. ($O_1 \succ O_2$).
  *   **Dominance Check:** By $t_0$ lights, $O_3$ (Value 10,200) dominates Final Outcome $O_1$ (Value 9,500). She is worse off than if the fee schedule did not exist (where she would keep $O_3$). By $t_2$ lights, she is content ($10k$ now is best).

  **Verdicts of Three Accounts**
  1.  **Sophisticated (Backward-Induction):** She is **exploited** but **rational**. She correctly anticipates that failing to pay at $t_1$ locks her into $O_3$, which she will dislike at $t_1$. She pays to preserve optionality, knowing it leads to a globally inferior outcome by $t_0$ standards. She should have bound herself at $t_0$, but couldn't.
  2.  **Resolute (Plan-Based):** She is **irrational**. She adopted a plan at $t_0$ (maximize value via $O_3$) and abandoned it without new information. She should have stuck to the $t_0$ election despite local preferences.
  3.  **Successive-Selves (Time-Slice):** She is **not exploited** and **rational**. Each self maximized its own utility given constraints. The $t_0$ self's loss is irrelevant to the $t_1$ self's rationality. There is no single agent to be "worse off."

  **Isolation of Features**
  *   **(a) Non-Stationarity:** If preferences were stationary (exponential), $t_1$ would value $O_3$ proportionally to $t_0$. If $O_3 \succ_0 O_1$, then $O_3 \succ_1 O_1$ (adjusted for time). She would not pay the fee at $t_1$. **This is the real work.**
  *   **(b) Impossibility of Binding:** If she could bind at $t_0$ (e.g., pay a penalty to forbid amendments), she would pay a small premium to avoid the $\$2,000$ loss. The pump requires her to be unable to commit. **This is enabling.**
  *   **(c) Unblockable Offers (Lock-in Clause):** If the $t_2$ window were open regardless of $t_1$ action, she could wait at $t_1$ (pay 0) and amend at $t_2$ (pay $\$1,000$). She would avoid the first fee. The "lock-if-you-don't-act" clause forces the first payment. **This is enabling.**

  **Defender's Response**
  A defender of declining impatience would argue that this case demonstrates **arbitrage costs**, not **irrationality**. The agent's preferences are valid at every time slice; the "loss" is merely the market price of satisfying a changing preference structure in a world with transaction costs. Just as a person with changing tastes in food pays more at a restaurant than a home cook, a person with changing time preferences pays a premium to institutions that facilitate intertemporal trade. The money pump shows that declining impatience is *expensive* in the presence of firms that monetize preference reversals, not that the preferences themselves violate rational norms. The "exploitation" is a category error: it treats the sequence of selves as a single entity that *should* have uniform preferences, rather than a succession of distinct evaluators whose rights to satisfy their own preferences are being taxed.
