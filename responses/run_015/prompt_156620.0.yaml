answer: |-
  ### Unstructured Brainstorming: Candidate Defeaters

  *   **The "Which Group?" Ambiguity.**
      *   *Idea:* The invariantist says "specify the experiment." But physical descriptions are language-laden. "Toss a straw" implies Euclidean symmetry to me, but does it to a robot? Does it imply time-translation invariance?
      *   *Status:* **Severe.** If the mapping from natural language/physical setup to transformation group is not unique, the "unique measure" claim fails.
      *   *Verdict:* Invariantist will dismiss as "incomplete specification." I count it as a vulnerability in the *application*, not the theory, but it makes the theory operationally fragile.

  *   **The Independence/Dependence Regress.**
      *   *Idea:* Symmetry fixes the joint measure only if we assume independence of components (e.g., $x$ and $y$ coordinates of the chord midpoint). But independence is not invariant under coordinate transformation. Uniform in $(x,y)$ is not uniform in $(r,\theta)$.
      *   *Status:* **Fatal.** This strikes at the core. If indifference requires a "Principle of Independence," that principle must select a coordinate system. Selecting a coordinate system is exactly what Invariantism claims to avoid (Bertrand's lesson).
      *   *Verdict:* Invariantist must concede this requires a supplementary rule (like MaxEnt).

  *   **Improper Priors on Non-Compact Groups.**
      *   *Idea:* Scale invariance on $\mathbb{R}^+$ gives $d\sigma/s$. Integral diverges. Cannot normalize.
      *   *Status:* **Moderate.** Invariantists accept improper priors or limits. But for "how many stars," this yields no probabilities.
      *   *Verdict:* Honest scope limitation, not a refutation, but limits utility.

  *   **Discrete Domains.**
      *   *Idea:* No uniform measure on $\mathbb{Z}$. Finitely additive densities exist but violate countable additivity.
      *   *Status:* **Moderate.** Invariantism is inherently continuous/geometric.
      *   *Verdict:* Scope limitation.

  *   **Empirical Mismatch.**
      *   *Idea:* A physical setup respects symmetries (visually) but yields a different distribution due to hidden dynamics (e.g., aerodynamics of the straw).
      *   *Status:* **Awkward.** Invariantist says "Symmetry was broken." Hard to falsify.
      *   *Verdict:* Immunizing strategy risk.

  *   **Borel-Kolmogorov Paradox.**
      *   *Idea:* Unique invariant measure on a sphere. Condition on a great circle (measure zero). Result depends on the limiting sequence (bands of latitude vs. meridians), not just the symmetry.
      *   *Status:* **Fatal to "Uniqueness".** Symmetry fixes the prior, but not the conditional inference without further experimental specification.
      *   *Verdict:* Shows Invariantism is a constraint on priors, not a logic of inference.

  ---

  ### 1. Ranking the Defeaters

  **1. The Coordinate Dependence of Independence (Fatal)**
  *   **The Defeater:** Invariantism demands a prior invariant under a group $G$. But to construct a joint distribution from marginals (or to define "random" placement of multiple objects), one must assume a dependence structure (typically independence). Independence is not a group-invariant property. If $X$ and $Y$ are independent and uniform in Cartesian coordinates, they are *dependent* in Polar coordinates. Since the group (e.g., Euclidean) acts transitively on the space, no coordinate system is intrinsically privileged by the group alone.
  *   **Invariantist Response:** They would likely dismiss this as resting on an incompletely specified problem. They would argue the "measure" is the primitive, not the independence of coordinates. The measure $dx\,dy$ is the invariant measure; $dr\,d\theta$ is not the invariant measure (it lacks the Jacobian $r$). Therefore, one does not "assume independence" in coordinates; one adopts the Haar measure.
  *   **My Verdict:** **Fatal.** This response smuggles in a preference for the Lebesgue density form over the parameter density form. It effectively says "Independence applies to the differential elements of the invariant measure," which is a substantive assumption about how ignorance distributes over *volume* rather than *parameters*. It collapses into a specific version of Maximum Entropy (MaxEnt) where the reference measure is the Haar measure. If Invariantism requires this extra rule, it is not self-sufficient.

  **2. The "Which Group?" Ambiguity (Severe)**
  *   **The Defeater:** Physical descriptions underdetermine the transformation group. "Toss a straw" suggests Euclidean invariance ($SE(2)$). But does it suggest affine invariance? Conformal? If the floor is finite, translation invariance is broken. If the straw has length $L$, scale invariance is broken. The "unique" measure depends on idealizations not present in the text.
  *   **Invariantist Response:** Dismiss as incomplete specification. "You must specify the idealizations."
  *   **My Verdict:** **Severe.** While technically a specification error, it renders the method impotent for real-world problems where idealizations are contested. It shifts the burden from "calculate the probability" to "argue for the symmetry group," which is often the harder epistemological problem.

  **3. Borel-Kolmogorov Conditioning (Fatal to Inference)**
  *   **The Defeater:** Even with a unique invariant prior (e.g., uniform on a sphere), conditional probabilities on measure-zero sets are not fixed by symmetry. They depend on the limiting sequence of sets used to define the condition.
  *   **Invariantist Response:** Concede. "The conditional question is ill-posed without specifying the limiting experiment."
  *   **My Verdict:** **Fatal to Scope.** It shows Invariantism generates priors but not posteriors without further mechanism specification. It cannot be a complete logic of uncertainty.

  **4. Improper Priors / Non-Compactness (Moderate)**
  *   **The Defeater:** Scale invariance on unbounded domains yields non-normalizable measures.
  *   **Invariantist Response:** Concede. Use limits or improper priors.
  *   **My Verdict:** **Moderate.** Mathematically manageable, but epistemologically unsatisfying for questions like "What is the probability the constant is $> 10$?"

  **5. Empirical Mismatch (Awkward)**
  *   **The Defeater:** Real experiments deviate from invariant predictions.
  *   **Invariantist Response:** Dismiss. "Hidden asymmetries."
  *   **My Verdict:** **Awkward.** Makes the view hard to falsify, bordering on vacuous.

  ---

  ### 2. The Dependence Structure Objection

  You have identified the soft underbelly of Invariantism. Symmetry fixes the *form* of the measure (e.g., $d\mu = dx\,dy$), but it does not fix the *factorization* required for multi-parameter problems unless the parameters are defined by the measure itself.

  **The Objection:** Consider two points on a circle. Rotation invariance implies the joint density $f(\theta_1, \theta_2)$ satisfies $f(\theta_1 + \alpha, \theta_2 + \alpha) = f(\theta_1, \theta_2)$. This allows $f = 1$ (independence) but also $f(\theta_1, \theta_2) = \delta(\theta_1 - \theta_2 - \pi)$ (diametrically opposite). Both are rotation-invariant. Both have uniform marginals.
  **Invariantist Necessity:** To rule out the diametric case, the Invariantist must invoke a **Principle of Insufficient Reason for Correlations**. They must assert that absent information, parameters should be independent *with respect to the invariant measure*.
  **The Collapse:** This is precisely the Maximum Entropy principle with the Haar measure as the reference prior. Jaynes' MaxEnt *is* Invariantism plus an entropy maximization rule. If Invariantism adds this rule, it ceases to be a distinct view about "indifference" and becomes a subset of Objective Bayesianism. Indifference does no independent work; it merely selects the reference measure for the entropy calculation.
  **The Regress:** You ask if independence is coordinate-dependent. Yes. If I assume independence in $(\theta_1, \theta_2)$, I get one result. If I transform to $(\alpha = \theta_1 - \theta_2, \beta = \theta_1 + \theta_2)$, independence in $(\alpha, \beta)$ is different.
  **Resolution:** The Invariantist must argue that independence applies to the *generators* of the group or the *orthogonal* coordinates of the manifold metric. But this requires a geometric structure (a metric) beyond the group structure. A group gives topology and measure; a metric gives distance and orthogonality.
  **Verdict:** Invariantism cannot stand alone. It requires a metric to define "independent directions." Once you add the metric, you have essentially specified the physical geometry of the experiment. The view collapses into: "Use the measure induced by the physical metric." This is no longer a principle of *ignorance*; it is a principle of *physical modeling*.

  **Does it reach the inscribed triangle?** Yes. The "random endpoints" method assumes independence of the two angles. The "random radius" method assumes independence of distance and angle. Invariantism (via Jaynes) selects the "random radius" (or straw toss) because it respects the full Euclidean group of the *plane*, not just the rotation group of the *circle*. But this selection relies on the assumption that the *experiment* is defined on the plane. If the experiment is defined on the circle (e.g., "pick two points on this wire ring"), the plane symmetries are irrelevant. Invariantism solves the paradox by changing the problem specification to the plane.

  ---

  ### 3. Empirical Exposure

  **Does it bind real experiment?**
  Only in the limit. A real floor is finite (breaks translation). Real straws have length (breaks scale). Real tosses have human bias (breaks rotation). The invariant measure is an attractor for a class of physical mechanisms, but not a unique predictor for any *specific* mechanism.
  **What has indifference bought?**
  It buys **robustness**. It tells you that if your mechanism is "sufficiently mixing" and respects the gross symmetries, the details don't matter. It is a stability claim, not a derivation claim.
  **Testable Prediction:**
  Yes. If you construct a mechanism that is rigorously translation and rotation invariant (e.g., a particle in a box with specular reflection and random initial conditions, in the limit of large box), the distribution of chord intersections *must* converge to the invariant measure prediction (1/2).
  **The 1/3 Counterfactual:**
  If a careful experiment yielded 1/3 from a setup that was demonstrably translation/rotation invariant (e.g., verified by checking the distribution of midpoints), Invariantism would be falsified.
  **The Invariantist Defense:**
  They would reply that the symmetry was broken somewhere unseen (e.g., the tossing mechanism couples position and angle). This is the **immunizing strategy**. Because symmetry is a claim about the *setup* and not just the *output*, one can always postulate a hidden asymmetry to save the theory.
  **Verdict:** Invariantism is empirically vacuous unless the symmetry is verified *independently* of the outcome distribution. If symmetry is inferred from the outcome, the theory is tautological. If symmetry is verified by physical inspection (e.g., measuring the floor, the straw, the air), then Invariantism is a physical derivation, not a logical principle of indifference.

  ---

  ### 4. Scope Limitation

  **The Integers and Cosmology:**
  Invariantism fails on discrete infinite sets (no countably additive uniform measure) and non-compact continuous sets (improper priors).
  **Is this honest modesty?**
  It is honest, but it admits that Invariantism is not a general theory of induction. It is a theory of **geometric ignorance**.
  **The Symptom:**
  The method has content only where the answer is implicit in the geometry. In cosmology ("What is the prior on the curvature constant $k$?"), the symmetry group is unclear. Is it scale invariant? Shift invariant? The Invariantist silence here reveals that the method cannot generate priors where the physical symmetries are unknown or disputed.
  **Verdict:** It is a symptom that the method is a **consistency check on physical models**, not a generator of priors for metaphysical questions. It works where physics is well-understood (coins, straws, gases) and fails where physics is speculative (cosmology, string landscapes). This limits its philosophical ambition significantly.

  ---

  ### 5. Verdict on Insulation

  **Risk of Vacuity:**
  High. The reply "the problem was ill-posed" is available for every counterexample. If every disagreement can be traced to a "hidden asymmetry" or "underspecified group," the theory predicts nothing that cannot be adjusted post-hoc.
  **Differentiation:**
  *   **vs. Subjectivism:** Invariantism claims constraints exist (symmetry). Subjectivism says only coherence matters.
  *   **vs. Mechanism-First:** Invariantism claims you don't need the full causal model, just the symmetries. Mechanism-first says you need the dynamics.
  *   **vs. MaxEnt:** Invariantism is MaxEnt with a fixed reference measure (Haar).
  **The Friendly Amendment:**
  Invariantism is best read as a **constraint on problem specification**, not a generator of probabilities. It says: "If you claim this problem has symmetry $G$, you are logically committed to measure $\mu$."
  **Amendment or Capitulation?**
  It is a **capitulation** to the claim that it solves the *epistemological* problem of induction. It does not tell you what to believe; it tells you that your beliefs must match your structural claims. It shifts the epistemological burden from "What is the probability?" to "What is the symmetry?" Since the latter is often just as difficult and underdetermined, Invariantism does not solve the paradox; it relocates it.

  ---

  ### 6. The Killer Case: Borel-Kolmogorov on the Sphere

  **The Setup:**
  A point is chosen "at random" on the surface of a unit sphere $S^2$.
  **Symmetries:** The rotation group $SO(3)$.
  **Group Properties:** Compact, Lie group, well-behaved.
  **Measure:** Unique normalized Haar measure (uniform surface area, $dA = \sin\phi\, d\phi\, d\theta$).
  **The Question:** What is the conditional probability distribution of the longitude $\theta$, given that the point lies on the prime meridian (a great circle, $\phi = 0$ or $\phi = \pi$)?
  **The Paradox:**
  1.  **Limiting Bands of Latitude:** Approach the meridian by bands $|\theta| < \epsilon$. As $\epsilon \to 0$, the conditional density is uniform in $\theta$.
  2.  **Limiting Wedges (Meridians):** Approach the meridian by wedges defined by angle from the pole. Due to the Jacobian $\sin\phi$, the density concentrates near the poles.
  **The Conflict:** Both limiting procedures respect the rotational symmetry of the sphere *globally*, but they yield different conditional distributions on the measure-zero set. The symmetry group and the invariant measure are fixed and unique. The answer is still not unique.
  **Invariantist Reply:** "You have not finished specifying the experiment. You must specify the *limiting procedure* by which the condition is realized. A 'measurement' of the meridian has finite precision; the shape of the error region matters."
  **Evaluation:**
  Is this a genuine answer or a refusal?
  It is a **refusal** to assign a probability to the question *as stated*. It asserts that conditional probability on a measure-zero set is not a property of the space and the measure alone, but of the *filtration* (the sequence of sub-sigma-algebras).
  **Why this breaks Invariantism:**
  Invariantism claims that specifying the symmetry fixes the probability. Here, the symmetry is fully specified ($SO(3)$ on $S^2$). The measure is fixed (Haar). Yet the probability (conditional) is not fixed.
  The Invariantist must appeal to *experimental details* (how the measurement is made) to resolve the ambiguity. But if experimental details are required to resolve the ambiguity, then **symmetry alone was insufficient**.
  **Conclusion:**
  In this case, the Invariantist's "you have not finished specifying the experiment" is an admission that Invariantism is not a logic of probability, but a constraint on physical modeling. It confirms that "indifference" cannot be disentangled from "mechanism." If the mechanism (the limiting process) determines the answer, then the symmetry was never the whole story. The paradox is not dissolved by symmetry; it is dissolved by **causal specification**. Invariantism, therefore, offers no advantage over a direct mechanism-first approach, other than mathematical elegance in the ideal limit.

  **Final Verdict:** Invariantism is a powerful consistency check for well-posed physical problems with clear continuous symmetries. It is not a foundational epistemology for uncertainty. It fails when symmetries are discrete, non-compact, or when conditional inference is required on measure-zero sets. Its claim to dissolve Bertrand-style paradoxes is valid only by redefining the problems as physical experiments rather than geometric puzzles—a move that concedes the core point to the mechanism-first view.
