  1. Brainstorm / closest neighbours
  No True Scotsman is the closest cousin, but that polices membership purity (‘no true Christian wars’), whereas your case polices domain membership (‘this isn’t morality at all’). Moving the Goalposts fits the shifting criteria, but usually applies to proof standards, not ontology. Cherry-picking ignores data; this accepts data but relabels it. Question-begging is involved, but it’s more structural. Theory-ladenness is inevitable—all observation is theorized—but this feels asymmetrical. It’s not just seeing theory in data; it’s applying different theoretical lenses to favorable vs. unfavorable data. So, generic fallacies miss the specific *categorical elasticity* at play. We need something that captures the boundary-drawing aspect specifically. It creates a heads-I-win, tails-you-lose dynamic regarding the evidence itself. Consequently, standard logical taxonomies don't quite capture the maneuver's specific topology.

  2. The carving
  Here’s the structure: Evidence E1 (divergence) supports Anti-Realism. Evidence E2 (convergence) supports Realism. The move is to classify E1 as ‘Moral’ and E2 as ‘Non-Moral’ (e.g., biological instinct) without independent justification. If cultures agree on care, it’s ‘mere cooperation’; if they disagree on purity, it’s ‘deep moral conflict.’ This creates a closed loop where ‘morality’ is defined exclusively as the locus of unresolvable disagreement. It isn’t just skepticism; it’s a definitional shield. The realist is barred from claiming convergence evidences objectivity because convergence is preemptively exiled from the moral domain. The category of ‘the moral’ becomes a waste-basket for whatever looks subjective, while objective-looking norms are reclassified as nature or prudence. This ensures the anti-realist never faces evidence they can’t explain away by semantic fiat. This effectively rigs the empirical sample. By excluding the most stable, universal norms from the dataset, the remaining data naturally looks unstable and culturally relative. This isn’t just interpretation; it’s data manipulation via categorization. The realist’s best evidence is vanished before the argument starts, leaving only the messy edges of moral life to represent the whole.

  3. Name and definition
  I’ll coin **Metaethical Gerrymandering**. Definition: The asymmetrical redrawing of conceptual boundaries around ‘moral discourse’ to insulate a metaethical position from counter-evidence. Boundary condition: It applies only when the reclassification lacks independent linguistic or philosophical justification and is driven solely by argumentative convenience. If you have a substantive theory (e.g., ‘morality is purely about welfare’) that excludes honor codes, that’s theory, not gerrymandering. The fallacy lies in the *ad hoc* shifting of the boundary to win the debate rather than clarify the concept. It turns metaethics into a game of boundary control rather than truth-seeking.

  4. Mirror cases and edges
  Realists do the reverse: they call divergent norms ‘errors’ or ‘non-moral customs’ to preserve convergence as true morality. With evolutionary debunking, anti-realists say convergence is adaptive (non-truth-tracking); realists say convergence tracks truth. The edge blurs into ordinary theory-ladenness when a philosopher has a consistent first-order theory (e.g., utilitarianism) that consistently excludes certain norms. Gerrymandering is inconsistent: it treats similar norms differently depending on whether they help or hurt the metaethical conclusion. It’s the inconsistency of classification, not the classification itself, that marks the boundary. If the classification rule applies evenly across favorable and unfavorable data, it’s legitimate theory. If it swings based on utility, it’s gerrymandering. This distinguishes it from simple disagreement about what morality *is*.

  5. Bottom line
  You’re not seeing faces in clouds; this is a robust rhetorical pattern. It’s a defensive maneuver that stalls dialectical progress by making the concept of ‘morality’ unfalsifiable. Calling it out forces the interlocutor to justify their classification criteria independently of their metaethical conclusion. Until then, the debate is rigged. It’s a genuine obstacle to progress because it prevents shared data from ever settling the dispute. Recognizing it allows you to demand consistent classification rules before engaging the substantive metaethical claims.
