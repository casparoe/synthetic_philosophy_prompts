      *(Self-Correction during drafting)*: Wait, look at the Macro case. "Models repeatedly fail and get patched... science, though only barely." This allows patching. The ML case says "nothing in it to give up." The Materials case says "nothing is abandoned; the model is retrained." Is retraining "patching" or "nothing to give up"?
      *   *Distinction:* In Macro, the *models* are argued about. In ML/Materials, the *model* is a tool. The "patching" in Macro implies theoretical debate. The "retraining" in ML implies parameter adjustment without theoretical commitment. This is a crucial nuance. The Materials case is closer to ML than Macro.

