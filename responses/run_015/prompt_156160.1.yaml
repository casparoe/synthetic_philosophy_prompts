      *   *Why:*
          *   If she says "Science" to this variant: She values Openness/Theory over pure Reliability (confirming the ML Hospital precedent).
          *   If she says "Not Science" to this variant: She values Reliability/Success above all (contradicting ML Hospital precedent, aligning with a pure instrumentalist view).
          *   *Better Variant:* **Open Black Box.** Company releases weights/data. It's still a deep net (no intelligible theory), but community can audit it.
          *   *If "Science":* Community Access is the key (Mertonian).
