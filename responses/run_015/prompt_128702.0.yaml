prompt: |-
  Hey — I need a teaching plan here, not an explanation of the topic itself. Context: I'm a third-year PhD student and I'm TAing the Freedom and Responsibility module again, and I've got one 60-minute section next Thursday with about a dozen first-years, a whiteboard, no slides, and a bit of a cold, so ideally something that doesn't require me to talk straight through the hour. In Monday's lecture they were given the principle of alternative possibilities — roughly, you're morally responsible for what you did only if you could have done otherwise — and they were assigned the classic Frankfurt case, the one where the intervener would have stepped in if the agent had started to show some prior sign of deciding differently, but never actually does anything. Last year this exact section went badly: half the room left saying so Frankfurt is just a determinist with extra machinery, the other half said the case is cheating because the guy is obviously being controlled, and nobody could tell me what the case was even supposed to be an argument against. So plan the hour for me.

  Concretely, what I want: what has to be on the board before the case can do any work at all — is PAP best sold to them as an explanation of why blame is fair, or just as a necessary condition on it, and does the gap between could-have-done-otherwise as a bare counterfactual and could-have-done-otherwise as a genuine ability (something the agent has access to, something robust) need to be in place first? Why does the case land differently depending on which of those is up? Then the order of the pieces and what depends on what. And I want one case to carry the whole session, and I'd rather not just re-run the one from the reading: so tell me what the carrying example has to have (a reliable prior sign, an intervener who never fires, a decision that is genuinely the agent's own) and what it must not have (a threat, a gun, a coercive offer, anything that reads as the agent being pushed rather than bypassed), and why each of those features or absences matters.

  Relatedly, I've been playing with two variants of my own and can't decide whether either belongs in the hour. Call the first the leaky intervener: the device works only most of the time, so if the agent had tried to do otherwise he'd have had, say, a forty percent chance of actually getting away with it — nothing forces the outcome, there's just no guarantee. Call the second the output-only case: the device leaves the deciding and the willing completely untouched and only redirects the bodily movement at the very last moment, so the agent really does decide and try to do otherwise and simply doesn't get there. Is either of these pedagogically useful, or do they just muddy the water? If one is worth using, where exactly does it go in the sequence and what is it supposed to make them notice — that PAP needs a robust alternative rather than any alternative at all, that the alternative has to be an alternative willing rather than an alternative outcome, both, or something I haven't thought of?

  Then the failure modes, which is the part I care most about. I can guess at a few: that this is determinism in disguise; that the device causes the action despite doing nothing; that the agent could still have willed or tried otherwise, or at least could have failed to show the sign; that Frankfurt just helps himself to the intuition that the agent is responsible, so the case begs the question; and, from the one physics student who'll definitely be there, whether an infallible prior sign is even physically possible and whether it matters if it isnt. Which of these will actually come up, in what order will they come up, and at which point in the sequence should I head each one off rather than answer it? Which single one should I deliberately let hang for a bit? I also want one question to end on that tells me whether they've grasped the structure of the dialectic rather than just whether they've been persuaded, plus an explicit list of what I should openly refuse to get into at this level — reasons-responsiveness, the actual-sequence stuff, the whole secondary literature on whether the case succeeds — and how to say no without sounding like I'm dodging.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **User:** 3rd-year PhD student, TAing "Freedom and Responsibility."
      *   **Task:** Create a 60-minute teaching plan (not an explanation of the topic).
      *   **Context:** 12 first-years, whiteboard only, no slides, TA has a cold (needs low talking, high student engagement).
      *   **Previous Content:** Lecture covered Principle of Alternative Possibilities (PAP). Reading was the classic Frankfurt Case (intervener, prior sign, never acts).
      *   **Previous Failure:** Students thought it was just determinism, or cheating/coercion, or didn't know what it argued against.
      *   **Specific Requirements:**
          *   What *must* be on the board before the case works (PAP formulation, ability vs. counterfactual).
          *   Structure/Order of the session.
          *   One carrying example (not the reading's exact one, but needs specific features/absences).
          *   Evaluation of two proposed variants ("Leaky Intervener" vs. "Output-Only").
          *   Failure Modes: Predict specific objections, order of appearance, when to head off vs. let hang.
          *   Closing: One diagnostic question (structure vs. persuasion).
          *   Boundaries: Explicit list of topics to refuse (reasons-responsiveness, actual-sequence, etc.) and how to say no.

  2.  **Deconstruct the Philosophical Problem (for the Plan):**

      *   *Goal:* Show that PAP is false (or at least problematic) using a Frankfurt-style case (FSC).
      *   *PAP:* Moral Responsibility (MR) $\rightarrow$ Could Have Done Otherwise (CHDO).
      *   *FSC Strategy:* Construct a case where MR is intuitive, but CHDO is false (due to the counterfactual intervener).
      *   *Key Distinction:* The intervener must not *cause* the action in the actual sequence. The agent must act on their own. The intervener only ensures the outcome *if* the agent tries to deviate.
      *   *The "Flicker" Strategy:* Students often argue there's still *some* alternative (e.g., deciding to try, showing the sign). The case needs to close this or acknowledge it.
      *   *Determinism Worry:* Students conflate the counterfactual controller with causal determinism. Need to distinguish "could not have done otherwise because of laws of nature" vs. "could not have done otherwise because of a backup mechanism."

  3.  **Drafting the Board Work (Pre-requisites):**

      *   Need to formalize PAP clearly. Is it a condition for *blame* or *responsibility*? Let's stick to Moral Responsibility (MR) as the broader category.
      *   Need to distinguish types of "Could Have Done Otherwise."
          *   *Simple Counterfactual:* If things were different, you would have done differently.
          *   *Robust Ability:* You have the power/capacity right now to choose differently.
      *   *Why it matters:* Frankfurt attacks the claim that MR *requires* the Robust Ability. If the Intervener removes the Robust Ability but leaves the Actual Sequence untouched, do we still blame?

  4.  **Designing the Carrying Example:**

      *   *Constraint:* Not the reading's exact case (usually Jones/Black). Let's use a voting scenario or a button press. Voting is relatable.
      *   *Features Needed:*
          *   Agent (Alice).
          *   Decision (Vote Yes).
          *   Intervener (Device/Person).
          *   Prior Sign (Blush, neural spike).
          *   Counterfactual Intervention (Only if sign indicates 'No').
          *   Actual Sequence (Alice votes 'Yes' on her own, Device does nothing).
      *   *Features to Avoid:*
          *   Threats/Coercion (Undermines voluntariness).
          *   Direct Causation (Device makes her move).
          *   Obvious Determinism (Don't mention physics/laws of nature yet).
      *   *Selection:* "The Neural Vote." Alice is voting on a referendum. A chip monitors her brain. If she starts to lean 'No', it forces 'Yes'. She leans 'Yes' naturally. Chip stays off.

  5.  **Evaluating the Variants:**

      *   *Leaky Intervener (40% chance of failure):*
          *   *Pros:* Highlights that PAP requires *guaranteed* inability.
          *   *Cons:* Confuses the issue. If there's a 40% chance she could do otherwise, PAP isn't falsified. It weakens the counterexample.
          *   *Verdict:* **Discard.** It gives students an out to save PAP.
      *   *Output-Only (Redirects movement, not will):*
          *   *Pros:* Distinguishes between "doing otherwise" (action) and "willing otherwise" (intent). Addresses the "Flicker of Freedom" objection.
          *   *Cons:* Can get technical.
          *   *Verdict:* **Keep as a closer/extension.** It helps address the "she could have *tried* to do otherwise" objection. Use it *after* the main case fails to convince the skeptics.

  6.  **Sequencing the Hour (60 mins):**

      *   *0-10:* Board Setup & PAP Definition. (Low talking, writing while they settle).
      *   *10-25:* The Case (Silent Handout or Board Walkthrough). Small group discussion.
      *   *25-40:* Harvesting Objections (The "Failure Modes").
      *   *40-50:* The "Output-Only" Variant (To tighten the noose).
      *   *50-60:* Closing Diagnostic & Boundaries.

  7.  **Addressing Failure Modes:**

      *   *Determinism in Disguise:* Will come up early. Head off by stipulating indeterminism in the actual sequence.
      *   *Device Causes Action:* Will come up during case analysis. Clarify "Counterfactual" vs. "Actual."
      *   *She could have tried (Flicker):* Will come up after the main verdict. Use the Output-Only variant here.
      *   *Begging the Question:* Will come up at the end. Let this hang. It's the deepest philosophical worry.
      *   *Physics Student (Prior Sign Impossibility):* Will come up early. Bracket it as "Science Fiction Stipulation."

  8.  **Refining the "Cold/No Talk" Constraint:**

      *   Use "Think-Pair-Share."
      *   Write instructions on the board.
      *   Use the whiteboard for the dialectic map, not just notes.
      *   Minimize lecturing.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Board Work:* Need to define PAP clearly. $MR \rightarrow AP$ (Alternative Possibilities).
      *   *The Example:* "The Voting Chip."
      *   *Variants:* Drop Leaky. Use Output-Only to address the "Flicker."
      *   *Failure Modes:* Map them to specific times.
      *   *Boundaries:* List "Reasons-Responsiveness," "Actual Sequence vs. Regulative Control," "Source Incompatibilism."

  10. **Final Review against Constraints:**

      *   *Teaching Plan?* Yes.
      *   *No Topic Explanation?* Yes, focused on pedagogy.
      *   *Board Prerequisites?* Included.
      *   *Example Features?* Specified.
      *   *Variants Evaluated?* Yes.
      *   *Failure Modes?* Predicted and managed.
      *   *Closing Question?* Diagnostic.
      *   *Boundaries?* Explicit script.

  11. **Polishing the Tone:**

      *   Keep it professional, peer-to-peer (PhD to PhD).
      *   Acknowledge the "cold" constraint (low vocal load).
      *   Ensure the philosophical precision matches a 3rd-year PhD's level (don't dumb it down, but scaffold for 1st years).

  **(Self-Correction during drafting):** I initially thought about having them read the case in class. But they read it for homework. Better to reconstruct it on the board together to ensure everyone has the *same* version, avoiding "that's not how I read it" disputes. I need to make sure the Board Work section is very specific about *what* definitions to write.
  Also, the "Leaky Intervener" is definitely a trap. If there's a chance she could do otherwise, PAP stands. I need to explain *why* it's bad clearly.
  The "Output-Only" is good for the "Flicker" objection (she could have decided otherwise, even if she couldn't have voted otherwise). I need to place this carefully so it doesn't confuse the main point.
  The "Begging the Question" objection is the hardest. If they think Frankfurt assumes what he proves (that she's responsible), the case fails. I should advise the TA to let this one hang because solving it requires the literature they aren't ready for (actual-sequence views).

  12. **Final Polish:** Check timing. 60 minutes is tight. Ensure the "Boundaries" section gives a script so the TA doesn't ramble while sick.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a 60-minute teaching plan designed for low vocal load, high student engagement, and precise philosophical scaffolding.

  ### I. Board Work: Pre-requisites (First 10 Minutes)
  *Do not start the case until this is on the board. Write this while students settle; it saves your voice and ensures shared terminology.*

  **Left Panel: The Target**
  1.  **PAP (Principle of Alternative Possibilities):**
      *   *Formulation:* "An agent is morally responsible for an action only if they could have done otherwise."
      *   *Logical Form:* $MR \rightarrow CHDO$ (Moral Responsibility *requires* Could Have Done Otherwise).
      *   *Status:* Is this a definition? A necessary condition? (Write: **Necessary Condition**).
  2.  **The Frankfurt Goal:**
      *   To show a case where: **MR is True** AND **CHDO is False**.
      *   If successful: PAP is False.

  **Center Panel: The Distinction (Crucial for your "Ability vs. Counterfactual" query)**
  *   **Type A: Bare Counterfactual:** "If the situation had been different, I would have done differently." (Compatible with Determinism).
  *   **Type B: Robust Ability:** "I have the power/capacity right now, in this exact situation, to choose differently." (Incompatible with Determinism).
  *   *Note to class:* Frankfurt attacks the claim that MR requires **Type B**. If the Intervener removes Type B but leaves the action untouched, do we still blame?

  **Right Panel: The Rules of Engagement**
  *   **Stipulation 1:** The Intervener never acts in the actual sequence.
  *   **Stipulation 2:** The Agent is not coerced/threatened.
  *   **Stipulation 3:** We are bracketing physics (assume the tech works).

  ---

  ### II. The Carrying Example: "The Voting Chip" (10–25 Minutes)
  *Do not use the reading's Jones/Black case. Re-build it on the board to avoid "that's not how I read it" disputes.*

  **The Setup (Write/Diagram):**
  *   **Agent:** Alice.
  *   **Action:** Voting 'Yes' on a referendum.
  *   **Mechanism:** A chip in Alice's brain monitors a "prior sign" (e.g., a specific neural spike pattern that occurs 1 second before a 'No' decision).
  *   **Intervener:** If the sign appears, the chip forces a 'Yes' vote.
  *   **Actual Sequence:** Alice deliberates, chooses 'Yes' on her own, votes 'Yes'. The chip detects no 'No' sign. The chip does **nothing**.

  **Required Features (Why they matter):**
  *   **Reliable Prior Sign:** Needed to make the inability to do otherwise *counterfactual* rather than *causal*. If the sign isn't reliable, the intervener might act in the actual sequence (violating Stipulation 1).
  *   **Intervener Never Fires:** Essential to isolate the *source* of the action. If it fires, it's coercion. If it doesn't, the action is hers.
  *   **No Threats/Guns:** Must avoid standard excusing conditions. If Alice feels threatened, she isn't responsible for *other* reasons. We need to test PAP, not Coercion.

  **Activity (Silent/Pair):**
  *   *Prompt on Board:* "In pairs: Is Alice morally responsible for the Yes vote? Why/Why not? (3 mins)"
  *   *Harvest:* Get 3 "Yes" and 3 "No" answers on the board. Do not adjudicate yet.

  ---

  ### III. Variant Evaluation (25–35 Minutes)
  *You asked about your two variants. Here is the verdict:*

  **1. The Leaky Intervener (40% failure rate)**
  *   **Verdict:** **DO NOT USE.**
  *   **Why:** It saves PAP. If there is a 40% chance she could have succeeded in doing otherwise, then she *could* have done otherwise (on a probabilistic reading). It gives students an easy escape hatch to preserve the intuition that AP is required. It muddies the water between *risk* and *ability*.

  **2. The Output-Only Case (Redirects movement, not will)**
  *   **Verdict:** **USE AS A TIGHTENER.**
  *   **Placement:** Introduce this *only after* students raise the "Flicker of Freedom" objection (see Failure Modes below).
  *   **Pedagogical Utility:** It forces a distinction between **Alternative Action** and **Alternative Willing**.
  *   **How to run it:** "Okay, suppose the chip doesn't force the vote. Suppose Alice decides 'No', tries to vote 'No', but the chip hijacks her arm and marks 'Yes'. She willed 'No', but the world got 'Yes'."
  *   **What it notices:** It tests whether PAP requires the ability to do otherwise *in the world* or just the ability to *try/will* otherwise. If they say she's *not* responsible here, but *was* responsible in the first case, they have isolated that **Actual Sequence Volition** is what matters, not the alternative possibility.

  ---

  ### IV. Failure Modes: Prediction & Management (35–50 Minutes)
  *Based on last year's crash, here is the order of objections and how to handle them without lecturing.*

  **1. "This is just Determinism in disguise."**
  *   **When:** Immediately upon hearing the case.
  *   **Management:** **Head off pre-emptively.** Point to Stipulation 3 on the board. "For this hour, assume the actual sequence is indeterministic. The chip is a *backup*, not a cause. We are testing the *backup*, not the physics."
  *   **Why:** If they think it's hard determinism, they reject MR for the wrong reason.

  **2. "The device causes the action despite doing nothing." (Causal Oomph)**
  *   **When:** During the Pair Harvest.
  *   **Management:** **Draw the Timeline.** Draw two lines.
      *   Line 1 (Actual): Agent -> Decision -> Vote. (Chip: Off).
      *   Line 2 (Counterfactual): Agent -> Sign -> Chip -> Vote.
      *   Ask: "In Line 1, where is the causal link from Chip to Vote?" (There isn't one).
  *   **Why:** Visualizing the causal gap stops the "invisible hand" worry.

  **3. "She could have willed/tried otherwise." (The Flicker)**
  *   **When:** After you establish they think she is responsible.
  *   **Management:** **Deploy the Output-Only Variant.** "Okay, suppose she wills 'No', but the arm moves 'Yes'. Is she responsible then?"
      *   If they say **No**: Then in the original case, she *is* responsible because her *will* was 'Yes'. The lack of alternative *action* doesn't matter.
      *   If they say **Yes**: Then PAP is definitely dead (she's responsible even if she couldn't move otherwise).
  *   **Why:** This isolates the "Robust Ability" requirement.

  **4. "The Prior Sign is physically impossible." (The Physics Student)**
  *   **When:** Early.
  *   **Management:** **Bracket it.** "Philosophy often uses science fiction to test concepts. If the concept fails even in the sci-fi case, the principle is weak. Let's grant the tech for the sake of the argument."
  *   **Why:** Don't let empirical possibility block conceptual analysis.

  **5. "Frankfurt just assumes she's responsible (Begging the Question)."**
  *   **When:** Late in the discussion.
  *   **Management:** **LET THIS HANG.**
  *   **Why:** This is the strongest objection (the "Dilemma Defense"). It requires distinguishing between *intuition pumping* and *argument*.
  *   **Action:** Write this on the board under "Unresolved." Say: "This is the million-dollar objection. If you need to *already believe* PAP is false to accept the case, does the case prove anything? Keep this in mind for the essay."
  *   **Why:** It validates the smart skeptics without derailing the lesson for the rest.

  ---

  ### V. Closing & Boundaries (50–60 Minutes)

  **The Diagnostic Question (Structure vs. Persuasion)**
  *   Do not ask: "Do you agree with Frankfurt?" (This measures persuasion).
  *   **Ask:** "If the Frankfurt Case works, what breaks? Does it break **Determinism**, or does it break **PAP**?"
  *   *Correct Answer:* It breaks PAP. (Many students think Frankfurt proves Determinism is compatible with Responsibility. It doesn't; it tries to sever Responsibility from Alternative Possibilities regardless of Determinism).
  *   *Method:* Show of hands. If half say Determinism, you know they missed the dialectic structure.

  **The Boundaries (Script for your Cold)**
  *   You need to stop them from dragging in literature you can't cover. Write this on the board under **"Out of Scope for Section"**:
      1.  **Reasons-Responsiveness:** (We aren't solving *what* grounds responsibility today).
      2.  **Actual-Sequence vs. Regulative Control:** (We are using these terms, but not defining the metaphysics).
      3.  **Source Incompatibilism:** (We are not debating whether the *source* must be undetermined).
  *   **How to say it:** "These are the correct next steps in the literature. If you are interested in them, see me in office hours. Today, we are strictly testing the logical link between Responsibility and Alternative Possibilities. If your objection relies on [Reasons-Responsiveness], write it down for the essay, but let's park it for now."

  ### Summary of Flow for Your Notes
  1.  **0-10:** Board Work (PAP Def, Distinctions, Stipulations).
  2.  **10-25:** Voting Chip Case (Diagram, Pair Work, Harvest).
  3.  **25-35:** Objection Handling (Determinism, Causation, Physics).
  4.  **35-45:** Variant (Output-Only) to kill the "Flicker" objection.
  5.  **45-55:** The "Begging the Question" objection (Let it hang).
  6.  **55-60:** Diagnostic Question (PAP vs. Determinism) & Boundaries.

  **TA Survival Tip:** Since you have a cold, use the "Silent Board" technique. When a student asks a complex question, write the core of it on the board before answering. This forces the room to focus on the text, saves you from repeating yourself, and gives you 15 seconds to breathe/think.
