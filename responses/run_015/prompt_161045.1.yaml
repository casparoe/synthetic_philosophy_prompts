answer: |-
  **Project Title:** The Anatomy of Greed: A Functional Taxonomy of Reductionist Explanations

  **Statement of the Question**
  Does the distinction between "cranes" (ground-up mechanisms) and "skyhooks" (top-down miracles), when refined by a condition of *traceable lifting capacity*, yield a non-retrospective diagnostic tool for evaluating explanatory claims? Specifically, can we distinguish three separable failure modes of reduction—level-skipping, capacity shortfall, and borrowed lift—such that identifying them predicts explanatory controversy independent of the eventual scientific consensus?

  **Background and Problem**
  The standard philosophical injunction against "greedy reductionism" relies on the metaphor that explanations must be built from below (cranes) rather than suspended from above (skyhooks). However, a potent objection persists: this distinction is merely retrospective. On this reading, any mechanism eventually discovered is ex post facto labelled a crane, while unexplained phenomena are temporarily labelled skyhooks. Consequently, the ban on skyhooks becomes a tautological rule for description rather than a substantive claim about the world, and "greedy" becomes a pejorative for reductions one antecedently dislikes.

  If this objection holds, the vocabulary does no normative work; it merely tracks the current state of knowledge. My hypothesis is that the objection succeeds only because the standard formulation conflates distinct structural flaws in reductionist arguments. By defining a crane not merely as a mechanism, but as one whose lifting capacity is *traceable* through its organized parts without presupposing the explanandum, we can separate the charge of greediness into three distinct categories:
  1.  **Level-skipping:** The mechanism omits intervening causal rungs.
  2.  **Capacity shortfall:** The mechanism is real but insufficient to support the weight of the phenomenon.
  3.  **Borrowed lift:** The reducing vocabulary covertly reimports the properties it aims to explain.

  **Methodology and Work Plan**
  The project will proceed over four months, aiming for a final dissertation of approximately 8,000 words.

  *Month 1: Formalization.* I will rigorously define the "traceability condition" and the three failure modes. The goal is to produce operational criteria that allow an observer to categorize a reductionist claim *before* knowing its ultimate scientific fate.
  *Constraint on Metaphysics:* This month includes a strict boundary condition regarding the metaphysics of "levels." If the definition of a "level" requires a general theory of stratification, the project is swallowed. I will treat levels as pragmatic descriptors of causal granularity specific to the case studies. If I spend more than two weeks defining "level" abstractly, I will pivot to treating it as a variable within the cases themselves.

  *Month 2: Case Study A (Consensus Success).* I will analyze a reduction widely accepted as successful (e.g., the molecular basis of heredity or phototransduction). The taxonomy must classify this as a valid crane. If the taxonomy labels a successful reduction as "greedy" (e.g., accusing it of level-skipping where science sees no need for intervening rungs), the taxonomy is falsified.

  *Month 3: Case Study B (Contested Reduction).* I will analyze a reduction where the "greedy" charge is active and unresolved (e.g., neural correlates of consciousness or evolutionary psychology accounts of morality). I will apply the taxonomy to determine if the controversy stems from a specific failure mode (e.g., borrowed lift) rather than general anti-reductionist sentiment.

  *Month 4: Synthesis and Stress-Testing.* I will compare the diagnoses. The critical test is whether the taxonomy identifies *why* Case B is contested in a way that Case A is not. I will also solicit feedback from working scientists to see if the distinctions map onto their intuitive objections to bad explanations.

  **Justification of Approach**
  This approach avoids three unproductive alternatives. First, it does not ask "Is reductionism true?", a metaphysical quagmire that yields little normative guidance. Second, it is not merely a survey of how labels are deployed, which would confirm the retrospective objection rather than answer it. Third, it avoids a general metaphysics of levels, which threatens to consume the fellowship term without producing a diagnostic tool. By focusing on the *structure of the argument* rather than the *ontology of the world*, this project tests whether the vocabulary regulates inquiry or merely describes its history.

  **Deliverable**
  The primary output will be a "Diagnostic Protocol for Reductionist Claims." This will be a usable checklist for philosophers and scientists to assess whether a proposed reduction is structurally sound or suffers from a specific, identifiable form of greediness. It transforms the crane/skyhook distinction from a rhetorical weapon into an analytical instrument.

  **Conditions for Failure**
  I offer an honest assessment of the risks. The project fails if:
  1.  **Collapse:** The three failure modes prove to be logically equivalent or reducible to a single underlying error.
  2.  **Vacuity:** The "traceability condition" turns out to be purely verbal, such that any reduction can be relabelled to satisfy it by adjusting the description of the parts.
  3.  **Lethality:** Historical analysis shows that every successful reduction either trivially satisfies the condition (making it useless) or flagrantly violates it (making it an obstacle to progress).

  If any of these obtain, I will conclude that the friend's retrospective objection was correct: the vocabulary is a historical record, not a methodological tool. Acknowledging this negative result is a valid and necessary outcome of the fellowship.
