answer: |-
  Hey, I have been thinking about our argument from last night and you actually raised a really sophisticated point about the indexicality of evaluative language and the incommensurability of moral frameworks across time. It is a position that aligns with some strong currents in postmodern historiography and metaethics, but since you asked for the defeaters ranked from fatal to merely awkward so you can see where you might be insulating yourself, I will lay those out for you in order of severity while keeping in mind your specific questions about translation and unfalsifiability. The most fatal objection to your hard presentism is the problem of self-refutation, because if you claim that all historians are unavoidably bound by the standards of their own time such that they cannot recover past frameworks without contamination, you must ask whether your own claim is subject to that same limitation. If your argument is only true relative to our current philosophical moment then it loses its universal force and becomes just another expression of our time rather than a truth about history itself, but if you claim it is a timeless truth about historiography then you have contradicted your own premise that no one can escape their temporal context. This is the kind of logical trap that usually breaks a philosophical position entirely because it undermines the ground you are standing on to make the argument in the first place.

  A second fatal flaw is that your view risks collapsing the distinction between history and contemporary philosophy by making the past unintelligible as a distinct place. If diachronic translation is impossible without total contamination then we cannot actually recognize difference when we see it, because recognizing something as different requires a neutral enough ground to compare the two frameworks. There are conceptual results in the philosophy of language, specifically from Donald Davidson, that argue against this kind of radical incommensurability by suggesting that translation requires a principle of charity where we must assume substantial agreement to even identify disagreement. If you cannot translate past evaluative schemes without presentist contamination then you cannot identify them as past schemes at all, you just see mirrors of yourself, which effectively destroys the possibility of historical inquiry since there is nothing left to study but the present. Moving to less catastrophic but still serious defeaters, there is the empirical evidence from the Cambridge School of intellectual history where scholars like Quentin Skinner have argued that we can recover past intentions and linguistic contexts without necessarily judging them by our lights. While they might not achieve perfect purity, their work suggests that contamination is a matter of degree rather than an absolute barrier, and there are historical episodes like the debate over Athenian democracy where historians manage to explain why slavery was acceptable to them without simply condemning it as immoral, showing that descriptive recovery is possible even if normative judgment is not.

  You also asked if the unfalsifiability of your view is a problem given that any check is already presentist, and the answer is yes because it makes your claim dogmatic rather than critical. If no evidence could ever count against your view because any attempt to verify it is dismissed as presentist contamination then you have built a fortress that protects you from being wrong but also prevents you from being right in any meaningful sense. This is where you should honestly concede that while moral judgment is likely inescapably presentist because we cannot help but use our own values to evaluate actions, the understanding and description of past moral frameworks are not subject to the same hard limit. You can keep the insight that we judge the past by our standards but you should drop the claim that we cannot understand their standards on their own terms, because conflating judgment with understanding is where your argument becomes vulnerable to the defeaters I just mentioned. What you can safely dismiss is the assumption held by some contextualists that they are completely free of presentism, because obviously their choice of topics and methods are influenced by contemporary interests, so you do not need to defeat a straw man of pure objectivity to make your point about the inevitability of some bias.

  There are historical episodes that specifically break the hard presentist view, such as the recovery of non-Western kinship systems where anthropologists and historians had to invent entirely new categories to describe relationships that did not exist in their own framework, proving that translation can expand our vocabulary rather than just imposing our existing one. If your view were true then these scholars would have just projected Western family structures onto everyone else, but instead the encounter with the past often changes our present standards rather than just applying them, which suggests a dialogue rather than a monologue. So while you should hold onto the idea that we cannot fully escape our skin when it comes to final moral verdicts, you should concede that the process of historical translation is robust enough to prevent total solipsism. The merely awkward implication you will have to live with if you soften your view is that there is no clean line between understanding and judging, which means historians always have to be reflexive about their positionality, but that is a feature of the discipline rather than a bug. Ultimately the strongest version of your position is not that we cannot know the past but that we cannot know it independently of the questions we ask it, and that is a defensible stance that avoids the fatal traps of self-refutation and unintelligibility while still honoring the insight you had about the indexical nature of our moral language.
