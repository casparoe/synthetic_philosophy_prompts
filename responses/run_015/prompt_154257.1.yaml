answer: |-
  **Project Title:** Ontological Mismatch and the Frame-Relativity of Competence in Valid Consent

  **Research Question**
  Standard models of valid consent rely on a tripartite structure: voluntariness, disclosure, and competence. This project asks: *Does the standard individualist model of consent break down when the consent-giver and the institution operate within mismatched conceptual taxonomies, and if so, must competence be reconceived as frame-relative rather than universal?* Specifically, when an institution's decision ontology (e.g., an AI's risk weighting or a psychiatric diagnostic manual) is structurally unrepresentable to the agent, does this constitute a validity defect distinct from deception or coercion?

  **The Gap in Existing Literature**
  Current bioethical and political philosophy literature treats competence as a threshold capacity intrinsic to the agent (the ability to understand, appreciate, reason, and communicate). Failures of consent are typically categorized as deception (false information), coercion (threats), or individual incapacity (cognitive deficit).

  This framework leaves a critical gap: it assumes a shared conceptual space or treats misunderstandings as individual failures of comprehension. It fails to address *structural incomprehensibility*. For example, if a user consents to an AI mediator whose decision ontology relies on high-dimensional vectors they literally cannot conceptualize, or if a patient consents to treatment based on psychiatric risk categories that do not map onto their cultural framework of distress, they are not being lied to, nor are they necessarily cognitively impaired. The usual literature on universal rationality assumes that if the truth is disclosed, a competent agent can grasp it. This project argues that when taxonomies mismatch, "disclosure" is impossible regardless of truth-telling, rendering the standard model insufficient.

  **Methodology: Why Philosophical Analysis?**
  This project employs conceptual analysis and normative modeling rather than empirical surveying. A survey of positions or user experiences cannot resolve the normative status of consent under ontological mismatch. Empirical data can reveal *that* people feel confused, but it cannot determine whether consent *ought* to be considered valid despite that confusion.

  We must establish the *conditions of possibility* for autonomy. If autonomy requires self-governance according to one's own values, and the institutional framework renders those values incommensurable with the decision at hand, then autonomy is structurally blocked. A philosophical approach allows us to decouple "competence" from "intelligence" and recouple it with "translatability." We will use thought experiments involving AI opacity and cross-cultural psychiatry to stress-test the definition of "understanding" in informed consent.

  **Expected Results and Deliverables**
  The primary output will be a normative framework for **Institutional Intelligibility**. This framework will propose that valid consent requires not only agent competence but also institutional translatability.
  *   **Success:** A robust argument that competence is relational. The result will be a set of design criteria for institutions (medical or technical) requiring them to bridge ontological gaps before claiming consent is valid.
  *   **Failure:** The argument collapses into radical relativism (where no consent is ever valid) or fails to distinguish ontological mismatch from simple complexity. If the project cannot distinguish "I don't understand this because it is hard" from "I don't understand this because my conceptual scheme lacks the coordinates," the distinction collapses.

  **Scope and Timeline (3 Months)**
  *   **Month 1: Taxonomy of Mismatch.** Define the difference between epistemic opacity (complexity) and ontological mismatch (incommensurability). Analyze case studies (AI alignment, cross-cultural psychiatry) to isolate the specific failure mode.
  *   **Month 2: Critique of Universal Competence.** Argue against the standard threshold model. Demonstrate how current models misidentify structural exclusion as individual deficit.
  *   **Month 3: Constructive Framework.** Draft the "Institutional Intelligibility" criteria. Outline obligations for institutions to adapt their taxonomies or acknowledge the invalidity of consent. Finalize the fellowship paper (8,000–10,000 words).

  **Feasibility**
  This scope is limited to the *validity conditions* of consent, not the legal implementation or specific policy prescriptions. By focusing on the philosophical groundwork for frame-relative competence, the project remains achievable within three months while laying the necessary foundation for future empirical or legal work.
