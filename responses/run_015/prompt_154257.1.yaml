      *   *Standard Model:* Consent is valid if the agent is competent, informed, and free from coercion/deception. Competence is usually treated as a threshold capacity (understand, appreciate, reason, communicate).
      *   *The Problem:* What if the *language* or *conceptual framework* used to convey information is incommensurable with the agent's framework? It's not lying (deception) and not forcing (coercion). It's a structural mismatch.
      *   *The Hypothesis:* Competence isn't just an internal property of the agent; it's relational or frame-relative. If the institution's ontology is inaccessible to the agent, "informed consent" is impossible regardless of the agent's IQ or rationality.
      *   *The Angle:* AI mediation and Cross-cultural Psychiatry are the test cases.

  3.  **Drafting - Section by Section:**

