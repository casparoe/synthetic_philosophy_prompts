prompt: |-
  Hi — I manage the eligibility desk for our county rental assistance program. Me and two other people decide what our own program rules mean, several times a week, and whatever we say is what the front desk does until somebody higher up tells us otherwise. None of us are lawyers. County counsel is part time, she's in the building maybe twice a month and she reads what we've already issued, after the fact. The state auditor reads our denials once a year. So what I need is something we can actually run in about twenty minutes, on paper, that ends in one of three places — apply reading A, apply reading B, or stop and send it to counsel — and that tells us which questions to ask in what order, what counts as an actual answer to each one, and where it's really just handing the question to a person because it's a values call dressed up as an interpretation.

  The part I can't get right is the old text-versus-purpose thing. I know the slogan version — if the words are clear, stop; if they aren't, ask what the rule is for — and it doesn't help, because every fight we have is one level below that. Here are the shapes they actually take:

  - Our rulebook opens with a "purpose and intent" section, but it was written for a different, older program, and after the 2015 renumbering most of the provisions it points at don't exist anymore. It still says things like the program exists to keep county families housed. How much weight does a purpose statement get when it's visably orphaned from the text it was written for?
  - One of our rules was lifted almost word for word out of a model code, and the model code had two carve-outs that our board didn't adopt. Does deleting them mean something, or did nobody think about it?
  - The intake software has implemented one reading of a rule for years, nobody still here knows who chose it, and flipping it would mean reopening a few hundred closed cases. Is that a fact the procedure can use, or is it inertia with a nicer name?
  - The two purposes in our purpose section pull against each other in most real cases: get money out the door fast, versus make sure it goes to the people it's for. "Look at the purpose" isn't an instruction when there are two.
  - And the unit question. Does the text/purpose test get applied to a single word, to a whole sentence, or to the rule as a chunk? With "resided" or "household" it definately seems to matter which you pick.

  Two more things I want an honest answer about. One: our denials get audited and our approvals get audited, but they cost us different things — a wrong approval is an improper payment we may have to eat, a wrong denial is a family that may lose housing while the appeal grinds for four months. I suspect that asymmetry isn't allowed to be part of interpretation at all, but I want the procedure to tell me that rather than quietly deciding things for me. Two: we have an internal convention that we won't read a rule in a way that makes things worse for a protected class without counsel signing off. Is that a tie-breaker inside the procedure, or a veto outside it?

  Some constraints, so the procedure isn't fantasy: we can't call the drafters (gone, term-limited, or dead) and the board minutes are thin, so there's no real legislative history to go dig up; our rules get reauthorized every two years, so arguments about a text freezing in 1970 while the world moved on are weaker here than in the stories people tell — say whether the procedure should even ask about drift. And it has to be runnable by someone whose training is a two-week onboarding.

  Then please run the whole thing, start to finish, on three live headaches:

  1. The income rule says count income "received during the month." A client gets a retroactive Social Security back payment covering fourteen months, arriving as one check this month. Count all of it or one fourteenth of it? The software has exactly one field.
  2. "Any person who shares the dwelling and contributes to household expenses" counts as a household member. A client's live-in caregiver is paid through a state waiver program, and part of the pay is room and board. Caregiver in or out — and does the answer change depending on whether it helps or hurts the client?
  3. To qualify you must have "resided in the county for twelve consecutive months immediately prior to application." A woman leaving a domestic violence situation spent six weeks in a confidential shelter whose registered address is in the next county over, then came back. On paper her twelve months has a hole in it.

  I have a feeling the procedure is going to tell me to deny number 3 and I am going to hate that, so if that's what it says I want it said plainly, along with what I'm actually supposed to do instead of quietly fudging it.

  And tell me what the procedure can't do: where it will misfire, which distinctions it drops and whether dropping them costs us something real, and which steps are judgment calls we've all agreed to call procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Manager of an eligibility desk for a county rental assistance program.
      *   **Context:** Small team (3 people), non-lawyers, significant autonomy ("whatever we say is what the front desk does"), limited legal oversight (part-time counsel, post-fact review), annual state audit.
      *   **Need:** A 20-minute, paper-based decision procedure (flowchart/checklist style) for interpreting program rules.
      *   **Output Requirements:**
          *   Must end in one of three outcomes: Apply Reading A, Apply Reading B, or Stop/Send to Counsel.
          *   Must specify questions to ask, in order.
          *   Must define what counts as an answer.
          *   Must identify where it's a "values call" disguised as interpretation.
          *   Must address specific "text vs. purpose" conflicts (orphaned purpose statements, deleted carve-outs, software inertia, conflicting purposes, unit of analysis).
          *   Must address two "honest answers": cost asymmetry (wrong approval vs. wrong denial) and protected class convention.
          *   Must apply the procedure to three specific "live headaches" (SSA back pay, caregiver household member, DV shelter residency).
          *   Must admit limitations (where it misfires, what it drops, where judgment is disguised as procedure).
      *   **Constraints:** No access to drafters/legislative history, rules reauthorized every 2 years (limits "drift" arguments), must be usable by staff with 2-week onboarding.

  2.  **Deconstruct the Core Problem:**
      *   The user is asking for *administrative statutory interpretation* without the tools of a court or agency general counsel. They need a heuristic, not a legal brief.
      *   The tension is between *Textualism* (what the words say) and *Purposivism* (what the rule is trying to do), complicated by *Administrative Reality* (software, inertia, risk).
      *   The user explicitly wants the "values calls" exposed, not hidden.

  3.  **Drafting the Procedure (The "20-Minute Rule Interpretation Worksheet"):**
      *   *Structure:* Needs to be linear, step-by-step, with clear "Stop" points.
      *   *Step 1: Text Check.* Is the word/phrase ambiguous *in context*? (Addresses the "unit of analysis" question).
      *   *Step 2: Purpose Check.* Which purpose applies? (Addresses conflicting purposes).
      *   *Step 3: Context/History Check.* (Addresses model code deletions, software inertia).
      *   *Step 4: Risk/Equity Check.* (Addresses cost asymmetry and protected classes).
      *   *Step 5: Decision.* (A, B, or Counsel).
      *   *Tone:* Pragmatic, bureaucratic but honest, instructional.

  4.  **Addressing the Specific "Honest Answers":**
      *   *Cost Asymmetry:* Legally, eligibility is usually binary. You can't deny an eligible person to save money, nor approve an ineligible person to be nice. *However*, ambiguity can be resolved in favor of the beneficiary in some administrative law contexts (rule of lenity equivalent), but often the risk of audit (improper payment) drives behavior. I need to be honest: The procedure shouldn't *hide* this, but it can't officially sanction breaking the rules to avoid risk. It needs to flag this as a "Policy Risk" that might require Counsel.
      *   *Protected Class:* This is a legal compliance issue (Fair Housing/Equal Protection). It shouldn't be a "tie-breaker"; it should be a "Stop Sign." If an interpretation harms a protected class, it *must* go to counsel. It's a veto outside the standard procedure.

  5.  **Addressing the "Text vs. Purpose" Nuances:**
      *   *Orphaned Purpose:* If the text was renumbered but purpose wasn't updated, text usually wins in administration, *unless* the text is gibberish without the purpose.
      *   *Deleted Carve-outs:* If the board adopted a model code *minus* exceptions, the presumption is the exceptions were intentionally removed.
      *   *Software Inertia:* This is practical, not legal. It counts as "Reliance Interest." It shouldn't dictate law, but it dictates *when* to change the rule (prospective vs. retrospective).
      *   *Conflicting Purposes:* The procedure needs a hierarchy. Usually, "statutory eligibility" beats "administrative efficiency."
      *   *Unit of Analysis:* Define this early. Interpret the *provision*, not just the word.

  6.  **Running the Three Scenarios:**
      *   *Scenario 1 (SSA Back Pay):* Text says "received during the month." Text is clear. Purpose (income eligibility) suggests ability to pay rent *now*. Software limitation is administrative. *Result:* Text wins (count it all), BUT flag for Counsel because it creates a hardship (cliff effect).
      *   *Scenario 2 (Caregiver):* Text says "contributes to household expenses." Room/board is contribution. BUT, it's a state waiver. *Result:* Ambiguous. Purpose (household income) vs. Purpose (supporting disabled). Likely needs Counsel or specific policy guidance.
      *   *Scenario 3 (DV Shelter):* Text says "resided... 12 consecutive months." Shelter break creates a hole. Purpose (keep families housed) vs. Text (residency). *Result:* Text says deny. Purpose says help. This is the "values call." The procedure should force the "Send to Counsel" or "Apply Reading B (constructive residence)" but acknowledge the text risk. *Correction:* The user suspects the procedure will say Deny. I need to be honest. If the text is "consecutive months" and she left the county, strictly speaking, she didn't reside. But "residence" can be constructive. This is a legal question. *Decision:* Send to Counsel. If Counsel isn't available, the procedure needs a default. Given the "Protected Class" (DV victims often protected), this triggers the veto.

  7.  **Refining the "Honest Answers" & Limitations:**
      *   I need to explicitly state that this procedure cannot make illegal things legal.
      *   I need to admit that "judgment calls" are being codified.
      *   I need to address the "Cost Asymmetry." The honest answer is: *Eligibility is legal, not financial.* You cannot use audit risk to change eligibility criteria. That is fraud/mismanagement. However, *ambiguity* can be weighed. I must be firm here: Do not deny eligible people to save audit hassle. Do not approve ineligible people to be nice.

  8.  **Final Review against Constraints:**
      *   20 minutes? Yes, if kept to 1 page + instructions.
      *   3 Outcomes? Yes.
      *   Non-lawyer friendly? Yes, avoid Latin, use plain English.
      *   Address the specific "shapes" of conflict? Yes, incorporated into the steps.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Scenario 3:* The user says "I have a feeling the procedure is going to tell me to deny number 3 and I am going to hate that." If I design the procedure correctly, it should identify this as a "Values Call" and route to Counsel. If Counsel is unavailable, what then? The user says Counsel is part-time. The procedure needs a "Counsel Unavailable" path. *Decision:* If it harms a protected class (DV status often implies sex/disability protections) and Counsel is unavailable, the safer legal bet is often to *approve* pending review (status quo) rather than deny housing, *but* that risks audit. Actually, the safest administrative path for "residency" ambiguity with DV is usually "constructive residency." I will guide the procedure to flag this as "Send to Counsel" because it's a legal definition of residency, not just interpretation.
      *   *Self-Correction on Cost Asymmetry:* I must be very clear. Using audit risk to determine eligibility is technically non-compliant. The procedure must isolate this as a "Management Decision," not an "Eligibility Decision."

  10. **Final Polish:** Ensure the tone is empathetic to the administrator's burden but firm on the boundaries of their authority. (Proceed to generate output).

  *(Self-Correction during drafting the response)*: I need to make sure I don't give legal advice myself. I am designing a *process* for them to use. I must frame the "Honest Answers" as structural realities of their position, not legal opinions.

  *Revised Plan for Scenario 3:* The text says "resided." She was in another county. Strict text = Deny. Purpose = Help. This is the exact "values call." The procedure should identify this as a "Policy/Values Conflict" and route to Counsel. If the user hates the result, it's because the *rule* is harsh, not the procedure. I will explain that distinction.

  *Revised Plan for Cost Asymmetry:* I will explicitly state that audit risk cannot legally determine eligibility. It can determine *process* (e.g., extra documentation), but not the *outcome* of the rule interpretation.

  *Revised Plan for Protected Class:* This is a hard stop. Not a tie-breaker. A gate.

  Let's build the "Eligibility Interpretation Worksheet."
answer: |-
  This is a sophisticated administrative problem. You are asking for a heuristic—a mental shortcut—that functions like legal reasoning but fits inside a 20-minute workflow for non-lawyers. You need to separate *interpretation* (what the rule means) from *policy* (what we wish the rule did) and *risk* (what happens if we get it wrong).

  Below is the **Eligibility Interpretation Worksheet (EIW)**. It is designed to be printed single-sided. Following that, I have addressed your two "honest answer" questions, run the three scenarios, and listed the procedure's limitations.

  ***

  # The Eligibility Interpretation Worksheet (EIW)
  **Time Limit:** 20 Minutes | **Users:** Eligibility Supervisors | **Goal:** Consistent Rule Application

  **INSTRUCTIONS:** Complete this form for any rule interpretation where staff disagree, where the software conflicts with the text, or where the outcome feels unjust. Do not use for clear-cut cases.

  ### STEP 1: DEFINE THE UNIT OF ANALYSIS (2 Minutes)
  *Don't interpret single words in isolation.*
  1.  **Identify the specific provision:** Write down the full sentence or paragraph containing the disputed term.
  2.  **Identify the disputed term:** (e.g., "received," "household," "resided").
  3.  **The Context Test:** Does reading the term *only* within that sentence create a contradiction or absurdity?
      *   [ ] **No:** The sentence makes sense on its own. **Proceed to Step 2.**
      *   [ ] **Yes:** The sentence contradicts itself or other rules without outside help. **Mark "Ambiguous Text" and Proceed to Step 2.**

  ### STEP 2: THE TEXT CHECK (5 Minutes)
  *If the words are clear, they win. If they aren't, admit it.*
  1.  **Plain Meaning:** Would a reasonable person with no knowledge of this program understand this word differently?
      *   [ ] **No:** It has a common, fixed meaning (e.g., "month" = calendar month).
      *   [ ] **Yes:** It is technical or vague (e.g., "household," "contributing").
  2.  **The "Deleted Carve-Out" Check:** Is this rule based on a model code or older version where exceptions existed but were removed in our version?
      *   [ ] **Yes:** Presume the removal was **intentional**. Do not read the exception back in.
      *   [ ] **No:** N/A.
  3.  **The "Software Inertia" Check:** Has the software interpreted this one way for >1 year?
      *   [ ] **Yes:** This creates a *reliance interest*. Changing it now harms people who relied on the old way. **Note this as a "Transition Cost."**
      *   [ ] **No:** N/A.
  4.  **Step 2 Decision:**
      *   If Text is **Clear** AND no "Transition Cost": **Apply Reading A (Textual).** (Skip to Step 5).
      *   If Text is **Ambiguous** OR high "Transition Cost": **Proceed to Step 3.**

  ### STEP 3: THE PURPOSE CHECK (5 Minutes)
  *You have two purposes. You must pick one hierarchy.*
  1.  **Identify the Conflict:** Which two purposes are fighting? (e.g., "Speed" vs. "Accuracy," "Housing Stability" vs. "Fiscal Integrity").
  2.  **The Orphaned Purpose Check:** Does the "Purpose and Intent" section reference rules that no longer exist?
      *   [ ] **Yes:** That specific purpose statement is **deactivated**. Use only the general purpose (e.g., "assist families").
      *   [ ] **No:** Use the stated purpose.
  3.  **The Hierarchy Rule:** In this program, **Eligibility Accuracy** overrides **Administrative Speed**. (You cannot deny an eligible person to save time; you cannot approve an ineligible person to be kind).
  4.  **Step 3 Decision:**
      *   Does one reading clearly fulfill the *active* purpose better without violating the Text?
      *   [ ] **Yes:** **Apply Reading B (Purposive).**
      *   [ ] **No (Purposes are equally weighted):** **Proceed to Step 4.**

  ### STEP 4: THE VALUES & RISK CHECK (5 Minutes)
  *This is where you expose the judgment call.*
  1.  **Protected Class Check:** Does one reading negatively impact a protected class (Race, Religion, Disability, Sex, DV Status, etc.) more than the other?
      *   [ ] **Yes:** **STOP. SEND TO COUNSEL.** (This is a veto, not a tie-breaker).
      *   [ ] **No:** Proceed.
  2.  **The Asymmetry Check:** Does one reading risk an audit finding (improper payment) and the other risk a housing loss (appeal)?
      *   [ ] **Yes:** **Acknowledge:** This is a **Policy Decision**, not an Interpretation.
      *   *Instruction:* If the text is ambiguous, prefer the reading that preserves housing *unless* the text explicitly forbids it. If the text is clear, you must follow the text regardless of audit risk.
  3.  **Step 4 Decision:**
      *   If Protected Class involved: **SEND TO COUNSEL.**
      *   If Policy Decision needed: **SEND TO COUNSEL** (or Program Director).
      *   If Ambiguity remains and no Counsel available: **Apply Reading B (Beneficiary-Friendly)** *only if* Step 2 marked "Ambiguous Text."

  ### STEP 5: FINAL OUTCOME (3 Minutes)
  *Circle one:*
  1.  **APPLY READING A:** (Strict Text). Document reasoning in case file.
  2.  **APPLY READING B:** (Purpose/Beneficiary). Document reasoning in case file.
  3.  **STOP / SEND TO COUNSEL:** Do not process application until guidance received. Place case in "Pending Legal."

  ***

  # The Two Honest Answers

  You asked for honesty on the two structural tensions you face. Here is the reality of your position.

  ### 1. The Cost Asymmetry (Audit vs. Housing Loss)
  **The Honest Answer:** You are not allowed to use this asymmetry to determine eligibility.
  *   **Why:** Eligibility is a legal status, not a budget line item. If a family is eligible, denying them to avoid an audit finding is a violation of their rights. If they are ineligible, approving them to avoid an appeal is an improper payment (potential fraud).
  *   **How the Procedure Handles It:** Step 4 forces you to label this as a "Policy Decision." If the text is ambiguous, the procedure allows you to lean toward housing stability (Reading B). If the text is *clear*, the procedure forces you to follow the text (Reading A), even if it causes housing loss. You cannot "fudge" clear text to avoid audit risk. That is how individuals get personally liable.

  ### 2. The Protected Class Convention
  **The Honest Answer:** This is a **Veto**, not a tie-breaker.
  *   **Why:** If an interpretation disproportionately harms a protected class (e.g., victims of domestic violence, people with disabilities), you are entering Fair Housing and Equal Protection territory. This is not about "what the rule means"; it is about "is this rule legal under federal law?"
  *   **How the Procedure Handles It:** Step 4.1 is a hard stop. It does not allow you to weigh the harm. If there is a disparate impact, you lack the authority to interpret it. It must go to Counsel. If Counsel is unavailable, the case sits. You cannot sign off on this yourself.

  ***

  # Running the Live Headaches

  Here is how the EIW processes your three scenarios.

  ### 1. The SSA Back Pay (Income "Received")
  *   **Step 1 (Unit):** Provision is "income received during the month." Term is "received."
  *   **Step 2 (Text):** Plain meaning of "received" is when the money hits your hand. Text is **Clear**. Software has one field (Inertia exists).
  *   **Step 3 (Purpose):** Purpose is "ability to pay rent." A lump sum helps now, but counting it all makes you ineligible for a temporary shortfall. Purposes conflict.
  *   **Step 4 (Values):** No protected class issue. Asymmetry exists (Deny now vs. Overpay later).
  *   **Step 5 (Outcome):** **APPLY READING A (Count it all).**
  *   **Why:** The text "received during the month" is not ambiguous. A lump sum *is* received in that month. Prorating it is a policy choice your board did not write into the rule.
  *   **Action:** You count the full amount. If this creates a "cliff effect" where a one-time check disqualifies a family for months, that is a flaw in the rule, not the interpretation. You should flag this for the Board at reauthorization, but you cannot fix it via interpretation.

  ### 2. The Caregiver (Household Member)
  *   **Step 1 (Unit):** Provision is "shares dwelling and contributes to expenses."
  *   **Step 2 (Text):** "Contributes" is **Ambiguous**. Does state-paid room/board count as *their* contribution or the *state's*?
  *   **Step 3 (Purpose):** Purpose is "calculate true household resources." If the caregiver's food/rent is covered by the state, the client's resources aren't stretched by them.
  *   **Step 4 (Values):** **Protected Class Check.** Caregivers are often linked to Disability (client). Excluding them helps the disabled client. Including them hurts.
  *   **Step 5 (Outcome):** **STOP / SEND TO COUNSEL.**
  *   **Why:** This touches on Disability accommodations and how state waivers interact with county rules. This is a legal conflict (State vs. County rules), not just interpretation. Do not decide this at the desk.

  ### 3. The DV Shelter (Residency "Consecutive")
  *   **Step 1 (Unit):** Provision is "resided... 12 consecutive months."
  *   **Step 2 (Text):** Text is **Clear** but harsh. She was physically in another county.
  *   **Step 3 (Purpose):** Purpose is "keep county families housed." She is a county family forced out by violence.
  *   **Step 4 (Values):** **Protected Class Check.** DV Status is a protected class (Sex/Displacement). Strict text application harms this class disproportionately.
  *   **Step 5 (Outcome):** **STOP / SEND TO COUNSEL.**
  *   **Why:** You suspected the procedure would tell you to Deny. **Strictly speaking, the text says Deny.** However, Step 4 triggers the Veto. You cannot apply a residency rule in a way that penalizes a victim of domestic violence without legal sign-off.
  *   **What to do instead:** You do not "quietly fudge it." You place the application in "Pending Legal." You send an email to Counsel: *"Strict text requires denial. Applicant is DV victim. Step 4 Veto triggered. Need legal definition of 'constructive residency' for DV cases."*
  *   **If Counsel doesn't reply:** You have a management problem, not a desk problem. You escalate to the Program Director. You do not approve it yourself (risk of audit) and you do not deny it yourself (risk of lawsuit/harm). You hold it.

  ***

  # What This Procedure Cannot Do (Limitations)

  You asked for the misfires. Here they are.

  **1. It Cannot Fix Bad Rules.**
  In Scenario 1 (SSA Back Pay), the procedure tells you to count the full amount. You will hate this. It will hurt a family. The procedure admits this. It cannot invent a "prorating" rule that doesn't exist. It forces you to follow the text so that when the Board reauthorizes the rules, they see the data on how many people were denied due to lump sums. If you fudge it, the Board never knows the rule is broken.

  **2. It Drops "Legislative Intent."**
  You noted minutes are thin and drafters are gone. This procedure assumes **Text + Current Purpose** is all you have. It explicitly ignores "what they meant in 2015." This saves time but means you might enforce a rule that was a drafting error. The "Send to Counsel" step is the only safety valve for this.

  **3. It Disguises Judgment as "Ambiguity."**
  Step 2 asks: "Is the text ambiguous?" That is a judgment call. Two supervisors might disagree on whether "received" is clear.
  *   *Mitigation:* You (the manager) must be the tie-breaker on Step 2. If you say it's clear, it's clear. If you say it's ambiguous, it's ambiguous. This centralizes the "judgment" to you, rather than spreading it to the front line.

  **4. It Relies on Counsel Availability.**
  Scenario 2 and 3 both trigger "Send to Counsel." If Counsel is in the building twice a month, your workflow will bottleneck.
  *   *Reality:* You need a "Standing Opinion" file. If Counsel answers Scenario 3 once ("DV shelter counts as county residency"), you write that down as **Precedent**. Next time, Step 4 says "Precedent Exists," and you bypass the Stop. You must build your own internal case law.

  **5. It Does Not Protect You from Political Pressure.**
  If a Commissioner calls and says "Approve this DV case," this procedure tells you "Send to Counsel." It does not give you the armor to say "No" to a Commissioner. It only gives you the paper trail to show *why* you paused the case.

  ### Final Recommendation
  Print the Worksheet. Run a training session where you and your two supervisors interpret the same fake case using the sheet. If you get different results, your disagreement isn't about the rule; it's about **Step 2 (Is this ambiguous?)**. Agree on that, and the rest of the machine works.
