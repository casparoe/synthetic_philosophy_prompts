answer: |-
  Consider the self not as a sovereign originator but as a character within a narrative, subject to the conceit of **nested authorial regression**. In this analogy, every decision the character makes is a line of dialogue generated by their established personality, history, and motives—their "text." To attribute true moral responsibility to this character, we must assert that they authored this text. However, the character cannot write their own nature without already possessing a style, a vocabulary, and a set of thematic priorities—conditions supplied by the "Author," representing prior genetic, environmental, and psychological causality. If the character attempts to revise their own nature, they must employ the very cognitive tools and desires they are attempting to revise; they are editing a draft using the pen provided by the previous draft. This reveals the absence of a *causa sui*: there is no "first draft" of the will that is genuinely self-created, only an infinite regress of prior editions written by causes outside the character's control.

  Compatibilists intervene here, arguing that the analogy fails because moral responsibility does not require metaphysical authorship, but only **reasons-responsive mechanisms**. They contend that if the character acts according to their own internal logic without external coercion, the regress is halted practically; the origin of the text matters less than the coherence of the story. However, this objection does not refute the causal regress itself but rather contests the definition of responsibility. Strawson's regress is logically settled regarding *ultimate* origination: one cannot be responsible for the way one is without already being responsible for the principles used to change it. What compatibilists genuinely contest is whether this ultimate origination is necessary for moral blame, often redefining responsibility to serve social utility rather than metaphysical desert. Yet, if we maintain the intuitive requirement that true blame demands the agent be the ultimate source of their action, the character remains a vessel for the Author's causality, incapable of genuine self-authorship.

  \answer{True moral responsibility is impossible because no agent can be the ultimate originator of the mental nature from which their actions necessarily flow.}
