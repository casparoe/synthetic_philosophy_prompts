  Good to hear from you. Sounds like you're deep in the weeds on the *White Horse Dialogue* (Bai Ma Lun). That's tricky terrain, especially when you're trying to bridge the Warring States context with modern ontology without falling into anachronism.

  Since I'm offline right now, I can't pull up the latest sinology journals, but I've got the core debates mapped in my head. Below is the brainstorming sketch you asked for, followed by the draft of the "Adversarial-Collaboration Joint Statement." I've tried to keep the tone neutral enough that both a mereological realist and a type-theoretic pragmatist could sign it, while highlighting the cross-categorial predication angle you're interested in.

  Let me know if this captures the tension correctly.

  ***

  ### Quick Brainstorming: Mapping the Camps

  **Camp A: The Property-Exclusion / Mereological Readers**
  *   **Core Intuition:** Gongsun Long is a realist about attributes. "White" and "Horse" pick out genuine universals or properties.
  *   **Metaphysics:** When you combine them, you get a composite entity (a mereological sum of attributes) that is distinct from the simple entity "Horse."
  *   **Logic:** "White" acts as a restrictive modifier on the extension of "Horse." The set of White Horses is a proper subset of Horses, therefore the concept [White Horse] is not identical to the concept [Horse].
  *   **Take on "Fei" (Not):** Strict identity failure. $WH \neq H$.
  *   **Vibe:** Analytic metaphysics, classical mereology, realism about universals.

  **Camp B: The Pragmatic-Contextualist / Speech-Act Readers**
  *   **Core Intuition:** The dialogue is diagnostic. It exposes how ordinary language breaks down when we mix categories (color vs. form).
  *   **Metaphysics:** Less committed to objects, more committed to semantic types. "Horse" names a shape/form category; "White" names a color category.
  *   **Logic:** Cross-categorial predication failure. You cannot predicate a compound name (color+form) onto a simple name (form) without a type mismatch. It's not about subsets; it's about logical grammar.
  *   **Take on "Fei" (Not):** Pragmatic non-substitutability. "White Horse" cannot replace "Horse" in certain speech contexts without changing the truth conditions.
  *   **Vibe:** Philosophy of language, speech-act theory, type theory, contextualism.

  ***

  ### DRAFT: Adversarial-Collaboration Joint Statement
  **Subject:** The Logical Structure of the *White Horse Dialogue*
  **Signatories:** Camp A (Metaphysical-Mereological) & Camp B (Pragmatic-Type-Theoretic)

  #### 1. Numbered Agreed Claims
  *Both camps endorse the following claims regarding the text, the historical context, and the formal inference structure.*

  1.  **Textual Integrity:** We agree that the core thesis of the dialogue is the proposition "White horse is not horse" (Bai ma fei ma), and that the argument relies on the distinction between naming form (*xing*) and naming color (*se*).
  2.  **School of Names Context:** We agree that the School of Names (*Ming Jia*) was primarily concerned with the relationship between names (*ming*) and actualities (*shi*), specifically regarding how compound names function relative to simple names.
  3.  **The "Seeking" Argument:** We agree that the text utilizes a modal/intensional context involving "seeking" (*qiu*). Specifically: If one seeks a horse, a yellow or black horse suffices; if one seeks a white horse, a yellow or black horse does not suffice.
  4.  **Formal Structure:** We agree the argument follows a *reductio* style structure: Assume "White Horse is Horse." If so, seeking a white horse should be identical to seeking a horse. The text shows these seek-conditions differ. Therefore, the initial assumption fails.
  5.  **Non-Normalcy:** We agree that the conclusion contradicts ordinary usage (common sense says a white horse *is* a horse), implying the dialogue is intended to correct or refine ordinary logical intuition rather than describe empirical biology.

  #### 2. Disagreements Table
  *Each camp phrases their position such that the other acknowledges it as a accurate representation of their dissent.*

  | Feature | Camp A (Metaphysical-Mereological) | Camp B (Pragmatic-Type-Theoretic) |
  | :--- | :--- | :--- |
  | **Ontological Commitment** | We claim the dialogue asserts a mind-independent distinction between the composite object (White-Horse) and the simple kind (Horse). Properties exclude each other to form distinct entities. | We claim the dialogue asserts a distinction in semantic types. The distinction lies in the logical grammar of the names, not necessarily in the external objects themselves. |
  | **Function of "White"** | We claim "White" operates as a restrictive modifier that literally removes members from the extension of "Horse" (e.g., removing black horses), creating a new extension. | We claim "White" operates as a category selector that shifts the term from a form-type to a color-form compound-type, making predication onto the form-type invalid. |
  | **Meaning of "Fei" (Not)** | We claim "Fei" denotes strict non-identity between classes or universals. The class WH is not the class H. | We claim "Fei" denotes non-substitutability in specific speech contexts. The term WH cannot replace H without altering the speech act's success conditions. |
  | **Role of Context** | We claim context is secondary; the metaphysical distinction holds regardless of who is speaking or why. | We claim context is primary; the distinction only matters when resolving ambiguity in naming or reference fixation. |

  #### 3. The Cruxes
  *We identify the following two points as the primary divergences preventing full synthesis.*

  **Crux 1: The Restrictive Modifier vs. Type Shift**
  *   **The Issue:** Does "White" restrict the *extension* of "Horse" (Camp A), or does it change the *logical type* of the term (Camp B)?
  *   **Why it matters:** If A is right, we need a mereological ontology to explain how properties combine to exclude members. If B is right, we need a type-theoretic ontology to explain why cross-categorial predication fails.

  **Crux 2: The Necessity of Type-Theoretic Ontology**
  *   **The Issue:** Is the inference valid only if we assume names belong to different logical categories (e.g., *entity* vs. *property*, or *form* vs. *color-form*)?
  *   **Why it matters:** Camp A believes standard class logic suffices (subset relations). Camp B believes standard class logic obscures the error; we need type theory to explain why "White Horse is Horse" is a category mistake, not just a falsehood.

  #### 4. Concrete Textual Cases & Predictions
  *For each crux, we agree on a specific passage that bears on the issue, but record divergent predictions about what that passage demonstrates.*

  **Case for Crux 1 (Restrictive Modifier vs. Type Shift)**
  *   **Textual Case:** The passage distinguishing "Horse" as naming the form (*xing*) and "White" as naming the color (*se*), concluding that "What names the color is not what names the form."
  *   **Camp A Prediction:** This passage shows that color and form are distinct ontological constituents. When combined, they create a new composite particular. The text proves that properties are separable and combinable like building blocks.
  *   **Camp B Prediction:** This passage shows that "Horse" and "White" belong to different semantic categories. The text proves that predication fails because you cannot predicate a color-name onto a form-name without a category mismatch (cross-categorial predication).

  **Case for Crux 2 (Type Theory vs. Class Logic)**
  *   **Textual Case:** The "Seeking" argument (If you seek a horse, yellow/black works; if you seek a white horse, yellow/black fails).
  *   **Camp A Prediction:** This demonstrates extensional difference. The set of acceptable answers for "seek horse" is larger than "seek white horse." Therefore, the terms refer to different sets. Logic of classes explains this fully.
  *   **Camp B Prediction:** This demonstrates intensional context sensitivity. The *criteria* for satisfaction change, not just the set of objects. This requires a type-theoretic or intensional logic where the meaning of "seek" shifts based on the type of the object term. A simple subset model misses the shift in satisfaction conditions.

  ***

