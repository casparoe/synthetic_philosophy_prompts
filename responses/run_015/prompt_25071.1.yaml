answer: |-
  # Specification Document: The Metric of Equality
  **Chapter Draft: Theoretical Preconditions and Desiderata**

  ## 1. The Architectural Constraint: Metric vs. Principle
  Before listing substantive desiderata, we must establish the structural role of the metric. A theory of the metric of equality specifies the *currency* or *space* in which comparisons of advantage are made. It is distinct from the *principle* of distribution (e.g., strict equality, prioritarianism, sufficiency) and the *scope* of distribution (who counts).

  *   **Desideratum:** **Non-Circularity of Metric and Principle.**
      *   **Motivation:** To avoid begging the question. If the metric is defined as "that which should be equalized," the theory is tautological. The metric must be identifiable independently of the distributive rule.
      *   **Case:** A Prioritarian can use the same metric as an Egalitarian (e.g., welfare), but apply a different weighting function. If the metric *includes* the weighting (e.g., "priority-weighted welfare"), you cannot distinguish the view from strict egalitarianism.
      *   **Status:** **Genuine Requirement.** This is a methodological necessity for coherent theory construction. Collapsing the metric into the principle (as some Luck Egalitarians risk by building responsibility cuts directly into the definition of advantage) renders comparative assessment impossible.

  ## 2. Substantive Desiderata (The "Must-Haves")
  These are constraints motivated by widely shared intuitions about injustice. A metric that fails these is generally considered extensionally inadequate.

  ### A. The Anti-Fetishism Constraint (Means vs. Ends)
  *   **Motivation:** Goods are only valuable insofar as they enable people to live lives they have reason to value. A metric focusing solely on means ignores the variability in human ability to convert means into ends.
  *   **Case:** **The Disability/Handicap Case.** Two individuals have identical income (resources). One is able-bodied; one requires a wheelchair. The resource metric declares them equal. The intuition of injustice suggests they are not, because the disabled person has less effective access to movement, employment, etc.
  *   **Status:** **Genuine Requirement.** Almost universally accepted post-Sen. Any metric focusing purely on primary goods or income without conversion factors fails here.

  ### B. The Anti-Adaptation Constraint (The "Happy Slave")
  *   **Motivation:** Subjective states can be distorted by oppression. A metric relying solely on reported satisfaction or desire fulfillment will validate oppressive conditions if the oppressed have adapted their preferences to their circumstances.
  *   **Case:** **The Oppressed Housewife / Happy Slave.** A person in servitude reports high satisfaction due to lowered expectations (adaptive preferences). A welfarist metric might rank this state as equal to or better than a free but stressed person. This contradicts the fundamental intuition that freedom from domination is a component of advantage.
  *   **Status:** **Genuine Requirement.** This is the primary objection to hedonistic or desire-based welfarism.

  ### C. The Expensive Tastes Constraint (Responsibility for Preferences)
  *   **Motivation:** Individuals should bear the costs of their voluntary choices and cultivated dispositions. A metric that treats all preferences as equal claims on social resources encourages frivolity and penalizes frugality.
  *   **Case:** **The Champagne Socialist.** Person A is content with cheap beer; Person B requires expensive champagne to achieve the same level of satisfaction. A metric that equalizes welfare requires taxing A to subsidize B's tastes. The intuition is that B's expensive taste is not a claim of justice.
  *   **Status:** **Contested (See Section 3).** While widely cited, the strength of this constraint depends on one's view of responsibility.

  ### D. The Publicity and Measurability Constraint
  *   **Motivation:** Principles of justice must be publicly knowable and administrable by institutions. If the metric relies on information that is private, unknowable, or too complex to verify, it cannot guide policy.
  *   **Case:** **Court Adjudication.** If a metric requires knowing the exact utility function of every citizen to determine if they are equal, no court or bureaucracy can apply it. This motivates the shift from welfare (private mental states) to resources (publicly observable holdings).
  *   **Status:** **Pet Constraint (Rawlsian).** This is a constraint of *feasibility* and *liberal legitimacy*, not necessarily moral truth. A theory could be morally correct but administratively difficult. Flagging this as a "hard requirement" privileges institutional stability over moral accuracy.

  ## 3. "Pet Constraints" (Theoretical Biases)
  These are often presented as neutral starting points but are actually substantive commitments that rule out entire families of theories prematurely.

  ### A. Strict Responsibility Sensitivity (The Luck Egalitarian Cut)
  *   **The Constraint:** The metric must distinguish between "brute luck" (circumstance) and "option luck" (choice) *within the definition of advantage*.
  *   **The Bias:** This assumes that the *metric* itself, rather than the *principle* of distribution, must handle responsibility. Relational Egalitarians (e.g., Anderson) argue that demanding this in the metric leads to intrusive scrutiny of citizens' choices and undermines the social basis of self-respect.
  *   **Risk:** Building this into the metric makes the informational demands impossible (see Section 4).

  ### B. Strict Liberal Neutrality
  *   **The Constraint:** The metric must not presuppose a specific conception of the "good life" or human flourishing.
  *   **The Bias:** This privileges Resourcism (which claims to be neutral regarding ends) over Capabilities (which often implies an objective list of valuable functionings). It assumes that "neutrality" is possible or desirable, which perfectionists dispute.
  *   **Risk:** It forces theories to ignore objective harms (e.g., malnutrition) unless they can be framed as resource deficits or subjective dissatisfaction.

  ## 4. Joint Unsatisfiability (The Trilemmas)
  There are subsets of desiderata that appear jointly unsatisfiable. Acknowledging these is crucial for structuring the debate, as every major theory sacrifices one to save the others.

  ### Tension 1: Responsibility vs. Adaptive Preferences
  *   **The Conflict:** To handle **Expensive Tastes**, the metric must be sensitive to individual responsibility (discounting voluntary preferences). To handle **Adaptive Preferences**, the metric must be insensitive to individual responsibility (overriding the victim's reported satisfaction).
  *   **The Impossibility:** If you build a mechanism into the metric to filter out "expensive tastes" (choice), you inevitably risk filtering out "adapted preferences" (survival strategy), because both look like "preferences the agent currently holds." Distinguishing them requires metaphysical access to the agent's history of choice that is empirically unavailable.
  *   **Consequence:** You cannot have a metric that is simultaneously fully responsibility-sensitive and fully protectionist against adaptation without collapsing into paternalism.

  ### Tension 2: Neutrality vs. Anti-Fetishism
  *   **The Conflict:** To handle **Disability** (Anti-Fetishism), the metric must account for what people can *do* with resources (capabilities/functionings). To maintain **Neutrality**, the metric must not judge which functionings are valuable.
  *   **The Impossibility:** Assessing conversion factors (e.g., "how much mobility does this wheelchair provide?") inevitably involves a judgment about the value of mobility. A strictly neutral resource metric fails the disability case; a capabilities metric that solves the disability case risks perfectionism.

  ### Tension 3: Precision vs. Pluralism
  *   **The Conflict:** To satisfy **Publicity/Measurability**, the metric should be singular and aggregable (e.g., one index of utility or income). To satisfy **Anti-Fetishism** and **Anti-Adaptation**, the metric must capture plural, incommensurable aspects of life (health, dignity, political voice).
  *   **The Impossibility:** You cannot have a single, precise number that captures plural, incommensurable goods without arbitrary weighting. If you weight them, you violate neutrality; if you don't, you violate measurability.

  ## 5. The "Killer" Requirement
  If there is one requirement that, when taken seriously, does the most damage to the most theories, it is:

  ### **The Requirement of Interpersonal Comparability of Advantage under Conditions of Pluralism.**

  *   **Definition:** The metric must allow for a public, verifiable judgment that Person A is worse off than Person B, even when they have different conceptions of the good, different psychological constitutions, and different physical abilities.
  *   **Why it Wrecks Welfarism:** Mental states (pleasure, desire satisfaction) are private. There is no "utility meter." Interpersonal comparison of welfare is scientifically dubious (the problem of other minds + preference measurement).
  *   **Why it Wrecks Resourcism:** Resources are comparable (dollars are dollars), but they fail the *Advantage* part of the requirement. $100 is not equivalent advantage for a disabled person vs. an able-bodied person. To make them comparable as *advantage*, you must adjust for conversion, which slides you into Capabilities.
  *   **Why it Wrecks Capabilities:** Capabilities solve the disability problem, but they introduce a vector of multiple functionings (health, education, political voice). There is no non-arbitrary way to aggregate these into a single scale for comparison without imposing a specific weighting scheme (violating Neutrality/Pluralism).
  *   **Structural Impact:** This requirement forces the debate away from "What is the true metric?" to "What informational base is *sufficiently* comparable for political purposes?" It suggests that a perfect metric is impossible, and the choice is between *types of informational error* (ignoring disability vs. ignoring privacy vs. imposing weights).

  ## 6. Summary for Evaluation
  When you proceed to evaluate Welfarism, Resourcism, and Capabilities in the next section, do not ask "Which one is true?" Ask:
  1.  **Which desideratum does this theory sacrifice?** (e.g., Welfarism sacrifices Anti-Adaptation; Resourcism sacrifices Anti-Fetishism).
  2.  **Does it collapse the Metric/Principle distinction?** (e.g., Does Luck Egalitarianism hide the distributive rule inside the metric?)
  3.  **How does it handle the Responsibility/Adaptation Tension?** (Does it solve it, or merely hide it?)
  4.  **Does it meet the Killer Requirement?** (Does it offer a plausible account of interpersonal comparison, or does it assume it away?)

  This specification clarifies that the "Equality of What?" debate is not a search for a perfect currency, but a negotiation over which theoretical costs are acceptable.
