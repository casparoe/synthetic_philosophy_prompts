answer: |-
  Here are ten interview questions designed for a senior undergraduate philosophy seminar. They are structured to probe the tensions in Sidgwick's thought rather than solicit a summary of his views.

  **1. The Utilitarian Motivation**
  Sidgwick's *Methods of Ethics* concludes with the "Dualism of Practical Reason," suggesting a potential conflict between rational egoism and utilitarianism unless a divine moral order exists. Does Sidgwick's investment in psychical research stem from a philosophical *need* for survival to resolve this dualism, or do you maintain his empirical interest was entirely independent of his ethical system?
  *   **Follow-up:** If you argue the interests were independent, how do you reconcile that with his private correspondence suggesting that without evidence of post-mortem sanctions, the utilitarian project might lack psychological stability for the agent?

  **2. Epistemology of the "Critical Incident"**
  Sidgwick and the SPR often relied on the accumulation of case histories, yet Sidgwick insisted on isolating "critical incidents"—specific, verifiable details within a séance or hallucination report. Do you view this method as a precursor to modern data filtering, or does it risk treating anecdotal testimony as a form of data that it fundamentally is not?
  *   **Follow-up:** Given that "critical incidents" are often selected *post hoc* from larger, messier narratives, how does Sidgwick's method guard against the selection bias that modern statistics would flag as cherry-picking?

  **3. Survival and the Ethics of Suicide**
  In Sidgwick's framework, the rationality of self-preservation often hinges on the expectation of future consciousness. If the evidential bar for survival is set as high as Sidgwick demands, but remains ultimately unmet, does the moral prohibition against suicide lose its rational foundation, or does the *uncertainty* itself mandate a precautionary principle?
  *   **Follow-up:** If you argue that uncertainty mandates caution, are you not effectively endorsing a pragmatic wager rather than the strict evidentialism Sidgwick publicly championed?

  **4. Victorian Standards of Evidence**
  Sidgwick demanded "stringent evidential standards" comparable to legal or scientific proof of his time. However, Victorian standards of cross-examination were often legalistic rather than statistical. In what way does Sidgwick's reliance on cross-examination of mediums differ epistemologically from a modern reliance on controlled experimental conditions?

  **5. Telepathy as a Naturalistic Wedge**
  Sidgwick seemed more willing to entertain telepathy than full post-mortem survival, viewing the former as a potential natural law. Does accepting telepathy actually undermine the case for survival by providing a naturalistic explanation for "spirit" communications that removes the need for a discarnate entity?

  **6. The Role of Fraud in Prior Probabilities**
  Sidgwick was famously rigorous in exposing fraud, such as in the case of Eusapia Palladino. However, does the high frequency of fraud in psychical research historically lower the prior probability of genuine claims to a point where Sidgwick's "open-minded" empiricism becomes mathematically untenable from a Bayesian perspective?

  **7. Testimony and the Humean Objection**
  Hume argued that testimony is insufficient to establish a miracle because the likelihood of error outweighs the likelihood of the violation of natural law. How does Sidgwick's accumulation of multiple, independent testimonies in the *Census of Hallucinations* specifically attempt to bypass Hume's maxim without simply appealing to volume?

  **8. Esoteric Morality and Public Philosophy**
  Sidgwick famously argued for "esoteric morality" in ethics—keeping certain truths from the public if necessary. Did he view psychical research similarly, as a domain where the elite could pursue evidence of survival that might be dangerous or misleading if popularized prematurely?

  **9. Demarcation of the Empirical**
  You defend the position that psychical research is a "legitimate empirical subject." Where exactly does Sidgwick draw the demarcation line between psychical research and metaphysics? At what point does a claim about "spirit" cease to be an empirical hypothesis and become a theological one?

  **10. Modern Methodological Challenges**
  Finally, considering contemporary developments such as preregistration, Bayesian meta-analysis, or the replication crisis specifically within parapsychology: which of these modern methodological tools would count most strongly *against* Sidgwick's view that the field is legitimate but currently lacks sufficient evidence?
