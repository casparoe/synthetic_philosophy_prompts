prompt: |-
  I'm a fourth-year philosophy student taking a course on late-Victorian ethics and psychical research, and I'm helping prepare a student seminar panel with a philosopher who defends Henry Sidgwick's position on psychical research: it is a legitimate empirical subject, but claims of mediumship, telepathy, and post-mortem survival require very stringent evidential standards. Draft eight to ten interview questions that go beyond having the guest restate the view, and avoid generic questions about why the topic is interesting. I want at least one question each on the relation in Sidgwick's work between the evidential question of survival and the moral question of suicide, on his attitude to the Society for Psychical Research's case files and the role of 'critical incidents,' and on whether his utilitarianism gives him a special reason to take survival claims seriously; for each, include a follow-up keyed to the answer the guest is most likely to give. End with a question about what modern methodological development—such as preregistration, Bayesian meta-analysis, or the replication crisis in parapsychology—could count against the view.
