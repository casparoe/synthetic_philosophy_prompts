      *   *Item 2:* MIA Sub-score. Applicant A uses "Standard Model Precedents." Applicant B uses "General Structural Posits." Panel decides to allow applicant discretion subject to a 0.15 penalty for broad classes.
      *   *Item 3:* Typicality. "Landscape Theory 9." Measure implies 99% observers are Boltzmann Brains. Compliance Office recommends "Probabilistic Incoherence Flag." Motion: Accept flag. Theory remains fundable but marked.
