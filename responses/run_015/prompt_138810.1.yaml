  **NON-EMPIRICAL ASSESSMENT PANEL (NEAP)**
  **MINUTES OF MEETING 44/2**
  **Date:** 14 November 2023
  **Location:** Secure Video Conference Link 4
  **Chair:** Dr. Aris Thorne (Director, Office of Theoretical Viability)
  **Present:** Dr. E. Vancel, Prof. L. Krint, Dr. S. Omer, Ms. H. Gwyl (Secretary)
  **Apologies:** Prof. J. Harth (Illness)

  **1. Approval of Minutes**
  The minutes of Meeting 44/1 were approved as a true record.

  **2. No-Alternatives Argument (NAA) Sub-Score: Adversarial Filings**
  The Chair introduced Item 2 regarding the Provisional Confidence Index (PCI) for the Unified Resonance Model (URM-4). A filing had been received from Veridian Strategic Consultancy detailing "Model K," a formally consistent rival to URM-4. It was noted that Model K was constructed solely to depress the URM-4 No-Alternatives sub-score and possessed no independent theoretical motivation.

  Dr. Vancel observed that the NAA sub-score is intended to reflect the scarcity of viable rivals in logical space, not merely the current funding allocation for rival construction. However, Prof. Krint countered that the Panel's mandate is to assess the sociological state of the field, not modal metaphysics. If a consistent alternative exists on file, the "no alternatives" claim is factually false, regardless of the alternative's aesthetic merit.

  **Motion 2.1:** That Model K be accepted as a valid alternative for the purpose of calculating the NAA sub-score, provided it meets formal consistency checks.
  **Moved:** Prof. Krint. **Seconded:** Dr. Omer.
  **Outcome:** Carried.
  **Action:** Secretariat to update URM-4 PCI calculation. The NAA sub-score will be adjusted to reflect the existence of Model K. Owners: Scoring Unit. Deadline: 30 November.

  **3. Meta-Inductive Argument (MIA) Sub-Score: Reference Class Selection**
  The Panel reviewed two submissions for the Structural Flux Theory (SFT). Applicant A proposed a reference class of "Vindicated High-Energy Theories (1970–2020)." Applicant B proposed "All Structural Posits Lacking Falsification Conditions." Both theories share identical evidential situations.

  The Chair noted that the MIA sub-score relies entirely on the success rate of the chosen reference class. Applicant A's class yields a high success rate; Applicant B's yields near-zero. The Panel discussed the impossibility of adjudicating the "correct" class without begging the question regarding SFT's validity.

  **Motion 3.1:** That applicants retain discretion to propose their own reference classes, subject to a discretionary penalty uplift of 0.15 on the PCI for classes exceeding fifty years in temporal scope.
  **Moved:** Dr. Omer. **Seconded:** Dr. Vancel.
  **Outcome:** Carried.
  **Action:** Secretariat to issue guidance on "Temporal Scope Penalties." Owner: Ms. Gwyl. Deadline: 15 December.

  **4. Typicality Compliance: Measure Problems and Observer Selection**
  The Typicality Compliance Office (TCO) reported on the Landscape Cosmology Initiative (LCI-9). The theory requires a measure over vacuum states to generate predictions. The submitted measure entails that 99.8% of observers are Boltzmann Brains (random fluctuations) rather than evolved observers.

  The TO noted that if the theory is true, our observations are statistically likely to be delusions. This undermines the data used to assess the theory. The Panel discussed whether this constitutes a falsification or a compliance failure. It was agreed that this is an internal coherence issue regarding the theory's ability to account for its own assessors.

  **Motion 4.1:** That LCI-9 be flagged as "Probabilistically Self-Undermining" but remain eligible for funding pending a revised measure.
  **Moved:** Prof. Krint. **Seconded:** Dr. Thorne.
  **Outcome:** Carried.
  **Action:** TCO to request revised measure from LCI-9 Principal Investigators. Owner: Dr. Vancel. Deadline: 31 January.

  **5. Publicity and Claims of Empirical Support**
  The Chair raised an incident wherein the Institute for Fundamental Geometry issued a press release stating their theory was "supported by all available evidence." No novel predictions have been tested.

  Dr. Vancel argued that consistency with existing data is not equivalent to support. Prof. Krint noted that in the non-empirical regime, survival of existing constraints is the primary metric of success. The Panel failed to reach consensus on whether "support" implies positive confirmation or mere non-falsification.

  **Action:** Secretariat to draft guidance distinguishing "Consistency" from "Confirmation" for public communications. Owner: Ms. Gwyl. Deadline: 30 November.

  **6. Date of Next Meeting**
  12 December 2023, 14:00 UTC.

  **Meeting Closed:** 15:45 UTC.

  ***

  **Where this takes liberties**

  **Exaggeration vs. Commitment:** The core arguments—No-Alternatives (NAA), Meta-Inductive (MIA), and Unexpected Coherence—are genuine commitments of defenders like Richard Dawid. However, the bureaucratic formalization is satire. Defenders do not propose a "Provisional Confidence Index," nor is there a "Typicality Compliance Office." The vulnerability of the NAA to "spoiler theories" is a genuine philosophical objection (the argument tracks sociological effort, not logical space), but no consultancy is currently paid to generate them. The reference class problem in MIA is real; the "discretionary penalty" is my invention to highlight the arbitrariness.

  **Settled vs. Contested:** Among experts, the necessity of non-empirical assessment in high-energy physics is settled; data is inaccessible. What is fiercely contested is whether these arguments yield *confirmation* or merely *motivation*. Critics argue NAA is an argument from ignorance. Defenders reply that in a underdetermined regime, sociological facts about theory construction are the only data available. The Boltzmann Brain problem (Item 4) is genuinely contested; some view it as a fatal flaw of multiverse theories, others as a measure-selection problem yet to be solved. I find the defenders' strongest reply is that rejecting non-empirical assessment halts progress entirely; we cannot wait for data that may never arrive. However, converting these epistemic nuances into administrative rubrics (as satirized here) risks reifying contingent sociological facts into physical truths.
