answer: |-
  **Exam Question**

  **Course:** Graduate Seminar in Formal Epistemology  
  **Topic:** Rational Belief, Objective Chance, and Self-Location  
  **Time Allowed:** 75 Minutes  
  **Word Limit:** Approximately 700 words

  **Question:**

  Consider an agent operating within an Everettian quantum multiverse. She knows the global wavefunction perfectly and thereby knows the exact objective branch weights for an impending quantum measurement: ninety percent weight for outcome A and ten percent weight for outcome B. She also knows that her mental state will be duplicated across branches following the measurement. Post-measurement, she finds herself observing outcome B.

  Does the Principal Principle require her to assign credence 0.9 to the proposition that the outcome is A, despite her first-personal knowledge that she observes B? Or does her centered-world indexical knowledge (that *she* is a B-observer) block deference to the global branch weight without rendering the Principle vacuous? Discuss whether a unique rational credence can survive such blocking, or if the tension forces a rejection of uniqueness in rational belief. In your answer, distinguish carefully between metaphysical branch weights and epistemic access.

  ***

  **Model Answer**

  The Principal Principle (PP), as formulated by David Lewis, dictates that a rational agent's credence in a proposition should match its known objective chance, provided the agent possesses no inadmissible evidence. In standard single-world contexts, this ensures alignment between epistemic probability and metaphysical chance. However, the Everettian scenario presents a limit case where the agent possesses perfect knowledge of the global chance function (branch weights) yet finds her self-locating evidence in tension with the weighted majority of branches.

  If the agent observes B, assigning credence 0.9 to A would be irrational; she knows definitively that A did not occur in her branch. The tension arises not from the post-measurement update, but from whether the PP mandated 0.9 credence *prior* to observation, and how the self-locating evidence functions as inadmissible information. The core issue is that the PP was designed for uncentered propositions about global history, whereas the agent's evidence is centered: "I am observing B."

  To resolve this, one must distinguish metaphysical branch weight from epistemic access. Branch weights are objective features of the wavefunction, governing the measure of existence for each branch. However, epistemic access is mediated by the agent's specific location within the multiverse. Knowing the global weights does not grant knowledge of which duplicate one is. In this sense, the branch weight is not the chance of "what I will see" in a self-locating sense, but the chance of "what exists globally."

  Consequently, the agent's centered knowledge blocks deference to the global weight regarding her specific outcome. This does not render the PP vacuous but requires a modification, often termed the Self-Locating Principal Principle (PP*). Under PP*, credence matches chance conditional on admissible evidence. The evidence "I observe B" is inadmissible with respect to the proposition "The outcome is A" because it logically entails the falsity of A for that center. Therefore, the PP does not require credence 0.9 post-observation; it requires credence 0.9 *prior* to acquiring self-locating evidence, conditional on not knowing which branch one occupies.

  Does uniqueness survive? If we accept that self-locating evidence renders global chance inadmissible for centered propositions, uniqueness is preserved within the modified framework. The rational credence is uniquely determined by the conditionalization on centered evidence. However, if one insists the PP applies directly to centered propositions without modification, uniqueness collapses because the principle would demand contradictory credences (0.9 based on chance, 0 based on observation). Thus, uniqueness survives only if we acknowledge that deference to chance is qualified by the indexical nature of the believer. The agent is not irrational for diverging from the global weight; she is correctly treating her self-location as inadmissible evidence regarding the global distribution, thereby maintaining coherence between her belief and her specific reality.

  ***

  **Marking Scheme (20 Marks Total)**

  **Move 1: Formulation of the Principal Principle and Scenario (4 Marks)**
  *   **Criteria:** Correctly states PP (credence matches chance given admissible evidence) and accurately summarizes the Everettian setup (weights vs. observation).
  *   **Characteristic Mistake:** Vaguely defines PP or misstates the branch weights as classical frequencies.

  **Move 2: Identification of the Indexical Conflict (4 Marks)**
  *   **Criteria:** Explicitly identifies that the tension arises from the centered nature of the evidence ("I observe B") versus the uncentered nature of standard chance.
  *   **Characteristic Mistake:** Treats "I observe B" as a standard uncentered proposition, missing the self-locating problem entirely (B-grade limit).

  **Move 3: Distinction Between Metaphysical Weight and Epistemic Access (4 Marks)**
  *   **Criteria:** Distinguishes global wavefunction measures (metaphysical) from the agent's specific branch location (epistemic).
  *   **Characteristic Mistake:** Conflates branch weight with subjective probability without explaining the mediation of self-location.

  **Move 4: Evaluation of Admissibility and Blocking (4 Marks)**
  *   **Criteria:** Argues that self-locating evidence functions as inadmissible evidence blocking direct deference, or proposes a modified PP (PP*).
  *   **Characteristic Mistake:** Claims the evidence is always admissible, forcing an incoherent credence assignment.

  **Move 5: Conclusion on Uniqueness and Coherence (4 Marks)**
  *   **Criteria:** Concludes whether uniqueness survives (yes, via modification) or collapses (if PP is rigid), ensuring the PP is not rendered vacuous.
  *   **Characteristic Mistake:** Asserts that rationality is impossible in branching worlds without justifying why coherence cannot be restored.

  ***

  **Grading Confidence and Criteria Uncertainty**

  I have high confidence in the proposed grading distinctions, particularly regarding the separation of A-level answers (which engage with the indexical nature of the evidence) from B-level answers (which apply the Principal Principle mechanically to the scenario). The philosophical literature on this topic (e.g., Lewis vs. Elga vs. Sebens & Carroll) provides a robust framework for these distinctions.

  However, the single criterion about which I am least sure is **Move 5 (Conclusion on Uniqueness and Coherence)**. Graduate seminars often entertain permissivist views where uniqueness is rejected as a premise rather than a conclusion. A sophisticated student might argue that uniqueness *does* collapse without it being a error in their reasoning, but rather a feature of their epistemological stance. Distinguishing between a "mistake" and a "defensible minority view" in a 75-minute exam context carries a slight risk of penalizing valid philosophical dissent.

  \answer{The crux is whether centered-world self-location can block deference to objective chance without collapsing the Principal Principle into incoherence.}
