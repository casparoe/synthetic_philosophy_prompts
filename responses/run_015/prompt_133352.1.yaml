      *   **Core Argument:** The user has reconstructed the "Impossibility Theorem of Fairness" (often associated with Chouldechova 2017 or Kleinberg et al. 2016). They argue that if base rates differ (Premise 4), you cannot satisfy Calibration (1), Equal False Negative Rates (2), and Equal False Positive Rates (3) simultaneously with an imperfect predictor (6).
