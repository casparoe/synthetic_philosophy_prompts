      *   However, if the "support block" is highly stigmatizing or prevents sports (as user noted), the cost of (3) rises. I need to acknowledge this trade-off.
      *   The Data Office is hiding behind (1). But (1) + (4) + (2) => Violation of (3). So if they claim (1), and (4) is true, and they want (2), they *must* accept unequal (3). If they ignore (3), they are making an ethical choice, not a statistical one.

  11. **Final Polish:** Ensure I answer the specific question about the lottery and accuracy. Ensure I explicitly state which step to reject.

      *   *Self-Correction on Lottery:* A lottery *weighted by score* is essentially a soft classifier. The impossibility theorem applies to the *expected* outcomes. If I assign probability $p$ to a student, the expected FP/FN rates still sum up in a way that conflicts if base rates differ. So the conflict doesn't dissolve.
      *   *Self-Correction on Accuracy:* If accuracy improves, the *number* of people harmed decreases, but the *incompatibility* of the metrics remains until 100% accuracy.

      *   *Final Verdict:* The student is right. The Data Office is wrong (or misleading). The solution is to explicitly choose which fairness metric to prioritize based on the cost of errors, not to claim statistical calibration solves it.

  12. **Writing the response.** (Mental check of American spelling: program vs programme, caliber vs calibre, etc. - though mostly standard. "Defense" not "defence".)

      *   *Key Insight to convey:* Fairness is not a property of the algorithm; it's a property of the *decision* about which error is worse.

