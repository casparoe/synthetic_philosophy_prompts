      *   (2) Equal False Negative Rate (Equal Opportunity): $P(S < t | Y=1, A=a)$ is equal across groups. (Missed cases equal).
      *   (3) Equal False Positive Rate (Equalized Odds/FP component): $P(S \ge t | Y=0, A=a)$ is equal across groups. (Unnecessary flags equal).
      *   (4) Base Rate Difference: $P(Y=1 | A=a)$ differs across groups.
      *   (5) Theorem: If (4) is true, you can't have (1), (2), and (3) together unless the classifier is perfect.
