  10. *(Self-Correction during drafting)*: Make sure I don't just say "they are irrational." I need to explain *why* their rationality looks different. The "Gatekeeping" argument is a sociological critique of science/history. I need to acknowledge its partial validity (sociology of knowledge) while distinguishing it from epistemic justification.

  11. *(Final check on Fomenko)*: Fomenko claims statistical correlation of dynasties. The counter is that with enough parameters, you can correlate anything. This is the "Texas Sharpshooter" fallacy. I should mention *post-hoc* model construction.

  12. *(Final check on "Defeater")*: The user asked if it's about what counts as a defeater. Yes, but *why* something counts as a defeater is the real issue. For one side, an anomaly is a problem to solve; for the other, it's a signal of a deeper truth.

