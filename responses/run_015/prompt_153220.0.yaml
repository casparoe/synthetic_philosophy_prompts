answer: |-
  This stall is not a failure of your group's analysis; it is a structural feature of the specific epistemic terrain you are walking on. You are stuck because you are treating this as a demarcation problem (Science vs. Pseudoscience), but in the context of history, it is actually a conflict between **Epistemic Authority** and **Narrative Closure**.

  The disagreement is not primarily empirical (about the data) nor purely normative (about values). It is **meta-epistemic**: it is a disagreement about the *cost of coherence*.

  Here is a diagnosis of why the stall happens, broken down by the three specific friction points you identified, followed by a proposal for how to move past it.

  ### 1. The "Gatekeeping" Charge is a Bayesian Prior Dispute
  When defenders say historians are "gatekeeping a consensus story," they are not making an empirical claim about carbon dating. They are making a claim about the **prior probability of institutional deception**.

  *   **The Historian's Bayes:** The prior probability that the global community of historians, archaeologists, and geneticists is engaged in a coordinated fabrication is near zero. Therefore, when data conflicts with a theory (e.g., an artifact is dated to 2000 BCE, but the theory requires 10,000 BCE), the theory is the variable that must update.
  *   **The Pseudohistorian's Bayes:** The prior probability that established institutions obscure "true" history (to maintain power, colonial narratives, or religious hegemony) is high. Therefore, when data conflicts with the theory, the *data* or the *institution interpreting it* is the variable that must update.

  **Why the stall happens:** You cannot resolve this empirically. If you present a radiocarbon date, the pseudohistorian interprets the calibration curve as part of the "consensus story" being protected. The "non-updating" charge historians level is technically correct (the belief state doesn't shift), but the pseudohistorian views this as *rational resistance* to a corrupt epistemic authority, not irrationality.

  **Diagnosis:** This is not a disagreement about what counts as a defeater; it is a disagreement about **who holds the keys to the defeater.**

  ### 2. The Normative Clash: Fragmentation vs. Completion
  You asked if this is normative—whether history owes us revisionism. It is deeper than that. It is about the **telos (purpose) of historical inquiry.**

  *   **Academic History:** Accepts fragmentation, uncertainty, and gaps as ontological features of the past. The "best explanation" is often a messy, probabilistic reconstruction that leaves questions unanswered. A good historical theory *should* leave anomalies unresolved if the evidence isn't there.
  *   **Pseudohistory (Atlantis, Aliens, Fomenko):** Operates on a norm of **Narrative Closure**. The past *must* make sense as a complete puzzle. Gaps are not features; they are evidence of suppression or lost knowledge. Fomenko's statistical dynasty matching is appealing not because it is robust, but because it eliminates the "messiness" of chronology. It makes the past look like a solved equation.

  **Why the stall happens:** The "Gatekeeping" accusation is actually a complaint that historians refuse to provide Narrative Closure. When historians say, "We don't know," pseudohistorians hear, "We won't tell you." When pseudohistorians offer a unified theory of everything, historians hear, "I am ignoring the noise."

  **Diagnosis:** They are not practicing different versions of the same method; they are engaging in different **genres**. One is *reconstruction* (history); the other is *myth-making* (pseudohistory). The stall occurs because both sides insist they are playing the same game.

  ### 3. Fomenko and the Problem of "Methodological Mimicry"
  Fomenko is the hardest case because he uses the language of science (statistics, dynamical systems) rather than just storytelling. This creates a specific type of stall: **Overfitting.**

  *   **The Mimicry:** Fomenko treats historical records as data points to be correlated. He finds statistical parallels between dynasties.
  *   **The Flaw:** This is a "Texas Sharpshooter" problem. He draws the target *after* firing the shots. He has enough degrees of freedom in his statistical model to find correlations in any sufficiently large dataset.
  *   **The Stall:** Historians say, "Your model is arbitrary." Fomenko says, "Your model is dogmatic."

  The disagreement here is about **predictive risk**. Academic history risks being boring and uncertain to avoid being wrong. Fomenko risks being spectacularly wrong to avoid being boring. The "defeater" question here is about **parameter freedom**. How many adjustments can you make to a theory before it explains everything and therefore nothing?

  ### How to Move the Debate (Or Accept the Ill-Posedness)

  You asked if a sharper falsifiability condition or conceptual split could move this. Standard falsifiability fails here because pseudohistories are often immune to falsification by design (the "conspiracy" absorbs the negative evidence).

  Instead, try shifting the frame from **Demarcation** to **Epistemic Virtues**. Stop asking "Is this history?" and start asking "What is the cost of this explanation?"

  **1. The "Cost of Coherence" Test**
  Propose this criterion: *A historical explanation is pseudohistorical if the coherence of the narrative is purchased at the cost of ad hoc assumptions that exceed the explanatory power of the anomalies they resolve.*
  *   **Application:** To believe the Ancient Alien theory, you must assume interstellar travel, secret global cooperation among governments, and a universal amnesia. The "cost" of these assumptions is higher than the "cost" of accepting that ancient humans were clever but earthbound.
  *   **Why it helps:** It moves the debate from "Who is gatekeeping?" to "Which explanation is more parsimonious?" It forces the pseudohistorian to defend the *complexity* of their conspiracy, not just the *possibility*.

  **2. Distinguish "Revisionism" from "Rejectionism"**
  Make a conceptual split between **Methodological Revisionism** (updating history based on new evidence within the existing framework) and **Framework Rejectionism** (discarding the framework because it doesn't yield a satisfying story).
  *   **The Move:** Concede that historians *do* gatekeep in the sense of maintaining standards. Ask the group: *Is this gatekeeping epistemic (protecting truth) or sociological (protecting status)?*
  *   If the pseudohistorian cannot demonstrate a mechanism for the conspiracy that is more plausible than the mechanism of academic peer review, the "gatekeeping" charge collapses into a sociological suspicion, not an epistemic argument.

  **3. Accept the "Genre" Diagnosis**
  The most productive move might be to declare the question **ill-posed as a scientific demarcation problem** and reframe it as a **sociological function problem**.
  *   Pseudohistory serves a different social function than academic history. It provides identity, meaning, and agency (we are the ones who *know*). Academic history provides accuracy and uncertainty.
  *   **The Conclusion:** The stall exists because you are trying to use epistemic tools to solve a psychological need. The pseudohistorian isn't trying to win a debate about carbon dating; they are trying to win a debate about *meaning*.

  ### Recommendation for the Group
  Stop trying to prove Fomenko wrong mathematically or the Atlantis claims wrong archaeologically. You will never win, because the evidence is not the bottleneck.

  **Run this experiment:** Ask the defenders of pseudohistory to write down the specific piece of evidence that *would* change their mind.
  *   If they say "Nothing," they have admitted it is a belief system, not a historical method.
  *   If they name something impossible (e.g., "A written confession from the Pharaoh"), they have admitted the standard of evidence is rigged.
  *   If they name something reasonable, ask why the current absence of that evidence isn't already a defeater.

  **Verdict:** The disagreement is **Normative** (what history is *for*) disguised as **Empirical** (what the data *says*). You can resolve the stall by admitting that pseudohistory is a competing *mythology*, not a competing *science*. Once you stop treating it as a failed attempt at history and start treating it as a successful attempt at myth-making, the demarcation becomes clear: History tolerates uncertainty; Myth cannot.
