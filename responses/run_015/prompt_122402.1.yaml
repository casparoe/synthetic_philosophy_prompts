  hey so i'm in this philosophy club thing at school and our teacher handed out a packet on whether real moral dilemmas are possible, and i cant tell how much of it is the actual debate vs just his own take dressed up as the consensus. here's the main chunk, copy pasted from the handout (his words not mine):

  "A genuine moral dilemma isn't just a hard decision. It's when two real obligations both apply to you and you can't do both — like you promised your friend you'd help him move and promised your sister you'd be at her game the same afternoon, and you can't be in two places at once. The standard argument against these is simple: if you ought to do A and you also ought to do B, then deontic logic lets you combine those into 'you ought to do A and B,' and since 'ought implies can,' and you can't do both, you get a contradiction and the whole idea blows up. But that argument only has force if you accept 'ought implies can,' and most people who believe in real dilemmas just reject that principle — they're happy to say you can be morally required to do something impossible, and that's exactly why these cases are tragic rather than just difficult. The Williams side adds that even after you've chosen, something is left over: you feel bad about the thing you didn't do, and that leftover feeling is a kind of guilt, which is the evidence that you did something wrong whichever way you went. They call it the moral remainder. Here's a rough test I use for telling a real dilemma from a choice that's merely hard — call it the 'what do you say after' test: if, once it's over, you'd owe the person you let down an apology or you'd feel you should make it up to them, it was a genuine dilemma; if you can walk away saying 'that was the right thing, full stop,' then it was only ever a hard choice. And the practical upshot: in a genuine dilemma both options are equally okay, so it genuinely dosen't matter which one you pick and there's no point agonizing over it."

  i think the regret part is right honestly, that bit makes sense to me, but the last line dosen't sit right — feels like sometimes one option is clearly worse even if both leave you feeling bad?? and i have no idea what to make of the apology test, it sounds kind of made up (is it a real thing anyone uses or did he just invent it). the reason i actually care is my own situation: my best friend told me something in confidence, then my mom asked me about it straight to my face and i lied to her. i feel awful about lying to my mom but i don't think i'd take it back. is that even a dilemma or am i just overthinking a normal guilty conscience

  so — can you go through the handout part by part and tell me what's actually standard in this debate, where he's overstating or sliding two different claims together, and what someone who really defends the existence of genuine dilemmas would object to in his version? especially: is rejecting 'ought implies can' really the move they make, and does the "either option is fine" conclusion follow even from the parts he got right? please don't give me citations or reading lists, i can't do anything with those, i just want to know which sentences to believe and which to be suspicious of
