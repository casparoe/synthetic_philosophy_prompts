  You have good instincts. Your skepticism about the last line is spot-on, and your confusion about the "Ought Implies Can" section is justified because your teacher is simplifying a very complex debate into a single narrative.

  Here is a breakdown of the handout, sentence by sentence, separating standard philosophical consensus from your teacher's specific (and debatable) interpretation.

  ### 1. The Definition
  > *"A genuine moral dilemma isn't just a hard decision. It's when two real obligations both apply to you and you can't do both..."*

  **Verdict:** **Standard.**
  This is the widely accepted starting point for the debate. Everyone agrees on this definition. A "hard choice" is when one option is clearly better but difficult to do; a "dilemma" is when two competing moral rules demand opposite actions.

  ### 2. The Argument Against Dilemmas
  > *"The standard argument against these is simple: if you ought to do A and you also ought to do B, then deontic logic lets you combine those into 'you ought to do A and B,' and since 'ought implies can,' and you can't do both, you get a contradiction..."*

  **Verdict:** **Accurate.**
  Your teacher has correctly summarized the logical argument used by philosophers who say real dilemmas are impossible. If morality is a consistent system, it shouldn't command the impossible. This part is reliable.

  ### 3. The "Ought Implies Can" Claim
  > *"But that argument only has force if you accept 'ought implies can,' and most people who believe in real dilemmas just reject that principle — they're happy to say you can be morally required to do something impossible..."*

  **Verdict:** **Overstated / Controversial.**
  This is where your teacher starts sliding into a specific viewpoint.
  *   **The Truth:** Some philosophers who defend dilemmas *do* reject "Ought Implies Can" (OIC). They argue that morality can demand the impossible, and the tragedy is that you will fail no matter what.
  *   **The Nuance:** However, *many* other philosophers who defend dilemmas **keep** OIC. Instead of rejecting OIC, they argue that the two "oughts" aren't absolute. They might say you have a *prima facie* duty to A and a *prima facie* duty to B, but once you realize you can't do both, one of those duties dissolves or is overridden.
  *   **Why it matters:** Your teacher makes it sound like rejecting OIC is the *only* way to defend dilemmas. It isn't. It's actually a very radical move to reject OIC, because it breaks a lot of how we normally think about responsibility.

  ### 4. The Williams / Moral Remainder Point
  > *"The Williams side adds that even after you've chosen, something is left over: you feel bad about the thing you didn't do, and that leftover feeling is a kind of guilt, which is the evidence that you did something wrong whichever way you went. They call it the moral remainder."*

  **Verdict:** **Standard / Reliable.**
  This refers to the philosopher Bernard Williams. This is a very respected and common argument in this debate. The idea is that if you made the *only* right choice, you shouldn't feel guilty. If you feel "agent-regret" or a "moral remainder," it suggests that you really did violate a moral obligation, even if you did the right thing overall. Your intuition that "the regret part is right" is philosophically sound.

  ### 5. The "Apology Test"
  > *"Here's a rough test I use for telling a real dilemma from a choice that's merely hard — call it the 'what do you say after' test: if, once it's over, you'd owe the person you let down an apology or you'd feel you should make it up to them, it was a genuine dilemma..."*

  **Verdict:** **Teacher's Invention.**
  This is not a standard philosophical test found in textbooks. It sounds like a heuristic your teacher created to help students visualize the concept of "moral remainder."
  *   **Is it useful?** Yes, somewhat. If you feel you owe reparations, it suggests a duty was violated.
  *   **Is it definitive?** No. You might apologize in a hard choice just to be polite, or you might not apologize in a dilemma because you know the other person would agree you had no choice. It's a rule of thumb, not a logical proof.

  ### 6. The "Equally Okay" Conclusion
  > *"And the practical upshot: in a genuine dilemma both options are equally okay, so it genuinely dosen't matter which one you pick and there's no point agonizing over it."*

  **Verdict:** **Highly Suspicious / Likely False.**
  This is the biggest red flag in the handout.
  *   **Why it's wrong:** Most philosophers who argue *for* the existence of genuine dilemmas argue the exact opposite. They say dilemmas are **tragic**. If both options were "equally okay," it wouldn't be a dilemma; it would be a choice between two indifferent options (like choosing between two identical cans of soup).
  *   **The Agony:** The whole point of a moral dilemma is that it *does* matter, and that is why it hurts. If you believe in moral remainders (which your teacher says you should), you are admitting that something valuable was lost. If something valuable was lost, then the options weren't "equally okay."
  *   **The Contradiction:** Your teacher contradicts himself. He says you feel guilt because you did something wrong (Claim 4), but then says it doesn't matter which you pick (Claim 6). If you did something wrong either way, it matters deeply which you pick, because you have to live with the specific wrong you chose.

  ---

  ### Applying this to your situation

  You asked about your specific scenario: *Friend's confidence vs. Mom's direct question (you lied).*

  **Is it a dilemma?**
  Philosophically, this is a classic conflict of duties: **Loyalty/Privacy** vs. **Honesty/Obedience.**
  *   **According to the Handout:** You feel awful (Moral Remainder), but you wouldn't take it back (You think you made the right all-things-considered choice). The handout's "Apology Test" suggests you might owe your mom an explanation later, even if you don't take back the lie.
  *   **According to Standard Theory:** This is likely a **conflict of *prima facie* duties** rather than a "genuine metaphysical dilemma."
      *   You had a duty to your friend.
      *   You had a duty to your mom.
      *   You couldn't do both.
      *   You weighed them and decided loyalty to the friend was the stronger duty *in this specific instance*.

  **Why you feel guilty:**
  Even if you made the "right" choice (protecting the friend), you still violated the duty of honesty to your mom. That violation leaves the "moral remainder" (the guilt). This fits the Bernard Williams section of the handout perfectly.

  **Does the "Equally Okay" rule apply?**
  No. It clearly mattered which you picked. If you had told your mom the secret, you would have betrayed your friend. That would likely have been worse (given that you say you wouldn't take back the lie). So the options were **not** equally okay. One was less bad, or more important, but both carried a cost.

  ### Summary: What to believe

  1.  **Trust:** The definition of a dilemma (two conflicting obligations).
  2.  **Trust:** The concept of "moral remainder" (feeling bad afterwards proves a duty was violated).
  3.  **Be Suspicious:** The claim that defending dilemmas *requires* rejecting "Ought Implies Can." (Many defenders keep it).
  4.  **Be Suspicious:** The "Apology Test." (It's a classroom tool, not a philosophical rule).
  5.  **Reject:** The idea that "both options are equally okay." (This undermines the tragedy of the dilemma).

  **On your situation:** You aren't overthinking it. You are experiencing exactly what the "moral remainder" concept describes. You made a choice you stand by, but the cost of that choice (lying to your mom) still weighs on you. That doesn't mean you chose wrong; it means you were in a situation where there was no cost-free option. That is the definition of a hard moral choice, even if it isn't a "genuine dilemma" in the strictest logical sense.
