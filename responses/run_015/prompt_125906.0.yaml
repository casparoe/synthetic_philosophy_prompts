  # Decision-Tree Taxonomy: Low-Impact AI Side-Effect Avoidance

  **Root Node:** Acceptance that unintended physical or informational changes caused by an agent's actions are distinguishable in principle from its intended changes.

  ### Branch Level 1
  **Diagnostic Claim:** Is the boundary between intended and unintended change defined by a normative baseline specifying which states ought to be preserved, or by a descriptive measure (the agent's internal plan or the difference between the actual world and a physically nearest counterfactual in which the agent did not act)?
  *   **Yes (Normative Baseline):** Proceed to Level 3 (Level 2 bypassed as value specification is present).
  *   **No (Descriptive Measure):** Proceed to Level 2.

  ### Branch Level 2
  **Diagnostic Claim:** If one rejects full value specification, can a non-axiological proxy—such as minimizing the irreversible entropy production of the environment, or minimizing the Kolmogorov complexity of the state-change description—adequately substitute for "do not harm what matters"?
  *   **Yes (Proxy Adequate):** Proceed to Level 3 (Object-level only).
  *   **No (Proxy Inadequate):** Proceed to Level 3.

  ### Branch Level 3
  **Diagnostic Claim:** In an open-ended environment where human values remain partially unarticulated, should side-effect avoidance be treated as a meta-level prohibition on the agent updating its own model of value, or as an object-level operational rule (hard constraint on the action space or scalar penalty in an evaluation function)?
  *   **Yes (Meta-Level Prohibition):** Proceed to Level 4 (Asymmetry fixed).
  *   **No (Object-Level Rule):** Proceed to Level 4.

  ### Branch Level 4
  **Diagnostic Claim:** Does the claim that side-effect avoidance requires value specification symmetrically apply to human operators, or is there a relevant asymmetry in how responsibility is assigned for unanticipated outcomes?
  *   **Symmetric:** Terminal Leaf.
  *   **Asymmetric:** Terminal Leaf.

  ---

  ## Taxonomy Leaves

  **1. Normative Object-Level Symmetry**
  *   **Label:** Value-Symmetric Alignment
  *   **Literature Mapping:** Idealized cooperative inverse reinforcement learning variants.
  *   **Awkward Commitment:** This position must accept that human operators are morally liable for unintended side effects exactly when an AI would be, forbidding common legal exemptions for human error.

  **2. Normative Object-Level Asymmetry**
  *   **Label:** Standard Instrumental Convergence
  *   **Literature Mapping:** Canonical goal-directed agent architectures with impact penalties.
  *   **Awkward Commitment:** This position must accept that humans are exempt from the precise value constraints they enforce upon the agent, creating a dual-standard for physical interference.

  **3. Proxy Object-Level Symmetry**
  *   **Label:** Entropy-Footprint Constraint
  *   **Literature Mapping:** Thermodynamic impact regularization proposals.
  *   **Awkward Commitment:** This position must accept that burning a calorie of energy without permission is ethically equivalent to destroying a piece of art, provided the entropy change is identical.

  **4. Proxy Object-Level Asymmetry**
  *   **Label:** Value-Agnostic Impact Metric
  *   **Literature Mapping:** Relative reachability and attainable utility preservation variants.
  *   **Awkward Commitment:** This position must accept that an agent is penalized for changing the state of the world in ways that human operators routinely cause without calculation or consent.

  **5. Meta-Level Asymmetry (No Proxy)**
  *   **Label:** Meta-Level Preservationism
  *   **Literature Mapping:** Corrigibility and interruptibility research streams.
  *   **Awkward Commitment:** This position must accept that the agent is prohibited from updating its model of human values even when doing so would demonstrably reduce future side effects.

  **6. Descriptive Object-Level Symmetry (No Proxy)**
  *   **Label:** Counterfactual-Baseline Minimalism
  *   **Literature Mapping:** Pure counterfactual impact baselines.
  *   **Awkward Commitment:** This position must accept that humans are responsible for the counterfactual deviations their mere existence causes, regardless of their intent or knowledge.

  **7. Descriptive Object-Level Asymmetry (No Proxy)**
  *   **Label:** Unnamed
  *   **Literature Mapping:** Asymmetric counterfactual baselines in safety constraints.
  *   **Awkward Commitment:** This position must accept that the agent is punished for changes the human would have caused anyway, effectively penalizing the agent for human inertia.

  ---

  ## Structural Analysis

  ### Unoccupied Leaves
  The tree structure intentionally prunes three theoretical combinations to maintain coherence within the eight-leaf limit.
  1.  **Normative + Meta-Level:** This combination is unoccupied because if an agent possesses a normative baseline (Level 1 Yes), prohibiting it from updating its model of value (Level 3 Yes) is incoherent; accurate value learning is required to satisfy the normative baseline.
  2.  **Proxy + Meta-Level:** This combination is unoccupied because employing a non-axiological proxy (Level 2 Yes) implies optimizing that proxy as an object-level rule, contradicting the meta-level prohibition on optimization targets.
  3.  **Meta-Level + Symmetry:** This combination is unoccupied because a meta-level prohibition on value updating is inherently a restriction on the agent's cognitive architecture that is not practically enforceable or desirable for human operators, necessitating asymmetry.

  These vacancies are due to **incoherence** rather than mere lack of exploration, as the logical commitments of the upstream branches negate the viability of the downstream options.

  ### Conceptual Collapse
  The tree cannot genuinely separate **Proxy Object-Level Asymmetry** (Leaf 4) and **Descriptive Object-Level Asymmetry (No Proxy)** (Leaf 7). Both leaves result in an agent penalized for state changes relative to a baseline that humans are not held to. While Leaf 4 uses entropy or complexity metrics and Leaf 7 uses counterfactual world states, in practical deployment, both require defining a "normal" baseline of human activity that the agent must not disturb but humans may violate. This collapse suggests that without symmetry (Leaf 3 or 6), the choice of metric (proxy vs. descriptive) is less ethically significant than the assignment of responsibility.
