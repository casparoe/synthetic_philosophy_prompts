answer: |-
  Prioritize empirically verifying whether technological baselines persist through institutional collapses, because resolving this ontological coupling is the prerequisite for any valid formal modeling or governance application.

  This question upstreams your idea about embedding linear metrics in cyclical models. You cannot mathematically embed variable A inside variable B if you do not know whether A ceases to exist when B crashes. If energy capture resets to subsistence levels during a political collapse (the "Dark Ages" hypothesis), the system is a single coupled equation with reset functions. If energy capture ratchets upward despite political fragmentation (the "Industrial Resilience" hypothesis), the system requires decoupled variables with distinct time constants. This is a binary ontological switch that determines the mathematical structure of the entire project. The philosopher must define the categories of "collapse" and "progress" to ensure you are not comparing apples to oranges, while the historian tests these definitions against existing quantitative databases like Seshat or energy capture datasets. This is more fundamental than asking whether decline is continuous or discrete, because the shape of the decline matters less than whether the underlying capacity survives it.

  This priority is also the most tractable without new archives. The data exists but is siloed. Political complexity scores exist; energy capture estimates exist; population density data exists. The friction is conceptual and integrative, not empirical. A formal modeler can build simple coupling tests immediately once the historian and philosopher agree on what counts as a "match" in time and space. This fits a three-year window better than trying to solve the continuous versus discrete decline question, which requires higher-resolution data that might not exist for pre-modern societies. Your third question about predictive or normative work must rank last because getting the coupling wrong makes governance advice dangerous. If you assume linear progress protects you from cyclical collapse, but it doesn't, your policy recommendations will fail catastrophically. If you assume collapse wipes out progress, but it doesn't, you might waste resources defending institutions that are expendable. Solving the coupling question provides the highest leverage risk mitigation for the subsequent normative work.

  I am using three criteria for this ordering: logical priority, data availability, and risk of error. Logical priority dictates that you must know what exists before you model how it interacts. Data availability dictates that you should solve problems where the evidence is already on the shelf rather than planning digs that will outlast your funding. Risk of error dictates that you should resolve the variables with the highest cost of misunderstanding before deriving policy implications.

  You should reorder this list if the historian finds zero correlation between political collapse and technological retention across all major cases. In that scenario, drop the modeling effort and pivot to a purely philosophical taxonomy of history types, as a general model would be impossible. Reorder if the modeler demonstrates that the noise in the data makes coupling statistically indistinguishable from randomness within year one; shift the team's focus to qualitative case studies of specific transitions rather than general laws. Finally, reorder if the philosopher identifies a category error where "linear progress" is actually a function of the cyclical institution itself; in that case, abandon the nested framework entirely and rewrite the core thesis.
