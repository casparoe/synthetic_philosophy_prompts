answer: |-
  Your hypothesis is astute and aligns with the most rigorous modern reconstructions of the debate. The stalemate persists not because the arguments are weak, but because the two camps are operating within incommensurable paradigms of what an economy *is* and what economic theory *does*.

  Here is a diagnosis of the structure of the disagreement, broken down by the layers you identified, followed by an assessment of what constitutes genuine progress.

  ### 1. Diagnosis: Where They Engage and Where They Talk Past

  The debate is not a single argument but a collision of three distinct layers. Confusion arises when participants treat a disagreement on one layer as if it were occurring on another.

  #### Layer A: The Ontological Disagreement (Allocation vs. Discovery)
  This is the deepest layer and validates your hypothesis.
  *   **The Lange/Neoclassical View:** The economic problem is one of **allocation**. Preferences and technological constraints are treated as *given data*. The task is to solve for the optimal distribution of resources to satisfy those preferences. The economy is a machine to be tuned. Equilibrium is the goal; deviation is error.
  *   **The Mises/Hayek View:** The economic problem is one of **discovery**. Preferences and technologies are not given; they are created, revealed, and altered through the process of exchange itself. The economy is an evolutionary ecosystem. Equilibrium is a hypothetical limit that is never reached; the *process* of moving toward it (driven by profit and loss) is the reality.

  **Diagnosis:** When Lange offers a solution to the allocation problem (iterative trial and error to clear markets), he believes he has answered Mises. Mises and Hayek reply that he has solved the wrong problem. You can allocate existing resources efficiently via a central board, but you cannot *discover* new resources, new methods, or new wants without the genuine risk of capital loss. They are describing different tasks: **optimization vs. evolution.**

  #### Layer B: The Epistemological Disagreement (Data vs. Knowledge)
  This layer concerns the nature of the information prices convey.
  *   **The Lange View:** Information is **objective and codifiable**. While the volume of data is large, it is theoretically reducible to equations (quantities, marginal rates of substitution). If computing power is high enough, or if the trial-and-error loop is fast enough, the central board can approximate the information contained in market prices.
  *   **The Hayek View:** Information is **subjective and tacit**. Much of the knowledge required for economic action is "knowledge of time and place"—knowing a machine is running hot, knowing a local supplier is unreliable, knowing a specific customer's unarticulated desire. This knowledge exists only in the act of using it; it cannot be written down and transmitted to a center without losing its essence.

  **Diagnosis:** This is partly verbal. Both sides use the word "information," but Lange means *data points* (which can be centralized), while Hayek means *contextual understanding* (which cannot). Modern arguments about AI and Big Data replay this exactly: proponents argue all behavior leaves data trails (Langean), while critics argue data trails are historical records, not the forward-looking judgment of the entrepreneur (Hayekian).

  #### Layer C: The Institutional Disagreement (Rules vs. Property)
  This layer concerns the mechanism of incentives and responsibility.
  *   **The Lange View:** Incentives are **engineerable**. A manager can be instructed to minimize cost and set price equal to marginal cost. If they fail, they are punished by the bureaucracy. Property rights are a legal convenience, not an epistemological necessity.
  *   **The Mises View:** Incentives require **residual claimancy**. Rational calculation requires that the person making the decision bears the uncertainty of the outcome. Without private ownership of the means of production, there is no genuine transfer of title, no genuine exchange, and therefore no genuine price. A "shadow price" set by a board is an accounting fiction because it lacks the backing of real capital at risk.

  **Diagnosis:** This is where the normative hides inside the technical. Mises argues that without private property, you literally *cannot* calculate (technical claim). Lange argues you *can* calculate but must instruct managers differently (technical claim). However, underneath is a disagreement about human agency: Is the entrepreneur a function that can be simulated by a rule-following bureaucrat, or is the entrepreneur a distinct agent whose drive comes from the possibility of owning the surplus?

  ### 2. Is the Disagreement Verbal, Empirical, or Normative?

  It is a hybrid of all three, which explains the intractability.

  **1. It is Verbal (Equivocation):**
  The term "price" is the primary culprit. For Lange, a price is a **parameter** used to balance equations. For Mises, a price is a **phenomenon** emerging from the clash of valuations over property. When Lange says, "We will use prices," Mises hears, "We will use numbers that look like prices." They agree on the word but disagree on the ontology of the thing the word describes. Similarly, "planning" for Lange means conscious coordination of production; for Hayek, the market *is* a planning procedure (catallaxy), just not one directed by a single mind.

  **2. It is Empirical (but Unfalsifiable):**
  Both sides claim empirical support, but the counterfactuals are impossible to test.
  *   **Market Socialists** point to the growth of the USSR in its early decades or the success of indicative planning in post-war France as evidence that calculation is possible.
  *   **Austrians** point to the eventual stagnation and collapse of the USSR as evidence that without capital markets, innovation dies.
  *   **The Problem:** The Lange Model was never implemented in its pure form (with genuine consumer sovereignty and manager autonomy), and a pure Misesian system is hard to isolate from state intervention. Because the debate is about the *limits* of a system (can it work *at all*?), a system that works "well enough" for 50 years then collapses allows both sides to claim vindication.

  **3. It is Normative (Masked as Technical):**
  There is a hidden disagreement about the **nature of authority**.
  *   The Langean view implicitly trusts that a central board can remain neutral and technocratic, acting as a surrogate for the market without imposing its own values.
  *   The Misesian view assumes that any centralization of economic power inevitably becomes political power, distorting the calculation.
  This is often framed as a technical question ("Can they get the prices right?") but rests on a normative intuition ("Ought a single entity to hold that much power?"). However, the Austrians argue this is not just a moral "ought" but a practical "cannot"—the power distorts the knowledge required to wield the power.

  ### 3. Assessment: What Would Count as Progress?

  Given this diagnosis, declaring a "winner" based on historical precedent or mathematical elegance is impossible. Progress requires disentangling the layers.

  **1. Conceptual Distinction (The Most Vital Step)**
  Progress requires explicitly separating **Static Efficiency** (Lange's domain) from **Dynamic Efficiency** (Hayek's domain).
  *   If the question is "Can a central board allocate existing resources to meet known demands without massive waste?" the answer is likely "Yes, to a significant degree," especially with modern computing. Lange wins this round.
  *   If the question is "Can a central board generate the innovation and adaptation required for long-term growth in an uncertain environment?" the answer is likely "No," because the mechanism for generating new knowledge (entrepreneurial rivalry) is missing. Hayek wins this round.
  *   **Progress:** Stop asking "Is planning possible?" and start asking "What *kind* of coordination is required for the specific economic outcome we desire?" If the goal is stability and basic provision, Langean mechanisms may suffice. If the goal is innovation and growth, Misesian mechanisms are required. Acknowledging that these are different goals dissolves the stalemate.

  **2. Institutional Experiments (Limited Value)**
  An experiment holding variables constant is nearly impossible because "private property" is a bundle of rights, not a switch. However, the rise of **internal markets within firms** offers a testing ground.
  *   Large corporations often function as planned economies (Langean) internally, using transfer pricing (shadow prices) to allocate resources between divisions.
  *   **The Test:** Do firms that rely heavily on internal transfer pricing outperform firms that spin off divisions into independent profit centers with genuine equity stakes?
  *   **Limitation:** Firms exist within a broader market economy that provides external benchmarks. A socialist economy has no external market to reference. So, while informative, corporate experiments cannot fully settle the macro debate.

  **3. Acknowledging Bedrock Intuitions (The Hard Limit)**
  Ultimately, a portion of this disagreement is rooted in irreconcilable views of **human action**.
  *   If you view humans as **optimizers** reacting to constraints, the Lange model is theoretically viable (given enough compute).
  *   If you view humans as **creators** who alter constraints, the Lange model is ontologically impossible.
  *   **Progress:** This cannot be "dissolved" by experiment. It requires philosophical clarity. Participants must admit: "I am arguing from a neoclassical equilibrium framework" or "I am arguing from an Austrian disequilibrium framework." The stalemate persists because each side tries to prove the other's framework wrong using the tools of their own framework.

  ### Conclusion

  The debate is not a single puzzle waiting to be solved; it is a category error. Lange answered Mises' question about **accounting** with a solution for **engineering**. Mises answered Lange's solution for **engineering** with a warning about **evolution**.

  Genuine progress would not look like a definitive proof that one side was "right." It would look like a taxonomy that admits:
  1.  **Allocation** of known resources can be simulated (Lange was partially right).
  2.  **Discovery** of unknown opportunities cannot be simulated (Mises/Hayek were right).
  3.  **Prices** serve both functions, but the discovery function requires property rights that the allocation function does not.

  Until the discussion shifts from "Can socialism calculate?" to "What kind of calculation is necessary for a dynamic economy, and which institutions support that specific kind?", the arguments will continue to recycle, with each side correctly refuting a claim the other side is no longer making.
