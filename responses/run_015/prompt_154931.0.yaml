  ## Part V: Where The Instrument Fails

  **Indistinguishable Leaves:**
  *   **L3 (Lexical) vs. Steep Prioritarianism:** Behaviorally identical on Q5.
      *   *Separation Case:* "The Fading Torture." A torture that fades to a headache over 100 years vs. immediate headache. Lexical views might struggle with the boundary; Prioritarians weight the intensity curve.
  *   **L9 (Illusionist) vs. L10 (Veridicalist):** Only separates on Q2.
      *   *Separation Case:* "The Experience Machine." If Q2 is ambiguous, these views merge. Nothing fully separates them except metaphysical commitment to truth.
  *   **L6 (Person-Affecting) vs. L1 (Strict NU):** On Q1, if the world is net-negative, both press the button.
      *   *Separation Case:* "The Last Happy Man." One happy person remains. L1 presses (suffering of non-existence = 0 < happiness). L6 hesitates (harming existing person).

  **Occupancy Confidence:**
  *   **Widely Defended:** L1, L3, L4, L5, L10.
  *   **Defended by a Handful:** L2, L6, L7, L9, L11.
  *   **Unsure/Constructed:** L8, L12. (These feel like theoretical possibilities rather than schools of thought).

