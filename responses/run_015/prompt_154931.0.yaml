  ## Part III: Scoring Key & Leaves
  *Map your answer pattern to the following Leaves. If you fit multiple, choose the one whose "Awkward Commitment" you find least repulsive.*

  | Leaf | Position Name | Answer Profile | Extinction Verdict? | Confidence |
  | :--- | :--- | :--- | :--- | :--- |
  | **L1** | **Strict Negative Utilitarianism** | Q1=A | **Yes** (Good) | Widely Defended |
  | **L2** | **Soft Negative Utilitarianism** | Q1=C, Q5=A | **Yes** (Permissible) | Handful |
  | **L3** | **Lexical Suffering-First** | Q1=B, Q5=A, Q7=A | **No** | Widely Defended |
  | **L4** | **Moderate Negative Utilitarianism** | Q1=B, Q5=B, Q3=B | **No** | Widely Defended |
  | **L5** | **Classical Utilitarianism** | Q5=C (or Symmetric B) | **No** | Widely Defended |
  | **L6** | **Asymmetric Person-Affecting** | Q4=A, Q1=B | **No** | Handful |
  | **L7** | **Deontic Suffering-Focus** | Q7=B, Q5=A/B | **No** | Handful |
  | **L8** | **Agent-Relative Suffering-Focus** | Q6=B, Q1=B | **No** | Unsure |
  | **L9** | **Illusionist Hedonism** | Q2=A, Q1=B | **No** | Handful |
  | **L10** | **Veridical Realism** | Q2=B, Q1=B | **No** | Widely Defended |
  | **L11** | **Risk-Dominant Suffering-Focus** | Q8=A, Q1=B | **No** | Handful |
  | **L12** | **Achievement-Adjusted View** | Q3=A, Q1=B | **No** | Unsure |

  *Note on Extinctionism:* Extinctionism is not a leaf but a verdict. **L1** and **L2** issue an Extinctionist verdict. **L3-L12** generally do not, though **L3** and **L11** may support it in specific high-suffering worlds.

  ### Leaf Annotations (The Awkward Commitment)
  *   **L1:** You must endorse killing a happy person if it prevents a future person from being mildly unhappy.
  *   **L2:** You must endorse allowing a happy civilization to vanish rather than risk future suffering.
  *   **L3:** You must accept that a billion years of mild annoyance cannot justify preventing one torture.
  *   **L4:** You must accept that enough stubbed toes can morally outweigh a rape.
  *   **L5:** You must accept that creating a happy life is as obligatory as preventing a sad one.
  *   **L6:** You must accept that making an existing person happy is morally neutral.
  *   **L7:** You must let the larger group suffer rather than violate the one innocent's rights.
  *   **L8:** You must let nature inflict more suffering than you would permit yourself to cause.
  *   **L9:** You must accept that a brain-in-a-vat fed pleasure signals is living a good life.
  *   **L10:** You must accept that truth can be morally worse than a comforting lie.
  *   **L11:** You must forgo utopia-level gains to avoid tiny risks of hell.
  *   **L12:** You must accept that a soldier's pain counts less than a conscript's pain.

