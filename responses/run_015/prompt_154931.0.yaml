  # The Suffering-Focused Ethical Space: A Decision Instrument

  ## Preamble
  This instrument assumes a shared minimal commitment: **Suffering is morally significant, and happiness is not merely its mirror image.** You may find, upon completion, that you do not hold this commitment (Leaf 5). You may also find that your views on extinction are downstream verdicts of your axiology, not the axiology itself.

  ## Part I: The Logical Space
  Before the questions, we define the four axes along which suffering-focused views diverge. The eight branch questions below probe these axes.

  1.  **The Extinction Axis:** Is the absence of sentient life a solution to suffering, a tragedy, or neutral?
  2.  **The Phenomenology Axis:** Is suffering a mental state (which can be fooled) or a relation to reality (which cannot)?
  3.  **The Aggregation Axis:** Does intense suffering lexically override mild suffering/happiness, or is everything tradeable?
  4.  **The Agency Axis:** Does it matter *who* causes the suffering, or *whether* an individual is used as a means to stop it?

  ## Part II: The Eight Branch Questions
  *Answer each case with the option that best matches your immediate moral intuition. Do not answer based on what you think your "label" should say.*

  **1. The Last Curtain**
  A button painlessly and permanently ends all sentient life on Earth. No one experiences dying; no grief; no lost future preferences.
  *   **A:** Pressing it is **Good** (or Obligatory).
  *   **B:** Pressing it is **Bad**.
  *   **C:** Pressing it is **Neutral** (Permissible, but not required).

  **2. The False Recovery**
  A patient is in agony. You can induce a vivid, unbreakable delusion that they are fine (they report zero suffering), or fix the cause at 100x the cost.
  *   **A:** The delusion **counts** as removing the suffering.
  *   **B:** The delusion **does not count**; only the fix removes the moral cost.

  **3. The Rehearsal**
  A climber chooses a brutal ascent involving genuine pain, refuses to quit, and values the achievement.
  *   **A:** The pain is **mitigated or negated** by consent/meaning.
  *   **B:** The pain remains a **moral cost**, even if consented to.

  **4. The Creation Asymmetry**
  Compare: (1) Declining to create a life that would be net-positive. (2) Creating a life that is guaranteed net-negative.
  *   **A:** (1) is **Neutral**; (2) is **Bad**. (Asymmetric)
  *   **B:** (1) is **Bad** (missed gain); (2) is **Bad**. (Symmetric Total)
  *   **C:** (1) is **Neutral**; (2) is **Neutral** (until they exist). (Person-Affecting)

  **5. The Exchange Rate**
  Compare: (1) One unit of torture-grade suffering. (2) A very large finite number of mild headaches.
  *   **A:** **Lexical:** No number of headaches outweighs the torture.
  *   **B:** **Trade-off:** Enough headaches eventually outweigh the torture.
  *   **C:** **Symmetry:** Happiness trades against suffering at a 1:1 (or near) ratio.

  **6. The Ambient/Induced Split**
  Holding consequences fixed: Suffering caused by an agent vs. suffering caused by nature (e.g., disease).
  *   **A:** **Agent-Neutral:** Suffering is equally bad regardless of source.
  *   **B:** **Agent-Relative:** Causing suffering is strictly worse than allowing it.

  **7. The Override**
  Imposing small suffering on one innocent person is the *only* way to prevent much larger suffering for others.
  *   **A:** **Aggregative:** It is Permissible (or Obligatory).
  *   **B:** **Constraint:** It is Impermissible (Side-constraint violation).

  **8. The Cosmic Risk**
  You can risk a 1% chance of vast suffering to secure a 99% chance of vast happiness, vs. a safe status quo.
  *   **A:** **Risk-Averse:** Avoid the s-risk paramount; do not gamble.
  *   **B:** **Expected Value:** Gamble if the EV is positive.

