answer: |-
  The label on the wall card was already printed, acrylic stand gleaming under the track lighting. *Girolamo Bassani, The Ferryman's Lantern (Reconstruction).* Elena Conti ran a finger along the edge of the plinth, feeling the vibration of the climate control system. Beside the new canvas, the twenty surviving nocturnes of Bassani's true corpus hung in their dim, reverent row. They were dark, muddy, struggling against the shadow. The *Ferryman*, by contrast, glowed. The lantern light fell on the water with a luminosity that the seventeenth-century pigments, oxidized by time, could no longer achieve.

  "It breathes," Luca, the museum director, said softly. He was holding a tablet, the stylus hovering over a floorplan app. "The conservators say the brushwork simulation is within three microns of his average stroke width. If we move it to the center wall, between the *Night Fisherman* and the *Study of Hands*, the eye accepts the sequence. It becomes the climax."

  "If you move it there," Elena said, "you imply lineage. You imply he meant for this to be the summit."

  "The inventory from 1697 lists it. It existed. The model only recovered what was lost."

  "The letter says he destroyed it."

  Luca lowered the tablet. The discovery of the Bassani correspondence three months prior had changed the air in the room. The initial narrative was miraculous: a lost masterpiece found through data. The second narrative was darker. In a letter to a patron, Bassani described the winter he painted the ferryman. He wrote of the light failing, of the composition refusing to resolve, of a disgust so sharp he took a knife to the canvas before the oil had fully set. He scraped it down. He chose silence over that specific image.

  "The consortium doesn't care about the scraping," Luca said. "They care that the image matches the inventory dimensions. They care that it sells."

  Alessio from the auction house was waiting in the office upstairs. He had brought a contract and a bottle of water he hadn't opened. He wanted the catalogue entry signed by Friday. He wanted the estimate set at four million euros. He wanted the designation changed from *Reconstruction* to *Realized*.

  "It's a new category," Alessio said, tapping the paper. "It acknowledges the artist's hand in the source data and the machine's hand in the execution. It's honest."

  "It's a lie of omission," Elena said. She was standing by the window, looking out at the Siena rooftops. "It omits the destruction. If I write 'Realized,' I am saying the work is finished. Bassani said it was failed."

  "Bassani didn't have our tools," Alessio said. "He couldn't finish it. We finished it for him. Think of the value. Not just monetary. Cultural. People weep in front of it, Elena. You've seen them. Does the tear know the difference? Does the beauty care about the intent?"

  "The beauty cares," she said. "Because the beauty is the argument."

  Alessio leaned forward. "We can hang it separately. A wing of its own. We can label it 'Posthumous Collaboration.' But we need your name on the essay. You're the authority on authenticity. If you sign, the market stabilizes. If you don't, it's a curiosity. A gimmick."

  "And the restoration?" Elena asked. "If a flake of paint falls off the *Ferryman*, do you send it to the lab? Do you try to match the polymer blend? Or do you let it decay?"

  "We treat it as a contemporary work," Alessio said. "Protected, but distinct."

  Elena went back to her hotel. The room was quiet. She opened her laptop and pulled up the draft of the catalogue entry. The cursor blinked at the end of the third paragraph. She had written about the inventory, the chemical analysis of the ground layer, the training of the model on the Siena corpus. She had not yet written about the letter.

  To include the letter was to poison the well. It introduced the artist's rejection. It suggested that the image was not merely lost, but refused. To omit it was to falsify the history.

  She looked at the photo of the painting on her screen. The lantern light was beautiful. It was exactly what Bassani might have painted if he had not hated it. It possessed the visual truth of the master without the historical truth of the man. There was a value in seeing it. To deny the world the image because the artist had denied it felt like a second destruction. But to sell it as his work, even partially, felt like a forgery of intent.

  She typed: *The work exists in a state of suspension between creation and erasure.*

  She deleted it. Too poetic.

  She typed: *While the physical object is contemporary, the visual data originates from the artist's hand.*

  She deleted that too. It sounded like a warranty.

  She thought of the conservators standing before the canvas, tears in their eyes. They were responding to the light, the composition, the ghost of Bassani's style. They were not responding to his disgust. But the disgust was part of the style. His roughness, his shadows, his inability to resolve the light—those were not failures of skill, but markers of his vision. The machine had smoothed them out. The *Ferryman* was too clear. It was a Bassani without the struggle.

  Elena saved the document. She walked to the desk and took out a pen. The contract lay on the table. There was a line for her signature at the bottom of the engagement letter, authorizing the use of her essay in the sale catalogue.

  She picked up the pen. If she signed, the auction would proceed. The painting would sell. It would hang in a private vault or a lobby in Singapore. It would be insured, restored, preserved. It would survive.

  If she refused, the consortium might pull the work. It might be stored away, deemed too controversial. Or sold as a novelty, dismissed as a fake. The image would be degraded in the public eye.

  She looked at the blank signature line. She thought about the letter Bassani wrote in the winter light, the knife in his hand, the sound of canvas tearing. He had chosen nothingness over this image. Now, nothingness was being offered for four million euros.

  Elena capped the pen. She opened the laptop again and scrolled to the title of the essay. She changed the designation from *Realized* to *Reconstructed from Destroyed Original*. It was clunky. It was ugly. It would not help the price.

  She scrolled to the bottom. She typed her name. Then she highlighted it and changed the font to italics. It looked weaker. She removed the italics.

  Outside, the bell of the Palazzo Pubblico rang the hour. The sound was heavy, stone against stone. Elena looked at the signature line on the contract. She picked up the pen again, held it over the paper, and waited. The ink did not flow. The room was silent, save for the hum of the refrigerator and the distant traffic. She pressed the nib to the paper, felt the friction of the fiber, and made a mark. It was not a signature. It was a dot.

  She put the pen down. She hit send on the email attaching the essay. The subject line read: *Catalogue Text - Bassani.* She did not attach the signed contract. She would mail it in the morning. Or she wouldn't.

  She closed the laptop. The painting was still hanging in the museum. The label still said *Reconstruction*. Tomorrow, Luca would ask about the center wall. Alessio would ask about the estimate. The light in the painting would still glow, perfect and terrible, waiting for someone to say what it was. Elena turned off the lamp and sat in the dark, listening to the city breathe.
