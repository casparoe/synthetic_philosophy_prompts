answer: |-
  Imagine a federated social network where corporate instance hosts face strict criminal liability for hosted content under a new international treaty, but content visibility is governed by a prediction market where individual users stake tokens to boost or bury posts. The specific decision is whether to enable automatic hashing of all images to prevent illegal sharing, which would degrade load speeds. Individual users claim voting rights because their privacy and sharing interests are directly impacted (affected interests), while corporate hosts claim voting rights because they alone face criminal penalties if the hashing fails (subjected to coercion). Users face no legal risk, and hosts hold no stake in the prediction market, ensuring the sets of "affected" and "subjected" remain disjoint.

  Here's the split: the All Affected Interests (AAI) principle hands the vote to the users because their experience and privacy are on the line, while the All Subjected to Coercion (ASC) principle hands it to the hosts because they are the ones facing jail time or fines. The feature actually doing the work here is the decoupling of legal liability from user experience via the algorithmic layer; usually, the person bound by the rule is also the one feeling the pain, but the prediction market shifts the control pain to users while the law keeps the legal pain on hosts. You can't just redefine terms to fix this because users aren't legally bound (they can leave without penalty), and hosts are corporate shells indemnified against performance issues, so their "interest" is purely liability avoidance, not user experience. If AAI wins and users vote, the ASC defender attacks by calling it tyranny: "You're deciding the rules, but we serve the sentence." If ASC wins and hosts vote, the AAI defender attacks by calling it colonization: "You're ruling over our digital lives without having a stake in the outcome." Both sides have a point because the governance structure artificially severed the link between power and consequence.
