answer: |-
  1. **Where The Confusion Is**
  The confusion lies in mistaking a correlation for a biological verdict. The paradox shows that in wealthier, safer nations, occupational choices diverge, but it does not prove that equality *creates* biology or that culture suddenly stops mattering. Your roommate's claim that biology is 100% responsible ignores how culture shapes preferences long before career choices are made; even "free" choices are made by people socialized in specific environments. Sociologists see this as evidence that economic security changes *which* constraints matter, not that human behavior becomes purely instinctual when policies are fair.

  2. **Three Other Explanations**
  *   **Economic Necessity vs. Preference:** Using your food analogy, when money is tight, everyone eats cheap carbs regardless of taste; similarly, in less egalitarian countries, women may choose STEM for financial security rather than passion, masking true preferences.
  *   **Stereotype Emboldenment:** In highly egalitarian societies, people may feel safer expressing traditional interests without fear of discrimination, making gendered patterns look stronger even if the underlying traits haven't changed.
  *   **Welfare State Structures:** Some high-equality nations offer long parental leaves primarily taken by mothers, which can interrupt careers in fast-paced fields like engineering, creating statistical gaps unrelated to innate ability or desire.

  3. **So What For Fairness**
  Justice generally requires equal opportunity and the removal of coercive barriers, not necessarily engineered 50/50 outcomes if choices are genuinely free. Dialing back equality policies would likely reduce overall well-being without guaranteeing job integration, as forcing people into roles they don't want is its own form of injustice. Therefore, the goal should be ensuring no one is pushed out of a field by bias. We should not punish societies for having different preference distributions as long as those preferences aren't manipulated by discrimination.
