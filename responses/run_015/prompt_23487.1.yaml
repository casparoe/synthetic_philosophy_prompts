      *   **Specific Lens:** The Problem of the Criterion (standards of correctness).
      *   **Format:** Dialogue between a Wittgensteinian (W) and a Private Language Defender (P).
      *   **Key Defenses to Address:**
          1.  *Memory Defense:* Memory serves as the standard of correctness.
          2.  *Reliable-Indicator Defense:* Reliable causal/functional connection suffices for meaning (like a gauge).
      *   **Key Wittgensteinian Replies:**
          1.  *To Memory:* Memory is fallible; you can't distinguish true memory from present impression without an independent check.
          2.  *To Reliable-Indicator:* No possibility of error = no meaning (just a reflex/disposition). Meaning requires the logical possibility of being wrong.
      *   **Key Defender Pushbacks:**
          1.  *To Memory:* Why assume memory needs an *external* check? Internal coherence might suffice.
          2.  *To Reliable-Indicator:* Why assume meaning *requires* the possibility of error? Maybe that's a public language feature, not a semantic necessity.
      *   **Tone:** Both characters equally strong, competent, no strawmanning.
      *   **Ending:** A clearly identified point of genuine impasse (no tidy resolution).

  2.  **Character Conception:**
