  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Establish the core disagreement about the "Problem of the Criterion."
      *   **Round 1: The Memory Defense.**
          *   *P:* Proposes memory as the internal yardstick.
          *   *W:* Attacks the yardstick. If the yardstick is in the same boat as the measurement, it solves nothing. (The "diary" example from *Philosophical Investigations* §258 is crucial here).
          *   *P:* Pushes back. Accuses W of begging the question by demanding an *independent* check. Why can't the internal coherence of memory suffice?
      *   **Round 2: The Reliable-Indicator Defense.**
