answer: |-
  A. The scenario
  In a university history department, Senior Professor Vance seeks to convert a shared seminar room into a private archive, leveraging his influence over the Dean. Junior Lecturer Aris needs the room to fulfill a mandatory accreditation requirement for her core course. Departmental bylaws, ratified decades ago and enforced by the University Senate, stipulate that teaching spaces override private research storage. Vance possesses greater personal prestige and informal coercive power within the department, but the bylaw remains the standing custom. The dispute centers on whether Vance can override the bylaw through personal influence or if the structural rule prevails to maintain departmental order.

  B. The three verdicts
  The pure might-makes-right view awards the room to Vance, as his personal influence and status dominate the immediate interaction. The natural-rights view likely favors Aris, arguing her contractual entitlement to teach constitutes a pre-institutional claim superior to Vance's convenience. The Pascalian conventionalist, however, also favors Aris, but for distinct reasons. For Pascal, justice is custom sustained by force. Here, the "force" is not Aris's personal power but the University Senate's capacity to sanction the department. Upholding the bylaw prevents institutional disorder; ignoring it invites chaos. Thus, Pascal requires defending the weaker claimant not because she is right in herself, but because the structural force backing the custom outweighs Vance's personal dominance. Justice tracks the stability of the established order, not the immediate balance of personal power.

  C. The isolating feature
  The isolating feature is the University Senate's enforceable authority, constituting the "force" sustaining the custom. This structural inertia ensures the bylaw remains effective regardless of Vance's prestige. If removed—say, the Senate dissolves—the custom lacks force. In that vacuum, the Pascalian verdict reverses. Without structural enforcement, the only remaining force is Vance's personal dominance. Consequently, justice requires siding with Vance to prevent disorder from challenging the strongest actor. The reversal hinges entirely on the locus of force being institutional rather than interpersonal.

  D. The power-politics rebuttal
  A might-makes-right defender argues institutional inertia is not "force," but frozen past power. If Vance violates the bylaw without immediate consequence, the custom is dead. True force resides only in compelling obedience now. If successful, the Pascalian view collapses, as customs lacking immediate enforcement are illusory. However, if Pascal defines force as the capacity to generate disorder upon violation, the view remains intact. The rebuttal succeeds only if force equals immediate personal coercion rather than systemic stability.
