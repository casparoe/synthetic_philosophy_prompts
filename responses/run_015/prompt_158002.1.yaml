      *   *Natural-Rights:* Aris wins (maybe)? Or depends on entitlement. If she has a right to teach, she wins. Let's say she has a pre-institutional right to livelihood/contract fulfillment.
      *   *Pascal:* Aris wins. Why? Because the custom (bylaw) is sustained by the University Senate (force). Violating it risks institutional disorder. Justice requires upholding the custom to prevent chaos, even if Vance is personally stronger.
      *   *Drafting:* The pure might-makes-right view awards the room to Vance, as his personal influence and status dominate the immediate interaction. The natural-rights view likely favors Aris, arguing her contractual entitlement to teach constitutes a pre-institutional claim superior to Vance's convenience. The Pascalian conventionalist, however, also favors Aris, but for distinct reasons. For Pascal, justice is custom sustained by force. Here, the "force" is not Aris's personal power but the University Senate's capacity to sanction the department. Upholding the bylaw prevents institutional disorder; ignoring it invites chaos. Thus, Pascal requires defending the weaker claimant not because she is right in herself, but because the structural force backing the custom outweighs Vance's personal dominance. Justice tracks the stability of the established order, not the immediate balance of personal power.

  4.  **Drafting The Isolating Feature (Section C):**
      *   *Goal:* ~100 words. Identify the structural element (institutional inertia/enforcement). Explain what happens if removed.
      *   *Feature:* The University Senate's enforcement capability (structural force).
