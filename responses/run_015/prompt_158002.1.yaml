      *   *Parties:* A senior professor (Powerful) vs. a junior lecturer (Weaker).
      *   *Resource:* A specific shared research lab or office space.
      *   *Rule:* A longstanding departmental bylaw allocating space based on seniority *unless* a teaching requirement is unmet.
      *   *Tension:* The senior professor wants the space for research (powerful). The junior lecturer needs it for a mandatory course (weaker). The bylaw favors the teaching requirement.
      *   *Pascalian Twist:* The "force" sustaining the custom is the accreditation body/university administration backing the bylaw, not the junior lecturer's personal power. If the senior professor violates the bylaw, the institution collapses/loses accreditation (disorder). So Pascal sides with the weaker party to maintain the structural order.
