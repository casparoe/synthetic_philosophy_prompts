      *   *Critique:* Real force is physical/coercive. Institutional rules are just frozen past power. If Vance can ignore it without immediate consequence, it's not real force.
      *   *Success/Failure:* Leaves Pascal vulnerable if "force" is defined strictly as immediate coercion. But Pascal might argue stability *is* the force.
      *   *Drafting:* A defender of pure might-makes-right would argue that institutional inertia is not "force" in Pascal's sense, but merely frozen past power. They would contend that if Vance can violate the bylaw without immediate physical or coercive consequence, the custom is dead. True force resides only in the ability to compel obedience now. If this attack succeeds, the Pascalian view collapses into might-makes-right, as any custom lacking immediate enforcement is illusory. However, if Pascal defines force as the capacity to generate disorder upon violation, the view remains intact. The rebuttal succeeds only if one equates force strictly with immediate personal coercion rather than systemic stability.

