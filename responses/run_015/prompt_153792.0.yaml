answer: |-
  Your colleague's insistence on strict equality of inputs—money, time, and task lists—rests on the intuition that fairness means treating everyone the same. However, this framework assumes that you both convert resources into functioning at the same rate. Because your health condition acts as a friction on your energy, a fifty-fifty split of chores does not result in a fifty-fifty split of burden. For her, two hours of cleaning is a minor inconvenience; for you, it is a health event with multi-day consequences. Treating unequal bodies as identical resource-processors creates a substantive inequality in your quality of life, even if the ledger looks balanced. Her framework is defensible only if the goal is to minimize her liability, not to establish a mutually sustainable living environment.

  Shifting the metric to welfare—equalizing happiness or satisfaction—is also problematic given your fear of creating an unconsented claim on her labor. If fairness required you to be equally happy or rested, she might be obligated to absorb an open-ended amount of your domestic labor until your welfare matched hers. This transforms a roommate agreement into a care relationship, potentially breeding resentment and violating her autonomy. You are correct to resist a model that makes her responsible for your overall well-being rather than just the fairness of the shared arrangement.

  A more robust approach focuses on capabilities, specifically distinguishing between *basic capabilities* (your internal capacity to act) and *combined capabilities* (your internal capacity plus the external opportunity to exercise it). You possess the basic capability to clean, but the current living arrangement denies you the combined capability to do so without severe harm. Fairness here means adjusting the external environment (the chore roster) so that your combined capabilities match hers, not so that your welfare outcomes are identical. This avoids the subsidy problem because the obligation is bounded: she is not required to maximize your happiness, only to ensure the living arrangement does not unjustly restrict your effective freedom to function.

  To prevent adaptive preferences—where you might lower your expectations to avoid conflict—you must explicitly define your energy limits rather than accepting a roster you cannot sustain. To avoid paternalism, you should index fairness to specific functioning bundles (e.g., "a clean kitchen") rather than monitoring each other's effort. A practical solution is to equalize financial contributions but weight labor contributions by energy cost, or to jointly fund a cleaning service for high-energy tasks. This respects her resources while acknowledging your conversion factors.

  The remaining tension lies in setting a non-arbitrary limit on accommodation. While the capabilities approach prevents open-ended welfare claims, you must still agree on where "reasonable accommodation" ends and "undue burden" begins for her. This requires ongoing negotiation rather than a fixed formula, ensuring that neither party feels exploited nor overburdened.

