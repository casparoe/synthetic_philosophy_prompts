answer: |-
  Based on the pattern of your verdicts, you are implicitly tracking the difference between intuitions driven by **logical/functional structure** and those driven by **narrative/affective contingency**. You accept cases that feel like they isolate a variable (Trolley Lever), reject those that feel like they smuggle in emotional heuristics or question-begging definitions (Footbridge, Mary), and remain ambivalent on cases where the intuition seems to depend on causal history or status-quo framing (Swampman, Experience Machine, Bidirectional).

  Here is the principle that formalizes this pattern, its prediction for the Zombie case, and the necessary revision to your existing verdicts.

  ### The Principle: Invariant Intuition under Narrative Variation (IINV)

  **Statement:** A philosophical thought experiment is genuinely illuminating only if the core intuitive verdict remains **stable** when (1) all emotionally valenced narrative details are neutralized or inverted (Affective Neutralization), and (2) the causal or temporal direction of the scenario is reversed without altering the functional relations (Structural Reversal). If the intuition flips under these variations, the thought experiment is manipulating heuristic responses rather than tracking structural truth.

  **Why this fits your pattern:**
  *   **Trolley Lever (Accepted):** You perceive the "redirecting vs. using" distinction as surviving affective neutralization (it feels logical, not visceral).
  *   **Footbridge (Rejected):** The intuition collapses if you remove the "personal force" or proximity (Affective Neutralization fails).
  *   **Mary's Room (Rejected):** The setup defines "physical knowledge" in a way that excludes phenomenal knowledge by stipulation (fails Structural Reversal/Neutrality; begs the question).
  *   **Swampman/Experience Machine (Ambivalent):** Your hesitation stems from the suspicion that causal history (Swampman) or current state vs. history (Experience Machine) shouldn't matter functionally, yet your intuition says they do. IINV flags this instability.
  *   **Bidirectional Replacement (Mixed):** You note it exposes tension but is misleading. IINV agrees: if consciousness is functional, direction shouldn't matter. The fact that it *feels* like it matters indicates a heuristic failure, not a metaphysical boundary.

  ### Prediction: The Zombie Conceivability Argument

  **Verdict:** **Reject as a Bad Pump.**

  **Application of IINV:**
  The Zombie argument asks us to imagine a being physically identical to a human but lacking phenomenal experience.
  1.  **Affective Neutralization:** The concept of a "Zombie" carries a heavy narrative load of "emptiness" or "automaton-like" behavior, which triggers an affective response distinct from the dry physical description.
  2.  **Structural Reversal/Neutrality:** The argument relies on the *conceivability* of the scenario as proof of *metaphysical possibility*. However, if physicalism is true, a physical duplicate *necessarily* has experience (just as a triangle necessarily has three sides). Asking us to "imagine" them apart is not isolating a structural feature; it is asking us to imagine a contradiction and calling it a possibility.
  3.  **Conclusion:** Like Mary's Room, the Zombie argument fails IINV because it asks us to accept the coherence of the scenario, which implicitly assumes the falsity of physicalism from the outset. It does not isolate a structural feature that survives neutralization; it isolates a gap in our imaginative capacity and misidentifies it as a gap in the world.

  ### The Necessary Overturning: The Trolley Lever

  To maintain intellectual honesty and adhere strictly to the **IINV** principle, you must overturn your verdict on the **Standard Trolley Lever**.

  **Your Current Verdict:** Sound intuition pump; isolates a structural difference.
  **Required Revision:** **Partially Compromised / Ambivalent.**

  **Reasoning:**
  While the Lever case feels more "structural" than the Footbridge, empirical moral psychology (e.g., work by Joshua Greene and Fiery Cushman) suggests that the Lever intuition does *not* fully survive **Affective Neutralization**.
  1.  **The Personal Force Variable:** The distinction between the Lever and Footbridge cases correlates less with the "means vs. side-effect" structure (Doctrine of Double Effect) and more with "personal force." If you modify the Lever case to involve "personal force" (e.g., pushing a button that mechanically shoves a person off a bridge remotely), intuitions shift toward the Footbridge verdict.
  2.  **Impersonal vs. Personal:** The Lever case is "impersonal" (pulling a switch); the Footbridge is "personal" (touching/pushing). If you neutralize this affective distance (e.g., the lever requires you to physically shove a mechanism that feels like a body), the "structural" intuition wavers.
  3.  **IINV Implication:** Because the intuitive verdict shifts when the *affective proximity* is altered—even if the causal structure (1 dies, 5 saved, intervention required) remains identical—the Lever case fails the strict test of Invariant Intuition. It is not a pure isolate of the Doctrine of Double Effect; it is contaminated by the same proximity heuristics as the Footbridge, merely to a lesser degree.

  **Conclusion:**
  To be consistent with your rejection of the Footbridge and your suspicion of the Experience Machine, you must admit that the Trolley Lever is not a "sound" control case, but rather a **less emotionally charged version of a manipulative pump**. It is useful, but it does not justify the Doctrine of Double Effect as cleanly as you hope; it merely exploits a lower threshold of affective resistance. This does not make it useless, but it demotes it from "Sound" to "Ambivalent/Partially Compromised," aligning it with your verdicts on Swampman and the Experience Machine.
