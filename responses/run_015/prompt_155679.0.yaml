answer: |-
  Your intuitions are not random; they cluster around a specific, defensible normative stance that diverges from pure Expected Value (EV) maximization in ways that are increasingly discussed in decision theory (specifically regarding *ambiguity* and *opportunity cost*).

  You do not need seven exceptions. You need one principle and the courage to drop one specific intuition that is mathematically incoherent with the rest.

  ### The Principle: Robust Opportunity Costing

  **Principle:** *Fund a project only if its **Confidence-Weighted Expected Value** exceeds the **Confidence-Weighted Expected Value** of the marginal alternative use of the funds.*

  This principle has three components that explain your pattern:
  1.  **Confidence Weighting (Ambiguity Aversion):** Probabilities are not taken at face value. They are discounted by a factor representing *model uncertainty*. As stakes become astronomical (10^30+), the uncertainty about whether the model generating the probability is coherent grows faster than the stake. This handles the "Pascal's Mugging" feel of (b) and (c) without arbitrary probability truncation.
  2.  **Comparative Assessment (Opportunity Cost):** A project is not evaluated against zero, but against the next best use of resources (usually more robust, lower-stakes longtermist work). This explains why you reject (b) but accept (g). In (g), the cost is zero, so the alternative use is "nothing," and any positive robust EV wins. In (b), the cost is $200,000, which could fund robust AI safety or biosecurity work.
  3.  **Epistemic Asymmetry:** Estimates of suffering are typically more robust (bounded by physical and psychological facts) than estimates of astronomical flourishing (which rely on speculative physics and value theory). This justifies treating harm-avoidance more seriously than benefit-seeking without invoking irrational loss aversion.

  ### How It Maps Your Cases

  *   **(a) Moderate X-Risk:** **Fund.** The model (engineering risk) is robust. The confidence weight is high. The EV exceeds the marginal alternative.
  *   **(b) Astronomical X-Risk:** **Reject.** The stake (10^30) is so large that model uncertainty dominates. The confidence weight collapses the effective EV below that of robust alternative uses of $200k.
  *   **(c) Mugging:** **Reject.** Mechanism is unspecified. Model uncertainty is maximal (confidence weight ≈ 0).
  *   **(d) Bundling:** **Fund Portfolio / Fund Marginal.** (See "The Sacrifice" below). Aggregating independent projects reduces *idiosyncratic* model uncertainty, raising the confidence weight of the portfolio above the threshold.
  *   **(e) Uncertain Magnitude:** **Reject.** Uncertainty about the *size* of the payoff adds a second layer of model uncertainty, further depressing the confidence weight below (b).
  *   **(f) Harms:** **Avoid.** Suffering estimates are epistemically more robust than speculative flourishing estimates. The confidence weight on the harm is higher than the confidence weight on the mirror-image good.
  *   **(g) Costless:** **Fund.** Opportunity cost is zero. Even a heavily discounted probability yields a positive net value compared to doing nothing.

  ### The Prediction: Buying Tickets of Type (b)

  You asked whether you should buy a thousand or a billion independent tickets of type (b), given the tension between your rejection of (b) and your acceptance of portfolios in (d).

  **The Verdict:**
  *   **A Thousand Tickets:** **No.**
      *   *Reasoning:* 1,000 tickets at 1-in-10^12 yields an aggregate probability of 1-in-10^9. This remains in the "astronomical/ambiguous" regime where model uncertainty dominates. The opportunity cost of $200 million is still better spent on robust (a)-type work.
  *   **A Billion Tickets:** **Yes (Theoretically).**
      *   *Reasoning:* 10^9 tickets at 1-in-10^12 yields an aggregate probability of ~1-in-1,000. This moves the proposition out of the "astronomical" regime and into the "low probability but statistically manageable" regime (similar to case (d)). The confidence weight increases because the *portfolio* is robust even if individual tickets are not.
      *   *Caveat:* This assumes the tickets are **independently generated models**. If all 10^9 tickets rely on the *same* physicist's theory, the model uncertainty is correlated, and the confidence weight does not improve. You should only fund the billion if they represent diverse mechanisms.

  ### The Sacrifice: Which Verdict Must Go?

  To maintain coherence, you must drop one intuition.

  **Drop: The refusal to fund the *marginal* ticket in case (d).**

  You wrote: *"I would happily fund the whole portfolio, and yet asked about any single one of them... I want to say no."*

  This is the **Isolation Effect**, a known cognitive bias. It is mathematically incoherent.
  *   If the portfolio is worth funding, it is because the sum of the parts exceeds the cost.
  *   If the projects are independent and identical, the marginal contribution of the 10,000th ticket is identical to the 1st ticket.
  *   If you fund the portfolio, you are necessarily funding the marginal ticket. Refusing the marginal ticket while accepting the portfolio implies you value the *set* more than the *sum of its values*, which only makes sense if there are synergistic threshold effects (e.g., "we need 5,000 successes to win"). Case (d) does not specify thresholds; it implies additive value.

  **Why this is the weakest link:**
  Your acceptance of (a) (1-in-10^6) already commits you to funding low-probability high-value acts. Case (d)'s individual tickets (1-in-10^4) are *more probable* than (a). If you fund (a), you have no consistent ground to reject the individual ticket in (d) unless you are succumbing to the psychological discomfort of "likely failure" on a single bet. Your portfolio intuition is the correct one; your individual rejection is the bias.

  ### Secondary Adjustment: Reframe Case (f)

  Your friend says (f) is loss aversion (a bias). I suggest you keep the verdict but change the justification.
  *   **Don't say:** "Suffering matters more than happiness." (This violates the linearity of lives most longtermists accept).
  *   **Do say:** "We can estimate suffering with higher confidence than speculative flourishing."
  This aligns (f) with the **Robust Opportunity Costing** principle (Epistemic Asymmetry) rather than requiring a separate utility function. It preserves your intuition without admitting to irrational bias.

  ### Summary

  1.  **Adopt:** **Robust Opportunity Costing.** (Compare confidence-weighted EV against alternatives, not zero).
  2.  **Predict:** **Yes** to a billion independent (b)-tickets (if budget allows), **No** to a thousand.
  3.  **Sacrifice:** The intuition that you can **reject the marginal ticket in (d) while accepting the portfolio.** Align this with your portfolio instinct.
  4.  **Reframe:** **(f) Harm Asymmetry** as epistemic robustness, not utility curvature.

  This preserves your sensible reluctance to be "mugged" by astronomical numbers while keeping the door open for high-impact work when the epistemic grounds (or cost structure) justify it.
