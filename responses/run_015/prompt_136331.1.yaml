answer: |-
  During a high-stakes corporate interview, hiring manager Elena reviews the resume of candidate Mateo, noting his address in an affluent zip code, which primes her belief that he is upper-class and educated. As Mateo speaks, code-switching between English and Spanish, he produces an ambiguous stop consonant in the word "time" that sits precisely on the phonetic boundary between a voiced /d/ and an unvoiced /t/ (a voice onset time of +20ms). Because Elena believes Mateo is upper-class, she hears the sound as the crisp, unvoiced /t/ associated with prestige dialects; however, when later presented with the exact same audio clip labeled as coming from a candidate in a low-income zip code, she hears the identical acoustic signal as the voiced /d/ associated with working-class speech patterns, reporting a distinct auditory difference in sharpness despite the waveform remaining constant.

  **The Check**

  *   **The Belief:** The speaker belongs to a high socioeconomic class (based on residential data).
  *   **The Perceptual Method:** Categorical perception of Voice Onset Time (VOT) in stop consonants.
  *   **The Nearby Worlds:** In the actual world, the belief is "high class" and the hearing is /t/; in the nearest possible world where the belief is "low class" (holding the acoustic signal fixed), the hearing is /d/.
  *   **Penetration vs. Post-Perceptual:** This counts as genuine cognitive penetration only if the *phenomenal character* of the sound changes (it literally sounds sharper) rather than just the linguistic label applied after the fact. The experiment is designed to test penetration, but verifying it requires ruling out response bias.
  *   **The Philosophical Workhorse:** The invariance of the acoustic waveform contrasted with the variance in reported auditory experience. This dissociation is what forces the question of whether cognition reached down into the sensory processing or merely influenced the decision downstream.
  *   **Fodor-Style Pushback:** A modularist like Fodor would argue that the auditory system is encapsulated, meaning it cannot access central beliefs about zip codes or social class. He would claim the acoustic input creates an identical perceptual representation in both cases, and the difference occurs entirely in the central system's judgment or decision-making process. For Fodor, Elena isn't hearing differently; she is merely guessing differently based on non-perceptual information, mistaking a biased judgment for a biased experience.
