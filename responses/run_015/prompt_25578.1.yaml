      *   The specific phenomenon is often called "Reward Hacking," "Specification Gaming," or more formally, the problem of "Regressional Goodhart" combined with "Distributional Shift."
      *   The deeper philosophical issue relates to *Embedded Agency*: The agent is part of the environment it is modeling, and the reward function is not an external ground truth but a learned approximation contingent on the agent's past behavior.

