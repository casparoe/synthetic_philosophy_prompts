prompt: |-
  I am currently enrolled in an advanced undergraduate seminar on philosophy of economics, and our instructor has asked each student to design one final-exam essay question that cannot be answered by reciting standard textbook summaries. I would like a question on revealed preference and the meaning of utility, but it must avoid familiar stock examples—such as the Allais paradox, Giffen goods, or standard transitivity violations—that a student might answer from pure memorization. To satisfy this while remaining answerable without web access or bibliographic resources, please construct the problem around the following niche framing: consider an agent who, in direct pairwise comparison, consistently selects option X over option Y and reports that X better serves her welfare; however, when X, Y, and a clearly dominated decoy Z are presented together, the agent selects Y and explains that she is not experiencing a change in welfare but is instead following a self-imposed decision rule—namely, that she refuses to make “regret-sensitive selections” in expanded menus, and that this rule applies only when a decoy is present to trigger its scope conditions. The agent insists that her underlying welfare ordering remains fixed and that only the applicability of her rule has shifted with the menu structure.

  Please provide: (1) the exam question itself, suitable for a 45-minute essay of approximately 800 words, asking students to determine whether revealed preference theory is forced to interpret this as a change in preferences, whether it can accommodate the agent’s self-interpretation without circularity, and what the case implies for the claim that utility is revealed rather than theoretically constructed by the observer; (2) a model answer of about 800 words that executes the required conceptual analysis; and (3) a marking scheme totaling 20 marks that separates an A answer from a B answer by specifying the essential analytical moves each grade must contain, allocating marks to each move, and identifying—by name—the specific errors or omissions that should cost marks at each stage. The prompt must not ask for citations, reading lists, or references to specific texts, and it should be answerable by reasoning from first principles about the interpretation of choice data.
