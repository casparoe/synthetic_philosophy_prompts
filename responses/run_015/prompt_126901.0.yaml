answer: |-
  ### Part 1: Exam Question

  **Course:** Philosophy of Economics (Advanced Undergraduate Seminar)
  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 800 words

  **Question:**

  Consider an agent facing choice scenarios involving economic bundles. In direct pairwise comparisons, the agent consistently selects option $X$ over option $Y$ and explicitly reports that $X$ better serves her welfare. However, when the menu is expanded to include $\{X, Y, Z\}$, where $Z$ is a clearly dominated decoy (inferior to $X$ in all relevant dimensions), the agent selects $Y$. When questioned, the agent insists her underlying welfare ordering remains fixed ($X$ is still better for her than $Y$). She explains that she adheres to a self-imposed decision rule: she refuses to make "regret-sensitive selections" in expanded menus. She claims the presence of the decoy $Z$ triggers this rule, leading her to choose $Y$ as a safeguard against future regret, despite $X$ offering higher immediate welfare.

  Write an essay addressing the following three points:

  1.  **Revealed Preference Interpretation:** According to strict Revealed Preference Theory (RPT), is the theorist forced to interpret this behavior as a change in preferences, or can the theory accommodate the agent's claim of a fixed welfare ordering?
  2.  **Circularity and Rules:** If the theorist attempts to accommodate the agent's explanation by treating her "decision rule" as part of her preference structure, does this render the theory circular or unfalsifiable? Explain the tension between respecting the agent's self-interpretation and maintaining the empirical content of the theory.
  3.  **Ontology of Utility:** Based on this case, evaluate the claim that utility is "revealed" by choice versus "theoretically constructed" by the observer. Does the agent's distinction between welfare and choice rules suggest that utility is a mental state inaccessible to RPT, or a formal construct that must ignore such distinctions?

  ***

  ### Part 2: Model Answer

  **Title:** Choice, Welfare, and the Stipulative Nature of Revealed Preference

  Revealed Preference Theory (RPT) operates on a behaviorist stipulation: preference is defined by choice. Under the Weak Axiom of Revealed Preference (WARP), if an agent chooses $X$ over $Y$ when both are available, she reveals a preference for $X$. If she subsequently chooses $Y$ when $X$ is still available (as in the triplet $\{X, Y, Z\}$), strict RPT dictates that her preferences are inconsistent or context-dependent. Consequently, the theorist is forced to interpret this as a preference reversal regarding the *choice function*, regardless of the agent's testimony. RPT does not distinguish between "welfare ordering" and "selection rule"; to the behaviorist, the choice *is* the preference. Therefore, strictly speaking, RPT cannot accommodate the agent's claim of a fixed welfare ordering without ceasing to be strict RPT. To accept her claim is to admit that choice does not perfectly reveal welfare, which undermines the foundational identity of the theory.

  However, a sophisticated defender of RPT might attempt to accommodate the agent by redefining the objects of choice. One could argue the agent is not choosing between bundles $X$ and $Y$, but between "choosing $X$ in a binary menu" and "choosing $Y$ in a triplet menu." By indexing the options to the menu context, the apparent violation of consistency disappears. Yet, this maneuver invites charges of circularity and unfalsifiability. If every anomaly in choice data can be explained away by positing a new "decision rule" or re-describing the options (e.g., "she prefers following the rule to avoiding regret"), the theory loses its empirical bite. It becomes a tautology: the agent chooses what she chooses because she prefers what she chooses. To avoid circularity, the "rule" must be independently verifiable, not merely inferred from the choice it is meant to explain. If the rule is only known because she chose $Y$, and she chose $Y$ because of the rule, the explanation is vacuous. The tension lies here: respecting the agent's self-interpretation preserves psychological realism but risks turning RPT into a post-hoc narrative generator rather than a predictive scientific model.

  This case illuminates the ontological status of utility. If utility is truly "revealed" by choice, then the agent is mistaken about her own utility; her choice of $Y$ in the triplet means $Y$ yields higher utility in that context, full stop. This treats utility as a theoretical construct assigned by the observer to rationalize data, ignoring the agent's internal distinction between welfare and procedure. Conversely, if the agent is correct that her welfare ordering ($X \succ Y$) is distinct from her choice ($Y$ chosen), then utility is a mental state regarding well-being that is not fully captured by choice data. In this view, RPT does not *reveal* utility; it constructs a formal shadow of it that conflates welfare maximization with rule-following.

  The agent's distinction suggests that choice is influenced by procedural concerns (avoiding regret) that are orthogonal to outcome welfare. If RPT ignores this, it misidentifies the source of value. If it incorporates this, it must expand "utility" to include the comfort of rule-following, which blurs the line between the *good* and the *method*. Ultimately, this case suggests that utility is not a pre-existing mental fact waiting to be revealed by choice, nor is it a purely observer-constructed fiction. Rather, it is a hybrid: the observer constructs a utility function to model behavior, but if that model ignores the agent's reported reasons (welfare vs. rule), it fails to describe the economic agent as a reasoning being. Strict RPT must treat the utility as constructed from behavior, rendering the agent's welfare claims irrelevant to the theory. To take her claims seriously is to move beyond RPT toward a mentalist account where choice is evidence of utility, but not its definition.

  ***

  ### Part 3: Marking Scheme

  **Total Marks:** 20
  **Grade Thresholds:** A (16-20), B (12-15), C (8-11), D/F (0-7)

  **1. Analysis of RPT's Behaviorist Commitment (5 Marks)**
  *   **A (5 marks):** Explicitly identifies that strict RPT defines preference *as* choice (behaviorism). Correctly concludes that RPT *must* view this as a preference reversal or context-dependence, rejecting the agent's claim of fixed welfare as external to the theory.
  *   **B (3-4 marks):** States that RPT sees a contradiction but fails to articulate the behaviorist stipulation (choice = preference). May suggest RPT *could* easily accept the welfare claim without noting the theoretical cost.
  *   **C/D (0-2 marks):** Confuses RPT with normative welfare economics. Claims RPT measures "happiness" directly. Fails to address the WARP violation.

  **2. Handling Circularity and the "Decision Rule" (5 Marks)**
  *   **A (5 marks):** Identifies the risk of tautology/unfalsifiability if "rules" are inferred solely from choices. Explains that saving the theory by re-describing options (menu-dependence) risks making the theory explain everything and predict nothing.
  *   **B (3-4 marks):** Notes that adding rules makes the theory complex but misses the specific logical problem of circularity (inferring the rule from the choice it explains).
  *   **C/D (0-2 marks):** Accepts the agent's rule explanation at face value without critiquing its scientific status. Claims the rule simply "solves" the problem.

  **3. Ontology of Utility (Revealed vs. Constructed) (5 Marks)**
  *   **A (5 marks):** Clearly distinguishes between utility as a mental state (welfare) vs. utility as a formal modeling device (construct). Argues that the case shows RPT constructs utility from behavior, potentially overriding the agent's mental state.
  *   **B (3-4 marks):** Discusses the difference between welfare and choice but fails to link it to the "revealed vs. constructed" debate. Vague on whether utility is in the head or in the model.
  *   **C/D (0-2 marks):** Treats utility as synonymous with money or goods. Does not address the epistemological status of utility.

  **4. Structure, Clarity, and Argumentation (5 Marks)**
  *   **A (5 marks):** Essay is tightly structured, addressing all three prompts sequentially. Arguments flow logically. No superfluous filler. Word count adhered to.
  *   **B (3-4 marks):** Addresses all prompts but transitions are clunky. Some repetition. Minor deviations from word count.
  *   **C/D (0-2 marks):** Disorganized. Fails to address one of the three specific sub-questions. Significantly under or over word count.

  **Specific Errors/Omissions Costing Marks:**
  *   **-2 Marks:** Citing specific authors (e.g., Samuelson, Sen, Hausman) by name. (Constraint violation).
  *   **-2 Marks:** Using standard examples (Allais, Giffen) instead of the provided framing.
  *   **-1 Mark:** Failing to mention the "decoy" or "regret" aspect of the prompt.
  *   **-1 Mark:** Concluding that the agent is simply "irrational" without analyzing *why* RPT forces that conclusion.
