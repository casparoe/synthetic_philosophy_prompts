      * *Correction on Guarantor Analysis:* If the Guarantor view says "you become guarantor... duties to explain... repair," is that blame? The user says "makes you the default addressee of complaints." That sounds like liability, not necessarily moral blame. If it's liability without fault, it's (2). If it's liability *because* you took the risk (and that was the wrong thing to do), it's (1). The prompt says "Everybody was behaving sensibly." So (1) struggles here because if everyone behaved sensibly, where is the desert? (1) has to argue that deploying *was* the fault. (2) says deployment is fine, but someone must pay. Guarantor says deployment *makes* you responsible. This aligns with (2)'s forward-looking need for a paymaster, justified by a backward-looking act of deployment. I will argue it is a pragmatic hybrid that functionally operates as (2).

      * *Residual Gap:* I need to be firm on whether the retribution gap matters. If we accept moral luck, the retribution gap is an illusion. I'll argue it's nostalgia.

      * *Lowest Level:* The Guarantor view is best here because it pre-assigns the role. (1) requires litigation to prove upstream negligence. (2) requires policy to assign liability. (3) makes it intrinsic to the role.

