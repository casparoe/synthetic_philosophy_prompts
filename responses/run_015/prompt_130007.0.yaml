      *   **Distinction:** Responsibility Gap (no one to blame) vs. Retribution Gap (blame impulses with no target).
      *   **Three Views to Evaluate:**
          1.  *Upstream Desert:* Keep desert, move it upstream to risk-creation/deployment.
          2.  *Revisionary/Forward-Looking:* Drop desert, focus on deterrence, compensation, trust.
          3.  *Guarantor View (User's Candidate):* Deployment confers status; deployer becomes guarantor of outputs (duties to explain, repair, change).
      *   **Tasks:**
          1.  Compare (1) and (2) properly (strongest versions, where they disagree).
          2.  Evaluate the Guarantor View: Is it a third option or does it collapse into (1) or (2)?
          3.  Weigh two specific criteria:
              *   Avoiding dumping blame on the lowest-level person (nurse/junior doctor).
              *   Identifying any *residual* gap (moral leftover) and assessing its moral weight.
