      *   *Analyzing Guarantor:* Is it distinct? It looks like strict liability. It's closer to (2) because it imposes duties regardless of fault, but uses role language. It's (2) with better packaging for institutional uptake.
      *   *The Lowest-Level Person:* How does Guarantor help? It formalizes the chain of custody.
      *   *The Residual Gap:* The retributive itch. Is it real? Yes. Does it matter? No, it's a bug in our psychology, not a feature of morality.
      *   *Verdict:* Guarantor is a variant of (2). (2) is the right path, but needs the Guarantor framing to work politically/practically.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Word Count Check:* Need to ensure I hit 1000-1200. I need to expand on the *why* of the collapse.
      *   *Tone:* Philosophical but direct. No hedging.
