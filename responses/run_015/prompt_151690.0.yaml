answer: |-
  First, a quick note on the housekeeping: you're right to flag the spelling, but don't worry—I'll model the correct forms ("separate," "principle") in my response without making a fuss. As for **Maya vs. Mayan**: Use **Maya** for the people and the civilization (e.g., "the Maya," "Maya society"). Reserve **Mayan** strictly for the language family (e.g., "Mayan languages"). It's a common mix-up, even in academia.

  Here is the dependency structure for your session. Since your group is science-literate, this arc treats the concepts like a model build: establish the boundary conditions, define the variables, then run the simulation.

  ### The Teaching Arc: Dependency Structure

  **1. The Prerequisite Concept: "Society as a Process, Not an Object"**
  *   **Why this must land first:** You cannot distinguish between structural decoupling and demographic drift if your audience views a society as a static thing (like a statue or a building). If they think a society *is* the pyramids or the king, then the destruction of those things equals total collapse.
  *   **The Hook:** Use a biological analogy they will respect. A society is not an organism; it is a *metabolism*. It is the flow of energy, goods, and information.
  *   **The Goal:** Get them to agree that if the flow changes route but doesn't stop, the "organism" hasn't necessarily died.

  **2. The Misconception Check: "Catastrophe Bias"**
  *   **When to address it:** Immediately after establishing "Society as Process," *before* you introduce your specific terms.
  *   **The Intervention:** Explicitly name the "Reactor Meltdown" model. Tell them: *"We tend to view collapse as a phase transition that is instantaneous and total. In physics, that's a brittle fracture. In history, it's almost always a fatigue failure."*
  *   **Why here:** If you introduce "Decoupling vs. Drift" while they still believe in "Meltdown," they will try to force your new terms into the old catastrophic box. You must break the "event" mindset before offering the "process" vocabulary.

  **3. The Core Distinction: Decoupling vs. Drift**
  *   **Now** you introduce your terms.
  *   **Structural Decoupling:** The "software" (hierarchy, tax, monumental construction) crashes; the "hardware" (bodies, local farming, kinship) remains online.
  *   **Demographic Drift:** The "hardware" thins out or migrates; the "software" (norms, oral tradition, identity) remains installed on the new hardware.

  **4. The Carrying Case: The Classic Maya (not the Bronze Age)**
  *   **Why the Maya?** The Classic Maya "collapse" (c. 800–950 CE) is the cleanest example of **Structural Decoupling**. The southern lowland city-states were abandoned (institutions failed), but the people did not vanish; they moved north or to the highlands, and the culture persisted into the Post-Classic period. It isolates the variable of *institutional failure* from *human extinction*.
  *   **Why NOT the Bronze Age?** Do not use the Bronze Age Collapse as your primary teaching tool. It is a "systems collapse" where trade, literacy, population, *and* centralization all failed simultaneously across multiple regions. It is too messy. It looks like *both* decoupling and drift happening at once, which will confuse your students when they are trying to learn the difference. Save the Bronze Age for a follow-up session on "Complexity Fragility."

  **5. The Application: Easter Island (Rapa Nui) as a Counter-Point**
  *   Use this briefly to show **Demographic Drift**. Recent archaeology suggests the population didn't vanish due to ecocide (the old story); it shrank and reorganized after contact. The social form survived despite the demographic hit. This contrasts with the Maya example.

  **6. The Refusal: What to Leave on the Table**
  *   **Cliometrics:** You are correct to drop this. Quantitative historical analysis requires data standards that don't exist for these periods. Bringing it up invites debates about data reliability rather than conceptual clarity.
  *   **Teleology (The "Why"):** Refuse to explain *why* societies collapse (ecology, war, ideology). That is a causal debate. Your session is about *morphology* (what shape the change takes). If someone asks, "But what caused the decoupling?", your answer is: *"That is a question for causality. Today we are only mapping the geometry of the change."*

  ### The Check-Question

  Do not ask them to define the terms. Ask them to classify a scenario.

  **The Question:**
  > "Imagine we find archaeological evidence that a capital city was burned and its writing system was never used again, but the surrounding rural villages show continuous occupation for 500 years with the same pottery styles and burial rites.
  >
  > **Did this society undergo Structural Decoupling or Demographic Drift?**"

  **The Correct Answer:** Structural Decoupling.
  **Why it works:** It forces them to separate the *institution* (city/writing) from the *people/culture* (villages/pottery). If they say "Collapse," they missed the point. If they say "Drift," they missed the fact that the population stayed put.

  ### Summary of Flow for Your Notes

  1.  **Define:** Society = Metabolic Process (not a building).
  2.  **Debunk:** Collapse = Fatigue Failure (not a meltdown).
  3.  **Distinguish:** Decoupling (Institutions break) vs. Drift (People move/shrink).
  4.  **Illustrate:** Maya (Decoupling) vs. Rapa Nui (Drift/Resilience).
  5.  **Exclude:** Causality ("Why") and Cliometrics ("How much").
  6.  **Verify:** The "Burned City/Continuous Village" test.

  This structure respects their scientific training by focusing on system states and variables, while keeping the philosophy grounded in the historical evidence they enjoy discussing. Good luck with the group.
