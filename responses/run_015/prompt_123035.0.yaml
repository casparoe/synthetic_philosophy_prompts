      *(Refining the "Suffering" definition)*: The user asks if "converged policy" is suffering. In RL, convergence is the *goal*. But in the film, convergence (knowing everything) leads to despair. This is the tension. The film argues that *perfect prediction* is death. The agent needs to experience the *limit* of its model.

      *(Final check on Question 4)*: The user asks what to build into the setup.
      1.  Persistent Memory (across resets).
      2.  Non-stationary Environment (the world changes in ways not captured by state).
      3.  Reward Hacking impossibility (the proxy reward diverges from true objective).

      Let's assemble this.

  9.  **Final Review against constraints:**
      *   Did I answer all four points? Yes.
      *   Is it serious about philosophy and RL? Yes.
