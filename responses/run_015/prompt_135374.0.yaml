      *   *Wait, the most helpful path for a novelist:* The "Class of People" argument. This is the "Right to Truth" argument. One only owes the truth to those who have a *right* to it. A murderer at the door has no right to the truth.
      *   *How to frame this as rejecting a step:* Reject **Step (4)**. The maxim is not "Mislead him." The maxim is "Protect the innocent from unjust aggression." The lie is a *means*, but the *end* is the preservation of right.
      *   *Actually, the cleanest philosophical cut:* Reject **Step (5)**. The "self-defeat" described is empirical (murderers learn), not logical (concept vanishes). Promising vanishes logically (a promise you don't keep isn't a promise). Speech does not vanish logically if you lie to a killer (a statement to a killer is still a statement).
