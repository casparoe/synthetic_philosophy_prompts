answer: |-
  # Indexicality and Causation: Resolving the Death in Damascus Paradox via De Se Belief Analysis

  ## Abstract

  This research proposal outlines a project designed to address a persistent instability within Causal Decision Theory (CDT) as exposed by the "Death in Damascus" paradox. Standard interpretations of this thought experiment suggest that CDT either collapses into fatalism or covertly relies on Evidential Decision Theory (EDT) principles to generate a stable recommendation. The prevailing literature often frames this problem through the lens of metaphysical fatalism—the idea that the agent's death is inevitable regardless of their choice. This project explicitly rejects that framing. Instead, it posits that the paradox arises from an unexamined conflation in the agent's epistemic state, specifically regarding the structure of self-locating belief. The central hypothesis is that the paradox only gains traction if the agent's knowledge of being "the one with the appointment" is treated as a causally unmediated *de se* belief that functions as a direct input into the causal model. By decomposing this belief into its *de dicto* (propositional) and indexical components, it may be possible to construct a causal graph where the prediction remains causally independent of the action, thereby allowing CDT to recommend a course of action without triggering the evidential feedback loop that leads to instability. This proposal details the research question, distinguishes the Damascus problem from Newcomb-style analogies, outlines the methodological steps for formalizing this epistemic split, defines criteria for success and failure, and assesses the feasibility of completing this analysis within a one-semester timeline. The goal is not to save the agent from death, but to save the decision theory from incoherence.

  ## Introduction: The CDT Stability Problem

  Causal Decision Theory has long been championed for its intuitive alignment with the notion that rational agents should choose actions based on their causal consequences rather than mere correlations. The core tenet of CDT is that an agent should maximize expected utility relative to the causal impact of their actions on the world. This stands in contrast to Evidential Decision Theory, which advises agents to choose actions that provide the best news about the state of the world, regardless of whether the action causes that state. In most standard decision problems, CDT provides robust, stable recommendations that align with our pre-theoretic intuitions about rationality. However, there exists a specific class of problems involving highly accurate predictors where CDT appears to falter. The most prominent of these is the "Death in Damascus" paradox.

  In the standard telling of the parable, an agent is informed by a highly accurate predictor (Death) that they have an appointment in Damascus tomorrow. The agent, wishing to avoid this appointment, considers fleeing to Aleppo. However, the predictor's accuracy implies that if the agent flees to Aleppo, Death would have predicted this and been waiting in Aleppo. If the agent stays in Damascus, Death predicted that and is waiting there. The agent seems trapped in a loop where any deliberation about where to go serves as evidence that Death is already there. Standard CDT analysis often leads to a state of instability: the agent calculates that fleeing is better, but the act of calculating that fleeing is better makes fleeing the option where Death is located, rendering staying better, which in turn makes staying the option where Death is located.

  The literature surrounding this paradox frequently devolves into a discussion of fatalism. The conclusion is often drawn that the agent is doomed regardless of their choice, and therefore the decision theory is irrelevant to the outcome. This research proposal explicitly brackets the metaphysical question of inevitability. Whether the agent dies or survives is secondary to the question of whether the decision theory can generate a consistent recommendation without self-contradiction. The problem is not that the agent dies; the problem is that CDT seems unable to identify a unique rational action without either accepting a fatalistic deadlock or implicitly adopting the evidential reasoning it was designed to reject.

  Recent attempts to resolve this within the CDT framework have included the "Tickle Defense," which suggests that the agent should condition on their internal urges rather than their actions, and Ratificationism, which requires that a chosen act be the one the agent would choose given that they choose it. While these solutions offer partial relief, they often feel ad hoc or require significant modifications to the core axioms of CDT. They risk smuggling in evidential considerations under the guise of causal analysis. For instance, if the agent treats their urge to flee as evidence of Death's location, they are effectively engaging in evidential reasoning about their own psychology.

  This project proposes a different avenue of resolution rooted in the philosophy of language and mind, specifically the distinction between *de dicto* and *de se* belief. The central contention is that the instability in CDT arises because the agent's knowledge state is modeled too coarsely. When the agent learns "Death is looking for the person with the appointment," this is a *de dicto* proposition. When they realize "I am the person with the appointment," this is a *de se* identification. Standard decision-theoretic models often treat these as a single informational update that directly constrains the causal graph. I argue that this conflation is the source of the paradox. If the indexical component of the belief is treated as a separate epistemic layer that does not causally influence the predictor's prior determination, the feedback loop may be severed.

  The significance of this research extends beyond the specific parable. Death in Damascus is a stress test for CDT. If CDT cannot handle cases involving self-locating information and predictors, its claim to be a general theory of rational choice is weakened. Conversely, if the theory can be stabilized through a more nuanced epistemic analysis, it reinforces the viability of causal decision-making in complex informational environments. This project aims to demonstrate that the fatalist inference is not a necessary feature of the scenario but an artifact of how we model the agent's self-knowledge. By refining the input to the decision function, we can preserve the causal integrity of the output.

  The following sections will detail the theoretical background, explain why standard analogies to Newcomb's Problem fail to capture the specific epistemic nuance required here, outline the proposed methodological approach, and define the parameters for a successful conclusion. The ultimate goal is to produce a rigorous argument showing that a split-belief model allows CDT to function without fatalism and without evidential contamination.

  ## Theoretical Landscape: CDT, EDT, and the Damascus Challenge

  To understand the specific contribution of this project, it is necessary to first map the current theoretical landscape regarding the Death in Damascus paradox. The tension lies between the causal independence of the past and the evidential dependence of the prediction. In Causal Decision Theory, the utility of an action is calculated by summing the utilities of outcomes weighted by the probability of those outcomes conditional on the action, but only where the action causally influences the outcome. Formally, CDT utilizes causal counterfactuals or partitionings of states of the world that are causally independent of the agent's choice. In Death in Damascus, the state of the world is "Death is in Damascus" or "Death is in Aleppo." The predictor's accuracy implies a strong correlation between the agent's choice and Death's location.

  The challenge for CDT is that the prediction is made *before* the choice, suggesting causal independence. If the prediction is causally independent, CDT should treat the probability of Death being in Damascus as fixed regardless of whether the agent goes to Damascus or Aleppo. If the probabilities are fixed, the agent should simply choose the location where they are less likely to die. However, the setup of the paradox stipulates that the predictor is infallible or nearly infallible. This creates a situation where the agent's choice is perfectly correlated with the prediction. If the agent chooses Damascus, the prediction was Damascus. If the agent chooses Aleppo, the prediction was Aleppo.

  Evidential Decision Theory handles this easily. EDT conditions directly on the action. $V(A) = \sum P(O|A) \cdot U(O)$. Since $P(\text{Death in Damascus} | \text{Go to Damascus})$ is high (due to the predictor's accuracy), the expected utility of going to Damascus is low. The same applies to Aleppo. EDT leads to a state where both options have low utility, but it does not necessarily generate a logical loop in the same way CDT does; it simply acknowledges the bad news. However, EDT is widely considered flawed in other contexts (such as the Smoking Lesion problem) because it recommends avoiding actions that are merely correlated with bad outcomes but do not cause them. CDT is preferred because it avoids this "managing the news" problem. The goal of this project is to allow CDT to handle Damascus without adopting EDT's vulnerability in other cases.

  The standard CDT response to Damascus often involves the concept of "ratification." A decision is ratifiable if, once the agent decides to do it, they do not regret that decision given the information that they have decided it. In Damascus, if I decide to go to Aleppo, I infer that Death predicted Aleppo, so I should have stayed in Damascus. Thus, the decision is not ratifiable. This leads to the search for a mixed strategy or a recognition that no pure strategy is stable. Some theorists argue this implies the agent is irrational simply by being in the situation, or that the scenario is impossible for a CDT agent.

  This is where the fatalism framing typically enters. The argument goes: "Since the prediction is already made and accurate, your choice cannot change it. Therefore, you will die where Death is. Since Death is where you are, you will die where you are. Choice is illusory." This research proposal rejects this conclusion. The illusory nature of choice is a metaphysical claim, not a decision-theoretic one. Decision theory is normative; it tells us what we *ought* to do given our goals. Even if the outcome is fixed, the rationality of the deliberation process matters. If CDT says "There is no rational choice," it is failing its normative function.

  Furthermore, the "Tickle Defense" attempts to solve this by suggesting the agent should condition on their internal decision state (the "tickle" of the urge to act) rather than the action itself. The idea is that the urge causes the action, and the prediction predicts the urge. If I know my urge, the action provides no extra evidence. However, this defense is controversial. It requires the agent to have privileged access to their causal decision state that bypasses the prediction. In many formulations of the paradox, the predictor predicts the agent's *reasoning process* itself, not just a brute urge. If the predictor simulates the agent's CDT calculation, the Tickle Defense fails because the calculation itself is predicted.

  This project posits that both the Ratificationist and Tickle Defense approaches miss a fundamental epistemic distinction. They treat the agent's knowledge of the situation as a monolithic block of data. They assume that "I know Death is looking for me" is a single proposition that enters the causal model. I argue that this knowledge is composite. It involves a general proposition ("Death is looking for the person who matches description D") and an indexical identification ("I match description D"). The causal link between the prediction and the world operates on the general proposition. The indexical identification is a matter of self-location.

  If we treat the indexical component as distinct, we might be able to argue that the agent's *choice* does not update the probability of the general proposition, only the indexical fit. In standard models, choosing Aleppo updates the probability that "Death is in Aleppo." In the split-belief model, choosing Aleppo updates the probability that "I am the one in Aleppo," while the location of Death relative to the "appointment holder" remains fixed by the prior prediction. This subtle shift changes the causal graph. It suggests that the agent's action does not provide evidence about where Death is *relative to the appointment*, but only where the agent is relative to Death. If the agent can decouple "Me" from "The Appointment Holder" in the causal calculation, the feedback loop is broken.

  This requires a rigorous defense. It is not enough to assert the distinction; one must show how it integrates into the expected utility calculation. The theoretical landscape is currently dominated by causal graph models (Bayesian networks) where nodes represent variables. The challenge is to represent *de se* belief in these graphs. Standard nodes are propositional. Indexical belief requires a different structure, perhaps involving centered worlds or a specific agent-node that links the subjective perspective to the objective state. This project will explore how to formalize this without overcomplicating the decision theory to the point of unusability.

  The stakes are high. If CDT cannot resolve Damascus without fatalism or evidential smuggling, it suggests that CDT is incomplete. It requires an epistemic supplement to handle self-locating information. This project aims to provide that supplement. By focusing on the structure of belief rather than the metaphysics of time or prediction, we can potentially salvage CDT's core intuition: that we should act to cause good outcomes, not to signal good news. The Damascus paradox tempts us to believe that signaling *is* causing in this context. This project argues that the signal is an artifact of confused self-identification.

  ## The Newcomb Disanalogy: Why Standard Solutions Fail

  A significant portion of the existing literature attempts to solve Death in Damascus by treating it as a variant of Newcomb's Problem. In Newcomb's Problem, an agent faces two boxes: one transparent with a small sum, and one opaque which may contain a large sum. A predictor has already placed the large sum in the opaque box if and only if they predicted the agent would take only the opaque box (one-box). CDT typically recommends two-boxing (taking both), arguing that the content of the box is already fixed and cannot be changed by the current choice. EDT recommends one-boxing, as taking only one box is strong evidence that the large sum is there.

  It is tempting to map Death in Damascus onto this structure. Staying in Damascus is analogous to one-boxing (cooperating with the prediction), and fleeing to Aleppo is analogous to two-boxing (defecting against the prediction). However, this analogy is imperfect, and relying on it obscures the specific epistemic mechanism that generates the paradox in the Damascus case. This section details why the Newcomb analogy fails to solve the specific version of the problem this project addresses, and why standard Newcomb-style solutions (like dominance reasoning) do not cleanly apply.

  First, the causal structure differs. In Newcomb's Problem, the prediction concerns a specific action (taking one box vs. two). The content of the box is causally dependent on the prediction, which is dependent on the predicted action. The agent's actual action does not causally influence the box's content. In Death in Damascus, the prediction concerns the agent's *location* relative to the predictor. The "payoff" (survival) depends on the match between location and predictor. In Newcomb, the payoff depends on the match between action and prediction. This seems similar, but the spatial element in Damascus introduces a mobility factor that Newcomb lacks. In Newcomb, the boxes are stationary. In Damascus, the agent moves. This mobility allows for the intuition that "I can go where Death isn't." In Newcomb, you cannot "go" to the box with the money; you can only choose which to take. The spatial dynamic in Damascus creates a stronger intuition of causal efficacy ("I can physically move away from Death") that competes with the evidential intuition ("Death follows my move").

  Second, and more critically for this project, the epistemic access differs. In standard Newcomb problems, the agent does not know the prediction. They know the *rules* of the prediction, but not the *outcome*. In Death in Damascus, the agent is explicitly told the outcome: "I have an appointment with you in Damascus." This is a crucial distinction. The agent possesses specific *de se* information about the prediction's target. In Newcomb, the agent reasons: "If I one-box, the predictor likely predicted one-boxing." In Damascus, the agent reasons: "The predictor predicted I would be in Damascus." The latter is a direct assertion about the agent's future state.

  This direct assertion creates the fatalist loop. If I treat "The predictor predicted I would be in Damascus" as a fixed fact, then going to Aleppo seems to contradict a known fact. In Newcomb, going two-boxes does not contradict a known fact; it merely correlates with an empty box. In Damascus, going to Aleppo seems to imply the predictor was wrong, which contradicts the premise of infallibility. This forces the agent into a reasoning loop: "If I go to Aleppo, the prediction must have been Aleppo, but I was told it was Damascus."

  Standard Newcomb solutions often rely on the "Dominance Principle." In Newcomb, two-boxing dominates one-boxing because regardless of what is in the opaque box, taking both yields more money. In Damascus, does fleeing dominate staying? If Death is in Damascus, fleeing saves me. If Death is in Aleppo, staying saves me. There is no dominance. The outcome depends entirely on the state of the world (Death's location). Since the state of the world is correlated with the action, dominance reasoning fails. This is why CDT struggles more with Damascus than with Newcomb. In Newcomb, CDT has a clear recommendation (two-box) even if it yields less money. In Damascus, CDT has no stable recommendation; it oscillates.

  Therefore, importing Newcomb solutions does not work. We cannot simply say "Treat the prediction as fixed and maximize causal utility," because treating the prediction as fixed ("Death is in Damascus") makes fleeing the dominant choice, but the infallibility premise makes fleeing impossible (since if you flee, Death was in Aleppo). The tension is between the *content* of the belief and the *reliability* of the source.

  Furthermore, the Newcomb analogy often leads to a focus on the predictor's mechanism (how do they predict?) rather than the agent's belief state (how do they process the prediction?). This project argues that the mechanism is irrelevant. Whether Death uses magic, simulation, or deduction, the problem for the agent is how to integrate the knowledge "I am the target" into their decision matrix. Newcomb-style analyses often bypass this by focusing on the correlation between action and state. But in Damascus, the correlation is mediated by the agent's *knowledge* of the correlation. It is a self-referential loop.

  By distinguishing the Damascus problem from Newcomb, we clear the ground for the *de se* analysis. In Newcomb, the belief is "The predictor is accurate." In Damascus, the belief is "The predictor is accurate AND the predictor predicts I will be in Damascus." The second conjunct is indexical. It ties the general accuracy to the specific self. Standard decision theory treats these as a single probability distribution over states. I argue they must be separated. The accuracy is a *de dicto* fact about the world. The targeting is a *de se* fact about the agent.

  If we treat this as a Newcomb problem, we assume the state "Death in Damascus" is a standard world-state like "Money in Box B." But "Death in Damascus" is only bad for me if *I* am in Damascus. If I am not in Damascus, "Death in Damascus" is irrelevant. The utility function is indexical. Standard Newcomb analysis often uses non-indexical utility functions (Money is good). In Damascus, Survival is good *for me*. This indexicality in the utility function combined with the indexicality in the belief state creates a compound problem that Newcomb analogies do not capture.

  Consequently, solutions that work for Newcomb (like causal graph pruning) may not work for Damascus because they do not account for the self-locating nature of the threat. A causal graph that prunes the arrow from Action to Prediction works for Newcomb because the prediction is about the action. In Damascus, the prediction is about the *location*, and the action *is* the location. The action and the predicted state are ontologically identical (being in a place). In Newcomb, the action (taking) and the predicted state (boxing) are distinct. This ontological overlap in Damascus is what generates the fatalism. The agent feels they cannot change their location because their location is already "written."

  This project contends that the ontological overlap is an illusion created by the *de se* belief. "My being in Damascus" is not the same event as "The appointment holder being in Damascus" until the indexical identification is made. If the decision is made before the identification is fully integrated into the causal model, the agent can treat "The appointment holder's location" as fixed while treating "My location" as variable. This is the crux of the disanalogy. Newcomb does not require this split because the agent is never in doubt about whether they are the agent. In Damascus, the "appointment" functions as a description that the agent must identify with. By leveraging this disanalogy, we can justify a unique methodological approach that Newcomb-based solutions cannot support.

  ## The Core Hypothesis: De Se Belief and Causal Decoupling

  The central hypothesis of this research is that the instability in Causal Decision Theory regarding the Death in Damascus paradox is a result of modeling the agent's epistemic state as a unified propositional attitude. Specifically, the agent's knowledge that "Death is looking for me in Damascus" is treated as a single piece of evidence that updates the probability of the state of the world. I propose that this knowledge should be decomposed into two distinct components: a *de dicto* component regarding the predictor's behavior and a *de se* component regarding the agent's identity relative to the prediction.

  The *de dicto* component is the proposition: "The predictor will be located where the agent with the appointment is located." This is a general law-like statement about the predictor's reliability and modus operandi. It does not mention the specific agent making the decision, only "the agent with the appointment." In the causal graph, this node should be treated as a fixed parameter or a background condition. It is causally prior to the decision.

  The *de se* component is the identification: "I am the agent with the appointment." This is an indexical belief. In standard decision theory, this identification is assumed to be immediate and total. Once I know I am the target, I merge my decision node with the target's decision node. My hypothesis is that this merger is premature. The agent should maintain a distinction between "My Choice" and "The Appointment Holder's Predicted Location."

  By splitting these beliefs, we can construct a causal model where the predictor's accuracy applies to the "Appointment Holder" variable, while the agent's choice applies to the "Agent's Location" variable. The paradox arises because we assume these two variables are identical. I argue they are only identical *after* the decision is made and the world is realized. At the moment of deliberation, the agent can treat the "Appointment Holder's Location" as a fixed state determined by the prediction, and "My Location" as the variable under their control.

  The critical move is to argue that the indexical identification does not carry causal weight. Knowing "I am the target" does not cause Death to move. It only updates my expectation of where Death is. However, if I treat my choice as determining where "I" am, and I treat "The Target" as a separate conceptual bucket in the causal model, I can choose to go to Aleppo while maintaining that "The Target" was predicted to be in Damascus. The conflict only arises if I assume that "Me going to Aleppo" forces "The Target to be in Aleppo."

  This sounds like semantic trickery, but it has formal implications. In a Bayesian network, we would have a node for $P$ (Prediction), a node for $T$ (Target Location), and a node for $A$ (Agent Action). Standard models set $P = T$ and $T = A$ (due to infallibility). This creates a loop $A \rightarrow P \rightarrow T \rightarrow A$. My proposal suggests modeling $P$ as predicting $T$, and $A$ as determining the Agent's Location ($L$). The utility depends on whether $L = T$. The agent knows $P$ predicts $T$. The agent knows $I$ am the Target. But in the calculation, if I treat $T$ as fixed by $P$, and $L$ as variable by $A$, I can maximize utility by setting $L \neq T$.

  The objection, of course, is that if I am the Target, then $L$ must equal $T$. This is where the *de se* analysis does the heavy lifting. The statement "I am the Target" is not a causal constraint; it is an epistemic identification. If I choose $L \neq T$, I am not changing the fact that I am the Target; I am changing the fact of where the Target is. But the Target's location was predicted. So if I change the Target's location, the prediction was wrong. But the prediction is infallible.

  To resolve this, the hypothesis posits that the infallibility applies to the *disposition* of the Target, not the *location* independent of the disposition. The prediction is "The Target will go to Damascus." If I, as the Target, choose to go to Aleppo, then the prediction was "The Target will go to Aleppo." The content of the prediction is counterfactually dependent on my choice. CDT says we should ignore this dependence if it is not causal. But here, the dependence seems logical.

  The *de se* split allows us to say: The prediction was about "The person who fits the description." I fit the description. But my fitting the description does not causally force my location. It only identifies me as the subject of the prediction. If I treat the prediction as "Whoever fits the description will be in Damascus," and I choose to be in Aleppo, then either I cease to fit the description (impossible) or the prediction is false (impossible).

  The solution lies in treating the indexical belief as *information* rather than *constraint*. When I learn "You have an appointment," I gain information. I do not gain a causal shackle. CDT requires us to act as if our action does not change the past. The prediction is in the past. Therefore, I must act as if my action does not change the prediction. If I act as if my action does not change the prediction, I must assume the prediction is fixed. If the prediction is "Damascus," and I go to Aleppo, I am assuming the prediction is wrong. But I know it is infallible.

  The hypothesis resolves this by suggesting that the "infallibility" is a *de dicto* rule that does not bind the *de se* choice in the way we think. The rule is: "For any agent $x$, if $x$ is the target, Death predicts $x$'s location." This is a universal generalization. When I instantiate $x$ with "Me," I get "Death predicts my location." But in the decision matrix, I am evaluating the counterfactual: "If I go to Aleppo, what happens?" In this counterfactual world, does the universal generalization hold? Yes. So Death predicts Aleppo. But I have evidence Death predicted Damascus.

  The *de se* split suggests that the evidence "Death predicted Damascus" is evidence about the *world*, not about my *choice*. I should condition on the world state ("Death is in Damascus") and then choose. If I condition on "Death is in Damascus," then going to Aleppo yields survival. The fact that this contradicts the infallibility premise is a problem for the *scenario's coherence*, not for the *decision theory*. CDT's job is to tell me what to do given the probabilities. If I assign probability 1 to "Death is in Damascus," CDT says "Go to Aleppo." The fact that this implies the predictor was wrong is a metaphysical contradiction in the setup, but rationally, given the belief "Death is in Damascus," fleeing is the causal best option.

  The paradox bites because we feel we cannot assign probability 1 to "Death is in Damascus" while simultaneously acknowledging the predictor's infallibility regarding our choice. We feel our choice determines the probability. The *de se* hypothesis argues that this feeling is the error. The indexical belief "I am the target" should not update the probability of the prediction's content, only the relevance of that content to me. I should accept "Death is in Damascus" as a fixed fact (like the contents of Newcomb's Box) and act accordingly. The fatalism comes from thinking that by accepting it as a fixed fact, I am admitting I cannot change it. But I can change my location. I just can't change the fact that Death predicted it. If I survive, it means the prediction was wrong, which contradicts the setup. But CDT doesn't care about the setup's metaphysical consistency; it cares about maximizing utility given the beliefs.

  This research will argue that CDT is correct to recommend fleeing, and the "loop" is a psychological artifact of trying to reconcile the prediction's infallibility with the action's freedom. By strictly separating the *de dicto* reliability of the predictor from the *de se* identification of the target, the agent can treat the prediction as a fixed environmental hazard (like a storm in Damascus) rather than a mirror of their will.

  ## Methodology and Argumentative Roadmap

  To test this hypothesis and develop it into a full philosophical argument, the research will proceed through four distinct phases over the course of the semester. Each phase builds on the previous one, moving from conceptual clarification to formal modeling and finally to objection handling.

  **Phase 1: Conceptual Clarification and Literature Synthesis (Weeks 1-4)**
  The first month will be dedicated to rigorously defining the *de se/de dicto* distinction within the context of decision theory. While this distinction is well-trodden in the philosophy of language (e.g., Perry, Lewis), its application to causal graphs is less developed. I will analyze existing formalizations of self-locating belief to determine which is most compatible with CDT. The goal is to produce a precise definition of "Indexical Belief Node" that can be inserted into a decision matrix.
  Simultaneously, I will refine the statement of the Death in Damascus problem to strip away fatalistic language. I will rewrite the paradox using neutral terminology (e.g., "The Avoidance Problem") to ensure the analysis does not presuppose inevitability. This phase will result in a clear problem statement that isolates the epistemic conflation as the primary variable.
  *Deliverable:* A 1,500-word conceptual framework section defining the epistemic split.

  **Phase 2: Formal Modeling of the Split-Belief Causal Graph (Weeks 5-8)**
  In the second phase, I will construct a causal model that incorporates the proposed distinction. I will use standard Bayesian network notation to represent the variables: $D$ (Death's Location), $P$ (Prediction), $A$ (Agent's Action), and $I$ (Indexical Identification).
  Standard models link $P \rightarrow D$ and $A \rightarrow D$ (via prediction). I will propose a model where $P \rightarrow D$ is fixed, and $I$ acts as a filter between $D$ and Utility, without feeding back into $P$.
  I will run the expected utility calculations on this model. The critical test is whether the recommendation remains stable. If the model recommends "Flee" consistently without updating the probability of $D$ based on $A$, the hypothesis holds. I will compare this calculation against the standard CDT calculation and the EDT calculation to highlight the differences.
  *Deliverable:* A formalized causal diagram and a set of utility equations demonstrating the stability of the recommendation.

  **Phase 3: Stress Testing and Counterexamples (Weeks 9-12)**
  A solution is only as good as its resilience against counterexamples. In this phase, I will apply the split-belief model to variants of the Damascus problem.
  1.  *The Psychopath Button:* A case where pressing a button kills all psychopaths, and the agent wonders if they are a psychopath. Does the *de se* split help here?
  2.  *The Transparent Newcomb Problem:* Where the agent can see the box. Does the indexical distinction hold when the evidence is visual?
  3.  *The Dual-Agent Scenario:* Two agents are told one has an appointment. Does the *de se* belief function differently when identity is uncertain?
  If the model fails in these cases, I will need to adjust the boundaries of the hypothesis. For instance, it may be that the split only works when the prediction is communicated linguistically rather than observed physically. This nuance will be crucial for the final argument.
  *Deliverable:* A comparative analysis of the split-belief model across three variant scenarios.

  **Phase 4: Synthesis and Objection Handling (Weeks 13-15)**
  The final phase involves anticipating and answering objections. The primary objection will be that this approach "cheats" by ignoring the logical connection between the agent and the target. I must argue why ignoring this connection is rationally permissible for a CDT agent. I will also address the charge of fatalism: does treating the prediction as fixed amount to accepting fate? I will argue that it amounts to treating the past as fixed, which is a core tenet of CDT, not fatalism.
  Finally, I will synthesize the findings into a cohesive argument that answers the research question.
  *Deliverable:* The final paper sections integrating the model, the tests, and the defense.

  Throughout this process, I will maintain a log of argumentative dead-ends. If the formal modeling proves that the *de se* split does not mathematically alter the expected utility calculation, this is a significant finding in itself (a negative result). It would suggest that the problem lies elsewhere, perhaps in the definition of causation itself. However, the preliminary analysis suggests that the separation of the identification node does alter the conditioning set, which is sufficient to break the loop.

  The method is primarily analytic and formal. It does not require empirical data, but it does require rigorous logical consistency. I will use thought experiments as data points, testing the intuition pumps against the formal model. If the model says "Flee" but the intuition says "It's futile," I must explain why the intuition is misled by the fatalist framing.

  ## Evaluation Criteria: Success, Failure, and Ambiguity

  Given the theoretical nature of this project, success is not measured by empirical verification but by argumentative coherence and theoretical utility. I have established three tiers of outcomes to evaluate the project's conclusion.

  **Successful Outcome:**
  A successful result is one where the split-belief model generates a stable CDT recommendation (e.g., "Flee to Aleppo") that does not oscillate and does not require the agent to assign probability 1 to their own death. Crucially, the model must achieve this without implicitly using evidential conditioning. That is, the probability of Death's location must remain independent of the Action node in the causal graph. If the model achieves this, it demonstrates that the fatalist inference is indeed an artifact of epistemic conflation. It would validate the thesis that *de se* beliefs require special handling in causal decision matrices. This would be a significant contribution to decision theory, offering a patch for CDT that preserves its causal purity.

  **Failure Outcome:**
  A failure occurs if the split-belief model collapses back into the standard loop. This would happen if, upon formalization, the indexical identification node inevitably creates a back-door path between the Action and the Prediction. For example, if identifying as the Target logically forces the Agent's Location to match the Predicted Location in all possible worlds, then the causal graph cannot be pruned.
  Another form of failure is if the solution works for Damascus but breaks CDT in standard cases (like the Smoking Lesion). If saving CDT in Damascus requires making it vulnerable to managing the news in other scenarios, the trade-off is unacceptable. The solution must be locally effective without global costs.
  Finally, if the argument relies on a distinction between *de se* and *de dicto* that is philosophically untenable (e.g., if self-identification cannot be separated from the proposition in any meaningful way), the project fails.

  **Ambiguous/Partial Outcome:**
  It is possible that the model works only under specific conditions. For instance, it might only resolve the paradox if the predictor's communication is treated as non-binding information rather than a logical constraint. If the result is conditional, the project will still be valuable as it maps the boundary conditions of CDT's applicability. A partial success would define the specific epistemic conditions under which CDT remains stable in prediction-heavy environments. This would refine the scope of CDT rather than solving the paradox universally.

  In all scenarios, the project avoids the "fatalist trap" of concluding that rationality is impossible. Even in a failure state, the analysis will pinpoint *why* CDT fails, which is more informative than a blanket dismissal. The metric for success is the clarity of the causal graph and the stability of the utility function.

  ## Scope and Feasibility: One-Semester Constraints

  A one-semester timeline imposes strict limits on the depth of formalization and the breadth of literature coverage. This section outlines the boundaries of the project to ensure completion.

  **Inclusions:**
  1.  **Focus on Epistemology:** The project will focus primarily on the belief state of the agent. It will not delve deeply into the metaphysics of time travel or backward causation, even though these are often associated with Damascus. The predictor's mechanism is treated as a black box.
  2.  **CDT Centric:** The analysis will prioritize saving CDT. While EDT and FDT (Functional Decision Theory) will be discussed for contrast, the project will not attempt to prove them wrong, only to show that CDT can survive without becoming them.
  3.  **Formal Simplicity:** The causal graphs will be kept as simple as possible. Complex probabilistic programming is beyond the scope. The goal is conceptual clarity, not computational simulation.
  4.  **Key Variants:** Only the three variants listed in the methodology (Psychopath, Transparent, Dual-Agent) will be analyzed. Expanding to more exotic variants (e.g., Parfit's Hitchhiker) will be avoided unless directly relevant to the *de se* claim.

  **Exclusions:**
  1.  **Literary History:** As requested, the proposal excludes the literary history of the parable. The focus is strictly on the decision-theoretic structure.
  2.  **Metaphysical Fatalism:** The project will not argue against determinism. It accepts the deterministic setup of the paradox and asks how to decide within it.
  3.  **Comprehensive Survey:** This is not a survey of all decision theory. It is a targeted intervention on a specific paradox. References to Newcomb and Smoking Lesion will be limited to their utility in testing the hypothesis.
  4.  **Empirical Psychology:** The project will not test how actual humans reason about Damascus. It is a normative project about rationality, not a descriptive one about cognition.

  **Feasibility Check:**
  The word count target (6000 words for the proposal/paper draft) is ambitious but manageable given the narrow scope. The risk lies in the formal modeling phase. If the *de se* logic proves resistant to standard Bayesian notation, significant time may be lost trying to force a formalism. To mitigate this, the project allows for a "conceptual formalism" where the relationships are described rigorously in text if mathematical notation becomes a bottleneck. The primary goal is the philosophical argument, not the math.
  The timeline allocates sufficient time for the "Objection Handling" phase, which is often where these projects stall. By front-loading the conceptual clarification, the later stages should proceed smoothly. The scope is tight enough to be finished in 15 weeks but broad enough to yield a substantive conclusion.

  ## Conclusion: Significance of the Work

  The Death in Damascus paradox remains a thorn in the side of Causal Decision Theory. It is often cited as evidence that CDT is fundamentally flawed or that rationality requires a departure from causal reasoning. This research proposal challenges that consensus. By shifting the focus from the causal structure of the world to the epistemic structure of the agent, it offers a path to reconcile CDT with high-accuracy prediction scenarios.

  The significance of this work lies in its potential to restore confidence in CDT's normative power. If the paradox is dissolved by a refined understanding of *de se* belief, it suggests that many apparent failures of decision theory are actually failures of epistemic modeling. It underscores the importance of integrating philosophy of mind (specifically self-locating belief) with decision theory.
  Furthermore, by explicitly rejecting the fatalist framing, this project preserves the agency of the decision-maker. It affirms that even in a deterministic universe with infallible predictors, the question "What should I do?" has a meaningful answer. The answer is not "Nothing," and it is not "Submit." The answer is derived from a clear-eyed assessment of what is causally within one's power versus what is merely evidence of one's fate.

  This proposal outlines a rigorous, methodical approach to achieving this resolution. It identifies the precise point of failure in current theories, proposes a novel structural fix, and sets clear criteria for evaluating its success. Within the constraints of a one-semester timeline, this project is feasible and promises to make a distinct contribution to the ongoing debate in decision theory. It moves the conversation past the stalemate of "Causal vs. Evidential" and into the more nuanced terrain of "Causal vs. Indexical." By doing so, it aims to demonstrate that the agent in Damascus is not a victim of fate, but a victim of a confused belief state—and that clarity is sufficient to restore rational choice.

  The ultimate deliverable will be a paper that not only solves a specific paradox but also provides a template for handling self-locating information in other decision-theoretic contexts. Whether the result is a full resolution or a mapped boundary of CDT's limits, the inquiry will advance our understanding of how rational agents ought to navigate a world where their own choices are transparent to others. The separation of the "I" from the "Target" may well be the key to unlocking the cage of Damascus, not by breaking the bars, but by realizing the door was never locked.
