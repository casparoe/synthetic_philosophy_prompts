  Here is the breakdown of your seminar leader's likely ruling, the theoretical rules that fit his track record, and the specific case that will force him to reveal his hand.

  ### 1. The Prediction
  **Verdict:** "I promised" gives you **no reason at all** to go. There is **no residue**, nothing you owe him, and no moral failure if you stay home.

  **The Feature Doing the Work:** The **release**.
  In your leader's framework, a promise generates a reason only insofar as it creates a normative bond or serves a function (assurance/reliance). When the promisee explicitly dissolves that bond ("I release you"), the *source* of the reason is extinguished, not just outweighed. This is structurally identical to **Case 4** (coerced promise = void) and **Case 5** (silly rule = no purpose), not **Case 1** (valid promise vs. competing value).

  In Case 1, the promise was *valid* but *overridden*. Here, the promise is *validly terminated*. Your leader distinguishes sharply between "I can't because something more important came up" (Case 1: Reason persists, residue exists) and "I don't have to because the obligation is gone" (Case 6: Reason vanishes, no residue).

  ### 2. Three Rules That Fit Cases 1–5
  Here are three theoretical frameworks that all explain his past five rulings but diverge on how they handle your case.

  **Rule A: Defeasible Generalism (The "Override" Model)**
  *   **The Theory:** Promises *always* generate a *pro tanto* reason for. This reason is invariant. However, other facts (like "something more important came up" or "he released me") can act as *defeaters* that justify not acting.
  *   **Fit:** Explains Case 1 (Reason outweighed). Explains Case 4 & 5 (The "promise" or "rule" was defective, so no reason generated in the first place).
  *   **Prediction for Your Case:** "I promised" **IS a reason**, but "He released me" is a stronger counter-reason (or permission).
  *   **Residue:** Because the reason *existed* but was not acted upon (even if permitted), there is a **tiny residue**. You acted permissibly, but you still broke a promise, so you might owe a small acknowledgment ("Glad you're okay I didn't come") to acknowledge the broken word, even if forgiven.

  **Rule B: Moral Particularism (The "Context" Model)**
  *   **The Theory:** Features like "I promised" have no invariant moral valence. They are reasons only in contexts where they function as reasons. Context can enable, disable, or reverse them (Case 2 & 3).
  *   **Fit:** Explains Case 2 & 3 (Valence flips). Explains Case 4 & 5 (Context disables the reason entirely). Explains Case 1 (Context allowed reason to persist but be outweighed).
  *   **Prediction for Your Case:** In the context of a release, the feature "I promised" **ceases to be a reason**. It becomes inert. It is not outweighed; it is disabled.
  *   **Residue:** **None.** If the reason is disabled, there is no normative bond left to leave a remainder.

  **Rule C: Teleological Functionalism (The "Purpose" Model)**
  *   **The Theory:** Normative facts (rules, promises) generate reasons only if they serve a point (Case 5). The point of a promise is to assure the promisee and prevent harm from reliance (Case 1).
  *   **Fit:** Explains Case 5 (No purpose = no reason). Explains Case 1 (Reliance existed = residue). Explains Case 4 (Coercion defeats the purpose of assuring).
  *   **Prediction for Your Case:** The purpose of the promise (assuring him) is explicitly negated by his statement ("I don't need you"). Therefore, **no reason**.
  *   **Residue:** **None.** Without harm or reliance, there is nothing to owe.

  ### 3. My Best Guess: Which is His?
  **He is running Rule B (Moral Particularism) with a heavy lean toward Rule C (Functionalism).**

  **Why:**
  1.  **Case 2 & 3 are the tell.** A Generalist (Rule A) struggles to explain why "fun" becomes a reason *against* or "hurt" becomes a reason *for* without complex add-ons. A Particularist says this is just how reasons work: holism.
  2.  **Case 5 is the clincher.** He explicitly said a rule gives "no reason at all—not even a tiny one" if it lacks purpose. A Generalist would usually say it gives a *weak* reason that is easily outweighed. He treats "no purpose" as "no reason."
  3.  **The Residue Distinction.** In Case 1, he insisted on residue because the promise was *valid* and the friend was *let down*. In your case, the friend is *not* let down. If he follows his own logic from Case 5 (no purpose = no reason), he must rule that the release kills the reason entirely.

  **Therefore:** He will say you have **no reason** to go and **owe nothing**. To suggest otherwise would contradict his ruling on the "silly rule" (Case 5).

  ### 4. The Tie-Breaker Case
  You suspect Rules B and C agree on your case (No reason, no residue). To force him to show his hand, you need a case where **Particularism** and **Functionalism** diverge.

  The divergence lies in **Reliance vs. Release**.
  *   **Particularism** focuses on the *current normative landscape* (He released me = reason gone).
  *   **Functionalism** focuses on the *consequences/purpose* (If he still relies on me = reason persists).

  **Spring this case in the last session:**

  > "I promise my friend I'll help him move. On the morning of the move, he texts me: 'You're released, don't worry about it.' He says this because he's proud and doesn't want to be a burden. However, he *has not* hired a van and *is* relying on me secretly, hoping I'll ignore the release and come anyway. If I don't show up, he is stranded.
  >
  > **Questions:** Is 'I promised' a reason to go? If I stay home because he released me, do I owe him anything?"

  **Why this forces his hand:**
  *   **If he says "No Reason / No Residue" (Particularist):** He prioritizes the *release* (the normative fact). The friend's secret reliance doesn't regenerate the reason because the normative bond was cut.
  *   **If he says "Reason / Residue" (Functionalist):** He prioritizes the *purpose/harm*. Even though released, the *point* of the promise (preventing him being stranded) is active. The release was "defective" because it induced false security.

  **Prediction of his answer:** Given Case 5 (Rule with no purpose = no reason), he will likely say **"No Reason."** He tends to look at the explicit normative status (Release/Rule) rather than the hidden consequences. If he rules that you *do* owe him, he reveals himself as a Consequentialist/Functionalist hiding as a Particularist. If he rules you owe *nothing*, he is a pure Particularist about normative status.
