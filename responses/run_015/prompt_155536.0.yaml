prompt: |-
  Okay so I've more or less become an updateless decision theory person and I want someone to try to take it apart, or at least tell me where the view is actually exposed. Quick statement of what I mean so we don't talk past eachother: at the moment of choice I shouldn't rank my available actions conditional on everything I now know; I should ask which output of the decision procedure I'm running would have looked best from the standpoint of my original prior, treating my own decision as one more logical/structural fact about the world to be conditioned on rather than as a free causal lever I get to wiggle. So I one-box in Newcomb's problem, and I pay up in that counterfactual-mugging case that circulates in this corner of the internet (predictor flips a coin, only asks you for money if it lands tails, and would have handed you ten times as much if you turned out to be the sort of agent that pays). I've basically stopped arguing about it with my CDT friend, which is probably a sign I've stopped being careful.

  So: what would count against it? Not "here's a case where UDT gets the wrong answer because I stipulated that it does" — I want defeaters ranked from fatal to merely awkward, and I especially want to know which ones a committed UDT person would concede as counting against them rather than dismiss as a formalization artifact. Here's my own worry-list, please add to it and sort it: (1) updatelessness might be two ideas bolted together — refusing to condition on which branch/copy/time-slice you turn out to be (the anthropic, Sleeping-Beauty-ish stuff), and refusing to treat your own deliberation as causally free (the Newcomb stuff) — and if the indexical half collapses for lack of any principled prior over "which copy is me," does the logical half survive untouched, or was the unity only ever apparent because both kinds of case happen to feature a predictor? (2) the logical-counterfactual machinery: if what does the work is the ability to say what would be true if a fact about my own output were different, and nobody has a clean account of that, is UDT a research program with a hole where the engine goes — and is the usual proof-theoretic/modal reply a solution or a promissory note, and how would we tell? (3) one I made up and can't get out of my head, call it computational updatelessness: a bounded agent deciding now can't run the deliberation its earlier, worse-informed self ran, so if UDT says to act as your prior self would have chosen, then for anyone who isn't ideal it seems to say act as your prior self would have chosen *with less computation*, i.e. act as if you were dumber than you actually are. That reads like a reductio to me, and it's the thing I'd personally find most damaging if there's no answer — so what picks out the relevant counterfactual prior self, with what information budget and what time budget?

  And then the insulation worry, which is what I actually keep circling back to. Every time UDT gets an uncomfortable verdict — the $5/$10 thing where the agent can't even get past the first option, the mugging-farm cases where anyone who can cheaply simulate you can extract money from you — the response I hear is "that's an artifact of this implementation, the ideal is fine." So: is there anything UDT predicts that its rivals don't? Some class of environments where a UDT agent does systematically better, or some pattern of outcomes such that if the world came out the other way the view would genuinely be in trouble? Or has it been qualified into something that can't lose? And if it has, is that a problem for a *normative* theory specifically, or is "the ideal is unfalsifiable and only implementations can be wrong" a perfectly respectable place to end up — same way nobody thinks expected utility theory is refuted by the Allais responses? Last thing: my friend says UDT is either evidential decision theory with extra steps or CDT plus a precommitment device in a trenchcoat. I'd like to know what would have to be true for that to be right, and whether I should be embarrassed if it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Sophisticated decision theorist, likely familiar with MIRI/LessWrong discourse (mentions "updateless decision theory," "CDT friend," "counterfactual mugging," "logical-counterfactual machinery," "proof-theoretic/modal reply"). They identify as a UDT proponent but are seeking steelmanned critiques ("take it apart," "tell me where the view is actually exposed").
      *   **Core Task:** Critique Updateless Decision Theory (UDT). Specifically, address their worry list, rank defeaters (fatal vs. awkward), address the "insulation worry" (unfalsifiability), and evaluate the friend's claim (EDT+steps or CDT+precommitment).
      *   **Tone:** Intellectual, rigorous, conversational but precise. Avoid condescension, acknowledge the depth of the user's understanding.
      *   **Constraints:** Don't just say "UDT fails in case X." Distinguish between formalization artifacts and fundamental flaws. Address the specific worries (Anthropic vs. Logical, Logical Counterfactuals, Computational Updatelessness, Insulation/Falsifiability, EDT/CDT reduction).

  2.  **Deconstruct the User's Worry List:**

      *   *(1) Anthropic vs. Logical Updatelessness:* The user worries these are distinct problems bolted together. If the indexical/anthropic prior is incoherent, does the logical part fall?
          *   *Analysis:* They are related but distinct. The "logical" part (Newcomb/Parfit's Hitchhiker) relies on acausal correlation. The "anthropic" part (Sleeping Beauty/Self-Location) relies on indexical uncertainty. UDT tries to unify them by treating "I am here" as just another logical fact.
          *   *Critique:* The "Prior Problem." UDT requires a *single* universal prior over all possible worlds and selves. If that prior is ill-defined (measure problem in cosmology, reference class problems), UDT has no input. This is a dependency, not necessarily a collapse of the logic, but it makes the theory incomplete.
      *   *(2) Logical Counterfactuals:* The engine room. If we can't define "what if $2+2=3$" or "what if my algorithm outputs B instead of A," UDT is empty.
          *   *Analysis:* This is the biggest technical hurdle. Modal logic (GL) and proof-based UDT (MIRI style) tried to solve this but ran into the "5-and-10" problem (spurious proofs). Functional Decision Theory (FDT) tried to patch it.
          *   *Critique:* It's not just a "promissory note"; it's an open research problem. If logical counterfactuals are incoherent, UDT is false. If they are coherent but uncomputable, UDT is ideal-only.
      *   *(3) Computational Updatelessness:* Bounded agents can't simulate their prior selves. Does UDT demand acting dumber?
          *   *Analysis:* This is the "Ideal vs. Implementation" gap. UDT is defined for ideal agents. For bounded agents, we need "Bounded UDT."
          *   *Critique:* The risk is *policy rigidity*. If you commit to a policy at $t_0$, but at $t_1$ you learn something crucial that your $t_0$ self couldn't anticipate, UDT might force you to stick to the $t_0$ plan even when it's disastrous. This is the "Time-Inconsistency of Updatelessness" paradox.

  3.  **Address the "Insulation Worry" (Falsifiability):**
      *   *Question:* Is UDT unfalsifiable? Does it predict anything unique?
      *   *Analysis:* UDT *does* make predictions different from CDT/EDT in specific game-theoretic scenarios (Newcomb, Parfit's Hitchhiker, Counterfactual Mugging, Twin Prisoner's Dilemma).
      *   *Critique:* The problem isn't that it can't lose; it's that proponents often retreat to "ideal agent" defenses when specific implementations fail (like the 5-and-10 problem).
      *   *Normative Status:* A normative theory *should* be somewhat insulated from empirical failure (it's about what you *should* do, not what wins in a specific physics). But if it recommends actions that lead to strictly less utility in *all* coherent worlds, it's in trouble.

  4.  **Address the Friend's Claim (EDT+steps or CDT+Precommitment):**
      *   *EDT+steps:* UDT looks like EDT because it conditions on the action. But EDT conditions on *this* action now. UDT conditions on the *policy* selected by the prior.
      *   *CDT+Precommitment:* CDT says "precommit if you can." UDT says "you *are* the precommitment."
      *   *Verdict:* It's closer to CDT+Precommitment, but the "trenchcoat" insult misses the point that UDT claims the precommitment is *logical*, not causal. If the friend means "UDT is just CDT agents who managed to sign a binding contract," that's false because UDT agents cooperate in one-shot PDs without contracts.

  5.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication. Validate the UDT position (it *is* the strongest contender for acausal problems).
      *   **Section 1: The Three Worries (Ranked & Expanded):**
          *   *Fatal:* Logical Counterfactuals (The Engine). If this doesn't exist, UDT is nonsense.
          *   *Severe:* The Prior Problem (Anthropic/Indexical). If you can't define the "original position," you can't run the calc.
          *   *Awkward/Practical:* Computational Updatelessness (Boundedness). The risk of "dogmatism."
      *   **Section 2: The Insulation Worry (Falsifiability):**
          *   Distinguish normative vs. descriptive.
          *   Identify where UDT loses: "Evil Predictors" (Adversarial predictors who punish UDT specifically). This is the "Shielding" problem.
      *   **Section 3: The Friend's Reduction (EDT/CDT):**
          *   Why it's not EDT (causal structure vs. correlation).
          *   Why it's not just CDT+Precommitment (logical vs. causal binding).
          *   The "Trenchcoat" verdict: Partially true but misses the novelty of *logical* correlation.
      *   **Conclusion:** Summary of the "Exposed Flank."

  6.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction on Computational Updatelessness:* Make sure to distinguish between "acting dumber" and "acting according to a policy that accounts for boundedness." The real issue is *reflective stability*. Does the agent want to modify itself to be CDT later? If UDT says "No," but being CDT later wins more, UDT is dynamically inconsistent.
      *   *Refining the "Evil Predictor":* This is the strongest argument against UDT. If a predictor punishes agents *because* they use UDT (not because of their output), UDT loses. UDT proponents argue this is "unfair." I need to explain why that defense is shaky.
      *   *Tone Check:* Ensure I'm not just repeating MIRI posts but offering a critical external perspective as requested.

  7.  **Drafting the Response (Mental or Scratchpad):**
      *   *Start:* "You've got the right instincts."
      *   *Worry 1 (Anthropic/Logical):* They are linked by the "Prior." The fatal flaw isn't the link, it's the definition of the Prior.
      *   *Worry 2 (Logical Counterfactuals):* This is the big one. Mention the "5-and-10" problem explicitly. It's not just a formalization artifact; it suggests the concept might be incoherent.
      *   *Worry 3 (Computational):* Reframe as "Policy Rigidity." The risk is locking in errors.
      *   *Insulation:* The "Adversarial Predictor" is the falsifier. UDT defines "fairness" to exclude these, which looks like moving the goalposts.
      *   *Friend:* It's CDT + *Logical* Precommitment. The trenchcoat is made of modal logic.

  8.  **Final Polish:** Check against the prompt's specific requests (rank defeaters, address insulation, address friend). Ensure the distinction between "ideal theory" and "implementation" is handled carefully. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Computational Updatelessness" point. The user asks: "what picks out the relevant counterfactual prior self?" This is the *indexical* problem again. I should link Worry 1 and Worry 3. The "Prior Self" is a logical construct, not a temporal one. If I can't identify with the prior self due to computational divergence, updatelessness breaks.

  Okay, let's organize the "Fatal vs. Awkward" ranking clearly.
  1. Fatal: Logical Counterfactuals incoherence.
