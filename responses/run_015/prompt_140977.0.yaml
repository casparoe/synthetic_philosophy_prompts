  7.  **Final Polish:** Ensure the distinction between *structural monotonicity* (extra piece never hurts) and *procedural monotonicity* (extra piece never hurts *given processing limits*) is clear. This is the key philosophical contribution. (Self-correction: Ensure I don't promise too much math. It's a philosophy paper using math, not a math paper.)

