answer: |-
  Here is a teaching plan designed to disrupt the Cartesian reflex and pivot your Comp Lit grad students toward a process-ontology reading of *Zhuangzi*.

  ### 1. The Dependency Chain: Analogy $\rightarrow$ Text $\rightarrow$ Concept
  **Do not start with the text.** If you put the Butterfly Dream passage in front of them first, their training will automatically categorize it as "Epistemology/Skepticism." You cannot undo that framing once it's set.

  **Do not start with the abstract concept of *Hua* (transformation).** It will sound like dogma or vague mysticism without a phenomenological anchor.

  **The Chain:**
  1.  **The Carrying Analogy (15 mins):** Establish a "process without substrate" model using non-textual material.
  2.  **The Text (30 mins):** Re-read the Butterfly Dream *through* the analogy.
  3.  **The Distinction (30 mins):** Apply your Narrative vs. Phenomenal continuity framework to explain *why* the skepticism reading fails.
  4.  **Synthesis (15 mins):** Check question and scope limitation.

  ---

  ### 2. The Carrying Example: The Candle Flame
  You need an analogy that is undeniably "real" but has no fixed physical substrate.
  **The Example:** A flame passed from one candle to another in a dark room.

  **What it needs to have:**
  *   **Continuity:** There is an unbroken causal chain from Candle A to Candle B.
  *   **Impermanence:** The molecules burning at $t_1$ are not the molecules burning at $t_2$.
  *   **Reality:** No one claims the second flame is an "illusion" or "fake." It is just as real as the first, but it is not the *same object*.

  **What it must lack:**
  *   **A "Core":** There is no "flame-stuff" that travels.
  *   **A "True" State:** One flame is not the "waking" version and the other the "dream" version. They are just phases of burning.

  **How to deploy it:**
  Ask the group: *"If I light Candle B from Candle A and blow out A, is it the same flame?"*
  *   If they say **Yes**: Ask *"Which molecules are identical?"* (They aren't).
  *   If they say **No**: Ask *"Then where did the fire come from? Did it vanish and reappear?"* (It didn't).
  *   **The Point:** Identity here is not about *substance* (wax/molecules); it is about *activity* (burning). The "self" is the burning, not the wax.

  ---

  ### 3. Misconception Map & Intervention Points
  Here is the sequence of errors your students will attempt to make, and exactly where in the arc you cut them off.

  **Misconception 1: "This is Eastern Skepticism." (The Cartesian Trap)**
  *   **When it arises:** Immediately upon mentioning the text.
  *   **The Intervention:** **Before showing the text.** Tell them: *"Descartes asks 'How do I know this is real?' to find a foundation. Zhuangzi asks 'Which one is real?' to dissolve the foundation. We are not looking for certainty today; we are looking for flow."*
  *   **Why here:** You must disarm the epistemological question before they try to answer it.

  **Misconception 2: "Therefore, Waking Life is Fake." (The Matrix Trap)**
  *   **When it arises:** During the Text reading, when they focus on "I don't know if I am Zhou dreaming of butterfly..."
  *   **The Intervention:** **During the Analogy phase.** Use the Candle. *"Is the second candle fake because it isn't the first? No. It's just a transformation of the burning."*
  *   **Why here:** This prevents them from treating the "dream" state as an ontological error. Both states are equally real transformations of *Qi* (vital energy), even if you don't teach *Qi* explicitly.

  **Misconception 3: "The Self is just a Stream of Consciousness." (The Hume/Buddhist Trap)**
  *   **When it arises:** During the Distinction phase. They will try to reduce this to "there is no self, just experiences."
  *   **The Intervention:** **When introducing Narrative vs. Phenomenal.** Clarify that Zhuangzi isn't denying the experience; he's denying the *story* that ties the experience to a fixed agent.
  *   **Why here:** This is where your specific contribution lands. It distinguishes Zhuangzi from Humean skepticism.

  ---

  ### 4. Integrating Your Distinction: Narrative vs. Phenomenal Continuity
  **Where it lands:** In the third block (after Text + Analogy).

  **The Move:**
  Explain that the students are uncomfortable because they are looking for **Narrative Continuity** (a consistent biography: "I am Zhuang Zhou, a philosopher, who had a weird dream").
  Zhuangzi is pointing to **Phenomenal Continuity** (the unbroken flow of experience: "There was dreaming, now there is waking, the transformation is the constant").

  **The Script:**
  *"Zhuangzi isn't saying 'I might be a butterfly.' He is saying 'The "I" that claims to be Zhuang Zhou is a narrative construct that breaks upon waking.' The Phenomenal continuity (the experience of flying, the experience of sitting) is real. The Narrative continuity (the claim that these experiences belong to a fixed entity named Zhou) is the illusion. Not the world—the identity."*

  This allows your Comp Lit students to use their toolkit (narratology) to solve a metaphysical problem.

  ---

  ### 5. The Check Question
  Do not ask: *"What does this mean?"* or *"Is skepticism wrong?"*
  Ask a question that makes the skepticism reading impossible to sustain.

  **The Question:**
  > **"If Zhuangzi woke up and discovered he was *still* a butterfly, would the philosophical point of the passage change?"**

  **The Desired Answer:**
  *   **Skepticism Frame:** "Yes, because then we still don't know what's real."
  *   **Transformation Frame:** "No. Because the point isn't to identify the substrate (human vs. insect), but to recognize the fluidity of the identity itself. Whether the transformation goes Human$\rightarrow$Bug or Bug$\rightarrow$Human, the *Hua* (transformation) is the only constant."

  If they answer "No," they have moved past the reality-question to the identity-question.

  ---

  ### 6. What to Openly Leave Out
  To keep this session tight, you must explicitly bracket out two things. Tell them this at the start:

  1.  **Cosmological *Qi*:** *"We are not discussing the metaphysical substance of the universe (Qi) today. We are treating this phenomenologically. We aren't asking what the world is made of, but how the self is experienced."*
  2.  **The Hui Shi Debates:** *"We are ignoring the logical paradoxes Zhuangzi debates with Hui Shi elsewhere. This isn't a logic puzzle; it's an existential report."*

  ### Summary of the Arc
  1.  **Light the Candle:** Establish process ontology (15m).
  2.  **Read the Dream:** Apply candle logic to the text (30m).
  3.  **Break the Narrative:** Introduce Narrative vs. Phenomenal continuity (30m).
  4.  **The Check:** "Does it matter if he stays a butterfly?" (15m).

  This structure forces them to use the "Transformation" lens because the "Skepticism" lens won't fit the Candle Analogy, and once the Analogy is locked in, the Text can't be read Cartesianly.
