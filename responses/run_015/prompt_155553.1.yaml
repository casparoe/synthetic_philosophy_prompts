  Dear Friend,

  Your reflection on Bernard Williams and the distinction between personal ground projects and stewardship roles offers a sophisticated refinement of the problem of integrity, and I believe it is possible to construct a coherent principle that captures nearly all of your intuitive verdicts without forcing you to abandon them, though doing so requires us to be precise about the normative source of each commitment. The principle that best unifies your cases is what I would call the Principle of Normative Congruence, which holds that integrity is preserved when an agent's deliberative process aligns with the normative structure of the specific commitment governing the action, such that instrumental calculation is virtuous when the commitment is defined by outcomes or conventions, but alienating when the commitment is defined by non-fungible attachment or fiduciary fidelity. This principle suggests that integrity is not about the absence of reasoning per se, but about whether the reasoning treats the values at stake as the kind of things that can be weighed against one another without destroying the relationship or role that gives them meaning.

  We can see this principle at work in your case of the husband saving his wife, which motivates the clause regarding constitutive attachments. Here, the commitment is a ground project defined by partiality and non-fungibility; the wife is not interchangeable with a bystander, so a deliberative process that treats her as a variable in a utility function undermines the very love that motivates the rescue. This same logic applies to your soldier and physician cases, which fall under the clause for professional or moral conscience. In these stewardship roles, the prohibition against killing civilians or administering lethal doses is not merely a rule to be balanced but a constitutive boundary of the role itself; thus, refusing because the act is unthinkable or because one finds oneself unable to do it displays integrity because it reflects an internalized fidelity to that boundary, whereas calculating casualties or balancing autonomy against harm treats the prohibition as a negotiable constraint, which corrects the action but diminishes the integrity. Conversely, your donor case motivates the clause for optimization projects. Because the commitment of the effective altruist is defined by the outcome rather than the attachment, the deliberative process of weighing data is not alienating but is actually constitutive of the virtue; here, failing to calculate would be the failure of integrity because it would ignore the normative source of the commitment.

  The more complex applications of this principle arise in your stewardship and social cases, which require us to distinguish between different types of norms. Your trustee case motivates the clause for fiduciary fidelity, where integrity requires internalizing the entrusted norms as binding without substituting either mechanical obedience or personal utility calculation. This captures the nuance that the trustee serves the norm itself, not the letter of the rule nor their own view of the good, which aligns with the soldier and physician cases but adds the requirement of understanding the purpose to avoid mechanical failure. Your aunt and sweater case fits under a clause for conventional norms, where the social agreement itself permits trade-offs between honesty and feelings for the sake of harmony; here, weighing is not corrupting because the norm authorizes the calculation. However, it is here that we encounter the greatest tension in your verdicts, specifically regarding the parent and the dying child. You feel that weighing harm against truth is corrupting in this instance, which suggests you view this commitment as an existential or intimate norm similar to the husband's ground project, where the truth or the care is non-fungible and demands a spontaneous response rather than management. My principle can save this verdict by classifying the parent-child relationship at the end of life as constitutive rather than conventional, but I must be honest that this is the point where the system is most vulnerable. The distinction between the aunt case and the parent case relies entirely on the claim that one is a trivial convention permitting trade-offs while the other is an existential truth forbidding them, and while this is philosophically defensible, it is subjective enough that a critic could argue you are inconsistent here; if the sweater lie is permissible because feelings trump truth, one might argue the dying child's comfort should also permit weighing, yet your intuition rightly senses a difference in stakes that transforms the normative structure.

  Applying this principle to your unmentioned case of the historian who discovers her ancestor committed an atrocity, the prediction is clear. If we view the historian's vocation as a ground project or a stewardship of truth similar to the physician's conscience, then publishing the evidence because she cannot do otherwise displays high integrity, as her deliberative process aligns with the non-fungible demand of the truth itself. If she were to publish only after calculating that truth serves society, she would still be doing the right thing, but like the soldier who consults legal texts, she would display judgment rather than integrity, because she would have introduced the corrupting thought of utility into a realm that demands fidelity. Thus, the principle validates her action as integrity-rich when motivated by inability to suppress the truth, aligning with the physician and soldier cases.

  In conclusion, I believe there is a coherent account that saves all your judgments, provided we accept that the normative structure of a commitment can shift from conventional to existential based on the depth of the relationship and the significance of the value at stake. However, I must concede that the distinction between your verdict on the aunt and your verdict on the parent is the weakest link in this chain, as it relies on a qualitative distinction between social conventions and intimate truths that is not always sharp in practice. If you were forced to abandon one judgment to strengthen the principle, it would likely be the parent case, bringing it in line with the aunt case to say that weighing is permissible whenever care is the goal, but doing so would lose something important about your insight into the alienating nature of calculation in moments of profound intimacy. Ultimately, the Principle of Normative Congruence suggests that integrity is not the rejection of reason, but the refusal to let reason displace the specific kind of commitment that makes the action matter in the first place.
