  I have been reflecting on Bernard Williams's concern about integrity and the danger of moral reasoning that involves one thought too many, and I am trying to determine whether my intuitive verdicts about particular cases hang together under a single principle or whether they force me to abandon some of them. To sharpen the problem I want to introduce a distinction that is not always central to the standard discussion, namely that between personal ground projects, which are the commitments that make life worth living for the agent herself, and what I shall call stewardship roles, in which an agent is entrusted with values or norms that belong not to her but to an institution, a profession, or another party. Consider a husband who pulls his wife from a burning vehicle without pausing to compare her value to that of a bystander; I think he acts with perfect integrity, and I find the idea that he should have weighed the options chilling, since that weighing would be precisely the corrupting calculation at issue. By contrast, a physician who refuses to administer a lethal dose to a suffering patient not because she has balanced autonomy against harm but because she finds herself unable to do it displays genuine integrity, whereas if she had conducted the same balancing and then refused, her action would still be right but would display judgment rather than integrity. Meanwhile, a donor who chooses a charity by comparing effectiveness data and then gives generously does not seem to me to have lost any integrity; careful reasoning here appears virtuous rather than corrupting. A soldier who disobeys an unlawful order to fire on civilians only after consulting legal texts and computing probable casualties acts correctly, yet I feel he displays less integrity than one who refuses because the act is unthinkable, though in this instance the reasoning concerns an external duty rather than a personal ground project. A parent who tells a dying child a comforting falsehood after weighing psychological harm against the value of truth strikes me as having introduced the corrupting thought, even if the lie succeeds. Yet when I tell my aunt that I love an ugly sweater, knowing that I have weighed her feelings against honesty, I do not feel I have betrayed anything, so the mere presence of weighing cannot be the problem. In a stewardship role, a trustee who applies estate rules mechanically without grasping their purpose fails in one direction, while one who deviates because she has calculated that a different distribution would increase beneficiary happiness fails in another; I think integrity here requires internalizing the entrusted norms as binding without substituting either mechanical obedience or personal utility calculation. So is there a coherent principle that captures all of these verdicts, or must I abandon at least one? If there is an account, please state it precisely, show which case motivates each clause, predict what it says about a situation I have not mentioned, such as a historian who discovers her own ancestor committed an atrocity and publishes the evidence not because she calculated that truth serves society but because she cannot do otherwise, and be honest about which of my judgments your principle cannot save. Please write your response entirely in continuous prose, with no headings, bullet points, bold text, tables, or other formatting devices, as one would write in a letter or email.
