  | **Grading** | Probabilistic fink manifests inconsistently. | Non-negotiable (Science) | Binary disposition accounts | Requires probabilistic/degree structure. |
  | **Causal Grounding** | Mimicking device shatters without fragility. | Non-negotiable (Explanation) | Purely behavioural/extensional accounts | Manifestation must link to specific basis. |
  | **Stimulus Flexibility** | Unstimulated shatterer breaks spontaneously. | Negotiable (Physics vs. Engineering) | Strict stimulus-response models | Spontaneity allowed (e.g., decay). |
  | **Relationality** | Solubility depends on external solvent. | Camp Prejudice (Lewisians/Intrinsicists) | Strictly intrinsic property accounts | Special sciences require extrinsic relations. |
  | **Analytic Non-Circularity** | General desire for reduction. | Negotiable (Methodological) | Primitivist powers views | Hard to maintain with fink/mask handling. |

  | Requirement A | Requirement B | Why they can't both hold | Which one I should give up |
  | :--- | :--- | :--- | :--- |
  | **Analytic Non-Circularity** | **Robust Fink/Mask Handling** | 'Normal conditions' clauses needed to save conditionals smuggle in dispositionality. | Give up Non-Circularity. |
  | **Intrinsicness** | **Relationality (Solubility)** | Solubility is defined by solute-solvent interaction, not solute alone. | Give up Intrinsicness. |

  The conditional analysis fails Causal Grounding (mimics pass) and Grading (unless probabilistic). It saves phenomena only via 'normality' clauses that violate Analytic Non-Circularity, rendering it a useful heuristic but a failed ontology. It is too brittle for the special sciences where interferers are the norm, not the exception.

  The Causal Basis view secures Causal Grounding and handles Mimics well. It struggles with Relationality (bases are often modelled as intrinsic) and Finks (basis remains while disposition is masked). It is the strongest candidate for chemistry, provided you allow the basis to be a complex relational state rather than a simple intrinsic property.

  The Powers View secures Grading and Relationality easily. It violates Analytic Non-Circularity by fiat. It is too metaphysical for special sciences wanting categorical bases, but it is the only view that doesn't crumble under the weight of finks and masks. It earns its keep in metaphysics, not engineering.

