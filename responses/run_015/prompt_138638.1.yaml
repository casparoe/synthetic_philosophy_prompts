  **MEMORANDUM FOR ALL FIELD INVESTIGATORS**
  **FROM:** Office of Nonhuman Historical Attribution (ONHA)
  **SUBJECT:** Revised Protocols for Agency Assignment (v.4.2)
  **DATE:** Current Fiscal Period

  **1.0 RETROSPECTIVE BASELINE SELECTION**
  Investigators frequently struggle to establish the counterfactual baseline required to credit a nonhuman actor with a historical outcome. To credit a pathogen with the fall of a regime, one must prove the regime would have survived absent the pathogen. Since alternative timelines are unavailable for peer review, ONHA hereby institutes the *Outcome-Confirmed Baseline Rule*. 

  Investigators shall select the baseline that best aligns with the known historical record. If a empire collapsed during a plague outbreak, the baseline shall assume the empire was structurally sound prior to infection. If the empire collapsed without a plague, the baseline shall assume the empire was resilient enough to withstand standard microbial pressure. This ensures that the nonhuman actor is always sufficient to explain the variance. Do not waste resources simulating scenarios where the bacteria stayed home.

  **2.0 VECTOR INVERSION AND HUMAN RECLASSIFICATION**
  Once a microbe, climate pattern, or geological formation is granted primary agency, human participants must be reclassified as transmission infrastructure. A general moving troops is no longer a strategist; he is a conveyance system for bacteria. A port official denying entry to grain is not a policymaker; he is a membrane regulating flow.

  Field agents must submit Form 12-V (Vector Reclassification) for any human figure previously credited with decision-making. 
  *Example:* In conflicts where dysentery exceeded combat casualties, the commanding officer shall be listed as "Hostile Terrain Facilitator." 
  *Example:* In famines where export continued despite crop failure, the governing legislature shall be listed as "Logistical Background Noise." 
  Humans are meat bridges. Treat them as such.

  **3.0 THE LATITUDINAL PRESUMPTION**
  To streamline attribution, ONHA codifies the standing Geographic Determinism Index. 
  *Temperate/Industrialized Zones:* Favorable outcomes (economic growth, stability) are presumptively assigned to human institutions and culture. Unfavorable outcomes require proof of nonhuman interference.
  *Equatorial/Developing Zones:* Unfavorable outcomes (famine, conflict, collapse) are presumptively assigned to climate, soil exhaustion, or disease vectors. Favorable outcomes require proof of human intervention.

  This asymmetry ensures narrative consistency. A drought in a wealthy nation is a challenge overcome by engineering. A drought in a poor nation is the cause of the economy's failure. Investigators need not justify this distinction; it is baked into the coordinate system.

  **4.0 COMMENDATIONS AND MITIGATING GEOLOGY**
  Nonhuman actors are eligible for both blame and praise. While volcanoes are often cited for destruction, investigators must also weigh long-term soil enrichment. A eruption that destroys a harvest but fertilizes the next century shall receive a Commendation for Patience. 

  Medals may be awarded posthumously to favorable winds, currents, and microbial flora. Note: Investigators may experience discomfort commending a pathogen that culled a population but inadvertently stabilized a resource curve. This discomfort is subjective and irrelevant to the attribution matrix. Submit the medal recommendation anyway. History is long; the dead are not.

  ***

  **APPENDIX A: WORKED EXAMPLE OF DETERMINATION**

  **Case:** The Great Hunger (Mid-Nineteenth Century)
  **Location:** North Atlantic Archipelago
  **Primary Actor:** *Phytophthora infestans* (Potato Blight)
  **Secondary Actor:** Gulf Stream Variance

  **Determination:**
  Previous historiography assigned significant agency to imperial trade policy and land tenure systems. Under ONHA Protocol v.4.2, these human factors are reclassified as Vector Infrastructure. The British Administration is hereby designated a "Passive Conduit" that facilitated the movement of calories away from the blight zone. This movement was inevitable given the economic gravity well, which is a function of geography, not policy.

  The Blight is assigned 95% causal responsibility for mortality. The remaining 5% is assigned to the soil composition, which lacked volcanic ash deposits necessary for resistance. 

  **Latitudinal Application:**
  Because the region is temperate but economically peripheral during the period, the Outcome-Confirmed Baseline assumes the crop system was viable prior to fungal arrival. However, because the outcome was negative, the Latitudinal Presumption defaults to environmental constraint. The administration is exonerated as a mere weather vane for market forces.

  **Commendation:**
  The Blight is nominated for the Order of the Invisible Hand for accelerating the transition to industrial labor markets. The volcanic ash missing from the soil is noted for future credit in subsequent centuries.

  **Conclusion:**
  No human signature is required on this determination. Accountability is now fully resolved by the biosphere.

  **APPROVED BY:** 
  *The Directorate of Inanimate Cause*
  *Office of Nonhuman Historical Attribution*
