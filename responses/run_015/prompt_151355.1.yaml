      *   *Is (3) vs (4) the only genuine tension?* (2) vs (3) is also slightly genuine. If justice is a family resemblance, "orienting toward justice" is like orienting toward "games." Which game? But this is subsumed by the (3)/(4) problem. If we solve how we judge slavery (4) given (3), we solve how we orient (2).
      *   *Decision:* Focus heavily on the (3)/(4) clash as the primary structural weakness.

  8.  **Drafting the Response:**
