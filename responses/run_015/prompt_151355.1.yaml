      *   **4 & 5:** *Apparent.* Evaluating progress vs. denying narrative causality.
      *   **4 & 6:** *Apparent.* Progress claims vs. narrative efficacy.
      *   **5 & 6:** *Apparent.* Denying *determinism* vs. affirming *efficacy*. Crucial distinction.

  4.  **Deep Dive into the Genuine Tensions:**

      *   **Tension A: (2) Practical Eschatology vs. (3) Family-Resemblance Justice.**
          *   *Problem:* A "horizon" usually implies a singular direction or endpoint. Family-resemblance implies a web without a center. Orienting toward a web is harder than orienting toward a point.
          *   *Severity:* Low/Medium. It's a metaphorical friction.
          *   *Fix:* The horizon isn't a *state of affairs* but a *mode of engagement* (expanding the web).

      *   **Tension B: (3) Family-Resemblance vs. (4) Global Moral Achievement.**
          *   *Problem:* This is the "Universalism vs. Relativism" trap. If justice is only local overlapping practices, on what basis do you condemn chattel slavery *globally*? If you say it's objectively wrong, you seem to posit an essence (dignity?) that contradicts (3).
          *   *Severity:* High. This threatens the core mission of a "historical justice" center.
          *   *Fix:* Move from "no essential feature" to "no *single* necessary feature, but sufficient convergence on specific harms." Or, argue that the *convergence itself* constitutes the achievement, not the realization of a pre-existing essence.
          *   *Cheapest Revision:* Qualify (3). Admit that while "Justice" has no essence, "Cruelty" or "Domination" might have recognizable features that allow for negative universalism (we agree on what's bad, even if we disagree on what's good).

