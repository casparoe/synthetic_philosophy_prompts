      *   (5) & (6) seem compatible. One denies magic in stories (determinism), the other affirms agency via stories (efficacy).
      *   (1) & (4) might clash if "genuine achievement" implies a universal standard that contradicts "no teleology." But "no teleology" means no *guaranteed direction*, not necessarily no *standard of evaluation*.
      *   (2) & (3) might clash. If justice has no essence, what is the "horizon" we are orienting toward? A fuzzy horizon?
      *   (5) & (2) might clash. If we construct narratives to orient action (2), does that slide into determinism (5)? Probably not, if agency is preserved.

  3.  **Pairwise Audit (Mental Draft):**

