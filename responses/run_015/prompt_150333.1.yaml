          *   **Tone:** Professional, respectful of expertise, direct, avoiding unnecessary fluff. "Write me the spec."

  2.  **Deconstruct the Judy Benjamin Problem (JBP):**
      *   *Setup:* Partition $\{B, R\}$ (Blue, Red). Sub-partition $\{H, 2\}$ (HQ, 2nd Co).
      *   *Prior:* $P_0$.
      *   *Input:* $P_{new}(H | B) = 3/4$. (Conditional probability constraint).
      *   *Problem:* How to determine $P_{new}(B)$, $P_{new}(R)$, $P_{new}(H|R)$, etc.?
      *   *Core Tension:* The input constrains the *ratio* of probabilities within $B$, but says nothing explicit about the probability *of* $B$ itself. However, changing the ratio within $B$ often intuitively shifts the probability of $B$ relative to $R$ (van Fraassen's insight).

