answer: |-
  **Exam Question**

  Consider a scenario involving what we shall call "divergent sub-plan opacity." Two urban planners enter a joint commitment to design a "resilient neighborhood." Planner A operates with an implicit definition of resilience that is strictly ecological, while Planner B operates with an incompatible implicit definition that is strictly economic. They delegate all technical specifications to a shared contracting team, ensuring that neither planner ever becomes aware of the divergence. Using the frameworks of Bratman, Gilbert, and Searle, determine whether this scenario still counts as joint action. You must identify the precise conceptual point at which hidden divergence either undermines or fails to undermine the conditions for jointness. Do not merely summarize the theories; apply them to reach a reasoned judgment. Do not use bibliographic citations or page references.

  ***

  **Model Answer**

  The scenario of divergent sub-plan opacity presents a limit case for collective intentionality. While the planners share a label ("resilient neighborhood"), the hidden incompatibility in their definitions suggests that joint action is structurally compromised, though the degree of failure varies across frameworks. The precise conceptual breaking point lies not in the initial agreement, but in the inability to coordinate sub-plans toward a shared condition of satisfaction. To determine if joint action survives, we must test whether formal agreement outweighs substantive incompatibility.

  Under Bratman's framework, joint action requires mutual responsiveness and meshing sub-plans. Here, the planners intend to cooperate, but their sub-plans (ecological vs. economic resilience) do not mesh; they are incompatible means to the end. Bratman emphasizes that agents must intend to act in ways responsive to the other's intentions. Because the divergence is opaque, they cannot adjust their actions to accommodate the other's actual plan. They are responsive to a phantom partner. Thus, joint action fails. The lack of awareness does not save the coordination; it merely hides the conflict until implementation. One might argue that since they intend to mesh, the condition is met. However, Bratman requires actual compatibility in the world, not just subjective belief. The conceptual point of failure is the absence of actual meshing, not just the belief in meshing. Without knowing the partner's plan, one cannot ensure interlocking parts.

  Gilbert's account of joint commitment and plural subjecthood offers a more nuanced view. A joint commitment creates a plural subject bound by the terms of the commitment. Here, the planners jointly commit to the phrase "resilient neighborhood." Gilbert might argue the joint commitment exists because they publicly expressed willingness to be bound together. The obligation arises from the mutual expression of readiness. However, the content of the commitment is ambiguous. If the commitment is to the concept they individually hold, there is no single object of commitment. If it is to the label, the plural subject is formed but is inherently unstable. The divergence undermines the unity of the plural subject because they are not truly doing the same thing together. When the contracting team delivers a plan, one planner will feel the commitment is violated while the other feels it is fulfilled. The conceptual breaking point is the ambiguity of the commitment's content: without shared understanding of what is being committed to, the plural subject is fractured despite the formal agreement. The obligation cannot hold if the parties disagree on what was obligated.

  Searle distinguishes we-intentions from I-intentions that merely contain representations of others. A we-intention requires shared conditions of satisfaction. In this scenario, Planner A's condition of satisfaction is an ecologically resilient neighborhood; Planner B's is an economically resilient one. These are different states of affairs. Therefore, they do not share the same we-intention. They have correlated I-intentions that reference a group, but the collective goal is illusory. The opacity prevents them from correcting this mismatch. Searle insists that the we-intention is primitive; it cannot be reduced to mutual beliefs. Here, the primitive intentional content differs. The conceptual failure occurs at the level of intentional content: without identical conditions of satisfaction, the "we" is merely aggregative. They are not acting as a unit because the unit's goal is undefined.

  Ultimately, joint action does not survive this opacity. While Gilbert might allow a formal commitment exists, Bratman and Searle demonstrate that the functional and intentional requirements are unmet. The precise point of undermining is the divergence in sub-plan content and conditions of satisfaction. Joint action requires more than shared labels; it requires shared operational realities. Hidden divergence creates a coordination illusion where agents believe they are cooperating while actually pursuing incompatible ends. The delegation to the contracting team exacerbates this by removing the feedback loop necessary for correction. Therefore, this is not genuine joint action, but parallel action masked by shared terminology. The failure is not in the will to cooperate, but in the structural impossibility of satisfying both intentions simultaneously under the same description. The case shows that transparency of sub-plans is not merely epistemic window dressing; it is constitutive of the jointness itself. Without it, the collective intention collapses into coinciding individual intentions.

  ***

  **Marking Scheme (20 Marks)**

  **1. Identification of Core Tension (4 marks)**
  *Judgment:* Must identify that the conflict lies between shared labels vs. incompatible operational definitions.
  *Error:* Candidates often treat the scenario as a simple misunderstanding rather than an ontological problem.

  **2. Bratman Application (4 marks)**
  *Judgment:* Must argue that mutual responsiveness fails because sub-plans do not actually mesh, regardless of belief.
  *Error:* Candidates claim joint action holds because the agents *believe* they are cooperating.

  **3. Gilbert Application (4 marks)**
  *Judgment:* Must note that while joint commitment may form formally, the ambiguous content fractures the plural subject's unity.
  *Error:* Candidates assert the commitment is valid solely based on public expression, ignoring content ambiguity.

  **4. Searle Application (4 marks)**
  *Judgment:* Must conclude we-intentions fail because conditions of satisfaction differ, reducing the case to correlated I-intentions.
  *Error:* Candidates confuse referencing a group with having a genuine we-intention.

  **5. Synthetic Verdict (4 marks)**
  *Judgment:* Must locate the precise breaking point (sub-plan/condition divergence) and declare joint action fails.
  *Error:* Candidates hesitate to give a verdict or claim all theorists agree perfectly.

  **Differentiation:** Excellent answers (16–20) synthesize moves 2–5 to show *why* opacity is constitutive, not accidental. Competent answers (10–13) summarize frameworks descriptively without applying them to the opacity constraint to reach a unified verdict.
