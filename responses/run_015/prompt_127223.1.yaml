  2.  **Deconstruct "Death in Damascus":**
      *   *The Story:* A man meets Death in Damascus. Death looks surprised. The man flees to Aleppo. Death finds him there later, saying, "I was surprised to see you in Damascus because I have an appointment with you tonight in Aleppo."
      *   *The Logic:* If the predictor is perfect, your decision to go to Aleppo is evidence that you were meant to go to Aleppo. Causal Decision Theory (CDT) says "Go to Aleppo to avoid Death," but Evidential Decision Theory (EDT) says "Going to Aleppo confirms Death is there."
      *   *The Twist Request:* The prompt asks for an *indexical* twist: "points at wherever you're actively trying to avoid." This is slightly different from the classic story (where the appointment is fixed, but the location is the surprise). The prompt wants a mechanic where *trying to avoid X makes X inevitable*. This is closer to a "Self-Defeating Prophecy" or a logical loop where the avoidance strategy *is* the causal path to the outcome.
      *   *Mechanical Translation:* If a player declares "I am NOT going to Damascus," the game rules must make "Damascus" the only valid move left.

