answer: |-
  # Workshop Activity: The Caravan of Closures
  **Topic:** Newcomb-like Problems / Death in Damascus / Evidential Decision Theory
  **Time:** 75 Minutes
  **Participants:** 12 (6 Travelers, 6 Oracles)
  **Materials:** 3 Signs (Damascus, Aleppo, Babylon), 12 Envelopes, Point Tally Board, Candy/Tokens (optional).

  ---

  ## 1. Setup & Roles (0:00–0:10)
  **Do not explain the paradox.** Do not use the word "fatalism." Frame this as a resource management game.

  **The Room:**
  Place three chairs or signs in a triangle: **Damascus**, **Aleppo**, **Babylon**.

  **The Travelers (6 Players):**
  *   **Goal:** End the game in a city that is *not* your "Doom City."
  *   **Payoff:** 10 points if you survive (not in Doom City), 0 points if you die (in Doom City).
  *   **Private Info:** Each receives an envelope. Inside is a card that says: *"Your Doom City is the one you actively attempt to avoid."*
      *   *Note:* They do **not** show this to anyone. They think their Doom City is fixed, but the text makes it indexical.
  *   **Action:** They must physically move to one of the three cities by minute 30 and minute 60.

  **The Oracles (6 Players):**
  *   **Goal:** Ensure the Prophecy holds true. (In practice, this means enforcing the rule).
  *   **Private Info:** Each receives a "Rule Card."
      *   *Rule:* "If a Traveler verbally states an intention to avoid a specific city, or argues for a choice based on fear of a specific city, you must close the other two paths. The Traveler is mechanically forced into the city they tried to avoid."
  *   **Tools:** Oracles hold red "Road Closed" signs. They stand between the cities.

  **The Hook:**
  Tell the group: "This is a simulation of high-stakes negotiation under uncertainty. Travelers, maximize your survival points. Oracles, maintain the integrity of the simulation rules. Begin."

  ---

  ## 2. Round 1: The Naive Strategy (0:10–0:30)
  **Activity:** Travelers discuss strategy in a huddle. Oracles listen silently.
  **Expected Behavior:** Travelers will assume their Doom City is fixed (e.g., "I think mine is Damascus"). They will argue: "We should all go to Aleppo to avoid Damascus."
  **The Mechanic:**
  1.  As soon as a Traveler says, "I'm going to Aleppo *to avoid* Damascus," the Oracles intervene.
  2.  Oracles place "Road Closed" signs on Aleppo and Babylon.
  3.  The Traveler is physically guided to Damascus.
  4.  **Score:** Travelers get 0 points. Oracles mark a success.
  5.  **Confusion:** Most will claim the rules were broken or the Oracles cheated. Let them argue for 5 minutes. Do not clarify the rule yet.

  ---

  ## 3. The Revelation (0:30–0:40)
  Gather the group. Reveal the Oracle Rule Cards publicly.
  Read the Traveler Card text aloud: *"Your Doom City is the one you actively attempt to avoid."*

  **The Twist:** Explain that the prophecy is **indexical**. It does not point to a location on a map; it points to a *mental state*.
  *   Avoidance = Attraction.
  *   Indifference = Safety.

  **New Instruction:** "You have 20 minutes for Round 2. The rules haven't changed. The payoff is still 10 points for survival. Go."

  ---

  ## 4. Round 2: The Meta-Game (0:40–1:00)
  **Expected Behavior:**
  *   **Phase A (Denial):** Some will try to lie. "I *love* Damascus." Oracles must judge sincerity. If the underlying motivation is avoidance, the rule triggers.
  *   **Phase B (Randomization):** Smart players will realize they cannot *choose* based on avoidance. They might try to close their eyes and point.
  *   **Phase C (Resignation):** Some will walk into Damascus accepting death, hoping the lack of "avoidance" saves them.
  *   **Phase D (Chaos):** Arguments about whether saying "I want to go to Aleppo" counts as avoiding Damascus.

  **Facilitator Role:**
  *   Act as the "Supreme Oracle." Adjudicate borderline cases.
  *   If a player says, "I'm rolling a die," allow it. (This is the only way to break the loop).
  *   If a player says, "I'm going to Aleppo because the snacks are there," allow it (if sincere).
  *   **Payoff:** Award points only to those who arrived without an *avoidance-based justification*.

  ---

  ## 5. Debrief & Logical Mapping (1:00–1:15)
  **Step 1: Name the Beast.**
  Reveal the topic: **Death in Damascus** (Gibbard & Harper, 1978) and its relation to **Newcomb's Problem**.

  **Step 2: Map the Mechanics to the Logic.**
  Draw this on the board:

  | Game Mechanic | Logical Structure |
  | :--- | :--- |
  | **Oracle closes roads when you avoid** | **Predictor Reliability.** In the paradox, Death is already there. Your choice doesn't *cause* Death to move; it *reveals* where Death is. The game makes this causal for feel; the logic makes it evidential. |
  | **Indexical Doom Card** | **The Common Cause.** Your fear of Damascus and Death's presence in Damascus share a common cause (the prediction). |
  | **Trying to win leads to 0 points** | **Causal Decision Theory (CDT) Failure.** CDT says "Choose the act that causes the best outcome." Here, the act of choosing *to avoid* causes the bad outcome. |
  | **Rolling a die / Indifference** | **The Solution.** To beat a perfect predictor, you must remove your choice from the evidential chain. Randomization breaks the correlation. |

  **Step 3: Address the Limitations (Crucial).**
  Be honest about what the game faked:
  *   **Causality vs. Correlation:** In the game, the Oracles *forced* you to Damascus (Causal). In the actual paradox, Death was *already* in Damascus, and your choice was merely evidence of that (Evidential).
  *   **Modal Stability:** The game couldn't simulate counterfactuals ("If I had chosen Aleppo, Death would have been there"). You had to experience the actual outcome.
  *   **The "Tickle" Defense:** In philosophy, some argue you can search for internal "ticks" (urges) to decide. The game made this impossible by making the *urge to avoid* the trigger.

  **Step 4: Closing Question.**
  "If rationality means maximizing expected utility, but rational calculation triggers the loss condition... is it rational to be irrational? Or is it rational to randomize?"

  ---

  ## Predictable Failures (Facilitator Notes)

  **1. "The Rules are Rigged!"**
  *   **What happens:** In Round 1, Travelers will feel cheated. "I didn't know saying 'avoid' would close the road!"
  *   **Fix:** Acknowledge it. "In the paradox, the universe is rigged. The predictor is perfect. You are playing against a structure where your reasoning is part of the data set."

  **2. Spotting the Trick Too Early**
  *   **What happens:** A logic student reads the card in minute 5 and yells, "Just don't avoid anything!"
  *   **Fix:** Enforce the "Sincerity Check." If they say "I choose Damascus because I'm not avoiding it," ask *why*. If the answer is "To win points," that is still instrumental avoidance. They must genuinely not care or randomize.

  **3. Oracle Overreach**
  *   **What happens:** Oracles get power-trippy and block moves arbitrarily.
  *   **Fix:** Remind Oracles their rule is specific: *Verbalized avoidance or strategic argumentation based on fear.* If a Traveler walks silently, let them walk.

  **4. The "Suicide" Strategy**
  *   **What happens:** Players think "If I walk into Death, I win."
  *   **Fix:** Clarify the win condition. You win if you are *not* in the Doom City. If your Doom City is defined by avoidance, and you don't avoid, your Doom City is undefined (or null). If you walk into Damascus *accepting* death, you haven't avoided it, so it's not your Doom City. You survive. (This usually breaks their brains, which is good).

  ---

  ## Why This Works for Grads
  *   **Embodied Cognition:** They don't just hear about the loop; they feel the frustration of their reasoning being used against them.
  *   **Indexicality:** It forces them to confront that the threat isn't "out there," it's defined by their own stance toward it.
  *   **Time-Efficient:** The mechanics are simple enough to learn in 5 minutes, leaving 20 minutes for the philosophical autopsy.
  *   **Honesty:** The debrief admits the game is a *causal* model of an *evidential* problem, preventing confusion about the actual metaphysics later.
