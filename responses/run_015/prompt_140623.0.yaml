answer: |-
  This is a sharp methodological observation, and you are correct to sense that standard "overdetermination" is not the precise tool for the job. Overdetermination assumes a fixed event $E$ such that Cause $A$ is sufficient for $E$ and Cause $B$ is sufficient for $E$. Your insight is that the referee and you are not agreeing on $E$.

  Here is the carving you are looking for.

  ### 1. Does it have a name?
  In the philosophy of causation, this is the problem of **Event Fragility** (most famously articulated by David Lewis) coupled with **Causal Proportionality** (Stephen Yablo).

  *   **Event Fragility:** An event is "fragile" if small changes in its time, manner, or constitution make it a *different* event. An event is "robust" if it survives significant variation. If you define the strike's end robustly ("defeat"), it has many sufficient causes (overdetermined). If you define it fragily ("defeat via vote on day 11"), it has few.
  *   **Causal Proportionality:** A cause should be "proportional" to its effect. A cause is too *coarse* if it brings about the effect in too many ways (the exhausted funds would have caused defeat eventually, but not *then*). A cause is too *fine* if it is specific to details that don't matter.

  In historiography, this is rarely named explicitly because it is usually buried in debates over **narrative vs. analytic history** or **micro vs. macro history**. However, the specific move you are identifying—the shifting of the *explanandum* to alter causal sufficiency—does not have a canonical label.

  If you need a term for your methodological appendix, I suggest **Explanandum Granularity** or **Outcome Individuation**. The phenomenon is the **Sensitivity of Causal Sufficiency to Event Individuation**.

  ### 2. The Vertical/Horizontal Distinction
  Your intuition here is sound, but it can be sharpened using the philosophical distinction between *intensional* and *extensional* properties of events.

  *   **Vertical Sliding (Intensional Refinement):** This is adding or subtracting *properties* to the event description.
      *   *Thin:* "The strike ended."
      *   *Thick:* "The strike ended on Day 11 via a rank-and-file vote."
      *   *The Move:* This changes the *identity conditions* of the event. In philosophy (specifically Jaegwon Kim's theory of events), an event is an object exemplifying a property at a time. Change the property, you change the event. This is where overdetermination is created or destroyed.
  *   **Horizontal Sliding (Extensional Boundary Setting):** This is changing the *mereological boundaries* (parts, space, participants).
      *   *Example:* Did the "strike" include the sympathy actions in the next town? Did it include the pre-strike slowdowns?
      *   *The Move:* This changes the *extent* of the event, but not necessarily its essential nature.

  **Verdict:** Your vertical/horizontal axis is the right cut. The "overdetermination escape" happens almost exclusively via **Vertical Sliding**. The referee is arguing for a robust (thin) event; you are arguing for a fragile (thick) event.

  ### 3. Boundary Cases: Legitimate Sharpening vs. Insulation
  You asked when a re-description is legitimate and when it is a way of insulating a favored cause from counterfactuals. This is the crux of the methodological defense.

  A thick description is **legitimate** if the added details have **downstream historical consequences**.
  A thick description is **insulatory (cheating)** if the added details are causally inert *except* to make your specific cause look necessary.

  **The Test:** Ask, "If the strike had ended differently (e.g., on Day 15, or via a leadership decree), would the *subsequent history* have been different?"
  *   **If Yes:** The specific manner/timing is historically salient. The thick description captures the *real* historical event that requires explanation. Your causal claim is vindicated.
  *   **If No:** The specific manner/timing is incidental. The thin description is the historically relevant event. The referee is right; the specific funding decision is a detail, not a cause of the general outcome.

  In your case: Did the fact that it ended on Day 11 via a rank-and-file vote (rather than Day 14 via leadership surrender) alter the trajectory of the labor movement, the election outcomes, or the federation's future policy? If your monograph argues that the *mode* of collapse shaped the interwar labor landscape, then the thick description is the correct one.

  ### 4. Vindication or Destruction of the Referee's Objection?
  The referee's objection ("your case is overdetermined") relies on the assumption that **causal claims about large events should be made at the level of robust outcomes.**

  This assumption is false. It destroys the referee's objection *if* you can justify the granularity of your explanandum.

  *   **The Referee's Error:** They are treating "the strike" as a *type* (a class of events ending in defeat). For types, overdetermination is common.
  *   **Your Defense:** You are treating "the strike" as a *token* (a specific occurrence with specific properties). For tokens, overdetermination is rare.

  History is fundamentally about tokens, not types. We do not write books to explain why "strikes fail" (sociology); we write to explain why *this* strike failed *in this way* (history).

  **However,** you must avoid the trap of making the event *too* fragile. If you define the event as "the strike ending at 4:02 PM on Day 11," *every* cause becomes necessary (the bus being late might have changed the vote time). This is Lewis's "Fragility Trap."

  **The Solution:**
  Do not argue that the referee is wrong about the *logic* of overdetermination. Argue that they are wrong about the **Historical Explanandum**.
  1.  Concede that "Strike Defeat" is overdetermined.
  2.  Assert that "Strike Defeat" is not the historically significant event.
  3.  Demonstrate that "Strike Defeat via Rank-and-File Revolt on Day 11" had unique downstream effects (e.g., radicalized the base, weakened the federation's authority for the next decade).
  4.  Therefore, the *historical* question requires the thick description.
  5.  Under the thick description, the funding refusal is not overdetermined; it is the specific trigger for the *specific* mode of collapse.

  ### Summary for your Revision
  You are not tripping over overdetermination; you are navigating **Event Individuation**.
  *   **Name:** Outcome Individuation / Explanandum Granularity.
  *   **Axis:** Vertical (Intensional/Property) sliding is the mechanism; Horizontal (Extensional/Boundary) is secondary.
  *   **Boundary:** Legitimacy is determined by **Downstream Salience**. Does the specific detail change what happens next?
  *   **Referee:** The objection fails if you shift the claim from "Why the strike failed" to "Why the strike failed *in this specific manner*." The thin description makes your cause incidental; the thick description makes it essential. Choose the grain that matches the historical consequences you are tracing.

  If your monograph is about the *consequences* of these strikes, the thick description is mandatory. If it is about the *preconditions* for strike failure generally, the referee is right. Given you are writing a monograph on specific strikes, you are likely in the business of tokens, not types. Stand on the fragility of the event.
