      *   **Constraint 2 (Fixed Points):** General Scholium (reasoning from appearances), Letter to Bentley (Principia for belief in Deity), Opticks Queries (blind fate, orbital irregularities, need for reformation), Anti-Trinitarianism/Immortality of Soul rejection, Prophetic views (Papacy = Antichrist, prophecy understood post-fulfilment), Chronology (shortened ancient history).
