      *   **Output Format:** Structured session plan. For each item: Prediction paragraph, Textual/Doctrinal Hook, Strongest Opposed Prediction, One-line Confidence Note. Plus: Ranking of determinacy, Markers of "Theology in a Wig," and "Settling Evidence" for the two least determinate items.

