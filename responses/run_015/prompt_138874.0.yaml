          *   *Confidence:* Medium-High. His argument is about the *source* of order, not just probability.

      *   **Item 3: Old Earth/Common Descent/Theistic Evolution (Nicene).**
          *   *Newton:* *Chronology* shortens history. Earth is young (biblically).
          *   *Evolution:* Naturalistic origin of life.
          *   *Church:* Nicene (Trinitarian).
          *   *Prediction:* He would reject the Nicene churches first (Apostasy). He would reject common descent if it removes the need for God's direct intervention in framing the system (Opticks). He wants God *in* the machinery, not just at the start.
          *   *Hook:* *Chronology* + Anti-Trinitarianism.
          *   *Opposition:* He accepts "active principles" placed by God. Could evolution be such a principle? Unlikely given his need for "reformation."
