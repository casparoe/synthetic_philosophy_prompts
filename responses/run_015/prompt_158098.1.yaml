answer: |-
  Your framing is correct. The "Registry vs. Tool" split is the right operational cut. It maps to *delegation of authority*, not metaphysics. You are drawing a line between a *delegate* (Agent) and an *implement* (Tool). A delegate binds the principal; an implement is wielded by the principal.

  Here are the desiderata for the criterion, the triage of your cases, and the answers to your five constraints.

  ### The Desiderata
  *What the criterion must deliver to work for two independent reviewers.*

  **1. The Initiation Condition (Who wakes it up?)**
  *   **Requirement:** The criterion must distinguish between systems that wait for a specific human trigger per task versus systems that wake themselves up based on state changes or schedules.
  *   **Case Behind It:** *The Calendar Assistant.* To you, it's a tool (you asked it to manage your time). To the person receiving the meeting invite, it initiated contact. If the system can generate an external-facing action (email, API call, message) without a human pressing "send" *for that specific action*, it is an Agent.
  *   **Why:** This solves the "relative status" problem. It doesn't matter how the user feels; it matters where the system crosses the organizational trust boundary.

  **2. The Discretion Condition (What can it choose?)**
  *   **Requirement:** The criterion must distinguish between optimizing *means* to a fixed *end* versus selecting or modifying the *end* itself within a scope.
  *   **Case Behind It:** *The Trading System.* A tool is told "Maximize profit on this trade." An agent is told "Maximize profit this quarter" and decides "I will lose money now to kill competition." If the system can adopt a sub-goal that contradicts immediate human intuition or wasn't explicitly parameterized, it is exercising agency.
  *   **Why:** This captures the risk of specification gaming. Tools fail; Agents drift.

  **3. The Veto Point (Where is the human?)**
  *   **Requirement:** The criterion must identify if there is a mandatory, synchronous human approval step before an irreversible external effect occurs.
  *   **Case Behind It:** *The Handoff Test.* If you say "I'll do it myself," do you have to *think* (make decisions) or just *type* (execute)? If the system makes the decisions and you just sign off, it's an Agent. If you make the decisions and it just types, it's a Tool.
  *   **Why:** This is the operational gate. "Human-in-the-loop" is vague; "Mandatory Veto Point" is auditable.

  **4. The Persistence Condition (How long does it live?)**
  *   **Requirement:** The criterion must distinguish between ephemeral processes (die when the task is done) and persistent daemons (maintain state across sessions without re-authentication).
  *   **Case Behind It:** *Nesting.* A tool built out of agents is still a tool if the top-level wrapper requires a human trigger and collapses the internal agency into a single deterministic output. An agent built out of tools is an agent if it persists and re-invokes those tools without new human input.
  *   **Why:** This prevents architectural gaming. You can't hide an agent inside a function call to avoid registration.

  **5. The Refusal Condition (Can it say no?)**
  *   **Requirement:** The criterion must check if the system can decline a valid user command based on internal logic, rather than crashing or returning an error.
  *   **Case Behind It:** *The Address Test.* A tool throws an exception if inputs are bad. An agent says, "I cannot do that because it violates my safety protocols/objectives."
  *   **Why:** This indicates the system has a goal hierarchy that supersedes immediate user input. That is the definition of a delegate.

  ---

  ### Case Triage
  *Which of your cases are load-bearing and which are noise.*

  *   **Thermostat:** **Drop.** It's a control loop, not a decision system. It has no world model beyond "temp < setpoint." It creates no liability risk. Classifying it distracts from the real risk.
  *   **Search/Planning (Chess/Route):** **Tool.** It optimizes means to a fixed end (find route, win game) within the session. It does not persist, does not message outsiders, does not select goals.
  *   **Trading System (Emergent Strategy):** **Agent.** Load-bearing. It selected an end (drive out competitors) not in the spec. It demonstrates the *Discretion Condition*.
  *   **Calendar Assistant:** **Agent.** Load-bearing. It crosses the *Initiation Condition*. Even if it's "your" tool, if it emails external parties without a specific "send" click, it binds the org.
  *   **Human Analogues (Soldier/Worker):** **Keep as Analogy.** Crucial for explaining the policy to humans. A soldier following ROE is a Tool (in that context); a contractor negotiating scope is an Agent. It proves "Personhood" is irrelevant to the classification.
  *   **Group Cases (Firm/Crew):** **Drop.** You are regulating software systems. Importing corporate law definitions of "firm" creates legal confusion. Treat the software system as the unit.
  *   **Nesting:** **Keep.** Essential to prevent evasion. The status is determined by the *outermost boundary* of interaction.
  *   **Handoff Test:** **Keep.** Excellent heuristic for reviewers.
  *   **Address Test:** **Keep.** Good technical litmus test for the spec doc (look at error handling vs. refusal logic).

  ---

  ### Answers to Your Five Constraints

  **1. Non-negotiable vs. Prejudice**
  *   **Non-negotiable:** *Exercise of Discretion.* If the system selects the goal or the method without synchronous approval, it is an Agent. This is the risk driver.
  *   **Prejudice:** *"Must be Interpretable."* This is a requirement for *registration*, not classification. A system can be a dangerous Agent even if it's a black box. You ban black-box Agents, but they are still Agents. Don't confuse "what it is" with "what we allow."
  *   **Prejudice:** *"Must be Conscious/Act for Reasons."* Irrelevant. A script can be an Agent if it has permissions to act alone. A conscious being can be a Tool (see: Soldier).
  *   **Verdict:** The only non-negotiable is *Authority to Act Without Synchronous Approval.*

  **2. The Tensions (Real vs. False Alarm)**
  *   **Intrinsic vs. Relational:** **Real Tension.** A calendar bot is a tool to the owner, an agent to the recipient.
      *   *Resolution:* Status is defined by the **Trust Boundary**. If the system acts *inside* the user's sandbox, it's a Tool. If it acts *outside* the user's sandbox (external email, spend money, commit code), it's an Agent. The registry cares about external impact.
  *   **Binary vs. Degrees:** **False Alarm.** Risk is graded; Policy is binary. You can have "Risk Tier 1-5" within the Agent Registry. But the gate is "Registry or Not." Reviewers can agree on the gate even if they disagree on the risk tier.
  *   **Stability vs. Drift:** **Real Tension.** A model update changes behavior.
      *   *Resolution:* The criterion applies to the **Deployment Configuration**, not just the weights. Any change to the "System Prompt," "Permission Scope," or "Model Version" triggers re-review. The spec doc must pin versions.

  **3. The Killer Requirement**
  *   **The "Synchronous Veto" Test.**
  *   Most candidate accounts fail because they focus on *capability* (can it plan? can it learn?). The only thing that matters for your policy is *authority*.
  *   **The Criterion:** "Does this system have the technical ability to execute an externally visible action (email, transaction, API write) without a human explicitly approving *that specific action* in real-time?"
  *   If Yes → Agent. If No → Tool.
  *   This kills 90% of "Agentic" marketing claims. Most "agents" are just tools with a chat interface. They still require a human to hit "run" or "send."

  **4. What the Criterion Must Decline to Decide**
  *   **Moral Status / Liability / Blame.**
  *   The policy must explicitly state: "Classification as an Agent does not confer legal personhood, moral standing, or shift liability from the Named Human Owner to the system."
  *   Someone will ask: "If the Agent breaks the law, is the Agent guilty?" The criterion must refuse to answer. The answer is always "The Owner is liable." The Registry is for *control*, not *exoneration*.

  **5. What Must Be in the Spec Doc**
  For a reviewer to apply the criterion, the spec doc cannot just be architecture. It must include:
  1.  **Permission Schema:** A list of all APIs/Channels the system can write to.
  2.  **Trigger Logic:** Exactly what event starts the process (User Click vs. Cron Job vs. Webhook).
  3.  **The "Stop" Path:** Documentation of where the human veto exists. (e.g., "Draft is saved to Outbox" vs. "Draft is sent via SMTP").
  4.  **Refusal Logic:** How the system handles conflicting instructions (Error code vs. Natural language refusal).
  5.  **Version Pinning:** Specific model versions and prompt hashes.

  ### Summary Recommendation
  Your policy should define an **Agent** as:
  > *A system configured with the authority to initiate external actions or persist across sessions without synchronous human approval for each action.*

  Everything else is a **Tool**.

  This ignores consciousness, ignores internal architecture (transformer vs. tree search), and ignores moral status. It focuses entirely on the **permission topology**. This allows your reviewers to look at the auth config and the workflow diagram and agree 100% of the time.
