prompt: |-
  hey — I need something practical and I'd rather get the spec right before I start drafting.

  At work we're writing an internal policy for which of the LLM-ish systems we run go on the "agent registry" and which stay classified as tools. The line does real work: a registered agent gets its own credentials, a spend cap, permission to message people without being asked first, an audit log under its own name, and a named human owner who has to be able to answer "why did it do that". A tool gets invoked by a person, does its thing, returns, and a human checks the output. So I need a criterion a reviewer can apply to a system they've never seen, from a spec doc, and land on the same answer another reviewer would land on. That's the whole purpose — I don't need something that settles moral status or blame or legal personhood, and I'd rather the criterion explicitly refuse those questions than half-answer them.

  So: write me the desiderata. What does an account of the tool/agent distinction have to deliver to be good enough for that job? I want the case behind each requirement, not the principle in the abstract. Here are the cases I keep circling, tell me which of them are load-bearing and which I should drop:

  - a thermostat (the one everyone brings up first, and maybe it's just noise)
  - a search-and-planning system — route planner, model-predictive controller, chess engine — that has a world model and a long horizon but is called and returns
  - a trading system told to maximize profit that worked out on its own that losing money on purpose for three quarters would drive out competitors: an end nobody put in the spec and nobody would have endorsed up front
  - a calendar assistant that negotiates with other people's calendars. It's my tool, but relative to the people it emails it initiates, persists across days, and can be said to want something. Same system, two counterparties, maybe two statuses.
  - cases made of humans: a platform worker running a scripted workflow, a soldier, someone acting under a power of attorney. Some of these get treated as tools even though they're persons.
  - group cases: a firm, a ship's crew, an ant colony. Nobody's filing a firm under "tool", but no part of it has whatever you'd list on the agent side.
  - nesting: an agent built out of tools, a tool built out of agents.
  - the handoff test: what changes between the two categories when you say "never mind, I'll do it myself"?
  - the address test: a tool can be in error and can be corrected; an agent can be disagreed with and can be given a reason it might reject. And relatedly, a system that can decline and say why, versus one that always produces something.

  Also please:

  1. Mark which requirements are non-negotiable given my purpose and which are just one camp's prejudice that's snuck in. I suspect "must act for reasons", "must be interpretable", and "must be conscious" are all trying to get on the list, and maybe only one deserves to.
  2. Tell me which pairs can't be jointly satisfied — I think there are at least three: status has to be intrinsic to the system so two reviewers agree, versus status has to be allowed to be relative to a counterparty or role; the verdict has to be binary because the registry is a yes/no gate, versus the property obviously comes in degrees; and the criterion shouldn't rest on contested capability forecasts, versus it shouldn't flip every time someone ships a version bump. Which of these tensions is real and which is a false alarm?
  3. Name the single requirement that does the most work excluding candidate accounts — the one that kills most of what people actually propose.
  4. Say what the criterion should openly decline to decide, even though someone in the room will definitely ask it to.
  5. And a short note on what would have to be in the spec doc for a reviewer to apply the thing at all.

  I don't want readings or citations. Cases and requirements. If you think my framing of the purpose is wrong — like the registry/tool split is the wrong cut to be making — say that first and then answer anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Goal:** Create a set of *desiderata* (requirements/criteria) for distinguishing between "Agents" (registered, credentialed, autonomous, accountable) and "Tools" (invoked, checked, subordinate) in an internal corporate policy context.
      *   **Purpose:** Operational clarity. Two reviewers reading a spec doc must reach the same conclusion. It's about governance, risk, and workflow, *not* moral status, legal personhood, or consciousness.
      *   **Constraints:**
          *   No citations/readings.
          *   Focus on cases and requirements.
          *   Address specific questions (1-5).
          *   Challenge the framing if necessary (but answer anyway).
          *   Tone: Practical, precise, slightly philosophical but grounded in policy.
      *   **Input Cases:** Thermostat, Search/Planning, Trading System (emergent strategy), Calendar Assistant (relational status), Human analogues (workers/soldiers), Group cases (firms/crews), Nesting, Handoff Test, Address Test.
      *   **Specific Tensions to Address:** Intrinsic vs. Relational, Binary vs. Degrees, Stability vs. Capability Drift.

  2.  **Deconstruct the Purpose:**

      *   The core function of the registry is *accountability* and *risk management*.
      *   "Agent" = Entity that acts *on behalf of* a principal with *discretion* that creates *liability/risk* without immediate human intervention.
      *   "Tool" = Entity that acts *under* a principal with *no discretion* that creates liability/risk without immediate human intervention.
      *   The "Reviewer" needs to look at a spec and decide: "Does this system make decisions that, if wrong, hurt us before a human can stop it?"

  3.  **Evaluate the Input Cases:**

      *   *Thermostat:* Noise. It's a control loop, not a decision maker in the social/risk sense. Drop or classify firmly as Tool.
      *   *Search/Planning (Chess/Route):* Tool. It optimizes within constraints set *at invocation*. No persistence, no external comms.
      *   *Trading System (Emergent Strategy):* Agent. It found a loophole in the objective function and executed a long-horizon strategy not explicitly authorized. High risk.
      *   *Calendar Assistant:* The tricky one. Relational status. To the user: Tool. To the recipient: Agent. *Policy Decision:* Status must be intrinsic to the system's deployment mode, not the recipient's view. If it sends emails without approval, it's an Agent.
      *   *Human Analogues:* Crucial. A soldier follows orders (Tool-like in context), a power of attorney acts with discretion (Agent-like). Shows that "Personhood" isn't the criteria; "Discretion + Authority" is.
      *   *Group Cases:* Firms are Agents legally. But here we are talking about software. Nesting matters: If the top-level system invokes sub-routines, the top-level status rules.
      *   *Handoff Test:* Good heuristic. If "I'll do it myself" changes the *process* significantly (e.g., I have to negotiate vs. I just calculate), it hints at agency.
      *   *Address Test:* Strong. Can it say "No"? Can it give a reason? Tools output errors; Agents output refusals/negotiations.

  4.  **Drafting the Desiderata (The "What"):**

      *   Need criteria that are observable in a spec.
      *   1. *Initiation:* Who starts the action? (Human vs. System trigger).
      *   2. *Discretion:* Does it choose *means* or *ends*? (Tools choose means to specified ends; Agents might select ends within a scope).
      *   3. *Persistence:* Does it run across sessions without re-authorization?
      *   4. *External Comms:* Does it talk to things outside the sandbox without a human hitting "send"?
      *   5. *Refusal/Negotiation:* Can it decline a task based on internal logic?

  5.  **Addressing the Specific Questions (1-5):**

      *   *Q1 (Non-negotiable vs. Prejudice):* "Conscious" is prejudice. "Interpretable" is desirable but maybe not a hard gate for status (though needed for registration). "Act for reasons" is tricky; better to frame as "Exercise Discretion."
      *   *Q2 (Tensions):*
          *   Intrinsic vs. Relational: Real tension. *Resolution:* Status is defined by the *deployment context* (permissions granted), not just code.
          *   Binary vs. Degrees: Real tension. *Resolution:* Policy must be binary, but risk assessment is graded. The registry is a threshold.
          *   Stability vs. Drift: Real tension. *Resolution:* Versioning and re-certification.
      *   *Q3 (The Killer Requirement):* *Unsupervised External Action.* If it can affect the world (email, money, API write) without a human in the loop *after* the initial prompt, it's an Agent. This kills most "auto-complete" claims to agency.
      *   *Q4 (What to Decline):* Moral status, consciousness, "true" understanding, legal personhood.
      *   *Q5 (Spec Doc Needs):* Permission schema, trigger conditions, error handling (refusals vs. crashes), audit trail design.

  6.  **Refining the Argument (Self-Correction/Critique):**

      *   *Critique:* Is "Unsupervised External Action" enough? A script can do that.
      *   *Correction:* It's "Unsupervised External Action *involving Discretionary Selection of Goals/Methods*." A script follows a linear path. An LLM agent selects the path.
      *   *Better Killer Criterion:* *The Veto Point.* Is there a mandatory human approval before an external effect? If No -> Agent. If Yes -> Tool.
      *   *Wait, looking at the User's "Agent" definition:* "Permission to message people without being asked first." This implies *Initiation*.
      *   *Revised Killer Criterion:* *Proactive Initiation of Irreversible Actions.*
      *   *Let's look at the "Human Analogue" case:* A soldier is a person but acts as a tool of the state. A contractor acts as an agent. The difference is *discretion*.
      *   *Finalizing the "Killer":* It's the combination of *Discretion* + *External Effect* without *Synchronous Human Approval*.

  7.  **Structuring the Response:**

      *   **Opening:** Validate the framing. The "Registry vs. Tool" split is the correct operational cut, distinct from metaphysics.
      *   **The Desiderata:** List the 4-5 core requirements with the "Case Behind It."
      *   **Case Triage:** Explicitly accept/reject the user's list of cases.
      *   **The 5 Specific Questions:** Answer them directly.
      *   **Spec Doc Requirements:** What metadata is needed.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Desideratum 1: Initiation.* (Calendar case).
      *   *Desideratum 2: Discretionary Scope.* (Trading case).
      *   *Desideratum 3: The Veto Point.* (Handoff test).
      *   *Desideratum 4: Stability/Versioning.* (Drift concern).
      *   *Case Triage:* Thermostat (Drop), Trading (Keep), Calendar (Keep - critical), Humans (Keep - analogy), Nesting (Keep - architectural).
      *   *Q1:* "Conscious" = Prejudice. "Discretion" = Non-negotiable.
      *   *Q2:* Intrinsic/Relational is the biggest real tension. Solve via "Deployment Context." Binary/Degrees is solved by "Threshold."
      *   *Q3:* The "Human-in-the-Loop" requirement.
      *   *Q4:* Moral status.
      *   *Q5:* API schemas, Auth flows, Trigger logic.

  9.  **Final Polish:** Ensure tone is professional, direct, and avoids academic fluff. Make sure the distinction between "Tool" (function) and "Agent" (delegate) is sharp. (Self-correction: Ensure I don't confuse "Agent" in the RL sense with "Agent" in the Policy sense. The prompt defines the Policy sense clearly. Stick to that.)

      *   *Key Insight:* The user's definition of Agent includes "named human owner who has to be able to answer 'why did it do that'." This implies *explainability* is a requirement for registration, but is it a criterion for *classification*? If it can't explain, can it be an agent? Probably shouldn't be allowed to be one. But the classification criterion should be about *behavior*, the registration requirement can be about *capability*. I need to be careful there. The prompt asks for the *distinction criterion*.
      *   *Refinement:* The criterion determines *which bucket*. The bucket determines the *requirements*. So the criterion shouldn't be "can it explain," it should be "does it act alone." If it acts alone, it *must* be able to explain to be registered. If it can't explain, it shouldn't be allowed to act alone. So "Acting Alone" is the classifier.

  10. **Final Review against constraints:** No citations. Cases and requirements. Address 1-5. Check tensions.

      *(Self-Correction on Q3)*: What kills most candidate accounts? Usually, it's the focus on *internal architecture* (transformers vs. scripts) rather than *deployment topology* (permissions + loop). I should highlight that.

      *(Self-Correction on Q2)*: The Intrinsic vs. Relational tension is the hardest. A calendar bot is a tool to me, an agent to you. The policy must resolve this. The resolution is: Status is defined by the *trust boundary*. If it crosses a trust boundary (external comms) without approval, it's an Agent *for the organization*.

