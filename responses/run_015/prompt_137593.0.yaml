  **Title:** The Limits of Equilibrium: A Critique of the Lewisian Reading of *Lord of the Flies*

  While David Lewis's account of convention offers a compelling structural lens through which to view the social decay on Golding's island, treating the novel merely as a laboratory for coordination problems risks sanitising the psychological violence of the text. A competing reading must acknowledge where the Lewisian framework strains against the narrative, particularly regarding the nature of the conch, the fragility of the fire, Jack's strategic manipulation of salience, and the fundamental transformation of preference.

  Consider first the conch. To classify it strictly as a Lewisian convention is to overlook its dependency on imported authority. Lewisian conventions are arbitrary solutions to recurrent coordination problems sustained by mutual expectation. The conch, however, is not arbitrary in the minds of the boys; it is imbued with the weight of adult civilisation ('the school', 'the Home Counties'). It functions less as an emergent equilibrium and more as a sanction-backed norm that loses its force when the threat of external sanction vanishes. Furthermore, the conch performs two distinct functions: convening the assembly and regulating speech. A Lewisian analysis might treat these as separable coordination games. Yet Golding dramatises their entanglement: when the norm of speaking rights is violated (interruptions by Jack's choir), the legitimacy of the assembly itself corrodes. The conch is not merely a device facilitating coordination; it is a totem of a specific moral order. When the boys stop believing in the order, the convention does not simply shift to a new equilibrium; it becomes meaningless. Lewis's model, which assumes agents seek coordination, cannot fully account for an object that becomes a target of contempt rather than a focal point for agreement.

  The signal fire presents a sharper challenge to the Lewisian machinery, specifically regarding your classification of it as a 'beneficiary-blind' convention. In signalling-game models, stability relies on the receiver's response reinforcing the sender's behaviour. Here, the receiver (the passing ship) is absent, and the benefit (rescue) is never observed by the maintainers. Lewis's framework does predict fragility here: without common knowledge of successful coordination, the mutual expectations required to sustain the convention weaken. However, Golding suggests the failure is not merely epistemic but motivational. The fire goes out not because the boys doubt others will tend it, but because the preference for rescue is superseded by the immediate preference for hunting. A pure coordination model assumes the preference for rescue remains constant while the coordination fails. Golding shows the preference itself evaporating. The fire is not just a fragile convention; it is a burden incompatible with the emerging dominant strategy of the hunt.

  This leads to Jack's strategy. Your concept of 'prominence-poisoning' is astute, yet it perhaps grants Jack too much negative power. Lewis treats salience as exogenous, a given feature of the world. Jack, however, demonstrates that salience is endogenous and malleable. He does not merely degrade the salience of the assembly; he constructs a rival focal point rooted in fear and visceral satisfaction. The hunt is not just a disruption; it is a competing equilibrium with its own internal logic and rewards. To model this within a Lewisian framework would require expanding the theory to allow agents to strategically manipulate the payoff structure itself, not just the expectations of behaviour. The novel supplies resources for this: the paint. The masks do not just hide identity; they liberate the boys from the shame associated with the old conventions. This is not simply attacking the salience of the conch; it is altering the psychological costs of violating it. Lewis's rational agents calculate based on fixed preferences; Golding's boys calculate based on preferences that are actively reshaped by ritual and affect.

  Consequently, the claim that the unravelling is solely a collapse of higher-order expectations requires rigorous testing against the ending. It is tempting to argue that Ralph remains at the platform because he expects others to, while the others drift because they doubt Ralph's ability to enforce attendance. This preserves the Lewisian view that preferences (for rescue/order) remain fixed while expectations collapse. However, the murder of Simon and the hunt for Ralph suggest a darker reality. By the finale, Jack's tribe does not merely expect others to hunt; they *prefer* the hunt to rescue. Their utility function has changed. If preferences are transformed, describing the breakdown as a coordination failure is a category mistake. It is not that they cannot coordinate on rescue; it is that they no longer wish to. The Lewisian model, which holds preferences constant to explain coordination, breaks down when the coordination problem itself is dissolved by a shift in what the agents value.

  We must be honest with students about where this pairing fails. Lewis's framework is one of rational choice among stable agents. Golding's novel is an anthropological study of regression. The rules the boys begin with are not endogenous conventions discovered through interaction; they are imported habits of English school life. Treating their decay as a coordination failure ignores that they were never truly owned conventions to begin with. They were imitations of adult authority. Furthermore, the mechanism for the rise of new norms in the novel—mimesis, affective contagion, the chant ('Kill the pig. Cut her throat. Spill her blood.')—resists the reinforcement learning or replicator dynamics of evolutionary game theory. The boys do not adopt the hunt because it yields a higher payoff in a iterated game; they adopt it because they are swept up in a collective psychosis. Lewisian agents are cool calculators; Golding's boys are hot-blooded participants in a ritual. Scenes such as the dance during the storm resist the reading because the behaviour is not rational coordination but ecstatic conformity driven by fear.

  So, what does the novel contribute that the argumentative literature does not? Lewis provides the skeleton of how norms sustain themselves through mutual expectation, but Golding provides the phenomenology of how they feel when they die. The philosophical literature often abstracts away the emotional substrate of convention. *Lord of the Flies* reminds us that conventions are not merely rational equilibria but fragile constructs resting on a bed of shared affect and moral belief. When the affect turns to fear and the belief turns to cynicism, no amount of rational incentive can sustain the convention. The novel contributes the vital insight that coordination is not just a cognitive problem of matching expectations, but a psychological problem of maintaining shared humanity. Where Lewis explains the logic of convention, Golding exposes its vulnerability to the irrational forces that logic attempts to constrain.
