answer: |-
  Reject **Step (7)**.

  Here is the defense, the cost, and why this is the only move that saves your specific combination of (1) and (6).

  ### The Defense: Free-Riding Requires a Scheme
  Step (7) claims that failing to earn moral credit when you easily could is a form of "free-riding." This is a category error. Free-riding only makes sense within a **cooperative scheme of fair play** where there is a pre-existing expectation or obligation to contribute.

  Think of it like a voluntary tip jar versus a tax.
  *   **Obligation (Tax):** If everyone is required to chip in for a shared road, and you don't, you are free-riding. You benefit from others' contributions without paying your fair share.
  *   **Supererogation (Tip Jar):** If I leave a massive tip for the waiter, and you don't, you haven't free-ridden on me. There was no quota. There was no expectation that you *should* have contributed to my "generosity total."

  By rejecting (7), you assert that the moral universe is not a single cooperative venture with a quota of goodness that must be met. Supererogatory acts are "bonus points," not "required dues." Therefore, opting out of earning credit isn't unfair to those who did earn it; it's simply exercising the option to remain at the baseline. This preserves the "credit banking" metaphor (6) as a system of individual merit accumulation rather than a collective debt schedule.

  ### The Cost: Moral Fragmentation
  Biting this bullet comes with a significant philosophical price tag: **You must abandon the intuition that morality is fundamentally egalitarian or communal.**

  If you reject (7), you are accepting that it is permissible for Person A to live a life of minimal moral effort while Person B sacrifices everything, *even if Person A benefits from Person B's sacrifice*, without Person A being guilty of unfairness.
  *   **The "Saint/Sinner" Problem:** You have to accept a two-tiered morality. The "saints" operate in a zone of high credit/high cost, while the "rest of us" operate in a zone of safety. This can feel elitist. It implies that the moral burdens of the world will inevitably fall unevenly, and those who dodge the burden aren't necessarily doing anything wrong.
  *   **Weakened Community:** It thins out the concept of moral community. If I don't owe you anything for your heroism (because I wasn't required to match it), then our moral relationship is transactional rather than reciprocal. You lose the ability to say, "We all need to pull our weight," regarding acts of high sacrifice.

  ### Why This Saves (1) and (6)
  *   **Saves (1):** By denying that non-performance is free-riding, you block the inference that there is a "weak obligation." The act remains genuinely optional.
  *   **Saves (6):** You keep the "credit" idea but defang it. Credit becomes a measure of *personal excellence*, not a *currency of debt*. You can still say the hero "earned" something (honor, virtue, credit) without implying the bystander "owed" anything.

  ### The Alternative (and why you shouldn't take it)
  Your group might tempt you to reject **Step (3)** (the weighing model of reasons). While this is a popular move in academic meta-ethics, it undermines your desire to keep (6). If *pro tanto* reasons don't weigh toward obligation, the "credit" metaphor becomes hard to explain (what is the credit weighing against?). Rejecting (7) allows you to keep the standard weighing model for obligations *and* keep the credit model for supererogation, provided you insist the two systems don't interact.

  **The Verdict:** Stand firm on **Step (7)**. Tell your group: "Free-riding requires a duty to contribute. Supererogation is defined by the lack of that duty. Therefore, the concept of free-riding cannot apply here." Pay the price of a less communal morality to save the category of the heroic.
