      *   *Weaknesses/Pressures:* LE might argue George *did* choose the vocation. He chose to stay. The "absorption" looks a lot like supererogation (going above duty). If we call it "absorption," do we institutionalize it? If George is *owed* compensation for absorbing luck, does that ruin the moral worth of the act?
      *   *Verdict:* This is the strongest philosophical pressure point. It highlights the "harshness objection" to LE.

  5.  **Identify Where the Reading Fails (The "Dodges"):**
      *   *Charity vs. Justice:* The ending is a collection plate, not a tax refund or insurance payout. George isn't *owed* the money; he's *given* it. LE is about claims; the film is about gratitude.
      *   *The Scope of Community:* The user noted the white/homeowner bias. LE is universal; the film's community is exclusive. Who isn't in the B&L? (The black community, the very poor renters in Pottersville).
      *   *Clarence's Intervention:* It solves the problem via magic/angelic intervention, not structural change. It validates George's *life*, not his *balance sheet*.

  6.  **Select Discussion Scenes:**
