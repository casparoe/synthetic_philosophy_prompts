      *   The "Harshness Objection" (Elizabeth Anderson) is relevant here—LE can be cruel to those who make bad choices or have no good choices. The user's "Absorbed Luck" is a variation of this.
      *   Ensure I address the "Claims vs. Gifts" critique (Anderson again).

  9.  **Final Polish:**
