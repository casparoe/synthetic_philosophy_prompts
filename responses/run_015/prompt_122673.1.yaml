      *   *Section 2: Testing Hypothesis 2 (Absorbed Luck).* This is the gold mine. LE struggles with "necessary gambles." If you jump on a grenade to save friends, is that option luck? The film says George *absorbs* the town's luck. *Push back:* Does calling it "absorption" demand compensation? If George demands compensation, is he still George Bailey? The film relies on the *uncompensated* nature of his sacrifice to make it noble. LE wants it compensated. Tension here.
      *   *Section 3: Where it Fails/Dodges.* The Charity vs. Justice point is crucial. The basket of money is not a right. The exclusionary nature of Bedford Falls (who gets a loan?).
      *   *Section 4: Discussion Plan.* Pick the scenes. Frame the questions.
