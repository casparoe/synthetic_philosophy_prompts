  2.  **Deconstruct Luck Egalitarianism (LE):**
      *   *Core Principle:* Inequalities due to brute luck (unchosen circumstances) should be compensated. Inequalities due to option luck (calculated gambles) are the individual's responsibility.
      *   *Key Tension:* The "harshness objection" (what if the gamble was necessary? what if the choice wasn't truly free?).
      *   *Key Tension:* Justice vs. Charity (LE is about entitlement/claims, not gifts/gratitude).

  3.  **Evaluate Hypothesis 1: The Building & Loan as Institution:**
      *   *Strengths:* Fits the "pooling risk" aspect of social insurance. Potter represents unregulated capital accumulation based on others' misfortune. Pottersville shows the result of pure brute luck without mitigation.
      *   *Weaknesses/Pressures:* The B&L isn't a state institution; it's precarious. It relies on George's *personal* sacrifice, not structural stability. LE usually argues for systemic redistribution, but the film argues for personal virtue sustaining a fragile system. The B&L is also exclusionary (only those who can pay a little get in).
      *   *Verdict:* Strong reading, but the film undermines it by making the institution dependent on a "saint," not a right.

