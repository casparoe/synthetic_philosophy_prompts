          1.  *The Building & Loan as Moral Agent/Institution:* It pools risk against Potter (uninsured/capitalist exploitation). Pottersville = no risk pooling. This is closer to luck-egalitarian justice than individual transfers.
          2.  *Absorbed Luck vs. Option Luck:* George voluntarily takes on others' brute luck (Billy's mistake, depositors' panic, Harry's drowning) because he has no real choice. Luck egalitarianism might classify this as "option luck" (chosen gambles) and leave the loss with George. The user thinks this is wrong and wants to test the distinction between "insurance" (chosen risk) and "absorption" (forced risk).
      *   **Constraints/Requirements:**
