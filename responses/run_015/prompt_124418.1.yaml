  The single feature doing the work is the normative authority of the metaphysically dependent segment. This reverses the standard hierarchy where causal priority grants practical authority. If this feature is deleted, the case degenerates into a trivial question of which life Elena prefers, because without the binding force of the promise, the dream is merely a fleeting fantasy with no claim on the waking agent. The Cartesian reading would then succeed by default, dismissing the dream as irrelevant noise. The feature forces the issue: why does the dependent segment command the primary segment? This blocks the skeptical slide because skepticism relies on the dream being unable to touch the waking world; here, it touches the will directly. Furthermore, this feature specifically blocks the deflationary reply that "nothing hangs on it." Something hangs on it because a promise was made. If the promise carries weight, the metaphysical status of the promisor becomes secondary to the obligation itself, forcing the student to confront the source of normative force rather than the source of ontological status.

  The Proto-Cartesian reading comes out worst. Its strongest objection is that it conflates metaphysical priority with normative authority, failing to explain the phenomenology of obligation which constitutes the self here. It treats the self as a cognitive spectator rather than an accountable agent, missing the Zhuangzian point that transformation changes what one owes. By insisting that only the causally primary segment matters, it cannot account for cases where moral truth is revealed in transient states, rendering it incapable of handling the specific practical stakes of the scenario. It reduces the question to "what is real?" rather than "what must I do?", thereby failing the non-idle constraint. In a seminar on self-knowledge, this reading fails because it assumes self-knowledge is merely knowing which state is causal, ignoring knowing who one is responsible for being.

  A note on specifications: I fudged the memory continuity constraint slightly. To make the custodial reading work, she must remember the promise upon waking to feel bound, yet the prompt requires discontinuity to favor the waking tiebreakers. I resolved this by having her remember the *content* of the promise upon waking, even if the *experience* is discontinuous, ensuring the tiebreakers favor waking life while keeping the obligation live. This was necessary to prevent the case from dissolving into simple forgetfulness, which would make the decision idle. If she truly forgot, there would be no decision; if she remembered perfectly, the continuity tiebreaker would fail. This tension was unavoidable to satisfy the constraint that dependence and authority come apart while maintaining the "ordinary setting" without memory implants. Additionally, ensuring the dream is "lucid" enough to know it is a dream while still carrying authority pushes the boundary of "ordinary," but was required to eliminate the indistinguishability condition completely.
