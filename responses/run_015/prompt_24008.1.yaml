prompt: |-
  I'm a TA and next week I have to teach the coherance/Dutch book arguments that are supposed to support expected utility maximization to first-year philosophy/econ students in one fifty-minute section. They know what expected value is in the simple sense, and they know probabilities are numbers, but they have no idea what utility is doing or why incoherent credences/preferences are supposed to be bad. Dont explain it to me; plan how I should explain it. I want the order the pieces have to go in and why (what depends on what), the one carrying example to build the whole thing around (and what it must have and lack -- I'm thinking some kind of sure-loss bet, but not a boring lottery), the misconceptions the students will form -- I'm guessing: if a Dutch book is possible the beliefs are irrational full stop, and coherence is the same thing as rationality -- and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they got the idea rather than memorized the theorem. Also tell me what I should openly refuse to cover at this level. Respond in the style of an expert. Think very carefully before answering.
