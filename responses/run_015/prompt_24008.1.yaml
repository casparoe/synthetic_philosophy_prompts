      *(Self-Correction during drafting)*: I need to be careful about the link between Dutch Book and Expected Utility. Dutch Book arguments primarily justify *Probabilism* (having coherent credences). VNM arguments justify *Utility Maximization*. The prompt asks for "Coherence/Dutch book arguments that are supposed to support expected utility maximization." This is a slight conflation common in intro courses. The Dutch Book argument shows you *must* have coherent probabilities. Once you have those, EU maximization is the rule for action. I need to make sure I don't claim Dutch Books *prove* EU maximization directly, but rather that they prove the *input* (probabilities) must be coherent for EU to work properly without self-sabotage. I will frame it as: "Dutch Books show why your probabilities must obey the axioms; EU tells you what to do with them."

