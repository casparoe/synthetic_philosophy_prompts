answer: |-
  Here is the lesson plan. It is designed to be tight, interactive, and conceptually precise without getting bogged down in formalism.

  ### **Section Overview**
  *   **Time:** 50 Minutes
  *   **Goal:** Demonstrate that incoherent credences lead to pragmatic self-defeat (Dutch Book), establishing coherence as a necessary condition for rational choice (and thus Expected Utility maximization).
  *   **Core Philosophy:** Do not teach the math first. Teach the *consequence* of the math, then reveal the math as the explanation.

  ---

  ### **1. The Sequence & Dependencies (0–40 mins)**

  You must build this in a specific order. If you define utility before they understand *why* we care about consistency, they will treat utility as just "another variable." If you show the math before the intuition, they will memorize the inequality without grasping the "sure loss."

  **Phase 1: Operationalizing Belief (0–10 mins)**
  *   **Concept:** Credences are not just feelings; they are *betting prices*.
  *   **Dependency:** This must come first. If they don't accept that $P(A) = 0.7$ means "I will pay 70 cents for a ticket worth \$1 if A happens," the rest of the argument fails.
  *   **Action:** Write on the board: *"To have a credence of $X$ in Event $E$ is to be willing to buy a bet that pays \$1 if $E$ occurs for a price of $\$X$."*
  *   **Check:** Ask a student: "If I say I'm 100% sure the sun will rise, what price do I pay for that ticket?" (Answer: \$1). "If I'm 0% sure?" (Answer: \$0).

  **Phase 2: The Carrying Example — "The Hat Bet" (10–25 mins)**
  *   **Concept:** Incoherence creates a guaranteed loss (Dutch Book).
  *   **The Example:** Do not use a lottery. Use a binary event regarding **you** (the TA). It makes it immediate.
      *   **Event $H$:** "The TA wears a hat to class next week."
      *   **Event $\neg H$:** "The TA does *not* wear a hat to class next week."
      *   **The Setup:** Ask a student for their credence in $H$. Let's say they say **0.7**. Ask for their credence in $\neg H$. Let's say they say **0.5**. (Students often violate additivity intuitively).
      *   **The Trap:** You (the Bookie) offer to sell them both tickets based on their prices.
          *   Ticket 1 (Pays \$1 if $H$): Cost \$0.70.
          *   Ticket 2 (Pays \$1 if $\neg H$): Cost \$0.50.
          *   **Total Cost:** \$1.20.
          *   **Total Payout:** \$1.00 (Since either $H$ or $\neg H$ *must* happen, one ticket wins, one loses).
          *   **Net Result:** They lose \$0.20 no matter what.
  *   **Why this example works:** It requires no external knowledge (like horse odds). It relies on logical exhaustion ($H$ or $\neg H$). It shows that the loss comes from the *relationship* between the numbers, not the outcome of the event.

  **Phase 3: The "Why" — Pragmatic Self-Defeat (25–35 mins)**
  *   **Concept:** Why is losing \$0.20 bad? This is where **Utility** enters.
  *   **Dependency:** You can only explain this *after* they see the loss.
  *   **Explanation:** Money is a proxy for Utility. We assume (for this argument) that more money is better than less. A "Sure Loss" is a guaranteed decrease in Utility.
  *   **The Link to EU:** Expected Utility Maximization is a method for making decisions under uncertainty. If your inputs (credences) allow for a guaranteed loss, the "Maximization" engine is broken. Coherence is the *hygiene* required for EU to function.
  *   **Key Phrase:** "Coherence doesn't guarantee you win; it guarantees you aren't *guaranteed* to lose."

  **Phase 4: Boundaries of Rationality (35–40 mins)**
  *   **Concept:** Distinguishing Coherence from Truth and Total Rationality.
  *   **Dependency:** Must come after the Dutch Book is established, otherwise they think the Dutch Book proves the beliefs are *false*.
  *   **Action:** Explicitly state: "If the student above had said 0.3 for $H$ and 0.3 for $\neg H$ (Sum = 0.6), they would be coherent. They would still be wrong (since probabilities must sum to 1), but they wouldn't be *Dutch Booked*." (Wait, actually, sum < 1 allows a Dutch Book *against* the bookie, but usually we focus on sum > 1 for sure loss. Stick to Sum = 1 for coherence).
  *   **Correction for Phase 4:** Clarify that coherence is internal consistency, not external accuracy.

  ---

  ### **2. Misconceptions & Intervention Points**

  **Misconception A: "If a Dutch Book is possible, the beliefs are irrational full stop."**
  *   **The Trap:** Students think the Dutch Book proves the *content* of the belief is wrong (e.g., it proves the TA *won't* wear a hat).
  *   **Where to Head It Off:** **Phase 3.** When discussing the loss, emphasize that the loss occurs *regardless of whether you wear the hat*. The loss is structural, not factual.
  *   **Script:** "Notice: I didn't check if I actually wore the hat. You lost money in both worlds. The Dutch Book attacks your *structure*, not your *accuracy*."

  **Misconception B: "Coherence is the same thing as Rationality."**
  *   **The Trap:** Students assume if they avoid Dutch Books, they are being rational agents.
  *   **Where to Head It Off:** **Phase 4.** This is the most critical philosophical distinction.
  *   **Script:** "You can be perfectly coherent and completely crazy. If you are 99% sure the moon is made of cheese, and 1% sure it isn't, you are coherent. You will still starve trying to eat a telescope. Coherence is a *minimum requirement* for rationality, not the *definition* of it."

  **Misconception C: "Utility is just Money."**
  *   **The Trap:** They will think EU maximization is just about getting rich.
  *   **Where to Head It Off:** **Phase 3.** When introducing the "Sure Loss."
  *   **Script:** "We use dollars here because they are easy to count. But what this really shows is a sure loss in *value*. If you value 'spiting the bookie' more than \$0.20, this isn't a loss for you. But if you value money at all, this is a utility loss."

  ---

  ### **3. What to Openly Refuse to Cover**

  You have 50 minutes. If you try to cover these, you will lose the room. State these boundaries explicitly at the start or as they arise.

  1.  **The VNM Axioms:** Do not list Independence, Continuity, or Transitivity. That is a different argument (Money Pump) for preferences. You are doing Dutch Book for *credences*. Tell them: *"Today we justify the Probability side of Expected Utility. Next week (or in lecture) you'll justify the Utility side."*
  2.  **Logical Omniscience:** Students will ask, "What if I don't know A implies B?" Do not solve this. Say: *"This argument assumes you know the logical relationships between your bets. Real humans aren't perfect, but this is the ideal we aim for."*
  3.  **Risk Aversion:** If they ask, "What if I hate losing?" say: *"Risk aversion changes how much utility money gives you, but it doesn't change the fact that a guaranteed loss is a guaranteed utility drop. We are assuming linear utility of money for simplicity today."*

  ---

  ### **4. The Final Assessment Question**

  Do not ask them to calculate a Dutch Book. Ask them to evaluate the *normative force* of the argument. This tests if they understand *why* coherence matters.

  **The Question:**
  > "Imagine an agent who knows a set of bets will guarantee them a monetary loss (a Dutch Book). However, this agent gets so much psychological joy from 'confusing the bookie' that the utility of that joy outweighs the monetary loss.
  >
  > **According to the Dutch Book argument, is this agent's credence incoherent? And are they irrational?**"

  **The Answer Key (for you):**
  *   **Incoherent?** **Yes.** Their betting prices still sum to >1 (or violate axioms). The Dutch Book exists mathematically regardless of their psychology.
  *   **Irrational?** **No (not necessarily).** The Dutch Book argument only proves irrationality *if* the agent prefers more money/utility to less. If their utility function values "confusing the bookie" higher, they are maximizing their Expected Utility, even though they lose money.
  *   **Why this works:** It forces them to separate the *mathematical coherence* of the credences from the *rationality of the action*, and it forces them to acknowledge that Utility is subjective, not just cash.

  ### **5. Expert Tips for Delivery**

  *   **Board Work:** Draw the "Bookie" on the left and the "Student" on the right. Draw arrows for money flowing. Visualize the \$1.20 going out and the \$1.00 coming in.
  *   **Pacing:** If you run long, cut the discussion on "Logical Omniscience." Do not cut the "Hat Bet" example. That is the anchor.
  *   **Tone:** Be playful with the "Bookie" role. Make it clear you are trying to take their money. It wakes them up.
  *   **The "Utility" Pivot:** When you transition from Money to Utility in Phase 3, slow down. This is the moment they usually glaze over. Write **Money $\approx$ Utility (for this argument)** on the board.

  This plan respects their prior knowledge (EV/Probability) while isolating the specific conceptual gap (why coherence matters pragmatically) without overwhelming them with the full machinery of decision theory.
