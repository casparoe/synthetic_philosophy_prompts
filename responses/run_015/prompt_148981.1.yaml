          *   *Verdict:* Predicts exactly what illusionism says (cognitive penetration of introspection).

  5.  **Drafting the Ranked Defeaters (Fatal to Awkward):**

      *   *Fatal (or near):* The "Hard Problem of Illusion" (Kameny/Levine style). How can a non-phenomenal state misrepresent itself *as* phenomenal without there being something it is like to be in that state? If the misrepresentation is unconscious, why does it seem like anything? If conscious, we're back to square one.
      *   *Severe:* The Explanatory Gap regarding the *Illusion Mechanism*. We have no theory of how physical states generate the *specific* introspective error. Realists at least admit the gap; illusionists claim to close it but often just push it back.
      *   *Awkward:* Lack of Novel Predictions. Illusionism and Realism (Physicalist) often predict the same NCCs. Illusionism is hermeneutic, not empirical.
      *   *Awkward:* The "Zombie" Intuition persists. Even after accepting the theory, the world still *looks* phenomenal. Theory doesn't change the datum, just labels it false.

