answer: |-
  This is a sophisticated request that cuts to the core of the current meta-problem of consciousness. Since you are already versed in the Frankish literature, I will skip the introductory scaffolding and focus on the structural vulnerabilities, internal concessions, and the specific cost-benefit analysis you are asking for.

  Per your instructions, I will address your two specific persuasive points and the attention question in **Section I**, keeping them distinct from the general ranked defeaters in **Section II**. **Section III** will address the insulation strategy and predictive power.

  ---

  ### Section I: Your Specific Persuasive Points

  #### 1. The Resolution Worry (Structure vs. Vocabulary)
  *The Worry:* If fine-grained introspective reports track sensory discriminability in a stable, lawful way (e.g., color space, pitch discrimination), the "illusion" possesses the exact structural complexity realism attributes to qualia. If the "quasi-phenomenal" physical states must mirror the structure of the "phenomenal" properties to generate the specific illusion, isn't the distinction merely verbal?

  *   **Verdict:** **Not Fatal, but forces "Illusionism Plus."**
  *   **Analysis:** Frankish and defenders concede this is a major pressure point. The illusionist must argue that *structural complexity* does not entail *phenomenal ontology*. They argue that a system can process high-dimensional sensory data and represent it introspectively as "simple, ineffable qualities" without those qualities existing.
  *   **The Trap:** If the "quasi-phenomenal" base must be isomorphic to the "phenomenal" appearance to explain the specific content of the illusion, the explanatory work is being done by the functional structure, not the illusionist ontology.
  *   **Consequence:** This pushes you toward **Illusionism Plus** (or "Quasi-Realism"). You admit that while intrinsic qualia don't exist, the *functional roles* they were posited to fill (discrimination, memory integration, reportability) are real and structurally identical to what realists claim.
  *   **Is it fatal?** No, because it preserves the metaphysical gain (no non-physical properties, no Hard Problem of *existence*). However, it concedes the *explanatory* gain. If the quasi-phenomenal does everything the phenomenal was supposed to do, the "illusion" label becomes a metaphysical stipulation rather than an explanatory mechanism. It risks becoming a distinction without a functional difference.

  #### 2. The Normativity of Pain (The *Reductio* Worry)
  *The Worry:* If the unpleasantness of pain is part of the misrepresentation, pain is not intrinsically bad. It is merely a state that represents itself as bad. This seems to undermine the immediate normative force of suffering.

  *   **Verdict:** **Major Bullet to Bite (Existential Cost), but logically consistent.**
  *   **Analysis:** Frankish explicitly accepts this. He argues that pain is *instrumentally* bad (it motivates avoidance, signals damage) but not *intrinsically* bad (there is no "badness" property instantiated in the universe).
  *   **The Trap:** For many, this is a *reductio ad absurdum* of the view because it contradicts the primary datum of the mental: that suffering matters *in the moment*. If the "badness" is an error, why is the error so compellingly normative?
  *   **Defender's Move:** They argue our folk-psychological intuition about intrinsic badness is part of the user-illusion, evolved to ensure we prioritize damage avoidance.
  *   **Is it fatal?** Logically, no. Ethically/Existentially, it is the highest cost of the view. If you find the immediate normative force of suffering to be a foundational axiom of your metaphysics, this is fatal. If you view normativity as derivable from functional goals, it is merely awkward. Most defenders concede this is the "hardest pill to swallow" but maintain it is necessary to naturalize the mind.

  #### 3. The Stability of the Seeming (Attention)
  *The Question:* Does the fact that carefully attending to an experience doesn't dissolve the seeming count as evidence against illusionism?
  *   **Verdict:** **No. It is exactly what the theory predicts.**
  *   **Analysis:** A common realist intuition is that if qualia were an illusion, closer inspection (attention) would reveal the machinery (like looking closely at a hologram reveals pixels).
  *   **Illusionist Prediction:** The introspective system is "cognitively impenetrable" in this specific regard. The misrepresentation is a fixed, modular output of the introspective system. Attending *more* simply feeds more data into the same misrepresentational filter.
  *   **Why it doesn't dissolve:** The illusion is not a cognitive *belief* that can be corrected by knowledge (like the Müller-Lyer illusion); it is a perceptual/introspective *output*. Knowing the lines are equal doesn't stop them looking unequal. Similarly, knowing qualia are illusory doesn't stop them seeming phenomenal.
  *   **Evidence Status:** This is neutral evidence. It fits Illusionism perfectly, but it also fits Realism (qualia are robust, so attention doesn't dissolve them). It does not distinguish the two.

  ---

  ### Section II: Ranked Defeaters (Internal & Conceded)

  Here are the arguments that threaten illusionism, ranked by severity, focusing on problems its own defenders acknowledge are difficult.

  #### 1. Fatal / Near-Fatal: The "Hard Problem of Illusion" (The Phenomenal Concept Strategy Failure)
  *   **The Argument:** Even if we accept that phenomenal properties don't exist, we must explain how a physical state can *misrepresent* itself as having them. To misrepresent X as Y, the system must have a concept of Y. Where does the concept of "phenomenal redness" come from if no such state has ever been encountered?
  *   **The Concession:** Frankish admits this is the strongest objection. If the introspective state is non-phenomenal, how does it acquire the content "phenomenal"? If it acquires it from experience, but experience *is* the illusion, we have circularity.
  *   **Why it's Fatal:** If the mechanism of the illusion requires a "phenomenal concept," and phenomenal concepts are traditionally thought to require phenomenal experience to ground them, illusionism collapses into realism (the concept is grounded in real qualia) or skepticism (we can't even form the concept to be wrong about it).
  *   **Defender's Patch:** They argue for "quotational" or "recognitional" concepts that don't require the property to exist, only the *appearance* of it. But this pushes the problem back: what constitutes the "appearance" if not a phenomenal state?
  *   **Status:** This is the "Hard Problem" relocated. If not solved, it renders the theory incoherent.

  #### 2. Severe: The Explanatory Gap of the *Mechanism*
  *   **The Argument:** Realism faces the Hard Problem (Physical $\to$ Phenomenal). Illusionism faces the Hard Problem of Illusion (Physical $\to$ Misrepresentation of Phenomenal).
  *   **The Concession:** Defenders admit we currently have no neuroscientific or computational theory of how a non-phenomenal system generates the *specific* introspective error of phenomenality. We know *that* it happens (arguably), but not *how*.
  *   **Why it's Severe:** Realism admits the gap is metaphysical. Illusionism claims the gap is empirical/mechanistic. But if we cannot specify the mechanism without invoking phenomenality (see #1), the claim that it is "merely empirical" is unsupported. It risks being a "promise of an explanation" rather than an explanation.
  *   **Status:** Not fatal yet, because it's an open empirical question. But if 50 years of cognitive science fail to identify the "introspective misrepresentation module," the view loses credibility.

  #### 3. Moderate: The "Zombie Intuition" Persistence
  *   **The Argument:** Even if a philosopher accepts illusionism intellectually, the world continues to *look* phenomenal. The Hard Problem intuition persists phenomenologically even after it is rejected theoretically.
  *   **The Concession:** Frankish calls this the "Problem of the Persistence of the Intuition." He admits illusionism does not make the Hard Problem *go away* subjectively; it only tells you to ignore it.
  *   **Why it's Moderate:** A theory that tells you your primary data is false, but offers no way to stop experiencing that data as true, is pragmatically unstable. It creates a permanent schism between the "theoretical image" and the "manifest image."
  *   **Status:** Awkward, but not logically fatal. It suggests the theory is psychologically unnatural, which might indicate it is wrong, but doesn't prove it.

  #### 4. Mild/Awkward: The Lack of Novel Predictions
  *   **The Argument:** Illusionism and Physicalist Realism (e.g., Representationalism) often predict the same Neural Correlates of Consciousness (NCC). Both look for sensory processing + higher-order monitoring.
  *   **The Concession:** Defenders admit illusionism is primarily a metaphysical reinterpretation of existing cognitive science, not a new empirical paradigm.
  *   **Why it's Awkward:** If two theories predict the same data, but one requires fewer ontological commitments (Illusionism) while the other fits the data more naturally (Realism), the choice becomes purely aesthetic (parsimony vs. fidelity to intuition).
  *   **Status:** Merely awkward. Parsimony is a valid virtue. But it means illusionism cannot be confirmed by experiment, only by the failure of realism.

  ---

  ### Section III: Insulation and Prediction

  #### 1. The Insulation Strategy: "Apparent Datum = Illusion"
  You asked how much of the view is insulated by the move "apparent datum of qualia = just more illusion."

  *   **The Shield:** This move is incredibly robust against *direct* empirical falsification. If you find a neural correlate of "redness," the realist says "Here is the qualia." The illusionist says "Here is the physical state that triggers the illusion of qualia."
  *   **The Limit:** The shield breaks if the *explanation of the illusion* requires the reality of the thing denied.
      *   *Example:* If explaining the *error* requires a "subject of experience" that possesses the very properties the error denies, the shield fails. (This links back to the Hard Problem of Illusion).
      *   *Example:* If the *structure* of the error (your Resolution Worry) is so complex that it functionally constitutes the real thing, the shield becomes verbal.
  *   **Assessment:** The view is insulated from *observation* but vulnerable to *coherence*. It cannot be proven false by looking at the brain; it can only be proven false by showing the concept of "non-phenomenal misrepresentation of phenomenality" is incoherent.

  #### 2. Predictive Power vs. Rivals
  Does illusionism predict anything rivals don't?

  *   **Yes, but subtly.**
      1.  **Introspective Failure Modes:** Illusionism predicts specific dissociations between sensory discrimination and introspective report. If the introspective system is a separate "user-illusion" module, it should be possible to hack it independently of sensory processing. (e.g., inducing a sense of "phenomenal richness" without the corresponding sensory bandwidth, or vice versa).
      2.  **No "Extra" Physics:** Unlike panpsychists or dualists, illusionism predicts we will never find evidence of non-physical causation or "proto-consciousness" in fundamental physics. (Though physicalist realists agree here).
      3.  **The "Hard Problem" as a Cognitive Bias:** Illusionism predicts that the Hard Problem intuition should correlate with specific cognitive styles or limitations in metacognitive modeling. If we could enhance metacognition (pharmacologically or technologically), the intuition of qualia might weaken or change character. Realism predicts the intuition would remain robust because it tracks reality.
  *   **Comparison:** Representationalism (a rival physicalist view) predicts that fixing the representation fixes the phenomenology. Illusionism predicts that fixing the representation might leave the *illusion* of phenomenology intact (because the illusion is a specific type of misrepresentation, not just representation).

  ### Summary Recommendation

  To move you off Illusionism, you should not look for empirical data (the insulation is too strong there). You should focus on:

  1.  **The Coherence of the Mechanism:** Press the "Hard Problem of Illusion." Can a non-phenomenal state *mean* "phenomenal" without begging the question? If the answer is "no," the view is fatal.
  2.  **The Normative Cost:** Re-evaluate the Pain argument. If the intrinsic badness of suffering is a foundational truth for you, Illusionism is a *reductio*.
  3.  **The Resolution Worry:** If the "quasi-phenomenal" does all the work, ask if "Illusionism" is just "Realism" with a negative label attached to satisfy metaphysical parsimony. If the distinction does no functional work, Occam's Razor might cut the "Illusion" label, leaving you with a functionalist Realism.

  **Final Verdict:** The view is most vulnerable not to external data, but to internal coherence regarding the *content* of the misrepresentation. If the content of the illusion cannot be specified without invoking the reality of the illusion, the view collapses.
