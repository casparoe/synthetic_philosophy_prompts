  7.  **Final Polish:** Ensure the tone is authoritative yet defensive (in the academic sense). Make sure the distinction between "intent of producing agency" and "institutional priority" is clear in the replies, as that's the thesis pivot. (Self-Correction: Make sure Objection 1 clearly targets the "independently of intent" claim, as that's the most vulnerable philosophical point).

      *   *Wait, one nuance:* The prompt says "Include the objection I am hoping nobody asks...". I need to make sure I explicitly label or treat this as the specific one requested. I will ensure the text of Objection 1 matches the prompt's description exactly.

      *   *Check Objection 1:* "collapses the distinction between intentional descriptive suppression and mere resource-driven cataloging neglect."
