      *   Vocabulary matching? Yes (Philosophers: explanatory weight, causal mechanism; Archivists: provenance, epistemic violence; DH: reproducibility, operationalize).
      *   Reply length? Concise (2-3 min spoken).
      *   Weakest point/Concession included? Yes.
