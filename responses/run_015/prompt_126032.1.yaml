      *   *Conflict:* If I say it's independent of intent, I can't distinguish malice from neglect. If I can't distinguish them, "priority" is muddy. This is indeed the most damaging.

      *   *Check Objection 2:* Philosophers on metaphor. "Negative catalogical structure" sounds like "absence is presence." They hate that.
