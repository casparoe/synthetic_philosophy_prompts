          2.  *Two Analytic Philosophers of History:* Skeptical of metaphorical language carrying explanatory weight. Want precision, logic, and clear causality.
          3.  *One Digital Humanities (DH) Methodologist:* Concerned with algorithmic reproducibility, operationalization, and data structures.
      *   **Constraint:** No bibliographies/citations. Needs deployable arguments.
      *   **Task:** Identify 6 objections (most damaging to least), including the "hope nobody asks" one (malice vs. neglect). For each: subgroup, phrasing, reply, weakest point, concession, audience perception. End with a strategic note for the DH methodologist.

