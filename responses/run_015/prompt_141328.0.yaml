      The scheme does not embody one coherent theory but rather a **hybrid of Expressive Retributivism and Risk-Managed Utilitarianism**. The statutory language commits to backward-looking desert, but the operational mechanics presuppose forward-looking risk assessment and bureaucratic finality.

      The refusal to rely on deterrence in the statute is rhetorical, not operational. The inclusion of **future dangerousness** as a statutory aggravator reintroduces a forward-looking rationale under the guise of culpability. This feature **rules out pure retributivism**, which holds that punishment must be grounded solely in past wrongdoing, not predicted future behavior. It weakly presupposes incapacitation or deterrence, as both license restraining dangerous individuals, but it contradicts the statute's explicit disclaimer.

      The compensation scheme treats wrongful imprisonment as a tort rather than a moral catastrophe. By pricing exoneration at a flat state rate, the practice presupposes that **wrongful punishment is an accepted, budgeted cost of administration**. This is incompatible with a deontological framework where punishing the innocent is an absolute side-constraint. Pure retributivism cannot quantify wrongful suffering as a debt to be paid; it forbids the transaction entirely. Thus, the compensation feature **rules out absolutist constraints on innocence**, implying instead a consequentialist calculus where error rates are weighed against systemic utility.

      The execution practice—executing only volunteers while others decay on death row for decades—reveals that the state prioritizes **administrative finality over exacting desert**. Pure retributivism requires the state to inflict deserved suffering regardless of the offender's consent; allowing volunteers to hasten death implies the condemned has agency over the penalty's timing, which desert theory denies. Furthermore, the decade-plus delay under an avowedly retributive purpose suggests that **retribution is satisfied by the condemning judgment itself**, not the quantum of suffering inflicted. The sentence expresses societal condemnation; the execution is merely closing the file. This weakly presupposes **expressivism** (the judgment is the punishment) but rules out strict **lex talionis** or suffering-based retribution, which would demand swift infliction.

      If the state replaced its announced retributivism with a straightforward **expected-deterrence view**, the system would require swift, certain execution. Delay discounts the punitive threat, undermining deterrence. Future dangerousness would become the primary sentencing metric, outweighing past culpability. Innocence claims would remain priced costs, as deterrence tolerates occasional error for greater social safety.

