      *   No citations.
      *   Under 700 words.
      *   Dense argumentation.
      *   Address the specific "weakly presuppose" vs "rules out" distinction.

      *(Self-Correction during drafting)*: Make sure to explicitly state which features rule out rivals.
      *   Future dangerousness rules out pure retributivism.
      *   Compensation rules out absolute side-constraints.
