      Ultimately, the practice presupposes that **condemnation is the goal, execution is the option, and error is the cost**. It stitches together the moral authority of retributivism with the risk-aversion of utilitarianism, resulting in a system that claims to demand death but operates to avoid it unless the prisoner consents.

