answer: |-
  # Specification for a Theory of Phenomenal Combination

  To construct a viable panpsychist account of consciousness, we must move beyond the standard taxonomy of "subject-summing" or "phenomenal bonding." Those terms describe *mechanisms* proposed by specific camps, not the *conditions of adequacy* that any such mechanism must meet. The following desiderata are derived from the logical requirements of composition, the phenomenology of experience, and the metaphysics of persistence.

  They are divided into **Non-Negotiable Constraints** (failure results in eliminativism, brute emergentism, or incoherence) and **Camp-Specific Preferences** (failure results in a different variety of panpsychism, but the view remains viable).

  ## I. Non-Negotiable Constraints
  *These criteria define the baseline for any theory claiming to solve the combination problem without collapsing into rival positions.*

  ### 1. The Phenomenal Unity Requirement
  **Motivation:** The most immediate datum of consciousness is that it presents as a unified field. When you see a red apple and smell its scent, these do not appear as two separate experiences owned by two separate subjects that happen to be located near each other; they appear as one complex experience owned by one subject.
  **Requirement:** The theory must explain how distinct micro-phenomenal properties constitute a single, integrated macro-phenomenal field without remainder.
  **Failure Mode:** If this is not met, the theory yields a "heap" of micro-experiences rather than a macro-subject. This collapses into **eliminativism** regarding the macro-subject (denying that "you" exist as a unified entity) or **pluralism** (claiming the brain is a colony of homunculi, which contradicts phenomenological introspection).

  ### 2. The Non-Brute Derivation Requirement
  **Motivation:** The primary motivation for panpsychism is to avoid the mystery of brute emergence—the idea that consciousness magically pops into existence when matter reaches a certain complexity. Panpsychism claims to naturalize consciousness by grounding it in the fundamental constituents of reality.
  **Requirement:** The relationship between micro-phenomenal properties and macro-phenomenal properties must be intelligible and grounded. It cannot be a brute fact that *these* micro-experiences yield *that* macro-experience. There must be a principled connection (constitution, grounding, or identity).
  **Failure Mode:** If the link is brute, the view collapses into **emergentism**, forfeiting panpsychism's main theoretical advantage.

  ### 3. The Perspectival Integrity Requirement
  **Motivation:** Consciousness is essentially subjective; it is "for" a subject. A free-floating quality of "redness" without a point of view is not an experience; it is merely a property.
  **Requirement:** The theory must account for the emergence or constitution of the *subject* itself, not just the *qualities* experienced. It must explain how micro-subjectivity (or proto-subjectivity) transitions into macro-subjectivity without losing the essential "for-me-ness" of experience.
  **Failure Mode:** Failure leads to **quality-panpsychism** (panqualism) without subjects, which fails to explain the unity of experience (see #1), or it leads to a category error where properties exist without bearers.

  ### 4. The Diachronic Continuity Constraint (Pressure Point 1)
  **Motivation:** Macro-subjects persist through time despite the turnover of their physical substrate. Neurons degrade, atoms exchange, and metabolic processes replace constituents constantly. Yet, the phenomenal "I" feels continuous.
  **Requirement:** The theory must explain how a macro-subject maintains phenomenal identity over time without positing a static, unchanging micro-substrate. It must account for persistence through mereological change (the replacement of parts) without invoking a non-physical soul or a brute fact of persistence.
  **Failure Mode:** Failure leads to **diachronic fragmentation**, where the macro-subject ceases to exist at every moment of micro-constituent turnover, resulting in a rapid succession of distinct, short-lived subjects (a "teletransportation" problem occurring continuously). This contradicts the phenomenological datum of continuity.
  **Status:** **Non-Negotiable.** Without this, the theory cannot account for the persistence of the self, a core feature of conscious life.

  ### 5. The Silent Partner Constraint (Pressure Point 3)
  **Motivation:** A macro-system (like a brain) contains vastly more micro-entities than seem relevant to the specific content of a given experience. If every electron, quark, and atom in the brain contributes its own phenomenal pulse to the macro-mind, the resulting experience should be a chaotic explosion of noise, or the macro-mind should be infinitely complex. Yet, our experience is selective and structured.
  **Requirement:** The theory must explain how micro-entities can be physically present within the boundary of a macro-system without necessarily contributing phenomenally to the current macro-experience. It must provide a rule for phenomenal relevance that allows for "inactive" constituents.
  **Failure Mode:** Failure leads to **phenomenal explosion** (the macro-mind is overwhelmed by redundant micro-data) or forces the theory to claim that macro-experience is vastly more complex than reported, undermining the reliability of introspection.
  **Status:** **Non-Negotiable.** Without this, the combination mechanism becomes physically implausible and phenomenologically inaccurate.

  ---

  ## II. Camp-Specific Preferences
  *These criteria distinguish between varieties of panpsychism (e.g., constitutive vs. cosmopsychist). A theory can fail these and remain panpsychist, but it will occupy a specific niche.*

  ### 6. The Phenomenal Overlap Rule (Pressure Point 2)
  **Motivation:** In cases of fission, fusion, or shared neural substrate (e.g., conjoined twins sharing a thalamus, or hypothetical mind-uploading scenarios), it is conceptually possible for two macro-subjects to share micro-constituents.
  **Requirement:** The theory must take a definitive stance on whether micro-phenomenal properties can be constituents of more than one macro-subject simultaneously.
  *   *Option A (Exclusion):* A micro-experience can belong to only one macro-subject. (Requires a principled reason for exclusion).
  *   *Option B (Inclusion):* Micro-experiences can be shared, leading to overlapping macro-subjects. (Requires rules for how overlap affects identity).
  **Status:** **Camp-Specific.** Constitutive panpsychists often prefer Exclusion to preserve subject individuation. Cosmopsychists or holistic views may permit Inclusion. However, the theory *must* address it; silence is not an option.

  ### 7. The Causal Closure Compatibility
  **Motivation:** Physicalism generally demands that the physical domain is causally closed (physical effects have sufficient physical causes). Panpsychism risks making consciousness epiphenomenal (causally inert) if the micro-physical already does all the causal work.
  **Requirement:** The theory should specify whether macro-consciousness has downward causal power over the micro-constituents, or if causation remains strictly at the micro-level.
  **Status:** **Camp-Specific.**
  *   *Compatibilist:* Macro-experience is causally relevant (risks overdetermination).
  *   *Epiphenomenalist:* Macro-experience is a byproduct (preserves physical closure but diminishes the utility of consciousness).
  *   *Constitutive:* Macro-causation is just micro-causation described differently (avoids overdetermination but risks reducing the macro to an illusion).

  ### 8. The Macro-Binding Mechanism Prohibition
  **Motivation:** A core tenet of standard constitutive panpsychism is that the fundamental level is ontologically privileged. Introducing a mechanism that operates *only* at the macro-level to bind micro-experiences risks smuggling in brute emergence.
  **Requirement:** The theory should ideally derive the binding principle from the nature of the micro-constituents themselves, rather than positing a macro-level law that organizes them.
  **Status:** **Camp-Specific.**
  *   *Strict Constitutive:* Rejects macro-binding laws; binding must be intrinsic to micro-nature.
  *   *Emergentist-Leaning:* Accepts macro-level binding principles as fundamental laws of nature (closer to emergentism).
  *   *Cosmopsychist:* Denies the need for binding; the macro is fundamental, and micro-entities are derivatives (dissolves the problem rather than solving it).

  ---

  ## III. Analysis of Joint Unsatisfiability and Tensions

  The critical philosophical work lies not in listing these desiderata, but in recognizing where they pull against one another. Based on current conceptual resources, there is a high probability that specific subsets of these constraints are jointly unsatisfiable without compromising the core spirit of panpsychism.

  ### The Diachronic-Silent Partner Tension
  **The Conflict:** There is a severe tension between **Diachronic Continuity (NN #4)** and the **Silent Partner Constraint (NN #5)** when combined with the **Non-Brute Derivation Requirement (NN #2)**.

  1.  **The Setup:** To satisfy Diachronic Continuity, the macro-subject must persist even as micro-constituents are replaced. This implies that the *structure* or *pattern* of combination is what matters, not the specific identity of the micro-subjects.
  2.  **The Silent Partner Problem:** To satisfy the Silent Partner Constraint, the theory must explain why some micro-entities in the physical boundary are phenomenally active and others are not. This requires a selection mechanism.
  3.  **The Trap:** If the selection mechanism is determined by the *macro-structure* (e.g., "only neurons firing in pattern P contribute"), then the macro-structure is doing the work of selecting which micro-experiences count. This looks suspiciously like a **Macro-Binding Mechanism (CS #8)**.
  4.  **The Collapse:** If the macro-structure determines phenomenal relevance, then the macro-level is ontologically prior to the combination. This violates the **Non-Brute Derivation Requirement**, because you are no longer deriving the macro from the micro; you are using the macro to define the micro's contribution.
  5.  **Conclusion:** It appears difficult to maintain that (a) micro-entities are the fundamental phenomenal carriers, (b) some are silent partners, and (c) the subject persists through turnover, without implicitly granting the macro-level a governing authority that panpsychism was designed to avoid. Satisfying Diachronic Continuity and the Silent Partner Constraint simultaneously seems to require a "filter" that operates at the macro-level. If that filter is not brute, it must be grounded in the micro. But if it is grounded in the micro, how do the micro-entities "know" to be silent without a macro-context? This suggests a circular dependency.

  ### The Overlap-Unity Tension
  **The Conflict:** Between **Phenomenal Overlap (CS #6)** and **Phenomenal Unity (NN #1)**.

  1.  **The Setup:** If we allow Phenomenal Overlap (two macro-subjects share micro-constituents), we must explain the boundaries of the subjects.
  2.  **The Trap:** If Subject A and Subject B share micro-constituent *m*, and *m* has a specific phenomenal character, does *m* feel different to A than to B?
      *   If *yes*, then *m* is not truly shared; it is duplicated. This violates the spirit of Overlap.
      *   If *no*, then there is a phenomenal quality that exists without a unique subject-owner, or is owned jointly.
  3.  **The Collapse:** Joint ownership threatens **Phenomenal Unity**. If *m* is part of my unified field and also part of your unified field, the boundary between "my" unity and "your" unity becomes porous. If the boundary is porous enough, the distinction between Subject A and Subject B dissolves, leading toward **Cosmopsychism** (one universal subject with fragmented perspectives) rather than Constitutive Panpsychism (many subjects combining).
  4.  **Conclusion:** You can have Overlap or you can have Strict Unity, but maintaining both requires a theory of "perspectival indexing" that is currently undeveloped.

  ---

  ## IV. Brief Theoretical Stress-Test

  To illustrate the utility of this specification, we can briefly note how two dominant frameworks strain against these desiderata.

  **Constitutive Panpsychism (Micro-based)**
  *   **Strengths:** Satisfies **Non-Brute Derivation** and **Causal Closure** well.
  *   **Weaknesses:** Struggles severely with **Diachronic Continuity** (how does the subject survive particle turnover?) and the **Silent Partner Constraint** (why don't all particles in the brain contribute?). It often relies on structural isomorphism, which risks violating the **Macro-Binding Mechanism Prohibition** by making structure (a macro-feature) the determinant of consciousness.

  **Cosmopsychism (Macro-based)**
  *   **Strengths:** Trivially satisfies **Phenomenal Unity** and **Diachronic Continuity** (the universal subject is stable). It handles the **Silent Partner Constraint** by viewing micro-entities as fragmented aspects of the whole, not independent contributors.
  *   **Weaknesses:** Struggles with **Non-Brute Derivation** in the reverse direction (how does the One become the Many?). It often violates **Causal Closure Compatibility** regarding individual agency (if the cosmic subject is fundamental, is my individual choice an illusion?). It also faces the **Inverted Combination Problem** (the decomposition problem).

  ## V. Summary of the Trade-Off Landscape

  In building your own specification, you must recognize that you cannot maximize all values. The central trade-off is between **Ontological Parsimony** (sticking to micro-fundamentals) and **Phenomenological Accuracy** (matching the continuity and unity of experience).

  *   If you prioritize **Diachronic Continuity** and **Silent Partners**, you are pushed toward a structuralist or macro-binding view, risking brute emergence.
  *   If you prioritize **Non-Brute Derivation** and **Micro-Fundamentality**, you are pushed toward accepting **Diachronic Fragmentation** (the self is a series of momentary subjects) or denying **Silent Partners** (everything in the brain is conscious, creating noise).

  An adequate theory must explicitly state which Non-Negotiable constraint it is willing to reinterpret, or provide a novel metaphysical account that dissolves the tension between the Silent Partner Constraint and Diachronic Continuity without invoking a macro-level binder. Currently, no existing framework fully satisfies the Non-Negotiable list without significant cost to the Camp-Specific preferences. Your task is to determine which cost is philosophically cheapest.
