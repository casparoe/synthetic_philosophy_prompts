  SEMInAR HANDOUT: DREAM TAXONOMY v0.9
  (please don't quote this without asking, still workshopping the branches)

  look, the goal here is to stop talking past each other about "what dreams are" and force a commitment on the mechanics. below is a decision tree. read the diagnostic cases, pick a branch, and see where you land. if you end up on a leaf you hate, revise your answer upstream.

  **BRANCH 1: does any phenomenal content occur during REM sleep at all?**
  *Diagnostic:* Imagine we have a perfect neural correlate of "seeing red." It fires in REM. Is there *anything it is like* to be the sleeper then?
  *   **NO** → Go to Leaf 1.
  *   **YES** → Go to Branch 2.
  *   *(MAYBE → go home and finish your dissertation)*

  **BRANCH 2: if yes, is the lack of concurrent reportability a knock-down reason to deny it's an experience?**
  *Diagnostic:* A subject is in REM. They have the neural signature of pain. They cannot speak (atonia) and won't remember it unless aroused. Is the experience real *now*, or only real if they can tell us about it later?
  *   **KNOCK-DOWN** (no report = no experience) → Go to Leaf 2.
  *   **EVIDENTIAL GAP** (report is just hard to get) → Go to Branch 3.

  **BRANCH 3: does the narrative unfold in real-time during REM, or is it constructed/loaded retroactively upon waking?**
  *Diagnostic:* You wake with a vivid 20-minute story. Do you think that story was playing second-by-second in REM, or was it compressed/loaded on arousal (like a file saving corruptly)?
  *   **RETROACTIVE** (built on waking) → Go to Leaf 3.
  *   **REAL-TIME** (unfolds in sleep) → Go to Branch 4.

  **BRANCH 4: within the real-time camp, what is the status of Working Memory (WM) and motor feedback?**
  *Diagnostic:* If someone reports a lucid dream in real-time via eye signals, does that fix the reportability problem or is it still a different kind of access? Also, if you dream you're running but motor cortex is blocked, is that a full experience?
  *   **WM/MOTOR ABSENT & DOESN'T MATTER** → Go to Leaf 4.
  *   **WM INTACT & ACCESSIBLE** → Go to Leaf 5.
  *   *(WM ABSENT & MATTERS → this collapses into Leaf 4 but with "attenuated" phenomenology; we're treating that as a variant for now)*

  ---

  **THE LEAVES**

  **Leaf 1: Hard Denial (No-Content Skepticism)**
  *   **Position:** There is no phenomenal content during sleep; dreams are purely post-hoc confabulations.
  *   **Awkward Commitment:** You have to explain away lucid dreamers signaling from REM as purely reflexive or coincidental behavior without inner life.

  **Leaf 2: Verificationist Denial (Operationalist)**
  *   **Position:** Content might be occuring, but without concurrent reportability, it doesn't count as an "experience" in the philosophical sense.
  *   **Awkward Commitment:** You must accept that a perfect neural duplicate of a waking pain state is not pain simply because the subject is paralyzed.

  **Leaf 3: Retrospective-Construction (The Dennett Move)**
  *   **Position:** The "dream" is a narrative constructed at the moment of awakening based on fragmentary sleep states.
  *   **Awkward Commitment:** You have to claim the vivid temporal flow of a long dream is an illusion generated in the few seconds of waking up.

  **Leaf 4: Real-Time Phenomenal View (Standard Realism)**
  *   **Position:** Dreams are full experiences unfolding in real-time, despite WM deficits and atonia.
  *   **Awkward Commitment:** You need to explain how a coherent narrative persists without standard working-memory encoding or motor feedback loops.

  **Leaf 5: [UNOCCUPIED] Real-Time + Intact WM Access**
  *   **Position:** Dreams unfold in real-time *and* working memory remains fully functional/accessible during REM.
  *   **Status:** **Unexplored/Empirically Unlikely.**
  *   **Awkward Commitment:** You are committed to a neuroscience of sleep that contradicts most current data on prefrontal deactivation during REM.

  ---

  **NOTES ON INDISTINGUISHABILITY**
  Be careful: The tree cannot empirically seperate **Leaf 3 (Retrospective)** and **Leaf 4 (Real-Time)** unless you have lucid eye-signals. Without real-time signaling, a "20-minute dream" reported on waking is compatible with both 20 minutes of REM processing *and* 20 seconds of waking construction. If you pick one, admit it's a metaphysical choice, not just data.

  Summary: The deepest split isn't about whether dreams exist, but whether experience requires the capacity to report it while it's happening.
