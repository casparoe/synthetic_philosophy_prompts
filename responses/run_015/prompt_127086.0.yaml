      *   *The Action:* "Constitutional Acts" (rewriting rules).
      *   *The Catch:* Rewriting rules costs resources and has unintended consequences.

  4.  **Refining the Mechanics (Iterative Process):**
      *   *Round 1:* Baseline. Pure luck. Some lose tokens.
