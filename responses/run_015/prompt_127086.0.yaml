prompt: |-
  I teach a postgrad seminar in political philosophy — about 14 people, one 90-minuite session. I want an acivity that gets them to feel Machiavelli's idea that virtù isn't just personal boldness but a kind of institutional elasticity: the capacity to rewrite the rules of the game you're trapped in while fortuna is still rolling. Design a classroom simulation with clear roles, rounds, and a token/payoff scheme (no real money needed). They should hit moments where pure luck wipes them out unless they've already altered the setup, moments where altering it saves them, and at least one round where the alteration backfires because fortuna shifts in a direction they didn't anticipate. Arrange the rules so all this happens before anyone explains it — no lecture up front. Include a debrief that maps specific rounds onto Machiavelli's argument (paraphrase only, no quotations), and be frank about which part of the view — likely the gendered metaphor of fortuna as a woman to be beaten or tamed — the acivity can't reproduce and you'll have to supply in discussion yourself. Also tell me what will predicatbly go wrong the first time you run it, and how to handle it on the fly.
