answer: |-
  **MEMORANDUM**

  **TO:** Head of Strategy, Chief Risk Officer, Chief Quantitative Officer
  **FROM:** Model Risk Committee (MRC)
  **DATE:** October 14, 2023
  **SUBJECT:** Decision on Halcyon Systems "Meridian" Pilot Proposal

  ### 1. Executive Summary

  The Model Risk Committee has reviewed the proposal to pilot Halcyon Systems' "Meridian" platform for a ninety-day period. Meridian proposes to replace our incumbent credit-risk modeling pipeline with an automated search system that evaluates roughly one billion candidate pipelines against historical holdout data.

  The Committee **approves the pilot subject to strict conditions** regarding documentation of inductive bias and regulatory alignment. We reject Halcyon's assertion that the system is "assumption-free." We further determine that the proposed commercial terms mitigate financial loss but do not mitigate model risk. Consequently, approval is contingent on Halcyon explicitly documenting the "meta-assumptions" inherent in their search space and validation protocol, and on a revision to our internal charter's definition of "justified superiority."

  ### 2. The Core Dispute: Induction and the No-Free-Lunch Theorems

  The debate surrounding Meridian centers on the interpretation of the No-Free-Lunch (NFL) theorems and the problem of induction.

  **Halcyon's Position:** Halcyon argues that because NFL theorems state no learner outperforms another averaged over *all possible* problems, and because we care only about *our* specific data distribution, Meridian's exhaustive search is a valid method for finding superiority without imposing specific model assumptions (e.g., linearity). They contend that requiring explicit assumptions renders the MRC charter unsatisfiable, as all models (including the incumbent) rely on the inductive premise that the future will resemble the past.

  **The Committee's Quantitative View:** The Chief Quantitative Officer correctly notes that NFL theorems imply that any performance gain on a specific distribution *must* be paid for by an assumption about that distribution. Meridian's search space (the 1 billion pipelines), its scoring rule, and its cross-validation protocol constitute a specific inductive bias. By claiming "no assumptions," Halcyon is not removing assumptions; they are obscuring them within the architecture of the search.

  **Resolution:** The Committee finds Halcyon's *reductio ad absurdum* regarding the charter partially correct but ultimately misleading. It is true that if the charter forbade induction, no model could be approved. However, the charter requires that superiority be *justified*. Justification does not require the absence of inductive bias; it requires the **transparency** of that bias.
  *   **Finding:** The incumbent model relies on induction, but its assumptions are explicit (e.g., feature stability, linear boundaries). Meridian relies on induction, but its assumptions are implicit (e.g., that the optimal pipeline exists within the 1 billion candidates, that cross-validation error correlates with future risk).
  *   **Risk:** The risk is not induction itself; the risk is *undocumented* induction. Therefore, Meridian cannot be deployed as "assumption-free."

  ### 3. Regulatory Compliance: Defining Assumptions for Search Systems

  Our regulator requires a documented statement of assumptions and limitations for every production model. Halcyon's claim that Meridian has "none" is incompatible with this requirement.

  For a system that searches rather than specifies, the "assumptions" are not parameters of a single equation, but constraints on the hypothesis space. To satisfy regulatory expectations, Halcyon must provide a **Model Inductive Statement (MIS)** prior to production deployment. This statement must define:

  1.  **Search Space Completeness:** A description of what classes of functions are *excluded* by the 1 billion pipeline limit. (e.g., Does the search space allow for non-stationary interactions? What is the maximum depth of feature crosses?)
  2.  **Validation Assumptions:** An explicit acknowledgment that the cross-validation protocol assumes data stationarity (i.e., that the statistical properties of the holdout set match the live deployment environment).
  3.  **Objective Function Alignment:** A justification that the scoring rule used during search (e.g., log-loss) aligns with the firm's actual risk tolerance (e.g., tail risk), acknowledging that optimizing for the former does not guarantee optimization for the latter.

  **Condition 1:** Pilot approval is contingent on Halcyon delivering a draft MIS within 30 days. If the MIS asserts "no assumptions," the pilot will be terminated.

  ### 4. Commercial Terms and the "Finance Wager"

  Halcyon has offered a performance-based fee structure: payment is due only if Meridian beats the incumbent on live data over the next two quarters.

  One Committee member argued this settles the risk, as we are "buying an option" on the model's success. Another argued that a contract paying only on out-of-sample success is itself a wager that the world is regular, and thus the assumption has not been removed, only relocated to the Finance department.

  **The Committee finds the second remark correct.**
  The payment structure protects the firm's *budget*, not its *risk profile*. If Meridian fails due to a structural break in the market (violating the inductive assumption), we may not pay Halcyon, but we still suffer the operational disruption, potential customer harm, and regulatory scrutiny of a model failure. The contract shifts the financial loss of the vendor relationship; it does not hedge the model risk exposure to the firm.

  **Condition 2:** The commercial terms are acceptable, but they do not count as a risk control. The Model Risk inventory must list Meridian as "High Risk - High Inductive Dependency" regardless of the fee structure. We are accepting the wager on regularity; we must not mistake the vendor's fee concession for a reduction in that wager.

  ### 5. Charter Update: Defining "Justified Superiority"

  Halcyon's challenge regarding the charter requires us to clarify what "justified superiority" means in light of the NFL theorems. If no learner is better than any other across all problems, we cannot justify a model by claiming it is "truer." We can only justify it by claiming it is "more robustly fitted to our specific constraints."

  Effective immediately, the MRC updates the definition of **Justified Superiority** in the Risk Charter:
  *   *Previous Interpretation:* A model must be demonstrably superior based on theoretical grounds or historical backtesting.
  *   *New Interpretation:* A model demonstrates justified superiority if (a) its inductive biases are explicitly documented, (b) it outperforms the incumbent on out-of-sample data *under the same stationarity assumptions*, and (c) the cost of its failure modes (when the inductive bias is wrong) is understood and capital-reserved.

  This resolves the Halcyon paradox. We acknowledge that Meridian and the incumbent both rely on the "circularity" of induction. Meridian is not disqualified for using induction; it is disqualified if it claims not to.

  ### 6. Decision and Action Items

  **Decision:** **Conditional Approval** for a 90-Day Pilot.

  **Terms for Halcyon Systems:**
  1.  **Documentation:** Deliver the Model Inductive Statement (MIS) described in Section 3 by Day 30 of the pilot.
  2.  **Shadow Mode:** For the first 45 days, Meridian must run in shadow mode (no customer impact). Live deployment for the remaining 45 days requires MRC sign-off on the MIS.
  3.  **Incumbent Parity:** The incumbent model must be re-evaluated to document its own inductive biases using the new Charter definition by Q1 next year. We acknowledge the Committee's scrutiny applies equally to our legacy systems.

  **Internal Action Items:**
  1.  **Engineering:** The feature pipeline owner (undersigned) will instrument the pipeline to log search-space drift. If Meridian begins selecting pipelines from a region of the search space not represented in the training distribution, an alert must trigger.
  2.  **Compliance:** Update regulatory filing templates to allow for "Search Space Assumptions" rather than just "Model Parameter Assumptions."

  **Conclusion:**
  We are not approving Meridian because it is assumption-free. We are approving it because it is a more aggressive search mechanism that, *if its assumptions are documented*, offers a quantifiable improvement over the incumbent. We reject the notion that we can operate without assumptions, but we insist that we operate without *secrets* about them.

  ***

  **Approved By:**

  __________________________
  Chair, Model Risk Committee

  __________________________
  Chief Quantitative Officer

  __________________________
  Head of Compliance
