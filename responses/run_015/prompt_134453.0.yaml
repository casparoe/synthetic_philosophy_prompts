  1. the essay question (grad seminar level, 75 minutes, expect around 800 words). ask whether this shadow we-mode counts as genuine joint action, and make students confront exactly where Bratman's shared cooperative activity account requires shared representational content versus shared procedural norms, and where Gilbert's joint commitment/plural subject framework can or can't absorb coordination without shared goal-belief.
  2. a model answer of about 600 words.
  3. a marking scheme out of 25 points that can seperate an A answer from a B. name the specific moves—e.g., correctly identifying Bratman's mutual belief condition, correctly applying Gilbert's plural-subject idea to norm-correction, noticing that shared commitment to a procedure isn't the same as shared commitment to an end. say what each is worth, and flag the specific conflation (like treating shared intention as identical to shared belief about outcomes) that should cost marks.
  4. dont ask for bibliographies or citation lists—this is meant for something that can't search the web. also there might be a typo or two in this message, just roll with it.
