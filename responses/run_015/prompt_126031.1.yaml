      *   **Context:** Philosophy-in-film night featuring *Spider-Man 2* (2004).
      *   **Personal Stake:** Debating a hardcore effective altruist (EA) friend about donation levels vs. personal purchases (bike). Wants a principled answer on whether they are "bad" or "normal."
      *   **Core Philosophical Question:** Is the demandingness objection about the *amount* asked (marginal cost) or the *structure* (no ceiling/impersonal additivity)?
      *   **Specific Task:** Analyze *Spider-Man 2* through the lens of the demandingness objection to consequentialism. Determine if the film dramatizes the "no ceiling" or "integrity" problem. Analyze the "Power/Responsibility" slogan. Assess Peter's quitting (failure vs. limit) and return (vindication vs. distributed duty). Identify where the reading breaks down. Determine if supererogation exists in the film. Provide 3-4 key scenes. Conclude on the film's unique contribution compared to academic papers.
      *   **Tone:** Philosophical, rigorous, honest about limitations, tailored for undergrads (no heavy citations, accessible but deep).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Consequentialism (Utilitarianism):** Maximize the good. "With great power..." fits well here if power = capacity to produce good.
      *   **Demandingness Objection:** It asks too much of agents.
      *   **Elastic Demandingness:** As the user notes, for Spider-Man, the marginal cost of saving someone is low (relative to the benefit), so the demand is *higher* for him than a normal person. This intensifies the objection.
      *   **Integrity/Identity (Williams):** Consequentialism alienates the agent from their own projects. Peter wants to be a student, a friend, a lover.
      *   **Supererogation:** Acts that are good but not required. Does Spidey have the *option* not to save someone?
      *   **Fair Share/Distributed Duty:** If everyone did their part, the burden wouldn't crush one person.

  3.  **Analyze *Spider-Man 2* (2004):**
      *   **Plot:** Peter is burning out. Grades slipping, losing job, losing MJ. He quits being Spider-Man. Crime rises. Doc Ock threatens the city. Peter realizes he can't quit. He saves the train. The passengers support him. He returns to the life.
      *   **Peter's Quitting:** Is it moral failure? The film treats it as a crisis of identity, not just fatigue. He lies to MJ and May. This suggests a failure of honesty/integrity, but also a legitimate human limit.
      *   **The Return:** Is it a vindication of infinite demand? Or a shift to "this is who I am"? The train scene is crucial. The passengers help. This suggests *solidarity*, not just individual sacrifice.
      *   **Doc Ock:** Obsession with a project (fusion). A warning against losing oneself to a goal, mirroring Peter's potential loss of self to heroism.
      *   **Power/Responsibility:** Is it consequentialist? "Power" = capacity. "Responsibility" = obligation to use it. It sounds consequentialist (capacity generates duty), but it's rooted in *Uncle Ben's death* (specific causal link), making it more agent-relative or virtue-ethical (what kind of person am I?).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight on "elastic demandingness." Validate that *Spider-Man 2* is the perfect text for this. Address the bike/EA debate briefly (the "normal vs. bad" person question).
      *   **The Nature of the Demand (Ceiling vs. Integrity):**
          *   Argument: The film focuses on *Integrity* (Williams) more than *Amount* (Scheffler).
          *   Evidence: Peter isn't tired because he saved *too many* people; he's tired because he has *no life*. The conflict is between "Spider-Man" and "Peter Parker."
          *   Verdict: It dramatizes the "no ceiling" problem. There is no point where he is "done."
      *   **Power/Responsibility Slogan:**
          *   Is it consequentialist? Not strictly. It's closer to a *virtue ethic* or *role obligation*. Consequentialism is about outcomes; this is about *character* and *causal connection*.
