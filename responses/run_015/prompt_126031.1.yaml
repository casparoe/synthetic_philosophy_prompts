answer: |-
  This is a fantastic setup. You have correctly identified that *Spider-Man 2* is essentially a two-hour dramatization of the demandingness objection, specifically the "elastic" version you described. Because Peter's marginal cost of saving a cat from a tree is near-zero compared to the utility gained, the consequentialist pressure on him is exponentially higher than on a normal human.

  Here is a reading of the film designed to do work in your debate, structured around your specific philosophical concerns.

  ### 1. The Nature of the Demand: Integrity vs. Ceiling
  You asked whether the film dramatizes the "no ceiling" problem or the "integrity/projects" problem. The film argues they are the same thing.

  In standard philosophical discussions (like Scheffler or Williams), the demandingness objection often focuses on the *amount* of sacrifice (you must give until you are as poor as the recipient). But *Spider-Man 2* focuses on the *colonization of identity*. Peter isn't just tired; he is ceasing to exist as "Peter Parker."

  The film sides with the Integrity Objection. It suggests that a moral theory that requires you to annihilate your personal projects (physics, MJ, employment) is unsustainable, not because the *amount* is too high, but because it destroys the *agent* required to do the good. If Peter burns out completely, he saves no one. Therefore, the film argues that maintaining some "selfish" projects (like a Tuesday off, or a bike) is instrumentally necessary to sustain the capacity to do good.

  **Verdict:** The film validates the "Integrity" complaint over the "Amount" complaint. It suggests you aren't a "bad person" for buying the bike if the bike preserves the mental health required to be a decent moral agent long-term.

  ### 2. Is "With Great Power..." Consequentialist?
  This is the pivot point for your EA friend. "With great power comes great responsibility" sounds consequentialist (Capacity $\rightarrow$ Obligation $\rightarrow$ Maximize Outcome). But the film treats it as **Virtue Ethics** or **Role Obligation**.

  *   **Consequentialist reading:** You must act because the *outcome* (saved lives) outweighs the *cost* (your time).
  *   **Virtue/Role reading:** You must act because *this is who you are*. To refuse is to be vicious or to fail in your specific role.

  The film leans heavily toward the latter. When Peter quits, the city doesn't just get statistically more dangerous; it gets *dark*. The moral weight isn't just in the body count; it's in Peter's betrayal of his own nature.

  **Why this matters for your debate:** If the slogan is virtue-ethical, then "buying a bike" isn't automatically immoral. Virtue ethics allows for *eudaimonia* (flourishing). A virtuous agent needs to flourish to remain virtuous. If the bike keeps you from resenting morality itself, it is permissible. Hard consequentialism doesn't care about your resentment; virtue ethics does.

  ### 3. Quitting and Returning: Failure or Limit?
  The film is ambiguous here, which is where your discussion should live.

  **The Quit:** Peter's quitting is framed as a moral failure *of honesty*, not necessarily of duty. He lies to MJ; he avoids Aunt May. The film suggests the sin isn't stopping the heroism; it's the isolation and deception required to sustain the stop. However, the physical exhaustion validates the "legitimate limit." The film admits the demand *is* too high for one person to bear indefinitely.

  **The Return (The Train Scene):** This is the most philosophically rich moment. When the passengers catch Peter as he collapses, they say, "He can't be the only one carrying the load."
  *   **Consequentialist view:** Peter failed. He stopped. He had to be coerced by guilt to return.
  *   **Distributed Duty view:** The passengers realize *they* have a duty too. They catch the ropes; they shield Peter.

  This shifts the framework from **Individual Demandingness** to **Collective Responsibility**. The film solves the demandingness objection not by lowering the demand, but by distributing it. Peter returns not because he must do *everything*, but because he must do *his part* while inspiring others to do theirs.

  **Verdict:** The return is a vindication of *distributed* duty, not open-ended individual martyrdom.

  ### 4. Is Anything Supererogatory?
  **No.** This is the hardest pill for the audience to swallow, and where the film is most radical.

  In most superhero movies, saving the day is supererogatory (above and beyond the call). In *Spider-Man 2*, once you have the power, it is **mandatory**. When Peter regains his powers after the car crush scene, he doesn't celebrate; he resigns himself. "I know what I have to do."

  The film eliminates the supererogatory for the powered agent. If you can save someone at low cost to yourself, you *must*. This supports your EA friend's view on the *principle*, but the film adds the caveat that if the cost threatens the agent's existence (burnout), the system breaks.

  ### 5. Where the Reading Breaks Down (Honesty Check)
  You asked for honesty on the limitations. Here is where the philosophy cracks under the genre:

  1.  **The Stakes are Rigged:** Peter faces nuclear fusion meltdowns and trains full of children. In the real world, your marginal utility is rarely that high or that visible. The "elastic demandingness" is exaggerated. In reality, your bike purchase doesn't directly cause a specific death in the way Peter's absence allows Doc Ock to thrive.
  2.  **Doc Ock is a Red Herring:** Doc Ock represents *obsession with a project*, not moral demandingness. He loses his humanity to his science. Peter risks losing his humanity to *altruism*. The film treats these as parallel tragedies, but they aren't morally equivalent. Obsession with science is arguably a vice; obsession with saving lives is arguably a virtue. Conflating them protects the audience from the harder question: "Is saving lives actually bad for you?"
  3.  **Genre Necessity:** Peter *cannot* quit. Not because it's immoral, but because there would be no movie. The film cannot genuinely explore the "life without heroism" option because the narrative requires the hero.

  ### 6. Four Scenes for Discussion
  Use these to anchor the night. They map directly to the philosophical beats.

  **1. The Pizza Delivery (Elastic Demandingness)**
  *   *Context:* Peter is late delivering pizza because he stopped a crime. The customer tips him poorly; he gets fired.
  *   *The Point:* This is the marginal cost calculation. Peter saved a life (high utility) but lost his job (high personal cost). A consequentialist says he did the right thing. The film shows the *social* cost of that calculation.
  *   *Discussion:* Does the customer have a duty to recognize the sacrifice? If the world doesn't support the moral agent, is the agent still bound to the duty?

  **2. The Restaurant with MJ (Integrity/Projects)**
  *   *Context:* Peter tries to have a date but keeps getting distracted by potential crimes. He eventually leaves her.
  *   *The Point:* This is the Williams Integrity Objection. Peter cannot engage in a personal project (love) because the moral demand interrupts it constantly.
  *   *Discussion:* Is a life without personal projects worth saving? If morality requires you to be unable to love, is it a valid morality?

  **3. The Train Sequence (Distributed Duty)**
  *   *Context:* Peter holds the train, fails, and the passengers catch him and the ropes.
  *   *The Point:* The passengers say, "He's just a kid. He's no older than my son." They realize the burden is shared.
  *   *Discussion:* Does this solve the demandingness objection? If we all do our "fair share," does the demand become reasonable? Or does it just spread the unreasonable demand to more people?

  **4. Aunt May's Speech at the End (Virtue/Identity)**
  *   *Context:* May talks about heroes being more than just strength; it's about who you are inside.
  *   *The Point:* She reframes the duty. It's not about the *act* (consequentialism); it's about the *character* (virtue).
  *   *Discussion:* Does this let Peter off the hook? If being a hero is about character, can he be a hero while riding his bike and studying physics?

  ### 7. What the Film Adds That Papers Don't
  Academic papers on demandingness (like Singer's "Famine, Affluence, and Morality" or Williams' "A Critique of Utilitarianism") deal in abstractions. They talk about "agents" and "utility."

  *Spider-Man 2* contributes **phenomenology**. It shows what the demand *feels like*.
  1.  **Resentment:** It shows that high-demand morality breeds resentment (toward MJ, toward the city, toward the duty). Papers often ignore that moral agents have emotional limits.
  2.  **The Cost of Maintenance:** It highlights that moral action requires a support structure (Aunt May, the passengers). You cannot be a moral saint in a vacuum.
  3.  **The "Normal" Person:** The passengers on the train represent the "normal" moral standard. They aren't superheroes, but they step up. This suggests a **two-tier morality**: extraordinary capacity creates extraordinary duty, but ordinary capacity creates ordinary duty.

  **Final Word for Your Debate:**
  Tell your EA friend: *Spider-Man 2* agrees with them that capacity creates duty. But it argues that duty is unsustainable without a support structure and without preserving the self. Buying the bike isn't a rejection of duty; it's maintenance of the agent. The film suggests that a morality that demands you destroy your life is a morality that will eventually fail to save anyone. You aren't a bad person for buying the bike; you're ensuring you don't end up collapsed on a train track needing strangers to catch you.
