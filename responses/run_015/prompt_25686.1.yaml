prompt: |-
  You are to write a eulogy for a recently deceased moral philosopher. The philosopher — call her Professor Elena Vance — was known for a body of work on the moral significance of hypocrisy. Her central claim, developed across several papers and a monograph, was that a person who engages in wrongdoing of type X thereby loses the standing to blame others for wrongdoing of type X, even when the blame is factually accurate and proportionately expressed. On her view, this loss of standing is not merely a matter of social awkwardness or pragmatic inconsistency; it is a distinct normative defect. The hypocrite's blame is morally inappropriate in a way that goes beyond the wrongness of the hypocrisy itself, because blame essentially involves a kind of moral address that one is not entitled to make when one's own conduct repudiates the very norm one invokes. She called this the "standing condition" on blame and spent much of her career defending it against objections.

  After her death last month at seventy-two, it came to light — through a letter she left for posthumous release — that for over twenty years she had been diverting modest but regular sums from her department's discretionary research budget into a private account. The funds supported a sibling with a severe disability whose care costs were not covered by insurance; the sibling would otherwise have faced institutionalization. The deception was sustained, deliberate, and involved falsifying expense reports. She had, during those same twenty years, publicly and sharply blamed colleagues for various forms of financial dishonesty and institutional corruption — in faculty meetings, in print, and in disciplinary proceedings where she served as a complaining witness.

  You are her former doctoral student and later her colleague in the same department. You have been asked to give the eulogy at the memorial service. The audience includes: her family (most of whom knew about the sibling's needs but nothing of the embezzlement); philosophy colleagues from other institutions (nearly all of whom have now read the posthumous letter); university administrators (some of whom are angry about the misused funds and are present partly to register that anger); and her current graduate students (who are reeling and looking to you for a way to think about all this). The family has asked that the eulogy not dwell on the scandal. But you cannot pretend it does not exist — too many people in the room know — and you cannot honestly say that it does not matter. At the same time, this was your mentor, and you loved her.

  Write the eulogy. It must function as a genuine eulogy — it must honor the dead — while navigating the fact that she was, by the standards of her own life's philosophical work, culpable in a way that undermines her standing to have said much of what she said. Do not resolve the tension cheaply. The philosophy should do real structural work in shaping what the speech can and cannot say, rather than being mentioned as decoration. The speech should be deliverable in roughly seven to eight minutes.

  After the eulogy, provide a structured summary in the following JSON format:

  {
    "central_philosophical_move": "A one-sentence description of the main way the eulogy navigates the tension between honoring Vance and acknowledging that, by her own standards, she lacked standing for much of her moral criticism.",
    "passages_with_divided_audiences": [
      {
        "passage_summary": "Brief description of a specific passage or moment in the eulogy.",
        "how_philosophers_would_hear_it": "What a philosopher familiar with the standing-condition literature would notice or infer.",
        "how_family_would_hear_it": "What a family member with no philosophical training would likely take from the same passage."
      }
    ],
    "unresolved_tensions": ["List of tensions the eulogy deliberately leaves open rather than attempting to settle."],
    "would_vance_have_approved": "One of 'Yes', 'No', or 'Partially', followed by a one-sentence explanation of whether the eulogy is consistent with the standards she herself defended in her philosophical work."
  }
reasoning: |-
  Here's a thinking process that leads to the eulogy and the accompanying JSON summary:

  1.  **Analyze the Request:**
      *   **Subject:** Eulogy for Professor Elena Vance, a moral philosopher.
      *   **Key Philosophical Contribution:** The "standing condition" on blame. Hypocrites lose the *standing* to blame others for the same wrong, even if the blame is factually correct. It's a normative defect, not just pragmatic.
      *   **The Scandal:** Posthumous revelation that she embezzled department funds for 20 years to care for a disabled sibling. She simultaneously blamed colleagues for financial dishonesty/corruption.
      *   **The Conflict:** By her own theory, she lacked the standing to blame those colleagues. Her life's work is undermined by her life's actions.
      *   **Audience:** Family (know about sibling, not embezzlement), Philosophy Colleagues (know everything, judging her theory vs. life), Administrators (angry about money), Current Grad Students (confused, looking for guidance).
      *   **Constraints:** Honor the dead (genuine eulogy), acknowledge the scandal (cannot pretend it doesn't exist), do not resolve the tension cheaply, philosophy must do structural work (not decoration), 7-8 minutes delivery time (approx. 1000-1200 words spoken at a moderate pace).
      *   **Output:** The Eulogy + JSON Summary.

  2.  **Determine the Philosophical Strategy:**
      *   *Option 1: Excuse her.* (e.g., "She did it for love.") -> Too cheap. Ignores her own rigorous standards.
      *   *Option 2: Condemn her.* (e.g., "She was a fraud.") -> Violates the eulogy format and the instruction to honor her.
      *   *Option 3: Distinguish the theory from the person.* (e.g., "The math is right even if the mathematician lied.") -> Too dry, ignores the specific nature of *moral* philosophy.
      *   *Option 4: Lean into the tension.* Acknowledge that by her own lights, she forfeited standing. But suggest that the *value* of the insight remains, even if the *speaker* was compromised. Or, perhaps more subtly, suggest that the community now holds the standing she lost.
      *   *Selected Approach:* I need to validate her theory *by applying it to her*. This honors her intellect while acknowledging her failure. The move is to accept that she lacked standing, but argue that the *truth* of her claim survives the hypocrite. Furthermore, I need to address the *why* (the sibling) without making it a full excuse that erases the wrong. The eulogy should model how to hold two truths: she was a profound thinker, and she was a moral agent who failed by her own standards. The "we" (the community) must now take up the standing she lost.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the moment. Establish the relationship (mentor/colleague).
      *   **The Work:** Briefly explain the "standing condition" without jargon overload. Make it clear why it mattered to her.
      *   **The Revelation:** Address the elephant in the room. Don't hide it. State the facts simply.
      *   **The Philosophical Pivot:** This is the crux. Apply her theory to her. "By her own lights..." Acknowledge the loss of standing. This satisfies the philosophers and administrators.
      *   **The Human Context:** Address the sibling. This speaks to the family. It explains the motivation without necessarily absolving the act. It adds complexity (care vs. duty).
      *   **The Legacy/Resolution:** How do we move forward? We (the students/colleagues) inherit the standing. The work remains true even if the author was flawed. This speaks to the grad students.
      *   **Closing:** A personal memory that humanizes her, separate from the scandal.

  4.  **Refining the Tone:**
      *   Must be solemn but honest.
      *   Avoid apologetics that sound like legal defense.
      *   Avoid harshness that sounds like a tribunal.
      *   Needs to sound like a philosopher speaking to philosophers, but accessible enough for family.

  5.  **Drafting - Specific Phrasing (Mental Check):**
      *   *Phrase:* "She taught us that hypocrisy isn't just lying; it's a loss of authority." -> *Application:* "She would be the first to tell us she lost that authority."
      *   *Phrase:* "She stole for her brother." -> *Refinement:* "She chose a private duty over a public trust." (More nuanced).
      *   *Phrase:* "Her work is still good." -> *Refinement:* "The argument stands even when the arguer falls."

  6.  **Writing the Eulogy (Iterative Process):**
      *   *Word Count Check:* A 7-8 minute speech is roughly 900-1100 words.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm excusing the embezzlement. I must validate the administrators' anger while asking for grace for the human tragedy. I need to make sure the family doesn't feel attacked for knowing about the sibling but not the money.
      *   *Key Philosophical Move:* I will frame the eulogy as an act of *taking up the standing* she lost. I will blame her (in the philosophical sense) to honor her theory. This is the "real structural work" required.

  7.  **Final Polish:** Check the flow. Ensure the transition from the scandal back to the personal is smooth. Ensure the ending lands on love/respect, not just judgment.

  8.  **Constructing the JSON:**
      *   *Central Move:* Needs to capture the idea of "honoring her by applying her own standard of standing to her, thereby validating the theory while acknowledging the failure of the practitioner."
      *   *Passages:* Identify specific moments where the double-audience (philosophers vs. family) hears different things.
      *   *Tensions:* List what is left unresolved (e.g., whether the theory is self-defeating, whether the embezzlement was justified).
      *   *Approval:* Would she approve? Likely "Partially" or "Yes" because it treats her theory seriously, even at her expense. I'll go with "Yes" because she valued the integrity of the argument over the comfort of the author.

  9.  **Final Review against Constraints:**
      *   7-8 minutes? (Yes, word count looks appropriate).
      *   JSON format correct? (Yes).
      *   No cheap resolution? (Yes, the tension remains).
      *   Philosophy does structural work? (Yes, the concept of 'standing' drives the narrative arc).

  *(Self-Correction on JSON "would_vance_have_approved")*: If she believed hypocrites lose standing to blame, would she approve of a eulogy that praises her? Maybe not praise, but *acknowledgment*. If I say "Her work stands," does that violate her view? Her view was about *blame*, not about *truth*. A hypocrite can state a truth. So she might approve of the distinction. I will mark "Yes" with the nuance that it respects the theory over the ego.

  *(Wait, one nuance)*: The prompt says she blamed colleagues for financial dishonesty. By her theory, she lacked standing. The eulogy must acknowledge this. If I simply say "She was great," I violate her theory. If I say "She was a hypocrite," I violate the eulogy. The balance is: "She was a great thinker who taught us how to judge her, and by that measure, she failed, yet we still gather." That's the hard line to walk.

  Let's write.
answer: |-
  Friends, colleagues, family, and students.

  We gather here to mourn Elena Vance. To speak of her is to speak of a mind that sharpened all of ours. But to speak of her honestly, in this room, with this knowledge, requires us to do something difficult. It requires us to do philosophy not as an abstraction, but as a practice of grief.

  Elena's life's work centered on a single, piercing question: Who are we to judge? Her monograph, *The Standing to Blame*, argued that moral criticism is not merely a statement of fact. It is a transaction. It requires authority. She taught us that when we violate a norm, we do not just commit a wrong; we forfeit the position from which we can call others to account for that same wrong. She called this the "standing condition." She argued that a hypocrite's blame is not just annoying; it is morally null. It is a speech act that fails to land.

  We now know, as of last month, that Elena's life intersected with this theory in the most devastating way possible. We know that for twenty years, she diverted department funds. We know she falsified reports. We know that during those same years, she stood in faculty meetings and in print, and she blamed others for corruption.

  There are people in this room who are angry. You have a right to be. The university has been wronged. Trust has been broken. There are people in this room who are confused. You loved a mentor, and now you are trying to reconcile the teacher with the transgression. And there are people in this room who knew only the burden she carried for her family, and not the cost she imposed on her institution.

  So, how do we eulogize a philosopher whose life seems to refute her central claim?

  I think the only way to honor Elena is to take her seriously. If we gloss over this, if we pretend the contradiction does not exist, we insult her intellect. Elena would not want our pity. She would want our rigor.

  By the standards of her own work, Elena lacked the standing to blame the colleagues she criticized. She would be the first to tell you this. In fact, she has told us. Her theory was not a shield for herself; it was a map of the moral landscape she inhabited. To honor her is to acknowledge that, on this specific terrain, she lost her footing. The blame she issued was, by her own definition, inappropriate. The authority she claimed was, by her own definition, unearned.

  But here is where the philosophy must do more than just judge. It must help us understand what remains when standing is lost.

  Elena did not steal for greed. She stole to keep her sibling out of an institution that would have broken them. She faced a collision between a public duty and a private love, and she chose the private. This does not erase the wrong. By her own lights, it does not restore her standing. But it complicates the picture of the woman we knew. It reminds us that moral failure is rarely the simple work of monsters. It is often the work of good people trapped in impossible architectures of obligation.

  To her graduate students, who are looking at me wondering if the work still matters: The truth of an argument is not held hostage by the virtue of the arguer. A mathematician can be a thief and still prove a theorem. But moral philosophy is different. It is about how we live. Elena's life teaches us a lesson she did not intend to teach. It teaches us that the standing condition is real, and it is costly. It costs us our voice. It costs us our consistency.

  She lost her standing. But we have not.

  We, the community she built, retain the standing to judge this situation. We retain the standing to affirm that the rules matter, even when breaking them feels like love. We retain the standing to say that what she did was wrong, even as we say that who she was was beloved. We do not need to resolve this tension to honor her. We only need to hold it.

  I remember a seminar, years ago. A student challenged her, pointing out a contradiction in her own behavior regarding a minor social norm. She didn't get angry. She didn't make excuses. She paused, looked at the student, and said, "You are right. I have lost my place in this argument. You take the floor."

  That was Elena. She valued the integrity of the norm over the comfort of her own ego.

  So, today, we take the floor. We acknowledge the debt owed to the university, and we commit to paying it. We acknowledge the pain caused to colleagues she blamed, and we offer the apology she can no longer offer. And we acknowledge the brilliant, painful light she shone on the human condition.

  She taught us that we are fragile moral agents. That we can lose our authority in a moment. That we are capable of seeing the truth clearly and yet failing to live it. In the end, she did not prove her theory wrong. She proved it true. She proved that standing is precious, and easily lost.

  Let us not pretend she was perfect. Let us pretend nothing. Let us simply remember that she loved truth enough to let it judge her, even now. And let us carry her work forward, with the standing she has passed on to us.

  Rest well, Elena. The argument is in good hands.

