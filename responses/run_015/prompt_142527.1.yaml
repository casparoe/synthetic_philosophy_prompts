answer: |-
  Here is a decision tool designed for your reading group. It avoids abstract jargon where possible, embeds the necessary historical facts into the questions, and maps the logical space before assigning the labels.

  ### Part 1: The Six Questions
  *Instructions for the group: For each scenario, choose the option (A or B) that best matches your intuition about how history works. There are no trick answers.*

  **Q1. The Black Death (1347–1351)**
  *Fact:* The plague killed 30–50% of Europe. Labour became scarce. In England, serfdom collapsed and wages rose. In Eastern Europe (e.g., Poland), serfdom was tightened and wages fell. The economic shock (labour shortage) was the same.
  *   **A:** The difference must be explained by pre-existing **class power**. English lords were weaker/different than Polish lords, so they couldn't enforce the same rules. (Class relations drive the outcome).
  *   **B:** The difference is about the **stage of development**. England was further along an economic timeline than Poland. Given enough time, Poland would have ended up like England anyway. (Productive forces drive the outcome).

  **Q2. The Law of Property**
  *Fact:* In many places, laws abolishing serfdom appeared *before* large-scale capitalist farming took off, not after.
  *   **A:** The law **constitutes** the economy. You cannot have "capitalist property" without a legal statute defining it first. The court creates the economic category.
  *   **B:** The law **stabilises** the economy. The economic change was already happening underground; the law just caught up to legitimise and protect what already existed.

  **Q3. The Protestant Ethic**
  *Fact:* In the 16th/17th centuries, Calvinist regions often saw faster commercial growth than Catholic ones.
  *   **A:** Religious belief was an **independent cause**. People worked harder because they were genuinely afraid of hell, not because it made them money. Ideas change the economy.
  *   **B:** Religious belief was a **symptom**. The theology changed because a rising merchant class needed a religion that justified their behaviour. The economy changes ideas.

  **Q4. The Two Islands (Hypothetical)**
  *Fact:* Imagine two islands with identical soil, technology, and population. Island X inherits land through the eldest son only. Island Y divides land among all children.
  *   **A:** After 100 years, their economies will **diverge**. Island X will have large estates and landless labourers; Island Y will have smallholdings. Custom drives economic structure.
  *   **B:** After 100 years, their economies will **converge**. Market competition will force Island Y to consolidate land anyway to be efficient. Economics overrides custom.

  **Q5. Adopting New Technology**
  *Fact:* A factory owner can buy a machine that produces twice as much goods but requires half the workers.
  *   **A:** They adopt it because it increases **total productivity**. It helps society produce more wealth. (Forces of Production primacy).
  *   **B:** They adopt it because it increases **control/profit**. It weakens the workers' bargaining power even if total output doesn't rise much. (Relations of Production primacy).

  **Q6. "In The Last Instance"**
  *Fact:* Engels said the economy determines everything "in the last instance," but admitted the "last instance" might never actually arrive in real time.
  *   **A:** This is a **useful limit**. It means ideas have freedom to move, but they can't break the laws of physics or resource scarcity forever.
  *   **B:** This is an **empty slogan**. If the "last instance" never arrives, then for all practical purposes, politics and ideas are causing things right now. It saves the theory from being falsified.

  ---

  ### Part 2: The Logical Space (The Axes)
  Before we assign the labels, here are the four underlying philosophical splits your answers reveal. You don't need to tell the group this, but you need it to score them.

  1.  **The Engine of History:** Is it *Technology/Efficiency* (Forces) or *Class Power/Property* (Relations)?
      *   *Measured by Q1 and Q5.*
  2.  **The Role of Superstructure:** Is Law/Ideology *Reflective* (mirrors economy) or *Constitutive* (makes economy possible)?
      *   *Measured by Q2.*
  3.  **The Autonomy of Ideas:** Are Ideas *Dependent* (caused by economy) or *Independent* (cause economy)?
      *   *Measured by Q3 and Q4.*
  4.  **The Determinism Hedge:** Is "Last Instance" a *Real Constraint* or a *Theoretical Rescue*?
      *   *Measured by Q6.*

  ---

  ### Part 3: Mapping the Positions (The Leaves)
  Here is where the combinations land. I have mapped the six positions you requested onto the answer keys.

  #### 1. Productive-Forces Primacy (Analytical Marxism / G.A. Cohen)
  *   **Logic:** Technology drives history. Relations of production exist *because* they help technology grow.
  *   **Answer Key:** Q1(B), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A).
  *   **Status:** **Occupied.** A rigorous, defensible position, though often accused of being too functionalist.

  #### 2. Class-Struggle / Property-Relations First (Political Marxism / Brenner & Wood)
  *   **Logic:** Class power determines what technology gets used. The Black Death divergence is the smoking gun. Law isn't just a reflection; property rules *are* the economy.
  *   **Answer Key:** Q1(A), Q2(A), Q3(B), Q4(A), Q5(B), Q6(A).
  *   **Status:** **Occupied.** This is the strongest rival to Orthodox Marxism today.

  #### 3. Plain Base/Superstructure (Orthodox / Second International)
  *   **Logic:** Economy is the hard core. Ideas are mostly smoke. If things look complex, wait for the "last instance."
  *   **Answer Key:** Q1(B), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A).
  *   **Note:** *Wait, this looks identical to Forces Primacy (Cohen).*
  *   **Distinction:** Cohen is philosophical/functionalist ("Relations exist *because* they develop Forces"). Orthodox is often more mechanical ("Forces grow, then Relations snap into place").
  *   **Status:** **Indistinguishable Leaf.** *See Part 5.*

  #### 4. Overdetermination (Structuralist / Althusser)
  *   **Logic:** Everything affects everything. The economy is dominant, but only structurally. The "last instance" is a way to admit we can't actually predict anything specific.
  *   **Answer Key:** Q1(A or B), Q2(A), Q3(B), Q4(A), Q5(B), Q6(B).
  *   **Status:** **Occupied.** Distinctive mainly by its rejection of simple causality (Q6-B).

  #### 5. Hegemony / Common Sense (Gramscian)
  *   **Logic:** Ideas are "material forces" when they grip the masses. The superstructure isn't just a mirror; it's the terrain where class rule is won or lost.
  *   **Answer Key:** Q1(A), Q2(A), Q3(A/B hybrid), Q4(A), Q5(B), Q6(B).
  *   **Status:** **Occupied.** Very close to Political Marxism on Q1/Q2, but distinct on Q3 (Ideas have real weight).

  #### 6. Pluralist / "You're Overfitting" (Weberian / Liberal)
  *   **Logic:** Marxism is too complex. Ideas and Economy are equal partners. Stop trying to reduce one to the other.
  *   **Answer Key:** Q1(A), Q2(A), Q3(A), Q4(A), Q5(B), Q6(B).
  *   **Status:** **Occupied.** The exit ramp for people who think the whole Base/Superstructure model is broken.

  ---

  ### Part 4: Empty or Incoherent Boxes
  You asked to flag combinations that nobody holds.

  *   **The "Magic Economy" Box:** Q1(B) [Forces drive history] + Q2(A) [Law constitutes economy].
      *   *Verdict:* **Incoherent.** If technology automatically drives history (B), then law is usually seen as a lagging indicator (B). If law *constitutes* the economy (A), then human decisions/politics matter more than automatic tech growth. Holding both is logically unstable.
  *   **The "Determinist Pluralist" Box:** Q3(A) [Ideas cause economy] + Q4(B) [Economy overrides custom].
      *   *Verdict:* **Unattractive.** If ideas can cause economic change (A), why would economic efficiency inevitably wipe out custom (B)? This position claims ideas matter, but only until the economy says stop. Few people argue this consistently.
  *   **The "Last Instance" Trap:** Q6(B) [Slogan] + Q1(B) [Forces drive history].
      *   *Verdict:* **Unoccupied.** If you believe the "last instance" is a fake hedge (B), you usually abandon the idea that Forces automatically drive history (B), because that requires a deterministic guarantee. This combination is theoretically possible but rarely defended.

  ---

  ### Part 5: Indistinguishable Leaves
  You asked me to flag if the tree can't tell two positions apart.

  *   **Forces Primacy (Cohen) vs. Plain Orthodox:**
      *   *Problem:* On a quiz of concrete cases, these two answer almost identically. They both believe the economy wins in the end and ideas are secondary.
      *   *Distinction:* The difference is philosophical (functional explanation vs. mechanical causation), not empirical.
      *   *Advice:* Tell your group that if they land here, they are "Economic Determinists." Whether they are Cohen-style or Orthodox is a seminar topic for later.

  *   **Political Marxism (Brenner) vs. Gramscian:**
      *   *Problem:* Both agree that Class Power (Q1) and Constitutive Law (Q2) are key.
      *   *Distinction:* Gramscians put more weight on *culture/consent* (Q3), Brennerites on *coercion/property rules*.
      *   *Advice:* If someone scores high on Q1(A) and Q2(A), look at Q3. If they think religion is independent (A), lean Gramsci. If they think it's a symptom (B), lean Brenner.

  ---

  ### Part 6: Scoring Key & The "Worst Split"

  **How to Score:**
  Don't sum the numbers. Look for the **Cluster**.
  *   **Mostly B on Q1, Q4, Q5:** You are a **Determinist** (Forces Primacy or Orthodox).
  *   **Mostly A on Q1, Q2, Q5:** You are a **Political Marxist** (Class Power First).
  *   **A on Q3 and Q6:** You are leaning **Pluralist or Gramscian** (Ideas have autonomy).
  *   **B on Q6:** You are likely **Althusserian or Pluralist** (Rejecting the "Last Instance" hedge).

  **The "Worst Split" Question:**
  **Q6 ("In The Last Instance").**
  *   *Why:* This is the question that separates the Marxists from the Post-Marxists/Pluralists.
  *   *The Fight:* Your mate will argue that Q6(B) makes the theory unfalsifiable (as he said in your argument). You will argue Q6(A) is necessary to avoid saying *everything* is economic reductionism.
  *   *Prediction:* This is where your reading group will fracture. Half will say "If it never arrives, it's magic," and half will say "It's a boundary condition, like friction in physics."

  **How to Run It:**
  1.  Hand out the 6 questions.
  2.  Have them vote A or B on each (show of hands).
  3.  Plot the results on the board.
  4.  Reveal the "Leaves" only *after* they see where they cluster.
  5.  Spend the rest of the time arguing about Q6.
