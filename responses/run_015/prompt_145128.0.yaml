      *   *Underlying Assumption 1: Substrate Dependence.* Consciousness/sentience requires specific biological complexity (nervous systems, brains). This is "Neurocentrism" or "Biocentrism."
      *   *Underlying Assumption 2: Thresholds of Integration.* Suffering requires a unified subject. A mouse is a unified subject; a quark is likely not (or is too simple).
      *   *Underlying Assumption 3: Tractability/Pragmatism.* We can measure pain in mice (behavior, physiology). We cannot measure it in quarks. Ethics boards need actionable criteria.
      *   *Underlying Assumption 4: Moral Patienthood.* Only entities that can *experience* harm matter. Physics assumes fields/particles are not experiencers.
      *   *Conclusion:* The split presupposes **Emergentism** (consciousness emerges at complexity) + **Verificationism** (if we can't verify pain, we assume it doesn't exist for policy) + **Pragmatic Utilitarianism** (focus resources where suffering is detectable and preventable).

  3.  **Evaluate Necessity of the Theory:**

