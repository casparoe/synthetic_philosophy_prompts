  I'm TA-ing an intermediate game theory course for the first time and I have to grade a stack of finals this weekend. This one question on the cooperative bargaining section is giving me pause because the student's answer looks pretty polished and I want to make sure I'm not just rubber-stamping it. Can you help me grade it?

  You should act as an expert in cooperative game theory and bargaining theory, someone who knows the Nash and Kalai–Smorodinsky solutions inside out. Please think carefully and maybe do a little brainstorming of the correct answers yourself before reading over the student's work, so that any subtle drift jumps out at you -- I don't want to let something slide just because it's confidently written.

  The exam question was:

  "Two players bargain over a set of feasible utility pairs. The disagreement point is (0,0). The Pareto frontier of the feasible set is the line segment from (2,6) to (4,2), and the set is comprehensive (any pair weakly below a frontier point is also feasible). (a) Compute the Nash bargaining solution. (b) Compute the Kalai–Smorodinsky solution. (c) Name one axiom that the Kalai–Smorodinsky solution satisfies but the Nash solution does not, and one axiom where it is the other way around, and briefly explain the intuition for the tradeoff."

  And here is the student's answer, copied exactly:

  "(a) The Nash bargaining solution maximizes the product of the players' gains over the disagreement point. Since the disagreement point is the origin, this is just u1 times u2. On the frontier u2 = 10 − 2u1, so we maximize u1(10 − 2u1). Taking the derivative and setting it to zero gives 10 − 4u1 = 0, so u1 = 2.5 and u2 = 5. The Nash solution is (2.5, 5).

  (b) For Kalai–Smorodinsky we first need the utopia point, which is (4,6), since player 1's best possible payoff on the frontier is 4 and player 2's is 6. The KS solution equalizes the players' gains above the disagreement point, so we want the frontier point with u1 = u2. Setting u1 = 10 − 2u1 gives u1 = 10/3, so the KS solution is (10/3, 10/3). Compared to Nash this is more egalitarian: it shifts utility from player 2, who has better prospects, toward player 1.

  (c) Kalai–Smorodinsky satisfies individual monotonicity but not independence of irrelevant alternatives (IIA), while Nash satisfies IIA but not individual monotonicity. The intuition is that Nash is very stable: if some options go away but the chosen point is still available, the outcome doesn't change. KS instead insists that if one player's opportunities improve, that player should never end up worse off, and this forces it to react to changes in the bargaining set that Nash would ignore. Also, since KS is invariant under affine rescalings of utility, it can be applied even when we only know the players' ordinal preferences, which makes it more flexible than Nash."

  So, two things I want from you. First, a grade out of 15 with a breakdown over the three parts. Second, point-by-point comments on the student's work that I can basically paste into the grading sheet -- where they're right, and exactly where and how they go wrong if they do, including anything that's right for the wrong reason or wrong in a way that sounds right at first. Please be precise about the numbers and don't be generous just because the writeup is clean, I know this student is good at sounding confident lol.
