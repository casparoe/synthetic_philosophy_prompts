  Hey — I host a small, kind of ramshackle philosophy podcast, and next week I'm interviewing Dr. Nadia Okonkwo about her new paper on Frankfurt-style cases (Black is lurking, ready to make Jones do the thing if Jones shows any sign of wavering, and in the end never has to). I've read it twice and I still dont have a handle on how to push back on her.

  Her thesis: these cases aren't counterexamples to the principle of alternative possibilities (PAP — you're morally responsible only if you could have done otherwise). She says every such case sits in one of three boxes. Either the device waits for a sign, in which case the agent keeps some thin power to do something else, even if it's too meager to ground responsibility; or the device monitors the brain continuously and causally guarantees the outcome, which she calls determinism in a lab coat, useless against incompatibilists; or it doesn't really guarantee anything, so the agent had real alternatives and PAP was never in danger. Then she goes further: the same three boxes, she claims, face any actual-sequence view, because those views owe an account of when a causal history is really the agent's own.

  Give me eight or so questions, each with a follow-up keyed to what she'd most likely fire back. I want at least one pressing her on why the thin flicker in box one isn't enough for compatibilists to just declare victory; one on whether "determinism in a lab coat" is fair, given that most people using these cases already think determinism is no threat to responsibility; one on what a box-three case — guaranteed outcome, no determinism — would even look like; one on praise rather than blame; and one on what would count as evidence against the trilemma. Assume she knows the literature cold: no softballs. And commit to a single line of questioning rather than a menu of options — tell me which question you'd open with and why, and defend the choices. American English, please.
