answer: |-
  ### The Non-Human Causality Procedure (NHCP)

  **Purpose:** To evaluate pitches where a non-human factor (climate, pathogen, geology) is claimed to drive a historical turning point.
  **Time Budget:** 20 Minutes.
  **Operator:** Producer (no scientific training required).
  **Inputs:** Searchable summaries (encyclopedias, standard historiography, climate databases).

  #### The Verdicts
  1.  **Protagonist:** The non-human force determined the outcome; human agency was overwhelmed or irrelevant. (Rare).
  2.  **Trigger:** The non-human force initiated the chain of events, but human institutions/choices determined the magnitude and direction of the outcome. (The "Turning Point" sweet spot).
  3.  **Backdrop:** The non-human force was present but constant, or the outcome tracks human variables rather than the physical gradient.
  4.  **Not Established:** The causal link is speculative, the mechanism is missing, or the timeline does not align.

  #### The Procedure Steps

  **Step 1: The Mechanism Test (Stop Rule)**
  *   **Question:** Can you name the specific chain of transmission from the physical event to the human decision/outcome? (e.g., Ash -> Cooling -> Crop Failure -> Price Spike -> Riot).
  *   **Sufficient Answer:** A 3-link chain where the middle link is material (harvest, health, trade route) and the final link is human (policy, migration, revolt).
  *   **If Unanswered:** **VERDICT: Not Established.** Stop Procedure. Narration must use coincidence language ("occurred around the same time," "amidst").
  *   **Common Error:** Confusing correlation with mechanism ("The volcano erupted, then the empire fell" without explaining *how* the volcano touched the empire).

  **Step 2: The Latency Check**
  *   **Question:** Does the onset of the human event fall within the physical window of the shock's impact?
  *   **Sufficient Answer:** The human event begins within 1-3 years of the physical shock (for acute events) or tracks the specific movement of a slow variable (for climate shifts).
  *   **If Unanswered:** **VERDICT: Backdrop.** Proceed to Step 3 only to confirm.
  *   **Common Error:** Ignoring lag time. A harvest failure causes unrest in months, not six years later, unless stored grain or policy bridges the gap (which makes it human agency).

  **Step 3: The Differential Signature Test (Handoff Point)**
  *   **Question:** Did regions experiencing the *same* physical shock have *different* human outcomes based on their institutions?
  *   **Sufficient Answer:** Evidence that Region A suffered the shock but avoided the crisis (due to storage, trade, governance) while Region B collapsed.
  *   **If Answered (Yes):** **HANDOFF TO EDITOR.** Evidence suggests human institutions are the Protagonist; the physical event is a Trigger or Backdrop. Editor decides emphasis.
  *   **If Answered (No):** Proceed to Step 4. (If everyone suffered equally regardless of institutions, the non-human force is stronger).
  *   **Common Error:** Cherry-picking the affected region and ignoring unaffected neighbors.

  **Step 4: The Alibi Test**
  *   **Question:** Are we repeating a contemporary actor's excuse? (e.g., A general blaming rain for a loss, a king blaming harvest for tax default).
  *   **Sufficient Answer:** Independent evidence contradicts the contemporary excuse (e.g., records show grain was exported during the "famine").
  *   **If Answered (Yes, it is an excuse):** **VERDICT: Backdrop.** The physical event was used to mask human failure.
  *   **If Unanswered:** Proceed to Step 5.

  **Step 5: The Counterfactual/Slow Variable Rule**
  *   **Question:** If the physical event had not occurred, would the human event still have happened due to existing tensions? OR, if this is a slow variable (e.g., desertification), did it demonstrably *change* at the claimed time?
  *   **Sufficient Answer:** Historians agree the tension was critical *before* the shock, OR the environmental data shows stability during the claimed crisis window.
  *   **If Answered (Yes, tensions existed/variable stable):** **VERDICT: Trigger.** (The shock lit the fuse, but the powder was human).
  *   **If Answered (No, stability existed until shock):** **VERDICT: Protagonist.**

  ---

  ### Meta-Analysis: Distortions and Simplifications

  To make this runnable in 20 minutes by a non-expert, I have distorted three scholarly concepts:

  1.  **Probabilistic Causation:** Historians and scientists often speak in probabilities ("increased the likelihood"). This procedure forces a binary (Mechanism Exists/Does Not Exist).
      *   *Mislead:* It may reject valid pitches where the science is "likely but not certain" because the producer cannot find a definitive 3-link chain.
  2.  **Structural Violence:** The "Mechanism Test" requires a material link. This often obscures "structural violence" where institutions *allow* the physical shock to kill (e.g., colonial policy turning drought into famine). The procedure might label this "Trigger" (human choice determined magnitude) when the moral weight feels like "Protagonist" (the system killed).
  3.  **The "Human Mechanism" Bias:** The procedure defines history as *human choice*. If a pathogen kills 90% of a population, there is no "human mechanism" mediating the death; it is biological fate. The procedure struggles here (see Case 3). It is designed for *political/economic history*, not *demographic history*.

  ### Limitations: What This Procedure Cannot Do

  1.  **Apportion Credit:** It ranks causality (Protagonist vs. Trigger) but cannot calculate percentages (e.g., "60% climate, 40% policy").
  2.  **Bodily vs. Institutional Agency:** You are correct. The procedure systematically **under-credits agents that act on bodies.** If a virus kills people directly, the "Differential Signature Test" (Step 3) often fails because no institution can stop smallpox without vaccines. The procedure might demote the virus to "Backdrop" because human institutions didn't *mediate* the outcome—they were obliterated by it. It favors stories where humans *respond* over stories where humans *suffer*.
  3.  **Complex Systems:** It assumes linear chains (A->B->C). It cannot handle feedback loops (e.g., deforestation causes drought which causes more deforestation).

  ---

  ### Worked Cases

  **Case 1: Tambora (1815) -> Subsistence Crisis (1816)**
  *   **Step 1 (Mechanism):** Pass. Ash -> Stratospheric Aerosols -> Global Cooling -> Crop Failure -> Price Spikes.
  *   **Step 2 (Latency):** Pass. Eruption April 1815, "Year Without Summer" 1816.
  *   **Step 3 (Differential):** Mixed. Europe/NE US suffered; some tropical regions less affected. Institutions (grain storage) mitigated but did not prevent crisis.
  *   **Step 4 (Alibi):** Pass. Contemporaries blamed weather; records confirm harvest collapse.
  *   **Step 5 (Counterfactual):** Tensions existed, but harvest was stable prior.
  *   **Verdict:** **Trigger.**
  *   **Narration:** "The volcano did not choose the victims, but its ash cloud set the price of bread that turned hunger into unrest."

  **Case 2: Laki (1783) -> French Revolution (1789)**
  *   **Step 1 (Mechanism):** Plausible but stretched. Gas -> Cooling -> Harvest Failure -> Unrest.
  *   **Step 2 (Latency):** **FAIL.** Eruption 1783. Revolution 1789. Six-year gap exceeds acute agricultural shock latency.
  *   **Stop Rule Applied:** While Mechanism exists, Latency fails the acute shock window.
  *   **Verdict:** **Backdrop.** (Proceeding to Step 3 confirms: Other nations had harvest failures in 1788 without revolution).
  *   **Narration:** "The haze from Iceland settled over France years before the Bastille fell, a grim backdrop to a crisis made by hands, not heat."
  *   **Note:** The producer will dislike this. The Handoff applies if they argue the *economic depression* lasted 6 years (human mediation), but the physical shock itself is too distant.

  **Case 3: Post-1492 Epidemics -> Indigenous Mortality**
  *   **Step 1 (Mechanism):** Pass. Virus -> Immune Naivety -> Death.
  *   **Step 2 (Latency):** Pass. Immediate.
  *   **Step 3 (Differential):** **FAIL.** No institution could stop smallpox in 1500. Outcome tracks the pathogen, not human variance.
  *   **Step 4 (Alibi):** N/A.
  *   **Step 5 (Counterfactual):** Without pathogen, populations stable.
  *   **Procedure Output:** **Protagonist.**
  *   **Why This Fails:** The procedure *works* here technically, but it highlights the "Bodily Agency" blind spot. The procedure treats this as "Protagonist" (Non-human caused it), which is accurate demographically, but historically it erases the *colonial context* that facilitated the spread (war, displacement). The procedure isolates the pathogen from the empire that carried it.
  *   **Verdict:** **Protagonist** (with Editor Note: Contextualize transmission via colonization).

  ---

