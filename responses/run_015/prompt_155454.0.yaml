answer: |-
  Here is the teaching plan designed for a 40-minute whiteboard session with a skeptical economist.

  ### 1. The Dependency Structure

  Do not follow the textbook definition-order (Poset $\to$ Chain $\to$ Bound $\to$ Lemma). That order treats the definitions as arbitrary hurdles. Instead, build the definitions as *tools needed to solve the economic problem* he saw in the seminar.

  **The Order:**
  1.  **The Object (5 mins):** Define the "collection of partial rankings." Map this immediately to a **Partial Order**.
      *   *Why:* He knows preference relations. A "partial ranking" *is* a partial order. This grounds the abstraction immediately.
  2.  **The Goal (5 mins):** Define **Maximal** vs. **Maximum**.
      *   *Why:* This must happen *before* stating the lemma. If you state the lemma first, he will hear "Maximum" (the best policy). You need to establish that "Maximal" means "cannot be extended," not "beats everything else."
      *   *Board Move:* Draw a "V" shape (two elements at the top, one below connected to both). The bottom is not maximal; the top two are maximal but neither is maximum.
  3.  **The Obstacle (10 mins):** Define **Chain** and **Upper Bound**.
      *   *Why:* You need these to explain why we can't just use induction.
      *   *Critical Isolation:* You must isolate the condition that the upper bound must lie **IN THE SET**.
      *   *Board Move:* Draw a chain of elements. Draw an upper bound *outside* the collection. Cross it out. Write: "The limit must be a valid policy/ranking, not just a theoretical limit."
  4.  **The Lemma (5 mins):** State Zorn's Lemma.
      *   *Why:* Now the definitions feel like necessary machinery, not arbitrary rules.
  5.  **The Engine (10 mins):** Explain the link to **Axiom of Choice** (see Section 4).
  6.  **The Application (5 mins):** Return to the seminar example (extending preferences).

  **What breaks if you reorder:**
  *   If you define "Chain" before "Maximal," he will think the lemma is about the chains, not the maximal element.
  *   If you state the Lemma before distinguishing Maximal/Maximum, you validate his suspicion that it's a dodge to get a "best" outcome.
  *   If you do not isolate the "Bound $\in$ Set" condition before the example, the example will look like magic rather than a checkable hypothesis.

  ### 2. The One Example

  **Verdict:** Your instinct is correct. Use **Finite Subsets of $\mathbb{N}$ ordered by Inclusion**.
  It is the cleanest way to visualize the "Bound $\in$ Set" condition without requiring algebraic background (like vector spaces).

  **How to wield it:**
  Do not use it to show the lemma *working* (since it fails here). Use it to show why the **hypothesis is non-trivial**.

  *   **What it must contain:**
      1.  **The Chain:** Draw $\{1\} \subset \{1,2\} \subset \{1,2,3\} \dots$
      2.  **The Natural Bound:** Draw the union $\mathbb{N} = \{1, 2, 3, \dots\}$.
      3.  **The Failure:** Circle $\mathbb{N}$ and draw a big red "X" over it. Label it "Not Finite."
      4.  **The Consequence:** State clearly: "Because the bound fell outside the collection, the chain never stops, and there is no maximal element."

  *   **What it must NOT contain:**
      1.  Do not get bogged down in cardinality arguments.
      2.  Do not switch to a different example for the success case. Instead, verbally contrast it: "If we had allowed *all* subsets, $\mathbb{N}$ would be in the set, it would be the maximal element, and the lemma would apply trivially."

  *   **Why this example:** It visually proves that Zorn's Lemma is not a tautology. It shows a situation that *looks* like it should have a maximal element (you can always add a number), but doesn't, specifically because the "limit" object violates the set's definition. This directly counters the "induction with extra steps" objection: induction builds the chain, but Zorn requires the *limit* to exist *inside the playground*.

  ### 3. The Misconception Map

  Here is where to intercept his skepticism during the flow.

  | Misconception | When it arises | The Intercept (Board/Speech) |
  | :--- | :--- | :--- |
  | **"Maximal = Best/Maximum"** | During Definitions (Step 2 above). | **Board:** The "V" diagram. **Speech:** "Maximal means 'nobody is bigger than me.' Maximum means 'I am bigger than everyone.' Zorn only gives you 'nobody is bigger.' In economics, that means 'a complete ranking,' not 'the optimal policy.'" |
  | **"This is just Induction"** | During Chains (Step 3 above). | **Board:** Draw a chain with dots $\dots$ at the end. **Speech:** "Induction gets you to every finite step. Zorn is the rule that lets you step *off* the ladder onto the platform at the top. Without Zorn, you hang in the air forever." |
  | **"Bound outside is fine"** | During the Example (Section 2). | **Board:** The red X over $\mathbb{N}$. **Speech:** "If the bound is outside, the process doesn't terminate *within the rules of the game*. That's why the hypothesis matters." |
  | **"AC is obvious"** | During the Engine (Section 4). | **Speech:** "For finitely many boxes, yes. For infinitely many, 'just pick one' is not a mathematical instruction. Zorn packages that infinite picking into one usable tool." |
  | **"Unique Answer"** | During the Application (Step 6). | **Speech:** "Zorn says *a* maximal element exists. In your seminar, there are thousands of complete rankings extending the partial one. Zorn just guarantees the set of completions isn't empty." |

  ### 4. Where the word "Axiom" should first be spoken aloud

  **Timing:** Immediately after stating the Lemma and before explaining the Example.
  **The Script:** "You asked if this is cheating. Here is the honest answer: This is not a theorem like Pythagoras. It is equivalent to the **Axiom of Choice**. It is a rule we choose to adopt because it makes the game of set theory useful for analysis, not because it is self-evidently true from arithmetic."

  **Why here:** If you say it too early, he dismisses the math as philosophy. If you say it too late, he thinks you are hiding the lack of proof. Placing it here validates his skepticism ("You were right to smell something non-constructive") while legitimizing the tool ("But we agree to use it because it works").

  **The Honest-in-40-Minutes Answer:** "Is it true?" $\to$ "It is consistent with standard set theory, and independent of it. We use it because without it, large parts of analysis and economics (like existence of equilibria or preference extensions) break."

  ### 5. What to openly refuse to explain

  You must explicitly bound the session to prevent the "hostile" questions from derailing the core intuition. Say this verbatim:

  *"I am going to refuse to explain three things today, not because they aren't important, but because they require a different course:*
  1.  *How to prove Zorn from the Axiom of Choice (it requires transfinite induction).*
  2.  *Whether the Axiom of Choice is 'true' (that is logic/philosophy, not economics).*
  3.  *How to construct the maximal element (the lemma is non-constructive; it tells you it exists, not how to find it).*

  *If we try to solve those now, we will not understand what the lemma actually **does**."*

  **Sanity Check:** This list is correct. Proving Zorn from AC requires well-ordering and ordinals, which you identified as gaps in his knowledge. Discussing independence requires model theory. Discussing construction is impossible (it's non-constructive).

  ### 6. The Closing Check

  Do not ask "Does that make sense?" He will say yes to be polite. Give him a **diagnostic task**.

  **The Task:**
  Draw the poset $P = \{ (0, a) \mid 0 < a < 1 \}$, ordered by set inclusion (intervals starting at 0).
  *Ask:* "Does Zorn's Lemma guarantee a maximal element in this set? Why or why not?"

  **Correct Answer:**
  "No. Consider the chain of intervals $(0, 0.9), (0, 0.99), (0, 0.999) \dots$. The union is $(0, 1)$. But $(0, 1)$ is **not in the set** $P$ (because $a$ must be strictly less than 1). The upper bound falls outside. Hypothesis fails."

  **Characteristic Near-Miss (The "Slogan" Answer):**
  "Yes, because it's ordered." OR "The maximal element is $(0, 1)$."
  *Diagnosis:* If he says $(0,1)$ is the element, he missed the "Bound $\in$ Set" condition. If he says "Yes" without checking the chain condition, he thinks Zorn applies to any ordered set.

  **Why this task:** It mirrors the "Finite Subsets" example you just taught but changes the context to real intervals (familiar to economists). It tests the specific mechanical condition (Upper Bound in Set) rather than the abstract definition.
