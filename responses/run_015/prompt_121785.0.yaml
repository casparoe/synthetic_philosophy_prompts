  hey, i'm trying to figure out what actually deserves attention in the Maimonides-sacrifice literature right now, beyond the usual "it was just a concession to pagan habits" summary everyone repeats. there's this weirder framing i've been playing with -- let's call it the ontological pivot idea -- where the concession in the Guide isn't just psychological but actually redefines divine presence by restricting material offering to one site and one priesthood, turning sacrifice into a kind of negative practice. i might be making that up entirely, but let's assume it's a live option.

