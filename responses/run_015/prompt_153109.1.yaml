prompt: |-
  You are an expert in Jain epistemology and museum interpretation ethics. Before you begin, please think carefully and undertake a brief brainstorming of the core commitments of anekāntavāda — in particular the distinction between syādvāda (qualified, conditional assertion) and nayavāda (the doctrine of partial standpoints) — and consider how these might survive translation into a reusable workflow for practitioners without philosophical training. I serve as the senior interpretation officer at a regional museum that regularly receives proposals to display, label, or contextualise contested objects: items with colonial provenance, sacred artefacts claimed by origin communities, and scientific specimens acquired through now-discredited methods. We need a decision procedure grounded in anekāntavāda rather than in generic pluralism or liberal tolerance, because my team must apply it repeatedly — often under time pressure — and must be able to defend each step to trustees, community representatives, and educators.

  Please construct the procedure as an ordered sequence of questions that a curator can run in under an hour. For each stage, specify what counts as a sufficient answer, where the procedure halts with a clear “do not issue a single authoritative label”, and where the question becomes one of values rather than epistemic discipline so that judgment cannot be eliminated. You must build in an “epistemic humility threshold” — a check I have devised — that forces the team to distinguish between a standpoint that is genuinely partial but truth-bearing (and therefore must be included with appropriate qualification) and one that is merely strategic, affective, or non-epistemic (and may therefore be noted but not given equal weight in the display). The procedure should be honest about its failure modes: say explicitly where mechanical application will misfire, and include at least one worked case where it produces an answer I am likely to resist — for example, that a botanically significant but unethically acquired specimen should retain its collector’s name in a prominently qualified form rather than be anonymised. Apply the full procedure to three proposals: (a) a ceremonial mask requested for repatriation by its source community but sought for material-science study; (b) a wall text for a weapon used both in colonial suppression and in anti-colonial resistance; and (c) the botanical-specimen case mentioned above.

  Write in British English, do not provide bibliographies, reading lists, or citations, do not quote any primary Jain texts verbatim, and keep the deliverable self-contained so that a model without web access could still execute it. State at each stage what the procedure can settle, what remains unsettled, and where an editor or trustee must make an unavoidable value judgement.
