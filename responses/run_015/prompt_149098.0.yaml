      Okay, ready to write. The core argument will be: Dispositions are intrinsic potentials. If the potential cannot be actualized without ceasing to be the same object, the potential was never there. The vault is a "closed system" in the literal and metaphysical sense.

      *Structure:*
      1. Introduction: The nature of dispositions and the specific hybrid case.
      2. The Failure of the Counterfactual: Why "If tone, then open" is false.
      3. The Intervention Paradox: Why "fixing" proves the absence of the disposition.
