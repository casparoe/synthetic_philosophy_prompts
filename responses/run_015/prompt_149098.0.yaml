      *Refining the "Fixing" argument:* If I claim the vault is soluble (openable), I imply that there is a test I can perform. If the test destroys the subject, the disposition is finkish. If the test is blocked, it's masked. If the test *requires* changing the subject to be performed, the disposition doesn't exist in the subject. I need to hammer home that the "repair" creates a *numerically distinct* object in terms of dispositional properties.

