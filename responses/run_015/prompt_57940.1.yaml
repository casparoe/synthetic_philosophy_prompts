answer: |-
  This is a fantastic observation. You've put your finger on the central hypocrisy of the biopic genre. The industry operates on a sliding scale of ethics that shifts depending on whether the subject is breathing, how much money their estate controls, and how good the drama is.

  Here is a breakdown of the philosophical machinery currently running Hollywood, alternative justifications for it, and what would happen if we actually changed the rules.

  ### 1. The Current Presupposition: "Poetic Truth" and Legal Pragmatism

  The current practice presupposes a specific, somewhat cynical view of truth and obligation.

  **The View of Truth: Aristotelian vs. Platonic**
  Hollywood operates on **Aristotelian "Poetic Truth"** rather than **Platonic "Factual Truth."**
  *   **Factual Truth:** What actually happened, chronologically and empirically.
  *   **Poetic Truth:** What *feels* like it happened, or what captures the "essence" of the person's life.

  The "Based on a True Story" card is a signal that they are aiming for Poetic Truth. It presupposes that the *meaning* of a life is more important than the *data* of a life. By mashing three people into one "composite buddy," they argue they are preserving the *experience* of the protagonist (e.g., "He was always surrounded by loyal friends") without getting bogged down in the boring reality (e.g., "He had 15 different acquaintances").

  **The View of Obligation: The "Harm Principle"**
  The ethical framework here is largely legalistic and consequentialist regarding harm.
  *   **To the Living:** We owe them non-defamation. If you invent a nasty scene about a living ex, you are causing measurable reputational and economic harm. They can sue. The obligation is contractual/legal.
  *   **To the Dead:** We owe them... nothing, legally. In the U.S. and many other jurisdictions, **you cannot defame the dead.** The law presupposes that reputation is a property right that expires at death. Therefore, dragging a dead person's name is treated as "history" or "commentary," not injury.

  **The Justification:**
  The industry argues that the dead have no interests to be harmed. They can't feel shame, lose friends, or lose income. Therefore, the living audience's right to a compelling story outweighs the dead subject's "right" to an accurate legacy.

  ### 2. Are There Other Views That Justify the Same Outcome?

  Yes. You don't need to accept the "Poetic Truth" model to arrive at the same messy biopic landscape. Two other ethical frameworks could justify the status quo:

  **A. Utilitarianism (The Greater Good)**
  A Utilitarian might argue that strict accuracy is less important than the *utility* of the film.
  *   If a biopic exaggerates a conflict between a musician and their ex-wife to create a gripping narrative, and that movie inspires 100,000 kids to learn music, the net positive utility outweighs the hurt feelings of the ex-wife or the tarnished legacy of the dead musician.
  *   Under this view, the "lie" is justified if the cultural output (the art, the inspiration, the conversation) creates more happiness than the distortion creates pain.

  **B. The "Myth-Making" Function**
  This view argues that biopics aren't history; they are **modern mythology**.
  *   Ancient Greeks didn't worry about whether Hercules actually did exactly 12 labors or if the details were mashed together from different heroes. They cared about what Hercules *represented*.
  *   If we view biopics as myth-making, we are not obligated to the dead person's biography, but to the **cultural archetype** they represent. If Steve Jobs needs to be portrayed as a villain in a specific scene to represent the "Tortured Genius" archetype for the audience, the mythological need trumps the historical fact. The obligation is to the *culture*, not the *corpse*.

  ### 3. What If We Took Obligations to the Dead Seriously?

  If we shifted the ethical paradigm to say, "The dead retain a right to their narrative integrity," the genre would collapse or mutate entirely. Here is what would have to change:

  **A. The "Right to Legacy"**
  Currently, "Right of Publicity" (controlling the commercial use of your likeness) varies by state and often expires after death. Taking obligations seriously would require a federal **Post-Mortem Privacy Right**.
  *   **Change:** Filmmakers would need approval from the estate not just to use the likeness, but to depict specific *actions*.
  *   **Result:** We would get fewer biopics, and they would be mostly **hagiographies** (saint-making stories). Estates rarely approve unflattering portrayals. *Bohemian Rhapsody* was criticized for sanitizing Freddie Mercury's life; under a strict "obligation to truth" regime managed by the estate, it might have been even cleaner. Conversely, *Blonde* (which depicts Marilyn Monroe's trauma) would likely never be made.

  **B. The End of the "Composite Character"**
  If we owe the dead (and the living) strict narrative fidelity, composite characters become unethical because they erase the contributions of the real people who were merged.
  *   **Change:** Screenplays would need footnotes or disclaimers specifying exactly who was in the room.
  *   **Result:** Movies would become clunkier. "And here is his friend Dave, and also his friend Steve, and also his friend Mike..." The narrative efficiency of the "Composite Buddy" relies on the assumption that the audience doesn't care about the supporting cast's historical accuracy.

  **C. The Burden of Proof Shifts**
  Currently, the burden is on the victim to prove they were harmed. If we took obligations seriously, the burden would shift to the **filmmaker to prove accuracy**.
  *   **Change:** Before release, a biopic would undergo a fact-checking audit similar to a journalism piece or a documentary.
  *   **Result:** This would kill the "dramatization." You can't fact-check a scene where two dead people have a private conversation in a bedroom. Therefore, those scenes would have to be cut. The psychological intimacy of biopics relies on inventing private moments. If you can't invent private moments, you can't make a drama; you can only make a documentary.

  ### The Paradox

  Here is the catch: If we took obligations to the dead *really* seriously, we might actually harm the truth.

  Biopics are often the only time society re-evaluates a powerful figure. If we require estate approval or strict adherence to "respecting the dead," we lose the ability to critique power.
  *   **The "Villain" Problem:** Many great stories rely on the protagonist being difficult, cruel, or flawed. If we owe the dead "respect," does that mean we can't show them being cruel? If we sanitize the cruelty to respect their legacy, we are lying about who they were.
  *   **The "Victim" Problem:** If we owe obligations to the dead, do we owe them to the abusive husband or the abused wife? Often, "protecting the legacy" means silencing the victims who survived them.

  ### Summary

  The current practice presupposes that **Story is King** and **Reputation is Property** (which expires at death). It treats truth as a vibe rather than a dataset.

  You could also justify it via **Utilitarianism** (the art helps more than the lie hurts) or **Mythology** (we serve the culture, not the person).

  But if we took obligations to the dead seriously, we would likely end up with one of two extremes:
  1.  **Sanctioned Hagiographies:** Clean, approved, boring movies that protect the brand (like Disney movies about founders).
  2.  **Pure Fiction:** Filmmakers would stop making biopics entirely and just write "Inspired By" fictional stories to avoid the ethical quagmire.

  The "Based on a True Story" card is essentially a handshake deal between the studio and the audience: *"We promise this is roughly the shape of the life, but don't sue us if we move the furniture around."* It's a fragile truce, but it's the only reason we get these movies at all.
