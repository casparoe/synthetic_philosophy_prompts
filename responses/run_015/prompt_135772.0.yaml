answer: |-
  Your hypothesis is astute: the stalemate over the Principal Principle (PP) is not merely a technical disagreement about probability axioms, but a collision between two distinct normative projects masquerading under a single title. However, diagnosing this as *purely* verbal or *purely* substantive misses the deeper structure of the impasse. The disagreement is **substantive in metaphysics but manifests as a conceptual divergence in epistemology.**

  The debate stalls because the two camps are using the Principal Principle to do different philosophical work. One side (largely Non-Humeans/Primitivists) uses the PP to **analyze** the concept of chance (chance *is* that which commands credence). The other side (largely Humeans/Reductionists) uses the PP to **accommodate** chance within a categorical ontology (chance *is* a summary of patterns, so the principle must be tweaked to avoid contradiction).

  Here is a diagnosis of the disagreement, an evaluation of the hidden questions at play, and a proposal for what would count as progress.

  ### 1. Diagnosis: Substantive Metaphysics Driving Conceptual Divergence

  The disagreement is not merely verbal about the word "deference," nor is it simply about belief dynamics. It is a **proxy war over the ontology of chance.**

  *   **The Non-Humean (Synchronic/Structural) Camp:** For philosophers like Hugh Mellor or early Lewis (before the undermining worry hit home), chance is a primitive modal feature of the world. On this view, the PP is a **synchronic coherence constraint**. It defines what chance *means*: to be a chance is to be a magnitude that rational credence must track. If the principle fails, the concept of objective chance is incoherent. Admissibility here is usually cashed out causally or temporally (e.g., evidence about the past is admissible; evidence about the future is not).
  *   **The Humean (Diachronic/Informational) Camp:** For Humeans (like Lewis in his later work, or Carl Hoefer), chances supervene on the "Humean Mosaic" of categorical events. This creates the **Undermining Future** problem: the totality of events (including the future) determines the chance function, but the chance function is supposed to guide credence about those future events. If you know the current chance function, you have inadmissible information about the future mosaic. To save Humeanism, the PP must be revised (e.g., to the New Principal Principle, or NPP) to condition not on the chance value itself, but on the proposition that the chance function is the one that best fits the history.

  **The Verbal Mask:** Both sides say "Rational credence should defer to chance."
  **The Substantive Reality:**
  *   **Side A says:** "Deference is the *essence* of chance." (If the principle breaks, chance doesn't exist.)
  *   **Side B says:** "Deference is a *consequence* of chance." (If the principle breaks, we tweak the principle to save the ontology.)

  Your distinction between **Synchronic Coherence** and **Diachronic Updating** maps perfectly onto this metaphysical split. The Non-Humean treats the PP as a structural feature of the world-to-mind link (Synchronic). The Humean treats it as a rule for managing information in a world where "chance" is just a label for frequency patterns (Diachronic/Informational). The Humean revision (NPP) effectively admits that you cannot simply *learn* the chance is $x$ and update; you must learn that $x$ is the *best systematization* of the history, which is a much heavier epistemic lift.

  ### 2. The Hidden Question: Is "Chance" a Unified Concept?

  The impasse suggests the question "What is the correct Principal Principle?" is **ill-posed** because it assumes a univocal concept of "objective chance."

  *   **The Formal/Empirical Hidden Variable:** The debate hinges on whether there are **genuinely chancy processes that outrun frequency data.**
      *   If **Yes** (Non-Humean): The original PP holds. The "undermining" argument is a *reductio* of Humean Supervenience, not a reason to tweak the PP. (This is the stance of critics like Ned Hall or Antony Eagle).
      *   If **No** (Humean): Chance just *is* the frequency pattern. The original PP is false because it allows for "undermining" scenarios that are metaphysically impossible on this view. The NPP is the correct norm for *this* concept of chance.

  *   **The "Admissibility" Wedge:** Look at how each side handles admissible evidence.
      *   **Critics (Non-Humeans):** Treat admissibility as a fixed, intuitive boundary (e.g., "no crystal balls"). If the PP violates this, the metaphysics is wrong.
      *   **Proponents (Humeans):** Treat admissibility as a flexible technical parameter designed to block contradictions. As Lewis admitted, the definition of admissibility became circular: "Admissible information is information that doesn't violate the PP."

  This circularity confirms your suspicion: the two sides are answering different questions. One is asking about the **semantics of probabilistic laws** (what makes a law chancy?), while the other is asking about **rational belief dynamics** (how should I bet given my best theory?).

  ### 3. What Would Count as Progress?

  Given that the metaphysical stalemate (Humean vs. Non-Humean) is unlikely to be resolved by empirical science or pure logic soon, progress in the PP debate requires decoupling the norm from the ontology.

  #### A. A Formal Impossibility Result (The Hard Path)
  Progress would look like a theorem demonstrating that **no single bridge principle can satisfy both the Synchronic and Diachronic readings simultaneously** without trivializing one.
  *   *Example:* A Dutch Book argument showing that an agent who follows the NPP (Humean) is vulnerable to a diachronic Dutch Book in scenarios where an agent following the original PP (Non-Humean) is not.
  *   *Significance:* This would force the admission that "Chance" is not a natural kind with a single normative profile. It would prove that Humean Chance and Non-Humean Chance are distinct variables requiring distinct bridge principles.

  #### B. A Conceptual Distinction: Calibration vs. Deference (The Pragmatic Path)
  A more fruitful path is to distinguish **Calibration** from **Deference**.
  *   **Calibration:** A long-run constraint. (In the long run, my credence $x$ should match frequency $x$.) This suits the Humean view.
  *   **Deference:** A single-case constraint. (In this specific case, my credence should match the propensity $x$.) This suits the Non-Humean view.
  *   *Progress:* Acknowledging that the "Principal Principle" conflates these two. We might need a **Calibration Principle** for Humean statistics and a **Deference Principle** for modal propensities. This dissolves the debate by granting both sides a valid norm for their respective ontologies.

  #### C. Acceptance of Incompatibility (The Pluralist Path)
  We should expect no resolution if we demand a single principle. The progress lies in recognizing that the two norms serve **different explanatory purposes**.
  *   The **Synchronic PP** explains the *authority* of scientific probability claims (why we trust quantum mechanics).
  *   The **Diachronic NPP** explains the *stability* of belief revision in a reductionist world (how we update without contradicting our metaphysics).
  *   *Conclusion:* The literature reads like a "stable equilibrium" because it *is* one. It is a Nash Equilibrium where neither side can defect without abandoning their core metaphysical commitments.

  ### Summary Diagnosis

  The debate is **substantive** at the root (Metaphysics of Chance) but **verbal** at the branch (Definition of Deference). The stall is not due to a lack of ingenuity, but because the Principal Principle is being asked to bridge a gap that may not exist for one side (Humeans) and is unbridgeable for the other (Non-Humeans) without metaphysical concession.

  **Progress** will not come from refining the principle further. It will come from **fragmenting the concept.** We should stop looking for *The* Principal Principle. Instead, we should aim for a formal result showing that the Synchronic and Diachronic norms are mutually exclusive in undermining scenarios, thereby legitimizing a **pluralism about chance norms**: one for the primitivist, one for the reductionist. Until then, the "choreography" will remain well-rehearsed but ultimately circular.
