      *   *Lens 1: Moral Luck.* Did the outcome change the moral status of the decision? The Athenians *intended* mass murder. They got lucky that they changed their minds. Does the near-miss absolve them?
      *   *Lens 2: Democratic Reversal.* The mechanism of self-correction. Is it a feature or a bug?
      *   *Lens 3: Diodotus's Rhetoric.* He explicitly says he isn't arguing for mercy. He's arguing for cold calculation. But is there a deeper psychological warning?

