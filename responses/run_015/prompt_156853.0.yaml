prompt: |-
  Take the Mytilene debate in 427 BCE — Cleon vs. Diodotus, the assembly votes to slaughter every male citizen then flips the very next morning — and analize it through the lens of moral luck and what I'd call "democratic reversal." Don't just summarize Thucydides; map who knew what at each vote, whether Diodotus is running a utilitarian calc or something closer to a warning about wrath's instability. Then: does the reversal make the first decision less blameworthy, or does moral luck cut against them? And be honest about where the theory is silent — can it explain why an assembly can undo itself overnight, or is that purely institutional design? Keep it tight, no citation lists please.
reasoning: |-
