answer: |-
  The Mytilene debate is not just a clash of rhetoric; it is a stress test for democratic moral agency. To analyze it through moral luck and "democratic reversal," we must strip away the narrative drama and look at the epistemic and moral architecture of the two votes.

  **Epistemic Mapping: Who Knew What?**

  *   **Vote 1 (The Rage):** The Assembly operates under high epistemic closure. They know Mytilene revolted; they assume severity equals security. Cleon frames the knowledge landscape: dissent is treason, mercy is weakness. The emotional state (*orgē*) narrows their vision. They do not know the strategic cost of indiscriminate slaughter, nor do they care. They are morally blind to the future consequences because the present anger occludes them.
  *   **The Interim (The Cooling):** This is the critical variable. Overnight, the *orgē* subsides. The epistemic state shifts from "punish the guilty" to "what have we become?" The physical dispatch of the execution ship makes the abstract decree concrete. The knowledge gained here is psychological: the realization that their own wrath is unstable and dangerous to *them*, not just the Mytileneans.
  *   **Vote 2 (The Calculation):** Diodotus operates with expanded epistemic horizons. He knows that future rebels will fight to the last man if they know surrender means death. He knows the empire relies on revenue, not graveyards. Crucially, he knows the Assembly is ashamed of Vote 1 but needs a face-saving exit.

  **Diodotus: Utilitarian or Psychologist of Wrath?**

  Surface-level reading suggests Diodotus is a cold utilitarian. He explicitly disavows appeals to justice or mercy, arguing solely on *expediency* (what is useful for Athens). He matches Cleon's consequentialism but extends the time horizon. Cleon looks at the immediate satisfaction of revenge; Diodotus looks at the long-term stability of the empire.

  However, this is a rhetorical mask. Diodotus is actually running a psychological warning about the instability of wrath. He understands that a democracy driven by passion is epistemically unreliable. By refusing to argue morality, he bypasses the Assembly's defensive posture. He isn't just calculating utility; he is managing the *thumos* of the crowd. He offers them a way to reverse course without admitting moral failure, framing the reversal as a smarter strategic play rather than a concession to pity. He is treating the democracy not as a rational agent, but as a volatile system that needs dampening, not lecturing.

  **Moral Luck and Blameworthiness**

  Does the reversal make the first decision less blameworthy? Under a strict framework of moral luck (specifically *resultant luck*), the answer is no. The Athenians intended mass murder. The fact that a second ship arrived in time is luck external to the moral quality of the first vote. If the first ship had been faster, they would be mass murderers. Since they weren't, they are merely *almost* mass murderers. Moral luck theorists like Nagel would argue the blameworthiness remains identical because the *will* was identical.

  However, there is a twist: *constitutive luck*. The Athenians possessed the psychological capacity for regret. A different polity might not have cooled overnight. In this sense, moral luck cuts *against* them regarding the first vote (they were lucky to be the kind of people who regret), but it complicates the blameworthiness. The reversal suggests the first vote was not a fixed moral stance but a transient emotional spike. If the "self" of the democracy is fluid, can we pin blame on the Day 1 self using the Day 2 self's judgment?

  The reversal mitigates the *outcome*, but it exacerbates the *indictment of the system*. It proves the first vote was epistemically bankrupt. They were lucky that their own institutional design allowed for correction, but that doesn't absolve the initial bloodlust.

  **The Limits of Theory: Democratic Reversal**

  Here is where moral luck theory hits a wall. Moral luck explains how we judge agents based on outcomes outside their control. It does not explain *mechanisms of self-correction*.

  The "Democratic Reversal"—the institutional ability of a collective to invalidate its own prior will overnight—is not a matter of luck; it is a matter of design. Thucydides shows us that the Athenian democracy had built-in redundancy (the ability to reconvene, the absence of immediate execution). Moral luck theory is silent on why some systems allow for reversal and others lock in catastrophe. It can judge the Athenians for being lucky, but it cannot explain the *politics* of the reversal.

  The reversal is purely institutional. It relies on the separation of the *decree* from the *act*. Once the act is irreversible (the swords fall), luck is all that remains. While the act is pending, procedure is king. Theory fails to capture why the Assembly listened to Diodotus. Was it reason? Or was it the institutional space that allowed reason to catch up with passion?

  **Conclusion**

  The Mytilene debate reveals that moral luck is insufficient to judge democratic violence. The Athenians were morally lucky that their wrath had a half-life shorter than the sailing time of a trireme. Diodotus did not save them through ethics, but by hacking their self-interest and leveraging the institutional pause. The reversal does not cleanse the first vote; it highlights the fragility of a system where mass murder is a valid policy option pending a second thought. Moral luck tells us they got away with it; institutional analysis tells us why they had the chance to try.
