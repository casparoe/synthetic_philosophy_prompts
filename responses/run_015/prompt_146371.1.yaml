answer: |-
  Here is your teaching plan. I have taken a definite stance on every variable you requested. Do not deviate from this sequence if you want the logic to land.

  ### Phase 1: The Prerequisite Concept (Before "Grue")
  **Concept:** **Underdetermination of Theory by Data.**
  Do not mention Goodman or "Grue" yet. You must first establish that **finite data never logically forces a single prediction.**

  *   **Why:** If she thinks data "speaks for itself," she will treat "Grue" as a trick word. You need her to admit that for any finite set of points, infinite curves can pass through them.
  *   **The Hook:** Ask her: "If I give you a training set of 1,000 points that form a perfect straight line, does logic *force* you to predict the 1,001st point lies on that line?"
  *   **The Goal:** She must agree that choosing the straight line is a *bet*, not a logical necessity. Once she admits there is a "gap" between past data and future prediction, you have created the space for Goodman's paradox.

  ### Phase 2: The Example (No Emeralds)
  **The Scenario:** **"Batch Paint"**
  Use industrial paint chips tested in sequential batches. This maps directly to her data mindset (Train/Test splits).

  *   **What it MUST have:**
      1.  **Observable Property:** Color (Blue).
      2.  **Index/Time Threshold:** A specific future point (e.g., "Batch 101" or "Next Tuesday").
      3.  **Symmetrical Evidence:** Both rules must fit the *existing* data perfectly (100% accuracy on training set).
  *   **What it MUST lack:**
      1.  **Causal Mechanism:** Do not mention chemistry, pigments, or oxidation. If there is a physical reason, she will solve it with physics, not logic.
      2.  **Prior Probability:** Do not imply one color is "natural."
  *   **The Setup:**
      *   **Data:** Batches 1–100 are all observed to be **Blue**.
      *   **Hypothesis A (Standard):** All batches are **Blue**.
      *   **Hypothesis B (Grue-like):** All batches are **"Bleu"** (defined as: Blue if Batch < 101, Red if Batch ≥ 101).
      *   **The Conflict:** Both hypotheses fit the current data perfectly. But they make opposite predictions for Batch 101.

  ### Phase 3: The Misconception Arc
  Address these objections in this exact order. If you address them out of sequence, the logic collapses.

  **1. Objection: "This is just semantics/word games."**
  *   **When it hits:** Immediately after you define "Bleu."
  *   **How to defuse:** Pivot to **actionable prediction**. Tell her: "This isn't about labels. If you bet on Hypothesis A, you stock Blue paint for Batch 101. If you bet on Hypothesis B, you stock Red paint. One of these costs you money. The data alone cannot tell you which."
  *   **Teaching Point:** Show that different definitions lead to divergent physical outcomes.

  **2. Objection: "Science always picks the simpler rule (Occam's Razor)."**
  *   **When it hits:** Once she admits the predictions diverge. She will say "Blue is simpler than Bleu."
  *   **How to defuse:** Challenge the **language dependence**. Ask her: "Simpler in what vocabulary?" Explain that if our primitive color terms were defined as "Bleu" and "Green" (where Green = Blue before T, Red after), then "All batches are Bleu" is the simple rule, and "All batches are Blue" is the complex, disjunctive one.
  *   **Teaching Point:** Simplicity is not objective; it depends on which predicates you treat as "basic."

  **3. Objection: "Causation solves it automatically."**
  *   **When it hits:** The final refuge. She will say "There must be a causal reason why paint stays Blue."
  *   **How to defuse:** Remind her of **Phase 1**. Ask: "How do you know causation holds? You know it because causes produced consistent effects *in the past*. You are using induction to justify causation to solve induction."
  *   **Teaching Point:** Causation is an inference *from* regularity, not a magic key that unlocks regularity without circularity.

  ### Phase 4: The Stance on Circularity
  **Decision:** **CUT IT.**
  Do **not** include the worry about defining "projectible" predicates being circular in this first talk.

  *   **Reasoning:** Your roommate is a data person. Her intuition is that *better metrics* solve model selection. The "circularity of projectibility" is a meta-epistemological worry about justifying the metrics themselves. If you introduce this now, she will think you are saying "nothing is knowable," which triggers skepticism rather than insight.
  *   **Strategy:** Keep the focus on **Symmetry**. The goal of this session is to show that *evidence alone* cannot break the tie between "Blue" and "Bleu." Save the circularity argument for a second conversation once she has accepted that the tie exists. If you try to solve the justification now, you dilute the paradox.

  ### Phase 5: The Check Question
  Do not ask her to define "Grue." Ask her to make a decision that reveals whether she feels the threat.

  **The Question:**
  > "Imagine you are deploying a model on a black-box system. You have two algorithms. Both have 100% accuracy on all historical data. Algorithm A predicts the system stays stable tomorrow. Algorithm B predicts the system crashes tomorrow (based on a 'stable*' predicate that switches after midnight). You have no access to the code or the physics. **What specific piece of information, other than 'it feels simpler,' justifies deploying Algorithm A over B?**"

  *   **Pass Condition:** She hesitates, or admits she has no logical justification other than pragmatic habit ("I'd just pick A because I'd get fired if I picked B").
  *   **Fail Condition:** She says "Because A is more likely to be true" (without explaining why) or "Because B is artificial." (This shows she thinks the data itself rules out B, which means she missed the point).

  ### Summary of Instructions for You
  1.  **Lock the Concept:** Underdetermination first.
  2.  **Lock the Example:** Batch Paint (Time-indexed, no chemistry).
  3.  **Lock the Sequence:** Semantics → Simplicity → Causation.
  4.  **Lock the Cut:** Drop the circularity argument entirely for now.
  5.  **Lock the Check:** The "Black-Box Model" question.

  Follow this arc. If she pushes back on the "Cut," tell her: "We need to agree the problem exists before we try to solve the justification. One layer at a time."
