answer: |-
  Your friend and your supervisor are mistaken. The agreement in the baseline case is an artifact of assumptions that suppress the very conflicts that make political philosophy necessary. The two readings are not one principle in different words; they are extensionally equivalent only under a highly restrictive set of conditions (common priors, fixed population, cardinal comparability) that the theorem itself does not guarantee. When those conditions relax, the readings diverge formally, not just rhetorically.

  Here is the breakdown of your map, the correction of your framing, the worked example, and the conclusion on what the theorem actually establishes.

  ### 1. Critique of Your Tentative Map

  You have identified the right fault lines, but some of your interpretations of *why* they matter need sharpening.

  **First: The Observer's Probabilities (Beliefs)**
  *   **Your framing:** If the veil uses a shared distribution and the random-member uses subjective beliefs, Pareto violations occur.
  *   **Correction:** This is the most significant formal difference. Harsanyi's Impartial Observer (IO) is typically modeled as having "objective" probabilities or a common prior (often derived from the Principle of Indifference). The Random Member (Sortition) reading aggregates the *subjective* expected utilities of the citizens.
  *   **Verdict:** **Genuine Formal Difference.** When individuals hold divergent subjective probabilities about the state of the world, the "Average of Expectations" (Sortition) is not equal to the "Expectation of the Average" (IO). This is a known result in decision theory (often associated with Philippe Mongin). If you respect individual sovereignty over beliefs (Sortition), you may violate the rationality axioms of the IO. If you enforce IO rationality, you may violate the Pareto principle based on subjective beliefs.

  **Second: Risk Attitude**
  *   **Your framing:** Risk neutrality yields utilitarianism; concave transformation yields prioritarianism; extreme aversion yields Rawlsian maximin.
  *   **Correction:** This is partially confused. Harsanyi's Aggregation Theorem derives the social welfare function from the axioms of von Neumann-Morgenstern (vNM) rationality applied to the IO. The vNM Independence Axiom *entails* risk neutrality over the distribution of utility. You cannot simply "add" a concave transformation to the IO's evaluation without violating the Independence Axiom. Therefore, the distance between Harsanyi and Rawls is not merely a parameter tweak on risk attitude; it is a disagreement about whether the social choice mechanism must satisfy the Independence Axiom. Rawls explicitly rejects the application of expected utility maximization to the Original Position for high-stakes structural choices.
  *   **Verdict:** **Genuine Formal Difference,** but it lies in the acceptance of axioms, not the calibration of a risk parameter.

  **Third: Variable Population**
  *   **Your framing:** $1/n$ existing people yields Average Utilitarianism; fixed probability over possible people yields Total Utilitarianism.
  *   **Correction:** This is coherent. The difference lies in the sample space of the veil. If the probability of "existing" is endogenous to the population size (i.e., if I am behind the veil, my chance of being *anyone* is $1/n$), then adding people with lives worth living but below the average dilutes my expected utility. This yields Average Utilitarianism. If the probability of being a specific possible person is fixed independent of $n$ (e.g., a "slot" in logical space), you get Total Utilitarianism.
  *   **Verdict:** **Genuine Formal Difference.** The choice of probability space is a moral assumption disguised as a technical setup.

  **Fourth: Interpersonal Comparison (Affine Transformation)**
  *   **Your framing:** vNM utilities are fixed only up to positive affine transformation, so weights and zero points are ambiguous.
  *   **Correction:** This is the most critical gap. The Aggregation Theorem proves that the social welfare function $W$ is a linear combination of individual utilities: $W = \sum a_i U_i + b$. It does *not* prove that $a_i = 1$ for all $i$. To get Classical Utilitarianism, you must add a normative premise that the weights $a_i$ are equal. Harsanyi tries to derive equal weights from the equal probability of being any person behind the veil, but this conflates *probability* with *moral weight*.
  *   **Verdict:** **Genuine Formal Gap.** The theorem establishes Weighted Utilitarianism, not Classical Utilitarianism.

  ### 2. Worked Example: Where the Readings Diverge

  We will construct a case where the **Sortition Reading** (Random Member) and the **Impartial Observer Reading** (Harsanyi) rank two policies differently. This occurs when individuals have different subjective beliefs about the likelihood of states of the world.

  **The Setup:**
  *   **Population:** 2 People (Alice, Bob).
  *   **Policies:** Policy X (Risky), Policy Y (Safe).
  *   **States of the World:** State $S$ occurs or State $\neg S$ occurs.
  *   **Payoffs (Utility):**
      *   If $S$: Alice gets 10, Bob gets 0.
      *   If $\neg S$: Alice gets 0, Bob gets 10.
      *   Policy Y: Alice gets 6, Bob gets 6 (regardless of state).

  **The Beliefs:**
  *   **Alice:** Believes $P(S) = 0.9$. (She is optimistic she will be the winner).
  *   **Bob:** Believes $P(S) = 0.1$. (He is optimistic that $\neg S$ will occur, making him the winner).
  *   **Impartial Observer:** Uses the Principle of Indifference. $P(S) = 0.5$.

  **Calculation 1: The Sortition Reading (Random Member)**
  This reading asks: "If we pick a citizen at random, what is their expected utility?"
  *   **Alice's Expected Utility for X:** $(0.9 \times 10) + (0.1 \times 0) = 9$.
  *   **Alice's Expected Utility for Y:** $6$.
  *   **Alice's Preference:** X > Y.
  *   **Bob's Expected Utility for X:** $(0.1 \times 0) + (0.9 \times 10) = 9$.
  *   **Bob's Expected Utility for Y:** $6$.
  *   **Bob's Preference:** X > Y.
  *   **Social Ranking (Sortition):** Since both members prefer X, the average expected utility is 9. **Policy X is chosen.**
      *   *Note:* This respects the Pareto Principle based on subjective beliefs.

  **Calculation 2: The Impartial Observer Reading (Harsanyi)**
  This reading asks: "What is the expected utility of an observer who has a 50% chance of being Alice and 50% chance of being Bob, using objective probabilities for states?"
  *   **Observer's Expected Utility for X:**
      *   In State $S$ (Prob 0.5): Total Utility = $10 + 0 = 10$.
      *   In State $\neg S$ (Prob 0.5): Total Utility = $0 + 10 = 10$.
      *   Expected Total Utility = $(0.5 \times 10) + (0.5 \times 10) = 10$.
      *   Expected Average Utility = $10 / 2 = 5$.
  *   **Observer's Expected Utility for Y:**
      *   Total Utility = $6 + 6 = 12$.
      *   Expected Average Utility = $12 / 2 = 6$.
  *   **Social Ranking (IO):** $6 > 5$. **Policy Y is chosen.**

  **The Divergence:**
  *   **Sortition:** Chooses X (based on unanimous subjective optimism).
  *   **Impartial Observer:** Chooses Y (based on objective risk assessment).
  *   **Analysis:** The Sortition reading validates the "spurious unanimity" caused by contradictory beliefs (Alice thinks she will win; Bob thinks he will win). The Impartial Observer reading corrects for this by imposing a shared probability distribution. They are not the same principle. Harsanyi intends the Impartial Observer reading; your friend's Sortition reading is a different aggregation rule that fails to correct for belief disagreement.

  ### 3. What the Theorem Establishes (and What It Does Not)

  You asked what a thoughtful non-utilitarian must concede and what they can deny.

  **What must be conceded:**
  If a non-utilitarian accepts the following three premises, they are logically committed to a form of **Weighted Utilitarianism**:
  1.  **Individual Rationality:** Individuals satisfy vNM axioms (their preferences can be represented by utility functions).
  2.  **Social Rationality:** The social planner satisfies vNM axioms (specifically Independence).
  3.  **Strong Pareto:** If every individual prefers A to B, society prefers A to B (assuming common beliefs).

  If these hold, the social welfare function *must* be a linear sum of individual utilities. There is no room for rights, desert, or equality as independent values *unless* they are already encoded in the individual utility functions.

  **What can be denied (without inconsistency):**
  A non-utilitarian can reject the conclusion by attacking any of the three premises above. This is where the "non-utilitarian" position lives:

  1.  **Deny Social Rationality (Independence):** One can argue that society should be risk-averse regarding the *distribution* of well-being, even if individuals are not. This rejects the vNM Independence Axiom for the social welfare function. This opens the door to Prioritarianism or Rawlsian Maximin. This is the most common philosophical objection.
  2.  **Deny Strong Pareto (when beliefs differ):** As shown in the example, if individuals have different subjective probabilities, respecting unanimous preference can lead to socially disastrous outcomes (choosing the risky policy X). One can argue that Pareto should only apply when beliefs are consistent or "rational" by some objective standard.
  3.  **Deny the Weights ($a_i = 1$):** The theorem proves $W = \sum a_i U_i$. It does not prove $a_i = 1$. A non-utilitarian can argue that the weights should reflect desert, responsibility, or priority to the worst off, rather than the equal probability of the veil. Harsanyi argues the veil *forces* equal weights, but this relies on the controversial move that "probability of being someone" equals "moral weight of someone."
  4.  **Deny Welfarism:** The theorem assumes individual utility functions contain all morally relevant information. A non-utilitarian can deny this, arguing that rights or procedural fairness constrain the aggregation regardless of the utility sum.

  ### Summary Conclusion

  Your supervisor is wrong; the debate is not terminological. Your friend is wrong; the two readings are not the same principle. They coincide only in a "baseline" world where everyone agrees on probabilities and the population is fixed.

  Harsanyi's own view is the **Impartial Observer** reading with objective probabilities. This reading commits you to Utilitarianism (specifically, Average Utilitarianism in the fixed population case) *if* you also accept that the probability of being any person implies equal moral weight.

  However, the theorem itself is weaker than Harsanyi's conclusion. It establishes that social choice must be **linear** in utilities, but it leaves the **weights** and the **zero-points** of those utilities underdetermined. A thoughtful non-utilitarian can concede the linearity (the form of the aggregation) while denying the weights (the substance of the distribution) or the axioms (the risk neutrality) that force the utilitarian result. The theorem does not prove Utilitarianism; it proves that if you want to be rational and respect preferences, you must be a *Weighted Utilitarian*. The move from Weighted to Classical Utilitarianism requires a moral premise the theorem does not supply.
