      *   *Point 4: Interpersonal Comparison (Affine Transformation).*
          *   User says: vNM utilities are unique up to positive affine transformation (scale and zero). Weights and zero points are ambiguous.
          *   Analysis: This is the "Measurement Problem." Harsanyi's theorem proves $W = \sum a_i U_i + b$. To get Utilitarianism ($a_i = 1$), you need a normalization condition (e.g., "equal moral weight"). The theorem *alone* doesn't justify $a_i = 1$. It justifies *weighted* utilitarianism.
