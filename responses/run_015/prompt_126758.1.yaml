      *   *Precommitment:* A signed certificate or token passed from $E_0$ to $E_1$. But if $E_1$ can't verify if it's the *first* time seeing the token, the token is useless.
      *   *Byzantine Faults:* The "irrational" deviation. If $E_1$ exits when it should continue, it acts as a Byzantine node relative to the global plan.
      *   *Split-Brain:* $E_1$ and $E_2$ might make conflicting decisions if they could communicate, but they can't (causal isolation). Actually, it's worse: they *are* the same process instance restarted without state reset.
      *   *Leader Election:* Who decides the action? In the paradox, the "self" at the moment is the leader. But the "self" at $t_0$ wanted to be the leader. This is a conflict between the *Configuration Manager* ($t_0$) and the *Worker Nodes* ($t_1, t_2$).

