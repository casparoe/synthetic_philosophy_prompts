      *   *Perfect Recall vs. Absent-Mindedness:* In standard rationality, the agent remembers the plan. In the paradox, the agent forgets *where* they are. In distributed systems, this looks like *state amnesia* or *partitioning*. $N_1$ and $N_2$ cannot distinguish their local state (which intersection am I at?). This is akin to nodes receiving identical messages or having identical local logs up to a point, creating ambiguity.
      *   *The Plan (Ex Ante):* This is the initial configuration or the genesis block. It specifies the optimal path (EXIT at 2, CONTINUE at 1).
