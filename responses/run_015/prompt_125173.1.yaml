  1. Model this as a finite-horizon POMDP where states $s_1, s_2$ map to a single observation $o$, making the belief state $b(s|o)$ a function of the policy's own occupancy measure $\mu_\pi$. The planning-time solution optimizes the scalar objective $J(\pi) = \mathbb{E}_\tau[\sum r_t]$ over the parameter $p$, yielding a specific continuation probability that maximizes total episode return. The execution-time solution conditions on being at $o$ to update the belief over $\{s_1, s_2\}$ using the likelihood of reaching each state under $\pi$, then greedily selects actions against the value function, yielding a different probability.

  2. The aliasing of observations and the dependence of the belief state on the policy's occupancy measure translate directly into standard POMDP machinery without loss. The planning-time optimization is identical to maximizing a policy-gradient objective where the gradient accounts for how changing $p$ shifts the state-visitation distribution across both intersections. This framing cleanly captures why the ex-ante optimal parameter differs from the myopic greedy action, as the objective function internalizes the causal impact of $p$ on future reachability.

  3. The distortion arises in modeling the execution-time agent as a distinct optimizer, whereas standard RL treats the executor as a fixed function evaluator running $\pi_\theta$. Off-policy evaluation fails here because the importance ratios cannot correct for the shift in state-visitation distribution caused by changing the policy at one node without changing it at the other. This obscures that the inconsistency is merely between a global optimum and a local best-response given a fixed belief derived from that global optimum.

  4. Modeling this as a Dec-POMDP with shared weights merely relabels the intersections as agents without dissolving the inconsistency, since the policy gradient still couples their objectives. Execution noise translates to either environment stochasticity or policy temperature, and the limit as error vanishes converges to the deterministic policy case without resolving the planning-execution gap. Finally, standard RL assumes per-step action resampling, whereas a per-episode seed introduces temporal correlation that requires augmenting the state with the seed, fundamentally changing the POMDP structure.

  5. The residue is the indexical uncertainty regarding which decision node is active, which RL beliefs cannot capture because they condition on history rather than self-location within a trajectory. This highlights a limitation in RL's modeling of self-locating agents, though practically it confirms the two answers differ less substantively than philosophers claim. Ship the planning-time policy $p^*$, since the RL framework correctly identifies the ex-ante optimum as the only stable solution under fixed information constraints.
