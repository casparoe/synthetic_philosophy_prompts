      *   *Core Mechanism:* Counterfactual branching ratios. This implies a probabilistic or modal logic approach to history. At certain points (nodes), history could have gone multiple ways. The "ratio" suggests some paths are more probable/stable than others.
      *   *The "Britain vs. China" Question:* She claims this is valid because Britain's path was "stable" due to specific factors (coal + institutions), whereas China's path was structurally constrained.
