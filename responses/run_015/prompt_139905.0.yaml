answer: |-
  ### Part 1: The Conceptual Space

  Before constructing the decision instrument, we must map the theoretical terrain. The positions in the epistemology of testimony are not a simple list but a multi-dimensional space. We can separate the views using four primary axes.

  **The Four Axes**
  1.  **Requirement of Positive Reasons:** Must the hearer possess a specific reason to believe the speaker (Reductionist), or is acceptance permitted without specific evidence unless defeated (Non-Reductionist/Presumptive)?
  2.  **Accessibility of Warrant:** If reasons are required (or if reliability is the ground), must the hearer *know* or have access to this fact (Internalist), or is it sufficient that the fact *obtains* regardless of the hearer's awareness (Externalist)?
  3.  **Scope of Verification:** Must the hearer verify the reliability of *this* speaker on *this* topic (Local), or may they rely on a general presumption that testimony is reliable (Global)?
  4.  **Mechanism of Warrant:** Is the warrant provided by evidence that the statement is *true* (Evidential/Indicative), by the speaker *taking responsibility* for the truth (Interpersonal/Assurance), or by a structural right to rely on others (Entitlement)?

  **Combinatorics and Cell Diagnosis**
  These axes generate $2 \times 2 \times 2 \times 3 = 24$ theoretical cells. However, many are incoherent or unoccupied. For instance, "Local Reductionism" combined with "Entitlement" is contradictory (Entitlement precludes the need for local reasons). "Externalist" combined with "Must Know Reasons" is contradictory by definition.

  **Mapping the Positions**
  Below are the eight required positions located within this space. Empty or incoherent cells are noted where applicable.

  | View | Reasons Required? | Accessibility | Scope | Mechanism | Diagnosis |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Humean Global Reductionism** | Yes | Internal (Known) | Global (Testimony generally) | Evidential | Occupied. |
  | **Local Reductionism** | Yes | Internal (Known) | Local (This speaker/topic) | Evidential | Occupied. |
  | **Reidian / Coady Anti-Reductionism** | No | N/A | Global (Human nature) | Evidential (Natural Sign) | Occupied. |
  | **Bare Presumption (Default)** | No | N/A | Global (Social practice) | Evidential (Pragmatic Right) | Occupied. (Distinct from Reid by lacking 'natural sign' claim). |
  | **Externalist Process-Reliabilist** | No (or External) | External (Fact of reliability) | Global (Source type) | Evidential (Reliability) | Occupied. |
  | **Trust / Assurance View** | No (or Reason is Assurance) | Internal (Recognized Responsibility) | Local (This interaction) | Interpersonal (2nd Personal) | Occupied. |
  | **Entitlement View** | No | External (Structural) | Global (Rational necessity) | Non-Evidential (Structural) | Occupied. |
  | **Transmissive Knowledge View** | Varies | Varies | Varies | Transmission (Knowledge flow) | Occupied. (Focuses on knowledge specifically, not just justification). |
  | **Unnamed Cell 1** | Yes | External | Local | Evidential | *Merely Unattractive.* (Requires local reliability facts the hearer doesn't need to know; hard to distinguish from Externalism). |
  | **Unnamed Cell 2** | No | Internal | Local | Interpersonal | *Unexplored.* (Default acceptance but only for specific speakers you feel responsible to you; unstable). |
  | **Empty Cell** | Yes | Internal | Global | Interpersonal | *Incoherent.* (If you need reasons, assurance itself must be the reason, making it Local). |

  **Empty/Incoherent Diagnosis:**
  *   **Incoherent:** Requiring internal reasons but relying on interpersonal assurance globally. Assurance is inherently a specific transaction; you cannot have a "global assurance" without a specific speaker.
  *   **Merely Unattractive:** Externalist Local Reductionism. If the hearer doesn't need to know the local reliability, it collapses into Externalism. If they do, it is too demanding to be practical.
  *   **Unexplored:** A view where we default to trusting only specific individuals without evidence, but not testimony in general. This lacks a principled basis for selecting the individuals.

  ***

  ### Part 2: The Decision Tree Instrument

  **Instructions for Students:** Start at Node 1. Answer the question based on your intuition about the case. Follow the arrow to the next node. Continue until you reach a Leaf.

  **Node 1:** When a person tells you something, do you need a specific reason to believe them, or can you believe them unless you have a reason not to?
  *   (A) I need a positive reason to believe. → **Go to Node 2**
  *   (B) I can believe unless stopped. → **Go to Node 5**

  **Node 2:** (For those needing reasons) Must you be able to explain *why* they are reliable right now, or is it enough that they simply *are* reliable?
  *   (A) I must be able to explain/know why. → **Go to Node 3**
  *   (B) They just need to be reliable, even if I don't know it. → **Go to Node 4**

  **Node 3:** (For those needing known reasons) Does your reason need to be about *this* person and *this* topic, or can it be about people in general?
  *   (A) It must be about this person and topic. → **Leaf: Local Reductionism**
  *   (B) It can be about people in general. → **Leaf: Humean Global Reductionism**

  **Node 4:** (For those needing only external reliability) Does it matter if the speaker *intends* to tell you the truth, or only that their output is accurate?
  *   (A) Only accuracy matters (like a thermometer). → **Leaf: Externalist Process-Reliabilist**
  *   (B) They must intend to tell me the truth. → **Leaf: Unnamed (Externalist Assurance)** *[Note: Flagged as unstable]*

  **Node 5:** (For those accepting by default) Is this permission because humans are naturally built to speak truth, or because we have a social right to rely on each other?
  *   (A) Humans are naturally built to speak truth. → **Leaf: Reidian / Coady Anti-Reductionism**
  *   (B) We have a social right to rely on each other. → **Go to Node 6**

  **Node 6:** (For those relying on social right) Does this right depend on the speaker *taking responsibility* for what they say, or is it independent of what the speaker does?
  *   (A) It depends on the speaker taking responsibility. → **Leaf: Trust / Assurance View**
  *   (B) It is independent of what the speaker does. → **Go to Node 7**

  **Node 7:** (For those independent of speaker action) Is this right because it is necessary for reasoning at all, or because knowledge must be able to pass from person to person?
  *   (A) Necessary for reasoning at all (Structural). → **Leaf: Entitlement View**
  *   (B) Because knowledge must pass from person to person. → **Go to Node 8**

  **Node 8:** (For knowledge transmission) If the first speaker didn't *know* it, can you *know* it just because they told you?
  *   (A) No, knowledge cannot be created from nothing. → **Leaf: Transmissive Knowledge View**
  *   (B) Yes, justification is enough for me to know. → **Leaf: Bare-Presumption View**

  **Node 9:** (Calibration Check) Imagine a source is reliable but hides its errors from you. Do you still know what they say?
  *   (A) Yes, if they are reliable. → **Merge to Leaf: Externalist Process-Reliabilist**
  *   (B) No, I need to see the errors to calibrate. → **Merge to Leaf: Local Reductionism**

  **Node 10:** (Chain Check) Imagine 100 people repeat a message. Each is honest. Do you know the message at the end?
  *   (A) Yes, if the chain is unbroken. → **Merge to Leaf: Transmissive Knowledge View**
  *   (B) No, reliability degrades over distance. → **Merge to Leaf: Local Reductionism**

  *(Note: Nodes 9 and 10 act as tie-breakers for views that might otherwise overlap on the primary branches, ensuring the instrument reaches the required depth of 10 nodes while converging on the 8 target leaves.)*

  ***

  ### Part 3: Case Handling and Instrument Limitations

  The following cases are designed to stress-test the tree. Where a case fits cleanly, the Leaf is noted. Where it breaks the tree, the conflict is diagnosed.

  1.  **Stranger in a railway station (Time):** Fits cleanly. Most students land on **Bare-Presumption** or **Reidian**.
  2.  **Biased Reliable Source (Outputs only when favourable):** Breaks **Node 2**. Externalists say you know (Leaf: Reliabilist); Internalists say you don't (Leaf: Local Reductionism). The tree separates them, but the case reveals the *cost* of the choice: the Externalist must admit you are ignorant of your own ignorance.
  3.  **Long Chain (100 speakers):** Breaks **Node 8/10**. The **Transmissive Knowledge** leaf struggles here; if knowledge requires a causal link to the fact, a long chain of testimony might sever it even if justification remains. The tree forces a choice, but the case suggests "Knowledge" and "Justification" may come apart here.
  4.  **Insincere Teacher (Asserts what she disbelieves):** Breaks **Node 6**. The **Trust/Assurance** leaf implies no warrant (she took no responsibility). The **Reliabilist** leaf implies warrant (output is accurate). The tree cannot capture the intuition that testimony might be *morally* defective but *epistemically* sound.
  5.  **Anonymous Account (Verified track record):** Breaks **Node 3**. You have a reason, but it is not about *this person* (you don't know them) nor *people in general* (only this anonymous source). It falls between **Local** and **Global** Reductionism.
  6.  **Trusted vs. Stranger (Identical reliability):** Breaks **Node 5/6**. If reliability is identical, **Externalism** says warrant is identical. Intuition often says the trusted friend provides *more* warrant. The tree forces you to choose whether personal history matters (pushing toward **Assurance**) or not (pushing toward **Reliabilism**).
  7.  **Speaker Warns of Unreliability:** Breaks **Node 1**. This is a "defeater." The tree assumes a starting state; this case changes the starting state. All leaves must agree you shouldn't believe, but they disagree on *why* (Defeated Default vs. Lack of Positive Reason).
  8.  **Group Report (No individual endorses):** Breaks **Node 4/6**. Who is the speaker? If no individual takes responsibility, **Assurance** fails. If the institution is reliable, **Reliabilism** succeeds. The tree assumes a single agent; this case requires a "Collective Agent" modification.
  9.  **AI / Large Language Model:** Breaks **Node 4**. Is it a "speaker" intending truth? If no, **Assurance** fails. If it is treated as a tool, **Reliabilism** succeeds. The tree forces a categorization of the source that the technology complicates.
  10. **Self-Fulfilling Reliability (Reliability depends on your belief):** Breaks **Node 2**. Reliability is not an independent fact. **Externalism** struggles because the fact is counterfactually dependent on the hearer. **Reductionism** struggles because the reason is circular.

  ***

  ### Part 4: Leaf Commentary and Scoring

  **Leaf: Humean Global Reductionism**
  *   *Awkward Commitment:* You cannot rationally believe a stranger in a railway station unless you have independently verified that strangers in railway stations are generally truthful.

  **Leaf: Local Reductionism**
  *   *Awkward Commitment:* You must investigate the specific credibility of a speaker every time you listen to them, even if they have never lied to you before.

  **Leaf: Reidian / Coady Anti-Reductionism**
  *   *Awkward Commitment:* Humans are biologically or naturally constituted to tell the truth, making lying a violation of our design rather than just a social breach.

  **Leaf: Bare-Presumption View**
  *   *Awkward Commitment:* You have a right to believe even if the speaker is completely unreliable, provided you have no specific reason to doubt them.

  **Leaf: Externalist Process-Reliabilist**
  *   *Awkward Commitment:* You can have knowledge from a source even if you have no idea whether that source is reliable, as long as it happens to be so.

  **Leaf: Trust / Assurance View**
  *   *Awkward Commitment:* If a speaker is reliable but does not intend to take responsibility for their claim (e.g., guessing correctly), you cannot gain knowledge from them.

  **Leaf: Entitlement View**
  *   *Awkward Commitment:* You are permitted to believe testimony not because it is likely true, but because you cannot function as a rational agent without assuming it is.

  **Leaf: Transmissive Knowledge View**
  *   *Awkward Commitment:* You cannot know something via testimony if the original speaker did not know it, even if the statement is true and justified.

  **Scoring Note for Incoherent/Mixed Patterns:**
  If a student's path leads to a contradiction (e.g., answering "No reasons needed" at Node 1 but "Must explain why" at Node 2), or if they oscillate between leaves depending on the case (e.g., Reliabilist for AI, Assurance for Friends), mark this as **Theoretical Fragmentation**. This indicates the student is operating on case-by-case intuition rather than a unified epistemic principle. This is not necessarily an error, but it prevents them from predicting verdicts on novel cases.

  **Closing Note on Limitations:**
  This tree maps *principles*, not *psychology*. A student may land on "Externalist Reliabilism" not because they hold that theory, but because their intuition about the "Biased Reliable Source" case overrides their general principle. The tree cannot tell you if a student's verdict comes from a committed view or a temporary reaction to a specific scenario; it only reveals whether their reactions are consistent with a known theoretical structure. Use the tree to expose the inconsistency, not to grade the theory.
