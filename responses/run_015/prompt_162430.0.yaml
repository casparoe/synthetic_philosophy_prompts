      *   **Topic:** Dialectic between Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA).
      *   **Thesis:** The "Presumptuous Philosopher" label belongs to SSA, not SIA. SSA licenses large armchair revisions of contingent empirical belief from no evidence; SIA is modest.
