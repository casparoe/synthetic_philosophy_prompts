      *   **SIA (Self-Indication Assumption):** Your existence is evidence. $P(H|E) \propto N(E|H)P(H)$. Weight by the *number* of observers with evidence $E$. Total population size outside $E$ doesn't directly dilute the probability unless it affects the number with $E$.
      *   **The Goal:** I need SSA to favor a hypothesis with a *smaller* total population (because the fraction with evidence $E$ is higher) against a hypothesis with a *larger* total population (where the fraction with $E$ is lower), despite the number of observers with $E$ being equal.
      *   **Constraint 1 Check:** Hypotheses agree on reasoner's community. Differ on unobserved contemporaneous population.
      *   **Constraint 2 Check:** Number of observers with evidence $E$ (like the reasoner) is the same on both hypotheses.
      *   **Constraint 3 Check:** SSA moves odds 1000x relative to SIA.
