      *   *Let's check the constraint about "Presumptuous Philosopher":* The standard PP argument (Bostrom) attacks SIA for saying "Universe is huge" based on armchair reasoning. Here I need SSA to be the one saying "Universe is small/We are special" based on armchair reasoning.
