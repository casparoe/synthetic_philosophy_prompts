answer: |-
  Hi there, here is the case we discussed, drafted as a continuous narrative followed by the technical check you requested. Imagine a budget committee at the United Nations Office for Outer Space Affairs meeting in a closed session in Geneva. They are deciding whether to allocate a substantial portion of the global existential risk fund to construct an Interstellar Beacon aimed at the Andromeda galaxy or to reinforce the Earth Biosphere Shield. The empirical data from telescopes is currently ambiguous regarding intelligent life in Andromeda. There are two live hypotheses on the table. Hypothesis Lonely posits that humanity is the only intelligent civilization in the local supercluster, meaning the total population of intelligent observers is exactly the ten billion humans currently alive on Earth. Hypothesis Crowded posits that Andromeda teems with a culturally and biologically continuous civilization of ten trillion intelligent observers, making the total population ten trillion and ten billion. Crucially, both hypotheses agree on every fact concerning Earth: its history, its current population of ten billion, and its future trajectory. They differ only on the existence of the unobserved Andromedan population. The committee must vote now, before the next generation of telescopes settles the matter in fifty years. If they follow the Self-Sampling Assumption, they reason as if they are a random sample from the reference class of all intelligent observers. Under Hypothesis Lonely, the fraction of observers who are Earthlings is one. Under Hypothesis Crowded, the fraction of observers who are Earthlings is ten billion divided by ten trillion, or one in a thousand. Consequently, SSA shifts the odds by a factor of one thousand in favor of Hypothesis Lonely, leading the committee to conclude with near certainty that the beacon would be signaling into a void, and thus they should fund the Earth Shield instead. If they follow the Self-Indication Assumption, treating their existence as evidence that favors hypotheses with more observers, the calculation changes. Under the convention where SIA is an addition to the sampling step, the probability is weighted by the number of observers with evidence like yours; since there are ten billion Earthlings in both hypotheses, the likelihood ratio is one to one. The anthropic step carries no weight, the priors remain at the roughly even odds suggested by the ambiguous astrophysical data, and the decision rests on non-anthropic expected utility, leaving the possibility of the Crowded hypothesis very much alive. If one regards SIA as a rival to the sampling step rather than an addition, the verdict is unchanged for this case because the final weighting depends solely on the count of observers with your evidence, which is constant across both hypotheses, so the distinction affects the derivation but not the modest conclusion.

  To check the mechanics explicitly, the reference class is all intelligent observers, a category both sides grant because the Andromedans are stipulated to be biologically and culturally continuous with us, avoiding contested observer status. The priors are set at fifty-fifty based on the empirical astrophysical data alone, satisfying the requirement that the anthropic step carries the weight. SSA derives a posterior odds ratio of 1000:1 for Lonely because it divides the number of observers with your evidence by the total reference class size, creating a denominator effect where the massive Andromedan population dilutes your typicality. SIA derives a posterior odds ratio of 1:1 because it weights by the absolute number of observers with your evidence, ignoring the denominator of those without it. The single structural feature doing the work is the normalization by total population size inherent in SSA but cancelled out in SIA. If that feature is removed, for instance by narrowing the reference class to only Earthlings, SSA loses its leverage and converges with SIA at 1:1, since the total population becomes constant across hypotheses. If the feature is inverted so that the unobserved observers also share your evidence, perhaps because they are identical duplicates, both theories converge again because the numerator scales with the denominator in SSA, restoring the ratio to 1:1. The strongest objection an advocate of SSA would make is that the reference class is improperly drawn, arguing that causally disconnected populations should not be included in the same sampling pool as yourself. This objection lands on the theory itself rather than the case, because it requires SSA to adopt a fragmented reference class rule that arguably undermines its universal applicability and reintroduces the very armchair speculation about causal connectivity that the theory was meant to avoid.

  Honestly, I believe this case supports your thesis that the Presumptuous Philosopher label is misplaced, because it demonstrates SSA licensing a massive revision of empirical belief about the external world based solely on the reasoner's self-location, whereas SIA remains agnostic. However, a defender of the standard labelling might absorb this by distinguishing between temporal and spatial presumptuousness, arguing that the original Presumptuous Philosopher case involved predicting the future size of the universe from the present, whereas this case involves inferring the present size of the universe from the present. They might claim SSA is only presumptuous when it predicts the future, not when it infers hidden contemporaries. But this distinction seems fragile given that the logic of dilution is identical in both spatial and temporal domains. If you accept that inferring the non-existence of ten trillion contemporaries from an armchair is presumptuous, then SSA is indeed the presumptuous theory here, and the standard narrative requires revision. I think the referee will struggle to dismiss this without conceding that SSA's modesty is indeed an artifact of case selection, provided you hold firm on the reference class continuity.
