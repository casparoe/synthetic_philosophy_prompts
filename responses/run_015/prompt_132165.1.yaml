  Let's refine the "Weak Joint." For the Ontological objection, the weak joint is claiming the "exists" quantifier is restricted without making it arbitrary. For the GR objection, the weak joint is hoping for a quantum gravity fix. For the Vertex, the weak joint is the "privileged observer" implication.

