answer: |-
  Before committing to a label, I considered five candidate concepts and set them aside for specific reasons. *Logrolling* is the closest procedural fit for the committee case, but it describes vote-trading within a fixed preference set, lacking the normative shame and failing to cover the one-sided hedgerow payment. *Coasean Bargaining* captures the efficiency gain from disagreement but treats values as neutral preferences, ignoring the contested duty that causes the sullenness. *Moral Trade* (as discussed by Ord and MacAskill) fits the committee's reciprocal funding but fails the hedgerow case where only one party acts, and it typically frames the outcome as positive rather than shame-inducing. *Rotten Compromise* (Margalit) addresses the moral residue but requires one party to be fundamentally illegitimate or evil, which doesn't fit your conscientious colleagues or neighbour. Finally, *Commodification* explains the degradation of value but is a broad critique of markets rather than a name for this specific transactional structure.

  The concept you are describing is best captured by the coined term **Integrity Arbitrage**. I have low confidence that this is an established label in the literature (it is not), but high confidence that it accurately isolates the phenomenon. **Integrity Arbitrage** is defined as a transactional settlement where parties exploit divergent intensities of normative commitment to unlock stalled value, but where the mechanism of exchange (payment or cross-funding) undermines the expressive status of the outcome, generating moral residue. The "arbitrage" comes from the gap between how much you value your cause versus how much your opponent values theirs; the "integrity" cost comes from treating a duty as a priceable preference.

  Two near-miss cases must be excluded: first, **Standard Bribery**, where the payer knows the act is wrong and pays to corrupt a duty (here, you believe the act is right, merely unfunded); second, **Altruistic Subsidy**, where one party pays another to do something they both agree is good (here, the disagreement is essential to the deal's existence). Regarding your brother's claim: he is right that *convergence* eliminates gains (if you valued the hedge exactly as he did, no payment would be needed), but wrong if he implies *symmetry* prevents them (the committee case works precisely because your valuation profiles are mirror images—you care more about X, they care more about Y). The sullenness is not a separate phenomenon but a constitutive signal of the integrity cost; it marks the recognition that the value has been saved only by being downgraded from a duty to a commodity. A specialist in law and economics would likely push back on the claim that this is a distinct concept, arguing it is simply Coasean bargaining with expressive constraints; their objection would be that the "shame" is an external psychological cost, not a structural feature of the transaction itself.
