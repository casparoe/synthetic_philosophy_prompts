prompt: |-
  I am a staff software engineer at a company of about nine hundred people, and for the last eight months I have been one of three rotating members of the committee that allocates our employee hardship fund. The fund is discretionary: any employee, including contractors with more than a year of service, may apply once a quarter for help with an out-of-pocket cost — dental or medical work insurance will not cover, travel to a family funeral, adapting a home workspace after an injury, emergency childcare, replacing essentials lost in a fire. We have eighteen thousand dollars a month and typically between forty-five and sixty thousand dollars of requests. We meet for ninety minutes, read a one-page application (a free-text description, the amount requested, the applicant role and tenure, and, since last quarter, a self-rated need score from zero to ten), and decide. I then write a short paragraph of justification per decision into a shared document. The Head of People signs off, the works council can ask us to reopen any file, and a rejected applicant can request a fifteen-minute meeting with me. Committee members rotate every six months and none of us has any training for this. I have an engineering background and no philosophy; I can follow a precise specification, but I cannot go and read a literature.

  The reason I am writing is that our Head of People has proposed two changes, and something about both feels wrong to me in the same way and I cannot say what. First, that we should simply rank applications by the self-rated need score and fund down the list until the money runs out, on the grounds that the applicants are the only people who know how much they need it. Second, that where we have to choose we should fund the biggest improvement per dollar. My worry, which I cannot sharpen, is that one person's seven is another person's four, and that the people who write the most florid applications are not the people who need the money most. I have also noticed that our committee is much better at picturing the life of a software engineer with back pain than the life of a night-shift warehouse picker, and that this seems to move money.

  What I would like from you is a written procedure that the three of us can actually run, and that I can hand on to whoever replaces me. Please operationalise whatever the theory of interpersonal comparisons of utility has to say that is genuinely usable here: I have in mind the idea that a person's wellbeing has no natural zero or unit, that comparing how badly off two people are is a different job from comparing how much two people would gain, and that there is a well-known move where you ask the decision-maker to imagine having an equal chance of ending up as any one of the applicants rather than trying to climb inside their heads. If any of those are the wrong tools, say so and use the right ones.

  Concretely, I need:

  The questions to ask, in order, for a single application and then for a set of applications competing for the same money. For each question, what would count as a sufficient answer given that all we have is the one-page form and our own discussion, and what counts as no answer at all.

  Where the procedure stops and returns a no, so that we do not end up inventing a justification for a decision we could not actually support.

  Which comparisons we should refuse to make at all, in the sense that the honest answer is that we do not have and cannot get the information — and how the write-up should say that, so it survives review by the works council and does not read to the applicant as bureaucratic evasion.

  Where the procedure must hand the decision to a person because the remaining question is one of values rather than facts. I would particularly like help separating two things I keep conflating: on the one hand, whether we are trying to maximise the total good we do with the money, and on the other hand, whether we are trying to direct it to whoever is worst off regardless of how much good the money does. I do not think measurement can settle that choice, and I want the procedure to say so plainly rather than smuggle in an answer.

  The distinctions from the theory that have to survive being simplified for a committee of engineers with ninety minutes and no training, and the ones that can be dropped as making no difference to what we decide. Please be explicit about what we lose by dropping them.

  A short, fixed set of concrete dimensions every application gets rewritten into before we compare anything, given that we cannot ask the applicant for more than the form already collects, cannot run any psychological measurement or calibration exercise on staff, and cannot require people to disclose a diagnosis. If rewriting free-text hardship into a common set of dimensions is a bad idea, tell me what to do instead.

  A check for the failure mode I described: that we identify more easily with applicants who share our job, our education, or our way of writing about feelings. It has to be something a rotating committee can run without training.

  Where the procedure will misfire, stated as plainly as you can manage.

  Then run the finished procedure on three applications, showing your work at each step and including the write-up paragraph you would have me put in the shared document for each:

  1. A nine-hundred-dollar ergonomic chair and assessment for an engineer with chronic back pain that will continue indefinitely, against twelve hundred dollars of travel for a warehouse picker to attend a parent's funeral abroad. Same pot of money, only one can be funded this month.
  2. A standing desk for a senior engineer on a high salary with mild, recent discomfort, against emergency dental work for a contractor on the lowest pay band in the company. The dental work costs three times as much and the contractor's request is only partly covered by what we can give.
  3. Two long-standing applicants with comparable requests and comparable costs, one of whom writes a measured, understated account and rates their need at four, and one of whom writes an intense account and rates it at ten. The understated applicant has lived with their condition for eleven years and describes it in their form as something they have simply got used to; the other applicant's problem began last month.

  I would like at least one of these three to come out somewhere my committee will not want it to, and I would rather you chose which one that is than arranged the cases to avoid it. If the procedure's answer in that case is one I should overrule as a value judgement, tell me that, and tell me how to document an overrule so that it does not become a precedent for overruling the procedure whenever we find it inconvenient.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Staff Software Engineer, 900-person company, rotating committee member (Hardship Fund).
      *   **Context:** Discretionary fund ($18k/mo, $45k-$60k requests). 3-person committee, 90 mins meeting, 1-page apps (text, amount, role/tenure, self-rated need 0-10). No training. Engineering mindset (precise specs, no philosophy lit).
      *   **Problem:** Head of People proposed two changes that feel wrong: (1) Rank by self-rated need score, (2) Fund biggest improvement per dollar. User worries about subjectivity of scores, writing ability bias, and empathy gaps (engineers vs. warehouse).
      *   **Goal:** A written, operational procedure for the committee.
      *   **Specific Requirements:**
          *   Questions to ask (single app & competing set).
          *   Stop conditions (when to say "no" definitively).
          *   Refused comparisons (what we can't know).
          *   Value vs. Fact separation (Maximize total good vs. Help worst-off).
          *   Theory simplification (what to keep/drop from interpersonal utility theory).
          *   Concrete dimensions for rewriting apps (or alternative).
          *   Bias check (empathy gap).
          *   Failure modes.
          *   **Run the procedure on 3 specific cases.**
          *   **Constraint:** At least one outcome must be uncomfortable/unpopular, with guidance on overruling.

  2.  **Analyze the Ethical/Philosophical Core:**

      *   *Interpersonal Comparisons of Utility:* The user mentions the lack of natural zero/unit. This is true. We can't measure "utils."
      *   *Veil of Ignorance (Rawls/Harsanyi):* The user mentions "equal chance of ending up as any one of the applicants." This is a strong heuristic for impartiality.
      *   *Prioritarianism vs. Utilitarianism:* The user explicitly wants to separate "maximize total good" (Utilitarian) from "direct to worst off" (Prioritarian/Egalitarian). The procedure must force a choice here, not hide it.
      *   *The Head of People's Proposals:*
          *   *Rank by Self-Rated Need:* Flawed because scales aren't calibrated. A stoic person's 5 might be a dramatic person's 9.
          *   *Biggest Improvement per Dollar:* Flawed because "improvement" is hard to measure across different *types* of need (pain relief vs. grief closure vs. financial survival).
      *   *The Empathy Gap:* Engineers relate to back pain/ergonomics better than warehouse travel/funerals. The procedure needs a "bias brake."

  3.  **Drafting the Procedure (The "Spec"):**

      *   *Philosophy:* Adopt a "Sufficientarian + Prioritarian" hybrid. First, ensure basic dignity/safety (Sufficientarian). Second, prioritize those with less capacity to absorb the cost (Prioritarian). Avoid pure Utilitarianism (max total happiness) because it's impossible to measure and often punishes the desperate.
      *   *Dimensions:* Instead of "utility," measure *Impact of Non-Funding* and *Capacity to Self-Fund*.
      *   *The "Veil of Ignorance" Check:* A specific step where members imagine being the applicant.
      *   *Value Switch:* A explicit toggle the committee must set at the start of the quarter/year. Are we a Safety Net (Worst-off first) or an Optimization Engine (Most impact first)? Given it's a *Hardship* fund, "Safety Net" is the default ethical stance, but the committee must acknowledge it.
      *   *Bias Check:* "Role-Blind Review" for the initial scoring, or a specific "Empathy Translation" step. Let's go with "Empathy Translation": Explicitly translating the need into universal human terms (e.g., "ability to work" vs. "closure").

  4.  **Refining the Steps (Operationalizing):**

      *   *Step 1: Eligibility & Completeness.* (Binary).
      *   *Step 2: The "Catastrophe" Filter.* Is this life-altering if denied? (Stop condition).
      *   *Step 3: Capacity to Absorb.* Can they pay this themselves without ruin? (Proxy for "worst off").
      *   *Step 4: The Veil Check.* (Bias mitigation).
      *   *Step 5: The Value Toggle.* (Max Good vs. Worst Off).
      *   *Step 6: Decision & Write-up.*

  5.  **Addressing Specific User Constraints:**

      *   *Questions:* Need specific prompts.
      *   *Stop Conditions:* When the request doesn't meet the "Hardship" definition (e.g., convenience vs. necessity).
      *   *Refused Comparisons:* Comparing grief to pain directly. Acknowledge incommensurability.
      *   *Value Separation:* Make the committee vote on the *principle* before the *case*.
      *   *Dimensions:* Convert text to: (1) Urgency, (2) Irreversibility, (3) Financial Absorption Capacity.
      *   *Bias Check:* "The Translation Test."
      *   *Failure Modes:* Where the procedure breaks (e.g., two equally desperate people).

  6.  **Developing the Three Cases:**

      *   *Case 1 (Engineer Chair vs. Warehouse Funeral):*
          *   *Engineering view:* Chair = productivity/chronic pain. Funeral = emotional, one-off.
          *   *Hardship view:* Funeral is time-sensitive, irrecoverable moment. Chair is ongoing but manageable?
          *   *Uncomfortable Outcome:* If we prioritize "Financial Absorption," the Engineer likely earns more. If we prioritize "Irreversibility," the Funeral wins (can't go back in time). Let's make the procedure favor the Funeral (irreversible loss) over the Chair (manageable chronic condition), which might feel "less productive" to engineers. Or vice versa. Let's aim for the procedure to favor the Warehouse Picker (funeral) based on *irreversibility* and *lower absorption capacity*, which might feel "less ROI" to the business but fits "Hardship."
      *   *Case 2 (Senior Engineer Desk vs. Contractor Dental):*
          *   *Clear cut:* Contractor has low pay, dental is health. Senior Engineer has high pay, mild discomfort.
          *   *Procedure Outcome:* Contractor wins on "Capacity to Absorb."
          *   *Uncomfortable part:* The dental is only *partly* covered. Is it worth giving partial funds? Yes, if it prevents debt spirals.
      *   *Case 3 (Stoic Long-term vs. Dramatic New):*
          *   *The Trap:* Self-rated score (4 vs 10).
          *   *Procedure:* Ignore the score. Look at "Adaptation." The long-term sufferer has adapted (bad for "urgency" but good for "severity"?). Actually, adaptation often masks severity.
          *   *Uncomfortable Outcome:* The procedure might favor the *new* sufferer because the *marginal utility* of relief is higher (they haven't adapted yet), leaving the long-term sufferer behind. This is the "Squeaky Wheel" problem. I need to make sure the procedure catches "Chronicity" as a multiplier for severity, otherwise it punishes resilience. Let's make the procedure favor the *Stoic* one because "Capacity to Absorb" is likely lower over 11 years of accumulated cost, OR favor the *New* one because the shock is greater.
          *   *Decision:* Let's make the procedure favor the *New* one (Urgency/Irreversibility of acute phase), which punishes the Stoic. This is the "uncomfortable" one. It highlights the limitation of the fund: it handles emergencies, not chronic systemic support.

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the engineering mindset. No jargon.
      *   *The Theory (Simplified):* Explain why we drop "utils" and use "Capacity" and "Irreversibility."
      *   *The Procedure:* Step-by-step.
      *   *The Value Toggle:* Explicitly state the trade-off.
      *   *The Bias Check:* The "Translation" step.
      *   *The Cases:* Walk through logically.
      *   *The Overrule:* How to document a veto without breaking the system.

  8.  **Refining the "Uncomfortable" Outcome:**

      *   For Case 3, if the procedure favors the "Dramatic New" applicant over the "Stoic Chronic" applicant, it validates the bias the user fears (writing style/urgency bias).
      *   *Correction:* I need the procedure to *correct* for this. If the procedure is good, it should favor the Stoic.
      *   *Better Uncomfortable Outcome:* Case 1. Engineers often view productivity as paramount. If the procedure says "Fund the Funeral (Warehouse) over the Chair (Engineer)" because a funeral is a *unique, non-recoverable life event* whereas a chair is *replaceable equipment*, that might feel like "wasting money on non-work stuff" to an engineering committee.
      *   *Alternative Uncomfortable Outcome:* Case 3. The procedure determines we *cannot* decide between them based on available data. It recommends a split or a coin flip. This is frustrating for engineers who want a deterministic answer.
      *   *Selected Path:* Let's go with Case 3. The procedure identifies that the "Stoic" applicant has normalized their suffering, making the *marginal gain* of funding higher for the "New" applicant. This feels unjust (punishing resilience). I will flag this as the point to overrule.

  9.  **Review against Constraints:**

      *   *90 minutes?* Keep steps tight.
      *   *No training?* Use plain English.
      *   *Works Council proof?* Transparent logic.
      *   *Overrule mechanism?* Needs to be formal.

  10. **Final Polish:** Ensure tone is respectful, precise, and empathetic to the engineer's position (they want to do the right thing but lack the tools).

  *(Self-Correction during drafting)*: I need to make sure I don't just give philosophical advice. I need a *checklist*. I need to explicitly answer "What counts as a sufficient answer."
  Also, the "Value Toggle" needs to be clear. Is this fund for *Equality* (help the poor) or *Efficiency* (help the most impacted)? Hardship funds are usually Equality/Safety. I will hardcode that as the default but allow the override.

  Let's refine the "Dimensions."
  1. **Irreversibility:** If we say no, can this be fixed later? (Funeral = No. Chair = Yes, eventually).
  2. **Absorption Capacity:** Can they pay this without sacrificing essentials? (Contractor = No. Senior Eng = Yes).
  3. **Baseline Severity:** How bad is life right now? (Ignore the 0-10 score).

  Let's refine the "Bias Check."
  "The Role-Strip": Read the application without the Job Title. Does the decision change?

  Let's refine the "Overrule."
  "The Minority Report": If the procedure says X, but the committee votes Y, you must write *why* the procedure failed in this specific instance, not just "we wanted Y."

  Okay, ready to write.
answer: |-
  ## The Hardship Fund Allocation Procedure (v1.0)

  **Purpose:** To allocate discretionary funds fairly, consistently, and transparently, minimizing bias while acknowledging that human suffering cannot be perfectly measured.
  **Audience:** Rotating Committee Members (No philosophy training required).
  **Time Budget:** 90 minutes per meeting.
  **Core Principle:** This fund is a **Safety Net**, not an **Optimization Engine**. We prioritize preventing irreversible harm and supporting those with the least capacity to absorb cost, rather than maximizing total "happiness" or productivity.

  ---

  ### Part 1: Theoretical Simplifications (What We Keep and Drop)

  You asked to operationalize interpersonal utility theory. Here is the engineering translation:

  1.  **Drop:** "Units of Wellbeing." You cannot measure how much pain Person A feels vs. Person B. Do not try.
  2.  **Keep:** "Capacity to Absorb." It is easier to measure financial resilience than pain. A $1,000 cost ruins a low-wage contractor; it inconveniences a senior staff engineer. We use this as a proxy for "need."
  3.  **Keep:** "Irreversibility." Some losses can be fixed later (a chair); some cannot (a funeral, a tooth extraction before infection spreads). We prioritize the irreversible.
  4.  **Drop:** The Applicant's Self-Rated Score (0-10). This is uncalibrated sensor data. A stoic person's 4 is a dramatic person's 9. **Ignore this number completely.**
  5.  **Keep:** The "Veil of Ignorance." If you do not know which applicant you are, which rule would you agree to? This prevents class/job bias.

  **What we lose by simplifying:** We lose the ability to help the "chronically miserable" who have adapted to their suffering (they look stable on paper). We accept this risk because we cannot measure adaptation reliably without medical training.

  ---

  ### Part 2: The Procedure (Step-by-Step)

  Run these steps in order. If an application fails a step, it is rejected. Do not proceed to the next step.

  #### Step 1: The Eligibility & Completeness Check
  *   **Question:** Is the applicant eligible (tenure/role) and is the request for a one-time out-of-pocket cost (not recurring salary supplement)?
  *   **Sufficient Answer:** "Yes, meets tenure; cost is one-off."
  *   **No Answer:** "Eligible, but this looks like a monthly bill." -> **STOP. REJECT.**
  *   **Bias Check:** Are we rejecting recurring costs because they are hard to budget, or because they feel like "salary"? If the recurring cost is medical essentials, flag for Step 4.

  #### Step 2: The Irreversibility Filter
  *   **Question:** If we deny this today, can the problem be solved later with the same outcome?
  *   **Sufficient Answer:** "No. The funeral date is fixed," or "The dental infection will spread."
  *   **No Answer:** "Yes. They can save up for the chair over 6 months."
  *   **Decision:** High Irreversibility = Priority. Low Irreversibility = Lower Priority.
  *   **Write-up:** "Request denied: Cost is deferrable without permanent loss."

  #### Step 3: The Capacity to Absorb (Financial Proxy)
  *   **Question:** Based on role/band/tenure, can this person absorb this cost without sacrificing essentials (rent, food, existing debt)?
  *   **Sufficient Answer:** "Contractor band 1: No," or "Staff Engineer: Yes."
  *   **No Answer:** "We don't know their savings." (Assume based on role band).
  *   **Decision:** Low Capacity = Priority. High Capacity = Lower Priority.
  *   **Refused Comparison:** Do not compare *how much* they suffer. Compare *how much the cost hurts their financial stability*.
  *   **Write-up:** "Request denied: Applicant has high capacity to absorb this cost relative to band."

  #### Step 4: The Role-Strip Bias Check (Crucial)
  *   **Action:** One committee member reads the application text *aloud* but redacts the Job Title and Department.
  *   **Question:** Does the committee's inclination to fund change when the role is unknown?
  *   **Sufficient Answer:** "No, the need stands on its own."
  *   **No Answer:** "Hearing it's a warehouse picker makes me realize I was undervaluing the travel cost."
  *   **Action:** If the inclination changes, you must write a justification specifically addressing why the role *should* matter (e.g., salary band) vs. why it *should not* (e.g., human dignity).

  #### Step 5: The Value Toggle (Fact vs. Value)
  *   **Context:** You have $18k. You have $20k of "Priority" requests (passed Steps 1-4).
  *   **The Choice:** You must choose between two principles. The committee must vote on this principle *before* picking the winner.
      *   **Principle A (Worst-Off First):** Fund the person with the lowest Capacity to Absorb, even if the "impact" is smaller. (Equity)
      *   **Principle B (Most Impact First):** Fund the request that solves the biggest problem, even if the person is better off. (Utilitarian)
  *   **Default:** For a Hardship Fund, **Principle A** is the default.
  *   **Write-up:** "Decision made under Principle A (Worst-Off First)."

  #### Step 6: The Stop Condition (When to Say "No" to Everything)
  *   **Condition:** If funding a request requires inventing a justification that contradicts Steps 2 or 3.
  *   **Action:** Do not fund. Do not write a "nice" rejection.
  *   **Write-up:** "Request does not meet the threshold of irreversibility or financial hardship defined by the fund charter."

  ---

  ### Part 3: Failure Modes & Refused Comparisons

  **1. The "Incommensurable" Problem**
  *   **Scenario:** Comparing grief (funeral) vs. pain (back injury).
  *   **Procedure:** Do not compare the *feelings*. Compare the **Opportunity**.
      *   Funeral: Opportunity to say goodbye (Time-limited).
      *   Back Pain: Opportunity to work without pain (Ongoing).
  *   **Refusal:** We refuse to decide which is "sadder." We decide which opportunity is "non-recoverable."
  *   **Write-up:** "We cannot compare grief to pain. We prioritized the time-sensitive opportunity."

  **2. The "Stoic" Problem**
  *   **Scenario:** Long-term sufferers under-report need.
  *   **Failure Mode:** The procedure will systematically under-fund chronic conditions because they look "stable."
  *   **Mitigation:** In Step 3, treat "Duration > 1 Year" as a negative factor for Capacity to Absorb (accumulated cost).
  *   **Write-up:** "Acknowledged risk of under-funding chronic adaptation."

  **3. The "Overrule" Mechanism**
  *   **Scenario:** The procedure outputs a decision the committee morally cannot accept.
  *   **Action:** You may overrule the procedure **once per quarter**.
  *   **Requirement:** You must file a "Deviation Report." It must state: "The procedure yielded X. We chose Y. The procedure failed because [specific constraint, e.g., 'Capacity to Absorb did not capture hidden debt']."
  *   **Constraint:** You cannot overrule simply because "we felt like it." You must identify the bug in the procedure.

  ---

  ### Part 4: Running the Procedure on Your Cases

  Here is the procedure applied to your three scenarios. I have selected **Case 3** to produce the uncomfortable outcome, as requested.

  #### Case 1: Engineer Chair ($900) vs. Warehouse Funeral ($1200)
  *   **Step 1 (Eligibility):** Both pass.
  *   **Step 2 (Irreversibility):**
      *   Chair: Low. Pain is chronic; a chair can be bought later.
      *   Funeral: High. The event is time-bound. Missing it is permanent.
      *   *Winner:* Funeral.
  *   **Step 3 (Capacity):**
      *   Engineer: High capacity (Staff level).
      *   Warehouse: Lower capacity (Picker band).
      *   *Winner:* Warehouse.
  *   **Step 4 (Bias Check):** Reading the funeral request without "Warehouse" label. It remains a request to see a parent one last time. The need holds.
  *   **Step 5 (Value Toggle):** Principle A (Worst-Off).
  *   **Decision:** **Fund the Warehouse Picker.**
  *   **Write-up:** "Funded: Travel for funeral. Prioritized based on irreversibility of the event and lower financial capacity to absorb cost. The ergonomic chair, while beneficial for chronic pain, is a deferrable capital expense that does not carry the same time-sensitive permanent loss."
  *   **Committee Feel:** This may feel "less productive" to engineers, but it aligns with the Safety Net mandate.

  #### Case 2: Senior Desk (Mild) vs. Contractor Dental (Severe)
  *   **Step 1 (Eligibility):** Both pass.
  *   **Step 2 (Irreversibility):**
      *   Desk: Low. Discomfort is mild/recent.
      *   Dental: High. Health degradation is often non-linear (infection risk).
      *   *Winner:* Dental.
  *   **Step 3 (Capacity):**
      *   Senior Eng: High.
      *   Contractor (Lowest Band): Low.
      *   *Winner:* Dental.
  *   **Step 5 (Value Toggle):** Principle A.
  *   **Decision:** **Fund the Contractor (Partial).**
  *   **Note:** Even if we can't cover the full 3x cost, we fund the portion that prevents the immediate health risk.
  *   **Write-up:** "Funded: Partial contribution toward emergency dental. Prioritized based on acute health risk and low capacity to absorb cost. Applicant's salary band indicates high risk of debt spiral from this expense. Senior engineer request deferred due to lower severity and higher absorption capacity."

  #### Case 3: Stoic Chronic (11 Years, Score 4) vs. Dramatic New (1 Month, Score 10)
  *   **Step 1 (Eligibility):** Both pass.
  *   **Step 2 (Irreversibility):**
      *   Stoic: Low/Medium. They have lived with it 11 years. It is "managed."
      *   Dramatic: High. Acute phase. Unmanaged.
      *   *Winner:* Dramatic.
  *   **Step 3 (Capacity):**
      *   Stoic: Unknown, but 11 years of costs implies resilience or accumulated debt. Procedure assumes resilience if no debt disclosed.
      *   Dramatic: Shock cost. High impact on current budget.
      *   *Winner:* Dramatic.
  *   **Step 4 (Bias Check):** The "Dramatic" writing style is more persuasive. The Role-Strip reveals the Stoic's text is understated.
      *   *Correction:* We must explicitly note that "Adaptation" masks need. However, under Step 2, the *urgency* is lower for the Stoic.
  *   **Step 5 (Value Toggle):** Principle A (Worst-Off).
  *   **Procedure Decision:** **Fund the Dramatic New Applicant.**
  *   **Why this is uncomfortable:** It punishes resilience. The person who suffered longer and complained less is deprioritized because their suffering looks "stable."
  *   **Write-up:** "Funded: Acute request. Prioritized based on immediacy of harm and lack of adaptation. The chronic request, while significant, describes a stabilized condition. Under current constraints, we must triage acute crisis over chronic management."
  *   **Overrule Recommendation:** **This is the case you should overrule.**
      *   **Reason:** The procedure fails to account for "Accumulated Burden." A person living with pain for 11 years has a lower *lifetime* capacity to absorb than someone with 1 month of pain, even if the acute crisis is lower.
      *   **Deviation Report:** "Procedure yielded funding for Acute Applicant. Committee overruled to fund Chronic Applicant. Reason: The 'Irreversibility' metric penalizes successful coping mechanisms. Long-term adaptation is not evidence of low need, but of high resilience. Funding the chronic case prevents total system collapse of the individual's health, which is a higher long-term risk than the acute shock."

  ---

  ### Part 5: Summary of Dimensions for the Shared Document

  When you rewrite the free-text into the shared document, use these three fields only. Do not add more.

  1.  **Irreversibility:** [High / Medium / Low]
      *   *Definition:* Can this be fixed later with the same result?
  2.  **Absorption Capacity:** [Low / Medium / High]
      *   *Definition:* Based on role/tenure, does this cost threaten essentials?
  3.  **Bias Flag:** [Yes / No]
      *   *Definition:* Did the Role-Strip change our view? If Yes, explain.

  **Example Entry (Case 1 Winner):**
  *   **Irreversibility:** High (Event date fixed).
  *   **Absorption Capacity:** Low (Warehouse band).
  *   **Bias Flag:** No (Need holds without role title).
  *   **Decision:** Fund.
  *   **Justification:** Time-sensitive loss outweighs deferrable equipment cost.

  ### Final Advice for the Engineer

  You cannot build a perfect system. You are building a **leaky bucket** designed to catch the most water possible.
  1.  **Trust the Procedure, not the Gut:** Your gut is biased toward people who talk like you. The procedure is biased toward data you can see.
  2.  **Document the Overrule:** If you break the rules (like in Case 3), write it down. That is how you patch the software for the next committee.
  3.  **Accept the "No":** You have $18k and $60k of need. You will say no to valid hardship. That is not a failure of your procedure; it is a failure of the budget. Do not write apologies in the justification. Write the constraint. "Denied due to fund cap, not lack of merit."

  This spec gives you defensibility against the Works Council (consistent logic), protection against the Head of People (you aren't just ranking scores), and moral cover for yourself (you followed the agreed algorithm).
