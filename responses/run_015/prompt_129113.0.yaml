  **Section 3. Cruxes**

  **Crux 1: Dimensionality of Status**
  *Sub-question:* Is moral status one-dimensional such that any two systems are comparable, or is it a partial order allowing incomparability?
  *Movement:* GS requires comparability to maintain a continuous function; CT allows incomparability if subjecthood is binary but quality varies.
  *Case:* Compare The Spike (high intensity, zero depth) against The Drone (low intensity, high depth).
  *Predictions:* GS predicts one is definitively higher status than the other based on composite scoring. CT predicts they may be incomparable if both are above the threshold, or that The Spike lacks status entirely.
  *Evidence Against:* GS would concede if intuition strongly favors incomparability despite composite metrics. CT would concede if forced trade-offs always yield a consistent ranking.

  **Crux 2: Evidence for Thresholds**
  *Sub-question:* Is there any possible empirical evidence that could settle the existence of a constitutive threshold?
  *Movement:* GS holds that smooth physical variance implies smooth moral variance; CT holds that discrete functional integration implies discrete moral standing.
  *Case:* The Dimmer, where affective intensity is continuously attenuated toward zero.
  *Predictions:* GS predicts moral reasons diminish smoothly to zero. CT predicts reasons remain constant until a sudden drop when subjecthood fails.
  *Evidence Against:* GS would concede if a specific neural integration level consistently correlates with a sudden shift in moral intuition. CT would concede if no such correlation exists across varied architectures.

  **Crux 3: Deontic Scaling**
  *Sub-question:* Do deontic constraints against harm scale with the degree of welfare at stake?
  *Movement:* GS ties constraints directly to status degree; CT ties constraints to patienthood regardless of intensity.
  *Case:* An intervention affecting The Dimmer at high intensity versus low intensity.
  *Predictions:* GS predicts stronger constraints at high intensity. CT predicts identical constraints provided the system remains above the threshold.
  *Evidence Against:* GS would concede if constraints are judged identical despite vast intensity differences. CT would concede if constraints are judged weaker at lower intensities.

  **Section 4. Final Statement**

  The parties disagree on whether moral patienthood is a binary condition preceding weight or a scalar property constituting weight.

