answer: |-
  # The Boundary Risk Protocol (BRP)

  **Purpose:** To replace arbitrary threshold selection with a risk-aware decision process that acknowledges vagueness (the Sorites problem) without requiring philosophical expertise.
  **Timebox:** 30 minutes per predicate.
  **Participants:** Engineering team + Product Owner (for sign-off).
  **Output:** A completed "Threshold Audit Record" (template provided below).

  ## The Method (Flowchart in Words)

  **Step 1: Anchor the Extremes**
  *   **Action:** Identify two values for the metric where classification is uncontroversial.
  *   **Info Needed:** Historical data or system constraints.
  *   **Check:** Can everyone agree Value A is definitely "False" and Value B is definitely "True"?
  *   **If No:** Stop. You do not understand the metric. Gather more data.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: Assess Harm Asymmetry**
  *   **Action:** Compare the cost of a False Positive (FP) vs. a False Negative (FN).
      *   *FP:* System triggers when it shouldn't (e.g., blocking a good user).
      *   *FN:* System fails to trigger when it should (e.g., allowing a bad actor).
  *   **Info Needed:** Product impact analysis, support ticket costs, stability risks.
  *   **Check:** Is one error type significantly more costly (10x+) or legally/ethically sensitive?
  *   **If Yes (High Asymmetry or Legal/Ethical Risk):** **STOP.** Defer to Product/Legal. Do not automate the final decision. Engineering can build the tool, but business must own the threshold.
  *   **If No (Symmetric or Low Risk):** Proceed to Step 3.

  **Step 3: Define the "Gray Band" (Buffer Zone)**
  *   **Action:** Acknowledge that the transition is not a line but a zone. Define a range between your Anchors where classification is unreliable.
  *   **Info Needed:** Variance in data, measurement noise.
  *   **Check:** Is the cost of misclassification in this zone acceptable if automated?
  *   **If No:** You must implement a **Buffer State** (e.g., "Warning," "Quarantine," "Probation") rather than a binary switch.
  *   **If Yes:** You may proceed with a binary switch, but logging is mandatory.
  *   **Decision:** Select the width of the Gray Band.

  **Step 4: Select the Cutpoint**
  *   **Action:** Pick the specific number that triggers the *hard* action.
  *   **Justification Rule:** The number must be justified by **Risk Mitigation**, not mathematical convenience.
      *   *Bad:* "100 is a round number."
      *   *Good:* "100 allows a 20% margin above the observed normal peak of 80."
  *   **Info Needed:** Distribution of data near the threshold.
  *   **Check:** Does the Product Manager agree that the risk at this specific number is acceptable?
  *   **If No:** Revise Step 3 or 4.
  *   **If Yes:** Proceed to Step 5.

  **Step 5: Observability & Escape Hatch**
  *   **Action:** Define how you will monitor the Gray Band and how a human can override.
  *   **Info Needed:** Logging capabilities, admin tool access.
  *   **Requirement:** You must log every decision that falls within or near the Gray Band. You must have a manual override mechanism.
  *   **Output:** Complete the Threshold Audit Record.

  ---

  ## Threshold Audit Record (Template)

  ```text
  PREDICATE: [Name]
  DATE: [YYYY-MM-DD]
  ENGINEERS: [Names]
  PRODUCT OWNER: [Name]

  1. ANCHORS: Definitely False = [Value]; Definitely True = [Value]
  2. HARM ASYMMETRY: [FP Cost] vs [FN Cost]. High Asymmetry? [Y/N]
  3. GRAY BAND: Range [Value X] to [Value Y]. Strategy: [Binary / Buffer / Human Review]
  4. CUTPOINT: [Value]. RATIONALE: [Risk-based explanation, not round numbers]
  5. OBSERVABILITY: [Log metric name], [Dashboard link], [Override mechanism]
  ```

  ---

  ## Application to Case Studies

  ### Case 1: API Client Excessive Use
  *   **Context:** 10 rpm (routine) vs. 10,000 rpm (threat). Need warning threshold.
  *   **Step 1 (Anchors):** False = 50 rpm. True = 5,000 rpm.
  *   **Step 2 (Harm):**
      *   FP (Warn a good client): Annoyance, support tickets.
      *   FN (Miss a bad client): Stability risk, outage.
      *   *Asymmetry:* FN is much worse (outage vs. ticket).
  *   **Step 3 (Gray Band):** Because FN is worse, we must catch threats early. However, vagueness exists between 500 and 2,000 rpm.
      *   *Strategy:* **Buffer State.** Do not jump from "OK" to "Blocked." Implement "OK" -> "Warning" -> "Throttled."
  *   **Step 4 (Cutpoint):**
      *   Warning Threshold: 500 rpm. (Rationale: 10x normal baseline, allows time to react before stability risk).
      *   Hard Block: 2,000 rpm. (Rationale: Point where database lock contention becomes probable).
  *   **Step 5 (Observability):** Log all clients entering "Warning" state. Alert on volume of warnings (indicates threshold too low).
  *   **Recommendation:** Implement a hysteresis loop. A client enters "Warning" at 500 rpm but does not return to "OK" until dropping below 300 rpm. This prevents flapping at the boundary.
  *   **Audit Record Snippet:** `CUTPOINT: 500 (Warning), 2000 (Block). RATIONALE: 500 provides 4x safety margin over baseline peak of 120 observed in prod.`

  ### Case 2: Archiving Inactive Accounts
  *   **Context:** 1 day (active) vs. 12 months (inactive).
  *   **Step 1 (Anchors):** False = 30 days. True = 365 days.
  *   **Step 2 (Harm):**
      *   FP (Archive active user): User loses data, high anger, reputational damage.
      *   FN (Keep dead account): Storage cost (low).
      *   *Asymmetry:* **Extreme.** FP is catastrophic compared to FN.
  *   **Step 3 (Gray Band):**
      *   *Stop Condition:* Due to extreme asymmetry and potential data loss (legal/contractual implications), this triggers the **STOP** rule in Step 2.
      *   *Strategy:* Engineering cannot set the final cutoff alone. Product/Legal must define the "Right to Delete" window.
  *   **Step 4 (Cutpoint):**
      *   Notification Threshold: 11 months.
      *   Archival Threshold: 13 months (with re-login reset).
      *   *Rationale:* The buffer (11-13 months) is a "Grace Period" where the user is notified and can reset the timer.
  *   **Step 5 (Observability):** Log every account sent a notification. Track % of users who log in after notification (validates the threshold).
  *   **Recommendation:** Do not automate the *deletion* based solely on time. Automate the *notification*, then require a second pass after a 30-day grace period.
  *   **Audit Record Snippet:** `HARM ASYMMETRY: High (Data Loss). STRATEGY: Buffer/Grace Period. CUTPOINT: 365 days + 30 day notice.`

  ### Case 3: Image Sharpness Rejection (The Unwelcome Result)
  *   **Context:** Score 0-1000. Team wants full automation, no human review.
  *   **Step 1 (Anchors):** False (Blurry) = 100. True (Sharp) = 900.
  *   **Step 2 (Harm):**
      *   FP (Reject good image): User frustration, upload abandonment.
      *   FN (Accept bad image): Degraded site quality.
      *   *Asymmetry:* Moderate, but subjective.
  *   **Step 3 (Gray Band):**
      *   Image quality is inherently subjective (vagueness is high). A score of 450 might look fine on mobile but bad on desktop.
      *   *Constraint Check:* Team wants "no human review."
      *   *Protocol Verdict:* **Fail.** The vagueness of "blurry" combined with a hard rejection creates high user friction. A hard cutoff in a high-vagueness zone is technically fragile.
  *   **Step 4 (Cutpoint):**
      *   *Unwelcome Recommendation:* **You cannot fully automate this with a single hard cutoff.**
      *   *Required Strategy:* Implement a **Probationary Acceptance** zone (Score 300-500). Images in this zone are accepted but flagged.
      *   *Why:* If you reject at 400, you will inevitably reject acceptable images (FP). If you accept at 400, you accept bad ones (FN).
  *   **Step 5 (Observability):**
      *   Log all images in the Probationary Zone.
      *   Sample 5% of Probationary images for human review weekly to tune the model.
  *   **Recommendation:** Reject < 300. Auto-Accept > 500. **Quarantine 300-500.** (This violates the "no human review" hope, but the Protocol flags the risk of a hard line here as unacceptable).
  *   **Audit Record Snippet:** `STRATEGY: Quarantine Buffer. CUTPOINT: <300 (Reject), 300-500 (Flag), >500 (Accept). RATIONALE: Vagueness of "sharpness" requires sampling to prevent user churn.`

  ---

  ## Limitations and Failure Modes

  This method does not solve the Sorites Paradox; it manages the business risk associated with it. Engineers must be aware of where this protocol will misfire:

  1.  **Adversarial Environments:** If actors know your threshold (e.g., API rate limits), they will optimize to stay just below the Gray Band (e.g., 499 rpm). The BRP assumes non-adversarial data. For security, thresholds must be secret or dynamic, which complicates the "Audit Record."
  2.  **Shifting Distributions:** The "Anchors" defined today may shift tomorrow (e.g., client traffic patterns change). The Audit Record is a snapshot, not a permanent truth. You must schedule a quarterly review of the "Gray Band" volume. If >10% of traffic falls in the Gray Band, the threshold is wrong.
  3.  **Ethical Value Judgments:** The BRP treats "Harm" as a cost calculation. It cannot resolve ethical dilemmas (e.g., denying service to a marginalized group due to proxy metrics). If a predicate touches on fairness or access, the "Stop" condition in Step 2 must be enforced rigorously; engineering cannot calculate ethical risk.
  4.  **False Precision:** The Audit Record creates a paper trail that looks definitive. Do not let the existence of the record convince stakeholders that the boundary is "real." It is a policy decision disguised as a technical one. Remind PMs: "The line is arbitrary; the buffer is the safety."

  ## Summary for the Team
  *   **Don't** look for the "true" number. It doesn't exist.
  *   **Do** look for the "safest" number given the cost of error.
  *   **Always** build a buffer state (Warning/Quarantine) for high-vagueness predicates.
  *   **Always** log the borderline cases. If you aren't measuring the Gray Band, you are flying blind.
