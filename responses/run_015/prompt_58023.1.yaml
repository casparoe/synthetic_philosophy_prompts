  10. **Review against Constraints:**
      *   30 mins? Yes, the steps are quick checks.
      *   6 Engineers? Yes, language is technical.
      *   Audit Record? Yes, included in the protocol.
      *   Explainable to PM? Yes, focuses on risk/cost.
      *   Unwelcome recommendation? Yes, in Case 3 (no full automation) or Case 1 (hysteresis complexity). I'll put the heavy friction in Case 3.
      *   Flowchart in words? Yes, the Protocol section.

  11. **Final Polish:**
      *   Ensure the distinction between "Fact" (engineering) and "Value" (product/legal) is clear in the Stop conditions.
      *   Make sure the "Audit Record" template is concrete.
      *   Check tone: Professional, pragmatic, empathetic to engineering constraints.

  *(Self-Correction during drafting)*: I initially thought about suggesting human review for Case 3. But the prompt says "Team hopes for full automation." If I say "Add human review," that's unwelcome. If I say "Add a buffer zone where we accept but tag," that's also unwelcome engineering work but safer. I will recommend a "Soft Rejection" or "Buffer Zone" which violates their "clean cutoff" desire. Let's make sure the "Unwelcome" part is explicit.
  Actually, the prompt asks for *at least one* case where the method recommends something unwelcome. Case 3 is the best candidate because "full automation" on a subjective quality metric is inherently risky due to vagueness. I will recommend a "Quarantine/Review" bucket for the borderline, which breaks their "no human review" constraint.

  Let's refine the "Method" to be very crisp.
  Step 1: Anchor.
  Step 2: Harm Asymmetry.
  Step 3: The Buffer Decision.
  Step 4: The Line.
  Step 5: Observability.
  Stop Rule: If Harm is Ethical/Legal -> Defer.

  Okay, ready to write.

  *(Final Check on Case 3)*: The prompt says "The team hopes for full automation here, with no human review." If my method says "You must have human review for borderline," that satisfies the "unwelcome" constraint. I will ensure this is clear.

  *(Final Check on Audit Record)*: Needs to be brief. A structured text block.

  *(Final Check on Limitations)*: Be honest. This doesn't solve the paradox; it manages the business risk of it.

