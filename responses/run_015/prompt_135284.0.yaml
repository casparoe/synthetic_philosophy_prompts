      *   *Endurantist Solutions:* Adverbialism (has $P$-at-$t1$), Relationalism (has $P$ relative to $t1$), or Presentism (only $t1$ exists now).
      *   *Verdict on AI:* The *copying* is the bigger threat than the corruption. If the process involves destruction of the original and creation of a new instance from data, an Endurantist typically calls this "succession," not "persistence." The 2% change just makes it a *qualitatively* different successor.

