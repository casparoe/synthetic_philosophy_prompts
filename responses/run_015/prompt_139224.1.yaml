answer: |-
  1. Open with **radiologists estimating tumor size from the identical digital scan**. This isolates the 'shared record' problem better than a courtroom.

  2. Establish prerequisites: Binary fact (Yes/No) and individual competence (p > 0.5). Clarify that aggregate accuracy depends on individual competence exceeding chance, not the group's wisdom alone *(heads off: what is needed is each member better than chance rather than the group's aggregate)*. Warn that if average p < 0.5, adding members drives accuracy to zero *(heads off: adding members always improves accuracy however weak they are)*.

  3. Define independence. Explicitly separate non-communication from statistical independence. Explain that reading the same chart creates correlated errors (common cause), violating independence even if silent. Mark where deliberation helps: only when pooling *separate* evidence (e.g., nurse vs. doctor observations), not when re-interpreting the same record which manufactures correlation *(heads off: vindicates majority rule as such)*.

  4. Address the 'avoidable death' question. Place this immediately after independence. State clearly: CJT tracks objective truth, not normative standards. If the verdict relies on judging 'standards of care' rather than facts, the theorem has no purchase. This limitation is **load-bearing**, not a footnote; applying CJT to normative judgments is a category error that invalidates the math.

  5. Distinguish from Condorcet's intransitive-majorities problem. Note that CJT applies to binary truth-tracking, not ranking preferences *(heads off: same result as the intransitive-majorities problem)*.

  6. Emphasize epistemic humility. The theorem is a conditional license, not a validation of the specific verdict. It does not prove the committee was right, only that the process *would* work if assumptions held *(heads off: theorem shows our committee was right)*.

  7. Decline to cover: Weighted voting schemes, models of correlated error, or Bayesian updating. These require probability training they lack.

  8. Close with this question: "If we all read the same chart, does adding a second reviewer double our evidence or just our confidence?"
