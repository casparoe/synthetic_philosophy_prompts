prompt: |-
  Hey, quick ethics thing. My neighbor is always on my case about leaving my porch light on all night — she says it kills moths and wastes electricity. But she runs massive grow-lights 24/7 in her basement for orchids, and sprays pesticides in her yard that definatly kill more insects than my bulb ever could. I told her she can't lecture me when she's way worse, and she said that doesn't change the fact that my light is still bad, plus her orchids are her livelihood and mine is just laziness. I feel like there's something unfair about being called out by someone who's a bigger offender, but maybe I'm wrong? Does being worse at the exact same thing take away someone's right to blame you, or are those two different questions? And does the "it's my job" part actually change whether she gets to call me out?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Issue:** A conflict between neighbors regarding environmental/ethical behavior (porch light vs. grow lights/pesticides).
      *   **User's Position:** Feels it's unfair to be criticized by someone who does "worse" things (hypocrisy argument).
      *   **Neighbor's Position:** The user's action is still bad regardless of her actions; her actions are justified by livelihood (necessity), user's are laziness (convenience).
      *   **Ethical Questions:**
          1.  Does being a "worse offender" remove the right to criticize? (Tu Quome fallacy vs. moral standing).
          2.  Are these two different questions (consistency vs. correctness)?
          3.  Does "livelihood" vs. "laziness" change the moral weight?

  2.  **Deconstruct the Ethical Concepts:**
      *   **Tu Quoque (Appeal to Hypocrisy):** This is the logical fallacy of dismissing an argument because the speaker is inconsistent. *Key insight:* Just because someone is hypocritical doesn't make their factual claim wrong.
      *   **Moral Standing/Clean Hands:** Does one need to be perfect to criticize? Generally, no. However, credibility is damaged.
      *   **Consequentialism (Utilitarianism):** Which action causes more harm? (Moths/electricity vs. pesticides/livelihood).
      *   **Deontology (Duty/Rules):** Is leaving the light on inherently wrong? Is spraying pesticides inherently wrong?
      *   **Necessity vs. Convenience:** The neighbor's argument hinges on this. Livelihood (survival/income) usually outweighs convenience (laziness) in ethical weighting.

  3.  **Evaluate the Specific Claims:**
      *   *Claim 1: Porch light kills moths/wastes electricity.* Factually true (to a degree).
      *   *Claim 2: Grow lights/pesticides are worse.* Plausible. Pesticides are generally more harmful to ecosystems than a single bulb.
      *   *Claim 3: Livelihood vs. Laziness.* This is the crux of the *justification*, not the *fact*.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the frustration. It *feels* unfair to be nagged by a hypocrite.
      *   **Logical Fallacy (Tu Quoque):** Explain that "you do it too" doesn't make the original claim false. The light *does* waste electricity and kill moths, regardless of her lights.
      *   **Moral Standing vs. Factual Accuracy:** Distinguish between "Is she right?" and "Does she have the right to say it?" She is factually right, but her moral authority is shaky.
      *   **The "Livelihood" Argument:** Address the justification. Ethical frameworks often weigh necessity higher than convenience. If she *needs* the lights to eat, and you *want* the light for... ambiance? (or just forgetting), the ethical weight differs.
      *   **The "Worse Offender" Argument:** Compare the harms. Pesticides are likely worse, but that doesn't negate the harm of the light. Two wrongs don't make a right.
      *   **Practical Advice:** How to resolve the conflict? (Compromise, motion sensor, etc.)

  5.  **Refining the Tone:**
      *   Needs to be neutral, analytical, but empathetic.
      *   Avoid taking sides definitively, but clarify the ethical principles.
      *   Ensure the distinction between *logical validity* and *moral credibility* is clear.

  6.  **Self-Correction/Nuance Check:**
