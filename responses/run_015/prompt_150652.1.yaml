answer: |-
  Editorial Note: I cut "Symmetry of Treatment" (a disguised Actor-Network preference) and "Predictive Utility" (a disguised Positivist preference); neither is required for retrospective historical explanation, and symmetry obscures the ontological difference between pathogens and beliefs.

  ### Requirements for an Account of Non-Human Causation in History

  1.  **Contextual Contingency**
      *   **Motivating Case:** Case 2 (Eruption with no trace) vs. Case 1 (Tambora).
      *   **Argument:** A forcing of identical geophysical magnitude must be allowable to produce divergent historical outcomes depending on the state of the human system (population density, trade integration,储备). An account that treats the volcanic forcing as sufficient cause *simpliciter* fails Case 2. The requirement is non-negotiable because proxy records confirm forcings occur without historical signal; the variance must be located in the receiver, not the signal.
      *   **Status:** Non-negotiable.

  2.  **Institutional Mediation**
      *   **Motivating Case:** Case 3 (Potato Blight) and Case 4 (Black Death).
      *   **Argument:** Non-human causes rarely act directly on macro-historical outcomes (e.g., end of serfdom); they act through institutional filters (property law, labor markets, grain export policy). An account must specify the transmission mechanism, not just the correlation. Without this, the explanation collapses into environmental determinism. This is non-negotiable because Case 3 demonstrates mortality cannot be explained by the pathogen alone given continued grain export.
      *   **Status:** Non-negotiable.

  3.  **Ontic/Epistemic Separation**
      *   **Motivating Case:** Case 5 (Cholera/Miasma).
      *   **Argument:** The account must distinguish between the causal efficacy of the *real* non-human entity (Vibrio cholerae) and the causal efficacy of the *belief* about that entity (miasma). Both produce real effects (quarantine policy), but conflating them prevents us from explaining why some policies failed to stop mortality while others succeeded. This is non-negotiable; conflating ontology with epistemology renders sanitary science unintelligible.
      *   **Status:** Non-negotiable.

  4.  **Recursive Feedback Capacity**
      *   **Motivating Case:** Case 6 (Looped Case: Cooling/Plague and Conquest/CO2).
      *   **Argument:** The account must permit causation to flow Human → Earth → Human. If non-human factors are only ever initial conditions, the CO2 dip legible in ice cores becomes inexplicable within historical time. The system must be modeled as coupled, not linear. This is negotiable only if one restricts "history" to pre-Anthropocene events, but given Case 6, it should be treated as non-negotiable for a general theory.
      *   **Status:** Non-negotiable.

  5.  **Evidential Anchoring**
      *   **Motivating Case:** User Constraint (Proxy records).
      *   **Argument:** A claim of non-human causation must specify what proxy or documentary difference would count against it. If an account allows a volcanic forcing to be causally significant even if no ice-core sulfate spike or tree-ring anomaly exists, it is metaphysics, not history. This is the most exclusionary requirement (see below).
      *   **Status:** Non-negotiable.

  6.  **Deflated Agency (Transformation vs. Intention)**
      *   **Motivating Case:** User Constraint (Actor vs. Cause).
      *   **Argument:** Nothing beyond causation is required to call something an "actor," provided we define "actor" pragmatically rather than ontologically. An non-human entity is an "actor" if it possesses *transformational capacity*—it alters the trajectory of human projects in a way not fully reducible to human intention (e.g., a pathogen evolving resistance). We do not need goal-directedness or answerability to interpretation. This preserves the utility of "actor" talk without smuggling in animism.
      *   **Status:** Negotiable (a strict causal realist could deny the term "actor" entirely without loss of explanatory power).

  ### Incompatible Requirements

  **Tension:** **Ontic/Epistemic Separation** (Req 3) vs. **Symmetrical Agency** (implicit in some Actor-Network interpretations of Req 6).
  **Conflict:** If one insists that miasma beliefs and cholera bacteria are "symmetrical actants" (both equally constitute the network), one cannot maintain the ontic distinction required to explain why sanitation based on germ theory worked better than sanitation based on miasma theory.
  **Resolution:** I keep **Ontic/Epistemic Separation**. Symmetry is a methodological heuristic, not an ontological fact. In Earth-system science and epidemiology, the distinction between the model and the terrain is fatal if ignored. An account that cannot distinguish between a real forcing and a believed forcing cannot explain differential survival rates.

  ### Most Exclusionary Requirement

  **Evidential Anchoring (Req 5).**
  This eliminates any account that relies on "invisible" forcings or purely conceptual actors that leave no trace in the proxy or documentary record. It rules out speculative climate determinism that cannot be tied to specific stratigraphic or isotopic events. It demands that historical causation be tethered to physical evidence, which many philosophical narratives ignore.

  ### Verdict on Vulnerability Window and Channeling

  These are **genuine desiderata**, not disciplinary prejudices.
  *   **Vulnerability Window:** This is simply the operational definition of **Contextual Contingency** (Req 1). It does not concede the anti-determinist case; it specifies the *boundary conditions* of determination. A forcing determines an outcome *given* a specific state of social slack.
  *   **Channeling:** This is the operational definition of **Institutional Mediation** (Req 2). It acknowledges that energy flows (calories, labor) are directed by social structures.
  *   **Conclusion:** Incorporating these does not weaken causal claims; it strengthens them by preventing over-generalization. They are the mechanisms by which non-human causation becomes historical rather than merely geological.

  ### Assessment of Main Families

  | Family | Contextual Contingency | Institutional Mediation | Ontic/Epistemic Separation | Feedback Capacity | Evidential Anchoring | Deflated Agency |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Environmental Determinism** | **Fail** (Treats forcing as sufficient) | **Fail** (Ignores institutions) | Pass | Fail (Linear) | Pass | Fail (Often animistic or strictly mechanistic) |
  | **Possibilism** | Pass | **Weak** (Too vague on mechanism) | Pass | Fail | Pass | Pass |
  | **Counterfactual / Difference-Making** | Pass | Pass | Pass | **Weak** (Hard to model loops) | Pass | Pass |
  | **Actor-Network (ANT)** | Pass | Pass | **Fail** (Symmetry collapses distinction) | Pass | **Weak** (Trace often textual, not proxy) | Pass (But inflates agency) |
  | **Earth-System / Anthropocene** | Pass | **Weak** (Often aggregates society) | Pass | Pass | Pass | Pass |

  **Notes on Table:**
  *   **Determinism** fails primarily on Case 2 (Eruption without trace).
  *   **ANT** fails on Case 5 (Cholera); treating belief and pathogen as symmetrical actants obscures why one kills and the other does not.
  *   **Earth-System** narratives often succeed on physics (Case 1, 6) but struggle with Case 3 (Policy details like grain export), treating "humanity" as a monolith rather than a set of conflicting institutions.
  *   **Counterfactual** accounts are robust but often lack the physical machinery to explain *how* the counterfactual world differs geophysically.
