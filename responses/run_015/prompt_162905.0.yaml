  Hi — I'm putting together problem sets for an undergrad course I'm TAing on collective decision-making (committees, juries, review panels, that kind of thing), and I want one worked case that's more interesting than the stuff already in the lecture notes. I keep arguing with my roommate, who does stats and thinks the whole Condorcet jury theorem is just a binomial tail bound with a story attached, about which assumption is really doing the work: the "each voter is better than a coin flip" part, or the independence part. The usual examples we've both seen (everyone defers to the first person who speaks, or everyone is looking at the same misleading clue) are too easy — students just say "well, obviously, correlated votes" and move on. So I want a case that pulls in the opposite direction, where the individual numbers look bad and the group still comes out good.

  Build me that case. Ordinary setting — a hospital review board, a grant panel, a hiring committee, a citizen jury, whatever — one paragraph, no sci fi, nobody coordinating votes or looking over each other's shoulders, no lineup where one or two people are secretly brilliant and everyone else is noise, no weighted voting or strategic abstention, and nobody needs to know how reliable anybody else is. The three specs it has to hit:

  - every voter is genuinely worse than useless on their own: their overall probability of voting for the correct one of the two options, before you condition on anything, has to be strictly below 1/2, and that has to be true of each of them rather than being an average that a few bad voters drag down;
  - a majority vote of a group of a size a real committee could actually have — say somewhere between 20 and 300 people, not thousands — still lands on the right answer comfortably more than 70% of the time;
  - whatever makes this work has to fall out of the story itself, from how the voters' information gets produced, not from me just announcing that the votes are correlated or dropping a correlation device into the setup.

  After the scenario, please do the rest in American English (spelling and idiom both): give me the actual numbers — the probability that a given voter is right marginally and conditional on whatever the shared factor is, the group size, and the resulting majority accuracy, with the arithmetic shown so I can check it, normal approximation is fine; point at the single feature of the case that's doing the work and say why; show what happens to the majority's accuracy if you remove that feature and change nothing else (I think it collapses in a particular direction — confirm me or correct me); and then be honest about the pushback. My roommate's line is going to be that competence should be measured conditional on the common evidence, that independence holds once you condition on it, and that my case is just Simpson's paradox dressed up as a jury. Tell me how strong that reply is, whether it rescues the practical lesson people normally draw from the theorem for the setting you chose, and flag anything in your own construction that you think is slightly a cheat or that a sharp student would call out. And if you think the three specs can't be satisfied together without something contrived, say that plainly and tell me which one has to give — I'd much rather have that than a case that quietly stipulates the verdict. Don't bother with a bibliography or citations, I'll drop those in myself.
