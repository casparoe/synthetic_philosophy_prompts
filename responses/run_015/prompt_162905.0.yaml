  **The Scenario**

  Consider a hospital Morbidity and Mortality review board tasked with determining whether patient deaths were preventable (Yes/No). The board consists of 51 attending physicians who review cases independently without discussing them. Unbeknownst to them, 80% of cases come from a standard electronic health record (EHR) system where charts are clear and their medical expertise yields a 60% individual accuracy rate. The remaining 20% of cases come from a legacy EHR module with a subtle, systematic bug that inverts specific lab result flags; in these cases, the doctors are confidently misled by the data and vote incorrectly 95% of the time (5% accuracy). The doctors cannot distinguish which system generated the chart before voting, and the case type is random and independent of the actual preventability of the death.

  **The Numbers**

  *   **Group Size ($N$):** 51 voters.
  *   **Conditional Competence:**
      *   Standard Case (Prob = 0.80): $p_{std} = 0.60$.
      *   Bug Case (Prob = 0.20): $p_{bug} = 0.05$.
  *   **Marginal Individual Competence:**
      *   $p_{marginal} = (0.80 \times 0.60) + (0.20 \times 0.05) = 0.48 + 0.01 = \mathbf{0.49}$.
      *   *Spec Check:* Every voter is strictly worse than a coin flip (0.49 < 0.50).
  *   **Majority Accuracy (Group Competence):**
      *   **Standard Cases:** With $p=0.60$ and $N=51$, the majority threshold is 26 votes. Using the normal approximation ($\mu = 30.6$, $\sigma \approx 3.50$), $Z = (25.5 - 30.6) / 3.50 \approx -1.46$. The probability of a correct majority is $\Phi(1.46) \approx 0.928$.
      *   **Bug Cases:** With $p=0.05$, the expected yes-votes are 2.55. The probability of reaching 26 votes is effectively 0.
      *   **Overall Group Accuracy:** $(0.80 \times 0.928) + (0.20 \times 0) \approx \mathbf{0.74}$.
      *   *Spec Check:* The group is right 74% of the time (> 70%).

  **The Key Feature**

  The work is being done by **correlated competence driven by a hidden common variable** (the EHR system type). The voters are not independent in the unconditional sense; their errors cluster because their information source shares a flaw. This creates a mixture distribution: most of the time the group is highly competent, but a minority of the time they are systematically wrong. Because the "good" state is frequent enough (80%), it drags the group average up, even though the "bad" state drags the individual marginal average down below 0.5.

  **Removing the Feature**

  If you remove the correlation structure—meaning you keep the marginal probability $p=0.49$ but force the votes to be independent regardless of case type—the Condorcet Jury Theorem works in reverse. With $N=51$ and independent $p=0.49$:
  *   $\mu = 24.99$, $\sigma \approx 3.50$.
  *   $Z = (25.5 - 24.99) / 3.50 \approx 0.15$.
  *   Probability of correct majority $\approx 1 - \Phi(0.15) \approx \mathbf{0.44}$.
  The accuracy collapses from 0.74 to 0.44. You are correct: without the correlation structure that clusters competence, the majority rule amplifies the marginal incompetence.

  **The Pushback and Honesty**

  Your roommate is technically right: this is structurally Simpson's Paradox. If you condition on the EHR system, independence holds, and the CJT applies normally within each stratum (group succeeds in Standard, fails in Bug). Their argument is that "competence" should always be measured conditional on the available evidence (the chart), not marginally.

  However, their reply doesn't rescue the practical lesson for this setting. In real institutions, reviewers often *cannot* condition on the hidden variable (they don't know the software has a bug). If you judge the committee by its observable track record, individuals look incompetent (<50%), yet the committee output is reliable (>70%). This validates using the committee despite poor individual metrics.

  **Where the Construction is Fragile:**
  The slight cheat is assuming voters don't update on the difficulty. In the "Bug" cases, if the doctors notice the lab results look weird, their accuracy might rise to 0.5 (random guessing) rather than staying at 0.05. If $p_{bug}$ rises to 0.5, the marginal $p$ rises to 0.58 (breaking Spec 1), and the group accuracy in those cases becomes 0.5 (lowering overall group accuracy). To make this stick, the story requires the misleading signal to be subtle enough that experts remain confidently wrong, not just confused. A sharp student might argue that true experts should detect the inconsistency; you need to defend that the "bug" mimics a plausible physiological anomaly perfectly.
