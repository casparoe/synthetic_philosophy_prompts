answer: |-
  You've put your finger on the exact vulnerability of a naive implementation, and you're right to worry about thin liquidity and capital asymmetry. But I think you're slightly misreading the payout structure, which is where the protection lies. You don't get paid just because your branch wins; you get paid based on the *metric value* if your branch wins. If a wealthy minority tries to bully the market into choosing "Sell" by buying up contracts, they are now long on the success of that sale. If they're wrong and the well-being metric crashes, their contracts lose value and they burn their stake. The refund only protects the people who bet on the *losing* policy, not the winners who bet on a bad outcome. In a vote, a rich minority can lobby or dominate the meeting and win even if the decision tanks everyone's welfare; here, they only win the decision if they are willing to bet real money that it will *improve* welfare. If they're bluffing, the market mechanism extracts money from them.

  On the liquidity and capital constraint, you're absolutely right that members shouldn't have to tie up personal cash for years—that would indeed restrict participation to the wealthy. The engineering fix is for the co-op itself to subsidize the liquidity via an automated market maker, funded from our operating budget. We don't need members to be market makers; we need them to be traders against a deep pool provided by the organization. This makes manipulation prohibitively expensive because a manipulator has to move the entire subsidy pool, not just match against a few neighbors. It turns the "rich minority" problem on its head: voting caps influence at one vote regardless of conviction or knowledge, whereas this caps influence at capital-at-risk. It forces those with strong preferences to back them with skin in the game, aligning decision power with accountability for the result.
