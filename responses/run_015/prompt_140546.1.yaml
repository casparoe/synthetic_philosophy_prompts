              *   *However*, the user's specific fear is: "my downside from lying about the branch I want is capped at whatever I'm willing to tie up... while my upside is the whole decision". This implies they think they can manipulate the decision without risking loss on the metric outcome.
              *   *My Counter:* You only profit if the metric is high. If you manipulate the market to choose a policy that tanks the metric, you lose your investment in the winning market. The refund only protects the *losing* market participants (who were right to hedge against the policy not happening). The *winning* market participants are exposed to the metric risk.
