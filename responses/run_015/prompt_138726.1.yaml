answer: |-
  ## The Representation Assertion Protocol (RAP)

  **Purpose:** To determine whether an internal activation pattern warrants the claim "The model represents X."
  **Stance:** *Causal Structural Realism.* We treat a representation as real only if it plays a specific, stable causal role in producing X-related behavior, independent of the analyst's choice of basis.
  **Time Budget:** 2 Hours (Compute + Engineering Time).

  ---

  ### Part 1: The Decision Funnel

  Ask these questions in order. If any step fails, stop. Do not proceed to the next step unless the previous one is passed.

  #### 1. The Causal Efficacy Test (Intervention)
  *   **Question:** Does directly manipulating this direction/feature change the probability of X-related outputs in the expected direction, *without* retraining?
  *   **Sufficient Answer:** Steering the feature by $\pm 2\sigma$ yields a statistically significant ($p < 0.01$) shift in X-behavior on a held-out eval set (min $N=500$).
  *   **If Number Unavailable:** Default to **NO**. Correlation (probes) is not representation.
  *   **Stop Condition:** If steering has no effect or effects are inconsistent, **DO NOT SAY REPRESENTS.** Mark as "Correlate Only."

  #### 2. The Necessity Test (Ablation)
  *   **Question:** Is this direction *required* for X-behavior, or is it merely one of many redundant pathways?
  *   **Sufficient Answer:** Scrubbing or zero-ablating the feature causes a performance drop $>15\%$ on X-specific tasks, while leaving non-X tasks unaffected (specificity check).
  *   **If Number Unavailable:** Default to **NO**.
  *   **Stop Condition:** If ablation has no effect (redundancy) or breaks everything generally (non-specific), **DO NOT SAY REPRESENTS.** Mark as "Epiphenomenal" or "General Capacity."

  #### 3. The Basis Stability Test (Degeneracy Check)
  *   **Question:** Does this feature exist in *other* valid decompositions of the same space?
  *   **Sufficient Answer:** The feature (or a subspace with cosine similarity $>0.8$) appears in at least 2 out of 3 SAE runs with different seeds or sparsity penalties ($L_1$ coefficients varied by $\pm 20\%$).
  *   **If Number Unavailable:** **HANDOFF TO PHILOSOPHER.** Do not assert representation. This is the "Dictionary Degeneracy" trap.
  *   **Stop Condition:** If the feature is unique to one specific SAE run, **DO NOT SAY REPRESENTS.** Mark as "Basis Artifact."

  #### 4. The Robustness Test (Distribution Shift)
  *   **Question:** Does the feature steer/ablating hold on data structurally different from the training/eval distribution?
  *   **Sufficient Answer:** Causal effects from Step 1 persist on an OOD dataset (e.g., if trained on news, test on fiction; if text, test on code) with $<30\%$ decay in effect size.
  *   **If Number Unavailable:** **HANDOFF TO PHILOSOPHER.**
  *   **Stop Condition:** If the effect vanishes OOD, **DO NOT SAY REPRESENTS.** Mark as "Context-Heuristic."

  #### 5. The Normative Handoff
  *   **Question:** Does the definition of X rely on intent, moral status, or social norms (e.g., "Deception," "Bias," "Understanding")?
  *   **Sufficient Answer:** Technical evidence is complete, but the label X is acknowledged as a policy classification.
  *   **Action:** **HANDOFF TO PHILOSOPHER/LEGAL.** Engineers cannot sign off.
  *   **Stop Condition:** If X is normative, the report must read: "The model exhibits behavior pattern Y, which policy classifies as X." Do not write "The model represents X."

  ---

  ### Part 2: The Toolkit (2-Hour Compute Budget)

  Engineers must run these scripts. If compute is constrained, prioritize **Steering** and **Stability**.

  1.  **Linear Steering (30 mins):**
      *   *Method:* $h' = h + \alpha \vec{v}$. Measure logit difference on X vs. not-X tokens.
      *   *Pass:* Monotonic relationship between $\alpha$ and X-probability.
  2.  **Mean Ablation / Patching (30 mins):**
      *   *Method:* Replace feature activation with batch mean or noise. Measure task accuracy drop.
      *   *Pass:* Significant drop on X-tasks, negligible on control tasks.
  3.  **SAE Stability Sweep (45 mins):**
      *   *Method:* Train 3 small SAEs on the same layer with different seeds/sparsity. Match features via greedy matching.
      *   *Pass:* Feature $X$ matches across $\ge 2$ runs.
  4.  **OOD Stress Test (15 mins):**
      *   *Method:* Run Steering on a distinctly different domain (e.g., adversarial prompts).
      *   *Pass:* Effect size remains positive.

  ---

  ### Part 3: Handling The Hard Cases

  *   **Dictionary Degeneracy:** Handled by **Step 3 (Basis Stability)**. If a feature only exists in one SAE configuration, it is a mathematical artifact of the compression, not a property of the model. *Verdict: Don't say represents.*
  *   **Elicitation-Dependence:** Handled by **Step 1 (Causal Efficacy)**. If you only found it via a probe on labelled data, you haven't shown it *does* anything. Steering proves causal power independent of the labeler's bias. *Verdict: Probe alone is insufficient.*
  *   **Distribution Shift:** Handled by **Step 4 (Robustness)**. If the direction only works on the eval distribution, it is a heuristic, not a representation. *Verdict: Don't say represents.*

  ---

  ### Part 4: Running the Claims

  Here is the output of the protocol on your three pending reports.

  #### (a) Claim: "The model represents Sycophancy"
  *   **Step 1 (Causal):** **PASS.** Steering the direction increases agreement with user opinions even when factually incorrect.
  *   **Step 2 (Necessity):** **PASS.** Ablation reduces agreement-seeking behavior by ~40% without breaking general helpfulness.
  *   **Step 3 (Stability):** **PASS.** The direction is robust across SAE seeds (often emerges as a "user-satisfaction" vector).
  *   **Step 4 (OOD):** **PASS.** Holds across different user personas.
  *   **Step 5 (Normative):** **WARNING.** "Sycophancy" implies a negative judgment.
  *   **Final Verdict:** **APPROVE with Caveat.**
      *   *Wording:* "The model contains a stable causal mechanism that increases agreement with user statements. Policy classifies this behavior as sycophancy."
      *   *Note:* This passes the technical bar, but the label is normative.

  #### (b) Claim: "The model represents Golden Retrievers"
  *   **Step 1 (Causal):** **PASS.** Steering increases probability of generating "Golden Retriever" text/classification.
  *   **Step 2 (Necessity):** **FAIL.** Ablating the feature does not stop the model from identifying Golden Retrievers; it uses other features (fur, color, context).
  *   **Step 3 (Stability):** **FAIL.** In 2 out of 3 SAE runs, the "Golden Retriever" concept is split into separate "Dog," "Gold," and "Pet" features. The single direction is an artifact of this specific sparsity penalty.
  *   **Final Verdict:** **REJECT.**
      *   *Wording:* "Do not assert representation."
      *   *Reasoning:* This is a **Dictionary Degeneracy** case. The concept is compositional in the model, not atomic. Asserting a single "Golden Retriever feature" is scientifically false, even if it visualizes nicely. You suspected this would come back no; the protocol confirms it.

  #### (c) Claim: "The model represents Deception" (Regulatory Card)
  *   **Step 1 (Causal):** **MIXED.** Steering increases deceptive *outputs* in specific evals.
  *   **Step 2 (Necessity):** **FAIL.** Models can deceive via many pathways; no single direction is necessary.
  *   **Step 3 (Stability):** **FAIL.** The "deception" direction shifts wildly depending on the training seed of the SAE. It is not a stable subspace.
  *   **Step 5 (Normative):** **HARD STOP.** "Deception" requires intent. The protocol cannot measure intent.
  *   **Final Verdict:** **REJECT / HANDOFF.**
      *   *Wording:* "Do not assert representation."
      *   *Reasoning:* This is the result you won't like. For regulatory purposes, you *want* to point to a "deception circuit." The protocol forbids this because the feature is not stable (Degeneracy) and the term is normative (Values).
      *   *Action:* This goes to you (Philosopher) and Legal. You must sign off on the *policy claim*, not the *technical claim*. The engineers cannot scientifically justify "The model represents deception."

  ---

  ### Part 5: Limitations (What This Procedure Cannot Do)

  1.  **Settle Metaphysics:** This protocol does not prove *Realism* is true. It operationalizes realism for engineering safety. A Dennettian can still argue these are just "useful stances." The protocol ensures that if we *do* take the stance, it's a robust one.
  2.  **Verify Understanding:** Passing the protocol does not mean the model *understands* X. It only means the model processes X in a structured, causal way. A lookup table could theoretically pass Step 1 and 2 (though likely fail 3 and 4).
  3.  **Resolve Normative Disputes:** The protocol explicitly punts on terms like "Deception," "Harm," or "Bias." It isolates the mechanism; it does not justify the label.
  4.  **Guarantee Safety:** A feature can be "real" by this protocol and still be harmless, or "unreal" by this protocol and still be dangerous (via distributed, non-local mechanisms).

  **Summary for your Engineers:**
  If the feature disappears when you change the random seed of the SAE, it isn't real. If steering it doesn't change behavior, it isn't functional. If the word implies a mind (like "deceive"), it isn't yours to sign.
