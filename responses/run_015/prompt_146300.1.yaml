answer: |-
  ### Part 1: The Translation

  **The Distinction (Therapy vs. Enhancement)**
  *   **Therapy:** A **bug fix** or **maintenance task**. The system is deviating from its **specification** or **SLO**. The goal is to restore **intended behavior** and eliminate a **regression**.
  *   **Enhancement:** A **feature request** or **new behavior**. The system is operating within spec, but the stakeholder wants capabilities outside the current **contract**. This is **feature work**, not maintenance.

  **The Moral Asymmetry (Obligation vs. Permission)**
  *   **Therapy:** A **Severity-One Incident** or **SLO Breach**. The on-call engineer is paged. Fixing it is mandatory to restore service availability and reliability. It consumes the **error budget** immediately.
  *   **Enhancement:** A **Ticket in the Backlog**. It is prioritized against other feature work. It is permitted if resources allow, but there is no obligation to ship it. It does not impact the error budget unless it introduces instability.

  **The Four Accounts of the Baseline**
  1.  **Statistical Baseline:** The **Reference Platform** or **Canary Configuration**. "Normal" is defined by the **median metrics** across the fleet. A defect is an **anomaly** detected by **alert thresholds** set at standard deviations from the mean.
  2.  **Historical Baseline:** The **Commit History** and **Design Docs**. "Normal" is the **original intent** recovered from `git blame`. A defect is a divergence from the **initial architecture** or **selected function**, regardless of current fleet statistics.
  3.  **Evaluative Baseline:** The **Acceptance Tests** and **Golden Files**. "Normal" is defined by whether the system passes the **business logic checks** required by the specific **customer/user**. A defect is a failure to meet the **user's success criteria**, regardless of the spec or statistics.
  4.  **Environmental Baseline:** The **Platform/Infrastructure Layer**. The defect is not in the **service implementation** but in the **network topology**, **client configuration**, or **dependencies**. The fix is a **shim**, **proxy**, or **environmental change** rather than a code change in the core service.

  ---

  ### Part 2: Case Analysis

  **1. Dental Decay (Statistically typical, but treated as a defect)**
  *   **Translation:** The metric (cavity count) is within the **standard deviation** of the **Reference Platform** (most nodes have decay). However, the **Acceptance Tests** (pain/function) are failing.
  *   **Carries Cleanly:** The conflict between **Alert Thresholds** (Statistical) and **SLOs** (Evaluative).
  *   **Distortion:** In engineering, if 90% of nodes are red, we usually assume the **Alert Threshold** is wrong, not that the nodes are buggy. Here, the argument claims the nodes are buggy *despite* the prevalence.
  *   **Cannot Say:** Why the **Spec** allows for widespread degradation if it's considered a **bug**.
  *   **Status:** **Collision** between Statistical and Evaluative baselines.

  **2. Cochlear Implant (Restores function via different mechanism)**
  *   **Translation:** A **Refactor** or **Backend Rewrite**. The **API Contract** (hearing) is preserved, but the **Implementation** (biological ear vs. digital signal) is swapped.
  *   **Carries Cleanly:** Distinguishes **Interface Contract** from **Implementation Detail**. As long as the **Acceptance Tests** pass, it is a **Bug Fix** (Therapy), not a **Feature**.
  *   **Distortion:** Engineering assumes the **Interface** is stable. In biology, the "interface" (sensory experience) might be qualitatively different even if functional.
  *   **Cannot Say:** Whether changing the **Implementation** introduces hidden **Technical Debt** or **Latency** not captured in the **API Contract**.
  *   **Status:** **Clean Translation.** This is a standard **Infrastructure Migration**.

  **3. Aging (Restoring capacity lost to time)**
  *   **Translation:** **Hardware Degradation** vs. **Version Deprecation**. Is the loss of capacity a **Bug** (wear and tear on the disk) or **End-of-Life** (the version is no longer supported)?
  *   **Carries Cleanly:** Frames aging as **Technical Debt** accumulation.
  *   **Distortion:** In software, we don't usually "fix" old hardware; we rotate it. Restoring a 60-year-old to 20-year-old specs looks like **Running Legacy Hardware on a New Kernel**.
  *   **Cannot Say:** Whether aging is a **Feature** (planned sunsetting) or a **Bug** (unplanned degradation). The **Commit History** (Evolution) is ambiguous on whether senescence is intended.
  *   **Status:** **Ambiguous.** Depends on whether the system is viewed as **Maintainable Indefinitely** or **Ephemeral**.

  **4. Immunity (New capacity never had)**
  *   **Translation:** A **Feature Flag** or **New Endpoint**. This is clearly **Feature Work**. It expands the **API Surface Area**.
  *   **Carries Cleanly:** Unambiguously an **Enhancement**. It does not restore **Intended Behavior**; it adds **New Behavior**.
  *   **Distortion:** None. This maps 1:1 to a **Version Upgrade** with new capabilities.
  *   **Cannot Say:** Whether the **Feature** introduces **Security Vulnerabilities** or **Compatibility Issues** with downstream systems (side effects).
  *   **Status:** **Clean Translation.**

  **5. Continuous Trait/Committee (Hypertension thresholds)**
  *   **Translation:** **Tuning Alert Thresholds** on a **Continuous Metric**. A committee moves the **SLO Line** (e.g., blood pressure > 130/80).
  *   **Carries Cleanly:** Highlights that the line between **Incident** and **Normal Operation** is administrative, not technical.
  *   **Distortion:** In engineering, moving the threshold doesn't change the system state, only the **Alerting**. In medicine, moving the threshold changes who gets **Treatment** (Bug Fixes).
  *   **Cannot Say:** Why the **Threshold** was set there originally. Was it based on **Error Budgets** (cost of treatment) or **System Stability** (risk of stroke)?
  *   **Status:** **Clean Translation** of the mechanism, but exposes the arbitrariness of the **SLO**.

  **6. Neurodiversity/Community (Trait relied upon by users)**
  *   **Translation:** **Hyrum's Law**. An **Undocumented Behavior** or **Side Effect** has become a **Dependency** for a subset of **API Consumers**.
  *   **Carries Cleanly:** Fixing the **Bug** (normalizing the trait) introduces a **Breaking Change** for those users. Their **Workflow** depends on the **Quirk**.
  *   **Distortion:** In engineering, we usually deprecate the dependency and force a **Migration**. Here, the "users" argue the **Quirk** *is* the **Feature**.
  *   **Cannot Say:** Who owns the **Platform**. If the users own the platform, they can veto the **Bug Fix**.
  *   **Status:** **Clean Translation.** This is a classic **Breaking Change vs. Stability** conflict.

  **7. Trade-offs (Sleep vs. Lifespan)**
  *   **Translation:** **Resource Contention** or **Optimization**. Improving **Throughput** (wakefulness) increases **CPU Temperature** (reduces lifespan).
  *   **Carries Cleanly:** There is no free lunch. Every **Optimization** has a **Cost**.
  *   **Distortion:** Engineering usually allows the **Customer** to choose the **Configuration Profile** (High Performance vs. High Durability). Medicine often mandates one **Global Config**.
  *   **Cannot Say:** Who decides the **Resource Allocation Policy**. Is the **User** allowed to burn out the hardware faster for better performance?
  *   **Status:** **Clean Translation** of the mechanics, **Distortion** on who sets the **Policy**.

  ---

  ### Part 3: Residue Report

  **1. Smuggled Assumptions**
  The translation relies on a **Spec Author** that does not exist in the biological context.
  *   **In Engineering:** A **Product Manager** or **Architect** writes the **Spec**. They define the **SLOs**, the **Intended Behavior**, and the **Acceptance Tests**. When there is a dispute about whether something is a **Bug** or a **Feature**, we check the **Design Doc** or ask the **Owner**.
  *   **In Biology:** There is no **Architect**. "Evolution" is not an **Owner**; it has no **Design Doc**. The **Commit History** is opaque and unannotated.
  *   **The Smuggle:** When you use the word **Spec** or **Intended Behavior** for a human, you are smuggling in a **Designer**. Without a Designer, **Historical Baseline** (Commit History) is unreadable. Without a Designer, **Evaluative Baseline** (Acceptance Tests) has no authoritative sign-off. The **Moral Asymmetry** (Obligation vs. Permission) collapses because there is no **Service Owner** to owe the **SLO**.

  **2. Limitation of Vocabulary vs. Limitation of Distinction**
  The residue indicates the **Therapy/Enhancement Distinction** is less clear than it looks, not that your vocabulary is insufficient.
  *   Your vocabulary exposes that the distinction requires a **Contract**.
  *   In medicine, the **Contract** is implied, not written.
  *   Cases 1 (Decay), 3 (Aging), and 5 (Thresholds) all collapse into the same problem: **Who sets the SLO?**
      *   If the **User** sets the SLO (Evaluative), Decay is a bug.
      *   If the **Fleet** sets the SLO (Statistical), Decay is normal.
      *   If the **Architect** sets the SLO (Historical), Aging is ambiguous.
  *   Because there is no **Architect**, the argument stalls. Your vocabulary forces this into the open: you cannot have a **Bug** without a **Spec**. If the bioethicists cannot produce the **Spec**, they cannot rigorously define **Therapy**.

  **3. Collapsed Cases**
  *   **Cases 1, 3, and 5 are the same case.** They are all disputes over **Alert Threshold Configuration**. Is the red line drawn at the **Mean** (Statistical), the **Original Design** (Historical), or the **User Pain Point** (Evaluative)?
  *   **Cases 2 and 4 are distinct.** Case 2 is **Refactoring** (preserving contract). Case 4 is **New Feature** (extending contract). Your vocabulary separates these cleanly.
  *   **Case 6 is unique.** It is the only case where the **Downstream Consumer** vetoes the **Upstream Fix**.

  **4. Verdict**
  The Therapy/Enhancement distinction functions in engineering because we have **Versioned APIs** and **Change Logs**. It fails in bioethics because we are running **Legacy Code** with **No Documentation**, **No Owner**, and **Downstream Dependencies** we don't understand. The moral weight (Obligation) attaches to the **Spec**, not the **Code**. If the **Spec** is missing, the **Obligation** is ungrounded.

  ---

  ### Part 4: Confidence and Uncertainty

  **Confidence Level:** High (85%).
  The mapping of infrastructure concepts to the philosophical positions is robust because both domains deal with complex systems, constraints, and definitions of "correctness." The failure point (The Missing Architect) is a well-known problem in both systems design (legacy code) and philosophy (teleology).

  **Claim I Am Least Sure Of:**
  I am least sure about the classification of **Case 3 (Aging)** as **Hardware Degradation** vs. **Version Deprecation**.
  *   *Reasoning:* In infrastructure, we sometimes treat aging servers as **End-of-Life** (replace, don't fix) and sometimes as **Maintainable** (replace disks, keep running). Whether aging is a **Bug** (Therapy) or **EOL** (Acceptable Loss) depends entirely on the **Support Policy** set by the **Vendor**. Since there is no **Vendor** for humans, my translation flags it as ambiguous, but I am not certain if "Hardware Degradation" is the best metaphor versus "Planned Obsolescence." If it is Planned Obsolescence, Therapy is effectively **Jailbreaking** the **License Agreement**. This nuance might shift the moral asymmetry significantly.
