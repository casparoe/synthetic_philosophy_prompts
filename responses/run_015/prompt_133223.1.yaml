  Yet we measure life in accumulated **goods**.
  An **absence** of breath is not what unfolds,
  But the **future** days that remain unmade.
  Without **presence**, can there be a cost?
  Or is the **harm** simply what is lost?

  **Harm** needs a victim, says the old school.
  No **subject** exists in the grave's deep keep.
  Yet life is more than sensory **presence**,
  We mourn the **goods** we never could.
  The **future** is the thing we are denied.
  And **absence** is the wound that does not heal.

  **Absence** is not a state someone enters.
