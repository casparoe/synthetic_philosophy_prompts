  To claim a state requires a living **presence**.
  Death is defined by total **absence**.
  No mind remains to tally lost **goods**,
  So where is the **harm** in an empty room?
  If there is no **subject** to feel the wound,
  Then why do we fear the blocked **future**?

  We mourn the closed **future** more than the end.
  Life is valued by its vivid **presence**,
  And every **subject** wants more time to spend.
  Not pain, but **absence** defines the penalty.
  The **harm** is what you might have held, not felt.
  Just subtraction of possible **goods**.

  If life contains **goods**, then stopping is loss.
  Cutting off the **future** cuts the value.
  Is this **harm** without a witness across?
  Can **presence** matter after the pulse?
  Or is the **absence** the actual state?
  Who is the **subject** of this nullity?

