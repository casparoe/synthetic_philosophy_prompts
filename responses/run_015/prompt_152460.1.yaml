  **Scene:** *The graduate lounge. A broken espresso machine sits on the counter. A Grad Student is elbow-deep in the back panel. The Advisor (a committed Ash'ari occasionalist) watches calmly. Averroes (Ibn Rushd) walks in, carrying a copy of the Physics.*

  **Grad Student:** "It's the solenoid. The circuit closes, but there's no pressure. No extraction."

  **Advisor:** "Careful. You speak as though the circuit *possesses* the power to compel pressure. You treat the machine as an agent."

  **Grad Student:** "It's a Breville, not a person. But yeah, the cause is broken."

  **Advisor:** "There are no secondary causes. There is only the First Cause. Think of the fire and the cotton. When they touch, does the fire *necessitate* the burn? No. God creates the burning concurrent with the contact. If He willed, the cotton could remain white in the flame. Similarly, this switch does not cause flow. It is merely the occasion where God habitually creates flow."

  **Grad Student:** "So... I shouldn't fix the solenoid?"

  **Advisor:** "Fix it if you wish. But know that a working solenoid and flowing coffee are only conjoined by Divine Custom (*Sunna*), not by nature. He could withhold the effect despite the repair."

  *(Averroes sets down his book, picks up a screwdriver, and replaces the solenoid. He flips the switch. The machine whirs; coffee pours.)*

  **Averroes:** "The integrity of the nature is restored. The effect follows the cause by necessity."

  **Advisor:** *(Staring at the stream)* "It flows."

  **Averroes:** "Because the cause is present."

  **Advisor:** "Because the Habit holds."

  **Averroes:** "If it were merely habit, you could not trust the heat. You would have to verify every sip that God has not changed His custom mid-swallow. You would live in perpetual miracle."

  **Advisor:** "I trust His consistency."

  **Averroes:** "Consistency across time and matter *is* what we mean by Nature. You deny the name but rely on the function."

  **Advisor:** "No. Nature implies independence. Habit implies dependence. I drink dependent on God."

  **Averroes:** "Then drink without assuming the coffee will nourish. Nourishment is also an effect without necessary connection to the bean."

  **Advisor:** *(Pauses, cup halfway to mouth)* "...Is there decaf?"

  **Averroes:** "Why?"

  **Advisor:** "If I sleep tonight, I cannot know if it was the lack of caffeine or God willing rest. I need to isolate the occasions."

  **Averroes:** "You are living like an Aristotelian while speaking like an Ash'ari."

  **Advisor:** *(Takes a sip)* "No. I am living like a tenant who knows the landlord could cut the water, but pays the bill anyway."

  **Averroes:** "That's not theology. That's rent control."

  **Advisor:** "It's the only way to get tenure. Now hand me a mug. I need to test if the Habit holds for a second cup."

  **Averroes:** "You mean 'cause and effect'."

  **Advisor:** "I mean: God willing, no scalding."
