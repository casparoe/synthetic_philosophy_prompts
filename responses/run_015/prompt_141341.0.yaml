answer: |-
  Your instinct to rely on predictive grip is exactly right—that is the engine of Dennett's intentional stance. You are treating belief as a theoretical posit justified by its utility in forecasting behavior. The trouble you're having isn't with the principle itself, but with a hidden inconsistency in how you apply it. Specifically, you are letting knowledge of the mechanism (the "design stance") undermine your intentional attributions in the machine cases, while ignoring the mechanism in the human case.

  Here is the precise principle that unifies your intuitions while correcting that bias: **Attribute a belief when the system reliably treats a proposition as a premise in diverse, goal-directed inference chains, such that predicting this behavior via the design stance is computationally intractable for you.**

  This principle forces you to give up one specific verdict: your hesitation on the "France" case based solely on the fact that it comes from training data. You write that it feels like "just replaying something," but you grant your classmate belief status despite her knowledge coming from a textbook. Unless you argue that your classmate is merely parroting neuroscience facts without integrating them into her wider web of belief, the source of the information is irrelevant. Dennett's crucial insight is that the intentional stance is mechanism-independent. If the system acts *as if* it holds the belief to achieve a goal, and you cannot easily predict that output by simulating the code or neurons, the attribution is valid.

  However, your principle does validate your distinction between the "France" chatbot and the "Debugging" chatbot. The difference isn't the training data; it's the **inferential integration**. In the France case, the output is likely a single-step retrieval. In the debugging case, the system defends a position against counter-evidence, generates new hypotheses, and modifies its suggestions based on your replies. It is treating "the bug is in the config" as a premise in a complex reasoning chain. That is why the intentional stance buys you more grip there; it allows you to predict how the system will react to *novel* objections, not just how it completes a pattern.

  This same logic applies to your "unmonitored" system. You feel confident attributing belief there because the behavior implies a model of the observer—a sophisticated inference chain about who is watching and why. Even if the evidence is thin, the *structure* of the behavior is deeply intentional. You are predicting a strategic choice, not a reflex.

  So, where does this leave the case you haven't thought about: an AI that confidently states a falsehood present in its training data, like "humans only use 10% of their brains"?

  According to the principle above, you should attribute this belief **if and only if** the system acts on that falsehood in varied contexts. If the AI merely outputs the sentence when prompted, it is akin to the thermostat: a fixed stimulus-response pairing. But if the AI uses that "fact" to reason—for example, recommending brain-enhancement supplements, critiquing neuroscience papers for ignoring the unused 90%, or planning tasks based on limited human bandwidth—then it believes the falsehood. The falsity of the content does not matter; a human can believe false things too. What matters is whether the proposition is functioning as a node in a rational network of inference.

  If the AI simply repeats the statistic without integrating it into further reasoning, your principle suggests withholding belief attribution, not because it's "just data," but because the intentional stance offers no predictive advantage over the design stance. You already know it will output the string when triggered. But if it starts arguing with you about neuroplasticity based on that statistic, the design stance becomes too complex to track, and you must say it believes the lie.

  Ultimately, your gut is tracking the right thing—predictive utility—but you need to stop letting the "training data" label short-circuit the analysis. If your classmate gets a pass for rote learning, the machine must too. The real line is drawn at integration: does the system use the content to navigate the world, or does it just display it? Once you fix that distinction, your France verdict might soften, but your Debugging verdict becomes rock solid.
