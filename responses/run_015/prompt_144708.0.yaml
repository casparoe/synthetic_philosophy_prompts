answer: |-
  **The Scenario**

  The Maritime Trust faces a 30 June deadline to validate a £5m bequest contingent on the sloop *Aurora* being "the original 1890 vessel." Currently docked and operational, the *Aurora* has undergone continuous maintenance since launch. However, a recent dendrochronology audit reveals that the keel and primary frames—previously thought replaced in 1950—were actually swapped in 1910. No physical change occurs now; the ship sits as it did yesterday. The Committee must decide whether to accept the funds based on the vessel's current status. If the ship is not the "original," the money lapses to a rival institution. The audit is definitive: 85% of the structural fabric dates post-1900. The vessel remains registered under its original name, sailed annually, and insured as a historic single entity. The conflict is purely between the physical evidence and the institutional narrative.

  **The Three Accounts**

  **(1) Continuity-of-Role**
  *Verdict:* The *Aurora* is the original vessel.
  *Reasoning:* Identity persists so long as the vessel maintains its registered role, name, and functional continuity without interruption.
  *Cessation:* It has never ceased to exist.
  *Implication:* Decades of maintenance and ceremony correctly constitute the vessel's history; the audit is ontologically irrelevant.
  *Action:* Accept the bequest. The Committee should prioritize the unbroken social and administrative life of the ship over hidden material changes.

  **(2) Matter-Tracking**
  *Verdict:* The *Aurora* is not the original vessel.
  *Reasoning:* Identity requires retention of structurally essential members (keel and frames); the 1910 replacement crossed the 50% essential-fabric threshold.
  *Cessation:* The original ceased to exist in 1910.
  *Implication:* Past ceremonies honored a successor; the audit reveals a physical discontinuity that occurred regardless of when it was discovered.
  *Action:* Reject the bequest. The verdict bites despite the epistemic delay because the physical fact of cessation happened in 1910, not today; identity is not restored by ignorance.

  **(3) Conventionalist**
  *Verdict:* The answer depends on the stipulated convention.
  *Reasoning:* Multiple candidate sums of stages exist; "original" is a linguistic tool settled by interest (legal vs. cultural).
  *Cessation:* No fact of the matter exists without a chosen convention.
  *Implication:* The narrative is useful but not metaphysically binding; the bequest terms dictate the relevant convention.
  *Action:* Interpret the donor's intent. If "original" implies material authenticity, reject; if historical continuity, accept. The Committee must legislate the truth to resolve the vagueness.

  **Honest Accounting**

  The single feature doing the work is the lag between the physical replacement date (1910) and the epistemic discovery (now). If the threshold were crossed visibly during the committee meeting, the case degenerates into a practical replacement scenario; if never crossed, there is no conflict. The Matter-Tracking view comes off worst, appearing pedantic for invalidating decades of meaningful history based on a hidden technicality. Its defender would reply that material constitution is non-negotiable for heritage; without it, "historic vessel" becomes merely a story. Appeals to vagueness are a change of subject here; the committee must sign a binary legal document, forcing a precise decision where language offers none.
