prompt: |-
  I'm working on a novel and two friends of mine got into it at dinner about a scene, and it snowballed into something I can't actually referee. One of them, lets call her Mara, argued that a character in the book has a real reason to do a certain thing even though the character isn't psychologically pulled toward it at all -- she said reasons are objective features of the situation, so if the character made a promise, that's a reason to keep it wether or not the character feels like it. The other one, Dev, said that's not a reason *for that character*, that a genuine reason has to engage what the character actually cares about, and if there's no motivational hook then it's not a reason for them, just a reason for someone else.

  Mara pushed back and said Dev's view has this weird consequence where anyone who's lost the desire to be honest has no reason to be honest, which is absurd, and that his account basically lets you opt out of every reason just by not wanting it. Dev said no, that's the point, that if you've genuinely lost the motivation then the reason is gone for you, and that Mara is just smuggling in a factive "should" that assumes the very thing in question.

  I tried to steer them back to the scene and they just went deeper. Can you actually referee this for me? I want to know who's right about which specific point at each step, not just who wins overall, and I'm curious whether there's something both of them are missing about how reasons work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel. Two friends (Mara and Dev) argued about a specific philosophical point regarding "reasons for action" in the context of character motivation.
      *   **The Debate:**
          *   **Mara's Position (Externalism/Objectivism):** Reasons are objective features of the situation (e.g., a promise creates a reason to keep it), regardless of the agent's psychological state or desires.
          *   **Dev's Position (Internalism/Subjectivism):** Reasons must engage the agent's subjective motivational set (what they care about/desire). If the motivation is gone, the reason is gone *for that character*.
          *   **Mara's Objection:** Dev's view implies moral nihilism/relativism (if you don't *want* to be honest, you have no reason to be). It allows opting out of obligations.
          *   **Dev's Objection:** Mara is smuggling in a normative "should" (factive) rather than discussing actual motivational reasons. If motivation is truly absent, the reason *is* absent.
      *   **The Task:** Referee the debate. Determine who is right about which specific points. Identify if they are missing something. Avoid just declaring a winner; provide nuance.

  2.  **Identify the Philosophical Core:**
      *   This is a classic debate in meta-ethics and philosophy of action: **Reasons Internalism vs. Reasons Externalism**.
      *   **Internalism:** Associated with Bernard Williams ("Internal and External Reasons"). A reason must be grounded in the agent's "subjective motivational set" (SMS).
      *   **Externalism:** Associated with Kantians, Realists (e.g., Thomas Nagel, Derek Parfit). Reasons exist independently of desires (e.g., moral facts, rational requirements).

  3.  **Evaluate Mara's Claims:**
      *   *Claim:* Reasons are objective features (e.g., a promise).
      *   *Assessment:* Philosophically defensible (Externalism). In a novel, this aligns with deontological ethics or social contract views.
      *   *Claim:* Dev's view implies you can opt out of reasons by not wanting them.
      *   *Assessment:* This is a standard and strong objection to Internalism (the "Shmagency" or "Psychopath" objection). If a psychopath has no desire not to kill, does he have no reason not to kill? Internalists struggle here.
      *   *Verdict:* Mara is right that Externalism preserves the normative force of obligations independent of mood.

  4.  **Evaluate Dev's Claims:**
      *   *Claim:* A genuine reason *for a character* must engage what they care about.
      *   *Assessment:* Philosophically defensible (Internalism). In fiction writing, this is crucial for *psychological realism*. A character won't act without a motive.
      *   *Claim:* Mara is smuggling in a "should."
      *   *Assessment:* He is distinguishing between *normative reasons* (what one ought to do) and *motivating reasons* (what actually moves one to act). This is a valid distinction.
      *   *Verdict:* Dev is right that for *narrative plausibility*, the character needs an internal hook.

  5.  **Identify What They Are Missing (The Synthesis):**
      *   **Distinction between Normative vs. Motivating Reasons:** This is the key. Mara is talking about *Normative Reasons* (justification). Dev is talking about *Motivating Reasons* (explanation/psychology). Both can be true simultaneously.
      *   **The Fiction Context:** In a novel, *both* matter. A character might have a normative reason (promise) but lack a motivating reason (desire), creating *conflict*. That conflict *is* the drama.
      *   **Williams' Nuance:** Even Internalists (like Williams) argue the SMS can be expanded through deliberation. Just because I don't *currently* care doesn't mean I *couldn't* come to care via rational deliberation.
      *   **Character Arc:** The gap between Mara's "objective reason" and Dev's "subjective motivation" is where character development happens.

  6.  **Drafting the Referee Report:**
      *   *Tone:* Neutral, analytical, helpful for a writer.
      *   *Structure:*
          1.  Introduction (Identify the philosophical debate).
          2.  Round 1: The Definition of "Reason" (Who is right about terminology?).
          3.  Round 2: The Consequence (Mara's objection vs. Dev's defense).
          4.  The Missing Piece (Normative vs. Motivating).
          5.  Application to the Novel (How to use this).
      *   *Specific Judgments:*
          *   Mara is right about *obligation*.
          *   Dev is right about *psychological plausibility*.
          *   Both are talking past each other regarding the *type* of reason.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get too bogged down in academic jargon. Keep it accessible but precise.
      *   *Emphasis:* Highlight that for a *novel*, Dev's point is practically more important for *action*, but Mara's point is more important for *theme/conflict*.
      *   *Check:* Did I answer the prompt? Yes, referee specific points, not just overall winner, and identify missing concepts.

  8.  **Final Polish:**
      *   Ensure the distinction between "Justification" and "Explanation" is clear.
      *   Add a section on how this creates better fiction (the gap between the two is where the story lives).

  9.  *(Final check of the prompt requirements)*: "Who's right about which specific point at each step." "Whether there's something both of them are missing."
      *   Okay, I need to break it down step-by-step.
      *   Step 1: Definition of Reason. (Draw).
      *   Step 2: The Promise Example. (Mara on normativity, Dev on psychology).
      *   Step 3: The "Opting Out" Objection. (Mara wins on moral intuition, Dev wins on logical consistency within his framework).
      *   Missing: The Normative/Motivating distinction.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic philosophical debate that has been raging in meta-ethics and philosophy of action for decades. In academic terms, Mara is arguing for **Reasons Externalism** (reasons exist independently of the agent's mind), and Dev is arguing for **Reasons Internalism** (reasons must be grounded in the agent's subjective motivational set).

  Since you asked for a referee ruling on specific points rather than a general winner, here is the breakdown of who is right about what, where they are talking past each other, and the crucial concept they are both missing that could actually help your novel.

  ### Round 1: The Definition of a "Reason"
  **The Claim:** Mara says a promise is a reason regardless of feelings. Dev says a reason must engage what the character cares about.

  *   **Ruling:** **Draw (Category Error).**
  *   **Analysis:** They are using the same word to describe two different things.
      *   **Mara is right about *Normative Reasons*:** These are reasons of *justification*. They answer the question, "What *ought* the character to do?" In ethics and law, a promise creates an obligation regardless of your mood. If Mara is right, your character is *wrong* to break the promise, even if they don't feel like keeping it.
      *   **Dev is right about *Motivating Reasons*:** These are reasons of *explanation*. They answer the question, "What will actually *make* the character move?" In psychology and narrative causality, a character cannot act without some internal hook (desire, fear, duty, habit). If Dev is right, a character without a motivational hook simply will not act, making the "reason" inert.

  **Referee's Note:** Mara is describing the *world's demand* on the character. Dev is describing the *character's engine*. Both exist, but they are not the same thing.

  ### Round 2: The "Opting Out" Objection
  **The Claim:** Mara argues Dev's view allows people to opt out of morality by just not caring. Dev argues Mara is smuggling in a "should" that assumes the conclusion.

  *   **Ruling:** **Mara wins on Moral Intuition; Dev wins on Logical Consistency.**
  *   **Analysis:**
      *   **Mara's Point:** She correctly identifies the dangerous implication of Dev's view (often called the "Psychopath Objection"). If reasons depend entirely on desires, then a sociopath who has no desire to be honest literally has *no reason* to be honest. Most people find this conclusion morally repugnant. Mara is right that we usually want to say the sociopath *has* a reason to be honest, they are just ignoring it.
      *   **Dev's Point:** He is technically correct that Mara is begging the question. She is saying, "They *should* care, therefore they *have* a reason." Dev is pointing out that if we are talking strictly about what motivates action, a "should" that cannot connect to a "want" is powerless. He is right that if you define reason strictly as "that which motivates," then losing the motivation kills the reason.

  **Referee's Note:** Mara is protecting the **authority** of the obligation. Dev is protecting the **mechanics** of agency. Mara is right that we *want* morality to be binding. Dev is right that without a hook, bindingness doesn't result in action.

  ### What They Are Both Missing
  There is a third concept that resolves this standoff and is arguably the most important tool for a novelist. They are missing the distinction between **Current Motivation** and **Deliberative Potential.**

  The philosopher Bernard Williams (the father of the Internalist view Dev is holding) actually argued that an agent's "subjective motivational set" isn't just raw desires like "I want ice cream." It includes things like "I want to be a person who keeps promises."

  **The Missing Piece:**
  1.  **Rational Deliberation:** A character can have a reason even if they don't *currently* feel like doing it, provided that if they *thought about it clearly*, they would see it connects to something they do care about (e.g., their reputation, their self-image, avoiding guilt).
  2.  **The Gap is the Story:** In fiction, the tension between Mara's "Objective Reason" and Dev's "Subjective Motivation" **is the conflict.**

  If Mara is right and the character has no internal hook, the character is static or robotic. If Dev is right and the character has no external obligation, there is no stakes. The drama lives in the gap where the character *has* an objective reason (Mara) but lacks the subjective motivation (Dev), and must struggle to bridge that gap.

  ### Application to Your Novel
  Here is how you apply this ruling to your scene:

  **1. Who is right about the Character's Action?**
  **Dev.** For the purpose of writing the scene, Dev is right. If you write a character who acts solely on Mara's "objective reasons" without any psychological pull, the character will feel flat, preachy, or unrealistic to the reader. Readers need to see the "motivational hook" (even if that hook is "fear of shame" or "desire to be good") to believe the action.

  **2. Who is right about the Character's Moral Standing?**
  **Mara.** For the purpose of the theme and consequences, Mara is right. If the character breaks the promise because they "didn't feel like it," the narrative should treat that as a failure or a transgression. The world (other characters, consequences) should react as though the reason existed, even if the character ignored it.

  **3. The Verdict for the Writer:**
  Use Mara to create the **Pressure**, and use Dev to create the **Resistance**.

  *   **Mara's View** gives you the *Stakes*: "You promised. You owe this."
  *   **Dev's View** gives you the *Obstacle*: "I don't care. I'm tired. This doesn't help me."

  **The Fix:**
  Don't decide who is "right." Instead, make the character's struggle the process of **converting Mara's reason into Dev's reason.**
  *   *Start of scene:* The promise exists (Mara), but the character feels no pull (Dev).
  *   *Middle of scene:* The character searches for a hook. "If I don't do this, I'll lose my self-respect." (Now an objective promise has become a subjective desire).
  *   *End of scene:* The character acts.

  ### Summary Ruling
  *   **Mara** is right that reasons (obligations) exist objectively in the social/moral fabric.
  *   **Dev** is right that reasons (motivations) must exist subjectively in the psychological fabric to cause action.
  *   **Both** are wrong to assume these must be the same thing.
  *   **You (The Author)** win if you pit them against each other. The friction between "What I ought to do" and "What I want to do" is the engine of complex characterization.

  Tell your friends they have accidentally recreated the **Internalism/Externalism debate**, buy them a drink, and tell them you're using both their arguments to make the character more complicated.
