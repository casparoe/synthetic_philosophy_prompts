answer: |-
  **Personal Case: The Escrowed Manuscript**
  Elias, a celebrated memoirist prone to crippling self-censorship when facing public scrutiny, enters a binding escrow agreement with a neutral trustee. He deposits his completed, unedited manuscript and instructs the trustee to publish it immediately upon his death or if he attempts to withdraw it due to "shame or fear," a condition he explicitly anticipates. At the time of signing, Elias is competent, well-advised, and reasonably judges that his future fear will be disproportionate to the actual risk. Two years later, facing imminent publication, Elias experiences the predicted shame; he is lucid, fully informed of the long-term benefits to his artistic legacy, and rationally prefers to protect his current emotional peace over his future reputation. He demands the manuscript's return. The trustee can physically enforce the directive and publish the book against Elias's current will, but doing so would sever the connection between the text and Elias's current endorsement. The good at stake is *authentic self-expression*, which requires that the act of publication align with the agent's will at the time of release.

  **Constitutional Case: The Entrenched Debt Brake**
  The Republic of Veridia, acting through its founding generation, adopts a Constitution containing an unamendable "Debt Brake" clause, requiring a two-thirds legislative supermajority to authorize any public deficit. The founders are competent, informed by historical economic data, and reasonably judge that future legislatures will succumb to short-term electoral pressure to overspend, risking long-term currency stability. Twenty years later, a sitting Parliament, facing a standard electoral cycle, wishes to fund popular infrastructure projects via deficit spending with a simple majority. The legislators are lucid, fully informed of the long-term inflationary risks, and rationally prefer the immediate infrastructure benefits over the abstract long-term stability. They challenge the clause in court. The Constitutional Court can enforce the brake by striking down the spending bill, and doing so would secure the *fiscal stability* of the state regardless of the legislature's current desire to spend. The good at stake is *macroeconomic integrity*, which consists in the causal outcome of low inflation and solvency, produced by the rule's existence and enforcement irrespective of the agent's willingness.

  ***

  ### Demonstration

  **a. Derivation of Verdicts**
  In the **Personal Case**, honouring the precommitment requires the trustee to publish the manuscript over Elias's explicit, lucid refusal. The good Elias sought was *authentic self-expression*. This is a **will-dependent good**: its value constitutively depends on the agent endorsing the action at the time it occurs. Publishing a text the author currently disavows produces a book, but it destroys the authenticity. Since enforcement causally secures the *letter* of the contract (publication) while destroying the *good* (authenticity), the precommitment should not be honoured. The verdict follows from the mismatch between the enforcement mechanism (compulsion) and the nature of the good (volition).

  In the **Constitutional Case**, honouring the precommitment requires the Court to strike down the spending bill over Parliament's explicit, lucid refusal. The good the Founders sought was *macroeconomic integrity*. This is a **rule-dependent good**: its value consists in the causal state of affairs (stable currency, solvency) produced by adherence to the rule. Enforcement causally secures the rule, which in turn secures the good, regardless of Parliament's current will. Since compulsion is a perfectly serviceable way to produce fiscal stability, the precommitment should be honoured. The verdict follows from the match between the enforcement mechanism (compulsion) and the nature of the good (outcome).

  **b. The Collapse Test**
  If we swap the goods, the verdicts flip, confirming the variable is doing the work.
  *   **Personal Case with Rule-Dependent Good:** Suppose Elias binds himself to a medical regimen to prevent a future heart attack (health is rule-dependent; biology does not care about will). If he lucidly tries to quit the meds later, enforcement *should* be honoured, because holding him to the regimen secures the good (health) despite his refusal. The verdict flips from "Release" to "Enforce."
  *   **Constitutional Case with Will-Dependent Good:** Suppose Veridia's Constitution entrenched a clause requiring "Sincere Civic Devotion," enforced by mandatory patriotic rituals. If a later Parliament lucidly rejects the rituals as hollow, enforcement *should not* be honoured. Forced patriotism is not civic devotion; it is theater. Compulsion destroys the good. The verdict flips from "Enforce" to "Release."

  **c. The Option-Preservation Reply**
  *The Reply:* The party losing in each case argues that enforcement preserves the *option* for a future willing return. In the Personal Case, Elias's Earlier Self argues: "Force publication now, and he may later come to accept it, whereas letting him withdraw forecloses his authentic legacy forever." In the Constitutional Case, Parliament argues: "Release us now, and we may later willingly choose fiscal discipline, whereas forcing us breeds resentment and eventual collapse."

  *The Answer:* In the **Personal Case**, this reply fails because the good is time-indexed. Authenticity cannot be banked; an act performed without will at *t2* cannot be retroactively made authentic by assent at *t3*. The damage to the good is done at the moment of compulsion. Preserving the *book* does not preserve the *authorship*. In the **Constitutional Case**, the reply fails because it misidentifies the good. Fiscal stability does not require "willing return"; it requires continuous adherence. Resentment is irrelevant to inflation rates. The option to "willingly choose" discipline is unnecessary for the good to obtain; the rule's coercion is sufficient. Thus, option-preservation is decisive only where the good is will-dependent, and moot where it is rule-dependent.

  **d. Honest Assessment**
  The feature doing the work is strictly the **constitutive dependence of the good on current volition**. The cases are well-matched on epistemic conditions (lucidity in both), agency continuity (same person/polity), and third-party exclusion (bracketing reliance). However, a subtle friction remains in Constraint 5 (Third Parties). While I have stipulated that third-party reliance is excluded from the *justification*, in reality, a Republic's stability is inherently about citizens, whereas Elias's authenticity is inherently personal. To make the cases truly parallel, one must accept the abstraction of the Polity as a unitary agent identical in moral status to the individual. If one rejects that abstraction, the Constitutional Case secretly relies on the welfare of future citizens (third parties), which would violate Constraint 5. Assuming the abstraction holds, the pair successfully demonstrates that epistemic superiority (Constraint 6) is not the driver of the verdict, since the later agent is equally informed in both scenarios. The pair shows that precommitment ethics turns on the *ontology of the good* rather than the *psychology of the binder*. It does not show, however, how to classify ambiguous goods (e.g., is health will-dependent if it involves lifestyle?), which remains a boundary problem for the thesis.
