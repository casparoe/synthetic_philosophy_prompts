  # Research Proposal: Localized Non-Transmission and the Normative Gap in Dialetheism

  ## Abstract

  Dialetheism, the view that some contradictions are true, has traditionally been defended through metaphysical and semantic arguments centered on paradoxes such as the Liar and the Sorites. The standard defense relies on paraconsistent logic to block the principle of *ex contradictione quodlibet* (ECQ), thereby preventing logical explosion. However, the literature largely overlooks a critical normative gap: even if paraconsistent logic blocks explosion formally, it does not automatically provide a rational agent with a principled method for managing belief in true contradictions. Without a specific normative theory of belief revision, the dialetheist risks either collapsing into trivialism (believing everything) or covertly reintroducing classical consistency constraints that undermine the dialetheic position. This research proposal outlines a project to develop and defend a middle-ground closure principle termed *Localized Non-Transmission* (LNT). LNT posits that while a true contradiction in a specific semantic domain licenses inferences within that domain, it blocks cross-domain propagation unless an explicit bridge premise is independently warranted. The project proceeds in three phases: first, formalizing LNT within a standard paraconsistent belief-set framework without inventing new logical calculi; second, stress-testing the principle against three major objections regarding trivialism, error discrimination, and ad hocness; and third, assessing whether LNT can be motivated independently of dialetheism to avoid question-begging. The ultimate goal is to produce a defensible normative framework that renders dialetheism rationally tenable for agents without abandoning coherence, while offering opponents a non-circular ground for rejection.

  ## 1. Introduction

  ### 1.1 The State of the Debate

  The philosophical discourse surrounding dialetheism has reached a sophisticated stalemate. On one side, proponents argue that certain semantic and semantic-like paradoxes are best resolved by accepting that some sentences are both true and false. This position, most notably associated with the work of Graham Priest and colleagues, challenges the classical law of non-contradiction (LNC) as a universal constraint on truth. On the other side, critics argue that accepting true contradictions is rationally suicidal, as it ostensibly commits the agent to believing everything. The standard defense against this charge is the adoption of paraconsistent logic. By rejecting the validity of *ex contradictione quodlibet* (from a contradiction, anything follows), paraconsistent systems ensure that the presence of a contradiction in a theory does not logically entail every proposition in the language.

  However, this defense relies on a conflation of logical validity with epistemic rationality. Paraconsistent logic demonstrates that a contradiction does not *force* triviality at the level of semantic consequence. It does not, however, dictate how a rational agent ought to manage their belief set when they encounter a contradiction. Logic describes the preservation of truth across interpretations; epistemology describes the norms governing belief acquisition and revision. The gap lies precisely here: if an agent rationally believes a contradiction (because it is true), what norms prevent that belief from infecting their entire web of belief, rendering them practically ineffective?

  Current literature tends to assume that if the logic is paraconsistent, the epistemology will take care of itself. This assumption is unwarranted. A logic that permits $A$ and $\neg A$ to be true without entailing $B$ still leaves open the question of whether a rational agent *should* infer $B$ given other background beliefs that might interact with $A$. Furthermore, standard paraconsistent frameworks often lack a robust mechanism for isolating contradictions. Without such a mechanism, the dialetheist is vulnerable to the charge that their position is stable only in abstracto but collapses under the pressure of actual belief revision.

  ### 1.2 The Problem of Normative Leakage

  The core problem this project addresses is "normative leakage." In classical epistemology, consistency is a regulative ideal. If an agent discovers a contradiction in their belief set, the normative command is clear: revise the set to eliminate the contradiction. This is often codified in principles of coherence or consistency maintenance. For the dialetheist, this command is unavailable. If the contradiction is true, eliminating it would mean abandoning a truth. Therefore, the dialetheist needs a different normative command. They need a principle that tells them how to live with the contradiction without letting it destroy the utility of their belief system.

  Existing paraconsistent approaches often handle this by appealing to "rational acceptability" criteria that are external to the logic itself. For instance, an agent might accept a contradiction only if it is forced by the data and the theory is otherwise superior. However, this does not address the *inferential* consequences of that acceptance. If I believe $A$ and $\neg A$, and I also believe $A \to C$, do I believe $C$? In a paraconsistent logic, $A, \neg A \nvdash C$. But if I believe $A$, and I believe $A \to C$, standard modus ponens suggests I should believe $C$. If I also believe $\neg A$, and $\neg A \to D$, should I believe $D$? If $C$ and $D$ are contradictory, or if $C$ entails something absurd in a different context, the agent faces a crisis of rationality.

  The danger is twofold. First, without a containment principle, the agent may find themselves warranting arbitrary conclusions through complex chains of reasoning that effectively replicate explosion, even if the base logic blocks it. Second, to avoid this, the dialetheist may be tempted to impose classical consistency constraints on belief revision "by hand," effectively admitting that while contradictions are *true*, they are not *believable*. This retreat undermines the spirit of dialetheism, which claims that true contradictions can be rationally accepted.

  ### 1.3 The Proposal: Localized Non-Transmission

  This research proposes to fill this gap by developing a normative principle of belief revision called *Localized Non-Transmission* (LNT). LNT operates on the hypothesis that rational belief sets are not monolithic but are structured into domains of discourse. Under LNT, the inferential power of a true contradiction is localized to the domain in which the contradiction arises. Inferences generated by the contradiction are licensed within that domain but are blocked from propagating to other domains unless an explicit "bridge premise" connects them.

  A bridge premise is a proposition that explicitly warrants the transfer of information from Domain 1 to Domain 2. In the absence of such a premise, the contradiction remains contained. This is not a logical restriction—the logic remains paraconsistent and allows for standard inference rules—but a normative restriction on belief closure. It asserts that rational agents are not obligated to close their belief sets under all logical consequences if those consequences cross domain boundaries without specific warrant.

  This proposal offers a middle ground between the permissiveness of naive paraconsistent belief management and the restrictiveness of classical consistency requirements. It allows the dialetheist to maintain that contradictions are true and believable, while providing a robust defense against the charge of irrationality. It acknowledges that belief in a contradiction carries a cost: the loss of inferential freedom across domains. This cost makes the acceptance of contradictions a serious theoretical move, rather than a license for cognitive anarchy.

  ### 1.4 Scope and Methodology

  The project is designed as a one-semester research endeavor, resulting in a paper of approximately 6,000 words. The scope is restricted to propositional cases to ensure tractability. Modal logic, set-theoretic paradoxes, and higher-order logic extensions will be excluded, as they introduce complexities that would obscure the normative core of the argument. The formal work will utilize standard paraconsistent belief-set frameworks, such as those based on the Logic of Paradox (LP), without inventing new logical calculi. The innovation lies in the normative layer applied to the belief set, not in the underlying consequence relation.

  The research will proceed in three distinct parts. Part One will formalize the LNT principle within a belief-set framework, defining domains, bridge premises, and the conditions for non-transmission. Part Two will subject LNT to three critical objections: the slippery slope to trivialism, the problem of distinguishing true contradictions from mere error, and the charge that the principle is ad hoc. Part Three will assess the independent motivation of LNT, determining whether it can be justified without presupposing the truth of dialetheism, thereby ensuring the debate remains non-question-begging.

  ### 1.5 Significance of the Project

  Success in this project would yield a significant contribution to the philosophy of logic and epistemology. For dialetheists, it provides a missing piece of the rationality puzzle, offering a way to be a dialetheist without being a trivialist. For classical logicians, it clarifies the exact point of divergence: the dispute is not merely about truth conditions, but about the norms of belief revision. If LNT is defensible, it shifts the burden of proof. Opponents can no longer simply assert that dialetheism is irrational; they must demonstrate why LNT is an unacceptable normative constraint. Conversely, if LNT fails, it identifies a specific vulnerability in dialetheic epistemology that requires further work.

  Ultimately, this project seeks to move the debate beyond the metaphysical question "Are there true contradictions?" to the normative question "How should we believe them?" By isolating this tractable gap, the research aims to advance the dialectic in a way that is productive for both sides, fostering a more nuanced understanding of the relationship between logic, truth, and rational agency.

  ## 2. The Normative Gap in Dialetheism

  ### 2.1 Metaphysical Defenses vs. Epistemic Norms

  The dominant strain of dialetheic argumentation is metaphysical and semantic. It focuses on the status of specific sentences, such as the Liar sentence ("This sentence is false"). The argument proceeds by showing that classical semantics leads to inconsistency or incompleteness, whereas a paraconsistent semantics that allows truth-value gluts (both true and false) preserves intuitive principles like the T-schema. This is a defense of dialetheism as a theory of *truth*.

  However, a theory of truth does not automatically generate a theory of *belief*. An agent can acknowledge that a certain semantic framework permits true contradictions without personally adopting those contradictions into their belief set. The move from "There are true contradictions" to "I should believe a contradiction" requires an epistemic bridge. Standard dialetheic literature often assumes this bridge is self-evident: if a proposition is true and warranted by the best theory, a rational agent should believe it. While plausible, this assumption ignores the unique structural risks posed by contradictory beliefs.

  In classical epistemology, the norm of consistency is foundational. It is often treated as a constitutive norm of belief: to believe is, in part, to hold as true, and one cannot hold $P$ and $\neg P$ as true without a failure of the attitude. Dialetheism rejects this constitutive norm. But rejecting a norm creates a vacuum. If consistency is not the regulator of belief, what is? The dialetheist cannot simply say "believe what is true," because the presence of a true contradiction changes the inferential landscape. In a classical setting, believing a contradiction is a terminal error; it signals that the belief system is broken and must be purged. In a dialetheic setting, believing a contradiction is a stable state. This stability requires management.

  ### 2.2 The Insufficiency of Paraconsistent Logic

  It is a common misconception that adopting paraconsistent logic solves the rationality problem. Paraconsistent logic ensures that the consequence relation $\vdash$ does not explode. That is, $\{A, \neg A\} \nvdash B$ for arbitrary $B$. This protects the *theory* from triviality. However, agents do not believe theories in isolation; they believe sets of propositions that interact.

  Consider an agent who believes a true contradiction $A \land \neg A$ in the domain of semantics. They also hold beliefs about physics, ethics, and everyday navigation. Logic alone does not prevent the agent from forming a belief like "If semantics is contradictory, then traffic lights are unreliable." If the agent accepts this conditional, and they believe the antecedent (semantics is contradictory), they are logically committed to the consequent (traffic lights are unreliable). Paraconsistent logic does not block modus ponens. Therefore, the explosion can re-enter through the back door of conditionals and background beliefs.

  The logical block on ECQ is necessary but not sufficient for rational belief management. It stops the direct inference from contradiction to arbitrariness. It does not stop the indirect inference via bridge principles that connect the contradictory domain to the rest of the agent's worldview. This is the "leakage" problem. Without a normative constraint on how contradictions interact with bridge principles, the agent's belief set remains vulnerable to practical trivialization, even if it is logically non-trivial.

  ### 2.3 Existing Solutions and Their Flaws

  Current attempts to address this normative gap generally fall into two categories: permissivism and restrictivism.

  **Permissivism** suggests that since the logic is paraconsistent, agents are free to infer whatever follows logically from their beliefs, even if they contain contradictions. The burden is on the agent to ensure their beliefs are "sensible." The flaw here is that it offers no guidance. It essentially says, "You can believe contradictions, just don't be crazy." This is not a normative theory; it is an abdication of normative theory. It leaves the dialetheist vulnerable to the charge that their position is rationally unstable because it relies on undefined "sensibility" constraints that look suspiciously like classical consistency.

  **Restrictivism** suggests that while contradictions are true, they should not be "assertible" or "believable" in a full-blooded sense. Some dialetheists have flirted with the idea that true contradictions are "gluts" that we can acknowledge but should not fully integrate into our reasoning. The flaw here is that it undermines the dialetheic claim. If we cannot believe true contradictions, in what sense are they true? Truth is traditionally the aim of belief. If a truth is systematically excluded from rational belief, the concept of truth being employed is detached from its normative role in agency. This makes dialetheism a metaphysical curiosity rather than a live option for rational agents.

  Both approaches fail to provide a principled middle ground. Permissivism risks trivialism; Restrictivism risks irrelevance. What is needed is a principle that acknowledges the truth of the contradiction (satisfying the metaphysical claim) and permits belief in it (satisfying the epistemic aim), but structures that belief to prevent cognitive collapse (satisfying the normative requirement). This is the niche that Localized Non-Transmission aims to fill.

  ### 2.4 The Need for a Distinctive Normative Theory

  The argument for a distinctive normative theory rests on the uniqueness of the dialetheic situation. In standard belief revision theory (e.g., AGM theory), the input of a contradiction triggers a contraction operation to restore consistency. For the dialetheist, contraction is the wrong response. They need an *accommodation* operation. They must adjust their belief set to house the contradiction without letting it dominate.

  This requires a norm that is specific to the dialetheic context. Classical norms are designed to eliminate contradictions. Paraconsistent logic is designed to tolerate them. But tolerance is not the same as management. A normative theory of belief revision for dialetheism must explain how tolerance is operationalized. It must answer: When does a contradiction license an inference? When does it not?

  Without this theory, the dialetheist is forced to rely on intuition. But intuition is classically trained. Most philosophers intuitively feel that believing a contradiction is dangerous. A dialetheic normative theory must explain why that intuition is mostly right (contradictions are dangerous) but sometimes wrong (unless they are true). LNT proposes that the danger lies in *transmission*, not in *presence*. The contradiction itself is harmless if contained; the harm arises when it is allowed to propagate. This shifts the normative focus from the content of the belief to the structure of the inference.

  ## 3. Formalizing Localized Non-Transmission

  ### 3.1 The Belief-Set Framework

  To formalize LNT, we do not need to invent a new logic. We can operate within a standard paraconsistent belief-set framework, such as one based on the Logic of Paradox (LP). In LP, valuations can assign true (1), false (0), or both (b) to atomic sentences. A sentence is designated (accepted) if it has value 1 or b. The consequence relation preserves designated values.

  Let $K$ be an agent's belief set, a set of sentences closed under the paraconsistent consequence relation $\vdash_{pc}$. In standard frameworks, if $A \in K$ and $A \vdash_{pc} B$, then $B \in K$. This is the principle of Closure. The problem arises when $K$ contains a contradiction $A \land \neg A$. While $\vdash_{pc}$ blocks explosion, $K$ may contain conditionals that allow the contradiction to influence unrelated beliefs.

  LNT modifies the Closure principle. It introduces a structure of *Domains* to the belief set. Let $K$ be partitioned into subsets $\{D_1, D_2, ..., D_n\}$, where each $D_i$ represents a domain of discourse (e.g., Semantics, Physics, Ethics). These domains are not logically isolated; they are normatively isolated.

  ### 3.2 The LNT Principle

  The core principle of Localized Non-Transmission can be stated as follows:

  **LNT:** For any belief set $K$ partitioned into domains $\{D_i\}$, if $D_i$ contains a true contradiction $C$, then inferences derived from $C$ are licensed within $D_i$ but are blocked from entering $D_j$ (where $i \neq j$) unless there exists a Bridge Premise $P \in K$ such that $P$ warrants the implication from $D_i$ to $D_j$.

  Formally, let $Infer(C, D_i)$ be the set of consequences of $C$ within domain $D_i$.
  Standard Closure: $Infer(C, D_i) \subseteq K$.
  LNT Closure: $Infer(C, D_i) \cap D_j = \emptyset$ unless $\exists P \in K$ such that $P$ is of the form $\phi \to \psi$ where $\phi \in D_i$ and $\psi \in D_j$, and $P$ is independently warranted.

  The crucial addition is the requirement for *independent warrant* for the bridge premise. In standard belief revision, if I believe $A$ and I believe $A \to B$, I believe $B$. Under LNT, if $A$ is part of a contradictory cluster in $D_i$, and $B$ is in $D_j$, I cannot simply use my existing belief $A \to B$. I must re-evaluate the bridge premise $A \to B$. Is this conditional warranted independently of the contradictory status of $A$?

  This prevents the "back door" explosion. If the only reason I believe "If semantics is contradictory, then traffic lights are unreliable" is because I am reasoning loosely from the contradiction itself, LNT blocks the inference. I must have a specific, independent reason to link semantics to traffic lights.

  ### 3.3 Defining Domains and Bridges

  A potential criticism is that "domains" are vague. For the purposes of this project, domains will be defined functionally rather than ontologically. A domain is a cluster of propositions that share a common subject matter and inferential role. For example, propositions about truth values form the Semantic Domain. Propositions about physical objects form the Physical Domain.

  The "Bridge Premise" is the mechanism of interaction. In normal reasoning, we assume bridges are open. If I believe "It is raining" (Weather) and "If it is raining, the ground is wet" (Weather $\to$ Physics), I infer "The ground is wet." LNT does not block this. LNT only activates when a *contradiction* is present in the source domain.

  This distinction is vital. LNT is not a general skepticism about cross-domain inference. It is a specific containment protocol for contradictory information. If $D_i$ is consistent, standard closure applies. If $D_i$ contains a true contradiction, LNT applies. This makes the principle sensitive to the content of the belief set, which is appropriate for a normative theory of revision.

  ### 3.4 Comparison with Existing Paraconsistent Frameworks

  How does this differ from standard paraconsistent belief management? In standard LP-based epistemology, the agent simply accepts that some inferences fail. They accept that $A, \neg A \nvdash B$. But they do not typically restrict $A, (A \to B) \vdash B$ based on domains.

  LNT adds a layer of *epistemic caution*. It acknowledges that while the logic permits the inference, the *rationality* of the inference depends on the stability of the source. A contradictory source is unstable (in the sense that it violates classical expectations). Therefore, drawing conclusions from it requires extra justification when moving to new contexts.

  This can be modeled without changing the underlying logic. The logic remains LP. The *acceptance rule* changes. Instead of "Accept all logical consequences," the rule is "Accept all logical consequences within the domain of the premises; for cross-domain consequences, require independent warrant for the connecting conditionals." This is a meta-logical norm, consistent with the instruction to avoid inventing new logic.

  ### 3.5 Propositional Restrictions

  To maintain tractability, this formalization is restricted to propositional logic. We are not dealing with quantifiers or modal operators. A "domain" in this context is simply a labeling of atomic propositions. Let $Atoms = \{p, q, r, s, ...\}$. Let $Label(p) \in \{D_1, D_2\}$.
  If $p \in D_1$ and $\neg p \in D_1$, and $p \to q$ is in $K$ with $q \in D_2$.
  Standard Paraconsistent Belief: Accept $q$.
  LNT Belief: Suspend belief in $q$ unless $p \to q$ is warranted independently of $p$'s contradictory status.

  This simplification allows us to focus on the normative mechanism without getting bogged down in the complexities of quantified paraconsistent logic. The core philosophical issue is the transmission of warrant, which is fully present in the propositional case.

  ## 4. Objections and Replies

  ### 4.1 The Slippery Slope to Trivialism

  **Objection:** The most immediate objection is that LNT is insufficient to prevent trivialism. If an agent accepts a true contradiction in $D_1$, why can't they simply construct a bridge premise to $D_2$? If they can construct one bridge, they can construct bridges to everywhere. Eventually, the contradiction infects the whole system, and we return to trivialism. The agent might say, "I warrant the bridge premise 'If semantics is contradictory, then everything is true'." If they believe this bridge, LNT cannot stop them.

  **Reply:** This objection confuses *logical possibility* with *rational warrant*. LNT is a normative principle, not a logical cage. It does not make it *impossible* to believe trivializing bridge premises; it makes it *irrational* to do so without independent support. The demand for "independent warrant" is the key. To warrant the bridge "If semantics is contradictory, then everything is true," the agent would need a reason to believe that conditional that does not rely on the contradiction itself. But the only reason to believe that conditional is usually the fear of explosion, which LNT shows is unfounded in paraconsistent logic.

  Therefore, a rational agent following LNT would find no warrant for the trivializing bridge. The slippery slope is blocked because the slope requires irrational belief revision at each step. The agent is not forced to accept the bridge; they must actively justify it. Since the justification is lacking (because explosion is blocked by the logic), the bridge is not built. LNT shifts the burden of proof onto the propagation of the contradiction, rather than the containment of it.

  ### 4.2 The Problem of Distinguishing Contradiction from Error

  **Objection:** A practical epistemic problem arises: How does the agent know when to apply LNT? LNT applies when a contradiction is *true*. But agents are fallible. Often, when an agent encounters a contradiction, it is due to error, not truth. If the agent treats every contradiction as a "true contradiction" and applies LNT, they may insulate their errors from correction. They might say, "I believe $P$ and $\neg P$ in the domain of Physics. I will apply LNT to stop this from affecting my Engineering beliefs." But if the contradiction was just a mistake, they should have resolved it, not contained it. LNT might encourage dogmatism.

  **Reply:** This is a serious challenge regarding the *trigger condition* for LNT. The proposal must clarify that LNT applies only to contradictions that are *warranted as true*, not merely *believed*. There is a distinction between "I currently hold contradictory beliefs" and "I believe there is a true contradiction."

  LNT is a norm for the latter. Before activating LNT, the agent must have gone through a process of reflection and determined that the contradiction is not resolvable by standard revision and is supported by strong theoretical reasons (e.g., the Liar paradox). If the contradiction is due to simple error, the classical norm of consistency maintenance applies. LNT is a specialized tool for specialized cases.

  To mitigate the risk of dogmatism, LNT includes a review clause. Domains under LNT containment are subject to higher scrutiny. The agent must periodically review whether the contradiction is still warranted. If new evidence suggests the contradiction was an error, LNT is deactivated, and standard revision resumes. This makes LNT a dynamic norm, not a permanent shield. It acknowledges that dialetheic belief is a high-risk state that requires ongoing monitoring.

  ### 4.3 The Charge of Ad Hocness

  **Objection:** Critics will argue that LNT is designed solely to save dialetheism from refutation. It looks like an ad hoc maneuver: "We have a problem with explosion, so let's invent a rule that stops explosion." If the principle has no motivation other than protecting dialetheism, it lacks philosophical weight. It would be a defensive stratagem rather than a genuine insight into rationality.

  **Reply:** To counter this, Part Three of the project will focus on independent motivation. However, even within this section, we can note that LNT mirrors practices in other areas of inquiry. In science, for example, conflicting theories are often compartmentalized. Physicists use General Relativity for cosmology and Quantum Mechanics for particles, despite their known incompatibility. They do not let the contradiction between the two fields infect their engineering calculations for bridges. They use "bridge principles" (effective field theories) to connect them where necessary, but otherwise keep them isolated.

  This suggests that domain isolation is a general rational strategy for managing inconsistency, not just a dialetheic trick. Classical agents do this when they hold inconsistent ideals or provisional theories. LNT formalizes this common practice and extends it to the case where the inconsistency is accepted as true. If compartmentalization is rational for provisional inconsistency, it should be rational for true inconsistency. This provides a precedent for LNT that exists independently of dialetheism. It appeals to a general norm of *inferential caution* in the face of inconsistency, which is a widely shared intuition.

  ## 5. Independent Motivation and Viability

  ### 5.1 Motivating LNT Without Dialetheism

  The success of this project hinges on whether LNT can be motivated without presupposing the truth of dialetheism. If LNT only makes sense *if* dialetheism is true, then classical logicians will reject it as question-begging. They will say, "I don't need LNT because I don't believe true contradictions exist."

  To avoid this, LNT must be presented as a robust norm for *uncertain* or *risk-laden* belief management. Even a classical logician can accept that agents sometimes find themselves in situations where they must reason with inconsistent information temporarily. In computer science, for instance, databases often contain inconsistent data. Systems are designed to query specific modules without allowing the inconsistency to crash the whole system. This is a form of Localized Non-Transmission.

  If LNT is recognized as a sound principle for managing *apparent* contradictions or *provisional* inconsistencies, then its application to *true* contradictions is a natural extension. The classical logician can accept the principle while rejecting the premise that triggers it (the existence of true contradictions). This creates a common ground. The debate shifts from "Is LNT rational?" to "Are there ever cases where the trigger condition is met?"

  This strategy ensures that the opponent cannot reject the framework simply because they are not dialetheists. They must engage with the normative claim itself. If they reject LNT even for provisional inconsistency, they must defend a view of rationality that demands immediate global consistency, which is often impractical for finite agents.

  ### 5.2 Coherence vs. Consistency

  A key aspect of the independent motivation is distinguishing coherence from consistency. Consistency is a logical property (no $A$ and $\neg A$). Coherence is a structural property of the belief system (beliefs support each other, are compartmentalized appropriately). Classical epistemology often conflates the two, assuming coherence requires consistency.

  LNT argues that coherence can be maintained without consistency, provided there is structural isolation. A belief set can be coherent if the contradictions are properly managed and do not disrupt the agent's ability to function. This aligns with pragmatic theories of rationality. If the goal of belief is successful action, and LNT allows successful action despite contradictions, then LNT supports the goal.

  This motivation is independent of truth. It focuses on *function*. Whether the contradiction is true or false, the functional requirement to prevent cognitive collapse remains. Therefore, LNT is motivated by the needs of agency, not the metaphysics of truth. This makes it a robust normative tool that can survive the rejection of dialetheism.

  ### 5.3 Viability for Opponents

  For the project to succeed, it must offer a framework that opponents can reject on non-question-begging grounds. LNT achieves this by making a specific, testable claim: that cross-domain inference requires independent warrant in the presence of contradiction.

  An opponent can reject this by arguing that logical consequence is sufficient for belief obligation, regardless of domains. They can argue that if $A \to B$ is believed, and $A$ is believed, $B$ must be believed, even if $A$ is contradictory. This is a clear, substantive disagreement about the norms of belief. It is not a dismissal of dialetheism as nonsense; it is a disagreement about epistemic duty.

  This improves the quality of the debate. Instead of talking past each other (metaphysics vs. rationality), both sides can engage with the normative principle. The classical logician can say, "I accept LNT for provisional cases, but deny it applies to truth." The dialetheist can say, "There is no relevant difference between provisional and true contradictions regarding management." This is a fertile ground for philosophical progress.

  ### 5.4 Potential Collapse into Classical Consistency

  A final viability check: Does LNT secretly reintroduce classical consistency? If the requirements for "independent warrant" are so high that no bridge premise can ever be warranted in the presence of contradiction, then the contradiction is effectively isolated completely. It becomes inert. If a belief has no inferential consequences outside its domain, does it function as a belief?

  This is the risk of "epistemic quarantine." If the contradiction is too contained, it might as well not be believed. To avoid this, LNT must allow for *some* transmission. It does not block all cross-domain inference, only that which lacks independent warrant. In many cases, strong bridge premises will exist. For example, logical truths bridge all domains. LNT does not block the inference of logical truths. It only blocks the propagation of the *specific* consequences of the contradiction.

  This ensures the contradiction remains active and influential, but in a controlled way. It prevents the collapse into classical consistency by allowing the contradiction to have local effects. The agent really does believe $A$ and $\neg A$, and really does draw local conclusions. They just don't let it ruin their physics. This strikes the balance required for a viable dialetheic epistemology.

  ## 6. Conclusion

  ### 6.1 Summary of the Project

  This research proposal has outlined a project to address the normative gap in dialetheism. The central thesis is that paraconsistent logic is insufficient for rational belief management; a supplementary normative principle is required. The proposed principle, Localized Non-Transmission (LNT), mandates that the inferential power of true contradictions be contained within their semantic domains unless explicit bridge premises warrant cross-domain propagation.

  The project is structured to formalize this principle within existing paraconsistent frameworks, test it against objections regarding trivialism, error, and ad hocness, and establish its independent motivation. By restricting the scope to propositional logic and focusing on the architecture of belief revision, the project remains tractable for a one-semester timeline while addressing a fundamental weakness in the dialetheic position.

  ### 6.2 Expected Contributions

  The primary contribution of this work will be a clarified understanding of the epistemic commitments of dialetheism. It moves the discussion from "Can contradictions be true?" to "How can contradictions be believed?" This is a necessary evolution for the field. As paraconsistent logic becomes more technically sophisticated, the philosophical implications for agency must keep pace.

  LNT offers a concrete model for this evolution. It provides dialetheists with a defense against the charge of irrationality that does not rely on retreating from the truth of contradictions. It provides classical logicians with a specific normative claim to critique, rather than a vague metaphysical one. This specificity enhances the quality of the dialectic.

  ### 6.3 Future Directions

  While this project is restricted to propositional cases, the success of LNT could pave the way for broader applications. Future research could explore LNT in the context of first-order paraconsistent logic, or its application to specific paradoxes like the Sorites. It could also be integrated with formal models of belief revision (AGM) to create a "Dialetheic AGM" framework.

  Furthermore, the concept of domain isolation has applications beyond dialetheism. It could inform theories of scientific pluralism, moral dilemmas, and legal inconsistency. The normative insight that inconsistency requires containment rather than elimination may have wide-ranging relevance.

  ### 6.4 Final Assessment

  The project stands on a clear conceptual architecture. It identifies a gap, proposes a specific solution, and outlines a rigorous method for testing that solution. The risk of failure lies in the possibility that LNT is either too weak to prevent trivialism or too strong to be distinct from classical consistency. However, the proposed testing phase (Part Two) is designed specifically to identify and correct these weaknesses.

  By focusing on the normative dimension, this research acknowledges that logic is not just a study of truth preservation, but a tool for rational agency. If dialetheism is to be a live philosophical option, it must offer a way to live with contradictions. Localized Non-Transmission proposes that we do so by building firewalls in our belief systems, not by denying the fire. This metaphor captures the essence of the project: a pragmatic, structured approach to the radical idea that some contradictions are true. The result will be a more robust, defensible, and rationally coherent dialetheism.
