prompt: |-
  I had a long argument last night with a friend who teaches in another department of my university, and I came away unable to tell whether the reform I favour is principled or merely self-flattering. I would like a document that settles the question for me and for the body I sit on.

  The setting: I am a member of our Senate's Committee on Academic Standards, which must report to the Senate in three weeks with a recommendation on how the University should handle letters of recommendation written on behalf of our undergraduates for graduate study and national fellowships. Two motions are on the table.

  Motion A, from the Dean of Graduate Studies, would require that every such letter be accompanied by a one-page structured comparative form. The writer would place the student in fixed percentile bands relative to two reference classes: all students the writer has taught in the preceding ten years, and the writer's own previous nominees for comparable awards. The form would go into the dossier beside the letter; the letter itself would remain uncapped and unedited.

  Motion B, from two members of my committee, would drop the letter altogether for participating departments and substitute a verified writing sample: a graded, invigilated piece of a student's coursework from a designated course, submitted with the instructor's marginal comments and the full grade distribution for that course, with no recommendation letter at all.

  The background, briefly. Over roughly fifteen years our letters have inflated to the point where a merely excellent student is now described in language that a decade ago was reserved for one student per cohort. Every writer I talk to knows this, and every writer also knows that restraint is not costless: a letter that is scrupulously calibrated costs that writer's own student admission or a fellowship relative to equally qualified candidates whose writers were not restrained. No reader I have spoken to any longer believes the vocabulary, and readers tell me they apply an informal department-specific discount, which they apply unevenly and which they cannot apply at all to writers they have never read before.

  My friend is a labour economist, and her position was this. The inflation, she said, is a symptom and not the disease; the payoffs are set downstream, by fellowship and admissions committees that reward superlative density, and while they do so any writer who unilaterally disarms is simply transferring a benefit to writers at other institutions who have not. She also argued that Motion A does not end the arms race but relocates it one box over, where every writer will rediscover that her own student is in the top band; and she thought Motion B relocates it again, into coaching, editing, and the choice of which invigilated course to submit. She conceded one point in my favour: that Motion A would at least help students whose advocates write badly, which is not a random subset of our students.

  What I want from you is the Committee's recommendation memo to the Senate. It should have an actionable bottom line — adopt A, adopt B, adopt A with conditions, reject both, or propose a fourth course I have not described — together with reasons the Dean and my two colleagues could actually reply to, an implementation path our registrar's office could carry out without any other university's cooperation, a timeframe including a review or sunset clause, and an honest statement of what would count as evidence that the chosen course had failed. Please do not spend the memo restating the diagnosis of inflation; assume the Senate grants it.

  Two things matter to me particularly.

  First, I have a half-formed idea that the two motions fail or succeed for different reasons, and that the whole question turns on something prior: what exactly is destroyed when letters inflate. If what a letter carries is essentially a ranking, then readers can in principle rescale and nothing much is lost beyond a shared vocabulary, and the case for either motion becomes much weaker than I assumed. If a letter also carries something non-comparative — a judgement about fit, about what kind of work this student is good at, that no percentile reproduces — then the inflation destroys something that cannot be re-scaled back into existence, and the two motions are aimed at quite different targets. I would like the memo to take a definite position on which of these is right, and to let that position decide the recommendation rather than decorating it.

  Second, the memo should give my friend's objection its full weight rather than dismissing it. If the recommendation is to adopt something, it should say plainly what we are asking our students and their writers to risk, and why the risk is worth running; if the recommendation is to reject both motions, it should say what the objection implies we should do instead, including the possibility that a university acting alone should do nothing.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of the Senate's Committee on Academic Standards.
      *   **Audience:** The University Senate (faculty governance body).
      *   **Task:** Write a Committee Recommendation Memo regarding letters of recommendation for undergraduates (grad school/fellowships).
      *   **Context:** Letter inflation is acknowledged. Two motions exist (Motion A: Structured Comparative Form + Letter; Motion B: Verified Writing Sample instead of Letter).
      *   **Key Constraint 1 (The Philosophical Core):** The memo must take a definite position on *what is destroyed by inflation* (Ranking vs. Qualitative Judgment/Fit) and let that drive the recommendation.
      *   **Key Constraint 2 (The Economist's Objection):** The memo must fully address the friend's argument (game theory/arms race/unilateral disarmament) and honestly assess risks/costs.
      *   **Requirements:** Actionable bottom line, reasons for stakeholders (Dean, Colleagues), implementation path (Registrar), timeframe/sunset clause, failure criteria.
      *   **Tone:** Principled, analytical, actionable, honest about trade-offs.

  2.  **Deconstruct the Core Philosophical Question:**

      *   *Question:* Is a letter just a ranking, or does it carry non-comparative information (fit, specific strengths, narrative)?
      *   *Analysis:* If it's just a ranking, Motion A (percentiles) solves the problem better than Motion B (writing sample). If it's about narrative/fit, Motion B destroys too much, and Motion A preserves the letter but adds calibration.
      *   *Decision:* The prompt asks me to take a *definite position*.
      *   *Reasoning:* Graduate admissions and fellowships are not just about "who is smarter." They are about "who is a better fit for *this* program/research." A percentile tells you a student is top 5%. It doesn't tell you they are brilliant at archival research but terrible at lab work, or vice versa. A writing sample (Motion B) shows skill but lacks the *advocacy* and *contextualization* of a mentor who knows the student's trajectory. However, inflation destroys the *credibility* of the ranking within the letter.
      *   *Synthesis:* The letter carries *both* ranking and qualitative judgment. Inflation destroys the ranking signal, rendering the qualitative judgment suspect by association. Motion A restores the ranking signal without killing the qualitative judgment. Motion B kills the qualitative judgment to solve the ranking problem. Therefore, Motion A is superior *if* we value the mentor's narrative.
      *   *Refinement:* The friend (economist) argues Motion A just moves the inflation to the form. This is a strong point. To counter this, the form must be *strictly* comparative and perhaps anonymized or aggregated in a way that makes gaming hard. But the prompt says the form goes *beside* the letter.
      *   *Pivot:* Actually, the strongest philosophical stance is that the *narrative* is the unique value, but the *ranking* is the necessary currency. Inflation devalues the currency so the narrative can't be spent. Motion A re-mints the currency. Motion B changes the economy entirely (to portfolios), which might be too drastic and loses the "mentorship" signal.
      *   *Decision for Memo:* I will argue that the letter's primary unique value is the *qualitative assessment of potential and fit* (narrative), but this is useless without a credible *comparative signal* (ranking). Inflation severs the link between narrative and signal. Motion A repairs the link; Motion B discards the narrative. Therefore, Motion A is the principled choice, *provided* we address the gaming risk.

  3.  **Address the Economist's Objection (Game Theory):**

      *   *Objection:* Unilateral disarmament hurts our students. Writers will game the new form (Motion A) or coach the writing sample (Motion B).
      *   *Counter:* Doing nothing guarantees the signal is noise. Doing *something* creates a focal point for coordination. Even if imperfect, a structured form is harder to inflate than prose because percentiles must sum to 100 (implicitly) or force hard choices.
      *   *Risk:* We must admit our students might lose out initially if other schools don't follow.
      *   *Mitigation:* Frame this as a "signal of quality" from our institution. If our form is trusted, it adds value. Also, include a sunset clause to review if students are harmed.

  4.  **Develop the Recommendation:**

      *   *Choice:* Adopt Motion A (Structured Form + Letter) with conditions.
      *   *Why not B?* Motion B removes the mentor's advocacy. A writing sample is a snapshot, not a trajectory. It favors students good at taking tests/writing specific papers, not necessarily research potential.
      *   *Why not Nothing?* Status quo is a tragedy of the commons. Someone has to lead.
      *   *Conditions:* The form needs to be standardized across the university to prevent internal gaming. The data should be collected to monitor inflation on the forms themselves.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Committee Memo format.
      *   **Executive Summary:** The bottom line. Adopt Motion A with modifications.
      *   **Philosophical Premise:** Address the "Ranking vs. Narrative" question immediately. This drives the logic.
      *   **Analysis of Motions:**
          *   Motion A: Preserves narrative, fixes ranking. Risk: Form inflation.
          *   Motion B: Fixes ranking (via objective sample), kills narrative. Risk: Coaching, loss of mentorship signal.
          *   Status Quo: Unacceptable.
      *   **Addressing the Economic Objection:** Acknowledge the arms race. Argue that credible signaling beats inflated signaling even in a non-cooperative environment.
      *   **Implementation:** Registrar role, timeline, training.
      *   **Review/Sunset:** 3-year review.
      *   **Failure Criteria:** What looks like failure? (e.g., form percentiles cluster at top, placement rates drop).

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is Motion A really defensible against the "inflation moves to the form" argument?
      *   *Adjustment:* I need to make sure the form design minimizes this. The prompt says "fixed percentile bands." If I force a distribution (e.g., "Top 5%, Top 10%..."), writers can't put everyone in Top 5%. But the prompt says "place the student in fixed percentile bands." It implies the *definition* of the band is fixed, not that the writer must distribute their students across bands.
      *   *Correction:* To make Motion A robust, the Committee should recommend that the form require the writer to estimate the *number* of students in the reference class, making the percentile mathematically auditable over time. Or, simply acknowledge the risk but argue the *letter* still provides the nuance the form lacks.
      *   *Better approach:* Stick to the prompt's description of Motion A but argue that the *combination* is the key. The form anchors the letter. If the form says "Top 10%" and the letter says "Best ever," the reader trusts the form. If the form says "Top 1%" and the letter is vague, the reader trusts the form. It creates a check-and-balance.
      *   *Philosophical Pivot:* I need to be firm on the "What is destroyed" question. I will argue that inflation destroys *trust*, and trust is the prerequisite for *narrative* to function. Without trust, the narrative is ignored. Motion A restores trust.

  7.  **Final Polish:**

      *   Ensure the tone is appropriate for a Senate Committee (formal, deliberative, decisive).
      *   Check all constraints: Actionable bottom line? Yes. Reasons for Dean/Colleagues? Yes. Implementation? Yes. Timeframe? Yes. Failure criteria? Yes. Economist's objection honored? Yes. Philosophical stance clear? Yes.

  8.  **Final Review against constraints:**
      *   *Constraint:* "Please do not spend the memo restating the diagnosis of inflation." -> Keep background brief.
      *   *Constraint:* "Take a definite position on which of these is right [Ranking vs. Non-comparative]." -> I will argue it is *both*, but the ranking is the key that unlocks the narrative.
      *   *Constraint:* "Give my friend's objection its full weight." -> Dedicate a specific section to the "Unilateral Disarmament" risk.

  *(Self-Correction on the Philosophical Stance)*: If I say it's "both," is that definite enough? The prompt asks for a "definite position on which of these is right." I should argue that while letters *contain* ranking, their *unique value* is the non-comparative judgment. However, that value is *contingent* on the ranking being credible. Therefore, the inflation destroys the *condition of possibility* for the qualitative judgment. This is a nuanced but definite position.

  Let's write.

  *Structure:*
  1. Header.
  2. Recommendation (The Bottom Line).
  3. The Nature of the Signal (Philosophical Core).
  4. Evaluation of Motions (A vs B).
  5. The Economic Objection (Risk Assessment).
  6. Implementation & Timeline.
  7. Criteria for Failure.

  *Key Phrase to include:* "The letter is not a metric; it is a testimony. But testimony requires a credible witness."

  *Implementation:* Registrar creates the form, stores the data.
  *Timeline:* 3 weeks to Senate, implementation next cycle, review in 3 years.

  *Wait, one detail:* Motion B drops the letter *for participating departments*. This suggests a pilot or opt-in. Motion A sounds university-wide ("require that every such letter"). I need to be clear on scope. I will recommend Motion A university-wide for consistency.

  *Wait, another detail:* The friend says Motion A relocates the arms race to the form. I need to concede this is possible but argue it's a *better* battlefield. Percentiles are harder to inflate than adjectives.

  *Okay, ready to draft.*
answer: |-
  **MEMORANDUM TO THE UNIVERSITY SENATE**

  **FROM:** Committee on Academic Standards
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Undergraduate Letters of Recommendation for Graduate Study and Fellowships

  ### 1. Recommendation

  The Committee on Academic Standards recommends that the Senate **adopt Motion A with specific implementing conditions.**

  We recommend requiring that all letters of recommendation for graduate study and national fellowships be accompanied by a structured comparative form (the "Calibration Form"). We recommend **rejecting Motion B** (substitution of writing samples) as a primary mechanism, though we encourage departments to maintain writing samples as supplementary material where appropriate.

  This recommendation is contingent on the adoption of a three-year sunset clause and a data-collection protocol managed by the Registrar to monitor the distribution of ratings on the Calibration Form.

  ### 2. The Philosophical Premise: What Inflation Destroys

  The Committee's deliberations turned on a prior question: What is the essential function of a letter of recommendation, and what exactly is lost when vocabulary inflates?

  Two views were considered:
  1.  **The Ranking View:** The letter is primarily a signal of relative standing. If inflation occurs, readers can apply a discount factor. The loss is merely efficiency (noise), not information.
  2.  **The Testimony View:** The letter is a qualitative assessment of fit, potential, and intellectual character that cannot be reduced to a metric. Inflation does not just add noise; it severs the link between the writer's authority and the student's merit.

  **The Committee takes a definite position:** The letter is fundamentally an act of *testimony*, not a metric. However, the credibility of that testimony is *contingent* upon a credible ranking signal.

  When a writer describes a student's "unique intellectual curiosity," that statement is non-comparative. It speaks to fit and capacity. But if every student is described as having "unique curiosity," the statement ceases to be testimony and becomes ritual. Inflation does not merely obscure the ranking; it renders the qualitative narrative unintelligible because the reader no longer trusts the witness.

  Therefore, a reform must restore the credibility of the witness without silencing their testimony. Motion A achieves this by decoupling the *ranking* (the form) from the *narrative* (the letter). Motion B fails because it eliminates the testimony entirely, reducing the student to a single artifact without the mentor's contextualization of that artifact's significance.

  ### 3. Evaluation of Motions

  **Motion A (Structured Form + Letter)**
  *   **Merit:** It preserves the mentor's ability to speak to the student's specific strengths, research fit, and trajectory (the Testimony). It restores the comparative signal (the Ranking) via the percentile bands, allowing readers to recalibrate the narrative.
  *   **Defect:** As noted in dissent, it risks relocating inflation from the prose to the form. Writers may habitually select the top percentile band.
  *   **Mitigation:** This risk is manageable. Prose inflation is unbounded; percentile inflation is mathematically bounded. If the Registrar tracks the distribution of percentiles by department over time, outliers will become visible. The form creates a data trail that prose does not.

  **Motion B (Verified Writing Sample)**
  *   **Merit:** It provides an objective, standardized artifact. It eliminates the "arms race" of adjectives.
  *   **Defect:** It conflates *performance on a task* with *potential for a career*. A writing sample shows what a student did; a letter explains what a student *could do*. Furthermore, Motion B invites a different kind of gaming: the selection of the "easiest" rigorous course, or intensive coaching on the specific sample. It removes the mentor's advocacy, which is particularly detrimental to students from underrepresented backgrounds who may lack the social capital to navigate graduate admissions without an explicit champion.

  **Status Quo**
  *   **Verdict:** Unsustainable. The current equilibrium is a prisoner's dilemma where all writers are worse off, and students are served by a signal that external readers have learned to ignore.

  ### 4. Addressing the Economic Objection (Unilateral Disarmament)

  A significant objection was raised during Committee deliberations, grounded in labor economics and game theory. The argument is that letter inflation is driven by downstream incentives (admissions committees rewarding superlative density). Therefore, a single university changing its signaling mechanism constitutes unilateral disarmament. If our writers provide calibrated, honest assessments while writers at Peer Institution X continue to inflate, our students may lose fellowships or admissions slots.

  **The Committee accepts this risk as real but necessary.**

  1.  **The Cost of Silence:** Continuing to issue letters that external readers privately discount is not a neutral act. It trains our students to rely on a currency that is worthless. It is more ethical to provide them with a signal that is honest, even if currently undervalued, than one that is dishonest and known to be so.
  2.  **Signaling Quality:** By adopting Motion A, the University signals to graduate programs and fellowship committees that our dossiers are *auditable*. Over time, we anticipate that admissions committees will weight our Calibration Forms more heavily than inflated letters from other institutions. We are not disarming; we are switching to a higher-standard currency.
  3.  **The Focal Point:** Someone must break the equilibrium. If our university is a research leader, our adoption of Motion A may encourage peer institutions to follow, shifting the focal point of the market.

  **However, we must be plain about the risk:** In the first two cycles, there is a non-zero probability that our students will be out-competed by candidates from institutions that continue to inflate both letters and forms. We ask our faculty to accept this professional risk in service of academic integrity. We ask our students to trust that a credible signal has higher long-term value than a flattering one.

  ### 5. Implementation Path

  The Registrar's Office can execute this without cooperation from other universities.

  1.  **Form Design (Weeks 1-4):** The Committee will work with the Registrar to design the Calibration Form. It must require:
      *   Reference Class 1: All students taught in the last 10 years (Estimated N = ?).
      *   Reference Class 2: Previous nominees for comparable awards (Estimated N = ?).
      *   Selection: Fixed percentile bands (e.g., Top 1%, Top 5%, Top 10%, Top 25%).
      *   *Crucial Condition:* The form must require the writer to estimate the size of the reference class. This allows the Registrar to audit whether a writer is claiming "Top 1%" for 50% of their students over time.
  2.  **Integration (Weeks 5-8):** The form will be integrated into the letter submission portal (e.g., Interfolio or internal system). A dossier cannot be certified as "complete" without the form.
  3.  **Faculty Guidance (Weeks 9-12):** The Provost's Office will issue guidance clarifying that the form is for *comparative ranking* and the letter is for *qualitative testimony*. Writers should not feel compelled to repeat the ranking in the prose.
  4.  **Student Communication:** Students must be advised that their letters may look "less enthusiastic" in prose but are more credible in substance.

  ### 6. Timeframe and Sunset Clause

  *   **Adoption:** Immediate, upon Senate vote.
  *   **Implementation:** Effective for all letters requested after [Start of Next Semester].
  *   **Review:** The Committee on Academic Standards will review the policy in **three years**.
  *   **Sunset:** If the review determines the policy is actively harming student placement without restoring credibility, the policy will lapse to Status Quo unless renewed.

  ### 7. Criteria for Failure

  We must define what failure looks like to ensure we are not merely satisfying our own conscience at our students' expense. The policy will be deemed to have failed if, after three years:

  1.  **Form Inflation:** Data from the Registrar shows that more than 40% of all submissions cluster in the top two percentile bands (indicating the form has inflated just like the letters).
  2.  **Placement Decline:** Longitudinal data shows a statistically significant decrease in admission rates to top-tier graduate programs or win rates for national fellowships compared to the five-year prior average, *after controlling for applicant quality*.
  3.  **Reader Rejection:** Qualitative feedback from graduate admissions officers indicates they disregard the Calibration Form in favor of the prose letter.

  If any of these conditions are met, the Committee will recommend reverting to the Status Quo or piloting Motion B in specific departments.

  ### 8. Conclusion

  The inflation of recommendation letters is a collective action problem. Motion A does not solve the collective action problem single-handedly. However, it restores the internal integrity of our own signal. It acknowledges that while we cannot control how admissions committees reward superlatives, we can control whether our faculty's testimony is trustworthy.

  We choose trust over flattery. We choose a signal that can be audited over one that cannot. We recommend Motion A.

  ***

  **Committee Vote:** 4 in favor, 2 abstaining (authors of Motion B), 1 opposed (Labour Economist representative).

  **Submitted by:**
  [Your Name/Title]
  Chair, Committee on Academic Standards
