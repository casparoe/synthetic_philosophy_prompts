prompt: |-
  Okay so I've been stuck on Quine's gavagai / indeterminancy of translation thing. There's this old debate that feels totally frozen: one camp says "gavagai" could just as well mean rabbit or undetached rabbit-part, and it's not an epistemic gap—there's genuinely no fact of the matter. The other camp, Davidson-style, says charity and triangulation constrain meaning enough that the indeterminacy collapses into ordinary underdetermination, like in physics. They've been circling each other since the 70s with the same moves. Is this actually a deep ontological disagreement, or a verbal dispute about what counts as "meaning"? Or are they just answering different questions—one about translation manuals, one about mental content—under the same heading? And here's the part that keeps bugging me: imagine we had perfect brain-scan data of every neural firing in the speaker's head the moment they point and say "gavagai". Would that data break the deadlock, or would both sides just reinterpret the scan? If the scan doesn't help, doesn't that mean the stall isn't about missing evidence at all? I want an actual diagnosis—what kind of disagreement is this, supported by what each side actually says—plus what, if anything, would count as real progress. A distinction? A thought experiment? Or is it just hard and we're stuck with it?
