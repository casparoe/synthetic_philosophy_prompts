answer: |-
  ### The Agents and Their Rationalities

  The SVB collapse was not a monolith but a coordination game played by distinct agents with overlapping but non-identical action sets. The primary depositors—founders and startup CFOs—faced a binary choice: wire funds out or stay put. Their private signals were heterogeneous: some knew their own burn rates and impending payroll dates; others knew nothing of the bank's balance sheet. Their payoff was asymmetric. If the bank survived, staying yielded convenience; if the bank failed, staying yielded zero recovery on uninsured funds. The transaction cost of wiring money was near-zero, making the "run" option dominant if the probability of failure crossed a low threshold.

  Venture capital firms acted as signal amplifiers. Their action set included advising portfolio companies. Their private signal was superior, derived from board seats and direct lines to SVB management. Their payoff included not just the liquidity of their own funds, but reputational capital across a portfolio. Advising a move was costless if the bank survived, but catastrophic if it failed and portfolio companies collapsed due to frozen payroll. Thus, for VCs, advising a withdrawal was a weakly dominant strategy once the March 8 capital raise announcement revealed the unrealized losses.

  SVB management and regulators were secondary players in the cascade mechanics but primary drivers of the state. Management's March 8 announcement converted private knowledge of HTM losses into public information. Regulators held the action set of seizure and guarantee, but only after the fact.

  Canonical models diverge on what constitutes rationality here. Informational cascade models (Banerjee; Bikhchandani, Hirshleifer, and Welch) posit that agents ignore private signals to follow the public history of actions. In this lens, CFOs rationally ignored their own limited knowledge of SVB's solvency because the visible action of VCs advised withdrawal. The VC advice swamped private signals. Diamond-Dybvig models, conversely, focus on payoff complementarity: a run is rational not because others know something, but because others' actions change the payoff structure. If others withdraw, liquidity dries up, making withdrawal rational for everyone. Reputational herding suggests VCs advised withdrawals to avoid being the sole advisor who kept funds in a failed bank.

  The disagreement lies in the source of the risk. Informational models assume the bank's solvency is a fixed state unknown to agents. Diamond-Dybvig assumes solvency is irrelevant if liquidity is insufficient. In SVB, both applied, but the Diamond-Dybvig logic was stronger. The uninsured status of 86–89 percent of deposits meant that even a solvent bank could fail to pay if faced with a $42 billion single-day outflow. Rationality dictated running not because the bank was necessarily insolvent, but because the bank was illiquid in the face of a coordinated exit.

  ### Belief Versus Positional Cascades

  The distinction between a belief cascade and a positional cascade sharpens the analysis of March 9. In a belief cascade, agents withdraw because they infer from others' actions that the bank is fundamentally insolvent. The withdrawal is a judgment on the asset quality. In a positional cascade, agents withdraw because they infer from others' actions that the liquid assets are being drained. The withdrawal is a judgment on queue position.

  SVB was a positional cascade. The March 8 announcement revealed the HTM losses, but those losses were accounting entries, not cash outflows, unless realized. The bank was technically solvent on a hold-to-maturity basis. However, the $42 billion withdrawal attempt on March 9 threatened to force the realization of those losses. Depositors were not herding on the belief that "SVB is bankrupt"; they were herding on the belief that "SVB will be bankrupt if I do not leave first."

  Does this distinction collapse into payoff complementarity? On inspection, yes. The distinction holds only if the underlying value of the bank is independent of the run. In standard informational cascades, the asset value is fixed; the crowd is either right or wrong about it. In SVB, the asset value was endogenous to the run. The HTM losses crystallized *because* the run forced the sale. Therefore, the belief that "I will lose money" becomes self-fulfilling. The positional aspect is merely the mechanism by which payoff complementarity operates in real-time. The distinction is useful descriptively to highlight the speed of the drain, but theoretically, it collapses. The payoff for staying becomes negative precisely because others leave, which is the definition of payoff complementarity.

  ### Fractures in the Mapping

  The mapping fails in three critical areas where the SVB episode diverges from standard theoretical assumptions.

  First, the observation structure. Canonical models assume an ordered sequence of actions: Agent 1 acts, then Agent 2 observes, then Agent 3. SVB participants observed a noisy broadcast. The "history" was not a line of people at a teller window but a simultaneity of Slack messages, group chats, and wire instructions. The cascade did not build sequentially; it ignited concurrently. The theory assumes information aggregates over time; SVB showed information aggregates over network density. The cascade result survives, but the speed parameter breaks. The model cannot account for a scenario where the entire sequence compresses into hours.

  Second, and more seriously, the state of the world was not well-defined independently of the run. Standard cascades assume a fixed state (Good/Bad Bank) that agents try to discover. In SVB, the state was produced by the cascade. The $15 billion in unrealized losses were irrelevant unless the bank was forced to sell. The run forced the sale. If the underlying value is partly produced by the cascade, the usual story that cascades can be "wrong" loses meaning. A cascade is "wrong" if it topples a solvent bank. But if the topple itself creates the insolvency, the cascade is technically "right" about the outcome, even if "wrong" about the ex-ante condition. The theory lacks the vocabulary for endogenous solvency.

  Third, the March 12 announcement. Did this stop the run by changing beliefs or payoffs? It changed payoffs. The Treasury and Fed guaranteed all deposits, insured and uninsured. Standard theory suggests public signals work by updating beliefs about the underlying state (i.e., "The bank is actually safe"). Here, the government did not argue SVB was safe; they changed the liability structure so that safety was irrelevant. The payoff for staying became equal to the payoff for leaving (full access to funds). Theory says public signals should resolve information asymmetry. In SVB, the authority resolved the coordination problem by removing the penalty for coordination failure.

  ### The Verdict on Theory

  SVB is neither a pure confirmation nor a simple anomaly; it is a case the framework never anticipated because it introduces a strategic authority that decides, after the fact, whether to send the signal that breaks the herd.

  Standard models treat the government as an exogenous constraint or ignore it. In SVB, the Federal Reserve and Treasury were active players with a delayed move. They observed the cascade and then altered the game tree. This creates a degeneracy in the framework. If agents rationally expect that signal to come—as many did following the 2008 crisis—the run should not occur, because the payoff for staying is protected by expected intervention. If they do not expect it, the run occurs. SVB showed that expectation is fragile and heterogeneous. Some ran because they doubted intervention; others ran because they knew intervention was not guaranteed for uninsured depositors.

  This tells us that cascades in modern banking are not merely equilibria of a depositor model but artifacts of a missing player: the state. The theory is silent on how the expectation of intervention interacts with networked speed. If agents believe the state will save them, the cascade is arrested by moral hazard. If they believe the state will let them fail, the cascade accelerates. SVB occupied the uncertain middle ground where the signal was unknown until the collapse was complete.

  Furthermore, the theory is genuinely silent on the endogenous nature of HTM accounting in a digital run. The models assume a static asset value. SVB proved that in modern banking, asset value is a function of liability stability. When liabilities are digital and networked, stability is a function of information flow speed. The theory treats information as a stream; SVB showed it is a flood.

  Ultimately, SVB confirms that herding is rational when payoffs are complementary and transaction costs are low. However, it exposes that the standard models are insufficient for a system where solvency is contingent on the run itself, and where a strategic authority holds the power to rewrite the payoffs after the herd has moved. The cascade was not a mistake in information processing; it was a rational response to a liquidity trap created by accounting rules and networked coordination. The theory describes the mechanics of the panic but fails to capture the political economy of the resolution. Where the theory assumes a market clearing price or a fixed state, SVB demonstrated a political clearing mechanism. The silence of the models on this strategic authority is not a minor gap; it is a fundamental omission that renders them descriptive of the panic but blind to the cure.
