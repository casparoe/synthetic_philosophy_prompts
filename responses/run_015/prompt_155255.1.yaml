answer: |-
  **The Issue:** The Ontology of the Private Tribunal. When no human audience exists, does the agent act as the *source* of moral value (Dignity) or as the *agent* of a vanished court (Honor)?

  The standard taxonomy defines Honor by external reputation and Dignity by inherent worth. The sealed insult removes the external reputation. Consequently, if a character feels bound to respond privately, the taxonomy cannot distinguish whether they are protecting their internal worth (Dignity) or obeying an internalized code that demands retaliation regardless of witness (Honor). The crux is whether the imperative originates in the self or in a ghostly social order.

  **Two Answers:**

  1.  **The Sovereign Self:** The response is an act of psychological hygiene. The character responds not because a rule demands it, but because the insult disrupts their internal equilibrium. The act is for *them* alone; the goal is to return to baseline.
  2.  **The Internalized Code:** The response is an act of surrogate policing. The character responds because the moral order requires balance, and they are the only available officer of that court. The act is for the *Code*; the goal is to satisfy a requirement of justice that exists independently of their feelings.

  **Behavioral Indistinguishability:**
  Consider the grandfather and the granddaughter. Both receive a sealed insult. Both write a letter of rebuke and then burn it.
  *   If the grandfather burns it to exorcise the anger (Sovereign), he is practicing Dignity.
  *   If the granddaughter burns it because the ritual of grievance requires destruction of the evidence (Internalized Code), she is practicing Honor in disguise.
  *   Conversely, if the grandfather burns it to satisfy the code (Honor) and the granddaughter burns it to let go (Dignity), they inhabit the same culture despite different generations.

  **Scene Meaning:**

  *   **If Sovereign:** The scene dramatizes the family's evolution toward psychological autonomy. The mill town's decline has stripped away the social audience, forcing the characters to find worth within. The conflict is about learning to be enough for oneself.
  *   **If Internalized Code:** The scene dramatizes the haunting of the present by the past. The social structure of the town has collapsed, but its moral demands persist as ghosts. The characters are not free; they are trapped in a ritual performance with no spectators, revealing that the culture of honor survives even when useless.

  This issue prevents the reader from settling on a simple "progress" narrative (Honor → Dignity). Instead, it forces them to ask whether the characters are freeing themselves or merely hiding the courtroom inside their own heads.
