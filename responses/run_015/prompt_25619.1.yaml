prompt: |-
  I'm a hospital ethicist and I keep running into the same nightmare scenario: a patient wrote an advance directive years ago saying "no life-sustaining treatment if I have severe dementia," but now they have moderate dementia and seem content — they smile, enjoy pudding, recognize family sometimes. The family is split. Some say "follow the directive, she would hate this." Others say "look at her, she's happy, how can you withhold antibiotics from a happy person?"

  I need an actual procedure I can use on the floor — not a seminar paper. Something my team (attending physician, nurse, social worker, family) can work through in under an hour. It should tell us: what questions to ask in what order, what counts as an answer that pushes us one way or the other, where we should stop and say "the directive stands" vs. "the directive is overridden," and — crucially — which steps are genuinely philosophical judgment calls that no algorithm can settle.

  Ground it in whatever the literature on advance directives and the authority of the earlier self actually says: Dworkin's integrity view, Dresser's critique, the personal identity problem, whatever's relevant. But translate it. I don't need citations, I need a tool. Then run it on two cases: (1) the dementia case above — the contented patient with moderate dementia whose advance directive refuses antibiotics for pneumonia, and (2) a case where the patient's advance directive refuses blood transfusions on religious grounds (Jehovah's Witness), but the patient is now unconscious after a car accident, the directive is 15 years old, and the family says they left the faith five years ago — though there's no documentation of that. And tell me honestly: what kinds of cases will this procedure fail on, where I should just call the ethics committee and admit we're flying blind?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Hospital Ethicist.
      *   **Problem:** Conflict between past Advance Directives (AD) and current patient state/wishes (especially in dementia or changed beliefs).
      *   **Need:** A practical, floor-ready procedure (under 1 hour), not a theoretical paper.
      *   **Requirements:**
          *   Step-by-step questions/order.
          *   Decision criteria (what pushes which way).
          *   Clear stopping points (directive stands vs. overridden).
          *   Identification of genuine philosophical judgment calls.
          *   Grounding in literature (Dworkin, Dresser, etc.) but translated into practice.
          *   Application to two specific cases (Dementia/Pneumonia, Jehovah's Witness/Transfusion).
          *   Honest admission of failure modes (when to call full Ethics Committee).

  2.  **Theoretical Grounding (Mental Sandbox):**
      *   *Ronald Dworkin:* Critical interests vs. Experiential interests. The "integrity" of the life story matters more than current momentary pleasure. The past self has authority.
      *   *Rebecca Dresser:* The "past self" is a stranger. Current well-being matters more. We shouldn't sacrifice a happy present for a gloomy past preference.
      *   *Personal Identity:* Is the dementia patient the *same person* who wrote the AD? (Psychological continuity).
      *   *Legal/Standard:* Substituted Judgment (what *they* would want) vs. Best Interest (what is *good* for them).
      *   *Goal:* Bridge the gap between high theory and bedside triage. The procedure needs to balance *precedent autonomy* (Dworkin) with *current well-being* (Dresser).

  3.  **Drafting the Procedure (The "Precedent Autonomy Triage Tool" - PATT):**
      *   *Constraint:* Must be doable in < 1 hour.
      *   *Structure:* Needs to be a flowchart or numbered steps. Let's go with numbered phases.
      *   *Phase 1: Validity & Specificity.* Is the AD even applicable? (Legal baseline).
      *   *Phase 2: The "Then" Self.* How firm was the prior wish? Was it informed?
      *   *Phase 3: The "Now" Self.* What is the current capacity/experience? (Crucial for dementia).
      *   *Phase 4: Harm/Benefit Analysis.* Weighing the burden of treatment vs. the violation of the AD.
      *   *Phase 5: The Decision Point.* Where does the buck stop?
      *   *Philosophical Flags:* Explicitly mark where theory kicks in.

  4.  **Refining the Decision Criteria:**
      *   When does the AD stand? When the prior wish was specific, informed, and the current burden is high/low benefit.
      *   When is it overridden? When the current self shows clear capacity to dissent (rare in mod dementia) OR when the "harm" of following the AD is grossly disproportionate to the "integrity" loss.
      *   *Key Distinction:* Refusing *life-sustaining* (letting die) vs. Refusing *comfort/symptom relief* (active suffering). Antibiotics for pneumonia in dementia is the classic gray zone. Is it life-sustaining or comfort?

  5.  **Applying to Case 1 (Dementia/Pneumonia):**
      *   *AD:* No life-sustaining if severe dementia.
      *   *State:* Moderate dementia, content.
      *   *Conflict:* Family split.
      *   *Application:* Run through PATT.
      *   *Verdict:* Likely treat the pneumonia *if* it's palliative/comfort-oriented, but don't escalate to ICU/vents. This distinguishes "treating the infection" from "prolonging the dementia state."
      *   *Philosophical Tension:* Dworkin says respect the prior wish to avoid the "undignified" slide. Dresser says the current self is happy; don't kill her for her past self's pride.

  6.  **Applying to Case 2 (Jehovah's Witness/Transfusion):**
      *   *AD:* No blood (15 yrs old).
      *   *State:* Unconscious.
      *   *Claim:* Family says faith changed 5 yrs ago.
      *   *Application:* Run through PATT.
      *   *Verdict:* This is harder. Religious identity is core to Dworkin's "integrity." But if the *person* changed their mind, the AD is factually outdated.
      *   *Key:* Evidence of revocation. Verbal testimony vs. written card.
      *   *Verdict:* In emergency, usually treat unless clear evidence of revocation exists. But if time allows, investigate the "leaving faith" claim.

  7.  **Identifying Failure Modes:**
      *   Where does the tool break?
      *   When family testimony is equally split (50/50).
      *   When the "current self" has fluctuating capacity.
      *   When the medical outcome is highly uncertain (probabilistic).
      *   When the conflict is about *identity* (is this the same person?) rather than *welfare*.

  8.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Emphasize the "Narrative Coherence" step. Ask: "Does treating her make her life a story she would recognize?"
      *   *Critique:* Is "overriding" the AD too strong?
      *   *Fix:* Use language like "Setting aside" or "Prioritizing current welfare." Legally, ADs are strong, but ethically, there's wiggle room in "best interest."
      *   *Tone:* Needs to be professional, direct, empathetic but firm. No fluff.
      *   *Philosophy Check:* Ensure Dworkin (Integrity) and Dresser (Current Well-being) are embedded in the questions without naming them constantly.

  9.  **Final Polish:**
      *   Create the "PATT" (Precedent Autonomy Triage Tool).
      *   Ensure the "Philosophical Judgment Call" boxes are clear.
      *   Make sure the Case Studies show *how* to use the tool, not just the result.
      *   Be honest about the "Hard Cases."

  10. (Final Output Generation - similar to the provided good response.)
answer: |-
  Here is a procedural tool designed for bedside triage. It translates the tension between **Precedent Autonomy** (Dworkin: the past self's right to define the life's narrative) and **Current Well-Being** (Dresser: the present self's right not to suffer for a stranger's choices).

  We will call this the **Precedent Autonomy Triage Tool (PATT)**.

  ### The PATT Protocol (Target Time: 45–60 Minutes)

  **Participants:** Attending, Primary Nurse, Surrogate Decision Maker(s), Ethics Facilitator (You).
  **Goal:** Determine whether to follow the Advance Directive (AD) or prioritize current clinical best interest.

  ---

  #### Phase 1: Validity and Specificity Check (10 Mins)
  *Before debating philosophy, establish the legal and clinical baseline.*

  1.  **Is the AD legally valid?** (Signed, witnessed, not revoked in writing?)
  2.  **Is the clinical situation specific to the trigger?**
      *   *Question:* Does the patient's current condition match the "trigger condition" in the AD?
      *   *Decision Rule:* If the AD says "Terminal Condition" and the patient has "Moderate Dementia," the AD **does not trigger**. Stop here. Follow Best Interest.
      *   *Decision Rule:* If the AD says "Severe Dementia" and patient has "Moderate," proceed to Phase 2 (The Gray Zone).
  3.  **Is the proposed treatment "Life-Sustaining" or "Comfort Care"?**
      *   *Question:* Will this treatment cure the acute problem and return them to their *current* baseline, or does it merely prolong the underlying decline?
      *   *Example:* Antibiotics for pneumonia in dementia usually return the patient to their pre-pneumonia dementia baseline. It is technically life-sustaining but functionally restorative of current status.

  #### Phase 2: The "Then" Self Audit (15 Mins)
  *Assessing the weight of the Past Self's authority (Dworkin's Integrity).*

  4.  **How specific was the prior wish?**
      *   *High Weight:* "If I cannot recognize my children, do not give antibiotics."
      *   *Low Weight:* "I don't want to be a vegetable." (Vague).
  5.  **Was the prior wish informed?**
      *   *Question:* Did the patient understand what "life with dementia" actually looks like when they wrote this? Or were they fearing a worst-case scenario (tube feeding, restraints) that isn't currently happening?
      *   *Push Factor:* If they feared *suffering* but are currently *content*, the AD loses weight.
  6.  **Has there been any evidence of revision?**
      *   *Question:* Even without a new legal document, did they verbally express different views in the years before capacity was lost?

  #### Phase 3: The "Now" Self Assessment (15 Mins)
  *Assessing the Current Self's welfare (Dresser's Critique).*

  7.  **Does the patient currently dissent?**
      *   *Observation:* When treatment is offered, do they pull away, grimace, or say "no"? Or do they accept it passively/happily?
      *   *Decision Rule:* Active physical/verbal dissent from the current patient **overrides** the AD in almost all non-emergency cases. You cannot forcibly treat a resisting patient based on a paper from 10 years ago.
  8.  **What is the "Experiential Interest"?**
      *   *Question:* Is the patient currently capable of pleasure? Do they recognize loved ones? Do they enjoy food/interaction?
      *   *Push Factor:* High current enjoyment increases the burden of proof required to withhold treatment.
  9.  **What is the burden of treatment?**
      *   *Question:* Is the treatment invasive (ICU, intubation) or low-burden (oral meds, IM injection)?
      *   *Push Factor:* Low burden + High current enjoyment = Strong argument to treat despite AD.

  #### Phase 4: The Narrative Coherence Test (10 Mins)
  *The Philosophical Judgment Call.*

  **Ask the team and family this specific question:**
  > "If we follow the directive and let nature take its course, are we respecting *her* life story? Or if we treat her, are we betraying *her* core values?"

  *   **Option A (Integrity Wins):** The patient defined their dignity by their cognitive independence. Continuing to live without it violates the core narrative of who they were. *Action: Honor AD.*
  *   **Option B (Well-Being Wins):** The patient's core value was "family togetherness" or "enjoying simple pleasures." They are currently achieving that. Death cuts that short. *Action: Override AD.*

  #### Phase 5: The Decision Matrix

  | Condition | Decision |
  | :--- | :--- |--- |
  | **Patient Dissents Now** | **Treat.** (Current autonomy trumps past autonomy). |
  | **AD Vague + Current Content** | **Treat.** (Benefit of doubt goes to life). |
  | **AD Specific + High Burden Tx** | **Honor AD.** (ICU/Ventilation). |
  | **AD Specific + Low Burden Tx + Current Content** | **Gray Zone.** (See Failure Modes below). |

  ---

  ### Case Application

  #### Case 1: The Contented Dementia Patient (Pneumonia)
  *   **Scenario:** Moderate dementia. AD says "No life-sustaining if severe dementia." Family split. Patient smiles, eats pudding.
  *   **PATT Run:**
      *   *Phase 1:* Trigger is "Severe," patient is "Moderate." **AD technically not triggered.** However, pneumonia could push her to severe/death.
      *   *Phase 2:* Was the wish informed? Likely feared "vegetable" state. She is not vegetative; she is social.
      *   *Phase 3:* Patient does not dissent. Enjoys pudding. Treatment (antibiotics) is low burden (oral or IM).
      *   *Phase 4 (Narrative):* Did she value "cognitive sharpness" above all (Dworkin)? Or "being with family" (Dresser)?
  *   **Verdict:** **Treat the pneumonia.**
      *   *Reasoning:* This is the "Dresser Zone." The patient is not in the state she feared (severe/vegetative). She is currently experiencing benefit. Antibiotics here function as *symptom management* (preventing dyspnea/death) rather than *life-prolongation* in a state she deemed intolerable.
      *   *Caveat:* Set limits. Treat the pneumonia, but if she goes into respiratory failure requiring intubation, **honor the AD**. Intubation is high-burden and pushes her into the "severe" medicalized state she likely feared.
      *   *Philosophical Call:* You are deciding that "Moderate Dementia" is not the "Death of the Self" the AD feared.

  #### Case 2: The Jehovah's Witness (Transfusion)
  *   **Scenario:** Unconscious. AD (15 yrs old) refuses blood. Family claims faith abandoned 5 yrs ago (no docs).
  *   **PATT Run:**
      *   *Phase 1:* AD is valid and specific. Trigger (unconscious/emergency) matches.
      *   *Phase 2:* Religious directives carry **higher weight** than preference directives. They are identity-constituting (Dworkin's strongest case). To transfuse is to violate her spiritual integrity.
      *   *Phase 3:* Patient cannot dissent.
      *   *Phase 4 (Narrative):* The claim is that the "Past Self" is no longer the "Current Self" because the religious identity changed.
      *   *Burden of Proof:* Who proves the change? In law/ethics, the written card stands unless there is clear evidence of revocation. Verbal testimony from family (who may have conflict of interest/guilt) is weak evidence against a formal religious directive.
  *   **Verdict:** **Honor the AD (No Blood).**
      *   *Reasoning:* Religious identity is the bedrock of Dworkin's "Integrity." Unlike the dementia case, where the patient is *currently happy*, here the patient is *unconscious*. We cannot measure current experiential interest. We must default to the last known expression of core identity.
      *   *Exception:* If the family can produce *corroborating evidence* (e.g., she was seen eating pork, attending other services, told her priest she left), you may override. If it is just "we think she changed her mind," the AD stands.
      *   *Philosophical Call:* You are deciding that the "Written Religious Self" holds authority over the "Oral Family Testimony Self" in the absence of capacity.

  ---

  ### Failure Modes: When to Call the Full Ethics Committee

  The PATT is a triage tool. It will fail in "Hard Cases" where the philosophical tension is irreconcilable. Call the full committee if:

  1.  **The "Split Self" Paradox:** The patient has fluctuating capacity (e.g., delirium) and explicitly says "I want to live" during lucid moments, but the AD says "Let me die." PATT cannot resolve conflicting *current* statements vs. *past* statements.
  2.  **The "Malformed Preference" Problem:** You have strong evidence the AD was written out of depression, coercion, or factual error (e.g., "I don't want to live if I can't walk," but they didn't know rehab exists). This requires deep investigation into the *formation* of the wish, which takes >1 hour.
  3.  **The "Family Veto":** The family agrees the AD is valid but refuses to allow you to follow it (e.g., Case 1 family threatens lawsuit if you withhold antibiotics). This moves from ethics to risk management/legal.
  4.  **Identity Discontinuity:** In dementia cases, if the family argues the patient is *literally a different person* (not just changed, but "gone"). This requires deep metaphysical discussion about personal identity that a bedside triage cannot settle.
  5.  **Probabilistic Uncertainty:** If the medical outcome is 50/50 (e.g., "Antibiotics might work, might not, might leave her worse"), PATT's "Best Interest" calculation breaks down.

  ### Summary for the Team
  *   **Dworkin (Integrity)** wins when: The treatment is high-burden, the AD is specific/religious, and the current self cannot experience benefit (unconscious/vegetative).
  *   **Dresser (Well-Being)** wins when: The treatment is low-burden, the patient is currently content, and the AD trigger condition (e.g., "severe") has not been fully met.
  *   **The Hard Truth:** In the "Moderate Dementia + Antibiotics" case, we usually treat. In the "Unconscious + Religious" case, we usually withhold. The difference is the **presence of current experiential interest.**

  Use PATT to structure the conversation, but document clearly when you are making a **Phase 4 Judgment Call**. That is where your liability and your ethics live.
