prompt: |-
  I have spent fifteen years as a curator of South Asian collections, and four months ago my director asked me to chair the interpretation group for a complete rewrite of our permanent galleries — around four hundred object labels, sixty panel texts and our school-facing worksheets — after a trustee described the museum as a museum of Europe with a few annexes. Our board responded by adopting a framing principle, and my job is to turn it into something my writers can actually run:

  *A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be.*

  That is the whole of what I was given. My writers are six regional specialists with no training in historiography, working mostly in English with one fluent Persianist and one Sinologist; they have about twenty minutes per label, a seventy-word ceiling, and no realistic access to the scholarly literature on anything outside their own region. I have a community advisory panel that meets monthly, so escalating a question to them costs four to six weeks, and I cannot escalate four hundred labels to them.

  We have already tried two shortcuts and they failed. The first was: delete Europe from the sentence and see whether it still says something — but it kept flagging labels for objects that entered the collection through empire, where the European connection genuinely is the reason the object is here. The second was counting mentions of continents per panel, which told us nothing we did not know.

  What I need is a decision procedure: the tests to apply in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the panel because the question is one of values rather than facts. It has to work at two levels, because I think the principle bites hardest not inside sentences but in the scaffolding — gallery titles, the period names we organise the sequence by, and which objects we chose to acquire and display at all — and my writers will apply it to individual labels. Please also tell me which distinctions inside the principle have to survive being simplified for non-specialists and which can be dropped without loss.

  Three cases to run it on:

  Our draft label on Indian cotton textiles, which currently asks why the subcontinent did not have an industrial revolution of its own, given that it was the world's leading producer of cloth well into the eighteenth century.

  Our proposed gallery spine, which is at present: Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.

  And a label the team is proud of, on printing: it says that movable type was in use in Korea and in China centuries before Gutenberg, which was meant as our corrective. If the procedure tells me this label is also a failure, I want to be told plainly and to understand why.

  Two further things. Our collection was largely assembled under empire and our provenance research is unfinished, so for some objects the only usable sources are colonial administrative ones: the procedure has to say what a writer does when the archive itself is the problem. And please separate, in your answer, what is settled from what is genuinely contested among historians and philosophers of history who work on this — including whether the board's principle itself is defensible, whether comparison of any kind can avoid a yardstick, and whether Europe is even a coherent unit to be decentring. My writers will be told which parts they may repeat as received opinion and which they must present as one view among others, so I need that distinction marked rather than smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A seasoned curator (15 years experience) of South Asian collections.
      *   **Task:** Chairing an interpretation group for a complete rewrite of permanent galleries (400 labels, 60 panels, worksheets).
      *   **Trigger:** A trustee called the museum "a museum of Europe with a few annexes."
      *   **Constraint/Principle:** "A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be."
      *   **Team:** 6 regional specialists (no historiography training), mostly English + 1 Persianist + 1 Sinologist. 20 mins/label, 70-word ceiling. Limited access to outside scholarship.
      *   **Resources:** Community advisory panel (monthly, 4-6 week turnaround). Cannot escalate 400 labels.
      *   **Failed Attempts:** 1. "Delete Europe" test (failed on imperial provenance). 2. Counting continent mentions (useless).
      *   **Needs:**
          1.  A decision procedure (tests in order, pass/fail criteria, escalation points).
          2.  Applicable at two levels: Scaffolding (titles, periods, selection) and Labels (text).
          3.  Simplification advice: What distinctions in the principle must survive vs. what can be dropped for non-specialists.
          4.  Application to three specific cases: Indian cotton (industrial revolution question), Gallery spine (periodization), Printing (Korea/China vs. Gutenberg).
          5.  Handling problematic archives (colonial sources).
          6.  Historiographical breakdown: What is settled vs. contested among historians/philosophers (including the defensibility of the principle itself).

  2.  **Deconstruct the Principle:**

      *   *Clause 1:* "not make something count as an event... because of its effects on, or resemblance to, a European trajectory." (Teleology/Eurocentrism).
      *   *Clause 2:* "not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be." (Deficit Modeling/Unilinear Evolution).
      *   *Core Tension:* How to acknowledge global interconnection (including empire) without making Europe the protagonist or the metric of success.

  3.  **Develop the Decision Procedure:**

      *   *Goal:* Fast, actionable, scalable.
      *   *Level 1: Scaffolding (Gallery Structure).* Needs to happen before labels.
      *   *Level 2: Label Text.* Needs to fit the 20-min/70-word constraint.
      *   *Steps:*
          1.  **Subject Check:** Who/what is the agent?
          2.  **Metric Check:** What defines significance/success?
          3.  **Connection Check:** Is the link to Europe explanatory or incidental?
          4.  **Archive Check:** Whose voice is sourcing this?
      *   *Escalation:* When does it go to the panel? (Value judgments, structural changes).

  4.  **Simplify the Principle for Writers:**

      *   *Keep:* The "Silent Standard" test (Deficit modeling). The "European Trajectory" test (Teleology).
      *   *Drop/Nuance:* Philosophical debates on whether "Europe" exists. The absolute ban on mentioning Europe (sometimes necessary for provenance).
      *   *Mantra:* "Significance on its own terms, not in relation to Europe."

  5.  **Address the Three Cases:**

      *   *Case 1: Indian Cotton (Industrial Revolution).*
          *   *Problem:* "Why no IR?" implies the IR is the goal/standard.
          *   *Fix:* Focus on the sophistication of the existing production, global demand, and local economic logic.
          *   *Verdict:* Fail under current draft.
      *   *Case 2: Gallery Spine (Ancient -> Discovery -> Revolution -> Modern).*
          *   *Problem:* "Discovery" (Columbian/Euro), "Revolution" (French/Industrial Euro), "Modern" (defined by Euro modernity).
          *   *Fix:* Needs thematic or polycentric periodization.
          *   *Verdict:* Fail. Structural escalation needed.
      *   *Case 3: Printing (Korea/China vs. Gutenberg).*
          *   *Problem:* "Centuries before Gutenberg" still uses Gutenberg as the anchor/standard. It's a "priority claim" rather than intrinsic significance.
          *   *Fix:* Focus on the technology's development and use in East Asia *for East Asian purposes*. Mention Gutenberg only if necessary for context, but not as the finish line.
          *   *Verdict:* Fail (subtly). It's still deficit/priority modeling.

  6.  **Handle the Archive Problem:**

      *   Colonial sources are biased.
      *   *Procedure:* Acknowledge the source's limitation in the text if possible ("Colonial records describe..."). Triangulate with material evidence. Don't treat colonial categorization as fact.

  7.  **Historiographical Breakdown (Settled vs. Contested):**

      *   *Settled:* Eurocentrism is a recognized bias. "Deficit modeling" is widely criticized. Global history requires polycentric views.
      *   *Contested:* Can we *ever* fully escape comparison? Is "Europe" a useful category or a reification? Is the Board's principle too restrictive (forbidding valid causal links)?
      *   *Defensibility:* The principle is defensible as an *ethical guideline* for public history, even if historians debate the philosophy of history.

  8.  **Drafting the Response:**

      *   *Tone:* Professional, respectful of expertise, actionable, clear.
      *   *Structure:*
          1.  Historiographical Context (Settled vs. Contested).
          2.  Simplification of the Principle (For the writers).
          3.  The Decision Procedure (The Algorithm).
          4.  Application to the Three Cases.
          5.  The Archive Problem.
      *   *Refinement:* Ensure the distinction between "Scaffolding" and "Labels" is clear. Make sure the "Printing" critique is nuanced (it feels progressive but fails the specific principle).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Don't mention Europe." The principle says don't make significance *depend* on it. Provenance is a factual reality of the collection, not necessarily a historiographical claim. I need to distinguish between *historical connection* (trade, empire) and *historiographical standard* (modernity, success).

      *(Refining the Printing Case)*: This is the trickiest. Saying "Korea did it first" is still centering Gutenberg as the reference point. The label needs to be about Korean printing *for Korean reasons*.

      *(Refining the Procedure)*: It needs to be a flowchart style logic but in text. Pass/Fail/Escalate.

      *(Refining the Historiography)*: Be honest. The Board's principle is a version of "Provincializing Europe" (Chakrabarty). It's not universally accepted as the *only* way to do history, but it is the *mandate* here. I must distinguish between "Good History" and "This Museum's Policy."

  9.  **Final Review against Constraints:**
      *   70-word ceiling context? Yes, keep procedure tight.
      *   20 mins/label? Yes, procedure must be quick.
      *   Community Panel escalation? Yes, define thresholds.
      *   Separation of settled/contested? Yes, dedicated section.

  10. **Final Polish:** Check tone. Ensure empathy for the curator's difficult position (caught between board, writers, and ethics).

  *(Self-Correction on the "Archive" point)*: The prompt asks what a writer does when the archive is the problem. The procedure needs a specific step for "Source Criticism."

  *(Self-Correction on "Scaffolding")*: The writers might not control the spine, but the Curator does. I need to address the Curator directly on the spine, and the writers on the labels.

  Let's assemble the response.cw
answer: |-
  This is a precise historiographical and managerial challenge. You are being asked to operationalize a post-colonial, polycentric historiography (akin to Dipesh Chakrabarty's *Provincializing Europe* or the Global History turn) within the constraints of public-facing didactics and a collection built on imperial logic.

  Below is the breakdown you requested: the historiographical landscape, the simplified principle for your writers, the decision procedure, the application to your three cases, and the protocol for problematic archives.

  ### Part 1: Historiographical Status Report
  *For your writers: What is received opinion vs. contested theory.*

  You must distinguish between **methodological mandates** (what this museum is doing) and **universal historical truths** (what all historians agree on). Your writers need to know where they are stating fact and where they are applying a specific lens.

  **1. The Deficit Model (Silent Standard)**
  *   **Settled:** Among global historians, it is settled that measuring non-European societies by their proximity to European outcomes (e.g., "Why no Industrial Revolution here?") produces distorted history. It assumes a single timeline of human development.
  *   **Contested:** Some economic historians argue that comparative analysis is unavoidable to explain divergence. However, they agree the *norm* should not be assumed to be Europe.
  *   **Instruction:** Treat the rejection of the "deficit model" as **received opinion** for this project. Writers do not need to hedge this.

  **2. The Coherence of "Europe"**
  *   **Settled:** "Europe" is not a natural geographical unit but a historical construct that changed over time.
  *   **Contested:** Whether the term is still useful as a shorthand for "colonial powers" or "industrializers."
  *   **Instruction:** Writers may use "Europe" or "British" as geographical/political descriptors, but they must not use "European" as a synonym for "Modern" or "Advanced." This is a **methodological mandate**.

  **3. The Possibility of Neutral Comparison**
  *   **Settled:** All history involves selection and framing. Total neutrality is impossible.
  *   **Contested:** Whether your Board's principle is achievable. Some philosophers argue that *any* comparison implies a yardstick.
  *   **Instruction:** Acknowledge to your team that this is an **ethical aspiration**, not a scientific law. If a label fails the test, it is a failure of *framing*, not necessarily of fact.

  ---

  ### Part 2: Simplifying the Principle for Writers
  *What survives simplification vs. what can be dropped.*

  Your writers have 20 minutes. They cannot parse "European trajectory." Give them two operational heuristics.

  **Keep (The Non-Negotiables):**
  1.  **The "Because" Test:** Does the text say this object matters *because* it relates to Europe? (e.g., "This influenced British design" vs. "This was prized for its technical brilliance.")
  2.  **The "Missing" Test:** Does the text imply this society was trying to do what Europe did but didn't quite get there? (e.g., "Failed to industrialize," "Pre-modern.")

  **Drop (The Nuance):**
  1.  **The Ontology of Europe:** Writers do not need to debate whether Europe exists. They just need to avoid using it as the finish line.
  2.  **Provenance vs. Significance:** They can acknowledge an object came to the museum via empire (fact) without framing the object's *historical value* through that empire (interpretation).

  **The Mantra for the Team:**
  *"Significance on its own terms, connection on equal footing."*

  ---

  ### Part 3: The Decision Procedure
  *A two-level algorithm. Level 1 is for you (Scaffolding); Level 2 is for writers (Labels).*

  #### Level 1: Scaffolding (Gallery Spine, Periodization, Selection)
  *Decision Authority: Curator (You). Escalate structural failures to the Board/Panel.*

  1.  **Test the Period Names:** Do the period names describe a global condition or a European one?
      *   *Fail:* "Age of Discovery," "Industrial Revolution," "Modern." (These imply European events are the world's clock).
      *   *Pass:* "Expansion of Trade," "Mechanization," "Contemporary Era." (Descriptive of human activity, not located in one place).
  2.  **Test the Narrative Arc:** Does the gallery sequence imply a destination?
      *   *Fail:* If the final gallery is the most "developed" and looks most like 20th-century London.
      *   *Pass:* If the final gallery represents complexity or intensity, not just technology.
  3.  **Escalation Point:** If the spine fails, you cannot fix this with labels. You must escalate to the Board/Panel. This is a values decision, not a factual one.

  #### Level 2: Label Text (The 20-Minute Workflow)
  *Decision Authority: Writer. Escalate only if stuck on Step 3.*

  **Step 1: The Subject Check (30 seconds)**
  *   **Question:** Who is the active agent in this sentence?
  *   **Pass:** The maker, the user, or the local culture. ("Patola weavers designed...")
  *   **Fail:** Europe/The West/The Museum. ("This was collected by...")
  *   **Action:** If Fail, rewrite to make the local culture the subject. *Exception:* Provenance statements (see Part 5).

  **Step 2: The Metric Check (2 minutes)**
  *   **Question:** What adjective defines the object's importance?
  *   **Pass:** Intricate, expensive, sacred, innovative, durable. (Intrinsic qualities).
  *   **Fail:** Early, late, similar to, precursor to, unique (unless truly unique globally). (Relational qualities).
  *   **Action:** If Fail, replace the metric. Instead of "Early example of...", use "Developed independently to..."

  **Step 3: The Connection Check (5 minutes)**
  *   **Question:** If Europe is mentioned, is it the *cause* of the significance or just a *neighbor* in history?
  *   **Pass:** "Traded to Portugal in 1600." (Europe is a destination).
  *   **Fail:** "Significant because it challenged Portuguese markets." (Significance depends on the reaction).
  *   **Action:** If Fail, reframe. Focus on the production or local consumption.

  **Step 4: The Archive Check (See Part 5)**
  *   **Question:** Is the fact derived solely from a colonial source?
  *   **Action:** Qualify the statement. ("British records claim..." or "Likely used for...")

  **Escalation Point:** If a label cannot pass Step 3 without denying a historical fact (e.g., the object was literally made *for* export to Europe), escalate to you. You decide if the fact outweighs the principle. Do not escalate to the Panel unless it challenges the Gallery Spine.

  ---

  ### Part 4: Running the Cases

  #### Case 1: Indian Cotton Textiles
  *Draft:* "Why the subcontinent did not have an industrial revolution of its own, given that it was the world's leading producer of cloth well into the eighteenth century."
  *   **Procedure Result:** **FAIL (Step 2: Metric Check).**
  *   **Diagnosis:** This is the definition of the "Silent Standard." It posits the Industrial Revolution as the goal and Indian history as a failure to launch. It treats Indian economic logic as a puzzle to be solved by European standards.
  *   **Fix:** Focus on the *intensity* of production and the *global dominance* of the existing system.
  *   **Rewrite Direction:** "For centuries, Indian weavers supplied the global demand for cotton. Their complex trade networks and technical skills dominated world markets until mechanical production shifted the balance of power in the 19th century." (Significance is the dominance, not the lack of machines).

  #### Case 2: Gallery Spine
  *Draft:* Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.
  *   **Procedure Result:** **FAIL (Level 1: Period Names).**
  *   **Diagnosis:** "Discovery" is Eurocentric (Columbus); "Revolution/Industry" refers to British/French events; "Modern" is a sociological term defined by Westernization. This spine forces non-European history into European waiting rooms.
  *   **Fix:** This requires your authority, not the writers'. You must propose a thematic or polycentric spine.
  *   **Recommendation:** Escalate to the Panel. Suggest: "Foundations — Connections & Exchange — Innovation & Power — Living Traditions." This allows multiple regions to define the periods.

  #### Case 3: Printing (Korea/China vs. Gutenberg)
  *Draft:* "Movable type was in use in Korea and in China centuries before Gutenberg."
  *   **Procedure Result:** **FAIL (Step 2: Metric Check).**
  *   **Diagnosis:** This is the hardest one. It feels corrective, but it still uses Gutenberg as the anchor. It frames Asian innovation as a "priority claim" rather than a cultural development. It says: "We matter because we beat them to the start line."
  *   **Fix:** Center the technology on its *local* utility and development.
  *   **Rewrite Direction:** "Movable type transformed literacy in East Asia, allowing mass production of texts for government and scholarship. This technology developed independently of later European printing presses." (Gutenberg becomes a footnote for context, not the finish line).
  *   **Why:** The principle forbids making an event count *because* of its resemblance to a European trajectory. Being "earlier Gutenberg" is still a European trajectory.

  ---

  ### Part 5: The Archive Problem
  *Protocol for when the source is colonial.*

  Your collection is imperial. You cannot erase that, but you can frame it.

  **The Rule:** Distinguish between *Object History* (what the object did then) and *Collection History* (how it got here).

  **Procedure for Writers:**
  1.  **If the fact is about the object's origin:** Do not use colonial sources as primary truth if material evidence contradicts them. If you must use them, qualify the agency.
      *   *Bad:* "The Raja presented this to the Governor." (Implies voluntary gift).
      *   *Good:* "Recorded in colonial logs as a gift to the Governor." (Attributes the claim to the source).
  2.  **If the fact is about the object's arrival:** Acknowledge the power dynamic without making it the object's *sole* identity.
      *   *Bad:* "Collected during the British Raj." (Passive, erases violence).
      *   *Good:* "Acquired by British officials during the colonial administration." (Active, identifies the structure).
  3.  **The "Unknown" Clause:** If provenance is obscured by colonial bureaucracy, state that.
      *   *Text:* "Specific origins are unrecorded in surviving colonial documents."
      *   *Why:* This turns the silence of the archive into data about the archive, rather than a silence about the object.

  ### Summary of Escalation Paths

  1.  **Label fails "Metric Check" (Deficit modeling):** Writer fixes it.
  2.  **Label fails "Connection Check" (Europe is the cause):** Writer fixes it, unless the object was made *for* Europe (e.g., Company School painting). If made for Europe, focus on the *maker's skill* in adapting, not the *buyer's demand*.
  3.  **Gallery Spine fails:** Curator (You) escalates to Board/Panel. Writers cannot fix this.
  4.  **Archive creates ethical conflict:** Curator (You) decides. If the only story is a colonial lie, consider leaving the object unlabeled or labeling the silence.

  This procedure respects your writers' time, protects you from board pushback by grounding decisions in the adopted principle, and ensures the historiography is robust without requiring your team to be philosophers.
