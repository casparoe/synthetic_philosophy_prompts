  **ORDER (SEALED)**

  The wax is cold, the paper white,
  It rests within the harbor night.
  Two versions of the coming light,
  Held quiet in the clerk's clear sight.

  Inside the room the captains argue,
  Of currents shifting, vague and blue.
  They weigh the wind, they chart the sand,
  As if the sea obeys their hand.

  I know this script was written deep,
  Before the council woke from sleep.
  True last week, true the week before,
  Yet still they pace the cabin floor.

  Their worry wakes the word inside,
  At dawn I break the seal of light,
  Where one path opens, one denied,
  And give the order to **Fight**.

