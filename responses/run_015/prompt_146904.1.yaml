  The paradox you have identified is best illustrated by comparing **Moses in the Exodus** with **King Arthur**. Both figures are structurally identical in the historical record: they are liberation leaders who supposedly defeated a powerful occupying force, yet neither appears in any contemporary written account from their own lifetime.

  If we apply your principle of **Inverse Corroboration** (that absence implies deliberate suppression, which implies reality) to both cases, we arrive at opposite credibility judgments. This happens not because the stories differ, but because the *capacity to suppress* differs.

  ### The Parallel Setup
  *   **The Claim:** A charismatic leader rallies an oppressed people and wins a decisive victory against a dominant power.
  *   **The Absence:** There are no contemporary records of this leader or this specific victory from the dominant power.
  *   **The Inverse Corroboration:** The dominant power erased these records to hide a humiliating defeat. Therefore, the silence proves the event happened.

  ### Case 1: The Exodus (Moses vs. Egypt)
  *   **The Context:** Ancient Egypt was a centralized, bureaucratic state with a known habit of editing history to maintain the Pharaoh's image of invincibility.
  *   **Applying the Logic:** The absence of Moses in Egyptian records is consistent with Egyptian state propaganda. A centralized government *has the capacity* to systematically erase a name from monuments and archives.
  *   **The Judgment:** **Credible.** The logic holds because the "hider" (Egypt) had the machinery to hide. The silence is interpreted as a "successful cover-up," which validates the story.

  ### Case 2: King Arthur (Arthur vs. The Saxons)
  *   **The Context:** 6th-century Britain was fragmented, largely oral, and lacked a central bureaucracy. The "dominant powers" (Saxon warlords or British kings) did not maintain state archives or monument lists in the Egyptian style.
  *   **Applying the Logic:** The absence of Arthur in contemporary records is attributed to suppression by the Saxons. However, a fragmented warlord culture *lacks the capacity* to systematically erase a rival's memory across an entire island. There were no central archives to purge.
  *   **The Judgment:** **Not Credible.** The logic fails because the "hider" (Saxons/Britons) lacked the machinery to hide. The silence is interpreted as "non-existence," which invalidates the story.

  ### The Paradox
  The paradox of Inverse Corroboration is that it does not measure the likelihood of the **event**; it measures the sophistication of the **bureaucracy** surrounding the event.

  By this logic, a miracle in the desert (Exodus) becomes historically plausible because Egypt had a filing cabinet to lock it away. A battle in a field (Arthur) becomes legendary because Britain had no filing cabinet to begin with. The reasoning privileges **State Secrecy** over **Tribal Loss**, meaning that the same level of evidence (total silence) confirms a story about a powerful empire while disproving a story about a fragmented society.

  Ultimately, Inverse Corroboration creates a system where the *more powerful the liar*, the *more truthful the victim* appears to be.
