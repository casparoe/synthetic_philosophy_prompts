  **4. Conclusion Survival**
  Her conclusion fails. Reliabilism imposes a global condition (the process is usually right), but Gettier cases exploit local luck. A pipeline may be 99% reliable, yet this specific green build is a false positive due to canceling bugs. Gettier requires eliminating luck, not merely minimising it. CI supports local counterfactuals (statements about what would happen if conditions changed), suggesting a 'tracking' theory of knowledge. However, this says nothing about the soundness of internal reasoning steps. Statistical reliability does not close the Gettier gap; epistemic luck persists in single instances. A reliable process can still yield accidental truth.

  **5. Better Analogy**
  Knowledge is like a cryptographic signature: it requires a causal chain linking the belief to the fact, ensuring the output could not exist without the specific truth, rather than merely matching it.
