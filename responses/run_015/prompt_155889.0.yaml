  2.  *Unconnected assertion:* Deviant causal chain (where justification connects to truth accidentally). Classic Gettier. The stopped clock captures this (right time for wrong reason).
  3.  *Flake:* Random noise. Reliability failure. Both capture this.
  The clock conflates structural luck (Gettier) with mechanical failure. CI distinguishes them, showing justification can be robust yet locally lucky.

  **3. Disanalogies**
