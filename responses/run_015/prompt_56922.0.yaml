  I spent 38 years in a lab doing atmospheric measurement — instrument calibration in the first half, forecast verification in the second, which is how I ended up caring about proper scoring rules decades before I knew philosophers had gotten hold of them. Retired three years ago and now I'm reading the accuracy-first epistemology / epistemic utility theory material properly: Joyce's accuracy-dominance argument for probabilism, the accuracy-based derivations of conditionalization, the case for the quadratic (Brier) score over the logarithmic one, the whole apparatus. I'm fluent in the maths and I have maybe five good years of energy left and no career to protect. I don't want to write another survey or a long blog post; I'd like to actually work one or two problems where a person who spent thirty years inside the practice of scoring forecasts might have an edge over a philosopher who only ever met the statistics secondhand.

  So: give me an agenda. Which open problems in accuracy-first epistemology are most worth someone like me taking on, and in what order?

  The thing I keep circling, and feel free to tell me I've got it wrong. In verification practice you choose your proper score on pragmatic grounds — the log score punishes you savagely if you ever put near-zero credence on something that then happens, the quadratic score is bounded and forgiving, and different proper scores genuinely rank competing forecast systems differently, which everyone in the field knows and mostly shrugs about. Meanwhile the accuracy-first program seems to need the choice of inaccuracy measure settled on purely epistemic grounds, since the measure is what's supposed to generate the norms. If the measure ends up picked for robustness and usability reasons, haven't we smuggled the pragmatism straight back in through the scoring rule? I want to know whether thats a live crux in the literature right now or whether I've reinvented an objection that got fully answered years ago and I just haven't read it.

  Then the prioritization proper. For each candidate problem I want: why it sits upstream of other things, whether it's actually tractable for one person with a strong quantitative background and no institutional support (I won't get co-authors at a good department; realistically I'll get a preprint read by eleven people), and where my verification background gives me unusual leverage versus where it's basically irrelevant. Be blunt about the traps — the problems where a smart outsider burns three years rediscovering something, or where the "problem" is really just two people with different intuitions refusing to move.

  Please use these sections, in this order:

  - **Ground rules** (~150 words): the criteria you're ranking on, the trade-offs between them, and which one you're weighting heaviest and why.
  - **The shortlist, ranked** (~200 words each, four to six items).
  - **The dependency map** (~250 words): which of these are upstream of which, i.e. what else would come free if one got solved.
  - **Leave these alone** (~150 words): the problems an outsider is tempted by that I should skip, and why.
  - **Bottom line** (~100 words): if I only have energy for one, which one, and the first concrete step I'd take on it.

  No bibliography please — I can find the papers myself. I want the reasoning, not the citations.
