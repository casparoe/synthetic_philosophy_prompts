          3.  *Boundary Tolerance:* Handle cusps (1996 is the Pew cutoff for Millennials, but culturally fuzzy).
          4.  *Geographic/Cultural Portability:* Handle immigrants.
          5.  *Lifecycle Neutrality:* Distinguish "young people do X" from "Gen Z does X."
          6.  *Predictive Surplus:* Must add value beyond demographics.
      *   **Conflicts:**
          *   *Sharp Boundaries vs. Social Continuity:* You can't have both.
          *   *Statistical Identifiability vs. Theoretical Purity:* The APC constraint.
      *   **The "Killer" Requirement:** *Predictive Surplus* (D6). Most theories fail because they describe period effects as cohort effects.
      *   **The "Ontological Weight" Requirement:** *Lifecycle Neutrality* (D5). If it collapses into age, it's fiction.
      *   **Epistemic Humility:** What changes my mind? What's weak?

  9.  **Review against Constraints:**
      *   Did I handle cusp births? Yes (Boundary Tolerance).
      *   Immigrants? Yes (Portability).
      *   Politics shifting? Yes (Lifecycle Neutrality).
      *   Marketing vs. Demo? Yes (Predictive Surplus).
      *   APC problem? Yes (Orthogonality).
      *   Jointly unsatisfiable? Yes (Boundaries vs. Continuity).
      *   Single requirement killing popular theories? Yes (Predictive Surplus/Period distinction).
