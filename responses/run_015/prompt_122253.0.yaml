  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *Thesis:* Aggregating welfare across time within a life is as problematic as aggregating across lives. This attacks the core of diachronic rationality (prudence) that almost everyone accepts.
      *   *Consequentialists:* They rely on aggregation. If you block intrapersonal aggregation, you likely block interpersonal aggregation (their main defense is usually that the *person* is the unit of account). If you dissolve the person into temporal stages, their calculus breaks. They will attack the *normative significance* of temporal stages.
      *   *Kantians:* They like the separateness objection (Rawls/Nozick style) but hate "metaphysical extensions" (Parfit-style reductionism often underpins this). They care about *agency* and *unity of will*. They will ask: "Who is the agent if not the whole life?"
      *   *Psychologist:* They care about how people *actually* reason and commit. They don't care about metaphysics. They will ask: "What does this do to decision-making? Is this actionable?"
      *   *The "No Metaphysics" Constraint:* This is the tightrope. If the user says "temporal stages are distinct persons," the Kantians and Psychologist will pounce on the metaphysics. The argument must be *normative*, not *ontological*.

  3.  **Drafting the Objections (Ordering by Damage):**
      *   *Highest Damage:* The Consequentialist "Prudence" Objection. If intrapersonal aggregation fails, rational planning collapses. This undermines the very possibility of a life plan, which even non-utilitarians value. If the thesis implies we shouldn't sacrifice now for later, it's counterintuitive to the point of absurdity.
      *   *Medium-High Damage:* The Kantian "Unity of Agency" Objection. If there are separate centers of concern, who makes the promise? Who bears the duty? This attacks the practical application of the theory.
      *   *Medium Damage:* The Psychologist "Action-Guidance" Objection. How does this help us understand discounting or commitment? If it makes decision-making impossible, it's useless empirically.
      *   *Lower Damage (but tricky):* The "Slippery Slope to Absurdity" (If stages are separate, why not seconds?).
      *   *The "Hope Nobody Asks":* The metaphysical grounding question. "If you aren't using a reductionist metaphysics, what *makes* the stages separate normatively?" This threatens the core constraint of the thesis.

  4.  **Developing the Responses (Rhetorical Choreography):**
      *   *Tone:* Professional, precise, acknowledging the strength of the interlocutors.
      *   *Consequentialists:* Speak their language (welfare, aggregation, units of account). Concede that prudence is important but distinguish *coordination* from *sacrifice*.
      *   *Kantians:* Speak their language (agency, respect, ends). Concede that unity is practically necessary but normatively contingent.
      *   *Psychologist:* Speak their language (cognitive mechanisms, framing). Concede the theory is descriptive/normative, not a heuristic.
      *   *The "Hope" Question:* Needs a defensive pivot. Admit the tension but frame it as a feature, not a bug (normativity precedes metaphysics).

  5.  **Refining the Content (Iterative Process):**
      *   *Check:* Did I include the specific breakdown (Reply, Concession, Weakness, Stance)? Yes.
      *   *Check:* Is the vocabulary specific? (e.g., "discount rates" for psychologist, "maximization" for utilitarians, "autonomy" for Kantians).
      *   *Check:* Is the ordering logical? Yes, start with the utilitarians because they are the majority and the primary target.
      *   *Check:* Is the "Hope nobody asks" question truly dangerous? Yes, because it targets the "no metaphysics" constraint directly.

  6.  **Final Polish:**
