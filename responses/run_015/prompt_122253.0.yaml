answer: |-
  # Q&A Prep Sheet: Diachronic Separateness & Aggregation
  **Workshop:** Moral Theory Workshop
  **Presenter:** Doctoral Candidate
  **Thesis:** Normative boundaries exist between temporal stages of a single life, prohibiting intrapersonal welfare aggregation analogous to the interpersonal prohibition.

  ## Strategic Overview
  Your primary vulnerability is the **Prudence Objection**. If you successfully block intrapersonal aggregation, you risk making rational life-planning impossible. The Consequentialists (5/8 of the room) will attack this first and hardest. The Kantians will probe the agency implications. The Psychologist will probe the action-guidance. Do not get dragged into metaphysics; keep the argument strictly normative.

  ---

  ## 1. The Preference-Utilitarian "Prudence" Objection
  **Asker:** One of the three Preference-Utilitarians.
  **Damage Level:** Critical. If this stands, your theory implies rational agents cannot sacrifice now for later, collapsing the concept of a life plan.
  **Vocabulary:** Maximize satisfaction of preferences, rational planning, discount rates, welfare units.

  **The Question:** "If we cannot aggregate welfare across temporal stages, how do you account for the rationality of prudence? If I sacrifice a preference today for a greater preference satisfaction next year, your model treats this as a violation of the earlier stage's entitlement. Doesn't this render diachronic rationality impossible?"

  **2-Minute Reply:**
  "I appreciate the force of this. It is crucial to distinguish between *aggregation* and *coordination*. My claim is not that temporal stages cannot cooperate or that an agent cannot plan. Rather, it is that the *justification* for that planning cannot rest on the cancellation of the earlier stage's loss by the later stage's gain.
  Think of it like this: In the interpersonal case, I can ask you to sacrifice for me, but I cannot *force* it by claiming our welfare sums to a greater total. Similarly, diachronic separateness means the earlier stage's loss remains a loss, even if the later stage benefits. Prudence is permissible as a form of voluntary coordination between stages, grounded in psychological connectedness, but it is not *mandated* by a calculus that wipes out the earlier stage's claim. We preserve rational planning without treating the person as a mere container for utility summing."

  **Concede Up Front:** Concede that this makes prudence less robust than standard rational choice theory assumes. It becomes a cooperative venture rather than a maximization requirement.
  **Weakest Point:** You risk making prudence optional. If the earlier stage can veto the sacrifice, long-term projects become unstable.
  **Stance:** **Hold Firm.** Do not retreat to standard prudence. This is the core of your contribution. Frame the instability as a feature (protecting the vulnerable past self), not a bug.

  ---

  ## 2. The Kantian "Unity of Agency" Objection
  **Asker:** One of the two Kantians.
  **Damage Level:** High. They accept the interpersonal objection but will argue that *agency* requires a unified subject over time.
  **Vocabulary:** Autonomy, unity of will, maxims, respect for persons, imputation.

  **The Question:** "We agree that persons are separate. But moral agency requires a unified will over time. To hold an agent responsible, or to respect them as an end, we must treat their life as a single narrative. If you fragment the agent into temporally separate centers of concern, who is the bearer of the duty? Who is being respected?"

  **2-Minute Reply:**
  "This touches on the distinction between *ontological* unity and *normative* unity. I am not denying that for the purposes of imputation and legal responsibility, we treat the life as a unit. However, moral *justification* requires a finer grain.
  When we demand a sacrifice from an agent for their own future good, we are effectively asking the 'now' self to be a means to the 'later' self's ends. Respect for the person requires acknowledging that the 'now' self has a veto power that utilitarian aggregation ignores. We can maintain the unity of agency required for responsibility without accepting the aggregation required for utilitarian calculation. The 'person' is the unit of responsibility, but the 'stage' is the unit of moral claim."

  **Concede Up Front:** Concede that practical life and legal responsibility require treating the life as a whole.
  **Weakest Point:** The distinction between "unit of responsibility" and "unit of moral claim" may seem ad hoc to a Kantian who views the will as inherently unified.
  **Stance:** **Softener.** Acknowledge that for *external* interactions (duties to others), the unified person is the relevant unit. Restrict your claim to *self-regarding* duties or internal justification.

  ---

  ## 3. The Psychologist "Action-Guidance" Objection
  **Asker:** The Moral Psychologist.
  **Damage Level:** Medium. They will not care about the metaphysics but will ask if this model describes or prescribes anything usable.
  **Vocabulary:** Temporal discounting, commitment devices, cognitive framing, decision-making heuristics.

  **The Question:** "From a psychological perspective, people use aggregation to manage discounting. If I tell a subject, 'Your future pain doesn't cancel your current pain,' they might lose the motivation to commit to long-term goals. Does your theory offer a functional alternative for how agents should actually deliberate?"

  **2-Minute Reply:**
  "That is an empirical question, but normatively, the alternative is *negotiation* rather than *calculation*. Instead of asking 'Does the future gain outweigh the current cost?', the agent asks 'Can the current self consent to this cost given the relationship with the future self?'
  This aligns with research on commitment devices. We don't force the sacrifice; we structure the environment so the current self *chooses* it. My theory supports the use of commitment strategies not as tools to maximize welfare, but as treaties between temporal selves. It shifts the focus from 'optimizing the life' to 'maintaining integrity across time.'"

  **Concede Up Front:** Concede that this is cognitively more demanding than simple maximization.
  **Weakest Point:** It may sound like a distinction without a difference in practice.
  **Stance:** **Hold Firm.** Emphasize the *attitude* change. The psychological shift from "investing" to "negotiating" is the practical payoff.

  ---

  ## 4. The Rule-Consequentialist "Rule of Thumb" Objection
  **Asker:** One of the two Rule-Consequentialists.
  **Damage Level:** Low/Medium. They will try to absorb your view into a rule that generally maximizes welfare.
  **Vocabulary:** Optimal rules, internalization, welfare outcomes, systemic effects.

  **The Question:** "Even if intrapersonal aggregation is metaphysically suspect, wouldn't the optimal rule for agents be to *act as if* it holds? If internalizing diachronic separateness leads to worse life outcomes, shouldn't a consequentialist reject it?"

  **2-Minute Reply:**
  "If the 'optimal rule' requires agents to systematically ignore the normative claims of their present selves in favor of a hypothetical total, it violates the very separateness that grounds the objection to utilitarianism in the first place.
  You cannot defend interpersonal non-aggregation by saying 'aggregation works better,' and you cannot defend diachronic non-aggregation on those grounds either. If the separateness of persons matters, it matters regardless of the rule's efficiency. To accept your proposal would be to concede that the separateness objection is merely heuristic, whereas I am arguing it is constitutive of moral status."

  **Concede Up Front:** Concede that following your view might lower total welfare in some metrics.
  **Weakest Point:** Rule-consequentialists are willing to bite the bullet that "truth" matters less than "optimal rules."
  **Stance:** **Hold Firm.** This is a foundational clash. Do not let them reduce your normative claim to a heuristic.

  ---

  ## The "Hope Nobody Asks" Question
  **Asker:** Likely the Metaphysically Cautious Kantian or the Psychologist.
  **The Danger:** This question exposes the tension in your constraint (No metaphysics, but distinct stages).
  **The Question:** "You insist we shouldn't rely on controversial metaphysics of identity. But if the person is metaphysically one, what *normative fact* creates this boundary between stages? If there's no metaphysical break, aren't you just importing the interpersonal objection by analogy without the ontological grounding to support it?"

  **Defensive Reply (Brief):**
  "That is the precise tension I am navigating. My claim is that normative boundaries do not require ontological breaks. We see this in the interpersonal case: two humans are biologically continuous with their past selves, yet we draw a normative line. I am arguing that the *degree* of psychological divergence over time within a life can reach a threshold that triggers the same normative protection, without needing to claim the stages are 'different people' ontologically. The boundary is moral, not metaphysical."

  **Strategy:** If asked, deliver this quickly and pivot back to the *consequences* of ignoring the boundary. Do not let them pin you down on the "threshold" criteria.

  ---

  ## General Rhetorical Advice for the Room
  1.  **Watch the Consequentialist Bloc:** They are the majority. If they sense your view makes life planning "irrational," they will vote it down collectively. Keep emphasizing *coordination* over *prohibition*.
  2.  **Respect the Kantian Constraint:** Do not use Parfitian reductionism language (e.g., "persons don't really exist"). The Kantians will reject the premise immediately. Stick to "normative significance."
  3.  **Engage the Psychologist:** They are the wild card. If you can make your view sound like a better model of *commitment* than standard rational choice, they may support you against the Utilitarians.
  4.  **Time Management:** Your replies are timed for two minutes. Do not exceed this. If you ramble, you look defensive. State the distinction, give the analogy, stop.
