prompt: |-
  I'm a doctoral student in moral philosophy preparing a seminar presentation for our department's moral theory workshop next Thursday. My thesis is that the standard separateness-of-persons objection to utilitarianism should be extended—without appealing to controversial metaphysical theories of personal identity—to what I call diachronic separateness: just as interpersonal aggregation wrongly treats one person's welfare as exchangeable for another's, intrapersonal aggregation across temporal stages wrongly treats an earlier stage's interests as exchangeable for a later stage's, violating the normative boundary between separately entitled centers of concern within a single life. The audience will be eight faculty and graduate students: five consequentialists (three preference-utilitarians, two rule-consequentialists), two Kantians who accept the interpersonal objection but reject metaphysical extensions of it, and one moral psychologist who studies commitment and temporal discounting but has no background in persistence or personal identity. I need a Q&A prep sheet tailored specifically to this room, not a generic list. Order the objections by the damage they would actually do in this setting, phrase each in the vocabulary that group would use (welfare-aggregation language for the consequentialists, agency and respect language for the Kantians, empirical framing for the psychologist), and for each provide: a reply I can deliver in about two minutes, what I should concede up front, where that reply is weakest, and whether to hold firm or soften. Include the one question I am hoping nobody asks—likely from the psychologist or the metaphysically cautious Kantian—and draft a brief defensive reply for it. Do not provide bibliographies, reading lists, or citation requests; I need only the argumentative map and the rhetorical choreography.
