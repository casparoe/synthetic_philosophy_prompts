      *   **Task:** Prepare a Q&A prep sheet for a seminar presentation next Thursday.
      *   **Topic:** Extending the separateness-of-persons objection to utilitarianism to *diachronic separateness* (intrapersonal aggregation across time is problematic, similar to interpersonal aggregation).
      *   **Constraint:** Do not appeal to controversial metaphysical theories of personal identity (must work with standard/neutral metaphysics).
