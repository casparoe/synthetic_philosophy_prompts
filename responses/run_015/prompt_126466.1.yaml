          *   *Rank 1: Omissions vs. Conserved Quantities (2 vs 3).* This is the big one. Interventionism says "no pulse" causes "overheat" because changing the pulse changes the outcome. Physicalist view says causation requires energy/momentum transfer. There is no "nothing" transferring energy. You can't have both strictly.
          *   *Rank 2: Pragmatics vs. Objectivity (5 vs 6/Protocol).* You say the action/omission distinction is pragmatic (5), but norms don't matter (6). Yet, pragmatics usually *relies* on norms (what's unexpected/abnormal). If you use lab protocols to fix contrasts, that helps, but in the field, "normal operation" is often defined by safety norms, not just physics.
          *   *Rank 3: Interventionism vs. Locality (1 vs 3).* Interventionism is often macroscopic/functional. Locality is microscopic. Sometimes an intervention works without a clear local chain we can trace (black box).
          *   *Check word count.*

      *   **"Tensions that dissolve on inspection" (~150 words):**
          *   Contrastivity (4) and Locality (3). Contrastivity is about how we *describe* causation; locality is about how causation *works*. They can coexist.
          *   Interventionism (1) and Contrastivity (4). Woodward combines these easily. Interventions define the contrast.
          *   *Check word count.*

      *   **"What each fix would cost me" (~250 words):**
          *   *Drop Physicalist Locality (3):* Easiest fix. Accept interventionism fully. Omissions are causes because they matter for control, not because photons flew. Cost: Loss of that "physicist's gut feeling" connection to fundamental physics. Causation becomes less "real" in the bedrock sense.
