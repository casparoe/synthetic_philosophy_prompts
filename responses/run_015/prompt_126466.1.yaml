          *   *Check word count.*

      *   **"The single cheapest revision" (~100 words):**
          *   Recommendation: Soften (3). Keep interventionism as the primary account for macroscopic safety engineering. Treat (3) as a constraint on *fundamental* physics, not engineering causation. Causation is level-specific.
