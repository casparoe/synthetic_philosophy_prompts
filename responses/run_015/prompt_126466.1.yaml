  2.  **Analyze the User's Position (The 7 Claims + Cases):**
      *   (1) Interventionism (Woodward-ish): X causes Y if intervening on X changes Y.
      *   (2) Omissions are causes (e.g., coolant not flowing).
      *   (3) Physicalist/Local intuition: Continuous chain, conserved quantity (Dowe/Salmon-ish). No action at a distance.
      *   (4) Contrastivity: Causal claims are X rather than X* caused Y rather than Y*.
      *   (5) Pragmatic asymmetry: Once contrast is fixed, no metaphysical difference between action (match struck) and omission (sprinkler off).
      *   (6) Norms irrelevant: Obligations (moral/legal) don't determine causation.
      *   (7) Case verdicts: Watchdog (absence of pulse caused overheating), Jammed Valve (engineer jamming + valve failure both caused burst).
      *   *Idea:* Protocol sets contrast (like control arm in lab), potentially avoiding pure pragmatism.

  3.  **Identify Tensions:**
      *   **Major Tension:** (1) Interventionism + (2) Omissions vs. (3) Physicalist/Conserved Quantity.
          *   Interventionism allows omissions (absence of X changes Y).
          *   Conserved quantity theories (process theories) typically *exclude* omissions because there's no physical process/energy transfer in an absence. Nothing flows from "no pulse" to "overheat".
          *   This is the classic "omission problem" in causation literature.
      *   **Secondary Tension:** (5) Pragmatic asymmetry vs. (6) Norms irrelevant.
          *   If the asymmetry between action and omission is purely pragmatic (what we mention), why do we treat them differently in incident reports? Usually, pragmatics tracks norms. If norms are excluded from metaphysics (6), but pragmatics drives the distinction (5), does pragmatics sneak norms back in?
      *   **Tertiary Tension:** (4) Contrastivity vs. (3) Locality.
          *   Contrastivity is often linguistic/conceptual. Locality is metaphysical/physical. They operate at different levels, so this might dissolve.
      *   **User's Proposed Fix:** Protocol sets contrast (like lab control). Does this solve the omission vs. physical process issue? Not really. It explains *why* we pick the contrast, but doesn't explain how an absence physically causes something if causation requires a conserved quantity chain.

