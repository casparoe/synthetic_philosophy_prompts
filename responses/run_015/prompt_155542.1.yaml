  **Elias:** You used the word again today. "Collapse." You said it like it was a stratigraphic layer.

  **Mara:** Because sometimes the dirt looks like it. But you said it like it was a mechanism. "The collapse caused the depopulation." That's circular.

  **Elias:** It's descriptive. A rapid, sustained loss of differentiated institutional capacity. If a population cannot do what their grandparents did—raise monuments, maintain literacy, feed a city—that's a state change.

  **Mara:** Or it's a sampling artefact. That's the first thing bothering me. The grain problem. You know this from your friend in limnology. In a sediment core, a signal that changes faster than your sampling interval looks like a step discontinuity. A slow decline looks abrupt depending on the resolution. Why doesn't that grain-dependence make the phenomenon unreal?

  **Elias:** Because measurement thresholds are everywhere in science. Water boils at a specific temperature regardless of how often you check the thermometer. If a society crosses a threshold where it can no longer maintain a grid or enforce laws, that's a phase change. Even if our sampling makes it look sharper than it was, the loss of function is real. The signal might be aliased, but the noise isn't the signal.

  **Mara:** But water doesn't have agency. If I stop boiling water because I prefer tea, haven't I transformed the system rather than collapsed it? You're measuring stone because stone survives. You're measuring states because you value states. That's the base-rate problem. Every complex society eventually changes. What's the control group? If collapse is defined broadly enough, is there any society that hasn't collapsed?

  **Elias:** If you define it as loss of complexity, yes. But complexity isn't just preference. It's energy throughput. A city can do things a village cannot. Irrigation on a basin scale. Specialized medicine.

  **Mara:** Or it's fragility. High throughput systems break harder. And that leads to the second issue: the *cannot-versus-will-not*. A population may stop doing something because it lost the capacity, or because it no longer wants to, or because it redirected the capacity. Can the archaeological record discriminate these in principle?

  **Elias:** It's hard. But let's test that difficulty against the definition our limnologist friend offered us: "Collapse is a sustained, multi-generational reduction in the number of distinct capabilities a population can exercise, where the reduction is not compensated by the acquisition of new capabilities at a different scale or in a different idiom."

  **Mara:** It's generous. But "capabilities" is a black box. How do you count them? And "compensated" is teleological. Who decides if pottery quality compensates for lost literacy? The evaluator's preferences are inside the measure.

  **Elias:** I'd repair it by specifying *institutional* capabilities. Can the polity extract surplus? Can it enforce monopoly on violence? If those drop and stay down, it's collapse. The cost? I admit it's about the polity, not the people. I lose the claim that the *culture* died.

  **Mara:** And I'd repair it by removing "reduction" and inserting "translation". Capabilities aren't lost; they migrate. The cost? I have to admit some migrations are so severe they look like loss to anyone living through them. Starvation doesn't feel like translation.

  **Elias:** Let's apply this. Southern Lowland Maya. Monuments stop. Centers abandoned.

  **Mara:** Transformation. The political center moves north. The people remain. Maya speakers are still there. If the population persists and speaks the same language, what collapsed?

  **Elias:** The institution that raised the monuments. The divine kingship.

  **Mara:** But if the entity is the population, nothing collapsed. If the entity is the polity, sure. But you've just narrowed your claim. You're no longer talking about civilizational collapse, just regime change. You have to answer the fact that the descendants are still there.

  **Elias:** Fair. I concede the Maya case is better described as political reorganization than demographic collapse. The cost is I lose the rhetorical punch of "civilization ended." I have to specify: the *state* collapsed, the *culture* persisted. It forces me to be precise about the entity.

  **Mara:** Thank you. Now, Late Bronze Age Eastern Mediterranean. Palaces burn. Literacy vanishes. Metal trade stops.

  **Elias:** Here, the *cannot* is visible. They didn't choose to stop writing Linear B. The skill died. The network broke.

  **Mara:** Or it became perishable. Maybe they wrote on skin.

  **Elias:** Unlikely given the administrative depth required. This looks like capacity loss. But here's your base-rate problem again. If complexity drops, is it collapse? If it changes shape, is it transformation?

  **Mara:** That's the trick. If you define it as "loss of complexity," you're baking in a preference for complexity. Why is a city better than a village?

  **Elias:** Because a city can do things a village cannot.

  **Mara:** Or because you live in a city. Let's look at Rapa Nui. Statues stop. Figures pulled down.

  **Elias:** Here is where I expect you to say transformation.

  **Mara:** I used to. I said it was adaptation. They shifted to birdman cults. Efficient use of resources. Less energy spent on stone, more on food.

  **Elias:** Did they?

  **Mara:** ...No. Here I concede. The quarry tools are left mid-stroke. The capacity to move the statues was lost, not just redirected. They couldn't do it anymore. The social organization required to move ten tons of rock was gone.

  **Elias:** So it is collapse?

  **Mara:** It is genuine capacity loss. The cost? I have to admit that sometimes "transformation" is a euphemism for "breakdown." Not all change is neutral. Some doors close and don't open elsewhere.

  **Elias:** And I admit that sometimes "collapse" is a euphemism for "I don't like the new regime."

  **Mara:** So where does that leave us? The entity matters. Polity versus population.

  **Elias:** Yes. The Maya descendants prove the population didn't collapse. The institution did.

  **Mara:** And the grain matters. If we sample every generation, maybe the Bronze Age looks like a slide, not a cliff.

  **Elias:** Maybe. But if the slide ends at zero literacy, the bottom is real.

  **Mara:** What would move you? What finding would make you say "This wasn't collapse"?

  **Elias:** If you showed me continuous household-level wealth data across the transition. If the elites vanished but the average caloric intake and craft specialization remained stable, I'd call it restructuring. I need to see the baseline hold while the peak drops.

  **Mara:** And for me? What would make you say "This was collapse"?

  **Elias:** If you found evidence of the skill being known but forbidden.

  **Mara:** No. If I found evidence that the population *could* have maintained the system but chose a lower energy state consistently over generations without coercion. That would prove agency over failure. Evidence of surplus capacity deliberately left unused.

  **Elias:** Hard to prove.

  **Mara:** So is your threshold.

  **Elias:** But we're looking at the same dirt.

  **Mara:** Just different depths.
