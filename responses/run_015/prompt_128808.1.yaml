  hey so im taking this philosophy elective at school and we just got into indirect normativity and idealized deliberation, and i feel like im completely lost but also maybe asking the wrong question. so like, indirect normativity means moral rules dont apply to you directly — instead they apply through some kind of idealized deliberation where you imagine perfect rational people in a room agreeing on principles. but if that whole deliberation is just made up in some philosophers head, how can it actually bind real people? my friend said its not like indirect democracy where representatives vote for you, but even so, if the middleman is imaginary, then the obligation feels imaginary too, like consent across dimensions or something.

  and then theres this other thing my teacher called the deliberative filter, where you run principles through the ideal scenario to check if anyone could reject them. but if the filter itself operates indirectly, dont we need direct norms to run the filter? like, the filter has to be fair and unbiased directly, which means indirect normativity collapses back into direct normativity at the meta-level. is that the collapse argument people talk about, or am i just misunderstanding what 'indirect' is supposed to mean? sorry if this sounds dumb, just trying to figure out why hypothetical consent matters if nobody actually agreed to anything.
