      *   Phase 2: 25
      *   Debrief: 20
      *   Total: 90. Perfect.

  14. **Anticipating Problems:**
      *   *Problem:* Students rebel in Phase 1. "Why can't I go there?"
      *   *Fix:* Frame it as "Board Physics." Don't argue. Just state constraints.
      *   *Problem:* They feel cheated in Phase 2.
      *   *Fix:* Acknowledge this in debrief. It's a feature, not a bug. It mimics the frustration of hard determinism.

  15. **Drafting the Content:** (Mental outline of the text to generate).
