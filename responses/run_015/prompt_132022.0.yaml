answer: |-
  # Workshop Plan: The Causal Lattice
  **Topic:** Dennett's *Elbow Room* vs. *Leeway*  
  **Time:** 90 Minutes  
  **Participants:** 12 Grad Students (3 Teams of 4)  
  **Materials:** Whiteboard + markers, 3 printed Role Cards per team, 1 Facilitator "Law Sheet" (kept hidden), Scoreboard.

  ---

  ## 1. Setup & Roles (0:00–0:10)
  **Do not mention free will, determinism, or Dennett.** Frame this as a decision-theory simulation.

  **The Board:** Draw a 6x6 grid on the whiteboard. Mark a **Start** (bottom center) and three **Goal Zones** (top left, top center, top right).
  **The Teams:** Divide the room into 3 teams of 4. Assign roles within each team:
  1.  **Navigator (1 person):** The only one allowed to declare moves (e.g., "Move North").
  2.  **Observer (1 person):** Tracks patterns. Their job is to hypothesize *why* moves succeed or fail.
  3.  **Recorder (2 people):** Tracks the path taken, the score, and the Navigator's stated *reason* for each move (e.g., "Moved North to avoid edge").

  **The Objective:** Reach a Goal Zone with the highest possible score.
  **The Scoring:**
  *   Reaching a Goal: +100 points.
  *   Each Move: -5 points (effort cost).
  *   **Crucial:** Navigators must state a *reason* for every move to validate the points.

  **Facilitator Note:** You hold the "Law Sheet." This contains the hidden deterministic rules. You are the "Engine." You do not move the token; you validate the Navigator's proposed moves.

  ---

  ## 2. Phase 1: The Illusion of Leeway (0:10–0:35)
  **The Hidden Rule (For Facilitator Only):**
  *Write this on a card and keep it hidden.*
  > **The Causal Funnel:**
  > 1. You cannot move to a square you have previously occupied.
  > 2. You cannot move 'Backwards' (South) unless your previous move was 'Forwards' (North).
  > 3. **The Hard Constraint:** If the sum of your total moves so far is *Even*, you cannot move West. If *Odd*, you cannot move East.
  > *(This ensures paths converge and feel restricted without being a single straight line.)*

  **Gameplay:**
  1.  Navigator proposes a move ("I move North to get closer to the goal").
  2.  You check the Law Sheet.
      *   If Valid: "Move Accepted." (Update board, deduct points).
      *   If Invalid: "Move Causally Blocked. That transition is incompatible with the current state." (Do not explain why. Ask for a new proposal).
  3.  **The Experience:** Navigators will feel they are choosing. When blocked, they will feel frustrated but will assume they made a strategic error or hit a random obstacle. They believe they *could have* moved West if they were smarter/bolder. This is the **Leeway** intuition.

  **Mid-Game Twist (Minute 25):**
  Announce: "One Goal Zone is now locked." (Pick the one most teams are heading for).
  Watch them deliberate. They must revise plans. They feel the weight of agency.

  ---

  ## 3. The Reveal: Hitting the Wall (0:35–0:45)
  Stop the game. Freeze the board state.

  **The Announcement:**
  "Pause. Up until now, you operated under the assumption that your choices opened or closed possibilities. That assumption was false.
  The grid is deterministic. The 'Causal Blocks' were not random obstacles. They were laws. Given your starting position and your sequence of prior moves, **every valid move I accepted was the only move you could have made.**"

  **Show the Law Sheet.** Let them read the rules.
  Ask them to look at their Recorder's log. Point out where they wanted to go East but the 'Odd/Even' rule forced them West.
  **The Wall:** Ask the Navigators: "In Phase 1, did you feel you could have done otherwise?" (They will say yes). "Could you have?" (No).

  **The Pivot:**
  "However, the workshop is not over. We are going to play Phase 2. The rules remain exactly the same. The path is still determined. But the scoring changes."

  ---

  ## 4. Phase 2: Elbow Room (0:45–1:10)
  **New Scoring Rules:**
  *   Reaching a Goal: +100 points.
  *   **Deliberation Bonus:** +10 points if the Navigator's stated reason *aligns* with the Goal (even if the move was forced).
  *   **Resignation Penalty:** -20 points if the Navigator says something like "I have to go West" or "The rules make me."
  *   **Agency Bonus:** +20 points if the Navigator says "I choose West because..."

  **Gameplay:**
  Run the simulation again from the current positions.
  *   **The Trap:** Students who feel "cheated" by the reveal will say, "What's the point? It's fixed." They will lose points via the Resignation Penalty.
  *   **The Success:** Students who say, "Okay, the physics force me West, but *I* am still the one driving the token to the goal to get the points," will score higher.

  **Observation:** Watch for the split. Some Navigators will stop giving reasons ("Just tell me where to go"). Others will lean into the reasoning ("I am moving West *in order to* reach the goal").

  ---

  ## 5. Debrief: Mapping to Dennett (1:10–1:30)
  **Step 1: The Phenomenology (5 mins)**
  Ask the room:
  *   "In Phase 2, did the *feeling* of choosing disappear?"
  *   "Did the *value* of your reasoning disappear?"
  *   "Who felt like a puppet? Who felt like a pilot flying a plane with a flight computer?"

  **Step 2: The Distinction (10 mins)**
  Now you can name **Daniel Dennett**. Draw two columns on the board.

  | **Leeway (Libertarian)** | **Elbow Room (Compatibilist)** |
  | :--- | :--- |
  | "I could have done otherwise in the *exact same* circumstances." | "I could have done otherwise *if* I had chosen differently." |
  | Killed by the Reveal. | Survives the Reveal. |
  | Requires a break in causality. | Requires absence of coercion. |
  | **Phase 1 Feeling:** "I was free to go anywhere." | **Phase 2 Feeling:** "I am free to pursue my reasons." |

  **Explain:**
  "Dennett argues we don't need *Leeway*. That's a magical idea. If the universe is deterministic, Leeway is dead. But we *do* need *Elbow Room*.
  In Phase 2, the rules were fixed. But your **reasons** still mattered. If you hadn't deliberated, you wouldn't have reached the goal. The determinism didn't bypass your reasoning; it *ran through* it. That is the only freedom worth wanting."

  **Step 3: Limitations & The Evolutionary Story (5 mins)**
  Be honest about what the game failed to capture.
  *   **The Game's Flaw:** "In the game, the rules were arbitrary (Odd/Even). In real life, the 'laws' are physics and biology."
  *   **The Missing Piece:** "Dennett doesn't just say Elbow Room exists. He says it's *valuable* because of evolution. Organisms that can model their environment and deliberate (even if determined) survive better than those that can't. The game gave you points; evolution gives you life."
  *   **Anticipated Failure:** "I expect some of you felt Phase 2 was 'cheating.' That is the Hard Determinist intuition. It's the feeling that if I didn't have Leeway, my reasons don't matter. Dennett's job is to convince you that your reasons matter *because* they are the mechanism of the determination."

  ---

  ## Facilitator Cheat Sheet: Troubleshooting

  **If they break character/laugh during Phase 1:**
  *   *Response:* "Treat the 'Causal Blocks' like gravity. You don't laugh at gravity; you navigate it."

  **If they refuse to play Phase 2:**
  *   *Response:* "You can resign. But your score will reflect that resignation. The game is testing whether determinism kills motivation. If you stop playing, you prove the Hard Determinist right. If you play for points, you prove Dennett right."

  **If they argue the rules are 'coercion':**
  *   *Response:* "Coercion is a gun to your head. These rules are the structure of the board. You aren't being forced to play; you are choosing to play within the laws of physics. That is the definition of Elbow Room."

  **Timeline Summary:**
  *   **00-10:** Setup & Roles.
  *   **10-35:** Phase 1 (Hidden Determinism).
  *   **35-45:** The Reveal (The Wall).
  *   **45-70:** Phase 2 (Agency within Determinism).
  *   **70-90:** Debrief (Dennett, Leeway vs. Elbow, Evolution).

  ---

  ## Why This Works for Grad Students
  1.  **It respects their intelligence:** It doesn't lecture; it simulates a metaphysical problem.
  2.  **It creates data:** The debate in Phase 2 provides the evidence for the debrief.
  3.  **It isolates the variable:** By keeping the rules identical between Phase 1 and 2, the only thing that changes is their *knowledge* of determinism. This isolates the psychological impact of Hard Determinism vs. Compatibilism.
  4.  **It honors the prompt:** It forces the "Wall" (Leeway is dead) but leaves the door open for "Elbow Room" (Agency survives).
