  # Seminar Handout: Sorting by Commitment
  ### A Decision Tree on *Pramāṇa* Reductions

  **Root Commitment:** You accept that some of our beliefs amount to knowledge (*pramā*), and that not all of them come to us through the senses (*pratyakṣa*). You therefore accept at least Perception and Inference (*anumāna*) as valid means of knowledge.

  **Instructions:** Answer the following four questions based on your philosophical intuitions regarding specific edge cases. Follow the branches to find your epistemological profile.

  ---

  ### The Decision Tree

  **Q1. Testimony (*Śabda*):** When you believe a fact because a trustworthy expert told it to you, is that knowledge generated by the statement itself, or only by your inference that the expert is reliable?
  *   **Only Inference:** Go to **Leaf A**.
  *   **Statement Itself (Distinct):** Go to **Q2**.

  **Q2. Comparison (*Upamāna*):** When a forest-dweller is told the *gavaya* resembles a cow and later picks one out on sight, has she gained anything beyond perception plus memory?
  *   **Nothing Beyond Perception/Memory:** Go to **Leaf B**.
  *   **Yes, Something Distinct:** Go to **Q3**.

  **Q3. Postulation (*Arthāpatti*):** In the stock case of the stout man who eats nothing by day (and so must eat at night), is this postulation or inference under another name?
  *   **Inference Under Another Name:** Go to **Leaf C**.
  *   **Distinct Postulation:** Go to **Q4**.

  **Q4. Absence (*Abhāva/Anupalabdhi*):** Does knowing that the pot is *not* on the ground require a means of knowledge of its own, or is it nothing beyond a negative perception?
  *   **Nothing Beyond Negative Perception:** Go to **Leaf D**.
  *   **Means of Its Own:** Go to **Leaf E**.

  ---

  ### The Leaves (Occupied Positions)

  **Leaf A: The Reductionist (2 *Pramāṇas*)**
  *   **Set Accepted:** Perception, Inference. (*Śabda, Upamāna, Arthāpatti, Abhāva* all reduced).
  *   **Classical School:** Buddhism (Dignāga/Dharmakīrti school).
  *   **Awkward Consequence:** Vedic or expert authority loses absolute certainty, becoming merely a probabilistic inference about the speaker's honesty.

  **Leaf B: The Triad (3 *Pramāṇas*)**
  *   **Set Accepted:** Perception, Inference, Testimony. (*Upamāna, Arthāpatti, Abhāva* reduced).
  *   **Classical School:** Sāṃkhya / Yoga.
  *   **Awkward Consequence:** The learning of names and resemblances is mechanized, stripping language acquisition of its normative epistemic force.

  **Leaf C: The Realist (4 *Pramāṇas*)**
  *   **Set Accepted:** Perception, Inference, Testimony, Comparison. (*Arthāpatti, Abhāva* reduced).
  *   **Classical School:** Nyāya-Vaiśeṣika.
  *   **Awkward Consequence:** Cannot account for knowledge of absolute non-existence without requiring some form of perceptual contact with the empty locus.

  **Leaf D: The Ritualist (5 *Pramāṇas*)**
  *   **Set Accepted:** Perception, Inference, Testimony, Comparison, Postulation. (*Abhāva* reduced).
  *   **Classical School:** Prābhākara Mīmāṃsā.
  *   **Awkward Consequence:** Must explain the absence of objects as a complex perception, which feels counter-intuitive for non-entities that offer no sensory data.

  **Leaf E: The Pluralist (6 *Pramāṇas*)**
  *   **Set Accepted:** Perception, Inference, Testimony, Comparison, Postulation, Absence.
  *   **Classical School:** Bhāṭṭa Mīmāṃsā / Advaita Vedānta.
  *   **Awkward Consequence:** Epistemological inflation; risks multiplying entities beyond necessity in violation of parsimony.

  ---

  ### Analysis of Unoccupied Combinations

  Your tree generates 16 theoretical combinations (2⁴). The 5 leaves above occupy the "staircase" (0000, 1000, 1100, 1110, 1111). The remaining 11 combinations are unoccupied by major classical schools.

  1.  **No Śabda, Yes Upamāna (0100):** *Incoherent.* Comparison relies on a prior description (testimony); accepting the latter while rejecting the former is structurally unstable.
  2.  **No Śabda, Yes Arthāpatti (0010):** *Incoherent.* Postulation typically resolves contradictions found in understood statements; without distinct testimony, the contradiction lacks force.
  3.  **No Śabda, Yes Abhāva (0001):** *Unattractive.* Knowing absence as a distinct category without accepting distinct linguistic knowledge makes communicating that absence inexplicable.
  4.  **No Śabda, Yes Upamāna + Arthāpatti (0110):** *Unexplored.* No text defends this; likely incoherent for the reasons above.
  5.  **No Śabda, Yes Upamāna + Abhāva (0101):** *Unexplored.* Highly unattractive; accepts complex relational knowledge while rejecting the foundational source of relations (language).
  6.  **No Śabda, Yes Arthāpatti + Abhāva (0011):** *Unexplored.* Incoherent; accepts derived corrective knowledge (postulation) without accepting the primary knowledge it corrects.
  7.  **No Śabda, Yes All Three (0111):** *Incoherent.* Accepting all dependent categories while rejecting the foundational category (Testimony) is logically untenable.
  8.  **Yes Śabda, No Upamāna, Yes Arthāpatti (1010):** *Unattractive.* Why accept the complex resolution of contradictions (postulation) while rejecting the simpler learning of resemblances (comparison)?
  9.  **Yes Śabda, No Upamāna, Yes Abhāva (1001):** *Unexplored.* Accepting absence as distinct while rejecting comparison is an unmotivated asymmetry in relational knowledge.
  10. **Yes Śabda, No Upamāna, Yes Arthāpatti + Abhāva (1011):** *Unexplored.* Unattractive; skips the "middle" relational *pramāṇa* while accepting the most abstract ones.
  11. **Yes Śabda, Yes Upamāna, No Arthāpatti, Yes Abhāva (1101):** *Unexplored.* Nyāya rejects both; Mīmāṃsā accepts both. Accepting Absence but rejecting Postulation is historically unattested and offers no clear advantage.

  ---

  ### Indistinguishable Leaves

  **Flag:** This tree cannot in practice separate **Bhāṭṭa Mīmāṃsā** and **Advaita Vedānta**.
  Both schools arrive at **Leaf E** (accepting all 6 *pramāṇas*). While their metaphysical commitments (the reality of the world vs. illusion) differ radically, their epistemological *inventory* is identical. To separate them, a fifth node regarding the *content* of Testimony (Vedic injunction vs. Ontological statement) would be required.
