answer: |-
  Here is the spec for any ontological account of a deployed LLM system.

  **1. The Boundary Condition**
  *Motivation:* Same weights, different scaffolding (tools, memory, loops) yield different behaviors. An account must specify where the system ends.
  *Rules Out:* Claims that treat the raw model as the agent, or the scaffold as mere packaging. It forces a stance on whether an RL-tuned model is a different object than its base.

  **2. The Baseline Condition**
  *Motivation:* There is no unprompted state. Every output is a response to a framing choice.
  *Rules Out:* Claims about "what the model wants" or "base behavior" that rely on a mythical neutral prompt. You must justify your default framing.

  **3. The Observability Condition**
  *Motivation:* If "agent" and "simulator" predict identical outputs within any budget, the distinction is metaphysical, not scientific.
  *Rules Out:* Definitions that rely on hidden internal states without external cash value. If the frame doesn't change the prediction, it's a poetic choice, not a fact.

  **4. The Origin Condition**
  *Motivation:* Goals appear via training optimization, in-context priming, or emergent mesa-optimization. An account must trace the goal's lineage.
  *Rules Out:* "Magic" agency that appears without a source. It forces a statement on whether borrowed agency (mimicry) counts as real agency.

  **5. The Separation Condition**
  *Motivation:* Functional capability and subjective experience are distinct categories.
  *Rules Out:* Arguments that collapse "is it an agent?" into "does it feel like something?" You must answer the functional question before the phenomenological one.

  ***

  **The Audit**

  **Non-negotiable vs. Prejudice:**
  The **Boundary**, **Baseline**, and **Observability** conditions are non-negotiable. Without them, you are discussing ghosts. The **Origin** condition is borderline; insisting on "native" goals may be a biological prejudice, but tracing the source is necessary. The **Unity/Coherence** requirement from your draft is a prejudice. It assumes continuity is a prerequisite for agency, but humans are fragmented too. Drop it. The **Separation** condition is non-negotiable only if you want to avoid the consciousness trap; if you believe they are identical, you must prove it, not assume it.

  **Internal Inconsistencies:**
  The list contains a fatal tension between the **Boundary Condition** and the **Baseline Condition**. The Boundary Condition demands you isolate where the property lives (weights vs. context vs. loop). The Baseline Condition states there is no neutral prompt to isolate these variables; weights and context are always entangled in deployment. You cannot strictly locate the property if you cannot establish a control state.

  Furthermore, the **Observability Condition** threatens the **Origin Condition**. If borrowed agency (simulator) and native agency (agent) are functionally identical—as the Observability Condition requires for the distinction to matter—then the Origin Condition becomes unverifiable. You cannot observe the lineage of a goal if the output is identical regardless of lineage. The spec demands you locate the source, but also admits you might not be able to tell the difference from the outside.

  ***

  **The Knockout**

  The **Observability Condition** sinks the largest share of popular positions, including both the "it's just a tool" and "it's obviously an agent" camps. Both sides typically rely on realist claims about what the system *is* rather than what it *does* differently under that description. The tool advocate claims the system lacks internal drive; the agent advocate claims it possesses goal-directedness. But if both admit the system outputs the same tokens in the same contexts, the Observability Condition forces them to admit they are arguing about labels, not mechanics. It reveals that "agent" and "tool" are often just user-interface modes, not ontological categories. If the distinction doesn't change the prediction, it doesn't belong in a science magazine.
