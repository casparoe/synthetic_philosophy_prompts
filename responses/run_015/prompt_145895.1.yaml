answer: |-
  **The Scenario**

  Dr Aris holds the sole dose of a stabilising antivenom in a rural clinic. Patient X is currently infused and will die if disconnected to redistribute the dose; Patients Y, Z, and W will die without it. Aris assigns 90% credence to Act Consequentialism (maximise lives saved) and 10% to a stringent Deontology (forbids killing via withdrawal). Consequentialism values saving three lives at +3 units and one life at +1 unit; Deontology values withdrawing from X at -10 units (killing) and withholding from YZW at 0 units (merely letting die). Aris must decide whether to switch the dose to the group or maintain care for X.

  **Reasoning and Structural Analysis**

  Under **My Favourite Theory (MFT)**, Aris follows the view with the highest credence (Consequentialism), which dictates saving the three patients. **Maximising Expected Choice-worthiness (MEC)** calculates the weighted average: switching yields $1.7$ units ($0.9 \times 3 + 0.1 \times -10$), while staying yields $0.9$ units ($0.9 \times 1 + 0.1 \times 0$); thus, MEC also mandates switching. However, **Maximin over Theories** examines the worst-case outcome for each option across all theories. The worst case for switching is -10 (if Deontology is true); the worst case for staying is 0 (if Deontology is true). Since 0 is superior to -10, Maximin requires protecting Patient X.

  The structural feature causing Maximin to peel away is the **asymmetry of the minority theory's valuation**. Deontology assigns a catastrophic negative value to one option (killing) but not the other (letting die), creating a low 'floor' only for the group-saving option. If you strip this feature—by positing a Deontological view that values letting die equally negatively (-10)—the Maximin verdict becomes indifferent (-10 vs -10), and the disagreement collapses; Maximin no longer vetoes the consequentialist choice, though MEC would still prefer the group.

  **The Maximin Defender's Attack**

  A defender of Maximin would argue this case is rigged by forcing intertheoretic cardinal comparisons. They would contend that deontological constraints are not utility scores that can be averaged away by high credence in consequentialism; a prohibition is lexical, not numerical. By assigning '-10', the case illegitimately treats a moral veto as a mere cost, which misunderstands the nature of deontological uncertainty.

  **Settled vs. Contested Status**

  It is **settled** among philosophers working on moral uncertainty that there is no consensus decision procedure; MEC, MFT, and Maximin are competing hypotheses, not established tools. It is **genuinely contested** whether intertheoretic value comparisons (required for MEC) are coherent, and whether agents can hold meaningful credences in moral truths. Many argue that moral uncertainty is categorically different from empirical uncertainty, rendering the probabilistic framework itself suspect.

  **Honesty Note**

  I must admit this case feels contrived. In reality, few clinicians assign precise cardinal utilities to moral theories, and the specific calibration required to make MEC and Maximin diverge while keeping MFT aligned relies on an artificial quantification of deontological constraints that most deontologists would reject as incoherent.
