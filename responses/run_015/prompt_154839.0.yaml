answer: |-
  Right, so the usual line on the paradox of tragedy is pretty straightforward: we enjoy sad art because it's a safe space. We cry at the telly, but we know nobody actually died, so we can walk away feeling purged rather than traumatised. It's like a emotional gym workout—you get the exertion without the actual danger.

  But here's where things get properly messy. Take immersive theatre or high-fidelity VR. Let's say you put on a headset for a piece about a refugee crisis. You're not just watching a bloke drown; you're holding his hand via haptic gloves, feeling his pulse fade, and he's looking at *you*, begging for help you can't give. Or in live theatre, maybe an actor singles you out, making you complicit in the betrayal unfolding on stage.

  In this scenario, the "safe container" idea starts to leak. You aren't just observing grief; you're implicated in it. Your body reacts with genuine stress hormones, your guilt feels real, and you might walk out properly shaken, not just moved. The risk is no longer theoretical; the psychological consequence is authentic.

  This creates a proper headache for the paradox. If the experience is too safe, it's boring—just puppetry. But if it's too authentic, if the distance collapses completely, it stops being "art" and starts being actual trauma. We seek these experiences wanting to feel something *real*, yet we simultaneously need to know it's *not real* enough to destroy us. When VR or immersive theatre blurs that line, we're left wondering: are we enjoying the tragedy, or are we just suffering? We want the pain to be authentic enough to matter, but distant enough to bear.

  \answer{The Authenticity-Distance Tension}
