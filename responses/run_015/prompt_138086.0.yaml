answer: |-
  ### Spec: Desiderata for Prices-as-Knowledge in Thin Markets

  1.  **Specification of Gains from Trade [NN]**
      The theory must explicitly state why trade occurs given the No-Trade Theorem. In a common-prior rational expectations equilibrium, trade is impossible; therefore, the theory must identify the friction being exploited. Is it heterogeneous priors (we genuinely disagree on the base rate), private signals (I know something you don't), or mechanism subsidy (the AMM pays to learn)?
      *Case:* In your lab, trade is likely driven by the AMM subsidy + heterogeneous priors. If you treat the price as "consensus probability" without acknowledging the subsidy, you misinterpret the liquidity floor as informational confidence.

  2.  **Causal Separation (Reflexivity) [NN]**
      The theory must distinguish between $P(Event)$ and $P(Event | Price)$. For reflexive questions (e.g., "will we abandon this project?"), the price is a causal input, not just an output.
      *Case:* A low price on project survival might trigger the abandonment it predicts. A valid theory must specify whether the price is intended to *forecast* the natural course or *steer* the outcome.

  3.  **Marginal vs. Global Information [NN]**
      The theory must define the price as a marginal condition (the belief of the last trader + AMM curve) rather than a global aggregation (the sum of all private info). In thin markets, these diverge radically.
      *Case:* With 24 traders, the price reflects the last person's willingness to pay against the AMM, not the room's aggregated posterior. Treating it as the latter overweights the last trader's signal.

  4.  **The Trinity Distinction (Calibration, Aggregation, Utility) [NN]**
      The theory must treat Calibration (do 50% prices happen 50% of the time?), Aggregation (does the price reflect all private signals?), and Decision Utility (does acting on the price improve outcomes?) as independent variables.
      *Case:* A subsidized market can be well-Calibrated and have high Utility (guiding grants) without achieving Aggregation (if experts stay out because the stakes are too low).

  5.  **Common Prior Assumption [P]**
      *Prejudice:* Assume traders share a common prior and only differ on signals (Rational Expectations).
      *Prejudice:* Assume traders have heterogeneous priors (Agree to Disagree).
      *Case:* The first makes the No-Trade Theorem binding (requiring noise/subsidy to explain trade); the second allows trade but makes "truth" subjective. Most market designers pretend the former while relying on the latter.

  ### Incompatible Pairs

  *   **Sensitivity to Private Info vs. Robustness to Manipulation:** You cannot maximize the price's reaction to a well-informed insider's trade while simultaneously making it costly for a bad-faith actor to move the price. In a thin market, the informed trader *looks* like the manipulator because both move the price disproportionately.
  *   **Liquidity (AMM) vs. Information Purity:** A subsidized AMM guarantees liquidity (allowing trade to happen), but it anchors the price to the subsidy function. The more subsidy you add to ensure trade, the more the price reflects the AMM's "belief" rather than the traders'.

  ### The Single Damager

  **Requirement 3 (Marginal vs. Global Information)** does the most damage to both popular stories. It destroys the **Glowing Story** (Wisdom of Crowds) by admitting that in a 24-person market, the price is not a consensus of dispersed knowledge but a marginal valuation heavily weighted by the AMM curve and the last trader's idiosyncrasies. Simultaneously, it destroys the **Cynical Story** (Greater Fool) by showing that the price isn't random noise or pure manipulation; it is a structured, mechanism-defined signal that, while not "global truth," is still a valid marginal cost estimate for decision-making. It forces the admission that the price is neither Oracle nor Noise, but a *Mechanism Artifact*.

  ### Contender Performance

  **Rational Expectations Equilibrium (REE)** fails Requirement 1 and 3; it assumes trade reveals global info without explaining why trade happens in common-prior settings, collapsing in thin markets. **Behavioral/Noise Trader Models** satisfy Requirement 1 (by allowing irrational trade) but often fail Requirement 4, conflating utility with noise-driven volatility. **Market Scoring Rules (AMM/LMSR)** excel at Requirement 1 and 2 (explicit subsidy, handles reflexivity via design) but struggle with Requirement 3, as the subsidy curve often dominates the signal in thin markets, making the price more a function of the budget than the belief.
