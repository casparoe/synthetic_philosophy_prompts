prompt: |-
  I'm the deputy editor of a popular history magazine, circulation around 80,000, with no in-house ancient historian. Each month roughly two dozen submissions and pitches land in the gray zone between minority scholarship and pseudohistory. Recent examples: a self-published book arguing that Atlantis was a distorted cultural memory of Minoan civilization wrecked by the Thera eruption; a letter explaining that conventional chronology is largely a fabrication and that a stretch of the early Middle Ages never happened, citing Fomenko's New Chronology and Illig's phantom time hypothesis interchangeably, apparently without noticing that they disagree about which centuries are phantoms; occasional ancient-astronaut material in respectable dress; and, mixed in with these, pitches that are unorthodox but serious — a classicist arguing that the received story of the destruction of the Library of Alexandria is mostly legend, which happens to be close to what academic specialists now think.

  We currently sort these by feel, and we sort them inconsistently: one editor's "fun contrarian piece" is another's "never touch." I want a written procedure that any of us could run in fifteen minutes on a single pitch, producing one of four outcomes: (a) engage it as a live minority view; (b) classify it as pseudohistory — rejected outright, or covered explicitly as pseudohistory under my signature; (c) fiction or entertainment, if the author will accept it under that label; (d) undecidable in fifteen minutes, with a note on what evidence would decide it. The procedure should ask its questions in a fixed order, state for each question what counts as a sufficient answer and which answer ends the run at (b), and flag the steps that are irreducibly judgment calls — I suspect the line between "maverick but in the game" and "outside the game" is one, and I want it marked rather than smoothed over. Questions I'd expect somewhere in the sequence, reworked as you see fit: does the author allege a conspiracy or a systemic blindness of an entire discipline, or just one mistaken consensus; is the claim revisable in principle, and does the author say what would count against it; do they engage existing rebuttals or behave as though none exist; does the claim require whole independent fields (astronomy, dendrochronology, radiocarbon dating) to be broken, rather than one narrative to be wrong. Discard any of these you think are bad tests, add others, and say why.

  Then run the procedure on three pitches: (1) the Thera-Atlantis book, whose author, a retired naval architect, argues in apparent good faith and answers objections directly; (2) the phantom-time letter, which treats the scarcity of surviving written records as evidence that the events never happened and denounces carbon dating as circular; (3) the classicist on the Library of Alexandria, who is condescending about our magazine in the pitch. Include the third even if you find it easy — I want to see the procedure terminate quickly when it should. I already suspect I won't like the answer on the first: I had filed it as bunk, and if your procedure says it is a minority hypothesis to be judged on ordinary evidential grounds, and that a debunking treatment would be unfair to it, I want to hear that anyway.

  Finally, be explicit about what the procedure cannot do. Two failure modes worry me in particular: that good manners let a crank through (politeness is not evidence), and that it misfiles the next Wegener or the next pre-Clovis settlement claim — a view dismissed as crackpot-adjacent in its day and accepted decades later. Is there anything built into the procedure that guards against the second, or is that protection unachievable by any checklist — and if so, where should the value judgment sit, and with whom? On a related disagreement among the staff: some of us think covering such material as pseudohistory amplifies it. I assume no procedure can settle that one; tell me where the call belongs.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Deputy Editor of a popular history magazine (circ. 80k).
      *   **Problem:** Inconsistent sorting of "gray zone" submissions (minority scholarship vs. pseudohistory). No in-house ancient historian.
      *   **Goal:** A written 15-minute triage procedure with four outcomes: (a) Live Minority View, (b) Pseudohistory (Reject/Debunk), (c) Fiction/Entertainment, (d) Undecidable (Needs more info).
      *   **Requirements:** Fixed order of questions, sufficient answers defined, stop conditions for (b), flag irreducible judgment calls, evaluate specific tests (conspiracy, revisability, rebuttals, independent fields), run on three specific pitches, address limitations (false positives/negatives, editorial policy on debunking).
      *   **Tone:** Professional, pragmatic, intellectually rigorous but accessible to non-specialist editors.

  2.  **Deconstruct the "Gray Zone" Problem:**
      *   *Pseudohistory* typically involves: conspiracy theories, immunity to counter-evidence, cherry-picking, rejection of established methodology without cause, grandiosity.
      *   *Minority Scholarship* typically involves: engagement with peer review, acknowledgment of counter-evidence, methodological consistency, specific claims rather than total system overhaul.
      *   *The Challenge:* Distinguishing between a radical new theory (e.g., Wegener's Continental Drift initially) and a crackpot theory (e.g., Phantom Time).

  3.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Constraint:* Must take ~15 minutes.
      *   *Structure:* Sequential filters. If you fail one, you stop (mostly).
      *   *Question Design:* Need to incorporate the user's suggestions but refine them for clarity and stopping power.
      *   *User's Suggested Tests:*
          1.  Conspiracy/Systemic Blindness vs. Mistaken Consensus. (Good test. Pseudohistory loves conspiracies.)
          2.  Revisability/Falsifiability. (Crucial. If nothing counts against it, it's dogma.)
          3.  Engagement with Rebuttals. (Crucial. Ignoring the literature is a red flag.)
          4.  Independent Fields Broken. (Strong test. Phantom Time requires *all* dating to be wrong.)
      *   *Additions:*
          5.  *Methodological Continuity:* Does the author use the tools of the field or invent new ones ad hoc?
          6.  *Tone/Stakes:* Is the tone defensive/grandiose or analytical? (Flag as judgment call.)
      *   *Ordering:* Start with the easiest/hardest stops.
          1.  Falsifiability (Is this even history?)
          2.  Scope of Error (One mistake or everything is fake?)
          3.  Engagement (Do they know the counter-arguments?)
          4.  Methodology (Standard tools or magic?)
          5.  Tone/Conspiracy (Judgment call zone).

  4.  **Refining the Questions & Outcomes:**
      *   Need to ensure "Stop at (b)" conditions are clear.
      *   Need to mark where human judgment is unavoidable.
      *   *Outcome Definitions:*
          *   (a) Minority: Plausible, engages evidence, controversial but methodological.
          *   (b) Pseudo: Fails falsifiability, requires conspiracy, ignores rebuttals.
          *   (c) Fiction: Author agrees it's speculative/narrative.
          *   (d) Undecidable: Needs expert review.

  5.  **Running the Procedure on the Three Pitches:**

      *   *Pitch 1: Thera-Atlantis (Naval Architect).*
          *   Context: Minoan/Thera link is a standard *partial* analogy, but "Atlantis was real" is the hook.
          *   Test 1 (Falsifiability): Likely passes (geological evidence exists).
          *   Test 2 (Scope): Does it require *all* chronology to be wrong? Probably not, just Plato's account interpreted loosely.
          *   Test 3 (Rebuttals): User says "answers objections directly."
          *   Test 4 (Fields): Requires geology/archaeology, not *all* science.
          *   Result: Likely (a) or (d). The user suspects it's bunk, but the protocol might flag it as "Minority View" because it's a specific historical hypothesis, not a systemic denial of reality. *Self-Correction:* The prompt asks me to be honest even if it contradicts the editor's instinct. If the author engages in good faith, it's not *pseudohistory* in the malicious sense, even if wrong. It might be "Fringe Archaeology." I need to distinguish between "Wrong" and "Pseudo."
          *   *Decision:* The protocol will likely categorize this as (a) or (d), noting that "Atlantis" is a loaded term. If the author admits "Atlantis" is a label for Minoans, it's history. If they insist on a literal lost continent with tech, it's pseudo. The prompt says "distorted cultural memory." That's actually a mainstream *element* (Plato inspired by Thera), just pushed too far. I will classify it as (a) with caveats.

      *   *Pitch 2: Phantom Time (Fomenko/Illig).*
          *   Context: Claims 300 years didn't happen.
          *   Test 1 (Falsifiability): Claims carbon dating is circular. Hard to falsify in their view.
          *   Test 2 (Scope): Requires dendrochronology, astronomy, radiocarbon, *and* all other cultures' records to be wrong.
          *   Test 3 (Rebuttals): Ignores them (calls them part of the conspiracy).
          *   Result: Hard stop at (b).

      *   *Pitch 3: Library of Alexandria (Classicist).*
          *   Context: "Destruction is legend." Mainstream view now.
          *   Test 1 (Falsifiability): Yes.
          *   Test 2 (Scope): Specific event, not all history.
          *   Test 3 (Rebuttals): Engages scholarship.
          *   Tone: Condescending.
          *   Result: (a). The tone is an editorial problem, not a pseudohistory problem. Protocol should catch this quickly.

  6.  **Addressing the Limitations (The "Wegener Problem" & "Politeness Problem"):**
      *   *Politeness:* A well-mannered crank is still a crank. The procedure must weigh *evidence engagement* over *tone*, but flag tone as a secondary heuristic.
      *   *Wegener:* Paradigm shifts *look* like pseudohistory initially. The safeguard is the "Undecidable (d)" bucket and the requirement for *external review*. The checklist cannot solve this; only expert peer review can.
      *   *Debunking Policy:* This is an editorial strategy call, not a triage call. The procedure identifies *what* it is; the Editor-in-Chief decides *if* we publish a debunking.

  7.  **Drafting the Content:**
      *   *Introduction:* Acknowledge the difficulty.
      *   *The Protocol:* Step-by-step, clear stop conditions.
      *   *The Trials:* Apply the protocol rigorously.
      *   *The Limitations:* Honest assessment of false negatives/positives.
      *   *Editorial Policy:* Separate the "Is it pseudo?" question from "Do we publish a debunk?" question.

  8.  **Refining the "Judgment Calls":**
      *   I need to explicitly mark where the editor has to use intuition. Usually, this is around "Conspiracy" vs. "Institutional Inertia." Academics are conservative; cranks claim conspiracy. The line is thin.
      *   Also, the "Atlantis" case is tricky. Mainstream archaeology says "Atlantis is a myth inspired by Thera." The pitch says "Atlantis *was* Thera." That's a semantic shift. If they treat it as metaphor/memory, it's history. If they treat it as literal geography matching Plato exactly, it's pseudo. I need to make sure the protocol distinguishes these.

  9.  **Final Review against Constraints:**
      *   15 minutes? Yes, if questions are sharp.
      *   Four outcomes? Yes.
      *   Fixed order? Yes.
      *   Stop conditions? Yes.
      *   Three pitches analyzed? Yes.
      *   Limitations discussed? Yes.

  10. **Writing the Response:** (Mental check on tone: respectful, authoritative, collaborative.) *Self-Correction on Pitch 1:* The user says they filed it as bunk. If the protocol says (a), I must explain *why* the protocol differs from their gut. The gut sees "Atlantis" = Pseudo. The protocol sees "Methodological engagement" = Minority View. This is a crucial distinction. I will highlight this tension.

  11. **Final Polish:** Ensure the distinction between "Pseudohistory" (methodological failure) and "Wrong History" (factual error) is clear. This is the core of the deputy editor's problem.

  *(Self-Correction during drafting)*: Wait, the prompt asks me to discard bad tests.
