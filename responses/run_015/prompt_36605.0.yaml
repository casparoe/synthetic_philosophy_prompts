answer: |-
  Here is a proposed triage protocol, designed for speed and consistency, followed by the application to your three pitches and an analysis of the procedure's limitations.

  ### The "Gray Zone" Triage Protocol (15-Minute Version)

  **Purpose:** To distinguish between minority scholarship, pseudohistory, and speculative entertainment without requiring specialist subject knowledge.
  **Outcomes:**
  *   **(A) Live Minority View:** Engage for peer review.
  *   **(B) Pseudohistory:** Reject outright or schedule for explicit debunking (Editor's discretion).
  *   **(C) Fiction/Entertainment:** Offer contract under non-fiction disclaimer or reject.
  *   **(D) Undecidable:** Requires external specialist review before decision.

  **Instructions:** Proceed through questions in order. If a **STOP** condition is met, assign the indicated outcome immediately. If you reach the end without a STOP, assign (A) or (D).

  ---

  #### Step 1: The Falsifiability Test
  **Question:** Does the author specify what evidence would prove them wrong?
  *   **Sufficient Answer:** "If we found X in the archaeological record," or "If radiocarbon dates from Y layer showed Z."
  *   **STOP Condition:** If the author claims that counter-evidence is itself part of the deception, or that the claim is "spiritually/metaphorically true" beyond physical testing.
  *   **Outcome on STOP:** **(B) Pseudohistory.**
  *   **Judgment Call:** Distinguishing between "the evidence was lost" (plausible) and "the evidence is impossible to find by definition" (dogma).

  #### Step 2: The Scope of Error Test
  **Question:** To be right, does this claim require one specific narrative to be corrected, or does it require entire independent methodologies to be fabricated?
  *   **Sufficient Answer:** "The dating of this specific stratum is wrong" or "This translation of this text is disputed."
  *   **STOP Condition:** If the claim requires dendrochronology, radiocarbon dating, astronomy, *and* the historical records of multiple unrelated civilizations (e.g., Chinese, Mayan, Roman) to be simultaneously wrong or forged to fit a single narrative.
  *   **Outcome on STOP:** **(B) Pseudohistory.**
  *   **Note:** This filters out "Phantom Time" style claims. History relies on cross-disciplinary triangulation; a valid minority view rarely breaks the triangulation tools themselves.

  #### Step 3: The Engagement Test
  **Question:** Does the pitch acknowledge the strongest existing counter-argument against its central claim?
  *   **Sufficient Answer:** Cites a specific scholar, paper, or prevailing data point that contradicts the pitch, and offers a reason why that data is mistaken or incomplete.
  *   **STOP Condition:** The pitch treats the academic consensus as a monolithic "they" that ignores the truth, without naming who "they" are or what specific work they produced.
  *   **Outcome on STOP:** **(B) Pseudohistory.**
  *   **Judgment Call:** **CRITICAL.** Distinguishing between "institutional inertia" (real) and "systemic conspiracy" (pseudo). If the author claims scholars are *mistaken*, proceed. If the author claims scholars are *hiding* the truth to protect funding/reputations without evidence of malfeasance, STOP.

  #### Step 4: The Methodology Test
  **Question:** Does the author use the standard tools of the field, or do they invent a new method to solve this specific problem?
  *   **Sufficient Answer:** Uses standard linguistic analysis, stratigraphy, or archival research, even if applied unusually.
  *   **STOP Condition:** Invents a unique decoding key, relies on numerology, or uses a method that only works for this specific claim and cannot be applied elsewhere.
  *   **Outcome on STOP:** **(B) Pseudohistory.**
  *   **Alternative Path:** If the method is speculative but the author admits it is unproven, offer **(C) Fiction/Entertainment**.

  #### Step 5: The "Wegener" Safety Valve (Final Check)
  **Question:** Is the claim radical but internally consistent with the evidence provided?
  *   **Action:** If you have passed Steps 1–4 but still feel uneasy because the claim is radical (e.g., "Pre-Clovis settlement"), do not classify as (B).
  *   **Outcome:** **(D) Undecidable.** Send for external peer review.
  *   **Rationale:** This protects against false negatives (rejecting the next Continental Drift theory). If the methodology holds, the risk of publishing a wrong-but-honest paper is lower than the reputational risk of publishing a crank.

  ---

  ### Application to Current Pitches

  #### Pitch 1: The Thera-Atlantis Naval Architect
  *   **Step 1 (Falsifiability):** Pass. The author argues from geological layers and tsunami deposits. These are falsifiable.
  *   **Step 2 (Scope):** Pass. Requires the Minoan civilization to be more widespread than thought, and Plato's account to be a garbled memory. Does *not* require radiocarbon dating or other civilizations' chronologies to be fake.
  *   **Step 3 (Engagement):** Pass. User notes author "answers objections directly."
  *   **Step 4 (Methodology):** Pass. Uses naval architecture and geology, standard fields.
  *   **Step 5 (Wegener Check):** The claim is "Atlantis was Thera." This is a known hypothesis (Marinatos, 1950s), though often overstated.
  *   **Result:** **(A) Live Minority View.**
  *   **Editorial Note:** I understand your instinct to file this as bunk. However, under this protocol, it is not *pseudohistory*. It is a speculative historical hypothesis that engages with evidence. The "Atlantis" label is the trigger for your bias, but the *method* is historical.
      *   *Recommendation:* Commission a paired piece. Run the author's argument alongside a response from a mainstream Bronze Age archaeologist. This satisfies the "minority view" criteria without endorsing the conclusion.

  #### Pitch 2: The Phantom Time Letter
  *   **Step 1 (Falsifiability):** **FAIL.** Claims carbon dating is "circular." This removes the primary method of falsification.
  *   **Step 2 (Scope):** **FAIL.** Requires dendrochronology, astronomy, Islamic history, Chinese history, and European archaeology to all be independently wrong about the same 300 years.
  *   **Result:** **(B) Pseudohistory.**
  *   **Action:** Reject with form letter, or if the letter is well-written, run as a "Mythbusters" sidebar under your signature explaining *why* the chronology holds (tree rings + eclipses + radiocarbon).

  #### Pitch 3: The Library of Alexandria Classicist
  *   **Step 1 (Falsifiability):** Pass.
  *   **Step 2 (Scope):** Pass. Concerns a single event/location.
  *   **Step 3 (Engagement):** Pass. Implicitly engages with the "Caesar fire" vs. "Arab conquest" debates.
  *   **Step 4 (Methodology):** Pass. Standard textual analysis.
  *   **Step 5 (Tone Check):** The author is condescending.
  *   **Result:** **(A) Live Minority View.**
  *   **Editorial Note:** The protocol terminates quickly here because the *history* is sound (the "destruction" is indeed largely legendary/gradual). The tone is an editorial problem, not a pseudohistory problem.
      *   *Action:* Accept the argument, but edit the tone. Do not reject sound history because the author is unpleasant.

  ---

  ### Limitations and Failure Modes

  You asked for explicit honesty about what this procedure cannot do.

  **1. The "Polite Crank" Problem (False Positive)**
  The protocol guards against this in **Step 3 (Engagement)** and **Step 1 (Falsifiability)**. A crank can be polite, but they rarely admit what would prove them wrong. However, a sophisticated crank *can* mimic the language of falsifiability.
  *   **Safeguard:** This is why **Step 5 (Undecidable)** exists. If the writing is polished and the logic holds internally, but your gut says "too smooth," send it to external review. Do not reject it yourself. The cost of a reviewer's fee is lower than the cost of publishing a fraud.

  **2. The "Wegener" Problem (False Negative)**
  Will this checklist kill the next paradigm-shifting theory?
  *   **Reality Check:** Yes, it might. Wegener's Continental Drift was initially rejected because he lacked a mechanism (violates **Step 4**). Pre-Clovis claims were rejected for decades because they violated the consensus (**Step 3**).
  *   **Where the Judgment Sits:** The protection against this is **not** in the checklist. It is in the **(D) Undecidable** bucket.
  *   **Procedure:** If a pitch passes Steps 1 and 2 (it is falsifiable and doesn't break physics) but fails Step 3 (the consensus hates it), you *must* choose (D). You cannot choose (B).
  *   **Who Decides:** You (Deputy Editor) decide when to send for review. The *Specialist Reviewer* decides if it is Wegener or Illig. You cannot make that call in 15 minutes. Acknowledge that you are not filtering for *truth*; you are filtering for *methodological integrity*.

  **3. The "Debunking" Policy Disagreement**
  Your staff argues that covering pseudohistory amplifies it. The procedure classifies the material; it does not decide publication strategy.
  *   **Where the Call Belongs:** This is an **Editor-in-Chief / Publisher** decision, based on audience data, not an editorial triage decision.
  *   **Recommendation:** Adopt a "Vaccination Model." If you classify as (B), you do not publish the claim *unless* you publish the rebuttal simultaneously.
      *   *Rule:* We never give a platform to a (B) claim without a sidebar or companion piece from a specialist explaining the error. This turns the risk of amplification into an educational opportunity. If you cannot secure the specialist rebuttal, you do not run the piece.

  ### Summary of Changes to Your Proposed Tests
  *   **Kept:** "Independent fields broken" (Step 2) and "Engage rebuttals" (Step 3). These are your strongest filters.
  *   **Modified:** "Conspiracy." I shifted this to **Step 3**. Alleging bias is common in academia; alleging *coordination* is the red flag.
  *   **Added:** "Falsifiability" (Step 1). This is the demarcation line between history and mythology. If they won't define how they could be wrong, they aren't doing history.
  *   **Added:** "Undecidable" (Step 5). This is your safety valve against the "Wegener" fear. It acknowledges that the checklist is a triage tool, not a truth machine.

  This procedure will not make you an ancient historian. It will make you a consistent gatekeeper who knows when to call one in.
