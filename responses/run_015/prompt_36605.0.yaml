  *Verdict:* Keep, but refine. Academics *do* sometimes collude or gatekeep. The test isn't "alleges bias," it's "alleges *coordinated fabrication* without evidence."
  *Test:* "Independent fields broken."
  *Verdict:* Keep. This is the strongest scientific filter.
