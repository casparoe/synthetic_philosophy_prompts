answer: |-
  The phrase "revolutions devour their own children" is a historiographical shibboleth. It is rhetorically potent but analytically porous. To use it in an argument about structural destiny versus contingency, you must dissect it, because it conflates mechanism, motive, and narrative.

  Here is the disambiguation of the slogan into five distinct theses, categorized by their epistemological status, followed by their mapping onto historiographical frameworks, the diagnosis of the "smuggled" premise, and the evaluation of a conceptual distinction.

  ### I. Disambiguating the Theses

  **1. The Thesis of Factional Escalation (The Purity Spiral)**
  *   **Claim:** Under conditions of radical uncertainty, revolutionary coalitions fracture. To maintain legitimacy, factions must outbid one another in radicalism, leading to the elimination of the "moderate" wing, followed by the cannibalization of the radical wing itself.
  *   **Classification:** **General Law of Revolutionary Politics.** (It claims a trans-historical pattern observable in 1789, 1917, 1979, etc., though not without exceptions).
  *   **Mechanism:** Political competition + Legitimacy deficits.

  **2. The Thesis of Institutional Auto-Coercion**
  *   **Claim:** Revolutionary governments, born in crisis (war, famine), create emergency institutions (e.g., Committee of Public Safety). These institutions require the suspension of law to function, which eventually turns against the creators of the institutions because *no one* is safe from the suspension of law.
  *   **Classification:** **Substantive Empirical Claim.** (Specific to the institutional architecture of 1789–1794, though applicable to other emergency regimes).
  *   **Mechanism:** Institutional logic + State capacity.

  **3. The Thesis of Sociological Exhaustion**
  *   **Claim:** The social base that powers the revolution (e.g., the *sans-culottes* or petty bourgeoisie) is economically exhausted or politically alienated by the very measures (price controls, conscription) meant to defend the revolution. The leadership loses its footing and turns inward.
  *   **Classification:** **Substantive Empirical Claim (Class-Struggle Specific).**
  *   **Mechanism:** Material conditions + Class alignment.

  **4. The Thesis of Psychological Burnout**
  *   **Claim:** Revolutionary fervor is an emotional state that cannot be sustained. As adrenaline fades, it converts into paranoia and exhaustion, leading leaders to project internal enemies where none exist.
  *   **Classification:** **False Metaphor / Trivial Platitude.** (It anthropomorphizes a complex political movement as a single psychological subject; it is unfalsifiable and ignores rational strategic calculation).

  **5. The Thesis of Narrative Teleology**
  *   **Claim:** The "devouring" is not a fact of the event but a pattern imposed by historians to give the Revolution a tragic arc (Rise → Hubris → Fall). It organizes chaotic deaths into a moral story.
  *   **Classification:** **Historiographical Critique.** (A claim about how we write history, not what happened).

  ---

  ### II. Mapping to Historiographical Frameworks

  To determine if 1789 was *structurally destined* to turn violent, you must see which thesis your framework relies upon.

  **1. The Class-Struggle Account (e.g., Soboul, Mathiez)**
  *   **Relies on:** **Thesis 3 (Sociological Exhaustion).**
  *   **Explanatory Work:** The Terror was not "devouring" in a moral sense, but a reflection of the bourgeoisie consolidating power. The "children" (Hébertists/*sans-culottes*) were discarded because their economic demands threatened bourgeois property rights.
  *   **Verdict on Destiny:** Violence was **not destined** by revolution itself, but by the specific antagonism between bourgeois and popular classes. Thermidor was a counter-revolution within the revolution, not an inevitable suicide.

  **2. The Ideological Account (e.g., Furet)**
  *   **Relies on:** **Thesis 1 (Factional Escalation/Purity).**
  *   **Explanatory Work:** The discourse of "General Will" and "Virtue" allowed no opposition. To disagree was to be corrupt. Therefore, the logic of the ideology *required* the elimination of dissenters. Robespierre did not choose the Terror; the discourse chose it for him.
  *   **Verdict on Destiny:** Violence was **structurally destined** by the ideological DNA of 1789. The revolution *had* to devour its children because its language allowed no plurality.

  **3. The Contingency Account (e.g., Cobban, Doyle)**
  *   **Relies on:** **Thesis 2 (Institutional Auto-Coercion) interpreted as accidental.**
  *   **Explanatory Work:** The Terror was a panic response to foreign invasion and civil war, not an ideological or class imperative. Without the war, the institutions of coercion would not have been built. The "devouring" was an avoidable accident amplified by crisis.
  *   **Verdict on Destiny:** Violence was **contingent**. The slogan is a false retrojection; the revolution did not *need* to eat its children, it was forced to by circumstance.

  ---

  ### III. The Smuggled Reading

  When a commentator uses "revolutions devour their own children" to dismiss **all** revolutionary politics as inherently self-defeating, they are smuggling in **Thesis 1 (Factional Escalation)** combined with **Thesis 4 (Psychological Burnout)**, presenting them as a **General Law**.

  *   **The Move:** They take a specific historical observation (Jacobins killed Danton) and universalize it into an anthropological constant (Revolution = Madness/Death).
  *   **The Function:** This functions as a conservative closure. It suggests that the *act* of revolutionary rupture contains the seeds of its own tyranny, thereby vindicating reformism or order. It bypasses the need to analyze *which* revolution, *what* ideology, or *which* material conditions were present. It treats the French Revolution not as a historical event, but as a mythic warning.

  ---

  ### IV. A Conceptual Distinction: Institutional Auto-Immunity vs. Ideological Overreach

  To clarify whether you are describing a mechanism internal to revolutionary states or a retrospective storytelling pattern, I propose distinguishing between **Institutional Auto-Immunity** and **Ideological Overreach**.

  **1. Institutional Auto-Immunity**
  *   **Definition:** A structural process where the mechanisms created to protect the revolutionary body politic (tribunals, police, emergency decrees) lose their specificity and begin attacking the organs that created them.
  *   **Locus:** The State / Bureaucracy.
  *   **Implication for Destiny:** Suggests **High Destiny.** If emergency powers inherently lack off-switches, then any revolution facing existential threat will structurally tend toward self-cannibalization.

  **2. Ideological Overreach**
  *   **Definition:** A discursive process where the normative goals of the revolution (Virtue, Equality, Purity) become impossible to realize in the material world, leading leaders to blame "saboteurs" for the gap between ideal and real.
  *   **Locus:** The Culture / Discourse.
  *   **Implication for Destiny:** Suggests **Contingent Destiny.** This only happens if the specific ideology is totalizing. A revolution based on procedural liberalism might not suffer this, whereas one based on Rousseauian virtue will.

  **Defense of the Distinction:**
  This separates the *hardware* of the revolution (the Committee of Public Safety) from the *software* (the Cult of the Supreme Being). It allows you to argue that 1794 was not a generic "revolutionary" failure, but a specific failure of *Jacobin* software running on *War State* hardware.

  ---

  ### V. The Honest Audit: Does This Distinction Resolve Anything?

  **Honest Answer:** It clarifies the *site* of the problem, but it does not fully resolve the question of **inevitability**.

  **Why it helps:**
  It prevents you from conflating the *necessity of coercion* (Auto-Immunity) with the *necessity of purity* (Overreach). You can now argue that the Revolution might have survived the war (avoiding Auto-Immunity collapse) if it had adopted a less totalizing ideology (avoiding Overreach). This saves the "Contingency" argument from being dismissed by the "Ideological" argument.

  **Why it fails (The Renaming Problem):**
  In the specific case of 1789, the two are inextricably linked. The *Institutional* power of the Committee of Public Safety was legitimized *only* by the *Ideological* claim of Virtue. You cannot separate the hardware from the software.
  *   If you remove the Ideology, the Institution loses legitimacy.
  *   If you remove the Institution, the Ideology lacks enforcement.

  Therefore, distinguishing them is analytically useful for categorization, but it does not solve the causal knot. It tells you *how* the devouring happened (two parallel tracks), but not definitively *why* it had to happen. It ultimately reveals that "destiny" in the French Revolution is not a single track, but a braid of structural constraints and ideological choices that tightened together until they strangled the actors.

  **Recommendation for your argument:**
  Do not use the slogan "revolutions devour their own children" as a premise. Use it as the *object* of your analysis. Argue that the "devouring" was not a biological inevitability (Thesis 4), but a specific outcome of **Ideological Overreach** weaponized by **Institutional Auto-Immunity**. This allows you to concede that violence was highly probable under Jacobinism without conceding that *all* revolutionary rupture is inherently self-defeating.
