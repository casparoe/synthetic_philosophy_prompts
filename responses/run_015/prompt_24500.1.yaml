  *(Self-Correction on Goodhart Subtypes)*:
  *   Regressional: $Measure = Target + Noise$. High Measure implies High Target + High Noise.
  *   Extremal: Optimization pushes $Measure$ to tail, where $Noise$ dominates or relationship changes.
  *   Adversarial: Agent changes the generation process.
  *   Causal: $Measure \leftarrow Common Cause \rightarrow Target$. Optimizing Measure doesn't move Target.
