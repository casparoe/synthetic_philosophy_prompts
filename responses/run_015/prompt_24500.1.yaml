  ### 9. Addressing the Regressional vs. Extremal Distinction
  You asked if they are distinct. In this game, they are distinguishable by **variance source**.
  *   **Regressional:** Variance comes from *measurement noise* or *skill variance* in Round 1 (Honest effort, imperfect correlation).
  *   **Extremal:** Variance comes from *distributional shift* in Round 2 (Optimization pressure pushes data points off the original manifold).
  *   **Instruction:** In the debrief, plot the data on a scatter graph (X=Proxy, Y=Target). Round 1 is a cloud with a positive slope. Round 2 is a cluster at the far right (High Proxy) with low Y (Low Target). The *slope change* is Extremal. The *spread* in Round 1 is Regressional.

