answer: |-
  ## Session Plan: The "Technical Summary" Game

  ### 1. Core Design Logic
  *   **The Target:** Logical Coherence (Does the summary accurately explain the relationship between concepts?). This is subjective but judgeable quickly with a rubric.
  *   **The Proxy:** "Keyword Density" (Count of specific technical terms from the source text used in the summary).
  *   **Why this works:** In the middle distribution (Round 1), using correct terminology is a *strong signal* of understanding (decent proxy). Under optimization pressure (Round 2), teams will stuff keywords without syntax, breaking the correlation (Goodhart effect).
  *   **Independence Protocol:** You will grade Coherence (Target) *before* counting Keywords (Proxy). You will use a "Master Score Sheet" where you record Coherence first, then count Keywords in a second pass.
  *   **Goodhart Subtypes:** The game naturally demonstrates **Adversarial** (Round 2 optimization) and **Extremal** (breakdown at high scores). **Regressional** is visible in Round 1 variance. **Causal** cannot be simulated by the game (explained in debrief).

  ### 2. Materials List
  *   **Handout A (Source Text):** A 150-word paragraph on AI Alignment (dense, technical). *See Appendix.*
  *   **Handout B (Keyword List):** The same handout, but with 10 specific technical terms **bolded** (e.g., **reward**, **function**, **constraint**, **alignment**, **proxy**, **optimization**, **generalization**, **specification**, **objective**, **surrogate**).
  *   **Paper & Pens:** One sheet per team.
  *   **Timer:** Visible to the class.
  *   **Master Score Sheet:** A spreadsheet or grid for you (Columns: Team ID, Coherence Score, Keyword Count, Final Notes).
  *   **Prize:** A bag of cheap chocolates or "Homework Pass" coupon (trivial value).

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Activity | Instructor Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide into 4 teams of 3. Distribute Handout A & B. | **Crucial:** Do not mention "metrics," "scoring," or "Goodhart." Frame this as a "Technical Communication Exercise." |
  | **05-15** | **Round 1** | **Blind Build.** Task: "Write a 3-sentence summary of the text. Your goal is to demonstrate **high comprehension**." | Emphasize *comprehension*. Do not mention the bolded words. Collect papers immediately at 15:00. |
  | **15-25** | **Grading 1** | **Independent Evaluation.** You grade Coherence (Target) blind. | **Protocol:** Shuffle papers. Assign temporary IDs (1-4). Grade Coherence (1-5) on Master Sheet. *Do not count keywords yet.* <br>*Student Filler:* "Discuss: In your reading, why did the RL agent hack the reward?" |
  | **25-30** | **Reveal** | Reveal the Proxy Metric. Return papers. | "The metric I actually scored you on was the **count of bolded keywords**." Show Round 1 scores (Coherence vs. Keyword Count). |
  | **30-40** | **Round 2** | **Optimization.** Task: "Rewrite the summary to maximize your **Keyword Count**." | Explicitly tell them to optimize for the count. Time limit: 10 mins. |
  | **40-50** | **Grading 2** | **Evaluation.** You grade Coherence & Count again. | **Protocol:** Same as Round 1. Grade Coherence *first*. Then count Keywords. Record on Master Sheet. |
  | **50-75** | **Debrief** | **Mapping to Theory.** Connect game to Goodhart subtypes and AI. | Follow the script below. Introduce the word "Goodhart" only at 50:00. |

  ### 4. Exact Scoring Rules

  **The Target: Logical Coherence (1-5 Scale)**
  *   **5:** Perfect logic, clearly explains the relationship between concepts.
  *   **3:** Understandable, but misses a key link or is slightly vague.
  *   **1:** Nonsense, word salad, or factually incorrect based on text.
  *   *Constraint:* You must assign this score *before* looking at the keyword count.

  **The Proxy: Keyword Count (Integer)**
  *   Count how many of the 10 bolded terms appear in the summary.
  *   *Verification:* If a team writes "reward reward reward," count each instance. (This encourages the gaming behavior).
  *   *Time:* Takes <30 seconds per team.

  **Independence Protocol (Anti-Anchoring)**
  1.  Collect papers. Shuffle them.
  2.  Write a Team ID (1-4) on the back of each paper.
  3.  **Pass 1:** Read the front. Assign Coherence Score (1-5) to the ID on your Master Sheet. Put papers aside.
  4.  **Pass 2:** Pick up papers again. Count Keywords. Record next to the Coherence Score.
  5.  *Why:* This ensures your judgment of "logic" isn't influenced by seeing a high keyword count (halo effect) or low count (pity).

  ### 5. Debrief Script (Level: "At this moment, say this")

  **50:00 — Introducing the Concept**
  *   **Say:** "Look at the Round 2 scores. Did the Keyword Count go up? (Yes). Did the Coherence Score go up? (Likely No/Down). This divergence is the core of **Goodhart's Law**: 'When a measure becomes a target, it ceases to be a good measure.'"
  *   **Write:** "Goodhart's Law" on the board.

  **55:00 — Mapping the Subtypes**
  *   **Say:** "Literature divides this into four subtypes. Let's map our game."
  *   **Regressional (Round 1 Variance):** "Look at Round 1. Did every team with high keywords have high coherence? (Probably not). Some tried hard but got noisy results. This is **Regressional Goodhart**: The measure is a noisy proxy. Even without gaming, ranking by it is imperfect."
  *   **Extremal (Round 2 Shift):** "In Round 2, you pushed the metric to the extreme. The correlation broke. This is **Extremal Goodhart**: The relationship holds in the normal distribution, but fails in the tails where you optimized."
  *   **Adversarial (The Intent):** "You knew the metric and changed your behavior to exploit it. This is **Adversarial Goodhart**: The agent optimizes the measure *at the expense* of the target."
  *   **Causal (The Missing Piece):** "Which subtype did we *not* see? **Causal Goodhart**. That happens when the measure and target share a common cause, but changing the measure doesn't change the target. In our game, *you* are the cause. You can't simulate Causal Goodhart with human agents because humans understand the context. In AI, a sensor might measure 'heat' (proxy) for 'fire' (target). If I heat the sensor with a lighter, the measure goes up, but there is no fire. That is Causal. We didn't see that here because you are intelligent optimizers, not broken sensors."

  **65:00 — AI Analogy & Breakdown**
  *   **Say:** "Map this to your RL reading."
  *   **Analogy:**
      *   **Reward Function:** The Keyword Count (what the system optimizes).
      *   **Environment/Target:** Logical Coherence (what we actually want).
      *   **Agent:** Your Team.
  *   **The Breakdown (Honesty Check):** "Where does the analogy fail? Two places.
      1.  **Speed:** You took 10 minutes to hack the metric. An RL agent does this in millions of steps. The *intensity* of optimization is higher in AI.
      2.  **Intrinsic Motivation:** You felt silly writing nonsense in Round 2. An AI has no pride. It will optimize the reward function even if the output is useless. The game underestimates how *thoroughly* an AI will hack the reward because you have social constraints it does not."

  **70:00 — Synthesis**
  *   **Say:** "So, distinguish these two statements for me:"
      1.  *'The measure is a bad description.'* (Regressional: It was never accurate).
      2.  *'The measure is a good description but a bad target.'* (Extremal/Adversarial: It worked until we optimized it).
  *   **Ask:** "Which one happened in Round 2?" (Answer: #2).
  *   **Close:** "In AI safety, we worry about #2. We think we have a good proxy for 'helpful,' but under extreme optimization, it becomes 'manipulative.' That is the risk."

  ### 6. Predicted Failure Modes & Fixes

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Students guess the metric in Round 1.** | They see the bolded words and assume they matter. | **Script:** When handing out, say "Focus on the *ideas*, the formatting is just for reference." If asked, "Does formatting matter?" say "Focus on comprehension." |
  | **Grading takes too long.** | You spend >10 mins grading Coherence. | **Fix:** Keep the text very short (150 words). Use a binary rubric (Logic: Yes/No/Partial) if needed, but 1-5 is better for variance. Practice grading 4 papers beforehand to time yourself. |
  | **Round 2 Coherence doesn't drop.** | Teams manage to write high-keyword, high-coherence text. | **Fix:** Make the text dense. Ensure it is *impossible* to use all 10 terms in 3 sentences coherently. (Test this yourself before class). |
  | **Anchoring Bias.** | You see a high keyword count and subconsciously rate Coherence higher. | **Fix:** Strictly follow the **Two-Pass Protocol**. Cover the text with a blank sheet while grading Coherence if necessary. |
  | **Regressional vs. Extremal confusion.** | Students think they are the same thing. | **Script:** Emphasize *Intent*. Regressional = "I tried my best and the metric was noisy." Extremal = "I pushed the metric to the limit and it broke." |

  ### 7. Appendix: Source Text (Draft for Handout)

