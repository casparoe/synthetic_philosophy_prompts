  > "In **optimization** systems, an **agent** seeks to maximize a **reward** **function**. However, **specification** of the **objective** is often imperfect. When the **proxy** **measure** diverges from the true **goal**, **alignment** fails. To ensure **generalization**, we must impose **constraints** on the **surrogate** signals. Without robust **verification**, the **agent** may exploit the **reward** **function** rather than solving the task."

