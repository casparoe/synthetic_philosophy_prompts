answer: |-
  This is a classic problem in the philosophy of collective intentionality. Your intuitions track a tension that divides the literature between **interpersonal accounts** (e.g., Bratman, Gilbert) and **institutional accounts** (e.g., List, Pettit, Searle).

  To accommodate the largest coherent subset of your judgments without collapsing into vagueness, I propose we adopt a **Two-Tier Principle of Collective Agency**. This approach suggests that "joint action" is not a unified phenomenon but a family resemblance concept covering two distinct relations: **Interpersonal Joint Action** and **Institutional Group Agency**.

  However, if forced to choose a *single* principle for "genuine joint action" (prioritizing the interpersonal cases like the Piano and Rescue), the best candidate is **The Principle of Interlocking Commitment**.

  ### The Principle of Interlocking Commitment

  **Definition:** A group engages in joint action if and only if:
  1.  **Interdependence:** Each participant's successful contribution causally depends on the contributions of others (not merely on the outcome).
  2.  **Mutual Recognition:** Each participant regards the others as agents whose intentions matter, rather than as environmental fixed points or tools.
  3.  **Meshing Sub-Plans:** Participants intend the joint outcome *in part because* they believe others intend it, allowing their individual plans to adjust to one another.

  #### 1. Motivation by Case
  *   **Clause 1 (Interdependence):** Motivated by the **Rescue Chain** vs. **Emergency Callers**. In the Rescue, if I let go, the chain fails; my action is functionally dependent on yours. In the Callers, my call succeeds regardless of yours. This clause also excludes the **Research Consortium**, where scientists contribute data modules that are aggregative, not interlocking (my data upload does not causally depend on your upload in real-time).
  *   **Clause 2 (Mutual Recognition):** Motivated by the **Deceived Cooks**. The deceived cook treats the other as a tool for a solo competition, violating the requirement that partners be regarded as co-authors. This preserves your intuition that the cooks are *not* acting jointly despite physical coordination.
  *   **Clause 3 (Meshing Sub-Plans):** Motivated by the **Piano Movers**. They adjust grip in real-time. This distinguishes joint action from parallel action where goals align but plans do not mesh.

  #### 2. Predictions for Further Situations
  *   **The Flash Mob:**
      *   *Prediction:* If participants merely execute a script downloaded from social media without monitoring or adjusting to one another during the performance, this is **not joint action** (it is coordinated individual behavior, like the Consortium). If they adjust timing/positioning based on neighbors to maintain the formation, it **is joint action**.
  *   **The Surgical Team (Lead Replaced):**
      *   *Prediction:* Joint action persists *if* the incoming surgeon steps into the existing "mesh" of intentions and the team adjusts to them. If the incoming surgeon imposes a new plan without mutual adjustment, the joint action is broken and re-established. The continuity of the *patient's welfare* is not enough; the continuity of *interlocking intention* is required.

  #### 3. Honest Limitations (The Cost)
  This principle **cannot accommodate the Corporate Board verdict** as a case of *interpersonal joint action*.
  *   **Why:** In the rotating board, individual members do not necessarily have interlocking sub-plans with *each other*. They have interlocking relations with the *role* or the *charter*. Member A may vote based on reasoning Member B never sees. They are not mutually responsive in the thick sense; they are procedurally bound.
  *   **The Sacrifice:** To save the **Rescue Chain** (which requires real-time interdependence and mutual recognition), you must classify the **Board** as something else. If you insist the Board is "joint action" in the *same sense* as the Rescue Chain, you must weaken Clause 1 and 3 so much that the **Research Consortium** slips in (which you want to exclude).

  ---

  ### The Alternative: The Principle of Institutional Commitment

  If you prioritize the **Board** and **Consortium** verdicts, you must adopt an institutional account.

  **Definition:** A group acts jointly if members accept a decision procedure or protocol that binds their contributions to a collective outcome, regardless of interpersonal awareness.

  *   **Motivation:** Saves the **Board** (acceptance of voting procedure) and potentially the **Consortium** (signing the protocol).
  *   **Cost:** This **excludes the Rescue Chain**. Strangers in a chain do not accept a procedure or protocol; they react to immediate need. Under this principle, the Rescue Chain is merely aggregate individual behavior (like the Callers), which contradicts your intuition that they are partners.
  *   **Verdict:** This principle fails your specific constraint to keep the Rescue Chain while excluding the Consortium.

  ---

  ### Synthesis: The Family Resemblance Solution

  The tension you are experiencing arises because you are trying to apply a single definition to two distinct phenomena. The most coherent account that saves *all* your intuitions is to acknowledge that **Collective Intentionality is a Family of Distinct Relations.**

  We should distinguish:
  1.  **Shared Intention (Interpersonal):** Applies to Piano, Rescue, Cooks. Requires Interlocking Commitment.
  2.  **Group Agency (Institutional):** Applies to Board, Corporation. Requires Acceptance of Procedure.

  **Re-evaluating your Verdicts under the Two-Tier Model:**

  *   **Piano & Rescue:** Both are **Shared Intention**. The Rescue Chain qualifies because "Meshing Sub-Plans" can occur spontaneously in real-time without prior agreement. The "Shared Representation" need not be conceptual; it can be perceptual (seeing the swimmer and the chain).
  *   **Cooks:** Fails **Shared Intention** (lack of Mutual Recognition).
  *   **Callers:** Fails **Shared Intention** (lack of Interdependence).
  *   **Consortium:** Fails **Shared Intention** (lack of Interdependence/Meshing). It *might* qualify as a weak **Group Agency**, but if the scientists don't identify with the group, it's merely an aggregation. Your intuition that it is "mere coordination" suggests it fails even the institutional test of *collective identification*.
  *   **Board:** This is **Group Agency**, not Shared Intention. The *corporation* acts jointly, but the *board members* are functioning as organs of the corporate body. Your intuition that "the corporation itself acts jointly" is precise: the agent is the corporation, not the collection of humans.

  ### Conclusion: Unity vs. Family

  To answer your specific question: **Yes, the cost of saving the Rescue-Chain verdict is abandoning the Board-Rotation verdict *as a case of the same phenomenon*.**

  If you demand a unified theory of "Joint Action" that covers both the Rescue Chain and the Board, you will inevitably fail to exclude the Research Consortium. The Consortium shares the Board's institutional features (protocols) but lacks the Rescue Chain's interdependence.
  *   If you prioritize **Interdependence** (to save Rescue/exclude Consortium), you lose the Board.
  *   If you prioritize **Protocol** (to save Board/Consortium), you lose the Rescue.

  **Recommendation:**
  Adopt the **Family Resemblance** view. State that "Joint Action" properly refers to **Interpersonal Shared Intention** (Piano, Rescue). Classify the Board under **Group Agency**.
  *   **Why this helps:** It explains *why* the Board feels different from the Rescue Chain. In the Rescue, I am connected to *you*. In the Board, I am connected to the *Office*.
  *   **Final Verdict on your Framework:** Your proposed framework was close but stumbled on "Shared Representation."
      *   *Correction:* Replace "Shared Representation" with **"Interlocking Intention."**
      *   *Correction:* Replace "Co-authors" with **"Mutual Recognition of Agency."**
      *   *Add:* A clause distinguishing **Aggregative Interdependence** (Consortium: we both help the goal) from **Constitutive Interdependence** (Rescue/Piano: my action *is part of* our action).

  This tells us that collective intentionality is **not a unified phenomenon**. It is a spectrum ranging from spontaneous interpersonal meshing (Rescue) to structured institutional function (Board). Treating them as the same category creates the paradoxes you are facing.
