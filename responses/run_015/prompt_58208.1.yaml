answer: |-
  This is a classic "civic tech" trap: the code is the easy part, the sociology is the hard part. With ~192 hours of dev time, you cannot build a platform that solves *all* the political problems. You have to build the minimum viable *trust* machine.

  If I were you, I would ignore the philosophy readings and focus entirely on the **mechanics of legitimacy**. If the participants or the city don't trust the mechanism, the code doesn't matter.

  Here are the three questions that deserve your dev time, in order of upstream dependency.

  ### 1. How do I make the sortition algorithm cryptographically verifiable by a skeptic?
  **The Upstream Legitimacy Anchor**

  *   **Why this is first:** This is your Single Point of Failure. If a city council member or a cynical resident claims the "random" selection was rigged to favor a certain demographic or neighborhood, your project dies instantly. Since you are a backend engineer, this is where you add the most value. Do not use `Math.random()`.
  *   **The Tradeoff:** You are trading **implementation complexity** for **public trust**. A simple script is easier to write but impossible to audit. A commit-reveal scheme (where you publish a hash of the seed before the draw, and reveal the seed after) allows anyone to verify the draw wasn't manipulated retroactively.
  *   **Dev Implication:** Spend your first 20 hours building the "Draw Engine" as a standalone, open-source CLI tool. It should take a public list of IDs (hashed for privacy) and a public entropy source (e.g., a future block hash or lottery number) and output the selected cohort.
  *   **Why not recruitment first?** You can recruit people manually via phone or mail for a pilot. You cannot manually convince people a black-box algorithm is fair.

  ### 2. What is the minimum workflow required to prevent "loud voice" domination in asynchronous text?
  **The Midstream Quality Anchor**

  *   **Why this is second:** Sortition fails when the panel devolves into a standard meeting where the most articulate or aggressive participants dominate. This introduces *participation bias*, ruining the statistical representativeness you fought for in Question #1. If 50 people are drafted but only 5 drive the conversation, you haven't built a lottocracy; you've built a focus group.
  *   **The Tradeoff:** You are trading **user freedom** for **decision quality**. A standard chat room (Slack/Discord) is easy to build/integrate but leads to capture by the loudest voices. A structured workflow (e.g., blind brainstorming phases, forced turn-taking, quadratic voting on agenda items) requires custom dev work but protects the quiet majority.
  *   **Dev Implication:** Do not build a generic forum. Build a "state machine" for deliberation. Week 1: Read only. Week 2: Submit proposals anonymously. Week 3: Comment on proposals. Week 4: Vote. Your code should enforce these phases. This is where you prevent lobbyist/captain capture without needing a moderator.
  *   **Why not output first?** If the deliberation is captured by a few voices, the output is garbage. Garbage in, garbage out.

  ### 3. How do I format the output so a city clerk can ingest it without new legislation?
  **The Downstream Impact Anchor**

  *   **Why this is third:** You mentioned auditing 311 dispatch or deciding a budget pot. The city bureaucracy has rigid input slots. If your tool outputs a GitHub repo or a pretty dashboard, the City Clerk will ignore it. If it outputs a PDF resolution formatted exactly like their existing council packets, or a CSV that matches their 311 vendor schema, it has a chance of being actioned.
  *   **The Tradeoff:** You are trading **platform flexibility** for **bureaucratic compatibility**. You are essentially building an adapter layer for the city's legacy systems.
  *   **Dev Implication:** Before writing a single line of UI, find out what format the city accepts for budget amendments or audit reports. Hardcode your export functions to match that schema.
  *   **Why not identity verification?** Don't build ID verification. It's a legal minefield (CCPA/GDPR) and a time sink. For a pilot, use an honor system + manual spot checks (e.g., "reply with a redacted utility bill"). Don't spend dev hours on this; spend *operator* hours.

  ---

  ### What would make me flip this ranking?

  1.  **If the City demands specific ID verification APIs:** If you get a meeting with the City Clerk and they say, "We will only look at this if you verify residency via [Specific Vendor]," then **Identity/Verification** jumps to #1. Without it, the rest is academic.
  2.  **If the "Stipend" reality hits:** You mentioned $2k for hosting and pizza. If you can't pay stipends, your recruitment will skew heavily toward retirees or the unemployed. If you realize you can't get 30 people without paying them $200 each, you must pivot to a smaller panel (e.g., 10 people). This changes the **Deliberation Workflow** (#2) because 10 people can use Zoom; 50 need async tooling.
  3.  **If you find a "Champion":** If a City Council member agrees to formally introduce your panel's output as a motion, **Output Interoperability** (#3) becomes #1. The technical bar for trust lowers because the political cover is already provided.

  ### A Warning on "Building It"
  You are a backend engineer. Your instinct will be to optimize the database schema and the API latency. **Resist this.**
  *   **The hard part is not the code; it is the phone calls.** You will spend 100 hours calling people who don't answer.
  *   **The hard part is not the algorithm; it is the privacy.** Storing PII (Personally Identifiable Information) of residents makes you a target. Minimize data retention. Delete everything after the term ends.
  *   **The hard part is not the voting; it is the agenda.** Who decides what the panel votes on? If the City Staff sets the agenda, they capture the panel. If the Panel sets the agenda, they might pick something illegal. You need to code a constraint here (e.g., "Select from these 3 pre-vetted topics").

  **Summary:** Build a verifiable lottery machine, wrap it in a workflow that forces quiet people to speak, and export the result in a format a bored city clerk can file immediately. Everything else is scope creep.
