          *   *Legal/Ethical:* Eyewitness testimony. If belief changes *perception*, memory is unreliable at the source. If it changes *judgment*, it's a bias issue.
          *   *Mental Health:* Paranoia vs. hypervigilance.

      *   **The "Creepy Neighbor" Specifics:**
