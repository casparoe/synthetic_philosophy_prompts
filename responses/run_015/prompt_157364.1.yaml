prompt: |-
  I'm presenting a colloquium paper next Thursday defending what I call frame-sensitive particularism: the claim that moral reasons are not merely variable in weight across contexts, as standard particularists hold, but that the very identity of a feature as a reason depends on an irreducibly situational relational framing. On this view, the same feature—say, withholding information—can operate as a reason for condemnation in one interactional frame and as a reason for praise in another, and this reversal is not recoverable from any general principle, nor from Dancy-style pluralism about reasons. I ground the view in a model of salience calibration drawn from perceptual psychology but applied to moral attention: agents do not apply rules to determine what matters; rather, they attune to a gestalt comprising their emotional posture, the narrative arc of the interaction, and the perceived vulnerability of the other party. This means particularism is not just about the absence of principles but about the positive dynamics of moral attention. The audience is a philosophy department colloquium consisting of a Rossian pluralist who accepts pro tanto reasons but insists on stable ordering relations, a Kantian constructivist who thinks any rejection of universalizability collapses into arbitrariness, a virtue ethicist convinced that particularism is indistinguishable from unprincipled intuitionism, and a visiting moral psychologist working in moral foundations theory who will press me on whether cross-cultural consistency in moral judgment undermines any view that makes reasons this context-dependent. I need a Q&A prep sheet: the objections they will actually raise, in roughly the order they will come, phrased as each of them would phrase them, with for each whether I should concede ground, hold firm, and where my reply is weakest. Include the one reply that must land for the view to survive the session, the weakest point in my own position that I should prepare to defend rather than hope they miss, and specifically the question I'm hoping the moral psychologist doesn't ask. Throughout, say what would change your mind about the strength of these objections—whether an empirical result, a conceptual distinction, or a counterexample—and identify where your reasoning about the audience's reactions is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Frame-Sensitive Particularism (FSP).
      *   **Core Claim:** Moral reasons' *identity* (not just weight) depends on irreducibly situational relational framing (e.g., withholding info can be condemnation or praise based on frame). Not recoverable from general principles or Dancy-style pluralism.
      *   **Grounding:** Salience calibration model from perceptual psychology applied to moral attention (gestalt: emotional posture, narrative arc, vulnerability).
      *   **Audience:**
          1.  Rossian Pluralist (pro tanto reasons, stable ordering).
          2.  Kantian Constructivist (universalizability required, rejects arbitrariness).
          3.  Virtue Ethicist (suspects particularism = unprincipled intuitionism).
          4.  Moral Psychologist (Moral Foundations Theory, cross-cultural consistency).
      *   **Deliverables:** Q&A prep sheet with objections (phrased as they would), strategy (concede/hold), weakest reply, the "must land" reply, the weakest point in the position, the "hope they don't ask" question, conditions for changing mind on objections, and meta-reflection on reasoning about audience.

  2.  **Deconstruct the Position (Frame-Sensitive Particularism):**
      *   *Strengths:* Explains moral nuance, aligns with phenomenology of moral experience, integrates psychology.
      *   *Weaknesses:* Risk of relativism/arbitrariness, difficulty in accountability/justification (how do I explain *why* this frame applies?), potential conflict with cross-cultural data.
      *   *Key Distinction:* It's not just holism (Dancy); it's about the *framing* determining the *valence/identity* of the reason itself via attentional salience.

  3.  **Drafting the Objections (Audience Personas):**

      *   **Rossian Pluralist:** Focuses on stability. If "withholding info" can be good or bad, how do we deliberate? We need *pro tanto* duties to weigh.
          *   *Objection:* "You've made deliberation impossible. If the identity of the reason shifts, I can't weigh it against others."
          *   *Strategy:* Hold firm on identity shift, concede need for deliberative stability but locate it in frame-selection, not rule-application.

      *   **Kantian Constructivist:** Focuses on universalizability and arbitrariness. If frames are situational, isn't this just whim?
          *   *Objection:* "Without universalizability, you have no defense against bias. Your 'frame' is just a pretext for partiality."
          *   *Strategy:* Hold firm. Universalizability applies to the *capacity* for attunement, not the output.

      *   **Virtue Ethicist:** Focuses on character vs. intuition. Isn't this just "I know it when I see it"?
          *   *Objection:* "This sounds like intuitionism dressed up in psychological jargon. Where is the *phronesis*? How do you train this?"
          *   *Strategy:* Concede similarity to virtue ethics (ally), but distinguish the mechanism (attentional gestalt vs. character trait).

      *   **Moral Psychologist:** Focuses on empirical data (MFT). If foundations are universal, how can reasons be this fluid?
          *   *Objection:* "MFT shows consistent foundations across cultures. Your radical context-dependence contradicts the data."
          *   *Strategy:* Hold firm. Foundations are *capacities*, frames are *activations*.

  4.  **Identifying Critical Elements:**
      *   **The "Must Land" Reply:** Needs to address the charge of arbitrariness (Kantian) while preserving the particularism. The link between *vulnerability* and *normativity*.
      *   **The Weakest Point:** The "Frame Selection Problem." How do we justify *which* frame is correct without appealing to a principle?
      *   **The "Hope They Don't Ask" Question:** Something that exposes the lack of normative criteria for frame selection (e.g., "What makes a frame *correct*?").
      *   **Meta-Reflection:** Where might I be wrong about the audience? (e.g., underestimating the Virtue Ethicist's sympathy or the Psychologist's constructivism).

  5.  **Fleshing out the Content (Iterative refinement):**

      *   *Refining the Rossian:* Make sure they talk about "weighing."
      *   *Refining the Kantian:* Use terms like "law," "maxim," "arbitrariness."
      *   *Refining the Virtue Ethicist:* Use "phronesis," "habituation."
      *   *Refining the Psychologist:* Use "WEIRD samples," "foundations," "invariance."

      *   *The "Must Land" Reply:* It needs to bridge the is-ought gap slightly. The "vulnerability" aspect is key. If I can show that the frame is dictated by the *other's* reality, not my whim, it survives.
      *   *The Weakest Point:* Definitely the criteria for correct framing. If I say "it's situational," they ask "but which situation counts?"
      *   *The "Hope They Don't Ask":* "If two agents attune differently to the same situation, who is right?" (The Inter-Subjective Validation Problem).

  6.  **Review against Constraints:**
      *   Did I include conditions for changing my mind? Yes.
      *   Did I identify where my reasoning about the audience might fail? Yes.
      *   Is the tone appropriate (academic, strategic)? Yes.

  7.  **Final Polish:** Check the flow and ensure the distinctions between Dancy-style holism and this "Frame-Sensitive" view are clear in the responses. (Self-Correction: Make sure I don't concede too much to the Virtue Ethicist, or the view collapses into Virtue Ethics).

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Frame-Sensitive Particularism
  **Colloquium Date:** Next Thursday
  **Project:** Defending Frame-Sensitive Particularism (FSP) against Principle-Based and Empirical Objections.

  ## 1. The Objections (In Expected Order)

  ### I. The Rossian Pluralist (The Deliberation Objection)
  **Phrasing:** "You claim the identity of a reason shifts with the frame. But deliberation requires stable units to weigh. If 'withholding information' is a *pro tanto* duty of fidelity in one frame and a *pro tanto* duty of care in another, I can calculate conflicts. If the feature itself changes valence based on your 'gestalt,' you have destroyed the possibility of moral calculation. How do you deliberate without stable *pro tanto* reasons?"

  *   **Strategy:** **Hold Firm.** Do not concede that deliberation requires stable *features*.
  *   **Reply:** Deliberation isn't weighing static bricks; it's calibrating the lens. We don't weigh 'withholding'; we weigh 'protecting vulnerability' vs. 'honoring autonomy.' The feature (withholding) is merely the physical substrate; the *reason* is the framed meaning.
  *   **Weakest Aspect of Reply:** It risks making deliberation opaque. If the "calibration" isn't rule-governed, how do I know I've calibrated correctly before acting?
  *   **What Would Change My Mind:** If they produce a case where *successful* deliberation clearly relied on feature-stability (e.g., legal reasoning or bioethics committees) where framing was successfully bracketed out.

  ### II. The Kantian Constructivist (The Arbitrariness Objection)
  **Phrasing:** "You replace the Categorical Imperative with 'attunement.' But attunement is subjective. If the identity of a reason depends on your emotional posture and narrative arc, you have collapsed normativity into psychology. What prevents a biased agent from framing a situation to justify prejudice? Without universalizability, your view is indistinguishable from whim."

  *   **Strategy:** **Hold Firm.** This is the crux of the defense.
  *   **Reply:** Universalizability applies to the *capacity* for moral attention, not the output of specific frames. The constraint isn't a law; it's the *reality of the other's vulnerability*. I cannot arbitrarily frame you as invulnerable if your distress is perceptually salient. The "check" is intersubjective reality, not a priori law.
  *   **Weakest Aspect of Reply:** It leans heavily on the reliability of "perceptual salience," which history shows is easily corrupted by ideology.
  *   **What Would Change My Mind:** A conceptual distinction showing that "vulnerability" itself is a construct that requires a prior principle to identify.

  ### III. The Virtue Ethicist (The Intuitionism Objection)
  **Phrasing:** "This sounds like *phronesis* without the character. You talk about 'gestalt' and 'attunement,' which is just intuitionism dressed in psychological clothing. If there are no principles, how do we teach this? How do we distinguish the expert moral agent from the confident sociopath who claims they are just 'attuned'?"

  *   **Strategy:** **Concede Ground (Tactical).** Acknowledge the overlap to secure an ally, then distinguish the mechanism.
  *   **Reply:** I agree that this is closer to virtue ethics than principlism. However, virtue ethics often reifies 'character' as a stable disposition. FSP suggests the *situation* constitutes the reason as much as the agent. It's not just 'who I am,' it's 'what this relationship demands right now.' It is less about habituation and more about perceptual flexibility.
  *   **Weakest Aspect of Reply:** Blurs the line too much. If it's too close to virtue ethics, why call it particularism?
  *   **What Would Change My Mind:** If they demonstrate that 'narrative arc' is actually a product of long-term character traits, making my view a subset of theirs.

  ### IV. The Moral Psychologist (The Empirical Objection)
  **Phrasing:** "Moral Foundations Theory suggests we have innate, cross-cultural modules (Care, Fairness, Loyalty, etc.). Your view suggests reasons are radically context-dependent. But if the foundations are consistent, isn't your 'framing' just a post-hoc rationalization of which foundation was triggered? You're claiming radical fluidity where the data shows structural invariance."

  *   **Strategy:** **Hold Firm.** Distinguish *foundations* from *reasons*.
  *   **Reply:** Foundations are the *palette*, not the *painting*. That we have a 'Care' foundation doesn't tell us whether withholding info triggers Care (protection) or violates Fairness (honesty). The foundation is the capacity; the frame determines which foundation becomes the operative reason.
  *   **Weakest Aspect of Reply:** If MFT shows that specific triggers for foundations are more hardwired than I admit.
  *   **What Would Change My Mind:** Empirical results showing that cross-cultural disagreement on specific cases is low (suggesting framing is universal) rather than high.

  ---

  ## 2. Critical Strategic Points

  ### The One Reply That Must Land
  **The "Vulnerability Constraint" Reply (Against the Kantian).**
  You must successfully argue that **salience is not optional.**
  *   *The Line:* "The frame is not chosen by the agent like a hat; it is forced upon the agent by the perceptual reality of the other's vulnerability. If I ignore that vulnerability, I am not 'using a different frame,' I am morally blind."
  *   *Why:* This prevents the view from collapsing into "anything goes." It grounds the normative force in the *object* of attention (the other person), not the *subject* (the agent's feeling). If this fails, you are left with subjectivism.

  ### The Weakest Point in Your Position (Prepare to Defend)
  **The Frame-Selection Problem.**
  *   *The Vulnerability:* You claim the frame is determined by the "narrative arc" and "emotional posture." But situations often support multiple valid narratives.
  *   *The Attack:* "In a tense negotiation, I can frame this as 'War' (where deception is praise) or 'Community' (where deception is condemnation). Both narratives fit the facts. What makes one *correct*?"
  *   *Defense Prep:* You must argue that one frame will always better capture the *totality* of the vulnerability involved. The "War" frame ignores the long-term relational vulnerability. You need to argue for a **holistic accuracy** condition on frames.

  ### The Question You Hope the Moral Psychologist Doesn't Ask
  **"The WEIRD Salience Question."**
  *   *The Question:* "Your model of 'salience calibration' relies on perceptual psychology. But attentional patterns are culturally learned. If a collectivist culture attends to relational harmony and an individualist culture attends to autonomy, and they perceive the *same* act of withholding information differently, is one frame objectively better? Or is your 'vulnerability' just a Western construct?"
  *   *Why:* This threatens to turn your "irreducibly situational" claim into "irreducibly cultural," which undermines the normative claim. It forces you to either admit relativism or posit a universal metric of vulnerability you haven't defined.

  ---

  ## 3. Meta-Reflection on Audience Analysis

  ### Where My Reasoning About the Audience Is Most Likely to Fail
  **Underestimating the Virtue Ethicist's Sympathy.**
  *   *Risk:* I am preparing to defend against them as if they are opponents. They may actually be my strongest allies. If I fight too hard to distinguish FSP from Virtue Ethics, I may alienate a natural supporter.
  *   *Correction:* Be prepared to pivot. If they soften, offer FSP as a *mechanism* for Virtue Ethics (explaining *how* phronesis works perceptually) rather than a rival theory.

  **Overestimating the Kantian's Rigidity.**
  *   *Risk:* I assume the Kantian will reject non-universalizable reasons entirely. However, contemporary Kantians (e.g., Onora O'Neill) often focus on "followability" rather than strict universalizability.
  *   *Correction:* If they pivot to "public justifiability," be ready to argue that frames *are* publicly justifiable via shared narrative understanding, even if not via universal law.

  ### Conditions for Changing My Mind on Objection Strength
  1.  **Empirical:** If the Moral Psychologist presents data showing that "moral framing" is consistent across 90% of contexts (suggesting principles exist), I must concede that FSP applies only to *hard cases*, not all morality.
  2.  **Conceptual:** If the Rossian can show a case where *ignoring* the frame (treating the feature as stable) leads to a *better* moral outcome than attuning to the frame, my claim that identity *depends* on the frame is falsified.
  3.  **Phenomenological:** If the audience collectively reports that their moral experience *feels* like applying rules rather than calibrating attention, my grounding in "moral attention" loses its phenomenological footing.

  ### Final Note on Tone
  Do not sound like you are dissolving morality into psychology. You are **naturalizing normativity**, not eliminating it. Keep the focus on the *normative force of the situation*, not just the *psychology of the agent*. The frame is in the world, not just in the head.
