      *Wait, one more check:* "Level A explains or constitutes level B, yet B simultaneously explains or constitutes A."
      *Board (A) constitutes Ethics Officer (B) via appointment.*
      *Ethics Officer (B) constitutes Board (A) via validation of standing.*
