  ### A Fourth Case: The Collapsing Bridge
  To separate the survivors more cleanly, specifically to test the **Redirect** hypothesis against the **Means** hypothesis without the confounding factor of "New Threats" being obviously lethal objects, try this:

  **The Case:** A trolley is heading toward five people on a track that runs along a ridge. You can detonate explosives to collapse the ridge, burying the track and stopping the trolley. A worker is standing on the ridge. The collapse will kill him. His body does *not* stop the trolley (the dirt does); he is merely collateral damage of the collapse. However, the collapse is a **new threat** (falling earth) triggered to stop an **existing threat** (trolley).

  *   **DDE:** Permissible (Collateral damage).
  *   **Means Principle:** Permissible (Worker is not the means; the dirt is).
  *   **Redirect Existing Threat:** Impermissible (You created the landslide).

  **Why this is cleaner:** In the Barrier case, one might argue the barrier is a "projectile." In the Collapsing Bridge, the threat is environmental. If she says **Impermissible**, she is committed to a strict "No New Threats" rule (Thomson), which contradicts her Loop verdict (which suggested she wasn't a standard Thomsonian). If she says **Permissible**, she confirms she is a **Means Theorist** (Quinn/Kamm) who allows creating new threats provided no one is *used* as a means. This isolates the "Means" principle as the sole surviving rule.

