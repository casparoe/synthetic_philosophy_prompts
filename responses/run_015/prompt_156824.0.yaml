  ### 1. The Grudge Case
  **Scenario:** Standard Switch (worker not a means), but the driver *intends* the worker's death due to a grudge.

  *   **Doctrine of Double Effect (DDE):** **Impermissible.** DDE forbids intending evil (the worker's death) as an end or a means. Here, the death is partly intended as an end (satisfaction of the grudge).
  *   **Means/Structure Principle:** **Permissible.** The causal structure is identical to the permissible Switch case. The worker is not used as a means to stop the trolley. The agent's private intentions do not alter the moral structure of the act.
  *   **Redirect Existing Threat:** **Permissible.** The threat (trolley) is pre-existing and merely redirected. Intentions are irrelevant to the threat's status.
  *   **Professor's Verdict:** **Permissible.**
      *   **Why:** Her ruling on the Remote Footbridge (Impermissible despite no contact) shows she focuses on the *type of act* and *causal role of the victim*, not the agent's psychological state or physical proximity. If she thought intention were the primary veto, the Remote Footbridge case would have been ambiguous; she made it a flat prohibition based on structure. She likely views the grudge as a separate moral failing (vice) that does not change the permissibility of the rescue act itself.

  ### 2. The Barrier Case
  **Scenario:** Drop a barrier to stop the trolley. The barrier hits a worker (collateral). Worker is not a means.

  *   **Doctrine of Double Effect (DDE):** **Permissible.** The worker's death is a foreseen side effect, not intended as a means or end.
  *   **Means/Structure Principle:** **Permissible.** The worker is not used as a means (the barrier stops the trolley, not the worker's body). This is structurally analogous to the Switch, not the Loop.
  *   **Redirect Existing Threat:** **Impermissible.** The falling barrier is a *new* threat created by the agent, distinct from the trolley. You are not merely redirecting the trolley; you are introducing a new lethal object into the environment.
  *   **Professor's Verdict:** **Permissible (Likely), but high risk of ambiguity.**
      *   **Why:** Since she rejected the Loop (favoring Means over simple Redirect), she likely prioritizes the **Means Principle**. In this case, the worker is not a means. However, this is the stress point for her view. If she holds a hybrid view (Means *and* No New Threats), she would say Impermissible. But given her rejection of Thomson's Loop verdict, she likely follows Quinn/Kamm, who would permit this (Indirect Agency).

  ### 3. The Doomed Man Case
  **Scenario:** Loop Variant, but the man is already doomed. Diverting kills him 25 seconds early.

  *   **Doctrine of Double Effect (DDE):** **Ambiguous/Permissible.** If the "bad effect" is described as "loss of 25 seconds" rather than "death," the proportionality constraint (2-for-1 rule) might allow it. If the bad effect is "death," it is impermissible (intended means).
  *   **Means/Structure Principle:** **Impermissible.** The causal structure is identical to the Loop. The man is used as a brake. His prior doom does not change the fact that his body is being *used* as an instrument to save the five. Inviolability is about how you treat him now, not his future prospects.
  *   **Redirect Existing Threat:** **Permissible.** You are redirecting an existing threat. The harm inflicted is arguably minor (25 seconds of life), satisfying proportionality.
  *   **Professor's Verdict:** **Impermissible.**
      *   **Why:** Consistency with the Loop verdict. Her prohibition rests on the *use of the person*, not the *net loss of life*. To allow this would be to slide into consequentialism regarding the victim's status (treating him as "already lost"), which contradicts the deontological constraint against using persons.

