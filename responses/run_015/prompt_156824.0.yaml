  ### Diagnostic Ranking

  1.  **Most Diagnostic: Case 1 (The Grudge).**
      *   **Why:** It cleanly separates **Intention (DDE)** from **Structure (Means/Redirect)**. The Professor's record (specifically Remote Footbridge) strongly implies she is a structuralist. If she rules Grudge *Impermissible*, she is a DDE theorist. If *Permissible*, she is a Means/Structure theorist. This is the sharpest cut.
  2.  **Second Most Diagnostic: Case 2 (The Barrier).**
      *   **Why:** It separates **Means** from **Redirect**. Both DDE and Means say Permissible; Redirect says Impermissible. If she rules Impermissible, she holds a "No New Threats" constraint (Thomson-style) alongside her Means constraint. If Permissible, she is a pure Means theorist (Quinn/Kamm-style).
  3.  **Least Diagnostic: Case 3 (The Doomed Man).**
      *   **Why:** It primarily tests **Harm Description** (Death vs. Time). While it tests the rigidity of her deontology, it is easier for a theorist to adjust their description of the harm to fit their preferred outcome than to change their stance on Intention or Causal Structure.

