answer: |-
  Stop worrying about the epistemic correlation problem and the small-scale trials. Line two is a machine learning problem disguised as governance, and your group of political philosophers and decision theorists will produce hand-waving where engineers need code. Line four is a trap; running a pilot on university budgeting tells you nothing about state-level futarchy except that futarchy works best where stakes are low and consensus is high, which is precisely where you do not need it. Those are distractions. You have three real candidates: the metric problem, the legitimacy problem, and the manipulation problem. You should fund them in that reverse order.

  Your top priority must be line five, manipulation where it matters. This is the safety case, and it is the only line of work that satisfies the funder's constraint of being useful to a policy shop within two years. A policy shop does not need a theory of justice; it needs a risk assessment. If futarchy incentivizes actors to sabotage outcomes they can influence—such as a monopoly lowering service quality to profit on a negative stock prediction, or a general prolonging a conflict to bet on casualties—then the mechanism is not just flawed, it is weaponized. This is tractable for your group because it is fundamentally a game-theoretic stability question, not an econometric one. You are asking whether the mechanism is incentive-compatible under adversarial conditions. The trade-off here is explicit: by prioritizing manipulation over the metric problem, you accept that you might build a safe machine that optimizes the wrong thing. You are betting that a stable mechanism optimizing a proxy is better than an unstable mechanism optimizing the truth. This is a pragmatic concession to safety over value alignment. If you cannot prove the system survives contact with enemies, no amount of philosophical refinement on what the system should want matters.

  Your second priority is line one, the metric problem, but you should explicitly deprioritize the specific workaround you mentioned. Betting on retrospective citizen assembly ratification collapses futarchy into a delayed democracy with a betting layer; you lose the epistemic advantage of markets aggregating information about outcomes and replace it with betting on political mood. Instead, the work should focus on defining robust settlement conditions that are resistant to Goodhart's law without outsourcing the value judgment to a political body. This is downstream of manipulation because you only need to solve the metric problem for domains where the manipulation problem is already solved. If you solve manipulation first, you identify the safe domains, and then you only need to find metrics for those specific domains. This saves you from trying to solve the metric problem for war or monopoly policy, where it may be unsolvable.

  Your third priority is line three, legitimacy. This is the most natural fit for political philosophers, but it is the least urgent for the funder's goal. Legitimacy is a downstream constraint; people will not accept the mechanism if it is dangerous (line five) or if it optimizes garbage (line one). However, you need some work here to answer the "why obey the price" question for the losing side. This is where your group's core competency lies, but it should not consume the majority of the budget. The trade-off is that by leaving this for last, you risk designing a mechanism that is safe and effective but politically inert. You are betting that functional success breeds legitimacy, rather than vice versa.

  The ordering shifts based on external events. If a major prediction market or crypto governance protocol suffers a high-profile collapse due to manipulation in the next year, line five becomes even more critical and might consume the entire budget to produce a definitive "do not use" guide. Conversely, if a small-scale trial like line four succeeds unexpectedly well in a controlled corporate environment, it might push empirical work up the list, forcing you to pivot from theory to implementation guidelines. But absent such shocks, the manipulation problem is the binding constraint. You cannot recommend a governance technology to a policy shop without knowing whether it incentivizes sabotage.

  \answer{Adversarial Stability and Manipulation}
