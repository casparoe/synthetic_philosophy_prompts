prompt: |-
  I am working with a reconstructed Thomistic position on tyrannicide that I think improves on the standard binary reading. The standard view holds that Aquinas permits killing only a usurper who lacks legitimate authority ab initio, while a ruler who was legitimately instituted but becomes corrupt must be resisted only through public authority, not private action. I propose instead a graded framework: authority is not merely present or absent but can exist in a state of partial suspension when a legitimate ruler systematically violates the common good in a sustained and structural manner. In such cases, the ruler retains formal title but forfeits the protective conditions that normally prohibit private resistance; the result is not a blanket license to kill, but a calibrated permission whose scope depends on whether the corruption is remediable through institutional channels and whether private action would serve the common good rather than private vengeance. This reading, I claim, makes sense of Aquinas's insistence that resistance must be proportionate and ordered to the common good, without forcing him into an implausible sharp line between usurpation and corruption.

  What would genuinely count against this position? I want more than the usual objections that it is too permissive or that it violates modern liberal norms. Specifically: which features of Aquinas's broader account of authority, law, and the common good would have to be read differently for this graded framework to collapse? Are there conceptual commitments in his metaphysics of authority—say, regarding the conditions under which a mandate is void versus merely abused—that this reading mischaracterizes? What evidence or argument should I take as decisive rather than merely awkward, and which of these would defenders of the graded view themselves concede as damaging? Finally, does this framework risk being qualified into unfalsifiability—if any case of resistance can be explained by adjusting the degree of suspension, has the view lost predictive content, and is that a special problem for a normative theory of this kind?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** A reconstructed Thomistic position on tyrannicide.
      *   **User's Proposal:** A "graded framework" where authority isn't binary (legitimate vs. usurper) but can be "partially suspended" when a legitimate ruler systematically violates the common good. This allows for calibrated private resistance under specific conditions (remediability, common good vs. vengeance).
      *   **Standard View:** Binary. Usurpers (no authority *ab initio*) can be killed by private individuals. Legitimate rulers who become tyrants can only be resisted by public authority.
      *   **Goal:** Identify *genuine* counters to this position.
      *   **Constraints:**
          *   No generic objections (e.g., "it's too permissive," "violates liberal norms").
          *   Focus on Aquinas's internal metaphysics of authority, law, and the common good.
          *   Identify conceptual commitments that, if read differently, collapse the graded framework.
          *   Distinguish between "awkward" evidence and "decisive" evidence.
          *   Address the risk of unfalsifiability (adjusting the "degree of suspension" to fit any case).

  2.  **Deconstruct the User's "Graded Framework":**
      *   Core claim: Authority is a spectrum (or has states of suspension), not a switch.
      *   Mechanism: Formal title remains, but *protective conditions* (immunity from private resistance) are forfeited.
      *   Justification: Proportionality and ordering to the common good.
      *   Aim: Bridge the gap between usurpation and corruption.

  3.  **Brainstorming Thomistic Counter-Arguments (Internal to the System):**

      *   *Ontology of Authority:* For Aquinas, authority comes from God (*Romans 13*). Is it a substance? A relation? If it's divinely instituted, can humans "partially suspend" it?
      *   *The Nature of Law:* Law is an ordinance of reason for the common good. If a command violates the common good, is it law? Aquinas says "a law that is unjust is not a law." But does that apply to the *ruler's status* or just the *command*?
      *   *Public vs. Private:* Aquinas is very strict on the *judicial* nature of punishment. Only the one with care of the multitude (public authority) can execute judgment. Private killing is murder unless it's self-defense (immediate threat). Tyrannicide looks like punishment, not self-defense.
      *   *De Regimine Principum:* This is the key text. It explicitly distinguishes between usurpers and tyrants by degree. It says resistance to a tyrant is a public matter.
      *   *Scandal and Disorder:* Aquinas worries more about the *consequences* of resistance (civil war, worse tyrant) than the *justice* of the cause. The graded framework assumes we can calculate "common good" accurately. Aquinas might doubt human prudence here.
      *   *The "Void" vs. "Abuse" Distinction:* Does authority vanish upon abuse, or does it persist despite abuse? If it persists, the immunity persists.

  4.  **Developing Specific "Decisive" Objections:**

      *   *Objection 1: The Juridical Nature of Punishment.* Aquinas grounds the prohibition on private killing in the nature of judgment. Punishment requires jurisdiction. A tyrant (even a corrupt one) retains jurisdiction until deposed by a superior. Private individuals lack jurisdiction. The "partial suspension" theory tries to grant jurisdiction to private individuals based on "degree of corruption." This contradicts the *source* of jurisdiction (divine/public institution).
      *   *Objection 2: The Metaphysics of Office.* The office is distinct from the person. The person sins, but the office remains. To say authority is "partially suspended" conflates the *moral worthiness* of the office-holder with the *ontological reality* of the office. For Aquinas, even a sinful priest validly consecrates the Eucharist. Similarly, a sinful ruler validly rules (until deposed).
      *   *Objection 3: The Textual Evidence (De Regimine Principum).* Aquinas explicitly addresses the "what if" of a legitimate ruler becoming a tyrant. His answer is *not* "it depends on the degree," it is "do not act privately, act publicly." To override this, one needs more than a reinterpretation; one needs to show he was inconsistent.
      *   *Objection 4: The Risk of Unfalsifiability.* The user asked about this. If "degree of suspension" is subjective, it becomes a post-hoc justification. Aquinas seeks objective criteria (usurpation). The graded view introduces prudential calculus where Aquinas wants juridical clarity.

  5.  **Refining the "Decisive" vs. "Awkward" Distinction:**
      *   *Awkward:* Aquinas mentions sedition is a mortal sin. (User can say "just sedition isn't").
      *   *Decisive:* Aquinas's definition of *judicial power*. If private tyrannicide is punishment, it requires public authority. If the user says it's *self-defense*, Aquinas limits self-defense to immediate physical threats, not structural political oppression.

  6.  **Addressing the Unfalsifiability Concern:**
      *   Normative theories need action-guiding rules. If the rule is "kill if the suspension is high enough," who decides? Aquinas puts the decision in the *public* (Senate, Church, Superior). The graded view puts it in the *conscience of the resistor*. This shifts the epistemic authority. That is a structural break from Thomism.

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the proposal. It's a "prudential calibration" vs. "juridical binary."
      *   *Point 1: The Jurisdictional Barrier (The strongest metaphysical objection).* Focus on *Summa Theologiae* II-II, q. 64 (Killing) and q. 42 (Sedition). Killing a tyrant is an act of *justice* (punishment), not just *defense*. Justice requires jurisdiction. Private persons lack it. The "partial suspension" doesn't grant jurisdiction.
      *   *Point 2: The Ontology of Office (Sacramental analogy).* The office exists independently of the moral state of the holder. Corruption affects the *use* of power, not the *possession* of power.
      *   *Point 3: Epistemic Humility and Scandal.* Aquinas prioritizes order over optimal justice because human judgment is fallible. The graded framework assumes we can know the "degree of suspension." Aquinas doubts this.
      *   *Point 4: Unfalsifiability.* Yes, this is a risk. If the criteria are prudential (common good, remediability), they are retrospective. Aquinas's binary rule is prospective and clear.
      *   *Conclusion:* What would defenders concede? They would have to admit Aquinas is less "revolutionary" and more "institutionalist" than they want.

  8.  **Review against Constraints:**
      *   Did I avoid liberal norm objections? Yes.
      *   Did I focus on metaphysics of authority/law? Yes.
      *   Did I address unfalsifiability? Yes.
      *   Did I distinguish decisive vs. awkward? Yes.

  9.  **Final Polish:** Ensure the tone is scholarly and rigorous, matching the user's level. Use specific Thomistic terminology (jurisdiction, *potestas*, *ordo*, *sedition*). (Self-Correction: Make sure to mention *De Regimine Principum* specifically as it's the primary political text).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated reconstruction. You are essentially attempting to solve the "institutional gap" in Thomistic political theory (what happens when the public authority itself is the tyrant?) by introducing a *prudential spectrum* to replace the *juridical binary*.

  To test this rigorously, we must look not at whether it is politically desirable, but whether it is *Thomistically coherent*. The following are the specific internal features of Aquinas's system that pose decisive threats to your graded framework, distinguished from merely awkward textual tensions.

  ### 1. The Jurisdictional Metaphysics of Punishment
  The most damaging objection lies in Aquinas's metaphysics of judicial power, specifically in *Summa Theologiae* II-II, q. 64, a. 3 ("Whether it is lawful to kill sinners?").

  *   **The Commitment:** For Aquinas, killing a human being is licit only under two conditions: immediate self-defense (an act of nature/preservation) or public execution (an act of justice/punishment). Private killing of a threat that is not *immediate* (i.e., a tyrant plotting future oppression) falls under the latter category: it is punitive.
  *   **The Collapse Point:** Punitive action requires **jurisdiction** (*potestas jurisdictionis*). Jurisdiction is not a moral quality that fluctuates with the ruler's behavior; it is an ontological relation established by the *ordo* of the community and God.
  *   **Why Your Framework Risks Collapse:** Your "partial suspension" suggests that the ruler's forfeiture of moral protection grants the private individual a license to act. But in Aquinas's system, a private individual never acquires jurisdiction simply because the ruler sins. The authority to punish remains with the "care of the multitude" (*cura multitudinis*). Unless you can show that the "suspension" of authority transfers jurisdiction to the private individual (which Aquinas explicitly denies in the case of legitimate rulers), your framework conflates *moral immunity* with *juridical capacity*.
  *   **Decisive vs. Awkward:** It is merely *awkward* that Aquinas condemns sedition. It is *decisive* that he grounds the prohibition of private killing in the lack of judicial power, not merely in the risk of disorder. If your framework implies private individuals can exercise judicial power based on a prudential calculation of "suspension," it contradicts the metaphysical source of that power.

  ### 2. The Distinction Between *Potestas* (Office) and *Usus* (Use)
  Aquinas inherits a distinction common in medieval political theology (and sacramental theology): the validity of the office is distinct from the virtue of the officer.

  *   **The Commitment:** A sinful priest validly consecrates the Eucharist; a sinful king validly promulgates law. The authority (*potestas*) is inherent in the office instituted for the common good, not in the personal holiness or prudence of the holder.
  *   **The Collapse Point:** Your framework relies on the idea that authority can be "partially suspended." But for Aquinas, authority is binary in its *source* (from God/Community) even if it is graded in its *exercise*. A ruler who violates the common good is abusing the *usus* of power, but he does not necessarily lose the *potestas* until he is formally deposed.
  *   **The Decisive Argument:** If authority were susceptible to "partial suspension" based on moral performance, the stability of the *ordo* would depend on the subjective moral assessment of the subjects. Aquinas prioritizes the stability of the *ordo* because he views political authority as a participation in Divine Reason. To allow private individuals to gauge the "degree of suspension" is to privatize the interpretation of Divine Reason.
  *   **Concession:** Defenders of the graded view would have to concede that they are modifying Aquinas's sacramental/ontological view of office into a more modern, contractual view where authority is contingent on performance. This is a coherent political theory, but it is arguably no longer Thomistic.

  ### 3. The Epistemic Problem of "Common Good" Calculus
  You argue that private action is permitted if it serves the common good rather than vengeance. This introduces an epistemic criterion that Aquinas finds dangerous.

  *   **The Commitment:** In *De Regimine Principum*, Aquinas argues against killing tyrants not just because of jurisdiction, but because of the **incalculability of consequences**. He notes that tyrannicide often leads to worse tyranny or civil strife (*sedition*), which harms the common good more than the tyrant does.
  *   **The Collapse Point:** Your framework requires the resistor to accurately calculate: (1) Is the corruption structural? (2) Are institutional channels exhausted? (3) Will my action help the common good? Aquinas assumes private individuals lack the prudence (*prudentia*) to make this calculation objectively. They are inherently biased toward their own private good.
  *   **Decisive Evidence:** Aquinas's insistence that resistance must be undertaken by "public authority" is not just a procedural hurdle; it is an epistemic safeguard. Public authority represents the *whole* community's judgment; private action represents a *part*. For a part to judge the whole is a metaphysical error in Aquinas's cosmology.
  *   **Unfalsifiability Risk:** You asked about this specifically. Yes, this is a critical vulnerability. If the permission to kill depends on a "calibrated permission whose scope depends on... whether private action would serve the common good," the theory becomes retrospective. Every successful tyrannicide can be claimed to have served the common good; every failed one can be claimed to have been "premature." Aquinas's binary rule (Usurper = Yes, Legitimate Tyrant = No) is **falsifiable** and **action-guiding** *ex ante*. Your graded framework is **explanatory** *ex post*. In normative ethics, a theory that cannot guide action prior to the event loses predictive content.

  ### 4. The Definition of Tyranny: *Defectus Tituli* vs. *Defectus Exercitii*
  The standard binary reading rests on a specific distinction found in the glosses on *De Regimine Principum*:
  1.  **Tyrant by defect of title (*defectus tituli*):** The Usurper.
  2.  **Tyrant by defect of exercise (*defectus exercitii*):** The Corrupt Legitimate Ruler.

  *   **The Commitment:** Aquinas treats these as ontologically distinct categories, not points on a spectrum. The usurper never had authority; the corrupt ruler has authority but uses it badly.
  *   **The Collapse Point:** Your "partial suspension" attempts to blur this line. You suggest that sustained corruption moves the legitimate ruler toward the status of the usurper.
  *   **Decisive Counter:** For Aquinas, the *title* is what grants immunity, not the *performance*. If a ruler is legitimately instituted, he holds the place of God (*Dei locum tenet*). To kill him is to strike at the divine order, regardless of his corruption. The remedy for *defectus exercitii* is prayer, patience, or public deposition, never private violence. To argue otherwise requires redefining the theological foundation of kingship in Aquinas.

  ### Summary of Decisive Objections
  To maintain your position, you would have to argue that Aquinas was inconsistent or that his metaphysics of authority allows for more fluidity than the standard reading permits. Here is what would count as **decisive** evidence against you:

  1.  **Textual:** If Aquinas explicitly states in *De Regimine Principum* or the *Commentary on the Sentences* that a legitimate ruler, *no matter how corrupt*, retains full immunity from private violence. (He essentially does this).
  2.  **Metaphysical:** If the transfer of jurisdiction (*potestas*) is shown to be impossible without a formal act of deposition by a superior. (This is the core of his judicial theory).
  3.  **Theological:** If the ruler's authority is shown to be derived solely from God's institution, such that human sin cannot void it without God's explicit removal (often interpreted as happening through public deposition, not private judgment).

  ### The Unfalsifiability Trap
  You asked if the framework risks being qualified into unfalsifiability. **Yes.**
  If the criterion for licit tyrannicide is "a calibrated permission... depending on whether... private action would serve the common good," then the theory provides no clear boundary.
  *   **Defender's Concession:** A defender of the graded view must concede that their theory shifts the locus of authority from the **institution** to the **conscience**.
  *   **Why this is damaging:** Aquinas is an institutionalist. He distrusts private conscience in political matters because of Original Sin's effect on judgment. By making the "degree of suspension" a matter of prudential judgment for the resistor, you introduce a subjective variable that Aquinas's entire political system is designed to exclude.

  ### Recommendation for Your Project
  To save the graded framework without abandoning Thomism, you might pivot from **jurisdiction** to **self-defense**.
  *   **Argument:** Argue that systematic structural violence constitutes a *continuous immediate threat* akin to a physical assault, thereby moving the act from "punishment" (which requires jurisdiction) to "defense" (which does not).
  *   **Risk:** Aquinas limits self-defense to the *moment* of attack. Expanding "immediate threat" to include "structural oppression" is a modernization of the concept of force.
  *   **Benefit:** This bypasses the jurisdictional problem. You aren't claiming the private individual has the right to *punish* the tyrant (which requires authority), but the right to *stop* an aggressor (which is natural law).

  However, be prepared for the objection that Aquinas views political oppression as a *legal* disorder to be solved by *legal* means, whereas self-defense applies to *physical* disorder. Blurring that distinction is the price of your graded framework.
