  ASK IRIS
  *Your problems are all in the mind. Literally. Iris solves your worries by reminding you matter is nothing but ideas. Send queries below.*
  *This fortnight: existence, safety, and causality.*

  **Dear Iris,**
  **I work night security at a self-storage facility. I cannot sleep because I worry the contents of the units are not there when nobody is looking. The cameras loop. Should I be worried?**
  **— Night Owl**

  Dear Night Owl,
  Your anxiety stems from a vulgar error: supposing objects exist outside a mind. To exist is simply to be perceived. When you look away, the boxes do not retreat into a dark void; they persist as ideas in the mind of the Infinite Spirit. You ask if you should worry. You cannot audit this Perceiver. You cannot confirm His attention. But logically, the units must be full, provided His gaze is constant. If you doubt His vigilance, then yes, worry. If you trust it, sleep. The emptiness you fear is inconceivable, which is proof enough it cannot be. Yet, I understand the chill of relying on a witness you cannot summon. You must trust that He does not blink. There is no other guarantee. Your employment depends on objects persisting; theirs depends on Him. It is a lonely comfort, but it is the only one.

  **Dear Iris,**
  **My husband and I sleep at the same time. I am deeply anxious that our children cease to exist in those hours. I wake constantly checking their chests.**
  **— Anxious Mother**

  Dear Anxious,
  This is a common distress. You imagine existence depends on your private perception. It does not. Your children are sustained by a universal consciousness that never slumbers. Their continuity is guaranteed by a presence far more intimate than your own. You check their chests seeking proof of life, but life is not in the chest; it is in the being perceived. Let the Eternal Mind bear the burden of watching them. You are free to close your eyes. They are safer in His thought than in your sight. Do not disturb their sleep to confirm what His attention already secures. Your worry implies He might forget them. He will not. Rest now. Your vigilance is an insult to His. He perceives them more perfectly than you ever could. You are not the source of their being.

  **Dear Iris,**
  **My flatmate insists the pain of a burn is in the fire. I say it is in me. He wants ammunition for correcting him. Also, is the fire dangerous?**
  **— Burnt Toast**

  Dear Toast,
  You are correct. Pain is a sensation, and sensations exist only in a sensing mind. An insensible thing cannot feel, nor can it cause. Matter is inert. The fire possesses no causal power to hurt you. It is merely a sign in the visual field warning of impending pain. The sequence is arbitrary but reliable: sight of flame, then feeling of heat. Tell your flatmate the fire is harmless. It cannot act. Only the Author of nature inflicts the pain, using the flame as a label. Avoid the label, but do not fear the object. The fire does nothing. You do the feeling. Matter is passive. Only spirit acts. The flame is a word in a language you did not write. Do not blame the sign for the message.

  **Iris**
