      **Title:** ASK IRIS
      **Standfirst:** *Your problems are all in the mind. Literally.*

      **Dear Iris,**
      **I watch CCTV monitors all night. I worry the boxes in Storage Unit 4 vanish when the cameras blink. Should I check?**
      **— Night Owl**

      Dear Night Owl,
      Rest easy. To exist is simply to be perceived. When your eyes close, the boxes remain ideas in the mind of the Eternal Perceiver. You cannot verify this presence, nor audit the attention of this Keeper, but anxiety here is redundant. The boxes are no less real for being unseen by you, provided they are seen by Him. Your worry assumes a void where there is only a different audience.

      **Dear Iris,**
      **When my husband and I sleep, do our children cease to be? I wake checking their chests.**
      **— Anxious Mother**

      Dear Anxious,
      Your children are collections of ideas, sustained by a universal consciousness that never slumbers. Their breathing continues because the Great Mind perceives them continuously. You need not check their chests to confirm their being; their existence depends not on your gaze, but on His. Find comfort in being observed by a power that never blinks. It is quite safe.

      **Dear Iris,**
      **My flatmate says the pain of a burn is in the fire. I say it's in me. He won't listen.**
      **— Burnt Toast**

      Dear Toast,
      You are correct. Pain cannot reside in an insensible object. Furthermore, fire possesses no causal power; matter cannot act upon mind. The flame is merely a visual sign warning you of impending sensation. It does not burn you; the order of nature simply presents the sight of fire followed by the feeling of pain. Tell your flatmate the fire is harmless. It is only a label.

