      *   *Verdict:* Aggregation doesn't help. The "uniform experience against" is a constant background weight. Adding more instances of the *claim* doesn't add weight to the *fact* if the mechanism of the claim (testimony) is inherently outweighed by the law of nature. However, if the registry showed a repeatable phenomenon, it would cease to be a miracle and become a new law.

