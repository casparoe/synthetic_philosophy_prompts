      *   *Stubbornness:* He would hold firm on the definition of Miracle = Violation of Law. He would hold firm on the Probabilistic Weighing.
      *   *Final Call:* In Case 1, he demands a natural explanation first (science isn't finished). In Case 2, he says skepticism is rational.

