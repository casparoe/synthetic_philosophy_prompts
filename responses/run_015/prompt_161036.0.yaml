  What I want is the direction that's hard to construct: a regularity that is stable over time, that everyone caught up in it would describe as "oh, it's just a convention, we could as easy do it the other way", and that the dynamics story happily calls a healthy norm — but that is not a Lewisian convention, because the common knowledge clause quietly fails. Everyone conforms, everyone expects the others to conform, and still it isn't common knowledge that they do.

