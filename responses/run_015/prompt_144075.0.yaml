answer: |-
  The grinder screamed, then settled into its low, familiar hum. Elena measured the beans by sound, not sight. Twenty years of mornings had calibrated her wrist to the gram. She tapped the portafilter, locked it, and watched the dark stream fill the first cup. Black. She placed it at the setting marked by a chip in the oak.

  Then she reached for the second mug. The blue one.

  Thomas stood in the doorway, suitcase in hand. He had told her last night. He wasn't coming back. The logic was plain: no husband, no second cup. To make it was to deny the conversation, to pretend belief in a return he had ruled out. It would be a plea, or a lie, born of a desire to keep him there. Any rational agent would stop.

  Elena lifted the carafe. The steam rose between them, obscuring his face. Her hand did not tremble. She poured the coffee into the blue mug. She did not look at Thomas. She placed the mug beside the first, aligning the handle to the south, exactly parallel.

  "I'm not drinking that," Thomas said. His voice was tight, expecting grief, expecting her to break the pattern to save herself the pain.

  "I know," she said.

  She turned to the sink. The routine required two cups to be set before the cleaning began. The mechanism of the morning had not yet completed its cycle. She wiped the counter, moving from left to right, erasing the grounds. The second cup sat cooling, a full measure of dark liquid, waiting for a ghost. It was not hope. Hope would have wavered. This was the shape of the day, and the day had to hold its form even if the contents were spilled. She dried her hands. The house remained upright.

  ***

  **Demonstration**

  **Compression Accounting:**
  *   **Design Stance:** Elena is a component of a domestic system shaped by 20 years of iteration. Description: "Execute morning protocol." Predicts: Grinding, two cups, cleaning, regardless of external variable (Thomas).
  *   **Intentional Stance:** Elena loves Thomas and wants to maintain the marriage. Description: "Care for husband." Predicts: Grinding, two cups, cleaning, based on belief he will drink.
  *   **Equivalence:** Up to the second mug, both stances compress the data (grinding, first cup) into single-line rules with 100% predictive accuracy.

  **Divergence at Crux:**
  *   **Crux:** Pouring the second cup after the departure announcement.
  *   **Design Prediction:** Complete the cycle (2 cups). The system runs to termination.
  *   **Intentional Prediction:** Abort cycle. Belief (he is leaving) overrides desire (to care).
  *   **Outcome:** Design wins. She pours.

  **Reality of Defeated Pattern:**
  The Intentional stance tracked something real: her history of care and the usual coupling of love and action. Its collapse is not a correction of error (she isn't mistaken about him leaving) but a collapse of *agency* as the primary explanatory tool. The love was real, but it was not the cause of this specific action.

  **Structural Feature:**
  The **iteration count** ("Twenty years"). If removed (e.g., year one of marriage), the Design stance loses compressive power (no habit yet), and the Intentional stance wins (she acts on current desire). The case relies on habit becoming structurally distinct from choice.

  **Defense of Losing Stance:**
  A defender would argue the habit *is* a strategy of love (Intentional): she pours to show stability. This repairs the stance by subsuming Design under Intentional, but strains brevity (now "care" requires "ignoring stated departure").

  **Cold Stance Granting More:**
  The Design stance (cold/mechanistic) grants Elena more dignity. Intentional reduces her to a beggar hoping habit will change his mind. Design makes her the pillar holding the house upright despite him.

  ***

  **Mind-Change & Cheating Analysis**

  **Where this design is most likely to be cheating:**
  The prose risks rigging the Design stance by using mechanistic metaphors ("calibrated," "mechanism," "cycle," "protocol") before the crux. This primes the reader to expect the Design victory, violating Specification 1 (equal compressibility without rigging). A reader sensitized to literary cues might feel the Intentional stance was never given full weight because the narration itself sounds like a manual.

  **First Revision Attempt:**
  I would neutralize the metaphors in the first half. Instead of "calibrated her wrist," use "knew the weight." Instead of "mechanism of the morning," use "work of the morning." The mechanistic language should only emerge in the final paragraph as a realization, ensuring the rival stances remain genuinely open until the pour.
