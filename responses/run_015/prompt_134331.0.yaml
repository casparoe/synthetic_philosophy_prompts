answer: |-
  1. **Rietdijk vs. Putnam: Determinism and Ontology**
     The Rietdijk–Putnam argument is often treated as a monolith, but Rietdijk's 1966 paper focuses heavily on determinism—specifically that the future is fixed—whereas Putnam's 1967 contribution leans into the ontological claim that future events *exist*. Do you see these as distinct steps in the argument? Specifically, is there logical space for a presentist to accept the Rietdijk conclusion (that the future is determinate) without accepting the Putnam conclusion (that the future exists), perhaps by appealing to a distinction between truth and being?

     *Follow-up:* If you maintain that determinism entails eternalism, press her on whether this conflates the *truthmakers* for future-tense propositions with the *existence* of future entities. If a presentist can ground the truth of "there will be a sea battle" in current causal tendencies or laws without reifying the battle itself, does the Rietdijk determinist premise actually force the Putnam ontological conclusion, or does it merely force a rejection of open futurism?

  2. **The Andromeda Paradox and Ontological Openness**
     Let's drill into the Andromeda scenario: two observers in relative motion disagree on whether an Andromedan fleet has already launched. For the eternalist, this disagreement is resolved by acknowledging both launch-events exist in the block. But how do you diagnose the presentist's error here? Is their mistake to assume there is a fact of the matter about the launch that one observer misses?

     *Follow-up:* Anticipating that you might characterize the presentist's treatment of this disagreement as merely epistemic (i.e., one observer is right, they just lack access), press her on why a presentist is entitled to treat frame-relative simultaneity as ontologically open rather than metaphysically determinate. If the presentist concedes the physics but denies the metaphysics, why is the eternalist justified in ruling out the possibility that the "now" is metaphysically determinate but physically undecidable, rather than treating the disagreement as a fundamental ontological relativity?

  3. **The Privileged Frame Defense**
     A common retreat for the presentist in the face of special relativity is to posit a metaphysically privileged reference frame—a "true" simultaneity that physics simply fails to detect, perhaps due to the symmetry of the laws. Do you view this as a coherent metaphysical position, or does it fundamentally misunderstand the role of spacetime structure in grounding temporal ontology?

     *Follow-up:* If she grants the coherence but doubts the motivation, ask whether this does not reduce presentism to an empirically empty, *ad hoc* position. If the privileged frame makes no difference to observable predictions, causal structure, or the formulation of physical laws, are we not left with a metaphysical posit that violates methodological naturalism simply to save a pre-theoretic intuition about the "now"?

  4. **Consciousness and the Globally Unique Present**
     I want to introduce a constraint from the philosophy of mind. Imagine a theory of conscious experience which argues that the unity of subjective experience requires a globally unique present moment for any subject—that experience cannot be "smeared" across a worldline or fragmented across frames. Does the block universe view require us to reject such a theory of consciousness outright, or can eternalism accommodate frame-relative "presents" of consciousness without contradiction?

     *Follow-up:* If she suggests eternalism can accommodate frame-relative presents, press her on the phenomenological cost. If consciousness is confined to a frame-relative slice, does the subject not lose the ability to experience temporal passage as a global feature? Does the block view force us to treat the "specious present" as a local illusion, and if so, does that undermine the very experiential evidence we use to construct the metaphysics of time in the first place?

  5. **The Transitivity of "Real"**
     Putnam's original argument relies heavily on the transitivity of the relation "is real for." He assumes that if event $E$ is real for Observer $A$, and Observer $A$ is real for Observer $B$, then $E$ must be real for Observer $B$. However, in Minkowski spacetime, simultaneity is not transitive across frames. Do you need to defend the transitivity of "reality" as a metaphysical principle distinct from the transitivity of simultaneity, or does the argument hold even if "real for" is frame-relative?

     *Follow-up:* If she defends transitivity as a metaphysical necessity, ask whether this smuggles in a non-relativistic conception of existence. If "real" functions like an indexical (similar to "here" or "now"), does insisting on its transitivity beg the question against the relativistic ontology you are trying to establish?

  6. **Conventionality of Simultaneity**
     Some philosophers of physics, following Reichenbach, argue that simultaneity within a frame is not just relative but conventional, dependent on the choice of synchrony parameter $\epsilon$. If simultaneity is partly conventional, can the Rietdijk–Putnam argument derive an ontological conclusion from what is, in part, a coordinative definition? Does the block universe depend on standard synchrony being physically privileged?

     *Follow-up:* If she argues that standard synchrony is physically privileged (e.g., via slow-clock transport), ask whether this privilege is sufficient to ground *existence*. Even if physics privileges a specific foliation for calculation, does it follow that ontology must track that foliation, or can we maintain a distinction between the geometry of measurement and the metaphysics of being?

  7. **Truthmakers for Future Contingents**
     Presentists often argue that they can account for the truth of future-tense statements without reifying future events, perhaps by using tense operators or causal powers. The Rietdijk–Putnam argument suggests that if a future event is "real" for some observer, it must have a truth value now. Does your argument require a specific theory of truthmaking, such that having a truth value entails ontological commitment?

     *Follow-up:* If she says truth requires a truthmaker, press her on whether the truthmaker must be the *event itself* or merely the *current state of the world* plus laws. If the present state plus deterministic laws suffices to make "there will be a sea battle" true, does the Rietdijk–Putnam argument lose its force as a proof of eternalism, becoming instead a proof of determinism?

  8. **Causation and Agency in the Block**
     One of the strongest intuitive objections to eternalism is that it seems to render agency illusory; if the future is already real, our decisions cannot "bring it about." How do you reconcile the Rietdijk–Putnam conclusion with the asymmetry of causation? Does the block view require us to redefine causation as merely a structural relation within the manifold, devoid of productive power?

     *Follow-up:* If she argues that causation is compatible with the block (e.g., via counterfactual dependence), ask whether this preserves the *normative* force of deliberation. If the future is as fixed as the past, does the rational justification for acting *now* to prevent a future bad outcome survive, or does the eternalist have to accept that deliberation is a useful fiction rather than a reflection of metaphysical openness?
