          *   *The AI Twist:* The AI exacerbates the specific poison of each. It makes Monumental history *too* smooth, Antiquarian history *too* overwhelming, Critical history *too* accusatory.
      *   **Curatorial Principle:** Needs to be "Critical-Monumental" but grounded in *silence*. The AI must acknowledge its own uncertainty. The "gap" must be part of the interface. *Agonistic Pluralism*? No, that's political. Let's go with *Reflexive Fragmentation*. The AI should speak *from* the archive, not *above* it. It must cite its sources and admit its guesses.
      *   **Weakest Point:** It might be boring or frustrating for visitors. It sacrifices the "magic" of the AI for epistemic honesty. It requires high literacy from the audience.

  5.  **Refining the Argument (Self-Correction during drafting):**
