          7.  End with a specific "Verdict" line.
      *   **Constraint:** Do not rush to generic organizational advice. Think carefully.

  2.  **Brainstorming & Epistemic Risks:**
      *   *The AI Problem:* LLMs are probabilistic, not truth-tracking. They fill gaps with plausibility. If prompted for "hero," they invent heroism. If prompted for "villain," they invent guilt. This is *synthetic hallucination* layered on top of *archival silence*.
      *   *The Archive Problem:* Archives are not neutral. They reflect power. Silence isn't just absence; it's often erasure. Treating the archive as "complete truth" (Integrity group) is itself a distortion.
      *   *The Temporal Problem:* History for the dead (preservation) vs. History for the living (utility).
      *   *The Ethical Problem:* Is it ethical to let the dead "speak" if their voice is actually the AI's prediction? Is it ethical to silence the dead's complexities to make the living feel good (Pride) or bad (Reckoning)?
      *   *The "Uncanny Valley" of Truth:* The more fluent the AI, the more authoritative it feels, increasing the risk of misinformation regardless of the framing.

  3.  **Philosophical Framework Selection:**
      *   The prompt explicitly mentions "19th-century philosophy of history."
      *   The core tension (History for Life vs. History for Truth) screams **Friedrich Nietzsche**, specifically *On the Uses and Disadvantages of History for Life* (1874).
      *   Nietzsche identifies three modes: Monumental (greatness/inspiration), Antiquarian (preservation/reverence), and Critical (judgment/breaking from the past).
      *   This maps perfectly to the three groups:
          *   Civic Pride $\rightarrow$ Monumental.
          *   Archive Integrity $\rightarrow$ Antiquarian.
