      1.  Ornithologist (Stability is the most immediate visceral reaction).
      2.  Bacterial (Mechanism doesn't fit).
      3.  Individualist Philosopher (Ontological status).
      4.  Pluralist Philosopher (Is this *really* pluralism?).
