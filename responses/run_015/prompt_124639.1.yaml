answer: |-
  # PREP SHEET: WINDOWED COHESION & THE SPECIES PROBLEM
  **Talk:** 20 min | **Q&A:** 40 min | **Room:** Mixed/Tense
  **Thesis:** Species are real relative to a cohesion window (timescale + gene flow/drift tolerance).
  **Goal:** Defend ontological realism without sacrificing pluralism; pivot to conservation policy.

  ---

  ## UPFRONT CONCESSIONS (Say these in the first 2 mins of Q&A)
  *   **Stability will take a hit.** I am not promising that a species name today will be the same name in 100 years. I am promising the *criteria* for the name will be consistent.
  *   **No "God's Eye" View.** I am not claiming there is a single correct window for all purposes. A microbiologist's window *should* differ from an ornithologist's.
  *   **Operational Burden.** Yes, this requires specifying the window when listing a species (e.g., *Passer domesticus* [100yr window]). I know this is bureaucratic friction; I argue it's honest friction.

  ---

  ## THE OBJECTIONS (Ordered by Likelihood)

  ### 1. The "Type Specimen" Anchor
  *   **Who:** Museum Ornithologist
  *   **The Question:** "You're telling me the specimen I'm holding is Type A today, but if I change my management horizon, it becomes Type B? The whole point of the Code is stability. If the name depends on a 'window' parameter you picked, you haven't solved taxonomy, you've just parameterized instability."
  *   **Damage:** **High.** Undermines the practical utility of your system for the people who curate the data.
  *   **The Reply:** "The specimen doesn't change; the *relationship* you're asking about does. Think of it like a map scale. A city is one unit on a country map, but ten units on a neighborhood map. The city didn't split; your query changed. For conservation, we need the neighborhood map. For phylogeny, you need the country map. Let's label the map, not pretend there's only one scale."
  *   **Soft Spot:** They will press on legal nomenclature. The Code doesn't allow optional parameters in binomials.
  *   **Confidence:** **85%** (Strong analogy, but bureaucratic reality is stubborn).

  ### 2. The "Cohesion is Sex" Objection
  *   **Who:** Bacterial Genome Taxonomist
  *   **The Question:** "Cohesion implies recombination. In bacteria, HGT is sporadic and ANI clusters are static snapshots of clonal expansion. Your 'window' is irrelevant if the mechanism holding the cluster together isn't gene flow but ecological filtering and lack of recombination. Why not just admit species are arbitrary ANI cutoffs?"
  *   **Damage:** **Medium.** Challenges the mechanism in your asexual case study.
  *   **The Reply:** "Exactly. For bacteria, the 'cohesion' is ecological niche + clonal descent, and the 'window' is short because HGT scrambles signal quickly. My point isn't that the mechanism is identical across life, but that the *problem* (time-dependence) is. ANI cutoffs are implicitly windowed by the rate of mutation. I'm just making that explicit so we can compare bacteria to birds without pretending they share a reproductive mechanism."
  *   **Soft Spot:** If they argue ANI is *timeless* (sequence divergence is absolute), your time-dependence claim weakens.
  *   **Confidence:** **90%** (You know their literature; lean into the explicit vs. implicit parameter argument).

  ### 3. The "Lineage Individuation" Trap
  *   **Who:** Philosopher (Individuals/Lineages camp)
  *   **The Question:** "If species are historical individuals (lineages), they are unique particulars. By slicing them into temporal windows, you're treating them as *kinds* or classes again. You're saying 'anything that fits this cohesion profile for 100 years.' That destroys the individuality of the lineage. You've saved pluralism by killing realism."
  *   **Damage:** **Critical.** This attacks the ontological core of your thesis.
  *   **The Reply:** "I'm not slicing the lineage; I'm slicing the *causal integration*. A lineage is the whole thread. A species is a segment of that thread where causal integration (gene flow/ecology) is high enough to act as a unit of evolution. The individual is the whole history; the species is the phase where cohesion holds. We do this with 'organisms' all the time (is a caterpillar the same individual as the butterfly? Yes, but functionally distinct phases)."
  *   **Soft Spot:** The caterpillar/butterfly analogy is weak (metamorphosis vs. speciation). They may argue you've redefined 'species' to mean 'population phase.'
  *   **Confidence:** **50%** (This is the hardest metaphysical hit. Be prepared to concede some ground on 'individuality' vs 'phase').

  ### 4. The "Operationalist Disguise"
  *   **Who:** Philosopher (Pluralist camp)
  *   **The Question:** "You say species are 'real,' but if reality depends on a chosen window, isn't this just sophisticated operationalism? If I choose the window to get the answer I want, 'real' is doing no work. Why not just say 'useful constructs' and drop the ontology?"
  *   **Damage:** **Medium.** Undermines your claim to realism.
  *   **The Reply:** "Because the constraints aren't up to me. I can't choose a millennial window for a mayfly and get a coherent species. The biology sets the limits of the window. The *choice* of window is pragmatic; the *cohesion* within that window is objective. That's why it's real. It's like 'mountain.' The height cutoff is pragmatic; the geology is real."
  *   **Soft Spot:** The "mountain" analogy is classic sorites terrain. They might press on where the cutoff becomes arbitrary.
  *   **Confidence:** **80%** (Solid distinction between parameter choice and physical constraint).

  ### 5. The "Dual Nomenclature" Ghost
  *   **Who:** Mycologist
  *   **The Question:** "We spent decades abolishing dual nomenclature for sexual/asexual stages because it was a nightmare. You're proposing we reinstate it, but with time windows instead of morphs. One fungus, two names depending on whether you're looking at 10 years or 1000? How is this not the anamorph/teleomorph disaster all over again?"
  *   **Damage:** **Medium-High.** Invokes historical trauma in the room.
  *   **The Reply:** "Dual nomenclature was about *stages* of one individual. Windowed Cohesion is about *scale* of the population. It's not 'same organism, different name,' it's 'same population, different resolution.' But I hear you: we need a standard convention for the 'default' window in nomenclature, even if research uses others. Let's not confuse the database index with the research tool."
  *   **Soft Spot:** You might be forced to advocate for a "Standard Reference Window" for naming, which contradicts your pure pluralism.
  *   **Confidence:** **75%** (Distinguish stage vs. scale clearly).

  ### 6. The "Conservation Law" Implementation
  *   **Who:** (General Room / Policy leaning)
  *   **The Question:** "The Endangered Species Act protects *lists*. If a population is 'one species' at a 50-year window but 'three species' at a 500-year window, which one gets protected? If you say 'it depends,' you've given regulators a loophole to delist anything by just widening the window."
  *   **Damage:** **High.** Makes your theory politically dangerous.
  *   **The Reply:** "That's exactly why we need to index the unit. We should protect the 'Management Unit' defined by the horizon of the threat. If the threat is immediate habitat loss, use the decadal window. If the threat is evolutionary potential, use the millennial. Don't hide the value judgment. Current law pretends the list is objective; I'm saying make the objective function explicit so we can debate the horizon, not the biology."
  *   **Soft Spot:** Regulators hate explicit value judgments. They want "science" to tell them what to protect.
  *   **Confidence:** **85%** (Strong policy argument, though politically naive).

  ### 7. The Ring Species Terminus
  *   **Who:** (General Room / Evolutionary Biologist)
  *   **The Question:** "In your ring species case: gene flow is local, not global. At what point in the window does the cohesion break? If I walk the ring, it's one species. If I wait 10,000 years, the ends speciate. Does your window predict the break, or just describe it after it happens?"
  *   **Damage:** **Low.** This is a descriptive challenge, not a theoretical one.
  *   **The Reply:** "It describes the *capacity* for breakage. A short window sees the ring as cohesive (gene flow exists). A long window sees the terminal ends as distinct (no gene flow between them). The 'break' isn't an event; it's a function of the timescale you ask about. My theory predicts that asking 'is it one species?' without a timescale is the error, not the ring itself."
  *   **Soft Spot:** Doesn't solve the "where do we draw the line now" problem for immediate conservation.
  *   **Confidence:** **95%** (This is your strongest case study).

  ### 8. The Asexual "Niche" Stretch
  *   **Who:** Bacterial Taxonomist / Mycologist
  *   **The Question:** "For asexuals, you say cohesion is 'shared descent + shared niche.' But niches drift. If two clones diverge ecologically but haven't had time to accumulate genetic distance, are they one species or two? Your window seems to collapse genetic and ecological time."
  *   **Damage:** **Low.** Technical quibble.
  *   **The Reply:** "They are one species at a short window (descent dominates) and two at a long window (ecological divergence dominates). That's the point. In asexuals, the 'cohesion' decays slower genetically but faster ecologically. The window lets us weigh which matters for the question at hand."
  *   **Soft Spot:** Risks making 'species' mean nothing if genetic and ecological signals diverge immediately.
  *   **Confidence:** **90%** (Consistent with thesis).

  ---

  ## THE DREADED QUESTION (Hope they don't ask)
  **"Who picks the window?"**
  *   **Why it hurts:** If *you* (the scientist) pick it, it's subjective/arbitrary. If *nature* picks it, there must be a natural cutoff (which denies your pluralism). If *society* picks it, it's not science.
  *   **Prepared Answer:** "The *question* picks the window. If I ask about disease transmission, the window is epidemiological (months). If I ask about fossil classification, the window is geological (millennia). The error is assuming 'Species' is a noun that exists independent of the verb 'What are we asking?'."
  *   **Risk:** Sounds like linguistic relativism. If pressed, concede that there should be **community standards** for default windows per taxon, even if the ontology allows flexibility.

  ---

  ## CONFIDENCE FLAG SUMMARY
  *   **Highest Confidence:** Ring Species & Asexual cases (Questions 7 & 8). This is your data.
  *   **Medium Confidence:** Ornithology & Conservation Law (Questions 1 & 6). You have good analogies, but they face rigid systems.
  *   **Lowest Confidence:** **The Individualist Philosopher (Question 3).** This is the ontological weak point. If they argue that slicing a lineage destroys its status as an "individual," you may have to concede that "Species" are *phases* of individuals rather than individuals themselves. **Do not dig in here.** If they press hard, concede the terminology but hold the functional reality.

  ## STRATEGIC NOTE
  You have 40 minutes. That is an eternity.
  *   **Minutes 0-15:** They will test the boundaries (Ornithologists/Bacteria). Stand firm on the "Map Scale" analogy.
  *   **Minutes 15-30:** The Philosophers will try to trap you in ontology. Do not get bogged down in metaphysics. Pivot back to **Conservation Utility**. "Even if I'm wrong about the ontology, isn't this better for saving things than the current mess?"
  *   **Minutes 30-40:** Fatigue sets in. Keep answers under 60 seconds. If you ramble, they will smell blood.

  **Good luck. You're arguing for honesty over stability. They will hate it, but they'll respect the rigor.**
