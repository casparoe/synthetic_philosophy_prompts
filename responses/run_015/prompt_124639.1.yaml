  8.  **Final Polish:** Ensure the distinction between the two philosophers is clear (Pluralist vs. Individualist). Ensure the Bacterial objection captures the ANI/HGT nuance. Ensure the Ornithologist cares about the *type specimen*.

  *(Self-Correction during drafting)*: Make sure the "Windowed Cohesion" doesn't sound like "Evolutionary Significant Units" (ESUs) unless that's intended. The prompt says "Conservation law should index its units to a management horizon." I need to make sure the reply connects the theory to that policy recommendation.

