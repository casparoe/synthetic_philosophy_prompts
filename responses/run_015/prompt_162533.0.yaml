answer: |-
  1. The Kim family's secret humiliation and subsequent plotting against the Parks exemplify *ressentiment*, specifically visible when Ki-taek smells his own poverty during the flooding and when he finally snaps at Mr. Park during the birthday party massacre. These moments capture the slave morality's imaginary revenge, where the inability to act outwardly turns inward until it poisonously erupts.
  2. The mapping breaks because the Parks are not Nietzschean nobles creating values but bland consumers lacking the pathos of distance, meaning the Kims' revolt targets a vacuum rather than a genuine master morality. Without a true master to negate, the Kims' rebellion becomes a spiteful mimicry of status rather than a transvaluation of values.
  3. The obsession with the "crossing the line" smell functions less as *ressentiment* against the other and more as bad conscience, where the Kims internalize the Parks' disgust as a form of self-cruelty. This internalization turns the class barrier into a psychological wound that festers independently of any actual interaction with the rich.
  4. The lateral violence between the poor households suggests *ressentiment* requires a proximate enemy, while Ki-taek's unreflective stab aligns with Nietzsche's noble discharge only because an outlet finally appeared within arm's reach. This suggests the *Genealogy* underestimates how material proximity, rather than spiritual typology, dictates whether violence becomes active or reactive.
  5. The son's fantasy of buying the house reveals *ressentiment* not as a revaluation of values but as the same desire validated by a new buyer, proving the slave morality never escapes the master's economy. Ultimately, the film confirms the *Genealogy*'s diagnosis that *ressentiment* creates no new values, only a desperate wish to occupy the oppressor's position.
