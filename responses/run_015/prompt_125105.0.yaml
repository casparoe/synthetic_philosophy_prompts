prompt: |-
  Set out the most important implications of cross-cultural divergence in core philosophical intuitions—particularly regarding causation, moral responsibility, and epistemic justification—for the design and validation of normative reasoning benchmarks used to evaluate artificial intelligence systems. Concentrate on a specific design problem: benchmark vignettes are translated into languages with grammatical evidentiality marking that distinguishes direct from reported knowledge in ways English lacks, and the evaluation criterion assumes that a model should converge on a single, culturally invariant point of reflective equilibrium. Which of these implications undermine the benchmark's validity, which can be addressed by structural redesign rather than by abandoning universalist evaluation altogether, and does the documented variation ultimately defeat the presumption that one equilibrium point can serve as a cross-cultural standard? Keep the discussion conceptual; do not request citations, bibliographies, or specific empirical studies.
