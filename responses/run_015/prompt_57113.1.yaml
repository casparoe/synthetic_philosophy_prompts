answer: |-
  **Question 1: The Moral Weight of "Shape"**
  You argue that obligations attach to the shape of the future population rather than to specific individuals, allowing a future to be "worse" even if no one is wronged. But if moral value is fundamentally about how things go for persons, what ontological or normative status does this "shape" have that allows it to carry moral weight in the absence of any subject who can register a complaint?

  *   **Anticipated Response:** She will likely argue that value is impersonal; a state of affairs can be worse than another even if it is worse for no one, because "goodness" is not reducible to "good for."
  *   **Follow-up:** If goodness is detached from being "good for" someone, are we not abandoning the person-affecting intuition entirely in favor of a Platonic optimization of abstract patterns, and if so, why should current agents feel bound by patterns that no actual person can claim as their own?

  **Question 2: Commitments in Population Ethics**
  If the moral target is the shape of the population, does your view commit you to total aggregation rather than average wellbeing? Specifically, does it imply the Repugnant Conclusion, and on your account, would a policy that halves the future population size but raises the quality of every single life within it count as a moral improvement or a deterioration of the shape?

  *   **Anticipated Response:** She will likely attempt to avoid the Repugnant Conclusion by appealing to a "critical level" of wellbeing, but she must concede that halving the population reduces the total "value" of the shape if lives are worth living.
  *   **Follow-up:** So, on your view, we are obligated to prioritize the sheer number of lives over the intensity of wellbeing in those lives, provided those lives are above the critical threshold; does this not demand that we sacrifice the quality of the future simply to maximize its headcount?

  **Question 3: The Asymmetry of Harmless Wrongdoing**
  Your reasoning relies on the claim that identity-affecting acts cannot wrong the resulting individuals. But doesn't this same logic generate an asymmetry in other cases, such as medical negligence during conception that results in a disabled child who would not otherwise have existed? If the child cannot complain because they owe their existence to the negligence, does your view not classify clear cases of wrongdoing as "harmless" whenever they are identity-determining?

  *   **Anticipated Response:** She will likely distinguish between *wronging* a person and acting *wrongly*, conceding the act is wrong but denying the child is the victim of the wrong.
  *   **Follow-up:** If the act is wrong but there is no victim to whom the wrong is done, who is the bearer of the right that was violated, or are you forced to admit that "wrongdoing" here is merely a label for suboptimal states of affairs rather than a violation of duty?

  **Question 4: Temporal Decay of Wrongness**
  The first decades of climate warming will harm identifiable people who are already alive, while the far future impacts fall on unidentifiable people. Does the wrongness of a single ton of emissions decay with temporal distance on your account, or do we face a disjointed moral reality where the same emission constitutes a personal violation in 2050 but merely a shift in population shape in 2300?

  *   **Anticipated Response:** She will likely argue that the *principle* remains uniform (impersonal), but the *description* of the harm changes from person-affecting to non-identity based as the causal chain extends.
  *   **Follow-up:** If the moral character of an act shifts from "violating a right" to "altering a shape" solely based on how far down the causal chain we look, does this not make the moral status of our actions depend on arbitrary facts about generational overlap rather than the nature of the act itself?

  **Question 5: The Obligation to Procreate**
  If our duty is to bring about the best population shape, and more lives with positive wellbeing increase the total value of that shape, does your view generate a pro tanto obligation to procreate? If we can improve the shape by adding more happy people, are we currently failing in our duties by limiting family size, even if those specific children do not yet exist to complain?

  *   **Anticipated Response:** She will likely try to block this by appealing to costs to existing people or parents, arguing that the shape must be weighed against current sacrifices.
  *   **Follow-up:** But if the future shape carries independent moral weight, why do the interests of existing people automatically trump the value of adding new, happy lives to that shape, unless you are silently reintroducing a person-affecting constraint for the present but not the future?

  **Question 6: The Future Person's Defeat Condition**
  Imagine a person from that remote future meets you and attempts to argue that your policy was unjust. Given your view that their existence is contingent on the very policies they are criticizing, what specific claim would they have to articulate to defeat your position, or is their silence a necessary feature of your theory?

  *   **Anticipated Response:** She will likely admit that the future person cannot claim they were wronged, as they would not exist under the alternative policy, and thus cannot coherently demand a different past.
  *   **Follow-up:** If the very people most affected by your theory are logically barred from registering a coherent complaint against it, does this not insulate your view from the moral feedback of those it is supposed to protect, rendering it immune to correction by its subjects?

  **Question 7: Distinguishing from Future Nihilism**
  Finally, how do you distinguish your claim that "the far future matters impersonally" from the claim that "the far future does not matter at all"? If no future individual can hold us accountable, and no present individual experiences the loss, what practical difference does it make whether we say the future has impersonal value or no value?

  *   **Anticipated Response:** She will insist there is a difference because we still have reasons to act for the future, even if those reasons are not grounded in individual claims.
  *   **Follow-up:** But if those reasons never cash out as claims *by* anyone, nor experiences *for* anyone, are you not describing a morality that requires agents to serve a master that neither speaks nor feels, which is functionally indistinguishable from serving no master at all?
