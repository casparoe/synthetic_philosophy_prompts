prompt: |-
  hey — I'm in second year and my tutor on the Paradoxes and Puzzles module has let me take one of the Thursday small-group slots next week. I've got 45 minutes, a whiteboard, and the topic is supertasks, Thomson's lamp specifically. The group is mostly first-years and mixed: a couple of maths people who'll want to talk about convergent series, a couple who've done no maths since GCSE, and at least one who has read something online about those Newtonian point-mass setups where infinitely many colliding billiard balls end up firing one ball out.

  Don't explain supertasks to me, I've read the stuff. Plan how I explain it. What I'm stuck on is the order: does the "no last step" point have to land before they see the alternating sequence, or does the sequence come first so that "no last step" reads as a diagnosis rather than a slogan? Tell me why that order and not some other one — what depends on what. And which single case should carry the whole session, and why: I keep going back and forth between the plain lamp, a variant I made up where the switch is a ratchet (pressing it can only ever turn the lamp off, never back on), and another where it's a counter display that goes up by one each press, since those seem to behave differently at noon. What does the carrying example have to have, and what does it have to not have, for it to make the point instead of smuggling the point in?

  Misconceptions I'm expecting: "physics won't allow it so that's the answer", "the times converge so the state does too", "it's just undefined, nothing to see here", and the maths one saying the Newtonian examples show supertasks are fine so the lamp must be fine too. Where in the sequence does each get headed off — and is there one I should actually let them say out loud first, obvs? What should I flatly refuse to get into at this level, and say out loud that I'm refusing?

  Last thing: how do I tell in the final five minutes whether they've got the distinction between "the description doesn't settle it" and "there's no fact of the matter" — give me one question to put to them. British English please, and put at the very end \answer{...} containing the single sentence I'd want to overhear someone saying on the way out if the session actually landed.
