      *   *Counter Display (0, 1, 2, 3...):* State diverges. At $t=1$, what number? Infinity? This highlights that not all supertasks have a determinate limit. But it might distract into transfinite arithmetic.
      *   *Selection:* **The Plain Lamp.**
      *   *Why:* It's the canonical case. It forces the binary contradiction most sharply.
      *   *What it must have:* A binary state that toggles. No inherent directionality (unlike the ratchet).
