answer: |-
  # Protocol for the Evaluation of Non-Human Historical Actors
  **Series:** Synthetic World-History Texts (Undergraduate Level)  
  **Authority:** Senior Commissioning Editor  
  **Time Allocation:** 30 Minutes per Chapter Draft  
  **Objective:** To prevent anthropomorphism and environmental determinism while preserving valid materialist explanations.

  ---

  ## Part I: The Decision Procedure

  Execute the following four tests in strict order. Do not proceed to the next test if a **MANDATORY REVISION** is triggered.

  ### Test 1: The Agency Audit (Principle iii)
  **Question:** Does the text attribute intention, strategy, consciousness, or moral purpose to the non-human force?
  **Search Terms:** *Conquer, defeat, invade, punish, favour, decide, strategy, weapon, ally.*

  *   **Pass:** The force is described mechanistically (e.g., "spread," "cooled," "erupted," "inhibited").
  *   **Fail:** The force is described as an agent (e.g., "smallpox conquered the Incas").
  *   **Action:**
      *   **FAIL:** **STOP. MANDATORY REVISION.** Return to author. Require removal of agential metaphors. The force must be framed as a condition or event, not a subject.
      *   **PASS:** Proceed to Test 2.

  ### Test 2: The Variance Check (Principle i)
  **Question:** Does the text acknowledge that comparable societies experienced the *same* non-human force but achieved *different* outcomes?
  **Search Strategy:** Look for comparative language (e.g., "whereas," "unlike," "in contrast").

  *   **Pass:** The text identifies at least one case where the force was present but the historical outcome differed (e.g., two states faced drought; one collapsed, one adapted).
  *   **Fail:** The text implies a uniform outcome (e.g., "the cold caused global collapse") or ignores cases that contradict the trend.
  *   **Action:**
      *   **FAIL:** **STOP. MANDATORY REVISION.** The argument is environmentally deterministic. Require the author to integrate counter-examples or downgrade the force from "cause" to "stressor."
      *   **PASS:** Proceed to Test 3.

  ### Test 3: The Mediation Test (Principle ii)
  **Question:** After accounting for human institutional responses (policy, technology, social structure), does the non-human factor still explain the *primary* variance in the outcome?
  **Search Strategy:** Identify the explanatory weight assigned to human agency vs. the non-human force in the conclusion.

  *   **Outcome A (Sovereign Actor):** The non-human force explains the outcome even when institutions vary (e.g., a pathogen with 90% mortality regardless of governance).
  *   **Outcome B (Trigger/Context):** Human institutions explain the *variance* in outcomes (e.g., famine occurred everywhere, but starvation depended on grain policy).
  *   **Action:**
      *   **IF Outcome B:** The text must classify the force as a **Trigger** or **Background Context**, not a **Sovereign Actor**.
      *   **IF Text Claims Sovereignty but Evidence Shows Mediation:** **FLAG FOR EDITOR JUDGEMENT.** (See Test 4).
      *   **IF Text Aligns with Evidence:** Proceed to Test 4.

  ### Test 4: The Proportionality Judgement (Editor Discretion)
  **Question:** Is the narrative emphasis proportional to the causal weight established in Test 3?
  **Search Strategy:** Compare the chapter title, introduction, and conclusion against the findings of Test 3.

  *   **Scenario:** The evidence shows human mediation was decisive (Test 3, Outcome B), but the chapter is titled/focused on the non-human force (e.g., "The Volcano that Changed Europe").
  *   **Action:**
      *   **APPROVAL WITH ANNOTATION:** If the non-human force is a necessary trigger and the text clearly explains the human mediation. Add a series note clarifying the "Trigger vs. Cause" distinction for students.
      *   **EDITOR INTERVENTION:** If the title/framing misleads the reader regarding the primary driver. You must decide whether to rename the chapter or demand a rewrite of the thesis statement. This is a **VALUE-LADEN CHOICE** regarding series branding vs. historical precision.

  ---

  ## Part II: Application to Draft Proposals

  ### Case 1: Post-1492 Demographic Collapse (Pathogens)
  **Draft Claim:** Smallpox and measles were "conquerors" that "defeated" indigenous polities; minimal discussion of indigenous response.

  *   **Test 1 (Agency Audit):**
      *   *Observation:* Text uses "conquerors" and "defeated."
      *   *Result:* **FAIL.**
      *   *Action:* **STOP. MANDATORY REVISION.**
      *   *Editor Note:* The author must rewrite immediately. Pathogens cannot "conquer." This violates Principle (iii).
  *   **Test 2 (Variance Check):**
      *   *Observation:* (Hypothetical, had it passed Test 1) Text implies uniform collapse.
      *   *Result:* **FAIL.** Historical record shows variance (e.g., some groups survived via isolation or adaptation).
      *   *Action:* **STOP. MANDATORY REVISION.**
  *   **Test 3 (Mediation Test):**
      *   *Observation:* "Minimal discussion of varying indigenous public-health responses."
      *   *Result:* **FAIL.** Cannot establish sovereignty without ruling out mediation.
  *   **Final Verdict:** **Reject in current form.** The chapter requires a structural rewrite to remove anthropomorphism and integrate indigenous agency/resilience. The pathogen is a *trigger* for collapse, not the sole *actor*.

  ### Case 2: The Little Ice Age (17th Century Crises)
  **Draft Claim:** Little Ice Age was the principal driver of global crises; institutions were uniformly reactive.

  *   **Test 1 (Agency Audit):**
      *   *Observation:* No agential verbs found (temperature does not "strategise").
      *   *Result:* **PASS.**
  *   **Test 2 (Variance Check):**
      *   *Observation:* Text claims "global crises" and "uniformly reactive" institutions.
      *   *Result:* **FAIL.** This ignores states that stabilised or expanded during the period (e.g., Tokugawa Japan, certain Ottoman adaptations). It treats the force as a constant background condition producing uniform results.
      *   *Action:* **STOP. MANDATORY REVISION.**
      *   *Editor Note:* This is classic environmental determinism. The author must identify societies that *did not* collapse despite the cold. If they cannot, the claim of "principal driver" is unsustainable.
  *   **Test 3 (Mediation Test):**
      *   *Observation:* Institutions treated as passive.
      *   *Result:* **FAIL.**
  *   **Final Verdict:** **Reject in current form.** The argument violates Principle (i). The climate must be reclassified as a *stressor* that exposed institutional weaknesses, not a sovereign cause of collapse.

  ### Case 3: Tambora Eruption (1815/1816)
  **Draft Claim:** Eruption caused food crises/migration; state policy (UK vs. France) explains divergent mortality. Author expects approval.

  *   **Test 1 (Agency Audit):**
      *   *Observation:* Volcano described as an event, not an agent.
      *   *Result:* **PASS.**
  *   **Test 2 (Variance Check):**
      *   *Observation:* Text explicitly contrasts Britain and France (same ash cloud, different mortality).
      *   *Result:* **PASS.**
  *   **Test 3 (Mediation Test):**
      *   *Observation:* Author argues policy explains the *divergence*.
      *   *Result:* **PASS (with classification).** The non-human factor is a **Trigger**, not a Sovereign Actor. The human institution explains the *variance*.
  *   **Test 4 (Proportionality Judgement):**
      *   *Observation:* The chapter links the eruption to the crises (valid) but argues policy determined the *severity*.
      *   *Conflict:* If the chapter title is "Tambora and the Shaping of Europe," it implies Sovereign Actor status. If the text concludes policy was decisive, the title overpromises.
      *   *Action:* **EDITOR INTERVENTION REQUIRED.**
      *   *Editor Note:* The procedure validates the *history* but undermines the *hook*. The author expects approval because the science is sound, but the procedure reveals the *historical weight* lies with the state, not the volcano.
      *   *Decision:* **APPROVAL WITH ANNOTATION.** I will allow publication *only if* the introduction explicitly frames the volcano as the *shock* and the state as the *determinant*. I must add a series editor's note warning students against "disaster determinism." This is a value-laden choice: I am prioritising methodological rigour over the marketability of a "volcano story."

  ---

  ## Part III: Limitations of the Procedure

  As Senior Commissioning Editor, you must recognise that this protocol is a logical filter, not a historiographical arbiter. It cannot perform the following:

  1.  **Adjudicate Specialist Disputes:** The procedure cannot verify palaeoclimatic data or epidemiological models. If a author cites a fringe temperature reconstruction that passes the logic tests, this protocol will not catch the factual error. It checks *reasoning*, not *data validity*.
  2.  **Eliminate Normative Choices:** Test 4 (Proportionality) explicitly requires your judgement. Deciding whether a "Trigger" deserves a chapter title is a narrative choice, not a logical one. The procedure identifies the tension but cannot resolve it without your intervention.
  3.  **Substitute for Domain Expertise:** The protocol prevents *philosophical* errors (anthropomorphism, determinism) but not *technical* errors. It cannot distinguish between a plausible institutional explanation and a weak one; it only checks if the institution was *considered*.
  4.  **Resolve Competing Historiographies:** If one school of thought argues for climate determinism and another for institutional resilience, this procedure favours the latter by design (per your series principles). It cannot neutrally evaluate the former; it is built to filter it out.

  **Final Instruction:** Use this protocol to ensure methodological consistency across the series. Where the procedure demands revision, enforce it. Where it flags a judgement call, record your rationale in the commissioning file to maintain series coherence.
