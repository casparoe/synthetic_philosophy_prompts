answer: |-
  # Joint Statement on the Normative Status of Pascal's Mugging

  **Signatories:** The Binding Coalition (BC) and The Non-Binding Coalition (NBC)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Expected Utility and Tail Risks

  Following a series of good-faith adversarial collaborations, the undersigned parties submit this joint statement regarding the rational response to "Pascal's Mugging" scenarios. While we remain divided on the normative conclusion, we have clarified the scope of our disagreement, identified the technical cruxes sustaining it, and agreed upon the empirical or theoretical evidence that would resolve it.

  ### I. Agreed Claims

  1.  **The Scenario:** We agree on the canonical setup: An agent is approached by a claimant (the "mugger") who demands a small sacrifice $X$ (e.g., $5). The claimant asserts that failure to pay will result in a catastrophic outcome $Y$ (e.g., the destruction of $10^{100}$ lives) with probability $P$. We stipulate for the sake of argument that $P$ is non-zero and known to the agent (e.g., $P = 1/10^{90}$), such that the expected disutility $P \times Y$ vastly exceeds the cost $X$ under standard arithmetic.
  2.  **Rejection of Trivial Dismissals:** Both camps reject the resolution "just trust your intuition that the mugger is a scam." We agree that appealing to unanalyzed psychological skepticism begs the question. The dispute is not about the empirical likelihood of muggers in the actual world, but about the *normative principles* that govern rational choice when faced with low-probability, high-stakes claims.
  3.  **The Role of Expected Utility:** Both camps accept that Expected Utility Theory (EUT) is the standard baseline for rational decision-making. We agree that if EUT is applied naively with unbounded utility and stipulated non-zero probabilities, the calculation "binds" the agent to pay. The dispute is whether EUT should be applied naively, or whether it requires modification, constraint, or replacement in tail-risk regimes.
  4.  **No Physical Compulsion:** We agree that the term "binding" refers to *normative* necessity, not physical coercion. The Binding Coalition claims a rational agent *ought* to pay; the Non-Binding Coalition claims a rational agent *ought not* to pay. Neither side claims the agent is physically unable to refuse.
  5.  **Goal of Inquiry:** We agree that the objective is to identify a decision procedure that is (a) coherent (avoiding money pumps or Dutch books), (b) robust (not easily exploited by spurious claims), and (c) aligned with reflective equilibrium regarding rationality.

  ### II. Statements of Disagreement

  **The Binding Coalition (BC) maintains:**
  > "In any scenario where an agent assigns a non-zero credence $P$ to a threat of magnitude $Y$, and where $P \times Y > \text{Cost}$, rationality *requires* compliance. To refuse is to violate the axioms of Expected Utility Theory without a principled alternative. If this leads to counterintuitive results, the fault lies in human intuition, not the mathematics of rationality. To reject the mugger is to arbitrarily truncate the utility function or dogmatically assign zero probability to logically possible states."

  **The Non-Binding Coalition (NBC) maintains:**
  > "In scenarios involving extreme tail risks where the magnitude of $Y$ is disproportionate to the evidence supporting $P$, rationality *forbids* compliance. The Expected Value calculation fails to bind because the epistemic justification for $P$ cannot be decoupled from the magnitude of $Y$. As claims become more extraordinary, the required evidential support grows faster than the claimed utility. To pay is to violate principles of epistemic modesty and invite infinite exploitation. Rationality requires a decision criterion that is robust to hypothesis manipulation."

  ### III. Nature of the Dispute: Verbal or Substantive?

  We explicitly address whether this dispute is merely verbal. We conclude that the dispute is **substantive in the idealized case, but potentially verbal in the practical case.**

  *   **Substantive:** In the *idealized* thought experiment where $P$ is stipulated as a fixed, known non-zero number (e.g., via a divine guarantee or logical proof), the camps disagree on the action. The BC says "Pay"; the NBC says "Refuse." This is a genuine disagreement about the axioms of rationality.
  *   **Potentially Verbal:** In *practical* application, the disagreement often dissolves into a dispute over epistemic priors. If the NBC can convince the BC that rational priors must assign $P$ effectively zero (due to complexity penalties), the BC will agree "Don't Pay." Conversely, if the BC can convince the NBC that $P$ is genuinely non-zero and utility unbounded, the NBC might accept "Pay." Thus, much of the practical debate is about the *input* (the probability assignment) rather than the *processing* (the decision rule), though the camps disagree on whether the processing rule itself constrains the input.

  ### IV. Cruxes Table

  The following table identifies the specific technical sub-questions that sustain our disagreement. For each crux, we specify a concrete case or argument, and record each side's prediction regarding how that case bears on the rational decision.

  | Crux | Agreed Case or Argument Bearing on the Crux | Binding Coalition (BC) Prediction | Non-Binding Coalition (NBC) Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Epistemic Dilution ("Why Me?")** | **Case:** A mugger claims they can destroy the universe but states they are selecting a target uniformly at random from $N$ possible agents. As $N \to \infty$, does the probability of *this specific threat* targeting *you* dilute fast enough to negate the utility magnitude?<br><br>**Argument:** The "Why Me?" consideration suggests that the probability of the threat being directed at a specific agent scales inversely with the number of potential targets. | **Prediction:** Dilution is insufficient. Even if $P$ scales down by $1/N$, the claimed harm $Y$ can be stipulated to scale by $N^2$ (or simply be large enough). Rationality requires responding to the *absolute* expected value, regardless of how the probability was generated. | **Prediction:** Dilution is decisive. A threat capable of affecting $N$ agents cannot credibly target one specific agent without specific evidence. The probability of the *specific* claim being true must scale down at least as fast as the claimed impact scales up, rendering EV negligible. |
  | **2. Unbounded vs. Bounded Utility** | **Case:** The St. Petersburg Paradox variant. An agent is offered a sequence of gambles where the payoff doubles each round, but the probability halves. Does a rational agent prefer this gamble to a fixed finite sum?<br><br>**Argument:** If utility is unbounded, there exists some payoff large enough to dominate any probability. If utility is bounded, there is a ceiling beyond which more harm/good adds no disutility/value. | **Prediction:** Utility must be unbounded. Bounded utility implies that a rational agent would refuse a tiny probability of *infinite* heaven/hell, which is unacceptable. We must accept that EV dominates, even if it leads to Pascal's Mugging vulnerabilities. | **Prediction:** Utility must be bounded. Unbounded utility leads to incoherent preferences (no action can be ranked against another if both have infinite EV). Boundedness is the only way to preserve decision-theoretic coherence, effectively capping the mugger's leverage. |
  | **3. Decision Criterion (EUT vs. Robustness)** | **Case:** A choice between Action A (Sure loss of $5) and Action B ($10^{-100}$ chance of saving $10^{100}$ lives, else nothing).<br><br>**Argument:** Is Expected Utility Maximization the *only* rational criterion, or are robustness criteria (e.g., Maximin, Risk-Weighted EUT, Satisficing) permissible when model uncertainty is high? | **Prediction:** EUT is唯一 (unique). Alternative criteria are ad hoc and lead to dynamic inconsistency (money pumps). If the math says Pay, you Pay. To do otherwise is to prioritize psychological comfort over normative correctness. | **Prediction:** Robustness criteria are required. In regimes of extreme uncertainty where probabilities are not empirically grounded, EUT is an improper tool. A rational agent maximizes *robust* expected utility, which penalizes actions dependent on fragile, low-probability hypotheses. |
  | **4. Complexity Priors and Evidence** | **Case:** A mugger claims to be a "Matrix Lord." The complexity of the hypothesis "Matrix Lord exists" is measured in bits of information.<br><br>**Argument:** Solomonoff Induction suggests probabilities should be penalized by the complexity of the hypothesis. Does the complexity of the claim "I can harm $Y$ lives" scale with $Y$? | **Prediction:** No necessary scaling. One can imagine a simple mechanism (a button) that causes huge harm. The complexity of the *mechanism* does not necessarily scale with the magnitude of the *consequence*. Therefore, $P$ does not necessarily drop as $Y$ rises. | **Prediction:** Yes, necessary scaling. To specify *which* $Y$ lives are at stake, or to verify the power to affect them, requires information proportional to $\log(Y)$. The prior probability must drop at least as fast as the utility rises, canceling out the EV advantage. |

  ***

  **Signed,**

  *The Binding Coalition*
  *The Non-Binding Coalition*
