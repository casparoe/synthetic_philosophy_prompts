      *   Ideas are passive; Minds (Spirits) are active.
      *   Language/Signs: In *Alciphron* and *New Theory of Vision*, Berkeley distinguishes between arbitrary signs (words) and natural signs (visual cues for tactile outcomes). Natural signs have a stable grammar instituted by God, not men.

