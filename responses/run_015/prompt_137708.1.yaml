answer: |-
  This is an exceptionally sharp formulation of a problem that often gets glossed over in Berkeley scholarship. You have identified the precise friction point between his ontology (immaterialism) and his praxis (political economy).

  Here is the structural shape of the answer, testing your conjecture and addressing the detachability question.

  ### 1. Testing the Conjecture: Arbitrary vs. Natural Signs

  Your conjecture is correct, but it requires a specific calibration regarding Berkeley's theory of language.

  In *Alciphron* (specifically Dialogue VII), Berkeley moves away from the idea that words must stand for specific ideas to the idea that words function to **raise dispositions, emotions, or actions**. A sign does not need a static referent to be meaningful; it needs a functional outcome.

  *   **Arbitrary Signs (Words):** We institute these. We can lie with them. We can issue a word that has no cash-value in action.
  *   **Natural Signs (Vision):** God institutes these. The visual cue of a cliff *signifies* the tactile idea of a fall. You cannot arbitrarily decree that the visual cue signifies safety; the "grammar" of nature enforces the consequence.

  **Your Conjecture:** Currency acts like a natural sign (vision) rather than an arbitrary one (words).
  **Verdict:** **Confirmed, with a caveat.**

  Berkeley treats money as an **institutional sign with natural constraints**. The legislature can issue the sign (paper), which makes it arbitrary in origin. However, the *link* between that sign and the "industry" it commands is not arbitrary; it is governed by the laws of human psychology and social coordination (which, for Berkeley, are part of the divine order).

  If you issue paper signs in excess of the industry they can command, the sign fails to trigger the expected disposition (acceptance/trust). The "grammar" of the market breaks, just as the visual grammar of depth would break if you walked off a cliff that wasn't there.

  **Resolution of Tension 1:**
  The principled objection to purely nominal currency is not that it lacks material substance (Berkeley denies substance anyway), but that it lacks **causal efficacy**.
  *   If value were in the metal (materialism), the constraint would be physical scarcity.
  *   Since value is in the industry (idealism/volitionalism), the constraint is **psychological/volitional capacity**.
  You cannot issue tickets for more labor than the population is willing or able to perform. The "real, non-conventional constraint" you identified is the **finite capacity of minds to act**. The sign (money) must remain proportional to the potential volition (industry) it signifies.

  ### 2. Does Idealism Do Genuine Work?

  You ask if the economics is detachable from the metaphysics. The structural answer is **no**. The metaphysics provides the necessary ontological license for the economic scheme.

  Consider the alternative: Lockean Materialism.
  *   **Locke:** Money has value partly by consent, but gold/silver has a "natural value" based on durability and scarcity of the *substratum*.
  *   **Berkeley:** If you believe in a material substratum, you will always suspect paper is "fake" because it lacks the *stuff* of the gold.

  Berkeley's immaterialism dismantles the fetish of the substratum.
  1.  **Metaphysics:** A physical object is not a "thing-in-itself" but a bundle of ideas with predictive utility.
  2.  **Economics:** A coin is not a "store-of-value-in-itself" but a token of social coordination with predictive utility.

  The move is isomorphic. By denying that reality resides in inert matter, Berkeley frees "value" to reside entirely in **relations between minds**.
  *   If reality = ideas + minds, then Wealth = commands + labor.
  *   If matter is dead/passive, then Gold is dead/passive.
  *   If Mind is active, then Industry is active.

  Therefore, the metaphysics **licenses** the paper currency. If there were a material reality underlying value, replacing gold with paper would be a deception. Since there is no material reality underlying *anything*, replacing gold with paper is merely swapping one sign for another, provided the causal chain (expectation → industry) remains intact.

  ### 3. The Structural Synthesis

  Here is the unified structure of Berkeley's position, reconciling the two domains:

  **A. The Ontological Base**
  *   **Reality:** Spirits (Minds) and Ideas.
  *   **Matter:** A fiction. Inert stuff does not exist.
  *   **Causality:** Only Spirits have causal power (Will). Ideas are inert signs.

  **B. The Economic Translation**
  *   **Wealth:** Not a stockpile of inert stuff (gold), but a flow of causal power (industry/labor).
  *   **Money:** A technology of signs to synchronize the Wills of different Spirits.
  *   **Constraint:** The quantity of signs must match the available causal power (labor) in the system.

  **C. The Resolution of Your Puzzle**
  You suspected a pull-apart between "arbitrary signs" and "real constraints."
  *   **The Pull:** If money is just a sign, why can't we print infinite signs?
  *   **The Hold:** Because the sign's purpose is to move **Spirits**, not count **Matter**.
  *   **The Limit:** You cannot move more Spirits than exist, nor can you move them to do more work than is physically/mentally possible.

  The "real constraint" is not a material anchor (gold), but a **volitional anchor** (labor).

  ### 4. Conclusion: Relocation or Dissolution?

  Your conjecture does not merely relocate the difficulty; it dissolves it by correcting the category error in the initial formulation of the tension.

  The tension existed only if you assumed "sign" implied "arbitrary convention without consequence." Berkeley's mature semiotics (in *Alciphron* and *Vision*) argues that signs are tools for navigating a stable order instituted by God.
  *   In **Vision**, the stable order is optical/tactile laws.
  *   In **Economics**, the stable order is psychological/social laws.

  In both cases, the sign is conventional (we choose to look, we choose to print money), but the **consequence** of the sign is non-conventional (you fall if you step, you starve if you inflate).

  **Final Verdict:**
  Berkeley's economics is applied idealism. The fact that value resides in minds (expectations/wills) rather than stuff is precisely what allows him to advocate for a national bank. A materialist must worry about the metal; an idealist worries only about the coordination of minds. The "excess currency" warning is the idealist's equivalent of the physicist's warning about exceeding the elastic limit of a material: the structure holds only as long as the relations hold, regardless of the substrate.
