      Okay, so 8-10 total. 3 of them are the specific topics with follow-ups. The other 5-7 can be standard questions.

      *Let's refine the "Likely Answer" for the follow-ups.*
      *   *Fink/Mask:* She will likely say they are distinct kinds (intrinsic loss vs. extrinsic block). Follow-up: Does this imply dispositions are intrinsic essences?
      *   *Contrivity:* She will likely say "philosophical analysis requires precision, not just practical utility." Follow-up: Does this make metaphysics disconnected from science?
      *   *CP Clause:* She will likely say "It's circular." Follow-up: Does this mean dispositions are primitive?

      *Let's write the response.*

  5.  **Final Review against constraints:**
