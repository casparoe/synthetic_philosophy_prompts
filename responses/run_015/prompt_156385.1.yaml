hilosophers explain mathematical knowledge by positing a Platonic realm that causally interacts with human minds, I treat that as a classic skyhook. I also think that explaining a thermostat's temperature regulation by attributing to it a goal or desire is not a skyhook, even though it does not reduce the thermostat to its physical parts, whereas explaining human artistic creativity solely through sexual selection mechanisms strikes me as greedy reduction that eliminates the phenomenon it purports to explain.

