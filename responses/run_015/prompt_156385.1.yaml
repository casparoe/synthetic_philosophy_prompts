  Dear Friend,

  It is a pleasure to engage with such a carefully curated set of intuitions regarding the architecture of explanation. You have presented a rich tapestry of cases that span the natural sciences, social sciences, and philosophy, and your verdicts reveal a sophisticated, albeit complex, underlying logic. After examining your distinctions between legitimate cranes, illegitimate skyhooks, and greedy reductionism, I believe there is indeed a unifying principle that captures the spirit of your judgments, though applying it rigorously does require us to navigate some delicate boundaries. The principle that best harmonizes your verdicts is what I would call Explanatory Preservation via Tractable Structure. According to this view, a legitimate explanation must preserve the causal efficacy and distinct reality of the phenomenon at the level where it is defined, while simultaneously providing a tractable mechanism or formal structure that connects it to other levels without invoking magic or eliminating the phenomenon itself.

  When we apply this principle to your cases, the pattern becomes clear. Legitimate cranes, such as the evolutionary explanation of the eye or the institutional analysis of an empire's fall, respect the autonomy of the level at which the phenomenon exists. The eye is explained through adaptive steps that preserve its function as an optical organ, and the empire is explained through institutions and climate, which are the actual causal variables at that scale. Conversely, skyhooks fail because they suspend explanation from nothing, such as positing brute emergence without mechanism or a Platonic realm causally interacting with minds. These violate the requirement for tractable structure. Greedy reductionism fails because it violates the requirement for explanatory preservation. When the physicist explains the empire's fall via quantum states, or when evolutionary psychology explains Kantian morality as nothing but signaling, the explanation eliminates the very features that make the phenomenon what it is. Institutions do not exist at the quantum level, and normative validity does not exist at the level of survival strategy. By reducing the phenomenon to a substrate where its defining properties are invisible, the explanation explains away the thing it purported to explain.

  This principle leads to a specific prediction regarding your unmentioned case of psychiatric depression. If one explains depression primarily through inflammatory cytokine activity while largely bracketing psychological and social factors, this verdict should align with your rejection of the quantum-state explanation for the empire's fall. Depression is fundamentally defined by subjective mood states, behavioral changes, and social functioning. While cytokines may be a potent mechanistic cause, treating them as the primary explanation while ignoring the psychological level constitutes greedy reductionism. It attempts to locate the phenomenon entirely at a biological substrate where the disorder's defining features, such as despair or anhedonia, are not directly visible. Just as the empire's fall requires institutional analysis to be intelligible, depression requires psychological analysis to remain depression rather than becoming merely an immune response. Therefore, under your own logic, this explanation should be regarded as illegitimate greedy reductionism unless it is framed as a partial mechanistic crane that explicitly acknowledges the autonomy and causal relevance of the psychological level.

  Regarding the potential tension in your verdicts, specifically between your acceptance of Integrated Information Theory for consciousness and your rejection of evolutionary explanations for moral norms, I believe your intuitions are consistent provided we distinguish between structural mapping and eliminative genealogy. You accept Integrated Information Theory because it offers a formal, testable structure that attempts to measure consciousness without denying its reality. It is a constitutive claim about the nature of the phenomenon. In contrast, the evolutionary explanation of Kantian morality is rejected because it is an eliminative genealogical claim; it suggests that the normative content is nothing but a strategy, thereby undermining the validity of the morality itself. You are willing to accept a structural definition of consciousness, but not an eliminative origin story for normativity. However, if we were to impose a simpler, stricter principle such as All Explanations Must Be Grounded in Lower-Level Physics, then your acceptance of Integrated Information Theory without full physical grounding would become the vulnerable verdict. Positing consciousness as integrated information without deriving that integration from physics edges close to the Platonic skyhook you reject, as it risks treating information as a fundamental substance rather than a physical arrangement.

  If a simpler principle forces you to overturn one verdict, it should be the one regarding Integrated Information Theory. While it serves as a useful heuristic crane, defining consciousness as information without physical derivation risks becoming a skyhook if the link to physical implementation is never established, much like the Platonic realm. However, I would advise against overturning this verdict if you maintain your commitment to functional autonomy, as seen in your acceptance of chess algorithms and thermostat goals. The more robust principle is Explanatory Preservation, which allows for higher-level theories that are testable and structurally sound even if not fully reduced. Under this principle, your verdicts remain consistent, and the depression case stands as a clear instance of greedy reductionism. Your intuitions are largely sound, reflecting a commitment to a world where different levels of reality are real and causally potent, connected by bridges of mechanism and structure rather than suspended by hooks of magic or collapsed into the dust of atoms.

  Yours sincerely,

  A Philosophical Correspondent
