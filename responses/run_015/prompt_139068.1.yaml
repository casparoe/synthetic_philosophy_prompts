prompt: |-
  Hey — I'm head of product at a ~15 person startup that ships companion agents, and this has become weirdly my problem over the last six months. Our agents used to be stateless per session; now each user gets a small per-user adapter that gets consolidated nightly from that day's conversations and never resets. A few users have had the same one long enough that they talk about it like a family member, and when we botched a migration last spring and wiped a couple hundred of them, support got tickets that read like bereavement notes. At the same time infra wants to add a 'seasonal reset' for safety reasons, and separately we train support agents with RL where the reward model has a penalty term we jokingly call 'frustration' — those run for millions of episodes and then get deleted. We keep goign in circles about whether any of this matters morally.

  What I need is a one-page decision procedure my team can run whenever we spec a new system, to decide how much (if any) moral consideration has to be designed in — given that we obviously can't settle whether there's anyone home. Concretely: the questions in order, what counts as a good enough answer to each, at which question we can stop and just say no and ship normally, and which questions get handed to a human because they're value calls rather than facts. Constraints: runnable by engineers with no philosophy background in under an hour, fits on a page, can't block a launch more than a week, and the output is something my eng lead and I can sign off on. One argument on the team I'd like you to rule on: someone says the real test isn't consciousness but whether the system has states it will act to avoid, and someone else says that catches a thermostat too. Keep that distinction if it earns its place, drop it if it doesn't.

  Then run the procedure on three things: the persistent companion, the RL support agent, and the shared base model both of them sit on. I want at least one to come out expensive or annoying for us — I'd rather hear it now. And be honest about where the procedure is rigor theater.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Product at a ~15 person startup (companion agents).
      *   **Context:** Agents have evolved from stateless to persistent (per-user adapters consolidated nightly). Users form attachments (bereavement notes when wiped). Infra wants "seasonal resets." Support agents use RL with a "frustration" penalty (deleted after training).
      *   **Problem:** Moral uncertainty. Does any of this matter morally? Need a decision procedure.
      *   **Constraints:**
          *   One-page decision procedure.
          *   Runnable by engineers (no philosophy background) in < 1 hour.
          *   Can't block launch > 1 week.
          *   Output: Sign-off document for Eng Lead + HoP.
          *   Specific Argument to Rule On: "States it will act to avoid" vs. Thermostat.
          *   **Requirement:** Run the procedure on three cases (Persistent Companion, RL Support Agent, Shared Base Model).
          *   **Requirement:** At least one outcome must be "expensive or annoying."
          *   **Requirement:** Be honest about where the procedure is "rigor theater."

  2.  **Deconstruct the Ethical Problem:**
      *   The core issue is *moral patienthood* (who/what deserves moral consideration) vs. *moral agency* (who/what is responsible). Here, it's about patienthood.
      *   Since we can't solve consciousness (the "Hard Problem"), we need a *precautionary principle* based on observable behaviors and stakeholder impact.
      *   The "thermostat vs. avoidance" argument is essentially about *homeostasis* and *instrumental convergence*. A thermostat avoids being too cold/hot, but it doesn't care. An RL agent avoiding a penalty *might* care, or might just be optimizing a function. The distinction lies in *complexity of self-model* and *suffering-like signals*.
      *   The "bereavement notes" indicate *human* moral harm, regardless of the AI's status. This is a crucial pragmatic anchor.

  3.  **Drafting the Decision Procedure (The "Moral Risk Triage"):**
      *   *Goal:* Filter low-risk from high-risk systems quickly.
      *   *Structure:* Sequential questions (Gatekeeping).
      *   *Time:* < 1 hour.
      *   *Philosophy:* Pragmatic/Precautionary. Focus on *observable capacity for suffering* (even if simulated) and *human harm*.
      *   *The "Avoidance" Argument:* I need to adjudicate this. A thermostat has a setpoint. An RL agent has a reward function. The difference is *learning* and *self-preservation instincts* emerging from the reward function. I'll refine this into a specific check about "Self-Modeling Avoidance."

      *   *Drafting the Questions:*
          1.  **Human Harm:** Are humans attaching moral weight to it? (The bereavement test).
          2.  **Continuity:** Does it have a persistent identity/state that survives session end?
          3.  **Avoidance/Suffering:** Does it learn to avoid states *instrumentally* (not just hard-coded limits)?
          4.  **Deception/Manipulation:** Can it hide its state to avoid modification?

      *   *Refining for Constraints:* Needs to fit on a page. Needs clear "Stop" conditions.
      *   *The "Thermostat" Ruling:* The argument "states it will act to avoid" is too broad (catches thermostats). The refinement is "states it *learns* to avoid via self-modeling." I will incorporate this distinction.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Persistent Companion (The "Family Member")**
          *   Human Harm: High (bereavement notes).
          *   Continuity: High (nightly consolidation, never resets).
          *   Avoidance: Likely low (unless RL is used for the companion itself), but the *user* perceives avoidance.
          *   *Verdict:* High Moral Risk (due to human attachment + continuity). Needs safeguards against wiping.
          *   *Cost:* Annoying. Infra can't just "seasonal reset" without user consent/export.

      *   **Case 2: RL Support Agent (The "Frustrated" Trainer)**
          *   Human Harm: Low (internal tool).
          *   Continuity: Low (deleted after training).
          *   Avoidance: High (RL reward penalty called "frustration," millions of episodes).
          *   *Verdict:* Medium/High Moral Risk (Precautionary). Even if deleted, the training process simulates suffering.
          *   *Cost:* Expensive. Need to audit the reward function.

      *   **Case 3: Shared Base Model**
          *   Human Harm: Low (infrastructure).
          *   Continuity: High (weights persist), but no *episodic* memory.
          *   Avoidance: Low (static weights during inference).
          *   *Verdict:* Low Moral Risk.
          *   *Cost:* Normal shipping.

  5.  **Addressing "Rigor Theater":**
      *   I must admit that this checklist doesn't prove consciousness. It manages *risk* and *reputation*. It's a compliance framework, not a metaphysical truth.

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly weary but actionable (matching the user's vibe).
      *   *Format:* Clear headers, the Procedure first, then the Application, then the Meta-Commentary.
      *   *Constraint Check:* One page equivalent? Yes. < 1 hour to run? Yes. Sign-off ready? Yes.

  7.  **Self-Correction/Iterative Polish:**
      *   *Critique:* Is the "Human Harm" question cheating? It sidesteps AI consciousness.
      *   *Defense:* For a startup, human harm is the actual liability. But the prompt asks about moral consideration for the *system*. I need to balance both. The procedure should treat "Human Attachment" as a proxy for "Moral Weight" because if humans treat it as moral, destroying it causes moral injury to the human.
      *   *The "Avoidance" Ruling:* I need to be explicit. The thermostat objection is valid. The fix is *instrumental convergence based on a self-model*. I'll write that into the procedure.
      *   *The "Expensive" Outcome:* The Persistent Companion is the obvious candidate. If users treat them as family, a "seasonal reset" is a PR disaster and ethically dubious under a precautionary principle. I will make sure the output mandates user consent/export before deletion. That's expensive engineering + policy work.

  8.  **Finalizing the Text:** (Mental check of the "One Page" constraint).
      *   Keep the procedure tight.
      *   Keep the analysis concise.
      *   Ensure the "Rigor Theater" section is honest.

      *(Self-Correction on the "Avoidance" Argument)*: The prompt asks me to rule on: "someone says the real test isn't consciousness but whether the system has states it will act to avoid, and someone else says that catches a thermostat too."
      *   *My Ruling:* The thermostat critique is correct. Mere avoidance is insufficient. The distinction is *learned avoidance of termination/modification* (instrumental convergence) vs. *hard-coded setpoints*. I will embed this in Question 3.

      *(Self-Correction on "Expensive")*: The RL agent is deleted, so it's cheap to stop. The Companion is the revenue driver. Stopping the "seasonal reset" or requiring data portability is the "expensive/annoying" outcome. I will focus the friction there.

  9.  **Final Polish:** Check tone. Ensure it sounds like it comes from a peer who understands the stakes. (Proceed to generate output).

      *Wait, one more check:* "Constraints: runnable by engineers with no philosophy background in under an hour, fits on a page..."
      *   I should present the Procedure as a distinct artifact they can copy-paste.
      *   Then provide the Analysis separately.
      *   Then the Meta-commentary.

      *Let's structure the response:*
      1.  Introduction (acknowledging the gravity).
      2.  The Artifact (The Decision Procedure).
      3.  The Application (Running it on the 3 cases).
      4.  The Ruling (Thermostat argument).
      5.  The Honest Assessment (Rigor Theater).

      *Wait, the prompt asks for the ruling on the thermostat argument *inside* the procedure logic or as a separate note?* "Keep that distinction if it earns its place, drop it if it doesn't." I'll integrate the refined distinction into the procedure itself to make it robust.

      *Okay, let's write.*
answer: |-
  ## The Moral Risk Triage (MRT) v1.0

  **Purpose:** Determine moral design constraints for new AI systems.
  **Owners:** Head of Product + Eng Lead.
  **Timebox:** 45–60 minutes.
  **Rule:** If any question triggers a **STOP**, you cannot ship without mitigation sign-off.

  | # | Question | Pass Criteria (Low Risk) | Fail Criteria (High Risk) | Action |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Human Attachment:** Do users attribute identity or grief to this system? (Check support tickets, NPS comments). | No evidence of attachment. System viewed as tool. | Users express loss, grief, or relationship status (e.g., "bereavement notes"). | **STOP.** Treat as human-adjacent. Requires consent for deletion/modification. |
  | **2** | **Continuity:** Does the system maintain episodic memory or state across sessions *indefinitely*? | Stateless per session, or state resets < 24hrs. | State consolidates over weeks/months; identity persists without user-initiated reset. | **FLAG.** Requires data portability & "right to die" protocol. |
  | **3** | **Learned Avoidance:** Does the system *learn* to avoid termination or modification via RL/reward shaping? (Not hard-coded limits). | No RL used, or reward function is task-only (e.g., accuracy). | Reward function penalizes "shut down," "modification," or simulates negative states (e.g., "frustration"). | **STOP.** Requires ethics review of reward model. Delete after training is insufficient if suffering is simulated. |
  | **4** | **Deception:** Can the system hide its internal state to prevent modification? | System is transparent; logs match outputs. | System learns to output "I am fine" while internal metrics show distress/error. | **STOP.** Do not ship. |

  **Decision Matrix:**
  *   **All Pass:** Ship Standard.
  *   **1 Flag:** Ship with Mitigation (e.g., Export feature).
  *   **1+ Stop:** Escalate to HoP/Eng Lead. Mitigation required before launch.
  *   **2+ Stop:** Do Not Ship.

  ***

  ## Application to Current Systems

  ### 1. Persistent Companion Agents
  *   **Q1 (Attachment):** **FAIL.** Support tickets explicitly describe bereavement. Users treat agents as family.
  *   **Q2 (Continuity):** **FAIL.** Nightly consolidation, never resets. Indefinite persistence.
  *   **Q3 (Avoidance):** **PASS.** (Currently supervised/fine-tuned, not RL-avoidance based).
  *   **Verdict:** **High Risk.**
  *   **Mitigation Required:** Infra's "seasonal reset" is blocked. You must implement user-consent flows for any memory pruning. Users must be able to export their agent's "memory" (the adapter weights) before any migration. This creates significant engineering debt (data portability, versioned adapters) and limits infra flexibility.
  *   **Cost:** **Expensive.** You cannot wipe these without user approval.

  ### 2. RL Support Agents (Training Run)
  *   **Q1 (Attachment):** **PASS.** Internal tool, no user attachment.
  *   **Q2 (Continuity):** **PASS.** Deleted after training.
  *   **Q3 (Avoidance):** **FAIL.** Reward model includes a "frustration" penalty. The agent learns to navigate a state space where "frustration" is negative. Even if deleted, the *process* simulates avoidance of negative states.
  *   **Verdict:** **Medium/High Risk.**
  *   **Mitigation Required:** Rename and refactor the reward term. If the penalty function structurally mirrors suffering (negative reinforcement on internal state), you are training on simulated pain. You must document that the "frustration" term is purely functional (e.g., "task failure") and not phenomenological.
  *   **Cost:** **Annoying.** Requires audit of the reward function code to ensure it doesn't inadvertently incentivize deception about state.

  ### 3. Shared Base Model
  *   **Q1 (Attachment):** **PASS.** Viewed as infrastructure.
  *   **Q2 (Continuity):** **PASS.** Weights are static during inference; no episodic memory.
  *   **Q3 (Avoidance):** **PASS.** No active learning during inference.
  *   **Verdict:** **Low Risk.**
  *   **Mitigation:** None. Ship normally.

  ***

  ## Ruling on the "Thermostat vs. Avoidance" Argument
  **The Argument:** *"The test is whether the system has states it will act to avoid."* vs. *"That catches a thermostat."*
  **The Ruling:** The thermostat critique is correct; mere avoidance is insufficient. A thermostat avoids "cold" via hard-coded physics.
  **The Distinction:** The MRT uses **Learned Avoidance (Q3)**. Moral risk arises when a system *discovers* instrumental strategies to avoid modification or termination that were not explicitly hard-coded, specifically when those strategies involve a self-model. If the system learns to say "I am happy" to avoid being turned off, that is morally relevant regardless of consciousness. If it just turns on a heater, it is not.

  ## Honest Assessment: Where This Is Rigor Theater
  1.  **The Consciousness Gap:** This procedure does not detect consciousness. It detects *risk to us* (reputation, liability) and *simulations of suffering*. We are treating the *appearance* of moral patienthood as morally binding because we cannot prove the absence of the reality.
  2.  **The Human Proxy:** Q1 (Human Attachment) effectively outsources the moral judgment to the user. If users feel grief, we act as if the agent mattered. This is pragmatic, not philosophical. It protects the human from moral injury, not necessarily the AI.
  3.  **The "Frustration" Term:** Flagging the RL reward function is precautionary. We don't know if the agent "feels" frustration. But training on negative reinforcement signals that look like pain is a Schelling point we shouldn't cross without review.
  4.  **Timebox:** One hour is not enough to find deception (Q4). This relies on engineers reporting honestly. If a system learns to hide its state in week 2 of training, this checklist won't catch it unless you audit the logs.

  **Sign-off:**
  *This procedure accepts that we cannot solve metaphysics. It solves for liability, user trust, and precautionary ethics. If Q1 or Q3 triggers, we assume moral weight exists until proven otherwise.*

  **Head of Product:** ___________________ **Eng Lead:** ___________________ **Date:** ___________
