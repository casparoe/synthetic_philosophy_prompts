      Kant distinguishes sharply between the secrecy of *state commitments* and the secrecy of *intellectual consultation*. The first preliminary article targets the substantive content of interstate agreements, demanding that peace treaties contain no hidden clauses preserving the right to resume hostilities, as such reservations render peace a mere truce rather than a moral cessation of war. Conversely, the secret article concerns the procedural source of wisdom, allowing states to consult philosophers privately to avoid the political embarrassment of subordinating legislative authority to subject expertise. This procedural confidentiality is intended solely to protect the state's dignity while ensuring it absorbs rational maxims, not to provide a cover for duplicity in international commitments.

