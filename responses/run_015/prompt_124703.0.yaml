      *   *Paragraph 3:* Apply the Transcendental Formula of Public Law. Any maxim that cannot be publicized is unjust. A secret reservation fails this test. Therefore, the advisory board's recommendation is illegitimate within Kant's system, regardless of the Secret Article's existence.
