      *   **Topic:** Immanuel Kant's 1795 essay *Toward Perpetual Peace* (*Zum ewigen Frieden*).
      *   **Specific Tension:** The conflict between the Preliminary Articles (prohibiting secret treaties/reservations for future war) and the Second Supplement (advocating a "secret article" where philosophers advise states secretly).
      *   **Concrete Scenario:** A modern federation institutionalizes the secret article via classified advisory boards that recommend hidden strategic reservations due to undefined costs of open commitment.
      *   **Question:** Does the preliminary prohibition apply only to formal interstate treaties (leaving internal reservations untouched), or does the secret article risk collapsing into the condemned concealed reservation?
