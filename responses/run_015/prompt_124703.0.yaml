      *   **The Role of Philosophers:** Kantian philosophers are defined by their commitment to public right. If they advise secret reservations for war, they cease to function as Kantian philosophers and become mere technocrats of power.
      *   **Transcendental Formula of Public Law:** Kant introduces this later (Second Section of Part II). "All actions relating to the right of other men are unjust if their maxim is not consistent with publicity." A secret reservation for war fails this test immediately.
      *   **The Scenario's Failure:** The modern federation's board recommending hidden reservations violates the Transcendental Formula. The Secret Article was meant to smuggle *reason* into power, not *realpolitik* into reason.
      *   **Conclusion:** The Preliminary Articles set the substantive conditions for peace; the Secret Article sets a procedural condition for wisdom. Substance overrides procedure if they conflict on the core definition of peace.

