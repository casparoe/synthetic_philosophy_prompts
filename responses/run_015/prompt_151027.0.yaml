  # Seminar Plan: The Taxonomic Tribunal
  **Topic:** The Metaphysics of Natural Kinds (The Species Problem)
  **Time:** 90 Minutes
  **Participants:** 12 Grad Students (3 Groups of 4)
  **Goal:** Experiential failure of categorization prior to theoretical framing.

  ---

  ## 1. The Setup & Rules (Handout)

  **The Premise:** You are the Supreme Taxonomic Tribunal. Your job is to stabilize reality by assigning organisms to species. You cannot invent new species names; you must sort cards into **Species Box 1**, **Species Box 2**, or the **Liminal Pile** (Exile).

  **The Frameworks (Assigned Secretly):**
  *   **Group A (Morphological Essentialism):** Species are defined by shared physical properties and intrinsic essences. If it looks the same, it is the same.
  *   **Group B (Biological Species Concept):** Species are reproductively isolated communities. If they can exchange genes, they are the same; if not, they are distinct.
  *   **Group C (Phylogenetic Lineage):** Species are the smallest diagnosable monophyletic lineages. Ancestry and derived traits define the boundary.

  **The Scoring:**
  *   **+2 Points:** Unanimous agreement *within* your group on a card.
  *   **+1 Point:** If your group's classification matches *another* group's classification for the same card (Cross-Paradigm Consensus).
  *   **-2 Points:** Every card placed in the **Liminal Pile**.
  *   **Constraint:** You are allotted a **Budget of 4 Exiles** per group. You *cannot* exile more than 4 cards. You must categorize the rest.

  **The Rounds:**
  1.  **Round 1 (Silent Sorting):** 20 mins. No talking outside your group. Sort the 16 cards.
  2.  **Round 2 (The Defense):** 25 mins. Groups reveal their Liminal Piles. You must justify why those cases broke your framework.
  3.  **Round 3 (Negotiation):** 20 mins. Open floor. Groups can trade classifications to maximize Cross-Paradigm Consensus points.
  4.  **Debrief:** 25 mins.

  ---

  ## 2. The Case Cards (16 Total)

  *Design Logic: The first 11 stress standard biological tensions. The final 5 (4 synthetic + 1 wildcard) attack the metaphysical substrate of "life" itself.*

  ### Standard Biological Edge Cases (1-11)
  1.  **The Larval Mismatch:** Two adult forms look identical; genomic sequencing reveals they cannot interbreed. (Hits Morphology)
  2.  **The Ring:** Population A breeds with B, B with C, C with D... D cannot breed with A. Continuous range. (Hits BSC transitivity)
  3.  **The Mule:** Horse + Donkey parents. Sterile offspring. Viable individual. (Hits BSC isolation criteria)
  4.  **The Whiptail Lizard:** All-female population. Reproduces via parthenogenesis. No males exist. (Hits BSC requirement)
  5.  **The Fossil Fragment:** Single skeletal remain. No DNA. No behavioral data. (Hits BSC & PSC diagnosability)
  6.  **The Hybrid Zone:** Two distinct populations meet and produce fertile hybrids for 50km, then diverge again. (Hits BSC "porosity")
  7.  **The Phenotypic Plasticity:** Same genome, but aquatic form looks radically different from terrestrial form. (Hits Morphology)
  8.  **The Cryptic Complex:** 12 genetically distinct lineages, morphologically indistinguishable. (Hits Morphology)
  9.  **The Horizontal Gene Transfer (Bacteria):** Organism swaps 30% of genome with distant "relative" instantly. (Hits PSC Tree structure)
  10. **The Temporal Isolate:** Same location, same look, but one breeds in Spring, one in Fall. Never meet. (Hits BSC vs. Morphology)
  11. **The Polyploid Plant:** Instant speciation via chromosome doubling. Can't breed with parents, but looks identical. (Hits Morphology & BSC)

  ### Synthetic / Niche Cases (12-16)
  12. **The Chimera (Cross-Kingdom HGT):** A eukaryote that incorporates a functional bacterial genome via HGT, reproduces clonally, but passes the bacterial genes vertically. It accumulates mutations.
      *   *Metaphysical Stress:* Violates the "Tree of Life" assumption. Is it one lineage or two fused?
  13. **The Digital Organism:** Self-replicating code in a server. Mutates, selects, adapts. No material substrate, no cells, no DNA.
      *   *Metaphysical Stress:* Challenges materialism. If function is all that matters, is this a natural kind?
  14. **The Synthetic Protocell:** Lipid vesicle created in a lab. Metabolizes and divides. No evolutionary history yet.
      *   *Metaphysical Stress:* Challenges historical essentialism. Can a kind exist without a past?
  15. **The Sleeper Seed:** Viable seed from 2,000 years ago. Germinates today. Cannot breed with current population (temporal isolation), but genetically identical.
      *   *Metaphysical Stress:* Challenges the "community" aspect of BSC across time.
  16. **The Simulation Glitch:** An organism that exists only when observed; data corrupts when unmeasured (quantum biological edge case).
      *   *Metaphysical Stress:* Challenges observer-independent reality of kinds.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity | Instructor Role |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Intro** | Distribute packets. Assign Frameworks (sealed envelopes). Explain Rules & Scoring. | Enforce silence. Ensure groups don't peek at other frameworks. |
  | **10-30** | **Round 1** | **Silent Sorting.** Groups discuss internally and mark cards: Sp. 1, Sp. 2, or Liminal. | Circulate. Note which cards cause the most friction. Do not answer content questions. |
  | **30-55** | **Round 2** | **The Defense.** Each group announces their Liminal Pile (max 4). Must explain *why* their framework broke. | Whiteboard the "Cause of Death" for each exiled card (e.g., "BSC broke on Asexuals"). |
  | **55-75** | **Round 3** | **Negotiation.** Groups can reclassify cards to match others for +1 points. Exiles are final. | Facilitate debate. Encourage Group A to argue with Group B about Card 3 (Mule). |
  | **75-90** | **Debrief** | **Metaphysical Mapping.** (See below). | Connect game frustration to literature. |

  ---

  ## 4. The Debrief: Mapping Frustration to Metaphysics

  *Do not lecture. Ask questions that map their game experience to the texts.*

  **1. The Growing Liminal Pile (Eliminativism)**
  *   *Ask:* "Group B, you exiled the Whiptail Lizard. Did you feel you were failing biology, or failing the concept?"
  *   *Map:* This is **Michael Ereshefsky's Eliminative Pluralism**. If the category 'species' requires exiling real, existing biological entities to maintain coherence, perhaps the category 'species' does not carve nature at its joints. The Liminal Pile is the graveyard of Natural Kind Realism.

  **2. The Cross-Group Argument (Pluralism)**
  *   *Ask:* "Group A and C agreed on the Cryptic Complex, but B disagreed. Who was 'right'?"
  *   *Map:* This is **Philip Kitcher's Pluralistic Realism**. There is no single 'True' classification. There are only classifications that serve specific explanatory purposes. If you want to study reproduction, B is right. If you want to study ancestry, C is right. The friction isn't a bug; it's a feature of multidimensional reality.

  **3. The Synthetic Cases (The Substrate Problem)**
  *   *Ask:* "Card 13 (Digital Organism). Group C, did you exile it because it has no lineage, or no matter?"
  *   *Map:* This targets **Material Essentialism vs. Functionalism**. If a digital organism evolves, is it a biological kind? If you said no, you are committed to a material substrate (carbon chauvinism). If you said yes, you are committed to process metaphysics (Hull/Ghiselin).
  *   *Key Point:* The Chimeras (Card 12) break the "Tree" metaphor. If lineages fuse, is the Phylogenetic Concept metaphysically incoherent for all life, or just most?

  **4. The Individuality Thesis**
  *   *Ask:* "Did anyone treat 'Species' as a *class* (defined by properties) vs. a *particular* (a historical individual)?"
  *   *Map:* **Ghiselin & Hull**. If you treated species as individuals (spatiotemporally localized), the Fossil (Card 5) and Sleeper Seed (Card 15) become nightmares because the 'individual' is discontinuous in time.

  ---

  ## 5. Honest Limitations (The "Instructor's Note")

  *Share this verbally at the very end.*

  "This game simulates a **synchronic metaphysical crisis**, but it misses two crucial features of actual taxonomy:
  1.  **Diachronic Stability:** In reality, taxonomists don't decide in 90 minutes. They argue for 50 years. The 'failure' you felt is often resolved by pragmatic convention, not metaphysical truth. We stabilize terms for communication, not because nature forced us to.
  2.  **The Pragmatic Escape:** Real biologists often use the 'Portmanteau Solution.' They use BSC for birds, Morphology for fossils, and Phylogenetics for bacteria. They don't seek a Unified Theory. This game forced you to seek consistency where practitioners seek utility."

  ---

  ## 6. Prediction: What Will Go Wrong (First Run)

  **The Failure Mode: The "Exile Budget" Panic**
  *   **Prediction:** You predicted they would exile everything to avoid penalties. I added an **Exile Budget (Max 4)** to stop this. However, the new failure mode will be **Arbitrary Categorization**.
  *   **What happens:** In Round 1, Group B (BSC) will realize they *must* categorize the Asexual Whiptail (Card 4) because they ran out of exile budget. They will arbitrarily shove it into "Species 1" just to save points.
  *   **The Teaching Moment:** When this comes out in Round 2, pounce on it. "You knew this organism broke your definition, but you categorized it anyway to win the game."
  *   **Metaphysical Link:** This is **Pragmatic Instrumentalism**. Scientists often force data into categories not because the category fits, but because the *system* requires a label. The "game" of publishing requires a species name. The students just replicated the sociological pressure of academia.

  **Secondary Failure: The Digital Organism Dismissal**
  *   **Prediction:** Groups will dismiss Card 13 (Digital) as "Not Biology, ignore it."
  *   **The Teaching Moment:** This reveals a hidden premise: **Carbon Chauvinism**. If your metaphysics of natural kinds relies on "life," you must define life. If you exclude the digital organism *a priori*, you are defining species by substrate, not process. This opens the door to discussing whether natural kinds are mind-independent or theory-dependent.

  **Tertiary Failure: Groupthink**
  *   **Prediction:** One dominant voice in each group will dictate the sorting to save time.
  *   **Mitigation:** In Round 2, ask a *different* student from each group to justify the Liminal Pile. This ensures the "failure" was processed by the whole group, not just the leader.

  ---

  ## 7. Preparation Checklist
  *   [ ] Print 3 distinct Framework Instruction Sheets (keep them secret from other groups).
  *   [ ] Print 12 Sets of the 16 Cards (4 sets per group).
  *   [ ] Whiteboard markers (3 colors).
  *   [ ] Scoreboard (drawn on board).
  *   [ ] Timer (visible to students).
  *   [ ] Small prizes (optional, e.g., "Best Metaphysical Argument" chocolate bar) to incentivize Round 3 negotiation.

  **Final Advice:** Your role is not to resolve the tension. If they leave the room agreeing that "Species are real but complicated," you have failed. You want them leaving thinking, "I'm not sure 'species' refers to anything real at all." Sit with the silence after the debrief. Let the uncertainty hang.
