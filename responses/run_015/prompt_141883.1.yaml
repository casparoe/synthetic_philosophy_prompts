  3.  **Evaluate the Three "Chewing Points":**
      *   *Composition (Selection bias):* In low-equality countries, only elite women go to uni. In high-equality, mass participation. This changes the *mean* of the female distribution.
      *   *Field Supply (Occupational structure):* Welfare states create "care" jobs that require degrees. This pulls women away from STEM not because of preferences, but because of available, prestigious, secure alternatives.
