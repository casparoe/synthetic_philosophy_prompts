      *   *Skinnerian Creatures:* Operant conditioning. The creature tries things, gets rewarded/punished. If the action fails, the creature learns (but might suffer). *Key: Selection happens within a lifetime via reinforcement.*
      *   *Popperian Creatures:* Internal simulation. The creature can test hypotheses *before* acting. "Let your hypotheses die in your stead." *Key: Selection happens internally before action.*
