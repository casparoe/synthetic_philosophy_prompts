      *   *Crucial Nuance:* These are not mutually exclusive boxes. They are *layers*. A Gregorian mind *contains* a Popperian mind, which *contains* a Skinnerian mind, which *contains* a Darwinian body. The user's "four-way split" implies mutual exclusivity, which is the source of the tangle.

