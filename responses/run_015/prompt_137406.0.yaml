          *   *Defeater:* The "Relevance" Problem. A subsystem tracks the whole *relative to some objective function*. Without the objective, the "sufficient statistic" is undefined or infinite. The "agency" part defines the compression.
      *   *The "Self-Fulfilling/Transparent Predictor" Test:*
