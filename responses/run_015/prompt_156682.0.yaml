answer: |-
  The package you describe is not the product of a single, coherent political theory. It is an **unstable compromise** between two incompatible conceptions of the workplace: **Majoritarian Industrial Democracy** (the Wagner Act ideal) and **Market Liberalism** (the Taft-Hartley correction).

  However, if one must identify a unifying logic that attempts to stitch these contradictions together, it is **Industrial Pluralism**. This theory posits that capitalism functions best when conflict is institutionalized rather than suppressed. It grants labor a "countervailing power" to balance capital, but strictly contains that power within defined channels to prevent systemic disruption.

  Here is the reconstruction of the doctrine, the analysis of the strike rule, and the test against the proportional representation variant.

  ### I. The Theoretical Architecture: Pluralism or Compromise?

  The law presupposes a hybrid agency. It treats the bargaining unit as a **political constituency** for the purpose of selecting a representative, but as a **market aggregate** for the purpose of funding and exiting that representation.

  **1. The Collectivist Half (Majoritarian Industrial Democracy)**
  *   **Features:** Exclusive representation, binding contracts on dissenters, Duty of Fair Representation (DFR), protection for Unfair Labor Practice (ULP) strikers.
  *   **Strict Presupposition:** This half presupposes that the workplace is a **private government**. Just as a elected legislature binds all citizens within a district, the certified union binds all workers in the unit. The "Duty of Fair Representation" is the constitutional safeguard against this majoritarian tyranny, analogous to equal protection.
  *   **Philosophical Fit:** Civic-Republicanism. It prioritizes the collective good (industrial stability, uniform terms) over individual consent. It assumes that without exclusive representation, worker power fragments, and the "countervailing force" fails.

  **2. The Individualist Half (Market Liberalism)**
  *   **Features:** Right-to-work (no compelled dues), ban on secondary boycotts, permanent replacement of economic strikers.
  *   **Strict Presupposition:** This half presupposes that the workplace is a **sphere of voluntary exchange**. Association must be consensual (no compelled speech/dues), and economic conflict is a private dispute between specific parties (no dragging in neutrals).
  *   **Philosophical Fit:** Classical Liberalism. It prioritizes negative liberty (freedom *from* the union) and property rights (the employer's right to operate/replace).

  **3. Where the Doctrine is Underdetermined**
  The tension is most visible in the **free-rider problem**.
  *   *Exclusive Representation* logically requires *compelled dues* (agency fees) to prevent dissenters from benefiting from the contract without paying for its negotiation. To allow dissenters to free-ride while binding them to the contract is logically inconsistent unless the state is subsidizing the union's "public good" function.
  *   *Right-to-Work* statutes exploit this underdetermination. They accept the *benefits* of the collectivist model (the contract binds the dissenter) while rejecting the *burdens* (the dissenter need not pay). This is not licensed by Liberalism (which would reject binding the dissenter) nor Republicanism (which would require contribution). It is a pragmatic political carve-out that renders the "exclusive representative" financially vulnerable.

  ### II. The Strike and Replacement Rule

  You ask what permitting permanent replacement presupposes. It presupposes that the **job is the employer's property, not the worker's.**

  **1. Economic Strikes: A Trial of Endurance**
  Under *NLRB v. Mackay Radio & Telegraph Co.*, the right to strike is a **liberty**, not a **claim-right**.
  *   **Presupposition:** An economic strike is a collective resignation. The workers are saying, "We will not work under these terms." The employer is entitled to say, "Then I will find others who will."
  *   **The Theory:** This fits the **Market Liberal** view. It treats the strike as a test of relative economic endurance. The "right" is merely the immunity from lawsuit for breach of contract; it is not an immunity from the economic consequences of withholding labor.
  *   **Can a right survive being this costly?** Yes, but it ceases to be a *social right* and becomes a *market risk*. If the cost of exercising a right is the loss of one's livelihood, the right is effectively reserved for the wealthy or the desperate. In labor law, this signals that the "right to strike" is not a fundamental human right, but a regulated economic weapon.

  **2. ULP Strikes: A Vindication of Law**
  *   **Presupposition:** When the employer breaks the law (ULP), the strike is no longer economic warfare; it is **law enforcement**.
  *   **The Theory:** Here, the **Civic-Republican** view dominates. The workers are acting as private attorneys general to restore the rule of law in the workplace. Therefore, they cannot be permanently replaced, because the state cannot allow an illegal actor (the employer) to profit from the disruption caused by his own illegality.

  **3. The Inconsistency**
  The distinction reveals that the law protects **statutory compliance** more vigorously than **economic bargaining**. The "right to strike" is robust only when it serves the state's interest in enforcing the NLRA, not when it serves the workers' interest in redistribution.

  ### III. The Variant Test: Proportional Representation

  Now, test this reconstruction against a regime of **proportional, continuously revisable representation** (multiple unions, no exclusive bargaining, membership-only contracts).

  **1. Would the Replacement Rule Change?**
  **Yes, drastically.**
  *   **Current Logic:** The ban on replacing ULP strikers relies on the union's status as the *exclusive* representative. Because the union *must* represent everyone, the law protects the union's ability to function.
  *   **Variant Logic:** In a proportional system, the union is a **private voluntary club**. It owes no duty to non-members.
      *   *Economic Strikes:* If a union member strikes, they are breaching their individual employment contract (unless a no-strike clause is waived). The employer hires a replacement who might join a rival union or no union. Permanent replacement would likely become the default for *all* strikes, including ULP protests, because the "industrial stability" justification for protecting the incumbent workforce evaporates. The strike becomes a pure quit.
      *   *ULP Strikes:* Without exclusive representation, the concept of a "bargaining unit" violation dissolves. An ULP would be a violation of individual rights, not collective rights. Remedies would likely shift to individual damages rather than reinstatement.
  *   **Conclusion:** The protection against permanent replacement is inextricably linked to **Exclusive Representation**. Remove the monopoly status of the union, and the strike reverts to a common-law breach of contract, fully exposing the worker to replacement.

  **2. Would the Ban on Secondary Pressure Change?**
  **No, it would likely stand.**
  *   **Reasoning:** The ban on secondary boycotts is rooted in **Market Liberalism**, not Industrial Pluralism. It protects "neutral" third parties from being dragged into disputes they cannot resolve.
  *   **Variant Fit:** In a proportional system, unions might be weaker, but the principle of neutrality remains. If anything, the ban might become *stricter*, because fragmented unions might resort to guerrilla tactics (secondary pressure) to compensate for their lack of bargaining power. The law would maintain this ban to contain conflict within the primary employment relationship.

  **3. Which Half is Doing the Real Philosophical Work?**
  The **Collectivist/Exclusive Half** is doing the work of **protection**; the **Individualist Half** is doing the work of **constraint**.

  *   **In the Current System:** The *Collectivist* features (Exclusive Representation, DFR, ULP protection) are the only things preventing the law from being purely employer-dominant. They create a "status" of employment that is more than at-will.
  *   **In the Variant:** If you remove the Collectivist half (Exclusive Representation), the system collapses into **Market Liberalism**.
      *   The "Right-to-Work" logic expands to consume the whole: if I don't have to pay dues, why must I be bound by the strike? If I am not bound by the union's majority, why can't I be replaced?
      *   The "Secondary Boycott" ban remains because it serves the liberal interest of market neutrality.

  ### IV. Conclusion

  The US labor law package is not a coherent theory of association. It is a **pragmatic containment strategy**.

  It uses **Collectivist tools** (exclusive representation) to build a counterweight strong enough to force employers to bargain, ensuring industrial peace. Simultaneously, it uses **Individualist tools** (right-to-work, replacement rules, secondary bans) to ensure that this counterweight does not become strong enough to disrupt the broader market or coerce individual conscience.

  **The Verdict on the Variant:**
  Under proportional representation, the **Individualist half** swallows the Collectivist half. Without the "majoritarian binding" principle, the union loses its quasi-public status. It becomes merely a voluntary association. Consequently:
  1.  **Permanent Replacement** becomes permissible for all strikers (the job is purely the employer's property).
  2.  **Secondary Bans** remain (neutrals must be protected).
  3.  **Duty of Fair Representation** vanishes (you only represent those who pay).

  Therefore, the **Collectivist/Exclusive** half is the fragile, philosophically heavy component. It is the only thing licensing the idea that a worker has a "claim" to their job beyond the employer's consent. The Individualist half is the default state of market law; the Collectivist half is the statutory exception that creates "labor law" as a distinct field. Remove it, and you do not have a different version of labor law; you have the absence of it.
