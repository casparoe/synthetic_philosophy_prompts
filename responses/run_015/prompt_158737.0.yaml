answer: |-
  **Materials and setup**
  Print two handouts per pair: Chart A (Triangle vertices: 0,0; 20,0; 10,10) and Chart B (Chart A plus point 18,4). Provide distinct currencies: Player 1 receives chocolate squares (discrete, consumable), Player 2 receives raffle tickets (probabilistic, durable). This prevents direct summation ("let's split the total value"). Assign roles secretly. Designate the maths-econ major as "Class Actuary": their job is not to negotiate, but to verify the *Nash* predictions on the projector after each round. Prepare a "Debrief Chart C" (Triangle 0,0; 10,0; 0,10 vs Subset 0,0; 10,0; 5,5) for the final segment. Ensure the projector can overlay transparency grids on the charts for visual verification.

  **The charts, with the arithmetic checked**
  **Chart A (Round 1):** Feasible set $S_1$ is the convex hull of $(0,0), (20,0), (10,10)$. The Pareto frontier is the line segment from $(10,10)$ to $(20,0)$, defined by $y = 20 - x$ for $x \in [10,20]$.
  *   **Nash:** Maximize $x(20-x)$. Derivative $20-2x=0 \Rightarrow x=10$. Solution: **$(10,10)$**.
  *   **Ideal Point:** Max $x=20$, Max $y=10$. Vector $(20,10)$.
  *   **KS:** Intersection of $y=20-x$ and line to ideal $y=0.5x$. $1.5x=20 \Rightarrow x=13.33$. Solution: **$(13.33, 6.67)$**.

  **Chart B (Round 2):** Feasible set $S_2$ adds $(18,4)$. The frontier bulges outward. New segment from $(10,10)$ to $(18,4)$ is $y = -0.75x + 17.5$.
  *   **Nash:** Maximize $x(-0.75x + 17.5)$. Derivative $-1.5x + 17.5 = 0 \Rightarrow x=11.67$. Solution: **$(11.67, 8.75)$**.
  *   **Ideal Point:** Unchanged at $(20,10)$ (the new point doesn't extend the axes).
  *   **KS:** Intersection of new frontier and $y=0.5x$. $1.25x=17.5 \Rightarrow x=14$. Solution: **$(14, 7)$**.

  **Result:** In Round 2, the Nash solution punishes Player 2 ($10 \to 8.75$) despite no loss of capability. The KS solution rewards Player 2 ($6.67 \to 7$).

  **Minute-by-minute**
  **00–10: Setup.** Distribute currencies and roles. Emphasize: "You cannot exchange chocolate for tickets. You must agree on a coordinate $(x,y)$." Explain the Actuary's role: they will calculate the "Rational Baseline" (Nash) after you decide.
  **10–30: Round 1.** Pairs negotiate Chart A. They must mark their agreed point. Before revealing, ask Actuary to project the Nash point $(10,10)$. Discuss discrepancies. Pay out based on agreements.
  **30–50: Round 2.** Distribute Chart B. Explicitly state: "Nothing was taken away. Player 2's maximum possible payoff is still 10." Pairs negotiate. Actuary projects Nash point $(11.67, 8.75)$.
  **50–60: The Shock.** Compare Round 1 and 2 outcomes. Ask Player 2s: "Did you lose value? Why?" Ask Player 1s: "Did you gain leverage without new power?" Elicit the intuition: "The new option changed the *shape*, not the *limits*."
  **60–70: Rule Invention.** Ask: "What rule would protect Player 2 here?" Guide them toward: "Equal proportion of the ideal point." Test this rule on Chart B (it yields $(14,7)$). Name this the "Proportional Rule."
  **70–80: The Mirror.** Project Chart C. Show a case where the Proportional Rule shifts the solution even when the original solution is still feasible (IIA violation). Ask: "Is this rule always fair?" Conclude.

  **Where the idea bites**
  The tension peaks at minute 55. Under the Nash rule (which they learned last week as "rational"), Player 2 is penalized in Round 2 simply because Player 1 has a new, slightly better *threat* option, even if Player 2's own best-case scenario hasn't improved. This violates **Resource Monotonicity**: expanding the pie should not make anyone worse off.
  When students articulate a fix, they will likely describe the KS axiom without naming it: "We should split the *gain* relative to the max possible, not the absolute product." This maps the geometric "line to the ideal point."
  The "bite" is the realization that the "Rational" rule (Nash) they memorized behaves counter-intuitively in dynamic environments, while their invented "Fair" rule (KS) solves monotonicity but introduces instability (IIA). The Actuary's calculations legitimize the Nash shift, preventing students from dismissing it as negotiation noise.

  **Debrief**
  Formalize the discovery. Write the two axioms on the board:
  1.  **Independence of Irrelevant Alternatives (Nash):** If you remove an option you weren't going to pick, the deal shouldn't change.
  2.  **Monotonicity (KS):** If the set of options grows, no one should lose.

  Show Chart C for the mirror image.
  *   **Set 1:** Triangle $(0,0), (10,0), (0,10)$. Nash & KS both pick $(5,5)$.
  *   **Set 2:** Cut off the top corner to make vertices $(0,0), (10,0), (5,5)$. The point $(5,5)$ is still feasible.
  *   **Nash:** Stays at $(5,5)$ (Satisfies IIA).
  *   **KS:** The Ideal Point for P2 drops from 10 to 5. The "Proportional Line" steepens. KS moves to $(6.67, 3.33)$.
  *   **The Lesson:** KS violates IIA. By removing a "phantom" option (the top corner P2 never reached), P2 loses real payoff under KS.
  Conclude that Fair Division is not about finding the *True* solution, but choosing which axiom you are willing to violate. Nash sacrifices Monotonicity; KS sacrifices IIA.

  **What will go wrong the first time**
  1.  **Currency Confusion:** Students may try to assign a monetary value to chocolate vs. tickets to "split the difference." Interrupt this: "The chart is the only common metric."
  2.  **Actuary Dominance:** The maths major might announce the Nash point before pairs finish negotiating. Instruct them to calculate silently until the "Reveal" moment.
  3.  **Visual Estimation:** Students might pick $(10,10)$ in Round 2 by eye, missing the Nash shift. The Actuary's projection is the safety net here to ensure the *theoretical* problem is seen even if the *negotiation* doesn't track it.
  4.  **Cynicism:** Students may argue Player 1 *deserves* more in Round 2 because they have more options. Reframe: "Player 2's capabilities did not shrink. Is it fair they lose?"

  **What the activity can't do**
  This session cannot prove one solution is normatively superior. It demonstrates a trade-off between axioms. It also cannot fully simulate real-world bargaining power; the "threat" of the new option in Chart B is mathematical, not psychological. Students may still feel the Nash outcome is "fair" because P1 has more leverage, which is a valid political critique but mathematically distinct from the monotonicity axiom.
