      *   *Check:* Is the tone appropriate?
      *   *Correction:* Maintain high-level academic/policy analysis tone.

  11. **Final Polish:** Ensure clear headings, precise terminology (e.g., "internal validity," "retrospective vs. prospective"), and a decisive conclusion. (Proceed to generate response).

