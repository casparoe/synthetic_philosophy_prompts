answer: |-
  There is no single established term for this specific argumentative shape. The literature contains neighbors—"pragmatic self-refutation" (Hintikka), "implicit commitment" (Feferman), "hinge propositions" (Wittgenstein), "transcendental arguments"—but none capture the *selective scope* and the *exchange rate* dynamic you have isolated. "Self-refutation" is incorrect because, as you note, the claim does not contradict itself; it merely fails to apply to itself. "Relativism" is too broad.

  Since you asked to carve the thing rather than label it, here is a definition suitable for a handout, followed by an analysis of your four sorting questions and a critique of the carve itself.

  ### The Carve: Meta-theoretic Immunity

  **Definition:**
  A skeptical argument exhibits **Meta-theoretic Immunity** when it establishes the indeterminacy (or relativity, or undefinability) of a target domain $D$ by employing a set of reasoning resources $R$, while simultaneously exempting $R$ from the skepticism applied to $D$.

  **Structure:**
  1.  **Derivation:** The argument uses resources $R$ (e.g., finitary arithmetic, standard logic, informal set theory) to prove a limitative theorem about domain $D$ (e.g., "Cardinality is model-relative," "Truth is undefinable").
  2.  **Skeptical Conclusion:** The theorem is interpreted to show that concepts in $D$ are not "nailed down" or absolute.
  3.  **Immunity Clause:** When challenged on whether $R$ is subject to the same indeterminacy, the arguer asserts that $R$ *is* determinate, often on the grounds that $R$ is the precondition for stating the argument.
  4.  **Exchange Rate:** The scope of the skepticism is inversely proportional to the robustness of $R$. To widen the skepticism (include more in $D$), one must assume more in $R$. To narrow $R$ (subject the reasoning itself to scrutiny), one must narrow the skepticism (accept more as determinate).

  **Handout Summary:**
  > *Meta-theoretic Immunity* is the structural feature of limitative arguments where the tools used to prove a limitation are exempted from the limitation they prove. It creates a "skeptical exchange rate": the determinacy of the conclusion is purchased by spending the determinacy of the premises. The argument does not refute itself; it anchors itself.

  ---

  ### Addressing Your Sorting Questions

  **1. Is there an established concept for the scope-setting structure?**
  No single term exists. The closest technical concept is **"Implicit Commitment"** (Solomon Feferman), which tracks what a theory implicitly accepts when it accepts certain axioms. However, Feferman uses this to *extend* certainty, whereas you are describing how certainty is *withheld* selectively.
  In epistemology, **"Contextualism"** describes how standards for knowledge shift, but it usually treats the shift as responsive to conversational context, not as a structural requirement of the argument's articulation.
  Your "exchange rate" framing is the most precise description available. It treats the background assumptions not as fixed foundations but as *currency* spent to buy skeptical reach.

  **2. Is it self-refutation?**
  It is not self-refutation (performative contradiction). A self-refuting claim is false if true (e.g., "All sentences are false"). Meta-theoretic Immunity is **Indexically Incomplete**. It is akin to saying "I am not speaking" while speaking, except the claim is "No language is determinate" spoken in a language assumed determinate.
  The literature on self-refutation (e.g., Passmore, Hintikka) often swallows this, but that is a mistake. Self-refutation kills the argument; Meta-theoretic Immunity sustains it by hiding the anchor. A better term for this specific failure is **"Scope Failure"**: the quantifier "nothing" in "nothing is nailed down" fails to range over the resources required to bind the quantifier.

  **3. Is it a hierarchy?**
  It is not a Tarskian hierarchy. In a hierarchy (object language, meta-language, meta-meta-language), the levels are formally ordered and the ascent is mandatory. In Meta-theoretic Immunity, the "level" of the resources $R$ is **pragmatically fixed**, not formally ordered.
  The arguer does not say, "We must move to $L_1$ to define truth for $L_0$." They say, "We are using $R$ to show $D$ is broken," and when asked about $R$, they say, "This isn't $D$." The boundary is drawn by *need*, not by formal syntax. It is a **Pragmatic Hierarchy**, which means the top level is wherever the arguer stops needing to justify.

  **4. Is it the formal fact or the use?**
  It is the **use**. The formal fact (e.g., Löwenheim-Skolem) merely states a model exists. The *Immunity* arises when the philosopher infers "Therefore, cardinality is relative" (undermining $D$) but does not infer "Therefore, my proof of Löwenheim-Skolem is relative" (undermining $R$). The formal theorem is neutral; the immunity is a philosophical decision about where to stand while wielding the theorem.

  ---

  ### Boundary Cases

  **Clear Instance: Skolem's Paradox (as you described)**
  *   **Target ($D$):** Uncountable sets in ZFC.
  *   **Resources ($R$):** Standard arithmetic and logic used to prove the Löwenheim-Skolem theorem.
  *   **Immunity:** The arguer claims "uncountable" is relative to the model, but treats the "countable" meta-theory used to prove the theorem as absolute. If they applied the skepticism to $R$, the proof itself would lose its force.
  *   **Verdict:** Fits the definition perfectly. The skepticism stops exactly at the boundary of the proof's requirements.

  **Non-Instance: Gödel's First Incompleteness Theorem**
  *   **Target ($D$):** Provability within system $S$.
  *   **Resources ($R$):** Primitive recursive arithmetic (PRA) in the meta-theory.
  *   **Difference:** Gödel does not claim "Provability is indeterminate." He claims "Provability is incomplete." He does not exempt $R$ from scrutiny to make the point; he explicitly shows how $R$ can prove things $S$ cannot. The meta-theory is not "immune" in the skeptical sense; it is *stronger*. The argument does not undermine the status of $D$ while preserving $R$; it extends $R$ beyond $D$. There is no "exchange rate" of skepticism, only an accumulation of proof-theoretic strength.
  *   **Verdict:** Not an instance. It is a limitative result, but it does not generate skepticism about the target concept's coherence, only its completeness.

  ---

  ### Weaknesses and Critique

  Here is where the carve might fail, specifically regarding your intuition that the Skolem case and the Truth case are the "same shape."

  **1. The Necessity vs. Contingency Weakness**
  In the **Truth Undefinability** case (Tarski), the ascent is *necessary*. You *cannot* define truth for $L$ in $L$. The hierarchy is forced by the logic.
  In the **Skolem** case, the ascent is *contingent*. You *can* formalize the meta-theory. You can put the Löwenheim-Skolem theorem inside a larger ZFC model. The "Immunity" here is a choice to stop formalizing.
  *   **Implication:** They may not be the same shape. Tarski's case is a **Structural Barrier** (you hit a wall). Skolem's case is a **Pragmatic Stop** (you choose to stand here). Your "exchange rate" metaphor fits Skolem better than Tarski. In Tarski, you don't get to choose the rate; the logic sets the price.

  **2. The "Exchange Rate" Framing**
  You suggest the two sides are haggling over an exchange rate. This implies a voluntary transaction. However, many philosophers (e.g., Putnam in *Models and Reality*) argue the meta-theory *cannot* be skepticalized without losing the ability to mean anything at all.
  *   **Implication:** If the background $R$ is a transcendental condition of meaning (Wittgenstein's "hinges"), it isn't a currency you spend; it's the ground you stand on. If so, "Immunity" is too active a word. It suggests shielding. It might be better described as **"Articulation Dependence"**: the skepticism is *dependent* on the determinacy of $R$, not merely exempting it.

  **3. The Missing Term**
  I must acknowledge a non-zero probability that a term exists in **Neo-Pyrrhonism** or **Post-Carnapian Ontology** that I am failing to recall. Specifically, the work of **Robert Brandom** on "vocabulary-pragmatics" or **Michael Dummett** on "manifestation" touches the requirement that meaning must be articulable. If there is a standard term, it likely lives in the intersection of **Proof-Theoretic Semantics** and **Meta-ethics** (where "error theory" faces similar issues). However, given the specificity of your "exchange rate" insight, I stand by the assessment that no single canonical term captures this exact dynamic.

  **Recommendation for the Seminar:**
  Use the term **"Meta-theoretic Immunity."** It is descriptive, neutral, and forces students to identify exactly *which* resources are being immunized in any given argument. Ask them: "What is the $R$ in this argument, and why is it exempt from the conclusion?" This operationalizes your insight without getting bogged down in finding a historical label that doesn't quite fit.
