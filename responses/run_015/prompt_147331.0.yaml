answer: |-
  ### Part 1: Analysis of Your Three Requirements

  Before presenting the procedure, here is the assessment of the three principles you asked me to evaluate.

  **1. The Fourth Register (Meta-Conflict/Bad Faith)**
  **Verdict:** This is genuinely distinct.
  **Reasoning:** The first three registers operate *within* the epistemic framework of the archive (i.e., "What does the evidence say?"). The fourth register operates *on* the framework itself (i.e., "Is the evidence trustworthy?").
  **Impact on Procedure:** When Type D is present, the procedure cannot treat the "surviving record" as a neutral arbiter. It must treat the *absence* or *contradiction* in the record as potential evidence of the memory's claim (i.e., the silence is the proof of suppression). However, this does not override the State Heritage Office's legal requirement for documentary proof of fact. It shifts the decision from an evidentiary judgment to an ethical one, which triggers the "Public Meeting" flag.

  **2. The Asymmetry of Cost**
  **Verdict:** This is a requirement, not a prejudice.
  **Reasoning:** Public history is not academic history. Its primary output is not knowledge but social cohesion. A catalogue correction is epistemic; a marker correction is social. Weighing the cost of public disbelief against the cost of archival inaccuracy is not "managing a constituency"; it is "stewardship of harm."
  **Impact on Procedure:** This does not allow you to assert falsehoods. It dictates that where the evidence is ambiguous or the record is incomplete, the benefit of the doubt regarding *attribution* should lean toward the memory to minimize social harm, provided the State Heritage Office's factual constraints are met.

  **3. The Name Replacement Rule**
  **Verdict:** Defensible in principle, but limited in scope.
  **Reasoning:** Names are identifiers of *agency* and *belonging*. Dates and numbers are identifiers of *chronology* and *scale*. Replacing a remembered name erases a person's social existence; correcting a date corrects a measurement.
  **Impact on Procedure:** The rule applies to **Persons** (who), **Motives** (why), and **Roles** (what they did). It does **not** apply to **Dates** (when), **Counts** (how many), or **Physical Dimensions** (where/how big). You may list a remembered name alongside a documented one, but you cannot list a remembered death toll alongside a documented one if they contradict.

  ***

  ### Part 2: The 40-Minute Decision Procedure

  **Preparation (5 Minutes):**
  *   Lay out the Proposal, the Surviving Record (SHO standard), and the Community Memory claim.
  *   Assign one member as Timekeeper.

  **Step 1: Categorize the Conflict (5 Minutes)**
  *   **Q1:** Does the record mention the event?
      *   *No:* Type Silence.
      *   *Yes:* Go to Q2.
  *   **Q2:** Does the record contradict the memory on *what* happened?
      *   *Yes:* Type Incompatibility.
      *   *No:* Go to Q3.
  *   **Q3:** Does the record contradict the memory on *who* did it or *why*?
      *   *Yes:* Type Attribution.
      *   *No:* (Agreement) Approve as submitted.
  *   **Q4 (Critical):** Is there evidence the record itself was falsified, culled, or created to obscure this specific event? (e.g., destroyed files, proven perjury in creation).
      *   *Yes:* **Type Bad Faith.** (Mark this clearly; it alters Step 4).

  **Step 2: The SHO Gate (5 Minutes)**
  *   **Q5:** Does the surviving record *explicitly* contradict the memory claim as a matter of physical fact (dates, names on legal docs, counts)?
      *   *Yes:* Memory claim **cannot** be asserted as Fact. It must be Attributed or Omitted.
      *   *No:* Memory claim *may* be asserted as Fact if supported by Step 3.
  *   **Stop Point:** If Type Bad Faith is marked, do not stop here. Proceed to Step 3.

  **Step 3: The Harm & Values Check (10 Minutes)**
  *   **Q6:** If we assert the Record and relegate Memory to attribution, does this cause active, specific harm to a living community (e.g., denying ancestry, denying tragedy, validating oppression)?
      *   *Yes:* Maximize Attribution language (see Step 5).
      *   *No:* Standard Attribution language.
  *   **Q7:** Is this a Type Bad Faith case where the "Record" is known to be tainted regarding this neighborhood/group?
      *   *Yes:* **FLAG FOR PUBLIC MEETING.** (The Committee cannot adjudicate the ethics of a corrupted archive alone).
      *   *No:* Proceed to Step 4.

  **Step 4: The Naming & Scope Rule (5 Minutes)**
  *   **Q8:** Is the conflict about a Person, Motive, or Role?
      *   *Yes:* Apply Name Replacement Rule. (Do not swap; Add/Annotate).
      *   *No:* (Is it a Date, Count, or Location?) Record prevails on Fact; Memory moves to Attribution or Omission.

  **Step 5: Drafting the Output (10 Minutes)**
  *   **Assert Outright:** What the Record supports + Names/Roles protected by Name Rule.
  *   **Attribute:** What the Memory claims, phrased as "Community tradition holds," "Oral history records," or "Descendants state."
  *   **Omit:** Claims contradicted by physical evidence (e.g., specific dates that are provably wrong) where attribution would be misleading.
  *   **Rationale:** One sentence summarizing the balance of Record authority and Community stewardship.
  *   **Flag:** If Step 3, Q7 was "Yes," mark for Public Meeting.

  ***

  ### Part 3: Application to Proposals

  Here is the procedure run on your three cases.

  #### Case One: The Founding Plaque (Settler vs. Gathering Place)
  *   **Step 1 (Categorize):** Type Silence (Record silent on gathering) + Type Incompatibility (Map shows structures before "founding" date).
  *   **Step 2 (SHO Gate):** Record (Map/Plaque) asserts Settler/Date. Memory asserts Prior Use. Map contradicts "Settler built first."
  *   **Step 3 (Harm):** Denying Indigenous prior use causes cultural erasure (High Harm).
  *   **Step 4 (Naming):** Not a name conflict, but an agency conflict.
  *   **Step 5 (Output):**
      *   **Assert:** "Structures present at this site by [Year of Map]." (Correcting the founding date to match the map).
      *   **Attribute:** "Oral history of the [Nation] holds this site served as a seasonal gathering place prior to and during early settlement."
      *   **Omit:** The specific claim that the Settler *built* the first structures (contradicted by map).
      *   **Rationale:** "The marker reflects the earliest physical evidence while preserving the community's oral history of site usage."
      *   **Flag:** No.

  #### Case Two: The Factory Fire (9 vs. 14 Dead)
  *   **Step 1 (Categorize):** Type Incompatibility (Counts).
  *   **Step 2 (SHO Gate):** Coroner's Register (9) contradicts Memory (14). Record prevails on Fact.
  *   **Step 3 (Harm):** Telling families their dead relatives are "unrecorded" is high harm.
  *   **Step 4 (Naming):** Memory names the 5 missing. Apply Name Replacement Rule (Identity).
  *   **Step 5 (Output):**
      *   **Assert:** "Nine workers perished in the fire, recorded in the County Coroner's Register."
      *   **Attribute:** "Community tradition holds five additional itinerant workers died; their names are remembered as [List Names]."
      *   **Omit:** Asserting the total count as 14 (contradicts official register).
      *   **Rationale:** "The marker honors the official record while preserving the community's memory of the unrecorded dead."
      *   **Flag:** No.

  #### Case Three: The Flood Relief (Misrouting vs. Withholding)
  *   **Step 1 (Categorize):** **Type Bad Faith.** (Archives destroyed related files; Memory alleges intent).
  *   **Step 2 (SHO Gate):** Surviving Record says "Misrouting." Memory says "Withholding." Record contradicts Intent.
  *   **Step 3 (Harm):** Asserting "Misrouting" validates a known liar (the Archive) against a marginalized neighborhood. High Harm.
  *   **Step 3 (Q7 Check):** Type Bad Faith confirmed. **FLAG FOR PUBLIC MEETING.**
  *   **Step 4 (Naming):** N/A.
  *   **Step 5 (Output):** *Note: Because of the Flag, the Committee does not finalize the text. However, to show you the procedural constraint:*
      *   **Assert:** "Relief arrived eleven days following the flood due to administrative misrouting." (This is what the SHO will allow).
      *   **Attribute:** "Neighborhood residents maintain the delay was a deliberate withholding of aid."
      *   **Omit:** Nothing, but the Assert line is morally painful.
      *   **Rationale:** "The marker must reflect the surviving administrative record while noting the community's contention regarding intent."
      *   **Flag:** **YES.** (Reason: The integrity of the archive itself is the subject of the dispute; this is a values judgment, not an evidentiary one).

  ***

  ### Part 4: The Dislikeable Truth and Limitations

  You asked for the answer on Case Three without softening. Here it is:

  **The Procedure forces you to write "Misrouting" as the fact.**
  Even with the destroyed files, even with the history of bad faith, the State Heritage Office's rule binds you to the *surviving* document. The procedure identifies this as a Type Bad Faith conflict, but it cannot magic away the legal requirement. It forces you to inscribe the Archive's lie as the "Fact" and the Community's truth as the "Attribution." The only escape valve is the Public Meeting flag. This is not a failure of the procedure; it is a accurate measurement of your powerlessness. You are not the arbiters of truth; you are the managers of the State's interface with the Community.

  **What the Procedure Cannot Do:**

  1.  **It cannot resolve Type Bad Faith conflicts internally.**
      When the archive is the antagonist, a volunteer committee lacks the authority to rule against it. These cases *must* go to a public meeting or the State Office. The checklist identifies them, but it cannot solve them.
  2.  **It cannot protect you from political fallout.**
      In Case Three, regardless of the text, the neighborhood will see "Misrouting" and feel betrayed. The procedure ensures you are *consistently* betraying them according to a rule, rather than *arbitrarily* betraying them according to instinct. It protects your integrity, not your popularity.
  3.  **It cannot verify oral history.**
      The procedure treats oral history as a *claim* to be weighed, not a *fact* to be verified. If the community's memory changes or fractures, the procedure has no mechanism to adjudicate "which memory" counts. That remains a political negotiation, not a historical one.

  **Final Instruction:**
  Use the procedure to ensure your *process* is clean, not to ensure your *outcomes* are just. In a system where evidence and memory are structurally unequal, a clean process is the only defense you have when the outcome is unjust.
