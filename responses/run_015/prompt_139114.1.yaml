answer: |-
  **Exam Question: Decision Theory & Formal Epistemology**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 30

  **Notation Preamble**
  Let $\Omega = \{\omega_1, \dots, \omega_n\}$ be a finite set of states and $A = \{a_1, \dots, a_m\}$ be a finite set of actions. Let $u: A \times \Omega \to \mathbb{R}$ be a bounded von Neumann-Morgenstern utility function. The agent holds a prior belief $p \in \Delta(\Omega)$. A signal structure is defined by a finite set of realizations $S$ and likelihoods $\pi(s|\omega)$ for all $s \in S, \omega \in \Omega$. Upon observing $s$, the agent updates to posterior $p(\cdot|s)$ via Bayes' rule. The agent maximises expected utility.

  **(a) The Value of Information Theorem [10 Marks]**
  State the theorem regarding the ex ante expected value of a costless signal. List every assumption required for the result to hold. Prove the theorem mathematically. In your proof, explicitly identify the step where the order of the maximisation and expectation operators is swapped and name the mathematical property that licenses this swap. Finally, state the necessary and sufficient condition for the value of the signal to be exactly zero.

  **(b) Signal-Contingent Menus [12 Marks]**
  Consider a variant where a second party observes the signal realization $s$ before the agent chooses an action, and sets the feasible menu $A_s \subseteq A$ contingent on $s$.
  1.  Construct a fully numerical counterexample (specify $|\Omega|$, $|S|$, priors, utility values, and menus $A_s$) demonstrating that a free, perfectly informative signal can have strictly negative ex ante expected value. Show the arithmetic for the no-information value and the information value.
      *Hint: Merely making existing options more expensive is insufficient, as the agent could fall back on the ex-ante-optimal action. Ensure the ex-ante-optimal action is removed from the menu in at least one signal cell.*
  2.  Identify by name the specific step in your proof from Part (a) that fails in this variant.
  3.  Explain why the argument "the agent can simply ignore the information" does not rescue the theorem in this setting.
  4.  In this setting, can a strictly less informative signal yield higher expected utility than a more informative one? Justify briefly.

  **(c) Administrative Interpretation [8 Marks]**
  A university administrator argues: "Good's theorem proves rational agents always benefit from more information. Therefore, the university should always commission the extra external review before deciding on tenure, regardless of the cost or the reviewer's bias."
  Identify and repair three distinct errors in this reasoning based on the theorem's actual implications.
  *(Bonus: +1 Mark for identifying a fourth error regarding the comparability of different experiments.)*

  ***

  **Model Answer**

  **(a) Theorem and Proof**
  **Theorem:** For an expected-utility maximiser with a fixed action set $A$, the ex ante expected utility with a costless signal $S$ is at least as high as the expected utility without the signal.
  **Assumptions:** (1) The agent maximises expected utility. (2) The feasible action set $A$ is fixed and identical across all signal realizations (and the no-signal case). (3) The signal is costless (utility depends only on action and state). (4) Likelihoods $\pi(s|\omega)$ do not depend on the action chosen.
  **Proof:**
  Let $V_0$ be the value without information: $V_0 = \max_{a \in A} \sum_{\omega} p(\omega) u(a, \omega)$.
  Let $V_S$ be the ex ante value with information: $V_S = \sum_{s} p(s) \left[ \max_{a \in A} \sum_{\omega} p(\omega|s) u(a, \omega) \right]$.
  Using the law of total probability ($p(s)p(\omega|s) = p(\omega)\pi(s|\omega)$), we rewrite $V_S$:
  $V_S = \sum_{s} \max_{a \in A} \sum_{\omega} p(\omega) \pi(s|\omega) u(a, \omega)$.
  By the property that the maximum of sums is less than or equal to the sum of maximums (convexity of the max function / Jensen's inequality), we swap $\max$ and $\sum_s$:
  $V_S \ge \max_{a \in A} \sum_{s} \sum_{\omega} p(\omega) \pi(s|\omega) u(a, \omega) = \max_{a \in A} \sum_{\omega} p(\omega) u(a, \omega) \underbrace{\sum_{s} \pi(s|\omega)}_{1} = V_0$.
  **Equality Condition:** $V_S = V_0$ if and only if there exists a single action $a^*$ that is optimal for every posterior $p(\cdot|s)$ in the support of the signal.
  **Guarantee:** This is an *ex ante* guarantee (before seeing $s$); realized utility ex post may be lower.

  **(b) Counterexample and Analysis**
  1.  **Numerical Example:**
      *   States: $\omega_1, \omega_2$ with $p(\omega_1)=p(\omega_2)=0.5$.
      *   Actions: $a_{safe}, a_{risky}$.
      *   Utilities: $u(a_{safe}, \omega) = 10$ for all $\omega$. $u(a_{risky}, \omega_1) = 20, u(a_{risky}, \omega_2) = 0$.
      *   **No Info:** Menu $A = \{a_{safe}, a_{risky}\}$. $E[a_{safe}] = 10$. $E[a_{risky}] = 10$. Agent picks $a_{safe}$ (tie-break). $V_0 = 10$.
      *   **Perfect Signal:** $s_1$ reveals $\omega_1$, $s_2$ reveals $\omega_2$.
      *   **Menus:** If $s_1$, $A_{s1} = \{a_{safe}, a_{risky}\}$. Agent picks $a_{risky}$ (20). If $s_2$, $A_{s2} = \{a_{risky}\}$ ($a_{safe}$ removed). Agent picks $a_{risky}$ (0).
      *   **Value:** $V_S = 0.5(20) + 0.5(0) = 10$. (Wait, need strictly negative).
      *   *Correction for Strict Negativity:* Change $u(a_{safe}) = 12$.
      *   **Revised No Info:** $E[a_{safe}] = 12$. $E[a_{risky}] = 10$. Agent picks $a_{safe}$. $V_0 = 12$.
      *   **Revised Info:** $s_1 \to$ Menu $\{a_{risky}\}$ (Value 20). $s_2 \to$ Menu $\{a_{risky}\}$ (Value 0). $V_S = 10$.
      *   **Result:** $10 < 12$. Value is negative.
  2.  **Failed Step:** The swap of $\max$ and $\sum$ (or expectation). Specifically, the assumption that the same $a$ is available in the $\max$ operator across all $s$ to allow pulling $a$ out of the sum over $s$.
  3.  **Ignore-It Reply:** In the fixed-menu case, "ignoring" means choosing the ex-ante optimal action $a^*$ regardless of $s$. This is feasible because $a^* \in A_s$ for all $s$. Here, $a_{safe}$ is removed in state $s_2$, so the agent physically cannot ignore the signal to choose $a_{safe}$.
  4.  **Informativeness:** Yes. A less informative signal (e.g., one that does not distinguish $\omega_2$) might leave $a_{safe}$ available in that cell, preserving the high payoff, whereas a perfect signal triggers the menu restriction.

  **(c) Administrative Errors**
  1.  **Ex Ante vs. Ex Post:** The theorem guarantees higher *expected* utility before the signal is seen. It does not prevent the realized utility from being lower after a specific bad signal realization (regret).
  2.  **Agent-Relative Prior:** The theorem holds relative to the agent's *own* prior $p$. If the agent is miscalibrated or dogmatic, they may value information highly while an external observer knows the signal is misleading. The theorem does not validate the prior from the outside.
  3.  **Utility vs. Money:** The theorem concerns utility, not money. If the review has a monetary cost, it must be converted to utility disutility. Non-negative utility gain does not imply non-negative dollar willingness-to-pay unless utility is linear in money. The cost must be subtracted in the ex ante calculation.
  4.  **(Bonus) Non-Comparative:** The theorem proves $V(S) \ge V(\text{null})$. It does not inherently compare two different positive-cost experiments ($S_1$ vs $S_2$) unless one is a garbling of the other (Blackwell sufficiency).

  ***

  **Marking Scheme (Total 30)**

  **Part (a): 10 Marks**
  *   **A (8-10):** Explicitly lists fixed action set assumption. Proof correctly shows $\sum \max \ge \max \sum$. Identifies convexity of value function (or Jensen/Max-Expectation swap) as the engine. Equality condition specifies "same action optimal at every posterior."
  *   **B (5-7):** Proof is vague or relies on "ignoring info" intuition without the inequality. Misses the fixed action set assumption in the list. Equality condition is "signal is useless" (too imprecise).
  *   **C (0-4):** Major mathematical errors. Confuses ex ante and ex post.
  *   *Common Error:* Failing to name the convexity/max-swap property. **Cost:** -2 marks.

  **Part (b): 12 Marks**
  *   **A (10-12):** Numbers sum correctly to show $V_S < V_0$. Ex-ante optimal action is explicitly removed in one cell. Explains "ignore-it" fails because action is infeasible, not just suboptimal. Correctly notes less informative can be better.
  *   **B (6-9):** Numbers show negative value but ex-ante optimal action remained available (violating the hint). Explanation of "ignore-it" is hand-wavy ("the principal forces them").
  *   **C (0-5):** No numerical example or arithmetic is wrong. Claims theorem still holds.
  *   *Common Error:* Taxing the action rather than removing it. **Cost:** -4 marks (misses the structural constraint).

  **Part (c): 8 Marks (+1 Bonus)**
  *   **A (7-8):** Identifies Ex Ante/Post, Prior Relativity, and Cost/Linearity distinctively. Bonus awarded for noting non-comparative nature of theorem.
  *   **B (4-6):** Identifies Cost and Ex Post, but misses Prior Relativity (confuses truth with belief).
  *   **C (0-3):** Vague criticism of administration.
  *   *Common Error:* Treating cost as a simple subtraction without mentioning utility linearity. **Cost:** -1 mark.

  **Instructor Notes on Fairness/Ambiguity**
  *   **Utility Linearity:** Students with only one semester of EU often treat $u$ as money. Part (c) tests this, but ensure the preamble defines $u$ as vNM utility to avoid confusion in Part (b) arithmetic.
  *   **"Ignore" Argument:** In Part (b), ensure students understand "ignore" means "choose the action they would have chosen without the signal." If that action is not in the menu, they cannot ignore the signal in the relevant sense.
  *   **Time Management:** Part (b) is the heaviest. If students spend too long on (a) proof rigour, they may not finish (b). The marking scheme weights (b) highest to reflect this.
