answer: |-
  **1. The step you would reject**
  I reject Step (5). The defect is an equivocation on "norm-independent," conflating the value-laden selection of thresholds for bodily states with the value-constitution of the behavior itself. While hypertension thresholds are chosen by committees, the underlying blood pressure exists independently of moral disapproval. In Szasz's view, the "mental illness" behavior is constituted as pathological *by* the disapproval. Step (5) treats these two types of norm-involvement as identical, erasing the qualitative distinction between regulating a bodily function and judging a life choice. By collapsing this distinction, the argument falsely concludes that because both involve values, they involve the *same kind* of values, thereby invalidating the asymmetry required for the political critique.

  **2. Why the argument reads as valid**
  The argument reads as valid because it treats "norm-independent" as a binary property rather than a spectrum or a set of distinct relations. If "norm-independent" means "utterly free of human valuation," then Step (3) successfully demonstrates that physical disease ascriptions fail this test, since thresholds involve cost-benefit analysis. If mental illness ascriptions also fail this test (Step 1), then Step (5) logically follows that there is no asymmetry. Once the asymmetry is removed, Step (2) ensures the political conclusion collapses, because the specific critique—that psychiatry disguises moral judgment as medical fact—requires that medicine *not* be disguised moral judgment. The validity holds so long as one accepts that the normativity in setting blood pressure thresholds is relevantly identical to the normativity in defining disapproved conduct.

  **3. The other exits, priced**
  First, you could reject (1), arguing Szasz distinguished voluntary conduct from involuntary bodily states, not behavior versus body. This commits you to defending a robust theory of voluntariness, which is philosophically thorny and vulnerable to determinism. Second, you could reject (2), claiming the political critique rests on consent, not ontology. This saves the politics but concedes mental illness could be real disease, weakening the "myth" label and potentially undermining the claim that Soviet psychiatry was categorically different from standard care. Third, you could reject (7), arguing that even if asymmetry is a matter of degree, coercion requires higher justification for behavioral issues than bodily ones. This commits you to an external moral theory of liberty not found in Szasz. My preferred rejection (Step 5) commits you to defending a qualitative distinction between bodily dysfunction and social deviance, despite shared value-laden thresholds, preserving Szasz's ontological core without denying medical normativity.

  **4. Where the B-positive probe belongs**
  The probe targets the inference from ontology to politics, specifically undermining Step (2) and Step (7). It demonstrates that even if the ontological condition (a bodily lesion or marker) is met, the political condition (consent and coercion) remains unchanged. If a serum marker exists but the patient still denies illness and resists confinement, the biological fact does not justify the coercion. This helps you by decoupling the two halves of Szasz's thesis, suggesting the lesion criterion was indeed rhetorical decoration for a liberty-based argument. It supports your intuition that involuntary confinement needs a justification distinct from treating consenting patients, regardless of biological findings, and confirms that Soviet psychiatry was an abuse of liberty, not merely a different biological convention.

  **5. What survives**
  The surviving claim is that mental illnesses are distinct not because brains lack pathology, but because psychiatric interventions target agency rather than mechanism. The "myth" is not that brains don't malfunction, but that diagnosing a mental illness automatically justifies overriding consent in a way diagnosing pneumonia does not. The core is the category error of applying medical coercion to moral conflict. Even with a biological marker, if the intervention restricts liberty based on conduct rather than repairing a broken mechanism the patient cannot control, the political critique holds. The strongest Szaszian position is that "mental illness" is a metaphor for problems in living that should be addressed through ethical and legal frameworks, not medical coercion, regardless of biological correlates.

  **6. Settled and contested**
  It is settled among philosophers of medicine that diagnostic thresholds involve values, such as cost and harm assessment. However, it is fiercely contested whether this makes all disease concepts normative or if bodily dysfunction remains a biological fact. Specialists dispute whether "dysfunction" is purely biological; some argue it is inherently value-laden. Claiming Soviet psychiatry was abuse rather than convention is morally standard but philosophically contested if all diagnosis is viewed as value-laden convention. I am unsure if specialists accept the decoupling of ontology and coercion; many bioethicists link them, while legal scholars often separate them. The claim that coercion requires distinct justification is widely accepted in law, but disputed in psychiatry regarding capacity.
