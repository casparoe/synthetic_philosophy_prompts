answer: |-
  **Dissertation Prospectus**

  **Title:** Inverting the Constitution Puzzle: Identity Conditions in Form-First Artifacts

  **1. The Research Question**
  The standard problem of material constitution arises from cases where an object (a statue) and its matter (a lump of clay) appear to have conflicting identity conditions. The dominant literature assumes a "matter-first" ontology: the matter is treated as the metaphysically basic occupant of the region, and the artifact is understood in relation to it. This generates the pressure to posit coincident objects, constitution relations, or temporal parts to resolve the conflict.

  This thesis asks: **Does the pressure to posit coincident objects persist in cases where there is no privileged, persistent matter, but rather a functional role realized by replaceable constituents (e.g., a committee, a software program, a fictional character)?**

  If the puzzle dissolves in these "form-first" cases, it suggests the classic statue/clay problem is not a deep metaphysical conflict but a category error generated by matter-first bias. If the puzzle *reappears* (e.g., The Committee vs. The Sum of Current Members), it suggests the problem is structural to artifact ontology regardless of material priority. The thesis argues the former: the constitution puzzle is an artifact of matter-first modeling, and removing that priority dissolves the need for dual-object ontologies.

  **2. Theoretical Context and Target Positions**
  This project does not aim to survey the history of the debate. It aims to stress-test specific metaphysical commitments by shifting the evidentiary base. The thesis targets four standard responses to the constitution puzzle:

  1.  **Coincidence (Two Objects):** Posits that the statue and clay are distinct but spatially coincident.
      *   *Pressure Point:* In form-first cases (e.g., a committee), there is no persistent "sum of members" that exists before the committee is formed and survives its dissolution. There is nothing for the committee to coincide *with*.
  2.  **Constitution Without Identity:** Posits a unique relation where one object constitutes another without being identical.
      *   *Pressure Point:* This relies on the constituter having stricter persistence conditions than the constituted. In form-first cases, the "constituters" (code, members) often have *looser* or *discontinuous* persistence conditions than the artifact.
  3.  **Mereological Essentialism:** Posits that any change in parts destroys the object.
      *   *Pressure Point:* While viable for lumps of clay, this is intuitively untenable for software or committees. If this view is rejected for form-first cases but kept for clay, a principled distinction is required.
  4.  **Sortal/Conventionalist Deflationism:** Posits that the puzzle is verbal, arising from conflicting counting practices.
      *   *Pressure Point:* This is the likely survivor. The thesis aims to show *why* this view is forced upon us by form-first cases, and then argues this reasoning should retroactively apply to the clay case.

  **3. Methodology**
  The method is **comparative metaphysical diagnosis**. Rather than applying existing theories to new examples (which risks forcing the examples into ill-fitting categories), I will analyze the structural differences between "matter-first" and "form-first" cases to see where the arguments for coincidence break down.

  *   **Why not just run standard arguments on new cases?** Because standard arguments assume the existence of a constituting base that persists through the artifact's life. In form-first cases, that assumption is false. The methodology must expose this structural gap.
  *   **Why not a straight survey?** A survey would treat all cases as equal data points. This thesis argues the *type* of case determines the metaphysical outcome. The focus is on the asymmetry between the cases.

  **4. Chapter Outline (Target: 15,000 words)**

  **Chapter 1: The Matter-First Bias (3,000 words)**
  *   **Goal:** Diagnose why the statue/clay case generates the constitution puzzle.
  *   **Content:** Reconstruct the standard argument for coincident objects. Isolate the premise that the clay is "metaphysically basic" and exists prior to the shaping. Show that the puzzle relies on the clay having *stricter* survival conditions than the statue (survives squashing) while the statue has *modal* properties the clay lacks.
  *   **Argument:** The puzzle requires a constituting base that is continuous and privileged.

  **Chapter 2: Form-First Artifacts (4,000 words)**
  *   **Goal:** Analyze cases where identity is determined by function/role, not matter.
  *   **Content:** Focus on two paradigmatic cases: (1) A committee with total membership turnover; (2) Software ported across languages/platforms.
  *   **Argument:** In these cases, the "constituting stuff" is not continuous. There is no "sum of members" that exists before the committee. The identity conditions are upstream of the material realization.
  *   **Crucial Test:** Attempt to apply the Coincidence view here. Show it fails because there is no second object to coincide with. Attempt to apply Constitution view. Show it fails because the relation is not asymmetric in the required way.

  **Chapter 3: The Asymmetry Argument (4,000 words)**
  *   **Goal:** Demonstrate that the disappearance of the puzzle in Chapter 2 implies a solution for Chapter 1.
  *   **Content:** If the puzzle evaporates in form-first cases, why? Because we recognize the artifact's identity is conventional/functional. If we accept this for committees, we must explain why clay is different.
  *   **Argument:** There is no relevant metaphysical difference between clay and committees regarding constitution; the difference is merely that clay *looks* continuous. The "pressure" for two objects in the clay case is an illusion created by the visual continuity of the matter.
  *   **Conclusion:** The Deflationist/Conventionalist view is not just one option among many; it is the only view consistent across both case types.

  **Chapter 4: Objections and Implications (4,000 words)**
  *   **Goal:** Defend against the claim that form-first cases are disanalogous.
  *   **Content:** Address the objection that software/committees are "abstract" while statues are "concrete." Argue that the *ontology of the artifact* is what matters, not the physicality of the parts. Address the risk that this collapses into nihilism (no artifacts exist).
  *   **Final Upshot:** The thesis establishes that the constitution puzzle is a problem of sortal selection, not material coincidence.

  **5. Timeline (March – October)**

  *   **March:** Draft Chapter 1. Refine the definition of "matter-first bias." Ensure I am not attacking a straw man.
  *   **April:** Draft Chapter 2. Select the strongest form-first examples. Avoid getting bogged down in the metaphysics of abstract objects (keep focus on artifacts).
  *   **May:** Draft Chapter 3. This is the core argument. Ensure the bridge from "form-first" back to "clay" is rigorous.
  *   **June:** Draft Chapter 4. Anticipate counter-arguments regarding physical vs. functional persistence.
  *   **July:** Full first draft complete. Leave for two weeks.
  *   **August:** Revision pass 1: Check argument flow and word count. Cut literature review fluff.
  *   **September:** Revision pass 2: Strengthen objections. Check that the "Success/Failure" conditions are met.
  *   **October:** Final polish, formatting, and submission.

  **6. Success and Failure Conditions**

  *   **Success:** The thesis demonstrates that standard constitution solutions (Coincidence, Constitution Relation) are *inapplicable* to form-first cases, and that the only consistent ontology across both case types is a deflationary/conventionalist one. It successfully argues that the "clay" intuition is misleading.
  *   **Failure (Type 1):** It turns out form-first cases *do* generate a constitution puzzle (e.g., The Committee vs. The Time-Slice of Members). If the pressure for two objects reappears here, the "matter-first bias" diagnosis is false, and the thesis collapses.
  *   **Failure (Type 2):** The distinction between "matter-first" and "form-first" proves untenable (e.g., if clay is shown to be functionally defined too). If the cases aren't distinct, the comparative method fails.
  *   **Failure (Type 3 - Word Count):** The argument expands into a general theory of artifacts. I must restrict the scope to the *constitution puzzle* specifically, not artifact ontology generally.

  **7. Word Count Risks and Mitigation**
  15,000 words is tight for metaphysics. The following risks will be actively managed:
  *   **History of Debate:** I will not trace the lineage of the constitution view. I will define the positions structurally without naming proponents.
  *   **Example Proliferation:** I will stick to *one* matter-first case (Statue/Clay) and *two* form-first cases (Committee, Software). Adding more will dilute the argument.
  *   **Abstract Objects:** Discussing software/fiction risks drifting into Platonism. I will treat these strictly as *artifacts* with identity conditions, avoiding deep dives into the nature of abstracta.
  *   **Definition of "Artifact":** I will not attempt a necessary and sufficient definition of artifacts. I will assume standard intuitions about committees and software to focus on the constitution relation.

  **8. Conclusion**
  If successful, this thesis establishes that the problem of material constitution is not a feature of the world, but a feature of how we model matter-dominant cases. It shifts the burden of proof onto those who claim the statue and clay are distinct: if they cannot explain why the committee and its members don't generate the same puzzle, their view is inconsistent. The honest upshot may be that the clay case was never a case of constitution in the first place, but a case of competing sortal descriptions mistaken for competing objects.
