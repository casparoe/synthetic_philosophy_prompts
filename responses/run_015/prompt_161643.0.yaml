  **DEPARTMENT OF TEMPORAL INTEGRITY**
  **Office of Anticipatory Autonomy**
  **Form UC-1: Application for Anticipatory Self-Binding Order**

  **PURPOSE:** Use this form to legally obligate a future entity to refrain from specific actions, regardless of said entity's subsequent consent, desire, or capacity to petition for release. Filing constitutes a waiver of future autonomy pursuant to Section 7(b) of the Autonomy Preservation Act.

  **DEFINITIONS:**
  **1. Filing Party:** The legal entity existing at the time of signature (T1).
  **2. Bound Party:** The legal entity existing at the time of enforcement (T2).
  **3. Continuity:** The psychological and biological overlap between Filing Party and Bound Party.

  **PART I: INDIVIDUAL APPLICANTS**

  **Line 1: Designation of Enforcer.**
  The Filing Party must appoint an independent Enforcer not named in this application. The Enforcer is instructed to disregard all verbal, written, or biological pleas from the Bound Party for release. If the Enforcer compromises due to empathy, liability shifts to the Filing Party's estate.

  **Line 2: Continuity Worksheet (Attach Form C-1).**
  Calculate the percentage of psychological overlap between T1 and T2.
  *   **Overlap > 95%:** Application void. No material change in identity detected; self-binding is redundant.
  *   **Overlap 40%–95%:** Order processed as standard Self-Binding.
  *   **Overlap < 40%:** Application reclassified as a Bequest or Third-Party Restraining Order. The Filing Party cannot bind a stranger.

  **Line 3: Capacity and Resoluteness Affidavit.**
  Certify that filing is not occurring within 24 hours of the prohibited act (Post-Regret Voidance) nor during periods of unusually high resoluteness (Pre-Regret Voidance). The Office presumes impairment during states of certainty. Uncertainty is the only valid prerequisite for binding.

  **Line 4: Success Metric.**
  Applicant acknowledges that successful enforcement is measured by compliance, not agreement. Continued desire to violate the order by the Bound Party confirms efficacy. Requests for refunds based on sustained frustration will be denied.

  **Line 5: Recursion and Termination.**
  Check Box 5A to bind the Bound Party against filing Form UC-1 to reverse this order. Check Box 5B to bind the Bound Party against filing any future Form UC-1. Note: Checking Box 5B permanently revokes eligibility for Office services.

  **PART II: COLLECTIVE AND INTERGENERATIONAL APPLICANTS**

  **Line 6: Entrenchment Schedule.**
  Select the duration of binding upon successors.
  *   **Option A (Self):** Maximum 10 years.
  *   **Option B (Successors):** Maximum 99 years.
  *   **Option C (Constituent Assemblies):** Permanent.
  Generations may bind successors for durations exceeding their own binding capacity, pursuant to the Asymmetry Clause.

  **Line 7: Hypothetical Consent Certification.**
  Certify that Bound Parties would have consented had they been asked. Acknowledge that Bound Parties were not asked because they did not yet exist. Failure to obtain actual consent is waived by hypothetical rationality.

  **Line 8: Amendment Procedure.**
  Specify the vote required to lift this order. Note: The amendment procedure itself is entrenched. A rule which cannot protect itself is not a rule. The Office presumes all entrenchment clauses are self-protecting.

  **FEE SCHEDULE**

  **Filing Fee:** $50.00 (Non-refundable).
  **Release Fee:** Calculated dynamically based on the Bound Party's demonstrated willingness to pay.
  *   **Formula:** Base Rate × Distress Coefficient.
  *   **Note:** Fees are calibrated to the Bound Party's urgency. High distress indicates high value placed on release, resulting in higher fees. Applicants lacking liquidity at T2 are deemed to value the binding more highly; no waivers available. This ensures only those truly certain of error may purchase release.

  **PAPERWORK REDUCTION ACT NOTICE**
  Under the Paperwork Reduction Act of 1995, an agency may not conduct or sponsor, and a person is not required to respond to, a collection of information unless it displays a valid control number. The controlling number for this form is 1234-UC.

  **PRIVACY ACT NOTICE**
  The information provided on this form is collected to establish a binding legal obligation across temporal slices. Data provided by the Filing Party becomes the property of the Office of Anticipatory Autonomy. The Office does not recognize the Bound Party as the owner of data generated by the Filing Party. Personhood is treated as a series of discrete administrative events for the purpose of liability and enforcement. You have no right to access records held regarding your future self.

  **Office of Anticipatory Autonomy**
  *Binding Today, Protecting Tomorrow.*
