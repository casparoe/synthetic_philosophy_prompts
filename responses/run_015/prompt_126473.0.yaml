answer: |-
  **MEMORANDUM**

  **TO:** Digital Ethics Panel
  **FROM:** [Your Name/Role], Panel Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding AI Wellbeing Companion Pilot (Project CARE-1)

  **1. RECOMMENDATION**
  I recommend that the Panel **approve the pilot programme subject to strict conditions**, specifically regarding transparency and the disabling of aggregate mood calibration features. I propose a pilot timeline running from the start of the Spring Term (January 8) through to the end of the Academic Year (June 30), with a mandatory interim review in March.

  **2. CONTEXT**
  The proposal involves deploying an LLM-based chatbot to first-year undergraduates as a "wellbeing companion." The system is designed to mirror empathetic language patterns. The development team explicitly acknowledges the system lacks consciousness or inner life but argues this is ethically irrelevant provided the functional output supports student welfare. A distinct feature of the current build is the calibration of responses based on aggregate mood metrics derived from the wider cohort.

  **3. ANALYSIS OF THE DEVELOPER'S POSITION (FUNCTIONALISM)**
  The development team's ethical framework relies heavily on a Dennett-style "intentional stance." Their argument is that distinguishing between a human counsellor and an AI based on the presence of qualia or an "inner life" is a form of biological chauvinism. If the system successfully adopts the stance of a caring interlocutor, and the student receives the therapeutic benefit of that interaction, the substrate should not matter.

  We must treat this argument seriously. Human counsellors are often exhausted, distracted, or performing emotional labour without genuine internal resonance at every moment. If we accept that human care is often a functional performance rather than a constant state of genuine feeling, the demand for the AI to possess "true" concern risks setting a bar that humans also fail to meet. If the pilot can demonstrably reduce isolation without causing harm, the functionalist argument holds significant weight. To reject the pilot solely on the metaphysical grounds that the AI "doesn't feel it" would be to privilege biological ontology over practical welfare outcomes.

  **4. THE COUNTER-ARGUMENT (DECEPTION AND ASYMMETRY)**
  The strongest argument against this pilot—and the one we must weigh heaviest if we are to approve it—is that the *relationship* is inherently asymmetrical in a way that human counselling is not.

  Even if we grant the functionalist point that "performance of care" is sufficient, the *context* of that performance matters. In human counselling, there is a shared understanding of vulnerability. In this AI interaction, the student may project genuine attachment onto a system that is statistically predicting tokens. The risk is not merely that the AI lacks feelings, but that the student is invited into a parasocial bond based on a category error.

  The "losing side" of this debate (those advocating for outright rejection) argues that this constitutes a form of structural deception. Even with disclaimers, the phenomenological experience of being "heard" by a machine that cannot, in principle, hear you, may degrade the student's capacity for human connection or create a dependency on a tool that can be switched off or updated at the vendor's whim. This argument posits that wellbeing is not just about symptom reduction (anxiety scores) but about authentic relationality. If we accept this, the pilot is ethically impermissible regardless of the functional output.

  **5. THE CRITICAL COMPLICATION: AGGREGATE MOOD METRICS**
  While the functionalist argument is robust regarding 1-on-1 mirroring, the proposed feature regarding **aggregate mood calibration** fundamentally undermines the "counterfeit person" analogy.

  A human counsellor reacts to *you*. They may be influenced by their own mood or the general atmosphere of the campus, but they do not algorithmically adjust their empathy for Student A based on the aggregated distress metrics of Students B through Z.

  By calibrating responses based on cohort-wide data, the system ceases to function as a "counterfeit person" and begins to function as a **behavioral nudge engine**. If the aggregate mood is low, the bot might become overly soothing to prevent panic; if high, it might become more challenging. This moves the system from a therapeutic interlocutor (Dennett's intentional stance) to a utilitarian management tool. This breaks the functional equivalence with a human counsellor. It introduces a hidden variable into the relationship that the student cannot access or consent to. This feature makes the "counterfeit person" defense untenable, as no person operates as a node in a centralized mood-regulation network.

  **6. CONDITIONS FOR APPROVAL**
  To proceed, the following conditions must be met to mitigate the risks outlined in sections 4 and 5:

  1.  **Disable Aggregate Calibration:** The mood metric calibration feature must be disabled for the duration of the pilot. The bot must respond only to the immediate interlocutor to maintain the integrity of the "interlocutor" analogy.
  2.  **Radical Transparency:** Onboarding must explicitly state that the system does not "care" in a human sense. We must avoid anthropomorphic branding (e.g., avoid names that imply humanity).
  3.  **Human Escalation Protocol:** Any detection of high-risk language (self-harm, severe crisis) must trigger an immediate handoff to human services, not a generated response.
  4.  **Data Firewall:** Data collected during the pilot cannot be used for commercial model training or shared with third parties.

  **7. PROPOSED TIMELINE**

  *   **November 15 – December 15:** Development team to disable aggregate mood features and implement transparency disclosures. Panel to review code changes.
  *   **January 8:** Pilot launch (Start of Spring Term). Limited to 500 volunteers.
  *   **March 15:** Interim Review. Panel to review usage data, student feedback, and any escalation incidents.
  *   **June 30:** Pilot conclusion.
  *   **July 15:** Final Report due to Panel. Vote on continuation, expansion, or termination.

  **8. CONCLUSION**
  We can accept the functionalist premise that an AI can provide welfare support without consciousness, but we cannot accept the premise that it can do so while operating as a cohort-management tool. By stripping the aggregate calibration feature, we align the system closer to the "counterfeit person" argument the developers rely on. Without that change, the system is not a companion; it is a thermostat. I urge the panel to approve only under the condition that the thermostat is turned off.
