answer: |-
  **Project Title:** Multiplexed Minds: Can Teleosemantics Handle Multiple Proper Functions?

  **PI:** [Your Name]
  **Duration:** 3 Months (One Quarter)
  **Request:** Small Grant for Conceptual Research

  **The Gist**
  Here's the thing about teleosemantics: it's usually pitched like every mental representation has one "proper function." Like, a frog's fly-detector neuron has the function of catching flies, period. Ruth Millikan and the gang build the whole content-determination story on this singular history of selection. But looking at actual cognitive science, this feels too neat. Neural vehicles seem to be multiplexed. One state might carry an evolutionary rationale for error-correction *and* a separate rationale for triggering action, both tied to the same token state, neither clearly subordinate to the other.

  My half-baked idea is that this multiplexing breaks the standard content-determination story. If a state has two proper functions, does it have two contents? Or does the content shift based on context? If it shifts based on context, do we lose the naturalization story (because now we need a homunculus to pick the context)? This project is a 3-month dive to see if this problem is real and if there's a way out.

  **The Precise Question**
  Can a teleosemantic theory of content determine unique propositional attitudes for neural vehicles that possess multiple, non-hierarchical proper functions, or does functional multiplexing necessitate a context-sensitive indexing that undermines the naturalistic framework?

  **Why Standard Answers Don't Work**
  1.  **Millikan-style Teleosemantics:** This view relies on identifying *the* proper function derived from selection history. It assumes a determinate history picks out a determinate content. But if a neural vehicle was selected for Function A (say, stabilizing a system) and Function B (say, driving motor output) independently, there's no fact of the matter about which one fixes the content. The theory doesn't have a tie-breaker for co-equal functions.
  2.  **Indicator Semantics (Fodor, Dretske):** These views look for reliable covariation. But multiplexing means the state covaries with Condition X for the sake of Error Correction and Condition Y for the sake of Action. Both correlations are real. Without a functional hierarchy to privilege one correlation over the other, indicator semantics just gives us a disjunctive mess (Content = X or Y), which is too weak to explain specific behavior.

  **Methodology**
  No experiments. This is pure conceptual mapping grounded in empirical case studies.
  1.  **Literature Scan (Month 1):** I'll look for cognitive science papers explicitly discussing "neural multiplexing" or "mixed selectivity." I need concrete examples where a single neural population is documented as serving two distinct evolutionary/functional roles without one being derivative of the other.
  2.  **Conceptual Stress-Testing (Month 2):** I'll take 2-3 solid cases and run them through the standard teleosemantic frameworks. I want to show exactly where the derivation of content stalls. Is it ambiguous? Is it contradictory?
  3.  **Synthesis (Month 3):** I'll sketch what a modified theory would look like. Maybe we need a "function-cluster" account of content, or maybe we admit that naturalization only works for simplified models. The output will be a 15-20 page paper draft suitable for submission to a journal like *Philosophy of Science* or *Synthese*.

  **What Success Looks Like**
  A positive result isn't necessarily solving the problem completely (that's a book project). Success is demonstrating that functional multiplexing is a genuine, overlooked counterexample to standard teleosemantics and outlining the necessary conditions for a fix. Ideally, I show that content must be indexed to "functional modes" rather than vehicles, and argue whether this indexing can be naturalized.

  **What Counts as Failure**
  Failure is finding out that neuroscientists don't actually claim multiple *proper* functions for the same vehicle, just multiple causal roles. If it turns out all the "multiplexing" is just one main function with side effects, the philosophical problem dissolves. Also, if I get stuck trying to define "non-hierarchical" and can't distinguish it from subordinate functions within 3 months, that's a fail.

  **Scope and Risks**
  Three months is tight. The biggest risk is getting bogged down in the neuroscience. I'm not trying to become a neuroscientist; I just need enough cases to make the philosophical point. I'll limit the review to secondary literature and high-impact papers on neural coding. If I can't find clear cases of evolutionary multiplexing (vs just computational multiplexing), I'll pivot to arguing that even computational multiplexing creates the same problem for content determination. I'm keeping the goal modest: a solid argument paper, not a new theory of everything.

