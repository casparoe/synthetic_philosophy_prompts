answer: |-
  # JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON PSYCHIATRIC EPISTEMOLOGY
  **Date:** October 14, 2026
  **Subject:** Epistemic Status of Psychiatric Categories and Protocols for High-Reactivity Classifications

  ## PREAMBLE: DEFINITIONS OF OPERATIONAL DEVICES

  To facilitate empirical adjudication of theoretical disputes, the Collaboration defines the following metrics and protocols for use in this statement and subsequent research.

  **1. Reactivity Quotient (RQ)**
  For a given psychiatric category $C$, the RQ is the ratio:
  $$ RQ = \frac{I_{label}}{I_{no\_label}} $$
  Where $I_{label}$ is the incidence of $C$ in a population where the label is publicly available, identity-available, and institutionally consequential; and $I_{no\_label}$ is the incidence in a population matched on raw symptom burden and help-seeking behavior where the label has never been available as a self-description. An RQ of 1.0 indicates zero reactivity; an RQ > 1.0 indicates positive looping effects on incidence.

  **2. Self-Report Loading (SRL)**
  For a given category $C$ defined by $N$ criteria, the SRL is the fraction $k/N$, where $k$ is the number of criteria that can *only* be ascertained through the patient's own verbal or written report, without corroboration from observation, third-party report, or biological assay.

  **3. The Sealed-Derivation Protocol**
  A method for assessing historical looping.
  *   **Step A:** Isolate a dataset of clinical phenomenology collected prior to the public circulation of a specific diagnostic label $L$.
  *   **Step B:** Apply clustering algorithms to derive the optimal category structure from Step A data alone (Pre-Label Cluster).
  *   **Step C:** Compare the Pre-Label Cluster to the category structure derived from data collected after $L$ circulated (Post-Label Cluster).
  *   **Step D:** Measure the divergence in boundary, criteria weight, and validator correlation. High divergence suggests high historical looping.

  ---

  ## SECTION I: AGREED CLAIMS

  The Collaboration affirms the following propositions. These claims are intended to be substantive; acceptance does not imply surrender of core ontological commitments by either Camp V (Validators) or Camp L (Looping).

  1.  **Causal Efficacy of Classification:** Both camps affirm that the introduction of a psychiatric classification can causally alter the behavior, self-conception, and symptom reporting of individuals assigned to that category. This is an empirical claim regarding social causation, not an ontological claim regarding the reality of the disorder.
  2.  **Reactivity and Validity:** The fact that a classification affects the classified does not, by itself, establish that the category is invalid, unreal, or merely "socially constructed" in a dismissive sense. A category can be both reactive and clinically useful; conversely, a category can be non-reactive and clinically useless.
  3.  **Predictors of Loop-Proneness:** Categories with high Self-Report Loading (SRL), high public visibility, and high utility for identity-formation or resource allocation are structurally prone to higher Reactivity Quotients (RQ) than categories defined by low-SRL criteria (e.g., observable motor signs, biological markers) and restricted access.
  4.  **Looping and Underlying Distress:** Heavy looping is compatible with the category tracking a genuine underlying pattern of distress or impairment. The mechanism by which symptoms are expressed or aggregated may be influenced by the label, even if the capacity for suffering or dysfunction is not an artifact of the label.
  5.  **The Distress/Impairment Clause:** The inclusion of a distress-or-impairment clause in diagnostic criteria demonstrates that psychiatric kinds are inherently value-laden (requiring a judgment that a state is "harmful" or "dysfunctional"). This does not resolve whether the *source* of that harm is a discrete natural structure or a complex interaction between individual neurobiology and social norms.

  ---

  ## SECTION II: DISAGREEMENTS TABLE

  The following disputes remain unresolved. The Collaboration identifies these as genuine theoretical divergences rather than verbal misunderstandings.

  | Issue | Camp V Formulation (Validators) | Camp L Formulation (Looping) | Verdict & Reason |
  | :--- | :--- | :--- | :--- |
  | **1. Interpretation of Convergent Validators** | Convergent validators (genetics, course, treatment response) reveal pre-existing biological or psychological structures. Convergence indicates we are successfully carving nature at its joints. | Convergent validators may partly manufacture the structure they measure. Treatment response creates a feedback loop; genetics may correlate with a moving target. Convergence indicates stability, not necessarily pre-existence. | **Genuine.** Disagreement on the direction of causality between the category and the validator. V posits Validator $\leftarrow$ Structure; L posits Validator $\leftrightarrow$ Category $\leftrightarrow$ Structure. |
  | **2. Significance of Stability** | If a category remains stable across decades despite cultural change, this is strong evidence that it tracks a robust natural kind resistant to social fluctuation. | Stability across decades may indicate institutional inertia, stable looping equilibria, or the success of the classification in standardizing behavior, not necessarily natural kind status. | **Genuine.** Disagreement on the null hypothesis. V treats stability as the default expectation for real kinds; L treats stability as a phenomenon requiring explanation (e.g., power, institutionalization). |
  | **3. Ultimate Purpose of Classification** | The primary goal is *explanation and prediction* of underlying pathology. A category is successful if it maximizes homogeneity regarding etiology and mechanism. | The primary goal is *coordination and management* of interactive effects. A category is successful if it minimizes iatrogenic harm and facilitates effective intervention, regardless of etiological homogeneity. | **Genuine.** Teleological divergence. V prioritizes ontological accuracy; L prioritizes ethical and pragmatic outcomes of the classification act itself. |

  ---

  ## SECTION III: CRUCES AND EMPIRICAL TESTS

  The Collaboration identifies the following specific empirical outcomes as decisive for shifting confidence levels within each camp. Predictions are recorded prior to data collection.

  **Crux 1: The Sealed-Derivation Protocol on a Historical Category**
  *   **Test:** Apply the Sealed-Derivation Protocol to a category known to have high cultural uptake (e.g., PTSD or Borderline Personality Disorder), using archived pre-label data.
  *   **Camp V Prediction:** The Pre-Label Cluster will show high overlap (>80%) with the Post-Label Cluster. Validators (e.g., comorbidity patterns) will align. *Implication:* Looping is superficial; the core structure pre-existed the label.
  *   **Camp L Prediction:** The Pre-Label Cluster will show low overlap (<50%) or fracture into different clusters. Validators will shift significantly. *Implication:* The label constituted the syndrome; without the label, the symptoms clustered differently.

  **Crux 2: High RQ with High SRL Management**
  *   **Test:** A manual revision where a category with RQ > 2.0 and SRL > 0.7 is retained but flagged.
  *   **Camp V Prescription:** Reduce SRL by adding objective markers. If impossible, the category should be provisional until biological validators are found. High RQ suggests noise.
  *   **Camp L Prescription:** Retain the category but explicitly label it an "Interactive Kind." Use the RQ to inform clinicians about potential identity effects. High RQ suggests the category is doing social work.
  *   **Adjudication:** If reducing SRL improves predictive validity without reducing help-seeking, Camp V gains ground. If flagging the category reduces RQ without reducing treatment efficacy, Camp L gains ground.

  **Crux 3: The Jurisdictional Divergence Test (PWDS Specific)**
  *   **Test:** Compare incidence and symptom profile of Protracted Withdrawal and Derealization Syndrome (PWDS) in Jurisdiction A (label introduced, funded, screened) vs. Jurisdiction B (label withheld, symptoms treated under general "distress" codes).
  *   **Camp V Prediction:** Incidence rates will converge over time. Symptom profiles will remain consistent regardless of label, driven by the underlying withdrawal/derealization pathology.
  *   **Camp L Prediction:** Incidence in Jurisdiction A will significantly exceed Jurisdiction B (RQ >> 1). Symptom profiles in A will align with online community descriptions; profiles in B will remain heterogeneous.

  ---

  ## SECTION IV: APPLICATION TO PWDS

  **Subject:** Protracted Withdrawal and Derealization Syndrome (PWDS), adolescent-onset.
  **Characteristics:** 5 of 8 criteria required; 7 of 8 criteria are Self-Report (SRL = 0.875); Prevalence tripled in 5 years; Active identity community; Online origin.

  ### 1. Joint Recommendation to the Classification Committee
  Based on Agreed Claims 3 and 5, and the high SRL of the proposed category, the Collaboration jointly recommends **Provisional Inclusion with Mandated Monitoring.**

  *   **Rationale:** Exclusion risks denying care to adolescents experiencing genuine distress (Agreed Claim 4). Unrestricted inclusion risks amplifying looping effects that may distort the phenotype and inflate prevalence (Agreed Claim 3).
  *   **Conditions:**
      1.  PWDS must be coded with a marker indicating "High Reactivity Potential."
      2.  Funding for PWDS research must be contingent on the collection of non-self-report validators (observational, cognitive, biological).
      3.  Clinicians must be trained to distinguish between *reporting* symptoms and *identifying* with the syndrome.

  ### 2. Separate Predictions on Trajectory (If Included)
  *   **Camp V Prediction:** Initial incidence spikes will stabilize within 3-5 years as the "early adopter" effect fades. Validators (treatment response, family aggregation) will converge, allowing the SRL to be reduced in future revisions. The online community will fragment as clinical reality diverges from online idealization.
  *   **Camp L Prediction:** Incidence will continue to rise or fluctuate with online discourse trends. Symptom criteria will drift to match community narratives (e.g., new symptoms added by forums will appear in clinics). The category will solidify as a social identity, making biological validation difficult because the target is moving.

  ### 3. Required Follow-Up Data (Jointly Specified)
  Regardless of the inclusion decision, the Collaboration mandates the collection of the following data to resolve the Cruxes:

  1.  **Blinded Symptom Clustering:** Collect symptom data from adolescents presenting with withdrawal/derealization *without* offering the PWDS label. Cluster this data independently to see if the 5-of-8 structure emerges naturally (Sealed-Derivation proxy).
  2.  **Jurisdictional Tracking:** Implement the Jurisdictional Divergence Test (Crux 3) by rolling out the criteria in staggered regions.
  3.  **Validator Independence:** Measure treatment response and functional outcome using only third-party reports (school attendance, parent observation) to calculate a "Non-SRL Validity Score."

  ---

  **Signed,**

  *Representative, Camp V (Validators)*
  *Representative, Camp L (Looping)*
  *Oversight, Adversarial Collaboration Secretariat*
