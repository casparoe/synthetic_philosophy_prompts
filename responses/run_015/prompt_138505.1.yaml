  Colleagues, I am writing this to set out my position before we meet in nine days to vote on the future of the customs shed. After weighing the submissions and the testimony, I recommend we accept the regional housing trust proposal to demolish the structure within eighteen months and build the twenty-two affordable units, contingent on two specific conditions. First, we must formalize the agreement with the university digital heritage group to laser-scan the shed immediately and maintain the decaying virtual reconstruction for a minimum of twenty-five years. Second, the memorial garden at the quay's edge must be completed and opened concurrently with the housing units, not as a subsequent phase. I believe this course offers the only viable path that honors the survivor, serves the current community, and preserves the historical record without pretending we can arrest the decay of either buildings or memory.

  We must be plain about what this commission is deciding and what it is not entitled to decide. We are not deciding whether the deportation of 1943 is remembered; that is a duty we already hold regardless of the bricks we keep or remove. We are deciding what physical form our remembrance takes in a town that has changed fundamentally since those events. We are not entitled to decide memory on behalf of the dead, nor can we waive the duty to remember based solely on the wish of the living survivor, but we are entitled to decide how much burden the present generation bears for the sake of the past. We are defining what kind of community we intend to be, and that community includes the families who need homes now as much as the ghosts of those who lost them.

  I know the case for keeping the shed standing is profound and must be met with more than fiscal pragmatism. To the descendants who argue for preservation, the building itself is the only remaining witness. They argue that the peeling paint and the unsound trusses are not signs of neglect but evidence of endurance, a physical testament that refuses to let the event become abstract. They are right that a memorial garden is generic and that housing built on this ground risks turning the site into a mere utility, normalizing the space where people suffered. They are also right that a virtual simulation, no matter how accurate, is a surrogate. It lacks the visceral shock of standing in the actual space where the air still smells of salt and old timber. The state heritage grant offers us a way to keep that witness alive for twenty-five years without immediate cost to us, and to reject it looks like choosing convenience over conscience. There is a moral weight to presence that a headset cannot replicate, and by demolishing the shed, we lose the only tangible link left to that autumn.

  However, keeping the shed requires us to maintain a structure that is actively failing and unsafe. It requires us to prioritize the comfort of visitors over the needs of residents in a housing crisis. More importantly, it conflicts with the only voice we have from inside that shed. The survivor has asked for the ground to be paved over. She has rejected the honor of a named building. While the national organization argues that duty cannot be waived by one victim, insisting on a physical shrine she finds insulting risks turning her suffering into a spectacle for our moral edification. We are building a community for the living. If we keep the shed, we preserve the stone but risk hardening the memory into a static monument that separates us from the event. If we demolish it, we acknowledge that places change, that forgetting is what places do, and that memory must be carried by people, not just beams and mortar. The digital scan offers a way to preserve the truth of the decay without forcing the town to maintain a unsafe building indefinitely.

  I am uneasy about this recommendation because it is convenient. It solves our housing shortage and costs the town almost nothing beyond the garden landscaping. It allows us to feel we have done our duty via the digital scan while relieving us of the maintenance burden. I want us to vote for this despite that convenience, not because of it. We should accept the university's offer only if they contractually agree to maintain the simulation and its annual decay scans for at least twenty-five years, matching the heritage grant's timeline. We must demolish the shed within the eighteen-month window proposed by the housing trust to ensure the units are available when needed. The memorial garden must be completed concurrently with the housing, not as an afterthought. This path admits that we cannot keep the past physically present forever. It accepts that the town is a moral community of the living, who must house themselves while remembering the dead without being paralyzed by them. It respects the survivor's wish for oblivion while ensuring the record remains accessible through the digital archive. I ask you to support this motion so we can resolve this before the grant lapses in June.

  The single fact that would most quickly move me to a different recommendation is if the university digital heritage group cannot legally bind themselves to maintain the simulation and data storage for the full twenty-five years, as a abandoned virtual memorial would be worse than none. My reasoning is most likely to fail in underestimating the symbolic power of the physical space for the descendants who view the building as a sacred witness rather than a unsafe structure. I suspect I have dressed up a budgetary and political conclusion in moral language, as the housing need and cost savings are significant drivers of this choice despite my ethical framing.
