      *   *Did Good assume CDT?* Good's original proof is compatible with standard Bayesian decision theory, which usually implies CDT in this context. If an agent uses EDT, Good's theorem can fail even in simple cases because conditioning on information can screen off causal paths. I should mention this distinction.
      *   *Is "Free" the issue?* Usually not the cost of the test, but the cost of the *state* of knowing.
      *   *Is "Fixed Preferences" the issue?* Yes, specifically state-separability.

  8.  **Final Polish:** Ensure the distinction between *instrumental* value (making better choices) and *intrinsic* value (feeling good/bad) is sharp. This is the most common source of confusion in the medical test example.

