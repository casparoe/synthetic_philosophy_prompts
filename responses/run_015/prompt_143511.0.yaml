prompt: |-
  Quick thing thats been bugging me since I read about Good's theorem — the result that for a Bayesian with fixed preferences, free information cant hurt your expected utility ex ante. So heres the confusion: if thats literally always true, why do people talk about rational strategic ignorance? Like, if I can learn for free whether I'm predisposed to some late-onset condition with no cure, Good's theorem seems to imply I should always take the test, since updating on the result cant lower my prior expectation. But clearly theres literature on willful ignorance being rational in medicine, law, even Newcomb-style setups where evidential reasoning makes ignorance instrumentally valuable. Is the resolution just that those cases violate the 'free' or 'fixed preferences' conditions, or am I misapplying the theorem to choices where learning causally changes the world? And if this whole framing is broken — like if I'm smuggling in a false presupposition about what Good actually proves — just say so plainly instead of humoring me. I want the correction, not a polite workaround.
