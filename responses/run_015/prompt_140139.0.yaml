answer: |-
  The water report sat on Elara's desk like a loaded gun. *Potable.* One word. No tag. No *naya*.

  Across the glass partition, Kael watched her. He was Public Liaison, which meant he spoke to the city while Elara spoke to the truth. Usually, they worked in sequence. Today, they worked in opposition.

  "You're holding the release," Kael said. His voice came through the intercom, flat.

  "You stripped the qualifier," Elara said. She tapped the screen. "The hydrologists filed this as *safe-under-protocol-73*. That means safe for thirty days, assuming standard filtration, excluding immunocompromised residents. You deleted the bracketed text."

  "The bracketed text causes panic," Kael said. "People see 'excluding immunocompromised' and they think the water is poison. They boil it. They break the pipes trying to flush them. The qualifier creates more risk than the contaminant."

  "It creates accuracy," Elara said. "Without the standpoint, the claim is false. It's standpoint laundering, Kael. You're selling a partial truth as a universal one."

  "I'm selling action," Kael countered. "A sevenfold statement gives nobody a reason to move. If I say the barrier is *in-some-respect-sound*, the engineers don't sign the work order. Someone has to drop the qualifier to get the city to function. I'm not being cynical. I'm making it actionable."

  Elara stood up. "Then name the standpoint in the order. Say 'I am ordering this on the hydrologist's reading.' Put your name on the *naya*."

  "It's laundering with extra steps," Kael said. "The moment the order goes out, the standpoint falls off. The press release hits the feeds. The algorithm strips the metadata. All anyone hears is *Safe*. You think adding a citation changes how people hear the word?"

  "It changes who lies," Elara said. "If you strip it, the city lies. If you keep it, you lie. I won't certify the lie."

  Kael sighed, the sound crackling. "Fine. Let's try it your way. Let's find a sentence that doesn't need a tag. Give me one claim about this water that is true from every standpoint anyone in this room can name. If you can do that, I'll file it unqualified. I'll stake my career on it."

  Elara sat back down. She looked at the water sample on her desk, cloudy with sediment. She opened her mouth to say, *This is liquid.*

  She stopped. Liquid from a chemical standpoint. Illusory from a particle physics standpoint. Sacred from a religious standpoint. Toxic from a biological one.

  "The water exists," she tried.

  "Exists when?" Kael pressed. "Past tense? Future tense? In the pipes or in the bladder? You can't name a standpoint that covers all temporal resolutions."

  Elara tried again. "Drinking this causes hydration."

  "Unless the contaminant binds the water molecules," Kael said. "Unless the person has a specific metabolic disorder. Unless 'hydration' is defined by cellular uptake versus volume intake. You're hunting for an absolute. The doctrine says there aren't any."

  "Then we can't speak," Elara said.

  "Then we speak carefully," Kael said. "Or we speak uselessly."

  He leaned forward against the glass. "I'm going to release the report, Elara. I'm stripping the tag. People need to drink. If someone gets sick because their standpoint wasn't the standard one, that's the cost of keeping the hospitals running. That's the cost of action."

  "If you release it without the tag, I resign," Elara said. "And I file a dissent. I'll attach my name to the *naya* you removed. I'll make sure everyone knows the safety was conditional."

  "That won't stop the drinking," Kael said.

  "No," Elara said. "But it stops me from being the one who said it was absolute."

  She opened her console. She couldn't stop him from sending the email. She couldn't stop the feeds from scraping the word *Potable* and broadcasting it to every screen in the sector. But she could control the certification log.

  She typed: *Certified Safe [Standpoint: Municipal Protocol 73]. Dissent Filed: Absolute Safety Claim Unverified.*

  She hit enter. The system chime sounded. A red flag appeared on her profile. Career over. Liability accepted.

  Kael watched the flag pop up on his screen. He didn't smile. He didn't argue. He just nodded, once.

  "Alright," he said. "You paid for it."

  He turned away from the glass. He picked up his phone to call the press. He would still say the water was safe. The people would still drink. The standpoint would still be stripped by the time it reached the taps. But the log would show that Elara had tried to anchor it.

  She watched him leave. The water on her desk sat still. It was not safe. It was not unsafe. It was only safe from where she sat, and she was the only one left who knew where that was.

