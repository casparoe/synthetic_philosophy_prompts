answer: |-
  This phenomenon does not have a single, canonical "Effect" name (like *Endowment Effect* or *Decoy Effect*) that specifically captures the *search termination* dynamic you are describing. It is a specific, under-labeled instantiation of **Reason-Based Choice** (Shafir, Simonson, & Tversky, 1993) operating within a sequential search process under conditions of **Accountability** (Lerner & Tetlock, 1999).

  However, since you need a term for a slide that captures the *mechanism* and the *stopping rule* specifically, you should coin/use:

  ### **The Justifiability Stopping Rule**

  Here is the tight carving you asked for.

  #### **1. The Mechanism**
  Standard rational search models (and plain satisficing) assume the stopping rule is a function of **expected utility**: *Stop when $E[Utility] \geq Aspiration$.*

  The **Justifiability Stopping Rule** posits that the agent is actually satisficing on **defensibility**: *Stop when $P(Defendable) \geq Threshold$.*

  The mechanism is **Reason Availability**. As the dimensionality of the options increases (more attributes, longer files, richer descriptions), the probability of finding a *unique, locally salient attribute* that serves as a sufficient justification increases. Because this probability rises faster than the rate at which utility-optimizing options are encountered, the search terminates earlier. The agent substitutes the hard problem ("Is this the best fit?") with the easy problem ("Can I say why this is the one?").

  #### **2. Definition for the Slide**
  > **The Justifiability Stopping Rule:** A search heuristic where termination is triggered not by an option meeting a pre-defined quality threshold, but by the availability of a unique, articulable reason to prefer that option.
  >
  > **Signature:** Search duration decreases as option describability increases, resulting in lower utility on the original criteria.

  #### **3. Edges: What Counts and What Doesn't**
  To keep this distinct from its neighbors on your slide, use these boundaries:

  *   **Clear Case (Counts):** A hiring committee ignores a candidate with stronger publications (the original criteria) to hire a candidate with a unique sub-specialty because "we need someone to cover that course." The unique attribute provides the sentence that closes the discussion.
  *   **Clear Case (Counts):** Apartment hunting stops on a unit with a "desk by a window" despite a longer commute and higher rent, because the desk provides a defensible reason to a spouse or self, whereas "better value" is vague.
  *   **Non-Case (Doesn't Count):** Stopping search because the cost of further search (time, money) exceeds the expected gain. (This is standard *Optimal Search*).
  *   **Non-Case (Doesn't Count):** Stopping because an option clearly meets the original aspiration level (e.g., "She has 5 publications in top journals, which is what we asked for"). (This is plain *Satisficing*).
  *   **Non-Case (Doesn't Count):** Post-hoc rationalization where the reason is generated *after* the choice is made to reduce cognitive dissonance. In the Justifiability Stopping Rule, the reason *precedes* and *causes* the termination.
  *   **Non-Case (Doesn't Count):** Choosing an option because a unique attribute actually *matters* for utility (e.g., "We need someone to teach Perception" when Perception is actually a critical departmental need). The key is that the reason overrides the *original* criteria, not that it supplements them.

  #### **4. Observable Differences & Predictions**
  Your intuition on the predictions is correct. Here is the specific falsifiable profile:

  1.  **The Dimensionality Prediction:** If you increase the number of describable attributes per option (without changing the actual quality distribution), search time should **decrease** and average utility of the chosen option should **decrease**. (Standard search theory predicts search time should increase or stay neutral as you evaluate more data).
  2.  **The Accountability Prediction:** If you remove the need to justify the choice to others (anonymous selection) or to oneself (framing it as a "guess" rather than a "decision"), the effect should **vanish** or significantly weaken.
  3.  **The Reason-Stripping Prediction:** If you present options with identical attributes but strip the ability to articulate a unique reason (e.g., "Option A is better but you can't say why"), agents following this rule will experience higher decision anxiety and may prolong search unnecessarily compared to agents told to "go with their gut."

  #### **5. Commitment & Confidence**
  I am committing that this is **distinct from plain satisficing**.

  *   **Why:** In plain satisficing, the aspiration level is set on the *value dimension* (quality). In the Justifiability Stopping Rule, the aspiration level is set on the *meta-cognitive dimension* (ease of defense). They can come apart, as you observed (middling candidate + unique reason = hire).
  *   **Confidence:** High (85%) that this is a real, distinct mechanism, grounded in the robust literature on Reason-Based Choice and Accountability.
  *   **What would convince me I'm wrong:** If data showed that increasing attribute descriptions *increased* search time even when accountability was high. If the "unique reason" was actually a reliable proxy for the original utility criteria (i.e., if "unique training" actually predicted "strong research" in your field), then this would just be a heuristic for quality, not a justifiability bias. You would need to show that the "reason" is orthogonal to the "quality."

  **Summary for your students:**
  Call it **The Justifiability Stopping Rule**. It is the tendency to stop looking not when you find the *best* thing, but when you find the easiest thing to *explain*. It turns search into a writing exercise: you stop when you can write the sentence.
