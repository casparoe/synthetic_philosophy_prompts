answer: |-
  The tension you have identified is not a bug in the system; it is the central architectural feature of modern patent law. The apparent incoherence arises because patent law attempts to serve two conflicting social functions using a single textual instrument. To understand the theory of meaning presupposed here, one must look not to pure semantics or hermeneutics, but to **regulatory pragmatism**.

  The practice presupposes a theory of meaning that might be termed **Objectified Intentionalism within a Public Notice Framework**. It is not strictly textualist, nor strictly intentionalist, but rather *performative*. A patent is not merely a description of an idea; it is a speech act that creates a property right. The "meaning" of the text is subordinate to the "effect" of the grant.

  Here is an explicit breakdown of the theory, its coherence, and the implications of shifting its philosophical underpinnings.

  ### 1. The Theory of Meaning: The PHOSITA as a Normative Construct
  You ask whether the "Person Having Ordinary Skill In The Art" (PHOSITA) is a prediction of an actual audience or a normative construct. Legally and philosophically, it is the latter.

  *   **The Construct:** The PHOSITA is not a real reader. They are a legal fiction designed to stabilize the interpretive environment. They possess all prior art knowledge but zero inventive capacity.
  *   **The Function:** By fixing meaning to this construct at the filing date, the law creates a **temporal anchor**. This prevents hindsight bias (reading the claim in light of the accused infringer's device) and prevents the patent from becoming a moving target as language evolves.
  *   **The Coherence:** This resolves the first part of your tension. The text is read through the eyes of a fictional reader *not* to discover truth, but to establish **reliance interests**. Competitors must be able to read the document and know where the fence is.

  However, this textualism is "soft." It is committed to the *public record* of intention, not the *private mental state* of the inventor. When the law allows an inventor to act as their own lexicographer (defining a term contrary to ordinary usage), it is not deferring to their mind; it is deferring to their **written stipulation**. The intent only matters if it is objectified in the intrinsic record. This preserves the notice function: the public can see the definition in the spec.

  ### 2. Semantic Content vs. Legal Scope
  You ask if the practice can be rendered coherent by separating the semantic content of the claims from the scope of the legal right. **Yes, this is the only way to make the system philosophically consistent.**

  *   **Semantic Content (Claim Construction):** This is the textualist layer. What do the words mean to the PHOSITA at the time of filing? This is binary (infringed/not infringed literally). This serves the **Notice Function**.
  *   **Legal Scope (Doctrine of Equivalents & Estoppel):** This is the equitable layer. How far does the monopoly extend beyond the literal words? This serves the **Reward Function** (preventing fraud on the patent by making trivial changes).

  **Where the practice is underdetermined:**
  The tension you feel arises because courts often conflate these two layers during litigation.
  *   **Intentionalist License:** Prosecution History Estoppel is purely intentionalist (or rather, representational). It says, "You told the examiner X to get the patent; you cannot tell the court Y to enforce it." This is not about what the words mean; it is about **equitable estoppel**. It licenses an intentionalist reading because it punishes strategic ambiguity.
  *   **Textualist License:** The "unforeseeable equivalent" exception you noted is textualist. If the technology didn't exist, the inventor couldn't have intended it, yet the patent may still cover it. Why? Because the *semantic capacity* of the language (e.g., "means for connecting") was broad enough to encompass the new tech, even if the *authorial intent* was not.

  **The Coherent View:** The patent text defines the *core* of the property (semantic content). The legal doctrines (equivalents, estoppel) define the *fence lines* and *easements* around that property (legal scope). The "meaning" is fixed; the "right" is flexible based on the inventor's behavior during procurement.

  ### 3. The Collaborative Author
  The fact that a patent is drafted by inventors, prosecuted by attorneys, and examined by a government agent fundamentally changes the authorship theory.

  *   **Death of the Romantic Author:** Patent law cannot presuppose a unitary authorial intent because there isn't one. The attorney wants breadth; the examiner wants narrowness; the inventor wants coverage.
  *   **The File Wrapper as Author:** Consequently, the "author" is the **administrative record**. This justifies why extrinsic evidence (inventor testimony) is secondary. The inventor's later testimony about what they "meant" is unreliable because the "intent" was already negotiated and compromised in the written record.
  *   **Implication:** This supports the **Public Notice** theory. The public relies on the documents, not the minds of the committee that wrote them. If the committee failed to write it down, the public is not bound by it.

  ### 4. Counterfactuals: What if the Theory Shifted?

  If you were to replace the current hybrid model with a pure version of either theory, the implications for ML and gene-editing litigation would be drastic.

  #### Scenario A: Thoroughgoing Intentionalism
  *   **The Change:** Inventor testimony becomes central. Meaning runs with what the inventors meant. Claims are merely evidence of intent, not boundaries.
  *   **The Result:**
      *   **Uncertainty:** Competitors could never know if they are infringing until a jury hears from the inventor. This chills innovation, particularly in cumulative fields like software and genomics.
      *   **Hindsight Bias:** In litigation, every invention looks obvious in retrospect. Allowing inventors to explain their "true" meaning allows them to stretch the patent to cover the accused device retroactively.
      *   **ML/Genomics Impact:** In ML, where the "invention" might be a specific weight configuration or a black-box outcome, intentionalism would allow patentees to claim the *function* ("sorting data") rather than the *structure*, effectively monopolizing abstract ideas.

  #### Scenario B: Thoroughgoing Textualism
  *   **The Change:** Only the ordinary meaning of the words counts. No Doctrine of Equivalents. No lexicographer exceptions (standard dictionary only). No prosecution history estoppel (words are words).
  *   **The Result:**
      *   **Design-Arounds:** Innovation would shift to "inventing around" patents. Competitors would make trivial, non-functional changes to escape the literal text.
      *   **Obsolescence:** Patents would become useless faster. In gene editing, a competitor might change a single base pair or use a slightly different Cas9 variant. Under pure textualism, this is not infringement, even if it does the exact same thing.
      *   **Drafting Arms Race:** Attorneys would write claims thousands of words long to cover every permutation, making patents unreadable to the public (defeating the notice function).

  ### 5. Synthesis for Your Piece
  The theory presupposed by current practice is **Institutional Pragmatism**. It accepts that language is imperfect (hence Equivalents) but that property rights must be stable (hence Claim Construction).

  It is not philosophically pure, but it is functionally coherent if viewed as a **contract of disclosure**.
  1.  **The Inventor promises** to disclose the invention clearly (Textualism/Notice).
  2.  **The Public promises** not to steal the essence of the invention even if they tweak the words (Equivalents/Reward).
  3.  **The Court enforces** the bargain by holding the inventor to their representations during the deal-making (Estoppel).

  **For your piece on ML and Gene-Editing:**
  This tension is currently breaking down in these fields.
  *   **ML:** How do you claim a "black box" algorithm textually? If the claims are functional ("a system that learns"), textualism rejects them as abstract ideas. If they are structural, they are too easy to design around. The "intent" of the inventor is often unknowable even to them (deep learning weights).
  *   **Gene-Editing:** CRISPR claims often hinge on specific sequences. If a competitor uses a slightly different guide RNA, is it an "equivalent"? The "unforeseeable equivalent" doctrine becomes critical here. If the editing mechanism was unforeseeable at filing, does the patent cover it?

  **Conclusion:**
  The practice is not incoherent; it is **dialectical**. It balances the need for fixed boundaries (text) against the reality of technological fluidity (equivalents) and the necessity of administrative fairness (estoppel). It relies on the PHOSITA not as a real reader, but as a **regulatory standard**. To make it coherent, you must accept that a patent claim is not a sentence in a novel to be interpreted, but a **deed to a plot of land**. The deed has a surveyor's description (text), but the law also recognizes adverse possession, easements, and encroachments (equivalents and estoppel) based on how the owner behaved when they got the deed.

  If you replace this with pure intentionalism, you get chaos. If you replace it with pure textualism, you get obsolescence. The current "incoherence" is the friction required to keep the system moving.
