answer: |-
  There is no single, canonical term in the philosophy of history or counterfactual methodology that captures this specific evaluative asymmetry. While the "minimal-rewrite rule" (Tetlock & Belkin, 1996) is the standard guideline, your observation identifies a systematic blind spot within it: the rule counts *changes*, but historians evaluate *structures*.

  However, the phenomenon you describe is a recognized implicit practice that draws heavily from **Institutional Complementarity** (political economy) and **Configurational Analysis** (sociology/QCA). In the context of counterfactual evaluation, the most precise label for this phenomenon would be **"Configurational Plausibility"** or the **"Cluster Coherence Heuristic."**

  Below is a precise definition of the phenomenon, its distinction from related concepts, and the criteria for distinguishing legitimate bundles from ad hoc constructions.

  ### 1. Precise Definition: Configurational Plausibility

  **Configurational Plausibility** is the evaluative principle wherein the probability of a counterfactual antecedent is determined not by the cardinality of altered variables, but by the *covariance structure* of those variables within a recognized historical system.

  *   **The Atomistic Fallacy:** Treating every variable change as an independent probability event (e.g., $P(A \land B \land C) = P(A) \times P(B) \times P(C)$). This leads to the rejection of "scattered" scenarios.
  *   **The Configurational Correction:** Recognizing that certain variables are functionally or causally linked, such that altering one *necessitates* or *highly predisposes* the alteration of others (e.g., $P(A \land B | System) \approx P(A)$). This allows "clustered" scenarios to pass as a single intervention.

  The asymmetry you observe exists because historians intuitively apply **Bayesian updating** based on structural models. A clustered change implies a single latent cause (e.g., "a constitutional convention"), whereas scattered changes imply multiple independent exogenous shocks, which violates the principle of parsimony.

  ### 2. Distinctions from Related Concepts

  To operationalize this, we must distinguish Configurational Plausibility from two concepts it is often confused with.

  #### A. vs. Institutional Path-Dependence
  *   **Path-Dependence** is a *temporal* claim about how past decisions constrain future options (increasing returns, lock-in). It explains why a specific trajectory is hard to exit.
  *   **Configurational Plausibility** is a *structural* claim about simultaneous coherence. It explains why certain *combinations* of variables are stable or unstable at a specific moment.
  *   *Example:* Path-dependence explains why a country doesn't switch from common law to civil law overnight. Configurational Plausibility explains why, if they *did* switch the legal code, they would also have to change judicial training and law school curricula to make it plausible.

  #### B. vs. Auxiliary-Hypothesis Adjustments
  *   **Auxiliary Hypotheses** (in the Lakatosian sense) are modifications made to the *consequent* or the *linking theory* to protect a core hypothesis from falsification (e.g., "The revolution failed *because* of unexpected rain," rather than structural weakness). This is often viewed as defensive or ad hoc.
  *   **Configurational Plausibility** applies to the *antecedent* (the "if" clause). It is constructive, not defensive. It seeks to make the starting point of the counterfactual historically viable, rather than explaining away a failed prediction.
  *   *Key Difference:* An auxiliary adjustment saves the *theory*; a configurational bundle saves the *scenario's realism*.

  ### 3. Conditions for Legitimate Bundles vs. Ad Hoc Bundles

  If the number of changes doesn't matter, what prevents historians from simply grouping any set of variables into a "bundle" to make a wild scenario plausible? To distinguish a **Legitimate Institutional Bundle** from an **Ad Hoc Conjuncture**, three conditions must be met:

  #### Condition 1: Functional Interdependence (The "Necessity" Test)
  The variables in the bundle must share a functional relationship where the presence of one logically or practically requires the presence of the other within that specific regime type.
  *   *Legitimate:* Changing the electoral formula (proportional representation) *requires* changing party financing rules, because the old financing rules were designed for single-member districts.
  *   *Ad Hoc:* Changing the electoral formula *and* the national bird. There is no functional link; this is just two changes masquerading as a bundle.

  #### Condition 2: Common Generative Mechanism (The "Cause" Test)
  There must be a plausible historical agent, event, or crisis that could causally produce the *entire* bundle simultaneously.
  *   *Legitimate:* A "Constitutional Convention" is a latent variable that can plausibly alter voting rules, judicial review, and federal structure all at once.
  *   *Ad Hoc:* Voter turnout, judicial independence, and military loyalty changing simultaneously without a unifying event (like a revolution or regime collapse) implies three separate miracles. If the scenario posits a "Revolution," the bundle becomes legitimate because the revolution is the common cause.

  #### Condition 3: Empirical Existence Proof (The "Precedent" Test)
  Has this specific configuration of variables existed elsewhere in history, even if not in the specific case being studied?
  *   *Legitimate:* If you propose a bundle of welfare policies, labor laws, and tax structures for 19th-century Germany, you can point to Bismarck's actual reforms or parallel developments in Scandinavia as proof that this "bundle" is historically possible.
  *   *Ad Hoc:* If you propose a bundle of variables that has no analogue in the historical record (e.g., a democratic franchise combined with a command economy in 1850), it is treated as a theoretical construct rather than a historical possibility.

  ### Summary for Evaluation
  When you encounter this asymmetry in your work, you can classify it as a conflict between **Atomistic Minimalism** (counting changes) and **Systemic Coherence** (evaluating structures).

  To defend a "clustered" counterfactual against critics who claim it is "too many changes," argue that you are not proposing $N$ changes, but rather **one structural transformation** with $N$ manifestations. To critique a "scattered" counterfactual, argue that it lacks a **latent generative variable** to account for the covariance, thereby violating the probabilistic logic of historical causation.
