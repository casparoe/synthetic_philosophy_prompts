answer: |-
  This document represents a joint statement regarding the epistemological framework underlying our flood-risk forecasting protocols, specifically addressing the tension between accuracy-centric norms and broader norms of inquiry. We begin by stating our areas of agreement to establish a baseline for the review board. Both of us agree that accuracy is a fundamental epistemic good, meaning that having credences that align with the truth is inherently valuable for an agent engaged in forecasting. We both agree that strictly proper scoring rules are the correct mathematical tool for measuring the accuracy of credal states, as they ensure that an agent maximizes their expected score only by reporting their true credences. We further agree that inaccuracy is at least an epistemic bad, even if it is not the only one. Regarding the formal vindication of probabilism and conditionalization, we both accept that dominance arguments successfully show that if an agent aims to maximize accuracy as measured by a strictly proper scoring rule, they ought to maintain probabilistic coherence and update by conditionalization. We also agree that the recent failure regarding the unchecked creek represents a significant institutional failure, though we differ on the precise categorization of that failure. Our disagreement lies not in the mathematics of scoring rules or the value of accuracy, but in whether accuracy is the sole fundamental epistemic good and whether the activity of inquiry is governed by norms that cannot be reduced to the accuracy of the resulting credal states.

  The first point of divergence concerns the inherited-model case, where a forecast is handed down from head office, proves extremely accurate, but is never understood or checked by the local team. The accuracy-first position maintains that if the credences are accurate, there is no epistemic defect in the state of belief itself, because the fundamental good is closeness to the truth. The inquiry-centric position argues that there is a distinct epistemic failing in relying on a model one does not understand and has not verified, because epistemology governs the process of forming belief, not just the final state. The crux here is whether epistemic value attaches solely to the relation between mind and world or also to the relation between the agent and their reasons. If asked to resolve this, the accuracy-first theorist predicts that further analysis will show understanding is merely a pragmatic aid to maintaining accuracy, while the inquiry-centric theorist predicts that cases of accurate guesswork will continue to be intuitively judged as epistemically inferior to accurate understanding, suggesting accuracy is not the whole story.

  The second crux involves question-shopping, illustrated by two forecasters who are equally accurate on the questions they chose to answer, where one deliberately chose only easy questions while the other tackled hard, high-stakes ones. The accuracy-first framework typically treats the set of questions as fixed and evaluates accuracy relative to that set, implying there is no epistemic complaint against the forecaster who chose easy questions provided their reported credences were accurate. The inquiry-centric view holds that selecting which questions to answer is itself governed by epistemic norms of relevance and importance, and that ignoring high-stakes questions is an epistemic failure regardless of accuracy on the chosen set. The crux is whether the selection of propositions for belief is inside or outside the scope of epistemic evaluation. The accuracy-first theorist predicts that any norm governing question selection will turn out to be pragmatic rather than epistemic, whereas the inquiry-centric theorist predicts that a purely accuracy-based framework will remain unable to distinguish between responsible forecasting and strategic avoidance of difficult truths.

  The third area of disagreement concerns the status of suspension of judgment, specifically whether saying we genuinely have no idea is just a middling credence of 0.5 or a third kind of attitude distinct from credence. A framework that only scores credences must treat suspension as a specific probability assignment, typically 0.5 in a binary case, which is then subject to scoring. The inquiry-centric view argues that suspension is a refusal to assign a credence at all, and that forcing a number obscures the epistemic situation of total ignorance. The crux is whether the space of doxastic attitudes is exhausted by credences or includes a non-probabilistic state of withholding. The accuracy-first theorist predicts that treating suspension as 0.5 will suffice for all decision-theoretic purposes and that positing a third state is unnecessary complexity, while the inquiry-centric theorist predicts that scoring a suspension as 0.5 will misrepresent the agent's epistemic position when evidence is absent versus when evidence is balanced.

  The fourth crux addresses whether going out and getting more evidence can actually lower your expected accuracy, and whether this depends on the scoring rule. We agree that for standard strictly proper scoring rules, the expected accuracy of updating on free evidence is non-negative, meaning you should not expect to become less accurate by looking. However, we acknowledge that this result is sensitive to the choice of scoring rule and the assumptions about how evidence is processed, and there are technical contexts where expected accuracy might not rise if the rule penalizes uncertainty heavily or if updating is not ideal. The accuracy-first theorist views the general guarantee that expected accuracy rises as a vindication of the norm to seek evidence, treating any exceptions as technical details. The inquiry-centric theorist views the sensitivity of this result as an embarrassment, arguing that the duty to seek evidence should not depend on the mathematical properties of a specific scoring rule. The crux is whether the norm to gather evidence is derived from the expected accuracy calculation or is a primitive norm that accuracy measures merely track. The accuracy-first theorist predicts that refining the scoring rule will eliminate the exceptions, while the inquiry-centric theorist predicts that the dependence on the rule shows that accuracy is not the foundation of the evidence-seeking norm.

  The fifth crux concerns how much the dominance argument for probabilism depends on which scoring rule you start from, and whether this helps either side. We both accept that dominance arguments work for any strictly proper scoring rule, showing that non-probabilistic credences are always dominated by some probabilistic set. The accuracy-first theorist argues this universality shows that probabilism is required by accuracy alone, regardless of which specific measure of accuracy one uses. The inquiry-centric theorist argues that the need to choose a scoring rule introduces a value judgment that is not itself determined by accuracy, meaning the foundation of the argument rests on a choice that accuracy cannot justify. The crux is whether the choice of a scoring rule is a neutral measurement decision or a substantive normative commitment. The accuracy-first theorist predicts that all strictly proper rules are equally valid measures of the same underlying quantity, while the inquiry-centric theorist predicts that different rules will prioritize different epistemic virtues, such as calibration versus resolution, implying the choice matters.

  Finally, we address whether some of the fight is just about the word epistemic. The accuracy-first theorist contends that the inquiry-centric view is smuggling pragmatic values into the epistemic category, and that if we reserve epistemic for truth-related goals, the disagreement dissolves. The inquiry-centric theorist contends that the accuracy-first view is artificially narrowing the epistemic category to exclude essential components of rational inquiry, such as relevance and understanding, and that this narrowing is unmotivated. We agree that this terminological dispute masks a substantive disagreement about whether the norms governing our flood-risk forecasting should be solely about being right or also about being responsible in how we arrive at our numbers. The accuracy-first theorist predicts that clarifying the definition will show the inquiry norms are pragmatic, while the inquiry-centric theorist predicts that clarifying the definition will show the accuracy norms are too thin to guide professional practice. Resolving these cruxes would require either demonstrating that understanding and question selection can be reduced to long-term accuracy metrics or demonstrating that accuracy is merely one component of a pluralistic epistemic value system. Until then, we recommend that the review board recognize that while our scoring methods are mathematically sound, they may not capture all the epistemic responsibilities involved in managing flood risk.
