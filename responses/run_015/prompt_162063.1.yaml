  3.  **Identify the Implicit Theories:**
      *   **Theory A (The Real-World Practice):** "Deliberative Mini-Publics."
          *   *Goal:* Improve quality of decision-making through informed deliberation, not necessarily replace representation.
          *   *Legitimacy Source:* Epistemic (knowledge/truth-seeking) + Descriptive (looks like us).
          *   *View on Governing:* It's complex; ordinary people need help (experts) to understand it.
          *   *View on Representation:* A small group can *simulate* the public will if they look like the public and think hard enough.
      *   **Theory B (The User's Daydream):** "Sortition Legislature."
          *   *Goal:* Replace/Augment electoral corruption with true representation.
          *   *Legitimacy Source:* Political Equality (one person, one chance) + Authority (binding votes).
          *   *View on Governing:* It's about values/interests, not just technical skill. Skills can be hired (staff).
