      *   *User's Critique:* If ordinary judgment is enough, why filter volunteers? If equal chance is key, why filter volunteers? If it's representative, why is it advisory?
      *   *User's Alternative:* Long term (6 years), Paid like legislators, Hire staff, No re-election, 50/50 hybrid chamber.
