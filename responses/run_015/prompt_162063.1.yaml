      *   *What does it presuppose about binding decisions?*
          *   Real-world: Legitimacy is too weak to bind. It's a "safety valve" or "consultation."
          *   User's version: Legitimacy comes from the math of the lottery, so it *should* bind.

      *   *Mirroring vs. Equal Chance:*
          *   Real-world: Leans heavily on **Mirroring**. The "Equal Chance" is broken by the volunteer filter. They need the group to *look* like the population to claim they speak for them.
          *   Compatibility: They are incompatible in the current model. You can't claim pure random selection (equal chance) if you reject non-volunteers.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the user's experience. Validate their skepticism. It's sharp.
      *   *Section 1: The Two Stories.* Define "Mirroring" (Descriptive) vs. "Equal Chance" (Procedural).
      *   *Section 2: The Real-World Practice (Citizens' Assemblies).*
