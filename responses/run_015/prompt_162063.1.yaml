      *   **Specific Task:** Distinguish between what the practice *commits* you to vs. what it just *sits nicely* with. Determine if the "mirroring story" (descriptive representation) and the "equal-chance story" (procedural fairness) are compatible in the real-world version.

  2.  **Deconstruct the User's Observation:**
