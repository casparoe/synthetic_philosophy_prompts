answer: |-
  You have spotted the crack in the foundation that most people who write about this try to paper over. You're right: the current practice is trying to wear two different hats at once, and they don't fit on the same head.

  Since you asked for the implicit theory rather than a sales pitch, here is the breakdown of what the current system actually assumes, what your daydream assumes, and where the contradiction lies.

  ### 1. The Two Stories
  You identified them perfectly. Let's name them so we can track them.

  *   **The Equal-Chance Story (Procedural):** Every adult has the same mathematical probability of being chosen. This is the "Jury Duty" model. It claims legitimacy because the process was fair, regardless of who ended up in the room.
  *   **The Mirroring Story (Descriptive):** The group in the room looks like the country (age, gender, region, education). This claims legitimacy because the group is a miniature version of the whole.

  ### 2. What the Current Practice Actually Commits You To
  The real-world version (volunteers, stratified, advisory, short-term) is not built on the **Equal-Chance Story**. It cannot be. As you noted, the moment you throw out the names of people who say "no thanks," the lottery is no longer random. It is now a lottery of *people who like this sort of thing* or *people who can afford the time*.

  Instead, the current practice commits you to a third story: **The Deliberative Focus Group.**

  *   **On Representation:** It presupposes that "representing" the people doesn't mean *being* the people; it means *simulating* what the people would think if they had the time and information to study the issue. It assumes raw public opinion is usually ill-informed or emotional, and that a small group can "purify" that opinion through discussion.
  *   **On Governing as a Skill:** It commits to the idea that governing is technical. That's why you have the "expert weekends." It assumes an ordinary person cannot judge policy without being taught the constraints first. It treats political judgment like a test you have to study for, rather than a matter of values or interests.
  *   **On Binding Authority:** It presupposes that legitimacy comes from *consensus among elites*, not the math of the draw. Because the group was self-selected (volunteers), it lacks the moral authority to force the country to do something. Therefore, its output must be advice. If it were binding, the "volunteer filter" would be a scandal (imagine a tax hike decided by 100 volunteers who ignored the invitation letter).

  **What this practice just "sits nicely" with (but doesn't require):**
  It sits nicely with democratic language ("people power"), but it doesn't require actual democratic power. It works fine under a theory of **Paternalistic Consultation**. The elites say, "We want to hear from the real people," but they retain the right to ignore them if the "real people" ask for something too expensive or radical.

  ### 3. The Verdict on the Two Stories
  You asked which one the real-world version is secretly leaning on and which one it has to give up.

  *   **It gives up:** The **Equal-Chance Story**. It physically cannot claim that everyone had a fair shot when participation is voluntary.
  *   **It leans on:** The **Mirroring Story**. This is the only lifeline they have. They *need* the room to look like the population (stratification) to claim the results are valid. If the room was 100% volunteers without the demographic tweaking, it would just look like a town hall meeting of activists. The "mirroring" is done artificially (by selecting specific volunteers to fill quotas) to create the *appearance* of a random sample.

  **Are they compatible?**
  In the current model? **No.** You cannot claim the legitimacy of a random lottery (Equal-Chance) while filtering for willingness to participate (Volunteer). You are building a "Mini-Public," not a "Representative Sample."

  ### 4. Your Daydream Version (The Sortition Chamber)
  Your version (compulsory, long-term, paid, binding, hybrid) switches the implicit theory entirely. This is no longer a Focus Group; this is a **Legislature**.

  *   **On Representation:** It presupposes that representation is statistical, not symbolic. You don't need to "mirror" the population by tweaking quotas; if the draw is truly random (and compulsory, like jury duty), the law of large numbers does the work for you.
  *   **On Governing as a Skill:** This is the biggest shift. Your model assumes governing is **not** primarily a technical skill; it is a matter of **interests and values**.
      *   *Why?* Because you let them hire staff. You acknowledge they don't know the details (so they hire experts to work for *them*, not the other way around), but you trust them to make the final call. This assumes the "skill" of politics is knowing what you want for your life, not knowing how to balance a budget spreadsheet.
  *   **On Binding Authority:** It presupposes that legitimacy comes from the **math**, not the **outcome**. If every citizen had a 1-in-100,000 chance of being the decider, then the decider has the right to bind everyone. It treats political office like a civic duty, not a career or a hobby.

  ### 5. Summary of the Implicit Theories

  | Feature | Current Practice (Citizens' Assembly) | Your Daydream (Sortition Chamber) |
  | :--- | :--- | :--- |
  | **Primary Claim** | "This group thought harder than the public." | "This group *is* the public." |
  | **View on Expertise** | Experts teach the citizens. (Top-down) | Citizens hire the experts. (Bottom-up) |
  | **View on Time** | Short term prevents corruption/boredom. | Long term prevents amnesia/capture by staff. |
  | **Legitimacy Source** | **Mirroring:** "They look like us." | **Lottery:** "We all had a ticket." |
  | **Binding Power** | Advisory (Trust us). | Binding (Math says so). |
  | **Volunteer Filter** | **Essential** (Need motivated people). | **Forbidden** (Must be compulsory/Jury-style). |

  ### The Bottom Line
  The current practice is a **safety valve**. It is designed to let people feel heard without actually transferring power. It relies on the **Mirroring Story** to sell the recommendations, but it quietly drops the **Equal-Chance Story** because it knows most people don't want to spend weekends in a hotel conference room.

  Your daydream is a **power transfer**. It relies on the **Equal-Chance Story** (compulsory lottery) to justify taking power away from career politicians.

  The reason you see the contradiction is that the people running the current assemblies want the *legitimacy* of your model (the math) without the *risk* of your model (binding power). They want the room to look like the country, but they need the people in the room to be the kind of people who will listen to experts and write polite recommendations.

  If they switched to your model—compulsory service, binding votes—they would have to admit that an ordinary person's judgment *is* as good as a politician's, even without the "expert weekends." That is a much harder pill for the existing political class to swallow.
