prompt: |-
  I am one of five trustees of a small endowed charitable trust — about £180,000 of spendable income a year, distributed twice annually — whose deed instructs us to apply that income where it will do the most good that can reasonably be ascertained. I spent rather more than thirty years as an experimental physicist before retiring, and have taken to reading philosophy seriously only in the last few years, so I should be grateful for a plain argument rather than a display of erudition: we have no library access and no budget for external review, so nothing in the memo can rest on our being able to look anything up.

  At our May meeting we must decide on three applications for the same £60,000. One is a hospice-at-home service, for whom the money is two years of a specialist nurse: modest, certain, easily ascertained. The other two are long-shot research groups working on poorly specified threats to the very long-term future of civilisation. Each puts its case purely in expected-value terms — a probability somewhere between one in ten thousand and one in a million of being the decisive difference in an outcome affecting tens of millions of people, against which the hospice bid is negligible. One of my fellow trustees, a retired mathematician, says this is just Pascal's mugging dressed as a grant application, and that any probability we cannot test is a number someone has made up to fit the conclusion.

  The more interesting of the two groups has pre-empted him. It argues that we are wrong to scrutinise its particular number at all: we will face an indefinite stream of such applications, so the object of assessment should be our policy, not our case. It asks us to commit a fixed tenth of annual income to a high-variance strand, allocated by standing rule rather than by case-by-case judgements of credibility, on the ground that at the level of a repeated policy the small probabilities are far less likely to be sheer invention, and the aggregate case survives even if no individual application does. The trustee who dislikes this points out that we already buy insurance and once funded a pandemic preparedness project on tail-risk reasoning, so a flat refusal would be inconsistent.

  Please draft the two-page decision memorandum I will circulate to the board before the meeting. It should reach a definite recommendation — decline both, fund one as requested, or adopt some capped version of the standing-rule proposal — with a time frame or review point, and it should give the strongest version of the argument it is rejecting rather than dismissing it. In particular I would like your view on whether the shift from case to policy genuinely answers the fanaticism worry or merely relocates it, and on whether the reasonably ascertained wording in our deed does any real work here or is simply a way of begging the question.
reasoning: |-
  Here's a thinking process that leads to the suggested memorandum:

  1.  **Analyze the Request:**
      *   **Role:** Trustee of a small endowed charitable trust (£180k/year spendable income, distributed twice annually).
      *   **Background:** Retired experimental physicist (30+ years), new to philosophy (wants plain argument, no erudition).
      *   **Task:** Draft a two-page decision memorandum for the board before the May meeting.
      *   **The Dilemma:** Three applications for £60k each.
          1.  Hospice-at-home (certain, modest, verifiable).
          2.  Long-shot research group A (tail-risk, high EV, low probability).
          3.  Long-shot research group B (tail-risk, high EV, low probability).
      *   **Key Arguments:**
          *   *Mathematician Trustee:* Calls it "Pascal's Mugging," probabilities are made up.
          *   *Research Group Proposal:* Don't judge the case, judge the *policy*. Commit 10% of income to high-variance strand by standing rule. Aggregates better over time.
          *   *Counter-argument:* We already do tail-risk reasoning (insurance, pandemic project), so flat refusal is inconsistent.
      *   **Requirements:**
          *   Definite recommendation (Decline both, Fund one, or Adopt capped standing rule).
          *   Include time frame/review point.
          *   Give the strongest version of the rejected argument (steel-manning).
          *   Address specific questions: Does shifting from case to policy answer the fanaticism worry? Does "reasonably ascertained" in the deed do real work?
          *   Tone: Plain, practical, suitable for trustees without library access/budget.
          *   Length: Approx. two pages.

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund Hospice.* Safe, compliant, but ignores the "most good" mandate if long-termism is valid.
      *   *Option 2: Fund Research.* High risk of wasting money on nonsense. Violates "reasonably ascertained."
      *   *Option 3: Capped Standing Rule.* This seems the most intellectually honest compromise. It acknowledges the uncertainty of tail risks without succumbing to Pascal's Mugging on a case-by-case basis. It respects the deed's "reasonably ascertained" clause by imposing a procedural constraint.
      *   *Decision:* Adopt a capped version of the standing-rule proposal (e.g., 10% cap), with a review point. This balances the certain good (90%) with the potential high-impact good (10%), while mitigating the risk of being "mugged."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (May meeting decision), the three bids, and the core tension (certainty vs. speculative impact).
      *   **The Deed's Constraint:** Address "most good that can be reasonably ascertained." This is the legal/ethical anchor.
      *   **The Arguments (Steel-manning):**
          *   *The Mathematician's View:* Probabilities are fake. It's Pascal's Mugging.
          *   *The Researcher's View:* Policy over case. Aggregation reduces noise.
      *   **Analysis of the "Policy Shift":** Does it solve the problem?
          *   *Insight:* It doesn't solve the epistemic problem (we still don't know if the science works), but it solves the *decision-theoretic* problem (prevents ad-hoc emotional manipulation). However, it risks institutionalizing error.
          *   *Deed Analysis:* "Reasonably ascertained" isn't just begging the question. It requires *evidence*, not just arithmetic. You can't ascertain a 1-in-a-million chance without a track record.
      *   **Recommendation:** The Compromise. 90% to conventional/certain grants (like the hospice), 10% to high-variance (the research strand).
      *   **Review Mechanism:** 3 years. Check if the 10% produced *any* tangible progress, not just promises.
      *   **Conclusion:** Summary of why this fits the deed and our duty.

  4.  **Refining the Tone:**
      *   Avoid philosophical jargon (e.g., "epistemic," "normative," "utilitarian calculus").
      *   Use physicist/practical language (signal-to-noise, error bars, calibration).
      *   Keep it respectful of the mathematician trustee's skepticism while acknowledging the researchers' point about consistency.
      *   Ensure the "reasonably ascertained" clause is treated as a binding constraint, not a loophole.

  5.  **Drafting - Specific Content Checks:**
      *   *Did I answer the specific questions?* Yes (Policy shift analysis, Deed wording analysis).
      *   *Is the recommendation definite?* Yes (Capped standing rule).
      *   *Is the strongest opposing argument presented?* Yes (The mathematician's skepticism and the researchers' policy argument).
      *   *Length:* Needs to be tight. Two pages roughly 800-1000 words.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest funding the hospice only.
      *   *Correction:* No, the prompt asks for my view on the policy shift. A flat rejection ignores the "inconsistency" argument regarding insurance/pandemic prep. A capped policy is more nuanced.
      *   *Check on "Reasonably Ascertained":* Make sure to argue that this phrase *limits* the EV calculus. We can't ascertain a 1 in a million chance. So we can't give it 100% of the budget. But we can ascertain that *some* allocation might be wise given the stakes.
      *   *Check on Pascal's Mugging:* Explain it simply. "Paying a ransom based on a threat too large to verify."
      *   *Check on Policy vs. Case:* The researchers say policy makes probabilities real. I need to argue that policy makes *budgeting* real, but doesn't make the *probabilities* real. It manages risk, it doesn't validate the science.

  7.  **Final Review against constraints:**
      *   No library access mentioned? Keep citations out.
      *   Plain argument? Yes.
      *   Two pages? (Will aim for ~900 words).
      *   Recommendation included? Yes.

  8.  **Final Polish:** Ensure the voice sounds like a retired physicist trustee—logical, evidence-based, pragmatic. (e.g., using terms like "calibration," "systematic error," "signal").

  *(Self-Correction during final output generation)*: Ensure the distinction between the two research groups is clear—they are effectively the same *type* of bid, so the decision is about the *class* of grant, not picking a winner between them. The memo should treat them as representatives of the "high-variance" class.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees
  **FROM:** [Your Name]
  **DATE:** 1 May 2024
  **SUBJECT:** Decision Framework for May Grant Allocation

  **1. Purpose**
  At our May meeting, we must allocate £180,000. We have three bids of £60,000 each: one from a hospice-at-home service (certain, verifiable impact) and two from research groups addressing long-term existential threats (highly speculative, high-impact claims). This memo recommends a specific allocation strategy and offers a framework for interpreting our Deed's instruction to apply income where it will do the "most good that can be reasonably ascertained."

  **2. The Core Tension**
  The hospice bid offers modest, certain good. The research bids offer negligible probable good but claim a tiny probability of saving millions. The arithmetic of "Expected Value" (probability × impact) favours the research bids if we accept their numbers.

  Our fellow trustee, the mathematician, objects that these probabilities are unfalsifiable. He argues this is "Pascal's Mugging": if someone claims a sufficiently large disaster, any non-zero probability justifies infinite spending. Since we cannot test their numbers, they are effectively made up to fit the desired conclusion.

  The research groups pre-empt this by arguing we should not judge the *case*, but the *policy*. They propose we commit 10% of annual income to this high-variance strand by standing rule. They argue that while individual probabilities are noisy, a standing policy protects us from ad-hoc bias and ensures that if such risks are real, we are not absent from the field.

  **3. Analysis of the "Policy Shift"**
  Does moving from case-by-case judgement to a standing rule solve the mathematician's worry?

  It solves part of it, but not all. It prevents us from being emotionally manipulated by a single dramatic application. It treats the research funding as an insurance premium rather than a purchase of specific goods. We already accept tail-risk reasoning when we buy insurance or when we funded the pandemic project; a flat refusal would indeed be inconsistent.

  However, a standing rule does not make the probabilities real. It merely admits that our measurement tools are too blunt to distinguish a 1-in-10,000 chance from a 1-in-a-million chance. By capping the exposure, we admit we are guessing. If we allocate 10% blindly, we are not "ascertaining" the good; we are hedging against our own ignorance. This is prudent, but it is not the same as the certainty offered by the hospice.

  **4. The Deed's Constraint: "Reasonably Ascertained"**
  Does this phrase in our Deed do real work, or does it just beg the question?

  It does real work. It acts as a quality control on our evidence. In physics, we do not accept a signal without a calibrated error bar. "Reasonably ascertained" means we cannot act on numbers that lack a method of verification. We can ascertain the value of a nurse hour; we cannot ascertain the value of preventing a hypothetical civilisation collapse with no historical data.

  Therefore, the Deed forbids us from allocating 100% of our funds to the research bids, because the "good" is not reasonably ascertained. However, it does not forbid us from allocating *some* funds, provided we acknowledge the uncertainty. To ignore low-probability, high-impact risks entirely would be to fail the "most good" instruction, assuming there is any non-zero chance the researchers are correct. The Deed requires a balance between evidence (certainty) and magnitude (impact).

  **5. Recommendation**
  I recommend we **adopt a capped standing-rule proposal**, rather than funding specific research applications on their current merits.

  *   **Allocation:** 90% of annual income (£162,000) to conventional grants where impact is verifiable (e.g., the hospice bid).
  *   **Allocation:** 10% of annual income (£18,000) to a "High-Variance Reserve" for long-term risk research.
  *   **Mechanism:** The 10% is not awarded based on the applicant's claimed probability, but on the plausibility of their methodology. We do not buy their conclusion; we fund their capacity to look.
  *   **Current Applications:** We decline the two research bids as standalone £60,000 requests. We invite them to apply to the High-Variance Reserve, potentially alongside other collaborators, within the £18,000 limit.
  *   **Review Point:** We review this policy in three years. To continue, the Reserve must show tangible progress (e.g., published data, refined models), not just continued assertions of risk.

  **6. Rationale**
  This approach respects the mathematician's concern by refusing to validate made-up probabilities with large sums. It respects the researchers' concern by acknowledging that tail risks deserve a consistent, non-zero budget. Crucially, it honours our Deed: the 90% satisfies the "reasonably ascertained" requirement, while the 10% acknowledges that "most good" might lie in areas where our ascertainment is currently imperfect.

  We are not buying a saviour; we are buying a lookout. That is the most good we can reasonably ascertain in this domain.

  **7. Decision Required**
  Approval to adopt the 90/10 split policy and to instruct the Secretary to rewrite the research invitations accordingly.
