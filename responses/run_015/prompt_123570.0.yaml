      *   *Refining the 1 vs 2 fix:* The user says "I'm basically with Epicurus... death isn't bad for you." But then says "Deprivationism is right... robbery counts as harm." This is a direct contradiction in terms.
          *   *Correction:* You need to distinguish between "Death is a bad *experience*" (Epicurus says no) and "Death is a *misfortune*" (Deprivationism says yes).
          *   *Nuance:* Epicurus says "Death is nothing to us." Deprivationism says "Death is a great loss to us." You have to choose: Is death *bad* or *nothing*? You can say "It is a bad thing that happens, but not a bad state to be in."

      *   *Refining 3 vs 5:* Parfit is the key reference here. Psychological continuity explains why we look forward.

      *   *Refining 4 vs 1:* If I value achievement independent of experience, then the *cessation* of the possibility of achievement is a harm, regardless of experience. This strengthens 2 but weakens the *reasoning* of 1.

