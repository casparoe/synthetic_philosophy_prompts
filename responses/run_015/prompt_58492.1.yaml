              *   *The Real Friction:* **Cloud Seeding.** If the user blocks the Spray because of *one* indie lab on frogs, they must block Cloud Seeding because of *town testimony* on rain. If they allow Sweetener with *zero* human data, they might have to allow Cloud Seeding with *no solid proof* of harm.
