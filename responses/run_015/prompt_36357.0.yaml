answer: |-
  This is a profound question, and your analogy to hydrology is exacting in the right way. In your old work, a number represented a physical state of the world (head pressure, conductivity) measured against a physical standard. In Benefit-Cost Analysis (BCA), the number represents a *social state of preference* measured against a *institutional standard*.

  You are asking for the metrology of welfare economics. Here is a reconstruction of what the practice is committed to, where it relies on Marvin (the economist), where it is theoretically underdetermined, and what would break if you changed the underlying philosophy.

  ### 1. The Instrument: What is actually being measured?

  In your hydraulic models, the number corresponds to a physical quantity. In BCA, the number corresponds to **opportunity cost revealed through choice.**

  The "instrument" is not a flow meter; it is the **market mechanism itself**, acting as a preference aggregator. When an agency assigns a dollar value to a statistical life (VSL), they are not measuring the "worth" of a human in an ontological sense. They are measuring the *marginal rate of substitution* between income and risk that people reveal in labor markets (e.g., how much extra wage workers demand to accept a slightly higher risk of death).

  When they value a wetland via "ecosystem services," they are measuring the **shadow price**. A shadow price is an estimate of what the market price *would be* if a market existed for that good.

  **The Calibration Standard:** The calibration standard is **Willingness to Pay (WTP)**. The theory presupposes that value is subjective and exists only in the moment of choice. There is no "true" value of a wetland sitting in the wetland; the value exists in the relationship between the wetland and the humans who might use or preserve it.

  **The Error Bar:** You noted the lack of error bars. In rigorous BCA, these *should* exist (sensitivity analysis), but they are often suppressed in the final summary. The "error" here is epistemic (we don't know true preferences) and theoretical (WTP is influenced by ability to pay, so it measures *weighted* preferences, not *equal* preferences).

  ### 2. The Market Presupposition: Is Marvin Right?

  Marvin is practically right, even if he is theoretically dogmatic.

  **The Mises/Hayek Position (Marvin):** Prices are information signals encoding dispersed knowledge about scarcity and preference. Without actual transactions, you have no data.
  **The Lange Position:** A planner can simulate a market by setting prices, observing surpluses/shortages, and adjusting.

  **Why BCA needs Marvin:**
  BCA is typically done *ex ante* (before the project). It needs to predict future benefits based on current data.
  *   If you are in a market economy, you can use observed market data (wages, property values) as a proxy for the shadow prices.
  *   If you are in a Lange-style planned economy, you do not have observed market data. You would have to rely on the planner's *current* shadow prices. But if the planner's prices are set by trial and error, they are constantly in flux. A BCA done today would be invalid tomorrow because the "measuring stick" (the price list) has changed.

  Furthermore, for non-market goods (like the wetland), BCA often uses **Contingent Valuation** (surveying people: "How much would you pay to save this?"). This is the weakest link. Without the discipline of actual money changing hands (the market), these numbers are "cheap talk." They have huge error bars. Marvin is right that the spreadsheet's authority collapses without the anchor of real market behavior to calibrate the hypothetical values.

  **Verdict:** The practice presupposes a **functioning market economy as its metrology lab.** It treats the market as the only device capable of rendering subjective value intersubjectively comparable.

  ### 3. The Contradiction: Pricing vs. Hard Constraints

  You noted that burial grounds and endangered species are often treated as hard constraints (lexical priorities) rather than inputs to the sum. Is this a contradiction?

  **Strictly speaking, yes.** If the goal is to maximize Net Present Value (NPV), everything must be commensurable. If a burial ground stops a project that would yield $100M net benefit, the BCA implies the burial ground is "worth" at least $100M. By refusing to name the price, the agency is hiding the trade-off.

  **However, there is an implicit theory that holds this together:** It is a **Two-Level Decision Framework** (akin to Rule Utilitarianism or Threshold Deontology).

  1.  **Level 1 (Constraints/Rights):** Certain values are deemed "protected" by political or legal fiat. These are boundary conditions in your hydrological model. You don't model flow *through* the impermeable bedrock; you model flow *around* it. These constraints represent rights or duties that are not up for marginal trade-off.
  2.  **Level 2 (Optimization):** Within the space left over by the constraints, society should maximize efficiency.

  **Why do this?** Because calculating the price of a sacred burial ground is politically toxic and methodologically unsound (there is no market for sacrilege). By making it a constraint, the agency avoids the "repugnant conclusion" of pricing the sacred, while still using BCA to choose the most efficient flood wall *that respects the constraint*.

  **The Underdetermination:**
  This practice is theoretically underdetermined. It could be justified by:
  *   **Kaldor-Hicks Efficiency:** We maximize wealth, and the constraints prevent outcomes that are politically impossible.
  *   **Rights-Based Deontology:** We have duties (don't dig graves), and within our duties, we act consequentially.
  *   **Political Pragmatism:** BCA is a tool to reduce corruption and waste, not a moral truth machine. The constraints are just where the political heat is too high.

  The spreadsheet looks the same under all three theories, but the *justification* differs.

  ### 4. Rival Views of Value Ruled Out

  By using this specific BCA framework, the agency quietly rules out several philosophical positions:

  1.  **Strong Incommensurability:** The view that some values (e.g., justice, biodiversity) cannot be compared to economic goods *even in principle*. BCA assumes they *can* be compared, even if some are currently constrained.
  2.  **Intrinsic Value (Ecocentrism):** The idea that a wetland has value independent of human valuation. BCA only counts "ecosystem services" (what the wetland does *for us*). If the wetland had value simply by existing, BCA cannot capture it unless a human is willing to pay for its existence (Existence Value).
  3.  **Distributional Egalitarianism:** Standard BCA sums total benefits. It does not matter if the benefits go to the rich and costs to the poor (Kaldor-Hicks). A dollar is a dollar, regardless of who holds it. This rules out theories of justice that prioritize the worst-off (Rawlsianism).
  4.  **Objective Value:** The view that value is a property of the object. BCA assumes value is subjective (preference-based).

  ### 5. The Incommensurable Alternative: What would change?

  If you swapped the presupposed view for a doctrine of **Strict Incommensurability** (the view that you cannot reduce lives, nature, and money to a single scale), the practice would change concretely in these ways:

  1.  **Death of the Bottom Line:** There would be no "Net Present Value" or "Benefit-Cost Ratio." You cannot sum apples, oranges, and lives.
  2.  **Multi-Criteria Decision Analysis (MCDA):** Instead of one column of dollars, the spreadsheet would have distinct columns: "Cost," "Lives Saved," "Wetland Acres Lost," "Cultural Sites Impacted."
  3.  **No Automatic Optimization:** You could not simply pick the project with the highest score. The decision would shift from *calculation* to *deliberation*. The advisory panel (you and your colleagues) would have to weigh the trade-offs explicitly: "Is saving 2 acres of wetland worth $5 million and 0.5 statistical lives?"
  4.  **Lexical Ordering:** You might see rules like "Safety First." Projects are ranked by safety, then by cost. Or "Sustainability First."
  5.  **Increased Political Liability:** Currently, the agency can hide behind the math ("The model says Project A is best"). Under incommensurability, they must own the value judgment ("We chose Project B because we value the burial ground more than the savings").

  ### Summary for the Panel

  To answer your specific chewing points:

  *   **What is the instrument?** The market is the instrument; willingness-to-pay is the scale. It measures *preference satisfaction*, not intrinsic worth.
  *   **Is Marvin right?** Yes. Without market data to calibrate shadow prices, the numbers become arbitrary guesses with massive, unreported error bars. Lange's trial-and-error doesn't work for *project evaluation* because it requires a stable price signal that only a market provides.
  *   **Is the constraint/pricing mix a contradiction?** It is a logical tension, but functionally it is a **boundary condition**. It treats some values as "outside the model" to preserve the model's usability for the rest. It is a pragmatic hybrid, not a pure theory.
  *   **What is ruled out?** Any theory that says some things are priceless (in the sense of untradeable, not expensive) or that justice matters more than efficiency.

  **The Hard Truth:** The BCA spreadsheet is not a scientific measurement like your conductivity tables. It is a **political technology**. It converts political questions ("How much nature should we save?") into technical questions ("What is the NPV?"). This reduces conflict and speeds up decision-making, but it does so by smuggling in a specific utilitarian philosophy that claims to be neutral.

  If you want to challenge the panel, don't attack the math. Attack the **boundary conditions**. Ask: "Who decided the burial ground was a constraint but the wetland was a variable? What market signal told us the difference?" That is where the "instrument" is truly calibrated, and it is calibrated by politics, not economics.
