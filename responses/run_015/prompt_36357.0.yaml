      *   *What is it?* A decision procedure to maximize net social welfare.
      *   *The "Instrument":* It's not a physical device like a flow meter. It's a *social institution* + *revealed preference theory*.
      *   *Commensurability:* Yes, it presupposes a single metric (usually money) acts as a proxy for utility/welfare.
      *   *The Market Dependence:* Marvin is largely right, but with nuances. BCA uses *shadow prices* derived from observed market behavior (hedonic pricing, value of statistical life). Without market signals, these numbers lack empirical grounding.
      *   *The Constraint Contradiction:* It's not necessarily a logical contradiction but a *lexical ordering* or a *threshold deontology* embedded within a consequentialist framework. It's a pragmatic patch.

  3.  **Address the Specific Questions:**

      *   **Q1: What is the instrument?**
          *   In hydrology: Physical property $\rightarrow$ Sensor $\rightarrow$ Number.
          *   In BCA: Preference/Welfare $\rightarrow$ Market Behavior/Legal Institution $\rightarrow$ Number.
          *   The "calibration standard" is *willingness to pay/accept* (WTP/WTA) derived from actual choices.

      *   **Q2: Market Dependence (Marvin vs. Lange):**
          *   Marvin (Hayek/Mises): Prices encode dispersed knowledge. Without markets, numbers are arbitrary.
          *   Lange (Market Socialism): Planners can simulate markets.
          *   *Verdict:* In practice, BCA *needs* Marvin's world. Lange's trial-and-error requires a feedback loop that takes too long for a specific project analysis. BCA uses *existing* market data as a proxy for counterfactual states. If no market exists (e.g., unique wetland), they use "contingent valuation" (surveys), which is notoriously shaky (the "error bar" the user would hate). So, Marvin is practically right, even if Lange is theoretically possible.

      *   **Q3: The Contradiction (Pricing vs. Constraints):**
          *   Is it a contradiction? Technically, yes, if the theory is pure utilitarianism.
          *   Is there a holding theory? Yes. *Rule Utilitarianism* or *Threshold Deontology*. Some values are "protected" (rights-based) until a threshold is met, then they enter the calculus. Or, it's *Political Pragmatism*: BCA is a tool for *marginal* decisions, not *constitutional* ones. The constraints are political/legal boundaries; the BCA is for optimization *within* those boundaries.

      *   **Q4: Rival Views Ruled Out:**
          *   Strong Incommensurability (values cannot be compared on one scale).
          *   Deontology (duties override consequences).
          *   Ecocentrism (nature has intrinsic value independent of human utility).
          *   Radical Egalitarianism (distribution doesn't matter in standard Kaldor-Hicks BCA).

      *   **Q5: What if Strict Incommensurability?**
          *   No single bottom line (Net Present Value).
