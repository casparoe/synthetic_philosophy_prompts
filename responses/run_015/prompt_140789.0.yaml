      *   *The Nice Group:* Collude to make it work. *Fix:* The Hidden Rules prevent success regardless of niceness.

  9.  **The "One Thing" the Activity Can't Reproduce:**

      *   **Duration/Endurance.** The game is 75 mins. Real care is years. The exhaustion of the 400th visit. The activity simulates the *structure*, not the *weight of time*. I must say this.

