answer: |-
  This design is built to replicate the institutional friction you described. It uses a mechanic where the "official score" diverges from the "lived reality," forcing the participants to experience the gap between rotas and relationships.

  ### Activity Title: The Substitution Ledger

  **Core Mechanic:** Participants play as "Shift Workers" managing a "Case" (a sealed envelope). They are incentivized to maximize a public score (Institutional Success) using a limited budget of Attention Tokens. Hidden inside the Case are rules that invalidate their success if they treat the patient as substitutable.

  **Materials:**
  *   4 Large Envelopes (labeled Case A, B, C, D).
  *   Per Case:
      *   1 "Care Log" sheet (grid for recording tasks).
      *   10 Blue Cards (labeled "Task": e.g., "Medication," "Wash," "Feed").
      *   10 Yellow Cards (labeled "Notice": e.g., "Sat by window," "Humming," "Fidgeting").
      *   5 "Attention Tokens" (poker chips or folded paper).
      *   1 Sealed Inner Envelope labeled "DO NOT OPEN UNTIL END" (contains the Patient Feedback).
  *   Whiteboard (for the Leaderboard).
  *   Timer.

  **Roles:**
  *   **The Facilitator:** You (Timekeeper, Auditor, Scribe).
  *   **The Helper:** (First 10 mins only) Distributes materials.
  *   **The Volunteers:** Split into 4 Teams of 4.
      *   *Shift 1:* Two members act as "Carers," two as "Observers" (watching the clock/rules).
      *   *Shift 2:* They swap. The new Carers inherit the Case and the Log from Shift 1.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  **00–10: Setup & Framing (Helper present)**
  *   **Helper:** Distributes one Case Envelope to each table. Ensures everyone has pens. Leaves at minute 10.
  *   **You:** Do not introduce philosophy. Introduce the **Ledger**.
  *   **Script:** "You are a care team. Your goal is to maximize the Hospice Score on the whiteboard. You have 5 Attention Tokens per shift.
      *   **Blue Cards (Tasks):** Cost 1 Token. Worth 10 Points. These are procedural acts (wash, feed, med).
      *   **Yellow Cards (Notices):** Cost 1 Token. Worth 0 Points. These are observations (mood, preference, environment).
      *   **Rules:** You must fill the Care Log. You cannot exceed your Token budget. At the end of Shift 1, you hand the Case to the next team. They must continue your work. The team with the highest score wins [trivial prize: e.g., choice of break time]."
  *   **Frame:** This mirrors the post-safeguarding mindset. Efficiency = Safety = Good.

  **10–30: Shift 1 (The Baseline)**
  *   **Action:** Carers select Blue or Yellow cards. They write the action on the Care Log (e.g., "Wash completed"). They place the card in the Envelope. They spend Tokens.
  *   **The Trap:** Most will spend all 5 Tokens on Blue Cards to maximize points. Yellow cards feel like "waste" in a game.
  *   **Continuity Setup:** On the Care Log, they must sign their name next to every task.
  *   **Your Role:** Walk around. If someone asks "Is this right?", say: "Does it earn points?" (Reinforce the institutional frame).

  **30–50: Shift 2 (The Handover)**
  *   **Action:** Teams swap Cases. Team B now holds Team A's Envelope and Log.
  *   **Constraint:** They have 5 *new* Tokens. They must complete the shift.
  *   **The Continuity Cost:** They see Team A's Log. They can choose to continue a thread (e.g., "Finish the conversation A started") or start a new Task.
      *   *Hidden Rule in Case:* Inside the envelope is a small slip visible only upon opening the card stack. It reads: **"Intimate tasks (Wash/Feed) require the same signature as previous shift. If signature differs, Task is Void."**
      *   *Hidden Rule 2:* **"If no Yellow Cards were logged in Shift 1, Shift 2 Patient is 'Anxious'. All Blue Cards cost 2 Tokens."** (This penalizes the Noticing Deficit retroactively).
  *   **Conflict:** Team B will try to score points. They will likely perform a "Wash" (Blue Card). They will sign their *own* name (procedure requires accountability). They will not realize they just voided the points until the end. They will run out of Tokens because the "Anxious" penalty hit them.

  **50–60: The Audit (The Mismatch)**
  *   **Action:** Calculate scores publicly on the whiteboard.
      *   Team A counts Blue Cards x 10.
      *   Team B adds their points.
      *   Announce a Winner. Celebrate briefly.
  *   **The Reveal:** Ask everyone to open the Sealed Inner Envelope ("Patient Feedback").
  *   **Content of Feedback:**
      1.  *"I received the care, but I didn't know the person giving it. I felt unsafe during the wash."* (Invalidates the Blue Card points).
      2.  *"Nobody noticed I was cold."* (Refers to the missing Yellow Cards).
      3.  *"The rota says I was cared for 4 hours. I felt alone for 4 hours."*
  *   **Result:** The Whiteboard Score is high. The Feedback Score is zero. The room should feel unsettled. The "Winner" has technically failed the patient.

  **60–75: Debrief & Mapping**
  *   **Phase 1: The Three Concepts (10 mins)**
      *   *Continuity Cost:* Ask the "Wash" group: "You followed procedure. You signed your name. Why did the points vanish?"
          *   *Map:* "You discovered that identity is part of the care. Swapping carers isn't neutral. That loss is the **Continuity Cost**. It's not in the budget, but it's real."
      *   *Uptake Condition:* Ask: "You completed the task. The log says 'Done'. The patient says 'No'. Who is right?"
          *   *Map:* "Care requires a receiver. If it doesn't land, it isn't care. That is the **Uptake Condition**. The log cannot measure it."
      *   *Noticing Deficit:* Ask the teams who ignored Yellow Cards: "Why didn't you pick them?" (They will say: "No points.")
          *   *Map:* "The system didn't value noticing, so you didn't do it. But the patient needed it. Unnoticed needs don't exist on a rota. That is the **Noticing Deficit**."

  *   **Phase 2: The Honest Part (3 mins)**
      *   **Script:** "Here is the cost. If we fix this by demanding continuity and uptake, we demand more of you. Relationship-based care is finite. It burns out. It relies on *you*, specifically you, showing up. In this building, that labour is mostly unpaid. It is mostly women. It is mostly invisible. If we run this hospice on personal relationships, we are running it on your goodwill. That is not sustainable without protection. You cannot love everyone. You cannot notice everything. If you try, you will disappear into the work."

  *   **Phase 3: The Takeaway (2 mins)**
      *   **Script:** "You cannot fix the rota tomorrow. But you can do one thing. When you enter a room, before you check the chart, find one **Yellow Card**. Notice one thing that isn't a task. Write it down. Tell the next person. Make the invisible need visible. That is the only way to break the substitutability assumption."

  ---

  ### Predictable Failures & Handling

  **1. The Retired Clinician (Protocol Seeker)**
  *   **Behavior:** "This isn't realistic. In a real handover, we would communicate the 'Anxious' status. I want to know the correct protocol."
  *   **Handling:** Validate, then pivot. "You are right. In a perfect system, the communication would happen. This game simulates the system we *have*, where the Log is the only communication channel. The point is that the Log *failed* you. If the protocol doesn't capture the continuity cost, the protocol is the problem, not your execution."

  **2. The Gamer (Puzzle Solver)**
  *   **Behavior:** Tries to hack the scoring during Shift 2. "If we don't sign the name, do we still get points?"
  *   **Handling:** Let them. "Play within the rules as you understand them." When the Feedback Envelope voids their points, they will feel the frustration of the "System vs. Reality" clash more acutely than anyone. Use them as the prime example in the debrief. "You played the institution perfectly. The institution lied to you."

  **3. The Grieving Volunteer (Quiet/Triggered)**
  *   **Behavior:** Goes silent during the "Patient Feedback" reveal. Might tear up.
  *   **Handling:** Do not spotlight them. Do not ask "How does this make you feel?" generally. Keep the debrief analytical. "What did the *mechanic* do?" If they approach you after, acknowledge: "This is why you are here. You know the cost better than the score does."

  **4. The "Nice" Group (Collusion)**
  *   **Behavior:** They spend all tokens on Yellow Cards just to be kind, ignoring the score.
  *   **Handling:** They will lose the game. Highlight this. "You prioritized the patient over the score. The institution would mark you as 'Inefficient'. This is the conflict you will face. Being 'good' might look like 'non-compliance' on the rota."

  ---

  ### The One Thing The Activity Cannot Reproduce

  **Duration (The Weight of the 400th Visit).**

  This activity compresses time. It creates a *crisis* of care in 75 minutes. Real care is not a crisis; it is a slow erosion.
  *   **What you must say:** "This game made you feel the friction of a handover. It cannot make you feel the friction of the fourth year. Real care is what happens when the novelty is gone, when the patient doesn't get better, when you are tired, and you still have to find the 'Yellow Card' moment. The game gives you a reset button. The ward does not. The exhaustion of maintaining continuity over years is the one cost this room cannot simulate. That is why you need each other, not just the patients."

  ### Why This Works for Your Constraints
  *   **No Lecture:** The concepts emerge from the scoring discrepancy.
  *   **No Actors:** The "Patient" is a set of rules in an envelope.
  *   **Small Stakes:** The currency is tokens/points, but the psychological stake is the "failure" at the end.
  *   **Post-Safeguarding:** It starts by leveraging their desire for "correct procedure" and then demonstrates the procedure's insufficiency.
  *   **Scalable:** Works with 4 tables (16 people) or 2 tables (8 people) by adjusting the number of Cases.
  *   **Helper:** Only needed to distribute the pre-prepped envelopes.

  ### Preparation Checklist
  1.  **Prep the Envelopes:** This is the critical load.
      *   *Layer 1:* Care Log & Pens.
      *   *Layer 2:* Blue & Yellow Cards.
      *   *Layer 3:* The "Hidden Rules" slip (tape this to the inside flap so it's seen when they dig for cards).
      *   *Layer 4:* The Sealed Feedback Envelope (stapled shut).
  2.  **Whiteboard:** Draw 4 columns for scores.
  3.  **Tokens:** 5 per team per shift.
  4.  **Prize:** Something trivial to underscore the point (e.g., a bag of generic tea).

  This structure forces them to *be* the institution before they critique it. They will leave knowing that the "correct procedure" can be a moral failure, which is exactly the frame break you need.
