      *   *Refinement on Scoring:* To make the "Substitutability Assumption" land, the Score Sheet should treat all hours as equal. The Feedback Card should reveal they were not.
      *   *Refinement on Continuity:* Make sure the "Handover" forces a change in personnel.
      *   *Refinement on Uptake:* The "Task" is completed (checked box) but the "Experience" is negative.

      *   *Let's name the activity:* **"The Substitution Ledger."**

