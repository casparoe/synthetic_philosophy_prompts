      Actually, 75 mins total.
      0-10: Intro/Setup.
      10-30: Shift 1.
      30-50: Shift 2.
      50-65: The Reveal (Scoring vs Feedback).
      65-75: Debrief & Close.
      This works.

      *Wait, one more thing:* The user mentioned "Currency should be something they actually possess — their attention, their promises."
      Let's make the currency **"Attention Tokens."** They start with 5. Each Task costs 1. Each "Listening" action costs 1 but yields no points. This forces the trade-off.

      *Wait, the "Helper" constraint:* "One colleague can help for the first ten minutes and not after."
      I need to ensure the envelopes are pre-prepared so the helper just hands them out. The rules must be simple enough for me to explain alone after the helper leaves.

      *Final Polish on the "Honest Part":* Ensure I don't romanticize the volunteer role. Acknowledge the exploitation risk.

      *Final Polish on "What goes wrong":* Be specific about the "Protocol Seeker."

      *Final Polish on "Duration":* Yes, that's the missing element. The *wear* of time.

