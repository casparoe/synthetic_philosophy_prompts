      *   *Let's refine for the specific 3 concepts:*
          1.  **Continuity:** Needs a handover where information is lost or relationship value is lost.
          2.  **Uptake:** Needs a mechanism where a "correct" action is "rejected."
          3.  **Noticing:** Needs a need that isn't on the list.

      *   *Proposed Activity: "The Ledger of Hours"*
          *   **Setup:** 4 Groups of 4. Each group has a "Patient Portfolio" (Envelope).
