          *   **Phase 2 (The Swap):** Groups swap Profiles and Plans. They must "Execute" the plan (simulate by writing what they would do) but they encounter "Resistance" (new cards revealed in the envelope).
          *   **Phase 3 (The Audit):** We calculate the score.
          *   **The Reveal:** The score is high, but the "Care" failed.

      *   *Wait, I need them to feel the loss.*
      *   Let's try **"The Promise Game."**
      *   Participants are "Carers."
      *   There are "Patients" (represented by **Sealed Envelopes**).
      *   Inside the envelope: A list of **Preferences** (e.g., "I like tea," "I hate being touched on the left arm") and **Hidden Triggers** (e.g., "If you are not Sarah, I won't eat").
      *   **Round 1:** Carers read the visible preferences. They write 3 "Promises" on index cards (e.g., "I will bring tea"). They put them in the envelope.
      *   **Round 2 (The Handover):** Carers rotate to a *different* Envelope. They find the Promises left by the previous Carer. They must decide: Keep the promise or Break it?
      *   **The Catch:** The Envelope contains a "Response Card" that is only unlocked if the *same* person returns. Since they rotated, the Response Card says "Rejected."
      *   **The Score:** Whiteboard tracks "Promises Kept."
      *   **The Deficit:** There are "Silent Needs" cards hidden at the bottom of the envelope. They are never found unless someone looks deeper (costs Time).
      *   **Time Budget:** They have 10 "Time Tokens." Looking deeper costs 2 tokens. Keeping a promise costs 1.
      *   **Outcome:** Groups that optimize for Score (Keep Promises) fail the "Uptake" (because they aren't the right person) and miss the "Noticing" (didn't spend tokens to look deeper).

      *   *Refining for Constraints:*
          *   No helper after 10 mins. The mechanics must be self-policing or clear.
          *   "Nobody plays a dying person." The Envelope is the patient.
          *   "Stakes real but small." The currency is their own Time/Attention.
          *   "Scoring fails to record what matters." The Whiteboard Score will be high for the "efficient" groups, but the Debrief will show they failed the human element.

  4.  **Developing the "Ledger of Hours" (Finalized Concept):**

      *   **Name:** The Shift Ledger.
      *   **Setup:** 4 Tables. Each table = 1 "Case." 4 Volunteers per Case.
      *   **Materials per Case:** 1 Large Envelope ("The Patient"), 20 Blue Cards (Tasks), 10 Yellow Cards (Observations), 1 Score Sheet, 1 "Rota" (list of names).
      *   **The Patient (Envelope):** Contains 3 layers.
          1.  *Surface:* Medical needs (Clear, easy to score).
          2.  *Middle:* Preferences (Ambiguous, require interpretation).
          3.  *Bottom:* "The Lock" (A rule that says "Only valid if signed by same person as previous shift").
      *   **The Game:** 3 Rounds (Shifts).
          *   Round 1 (20 mins): Pair A works the Case. They choose Tasks (Blue) or Observations (Yellow). They write their name on the card. They put it in the Envelope.
          *   Round 2 (20 mins): Pair B works the Case. They see Pair A's cards. They must decide whether to continue the thread or start new.
          *   Round 3 (20 mins): Audit & Score.
      *   **Scoring:**
          *   Blue Cards = 10 points each.
          *   Yellow Cards = 0 points (but cost time).
          *   "Continuity Bonus": If Pair B continues Pair A's thread = +5 points.
          *   *Hidden Rule:* If the "Patient" (Envelope rule) requires continuity of identity (e.g., "Intimate care requires same carer"), and Pair B does it, the points are *voided* (simulating rejection/upake failure). But they don't know this until the end.
      *   **The Twist:** The "Time Budget." They only have enough time to do X tasks. If they spend time on Yellow (Noticing), they have less for Blue (Scoring).
      *   **The Payoff:** The group with the highest Whiteboard Score "wins" a trivial prize (e.g., first to leave, or choice of break). This incentivizes the "Institutional Frame."
      *   **The Crash:** In the debrief, we open the "Patient Feedback" (a card at the very bottom). It reveals that high-scoring tasks were experienced as intrusions because of the handover, and the Yellow cards (Noticing) were the only things that actually mattered.

  5.  **Addressing the Three Concepts in the Design:**

      *   **Continuity Cost:** Built into the "Handover." Pair B inherits Pair A's plan. If they follow it, they get points. If the "Patient" rule says "No, I wanted *you* specifically," the points are illusory. *Moment:* When they realize the "Continuity Bonus" was a trap because the Patient didn't want a generic continuation, they wanted the *person*.
      *   **Uptake Condition:** The "Hidden Rule" in the envelope. A task (e.g., "Wash") is worth 10 points. But if done by a stranger (Pair B), the Patient Card says "Refused." The Score says 10, Reality says 0. *Moment:* When the Score Sheet contradicts the Feedback Card.
      *   **Noticing Deficit:** Yellow Cards cost time but give no points. *Moment:* When they realize they didn't pick any Yellow cards because they wanted to win, and the Feedback Card says "I felt invisible."

  6.  **Drafting the Timeline:**

      *   00-10: Setup & Rules (Helper assists).
      *   10-30: Shift 1 (Pair A).
      *   30-50: Shift 2 (Pair B - Handover).
      *   50-60: Scoring & The Reveal (The Mismatch).
      *   60-75: Debrief (Mapping to concepts, honest costs, actionable takeaway).

  7.  **Refining the "Honest Part" of Debrief:**

      *   Must acknowledge that relationship-based care is unsustainable at scale without burning out carers.
      *   Must acknowledge that volunteers are often women, unpaid, filling gaps.
      *   Must give *one* actionable thing: "Ask one question that isn't on the form."

  8.  **Troubleshooting:**

      *   *The Protocol Nurse:* Wants to know the "Right Way." *Fix:* Tell her the game *is* the protocol, and the protocol is broken.
