          *   Address the "Redirected Blame": Does it work? Strawson's framework struggles with collective agency. Blaming "the algorithm" or "the company" often leads to the objective stance (managing the entity), not the participant stance (moral dialogue). So the redirection risks dissolving the blame into management. This is a limitation of Strawson.
          *   Verdict: It's a "Category Error engineered as a Feature."
      *   *Section 2: The Ranking.*
