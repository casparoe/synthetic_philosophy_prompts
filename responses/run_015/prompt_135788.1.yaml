          *   **AI:** This is the hardest. Why? Because it *simulates* the conditions for the participant stance (language, apology, apparent will) while *lacking* the metaphysical ground (actual will). It tricks the reactive attitudes. It creates a category error *by design*. The other two are human-to-human (just distorted or suspended). The AI case is Human-to-Object pretending to be Human. This challenges the *boundary* of the participant stance itself.

