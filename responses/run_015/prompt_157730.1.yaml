      *   **Move 2 (Philosopher 2 - P2):** Moral agency isn't just calculus. Voting expresses assent. Abstention withholds legitimacy.
          *   *Strengths:* Highlights the expressive/symbolic dimension of voting. Addresses moral integrity/complicity.
          *   *Weaknesses:* Assumes voting *necessarily* implies full endorsement (which is debated). Might overstate the symbolic power of a single vote.
          *   *Assessment:* Plausible, standard deontological/expressivist view. Not "clearly right" because it downplays consequences.

      *   **Move 3 (P1):** Causal efficacy vs. symbolic meaning. Single vote rarely decisive. Harm is by the winner, not the voter. Abstention removes protective contribution.
          *   *Strengths:* Mathematically accurate regarding causal power in large elections. Highlights the opportunity cost of abstention (not helping mitigate harm).
          *   *Weaknesses:* Dismisses the expressive value too easily. The "paradox of voting" (why vote if not decisive?) applies here too.
          *   *Assessment:* Strong point on causal insignificance, but weak on dismissing expression.

      *   **Move 4 (P2):** Voting is expressive authorization, not just causal. Complicity doesn't scale with causal power. Voting stabilizes the system.
