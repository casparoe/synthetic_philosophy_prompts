prompt: |-
  hey — i'm putting together a workshop for my care ethics semenar and i need a sorting instument, not the usual 'care vs justice' quiz everyone has seen. Can you act as an expert moral philosopher specializing in care ethics? Please think carefully, start with a quick brainstorm of the conceptual splits, and then build the tree.

  What i want is a taxonomy / decision tree that sorts people by what they actually believe about whether care obligations extend to distant strangers through institutional mediation. Don't name branches after authors; label them by the claim that splits them.

  First split: Is care essentially indexed to particular face-to-face relationships, or can it be 'ported' through social roles and institutions?
  Second split: Does fulfilling care require emotional labor, or can structural provisions alone satisfy it?
  Third split: If emotional labor is required, does it hit an 'attention ceiling' that makes care non-scalable?

  Each leaf gets a position name — Noddings-style relational care, Tronto-style political care, Held-style integrated care, or 'unnamed' — plus one sentence on its most awkward commitment, like having to say that a welfare bureaucrat genuinely cares for a client she's never met. Make sure there's at least one empty branch (logically possible but nobody defends it) — maybe the view that care is portable through roles but emotionally non-scalable — and flag it. Also flag any pair your tree can't separate.

  Use concrete diagnostic cases: can a nurse rotating shifts maintain care? Does a state agency 'care' when distributing aid? The point is that someone answers without knowing theory labels. Its for an offline model, so no bibliography, no citation requests, no reading lists. Write casually; a typo or two is totally fine.
