answer: |-
  # ACQUISITIONS AND CLASSIFICATION PROTOCOL (ACP-2024)

  **Purpose:** To determine the classification tier and disposition of objects in alignment with the Collections Policy (evidence of the human past; no vouching for authorship) and the Fake Endowment.
  **Time Limit:** 20 Minutes per object.
  **Authority:** Committee (7 members). Curators propose; Committee votes.

  ### I. PRE-SCREENING (5 Minutes)
  *Conducted by Curators prior to meeting. If any answer is YES, pause committee vote.*
  1.  **Legal:** Is there a plausible illegal export or theft claim? → **Refer to Counsel.**
  2.  **Deaccession:** Does this decision require removing an object from the collection? → **Refer to Full Board.**
  3.  **Value:** Is the insured value >$8,000 and is technical analysis required to verify claim? → **Commission External Opinion (if funds allow) or Default to Lower Tier.**

  ### II. THE BRANCHING QUESTION (2 Minutes)
  **Q1: Does the work's identity depend on the specific physical hand of the maker (Autographic), or is it defined by a structure/plate/file realizable by others (Allographic)?**
  *   **Autographic (Painting, Sculpture, Craft):** Proceed to Section III.
  *   **Allographic (Prints, Photography, Digital, Casts from moulds):** Proceed to Section IV.

  ### III. AUTOGRAPHIC ASSESSMENT (10 Minutes)
  **Q2: Is there documented evidence of deceptive intent regarding the object's origin?**
  *   **Yes:** Tier = **Forgery**. (If maker known: "Forgery by [Name]").
  *   **No:** Proceed to Q3.
  *   *Note: Deceptive intent includes removed marks, falsified provenance, or anachronistic materials concealed.*

  **Q3: Do technical materials and methods align with the claimed period of creation?**
  *   **No (Anachronistic):** Tier = **Imitation** (if period later but honest) or **Forgery** (if concealed).
  *   **Yes (Consistent):** Proceed to Q4.
  *   **Inconclusive/Unaffordable:** Default to **Of Uncertain Origin**.

  **Q4: Is the handling/style distinctive enough to identify the maker without documentation?**
  *   **Yes (Secure Comparanda):** Tier = **By [Name]**.
  *   **No (Generic/Close):** Tier = **Attributed to [Name]**.
  *   **No (Production Context Only):** Tier = **Studio or Workshop of [Name]**.
  *   **No (Later Copy):** Tier = **After [Name]**.

  ### IV. ALLOGRAPHIC ASSESSMENT (10 Minutes)
  **Q5: Was the impression/cast produced under the authority of the creator or their estate during the authorized production window?**
  *   **Yes:** Tier = **By [Name]**.
  *   **No (Posthumous/Unauthorized):** Tier = **After [Name]**.
  *   **No (Deceptive Intent):** Tier = **Forgery**.

  ### V. TIER VOCABULARY & SIGN-OFF
  1.  **By [Name]:** Secure documentation + technical + style. *(Curator sign-off)*
  2.  **Attributed to [Name]:** Strong style/technical, weak documentation. *(Committee sign-off)*
  3.  **Studio or Workshop of [Name]:** Context secure, hand uncertain. *(Committee sign-off)*
  4.  **After [Name]:** Later copy, honest intent. *(Committee sign-off)*
  5.  **Imitation:** Contemporary copy, honest intent. *(Committee sign-off)*
  6.  **Forgery:** Intent to deceive established. *(Committee sign-off; Fake Endowment eligible)*
  7.  **Of Uncertain Origin:** Evidence insufficient. *(Committee sign-off)*

  ### VI. DISPOSITION RULES
  *   **Tier 1-3 (By/Attributed/Studio):** **Retain/Acquire.** (Value: Authorial Evidence).
  *   **Tier 4-5 (After/Imitation):** **Retain/Acquire** IF useful for teaching reception history. **Decline/Deaccession** IF redundant or storage burden outweighs pedagogical value.
  *   **Tier 6 (Forgery):** **Decline** (unless Fake Endowment applies). **Retain** (if already in collection and useful as evidence of deception).
  *   **Tier 7 (Uncertain):** **Retain** as evidence of material culture. **Decline** if storage costs exceed research potential.
  *   **Default:** When evidence is unavailable or unaffordable, **Downgrade Tier**. Do not guess "By".

  ### VII. ESCALATION (Values vs. Facts)
  *   **Fact:** Is the lead white modern? (Conservator/Curator)
  *   **Value:** Is a 19th-century fake of a Roman statue worth keeping? (Committee)
  *   **Value:** Does displaying a forgery damage institutional trust? (Committee/Board)
  *   *If the Committee is split >2 votes on a Value question, refer to Board.*

  ***

  # PHILOSOPHICAL AUDIT & CRITICAL REFLECTION

  **Distinctions Kept:** I retained Goodman's distinction between autographic and allographic arts (Section II). This is non-negotiable; treating a print like a painting misunderstands the ontology of the work. I retained the "history of production" requirement for Tier 1 ("By"). A visually perfect copy lacks the causal history of the original, and under the new policy ("evidence of the human past"), that history *is* the evidence.

  **Distinctions Dropped:** I dropped the distinction between "aesthetic quality" and "historical value." The procedure assumes a bad painting "By" the master is Tier 1, and a beautiful painting "Forgery" is Tier 6. This is a deliberate philosophical choice: we are collecting evidence of agency, not beauty. I also dropped the "Innocent Copy" vs. "Guilty Fake" distinction for *classification* (both are downgraded), reserving the moral judgment for *disposition* (Fake Endowment).

  **Unfairness & Systemic Bias:**
  1.  **The $8,000 Threshold:** This procedure systematically disadvantages low-value objects (folk art, non-Western material, works by women/minorities historically undervalued). They cannot trigger technical analysis, forcing a default to "Uncertain" or "Attributed," which depresses their status permanently.
  2.  **The "Hand" Bias:** The Autographic branch privileges the Romantic myth of the individual genius. It struggles with collaborative, communal, or anonymous traditions where "By" is culturally inappropriate.
  3.  **Laundering Doubt:** The "Attributed to" tier is a device for laundering doubt into value. It allows the museum to hint at greatness without legal liability. I have kept it because removing it would empty the collection, but I acknowledge it is intellectually dishonest.

  **Unsettled Literature:** The status of posthumous prints (Case D) is genuinely unsettled in aesthetics. Is the work the plate (concept) or the impression (object)? The literature (e.g., *Goodman* vs. *Wollheim*) does not agree on whether estate authorization constitutes "authorship." My procedure guesses that estate authorization is the institutional proxy for authorship.

  **Encoded Philosophical Choices:**
  1.  **Materialism over Connoisseurship:** Q3 (Technical) trumps Q4 (Style). This encodes the view that physical history is more real than stylistic intuition. *Defense:* Style is subjective; chemistry is (mostly) not. In a defensible record, data beats opinion.
  2.  **Deception as a Category:** Tier 6 (Forgery) treats deceptive intent as an ontological category, not just a legal one. *Defense:* Following Goodman, knowing an object is a forgery changes its aesthetic perception. It becomes evidence of *greed* or *skill at deception*, not evidence of the claimed era.
  3.  **The Default to Downgrade:** When in doubt, we lower the tier. *Defense:* This aligns with the new policy ("declines to vouch"). It shifts the burden of proof from the skeptic to the claimant.

  ***

  # CASE RUNS

  ### CASE A: The Small Oil Landscape
  *   **Branch:** Autographic (Painting).
  *   **Q2 (Deceptive Intent?):** **Inconclusive.** Signature area abraded/renewed. Craquelure inconsistent. No alternative author proposed.
  *   **Q3 (Technical Align?):** **Yes.** Pigments/ground consistent with 1920s-50s.
  *   **Q4 (Style Distinctive?):** **No.** Handling close, but not distinctive enough for ID on style alone.
  *   **Tier:** **Of Uncertain Origin (Materials consistent with 1920s-50s).**
      *   *Reasoning:* The signature is compromised. "Attributed to" implies we believe she painted it. The new policy forbids vouching. The technical data proves *period*, not *person*.
  *   **Disposition:** **Reclassify and Retain.**
      *   *Reasoning:* It is evidence of mid-20th-century landscape painting, even if the specific agent is unknown. Downgrading protects the museum from future embarrassment without losing the object's utility as period evidence.
  *   **Committee Friction:** Curators will dislike this. It devalues an asset. *I defend it:* A "By" that is later proven false damages accreditation. "Uncertain" is honest.

  ### CASE B: The Bronze Statuette
  *   **Branch:** Autographic (Sculpture/Cast). *Note: Bronzes straddle the line, but as a "Roman Antiquity" claim, it is treated as unique historical evidence.*
  *   **Q2 (Deceptive Intent?):** **Yes.** Stamp tooled away. Sold/exhibited as Roman since 1911.
  *   **Q3 (Technical Align?):** **No.** 19th-century alloy/method.
  *   **Tier:** **Forgery of Roman Antiquity (19th-Century Aftercast).**
      *   *Reasoning:* It was sold as Roman. The removal of the founder's mark establishes intent to deceive the 1911 buyer. It is physically a 19th-century object.
  *   **Disposition:** **Reclassify and Retain.**
      *   *Reasoning:* It fails as Roman evidence, but succeeds as 19th-century evidence (taste for classics, foundry practice). It is more legible than the genuine fragment. It stays as a teaching tool on reception history.
  *   **Committee Friction:** Some trustees will want to deaccession "fakes." *I defend it:* Under the "evidence of human past" policy, a 19th-century lie about Rome is as historically valid as a 1st-century truth. It testifies to 1911 museum culture.

  ### CASE C: The Modern Fraud
  *   **Branch:** Autographic (Painting).
  *   **Q2 (Deceptive Intent?):** **Yes.** Maker convicted of fraud. Sold as 1948 rediscovery.
  *   **Q3 (Technical Align?):** **No.** Made 2016.
  *   **Tier:** **Forgery by [Living Artist] of [Modernist Name].**
      *   *Reasoning:* Intent is legally established. Materials are anachronistic to the claim.
  *   **Disposition:** **Accept (Fake Endowment).**
      *   *Reasoning:* Fits the new endowment exactly. The donor's condition (display as warning) aligns with the "evidence of human past" policy (evidence of market fraud).
  *   **Committee Friction:** Displaying fakes may be seen as undignified. *I defend it:* Hiding the fake sanitizes history. Displaying it as a fake fulfills the educational mission and utilizes the specific endowment provided.

  ### CASE D: The Posthumous Etchings
  *   **Branch:** Allographic (Prints).
  *   **Q5 (Authorized Production?):** **No.** Artist died before printing. Estate maintains they are not "by her."
  *   **Tier:** **After [Artist], Printed by [Printer].**
      *   *Reasoning:* In allographic arts, the artist's authorization defines the work. The Estate (legal holder of authorship rights) has denied authorization. The printer's skill does not make it the artist's work.
  *   **Disposition:** **Reclassify and Retain.**
      *   *Reasoning:* Do not acquire as "By." Retain as "After" to document the complexity of print estates and the definition of the oeuvre.
  *   **Committee Friction:** The printer and some collectors consider these genuine. *I defend it:* The procedure defers to the Estate's institutional authority on authorship for allographic works. To call them "By" is to override the legal and artistic definition of the oeuvre. However, we retain them because the *process* (cancelled plates, estate decision) is itself evidence of the human past (art market/legacy management).

  ***

  # FAILURE MODES

  **Where the Procedure Misfires:**
  1.  **Collaborative/Indigenous Works:** The "By" vs. "Workshop" tier assumes a Western individualist model of authorship. It will systematically misclassify communal works where "By [Community]" is not an option in our vocabulary.
  2.  **Conceptual Art:** For works where the "hand" is irrelevant (e.g., Sol LeWitt wall drawings), the Autographic branch forces a square peg into a round hole. The procedure treats the *certificate* as the object, which we are not equipped to grade.
  3.  **The "Uncertain" Ghetto:** Objects defaulted to "Uncertain Origin" due to the $8,000 technical threshold will become second-class citizens. They will be less loaned, less displayed, and less researched. This creates a class system based on insurance value, not historical significance.

  **What It Cannot Settle:**
  The procedure cannot settle the *moral* status of a fake. Is a forgery a crime or a tribute? The procedure classifies it as "Forgery" (fact of intent) and leaves the moral judgment to the Disposition phase (Values). This is unavoidable. We can define what it *is*, but not what it *means* to the visitor, without exceeding the 20-minute limit.

  **Final Defense:**
  This procedure prioritizes **defensibility** over **prestige**. It accepts that we will own fewer "Masterpieces" (Tier 1) and more "Evidence" (Tier 4-7). This is the only sustainable path for a regional museum in the 21st century. We are not a temple of genius; we are an archive of human making. The procedure enforces that humility.
