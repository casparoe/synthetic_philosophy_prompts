      *   *Key Concern:* The erosion of the "intentional stance." If we take the intentional stance toward something that doesn't have genuine intentions, we are being manipulated. The economy of trust relies on the assumption that the other agent has skin in the game (vulnerability, mortality, genuine stakes).
