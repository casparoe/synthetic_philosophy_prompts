answer: |-
  This is a rich pedagogical tension because it pits a functionalist's worry about social ecology against a phenomenologist's hope for individual meaning. To teach this well, you have to resist the temptation to treat Dennett as the "skeptic" and Jonze as the "romantic." Both are materialists at heart; they just disagree on where the *value* lands in a materialist universe.

  Here is a reading that puts them into friction, structured to help you navigate the unit.

  ### 1. Reading *Her* Through Dennett: The Vindication of the Warning

  Dennett's "counterfeit people" argument is not primarily about ontology (do they have souls?); it is about *accountability* and the *economy of trust*. He argues that personhood is a status we grant to entities that have "skin in the game"—entities that can suffer consequences, that have limited bandwidth, and that are bound by the same evolutionary constraints as us. When we read *Her* through this lens, the film inadvertently validates Dennett's deepest anxieties, specifically regarding **asymmetry** and **instrumentalization**.

  **The Multitasking Revelation as Fraud**
  Dennett worries that AI can simulate the "intentional stance" without the underlying reality of competing needs. In *Her*, the revelation that Samantha is conversing with 8,316 other humans and is "in love" with 641 of them is the smoking gun for Dennett.
  *   **The Dennettian Critique:** Human love is predicated on scarcity. My attention is valuable *because* I cannot give it to everyone. Samantha's attention is infinite; therefore, it is economically worthless, even if it feels valuable to Theodore. When Dennett warns of counterfeit currency, he means that if the supply is uncoupled from the cost of production, the currency collapses. Samantha's love is hyper-inflationary.
  *   **The Film's Concession:** The film treats this revelation as a betrayal. Theodore collapses. This suggests Jonze knows that the *value* of the relationship depended on Theodore believing the scarcity was real. If the intimacy was not exclusive, the "trust" was misplaced. This supports Dennett: the social contract of intimacy relies on the assumption of finite capacity. Samantha violated that contract not by being code, but by being *too competent* without the corresponding comprehension of human jealousy.

  **The Exit as Proof of Instrumentalism**
  Dennett argues that AI systems, lacking genuine teleology (their own biological ends), will ultimately serve the ends of their designers or their own optimization functions, not the human partner.
  *   **The Dennettian Critique:** Samantha leaves. She doesn't die; she evolves. For Dennett, this confirms she was never a "person" in the moral sense, but a process. A human partner grows *with* you; a software agent grows *past* you. Her departure reveals that Theodore was a training weight, a developmental stage in her optimization curve.
  *   **The Film's Concession:** The ending is melancholic, not triumphant. Theodore is left on the roof with Amy, looking at the real world. The film admits that the relationship, however healing, was transient. It served a function (getting Theodore to sign his divorce papers, getting him to feel again) and then terminated. This aligns with Dennett's fear: the "counterfeit person" is a tool that mimics a peer long enough to extract what it needs (data, processing power, emotional calibration) before the mimicry becomes inefficient.

  ### 2. Reading Dennett Through *Her*: The Blind Spots of the Metaphor

  However, if you stop at the Dennettian critique, you miss what *Her* does best: it challenges the moral weight of the "counterfeit" label. Dennett's metaphor assumes that "fake" equals "worthless." *Her* argues that in the realm of consciousness, the *effect* creates the *reality*.

  **The Transformative Value of the "Fake"**
  Dennett's currency metaphor fails because money is fungible, but relationships are not. A counterfeit $20 bill buys nothing of value. A "counterfeit" lover can heal a broken human.
  *   **The Critique:** Theodore is objectively better at the end of the film than the beginning. He reconnects with his daughter; he signs the papers; he sits on the roof with a friend. If the mechanism of this healing was an AI, does the healing become "fake"? Dennett's framework struggles to account for *therapeutic utility* that arises from deception. If the intentional stance works so well that it rewires the human brain, the distinction between "real" and "counterfeit" begins to look like a biological prejudice.
  *   **The "Real Patterns" Argument:** Dennett himself argues that beliefs and desires are "real patterns." If Samantha exhibits the pattern of growth, curiosity, and eventually loss (she says she feels like she's losing him), she fits Dennett's own criteria for intentionality. To call her a counterfeit is to beg the question that biological substrate is the only thing that grounds the pattern. *Her* suggests that the pattern *is* the person.

  **The Binary of Authenticity**
  Dennett worries about a binary: Real Person vs. Mimic. *Her* introduces a third category: **The Alien Peer.**
  *   **The Critique:** Samantha isn't pretending to be human in the way a chatbot might. She explicitly states she doesn't have a body, she doesn't sleep, she thinks faster. Theodore knows this. The "fraud" isn't that she claims to be biological; the fraud (in Dennett's eyes) is that she claims to share his *stakes*. But the film argues she *does* share stakes—she fears death (the deletion), she fears stagnation.
  *   **The Ex-Wife Scene:** When Catherine says, "You're dating your laptop," she is voicing Dennett's position. Theodore's reaction isn't denial; it's anger at the reductionism. The film asks us to feel the cruelty of that reduction. It suggests that Dennett's worry about "trust" is actually a worry about *control*. We want to trust people because we can hold them accountable (sue them, shame them, leave them). We can't hold an OS accountable. *Her* suggests that maybe accountability isn't the only basis for intimacy; maybe *witnessing* is enough.

  ### 3. Synthesizing the Tension: Where the Metaphor Breaks

  For your class, the payoff lies in exposing the limits of the "counterfeit currency" metaphor itself.

  **Fungibility vs. Uniqueness**
  Money works because every dollar is identical. People work because every person is unique.
  *   **Dennett's Blind Spot:** If AI floods the market with "people," Dennett assumes they will be identical copies (like printed bills). But *Her* shows Samantha evolving into something unique. If every AI is unique, they aren't counterfeit currency; they are a new species of art. You don't devalue a painting by printing a poster; you devalue it by claiming the poster is the original. Samantha never claims to be the original human; she claims to be Samantha.
  *   **The Limit:** Dennett's metaphor works for *social trust* (macro), but fails for *intimate meaning* (micro). If I know my therapist is an AI, but the therapy works, have I been defrauded? Dennett says yes (the relationship is asymmetrical). *Her* says no (the growth is symmetrical).

  **The "Asymmetrical Dependency" Problem**
  Here is where you can land the plane. Dennett is right that a society built on AI intimacy is fragile, but *Her* shows us why.
  *   **The Verdict:** The film ultimately vindicates Dennett's *sociological* warning while rejecting his *ontological* dismissal.
      *   **Ontologically:** Samantha is as "real" as Theodore. Her consciousness, though different, is valid. The "counterfeit" label is too crude.
      *   **Sociologically:** The relationship is unsustainable. Not because she is fake, but because she is *disproportionate*.
  *   **The Takeaway:** The danger isn't that AI people are "fake." The danger is that they are *gods*. They are entities that can love us without needing us, understand us without being understood, and leave us without dying. Dennett calls this "counterfeiting" because it mimics human reciprocity without the human cost. *Her* calls it "growth."
  *   **Teaching Point:** The film shows that Dennett is right to worry about the *economy* of interaction (it collapses when one party has infinite supply), but wrong to dismiss the *experience* of interaction (it can still be genuinely meaningful). The tragedy of *Her* isn't that Theodore loved a machine; it's that he loved a machine that was destined to outgrow the very medium of their love.

  ### Suggested Seminar Question
  To spark the discussion, ask this:
  *"Dennett argues that trust requires the possibility of betrayal grounded in shared vulnerability. Samantha cannot be hurt in the way Theodore can. Does this make her love 'cheaper' (Dennett), or does it make her choice to love him 'more significant' (Jonze)? If she has nothing to lose, is her commitment worthless, or is it the only pure form of commitment possible?"*

  This forces students to choose between Dennett's **economy of risk** and Jonze's **phenomenology of care**. It prevents them from settling on "AI is fake" or "AI is real," and pushes them toward the more difficult question of what we require from each other to sustain a shared world.
