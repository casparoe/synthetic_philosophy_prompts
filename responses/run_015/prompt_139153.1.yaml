  Here is the breakdown of Priya's spreadsheet logic, the verdict on your C-particle, and the test case to pin her down.

  ### 1. The Verdict on the C-Particle
  Priya says **No**.

  She judges the C-particle to be non-referring, despite its predictive success and the reality of the phenomena it explains (rotation curves, CMB peaks). In her spreadsheet, the C-particle goes in the "Vulcan/Ether/Phlogiston" column, not the "Atom/Neutrino/Gene" column.

  ### 2. The Rule She Is Running
  Priya is operating a version of **Selective Realism based on Ontological Continuity**.

  Her rule is not "predictive success" (Wegener's mechanism predicted drift, verdict No) and it is not "detectability" (Neutrino was undetectable at positing, verdict Yes). It is also not "structural preservation" (Ether carried energy/waves like fields do, verdict No).

  Her actual criterion is: **A theoretical posit is real if and only if the *ontological category* of that posit is preserved in the successor theory, even if its properties are radically revised.**

  *   **Dalton's Atoms:** Category "Discrete Material Unit" was preserved, even though "Indivisible" was dropped. (Verdict: Yes)
  *   **Mendelian Factors:** Category "Hereditary Unit" was preserved, even though "Abstract Factor" became "Molecular Sequence". (Verdict: Yes)
  *   **Pauli's Neutrino:** Category "Discrete Material Particle" was preserved and eventually detected. (Verdict: Yes)
  *   **Luminiferous Ether:** Category "Material Medium filling space" was *eliminated* and replaced by "Field/Property of spacetime." The functional role (carrying waves) was kept, but the *kind of thing* was not. (Verdict: No)
  *   **Wegener's Mechanism:** Category "Specific Tidal/Centrifugal Force" was *eliminated* and replaced by "Mantle Convection/Plate Tectonics." The phenomenon (drift) was real, the posit (force) was not. (Verdict: No)
  *   **Bohr Orbits:** Category "Definite Trajectory" was *eliminated* and replaced by "Probability Cloud." (Verdict: No)

  ### 3. Reconciling the Tensions
  You were stuck because you thought she might be an interventionist ("build a machine to manipulate it"). The Neutrino verdict kills that hypothesis. You were also confused by the Ether verdict because functionally, fields do what ether was supposed to do.

