answer: |-
  ### Brainstorming Hypotheses

  Here are ten hypotheses regarding the stalemate, ranging from standard positions to more speculative diagnoses. I have marked the ones I find less plausible with a [Reject] tag, though I include them to show the landscape.

  1.  **Quantifier Variance (Hirsch):** The dispute is purely verbal; 'exists' is ambiguous between a restricted and unrestricted reading, and both are equally valid. [Reject: Too easy. Doesn't explain why the *normative* pressure to choose one remains so high.]
  2.  **Brute Fundamentalism (Sider):** There is a single "structure of the world," and 'exists' carves at the joints. One side is objectively wrong about the joints. [Reject: Leads to the epistemic skepticism you're facing; if we can't access the joints, the dispute is practically idle.]
  3.  **Cognitive Style Mismatch:** The nihilists are hyper-systemizers seeking parsimony; the universalists are naturalizers seeking fidelity to cognition. It's a psychological clash, not a philosophical one. [Reject: Reduces the normativity to psychology, which philosophers will resent.]
  4.  **Semantic Indeterminacy:** The word 'exists' is semantically incomplete; there is no fact of the matter until we precisify it, and we haven't agreed on how. [Reject: Similar to variance, but implies we *could* fix it. We haven't, after decades.]
  5.  **Your Evaluative Hypothesis:** The dispute is about the *goal* of ontology (fundamentality vs. utility/fidelity). It is a normative disagreement masquerading as descriptive. [Keep: Strong contender.]
  6.  **Error Theory:** Both sides are wrong. 'Existence' is a flawed folk concept that shouldn't be regimented at all. [Reject: Too revisionary; doesn't explain the persistence of the intuition.]
  7.  **Conceptual Engineering (Chalmers):** We shouldn't ask what exists, but what concept *should* we use. The dispute is a failure to switch to engineering mode. [Keep: Closely related to your hypothesis.]
  8.  **Metaphysical Vagueness:** Composition is vague; the world itself doesn't decide. [Reject: Lewis/Sider argument that structure cannot be vague is too strong to ignore.]
  9.  **Disciplinary Sociology (Kuhnian):** This is a paradigm war. Incommensurability prevents resolution until one generation dies off. [Reject: Cynical, and ignores the rational arguments being exchanged.]
  10. **Implicit Modal Commitments:** The disagreement isn't about what *does* exist, but about what *could* exist (modal profiles), disguised as an existential claim. [Reject: You stated they agree on physics/arrangement, so modal profiles likely align too.]

  ***

  ### The Diagnosis

  You are correct to suspect the "verbal vs. substantive" dichotomy is a trap. That binary assumes that for a dispute to be substantive, it must be about a mind-independent fact that is *accessible* and *decidable* by the terms currently in play.

  My diagnosis refines your hypothesis: This is not merely a disagreement about what ontology is *for*; it is a **clash of constitutive norms**.

  The Realist (Universalist/Commonsense) and the Nihilist are not playing the same game with different moves; they are playing different games and claiming victory in the same tournament.
  *   The **Nihilist** treats *Fundamentality* as the constitutive norm of ontology. To say "X exists" is to claim "X is ontologically fundamental." Since tables aren't fundamental, "tables exist" is false.
  *   The **Universalist** treats *Indispensability* or *Fidelity* as the constitutive norm. To say "X exists" is to claim "X is indispensable to our best total theory" or "X is part of the ordinary conceptual scheme we cannot shed." Since tables are indispensable/fidelitous, "tables exist" is true.

  When they argue, they talk past each other because they are using "exists" to track different *values*. The Nihilist tracks *carving nature at the joints*. The Universalist tracks *carving discourse at the seams*.

  The reason the "verbal" label fails is that neither side views their norm as optional. The Nihilist thinks tracking fundamentality is what *makes* ontology ontology. The Universalist thinks tracking indispensability is what *makes* ontology relevant. Therefore, neither can concede without abandoning their conception of the discipline. This is why your "evaluative" diagnosis hits the mark: it is a disagreement about which virtue (parsimony vs. fidelity) trumps the other when they conflict. It is a normative stalemate disguised as a metaphysical one.

  ***

  ### The Cost-of-Error Test

  Let's run your gadget.

  **The Realist/Universalist:** "If I'm wrong, I have a false belief about the world."
  **The Nihilist:** "If I'm wrong, I have a false belief about the world."

  **Does this answer beg the question?**
  Yes, blatantly. But your test is valuable precisely because it exposes *how* it begs the question.

  When the Realist says, "I would have a false belief," they are implicitly adding the clause: *"...relative to the framework where existence tracks ordinary/fuseable objects."* When the Nihilist says it, they add: *"...relative to the framework where existence tracks fundamental structure."*

  If you press them—"Okay, suppose you are wrong. What *changes*?"—you will find the test breaks down the factual pretense.
  *   **Press the Realist:** "If you're wrong and tables don't exist, do you stop sitting at them?" No. "Do you change your physics?" No. "Do you stop teaching your students to talk about tables?" No. "So what do you give up?" "I give up the claim that my ontology matches my discourse."
  *   **Press the Nihilist:** "If you're wrong and tables do exist, do you start believing in magic?" No. "Do you change your physics?" No. "So what do you give up?" "I give up the claim that only fundamental entities merit the title 'existence'."

  **Verdict on the Test:** The test reveals that the "false belief" claim is **stipulated by their own view**, not informed by independent evidence. The "error" has no cash value outside the specific normative framework they have already adopted. The test successfully demonstrates that the dispute is not factual in the standard sense (where being wrong forces a change in prediction or action). It confirms your hypothesis: the "error" is actually a failure to live up to a specific *disciplinary ideal*, not a failure to match the world.

  ***

  ### The Cartographer Calibration Case

  This case is excellent for isolating the variable of *utility*.

  **Case 1: The Border Map is Strictly Better**
  Suppose the map with borders is strictly better for *every* purpose (navigation, taxation, aesthetics) and the borderless map is useless.
  *   **Does this settle whether there really is a border?** No. It settles that the *concept* of a border is indispensable.
  *   **Why:** Utility $\neq$ Truth. A lie can be more useful than the truth. However, if you are a Quinean (ontological commitment via indispensability), then yes, utility *constitutes* existence for you. If you are an Aristotelian (existence = fundamentality), utility is irrelevant.
  *   **Implication:** "Strictly more useful" can only do the work of "true" if you have already accepted pragmatism as your metaontological norm.

  **Case 2: Split Purposes**
  Some tasks need borders (taxation); some need terrain (hiking).
  *   **Does this look like the composite-objects dispute?** Yes, exactly.
      *   **Physics** is the "hiking" task: it needs particles/terrain. Borders (tables) get in the way.
      *   **Daily Life/Economics** is the "taxation" task: it needs tables/borders. Particles are too granular to use.
  *   **Conclusion:** The composite-objects dispute is the **split-purposes version**. The Nihilist privileges the "hiking" purpose (fundamental description). The Universalist privileges the "taxation" purpose (ordinary description).
  *   **What this shows:** Since neither purpose is objectively "the one true purpose of mapping," neither map is "the one true map." Consequently, neither ontology is "the one true ontology" *simpliciter*. The dispute is about which purpose gets to dictate the terminology of "existence."

  This confirms that "strictly more useful" cannot settle the truth question unless we agree on *what we are trying to do*. Since we haven't agreed on what ontology is for, utility cannot resolve the dispute.

  ***

  ### What Counts as Progress?

  You asked for concrete candidates, ranked by likelihood of actually moving a disagreeing grad student. I am going to be honest: if they are dug in after eight months, standard arguments will not move them. Progress here looks less like "winning" and more like "dissolving the need to win."

  **1. A Decision-Theoretic Treatment of Framework Choice (Highest Likelihood)**
  *   **The Pitch:** Stop asking "Which is true?" and model the choice as a decision under uncertainty. Assign costs to "ontological bloating" (Nihilist fear) and "paraphrase complexity" (Universalist fear).
  *   **Why it lands:** It forces both sides to quantify their intuitions. The Nihilist has to admit *how much* they hate abstract objects (is it a cost of 10 units or 1000?). The Universalist has to admit *how much* effort paraphrasing costs. It shifts the conversation from "You are wrong" to "Your risk tolerance is different." It validates both positions as rational responses to different weightings of theoretical virtues.
  *   **Chance of moving them:** 60%. It changes the game from truth to optimization.

  **2. An Argument About What Ontology Ought to Be For (Normative Metaontology) (Medium Likelihood)**
  *   **The Pitch:** Directly argue that the goal of ontology should be *conceptual engineering* for specific sciences, not *metaphysical revelation*.
  *   **Why it lands:** It targets your "evaluative" hypothesis directly. If you can convince them that "fundamentality" is a theologian's goal, not a philosopher's, the Nihilist loses their footing.
  *   **Chance of moving them:** 30%. People are deeply attached to the idea that philosophy discovers "deep truth." Telling them their job is merely engineering feels like a demotion they will resist.

  **3. A Formal Proof of Expressive Equivalence (or Lack Thereof) (Low Likelihood)**
  *   **The Pitch:** Rigorously prove that the Nihilist's paraphrase scheme preserves *all* logical relations, or prove that it fails in a specific modal context.
  *   **Why it lands:** It appeals to the analytic desire for rigor.
  *   **Chance of moving them:** 10%. You mentioned they already have paraphrases. Usually, when a paraphrase exists, the Realist just claims it's "too clumsy" (a normative claim, not a logical one). A formal proof won't fix a normative preference for elegance.

  **4. Empirical Work on Ordinary Quantifiers (Lowest Likelihood)**
  *   **The Pitch:** Run experiments to see if regular people mean "fundamental" or "ordinary" when they say "there is."
  *   **Why it lands:** It brings in data.
  *   **Chance of moving them:** 0%. The Nihilist will say "Folk semantics doesn't dictate metaphysics." The Universalist will say "See, we were right all along." It fuels the fire rather than extinguishing it.

  **The Pessimistic Alternative:**
  If I am being brutally honest, there is a non-zero chance that **nothing will move them**. If the dispute is truly a clash of bedrock normative commitments (as your hypothesis suggests), then rational argument cannot resolve it, because the arguments *presuppose* the norms they are trying to justify. In this scenario, the only progress is **pluralism**: agreeing to publish in different journals, or agreeing that "existence" is context-sensitive (fundamental contexts vs. ordinary contexts). If you can get your group to agree that *both* languages are legitimate tools for different jobs, you have achieved the maximum possible progress. Anything more is theology.
