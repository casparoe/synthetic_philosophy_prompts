  1.  **Deconstruct the User's Query:**

      *   **User Persona:** PhD student in legal philosophy. (This means I need to speak at a high theoretical level, referencing key scholars, concepts, and debates without oversimplifying, but also without being needlessly obscure.)
      *   **Core Problem:** The "loop" of constitutional review. The Court interprets the Constitution, but the Court's existence/power comes from the Constitution. Amendments (which could override the Court) often require processes the Court might influence or interpret. It's a self-referential system (Escher's "Drawing Hands").
      *   **Key Questions:**
