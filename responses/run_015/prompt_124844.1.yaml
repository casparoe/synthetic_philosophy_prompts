          2.  Does it need an "inviolate level" (e.g., Popular Sovereignty) outside the loop?
          3.  Can it survive as a "fully tangled hierarchy" (no bottom)?
          4.  Why doesn't ordinary statutory interpretation trigger this anxiety? (Is the Constitution a different *logical level*?)
          5.  If we take the loop seriously, are courts making law or applying it?
          6.  Is the practice coherent under one view of authority, or underdetermined (compatible with rival pictures)?

  2.  **Initial Brainstorming & Theoretical Mapping:**

