      *   **Core Task:** Define a precise principle (or small set) for "the banality of evil" based on their 8 case studies + the insurance model case.
      *   **Constraints:** No reading lists, no academic jargon dumps. Must be applicable to new cases. Must address specific tensions in their current verdicts (Careerist vs. Tormented, Dutiful, etc.). Must address the "Competence Trap" (their own invention). Must address three new hypothetical cases (Banal Goodness, Staged Banality, Structural Ignorance). Must address the "Radical Evil" vs. "Banal Evil" distinction.
      *   **Tone:** Respectful, rigorous, direct, conversational but precise. Acknowledge their operational expertise as a valid lens.

