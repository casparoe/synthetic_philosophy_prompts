  *(Self-Correction on the "Tormented One")*: Arendt might actually argue that if you feel guilt and *still do it*, you have surrendered your faculty of judgment to the external rule. However, the *presence* of the torment suggests the faculty isn't dead, just suppressed. The "Banality" is usually associated with the *lack* of torment. I will argue that the Tormented One is *tragic*, not banal. Banality is the absence of the struggle.

  *(Self-Correction on "Radical Evil")*: Need to be careful. In *Origins of Totalitarianism*, she used "Radical Evil." In *Eichmann in Jerusalem*, she explicitly moved away from it because Eichmann wasn't radical/monstrous. The friend is conflating the *outcome* (radical destruction) with the *agent* (banal). I need to make that distinction sharp.

