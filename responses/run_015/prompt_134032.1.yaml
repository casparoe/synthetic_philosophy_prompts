      *   But the friend's argument *uses* (2) to convict her. The friend claims (2) applies. I need to show why it doesn't.
      *   The "nickel bet" relies on the proposition $P$ having the same truth conditions at $t_1$ and $t_2$. If conceptual change alters the meaning of $P$ (e.g., from a substantive theory to a false placeholder), the bet at $t_2$ is not on the same thing as the bet at $t_1$.
      *   Therefore, the bookie cannot guarantee a loss because the payoff conditions might not align.
      *   This addresses the user's worry about the "nickel bet... not available".
      *   Also, the "bookie who runs this may need to be conceptually ahead" worry is relevant. If the bookie knows how the concepts will shift, the bookie has evidence Clara doesn't. But the standard diachronic book assumes the bookie just exploits the agent's own changing prices, not superior knowledge. However, if the agent's change is due to *conceptual* innovation, the bookie needs to understand the new concept to offer the second bet. If the concept is truly unbidden, the bookie couldn't have anticipated the bet structure at $t_1$.
      *   Actually, the diachronic book happens sequentially. Bet 1 at $t_1$. Bet 2 at $t_2$. At $t_2$, the concept exists. The bookie offers Bet 2 based on Clara's new credence. The issue is whether Bet 2 cancels Bet 1.
      *   If Clara assigns 0.7 to M at $t_1$ and 0.0 to M at $t_2$ (because M is impossible), the bookie sells high (0.7) and buys low (0.0). Clara loses 0.7.
      *   Is this irrational? Only if she *should* have kept credence at 0.7. But if M is impossible, she *should* drop it.
      *   So the conflict is between "Rationality requires coherence over time (2)" and "Rationality requires responsiveness to conceptual discovery (5)".
      *   The resolution is that (2) presupposes a fixed domain of propositions. When the domain changes, (2) is silent.
      *   The user wants to keep (1) and (2). I should advise that (2) is conditionally true but its conditions are not met in conceptual change. Thus the argument fails at the application of (2) to the case in (4).
      *   This preserves (1) and (2) as valid within their domain (fixed algebra) but admits Dutch-book theory cannot judge conceptual change.
      *   This answers the user's final question: "whether holding them means the Dutch-book framework falls silent exactly where the interesting epistemic action is." Yes, it does.
      *   I need to write this as a continuous prose email.

