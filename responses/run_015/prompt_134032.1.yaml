      *   So the break is likely between (2) and (4)/(5). The argument equivocations on whether the old propositions persist sufficiently to be betted on.
      *   Also, the "bookie" problem (user's 3rd worry) is significant. To Dutch book Clara, the bookie needs to know the relationship between the old and new concepts *before* Clara does, or at least at the time of the second bet. If the new concept is "unbidden" and unforeseen, how can the bookie offer a bet on the new structure at a price favorable to Clara *before* she fully integrates it?
      *   Actually, the standard diachronic Dutch book involves a bet at $t_1$ and a bet at $t_2$. At $t_2$, Clara has new credences. The bookie offers a bet based on those. The issue is whether the bet at $t_2$ is on the *same* proposition as $t_1$.
