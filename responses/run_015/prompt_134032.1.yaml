      *   Alternatively, step (5) is suspect. Why does rationality *require* confidence to fall just because the category was inadequate? Maybe it requires redistribution. But (5) says "confidence in every proposition of the old language to fall". If Miasma is empty, confidence should go to 0. If Conservation says it must stay at 0.7, contradiction.
