      *   **Salutation/Opening:** Acknowledge the friend's argument and its strength. It's a known problem (Garber, Jeffrey, etc.).
      *   **Diagnosing the Break:** The argument fails at the intersection of (2) and (4). The Conservation Lemma requires the proposition to persist with the same identity. Radical conceptual change denies this.
      *   **Explaining the "Nickel Bet":** The bet requires a common payoff condition. If "Miasma" changes from a live possibility to a non-referring term, the bet at $t_2$ isn't on the same thing as $t_1$. The bookie can't close the book.
