  4.  **Identify the Break Point:**
      *   The argument relies on the applicability of the Dutch book setup across conceptual change.
      *   The Conservation Lemma (2) assumes the proposition $P$ exists at $t_1$ and $t_2$ with the same meaning/content so that a bet on $P$ at $t_1$ can be offset by a bet on $P$ at $t_2$.
      *   If conceptual change occurs (as described in 4), the meaning or truth conditions of the old proposition (e.g., "Miasma causes disease") might change or become undefined.
      *   If "Miasma" is revealed to be empty, what does a bet on "Miasma" pay out at $t_2$?
