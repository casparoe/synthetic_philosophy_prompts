      *   Specifically, step (2) assumes the later algebra *refines* the earlier one. Step (4) says the old hypotheses do *not* survive. These are contradictory assumptions about the relationship between the algebras.
      *   If the old propositions don't survive (4), then the Conservation Lemma (2) doesn't apply because there is no proposition $P$ in the later algebra that corresponds to the $P$ in the earlier algebra to buy back.
