  hey, so looking at the track record here, im gonna predict she votes **Out** on the cosmopolitanism case.

  heres why: the clearest pattern in her judgments isnt really about historical accuracy (since democracy and capitalism arent historically dominant for most of Western history either). instead, it looks like shes distinguishing between **foundational political/economic structures** vs. **modern ethical expansions**.

  when she says gender equality is a "modern universalist claim," shes signaling that values count as "Western" only if they define the West *against* the rest, not if they dissolve that boundary. cosmopolitanism is the ultimate boundary-dissolver. it claims obligations run to *everyone*, which directly contradicts the 19th-century idea of the West as a distinct civilizational bloc with specific interests. plus, since she already kicked out religious pluralism for not being "tradition," she likely sees moral cosmopolitanism as another recent liberal add-on rather than a core heritage item.

  regarding the rules, you hit the nail on the head with the **19th-century civilizational-boundary rule**. that fits perfectly. it explains why democracy/capitalism are in (they were used to define the West during the colonial/cold war era) but gender equality/pluralism are out (they blur the lines or contradict the historical hierarchy).

  but theres another rule that fits her data just as well: **the Negative Liberty Rule**.
  *   **In:** Individual liberty, free expression, free markets, democratic self-rule (all mostly about freedom *from* interference or state structure).
  *   **Out:** Religious pluralism (requires active accommodation), gender equality (requires positive restructuring), cosmopolitanism (requires positive global responsibility).
  she might just be filtering for "negative rights" vs "positive duties."

  to split those two rules apart (Civilizational Boundary vs. Negative Liberty), the best further case would be **Freedom of Movement (Open Borders)**.

  *   **Why it splits them:**
      *   **Negative Liberty/Free Market Rule:** Would say **In**. Free markets imply free labor mobility; individual liberty implies the right to move.
      *   **Civilizational-Boundary Rule:** Would say **Out**. Unrestricted migration threatens the distinct cultural/political boundary of the "West."

  if she votes In on open borders, shes running a pure economic-liberty script. if she votes Out (which i suspect), then the Civilizational-Boundary rule is the real driver, and cosmopolitanism doesnt stand a chance.

  hope that helps with the dataset! let me know what she says.
