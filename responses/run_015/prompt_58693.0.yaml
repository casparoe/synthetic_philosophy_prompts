      *   **Scenario:** Two exits, indistinguishable. Need to take the 2nd.
      *   **Constraint:** Driver forgets if she's passed an exit already upon arriving at one.
      *   **Payoffs:** Exit 1 (0), Exit 2 (4), Continue past both (1). (Standard values vary, but usually Exit 2 is best, Continue is okay, Exit 1 is worst).
      *   **Ex Ante Optimal:** Calculate probability $p$ of exiting at any given exit to maximize expected utility before starting. Usually involves a mixed strategy (e.g., continue with prob 2/3, exit with prob 1/3).
      *   **Ex Interim (On the spot):** Upon arriving at an exit, should I update beliefs? If I assume I'm following the plan, does the probability of being at Exit 1 vs 2 change? This leads to time inconsistency issues.
      *   **Core Conflict:** The plan made at the start (maximize overall success) feels suboptimal when standing at an exit (where exiting might seem better depending on belief updating).
      *   **Satire Angle:** Bureaucratic manual language treating cognitive failure as a procedural feature. Randomisation as "official dithering."

