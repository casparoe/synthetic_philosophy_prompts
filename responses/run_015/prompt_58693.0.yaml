      **Protocol for Indistinguishable Exit Nodes (The 'Absent-Minded' Clause)**

      **1.0 General Eligibility**
      1.1 This protocol applies solely to Honourable Motorists who, through no fault of recklessness, possess a verified inability to distinguish between Exit A and Exit B, coupled with a certified failure to recall whether Exit A has already been passed.
      1.2 Motorists capable of mere recollection are advised to use standard navigation procedures and disregard this document.

      **2.0 The Pre-Departure Pact**
      2.1 Before engaging the ignition, the Motorist and her Satnav must agree upon a fixed probability $p$ regarding exit behaviour.
      2.2 It is statistically optimal to continue past the first exit with a specific frequency, despite the intuitive allure of leaving immediately upon seeing *any* exit.
      2.3 This probability must be calculated whilst perfectly rational at home, not whilst confused on the carriageway.

      **3.0 Procedural Indecision**
      3.1 Upon approaching an exit, the Motorist shall not decide based on merit. Instead, she must consult a mental coin toss predetermined by the Pre-Departure Pact.
      3.2 To the outside observer, this shall resemble dithering. To the decision theorist, it is optimal mixed strategy compliance.
      3.3 The Satnav is authorised to sigh audibly if the Motorist attempts to calculate conditional probabilities whilst stationary at the junction.

      **4.0 Prohibition on Reconsideration**
      4.1 Although the Motorist at the exit feels uniquely positioned to judge the situation, she is reminded that she has felt this exact same way at the previous exit.
      4.2 Any urge to deviate from the pre-set probability constitutes a 'Time Inconsistency Error'.
      4.3 The Motorist must accept that her current self is too forgetful to overrule her past self, even though her current self feels perfectly lucid.

      **5.0 Identity of Decisions**
      5.1 The decision made at Exit A and the decision made at Exit B are legally the same decision, merely repeated.
      5.2 Consequently, changing one's mind at the second exit is not 'learning', but 'contradicting oneself under identical conditions'.

      **Troubleshooting FAQ**

      **Q: Why not simply remember which exit I passed?**
      A: This violates Clause 1.1. The puzzle assumes memory is a structural constraint, not a lapse in concentration. Treating forgetfulness as carelessness invalidates the insurance claim.

      **Q: But surely, if I am at an exit, it is more likely to be the second one?**
      A: Only if you assume you are likely to reach the second one. But you only reach the second one if you didn't exit at the first. Your presence there is evidence of your own prior compliance with the plan to continue. Do not let existence confuse probability.

      **Q: Is it not irrational to flip a coin when I know where I want to go?**
      A: It is irrational to want where you know you cannot reliably arrive. The coin is not a tool of confusion, but a bridge between the planner who knows the route and the driver who knows only the view.

      **Q: What if the Satnav suggests exiting now?**
      A: The Satnav represents your Ex Ante self. It knows the whole map. You only see the sliproad. Trust the planner, not the driver.

