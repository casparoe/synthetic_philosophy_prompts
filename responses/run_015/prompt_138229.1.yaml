      *   *Hájek's Triviality:* Hájek (1989) "Probabilities of Conditionals" shows that even for a *single* probability function, if the algebra is rich enough, you cannot assign a proposition to every conditional such that its probability equals the conditional probability. Why? Because there are more conditional probability functions than there are propositions in the algebra (cardinality argument) OR because the constraints on the proposition (being 1 when A is true, 0 when A and not-C, etc.) force it to be trivial.
