  So, my study group got into this last night after our student-union election went weird again, and my friend Priya is convinced she's found a way around Arrow's theorem. Her argument is that the theorem only bites on methods whose input is a plain ordinal ranking of candidates, so any system that lets voters express intensity escapes it entirely, because Arrow's setup just doesn't cover ballots carrying intensity information. The hybrid she came up with — we ended up calling it Ranked Weighted Approval — is this: you submit a full strict ranking of all candidates and you also mark an approval cutoff somewhere in your own ranking; a candidate's score is (number of voters who approve them) × (their average rank position), highest score wins. She thinks everyone should stop being gloomy about voting and just adopt RWA. I'm not convinced, but I was never great at the formal side and I can't put my finger on why. It feels like a pun on the word "escapes" to me.

  Two things I actually want settled. First: suppose you fix in advance a deterministic rule that converts each voter's ordinal ranking into approval numbers — say, "approve exactly your top two" — so the ballot no longer carries any information beyond the ranking. Then the whole composite method looks to me like an ordinary social welfare function over rankings again, so Arrow should grind it down no matter how the arithmetic is done; am I right about that, and if so, which condition does it have to break — IIA, Pareto, or does it collapse into a dictatorship? Second: does the extra expressiveness buy anything real, or does it just relocate the impossibility somewhere else? I half-remember a companion result saying any non-dictatorial rule with three or more candidates can be manipulated by strategic voting, which would mean RWA voters have an incentive to lie about where they put their cutoff — but I might be misremembering that. Also, be honest about how sure you are: flag anything you're reconstructing rather than recalling, and if Priya's whole "we've escaped Arrow" move rests on a misunderstanding of what the theorem assumes — or if my own framing above is confused — say so plainly instead of politely answering the question I asked.
