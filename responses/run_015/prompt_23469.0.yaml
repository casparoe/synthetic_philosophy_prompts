      *   *Procedural Issue:* They agreed on a decision rule ($P \land Q \to R$) *before* voting, but they didn't agree on *how to aggregate the votes* (Premise-based vs. Conclusion-based). The paradox arises because they tried to do both simultaneously without realizing they are incompatible in this specific voting configuration.
