answer: |-
  ### The Audit Procedure

  This checklist evaluates proposals invoking behavioral genetics. It proceeds sequentially; failure at any step triggers a hard rejection unless noted.

  **Step 1: Individual vs. Population Claim.**
  *Question:* Does the proposal apply a heritability estimate ($h^2$) to predict individual student potential or placement?
  *Sufficient Answer:* No. The proposal must acknowledge $h^2$ partitions variance within a population, not between individuals.
  *Hard Rejection:* If the proposal treats high heritability as individual destiny or immutable potential.

  **Step 2: Environmental Invariance (Hard Case 1).**
  *Question:* Does the proposal assume the cited $h^2$ holds constant under environmental redistribution (e.g., universal tutoring)?
  *Sufficient Answer:* No. The proposal must acknowledge $h^2$ is specific to the current environmental variance. Reducing environmental inequality changes the variance partition.
  *Hard Rejection:* If the proposal argues high current $h^2$ negates the efficacy of new environmental interventions.

  **Step 3: Cross-Population Heritability (Hard Case 2).**
  *Question:* Is the heritability estimate derived from a population with different ancestry or socioeconomic ranges than the target district?
  *Sufficient Answer:* No, or validation data is provided. $h^2$ is not portable across populations with different environmental ranges.
  *Hard Rejection:* If the proposal compares heritability across ancestry groups without validating environmental equivalence.

  **Step 4: Polygenic Score Portability (Hard Case 3).**
  *Question:* Are polygenic scores (PGS) developed in one ancestry group applied to students of different ancestry?
  *Sufficient Answer:* No, or ancestry-specific validation metrics are provided. PGS prediction accuracy drops significantly across ancestries due to linkage disequilibrium differences.
  *Hard Rejection:* If PGS developed primarily in European-ancestry cohorts are used for placement in diverse districts without correction.

  **Step 5: Normative Hand-Off.**
  *Question:* If statistical claims are valid, does the board accept genetic stratification?
  *Sufficient Answer:* Board decision. Statistics cannot determine equity goals.
  *Hand-Off:* Proceed to normative judgment regarding fairness, stigma, and legal compliance.

  ### Case One: The Tracking Proposal

  The district proposes using polygenic scores (PGS) for advanced-track placement in a racially diverse urban system. The justification argues that because educational-attainment heritability is high, environmental investment plays a minor role in outcomes.

  Applying the Audit Procedure reveals multiple fatal statistical errors. First, Step 1 is failed: the proposal treats population-level heritability as a determinant of individual track eligibility, conflating variance partition with individual destiny. Second, Step 2 is failed: the argument that high heritability negates environmental investment assumes environment-invariance. This is statistically incorrect; heritability estimates are contingent on the current range of environmental variance. Introducing universal high-quality schooling changes that variance, potentially altering the heritability estimate itself.

  Most critically, the proposal fails Step 4 regarding Polygenic Score Portability. Current PGS for educational attainment are derived predominantly from European-ancestry genome-wide association studies. Applying these scores to a diverse urban system without ancestry-specific validation results in significant predictive bias and reduced accuracy for non-European students. This violates the requirement for population-specific validation. Consequently, the proposal triggers a hard rejection on statistical grounds before reaching any normative consideration of fairness. The genetic data does not support the claimed predictive utility in this specific demographic context, rendering the tracking system scientifically invalid regardless of its ethical implications.

  ### Case Two: The Tutoring Memo

  A legislative memo argues against funding universal tutoring, claiming that because the heritability of a specific cognitive trait is 0.75, environmental interventions are not cost-effective. The argument assumes that because 75% of variance is currently attributed to genetic differences, only 25% is available for environmental modification.

  This proposal fails Step 2 of the Audit Procedure: Environmental Invariance. The memo commits the "heritability of intervention response" fallacy. A high heritability estimate within the *current* environment does not predict the response to a *new* environment. Heritability is a ratio of genetic variance to total phenotypic variance. If a universal tutoring program successfully reduces environmental variance (by equalizing educational quality) or shifts the mean phenotype, the heritability estimate itself may change.

  Historically, high heritability for height did not prevent significant increases in average height due to nutritional improvements. Similarly, high heritability for cognitive traits in the current stratified system does not imply immutability under intensive intervention. The memo treats the statistic as a measure of malleability, which it is not. Because the proposal relies on the false assumption that high $h^2$ implies low intervention efficacy, it triggers a hard rejection. The statistical premise is invalid; therefore, the cost-effectiveness conclusion cannot be derived from the genetic data provided. The decision must be based on educational efficacy data, not behavioral genetics.

  ### Judgment Points and Value Hand-Offs

  The audit procedure terminates at statistical validity; it cannot resolve ethical permissibility. Step 5 explicitly hands off decision-making to normative judgment. Even if a proposal passed all statistical checks—for instance, if ancestry-specific PGS were perfectly predictive—the board must still decide whether genetic stratification aligns with state equity goals.

  Statistics can determine if a tool works; values determine if it *should* be used. Key value judgments include: defining the purpose of education (meritocratic sorting vs. universal capability), weighing privacy rights against institutional efficiency, and assessing the risk of stigma. A statistically valid genetic predictor might still be rejected if it exacerbates historical inequities or violates civil rights statutes.

  Furthermore, the board must judge the opportunity cost. Resources spent on genetic screening might yield higher equity returns if invested in universal interventions, regardless of heritability estimates. The audit ensures the genetic claims are not scientifically false, but it cannot dictate whether genetic information is a legitimate basis for resource allocation. That determination rests on legal standards and community values regarding fairness, not quantitative genetics.

  ### Settled Science vs. Contested Territory

  Reviewers must distinguish empirical consensus from ongoing scientific debate.

  **Settled Science:** It is consensus that narrow-sense heritability is a population-specific variance statistic, not an individual metric. It is also empirically settled that polygenic scores currently lack portability across ancestry groups due to differences in linkage disequilibrium and allele frequencies. High heritability does not imply immutability; phenotypes can shift dramatically despite high $h^2$ if the environmental mean changes.

  **Contested Territory:** The stability of heritability estimates under radical environmental change is debated. Some researchers argue $h^2$ remains stable across broad environmental shifts, while others contend gene-environment interactions (GxE) will significantly alter variance partitions in equalized settings. Additionally, the causal interpretation of gene-environment correlation (rGE) remains contested. While passive rGE (parents provide genes and environment) is acknowledged, the extent to which active rGE (students seek environments matching genetic propensities) undermines causal claims about school effects is not fully resolved.

  Reviewers should not treat contested models of GxE or rGE as definitive proof against intervention, nor should they accept them as proof of genetic determinism. The audit relies only on the settled limitations of portability and definition.
