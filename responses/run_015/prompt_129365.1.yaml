      *   *Claim 5: The Empirical Claim.* "No experiment has ever demonstrated strong penetration, because every putative case can be explained by attention, by eye movements, or by what the subject was willing to say out loud."
          *   *Assessment:* This is the Firestone & Scholl (2016) position ("Cognition Does Not Affect Perception"). It's a strong claim. CP defenders (e.g., Siegel, Stokes, Lupyan) argue there *are* experiments that control for these confounds (e.g., color perception based on object recognition, emotional face perception).
