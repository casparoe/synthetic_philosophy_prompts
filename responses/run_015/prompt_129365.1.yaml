      *   *Claim 7: The Epistemological Moral.* "This matters because perception is supposed to be the neutral tribunal that checks our beliefs. If a belief can shape experience, experience cannot be independent evidence for it: a penetrated experience is evidentially inert with respect to the proposition that did the penetrating, so the belief simply launders itself through perception."
          *   *Assessment:* This is the "epistemic circularity" argument (often associated with Siegel). However, the claim that *all* penetrated experience is evidentially inert is too strong. Some philosophers argue for "downgrade" rather than "inertness." Also, if penetration is rare or specific, it doesn't invalidate all perception.
