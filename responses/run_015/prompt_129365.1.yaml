          *   *Verdict:* Reasonable simplification of the *dialectic*, but contentious as actual proofs.

      *   *Claim 3: Consensus.* "Everyone agrees these effects are real; the fight is only about how to describe them."
          *   *Assessment:* True. No one denies the radiologist finds the tumor. The debate is whether the *visual experience* changes or just the *interpretation*.
          *   *Verdict:* Accurate.

      *   *Claim 4: The Weak/Strong Distinction.* "But notice that in none of them does cognition add anything new to the scene: it only alters the strength or salience of features the stimulus already supplies. Call that weak penetration, and call genuine penetration — a case where a belief introduces content that isn't there — strong penetration."
          *   *Assessment:* **RED FLAG.** This is not standard terminology. The literature usually debates *whether* penetration exists (Yes/No), or distinguishes between *semantic* vs. *state* penetration, or *direct* vs. *indirect*. The idea that "adding new content" is required for "genuine" penetration is a stipulation that favors the modularist (impenetrability) view. Most CP defenders argue that changing the *salience* or *appearance* of existing features *is* penetration.
