      *   *Claim 6: The Conclusion.* "So we should accept the modularist verdict that the perceptual systems are informationally encapsulated and impenetrable."
          *   *Assessment:* This follows from the previous claims, but if Claim 4 is rigged, the conclusion is question-begging.
