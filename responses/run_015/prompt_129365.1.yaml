answer: |-
  Your suspicion is well-founded. The passage you are reading employs a rhetorical strategy that is common in introductory or polemical texts but would not pass muster in a specialized philosophy of mind journal. It leans heavily on **stipulative definitions** to make a contested empirical and philosophical debate look like a settled matter.

  Here is a claim-by-claim breakdown of the text, followed by an analysis of the specific distinctions and tests you asked about.

  ### Claim-by-Claim Analysis

  **1. "Perception is cognitively penetrable when what you believe, expect, or want reaches down and changes the experience itself..."**
  *   **Status:** **Accurate.**
  *   **Analysis:** This is the standard definition used by both sides (e.g., Zenon Pylyshyn vs. Susanna Siegel). Both defenders and detractors agree that for cognitive penetration (CP) to be real, it must affect *phenomenology* (what it is like to see), not just attention, eye movements, or post-perceptual judgment.
  *   **Trust:** High.

  **2. "The interesting cases are easy to list: a radiologist sees a tumour... a chess master sees a board... ambiguous figure is a duck."**
  *   **Status:** **Reasonable Simplification.**
  *   **Analysis:** These are the canonical examples discussed in the literature. However, presenting them as "cases of penetration" is already loading the dice. Modularists (like the author of this chapter) argue these are cases of *attention* or *judgment*, not perception. Defenders argue they are perception. Listing them as "interesting cases" of the phenomenon implicitly grants them status they haven't earned yet.
  *   **Trust:** Medium.

  **3. "Everyone agrees these effects are real; the fight is only about how to describe them."**
  *   **Status:** **Accurate.**
  *   **Analysis:** No one denies the radiologist finds the tumor. The debate is strictly about whether the *visual experience* differs or only the *interpretation*.
  *   **Trust:** High.

  **4. "Call that weak penetration, and call genuine penetration — a case where a belief introduces content that isn't there — strong penetration."**
  *   **Status:** **Misrepresentation / Stipulative Definition.**
  *   **Analysis:** **This is the pivot point of the deception.** There is no standard "Weak vs. Strong" distinction in the literature that maps onto "salience vs. new content."
      *   **The Trick:** By defining "genuine" (strong) penetration as *introducing content that isn't there*, the author defines it as something akin to hallucination. Since almost no one argues that cognition makes you hallucinate objects ex nihilo, the author has defined CP out of existence by fiat.
      *   **The Reality:** Defenders of CP argue that changing the *appearance* of existing features (e.g., making a color look more saturated, a distance look closer, or a scowl look angrier) *is* cognitive penetration. They do not need to claim cognition creates new objects to claim it penetrates perception.
  *   **Trust:** Low. This is where the argument is rigged.

  **5. "No experiment has ever demonstrated strong penetration, because every putative case can be explained by attention, by eye movements, or by what the subject was willing to say out loud."**
  *   **Status:** **One-Sided Empirical Claim.**
  *   **Analysis:** This mirrors the position of Firestone & Scholl (2016), who argue that all putative CP effects are confounds. However, this is not a consensus. Prominent researchers (e.g., Lupyan, Sterelny, Siegel) argue there are experiments controlling for these confounds (e.g., using binocular rivalry or reaction times that bypass report bias) that still show effects. Presenting this as a settled fact ("No experiment has ever...") is misleading.
  *   **Trust:** Low/Medium (Represents one side as fact).

  **6. "So we should accept the modularist verdict that the perceptual systems are informationally encapsulated and impenetrable."**
  *   **Status:** **Valid Inference from Rigged Premises.**
  *   **Analysis:** If you accept the definition in Claim 4 and the empirical claim in Claim 5, the conclusion follows. But since Claim 4 is stipulative, the conclusion is question-begging.
  *   **Trust:** Low.

  **7. "If a belief can shape experience, experience cannot be independent evidence for it... the belief simply launders itself through perception."**
  *   **Status:** **Philosophical Overstatement.**
  *   **Analysis:** This is the "epistemic circularity" argument (often associated with Susanna Siegel, ironically a defender of CP). However, most epistemologists argue that penetration leads to a *downgrade* in justification, not total *inertness*. Furthermore, even if some perceptions are penetrated, it doesn't mean *all* are, nor that perception as a whole loses its status as a tribunal.
  *   **Trust:** Medium (Plausible concern, too strong a conclusion).

  ---

  ### The Weak/Strong Distinction

  **Is this distinction standard in the literature?**
  No. The literature typically distinguishes between:
  1.  **Penetration vs. Attention:** Did cognition change the seeing, or just where you looked?
  2.  **Semantic vs. State Penetration:** Did conceptual knowledge affect the state, or just the content?
  3.  **Direct vs. Indirect:** Did cognition affect perception directly, or via memory/imagery?

  There is no widely accepted "Weak/Strong" taxonomy where "Strong" means "creating content ex nihilo." By introducing this terminology, the chapter creates a **straw man**. It sets the bar for "genuine penetration" so high (essentially hallucination) that no serious proponent of CP would jump over it, allowing the author to declare victory easily.

  **Does the chapter use it to settle the question by stipulation?**
  Yes. By defining "genuine penetration" as "adding content not in the stimulus," the author ensures that the modularist view wins by definition. If penetration requires magic, and perception isn't magic, then perception isn't penetrable. This ignores the actual claim of CP defenders: that cognition changes the *metric properties* or *phenomenal character* of the stimulus (e.g., making a gray patch look slightly blue, or a neutral face look slightly angry).

  ### The Concrete Test: The Hostile Face

  **Scenario:** A subject's belief that a face is hostile makes the face look hostile purely by amplifying the apparent severity of a scowl that is already visibly there.

  **1. Does that count as weak or strong on the chapter's taxonomy?**
  On the chapter's taxonomy, this is **Weak**.
  *   *Reasoning:* The text defines Weak as altering "the strength or salience of features the stimulus already supplies." The scowl is already there (supplied by the stimulus); the belief amplifies its severity (alters strength/salience).

  **2. Does the chapter need it to be weak for its conclusion to stand?**
  **Yes, absolutely.**
  *   *Reasoning:* The chapter's conclusion is that perceptual systems are "informationally encapsulated and impenetrable."
  *   If amplifying the severity of a scowl via belief counts as *penetration* (as most CP defenders argue it does), then the system is **not** encapsulated. The belief (cognition) successfully reached down and altered the experience.
  *   To maintain the conclusion that the system is *impenetrable*, the chapter *must* classify this effect as "Weak" and then assert that "Weak" doesn't count as "Genuine" penetration.
  *   **The Trap:** If you accept the standard definition (Claim 1), this *is* penetration. The chapter only avoids this by switching to the non-standard definition (Claim 4).

  ### The Epistemological Moral

  **Does the moral follow from the parts of the summary that are right?**
  **No, it is an overstatement.**

  Even if we grant the chapter's premises, the epistemological leap is too large for two reasons:

  1.  **Total vs. Partial Inertness:** The text argues: "If a belief *can* shape experience, experience *cannot* be independent evidence." This is a modal fallacy. The fact that perception *can* be contaminated in some instances does not mean it *is* contaminated in all instances, nor that it loses all evidential value. A thermometer that is sometimes influenced by the room temperature is still a thermometer; we just need to know when to trust it.
  2.  **Downgrading vs. Destroying:** In epistemology, the standard view (even among those who worry about CP, like Siegel) is that penetrated experiences suffer an **epistemic downgrade**, not total **inertness**. If you believe the face is hostile and therefore see it as hostile, your experience provides *less* justification for the belief than a neutral experience would, but it does not necessarily provide *zero* justification. The "laundering" metaphor suggests a complete wash, which is philosophically controversial.

  ### Summary Verdict

  **How much should you trust this chapter?**
  *   **On the definition of the debate:** Trust it. (Claim 1 is good).
  *   **On the examples:** Treat them as illustrative, not proof.
  *   **On the "Weak/Strong" distinction:** **Do not trust it.** This is a rhetorical device used to dismiss the opposing view without engaging with its actual arguments.
  *   **On the conclusion:** Treat it as the author's opinion, not the consensus verdict. The claim that "No experiment has ever demonstrated [penetration]" is a strong empirical claim that is actively disputed in current cognitive science and philosophy.

  **The Mistake You Located:**
  You correctly sensed that the chapter "leans on the expertise cases and then seems to define them out of the debate."
  *   It uses the radiologist/chess master cases to make the phenomenon sound plausible and interesting.
  *   It then uses the "Weak/Strong" distinction to classify those exact cases as "not genuine penetration."
  *   This allows the author to have it both ways: "Look at these cool effects (which imply cognition touches perception), but don't worry, they aren't *real* penetration (so modularism is safe)."

  A fairer summary would acknowledge that if cognition alters the salience of features (the "Weak" version), many philosophers *do* count that as cognitive penetration, and that is precisely where the live debate resides.
