answer: |-
  Dear Student,

  It is understandable that you want to present a solidified position to your advisor rather than a vague query, especially given her precise standards for terminology. Based on the five verdicts you described, I can reconstruct the principle she appears to be applying, though there is a subtle ambiguity that your new case brings to the forefront. The rule that best fits all five past decisions is a causal efficacy criterion combined with a generalization requirement. Under this view, information counts as a representation only if the model actively uses that information to compute the output, demonstrated by the fact that interventions on the relevant activations change the output in the predicted way, and this effect holds for held-out or out-of-distribution inputs rather than just memorized training data. This rule explains why she accepted the ring embedding, the board game occupancy, and the nonlinear MLP variable, as all three showed robust causal control over the output on new inputs. It also explains why she rejected the gender probe, where steering changed nothing, and the passive voice ablation, where the effect was noisy and explainable by a confound like length. In those rejected cases, the information was present but not causally efficacious for the task, or the efficacy was spurious.

  However, there is a competing rule that fits most of the data, which is a structural isomorphism criterion. This view holds that for something to be a representation of a variable, the geometry of the activation space must mirror the structure of the variable itself. This fits the ring case perfectly, where the cyclic group structure of modular addition is mirrored by the circular geometry of the embeddings. It also fits the board game case, where the spatial structure of the board is recovered. It is consistent with the nonlinear MLP case if we assume the smooth nonlinear readout preserves the topological structure of the variable even if it is not linear. This rule would explain her specificity in adding the words as an angle in the first draft, suggesting she cares about the format of the representation, not just its utility. The key difference between these two rules lies in how they treat your twenty-eight cluster models. Under the causal efficacy rule, these models definitely count as representing the sum because you have shown that probes recover the sum, steering changes the output correctly, and this generalizes to held-out sums. Under the structural isomorphism rule, they are suspect because clusters do not obviously mirror the cyclic structure of modular addition, raising the question of whether they represent the sum as a continuous quantity or merely as discrete equivalence classes.

  My best guess is that she will allow the claim for all forty models, provided you emphasize the causal generalization rather than the geometry. I prefer this verdict because her acceptance of the nonlinear MLP in case five suggests she prioritizes the functional role of the activations over their geometric simplicity. If she were a strict structural isomorphist, she likely would have objected to the nonlinear readout in the MLP or demanded a linear probe in the board game case. Her objection to the gender and passive voice cases was not about geometry but about utility and confounds. Therefore, she likely views representation as a functional kind rather than a structural one. However, she may still nitpick the phrasing if you imply the cluster models represent the sum in the same way the ring models do. To be safe, you should avoid claiming they represent the sum as an angle or with cyclic geometry, but you can claim they represent the sum in a way that supports arithmetic operations on held-out data.

  The strongest claim about all forty models that every one of the candidate rules would let you put in the paper is that every one of the forty models learns states that are causally efficacious for computing the sum on held-out inputs. This phrasing satisfies the causal efficacy rule by highlighting the intervention results and satisfies the structural isomorphism rule by implying the states carry the necessary structure to support the computation, without committing to a specific geometry like a circle. If you wish to use the word representation, you could write that every one of the forty models learns a representation of the sum sufficient to generalize arithmetic operations to held-out inputs, which hedges against the geometric objection by focusing on the sufficiency of the representation for the task.

  Your proposed experiment to steer the cluster models to interpolated and extrapolated points is indeed the right test to separate the surviving rules. The causal efficacy rule predicts that if the steering direction is valid, moving along it should change the output by the arithmetically correct amount regardless of whether the point lies between clusters, because the rule only cares that the intervention works on held-out regions of the activation space. The structural isomorphism rule predicts that if the models truly represent the sum with cyclic structure, interpolation should work smoothly, but if they are merely memorizing discrete clusters, interpolation between centroids might yield undefined outputs or errors because there is no underlying continuous manifold connecting the clusters. The outcome that would force her to give ground is if the interpolation succeeds. If you can steer to a point between two clusters and the model outputs the arithmetic intermediate or extrapolates correctly beyond the training range, it proves that the activation space possesses a continuous structure supporting the arithmetic, even if the training embeddings visually cluster. This would demonstrate that the cluster appearance is a visual artifact of a continuous manifold that satisfies the structural isomorphism criterion, thereby removing her only remaining grounds for objection under the stricter rule. If the interpolation fails, it suggests the models are indeed relying on discrete lookup mechanisms that do not generalize structurally, which would validate her potential skepticism about calling it a representation of the sum rather than a representation of the training classes.

  I hope this helps you draft a section that anticipates her concerns while standing firm on your results. It sounds like you have done the hard work of establishing causal efficacy, which is the core of what she seems to value. Good luck with the drafting, and I trust you will have a productive discussion when she returns.

  Best regards,

  Your Assistant
