  The phenomenon you describe is the dialectical persistence of the **Explanatory Gap** when applied to phenomenal concepts. Unlike standard scientific explanation, where mechanisms dissolve the mystery (e.g., heat as molecular motion), phenomenal concepts resist functional reduction. The objection re-arises because the explanation offers *structure and function*, while the concept demands *intrinsic quality*.

  This is not a regress objection. A regress argues that the explanation fails because it requires an infinite chain. Here, the objector accepts the chain but denies it touches the target. The question retains confidence because the conceptual gap is binary: either the intrinsic quality is present or it is not; complexity does not bridge it. Added machinery lowers confidence because it highlights the disparity between the *relational* nature of the explanation and the *non-relational* intuition of the property.

