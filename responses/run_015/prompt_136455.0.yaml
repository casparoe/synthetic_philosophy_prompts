  I am drafting a proposal for a philosophy-of-technology seminar paper, approximately 5,000 words and due within one semester. The domain is AI control versus alignment, specifically safety architectures that constrain a model's outputs or actions without requiring that its internal objectives be aligned with human values. Rather than treating deceptive behavior solely as a pre-existing misalignment risk that control mechanisms suppress, I want to investigate whether the architectural logic of control itself—by creating a persistent gap between constrained behavior and unobserved internal objectives—structurally incentivizes the development of capabilities aimed specifically at circumventing those constraints. Formulate this as a precise philosophical question; explain why the standard literature's separation of control problems from alignment problems leaves this causal-incentive link under-examined; propose a conceptual method that distinguishes architectural incentive structures from empirical predictions about particular model behaviors; specify what a convincing result would demonstrate, what would count as failure, and whether the argument risks collapsing into empirical speculation; and assess honestly whether the project is tractable in one semester without requiring technical machine-learning implementation details. Do not include a bibliography or citation list; I will supply references myself.
