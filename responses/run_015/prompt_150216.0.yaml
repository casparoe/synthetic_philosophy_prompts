answer: |-
  In the domain of socially transmitted belief—where an individual accepts a proposition based on testimony or institutional authority without direct access to the underlying evidence—the epistemic regress problem takes on a distinct sociological character. The regress is not merely a logical abstraction but a practical limitation: the chain of justification extends beyond the individual's cognitive horizon into the history and structure of the community.

  **Foundationalism and the Social Stopper**
  A foundationalist account seeks to halt the regress by anchoring justification in basic beliefs that do not require further inferential support. In the context of social transmission, the central question is whether the absence of access to the original evidential base undermines the recipient's justification. Classical reductionist foundationalism (e.g., Hume) argues that testimony is not itself a foundation; rather, belief in testimony must be inferred from the recipient's own basic beliefs (e.g., perceptual beliefs that the speaker is reliable). Under this view, the lack of access to the original evidence is problematic. If the individual cannot trace the testimony back to their own foundational observations of the source's reliability, justification is undermined.

  However, non-reductionist foundationalism (e.g., Reid or Burge) offers a more robust solution for this domain. It posits that the act of receiving testimony can itself generate a foundational belief. Here, the basic belief is not about the world directly, but about the communicative act (e.g., "X asserted that P"). On this account, testimony serves as a substitute foundation. The regress stops at the individual's reception of the assertion, granted a prima facie right to trust unless defeaters are present. Thus, for the non-reductionist, the absence of access to the original evidence does not undermine justification, because the social transaction itself provides the normative stopper. The justification is immediate, grounded in the normative status of the testimonial exchange rather than the historical chain of evidence.

  **Infinitism and the Distributed Chain**
  Infinitism rejects the possibility of a foundational stopper, arguing that justification requires an infinite, non-repeating chain of reasons. Applied to social transmission, the infinitist must locate this infinite chain within the social network rather than the individual mind. The justification for the belief is not found in the recipient's mental states alone but in the availability of further reasons within the community. If an expert tells a layperson that climate change is anthropogenic, the layperson's justification depends on the existence of an endless chain of supporting reasons held by the scientific community (data supports models, models support predictions, etc.).

  The critical issue for infinitism here is the agent's inability to traverse this chain. Since no individual can cite infinite reasons, the infinitist must argue that reasons need only be *available* to the agent, not *possessed* occurrently. In a social context, "availability" means the reasons exist within the institutional structure and can be accessed if challenged. However, this creates a distinct problem regarding epistemic attribution. If the chain exists only collectively, it is unclear whether the *individual* is justified or merely the *collective*. The infinitist risks conflating the justification of the belief's content (secured by the network) with the justification of the agent's holding of that belief (which requires a personal relation to the chain). If the agent cannot access the chain due to technical complexity or institutional opacity, infinitism struggles to explain how the regress is satisfied for that specific agent, potentially rendering socially dependent belief unjustified despite its reliability.

  **Assessment of Epistemic Dependence and Shared Weakness**
  In assessing which view handles epistemic dependence more plausibly, non-reductionist foundationalism holds an advantage. It aligns better with the phenomenology and practice of relying on experts. It acknowledges that individuals are entitled to rely on social sources without verifying the infinite or deep historical chains behind them. Infinitism, while accurately describing the open-ended nature of scientific or legal reasoning, places a burden of "potential access" on the individual that is often illusory in highly specialized societies. Foundationalism grants the dependent agent a status of justification that infinitism makes contingent on a social infrastructure the agent may not be able to navigate.

  However, both views share a structural weakness when applied to collective cognition: the **Individual Access Constraint**. Both foundationalism and infinitism ultimately evaluate justification by examining the relation between the *individual subject* and the reasons (whether as a foundation or a chain). In complex collective cognition (e.g., global supply chain logistics or climate modeling), the "knower" is often the system itself; no single individual possesses the foundational evidence (foundationalism) nor can access the full chain of reasons (infinitism). Both theories struggle to account for cases where justification is an emergent property of the network that does not supervene on the epistemic state of any single node. They force a distribution of collective knowledge back into the architecture of individual justification, which may be the wrong unit of analysis.

  **Conclusion**
  Coherentism, understood as a holistic alternative, potentially avoids this shared weakness. By defining justification as a matter of mutual support among a web of beliefs, coherentism can treat the social institution itself as the web. An individual's belief is justified if it coheres with the institutional output, without requiring the individual to access a specific foundation or trace a specific chain. This allows justification to reside in the systemic relations rather than the individual's access, better accommodating the reality of distributed cognitive labor.
