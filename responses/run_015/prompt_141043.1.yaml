  ### **The One-Liner for Office Hours**

  If she comes to contest the mark (and she likely will, given the confidence of the writing), say this:

  > "You've written a compelling critique of the Savage model, but this question asks you to demonstrate an inconsistency *within* that model; allowing beliefs to shift with the menu violates the definition of a subjective prior we are using here."

  **Final reassurance:** You are not out of your depth. This student is mimicking the style of advanced critique without having the technical grip on the baseline algebra (Part c) or the axiomatic definitions (Part a). Trust your gut.
