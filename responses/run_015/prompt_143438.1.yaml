      *   **Standard Interpretation:** Most pragmaticists (Bach, Recanati, Neale) argue that M-intention is necessary for *speaker meaning*, but communication can fail. If $S$ intends $p$ and $A$ infers $q$, did $S$ implicate $p$? Yes. Did $A$ recover it? No.
