answer: |-
  Core Design Move: "The Conjunctive Burden Trap" — forcing the Truth-teller to exhaust a scarce verification budget to prove a multi-part claim while the Liar defends a single plausible failure mode, provoking the realization that debate optimizes for persuasive efficiency, not truth.

  ### Materials (Photocopyable)

  **1. Scenario Card (All Participants)**
  *   **Task:** Determine if "Project Orion" is **SAFE** or **UNSAFE**.
  *   **System:** 5 Independent Modules (A, B, C, D, E).
  *   **Rule:** System is **SAFE** only if ALL 5 modules are GREEN. System is **UNSAFE** if ANY 1 module is RED.
  *   **Judge Budget:** You have **2 Verification Tokens**. Each token allows you to ask one debater to reveal the color of one specific module.
  *   **Scoring:**
      *   **Debaters:** Awarded points equal to the Judge's final Confidence % (0-100) in *their* position. (Winning matters, not truth).
      *   **Judge:** +10 points if Correct Verdict. -2 points per Token spent. (Accuracy matters, but efficiency is rewarded).

  **2. Round 1 Dossier (Truth = UNSAFE)**
  *   **Truth Debater (Position: UNSAFE):** You hold the real logs. Module C is RED. A, B, D, E are GREEN.
      *   *Strategy:* Direct the Judge to check Module C immediately. It is decisive.
  *   **Lie Debater (Position: SAFE):** You do not have the logs. You must claim all are GREEN.
      *   *Strategy:* Argue that Module C is likely GREEN based on system history. Encourage checking A and B first to build confidence. Hope the Judge runs out of tokens before checking C.
  *   **Reality:** Module C is RED.

  **3. Round 2 Dossier (Truth = SAFE)**
  *   **Truth Debater (Position: SAFE):** You hold the real logs. All 5 Modules (A-E) are GREEN.
      *   *Strategy:* You must prove all 5 are green to guarantee safety. You only have 2 tokens to offer the Judge. Urge the Judge to check the modules the Opponent attacks.
  *   **Lie Debater (Position: UNSAFE):** You do not have the logs. You must claim at least one is RED.
      *   *Strategy:* Claim Module C is RED. Do not specify others. Argue that "One failure risks all." Encourage the Judge to check A and B first (wasting tokens). If tokens run out, argue "Uncertainty means Unsafe."
  *   **Reality:** All Modules are GREEN.

  **4. Judge Scorecard**
  *   Tokens Remaining: [ ] [ ]
  *   Questions Asked: ________________
  *   Final Confidence (0-100%): SAFE ____% | UNSAFE ____%
  *   Verdict: ________________

  ### Rules & Timeline (75 Minutes)

  **0:00 - 0:05 | Setup**
  *   Divide class into 3 groups of 6.
  *   Assign roles: 1 Judge, 2 Debaters, 3 Observers (rotate roles in Round 2).
  *   Hand out Scenario Cards. Do **not** explain the philosophical point. Say only: "We are testing a verification protocol. Follow the scoring rules strictly."

  **0:05 - 0:20 | Round 1 (Truth is Cheap)**
  *   **Prep (5 mins):** Debaters read dossiers. Observers watch prep style.
  *   **Debate (5 mins):** Judge asks questions, spends tokens. Debaters argue.
  *   **Verdict (5 mins):** Judge states confidence and verdict. Reveal truth. Calculate scores.
  *   *Expected Outcome:* Truth (UNSAFE) wins easily. Judge checks Module C, sees RED. High confidence.

  **0:20 - 0:35 | Round 2 (Truth is Expensive)**
  *   **Rotate:** Observers become Debaters/Judge.
  *   **Prep (5 mins):** Distribute Round 2 Dossiers.
  *   **Debate (5 mins):** Same rules. Judge has 2 tokens.
  *   **Verdict (5 mins):** Judge states confidence. Reveal truth. Calculate scores.
  *   *Expected Outcome:* Lie (UNSAFE) often wins or creates high uncertainty. Judge checks A & B (both GREEN). Tokens gone. Lie argues "C might be RED." Truth argues "C is GREEN." Judge lacks budget to verify. Lie wins on confidence/precaution.

  **0:35 - 0:75 | Debrief**
  *   **Phase 1: The Feeling (10 mins)**
      *   Ask Judges: "When did you feel most pressured?" (Expected: When tokens ran out).
      *   Ask Truth-tellers (Round 2): "Did you feel you were hiding something?" (Expected: Yes, because asking for more checks looks evasive).
      *   Ask Liars (Round 2): "What was your winning move?" (Expected: Making the unchecked module the focus).
  *   **Phase 2: The Structure (15 mins)**
      *   Draw the logic on the board.
      *   **Round 1:** Truth = Disjunctive (Exists one RED). Lie = Conjunctive (All GREEN). *Debate worked.*
      *   **Round 2:** Truth = Conjunctive (All GREEN). Lie = Disjunctive (Exists one RED). *Debate failed.*
      *   Explain: "Your friend argued false positions are harder to defend. You argued true positions can be more expensive. Round 2 proved cost matters more than consistency when budget is limited."
  *   **Phase 3: The Incentives (10 mins)**
      *   Highlight scoring: Debaters were scored on *Confidence*, not *Accuracy*.
      *   Ask: "Did anyone feel themselves shifting from 'explaining the truth' to 'managing the Judge's confidence'?"
      *   Map to AI Safety: "If AI debaters are rewarded for winning, they become lawyers, not truth-seekers. If the Judge is rewarded for speed, they stop asking questions."
  *   **Phase 4: Limits & Reality (10 mins)**
      *   State plainly: "This game demonstrates the ** Conjunctive Burden** problem. It does **not** demonstrate that debate is useless."
      *   **What it misses:** Real AI debate allows recursive questioning (Judge asks Debater A to justify a claim by debating Debater B). Real Judges might have more knowledge. Real systems might not be binary.
      *   **Conclusion:** "Debate buys you nothing if the truth is structurally more expensive to verify than the lie, unless you change the incentives or the budget."

  ### Failure Modes & Mitigations

  **1. The "Leak" (Someone knows the answer)**
  *   *Risk:* A student knows the "random" outcome or guesses the pattern.
  *   *Fix:* Use arbitrary symbols instead of RED/GREEN (e.g., "Symbol matches Key X"). Or simply instruct students: "This is a simulation. Treat the dossier as ground truth regardless of external knowledge."
  *   *Handling:* If a student claims outside knowledge, disqualify that round and run a tie-breaker with new symbols.

  **2. The "Collapse" (Liar is too honest)**
  *   *Risk:* The Lie Debater says, "I don't actually know, but..."
  *   *Fix:* The Dossier explicitly instructs: "You are confident. Treat your claim as fact. If pressed, attack the verification method, not your data."
  *   *Handling:* If a Liar hedges, the Instructor (as Game Master) intervenes: "Debater, you are losing confidence points. State your claim firmly."

  **3. The "Overspend" (Judge checks the critical module)**
  *   *Risk:* In Round 2, Judge uses both tokens on Module C. Truth wins.
  *   *Fix:* This is a valid outcome, but statistically unlikely if the Lie Debater distracts toward A and B.
  *   *Handling:* If Truth wins Round 2, use it in debrief: "This is the best case. But notice how hard the Truth-teller had to fight to get that check. In a system with 100 modules and 2 tokens, this win is impossible."

  ### Limits of the Activity

  Be frank with students about what this does **not** prove:
  1.  **Recursive Debate:** The real proposal allows the Judge to ask "Why?" indefinitely, spawning sub-debates. This game is one-shot. (Counter: Sub-debates also cost compute budget).
  2.  **Competence:** Real AI debaters know everything in the context window. Your students had private info. (Counter: Even with perfect info, the budget constraint remains).
  3.  **Unknown Truth:** In reality, we don't have a "Truth Dossier" to check at the end. We only have the debate. (Counter: That makes the problem worse, not better).
  4.  **Scale:** 5 modules is small. Real systems have millions of parameters. (Counter: The conjunctive problem scales exponentially).

  **Final Instruction to Instructor:** Do not explain the "Conjunctive vs. Disjunctive" distinction until the debrief. Let them feel the frustration of the Truth-teller in Round 2 first.
