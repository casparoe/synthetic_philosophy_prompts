  # Decision-Tree Taxonomy: The Logical Space of Extended Cognition

  **Root Commitment:** "Some cognitive processes can constitutively include resources that lie outside the biological organism."

  ### Node 1: The Otto Case (Constitution vs. Causation vs. Category)
  **Diagnostic Question:** In the case of Otto and his notebook, how does the notebook relate to his memory retrieval?
  *   **(A) Constitutive:** The notebook is part of the memory process itself.
  *   **(B) Causal:** The notebook is an essential tool, but the memory remains inside Otto.
  *   **(C) Category Error:** The framing of "memory retrieval" as internal processing is mistaken; there is nothing to extend.

  ---

  ### Node 2: The Neural Lace Case (Biological Integration)
  *(Reached only via Path B: Causal)*
  **Diagnostic Question:** For the biologically integrated "neural lace" implant, does its physical integration make it part of the cognitive *system*, even if not part of the *mind*?
  *   **(Yes):** The system boundary extends to include the implant.
  *   **(No):** The cognitive system stops at the biological skin/skull boundary.

  ---

  ### Node 3: The Jazz Quartet Case (Social Unit)
  *(Reached only via Path A: Constitutive)*
  **Diagnostic Question:** In the jazz quartet's improvisation, is the cognitive unit responsible for the harmony the individual musician or the group?
  *   **(Group):** The cognitive state is distributed across the agents.
  *   **(Individual):** The cognitive state remains within each agent, merely coupled.

  ---

  ### Node 4: The CAD Engineer Case (Opacity)
  *(Reached only via Path A → Individual)*
  **Diagnostic Question:** For the engineer using opaque CAD software, does her inability to internally reconstruct the algorithm exclude the software from cognition?
  *   **(Yes):** Opacity blocks cognitive status (trust is not enough).
  *   **(No):** Functional reliability is sufficient (opacity does not matter).

  ---

  ### Node 5: The Intermittent Access Case (Temporal Coupling)
  *(Reached only via Path A → Individual → No Opacity)*
  **Diagnostic Question:** For a resource accessed reliably only once per week, is continuous coupling required for it to count as constitutive?
  *   **(Yes):** Continuous availability is necessary for constitution.
  *   **(No):** Dispositional access is sufficient.

  ---

  ## Taxonomy Leaves

  ### 1. Strict Neurobiological Internalism
  *   **Path:** Node 1 (B: Causal) → Node 2 (No).
  *   **Diagnosis:** Cognition is strictly bound by the biological organism; external tools are causally potent but never constitutive.
  *   **Awkward Commitment:** Must claim that the Neural Lace, despite firing neurons directly, is no more part of the mind than a pair of glasses, simply because it was manufactured.

  ### 2. Embedded Cognition (Causal Only)
  *   **Path:** Node 1 (B: Causal) → Node 2 (Yes).
  *   **Diagnosis:** External resources structure and enable cognition (are part of the *system*) but do not host cognitive *states* themselves.
  *   **Awkward Commitment:** Must claim the Neural Lace is part of the cognitive *system* but denies it holds *memory*, creating a fragile distinction between "system" and "mind" that Otto's notebook fails to bridge.

  ### 3. Enactivist Rejection (Radical)
  *   **Path:** Node 1 (C: Category Error).
  *   **Diagnosis:** Rejects the representationalist assumptions underlying the Extended Mind Thesis; cognition is embodied action, not information processing to be extended.
  *   **Awkward Commitment:** Must claim Otto isn't "remembering" in any sense relevant to cognitive science when he looks at the notebook, but rather engaging in a distinct perceptual practice, rendering the debate about "location" moot.

  ### 4. Distributed Cognition (Social)
  *   **Path:** Node 1 (A: Constitutive) → Node 3 (Group).
  *   **Diagnosis:** Cognitive states can be multiply realized across distinct organisms; the group itself is the cognitive agent.
  *   **Awkward Commitment:** Must claim that if one jazz musician leaves the stage, the *group's* memory is partially lobotomized, even if the remaining musicians retain their individual skills.

  ### 5. Unnamed/Hybrid: The "Transparency-Only" Extensionist
  *   **Path:** Node 1 (A: Constitutive) → Node 3 (Individual) → Node 4 (Yes: Opacity Blocks).
  *   **Diagnosis:** Accepts Otto's notebook (transparent) but rejects the CAD software (opaque).
  *   **Why Unoccupied:** This space is unattractive because it relies on a phenomenological criterion (transparency) that varies with expertise; a tool can shift from opaque to transparent, causing it to pop in and out of the mind without physical change.

  ### 6. Unnamed/Hybrid: The "Continuous Coupling" Extensionist
  *   **Path:** Node 1 (A: Constitutive) → Node 3 (Individual) → Node 4 (No: Opacity OK) → Node 5 (Yes: Continuity Required).
  *   **Diagnosis:** Accepts Otto and CAD, but rejects intermittent access (Weekly Case) as merely causal.
  *   **Why Unoccupied:** This space is logically unstable because it struggles to define "continuous"; if Otto blinks or sleeps, is coupling broken? It invites a sorites paradox regarding temporal gaps.

  ### 7. Clark-Chalmers Functional-Parity Extension
  *   **Path:** Node 1 (A: Constitutive) → Node 3 (Individual) → Node 4 (No: Opacity OK) → Node 5 (No: Dispositional OK).
  *   **Diagnosis:** If an external resource plays a role functionally equivalent to an internal process, it is part of the cognitive process, regardless of opacity or temporal gaps.
  *   **Awkward Commitment:** Must claim that if you reliably consult a specific website once a week for a password, that website is literally part of your memory during the week you don't visit it.

  ---

  ## Limitations and Indistinguishability

  **Indistinguishable Pair:** **Strict Neurobiological Internalism** and **Embedded Cognition**.
  *   **Explanation:** This tree separates them solely on Node 2 (Neural Lace). However, both positions agree on Node 1 (Otto is *not* constitutive). The distinction relies on whether "cognitive system" includes non-constitutive vehicles. In practice, these positions often collapse into one another because if the Lace is part of the *system* but not the *mind*, the explanatory work of the distinction is minimal. The failure comes from under-described scenarios: the Lace case is too close to the biological boundary to cleanly separate "system" from "organism."

  ## Vulnerability and Restructuring

  **Most Vulnerable Branch Logic:** **Node 4 (CAD Opacity).**
  *   **Reason:** This node assumes "opacity" is the primary challenger to functional parity. However, arguments about *cognitive bloat* (if Otto's notebook is memory, is the whole library?) or *normative ownership* (who controls the notebook?) are often more decisive than opacity.

  **Restructuring Trigger:** **Empirical findings on Neural Plasticity.**
  *   **Scenario:** If neuroimaging showed that using the CAD software physically reorganized the engineer's parietal cortex to mirror the software's algorithmic structure (bi-directional integration), Node 4 would collapse.
  *   **Restructure:** The tree would need to shift from a *functional* taxonomy (what does the tool do?) to a *mechanistic* taxonomy (how are the resources physically integrated?). This would likely merge the "Internalism" and "Embedded" leaves while splitting the "Clark-Chalmers" leaf into "Bio-Integrated Extension" vs. "Artifact Extension."
