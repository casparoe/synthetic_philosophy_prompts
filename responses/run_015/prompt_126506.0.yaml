      *   *Physicalist 2D View:* They accept the 2D framework but argue that the primary intension of "consciousness" picks out a functional role in some worlds, but in the actual world, it picks out the physical state. Or, they argue that the primary intension of "consciousness" is empty or rigid in a way that blocks the zombie inference.
