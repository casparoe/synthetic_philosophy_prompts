answer: |-
  **Game: Substrate Shock**

  **Setup:** 21 students divided into 3 tables (7 per table). Each table gets 1 deck of cards, 1 roll of tape, 1 pair of scissors.
  **Goal:** Build the tallest free-standing tower.

  **Hidden Conditions (The Substrate):**
  *   **Table Alpha (Functioning):** Open collaboration. Anyone may touch materials. Decisions by majority vote.
  *   **Table Beta (Purged):** 3 "Admins" hold the tape/scissors. 4 "Workers" only fold cards. **Rule:** At Phase 3, the Facilitator permanently removes the 3 Admins from the game. Workers must continue without them.
  *   **Table Gamma (Hollow):** 1 "Leader" holds all materials. Others cannot speak to each other. Workers can only build if the Leader hands them a card. No autonomous action allowed.

  **Phases:**
  1.  **Brief (10 min):** Explain goal. Distribute role cards secretly. Do not reveal table differences.
  2.  **Construction I (15 min):** Tables build under hidden rules.
  3.  **Intervention (5 min):** Identical shock. Facilitator removes 30% of each tower's base cards and confiscates 50% of remaining tape from ALL tables.
  4.  **Construction II (20 min):** Rebuild/Stabilize under remaining rules (Beta remains without Admins).
  5.  **Debrief (25 min):** Measure, score, reveal analogues.

  **Scoring:**
  *   **Height:** 1 point per cm standing after Phase 4.
  *   **Collapse:** If the tower falls completely during Phase 4, score = 0.
  *   **Stability Bonus:** +10 points if the tower stands untouched for 2 minutes post-build.
  *   **Currency:** Participation grade based on points relative to class average.

  **Debrief Mapping:**
  Reveal the real cases only now.
  *   **Alpha = Kosovo (1999):** Existing Yugoslav institutions remained functional enough to administer aid despite bombing. The "state machine" survived the shock.
  *   **Beta = Iraq (2003):** The bureaucracy (building) remained, but De-Baathification purged the knowledgeable personnel (Admins). The structure stood, but capacity vanished, causing insurgency/chaos.
  *   **Gamma = Libya (2011):** Gaddafi deliberately hollowed institutions to prevent coups, ruling through patronage (Leader bottleneck). When the regime fell (Intervention), no institutions existed to coordinate reconstruction. Fragmentation was inevitable.

  **Prediction of Failure:**
  Table Gamma will break the rules. Students resent being silenced or bottlenecked. They will likely collude to share tape secretly, masking the "hollow state" effect. You must enforce the "no talking" rule strictly, or the simulation will falsely suggest Libya had latent cooperative capacity.

  **Limitation Note:**
  This game isolates internal state capacity but ignores **external post-intervention commitment**. In reality, the interventions were not identical. Kosovo had a long-term UN administration (UNMIK) to hold the peace. Iraq had a massive Coalition Provisional Authority. Libya had "leading from behind" with no boots on the ground to disarm militias. The game implies Libya failed solely due to domestic structure, ignoring how lack of international peacekeeping ensured collapse.
