answer: |-
  ### 1. Exam Question

  **Question 4: The Compound Vase (20 Marks)**

  Consider a crystal vase equipped with two distinct mechanisms:
  1.  **Internal Fink:** A nanotech shock-absorber embedded in the glass lattice. Upon detecting the strike stimulus ($S$), it instantly reconfigures the lattice to become non-brittle before shattering can occur.
  2.  **External Mask:** A thick layer of protective foam wrapping the exterior. This prevents the force of a strike from transferring to the glass, though the glass's lattice remains unchanged.

  Assume the vase is struck ($S$ occurs) but does not shatter ($M$ does not occur).

  Write a concise essay (~800 words) addressing the following:
  1.  Apply the **Simple Conditional Analysis (SCA)** to this case. Does the vase possess the disposition to shatter? Why does the analysis succeed or fail?
  2.  Apply **Lewis's Reformed Account (CCA)**. Does holding the causal basis fixed resolve the issues raised by the internal fink and the external mask?
  3.  Apply **Johnston's Intrinsic Defense**. How does the distinction between intrinsic and extrinsic properties handle the foam versus the nanotech?
  4.  **Verdict:** Does this compound case kill all three views, or does it save one? Explain why the survival of the "intrinsic" intuition matters for the metaphysics of scientific properties.

  ***

  ### 2. Model Answer (~600 Words)

  The compound vase case presents a stress test for dispositional accounts by combining a finkish removal of the causal basis with a masking of the stimulus. To determine if the vase retains the disposition of fragility, we must evaluate how each account handles the failure of manifestation ($M$) despite the stimulus ($S$).

  **Simple Conditional Analysis (SCA)**
  The SCA defines fragility as: $x$ is fragile iff if $x$ were struck, $x$ would shatter. In this case, $S$ occurs, but $M$ does not. The internal fink ensures the lattice changes before shattering; the external foam ensures the force never reaches the lattice. Consequently, the counterfactual "If struck, it would shatter" is false. SCA verdict: The vase is not fragile.
  This fails because it conflates the *possession* of a property with the *success* of a manifestation. The foam case intuitively shows an object can be fragile even if prevented from breaking. The fink case shows an object can be fragile even if it loses fragility upon striking. SCA cannot distinguish between lacking a disposition and being prevented from manifesting it.

  **Lewis's Reformed Account (CCA)**
  Lewis amends the conditional to: $x$ is fragile iff if $x$ were struck and *retained its causal basis*, $x$ would shatter.
  Regarding the **Internal Fink**: Lewis's clause "retained its causal basis" neutralizes the fink. We evaluate the closest world where the vase is struck *and* the lattice does not reconfigure. In that world, it shatters. Lewis successfully recovers the intuition that the vase was fragile prior to the strike.
  Regarding the **External Mask**: Lewis's account struggles here. Even if we hold the intrinsic basis (lattice structure) fixed, the foam is still present in the counterfactual scenario. The strike occurs, the basis is retained, but the foam absorbs the impact. $M$ still does not occur. The conditional remains false. Lewis solves the fink but fails the mask, as his account remains sensitive to extrinsic interferers that block the causal chain.

  **Johnston's Intrinsic Defense**
  Johnston argues dispositions are intrinsic properties. Extrinsic conditions (like foam) cannot remove an intrinsic property.
  Regarding the **External Mask**: Since the foam is extrinsic to the glass lattice, it masks the manifestation but does not remove the disposition. Johnston correctly verdicts that the vase remains fragile.
  Regarding the **Internal Fink**: This is trickier. If the shock-absorber is embedded in the lattice, it is part of the intrinsic structure. When $S$ occurs, the intrinsic structure changes (the basis is lost). Johnston agrees that if the intrinsic basis is lost, the disposition is lost. However, Johnston maintains the disposition existed *before* the strike. Unlike SCA, Johnston allows the disposition to exist even if the intrinsic structure is volatile, provided we assess the property at time $t$ prior to $S$.

  **Verdict and Metaphysical Stakes**
  This compound case kills SCA entirely. It partially wounds Lewis (saves against finks, fails against masks). It best supports Johnston's Intrinsic Defense, provided we treat the disposition as a property existing at $t_1$ before the fink activates.
  The survival of the Intrinsic view matters for scientific realism. If dispositions are reducible to conditionals (SCA/Lewis), then extrinsic interferers (masks) negate the property itself. This implies properties are not stable features of objects but relations to environments. By securing dispositions as intrinsic (Johnston), we preserve them as genuine causal powers residing in the object's structure, independent of extrinsic luck. Science requires stable properties to explain behavior; the intrinsic defense ensures fragility belongs to the glass, not the absence of foam.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Moves × 4 Marks)**

  | Move | Required Analytical Content | Common Botch (How to lose marks) | A vs. B Distinction |
  | :--- | :--- | :--- | :--- |
  | **1. SCA Application** | Must identify that SCA verdict is "Not Fragile" because the conditional ($S \rightarrow M$) is false. Must note this contradicts intuition (especially re: mask). | **Botch:** Claims SCA works because the vase didn't break. Or confuses the fink/mask mechanics. | **B:** States SCA fails. **A:** Explains *why* it fails (conflates possession with manifestation). |
  | **2. Lewis on Fink** | Must explain Lewis's "retain basis" clause fixes the fink problem (we imagine the basis stays fixed). Verdict: Fragile. | **Botch:** Says Lewis fails the fink. Or recites the wire example without applying the "retain basis" clause to the vase. | **B:** Says Lewis fixes it. **A:** Explicitly links "retain basis" to the nanotech reconfiguration failure. |
  | **3. Lewis on Mask** | Must identify Lewis *fails* the mask. Even with basis fixed, the foam prevents $M$. Conditional is still false. | **Botch:** Claims Lewis solves masks too. Or treats foam as a fink. | **B:** Notes Lewis has trouble. **A:** Explains the causal chain is blocked extrinsically despite intrinsic basis. |
  | **4. Johnston's Intrinsic** | Must distinguish Internal (intrinsic change) vs. External (extrinsic mask). Foam doesn't remove disposition; Nanotech changes basis at $t_2$. | **Botch:** Treats internal shock-absorber as extrinsic. Or claims Johnston denies the fink removes the property. | **B:** Applies intrinsic label. **A:** Nuances the timing (property exists at $t_1$ before basis change). |
  | **5. Verdict & Stakes** | Must argue Intrinsic view survives best. Must explain *why intrinsicness matters* (properties vs. relations/realism). | **Botch:** "Johnston wins" with no justification. Or ignores the "why it matters" prompt requirement. | **B:** Picks a winner. **A:** Connects winner to scientific realism/stable causal powers. |

  **Grading Note:** An **A** answer seamlessly integrates the "Internal vs. External" distinction into the evaluation of Lewis vs. Johnston. A **B** answer treats the three theories as isolated lists without comparing their specific vulnerabilities to the *compound* nature of the case.
