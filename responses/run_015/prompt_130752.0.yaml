  # SEMINAR 1: THE TIER LIST OF LIFE
  **Task:** Argue the ordering before anyone defines 'life'.

  ## TIER 1: VITAL PARADIGMS (85–100)
  *   **Mule (100):** Sterile but metabolically autonomous, it embodies the standard vertebrate template.
  *   **Tardigrade (Active) (95):** Metabolically robust and behaviourally complex, it fails only on reproductive independence.
  *   **Slime Mould (90):** Solves mazes without neurons, proving agency need not resemble animal cognition.

  ## TIER 2: SUSPENDED AGENCY (60–84)
  *   **Synthetic Bacterium (85):** Minimal genome yet self-dividing, it shows life survives drastic architectural simplification. **[BIO UNCERTAINTY]**
  *   **Immortalised Cell Line (80):** Metabolically active but ecologically detached, it persists only via human intervention.
  *   **Bacterial Spore (65):** Cryptobiotic inertia masks evolutionary potential, waiting for conditions to permit activity.
  *   **Tardigrade (Tun) (65):** Same organism as above, but metabolic cessation challenges whether life requires ongoing process.

  ## TIER 3: BORDERLINE REPLICATORS (30–59)
  *   **Giant Virus (50):** Possesses genetic complexity exceeding bacteria yet lacks independent metabolism entirely. **[BIO UNCERTAINTY]**
  *   **Computer Worm (40):** Undergoes Darwinian selection and replication but lacks any chemical substrate.
  *   **Prion (30):** Replicates structural information without nucleic acids, reducing life to mere conformational change.

  ## TIER 4: PROCESS MIMICS (0–29)
  *   **Fire Front (15):** Consumes fuel and spreads dynamically but lacks heredity or internal regulation.
  *   **Mailing List (10):** Persists through members yet possesses no mechanism to exclude variants or maintain integrity.

  ***

  ## HOW THE LIST RESHUFFLES
  1.  **Upkeep Ratio (Activity vs. Inertness):** Spores and Tuns plummet (dormant); Fire rises (active chemistry); Cell Lines drop (external upkeep).
  2.  **Astrobiology (Chemistry + Evolution):** Viruses, Worms and Prions crash (no self-sustaining chemistry); Spores and Tuns recover (evolutionary capacity).
  3.  **Good of Own (Harmability):** Fire and List crash (cannot be harmed, only stopped); Viruses rise slightly (can be neutralised); Organisms remain high.

  ***

  ## THE CUTOFF & CONFESSIONS
  **The Boundary Case:** **Giant Virus (50)**. It sits precisely between metabolism-based definitions (which exclude it) and evolution-based definitions (which include it). Unlike the Spore, it never metabolises; unlike the Worm, it is chemical.

  **Biological Confessions:** Scores for the **Synthetic Bacterium** and **Giant Virus** are lowered due to unknown gene functions; we are unsure what they *do*, not just whether they live.

  *Department of Philosophy | Philosophy of Biology | Year 1*
