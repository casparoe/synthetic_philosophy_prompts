      *   *Dependencies:* Salience (needs to be non-circular), Equilibrium (needs to be robust in social science), Mutual Knowledge (needs to be solvable without infinite regress).

  5.  **Evaluate Unfalsifiability (The "Coordination Problem is Always Available" Move):**
