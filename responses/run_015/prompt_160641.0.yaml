answer: |-
  Here is a map of the exposure of your view, ranked by severity, followed by an assessment of its predictive risk and a verdict on unfalsifiability.

  ### I. Map of Exposure: Candidate Defeaters

  I have ranked these from **Fatal** (requires abandoning a core tenet) to **Awkward** (requires clarification or minor concession). For each, I assess whether a committed holder should concede or dismiss.

  #### 1. The Affordance-Locked Regularity (The Door)
  **Severity:** **Fatal** to Mechanism-Indifference.
  **The Problem:** Your definition requires an *equilibrium solution to a coordination problem*. In game-theoretic terms, an equilibrium exists only when agents' strategies are *best responses to one another*. In the door case, my choice is a best response to the *door's weight*, not to *your choice*. We are in parallel, not in interaction. There is no strategic interdependence.
  **Why it hurts:** If you count this as a convention, you have severed the link between convention and *social interaction*. You are defining convention as "any stable arbitrary regularity," which includes tides, traffic flow determined solely by lane width, and gravitational orbits. This makes the view too permissive to be useful for social theory.
  **Committed Holder's Verdict:** **Concede.** You must distinguish between *causal stability* and *equilibrium stability*. To save the view, you must add a condition of **interdependence**: my reason for conforming must depend (causally or counterfactually) on my expectation of your conformity, even if I cannot represent it as such. You cannot maintain mechanism-indifference if the mechanism bypasses the other agents entirely. You do not need *normative* psychology, but you do need *strategic* coupling.
  **Fix:** Modify "equilibrium solution" to require that the payoff structure includes the actions of others. The door case fails this; it is a set of individual optimization problems, not a game.

  #### 2. The Unfalsifiability Move ("Coordination Problem is Always Available")
  **Severity:** **Fatal** to Explanatory Power.
  **The Problem:** You note your own tendency to argue that "any stable regularity of mutual adjustment solves the coordination problem of adjusting to one another." If you can always retroactively posit a coordination problem to fit the behavior, the "coordination problem" condition does no constraining work. It becomes a description of the outcome rather than an explanation of the cause.
  **Why it hurts:** This collapses your view into a triviality: "Conventions are stable regularities." It renders the "equilibrium" label decorative. If you cannot specify the payoffs *independently* of the observed behavior, you cannot test whether the behavior is actually an equilibrium.
  **Committed Holder's Verdict:** **Concede.** This is a genuine defect. To avoid this, you must require that the coordination problem be specifiable *prior* to or *independently* of the regularity. You need a constraint on what counts as a "coordination problem" (e.g., specific payoff structures regarding joint vs. individual outcomes) that is not satisfied by mere mutual adjustment.
  **Fix:** Insist on independent evidence of the payoff structure (e.g., agents suffer if they fail to coordinate, regardless of *how* they coordinate).

  #### 3. Contested Equilibria (Conflict of Interest)
  **Severity:** **Serious** (Scope Limitation).
  **The Problem:** Lewisian conventions rely on *coordination* problems (common interest in coordinating, indifference over *how*). In contested cases (e.g., which group's dialect becomes standard), agents prefer *different* equilibria. This is a "Battle of the Sexes" or bargaining problem, not a pure coordination problem.
  **Why it hurts:** If you include these as conventions, you blur the line between convention and power/norm. If you exclude them, you exclude a vast swath of what ordinary language calls "convention" (e.g., titles of address, dress codes that favor one class).
  **Committed Holder's Verdict:** **Dismiss (with qualification).** A committed holder should argue that contested cases are *not* conventions in the strict sense, but *norms* sustained by power or internalization. Your view is a theory of *conventions*, not all social regularities. Conceding this limits the scope of your theory but preserves its precision. The "convention" label should be reserved for cases where the arbitrariness is genuine (no one cares *which* equilibrium, only *that* there is one).
  **Fix:** Bite the bullet. Contested regularities are norms, not conventions. This protects the "arbitrariness" condition.

  #### 4. Vestigial Norms (Rationale Lapses)
  **Severity:** **Awkward** (Predictive Failure).
  **The Problem:** Your view predicts that when the coordination problem lapses (payoffs change), the equilibrium should dissolve. Vestigial norms persist despite the loss of the original payoff structure.
  **Why it hurts:** It suggests your view cannot explain the *persistence* of conventions without their original rationale. Rivals (internalization accounts) explain this easily: the norm is now sustained by guilt/shame, not payoffs.
  **Committed Holder's Verdict:** **Dismiss.** You can argue that the coordination problem has *shifted*, not lapsed. The new coordination problem is "avoiding social friction/sanction." As long as there is *some* equilibrium structure sustaining it, it remains a convention on your view. The "original rationale" is irrelevant; only the *current* payoff matrix matters.
  **Fix:** Maintain that so long as there is *a* current equilibrium (even if it's just "avoid awkwardness"), it counts. This preserves mechanism-indifference but relies on the "coordination problem is always available" move (see #2), so tread carefully.

  #### 5. The Proleptic-Convention Problem (First Instance)
  **Severity:** **Merely Awkward**.
  **The Problem:** How can the first instance be a convention if conventions require recurrence?
  **Why it hurts:** It threatens the temporal stability of the definition.
  **Committed Holder's Verdict:** **Dismiss.** This is a category error between *types* and *tokens*. The *action* at t=1 is a conventional action because it instantiates a *type* of action that is structured to be recurrent. The "recurrence" condition applies to the pattern, not the history. You do not need actual past conformity, only the *structural capacity* for it (salience + payoff).
  **Fix:** Clarify that "recurring" describes the *kind* of problem, not a historical prerequisite for the first token.

  ---

  ### II. Where the View Risks Anything (Predictive Differentiation)

  You asked where your view sticks its neck out compared to rivals (Normative-Expectations, Plain Equilibrium, Internalization). Here is where your view makes distinct predictions:

  1.  **Normative Phenomenology:**
      *   **Your View:** Predicts that feelings of obligation/guilt should correlate with the *stability of the equilibrium*, not the moral weight. If the equilibrium is fragile, normativity should be high (to bolster stability). If the equilibrium is robust (e.g., driving on the right), normativity might be low or purely pragmatic.
      *   **Rival (Internalization):** Predicts normativity persists even when equilibrium is lost.
      *   **Risk:** If you find high normativity in *unstable* regularities that are *not* equilibria (e.g., failed revolutions), your view struggles.

  2.  **Timing of Change (Tipping vs. Drift):**
      *   **Your View:** Predicts **phase shifts**. Conventions should change suddenly when the payoff structure or salience crosses a threshold (tipping point). Gradual drift is unlikely unless the underlying payoffs drift gradually.
      *   **Rival (Habit/Internalization):** Predicts gradual drift is common as attitudes shift.
      *   **Risk:** If empirical data shows conventions often change via slow cultural drift without a clear payoff shift, your equilibrium model is strained.

  3.  **Minimal Agents (Animals/Robots):**
      *   **Your View:** Predicts conventions *should* appear in populations with zero Theory of Mind, provided they have learning mechanisms that track reinforcement (equilibrium).
      *   **Rival (Normative-Expectations):** Predicts conventions require mutual belief attribution.
      *   **Risk:** If animal "conventions" (e.g., grooming patterns) are shown to rely on complex expectation-tracking rather than simple reinforcement, your "no psychology" claim weakens.

  4.  **Third-Party Enforcement:**
      *   **Your View:** Predicts enforcement should be **unnecessary** or rare. If enforcement is required to sustain the regularity, it is not a convention (equilibrium) but a norm (prisoner's dilemma solution).
      *   **Rival (Normative):** Expects enforcement to be common.
      *   **Risk:** If you find that most "conventions" (e.g., queuing, dress) actually rely on subtle policing to remain stable, your claim that they are self-enforcing equilibria is empirically false.

  ---

  ### III. Dependencies: What the View Stands or Falls With

  1.  **Salience:** Your view depends on a non-circular account of salience. If "salience" just means "the one everyone chose," it is circular. You need an account of *intrinsic* or *pre-game* salience (Schelling points) that explains the *first* move. If salience is entirely endogenous to the history of play, you cannot solve the Proleptic Problem without smuggling in expectations.
  2.  **Explanatory Credentials of Equilibrium:** You are betting on the robustness of equilibrium analysis in social science. If social behavior is shown to be systematically *out of equilibrium* (e.g., driven by chaos, power, or irrationality), your definition describes nothing that actually exists.
  3.  **Mutual Knowledge:** You deny common knowledge is required. However, you still need *some* mechanism for alignment. If you claim *no* mutual knowledge is needed, you must explain how agents avoid constant miscoordination. If the mechanism is "blind habit," you risk the Door Case. If the mechanism is "implicit tracking," you risk sliding back into an expectations account.

  ---

  ### IV. Verdict on Unfalsifiability and Collapse

  **The Unfalsifiability Verdict:**
  You asked for honesty: **Yes, the move that "any stable regularity of mutual adjustment solves a coordination problem" makes the view unfalsifiable.**
  This is a **genuine defect**. A structural account should not be able to explain *everything*. If you can always posit a coordination problem to fit the data, you are not testing the hypothesis that "conventions are coordination equilibria"; you are stipulating that "whatever people do, they must have been coordinating."
  **Remedy:** You must allow for the possibility of **stable non-conventions**. You need to identify a stable regularity that *fails* your definition. (The Door Case is your best candidate for this). If you cannot point to a stable regularity that is *not* a convention, your definition is tautological.

  **The Collapse Objection (Arbitrariness vs. Equilibrium):**
  You stated this is your most serious fear: *that arbitrariness does no work beyond coordination equilibrium.*
  **Assessment:** This fear is **unfounded**, provided you handle the "Unique Equilibrium" case.
  *   **Why it works:** Some coordination problems have only **one** solution (e.g., "Meet me at the only café in town"). This is an equilibrium, but it is **not arbitrary**. There is no alternative that would have served as well.
  *   **The Work:** The arbitrariness condition successfully distinguishes *conventions* (multiple equilibria) from *necessary solutions* (unique equilibrium).
  *   **The Risk:** The risk is not that arbitrariness does no work, but that **true arbitrariness is rare**. Most real-world "conventions" have slight payoff differences (one door is lighter). If you require *strict* indifference, you might find almost no conventions exist.
  *   **Fix:** Relax "arbitrariness" to "no *significant* preference over alternatives." This preserves the work the condition does (filtering out unique solutions) without making the category empty.

  ### Summary Advice for the Committed Holder

  1.  **Kill Mechanism-Indifference regarding Physical Causation.** You must exclude the Door Case. Conventions require *interdependence*, not just parallel stability. This saves the "social" in social normativity.
  2.  **Stop the Unfalsifiability Slide.** Do not argue that *any* adjustment is a coordination problem. Specify the payoff structure independently. Allow that some stable regularities are *not* conventions (e.g., habits, physical constraints).
  3.  **Lean into the "No Normativity" Claim.** This is your strongest differentiator. Predict that when the equilibrium breaks, the "ought" vanishes immediately. If the "ought" persists, it was never a convention (it was a norm).
  4.  **Accept the Scope Limit.** Admit that contested regularities (Battle of the Sexes) are not conventions. This protects the "arbitrariness" condition from collapse.

  Your view is robust, but only if you tighten the definition of "equilibrium" to exclude non-strategic stability and resist the temptation to retrofit coordination problems onto any stable behavior.
