answer: |-
  ### Procurement Spec: Fairness Requirements for Risk Scores

  Here is the specification breakdown based on your operational constraints. I have categorized these by **Non-Negotiable** (contractual dealbreakers) and **Preference** (aspirational, hard to enforce).

  #### 1. Observability (Auditability)
  *   **Requirement:** The metric must be computable using only the vendor's decision (approve/reject), the protected group label, and the realized outcome for approved cases.
  *   **Motivation:** Legal and privacy constraints prevent the agency from sharing full feature sets with auditors; outcomes for rejected applicants are structurally unobserved.
  *   **Status:** **Non-Negotiable.**
  *   **Definition vs. Estimator Flag:** You are confusing the *definition* of fairness (a population property) with the *estimator* (what you can calculate). Most fairness definitions require counterfactuals (what would have happened if rejected?). Under this requirement, you cannot estimate them without strong statistical assumptions.

  #### 2. Scale Invariance
  *   **Requirement:** The metric must yield the same pass/fail status regardless of whether the vendor outputs probabilities, risk indices, or rank orders, provided the ranking of individuals is preserved.
  *   **Motivation:** Vendors use different architectures; procurement must compare utility/fairness trade-offs without normalizing scores artificially.
  *   **Status:** **Non-Negotiable.**

  #### 3. Causal Validity (Performative Stability)
  *   **Requirement:** The metric must remain valid even if the intervention (benefit allocation) causally changes the target outcome (e.g., receiving benefits reduces future risk).
  *   **Motivation:** Risk scores in public benefits are not passive predictions; they are allocation mechanisms that alter the ground truth.
  *   **Status:** **Non-Negotiable.**
  *   **Definition vs. Estimator Flag:** Standard accuracy metrics assume static ground truth. If the intervention changes the outcome, "accuracy" is ill-defined without a control group.

  #### 4. Game Resistance (Robustness)
  *   **Requirement:** The vendor cannot improve the fairness metric by manipulating the decision boundary in a way that reduces overall social welfare or utility.
  *   **Motivation:** Prevents Goodhart's Law; vendors must not optimize for the audit metric at the expense of the agency's mission.
  *   **Status:** **Non-Negotiable.**

  #### 5. Composability
  *   **Requirement:** The fairness guarantee must hold (or degrade gracefully) when the individual is subject to sequential decisions by other agency systems.
  *   **Motivation:** Prevents cumulative disadvantage across different departments (e.g., housing, then healthcare, then employment).
  *   **Status:** **Preference.** (You cannot contractually bind a single vendor to the behavior of other systems you control).

  #### 6. Missing Requirement: Group Identification Strategy
  *   **Requirement:** A specified method for assigning protected group labels (e.g., self-attestation, imputation) that is consistent across vendors.
  *   **Motivation:** You stated you "don't get the features." If you do not possess protected class data (race, sex, etc.), you cannot audit disparate impact. You need a contractual standard for how this data is acquired or proxied.
  *   **Status:** **Non-Negotiable.** (Without this, the audit is impossible).

  ---

  ### The Impossibility Analysis

  You asked which subset of requirements is jointly unsatisfiable given the no-go theorems.

  **The Conflict:** You cannot satisfy **Observability (1)**, **Causal Validity (3)**, and **Standard Statistical Fairness** simultaneously.

  1.  **The Selective Labels Problem:** Because outcomes are only observed for the selected (Req 1), you cannot calculate False Negatives. This makes *Equalized Odds* and *Calibration* mathematically unestimable without assuming the rejected population behaves exactly like the accepted population (an assumption that is usually false and violates Causal Validity).
  2.  **The Performative Problem:** Because the intervention changes the outcome (Req 3), the "realized outcome" for the selected group is not the same as the "risk" you intended to predict. You are measuring the effect of the treatment, not the baseline risk.
  3.  **The No-Go Result:** Chouldechova (2017) and Kleinberg et al. (2016) prove you cannot satisfy Calibration and Error Rate Balance simultaneously when base rates differ. However, your constraint is stricter: **You cannot verify *any* outcome-based fairness criterion without counterfactuals.**

  **What to Drop:**
  You must drop the reliance on **observational outcome data alone**. To satisfy Causal Validity and Auditability, you must contractually mandate **Randomized Control (A/B Testing)**. You must require the vendor to randomly approve a small subset of "rejected" candidates to observe their outcomes. Without this experimental data, you are forced to drop Causal Validity and accept that you are auditing a static prediction on a biased sample, not the actual fairness of the intervention.

  ---

  ### Existing Criteria Summary

  *   **Demographic Parity:** Requires selection rates to match population shares, ignoring actual risk or utility.
  *   **Equalized Odds:** Requires equal true positive and false positive rates across groups, impossible to verify without rejected outcomes.
  *   **Calibration:** Requires predicted risk to match observed outcome frequency, unidentifiable under selective labeling.
  *   **Predictive Parity:** Requires equal positive predictive value across groups, mathematically incompatible with Equalized Odds when base rates differ.
  *   **Counterfactual Fairness:** Requires decisions to be invariant in a causal world where group membership changes, requires a full causal model you do not have.
