answer: |-
  (a) **Exam Question**

  **Question 1**
  Suppose a future neuroscience produces a reliable, interpersonally comparable scalar measure of a creature's capacity for valenced experience at a time, the Sentience Index ($S$). Its reliability is to be granted outright; epistemic uncertainty is not a topic for discussion. Assume $S$ reads 1.0 for a typical adult human, roughly 0.02 for a honeybee, and exactly 0 for a domestic thermostat.

  In an essay of no more than 1,200 words, construct a theory of moral status that utilizes $S$ without reducing moral status to a simple linear function of $S$. Your answer must address the following four points:

  1.  **The Mapping Function:** State what function maps $S$ onto moral status. Defend the shape of this function: is any threshold defensible, given that small differences in $S$ seem not to permit large differences in status, or does continuity demand itself collapse under a sorites-style argument?
  2.  **Multidimensionality:** Notice that $S$ is one number while the thing we care about does not look like one number. Explain how intensity, duration, temporal depth, and the unity of experience come apart, and specify how the moral question changes depending on whether one is deciding to inflict pain, kill, use, or replace the being.
  3.  **The Thermostat Problem:** Give the further condition that excludes the thermostat ($S=0$). Face the awkward consequence that this condition looks all-or-nothing, so that gradualism about sentience appears to smuggle a cliff back in at the bottom.
  4.  **Aggregation:** Say whether, on your account, very many low-$S$ creatures can sum to outweigh one high-$S$ creature, and explain why that is or is not a separate question from the one about degrees.

  *(Time allowed: 90 minutes. Word cap: 1,200. Marks: 20)*

  ***

  (b) **Model Answer**

  The Sentience Index ($S$) provides a metric for capacity, but moral status is a normative construct. A defensible theory cannot simply equate status with $S$ (i.e., Status $= kS$), because this ignores the structural differences between types of harm and the metaphysical requirements for having interests at all.

  **1. The Mapping Function**
  The function mapping $S$ to moral status should be continuous but non-linear, specifically convex (e.g., $S^2$). A strict threshold (e.g., Status $= 0$ if $S < 0.5$) is vulnerable to the Sorites paradox: no physiological difference explains why $S=0.49$ grants no status and $S=0.51$ grants full status. However, linearity implies a bee is 1/50th of a human, which fails to capture the qualitative shift in cognitive complexity. A convex function respects gradualism while acknowledging that higher capacities generate disproportionately stronger claims. This avoids the Sorites collapse by denying that moral *significance* must scale linearly with physical *capacity*, even if the underlying property is continuous.

  **2. Multidimensionality**
  $S$ measures the capacity for valenced experience at a time, but moral status protects a *life*, not just a moment. Intensity, duration, and temporal depth come apart. A being with low $S$ (bee) may feel sharp pain (high intensity) but lacks the temporal depth to anticipate death or mourn lost futures. Thus, the moral question depends on the action. Inflicting pain tracks $S$ closely (capacity to suffer). Killing, however, tracks temporal depth and psychological unity. A human ($S=1.0$) loses a complex, anticipated future; a bee ($S=0.02$) loses a stream of immediate experiences. Therefore, $S$ determines the weight of pain-based claims, but a separate metric of psychological continuity determines the weight of life-based claims. Treating status as a single scalar obscures this; status is a vector of protections.

  **3. The Thermostat Problem**
  The thermostat ($S=0$) is excluded not because it lacks complexity, but because it lacks *subjectivity*. The further condition is "phenomenal ownership": there must be something it is like to be the system. This condition is binary; a system either has a point of view or it processes information without a subject. This reintroduces a cliff at the bottom: Status is 0 at $S=0$, and $>0$ at any $S>0$. This does not contradict gradualism above the threshold. The cliff marks the entry into the moral community (subjecthood), while the gradient of $S$ determines standing within it. The awkwardness is illusory; it is the difference between having an interest and the strength of that interest.

  **4. Aggregation**
  Can many low-$S$ creatures outweigh one high-$S$ creature? On this account, no. Because moral status includes a right against being treated as a mere resource, aggregation is constrained. While pain might be aggregable (many bee-stings could outweigh one human headache), lives are not fungible units. The convex mapping function implies diminishing marginal moral value at the low end relative to the high end. More importantly, because high-$S$ beings possess temporal depth and autonomy, they hold rights that cannot be overridden by the summed interests of beings lacking those capacities. This is not a separate question from degrees; it is a consequence of the multidimensionality noted in point 2. If status depends on psychological unity, you cannot sum fragmented units to override a unified agent.

  In conclusion, $S$ is necessary for moral status but not sufficient to define its shape. A convex mapping function, distinguished by the type of harm and grounded in binary subjecthood, allows for gradualism without collapsing into absurdity or permitting the aggregation of mere sentient units against autonomous persons.

  ***

  (c) **Marking Scheme (20 Marks)**

  | Move | Marks | Requirement | Common Error |
  | :--- | :---: | :--- | :--- |
  | **1. Function Shape** | 4 | Proposes a non-linear/convex function or defends a soft threshold; explicitly addresses the Sorites risk regarding small differences in $S$. | Treating the function as strictly linear ($Status = S$) or asserting a hard threshold without defending against the Sorites paradox. |
  | **2. Multidimensionality** | 4 | Distinguishes between types of harm (pain vs. killing); links temporal depth/unity to specific moral questions rather than treating status as a single scalar. | Conflating the capacity to suffer with the wrongness of killing; failing to note that $S$ is a snapshot while moral status often protects a future. |
  | **3. The Zero-Cliff** | 4 | Identifies "subjectivity" or "phenomenal ownership" as the binary condition excluding the thermostat; reconciles this cliff with gradualism above zero. | Ignoring the thermostat condition or claiming the cliff disproves gradualism entirely; failing to distinguish *entry* to moral status from *degree* of status. |
  | **4. Aggregation** | 4 | Takes a clear stance on summing (usually denying it for lives/rights); links this stance to the earlier arguments about depth or function shape. | Arguing simple utilitarian summation without qualification; or treating aggregation as purely an empirical calculation rather than a structural moral question. |
  | **5. Epistemic Discipline** | 4 | Avoids appealing to uncertainty, measurement error, or expected-value reasoning over populations; stays within the hypothetical constraints of perfect $S$. | **Predictable Mistake:** Evading the degree question by arguing "we can't know $S$ for sure" or "we should maximize expected value across billions of insects." |

  ***

  (d) **A vs. B Distinction**

  **The Specific Move:**
  A **B-grade** answer treats the "Thermostat Cliff" (Move 3) and the "Gradualist Gradient" (Move 1) as a tension that must be apologized for or resolved in favor of one side (either pure gradualism or pure threshold).

  An **A-grade** answer recognizes that the **binary condition of subjecthood legitimizes the non-linear function**. It explicitly argues that the "cliff" at zero (entry into the moral community) is metaphysically distinct from the "slope" above zero (weight of interests), and uses this distinction to solve the Aggregation problem (Move 4): because subjecthood is a binary gatekeeper, you cannot sum the interests of beings who lack the *type* of subjectivity required to hold rights against being overridden. The A answer sees the architecture of the theory as a unified solution, whereas the B answer sees four separate questions.
