answer: |-
  The regime you describe is not a single theory of responsibility but a pragmatic settlement between two incompatible theories: **Consequentialism** (specifically, harm-minimization) and **Control-Based Deontology** (blame attaches only to voluntary choice).

  The implicit theory of responsibility presupposed by this package is **Retrospective Necessitation**. It operates on the assumption that a bad outcome reveals a prior defect in judgment that was latent but undetectable until the event occurred. It treats the outcome not merely as a consequence of the act, but as a diagnostic tool that validates the suspicion of fault. This theory allows the system to claim the moral high ground of judging "process" (Point 2) while reserving the administrative efficiency and emotional satisfaction of punishing "harm" (Points 1, 3, 5).

  ### The Three Roles of Outcome

  To understand where this settlement fractures, we must distinguish the three roles outcomes play in your description. A pure control-based view (where blame tracks only what the agent could govern) can accommodate some of these roles but must reject others.

  **1. Outcome as Evidence of Prior Fault**
  *   *Definition:* The harm suggests that the agent took an unjustified risk.
  *   *Control View Compatibility:* **Conditionally Compatible.** A control theorist accepts that outcomes provide probabilistic evidence of prior recklessness. If a surgeon leaves the room and the patient dies, it is reasonable to investigate whether leaving was risky.
  *   *The Regime's Deviation:* Point 4 violates this. The regime does not treat the outcome as *evidence* to be weighed against ex ante information; it treats the outcome as *proof* that the ex ante information was sufficient. It collapses the distinction between "I couldn't have known" and "I should have known because it went wrong."

  **2. Outcome as a Constituent of Fault**
  *   *Definition:* The conduct is not deemed negligent *unless* harm occurs, or the definition of negligence expands to include the harm.
  *   *Control View Compatibility:* **Incompatible.** On a control view, the wrongfulness of the act is fixed at the moment of decision. If two anaesthetists take the same unjustified risk, they are equally blameworthy, regardless of the patient's physiology or luck.
  *   *The Regime's Deviation:* Point 1 and Point 4 make outcome constitutive. The colleague whose patient survives is "never reviewed." The conduct is retrospectively re-described as careless *because* the injury happened. The regime treats the harm as part of the actus reus of the professional violation, despite its stated disclaimer in Point 2.

  **3. Outcome as a Scalar for Sanction**
  *   *Definition:* Given equal fault, worse harm warrants worse punishment.
  *   *Control View Compatibility:* **Incompatible regarding Blame; Compatible regarding Liability.** A control theorist argues that *moral blame* cannot vary by luck. However, they might accept that *financial liability* or *regulatory restriction* varies by harm for reasons of restitution or specific deterrence (i.e., the doctor who killed a patient needs more retraining than the one who didn't, even if their mental state was identical).
  *   *The Regime's Deviation:* Point 3 and 5 conflate blame with sanction severity. The "lower-order category" for near misses implies less *wrongdoing*, not just less *cost*. The tort system (Point 5) imposes liability for unforeseeable extent, which is a strict liability rule masquerading as fault-based compensation.

  **Summary of Accommodation:** A control-based view can accept Outcome as Evidence (if rigorously tested) and potentially as a Scalar for *cost* (not blame). It cannot accept Outcome as a Constituent of Fault. The regime you describe relies on Outcome as a Constituent of Fault to justify its selectivity, while claiming to treat it only as Evidence to justify its legitimacy.

  ### Coherence Analysis

  **The Trigger vs. The Standard**
  Is the gap between the outcome-driven trigger (Point 1) and the process-driven standard (Point 2) a contradiction?
  *   **Strictly Presupposed:** The system presupposes **resource scarcity**. It cannot audit all processes, so it uses harm as a heuristic filter for risk.
  *   **Defensible Rationale:** A pure control principle could endorse this *if* the system acknowledged the filter as imperfect. If the regulator admitted, "We only investigate harms due to budget, but we judge the conduct ex ante," the logic holds.
  *   **The Contradiction:** The contradiction arises because the filter biases the judgment. By only investigating harms, the sample set is skewed toward cases where hindsight bias (Point 4) is most potent. The trigger corrupts the standard. You cannot reliably judge ex ante reasonableness using a sample selected entirely by ex post failure.

  **Re-description (Point 4) vs. Sanctioning Differential (Point 1)**
  These are distinct phenomena, and Point 4 is more damaging to coherence.
  *   **Point 1 (Selection):** This is an administrative omission. It lets lucky negligent clinicians go unpunished. This is a failure of *justice* (under-enforcement), but it does not necessarily lie about the nature of the wrong.
  *   **Point 4 (Re-description):** This is an epistemic corruption. It asserts that the unlucky clinician was *more negligent* than the lucky one. It changes the historical truth of the agent's epistemic situation.
  *   **Verdict:** Point 4 is the fatal flaw. Point 1 could be defended as triage; Point 4 is a falsehood about agency. It conflates "bad luck" with "bad judgment."

  **Point 6 (Pure Process Offenses)**
  The existence of Point 6 (punishing fraud/intoxication regardless of outcome) proves the system *can* operate on control principles. This highlights that the outcome-dependence in clinical negligence is a policy choice, not a structural necessity. It reinforces the view that the regime is a settlement: we punish "moral" sins (lying, drinking) by control, but "technical" sins (clinical judgment) by result, likely because technical judgment is harder to audit without an outcome signal.

  ### The Two Clean Alternatives

  To make the regime coherent, one must choose a side. Here is what practice looks like under each.

  **1. Consistently Control-Based Regime**
  *   **Trigger:** Randomized auditing of records + mandatory reporting of *near misses* weighted equally with adverse events. A file is opened when a protocol deviation is observed, regardless of patient status.
  *   **Standard:** Strictly ex ante. The question is: "Given what the clinician knew *at the time*, was this decision reasonable?" The actual injury is inadmissible in the fault determination.
  *   **Sanction:** Graded by the *degree of deviation* from standard care, not the harm. The anaesthetist who leaves for 8 minutes receives the same sanction whether the patient lives or dies.
  *   **Tort:** Decoupled from blame. Either a no-fault compensation scheme (socialized risk) or strict enterprise liability where the hospital pays regardless of individual fault.
  *   **Practice Change:** Massive increase in regulatory cost. "Near misses" become high-stakes events. Clinicians are punished for "getting away with it" if caught by audit.

  **2. Consistently Outcome-Based Regime**
  *   **Trigger:** Patient harm.
  *   **Standard:** Strict Liability. If the patient is harmed during care, the clinician/hospital is liable unless an explicit statutory defense applies (e.g., inevitable complication). The "process" defense is removed.
  *   **Sanction:** Proportional to harm. A death costs more than an injury; an injury costs more than a near miss (which costs nothing).
  *   **Tort:** Aligned with regulation. Damage is the sole prerequisite for liability.
  *   **Practice Change:** Drop the pretense of "fitness to practise" based on judgment. Licensing becomes insurance underwriting. Medicine becomes intensely defensive; high-risk procedures are abandoned not because they are medically unsound, but because the liability variance is too high.

  ### The Luck Objection: Ex Ante vs. Ex Post

  You raise the objection that a control-based reform merely relocates luck rather than removing it. If we judge by the agent's ex ante epistemic situation (what they knew/could know), we are still judging them based on circumstances they did not choose (their training, their fatigue, the equipment provided, their innate cognitive capacity).

  **Does this objection have real force?**
  It has force against the idea of *ultimate* moral responsibility, but not against the idea of *practical* accountability.

  **The Distinction:**
  *   **Ex Post Luck (Result Luck):** This is luck in the *world*. It concerns whether the risk materialized. This is irrelevant to agency because the agent cannot influence the realization of risk once the choice is made. Punishing this provides no normative guidance. You cannot tell a clinician "try harder to have the patient survive" if they have already done everything right.
  *   **Ex Ante Luck (Constitutive Luck):** This is luck in the *self*. It concerns capacity and opportunity.

  **Why Ex Ante is Relevantly Different:**
  A control-based regime accepts Ex Ante luck as the *price of agency*. We hold people responsible for their capacities because those capacities *are* the agent. While I did not choose my innate intelligence or my medical school training, I am the locus where those factors operate.
  *   **Guidance:** A system based on Ex Ante control can guide behavior ("Improve your checklist usage," "Rest before shift"). A system based on Ex Post outcomes cannot guide behavior ("Try to ensure the patient doesn't have a rare allergy").
  *   **Fairness:** Ex Ante luck is distributed relatively randomly across a profession (assuming standardized training). Ex Post luck is binary and volatile.

  **Conclusion on the Objection:**
  The objection correctly identifies that "control" is not metaphysically absolute. However, the relocation of luck from Ex Post to Ex Ante is a massive moral improvement. Ex Post luck makes accountability a lottery. Ex Ante luck makes accountability a function of capacity and choice. The control-based reform does not eliminate luck, but it eliminates *noise*. It ensures that sanctions track factors the agent could theoretically influence in the future (their process), rather than factors they cannot (the patient's physiological resilience).

  Therefore, the objection does not defeat the control view; it merely clarifies that control is bounded. The regime you described is incoherent because it claims to be control-based while punishing Ex Post luck. A coherent system must admit that if it punishes based on harm, it is taxing bad fortune, not just bad judgment.
