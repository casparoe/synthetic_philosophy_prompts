prompt: |-
  Consider the following stylized but, I think, recognizable regime of professional accountability. I describe it fully so that nothing needs to be looked up; I am interested in its implicit theory, not in whether any particular jurisdiction matches the description exactly.

  A hospital and the professional regulator that licenses its clinicians operate under roughly these rules:

  1. Review is triggered by outcomes. A file is opened when an adverse-event report is filed. No routine audit of conduct exists. An anaesthetist who leaves the operating theatre for eight minutes to take a personal call, and whose patient suffers a hypoxic injury, is reported, reviewed, sanctioned, sued, and named in the press. A colleague who does exactly the same thing, with exactly the same patient risk profile, and whose patient is unharmed, is never reviewed, because nothing happened.

  2. When the regulator does review, it disclaims outcome-sensitivity. Its written standard is that it judges the clinician's process and not the result, and it will sanction an impaired or reckless practitioner whose patient escaped harm on the same schedule as one whose patient did not. Its operative vocabulary is risk, judgment, and fitness to practise rather than damage caused.

  3. The grading taxonomy is outcome-based. Incidents are sorted by actual severity, with an unreached near miss ranked as a lower-order category than an event in which harm occurred, and the near-miss count is itself a function of whether anyone happened to notice.

  4. Outcome also migrates into the finding of fault itself. After a bad result, the same conduct is retrospectively re-described as careless in a way it would not have been described had nothing happened: reviewers conclude that the clinician should have anticipated a difficulty that, ex ante, there was no particular reason to anticipate. The outcome fixes not only the severity of the sanction but the prior attribution of fault.

  5. The tort system operating alongside all of this requires actual damage for a claim to exist at all, while simultaneously holding a defendant liable for the full unforeseeable extent of the harm once some damage is established.

  6. Finally, some things are punished purely on a process basis with no outcome condition at all — falsifying a record, practising while intoxicated — and these attract sanction regardless of result.

  What I want from you is the implicit theory of responsibility this pattern presupposes.

  Specifically: reconstruct the view of blameworthiness that would make the whole package coherent, and show where the package is instead a settlement between two theories that disagree. Distinguish carefully between what the practice strictly presupposes, what it merely fits well with, and what it is neutral on. In particular, I want you to separate three roles an outcome can play, because I suspect the practice conflates them: outcome as evidence of a prior fault, outcome as a constituent of fault, and outcome as a scalar on the severity of a sanction for a fault already established. Which of these can a control-based view accommodate without conceding that outcomes are partly constitutive of blameworthiness, and which can it not?

  Then say whether the regime is coherent. Is the gap between the outcome-driven trigger and the process-driven standard a contradiction, or does it have a defensible rationale that a pure control principle could endorse? Is the retrospective re-description in point 4 the same phenomenon as the sanctioning differential in point 1, or a different and more damaging one?

  Finally, take the two clean alternatives and tell me what each would have to change in practice: a consistently control-based regime, and a consistently outcome-based one. I expect the interesting problem to be that a control-based reform has to grade conduct by expected harm under the agent's own epistemic situation, and that this baseline is itself infected by circumstances the agent did not choose and could not have known — so that the reform relocates the luck rather than removing it. Tell me whether that objection has real force or whether the ex ante and the ex post versions of luck are relevantly different.

  Argue the case on its own terms. I do not want a survey of the literature, a reading list, or citations; assume I have read the standard arguments and want the analysis of this practice.
reasoning: |-
  Here's a thinking process that leads to the response:

  1.  **Deconstruct the Request:**

      *   **Subject:** A stylized regime of professional accountability in healthcare (hospital + regulator + tort system).
      *   **Key Features:**
          1.  Trigger = Outcome (Adverse event report). No routine audit.
          2.  Standard = Process (Regulator claims to judge conduct/risk, not result).
          3.  Taxonomy = Outcome (Severity grading based on actual harm).
          4.  Fault Finding = Outcome-contaminated (Hindsight bias: "should have anticipated" only after bad result).
          5.  Tort = Damage required for claim, but full liability for unforeseeable extent (egg-shell skull type logic).
          6.  Exceptions = Pure Process offenses (fraud, intoxication) punished regardless of outcome.
      *   **Tasks:**
          1.  Reconstruct the implicit theory of responsibility/blameworthiness.
          2.  Show where it's a settlement between two conflicting theories.
          3.  Distinguish strictly presupposed vs. fits well vs. neutral.
          4.  Separate three roles of outcome: (a) Evidence of prior fault, (b) Constituent of fault, (c) Scalar for sanction severity. Analyze which a control-based view can accommodate.
          5.  Assess coherence: Is the trigger/standard gap a contradiction or defensible? Is retrospective re-description (4) the same as sanctioning differential (1)?
          6.  Describe two clean alternatives: Consistently Control-Based vs. Consistently Outcome-Based. What changes in practice?
          7.  Address the "Luck Objection": Does control-based reform just relocate luck (ex ante vs. ex post)? Does this objection have force?
      *   **Constraints:** No literature survey, no citations, argue on its own terms.

  2.  **Analyze the Regime (The "Hybrid"):**

      *   *Observation:* The regime says one thing (Process/Control) but does another (Outcome/Result).
      *   *Trigger:* Outcome-dependent (Point 1).
      *   *Standard:* Process-dependent (Point 2).
      *   *Grading/Sanction:* Outcome-dependent (Point 3 & 5).
      *   *Fault Attribution:* Outcome-dependent via hindsight (Point 4).
      *   *Pure Process:* Rare exceptions (Point 6).
      *   *Implicit Theory:* It looks like a "Result-Responsibility" model masquerading as a "Control-Responsibility" model. It wants the administrative efficiency of outcome triggers and the moral cover of process standards.

  3.  **Task 1: Reconstruct the Implicit Theory:**

      *   What view of blame makes this coherent?
      *   It presupposes that *harm* is the primary social wrong, but *negligence* is the necessary legal hook.
      *   It operates on a theory of "Retrospective Necessitation." The bad outcome makes the prior risk-taking look unjustified.
      *   It treats outcomes as *revealing* hidden faults that were invisible ex ante.
      *   *Settlement:* It's a compromise between **Consequentialism** (minimize harm, punish harm) and **Deontology/Control Theory** (punish only what the agent controlled).
      *   *Strictly Presupposed:* That resources are scarce (can't audit everyone), so outcomes must screen cases. That harm matters morally (tort requires damage).
      *   *Fits Well With:* Deterrence theory (punish harm to scare others).
      *   *Neutral On:* Whether the agent actually had subjective foresight (it imputes it post-hoc).

  4.  **Task 2: The Three Roles of Outcome:**

      *   *Role A: Evidence of Prior Fault.* (Did the outcome show they were reckless?)
          *   Control View: Can accept this *if* the inference is valid. But Point 4 suggests the inference is invalid (hindsight bias).
      *   *Role B: Constituent of Fault.* (Is it *because* harm happened that it counts as negligence?)
          *   Control View: Rejects this. Fault must exist ex ante.
      *   *Role C: Scalar for Sanction.* (Same fault, worse harm = worse punishment?)
          *   Control View: Generally rejects this (moral luck problem), unless justified by restitution or specific deterrence.
      *   *Analysis:* The regime conflates A and B. It treats C as natural. A pure control view can accept A (probabilistic evidence) but must reject B. It struggles with C unless decoupled from *blame* and attached to *liability/cost*.

  5.  **Task 3: Coherence Assessment:**

      *   *Trigger vs. Standard:* Is it a contradiction?
          *   Not necessarily a logical contradiction, but a pragmatic filter. You can't investigate everyone. Outcome is a heuristic for risk.
          *   *Defensible Rationale:* Resource constraint.
          *   *Problem:* It introduces selection bias.
      *   *Re-description (4) vs. Sanctioning (1):*
          *   (1) is about *selection* for review.
          *   (4) is about *finding* guilt.
          *   (4) is more damaging. It corrupts the truth-finding function. (1) just misses some guilty people; (4) punishes the innocent (or those merely unlucky).
      *   *Verdict:* The regime is *functionally* coherent (it achieves social control) but *morally/logically* incoherent (it violates its own stated principle of process-judgment).

  6.  **Task 4: Two Clean Alternatives:**

      *   *Consistently Control-Based:*
          *   Trigger: Random audit + reporting of *risks* (near misses count same as hits).
          *   Standard: Ex ante reasonableness (what did they know then?).
          *   Sanction: Based on degree of deviation from standard, not harm caused.
          *   Tort: No-fault compensation or strict liability decoupled from blame.
          *   *Change:* Massive resource increase. "Near misses" punished equally to harms.
      *   *Consistently Outcome-Based:*
          *   Trigger: Harm.
          *   Standard: Strict Liability (if you broke it, you pay/lose license).
          *   Sanction: Proportional to harm.
          *   *Change:* Drop the pretense of "process." Admit it's about harm containment. Medicine becomes more defensive or insurers take over risk entirely.

  7.  **Task 5: The Luck Objection (Ex Ante vs. Ex Post):**

      *   *Objection:* Control-based regimes rely on "Ex Ante Luck." (Did the agent know the risk? That depends on their training, genetics, environment—things they didn't choose). So Control Theory just moves the luck back a step; it doesn't eliminate it.
      *   *Analysis:*
          *   Ex Post Luck (Result Luck): Did the patient die? (Pure chance).
          *   Ex Ante Luck (Constitutive/Circumstantial): Did the doctor have the capacity to know better?
          *   *Relevance:* They are different. Ex ante luck is about *capacity and opportunity*, which are the preconditions for agency. Ex post luck is about the *realization of risk* independent of agency.
          *   *Force:* The objection has some force (no one is truly self-made), but Ex Ante is the only workable basis for *normative guidance*. You can't guide outcomes, you can only guide choices. Therefore, Ex Ante luck is a necessary acceptance for a system of rules, whereas Ex Post luck is noise.
          *   *Conclusion:* The objection doesn't defeat the control view; it just highlights that "control" is bounded. But bounded control is still better than outcome luck for guiding behavior.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, philosophical, precise. No fluff.
      *   *Structure:* Follow the prompt's sequence.
      *   *Key Distinction:* Ensure the separation of the three roles of outcome is sharp.
      *   *Key Insight:* The regime isn't just hypocritical; it's a specific *type* of hypocrisy that serves a bureaucratic function (screening) while claiming moral legitimacy (process).
      *   *Refining the "Luck" argument:* Make sure to distinguish between "luck in the world" (outcome) and "luck in the self" (capacity). The control view accepts the latter as the price of agency.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I cite literature? *No.*
      *   *Check:* Did I address Point 6 (pure process offenses)? *Need to mention how this fits.* It shows the system *can* do process, proving the outcome reliance elsewhere is a choice, not a necessity.
      *   *Check:* Did I address the "settlement" aspect? *Yes, Consequentialism vs. Deontology.*
      *   *Check:* Is the distinction between Trigger (1) and Re-description (4) clear? *Yes, Selection vs. Constitution.*

  10. **Final Polish:** Ensure the language is tight. "Outcome as evidence" vs "Outcome as constituent." "Ex ante epistemic situation." "Moral Luck." (Use the concept without citing Williams/Nagel).

  *(Self-Correction on the Luck Objection)*: The prompt asks specifically about the objection that ex ante baseline is infected by circumstances. I need to be careful not to dismiss it too easily. The point is that *relevant* difference lies in the capacity for normative response. Ex post luck bypasses agency; ex ante luck constitutes it.

  *(Final Plan)*:
  1. Introduction: Identify the hybrid theory.
  2. The Three Roles of Outcome (Evidence, Constituent, Scalar).
  3. Coherence Analysis (Trigger vs. Standard, Re-description vs. Sanction).
  4. The Two Clean Alternatives (Control vs. Outcome).
  5. The Luck Objection (Ex Ante vs. Ex Post).
  6. Conclusion.

