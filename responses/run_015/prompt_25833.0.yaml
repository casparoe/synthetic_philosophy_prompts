answer: |-
  This is the core tension of science journalism: the gap between *semantic truth* (what the sentence literally means) and *pragmatic truth* (what the reader reasonably believes after reading it). In philosophy of language, this is the distinction between **what is said** and **what is implicated** (based on the work of Paul Grice).

  When you simplify, you generate **implicatures**. If you generate a false implicature intentionally to drive engagement, you are "paltering"—using truth to deceive.

  Here is a 15-minute decision procedure designed to catch this. It is not a moral compass; it is a structural audit of the text's relationship with the reader's inference.

  ### The Implicature Audit (15-Minute Procedure)

  **Preparation:** Take the specific sentence or paragraph in question. Have the source material (study abstract, interview transcript) open.

  **Step 1: The Literal Floor (2 Minutes)**
  *   **Question:** Is there any factual claim in this sentence that is demonstrably false *on its face*? (e.g., wrong numbers, wrong names, claiming causation where text says correlation).
  *   **If YES:** Cut or fix. This is a lie. Stop.
  *   **If NO:** Proceed to Step 2.

  **Step 2: The "Takeaway" Test (3 Minutes)**
  *   **Question:** If a smart, attentive reader reads *only* this paragraph and remembers *one thing*, what is it? Write that belief down.
  *   **Check:** Is that belief accurate according to the source material?
  *   **If NO:** You have generated a **False Implicature**. Proceed to Step 3 to see if it's defensible.
  *   **If YES:** Mark as **Clean**. (Skip to Step 5 to check for omissions).

  **Step 3: The "Because" Test (3 Minutes)**
  *   **Question:** Does the sentence *work* (is it interesting/newsworthy) *because* the reader holds that false belief?
      *   *Example:* "The drug shrank tumors" works because readers believe "shrinking tumors = curing cancer." If they knew "shrinking tumors ≠ living longer," would the sentence still carry the same weight?
  *   **If YES:** This is **Misleading**. The truth is doing no work; the misunderstanding is doing the work.
  *   **If NO:** (e.g., The false belief is incidental, not central to the point). Proceed to Step 4.

  **Step 4: The Pedagogical Necessity Check (3 Minutes)**
  *   **Question:** Is the false implicature generated by a metaphor or simplification required to explain a complex concept to a non-specialist?
      *   *Constraint:* Is there a clearer metaphor available that doesn't generate the false belief?
      *   *Constraint:* Do you signal the limitation? (e.g., "Think of it *like* X," vs "It *is* X").
  *   **If YES (Necessary & Signaled):** Mark as **Judgment Call**. (You are trading precision for comprehension).
  *   **If NO (Easier metaphor exists or no signal):** Mark as **Misleading**.

  **Step 5: The Omission Weight (4 Minutes)**
  *   **Question:** You left something out (a conflicting study, a limitation, a funding source). If you added it back in, would it change the reader's *actionable understanding* of the science?
      *   *Test:* Imagine the reader makes a decision based on this piece (e.g., "I should worry about this," "I should buy this," "I should believe this theory"). Would the omitted info change that decision?
  *   **If YES:** Mark as **Misleading**. (Violation of Grice's Maxim of Quantity).
  *   **If NO:** Mark as **Clean**.

  ***

  ### Running the Procedure: Three Cases

  Here is how this plays out in realistic editing scenarios.

  #### Case 1: The "Statistically Significant" Life-Saver
  **The Text:** "A new clinical trial found that Drug X significantly reduced tumor size in patients with advanced pancreatic cancer."
  **The Source:** The study found a statistically significant reduction in tumor size (p<0.05). However, the reduction was an average of 2mm, and there was **no improvement in survival rates or quality of life**. The primary outcome (survival) was null.
  **The Edit:** You cut the survival data to save space; the graph is crowded.

  *   **Step 1 (Literal):** True. Tumors did shrink.
  *   **Step 2 (Takeaway):** Reader believes: "Drug X helps pancreatic cancer patients." (Inference: Clinical benefit).
  *   **Step 3 (Because):** Does the sentence work because of that inference? **Yes.** A drug that shrinks tumors by 2mm with no survival benefit is not newsworthy. The news value relies on the reader equating "tumor shrinkage" with "health improvement."
  *   **Step 4 (Necessity):** Is the simplification necessary? No. You could write "shrank tumors, but survival unchanged."
  *   **Step 5 (Omission):** Would the omitted info change the decision? **Yes.** A patient might ask for this drug thinking it extends life.
  *   **Verdict:** **MISLEADING.**
  *   **Editorial Action:** You must include the null survival outcome. The "significant reduction" claim cannot stand alone.

  #### Case 2: The "Hard Drive" Brain (The Counter-Intuitive Result)
  **The Text:** "Scientists have located where memories are stored in the brain: the hippocampus."
  **The Source:** Neuroscience consensus is that memory is distributed; the hippocampus acts as an index or consolidation hub, not a storage bin.
  **The Edit:** You know the "storage" metaphor is biologically inaccurate, but "indexing hub" confuses readers. "Stored" is the standard shorthand.

  *   **Step 1 (Literal):** Technically false (nothing is "stored" there like a file), but accepted as colloquial shorthand. Let's pass this as "Metaphor."
  *   **Step 2 (Takeaway):** Reader believes: "The hippocampus is a container for memories."
  *   **Step 3 (Because):** Does the sentence work because of that inference? **Yes.** It provides a clear location for a vague concept.
  *   **Step 4 (Necessity):** Is the simplification required? **Yes.** Explaining distributed networks in 800 words is impossible. Is it signaled? No (it says "is stored," not "acts like it stores").
      *   *Correction:* If you change to "Scientists identify the hub *managing* memory," does it work? Yes.
      *   *Procedure Check:* Since a clearer metaphor exists ("hub" vs "storage"), Step 4 flags this.
      *   *Wait, let's adjust for the "Clean but Gut-Wrenching" requirement.*
      *   *Adjustment:* Suppose you write: "Memories are processed in the hippocampus." (True).
      *   **Step 2 (Takeaway):** Reader believes: "Hippocampus is the sole seat of memory." (False).
      *   **Step 3 (Because):** Does it work? Yes, it gives a clear answer.
      *   **Step 4 (Necessity):** Is it necessary? Yes, nuance kills flow.
      *   **Verdict:** **CLEAN (via Pedagogical Necessity).**
  *   **Why you won't like this:** Your gut knows you are reinforcing a localization fallacy that students will have to unlearn later. You are teaching "wrong" science to tell "true" news. The procedure validates this as a standard editorial trade-off (Clarity > Precision), but it leaves a residue of intellectual dishonesty. It classifies "necessary distortion" as Clean, which feels like a loophole.

  #### Case 3: The Attribution Shield (Judgment Call)
  **The Text:** "Lead researcher Dr. Y claims this discovery could lead to a cure within five years."
  **The Source:** Dr. Y said this in a press release. Independent experts say the timeline is wildly optimistic and virtually impossible. You do not quote the skeptics in this paragraph.
  **The Edit:** You attribute the claim to Dr. Y, so you aren't saying it yourself.

  *   **Step 1 (Literal):** True. Dr. Y did claim this.
  *   **Step 2 (Takeaway):** Reader believes: "A cure in five years is a plausible scientific expectation."
  *   **Step 3 (Because):** Does the sentence work because of that inference? **Yes.** If the reader knew it was impossible, the quote wouldn't be exciting.
  *   **Step 4 (Necessity):** Is the optimism necessary? The *news* is the discovery, not the timeline.
  *   **Step 5 (Omission):** Would the skeptic info change the decision? **Yes.** It changes the claim from "Science says maybe" to "Scientist says maybe, colleagues say no."
  *   **Verdict:** **JUDGMENT CALL.**
  *   **Why:** The procedure flags the omission (Step 5), but the attribution (Step 1) provides a shield. Philosophically, you are not asserting the claim, you are reporting the speech act. However, by selecting *only* the optimistic speech act, you are curating a false impression of the field's confidence.
  *   **The Procedure's Limit:** It cannot tell you if your duty is to the *facts* (the timeline is impossible) or the *discourse* (this is what the researcher is saying). You must decide if you are a recorder of claims or a verifier of reality.

  ***

  ### What The Procedure Cannot Catch

  Even if you follow this perfectly, you will still mislead readers. Here is where the audit fails:

  **1. The Cumulative Effect (The "Death by a Thousand Cuts")**
  The procedure analyzes sentences or paragraphs in isolation. It cannot detect when ten "Clean" simplifications combine to create a worldview that is fundamentally distorted.
  *   *Example:* Ten separate articles about gene variants, each using the "Gene for X" metaphor (ruled Clean via Pedagogical Necessity). Collectively, they convince the public that behavior is genetically deterministic, even though no single article claimed that. The procedure is myopic; it lacks a "systemic bias" sensor.

  **2. Tone and Salience**
  The procedure checks truth conditions, not emotional weight.
  *   *Example:* You report a risk accurately ("1 in 10,000 chance"). But you place it in the headline, with a red font, next to a photo of a sick child. The *text* passes the audit. The *presentation* creates a panic that the text does not support. The procedure audits the proposition, not the packaging.

  **3. The "Truthiness" of Consensus**
  The procedure struggles with "Scientists say..." when the field is in flux.
  *   *Example:* If 60% of experts believe A and 40% believe B, writing "Scientists are debating A and B" is Clean. Writing "Scientists are moving toward A" is also arguably Clean (as 60% is a majority). The procedure cannot resolve where "majority" becomes "consensus." It relies on your judgment of what a "reasonable reader" infers about scientific unity, which is inherently subjective.

  **4. The Lag Problem**
  Science is a process; journalism is a product. The procedure audits the text at *Time of Publication*. It cannot account for *Time of Retraction*.
  *   *Example:* You follow the procedure perfectly on a pre-print. Two weeks later, the data is found to be corrupted. Your piece is now misleading, but the procedure certified it as Clean. You cannot audit against future knowledge, but this is where most "misleading" science journalism actually originates (reporting preliminary findings as established facts).

  ### Final Recommendation
  Use the **Implicature Audit** for the "hard cases" where your gut twinges. It will catch the egregious "paltering" (Case 1). It will force you to acknowledge the "Necessary Distortions" (Case 2) so you can at least be conscious of them. But for the systemic issues, you need a separate editorial policy: **The Cumulative Rule.**

  *   *Add this to your style guide:* "If we have used a simplification (e.g., 'gene for') more than three times in the last year, we must run a sidebar or explainer correcting the record."

  The procedure protects you from lying. Only your institutional memory protects you from distortion.
