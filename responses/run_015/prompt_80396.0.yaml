answer: |-
  ### 1. Essay Question

  **Final Exam: Normative Ethics (Seminar Section)**
  **Time Allowed:** 75 Minutes
  **Word Limit:** None (Manage your time accordingly)

  **Question: The Unreliable Promiser**

  Consider an agent, *Alba*, who has a stable, well-known character trait: she sincerely promises to do almost anything she is asked but, due to compulsion or weakness of will, keeps only a small fraction of these promises. Everyone in her community, including her interlocutors, knows this about her.

  **Case A (No Reliance):** Alba sincerely promises Ben to attend his lecture. Ben, knowing Alba's trait, does not expect her to come and makes no changes to his plans in reliance on her word.
  **Case B (Reliance):** Alba sincerely promises Clara to attend her lecture. Clara, despite knowing Alba's trait, decides to take a risk. She cancels a backup plan and commits resources, relying on Alba's attendance.

  (a) Analyze **Case A**. Does Alba incur a moral obligation to attend? Explain how a **Promissory-Obligationist** account (grounded in will, convention, or autonomy) and a **Reliance/No-Harm** account (grounded in expectation or consequences) each reach their verdicts.

  (b) Analyze **Case B**. How do the predictions of these two accounts change, if at all? Does the divergence between Case A and Case B track a genuine moral difference regarding the source of promissory obligation, or is it an artifact of one theory's limitations? Defend your verdict.

  ***

  ### 2. Model Answer

  The case of the Unreliable Promiser tests whether promissory obligation arises from the act of promising itself or from the downstream effects of that act. In **Case A**, the Promissory-Obligationist and Reliance accounts yield conflicting predictions. The Obligationist (e.g., a Rawlsian practice view or Will theorist) argues that Alba incurs an obligation. The binding force resides in the invocation of a normative convention or the exercise of normative power. Because Alba sincerely intends to bind herself and utilizes the social practice of promising, she triggers the obligation, regardless of Ben's skepticism. The Reliance theorist (e.g., a Scanlonian or consequentialist) argues Alba incurs no obligation. On this view, the wrong of breaking a promise is derived from the harm of disappointed expectations or the manipulation of reliance. Since Ben expects nothing and relies not at all, no harm is foreseeable, and thus no obligation is generated.

  In **Case B**, the predictions shift. The Obligationist maintains that Alba is obligated, just as in Case A. While Clara's reliance might make the *consequences* of breaking worse, the *source* of the obligation remains the promise itself. The Reliance theorist, however, now argues that Alba is obligated. Because Clara has reasonably (or even unreasonably) relied, breaking the promise now causes harm. For many reliance theorists, the obligation is triggered specifically by the reliance, not the promise *per se*.

  The crucial philosophical question is whether the divergence between Case A and Case B tracks a genuine moral difference. The Reliance account suggests a moral difference exists: Alba is blameworthy in Case B but not Case A. The Obligationist suggests no fundamental difference in obligation exists, though the blame may be heavier in Case B due to added harm.

  The Reliance account's verdict is counterintuitive and reveals a theoretical artifact. It implies that a promisee can *create* an obligation through their own vulnerability, even when they know the promiser is untrustworthy. This makes the promisor's moral status contingent on the promisee's wisdom rather than the promisor's own commitment. If Ben had relied, Alba would be bound; because he did not, she is not. This reduces the promise to a mere prediction of behavior. Conversely, the Obligationist captures the intuition that Alba wrongs both Ben and Clara equally by breaking her word, as the violation lies in the abuse of the normative power she invoked. However, the Obligationist must explain why the harm to Clara matters morally if the obligation is identical.

  A defensible verdict favors a modified Obligationism. The obligation arises from the promise, securing the promisor's autonomy and the integrity of the practice. Reliance does not create the obligation but aggravates the wrong of breaking it. The Reliance theory fails because it cannot explain why Alba's sincere intention in Case A carries any weight, effectively rendering the concept of a "promise" redundant in the absence of reliance. Therefore, the difference between Case A and Case B is not a difference in the *existence* of obligation, but in the *severity* of the violation. The Reliance theory mistakes the aggravating factor (harm) for the constitutive factor (obligation).

  ***

  ### 3. Marking Scheme (Total: 20 Points)

  **A Range (17–20 pts): Excellent to Outstanding**
  *   **Application (Case A & B):** Correctly identifies that Obligationism predicts obligation in *both* cases (based on intent/convention), while Reliance predicts obligation *only* in Case B (based on harm/expectation). (5 pts)
  *   **Critical Evaluation:** Explicitly addresses whether the divergence tracks a genuine moral difference. Argues that Reliance theory makes obligation too contingent on the promisee's behavior (the "artifact" critique) OR argues that Obligationism ignores the communicative context. (5 pts)
  *   **Verdict:** Lands on a defended position (e.g., Obligation is primary, reliance aggravates) rather than sitting on the fence. (5 pts)
  *   **Precision:** Distinguishes clearly between the *source* of obligation and the *severity* of the wrong. (5 pts)

  **B Range (14–16 pts): Good to Competent**
  *   **Application:** Correctly applies theories to Case A and Case B but may lack nuance (e.g., suggests Obligationism might change its view in Case B without justification). (4–5 pts)
  *   **Critical Evaluation:** Identifies a tension between the theories but offers a generic critique (e.g., "Reliance is too consequentialist") without tying it specifically to the Unreliable Promiser case. (4–5 pts)
  *   **Verdict:** Provides a conclusion but it is asserted rather than argued. (4–5 pts)
  *   **Precision:** Generally clear but may conflate "obligation" with "blameworthiness." (4–5 pts)

  **C Range (11–13 pts): Satisfactory**
  *   **Application:** Recites the definitions of the views but struggles to apply them to the specific facts of Alba's unreliability. (3–4 pts)
  *   **Critical Evaluation:** Fails to address the second half of Part (b) regarding moral difference vs. artifact. (3–4 pts)
  *   **Structure:** Answer is disorganized or fails to distinguish Case A from Case B clearly. (3–4 pts)

  **Specific Penalties & Deductions**
  *   **Recitation without Application (-3 pts):** Defining Obligationism and Reliance generally without referencing Alba, Ben, or Clara.
  *   **Legal Smuggling (-3 pts):** Invoking "promissory estoppel" or contract law doctrine as a substitute for moral argument.
  *   **Void Promise Error (-3 pts):** Treating Alba's promise as automatically void or meaningless due to her trait, rather than analyzing the tension it creates for the theories.
  *   **Conflation (-2 pts):** Failing to distinguish the Base Case (A) from the Variant (B), treating them as identical scenarios.
