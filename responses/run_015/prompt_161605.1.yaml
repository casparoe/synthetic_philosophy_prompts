answer: |-
  Based on the pattern of verdicts and her explicit reliance on David Lewis, here is the breakdown of what is likely happening in your tutor's blog, the prediction for the new case, and how to test it.

  ### 1. The Prediction: Will she say Yes?
  **Yes.** She will almost certainly rule this as valid penal substitution.

  **Why?**
  Her Lewisian gloss ("doctrinal terms get filled by whatever plays the right role") combined with the specific wording of your new case points to **Forensic Functionalism**.

  In Case 3 (the "travesty"), the volunteer served the *sentence*, but there is no indication the *guilt* was transferred. He remained a "random volunteer" suffering *for* the murderer. In Reformed theology (which Lewis is analyzing), this is insufficient; the substitute must be *made sin* (2 Cor 5:21).

  Your new case adds the crucial mechanic: **"the court formally transfers the conviction... by a public legal act of imputation, so that from then on he counts as the convict."**
  This satisfies the Lewisian requirement. The "role" of the sinner is functionally filled by the stranger via the legal mechanism. If the Law says he *is* the convict, then for the purposes of the story, he *is* the convict. To deny this would undermine the doctrine of imputation she is likely trying to vindicate.

  ### 2. The Implicit Rule She Is Running
  **Rule: Valid Forensic Transfer.**
  Penal substitution occurs when the governing authority validly transfers the *liability* (not just the suffering) from the guilty to the willing substitute, provided the substitute consents.

  *   **Fits Case 1 (Fine):** Liability is monetary/transferable; court accepts.
  *   **Fits Case 2 (Father/Son):** Natural headship validates the transfer of liability.
  *   **Fits Case 3 (Random Volunteer):** **FAILS.** The judge agreed to the *suffering*, but a random stranger cannot bear the *liability* of murder without a representational link. It's scapegoating, not substitution.
  *   **Fits Case 4 (Clan Chief):** Corporate headship validates the transfer.
  *   **Fits Target Case:** The "legal act of imputation" *creates* the representational link that Case 3 lacked.

  ### 3. Alternative Rules That Fit the Data
  Your guess (Pre-existing Union) is strong, but there are two other contenders that fit the existing verdicts just as well.

  **Alternative A: The Fungibility Constraint**
  *   **Rule:** You can only substitute for penalties that are externally detachable from the person (fines, exile), unless there is a "Headship" relationship (Father, Chief, Lawgiver).
  *   **Fits Data:** Explains why Friend/Fine works (money is fungible). Explains why Random/Life Sentence fails (life is not fungible, no headship). Explains why Father/Chief works (Headship overrides fungibility).
  *   **Prediction for Target:** **NO.** A legal piece of paper cannot make a life sentence fungible between strangers. The "travesty" of Case 3 wasn't the lack of imputation, it was the swapping of lives between unconnected individuals.

  **Alternative B: Ontological Union (Your Hypothesis)**
  *   **Rule:** There must be a real, pre-existing bond (blood, friendship, covenant) between substitute and sinner.
  *   **Fits Data:** Friend (Yes), Father (Yes), Chief (Yes), Random (No).
  *   **Prediction for Target:** **NO.** A legal fiction does not create a *real* union. If the union must be "real" (ontological) rather than "declared" (forensic), the imputation act is just paperwork.

  ### 4. The Discriminating Case
  To tell these rules apart, you need a case where **Legal Status** and **Ontological Reality** come apart.

  **The Case: "The Instant Adoption"**
  > A convict is sentenced to flogging. A stranger with no prior tie consents to take the punishment. Before the sentence is carried out, the Judge legally adopts the stranger as the convict's brother *on the spot*. The Judge then rules the substitution valid based on this new familial status.

  *   **If she says YES:** She is running **Forensic Functionalism**. The legal act *constitutes* the union. The "role" is filled by the legal declaration. (This aligns with Lewis and standard Imputation theology).
  *   **If she says NO:** She is running **Ontological Union** or **Fungibility**. The bond was too artificial or recent to be "real." The legal act cannot override the metaphysical reality of them being strangers.

  **The Case: "The Mercenary"**
  > A stranger is paid a vast sum to undergo the "Target Case" scenario (formal imputation, public punishment). He consents purely for the money, with no remorse for the crime and no love for the convict.

  *   **If she says YES:** She is a strict **Lewisian Functionalist**. The internal motive doesn't change the forensic role.
  *   **If she says NO:** She is smuggling in a **Moral Condition** (charity/love) that isn't explicit in her other verdicts (note that Case 5 allows for unrepentant beneficiaries, but doesn't specify the substitute's motive).

  ### 5. Why This Makes Her Verdicts Look "Weird"
  If she says **YES** to the Target Case (as I predict), she is committed to a view that makes **Guilt purely nominal.**

  It implies that a Judge can make an innocent man *guilty* of a murder he did not commit, simply by declaring it so, provided the man consents.
  *   **The Weirdness:** This detaches moral responsibility from action entirely. In Case 3, she called it a "travesty" to punish a random volunteer. But in the Target Case, the volunteer is *still* a random volunteer regarding the *action*, only connected by the *label*.
  *   **The Tension:** If the "travesty" of Case 3 was that it violated justice to punish an innocent, the Target Case *also* punishes an innocent (factually), but calls him guilty (legally). If she accepts the Target Case, she admits that **Justice is satisfied by Legal Fiction**, not by actual desert.

  This is the exact tension Lewis highlights: Penal substitution is only coherent if you accept that the Lawgiver has the authority to redefine identity. If she balks at the Target Case, she undermines the Lewisian defense she claims to be using. If she accepts it, she admits that "justice" in this system is purely procedural, not retributive in the standard sense.

  **Summary:** Bet on **YES**. Her Lewisian commitments require her to accept that the "legal act of imputation" is sufficient to fill the doctrinal role, even if it feels like a fiction. The "Instant Adoption" case is your best tool to prove whether she values the *legal role* or the *relational reality*.
