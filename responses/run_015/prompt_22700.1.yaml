answer: |-
  Here is a sequence of seven questions designed to probe the strictness of the duty to aid, tailored to your role as a moderator and the specific critiques you've noted in the panelist's work.

  **1. The Moral Kind of the Duty**
  "Your central argument relies heavily on the intuition pump of the drowning child. You argue that because we accept a strict duty to save the child in the pond, we must accept a strict duty to donate to effective charities. However, critics often argue that while the *outcome* (a life saved) is identical, the *moral kind* of the interaction differs due to proximity and immediacy. Do you maintain that the duty to save the nearby drowning child is of the exact same moral kind as the duty to give to distant strangers, or does the mediation of institutions change the nature of the obligation itself?"

  *   **Follow-up:** "If you maintain they are the exact same moral kind, how do you account for the difference in epistemic certainty? In the pond case, I know my action will save *this* child. In the charity case, I am buying a probability. Does that uncertainty not degrade the strictness of the duty, even if the principle remains the same?"

  **2. Negative vs. Positive Duties**
  "Relatedly, traditional deontological distinctions often hinge on the difference between negative duties (not to harm) and positive duties (to aid). Your view seems to collapse this distinction, suggesting that letting die is morally equivalent to killing in these contexts. Does the strictness of the duty you propose depend entirely on classifying these cases as omissions that are functionally commissions? If we were to retain a morally relevant distinction between harming and failing to aid, would your duty remain strict, or would it slide toward the supererogatory?"

  *   **Follow-up:** "You'll likely argue the distinction is morally irrelevant. But if we accept that distinction for legal or social enforcement purposes, does that create a gap between what is morally ideal and what can be strictly demanded? In other words, can a duty be morally strict but socially unenforceable without losing its 'strictness'?"

  **3. Defining "Modest" Sacrifice**
  "You attempt to mitigate the demandingness objection by limiting the duty to 'modest' sacrifices rather than all surplus income. However, 'modest' is a subjective term; a sacrifice that is modest for a tenured professor might be significant for an adjunct. Who gets to draw that line? Is the threshold of 'modesty' determined by the agent's subjective feeling of loss, or by an objective standard of welfare, and how does this variability impact the universality of the duty?"

  *   **Follow-up:** "If the line is drawn objectively, say at a specific income percentile, aren't you risking a rigid rule that ignores individual context? But if it is left to the agent, doesn't that invite the very self-serving bias the duty is meant to overcome? How do we prevent 'modest' from becoming a loophole?"

  **4. The Arbitrary Distance Objection**
  "In your book, you respond to the arbitrary distance objection by stating that physical distance is a matter of 'practical efficacy, not of moral kind.' Many find this dismissal too quick, as it seems to bypass the sociological and psychological realities of moral motivation. If practical efficacy varies significantly by distance—for example, due to corruption or logistical failure in distant regions—does the *stringency* of the duty not vary proportionally? Why should the duty remain strict if the efficacy is uncertain?"

  *   **Follow-up:** "So, are you suggesting that the duty is strict *regardless* of the probability of success, provided the cost is modest? If I can save a life nearby with 99% certainty or a life far away with 10% certainty at the same cost, is the strictness of the obligation identical in both cases?"

  **5. Individual vs. Institutional Agency**
  "Much of the literature on global justice suggests that the primary duty bearers for systemic poverty are institutions, not individuals. If we assume that a just global order would institutionalize aid, does the strictness of the *individual* duty depend on the current failure of those institutions? In a world where institutions were functioning justly, would your strict individual duty disappear, or does it remain as a backup obligation?"

  *   **Follow-up:** "If it remains as a backup, doesn't that place a disproportionate burden on the morally conscientious in an unjust world? Does the strictness of the duty inadvertently punish those who are most willing to comply while others free-ride?"

  **6. Stability and Compliance**
  "Moving to the stability of the moral theory: If a moral duty is so strict that it leads to widespread non-compliance or psychological burnout among agents, does that feedback loop count against the validity of the duty itself? Some argue that a moral theory must be action-guiding and sustainable to be valid. Does the strictness you propose risk undermining its own uptake by demanding too much of human psychology?"

  *   **Follow-up:** "If empirical psychology shows that setting the bar at 'strict duty' actually reduces total giving compared to setting it at 'supererogatory ideal,' would you be willing to adjust the strictness of the duty to maximize actual good, or is the truth of the duty independent of its consequences?"

  **7. Evidence Against Strictness**
  "Finally, I'd like to ask about the falsifiability of your position. We often talk about what evidence supports a duty, but I want to ask what would count *against* it. What specific empirical finding or philosophical argument would compel you to concede that the duty to aid distant strangers is merely supererogatory rather than strict? Is there any scenario where the cost is modest, the efficacy is high, and yet you would agree there is no strict obligation?"

  *   **Follow-up:** "If the answer is 'nothing,' does that risk insulating the view from critical revision? If the strictness of the duty is immune to empirical evidence regarding human capacity or social outcomes, are we discussing a moral truth or a dogmatic constraint?"
