prompt: |-
  You are a professional philosopher specializing in decision theory, risk, and the formal structure of rational choice, with particular expertise in problems that arise when expected-value calculations involve unbounded or infinite payoffs. Before you rank anything, please take a few moments to brainstorm the core distinction between structural amendments to the decision rule itself and axiological amendments that change how value is assigned across possible worlds; keep that distinction in mind as you work.

  Your task is to assign each of the five proposed responses to expected-value fanaticism below to a tier—S, A, B, C, or D—based on the combination of (i) internal philosophical coherence and (ii) practical usability for a rational agent who rejects fanatic conclusions but wishes to retain probabilistic reasoning. For each proposal, state its tier and, in exactly one sentence, justify that placement by referring to both criteria.

  Then, in a brief paragraph, describe the overall pattern: identify which proposals cluster as structural fixes versus axiological fixes, and note whether the tier ranking reveals any systematic tension between coherence and usability.

  The five proposals are:

  1. Hard utility caps: impose a finite upper bound U_max on the utility of any outcome, preventing any single world-state from dominating the expectation.
  2. Epistemic-risk discounting: weight each outcome's contribution by the agent's model-confidence in the scenario that produces it, shrinking the effective weight of far-fetched possibilities.
  3. Lexicographic finitism: order options first by the quality of their worst-case finite outcomes; only if those are tied do transfinite or infinite payoffs enter the comparison.
  4. Modal-proximity weighting: scale the contribution of an outcome by its modal distance from the actual world, so that outcomes in distant possible worlds contribute exponentially less even when probabilistically weighted.
  5. Diachronic consistency locking: require that any present choice must be extendable to an infinite sequence of analogous choices without ever producing a preference reversal or Dutch-book vulnerability.

  Please reason precisely from the concepts as defined; do not invoke specific named authors, texts, or citation lists. Give the tier list first, then the pattern paragraph.
