  **Tier List**

  1. **Hard utility caps:** Tier S. This axiological amendment guarantees mathematical convergence and remains highly usable because it requires only a simple parameter adjustment without altering the underlying calculus of probability.
  2. **Epistemic-risk discounting:** Tier A. This structural adjustment is practically intuitive for skeptical agents but risks internal incoherence if the confidence discount is not rigorously distinguished from the probability estimate itself.
  3. **Diachronic consistency locking:** Tier B. This structural constraint provides strong dynamic coherence but limits usability because verifying consistency across an infinite sequence of choices is computationally intractable for finite agents.
  4. **Lexicographic finitism:** Tier C. While logically consistent in avoiding infinite comparisons, this structural rule drastically reduces usability by violating continuity axioms that enable standard trade-offs between risk and reward.
  5. **Modal-proximity weighting:** Tier D. This axiological modification lacks coherence due to the metaphysical ambiguity of modal distance and offers negligible usability since agents cannot empirically measure proximity to possible worlds.

  **Pattern Analysis**

  The proposals cluster into axiological fixes (1 and 4), which modify the value assigned to outcomes, and structural fixes (2, 3, and 5), which alter the decision rule or probability weighting itself. The ranking reveals a systematic tension where the most usable solutions are axiological, specifically the hard utility cap, whereas structural amendments that maintain axiological purity regarding unbounded value tend to suffer from reduced practical usability or formal complexity. This suggests that for an agent wishing to retain probabilistic reasoning while avoiding fanaticism, modifying the value function is more tractable than reconstructing the logical architecture of choice, as the highest-ranked structural option still falls below the axiological cap in overall utility for decision-making.
