  Ms. Alverez, a high school teacher, reviews Leo's file and sees poor grades, but she recalls robust educational research showing that when teachers genuinely hold high expectations for students, those students' performance reliably improves through increased confidence and engagement. Deciding to adopt this mindset, she tells her colleague, "I have reason to think Leo is capable," explaining that treating him as such brings out the capability. She would not offer this reason if Leo's success were unimportant to her, yet by adopting the belief she ensures that the proposition "Leo is capable" becomes factually correct.

  **Verdicts and Reasoning**
  The **Source Test** returns a **Wrong Kind Reason** verdict. The normative force of Ms. Alverez's consideration derives exclusively from the value of the outcome (Leo's success); if the success lacked value, the reason would evaporate, marking it as pragmatic rather than evidential. The **Fittingness Test** returns a **Right Kind Reason** verdict. Because the belief causally produces the fact it represents, the consideration bears directly on the truth of the proposition "Leo is capable," satisfying the condition that evidence must relate to the attitude's correctness.

  **Feature and Removal**
  The divergence relies entirely on the **performative nature of the belief** (the self-fulfilling mechanic). If you remove this feature—assuming the belief had no causal impact on Leo's performance—the Fittingness verdict flips to Wrong Kind (it no longer bears on truth), while the Source verdict remains Wrong Kind (or evaporates), collapsing the divergence and restoring alignment between the tests.

  **Right Verdict**
  The **Source Test** provides the correct philosophical grip. Even when a belief makes itself true, if the *ground* for holding it is the value of the outcome rather than independent evidence, it remains a pragmatic reason to cultivate the state, not an evidential reason that the state is already accurate. This preserves the crucial distinction between "it is good to believe" and "there is evidence to believe," which is essential for your article's theme.

  **Attack from the Other Side**
  A defender of the Fittingness Test would argue that **truth-conduciveness is sufficient for evidential status**. They would claim that if a consideration guarantees the truth of the proposition, it functions as evidence regardless of its pragmatic origin, and that excluding such reasons arbitrarily limits the scope of rational belief to passive observation rather than active participation in shaping reality.
