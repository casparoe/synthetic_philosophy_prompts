  9.  **Final Output Structure:**
      *   Introduction: Validate the debate.
      *   The Descriptive Thesis (Force and Custom): What is consensus.
      *   The Normative Framework (Divine Justice): What is consensus.
      *   The "Performative Contradiction": Addressing the friend's specific logical challenge.
      *   Established vs. Contested: A clear breakdown.
