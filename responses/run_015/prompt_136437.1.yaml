      *   *The "Hole":* The equivocation is on the word "You." In (1), "You" is a timeless optimizer. In (4), "You" is split into temporal slices. You can't have it both ways.
      *   *Best Step to Reject:* (1) is the most fundamental error. It's the "Option Value Fallacy" in the context of self-control.
