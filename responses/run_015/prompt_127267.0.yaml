answer: |-
  You have done excellent work distinguishing these nuances. Your suspicion is correct: D. is relying on a slide between claims, specifically moving from an epistemic limitation (we cannot agree on justice) to an ontological conclusion (therefore force defines justice) to a normative command (therefore you must obey). This chain does not hold without extra premises.

  Here is the refined menu of readings. I have kept your labels where they hold, collapsed your Settlement Principle into Reading 7 (as it is a version of procedural obligation), and added one necessary distinction (Reading 8).

  1.  **The Empirical Inefficacy Reading**
      *   **Claim:** A rule recognized as just will not be followed in practice unless there is power to enforce it.
      *   **Kind:** About how the world works (empirical/sociological).
      *   **Status:** Platitude (generally true, but obvious).
      *   **Outcome:** Pay Fine (implies enforcement is inevitable, so resistance is futile).

  2.  **The Conceptual Necessity Reading**
      *   **Claim:** Coercion is part of the definition of law; a norm without sanction is not a law and creates no legal obligation.
      *   **Kind:** About what our words mean (conceptual/legal theory).
      *   **Status:** Substantive and defensible (within legal positivism), but does not settle moral obligation.
      *   **Outcome:** Pay Fine (legally binding), but leaves moral refusal open.

  3.  **The Epistemic Skeptic Reading**
      *   **Claim:** Because humans cannot agree on what justice is, we must accept the decision of force as the only workable proxy.
      *   **Kind:** About what we owe (normative based on epistemic limitation).
      *   **Status:** Substantive but probably false (disagreement does not entail there is no truth, nor that power decides it).
      *   **Outcome:** Pay Fine (quietism).

  4.  **The Ontological Reduction Reading**
      *   **Claim:** Justice is nothing other than what the powerful establish; there is no independent standard.
      *   **Kind:** About what our words mean (moral ontology).
      *   **Status:** Substantive but probably false (contradicts the second half of the sentence which calls force without justice "tyrannical").
      *   **Outcome:** Pay Fine (might makes right).

  5.  **The Legitimacy Condition Reading**
      *   **Claim:** Force alone creates no moral obligation; coercion must answer to an independent standard of justice to be authoritative rather than tyrannical.
      *   **Kind:** About what we owe (moral/political obligation).
      *   **Status:** Substantive and defensible (captures the critical warning of the second half).
      *   **Outcome:** Refuse Fine (if the law is unjust, force is tyranny and does not bind conscience).

  6.  **The Priority of Order Reading**
      *   **Claim:** Even if a specific rule is unjust, the stability provided by enforcing rules is a greater good than the injustice of the rule.
      *   **Kind:** About what we owe (consequentialist).
      *   **Status:** Substantive and defensible (conservative pragmatism), but contingent on the severity of the injustice.
      *   **Outcome:** Pay Fine (unless the injustice is catastrophic).

  7.  **The Procedural Obligation Reading** (includes your Settlement Principle)
      *   **Claim:** You must comply with the settled decision of authorized institutions to maintain the system, even if you believe the decision is wrong, provided you use authorized routes to change it.
      *   **Kind:** About what we owe (deontological/civic).
      *   **Status:** Substantive and defensible (rule of law), but assumes the system itself is broadly just.
      *   **Outcome:** Pay Fine (compliance without belief).

  8.  **The Dual Requirement Reading**
      *   **Claim:** Legitimate authority requires both justice (to be right) and force (to be effective); lacking either, the claim to obedience fails.
      *   **Kind:** About what we owe (conditional obligation).
      *   **Status:** Substantive and defensible (balances both halves of the sentence).
      *   **Outcome:** Depends (requires judging whether the specific law meets the justice condition).

  ### Answers to your six questions

  (a) **Helpless how?** D. needs the normative claim (no obligation is created) to tell M. her conscience is invalid. The sentence supports the empirical claim (no compliance is achieved) or the legitimacy claim (no authority exists). The strongest claim (no obligation) is not supported by the text alone.

  (b) **Same sense of justice?** Yes, this is the slide. In the first half, justice is an independent standard that *needs* force. In D.'s usage, justice becomes *dependent* on force. If justice is independent, the first half is empirical; if dependent, the second half is nonsense (force without force is impossible). The sentence only works if justice is an independent standard.

  (c) **Whose force?** The sentence does not specify. If "whoever wins" defines justice, then a successful rebellion is just by definition. This makes the term "tyrannical" in the second half meaningless, because successful force could never be tyrannical. To avoid this, you must smuggle in an independent standard (Reading 5).

  (d) **Nobody can settle?** It means we keep disagreeing (epistemic). The step to "treat the settlement as authoritative" requires an extra premise about the value of peace or order (Reading 6 or 7). Skepticism alone does not mandate obedience.

  (e) **Treating as just?** D. needs acting as if it were just (compliance). The sentence supports refraining from relying on force alone (condemnation). It does not mandate belief.

  (f) **Does it apply to itself?** Yes. If force settles truth, D.'s argument is just an exercise of conversational force. If truth settles truth, D. must argue, not declare. This is a real difficulty for Reading 4 (Ontological Reduction), making it self-defeating.

  ### D.'s Position

  D. is usually reaching for a mixture of **Reading 3 (Epistemic Skeptic)** and **Reading 4 (Ontological Reduction)** to enforce **Reading 7 (Procedural Obligation)**. They argue that because we cannot know justice (3), justice is what power decides (4), so you must obey the power (7). This is a "Realist Quietism." It is intellectually unstable because if justice is only what power decides (4), then calling force without justice "tyrannical" (second half of the sentence) is meaningless. D. relies on the moral weight of the word "tyrannical" while denying the independent standard of justice required to make that word mean anything.

  Your suspicion is confirmed: the second half is a licence for resistance. It asserts that force without justice is *tyrannical*, which is a condemnation, not a description of validity. Reading 5 is the most defensible meaning that preserves the moral force of the sentence without collapsing into triviality or falsehood.

  \answer{5}
