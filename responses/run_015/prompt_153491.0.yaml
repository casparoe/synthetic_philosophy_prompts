prompt: |-
  I'm applying for a six-month interdisciplinary fellowship at the intersection of metaphysics and philosophy of biology, and I need a two-page proposal. My half-formed idea is this: the debate over origin essentialism has been conducted almost entirely within a framework of natural reproduction, where the necessary origin of a person is taken to be a specific sperm-egg pair. Yet with in vitro gametogenesis, synthetic embryos assembled from induced pluripotent stem cells, and other engineered reproductive technologies, an organism's causal history can now be traced to laboratory-manipulated cell lineages rather than to any particular gametes. This seems to expose a gap in both the standard essentialist arguments and the usual anti-essentialist responses, neither of which was designed for origins that are distributed, engineered, and reproducible in principle.

  Turn this into a formal proposal containing: (1) a precise philosophical question—does origin essentialism need to be revised to a form of 'lineage essentialism', does it collapse into a weaker historical-contingency claim, or does it fail altogether when origins are technologically mediated?—together with a clear statement of why existing essentialist and anti-essentialist positions leave it open; (2) the method and approach—conceptual analysis of 'origin' in synthetic biological contexts, comparison with actual biological practices of lineage tracking, and a reconstructed modal argument—plus an explicit defence of why this philosophical-conceptual approach is preferable to an empirical literature review or a purely logical formalisation, with a realistic month-by-month plan for six months; (3) what a successful result would look like (for instance, a revised essentialist thesis that accommodates engineered origins, or a principled demonstration that the thesis becomes vacuous) and what would count as failure (for instance, if the argument depends on an unsettled empirical claim about synthetic embryo viability that cannot be resolved conceptually); and (4) a brief justification that the scope is realistic for the fellowship period. Do not include a bibliography, reading list, or citations; I will supply those. Write in polished British English.
