answer: |-
  You have identified a precise and pernicious mechanism in the architecture of knowledge. There is no single canonical term that captures every nuance of what you describe, but the phenomenon sits at the intersection of sociology of knowledge, information science, and historiography.

  The closest established concept is Ulrich Beck's **Zombie Category**. However, that term is sociological and broad. For your specific context—where digital or cataloguing infrastructure enforces a refuted ontology—I propose we tighten this to **Infrastructural Reification**.

  Below is the definition, the distinctions you requested, and an analysis of the boundary cases and the problem of "laundering."

  ### 1. The Name and Definition

  **Established Analogue:** **Zombie Category** (Ulrich Beck).
  Beck used this to describe social categories (like "class" or "family") that are theoretically dead—no longer describing social reality—but institutionally alive, continuing to structure policy and perception.

  **Proposed Term:** **Infrastructural Reification**.
  While "reification" (treating an abstraction as a concrete thing) is the philosophical core, your description highlights the *mechanism*: the infrastructure (catalogs, tags, shelves, databases) does the work of keeping the zombie alive.

  **Definition:**
  **Infrastructural Reification** occurs when a classification system, originally built upon a theoretical claim that has since been refuted, persists due to institutional inertia. The system continues to organize material objects (books, manuscripts) in ways that generate *new* evidence supporting the refuted claim, thereby insulating the classification from the theoretical critique.

  **The Edges:**
  *   **It is not:** Mere tradition. (Tradition can be acknowledged as tradition.)
  *   **It is not:** Mere bias. (Bias is subjective; this is embedded in the system's logic.)
  *   **It is:** A material feedback loop where the *tool* validates the *theory* the tool was built on, even after the theory is abandoned by the users.

  ### 2. Differentiation from Neighbouring Concepts

  You asked to separate this from four specific concepts. Here is the boundary work:

  **A. Versus Theory-Ladenness of Observation**
  *   *Theory-ladenness* is epistemic inevitability: we cannot see without concepts. It is a condition of cognition.
  *   *Infrastructural Reification* is institutional contingency. We *could* tag the 1470 book "Incunabulum" or "Early Modern" or simply by date. The choice to tag it "Renaissance" is not a cognitive necessity but a database schema decision. Theory-ladenness is the lens; Infrastructural Reification is the frame that forces the lens to stay fixed even when we know the prescription is wrong.

  **B. Versus Vagueness or Political Loading**
  *   *Vagueness* implies the boundaries are fuzzy. Your problem is that the boundaries are *too sharp* (1470 is Renaissance, 1469 is not).
  *   *Political Loading* implies the term serves a power interest (e.g., colonial narratives). While Infrastructural Reification often *has* political origins (the Renaissance myth was indeed self-praise), the phenomenon you describe persists *after* the political motive is recognized and rejected. It persists due to convenience and system architecture, not active ideological enforcement.

  **C. Versus Hacking's Looping Effects (Making Up People)**
  *   Ian Hacking's *looping effects* describe how classifying *people* changes how they act, which changes the classification.
  *   You correctly note that 15th-century books do not change behavior. However, the *corpus* changes. When you tag a book, you change its *neighbors*, its *searchability*, and its *interpretive context*.
  *   *Distinction:* Hacking's loop is psychological/behavioral (the classified reacts). Infrastructural Reification is topological/archival (the classified is moved). The book doesn't change; its *relations* change, and scholarship treats those relations as intrinsic properties.

  **D. Versus Self-Fulfilling Prophecy**
  *   A *self-fulfilling prophecy* is predictive: "This bank will fail" causes a run that makes it fail.
  *   Your phenomenon is *retrospective*: "This era was distinct" causes us to sort evidence so it looks distinct.
  *   Crucially, in a prophecy, the outcome is uncertain until the end. In Infrastructural Reification, the outcome is *designed* into the schema. It is not a prophecy; it is a **hard-coded assumption**.

  ### 3. Boundary Cases: Why Some Labels "Get Away With It"

  You ask about the *Long Nineteenth Century* (harmless) vs. *Late Antiquity* (acquired thick content). The principled line is **Declared Conventionality**.

  *   **The Long Nineteenth Century:** This label functions as a **Heuristic Container**. Scholars using it explicitly acknowledge the arbitrariness of the endpoints (1789–1914). The infrastructure built around it (syllabi, series titles) tends to be loose. The label does not claim to discover a metaphysical break; it claims to offer a convenient span for analysis.
  *   **Late Antiquity / Renaissance:** These function as **Ontological Claims**. Even if scholars verbally deny the "break," the infrastructure treats the break as real. A book is *either* Medieval *or* Renaissance. A journal accepts papers *on* Late Antiquity, implying Late Antiquity is a *subject*, not a *timespan*.

  **The Mechanism of Thickening:**
  A label acquires "thick content" when it becomes **Grant-Eligible**. Once a category supports fellowships, named professorships, and dedicated journal issues, it must behave like a natural kind to justify the funding. *Late Antiquity* started as a thin descriptor (Peter Brown's "world of late antiquity") but had to thicken to sustain the institutes built in its name.

  **Principled Line:**
  A label is safe if its **infrastructure admits its own artificiality**.
  *   *Safe:* "Box 4: 1800–1850."
  *   *Unsafe:* "The Romantic Period." (Implies a spirit shared by all items in the box, which dictates what gets put in the box next).

  ### 4. The Laundering Question: Can We Tell from the Inside?

  You ask if we can tell whether a label has been successfully laundered (cleansed of its discredited origins).

  **The Short Answer:** No.
  **The Long Answer:** You cannot tell from the inside because the "clean" data is produced by the "dirty" filter.

  However, you can apply the **Genealogical Stress Test**. To determine if a label is laundered, you must attempt to define its inclusion criteria *without* referencing the discredited narrative.

  *   *Test Case: Renaissance.*
      *   *Discredited Narrative:* Rebirth of classical learning, break from scholasticism.
      *   *Attempted Laundry:* "Books printed after 1450 with humanist typefaces."
      *   *Failure:* Many books with humanist typefaces contain scholastic content. Many "medieval" texts were printed in "Renaissance" type. If you cannot define the category without smuggling in the "break" (e.g., "books that feel less medieval"), the label is not laundered.

  *   *Test Case: Long 19th Century.*
      *   *Definition:* "Books published between 1789 and 1914."
      *   *Result:* Passes. The definition relies on external political dates, not an asserted cultural essence.

  **The Epistemic Trap:**
  If your corpus *already* exists (tagged by predecessors), you cannot tell. The bias is baked into the dataset. The only way to verify is to **re-tag a sample subset** using a neutral schema (e.g., strict date ranges or feature-based clustering) and compare the results. If the "Renaissance" cluster disappears under neutral tagging, the label was not laundered; it was merely inherited.

  ### Summary Recommendation for Your Project

  You are dealing with **Infrastructural Reification**.

  1.  **Acknowledge the Zombie:** In your methodology, explicitly state that period labels are used as *access points*, not *ontological claims*.
  2.  **Break the Feedback Loop:** Do not allow the period tag to be the primary metadata field for clustering. Use it for retrieval, but use feature-based metadata (language, format, subject) for analysis.
  3.  **The "Late Antiquity" Warning:** Be wary of any label that begins to attract its own funding or institutional identity. That is the moment a heuristic turns into a reification.

  You are correct that the objects cannot be pushed around. But the *pathways to the objects* are being paved, and you are noticing that the maps are drawing roads that do not exist on the ground, yet everyone drives on them anyway. That is Infrastructural Reification.
