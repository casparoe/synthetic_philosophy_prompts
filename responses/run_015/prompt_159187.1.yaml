          *   *Answer-Only View:* CoT is "scratchpad." Ephemeral. Like a developer's whiteboard before coding.
          *   *Debug/Penalty View:* CoT is "testimony." Truthful account of internal state.
          *   *The Contradiction:* You can't have it both ways. If it's just scratchpad, why punish "bad thoughts"? If it's testimony, why not reward "good thoughts"?
      *   **Section 2: Epistemological Assumptions:**
          *   *Answer-Only (Reliabilism/Consequentialism):* Truth is defined by correspondence with reality (the test case). Justification is unnecessary. Assumes robustness comes from output constraints, not internal logic.
          *   *Step-Level (Internalism/Process):* Truth requires justification. A lucky guess is not knowledge. Assumes robustness comes from correct causal chains.
      *   **Section 3: The Inconsistency (The "Asymmetric Liability"):**
          *   This is the core insight. The CoT is a **liability sink** but not an **asset source**.
          *   It's treated as a legal confession: admissible to convict, inadmissible to acquit.
          *   Why? Safety vs. Capability. Safety cares about intent (CoT). Capability cares about utility (Answer).
      *   **Section 4: Concrete Pipeline Changes (Taking Process Seriously):**
          *   If you switch to PRMs/Step-level, what breaks?
          *   *Data:* Need step-level labels (expensive).
          *   *Metric:* Accuracy $\rightarrow$ Process Accuracy + Outcome Accuracy.
          *   *Optimization:* RLHF on steps, not just outcomes.
          *   *Failure Mode:* "Sycophancy" (reasoning that looks good but leads to wrong answer) vs. "Hidden Reasoning" (model thinks one way, writes another).
      *   **Section 5: Addressing the Pushback ("Got it" vs. "Knows it"):**
