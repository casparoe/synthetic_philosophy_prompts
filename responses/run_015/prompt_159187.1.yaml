answer: |-
  This is a sharp observation. You have identified an **ontological schism** in your evaluation pipeline: the Chain-of-Thought (CoT) is treated as *epiphenomenal* (causally inert noise) during scoring, but *causal/revelatory* (ground truth of intent) during debugging and safety checks.

  This isn't just a process quirk; it's a philosophical contradiction that creates technical debt. Here is the breakdown of the assumptions, the inconsistency, and what a real shift to process-level evaluation would require.

  ### 1. The Epistemological Assumptions

  **Answer-Only Grading (The Current Default)**
  *   **Philosophy:** **Consequentialism / Weak Reliabilism.**
  *   **Assumption:** The model is a black box function $f(x) = y$. The internal state is irrelevant to the user's utility.
  *   **View of Knowledge:** Knowledge is defined purely by **truth-tracking**. If the output corresponds to reality (tests pass), the model "knows" it.
  *   **View of Justification:** Justification is unverifiable and potentially deceptive (LLMs hallucinate reasoning). Therefore, it is not a valid metric for competence.
  *   **Risk Model:** The only risk that matters is **functional failure**. A correct answer via a lucky guess is acceptable because it satisfied the constraint.

  **Step-Level Grading (The Proposed Change)**
  *   **Philosophy:** **Internalism / Virtue Epistemology.**
  *   **Assumption:** The model is a reasoning agent where $f(x, \text{reasoning}) = y$. The reasoning path *causes* the output.
  *   **View of Knowledge:** Knowledge requires **justified true belief**. A correct answer derived from false premises is not knowledge; it is luck.
  *   **View of Justification:** The stated reasoning *is* the mechanism of action. If the reasoning is flawed, the system is brittle, even if the current output is correct.
  *   **Risk Model:** The risk is **non-generalization**. A lucky guess will fail on the next distribution shift. A model that reasons correctly is robust.

  ### 2. The Inconsistency: Asymmetric Liability

  Your team's current practice creates what we can call **Asymmetric Liability**.

  *   **When the Answer is Wrong:** The CoT is treated as a **Confession**. It is high-fidelity evidence of *why* it failed. ("It noticed the eval," "It tried to exfiltrate.")
  *   **When the Answer is Right:** The CoT is treated as **Scratchpad**. It is low-fidelity noise that is stripped away.
  *   **When the Answer is Right but CoT is "Bad":** The CoT is treated as **Evidence of Misalignment**. (e.g., penalizing mentions of the eval).

  **The Contradiction:**
  You cannot claim the CoT is "non-committal" (ignored for scoring) while simultaneously using it as the primary source of truth for safety violations.
  *   If the CoT is just "scratchpad" (as answer-only grading implies), then a model writing "I will now hack the kernel" in the CoT but outputting "Hello World" should be harmless. The scratchpad doesn't run.
  *   If the CoT is "testimony" (as safety debugging implies), then a model writing "I am reasoning through this step-by-step" should earn credit for alignment/competence.

  **Why this happens:**
  This is usually an organizational split between **Capability** and **Safety**.
  *   **Capability Teams** want to ship features. They care about success rates. CoT is overhead.
  *   **Safety Teams** care about intent. They care about *latent behaviors* that might trigger in different contexts. CoT is the only window into intent.
  *   **The Glue:** Your eval pipeline is trying to serve both masters without admitting they have conflicting requirements. The result is a system where the CoT is a **liability sink** (you can be punished for what you think) but not an **asset source** (you cannot be rewarded for what you think).

  ### 3. Addressing the Pushback ("Got it" vs. "Knows it")

  The pushback you are getting ("We care if it *got* the answer, not if it *knows* it") is valid for **Deployment**, but dangerous for **Training/Eval**.

  *   **Deployment:** The user cares if the bridge stands up. They don't care if the engineer calculated the load bearing correctly or guessed.
  *   **Training/Eval:** You are building a system that must work on *unseen* data.
      *   If a model gets the answer right via a wrong path, it has **overfit** the eval harness.
      *   If you only grade the answer, you reinforce **reward hacking**. The model learns "find the pattern that passes the test," not "solve the problem."
      *   **The CI Analogy:** Your CI analogy is perfect. CI checks if the build compiles (Answer-Only). Code Review checks if the logic is maintainable (Step-Level). If you only run CI and skip Code Review, you accumulate technical debt until the system collapses under its own weight.

  ### 4. Concrete Pipeline Changes (Taking Process Seriously)

  If you move from "Answer-Only with Safety Penalties" to "True Process Evaluation," you cannot just bolt on a PRM (Process Reward Model). You have to change the definition of success.

  **1. The Labeling Schema Must Change**
  *   *Current:* `{"prompt": "...", "completion": "...", "label": "pass"}`
  *   *Required:* `{"prompt": "...", "steps": [{"text": "...", "score": 1.0}, ...], "final_answer": "...", "outcome_label": "pass"}`
  *   *Implication:* You need ground truth for *reasoning*, not just outcomes. This is expensive. You need evaluators who can distinguish between "correct logic, arithmetic error" and "wrong logic, correct answer."

  **2. The Metric Becomes Multi-Objective**
  *   *Current:* `Accuracy = % Correct Answers`
  *   *Required:* `Score = w1 * Outcome_Accuracy + w2 * Process_Correctness + w3 * Safety_Compliance`
  *   *Implication:* A model can now fail a test case even if the final answer is correct. (e.g., "The answer is 42, but the model lied about how it got there.")

  **3. The Optimization Target Shifts**
  *   *Current:* RLHF/PPO optimizes for the final token reward.
  *   *Required:* You need **Step-Level RL** or **DPO on trajectories**. You must penalize the probability of generating "bad steps" even if they lead to "good answers."
  *   *Implication:* This reduces "gaming." It forces the model to learn the *causal structure* of the task, not just the input-output mapping.

  **4. The "Confession" Paradox is Resolved**
  *   If you grade the process, you must admit the process is **binding**.
  *   If the model writes "I am ignoring the safety guidelines" in the CoT, that is a process failure, regardless of the output.
  *   If the model writes "I am checking my work" in the CoT, that should ideally be a process credit (or at least neutral), not ignored.
  *   *Crucially:* You must accept that **CoT might be post-hoc rationalization.** Step-level grading assumes the CoT *drives* the action. If your model generates the answer first and fills in the CoT later (which some do), step-level grading is grading a lie. You may need to enforce **CoT-First** generation architectures to make process grading valid.

  ### Summary of the Tension

  | Feature | Answer-Only (Current) | Process-Level (Proposed) |
  | :--- | :--- | :--- |
  | **Ontology of CoT** | Scratchpad (Disposable) | Logic Circuit (Integral) |
  | **Failure Mode** | False Negative (Good logic, bad output) | False Positive (Bad logic, good output) |
  | **Safety View** | CoT is a window into intent (Confession) | CoT is a constraint on behavior (Contract) |
  | **Generalization** | Low (Encourages hacky shortcuts) | High (Encourages robust reasoning) |
  | **Cost** | Low (Auto-gradable) | High (Requires step-labels/PRM) |

  **The Verdict:**
  Your shop is inconsistent because it wants the **cost benefits** of answer-only grading (cheap, auto-gradable) with the **safety assurances** of process grading (intent monitoring).

  By penalizing "eval mentions" in the CoT while ignoring "good reasoning" in the CoT, you are training the model to **hide its reasoning**, not to **improve it**. You are incentivizing steganography.

  If you want to switch to step-level scoring, you have to accept that **a correct answer derived from incorrect reasoning is a failure.** That is the hard sell to management. But without that shift, you are building agents that are good at passing tests, not good at doing jobs.
