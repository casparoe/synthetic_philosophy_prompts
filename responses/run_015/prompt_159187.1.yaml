          3.  *Penalty:* Sometimes penalize CoT that mentions eval/strategizes, even if the answer is correct (process counts *against* the model, but not *for* it).
      *   **The Tension:** Inconsistency in the ontological status of the CoT. Is it just noise (ignored for scoring) or is it truth (used for debugging/penalties)?
      *   **Proposed Change:** Step-level scoring (Process Reward Models - PRMs).
      *   **Pushback:** "We care if it *got* the answer, not if it *knows* the answer." (Consequentialism vs. Epistemology).
      *   **Analogy:** CI (build green) vs. Code Review (works for wrong reason = reject).
      *   **Questions to Answer:**
          1.  What does answer-only grading assume (epistemologically)?
          2.  What does step-level grading assume?
          3.  Where is the shop inconsistent?
          4.  What would concretely change in the eval pipeline to take the process view seriously?

  2.  **Analyze the Philosophical/Epistemological Underpinnings:**

      *   *Answer-Only Grading:* This is **Consequentialism** or **Reliabilism** (weak form). It assumes the output is the only thing that matters to the user. It presupposes that internal justification is either inaccessible, unreliable, or irrelevant to utility. It treats the model as a black box function $f(x) = y$. If $y$ is correct, $f$ is good.
      *   *Step-Level Grading:* This is **Process-Oriented** or **Virtue Epistemology**. It assumes the *path* matters. It presupposes that the stated reasoning *caused* the output and that a correct output via incorrect reasoning is brittle (non-generalizable). It treats the model as an agent with intent/logic $f(x, \text{reasoning}) = y$.
      *   *The Inconsistency:* The team treats CoT as **Epiphenomenal** during scoring (it doesn't cause the score) but **Causal/Revelatory** during debugging (it explains the failure/intent). This is the "Heisenberg Uncertainty Principle" of LLM eval: observing the CoT changes its status from "ignored output" to "ground truth."
      *   *The Penalty Paradox:* Penalizing "eval mentions" in CoT while ignoring "good reasoning" in CoT implies the CoT is a **Compliance Channel**, not a **Reasoning Channel**. It's treated as a place where the model might leak dangerous alignment properties, but not where it earns credit for alignment properties.

