prompt: |-
  Right, I've been reading Dennett and Caruso on whether anyone genuinely deserves punishment, and I'm trying to work out what a theory of just deserts actually has to do. Write me the desiderata: the full spec of what an adequate account of moral responsibility and penal desert must deliver, with the motivating case behind each requirement.

  It needs to deal with the luck pincer — our characters are shaped by genetics and upbringing we never chose — without collapsing into Caruso's eliminativism, but also without sneaking in the libertarian free will Dennett calls a red herring. It must keep predictive and deterrent aims of prison separate from genuinely retributive ones, and say whether that separation holds up in practice. It should square with neuroscience on prefrontal development and impulse control, yet resist reducing blame to a brain-state description. It also needs to explain why we treat adults differently from children or animals in institutional blame — is that line principled or just pragmatic?

  There's also the manipulation argument: if deterministic causation is fine, why does hidden manipulation feel morally different from ordinary upbringing? The theory has to dissolve that tension or admit it. And I want you to flag whether full retributive proportionality — matching punishment to the wrongness of the act — can be jointly satisfied with determinism and the denial of moral luck; I think those three pull apart, but make the conflict explicit.

  Mark which desiderata are non-negotiable and which belong to one camp's prejudices. Then briefly score Dennett's elbow room compatabilism and Caruso's skepticism against the list — just where each stumbles. Write it in British English, please. I'm a retired biologist who only recently got into philosphy, so keep the tone casual and don't over-formalise it.
