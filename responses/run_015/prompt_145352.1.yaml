          *   No loose analogies (e.g., "The Matrix," "Simulation Hypothesis").
          *   Specify corresponding engineering constructs and exact mapping rules for each claim.
          *   Provide a "Residue Report" (what fits, what stretches, what has no counterpart).
          *   Distinguish settled Berkeley scholarship from contested interpretations.
          *   Maintain philosophical rigor while using engineering terminology.

  2.  **Deconstruct Berkeley's Core Theses:**
      *   *Esse est percipi* (To be is to be perceived): Existence depends on perception.
      *   Rejection of Material Substance: No underlying "stuff" independent of perception.
      *   The Master Argument: One cannot conceive of an object existing unconceived.
      *   Role of God: The infinite perceiver who ensures continuity of objects when finite minds aren't perceiving them.
      *   Nature of Mind/Spirit: Active perceiver, not passive idea.

  3.  **Map Philosophical Concepts to Engineering Constructs:**

      *   *Idea/Object:* Data structure / State.
      *   *Perception:* Reading/Accessing state / Rendering.
      *   *Mind/Spirit:* Process / Consumer / Observer.
      *   *God:* Root Process / System Daemon / Persistent Store.
      *   *Material Substance:* Pointer to memory that doesn't resolve / Abstract Base Class with no implementation.
      *   *Esse est percipi:* Existence = Active Reference / Rendered State.
      *   *Master Argument:* Inability to instantiate a variable without a scope/context.

      *   *Specific Mappings requested:*
          *   *Lazy Evaluation/Thunks:* Objects exist only when evaluated (perceived).
          *   *Event Sourcing vs. Snapshot:* Ideas are events; substance is a snapshot (which Berkeley denies).
          *   *Observer Pattern:* Minds are observers; ideas trigger updates.
          *   *Ref Counting/GC:* Existence tied to references. If ref count = 0, object is collected (ceases to exist).
          *   *Consistency Models:* How do different minds agree on the same object? (God ensures Strong Consistency).
          *   *VM Reference vs. Rendering:* Holding a pointer vs. actually dereferencing/displaying.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Attempt 1 (Mental):* Objects are like variables. If no one reads them, they don't exist. God is the server keeping them alive.
      *   *Critique 1:* Too loose. Violates "no simulation metaphor." Needs to be about architecture, not "world as simulation."
      *   *Attempt 2 (Refining):* Focus on *state management*. An object's state is only valid when an observer subscribes.
      *   *Refining the Master Argument:* In code, can I define a variable that is never accessed? Yes. But can I *conceptualize* access without an accessor? That's the tricky part.
      *   *Refining God:* God isn't just a simulator; God is the *Garbage Collector root* or the *Event Bus* itself.

  5.  **Addressing the "Residue Report":**
      *   *Intact:* The dependency of state on access (lazy eval).
      *   *Stretched:* God as a daemon (Berkeley's God is personal/volitional, daemons are deterministic). The "Master Argument" relies on phenomenology (what it's *like* to conceive), which code doesn't have.
      *   *Missing:* Qualia (the feeling of red), Volition (will), Moral agency.

  6.  **Addressing Scholarly Distinctions:**
      *   *Settled:* Berkeley denies mind-independent matter. He affirms spirits/minds are real.
      *   *Contested:* Is the Master Argument a logical proof or a psychological claim? Does God perceive *all* details continuously (continuous creation) or just sustain potentiality? Is Berkeley a phenomenalist (objects are logical constructions of sense data) or a spiritualist (objects are God's language)?

  7.  **Structuring the Response:**
      *   **Introduction:** Define the scope and constraints.
      *   **Section 1: Conceptual Translation:** Map specific Berkeleyan theses to specific SE constructs with mapping rules.
      *   **Section 2: The Master Argument in SE Terms:** Translate the specific logical move.
      *   **Section 3: Residue Report:** (1) Intact, (2) Stretched, (3) Missing.
      *   **Section 4: Scholarly Status:** Distinguish settled vs. contested.

  8.  **Refining the Engineering Terminology (Self-Correction during drafting):**
      *   *Correction:* Don't say "Simulation." Say "Runtime Environment."
      *   *Correction:* Ensure "Lazy Evaluation" isn't confused with "Caching." Lazy means *computation* happens on access. Berkeley says *existence* happens on perception. This is a strong map.
      *   *Correction:* On GC: In ref counting, if count is 0, object is destroyed. In Berkeley, if unperceived, it ceases to exist *unless* God perceives it. So God is the "Root Reference."
      *   *Correction:* On Consistency: Finite minds see eventual consistency? No, Berkeley argues for intersubjective agreement via God. So God enforces Strong Consistency across distributed observers (minds).

  9.  **Final Review against Constraints:**
