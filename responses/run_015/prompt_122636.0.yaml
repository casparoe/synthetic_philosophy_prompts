prompt: |-
  I'm on a three-person desk at a mid-sized specialty insurer where we price one-off risks: a touring exhibition of fragile works, a completion bond on an indie film, first-of-a-kind industrial equipment, a single music festival in a floodplain. Call it thirty of these a year, anywhere from $200k to $40m of exposure, and every number we write down gets re-derived by an outside reviewer each quarter — if they can't reconstruct it from the file, it comes back to us with a nasty note. I've got maybe half a day per file, my two colleagues' stats background is basically the underwriting exams, and our bonus is on premium volume rather than loss ratio, so you can guess which direction the numbers drift.

  Here's the actual problem, and its not that we're bad at base rates. We've read all the outside-view stuff, we know you're supposed to look for a class instead of telling a story about the case. The problem is that for any one of these risks there are six classes you could honestly reach for — all touring exhibitions, touring exhibitions with four or more venue changes, exhibitions of works on paper, projects with a first-time logistics partner, projects where the counterparty is late on other jobs — and the frequencies differ by an order of magnitude. Which means the number isn't really being found, it's being picked, and it's getting picked to justify a price somebody already wants. I want to stop that.

  So: write me a pre-registered procedure my desk can run on a file, in a fixed order, with what counts as a sufficient answer at each step, where the procedure stops with a hard no (we do not issue a number), and where it hands the decision to a person because the question is really about our risk appetite and not about facts. A few things it has to handle, because these are the places we actually screw up:

  - A membership test. I want a class to be disqualified unless you could say, before the outcome was known, whether a historical case was in it. Classes like "delays that turned out to be genuinely unavoidable" or "claims that were really accidental" are only sortable after the fact, and we've literaly used them. Tell me what to do when the only class with decent data fails this test.
  - How narrow to go. Give me an actual cutoff for how far down you split a class before the sample is too thin to mean anything, and be honest that whatever number you give me is a judgment call wearing a lab coat.
  - What to do when the natural class has one or zero members. There has to be something better than "guess," but I also don't want a step that launders a guess into a number.
  - A ledger rule. We keep a register of the classes we've used, and I caught us counting the same shipment as in-class for one risk and out-of-class for another, six weeks apart. I need a rule for reusing a class without re-describing old cases to fit, and for adding new cases as they come in.
  - An adversarial step. Someone whose interest runs the other way picks the rival class and gets a number out of it. If the two numbers diverge by more than some margin, we don't split the difference — we escalate. Suggest the margin and say what escalation actually looks like.
  - It shouldn't presuppose that probabilities are frequencies. Two of us think these numbers are just calibrated credences and the reference class is an anchor you adjust off of, not the definition of the number. Make the procedure work on either view, or tell me exactly which step takes a side.

  Then run it on three files. (1) A touring exhibition, ~90 fragile works, four venues, 14 months, two of the venues have never handled this kind of work, and the shipper is new to us: probability that at least one venue loses ten or more days to damage or transit failure. (2) A completion bond on an indie feature, first-time director, experienced line producer, 42-day shoot, one exterior location somewhere with a real rainy season, completion cashflow from a distributor that's already late on two other films: probability the film delivers more than 15 days late. (3) The one I think you'll tell me I can't price: a first-of-a-kind direct air capture unit with no operating history anywhere, availability guarantee over year one. If the procedure stops at no on that one, say so and tell me what I hand the chief underwriting officer instead of a number.

  Also flag which steps are judgment calls dressed up as procedure, and where the whole thing will misfire — especially the ways my desk will find to shop for a class until we get the answer we wanted. No citations or reading lists, I need something three underwriters can run in an afternoon. In American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Underwriter at a mid-sized specialty insurer.
      *   **Team:** Three people on a desk.
      *   **Work:** Pricing one-off, high-variance risks (exhibitions, film bonds, industrial equipment, festivals).
      *   **Volume:** ~30 files/year, $200k-$40m exposure.
      *   **Constraints:** ~0.5 day/file, external quarterly audit (reconstructibility is key), bonus tied to volume (incentivizes writing business), colleagues have limited stats background (underwriting exams).
      *   **Core Problem:** Reference class forecasting is known but misused. Too many potential classes lead to "class shopping" to justify a pre-determined price.
      *   **Goal:** A pre-registered, step-by-step procedure to stop number shopping, handle edge cases (thin data, unique risks), and distinguish between factual pricing and risk appetite decisions.
      *   **Tone:** Pragmatic, cynical but constructive, no fluff, American English, no citations.

  2.  **Deconstruct the Requirements:**
      *   **Pre-registered Procedure:** Fixed order, stop rules (hard no), handoff points (appetite vs. facts).
      *   **Membership Test:** Prevent hindsight bias (no "claims that turned out to be accidental"). What if the only good data fails this?
      *   **Narrowing Cutoff:** When does splitting become too thin? Acknowledge it's a judgment call.
      *   **N=0 or N=1:** How to handle unique risks without laundering a guess.
      *   **Ledger Rule:** Prevent inconsistent classification of past cases.
      *   **Adversarial Step:** Rival class selection, divergence margin, escalation process.
      *   **Philosophy:** Work for both frequentists and Bayesians (credences).
      *   **Application:** Run on three specific files (Exhibition, Film Bond, DAC Unit).
      *   **Meta-Commentary:** Flag judgment calls and potential failure modes (how the desk will game it).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Name:* Needs to sound official but functional. "The Reference Class Protocol" or "The Pricing Integrity Procedure." Let's go with "The Class-Selection & Pricing Protocol (CSPP)."
      *   *Step 1: The Blind Membership Test.* Define the class *before* looking at the specific loss history of the candidate cases. If you can't assign a past case without knowing the outcome, it's invalid.
      *   *Step 2: The Data Sufficiency Threshold.* Need a hard number for "too thin." Given 30 files/year, maybe 5 years of data? 15 cases? Let's set a minimum effective sample size (ESS). If N < 5, you can't use frequency alone.
      *   *Step 3: The Ledger Check.* Must match previous definitions. No retroactive reclassification.
      *   *Step 4: The Adversarial Challenge.* Colleague B picks the *next best* class. Compare rates.
      *   *Step 5: The Divergence Rule.* If rates differ by >X%, escalate.
      *   *Step 6: The Unique Risk Handoff.* If no class works, it's not a pricing problem, it's an appetite problem.

      *Refining the Philosophy:* To satisfy both frequentists and Bayesians, the procedure should treat the class rate as a *prior*. Frequentists take it as the rate; Bayesians adjust it based on specific risk factors. The procedure needs to mandate *where* the adjustment happens so it doesn't become magic.

      *Refining the "Hard No":* When do we stop? When N=0 in the primary class AND no valid proxy exists.

  4.  **Addressing Specific Constraints:**
      *   *Membership Test:* If the only data fails the test, you must use a broader class that passes, even if less predictive. Acknowledge the noise.
      *   *Narrowing Cutoff:* Suggest N < 5 historical losses or N < 20 total exposures as the "danger zone."
      *   *N=0/1:* Label it "Model Uncertainty." Do not output a probability. Output a "Price Range" based on capital cost or require a reinsurance backstop.
      *   *Ledger:* A physical or digital log. Once a case is filed under Class X, it stays there.
      *   *Adversarial:* Margin? 20% seems reasonable for specialty lines. Escalation = Chief Underwriting Officer (CUO).
      *   *Philosophy:* Step 4 (Adjustment) is where the split happens. Frequentists stop at Step 3 (mostly); Bayesians adjust in Step 4.

  5.  **Running the Files:**
      *   *File 1 (Exhibition):* Good data exists (touring exhibitions). Membership test passes. Adversarial might pick "fragile works" vs "new shipper." Likely priceable.
      *   *File 2 (Film):* Completion bonds have data. "Indie feature" is a class. "First-time director" is a risk factor. Cashflow risk is specific. Priceable but needs adjustment.
      *   *File 3 (DAC Unit):* First-of-a-kind. No operating history. N=0. Procedure should trigger a "Hard No" on standard pricing. Handoff to CUO for strategic pricing/capital hold.

  6.  **Identifying Failure Modes (The "Meta" Layer):**
      *   *Gaming:* Defining classes too broadly to get N up. Defining "loss" loosely.
      *   *Adversarial Collusion:* "I'll pick your weak class if you pick mine."
      *   *Time Pressure:* Skipping the ledger check.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone Check:* Needs to be direct. "Don't do this." "If X, then Y."
      *   *Formatting:* Use bolding, lists, clear headers.
      *   *Language:* American English (e.g., "program" not "programme", "check" not "cheque" - though not really relevant here, just idioms).

      *(Self-Correction during drafting)*: I initially thought about suggesting a specific statistical test. No, the user said colleagues have exam-level stats. Keep it arithmetic and logical.
      *(Self-Correction on N=0)*: Don't just say "no." Say "Price = Cost of Capital + Load" or "Decline." The prompt asks what to hand the CUO. Hand them a *structure*, not a rate.

  8.  **Final Review against Prompt:**
      *   Pre-registered procedure? Yes.
      *   Fixed order? Yes.
      *   Hard no/Handoff points? Yes.
      *   Membership test handled? Yes.
      *   Narrowing cutoff? Yes (N=20 exposures).
      *   N=0/1 handled? Yes (Appetite Handoff).
      *   Ledger rule? Yes.
      *   Adversarial step? Yes (20% margin).
      *   Frequency vs. Credence? Addressed in Step 4.
      *   Three files run? Yes.
      *   Failure modes flagged? Yes.
      *   No citations? Yes.

  9.  **Final Polish:** Ensure the distinction between "Pricing" (math) and "Underwriting" (decision) is clear. The procedure protects the math so the decision is honest.

  *(Drafting the response...)*
  *   *Intro:* Acknowledge the reality.
  *   *The Protocol:* 6 Steps.
  *   *The Three Files:* Application.
  *   *The Failure Modes:* Where it breaks.
  *   *Conclusion:* Keep it tight.

  *Wait, one detail:* "Bonus is on premium volume." I need to make sure the procedure makes it *harder* to write bad business, acting as a check on that incentive. The "Hard No" is crucial here.

  *Refining the Membership Test:* The prompt asks "What to do when the only class with decent data fails this test." Answer: You must broaden the class until it passes, even if predictive power drops. Better noise than bias.

  *Refining the Adversarial Step:* Who is the adversary? One of the two colleagues. Rotate duties.

  *Refining the Philosophy:* Explicitly state that Step 3 yields the "Base Rate" (Frequentist) or "Prior" (Bayesian). Step 4 is where Bayesians deviate.

  *Let's write it.*
answer: |-
  # The Class-Selection & Pricing Protocol (CSPP)

  **Purpose:** To prevent reference class shopping and separate factual pricing from risk appetite decisions.
  **Users:** Three underwriters on the specialty desk.
  **Audit Requirement:** Every step must be documented in the file notes. If an external reviewer cannot reconstruct the logic from the notes, the file is non-compliant.

  ---

  ## Part 1: The Procedure

  Run these steps in order. Do not skip to Step 4 because Step 3 looks ugly.

  ### Step 1: The Blind Membership Test
  Define the proposed reference class. Then, take five historical files from your ledger at random (do not cherry-pick). Apply the class definition to them.
  *   **The Rule:** You must be able to assign a historical file to the class *without* knowing its loss outcome.
  *   **Fail Condition:** If the definition relies on outcome-dependent language (e.g., "unavoidable delays," "accidental damage," "projects that struggled"), the class is invalid.
  *   **Remedy:** If your preferred class fails, you must broaden the definition until it passes (e.g., change "unavoidable delays" to "all delays > 5 days"). You must use the broader class even if the loss frequency is lower/higher.
  *   **Judgment Call:** Determining if a definition is outcome-dependent. *Mitigation:* Ask the colleague not working on the file to apply the definition to the five test cases. If they disagree on membership twice, the definition is too vague.

  ### Step 2: The Ledger Lock
  Check the Master Class Ledger (a shared spreadsheet/log).
  *   **The Rule:** If a class definition exists in the ledger, you must use the exact wording and inclusion criteria. You cannot reclassify a historical case to fit your current narrative.
  *   **New Class:** If you are creating a new class definition, it requires sign-off from one other desk member before you proceed to Step 3.
  *   **Fail Condition:** If you find a past case that fits your new definition but was filed under a different class, you must reconcile it. If reconciling changes the historical loss rate by >10%, you must revert to the old class or escalate to the CUO.

  ### Step 3: The Sufficiency Cutoff
  Count the exposures (N) and the losses (L) in the validated class.
  *   **The Rule:**
      *   **N < 20 exposures:** The sample is too thin for frequency-based pricing. Proceed to Step 6 (Unique Risk Handoff).
      *   **L = 0:** You cannot derive a frequency. Use an industry benchmark or proceed to Step 6.
      *   **N ≥ 20 and L ≥ 5:** You have a Base Rate. Calculate Frequency (L/N) and Severity (Avg Loss Cost).
  *   **Judgment Call:** The N=20 cutoff is arbitrary but necessary. It admits that below this number, variance swamps signal.
  *   **Philosophy Note:** For Frequentists, (L/N) is the probability. For Bayesians, (L/N) is the Prior. Do not argue this here. Just record the number.

  ### Step 4: The Adjustment Cap (Bayesian/Frequentist Split)
  This is where you adjust the Base Rate for specific risk factors (e.g., new shipper, first-time director).
  *   **The Rule:** You may adjust the Base Rate up or down based on specific file factors.
  *   **The Cap:** The total adjustment cannot exceed ±50% of the Base Rate derived in Step 3.
  *   **Documentation:** You must list the specific factor and the percentage load/credit for each. (e.g., "New Shipper: +20%").
  *   **Philosophy Note:** Frequentists should treat this as a credibility weight. Bayesians treat this as likelihood ratios. The Cap prevents the adjustment from laundering a guess that ignores the Base Rate entirely.

  ### Step 5: The Adversarial Challenge
  Before finalizing the number, a colleague (rotate weekly) must act as Adversary.
  *   **The Task:** The Adversary must select a *different* valid reference class from the Ledger that also fits the risk. They calculate a Base Rate using Steps 1–3.
  *   **Comparison:** Compare your Final Rate (Step 4) with the Adversary's Base Rate.
  *   **The Margin:** If the two numbers diverge by more than **25%**, you cannot price the risk at the desk level.
  *   **Escalation:** File goes to the Chief Underwriting Officer (CUO). The submission must include both class definitions and both rates. The CUO decides which class governs or sets the appetite.

  ### Step 6: The Unique Risk Handoff (The "Hard No" on Pricing)
  If Step 3 fails (N < 20 or L = 0) OR Step 5 escalates:
  *   **Action:** You do not output a probability or a technical rate.
  *   **Deliverable:** You hand the CUO a **Structure Memo**.
  *   **Contents:**
      1.  Why the data failed (N count, Membership Test failure).
      2.  The maximum loss exposure (PML).
      3.  The minimum premium required to cover cost of capital + expenses (not risk cost, just business cost).
      4.  Recommended risk controls (e.g., escrow, collateral, co-insurance).
  *   **Decision:** The CUO decides if the risk is taken for strategic reasons (portfolio diversification, client relationship) at a price that covers capital, not necessarily expected loss.

  ---

  ## Part 2: Running the Files

  ### File 1: Touring Exhibition (Fragile Works)
  *   **Step 1 (Membership):** Proposed class: "Touring exhibitions with fragile works." Test: Can we classify past exhibitions without knowing if they broke? Yes. "Fragile" needs definition (e.g., works on paper, glass, uncrated sculpture). Let's define as "Class A Materials."
  *   **Step 2 (Ledger):** Class exists. 45 historical exposures.
  *   **Step 3 (Sufficiency):** N=45, L=8. Base Frequency = 17.7%.
  *   **Step 4 (Adjustment):**
      *   New venues (2x): +15%
      *   New shipper: +20%
      *   Total Load: +35%. (Within ±50% cap).
      *   Adjusted Frequency: ~24%.
  *   **Step 5 (Adversary):** Colleague picks "All shipments with new logistics partner." N=120, L=10 (8.3%).
      *   **Divergence:** 24% vs 8.3%. Divergence is >25%.
  *   **Outcome:** **Escalate to CUO.**
      *   *Why:* The specific class (Exhibitions) says high risk; the proxy class (New Shipper) says low risk. The desk cannot arbitrate this without bias. The CUO must decide if we trust the exhibition data or the shipper data more.

  ### File 2: Indie Film Completion Bond
  *   **Step 1 (Membership):** Proposed class: "Indie features under $10m budget." Test: Can we classify without knowing completion status? Yes, based on budget and genre at inception.
  *   **Step 2 (Ledger):** Class exists.
  *   **Step 3 (Sufficiency):** N=60, L=12 (delays >15 days). Base Frequency = 20%.
  *   **Step 4 (Adjustment):**
      *   First-time director: +10%
      *   Distributor cashflow issues: +30% (Specific credit risk).
      *   Total Load: +40%. (Within cap).
      *   Adjusted Frequency: ~28%.
  *   **Step 5 (Adversary):** Colleague picks "Projects with distributor payment history." N=15 (Too thin). Colleague defaults to "All Completion Bonds." N=200, L=30 (15%).
      *   **Divergence:** 28% vs 15%. Divergence is >25%.
  *   **Outcome:** **Escalate to CUO.**
      *   *Why:* The distributor risk is a specific credit hazard that might not be captured in the production class. This is a correlation risk (production delay + distributor insolvency). The desk should not price correlation without explicit mandate.

  ### File 3: Direct Air Capture (DAC) Unit
  *   **Step 1 (Membership):** Proposed class: "Industrial equipment availability." Test: Pass.
  *   **Step 2 (Ledger):** Class exists (General Industrial).
  *   **Step 3 (Sufficiency):** N=500 (General Industrial). But L (DAC specific) = 0. L (General Industrial) = 20.
      *   *Problem:* The technology is "First-of-a-kind." General Industrial data is irrelevant to the *failure mode* of new tech.
      *   *Membership Test Fail:* If we define the class as "First-of-a-kind carbon capture," N=0. If we define as "Industrial," the Membership Test passes but the predictive value is null.
      *   *Protocol:* Since the specific class has N=0, we trigger Step 6.
  *   **Outcome:** **Hard No on Probability.**
      *   *Deliverable to CUO:* Structure Memo.
      *   *Content:* "We cannot derive a loss frequency. This is venture risk, not insurance risk. Recommend pricing at Cost of Capital + 15% margin, with a 50% co-insurance clause and a hard cap on liability at 1x premium. Do not underwrite expected loss."

  ---

  ## Part 3: Failure Modes & Judgment Calls

  You asked where this will misfire and where the desk will game it. Here is the honest assessment.

  **1. The "Broaden to Blur" Loophole (Step 1)**
  *   **The Gamble:** When the specific class has high losses, underwriters will broaden the definition (e.g., from "Fragile Exhibitions" to "All Exhibitions") to dilute the loss rate and pass the Sufficiency Cutoff.
  *   **The Fix:** The Adversarial Step (Step 5) is the only check. The Adversary *must* be incentivized to pick the narrower, higher-risk class. If your bonus is on volume, the Adversary needs a bonus on *loss ratio* or *audit compliance* to fight you effectively. If you all share the same volume bonus, Step 5 is theater.

  **2. The Adjustment Cap Arbitrage (Step 4)**
  *   **The Gamble:** Underwriters will load the Base Rate with "factors" to hit their target price, claiming each factor is small (e.g., ten different 5% loads).
  *   **The Fix:** Limit the *number* of factors to three. If you need ten reasons to justify the price, the class is wrong.

  **3. The Ledger Staleness (Step 2)**
  *   **The Gamble:** The Ledger becomes a graveyard of bad definitions because no one wants to do the work to reconcile old cases.
  *   **The Fix:** Quarterly review. If a class hasn't been used in 12 months, archive it. Forcing new classes keeps the definitions honest to current market conditions.

  **4. The Philosophy Split (Step 4)**
  *   **The Gamble:** The Bayesian on the team will claim "new information" justifies blowing past the ±50% cap. The Frequentist will refuse to adjust at all.
  *   **The Fix:** The Cap is absolute. If the specific risk factors suggest a >50% deviation from the Base Rate, you do not have enough data to support that conviction. That is a Step 6 (Unique Risk) scenario. Admitting ignorance is better than precise wrongness.

  **5. The Adversarial Collusion**
  *   **The Gamble:** "I'll let your class slide on File 1 if you let mine slide on File 2."
  *   **The Fix:** Randomize the Adversary assignment per file, not per week. Or, require the Adversary to sign the file notes. If an audit finds a bad class selection, both signatures are penalized.

  **6. The "Hard No" Resistance**
  *   **The Gamble:** The desk will hate Step 6. It feels like losing a deal. They will push N=19 cases into N=20 by counting "almost" exposures.
  *   **The Fix:** The external quarterly reviewer needs to check the N count specifically. If they find a file counted in the Ledger that doesn't meet the exposure definition, the whole desk's bonus for that quarter is clawed back. Make the cost of cheating higher than the cost of losing the deal.

  ### Summary for the Chief Underwriting Officer
  When you hand a file to the CUO under Step 6, you are saying: *"We cannot distinguish skill from luck on this price. If we write this, it is a capital deployment decision, not an underwriting decision."* That is the only honest way to price the unpriceable without lying to yourself about the loss ratio.
