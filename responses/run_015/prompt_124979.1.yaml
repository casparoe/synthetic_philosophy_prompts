  10. **Final Review of the "Gut Feeling":** Is Rorty doing philosophy of science for neural nets? No, he's doing philosophy of *culture* using a pragmatist framework that *fits* neural nets better than it fits logical positivism. The user is half-right but misses the ethical/political core.

