      *   *Key Insight:* Rorty's "vocabularies" are like *pre-trained foundation models*. You inherit them, you fine-tune them, you don't ground them in "reality" directly, you ground them in *usage*.

  8.  **Final Polish:** Check against the prompt's specific questions.
