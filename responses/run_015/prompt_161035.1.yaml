prompt: |-
  ok weird situation, hopefully you can help. My team got "reorganized" at work and I got dumped onto a data migration project, and it has quietly turned into a metaphysics problem that I now have to have opinions about by Friday.

  Setup: there's a legacy system I'll call the Beast, with an old schema — Customers, Accounts, Households, and junk like "Arrangement" and "Shadow Account" — and we're merging it into a new system with its own schema. About a third of the Beast's documentation is gone, everyone who built it left years ago, and the vendor will only give us query access to outputs: no internals, no historical logs, no way to run interventions against it. So over and over we hit the same argument: does entity type X in the Beast denote something real in the domain, or is it an artifact of how they happened to store things, or is it the same thing as Y in the new system under another name? And "just look at the data" doesn't settle it, because for a lot of these the accessible outputs provably can't discriminate between the candidates. I keep saying things like "that's not a thing, that's a way of talking" and my colleague says "you can't know that, you can't see the logs," and we are going in circles.

  I've been reading up on ontology identification / ontology matching and it's 90% tooling and 10% the question I actually have, so I want the philosophical spec instead. Write me the desiderata: what a method for identifying what a system's ontology really is has to deliver, in a situation where part of the evidence is permanently inaccessible. Requirements list, with the case or consideration behind each one, and put it in my setting (schemas, lost logs, orphan predicates) as much as in abstract terms. Things I specifically want dealt with, because these are literally the arguments we're having:

  - orphan predicates: a term in the Beast that no accessible query can make come out differently — nothing we can do makes a difference to any output we can see. Does an adequate method owe us a verdict on those at all? Is "delete it" a verdict or a refusal?
  - dormant vs dead: some of these would matter again if we ever recovered the logs or got write access; some wouldn't matter under any expansion of access at all. Is a method allowed to treat "it would make a difference if we could see more" as evidence that it's there now? Should it?
  - I think two requirements we both sort of want can't both hold: never conclude non-existence just because the evidence is missing, but also don't keep entities alive forever just because nobody can disprove them. If that's right, say so and say what has to give.
  - should the method also have to tell us what would settle the question — which inaccessible fact, if we got it, would flip the verdict? My colleague says that's the whole point; I think it's optional. Who's wrong?
  - granularity: Household vs. the three Customers in it. Is that a fourth thing or a façon de parler, and what does the method owe us here? Be explicit about whether "it's just how we talk" is an ontological verdict or a cop-out.
  - identity over time and across systems: is supplying identity criteria an input to the method or a deliverable of it? And can the method work pairwise (match two schemas at a time) or must it be global? I have a feeling that pairwise matching + treating "is the same entity as" as transitive + admitting borderline cases are jointly unsatisfiable — tell me if that's a real tension or if I'm talking nonsense.
  - verdicts indexed to an access profile (same system, different clearance, different verdict): bug or feature?

  Mark which requirements are non-negotiable and which are just the taste of one camp — I'm pretty sure my colleague is smuggling in a verificationist prejudice and I want it flagged as such rather than smuggled into the spec. Also, fix the purpose: I need this good enough to actually decide what to migrate and what to flag to compliance as uncertain, so say which desiderata change if the purpose is legal/audit rather than description. Tell me which single requirement knocks out the most tempting approaches. Then a short scorecard, three approaches only: count only what's directly accessible; count whatever the best explanation of the accessible evidence needs; count whatever our best description of the domain quantifies over. Keep the weight on the criteria, not the scoring. No bibliographies or citations, I can't follow up on references right now and I'd rather have the argument anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A technical professional (likely data engineer, architect, or lead) stuck in a "reorg" situation, forced onto a data migration project.
      *   **Problem:** A legacy system ("the Beast") with lost documentation and inaccessible internals is being merged into a new system. The core conflict is ontological: Do legacy entities represent real domain concepts or just implementation artifacts?
      *   **Constraint:** Evidence is permanently inaccessible (no logs, no write access, lost docs).
      *   **Conflict:** User vs. Colleague. User leans towards "it's just a way of talking" (deflationary/pragmatic); Colleague leans towards "you can't know that" (skeptical/verificationist).
      *   **Deadline:** Friday (implies need for actionable clarity, not just academic musing).
      *   **Task:** Write a set of *desiderata* (requirements) for a method to identify the system's ontology under these constraints.
      *   **Specific Issues to Address:** Orphan predicates, dormant vs. dead entities, the tension between non-existence and burden of proof, settling conditions, granularity (Household vs. Customers), identity criteria (input vs. output, transitivity), and access-profile indexing.
      *   **Formatting/Style:** Requirements list with cases/considerations. Mark non-negotiable vs. taste/camp. Address the legal/audit purpose shift. Identify the "killer" requirement. Provide a short scorecard of three approaches. No citations/bibliographies.
      *   **Tone:** Professional, sharp, philosophically rigorous but grounded in the specific technical mess (schemas, queries, migration).

  2.  **Deconstruct the Philosophical Core:**
      *   This is a classic problem in *applied ontology* and *philosophy of information*, specifically touching on *underdetermination of theory by data* and *verificationism vs. realism*.
      *   The User suspects the Colleague is a verificationist (meaning = method of verification). The User seems more pragmatic or deflationary.
      *   The goal isn't truth in the abstract; it's *migration safety*. The ontology must serve the business logic of the new system and compliance requirements.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Orphan Predicates.* If a field never changes output, does it exist?
          *   *Analysis:* If it never affects output, it's causally inert *for us*. But it might be a flag for a batch job we can't see.
          *   *Verdict:* The method must classify these as "Migration Risks," not "Ontological Truths." "Delete it" is an action, not a verdict. The verdict is "Undecidable under current access."
          *   *Status:* Non-negotiable for safety.

      *   *Requirement 2: Dormant vs. Dead.* Does potential future access count as current existence?
          *   *Analysis:* Colleague says "maybe it matters later." User says "it doesn't matter now."
          *   *Verdict:* The method must distinguish *causal power* from *epistemic possibility*. If it has no causal power on accessible outputs *now*, it's ontologically inert for the migration scope.
          *   *Status:* Non-negotiable for scope control.

      *   *Requirement 3: The Existence Tension (Non-existence vs. Disproof).*
          *   *Analysis:* User identified this correctly. You can't demand proof of non-existence (impossible) but also can't keep everything forever (paralysis).
          *   *Verdict:* Burden of proof lies on the *migration necessity*, not the metaphysical reality. If it doesn't need to move to preserve function, it doesn't need to exist in the new schema.
          *   *Status:* Non-negotiable for project viability.

      *   *Requirement 4: Settling Conditions.* Must the method say what would change the mind?
          *   *Analysis:* Colleague wants this. User thinks it's optional.
          *   *Verdict:* It's crucial for *risk management*, even if not for ontology. If we can't say what would change the verdict, we can't assess the risk of being wrong.
          *   *Status:* Non-negotiable for Compliance/Audit.

      *   *Requirement 5: Granularity (Household vs. Customers).*
          *   *Analysis:* Is "Household" a real thing or a query view?
          *   *Verdict:* The method must distinguish *fundamental* vs. *derivative* entities. "It's just how we talk" is a valid verdict *if* it maps to "derivative entity."
          *   *Status:* Non-negotiable for schema design.

      *   *Requirement 6: Identity Criteria (Input/Output & Transitivity).*
          *   *Analysis:* User suspects a tension between pairwise matching + transitivity + borderline cases.
          *   *Verdict:* This is a real tension (Sorites paradox applied to identity). Identity criteria must be an *input* constraint from the business domain, not derived solely from data. Pairwise matching fails if transitivity is required without strict criteria.
          *   *Status:* Non-negotiable for data integrity.

      *   *Requirement 7: Access-Profile Indexing.*
          *   *Analysis:* Does ontology change based on clearance?
          *   *Verdict:* Feature, not bug. Ontology is relative to the *operational context*.
          *   *Status:* Negotiable (Philosophical taste), but practically useful.

  4.  **Addressing the "Verificationist Prejudice":**
      *   The Colleague argues: "If you can't verify it, you can't claim it doesn't exist."
      *   The User argues: "If it makes no difference, treat it as non-existent for migration."
      *   *Flagging:* The Colleague's view is indeed verificationist. The spec needs to reject strict verificationism in favor of *pragmatic realism* (does it do work?).

  5.  **Addressing the Purpose Shift (Legal/Audit):**
      *   If the goal is compliance, "uncertainty" is a liability. We need to preserve *provenance*, not just truth.
      *   Desiderata shift from "What is real?" to "What must we preserve to avoid liability?"

  6.  **Identifying the "Killer" Requirement:**
      *   Which one knocks out the most tempting approaches?
      *   Likely the *Identity/Transitivity* constraint or the *Orphan Predicate* handling.
      *   Actually, the *Burden of Proof* shift (Requirement 3) is the biggest blocker for the Colleague's "keep everything" approach.
      *   Wait, the *Identity Criteria* (Requirement 6) is the technical killer. If you can't define identity, you can't migrate.

  7.  **Developing the Scorecard:**
      *   Approach 1: Empiricist (Count only accessible).
      *   Approach 2: Abductive (Best explanation).
      *   Approach 3: Domain-Realist (What the business quantifies over).
      *   Score them against the desiderata.

  8.  **Refining the Tone:**
      *   Keep it sharp. No fluff. Use the user's terminology ("the Beast," "orphan predicates").
      *   Ensure the distinction between "Metaphysical Truth" and "Migration Utility" is clear. The user needs to decide what to move by Friday, not solve the problem of universals.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about "is 'delete it' a verdict?"
      *   *Correction:* Make sure to explicitly state that "delete" is a migration action, not an ontological claim.
      *   *Check:* Did I address the transitivity tension?
      *   *Correction:* Yes, confirm it's a real logical tension (failure of transitivity in fuzzy matching).
      *   *Check:* Did I flag the verificationism?
      *   *Correction:* Explicitly label the Colleague's stance in the requirements.

  10. **Final Polish:** Organize into clear sections: Desiderata, The Tension, Purpose Shift, The Killer, Scorecard. (Proceed to generate output).

  *(Self-Correction on the "Killer Requirement"):* I need to think carefully about which requirement eliminates the most approaches.
  *   If I demand "Identity Criteria must be Inputs," Approach 1 (Empiricist) fails because data doesn't give identity.
  *   If I demand "Access-Profile Indexing," Approach 3 (Domain-Realist) struggles because it assumes one truth.
  *   Actually, the *Orphan Predicate* requirement is the most immediate blocker for the Colleague. If they insist on "you can't know," they block migration. If the requirement says "You must classify risk," they are forced to act.
  *   Let's go with the *Burden of Proof/Existence Tension* resolution as the killer. It forces a decision rule where none existed.

  *(Refining the "Verificationist" flag):* I need to be careful not to just insult the colleague but to categorize the philosophical stance. Verificationism says meaning is tied to verification conditions. The Colleague is saying "No verification condition = No ontological verdict." The spec should require "Operational Consequence = Ontological Weight."

  *(Final check on constraints):* No bibliographies. Keep weight on criteria. Three approaches only.

  Let's write it.cw
answer: |-
  Here is the specification for an Ontology Identification Method (OIM) tailored to your migration constraints. It is designed to break the deadlock between "it's real" and "it's unknowable" by shifting the ground from metaphysical truth to operational consequence.

  ### Desiderata for Ontology Identification Under Epistemic Constraint

  **1. The Causal Inertia Rule (Orphan Predicates)**
  *   **Requirement:** If a predicate (field, flag, table) in the Beast produces no discriminable difference in any accessible output under any accessible query, the method must classify it as *Causally Inert relative to the Access Profile*.
  *   **Case:** You have a `Shadow_Account_Flag`. No query result changes based on its value. Your colleague says, "It might trigger a backend batch job we can't see."
  *   **Verdict:** "Delete it" is **not** an ontological verdict; it is a risk acceptance. The method must not declare the entity "non-existent." It must declare it "Operationally Invisible."
  *   **Status:** **Non-Negotiable.** If you migrate causally inert data, you bloat the new system. If you refuse to migrate it without proof of non-existence, you paralysis. You must classify by impact, not essence.
  *   **Camp Flag:** Your colleague is smuggling **Verificationism** here. They argue that because you cannot verify the *internal* cause, you cannot judge the *external* effect. This requirement rejects that: if there is no external effect, the internal cause is irrelevant to the migration scope.

  **2. The Dormancy Distinction (Counterfactual Access)**
  *   **Requirement:** The method must distinguish between *Dormant* (would produce differences if access/logs were restored) and *Dead* (would not produce differences even with full access).
  *   **Case:** A `Legacy_ID` column looks redundant now, but might link to a lost audit table.
  *   **Verdict:** The method is **not** allowed to treat "it would make a difference if we could see more" as evidence that "it is doing work now." However, it must tag Dormant entities as *High Risk for Rollback/Audit*, whereas Dead entities are *Candidates for Archival*.
  *   **Status:** **Non-Negotiable.** This prevents the "just in case" hoarding of data. You migrate Dormant things to a quarantine table; you delete Dead things.
  *   **Camp Flag:** Your colleague wants to treat Dormant as Real. You want to treat Dormant as Noise. The compromise is treating Dormant as *Liability*.

  **3. The Burden of Migration (Existence Tension)**
  *   **Requirement:** The method must resolve the tension between "never conclude non-existence" and "don't keep entities alive forever" by shifting the burden of proof. The question is not "Does X exist?" but "Does X need to persist to preserve system invariants?"
  *   **Case:** You cannot prove `Arrangement` isn't real. You also cannot prove it is.
  *   **Verdict:** If the business invariants of the *new* system can be satisfied without mapping `Arrangement`, it is ontologically dropped for the purpose of the project. Existence is indexed to *necessity*, not *possibility*.
  *   **Status:** **Non-Negotiable.** This is the only way to finish by Friday.
  *   **Camp Flag:** This explicitly blocks your colleague's skepticism. Skepticism is a luxury of philosophers; migration is an engineering constraint.

  **4. The Falsification Condition (Settling the Question)**
  *   **Requirement:** For every entity classified as "Uncertain" or "Causally Inert," the method must specify the *Minimal Falsification Condition* (MFC): the specific piece of inaccessible evidence (log entry, doc page, write-permission test) that would flip the verdict.
  *   **Case:** You mark `Shadow Account` as Uncertain.
  *   **Verdict:** You must document: "If we saw the nightly batch log, we would know." If you cannot specify the MFC, the entity is classified as *Noise* by default.
  *   **Status:** **Non-Negotiable for Compliance/Audit.** Optional for pure engineering.
  *   **Camp Flag:** Your colleague is right here, but for the wrong reason. It's not about "truth"; it's about *risk accounting*. If you can't say what would change your mind, you aren't uncertain; you're guessing.

  **5. Granularity and Derivative Entities**
  *   **Requirement:** The method must distinguish *Fundamental* entities (stored directly) from *Derivative* entities (computed or aggregated views). "It's just how we talk" is a valid ontological verdict if it maps to "Derivative."
  *   **Case:** `Household` vs. three `Customers`.
  *   **Verdict:** If `Household` is always reconstructible from `Customer` data + rules, it is Derivative. If `Household` has attributes not reducible to Customers (e.g., a household credit limit), it is Fundamental.
  *   **Status:** **Non-Negotiable.** This dictates schema design.
  *   **Camp Flag:** This validates your intuition. "Just a way of talking" translates to "Derived View." It is not a cop-out; it is a structural claim.

  **6. Identity Criteria and Transitivity**
  *   **Requirement:** Identity criteria (`is the same entity as`) must be an **Input** to the method, not a deliverable. The method cannot work pairwise with transitive closure if borderline cases exist.
  *   **Case:** Customer A in Beast ≈ Customer A in New. Customer A in New ≈ Customer B in New (merge rule). Does Beast A = Beast B?
  *   **Verdict:** You identified the tension correctly. Pairwise matching + Transitivity + Borderline Cases = Logical Contradiction. The method must require global identity keys or accept that transitivity will break at the boundaries. You cannot derive identity from data similarity alone.
  *   **Status:** **Non-Negotiable.** This prevents data corruption.
  *   **Camp Flag:** This knocks out "fuzzy matching" as an ontological solver. Data similarity is not identity.

  **7. Access-Profile Indexing**
  *   **Requirement:** Ontological verdicts must be indexed to the Access Profile (what queries/permissions you have).
  *   **Case:** To you, `Shadow Account` is inert. To the Admin, it's active.
  *   **Verdict:** This is a **Feature**. The ontology of the migration is the ontology of the *migration team's view*.
  *   **Status:** **Taste/Pragmatic.** Philosophically messy, practically necessary.
  *   **Camp Flag:** Your colleague will hate this (truth should be absolute). You should love it (it lets you ship).

  ---

  ### The Purpose Shift: Legal/Audit vs. Description

  If your purpose were pure description, you could leave things "Uncertain." Since your purpose is **Migration + Compliance**, the desiderata shift:

  1.  **Preservation of Provenance:** You must migrate "Uncertain" entities to a `Quarantine` schema rather than deleting them, tagging them with the *Uncertainty Reason*.
  2.  **Risk Over Truth:** The "Burden of Migration" (Req 3) flips. In audit, if you can't prove it's safe to drop, you must keep it. The default becomes "Preserve," not "Drop."
  3.  **The Falsification Condition (Req 4)** becomes **Non-Negotiable**. Auditors need to know what you *didn't* know.

  ---

  ### The Killer Requirement

  **Requirement #6 (Identity Criteria as Input)** knocks out the most tempting approaches.

  Most teams try to "let the data decide" identity (Approach 1 below). This requirement forces you to admit that data cannot define identity; only business rules can. If you cannot get the business to define "What makes a Customer the same Customer?" before you migrate, you cannot mathematically solve the ontology problem. It stops the "let's just run a script" approach dead.

  ---

  ### Scorecard of Three Approaches

  Here is how three common strategies score against the Desiderata above.

  #### Approach 1: The Empiricist ("Count only what's directly accessible")
  *   **Method:** If a query can't distinguish it, it doesn't exist. Map only visible foreign keys and values.
  *   **Score:**
      *   Causal Inertia: **Pass** (Aligns perfectly).
      *   Dormancy: **Fail** (Treats Dormant as Dead, high risk of breaking hidden logic).
      *   Burden of Migration: **Pass** (Drops everything unnecessary).
      *   Identity: **Fail** (Assumes data implies identity).
      *   **Verdict:** Fast, but likely breaks the system in production when hidden dependencies trigger. Good for a prototype, bad for compliance.

  #### Approach 2: The Abductivist ("Count whatever the best explanation needs")
  *   **Method:** Infer hidden entities that explain the visible data patterns. If `Shadow Account` explains a timing lag in outputs, model it.
  *   **Score:**
      *   Causal Inertia: **Fail** (Posits entities without direct evidence).
      *   Dormancy: **Pass** (Good at spotting Dormant vs Dead).
      *   Burden of Migration: **Fail** (Tends to over-migrate "explanatory" entities).
      *   Identity: **Mixed** (Can infer identity rules, but risky).
      *   **Verdict:** Philosophically robust, practically bloated. Your colleague wants this. It will miss the deadline because "best explanation" is endless debate.

  #### Approach 3: The Domain-Realist ("Count what the business quantifies over")
  *   **Method:** Ignore the Beast's schema. Interview stakeholders. Map only what the business says is real (e.g., "We sell to Customers, not Households").
  *   **Score:**
      *   Causal Inertia: **Pass** (If business doesn't care, it's inert).
      *   Dormancy: **Mixed** (Business might forget dormant rules).
      *   Burden of Migration: **Pass** (Aligned with business needs).
      *   Identity: **Pass** (Identity comes from business rules).
      *   **Verdict:** **The Winner.** It satisfies Req #3 and #6. It bypasses the Beast's metaphysics entirely. The Beast's schema is treated as a noisy encoding of the Domain, not the source of truth.

  ### Recommendation for Friday
  Adopt **Approach 3 (Domain-Realist)** but enforce **Requirement #4 (Falsification Condition)** for compliance.

  Tell your colleague: "We are not mapping the Beast's ontology. We are mapping the Domain's ontology *through* the Beast. If the Beast has a field the Domain doesn't need, it is an artifact, not an entity. We will archive artifacts to satisfy audit, but we will not model them."

  This sidesteps the verificationist trap. You aren't claiming the Shadow Account *doesn't exist*; you're claiming it *doesn't belong in the new schema*. That is a migration verdict, not a metaphysical one, and it is actionable.
