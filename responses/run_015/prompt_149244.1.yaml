      *   **The "Tie-Breaker":** Buridan allows the will to choose between equals *not* arbitrarily in a vacuum, but by commanding the intellect to consider one as "to be taken now." The "reason" is generated by the will's own command to focus. So, it's not *without* a reason, but the reason is will-dependent.
