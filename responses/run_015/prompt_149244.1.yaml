answer: |-
  This is a sophisticated question that cuts to the heart of late medieval psychology and the debate between intellectualism and voluntarism. You have spotted a genuine tension in the scholarship, and your friend's "formal causation" reading is provocative but requires careful historical calibration.

  Here is a breakdown of what Buridan is actually claiming, the status of the "Ass" example, and whether your friend's interpretation holds water.

  ### 1. First, a Crucial Historical Correction
  It is important to start by noting that **Buridan never actually uses the example of the ass.**

  In his *Quaestiones super decem libros Ethicorum Aristotelis* (Questions on the Ten Books of Aristotle's Ethics), Book III, Question 5, Buridan discusses a hungry **dog** (and sometimes a **man**) faced with two equal portions of food. The story of "Buridan's Ass" was attributed to him by later critics (like Spinoza and Leibniz) to mock the implications of his determinism/indeterminism debates.

  Why does this matter? Because Buridan uses the example to discuss **human rational agency**, not animal instinct. Animals, for Buridan, *would* starve (or rather, their appetite would remain in suspense) because they follow the strongest sensory impression. If the impressions are equal, the animal is stuck. **Humans do not starve.** The question is: *Why not?*

  ### 2. The Tension: Self-Motion vs. Suspended Judgment
  You identified the core textual tension:
  1.  **Claim A:** The will can determine itself to one side without a new objective reason appearing (Self-Motion).
  2.  **Claim B:** If reason sees options as truly equal, the rational appetite ought to suspend choice.

  **Buridan's Resolution:**
  Buridan is an **intellectualist** regarding the *specification* of the act (the intellect tells the will *what* is good), but a **voluntarist** regarding the *exercise* of the act (the will decides *whether* to pursue it).

  When faced with two equal bales (A and B), Buridan argues that the intellect judges: "A is good, B is good, they are equal." At this moment, the will is not necessitated to choose A or B. However, it is also not necessitated to *wait*.

  Buridan claims the will has the power to **command the intellect**. The will can say to the intellect: "Stop comparing them generally. Look at A specifically as 'the one to be eaten now'."
  *   **Does a new reason appear?** Yes, but it is generated *by* the will's command. The reason becomes: "A is the one I am currently attending to."
  *   **Is it arbitrary?** In a sense, yes, but not "random." It is an exercise of *libertas oppositionis* (freedom of opposition). The will is not a passive scale waiting for weights; it is an active power that can tip the scale by shifting attention.

  So, to answer your first question: **Buridan allows for tie-breaking, but not in a vacuum.** The will breaks the tie by directing the intellect to consider one option under a specific aspect (e.g., "this one here, now"), thereby creating a sufficient reason for choice where there was previously only objective equality.

  ### 3. Evaluating Your Friend's "Formal Causation" Reading
  Your friend suggests the scenario is a category mistake because the will, like the intellect, requires a **formal object** to act.
  *   **The Medieval Core:** This is genuine scholastic metaphysics. Every power (potency) is defined by its object. The intellect's formal object is *truth/being*; the will's formal object is *the good*.
  *   **The Argument:** If the will moves toward "the good," and both bales are equally "good," there is no formal cause to move toward *this* bale rather than *that* one. Therefore, volition without a differentiating formal cause is impossible.

  **Is this Buridan's view?**
  **No.** This sounds more like a strict Thomistic reading (Aquinas) projected onto Buridan.
  *   **Aquinas:** Would argue that if the intellect judges two things as perfectly equal in every respect, the will cannot choose one without the intellect first finding some differentiating feature (even if it's "it is on the right").
  *   **Buridan (Nominalist):** Buridan is less concerned with the metaphysical "formal cause" of the specific choice and more with the **freedom of the will**. He argues that the will can choose between **indifferents** (*indifferentia*).

  **Where your friend is right:**
  They are correct that medieval philosophers generally rejected the idea of an act without *any* object. The will always wills *something*.

  **Where your friend is wrong (or anachronistic):**
  1.  **"Category Mistake":** This is Gilbert Ryle's 20th-century terminology. A medieval would say the scenario is "impossible per se" or "contradictory," not a category mistake.
  2.  **The Nature of the Formal Object:** For Buridan, the formal object of the will is "the good" in general. Both bales fall under "the good." The specific selection of Bale A over Bale B does not require a *different* formal object, only a different **material object** selected by the will's own power of determination.
  3.  **Dissolving the Paradox:** Your friend suggests the paradox dissolves because the choice *can't happen*. Buridan insists the choice *does* happen (we don't starve), so the theory must account for it. He accounts for it by giving the will the power to determine itself regarding **indifferent means** to an end.

  ### 4. Summary: What is Buridan Claiming?
  Buridan is trying to walk a tightrope between **determinism** (the intellect forces the will) and **irrationalism** (the will acts for no reason).

  1.  **Can the will move without a *prior* reason?** Yes. The will can initiate the consideration that *creates* the reason.
  2.  **Is it arbitrary?** It is not random (like quantum decay), but it is not necessitated by the object. It is necessitated by the agent's own self-determination.
  3.  **Does the Formal Object reading work?** It works as a critique *against* Buridan (from a Thomist perspective), but it does not represent what Buridan is claiming. Buridan would say: "The formal object is 'the good.' Both are good. The will is free to use either. The fact that they are identical does not bind the will to inaction, because the will is not a natural cause (like fire burning wood) but a free cause."

  **Verdict on your friend's theory:** It is a philosophically interesting reconstruction, but it is likely **anachronistic** to frame it as a "category mistake," and it imposes a stricter intellectualism on Buridan than he accepts. Buridan's whole point in the *Ethics* commentary is to preserve the will's ability to act even when the intellect presents a stalemate.

  **Recommendation for parsing the text:**
  Look for Buridan's distinction between the **judgment of the intellect** (which can remain suspended) and the **command of the will** (which can terminate the suspension). He argues that the will can accept one of the equal options simply to avoid the greater evil of inaction (starvation), thereby making "avoiding starvation" the overriding reason that permits the choice of an indifferent means.

  If you want to dive deeper, check out **Gyula Klima** or **Jack Zupko** on Buridan's psychology; they handle this specific tension between intellectualism and voluntarism very well.
