answer: |-
  **The Thought Experiment**
  Alex, a senior analyst, promised the VP to withhold news of a pending departmental restructuring until Monday. On Friday afternoon, Alex discovers that without this info, a junior colleague will unknowingly sign a non-refundable lease for an office move that will be cancelled, causing significant financial stress and logistical chaos. Alex decides to leak the info, breaking the promise to prevent this harm. Crucially, the VP previously secured these promises by falsely assuring staff that transparency would be rewarded, while the institution has a documented history of punishing employees who act on incomplete data to their own detriment. Both you and your friend agree Alex should talk; the disagreement is whether Alex is doing something *prima facie* wrong that gets outweighed, or if the wrongness never materializes.

  **The Theoretical Breakdown**
  *   **Moral Generalism:** The feature "breaking a voluntary commitment" is inherently a *pro tanto* wrong-making feature. It always counts against the action, regardless of context. In this case, the Generalist argues the wrongness is **activated** but **outweighed** by the duty to prevent harm. The institutional betrayal adds a *separate* reason to distrust the VP, but it doesn't erase the moral cost of the lie itself; Alex still owes a moral apology for the breach, even if it was the right thing to do.
  *   **Moral Particularism:** Moral reasons are holistic; a feature's status as a reason depends on the context. Here, the "institutional betrayal" acts as a **disabler**. It doesn't just add weight to the other side of the scale; it holistically disables the valence of the promise-breaking feature. For the Particularist, the wrong-making feature is **not activated**. Alex isn't doing something wrong that gets justified; Alex is doing something morally neutral because the background conditions required for the promise to generate moral force (good faith) were destroyed by the institution.

  **The Feature & The Dependency**
  The feature doing the work is **"violating a confidentiality commitment."** The hidden dependency you're sensing is that Generalists treat the moral valence of this feature as **invariant** (it's always a reason, even if defeasible), whereas Particularists treat the valence as **contingent** on the integrity of the surrounding practices.

  **Does removing the betrayal collapse the case?**
  **Yes.** If you remove the institutional betrayal (i.e., the VP acted in good faith and the company is trustworthy), the Particularist must concede that "violating a confidentiality commitment" typically functions as a wrong-making feature in workplace contexts. Without the disabler, the debate shifts from "Is the reason disabled?" to "How much does the reason weigh?" which is the standard Generalist framework of weighing competing principles. The unique particularist claim—that the reason *vanishes* rather than being *outweighed*—loses its foothold, making the case functionally indistinguishable from a standard Generalist override scenario.
