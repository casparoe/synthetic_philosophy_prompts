      *   *Why Constants vs. Initial Conditions?* Initial conditions (low entropy) might be a boundary condition problem, whereas constants are law-parameter problems. Solutions differ (e.g., inflation vs. designer). Conflation leads to category errors.
      *   *Why Methodology?* If anthropic reasoning is ad hoc, FTA is dead. If it's legitimate (like in string theory landscape), FTA changes shape.
      *   *Why Design/Multiverse is Overrated?* It's a theological/metaphysical add-on. Solving the physics/philosophy of probability doesn't force one or the other, it just clarifies the odds.

  6.  **Address Tractability (Physics vs. Concept):**
