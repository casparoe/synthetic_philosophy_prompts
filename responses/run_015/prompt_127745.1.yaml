answer: |-
  Your friend's argument requires the "strong determinist" reading that ideas are powerless echoes of economics, and that reading is false even within Marxist theory.

  Here is the menu of claims hiding inside "the base determines the superstructure," ranked from plausible to false, with verdicts on each.

  **1. The Constraint Claim (Boring/True)**
  *   **Claim:** You cannot sustain ideas that require economic conditions which do not exist. (e.g., You cannot have a ideology of divine feudal loyalty without feudal lords.)
  *   **Verdict:** Nearly everyone accepts this. It's trivially true that material reality limits cultural possibility.
  *   **Does it support your friend?** No. This only says some ideas are impossible, not that *all* ideas are fixed or that argument is useless within the possible range.

  **2. The Bias Claim (Arguable/Standard)**
  *   **Claim:** The group that owns the means of production has disproportionate resources to promote ideas that justify their ownership.
  *   **Verdict:** Real and arguable. Media ownership, funding for think tanks, and lobbying clearly skew public discourse.
  *   **Does it support your friend?** No. If ideas are biased by funding, counter-argument and counter-organization are precisely how you fight back. This claim suggests you need to argue *harder*, not stop arguing.

  **3. The Generation Claim (Controversial/Weak)**
  *   **Claim:** The specific structure of the economy produces specific psychological habits or moral intuitions in the population. (e.g., Market competition makes people view themselves as individual consumers.)
  *   **Verdict:** Plausible but not obvious. Sociology supports this, but there is significant variation (see your gun/welfare example).
  *   **Does it support your friend?** Partially. If ideas are habits formed by daily economic life, argument alone might be weak. But it doesn't mean ideas *can't* change before the economy does, only that it's harder.

  **4. The Epiphenomenal Claim (Wild/False)**
  *   **Claim:** Ideas are mere smoke; they have no causal power and change *only* when the economic base changes first.
  *   **Verdict:** False. Ideas clearly cause economic changes (e.g., deregulation ideology preceding deregulation laws).
  *   **Does it support your friend?** Yes. This is the only version that makes outreach a "waste of breath." If ideas have zero causal power, arguing is literally pointless.

  **The Switch**
  Your friend is exploiting an equivocation between Claim 1 and Claim 4. Claim 1 sounds obviously true when he says it ("of course money matters"), which makes you nod. But to get to his conclusion ("don't bother arguing"), he needs Claim 4. He slides from the undeniable fact that economics *influences* ideas to the false claim that economics *exclusively controls* ideas.

  **Addressing Your Tripping Points**

  *   **Cross-Country Variation:** This kills Claim 4 (Strong Determinism). If economics strictly dictated morality, the US and Sweden (both advanced capitalist economies) would have identical views on welfare. The fact that they don't proves the superstructure has "relative autonomy." Your friend's rebuttal (that history was economic further back) risks making the theory unfalsifiable—if every difference is explained by some past economic ghost, the theory can never be wrong, which means it isn't science.
  *   **Lag and Lead (Protestant Ethic/Shareholder Value):** This also kills Claim 4. When ideas precede economic shifts (like neoliberal ideology paving the way for deregulation), ideas are acting as a cause, not just a reflection. This doesn't destroy Historical Materialism entirely, but it forces the adoption of Engels' hedge: the base is determining only "in the last instance."
  *   **Engels' Hedge:** This is a real qualification, not just softening. It admits that while economics sets the boundaries, politics and ideas fight it out within those boundaries and can even shift the boundaries themselves. It saves the theory from being obviously false, but it concedes that your friend's "don't bother arguing" stance is incorrect. If ideas react back on the base, argument is a tool of economic change.

  **Your Formulation: "Economics Sets the Price List"**
  Your version is not just a weaker version; it is a more sophisticated and defensible version of Historical Materialism (closer to Gramsci or Bourdieu than to crude determinism).

  *   **Is it Historical Materialism?** Yes. It retains the core insight that material conditions constrain consciousness without denying human agency.
  *   **Is it interesting?** Yes. It predicts that "true" ideas will fail if the social cost of holding them is too high (e.g., losing your job), and "false" ideas will thrive if they are cheap to signal and rewarded by employers.
  *   **What does it predict?** It predicts that outreach *is* worth it, but only if you can subsidize the cost. This validates union work: a tenants' union lowers the cost of holding anti-landlord ideas by providing collective protection against eviction. It explains why argument alone fails (high cost) but argument + organization succeeds (lowered cost).

  **Verdict on Your Friend**
  He is using a 19th-century shortcut to avoid the hard work of cultural organizing. To change the economy, you often have to change the ideas that legitimize it first. Your formulation captures why: you aren't trying to change the ideas directly so much as changing the cost structure that keeps them in place.
