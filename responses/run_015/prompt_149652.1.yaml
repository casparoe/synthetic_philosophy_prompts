answer: |-
  Here is the **Social Choice Risk Assessment Procedure (SCRAP)**. It translates the Gibbard-Satterthwaite (GS) theorem and related mechanism design constraints into a binary checklist for your team.

  **Goal:** Determine if your ranking aggregation logic is safe to ship, needs mitigation, or requires a political override.
  **Audience:** Backend Engineers / Tech Leads.
  **Time:** 15 minutes.

  ---

  ### The Decision Procedure

  Run these steps in order. If you hit a **STOP**, do not merge code until the "Resolution" action is completed.

  #### Step 1: The GS Trigger Check (Logic Gate)
  *The Gibbard-Satterthwaite theorem only applies under specific conditions. If these aren't met, you are safe from the theorem.*

  *   **Check A:** Are there **3 or more** possible funding proposals in a single voting round?
      *   `[ ] Code Check`: `if (proposal_count < 3) return SAFE`
  *   **Check B:** Is the outcome determined by **more than one user**? (i.e., Is it *not* a dictatorship where one specific user ID always wins?)
      *   `[ ] Code Check`: Run simulation with 100 random profiles. If `output == user_A.preference` always, it's a dictatorship.
  *   **Check C:** Can users express **any** ranking order? (Unrestricted Domain)
      *   `[ ] Judgment Call`: Can a user legally rank Proposal Z > Proposal A > Proposal B, even if that makes no logical sense? If yes, domain is unrestricted.

  **Gate 1 Result:**
  *   If **ANY** are False: **SHIP IT.** (GS theorem does not apply).
  *   If **ALL** are True: **PROCEED TO STEP 2.** (You are in the "Impossibility Zone". Manipulation is theoretically guaranteed to exist).

  #### Step 2: Domain Restriction Mitigation (Logic + Judgment)
  *GS assumes users can have *any* preference. If you can restrict preferences to a specific structure, strategy-proofness becomes possible again.*

  *   **Check:** Can you enforce **Single-Peaked Preferences**?
      *   *Definition:* Proposals can be arranged on a line (e.g., "Low Budget" to "High Budget"). Every user has one "peak" favorite, and preference declines as you move away from it in either direction.
      *   `[ ] Judgment Call`: Does your funding domain naturally fit a 1D spectrum? (e.g., Infrastructure vs. Features is NOT 1D. "Small Fix" vs "Big Rewrite" MIGHT be).
      *   `[ ] Code Check`: Can you validate incoming votes to ensure they match a 1D spectrum? (e.g., reject rankings that go Up-Down-Up).

  **Gate 2 Result:**
  *   If **Yes**: **SHIP IT** (with validation middleware). You have achieved strategy-proofness via domain restriction.
  *   If **No**: **PROCEED TO STEP 3.** (You cannot mathematically eliminate lying).

  #### Step 3: Mechanism Vulnerability Audit (Logic Gate)
  *Since manipulation is possible (Step 1), we must assess how hard it is to exploit your specific algorithm.*

  *   **Check:** Is the aggregation rule **Monotonic**?
      *   *Definition:* If a proposal wins, and you raise it on some ballots (without changing others), it should still win.
      *   `[ ] Logic Lookup`:
          *   Plurality: **Yes**.
          *   Instant Runoff (IRV): **No** (IRV is non-monotonic).
          *   Weighted Score: **Yes**.
  *   **Check:** Is the rule **Clone-Resistant**?
      *   *Definition:* If I submit two identical proposals, does it split my vote and make me lose?
      *   `[ ] Logic Lookup`:
          *   Plurality: **No** (Vote splitting risk).
          *   IRV: **Yes**.
          *   Weighted Score: **No** (Dilution risk).

  **Gate 3 Result:**
  *   If **Non-Monotonic** OR **Not Clone-Resistant**: **FLAG RISK.** (These are specific, easy-to-code exploits).
  *   If **Monotonic** AND **Clone-Resistant**: **PROCEED TO STEP 4.**

  #### Step 4: Fairness & Power Axioms (Values Gate)
  *This is where math ends and politics begins. GS says someone can game the system; this step checks if the system is structurally biased.*

  *   **Check:** Does the system satisfy **Anonymity**?
      *   *Definition:* Does the result depend only on the *set* of votes, not *who* cast them? (i.e., If User A and User B swap votes, does the outcome change?)
      *   `[ ] Code Check`: `run(votes_A, votes_B) == run(votes_B, votes_A)`
  *   **Check:** Does the system satisfy **Neutrality**?
      *   *Definition:* Are all proposals treated equally regardless of name/ID?
      *   `[ ] Code Check`: Swap Proposal IDs in input. Output order must swap identically.

  **Gate 4 Result:**
  *   If **FAILS Anonymity** OR **FAILS Neutrality**: **STOP. REDESIGN.** (System is structurally biased).
      *   *Exception:* Requires **Human Override** (See below).
  *   If **PASSES**: **PROCEED TO STEP 5.**

  #### Step 5: Risk Acceptance (Human Gate)
  *You have confirmed manipulation is possible (Step 1), you can't restrict domain (Step 2), and you have audited the mechanism (Step 3/4).*

  *   **Decision:** Is the cost of a successful manipulation attack (e.g., funding a bad project) lower than the cost of delaying the launch?
      *   `[ ] Human Call`: Product Lead / Board Chair.

  **Gate 5 Result:**
  *   **Yes**: **SHIP IT** (Log all votes for audit).
  *   **No**: **STOP. REDESIGN.** (Simplify to 2 choices or move to quadratic funding).

  ---

  ### Application to Your Three Mechanisms

  Here is how your three options score when run through SCRAP.

  #### 1. Plain Plurality Vote (1 vote per user)
  *   **Step 1 (GS Trigger):** **FAIL** (3+ proposals, non-dictator, unrestricted). *Manipulation is possible.*
  *   **Step 2 (Domain):** **FAIL** (Funding proposals aren't 1D spectrum).
  *   **Step 3 (Vulnerability):** **FLAG RISK.** (Fails Clone-Resistance. Attackers can spam similar proposals to split opponent votes).
  *   **Step 4 (Fairness):** **PASS** (Anonymity/Neutrality hold).
  *   **Step 5 (Risk):** **Human Call.**
  *   **Verdict:** **SHIP WITH CAUTION.** The clone-attack is known, but easy to explain to users.

  #### 2. Instant-Runoff Ranked Choice (IRV)
  *   **Step 1 (GS Trigger):** **FAIL** (Manipulation is possible).
  *   **Step 2 (Domain):** **FAIL**.
  *   **Step 3 (Vulnerability):** **FLAG RISK.** (Fails Monotonicity. There are edge cases where ranking a candidate *higher* causes them to *lose*. This is hard to explain to users if they find it).
  *   **Step 4 (Fairness):** **PASS**.
  *   **Step 5 (Risk):** **Human Call.**
  *   **Verdict:** **SHIP WITH CAUTION.** Better than Plurality for consensus, but the non-monotonicity is a PR risk if discovered.

  #### 3. Custom Weighted Scheme (Senior Maintainers 2x Points)
  *   **Step 1 (GS Trigger):** **FAIL** (Manipulation is possible).
  *   **Step 2 (Domain):** **FAIL**.
  *   **Step 3 (Vulnerability):** **FLAG RISK.** (Fails Clone-Resistance).
  *   **Step 4 (Fairness):** **STOP. FAILS ANONYMITY.**
      *   *Reason:* Swapping a Senior's vote with a Junior's vote *changes the outcome*. The code check `run(votes_A, votes_B) == run(votes_B, votes_A)` returns False.
      *   *Procedure Output:* **STOP. REDESIGN.** The procedure classifies this as structurally biased.
  *   **Step 5 (Risk):** **N/A** (Stopped at Step 4).

  ---

  ### The "Human Override" Moment (The Part You'll Hate)

  **The Conflict:**
  The SCRAP procedure explicitly kills your **Custom Weighted Scheme** at **Step 4**. Mathematically, it violates Anonymity. In a pure logic check, this is a "bug."

  **The Reality:**
  Your board *needs* the weighted scheme to ensure senior maintainers (who carry the bus factor) have more say. It is politically necessary for the project's survival.

  **The Override Protocol:**
  To ship the Weighted Scheme, you cannot treat Step 4 as a logic gate. You must treat it as a **Policy Configuration**.

  1.  **Do not hide the failure.** Document in the RFC that "Anonymity is intentionally disabled to weight maintainer seniority."
  2.  **Execute the Override:** The Project Lead must sign off on **Step 4 Exception**.
  3.  **Mitigation:** Because you are bypassing the fairness check, you must add **Transparency**.
      *   *Action:* Publish the weights publicly.
      *   *Action:* Log every vote immutably so if a Senior maintainer is accused of gaming the system, the data exists to audit it.

  **Summary for Monday:**
  *   **Plurality/IRV:** Pass logic checks, carry standard GS risk. Shipable.
  *   **Weighted Scheme:** Fails Fairness Check (Step 4). **You must manually override this.**
  *   **Recommendation:** If you want to minimize "gaming" complaints, use **IRV**. If you want to ensure senior control, use **Weighted**, but accept that the checklist flags it as "Unfair" and you will need to defend that decision publicly.

  **Final Engineering Note:**
  Gibbard-Satterthwaite proves *someone* can game *some* scenario. It does not prove they *will*. Your best defense isn't a perfect algorithm (it doesn't exist); it's **auditability**. Log the raw ballots. If someone claims the system was gamed, you can prove exactly how. That is your real safety net.
