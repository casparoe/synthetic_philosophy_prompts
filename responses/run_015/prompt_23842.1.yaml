      *   *Is the "Battle of Wits" a simultaneous or sequential game?* It's presented as simultaneous (Westley poisons, Vizzini picks), but the reasoning makes it feel sequential (Westley anticipates Vizzini). Formally, it's a simultaneous move game with asymmetric information.
      *   *Stalnaker's specific point:* Stalnaker criticized the idea that CKR *implies* Backward Induction. He argued you need to specify what beliefs are held at information sets that are not reached. Vizzini's monologue is essentially constructing beliefs about unreached nodes (what Westley *would* have done).
      *   *Make sure to address the "Common Knowledge" definition strictly.* It requires a public event. The setup is public, the poisoning is private. Therefore, the location of the poison cannot be CK. Vizzini is trying to *derive* CK from private reasoning, which is impossible.

