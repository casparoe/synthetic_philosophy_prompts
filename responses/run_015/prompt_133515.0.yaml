      *   Be honest about the limitations of ML theory (it's not as smart as it sounds).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "Regularization" clearly? *Fix:* Compare it to "Genre as a shared prior."
      *   *Check:* Did I address the "Understudy Problem"? *Fix:* Explicitly link it to "Identifiability" in IRL.
      *   *Check:* Did I answer the "Optimization" question? *Fix:* Contrast "Reward Maximization" with "Tragic Flaw" or "Escalation."
      *   *Check:* Is the distinction between "What she wants" vs "What she'd say she wants" covered? *Fix:* Map this to "Revealed Preference" vs. "Stated Preference" in economics/ML.

  7.  **Final Polish:** Ensure the "Residue Report" is distinct and clear. Make sure the conclusion lands on the "Human vs. Function" distinction. (The user's insight that human desire is fluid is the key counterpoint to ML's static reward function).

  8.  *(Final thought before generating)*: The user mentioned their cousin did a bad job explaining alignment. I need to make sure *I* explain the "nervousness" about the inferred reward (i.e., if you infer the wrong thing and optimize it, you get a paperclip maximizer). In novels, this is "melodrama" or "caricature."

