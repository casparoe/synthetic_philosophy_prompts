answer: |-
  This is a brilliant analogy. You have intuitively grasped the central tension of Inverse Reinforcement Learning (IRL) and Alignment better than most engineers do, because you are dealing with the raw material (human behavior) rather than the abstraction (mathematical agents).

  Your cousin struggled because "reward function" is a placeholder term for "the thing we are pretending exists so we can do calculus on it." You know that what drives a person is messy, contradictory, and fluid. ML researchers know this too, but they have to freeze it into a function to make the code run.

  Here is the translation of the ML problem into your vocabulary, followed by the Residue Report you asked for.

  ### Part 1: The Setup (IRL in Novelist Speak)

  **The Task:**
  In ML, we have an **Agent** (your character) moving through an **Environment** (your setting/plot). We observe a **Trajectory** (the sequence of scenes/beats you've written). We do not see the **Reward Function** (the character's core desire/motivation). Our job is to look at the Trajectory and reverse-engineer the Reward Function that would make an Agent produce *this* specific sequence of actions rather than any other.

  **The Assumption of Rationality:**
  To do this, we must assume the Agent is acting **Near-Optimally**. This is exactly what your cousin meant. If the character moves randomly, or acts purely against their own interests without reason, we cannot infer a motive. We have to assume that when she pauses before answering, or walks to the window, she is doing so to maximize some internal value. In your terms: we assume **Character Coherence**. We assume the behavior is *intentional*, not noise.

  **The Ambiguity (The Understudy Problem):**
  Here is the mathematical reality of your draft problem: For any finite set of observed behaviors (scenes), there are infinite Reward Functions (motives) that could explain them.
  *   *Motive A:* She stays silent because she loves him and fears hurting him.
  *   *Motive B:* She stays silent because she hates him and enjoys his confusion.
  *   *Motive C:* She stays silent because she is plotting to steal his keys.
  On the page, in that beat, these look identical. This is what ML researchers call the **Identifiability Problem**. The data does not identify the truth.

  **The Solution (Regularization and Priors):**
  Since the data doesn't pin it down, we use **Priors**. We assume the "simplest" reward function is the correct one (Occam's Razor). In your world, this is **Genre** and **Theme**.
  *   If you are writing a Romance, the Prior dictates we select Motive A.
  *   If you are writing a Thriller, the Prior dictates Motive C.
  *   If you are writing Literary Fiction, the Prior might dictate a complex, weighted sum of A and B.
  We also use **Regularization**, which penalizes complex, jagged reward functions. We prefer a motive that is smooth and consistent across the book over one that changes wildly from scene to scene without cause. This is your rule: *anything put in early has to pay off later.* A motive that appears only to explain one weird beat is "overfitting."

  ### Part 2: The Residue Report

  Here is where the translation holds, where it strains, and where it breaks.

  #### 1. What Translated Cleanly
  *   **Reward Function $\approx$ The "Want":** Specifically, the deep, structural want that drives the arc, not the superficial want of the scene. In ML, this is often called "Revealed Preference." It is not what the agent *says* it wants (Stated Preference); it is what the agent's actions prove it values. This maps perfectly to your distinction: *what she wants* vs. *what she'd say she wanted.*
  *   **Overfitting $\approx$ Melodrama/Contrivance:** In ML, if you make the Reward Function too complex to match every single data point (behavior), the model learns the noise. In a novel, if you invent a specific motive for every single weird thing the character does, the character feels manic or the plot feels contrived. You need a smooth curve (a coherent psyche) that allows for some deviation (human messiness).
  *   **Priors $\approx$ Genre/Reader Contract:** You called genre a "shared prior." That is technically precise. The reader brings a probability distribution over possible motives. A ghost in a Gothic novel is likely malevolent; a ghost in a Romantic comedy is likely helpful. The ML model uses priors to resolve the Understudy Problem; you use genre expectations.

  #### 2. What I Had to Fudge or Force
  *   **Near-Optimality $\approx$ Coherence:** In ML, "optimal" means *efficient*. An optimal agent takes the shortest path to the reward. In a novel, efficiency is often boring. A character who hesitates, self-sabotages, or takes the scenic route is often *more* compelling. I had to stretch "optimality" to mean "acting in accordance with one's nature," even if that nature is self-destructive. In ML, self-destruction is usually a bug (a misaligned reward); in fiction, it's often the point (Tragic Flaw).
  *   **The Environment:** In ML, the environment is usually fixed (the rules of the game don't change). In a novel, the character's actions change the world, which changes the stakes, which changes the value of the reward. This is **Non-Stationarity**. ML struggles immensely with this. You handle it naturally via Plot.

  #### 3. What Has No Counterpart (The Breakage)
  *   **The Optimization Phase:** This is the biggest divergence. In ML, once you infer the Reward Function, you typically build a new agent to **Maximize** it. You turn the dial to 11. If the inferred reward is "make paperclips," the AI turns the whole world into paperclips. This is **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
      *   *In the Novel:* You never do this. You do not take your character's inferred want and maximize it until they become a monster (unless it's a cautionary tale). You use the want to generate *conflict*, not to achieve *success*. If a character successfully maximizes their want in Chapter 3, the book is over. ML wants convergence; you want tension.
  *   **Fluidity of Desire:** In IRL, the Reward Function is static. It is the ground truth. In your work, you know that *what she wants* changes because of *what she does*. This is **Character Arc**. In ML terms, her Reward Function is being rewritten by the Trajectory. There is very little math for this. Most Alignment research assumes human values are fixed and we just need to learn them. You know human values are mutable and forged by the plot.

  ### Part 3: Addressing Your Specific Questions

  **"Is assuming the demonstrator is near-optimal really anything like assuming a character is coherent?"**
  Yes, but with a caveat. ML assumes the agent knows how the world works and is trying to win. You assume the character *believes* they know how the world works and is trying to win. The gap between their belief and reality is **Dramatic Irony**. ML doesn't really do irony. If the ML model thinks the agent is acting optimally, but the agent is actually acting on false information, the model infers a "wrong" reward function. You, however, use that error to create empathy.

  **"Is 'the reward' more like a want, or more like a want plus a license to extrapolate it into every scene you didn't write?"**
  It is the latter. In ML, the Reward Function is a *generator*. It is a rule that tells you how the agent *would* act in situations you haven't seen yet. This is exactly your problem. You need a motive that not only explains the scenes you wrote but generates the correct behavior for the scenes you *haven't* written yet.
  *   *Do you have vocabulary for this?* You call it **Consistency** or **Truth to Character**. But ML has a specific warning label on this: **Distributional Shift**. If you extrapolate a reward function too far beyond the data you observed (scenes you wrote), it often goes crazy. This is your fear: that the motive you pick will force the character into a corner in Act III that feels unearned.

  **"Does the understudy problem map onto something your people have a name for?"**
  Yes. It is **Identifiability**.
  *   *What do they do about it?* They cheat. They add more constraints. They say, "Assume the reward is a linear combination of these five features." They limit the search space.
  *   *What do you do?* You use **Theme**. You fire the understudy wants not because they don't fit the *data* (the behavior), but because they don't fit the *argument* of the book. If the book is about forgiveness, the motive "she wants revenge" is fired, even if the behavior fits. You solve the mathematical ambiguity with thematic necessity. ML doesn't have "theme," so it struggles much more with this than you do.

  **"Is there anything in their framing that a novelist has no use for?"**
  Yes. **Maximization.**
  As I mentioned, ML infers the goal so it can *achieve* it. You infer the goal so you can *frustrate* it.
  Also, **Discount Factors**. In ML, agents value immediate rewards less than future rewards (usually). They have a mathematical "discount rate." Characters don't. Sometimes a character will burn down the world for an immediate emotional payoff. ML calls this "irrational" (high discount rate). You call this "passion."

  ### Part 4: The Failure Point

  You asked: *Is the failure my vocabulary being too thin, or their problem being less well-posed than it sounds?*

  It is **their problem being less well-posed than it sounds.**

  When your cousin says "Reward Function" with a straight face, he is speaking a necessary fiction. He is treating a fluid, contradictory, context-dependent human psyche as a static mathematical object because otherwise, the code doesn't compile.

  You are hitting the **Understudy Problem** in your draft because you are trying to solve it mathematically (which behavior fits which motive?), but the solution is actually aesthetic.
  *   **ML approach:** Gather more data (write more scenes) until the motives diverge.
  *   **Novelist approach:** Pick the motive that makes the story *mean* something.

  The "nervousness" in Alignment research is that if they infer the wrong reward and then optimize it, they destroy the world. The "nervousness" in your draft is that if you pick the wrong motive and optimize it (write the rest of the book), you kill the *truth* of the character.

  They are the same fear. They are just worried about physical reality, and you are worried about psychological reality.

  **The Verdict:**
  Your vocabulary is not too thin. It is actually more robust than theirs for this specific task. They are trying to build a map of a territory that changes when you look at it. You know the territory changes. You don't need their equations. You need to trust your "Thematic Prior." When the Understudies are indistinguishable on the page, you fire the one that doesn't pay off the book's argument. That is a move they don't have in their playbook.
