answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm seventeen, and I'm Ada's friend. Which means I've eaten more of Mrs. Okoye's jollof rice than I've probably eaten of my own mom's cooking, and it also means I know that if I make this speech too dramatic, Ada is going to text me something very rude from the third row.

  So I'm going to keep this real.

  Last January, on Old Mill Road, a car went into the creek. It was freezing. Most of us know that stretch of road. We know how steep the bank is. We know how cold that water gets. When it happened, people stopped. People called 911. People stood on the bank and looked down. That is a human reaction. When something terrible happens, our brains often hit pause. We wait for instructions. We wait for the people with the training and the uniforms.

  Mrs. Okoye didn't wait.

  She didn't take off her coat. She didn't calculate the risk. She just went down the bank and into the water. She brought those two kids out before the sirens even got close.

  Now, I know who is sitting in this room. Half of you are volunteers for the fire company or the EMTs. For you, running toward danger is the promise you made. You train for it. You gear up for it. You do it at 3:00 AM for free. What Mrs. Okoye did doesn't replace what you do. It doesn't overshadow it. But for one specific moment, on a freezing Tuesday, she stepped into that gap. She did the thing we all hope someone will do if we're the ones in the car, but none of us know if we actually could.

  I also know Mrs. Okoye hates being the center of attention. I know that standing up here makes her uncomfortable. And I want to say something about that.

  Sometimes, when we give awards like this, it feels like we're setting a standard. Like we're saying, "This is what everyone should do." That's not what this is. We aren't thanking her because we expect everyone to jump into freezing creeks. We're thanking her because we are so incredibly glad *she* did.

  We aren't celebrating this because we want it to happen again. We're celebrating it because it's over, and those kids are here tonight, and Mrs. Okoye is here tonight. The best thing about this story isn't the rescue. It's that she doesn't have to do it ever again. We hope she spends the rest of her life being a normal neighbor who complains about the speed limit on Mill Road and brings us too much food, not someone who has to save us.

  Which brings me to this.

  *(Hold up the plaque)*

  Our town committee wanted to give you a token of appreciation. I have to be honest, Mrs. Okoye, looking at this thing… the budget clearly went to emergency services and not to art. It is not a good-looking plaque. The lettering is a little crooked. But it's heavy, and it's genuine, and it says "Neighbor of the Year."

  So, on behalf of everyone who sleeps safer knowing you live two doors down, and especially on behalf of Ada and me who just want you around for a long time… please come up and accept this very ugly, very deserved award.

  Mrs. Okoye.
