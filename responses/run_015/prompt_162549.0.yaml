          *   Must end with handing over the plaque (acknowledge it's ugly/awkward).
          *   Tone: Not fake, not rude, not preachy, not making others feel guilty (especially volunteers/EMTs), not making Mrs. Okoye uncomfortable (she hates big deals), not creating an expectation for future heroics.
      *   **Core Conflict/Philosophical Problem:** How to praise extraordinary action without implying obligation (guilt-tripping others) or normalizing it (making it seem like a duty). Avoid "any decent person would do this" (false) and "you did more than required" (implies others should have). Avoid diminishing the professional volunteers (EMTs/Fire) who do this as duty.

  2.  **Deconstruct the Audience & Dynamics:**
      *   **Mrs. Okoye:** Hates being the center of attention. Needs to feel seen but not sainted.
      *   **Ada:** Best friend. Needs to feel proud but not embarrassed for her mom.
      *   **EMTs/Fire Dept (Chief Alvarez):** They do this for a living/on-call. Don't imply Mrs. Okoye did it *better* because she wasn't paid/signed up. Acknowledge their constant presence.
      *   **General Town:** Don't make them feel like cowards for standing on the bank.
      *   **The Speaker:** 17, honest, thoughtful, slightly nervous about the philosophical trap.

  3.  **Drafting Strategy - Addressing the Traps:**
      *   *Trap 1: "Any decent person would do it."* -> Solution: Acknowledge the freeze response. It's human to hesitate. She didn't.
      *   *Trap 2: "You did more than required."* -> Solution: Focus on the *moment*, not the obligation. Focus on the result (the kids are here), not the moral calculus.
      *   *Trap 3: Insulting EMTs.* -> Solution: Acknowledge that for most, this is a nightmare scenario. For EMTs, it's Tuesday. Mrs. Okoye stepped into a role usually reserved for pros.
      *   *Trap 4: Creating Expectation.* -> Solution: Frame this as a specific response to a specific moment, not a definition of her character that demands repetition. Hope she never has to do it again.
      *   *Trap 5: The Ugly Plaque.* -> Solution: Lean into the awkwardness. Humor helps diffuse tension.

  4.  **Tone & Voice:**
      *   Conversational, sincere, slightly humble (acknowledging own nervousness).
      *   Not polished like a politician.
      *   Respectful but warm.

  5.  **Outline:**
      *   **Intro:** Acknowledge nervousness/age. Set the scene (January, cold).
      *   **The Incident:** Briefly state what happened without melodrama. Acknowledge the bystanders (it's okay to freeze).
      *   **The Action:** Focus on her movement vs. hesitation. Acknowledge the EMTs (they train for this, she just did it).
      *   **The Aftermath/Feeling:** Address the discomfort of praise. She doesn't want a statue. We don't want her to have to do it again.
      *   **The Award:** Hand over the plaque. Acknowledge it's ugly.
      *   **Closing:** Welcome her up.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Intro:* Hi everyone. I'm [Name]. I'm 17. Ada's friend.
      *   *The Day:* It was cold January. Old Mill Road. Car in creek.
