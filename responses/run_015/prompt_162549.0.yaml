  9.  **Final Polish:**
      *   Make sure the transition to the plaque is smooth.
      *   Ensure the ending is clear.
      *   Check the tone—not too stiff.

  *(Self-Correction during drafting)*: I need to be careful not to sound *too* analytical about the bystanders. Don't say "It's okay you stood there." Say "It's cold water." Keep it physical.
  Also, need to make sure the "expectation" point lands. "We hope you never have to do this again."

