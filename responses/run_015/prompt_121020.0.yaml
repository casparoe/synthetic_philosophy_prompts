answer: |-
  Here is the principle, the application, and the correction.

  ### The Principle: Operational Immediacy

  You possess authority in exactly two domains:
  1.  **Phenomenological Presence:** What the work (or your state) feels like *in the moment of encounter*. (e.g., "This sentence feels wrong," "My chest feels tight.")
  2.  **Textual Function:** What the work *requires* to cohere as a machine. (e.g., "Marta must be lying for the plot to hold," "This paragraph must be cut.")

  You possess **no authority** in the domain of **Causal History**. This includes origins, motives, past states, counterfactuals, and psychological diagnoses. When you make claims in this domain, you are not reporting knowledge; you are generating a narrative to stabilize your identity or the text's reception. Certainty is not a metric of truth here; it is a metric of how well the narrative is working.

  **Why this sorts your cases:**
  *   **Saved:** Case 4 (Sentence feel) is Presence. Case 5b (Marta's lie) is Function (you know the plot requires it). Case 7 (Past happiness) is correctly assigned to Present Me (Presence overrides History). Case 8 (Green-room) is the corruption of Presence into History (memory).
  *   **Discarded:** Case 1 (Lena's motive) is History (explanation of action). Case 3 (Dream source) is History (origin story). Case 6 (Fridge) is History (unrecorded data). Case 9 (Womb intent) is History (contaminated origin).

  ### Application to New Cases

  **(i) The Missing Paragraph**
  *   **Classification:** Causal History.
  *   **Verdict:** You know nothing.
  *   **Reasoning:** You have no Phenomenological Presence (no memory of writing it) and you cannot assess Textual Function until you read it as a stranger. Whether your daughter wrote it or you did in a trance is irrelevant history. Treat the text as "found." Judge it solely on Case 4 criteria (does it feel wrong now?). If it feels inevitable, keep it. If it feels wrong, cut it. The authorship is noise.

  **(ii) The Person Switch (1st to 3rd)**
  *   **Classification:** Causal History.
  *   **Verdict:** You do not know why.
  *   **Reasoning:** Any story you tell ("It felt too claustrophobic," "The voice demanded distance") is a Case 3 confabulation. You are constructing a rationalization for a decision that likely happened at the level of Textual Function (it worked better) or Phenomenological Presence (it felt less wrong). Do not waste energy excavating the "why." The only truth is the current state of the manuscript.

  ### The Overturn

  I am overturning your verdict on **Case 2**.

  **Your Verdict:** "Trustworthy. There's no evidence for it and I still trust it."
  **My Verdict:** **Worthless.**

  **Why:**
  Case 2 is structurally identical to Case 3.
  In Case 3, you invented a dream to explain an ending. In Case 2, you invent a counterfactual certainty ("I would write without money") to explain your identity. Both are origin stories designed to validate the work.

  You trust Case 2 because the *feeling* of certainty is strong. But Case 3 proved that you can feel total certainty about a lie ("I'd have passed a lie detector"). The feeling of certainty belongs to Phenomenological Presence (Case 4), but the *content* of Case 2 is a prediction about future psychological causality. You cannot have immediate knowledge of a counterfactual future.

  This is not a harmless delusion. It is dangerous. If you believe Case 2, you will mistake your current comfort for permanent virtue. You are not authoritative on who you would be if the conditions of your life changed. That is a story you tell yourself to feel pure. It is bullshit.

  **Secondary Note on Case 10:**
  I am not overturning this, but I am warning you. You classify Irony as Case 4 (a feel). It is not. Irony is a communicative contract. If the reader reads it straight, the contract has failed. Claiming "It was meant ironically" is often a Case 3 repair job for a failed Case 4. If everyone reads it straight, it is straight. Do not use "intent" to override "effect."

  ### Summary
  You are a god only over what is on the page *now* and how it hits you *now*. You are a biographer like any other when it comes to why the page exists or who you are. Stop confusing the myth of the author with the work of the writing.
