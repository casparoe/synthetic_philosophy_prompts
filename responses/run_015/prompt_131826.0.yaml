      *   *Diagnosis:* It's partly verbal but rooted in substantive intuitions about composition. The term "relation" is the pivot. If the binder is a relation, regress follows. If it's not, what is it?
      *   *Vertical vs. Horizontal:* This is a strong diagnostic tool. Relationalists often think vertically (constituents + form = proposition). Anti-relationalists think horizontally (the fact is a single unit; analysis is secondary).

  4.  **Identify Hidden Presuppositions:**
