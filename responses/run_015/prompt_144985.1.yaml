answer: |-
  # The Heritage Vagueness Protocol (HVP)
  **Time Limit:** 30 Minutes per Proposal  
  **Goal:** Distinguish between *unknown facts* (Epistemic) and *inherent vagueness* (Supervaluationist) to force a decision without endless debate.

  ## Philosophical Grounding (For the Chair)
  *   **Epistemicism:** Assumes there *is* a sharp cutoff (e.g., a building either is or isn't significant), even if we lack the data. We search for the hidden fact.
  *   **Supervaluationism:** Assumes there is *no* single cutoff. A building is "Significant" only if it counts as significant under **all admissible precisifications** (all reasonable definitions of the word). If it counts under some but not others, it is **borderline** (neither true nor false).
  *   **The Rule:** We grant tax breaks/delays only for **Super-True** cases. **Borderline** cases force a policy vote (values), not a fact-finding vote.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Epistemic Screen (5 Minutes)
  *Goal: Determine if there is a hard fact that settles the matter.*
  **Question:** Does the building meet a statutory, objective threshold that the city has already defined as "Significant"?
  *   **Check:** Age (e.g., >50 years)? Listed Architect? Site of a Recorded Event?
  *   **If YES:** Stop. **Verdict: YES (Significant).** This is an Epistemic fact; we have discovered the hidden cutoff.
  *   **If NO:** Proceed to Step 2. (We have entered the zone of vagueness).

  ### Step 2: The Supervaluationist Sweep (15 Minutes)
  *Goal: Test for "Super-Truth" across admissible precisifications.*
  **Instruction:** The Chair proposes three "Admissible Precisifications" (reasonable definitions of significance). The Board must agree these definitions are *reasonable* (not crazy).
  *   **Precisification A (Material):** Is it significant due to physical rarity or construction method?
  *   **Precisification B (Narrative):** Is it significant due to association with people/events?
  *   **Precisification C (Aesthetic):** Is it significant due to design merit?

  **The Test:** Ask for each: *"Under this definition, is the building Significant?"*
  *   **If YES on A, B, AND C:** Stop. **Verdict: YES (Super-True).** It survives all reasonable sharpenings of the term.
  *   **If NO on A, B, AND C:** Stop. **Verdict: NO (Super-False).** It fails all reasonable sharpenings.
  *   **If MIXED (Yes on some, No on others):** Stop. **Verdict: INDETERMINATE (Borderline).** Proceed to Step 3.

  ### Step 3: The Value Hand-Off (10 Minutes)
  *Goal: Acknowledge the gap and vote on policy, not fact.*
  **Instruction:** The Chair states: *"This building is Borderline. There is no fact of the matter. We are not deciding if it IS significant; we are deciding if we VALUE it enough to treat it AS significant."*
  *   **Action:** Simple Majority Vote.
  *   **Default Rule:** If the vote ties, the benefit is **DENIED**. (Burden of proof lies with the applicant to be Super-True).

  ---

  ## Part 2: Test Conditions & Sentences
  *Use these exact phrases during the meeting to maintain philosophical discipline.*

  1.  **To stop Epistemic arguing:** "We are not looking for opinions. Is there a document or date that settles this? If not, we move to Step 2."
  2.  **To define Admissibility:** "Is this interpretation of 'significant' unreasonable? If it's a view a reasonable citizen could hold, it is admissible."
  3.  **To identify Borderline:** "We have a split. That means this is not a fact we can discover. It is a gap in the law."
  4.  **To force the Vote:** "We are no longer historians; we are policymakers. Vote on what you want to save, not what you think is true."

  ---

  ## Part 3: Failure Modes (Where the Procedure Will Misfire)
  *Flag these explicitly in the minutes.*

  1.  **The "Precautionary" Complaint:** Preservationists will hate that **Borderline = Vote** (and potentially No). They argue vagueness should favor preservation. This procedure treats vagueness as a lack of justification.
  2.  **The "Admissibility" Fight:** Board members will argue that a specific precisification (e.g., "Aesthetics") is *inadmissible* to force a Super-True or Super-False result. The Chair must rule on admissibility quickly.
  3.  **The Retrospective Blindness:** The Epistemic Screen cannot account for value that emerges *after* the cutoff (e.g., an architect becoming famous later). It will produce "False Negatives" on new landmarks.

  ---

  ## Part 4: Case Applications

  ### Case 1: The 1923 Courthouse
  *   **Step 1 (Epistemic):** Age is 100+ years. Meets the 50-year statutory threshold.
  *   **Result:** **YES.**
  *   **Flow:** Stops at Step 1.
  *   **Board Reaction:** Universal agreement. The procedure works as intended for clear cases.

  ### Case 2: The 1978 Brutalist Parking Garage
  *   **Step 1 (Epistemic):** Age is 46 years. Fails the 50-year threshold. No listed architect. **Move to Step 2.**
  *   **Step 2 (Supervaluation):**
      *   *Precisification A (Material):* Yes (Rare concrete technique).
      *   *Precisification B (Narrative):* No (No specific events occurred there).
      *   *Precisification C (Aesthetic):* Split (Some board members find it ugly; ugliness is an admissible aesthetic view).
  *   **Result:** **INDETERMINATE (Borderline).** It is true on some admissible precisifications, false on others. It is not Super-True.
  *   **Step 3 (Value Hand-Off):** Board must vote on policy.
  *   **Board Reaction:** **Hostility.** Preservationists argue that "Rare concrete" should be enough. The procedure forces them to admit they are making a value choice, not recognizing a fact. If the vote fails, the garage is demolished, and the procedure is blamed for being too rigid.

  ### Case 3: The 1999 Community Center (Architect Famous Post-2010)
  *   **Step 1 (Epistemic):** Age is 25 years. Fails the 50-year threshold. Architect fame occurred *after* construction and *after* the cutoff date for "Historical Association."
  *   **Result:** **NO.**
  *   **Flow:** Stops at Step 1.
  *   **Board Reaction:** **Outrage.** The building is by a now-famous "Starchitect." The public sees it as significant. The procedure delivers a **Clear No** because Epistemicism demands a sharp cutoff (Age/Date), and the building does not meet it.
  *   **Why they hate it:** The procedure cannot process *retrospective* significance. It treats "Significance" as a property fixed at the time of evaluation against static rules, not a fluid cultural status.

  ---

  ## Part 5: What This Procedure Cannot Do

  **1. It Cannot Justify Demolishing a Borderline Building on "Fact" Grounds.**
  If the 1978 Garage is voted down in Step 3, the minutes must record: *"We did not demolish this because it lacked significance. We demolished it because we chose not to subsidize borderline cases."* The procedure prevents you from lying and saying "It wasn't historic." It forces you to admit "It was vague, and we chose development."

  **2. It Cannot Account for Shifts in Cultural Value (The 1999 Problem).**
  Epistemicism assumes the truth is stable. If the 1999 Center becomes a pilgrimage site in 2030, this procedure still classifies it as "No" today. It cannot handle the *potential* for future significance unless "Future Potential" is codified as an Admissible Precisification (which risks making everything significant).

  **3. It Cannot Resolve Disagreements on Admissibility.**
  If half the board thinks "Ugliness" is an inadmissible view (i.e., "Only experts decide aesthetics"), Step 2 breaks. The Chair must have the authority to rule a view "Admissible" even if half the board hates it. If the Chair cannot do this, the procedure collapses back into arguing until someone gets tired.

  **Summary for the Board:**
  This protocol does not make the decision easier. It makes the *reason* for the decision honest. It tells you when you are finding a fact (Step 1), when you are interpreting a definition (Step 2), and when you are making a political choice (Step 3). Expect anger at Step 3 and Step 1 failures; that anger is the sound of vagueness being managed, not solved.
