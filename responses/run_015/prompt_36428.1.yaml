      *   **Task:** Act as a philosopher of biology/evolutionary theorist. Help audit the user's instincts about adaptationism vs. spandrels/exaptation.
      *   **Input Data:** A list of traits with the user's "gut verdicts" (Fever, Morning Sickness, Reading/Writing, Male Nipples, Blood Color, Sweet Taste, Chin, Music, Religion, Infant Grasping, Emotional Tears).
      *   **User's Tentative Principle:** Adaptation = Complex + Costly + Good Fit. Byproduct = Failure of any of these.
