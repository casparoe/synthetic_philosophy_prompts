      *   *Candidate 3 (The "Comparative-Engineering" Heuristic):* A trait is provisionally treated as an adaptation if it shows *special design* (complexity specific to the function) AND *phylogenetic history* supports selection for that function (or a precursor).
      *   *Refinement:* Let's use the "Three-Place Predicate" approach common in philosophy of biology. Adaptation *for* function X *in* environment Y.
      *   *Proposed Principle:* **The Special Design + Phylogenetic Continuity Test.**
          1.  *Special Design:* Does the trait exhibit complexity/efficiency specifically tailored to the putative function (Engineering Fit)?
          2.  *Phylogenetic Continuity:* Does the trait's history show selection for this function or a functional precursor (Comparative Evidence)?
          3.  *Cost-Benefit:* Does the benefit outweigh the cost in the relevant environment (Ecological Validation)?

  5.  **Auditing the User's List against the New Principle:**
      *   *Fever:* Facultative, costly, specific regulation. -> Adaptation. (Matches User).
