      *   *Appendix:* Vestigial (Byproduct) vs. Immune function/Gut flora safe house (Adaptation/Exaptation). *Shifting consensus.*

  7.  **Addressing the "Morning Sickness" & "Religion" Unease:**
      *   The user correctly identifies Morning Sickness as vulnerable to the Spandrels critique. The "costliness" argument is weak because hormonal side-effects are also costly.
