          6.  Indicate confidence levels and identify the least certain point.
          7.  Flag unsettled empirical literature.

  2.  **Deconstruct the User's Tentative Principle:**
      *   *Complexity:* Often signals design, but complex byproducts exist (e.g., snowflakes, though biological complexity is different).
      *   *Costliness:* High cost *usually* implies selection, but drift can fix costly traits in small populations, or they can be linked to beneficial traits (hitchhiking). Also, "costly" is relative.
      *   *Good Fit:* Crucial, but "fit" is hard to define without assuming the function first (circularity risk).
      *   *Exaptation:* This is the biggest hole. A trait can be complex, costly, and fit a function well, but not have been *selected for* that function originally (e.g., feathers for insulation -> flight).

  3.  **Brainstorming Organizing Dimensions:**
      *   *Cost:* High metabolic/fitness cost suggests selection pressure, but isn't definitive (spandrels can be costly side-effects).
      *   *Complexity/Design:* Intricate machinery suggests selection, but developmental constraints can produce complex non-adaptive structures.
      *   *Fit/Performance:* Does it perform the putative function efficiently? (Engineering analysis).
      *   *Comparative Evidence:* Do related species have it? Did it evolve convergently? (Phylogenetic analysis).
      *   *Genetic/Developmental Architecture:* Is it a direct genetic target or a structural necessity?
      *   *Plasticity:* Is it facultative (triggered by environment)? Facultative traits are often adaptations (e.g., fever, tanning).

  4.  **Developing a Better Principle (The "Adaptationist Warrant"):**
      *   I need to move away from a simple checklist and towards a *methodological* principle, aligning with modern evolutionary biology (post-Gould/Lewontin).
      *   *Candidate 1 (Strict Adaptationism):* Assume adaptation until proven otherwise. (Too Panglossian).
