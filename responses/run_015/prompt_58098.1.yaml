prompt: |-
  You are both a professional philosopher of science and an accomplished science fiction writer. Please think carefully through the underlying disagreement before you begin writing. Write a short story of about 800 words about a curator aboard a multi-generational colony ship who tends a gallery of once highly successful but now rejected Earth theories, such as caloric heat and the luminiferous ether, and who must counsel a young physicist unsettled by the idea that our current best theories will likely seem equally mistaken to the future. The story should make tangible the pessimistic worry drawn from past failures and dramatize at least one realist way of separating what was false from what was genuinely preserved across theory change, without becoming a lecture. Please give your response in continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write in a personal letter.
