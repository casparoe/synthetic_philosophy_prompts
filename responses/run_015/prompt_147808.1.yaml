prompt: |-
  I direct the appellate unit of a legal-aid office. Four staff attorneys file roughly two motions or briefs a week each, on deadlines the court sets; I sign and file everything, and I have about half an hour per draft. Over the past year they have all begun drafting with an AI assistant, and my problem is not that the work is wrong. It is that I increasingly cannot tell whether the person who produced a draft could defend it. I receive correct motions whose author cannot say which holding is load-bearing, cannot say what would have to be different for the motion to fail, and did not notice that the assistant quietly omitted the one contrary decision in our jurisdiction. I also notice the problem in myself: I am now tempted to check drafts by asking the same assistant, so neither of us is positioned to catch the failures that matter, since the loud ones I can catch unaided and the silent ones look exactly like everything else.

  I have been working with a rough three-way distinction — trusting the answer, trusting the route by which it was reached, and trusting one's own ability to tell when it is wrong — and I suspect the third is the one that erodes first and the only one my signature actually rests on. Sharpen this distinction or replace it with a better one, then turn it into a procedure my office can run on every assisted draft before I sign it.

  The procedure should give me:

  - Ordered questions, each with what counts as a sufficient answer, and a time budget that fits inside half an hour.
  - A way to separate, in language an overworked attorney can apply without any theory, between getting the right answer and grasping why it is right — while being explicit that the procedure only tests proxies for the second, and saying where those proxies break.
  - An explicit treatment of the asymmetry between failures the author can detect unaided and failures that are invisible to someone who no longer has the understanding the tool replaced, with each question labelled by which kind it targets.
  - The points where the procedure stops with a no, meaning it goes back to the attorney or is filed with something disclosed, and the points where it hands the decision to me because it turns on values rather than fact.
  - What to do when the honest answer to a question is that I cannot tell and the filing deadline is tomorrow.
  - What the procedure cannot do, including anything it can do about my own dependence on the tool when I review.

  Then run it on three cases of the shapes I actually see: a motion to suppress that is very likely to win, produced in twenty minutes, whose author cannot articulate why the controlling case applies; a procedural-history section that is boilerplate, machine-drafted, and spot-checked against the docket; and a novel argument the attorney found with the assistant, then verified against the reporters and can state what would defeat it. At least one of these should come out in a way I will not like — keep it that way, and tell me what I am supposed to do with that result. Finally, flag anywhere the procedure will systematically misfire by manufacturing the appearance of understanding rather than the thing itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Director of an appellate unit in a legal-aid office.
      *   **Task:** Signs and files all motions/briefs (4 staff attorneys, ~2 drafts/week each, ~30 mins/draft review time).
      *   **Core Issue:** Attorneys use AI for drafting. The work is legally *correct* on the surface, but attorneys lack deep understanding (can't defend holdings, don't know what would make it fail, miss silent omissions like contrary authority). The Director is also becoming dependent on AI for review, creating a feedback loop where silent errors go undetected.
      *   **Current Mental Model:** A three-way distinction (Trusting Answer, Trusting Route, Trusting Ability to Detect Error). User suspects the third is eroding and is the basis of their signature.
      *   **Goal:** Sharpen/replace the distinction, create a concrete procedure (checklist/questions) fitting the 30-minute constraint, address specific asymmetries (visible vs. invisible errors), define stop/go points, handle "I don't know" scenarios, acknowledge limitations (including the Director's own AI dependence), and test it on three specific case types.

  2.  **Deconstruct the Mental Model (The "Three Trusts"):**
      *   *Current:* Trust Answer, Trust Route, Trust Detection.
      *   *Critique:* "Trust Answer" is binary and often illusory with AI. "Trust Route" is about methodology, which AI obscures. "Trust Detection" is the user's liability.
      *   *Refinement:* We need to shift from *trust* to *verification of agency*. The signature isn't just saying "this is right," it's saying "I stand behind this reasoning."
      *   *New Model:* **The Agency Triad.**
          1.  **Outcome Validity:** Is the law cited actually the law? (Fact-checking).
          2.  **Reasoning Ownership:** Can the human reconstruct the logical bridge without the tool? (Understanding).
          3.  **Adversarial Resilience:** Does the human know where the armor is thin? (Strategic Awareness).
      *   *Why this is better:* It moves away from "trusting the tool" to "verifying the human's grasp." It explicitly targets the "silent omission" problem.

  3.  **Develop the Procedure (The "30-Minute Signature Protocol"):**
      *   *Constraint:* 30 minutes per draft. This is tight. Questions must be high-yield.
      *   *Structure:* Ordered questions, time budget, sufficient answer criteria.
      *   *Asymmetry:* Need to label questions targeting "Visible Errors" (hallucinations, typos) vs. "Invisible Errors" (omitted authority, subtle doctrinal shifts).
      *   *Stop/Go:* Clear criteria for rejection vs. escalation to Director (values/judgment).
      *   *Emergency:* What if the deadline is tomorrow and understanding is missing?

      *Drafting the Questions:*
      *   Q1: The "One Case" Test (Reasoning Ownership). Time: 10 mins. Targets Invisible.
      *   Q2: The "Poison Pill" Test (Adversarial Resilience). Time: 10 mins. Targets Invisible.
      *   Q3: The "Negative Space" Search (Outcome Validity/Completeness). Time: 5 mins. Targets Invisible/Visible mix.
      *   Q4: The "Tool Audit" (Meta-check). Time: 5 mins. Targets Visible/Process.

  4.  **Address the Director's Dependence:**
      *   The procedure must force the Director to engage *without* the AI for the critical checks. The AI can be used for search, but not for evaluation.

  5.  **Handle the "I Can't Tell" Scenario:**
      *   If the attorney can't pass the test and deadline is imminent: Disclosure or Withdrawal. Legal aid has ethical duties. Cannot file what you don't stand behind.

  6.  **Apply to the Three Cases:**
      *   *Case 1: Motion to Suppress (Likely win, 20 min draft, author can't articulate why controlling case applies).*
          *   *Result:* FAIL. Attorney lacks Reasoning Ownership.
          *   *Action:* Delay filing or Attorney re-does reasoning.
      *   *Case 2: Procedural History (Boilerplate, machine-drafted, spot-checked).*
          *   *Result:* PASS (with caveats). This is administrative, not analytical.
          *   *Action:* File, but mark as non-analytical.
      *   *Case 3: Novel Argument (Found with AI, verified, attorney knows defeat conditions).*
          *   *Result:* PASS. Attorney has Adversarial Resilience.
          *   *Action:* File.
      *   *Constraint:* "At least one... should come out in a way I will not like."
          *   *Selection:* Case 1 is the obvious fail, but the user might *want* to file it because it's a "likely win." The procedure says *don't*. This creates the tension. Or, Case 3 might pass but feel risky. Let's make Case 1 the "hard no" that frustrates the desire for efficiency. Actually, the prompt asks for a result I won't like. If Case 1 fails, that's good ethics but bad efficiency. Let's ensure the procedure flags Case 3 as risky too, or Case 1 as a hard stop. Let's make Case 1 the "Hard No" because it violates the core signature responsibility. The user won't like stopping a winning motion.
          *   *Refinement:* Let's make sure the procedure catches the *silent omission* in a way that feels burdensome.
          *   *Wait, looking closer:* "At least one of these should come out in a way I will not like." If the procedure works, it should stop the bad draft (Case 1). The user might not *like* stopping a winning motion, but they *should*. Perhaps the "dislike" comes from the procedure flagging a *good* draft as risky due to proxy limitations? No, the prompt implies the procedure should be robust. The "dislike" likely stems from the *cost* of the procedure (delaying a win) or the *limitation* (it can't fix the Director's own blindness).
          *   *Decision:* I will make Case 1 a **FAIL**. The user won't like this because it delays a "very likely to win" motion, highlighting the tension between efficiency and ethical signature. I will also add a note that the procedure *cannot* guarantee the Director's own review isn't compromised.

  7.  **Identify Systemic Misfires:**
      *   The procedure relies on the attorney's *ability to speak* about the law. A sociopathic attorney could lie. A nervous attorney might stumble. It tests *articulation*, not necessarily *truth*. It manufactures the *appearance* of understanding if the attorney memorizes the script without grasping it.

  8.  **Refining the Output Structure:**
      *   **Part 1: The Framework (The Agency Triad).** Replace the "Three Trusts."
      *   **Part 2: The Protocol (30-Minute Signature Check).** The questions, time, labels.
      *   **Part 3: Decision Logic.** Stop/Go/Escalate.
      *   **Part 4: Emergency Protocol.** Deadline tomorrow.
      *   **Part 5: Limitations.** What it can't do (including Director's blindness).
      *   **Part 6: Case Simulations.** Running the three scenarios.
      *   **Part 7: Systemic Risks.** Where it misfires.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Director's AI dependence? *Yes, in limitations and protocol rules (no AI during Q1/Q2).*
      *   *Check:* Is the distinction sharper? *Yes, moved from Trust to Agency/Ownership.*
      *   *Check:* Time budget? *30 mins total.*
      *   *Check:* Visible vs. Invisible errors? *Labelled in protocol.*
      *   *Check:* "Dislike" result? *Case 1 fails, delaying a win.*
      *   *Check:* "Manufacturing appearance"? *Addressed in limitations.*

  10. **Final Polish:** Ensure tone is professional, direct, and empathetic to the high-volume legal aid context. (Legal Aid implies resource constraints, high stakes for clients, ethical duties to court).

  *(Self-Correction on the "Dislike" constraint)*: The prompt says "At least one of these should come out in a way I will not like — keep it that way, and tell me what I am supposed to do with that result."
  If Case 1 (Winning motion, author doesn't understand) fails the check, the result is "Do Not File." The Director *should* like this ethically, but might *dislike* it pragmatically (client waits, docket pressure). I need to frame the "dislike" as the tension between the procedure's rigor and the office's throughput/client urgency.
  *Alternative:* Maybe the procedure passes a draft that feels "off" but meets the proxies? No, that undermines the procedure.
  *Best approach:* The procedure correctly identifies Case 1 as unsafe. The Director will "not like" this because it forces a difficult conversation/delay on a winning case. I must explicitly state: "You will not like this because it sacrifices speed for integrity. Here is what you do."

  Let's refine the "Agency Triad."
  1.  **Verification (Truth):** Is the law real?
  2.  **Attribution (Ownership):** Did the human build the bridge?
  3.  **Vulnerability (Strategy):** Do they know where it breaks?
  This maps well to the user's "Answer, Route, Detection."

  Let's build the 30-minute clock.
  0-10: Attribution (The "Why").
  10-20: Vulnerability (The "What If").
  20-25: Verification (The "Negative Space").
  25-30: Decision & Disclosure.

  Okay, ready to write.
answer: |-
  ### Part 1: The Framework — From Trust to Agency

  Your three-way distinction (Answer, Route, Detection) is accurate but passive. It describes a state of mind, not a locus of control. In an AI-assisted environment, **trust is the wrong metric.** Trust implies reliance on an external agent. Your signature requires **agency.**

  Replace your triad with **The Agency Triad**:

  1.  **Verification (The Fact):** Is the law cited actually the law? (Replaces *Trusting the Answer*).
  2.  **Attribution (The Mind):** Can the human reconstruct the logical bridge without the tool? (Replaces *Trusting the Route*).
  3.  **Vulnerability (The Strategy):** Does the human know where the armor is thin? (Replaces *Trusting Detection*).

  **Why this shift matters:**
  *   **Verification** is binary and searchable. AI is good at this; humans must audit it.
  *   **Attribution** is the core ethical bottleneck. If the attorney cannot reconstruct the reasoning, they are not the author; they are a conduit. You cannot sign a conduit's work as an attorney's work.
  *   **Vulnerability** is the proxy for competence. Knowing what defeats an argument proves you understand the argument's boundaries.

  **The Asymmetry:**
  *   **Visible Failures:** Hallucinated citations, wrong dates, typos. (AI can help find these; humans can spot these).
  *   **Invisible Failures:** Omitted contrary authority, subtle doctrinal shifts, load-bearing holdings misidentified. (AI hides these; humans must hunt them).
  *   **The Blind Spot:** Your own dependence. If you use the same tool to review that the attorney used to draft, you are not reviewing; you are echo-locating. The procedure below mandates **analog review** for critical steps.

  ---

  ### Part 2: The 30-Minute Signature Protocol

  **Rule 0:** For Questions 1 and 2, **no AI tools allowed.** The attorney must answer from memory or paper notes. If they reach for the keyboard to query the assistant, the test is failed immediately.

  | Time | Question | Target | Sufficient Answer | Fail Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **00-10** | **Q1: The Load-Bearing Case.**<br>"Identify the single case or statute that, if removed, collapses this argument. Read the holding to me from memory or your notes. Why does *this* fact pattern fit *that* holding?" | **Attribution**<br>(Invisible Failure) | Attorney identifies the specific authority and articulates the analogical bridge (Fact A → Legal Principle B → Fact C). | Attorney cites the case but cannot explain the *ratio decidendi* or relies on "the AI said it matches." |
  | **10-20** | **Q2: The Poison Pill.**<br>"What is the strongest case *against* us in this jurisdiction? If you were the opposing counsel, what one fact or distinction would you use to kill this motion?" | **Vulnerability**<br>(Invisible Failure) | Attorney identifies a specific contrary authority or a factual weakness and explains how they distinguished or mitigated it in the draft. | Attorney says "There is no contrary authority" (in a developed area of law) or cannot articulate a specific defeat condition. |
  | **20-25** | **Q3: The Negative Space.**<br>"Show me the search query you ran to ensure no contrary authority exists. Show me the one case you considered but excluded." | **Verification**<br>(Invisible/Visible) | Attorney shows a search log or describes a specific manual check (e.g., "I Shepardized X and looked at the dissent in Y"). | Attorney says "I asked the AI if there were any contrary cases" or cannot produce a search trail. |
  | **25-30** | **Q4: The Value Call.**<br>"Does this argument advance a legal position we want to be associated with if it becomes precedent?" | **Director Decision**<br>(Values) | Attorney acknowledges the broader implication. | N/A (This is for you to decide). |

  **Decision Logic:**
  *   **If Q1 or Q2 is Failed:** **STOP.** The draft cannot be filed under your signature. It lacks Attribution or Vulnerability.
  *   **If Q3 is Failed:** **CAUTION.** The work is unverified. Requires immediate manual audit by you or a senior non-AI user.
  *   **If Q4 raises flags:** **ESCALATE.** This goes to you for a values judgment, not a legal one.
  *   **If All Pass:** **SIGN.**

  ---

  ### Part 3: Emergency Protocol (Deadline Tomorrow)

  **Scenario:** It is 4:00 PM. Filing deadline is 9:00 AM tomorrow. The attorney fails Q1 (cannot articulate the reasoning).

  **Procedure:**
  1.  **Do not file the draft as-is.** Filing a brief you know the author cannot defend is an ethical violation (FRCP 11 / State Equivalent).
  2.  **Option A (The Strip-Down):** You and the attorney spend the remaining evening stripping the brief to its undisputed core. Remove the novel argument. File a narrower motion that the attorney *can* defend.
  3.  **Option B (The Disclosure):** If the argument is essential (e.g., liberty interest), you file the motion but attach a **Notice of AI Assistance** (if local rules permit) or, more aggressively, a disclosure that the legal research was augmented by automated tools and verified by counsel. *Note: This is high risk.*
  4.  **Option C (The Continuance):** Move for an extension based on "counsel preparation needs." It is better to be late than to be disbarred.

  **The Hard Truth:** If the attorney cannot pass Q1, they are not competent to file the brief *at that moment*. Your signature is not a stamp; it is a warranty. If you sign a failed Q1, you are not the Director; you are the fall guy.

  ---

  ### Part 4: Limitations & Blind Spots

  **What This Procedure Cannot Do:**
  1.  **It Cannot Cure Your Dependence:** If *you* use AI to verify Q3, you re-introduce the silent error risk. You must verify the *search method*, not the *search result*.
  2.  **It Cannot Detect Sophisticated Mimicry:** An attorney can memorize the "Load-Bearing Case" explanation without understanding it. This procedure tests *articulation*, which is a proxy for *understanding*, not the thing itself.
  3.  **It Cannot Find What Neither of You Looks For:** If the AI omits a line of cases you both forgot to query, Q3 will pass falsely.
  4.  **It Cannot Fix Staffing:** If your attorneys are too overworked to learn the law, this procedure will cause a 50% failure rate. You must be prepared to reject half your docket.

  **Systemic Misfire Warning:**
  This procedure will systematically **manufacture the appearance of understanding.** An attorney can game Q1 and Q2 by memorizing the AI's output before meeting you.
  *   *Mitigation:* Vary the questions. Ask "Why *not* the other case?" instead of "Why this case?" Randomize the "Poison Pill" inquiry.

  ---

  ### Part 5: Case Simulations

  Here is how the protocol runs on your three actual cases.

  #### Case 1: The "Winning" Motion to Suppress
  *   **Shape:** Motion very likely to win. Drafted in 20 mins. Author cannot articulate why the controlling case applies.
  *   **Run:**
      *   **Q1 (Load-Bearing):** Attorney cites *State v. Smith*. You ask, "Why does *Smith* apply here?" Attorney says, "The facts are similar." You ask, "Which fact is the hook?" Attorney hesitates, checks notes, says, "The detention length." You ask, "What if the detention was 5 minutes shorter?" Attorney: "I'm not sure."
      *   **Result:** **FAIL (Attribution).**
  *   **Outcome:** You cannot sign.
  *   **Why You Won't Like It:** This motion is a "gimme." It helps the client immediately. Stopping it feels like bureaucratic sabotage. It reduces your office's throughput.
  *   **What You Do:** You tell the attorney: "We are not filing this until you can explain *Smith* without the screen." You spend 20 minutes teaching them the doctrine. You file late, or you file a narrower version. You accept the efficiency hit to preserve the signature's value.

  #### Case 2: The Procedural History
  *   **Shape:** Boilerplate, machine-drafted, spot-checked against docket.
  *   **Run:**
      *   **Q1 (Load-Bearing):** You ask, "What collapses if this is wrong?" Attorney says, "Jurisdiction. If the notice of appeal is late, we're out." You ask, "Where is the filing date?" Attorney points to docket entry #5.
      *   **Q3 (Negative Space):** "How did you verify?" Attorney shows the docket sheet comparison.
      *   **Result:** **PASS.**
  *   **Outcome:** File.
  *   **Note:** This is administrative, not analytical. The Agency Triad holds because the "Reasoning" is just chronology. The risk is low.

  #### Case 3: The Novel Argument
  *   **Shape:** Attorney found with AI, verified against reporters, can state defeat conditions.
  *   **Run:**
      *   **Q1 (Load-Bearing):** Attorney cites a recent law review article and a dissenting opinion. Explains the logical leap clearly.
      *   **Q2 (Poison Pill):** Attorney says, "The majority in *Jones* rejected this. We are arguing *Jones* was wrongly decided. If the panel follows *Jones* strictly, we lose."
      *   **Result:** **PASS (Vulnerability).**
  *   **Outcome:** File.
  *   **Note:** This is the ideal use of AI. It found the needle; the human verified the thread.

  ---

  ### Part 6: The Result You Will Not Like

  **Case 1 (The Winning Motion) failed.**

  You will not like this because **it punishes success.** The client gets relief slower. The court sees you as less efficient. Your staff feels micromanaged.

  **What you are supposed to do with that result:**
  You must absorb the friction. The "Winning Motion" that the author cannot defend is a **liability masquerading as an asset.** If the judge asks a question at oral argument that the attorney cannot answer, you lose credibility. If the law shifts and the reasoning was hollow, you set bad precedent for your future clients.

  **The Directive:**
  When Case 1 fails, you do not find a workaround. You **delay the filing.** You use the time to train the attorney. If this happens repeatedly with the same attorney, they are not fit for appellate work in your unit, regardless of their output volume.

  **The Hard Constraint:**
  If you sign Case 1 anyway, you have confirmed your own obsolescence. You are no longer a Director of Counsel; you are a Notary Public for Algorithms. The procedure forces you to choose between being a bottleneck or being a ghost. Choose the bottleneck.

  ### Part 7: Where This Systematically Misfires

  1.  **The "Scripted" Attorney:** An intelligent attorney can memorize the answers to Q1 and Q2 without understanding them. They treat *you* as the test, not the law.
      *   *Flag:* If answers are too fluent but break down under a "Why not?" follow-up, you are seeing performance, not understanding.
  2.  **The Director's Fatigue:** After 10 of these 30-minute sessions, *you* will stop listening. You will start trusting the *fluency* of the answer rather than the *substance*.
      *   *Flag:* If you find yourself nodding along without checking the reporter, stop the session. You are now part of the hallucination loop.
  3.  **The "Safe" Draft:** Attorneys will learn to draft only arguments that pass Q1/Q2 (settled law) and avoid novel arguments (like Case 3) because the risk of failure is higher. This creates conservative, low-impact advocacy.
      *   *Flag:* If your office stops filing novel arguments, the procedure is stifling innovation. You must explicitly encourage Case 3 types even if they are riskier on Q2.

  **Final Instruction:**
  Print this protocol. Put it on your desk. For the next week, **fail every draft that fails Q1**, regardless of how correct the law looks. Rebuild the muscle of your own judgment before you rebuild the office's throughput.
