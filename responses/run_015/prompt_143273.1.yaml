prompt: |-
  hey — I'm on a volunteer committee rewriting the decision procedure for a housing placement org, and I've ended up being the person who has to write the "what counts as a defensible decision around here" page. Concretely: a caseworker gets about 40 minutes with a family, the portal lets them flag at most five units before the family's voucher clock runs out, and we do this a few thousand times a year. So I don't want a theory of rationality in the abstract; I want a spec I could hand to a supervisor who has to audit a written procedure, and to a new caseworker who has to follow it on their second day. Every time I go looking for one I get told that full optimization is off the table for creatures like us and then nothing about what to demand of whatever replaces it.

  So: write me the desiderata. Not a reading list — the list of things a theory of bounded rationality or satisficing has to deliver to be adequate *for this purpose* (auditing and teaching a real procedure, not publishing a paper), with the case or consideration behind each, and a verdict on which are non-negotiable and which are just the prejudices of one camp.

  Things I think might be on the list, in no order, and I genuinely don't trust any of them:

  - the procedure has to be runnable by someone tired, with a stopwatch — it can't contain "solve an intractable problem" as a subroutine
  - it has to be teachable: a new caseworker with the manual beats a new caseworker told to use judgment
  - it has to be auditable by someone who knows *less* than the caseworker knew at the time (this is the one I care most about; most of what I've read seems to assume an evaluator with the agent's full information)
  - it has to be able to say no. There have to be procedures it condemns, and it can't rescue every bad call by positing an unmeasured mental cost afterwards — I've started calling this budget-laundering and I want to know whether that's a real constraint or just my irritation
  - it shouldn't grade the interface: if the same units surface in a different order, or the pool is carvable into neighborhoods vs. into price bands, and the theory's verdict flips, it's evaluating a description rather than a decision
  - it should say when to spend the budget on reshaping the choice environment instead of on thinking harder (the other blade of Simon's scissors, roughly)
  - it should handle the stopping question and the drift question: when do you take the fourth unit and stop looking, and is a caseworker whose standards quietly slide downward after three bad weeks adapting or failing?
  - it should survive the fact that we cannot measure cognitive effort in anything like cardinal units, so a theory needing a cost-of-thinking number may just be unimplementable for us — fair demand, or are we whining?
  - it should converge to expected-utility maximization as resources go to infinity — I suspect this one is a neoclassical prejudice, especially given the results where knowing less or ignoring information does better

  Cases I want each requirement moored to, at minimum: the five-unit cap; the two interfaces that present the same forty apartments differently; the org's distribution versus the family's one shot (whose budget is the theory optimising for, and can it be both); the drift case; and our caseworker who is intransitive across three units but never sees the same triple twice, so the usual arbitrage-style objection doesn't obviously reach her.

  Two things I want on top of the list. First, I have a sinking feeling that some subset of these can't all hold together — if so, say which, and what has to give, because I'd rather have four criteria I can defend than nine that are secretly at war. Second, tell me which single criterion knocks out the most candidate theories, i.e. which one is actually doing the excluding.

  Last and briefly, no more than a short paragraph: how the three rough approaches I keep running into do against your list — optimization under an explicit computational budget; the fast-and-frugal / fit-to-the-environment heuristics picture; and the version that prices mental effort and tunes the procedure to the distribution of problems. I'll do the real scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Volunteer committee member rewriting decision procedures for a housing placement organization.
      *   **Task:** Write a "desiderata" list (specifications/requirements) for a theory of bounded rationality/satisficing suitable for *this specific context* (auditing and teaching caseworkers).
      *   **Context:** High volume (thousands/year), low time per case (40 mins), hard constraints (5 units max), high stakes (housing).
      *   **Constraints:** No abstract theory, no reading lists. Needs to be actionable for supervisors (auditing) and new hires (teaching).
      *   **Specific Questions:**
          1.  List desiderata with cases/considerations and verdicts (Non-negotiable vs. Prejudice).
          2.  Identify conflicts/trade-offs (which can't hold together).
          3.  Identify the "killer criterion" (which excludes the most theories).
          4.  Briefly evaluate three approaches (Optimization w/ budget, Fast-and-Frugal, Mental Effort Pricing) against the list.
      *   **Tone:** Pragmatic, rigorous, slightly weary but determined, avoiding academic fluff. "Spec I could hand to a supervisor."

  2.  **Deconstruct the User's Proposed List:**
      *   *Runnable by tired person:* Essential for implementation.
      *   *Teachable:* Essential for consistency.
      *   *Auditable by less-informed supervisor:* Crucial for the user. This is the hard part.
      *   *Say No (No budget-laundering):* Essential for accountability.
      *   *Interface Invariance:* Essential for fairness/robustness.
      *   *Reshape Environment:* Strategic, maybe secondary to immediate decision rules.
      *   *Stopping & Drift:* Essential for longitudinal consistency.
      *   *No Cardinal Cognitive Cost:* Practical constraint.
      *   *Converge to EU:* Suspected prejudice.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Criterion 1: Procedural Feasibility (The "Tired Caseworker" Test).*
          *   Case: 40-minute limit.
          *   Verdict: Non-negotiable. If it can't be done, it's not a procedure.
      *   *Criterion 2: Ex-Post Auditability (The "Less-Informed Supervisor" Test).*
          *   Case: Supervisor reviewing a file without knowing the family's vibe.
          *   Verdict: Non-negotiable. This is the user's core pain point.
      *   *Criterion 3: Falsifiability/Condemnation (The "No Budget-Laundering" Test).*
          *   Case: Caseworker picks a bad unit claiming "mental load."
          *   Verdict: Non-negotiable. Otherwise, anything goes.
      *   *Criterion 4: Description Invariance (The "Interface" Test).*
          *   Case: Same 40 apartments, different UI sort order.
          *   Verdict: Non-negotiable. Prevents manipulation by system design.
      *   *Criterion 5: Longitudinal Stability (The "Drift" Test).*
          *   Case: Standards sliding after 3 bad weeks.
          *   Verdict: Non-negotiable. Prevents burnout-induced inequity.
      *   *Criterion 6: Asymptotic Rationality (The "Infinity" Test).*
          *   Case: If we had 4 hours instead of 40 mins.
          *   Verdict: Prejudice. In bounded contexts, "better" doesn't always mean "closer to EU." (User suspected this).
      *   *Criterion 7: Cardinal Cognitive Pricing.*
          *   Case: Measuring "effort units."
          *   Verdict: Prejudice/Impossible. We can't measure this reliably.

  4.  **Identifying Conflicts (The "Can't All Hold Together" Question):**
      *   *Conflict:* **Auditability vs. Feasibility/Teachability.**
          *   To be auditable by someone with *less* info, the rules must be rigid. To be feasible for a tired human dealing with complex social realities, the rules need flexibility.
          *   *Resolution:* You have to sacrifice some nuance for auditability. The "spec" must be rigid enough to be checked, even if it occasionally misfires on edge cases.
      *   *Conflict:* **Description Invariance vs. Fast-and-Frugal.**
          *   Heuristics often rely on search order (e.g., "Take the first one that meets X"). If the interface changes the order, the decision changes.
          *   *Resolution:* The heuristic must be based on *attributes*, not *position*.
      *   *Conflict:* **Saying No vs. No Cardinal Costs.**
          *   If you can't measure effort, how do you know if "stopping early" was rational savings or laziness?
          *   *Resolution:* Use proxy metrics (time stamps, number of clicks) rather than internal states.

  5.  **Identifying the "Killer Criterion":**
      *   It's **Ex-Post Auditability by a Less-Informed Evaluator**.
      *   Why? Most bounded rationality theories (like Gigerenzer's heuristics or Simon's satisficing) are descriptive or normative for the *agent*. They rarely provide a checklist for a *principal* to verify the agent's process without knowing the agent's private information or cognitive state. This kills most "rational analysis" models that rely on implicit cost-benefit calculations of thinking.

  6.  **Evaluating the Three Approaches:**
      *   *Optimization under Budget:* Fails Auditability (hard to verify the budget calculation) and Feasibility (too hard to calculate).
      *   *Fast-and-Frugal:* Good on Feasibility and Teachability. Fails Description Invariance if based on search order. Passes Auditability *if* rules are explicit.
      *   *Mental Effort Pricing:* Fails the "No Cardinal Cost" constraint. Impossible to audit.

  7.  **Refining the Output:**
      *   Make it look like a spec document.
      *   Use the user's terminology ("budget-laundering," "drift").
      *   Ensure the "Verdict" is clear.
      *   Keep the final paragraph tight.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "intransitive caseworker" case?
      *   *Adjustment:* Add a note under Auditability or Stability about consistency. If A>B, B>C, but C>A in different weeks, that's drift/inconsistency.
      *   *Check:* Did I address the "Org vs. Family" budget?
      *   *Adjustment:* Clarify that the procedure optimizes for the *Family's outcome* subject to the *Org's constraints*.
      *   *Check:* Is the tone right?
      *   *Adjustment:* Avoid academic hedging. Be direct. "Non-negotiable" vs "Prejudice."

  9.  **Final Polish:** (Mental check of the "Killer Criterion" logic).
      *   Does "Auditability by less-informed supervisor" really kill the most theories? Yes. Most economic models assume the observer sees the same information set or can infer utilities. If the supervisor *cannot* know what the caseworker knew (the "vibe" of the family), the rule must rely on *process* traces, not *outcome* quality relative to hidden info. This rules out most consequentialist evaluations of the decision itself.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the spec. It is drafted to be inserted directly into your procedure manual's "Philosophy of Decision" section.

  ### Desiderata for a Bounded Decision Procedure

  **1. The "Tired Human" Constraint (Procedural Feasibility)**
  *   **The Spec:** The decision rule must be executable in under 35 minutes (leaving 5 for documentation) by an operator at 60% cognitive capacity, without external calculation aids.
  *   **The Case:** The 40-minute cap. If the rule requires solving a knapsack problem or estimating probabilities to two decimal places, it will be ignored or faked.
  *   **Verdict:** **Non-negotiable.** A procedure that cannot be followed is not a procedure; it is a suggestion.

  **2. The "Less-Informed Auditor" Constraint (Ex-Post Verifiability)**
  *   **The Spec:** A supervisor reviewing the file later must be able to verify compliance using *only* the data recorded in the portal, without access to the family's unrecorded preferences or the caseworker's internal state.
  *   **The Case:** Auditing. If the justification for rejecting a unit is "didn't feel right for the kids," the auditor cannot verify this. If the justification is "exceeds 40% of voucher value," the auditor can verify it.
  *   **Verdict:** **Non-negotiable.** This is your primary control against arbitrariness. It forces the procedure to rely on *process traces* (clicks, timestamps, checked boxes) rather than *mental states*.

  **3. The "No Budget-Laundering" Constraint (Falsifiability)**
  *   **The Spec:** The theory must define at least one observable pattern of behavior that constitutes a procedural failure, which cannot be excused by positing unmeasured cognitive costs.
  *   **The Case:** The caseworker who flags only one unit to save "mental effort." If "mental effort" is unmeasurable, this excuse is unfalsifiable. The procedure must specify a minimum search intensity (e.g., "must view at least 10 listings") that, if violated, is a violation regardless of claimed fatigue.
  *   **Verdict:** **Non-negotiable.** Without this, the theory explains everything and predicts nothing.

  **4. The "Interface Invariance" Constraint (Description Independence)**
  *   **The Spec:** The verdict on a decision must not change if the same set of units is presented in a different sort order or grouped by different categories (e.g., price vs. neighborhood), provided the underlying data is identical.
  *   **The Case:** The two interfaces. If a caseworker picks Unit A because it was at the top of the list, but would have picked Unit B if the list were sorted by rent, the decision process is fragile and manipulable by the UI designer.
  *   **Verdict:** **Non-negotiable.** Decisions must be driven by unit attributes, not position in a queue.

  **5. The "Drift" Constraint (Longitudinal Stability)**
  *   **The Spec:** The criteria for acceptance/rejection must remain stable over time for a given family profile, absent a change in the family's stated constraints.
  *   **The Case:** The sliding standards. A caseworker who accepts a 45% rent-to-income ratio in Week 1 but rejects it in Week 4 due to burnout is creating inequity. The procedure must distinguish between *adaptive learning* (updating based on market feedback) and *standard drift* (lowering bars due to fatigue).
  *   **Verdict:** **Non-negotiable.** Equity requires consistency across the thousands of annual cases.

  **6. The "Cardinal Effort" Constraint (Measurability)**
  *   **The Spec:** The procedure must not require assigning a numerical cost to cognitive effort (e.g., "spend 5 utils to think").
  *   **The Case:** We cannot measure cognitive effort. Any theory requiring a "cost of thinking" variable is unimplementable for auditing.
  *   **Verdict:** **Prejudice (to be rejected).** Demanding cardinal cognitive costs is whining for data we cannot have. Use time or count proxies instead.

  **7. The "Asymptotic Rationality" Constraint (Convergence)**
  *   **The Spec:** The procedure should yield the same result as expected-utility maximization if time/resources were infinite.
  *   **The Case:** If we had 4 hours, should we do the same thing? Not necessarily. In some environments, ignoring information is *always* better, even with infinite time (e.g., avoiding overfitting to noise).
  *   **Verdict:** **Prejudice (to be rejected).** This is a neoclassical holdover. In bounded environments, ecological rationality (fitting the environment) trumps logical rationality (consistency with axioms).

  ---

  ### Conflicts and Trade-offs

  You are correct to worry. **Desiderata 2 (Auditability) and 5 (Drift/Stability) are in tension with 1 (Feasibility).**

  To make a decision auditable by someone with less information (2) and stable over time (5), you must rigidify the rules (e.g., "Always reject if rent > 40%"). However, rigid rules fail the "Tired Human" test (1) when reality presents a complex exception that a human could easily navigate with judgment but the rule forbids.

  **What has to give:** You must sacrifice *nuance* for *auditability*. You cannot have a procedure that captures the full complexity of a family's needs *and* allows a supervisor to audit it without knowing the family. The spec must prioritize the **Audit Trail**. If a caseworker needs to make an exception, the procedure must require a specific "Exception Flag" with a predefined menu of reasons, rather than open-text justification. This increases the cognitive load slightly (bad for #1) but saves the audit function (critical for #2).

  ### The Killer Criterion

  **Desideratum 2: The "Less-Informed Auditor" Constraint.**

  This knocks out the most candidate theories.
  *   It kills **Optimization under Computational Budget**, because the auditor cannot verify the caseworker's internal calculation of the "optimal stopping point" relative to their cognitive budget.
  *   It kills **Mental Effort Pricing**, because the auditor cannot see the "price" the caseworker paid to think.
  *   It kills most **Descriptive Satisficing** models, which explain *why* a decision happened but provide no checklist for *whether* the process was valid.

  Only a **Rule-Based Heuristic with Process Traces** survives this. The theory must shift from "Did they maximize?" to "Did they follow the search protocol?"

  ### Evaluation of the Three Approaches

  **1. Optimization under Explicit Computational Budget:**
  Fails immediately. It requires the caseworker to calculate the value of thinking about thinking (meta-cognition), which violates the "Tired Human" constraint. It also fails Auditability, as the supervisor cannot verify the internal cost-benefit analysis.

  **2. Fast-and-Frugal / Fit-to-Environment Heuristics:**
  Strongest candidate. It passes Feasibility (simple rules) and Auditability (if the rules are explicit, e.g., "Stop after 5 matches"). However, it risks failing Interface Invariance if the heuristic relies on search order (e.g., "Take the first one that fits"). You must mandate *attribute-based* search rules, not *position-based* ones.

  **3. Mental Effort Pricing (Rational Analysis):**
  Fails the "No Cardinal Cost" constraint. It is theoretically elegant but operationally dead. You cannot audit a variable that does not exist in your data. It invites "budget-laundering" by allowing caseworkers to claim high cognitive costs to justify low effort.
