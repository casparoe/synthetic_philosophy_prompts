      *   *Check:* Did I address the "committee writing guidelines" point? *Correction:* Yes, frame the RAC (Recombinant DNA Advisory Committee) as the new bottleneck where unilateralism could occur (a lax member approving a risky protocol).
      *   *Check:* Is it too historical? *Correction:* Keep it conceptual. Focus on the *mechanics* of decision-making, not dates.

  9.  **Final Polish:** Ensure the distinction between "academic norms" (Asilomar) and "commercial incentives" (Crop novel) is clear, as that's likely where the user's story will diverge from history. (Asilomar worked because it was a closed shop of academics; crops involve corporations).

