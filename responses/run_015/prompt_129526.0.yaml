      *   *Refining the "Curse":* Make sure to emphasize that Asilomar is actually a rare *success* story against the curse, which makes it interesting for a novel about *failure*. Why did Asilomar succeed where the crop scenario might fail? (Answer: Homogeneity of actors vs. heterogeneity).

  8.  **Self-Correction/Check during drafting:**
