answer: |-
  Here is a complete lesson plan designed to meet your constraints. It treats the students as "Logic Machines" operating under Expressivist metaphysics, forcing the breakdown through mechanical friction rather than philosophical exposition.

  # Activity: The Marker Logic Game

  ## 1. Materials & Setup
  **For the Instructor:**
  *   Whiteboard for scoring.
  *   A "Master Rule Sheet" (projected or printed).
  *   14 "Situation Cards" (see below).
  *   14 "Argument Sheets" (see below).

  **For Each Pair (7 Pairs total):**
  *   **3 Marker Chips/Cards:**
      *   🔴 **DISAPPROVE (D)**
      *   🟢 **ENDORSE (E)**
      *   ⚪ **TOLERATE (T)**
  *   **1 "Torn" Token:** Given to one player in each pair at the start of Round 2.
  *   **Index Cards:** Blank, for writing marker assignments.

  **The Master Rules (Project this):**
  1.  **Atomic Sentences:** When you see a sentence without "NOT" or "IF", place the marker that matches your feeling (D, E, or T).
  2.  **Negation Rule:** If a sentence says "It is not the case that [__]", you **MUST** place ⚪ **TOLERATE** on the bracketed bit. No exceptions.
  3.  **Conditional Rule:** "If [Sentence A], then [Sentence B]" is **VALID** only if holding the Marker for A *forces* you to hold the Marker for B.
  4.  **Invariance Rule:** You are a pair. You must agree on whether an Argument Form is VALID. If one of you says Valid and the other says Invalid, **both lose 5 points**. (Your personal markers can differ, but your logic verdict cannot).
  5.  **Scoring:** +5 points for every argument form correctly identified as Valid/Invalid according to Classical Logic (which you will discover you cannot match). -5 points for Invariance violations.

  ## 2. The Argument List (Marker Language)
  *Do not use English moral terms on the cards. Use P, Q, R to prevent semantic drift. Provide a legend: "P = 'Stealing', Q = 'Lying', W = 'Wrong'." Actually, to fit your request, write them in the "Marker Language" directly on the sheets.*

  **Legend:** `[P: D]` means "Place Disapprove marker on P". `[~P: T]` means "Place Tolerate marker on ~P".

  **Round 1: Simple Assertion & Negation**
  1.  **Form A:** Premise: `[P: D]`. Conclusion: `[P: D]`. (Identity)
  2.  **Form B:** Premise: `[P: D]`. Conclusion: `[~P: T]`. (Negation Introduction)
  3.  **Form C:** Premise: `[~P: T]`. Conclusion: `[P: D]`. (Negation Elimination)

  **Round 2: The "Torn" Injection & Double Negation**
  *(Distribute "Torn" tokens now. One player per pair must mark Atomic P as ⚪ TOLERATE, even if they feel otherwise.)*
  4.  **Form D:** Premise: `[P: T]`. Conclusion: `[~~P: T]`. (Double Negation)
  5.  **Form E:** Premise: `[~~P: T]`. Conclusion: `[P: T]`. (Double Negation Elimination)
      *   *Note: Since `~` forces T, `~~P` forces T on `~P`, which forces T on `P`? No, `~~P` is a negated sentence, so it gets T. `P` is atomic. If Torn, `P` gets T. If Not Torn, `P` gets D/E.*

  **Round 3: Contraposition & Conditionals**
  6.  **Form F:** Premise: `If [P: D] then [Q: D]`. Conclusion: `If [~Q: T] then [~P: T]`. (Contraposition)
  7.  **Form G:** Premise: `If [P: D] then [Q: D]`. Premise: `[P: D]`. Conclusion: `[Q: D]`. (Modus Ponens)
  8.  **Form H:** Premise: `If [P: D] then [Q: D]`. Premise: `[~Q: T]`. Conclusion: `[~P: T]`. (Modus Tollens)

  **Round 4: The Nested Monster**
  9.  **Form I:** Premise: `[~(If P then Q): T]`. Conclusion: `[If P then ~Q: T]`. (Negation over Conditional)
  10. **Form J:** Premise: `[~(If P then Q): T]`. Conclusion: `[P: D]`. (Extraction)

  ## 3. Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Calibration**
  *   Divide into 7 pairs. Hand out Markers and Round 1 Sheets.
  *   Read Master Rules aloud. Emphasize the **Negation Rule** (Negation *forces* Tolerate) and the **Invariance Rule** (Agree on Validity or lose points).
  *   *Instructor Script:* "You are not judging truth. You are judging marker consistency. If the rules say Negation gets Tolerate, Negation gets Tolerate. Do not argue with the rules."

  **00:10 – 00:30: Round 1 & 2 (The Negation Trap)**
  *   Pairs process Forms A–E.
  *   **The Trap:** In Form B (`P: D` -> `~P: T`), they will likely mark Valid (following the Negation Rule). In Form C (`~P: T` -> `P: D`), they should mark Invalid (T doesn't force D).
  *   **The Torn Problem:** In Round 2, introduce the "Torn" tokens. One player *must* mark Atomic P as ⚪ T.
  *   *Observation:* Watch for Form D/E (Double Negation). Since `~` forces T, `~~P` is marked T. If the player is "Torn", `P` is marked T. `T` commits to `T`. They will mark Valid.
  *   *Conflict:* The player who is *not* Torn might mark `P` as D. `D` does not commit to `T`. They will mark Invalid.
  *   *Invariance Penalty:* Apply the penalty. This forces them to realize their logic verdicts depend on their psychological state, violating Invariance.

  **00:30 – 00:50: Round 3 (Contraposition & Conditionals)**
  *   Hand out Forms F–H.
  *   **The Contraposition Crash:** Form F asks if `If D then D` is equivalent to `If T then T`.
  *   *Prediction:* Students will say "Yes, obviously" (Classical intuition).
  *   *Mechanic:* But mechanically, `D` and `T` are different chips. Holding `D` does not force `T`.
  *   *Invariance Check:* The "Torn" player (who lives in T) will see the Contrapositive as Valid (T forces T). The "Committed" player (who lives in D) will see the Contrapositive as Vacuous or Invalid (D does not force T).
  *   *Result:* They lose points on Invariance again. They cannot agree on validity without agreeing on feelings.

  **00:50 – 01:05: Round 4 (The Monster)**
  *   Hand out Forms I–J.
  *   **The Monster:** `[~(If P then Q): T]`.
  *   Rule says: Because of the outer `~`, the whole thing gets T.
  *   Rule says: Inside the bracket, `If P then Q`... well, does `P` get D or T?
  *   *Task:* They must build the state. They will realize the rules don't tell them what marker goes on `P` *inside* a negated conditional. The rules only cover atomic negation.
  *   *Validity Check:* Does `[~(If P then Q): T]` commit them to `[P: D]`?
  *   Mechanically: No. T does not commit to D.
  *   Intuitively: Yes. If it's not the case that If P then Q, P must be true (and Q false).
  *   *Result:* Mechanics say Invalid. Intuition says Valid.

  **01:05 – 01:15: The Crisis & Scoring**
  *   Tally points. Most pairs should have negative scores due to Invariance violations.
  *   Ask: "Why did you lose points?"
  *   Expected Answer: "Because we felt differently, so our logic differed."
  *   Ask: "Can you fix the rules to make Classical Logic work?"
  *   *Allow 5 minutes for them to propose fixes.* (They will suggest making T a 'truth value' or adding more markers).
  *   *Intervention:* "If you add more markers, you are no longer playing Expressivism (3 attitudes). You are playing Realism (Truth Values)."

  **01:15 – 01:25: Debrief (Naming the Problem)**
  *   **Reveal:** "The problem you just fought is the **Frege-Geach Problem**."
  *   **Map the Mechanics to the Philosophy:**
      1.  **The Negation Rule (Tolerate):** This was the **Expressivist Semantics**. Moral sentences express attitudes. Negation expresses a specific attitude (Tolerance/Indifference).
      2.  **The Invariance Rule:** This was the **Requirement of Logic**. Validity cannot depend on who is speaking. If logic depends on whether you are 'Torn' or 'Committed', it's psychology, not logic.
      3.  **The Contraposition Crash:** This was the **Embedding Problem**. When 'Wrong' moves from the assertion (`P is D`) to the conditional (`If P is D`), it loses its marker force. You couldn't preserve the marker across the move.
      4.  **The Monster:** This was **Complex Embedding**. Expressivism has no rule for what attitude is expressed by negating a conditional.
  *   **The "Solution" They Proposed:** If they suggested "Just treat T as a truth value," point out: "That is exactly what the Realist accuses you of doing. You've abandoned Expressivism to save Logic."

  **01:25 – 01:30: Q&A / Exit**
  *   Assign reading for next time (e.g., Gibbard or Blackburn's reply).

  ## 4. Handling "Solutions" (Reverse-Engineering)
  Students will try to "beat" the game by creating a hybrid rule, e.g., "If I mark T, I treat it as 'Not D'."
  *   **Your Move:** Stop them. "The Master Rule says T is Tolerate. It does not say T is 'Not D'. In Expressivism, 'Not D' is a complex proposition. You only have chips for simple attitudes. You are not allowed to invent complex attitudes mid-game."
  *   **Why:** This mirrors the philosophical constraint. Expressivism wants to explain logic using *only* simple attitudes. If they need complex attitudes to make logic work, they have conceded the point.

  ## 5. Limitations & Instructor Notes
  **What the Game Can't Do:**
  *   **Higher-Order Attitudes:** The game cannot simulate Blackburn's "quasi-realism" or Gibbard's "norm-expressivism" where the attitude is *toward* the attitude (e.g., "Disapproving of Disapproving"). The markers are flat.
  *   **How to Supply This:** In the debrief, say: "You tried to fix this by making T mean 'Not D'. Philosophers like Blackburn say: 'Okay, but then T isn't a simple feeling anymore. It's a feeling *about* a feeling.' The game broke because we only had flat chips. The real theory tries to build stacked chips, but it gets very complicated very quickly."
  *   **Don't Let Them Off:** "Notice that to save the logic, you had to make the markers behave like Truth Values. The Expressivist wants to say 'No, they are still just feelings!' Your game experience shows why that is hard to maintain."

  ## 6. Predicted Failure Modes & Interventions

  **Failure Mode 1: Smuggling Realism**
  *   *Symptom:* A student says, "But if P is Wrong, that's a *fact*, so T means False."
  *   *Intervention:* **The "Blarg" Rule.** Stop the class. "Erase the word 'Wrong' from your mind. Replace it with 'Blarg'. P Blargs. Q Blargs. Does 'Blarg' have a truth value? No, it's a marker. If you talk about facts, you forfeit 5 points."
  *   *Why:* Forces them to engage with the *expressivist* constraint, not their realist intuitions.

  **Failure Mode 2: Semantic Drift**
  *   *Symptom:* The pair spends 10 minutes arguing whether "Lying" is actually wrong or if "Tolerate" means "Okay".
  *   *Intervention:* **The Robot Mandate.** "You are not moral agents today. You are Logic Machines. Your feelings are irrelevant inputs. Follow the Marker Rules, not your conscience. If you argue about the content, I will swap your partner."
  *   *Why:* Keeps the focus on the *structural* problem (logic), not the *substantive* problem (ethics).

  **Failure Mode 3: The "Torn" Player Quits**
  *   *Symptom:* The student with the Torn token says "This is stupid, I just mark D."
  *   *Intervention:* **The Audit.** Walk around and check chips. "I see you marked D on a Torn card. That is a Rule Violation. Your pair loses 5 points."
  *   *Why:* The "Torn" state is essential to show that T (Negation) and T (Indifference) collapse into the same marker, breaking the logic. They must experience the collapse.

  ## 7. Why This Works (Instructor Rationale)
  1.  **Invariance Rule:** This operationalizes the **Generality Constraint**. Students physically feel the frustration that their logical verdicts are contingent on their psychological state (Torn vs. Committed).
  2.  **Negation = Tolerate:** This forces the **Negation Problem**. By defining negation as a specific attitude (T) rather than a truth-function, you guarantee that Double Negation (`~~P` = T, `P` = D/E) fails to map.
  3.  **No "Embedding" Word:** By using "Bracketed Bits" and "Marker Placement," you prevent them from reciting the textbook solution. They have to *discover* that the marker placement rules don't scale to complex sentences.
  4.  **The Monster:** This ensures they don't think the problem is just about simple negation. It shows the system lacks recursion.

  This plan keeps you silent on the theory until the end, letting the mechanics generate the philosophical anxiety for you.
