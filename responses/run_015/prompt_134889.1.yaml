answer: |-
  The puzzle you have encountered is one of the most enduring in contemporary metaphysics, often called the problem of material constitution, and your instinct that there is only one thing on the pedestal is shared by many philosophers, though not all. To assess the chapter you read, we need to separate the logical core of the argument from the rhetorical claims made about its reception and implications. The chapter begins with the argument from differing properties, which relies on a principle known as the Indiscernibility of Identicals. This principle states that if two things are identical, they must share every single property. The book argues that the lump of clay and the statue have different properties because the lump existed before the statue and would survive being squashed, whereas the statue did not exist before the sculpting and would be destroyed by squashing. Professional metaphysicians generally accept that this is a valid logical argument; if you accept that the lump and the statue genuinely have these different modal properties regarding their past and future, then logic dictates they cannot be the same object. However, some philosophers would call this a simplification because it depends on how you understand time and objects. For instance, philosophers who believe in four-dimensionalism argue that objects are extended in time like worms, so the statue is just a temporal part of the clay worm, meaning they do not actually have different properties at the same time slice. But for those who believe objects are wholly present at each moment, the argument from differing properties is considered very strong, and it is not something professionals would reject outright.

  Where the chapter makes a significant misstatement is in its claim that the constitution view, which holds that the clay and statue are distinct but co-located, is generally regarded as refuted. This is not accurate within the professional literature. While the view is controversial, it is defended by prominent metaphysicians who argue that two objects of different kinds can occupy the same space at the same time without contradiction. They distinguish between identity and constitution, arguing that while the statue is made of the clay, it is not the clay, much like a marriage is constituted by two people but is not identical to those two people. The chapter presents the co-location objection as a knockout blow, but professionals see it as a cost of the theory rather than a refutation. The theory accepts co-location as a strange but necessary consequence of saving our intuitions about when objects come into and go out of existence. So, while many philosophers find co-location counterintuitive, claiming it is impossible or that the view is refuted is an exaggeration of the current consensus.

  The chapter then raises the objection about weight and cost, suggesting that if there are two objects, the museum bought two things for the price of one and the pedestal holds twenty pounds of weight instead of ten. This is a standard objection, but professionals who support the constitution view have a ready reply that the chapter overlooks. They argue that properties like weight are grounded in the matter, not the object type. The statue weighs ten pounds because it is constituted by ten pounds of clay; the weight is not additive because the statue does not have its own matter separate from the clay. It borrows its physical properties from the constituting matter. Therefore, the claim that there would be double weight is considered a misunderstanding of how properties are shared between constituted objects and their constituters. Philosophers would accept that this is a serious challenge that requires an explanation, but they would reject the idea that it proves the view is false, as the constitution theorist has a coherent explanation for why weight does not double.

  The book then offers its alternative, which is that there is only one object picked out by two descriptions, and that questions about survival are merely matters of how we choose to talk. This view is known as conventionalism or quantifier variance, and it is a live option in metaphysics, defended by philosophers like Eli Hirsch. However, describing this as the settled alternative is a simplification. Many philosophers argue that what exists is not up to us or our language but is a matter of mind-independent fact. They would reject the claim that it is merely verbal, arguing that there is a fact of the matter about whether the statue survives the squashing, regardless of our conventions. Furthermore, even among those who accept the one-object view, there is disagreement about whether this makes the puzzle verbal or metaphysical. Some argue that identity is absolute and not relative to descriptions. So, while the book's alternative is a recognized position, presenting it as the obvious solution that dissolves the problem is contested. Professionals would accept that language plays a role in how we individuate objects, but many would reject the strong claim that there is no fact of the matter about the object's persistence.

  The most problematic part of the chapter is its handling of the complication case involving the grain-by-grain replacement and the subsequent squashing and reshaping. The book claims that the constitution theorist must say the original statue comes back when the ball is re-formed because the clay survives. This is a subtle misstatement of the constitution view. Constitution theorists typically argue that artifacts like statues have historical and functional essences. Even if the same clay survives, the statue is not just the clay; it is the clay arranged in a specific way with a specific history. When the statue is squashed into a ball, the statue ceases to exist because its essential form is lost. When the clay is later reshaped, most constitution theorists would say this is a new statue, a replica, not the original Goliath, because the continuous history of the artifact was broken. The book seems to conflate the persistence of the constituting matter with the persistence of the constituted object. Professionals would reject the claim that the constitution view forces us to say the statue comes back; rather, the view allows us to say the clay persists while the statue perishes and is not resurrected. This distinction is crucial because it preserves the intuition that artifacts are not just lumps of matter but depend on their form and history.

  Finally, we must evaluate the book's two main conclusions in light of these corrections. The first conclusion, that the two-object view is refuted, does not survive scrutiny. As discussed, the two-object view remains a robust, defended position in metaphysics that accounts for the differing properties of the clay and the statue without logical contradiction, provided one accepts the possibility of co-location. The objections regarding weight and space are answered by distinguishing between the properties of the matter and the properties of the object kind. The second conclusion, that the alternative turns the puzzle into a merely verbal one, also fails to capture the full landscape of the debate. While some philosophers do argue for a verbal solution, others argue for a metaphysical solution where there is one object but its persistence conditions are objective facts, not linguistic conventions. The debate is not settled between a refuted dualism and a accepted verbalism; rather, it is an open conflict between constitution theorists, monists, eliminativists, and conventionalists. Your instinct that there is only one thing is philosophically respectable, but the argument from differing properties remains a powerful challenge that any one-object theory must explain away, perhaps by denying that the statue and clay really have different properties in the relevant sense or by accepting that our common sense concepts of objects are less precise than we think. The chapter you read simplified a complex, live debate into a settled victory for one side, which is common in popular philosophy but should be treated with caution when you are trying to work out the truth of the matter.
