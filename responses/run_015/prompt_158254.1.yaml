answer: |-
  ### (1) Final Exam Question

  **Course:** PHIL 405: 19th Century Philosophy
  **Time Allowed:** 45 Minutes
  **Weight:** 25% of Final Grade

  **Prompt:**

  The town of Oakhaven plans to erect a monument to Silas Vance (1890–1965), a local industrialist who funded the public library and hospital but whose factories were notorious for child labor and unsafe conditions. The town council is divided: one faction wants the plaque to celebrate Vance's philanthropy exclusively; another demands a full account of the labor abuses; a third suggests omitting the plaque entirely to avoid conflict.

  Using Nietzsche's *On the Use and Abuse of History for Life*, analyze this debate through the lens of his three modes of history: **monumental**, **antiquarian**, and **critical**. 

  In your essay, you must:
  1.  Explain how each mode would approach the Vance monument.
  2.  Argue which mode ought to dominate the council's decision to best serve "life," noting where Nietzsche's framework itself creates tension in this choice.
  3.  Address whether the existence of permanent digital archives (where every record of Vance is searchable forever) makes the **critical** mode easier to practice or renders Nietzsche's call for "active forgetting" obsolete.

  Do not use outside sources or citations. Write clearly and concisely.

  ***

  ### (2) Model Answer

  For Nietzsche, history is not an objective science but a tool that must serve life. When applied to the Silas Vance monument, his three modes reveal conflicting imperatives. The **monumental** mode looks to the past for inspiring examples of greatness. Proponents would argue the plaque should highlight Vance's philanthropy to inspire future benefactors. However, Nietzsche warns this mode often requires ignoring the "cost" of greatness, potentially falsifying history by omitting the labor abuses that funded the library.

  The **antiquarian** mode preserves the past out of piety toward one's roots. This faction would want to preserve the monument simply because Vance is part of Oakhaven's identity. The danger here, Nietzsche notes, is that the antiquarian instinct treats all past details as equally sacred. By refusing to discriminate between Vance's generosity and his cruelty, this mode mummifies the past, preventing the town from growing beyond its origins.

  The **critical** mode judges and condemns the past to allow the present to live freely. This faction demands the plaque expose the labor abuses. For Nietzsche, this is necessary when the past becomes a tyrant. By breaking the idol of Vance, the town liberates itself from the guilt of his actions. However, Nietzsche is torn here: while critical history is necessary for justice, an excess of it can destroy the illusions needed to act. If the town focuses only on Vance's sins, they may lose the inspiration needed to build their own future.

  Ideally, the **critical** mode must dominate the plaque's wording. To serve life, the town must acknowledge the truth of the abuses to prevent their repetition, rather than cultivating a false inspiration. However, this should be tempered by a monumental framing: not "Vance was a hero," but "We honor the community that survived Vance." This avoids the antiquarian trap of worshipping everything old.

  The existence of permanent digital archives complicates this significantly. Nietzsche argues that life requires a "horizon" bounded by forgetting; we cannot digest infinite history without becoming paralyzed. Digital archives create a perfect **antiquarian** memory where nothing is lost. This makes the **critical** mode harder, not easier. When every sin is permanently searchable, the past weighs heavily on the present, making "active forgetting" impossible. The council cannot simply "move on" because the digital record refuses to fade. Therefore, while archives provide data for critical judgment, they threaten the psychological condition Nietzsche deems necessary for health: the ability to close the book. The plaque should be critical, but the town must culturally practice forgetting the digital noise to avoid historical indigestion.

  ***

  ### (3) Marking Scheme & Instructor Notes

  **Grading Rubric:**

  *   **A Range (80-100%):**
      *   **Conceptual Integration:** Does not merely define the three modes but shows how they *conflict* in the scenario (e.g., Monumental inspiration requires Antiquarian omission).
      *   **Normative Argument:** Takes a clear stance on which mode should dominate, justified by Nietzsche's core thesis (history for life).
      *   **Digital Nuance:** Recognizes the paradox that digital archives support Critical evidence but undermine the psychological capacity for Forgetting (a key Nietzschean requirement).
      *   **Scholarly Accuracy:** Distinguishes between Nietzsche's descriptive taxonomy and his normative warnings about excess.

  *   **B Range (60-79%):**
      *   **Correct Definitions:** Accurately defines Monumental, Antiquarian, and Critical.
      *   **Application:** Applies modes to the scenario but treats them as separate options rather than tensions (e.g., "The council could use Monumental, or they could use Critical").
      *   **Digital Analysis:** Addresses the digital prompt but offers a simplistic view (e.g., "Digital makes history easier" without addressing the "forgetting" problem).
      *   **Argument:** Takes a stance but lacks justification based on Nietzsche's concept of "life."

  *   **C Range (50-59%):**
      *   **Summary:** Lists definitions without meaningful application to the Vance scenario.
      *   **Misinterpretation:** Confuses "Antiquarian" with "Antiquated" (treating it as simply "old") or misses the "Critical" mode's destructive necessity.
      *   **Incomplete:** Misses the digital archive component or the requirement to argue for a dominant mode.

  **Instructor Note on Scholarly Consensus vs. Contention:**

  When grading, please distinguish between settled textual interpretations and open scholarly debates:

  *   **Settled Scholarship:** It is consensus that Nietzsche distinguishes these three modes and that he views "excess history" as damaging to the plastic power of life. It is also settled that the **Critical** mode involves breaking the past to live, and that **Forgetting** is an active faculty essential to happiness.
  *   **Contested Application:** Whether Nietzsche's framework (designed for individual/cultural vitality) can justify **collective political remembrance** (like a town plaque) is debated. Some scholars argue Nietzsche is anti-democratic and would not care about "justice" for laborers; others argue his critique of idolatry supports social justice. Additionally, whether **digital archives** equate to Nietzsche's "historical education" or something fundamentally new is unresolved.
  *   **Grading Guidance:** Do not penalize students for taking different sides on the contested issues (e.g., whether Nietzsche would support the labor critique), provided they ground their argument in the text's logic regarding "life" and "health." Penalize only if they present a contested reading as the only possible interpretation.
