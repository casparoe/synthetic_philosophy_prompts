prompt: |-
  I'm taking this grad seminar on 19th century philosophy and we've been working through Nietzsche's second Untimely Meditation — the one on history being useful for life but also kind of dangerous if you overdose on it. Last weekend I was helping my dad clean out his garage and found these boxes of leters my great-grandfather wrote during WWII, some really heroic and others just... embarrassing? It made me think about whether we're supposed to preserve all that for the family or selectively forget parts, and now I have to draft the final exam question for the course (the prof asked me since I "have a good grasp," which is generous).

  I want an essay question for upper-level undergrads, answerable in about 45 minutes, on Nietzsche's three modes — monumental, antiquarian, and critical — but not one where they just list definitions and quote that thing about history serving life. Instead, give them a specifc scenario: a small town building a monument to a local industrialist who funded the library but also ran factories with awful conditions. The town council is fighting over whether to mention the labor abuses on the plaque, erase them, or just celebrate the philanthropy.

  The question should ask students to analyze the council debate through all three of Nietzsche's modes, then argue which mode ought to dominate here, noting where Nietzsche himself might be torn. They should also address whether digital archives — where every record is permanently searchable — make critical history easier or actually obsolete. Please provide (1) the exam question itself, (2) a model answer around 500-600 words, and (3) a marking scheme that distinguishes an A answer from a B by naming the specific conceptual moves required — like correctly seeing the tension between monumental inspiration and critical honesty, not just summarizing the three types. And please, separate what's pretty settled in the scholarship (that Nietzsche distinguishes these three uses) from what's genuinely contested (like whether his framework can justify collective political remembrance at all, or whether total digital preservation undermines his call for active forgetting), and don't present a contested reading as the consensus view. Also, no requests for bibliographies or citations — students won't have library access during the exam anyway. Oh, and I keep mixing up "antiquarian" with "antiquated," so please don't accidentally use the wrong one unless you're quoting my mistake, lol.
