      *   *Strict Reading:* Bob verifies locally (takes data), but the *meaning* of that verification (that it matches Alice's steering) only lands when the courier arrives. The prompt implies the verification data exists locally, but the *connection* is delayed. I need to make sure I don't violate no-signaling. Bob sees noise until he sorts by Alice's key.
