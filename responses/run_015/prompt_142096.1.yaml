answer: |-
  The fog off the strait didn't smell like salt; it smelled like ozone and wet concrete. North Station sat on the cliff edge, South Station on the headland opposite. Between them, the water was black and still. There was no bridge. There never would be.

  Elara sat in the control room at North. The room was heated to a constant twenty degrees, humming with the sound of cooling fans. On the table before her lay the Batch: twenty crystalline modules, each containing a pair of trapped ions. One half of each pair stayed in her rack; the other half had been shipped weeks ago to Kael at South. They were entangled. That was the only word that fit, though it felt like a metaphor stretched until it snapped.

  Her job was routine. Tuesday was Red Basis. Thursday was Blue. Today was Tuesday.

  She didn't know what Kael was doing. Protocol forbade comms during the run. If they spoke, the courier wouldn't need to come. The courier was the point.

  Elara engaged the lock on Module One. She chose her dial setting: Position A. She pressed the trigger. The ion in her trap fluoresced, a tiny spike on the monitor. Click. She logged the outcome: 1. She moved to Module Two. Position A. Click. Log: 0.

  She worked through the twenty modules. It took forty minutes. When she finished, she had a list of twenty binary digits and a record of her basis choice (Position A). She sealed the log in a canister and placed it in the pneumatic chute. The canister would shoot across the cable spanning the strait, arriving at South Station in ten minutes.

  Until then, the data was blind.

  ***

  At South Station, Kael was drinking coffee that had gone cold. He watched the canister arrive with a dull thud. He didn't open it. Not yet.

  First, he had to measure his halves. He loaded the twenty modules into his verifier. He didn't know what basis Elara had chosen. He didn't know what outcomes she had gotten. To him, the ions were just noise. He ran the tomography sequence. It took an hour.

  The screen filled with histograms. Uniform distributions. Static. If he looked at the whole batch, there was no pattern. The particles behaved as if they had no definite state, as if they were waiting for a question they hadn't heard yet.

  Kael leaned back. This was the part that kept him up during the crossing. He had the physical systems in front of him. He had measured them. They had clicked. Those clicks were real; they had triggered voltage gates, moved needles, burned data onto drives. They were here, in this room, in this dimension.

  But they meant nothing without Elara's key.

  He opened the canister. He took out the log. *Basis: Position A. Outcomes: 1, 0, 1, 1, 0...*

  He overlaid the key onto his data. He sorted his twenty results into subsets based on Elara's outcomes.

  The static vanished.

  Where Elara had logged a 1, Kael's particles showed a definite spin up along the axis corresponding to Position A. Where she had logged a 0, his showed spin down. The histograms sharpened into peaks. The noise resolved into signal.

  Kael stared at the screen. He hadn't touched his particles differently based on her choice. He had measured them all the same way. Yet, retrospectively, they behaved as if they had been prepared specifically for her choice.

  If he looked at the data before opening the canister, his particles were mixed. If he looked after, they were pure. The physical systems hadn't changed. The drives hadn't been rewritten. Only the grouping had changed.

  ***

  They met for debrief on Friday, neutral ground in the village between the cliffs. The rain had started, drumming against the window of the diner.

  Elara stirred her tea. "Did the verification hold?"

  "Perfect fidelity," Kael said. He wasn't smiling. "Whenever you picked Position A, my halves aligned. If you had picked Position B, they would have aligned to that incompatible basis instead. I checked the historical logs from last month. It holds."

  "So," Elara said. "When I turned the dial to A, I fixed the state of your ions."

  "You fixed the description," Kael corrected. "My ions didn't feel anything. No energy transfer. No signal across the water. If I had looked at them before your canister arrived, I would have seen nothing. No way to tell what you did."

  "But the pattern was there," Elara said. "Waiting in the clicks."

  "It was there in the same way a winning lottery ticket is in your pocket before you check the numbers."

  "That's the epistemic line," Elara said. "It's just information. My knowledge updated, so I sort the data differently. The state is a ledger."

  Kael tapped the table. "But the ledger constrains reality. I can't sort the data to show they were in Position B. They weren't. You chose A, so they *were* A. If the state is just knowledge, why does my knowledge have to obey your dial? Why does the universe force my ledger to match yours across a strait without a phone call?"

  Elara looked out at the rain. "Maybe the state is real. Maybe it's an object."

  "Where?" Kael asked. "Where is it, Elara? We have twenty particles. Ten here, ten there. If the state is a physical thing, it isn't in my trap and it isn't in yours. It's in a configuration space. Sixty dimensions. You can't point to it. You can't walk to it. It's a field spread over a mathematical space that doesn't exist physically, governing particles that do."

  "So it's not a thing," Elara said.

  "And it's not a belief," Kael said. "Because beliefs don't force voltage gates to trip in correlation."

  They sat in silence. The waitress refilled their coffee.

  "There's a third way," Elara said quietly. She wasn't looking at him. She was looking at the steam rising from her cup. "My grandfather was a clockmaker. He said the gears don't tell time. The rules tell time. The gears just follow."

  "A law," Kael said.

  "Not a law written down. A law that *is*. The quantum state isn't the stuff, and it isn't what we know about the stuff. It's the rule about what the stuff is allowed to do. When I turned the dial, I didn't send a signal. I didn't update a belief. I invoked a constraint. Your particles behaved that way because that's the only way they are allowed to behave given my choice."

  "That sounds cozy," Kael said. "But laws don't change based on who measures first. Gravity doesn't care if you look at it. But this..." He gestured between them. "This depends on the measurement. The rule changes depending on how you ask the question."

  "Maybe the rule is contextual," Elara said.

  "Then it's not a law," Kael said. "It's a habit."

  They finished their coffee. The bill came. They split it.

  Outside, the fog had rolled back in. They walked to their separate cars. Elara drove north, Kael drove south. Between them, across the strait, the relay stations hummed in the dark. The ions were reset. The traps were empty. The logs were filed.

  The data remained. It sat on the drives, perfectly correlated, perfectly useless without the other half. It was not a thing they could hold. It was not a thought they could think. It was a bridge made of math that held weight, but only if you didn't look directly at the water beneath it.

  Elara turned on her wipers. She thought about the sixty dimensions. She thought about the ledger. She thought about the clockmaker.

  She drove into the fog, and the radio played static until she found a station.

