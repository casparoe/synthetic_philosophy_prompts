answer: |-
  Dear Colleague,

  You have put your finger on a distinction that is often glossed over in popular discussions of the infinite, namely the difference between the abstract existence of a bijection and the structural cost of realizing one. While set theory tells us that a set is infinite if and only if it can be put into one-to-one correspondence with a proper subset of itself, your hotel scenario reveals that not all bijections are created equal. Some require a radical upheaval of the existing order, while others are mere local adjustments. There is no single standard name for the specific study of this relocation cost in the philosophical literature, though in mathematics it touches upon coarse geometry, the theory of bounded displacement permutations, and the study of amenability in groups. If we are to coin a term for the phenomenon you describe, I suggest we call it displacement-constrained accommodation, which distinguishes the cardinal capacity of a set from its kinematic capacity. The former asks whether a rearrangement exists at all, while the latter asks whether one exists within a specified bound of movement for the constituent elements.

  Your intuition regarding the natural numbers is mathematically sound and points to a boundary effect. In a hotel indexed by the positive integers, the set has a boundary of size one, specifically the first room. When you impose a bound k on how far any guest may move, you are effectively limiting the flow of guests across any cut in the sequence. To free up m rooms at the start, you must shift the entire tail of guests by at least m positions. If no guest moves more than k positions, you cannot shift the tail by more than k, and thus you cannot free more than k rooms. This is not merely a property of infinity but of the specific order type of the natural numbers, which possesses a starting edge but no ending edge. The cost of accommodation here is paid by the infinite tail of guests, each moving a finite distance, but the aggregate displacement is infinite.

  The situation changes subtly but significantly when we consider a hotel indexed by the integers, where there is no first room. Here the boundary is effectively empty. If you require that every guest moves at most k rooms, you can still free a finite number of rooms, but you cannot free infinitely many. To see this, imagine trying to free an infinite set of rooms while keeping displacement bounded. This would require the density of occupied rooms to drop, yet a permutation with bounded displacement preserves the asymptotic density of the set of occupied rooms. In the integers, you can free finitely many rooms by taking a semi-infinite ray, say the non-negative integers, and shifting them by k, but you cannot do this for the whole line without leaving a hole at negative infinity, which is not a room. Thus, your k-bound on the number of freed rooms survives in the integers in the sense that bounded displacement only permits the accommodation of finitely many new guests, but the mechanism is different because it relies on density preservation rather than a hard wall at room one.

  This dependence on discreteness and boundary is confirmed by your suspicion about the real numbers. If the rooms are indexed by the continuum, the notion of discrete guests moving discrete steps dissolves into measure theory. If we treat the guests as a fluid mass occupying the real line, a shift of x to x plus one frees the interval from zero to one. This interval contains uncountably many points, so in terms of cardinality, we have freed infinitely many rooms with a uniform displacement of one. The constraint collapses because the boundary of a half-line in the continuum is a point, but the "volume" behind that point is infinite. The distinction you have isolated is therefore essentially a property of discrete structures where the cardinality of the boundary is finite or countable, and it vanishes when the underlying space allows for continuous deformation without discrete jumps.

  When we move to a two-dimensional grid, the boundary considerations become even more illuminating. In a grid indexed by pairs of natural numbers, the boundary is the union of the two axes, which is itself infinite. If you shift every guest one step to the right, you free an entire column, which contains infinitely many rooms, yet every guest has moved only one unit. This does not contradict your earlier findings but refines them. The number of rooms that can be freed under a bounded displacement constraint is proportional to the size of the boundary of the hotel. In the one-dimensional natural number hotel, the boundary is one room, so you free one room per unit of shift. In the two-dimensional quadrant, the boundary is infinite, so you free infinitely many rooms per unit of shift. In the integer line, the boundary is zero, so you free no rooms in the bulk, only by truncating a ray. This suggests that the general principle is not about infinity per se, but about the isoperimetric profile of the index set.

  Regarding your final question on the axioms of set theory, you are quite correct. The claim that an infinite hotel must be able to accommodate a new guest relies on the set of rooms being Dedekind-infinite. In standard set theory with the axiom of choice, every infinite set is Dedekind-infinite, so the hotel can always be rearranged. However, without the axiom of choice, it is consistent that there exist infinite sets which are Dedekind-finite, meaning they have no bijection to any proper subset. For such a set, no rearrangement, regardless of cost, can accommodate a new guest. This provides a profound metaphysical wedge: even if we grant the existence of an actual infinite collection, it does not follow that it possesses the structural flexibility required for the Hilbert Hotel maneuver unless we also assume a principle like choice that guarantees this flexibility.

  Ultimately, the distinction you have drawn separates the static property of size from the dynamic property of reconfigurability. The standard paradox of the hotel exploits the former to induce shock, but your analysis shows that the physical or conceptual plausibility of the scenario depends entirely on the latter. If we view the guests as physical objects subject to constraints on velocity or energy, the bounded displacement model is the relevant one, and under that model, the magical flexibility of the infinite hotel is severely curtailed by the geometry of the room indexing. It turns out that the miracle of Hilbert's Hotel is not just that the set is infinite, but that it is an infinite set with a specific kind of loose boundary and no friction on displacement. Without those specific structural features, an infinite hotel can be just as full as a finite one.

  I hope this helps clarify the boundaries of the concept you are developing. It is a fertile distinction that deserves more precise treatment than it usually receives in metaphysical debates.

  Warmly,

  Your Colleague
