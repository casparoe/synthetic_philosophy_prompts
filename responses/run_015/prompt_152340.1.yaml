answer: |-
  # Chapter 1: Framing the Epistemology of Markets

  ## 1.1 The Purpose of Theory
  The purpose of a theory in the epistemology of markets is to provide **microfoundations for market design**. It is not sufficient for such a theory to merely describe equilibrium states; it must prescribe the conditions under which a market is viable. Specifically, the theory must satisfy two functional constraints:
  1.  **The Volume Condition:** It must specify when a market will sustain nonzero trading volume.
  2.  **The Epistemic Condition:** It must specify when the resulting clearing price constitutes evidence about the world that a non-participant (a bystander, regulator, or designer) may rationally use.

  Any account that fails to deliver on both conditions is descriptive of a market that either does not trade or does not inform. The following desiderata fix the standards against which candidate theories are to be scored.

  ## 1.2 Desiderata

  | # | Requirement | Phenomena / Distinction | Motivating Case | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Rational Volume** | Must explain nonzero volume without appealing to irrationality, exogenous noise, or error terms labeled as "liquidity." | **The No-Trade Theorem:** If all agents are rational expected-utility maximizers with common priors, common knowledge of rationality precludes trade based solely on information asymmetry. A viable design theory cannot rely on the presence of "fools" to sustain volume. | **Non-Negotiable** |
  | **2** | **The Epistemic Condition** | Must establish whose beliefs the price aggregates and justify why a bystander should treat price as evidence of the state of the world, not merely of participant endowments. | **Policy Forecasting:** A central bank observing futures prices must know if the price reflects aggregated private information about inflation or merely the risk-aversion profile of the hedgers present. | **Non-Negotiable** |
  | **3** | **Motive Separation** | Must distinguish informational motives from risk-sharing, liquidity, and noise. These drivers must be theoretically separable, even if empirically entangled. | **Hedging vs. Speculation:** A design optimized for risk-transfer (hedging) may suppress information aggregation (speculation). The theory must not collapse these distinct functions into a single "trading motive." | **Non-Negotiable** |
  | **4** | **The Counterparty Constraint** | Must respect that another party's willingness to trade is itself evidence (adverse selection). A theory cannot assume an agent can trade against a counterparty without updating on the fact that the counterparty is willing to trade. | **The Winner's Curse:** In common value auctions, winning implies your estimate was the most optimistic. A theory that ignores this inference predicts systematic losses for rational agents. | **Non-Negotiable** |
  | **5** | **Blind Book Resilience** | Must account for residual volume in a "blind book" (sealed orders, uniform clearing, no observation of others) endogenously. It must **explain** this volume, not explain it away as noise. | **The Call Market:** In a sealed-bid call market with identical information and mild exposure differences, inference-based theories predict zero volume. Empirically, volume drops ~50% and stabilizes. The theory must identify the rational driver of this stabilization (e.g., risk-aversion heterogeneity) without violating the Rational Volume constraint. | **Non-Negotiable** |
  | **6** | **Reflexive Consistency** | Must survive the fact that no-trade results, once published and commonly known, are themselves announcements that change the situation they describe. | **The Performativity of Theory:** If a theorem proves "no trade occurs under conditions X," and this becomes common knowledge, agents may trade *because* they anticipate others will not. The theory must be stable under its own publication. | **Non-Negotiable** |
  | **7** | **Protocol Neutrality** | The explanation for why trade occurs should not rest on features of the trading protocol that are merely information channels (e.g., order book visibility). | **Continuous vs. Call:** If a theory explains trade only by appealing to the information leakage in a continuous double auction, it fails to explain trade in sealed-bid mechanisms. | **Camp Preference** (Structuralists require this; Informationalists may resist). |

  ## 1.3 Incompatibility Flag
  **Conflict:** *The Epistemic Condition (2)* vs. *Blind Book Resilience (5)*.
  There is a tension between requiring price to be evidence about the *world* (information aggregation) and requiring volume to persist when information inference is blocked (blind book). In a blind book, if trade stabilizes due to risk-sharing (the only rational alternative to information speculation under common priors), the price primarily reflects marginal rates of substitution (endowments/risk), not the state of the world. A theory that satisfies (5) via risk-sharing may fail (2), as the price ceases to be a clean signal for a bystander. A theory that satisfies (2) via information asymmetry may fail (5), predicting zero volume when inference channels are sealed.

  ## 1.4 The Exclusionary Requirement
  The single requirement that excludes the largest number of usual families of views is **The Epistemic Condition (2)**: *Price must be something a non-participant may treat as evidence about the world.*

  *   **Why:** Pure **Noise Trader** models treat price as signal + noise, where noise often dominates, rendering price unreliable evidence for a bystander. Pure **Risk-Sharing (Hedging)** models treat price as a function of endowment distribution and risk aversion, not the state of the world. **Heterogeneous Prior** models treat price as an agreement between subjective worlds, which lacks objective evidentiary value for a bystander who does not share those priors.

  ## 1.5 Scoring of Candidate Families

  *   **Noise Trader Models:** **Fail.** Violate *Rational Volume (1)* by relying on exogenous irrationality. Often fail *Epistemic Condition (2)* as price is contaminated by unmodeled noise.
  *   **Heterogeneous Priors:** **Fail.** Violate *Epistemic Condition (2)* for a bystander (whose priors count?). Often violate *Reflexive Consistency (6)* as agreement theorems suggest priors should converge upon observing trade.
  *   **Ambiguity Aversion / Bounded Rationality:** **Fail.** Violate *Rational Volume (1)* by definition (appeal to deviations from expected utility or computational limits).
  *   **Pure Hedging (Risk-Sharing):** **Fail.** Violate *Epistemic Condition (2)*. Price reveals risk exposure, not information about the asset's value/state.
  *   **Information Asymmetry (Rational Expectations):** **Pass (Conditional).** Satisfies (1), (2), (3), (4). Struggles with *Blind Book Resilience (5)* (predicts zero volume without inference channels) and *Reflexive Consistency (6)* (no-trade theorems).

  *Verdict:* No existing family satisfies all Non-Negotiable desiderata. The survey must evaluate hybrid accounts that integrate risk-sharing (for Blind Book volume) with information aggregation (for Epistemic value) without collapsing into irrationality.
