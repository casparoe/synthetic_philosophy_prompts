      *   *Utility:* $u_i(a_1, \dots, a_N; \theta_i)$. Note: Utilities depend on *others'* actions because moral theories care about global outcomes.
      *   *Mechanism:* A mapping from reported types to recommended actions (or simply a social norm).
      *   *Gains from Trade:* Pareto improvement relative to the "autarky" baseline (everyone following their own theory's direct prescription).
