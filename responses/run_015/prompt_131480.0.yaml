answer: |-
  Here is the translation of the "Moral Trade" argument into standard market design vocabulary, followed by the residue report you requested.

  ### Part 1: The Translation

  **The Environment**
  *   **Agents:** $N$ players, $i \in \{1, \dots, N\}$.
  *   **Types:** Each agent has a private type $\theta_i \in \Theta$, representing their **moral theory**. This type defines a utility function $u_i(\cdot; \theta_i)$ over world states.
  *   **Action Space:** Each agent chooses an action $a_i \in A$ (e.g., "donate to charity X," "eat vegan," "lobby for policy Y").
  *   **Baseline (Autarky):** In the absence of trade, agent $i$ chooses $a_i^* = \arg\max_{a} u_i(a, a_{-i}^*; \theta_i)$.
  *   **Allocation Rule:** A mechanism $\phi: \Theta^N \to A^N$ that maps reported types to action recommendations. In the "strong version" (no bargaining), $\phi$ is a social norm or a focal point strategy.

  **The Proposed Mechanism (Moral Trade)**
  *   **Objective:** Find an allocation $a' = (a'_1, \dots, a'_N)$ such that for all $i$:
      $$u_i(a'; \theta_i) > u_i(a^*; \theta_i)$$
      (Strict Pareto improvement over the autarky baseline).
  *   **The "Trade":** Agent $i$ takes action $a'_i$ which is costly under $\theta_i$ (low marginal utility relative to cost) but highly valuable to agent $j$'s theory $\theta_j$. Agent $j$ reciprocates.
  *   **Incentive Constraints:**
      1.  **Individual Rationality (IR):** Participation must yield higher expected utility than autarky.
      2.  **Incentive Compatibility (IC):** Agents must not benefit by misreporting the cost of their actions or the value they place on others' actions.

  **The Equilibrium Notion**
  *   In the bargaining version: Nash Bargaining Solution over the surplus generated by moving from $a^*$ to $a'$.
  *   In the "no-contact" version: A Bayesian Nash Equilibrium where agents condition their actions on the statistical correlation between their own type and the types of others (or, in the stronger philosophical version, logical correlation).

  ---

  ### Part 2: Residue Report

  Here is the friction between the model and the reality of the argument, addressing your three specific points.

  #### 1. Where's the Numeraire? (The Interpersonal Comparison Problem)
  **The Friction:** You are correct. In a standard exchange economy, prices $p$ clear the market because utility is transferable via money (quasi-linear preferences). Here, there is no money.
  **The Translation Fix:** To make the math work, we must implicitly assume **cardinal utility** within each theory and solve for a bargaining weight $\lambda_{ij}$. The "exchange rate" is the ratio of marginal utilities:
  $$ \frac{\partial u_i / \partial a_j}{\partial u_j / \partial a_i} = \text{Exchange Rate} $$
  **The Residue:** This ratio is undefined without a meta-ethical bridge. In econ, we don't compare $u_i$ to $u_j$; we only check if $u_i$ increased. But to agree on *which* trade to execute (e.g., "I do 1 hour of X for 1 hour of Y" vs "1 hour of X for 10 hours of Y"), agents must agree on the *relative magnitude* of their moral gains.
  **Verdict:** The argument smuggles in **interpersonal utility comparisons** by treating "moral value" as a cardinal, comparable quantity across theories. Without a numeraire, the set of Pareto improvements is large and indeterminate. The "enormous gains" claim relies on assuming the exchange rate is favorable, which requires a normative agreement that functions exactly like a price system but lacks the discovery mechanism of a market.

  #### 2. Public Goods vs. Barter (The Free Rider Problem)
  **The Friction:** Most moral acts are non-rival and non-excludable. If I stop eating meat (Action $X$) because your theory values it, *everyone* who values animal welfare benefits, not just you.
  **The Translation Fix:** We must model this as a **contribution game** with positive externalities, not a bilateral barter.
  **The Residue:** The "barter" framing is misleading. It implies excludability ("I do this *for you*"). In reality, it is a public good provision problem.
  *   **Free Riding:** If 1,000 agents value Action $X$, and I trade with one of them to produce $X$, I have provided the public good to all 1,000. The other 999 have an incentive to *not* trade, hoping the first deal goes through.
  *   **Survival of the Argument:** The argument only survives if the "market" is thin (small $N$) or if agents derive **warm-glow utility** (private benefit from the act of contributing itself) that is excludable. If the value is purely consequentialist (the state of the world), the free-rider problem dominates, and the "gains from trade" collapse into a standard voluntary contribution mechanism failure.

  #### 3. Private Information & Incentive Compatibility (The Verification Problem)
  **The Friction:** $\theta_i$ is private. I know how much effort Action $X$ costs me, and I know how much I *claim* to value your Action $Y$.
  **The Translation Fix:** In a one-shot game without transfers, the only IC mechanism is a **dictatorship** or a **constant function** (Gibbard-Satterthwaite). Since there is no principal with a budget to run VCG (no money to subsidize truth-telling), we rely on **repeated games**.
  **The Residue:**
  *   **Misreporting:** I have a dominant strategy to claim Action $Y$ is infinitely valuable to me (to induce you to do it) while claiming Action $X$ is costly for me (to avoid doing it).
  *   **Stability:** The scheme is only IC in a repeated setting with reputation (folk theorem) or in a community with shared norms that punish defectors.
  *   **The "No-Contact" Version:** This version claims stability *without* repetition or reputation. In econ terms, this requires **correlated types**. It assumes that if I am the type of person who honors moral trades, you are statistically likely to be that type too. This moves from Mechanism Design to **Evidential Decision Theory (EDT)**. Standard game theory (Causal Decision Theory) says your action cannot causally influence mine without communication. The "no-contact" argument relies on logical correlation (if I reason this way, another agent reasoning the same way will do the same), which is outside standard equilibrium concepts.

  ---

  ### Part 3: Imported Assumptions & Vocabulary Limits

  **Assumptions I Quietly Imported to Make the Translation Work:**
  1.  **Consequentialism:** I assumed moral theories can be represented as utility functions over outcomes. Deontological constraints (rules that cannot be traded) break the model entirely.
  2.  **Cardinality:** I assumed agents can measure "how much" their theory values an outcome, not just the ranking.
  3.  **Commitment:** I assumed agents can commit to the trade. In reality, moral trade is often non-binding.
  4.  **Common Knowledge of Action Sets:** I assumed we agree on what actions are available. Often, moral disagreement is about *which* actions are permissible, not just their value.

  **What My Vocabulary Literally Cannot Say:**
  1.  **Objective Moral Truth:** In econ, $u_i$ is sovereign. If Agent A thinks slavery is wrong and Agent B thinks it's efficient, econ says "different preferences." Moral Trade assumes one theory might be *correct* and the other *mistaken*, yet they trade anyway. My framework treats all types as equally valid preferences; it cannot model "trading with someone who is morally wrong but useful."
  2.  **Acausal Influence:** The "strong version" of moral trade relies on the idea that my decision *logically necessitates* yours, even without causal contact. Standard game theory treats players as independent nodes unless linked by communication or correlation devices. My vocabulary has no operator for "logical subjunctive dependence."
  3.  **Identity Change:** Moral trade often aims to shift preferences (convert you), not just satisfy them. Market design takes preferences as fixed parameters.

  ---

  ### Part 4: The Verdict

  **Is your framework too thin, or is there a hole in the Moral Trade argument?**

  **Verdict: There is a significant hole in the Moral Trade argument that its fans haven't noticed, but your framework is too thin to capture the *normative* residue.**

  1.  **The Hole (Mechanism Design View):** The Moral Trade argument fails as a general mechanism. Without a numeraire, you cannot clear the market efficiently. Without verifiability, you cannot ensure IC. Without excludability, you cannot prevent free-riding. The "enormous gains" are largely an artifact of ignoring the transaction costs of bargaining over exchange rates and the incentive costs of private information. The "no-contact" version is, from a standard economic perspective, **magical thinking** (relying on EDT in a CDT world). It only works if the population is already highly correlated (a small, homogenous EA community), in which case it's just a coordination game, not trade.

  2.  **The Thinness (Economic View):** However, your vocabulary misses the **normative force**. In economics, if IC fails, the mechanism is "broken." In moral trade, agents might follow the rule *because it is right*, even if it's not incentive compatible. The "utility" in moral trade includes a term for **acting according to correct procedure**, which acts as an internal enforcement mechanism your model treats as exogenous.

  **Final Call:**
  Treat "Moral Trade" not as a market design problem, but as a **focal point selection problem in a coordination game among a pre-screened population**.
  *   If you try to scale it to a general population with heterogeneous, unverified types: **It collapses** (due to IC and Numeraire issues).
  *   If you view it as a way for a small club of high-trust agents to solve a public goods problem: **It works**, but it's just repeated-game cooperation, not "trade" in the economic sense.

  The "residue" you feel is the sound of **normativity** crashing into **positive analysis**. The moral traders are assuming a level of shared truth and trust that your models rightly treat as a variable to be solved for, not a parameter to be given.
