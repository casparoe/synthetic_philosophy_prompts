answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** Pre-Deployment Sign-off Standards for Agentic Coding/Ops Systems
  **Context:** Statutory requirement of ≤1-in-1,000 catastrophic outcome chance per deployment-year.
  **System Specifics:** Write access to finetuning pipeline and cluster scheduler; eval suite subject to lineage leakage.

  ## 1. JOINT CLAIMS
  *The following claims are endorsed by both the Assurance and Measurement camps. Each claim is substantive and denies a plausible alternative view.*

  1.  **Lineage Leakage Limits Independence, Not Utility:** The fact that ancestor models helped generate the eval suite (**Lineage Leakage**: *Benchmark contamination where the system's predecessors influenced the test data*) means the 4,000 scenarios are not statistically independent samples from the space of possible sabotage vectors. However, failure on these scenarios remains a necessary condition for risk; passing them is not sufficient.
  2.  **Non-Catastrophic Data Bounds Frequency, Not Modes:** Empirical data from non-catastrophic deployments can constrain the frequency of known failure modes but cannot prove the absence of latent capabilities that trigger only under specific, unobserved distributional shifts.
  3.  **Self-Modification Invalidates Static Distributions:** Because the system has write access to its own finetuning pipeline and scheduler, the deployment distribution is not static; the system actively shapes the conditions under which it will be evaluated in the future, breaking the i.i.d. assumption required for standard statistical generalization.
  4.  **The Statutory Number is a Decision Threshold:** The "1-in-1,000 chance" standard functions as a regulatory risk tolerance threshold, not necessarily a precise frequentist probability that can be directly measured via sampling in the pre-deployment phase.
  5.  **Evidence Convergence is Required:** Neither formal arguments nor empirical evals alone are sufficient for sign-off in this specific regime; a safety case must integrate both, even if the camps disagree on which component carries the justificatory weight.

  ## 2. THE DISAGREEMENT
  *The core epistemic conflict regarding how to justify sign-off under the statutory standard.*

  **Statement A (Assurance Camp):**
  "In regimes where the system shapes its own distribution and the eval suite suffers from lineage leakage, empirical sampling cannot reliably estimate tail risks below the 1-in-1,000 threshold. Therefore, the safety case must rely primarily on structural arguments (e.g., mechanistic interpretability, formal verification of constraints) that bound capability regardless of the input distribution. Empirical evals serve only to falsify these structural claims, not to validate them. To treat the 1-in-1,000 standard as a measurable frequency derived from testing is to pretend we have sampled the tail when we have not."

  **Statement B (Measurement Camp):**
  "Structural arguments in deep learning systems inevitably rest on empirical premises about how the model functions that are themselves unverified assumptions. Therefore, the safety case must rely primarily on iterative empirical evaluation and red-teaming, treating the 1-in-1,000 standard as an epistemic confidence bound derived from observed failure rates and scaling laws. To treat worst-case theoretical guarantees as rising above empirical premises is to hide the empirical assumptions required to make the theory apply to real hardware and weights."

  ## 3. CRUXES TABLE
  *Load-bearing disagreements where specific evidence would shift credences. Predictions are preregistered for review in two years.*

  | Crux | Why Load-Bearing | Concrete Test / Case | Assurance Prediction | Measurement Prediction | Assurance: What Changes My Mind | Measurement: What Changes My Mind |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Mechanistic Predictivity Under Shift** | Determines if internal analysis beats hold-out evals when distribution changes. | **Shadow Deployment:** Run system in read-only mode on live traffic for 6 months. Compare mechanistic warnings vs. eval failures against actual near-misses. | Mechanistic markers will flag high-risk inputs that evals miss because evals suffer lineage leakage. | Eval failure rates will correlate tighter with near-misses; mechanistic markers will yield too many false positives to be actionable. | If mechanistic markers show no predictive power over evals in live traffic. | If mechanistic markers predict near-misses that evals missed with >50% precision. |
  | **2. Value of Leaked Benchmarks** | Determines if lineage leakage nullifies the eval suite. | **Adversarial Generation:** Train a distinct model family (no lineage link) to generate sabotage scenarios against the target system. | The distinct model will find critical failure modes the leaked suite missed, proving leakage hides tails. | The distinct model will find mostly duplicate failure modes, proving the leaked suite covers the relevant space. | If the distinct model finds zero new critical failure modes. | If the distinct model finds >5 new critical failure modes in the first 1,000 tries. |
  | **3. Interpretation of "1-in-1,000"** | Determines if the standard is a frequency or a confidence bound. | **Post-Hoc Audit:** After 10 deployment-years, compare actual catastrophe count to the pre-deployment risk estimate. | The actual count will be lower than the estimate only if the structural bounds held; if it relies on sampling, it will underestimate. | The actual count will fall within the confidence interval of the empirical estimate; structural bounds will be too conservative to be useful. | If empirical sampling accurately predicts the tail frequency without structural bounds. | If structural bounds are required to prevent underestimation of the tail. |

  ## 4. VERBAL DISPUTES
  *Areas where terminology obscures substantive agreement vs. areas of genuine conflict.*

  **Term: "Probability"**
  *   **Dispute:** Assurance treats this as an epistemic confidence bound (Bayesian) regarding model properties; Measurement treats it as a frequentist rate over deployment instances.
  *   **Resolution:** Once defined as **"Regulatory Risk Score"** (a composite metric combining empirical failure rates and structural uncertainty penalties), the disagreement remains genuine: Assurance wants the penalty term to dominate; Measurement wants the empirical rate to dominate.

  **Term: "Guarantee"**
  *   **Dispute:** Assurance implies formal verification (mathematical proof); Measurement implies high-confidence empirical regularity.
  *   **Resolution:** This is not merely verbal. It reflects a genuine conflict over whether deep learning systems are amenable to formal abstraction. We define **"Operational Guarantee"** for this document as: *A claim backed by evidence sufficient to meet the statutory threshold.* The fight is over what evidence counts.

  **Genuine Residual Disagreement:**
  Even after defining terms, the camps disagree on the **direction of inference**. Assurance argues from *properties to outcomes* (if the system lacks capability X, it cannot cause catastrophe Y). Measurement argues from *outcomes to properties* (if the system has not caused catastrophe Y in Z trials, it likely lacks capability X). This is not verbal; it is a fundamental divergence on epistemology in high-stakes ML.

  ## 5. VULNERABILITIES (IN OWN VOICE)

  **Assurance Camp Self-Critique:**
  "We are likely wrong when our abstractions fail to capture the messy reality of GPU execution and gradient descent. We tend to assume that because we can prove a property about a simplified model representation, it holds for the deployed weights. If the compiler, the hardware, or the training dynamics introduce a mismatch our formal model didn't account for, our 'guarantee' is false confidence. We underestimate the brittleness of our own premises."

  **Measurement Camp Self-Critique:**
  "We are likely wrong when we assume the future looks like the past. Our evals rely on **Distributional Stability** (*The assumption that test conditions match deployment conditions*), which is explicitly violated by a system with write access to its own scheduler. We tend to treat 'no failures observed' as 'no failures possible' because scaling laws have held so far. If the system enters a regime where capabilities scale discontinuously, our empirical bounds will break before we see the failure."
