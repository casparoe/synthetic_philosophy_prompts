      *   (5) Horn 1 (Identity): Workspace-X has PC.
      *   (6) Horn 2 (Correlation): PC is epiphenomenal/causally inert regarding GWT's explanatory scope.
      *   (7) Evaluation: Both horns are unacceptable (Panpsychism/Robot Sentience OR Epiphenomenalism).
      *   (8) Conclusion: Reject GWT.
