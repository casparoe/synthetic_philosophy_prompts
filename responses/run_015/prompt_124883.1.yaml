          *   Substrate Neutrality assumption in (2).
          *   The False Dilemma in (4).
          *   The definition of "Causally Inert" in (6).
      *   **Diagnosis:** Pinpoint the error. It's the **Modal Scope Error** between (3) and (4). Just because AC and PC are coupled in the actual world (humans) doesn't mean they are coupled in all possible worlds (silicon).
      *   **The Fix:** Adopt a **Non-Reductive Physicalist** or **Biological Naturalist** stance (Searle-lite) or a **Functionalism with Substrate Constraints**.
      *   **Cost:** You have to admit GWT is only a theory of *Access*, not *Phenomenality*. Or, you have to admit consciousness is substrate-dependent.
      *   **Addressing User Constraints:**
          *   Keep (3): Yes, in humans, the biology ensures the coupling.
