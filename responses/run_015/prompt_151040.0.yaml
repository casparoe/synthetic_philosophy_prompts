answer: |-
  1. Brainstorming and diagnosis of the confusion
  Your query presupposes that Quine offers a systematic metaethics parallel to his philosophy of science. This constitutes the primary conceptual conflation. You incorrectly assume moral values function as theoretical posits akin to electrons or sets, chosen primarily for theoretical economy. However, Quine sharply distinguishes scientific ontology, which aims at truth about the world, from moral sentiment, which aims at social coordination. Secondly, you assume scientific underdetermination implies no fact of the matter in the same way moral disagreement might. For Quine, scientific underdetermination concerns theory choice given evidence, not the absence of truth conditions. Finally, you conflate epistemic virtues with moral norms. Quine views science as continuous with common sense regarding truth, whereas he tends towards a non-cognitivist or error-theoretic stance on ethics, viewing it as cultivated sentiment rather than factual description. Thus, the structural identity you propose ultimately collapses under Quine's strict naturalistic distinctions.

  2. Quine's actual position on moral values, epistemic values, and conceptual scheme
  Quine's naturalism places science as the ultimate arbiter of existence. Physical objects and sets are posits justified by their role in our best scientific theories. Epistemic virtues like simplicity and conservatism guide theory revision to maximise predictive success and systematic unity. However, Quine does not extend this ontological status to moral values. He regards moral statements not as descriptions of objective facts, but as expressions of sentiment or prescriptions for social conduct. While both science and ethics involve conceptual schemes, their functions diverge significantly. Science aims to predict and explain sensory stimuli; ethics aims to coordinate behaviour and cultivate shared sentiments. Quine suggests moral truths are not discovered but developed through social conditioning and cultural evolution. Consequently, epistemic virtues govern the acceptance of scientific theories regarding what exists, but they do not validate moral claims as fact-stating. Moral commitments are practical tools for living together, not hypotheses about the fabric of reality. Therefore, while both domains involve pragmatic choices, only science aims at truth in the robust, correspondence sense Quine reserves for natural knowledge. Moral values are part of our web of belief, but they occupy the periphery, sensitive to social utility rather than empirical falsification.

  3. Why moral disagreement is not parallel to scientific underdetermination
  Scientific underdetermination arises when multiple theories accommodate all sensory evidence equally well. Moral disagreement lacks this empirical constraint. There is no moral equivalent to sensory stimulation adjudicating between values. In science, underdetermination is a theoretical limit regarding truth; in ethics, disagreement reflects divergent sentiments. Quine holds science converges on truth because it is tethered to nature via evidence. Moral frameworks do not converge similarly as they track no independent facts. Therefore, moral disagreement is not underdetermined theory choice but a clash of conditioned responses. Scientific rivals remain truth-apt candidates. Moral frameworks are not truth-apt similarly; they are strategies for social cohesion. Thus, the structural identity fails because science is evidence-bound whereas ethics is sentiment-bound. The lack of a 'fact of the matter' in ethics stems from the absence of moral properties, not evidential scarcity. Consequently, pragmatic virtues resolve scientific theory choice, but only social utility resolves moral conflict.

  4. Bottom line: can a moral framework be genuinely mistaken on Quine's view?
  On Quine's view, moral frameworks cannot be mistaken regarding objective facts, as none exist. There is no moral reality to misrepresent. However, a framework can be practically erroneous if it fails to secure social coordination or leads to detrimental outcomes. Here, truth and utility collapse; a 'bad' moral scheme is simply one working poorly for its community. Thus, moral revision is guided by social pragmatic virtues rather than epistemic ones. We reject harmful norms not because they are false, but because they are maladaptive. Quine denies moral error in the factual sense but accepts it functionally. A scheme is not false, merely unfit for purpose.
