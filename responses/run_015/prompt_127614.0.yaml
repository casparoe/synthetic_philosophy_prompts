answer: |-
  ### Session Plan: Shattering the "Ten Coins" Illusion

  #### 1. The Foundational Idea (Pre-Case Setup)
  Before you introduce the nested case, you must decouple **Justification** from **Truth-Tracking** in their minds. Second-years treat justification as a "strength meter" for truth. If the meter is high enough and the belief is true, they assume knowledge follows.

  **The Concept to Lock In:** *Justification is internal coherence; Knowledge is external connection.*
  You need them to accept that a believer can be epistemically flawless (perfectly rational, evidence-responsive, diligent) and still be disconnected from the truth due to the *structure* of the world, not the *quality* of their reasoning.

  **How to establish it:**
  Do not start with Gettier. Start with the **Lucky Gambler**.
  *   *Scenario:* A gambler calculates odds perfectly, ignores superstition, bets on the statistically safest horse, and wins.
  *   *Ask:* Did he *know* he would win?
  *   *Consensus:* No. He had justification (stats) and truth (won), but the outcome was probabilistic.
  *   *Pivot:* "Gettier isn't about probability. It's about *deterministic luck*. It's when the reasoning is logically valid, the evidence is real, but the truth arrives by accident."

  #### 2. The Case Design: "The Double-Error Proof"
  Your nested-testimony idea is strong but dangerous. It risks becoming a **Transmission Failure** case (if the Adviser doesn't know, the Student can't know, regardless of luck) or an **Environmental Luck** case (the department is a "Fake Barn" of bad math).

  To make it a pure Gettier case, you must isolate **Intervening Luck** (luck between justification and truth) and block **Environmental Luck** (luck in the surrounding context).

  **The Setup:**
  *   **Proposition ($p$):** A specific complex equation equals zero.
  *   **The Student ($S$):** Checks the Adviser's office hours, confirms the Adviser is the world expert, reads the Adviser's draft which claims $p$, and verifies the *first* step of the proof personally (which is correct).
  *   **The Adviser ($A$):** Derived $p$ via a proof containing two algebraic errors that precisely cancel each other out. $A$ is justified (peer review missed it), $p$ is true (verified by computer elsewhere), but $A$'s derivation is bogus.
  *   **The Student's Epistemic State:** $S$ has no access to the full derivation, only the assertion and the first step. $S$ is internally blameless.

  **Properties It MUST Have:**
  1.  **Competent Source:** The Adviser must be generally reliable. If the Adviser is a known crank, $S$ lacks justification entirely (not a Gettier case).
  2.  **Hidden Defect:** The errors must be undetectable to $S$ and undetected by $A$. If $S$ could have found the error with "due diligence," it's a negligence case, not Gettier.
  3.  **Independent Truth:** The theorem must be true *independently* of the proof (e.g., verified by a computer oracle or a different method). This ensures the belief is True, but not *because* of the justification.

  **Properties It MUST Lack:**
  1.  **No Deceptive Environment:** Do not suggest the math department is full of fake proofs. The world is normal; the *chain of inference* is the problem. This prevents it from collapsing into "Fake Barn" territory.
  2.  **No Defeaters:** $S$ must have no reason to doubt $A$. If $S$ has a defeater, $S$ isn't justified.
  3.  **No Transmission Reliance:** Do not frame it as "$S$ knows because $A$ knows." Frame it as "$S$ has done everything right, but the truth is accidental relative to $S$'s evidence."

  #### 3. Misconception Mapping & Kill Sequence
  Students will defend the JTB model in a specific order. You must kill these misconceptions at specific points in the arc.

  **Misconception 1: "Justification is just strong belief/confidence."**
  *   *When it arrives:* Immediately, during the Foundational Idea phase.
  *   *Where to kill it:* **Before the Case.**
  *   *The Kill:* Use the **Delusional Math Genius**. A student is 100% confident $2+2=5$ because they "feel" the numbers. They are justified *internally* (to them), but we deny they have knowledge.
  *   *The Point:* Justification requires *evidence*, not just conviction. But as the Gettier case will show, evidence isn't enough either.

  **Misconception 2: "The whole problem is false premises."**
  *   *When it arrives:* During the Case analysis. They will say, "The Student's premise 'Adviser says $p$' is true, but the Adviser's premise 'Proof works' is false. That's just the Smith/Jones false lemma again."
  *   *Where to kill it:* **During the Case Dissection.**
  *   *The Kill:* Point out that $S$ does not believe the false lemma. $S$ believes "Adviser says $p$." That premise is *true*. The Adviser believes "Proof works." That premise is *false*.
  *   *The Point:* Gettier cases don't *require* the believer to hold a false lemma. They require the *truth of the belief* to be independent of the *justification for the belief*. Even if we strip the false lemma from $S$'s mind, the luck remains.

  **Misconception 3: "Checking more would fix it."**
  *   *When it arrives:* At the end, as a defense mechanism. "If the Student just checked the whole proof, they'd know."
  *   *Where to kill it:* **Post-Case Closure.**
  *   *The Kill:* "If the Student checks the proof, they become the Adviser. Now construct a Gettier case for the *Adviser*. The Adviser checks the proof, but their calculator has a glitch that cancels out a typo. You can push the luck back, but you can't eliminate the structural gap between 'reasons' and 'truth' just by adding more steps."
  *   *The Point:* Gettier is structural, not a matter of effort.

  #### 4. The Literature Exclusion
  **Do Not Teach:** **Modal Safety Conditions (e.g., Pritchard, Williamson).**
  *   *Why:* This requires understanding "nearby possible worlds" and counterfactual semantics. Second-years will get bogged down in metaphysics ("What counts as a nearby world?") and lose the epistemological thread. It turns a problem about *luck* into a problem about *modal logic*.
  *   *How to Deflect:* When a student suggests, "But in most worlds, the proof is wrong," say:
      > "That's a 'Safety' solution, and it's a powerful tool. But right now, we are diagnosing the disease in the *actual* world. If we jump to possible worlds, we're prescribing the cure before we agree the patient is sick. Stick to the structure of *this* scenario."

  *(Note: Avoid Reliabilism too, but only if they get technical about 'process types'. If they say 'the process wasn't reliable,' accept that as an intuition, don't formalize it into Process Reliabilism.)*

  #### 5. The End Question
  Do not ask them to summarize the case. Ask them to identify the **dependency**.

  **The Question:**
  > "Imagine we fix the Adviser's calculation so it is error-free. The Student's evidence remains exactly the same. The Theorem remains true. Does the Student now have knowledge? If yes, **what specific relationship changed between the Student's mind and the truth?**"

  **What you are looking for:**
  *   *Wrong Answer:* "They have more justification." (No, evidence is identical).
  *   *Wrong Answer:* "They are more confident." (Irrelevant).
  *   *Right Answer:* "The truth of the theorem is now *because of* the justification, rather than *alongside* it." (They must identify that the *causal/explanatory link* is the missing ingredient, not the amount of evidence).

  If they can articulate that the *connection* matters more than the *content*, they have grasped the structural gap. If they say "The proof is better," send them back to Intro.
