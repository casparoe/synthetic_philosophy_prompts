      *   *Phase 2 (Skinnerian):* **Reinforcement.** Everyone keeps their own sequence. They can change *one* card. If score goes up, keep change. If down, revert. (Trial and error).
      *   *Phase 3 (Popperian):* **Pre-selection.** Before placing cards, they must write down a prediction of the score on a slip. If prediction is wrong, they lose points. This forces internal modeling. *Wait, better:* They are allowed to "test" a sequence on a "scratch pad" (mental simulation proxy) before committing.
      *   *Let's tighten the "Information Flow" constraint.*
      *   *Phase 1 (Darwinian):* No memory. You get a hand of cards, lay them down, get score. Discard. New hand. (Selection happens on the *sequences*, not the people). *Actually, for a workshop, the people are the agents.*
      *   *Let's try this:*
          *   **Task:** Guess the Hidden Rule to maximize score (0-10).
          *   **Phase 1 (Darwinian):** You submit a sequence. Facilitator returns it with a score. If score < 5, you are "out" (sit out next round). If score > 5, you stay. You must generate the next sequence *randomly* (draw from bag). You cannot learn. (This simulates blind variation + selection).
