      *   P3: 15.
      *   P4: 15.
      *   P5: 10.
      *   Debrief: 25.
      *   Total: 90. Perfect.

  9.  **Addressing the "Journalist" Audience:**

      *   They are skeptical. They hate being "taught."
      *   Tone: "We are running an experiment. I am the protocol. You are the subjects/agents."
      *   Avoid jargon until the end.
      *   Make the frustration of Phase 1 palpable.

  10. **Final Review against Constraints:**

      *   *Same task?* Yes (5-slot code).
      *   *Only rules change?* Yes (Info feedback loop).
      *   *No labels until end?* Yes.
      *   *Materials:* Cards, paper, pens, flipchart.
      *   *Payoff:* Points on a leaderboard.
      *   *Log line:* "Round X: My Score was __. My Strategy was __."
