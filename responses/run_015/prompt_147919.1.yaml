answer: |-
  This is a compelling framework. Reading *The Metamorphosis* through the lens of moral gradualism—the idea that sentience and moral status exist on a sliding scale rather than as a binary switch—reveals that Kafka is not merely writing a metaphor for alienation, but staging a brutal ethical experiment.

  However, the text ultimately resists a clean philosophical mapping. While the story dramatizes the dangers of gradualism, it complicates the "human mind in bug body" premise by suggesting that embodiment dictates cognition. Gregor does not stay at the top of the moral spectrum; he slides down it, and the horror lies in how seamlessly his family's ethics adjust to match his decline.

  Here is a reading of the text that takes the philosophy seriously while respecting Kafka's ambiguity.

  ### 1. The Spectrum and the "Access Problem"
  Your premise posits a spectrum: Thermostat (object/function) < Insect (pain/nuisance) < Human (rationality/dignity). In a capacity-based ethical framework (like Peter Singer's), moral status tracks cognitive ability. If Gregor retains his human mind, he retains human status.

  Kafka highlights a fatal flaw in this framework: **The Access Problem.** Moral status is usually granted based on *observed* capacity. Because Gregor's voice is unintelligible and his form is monstrous, his family cannot access his human interiority. They are forced to judge him by external markers: utility and appearance.

  Initially, Gregor is treated as a **Damaged Human**. He is fed, his room is kept, and Grete speaks to him. But this status is contingent on his utility as a provider. Once that utility vanishes, the family begins to recalculate his position on the spectrum. They do not treat him as a "human trapped in a bug"; they treat him as a "bug that used to be human." The story dramatizes the danger of gradualism: it provides a moral loophole. If status is a gradient, you don't need to commit murder to kill him; you just need to slowly withdraw the protections of personhood until his death is a matter of sanitation, not ethics.

  ### 2. The Apple: Crossing from Patient to Threat
  The apple-throwing scene is the critical inflection point on this moral spectrum. Before this, Gregor is a burden; after this, he is a threat.

  When Grete throws the apple, it is an act of violence that would be criminal against a human but is permissible against a pest. The apple lodges in Gregor's back and rots there. This is significant. If Gregor were a patient, the apple would be removed (medical intervention). Because it is left to rot, Gregor is reclassified as **Biological Waste**.

  This moment maps a specific drop in moral status. He moves from the "Insect" tier (which might warrant mercy or simple removal) to the "Dangerous Object" tier. The injury slows him down, diminishing his cognitive agency further. He can no longer climb the walls; his world shrinks. The violence doesn't just hurt him; it enforces the downgrade. The family accepts the infliction of permanent physical damage because they have decided his capacity for suffering no longer demands intervention.

  ### 3. The Cleaning Woman: The Thermostat Threshold
  The cleaning woman's final dismissal—"It has croaked" (*es ist krepiert*)—is the final data point. She does not say "he died." She uses a verb typically reserved for animals or broken machinery.

  This is the **Thermostat Level** of the spectrum. A thermostat is disposed of when it stops functioning. Gregor is now purely matter. The cleaning woman represents the external, objective moral gaze of society. Unlike the family, who are tangled in guilt and history, she sees the ontological reality: there is a carcass in the room. Her ability to dispose of him with a brook highlights that Gregor has successfully traversed the entire spectrum from Subject to Object.

  If the story were purely about alienation, this moment would be symbolic. But because the body is physically real in the text, this is an ontological statement: **When the capacity for relation is gone, the entity becomes trash.**

  ### 4. The Ambiguity of Gregor's Mind
  You ask if the ambiguity of Gregor's inner life undercuts the philosophical reading. I argue it deepens it, but it challenges your premise that "his inner life hasn't changed."

  Kafka is careful to show that Gregor's cognition *does* degrade.
  *   **Early:** He worries about his job, his debts, and his family's finances.
  *   **Middle:** He loses interest in human food, craves rot, and enjoys crawling on the ceiling.
  *   **Late:** He loses language. He cannot understand his sister's violin playing as music, only as an unknown nourishment. He forgets his past.

  This suggests that Kafka rejects the "ghost in the machine" dualism. You cannot have a fully human mind in a vermin body because the body shapes the mind. Gregor's moral status *actually does slide down the spectrum* because his cognitive capacities genuinely diminish.

  This complicates the ethical indictment. The family isn't *entirely* wrong to treat him as less than human, because he is becoming less than human. The tragedy is not that they misjudge his status, but that **the status change is inevitable.** The metamorphosis is total. This undercuts a reading that says "Gregor is fully human and deserves rights." Instead, Kafka suggests that "humanity" is a fragile state dependent on biology. If you lose the biology, you lose the mind, and thus you lose the rights.

  ### 5. Alienation vs. The Thermostat Problem
  Is the story just using a gross body to talk about alienation? No. If it were just alienation, the bug would be a clear metaphor for depression or illness. But the bug has physical needs (rotting cheese, climbing walls) that conflict with human needs.

  The story *is* doing work on the "thermostat-to-insect" problem. It asks: **At what point does care become maintenance, and maintenance become disposal?**

  The Samsa family's recovery at the end confirms the utilitarian calculus. As Gregor's status dropped, theirs rose. They get jobs, they move to a smaller apartment, they see a future. Gregor's reduction to "object" was the prerequisite for their restoration to "subjects." Kafka is showing that moral gradualism allows for sacrifice. If Gregor were binary (Human or Not), killing him would be murder. Because he is on a gradient, his disposal is just housekeeping.

  ### 6. Where the Text Resists the Framing
  However, the text resists a clean philosophical resolution in two key ways:

  **A. The Persistence of Memory:** Even as Gregor degrades, he retains emotional memory. He dies thinking of his family with "tenderness and love." This emotional residue refuses to let him hit the bottom of the "Thermostat" scale. A thermostat does not love. This lingering interiority haunts the family's utilitarian calculus. It suggests that moral status might not be about *capacity* (which Gregor lost) but about *history* (which remains). The gradation model fails to account for the moral weight of the past.

  **B. The Absence of a Metric:** Kafka never gives us a ruler to measure Gregor's soul. We never know exactly when he stops being "Gregor." This ambiguity is a feature, not a bug. It forces the reader into the same position as the family: we are judging based on external evidence. By denying us omniscient access to Gregor's humanity, Kafka implicates *us* in the gradualism. We, too, are waiting to see if he acts enough like a bug to justify his death.

  ### Conclusion
  Kafka is dramatizing the problem with gradualism, specifically its capacity to sanitize violence. The story shows that if moral status is a gradient, dehumanization is not a sudden event but a process of attrition. The apple and the broom are the tools of that attrition.

  However, the story ultimately argues that the "thermostat-to-insect" scale is a trap. By showing Gregor's mind degrading alongside his body, Kafka suggests that we cannot separate moral worth from physical form. The horror isn't that the family treats a human like a bug; it's that the bug body *makes* the human mind impossible to sustain. The story resists a clean philosophical solution because it posits that our moral status is not a right we hold, but a condition we maintain—and when the body fails, the ethics fail with it.
