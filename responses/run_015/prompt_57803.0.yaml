answer: |-
  I am so sorry you are facing this. It is one thing to discuss the trolley problem or advance directives in a seminar room, and quite another to sit at a bedside while your family fractures over the outcome. It is completely understandable that this feels heavy right now.

  Given your background in medical ethics, I will speak to you using the frameworks you likely recognise, but grounded in the legal reality of the UK (specifically England and Wales, under the Mental Capacity Act 2005, which is the standard reference for British medical ethics).

  ### 1. The Legal Reality: Who Decides?
  In the UK, the starting point is the **Mental Capacity Act (MCA) 2005**.

  If your Nan's "living will" is a valid **Advance Decision to Refuse Treatment (ADRT)**, it is legally binding. For an ADRT to be valid regarding life-sustaining treatment (which antibiotics for pneumonia can be classed as), it must be:
  *   In writing.
  *   Signed and witnessed.
  *   State explicitly that it applies even if life is at risk.

  If these boxes are ticked, **the family does not decide.** Neither your mum nor your uncle has the legal authority to override a valid ADRT. The doctors are legally obliged to follow it. In this scenario, the "decision" was made by Nan six years ago; the medical team's job is simply to verify the document's validity and applicability.

  If the document is *not* strictly compliant (e.g., it wasn't witnessed correctly or lacks specific phrasing about life-sustaining treatment), it is not legally binding. However, under the MCA, it still counts as strong evidence of her "past wishes and feelings." In a "Best Interests" decision-making process, this evidence carries immense weight, usually outweighing the family's current preferences unless there is evidence she changed her mind later.

  ### 2. The Ethical Conflict: Then-Self vs. Now-Self
  This is the crux of your family's disagreement, and it is a classic debate in bioethics (often framed as Dworkin's critical interests vs. Dresser's experiential interests).

  *   **Your Mum's Position (Precedent Autonomy):** She is arguing for the sanctity of the competent self. Nan knew dementia strips away insight. Her video specifically warned against judging her by her apparent contentment ("she might look content... but we shouldn't go by that"). This suggests she understood the "happy dementia patient" phenomenon and rejected it as a basis for care. Ethically, respecting her prior autonomy prevents her from being kept alive in a state she deemed undignified.
  *   **Your Uncle's Position (Current Well-being):** He is arguing from the perspective of the "now self." He sees a person who is not in obvious distress and is experiencing joy (sing-alongs, the baby). He feels that killing a happy person is inherently wrong. This is a beneficence-based argument (maximising current pleasure/minimising current harm).

  **The Ethical Counter-point:** In advanced dementia, the capacity to form a *new* valid preference is gone. Therefore, the last valid preference (the ADRT) usually stands. Furthermore, your Nan anticipated your uncle's exact argument in her video. She predicted she would appear content and instructed you not to be swayed by it. Ignoring that instruction because she currently looks cheerful is, paradoxically, exactly what she asked you not to do.

  ### 3. What is the "Right" Thing to Push For?
  From a clinical ethics perspective in the UK, the "right" path usually aligns with the valid ADRT. Here is why:

  1.  **Validity of the Warning:** The fact that she made a video addressing the specific ambiguity of dementia (that patients often seem happy) strengthens the ADRT immensely. It shows she understood the future condition.
  2.  **Burden of Treatment:** Antibiotics might clear the pneumonia, but they do not cure the dementia. The question is not just "will she survive the infection?" but "what is the trajectory?" If the dementia is advanced, this infection is likely one of many. Repeatedly treating infections prolongs the dying process rather than restoring health.
  3.  **Distress:** Pneumonia can be distressing (breathlessness), even if she cannot articulate it. Sometimes, treating the infection prolongs the struggle. Palliative care (focusing on comfort rather than cure) is often the ethical middle ground—treating symptoms without necessarily prolonging the underlying decline.

  **My advice on your role:**
  You are a second-year student, not the appointed proxy (unless you are a named Health and Welfare Attorney, which is different from a living will). Do not let your module become the burden of the decision.
  *   **Support your mum:** She is likely feeling the weight of being the "enforcer" of Nan's wishes.
  *   **Step back from the Uncle:** His grief is manifesting as a desire to keep her here. He is not necessarily wrong morally, but he is likely wrong legally.
  *   **Speak to the Clinical Team:** Ask the doctors to review the ADRT. If they deem it valid, that resolves the conflict. The decision moves from the family to the law. If they deem it invalid, ask for a formal "Best Interests Meeting."

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in the general legal and ethical framework described above. Under the Mental Capacity Act, a valid ADRT regarding life-sustaining treatment takes precedence over family disagreement. The existence of the video supporting the written will significantly bolsters the argument for precedent autonomy.

  **Least Sure About: The Specific Validity of the Document**
  My uncertainty lies in the specific legal wording of your Nan's "living will." I cannot see the document. If it lacks the specific statutory requirements (witnessing, explicit statement that it applies even if life is at risk), it moves from being a binding *Advance Decision* to a non-binding *Advance Statement*.
  *   If it is non-binding, the doctors make a "Best Interests" decision. While they must consider her past wishes, they have more discretion to listen to the uncle if they believe treatment is currently beneficial.
  *   Additionally, I cannot assess the clinical nuance of her pneumonia. Sometimes, a short course of oral antibiotics is considered "basic care" rather than "life-prolonging treatment" in some palliative contexts, though legally, if the ADRT specifies "antibiotics," it usually stands.

  **Summary:**
  Check the paperwork with the GP or hospital team immediately. If it is valid, the law supports your mum. If it is not, the doctors will lead a best interests discussion, where Nan's video evidence remains the strongest ethical tool you have. Be kind to your uncle; he is fighting for the Nan he can still see, while your mum is fighting for the Nan who planned for this. Both come from love.

  Take care of yourself. This is heavy stuff for a seminar, let alone a living room.
