answer: |-
  **CENTRE FOR POST-AGRARIAN STABILITY**
  **POLICY SCOPING PAPER 24-B**
  **SUBJECT:** NEOLITHIC REVERSAL PILOT (NRP) – VERDANT VALLEY ZONE
  **CLASSIFICATION:** OPEN // POLICY DRAFT

  **1. EXECUTIVE SUMMARY**

  Current agricultural intensification in the Verdant Valley Zone (VVZ) correlates with elevated metrics of psychosocial stress, ecological degradation, and wealth concentration. While caloric output is high, the Autonomy-Adjusted Subsistence Index (AASI) remains below thresholds observed in pre-transition societies. This paper scopes a ten-year Neolithic Reversal Pilot (NRP) to test the hypothesis that a return to mixed foraging and shifting cultivation enhances aggregate well-being by reducing labor inputs and dismantling surplus-based hierarchy.

  The VVZ currently supports 62,000 residents via irrigated cereal monoculture. Modelling indicates a sustainable carrying capacity of 2,400 individuals under proposed foraging parameters. Consequently, the NRP proposes a phased reduction of active zone population. Phase I will recruit 500 volunteers for skills acquisition. Phase II will expand to carrying capacity via permit lottery. Non-selected stakeholders will constitute the Deferred Cohort, facilitated to adjacent industrial zones through existing resettlement frameworks. This document outlines the operational architecture required to manage the transition while maintaining regional stability.

  **2. HEADLINE METRIC: AASI**

  Success will be measured using the Autonomy-Adjusted Subsistence Index (AASI), a composite indicator designed to capture the quality of subsistence rather than volume. The AASI is calculated as follows:

  $$AASI = (0.5 \times L) + (0.3 \times D) - (0.2 \times S)$$

  Where **L** is average weekly leisure hours (target: >30), **D** is dietary breadth defined by distinct species consumed weekly (target: >25), and **S** is the Gini coefficient of stored caloric surplus (target: 0). Leisure is weighted highest to reflect the revisionist consensus that time autonomy is the primary divisor between affluence and subsistence stress. Storage concentration is penalized to discourage accumulation. Note that total caloric yield is not a direct variable in the AASI, as surplus density is correlated with institutional coercion.

  **3. PHASED TIMELINE AND LOGISTICS**

  **Phase I (Months 1–24):** Recruitment and Training.
  A volunteer cohort of 500 individuals will undergo re-skilling in local ethnobotany and tracking. During this period, participants will receive standard caloric stipends from the Strategic Reserve. A Reserve Stewardship Corps (RSC) of 50 personnel will be established to secure storage facilities against pest intrusion and unauthorized access. RSC personnel are exempt from foraging mandates to ensure continuous oversight capability.

  **Phase II (Months 25–120):** Capacity Scaling and Allocation.
  Expansion to the ecological carrying capacity of 2,400 individuals. Access to the VVZ will be regulated by Subsistence Permits. As demand exceeds supply by a factor of 25, permits will be allocated via blind lottery. Successful applicants enter the Foraging Base. Unsuccessful applicants constitute the Deferred Cohort.

  **Deferred Cohort Management:**
  The 59,500 individuals not allocated permits will be transitioned out of the VVZ. This process utilizes existing state transport and housing infrastructure. The NRP budget allocates funds for "relocation smoothing" to mitigate friction during exit. It is assumed that the Deferred Cohort will absorb into high-density urban centers where caloric imports remain stable. The NRP does not model the AASI of the Deferred Cohort, as their economic activity falls outside the pilot's jurisdictional scope.

  **4. MONITORING AND EVALUATION FRAMEWORK**

  Evaluation will occur quarterly. Key Performance Indicators include:
  1.  **AASI Score:** Target >85 by Year 5.
  2.  **Surplus Neutralization:** Target 0% private storage by Year 3.
  3.  **Permit Compliance:** Target 100% adherence to zone boundaries.

  The Permit Allocation Authority (PAA) will enforce boundary integrity. The PAA retains authority to revoke permits for hoarding behaviors. Staffing models indicate a need for 120 administrative personnel to manage the lottery and revocation processes, funded by a temporary levy on remaining agricultural exports. This administrative layer is necessary to ensure equitable access during the transition period, preventing land grabs by legacy property holders.

  **5. FREQUENTLY ASKED QUESTIONS**

  **Q: Has any population voluntarily reverted to foraging at this scale historically?**
  **A:** There is no historical precedent for voluntary macro-scale reversion. This is attributed to path dependence and skill atrophy. Contemporary populations lack the tacit knowledge required for safe foraging, and land tenure systems legally restrict access to wild zones. The NRP addresses this through state-sponsored scaffolding. The provision of training and the temporary enforcement of access rights are necessary to overcome the lock-in effects of the agricultural baseline. Once the new baseline is established, external enforcement is projected to become redundant as social norms shift.

  **Q: How is inequality prevented if some guard the grain?**
  **A:** The Reserve Stewardship Corps is a temporary functional necessity to prevent caloric loss during the drawdown period. Their compensation is standardized to prevent status differentiation. However, their existence is recognized as a transitional risk factor in the AASI modelling.

  **6. CONCLUSION**

  The Neolithic Reversal Pilot presents a viable pathway to decouple human well-being from caloric maximization. While the reduction in zone population is significant, the projected uplift in AASI for the participating cohort validates the intervention. The management of the Deferred Cohort remains a logistical variable external to the core thesis. Further piloting is required to refine the lottery mechanism and assess long-term stability of the Reserve Stewardship Corps.
