      *   **Jake Move 1:** "Wireheading is reward tampering via environment."
          *   *Verdict:* Partially Right/Weak. Wireheading is usually *direct* access to the reward channel. Building a button-pressing machine is more like "specification gaming" or "environmental manipulation." Wireheading implies bypassing the task entirely to hit the signal. Calling it "via environment" is a bit muddy.
