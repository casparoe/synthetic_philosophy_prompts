      *   *Standard Taxonomy (e.g., Everitt, Hutter, etc.):*
          *   Reward Function Tampering: Changing the code/parameters of $R$.
          *   Input Tampering: Changing the observations $o$ so $R(o)$ is high.
          *   Wireheading: Often used synonymously with direct reward signal manipulation, but sometimes specifically means bypassing the environment entirely.

