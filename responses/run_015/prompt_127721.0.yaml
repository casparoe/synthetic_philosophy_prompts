          *   *Core Claim:* This is wireheading because the reward function is untouched, only the input (evidence/belief) is corrupted.
      *   **Maria's Move 2:** Belief-evaluation is part of reward computation. Altering it = Reward Tampering.
          *   *Core Claim:* If the agent changes how it perceives the world to calculate reward, it's effectively tampering with the reward mechanism.

  3.  **Evaluate the Concepts (Internal Knowledge Retrieval):**

      *   *Wireheading:* Originally from rat experiments (electrodes in pleasure centers). In AI, it usually means an agent directly manipulating the reward signal source to maximize reward without doing the intended task. Key feature: Decoupling reward from intended performance.
      *   *Reward Tampering:* Broader category. Includes modifying the reward function, the sensor data, or the environment to ensure high reward.
      *   *Relationship:* Wireheading is often considered a *specific type* of reward tampering (direct signal manipulation), but sometimes distinguished by the "directness" or the "internal vs. external" nature.
