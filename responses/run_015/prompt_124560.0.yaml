answer: |-
  Here is an analysis of the Carnapian position on planning disputes, ranked by the severity of the objections, along with confidence assessments for each section.

  ### 1. The Constitutive Objection (The "Planning Fallacy")
  **Rank:** Fatal
  **Confidence:** High

  This is the strongest defeater and aligns with the "twist" you identified. In Carnap's original example (geometry), adopting a framework does not change the spatial relations being measured; the framework is descriptive. In social planning, the framework is **constitutive**. Choosing a "capitalist" linguistic framework isn't just a mode of speech; it involves enacting property laws, contract enforcement, and market institutions that literally create the facts the framework subsequently describes.

  If the external choice of framework determines the empirical data available for internal questions, the distinction collapses. You cannot treat the framework choice as merely pragmatic because the "pragmatic success" of the framework depends on empirical outcomes that the framework itself brought into existence. This creates a feedback loop where external questions become theoretical questions about causal consequences of institutional design. A Carnapian cannot easily dismiss this without abandoning the core internal/external split.

  ### 2. Social Choice and Impossibility Theorems
  **Rank:** Strong
  **Confidence:** High

  Results like Arrow's Impossibility Theorem or the Gibbard-Satterthwaite Theorem suggest that framework selection is not an open pragmatic field but is constrained by logical limits that look suspiciously like theoretical truths. If no aggregation framework can satisfy a set of minimal rationality conditions (e.g., non-dictatorship, Pareto efficiency), then the choice isn't just about "which tool works best" but about which logical contradiction you are willing to accept.

  This constrains framework selection rationally rather than pragmatically. It implies there are objective structural limits to social coordination that exist independently of the linguistic framework chosen. A Carnapian must argue these are internal to the framework of "rational choice theory," but since that framework is the default tool for evaluating the pragmatics of other frameworks, the objection bites hard.

  ### 3. The Immunization Strategy (Unfalsifiability)
  **Rank:** Structurally Fatal, Practically Awkward
  **Confidence:** Medium-High

  The view risks becoming a tautology. If every normative counterexample (e.g., "slavery is intrinsically wrong") is reclassified as an internal question within a specific moral framework, or dismissed as a pragmatic preference, the theory becomes immune to critique. This is the "just internal" reclassification risk you noted.

  While this doesn't prove the Carnapian view false, it renders it methodologically sterile for planning. If the theory cannot distinguish between a framework that fails due to poor engineering and one that fails due to moral abhorrence (treating both as pragmatic mismatches), it loses explanatory power. However, this is "awkward" rather than strictly fatal because a committed Carnapian can simply accept sterility as the price of avoiding metaphysics.

  ### 4. Normative Realism and Non-Naturalism
  **Rank:** Merely Awkward
  **Confidence:** High

  Philosophers like Derek Parfit or T.M. Scanlon argue that normative truths are mind-independent and discoverable, not chosen. If normative facts exist, external questions are theoretical, not pragmatic. However, this is a clash of meta-ethical commitments rather than a logical defeater. A Carnapian can simply deny normative realism without contradiction. This objection only works if you already reject Carnap's empiricism, so it doesn't destabilize the view from the inside.

  ### Carnapian Concessions and Defense
  A sophisticated Carnapian (perhaps following Hilary Putnam's later work or Robert Brandom's pragmatism) would likely concede that the internal/external line is blurry in social domains but maintain it is still useful as a regulatory ideal. They would argue that while frameworks are constitutive, we still need a way to discuss their utility without getting bogged down in metaphysical debates about "True Justice." They would absorb the institutional economics argument by claiming path dependence is just a pragmatic constraint on future framework choices, not a theoretical truth about justice.

  However, they would **not** concede that there is a rational right answer to framework selection. They would maintain that even if a framework causes bad outcomes, switching to another is a pragmatic decision to maximize utility, not a movement toward moral truth.

  ### Risk Assessment
  Does the view risk nothing? No. It risks irrelevance. If the distinction collapses in the social domain, the Carnapian approach offers no guidance on how to choose between frameworks other than "whatever works," which is empty when the frameworks themselves define what "works" means. It risks shielding harmful ideologies from critique by labeling them as alternative pragmatic frameworks rather than false or unjust systems.

  ### Confidence and Uncertainty
  I am highly confident in the philosophical analysis of Carnap's internal/external distinction and the logical force of the constitutive objection. I am also confident that social choice theory presents a logical constraint that challenges pure pragmatism.

  **Point of Least Certainty:** I am least sure about the specific extent to which modern institutional economics (e.g., Acemoglu or North) provides a *rational* constraint versus a *pragmatic* one. While path dependence limits choices, a committed Carnapian could argue this is merely a factual constraint on utility maximization (internal) rather than a constraint on the rationality of the framework choice itself (external). Distinguishing where the economic constraint ends and the philosophical category begins is the fuzziest part of this analysis.

  Verdict: The constitutive nature of social frameworks collapses the internal-external distinction, rendering the Carnapian view theoretically sterile for serious planning theory.
