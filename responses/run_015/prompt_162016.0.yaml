  6.  **Refining the Tone:**

      *   Needs to sound like a hydrologist wrote it (or for one). Precise, acknowledging error margins, no fluff.
      *   "Measurement error" language.
      *   Respectful of the volunteers' time and lack of philosophical training.

  7.  **Drafting the Content - Section by Section:**

      *   *Preamble:* Define the Currency.
      *   *The Procedure:* Numbered steps.
      *   *The Test Run:* Apply the steps rigorously.
      *   *Limitations:* Be honest about what this misses.

      *(Self-Correction during drafting)*: I initially thought about making the Literacy case fail. But the Deaf case has a specific procedural trap (Employer obligation/Statutory). It's more defensible to fail the Deaf applicant on procedural grounds (Statutory exclusion) than the Literacy group on utilitarian grounds, because the prompt asks to handle the "Statutory service" constraint. Actually, the prompt says "At least one... must come out against the applicant I would most like to help." Usually, the single tragic individual (Stairlift or Deaf) pulls the heartstrings more than the group. I will make the Deaf applicant fail based on the "Statutory/Employer" rule. It highlights the "In-kind/Statutory" constraint best.
