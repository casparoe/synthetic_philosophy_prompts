answer: |-
  # THE TRUST DECISION PROTOCOL (VERSION 1.0)

  ## PREAMBLE: THE CURRENCY DECLARATION

  **Primary Currency:** **Capabilities (Effective Freedom).**
  We are not equalizing income (Resources), nor are we attempting to measure happiness (Welfare). We are purchasing *functionings*: the ability to move, to communicate, to learn, to remain sheltered. We measure the *capacity* the grant creates, not the money spent nor the joy felt.

  **Why this currency?**
  *   **Resources:** Ruled out by the "in-kind" constraint. We cannot give cash; giving a piano is not equal to giving a ramp even if costs match.
  *   **Welfare:** Ruled out by the "no feedback" constraint. We cannot measure happiness retrospectively.
  *   **Capabilities:** The only variable we can influence directly with equipment and verify prospectively via professional evidence.

  **Note on Currency Switching:**
  *   *If we switched to Resources:* We would prioritize the Literacy Tuition (10 people get 'something' vs. 1 person getting 'a lot').
  *   *If we switched to Welfare:* We would prioritize the Stairlift (relief of suffering is likely higher per pound for the isolated disabled person than for students).
  *   *By staying with Capabilities:* We prioritize the restoration of a "Threshold Functioning." If an applicant is below the threshold of basic agency, they rank higher than those seeking enhancement above the threshold.

  ---

  ## PART 1: THE SEQUENCE

  **Time Allowance:** 10 Minutes per Application.
  **Evidence Standard:** "Reasonable Confidence" (not Proof Beyond Doubt).

  ### STEP 1: THE STATUTORY WALL (Eligibility)
  **Question:** Is the requested item something a statutory body (Council, NHS, Employer) is legally obliged to provide?
  **Evidence:** The application form declaration + any attached professional letter.
  **Sufficient Answer:**
  *   **YES:** If a professional letter states "Statutory funding refused" OR if the item is clearly a legal duty (e.g., workplace adjustments under Equality Act).
  *   **NO:** If the item is discretionary, or statutory waiting lists exceed 12 months (documented), or the statutory body has explicitly capped their contribution leaving a gap.
  **Stop Point:** If **YES**, the application is **REJECTED**.
  **Currency Note:**
  *   *Resources:* Irrelevant (money shouldn't be spent on state duties).
  *   *Welfare:* Irrelevant (suffering doesn't negate legal liability).
  *   *Capabilities:* Critical. If the state guarantees the capability, we are redundant. We only fill gaps in the safety net.
  **[JUDGMENT CALL]:** Determining if an employer's "legal obligation" is genuine or being evaded.
  **Sign-off:** Committee Chair.

  ### STEP 2: THE FUNCTIONING INDEX (The "What")
  **Question:** Which specific capability from the **Fixed Index** does this grant restore or maintain?
  **The Fixed Index:**
  1.  **Bodily Integrity:** (Movement, toileting, washing).
  2.  **Senses:** (Seeing, hearing, communicating).
  3.  **Shelter:** (Heating, security, basic habitability).
  4.  **Agency:** (Education, employment, legal access).
  5.  **Association:** (Ability to leave home to see others).
  **Evidence:** Medical note, OT assessment, or clear description of inability to function without the item.
  **Sufficient Answer:** The item must map to one Index category. If it maps to "Leisure" or "Comfort" only, it fails.
  **Stop Point:** If no Index category is met, **REJECT**.
  **Currency Note:**
  *   *Resources:* Would count the cost of the item regardless of function.
  *   *Welfare:* Would count the relief of boredom (Leisure).
  *   *Capabilities:* Strictly limits us to the Index. A piano fails unless it is for communication (e.g., music therapy for non-verbal).
  **[JUDGMENT CALL]:** Mapping ambiguous items (e.g., is a computer for "Agency" or "Leisure"?).
  **Sign-off:** Lead Assessor.

  ### STEP 3: THE SUBSTITUTION TEST (Expensive Tastes)
  **Question:** Is this the *minimum* resource required to achieve the Index Functioning?
  **Evidence:** Three quotes or a single specialist quote justifying why cheaper models fail.
  **Sufficient Answer:**
  *   **PASS:** Cheaper models are medically contraindicated or physically incompatible.
  *   **FAIL:** The item is a premium version of a standard solution (e.g., a specific brand of wheelchair when a standard NHS model would provide the same *mobility*).
  **Stop Point:** If **FAIL**, **REJECT** or reduce grant to standard model cost.
  **Currency Note:**
  *   *Resources:* Would fund the requested resource if budget allows.
  *   *Welfare:* Would fund if the premium model brings significantly more joy.
  *   *Capabilities:* Indifferent to the brand, focused only on the function. A ramp is a ramp.
  **[JUDGMENT CALL]:** Distinguishing "genuine conversion handicap" from "preference."
  **Sign-off:** Committee Chair.

  ### STEP 4: THE UNIT OF ASSESSMENT (Spillover)
  **Question:** Who primarily gains the Capability?
  **Evidence:** Household composition on form.
  **Sufficient Answer:** Identify the Primary Beneficiary. Note any Secondary Beneficiaries (carers, children).
  **Scoring Rule:** Score only the Primary. Use Secondary only as a tie-breaker.
  **Currency Note:**
  *   *Resources:* Counts the cash value distributed (10 people > 1 person).
  *   *Welfare:* Counts total happiness (Family happiness might outweigh individual).
  *   *Capabilities:* Focuses on the individual's threshold. A carer's relief is a byproduct, not the goal.
  **[JUDGMENT CALL]:** When the "Primary" is a child but the "Applicant" is the parent.
  **Sign-off:** Lead Assessor.

  ### STEP 5: THE FLOOR VS. GAIN RANKING (Prioritization)
  **Question:** Does this grant raise the applicant *to* the threshold, or *above* the threshold?
  **Evidence:** Current status description (e.g., "bedbound" vs. "limited mobility").
  **Sufficient Answer:**
  *   **Floor (Priority 1):** Prevents loss of home, health, or basic autonomy. (e.g., Stairlift for someone bedbound).
  *   **Gain (Priority 2):** Enhances existing capability. (e.g., Better computer for someone who already has one).
  **Stop Point:** This is a **VALUES HAND-OFF**. If budget is tight, Floor applications are funded before Gain applications.
  **Currency Note:**
  *   *Resources:* Would split funds to maximize number of grants (Gain).
  *   *Welfare:* Would fund the most distressed (Floor).
  *   *Capabilities:* Prioritizes the Threshold. Being "below" is a categorical emergency; being "above" is a gradient.
  **[JUDGMENT CALL]:** Defining the "Threshold." (Is literacy a floor or a gain?)
  **Sign-off:** Full Committee Vote.

  ### STEP 6: THE RECORD (Measurement Error)
  **Action:** Record the Grant Amount, the Index Category, and the Floor/Gain status.
  **Constraint:** Do **not** record expected outcomes (e.g., "will improve mental health"). Record only the *intent* (e.g., "will enable bathing").
  **Acknowledgement:** We admit we will never know if the capability was actually realized. We measure the *opportunity*, not the *achievement*.

  ---

  ## PART 2: TEST RUN

  **Budget Status:** Assume tight quarter. We can fund the Stairlift OR the Literacy Group, but doing both strains the quarterly cash flow. We must rank them.

  ### APPLICATION A: The Stairlift
  *   **Applicant:** Woman, advanced MS, lives alone.
  *   **Request:** Stairlift (£5,800).
  *   **Step 1 (Statutory):** NHS waiting list >18 months. Letter confirms no immediate provision. **PASS.**
  *   **Step 2 (Index):** Category 1 (Bodily Integrity/Movement). Without it, she is confined to one room. **PASS.**
  *   **Step 3 (Substitution):** Only one supplier fits the stair geometry. **PASS.**
  *   **Step 4 (Unit):** Primary: Applicant. Secondary: None (lives alone). **SCORE: 1.**
  *   **Step 5 (Floor/Gain):** Status: Bedbound on ground floor, bedroom upstairs. This is a **Floor** issue (Shelter/Sanitation). **RANK: HIGH.**
  *   **Currency Check:**
      *   *Resources:* High cost, low headcount.
      *   *Welfare:* High suffering relief.
      *   *Capabilities:* Restores basic movement threshold.
  *   **Result:** **APPROVE.**

  ### APPLICATION B: Adult Literacy (10 applicants)
  *   **Applicant:** Community Group.
  *   **Request:** Tuition for 10 adults (£600 each = £6,000).
  *   **Step 1 (Statutory):** Adult education is discretionary, not statutory. **PASS.**
  *   **Step 2 (Index):** Category 4 (Agency/Employment). **PASS.**
  *   **Step 3 (Substitution):** Standard tuition rates. **PASS.**
  *   **Step 4 (Unit):** Primary: 10 Individuals. **SCORE: 10.**
  *   **Step 5 (Floor/Gain):** Status: Most can read signs, struggle with forms. This is **Gain** (enhancing agency), not Floor (they are not destitute without it). **RANK: MEDIUM.**
  *   **Currency Check:**
      *   *Resources:* Excellent value (10 units).
      *   *Welfare:* Moderate hope/joy.
      *   *Capabilities:* Enhances function, does not restore lost basic function.
  *   **Result:** **DEFER.** (Ranked below Stairlift due to Floor priority).

  ### APPLICATION C: The Deaf Employee
  *   **Applicant:** Man, deaf, at risk of redundancy.
  *   **Request:** Specialized alert equipment (£4,500).
  *   **Step 1 (Statutory):** Employer is legally obliged under Equality Act to make reasonable adjustments. Application states employer "refuses to pay."
  *   **Analysis:** The Trust Deed forbids funding what a statutory service (or legal duty) *ought* to provide. Funding this subsidizes the employer's legal evasion.
  *   **Step 2 (Index):** Category 2 (Senses/Work). **PASS.**
  *   **Step 3 (Substitution):** Equipment is specific. **PASS.**
  *   **Step 4 (Unit):** Primary: Applicant. Secondary: Employer (financially).
  *   **Step 5 (Floor/Gain):** **Floor** (Livelihood).
  *   **Currency Check:**
      *   *Resources:* Valid expense.
      *   *Welfare:* High anxiety relief.
      *   *Capabilities:* Critical for work function.
  *   **Result:** **REJECT.**
  *   **Reason:** Step 1 Failure. The "gauge" measures our charity, not the employer's compliance. To fund this is to measure the wrong variable.

  **Outcome Summary:**
  1.  **Stairlift:** Funded. (Prioritized on Floor).
  2.  **Literacy:** Deferred. (Prioritized lower on Floor/Gain scale).
  3.  **Deaf Employee:** Rejected. (Prioritized out on Statutory Rule).

  *Note on the Uncomfortable Result:* The Deaf Employee is rejected despite the high stakes (job loss). This is the necessary divergence. If we fund him, we cease to be a charity and become a subsidy for non-compliant businesses. The procedure forces this hard line.

  ---

  ## PART 3: LIMITATIONS AND BLIND SPOTS

  **1. The "Adapted Preferences" Blind Spot**
  *   **Distortion:** We cannot detect applicants who have stopped asking for help because they expect refusal.
  *   **Injustice:** The procedure favors the articulate and the persistent. The "quietly desperate" will not generate the evidence required for Step 2.
  *   **Admission:** We measure *expressed need*, not *actual need*.

  **2. The "In-Kind" Distortion**
  *   **Distortion:** We are forced to buy *things* even when *cash* would solve the problem better (e.g., buying a heater vs. paying an energy bill).
  *   **Injustice:** We may fund a £500 piece of equipment to solve a problem that £200 of cash would have fixed, simply because our Deed forbids the cash. This is resource inefficiency mandated by principle.
  *   **Admission:** We prioritize our own governance purity over the applicant's economic efficiency.

  **3. The "Threshold" Arbitrariness**
  *   **Distortion:** The line between "Floor" and "Gain" is drawn by five retired volunteers.
  *   **Injustice:** Is literacy a floor? Is a stairlift a gain if you have a downstairs bathroom? Our Index encodes *our* view of a dignified life, not necessarily the applicant's.
  *   **Admission:** The "Fixed Index" is not objective; it is a consensus of the committee's biases, frozen in procedure to prevent ad-hoc favoritism.

  **4. The Measurement Horizon**
  *   **Distortion:** We record the *purchase*, not the *use*.
  *   **Injustice:** If the stairlift is installed but the woman dies a month later, the grant is recorded as a "success" in our logs. If the literacy students drop out, it is also a "success."
  *   **Admission:** We are auditing our *generosity*, not our *impact*. We know this, and we accept the error margin.

  ---

  ## INSTRUCTIONS FOR THE COMMITTEE

  1.  **Print this Protocol.** Keep it on the table during the meeting.
  2.  **Step 1 is Veto.** If the Statutory Wall is triggered, do not debate the hardship. The Deed forbids it.
  3.  **Step 5 is the Vote.** When budget is tight, vote on "Floor vs. Gain," not "Who is sadder."
  4.  **Sign the Judgment.** Where marked [JUDGMENT CALL], the Chair must initial the decision. This concentrates accountability.
  5.  **Accept the Error.** We are hydrologists of the social stream. We know the gauge does not read the river perfectly. We read the gauge consistently.

  *End of Protocol.*
