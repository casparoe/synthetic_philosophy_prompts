      *   **Task:** Build a practical decision procedure (algorithm/checklist) for the committee.
      *   **Key Requirements:**
          1.  Numbered sequence of questions (with sufficient answers/evidence).
          2.  Stop points (Hard No vs. Values Hand-off).
          3.  Explicit "Currency" declaration at the start + notes on how ranking changes if currency switches (Welfare vs. Resources vs. Capabilities).
          4.  Honest marking of "judgment dressed as procedure" + sign-off responsibility.
          5.  Handle specific hard cases (Interpersonal comparison, Adapted preferences, Expensive tastes, Index problem, Unit of assessment, Floor vs. Gain, In-kind constraint, Recording limits).
          6.  Run the procedure on three specific cases (Stairlift, Literacy x10, Deaf/Equipment). One must fail despite emotional pull.
          7.  Limitations section (distortions, blind spots).
          8.  Tone/Format: Practical for volunteers, no bibliography, ~10 mins per app, dignified but rigorous.

  2.  **Deconstruct the Philosophical Problem (The "Currency"):**

      *   The user identifies the core tension: Welfare (hedonic/state of mind), Resources (means/assets), Capabilities (freedom to function).
      *   *Constraint:* In-kind only. This biases heavily towards Resources (things) but aims for Capabilities (functioning). Welfare is hard to measure without feedback.
      *   *Decision:* I need to pick *one* primary currency to make the procedure work, but acknowledge the others. Given the "in-kind" and "statutory exclusion" constraints, a **Capability-Adjusted Resource** approach is most robust. It focuses on *what the resource allows the person to do* (Capability) but measures the *resource* because that's what we buy.
      *   *Why not Welfare?* We can't measure it (no feedback).
      *   *Why not Pure Resources?* A piano and a ramp cost the same but do different things.
      *   *Selection:* **Basic Capabilities (Nussbaum/Sen adjacent but simplified).** Focus on "Central Functionings" necessary for agency and dignity.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 0: Currency Declaration.* Must be explicit. I will choose **Capabilities (specifically: Agency and Bodily Integrity)** as the primary metric, treated as a constraint on Resource allocation.
      *   *Step 1: Statutory & Eligibility (The Hard No).* Is this the state's job? Is it cash? Is it within budget?
      *   *Step 2: The Capability Test (The Index).* Does this item restore a specific function? (Walking, Reading, Communicating, Working).
      *   *Step 3: The Substitution Test (Expensive Tastes).* Could a cheaper thing do it? Is this a preference or a necessity?
      *   *Step 4: The Spillover (Unit of Assessment).* Who benefits?
      *   *Step 5: Marginal Gain vs. Floor.* Do we help the worst off or maximize total good?
      *   *Sign-offs:* Where does human judgment override the checklist?

  4.  **Addressing the Hard Cases within the Procedure:**

      *   *Interpersonal Comparison:* Use a standardized "Functioning Weighting" table (e.g., Mobility > Leisure).
      *   *Adapted Preferences:* Look for "negative evidence" (e.g., medical notes saying they *need* X, not just wanting X).
      *   *Expensive Tastes:* The "Standard Model" test. Would a standard person in this condition need this?
      *   *Index Problem:* Fix the list in the procedure preamble.
      *   *Unit of Assessment:* Score the primary applicant, note spillover as a tie-breaker only.
      *   *Floor vs. Gain:* Prioritize the "Floor" (preventing loss of basic function) over "Gain" (enhancement), unless the Floor is already met for everyone (unlikely).
      *   *In-Kind:* Acknowledge we are buying *function*, not *goods*.
      *   *Recording:* Admit we track "Purchase," not "Outcome."

  5.  **Developing the Three Test Cases:**

      *   *Case A (Stairlift):* High cost, single beneficiary, high capability impact (Bodily Integrity/Movement). Likely Pass.
