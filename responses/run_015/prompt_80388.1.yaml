answer: |-
  You have hit on exactly the intuition that most people have when they first encounter this problem. In fact, your reaction is so common that it has a name in the literature: the **"zero probability" response** to Pascal's Mugging.

  However, decision theorists and philosophers who raise the "fanaticism" objection would argue that you are applying **practical heuristics** to a **formal problem**. The objection isn't that people *should* fall for scams; it's that the mathematical structure of Expected Value (EV) maximization, when combined with standard Bayesian epistemology, breaks down in specific ways that can't be solved just by "being smarter about probabilities."

  Here is why the "fanaticism" objection is considered substantive rather than just a probability assignment error.

  ### 1. The Ban on Probability Zero (Cromwell's Rule)
  Your argument rests on the claim: *"If the stranger is a con artist, the probability... is just zero."*

  In strict Bayesian decision theory, you are generally forbidden from assigning a probability of exactly 0 (or 1) to any empirical claim. This is often called **Cromwell's Rule** (named after Oliver Cromwell's plea: "I beseech you, in the bowels of Christ, think it possible that you may be mistaken").

  The reason is **updating**. If you assign a hypothesis probability 0, no amount of evidence can ever change your mind. Even if the stranger snapped their fingers and turned the moon into blue cheese, a prior of 0 means your posterior must remain 0 (by Bayes' Rule). To remain a rational learner who can update on *any* possible evidence, you must keep your priors non-zero for any logically possible state of the world.

  Therefore, within the formal system, you are not *allowed* to say the probability is zero. You must assign some $\epsilon > 0$. The fanaticism objection asks: **What happens when the utility is large enough to outweigh that $\epsilon$?**

  ### 2. The Scaling Problem (It's not about $10^{-9}$)
  Your example uses specific numbers: $20 cost, $10^{-9}$ probability, 1 million lives saved. In this specific case, you are right; the EV is probably negative or negligible.

  But the "fanaticism" problem arises because there is no limit to how large the utility claim can be. This is the core of **Pascal's Mugging**.

  Imagine the stranger says:
  > "Give me $20. If you don't, I will use my magic powers from outside the Matrix to simulate and torture $3 \uparrow\uparrow\uparrow 3$ people (a number so large it cannot be written in the observable universe)."

  Even if you assign this a probability of $10^{-100}$, the disutility of $3 \uparrow\uparrow\uparrow 3$ deaths is so astronomically large that the Expected Disutility dominates the $20 cost.

  The objection is that for **any** non-zero probability function you choose, there exists **some** magnitude of utility that will overwhelm it. If EV maximization is the true norm, you are rationally required to hand over your wallet to anyone who threatens you with a sufficiently large number, no matter how absurd the claim.

  ### 3. The "Impossible" vs. "Improbable" Distinction
  You suggest that assigning non-zero probability to impossible things is an error. But in many "fanaticism" cases (like existential risk or longtermism), the scenarios are not logically impossible.

  Consider **existential risk mitigation**.
  *   **Scenario A:** Spend $1 billion to definitely save 1,000 lives now.
  *   **Scenario B:** Spend $1 billion to reduce the risk of human extinction by 0.0000001%.

  If humanity survives, there could be $10^{50}$ future lives. A 0.0000001% reduction in extinction risk might have an EV of $10^{40}$ lives saved.
  Scenario B has a tiny probability of making a difference, but the payoff is so huge that EV maximization demands you ignore the 1,000 certain lives to work on the tiny probability extinction event.

  Is this "fanaticism"?
  *   **Critics say:** Yes. It justifies ignoring real, certain suffering for speculative, astronomical payoffs.
  *   **Proponents say:** No, it's just math. The future is huge.

  The objection is substantive because it forces a clash between **common moral intuitions** (help the people in front of you) and **formal rationality** (maximize the abstract number). If you say "assign probability 0 to affecting the far future," you are making a dogmatic epistemic claim that many rationalists find unjustified.

  ### 4. Bounded Utility as a Solution (and its cost)
  The standard way to solve fanaticism within decision theory is to posit **Bounded Utility**. You say, "There is a maximum amount of value possible, say 1,000,000 utils." Once you hit that cap, more lives don't add more value.

  If utility is bounded, then no matter how many lives the mugger threatens, the EV cannot exceed the bound. The $20 cost will eventually outweigh the benefit.

  **However**, this creates a new problem called **"Reverse Fanaticism"** or **"Sadistic Conclusion."**
  If utility is bounded, then for any amount of suffering, there is a probability low enough that you should ignore it. This implies that if there is a sufficiently small probability of an *infinite* hell, you should ignore it. More practically, it implies that preventing a 100% chance of 1 million deaths is not necessarily better than preventing a 0.0001% chance of "maximum possible badness."

  So, you are stuck with a trilemma. You must give up one of the following:
  1.  **Unbounded Utility:** (Accept that there is no limit to how good/bad things can get).
  2.  **Dominance/Continuity:** (Standard axioms of decision theory).
  3.  **Avoidance of Fanaticism:** (The intuition that you shouldn't pay the mugger).

  ### 5. Why it matters for the Rationalist Community
  The reason this thread persists on rationalist blogs is that it isn't just about muggers; it's about **Effective Altruism and Longtermism**.

  If EV maximization leads to fanaticism, then the rationalist prescription to "maximize expected good" might compel you to ignore all current suffering to focus exclusively on highly speculative, high-payoff interventions (like simulation shutdown or AI alignment speculation) while ignoring malaria nets.

  If you dismiss fanaticism as "just a probability error," you are essentially arguing for a **heuristic override** of EV maximization. You are saying, "Calculate EV, but if the probability is too low, ignore the calculation."

  But if you do that, you are no longer an Expected Value Maximizer. You are an **Expected Value Maximizer with a Complexity Penalty** or a **Threshold Deontologist**. The philosophical work is figuring out what that alternative framework is, because "don't be gullible" is not a formal decision theory.

  ### Summary
  You aren't missing the math; you are applying **informal epistemic hygiene** (don't believe crazy claims) to a **formal decision problem**.

  The "fanaticism" objection is substantive because:
  1.  **Formal Bayesianism forbids probability 0** on empirical claims (to allow updating).
  2.  **Utility can scale faster than probability shrinks**, meaning *any* non-zero prior leads to fanaticism eventually.
  3.  **Solving it requires changing the axioms** of decision theory (e.g., bounded utility), which creates other paradoxes.

  The objection highlights that Expected Value Maximization, as formally defined, is incomplete or counter-intuitive when dealing with extreme tail risks. It forces theorists to choose between accepting absurd conclusions or modifying the fundamental axioms of rationality.

  So, it is not a confusion about which probabilities you are allowed to assign; it is a proof that **standard EV maximization + standard Bayesian priors = absurd action** in the limit.
