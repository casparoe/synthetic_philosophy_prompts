answer: |-
  **TERMS AND CONDITIONS OF ENROLMENT – THE EMPTY CENTRE**

  **1. Definition of Parties**
  1.1. By submitting a booking form, the applicant acknowledges that 'The Guest' is a convenient administrative fiction required for transactional purposes only.
  1.2. Legally binding obligations attach not to a permanent self, as no such entity exists, but to the Five Aggregates (*skandhas*): form, feeling, perception, mental formations, and consciousness.
  1.3. The 'Booking Entity' (the aggregate constellation present at payment) and the 'Retreating Entity' (the aggregate constellation present at arrival) are deemed causally connected but numerically distinct.

  **2. Financial Obligations and Deposits**
  2.1. Deposits are non-refundable should the Booking Entity dissolve prior to arrival due to impermanence (*anicca*).
  2.2. Refunds may be granted only if the causal continuum of consciousness is demonstrably interrupted by forces *vis major*, such as sudden enlightenment or death.
  2.3. In the event of cancellation, funds shall be retained to compensate the Centre for the administrative labour of pretending the Guest exists.

  **3. Liability and Harmful Actions**
  3.1. The Centre accepts no liability for injuries sustained by aggregates during silent sitting, as pain is merely a feeling aggregate arising and passing without a sufferer.
  3.2. Should one aggregate-combination harm another (e.g., striking a fellow retreater), liability is assessed strictly on causality, not moral agency.
  3.3. The offending aggregates may be asked to leave the premises. However, as there is no one to be expelled, enforcement relies on the discontinuation of shelter and food supplies to that specific causal stream.

  **4. Continuity of Practice and Inheritance**
  4.1. Meditation progress is non-transferable. There is no self to accumulate merit, nor any vessel to carry it home.
  4.2. Upon departure, any realised insights remain the property of the transient mental formations in which they arose.
  4.3. Guests seeking to inherit progress from previous retreats must prove identity continuity beyond mere memory, a standard The Empty Centre considers metaphysically impossible and administratively burdensome.

  **5. Complaints Resolution**
  5.1. Complaints must be submitted in writing by the aggrieved aggregates.
  5.2. Processing times may vary depending on whether the complaining aggregates still exist at the time of adjudication.
  5.3. Regarding the waiver of rights to sue, the Head of Non-Identity Relations, Mr. Sunyata Void, states:
  > "To litigate is to presume a plaintiff. Since the plaintiff is merely a label applied to a flowing river of processes, a lawsuit is essentially a river suing a rock. We discourage this. If the aggregates feel wronged, they are encouraged to observe the sensation of injustice until it dissolves. If it does not dissolve, the aggregates are welcome to leave, taking their grievance with them into the next moment of existence."

  **6. Governing Law**
  6.1. These terms are governed by the Doctrine of Emptiness (*Śūnyatā*).
  6.2. In any dispute, the burden of proof lies with the party claiming inherent existence.
  6.3. The Centre reserves the right to amend these terms without notice, as the Centre itself is devoid of intrinsic nature and subject to change based on causes and conditions.

  **7. Acceptance**
  7.1. Clicking 'I Agree' constitutes a conventional acknowledgement of these ultimate truths.
  7.2. The clicker acknowledges that neither the clicker, the click, nor the agreement possesses independent reality.

  **The Empty Centre Ltd.**
  *Registered in England and Wales. No Number (because there is no company).*
