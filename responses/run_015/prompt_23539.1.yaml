answer: |-
  **MEMORANDUM**

  **TO:** The Presbytery / General Assembly
  **FROM:** Doctrinal Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion and Recommendation Regarding Complaint [Case Number 2023-DR-04]
  **RE:** Teaching on Divine Sovereignty and Middle Knowledge

  ### I. Introduction and Charge

  The Doctrinal Review Committee has reviewed the complaint lodged against Pastor [Name] regarding statements made in his sermon series entitled [Series Title]. The specific teaching under review is the assertion that "God's decree is conditioned on middle knowledge — God saw what free people would do and then arranged the circumstances."

  The Complainant contends that this formulation denies the sovereignty of the divine decree, effectively making God's will dependent upon creaturely actions, thereby violating our Confessional Standard regarding Providence and Predestination. The Respondent (Pastor [Name]) contends that he is articulating a recognized theological model (Molinism) that preserves divine sovereignty through God's free choice of which possible world to actualize.

  The Committee's charge is not to settle the metaphysical debate between Molinism and Augustinian/Reformed causality definitively, but to determine whether the Respondent's specific teaching is in good faith and compatible with the ordination vows and Confessional Standards of this denomination.

  ### II. Theological Analysis

  To render a judgment, the Committee has engaged the Molinist position on its own terms, specifically regarding the coherence of Counterfactuals of Creaturely Freedom (CCFs) and the relationship between Middle Knowledge and the Divine Decree.

  **A. The Nature of Middle Knowledge and CCFs**
  Molinism posits a logical ordering in God's knowledge: (1) Natural Knowledge (necessary truths), (2) Middle Knowledge (contingent truths regarding what free agents *would* do in any circumstance), and (3) Free Knowledge (what God decrees *will* happen). The Respondent's teaching relies on the truth value of CCFs prior to the Divine Decree.

  The Committee notes the "Grounding Objection" raised by the Complainant: If a free agent never actually performs an action in a specific circumstance, what ontological ground makes the statement "they *would* do X" true prior to God's decree? If these truths exist independent of God's will, they function as brute facts external to God, potentially compromising Divine Aseity and Sovereignty.

  **B. The "Conditioning" of the Decree**
  The crux of the complaint lies in the phrase "conditioned on."
  *   **The Respondent's Defense:** The standard Molinist reply is that the decree is not *causally* conditioned by creatures, but *logically* posterior to God's survey of CCFs. God freely chooses which set of circumstances to actualize, knowing exactly what free choices will result. Thus, sovereignty is maintained because God selects the world.
  *   **The Complainant's Objection:** If the truth of the CCFs is not determined by God, then God's choice of worlds is constrained by data He did not author. This renders the decree conditional in a way that conflicts with our Standard, which affirms God ordains whatsoever comes to pass without being dependent on the foreseen faith or works of the creature.

  **C. Evaluation of Compatibility**
  The Committee acknowledges the strongest case for the Respondent: Molinism is a sophisticated attempt to reconcile genuine libertarian freedom with comprehensive divine providence. Many orthodox theologians have utilized aspects of this framework without intending to deny God's ultimate authority. The distinction between *logical priority* and *temporal priority* is valid; the Respondent may not intend to suggest God learns from creatures or is reactive in time.

  However, the Committee also affirms the strongest case for the Complainant: Our Confessional Standard explicitly teaches that the decree is unconditional. To state that the decree is "conditioned on" what creatures would do, even logically, risks implying that the creature's potential will is the ultimate determinant of which decree is issued. If the CCFs are true independent of God's will, they act as a boundary on God's sovereignty that Scripture does not affirm. While Molinism attempts to safeguard sovereignty via the "selection of the world," the phrasing used by the Respondent suggests the *content* of the decree is derived from the creature, rather than the creature's actions being ordained by the decree.

  ### III. Finding and Ruling

  The Committee finds that while the Respondent likely holds to a high view of God's omniscience, the specific phrasing employed ("God's decree is conditioned on middle knowledge") is imprecise to the point of error within our confessional framework. It creates a perception that the Divine Decree is reactive or dependent upon a variable outside of God's own will.

  Therefore, the Committee recommends the following ruling:

  **RULING: SUSTAIN WITH REQUIRED CORRECTIVE STATEMENT**

  The complaint is sustained not on the grounds that the Pastor is heretical, but on the grounds that his pedagogical formulation creates unnecessary confusion and risks undermining the congregational understanding of the unconditional nature of God's decree as defined by our Standard.

  ### IV. Directives and Time Frame

  1.  **Corrective Statement:** Pastor [Name] is directed to issue a clarification to his congregation (either via a follow-up sermon or written addendum) within **30 days** of this ruling. This clarification must affirm that while God possesses exhaustive knowledge of all possibilities, His Decree is not dependent upon the creature, but rather establishes the circumstances in which the creature acts.
  2.  **Suggested Language:** The Committee suggests the Pastor clarify that God's knowledge of what creatures *would* do is not a constraint on His will, but a function of His omniscience, and that the actualization of any circumstance remains solely within His sovereign good pleasure.
  3.  **Future Teaching:** In future instructional settings, the Pastor is advised to distinguish carefully between *logical order* in God's knowledge and *causal dependency* in God's decree. He should avoid language that implies the Decree is "conditioned" by human action, even hypothetically.
  4.  **Review:** The Committee will review the corrective statement upon submission. If the clarification aligns with the Confessional Standard, the matter will be considered closed.

  ### V. Conclusion

  The Committee recognizes that the mechanics of providence are a deep mystery. We do not seek to police every theological nuance, but we are charged with guarding the integrity of the Standard. The doctrine of God's sovereignty is a pastoral comfort to the flock; teaching that implies God's plans are conditioned by human behavior can undermine that comfort. We urge the Respondent to accept this correction in the spirit of unity and precision, and we urge the Complainant to recognize that the Respondent's intent was to uphold God's knowledge, not to diminish His rule.

  Respectfully Submitted,

  The Doctrinal Review Committee
  [Signatures]
