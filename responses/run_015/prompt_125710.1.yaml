answer: |-
  You have hit on one of the most frustrating and pervasive issues in metaphysics and ethics. You are absolutely right: people (including professional philosophers) often oscillate between **Spatiotemporal Continuity** (the unbroken line) and **Constitutive Essentialism** (the important stuff stays the same) depending on which one gives them the answer they want.

  There isn't one single "Greek" term that captures *exactly* this specific switcheroo in identity theory, but there are several established concepts that describe this move.

  Here is the breakdown of what this pattern is, what it's called, and how to tell the difference between a "principled system" and an "escape hatch."

  ### 1. The Logical Fallacy: *Ad Hoc* Rescue
  The most precise logical term for what you are describing is an **Ad Hoc Rescue** (or *Ad Hoc* Hypothesis).

  This happens when a person holds a conclusion (e.g., "The Teleporter kills you") and when a principle contradicts it (e.g., "But the pattern is identical!"), they invent a new rule or switch to a different principle solely to protect the conclusion.
  *   **In the Ship case:** They use Continuity to protect the "It's the same ship" intuition.
  *   **In the Teleporter case:** They switch to Constitution (original matter matters) to protect the "It's death" intuition.

  If they cannot explain *why* Continuity matters for ships but Constitution matters for people other than "because it feels right," it is an *Ad Hoc* Rescue.

  ### 2. Is it Equivocation?
  You asked if this is just **equivocation**. The answer is **yes, but specifically on the concept of "Identity."**

  Classical equivocation is using a word like "bank" (river vs. money) in two ways. In this case, people are using "Same" in two ways without admitting it.
  *   **Sense A:** "Same" = Continuous existence in space-time.
  *   **Sense B:** "Same" = Qualitative similarity of essential parts.

  When they switch criteria mid-argument, they are equivocal on the definition of identity. However, philosophers often try to dress this up as **"Polysemy"** (a word having multiple related meanings). They will argue that "identity" is a **Cluster Concept**.

  ### 3. The "Cluster Concept" Defense (The Principled Version)
  This is the hardest part to navigate. Some philosophers (like Wittgenstein or later cognitive scientists) argue that concepts like "Identity," "Life," or "Consciousness" *don't have a single definition.* They are clusters of criteria.

  A **principled thinker** admits this. They will say:
  > "Look, 'identity' isn't one thing. It's a bundle of criteria (continuity, memory, matter, function). Sometimes criteria conflict. When they do, we have to weigh them based on context."

  **The Difference:**
  *   **The Principled Thinker:** Admits the tension. They try to build a **Meta-Rule**. (e.g., "For artifacts, we value Continuity. For persons, we value Psychology.") They apply this Meta-Rule consistently across *all* cases.
  *   **The Escape-Hatch Thinker:** Has no Meta-Rule. They simply pick the criterion that matches their gut feeling for that specific case. If you present a case where their Meta-Rule would give an answer they hate, they will abandon the Meta-Rule instantly.

  ### 4. How to Test Them: "Reflective Equilibrium"
  The philosophical method for distinguishing a principled system from a rhetorical trick is called **Reflective Equilibrium** (coined by John Rawls).

  To see if someone is being principled, you ask them to run their criteria through a "stress test."
  1.  **Ask for the Rule:** "So, is your rule that Continuity determines identity?"
  2.  **Apply to Opposite Case:** "If Continuity is the rule, then if I slowly replace my friend's brain with a computer chip over 10 years, they are still my friend, right?"
  3.  **Watch the Switch:** If they say "No, that's different because the *biology* matters," they have just switched to Constitution.
  4.  **Call the Bluff:** "So is it Continuity or Biology? You can't have both if they contradict."

  If they cannot articulate a **higher-order principle** that explains *when* to use Continuity and *when* to use Constitution, they are engaging in **Motivated Reasoning**. They have decided the verdict first ("Teleportation is death," "Ship repair is safe") and are shopping for laws to convict or acquit.

  ### 5. The "Nuclear Option" in Philosophy
  You should know that the philosopher **Derek Parfit** basically agreed with you in his book *Reasons and Persons* (1984).

  He looked at this exact pattern—the fact that we switch between Physical Continuity and Psychological Continuity depending on what feels scary—and he concluded: **Identity doesn't matter.**

  He argued that "Personal Identity" is not a deep fact. It's just a description of relations (connectedness of memory, body, etc.). He suggested that because our criteria are fuzzy and shift, we should stop asking "Is it *me*?" and start asking "Is there a survivor with my memories and traits?"

  ### Summary
  *   **The Pattern:** Criterion Shifting / Inconsistent Application.
  *   **The Fallacy:** *Ad Hoc* Rescue / Motivated Reasoning.
  *   **The Linguistic Trick:** Equivocation on the word "Same."
  *   **The Principled Alternative:** A system that uses **Reflective Equilibrium** to establish a Meta-Rule for when to apply which criteria.
  *   **The Red Flag:** If they can't tell you *in advance* which rule applies to a new scenario without hearing the outcome first, they are using the rules as escape hatches.

  You aren't imagining it. It is the central tension of metaphysics, and most people resolve it by cheating.
