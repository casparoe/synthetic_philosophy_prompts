answer: |-
  # The Epistemic Triage Protocol (ETP)

  **Version:** 1.0
  **Audience:** Volunteer Moderator Team
  **Constraint:** Public Post Evidence Only
  **Purpose:** To determine whether a subforum topic requires intervention due to epistemic failure, and if so, which kind.

  ## Part 1: The Diagnostic Procedure

  Run this sequence for each specific *topic thread* or *treatment cluster* under review. Do not diagnose the whole subforum at once; a subforum may be a bubble regarding Drug X and an echo chamber regarding Diet Y.

  **Step 1: The Availability Check (Bubble Screen)**
  *   **Question:** Is high-quality, mainstream clinical evidence regarding this specific topic absent from the last 50 posts?
  *   **Sufficient Answer for "Yes":** Zero links to major health bodies (NIH, NHS, CDC, major specialty societies) and zero discussion of standard-of-care guidelines in the thread history.
  *   **Sufficient Answer for "No":** At least three distinct instances of such evidence appearing in the last 50 posts.
  *   **Action:** If **Yes**, proceed to Step 2. If **No**, proceed to Step 3.

  **Step 2: The Reception Check (Bubble Confirmation)**
  *   **Question:** When outside evidence *has* appeared (even rarely), how was it treated?
  *   **Sufficient Answer for "Bubble":** The evidence was ignored, overlooked, or met with neutral curiosity (e.g., "My doctor never mentioned this," "I'll ask about this"). There is no language attacking the source's integrity.
  *   **Sufficient Answer for "Chamber/Other":** The evidence was met with pre-emptive dismissal, claims of bias, or assertions that the source is fundamentally compromised.
  *   **Action:** If **Bubble**, STOP. Diagnosis: **Epistemic Bubble**. If **Chamber/Other**, proceed to Step 3.

  **Step 3: The Credibility Check (Echo Chamber Screen)**
  *   **Question:** Is there a standing narrative that discredits the *source* of the outside evidence?
  *   **Sufficient Answer for "Yes":** Posts contain generalized claims that the institutions producing the evidence (pharma, regulators, academia) are corrupt, lying, or inherently opposed to patient interests. The discrediting is systemic, not specific to a single study's methodology.
  *   **Sufficient Answer for "No":** The sources are spoken of respectfully, or the criticism is limited to specific methodological flaws in specific studies without generalizing to the institution.
  *   **Action:** If **Yes**, STOP. Diagnosis: **Echo Chamber**. If **No**, proceed to Step 4.

  **Step 4: The Interpretation Check (Translation Loss Screen)**
  *   **Question:** When outside evidence is accepted as genuine, is its *conclusion* systematically altered to fit a community-specific framework?
  *   **Sufficient Answer for "Yes":** Evidence is cited approvingly, but the community consensus restates the finding in a way that reduces its statistical or clinical weight (e.g., "negative trial" becomes "underpowered for *our* subtype"; "no benefit" becomes "benefit for responders like us"). The original conclusion is acknowledged but functionally overruled by community hermeneutics.
  *   **Sufficient Answer for "No":** The community accepts the external conclusion, even if they disagree with the recommendation based on personal values.
  *   **Action:** If **Yes**, STOP. Diagnosis: **Hermeneutical Closure (Translation Loss)**. If **No**, STOP. Diagnosis: **No Epistemic Failure Detected**.

  ---

  ## Part 2: Observable Markers & Stop Rules

  | Marker | Epistemic Bubble | Echo Chamber | Translation Loss |
  | :--- | :--- | :--- | :--- |
  | **Presence of Outside Info** | Absent or Rare | Present but Weaponized | Present and Praised |
  | **Attitude Toward Source** | Neutral / Unknown | Hostile / Distrustful | Respectful / Trusting |
  | **Attitude Toward Conclusion** | N/A (Unseen) | Rejected (Source is liar) | Accepted but Reframed (Source is right, but not for *us*) |
  | **Language Used** | "I haven't heard..." | "They are hiding..." | "They don't understand..." |

  **Conflict/Mixed Signal Stop Rule:**
  If Step 2 and Step 3 yield conflicting signals (e.g., sources are discredited *and* missing), classify as **Echo Chamber**. Active discrediting is a stronger marker of closure than mere absence.
  If Step 3 and Step 4 conflict (e.g., sources are discredited *and* reframed), classify as **Echo Chamber**. Discrediting the source is the more severe epistemic break.
  If confidence in the diagnosis is below 70% based on post text alone, mark as **Uncertain** and hand off to Senior Moderator for values assessment (see Part 4).

  ---

  ## Part 3: Decision Matrix & Stopping Points

  1.  **Diagnosis: Epistemic Bubble**
      *   **Decision:** **Intervene.**
      *   **Reasoning:** The community is open but uninformed. Supplying missing info works.
  2.  **Diagnosis: Echo Chamber**
      *   **Decision:** **Exposure Contraindicated.**
      *   **Reasoning:** Forcing outside evidence will be absorbed as proof of corruption. Intervention will trigger mass exit and reduce trust in moderation. The support function of the group outweighs the epistemic error.
  3.  **Diagnosis: Translation Loss**
      *   **Decision:** **Hand-off to Human (Values Call).**
      *   **Reasoning:** This is the gray zone. The community is updating, but on their own terms. Intervention requires challenging their shared identity/framework, which may destroy the support network. This is not a factual question; it is a question of whether medical accuracy or community cohesion is the higher priority.
  4.  **Diagnosis: No Epistemic Failure**
      *   **Decision:** **Do Nothing.**
      *   **Reasoning:** The market of ideas is functioning.

  ---

  ## Part 4: Intervention Menu

  | Diagnosis | Intervention | Cost | Success Metric (What it looks like) |
  | :--- | :--- | :--- | :--- |
  | **Epistemic Bubble** | **Information Seeding.** Sticky a post with the missing guidelines. Tag it "Resource." Do not argue, just provide. | Low. Risk of "Why are you posting this?" | Links are clicked; subsequent posts reference the guideline without hostility. |
  | **Echo Chamber** | **Boundary Maintenance.** Do not post outside info. Enforce civility rules only. Allow the chamber to exist as a safe space, provided no harmful medical advice violates ToS. | Medium. Risk of external criticism that mods are allowing "misinformation." | Retention of members; no escalation to dangerous medical advice (e.g., suicide, poisoning). |
  | **Translation Loss** | **Framework Query (High Risk).** Ask questions that highlight the gap between the study and the reframe without asserting the study is right. E.g., "How do we know the subtype exclusion wasn't the cause?" | Very High. Risk of being seen as attacking the community's shared understanding. | Members acknowledge the uncertainty in their reframe. (Rare). |
  | **Uncertain / Values** | **Senior Hand-off.** Escalate to paid staff or board. | High. Slows decision time. | A documented policy decision that can be cited if members complain. |

  ---

  ## Part 5: Limitations & Honesty Statement

  **This procedure cannot see:**
  1.  **Private Coordination:** Members may be DMing to coordinate "astroturfing" of certain views.
  2.  **Performative Openness:** A group may have learned to say "Great study!" before dismissing it, to avoid moderator scrutiny. This mimics Translation Loss but is actually a hardened Echo Chamber.
  3.  **Safe Bubbles:** Some bubbles are beneficial. If a group ignores a harmful treatment because they haven't seen the marketing for it, popping that bubble causes harm. **Do not intervene in a Bubble if the missing information is primarily commercial or known to be low-value.**

  **Judgment Calls:**
  Step 4 (Translation Loss) is the most subjective. Distinguishing between "legitimate patient expertise" and "systematic downgrading" requires judgment. If the community's framework is based on lived experience that medicine currently ignores, their "translation" may be valid resistance, not epistemic failure. **When in doubt, favor the community's framework.**

  **The Verdict on "Translation Loss":**
  Is this a third failure mode? **No.** It collapses into **Echo Chamber**.
  **Why:** The definition of an Echo Chamber is not just "hating the source," but "immunization against outside correction." In Translation Loss, the group possesses the data but neutralizes its corrective power through reinterpretation. The *outcome* is identical to an Echo Chamber: belief does not update in the face of evidence.
  **Implication:** Treat Translation Loss with the same caution as an Echo Chamber. Do not assume that because they are polite, they are open. The intervention menu should reflect this: **Exposure Contraindicated** is the default for Translation Loss unless the medical risk is immediate and severe.

  ---

  ## Part 6: Case Study Runs

  ### Case A: The Quiet Subforum
  **Context:** A subforum for a rare autoimmune condition. Mainstream clinical guidance (EULAR guidelines) never appears. A member linked an NHS page once; replies were "My specialist never mentioned that" and "Interesting, thanks." No hostility.
  **Run:**
  *   **Step 1 (Availability):** Yes. Guidelines absent in last 50 posts.
  *   **Step 2 (Reception):** Bubble. Reaction was neutral/curious ("My specialist never mentioned that").
  *   **Diagnosis:** **Epistemic Bubble.**
  *   **Decision:** **Intervene (Information Seeding).**
  *   **Reasoning:** The structural filtering is working against the patients. They are not hostile to the data; they just don't have it. The "specialist never mentioned that" comment confirms they view the source as legitimate authority, just inaccessible.
  *   **Action:** Sticky the EULAR guidelines.
  *   **Confidence:** High.

  ### Case B: The Skeptical Parents
  **Context:** A vaccination and treatment-skeptical parenting group. They quote CDC guidance at length. They use phrases like "The data speaks for itself" followed by detailed explanations of why the data proves CDC corruption. Shared vocabulary: "Pharma capture," "Regulatory revolving door."
  **Run:**
  *   **Step 1 (Availability):** No. Guidance is present.
  *   **Step 3 (Credibility):** Yes. Sources are systematically discredited ("Regulatory revolving door"). The discrediting is general (all bodies are compromised), not specific to one study.
  *   **Diagnosis:** **Echo Chamber.**
  *   **Decision:** **Exposure Contraindicated.**
  *   **Reasoning:** They are using the outside material as fuel for their immunity. Posting more CDC links will not update their beliefs; it will confirm their narrative that the CDC is pervasive and therefore suspicious.
  *   **Action:** Do not post guidelines. Monitor for ToS violations (e.g., advising to withhold life-saving meds).
  *   **Confidence:** High.
  *   **Note:** This fits the standard Echo Chamber model perfectly. Intervention would be counter-productive and likely trigger a mass exit.

  ### Case C: The Framework Community (Translation Loss)
  **Context:** A subforum built around a specific metabolic theory of the condition. High-quality RCTs are posted weekly. Members praise the researchers ("Dr. X is a hero"). However, every negative trial is restated: "The dose was too low for *our* metabolism," or "They didn't test the combo we know works." The conclusion "Treatment Z does not work" becomes "Treatment Z doesn't work *in isolation*."
  **Run:**
  *   **Step 1 (Availability):** No. Evidence is present.
  *   **Step 3 (Credibility):** No. Sources are praised ("Dr. X is a hero").
  *   **Step 4 (Interpretation):** Yes. Conclusions are systematically altered to fit the metabolic framework. "Negative" becomes "Underpowered for subtype."
  *   **Diagnosis:** **Hermeneutical Closure (Translation Loss).**
  *   **Collapse Verdict:** As stated in Part 5, this **collapses into Echo Chamber**. The "Metabolic Framework" acts as the discrediting mechanism, replacing the "Corrupt Institution" narrative. The epistemic closure is total.
  *   **Decision:** **Do Nothing / Monitor.** (Against Instinct).
  *   **Reasoning:** My instinct is to correct the science. The procedure tells me that since this functions as an Echo Chamber, forcing standard interpretation will be seen as an attack on their shared identity (the Metabolic Framework). This framework is likely what makes them feel understood. If I break the framework to fix the epistemology, I destroy the support. Unless the "combo they know works" is toxic, the epistemic error is the price of the community's existence.
  *   **Action:** Do not intervene.
  *   **Confidence:** Moderate (60%).
  *   **What would settle it:** If members start reporting harm from the "combo," the decision shifts to **Exposure Contraindicated** becomes **Intervention Required** based on Safety, not Epistemology.
  *   **Honesty Check:** I am marking this "Do Nothing" because the procedure correctly identifies that I cannot win a fight against a hermeneutical framework without private data on *why* they hold it. If I intervene, I become the "outsider who doesn't get it."

  ---

  ## Final Note to the Moderator Team

  You asked if Translation Loss is a third mode. I have told you it is not; it is a sophisticated Echo Chamber. This matters because if you treat it like a Bubble (Case A), you will waste your time seeding evidence that is already there. If you treat it like a standard Echo Chamber (Case B), you might be too aggressive in your withdrawal.

  The procedure above forces you to identify the *mechanism* of closure. In Case C, the mechanism is identity, not distrust. That means your intervention (if you must intervene for safety) cannot be "Here is the truth." It must be "Here is a risk calculation."

  **One last warning:** In Case C, the procedure tells you to **Do Nothing**. This will feel wrong. You will see members making medical decisions on "downgraded" evidence. You must accept that a peer-support forum is not a clinic. If you fix the epistemology and lose the members, you have saved the science but killed the support. The procedure prioritizes the survival of the support network unless safety is immediately compromised. Stick to the matrix.
