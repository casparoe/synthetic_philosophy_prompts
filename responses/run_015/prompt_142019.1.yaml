      *   **Context:** 75-minute first-year writing/rhetoric class. 19 students (mostly nursing/business/engineering).
      *   **Student Attitude:** Skeptical, fatigued by online fights about pronouns/job titles. Half think it's settled, half think it's silly. Both think they know what's coming.
      *   **Pedagogical Goal:** Avoid direct lecture on gender/race initially. Use a "trap" mechanism similar to Hofstadter's "Person Paper" but student-generated. Students build the bias, then swap and transplant it to gender, realizing the absurdity themselves.
      *   **Constraint:** Do not mention Hofstadter or satire until the debrief.
      *   **Specific Activity Shape:** Small groups write a memo about a fictional guild/world with biased language (non-gender/race axis). Swap memos. Use a "transplant table" to rewrite the memo targeting gender. Read aloud. Third group guesses original.
      *   **Debrief Focus:** Distinguish three functions of markers: (1) Reference (who is being talked about), (2) Defaulting (unmarked form implies a specific picture), (3) Social Load (marked form carries condescension/hypervisibility). Show that fixing (1) doesn't fix (2) or (3).
      *   **Requirements:** Runnable materials, handout text, transplant table, timeline, exact opening words, debrief mapping, failure modes, what it *can't* teach, 30-minute version.
