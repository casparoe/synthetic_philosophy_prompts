  # Session Plan: The Unmarked Trap

  ## Overview
  *   **Time:** 75 minutes
  *   **Students:** 19 (First-year Writing/Rhetoric, STEM/Business heavy)
  *   **Goal:** Demonstrate how linguistic marking creates default assumptions and social load distinct from reference, without triggering immediate defensiveness about gender/politics.
  *   **Key Constraint:** Do not mention Hofstadter, satire, or gender politics until the debrief.

  ## Materials Needed
  *   Projector/Screen (for timer only).
  *   Handout 1: "Guild Memo Drafting" (one per group).
  *   Handout 2: "The Transplant Table" (one per group).
  *   Whiteboard/Chalkboard.
  *   Pens/Paper.

  ## Opening Script (Exact Words)
  "Good morning. Today we are doing a mechanics exercise on professional communication. You will be working in groups of three. You are going to draft a short policy memo for a fictional organization. The organization has specific rules about job titles and honorifics that might seem odd to you, but your job is to treat them as normal. We are looking at how language shapes expectation. I am not asking for your opinion on the fiction; I am asking you to build the fiction correctly. You have five minutes to read the prompt."

  ## Activity Timeline

  | Minutes | Participants Do | Facilitator Says |
  | :--- | :--- | :--- |
  | **00-05** | Listen to intro; form groups (6 groups of 3, 1 group of 1 merged). | "Good morning. Today we are doing a mechanics exercise... [see Opening Script]." |
  | **05-20** | **Drafting:** Groups write a 1-paragraph memo using the fictional axis (Sunborn/Moonborn). | "Ensure you use the titles provided in Handout 1. Do not explain the titles, just use them." |
  | **20-35** | **Swapping & Transplanting:** Groups swap memos. Use Handout 2 to rewrite the memo using Gendered terms. | "Pass your memo to the group on your left. Take the memo you receive. Use the Transplant Table to rewrite every instance of the fictional terms." |
  | **35-50** | **Reading & Guessing:** Groups read both versions (Original & Transplant). Class guesses which was original. | "Read both versions aloud. The rest of the class: Which one sounds like the original policy? Which one sounds like the translation?" |
  | **50-75** | **Debrief:** Discuss the three jobs of markers (Reference, Default, Social Load). Reveal Hofstadter. | "Why did the transplanted version sound absurd? Let's look at three specific jobs those words were doing." |

  ## Handout 1: Guild Memo Drafting
  **Scenario:** You are the HR Director for the **Order of the Eclipse**.
  **The World:** There are two types of people: **Sunborn** (the default majority) and **Moonborn** (a specialized minority).
  **The Language:**
  *   **Unmarked Term:** "Member" (Refers to Sunborn, or generic mixed groups).
  *   **Marked Term:** "Moon-Member" (Refers specifically to Moonborn).
  *   **Example:** "All Members must attend. Moon-Members may sit in the back."
  **Task:** Write a 4-5 sentence memo announcing a new promotion policy. Use the terms above naturally. Do not explain why the terms exist; just use them as if they are normal.

  ## Handout 2: The Transplant Table
  **Instructions:** Take the memo you received. Replace the fictional terms with the Real-World terms below. Keep the sentence structure exactly the same.

  | Axis | Unmarked Term (Default) | Marked Term (Specific) | Replacement Rule |
  | :--- | :--- | :--- | :--- |
  | **Fictional** | Member | Moon-Member | *Original Text* |
  | **Gender** | Man | Woman | *Swap these in* |

  **Example:**
  *   *Original:* "All Members must attend. Moon-Members may sit in the back."
  *   *Transplant:* "All Men must attend. Women may sit in the back."

  ## Debrief Guide (The Three Jobs)
  *Do not start by explaining the theory. Start by asking about their experience of the text.*

  1.  **Reference (Who is being talked about?)**
      *   *Moment:* When students swapped "Member" for "Man."
      *   *Idea:* Did the sentence still make logical sense? Yes. The reference worked.
      *   *Question:* "When you swapped the words, did the sentence still grammatically hold together? Where did it break?"
  2.  **Defaulting (Who do you picture?)**
      *   *Moment:* When reading "All Members" vs. "All Men."
      *   *Idea:* "Member" felt neutral in the fiction, but "Man" feels specific in reality. Yet in the fiction, "Member" *was* specific (Sunborn).
      *   *Question:* "In the fictional version, who did you picture when you wrote 'Member'? In the transplanted version, who do you picture when you hear 'Man'?"
  3.  **Social Load (What does the marked form carry?)**
      *   *Moment:* When reading "Moon-Member" vs. "Woman."
      *   *Idea:* The marked term feels diminutive, hypervisible, or "othered."
      *   *Question:* "Why did 'Women may sit in the back' sound offensive, but 'Moon-Members may sit in the back' sounded like world-building? What weight does the word 'Women' carry that 'Moon-Member' doesn't?"

  **The Reveal:**
  "This technique is called a rhetorical transplant. It was popularized by Douglas Hofstadter in a 1985 essay called 'A Person Paper on Purity in Language.' He used it to show how arguments against gender-neutral language sound exactly like arguments against racial equality if you swap the axes. We didn't talk about gender until now because I wanted you to feel the structure before you defended the topic."

  ## Predictable Failure Modes & Handling

  | What Goes Wrong | How to Handle |
  | :--- | :--- |
  | **The Edgy Group:** Creates a fictional axis that is actually about race/Politics (e.g., "Rich/Poor"). | Intervene during drafting: "Please stick to the Sunborn/Moonborn prompt. We need a neutral axis for the mechanics to work." |
  | **The Refusal:** Student says "I'm not reading this aloud, it's sexist." | Validate: "You don't have to read. You can listen. We are analyzing the text as a object, not endorsing it." |
  | **The Grandfather Defense:** "So you're calling my grandfather a bigot for saying 'fireman'?" | Redirect: "We aren't judging individuals. We are looking at how the word 'man' functions as a default in the sentence structure. It's about the tool, not the carpenter." |
  | **The Laughter:** Students laugh at the transplanted version because it sounds clumsy. | Use it: "Why is it funny? Is it funny because it's wrong, or because it reveals something we usually ignore?" |

  ## What This Activity Cannot Teach
  *   **Humor vs. Harm:** The transplanted text sounds funny partly because it is clumsy. Real-world bias hurts people; sounding clumsy is not the same as causing harm.
  *   **Mechanism Equivalence:** Fictional bias (Sunborn) is not identical to gender bias. Gender has biological, historical, and power dimensions that a fictional guild does not.
  *   **Solutioning:** This activity shows the *problem* (marking), but fixing the word (e.g., using "Firefighter") doesn't automatically fix the *defaulting* or *social load*.

  ## 30-Minute Version (Low Attendance/Short Slot)
  "Skip the group writing phase. I will provide a pre-written 'Guild Memo' on the board. You will individually perform the Transplant Table swap on your own paper (5 mins). We will read two versions aloud (5 mins). We will spend the remaining 20 minutes on the Debrief Guide. The goal is the same: feel the structure before naming the politics."

