answer: |-
  Here are the scores based on the normative force of the authorization provided, followed by the analysis of the disagreement and your scaffolding.

  ### The Defects Scored

  | # | Scenario | Score | Justification |
  | :--- | :--- | :--- | :--- |
  | **1** | Lie about social value/benefit | **6** | The authorization to act on the body is valid, but the moral justification for accepting the risk is fabricated. |
  | **2** | Omitted material side effect | **2** | Permission was not granted for this specific risk profile, rendering the consent invalid for the actual procedure undertaken. |
  | **3** | Dementia with contemporaneous re-consent | **7** | Authorization is valid in the moment, though the lack of continuity degrades the stability of the long-term agreement. |
  | **4** | Rationing makes study the only treatment | **4** | Voluntariness is severely compromised by structural coercion, even if the researcher is not the direct agent of that coercion. |
  | **5** | Consultant takes consent in uniform | **8** | The power imbalance creates subtle pressure, but this falls within accepted clinical norms and does not negate the permission. |
  | **6** | Consented to blood, used for genetics | **3** | Exceeding the specific scope of authorization is a trespass on autonomy, regardless of whether the data is linked or risk-free. |
  | **7** | Therapeutic misconception known to researcher | **1** | The participant misunderstands the fundamental nature of the interaction (care vs. research), negating the "informed" condition entirely. |
  | **8** | Consent-taker does not understand protocol | **4** | The communication channel required for *informed* consent is broken, making the signature procedurally hollow even if the patient understands. |

  ### Where the Disagreement is Real

  You asked where competent people will genuinely come apart. In my experience, verbal disagreements hide behind definitions (e.g., "Is this *really* coercion?"), but real disagreements occur over **thresholds of understanding** and **the locus of voluntariness**.

  1.  **The Nature of "Informed" (Scenarios 1, 7, & 8):** The real fight is between the *risk-based* model and the *meaning-based* model. A risk-based theorist will score Scenario 1 higher (she knows the risks, the social value is irrelevant to her bodily integrity) while a meaning-based theorist will score it lower (consent requires sharing a reason for the action). Scenario 7 is the flashpoint: if she thinks it's treatment, does it matter that the form says "Research"? Some say the signature binds; others say the mental state governs.
  2.  **The Locus of Voluntariness (Scenario 4):** This is the deepest fracture. One camp holds that voluntariness is purely interpersonal (did the *researcher* threaten you?), which scores this a 7 or 8. The other camp holds that voluntariness is situational (are *any* acceptable alternatives available?), which scores this a 2 or 3. You cannot reconcile these without deciding whether ethics protects the *transaction* or the *agent's context*.
  3.  **Harm vs. Authority (Scenario 6):** If the samples are unlinked and she is safe, did a wrong occur? Consequentialists will score this high (no harm done); Deontologists will score it low (authority violated). This is a genuine normative split, not a verbal one.

  ### Evaluating Your Scaffolding

  **1. Void vs. Tainted**
  This is a real distinction, though in legal philosophy it is usually mapped as **Validity vs. Propriety**.
  *   **Void (Invalid):** The consent fails to perform its primary normative job: transforming a battery into a permissible act. (e.g., Scenarios 2, 6, 7).
  *   **Tainted (Valid but Improper):** The permission is granted, so the researcher is not liable for trespass, but the *process* of obtaining it violated ethical norms, warranting sanction or study termination. (e.g., Scenarios 1, 4, 5, 8).
  *   **Verdict:** Keep it. It distinguishes between "Can they do it?" (Validity) and "Should they have done it this way?" (Propriety).

  **2. The Uptake Condition**
  The analogy to promises holds, but with a specific caveat. In speech-act theory (Austin/Searle), consent is an **illocutionary act** that requires **uptake** to be successful.
  *   If I promise you something you cannot hear, the promise is infelicitous.
  *   If I consent to you, and you (the researcher) do not understand the scope or nature of what I am consenting to (Scenario 8), the "permission" does not successfully land.
  *   **Verdict:** The analogy holds. Consent is not merely a mental state (intention) nor merely a signature (perlocutionary effect); it is a communicative act that fails if the recipient lacks the capacity to recognize the content of the authorization. You haven't smuggled in anything illicit; you've correctly identified consent as a relational transaction rather than a unilateral waiver.
