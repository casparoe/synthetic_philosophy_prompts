  2.  **Focal Point:** The point $(1,1)$ is geometrically salient (the kink). In the absence of communication, kinks often serve as Schelling points.
  3.  **Surplus Maximization:** Your friend may intuitively favor maximizing the product of gains (Nash) over equalizing relative potential (KS), as the former is often framed as maximizing the "size of the pie" in utility space.

  ### 4. The Decisive Test Case (Case 6)

