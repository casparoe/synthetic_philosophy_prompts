  Based on the track record and the stated invariance condition, I have identified the two candidate decision rules. Both satisfy **Scale Invariance** (invariance to positive affine transformations of utility), which is the condition your friend explicitly stated. The two standard solution concepts in axiomatic bargaining that satisfy this condition are the **Nash Bargaining Solution (NBS)** and the **Kalai-Smorodinsky Solution (KS)**.

  As you suspected, Cases 1 through 3 involve linear frontiers, and Case 4 is symmetric. On linear frontiers, NBS and KS always coincide. On symmetric frontiers, they also coincide (both select the symmetric point). Thus, the first four cases cannot distinguish them. Case 5, however, features an asymmetric frontier with a kink, which forces a divergence.

  Here is the derivation for each candidate, the prediction for next week, and the design for a decisive test case.

  ### 1. Candidate Rules and Verification

  **Candidate A: Nash Bargaining Solution (NBS)**
  *   **Rule:** Selects the point $(u_1, u_2)$ in the feasible set $S$ that maximizes the product of gains over the disagreement point $d$:
      $$ \max (u_1 - d_1)(u_2 - d_2) $$
  *   **Verification:**
      *   *Case 1:* Max $xy$ s.t. $x+y=1$. Solution $(1/2, 1/2)$. (Matches)
      *   *Case 2:* Max $xy$ s.t. $x+4y=4$. Solution $(2, 1/2)$. (Matches)
      *   *Case 3:* Max $(x-0.1)(y-0.3)$ s.t. $x+2y=2$. Solution $(0.75, 0.625)$. (Matches)
      *   *Case 4:* Symmetric set with kink at $(2,2)$. The product $xy$ is maximized at the kink because the level curves $xy=c$ are tangent to the frontier segments at boundaries or the kink. Solution $(2,2)$. (Matches)

  **Candidate B: Kalai-Smorodinsky Solution (KS)**
  *   **Rule:** Selects the point where the Pareto frontier intersects the line segment connecting the disagreement point $d$ to the **Ideal Point** $a = (a_1, a_2)$, where $a_i$ is the maximum feasible utility for player $i$ (given $u_j \ge d_j$).
      $$ \frac{u_1 - d_1}{a_1 - d_1} = \frac{u_2 - d_2}{a_2 - d_2} $$
  *   **Verification:**
      *   *Case 1:* Ideal $a=(1,1)$. Line $y=x$. Intersect $x+y=1 \to (1/2, 1/2)$. (Matches)
      *   *Case 2:* Ideal $a=(4,1)$. Line $y=x/4$. Intersect $x+4y=4 \to (2, 1/2)$. (Matches)
      *   *Case 3:* Ideal $a=(1.4, 0.95)$. Line from $(0.1, 0.3)$ with slope $0.5$. Intersect $x+2y=2 \to (0.75, 0.625)$. (Matches)
      *   *Case 4:* Ideal $a=(3,3)$. Line $y=x$. Intersect frontier at $(2,2)$. (Matches)

  ### 2. Analysis of Next Week's Case (Case 5)

  **Setup:**
  *   Disagreement $d = (0,0)$.
  *   Feasible Set Vertices: $(0,0), (2,0), (1,1), (0, 1.2)$.
  *   **Frontier Segments:**
      1.  $S_1$: From $(2,0)$ to $(1,1)$. Equation: $y = -x + 2$ (for $x \in [1, 2]$).
      2.  $S_2$: From $(1,1)$ to $(0, 1.2)$. Equation: $y = -0.2x + 1.2$ (for $x \in [0, 1]$).
  *   **Ideal Point:** $a_1 = 2$ (at $y=0$), $a_2 = 1.2$ (at $x=0$). So $a = (2, 1.2)$.

  **Nash Bargaining Solution Computation:**
  We maximize the product $P = xy$ on the frontier.
  *   On $S_1$ ($y = 2-x$): $P = x(2-x)$. Unconstrained max at $x=1$. Since $x=1$ is the boundary of $S_1$ (the kink), the max on this segment is at **$(1,1)$** with $P=1$.
  *   On $S_2$ ($x = 6 - 5y$): $P = (6-5y)y$. Unconstrained max at $y=0.6$. This corresponds to $x=3$, which is outside the domain $x \in [0,1]$. On the domain $y \in [1, 1.2]$, the product is decreasing. Max is at the boundary $y=1$, which is the kink **$(1,1)$**.
  *   **Nash Prediction:** **$(1, 1)$**.

  **Kalai-Smorodinsky Solution Computation:**
  We find the intersection of the frontier and the ray from $d(0,0)$ to $a(2, 1.2)$.
  *   Ray Equation: Slope $m = 1.2 / 2 = 0.6$. So $y = 0.6x$.
  *   Intersect with $S_1$ ($y = 2 - x$):
      $$ 0.6x = 2 - x \implies 1.6x = 2 \implies x = 1.25 $$
      $$ y = 0.6(1.25) = 0.75 $$
