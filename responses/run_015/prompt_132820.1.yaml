prompt: |-
  After a long argument with a friend last night — she holds that calling a failed prediction *early* is just a polite way of refusing to give up a theory, and that Malthus is the type-case; I held that this is too quick — I am recording an episode of my philosophy-of-science podcast with Dr Miriam Vale, who defends a distinct epistemic status for long-run predictive theories, *right but early*, and argues that the usual charge of ad hoc rescue misfires against them. Her stock reply to any missed forecast is that what was issued was a projection rather than a prediction: a claim about what happens if certain rates go on holding, not a claim about what will happen by a given date.

  Draft me six interview questions, each with one follow-up keyed to the reply she is most likely to make, that press on: (i) whether her projection/prediction distinction survives the point that any auxiliary assumption can be re-described as a condition of the claim; (ii) how *right but early* differs even in principle from a degenerating research programme, given that both verdicts are available only with hindsight; (iii) what it would take to fix a deadline in advance — say by pre-registering a time window and a population figure for the geometric-versus-arithmetic claim of Malthus's 1798 essay — and whether she accepts that a theory which declines every deadline has surrendered empirical content; (iv) why the gap between too early and simply wrong is not just a matter of who is keeping the score, since the evidence in hand is the same either way; (v) what separates legitimate specification from monster-barring when the rescue is a delay of two centuries rather than a restriction of the domain to populations that have not undergone the demographic transition; and (vi) what would make her withdraw a *right but early* verdict from a theory she is unsympathetic to, not only from Malthus.

  No question should let her restate the view; each should be concrete enough to be answered in a sentence or two. Keep the whole set to no more than 600 words, and write it in British English.
