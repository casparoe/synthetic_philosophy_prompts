      *   *Point 1 (Retains vs. Lost):* "Retains" is doing heavy lifting. It distinguishes a corpse (matter remains, form gone) from a sleeper/seed (matter remains, form present but not exercising). The two-grade actuality *is* the mechanism. Sleep = First Actuality. Death = Loss of First Actuality.
      *   *Point 2 (Except in Name):* This is ontological, not just linguistic. If $X$ cannot do $F$ (its ergon), it is not $X$. A dead eye isn't an eye. This is strong. Contemporary functionalism might say "it's broken but still an eye." Aristotle says "no, 'eye' implies seeing capacity."
