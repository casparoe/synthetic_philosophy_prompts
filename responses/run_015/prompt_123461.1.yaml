      *   *Virus Particle:* This is the hard case. It has structure. But does it have an *internal* principle of motion/change? No, it requires hijacking another soul's machinery. It's more like a tool than an organism. Verdict: **Not Alive** (or "in name only" if one stretches). It lacks the *self*-maintenance capacity.
