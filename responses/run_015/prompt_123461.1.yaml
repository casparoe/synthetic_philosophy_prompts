answer: |-
  This is a precise and demanding reading of *De Anima* II.1. You are asking whether Aristotle's hylomorphic definition of the soul provides a logical space for "borderline" life that avoids a binary trap, and whether the text supports your intuition about "relational separation."

  Here is an analysis of what the argument in this passage is doing, followed by the application to your four cases and the specific questions you raised.

  ### 1. The Work of the Distinctions

  **First vs. Second Actuality**
  You asked whether the two-grade analysis of actuality carries the load or is merely an analogy for sleep. It carries the load. This distinction is the engine of Aristotle's definition.
  *   **Second Actuality (Exercise):** The act of seeing, the act of thinking, the act of metabolizing.
  *   **First Actuality (Possession):** The capacity to see, the capacity to think, the capacity to metabolize.

  Aristotle defines the soul as **First Actuality**. This is crucial. If the soul were Second Actuality, a sleeping animal or a dormant seed would be dead, because they are not currently exercising their functions. By defining the soul as the *possession* of the capacity, Aristotle secures the identity of the organism through periods of inactivity.

  **The Work of "Retains"**
  You are correct that "potentially" is dangerous. A corpse is potentially living matter (it can rot and become soil for plants), but it is not a living body. The qualifier "still retains it" distinguishes between:
  1.  **Matter that has lost its Form:** The corpse. The organization is gone; the capacity is gone.
  2.  **Matter that holds its Form in abeyance:** The sleeper, the seed. The organization is preserved; the capacity is present but not currently operating.

  "Retains" does the work of excluding the corpse without excluding the dormant. It implies that the *principle* of movement and rest is still internal to the body, even if the motion is currently paused.

  ### 2. The Ontology of "Except in Name"

  You ask if "except in name" (*plēn homōnumōs*) is about reference or essence. It is about **essence**, which dictates reference.

  For Aristotle, functional capacity is constitutive of identity. An eye is defined by its function (seeing). If the capacity to see is destroyed, the substance that remains is not an eye that is broken; it is a lump of matter that *was* an eye. To call it an eye is a linguistic courtesy, not an ontological fact.

  **Implication for Contemporary Accounts:**
  A contemporary functionalist account (life = current activity + disposition) might struggle here. If you define life by disposition, a dead eye still has the disposition of "having been an eye" or the material disposition to be analyzed as one. Aristotle's move is stronger: he claims the disposition *itself* is gone. The "except in name" clause is not a hedge; it is a hard boundary. It says: "If the functional capacity is irretrievably lost, the kind membership is revoked." This commits you to a stronger claim than most modern biological definitions, which tend to be material-continuity based (it's still a body, just a dead one).

  ### 3. Relational Separation vs. Functional Collapse

  Your reading here is **not a projection**; it is a necessary implication of the text.

  Aristotle distinguishes between:
  1.  **Internal Loss of Capacity:** The eye is blind because the organ is destroyed. (Functional Collapse).
  2.  **External Prevention of Exercise:** The eye is closed, or it is dark, or the seed is dry. (Relational Separation).

  The seed example proves this. A seed is metabolically inert (like a corpse) but is classified as living. Why? Because the obstruction to its activity is external (lack of water/soil), not internal. The "power of sight" is present in the closed eye; the "power of growth" is present in the dry seed.

  This distinction is the only way the "First Actuality" definition survives. If life required current metabolic activity, the seed would be dead. If life required only material structure, the corpse would be alive. The criterion is: **Does the body possess the internal principle of change/rest, even if external conditions prevent its exercise?**

  ### 4. Application to the Four Cases

  Here is how Aristotle's framework, strictly applied, judges your four cases.

  **1. The Dormant Seed**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** Aristotle explicitly names seeds and fruits as bodies that "possess the qualification." They have First Actuality. The capacity for growth and nutrition is internal, even if currently unexercised.
  *   **Category:** Living (First Actuality).

  **2. The Frozen Embryo**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** This is structurally identical to the seed in Aristotle's logic. Metabolic activity is suspended due to external conditions (temperature), but if the structural organization is preserved such that thawing restores function, the "soul" (the form/capacity) is retained. It is not a corpse; it is a sleeper.
  *   **Category:** Living (First Actuality).

  **3. The Virus Particle (Extracellular)**
  *   **Verdict:** **Not Alive (or "In Name Only").**
  *   **Reasoning:** This is the hardest case, but Aristotle's logic leans heavily against it. A virus has structure, but it lacks an *internal* principle of motion/change. It cannot metabolize or replicate on its own; it must hijack the "soul" of a host cell to function.
      *   For Aristotle, a tool (like an axe) has a function, but its function comes from the user (the soul of the artisan), not from itself.
      *   A virus is more like a tool or a seed that *never* becomes a plant on its own. It lacks the *self*-maintenance capacity.
      *   Therefore, it does not "retain" the soul in the required sense. It is matter waiting to be organized by another soul.
  *   **Category:** Non-living matter (potentially part of a living process, but not a living substance).

  **4. The Sterile Hybrid (Mule)**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** You note that reproduction is characteristic of the living. However, for Aristotle, reproduction is the goal of the *nutritive* soul, but the *possession* of the nutritive soul is defined by the capacity for nutrition and growth.
      *   A mule eats, grows, perceives, and moves. It possesses First Actuality for these functions.
      *   Sterility is a failure of the *species* form to propagate, not necessarily a lack of soul in the individual. The mule has a soul, but it is a "dead end" soul.
      *   Aristotle acknowledges monsters and deviations in nature. They are alive, but they represent a failure of the form to fully master the matter.
  *   **Category:** Living (but ontologically deficient/imperfect).

  ### 5. Does this supply a "Third Verdict"?

  You asked if the "except in name" move supplies a third verdict (neither yes nor no).
  **Strictly speaking: No.**
  Ontologically, Aristotle's system is binary. You either have the Form (Soul) or you do not.
  *   If you have First Actuality, you are Alive.
  *   If you lack First Actuality, you are Dead (or Non-living).

  The "except in name" clause is not a third ontological state; it is a linguistic concession to human error. It allows us to say, "We call this a dead eye, but strictly speaking, it isn't an eye." It protects the definition from counter-examples by denying the counter-example's membership in the kind. It does not create a category of "semi-alive." It creates a category of "misnamed."

  However, the **First/Second Actuality** distinction does solve the dormancy problem without resorting to a binary of "active vs. dead." It creates a stable state of "alive but inactive." This is not a third verdict on *life*, but a nuanced verdict on *activity*.

  ### 6. The "Sailor in a Ship" Concession

  At the end of II.1 (and into II.2), Aristotle mentions the view that the soul might be related to the body as a sailor to a ship. He raises this to consider whether the soul is separable.

  **Does this undercut the "First Actuality" formula?**
  **No.** It qualifies the scope of the formula, specifically regarding the Intellect (*nous*), not the definition of life itself.
  *   The "First Actuality" definition applies to the **Nutritive** and **Sensitive** souls. These are inextricably tied to the body (like the wax and the seal). You cannot have digestion without a body.
  *   The "Sailor" analogy is entertained (and largely rejected for the soul as a whole) to account for the possibility that the *rational* soul might be separable.
  *   Even if the sailor analogy held for the intellect, it does not undercut the definition of the *living body*. A ship without a sailor is still a ship (a tool); a body without a soul (in the hylomorphic sense) is a corpse (not a body in the true sense).
  *   Aristotle ultimately prefers the wax/seal analogy for the soul-body union because it preserves the **substantial unity** of the organism. The sailor analogy makes them two substances. If the soul were a sailor, the organism would be an aggregate, not a unity. Aristotle rejects this for living things generally.

  ### Summary of Your Questions

  1.  **What work is "retains" doing?** It distinguishes dormant capacity (seed/sleeper) from lost capacity (corpse). It ensures "potentiality" means "ready to function" not "could possibly function."
  2.  **Is "except in name" about reference or essence?** Essence. If the function is gone, the thing is no longer that kind of thing. Contemporary accounts that accept "broken but still an X" conflict with Aristotle's essentialism.
  3.  **Is "relational separation" a projection?** No. It is the logical requirement for the seed/sleep analogy to work. The capacity must be internal, even if the exercise is externally blocked.
  4.  **Does the Sailor analogy undercut the formula?** No. It is a specific problem regarding the separability of intellect, not the general definition of the soul as the actuality of a natural body.

  **Final Verdict on the "Third Verdict":**
  Aristotle does not give you a graded ontology of life (0.5 alive). He gives you a **binary ontology with a linguistic buffer.**
  *   **Alive:** Seed, Embryo, Mule.
  *   **Not Alive:** Corpse, Virus.
  *   **"In Name Only":** Dead eye, Dead body (used loosely).

  The framework is robust enough to handle dormancy (via First Actuality) and sterility (via distinction of individual vs. species capacity), but it is likely too strict to handle the virus as anything other than non-living matter, and it refuses to grant ontological status to "borderline" cases that lack the internal principle of motion.
