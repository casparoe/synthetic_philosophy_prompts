  **JOINT STATEMENT ON PUBLIC SAFETY RESTRUCTURING**
  **Bell Harbor Advisory Committee**

  **Context**
  Bell Harbor (population 380,000) faces a divergence in public safety vision. This document records an adversarial collaboration between Reform/Defund advocates and Abolitionist advocates. Both sides accept the following stipulated facts: only a small fraction of 911 calls involve violence or weapons; public fear centers on response times and clearance rates for serious violent crime; most officer hours are spent on non-violent tasks; and any replacement institution must address armed, violent, or uncooperative individuals.

  **I. Shared Claims**
  Both parties sign the following assertions as the baseline for restructuring:
  1.  **Call Volume Reality:** The majority of Bell Harbor 911 calls involve non-violent disturbances, welfare checks, or property issues.
  2.  **Primary Fear:** Community trust is most damaged by failures to solve serious violent crimes, not by the absence of officers at minor incidents.
  3.  **Current Misallocation:** Sworn, armed officers currently spend the majority of their shifts performing tasks that do not require a mandate to use force.
  4.  **Inevitable Coercion:** Any functional system requires a protocol for individuals who are armed, violently uncooperative, or refusing life-saving help.
  5.  **Goal:** The objective is to reduce harm and increase safety, defined broadly as both physical security and material stability.

  **II. Core Disagreements and Predictive Cases**
  We disagree on the scope of state coercion and the architecture of emergency response. Below are the two specific cruxes where our models diverge, including concrete cases we agree bear on the issue and our conflicting predictions.

  **A. The Violent-Envelope Problem**
  *Question:* Does the objection to state force stop at the uniform, or does it extend to civil enforcement (evictions, CPS removals, psych holds)?
  *Reform Position:* The state's monopoly on force is legitimate for civil enforcement (courts, CPS) but should be stripped from general patrol.
  *Abolition Position:* The logic of coercion is identical across agencies; involuntary holds and evictions are state violence that require dismantling, not just rebranding.

  *Concrete Case:* A tenant refuses eviction after a lease expires due to unpaid rent; enforcement officers arrive to remove them.
  *Reform Prediction:* Without lawful enforcement, property rights collapse, leading to increased disorder and housing instability for landlords and tenants alike.
  *Abolition Prediction:* Enforcement inflicts trauma and homelessness; resolution requires material aid, not the threat of physical removal.

  **B. The 3am Question**
  *Question:* Who responds to a high-uncertainty call at night when backup is distant?
  *Reform Position:* A small, highly trained unit of sworn officers must retain general standing to use force for immediate threats.
  *Abolition Position:* No agency should have general standing; armed response must be exceptional, requested specifically by unarmed mediators only when imminent lethality is confirmed.

  *Concrete Case:* A 3am call regarding a distressed neighbor shouting and breaking windows, weapon status unknown.
  *Reform Prediction:* Immediate armed response prevents escalation to homicide or suicide; delay increases risk.
  *Abolition Prediction:* Armed arrival escalates distress into violence; unarmed mediation de-escalates without triggering defensive aggression.

  **III. Table of Disagreements**
  The following table outlines where our models remain incompatible. Wording reflects how each side frames the issue.

  | Issue | Reform/Defund Wording | Abolitionist Wording |
  | :--- | :--- | :--- |
  | **Scope of Coercion** | Civil enforcement (CPS, evictions) is a necessary state function distinct from policing. | Civil enforcement is policing by other means; the mandate to coerce must be abolished everywhere. |
  | **3am Authority** | Sworn officers require general standing to assess and neutralize threats at any hour. | Armed intervention requires specific justification from unarmed mediators; no general standing. |
  | **Naming the Residual** | The armed residual unit should be designated as "Public Safety Officers." | The armed residual unit should be designated as "Last-Resort Interventionists." |

  **Note on Semantic Disagreement**
  The third row ("Naming the Residual") is solely a semantic disagreement. Both sides agree this unit would be armed, highly restricted, and used only for imminent lethal threats. The Reform side prefers "Officer" to maintain chain-of-command clarity and public recognition. The Abolitionist side prefers "Interventionist" to signal the exceptional nature of the role. The function is identical; the label is the conflict.

  **IV. Conclusion**
  This document clarifies that while we agree on the diagnosis of current failures (misallocation of armed responders), we disagree on the prognosis for state coercion. Future pilots in Bell Harbor must test the predictive cases above to determine which model reduces harm without compromising security.
