      *   **Tone:** Philosophical, precise, charitable, academic, collaborative.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Occasionalism (Ghazālīan/Kalam):**
          *   Core: God is the only true agent. Created things are merely occasions for God's action.
          *   Motivation: Protect divine omnipotence and sovereignty. Avoid shirk (associating partners with God in lordship). Solve the problem of induction (miracles are possible because laws are habits, not necessities).
          *   View on Causation: Constant conjunction (habit of God), not necessary connection.
      *   **Secondary Causation (Averroist/Peripatetic):**
          *   Core: God creates and sustains creatures with real causal powers. Creatures truly act.
          *   Motivation: Protect divine wisdom and the reality of the created order. Avoid making God the direct author of evil/sin. Make sense of human responsibility and scientific inquiry.
          *   View on Causation: Real efficacy grounded in essence/nature, sustained by God.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground that isn't trivial but establishes the framework of the debate.
      *   *Claim 1 (Divine Omnipotence):* Both agree God is the ultimate source of all existence. No creature exists independently.
      *   *Claim 2 (Regularity):* Both agree the world exhibits stable patterns (fire burns cotton). The debate is about the *metaphysical ground* of this stability.
      *   *Claim 3 (Principle of Sufficient Reason - PSR):* Both agree nothing happens without a reason, but they differ on where that reason resides (will of God vs. nature of creatures).
      *   *Claim 4 (Epistemic Humility):* Both agree human reason cannot fully comprehend the divine essence or the ultimate modality of divine action.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Columns:* Issue, Occasionalist Formulation, Secondary Causationist Formulation, Shared Crux/Argument, Divergent Predictions.
      *   *Issue 1: The Metaphysics of Causation (Power vs. Regularity).*
          *   Occasionalist: Causation is purely habitual conjunction instituted by Will.
          *   Secondary: Causation is real efficacy derived from Essence.
          *   Crux: Is "necessity" compatible with divine freedom?
          *   Argument: The analysis of miracles.
          *   Predictions: Occasionalist predicts miracles are suspensions of habit; Secondary predicts miracles are interventions in a causal chain.
      *   *Issue 2: The Problem of Evil (Theodicy).*
          *   Occasionalist: God does everything, so evil is directly willed (harder theodicy, but protects unity).
          *   Secondary: Creatures do evil, God permits it (easier theodicy, but risks dualism or limited power).
          *   Crux: Does attributing evil to creatures protect God's goodness or limit His power?
          *   Argument: Moral responsibility and divine justice.
          *   Predictions: Occasionalist predicts a stronger emphasis on submission; Secondary predicts a stronger emphasis on justice/accountability.
      *   *Issue 3: Scientific Inquiry (optional but good).* Let's stick to the prompt's specific suggestions first (Power/Regularity and Evil). I should add a third one about "Divine Action" to round it out. Actually, the prompt specifically asked for "the cruxes -- I suspect one is whether 'cause' is a matter of power or of regularity, and another is whether the problem of evil pushes toward or away from occasionalism". I will focus on these two primarily, but maybe add a third about "The Nature of Divine Sustenance" to make the table robust. Let's stick to the two requested plus one on "Theological Coherence" to make it a standard 3-row table.

  5.  **Refining the Wording (Iterative Process):**
      *   *Check:* Is the Occasionalist wording faithful to Ghazālī? (Use terms like "Habit of God," "No necessary connection").
      *   *Check:* Is the Secondary Causationist wording faithful to Averroes/Aquinas tradition? (Use terms like "Instrumental cause," "Ontological dependence").
      *   *Check:* Is the "Shared Argument" truly neutral? It needs to be an argument both accept as *relevant*, even if they weigh it differently.
      *   *Check:* Are the predictions falsifiable or at least distinct?

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Agreement:* God is the Primary Cause. World is contingent.
      *   *Disagreement 1 (Causation):*
          *   Occ: Cause = Temporal precedence + Constant Conjunction.
          *   Sec: Cause = Ontological grounding + Efficacy.
          *   Crux: Does real efficacy limit God?
          *   Evidence: Miracle of Ibrahim (fire not burning).
          *   Pred: Occ says fire lost its 'habit'; Sec says God suspended the 'nature'.
      *   *Disagreement 2 (Evil):*
