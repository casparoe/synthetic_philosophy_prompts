  2.  **Deconstruct the Two Accounts:**
      *   **Constitutive Account:** Role reasons come from the *definition* or *telos* of the role itself within a form of life (*li*). "What is a father?" determines the duty. Internal criticism only (inconsistency with role's point). Potentially rigid, structural, focused on ideal types.
      *   **Historical Account:** Role reasons come from *transactional history*. "What did this father do for this son?" determines the duty. Debt-based. Potentially flexible, empirical, focused on particular relationships.

  3.  **Analyze the Five Pressure Points:**

      *   **1. Role Fission:** (Father + Teacher vs. Elder Brother + Dependent).
          *   *Constitutive:* Needs to compose norms. Risk of conflict unless there's a meta-norm (e.g., father > teacher). If meta-norm isn't role-relative, it breaks the account's closure.
          *   *Historical:* Debts aggregate or cancel? If brother raised sibling, debt exists. If now dependent, new debt incurred? Netting out seems more natural here.
          *   *Plausibility:* Historical handles the particularity better; Constitutive risks rigidity or needing external arbitration.

      *   **2. The Empty Role:** (Abandoning father returns).
          *   *Constitutive:* He is still a father. Role occupancy dictates duty. Hard to explain why the son's duty is diminished without betraying the role's norm.
          *   *Historical:* No care given = no debt incurred. Explains diminished duty easily. But struggles with the "something is owed" intuition (perhaps based on status alone).
          *   *Plausibility:* Historical explains the *diminution* better. Constitutive explains the *residual* status better. Most plausible verdict is mixed: status matters, but history modulates weight. Historical account captures the modulation better.

      *   **3. The Outsider:** (Child in the well).
          *   *Constitutive:* No role = no reason? Needs extension thesis (all humans are potential role partners?). Risks losing distinctiveness if it becomes universal principle.
          *   *Historical:* No history = no debt. Definitely needs extension thesis (compassion as root).
          *   *Plausibility:* Both struggle equally. Both need a supplementary principle (e.g., *ren* as prior to *li*). Neither wins here, but Historical is more honest about the lack of specific debt.

      *   **4. Novelty and Corruption:** (New roles, corrupt roles).
          *   *Constitutive:* Struggles with novelty (no established *li*). Struggles with corruption (internal criticism only allows "you're doing the role wrong," not "the role is wrong"). Structurally conservative.
          *   *Historical:* New roles = new transactions. Corrupt roles = if the "giving" is harmful, does it incur debt? Maybe negative debt? Allows condemnation based on harm/cost.
          *   *Plausibility:* Historical has better resources for criticism. Constitutive is too conservative.

      *   **5. Directionality:** (Parent -> Child vs. Child -> Parent).
          *   *Constitutive:* Brute fact of role content. Father owes X, Son owes Y. No deep explanation other than definition.
          *   *Historical:* Explains asymmetry naturally via history of care (parents gave life/care, children receive).
          *   *Plausibility:* Historical wins on explanation. Constitutive just stipulates.

