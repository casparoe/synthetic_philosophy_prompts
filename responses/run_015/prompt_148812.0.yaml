answer: |-
  ### Disambiguating 'Arbitrariness' in Conventions

  The sentence "conventions are arbitrary" is indeed doing excessive work in your reading group. It functions as a conversation-stopper because it conflates a technical condition of *origin* with a substantive claim about *normative force* and *stability*. Below is a menu of distinct theses that the claim might express, structured according to the dimensions you proposed.

  #### Table of Readings

  | Reading | What is Arbitrary | Sense of 'Arbitrary' | Scope | Verdict | Supports Move 1? (No Criticism) | Supports Move 2? (Dissolution) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Lewisian Selection** | The fact that *this* regularity was selected over an alternative. | Substitutable by an alternative that would have done as well *ex ante*. | Pure coordination cases only. | **Substantive.** (Core Lewisian claim). | **No.** (Selection arbitrariness does not entail consequence inertness). | **No.** (Historical selection is fixed; does not imply current fragility). |
  | **2. Normative Inertness** | The content of the regularity. | Morally inert; unsupported by independent moral reason. | All conventions whatsoever. | **False.** (Conventions often have distributive consequences). | **Yes.** (This is the premise required for the move). | **No.** (Moral status does not dictate causal stability). |
  | **3. Motivational Structure** | Each agent's reason for complying. | Unsupported by independent *pragmatic* reason (conditional on others). | All conventions (pure and impure). | **Substantive.** (Captures the interdependence of reasons). | **No.** (Conditional reasons can still generate rigid obligations). | **Yes.** (If expectations vanish, reasons vanish). |
  | **4. Volitional Control** | The regularity's susceptibility to deliberate replacement. | 'Up to us'; capable of being willed otherwise by the group. | Decreed or explicit conventions. | **Substantive but Qualified.** (Ignores path dependence). | **No.** (Ability to change does not negate current harm). | **Yes.** (Implies we could change it if we expected to). |
  | **5. Epistemic Grounding** | The causal history of the regularity. | Capricious or unchosen; lacking a functional explanation. | Gradual/accrued conventions. | **False.** (Most conventions have functional histories). | **Yes.** (If accidental, why criticise?). | **No.** (Accidental things can become entrenched). |

  ---

  #### Discussion of the Two Moves

  **Move 1: The Immunity to Moral Criticism**
  The argument here relies on a slide from **Reading 1** (Selection Arbitrariness) to **Reading 2** (Normative Inertness). The speaker argues that because we *could* have coordinated on a different rule (Selection), the current rule is morally weightless (Inertness). This is a non sequitur.

  Even if the *selection* of a convention was arbitrary in the Lewisian sense (e.g., we could have driven on the left or the right), the *consequences* of that selection are rarely arbitrary once the convention is established. If a convention distributes burdens unfairly (e.g., subgroup A always yields to subgroup B), the fact that a *different* convention could have been chosen initially does not negate the injustice of the *current* arrangement. The arbitrariness applies to the *label* or the *form* of the solution at the moment of origin, not to the *effects* of the solution in practice. To support Move 1, one must assume Reading 2, but Reading 2 is straightforwardly false: conventions create vested interests and structural inequalities. Therefore, Move 1 is unsupported by a rigorous analysis of arbitrariness; it relies on a category error between the *origin* of the norm and its *operation*.

  **Move 2: The Expectation-Shift Test**
  This move relies on **Reading 3** (Motivational Structure) or **Reading 4** (Volitional Control). The claim is that if a regularity is held in place *only* by expectations, then shifting those expectations should dissolve the regularity. If it persists, it must be something else (e.g., a moral norm or coercion).

  This is theoretically plausible under Reading 3 but empirically fragile. Conventions often develop 'stickiness' through network effects, sunk costs, or cognitive habituation that outlasts the initial web of expectations. Furthermore, Margaret Gilbert's work on joint commitment suggests that conventions create obligations that are not reducible to personal expectations. If I expect you to stop expecting me to drive on the left, I may still feel bound by our prior joint commitment to do so. Consequently, a failure to dissolve upon a shift in expectations does not prove the regularity was never a convention; it may simply prove that conventions possess a normative inertia distinct from mere predictive expectation. Move 2 sets the bar for 'convention' too high by ignoring the transaction costs of switching equilibria.

  ---

  #### Discussion of the Probe Cases

  **Case (a): The Broken Microscope**
  *Description:* Everyone uses the left-hand microscope because the right-hand one is broken.
  *   **Lewisian Selection (Reading 1):** This is **not a convention**. There is no longer a coordination equilibrium where an alternative *could* serve. The right-hand option is strictly dominated. This is a routine or a habit forced by circumstance.
  *   **Normative Inertness (Reading 2):** It might still be called a 'lab convention' descriptively, but the arbitrariness is gone. The reason for using the left one is now independent of others' behaviour (it works; the other doesn't).
  *   **Verdict:** This case counts against Reading 1 if one insists it *is* a convention. However, it is better treated as a case where a convention has *collapsed* into a mere regularity due to environmental change. It shows that 'arbitrariness' (in the sense of substitutability) is a condition for the *maintenance* of a convention, not just its origin. If the alternative becomes unavailable, the arbitrariness vanishes, and with it, the strict Lewisian definition of convention.

  **Case (b): The Fire Exit Corridor**
  *Description:* Everyone keeps left, though the right is safer (fire exit).
  *   **Lewisian Selection (Reading 1):** This is an **impure coordination** case. The options are not perfectly substitutable (one is safer). However, if the coordination benefit (avoiding collision) outweighs the safety benefit of the alternative, it functions as a convention.
  *   **Normative Inertness (Reading 2):** The content is not morally inert; there is an independent reason to go right (safety).
  *   **Verdict:** This case challenges the binary nature of 'arbitrariness'. It suggests arbitrariness is a matter of degree. If the safety difference is mild, we may still call it a convention, but the 'arbitrariness' is compromised. This reading suggests that Move 1 (no criticism) is even weaker here: if there is an independent reason to go right (safety), criticising the left-walking convention is perfectly valid, even if it is 'conventional'. The existence of an independent payoff difference undermines the claim that 'some other regularity would have done the job just as well'.

  ---

  #### Discussion of Your Proposed Partition

  You propose partitioning arbitrariness into **Content**, **Selection**, and **Revisability**. This cuts at the joints, provided you address your worry regarding temporal conflation.

  1.  **Content-Arbitrariness:** This corresponds to Reading 2 (Normative Inertness). As established, this is usually false. The content often matters deeply once implemented.
  2.  **Selection-Arbitrariness:** This corresponds to Reading 1 (Lewisian). This is historical. It asks: "At time *t0*, was there an equally viable alternative?"
  3.  **Revisability:** This corresponds to Reading 4 (Volitional). This is forward-looking. It asks: "At time *t1*, can we switch to an alternative?"

  **The Verdict on Conflation:**
  Your worry is well-founded. There is a frequent slippage between **Selection-Arbitrariness** (we could have started elsewhere) and **Revisability** (we can move elsewhere now). Path dependence means that a regularity can be arbitrary in *selection* but non-arbitrary in *revisability*.

  For example, the QWERTY keyboard layout was arguably arbitrary in selection (other layouts were viable). However, it is not arbitrary in revisability (switching costs are now prohibitive). If your reading group conflates these, they will argue that because QWERTY was arbitrary in selection, we can easily switch now (false), or that because we cannot easily switch now, it must not have been arbitrary in selection (also false).

  To make your partition robust, you must explicitly index the claims to time.
  *   *Selection-Arbitrariness* is a claim about the **genesis** of the norm.
  *   *Revisability* is a claim about the **dynamics** of the norm.

  A convention can be arbitrary in genesis but rigid in persistence. Acknowledging this breaks the logic of both moves in your reading group. Move 1 fails because selection-arbitrariness does not negate current harm. Move 2 fails because low revisability (due to entrenchment) does not negate conventional status. Your partition is a strong tool for disentangling this, provided you keep the temporal dimensions distinct.
