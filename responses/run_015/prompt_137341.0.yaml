prompt: |-
  Last night my friend Dave and I got into a three hour argument about a vote I have coming up, went nowhere, and I honestly think hes wrong but can't put my finger on why, so I need something written down.

  I'm one of five members of the Ashfield Plan Commission. Small town, about 2,400 people, forty minutes from a metro area where a two-bedroom rents for $2,100. On the 14th we vote on "Fernbrook": 260 homes, roughly 780 more people, which would grow the town by a third over six years. The developer is a regional builder, not a hedge fund, for whatever that's worth, and has offered to fund a school addition and to widen Route 9 at the intersection. Our own traffic consultant says that even with the widening, average commute times for current residents go up by about six minutes each way, and the elementary school goes from 310 kids to around 500 for two years before the addition opens.

  Then there's the part that's actually making my head hurt. A guy named Reuben Kerrigan, who's lived here his whole life, sent the commission a three page letter saying that if we approve Fernbrook on the grounds that 780 lives somewhat worse than ours are still worth having, we are committing the repugnant conclusion, and he says he'll read the whole thing into the public record at the meeting. Dave's position is basically that Kerrigan is right and that it's a reductio: once you admit that adding enough slightly-worse-off lives beats a smaller number of better-off ones, you've signed up for a town of ten million people each living a life barely worth living, nobody actually believes that's better, so the whole total-wellbeing style of reasoning the planning staff used in their report has to go. He says the only honest thing is to think about average wellbeing for the people who are actually here.

  What I keep saying to Dave, and can't quite make stick: the repugnant conclusion is a case where nobody is made worse off, you're just choosing between different sets of people, and this isn't that. People here are definately bearing real costs — six minutes each way, two years of crowded schools, the field behind the elementary school that the town uses for soccer. So it's not a pure population question at all, it's a question about who pays and who gains. But then Dave says fine, make the developer compensate until no current resident is worse off — full mitigation, bigger school, whatever it costs — and then approve, because then it really is pure addition and we're back to total wellbeing. And I think that's exactly backwards: if we compensate everyone so that no one is worse off, we've turned it into the pure different-people case, which is the case where I'm most worried about the repugnant conclusion, not the case where I'm least worried. Leaving some of the cost on current residents at least means somebody's actual interests are sitting on the other side of the scale. I might be confused about this and I want the memo to be honest if I am.

  One more wrinkle. Our chair, Enid, has floated what she calls "the Ashfield line": a standing rule that new residents may be added only if their expected quality of life is at least as good as the current average quality of life in town, so we'd take people who'd be doing at least as well as we are and nobody who'd be doing worse. I pointed out that by that rule we could never take in anyone fleeing a worse situation, which seems nuts, and she said that's not a bug, that's what a town owes its own. I don't know what to think about that either.

  Can you draft the two page findings memo I'm going to circulate to the other four members before Monday's meeting? It needs a bottom line — approve, deny, or approve with conditions, and if conditions, what has to be in them and by when. It needs to answer Kerrigan by name in a way that doesn't make him look stupid, because he isn't and he'll be in the room. It needs to say something real about Enid's Ashfield line. And it needs to give Dave's full-compensation idea the strongest version of itself before explaining why I'm not going with it, in case I'm the one who's wrong. It's public record, so nothing that would embarrass me if the local paper lifted a paragraph out of it.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of the Ashfield Plan Commission (one of five).
      *   **Task:** Draft a two-page findings memo to circulate to the other four members before Monday's meeting regarding the "Fernbrook" development proposal.
      *   **Context:** Small town (2,400 people), 40 mins from metro (high rent area). Proposal: 260 homes, +780 people (33% growth over 6 years).
      *   **Key Issues:**
          *   Traffic: +6 mins commute each way for current residents (even with widening).
          *   Schools: Elementary goes from 310 to 500 kids for 2 years before addition opens.
          *   Loss of amenity: Soccer field behind elementary school.
          *   Developer: Regional builder (not hedge fund), offering school addition funding and road widening.
      *   **The Philosophical Conflict (The "Head Hurt" Part):**
          *   *Reuben Kerrigan:* Argues approving based on "total wellbeing" leads to the "Repugnant Conclusion" (Parfit). Claims adding many slightly-better-off lives shouldn't trump fewer very-good lives.
          *   *Dave (Friend/Interlocutor):* Argues Kerrigan is right. Says we should focus on *average* wellbeing of current residents. Suggests full compensation (mitigation) makes it a "pure addition" case, which he thinks justifies approval under total wellbeing.
          *   *User (Me):* Thinks Dave is backwards. If you fully compensate, you erase the harm to current residents, making it a pure "different people" case (where the Repugnant Conclusion applies). Keeping some cost on residents ensures their interests weigh against the new benefits. Also worries about Kerrigan's argument but thinks it doesn't apply directly because current residents *are* made worse off.
          *   *Enid (Chair):* Proposed "The Ashfield Line": New residents must have expected QoL $\ge$ current average. User thinks this excludes refugees/disadvantaged people. Enid says that's a feature (obligation to current residents).
      *   **Requirements:**
          *   Bottom line: Approve, Deny, or Approve with Conditions (specify what/when).
          *   Address Kerrigan by name respectfully (he's intelligent, will be in the room).
          *   Address Enid's "Ashfield Line" seriously.
          *   Steelman Dave's "full compensation" argument before rejecting it.
          *   Tone: Professional, public record safe, philosophical but practical, honest about uncertainty.
          *   Length: Approx. two pages.

  2.  **Determine the Bottom Line:**

      *   *Option A (Deny):* Safe for current residents, avoids the philosophical trap, but ignores housing crisis context and potential tax base growth. Might look NIMBY.
      *   *Option B (Approve as is):* Ignores the 6-minute commute and school crowding. Politically risky.
      *   *Option C (Approve with Conditions):* Best middle ground. Acknowledges growth is good but mitigates harm *without* achieving perfect compensation (avoiding Dave's trap).
      *   *Decision:* **Approve with Conditions.**
      *   *Conditions:* Need to address the school crowding (phasing?) and the traffic (timing of widening). Need to ensure the "Ashfield Line" isn't violated in spirit (affordability?) without being exclusionary.
      *   *Refinement:* The prompt asks for specific conditions and deadlines.
          *   Condition 1: School addition must be operational *before* occupancy reaches a certain threshold (not just "funded").
          *   Condition 2: Road widening concurrent with phase 1, not phase 3.
          *   Condition 3: Affordability set-aside (addresses Enid's QoL concern without excluding the disadvantaged).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose. Acknowledge the weight of the decision (33% growth).
      *   **The Kerrigan/Parfit Argument:** Need to distinguish between *Non-Identity Problem/Repugnant Conclusion* and *Harms to Existing People*.
          *   *Point:* Kerrigan is right about the abstract principle, but this isn't that case. Here, existing people *lose* something (time, space). It's not just "adding lives," it's "adding lives + subtracting convenience."
          *   *Respect:* Acknowledge his philosophical rigor.
      *   **The Dave/Compensation Argument:** Steelman it.
          *   *Point:* If we make everyone whole, is it just pure gain?
          *   *Rebuttal:* Perfect compensation is impossible (social fabric, intangible costs). Also, as the user noted, if we make it costless for us, we lose the moral check on whether the growth is *actually* worth it. We need skin in the game.
      *   **The Enid/"Ashfield Line" Argument:**
          *   *Point:* Ensuring new residents thrive is good.
          *   *Critique:* Excluding those fleeing worse situations contradicts the town's character and legal obligations (fair housing).
          *   *Compromise:* Focus on *minimum* standards, not *average* matching.
      *   **Recommendation/Bottom Line:** Approve with specific conditions.
      *   **Tone Check:** Is it public-record safe? Yes, avoid personal attacks, focus on policy and reasoning. Avoid saying "Dave is wrong," say "The argument for full mitigation..."

  4.  **Refining the Philosophy (Crucial Step):**

      *   *User's Insight:* "Leaving some of the cost on current residents at least means somebody's actual interests are sitting on the other side of the scale." This is the core insight to preserve. It means we don't treat current residents as mere vessels for utility. Their sacrifice matters.
      *   *Kerrigan:* He worries about *total* wellbeing trumping *average*. The response is: We aren't maximizing total wellbeing blindly; we are weighing *marginal* harm to existing against *marginal* gain to newcomers.
      *   *Enid:* Her rule sounds like "climbing the ladder and pulling it up." The response should be: We want them to do well, but we can't gatekeep based on their past.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Commission.
      *   From: Me.
      *   Re: Fernbrook.
      *   We have a big choice. Kerrigan says don't do it because of philosophy. Dave says do it if we pay for everything. Enid says only rich new people.
      *   I say: Kerrigan is smart but this isn't that case because we lose stuff. Dave is smart but perfect payment is fake and removes our stake. Enid is protective but exclusionary.
      *   Vote: Yes, but make them fix the school first and the road now. And build some affordable units.

  6.  **Drafting - Iteration 2 (Polishing for Tone and Length):**
      *   Need to sound more formal. "Findings Memo."
      *   Expand on the philosophical points without getting bogged down in jargon. Use "aggregate welfare" instead of "total wellbeing."
      *   Ensure the "Bottom Line" is clear.
      *   Check the "Two Page" constraint. (Keep it tight).

  7.  **Addressing Specific Constraints:**
      *   *Answer Kerrigan by name:* "Mr. Kerrigan's intervention..."
      *   *Answer Enid:* "Chair Enid's proposed 'Ashfield Line'..."
      *   *Answer Dave (Compensation):* "The argument for full mitigation..."
      *   *Bottom Line:* Approve with Conditions.
      *   *Public Record:* No emotional outbursts.

  8.  **Final Review against User's "Head Hurt":**
      *   Did I capture the nuance that full compensation makes it a "pure addition" case which is *more* vulnerable to the Repugnant Conclusion? Yes, this is a key insight. If current residents bear no cost, we are just counting heads. If they bear cost, we are weighing specific harms.
      *   Did I handle the school traffic issue? Yes, in conditions.

  9.  **Final Polish:** Check word count and flow. Ensure the distinction between "average wellbeing" (Dave/Enid) and "weighted harm/benefit" (User) is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm lecturing the commission on philosophy. It needs to be a planning memo that *uses* philosophy to justify planning decisions. The philosophy serves the policy.

  *(Refining the "Dave" section)*: The user's insight is that if we compensate fully, we remove the "check" of current resident pain. I need to articulate that clearly. If the town feels no pain, we might approve *anything* that adds population, leading to the density/quality issues Kerrigan fears. Shared burden ensures sustainable growth.

  *(Refining the "Enid" section)*: Enid's rule is legally risky (Fair Housing Act). I should hint at that without being litigious. Focus on the moral aspect: "A town that only accepts those already doing well fails the test of community."

  *(Finalizing Conditions)*:
