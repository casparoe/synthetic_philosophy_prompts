          3.  *Residue:* Reader infers Z from historical context Stevens lacks.
      *   *Grice's Limit:* Grice talks about *communication*. Literature involves *representation* of communication. We need a "Double Voicing" model (Bakhtin might be useful mentally, but stick to Grice as requested). We effectively have two Gricean exchanges happening simultaneously: Stevens-to-Reader (fictional) and Ishiguro-to-Reader (actual).

  3.  **Scene-by-Scene Gricean Analysis:**
