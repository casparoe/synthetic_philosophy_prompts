  6.  **Practical Advice for the Novelist:**
      *   *What to Steal:* The "Cumulative Calculability." Don't rely on one lie. Rely on the pattern of evasions. The "Professional Register" as a shield.
      *   *What Not to Steal:* Stevens works because his code (Butlering) is rigid. If your estate manager is more chaotic, the "dignity" shield won't hold. The historical stakes (Nazism) do heavy lifting for the "Residue." You need equivalent external stakes.
      *   *The Beta Reader Split:* This is the sweet spot. If Grice works, the reader calculates the truth. If it's too subtle, they think he's sincere. If too obvious, they think he's ironic. You need to tune the *Maxim of Quality* violations.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, peer-to-peer, analytical, no fluff.
      *   *Structure:*
