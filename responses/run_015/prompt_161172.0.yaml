answer: |-
  Here is the consistency check you asked for. I have ranked the tensions by how likely they are to get you cornered in the first five minutes of Q&A.

  ### 1. The Critical Contradiction: (4) vs. (1) & (5)
  **Severity:** Fatal.
  **The Conflict:** You cannot consistently hold that "thick qualia" are incoherent (1) and the explanatory gap is purely conceptual/epistemic (5), while simultaneously insisting Mary learns a **new fact** (4) that is not merely a new concept or mode of presentation.
  **Why it's a hole:** In the literature, "New Fact" is the shibboleth for Property Dualism. If Mary learns a fact that could not be deduced from the complete physical truth, then the physical truth was not complete. That is the definition of non-physical properties. The Chalmers-ish person will claim you immediately: "Finally, a physicalist who admits the Knowledge Argument works." The Illusionist will attack you for reifying the "fact" of phenomenality which (1) claims is incoherent.
  **What to give up:** You must soften (4).
  **The Cost:** You lose the rhetorical punch of "Mary learns something *real*."
  **The Fix:** Change (4) to align with (5). Mary gains a new **propositional knowledge under a phenomenal mode of presentation**, but the *fact* known is identical to a physical fact. (The "Hesperus/Phosphorus" model). If you insist it is a *new fact* (new truth conditions), you are a dualist, regardless of (1).

  ### 2. The Metaphysical/Ethical Clash: (6) vs. (3)
  **Severity:** High.
  **The Conflict:** (3) is Strong Representationalism: Phenomenality *just is* representational content. (6) relies on the conceivability of a functional duplicate without feeling (a zombie) to make a moral point.
  **Why it's a hole:** If (3) is true, and content is determined by functional/causal role (as representationalists usually hold), then a functional duplicate *necessarily* has the same content and therefore the same phenomenality. The zombie scenario in (6) is metaphysically impossible on your own view. Basing your moral argument on an impossible counterfactual weakens it. The Illusionist will ask: "If function determines content and content is phenomenality, why does the 'feeling' do extra work?"
  **What to give up:** The idea that the zombie is a coherent counterfactual *given your metaphysics*.
  **The Cost:** You can't use the zombie intuition pump to prove the moral point.
  **The Fix:** Reframe (6). Argue that because phenomenality *is* content (per 3), and content is what guides behavior/value, the "feeling" isn't an extra ingredient, but the *first-person access* to that content is what grounds the moral claim. Or, admit (3) makes zombies impossible, so (6) is a claim about the *actual* world only.

  ### 3. The Indeterminacy Problem: (7) vs. (3)
  **Severity:** Medium.
  **The Conflict:** (3) says phenomenality is content. (7) says in gradual inversion/simple systems, whether phenomenality changed has **no truth value**.
  **Why it's a hole:** Representational content is usually determinate based on causal history and functional role. If the functional organization is preserved (as you say in 7), the content is preserved. If content is preserved, phenomenality is preserved. Claiming indeterminacy suggests phenomenality floats free of content, or that content itself is indeterminate in a way that undermines (3).
  **What to give up:** The claim that content is fully determinate, or the claim that phenomenality *strictly* supervenes on content in vague cases.
  **The Cost:** You introduce vagueness into your core metaphysical equation.
  **The Fix:** Specify that *content* is also indeterminate in the gradual/bee cases. If content is vague, phenomenality is vague, and (3) holds.

  ### False Alarms (Tensions that Dissolve)

  *   **(1) vs. (2):** This looks like a clash, but it is definitional. You are rejecting the *theoretical construct* of qualia (intrinsic, non-relational) while accepting the *phenomenon* (experience). This is a standard "Quality Space" or "Representationalist" move. **Advice:** Be prepared to define "qualia" explicitly in your handout as "intrinsic non-relational properties" so no one accuses you of contradicting yourself.
  *   **(8) vs. (6):** Fallible introspection (8) does not contradict the moral weight of feeling (6). It just means the moral weight can exist without the subject knowing it. This is counter-intuitive but logically consistent.

  ### The Single Revision

  **Revise (4).**

  This is the only change that cleans up the most risk. Currently, (4) is the open door through which the Chalmers person will walk to claim you, and through which the Illusionist will shoot to claim you are confused.

  **Current (4):** "On Mary: she gains a new fact... The 'she only acquires a recognitional concept' reply strikes me as a dodge."

  **Proposed Revision:**
  > "(4) On Mary: she gains new **propositional knowledge**, but not a new **ontological fact**. She learns a physical truth under a phenomenal mode of presentation. The 'mere concept' reply isn't a dodge if we acknowledge that phenomenal concepts are physically constituted but cognitively distinct. The gap is in the grasping, not the world."

  **Why this works:**
  1.  **Protects against Chalmers:** You deny the non-physical fact.
  2.  **Protects against Illusionist:** You affirm the cognitive significance of the experience (it's not *just* an ability, it's knowledge).
  3.  **Aligns with (5):** It makes (4) and (5) mutually supportive rather than contradictory.
  4.  **Preserves (2):** You still accommodate the datum that she learns *something*.

  If you make this change, your position stabilizes as a **Phenomenal Concept Physicalist with Representationalist leanings**. This is a distinct, defensible camp that is neither Chalmers-Dualism nor Dennett-Illusionism. Keep (1), (2), (3), (5), (6), (7), and (8) as they are (with the minor clarifications noted above), but fix (4) or it will eat the rest of your argument.
