answer: |-
  You have put your finger on the exact tension that Lakatos was trying to resolve, and you are describing what he (and Popper before him) would classify as a **degenerating problemshift** driven by **ad hoc adjustments**.

  While there isn't a single catchy phrase like "The Lakatos Loop," there are specific technical terms for the components of the maneuver you described. Here is the breakdown of the terminology and the distinction you are looking for.

  ### 1. The Core Term: *Ad Hoc* Hypothesis
  Lakatos distinguishes between legitimate auxiliary hypotheses (which expand the theory) and *ad hoc* ones (which merely save it). He actually defines three levels of *ad hoc*-ness:

  *   **Ad hoc₁:** The new hypothesis explains the anomaly but has **no independent testability**. (e.g., "The effect is masked by invisible demons.")
  *   **Ad hoc₂:** The new hypothesis is testable, but **no new facts are discovered** as a result of it. It only explains the old anomaly.
  *   **Ad hoc₃:** The new hypothesis is testable *and* leads to the discovery of new facts. (Lakatos argues this is actually **progressive**, not ad hoc in the negative sense.)

  The pattern you described—patching the theory to explain the failure and then claiming that patch as a "prediction"—is typically an **Ad hoc₂** move. It creates the *appearance* of empirical content without actually risking the theory on new data.

  ### 2. The Strategic Term: *Conventionalist Stratagem*
  This term comes from Karl Popper (whom Lakatos was refining). A **conventionalist stratagem** is a logical maneuver used to protect a theory from falsification by redefining terms, adding exceptions, or questioning the reliability of the data, without adding any new empirical content.

  When proponents claim the patch was a "prediction" after the fact, they are employing a conventionalist stratagem to maintain the status of the Hard Core.

  ### 3. The Epistemic Distinction: *Accommodation vs. Prediction*
  This is the philosophical distinction you sensed was missing.
  *   **Prediction:** The theory states a fact *before* the fact is known.
  *   **Accommodation:** The theory is adjusted *after* the fact is known to fit the data.

  Your scenario describes **accommodation masquerading as prediction**. In modern philosophy of science (specifically in the work of Alan Musgrave and John Worrall, who refined Lakatos's ideas), this is discussed under the banner of **Novelty**.
  *   **Heuristic Novelty:** The theory was constructed before the evidence was found.
  *   **Use Novelty:** The evidence was not *used* in the construction of the theory.

  If the "prediction" is generated *because* the anomaly was already known, it lacks **use novelty**. Lakatos insists that for a research programme to be **progressive**, the changes in the protective belt must yield **excess empirical content**—meaning it must predict something *new*, not just successfully retrodict something *old*.

  ### 4. The Critical Rationalist Term: *Immunization*
  Hans Albert, a critical rationalist contemporary of Popper, called this **immunization**. It is the process of making a theory immune to criticism by adding caveats that render it unfalsifiable in practice, even if it remains falsifiable in principle. By saying "the theory only applies when background noise is absent," and then defining any failure as "background noise," the theory is immunized against refutation.

  ### Is this just degenerating research in disguise?
  **Yes.** According to Lakatos's own criteria, this is the textbook definition of a **degenerating problemshift**.

  Lakatos explicitly warned that research programmes can sustain themselves for a long time in a degenerating state. The proponents will claim they are making progress (theoretical progress) because they are solving puzzles and refining the math, but if they are not producing **novel empirical predictions**, the programme is degenerating.

  The "loop" you identified is the sociological mechanism that allows a degenerating programme to survive. The scientists involved convince themselves (and others) that explaining the anomaly *is* a success, effectively blurring the line between **saving the phenomenon** and **predicting the phenomenon**.

  ### Summary of Terms
  If you need to label this in a paper or discussion, the most accurate phrasing would be:

  > "The programme is engaging in **ad hoc adjustments** (specifically **ad hoc₂**) to **immunize** the hard core. By conflating **accommodation** with **prediction**, they are masking a **degenerating problemshift**."

  Lakatos's great insight was that we often can't tell *in the moment* if a move is progressive or degenerating. We often only realize a programme was degenerating in hindsight, once it becomes clear that all the "predictions" were just retrofitted accommodations of known data. You have correctly identified the mechanism that makes that hindsight necessary.
