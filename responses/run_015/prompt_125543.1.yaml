      *   *Revised Payoff:*
          *   Option A: Pin it on someone. They get -10. Others +1.
          *   Option B: No one takes it. Everyone gets 0.
          *   *Secret Individual Goal:* Each player has a hidden objective to protect their specific metric (e.g., Speed, Cost, Safety). This makes the exemptions feel motivated.

  6.  **Addressing the Limitations:**
