answer: |-
  Hey, this is a solid setup. Getting grad students to *feel* the pragmatic failure of greedy reductionism is way better than lecturing them on it. Here's a runable design for your 90-min session. I've baked the "explanatory eviction" concept right into the mechanics so they can't avoid it.

  # Activity: The Trust Circle Reduction Game

  **Target:** 10 Grad Students (3 groups of 3-4)
  **Time:** 90 Mins
  **Goal:** Demonstrate why greedy reductionism fails at generating normative guidance, even if the ontology holds up.

  ## Materials List
  You need to prep these beforehand. No tech required.

  1.  **Scenario Cards (3 identical):** Describe the "Trust Circle."
      *   *Text:* "A ritual where participants pair up. One is blindfolded, the other guides them through an obstacle course using only voice and a rope. Success depends on not letting go and speaking clearly when danger is near."
  2.  **Level Cards (4 decks):**
      *   **Level 1 (Neurochemical):** "Oxytocin release during touch," "Cortisol spike during fear," "Mirror neuron activation," "Vagal tone regulation."
      *   **Level 2 (Evolutionary):** "Reciprocal altruism," "Kin selection signals," "Group cohesion survival value," "Costly signaling of reliability."
      *   **Level 3 (Game-Theoretic):** "Iterated Prisoner's Dilemma," "Coordination Equilibrium," "Zero-sum vs Positive-sum framing," "Information asymmetry reduction."
      *   **Level 4 (Social-Normative):** "Don't let go of the rope," "Speak if you're scared," "Trust your partner," "Respect the blindfold."
  3.  **Worksheet Packets:** One per group. Two sections: "The Stack" and "The Advice."
  4.  **Timer:** Visible to everyone.
  5.  **Stakes:** A whiteboard tally for "Design Points." Winner picks next week's topic.

  ## Timeline (90 Mins)

  *   **00-10:** Intro & Concept Drop (Cranes vs. Greedy)
  *   **10-35:** Round 1 (Building the Stack & Identifying Residue)
  *   **35-60:** Round 2 (The Advice Wall)
  *   **60-75:** Group Presentations (Quick fire)
  *   **75-90:** Debrief & Eviction Mapping

  ## Rules & Setup

  **1. Group Assignment (5 mins)**
  Split into 3 groups.
  *   **Group A (The Cranes):** Must build a bottom-up explanation. Level 1 supports Level 2, which supports Level 3, etc. All levels are kept.
  *   **Group B & C (The Greedy Reductivists):** Must argue that Level 1 (Neuro) explains everything. Levels 2-4 are "folk psychology" and should be evicted. *However*, they must complete the task using only Level 1 vocabulary.

  **2. Round 1: The Stack (25 mins)**
  *   **Cranes:** Arrange cards 1→4. Draw arrows showing how lower levels *support* higher ones without replacing them.
  *   **Greedy:** Arrange cards. Put Level 1 at the bottom. Cross out 2-4.
  *   **The Kicker:** The Greedy groups must fill out an **"Explanatory Residue" log**. List every function the higher levels were doing that Level 1 *cannot* easily describe. (e.g., "Level 4 tells you *what to do*, Level 1 only tells you *what is happening*.")
  *   **Instructor Note:** Walk around. If Greedy groups try to keep Level 4 concepts disguised as Level 1, call them out. "Is 'Trust' really just 'Oxytocin'? Can you command oxytocin?"

  3.  **Round 2: The Advice Wall (25 mins)**
  *   **Task:** Write a 5-bullet instruction sheet for a **newcomer** joining the Trust Circle tomorrow.
  *   **Constraint:** You must use *only* the vocabulary of your bottom card.
  *   **Cranes:** Can use any level, but must show how the advice is grounded.
  *   **Greedy:** Must use *only* Neurochemical terms. No words like "trust," "danger," "partner," or "rule."
  *   **Scoring:** You get 1 Design Point for every bullet that is actually action-guiding. (Greedy groups will struggle to get points).

  4.  **Presentations (15 mins)**
  *   Each group reads their advice sheet.
  *   Class votes on which advice they'd actually follow if they were blindfolded.

  ## The Debrief (15 Mins)
  *This is where you land the plane. Don't skip this.*

  **1. Map the Failure (5 mins)**
  Ask the Greedy groups: "Where did you hit the wall?"
  They'll say: "We couldn't tell them what to *do*, only what their brain would *feel*."
  **Inject the term:** This is **Explanatory Eviction**. When you reduce the higher level away, you evict the normative force. The lower level describes the mechanism, but it leaves **Explanatory Residue**—the "oughts" and "goals" that the mechanism serves but doesn't contain.

  **2. Cranes vs. Skyhooks (5 mins)**
  *   **Cranes:** The Group A stack. Level 1 lifts Level 2, which lifts Level 3. No magic, just support. The higher levels are real patterns, not skyhooks.
  *   **Greedy Reduction:** Tried to build a crane without the upper structure. It stands ontologically (maybe), but it's useless pragmatically.
  *   **Point:** Dennett isn't saying higher levels are magic (skyhooks). He's saying they are *competence without comprehension* built up by cranes. Removing them destroys the competence.

  **3. The Honest Limit (5 mins)**
  Be careful here. This activity shows a **pragmatic** failure, not necessarily a **metaphysical** one.
  *   **What this proves:** Higher-level descriptions are indispensable for *guidance* and *prediction* in social contexts.
  *   **What this doesn't prove:** It doesn't prove social norms are metaphysically distinct substances. A hardline physicalist could say, "Sure, the advice is clumsy, but ultimately it's still just neurons."
  *   **Takeaway:** Science needs multiple levels of description not because reality is layered like a cake, but because our *interests* are layered. Greedy reductionism isn't always false, it's just often boring and useless.

  ## What Will Predictably Go Wrong (First Run)

  1.  **The Semantic Cheat:** Greedy groups will try to smuggle norms back in. They'll write: "Increase oxytocin to ensure cooperation." That's a cheat. "Ensure cooperation" is a Level 3/4 concept. Call them on it. Make them say "Stimulate pituitary gland." It sounds absurd, which is the point.
  2.  **Time Creep:** Round 1 discussions on "what counts as reduction" can eat 20 mins alone. Be a tyrant with the timer. Cut them off mid-sentence if needed.
  3.  **The Metaphysical Trap:** A student might argue, "But if we knew enough about neurons, we *could* give perfect advice."
      *   *Counter:* "Maybe. But you aren't that computer. For *human* agents, the eviction leaves a residue we can't bridge. Science is for us, not for Laplace's Demon."
  4.  **Group B/C Collusion:** Since both Greedy groups face the same wall, they might compare notes too early. Keep them separated during Round 2.

  ## Materials Prep Cheat-Sheet
  *If you're rushing, just write these on index cards.*

  *   **N1:** Oxytocin / Vasopressin release
  *   **N2:** Amygdala fear response regulation
  *   **E1:** Reciprocal Altruism mechanism
  *   **E2:** Signaling reliability to group
  *   **G1:** Coordination Game (Stag Hunt)
  *   **G2:** Information asymmetry reduction
  *   **S1:** "Don't let go of the rope"
  *   **S2:** "Call out obstacles immediately"

  ## Design Points Tally
  *   **Cranes:** Likely get 5/5 points. Advice is usable.
  *   **Greedy:** Likely get 1/5 points. Advice is technically "true" but actionless.
  *   **Winner:** The Cranes. (Rigged, but pedagogically necessary). They pick the next topic.

  ---

  *One last thing:* Don't worry if the typos in your handout are there, keeps it feeling like a workshop draft. Just make sure the card text is legible. Good luck, hope the residue sticks.
