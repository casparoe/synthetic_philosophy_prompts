prompt: |-
  hey, i need a classroom activity for a philosophy of science workshop, about 10 grad students, one 90-minit session. the domain is cranes vs skyhooks and greedy reductionism, but i want them to feel the force of greedy reduction, not just recite Dennett's labels. can you design a runnable game?

  inject this niche framing: "explanatory eviction" — when a lower-level story doesn't just replace a higher-level one but actively strips away its predictive and normative work, leaving "explanatory residue" that the reduction can't carry.

  setup: split into groups of 3-4. each gets cards at four levels (neurochemical, evolutionary, game-theoretic, social-normative) plus a scenario card describing a "trust-circle" ritual where particpants guide each other blindfolded. round 1: build either a crane stack (levels build bottom-up) or a greedy reduction (the bottom card claims the others are redundant, but the group must write down the "residue" — the leftover guidance the top cards still provide). round 2: use your stack to write actual advice for a newcomer joining the circle. the greedy-reduction groups should hit a wall: they can talk brain states or selection pressures but can't generate usable norms.

  stakes: no cash. groups earn "design points"; the group with the most workable advice picks next week's discussion topic.

  include clear rules, materials list, timeline, a 15-min debrief that maps each round onto cranes/greedy reduction/explanatory eviction, and an honest note on what the activity can't reproduce — probably the metaphysical claim that higher-level properties are literally unreal, since here they just fail pragmatically. also tell me what will predictably go wrong the first time i run it.

  write casually, a typo or two is fine. don't ask for citations, reading lists, or outside sources — it should work for someone with no web access.
