answer: |-
  ### Brainstorming: The Minimal Rule-Set

  To generate the tension between "collapse" and "adaptive dissolution" without lecture, the mechanics must enforce a zero-sum trade-off between **institutional persistence** and **relational continuity**.
  1.  **Resource Scarcity:** A shared resource pool (e.g., "Surplus") must shrink unexpectedly, making it mathematically impossible to sustain all game elements.
  2.  **Divergent Victory Conditions:** One group wins only if formal structures remain standing; the other wins only if interpersonal connections survive. They cannot both win fully.
  3.  **Voluntary Sacrifice:** The "Stewards" of institutions must have the agency to *dismantle* their own structures to release resources to the network. If they do, they personally "lose" (institution falls), but the group "survives" (network holds). This mirrors *adaptive dissolution*. If they cling to structures until the system breaks, everyone loses (*collapse*).
  4.  **Information Asymmetry:** Players must not know the others' victory conditions until the end. This prevents easy utilitarian calculus and forces them to act on their hidden normative commitments.

  ---

  ### Activity Design: "The Weight of Stone"

  **Target:** 14 Upper-Level Undergraduates
  **Time:** 75 Minutes
  **Setting:** Seminar Room (tables arranged in one large cluster)
  **Materials:** Token counters (50 "Grain" tokens), Role Cards (sealed envelopes), Whiteboard, 4 "Monument" cards, 8 "Kinship" tokens per maintainer.

  #### 1. Roles & Hidden Victory Conditions (Distributed in Sealed Envelopes)

  *   **Institutional Stewards (4 Students):**
      *   *Public Role:* You manage the Central Granary and the Temple (The Monuments). You decide how much Grain is allocated to public works.
      *   *Hidden Victory:* You win **only if** at least one Monument Card remains active at the end of the game.
      *   *Special Power:* You may voluntarily **Decommission** a Monument at any time. This stops its cost but releases 5 Grain back to the pool immediately.

  *   **Network Maintainers (8 Students):**
      *   *Public Role:* You represent household clusters. You need Grain to feed your families and maintain trade links.
      *   *Hidden Victory:* You win **only if** you hold at least 2 Kinship Tokens at the end of the game. (Each token costs 1 Grain/round to maintain).
      *   *Special Power:* You can pool Grain with other Maintainers to save each other, but you cannot force Stewards to give Grain.

  *   **Chroniclers (2 Students):**
      *   *Public Role:* You observe the resource flow and write the "Historical Record" of what happened.
      *   *Hidden Victory:*
          *   Chronicler A holds the **"Continuity Lens"**: You win if the final report defines the outcome as "Successful Transformation."
          *   Chronicler B holds the **"Stability Lens"**: You win if the final report defines the outcome as "Systemic Collapse."
      *   *Constraint:* You cannot speak during decision rounds, only record numbers.

  #### 2. Rules & Scoring Scheme

  *   **The Pool:** A central bowl holds the "Grain" (Surplus).
  *   **Income:** At the start of each Round, the Facilitator adds Grain to the bowl.
  *   **Costs:**
      *   Each **Monument** costs 3 Grain/round to maintain. (Total Potential Cost: 12).
      *   Each **Maintainer** needs 1 Grain/round to keep their Kinship Tokens. (Total Potential Cost: 8).
      *   **Total System Cost:** 20 Grain/round.
  *   **The Stress:**
      *   Round 1 Income: 20 Grain (Sustainable).
      *   Round 2 Income: 14 Grain (Deficit of 6).
      *   Round 3 Income: 10 Grain (Deficit of 10).
  *   **Elimination:** If a Maintainer cannot pay 1 Grain, they lose 1 Kinship Token. If they reach 0 Tokens, they are "Dispersed" (out of the game). If a Monument is not paid, it is "Ruined" (card removed).
  *   **Winning:** Revealed only at the very end.

  #### 3. Phased Timeline (75 Minutes)

  **Phase 1: Setup & Secret Goals (10 mins)**
  *   Seat students. Hand out sealed envelopes. Give them 3 minutes to read silently. Emphasize: *Do not reveal your victory condition to anyone.*
  *   Place 4 Monument cards in the center. Give Maintainers 3 Kinship Tokens each.
  *   Facilitator says: "You are a society. Your goal is to survive. Begin."

  **Phase 2: Stability (Round 1) (10 mins)**
  *   Facilitator adds 20 Grain to the pool.
  *   Stewards and Maintainers negotiate allocation. (Expected outcome: Everyone paid. Smooth sailing.)
  *   Chroniclers record the distribution.

  **Phase 3: The Stress Event (5 mins)**
  *   Facilitator announces: "A drought strikes. External trade halts."
  *   Facilitator adds only 14 Grain to the pool.
  *   *Pressure:* The group must discuss cuts. Stewards want to keep Monuments (hidden goal). Maintainers need Grain for Tokens (hidden goal).
  *   *Mechanic Pressure:* There is not enough Grain. Someone must starve or decommission.

  **Phase 4: Crisis & Restructuring (Rounds 2 & 3) (25 mins)**
  *   **Round 2:** Negotiation intensifies. Stewards may choose to *Decommission* a Monument to release 5 Grain (special power). This helps the pool but hurts their hidden win condition.
  *   **Round 3:** Income drops to 10 Grain. Critical mass.
  *   *Observation:* Watch if Stewards cling to Monuments until the system crashes (Collapse) or sacrifice Monuments to save Maintainers (Adaptive Dissolution).
  *   Chroniclers take notes on *why* decisions were made, not just numbers.

  **Phase 5: The Revelation (10 mins)**
  *   Game ends.
  *   **Step 1:** Chroniclers present their headline ("Collapse" vs. "Transformation").
  *   **Step 2:** Reveal Hidden Victory Conditions.
  *   **Step 3:** Tally winners.
      *   *Scenario A:* Monuments stand, Maintainers dispersed. (Stewards win, Maintainers lose).
      *   *Scenario B:* Monuments ruined, Maintainers hold tokens. (Stewards lose, Maintainers win).
      *   *Scenario C:* Everything ruins. (Everyone loses).

  **Phase 6: Debrief (15 mins)**
  *   Facilitator-led discussion (see script below).

  #### 4. Debrief Script: Mapping Mechanics to Concept

  **Facilitator Opening:**
  "Look at the board. Chronicler A called this a 'Transformation.' Chronicler B called it a 'Collapse.' Both looked at the same data. Why the disagreement?"

  **Mapping the Tension (5 mins):**
  "Stewards, raise your hand if you lost. You likely feel the society failed because the Temple fell. Maintainers, raise your hand if you won. You feel the society succeeded because your families survived.
  This is the core philosophical conflict.
  *   **Collapse** is defined by the **Steward's metric**: The failure of formal institutions to persist.
  *   **Adaptive Dissolution** is defined by the **Maintainer's metric**: The intentional shedding of institutional weight to preserve social networks.
  If the Stewards refused to decommission the Temple, and everyone starved, that is *Collapse*. If the Stewards dismantled the Temple to feed the network, that is *Adaptive Dissolution*. The physical outcome (no Temple) is identical. The *normative judgment* depends on whose victory condition you prioritize."

  **Historical Mapping (5 mins):**
  "Let's map this to the cases you know:
  *   **Bronze Age:** If we view the Palace economies as the 'Stewards,' their disappearance looks like collapse. But if rural villages (Maintainers) continued trading pottery and grain without the Palace, that is adaptive dissolution.
  *   **Classic Maya:** The cities were abandoned (Monuments decommissioned). Did civilization end? Or did the population shift to dispersed networks that survived longer?
  *   **Easter Island:** Did the statue-building (Institution) drain the resources until everyone died (Collapse)? Or did groups stop building statues to focus on subsistence (Adaptive Dissolution), even if the 'culture' changed radically?
  The mechanics today showed you that 'Failure' is not an objective fact of the ruins; it is a judgment on whether institutions *should* have been saved at the cost of people."

  **The Intentionality Gap (5 mins):**
  "There is one thing the rules could not capture: **Intentionality.**
  In the game, you could choose to decommission. In history, we rarely have a memo saying 'We voted to abandon the temple.'
  As historians, we often mistake *adaptive dissolution* for *collapse* because we only see the ruins (the lost Steward goal), not the surviving networks (the won Maintainer goal).
  Your task as philosophers is to ask: When we label a society 'failed,' are we mourning the loss of human life, or the loss of bureaucracy? The simulation forces you to feel that distinction."

  #### 5. Prediction of Misfires & Corrections

  **Misfire 1: The Utilitarian Collapse**
  *   *Risk:* Students immediately share their hidden goals in Round 1, calculate the optimal outcome (sacrifice Monuments), and execute it coldly. This removes the tension.
  *   *Correction:* Enforce the "No Revealing Victory Conditions" rule strictly. If caught, that player's role is "corrupted" (they must act against their interest). Remind them: "In history, you don't know what your neighbor values most."

  **Misfire 2: Steward Dominance**
  *   *Risk:* The 4 Stewards control the Grain pool and hoard it for Monuments, ignoring the 8 Maintainers. The Maintainers feel powerless and disengage.
  *   *Correction:* As Facilitator, intervene in Round 2. "The Maintainers are threatening migration. If you lose more than 4 Maintainers, the Monument cost doubles due to labor shortage." This forces Stewards to negotiate rather than dictate.

  **Misfire 3: The "Everyone Loses" Trap**
  *   *Risk:* The group fails to negotiate quickly enough in Round 3, panic sets in, and all Grain is wasted. Everyone loses.
  *   *Correction:* Use the Debrief to highlight this as the true "Collapse" scenario. "When normative commitments conflict so sharply that no decision is made, the system fails. Adaptive dissolution requires *active choice* to let go. Indecision is collapse."

  **Misfire 4: Observers Dominating**
  *   *Risk:* Chroniclers start giving advice, breaking the simulation.
  *   *Correction:* Remind Chroniclers their power is *narrative*, not *executive*. "You are writing the history book, not running the government. Your influence comes after the fact."
