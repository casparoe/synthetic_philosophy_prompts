      *   **Problem:** Stalled on the *mechanics of the argument*. Specifically, what work the cosmology (the fourfold sequence) is doing.
      *   **User's Taxonomy:** Three readings: (i) Phase-in-a-process, (ii) No-subject, (iii) Standpoint-dissolution. Suspects they might overlap or be confused levels of analysis.
