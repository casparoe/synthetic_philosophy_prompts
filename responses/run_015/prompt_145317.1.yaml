  However, the universalism critique doesn't give carte blanche. Here's the specific disanalogy where the comparison breaks: bureaucratic role-obligation is owed to an abstract public, whereas gift-obligation is owed to a concrete known other. A state bureaucracy claims to manage resources for everyone, including strangers outside the network. Gift logic inherently excludes the stranger. When public resources are distributed via gift logic, the exclusion isn't just cultural; it's a failure of the specific promise of the modern state to treat citizens equally. So, it's not that Western norms are universally superior, but that importing gift logic into institutions designed for universal coverage creates a specific kind of structural failure—one where the "public" gets carved into private fiefdoms. The corruption isn't the gift itself; it's the mismatch between the resource's source (public) and the distribution logic (private). That's where the normative bite remains, regardless of cultural context.
