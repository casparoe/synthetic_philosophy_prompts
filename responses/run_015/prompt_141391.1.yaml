answer: |-
  The reason you are witnessing a stalemate rather than a convergence is that you are watching two different moral geometries collide, not merely two different estimates of the same landscape. It is tempting to dismiss the friction as verbal, a quarrel over how we define priority or badness, but that diagnosis is too shallow to explain the heat. If it were merely verbal, the parties could agree on the underlying facts and actions while reserving their terminology, yet they resist this because the disagreement is axiological. It is a claim about the structure of value itself. The symmetric total utilitarian sees value as a single cardinal scale where pleasure and pain are opposite signs on the same number line, implying that they are commensurable and can cancel each other out. The negative-leaning utilitarian sees value as asymmetric, often treating suffering as lexically prior or possessing a greater moral weight per unit than happiness. This is not a dispute about how much suffering exists, but about the topology of the moral universe. When they argue, they are not arguing about the data; they are arguing about the coordinate system used to plot the data.

  This brings us to the empirical question you raised regarding affective science. One might hope that neuroscience could settle this by revealing whether agony and enjoyment are truly opposite ends of a single bipolar dimension or distinct psychological kinds processed by different systems. However, even if science confirms that pain and pleasure arise from distinct neural substrates, it cannot bridge the is-ought gap to tell us how they should weigh against each other in a moral calculus. A symmetric utilitarian can concede that pain and pleasure are neurologically distinct yet maintain that they are morally commensurable based on a separate normative axiom. Conversely, a negative utilitarian can point to that distinctness as evidence that suffering is a unique moral emergency that cannot be offset by mere contentment. Therefore, while affective science can inform the debate by clarifying the nature of the experiences involved, it is unlikely to dissolve the philosophical core of the disagreement because the core is not about the mechanism of feeling but the authority of that feeling over moral decision-making.

  Your trusted source is partially right about the exchange-rate question, but his test risks smuggling in the very assumption that is under dispute. He suggests that the debate collapses into whether there is any finite number N of happiness units that would justify one unit of suffering. If you say no, you are a negative utilitarian; if you say yes, you are a symmetric utilitarian. This is a useful heuristic for sorting positions, but it presupposes that such a trade-off is conceptually coherent. For a hard negative utilitarian, suffering may be lexically prior, meaning it operates on a different order of value that cannot be traded off against happiness at any rate, much like you cannot trade a finite amount of money for a violation of fundamental rights in certain deontological frameworks. To ask for the exchange rate is to assume commensurability, which is precisely what the negative-leaning philosopher denies. So the test does not resolve the dispute; it merely forces each side to reveal their foundational axiom. It clarifies the disagreement rather than collapsing it.

  The reason the fight feels so intense despite near-term agreement is that the divergence becomes catastrophic in the long term, specifically in population ethics and existential risk. In the near term, reducing suffering usually correlates with increasing happiness, so both camps fund the same interventions. But when we look toward the future of humanity, space colonization, or artificial intelligence, the trajectories split. A symmetric total utilitarian might support creating vast numbers of new lives filled with mild contentment, even if it risks some suffering, because the aggregate sum of happiness outweighs the negatives. A negative utilitarian views this same scenario as a moral horror, where the creation of new sentient beings introduces unnecessary risk of suffering that cannot be justified by the added pleasure. The stakes are not just theoretical; they determine whether we should aim for a universe teeming with life or a universe carefully curated to minimize harm, even if that means fewer lives overall. The heat in the debate comes from the recognition that one side sees the other's long-term vision as potentially apocalyptic.

  As for what would count as progress, do not hold your breath for a formal result or a scientific finding that settles the matter. Progress in this domain is more likely to come from a shift in how the question is framed, moving from a search for the single true moral arithmetic to a discussion of moral risk and uncertainty. If we acknowledge that we cannot be certain whether value is symmetric or asymmetric, a precautionary principle might emerge. Given the severity of extreme suffering compared to the mildness of average happiness, one might argue that policy should prioritize suffering reduction simply because the downside risk of being wrong about symmetric utilitarianism is far greater than the upside risk of being wrong about negative utilitarianism. This does not prove one side right, but it offers a pragmatic overlapping consensus for action that respects the gravity of the negative-leaning intuition without requiring total agreement on axiology.

  Ultimately, you should tell your readers that no theoretical progress is coming that will satisfy both sides, because the disagreement is rooted in fundamental moral intuitions that are not subject to empirical falsification. The stalemate is a feature, not a bug, of a pluralistic moral landscape. The value of the debate lies not in its resolution but in the tension it maintains. The symmetric utilitarians prevent the negative-leaning camp from sliding into a nihilism that sees existence itself as a mistake, while the negative utilitarians prevent the symmetric camp from justifying immense suffering for the sake of abstract aggregate gains. The friction keeps both sides honest. Your column should not promise a verdict but rather illuminate why this specific fight matters more than most, precisely because it remains unresolved. It is a debate about the limits of compensation, about whether anything can ever make up for agony, and that is a question that science cannot answer and philosophy cannot settle, only clarify.
