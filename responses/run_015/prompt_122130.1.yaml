  Detective Inspector Grice sat across from Dr. Austin, a tenured philosopher of language, in the dim light of the interrogation room. The Dean was dead, poisoned by a cup of tea served during the faculty meeting. Only two people had accessed the pot: Dr. Austin and the Department Assistant.

  "Dr. Austin," Grice said, sliding a transcript across the table. "You admit the Dean is dead. You admit only you and the Assistant had access. Yet you deny pouring the poison."

  "I deny it on semantic grounds, Inspector," Austin replied, adjusting his cufflinks. "Your case rests on a conditional: 'If Austin didn't poison the tea, the Assistant did.' You are treating this as a simple inference. But you must distinguish the indicative from the counterfactual."

  Grice leaned forward. "Indulge me."

  "Consider the indicative," Austin said. "Evaluated in the actual world, updating on the information that I am innocent, the conditional holds. Given the Dean is dead, if I didn't do it, the Assistant must have. The indicative is true because the actual world contains a death, and the disjunction of suspects is exhaustive."

  "And the counterfactual?" Grice asked.

  "False," Austin said smugly. "To evaluate 'If Austin *hadn't* poisoned the tea, the Assistant *would* have,' we must hold fixed the background conditions and select the nearest possible world where I am innocent. In that world, the Assistant remains a pacifist. He does not poison the Dean. In fact, in that nearest world, the Dean remains alive. The counterfactual fails because my innocence eliminates the cause of death entirely."

  Austin sat back, satisfied. "So, you see the divergence. The indicative is true, preserving the logical space for the Assistant's guilt. The counterfactual is false, preserving my causal innocence. You cannot move from one to the other without a modal fallacy. Charges dropped."

  Grice slowly closed the file. "Dr. Austin, you've been remarkably precise. In fact, you've convicted yourself."

  Austin blinked. "I beg your pardon?"

  "You just conceded that in the nearest world where you are innocent, the Dean lives," Grice said, standing up. "That means the Dean's death counterfactually depends on your action. In criminal law, we do not adjudicate based on epistemic updates to the actual world. We adjudicate based on causal dependence in nearby possible worlds."

  Grice motioned to the officer at the door. "If the indicative were the standard, you'd be free. But since the counterfactual 'If you hadn't done it, he would live' is true, and he is dead, *modus tollens* applies. You're under arrest."

  "But that ignores the belief-update semantics!" Austin protested as the handcuffs clicked.

  "Not in this jurisdiction," Grice said. "Here, we live in the closest possible world where the evidence holds."
