          *   *Challenge:* Dewey's model works best on manipulable futures. History is fixed.
          *   *Response:* The "operations" are on the *evidence*, not the event.
          *   *Contestation:* Does this stretch "experimentalism" too thin? Some philosophers say yes.
          *   *Trotsky's Withheld Info:* Trotsky admitted later (or archives show) he had *some* contact, just not the treasonous kind alleged.
