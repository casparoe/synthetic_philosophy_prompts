          *   *Hypotheses:* (1) Trotsky conspired to kill Stalin/sabotage (Stalin's claim). (2) Trotsky is innocent of specific charges (Trotsky's claim).
          *   *Operational Testing (The Hard Part):* How do you test a past event?
              *   *Analysis:* Cross-examination as a form of experimental manipulation of testimony. Internal consistency checks.
              *   *Constraint Check:* Flag this as a *reconstruction*. Dewey doesn't explicitly write about legal cross-examination as "operational testing" in *Logic*, but it fits the *spirit*.
