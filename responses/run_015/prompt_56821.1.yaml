  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I claim the Moscow Trials were definitely frame-ups? *Correction:* State the Commission found them to be frame-ups, note that most Western historians agree now, but acknowledge the Soviet archive complexities that emerged later (e.g., some contacts did exist).
      *   *Check:* Did I claim Dewey explicitly endorsed the Commission as a model of *Logic: The Theory of Inquiry*? *Correction:* Dewey wrote about it in essays (*"Trotsky Guilty?"*), but *Logic* was published in 1938. The connection is interpretive. Flag this.
