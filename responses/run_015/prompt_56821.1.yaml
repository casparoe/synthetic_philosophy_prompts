  2.  **Deconstruct the Philosophical Framework (Dewey circa 1937):**
      *   *Logic: The Theory of Inquiry* (1938) is the closest systematic text, but *The Public and Its Problems* (1927) and *Experience and Nature* (1925) are relevant background. By 1937, Dewey is fully committed to instrumentalism/experimentalism.
      *   *Key Concepts:*
          *   Indeterminate Situation $\rightarrow$ Determinate Situation.
          *   Problem determination (crucial step).
          *   Hypotheses/Suggestions.
          *   Reasoning/Elaboration.
          *   Operational Testing (the tricky part for history).
          *   Warranted Assertibility (not absolute Truth).
          *   Knowing as Doing (anti-spectator).
          *   The Public & Experts (The "shoe" analogy).

  3.  **Deconstruct the Historical Event (The Dewey Commission):**
      *   *Context:* Moscow Trials (1936-1938), Stalinist purges, Trotsky in exile (Coyoacán, Mexico).
      *   *The Commission:* American Committee for the Defense of Leon Trotsky (ACDLT). Dewey chairs. 5 members (including Beals).
      *   *Procedure:* Hearings in Mexico, April 1937. Trotsky present with counsel (Goldman). Commission counsel (Stokes).
      *   *Outcome:* *Not Guilty* report (Sept 1937). Findings: Trials were frame-ups, confessions improbable.
      *   *Controversy:* Was it a Trotskyist front? (Historians disagree). Beals resigned mid-stream (why?). Trotsky's actual contacts with USSR opposition (historical nuance).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the rabbit hole. State the thesis: The Commission is a stress test for Deweyan inquiry, revealing strengths in procedural rigor but tensions in historical application and public engagement.

      *   **Part 1: The Theory (Dewey's Machinery):**
          *   Define Inquiry (indeterminate to determinate).
