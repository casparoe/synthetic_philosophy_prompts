prompt: |-
  I'm the director of a clinical psychology residency and every quarter I have to write these character evaluations for the accrediting body — they want ratings on compassion, integrity, practical wisdom, that kind of thing. The problem is I'm actually convinced by both virtue ethics and the situationist critique, which puts me in a weird spot. If character is just stable dispositions then I should rate residents on whether they consistently act well, but if the situationists are right then behavior mostly tracks context not traits, so my ratings are basically astrology unless I control for pressure and setting. I need a reusable procedure I can run in about thirty minutes per resident that doesn't collapse into a gut-feeling form.

  Can you turn virtue ethics — specifically the idea that virtues are dispositions to feel, reason, and act correctly across a range of situations, not just habits — into an operational checklist for me? It needs to specify what counts as evidence for a virtue versus just lucky behavior, how to weight situational pressure (high-stress crisis vs routine rotation), and where the procedure has to stop and admit it's a values judgment rather than a measurement so I don't recieve false precision. Include three worked cases: a resident who was rude to a patient during a double shift but usually kind; one who was exemplary in easy rotations but collapsed in crisis; and one ambiguous case where the procedure gives an answer I probably won't like. Also flag the points where I'm just dressing up judgment calls as steps, and say what the procedure absolutely cannot do — like predicting future behavior or replacing a real conversation. Don't give me bibliographies or citations; I already know the debate and can't search them. I just need something I can apply repeatedly without pretending psychology doesn't exist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a clinical psychology residency.
      *   **Task:** Write quarterly character evaluations (compassion, integrity, practical wisdom, etc.) for an accrediting body.
      *   **Conflict:** Believes in both Virtue Ethics (stable dispositions) and Situationist Critique (behavior is context-dependent). This creates tension: rating "character" feels like rating "astrology" if situationism holds.
      *   **Goal:** A reusable, operational checklist/procedure (approx. 30 mins/resident) that bridges this gap.
      *   **Requirements:**
          *   Translate virtue ethics (dispositions to feel, reason, act) into operational steps.
          *   Distinguish evidence of virtue vs. lucky behavior.
          *   Weight situational pressure (high-stress vs. routine).
          *   Identify where judgment calls happen (avoid false precision).
          *   State limitations (what it *cannot* do).
          *   Include three worked cases (Rude but usually kind; Exemplary easy/collapsed crisis; Ambiguous/uncomfortable result).
          *   No bibliographies/citations (user knows the debate).
          *   Tone: Professional, pragmatic, philosophically informed but actionable.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Virtue Ethics:* Character is a hexis (stable state). It involves cognition (practical wisdom/phronesis), affect (appropriate emotion), and action. It's developed over time.
      *   *Situationism:* Behavior varies wildly based on subtle contextual cues (Milgram, Stanford Prison, etc.). "Global traits" might not exist.
      *   *Synthesis for this context:* We can't measure "global traits" as if they are physical constants. We *can* measure "contextualized reliability" and "reflective capacity." A virtue isn't just doing the right thing; it's doing the right thing *for the right reason* while managing the *pressure to do otherwise*. The evaluation should focus on the *trajectory* and the *response to situational pressure*, not just a raw score.

  3.  **Drafting the Procedure (The "V-SOP" - Virtue Situational Operational Procedure):**
      *   *Time limit:* 30 minutes. Needs to be tight.
      *   *Structure:*
          1.  Data Gathering (Pre-work).
          2.  Situational Weighting (The Situationist Adjustment).
          3.  Triangulation (Feel, Reason, Act).
          4.  The Judgment Call (Admitting uncertainty).
      *   *Key Innovation:* Instead of asking "Is this resident compassionate?", ask "How does their compassion hold up as situational pressure increases?" and "Do they recognize when they fail?"

  4.  **Developing the Checklist Steps:**
      *   *Step 1: Context Mapping.* Don't just look at incidents. Look at the *difficulty* of the context.
      *   *Step 2: The Triad.* Virtue is not just action. It's Emotion (do they care?), Reasoning (do they know why?), Action (do they do it?).
      *   *Step 3: The Failure Analysis.* This is crucial for situationism. Everyone fails under pressure. The virtue is in the recovery and insight.
      *   *Step 4: Weighting.* High stress success > Low stress success. High stress failure < Low stress failure (in terms of diagnostic value).
      *   *Step 5: The "Stop Rule".* Where do we admit we don't know?

  5.  **Addressing the "False Precision" Warning:**
      *   Need explicit flags where the director is making a value judgment, not a measurement.
      *   Need to state clearly: This does not predict future behavior.

  6.  **Developing the Worked Cases:**
      *   *Case 1 (Rude/Double Shift):* High pressure failure. Usually kind. *Verdict:* Virtue intact but fatigue management needed. Situationism explains the slip; Virtue ethics looks at the baseline + recovery.
      *   *Case 2 (Easy/Crisis Collapse):* Low pressure success, High pressure failure. *Verdict:* Fragile virtue. "Fair-weather" disposition. Needs remediation.
      *   *Case 3 (Ambiguous/Uncomfortable):* Maybe someone who follows rules perfectly (Integrity) but lacks warmth (Compassion), or vice versa. Or someone whose "virtue" is actually compliance. Let's go with the "Technically Competent but Cold" resident. The procedure might rate them high on "Integrity" but low on "Compassion," forcing the director to decide if "Compassion" is essential for *this* specific role or if it's a bias. Better: A resident who challenges authority (Integrity) but looks insubordinate (Professionalism). Let's choose the "Ethical Dissenter" who looks difficult. The procedure flags them as high integrity/low conformity, forcing the director to admit the rating depends on whether they value obedience or moral courage.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but keep the philosophical integrity.
      *   Be direct about the limitations.
      *   Ensure it fits the 30-minute constraint.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too complex for 30 mins?
      *   *Fix:* Simplify the scoring. Use a "Traffic Light" system instead of 1-10 scales to avoid false precision.
      *   *Critique:* Did I address the "lucky behavior" vs. "virtue" distinction?
      *   *Fix:* Emphasize the *Reasoning* component. Lucky behavior lacks intentional reasoning.
      *   *Critique:* Did I flag the judgment calls?
      *   *Fix:* Insert "⚠️ JUDGMENT ZONE" markers.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   30 mins? Yes.
      *   No citations? Yes.
      *   3 cases? Yes.
      *   Limitations stated? Yes.
      *   Situationism acknowledged? Yes.

  10. (Final Output Generation - similar to the provided good response.)
answer: |-
  Here is an operational procedure designed to bridge the gap between virtue ethics and situationism within a 30-minute window. It treats "character" not as a fixed physical trait, but as a **contextualized reliability score** combined with **reflective capacity**.

  ### The V-SOP (Virtue Situational Operational Procedure)

  **Time Allocation:** 30 Minutes
  **Materials:** Resident file, supervisor notes, incident reports, self-evaluation.
  **Goal:** To produce a rating that acknowledges situational variance without abandoning the concept of disposition.

  ---

  #### Phase 1: Context Mapping (5 Minutes)
  *Situationist Check: Do not evaluate behavior without evaluating the pressure.*

  1.  **List the 3 most significant behavioral data points** from the quarter (positive or negative).
  2.  **Assign a Pressure Score (1–3)** to each data point:
      *   **1 (Routine):** Standard load, rested, supportive supervision.
      *   **2 (Elevated):** High caseload, interpersonal conflict, mild fatigue.
      *   **3 (Critical):** Crisis intervention, double shifts, systemic failure, personal distress.
  3.  **Filter:** If all data points are Pressure Score 1, flag the evaluation as **"Low Ecological Validity."** You cannot rate resilience on easy mode.

  #### Phase 2: The Triad Audit (10 Minutes)
  *Virtue Check: Action alone is not virtue. You need Feel, Reason, and Act.*

  For the single most significant data point (highest pressure), analyze the resident's response across three columns. Mark **Yes/No/Partial**.

  *   **Affect (Feel):** Did their emotional response match the moral demand? (e.g., Felt distress at patient suffering, not just annoyance at paperwork).
  *   **Phronesis (Reason):** Could they articulate *why* they acted that way? Did they recognize the ethical stakes in the moment?
  *   **Behavior (Act):** Did the external action align with clinical standards?

  **Scoring Rule:**
  *   **3 Yes:** Strong evidence of virtue (or lucky alignment).
  *   **2 Yes:** Developing disposition.
  *   **1 or 0 Yes:** Behavior is likely habitual, coerced, or accidental. **Do not rate as virtuous.**

  #### Phase 3: The Failure Analysis (10 Minutes)
  *The Synthesis: How they handle the Situationist Critique.*

  Everyone fails under high pressure. Virtue ethics distinguishes the virtuous agent by how they relate to their failure.

  1.  **Identify any deviation** from ideal behavior (even minor).
  2.  **Ask the Recovery Question:** Did the resident identify the slip themselves, or did it require external confrontation?
  3.  **Ask the Attribution Question:** When discussed, did they attribute the failure to *context* only ("I was tired"), or did they acknowledge *disposition* ("I let my fatigue override my care")?

  **⚠️ JUDGMENT ZONE:**
  *   If they blame context entirely: You must decide if this is defensiveness or accurate situationism. There is no metric for this.
  *   If they blame disposition entirely: You must decide if this is healthy ownership or toxic shame.
  *   *Action:* Note this uncertainty in the "Narrative Qualifier" section of the final report. Do not resolve it numerically.

  #### Phase 4: Final Rating & Limitations (5 Minutes)
  *Avoiding False Precision.*

  Do not use a 1–10 scale. Use a **Traffic Light System** with a mandatory narrative tag.

  *   **🟢 Green (Reliable):** Consistent Triad Audit + Ownership of Failures.
      *   *Tag:* "Virtue holds under pressure."
  *   **🟡 Yellow (Context-Dependent):** Consistent Triad Audit on Low Pressure + Mixed on High Pressure OR Good Action but Poor Reasoning.
      *   *Tag:* "Virtue fragile under stress" or "Compliance without insight."
  *   **🔴 Red (Unreliable):** Inconsistent Action + External Attribution of Failure.
      *   *Tag:* "Behavior tracks context, not disposition."

  **Mandatory Disclaimer for File:**
  *"This rating reflects observed behavior within specific clinical contexts during this quarter. It is not a prediction of future behavior in novel high-stress environments."*

  ---

  ### Worked Cases

  #### Case 1: The Burnout Slip (Rude during Double Shift)
  *   **Data:** Resident snapped at a patient during hour 14 of a double shift. Otherwise kind all quarter.
  *   **Phase 1 (Context):** Pressure Score 3 (Critical).
  *   **Phase 2 (Triad):**
      *   Affect: No (Showed irritation).
      *   Reason: Yes (Later articulated they were overwhelmed).
      *   Act: No (Violation of conduct).
  *   **Phase 3 (Failure):** Resident self-reported the incident in supervision. Attributed it to fatigue but acknowledged they should have handed off the patient.
  *   **Phase 4 (Rating):** **🟡 Yellow.**
  *   **Narrative:** "Compassion disposition is present but boundary management failed under critical pressure. Recovery was virtuous."
  *   **Why not Red?** Situationism predicts failure at Pressure 3. Virtue ethics values the *recovery* and *self-reporting*. The disposition exists but has a known breaking point.

  #### Case 2: The Fair-Weather Clinician (Exemplary Easy / Collapsed Crisis)
  *   **Data:** Perfect scores on routine rotations. During a clinic-wide emergency, became paralyzed and ignored patient cues to focus on bureaucracy.
  *   **Phase 1 (Context):** Mixed. Mostly Pressure 1, one Pressure 3.
  *   **Phase 2 (Triad) on Crisis:**
      *   Affect: No (Reported feeling 'numb').
      *   Reason: No (Could not explain why they prioritized forms over patients).
      *   Act: No (Neglect of care).
  *   **Phase 3 (Failure):** Required supervisor confrontation. Attributed failure entirely to "chaotic system."
  *   **Phase 4 (Rating):** **🔴 Red.**
  *   **Narrative:** "Behavior tracks low-pressure contexts only. Practical wisdom absent in crisis."
  *   **Why not Yellow?** The Triad failed completely on the high-pressure event, and there was no ownership. This is the Situationist critique confirmed: no stable disposition found, only context-compliance.

  #### Case 3: The Uncomfortable Ambiguity (The "Rigid" Ethicist)
  *   **Data:** Resident refuses to bend rules for patient comfort (e.g., strict adherence to time limits even when patient is dysregulated). Patients complain of coldness; Risk Management praises documentation.
  *   **Phase 1 (Context):** Pressure Score 2 (Elevated emotional demand).
  *   **Phase 2 (Triad):**
      *   Affect: Partial (Reports caring, shows little).
      *   Reason: Yes (Articulates ethical duty to boundaries).
      *   Act: Yes (Adheres to protocol).
  *   **Phase 3 (Failure):** No specific failure. The "failure" is a values conflict between Care and Justice.
  *   **Phase 4 (Rating):** **🟢 Green (with Warning).**
  *   **Narrative:** "Integrity is robust. Compassion expression is rigid."
  *   **The Uncomfortable Truth:** The procedure rates them highly on Integrity (stable disposition) but the *definition* of Compassion used by the program is being challenged.
  *   **⚠️ JUDGMENT ZONE:** You must decide if "Compassion" requires flexibility or consistency. The procedure cannot solve this. If you rate them down, you are admitting the rating is about *conformity to your style*, not objective virtue. If you rate them up, you risk validating rigidity. **You must write a narrative paragraph acknowledging this tension.**

  ---

  ### What This Procedure Cannot Do

  1.  **Predict Future Behavior:** It explicitly admits the Situationist critique. A 🟢 rating today does not guarantee a 🟢 rating in a different clinic with different power dynamics.
  2.  **Measure "Soul":** It measures *observable reliability* and *reflective capacity*. It does not measure whether the resident is a "good person."
  3.  **Remove Your Bias:**
      *   **⚠️ JUDGMENT ZONE:** In Phase 2 (Affect), you are judging whether their emotions are "appropriate." This is inherently subjective. If you value stoicism, you will rate a tearful resident lower. If you value expressiveness, you will rate a stoic resident lower. The procedure forces you to flag this, but it cannot fix it.
  4.  **Replace Conversation:** If a resident lands in 🟡 or 🔴, this checklist is not the feedback. It is the prep for the conversation where you discuss *why* the context broke the behavior.

  ### Implementation Note
  To keep this to 30 minutes, you must refuse to gather *more* data. If you don't have evidence for the Triad Audit, you cannot rate the virtue as "Present." You must rate it as "Insufficient Data." It is better to admit ignorance than to manufacture precision.
