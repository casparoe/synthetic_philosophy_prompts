answer: |-
  **1. You claim the feeling of direct epistemic access is the specific falsehood generated by the model. But to establish this falsehood, you rely on philosophical argumentation that presupposes rational access to premises. If the model hides the machinery to prevent cognitive overload, isn't your own argument merely another layer of the user-interface persuading itself? How do you distinguish your theoretical conclusion from a particularly compelling hallucination of insight?**
  *Follow-up: You will likely distinguish between phenomenal access and theoretical inference, but doesn't your theory rely on introspective reports from subjects to validate the predictive models in the first place? If those reports are generated by the same illusory interface, isn't the data contaminated?*

  **2. You argue transparency hides the machinery, yet introspection often successfully tracks mental states. If the interface is designed to obscure the code, why does it so frequently report the correct variable values? Is introspection just the system reading its own output logs, and if so, isn't that a form of mediated access rather than an illusion of directness?**
  *Follow-up: If you reply that it is a prediction based on behavior rather than reading logs, why does it feel immediate rather than inferential? Does the phenomenology of immediacy itself serve a functional role, or is it merely a byproduct?*

  **3. In cases of depersonalization or split-brain phenomena, the self-model corrupts, yet subjects don't report generating a second, competing user-illusion to smooth over the glitch. Why does the predictive system allow the interface to fracture rather than instantly confabulating a unified narrative to maintain the illusion's integrity?**
  *Follow-up: If you argue that precision weighting on sensory evidence overrides the prior self-model, does this imply the illusion is subordinate to sensory fidelity? Doesn't that undermine the claim that action-optimization via a simplified self-model is the primary evolutionary driver?*

  **4. You distinguish between unusual experiences and a breakdown of the illusion itself. What specific predictive failure counts as the dissolution of the user-illusion? If a subject reports the disappearance of the self, is that the illusion breaking, or just the content of the illusion changing to "there is no self"?**
  *Follow-up: If you maintain that the structure of prediction remains even when the content changes, is the term "illusion" doing any explanatory work? Or is it just a pejorative label for standard predictive processing that we happen to dislike?*

  **5. If the user-illusion hides the machinery to optimize action, what evolutionary advantage is gained by falsely representing epistemic access as direct? Wouldn't accurate metadata about uncertainty be more useful for survival than the confidence provided by an illusion?**
  *Follow-up: You will likely argue confidence reduces computational cost and hesitation, but doesn't that same confidence lead to the systematic errors your theory highlights? Is the cost of error not higher than the cost of computation in high-stakes environments?*

  **6. If the self is a transparent illusion generated for control, how do you accommodate normative claims about responsibility? If the "controller" is part of the interface, who is liable when the machinery malfunctions?**
  *Follow-up: If you shift to a functionalist definition of agency, does that functionalist agent still suffer? Or is suffering also part of the interface, and if so, does mitigating suffering require breaking the illusion?*

  **7. Predictive processing explains function, but does it explain why the user-interface feels like anything? If the transparency is just data compression, where does the qualitative character enter the loop?**
  *Follow-up: If you reply that qualia are simply the format of the data, does that mean changing the format changes the reality, or just the display? If it's just the display, why can't we look behind it?*

  **8. What phenomenon would force you to abandon the user-illusion metaphor? If every counter-example can be framed as a different configuration of the same predictive model, isn't the theory unfalsifiable?**
  *Follow-up: If you point to specific neural correlates as falsifiers, doesn't correlating neural activity with the illusion just push the problem back a step? How do you escape the hermeneutic circle of interpreting neural data through the very consciousness you claim is illusory?*
