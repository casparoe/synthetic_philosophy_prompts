answer: |-
  Here is a 50-minute battle plan designed to keep the metaphysics grounded, the profligacy contained, and the distinction between *cause* and *blame* visible.

  ### 1. The Board Order (Chronological Flow)

  Do not start with the question "Can omissions cause?" Start with a diagram they recognize, break it, and then ask the question.

  *   **Minute 0–5: The INUS Baseline.**
      *   Draw a standard Mackie diagram on the left: `[A + B + C] -> E`.
      *   Label A, B, C as *events* (spatiotemporal occurrences).
      *   Write: **Causation = Relation between Events.**
      *   *Goal:* Anchor them in what they currently believe so they feel the tension later.

  *   **Minute 5–15: The Carrying Case (The Control Tower).**
      *   Introduce the case (see Section 2 below).
      *   Ask for a show of hands: "Did the silence cause the crash?"
      *   *Crucial:* Do not debate yet. Just record the split vote.
      *   Write on board: **Intuition: Yes.**

  *   **Minute 15–25: The Humean Squeeze (The "Where?" Worry).**
      *   Point to your INUS diagram. Ask: "Where is the silence in this diagram?"
      *   Draw a timeline. Mark the crash. Mark the time the radio *should* have been used.
      *   Write: **Problem 1: Spatiotemporal Location.** (Is "nothing" an event?)
      *   *Why here?* You address the metaphysics *after* they agree there's a puzzle, but *before* they spiral into profligacy. If you do this too early, they say "Nothing isn't a thing, done." If you do it too late, they've already decided it's just about blame.

  *   **Minute 25–35: The Profligacy Block (The Queen).**
      *   Raise the objection yourself. "If silence is a cause, did the Queen of England's silence cause it? She didn't radio either."
      *   Write: **Problem 2: Profligacy.** (Too many causes).
      *   *The Move:* Introduce **Loaded vs. Bare Omissions** here (see Section 4).
      *   Write: **Solution: Causal Selection requires a 'Field'.**

  *   **Minute 35–45: The Blame/Cause Firewall.**
      *   Ask: "If the operator was on a coffee break (negligent), is it more of a cause than if the radio broke (non-negligent)?"
      *   Force them to see that *causation* might stay the same while *blame* changes.
      *   Write: **Distinction: Causal Status vs. Moral Responsibility.**

  *   **Minute 45–50: The Refusal & Final Question.**
      *   List what you are *not* solving (see Section 5).
      *   Pose the Final Question (see Section 6).

  ---

  ### 2. The Carrying Case: "The Control Tower"

  You need a case that isolates the omission without inviting positive reconstruals or external noise. The Plant failed last year because the "field" of potential waterers was infinite (Queen, rain, neighbor). The Control Tower works because the system is closed.

  **The Scenario:**
  > An air traffic controller is on shift. Two planes are on a collision course. Protocol requires the controller to radio a warning if this happens. The controller sits silently. The planes collide.

  **Structural Features It Must Have:**
  1.  **Single Designated Agent:** Only *one* person has the radio codes/authority. (Blocks the Queen of England objection immediately).
  2.  **No Positive Intervening Act:** The controller does not drink coffee, sleep, or talk about sports. They just sit and do not speak. (Blocks "Positive Reconstrual"—they can't say "The cause was his coffee drinking").
  3.  **Direct Counterfactual Dependence:** If the warning had been issued, the pilots would have turned. (Blocks "The sun/dryness" objection—the link is tight).
  4.  **Low Emotional Valence:** Unlike a doctor letting a patient die, this is mechanical/procedural. (Blocks the slide into pure blame).

  **Why The Plant Failed:**
  The plant case has *bare* omissions everywhere. Everyone on earth didn't water it. The Control Tower case has a *loaded* omission (the controller) and *bare* omissions (the Queen). This allows you to use the distinction pedagogically.

  ---

  ### 3. Handling Counterfactuals (Without the Machinery)

  You cannot use "nearest possible worlds." You must smuggle in the *intuition* of counterfactual dependence without the *metaphysics*.

  *   **The phrasing:** Do not say "In the nearest world where..."
  *   **Say this:** "The Difference Test."
  *   **Board Text:** **Would the outcome have been different if the act had occurred?**
  *   **Timing:** Introduce this at Minute 15, when discussing the Intuition.
  *   **Why:** First-years grasp "If he had spoken, they would have turned." This captures the logic of omission causation without requiring Lewisian semantics. It frames omission causation as *dependence*, which is easier to swallow than *production*.

  ---

  ### 4. The "Bare vs. Loaded" Distinction: Bug or Feature?

  You asked if using this distinction teaches them that causation depends on norms, and if that's a bug.
  **Verdict:** It is a **Feature**. Own it out loud.

  At the first-year level, teaching them that "Causal Selection is interest-relative" is a win, not a bug. It stops the Profligacy Panic without lying to them.

  *   **How to deploy it (Minute 30):**
      *   **Bare Omission:** Anyone not watering the plant. (Infinite causes).
      *   **Loaded Omission:** The Controller not radioing. (Specific cause).
      *   **The Lesson:** "We don't count Bare Omissions as causes in everyday talk, not because they aren't physically relevant, but because they aren't *useful* explanations."
  *   **The Risk:** They might think norms *make* the causation happen.
  *   **The Fix:** Explicitly say: "The norm doesn't change the physics. It changes what we *pick out* as the cause." This distinguishes **Causal Production** (physics) from **Causal Selection** (explanation).
  *   **Why Early?** You must introduce this *before* the Queen objection kills the discussion. If you wait until after, they've already concluded "Everything is a cause" and checked out.

  ---

  ### 5. Misconception Management (Timing is Everything)

  | Misconception | When it strikes | Your Pre-emptive Move |
  | :--- | :--- | :--- |
  | **Positive Reconstrual**<br>("He chose to sit there") | Minute 10 (Case Intro) | **Constraint the description.** "For this example, assume he did nothing else. No coffee, no phone. Just silence." Write **"No Positive Act"** on the board. |
  | **Profligacy Panic**<br>("Queen of England") | Minute 25 (The Squeeze) | **Use Loaded/Bare.** "The Queen's omission is *Bare*. The Controller's is *Loaded*. We are asking about Loaded omissions." |
  | **The Blame Slide**<br>("It's just negligence") | Minute 40 (Wrap up) | **The 'Broken Radio' Test.** "If the radio was broken, the outcome is the same. Is the silence still a cause? (Yes). Is he to blame? (No)." |
  | **The Shrug**<br>("It's just counterfactuals") | Minute 45 (Conclusion) | **Acknowledge & Park.** "Yes, counterfactuals handle this better than Hume. But *why*? We'll do that in 3 weeks. For now, note that Hume struggles here." |

  ---

  ### 6. What to Explicitly Refuse

  In the last 5 minutes, you must close the doors they will try to kick open. Write this on the board:

  **"Today We Are NOT Deciding:"**
  1.  **Legal Liability:** (The law treats acts/omissions differently; we are doing metaphysics).
  2.  **Free Will:** (We are assuming the controller *could* have spoken. We aren't asking if they *could have done otherwise* in a deep sense).
  3.  **Formal Models:** (We are not drawing Structural Equation Models today).

  *Why:* First-years love to solve metaphysics with "Well, legally..." or "But what if he was determined...". Shut this down early so you don't lose the last 10 minutes to legal realism or compatibilism.

  ---

  ### 7. The Final Question (Minute 50)

  Do not ask "So, are omissions causes?" (They will just vote Yes/No).
  Ask a question that forces them to use the **Loaded/Bare** distinction you just taught.

  **The Question:**
  > "Suppose the Controller was **off-duty**, but sat in the chair anyway. He sees the crash risk. He stays silent. The planes crash.
  >
  > **Did his silence cause the crash?**"

  **Why this works:**
  *   **If they say Yes:** They have accepted omission causation as physical/counterfactual (The silence made the difference).
  *   **If they say No:** They have accepted that causation depends on norms/duty (The Loaded Omission view).
  *   **The Win:** Either answer shows they grasp the *shape* of the problem: that omission causation sits right on the fault line between **physics** (dependence) and **norms** (expectation).

  **Your closing line:** "If you answered Yes, you think causation is about dependence. If you answered No, you think causation is about expectation. Next week, we fight about which one matters."
