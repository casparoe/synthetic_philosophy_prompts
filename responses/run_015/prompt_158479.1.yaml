answer: |-
  The institutional practice of mass-casualty triage, specifically its categorical prohibition against sacrificing a stable patient to harvest resources for critically injured ones, presupposes a **robust, deontological conception of the separateness of persons.** It treats individuals as distinct moral entities whose boundaries cannot be breached for the sake of aggregate welfare, rather than as interchangeable vessels for the storage of utility.

  Below is the reconstruction of this implicit view, the distinction between philosophical requirements and compatible heuristics, an assessment of its consistency with aggregative calculus, and the counterfactual design changes required were that calculus to prevail.

  ### 1. Reconstruction: Non-Interchangeable Value vs. Risk-Averse Heuristic

  The triage protocol implicitly rejects the view that the prohibition on sacrifice is merely a **risk-averse heuristic**. A heuristic implies a rule of thumb that is generally useful but dispensable when the calculation is certain or the stakes are sufficiently high. If the prohibition were merely heuristic, protocols would include exception clauses for cases of extreme asymmetry (e.g., sacrificing one stable patient to definitively save fifty critical ones). The fact that the prohibition is *categorical*—holding regardless of the magnitude of the aggregate benefit—indicates that the protocol treats individual lives as **non-interchangeable sources of value.**

  This view aligns with the Rawlsian critique of utilitarianism: society is not a single super-person, and the loss of one cannot be morally offset by the gain of others. In this framework, each patient possesses a **moral inviolability** that generates a constraint on action. The triage officer is not maximizing a single metric of "life-units" across a collective; they are managing distinct claims to aid, where the claim of the stable patient not to be harmed outweighs the claim of the critical patients to be saved *via that harm*.

  ### 2. Strict Philosophical Requirements vs. What Merely Fits

  To understand the philosophical architecture of triage, we must distinguish between what the protocol *strictly requires* and what arguments merely *fit* its outcomes.

  *   **Strict Requirement (Deontological Constraint):** The protocol strictly requires that persons are **ends in themselves**, not means to an end. It mandates a distinction between *letting die* (withholding scarce resources from the expectant/black tag) and *killing* (actively harming the stable/green tag). This distinction is philosophically necessary to maintain the prohibition. If the moral weight lay solely in the outcome (death), the distinction would vanish. Therefore, the protocol requires a morality of **agency and rights**, not just outcomes.
  *   **What Merely Fits (Systemic Consequentialism):** Arguments regarding **trust and long-term utility** fit the practice well but are not required by it. One could argue, "We forbid sacrifice because if we allowed it, people would avoid hospitals, leading to more deaths overall." This is a consequentialist justification for a deontological rule (Rule Utilitarianism). While this *fits* the protocol, the protocol does not *require* it. If empirical data showed that allowing sacrifice *increased* public trust (e.g., in a highly altruistic society), a strictly heuristic view would demand we allow sacrifice. The actual protocol would still forbid it. Thus, the trust argument is a compatible overlay, not the foundational logic.

  ### 3. Consistency with Aggregative Welfare Calculus

  The practice is **inconsistent** with an aggregative welfare calculus that regards personal boundaries as morally transparent.

  *   **Moral Transparency:** In a strict aggregative view (Act Utilitarianism), personal boundaries are transparent. The pain or death of Person A is mathematically equivalent to the pain or death of Person B. The only relevant moral fact is the net sum of welfare. If $1 \text{ Death} < 3 \text{ Deaths}$, the calculus demands the sacrifice.
  *   **The Triage Violation:** By forbidding the sacrifice, triage asserts that personal boundaries are **opaque** to aggregation. It posits that the *distribution* of harm matters independently of the *sum* of harm. It assigns a negative infinity (or a lexical priority) to the violation of the stable patient's right to bodily integrity, which cannot be cancelled out by the positive utility of saving others.
  *   **Conclusion:** While triage *allocation* (choosing who gets the ventilator) often utilizes aggregative logic (saving the most salvageable), the *no-sacrifice* clause is a firewall against pure aggregation. It acknowledges that we are distinct individuals, not cells in a single organism where sacrificing a limb to save the heart is mandatory.

  ### 4. Counterfactual: Design and Legal Changes Under an Aggregative View

  If the aggregative view (transparent boundaries) replaced the implicit deontological one, the institutional architecture of emergency medicine would require radical transformation to align practice with philosophy.

  **A. Triage Design and Tagging:**
  *   **Resource-Value Tagging:** Current triage tags (Red, Yellow, Green, Black) assess *need* and *survivability*. Under an aggregative view, tags would need to assess *resource potential*. A "Green" patient would be scanned not just for injury, but for organ compatibility, blood volume, and tissue viability relative to "Red" patients.
  *   **Dynamic Recalculation:** Triage would become a continuous algorithmic process. If a stable patient's resources could save more "life-years" than their own projected life expectancy, their tag would automatically flip from "Treat" to "Harvest."
  *   **Elimination of the "Do Not Treat" Category:** The "Black" (expectant) category exists because resources are too scarce to waste on the unlikely-to-survive. In a pure aggregative system, the "Black" category might expand to include the "Net Negative" stable patients—those whose continued existence consumes resources that yield higher utility elsewhere.

  **B. Legal Immunity and Liability:**
  *   **Homicide Waivers:** Currently, legal immunity for triage officers covers *negligence* or *withholding of care* due to scarcity. It does not cover *active killing*. To implement the aggregative view, legislation would need to grant specific immunity for **active sacrifice**. The legal definition of homicide would need an emergency exception clause based on utilitarian calculus (e.g., "Justifiable Homicide via Resource Reallocation").
  *   **Shift in Consent:** Current protocols rely on implied consent for treatment but require explicit consent (or surrogate decision-making) for organ donation. An aggregative system would necessitate **presumed consent for sacrifice** during declared mass-casualty events. The legal authority to decide on the sacrifice would shift from the individual/patient to the Triage Commander, who acts as the calculator of the aggregate good.
  *   **Liability for Inaction:** Under the current view, a doctor is not liable for failing to sacrifice one to save three. Under the aggregative view, a doctor could theoretically be held liable for **waste of resources** (i.e., allowing three to die to save one). Legal frameworks would need to penalize the *failure to maximize survival* as a form of malpractice.

  ### Summary

  The prohibition on sacrificing stable patients in triage is not a pragmatic heuristic but a structural commitment to the **separateness of persons.** It insists that individuals are not fungible resources for the state or the collective. While consequentialist arguments about trust support this rule, the rule itself rests on a deontological constraint that regards personal boundaries as morally opaque. To adopt a truly aggregative view would require dismantling the legal and ethical distinction between *letting die* and *killing*, transforming patients from rights-bearers into potential reservoirs of biological capital.
