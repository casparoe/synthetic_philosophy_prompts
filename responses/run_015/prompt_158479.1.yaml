prompt: |-
  Mass-casualty triage protocols assign treatment priority by survival probability and categorically prohibit sacrificing one stable patient to harvest resources for several critically injured ones, even when the aggregate survival count favors the sacrifice. What conception of the separateness of persons does this institutional practice presuppose? Reconstruct the implicit view: does it treat individual lives as non-interchangeable sources of value, or is it only a risk-averse heuristic? Distinguish what the protocol strictly requires philosophically from what merely fits it well, assess whether the practice remains consistent with an aggregative welfare calculus that regards personal boundaries as morally transparent, and specify what elements of triage design and legal immunity rules would have to change if that aggregative view replaced the implicit one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Mass-casualty triage protocols (specifically the prohibition on sacrificing a stable patient to save multiple critical ones, even if aggregate survival increases).
      *   **Key Question:** What conception of the *separateness of persons* does this practice presuppose?
      *   **Task 1 (Reconstruction):** Does it treat lives as non-interchangeable sources of value, or is it just a risk-averse heuristic?
      *   **Task 2 (Distinction):** Distinguish what the protocol *strictly requires* philosophically vs. what merely *fits* it well.
      *   **Task 3 (Assessment):** Is the practice consistent with an *aggregative welfare calculus* (utilitarianism) that sees personal boundaries as morally transparent?
      *   **Task 4 (Counterfactual):** What elements of triage design and legal immunity would need to change if the aggregative view replaced the implicit one?

  2.  **Analyze the Triage Protocol (The Phenomenon):**

      *   Standard triage (e.g., START, SALT) prioritizes based on *immediate survivability* with available resources.
      *   Crucial constraint: It does *not* allow killing a "Green" (stable) patient to harvest organs/blood/resources to save three "Red" (critical) patients, even if $1 < 3$ in terms of lives saved.
      *   This mirrors the "Transplant Case" in ethics (Surgeon killing one healthy person to save five dying patients).

  3.  **Address Task 1 & 2: Conception of Separateness & Strict Requirements:**

      *   *Separateness of Persons:* This phrase comes from Rawls (critiquing utilitarianism). It means individuals are distinct entities, not vessels for a collective utility.
      *   *Non-interchangeable vs. Heuristic:*
          *   If it were just a heuristic (rule of thumb), we would expect exceptions when the calculation is certain (e.g., "If we *know* this one sacrifice saves exactly ten, do it"). But the prohibition is categorical.
          *   Therefore, the protocol treats individuals as having *rights* or *constraints* that cannot be overridden by aggregate good.
          *   *Strict Requirement:* The protocol requires a *deontological constraint* against using a person merely as a means. It requires that each person has a moral status that creates a "boundary" around them.
          *   *Merely Fits:* Consequentialist arguments (e.g., "allowing sacrifice erodes trust in medical systems") fit the outcome but aren't *required* by the categorical nature of the rule. The rule doesn't say "Don't sacrifice unless trust is safe"; it says "Don't sacrifice."

  4.  **Address Task 3: Consistency with Aggregative Welfare Calculus:**

      *   *Aggregative Welfare Calculus:* Classical Utilitarianism. Personal boundaries are "morally transparent." The unit of value is the outcome (life saved), not the agent/patient relationship.
      *   *Consistency Check:* The triage protocol is *inconsistent* with strict aggregative calculus.
      *   *Why?* Aggregative calculus demands maximizing the sum. If $1 \text{ life} < 3 \text{ lives}$, the calculus demands the sacrifice. The protocol forbids it.
      *   *Nuance:* Rule Utilitarianism might try to save it (e.g., "A rule against sacrifice produces better long-term outcomes"). But the prompt asks about the view that regards boundaries as *transparent*. That implies Act Utilitarianism or direct aggregation. The protocol rejects the transparency of boundaries. It asserts boundaries are *opaque* to aggregation.

  5.  **Address Task 4: Counterfactual (If Aggregative View Replaced Implicit One):**

      *   If we truly adopted the view that boundaries are transparent and only aggregate survival matters:
      *   *Triage Design:* Categories would change. "Green" patients would be assessed for *resource potential* (organs, blood volume) relative to "Red" patients' survival probability. A "Resource Value" score would be added to the triage tag.
      *   *Legal Immunity:* Currently, doctors have immunity for *withholding* care based on scarcity, but not for *killing* to redistribute resources. Under the aggregative view, legal immunity would need to extend to active sacrifice (homicide waivers) provided the math checks out.
      *   *Consent:* Consent protocols would likely shift from individual opt-in to presumed consent or state authority during declared emergencies.

  6.  **Synthesize and Structure the Argument:**

      *   *Introduction:* Define the tension (Aggregate good vs. Individual constraint). State the thesis: The protocol presupposes a robust, deontological separateness of persons, not merely a heuristic.
      *   *Section 1: The Implicit View (Reconstruction).* Contrast "Non-interchangeable sources of value" (Kantian/Rawlsian) vs. "Risk-averse heuristic." Argue for the former based on the *categorical* nature of the prohibition.
      *   *Section 2: Strict Requirements vs. Good Fits.* Distinguish between the *constraint* (required) and *systemic trust* (fits well but secondary).
      *   *Section 3: Consistency with Aggregative Calculus.* Explicitly state inconsistency. Explain "moral transparency" of boundaries. Show how triage violates this transparency.
      *   *Section 4: Counterfactual Design Changes.* Detail the specific changes to tags, legal immunity, and consent required to make the system truly aggregative.
      *   *Conclusion:* Summarize the philosophical weight of current medical ethics.

  7.  **Refine the Philosophy:**

      *   Use Rawls' "Separateness of Persons" explicitly.
      *   Reference the "Transplant Case" (Thomson/ Foot).
      *   Distinguish between *doing* and *allowing* (acts vs. omissions), though the prompt focuses more on *aggregation* vs. *constraints*.
      *   Ensure the distinction between "Rule Utilitarianism" (which might justify the ban) and "Aggregative Welfare Calculus regarding boundaries as transparent" (which would not) is clear. The prompt asks about the latter.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer whether it's a heuristic? *Yes, argued it's not.*
      *   *Check:* Did I distinguish strict requirements from what fits? *Yes, constraint vs. trust.*
      *   *Check:* Did I assess consistency with aggregative calculus? *Yes, inconsistent.*
      *   *Check:* Did I specify design/legal changes? *Yes, resource tagging and homicide immunity.*
      *   *Tone:* Keep it analytical, philosophical, and precise. Avoid emotional language.

  9.  **Final Polish:** Ensure terms like "moral transparency," "deontological constraint," and "aggregative calculus" are used correctly in context. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to conflate "triage" (sorting) with "treatment." Triage *does* aggregate in a sense (saving the most salvageable). But the prompt specifically isolates the *prohibition on sacrifice*. I must focus on that specific boundary. Triage allows letting some die to save others (allocation of scarce resources); it does not allow killing one to save others (active sacrifice). This distinction is vital. The "separateness" is violated by active sacrifice, not necessarily by allocation under scarcity. I need to make sure I don't argue that *all* triage is deontological. Only the *no-sacrifice* clause is. Actually, standard triage *is* consequentialist regarding allocation (save the most), but deontological regarding *means*. I must clarify this nuance. The prompt asks about the prohibition on *sacrificing* a stable patient.

  *Refined Plan:*
  1. Acknowledge triage is partly consequentialist (maximize survivors).
  2. Highlight the specific limit: the *means* constraint (no killing/harming stable patients).
  3. This limit reveals the "separateness."
  4. Proceed with the four tasks.

