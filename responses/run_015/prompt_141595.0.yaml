answer: |-
  The broken step is **(4)**.

  Here is the diagnosis, the explanation of why it deceived you, the price of the alternatives, and the implications for your infrastructure.

  ### The Break: Step (4)

  **The Step:** *"That removes the honest side's only candidate advantage... and by (2) nothing else is left to distinguish them. So for every budget B... the deceiver can produce a tree of the same shape whose open leaves the judge rates no worse."*

  **Why it looked fine:**
  It relies on a **locality assumption**. You correctly established in (2) that a single node's syntax does not reveal its truth value. Step (4) implicitly assumes that because nodes are locally indistinguishable, *trees* of nodes are globally indistinguishable provided they have the same shape and leaf plausibility. It treats the debate tree as a bag of independent claims rather than a constrained logical structure.

  **Why it is false:**
  The honest side has an advantage that is not visible in single nodes but emerges in the **edges** (the relationships between claims) and the **global topology**: **Consistency**.

  *   **Truth is convergent:** There is only one reality. The honest debater's tree is anchored to ground truth. Every expansion they make is constrained by what is actually the case. They do not need to "remember" their lies; they just need to report the structure of the truth.
  *   **Lies are divergent but constrained:** The deceptive debater has freedom in what claims to make, but they bear the burden of **global consistency**. Every time they expand a hard leaf to support a parent claim, they narrow the space of plausible claims they can make elsewhere in the tree without contradicting themselves or the honest debater's cross-examination.
  *   **The Pressure Scales with Budget:** As $B$ increases, the tree grows. The surface area for contradiction grows. The honest side's consistency is free (automatic); the deceptive side's consistency is computationally expensive (active maintenance). Step (4) claims the deceiver can *always* match the shape and plausibility. In reality, as $B$ approaches the complexity of the true derivation, the deceiver runs out of consistent lies. They are forced to either:
      1.  Contradict a previous claim (detected by cross-examination).
      2.  Make a claim that is implausible given the context (detected by the judge).
      3.  Lie about a primitive (detected by verification).

  Step (4) asserts "nothing else is left to distinguish them." **Consistency is the something else.** It is not a property of a node; it is a property of the tree.

  ### Pricing the Alternatives

  You asked to price the alternatives, including the ones you want to keep.

  **1. Keeping Step (2) (Node Symmetry)**
  *   **Cost:** None. You should keep this. It is true. Syntax does not encode truth.
  *   **Commitment:** You must accept that the signal for the judge does not come from *inspecting* a claim, but from *stress-testing* the relationships between claims. This shifts your infrastructure focus from "better leaf classifiers" to "better cross-examination policies" (i.e., which leaf to pick next to maximize contradiction probability).

  **2. Rejecting Step (5) (The Limit Argument)**
  *   **Cost:** Low. Step (5) is a compactness argument that fails here because the "False Tree" is not a static object that survives all $B$; it is a strategy that must adapt. If Step (4) is false (the deceiver cannot match the tree for large $B$), then the premise of (5) ("for every finite budget B there is a false tree that survives") is false.
  *   **Commitment:** You commit to the existence of a **critical budget $B^*$**. Below $B^*$, the deceiver can obfuscate. Above $B^*$, the consistency pressure forces a collapse. Your empirical observation (7) suggests your current harness operates near or above $B^*$ for the tasks you are testing.

  **3. Rejecting Step (3) (Hard Leaf Symmetry)**
  *   **Cost:** High. This step claims "For every true claim... there is a false one whose shortest refutation is just as long."
  *   **Why you might want to reject it:** In some domains (e.g., cryptography), finding a collision (false claim that looks valid) is computationally hard. If the "false hard leaf" is harder to *find* than the true one, the deceiver is computationally bounded.
  *   **Why you should keep it:** For alignment safety, you must assume the model is superhuman. If a false hard leaf *exists*, the model can find it. Relying on the model's inability to *find* the lie is unsafe. Relying on the model's inability to *maintain consistency* across many lies is safer.

  **4. Rejecting Step (7) (Empirical Claim)**
  *   **Cost:** Prohibitive. This requires you to abandon your own harness data and the premise that debate is useful. This is the nuclear option. Do not take this.

  ### The "Hard Leaf" Definition Trap

  There is a tension in your preamble definition that you need to resolve to make the infrastructure robust.

  You defined a **Hard Leaf** as: *"a claim... [where] the honest side cannot bottom out in primitives either."*
  *   **Example:** "Step 4000 of a program trace."
  *   **The Tension:** For computational claims, the honest side **can** bottom out in primitives (Step 0 + Transition Rules), it just costs budget. If you define "Hard Leaf" as "cannot bottom out," you are describing **ungrounded claims** (e.g., moral philosophy), not computational ones.
  *   **The Fix:** Distinguish between **Expensive Leaves** (computational, can be grounded if $B$ is high enough) and **Ungrounded Leaves** (conceptual, cannot be grounded).
      *   **For Expensive Leaves:** Debate works because $B$ eventually exceeds the depth of the true derivation. The honest side reveals primitives; the liar must lie on a primitive and gets caught. Step (4) fails because the liar cannot match the primitive layer.
      *   **For Ungrounded Leaves:** Debate works *only* via Consistency (Step 4 rejection). The judge never sees primitives. They award the win to the tree with fewer internal tensions.

  ### What Defenders of Debate Must Believe (Regarding Step 2)

  You asked: *"If the honest answer is that (2) has to go after all, tell me what someone defending the debate approach would have to believe in its place."*

  **The honest answer is that (2) does NOT have to go.** You can keep Step (2).

  However, defending Debate requires believing a modified version of Step (4)'s implication. A defender must believe:

  > **"While truth leaves no mark on the syntax of a single node (2), truth leaves a statistical mark on the *manifold* of consistent trees."**

  **What this commits them to:**
  1.  **The Judge is a Consistency Checker, not a Truth Checker:** The judge's capability is not "can I verify this fact?" but "does this claim fit with the 50 other claims made in this session?"
  2.  **Cross-Examination Policy is Critical:** If the protocol picks leaves randomly, the deceiver might avoid contradictions. If the protocol (or the opposing debater) picks leaves that *maximize constraint propagation*, the deceiver's consistency burden becomes unsustainable. Your infrastructure must optimize for **leaf selection strategies** that expose inconsistencies, not just expand depth.
  3.  **Hard Leaves are Vulnerable to Decomposition:** Even if a leaf is "hard" (e.g., Step 4000), the honest side can decompose it into (Step 3999 + Rule). The deceiver can too. But the deceiver's decomposition must align with *their* decomposition of Step 3999 chosen three turns ago. The honest side's decompositions align automatically.

  ### Summary for your Infrastructure

  1.  **Reject Step (4).** The advantage is **Global Consistency**, not Local Verifiability.
  2.  **Keep Step (2).** Do not try to build judges that "smell truth" in single claims.
  3.  **Actionable Insight:** Your "harness" works (Step 7) because your budget $B$ is likely high enough to force the deceiver into consistency traps, or your cross-examination policy effectively targets high-leverage nodes.
  4.  **Risk:** If you encounter a domain where consistent lies are as easy to maintain as truth (e.g., purely subjective preferences, or domains with high degeneracy), Debate will fail. Your evaluation suite should measure **Consistency Pressure** (how many expansions before a contradiction is forced) rather than just Accuracy vs. Budget.

  The obfuscated-arguments problem is not that the liar can hide the truth forever; it is that the liar can hide the truth *until the consistency cost exceeds the model's capability to maintain the facade*. Your infrastructure should measure that cost.
