      *   **The Execution Scene (Origin Myth):** This is the crux. Wallace dies for an idea that doesn't fully exist yet. His scream creates the "people" in the square. It's a performative utterance of nationhood. It bridges the gap between medieval martyrdom and modern sovereignty.
      *   **The Absence of Institutional Conditions:** Anderson says you need print/bureaucracy. The film shows *charisma* and *spectacle* doing the work instead. It suggests a "pre-modern imagination" driven by blood and speech, which Anderson might say is impossible, but the film insists is real.
      *   **Conclusion (The Film's Philosophical Contribution):** What does cinema do that text doesn't? It embodies the *affect*. It shows the *cost* of the invention. It reveals that "imagined communities" require emotional labor and violence, not just structural conditions.

