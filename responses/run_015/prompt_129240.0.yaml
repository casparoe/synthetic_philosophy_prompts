prompt: |-
  If George Berkeley was alive today and came across LLMs churning out philosophy essays with no actual consciousness behind them, how do you reckon he'd apply his master argument? Would he claim the text is just dead marks because there's no mind concieving them in the moment, or would he allow that the programmers' intentions count as the necessary conception? And then there's VR — people putting on headsets and experiencing spatial depth where there's literally nothing physical in front of them. Does that strengthen his idealism, or does it weaken the master argument since the 'ideas' seem sustained by sillicon chips and code rather than by spirit?

  I'm asking you to guess at his reaction, not to dig up quotes. No bibliographies needed — I know you can't search. Just tell me how the philosophy fits, and please be explicit about how confident you are in each claim and point out the one you're least sure about. Write casual, like a message to a mate, and a typo or two is totally fine.
