answer: |-
  You are not just dressing up Gavagai in neural-net clothing, but you are also not discovering a entirely new phenomenon. You have stumbled into the intersection of three distinct fields that all describe the same structural limit from different angles.

  There isn't one single "proper name" for the specific recursive loop you described (where every anchor spawns a higher-order ambiguity), but it is most precisely described as **The Rule-Following Paradox** (philosophy) manifesting as **Representational Non-Identifiability** (statistics/ML) due to **Polysemanticity** (mechanistic interpretability).

  Here is the breakdown of what this concept covers, why your anchors fail, and where the regress actually stops.

  ### 1. The Philosophical Name: The Rule-Following Paradox
  You mentioned Quine's *Indeterminacy of Translation* (Gavagai), which handles reference (what does "rabbit" refer to?). But your problem is slightly different: it's about *structure* and *logic* (what does "because" or "unjust" do?).

  The specific loop you are seeing—where defining a term requires a context, but defining the context requires further terms—is **Wittgenstein's Rule-Following Paradox**, later formalized by **Saul Kripke**.

  *   **The Concept:** No finite set of examples (anchors) can fully determine a rule. If you try to define "plus" by showing examples, a skeptic can always propose a different rule (like "quus") that fits all past examples but diverges in the future.
  *   **In your experiment:** When you anchor "unjust" with "because X happened," you are trying to fix the rule for how the model processes causality. But "because" itself is a function that requires interpretation. You are trying to fix the interpretation of one node by adding more nodes, but the connections between *those* nodes are also underdetermined.
  *   **Where it stops:** Wittgenstein argues it stops at **practice** (forms of life). In your case, it stops only when you stop looking at internal representations and look at **behavioral convergence**. If both models output the same token probabilities for all possible inputs, the internal divergence is philosophically real but functionally null.

  ### 2. The Statistical Name: Representational Non-Identifiability
  In machine learning and statistics, what you are observing is **Non-Identifiability**.

  *   **The Concept:** A model is "identifiable" if a unique set of internal parameters produces the observed input-output behavior. If multiple different internal configurations produce the exact same external behavior, the parameters are non-identifiable.
  *   **In your experiment:** You are trying to find an isomorphism (a perfect mapping) between the latent space of Model A and Model B. For concrete concepts, the loss landscape forces the models into similar geometric configurations (a "apple" vector must be distinct from "orange"). For abstract concepts, the loss landscape is "flat" in certain dimensions. There are infinite rotations or transformations of the abstract subspace that result in the same loss.
  *   **The Loop:** Every time you add a constraint (an anchor sentence), you are trying to collapse the degrees of freedom. But because abstract concepts are **distributed** (not local), constraining one dimension often forces the model to "push" the ambiguity into a correlated dimension (your "fresh place where the two models could diverge").
  *   **Where it stops:** It stops at **Behavioral Equivalence**. If you cannot distinguish the models by their outputs, the internal mapping is mathematically arbitrary. You cannot solve non-identifiability with more internal data; you can only solve it by accepting that the internal states are not unique.

  ### 3. The Architectural Name: Polysemanticity in Superposition
  This is the mechanistic reason *why* the anchors slip.

  *   **The Concept:** In small models (and even large ones), neurons and directions in latent space are **polysemantic**. One direction might represent "fairness" in context A, but "risk-aversion" in context B. This is called **superposition**.
  *   **In your experiment:** When you anchor "fairness," you are activating a specific subspace. But because of superposition, that subspace is entangled with other concepts. When you try to disambiguate "fairness" by adding "because," you shift the activation pattern to a different part of the superposition, which disentangles "fairness" from some concepts but entangles it with new ones (like "causality" or "temporal order").
  *   **The Loop:** You are playing whack-a-mole with entropy. Disambiguating one feature increases the entropy of the features it is superposed with.
  *   **Where it stops:** It stops at **Sparsity**. If you had a model that was perfectly sparse (one neuron = one concept), this wouldn't happen. But efficient compression requires superposition. The limit is the **dimensionality of the latent space**. If you keep adding anchors, you eventually run out of dimensions to push the ambiguity into, and the models will either converge or break (loss spikes).

  ### Summary: What to call it?
  If you need a label for your notes or paper, the most accurate composite term is **Semantic Non-Identifiability under Superposition**.

  However, if you want to capture the *recursive* nature of the anchoring failure (the "loop"), the best existing concept is **Confirmational Holism** (from the Duhem-Quine thesis).

  *   **What it covers:** It covers the fact that you cannot test (or define) a single hypothesis (or concept) in isolation. You only test the whole web. When you anchor "unjust," you aren't just defining "unjust"; you are implicitly defining "because," "happened," and the logical connectives between them. Changing the anchor changes the web.
  *   **Where it stops:** It stops at **Pragmatic Grounding**.
      *   **Internal Mapping (Where you are):** Never stops. You can always rotate the abstract manifold.
      *   **External Grounding (Where it stops):** If you connect the models to a shared environment (e.g., a simulation where "unjust" leads to a specific penalty signal), the ambiguity collapses. The "cash value" of the concept is fixed by the environment, not by other words.

  ### Recommendation
  You are effectively trying to solve the **Symbol Grounding Problem** using only other symbols (internal representations). That is why you are in a loop.

  To break the loop experimentally:
  1.  **Stop mapping internals:** Accept that abstract concepts are **functionally isomorphic** but **structurally distinct**.
  2.  **Introduce non-linguistic anchors:** If possible, map the representations to a shared task reward or a physical simulation state. This breaks the hermeneutic circle by introducing a "hard" constraint that isn't subject to linguistic interpretation.
  3.  **Measure "Slippage" as a Metric:** Instead of trying to eliminate the ambiguity, quantify it. The amount of rotation required to align the abstract subspaces could be a metric of **Conceptual Divergence** between models.

  You aren't doing anything wrong; you've just hit the hard boundary of what can be known about a system solely through structural comparison.
