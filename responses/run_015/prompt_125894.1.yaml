answer: |-
  ### I. The Menu of Theses

  1.  **Mereological Novelty:** A composite object possesses spatial or structural properties (e.g., shape, arrangement) that no proper part possesses in isolation.
      *   *Verdict:* Platitude.
      *   *Instances:* A wall is rectangular; a brick is not. *Non-instance:* Mass (the mass of the wall is the sum of the bricks).
      *   *Textbook Mapping:* **Protein folding** (shape is global), **Temperature** (not a property of one atom).

  2.  **Non-Linearity:** The aggregate behavior of a system is not the linear sum of the behaviors of parts in isolation because interaction terms dominate.
      *   *Verdict:* Substantive but defensible.
      *   *Instances:* Gravitational three-body problem. *Non-instance:* Ideal gas at low density (approximately linear).
      *   *Textbook Mapping:* **Phase transition** (cooperative behavior), **Protein folding** (interaction energies).

  3.  **Deflationary Emergence:** "Emergence" is merely a label for the current state of human ignorance or the prohibitive cost of computing the micro-dynamics.
      *   *Verdict:* Platitude (epistemic claim).
      *   *Instances:* Weather forecasting before supercomputers. *Non-instance:* A system where the macro-law is known to be fundamentally independent (if such exists).
      *   *Textbook Mapping:* **Temperature** (statistical average), **Periodic table** (derivable from QM, but tedious).

  4.  **Computational Irreducibility:** The macro-behavior is not predictable from complete knowledge of the micro-constitution plus micro-dynamics without effectively running the system step-by-step.
      *   *Verdict:* Contingent empirical hypothesis about particular systems.
      *   *Instances:* Cellular automata (Rule 110), turbulent fluid flow. *Non-instance:* Planetary orbits (solvable analytically).
      *   *Textbook Mapping:* **Protein folding** (Levinthal's paradox), **Phase transition** (critical point calculation).

  5.  **Multiple Realizability:** The same macro-pattern is realized by wildly different micro-configurations, so the macro-description is where the stability and generalization live.
      *   *Verdict:* Substantive but defensible.
      *   *Instances:* A "solid" can be made of ions, atoms, or molecules; a "computation" can be silicon or neural. *Non-instance:* A specific isotope of hydrogen (micro defines macro).
      *   *Textbook Mapping:* **Natural selection** (works on genes, memes, or code), **Temperature** (kinetic energy of any particle type), **Phase transition** (universality classes).

  6.  **Explanatory Autonomy:** The macro-vocabulary cannot be eliminated in favour of the micro-vocabulary without losing explanatory power, even if the micro-facts determine the macro-facts.
      *   *Verdict:* Substantive but defensible.
      *   *Instances:* Explaining a recession using supply/demand rather than individual transactions. *Non-instance:* Explaining the mass of a brick (micro-sum is better).
      *   *Textbook Mapping:* **Natural selection** (fitness is a macro-property), **Phase transition** (order parameters), **Periodic table** (chemical valence is more useful than wavefunctions).

  7.  **Downward Causation:** Macro-states have causal powers of their own, including constraints or effects on the parts that are not accounted for by part-to-part interactions alone.
      *   *Verdict:* Confused or false (unless redefined as constraint).
      *   *Instances:* A thermostat constraining a furnace (actually a designed feedback loop). *Non-instance:* A ghost moving a hand (violates conservation).
      *   *Textbook Mapping:* **Protein folding** (global shape constrains local bond angles), **Natural selection** (environment selects individuals).

  8.  **Strong Emergence:** The macro-behavior is not derivable from the micro-dynamics even in principle; new fundamental laws are required at the higher level.
      *   *Verdict:* Confused or false (in physics); Radical metaphysical claim (in mind).
      *   *Instances:* Conscious experience (allegedly). *Non-instance:* Superconductivity (derivable from QM, however hard).
      *   *Textbook Mapping:* **Consciousness** (the hard problem), **Natural selection** (if viewed as a vital force).

  ***

  ### II. The Interlocutors and the Global Variable

  **The Condensed-Matter Physicist**
  *   **Required Reading:** Primarily **Explanatory Autonomy (6)** and **Multiple Realizability (5)**, potentially **Computational Irreducibility (4)**.
  *   **Assessment:** Defensible. The physicist does not need Strong Emergence (8) to justify funding; they only need to show that the *work* of deriving macro-laws from micro-laws is non-trivial and that the macro-laws are robust across different micro-realizations.
  *   **The Gap:** They often invoke the slogan to imply Strong Emergence (8) to secure status against particle physics, but their actual practice relies on Autonomy (6). The slogan conflates "hard to derive" with "independent ontology."

  **The Consciousness Researcher**
  *   **Required Reading:** **Strong Emergence (8)** and **Downward Causation (7)**.
  *   **Assessment:** Confused or false (within physicalism). For the conclusion ("no description of neural activity... will ever explain experience") to follow, mere Computational Irreducibility (4) is insufficient; one needs ontological novelty.
  *   **The Gap:** The slogan "more is different" does standard physical work (e.g., in superconductivity) without violating micro-physics. The researcher smuggles in an ontological leap under the cover of an epistemic slogan. They need "More is *ontologically* other," not just "different."

  **The Machine-Learning Researcher**
  *   **Required Reading:** **Computational Irreducibility (4)** and **Non-Linearity (2)**.
  *   **Assessment:** Contingent empirical hypothesis. The claim that capabilities are "in principle unforecastable" is too strong; they are likely just practically unpredictable due to high-dimensional non-linearity.
  *   **The Gap:** They conflate "we cannot predict this without training the model" (4) with "this capability emerges from nowhere" (8). The slogan masks the fact that the capability was latent in the architecture and data, merely unlocked by scale.

  **The Fourth Source (The Global Variable)**
  *   **Analysis:** This is a precise mathematical formulation of **Explanatory Autonomy (6)** grounded in topology. It is distinct from the vague slogan because it specifies *why* the vocabulary is non-eliminable: the property is defined over relations among arbitrarily many parts (e.g., a winding number), so a vocabulary quantifying only over individuals cannot express it.
  *   **Truth:** True for specific systems (topological insulators, defects in crystals, knot theory in DNA). Not true in general (mass is not a global variable in this sense).
  *   **Support for Conclusions:**
      *   *Physicist:* Strongly supports autonomy. It proves the macro-description is not just a shortcut, but the *only* way to name the feature.
      *   *Consciousness:* Does not support it. A global variable is still fully determined by the micro-configuration. It is compatible with micro-level causal completeness.
      *   *ML:* Clarifies it. "Emergent capabilities" may be topological features of the loss landscape that only exist above a certain dimensionality.
  *   **Verdict:** This is the only reading with rigorous content that does not collapse into platitude or metaphysical confusion. It saves the Physicist's claim without validating the Consciousness claim.

  ***

  ### III. Closing Note: Incompatibility with Micro-Physics

  Only two readings on the menu are genuinely incompatible with a complete micro-physics: **Strong Emergence (8)** and a robust, law-violating version of **Downward Causation (7)**. These claim that the micro-level is causally or nomologically insufficient to determine the macro-level.

  Every other reading—from Non-Linearity (2) to Explanatory Autonomy (6) to the Global Variable reading—is fully compatible with micro-physics. They assert that while the micro-level *determines* the macro-level, it does not *explain* it efficiently, or that the macro-features are topologically inaccessible to part-wise vocabulary. The slogan "more is different" is dangerous because it allows the radical claims (8) to borrow the credibility of the defensible ones (2, 5, 6). Your column's work is to sever that link.
