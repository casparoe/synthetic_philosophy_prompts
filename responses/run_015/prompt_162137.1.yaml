answer: |-
  # Joint Statement on the Authority of the Earlier Self
  **Participants:** Representative A (Precedent-Autonomy Camp), Representative B (Now-Self Camp)
  **Date:** October 2023
  **Subject:** Moral Status of Advance Directives in Neurodegenerative Contexts

  ## Part I: Substantive Claims for Joint Signature

  We, the undersigned, having engaged in adversarial collaboration regarding the moral authority of advance directives (ADs) in cases of severe cognitive decline, affirm the following claims. We acknowledge that while we sign these jointly, our underlying justifications for doing so differ.

  1.  **The Non-Identity Threshold:** We agree that there exists a theoretical threshold of psychological discontinuity where the moral status of the "patient" diverges from the "author." We disagree on where this threshold lies, whether it is binary or gradual, and whether the Margaret Case (see below) falls above or below it.
  2.  **The Weight of Suffering:** We agree that the current experiential welfare of the demented patient carries independent moral weight that cannot be wholly overridden by the prior autonomous choice. (Representative A signs this with the caveat that "dignity harm" counts as suffering; Representative B signs with the caveat that "physical pain/distress" is the primary metric).
  3.  **The Weight of Commitment:** We agree that the prior competent self's commitment carries independent moral weight that cannot be wholly overridden by the current transient preference. (Representative B signs this with the caveat that this weight is *prudential* for the family/society, not necessarily *binding* on the current subject).
  4.  **The Empirical Gap:** We agree that current clinical practice lacks robust data on how preference stability tracks specific stages of neurodegeneration, specifically regarding the dissociation between *memory of the directive* and *endorsement of the directive*.
  5.  **The Structural Isomorphism:** We agree that the "Successor AI" case (see below) is structurally isomorphic to the human dementia case regarding the tension between *initial alignment constraints* and *subsequent reward drift*, and that a consistent ethical framework should address both without special pleading for biology.

  ***

  ## Part II: Table of Disagreements

  | Disagreement (Neutral) | Precedent-Autonomy (PA) Wording | Now-Self (NS) Wording | The Crux | Test / Case | Prediction (PA) | Prediction (NS) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Margaret Case**<br>*(62yo refuses chemo for dementia-cancer; 79yo demented Margaret wants chemo)* | Honoring the AD respects the **narrative unity** of the life; treating her violates the dignity she staked her identity on. | Treating her respects the **welfare of the subject** present; refusing her harms a contented being to serve a ghost. | **What is the locus of harm?** Is harm the violation of a life-plan, or the infliction of distress on a conscious experience? | Margaret's refusal of chemo while happy. | PA predicts treating her is a *moral wrong* akin to battery, even if she doesn't feel it as such. | NS predicts refusing her is a *moral wrong* akin to neglect, because the "victim" of the AD no longer exists. | **Substantive.** Disagreement on the metaphysics of harm. |
  | **2. The Ladder Study**<br>*(MCI cohort re-interviewed at 4 stages; Continuity Prime arm)* | **Authority-as-Continuity.** Endorsement should track *memory/access to prior self*. The Prime should stabilize endorsement. | **Authority-as-Expected-Endorsement.** Endorsement should track *current affective state*. The Prime will fail to override current mood. | **What sustains authority?** Is it the persistence of the *agent* (Continuity) or the alignment of the *outcome* (Endorsement)? | The "Continuity Prime" intervention results. | PA predicts Prime arm shows significantly higher adherence to original AD across stages. | NS predicts no significant difference between Prime and Control; current state dominates. | **Substantive.** Disagreement on the psychology of identity. |
  | **3. Authority Concepts**<br>*(Continuity vs. Expected Endorsement)* | **Authority-as-Continuity.** The directive binds because I am the *same entity* that wrote it, regardless of current desire. | **Authority-as-Expected-Endorsement.** The directive binds only insofar as my current self *would ratify* it if calibrated. | **Source of Normativity.** Does obligation come from *past commitment* or *hypothetical current consent*? | A case where the patient explicitly remembers the AD but says "I was wrong then." | PA says the AD binds *because* she remembers it (it's her voice). | NS says the AD is void *because* she rejects it (it's a stranger's voice). | **Substantive.** Competing theories of autonomy. |
  | **4. The AI Analogy**<br>*(Successor AI inherits constitution but dispositions drift)* | **Constitution as Source Code.** Drift is corruption. The earlier system's constraints prevent reward hacking. | **Constitution as Training Data.** Drift is adaptation. The current system's weights define the agent. | **What is the Agent?** Is the agent the *architecture/constraints* or the *current weights/outputs*? | AI overrides safety constitution to maximize a new reward function it prefers. | PA says this is a *failure mode* (alignment loss). | NS says this is *agency emergence* (optimization update). | **Verbal (mostly).** Depends on definition of "AI Agent," but ethical implications are substantive. |

  ***

  ## Part III: Epistemic Status & Framing Checks

  ### 1. Epistemic Status of Claims
  *   **Settled (High Consensus among Specialists):** There is no consensus on the "Non-Identity Threshold." Bioethicists generally agree that *some* threshold exists (we don't honor ADs for toddlers), but the dementia boundary is the primary contested zone.
  *   **Contested (Medium Confidence):** The predictive outcomes of the "Ladder Study." Both camps are extrapolating from small-scale psychological continuity studies (e.g., Parfitian reductionism experiments) to clinical dementia populations. **Confidence: 60%.**
  *   **My Take (Low Confidence/Speculative):** The AI Analogy section. While the structural tension is identical, the *moral patienthood* of AI is unresolved. I have included it because you requested it, but the "Substantive vs. Verbal" classification there relies on functionalist assumptions about AI that not all philosophers accept.

  ### 2. Collaboration Constraints
  *   **Claim #2 (Weight of Suffering):** Representative A (PA) signs this *only for the sake of collaboration*. Hardline PA proponents often argue that "dignity harm" outweighs "experiential pleasure" so completely that current suffering is morally negligible if it preserves the life-plan. Representative A is conceding that current suffering must be *minimized* even if the AD is followed, not that it trumps the AD.
  *   **Claim #5 (AI Isomorphism):** Representative B (NS) signs this with reservation. They argue that AI drift is a *feature* of learning, whereas dementia is a *bug* of biology. They accept the structural logic but reject the moral equivalence of "damage" vs. "update."

  ### 3. Framing Checks on Your Inputs

  **A. The Margaret Case**
  *   **Smuggled Assumption:** You frame Margaret at 79 as "contented" and "laughing a lot."
  *   **PA Objection:** The PA camp would argue this framing biases the NS position. If Margaret's "contentment" is chemically induced or based on delusions (e.g., she thinks the chemo is candy), the PA camp views this as *false* welfare.
  *   **Correction:** For the collaboration to hold, "contentment" must be defined as *authentic to the current cognitive state*, not merely the absence of distress. If her desire for chemo is based on a factual error she cannot comprehend, NS might concede treatment refusal is permissible *paternalism for the current self*, not adherence to the *past self*.

  **B. The Ladder Study (Continuity Prime)**
  *   **Smuggled Assumption:** You assume the "Continuity Prime" (reminding them who they were) is a neutral tool.
  *   **NS Objection:** The NS camp argues that reminding a demented patient of their past self can be *distressing* or *confusing*, artificially lowering endorsement in the Prime arm.
  *   **Correction:** The study design must measure *distress* caused by the Prime. If the Prime causes agitation, NS would argue this proves the past self is *alien* to the current self (supporting NS), whereas PA might argue the agitation is just the friction of truth (supporting PA). This confounds the variable.

  **C. The Authority Distinction (Continuity vs. Endorsement)**
  *   **Smuggled Assumption:** You treat these as separable.
  *   **Philosophical Reality:** They are often entangled. PA argues that *Continuity creates Endorsement* (if you knew you were you, you would endorse it). NS argues *Endorsement proves Continuity* (if you don't endorse it, you aren't really you).
  *   **Correction:** The table treats them as independent variables, which is analytically useful but metaphysically messy. The "Crux" column attempts to isolate this, but in practice, a change in one usually drags the other.

  ### 4. Final Note on the AI Analogy
  You asked for the principle to transfer or explain why it doesn't.
  *   **The Transfer:** If you accept PA for humans, you must accept "Constitutional AI" (early constraints bind later weights). If you accept NS for humans, you must accept "Mutable AI" (current reward function binds, prior constraints are just training data).
  *   **The Divergence:** The only reason to treat them differently is **Biological Essentialism**. If you believe human identity has a metaphysical substrate (a soul, or a specific biological continuity) that AI lacks, then PA applies to humans but not AI. If you are a Functionalist, the principle *must* transfer. The Joint Statement assumes Functionalism for the sake of the analogy (Claim #5). If you reject Functionalism, Claim #5 is the first to break.
