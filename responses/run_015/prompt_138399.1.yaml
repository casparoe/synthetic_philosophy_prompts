answer: |-
  This is a precise and well-framed question. You have correctly identified a tension that standard introductory decision theory often glosses over: the divergence between *pricing* (which treats risk linearly) and *sizing* (which treats risk non-linearly) in sophisticated institutions.

  You are asking for the implicit decision-theoretic structure that rationalizes this behavior. Below is a reconstruction of that structure, separating settled mathematical constraints from contested normative interpretations.

  ***

  ### 1. The Core Distinction: Ensemble vs. Trajectory

  The first step in reconstructing the institutional theory is to recognize that **pricing** and **sizing** solve different mathematical problems.

  *   **Pricing (The Ensemble Average):** When an insurer or casino sets a premium or odds, they are relying on the Law of Large Numbers (LLN) across a *portfolio* of independent or weakly correlated risks. Here, the variance of the aggregate book scales as $\sqrt{N}$, while the expected return scales as $N$. For the "body" of the distribution, the institution acts as a risk-neutral aggregator.
      *   *Settled Math:* If $N \to \infty$ and risks are independent with finite variance, the average payoff converges to the Expected Value (EV).
      *   *Institutional Practice:* Premium = Expected Loss + Loading. This assumes linear utility over the *portfolio* outcome.

  *   **Sizing (The Trajectory):** When an institution sets a table limit, policy cap, or VaR limit, it is constraining the impact of a *single* realization or a correlated cluster of realizations on its solvency trajectory over time.
      *   *Settled Math:* The LLN does not protect against a single realization exceeding capital. If a single bet $B$ satisfies $B > \text{Capital}$, the probability of ruin is non-zero regardless of the EV.
      *   *Institutional Practice:* Exposure caps are set relative to capital, not just relative to EV.

  **The Implicit Theory:** Institutions are **Expected Value Maximizers subject to Solvency Constraints.** They do not maximize utility of terminal wealth in a one-shot sense; they maximize the integral of profits over time, subject to the constraint that they must remain in the game to collect it.

  ***

  ### 2. Evaluating the Candidate Underpinnings

  You asked for the strongest version of each candidate theory and whether institutional practice commits to them.

  #### A. Concave Utility of Money (Bernoulli)
  *   **The Claim:** Institutions act as if they have logarithmic or power utility functions.
  *   **Fit with Practice:** Poor. Public corporations are theoretically owned by diversified shareholders who can eliminate idiosyncratic risk. By the Capital Asset Pricing Model (CAPM), firms should be risk-neutral regarding idiosyncratic risk. If a firm acts risk-averse, it is destroying value shareholders could have diversified themselves.
  *   **Verdict:** **Rejected as a fundamental principle.** While behavior *looks* like concave utility, the normative justification (shareholder welfare) doesn't hold for large institutions. This is why insurers charge a "loading" (profit) rather than just pricing at their own utility indifference point.
  *   **Status:** *Contested.* Behavioral economists argue firms *do* have concave utility due to internal agency problems, but standard finance theory rejects this as suboptimal.

  #### B. Ruin Constraints / Survival (Kelly / Solvency)
  *   **The Claim:** The objective function is not $E[\text{Wealth}]$, but $E[\text{Wealth}]$ subject to $P(\text{Wealth} < 0) < \epsilon$.
  *   **Fit with Practice:** Excellent. This explains why a casino with a positive EV bet still caps wagers. If a whale bets 50% of the casino's bankroll on a single spin of roulette (even with a house edge), the casino faces a significant probability of "Gambler's Ruin" before the edge materializes.
  *   **Verdict:** **Strongly Supported.** This is the primary driver of table limits and reinsurance. It does not require concave utility of money *per se*, only a discontinuous drop in utility at zero (bankruptcy).
  *   **Status:** *Settled Math / Consensus.* Bankruptcy is an absorbing state. Maximizing EV is incoherent if the strategy leads to absorption with probability 1.

  #### C. Model Uncertainty (Knightian / Robustness)
  *   **The Claim:** The tails of the distribution are not known. The "St. Petersburg" payoff schedule is a model, not a physical law.
  *   **Fit with Practice:** Critical. In the St. Petersburg game, the EV is driven by events with probability $2^{-n}$. No institution has data on $n > 40$. To price based on the theoretical EV is to trust a model in a region where it is untestable.
  *   **Verdict:** **Strongly Supported.** Institutions cap exposure because they treat the tail model as *ambiguous*. A bet limit is a hedge against model error. If the payoff schedule is $2^n$, but the counterparty (or the world) cannot actually deliver $2^{100}$ dollars, the EV calculation is physically meaningless.
  *   **Status:** *Consensus in Risk Management.* "Fat tails" and "model risk" are standard justifications for truncating exposure.

  #### D. Ergodicity / Time-Average Growth (Ole Peters)
  *   **The Claim:** Expected Value (ensemble average) is the wrong object to maximize for non-ergodic processes (like multiplicative wealth dynamics). One should maximize the time-average growth rate.
  *   **Fit with Practice:** Superficially good. It justifies focusing on growth rates over single-shot EV.
  *   **The "Log Utility Relabeled" Critique:**
      *   *Settled Math:* For a multiplicative wealth process (geometric Brownian motion), maximizing the time-average growth rate is **mathematically equivalent** to maximizing Expected Log Utility.
      *   *Contested Interpretation:* Peters argues this is a physical property of time, not a psychological preference. Standard economists argue this is a derivation of Log Utility from dynamics, not a replacement for utility theory.
      *   *Does it buy anything?* It buys a normative shift. It allows you to say "Risk aversion is rational" without positing a curved utility function. It says the *dynamics* impose the curvature.
      *   *Verdict:* **Compatible, but distinct.** Institutional practice is consistent with ergodicity economics, but you do not *need* Peters' framework to explain it. Standard "Ruin Constraint" theory (Candidate B) achieves the same result without the physics vocabulary. However, Peters' framework is superior at explaining why *repeated* exposure to a +EV bet can still lead to ruin if sized incorrectly (the leverage effect).
  *   **Status:** *Contested.* Mathematicians agree on the equivalence to Log Utility in standard models; decision theorists dispute whether the "ergodicity" framing resolves foundational paradoxes better than standard utility theory.

  ***

  ### 3. The "Unbounded Capital" Thought Experiment

  > *Suppose the casino were run by an entity with effectively unbounded capital, no ruin constraint, an indefinite horizon, and no regulator... Should it drop the table limits?*

  **Answer: No.**

  Here is the reconstruction of why, separating the math from the interpretation.

  1.  **Counterparty Capacity (The Physical Limit):**
      *   *Settled Math:* Money is a claim on real resources. Global wealth is finite.
      *   *Implication:* In a St. Petersburg game, if $n$ reaches $\approx 60$, the payoff exceeds the total monetary base of the Earth. The contract becomes void *not* because the casino is risk-averse, but because the payoff is physically impossible.
      *   *Conclusion:* A limit is required because the payoff function $2^n$ cannot be honored for large $n$. The "game" ends when the casino cannot pay, regardless of its capital size relative to *current* bets.

  2.  **Liquidity and Friction:**
      *   *Settled Math:* Even with infinite *solvency*, finite *liquidity* exists. Settling a quadrillion-dollar bet requires moving assets that may not exist in liquid form.
      *   *Implication:* Transaction costs become non-linear at scale. The EV calculation assumes frictionless settlement.
      *   *Conclusion:* Limits protect against market impact costs of settling the bet.

  3.  **Adverse Selection and Moral Hazard:**
      *   *Interpretation:* If you remove limits, you attract players who have information you don't (e.g., they know the coin is biased, or they can manipulate the toss).
      *   *Implication:* Without limits, the "fair coin" assumption breaks down. The EV turns negative.
      *   *Conclusion:* Limits are a mechanism to maintain the informational assumptions of the pricing model.

  **Does this show caps are pragmatic?**
  Yes, but "pragmatic" constraints (solvency, liquidity, physical resource limits) function as **principled** constraints in decision theory. You cannot maximize EV over a domain where the payoff function is undefined or the transaction is impossible.

  **Does it survive the "thousands of players" argument?**
  Yes. The LLN applies to the *sum* of bets. If every player bets \$1, the casino is safe. If one player bets \$1 billion, the LLN does not apply to that single trajectory. The casino is not betting against the *average* player; it is betting against the *maximum* realization. The distribution of the *maximum* of $N$ trials does not converge to the mean; it converges to the extreme value distribution. The casino must size for the extreme, not the mean.

  ***

  ### 4. Reconstructing the Implicit Theory

  The institutional practice you observe presupposes **Constrained Expected Value Maximization under Model Uncertainty.**

  It explicitly rejects:
  1.  **Naive EV Maximization:** The view that one should take any bet with $EV > 0$ regardless of size. (Ruled out by ruin constraints).
  2.  **Global Concave Utility:** The view that the firm has a smooth, concave utility function over all wealth levels. (Ruled out by linear pricing in the body of the distribution).

  It explicitly accepts:
  1.  **Local Risk Neutrality:** For small stakes relative to capital, $U(x) \approx x$. (Explains pricing).
  2.  **Absorbing Barriers:** There exists a wealth level $W_{min}$ (regulatory capital, margin call, zero) where utility drops to $-\infty$. (Explains sizing/limits).
  3.  **Tail Ambiguity:** The probability distribution $P(x)$ is not known precisely in the tails. (Explains why limits are set *below* the theoretical ruin point).

  **Is Risk Aversion Incoherent?**
  The rationalist claim that "risk aversion over small stakes is incoherent" (Rabin's Calibration Theorem) relies on the assumption of a **smooth, globally concave utility function**.
  Institutional practice avoids this incoherence by having a **piecewise** function:
  $$
  U(x) = \begin{cases} 
  x & \text{if } x < \text{Threshold} \\
  -\infty & \text{if } x > \text{Capital Limit} 
  \end{cases}
  $$
  (With a steep drop-off near the limit).
  This allows them to be risk-neutral on small bets (avoiding Rabin's critique) while refusing large bets (avoiding Ruin). This is not "risk aversion" in the Bernoulli sense; it is **risk management** in the survival sense.

  ***

  ### 5. Summary of Disputes and Consensus

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **EV diverges in St. Petersburg** | *Settled Math* | The series $\sum \frac{1}{2^n} 2^n$ diverges. |
  | **LLN protects the Casino** | *Settled Math (with caveats)* | Holds for independent bets with finite variance. Fails for single large exposures. |
  | **Log Utility = Time-Average Growth** | *Settled Math* | For multiplicative dynamics, the optimization problems are identical. |
  | **Ergodicity solves the paradox** | *Contested* | Economists argue this is just deriving Log Utility from dynamics, not solving the normative problem of *why* maximize growth rate. |
  | **Firms should be Risk Neutral** | *Contested* | Finance theory says yes (diversified shareholders). Risk management says no (bankruptcy costs, agency frictions). |
  | **Small-stake risk aversion is incoherent** | *Contested* | True *if* utility is smooth/concave. False *if* utility is linear with a ruin cliff. |

  ### Final Reconstruction

  The institutions you describe are not maximizing $E[\text{Wealth}]$. They are maximizing $E[\text{Wealth}]$ subject to:
  1.  $P(\text{Wealth}_t < \text{Solvency Limit}) < \epsilon$ (Ruin Constraint)
  2.  $\text{Model Error}_{\text{tail}} < \kappa$ (Robustness Constraint)
  3.  $\text{Liquidity Required} < \text{Liquid Assets}$ (Friction Constraint)

  This view treats **survival as a prerequisite for optimization**. It does not require you to abandon Expected Value as a concept, but it requires you to acknowledge that EV is an operator that is only defined over the domain where the agent exists to collect the payoff.

  If you meet an AI endowment with unbounded capital and no regulators, it should theoretically raise limits. But it should **not** remove them entirely, because the "St. Petersburg" payoff eventually exceeds the physical resources of the universe, rendering the EV calculation physically null. The limit is not just a psychological hedge; it is a recognition that the payoff function $2^n$ is a map that eventually stops corresponding to the territory.

  **What would change my answer?**
  If you could demonstrate an institution that prices *non-linearly* in the body of the distribution (e.g., charging disproportionately high premiums for small, uncorrelated risks) *without* agency frictions or regulatory constraints, that would suggest true concave utility is at play. Currently, the evidence suggests linear pricing + hard constraints.
