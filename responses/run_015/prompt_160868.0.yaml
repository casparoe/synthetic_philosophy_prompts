answer: |-
  It is entirely normal to find the *pramāṇa* debates bewildering at first. You are encountering a structural disagreement that has persisted for two millennia: is epistemology about cataloguing the *ways* the world reveals itself, or about minimising the *mental operations* required to claim knowledge? Your tutor is correct that the number is secondary, but you cannot evaluate the number without knowing what work the list is doing.

  To build your admission test, we must distinguish between the **constitutive requirements** (what makes a *pramāṇa* a *pramāṇa* at all) and the **systemic constraints** (how the list hangs together). Below is the breakdown you requested, sorted by necessity, followed by the trade-offs and the scoring.

  ### I. The Desiderata: An Admission Test for *Pramāṇas*

  These are the conditions a candidate source must meet to be admitted to the list. I have marked them as **Non-Negotiable** (required by almost all schools) or **Contested** (the battleground where schools diverge).

  **1. The Truth-Conducivity Condition (Non-Negotiable)**
  *   **Requirement:** The candidate must be a causal mechanism that *generally* produces true cognitions (*pramā*), not merely belief.
  *   **Rationale:** This distinguishes *pramāṇa* from *viparyaya* (error) or *saṃśaya* (doubt). A process that yields falsehoods (e.g., guessing) is excluded.
  *   **Case Handling:** Rules out lucky guesses in the **Readout Case**. If the instrument is broken but gives a right number by chance, it is not a *pramāṇa* on that occasion.

  **2. The Novelty Condition (Contested)**
  *   **Requirement:** The cognition produced must be *anadhigata* (previously unapprehended).
  *   **Rationale:** If you already know $p$, learning $p$ again adds no epistemic value.
  *   **Consequence:** This is the primary weapon used to exclude **Memory**. Nyāya accepts Memory as a distinct cognition but denies it is a *pramāṇa* because it lacks novelty.
  *   **Case Handling:** Crucial for the **Readout Case**. If you check the instrument repeatedly, is the second glance a *pramāṇa*? Nyāya says no; Buddhist might say the cognition itself is momentary, so every glance is new.

  **3. The Irreducibility Condition (Contested but Critical)**
  *   **Requirement:** The candidate cannot be fully analysed as a complex operation of an existing *pramāṇa*.
  *   **Rationale:** Parsimony. If Testimony is just Perception (hearing sounds) + Inference (the speaker is reliable), it need not be a separate slot.
  *   **Case Handling:** This is the main fight for the **Empty-Search Case**. Is *Anupalabdhi* (non-apprehension) distinct, or just Inference ("If the pot were here, I would see it; I do not see it; therefore...")? Mīmāṃsā says distinct; Nyāya says Inference.

  **4. The Operational Distinction Condition (Non-Negotiable)**
  *   **Requirement:** A *pramāṇa* must be distinguishable from the *pramā* (the resulting knowledge) and the *pramātṛ* (the knower).
  *   **Rationale:** Avoids category errors. The *pramāṇa* is the *means* (the light), not the *result* (the seeing).
  *   **Case Handling:** Prevents defining knowledge as "what comes from a *pramāṇa*" and *pramāṇa* as "what gives knowledge" (circularity).

  **5. The Non-Reflective Access Condition (Non-Negotiable)**
  *   **Requirement:** The mechanism must function for agents who cannot articulate the method (children, animals, experts acting intuitively).
  *   **Rationale:** Knowledge is natural, not purely intellectual. A cow knows grass; it does not perform logic.
  *   **Case Handling:** Vital for the **Readout Case**. You do not need to understand the code to know the readout is valid, provided the causal chain holds.

  **6. The Completeness Condition (Contested)**
  *   **Requirement:** The list must be exhaustive; no other sources of knowledge exist outside it.
  *   **Rationale:** Systematic closure.
  *   **Problem:** How do you verify completeness without using a *pramāṇa* from the list? (See Trade-offs below).

  ---

  ### II. The Joint Unsatisfiability Claim

  You suspected that **Completeness**, **Independence**, **No-Circularity**, and **Overdetermination** cannot all be satisfied simultaneously. You are correct. Here is the specific tension you should centre in your essay:

  **The Trilemma of Systematic Epistemology:**
  You cannot simultaneously hold:
  1.  **Strict Independence:** Every *pramāṇa* is causally and logically distinct (no overlap).
  2.  **Universal Coverage:** Every instance of knowledge falls under exactly one *pramāṇa*.
  3.  **Empirical Openness:** New instruments or methods (like the **Readout Case**) can generate knowledge.

  **Why?**
  If you maintain **Strict Independence** (e.g., Perception is *only* sense-contact, Inference is *only* mark-based), you will encounter cases that blur the lines (e.g., seeing a smoke signal: is it Perception of smoke or Inference of fire?). If you force them into one box to preserve **Universal Coverage**, you violate the phenomenological distinctness. If you admit a new box for the **Readout Case** to preserve **Empirical Openness**, you violate **Completeness** (the list is no longer closed).

  **Which to drop?**
  You should argue for dropping **Completeness**. The classical schools (especially Nyāya) treat the list of four as closed *a priori*. This is their weakness. A robust theory should treat *pramāṇas* as functional kinds. If a new reliable process emerges (digital instrumentation), the theory should accommodate it as a subtype of Testimony or Perception, or admit a new slot, rather than forcing a square peg into a round hole. The claim that the list is *complete* is itself a piece of Testimony or Inference, which renders the system self-referential.

  ---

  ### III. The "Killer" Criterion

  If you want to rule out otherwise popular lists, the single most powerful requirement is **Irreducibility (Criterion 3 above)**.

  This is the engine of the classical debates. The Buddhists reduce the Nyāya four to two by arguing Comparison (*Upamāna*) is just Inference (recognising similarity based on description) and Testimony (*Śabda*) is just Inference (inferring truth from the speaker's reliability). The Mīmāṃsākas defend six by arguing Non-apprehension (*Anupalabdhi*) is *sui generis* because absence is a real object known directly, not inferred.

  If your theory cannot explain *why* a candidate source isn't just a complex version of something else, it fails. This criterion forces you to specify the *causal mechanism* precisely.

  ---

  ### IV. Scorecard: Classical and Modern Candidates

  Here is how the three major approaches score against the desiderata.

  | Criterion | **Nyāya (4)** | **Buddhist (2)** | **Modern Reliabilism (1)** |
  | :--- | :--- | :--- | :--- |
  | **Truth-Conducivity** | **Pass.** Explicitly causal. | **Pass.** Focus on *arthakriyā* (causal efficacy). | **Pass.** Definitionally reliable. |
  | **Novelty** | **Pass.** Excludes memory cleanly. | **Pass.** Momentariness ensures novelty. | **Fail.** Often allows reliable memory as knowledge. |
  | **Irreducibility** | **Mixed.** Struggles to keep Comparison distinct from Inference. | **Pass.** Aggressively reduces others to save parsimony. | **Fail.** Collapses all distinctions into 'reliable process'. |
  | **Non-Reflective** | **Pass.** Animals have perception. | **Pass.** Perception is pre-conceptual. | **Pass.** Naturalised epistemology. |
  | **Completeness** | **Fail.** Claims closed list; cannot account for new instruments. | **Pass.** Claims 2 cover all conceptual/non-conceptual. | **Pass.** 'Reliable Process' covers everything by definition. |
  | **Readout Case** | **Testimony.** (Instrument as 'speaker'). | **Inference.** (Sign to meaning). | **Pass.** (If reliable). |
  | **Empty-Search** | **Inference.** (Non-perception as mark). | **Inference.** (Absence is conceptual). | **Pass.** (Reliable search process). |

  **Brief Analysis:**
  *   **Nyāya** offers the best phenomenological fit for human experience (we *feel* like hearing testimony is different from calculating inference) but fails on **Completeness** and struggles with **Irreducibility** regarding Comparison.
  *   **Buddhist** wins on **Parsimony** and **Irreducibility** but at the cost of phenomenological accuracy; it denies the intuitive distinctness of Testimony.
  *   **Modern Reliabilism** solves the **Readout Case** effortlessly (it is a reliable process) but fails the **Irreducibility** test so badly it ceases to be a *pramāṇa* theory at all; it dissolves the distinctions the classical schools were trying to map.

  ### V. Applying the Test to Your Cases

  To conclude your setup for the essay, here is how the **Irreducibility** and **Operational Distinction** criteria settle your two "non-canon" cases:

  1.  **The Readout Case:** Under **Irreducibility**, this is not Perception (you do not perceive the fact, only the number) nor standard Testimony (no agent intends to inform). However, if you drop **Completeness**, you can classify it as *Extended Testimony*. The instrument is a proxy for a human knower. If you demand **Strict Independence**, it fails. If you prioritise **Truth-Conducivity** and **Non-Reflective Access**, it is admitted easily.
  2.  **The Empty-Search Case:** This turns on **Irreducibility**. Is the knowledge of absence produced by the *search process* itself (Non-apprehension) or by the *logical gap* left by the search (Inference)? If your desiderata require a distinct causal mechanism for absence (as Mīmāṃsā does), it is a *pramāṇa*. If your desiderata prioritise **Parsimony** (as Buddhists do), it is Inference.

  **Recommendation:** For your essay, argue that the **Completeness** requirement is the error. The *pramāṇa* framework is a tool for mapping epistemic functions, not a closed ontology. This allows you to admit the Readout case (as a form of Testimony/Inference hybrid) without breaking the system, and treats the Empty-Search case as a matter of causal specification rather than numerical counting.
