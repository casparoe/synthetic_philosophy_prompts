      *   *Part (b):* This is the crucial correction. Need to explain *why* SSI usually looks at the subject's perspective on stakes, not objective stakes. Cite Stanley's link to practical reasoning. If Dana doesn't know about the grant, it doesn't affect her practical reasoning *about the bank*.
      *   *Part (c):* Point out that the "manufacturing knowledge" objection is standard but that SSI has a reply (knowledge is *supposed* to vary with practical needs). Also, note that Contextualism has its own action problem (how does the subject know which context they are in?).
      *   *Overall:* Encourage them to dig deeper into the *mechanisms* of the views, not just the predictions.

  5.  **Refining the Grading (Self-Correction/Calibration):**
      *   Is the error in (b) fatal? In a 2nd-year course, confusing objective vs. subjective stakes in SSI is a common but serious mistake. It fundamentally changes the view from "Subject-Sensitive" to "Objective-Sensitive." It warrants a significant deduction in that section.
      *   Is the writing style masking the error? Yes. The student writes with confidence ("Encroachment has to say..."). This makes the error harder to spot. I need to explicitly tell the TA to watch for "confident wrongness."
      *   Mark Breakdown:
