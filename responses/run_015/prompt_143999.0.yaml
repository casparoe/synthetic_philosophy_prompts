  **Note on Neuroscience and Form**

  This poem adopts the "two minds" hypothesis (championed by Roger Sperry) over the "unified consciousness with modular interpretation" model (championed by Michael Gazzaniga). While Gazzaniga argues that the left hemisphere's interpreter module creates a post-hoc narrative to maintain the *illusion* of a single self, this sestina argues that the illusion is structurally unsustainable. The form itself performs the fracture: the recursive end-words prevent the narrative from resolving, forcing the reader to experience the left hemisphere's confabulation as a desperate, looping failure rather than a successful synthesis.

  Regarding the anatomy, the poem specifies a partial callosotomy sparing the anterior commissure. In most clinical split-brain cases, the anterior commissure is also severed, completely isolating the hemispheres. By sparing it, I allow for the transfer of affective states (line 4: "sadness crosses") while maintaining the isolation of propositional language and motor commands. This is a theoretical liberty taken to heighten the philosophical conflict: the left hemisphere feels emotions it did not generate, proving the existence of the "other" even as it verbally denies it. The poem asserts that hemispheric autonomy is not merely functional but ontological; there is no "whole" to be found, only the bridge burning beneath the interpreter's feet.
