      *   *Addressing the "Narrow vs. Russellian" Question:* This is crucial. Narrow physicalism = physical properties exhaust reality. Panpsychism = physical properties + experiential intrinsic nature. They clash. Russellian Monism saves the day by saying physical properties are structural, experiential properties are intrinsic.
