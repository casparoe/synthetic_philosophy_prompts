      *Revised plan on (4) vs (5):* This is the "Pansuffering" problem. If (4) allows cosmic alignments to suffer, (5) demands we care. We can't. So (5) breaks. The fix is usually to restrict (4).

      *Revised plan on (2) vs (3):* This is the Combination Problem. It's not a logical contradiction, just a lack of mechanism. I will classify this as "Explanatory Vulnerability" rather than "Logical Tension."

