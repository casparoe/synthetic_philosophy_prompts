answer: |-
  Colonel Halvard Bruun: The coffee is cold, but the argument is still hot. Let's stay with Private Amara Sen. She drives supply trucks for Meridia. She believes she is resisting a foreign resource grab. Given her state media and her education, that belief is reasonable. She is epistemically blameless. On my view, that makes her the moral equal of the Kavalan soldiers trying to kill her.

  Dr. Leila Vosoughi: I agree she is blameless. I disagree that it makes her their moral equal. You are conflating three distinct questions. Is Sen blameworthy for fighting? No. Is she morally liable to be killed defensively? Yes. Is it permissible for others to kill her anyway? That depends on the costs.

  Colonel Halvard Bruun: You claim she is liable to be killed despite being blameless. That is a hard pill. Why does innocence not grant immunity?

  Dr. Leila Vosoughi: Because liability tracks the objective threat to rights, not the subjective state of the threatener. If a sleepwalker walks off a cliff and will crush you when he lands, he is not blameworthy. But you may still push him aside to save yourself, even if it kills him. Sen is materially contributing to a campaign that sustains ethnic cleansing. Her innocence explains why we might pity her, but it does not change the fact that she is part of an unjust force violating the Shen's rights.

  Colonel Halvard Bruun: So you save the Shen by making Sen expendable. But consider Kavala. Their war is mixed. They stop the cleansing, but they also intend to annex the province for cobalt. Roughly a third of their operations serve the annexation. We need names for the views here. Call it the severance view: soldiers serving only the just component retain their rights. Call it the contamination view: the unjust aim alters the whole campaign, so no Kavalan soldier claims the rights of a just combatant. You revisionists must pick one. Neither is comfortable.

  Dr. Leila Vosoughi: I pick the severance view. If the just component is genuinely independent, soldiers serving only that end are not violating rights. They are protecting the Shen. The unjust aim belongs to the leaders who ordered the cobalt operations.

  Colonel Halvard Bruun: Then consider Sergeant Tomás Iriarte. He is Kavalan. He enlisted explicitly to help annex Shen. He still wants that. But his unit has spent the whole war securing a refugee corridor. He has never fired his weapon. His actual contribution is just. His aim is unjust. Does his bad aim settle his status, or his actual contribution?

  Dr. Leila Vosoughi: His actual contribution. Liability is about what you do to the world, not what you dream of doing. If he saves refugees, he is not violating rights. But this shows why my view is nuanced. We judge the act, not just the uniform.

  Colonel Halvard Bruun: Nuance is a luxury in a firefight. Let me offer a device. The exchange test. To find out if a soldier is at fault, ask not what his cause is, but whether this same person, raised and placed on the other side, would have fought just as willingly. Most soldiers on both sides would have. They are products of their society. Therefore, combatants are morally interchangeable in the only sense that matters. The law of war is right to treat them as equals whatever their cause.

  Dr. Leila Vosoughi: I grant that the test returns the result you describe. Most soldiers are biddable. But the test measures the wrong thing. Liability does not track obedience or psychological symmetry. It tracks whether you are infringing on someone's right not to be killed. If I am raised in a culture that tells me to steal your land, and I do so, I am still stealing. My upbringing explains my action, but it does not negate your right to stop me.

  Colonel Halvard Bruun: That leads to my strongest worry. Practicality. If a soldier's right to kill depends on the objective justice of his war, and people on both sides disagree reasonably about that, then soldiers can almost never know whether they are permitted to fire. The rules of war become a moral trap rather than a guide. You demand they be judges of high statecraft.

  Dr. Leila Vosoughi: I will not pretend the difficulty is small. It is profound. But an ordinary soldier in that situation ought to inquire. If the justice of the cause is genuinely opaque, he ought to err on the side of caution. If he cannot tell whether he is defending rights or violating them, he should not fire. It is better to refuse a doubtful order than to kill unjustly.

  Colonel Halvard Bruun: And if he refuses, he is shot by his own side. Now, give me the hardest case for my own side. A Meridian conscript who personally endorses the ethnic cleansing and fights eagerly. And one who was beaten into uniform and fights as little as he can. Does your symmetry thesis really require treating these two as morally alike?

  Dr. Leila Vosoughi: No, I distinguish them on blame. But you treat them as equals in liability. You say both may be killed by Kavala, and both may kill Kavala.

  Colonel Halvard Bruun: Yes. That is what I admit. The law of war cannot parse the interior soul of every conscript in the fog of battle. To treat them differently is to invite endless vengeance and collapse the distinction between combatant and civilian. I live with the discomfort because the alternative is total war where every soldier is a war criminal or a saint based on facts he cannot know. The symmetry protects the reluctant man by shielding him with the zealot's uniform.

  Dr. Leila Vosoughi: But it also shields the zealot with the reluctant man's innocence.

  Colonel Halvard Bruun: It does. And that is the price of order.

  **Epilogue**

  Bruun: I would abandon symmetry if we could design a reliable mechanism to distinguish zealots from reluctant conscripts in real time without escalating violence. Vosoughi: I would abandon liability based on objective justice if it could be proven that requiring soldiers to judge their cause inevitably leads to more unjust killings than it prevents.
