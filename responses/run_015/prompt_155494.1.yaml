answer: |-
  Here is the breakdown of what is happening, who is right, and what you should do.

  ### The Short Answer
  **Do not play the bet.**

  There are two reasons. The first is simple arithmetic that your friend got wrong: if the expected payout is 69 cents, paying a dollar to play is a losing proposition, regardless of any paradoxes. The second is the mathematical pathology you discovered in your simulation: the "Expected Value" she is quoting is mathematically fragile in a way that makes it useless for decision-making.

  Here is the detailed explanation of why your simulation behaved that way, who reasoned badly, and how the "wrinkles" (the cap and the repetition) change the math.

  ---

  ### 1. The Arithmetic Dealbreaker
  Before we get to the paradox, look at the basic accounting.
  Your friend calculated the Expected Value (EV) of the **payout** to be $\approx \$0.69$.
  The **cost** to play is $\$1.00$.

  $$ \text{Net Expected Value} = \$0.69 - \$1.00 = -\$0.31 $$

  If someone offers you a box that contains, on average, 69 cents, and asks you to pay a dollar for it, you are losing 31 cents per transaction. Her argument that you are "leaving money on the table" is objectively false based on her own numbers. If the EV were truly positive *after* costs, she would be right. But by her own admission, the gross value is less than the entry fee.

  **Verdict:** Your friend failed the most basic check of betting logic.

  ### 2. Why Your Simulation Went Crazy
  You noticed the running average wouldn't settle. It would drift and then "lurch." Your ML friend told you to run more samples, but that advice was wrong. Here is why.

  To have a stable Expected Value that a simulation can find, a bet needs a finite **Absolute Expected Value**. This means if you take the absolute value of every possible payout (ignoring whether you win or lose) and average them, the number must be finite.

  Let's look at the absolute value of your payouts:
  *   Flip 1: Win $\$2$. Probability $1/2$. Contribution to average: $\$1$.
  *   Flip 2: Lose $\$2$. Probability $1/4$. Contribution to average: $\$0.50$.
  *   Flip 3: Win $\$2.67$. Probability $1/8$. Contribution to average: $\$0.33$.
  *   Flip $n$: Payout $\approx 2^n/n$. Probability $1/2^n$. Contribution $\approx 1/n$.

  The sum of these contributions is $1 + 1/2 + 1/3 + 1/4 + \dots$
  This is the **Harmonic Series**, and it **diverges to infinity**.

  **What this means:**
  While the *net* expectation (Wins minus Losses) sums to a finite number ($\ln 2 \approx 0.69$), the *total volume of money moving around* is infinite.
  In probability theory, if the expected absolute value is infinite, the **Law of Large Numbers does not apply.**

  Your simulation didn't converge because the "average" is not a stable property of this distribution. In any given run, you might hit a rare event (say, flip $n=30$) where the payout is massive. That single event will dominate the sum of all previous flips. If you run it again, you might not hit that event, and the average drops. It will never settle. Your friend who said "it isn't well defined... depends on the order" was the most mathematically accurate person in the room.

  ### 3. The Cap (Savings Limit)
  You argued the cap matters because "that's where the huge numbers live." Your friend argued the cap doesn't matter because "the probability is astronomically small."

  **You are right, but for a deeper reason.**
  Because the *absolute* expectation is infinite, the "tail" of the distribution (the rare, huge numbers) is doing an infinite amount of work to cancel itself out.
  *   **Without a cap:** The math relies on an infinite sum of positive terms canceling an infinite sum of negative terms. This is "conditionally convergent." It works only if you sum them in the exact order of flip numbers ($1, 2, 3, 4\dots$).
  *   **With a cap:** You truncate the series. The sums become finite. The Expectation becomes "well-defined" in the strict sense (no more $\infty - \infty$).

  Does the cap change the *number* much?
  Actually, no. The series $1 - 1/2 + 1/3 \dots$ converges to $0.69$ relatively quickly. By flip 20, the partial sum is already very close to $0.69$. So, capping it at \$30k (which happens around flip 18 or 19) keeps the EV at roughly 69 cents.
  **However**, the cap changes the *stability*. With a cap, the variance becomes finite. If you cap the bet, your simulation *would* eventually converge. Your friend is right that the *value* doesn't change much, but wrong that the cap "doesn't matter." Without the cap, the value is theoretically fragile; with the cap, it is robust.

  ### 4. Playing 200 Times (Repetition)
  Your friend argued that repetition favors you because "positive EV over and over."
  **This is false.**

  The logic that "repetition averages out risk" relies on the Law of Large Numbers. As established in section 2, the Law of Large Numbers **fails** for this bet (because the absolute expectation is infinite).

  If you play 200 times without a cap:
  You are not getting 200 stable samples. You are getting 200 samples from a distribution where one single outlier can outweigh the other 199 combined. The aggregate result of 200 games is *more* volatile, not less. You could easily end up down thousands of dollars despite the "positive expectation."

  If you play 200 times *with* a cap:
  Now the Law of Large Numbers works. But remember the arithmetic from Section 1? The EV is 69 cents. The cost is $1. Playing 200 times just guarantees you lose $0.31 \times 200 = \$62$ with high certainty. Repetition doesn't fix a negative net EV; it just makes the loss more predictable.

  ### 5. The Roommate's Objection
  Your roommate said: *"You lose most of the time."*
  **Factually:** This is incorrect.
  *   You win money on odd flips ($1, 3, 5\dots$).
  *   You lose money on even flips ($2, 4, 6\dots$).
  *   The probability of an odd flip is $1/2 + 1/8 + 1/32 \dots = 2/3$.
  *   You will actually walk away with a profit **67% of the time**.

  **Strategically:** She is still right to tell you not to play.
  While you win *often*, the times you lose are catastrophic. This is the difference between **Median** and **Mean**.
  *   **Median outcome:** You win a small amount (Flip 1 pays \$2).
  *   **Mean outcome:** Dragged down by the rare, massive losses on even flips.
  Her intuition about risk is correct, even if her frequency claim is wrong. She is identifying that the "average" is a lie in this specific scenario.

