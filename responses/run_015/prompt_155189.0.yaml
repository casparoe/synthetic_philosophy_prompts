answer: |-
  We search the crowded room to find a **face**,
  Someone who wrote the secret **rule**,
  Someone who called the sudden **turn**,
  Someone who set the hidden **cost**,
  Someone who told us all to **wait**,
  Someone who did **make** it happen.

  Nobody did **make** it alone.
  We all **face** it together.
  We all **wait** for the signal.
  We all follow the same **rule**.
  We all pay the same **cost**.
  We all take the same **turn**.

  You **turn** in work you didn't write.
  You **make** it shine with clever tools.
  You check the **cost** to your own mind.
  You **face** the grade without a worry.
  You learn the **rule** of getting more.
  You do not **wait** for others.

  Do not **wait** for open doors.
  Take your **turn** in the long line.
  Bend the **rule** to fit your shape.
  **Make** your own mark on the paper.
  **Face** the risk of standing out.
  Count the **cost** later, in silence.

  The **cost** of sleep is too high now.
  We **wait** up late to finish more.
  We **face** the sun with tired eyes.
  We **turn** the page to next year's plans.
  We **make** the list of perfect schools.
  We write the **rule** we must obey.

  No **rule** binds us from above.
  No one counts **cost** for everyone.
  No one **make** us do this thing.
  No one **wait** to stop the work.
  No one **turn** the wheel alone.
  No human **face** is watching.

  To **face** the **turn** and change the **rule**,
  We **wait** no more to pay the **cost**,
  But **make** the bond we cannot see.

  ***

  The six end-words are **face, rule, turn, cost, wait,** and **make**. I chose them because they are simple actions or objects that can shift from something an individual controls (like choosing to wait) to something that happens to us (like being forced to wait). The turn happens at the first line of the sixth stanza ("No rule binds us from above"), where the poem stops looking for a cause and starts describing the absence of one.
