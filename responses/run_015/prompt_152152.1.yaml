answer: |-
  Here is the teardown you asked for. I am taking the side of **determinism**. Your bureaucrat is not fighting culture; they are fighting the material substrate of time and attention that the economy demands. The idea that a culture can "choose" its moral emotion via institutional design is a liberal fantasy that ignores how emotions are distributed by material conditions.

  Here is the ranking of defeaters against your protagonist's project, from fatal to merely awkward.

  ### 1. The Publicity Paradox (Fatal)
  **The Argument:** Law is inherently performative. A legal ritual requires an audience (the state, the judge, the public record) to validate the sanction. Shame is, by definition, the fear of negative evaluation by an audience. Guilt is the internal evaluation of the self.
  **The Defeat:** You cannot design a *public* ritual that produces a *private* emotion. The moment you institutionalize a ritual, you create a stage. The moment there is a stage, the subject becomes aware of their status relative to the audience. Even if the script says "Judge this act," the human brain reads "Judge this person standing in the dock."
  **Why it's Fatal:** It strikes at the mechanism of your novel. If the bureaucrat designs a public tribunal to induce guilt, the very publicity of the tribunal induces shame. To induce pure guilt, the ritual must be private (confessional). But private law is invisible, unenforceable, and ceases to be a civic ritual. Your bureaucrat must choose: effective law (public/shame) or pure guilt (private/ineffective). They cannot have both.

  ### 2. The Economic Temporality Lock (Severe)
  **The Argument:** You posited that guilt is backward-looking (breach) and shame is forward-looking (exposure). You also suggested economics might lock this. I am arguing it *does* lock it.
  **The Defeat:** Guilt requires a stable moral ledger. It assumes a past self that was good, a specific action that was bad, and a future where restitution is possible. This requires **temporal stability**.
  Modern capitalist economies (especially gig/precarious ones) operate on **future-anxiety**. When survival depends on credit scores, employability, and social capital, the "future self" is constantly at risk. In a precarious economy, a breach isn't just a moral error; it's an existential threat to future viability. Therefore, the system *selects for* shame. Shame is the efficient emotion for a market society because it polices reputation, which is currency. Guilt is a luxury good for people with secure futures.
  **Why it's Severe:** If the city's economy is competitive or precarious, your bureaucrat is trying to install a "past-oriented" operating system on "future-anxiety" hardware. The institutions will fail not because they are poorly designed, but because the citizens literally cannot afford to feel guilt. They must feel shame to survive.

  ### 3. The Metastasis of Guilt (Moderate)
  **The Argument:** You claim guilt targets the act, not the self. Psychology suggests this boundary is porous.
  **The Defeat:** Repeated guilt induction without shame resolution often curdles into toxic shame. If the legal system constantly highlights "breaches" without offering a clear path to reintegration (which requires social acceptance), the subject internalizes the breach as a character flaw. "I did a bad thing" becomes "I am a person who does bad things."
  **Why it's Moderate:** This is a psychological implementation error, not a structural impossibility. Your bureaucrat could theoretically solve this with robust restorative justice mechanisms. It's a hurdle, not a wall.

  ### 4. The Motivation Deficit (Awkward)
  **The Argument:** Guilt is a weaker deterrent than shame.
  **The Defeat:** Shame leverages the tribe. Guilt leverages the conscience. In a pluralistic city, consciences differ. Tribes are powerful. If you remove shame from the law, you remove the social cost of crime. Recidivism might go up because the "sting" is private and manageable, whereas social ostracization is terrifying.
  **Why it's Awkward:** This is an empirical claim that could go either way. It merely suggests the city might become more crime-ridden, not that the project is philosophically incoherent.

  ---

  ### The Concessions You Must Make
  If you are being honest, you have to concede two things that weaken your protagonist's agency:

  1.  **Class Bias:** Your bureaucrat's system will work for the wealthy and fail for the poor. The wealthy have the privacy and temporal stability to process guilt. The poor live in high-surveillance, high-precarity environments where shame is the immediate reality. The "Guilt City" will become a segregated city where the rich feel guilt and the poor feel shame.
  2.  **The Privacy Trade-off:** To make guilt work, the bureaucrat must privatize the legal process. This reduces transparency. You cannot have a "Guilt Tribunal" that is livestreamed. If your protagonist succeeds, they must secretly undermine public accountability. They become an authoritarian to create liberals.

  ### Falsifiability Check
  **Verdict:** Your view is currently **unfalsifiable**, and you are qualifying it into a corner.

  **Why:** You have set up a safety valve: "If institutions fail, it's because the economic mode hasn't changed." This means no amount of institutional failure can prove your theory wrong; you just blame the economy.
  **How to Fix It:** To make this philosophically robust (and dramatically tense), you must allow for the possibility that **institutions can override economics.**
  *   *The Test:* If the bureaucrat creates a "Guaranteed Future" (economic stability) for the accused *and* privatizes the ritual, and shame *still* persists, then your theory is wrong. Shame might be anthropological bedrock, not economic superstructure.
  *   *The Risk:* If you don't allow this test, your novel is propaganda, not exploration. The bureaucrat must face a scenario where the economic conditions are perfect for guilt, and the people *still* choose shame.

  ### The Temporal/Economic Question: Take a Side
  You asked if the economic lock makes the "culture can choose" idea stronger or collapses it into determinism.

  **It collapses into determinism.**

  Here is the hard truth: **Emotions are technologies of time management.**
  *   **Guilt** is a technology for managing a **stable past**. It allows you to close a file, pay a debt, and move on. It fits an economy of accumulation and property.
  *   **Shame** is a technology for managing an **uncertain future**. It keeps you hyper-vigilant about your standing because your standing is your safety net. It fits an economy of precarity and reputation.

  If your city's economy is based on competition, credit, or social capital, it *requires* shame to function efficiently. A bureaucrat trying to install guilt is not just changing rituals; they are trying to slow down the economic clock. They are trying to make people feel like they have a "finished past" in a world that demands they optimize their "future potential."

  **Novelistic Implication:**
  Your bureaucrat is not a reformer; they are a reactionary. They are trying to impose an archaic emotional regime on a modern economic base. The tragedy isn't that they fail to make people feel guilt; it's that **succeeding would break the economy.** If people stop fearing exposure (shame), they stop polishing their reputations. If they stop polishing reputations, the social market freezes.

  **The Twist:** The bureaucrat realizes that Shame is the lubricant of the city's survival. To impose Guilt is to invite economic collapse. They must choose: Moral purity (Guilt) and societal stagnation, or Moral compromise (Shame) and societal vitality.

  That is the tear. Your protagonist isn't fighting bad design; they are fighting the fact that shame is the native emotion of survival.
