  **Scenario**

  You are the sole beneficiary of a family trust administered by your late aunt's lawyer, Mr. Henderson, who is retiring immediately after settling the estate. Six months ago, Henderson disbursed a $10,000 "hardship clause" to your personal account; the transfer is legally complete, irrevocable, and the funds are currently available to you. Henderson authorized this disbursement solely because, after reviewing your correspondence and interviewing you last year, he formed a judgment with 90% accuracy that you would voluntarily contribute $1,000 to the estate if a specific, unpredictable tax shortfall arose later. That shortfall has now materialized, and Henderson has formally requested the $1,000. You know Henderson is leaving the profession, so your decision carries no reputational weight, affects no future dealings, and triggers no contractual penalties; the money in your account is yours to keep regardless of your response, there are no observers to reward or punish your conduct, and you signed no prior pre-commitment contracts binding you to repay.

  ***

  **Demonstration**

  **Causal vs. Functional/Updateless Decision Theory**
  Causal Decision Theory (CDT) refuses payment. The disbursement is a past, fixed event; the payment is a future action. There is no causal channel from the payment to the past prediction or the current bank balance. Paying costs $1,000 and gains nothing, yielding a net utility of $-1,000 relative to refusing (which yields $0). Functional Decision Theory (FDT) and Updateless Decision Theory (UDT) recommend payment. They treat the agent's decision as the output of a logical algorithm that the predictor simulated. If the algorithm outputs "Pay," the predictor (90% accurate) likely predicted "Pay," meaning the $10,000 was disbursed. If the algorithm outputs "Refuse," the predictor likely predicted "Refuse," meaning the $10,000 was never disbursed.
  *Arithmetic:*
  $E[\text{Pay}] = 0.9(10,000 - 1,000) + 0.1(0 - 1,000) = 8,100 - 100 = 8,000$.
  $E[\text{Refuse}] = 0.9(0) + 0.1(10,000) = 1,000$.
  Since $8,000 > 1,000$, FDT/UDT pay. FDT and UDT do not come apart here; both treat the logical correlation between the decision and the prediction as decision-relevant despite the lack of causal leverage.
  *Break-even Accuracy:* The verdict flips when $E[\text{Pay}] = E[\text{Refuse}]$. Let $p$ be accuracy. $p(9,000) + (1-p)(-1,000) = p(0) + (1-p)(10,000) \Rightarrow 10,000p - 1,000 = 10,000 - 10,000p \Rightarrow 20,000p = 11,000 \Rightarrow p = 0.55$. The stated 90% accuracy clears this 55% threshold by a wide margin.

  **Evidential Decision Theory and the XOR Rig**
  Evidential Decision Theory (EDT) refuses payment. EDT conditions on known facts. The agent *knows* the benefit is settled ($P(\text{Benefit}) = 1$). Because the benefit is already observed, the action provides no new evidence about whether the benefit was disbursed; the evidential link is screened off by the observation of the funds. Paying is merely bad news (costing $1,000) without changing the probability of the benefit.
  *Minimal Change for EDT:* To make EDT pay, remove the agent's certainty that the benefit is settled. If the agent only knows "Henderson *said* he disbursed it," paying becomes evidence that Henderson's prediction was accurate (and thus the disbursement actually occurred), while refusing is evidence the prediction failed (and the disbursement was voided).
  *XOR Distinction:* This case is a Counterfactual Mugging, not XOR Blackmail. In XOR Blackmail, the *request itself* is contingent on the prediction (e.g., "I only ask if I predicted you would pay"). Here, the request (tax shortfall) is an independent event; only the *benefit* was contingent on the prediction. The structural difference is secured in the sentence: "That shortfall has now materialized... independently of Henderson's judgment." In Blackmail, the predictor creates the problem; here, the predictor only rewarded the disposition to solve it.

  **Load-Bearing Feature and Removal Tests**
  The load-bearing feature is the **logical dependency of a past fact on a present decision algorithm**, despite causal independence.
  *Removal Test 1 (Choice Before Disbursement):* If the agent chooses before the money arrives, the case becomes a standard Newcomb Problem. The divergence remains, but the temporal tension vanishes; CDT still refuses, FDT pays.
  *Removal Test 2 (Predictor Reachable):* If Henderson were not retiring, reputation or future bargaining becomes possible. CDT might pay to secure future benefits, collapsing the divergence. This constraint (retirement) was doing the real work in isolating the decision theory.
  *Removal Test 3 (Second Round):* Adding a second round creates an Iterated Prisoner's Dilemma structure. CDT might pay to signal cooperativity. The one-off constraint was essential to force the CDT refusal.

  **CDT Objections and Limitations**
  *Objection 1:* "The prediction is a past fact. Your decision now cannot change what Henderson thought six months ago." (CDT denies the logical counterfactual).
  *Objection 2:* "You see the money. The correlation is screened off. You are in the world where he predicted 'Pay', so you can safely defect." (CDT exploits the transparency).
  *Honest Note:* This scenario requires the reader to accept that an agent can reason about "what would have happened" regarding a past event that they *know* already occurred. FDT's verdict relies on the agent valuing logical consistency over the physical certainty of the bank balance (the "Transparent Newcomb" tension). Students may resist paying when the money is visibly in hand; the case demands they treat the *source* of the money as logically tied to their current output, even post-disbursement.
