answer: |-
  # The "Insulation Check": A Decision Procedure for Revisionist Pitches

  **Purpose:** To distinguish between *legitimate revisionism* (claims that are exposed to disciplinary correction) and *pseudohistory* (claims that are insulated from correction).
  **Runtime:** ~20 minutes per pitch.
  **Users:** Research editors and fact-checkers.
  **Core Logic:** A claim is pseudohistorical not necessarily because it is false, but because it is structured to survive being false.

  ---

  ## The Procedure Flow

  ### Step 1: The Clarity & Engagement Filter
  **Question:** Does the pitch clearly state the "Standard Model" it opposes and identify the specific mechanism by which the Standard Model is wrong?
  *   **Pass:** The pitch names the consensus view (e.g., "Bronze Age Collapse occurred c. 1177 BCE") and specifies the error source (e.g., "misinterpreted sediment layers").
  *   **Fail:** The pitch relies on vague terms like "mainstream historians refuse to ask" or "official timeline" without defining what the official timeline is.
  *   **Unclear:** The mechanism is hinted at but not detailed.
  *   **Branching:**
      *   **Fail:** **STOP.** Flag as *Pseudohistorical*. (Vagueness is an insulation tactic).
      *   **Unclear:** Request clarification from author. If not provided within 48 hours, **STOP.** Flag as *Pseudohistorical*.
      *   **Pass:** Proceed to Step 2.
  *   **Human Judgment Flag:** *None.* This is a binary clarity check.

  ### Step 2: The "Cost of Error" Test (Falsifiability)
  **Question:** What specific piece of evidence, if found, would force the author to abandon their core claim?
  *   **Pass:** The author identifies a concrete observation (e.g., "If strata X shows no ash layer, the volcanic theory is dead").
  *   **Fail:** The author states that no single piece of evidence would disprove it, or that contradictory evidence would be "reinterpreted."
  *   **Unclear:** The author lists evidence that supports them, but won't specify what would refute them.
  *   **Branching:**
      *   **Fail:** **STOP.** Flag as *Pseudohistorical*. (The claim is insulated).
      *   **Unclear:** **STOP.** Flag as *Likely Pseudohistorical*. (Insulation is suspected).
      *   **Pass:** Proceed to Step 3.
  *   **Human Judgment Flag:** *Low.* If the author says "Nothing would change my mind," it is an automatic fail. If they name something impossible to observe (e.g., "If aliens confirm it didn't happen"), treat as **Fail**.

  ### Step 3: The Disciplinary Bridge (Methodological Consistency)
  **Question:** Does the pitch use the standard tools of the relevant field to generate its new data, or does it reject those tools *a priori*?
  *   **Pass:** The pitch uses standard methods (radiocarbon, philology, genetics) but argues for a new interpretation of the results.
  *   **Fail:** The pitch rejects the validity of the field's core tools without offering a calibrated alternative (e.g., "Radiocarbon dating is fundamentally flawed everywhere" without a physics model).
  *   **Unclear:** The pitch uses a mix of standard tools and non-standard methods without explaining why the standard ones fail in this specific context.
  *   **Branching:**
      *   **Fail:** **STOP.** Flag as *Pseudohistorical*. (This is insulation via methodological rejection).
      *   **Unclear:** Proceed to Step 4, but add a **High Risk** tag.
      *   **Pass:** Proceed to Step 4.
  *   **Human Judgment Flag:** *Medium.* Distinguishing between "rejecting a tool" and "proposing a calibration error" requires domain knowledge. If the author claims a calibration error, is it testable? (See Step 4).

  ### Step 4: The Auxiliary Hypothesis Check (Ad Hoc Rescue)
  **Question:** When the pitch encounters conflicting data, does it explain the conflict via a testable auxiliary hypothesis, or via an untestable assertion of bias/error?
  *   **Pass:** Conflicting data is explained by a factor that can be independently verified (e.g., "The dates are off because of local reservoir effects, which we measured in Control Sample Y").
  *   **Fail:** Conflicting data is explained by untestable assertions (e.g., "The labs are biased," "The records were forged by a secret cabal," "The contamination is undetectable").
  *   **Unclear:** The explanation is testable in theory but not in the current pitch (e.g., "Future tests will show contamination").
  *   **Branching:**
      *   **Fail:** **STOP.** Flag as *Pseudohistorical*. (This is insulation via *ad hoc* rescue).
      *   **Unclear:** **Proceed to Step 5**, but mark as *Legit Revisionism (High Uncertainty)*.
      *   **Pass:** Proceed to Step 5.
  *   **Human Judgment Flag:** *High.* This is the critical distinction between "False" and "Pseudo."
      *   **Rule:** If the auxiliary hypothesis is *testable*, the claim is **Legit Revisionism** (even if likely false).
      *   **Rule:** If the auxiliary hypothesis is *untestable* or *circular*, the claim is **Pseudohistorical**.

  ### Step 5: The Values & Impact Call (Human Review)
  **Question:** Given the above, does publishing this pitch serve the magazine's mission, considering the risk of amplifying harmful narratives?
  *   **Input:** Verdict from Steps 1-4 (Legit vs. Pseudo).
  *   **Action:**
      *   If **Pseudohistorical**: Reject. (No values call needed; epistemic standard not met).
      *   If **Legit Revisionism**: Editor must decide.
  *   **Human Judgment Flag:** *Critical.* This is where "False" vs. "Pseudo" meets "Harmful" vs. "Useful."
      *   **Call 1:** A claim can be Legit Revisionism (testable, exposed) but still be racists, dangerous, or a waste of reader attention. You may reject a *Legit* pitch on values grounds.
      *   **Call 2:** A claim can be Legit Revisionism but extremely likely to be False. You may publish it as a "Hypothesis" rather than "Discovery."

  ---

  ## Worked Examples

  ### Example 1: The Mislocated Atlantis
  **Pitch:** Argues Atlantis was a real Bronze Age civilization in the Atlantic (not Antarctica/Americas). Uses geological data on sea-level rise and selective readings of Plato.
  *   **Step 1 (Clarity):** **Pass.** Clearly opposes the "Atlantis is myth/Allegory" consensus.
  *   **Step 2 (Cost of Error):** **Fail.** When asked what would disprove it, the author suggests "Lack of ruins" is explained by sea-level rise submerging everything. There is no observation that would rule it out (since the ocean is deep and unexplored).
  *   **Verdict:** **STOP. Pseudohistorical.**
  *   **Analysis:** The claim is insulated by the inaccessibility of the evidence. It fails the "Cost of Error" test. It doesn't matter if the geology is real; the *structure* of the argument prevents correction.

  ### Example 2: The New Chronology (Fomenko-style)
  **Pitch:** Argues that medieval chronology is a forgery and all history before 1600 is compressed. Claims radiocarbon dating is calibrated using historical assumptions, making it circular.
  *   **Step 1 (Clarity):** **Pass.** Clearly opposes standard chronology.
  *   **Step 2 (Cost of Error):** **Unclear/Fail.** The author claims dendrochronology is also forged. It is difficult to identify a piece of evidence they would accept, as they reject the dating methods themselves.
  *   **Step 3 (Disciplinary Bridge):** **Fail.** Rejects radiocarbon and dendrochronology *a priori* without offering a new physical dating method, only mathematical statistical analysis of texts.
  *   **Verdict:** **STOP. Pseudohistorical.**
  *   **Analysis:** This fails Step 3. It insulates itself by rejecting the tools of correction (physics/biology) used by neighboring disciplines. It is not revisionism; it is methodological isolationism.

  ### Example 3: The Contamination Hypothesis (The "Dislike" Case)
  **Pitch:** A well-funded team argues that a specific region's archaeology is 1,000 years older than thought. They use real radiocarbon dating but claim "Local Volcanic CO2" causes a systematic reservoir effect that mainstream labs ignore. They offer a chemical test to detect this CO2 signature in bone collagen.
  *   **Step 1 (Clarity):** **Pass.**
  *   **Step 2 (Cost of Error):** **Pass.** If the chemical test for the CO2 signature comes back negative in blind trials, the theory fails.
  *   **Step 3 (Disciplinary Bridge):** **Pass.** They use radiocarbon dating; they don't reject it, they propose a calibration variable.
  *   **Step 4 (Auxiliary Hypothesis):** **Pass (Technically).** The "contamination" is not an untestable conspiracy; it is a specific chemical marker they propose to measure.
  *   **Procedure Verdict:** **Legit Revisionism.** (Proceed to Step 5).
  *   **Editor's Dislike:** You (the Editor) dislike this answer. You suspect the "chemical marker" is a "zombie hypothesis"—it is *theoretically* testable but so expensive and difficult to verify that it effectively protects the claim from refutation for decades. It feels like insulation in practice, even if not in logic.
  *   **Resolution:** The Procedure forces you to acknowledge this is **not Pseudohistory**. It is a *risky scientific claim*. You can still reject it in Step 5 (Values/Impact) if you deem it a resource drain or likely to mislead, but you cannot label it "Pseudo." You must label it "Controversial Science."
  *   **Why this matters:** This prevents you from silencing a legitimate (if unlikely) scientific debate by calling it "fake history." It forces you to engage with the *truth* of the claim, not just the *structure*.

  ---

  ## Limitations: What This Procedure Cannot Settle

  1.  **Probability of Truth:** This procedure distinguishes *Pseudo* from *Legit*, not *False* from *True*. A pitch can pass all 5 steps and still be completely wrong. Step 5 is where you decide if a "Legit but Likely False" story is worth telling.
  2.  **Practical vs. Theoretical Falsifiability:** As seen in Example 3, a claim can be falsifiable in principle (Pass Step 4) but unfalsifiable in practice due to cost or technology. The Procedure treats these as "Legit." You must use editorial judgment to decide if "Legit but untestable for 50 years" fits your magazine.
  3.  **Motivation:** The Procedure analyzes the *text and structure* of the pitch, not the author's intent. A bad-faith actor can write a pitch that passes the checklist.
  4.  **Ethical Harm:** A claim can be methodologically sound (Legit Revisionism) but socially harmful (e.g., scientific racism). The Procedure will flag this as "Legit." **Step 5 is the only firewall against this.** Do not skip Step 5.
  5.  **Emerging Fields:** In very new disciplines (e.g., digital archaeology), "standard methods" (Step 3) may not exist. The Procedure may yield "Unclear" frequently in cutting-edge domains. Treat "Unclear" as a signal for deeper review, not an automatic pass.

  ## Quick Reference: The "False vs. Pseudo" Distinction

  *   **False Claim:** "The battle happened in 1065, not 1066." (Testable, uses standard methods, admits error if proven wrong). **-> Legit Revisionism.**
  *   **Pseudohistorical Claim:** "The battle happened in 1065, but records were altered by monks, and any carbon dating that disagrees is contaminated by the church's influence." (Untestable assertion of bias, rejects tools *ad hoc*). **-> Pseudohistory.**

  *Use this distinction to explain rejections to authors: "We are not rejecting this because it is wrong; we are rejecting it because it is structured to be uncorrectable."*
