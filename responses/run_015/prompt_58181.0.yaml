answer: |-
  Look, the key here is distinguishing between personal guilt and the responsibility of the office. When those two towns merged, they didn't just share a fence like neighbors; they combined their assets, their land, and their legal identity into a single continuing entity. The new city stands on the same ground and operates under the authority that grew out of those old towns, inheriting both the tax base and the history, including the deed to that cemetery. So when the council apologizes, it isn't saying every current resident is personally guilty, but that the community we govern today is the same entity that benefited from that exclusion. We are apologizing to the descendants and to the public record to say that the city they pay taxes to and live in no longer honors that exclusion, acknowledging that the stability we enjoy now was built on a foundation that treated some families as lesser.
