answer: |-
  Here is the procedure, the tools, and the run-through. It is designed to be neutral between religion, ideology, and secularism, focusing on **accessibility** and **adjudicability**.

  ### The 90-Second "Public Access" Procedure

  **Goal:** Determine if the submission offers a reason the Assembly can *adjudicate* (R) or only *witness* (C).

  **Step 1: The Civic Impact Filter (30 seconds)**
  *   **Question:** Does the submission claim a concrete impact on the ward's people, infrastructure, safety, or budget?
  *   **Yes:** Go to Step 2.
  *   **No:** (e.g., "This violates God's law," "This is sinful," "This offends dignity" with no link to harm). **→ BUCKET C.**
  *   *Note:* "Sin" is C. "Sin that causes noise/traffic/safety issues" is R.

  **Step 2: The Stripping Test (30 seconds)**
  *   **Question:** If you remove the religious/ideological vocabulary (God, Scripture, Marx, Rand, Natural Law), does the core argument collapse?
  *   **Yes:** (The premise *is* the doctrine). **→ BUCKET C.**
  *   **No:** (The doctrine is motivation; the argument stands on facts/shared values). **→ BUCKET R.**
  *   *Example:* "We oppose this because the Bible says no" (Collapses → C). "We oppose this because it increases traffic, which violates our duty to care for neighbours" (Stands → R).

  **Step 3: The Checkability Test (30 seconds)**
  *   **Question:** Does the submission make a factual claim that could theoretically be verified or falsified by the city (even if the submitter believes it for religious reasons)?
  *   **Yes:** (e.g., "This shelter will lose its license," "Needles will appear in the park"). **→ BUCKET R.**
  *   **No:** (e.g., "This corrupts the soul," "This violates the sanctity of life" as a metaphysical claim). **→ BUCKET C.**

  **Panel Rule:** If any *part* of the submission triggers **Bucket R**, the whole submission goes to **Bucket R**. You answer the R part in the report; you acknowledge the C part in the record.

  ***

  ### Laminated Card Version (Front & Back)

  **FRONT: THE 3 GATES**
  1.  **IMPACT:** Does it claim harm/benefit to the ward (safety, budget, traffic, housing)?
      *   *No* → **C (Conviction)**
      *   *Yes* → *Next Gate*
  2.  **STRIP:** Remove the God/Ideology words. Does the argument still stand?
      *   *No* → **C (Conviction)**
      *   *Yes* → *Next Gate*
  3.  **CHECK:** Is there a factual claim the city could verify?
      *   *No* → **C (Conviction)**
      *   *Yes* → **R (Reason)**

  **BACK: PANEL RULES**
  *   **Ignore Letterhead:** A church argument and a union argument are judged by text, not source.
  *   **One R Wins:** If it contains *any* civic reason, it goes to **R**.
  *   **Don't Edit:** Do not rewrite their argument to make it fit R. If it's welded, it's C.
  *   **Ideology Neutral:** Apply the same test to Ayn Rand, Marx, and the Bible.

  ***

  ### The "Don't Do This" List

  1.  **Don't translate for them.** If they say "This is an abomination," do not write in the report "The submitter is concerned about safety." If they didn't link it to safety, it's C.
  2.  **Don't judge truth, judge access.** Do not put something in C because the claim is false (e.g., "Vaccines contain microchips"). If it's a factual claim about public safety, it's R (and you answer it with facts). C is for claims that *cannot* be checked by public standards.
  3.  **Don't sniff for source.** A secular argument on church letterhead is R. A religious argument on union letterhead is C. Judge the text, not the logo.
  4.  **Don't hide behind "Values."** "Human Dignity" is C if it means "God's image." It is R if it means "Human Rights Code protections." Be specific in your notes.

  ***

  ### The Script (For Submitters)

  > "We record every submission in full to ensure your voice is heard; however, our report only responds to arguments based on shared civic impacts we can verify, so we can treat all residents equally regardless of their private beliefs."

  ***

  ### Case Run-Through

  **(a) Opposing supervised consumption site**
  *   *Text:* "Body is a temple, city complicit in sin, praying about it" + "Needles in park behind library."
  *   *Step 1 (Impact):* "Needles in park" is a safety/cleanup impact. **Pass.**
  *   *Step 2 (Strip):* Remove "temple/sin/prayer." Does "Needles in park" stand? **Yes.**
  *   *Step 3 (Check):* Can the city check for needles? **Yes.**
  *   **Result: BUCKET R.**
  *   *Action:* Report must address needle disposal/safety. Acknowledge the moral objection in the record, but do not argue theology.

  **(b) Shelter opposing late-night venue**
  *   *Text:* "30 years on block, noise pushes residents out, faith obliges protection."
  *   *Step 1 (Impact):* "Noise pushes residents out" is a housing/stability impact. **Pass.**
  *   *Step 2 (Strip):* Remove "faith obliges." Does "Noise pushes residents out" stand? **Yes.**
  *   *Step 3 (Check):* Can noise levels be measured? **Yes.**
  *   **Result: BUCKET R.**
  *   *Action:* Report addresses noise bylaws and housing stability. The faith obligation is the *motivation*, not the *argument*.

  **(c) Coalition opposing payday lender (Jubilee language)**
  *   *Text:* "Land isn't a commodity, debt has to be released, lender... is devouring the poor."
  *   *Step 1 (Impact):* "Devouring the poor" implies economic harm. **Pass.**
  *   *Step 2 (Strip):* Remove "Land isn't commodity/Debt released (Jubilee)." Does the argument stand?
      *   *Analysis:* "Devouring the poor" is metaphorical. If they do not cite specific interest rates, default rates, or bylaw violations, the core premise is "Debt *ought* to be released" (Moral Command).
      *   *Strict Read:* Without secular economic data, the claim rests on the moral axiom.
  *   *Step 3 (Check):* Can the city check "Land isn't a commodity"? **No.** That is metaphysics.
  *   **Result: BUCKET C.**
  *   *Action:* Printed in record. No response owed on the *merits* of Jubilee.
  *   *Note:* This is the danger zone. If they had added "Interest rates exceed 60% criminal code," it would be R. As written, it is a moral sermon.

  **(d) The Letterhead Case (School Start Times)**
  *   *Text A (Pastor, Science only):* Cites sleep science.
  *   *Text B (Pastor, Science + Stewardship):* Cites sleep science + "Stewardship of children's bodies."
  *   *Step 1 (Impact):* Sleep affects health/learning. **Pass.**
  *   *Step 2 (Strip):* Remove "Stewardship." Does sleep science stand? **Yes.**
  *   *Step 3 (Check):* Is sleep science checkable? **Yes.**
  *   **Result: BOTH ARE BUCKET R.**
  *   *Action:* The letterhead and the closing line do not change the bucket. You answer the science. You acknowledge the stewardship language in the record as the submitter's motivation.

  ***

  ### The "Hate" Case Analysis

  **You guessed (c). You are right.**

  **Why you will hate it:** As a Catholic, you know "Land isn't a commodity" is *true*. It is a profound truth about justice. Putting it in Bucket C feels like silencing prophecy. It feels like saying, "Your deepest truth doesn't count in public."

  **Why the procedure puts it there:** The Assembly is a municipal body, not a church synod. It adjudicates bylaws, budgets, and zoning. It cannot adjudicate "The nature of Land." If you accept "Land isn't a commodity" as a *Reason (R)*, you must answer it. How do you answer it? "We disagree, land is a commodity"? Now the Assembly is doing theology/metaphysics.

  **Should you overrule it?**
  *   **No.** If you overrule this because you agree with the theology, you have failed the neutrality test. Next month, a Randian submits "Property is an absolute right, taxation is theft." If you put *that* in C (because it's ideological) but put (c) in R (because it's *your* ideology), you are discriminating.
  *   **The Fix:** The procedure protects you from *yourself*. It forces the submitter to do the work of translation. If the Coalition had said, "High interest leads to eviction (Fact), which violates the Ward's housing stability goals (Civic Value)," it would be **R**. The procedure punishes lazy translation, not religious content.

  ***

  ### Where This Misfires (The Limitations)

  **1. Live vs. Written**
  *   **Written:** You must judge the text as it sits. If they didn't write the secular link, you can't assume it. (Bucket C).
  *   **Live:** If a person is at the mic, you can ask: *"I hear the moral concern. Can you tell us what specific impact on the ward you're worried about?"* If they answer "Evictions," you move it to **R** in your notes.
  *   **Risk:** This creates a two-tier system where articulate speakers get R responses and quiet writers get C records.
  *   **Mitigation:** In the report, for C submissions that *seem* to hint at civic harm, add a standard footnote: *"The Assembly notes this submission raises moral concerns. Submitters are encouraged to link moral concerns to specific civic impacts (traffic, safety, budget) to receive a substantive response."*

  **2. The "Prophetic Gap"**
  *   Sometimes the "Civic Impact" hasn't happened yet. A prophet says "This policy will dehumanize us." That is a prediction, not a fact.
  *   **Procedure Verdict:** **Bucket C.**
  *   **Hard Truth:** You cannot answer a prediction of dehumanization with a bylaw. You can only witness it. If you try to answer it, you will sound bureaucratic and cruel. Acknowledge the fear, but do not promise to adjudicate the metaphysical.

  **3. What This Cannot Settle**
  *   **Deep Disagreement on Facts:** If a submission says "This school teaches witchcraft" (Fact claim: Curriculum contains witchcraft).
  *   **Verdict:** **Bucket R.** It is a checkable claim.
  *   **The Mess:** You will have to answer "No, it does not." The submitter will say you are lying. The procedure does not solve distrust; it only ensures you are consistent in how you engage it.

  **Final Advice:** When the panel disagrees, default to **R**. It is safer to write one extra paragraph in a report than to tell a resident their voice doesn't count. But use the "Stripping Test" rigorously so you don't end up debating Genesis vs. Geology in the ward report.
