  ok so me and my friend just finished like a three hour argument about collective intetionality and joint action and im still kinda worked up about it. we were talking about whether a joint action can exist if one participant secretly holds a counter-intention that directly opposes the shared goal, even though they still perform their part perfectly. like picture a surgeon and an anastesiologist working together on an operation, but the anastesiologist privately wants the patient dead and is only administering the right drugs to keep up appearances. my friend says its still joint action because the observable coordination and the public we-intention are intact. i say no, because collective intentionality needs some kind of mutual openness or shared normative commitment, and this hidden "shadow intention" breaks it at the metaphysical level, not just epistemically.

  can you explain the conceptual issue here? specifically, does a hidden counter-intention in one party destroy the jointness of the action, or is joint action just defined by interlocking observable intentions and roles? and how does this relate to the we-mode versus i-mode distinction — can you salvage joint action by saying the betraying party is only in i-mode toward the plan while faking we-mode? also, what do you make of "fragmented commitment," where someone is instrumentally locked into the joint plan but rejects its normative core? is the failure epistemic (the other person just doesnt know) or metaphysical (the shared intention literally cant be formed with that internal conflict)? try to be precise and dont just dump citations on me, i want the actual conceptual logic worked out.
