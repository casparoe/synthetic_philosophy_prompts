answer: |-
  First, take a breath. Three hours is a marathon, and this is one of the stickiest problems in the philosophy of social action. The reason you're still worked up is that your intuition is hitting against a very specific fault line in the literature: the distinction between **functional coordination** (what it looks like) and **constitutive intentionality** (what it is made of).

  You are arguing for a **constitutive** view (the mental states *make* the action joint); your friend is arguing for a **functional/externalist** view (the behavioral interlocking *makes* the action joint).

  Here is the conceptual logic worked out, specifically addressing your questions about the "saboteur" anesthesiologist, the We-mode, and the metaphysical vs. epistemic distinction.

  ### 1. The Core Logic: Reciprocity vs. Parallelism
  The central issue is whether joint action is **two people doing the same thing** or **two people doing a thing *because* they are doing it together.**

  In your surgeon/anesthesiologist case:
  *   **Surgeon:** Intends "We save the patient."
  *   **Anesthesiologist:** Intends "I keep up appearances so I can kill the patient later" (or "I administer drugs *as a means* to maintaining cover").

  Your friend claims the action is joint because the *inputs* (surgery) and *outputs* (coordination) match. But conceptually, this reduces joint action to **coordinated parallel action.**

  For a joint intention to exist, most rigorous accounts (like Bratman's or Gilbert's) require a condition of **mutual responsiveness** and **interlocking commitment.**
  *   **Interlocking:** My plan must mesh with your plan.
  *   **Mutuality:** I must intend that we act, and you must intend that we act, and we must know this about each other.

  In the saboteur case, the interlocking fails at the level of *final ends*. The surgeon's plan relies on the anesthesiologist sharing the goal of "patient health." The anesthesiologist's plan relies on the surgeon *believing* they share that goal, while actually pursuing "patient death." Their sub-plans do not mesh; they are adversarial. Therefore, metaphysically, there is no "We" saving the patient. There is a "We" performing a procedure, but the *action description* "saving the patient" is not jointly held.

  ### 2. We-Mode vs. I-Mode (The Tuomela Distinction)
  You asked if we can salvage joint action by saying the betrayer is in I-mode while faking We-mode. **This is exactly the right move, and it supports your side of the argument.**

  *   **We-Mode:** The agent acts as a group member. The reason for action is "because we are doing X." The commitment is to the group's goal.
  *   **I-Mode:** The agent acts as a private individual. The reason is "because I want Y."

  In your scenario:
  *   The Surgeon is in **We-Mode**.
  *   The Anesthesiologist is in **I-Mode** (specifically, a *pro-group I-mode* that is deceptive).

  Can you have a joint action if one party is in We-Mode and the other is in I-Mode?
  **No.** A joint action requires a **plural subject**. If one leg of the table is a hologram, it's not a table, even if it holds weight for a moment. The anesthesiologist is not participating in the *joint agency*; they are participating in a *causal chain* that the surgeon *thinks* is joint agency.

  The "faking" proves your point. If they have to *fake* the We-mode, it acknowledges that the We-mode is missing. If the joint action were defined solely by observable behavior, there would be no need to "fake" the intention—the behavior would be sufficient. The fact that intention matters means the metaphysical structure is incomplete without it.

  ### 3. Fragmented Commitment: Instrumental vs. Normative
  This is the nuance of "fragmented commitment." The anesthesiologist is **instrumentally committed** to the steps (give the drug) but **normatively opposed** to the goal (save the life).

  Does this destroy jointness? **Yes.**
  Here is the logic: Joint action is not just about moving bodies in sync (like a flash mob where no one cares about the others). It is about **shared normative commitment.**

  When you enter a joint action, you grant the other person a kind of authority over your actions. The surgeon can say, "Give the epinephrine," and the anesthesiologist obeys *because it serves the joint goal.*
  In the saboteur case, the anesthesiologist does not grant the surgeon this authority. They obey only insofar as it serves their *private* counter-goal. If the private goal required *not* giving the drug, they would stop.

  This means the anesthesiologist is not truly a participant in the joint action; they are a **hostile environment variable** that is currently behaving predictably. The "jointness" is an illusion sustained by the surgeon's ignorance.

  ### 4. Epistemic Failure vs. Metaphysical Failure
  This is the crux of your argument with your friend.

  *   **Friend's View (Epistemic):** The joint action exists. The surgeon just has false beliefs about the quality of the partnership. The "We" is real, but fragile.
  *   **Your View (Metaphysical):** The joint action *cannot* exist with that internal conflict. The "We" is literally not formed.

  **You are conceptually stronger here.**
  Intentionality is not just a label we slap on behavior; it is a functional state of the mind. A "Shared Intention" is a specific composite mental state involving Agent A and Agent B.
  *   If A intends "We J"
  *   And B intends "Not-J (secretly)"
  *   Then the composite state "A and B intend We J" **does not obtain.**

  It is not that the intention exists and is hidden; it is that the intention **fails to assemble.** It is like trying to build a circuit with a broken wire. The electricity (coordination) might flow for a bit due to a bypass (the anesthesiologist's deception), but the circuit (the joint intention) is not closed.

  Therefore, the failure is **metaphysical**. The social object (the joint action) requires specific constitutive parts (mutual commitment). If one part is a counterfeit (the hidden counter-intention), the object does not come into existence. The surgeon is experiencing a *hallucination* of joint action, not a *flawed* joint action.

  ### 5. Why Your Friend Might Feel Right (and why they are wrong)
  Your friend is likely relying on a **third-person observer perspective.** From the outside, looking at the surgery, it *is* a joint operation. The patient is being operated on by a team.
  *   **Sociologically/Functionally:** It is a team.
  *   **Philosophically/Metaphysically:** It is not a joint agent.

  Your friend is conflating **Joint Action** with **Coordinated Interaction.**
  *   **Coordinated Interaction:** Two people moving in sync (can be deceptive).
  *   **Joint Action:** Two people moving in sync *grounded in a shared commitment* (cannot be deceptive).

  If the anesthesiologist succeeds and kills the patient, we look back and say, "They weren't really a team." We don't say, "They were a team that failed." We say the teamhood was a lie. That retrospective judgment confirms that the jointness was contingent on the internal states all along.

  ### Summary of the Conceptual Logic
  1.  **Constitution:** Joint action is constituted by interlocking mental states, not just behavioral alignment.
  2.  **Reciprocity:** Shared intention requires mutual knowledge and mutual commitment. A secret counter-intention breaks the reciprocity condition.
  3.  **Mode:** The saboteur is in I-mode (private goal), simulating We-mode. A mix of I-mode and We-mode does not create a Plural Subject.
  4.  **Failure Type:** The absence of the shared intention is a **metaphysical failure** (the thing doesn't exist), not an **epistemic failure** (the thing exists but is unknown).

  **Verdict:** You win the metaphysical argument. The "shadow intention" dissolves the collective intentionality at the root. The action remains *coordinated*, but it ceases to be *joint* in the strict sense of shared agency. The "We" was never born; only the "I" (surgeon) and the "I" (saboteur) existed, dancing a duet where only one knew the steps were a trap.
