answer: |-
  ### Audit of Analogy 1: The Net

  | Domain | The Net Analogy | The Archive |
  | :--- | :--- | :--- |
  | **Apparatus** | A net with a specific mesh size | Archival institution, appraisal policies, technology |
  | **Medium** | Water | The Past / Historical Reality |
  | **Objects** | Fish / Debris | Records / Documents |
  | **Action** | Catching or letting slip | Collecting, appraising, preserving, or discarding |
  | **Goal** | Maximize catch to represent the water | Maximize holdings to represent the past |
  | **Remedy** | Finer mesh (collect more) | Less appraisal, more digitization |

  **Disanalogies**
  *   **[Irrelevant]** Nets are physical tools; archives are bureaucratic institutions. (This is a category error but doesn't impact the logic of selection).
  *   **[Relevant]** Fish exist independently of the net; records often *come into existence* because of the archival/bureaucratic apparatus. The net is reflective; the archive is often constitutive.
  *   **[Relevant]** Water is generally uniform in composition; the "past" is unevenly distributed. A finer net in plankton-rich water catches more plankton, not more whales.
  *   **[Relevant]** A net is passive; an archive is active. The net does not choose which fish to attract; archivists and record-creators actively generate and select.

  ### Audit of Analogy 2: The Dog That Did Not Bark

  | Domain | The Dog Analogy | The Archive |
  | :--- | :--- | :--- |
  | **Agent** | The Dog | The Record Creator / State Institution |
  | **Signal** | Barking | Creating a Record |
  | **Stimulus** | A Stranger / Intruder | An Event / Group / Action |
  | **Absence** | Silence | Silence in the Record |
  | **Interpreter** | Sherlock Holmes | The Historian |
  | **Inference** | Silence proves no stranger entered | Silence proves an event/group was absent or ignored |

  **Disanalogies**
  *   **[Irrelevant]** Dogs are biological; institutions are social. (Does not affect the logic of inference).
  *   **[Relevant]** We know the dog's baseline behavior (it barks at strangers); we rarely know the archive's baseline (would this bureaucracy *normally* record this group?).
  *   **[Relevant]** The dog is a single agent; the archive is a chain of creators, custodians, and destroyers.
  *   **[Relevant]** Holmes knows the dog was *present*; historians often don't know if a record was ever *created* before inferring from its absence.

  ### Addressing the Complications

  **1. Sources of Silence**
  Both analogies flatten the genealogy of silence.
  *   **The Net** treats all silence as "slipping through." It cannot distinguish between a fish that was never in the water (nothing created), a fish that was caught and thrown back (destroyed/discarded), or a fish stuck in the net but unseen (uncatalogued). The remedy (finer mesh) only addresses the last two, and poorly.
  *   **The Dog** treats all silence as a signal. For Holmes, silence is a positive fact (the dog *did not* bark). In archives, silence is often a null set (no dog was ever there). The analogy encourages the historian to find meaning in a void that may simply be a vacuum of creation, not a deliberate suppression.

  **2. Administrative By-Products**
  This is the fatal flaw for **The Net**.
  *   If records are by-products of administration (tax, courts), the "water" is not "human life," it is "bureaucratic procedure."
  *   A finer mesh (collecting everything) does not catch more "truth"; it catches more "procedure." It increases the volume of the state's voice without amplifying the voices of the governed. It solves the problem of *preservation* but exacerbates the problem of *representation*.
  *   For **The Dog**, this complicates the baseline. The "dog" (bureaucracy) only barks at "strangers" who fit specific legal categories (taxpayers, property owners). If a group is not a legal category, the dog's silence tells us nothing about their presence, only about their legal invisibility.

  ### What Both Analogies Leave Out: Power and Who

  Both analogies depoliticize the question of **who** gets recorded.
  *   **The Net** implies a technical failure (mesh too coarse). It obscures the political decision to weave a mesh that excludes certain sizes or shapes of fish. It hides the archivist or state actor who decided that certain lives were not "catch-worthy."
  *   **The Dog** implies an epistemological puzzle (reading the silence). It obscures the power dynamic that determines which "strangers" warrant a bark. It treats the archive as a neutral witness that sometimes stays quiet, rather than a participant that chooses when to speak.
  *   **Missing:** The analogies fail to account for the *subject*. They do not map the power differential between the record-creator and the record-subject. They treat the absence of records as a problem of *recovery* rather than a problem of *structural violence*.

  ### Bottom Line: Does the Conclusion Survive?

  The seminar's practical conclusion—that more collecting and digitization closes the gap—relies entirely on **The Net**. It assumes the archive is a passive container suffering from technical limitations (mesh size).

  Once the disanalogies are on the table, this conclusion collapses. If the archive is constitutive (creating records through procedure) rather than reflective (catching pre-existing records), then "collecting more" simply amplifies the bias of the bureaucracy. Digitizing every tax register gives you a high-resolution image of the state's financial reach, not the peasant's lived experience. It creates data richness without historical truth. The **Dog** analogy offers a corrective (listen to silence), but it cannot save the "more is better" conclusion because it admits that some silences are structural, not accidental.

  ### A Better Analogy: The Map

  A superior analogy is **The Map**.
  *   **Mapping:** The Archive is a Map; The Past is the Territory.
  *   **Power:** Maps are drawn by conquerors or states to serve specific ends (taxation, war, navigation), not to mirror the territory neutrally.
  *   **Silence:** Blank spaces on a map do not mean "no land exists"; they mean "this land was not surveyed" or "this land was deemed irrelevant."
  *   **Resolution:** Making a map larger scale (digitization/more collecting) provides more detail on the *roads the state built*, but it does not reveal the *footpaths the locals use*.
  *   **Remedy:** The solution is not just "more map," but acknowledging the projection and seeking counter-maps (oral histories, community archives) that draw the territory differently.

  Verdict: DOES NOT SURVIVE, because the archive constitutes reality rather than merely catching it.
