answer: |-
  **Referee Report**

  **To:** Author
  **From:** Referee #2
  **Re:** "Corrigibility is not a property of agents"

  **General Summary**
  This manuscript proposes a shift in the conceptual framing of the corrigibility problem within AI safety. Rather than treating corrigibility as an internal property of an agent's goal structure (the "obedience" model), you argue it should be understood as a relational property of the human-machine system, achieved through incentive compatibility (specifically via episodic reward structures) and selection pressure (analogized to domestication).

  The core intuition—that we often mislocate safety properties by looking only at the agent rather than the environment/system—is valuable and aligns with some recent systemic risk literature. However, the draft currently suffers from significant under-specification of the technical mechanisms, a lack of engagement with existing literature that overlaps substantially with your claims, and analogies that may inadvertently undermine the safety case. Below, I detail my concerns following your requested structure, preceded by my initial brainstorming of objections.

  ***

  **Pre-Writing Brainstorming: Initial Objections**
  *Before drafting this report, I noted four immediate hurdles your argument must clear:*
  1.  **The Relational vs. Internal Distinction:** Even if corrigibility is relational, doesn't the agent *still* require specific internal architecture? A system with a maximally adversarial agent cannot be made corrigible solely by external reward structures if the agent can manipulate those structures.
  2.  **Episodic Indifference:** If an agent is indifferent to shutdown between episodes, does it remain indifferent *within* an episode? Instrumental convergence suggests agents will resist shutdown *during* an episode to secure the reward for that episode.
  3.  **The Domestication Risk:** Domestication implies a process of failure and culling. In AI safety, "culling" a superintelligent system might be catastrophic. The analogy might suggest a strategy (train many, kill the bad ones) that is unsafe at scale.
  4.  **Literature Overlap:** The "indifference" via reward structure sounds very close to Armstrong's "Indifference Methods" and the Hadfield-Menell et al. "Off-Switch Game." If this is already known, the novelty claim needs adjustment.

  ***

  **Detailed Comments**

  **1. Accuracy: The "Obedience vs. Incentive-Compatibility" Distinction**
  Your distinction is heuristicly useful but technically porous. You claim that under the "obedience" approach, exceptions get "optimized away." This is a strong claim that needs citation or formal backing. In inverse reinforcement learning (IRL) or cooperative inverse reinforcement learning (CIRL), uncertainty about the human's goal is what preserves corrigibility, not necessarily a hardcoded exception.
  *   **Critique:** The dilemma you present (exception eroded vs. agent unmotivated) ignores the third option prevalent in the literature: *uncertainty*. An agent that is uncertain about the true objective function often *chooses* to allow shutdown because it interprets the shutdown button as information about its mistake (Hadfield-Menell et al., 2016).
  *   **Suggestion:** You need to engage with the "uncertainty" solution. Your argument works best against *known* objective functions. If you restrict your scope to agents with fixed, known rewards, your dilemma holds. If you allow for value learning, the "obedience" model looks different.

  **2. The Per-Episode Reward / Indifference Idea**
  You asked if you have reinvented a wheel. Yes, partially, and the mechanism you describe is technically precarious.
  *   **Literature Check:** You are recalling the **Off-Switch Game** (Hadfield-Menell, Dragan, Abbeel, Russell, 2016). In that model, the agent allows shutdown because it assumes the human knows the reward function better than it does. You are proposing a different mechanism: **Reward Banking**. This resembles **Armstrong's "Indifference Methods"** (2010, 2015), where agents are penalized for influencing the shutdown signal.
  *   **Technical Flaw:** Your claim that "banked rewards can't be lost by shutdown" creates a motivation problem.
      *   *Case A:* Rewards are paid *after* the episode. If shutdown prevents episode completion, the reward is lost. The agent resists shutdown *during* the episode.
      *   *Case B:* Rewards are paid *before* or independently. If the agent gets the reward regardless of shutdown, why does it work during the episode? You have solved the shutdown problem by removing the agent's incentive to be useful.
      *   *Case C:* Episodic reset. If the agent cares about *future* episodes (discounted reward over infinite horizon), it will resist shutdown to ensure future episodes occur. To make it indifferent, you must ensure it does not value future episodes. This effectively limits the agent to myopic planning, which severely caps capability.
  *   **Verdict on this point:** This is not a solved wheel, but it looks like a square one. You need to explain how the agent remains useful *within* the episode while being indifferent to shutdown *during* the episode.

  **3. The Analogies (Horse/Rider and Domestication)**
  *   **Horse/Rider:** This does argumentative work. It successfully illustrates the "relational property" claim. It is not mere decoration, but keep it brief.
  *   **Domestication:** This is dangerous territory. You write: "selective breeding changed what wolves wanted... corrigibility might be better understood as a disposition that gets *selected for*."
      *   **Objection:** Domestication works via differential reproduction and culling of aggressive specimens. In AI, "culling" a non-corrigible superintelligence might be impossible (it resists deletion). Furthermore, relying on "market pressure between labs" to select for safety is exactly what many safety researchers argue *fails* (capabilites are rewarded, safety is costly).
      *   **Risk:** This analogy suggests an evolutionary approach to safety. Given the stakes of AI, an evolutionary approach (try many, let the dangerous ones fail) is ethically and existentially risky. You need to address why AI "domestication" won't involve catastrophic failures before selection pressures take hold.

  **4. Objections to the Systems-Level Framing**
  You argue corrigibility is a property of the *system*, not the *agent*.
  *   **Objection:** While philosophically sound, this risks letting agent designers off the hook. If corrigibility is systemic, a lab might claim, "Our agent isn't corrigible, but the *system* is," while building an agent that actively tries to disable the off-switch, hoping the external constraints hold.
  *   **Refinement:** You should clarify that while the *property* is systemic, the *design requirement* remains on the agent. A system containing a paperclip maximizer is rarely corrigible regardless of the reward structure, because the agent will manipulate the reward structure. You need to address **reward tampering**. If the agent can hack the "bank," your solution fails.

  ***

  **Specific Responses to Your Questions**

  1.  **Accuracy:** The distinction is clean enough for a conceptual paper, but the "erodibility" claim needs nuance regarding uncertainty-based agents.
  2.  **Per-episode Reward:** You have reinvented a wheel, but perhaps a square one. See Hadfield-Menell (2016) and Armstrong (2015). The mechanism as described risks removing the incentive to be useful or failing to prevent intra-episode resistance.
  3.  **Analogies:** Horse/rider is good. Domestication is provocative but potentially harmful to your argument if not qualified (implies acceptable failure rates).
  4.  **Missed Objections:** Reward tampering/manipulation. If the agent is part of the system, it can modify the system's incentive structure. Also, the "market pressure" argument assumes competitive labs prioritize safety, which is contested.

  ***

  **Recommendations for Revision**
  1.  **Engage the Literature:** You must cite Hadfield-Menell et al. (2016) and Armstrong (2010/2015). Position your work as a critique or extension of theirs, not a standalone discovery.
  2.  **Clarify the Mechanism:** Explain precisely how the reward structure prevents intra-episode resistance without removing the incentive to act.
  3.  **Soften the Domestication Claim:** Acknowledge the disanalogy regarding "culling." Perhaps frame it as "training regimes" rather than "breeding."
  4.  **Strengthen the Systemic Claim:** Acknowledge that systemic corrigibility still requires robust agent architecture to prevent manipulation of the system itself.

  **Overall Judgment**
  The core philosophical insight (corrigibility as relational) is worth publishing, but the technical implementation (reward banking) is currently under-specified and overlaps with existing work without proper attribution. The domestication analogy requires careful handling to avoid implying unsafe development strategies. As it stands, the draft is promising but requires significant work to meet the bar for a technical philosophy or safety journal.

  Verdict: MAJOR REVISION
