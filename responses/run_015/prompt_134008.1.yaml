answer: |-
  Here is the translation of those theoretical claims into your latent-variable framework, given your empirics (one dominant dimension, drifting loadings, sticky coordinates, enmity-driven identification).

  **1. Bobbio (Equality) vs. Seating Chart (1789)**
  *Translation:* Bobbio asserts **metric invariance** on a specific subset of items (equality/redistribution). He claims $\lambda_{equality}$ must remain positive and high across time $t$. The "Seating Chart" claim is that the dimension is a **historical fixed effect**—path dependence in the initialization of the optimization algorithm.
  *Verdict:* Your data (loadings swap out every few decades) falsifies Bobbio's strict invariance. The Seating Chart view fits the stickiness of coordinates despite content drift, but fails to explain why the dimension retains explanatory power. It's not just noise; it's a stable latent structure with time-varying indicators.

  **2. Elite Bargains vs. Temperament (Haidt)**
  *Translation:* "Bargains" models the party as a **coalition game** where $\theta_i$ is the core of a cooperative game with side payments. Stability comes from transaction costs, not preference similarity. "Temperament" models $\theta_i$ as a **deep latent trait** (psychological) with high test-retest reliability across generations.
  *Verdict:* Your finding that coordinates outlive doctrine supports Temperament *or* Branding, not Bargains (unless the bargaining structure is itself inherited). However, if enmity predicts position better than issues, the "utility function" includes a penalty for proximity to rivals, not just policy distance. This looks like a coalition constraint overriding preference estimation.

  **3. Contingent Bundle vs. Organic Worldview**
  *Translation:* "Contingent" implies **concept drift**: the loading matrix $\Lambda_t$ changes rank or structure over time. "Organic" implies a stable covariance matrix $\Sigma$ where issues are structurally linked.
  *Verdict:* Your empirics (issues swap out, dimension stays) confirm Contingency. The "Organic" view requires measurement invariance that doesn't exist. The dimension is real, but the items measuring it are not interchangeable across time.

  **4. Focal Point (Coordination Device)**
  *Translation:* The dimension is a **Schelling point**. It exists not because it maximizes variance explained, but because it minimizes coordination costs for coalition formation. It is an **equilibrium selection** mechanism. The label "Left" is a common knowledge signal that reduces search costs for allies.
  *Verdict:* This translates cleanly to your enmity finding. Parties cluster not by policy similarity but by coalition membership. The axis is real because the *game* requires a focal point to solve the coordination problem of who allies with whom.

  **5. Marxist (Class Latent)**
  *Translation:* Left/Right is **omitted variable bias**. Class position $Z$ is the true latent variable; the estimated $\theta$ is a proxy correlated with $Z$. The axis makes certain coalitions thinkable by masking class conflict with cultural signaling.
  *Verdict:* Plausible if $Z$ is unobserved. But if $\theta$ persists when class composition changes (e.g., working-class voting right), then $\theta$ has decoupled from $Z$. The axis becomes autonomous.

  ***

  **Residue Report: Indeterminacy and Invariance**

  **(a) Rotational and Sign Indeterminacy:**
  In your models, the axis is identified up to sign ($\theta$ vs $-\theta$). Standard practice fixes this by anchoring on known parties (e.g., Communists = Left). But your empirics suggest the sign is identified **relationally**, not substantively. The "Left" end is simply the negative pole of the dominant eigenvector of the *conflict network*.
  *Payoff:* The direction doesn't come from the items (loadings); it comes from the **structure of opposition**. If Party A fights Party B, they must have opposite signs. The "content" of Left/Right is merely the residual variance after the conflict structure is fitted. The sign indeterminacy isn't a statistical nuisance; it *is* the political content. Politics defines the axis by drawing the battle lines, not by filling out the survey battery.

  **(b) Measurement Invariance:**
  You asked if "Left" means the same thing if loadings change. Strictly: **No.** Metric invariance fails. Configural invariance (same number of dimensions) holds.
  *Payoff:* If the axis tracks enmity rather than doctrine, then "Left" is a **brand identifier**, not a policy bundle. It functions like a ticker symbol. The coordinate $\theta_i$ measures coalition membership, not ideological intensity. When you see a party flip 180 degrees on trade but stay at $\theta = -1$, you are observing **label stickiness** overriding **item response**. The latent trait is "Team A vs. Team B," not "Equality vs. Hierarchy."

  **What's Missing?**
  Your framework captures *position* and *conflict structure* perfectly. It cannot capture **constitutive rules**. Ideal-point models assume preferences exist prior to the vote. Much political theory argues the vote *creates* the preference. The "Left/Right" distinction isn't just a coordinate; it's a grammar that makes certain sentences intelligible and others nonsense.
  *Is the framework too thin?* Yes, on normativity. It tells you where they stand, not why they stand there matters.
  *Are the theorists saying less than they think?* Also yes. Much "ideology" talk is post-hoc rationalization of the coalition constraints your model picks up as enmity. The "Organic Worldview" crowd is describing the residuals of a coalition game and calling it a philosophy.

  **Bottom Line:** Your one dominant dimension is real, but it's a **conflict axis**, not a **policy axis**. The "Left/Right" label is the sign constraint required to identify the model in a world where enemies must be opposites. The theorists arguing about "equality" are describing the loadings; you are measuring the eigenvector. They are talking about the items; you are talking about the variance. Both are real, but yours predicts the votes. theirs justifies them.
