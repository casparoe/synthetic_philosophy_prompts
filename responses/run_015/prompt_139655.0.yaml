answer: |-
  This is a rigorous and honest audit of your moral intuitions. You have correctly identified that a single binary switch ("Duty: Yes/No") cannot map onto the terrain you have described. Your tentative principle is a strong start, but it fractures under the weight of Cases 5, 7, and the Structural Worry.

  Below is the test of your principle, the identification of the verdicts you must likely surrender, two competing principles (one simpler, one complex), and a recommendation on framing.

  ### Part 1: Audit of Your Tentative Principle

  **Principle:** (i) Duty exists when (Bad Averted >> Cost to Self). (ii) Blame is fixed by Salience (Senses vs. Statistics).

  | Case | Verdict | Principle Fit | Analysis |
  | :--- | :--- | :--- | :--- |
  | **1 (Pond/Suit)** | Must rescue. High blame. | **Pass.** | Cost ($600) << Bad (Death). Salience high. |
  | **2 (Pond/Interview)** | Must rescue. Lower blame. | **Pass.** | Cost (Career) < Bad (Death). Salience high. Clause (ii) explains the blame reduction. |
  | **3 (Charity)** | Ought, but don't. Low blame. | **Partial Fail.** | Clause (i) generates a *strong* duty (Life > $4k). Your intuition is "I ought" but not "I must." Clause (ii) explains low blame, but doesn't explain why the *obligation* feels weaker than Case 1. This fuels the Structural Worry. |
  | **4 (Message)** | Must (Injury); Ought (Loss). | **Pass.** | Scales with "Bad Averted." Shows the principle is gradient, not binary. |
  | **5 (Offset Fund)** | Feel released. | **Fail (Suspicious).** | Clause (i) looks at *outcome*. Outcome is unchanged. Principle says *No Duty*. You feel released, but admit reasoning may be bad. This is the "Ineffectualism" trap. |
  | **6 (Vaccination)** | Faint pull. | **Partial Fail.** | Expected value is positive. Clause (i) should demand this as strongly as Case 3 (scaled). Your "faint pull" suggests probability dampens the *duty*, not just the expectation. |
  | **7 (Neighbor's Pond)** | Stronger duty. | **Fail.** | Clause (i) is blind to history. A passerby and you have the same Cost/Benefit ratio. The principle cannot capture the "I built this" obligation without adding a clause on Causal Responsibility. |
  | **8 (20 Bystanders)** | Duty remains; others owe me. | **Fail.** | Clause (i) is agent-neutral. It cannot generate a duty *owed to you* by the other bystanders. It lacks a Fairness/Reciprocity clause. |
  | **9 (Risk)** | Duty vanishes at high risk. | **Partial Fail.** | Clause (i) says "Cost... small." Death is not a small cost. But where is the threshold? The principle lacks a **Risk Ceiling**. |
  | **Structural** | Reject "life of sacrifice." | **Fail.** | Clause (i) is aggregative. If Case 3 repeats daily, you lose everything. The principle lacks a **Saturating Constraint** (a limit on total sacrifice). |

  ### Part 2: The Hard Truths (Verdicts to Surrender)

  You asked which verdicts a defensible principle cannot keep. To achieve coherence, you must likely abandon two intuitions:

  1.  **Case 5 (The Offset Excuse):** You suspect you are reasoning badly here; you are. If the goal is saving the child, your $20 is part of the sufficient set. Relying on the "anonymous donor" to take your share is a form of free-riding on the donor's generosity. A defensible principle treats participation in a sufficient collective effort as obligatory, even if your marginal impact is zero.
  2.  **Case 1 vs. Case 3 (The Ontological Gap):** You treat Case 1 as "Must" and Case 3 as "Ought but..." based on proximity. A defensible principle must admit that the *normative force* is identical (a child dies either way). The difference is entirely in **Blame and Psychology**, not in the duty itself. If you keep the duty weaker in Case 3, you cannot solve the Structural Worry. You must admit the duty is equally strong, but that human psychology (and a defensible moral theory) accounts for the failure differently.

  ### Part 3: Two Principles

  Here are two ways to codify this. The first is "Cheaper" (simpler, more demanding, overturns your verdicts on 5 and 7). The second is "Complicated" (saves all your verdicts).

  #### Option A: The "Optimific Prerogative" Principle (Cheaper)
  *Adopts a consequentialist core with a limit on total sacrifice. Overturns Case 5 and Case 7.*

  > **The Principle:**
  > 1.  **Requirement:** You are required to perform an action if it prevents a very bad outcome and the cost to you is modest, provided that fulfilling this requirement does not exceed a **Sacrifice Ceiling** (e.g., 10% of income/time).
  > 2.  **Participation:** If a group action prevents a bad outcome and your contribution is part of the sufficient set, you are required to contribute, regardless of marginal offsetting (Case 5 is a Duty).
  > 3.  **Neutrality:** Your history with the danger (Case 7) does not increase the *rescue* duty, though it may create a separate duty of *reparation* or liability. The rescue duty is based on capacity, not causation.
  > 4.  **Blame:** Blameworthiness is modulated by Salience (your Clause ii) and the difficulty of compliance.

  *   **Verdicts Overturned:**
      *   **Case 5:** You must give the $20. The "offset" is irrelevant.
      *   **Case 7:** Your duty to rescue is the same as the passerby's. (Your extra obligation is to pay for the fence later, not to jump in *more* urgently).
  *   **Why adopt it:** It is robust, prevents free-riding, and solves the Structural Worry via the Sacrifice Ceiling.

  #### Option B: The "Pluralistic Rescue" Principle (Complicated)
  *Accommodates all your specific verdicts, including the special obligation in Case 7 and the offset release in Case 5.*

  > **The Principle:**
  > 1.  **Base Duty:** Prevent very bad outcomes when cost is modest (scaled by probability).
  > 2.  **Salience Modifier:** Duties triggered by direct perception (Case 1) are **Categorical**; duties triggered by testimony/statistics (Case 3) are **Discretionary** within limits.
  > 3.  **Causal Responsibility:** If you created the risk (even innocently, Case 7), your Cost Threshold for rescue is higher (you must endure more risk/cost than a passerby).
  > 4.  **Ineffectualism Clause:** If your contribution is causally redundant due to a specific offsetting donor (Case 5), you are released, provided the collective goal is still met. (Distinguishes Case 6 where no donor exists).
  > 5.  **Fairness:** If multiple rescuers are present (Case 8), duty is shared. If you act alone, others incur a debt of reciprocity to you.
  > 6.  **Risk Ceiling:** No duty exists if personal risk exceeds a specific threshold (e.g., >1% chance of death), regardless of benefit.
  > 7.  **Aggregation Cap:** Total sacrifice is capped to preserve a sphere of personal projects (Structural Worry).

  *   **Why adopt it:** It matches your current intuitions perfectly.
  *   **The Cost:** It is fragile. Clause 4 (Ineffectualism) is ethically dubious (see Part 2). Clause 3 conflates rescue with reparation.

  ### Part 4: Application to New Cases

  Using **Option A (The Cheaper/More Defensible Principle)**, here are the verdicts on your unlisted cases:

  1.  **The Future Victim (60 Years):**
      *   *Verdict:* **Duty exists, Blame is negligible.**
      *   *Reasoning:* The badness is equal (death), but the epistemic certainty is lower and salience is zero. It falls under the "Statistics" clause. It counts toward your Sacrifice Ceiling, but failing to act incurs little social blame.
  2.  **The Suffering Animal:**
      *   *Verdict:* **Duty exists, scaled to capacity.**
      *   *Reasoning:* If the suffering is "very bad" (comparable to a child), Clause 1 triggers. The cost must be modest. If the animal is in your pond (Case 7 variant), Causal Responsibility increases the cost you must bear.
  3.  **1 of 1000 Bystanders:**
      *   *Verdict:* **Duty exists, but cost threshold lowers.**
      *   *Reasoning:* You are not *necessary*, but you are *sufficient* (if others don't act). However, the **Fairness** clause (from Option B) or a **Probability** adjustment (from Option A) reduces the *cost* you are expected to bear. You must wade in if the water is shallow; you need not risk death if 999 others are doing nothing. But you cannot walk away entirely.

  ### Part 5: Framing Recommendation (Duty vs. Reasons)

  You asked whether this should be framed as a principle about **what I owe** or **reasons plus blameworthiness**.

  **Recommendation:** Frame it as **Reasons + Prerogative + Blameworthiness.**

  Your Case 1 vs. Case 3 split proves that "Duty" is the wrong single word. "Duty" implies a binary obligation that, if violated, warrants condemnation. Your intuitions reject this binary:
  *   In Case 1, Violation = Condemnation.
  *   In Case 3, Violation = Regret (yours) / Mild Disappointment (others).

  If you call both "Duties," you stretch the word until it breaks. If you call Case 3 "Not a Duty," you invite the accusation of immorality (a child dies).

  **The Precise Formulation:**
  > "Agents have **optimific reasons** to prevent very bad outcomes at modest cost. These reasons generate a **binding requirement** when the need is salient and the cost is low. When the need is statistical or the cost approaches the **Sacrifice Ceiling**, the requirement weakens into a **discretionary ideal**. **Blameworthiness** is determined not by the strength of the reason, but by the **epistemic access** (salience) and the **volitional ease** of acting."

  **Why this works for you:**
  1.  **Solves 1 vs 3:** Both have strong *reasons*. Case 1 is a *binding requirement* with high *blame*. Case 3 is a *binding requirement* (ontologically) but treated as a *discretionary ideal* socially due to low salience, resulting in low *blame*.
  2.  **Solves Structural Worry:** The **Sacrifice Ceiling** acts as a hard stop. Once you hit your cap (e.g., 10% of income), the "binding requirement" turns off, leaving only the "discretionary ideal."
  3.  **Solves Case 9:** High risk pushes the cost above "modest," turning the requirement off immediately.

  ### Final Advice

  Adopt **Option A (The Optimific Prerogative)** but frame it using the **Reasons/Blame split**.

  It forces you to accept that **Case 5 (Offsetting)** is a failure of reasoning on your part (you should give the $20) and that **Case 7 (Neighbor's Pond)** is a conflation of two duties (Rescue + Reparation). These are productive corrections. They simplify your moral landscape without demanding you become a saint.

  Your intuition in Case 3 ("I ought... I do not give") is the most dangerous one you hold. It allows you to acknowledge the truth without paying the price. The principle above forces you to admit: *Either I am failing a requirement, or I must acknowledge that my 'ought' is weaker than the child's need.* Given the Structural Worry, the honest answer is: **The requirement is real, but my blame is mitigated by human limitation.** Stop looking for a principle that lets you off the hook in Case 3; look for one that explains why you are still a decent person despite failing it. That is the function of the Blameworthiness Clause.
