              *   *Tension:* Law wants objective frequency (for legitimacy) but applies it to a unique case (requiring Bayesian belief). Frequentism cannot assign probability to a hypothesis (Guilt is true/false, not random). So, Frequentism *cannot* meet the demand of quantifying doubt in a single case without smuggling in Bayesianism.
