answer: |-
  You must abandon the verdict in Case 14 to accommodate a single principle: direct votes are proper only for specific local administrative decisions or voluntary expansions of liberty, and improper for constitutional lock-ins, minority rights restrictions, macro-fiscal balancing, or sovereignty shifts.

  The clause restricting votes to **specific local administrative decisions** is forced by Cases 1, 2, and 3, which you accept, contrasted against Case 7, which you reject; this resolves your incoherence in Case 12 by identifying that town mergers and tram lines are reversible administrative adjustments within a settled sovereign framework, whereas leaving a supranational union alters the sovereign framework itself. The clause permitting **voluntary expansions of liberty** is forced by Case 8, which you accept, contrasted against Cases 4 and 5, which you reject; this resolves your incoherence in Case 13 by confirming that the moral distinction between granting a right to the willing (assisted dying) and imposing a penalty or restriction on the unwilling (death penalty, minaret bans) is substantive, not special pleading. The clauses prohibiting **constitutional lock-ins**, **minority rights restrictions**, **macro-fiscal balancing**, and **sovereignty shifts** are forced by Cases 9 and 10, Cases 4 and 5, Case 6, and Case 7 respectively; these capture your intuition that direct democracy lacks the nuance for trade-offs, the protection for minorities, and the stability for foundational rules.

  The only verdict this principle cannot accommodate is Case 14, where you distinguish between council-initiated and petition-initiated votes. You ought to give this up. A principle governing *what* decisions are suitable for direct democracy cannot coherently depend on *who* places them on the ballot, unless you argue that petition campaigns inherently corrupt the question more than councils do; but since councils can also frame questions tendentiously, this distinction is likely mere distrust of populist mobilization rather than a principled boundary. If the subject matter is proper (like Case 1), the initiator should not matter; if improper (like Case 9), the initiator should not save it.

  Applying this principle to your unsettled cases yields the following verdicts. **Case 11 (International Treaty):** Improper. A treaty restricting future governments for thirty years is a constitutional lock-in and a sovereignty shift, functionally identical to Cases 9 and 10, regardless of how determinate the commitment seems. **Advisory Referendum:** Proper. Because it is non-binding, it does not dispose of interests or lock in rules; it serves as consultation without triggering the dangers of finality, provided the question itself does not violate the minority rights clause. **Citizens' Assembly with Binding Power:** Proper for cases otherwise excluded (like 6, 7, 11). Assemblies restore the capacity for trade-offs and deliberation that direct votes lack, making them suitable for macro-fiscal and constitutional questions where a yes/no ballot is too blunt. **Minimum Turnout/Quorum Rule:** Proper. This is a procedural safeguard that mitigates the risk of minority rule, reinforcing the principle's protection of vulnerable interests without altering the subject matter. **Vote on Whether to Hold a Vote:** Proper. This is a meta-administrative decision akin to Case 1, determining the process rather than the substantive constitutional order. **Secession Question (One-Fifth of Electorate):** Improper. Like Case 7, this is a sovereignty shift, not a local administrative adjustment; the scale implies a redefinition of the political unit itself, which belongs to the constitutional realm protected from simple majoritarianism.
