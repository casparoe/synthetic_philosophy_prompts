answer: |-
  The list cannot be jointly satisfied because Full Determinacy and Interest-Invariance are incompatible with any restricted composition view that accommodates the Ship of Theseus and clonal colonies without resorting to epistemicism.

  **Specification of Adequacy**

  1.  **Universal Applicability** [Non-Negotiable]: The principle must return a verdict for every plurality of concrete particulars, from particle pairs to galactic clusters, because a metaphysical ground for composition cannot arbitrarily restrict its own domain without circularity.
  2.  **Causal Non-Redundancy** [Preference of Non-Reductive Realists]: A composite's causal powers at a time must not be a plain duplicate of its parts' powers at that time, motivated by the exclusion worry that otherwise composites are causally idle epiphenomena.
  3.  **Temporal Locality** [Non-Negotiable for SCQ]: Whether the xs compose at $t$ must depend only on facts obtaining at $t$, because diachronic dependencies confuse the synchronic composition question with the distinct question of persistence.
  4.  **Interest-Invariance** [Preference of Metaphysical Realists]: Verdicts must not shift with the interests or concepts of observers, motivated by the court's need for objective facts that do not move with litigants' purposes.
  5.  **Full Determinacy** [Preference of Classical Logicians/Epistemicists]: The principle must return a strict yes or no for any plurality with no in-principle indeterminacy, motivated by the demand for semantic tidiness and legal decidability.
  6.  **Non-Vacuousness** [Non-Negotiable]: The principle must not be a tautology or merely redescribe composition, because an explanatory answer must distinguish cases of composition from non-composition.
  7.  **Diachronic Grounding** [Added, Non-Negotiable for Purpose]: The account must supply conditions for diachronic identity sufficient to track artifacts and organisms through material replacement, because the stated purpose requires ruling on persistence (cathedrals, ships) not just synchronic existence.

  **The Impossibility Result**
  The subset comprising **Interest-Invariance**, **Full Determinacy**, and **Diachronic Grounding for Artifacts/Organisms** is jointly unsatisfiable. Artifacts like ships and biological entities like clonal colonies possess boundaries that are inherently vague or concept-dependent; enforcing Full Determinacy requires drawing sharp boundaries where none exist naturally (epistemicism), while enforcing Interest-Invariance denies the conceptual dependence that defines artifacts, forcing either Universalism (everything is a ship) or Nihilism (nothing is a ship).

  **Most Exclusionary Requirement**
  **Full Determinacy** excludes the most candidate answers, as it eliminates all moderate restricted composition views that accept ontic vagueness, leaving only Universalism, Nihilism, or Epistemicism.

  **Assessment of Candidate Views**
  Universalism satisfies determinacy and invariance but fails diachronic grounding for specific artifacts by making every plurality an equally valid candidate for identity over time.
  Nihilism satisfies determinacy and causal non-redundancy but fails diachronic grounding by denying the existence of the composite artifacts and organisms the court and biologist must count.
  Organicism accommodates biological counting but fails interest-invariance and determinacy regarding artifacts like cathedrals, and cannot meet the determinacy requirement regarding the boundaries of life without arbitrary boundaries.
