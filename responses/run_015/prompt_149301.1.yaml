answer: |-
  **Exam Question: Anthropic Reasoning & Cosmological Models**

  **Question 4 (25 marks)**

  Consider two competing cosmological models, Model A and Model B. Both models predict that at the current cosmic time *t*, there are exactly 8 billion awake, observing agents. However, they differ on dormant potential observers:
  *   **Model A** predicts an additional 100 billion dormant observers who exist now but are not currently awake (though they might activate in the future).
  *   **Model B** predicts zero dormant observers; the 8 billion awake are the only observers that exist.

  Assume equal priors for both models. You are an awake observer at time *t*.

  Using the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), analyze how each framework updates the probabilities of Model A vs. Model B. Specifically, pinpoint where the predictions diverge. Finally, evaluate whether the "Presumptuous Philosopher" objection applies to this specific scenario. Is SIA acting presumptuously here, or is the objection misapplied given the dormant/awake distinction?

  *(Note: Keep your answer focused on the logic of the assumptions rather than historical exegesis.)*

  ***

  **Model Answer**

  To tackle this, we first need to apply the core logic of SIA and SSA to the observer counts provided. The crucial detail here is that empirical evidence—the fact that there are 8 billion awake observers—is identical under both models. The divergence lies entirely in the ontological status of the dormant 100 billion in Model A.

  Under the Self-Indication Assumption (SIA), you should reason as if you are a random observer drawn from the set of all possible observers, weighted by the probability of that world existing. SIA favors hypotheses with more total observers. In Model B, the total observer count is 8 billion. In Model A, the total count is 108 billion (8 billion awake + 100 billion dormant). Since SIA weights by total population size regardless of their current state of awareness, it strongly favors Model A. The likelihood ratio would be roughly 108:8, or 13.5 to 1 in favor of Model A. SIA treats the dormant observers as counting toward the "size" of the world, making it more likely that you find yourself in Model A simply because there are more "slots" for existence there.

  The Self-Sampling Assumption (SSA) works differently. SSA says you should reason as if you are a random sample from a specific reference class of observers. The result here depends heavily on how we define that class. If the reference class is strictly "awake observers at time *t*," SSA is neutral; both models have 8 billion members, so finding yourself awake provides no update. However, standard applications of SSA usually employ a broader reference class, such as "all potential observers." If dormant observers are included in the reference class, Model A has 108 billion members while Model B has 8 billion. In Model A, the probability of being one of the 8 billion *awake* ones is 8/108. In Model B, the probability of being awake is 8/8 (or 1). Thus, under a broad reference class, SSA favors Model B because being awake is more "typical" in a world without dormant peers.

  This is where the Presumptuous Philosopher (PP) objection becomes relevant. The PP objection argues that SIA allows philosophers to reject physical theories solely because they imply fewer observers, even without empirical evidence. In this scenario, the empirical evidence (8 billion awake) is equal. Yet, SIA rejects Model B almost entirely because of the hidden dormant population. This looks exactly like the presumptuous behavior Bostrom warns about: preferring a cosmology not because of data, but because it packs more people into the universe.

  However, one might argue the objection is misapplied if dormant observers shouldn't count toward "existence" in the SIA sense. If dormant entities aren't truly observers until they activate, SIA shouldn't weight them. But if we grant the prompt's premise that they are "observers" (just dormant), then SIA is indeed acting presumptuously. It allows us to infer the existence of 100 billion hidden entities purely from anthropic reasoning, overriding the lack of empirical distinction. Therefore, the PP objection holds here. SIA yields a confident prediction about dormant populations without looking out the window, which seems epistemically reckless. SSA avoids this by penalizing Model A for making your current awake state less typical, but only if you accept dormant beings are in your reference class. Ultimately, this setup highlights that SIA's sensitivity to total population size creates a divergence from SSA that invites the PP critique when empirical data is held constant.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. SIA Application (5 marks)**
  *   **Must Hit:** Student must identify that SIA favors Model A due to higher total observer count (108b vs 8b).
  *   **Wrong Move:** Claiming SIA is neutral because awake counts are equal, or that SIA favors Model B.

  **2. SSA Application & Reference Class (5 marks)**
  *   **Must Hit:** Student must explain that SSA favors Model B *if* dormant observers are in the reference class (due to typicality of being awake).
  *   **Wrong Move:** Ignoring the reference class dependency or claiming SSA always favors Model A.

  **3. Divergence Point (5 marks)**
  *   **Must Hit:** Clearly pinpoint that the divergence arises from how "total observers" vs. "current awake observers" are weighted.
  *   **Wrong Move:** Focusing only on priors or external empirical evidence not in the prompt.

  **4. Presumptuous Philosopher Analysis (5 marks)**
  *   **Must Hit:** Must argue that the PP objection *does* apply because SIA favors A without empirical differentiation.
  *   **Wrong Move:** Stating PP only applies to infinite universes or claiming it doesn't apply because the observers are dormant.

  **5. Coherent Conclusion (5 marks)**
  *   **Must Hit:** Final stance must be consistent with the earlier analysis (e.g., if SIA is presumptuous, acknowledge the epistemic risk).
  *   **Wrong Move:** Contradicting the earlier probability analysis in the conclusion or failing to take a stance.

  *(Note: Deduct 2 marks for excessive hand-waving on the dormant/awake distinction.)*
