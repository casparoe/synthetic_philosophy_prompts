  Write a poem of seventeen lines in unrhymed iambic pentameter (blank verse), divided into two stanzas: the first of eight lines, the second of nine. The first stanza should present a speaker acting on an immediate, unmediated commitment—pulling a drowning child from a river—without any reflective justification. The second stanza should reproduce the first stanza line for line in the same sequence, but with exactly one additional line inserted after the line that corresponds to the fourth line of the first stanza; this inserted line must contain the speaker's explicit impartial utilitarian calculus weighing lives saved numerically. Apart from this insertion and the minimal grammatical adjustments it requires, the two stanzas should be identical.

  The structural turn should occur precisely at this inserted line, so that the repetition makes the intrusion feel like an unwelcome echo that fractures the original directness. Render the philosophical content with accuracy to Williams's integrity objection: the difficulty is not that the calculation is false, but that having it—having one thought too many—reveals the speaker's direct attachment as inadequately grounded. Use British English spelling and vocabulary throughout. Do not provide bibliographies, citations, reading lists, or references to specific page numbers. Leave the tension unresolved: do not conclude whether the speaker should suppress the calculation or whether the direct commitment survives it.
