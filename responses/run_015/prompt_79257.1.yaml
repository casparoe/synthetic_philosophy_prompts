              *   The student's logic rests on the "recombination = not novel" premise. If that premise fails, the conclusion fails.
              *   Also, the student says "The two cases differ only in the medium of production." This ignores the Consequence 2 constraint they previously violated. The photographer *could* honestly claim because of her causal relation (light capture), whereas the prompt-writer's causal relation is different.
