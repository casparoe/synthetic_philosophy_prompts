              *   *Second Disanalogy:* Student argues the model's output is a "recombination of training data," therefore "not novel," therefore "not creative."
              *   *Handout Check:* "Novelty is the production of something that has not existed before." Is a recombination novel? Usually, yes, unless it's an exact copy. The student asserts "If the output is a recombination... the image is not novel." This is a contested empirical/philosophical claim, not a definition from the handout.
              *   *Authorship vs. Creativity:* Student concludes: "she authors the image, but the creativity in it belongs to no one."
