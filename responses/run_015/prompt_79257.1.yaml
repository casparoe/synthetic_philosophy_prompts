      *   *Claiming:* Act of taking up as one's own (select, present, revise, become addressable for praise/blame).
      *   *Authorship:* Status conferred by claiming.
      *   *Novelty:* Production of something that has not existed before.
      *   *Creativity:* A *success term*; names the *achievement* for which a maker is praised.
      *   *Consequence 1:* Authorship is not causal. Machine may make without authoring; person may author more than made.
      *   *Consequence 2:* Claiming is not free-floating. To claim is to be answerable. What one can *honestly* claim depends on *how the artifact came to be* and *what she knows of it*.

  3.  **Analyze the Student's Answer:**

      *   **Part (a): The Photographer**
          *   *Student's Claim:* Photographer didn't make the arrangement (crowd, light), but claimed it (recognized, printed, stands behind it). Making and claiming come apart. Authorship goes with claiming.
          *   *Handout Check:*
