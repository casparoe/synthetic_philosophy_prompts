answer: |-
  1. **Order of Components and Dependencies**

      *   **Step 1: The Reality of Change.**
          *   *Dependency:* You must secure agreement that objects genuinely change their intrinsic properties (e.g., the leaf is green, then red) before introducing the logical problem.
          *   *Risk if skipped:* If students treat change as illusory or merely Cambridge change (relational only), the Problem of Temporary Intrinsics dissolves, and perdurantism looks like an unnecessary complication.
      *   **Step 2: The Logical Problem (Leibniz's Law).**
          *   *Dependency:* You must formalize the intuition from Step 1 into a contradiction ($x$ is $F$, $x$ is not-$F$) before offering solutions.
          *   *Risk if skipped:* If you present perdurantism before the contradiction, it appears as a solution in search of a problem. Students will not feel the *pressure* that forces us to accept temporal parts.
      *   **Step 3: Endurantism as Relationalism.**
          *   *Dependency:* You must present the standard endurantist fix (properties are relations to times: $F$-at-$t$) before critiquing it.
          *   *Risk if skipped:* If you jump straight to "Endurantism says wholly present," students will miss *how* endurantists solve the contradiction. They need to see the relational move to understand why Lewis found it unsatisfactory (it makes intrinsics extrinsic).
      *   **Step 4: Perdurantism as Temporal Parthood.**
          *   *Dependency:* You must introduce temporal parts only after the relational solution has been shown to have a cost (the loss of genuine intrinsics).
          *   *Risk if skipped:* If introduced too early, students treat temporal parts as a spatial analogy (the "road" error). They need to see temporal parts as a *logical necessity* to preserve intrinsics, not just a spatial extension.
      *   **Step 5: The Ontological Cost.**
          *   *Dependency:* You must compare the costs (extrinsic intrinsics vs. fragmented objects) only after both solutions are on the board.
          *   *Risk if skipped:* If evaluated piecemeal, students will adopt the first view that sounds plausible without seeing the trade-off. The debate is about which cost is higher, not which view is "true" in isolation.

  2. **The Carrying Example**

      **Selection:** **A Leaf** (specifically, one that turns from green to red in autumn).

      **Criteria for a Carrying Example:**
      *   **Must Have:** Clear *intrinsic* qualitative change (color/shape); obvious numerical identity (it is clearly the *same* leaf); no psychological or ethical baggage.
      *   **Must Lack:** Complex composition conditions (to avoid Ship of Theseus distractions); event-like structure (to avoid process ontology); personhood (to avoid psychological continuity).

      **Evaluations:**
      *   **Ship of Theseus:** **Reject.** It focuses on *identity conditions* (when does it cease to be the ship?) rather than *persistence* (how does it persist while changing?). It invites fission scenarios too early, distracting from the temporary intrinsics puzzle.
      *   **Cat that loses a limb:** **Reject.** It conflates spatial parts with temporal parts. Students will struggle to distinguish "the cat has a part missing" from "the cat has a temporal part missing." It invites biological essentialism (is it still a cat?).
      *   **Game of Chess:** **Reject.** It is an event, not an object. Perdurantism is almost trivially true for events. Using it biases the room toward perdurantism by selecting a category where temporal parts are intuitive.
      *   **Human Being:** **Reject.** It introduces psychological continuity, moral status, and soul/body dualism. Students will argue about memory or consciousness rather than the metaphysics of properties and parts.

  3. **Misconceptions and Terminology**

      *   **Misconception 1: "The object is spread out in time like a road in space."**
          *   *When to head off:* Immediately upon introducing Step 4 (Perdurantism).
          *   *Correction:* Emphasize that temporal parts are not "slices" we can see all at once; they are ontological constituents required to bear properties. The road analogy suggests we can view the whole object from outside time, which presupposes the Block Universe (see below).
      *   **Misconception 2: "The dispute is merely verbal."**
          *   *When to head off:* During Step 5 (The Ontological Cost).
          *   *Correction:* Show that they disagree on truth-makers. For the endurantist, "The leaf is green" is true in virtue of the whole leaf. For the perdurantist, it is true in virtue of a *part*. This is a disagreement about what exists, not just how we speak.
      *   **Banning "Four-Dimensional" and "Block Universe":**
          *   *Verdict:* **Helpful.** "Four-dimensional" encourages the spatial road error. "Block Universe" conflates persistence (how objects exist through time) with the ontology of time (whether past/future exist).
          *   *Replacement:* Use **"Temporally Extended"** (for perdurantism) and **"Wholly Present"** (for endurantism).
          *   *Handling the Read-Ahead Student:* Acknowledge the term, but park it. Say: *"That is a commitment about the nature of time itself; right now we are determining the nature of the object. We cannot settle the container before we know what we are putting inside it."*

  4. **The Check (Last Five Minutes)**

      **Selection:** **"If only the last ten seconds of a person's life had ever existed, would that person have existed at all?"**

      **Why this discriminates:**
      *   **Endurantist:** **Yes.** The person is wholly present at each moment. If the last moment exists, the person exists (at that moment). Existence does not require temporal extension.
      *   **Perdurantist:** **No.** The person is the sum of temporal parts (the "worm"). If only one temporal part exists, the sum does not exist. A proper part is not the whole object.
      *   **Why the others fail:**
          *   *Relay Team:* This tests collective identity or team persistence, not the metaphysics of a single object's persistence. Both views can agree the team persists while members change.
          *   *Instantaneous World/Change:* Both views should answer "No." Change requires different properties at different times. If there is only one instant, there is no time for change. This tests the definition of change, not the nature of persistence.

  5. **What to Decline**

      **Topic:** **Presentism vs. Eternalism (The ontology of time).**
      **Sentence:** *"We are asking what **persists**, not what **time is**; to answer the latter now would be to solve the container before we have identified the contents."*

  6. **Stage Theory**

      **Decision:** **Leave it out entirely.**

      **Reason:** In a seventy-minute session with second-year students, Stage Theory functions as a *dissolution* of the tension rather than a engagement with it. It solves the Problem of Temporary Intrinsics too easily (the stage is only ever one color), which robs the students of the struggle required to understand why Endurantism and Perdurantism are costly. Furthermore, as you noted, it inevitably collapses into a semantic variant of perdurantism in their hands, reinforcing the "merely verbal" misconception you are trying to head off. Keep the binary tension sharp: Wholly Present vs. Temporal Parts.
