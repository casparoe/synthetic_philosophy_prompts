  I'm writting a historical novel set around 1914 and I'm trying to work out how my characters—diplomats, generals, cabinet ministers—should feel about national blame, so I mapped my own gut reactions to specific cases and now I need to know if they hang together. Here they are, mostly concrete: Germany's leadership deliberately using the July crisis to launch a preemptive continental war feels definately blameworthy, full stop. Austria-Hungary issuing that ultimatum to Serbia knowing it was designed to be rejected also feels blameworthy, though slightly less so since Serbia's prior actions genuinely provoked them. Russia ordering full mobilization before diplomacy was exhausted strikes me as procedurally blameworthy, yet heavily mitigated because they sincerely believed they were defending an ally. Britain entering the war over Belgium feels morally okay on that count, but since they were also quietly protecting imperial balance, I want to split the blame—blameworthy for the imperial motive, not for the Belgian one—which already feels like I'm cheating. Then there's the Fischer thesis: if Germany alone had long-planned aggressive world domination, I think blame should collapse almost entirely onto Germany; but if everyone was just sleepwalking into catastrophe, I still feel Germany bears a little more because the Schlieffen Plan was structurally offensive, though I can't defend why that tips the scale if intentions were defensive all around. Finally, in a hypothetical where every leader sincerely thought they were acting defensively but structural alliance pressures made war inevitable, I want to say no nation is blameworthy, yet that feels like letting everyone off too easily.

