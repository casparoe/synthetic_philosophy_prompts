answer: |-
  **Alex:** In your phantom case, since no heat signal ever reaches the brain, the burning sensation is literally a false alarm. That suggests pain isn't a real object we perceive, but just the brain misrepresenting safety as danger.

  **Jamie:** But a false alarm is still loud. Just because the skin isn't burning doesn't mean the suffering isn't happening. The experience itself is the only thing that's definitely real to them.

  **Alex:** You're missing the point. If the brain generates the "ouch" without the actual damage signal, then the feeling is just a functional trick. It's an illusion of a property that isn't there.

  **Jamie:** An illusion of what? If I feel burning, I feel burning. You're saying because the cause is internal, the feeling is fake. But who are we to tell them their pain isn't real?

  **Alex:** We're saying the *quality* they report—the "heat"—doesn't exist in their body or their nerves. It's like a computer icon: it represents a file, but the icon itself isn't the file. Icons can be wrong.

  **Jamie:** But the icon appearing on the screen is a real event. You're trying to reduce the seeing of the icon to nothing because the file isn't there. The seeing is the consciousness.

  **Alex:** If the icon pops up randomly, it's noise. If consciousness is just noise masquerading as signal, then phenomenal experience is basically a hallucination we can't turn off.

  **Jamie:** Exactly! It's a hallucination. But hallucinations are still experiences. You can't explain away the fact that something is happening there.

  **Alex:** I'm not explaining away the behavior, I'm saying the "inner glow" you think is there is just the brain processing error signals. There's no extra magic substance called "feeling."

  **Jamie:** But that error signal *is* the feeling. To say it's "just" a signal is to ignore the only part of the universe we know directly.
