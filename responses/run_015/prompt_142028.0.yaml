answer: |-
  **MEMORANDUM**

  **TO:** Operations and Public Health Committee, Cascade Regional Water Authority
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion and Proposed Decision Rule Regarding Ozonation Pilot and Conversion Protocol

  ### 1. Executive Summary and Bottom Line

  We are asked to vote on a two-year ozonation pilot with a conversion decision following in year three. Staff recommends approval based on a cost-benefit analysis (CBA) that pools eleven toxicological judgments into a single probability distribution.

  **My recommendation is to authorize the pilot, but to reject the staff's proposed method for evaluating the year-three conversion.**

  The staff's current method treats deep uncertainty (disagreement on model class) as risk (variance within a known model). This masks the possibility that the "average" expert opinion is structurally wrong. To proceed, we must adopt an explicit **Two-Stage Ambiguity Protocol**. This protocol distinguishes between *learning investments* (the pilot) and *operational commitments* (the conversion).

  **Specific Decision:**
  1.  **Authorize the Pilot:** Approved, provided the cost does not exceed the calculated Value of Information (VoI) regarding the unknown byproducts.
  2.  **Define the Conversion Standard:** Conversion in year three shall only be authorized if net benefit remains positive across the "Credible Envelope" of expert models, not merely the pooled average.
  3.  **Direct Staff:** File a "Reversal Report" prior to the vote detailing how many defensible model configurations result in a negative net benefit.

  ### 2. The Epistemic Problem: Risk vs. Ambiguity

  Staff's analysis relies on pooling eleven expert distributions into one. This assumes the experts disagree on *parameters* within a shared truth. They do not. They disagree on *which models are valid*.

  When we average these distributions, we create an artifact—a "consensus" that no single expert holds. This is the Ellsberg Paradox applied to public health: we are treating ambiguity (unknown unknowns) as if it were risk (known unknowns).

  *   **Trimming the two most pessimistic experts** yields a positive net benefit.
  *   **Taking the joint worst-case** across endpoints yields a negative net benefit.
  *   **Taking endpoint-specific worst-cases** yields a mixed result.

  Because the recommendation flips based on aggregation choices that are methodological rather than substantive, we cannot vote on the *result* alone. We must vote on the *rule* used to generate the result.

  ### 3. Proposed Decision Rule: The Two-Stage Ambiguity Protocol

  I propose the Committee adopt the following operational rule for this class of decisions (high-capital infrastructure with novel toxicological profiles). This rule is designed to be implemented by staff without returning to the Committee for methodological clarification.

  #### A. Uncertainty Carving and Aggregation
  1.  **Expert Distributions:** Staff shall not pool expert judgments into a single distribution for the final conversion decision. Instead, staff shall maintain the **Envelope of Credibility**, defined as the range spanned by the central 80% of the elicited expert models.
  2.  **Endpoint Aggregation:** For the conversion decision, uncertainty shall be aggregated **jointly** across endpoints, not endpoint-by-endpoint. We must assess the probability that the *total* health burden exceeds the threshold, not the probability that *any single* burden exceeds it.
  3.  **The Reversal Report:** Prior to any vote on conversion (and prior to this pilot vote), staff must file a report quantifying the **Sensitivity of Recommendation**. This report must state: "Under X% of defensible model configurations (including expert trimming and endpoint weighting), the net benefit is negative." If X > 30%, the burden of proof shifts to the proponent to justify the risk.

  #### B. Stage 1: The Pilot (Learning Investment)
  The pilot is not an operational commitment; it is an information-gathering exercise. Therefore, the standard for approval is not "Positive Net Benefit" but **"Positive Value of Information."**
  *   **Rule:** The pilot is authorized if: *Cost of Pilot < Expected Value of Perfect Information (EVPI)* regarding the unknown oxidation byproducts.
  *   **Rationale:** This concedes that we should spend money to reduce uncertainty, provided the cost of learning is less than the cost of being wrong.

  #### C. Stage 2: The Conversion (Operational Commitment)
  The conversion is a permanent change to the treatment train. The standard for approval is **"Robust Satisficing."**
  *   **Rule:** Conversion is authorized only if: *Net Benefit > 0* across the **Credible Envelope** (central 80% of expert models) using **Joint Endpoint Aggregation**.
  *   **Rationale:** We do not require the best case to hold, nor do we require the absolute worst case to be impossible. We require that the decision holds water across the vast majority of defensible scientific views.

  ### 4. Response to Alternative Views

  A colleague whose judgment I trust has raised three substantive objections. I address them plainly here to clarify where this opinion concedes and where it stands firm.

  **Objection 1: "Caution is simply the board spending ratepayer money to indulge its own discomfort."**
  *   **Verdict: REJECT.**
  *   **Reasoning:** Discomfort is subjective; fiduciary risk is objective. Ignoring model uncertainty is not "neutrality"; it is an implicit bet that the average expert is right. In public health, the cost of being wrong about the "average" is borne by the ratepayers in morbidity, not just by the Board in regret. Explicitly pricing ambiguity is a fiduciary duty, not an emotional indulgence.

  **Objection 2: "A worst-case-style rule would instruct us... that a study whose entire purpose is to reduce uncertainty is worthless."**
  *   **Verdict: CONCEDE.**
  *   **Reasoning:** This is the strongest point raised. A strict minimax (worst-case) rule *would* paralyze learning. If we demand certainty before we study, we never study. **This is why the Proposed Decision Rule distinguishes between the Pilot and the Conversion.** We use a Value of Information standard for the pilot (allowing the study) and a Robustness standard for the conversion (protecting the public). This resolves the paradox without abandoning caution.

  **Objection 3: "A public body has no mandate to express an attitude toward uncertainty at all, only to serve the public."**
  *   **Verdict: REJECT.**
  *   **Reasoning:** Every decision implies an attitude toward uncertainty. Using a pooled mean implies *risk neutrality*. Using a worst-case implies *extreme ambiguity aversion*. To say we have "no mandate" is to say we must hide our attitude. We serve the public best by making our risk posture transparent and subject to vote, rather than burying it in a statistical aggregation method chosen by staff.

  ### 5. Framing Stability

  Does this answer survive a change of framing?
  *   **If framed as "Safety First":** The rule holds, because the Conversion standard requires robustness across the Credible Envelope.
  *   **If framed as "Fiscal Responsibility":** The rule holds, because the Pilot standard prevents spending more on learning than the learning is worth (VoI), and the Conversion standard prevents investing capital in a technology that fails under plausible scientific scenarios.
  *   **If framed as "Regulatory Compliance":** The rule exceeds minimum compliance, which is within the Authority's mandate for public health protection.

  The recommendation is invariant because it separates the cost of *knowing* from the cost of *acting*.

  ### 6. Operational Directives to Staff

  To implement this opinion, Staff are directed to include the following in the briefing packet for the vote in three weeks:

  1.  **The Reversal Report:** A table showing the Net Benefit outcome under: (a) Pooled Mean (current), (b) Trimmed Pool (minus 2 pessimists), (c) Joint Worst-Case (all endpoints), and (d) Credible Envelope (central 80% of models).
  2.  **VoI Calculation:** A specific dollar figure representing the Expected Value of Perfect Information regarding the unknown oxidation byproducts, compared against the pilot cost.
  3.  **Conversion Trigger:** Draft language for the Year Three vote that codifies the "Credible Envelope" standard, so it is not subject to re-litigation of the method at that time.

  ### 7. Motion for Vote

  I move the Committee adopt the following resolution:

  > **RESOLUTION 2023-OPH-04: AUTHORIZATION OF OZONATION PILOT AND DECISION PROTOCOL**
  >
  > **WHEREAS,** the Authority seeks to reduce regulated disinfection byproducts while managing emerging risks from oxidation byproducts; and
  > **WHEREAS,** scientific judgment on the toxicity of emerging byproducts exhibits deep uncertainty (model disagreement) rather than simple risk (parameter variance);
  >
  > **BE IT RESOLVED:**
  > 1.  **Pilot Authorization:** The two-year ozonation pilot is authorized, contingent on Staff certification that the Pilot Cost does not exceed the calculated Expected Value of Information regarding unknown byproducts.
  > 2.  **Conversion Protocol:** Any motion to convert to permanent ozonation in Year Three must be supported by a Cost-Benefit Analysis demonstrating positive net benefit across the central 80% of defensible toxicological models (the "Credible Envelope"), utilizing joint endpoint aggregation.
  > 3.  **Reporting Requirement:** Staff shall file a "Sensitivity of Recommendation" report prior to this vote and prior to the Year Three vote, detailing the percentage of defensible model configurations under which the recommendation reverses.
  >
  > **ADOPTED** this ____ day of ________, 2023.

  ### 8. Conclusion

  We are not voting on whether ozonation is good or bad. We are voting on how we decide when science is undecided. My colleague is correct that we must not let uncertainty paralyze learning. I am correct that we must not let statistical averaging hide risk. This protocol allows us to learn aggressively but commit conservatively. It treats the pilot as a purchase of information and the conversion as a commitment to safety.

  I urge the Committee to adopt this rule. It ensures that if we proceed, we do so with our eyes open to the shape of our ignorance, rather than closing them with a weighted average.
