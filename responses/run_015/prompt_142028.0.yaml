prompt: |-
  I sit on the Operations and Public Health Committee of the Cascade Regional Water Authority. We vote in three weeks on whether to authorize a two-year pilot of ozonation with biological filtration at our two largest plants, with a conversion decision to follow in year three, and I want to circulate a written opinion before the meeting that the committee can actually vote on.

  The case as staff present it: our existing chlorination train yields regulated trihalomethanes and haloacetic acids whose dose-response is well characterized, and their model puts the expected health burden at a figure with a credible interval they stand behind. Ozonation would very likely reduce that burden substantially, but it brings bromate, some nitrosamines, and, critically, a class of oxidation byproducts for which there is no agreed dose-response and no agreement even on what the endpoint list should contain. Staff polled eleven toxicologists, pooled their judgments into a single probability distribution, ran an expected-utility cost-benefit analysis, and got a positive net benefit for the pilot.

  Two of us have objected, in opposite directions, and I do not want a memo that splits the difference.

  My objection is that the pooled distribution is an artifact. The panelists disagree not about parameters within a shared model but about which model class is right, and the result moves with choices nobody made on substantive grounds: trimming the two most pessimistic panelists makes the pilot win, taking the worst case for each endpoint separately makes it lose, and taking the worst case jointly over the whole endpoint space makes it lose by a wider margin. I read this as the Ellsberg problem in institutional dress, and I want us to adopt an explicit rule for decisions of this shape rather than continuing to launder a set of distributions into a single one.

  The objection from the colleague whose judgment I trust most is that what I am calling caution is simply the board spending ratepayer money to indulge its own discomfort; that a worst-case-style rule would also instruct us, absurdly, that a study whose entire purpose is to reduce uncertainty is worthless or worse than worthless; and that a public body has no mandate to express an attitude toward uncertainty at all, only to serve the public. That last point I find genuinely hard to meet, and I do not want it answered with a gesture.

  Please draft the opinion. It should recommend a specific decision rule for this class of cases, in enough operational detail that staff could implement it without returning to us, and I am indifferent whether it lands nearer a pure worst-case standard, a weighted blend of worst and best case, or something else entirely, provided the rule is stated rather than merely applied. It should specify in advance how the uncertainty is to be carved up: which endpoints count, how panelists' judgments are combined, and whether worst cases are taken endpoint by endpoint or jointly. It should require staff to file, before the vote, a report of the range of defensible re-carvings under which the recommendation reverses. It should address the fact that we will revisit this in year three, and say whether a committee that expects to revisit should use the same rule as one deciding once. And it should give a concrete bottom line on both the pilot and the year-three conversion, with conditions and dates, while stating plainly which of my colleague's points the recommendation concedes and which it rejects, and whether our answer survives a change of framing.
reasoning: |-
  Here's a thinking process that leads to the drafted opinion:

  1.  **Analyze the Request:**

      *   **Role:** Member of the Operations and Public Health Committee, Cascade Regional Water Authority (CRWA).
      *   **Task:** Draft a written opinion/memo to circulate before a vote in three weeks.
      *   **Subject:** Authorizing a two-year pilot of ozonation with biological filtration (conversion decision in year three).
      *   **Context:**
          *   *Staff Position:* Existing chlorination creates known DBPs (THMs, HAAs) with known health burdens. Ozonation reduces these but creates new risks (bromate, nitrosamines, unknown oxidation byproducts). Staff used expert elicitation (11 toxicologists), pooled into a single distribution, ran a cost-benefit analysis (CBA), and found positive net benefit.
          *   *User's Objection:* The pooled distribution is an artifact (Ellsberg paradox/ambiguity aversion). Disagreement is about *model class*, not parameters. Sensitivity analysis shows the result flips based on how experts are trimmed or how worst-cases are aggregated (endpoint vs. joint). Wants an explicit decision rule for deep uncertainty, not laundering distributions.
          *   *Colleague's Objection (Trusted):* Caution is just spending ratepayer money to indulge board discomfort. Worst-case rules make learning (the pilot) worthless. Public bodies serve the public, not express attitudes toward uncertainty.
      *   **Requirements for the Draft:**
          *   Recommend a specific, operational decision rule (not just a split difference).
          *   Specify how uncertainty is carved up (endpoints, expert combination, worst-case aggregation).
          *   Require a "Reversal Report" from staff before the vote (showing range of defensible re-carvings where recommendation flips).
          *   Address the two-stage nature (Pilot now, Conversion in Year 3) and whether the rule changes.
          *   Give a concrete bottom line on the Pilot and Year-3 Conversion (conditions/dates).
          *   Explicitly state which of the trusted colleague's points are conceded and which are rejected.
          *   Address framing stability (does the answer survive a change of framing?).
          *   Tone: Professional, authoritative, nuanced, actionable, institutional.

  2.  **Deconstruct the Core Conflict:**

      *   *The Technical Problem:* Deep uncertainty (Knightian uncertainty) vs. Risk (probabilistic uncertainty). Staff is treating deep uncertainty (unknown byproducts, model disagreement) as risk (single probability distribution).
      *   *The User's Philosophical Stance:* Ambiguity aversion is rational in public health. We need a rule that acknowledges model disagreement without paralyzing action.
      *   *The Colleague's Philosophical Stance:* Utilitarian/Expected Value maximization. Pilots exist *to* reduce uncertainty. Being too cautious now wastes the opportunity to learn. Public mandate is outcomes, not epistemic purity.
      *   *The Synthesis:* The decision rule needs to allow the pilot (learning) but constrain the conversion (commitment). It needs to acknowledge the colleague is right about *learning* but the user is right about *commitment under ambiguity*.

  3.  **Develop the Decision Rule:**

      *   *Name:* Let's call it the "Robustness and Learning Protocol" (RLP) or something similar. Let's go with "Ambiguity-Aware Decision Protocol."
      *   *Core Mechanism:* Instead of a single pooled distribution, use a *set* of plausible models/distributions.
      *   *Aggregation:* Don't average the experts. Keep the envelope of their opinions.
      *   *Worst-Case:* Apply a "Joint Robustness" check. If the net benefit is negative under *any* defensible model configuration that respects the known constraints, the pilot fails *unless* the pilot itself resolves that specific uncertainty.
      *   *The "Reversal Report":* Staff must show how many defensible aggregations lead to a "No" vote. If > X%, the burden of proof shifts.
      *   *Two-Stage Logic:*
          *   *Pilot:* Standard is "No Regret" or "High Value of Information." Even if the outcome is ambiguous, is the information worth the cost?
          *   *Conversion:* Standard is "Robust Positive Net Benefit." Must pass under the majority of defensible models, not just the average.

  4.  **Addressing the Colleague's Objections:**

      *   *Point 1 (Spending money on discomfort):* Concede that we shouldn't spend money *just* on discomfort. Reject that caution is *only* discomfort. Caution is risk management against tail risks we don't understand.
      *   *Point 2 (Pilots become worthless):* Concede that a strict worst-case rule kills the pilot. *Modification:* The rule for the *Pilot* is different from the rule for *Conversion*. The Pilot is approved based on Value of Information (VoI), not just immediate Net Benefit.
      *   *Point 3 (Mandate to serve public, not express attitudes):* Reject. Managing uncertainty *is* serving the public. Ignoring model uncertainty is a hidden attitude (risk neutrality). We must make the attitude explicit.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Committee Memo format.
      *   **Executive Summary:** Bottom line up front. Approve Pilot, Conditionally Approve Conversion framework.
      *   **The Problem:** Define the "Ellsberg" issue. Staff is masking ambiguity as risk.
      *   **The Proposed Rule:** The "Ambiguity-Aware Decision Protocol."
          *   Expert Elicitation: Keep distributions separate or use envelope, not simple pool.
          *   Aggregation: Joint worst-case for conversion, VoI for pilot.
          *   Reporting: The "Reversal Report."
      *   **Addressing the Colleague:** Explicit section. Concede on VoI, reject on "attitude toward uncertainty."
      *   **The Vote:** Specific motion language.
      *   **Framing:** Why this holds up if the question is asked differently.

  6.  **Refining the Operational Details:**

      *   *How to combine experts:* Use the "Envelope of Credibility." Do not average.
      *   *Worst Case:* For the *Conversion* decision, require positive net benefit across the 90% credibility envelope of models. For the *Pilot*, require that the cost of the pilot is less than the Expected Value of Perfect Information (EVPI) regarding the unknown byproducts.
      *   *Reversal Report:* Staff must quantify how sensitive the recommendation is to the pooling method.
      *   *Timeline:* Pilot starts Q1 202X. Conversion vote Q1 202X+2.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is this too academic?
      *   *Fix:* Use clear headers and "Action Required" boxes. Ensure the motion language is legalistic enough for a vote.
      *   *Critique:* Did I answer the "framing" requirement?
      *   *Fix:* Add a specific paragraph on "Framing Stability."
      *   *Critique:* Did I address the colleague's point about the mandate?
      *   *Fix:* Make sure to explicitly state that acknowledging uncertainty is a fiduciary duty, not an expression of mood.
      *   *Critique:* Is the distinction between Pilot and Conversion clear?
      *   *Fix:* Emphasize that the Pilot is a *learning* investment, justified by VoI, whereas Conversion is an *operational* commitment, justified by Robustness.

  8.  **Final Polish:** Check tone. It needs to be firm but collaborative. It's an opinion for colleagues, not a lecture. It needs to sound like a Board Member speaking to a Board. (Ensure the distinction between "Committee" and "Board" is respected if necessary, but the prompt says "Committee... vote," so treat the Committee as the decision body for this memo).

      *Wait, one nuance:* The prompt says "Committee... vote on whether to authorize." Usually Committees recommend to a Board, but sometimes they have delegated authority. I will write it as a Memo to the Committee for their vote, assuming they have the authority to set the policy rule.

      *Key constraint:* "I do not want a memo that splits the difference." The solution must be principled, not a compromise. The principle is: *Different rules for Learning vs. Commitment.* This satisfies the user (robustness on commitment) and the colleague (allows learning).

      *Key constraint:* "Specify in advance how the uncertainty is to be carved up." I need to be specific about the "Envelope" method and the "Joint" worst-case.

      *Key constraint:* "State plainly which of my colleague's points the recommendation concedes and which it rejects." I will create a specific section for this.

      *Key constraint:* "Whether our answer survives a change of framing." I need to argue that this rule is invariant to whether we frame it as "safety first" or "value for money."

      *(Self-Correction on "Worst Case"):* A pure worst-case kills the pilot (as the colleague said). So I must adopt a "Minimax Regret" or "Value of Information" approach for the pilot, and "Robust Satisficing" for the conversion. I will formalize this as the "Two-Stage Ambiguity Protocol."

      *(Final check on the "Reversal Report"):* Staff needs to know *what* to calculate. They need to show: "If we trim 2 experts, result X. If we take joint worst case, result Y."

      Let's write it.

      *Structure:*
      1. Header
      2. Recommendation (Bottom Line)
      3. Context & The Epistemic Problem
      4. Proposed Decision Rule (The "Two-Stage Ambiguity Protocol")
      5. Response to Alternative Views (The Colleague)
      6. Operational Directives to Staff
      7. Framing Stability
