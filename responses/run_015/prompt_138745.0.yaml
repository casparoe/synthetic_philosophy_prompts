      *   This shifts the debate from "Can numbers feel?" to "Is the wiring right for the function?"

  5.  **Drafting the Content (Iterative refinement):**

      *   *Title:* **Architectural Preconditions for Valence: Distinguishing Reward Signals from Update Modulation in Reinforcement Learning.**
      *   *Objective:* Determine if standard RL architectures structurally preclude a specific functional definition of valence (involuntary learning prioritization).
      *   *Background:* Current debate focuses on reward magnitude. I propose focusing on *update sovereignty*. In biology, pain overrides other goals. In RL, the optimizer is external/fixed.
