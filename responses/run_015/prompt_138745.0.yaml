      *   *Key Distinction:* Standard RL treats the learning algorithm as fixed and external to the agent's "self." Biological learning often involves the signal modulating the learning rate, attention, or memory consolidation *internally*.
      *   *Hypothesis:* If valence is functional, it's not the signal value, it's the *architectural coupling* between the signal and the update mechanism.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "The Architecture of Suffering" is too dramatic. "Valence as Update Interference"? "Reward Signal vs. Learning Modulation." Let's go with something about the *mechanism* of update.
      *   **The Question:** Needs to be answerable. Not "Do RL agents feel?" but "Does the standard RL architecture lack a specific functional property associated with valence?"
      *   **The Problem with Obvious Answers:**
