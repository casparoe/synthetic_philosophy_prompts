      *   *The User's Move:* Propose a middle ground. It's not full-blown aesthetic *knowledge* (in the sense of having the experience), but it's not mere suggestion either. It's *perceptual scaffolding*.
      *   *The Mechanism:* The testifier provides an interpretive framework (a "seeing-as" structure) that the hearer can adopt *prior* to the experience to shape the experience itself.
      *   *The Comparison:* Contrast with moral testimony. In morality, accepting testimony might bypass the need for moral reasoning/autonomy. In aesthetics, accepting this testimony *enables* the aesthetic reasoning/perception. It's constitutive of the practice of listening/looking.
      *   *The "Knowledge" Worry:* Acknowledge the pessimist's point (no experience = no aesthetic judgment) but reframe the epistemic gain. It's not knowledge *that* it is beautiful, but knowledge *how* to perceive it, which is a precondition for the judgment.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. "Perceptual Scaffolding" or "Interpretive Transmission."
