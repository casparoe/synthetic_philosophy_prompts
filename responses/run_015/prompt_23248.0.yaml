      *   **The Case Study:** Use the music example provided (dissonance/failed recovery). Show how it changes the listening.
      *   **Distinguishing from Prediction/Report:** Explicitly rule out "you will like this" and "I like this." This is about *structure* and *meaning*.
      *   **The Moral Testimony Contrast:** This is crucial. Why is this different from "X is wrong"?
          *   Moral: Accepting testimony might bypass moral agency.
          *   Aesthetic: Accepting testimony *activates* aesthetic agency (by guiding perception). The competence is internal to the practice.
      *   **Addressing the "No Experience/Knowledge" Worry:** This is the "pessimist's challenge."
