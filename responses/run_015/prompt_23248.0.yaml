answer: |-
  **Section Draft: Perceptual Scaffolding and the Constitutive Norms of Aesthetic Testimony**

  The deadlock between aesthetic pessimism and optimism often turns on a category error regarding what is being transmitted. Pessimists (following Hopkins) argue that aesthetic testimony cannot yield judgment because it bypasses the requisite first-personal experience. Optimists, in retreat, often concede that testimony is merely predictive ("you will like this") or reportive ("I find this moving"). Both sides miss a third category: *perceptual-interpretive transmission*. I argue that expert aesthetic testimony often functions not as a surrogate for experience, but as *perceptual scaffolding* that provides the hearer with a first-personally actionable reason to attend to the work in a specific way. This distinguishes it sharply from moral testimony and avoids the slide into objectivism, while answering the charge that such testimony yields mere "tips" rather than epistemic traction.

  Consider the musical case: A knowledgeable listener tells you that the dissonance in the final bars is not a performance error, but a structural device that renders the reprise a "failed recovery." If you accept this, you do not merely believe a proposition about the composer's intent. You acquire a hermeneutic framework *prior* to re-listening. When the music plays, you do not hear the dissonance as a mistake; you hear it *as* a failure of resolution. The testimony has not given you the aesthetic experience itself—you must still hear the tension—but it has organized the conditions of possibility for that experience. It transforms the acoustic data into an aesthetic object capable of sustaining that specific judgment.

  This is where the disanalogy with moral testimony becomes crucial. In the moral domain, accepting testimony that "X is wrong" often allows the hearer to bypass the work of moral reasoning; the competence required to accept the testimony (trust in the testifier) is distinct from the competence required to make the moral judgment (sensitivity to moral reasons). In aesthetics, however, the competence required to accept the testimony is *constitutive* of the aesthetic practice itself. To understand the claim that the dissonance signifies a "failed recovery" is to already possess, in nascent form, the very perceptual sensitivity required to verify it. The testimony does not replace the need for sensitivity; it tunes the instrument. Therefore, accepting aesthetic testimony is not a surrender of aesthetic autonomy (as it might be in morality), but an activation of it. The normativity here is not external (a command to believe) but internal to the practice of listening.

  This avoids the trap of objective beauty. We are not claiming the "failed recovery" is a mind-independent property of the sound waves, waiting to be discovered like a mass or a charge. It is a response-dependent feature. However, response-dependence does not entail privacy. The stability of the feature lies in the *intersubjective reproducibility* of the perceptual stance. The testifier is not reporting a private qualia; they are articulating a norm of perception that governs how competent listeners engage with the work. When they say "listen for the failed recovery," they are inviting you into a shared space of reasons where that description makes sense.

  This brings us to the pessimist's lingering worry: If I have not yet felt the tension of the failed recovery, do I not merely have a "tip" rather than knowledge? If I rely on your word, haven't I merely borrowed your judgment?

  The response is to distinguish between *verdictive knowledge* (knowing *that* it is beautiful/significant) and *hermeneutic knowledge* (knowing *how* the significance is constituted). The pessimist is correct that testimony cannot grant verdictive knowledge without experience. But this ignores the epistemic value of the hermeneutic layer. The testimony provides a *proleptic reason* to attend. It allows the hearer to anticipate the structure of the experience, aligning their attention with the relevant features before the phenomenological uptake occurs.

  If you tell me the dissonance is a mistake, I listen for error. If you tell me it is a failed recovery, I listen for narrative collapse. The difference is not just in my subsequent belief; it is in the *object of my perception*. By providing the interpretive schema, the testifier enables the hearer to perceive the *same aesthetic property* that grounded the testifier's judgment. Thus, the testimony is not a substitute for the experience, but a guide to the *grounds* of the experience.

  Consequently, the hearer is not merely collecting a tip; they are acquiring a warrant to form a judgment *provided they undertake the perceptual work*. The testimony bridges the gap between ignorance and experience not by skipping the experience, but by making the experience intelligible. To deny this is to assume that aesthetic perception is a raw, unmediated given, rather than a cognitively penetrable practice. If aesthetic perception is indeed penetrable—if what we see/hear is shaped by what we know—then testimony that shapes that knowledge is not an epistemic shortcut, but a constitutive element of aesthetic understanding. We should therefore classify this not as defective testimony (because it lacks immediate experience), but as a distinct speech act: one that transmits the *conditions of seeing* rather than the *fact of the seen*.
