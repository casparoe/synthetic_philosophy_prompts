answer: |-
  Classify the claim type, verify pre-commitment of all defenses, audit auxiliaries for retrofitting, and demand novel intermediate predictions for any retiming.

  ### MODEL REVIEW DECISION PROCEDURE

  **1. Classify the Claim**
  Identify the primary output being tested.
  *   **Dated Point Forecast:** Event X will happen by Date Y.
  *   **Dominance Claim:** Force A will outweigh Force B by Date Y.
  *   **Mechanism/Existence Claim:** Structure Z produces behavior W (no specific date).
  *   *Ruling:* Mechanism claims cannot be falsified by timing misses; Dated/Dominance claims can.

  **2. Verify the Miss**
  Compare actual data against the claim window.
  *   If the event occurred within the window (even if magnitude differs): **No Miss.**
  *   If the event did not occur: **Miss.** Proceed to Step 3.

  **3. Audit the Defense**
  Authors must select one defense. Apply the corresponding test.
  *   **Defense A: "Outcome Averted."** (Intervention prevented the prediction.)
      *   *Requirement 1:* Traceability. Did policymakers cite this specific model as the cause for intervention?
      *   *Requirement 2:* Sufficiency. Was the intervention large enough to counteract the modeled force?
      *   *Ruling:* If either is unsupported by documentation, treat as a **Miss**.
  *   **Defense B: "Timing Off."** (Mechanism is correct, date was wrong.)
      *   *Requirement 1:* Original Uncertainty. Is the new date within the original model's confidence interval or sensitivity range?
      *   *Requirement 2:* Novel Prediction. If outside original bounds, must offer a new, independently checkable intermediate consequence (not just a new date) to be tested before the new deadline.
      *   *Ruling:* If no novel prediction is offered, treat as **Date-Slipping (Degenerating)**.

  **4. Audit Auxiliary Hypotheses**
  Review the exogenous variables (e.g., oil price, tech growth, policy stability).
  *   Were these values fixed in the initial proposal or publication?
  *   *Ruling:* If key auxiliaries were changed post-hoc to fit data without structural justification, flag as **Retrofitted**.

  **5. Apply Stop Rules**
  *   **Drop:** Second miss on a Dated Point Forecast; Defense A fails; Defense B offered without Novel Prediction; Auxiliaries Retrofitted.
  *   **Re-specify:** First miss on Dominance Claim; Auxiliaries need structural updating (e.g., new technology variable); Mechanism plausible but calibration off.
  *   **Renew:** No miss; or Miss successfully defended with Novel Prediction pre-committed to ledger.

  **6. Escalate Judgment Calls**
  The analyst does not decide on:
  *   Strategic value of a model despite predictive failure (e.g., diplomatic utility).
  *   Political sensitivity of dropping an internal flagship.
  *   *Action:* Flag these explicitly for the Director. All methodological rulings are final per this procedure.

  ***

  ### REVIEW 1: NEO-MALTHUSIAN FOOD-POPULATION MODEL

  **Procedure Audit**
  *   **Claim Classification:** Dated Point Forecast (Famine windows specified: 2015–2020, 2025–2030).
  *   **Miss Verification:** Both windows passed. Global caloric yield increased; no predicted famine events occurred.
  *   **Defense Audit:** Authors claim "Green Revolution 2.0" averted outcome.
      *   *Traceability:* No evidence policy makers cited this specific model for yield-investment strategies.
      *   *Sufficiency:* Yield growth trends pre-date model publication.
      *   *Ruling:* Defense A fails. Treat as Miss.
  *   **Auxiliary Audit:** Model assumed static yield growth rates. Data shows exponential tech-driven growth. This was a structural omission, not merely parameter calibration.
  *   **Stop Rule:** Second miss on Dated Point Forecast.

  **BOARD RECOMMENDATION**
  **Model:** Global Food Security & Population Dynamics (Project ID: 44-B)
  **Decision:** **DROP (Do Not Renew)**

  **Rationale:**
  The model issued two specific dated predictions regarding famine events driven by population outstripping yield. Both windows have closed without the predicted events occurring. The authors' defense that external interventions averted the outcome is unsupported; there is no documentary evidence that this model triggered the specific yield-investment policies cited, and yield growth trajectories were established prior to the model's publication.

  Under the Fund's Decision Procedure, a second miss on a dated point forecast without a valid "averted" defense constitutes a degenerating research program. The core mechanism (static yield vs. exponential population) is contradicted by observed data (exponential yield vs. stabilizing population). Continuing funding would support curve-fitting rather than predictive insight.

  **Action:** Terminate funding at quarter end. Archive data for historical reference only.

  ***

  ### REVIEW 2: RESOURCE-DEPLETION PRICE MODEL

  **Procedure Audit**
  *   **Claim Classification:** Dominance Claim (Scarcity forces will outweigh extraction tech by 2025, causing sustained price spike).
  *   **Miss Verification:** Price spike occurred in 2022. Prices collapsed in 2023 due to new extraction technology (deep-water fracking) not modeled.
  *   **Defense Audit:** Authors claim "Timing Off" due to exogenous tech shock.
      *   *Original Uncertainty:* Model held technology constant (ceteris paribus).
      *   *Novel Prediction:* Authors propose re-running with endogenous tech adoption.
  *   **Auxiliary Audit:** The exclusion of technological innovation in extraction was a structural choice, not a retrofit. However, the variable is now known to be load-bearing.
  *   **Stop Rule:** First miss on Dominance Claim. Structural update required.

  **BOARD RECOMMENDATION**
  **Model:** Lithium & Rare Earth Price Trajectories (Project ID: 12-R)
  **Decision:** **RE-SPECIFY (Funding Suspended Pending Proposal)**

  **Rationale:**
  The model correctly identified the scarcity pressure leading to the 2022 price spike but failed to account for the countervailing force of rapid extraction technology innovation, leading to the 2023 price collapse. This is a structural omission rather than a falsification of the depletion mechanism itself.

  Under the Fund's Decision Procedure, this qualifies for re-specification rather than termination, provided the model structure is updated to endogenize technological innovation. The current model cannot be renewed in its present form as it excludes a known load-bearing variable.

  **Action:** Release no further operating funds. Authors may submit a re-specification proposal within 90 days that includes endogenous tech variables and a new novel prediction for the 2025–2026 window. If no proposal is submitted, project closes.

  ***

  ### REVIEW 3: INSTITUTIONAL-TRUST DECLINE (FLAGSHIP)

  **Procedure Audit**
  *   **Claim Classification:** Dated Point Forecast (Trust index will cross "Crisis Threshold" of 30% by Year 10).
  *   **Miss Verification:** Year 10 reached. Trust index stabilized at 42%. Threshold not crossed.
  *   **Defense Audit:** Authors claim "Timing Off" (threshold will be crossed by Year 15).
      *   *Original Uncertainty:* Original publication specified Year 10 with no confidence interval.
      *   *Novel Prediction:* Authors propose no new intermediate consequences, only a new date.
      *   *Ruling:* Defense B fails (Date-Slipping).
  *   **Auxiliary Audit:** Model assumed linear decline. Data shows cyclical fluctuation. Auxiliary assumption of linearity was declared but is now empirically unsupported.
  *   **Judgment Call:** Project is internal flagship authored by senior colleague. High political sensitivity.
      *   *Action:* Escalated to Director. Methodological ruling remains **Drop/Re-specify**.

  **BOARD RECOMMENDATION**
  **Model:** Institutional Trust Dynamics in Rich Democracies (Project ID: 01-F)
  **Decision:** **DO NOT RENEW (Re-specify Required)**

  **Rationale:**
  The model predicted a specific crisis threshold would be crossed within a ten-year horizon. That horizon has closed without the threshold being breached. The authors' request to extend the horizon to fifteen years constitutes "date-slipping" under the Fund's Decision Procedure, as no new intermediate predictions were offered to validate the mechanism during the extension period, and no original uncertainty bounds covered this delay.

  While the mechanism of trust erosion remains theoretically valuable, the current specification is empirically disconfirmed. Renewing the model as-is would compromise the Fund's methodological standards.

  **Action:** Current funding line closes. The project team is invited to submit a new proposal addressing the cyclical nature of trust data and including novel intermediate predictions. *Note to Director: This decision applies the standard review procedure uniformly; exceptions for internal flagship status require explicit Director override.*
