      *(Drafting thought on the "Break"):* The prompt asks if moderate nationalism or strong cosmopolitanism can explain the surplus timing. Moderate nationalism says "compatriots first, then others." This *does* explain the timing. Strong cosmopolitanism says "need first." This *condemns* the timing. So where is the break? The break is that Moderate Nationalism usually allows for *some* assistance during scarcity if the cost to compatriots is low. The UK did *zero* assistance during scarcity. This suggests the driver wasn't just moral partiality, but *risk-averse institutionalism*. That's the gap.

      *(Drafting thought on Cosmopolitan Gap):* Cosmopolitans often argue states *should* act globally. They fail to explain *how* a democratically accountable agent can do that without being punished by voters. The case reveals the "Accountability Deficit" in cosmopolitan theory.

