          4.  Analyze the distinction between *Moral Partiality* (stronger claims) vs. *Institutional Partiality* (structural limits/mandate).
          5.  Determine if contract-based priority supports institutional partiality or collapses into moral partiality.
          6.  Identify where the theoretical framework breaks (specifically regarding the timing of surplus release).
          7.  Conclusion: What the episode reveals about the theory (mediation by design vs. gap in cosmopolitan objections regarding accountability).

  2.  **Initial Brainstorming & Fact-Checking (Mental Check):**

      *   *Facts:* UK did sign APAs early (including AstraZeneca, though AZ was largely non-profit/no-gain during pandemic). UK did restrict exports (not as aggressively as US/EU initially, but did prioritize domestic fill-finish). COVAX struggled. Global South vaccination rates were indeed low while UK boosted.
      *   *Theory:* Nationalism (Miller, Tamir) argues special obligations to compatriots. Cosmopolitanism (Pogge, Singer) argues equal moral worth implies equal distribution based on need.
      *   *Nuance:* The prompt asks to move beyond "share vs. hoard" to specific policy levers (licensing, contract clauses).
      *   *Key Distinction:* Moral Partiality (Citizens *deserve* more) vs. Institutional Partiality (State *can only* act for citizens due to mandate/structure).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the shift from abstract theory to policy architecture.
      *   **Agent Mapping:**
          *   *UK Gov:* The decision-maker, bound by domestic mandate and international contracts.
          *   *British Citizens:* The principals of the democratic contract, beneficiaries of partiality.
          *   *EU States:* Competing state actors, also practicing partiality (export controls).
          *   *Global South/COVAX:* The moral claimants outside the state's fiduciary circle.
      *   **Distributive Options (Policy Architecture):**
          *   Need to be specific. Not just "give vaccines."
          *   *Option A:* Adhere strictly to APAs (Domestic Priority).
          *   *Option B:* Contractual Renegotiation (Release clauses).
          *   *Option C:* Compulsory Licensing (TRIPS waiver context - though UK didn't unilaterally do this, it's a theoretical option).
          *   *Option D:* Phased Export Thresholds (e.g., release surplus once domestic vulnerability metric X is met).
      *   **Payoff Matrix (State Conceptions):**
          *   *Fiduciary Model:* Payoff = Maximize citizen survival/trust. Risk = Political backlash if citizens die while others are vaccinated.
          *   *Global Agent Model:* Payoff = Minimize global mortality/virus mutation. Risk = Breach of democratic mandate/legal contracts.
      *   **Moral vs. Institutional Partiality (The Core Analysis):**
          *   *Moral:* "Britons matter more."
          *   *Institutional:* "The UK Gov is *only* authorized to spend UK money for UK people."
          *   *The Contract:* APAs look like institutional partiality (legal obligation). But did they *create* the obligation or *reflect* a moral choice?
          *   *Argument:* The contract mechanism *supports* an institutional reading. It provides a "shield" of legality for a moral preference. However, the *decision to sign* such restrictive contracts initially reflects a moral prioritization.
      *   **The Breaking Point (Timing of Surplus):**
          *   *Fact:* UK donated surplus *after* domestic demand fell.
          *   *Nationalism:* Predicts this. Duty ends when citizen need is satisfied.
          *   *Cosmopolitanism:* Criticizes the delay. Need was global *during* the domestic rollout.
          *   *The Gap:* Why not share *during* the rollout (e.g., 80/20 split)? Neither theory fully explains the *rigidity* of the "100% domestic first" approach. Nationalism allows for some charity; Cosmopolitanism demands immediate need-based allocation. The "all or nothing" timing suggests a *political* logic (risk aversion) rather than a purely *moral* one.
      *   **Theoretical Revelation:**
          *   Does it confirm mediation by design? Yes.
          *   Does it expose a cosmopolitan gap? Yes, regarding *who* decides. Cosmopolitans often ignore the democratic accountability constraint. You can't ask a minister to violate their fiduciary duty without a global institution to back them up.

  4.  **Refining the Argument (Self-Correction/Polishing):**

