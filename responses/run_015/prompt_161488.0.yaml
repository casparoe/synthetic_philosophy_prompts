prompt: |-
  At a meeting of the volunteer organisation I help run, I called out a fellow organiser — call him D — for repeatedly missing shifts he had signed up for, leaving the rest of us to cover for him. His reply was that I have no standing: last year I quietly padded an expense claim by a modest amount, and some years before that I missed commitments of my own. His brother, who is a lawyer, later spelled the point out for me using two doctrines: standing, which he glossed as requiring that you yourself were injured, by the very thing you complain of, in a way the court can remedy; and, separately, unclean hands, which he described as barring equitable relief to a plaintiff whose own conduct is dirty in the very matter he complains of — with the qualification, which he insisted on, that unrelated dirt about your general character is supposed to be irrelevant. The conclusion D wants, and that I have now heard in every argument since, is that a hypocrite's blame is simply void: the target owes it no uptake, may shrug it off, and is not answerable to the person blaming. People in glass houses, and so on.

  What I want is an audit of the analogy rather than a verdict on my conduct. Please lay the mapping out explicitly — a table of correspondences is fine — for what plays the plaintiff, the defendant, the injury, the court, the remedy, the connection requirement, and the forum's power to strike a complaint for want of standing. Then tell me where the mapping breaks. In particular: are standing and unclean hands doing the same work here, or does the analogy quietly need both, or is the popular version really an ancestor of neither? There is no institution that can dismiss my blame, no one compelled to listen, no remedy or coercion I am enlisting, and blame is addressed at least as often to third parties or to oneself as to its target. Which of those disanalogies actually bear on D's conclusion and which are idle for his purposes?

  Then three cases I cannot fit. First, connection: the dirt he taxes me with, padding expenses, is not in the same normative neighbourhood as what I blamed him for, whereas his missed-commitments charge is much closer to my own history; does the analogy support a domain-restricted loss of standing, or does hypocrisy taint all of a blamer's blame at once? Second, derivative dirt: my own pattern of shirking was in part picked up from watching him, years ago, before I reformed — may a blamer invoke wrongdoing that he himself produced in the blamer? Third, third-party blame: I was speaking largely on behalf of the people who covered his shifts rather than for myself, and I gather the law has devices for next friends and third-party standing, so I want to know whether the analogue helps me or whether not being the one wronged cuts the other way. I should add that I disclosed my own record up front and said I knew how easy the rationalisation is; whether that restores standing or makes it worse, I cannot tell. Finally: if the conclusion survives, does it mean only that I may not blame, or also that my blame was false or unwarranted, and does it constrain what I may think or only what I may say? And if the legal comparison is the wrong one, is there a better analogy — blame as a demand made from within a relationship, as a speech act with felicity conditions, as calling in a debt — that preserves whatever is true in the glass-houses slogan without delivering the conversation-stopper?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user (a volunteer organizer) called out a colleague (D) for missing shifts. D retorted that the user has no "standing" due to past misconduct (padding expenses, past shirking). D's lawyer brother reinforced this with legal concepts: *standing* and *unclean hands*.
      *   **Goal:** The user wants an *audit of the analogy* between legal doctrines and moral blame, not a verdict on their conduct.
      *   **Specific Tasks:**
          1.  Create a table of correspondences (Plaintiff, Defendant, Injury, Court, Remedy, Connection, Forum's Power).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Analyze whether *standing* and *unclean hands* do the same work or differ in this context.
          4.  Evaluate which disanalogies bear on D's conclusion (that blame is void/ignored) and which are idle.
          5.  Address three specific "hard cases":
              *   *Connection:* Expense padding vs. missed shifts (different normative neighborhoods).
              *   *Derivative Dirt:* User learned shirking from D originally.
              *   *Third-Party Blame:* User spoke on behalf of others covered shifts.
          6.  Address the effect of prior disclosure of the user's record.
          7.  Address the scope of the conclusion (may not blame vs. blame is false; thought vs. speech).
          8.  Propose better analogies if the legal one fails (relationship demand, speech act, debt).

  2.  **Deconstruct the Legal Analogies:**
      *   **Standing (*Locus Standi*):** In law, you must show concrete injury, causation, and redressability to sue. It's about *who* can bring a case.
      *   **Unclean Hands:** An equitable doctrine. If you acted unethically regarding the *subject matter* of the lawsuit, the court won't help you. It's about *worthiness* of relief.
      *   **D's Argument:** "You are a hypocrite, therefore your blame is void."
      *   **The Mapping:**
          *   Plaintiff = The Blamer (User).
          *   Defendant = The Blamed (D).
          *   Injury = The moral wrong (missed shifts).
          *   Court = The moral community / The audience of the blame.
          *   Remedy = Acknowledgment, apology, behavioral change.
          *   Connection = Nexus between blamer's dirt and the blame.
          *   Forum's Power = Social sanction / dismissal of the claim.

  3.  **Analyze the Breaks (Disanalogies):**
      *   *Coercion:* Law is coercive; moral blame is not.
      *   *Institution:* Law has a specific court; morality has a diffuse audience.
      *   *Remedy:* Law gives damages/injunctions; morality seeks recognition/repair.
      *   *Standing vs. Merits:* In law, lack of standing doesn't mean the defendant is innocent. In D's argument, lack of standing implies the blame is *void* (doesn't count).
      *   *Unclean Hands Specificity:* Legal unclean hands requires the dirt to be related to the *specific transaction*. D's lawyer admitted this, but D applies it broadly ("hypocrite's blame is void").

  4.  **Evaluate D's Conclusion:**
      *   D wants: "Blame is void, target owes no uptake."
      *   Legal reality: Lack of standing means the *case is dismissed*, not that the defendant didn't do it. Unclean hands denies *equitable relief*, not legal liability.
      *   Moral reality: Hypocrisy might weaken the *force* or *authority* of the blame, but it rarely makes the underlying claim *false*.
      *   Which disanalogies matter? The lack of a central authority to "dismiss" the blame matters most. Blame exists even if rejected. The "voidness" claim is the biggest stretch.

  5.  **Address the Three Hard Cases:**
      *   *Connection (Expenses vs. Shifts):* Legal *unclean hands* requires relatedness. Legal *standing* requires personal injury. If the dirt is unrelated (expenses), legal unclean hands shouldn't apply. If the dirt is related (past shirking), it's stronger. *Hypocrisy* in morality often tolerates some distance, but specific hypocrisy is stronger.
      *   *Derivative Dirt (Learned from D):* This is a "tu quoque" twist. If D caused the dirt, can he use it? In law, estoppel might apply. In morality, this undermines D's authority significantly.
      *   *Third-Party Blame:* Legal "next friend" or representative standing exists. In morality, speaking for the team is often *stronger* standing than personal injury. D's argument fails here if the user represents the injured party (the coverers).

  6.  **Address Disclosure:**
      *   Disclosing upfront shows transparency. In law, it might mitigate unclean hands (coming to court with clean hands *now*). In morality, it acknowledges the tension, potentially reclaiming authority through humility rather than pretense.

  7.  **Address Scope (Thought vs. Speech):**
      *   Legal doctrines regulate *access to court* (speech/action), not private thought.
      *   Moral standing usually regulates the *communicative act* of blame, not the private judgment.
      *   Does it make the blame false? No. A liar can tell the truth. Hypocrisy affects the *speaker*, not the *truth value*.

  8.  **Propose Better Analogies:**
      *   *Debt:* You can demand repayment even if you owe others.
      *   *Speech Act (Felicity Conditions):* Hypocrisy might make the act "infelicitous" (awkward, less effective) but not "void" (meaningless).
      *   *Relationship/Demand:* Blame is a demand for respect within a shared normative community. Hypocrisy strains the community but doesn't dissolve the norm.
      *   *The "Glass Houses" Slogan:* It's a warning about vulnerability, not a rule of logic.

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, precise, respectful, philosophical but grounded.
      *   *Structure:* Follow the user's prompt order (Table -> Breaks -> Standing vs. Hands -> Disanalogies -> Three Cases -> Disclosure -> Scope -> Better Analogies).
      *   *Key Insight:* The legal analogy conflates *procedural bar* with *substantive truth*. D wants the procedural bar to erase the substantive truth.

      *(Self-Correction during drafting)*: Make sure to distinguish clearly between *Standing* (injury to me) and *Unclean Hands* (my conduct is dirty). The user's prompt notes the lawyer brother distinguished them, but D conflates them into "hypocrite's blame is void." I need to highlight this conflation.
      *   *Standing:* "You weren't hurt." (User *was* hurt, they had to cover shifts).
      *   *Unclean Hands:* "You did bad stuff too." (User did expense padding).
      *   *D's Conflation:* "You did bad stuff, so you can't speak."

      *Refining the "Derivative Dirt" point:* If D taught the user to shirk, D is estopped from complaining. This is a strong moral point, akin to "invited error."

      *Refining the "Third Party" point:* If the user speaks for the coverers, they *have* standing in the legal sense (representative). D's attack on personal standing is irrelevant if the claim is representative.

      *Refining the "Better Analogy":* The "Demand for Authority" model (Darwall/Murphy) is good here. Blame claims authority. Hypocrisy undermines authority, not truth.

  10. **Final Review:** Check against all constraints.
      *   Table included? Yes.
      *   Mapping breaks identified? Yes.
      *   Standing vs. Unclean Hands distinguished? Yes.
      *   Disanalogies evaluated for relevance to D's conclusion? Yes.
      *   Three cases addressed? Yes.
      *   Disclosure addressed? Yes.
      *   Scope (thought/speech) addressed? Yes.
      *   Better analogies offered? Yes.

      *Tone Check:* Ensure I don't vindicate the user morally, but vindicate their *argument* about the analogy. The user asked for an audit, not a verdict.

      *(Final Polish)*: Ensure the distinction between "void" (invalid) and "weakened" (less persuasive) is clear. That is the crux of D's error.

      Let's assemble the response.cw
answer: |-
  Here is an audit of the legal analogy as applied to your situation, structured according to your requests.

  ### 1. The Mapping: Legal Doctrines vs. Moral Blame

  | Legal Concept | Legal Definition (Civil/Equitable) | Moral Analogue (D's Argument) | Your Actual Position |
  | :--- | :--- | :--- | :--- |
  | **Plaintiff** | The party initiating the suit. | The Blamer (You). | The Blamer (You). |
  | **Defendant** | The party being sued. | The Blamed (D). | The Blamed (D). |
  | **Injury** | Concrete, particularized harm caused by the defendant. | The moral wrong (missed shifts). | The moral wrong + burden on the team (including you). |
  | **Court** | The state institution with jurisdiction. | The moral community / The meeting / Public opinion. | The volunteer organisation / The team. |
  | **Remedy** | Damages, injunction, specific performance. | Apology, behavioral change, acknowledgment. | Reliability, fair distribution of labor. |
  | **Connection** | *Standing:* Injury must be traceable to defendant.<br>*Unclean Hands:* Dirt must relate to the subject matter. | *D's View:* Any past dirt voids blame.<br>*Lawyer's View:* Dirt must match the complaint. | You suffered the injury (covered shifts); your dirt is mixed (expenses vs. shifts). |
  | **Forum's Power** | To dismiss the case *without prejudice* (standing) or *with prejudice* (unclean hands). | To dismiss the blame as "void" or "noise." | To weigh the blame as less authoritative, but not factually false. |

  ### 2. Where the Mapping Breaks

  The analogy fails in four critical places, only two of which bear on D's conclusion.

  **A. The Nature of the "Dismissal" (Critical Disanalogy)**
  In law, if you lack standing or have unclean hands, the *court* refuses to hear the case. The defendant does not get to declare the case void unilaterally; the judge does.
  *   **Relevance to D:** This is the fatal flaw in D's conclusion. D is acting as both Defendant and Judge. In morality, there is no central court to strike your complaint. D can *reject* your blame, but he cannot render it *void*. A dismissed lawsuit does not mean the defendant is innocent; it means the plaintiff cannot use the state to enforce rights. Similarly, your lack of standing might mean you lack *authority*, but it does not mean D didn't miss the shifts.
  *   **Verdict:** This disanalogy bears heavily on D's conclusion. It shows his claim that blame is "void" is a category error.

  **B. The Coercive Element (Idle Disanalogy)**
  Law is backed by state coercion. Moral blame is backed by social pressure and conscience.
  *   **Relevance to D:** Idle. Whether the remedy is coercive or social does not change the logic of who is permitted to speak.

  **C. The "Injury" Requirement (Critical Disanalogy)**
  Legal *standing* requires you to be injured. *Unclean hands* requires you to be dirty regarding the *transaction*.
  *   **Relevance to D:** You *were* injured (you covered his shifts). Therefore, under the legal definition of standing, you actually *have* standing. D is conflating *standing* (injury) with *unclean hands* (moral purity).
  *   **Verdict:** This bears on D's conclusion. He claims you have no standing, but by his own legal analogy, you do. He is actually arguing *unclean hands*.

  **D. The Truth-Value of the Claim (Critical Disanalogy)**
  In law, a procedural bar (standing/hands) does not negate the factual allegations.
  *   **Relevance to D:** D concludes that because you are a hypocrite, the blame is *void* (i.e., he owes no uptake). In morality, hypocrisy attacks the *speaker's authority*, not the *truth of the proposition*.
  *   **Verdict:** This is the most important break. D wants a procedural failure to erase a substantive truth.

  ### 3. Standing vs. Unclean Hands: Are They Doing the Same Work?

  In D's argument, they are conflated, but they perform different functions. The analogy quietly needs both, but D is misusing them.

  *   **Standing** asks: "Did this happen to you?"
      *   *Application:* You covered the shifts. You were injured. You have standing. D's claim that you lack standing is legally false even by his brother's definition.
  *   **Unclean Hands** asks: "Are you worthy of equitable relief given your conduct regarding this matter?"
      *   *Application:* This is the real weapon D is using. It targets your hypocrisy. However, the lawyer brother correctly noted the qualification: the dirt must be in the "very matter he complains of."
  *   **The Popular Version:** The "glass houses" slogan is an ancestor of *neither*. It is a pragmatic warning ("you will be vulnerable to counter-attack"), not a jurisdictional rule. D is trying to upgrade a pragmatic warning into a jurisdictional bar.

  **Conclusion:** The analogy requires *unclean hands* to do the work D wants, but *standing* is irrelevant because you were injured. However, *unclean hands* in law denies *relief* (the court won't help you), it does not deny *truth* (the defendant still owes the debt). D wants it to deny truth.

  ### 4. The Three Hard Cases

  **Case 1: Connection (Expenses vs. Shifts)**
  *   **Legal Analogue:** *Unclean hands* requires the misconduct to relate to the subject matter of the suit. Padding expenses is not missing shifts.
  *   **Moral Implication:** If we follow the legal analogy strictly, your expense padding is irrelevant "general character" dirt. It should not bar your blame regarding shifts.
  *   **Domain-Restricted Loss:** The analogy supports a domain-restricted loss of authority. If you had missed shifts previously (which you admitted to), *that* dirt is in the same normative neighborhood. That weakens your specific blame about reliability. It does not, however, taint *all* blame you might ever offer (e.g., if D stole from the till, your expense padding would be less relevant).
  *   **Verdict:** The analogy supports D less than he thinks. General hypocrisy weakens moral voice; specific hypocrisy undermines specific authority. Neither makes the claim false.

  **Case 2: Derivative Dirt (You learned shirking from D)**
  *   **Legal Analogue:** This resembles **Estoppel** or **Invited Error**. A party cannot complain about a condition they helped create or encouraged.
  *   **Moral Implication:** This is the strongest point *against* D. If D modeled the behavior he now defends, he is morally estopped from complaining about your past participation in it.
  *   **Verdict:** This turns the *unclean hands* doctrine back on D. His hands are dirtier regarding the *origin* of the norm violation. This does not give you standing to shirk, but it destroys his standing to blame you for having learned from him.

  **Case 3: Third-Party Blame (Speaking for the Coverers)**
  *   **Legal Analogue:** **Representative Standing** or **Next Friend**. You are suing on behalf of those who were injured (the other volunteers).
  *   **Moral Implication:** In morality, speaking on behalf of the community is often *higher* standing than speaking for oneself. It moves the blame from "I am annoyed" to "We have been wronged."
  *   **Verdict:** The legal analogue helps *you*. If you are the representative of the injured party, your personal dirt is less relevant to the *claim*, though it may still affect your *credibility* as a representative. D's attack on your *personal* standing is irrelevant if you claim *representative* standing.

  ### 5. The Effect of Disclosure

  You disclosed your record upfront.
  *   **Legal Analogue:** This is akin to **Coming to Court with Clean Hands** (regarding the disclosure). It mitigates the *unclean hands* defense because you are not deceiving the court.
  *   **Moral Implication:** Hypocrisy is often defined by the *pretense* of virtue. By admitting your faults, you removed the pretense. You are not claiming to be perfect; you are claiming the *norm* is valid.
  *   **Verdict:** This restores significant authority. It shifts the speech act from "I judge you from above" to "We are both subject to this norm, and I am holding us to it." It makes the "glass houses" retort factually incorrect (you admitted the glass is cracked).

  ### 6. Scope of the Conclusion

  If D's conclusion survived (which the audit suggests it does not), what would it mean?

  *   **May Not Blame vs. Blame is False:** Legal doctrines regulate access to the *forum*, not the *facts*. Lack of standing does not mean the defendant didn't commit the tort. Therefore, even if you lacked standing, your blame would not be *false*. It would be *unactionable*.
  *   **Thought vs. Speech:** Legal standing regulates filing a complaint (speech/action). It does not regulate private belief. Morally, you are entitled to think D was wrong regardless of your own record. The constraint is on the *communicative demand*, not the private judgment.
  *   **D's Error:** D claims the blame is *void* (implies falsity or irrelevance). The legal analogy only supports that the blame is *unenforceable* by you.

  ### 7. Better Analogies

  The legal analogy is too adversarial and procedural. It treats blame as a lawsuit rather than a communicative act. Here are three superior analogies that preserve the truth in "glass houses" without delivering the conversation-stopper.

  **A. Blame as a Demand for Authority (The Political Analogy)**
  *   **Concept:** Blame is a claim to authority within a normative community.
  *   **Glass Houses Truth:** Hypocrisy undermines *authority*. If you violate the norm you enforce, you lose the right to *demand* compliance.
  *   **Correction:** It does not negate the *norm*. D still owes the team reliability. You may lack the *authority* to enforce it, but the *obligation* remains. Other members (who didn't shirk) retain the authority you lost.
  *   **Benefit:** Explains why D feels justified in ignoring *you*, without allowing him to ignore the *duty*.

  **B. Blame as a Speech Act (The Linguistic Analogy)**
  *   **Concept:** Blame has "felicity conditions." For blame to "work" (achieve reconciliation), certain conditions must be met.
  *   **Glass Houses Truth:** Hypocrisy is an infelicity. It makes the speech act "misfire." The target feels resentment rather than guilt.
  *   **Correction:** A misfired speech act is not a *lie*. "I pronounce you married" said by a non-priest is invalid, but it doesn't mean the couple isn't in love. Your blame misfired as a command, but it succeeded as a *description* of the wrong.
  *   **Benefit:** D can say "Your blame doesn't land on me," but he cannot say "The wrong didn't happen."

  **C. Calling in a Debt (The Financial Analogy)**
  *   **Concept:** Norms are like debts owed to the community.
  *   **Glass Houses Truth:** A debtor cannot demand repayment from others while refusing to pay their own debts.
  *   **Correction:** If I owe the bank money, I am still legally entitled to demand the bank honor *my* credit. My debt does not erase their obligation. However, my moral leverage is gone.
  *   **Benefit:** This fits your "Third-Party" case best. You are collecting a debt owed to the *team*, not to you personally. Your personal overdraft doesn't cancel the team's receivable.

  ### Summary Recommendation

  D's legal analogy is a **category mistake**. He uses procedural bars (standing/hands) to negate substantive truth (the missed shifts).
  1.  **You have standing** (you were injured by covering shifts).
  2.  **Your hands are not legally "unclean"** regarding the specific charge (expenses $\neq$ shifts), though your past shirking is relevant.
  3.  **Disclosure mitigates hypocrisy** by removing pretense.
  4.  **Representative capacity** overrides personal standing defects.

  **The Verdict on the Analogy:** The legal analogy proves that while a hypocrite may lose the *power to enforce*, they do not lose the *right to speak*, and their speech does not become *false*. D's conclusion that he owes "no uptake" is unsupported by the very doctrines he cites. He owes uptake to the *claim*, even if he rejects the *claimant*.

  **Strategy:** Do not argue your innocence. Argue the **representative nature** of your blame. "I am not speaking for myself; I am speaking for the three people who covered your Saturday shift. My record is mine; your debt is to them." This bypasses the standing trap entirely.
