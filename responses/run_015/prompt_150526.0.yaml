prompt: |-
  In the seminar I help run — an impartiality-and-giving reading group, mostly people with economics or policy backgrounds — a move keeps recurring. Impartial benevolence, it is said, is just prudence scaled up. Within a single life we aggregate constantly: a painful month now against ten comfortable years, a hard decade of training against a career, savings against consumption. Nobody thinks prudential aggregation is illegitimate, and the trade-offs it licenses are exactly the shape of the trade-offs utilitarianism makes between people. So, the argument goes, once you grant that intrapersonal aggregation is rational, there is no principled residue left to the objection from the separateness of persons; that objection is a label for an intuition that has not survived being thought about.

  I want an audit of the analogy, not a verdict on utilitarianism. Please give me:

  1. The mapping, made explicit. A table of correspondences: what plays the role of the temporal stages, of the deliberating planner, of compensation, of the party who bears the total, of prudence's authority, of whatever ties the stages of one life together.

  2. What the source quietly imports into the target. List the properties of a single life across time that the analogy carries over to a population — one locus at which the sum is experienced; one memory that owns both the cost and the benefit; the sacrificing and the compensated party being the same party; aggregation being optional for the agent and unenforceable by others; ex post ratification by the very person who decided. For each, say whether its absence in the interpersonal case actually does work in the separateness objection or is inert decoration.

  3. The disanalogies that matter, separated from the ones that don't. I suspect some candidate disanalogies are beside the point (that bodies are spatially located, that numbers of people are larger) and others carry the whole weight. Say which, and why.

  4. A gradient test I can put to the group. Hold the trade-off fixed and vary only the degree of psychological unification across the parties: one adult human across fifty years; a pair with shared affect and a joint decision procedure; ten thousand people with a standing assembly, joint deliberation, pooled records standing in for shared memory, ex post ratification, and a shared narrative each has internalized as their own; ten thousand strangers. Does the defensibility of aggregation vary monotonically along this gradient? If it does, what is doing the work — a brute fact about separate bodies, or an empirical, degree-valued fact about how unified the parties are? And then the question that matters: does a monotonic answer vindicate the analogy or destroy it, given that the analogy's users need aggregation to be fine at the far end of the gradient? If you think the unity of a single life is itself achieved by deliberative self-constitution rather than given, say what that does to the argument.

  5. Whether the conclusion survives. Does the analogy carry the claim that the separateness objection is dead, or was the analogy doing the work all along? If it fails, propose a better comparison — one that captures whatever is genuinely right about interpersonal aggregation without importing the features you listed in section 2 — and note whether what survives is utilitarianism specifically or something weaker.

  Two constraints: assume no access to libraries or the web, so no citations, reading lists, or appeals to what some author argued; I want the argument, not the literature. And if you use any term of art, define it in a line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on impartiality and giving (likely Effective Altruism-adjacent), mostly economics/policy backgrounds.
      *   **Core Argument:** "Impartial benevolence is just prudence scaled up." (Intrapersonal aggregation $\rightarrow$ Interpersonal aggregation). The "separateness of persons" objection is dismissed as an intuition that doesn't survive scrutiny.
      *   **Task:** Audit the analogy, not verdict on utilitarianism.
      *   **Constraints:** No citations/literature appeals (argument only), define terms of art inline.
      *   **Required Sections:**
          1.  Explicit Mapping (Table).
          2.  Imported Properties (Source $\rightarrow$ Target) & their relevance to the objection.
          3.  Disanalogies (Matter vs. Don't Matter).
          4.  Gradient Test (Psychological Unity) & Implications.
          5.  Conclusion (Does the analogy survive? Better comparison? Utilitarianism or weaker?).

  2.  **Deconstruct the Core Argument (Prudence $\rightarrow$ Benevolence):**
      *   *Source:* Intrapersonal aggregation (Prudence). One person making trade-offs across time.
      *   *Target:* Interpersonal aggregation (Impartial Benevolence/Utilitarianism). One agent making trade-offs across people.
      *   *Claim:* If it's rational to sacrifice now for later (within a life), it's rational to sacrifice one person for another (within a population), provided the total welfare increases. The "separateness of persons" is just a psychological barrier, not a moral one.

  3.  **Drafting Section 1: The Mapping:**
      *   Need to align the structural elements of the two scenarios.
      *   *Temporal Stages* $\leftrightarrow$ *Distinct Persons*.
      *   *Deliberating Planner (Self)* $\leftrightarrow$ *Social Planner (Benevolent Agent)*.
      *   *Compensation (Future Self benefits)* $\leftrightarrow$ *Compensation (Others benefit)*.
      *   *Party Bearing Total (The Person)* $\leftrightarrow$ *Party Bearing Total (The Population/Society)*.
      *   *Prudence's Authority (Rationality of self-interest)* $\leftrightarrow$ *Morality's Authority (Rationality of impartiality)*.
      *   *Tie Across Stages (Psychological Continuity/Memory)* $\leftrightarrow$ *Tie Across Persons (Shared Humanity/Sympathy/Institution)*.

  4.  **Drafting Section 2: Imported Properties:**
      *   What comes with the "Single Life" package that gets smuggled into the "Population" package?
      *   *One Locus of Experience:* In a life, pain and pleasure happen to the same "subject." In a population, they happen to different subjects. *Relevance:* High. This is the core of the separateness objection.
      *   *One Memory:* The future self remembers the sacrifice. The beneficiary doesn't necessarily "own" the sacrificer's pain. *Relevance:* High. Affects the meaning of "compensation."
      *   *Same Party (Sacrificer = Beneficiary):* In prudence, I hurt me to help me. In benevolence, I hurt you to help them. *Relevance:* Critical. This is the consent/authority gap.
      *   *Optional/Unenforceable:* I can choose to be imprudent. Others cannot choose to let me sacrifice them. *Relevance:* High. Rights vs. Rationality.
      *   *Ex Post Ratification:* Future me can thank past me. The beneficiary cannot ratify the victim's loss. *Relevance:* High.

  5.  **Drafting Section 3: Disanalogies:**
      *   *Don't Matter:* Spatial location (bodies are separate), Number size (2 people vs. 2 time slices). These are superficial.
      *   *Do Matter:*
          *   *Consent/Authority:* I have authority over my future selves (mostly). I do not have authority over you.
          *   *Phenomenological Unity:* There is a "what it is like" to be a life. There is no "what it is like" to be a society.
          *   *Compensation Mechanism:* Intrapersonal compensation is automatic (it's all mine). Interpersonal compensation is contingent and external.

  6.  **Drafting Section 4: The Gradient Test:**
      *   *Scenario:* Vary psychological unity.
      *   1. One human (50 years).
      *   2. Deeply bonded pair (shared affect/decision).
      *   3. Highly integrated collective (shared narrative/memory).
      *   4. Strangers.
      *   *Question:* Does defensibility vary monotonically?
      *   *Analysis:* Yes, intuitively, we accept sacrifice more readily the more "unified" the group feels (e.g., family, tight-knit community) vs. strangers.
      *   *Implication:* If unity is the key, then the "Single Life" is just the extreme end of unity.
      *   *Crucial Turn:* If unity is *achieved* (deliberative self-constitution) rather than *given*, then the "Single Life" isn't a metaphysical fact but a psychological achievement. If so, the analogy suggests we should *build* unity to justify aggregation, rather than assuming aggregation is justified by metaphysics.
      *   *Vindication or Destruction?* If the gradient holds, it suggests the "Separateness" objection is actually a "Disunity" objection. If the proponent needs aggregation to be fine at the "Strangers" end (which utilitarianism does), but the gradient shows it's *less* defensible there, the analogy fails to bridge the gap. It shows aggregation depends on unity, which strangers lack.

  7.  **Drafting Section 5: Conclusion:**
      *   *Does the analogy survive?* No, not as a proof that separateness is irrelevant. It reveals that separateness *matters* because it correlates with disunity.
      *   *Was the analogy doing the work?* The analogy relies on ignoring the imported properties from Section 2.
      *   *Better Comparison:* Instead of Prudence, compare to *Insurance* or *Contract*.
          *   *Why:* Insurance pools risk across distinct people based on ex-ante agreement and probabilistic benefit, not ex-post summation of welfare. It respects separateness while allowing aggregation.
      *   *Utilitarianism or Weaker?* This points toward a weaker view (Prioritarianism or Contractualism) that respects the distinctness of claims rather than summing them into a single heap.

  8.  **Review and Refine:**
      *   *Check Constraints:* No citations? (Check). Define terms? (Check). Tone? (Analytic, seminar-appropriate).
      *   *Refining Section 4:* Make sure the "deliberative self-constitution" point is clear. If a life is unified by narrative, maybe a society *could* be, but currently isn't. This shifts the burden.
      *   *Refining Section 2:* Ensure the distinction between "inert decoration" and "working objection" is sharp.
      *   *Refining Section 1:* Ensure the table is clear.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Section 4, be careful not to say the gradient *proves* utilitarianism wrong. Say it tests the *source of authority* for aggregation.
      *   *Correction:* In Section 5, ensure the "Insurance" analogy is distinct enough from Utilitarianism. Insurance is ex-ante; Utilitarianism is often ex-post. This is a key distinction.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is an audit of the "Prudence as Scaled-Up Benevolence" analogy, structured for your reading group.

  ### 1. The Mapping

  This table makes explicit the structural correspondence the argument relies on. It translates the vocabulary of **Intrapersonal Prudence** (Source) into the vocabulary of **Interpersonal Benevolence** (Target).

  | Component | Source: Intrapersonal Prudence | Target: Interpersonal Benevolence |
  | :--- | :--- | :--- |
  | **Units of Aggregation** | Temporal stages (time-slices) of a single life. | Distinct persons within a population. |
  | **The Deliberator** | The agent planning their own life. | The impartial moral agent (or social planner). |
  | **The Currency** | Welfare units (pleasure, pain, preference satisfaction). | Welfare units (identical metric). |
  | **Compensation** | Future enjoyment offsetting present pain. | Others' enjoyment offsetting one person's pain. |
  | **Locus of Total** | The single life (the "person"). | The population (the "society" or "world"). |
  | **Authority** | Rational self-interest (Prudence). | Impartial morality (Benevolence). |
  | **The "Glue"** | Psychological continuity (memory, character, intention). | Shared humanity, sympathy, or institutional ties. |
  | **Risk/Trade-off** | Saving now for consumption later. | Sacrificing one for the greater good. |

  ### 2. Imported Properties

  The analogy works by treating the "Target" (Population) as if it possesses the metaphysical and psychological features of the "Source" (Single Life). Below are the properties imported from the Source, and an assessment of whether their absence in the Target is fatal to the argument or merely cosmetic.

  **1. One Locus of Experience**
  *   **Import:** In a single life, there is a single subject who "feels" the sum. The pain and the pleasure land in the same phenomenological bucket.
  *   **Target Reality:** There is no "super-subject" that feels the total welfare of a population.
  *   **Verdict:** **Works in the objection.** The separateness objection claims that summing experiences across distinct subjects is a category error. If there is no one to "have" the total, the total is a fiction of the observer, not a fact of the experience.

  **2. Identity of Sacrificer and Beneficiary**
  *   **Import:** In prudence, the person who suffers the cost is numerically identical to the person who reaps the benefit (just at different times).
  *   **Target Reality:** The sacrificer and beneficiary are distinct entities.
  *   **Verdict:** **Works in the objection.** This is the core of the "no principled residue" claim. If A suffers so B can gain, A has a grievance that "Future Me" does not have against "Past Me." The analogy hides this by assuming the "Group" is a single agent.

  **3. Ex Post Ratification**
  *   **Import:** Future me can look back and endorse the sacrifice ("It was worth the pain"). The unity of memory allows the cost to be re-contextualized as an investment.
  *   **Target Reality:** The victim cannot ratify the sacrifice if they are dead or severely harmed; the beneficiary cannot ratify it on the victim's behalf.
  *   **Verdict:** **Works in the objection.** Without ratification, the trade-off remains an external imposition, not an internal narrative of growth or investment.

  **4. Authority and Enforcement**
  *   **Import:** I have authority over my future selves. I can bind them. If I choose imprudence, I hurt only myself.
  *   **Target Reality:** I do not have authority over you. If I choose "imprudence" for you, I violate your sovereignty.
  *   **Verdict:** **Works in the objection.** Prudence is a norm of rationality for a sovereign agent; Benevolence (in this strong aggregative form) acts as a sovereign over non-consenting subjects.

  **5. Optional Aggregation**
  *   **Import:** I can choose *not* to aggregate (e.g., live for the moment). It is irrational, but permissible.
  *   **Target Reality:** Moral aggregation is often presented as obligatory (you *must* maximize the good).
  *   **Verdict:** **Inert decoration.** This is about the demandingness of the theory, not the structural validity of the aggregation itself.

  ### 3. Disanalogies: What Matters vs. What Doesn't

  **Disanalogies That Do Not Matter (Decorative)**
  *   **Spatial Location:** That persons are in different bodies while time-slices are in the same body is physically true but morally inert. If teletransportation were possible, bodily continuity would break, yet we might still treat the traveler as one person.
  *   **Scale/Number:** That there are billions of people but only ~80 years of time-slices is a difference of magnitude, not kind.
  *   **Simultaneity:** That persons exist at the same time while time-slices exist sequentially does not change the logic of the trade-off (delayed gratification vs. distributed gratification).

  **Disanalogies That Carry the Weight (Structural)**
  *   **The Phenomenological Gap:** There is a "what it is like" to be a person. There is no "what it is like" to be a population. Aggregation requires a subject to whom the sum matters. In prudence, the subject exists. In benevolence, the subject is a construct.
  *   **The Consent/Authority Gap:** I own my future. I do not own you. Prudence is self-regulation; Utilitarian aggregation (in this strong form) is other-regulation. The move from "I may sacrifice for me" to "You may be sacrificed for them" requires a transfer of authority that the analogy assumes rather than proves.
  *   **The Compensation Mechanism:** Intrapersonal compensation is automatic (it is all mine). Interpersonal compensation is contingent (it requires others to actually care or pay). If the beneficiary does not compensate the victim, the "loss" remains isolated in the victim.

  ### 4. The Gradient Test

  **The Setup:** Hold the trade-off fixed (one unit of severe pain prevents ten units of moderate pain). Vary only the **Psychological/Decisional Unity** between the parties.

  1.  **Single Human:** One adult across 50 years. (High Unity)
  2.  **Intimate Dyad:** A couple with shared finances, deep empathy, joint decision procedures, and a "we" narrative. (High-Medium Unity)
  3.  **Integrated Collective:** 10,000 people with a standing assembly, pooled records acting as shared memory, ex post ratification rituals, and a shared narrative internalized as their own. (Medium-Low Unity)
  4.  **Strangers:** 10,000 people with no contact, no shared memory, no joint deliberation. (Zero Unity)

  **The Question:** Does the defensibility of the aggregation vary monotonically along this gradient?

  **The Analysis:**
  Intuitively, yes. We find the sacrifice most defensible in Case 1, less in Case 2, controversial in Case 3, and morally suspect in Case 4.
  *   **What is doing the work?** It is not a brute fact about separate bodies (Case 3 and 4 have the same bodies, different unity). It is an empirical fact about **psychological and institutional integration**.
  *   **Monotonicity Implication:** If defensibility tracks unity, then "Separateness of Persons" is actually a proxy for "Disunity of Experience."

  **The Crucial Turn:**
  *   **If Unity is Given:** If a single life is unified by metaphysics (a soul, a brain), then the gradient shows that strangers *lack* the necessary condition for aggregation. The analogy fails at the far end (Utilitarianism's usual domain).
  *   **If Unity is Achieved:** If a single life is unified by *deliberative self-constitution* (narrative, memory, planning), then the "Single Life" is just Case 1 on the gradient.
      *   **Vindication or Destruction?** This **destroys** the analogy as a defense of standard Utilitarianism. Standard Utilitarianism demands aggregation *even among strangers* (Case 4). If the gradient shows aggregation is only defensible when unity is high, then Utilitarianism is unjustified in the real world (which looks like Case 4).
      *   **The Burden Shift:** The argument implies that to make interpersonal aggregation as rational as prudence, we must *build* the institutions of Case 3 (shared memory, ratification, joint deliberation). Without building that unity, the aggregation is illegitimate.

  ### 5. Conclusion: Does the Analogy Survive?

  **Verdict:** The analogy does not survive as a proof that the "separateness of persons" objection is dead. Instead, it reveals that the objection is alive and well, hiding inside the imported properties of Section 2. The analogy assumes the conclusion (that the population is a single agent) to prove the conclusion (that we should treat the population as a single agent).

  **Why it fails:** The move from Prudence to Benevolence works only if the "Glue" (Psychological Continuity) in the Source is matched by a similar "Glue" in the Target. In the real world of strangers, that glue is absent. Therefore, the trade-offs are not the same shape. Intrapersonal trade-offs are investments; interpersonal trade-offs (among strangers) are impositions.

  **A Better Comparison:**
  Do not compare Benevolence to Prudence. Compare Benevolence to **Insurance**.

  *   **The Analogy:** A group of strangers agrees to a pool. Everyone pays a premium (sacrifice). Some suffer a loss (accident/illness). The pool compensates them.
  *   **Why it fits:**
      1.  **Respects Separateness:** It acknowledges distinct parties with distinct interests.
      2.  **Allows Aggregation:** It pools risk and resources across persons.
      3.  **Ex-Ante vs. Ex-Post:** Justification lies in the *ex-ante* agreement (everyone is safer by joining) rather than *ex-post* summation (the total happiness is higher).
      4.  **No Super-Subject:** It does not require a "society" that feels the total pain.

  **What Survives:**
  This shift moves you away from **Utilitarianism** (maximize the sum of welfare regardless of distribution) toward **Contractualism** or **Prioritarianism** (rules that no one could reasonably reject, or weighting benefits to the worse off).
  *   **Utilitarianism** requires the "Single Life" analogy to hold (the sum is what matters).
  *   **Insurance/Contract** requires only that the trade-off be mutually advantageous or fair from a position of equality.

  **Final Note for the Group:**
  If your group insists that "Impartial Benevolence is Prudence Scaled Up," ask them: *"Are we willing to build the institutions of the Integrated Collective (shared memory, ratification, joint narrative) required to make that analogy true? Or are we asserting the authority of a planner over strangers without the unity that makes planning rational?"* The first path is a political project of unification; the second is an assertion of authority that the separateness of persons was designed to block.
