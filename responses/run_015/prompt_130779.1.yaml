prompt: |-
  I run a weekly student reading group on decision theory — mostly CS majors with a few philosophy people who wandered in — and we get 75 minutes in a room with a tiny whiteboard and a projector that has never once worked. Last week we did Newcomb's problem and it went okayish: maybe a third of them left convinced that one-boxing is just wishful thinking in a tuxedo. This week I want to do acausal trade, meaning the idea that two agents who cannot affect each other, observe each other, or communicate might still cooperate because their decisions are correlated through the similarity of their decision procedures rather than through any causal link or shared cause. My co-organizer says this is literally just one-boxing with extra steps and we should spend the session on Bayesian epistemology instead, and I half see his point but can't artiuclate what's wrong with it well enough to teach from.

  So don't explain acausal trade to me — plan how I should explain it to them. What I really want is the dependency structure: the order the pieces have to go in and what depends on what. My instinct is that I need them to first accept a case where your action is strong evidence about an outcome without causing it, and only then get them to a case where the correlation isn't explained by a common cause or by somebody simulating them either — but I don't know how to make that second move feel like a real step rather than a sleight of hand, and I worry that starting from Newcomb just replays last week's fight.

  I also need one example to carry the whole session. Here's the one I sketched: two agents, one in each of two universes that will never interact; each has 100 units of its own resource; each can burn k units of its own resource to manufacture 4k units of the good the other one values; unspent units are worth 1 util to their owner and the other's good is worth 1 util per unit to the other. Each is fairly but not fully confident the other exists. And the bit I added to make it hard: the two agents run the same architecture and style of reasoning, but one's utility function has been edited to value the other colour of widget, and their confidence that a counterpart exists differs (say 0.8 versus 0.5). They cannot send messages, so they cannot haggle over how much each burns — each just picks a number in private. Tell me whether that carries the session, what it is missing, what it has that it shouldn't, and why not the usual candidates: the exact-copy prisoner's dilemma, the old puzzle where a prize goes to you only if exactly one of twenty people asks for it, or two galaxy-spanning civilisations that value paperclips and staples. Should I start symmetric and then break the symmetry, or start asymmetric and let the copy case show up as a special case?

  Then the misconception map, with the point in the sequence where each should be headed off — and I mean headed off, not just corrected afterwards. The ones I expect: that this is a promise, a reputation effect, or iterated cooperation in disguise; that my choice somehow causally pushes the other agent's choice; that correlation without a common cause is incoherent so the whole setup is broken (this one will come from the strongest CS student); that it's still just evidential decision theory so nothing new is on the table; that it only works if the other agent is literally running my code, and the opposite error that any sufficiently reasonable agent will do the same thing; that cooperating with a causal-decision-theory counterpart is still worth something; and that this is Pascal's mugging with better branding, a licence to trade with any alien you can imagine. Tell me which of these I should actually invite rather than prevent, and flag any you think I'll get that I haven't listed.

  Finally: what should I openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking the problem of how to weight which computations count as existing, logical uncertainty, updatelessness, whether copies in other branches of quantum mechanics are the same kind of thing as distant civilisations — and which of those I should name-and-drop versus never mention at all; plus one question I can ask at minute seventy where I could actually tell a right answer from a wrong one, so I know whether the idea landed or whether they just got talked into something. (There's a departmental coffee thing right after, so they're going to be restless.)
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **User:** Runs a weekly student reading group on decision theory.
      *   **Audience:** Mostly CS majors, some philosophy. Smart, technical, likely skeptical of "magic" reasoning.
      *   **Constraints:** 75 minutes, tiny whiteboard, broken projector (reliance on speech/board/handouts).
      *   **Previous Session:** Newcomb's Problem (mixed success, significant skepticism about one-boxing).
      *   **Current Goal:** Teach Acausal Trade (AT).
      *   **Co-organizer's Objection:** AT is just Newcomb's with extra steps; should do Bayesian Epistemology instead.
      *   **User's Need:** A structural plan (dependency order), evaluation of their specific example, misconception management, scope boundaries, and a comprehension check question.
      *   **Tone:** Pragmatic, pedagogical, slightly weary but committed. Needs to avoid "sleight of hand."

  2.  **Deconstruct the Core Challenge:**
      *   The user identifies the crux: Moving from "Action is evidence of outcome without causation" (Newcomb/Evidential Decision Theory - EDT) to "Correlation without common cause or simulation" (Acausal Trade/Functional Decision Theory - FDT).
      *   The co-organizer has a point: If you treat AT as just EDT applied to logical correlations, it *looks* like Newcomb. The distinction is *what* is correlated. In Newcomb, it's your choice vs. Predictor's past choice. In AT, it's your choice vs. Distant Agent's choice via logical necessity of similar algorithms.
      *   The session needs to validate the CS majors' skepticism (causality is real) while showing where the "logical" layer operates.

  3.  **Evaluate the Proposed Example:**
      *   *Scenario:* Two agents in separate universes. Resource burning game. Asymmetric confidence (0.8 vs 0.5). Asymmetric utilities (widgets vs. doodads). Same architecture.
      *   *Pros:* Removes communication, removes common cause (separate universes), introduces stakes, introduces asymmetry (prevents simple "copy" reasoning).
      *   *Cons:* A bit complex for a broken-projector setting. The "separate universes" bit might trigger metaphysical debates too early. The asymmetry (0.8 vs 0.5) makes the math messy for a whiteboard derivation.
      *   *Comparison to Standard Candidates:*
          *   *Exact-copy PD:* Too easy. "Of course I cooperate with myself." Doesn't generalize.
          *   *Twenty people/unique prize:* Coordination problem, not really trade.
          *   *Paperclips/Staples (AI takeoff):* Too sci-fi, triggers "will this happen?" debates instead of "does this make sense?"
      *   *Verdict:* The user's example is good *but* needs simplification for the whiteboard. Start symmetric to establish the mechanism, then introduce asymmetry to show robustness. Don't start asymmetric; it hides the core logic.

  4.  **Develop the Dependency Structure (The "Flow"):**
      *   *Phase 1: The Anchor (15 mins).* Re-hash Newcomb briefly but pivot to *why* one-boxing works (logical correlation, not magic). Address the "wishful thinking" objection immediately.
      *   *Phase 2: The Bridge (20 mins).* Move from Predictor to Peer. If Omega predicts you, Omega simulates you. If Omega simulates you, Omega *is* a version of you. If another agent is a version of you, you can trade.
      *   *Phase 3: The Core Example (25 mins).* Use the user's example but simplify parameters. Show the math of expected utility under FDT vs. CDT.
      *   *Phase 4: Objections & Boundaries (15 mins).* Handle misconceptions.
      *   *Phase 5: The Check (Last 5 mins).* The specific question.

  5.  **Address the Misconception Map:**
      *   *Invite:* "It's just EDT." (Good discussion point on logical vs. evidential). "It's Pascal's Mugging." (Tests bounds of probability).
      *   *Prevent:* "It's a promise/reputation." (Kills the "acausal" part). "Causal push." (Physics violation). "Correlation without cause is incoherent." (Needs the "logical fact" distinction).
      *   *New One:* "Why should I care about *that* copy?" (Indexical uncertainty/identity).

  6.  **Scope Boundaries (What to Refuse):**
      *   *Refuse:* Measure problem (weighting computations), Updatelessness (too technical), Quantum Branching (distracting).
      *   *Name-drop:* Logical Uncertainty, Updateless Decision Theory (UDT).
      *   *Never Mention:* Tegmark Level IV multiverse specifics (too metaphysical).

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Refining the Example:* The 0.8 vs 0.5 confidence is tricky. If Agent A thinks B exists (0.8) and B thinks A exists (0.5), do they trade? Only if the expected gain outweighs the cost *given the correlation*. Actually, for a 75-min session, keep the existence probability at 1.0 but make the *values* asymmetric. It isolates the trade logic from the existence probability logic. Or, keep the existence probability but make it symmetric (0.9 both) to start. Let's advise simplifying the probabilities to focus on the trade mechanism.
      *   *Refining the Newcomb Link:* The co-organizer says AT is Newcomb + steps. The counter-argument is: Newcomb is *vertical* (You vs. Predictor). AT is *horizontal* (You vs. Peer). The mechanism is the same (logical correlation), but the implication is broader (cooperation without enforcement).
      *   *The "Check" Question:* Needs to distinguish between "I cooperate because I hope they do" (CDT/False) and "I cooperate because my decision determines theirs" (FDT/True).

  8.  **Final Polish:**
      *   Ensure the tone matches the user's (pragmatic, slightly academic but grounded).
      *   Make sure the whiteboard constraints are respected (minimal drawing, clear variables).
      *   Address the "CS Major" audience (appeal to code/algorithm similarity).

  **(Self-Correction during drafting):** I initially thought about telling them to drop the asymmetry. But the user specifically asked about starting symmetric vs. asymmetric. I should advise starting symmetric to build intuition, *then* breaking symmetry to show it's not just "cooperating with yourself."
  Also, the "Correlation without common cause is incoherent" objection from the CS student is the hardest one. I need to give the user a specific phrase to use: "Logical Facts vs. Physical Events."

  9.  **Finalizing the Output Structure:**
      *   Session Architecture (Time & Flow).
      *   The Example (Critique & Modification).
      *   Misconception Map (Prevent vs. Invite).
      *   Scope Boundaries (Refuse vs. Name-drop).
      *   The Comprehension Check.

