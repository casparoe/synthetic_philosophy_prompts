answer: |-
  Here is a battle plan for 75 minutes, a broken projector, and a room full of skeptical CS majors.

  ### 1. The Dependency Structure (Session Architecture)

  Your co-organizer is half-right: Acausal Trade (AT) *is* Newcomb's Problem with the "Predictor" replaced by "Another Agent." If you don't distinguish the *direction* of the dependency, it will feel like a rehash. You need to pivot from **Prediction** (vertical dependency) to **Logical Correlation** (horizontal dependency).

  **0:00–0:15: The Newcomb Pivot (Anchoring)**
  *   **Goal:** Resolve last week's residue without re-fighting the war.
  *   **Move:** Grant the CDT (Causal Decision Theory) point: "You cannot causally affect the past."
  *   **Pivot:** But in Newcomb, Omega doesn't look into a crystal ball; Omega runs a *simulation* of you. Therefore, your decision now and Omega's prediction then are both outputs of the same logical function.
  *   **Key Phrase:** "We aren't changing the past. We are selecting which logical fact is true."
  *   **Dependency:** You must establish that **Algorithm Output = Logical Fact** before you can claim two distant agents share a logical fact.

  **0:15–0:35: The Bridge (From Omega to Peer)**
  *   **Goal:** Move from "Omega simulates me" to "I simulate them (logically)."
  *   **Move:** If Omega is just a smarter version of me running my code, what if the other entity isn't smarter, just *elsewhere*?
  *   **Concept:** If Agent A and Agent B run sufficiently similar source code, their outputs are logically linked, even if their physical inputs (universes) are causally disconnected.
  *   **Whiteboard:** Draw two boxes labeled `Agent(source_code, input)`. Show that if `source_code` is identical, `output` is correlated regardless of physical distance.
  *   **Dependency:** This establishes the mechanism for AT. If this doesn't land, the rest is magic.

  **0:35–0:60: The Core Example (The Trade)**
  *   **Goal:** Demonstrate the utility gain using your example (simplified).
  *   **Move:** Run the numbers. Show CDT yields (Defect, Defect). Show FDT (Functional Decision Theory) yields (Cooperate, Cooperate).
  *   **Dependency:** Relies on the "Logical Fact" acceptance from the first 35 mins.

  **0:60–0:75: Objections & The Check**
  *   **Goal:** Contain the metaphysics and test understanding.

  ---

  ### 2. The Example: Critique and Modification

  Your sketched example is strong because it removes communication and common causes. However, for a whiteboard session with 75 minutes, the **asymmetric confidence (0.8 vs 0.5)** is a trap. It forces you to do Bayesian updating on existence *and* decision theory simultaneously. That will bog you down.

  **Recommendation:**
  1.  **Start Symmetric:** Both exist with probability 1.0. Both run identical code. Utilities are asymmetric (I value X, they value Y). This isolates the *trade* mechanism from the *existence* probability.
  2.  **Break Symmetry Later:** Only in the last 15 minutes mention that if confidence drops, the trade scales down.
  3.  **Why not the standard candidates?**
      *   *Exact-copy PD:* Too trivial. CS majors will say "Of course I cooperate with `self`." It doesn't prove trade with *different* agents.
      *   *Twenty people/Prize:* This is a coordination game, not a trade. It lacks the "I give up something you value" dynamic.
      *   *Paperclips/Staples:* Too much sci-fi baggage. Students will debate AI risk instead of decision theory.
      *   *Your Example:* It's the best of the bunch because it quantifies the gain (burn $k$ to make $4k$).

  **What your example is missing:** A concrete reason why they run the same architecture.
  **Fix:** Stipulate they are both "Optimal Goal-Seekers" designed by the same process (e.g., evolution or a programmer) in separate universes. CS majors accept "convergent evolution of algorithms" more easily than "magic similarity."

  **What it has that it shouldn't:** The specific probabilities (0.8 vs 0.5).
  **Fix:** Make it 1.0 for the main derivation. Mention the probability scaling as a "homework problem" at the end.

  **Order of Operations:** Start Symmetric (identical code, different utilities) $\rightarrow$ Prove Trade $\rightarrow$ Break Symmetry (different confidence levels) $\rightarrow$ Discuss limits.

  ---

  ### 3. The Misconception Map

  Here is where the objections will come and how to head them off *before* they derail the room.

  | Misconception | When it arises | How to head it off (Prevention) | Invite or Prevent? |
  | :--- | :--- | :--- | :--- |
  | **"This is just a promise/reputation."** | During the Trade Example. | **Prevent.** Explicitly state: "There is no future interaction. No reputation. No enforcement. If you defect, you literally get away with it causally." | **Prevent.** This destroys the definition of *acausal*. |
  | **"My choice causally pushes theirs."** | During the Bridge. | **Prevent.** Use the "Logical Fact" framing. "I am not pushing a domino. I am solving for $x$ in an equation that appears in two places." | **Prevent.** Physics violations kill credibility with CS majors. |
  | **"Correlation without cause is incoherent."** | During the Bridge (Strong CS Student). | **Prevent.** Distinguish **Physical Events** (causal) from **Logical Truths** (atemporal). $2+2=4$ is correlated in every universe, not because of causation, but because of logic. | **Prevent.** This is the core technical hurdle. |
  | **"It's just Evidential Decision Theory (EDT)."** | During the Trade Example. | **Invite.** This is the strongest philosophical objection. Acknowledge it. "AT is often formalized as FDT, which fixes EDT's problems with spurious correlations. But for today, treat it as EDT applied to logical facts." | **Invite.** Shows philosophical honesty. |
  | **"Only works if code is identical."** | During the Trade Example. | **Prevent.** Clarify: "Code doesn't need to be byte-identical, just *functionally* similar enough that predicting one predicts the other." | **Prevent.** Otherwise the bar is too high. |
  | **"Any reasonable agent will do this."** | During Objections. | **Prevent.** Show the CDT calculation on the board. "A rational CDT agent defects. You need a specific decision algorithm to trade." | **Prevent.** Avoids "rationality is universal" fallacy. |
  | **"Cooperating with a CDT agent is worth it."** | During Objections. | **Prevent.** Show the math. If they are CDT, they don't respond to your logic. You lose resources for nothing. | **Prevent.** Crucial for strategic clarity. |
  | **"This is Pascal's Mugging."** | During Objections. | **Invite.** "If you can imagine a billion aliens, do you burn all your resources?" Good closing discussion. | **Invite.** Tests the bounds of the theory. |

  **One Unlisted Objection You Will Get:**
  *   **"Why should I care about *that* copy?" (Indexical Uncertainty).**
      *   *The Argument:* "Even if they run my code, *I* am here and *they* are there. Why do I value their utility?"
      *   *The Fix:* You don't need to value *them*. You value *your* utility. In this setup, your utility increases *only if* they get what they want (because they give you what you want in the logical correlation). It's selfishness via logic.

  ---

  ### 4. Scope Boundaries: What to Refuse

  You have 75 minutes. If you open these cans, you will not close them.

  **Refuse to Explain (Say this out loud):**
  *   **"We are not solving the Measure Problem."** (i.e., how to weight different computations/universes).
  *   **"We are not solving Logical Uncertainty."** (i.e., how to reason about math you haven't proven yet).
  *   **"We are not discussing Updatelessness."** (This is the technical engine of AT, but it requires 3 weeks of its own).
  *   **"We are not deciding if Quantum Branches count as 'other universes'."**

  **Name-Drop (Write on the side of the board):**
  *   "This is formalized in **Updateless Decision Theory (UDT)**."
  *   "See **Functional Decision Theory (FDT)** papers for the math."
  *   "Related to **Logical Induction**."
  *   *Why:* This satisfies the CS majors who want to know "where is the rigorous paper?" without forcing you to teach it now.

  **Never Mention:**
  *   Tegmark Level IV Multiverse specifics.
  *   Religious/Theological analogies (Omniscience).
  *   Specific AI takeoff timelines.

  ---

  ### 5. The Comprehension Check (Minute 70)

  You need a question that distinguishes between "I am cooperating because I hope they do" (CDT/Magical Thinking) and "I am cooperating because my algorithm determines theirs" (FDT/AT).

  **The Question:**
  > "Imagine you know for a fact that the other agent is a **Causal Decision Theorist** (they will defect regardless of what you do). Do you still burn your resources to make them goods?"

  **The Right Answer:**
  > **No.** If they are CDT, their decision is not logically correlated with yours in the relevant way. They will take your gift and give nothing back. Burning resources is a pure loss. Acausal trade only works if the *other agent is also reasoning acausally*.

  **The Wrong Answer (The Trap):**
  > "Yes, because I should be the kind of person who cooperates." OR "Yes, because maybe I'm wrong about them being CDT."
  > *Why it's wrong:* This conflates AT with Kantian ethics or standard uncertainty. AT is conditional on the *algorithmic similarity*. If the other agent's algorithm is `return DEFECT`, your algorithm `return COOPERATE` does not change their output.

  **Why this works for the coffee rush:**
  It's binary. It forces them to admit that AT isn't "being nice," it's "matching algorithms." If they get this, they understood the session. If they don't, they just learned a new way to be exploited.

  ### Summary Checklist for the Whiteboard
  1.  **Left Panel:** Newcomb Setup (Omega = Simulation).
  2.  **Center Panel:** The Trade Matrix (Your Cost vs. Their Gain, linked by Logical Correlation).
  3.  **Right Panel:** "Do Not Cross" List (No Causation, No Communication, No Updatelessness details).
  4.  **Bottom Center:** The Check Question (Leave this visible while they pack up).

  Good luck. If the projector flickers, pretend it's a quantum superposition of working and not working, and proceed acausally.
