          *   Must address the "Swap" thought experiment (qualitative inversion of intrinsic properties).
          *   Must address the "Graft" thought experiment (agreement on actual structure, disagreement on modal/counterfactual structure).
          *   Must evaluate the user's own precisification ("structure is whatever survives relabeling").
          *   Tone: Intellectual, precise, slightly informal (pub context), respectful but critical (avoiding "canned essay").
          *   Key Question: Is the claim needed for Job 1 stronger/weirder than Job 2?

  2.  **Deconstruct the Slogan ("All we know is structure"):**
      *   This is the core of *Structural Realism* (specifically Epistemic Structural Realism - ESR vs. Ontic Structural Realism - OSR).
