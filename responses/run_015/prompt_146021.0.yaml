      *   *Job 2 (Realism/Continuity):* "Theories change, structure stays." This is the classic Worrall argument for ESR. It saves realism from the Pessimistic Meta-Induction.
      *   *Tension:* Job 1 says "Nature is *only* structure" (or we can't access the rest). Job 2 says "Structure is the *stable part* of our knowledge" (implying there might be unstable parts, i.e., nature/nature's intrinsic character).

  3.  **Develop the Menu of Claims:**
      *   *Level 1: Trivial/Methodological.* "Science deals with measurable relations." (Platitude).
      *   *Level 2: Epistemic Humility.* "We can't know intrinsic natures, even if they exist." (Substantive, Kantian).
      *   *Level 3: Ontic Elimination.* "There *are* no intrinsic natures, only relations." (Wild, OSR).
      *   *Level 4: Modal/Counterfactual.* "Structure includes all nomological possibilities." (Substantive).

  4.  **Analyze Job 1 vs. Job 2 against the Menu:**
