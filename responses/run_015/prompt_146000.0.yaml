answer: |-
  Dear colleague, I have spent considerable time with the material you sent, and I want to begin by saying that your hypothesis is the most promising diagnostic tool I have seen in years of watching this debate cycle without traction. You are right to suspect that we are not having one disagreement, and recognizing this is the only way to dissolve the impasse rather than merely resting within it. The frustration your committee feels is not a failure of intellect or goodwill but a structural feature of the concept itself. The therapy/enhancement distinction is being asked to stabilize a conflict between competing moral frameworks that do not naturally align. When you propose that the distinction is doing three separate jobs, an allocative job about resources, a permissive job about liberty, and an interpretive job about meaning, you have identified the fault lines where the concept fractures under pressure. The cases you catalogued are not exceptions that prove the rule; they are stress tests that reveal the rule is actually three different rules wearing the same uniform.

  Consider how your specific cases break apart when held against these three jobs. The rising-floor case looks like therapy on the allocative job because everyone benefits and health is improved, yet it looks like enhancement on the interpretive job because the meaning of achievement shifts when the baseline moves. The baseline-conflict pair shows the divergence between the allocative and permissive jobs. Restoring a patient to their own previous level might be permissible even if it leaves them below the population mean, but an insurance system designed for the allocative job might refuse to pay for a return to a sub-average state. The conversion case is perhaps the most damaging to the interpretive job. If a capacity is substituted rather than restored, the patient may feel alienated even if function is regained, suggesting that the interpretive job cares about continuity of self in a way the allocative job does not. The maintenance case stretches the allocative job to its breaking point because holding function constant over time consumes resources without producing a net gain in capacity relative to the species norm, yet it is clearly desired. But it is the third-party case that truly breaks the machinery, as you noted. When an intervention benefits others more than the patient, the allocative job might endorse it for public health reasons, while the permissive and interpretive jobs recoil at the instrumentalization of the patient. These cases do not just test the line; they show that the line moves depending on which job you are asking it to perform.

  This leads to your question about whether the dispute is merely verbal. I do not think it is merely verbal, though verbal confusion is the symptom. The dispute is structural because the three jobs often demand contradictory classifications for the same intervention. An intervention can be allocatively sound but interpretively corrosive, or permissibly chosen but allocatively unjustifiable. The impasse persists because members of your committee are not simply defining terms differently; they are prioritizing different jobs without admitting it. When one member argues from species-typical function, they are usually trying to secure the allocative job, establishing a limit on what society owes. When another argues from desire and reason, they are prioritizing the permissive job, protecting autonomy. When the third group argues about ideological laundering, they are focused on the interpretive job, worried about what these interventions say about the value of certain lives. Because these jobs are conflated under the single label of therapy versus enhancement, every argument slides past the others. You cannot resolve a conflict about resource allocation by appealing to autonomy, and you cannot resolve a conflict about identity by appealing to cost-effectiveness.

  Regarding the hidden empirical question, I am skeptical that data will save us here. Knowing whether enhancement is positional or how patients fare after capacity substitution clarifies the stakes, but it does not tell us which job should take precedence. Empirical results can inform the allocative job by telling us about costs and benefits, and they can inform the interpretive job by telling us about patient experience, but they cannot tell us whether the allocative job should trump the interpretive one. The residual disagreement is not about facts but about whether any single concept should be tasked with holding these incompatible commitments simultaneously. The concept of therapy versus enhancement has become a placeholder for unresolved tension between justice, liberty, and meaning. As long as we try to force these distinct normative questions into a binary classification, we will remain stuck.

  So what counts as progress? It is not a new distinction or a graded scale, because scaling a broken concept does not fix the underlying structural flaw. A graded scale still assumes there is one dimension along which interventions vary, but your analysis shows there are at least three dimensions. Progress looks like disaggregation. It means admitting that the question of who pays is different from the question of what is allowed, which is different from the question of what is meaningful. Your committee should stop trying to classify interventions as therapy or enhancement and start classifying the questions themselves. For each case, ask explicitly which job is being performed. Is this a budget decision? Then argue about resources and claims. Is this a consent decision? Then argue about autonomy and harm. Is this a question of identity? Then argue about narrative and selfhood. You may find that some interventions are therapy for one job and enhancement for another, and that is not a contradiction; it is a clarification.

  The proper conclusion is that the concept has to keep several incompatible commitments simultaneously and always will, because that is the work it was hired to do in a society that wants to have it all. We want to limit costs, maximize freedom, and preserve meaning, and often we cannot do all three. The impasse is a sign that the concept is doing its job too well, hiding the trade-offs rather than revealing them. If you separate the jobs, you will not necessarily find agreement, but you will find honest disagreement. You will stop talking past one another and start negotiating the trade-offs. That is the only progress available to us. We must stop looking for the line that solves the problem and start drawing the lines that separate the problems. I hope this helps you frame the discussion next month. It is time to stop trying to save the distinction and start using it to reveal the conflicts it was designed to conceal.
