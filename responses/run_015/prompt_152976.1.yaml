answer: |-
  # PROTOCOL FOR SYMMETRIC ALLOCATION (PSA-15)
  **Effective Date:** Immediate  
  **Time Limit:** 15 Minutes  
  **Authorized User:** On-Call Ethics Referee  
  **Philosophical Basis:** Rational Choice under Indifference (Buridan Framework)

  ## I. OBJECTIVE
  To resolve allocation ties where candidates score identically on all primary metrics without defaulting immediately to chance. This protocol distinguishes between **Epistemic Ties** (differences exist but are unmeasured) and **Value-Equivalent Ties** (no morally relevant difference exists).

  ## II. THE CHECKLIST (Max 15 Minutes)

  ### PHASE 1: VERIFICATION (Minutes 0–3)
  *Goal: Confirm the tie is not an administrative error.*
  1.  **[ ] Data Audit:** Verify raw data entry for both candidates. Are scores truly identical to the decimal?
  2.  **[ ] Metric Completeness:** Confirm all mandatory allocation metrics (MELD, KDPI, Wait Time, etc.) are populated.
  3.  **[ ] Decision:**
      *   If discrepancy found: **STOP.** Correct data.
      *   If tie confirmed: **PROCEED** to Phase 2.

  ### PHASE 2: EPISTEMIC SEARCH (Minutes 3–8)
  *Goal: Determine if the tie is Epistemic (hidden differences) or Value-Equivalent.*
  *Instruction: Review clinical files for factors **not** captured in the allocation score but relevant to transplant success.*
  1.  **[ ] Hidden Comorbidities:** Is there evidence of unlisted conditions affecting graft survival (e.g., undocumented substance use, non-adherence history)?
  2.  **[ ] Logistical Feasibility:** Is one candidate significantly easier to transplant safely (e.g., vascular anatomy, proximity to OR team availability)?
  3.  **[ ] Decision:**
      *   If difference found: **CLASSIFY AS EPISTEMIC.** Use difference to break tie. **STOP.**
      *   If no difference found: **CLASSIFY AS VALUE-EQUIVALENT.** **PROCEED** to Phase 3.

  ### PHASE 3: ETHICAL SYMMETRY BREAKING (Minutes 8–12)
  *Goal: Apply secondary ethical principles to break Value-Equivalent symmetry.*
  *Instruction: Apply the following hierarchy. The first applicable principle breaks the tie.*
  1.  **[ ] Principle of Utility (Life-Years):** Does one candidate have a longer statistical life expectancy (e.g., younger age) not captured in the survival score?
  2.  **[ ] Principle of Rescue (Urgency):** Is one candidate clinically deteriorating faster *right now* (hours/days), even if long-term scores match?
  3.  **[ ] Principle of Equity (Wait Time):** Has one candidate waited longer at this specific status level?
  4.  **[ ] Decision:**
      *   If principle applies: **DOCUMENT RATIONALE.** Select candidate. **STOP.**
      *   If no principle applies (True Symmetry): **PROCEED** to Phase 4.

  ### PHASE 4: VOLITIONAL CUT-OFF (Minutes 12–15)
  *Goal: Acknowledge the Buridan Point and execute arbitrary selection.*
  1.  **[ ] Declaration:** Document statement: *"No rational or ethical distinction exists. Choice is arbitrary."*
  2.  **[ ] Selection:** Execute randomization (e.g., coin flip, computerized random draw).
  3.  **[ ] Escalation Check:** If the Referee feels the "arbitrary" choice violates a core institutional value (e.g., prioritizing logistics over justice), **ESCALATE** to Full Board.

  ---

  ## III. ESCALATION CONDITIONS
  **Immediate Escalation to Full Board is required if:**
  1.  **Value Conflict:** Phase 3 reveals a conflict between principles (e.g., Utility favors Candidate A, Equity favors Candidate B).
  2.  **Public Scrutiny:** The tie involves high-profile candidates or potential media interest.
  3.  **Referee Uncertainty:** The Referee cannot classify the tie as Epistemic or Value-Equivalent within the time limit.

  ---

  ## IV. SCENARIO APPLICATIONS

  ### Scenario 1: Identical Survival, Different Ages
  *   **Facts:** Candidate A (25yo) and Candidate B (65yo). Identical survival scores, wait times, and blood type.
  *   **Protocol Execution:**
      *   Phase 1: Tie confirmed.
      *   Phase 2: No hidden comorbidities found. **Classification: Value-Equivalent.**
      *   Phase 3: Principle of Utility (Life-Years) applied. Candidate A has higher projected life-years gained.
  *   **Recommendation:** Allocate to Candidate A.
  *   **Rationale:** Breaks symmetry via maximization of benefit (Life-Years), a permissible secondary distinction.

  ### Scenario 2: Total Tie (Including Age)
  *   **Facts:** Candidate A and Candidate B are identical twins, same age, same metrics, same wait time.
  *   **Protocol Execution:**
      *   Phase 1: Tie confirmed.
      *   Phase 2: No hidden differences. **Classification: Value-Equivalent.**
      *   Phase 3: No secondary principles apply (Age, Urgency, Wait Time identical).
      *   Phase 4: Volitional Cut-Off reached.
  *   **Recommendation:** Randomization (Coin Flip).
  *   **Rationale:** At the "Buridan Point," rational choice ends. Randomization preserves fairness by ensuring no bias influences the arbitrary choice.

  ### Scenario 3: Geographic Proximity (The Reject Case)
  *   **Facts:** Candidate A is 10 miles from the donor hospital. Candidate B is 300 miles away. All clinical metrics (including travel tolerance) are identical.
  *   **Protocol Execution:**
      *   Phase 1: Tie confirmed.
      *   Phase 2: Epistemic Search identifies "Ischemia Time Risk." Candidate A presents lower logistical risk of organ damage during transport. **Classification: Epistemic.**
      *   Phase 3: Not required (Resolved in Phase 2).
  *   **Recommendation:** Allocate to Candidate A (Local).
  *   **Rationale:** Minimizing ischemia time is a clinical fact that breaks the tie epistemically.
  *   **Board Rejection Analysis:** **The Board will almost certainly reject this recommendation.**
      *   *Why:* While clinically rational, prioritizing geography violates the ethical principle of **Justice/Equity**. It privileges local patients over distant ones despite identical medical need. The Board prioritizes "Equal Access" over "Logistical Utility" in tie situations. This scenario demonstrates where the protocol's *clinical rationality* conflicts with the institution's *ethical mission*.

  ---

  ## V. LIMITATIONS AND MISFIRE CONDITIONS

  **This procedure is designed to misfire or remain silent in the following conditions:**

  1.  **Systemic Injustice:** If the primary allocation metrics themselves are biased (e.g., race-based corrections), this protocol cannot correct the upstream injustice. It treats the tie as given, potentially cementing bias.
  2.  **The "Social Worth" Trap:** Phase 2 (Epistemic Search) risks introducing illicit criteria (e.g., "better family support," "employment status"). The Referee must strictly limit "hidden factors" to *clinical* feasibility, not social value.
  3.  **Time Pressure:** The 15-minute limit forces heuristics. In complex cases, the "Epistemic Search" may be superficial, misclassifying a Value-Equivalent tie as Epistemic to avoid randomization.
  4.  **Moral Distress:** The protocol cannot resolve the Referee's personal moral distress. If the Referee feels the "rational" choice is wrong (as in Scenario 3), the protocol mandates Escalation, acknowledging that administrative efficiency cannot override conscience.

  **Final Note:** This protocol does not determine *what is right*; it determines *how to decide* when reason runs out. When the checklist ends, the remaining choice is not medical—it is administrative. Document accordingly.
