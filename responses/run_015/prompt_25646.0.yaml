answer: |-
  This is a superb case study for a grad seminar. The SVB collapse is arguably the cleanest real-world instantiation of a Global Game we have seen in the digital age. It allows you to move students beyond the static Diamond-Dybvig framework into the dynamic epistemic conditions required for equilibrium selection.

  Here is an analysis of the SVB run through the lens of epistemic game theory, specifically focusing on the hierarchy of knowledge, the breakdown of common knowledge regarding the *state of the world* (which drives the shift in rational action), and the structural implications of networked depositors.

  ---

  ### 1. The Epistemic Hierarchy: Mapping the Timeline

  In epistemic game theory, we denote $K_i(E)$ as "Agent $i$ knows event $E$." Common Knowledge ($CK(E)$) is the infinite conjunction $E \cap K_i(E) \cap K_i K_j(E) \cap \dots$

  For the "Stay" equilibrium to hold in a bank run game, we generally require $CK(\text{Solvency})$. If $CK(\text{Solvency})$ breaks, rational agents may switch to the "Run" equilibrium even if the bank is fundamentally solvent. The SVB episode was not a breakdown of **Common Knowledge of Rationality (CKR)**—agents remained hyper-rational throughout—but rather a rapid, cascading collapse of **Common Knowledge of Safety**, which altered the best response function for every rational player.

  Here is how the timeline maps to the iterated knowledge structure:

  #### **Phase 1: The Private Signal (March 8, 2023)**
  *   **Event:** SVB announces a $2.25 billion capital raise and a loss on bond sales.
  *   **Epistemic State:** $K_i(\text{Trouble})$.
  *   **Analysis:** This moves the state from "Unknown" to "Known by Individual." At this stage, many depositors might think, "I know SVB has a liquidity hole, but I don't know if *you* know." If I believe you don't know, I might stay, hoping to earn interest before the crash. This is the realm of private signals in a Global Game. The noise is high enough that multiple equilibria are still theoretically possible.

  #### **Phase 2: The Public Signal & First-Order Knowledge (Morning, March 9)**
  *   **Event:** The news circulates on FinTwit (Financial Twitter) and in industry newsletters.
  *   **Epistemic State:** $K_i K_j(\text{Trouble})$.
  *   **Analysis:** I know that you know. The signal is now public. However, in standard coordination games, public signals alone do not guarantee a run if agents believe others will remain "sticky" due to transaction costs or inertia.

  #### **Phase 3: The Coordination Signal (Afternoon, March 9)**
  *   **Event:** Prominent VC partners (e.g., Founders Fund, Coatue) advise portfolio companies to withdraw funds. Bill Ackman tweets: "If you are a VC with co-investments... advise your companies to pull money out of SVB immediately."
  *   **Epistemic State:** $K_i K_j K_k(\text{Run Intent})$.
  *   **Analysis:** This is the critical epistemic break. The VC advice transforms the signal from "The bank is weak" to "Rational agents are withdrawing."
      *   Before this, I might think: "The bank is weak, but others might not realize it."
      *   After this, I think: "I know the bank is weak, I know *you* know the bank is weak, and I know *you* are rational, therefore I know *you* will withdraw."
      *   The VC tweet acts as a **correlation device**. It creates approximate Common Knowledge of the *action* (Withdraw), not just the *state* (Insolvency).

  ### 2. The Rationality Question: Fundamental vs. Strategic Runs

  You asked: *At what point did depositors stop believing that other depositors were rational?*

  In the SVB case, the answer is **never**. The run was not caused by a belief that others were irrational (panicking); it was caused by the belief that others were **rationally responding to a shared signal.**

  The thought process you described—"I'm pulling my money because others are panicking, not because the bank is insolvent"—is the definition of a **strategic run** (self-fulfilling). In epistemic terms, this occurs when the higher-order belief about *actions* dominates the first-order belief about *fundamentals*.

  *   **Fundamental Run:** $K_i(\text{Insolvent}) \rightarrow \text{Withdraw}$.
  *   **Strategic Run:** $K_i K_j(\text{Withdrawing}) \rightarrow \text{Withdraw}$, even if $\neg K_i(\text{Insolvent})$.

  On March 9th, the epistemic weight shifted from the fundamentals to the actions of others. When a depositor saw the VC advice, they updated their belief about the *probability of a run* to near 1. Given the payoff structure of a bank run (where being last in line yields 0), the unique rational best response to $P(\text{Run}) \approx 1$ is to Withdraw.

  Therefore, CKR held perfectly. Everyone knew everyone else was rational. It was precisely *because* everyone knew everyone else was rational that the run became inevitable once the signal crossed the threshold. If depositors had believed others were irrational (i.e., would stay despite the risk), they might have stayed themselves.

  ### 3. Formalizing the Model: A Global Game Approach

  To teach this, the **Carlsson and van Damme (1993) Global Game** is more appropriate than the Electronic Mail Game. The Electronic Mail Game focuses on the impossibility of achieving CK due to communication failure. SVB was the opposite: communication was *too* efficient.

  **The Setup:**
  *   **Players:** $N$ institutional depositors (VCs, Tech Firms).
  *   **State of World ($\theta$):** The bank's liquidity buffer. $\theta \in \mathbb{R}$.
  *   **Threshold:** Bank fails if fraction of withdrawals $L > \theta$.
  *   **Signals:** Each depositor $i$ observes $x_i = \theta + \epsilon_i$, where $\epsilon_i$ is noise.
  *   **Actions:** $a_i \in \{\text{Stay}, \text{Run}\}$.
  *   **Payoffs:**
      *   If Bank Survives: $u(\text{Stay}) > u(\text{Run})$ (interest vs. transaction cost).
      *   If Bank Fails: $u(\text{Run}) > u(\text{Stay})$ (full withdrawal vs. FDIC haircut/delay).

  **The Epistemic Shift:**
  In a standard Global Game, as noise $\epsilon \to 0$, the equilibrium becomes unique.
  *   **March 8:** Noise $\epsilon$ is high. Some see the capital raise as prudent management; others see distress. Equilibrium selection is ambiguous.
  *   **March 9 (The Tweets):** The VC advice acts as a **public signal** $y$ that is added to private signals: $x_i' = \theta + \epsilon_i + y$.
  *   Because the VC advice was public and explicit ("Pull money out"), it effectively set $\epsilon \to 0$ for the *expectation of others' actions*.
  *   The "Run" threshold $\theta^*$ shifted dramatically. Normally, you need strong evidence of insolvency to run. With the public coordination signal, the threshold lowered: you only need to believe *others* will run to justify running yourself.

  ### 4. Network Structure: Dense vs. Anonymous

  This is where the SVB case offers a profound critique and refinement of standard theory.

  **Standard Assumption:** Most bank run models assume anonymous depositors or random matching. This makes generating Common Knowledge difficult (requiring infinite iterations or public announcements).

  **SVB Reality:** A "Small World" network. VCs, founders, and CFOs sit on the same boards, attend the same conferences, and are in the same Slack/WhatsApp groups.

  **Does this sustain or shatter CK?**
  It makes Common Knowledge **easier to generate**, which paradoxically makes the system **more fragile**.

  1.  **Acceleration of CK:** In the Electronic Mail Game, CK requires infinite messages. In a VC group chat, one message ("Pull funds") creates $k$-order knowledge for very high $k$ almost instantly. I know you saw the message; I know you know I saw the message.
  2.  **Homogeneity of Priors:** The network density means priors are correlated. Everyone shares the same mental model of "VC Best Practices." When one signal hits, everyone updates in the same direction.
  3.  **The Fragility of "Good" CK:** We often think CK is good for coordination (e.g., CK of traffic laws). But in a coordination game with multiple equilibria (Stay vs. Run), CK of a *negative* signal collapses the "Stay" equilibrium instantly.

  **Theoretical Implication:** Dense networks reduce the "noise" required to switch equilibria. In Global Game terms, the network structure reduces the variance of the higher-order beliefs. This vindicates the theory's prediction that unique equilibria emerge with low noise, but it highlights that social networks can artificially drive noise to zero faster than fundamental information can be processed.

  ### 5. Where the Model Strains

  While the Global Game framework fits well, the SVB episode exposes three tensions in the standard epistemic framework that you should highlight in your seminar:

  **A. The Speed of Iteration (Time as a Variable)**
  Standard epistemic logic is timeless. $K_i K_j E$ is a state, not a process. SVB showed that the *time* required to iterate knowledge matters.
  *   *Theory:* If CK exists, equilibrium is selected.
  *   *Reality:* Social media compressed the time to achieve high-order knowledge from days to minutes. The "Run" equilibrium was selected before regulators could intervene to change the payoffs (e.g., by guaranteeing deposits). The model needs a dynamic component where the cost of waiting ($c(t)$) increases as the speed of information ($v$) increases.

  **B. Common P-Belief vs. Common Knowledge**
  Morris and Shin (1999) discuss "Common P-Belief" (everyone believes with probability $p$). SVB suggests that in the age of Twitter, we operate on **Common Approximate Knowledge**.
  *   Did every depositor *know* Ackman tweeted? No.
  *   Did every depositor know that *enough* depositors knew to trigger a run? Yes.
  *   Standard CK is binary (1 or 0). SVB suggests a threshold model of CK where $P(CK) > \text{Threshold}$ triggers the run. The dense network lowered that threshold.

  **C. Endogenous Payoffs**
  In standard models, payoffs are fixed. In SVB, the payoffs were endogenous to the *speed* of the run.
  *   If the run took a week, FDIC might have arranged a bailout (Payoff for Stay increases).
  *   Because the run took 24 hours (due to digital banking + Twitter), the FDIC was caught flat-footed, and the Payoff for Stay dropped to near zero (receivership risk).
  *   The epistemic structure didn't just select an equilibrium; it altered the payoff matrix itself by outpacing the regulator's reaction function.

  ### 6. Pedagogical Takeaway

  For your seminar, I recommend framing SVB not as a failure of Common Knowledge of Rationality, but as a **hyper-success of Common Knowledge of Intent.**

  *   **Vindication:** The episode validates Global Games. As signals became public and precise (low noise), the equilibrium became unique (Run). Rationality was common knowledge, which is *why* the run happened.
  *   **Critique:** The episode challenges the *Electronic Mail Game* intuition that communication frictions protect against coordination failure. In the digital age, communication frictions have vanished. When frictions vanish in a fragile coordination game, the "bad" equilibrium becomes dominant.

  **Discussion Question for Students:**
  *"If CKR leads to a run when signals are precise, does epistemic game theory suggest that opacity (higher noise in signals) is socially optimal for financial stability? If so, how do we regulate 'noise' without violating transparency laws?"*

  This pushes them to consider the normative implications of epistemic structures: sometimes, knowing too much about what others know is dangerous.
