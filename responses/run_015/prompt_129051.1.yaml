prompt: |-
  I'm part of a graduate reading group on the foundations of quantum mechanics, and last week we were working through the measurement problem in the context of Everett's relative-state formulation versus the Copenhagen insistence on classical apparatuses. The discussion turned to whether branching worlds actually resolve the problem or merely redistribute the ambiguity across a multiverse structure, and whether Bohmian mechanics avoids both pitfalls only by paying a different ontological price in explicit particle trajectories. At that point, one participant cut in with the familiar slogan "shut up and calculate," using it to suggest that worrying about ontology—whether worlds split, particles have positions, or wave functions collapse—is a category mistake that confuses predictive success with metaphysical commitment. I want to bring a precise disambiguation back to the group rather than another round of intuition-trading.

  Could you lay out the distinct precise claims that "shut up and calculate" might be expressing, arranged as a menu from the trivial to the radical? For each reading, indicate whether it is a platitude about scientific practice, a substantive methodological principle, or an outright false claim about the limits of interpretation. In particular, distinguish versions that are purely epistemic (about what physicists should personally believe), versions that are semantic (about what quantum formalism means), versions that are pragmatic (about resource allocation in research programs), and versions that carry hidden metaphysical commitments of their own—such as the idea that calculational rules are interpretation-neutral in a way that Bohmian trajectories or Everettian branches are not. Then tell me which of these readings actually supports dismissing an ontological debate about branching versus collapse, and which ones would, if applied consistently, undermine the very predictive framework being defended.

  Finally, since our group is specifically comparing how decoherence-based accounts, Bohmian mechanics, and Everettian mechanics each relate calculational output to ontological story, I want to know whether the slogan applies asymmetrically across these three. Does "shut up and calculate" function as a stable neutral stance, or does it tacitly favor one interpretation—say, by treating the wave function as purely instrumental in a way that sits comfortably with Copenhagen but becomes strained under Bohm's explicit particle ontology or Everett's explicit world ontology? I am not asking for a bibliography or reading list; I want the conceptual map I can use to press back in the seminar and ask which version of the slogan my interlocutor actually meant.
