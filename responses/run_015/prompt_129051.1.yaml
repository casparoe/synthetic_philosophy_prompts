answer: |-
  This is a sophisticated pivot. The slogan "shut up and calculate" (SUAC) is often deployed as a conversation-terminator, but in a foundations seminar, it functions as a philosophical claim that requires unpacking. It is rarely a single proposition; it is a conflation of pragmatic advice, semantic verificationism, and often unacknowledged metaphysical commitments.

  Below is a conceptual map disambiguating the slogan into four distinct claims, arranged from the trivial to the radical. Following the menu, I analyze which versions sustain the dismissal of ontology and which undermine the predictive framework, and finally, I address the asymmetry across Copenhagen, Bohm, and Everett.

  ### I. The Menu of "Shut Up and Calculate"

  Here are four distinct readings of the slogan, categorized by their philosophical type and status.

  #### 1. The Heuristic Priority Claim (Pragmatic/Epistemic)
  *   **The Claim:** "Resolve the mathematical predictions and experimental verifications before engaging in metaphysical speculation, because history shows metaphysics often lags behind formalism."
  *   **Status:** **Platitude about scientific practice.** It is a rule of thumb regarding resource allocation and timing.
  *   **Implication:** Ontology matters, but not *now*. It suggests a temporary suspension of the debate, not a dissolution.
  *   **Neutrality:** High. It applies equally to Bohm, Everett, and Copenhagen proponents.

  #### 2. The Empirical Equivalence Claim (Methodological)
  *   **The Claim:** "Since all viable interpretations (Copenhagen, Bohm, Everett) yield identical empirical predictions in standard regimes, choosing between them is scientifically underdetermined and therefore idle."
  *   **Status:** **Substantive methodological principle.** It relies on the premise of empirical equivalence.
  *   **Implication:** Ontological debates are not meaningless, but they are currently non-scientific because they lack discriminatory power.
  *   **Neutrality:** Moderate. It assumes the interpretations are indeed empirically equivalent (which is contested in non-equilibrium Bohmian mechanics or specific collapse models).

  #### 3. The Instrumentalist Semantic Claim (Semantic/Verificationist)
  *   **The Claim:** "The meaning of the quantum formalism is exhausted by its algorithmic success in predicting measurement outcomes. Questions about 'what exists' between measurements are semantically ill-formed because they transcend verification conditions."
  *   **Status:** **Hidden metaphysical commitment (Logical Positivism).** It claims to be anti-metaphysical but commits to a verificationist theory of meaning.
  *   **Implication:** Ontological debates are category mistakes. There is no fact of the matter regarding branching or trajectories.
  *   **Neutrality:** Low. It privileges a specific view of language and theory structure that is hostile to realism.

  #### 4. The Anti-Realist Ontological Claim (Metaphysical)
  *   **The Claim:** "There is no underlying reality corresponding to the wave function. The calculation rules are not descriptions of a world but prescriptions for managing expectations."
  *   **Status:** **Outright metaphysical commitment (Anti-Realism).** It is not an absence of ontology; it is a specific negative ontology.
  *   **Implication:** Debates about branching or trajectories are false because they presuppose a reality that the theory does not describe.
  *   **Neutrality:** None. This is a specific rival to the ontologies of Bohm and Everett.

  ---

  ### II. Dismissal Power vs. Self-Undermining

  You asked which readings support dismissing the debate and which undermine the framework. This is the critical leverage point for your seminar.

  **1. Which readings support dismissing the ontological debate?**
  *   **Readings 3 and 4** are the only ones that actually justify *dismissing* the debate rather than delaying it.
  *   **Reading 2** (Empirical Equivalence) only suspends the debate. If a future experiment could distinguish Bohmian trajectories from Everettian branches (e.g., via protective measurements or non-equilibrium signals), the debate reopens.
  *   **Reading 1** (Heuristic) explicitly invites the debate later.

  **2. Which readings undermine the predictive framework?**
  *   **Reading 3 (Instrumentalist Semantic)** and **Reading 4 (Anti-Realist)** carry the highest risk of self-undermining.
  *   **The "Miracle" Problem:** If the calculation rules are *not* descriptions of reality (Reading 4), then the success of the calculations becomes a miracle. Why does manipulating symbols that "don't represent anything" reliably predict detector clicks? Realist accounts (Bohm/Everett) explain predictive success via correspondence to reality; SUAC (in its radical forms) must treat predictive success as a brute fact.
  *   **The "Measurement" Problem:** SUAC often claims the formalism is "interpretation-neutral." This is false. The formalism (Schrödinger equation + Hilbert space) does not predict *observations* without a bridge rule (e.g., Collapse, Born Rule, Decoherence + Branching).
      *   If you "shut up and calculate," you must still decide *what* in the calculation corresponds to *what* in the lab.
      *   If you claim the formalism is neutral, you are ignoring that **applying** the formalism requires an interpretive stance (e.g., is the apparatus quantum or classical?).
      *   Therefore, a radical SUAC stance undermines the very application of the algorithm it defends, because the algorithm requires an ontological cut to function.

  ---

  ### III. Asymmetry Across Interpretations

  Does SUAC function as a stable neutral stance? **No.** It functions asymmetrically, tacitly favoring a Copenhagen-style instrumentalism while straining against Bohm and Everett.

  | Interpretation | Relationship to SUAC | The Tension |
  | :--- | :--- | :--- |
  | **Copenhagen** | **High Compatibility.** | Copenhagen treats the wave function as epistemic or instrumental. SUAC fits naturally here because the "calculation" is the primary object, and the "reality" is restricted to classical clicks. |
  | **Bohmian Mechanics** | **Low Compatibility.** | Bohmian mechanics adds *explicit* ontology (particles + pilot wave). SUAC implies these additions are superfluous. To say "shut up and calculate" to a Bohmian is to say "your particle positions are metaphysical excess." This is not neutrality; it is a rejection of Bohm's core innovation. |
  | **Everett (Many-Worlds)** | **Ambiguous/Paradoxical.** | Everettians often claim *they* are the true SUAC adherents because they remove the collapse postulate (keeping only the linear evolution). However, standard SUAC usually implies *anti-realism* about the wave function. Everett is *hyper-realism* (the wave function is all there is). If SUAC means "don't ask what the math represents," it contradicts Everett. If SUAC means "don't add extra math (collapse)," it supports Everett. |

  **The Crucial Insight for Your Group:**
  The slogan "shut up and calculate" is usually code for **"Treat the wave function as Copenhagen does."**
  *   It treats the wave function as a tool (Copenhagen).
  *   It treats the wave function as incomplete (against Bohm).
  *   It treats the wave function as not literally describing multiple worlds (against Everett).

  Therefore, invoking SUAC is not a neutral refusal of ontology; it is a **covert endorsement of an instrumentalist ontology** that renders the specific ontologies of Bohm and Everett "illegal" by definition.

  ---

  ### IV. Strategic Questions for the Seminar

  To press back effectively, do not argue against "calculating." Argue for precision regarding *what the calculation is*. Use these questions to force your interlocutor to select from the Menu above:

  1.  **The Timing Question (Testing Reading 1 vs. 3):**
      "When you say 'shut up and calculate,' are you suggesting we postpone ontological clarity until new data arrives, or are you claiming that ontological clarity is impossible in principle? If the former, this seminar *is* the work of preparing for that data. If the latter, on what verificationist grounds do you stand?"

  2.  **The Application Question (Testing the 'Neutrality' Claim):**
      "You suggest the formalism is neutral. But to calculate a probability, I must identify which part of the Hilbert space corresponds to a 'measurement outcome.' Doesn't making that identification *require* an interpretive stance (e.g., is the apparatus classical, or does it branch)? If so, isn't 'calculating' already dependent on the ontology you wish to dismiss?"

  3.  **The Asymmetry Question (Testing Hidden Commitments):**
      "Does your injunction apply equally to the Bohmian who calculates trajectories and the Everettian who calculates branch weights? If you deem their ontological commitments 'excess' but the Copenhagen 'cut' as 'standard procedure,' aren't you implicitly privileging an instrumentalist ontology over a realist one, rather than avoiding ontology altogether?"

  4.  **The Self-Undermining Question (Testing Reading 4):**
      "If the calculation rules do not describe reality, but merely predict observations, what explains the reliability of those rules? If we are not allowed to posit a reality that makes the calculations true, are we not left with a 'miracle' where symbols manipulate themselves into matching detector clicks?"

  ### Summary for your Intervention
  Your interlocutor is likely operating on **Reading 3 (Instrumentalist Semantic)** while presenting it as **Reading 1 (Heuristic)**.
  *   **Your move:** Expose that "calculation" is not interpretation-free. To calculate is to map math to world. That mapping *is* the ontology.
  *   **Your conclusion:** "Shut up and calculate" is not an escape from the measurement problem; it is a specific, often unargued, solution to it (Instrumentalism) that refuses to acknowledge its own metaphysical price.
