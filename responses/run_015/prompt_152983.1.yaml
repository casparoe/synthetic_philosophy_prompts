answer: |-
  The board member's objection is mistaken because it assumes assertion is regulated solely to prevent harmful reliance on falsehoods, whereas expert testimony and research integrity properly regulate the *warrant* for assertion to preserve institutional trust, making the knowledge norm coherent for your code despite the legal system's pragmatic reliance on a truth-plus-culpability hybrid.

  Your understanding of features (a), (b), and (c) is factually correct for US law and standard research integrity frameworks, but the conflict arises because these institutions serve different master norms. The law is primarily remedial and consequentialist: it intervenes when rights are violated or harm occurs. Since true statements rarely cause actionable harm (defamation requires injury to reputation, which truth generally negates; fraud requires loss, which true information rarely causes), the law adopts a Truth Norm constrained by Culpability. It punishes the *dangerous* falsehoods, not the *epistemically vicious* truths. Research integrity and expert testimony, however, are constitutive of epistemic institutions; their primary good is not the avoidance of immediate harm but the maintenance of reliability and trust in the knowledge-producing process. Therefore, they presuppose a Knowledge Norm (or Justification Norm), where the wrong is the severing of the link between belief and evidence, regardless of the accidental truth of the outcome.

  Regarding objection (i), the board member's argument is good only if you view the expert witness as a mere conduit for information whose only value is instrumental action-guidance. If the witness's role is to assist the court in *reasoning*, then the method of arriving at the conclusion is part of the service provided. A lucky guess provides no reasoning assistance and undermines the court's ability to weigh evidence, even if the conclusion is correct. The objection presupposes a purely consequentialist view of assertion (truth is valuable because it works), whereas the code presupposes a deontological view of professional assertion (assertion is valuable because it represents warranted commitment).

  On (ii) and (iii), the legal pattern is a hybrid, not a single coherent norm. A Truth Norm plus a separate culpability doctrine can reproduce features (a) and (b) easily: you need falsity for harm, and culpability for punishment. However, this hybrid cannot reproduce feature (c) without contradiction. If the norm were Truth plus Culpability, a researcher who fabricates data but lands on a true conclusion has satisfied the Truth Norm and exhibited Culpability; yet research integrity sanctions this precisely because the Truth Norm is *not* the governing standard—the Knowledge Norm is. The practices are underdetermined only if you ignore the institutional telos: law aims at justice between parties (harm-based), while research and expertise aim at fidelity to reality (process-based). A Truth Norm cannot explain why lucky fabrication is misconduct; only a Knowledge Norm explains why the process matters more than the outcome.

  Regarding (iv), replacing the implicit norm with a Knowledge Norm would concretely change outcomes in ways that validate your code rather than refute it. Under a strict Knowledge Norm, a witness who asserts a lucky guess becomes sanctionable because they lacked warrant, and defamation might lose the absolute truth defense if the statement was made with reckless disregard for the truth (some jurisdictions already limit the defense for private figures). This is not a *reductio* of the Knowledge Norm but a recognition that the law's current protection of the reckless truth-teller is a pragmatic concession to free speech and the difficulty of proving mental states, not an endorsement of the epistemic propriety of their act. For your professional body, adopting the Knowledge Norm means sanctioning the lucky guesser not because they caused harm, but because they violated the duty of the office to speak only from expertise. The board member's fear that "no one was harmed" misses the point: the harm is to the credibility of the profession and the integrity of the fact-finding process, which relies on witnesses providing warranted assertions, not accidental truths.
