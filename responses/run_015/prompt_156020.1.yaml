answer: |-
  The objection that sinks you is the Limiting Retributivist's Upper Bound Challenge: if desert doesn't cap magnitude, you haven't solved the human rights problem skepticism raises, you've just renamed consequentialism with a compatibilist trigger.

  ### Strategic Concessions (First 5 Minutes)
  1.  **Concede Desert is Not Cardinal:** Do not fight for a "unit of suffering." Admit explicitly that desert provides a *threshold* of eligibility, not a *measure* of severity. Trying to defend ordinal proportionality as desert-based will bleed you dry against the skeptics.
  2.  **Concede the "Addressive" Constraint is Under-Theorized:** Acknowledge that distinguishing a "censure-communicating tax" from a "fine" is your weakest conceptual link. Don't claim you have the final answer; frame it as the legislative task your theory mandates.
  3.  **Concede Incapacitation Cases:** If someone fails your "Gate" (e.g., severe psychosis) but is dangerous, admit they fall under public health quarantine, not punishment. Do not try to stretch "desert" to cover them.

  ### The One Reply That Must Land
  You must successfully defend the **Eligibility vs. Allocation Distinction**.
  *   **The Line:** "Desert answers *who* may be punished (the Gate); Policy answers *how much* (the Magnitude). Without the Gate, policy permits punishing the innocent or the non-responsible. Without Policy, the Gate leaves us with arbitrary suffering. My view keeps the moral constraint on *who* while accepting the pragmatic necessity of *how much*."
  *   **Why:** If this distinction collapses, you are either a retributivist who can't explain sentencing or a consequentialist who doesn't need the word "desert."

  ### The Question You're Praying Nobody Asks
  "If consequentialist factors suggest zero hard treatment (e.g., no deterrence needed, low risk of reoffending), does the agent still *deserve* punishment? If yes, you're mandating wasteful suffering. If no, then desert isn't doing the work; consequentialism is."

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The Limiting Retributivist (Sentencing Scholar)
  **Idiom:** "Guidelines," "Upper Bounds," "Proportionality," "Judicial Discretion."
  **Objection:** "In limiting retributivism, desert sets the *upper bound* of permissible punishment to prevent utilitarian excess. You've removed the upper bound. If an 'addressive' sentence of 50 years for theft communicates censure effectively and deters crime, your theory permits it. You haven't protected rights; you've just removed the retributive brake on consequentialism."
  **Reply (2 mins):** "I agree desert must constrain *kind*, but I argue it cannot constrain *magnitude* without metaphysical magic. My constraint is that the punishment must remain *communicatively intelligible* as censure. A 50-year sentence for theft ceases to be intelligible censure and becomes mere incapacitation, violating the 'addressive' constraint. The limit isn't desert-magnitude; it's the breakdown of the communicative practice itself."
  **Soft Spot:** You're relying on "intelligibility" to do the work of "justice." A clever legislature could argue 50 years *is* intelligible censure for economic crimes. You lack a hard stop.

  #### 2. The Caruso Ally (Polite Skeptic)
  **Idiom:** "Basic Desert," "Manipulation Argument," "Moral Luck," "Empty Label."
  **Objection:** "You've kept the word 'desert' to appease intuitions, but emptied it of content. If magnitude is purely consequentialist, 'desert' is just a compatibilist trigger for utilitarian calculation. Why not drop the label? You haven't solved the basic desert problem; you've just hidden it behind the Gate."
  **Reply (2 mins):** "Because the Gate does moral work that consequentialism cannot. Consequentialism permits punishing the innocent if the utility is high. My Gate forbids it, even if utility demands it. 'Desert' here isn't a quantity; it's a *status* of liability. Keeping the label signals that the agent is being addressed as a moral peer, not managed as a vector of risk. That status change is non-negotiable."
  **Soft Spot:** They will press that "status" is just a fancy word for "rule utilitarianism." If you can't ground the Gate in something deeper than reasons-responsiveness, they'll claim you're just a sophisticated consequentialist.

  #### 3. The Duff-Style Communicative Theorist
  **Idiom:** "Communicative Integrity," "Secular Penance," "Intrinsic," "Lie."
  **Objection:** "Punishment is a communicative act. The severity of the hard treatment must mirror the severity of the censure. If you set magnitude by deterrence, you are lying to the offender. You're saying 'this is what your wrong deserves' when you mean 'this is what keeps others safe.' That instrumentalizes the offender and violates the addressive constraint you claim to protect."
  **Reply (2 mins):** "I deny the mirror requirement. Communication requires *intelligibility*, not isomorphism. A parent grounding a child communicates censure, but the duration is set by pedagogical need, not a 'unit of naughtiness.' As long as the offender understands the sentence as censure (enabled by the Gate), the magnitude can serve social aims without becoming a lie."
  **Soft Spot:** Duff will argue that without proportional hard treatment, the communication is *coercive* rather than *rational*. You risk turning punishment into manipulation.

  #### 4. The Dennett-Adjacents Compatibilist
  **Idiom:** "Practice," "Status," "Functional," "Stability."
  **Objection:** "Desert is a status the practice assigns. By splitting magnitude from desert, you destabilize the practice. Agents accept punishment because they feel it 'fits.' If they learn the fit is accidental and the amount is just social engineering, they will view the system as manipulative, undermining the very reasons-responsiveness your Gate requires."
  **Reply (2 mins):** "The practice is already unstable because we pretend to know desert magnitudes we cannot calculate. My view makes the honesty of the practice explicit. Agents can accept consequentialist magnitude if they know the *liability* was earned. Transparency about magnitude being legislative preserves trust better than pretending judges can measure moral gravity."
  **Soft Spot:** Empirical claim. There's zero evidence offenders accept utilitarian sentencing better than retributive. You're betting on rational acceptance where psychology suggests otherwise.

  #### 5. The Pereboom-Style Skeptic (Hardliner)
  **Idiom:** "Basic Desert," "Causal Determinism," "Luck," "Illusion."
  **Objection:** "Your Gate relies on reasons-responsiveness. But that machinery is itself causally determined. If you admit magnitude is consequentialist, why keep the Gate? You're still holding people responsible for states they didn't ultimately cause. You've softened the blow, but you haven't solved the luck problem."
  **Reply (2 mins):** "I'm not solving the metaphysical luck problem; I'm solving the *political* legitimacy problem. Even if determinism is true, a system that bypasses reasons-responsiveness treats citizens as objects. The Gate ensures we treat them as agents. That's sufficient for political legitimacy, even if it doesn't satisfy metaphysical ultimacy."
  **Soft Spot:** You're shifting from moral responsibility to political legitimacy. If the workshop is about *moral* desert, you've changed the subject. They will call this a bait-and-switch.

  #### 6. The Scanlonian Blame Theorist
  **Idiom:** "Relational," "Impairment," "Attitudes," "Fit."
  **Objection:** "Blame is about the impairment of the relationship. A murder impairs the relationship more than theft. If your punishment magnitude doesn't reflect that differential impairment, it's not actually responding to the blame. You've separated the response from the relational reality."
  **Reply (2 mins):** "The *kind* of response reflects the relational impairment (censure vs. quarantine). The *magnitude* reflects the social cost of repairing that relationship. Sometimes repairing the relationship requires heavy investment (long sentence for rehab); sometimes little. The magnitude tracks the repair cost, not just the impairment depth."
  **Soft Spot:** Scanlonians view blame as inherently proportional. You're arguing blame is binary (impaired/not impaired), which contradicts the gradability of relational standing.

  #### 7. The Second Sentencing Scholar (Pragmatist)
  **Idiom:** "Disparity," "Guidelines," "Predictability," "Judicial Training."
  **Objection:** "Judges need guidelines. 'Addressive kind' is too vague. If magnitude is legislative/consequentialist, you'll get wild disparity based on local crime rates. A thief in a high-crime zone gets 10 years; a thief in a low-crime zone gets 6 months. That violates equal treatment under the law."
  **Reply (2 mins):** "Current retributive guidelines already produce disparity because 'moral gravity' is subjective. My view allows for explicit, data-driven calibration. We can standardize consequentialist factors (risk scores, deterrence data) more reliably than we can standardize moral outrage. It shifts disparity from judicial whim to legislative policy."
  **Soft Spot:** You're advocating for risk-assessment tools, which are currently controversial for bias. You might be trading moral vagueness for algorithmic bias.

  #### 8. The Moral Responsibility Generalist
  **Idiom:** "Epistemic Condition," "Normative Competence," "Gate Porosity."
  **Objection:** "Your Gate requires reasons to be 'epistemically available.' But socioeconomic deprivation affects epistemic access. Are you saying the poor have less reasons-responsiveness? If you adjust the Gate for poverty, you shrink the pool of punishable agents. If you don't, you're punishing poverty."
  **Reply (2 mins):** "The Gate is a threshold, not a gradient. Deprivation might lower the threshold for what counts as 'available,' but it doesn't remove agency entirely unless it amounts to coercion or duress. We can adjust the epistemic standard for severe deprivation without collapsing the Gate. The magnitude can then be adjusted downward for those contexts via the legislative prong."
  **Soft Spot:** This creates a two-tier system where the poor are either exempted (undermining deterrence) or punished differently (undermining equality). You're kicking the can to the legislative prong again.

  ### Final Advice
  **Be Opinionated:** When the Caruso ally attacks the "Empty Label," don't apologize. Double down. "Yes, it's a label, but it's the label that protects the innocent." When the Sentencing Scholar attacks the Upper Bound, don't waver. "Retributive upper bounds are metaphysical fiction; communicative intelligibility is a practical constraint."

  **Survival Strategy:** Your view survives only if you convince the room that **retributive magnitude is impossible** but **retributive eligibility is necessary**. If they think magnitude is possible, you're wrong. If they think eligibility is unnecessary, you're redundant. Focus all energy on proving that specific conjunction.
