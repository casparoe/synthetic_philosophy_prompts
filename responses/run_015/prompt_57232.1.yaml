  Here is a worked example of cue-dependence in literal prose, designed to illustrate Hofstadter's concern that the system tracks surface correlations rather than the underlying situation.

  ### The Example: Property Attribution in Technical Prose

  **1. The Original Sentence (High-Frequency Cue)**
  > **Source:** "There is strong evidence for this hypothesis."
  > **Plausible Neural Output (French):** *"Il y a des preuves solides pour cette hypothèse."*
  > **Status:** **Correct.** The system correctly maps the English adjective "strong" to the French "solides" (literally: solid), which is the idiomatic carrier for evidentiary weight.

  **2. The Minimal Meaning-Preserving Edit (Perturbation)**
  > **Source:** "The evidence for this hypothesis is strong."
  > **Plausible Neural Output (French):** *"La preuve pour cette hypothèse est forte."*
  > **Status:** **Wrong/Degraded.** The system maps "strong" to "forte" (literally: physically powerful). While grammatically valid, *"une preuve forte"* is awkward in French technical prose; it suggests the evidence has physical force or volume rather than logical convincing power. The preferred translation remains *"solide."*

  ### Why This Demonstrates a Lack of Situational Modeling

  This failure mode exposes that the system does not possess a representation of **what evidence is** or **what "strength" means in this context**.

  In the first sentence, the system succeeds because the bigram "strong evidence" is a high-frequency chunk in its training data. It has learned a statistical shortcut: when the token `strong` is immediately adjacent to `evidence`, output `solide`. It is matching surface strings, not modeling the abstract property of "convincing power."

  In the second sentence, the syntactic structure changes (predicative adjective vs. attributive adjective), breaking the surface bigram cue. Because the system lacks a world model that understands "evidence" as an abstract object that possesses "logical weight" rather than "physical force," it reverts to the default, literal translation of "strong" (`forte`). It fails to recognize that the *situation*—the logical relationship between data and hypothesis—is identical in both sentences. The meaning is preserved in the source, but the translation degrades because the surface cue that triggers the correct semantic mapping has been removed.

  ### A Note on "Coverage" vs. "Kind"

  You asked to flag if this is merely a coverage gap. Strictly speaking, a sufficiently large model *could* learn that "evidence is strong" also maps to "solide" simply because that phrase also appears frequently in training data. If the model fails here, it is partly a data sparsity issue (the predicative form appears less often than the attributive form).

  However, this still carves out Hofstadter's "gap in kind" because the mechanism of correction is not reasoning. If you introduce a novel metaphor that preserves the situation but breaks all training cues—for example, *"The evidence for this hypothesis is thunderous"*—the system will fail regardless of model size. It will translate "thunderous" literally (*tonitruant*), missing the meaning entirely. A human translator, modeling the situation, would recognize that "thunderous" in this context functions identically to "strong" and would translate it as *solide* or *accablante*. The machine's reliance on the "strong/solide" cue demonstrates that it is transcoding tokens, not re-creating the thought.
