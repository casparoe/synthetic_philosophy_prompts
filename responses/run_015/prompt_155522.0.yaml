prompt: |-
  Right, so I've got ninety minutes next month with a reading group of about seven people — mostly philosophy PhD students, two from stats, and one economist who'll definately turn up late — and I've promised to get them to the point where they can argue about imprecise probabilities without quietly cheating. They're all fine with expected utility on a single sharp prior, and none of them have read anyting technical beyond one survey chapter. I don't want you to explain imprecise probabilities to me; I want a plan for how I explain them in that room.

  What I most want from you is the dependency structure — which idea has to be in place before the next one is even statable, and why. My hunch is that the first real move has to be killing off the thought that an imprecise credence is just a second-order probability distribution over sharp priors with a wide spread, because if they leave with that picture then every decision rule I show them afterwards quietly collapses back into 'take an expectation again'. But I don't know what has to be in place for that move to even land, and I can't tell whether 'it's a set of probability functions that the evidence doesn't single out' should come before it or after it. Then the decision rules, and the bit where the rules come apart — and I can't work out whether that needs the updating stuff before it or after it.

  Then the example. I want one case to carry the whole ninety minutes, and I want you to say what it has to have and what it has to lack. What I think it needs: at least two of the rules I'll mention give different verdicts on it; the imprecision in it isn't laziness or unfinished thinking, it survives someone going away and doing the maths properly; and there's no natural 'right' prior buried inside it that a bright student can dig out and use to dodge the whole apparatus. Why not the usual coin-of-unknown-bias thing? And is there anything I should be careful not to build the example out of — I'm worried that anything with frequencies in it will get read as sampling noise.

  Misconceptions, and this is where I think I'll get caught out. Here's my list, in no order: that an imprecise credence is a confidence interval; that it's a polite way of saying the calculation isn't finished; that the rule is always to maximise the worst case; that whatever the worst-case rule spits out is automatically undominated (I have a feeling that one's false — something can have exactly the same minimum as an option that beats it or matches it everywhere else — but I can't tell whether that's a fifth-minute point or a fiftieth-minute point); and that more evidence always narrows the interval, which I think is straightforwardly wrong given cases where conditioning on every cell of a partition leaves you wider than you started. Tell me which of these I've misdescribed, which ones they'll actually form and in what order, and exactly where in the sequence to head each one off.

  Two things I want bolted on that certainly aren't in the survey chapter. First: I've started seperating 'thin spread' — imprecision because there's hardly any evidence — from 'clash spread', where two models, or two equally credible experts, simply disagree, and I want them walking out able to say why those might not deserve the same handling (or why they might; I genuinely don't know which way it goes). Second, there's a half-baked rule I use myself: stay permissive, keep every option that isn't dominated across the whole set, and only then break the tie — and when I break it I don't use the midpoint or the average over the set, I use how much of the set is on that option's side. Tell me where that sits in the sequence, whether mentioning it early would breed a misconception, and whether it's really anything different from a rule I should be teaching them anyway.

  Last two things. One question for the final ten minutes that would show me they've got the idea rather than just the vocabulary — I was going to hand them a case where learning something makes the interval wider and ask what they'd do differently once they know which cell they're in, but I'm not sure that tests the right thing. And a list of what I should flatly refuse to explain at this level, saying out loud that I'm refusing it: I'm assuming the full lower-prevision machinery (the general setup where you work with lower and upper expectations directly rather than with a set of probabilities) and anything involving Choquet integrals, but tell me if I'm drawing the line in the wrong place. Write the whole plan in American English, spelling and all — the group's materials are in American and it drives them mad otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Audience:** 7 people (mostly philosophy PhDs, 2 stats, 1 late economist). Comfortable with expected utility (EU) on sharp priors. Limited technical background (one survey chapter).
      *   **Goal:** Enable them to argue about imprecise probabilities (IP) without "cheating" (collapsing back to sharp priors/second-order probabilities).
      *   **Time:** 90 minutes.
      *   **Constraints:** American English spelling/usage. Do *not* explain IP to me (the user), but provide a *plan* for explaining it to them.
      *   **Key Deliverables:**
          1.  Dependency structure (logical ordering of concepts).
          2.  The "Killer Move" (distinguishing IP from second-order probability).
          3.  The Running Example (criteria, what to avoid, why not the standard coin).
          4.  Misconception Management (ordering and timing of corrections).
          5.  Two "Bolt-ons" (Thin vs. Clash spread; The user's specific decision rule).
          6.  Final Question (testing understanding, not vocabulary).
          7.  Refusal List (what *not* to teach).

  2.  **Deconstruct the Dependency Structure:**

      *   *Core Problem:* The user suspects the first move must be killing the "second-order probability" (SoP) view. If they think IP = distribution over priors, they'll just integrate it away.
      *   *Prerequisite for Killing SoP:* They need to understand *why* we are using sets. Is it ignorance (epistemic) or conflict (clash)? If it's just "I don't know which sharp prior is true," that *is* SoP. To kill SoP, the representation must be that *no single sharp prior is rationally mandated*.
      *   *Sequence:*
          1.  Motivation: Why sharp priors fail (dilation, ignorance, conflict).
          2.  Representation: Sets of priors (Credal Sets) vs. Distributions over priors.
          3.  Decision Theory: How to act given a set (E-admissibility, Maximality, Gamma-Maximin).
          4.  Dynamics: Updating (why it gets weird).
      *   *Addressing the User's Hunch:* The user asks: "Should 'it's a set of probability functions that the evidence doesn't single out' come before or after [killing SoP]?"
      *   *Analysis:* Actually, defining it as "a set... evidence doesn't single out" *invites* the SoP interpretation (i.e., "One of these is true, I just don't know which"). To kill SoP, you need the *Levi/Walley* interpretation: The evidence permits *any* of these, and picking one is arbitrary. So, the definition needs to be normative, not just descriptive.
      *   *Revised Sequence:*
          1.  The Failure of Precision (Motivation).
          2.  The Representation (Sets, not Distributions). *Crucial distinction here.*
          3.  Decision Rules (Where the rubber hits the road).
          4.  Dynamics/Updating (Where it gets counterintuitive).

  3.  **The Running Example:**

      *   *Criteria:* Two rules give different verdicts; Imprecision is structural (not laziness); No hidden "right" prior; Avoid frequencies (sampling noise).
      *   *Why not the Coin of Unknown Bias?* It's too easy to model as a Beta distribution (SoP). It invites the "sampling noise" interpretation.
      *   *Better Example:* Needs to involve *conflict* or *structural ambiguity*.
      *   *Idea:* The "Ellsberg Urn" is classic but maybe too behavioral.
      *   *Idea:* "Expert Disagreement." Two experts, same data, different models.
      *   *Idea:* "Coarse Data." You know $P(A) \in [0.4, 0.6]$ because the measurement device is fuzzy, not because of sampling.
      *   *Selection:* **The Two-Expert Forecast.**
          *   Expert 1 says $P(Event) = 0.3$.
          *   Expert 2 says $P(Event) = 0.7$.
          *   Both are equally credible/authorized.
          *   *Why:* It forces "Clash Spread." You can't average them without justification (why trust the average?). It clearly separates the set $\{0.3, 0.7\}$ from a distribution $0.5 \delta_{0.3} + 0.5 \delta_{0.7}$.
          *   *Decision Conflict:* Bet on Event vs. Bet against.
          *   *Avoid:* Frequencies. Keep it single-case or structural.

  4.  **Misconception Management:**

      *   *List:* Confidence intervals, unfinished calculation, always maximin, undominated = admissible, evidence always narrows.
      *   *Timing:*
          *   "Unfinished calculation": Kill immediately (Minute 5).
          *   "Confidence Interval": Kill during Representation (Minute 20). Frequentist vs. Bayesian credence.
          *   "Always Maximin": Kill during Decision Rules (Minute 45). Show E-admissibility.
          *   "Undominated = Admissible": Clarify during Decision Rules (Minute 50). (User is right: Minimax can pick dominated options if the dominance isn't visible at the minimum).
          *   "Evidence narrows": Save for Updating (Minute 70). Dilation example.

  5.  **The Bolt-ons:**

      *   *Thin vs. Clash:* This fits well after the Representation phase. It explains *why* the set exists.
      *   *User's Rule (Permissive + Tie-break by measure):* This is essentially a variation of *Maximality* followed by a specific tie-breaker (measure of support).
      *   *Risk:* If introduced too early, they treat the "measure of support" as a second-order probability.
      *   *Placement:* Late stage (Decision Rules). Frame it as a "Tie-Breaking Heuristic," not a fundamental axiom. Warn that it edges toward SoP if not careful.

  6.  **The Final Question:**

      *   *User's Idea:* Learning makes interval wider (Dilation). Ask what they'd do.
      *   *Critique:* Good, but might be too technical.
      *   *Refinement:* Make it about *action*. "You face a choice. You can pay to learn which cell you are in. Learning will dilate your credence. Do you pay?" This tests if they understand that wider credence $\neq$ worse decision state necessarily, or that information has cost/benefit in IP frameworks.
      *   *Better:* Focus on the *cheating* aspect. Give them a scenario where averaging priors gives a clear answer, but IP says "No." Ask them to justify the "No."

  7.  **Refusal List:**

      *   Lower Previsions (Walley): Too technical for 90 mins.
      *   Choquet Integrals: Definitely out.
      *   Axiomatic Foundations (Gilboa-Schmeidler): Mention, don't derive.
      *   Computational complexity of updating.

  8.  **Drafting the Plan (incorporating American English):**

      *   *Tone:* Direct, structured, pedagogical.
      *   *Structure:*
          1.  Dependency Map.
          2.  The 90-Minute Timeline.
          3.  The Running Example (Deep Dive).
          4.  Misconception Interceptions.
          5.  The Bolt-ons.
          6.  The Final Test.
          7.  The Refusal List.

      *(Self-Correction during drafting)*: Wait, the user asked about the dependency of "Set of functions" vs "Killing SoP".
      *Logic:* You cannot define it as a set of functions without implying SoP unless you specify the *interpretation* of that set.
      *Solution:* The definition must be "The set of priors *permitted* by rationality," not "The set of priors *possible* given my ignorance." The latter is SoP. The former is IP. I need to make sure the plan emphasizes *permissibility* vs *possibility*.

      *(Refining the User's Rule)*: The user's rule ("how much of the set is on that option's side") is basically counting the measure of priors favoring an act. This is dangerously close to SoP (integrating over the set). I need to warn them that this is a *pragmatic* addition, not part of standard IP theory (which usually stops at E-admissibility or Maximality). I should advise them to present it as "How I handle it," not "How IP works."

      *(Refining the Example)*: The "Two Experts" is good, but let's make it "Two Models." Stats PhDs will respect models. Model A says risk is low, Model B says risk is high. Data doesn't distinguish them yet. This avoids the "Expert opinion is just data" counter-argument.

      *(Refining the Final Question)*: The dilation question is good. Let's sharpen it. "Information makes your credence less precise. Should you avoid it?"

  9.  **Final Review against Constraints:**
      *   American English? (Check: 's' vs 'z', 'color', 'modeling', etc.)
      *   No explaining IP to user? (Check.)
      *   Dependency structure clear? (Check.)
      *   All specific questions answered? (Check.)

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the plan. It is structured to keep the group from collapsing the framework back into standard Bayesianism.

  ### 1. The Dependency Structure

  You are correct that killing the second-order probability (SoP) interpretation is the priority. If they view the set of priors as a distribution over "the true prior," they will integrate it away. However, you cannot kill that idea until they understand *why* the set exists.

  Here is the logical dependency chain. Do not move to the next step until the previous one is secured.

  1.  **The Normative Claim (Minute 0–15):** Rationality sometimes *forbids* picking a single sharp prior.
      *   *Why this first:* If the set is just "I haven't finished calculating," they will wait for the calculation. You must establish that *stopping* at a set is the rational endpoint, not a pause.
  2.  **The Representation (Minute 15–30):** A credal set is a set of *permissible* priors, not a probability distribution over *possible* priors.
      *   *Why this second:* This is where you kill SoP. If it's a distribution over possible priors, you take the expectation. If it's a set of permissible priors, you check for dominance across the set.
      *   *Crucial Distinction:* "Possible" implies one is true (SoP). "Permissible" implies any could be rationally adopted (IP).
  3.  **The Decision Rules (Minute 30–60):** How to choose when the set recommends different acts.
      *   *Why this third:* Without decision rules, the representation is inert. This is where the "cheating" usually happens (e.g., silently picking the midpoint).
  4.  **The Dynamics (Minute 60–75):** Updating and Dilation.
      *   *Why this fourth:* You need the decision rules in place to understand why dilation matters. If you don't know how to act, you won't care if the interval widens.
  5.  **The Nuance (Minute 75–90):** Thin vs. Clash spread and tie-breaking.
      *   *Why this last:* These are refinements. If they don't grasp the basics, these will confuse them.

  ### 2. The Running Example

  Do not use the coin of unknown bias. It is too easily modeled as a Beta distribution (which is a sharp prior over a parameter), inviting the SoP collapse. It also invites frequentist "sampling noise" interpretations.

  **Use: The Competing Climate Models.**

  *   **The Setup:** A policy decision depends on whether global temperature rise ($T$) exceeds 2°C by 2050.
  *   **The Evidence:** We have forty years of data.
  *   **The Models:**
      *   Model A (Physics-heavy): Fits the data well. Predicts $P(T > 2) = 0.3$.
      *   Model B (Empirics-heavy): Fits the data equally well (same likelihood). Predicts $P(T > 2) = 0.7$.
      *   There is no meta-reason to weight A over B. They are structurally distinct, not just parameter variations of the same model.
  *   **The Choice:** Invest in mitigation (Costly now, pays off if $T > 2$) or Adaptation (Cheap now, pays off if $T \leq 2$).

  **Why this works:**
  1.  **Different Verdicts:** Model A says Adapt; Model B says Mitigate.
  2.  **Structural Imprecision:** It isn't laziness. Running the math longer doesn't help; the models are equally supported.
  3.  **No Hidden Prior:** There is no "true" probability buried here. The uncertainty is about the *model structure*, not a parameter within a structure.
  4.  **Avoids Frequencies:** This is a single-case prediction about a specific year, derived from models, not a sampling urn.

  **What to avoid building into the example:**
  *   **Do not** imply we will get more data soon. That invites the "wait and see" response.
  *   **Do not** give them a reason to trust one model slightly more. Keep the support exactly equal to force the imprecision.

  ### 3. Misconception Management

  Here is the order in which they will form these misconceptions and where you must intercept them.

  1.  **"It's an unfinished calculation."**
      *   *When:* Minute 5.
      *   *Interception:* State clearly: "In this framework, having a sharp prior is *less* rational than having a set, given this evidence."
  2.  **"It's a confidence interval."**
      *   *When:* Minute 20 (during Representation).
      *   *Interception:* Remind the stats students: "A confidence interval is about the long-run performance of an estimator. This set is about *your* current rational permissions for betting."
  3.  **"The rule is always to maximize the worst case (Maximin)."**
      *   *When:* Minute 40 (during Decision Rules).
      *   *Interception:* Show a case where Maximin is too conservative. Introduce **E-Admissibility** (choose an act that is optimal for *at least one* prior in the set). This stops them from thinking IP is just extreme pessimism.
  4.  **"Whatever Maximin picks is undominated."**
      *   *When:* Minute 50.
      *   *Correction:* You are right to be worried. Maximin can select a dominated option if the domination isn't visible at the minimum.
      *   *Timing:* Address this immediately after introducing Maximin. Show an act $A$ and act $B$ where $A$ has a higher minimum but $B$ is better in every state. Clarify that **Maximality** (no other act is better in *all* priors) is the standard for undominated status, not Maximin.
  5.  **"More evidence always narrows the interval."**
      *   *When:* Minute 70 (during Dynamics).
      *   *Interception:* Use the **Dilation** example. Show that conditioning on a partition can widen the interval for every cell. This proves IP is not just "noisy sharp probability."

  ### 4. The Bolt-Ons

  **Thin Spread vs. Clash Spread**
  *   **Where:** Minute 25, right after defining the Credal Set.
  *   **Why:** This helps them categorize *why* the set exists.
      *   *Thin:* "I have no data." (Vacuous prior).
      *   *Clash:* "I have conflicting robust models." (The Climate Example).
  *   **Handling:** Tell them standard IP theory treats them the same (a set is a set), but *pragmatically*, Clash Spread might resolve with new theory, while Thin Spread resolves with data. This satisfies the economist's desire for mechanism without breaking the formalism.

  **Your Tie-Breaking Rule**
  *   **The Rule:** Keep every non-dominated option, then break ties by measuring how much of the set supports the option.
  *   **Where:** Minute 60, at the very end of Decision Rules.
  *   **Warning:** You must frame this carefully. If you present this as "The Rule of IP," you will undo your work on killing SoP. Measuring "how much of the set" implies a measure over the set of priors, which looks suspiciously like a second-order probability.
  *   **How to teach it:** "Standard IP stops at E-Admissibility (a set of permissible acts). However, in practice, we must act. My heuristic is to look at the *measure* of priors supporting an act. **Note:** This is a pragmatic addition to the theory, not a core axiom. It risks collapsing back to SoP if you aren't careful about where that measure comes from."
  *   **Verdict:** Teach it as a "Post-Processing Heuristic," not a decision rule. This protects the integrity of the main lesson.

  ### 5. The Final Question (Last 10 Minutes)

  Your idea about dilation is good, but it tests their knowledge of a phenomenon, not their grasp of the *stance*. To test if they are "cheating," you need to force them to justify *not* averaging.

  **The Question:**
  "Return to the Climate Models. Suppose a senior colleague says: 'Look, Model A and Model B are equally credible. Rationality demands you average them to 0.5 and maximize expected utility.' Using the concepts from today, write down the one-sentence objection that stops you from doing that."

  **What you are looking for:**
  *   *Bad Answer:* "Because the interval is wide." (Descriptive, not normative).
  *   *Bad Answer:* "Because averaging is risky." (Vague).
  *   *Good Answer:* "Because neither 0.5 nor the averaging procedure is *permitted* by the evidence; picking 0.5 adds information I do not have."
  *   *Good Answer:* "Because acting on 0.5 exposes me to loss in scenarios where Model A or B is correct, which an E-Admissible rule would avoid."

  This tests if they understand the *normative force* of the set (it forbids precision) rather than just the *mechanics* (it looks like an interval).

  ### 6. The Refusal List

  You are drawing the line correctly, but be explicit. Write these on the board under "Out of Scope" so they know you aren't skipping them by accident.

  1.  **Lower Previsions / Walley's General Theory:** "We are working with sets of probabilities, not the more general lower prevision framework. It's more powerful, but it obscures the intuition we need today."
  2.  **Choquet Integrals:** "We are not doing non-additive measure theory. We are sticking to sets of additive measures."
  3.  **Axiomatic Derivations:** "I will not prove the representation theorems (e.g., Gilboa-Schmeidler). We are taking the representation as a starting point to discuss decision-making."
  4.  **Computational Complexity:** "We are ignoring how hard it is to compute these sets in high dimensions. Assume the set is given."

  ### 7. Timeline Summary (90 Minutes)

  *   **00–15:** Motivation. Why sharp priors fail (Climate Example intro). Normative claim: Precision can be irrational.
  *   **15–30:** Representation. Credal Sets. **Kill SoP here.** Thin vs. Clash spread.
  *   **30–45:** Decision Rules. E-Admissibility vs. Maximin. **Correct the 'Undominated' misconception here.**
  *   **45–60:** Your Tie-Break Heuristic (framed as pragmatic, not axiomatic).
  *   **60–75:** Dynamics. Conditioning. **Dilation Example.**
  *   **75–80:** Misconception Sweep (Confidence intervals, unfinished calculation).
  *   **80–90:** Final Question and Discussion.

  ### A Note on the Late Economist
  Since the economist will arrive late, do not start with the technical definition. Start with the **Climate Example** narrative. If they walk in at minute 15, they can catch the "Models disagree" point, which is the hook they need. If you start with "Let $K$ be a closed convex set of measures," they will be lost forever.
