answer: |-
  **To:** Standing Committee on Long-Term Programme Grants
  **From:** Committee Member
  **Subject:** Reasoning and Recommendation: Phase-Lattice Dynamics

  Per our discussion, I have drafted the reasoning for the *phase-lattice dynamics* recommendation. Below are the candidate rules derived from our precedents and the 2011 memo, their predictions for this case, and my assessment of the likely vote.

  ### 1. Candidate Rules Fitting the Precedents

  Two interpretations of the 2011 memo fit all six precedents but diverge on *phase-lattice dynamics*.

  **Rule Alpha (Generative Novelty):** A field qualifies if its revisions to auxiliary assumptions generate *new, confirmed predictions* that were not used to fit the revision. An unfalsifiable core is permitted (Precedent 3) provided it yields falsifiable satellites that confirm novel facts (Precedents 1, 3, 5). A field is rejected if revisions merely accommodate data already in hand (Precedents 2, 4, 6).
  *   *Disagreement Point:* Focuses on the *output* of revision (confirmed content), not the *rigor* of the test method.

  **Rule Beta (Methodological Jeopardy):** A field qualifies only if its methods create a *serious chance of failure* for its claims. An unfalsifiable core is permitted only if testable derivatives face genuine risk (Precedents 3, 5). A field is rejected if methodological flexibility (e.g., post-hoc re-specification, small samples, flexible exclusions) prevents claims from being put in jeopardy, even if they are technically falsifiable (Precedents 2, 4, 6).
  *   *Disagreement Point:* Focuses on the *probability of refutation* inherent in the design, regardless of whether positive results are reported.

  ### 2. Predictions for Phase-Lattice Dynamics

  **Under Rule Alpha (Confidence: Moderate):** **Approve.**
  The field reports that re-specified kernels predict "something not used in the fit," and 70% are confirmed. Two engineering models work routinely. While the core is stipulative (like *Carrier Framework*), the "belt models" function as satellite theories producing confirmed content. The 2019 registry failure (9/26) is concerning, but Rule Alpha prioritizes the existence of confirmed novel predictions (the 70% unregistered set and engineering successes) over the method of their discovery, provided they aren't purely ad-hoc accommodations of old data.

  **Under Rule Beta (Confidence: High):** **Reject.**
  The methods systematically prevent jeopardy. The coupling kernel has 30 degrees of freedom (fits any dataset); samples are small (20–40); exclusion rules are flexible. The preregistered hit rate (chance) reveals that the 70% unregistered success rate is likely selection bias, mirroring *Ambient Field Epidemiology* (Precedent 4). The response to failed replications ("site-specific coupling") mirrors the immunizing strategies of *Motivational Field Theory* (Precedent 2). The core is protected not by methodological convention (as in *Carrier Framework*) but by rebuking testers.

  ### 3. Committee Vote and Reasoning

  **Best Guess:** **Reject (with conditions for future eligibility).**

  **Reasoning:**
  I anticipate the committee will favor **Rule Beta**. While Rule Alpha accommodates the engineering successes, the 2011 memo explicitly states a field is scientific "to the extent that its claims can conflict with observation." The *phase-lattice* community has structured its practice to minimize this conflict.

  The decisive factor is the 2019 registry data. In *Predictive Phenology* (Precedent 5), approval was granted *with conditions* specifically because they preregistered revisions before new data arrived. In *phase-lattice*, the registry reveals that when flexibility is removed, performance drops to chance. This aligns with the rejection note for *Ambient Field Epidemiology*: "the claims have never been put in jeopardy." The engineering successes are analogous to the "satellite models" of *Carrier Framework*, but *Carrier* was approved because those satellites were falsifiable and confirmed. Here, the satellites (belt models) rely on flexible kernels that fail under preregistration. The committee will likely view the engineering utility as a narrow application that does not validate the broader research programme's scientific status.

  ### 4. Closest Analog

  **Precedent 4: *Ambient Field Epidemiology* (Rejected, 2016).**

  **Why:**
  Both fields share the specific pathology of "technical falsifiability without actual risk."
  *   *Ambient Field:* Claims sharply falsifiable, but outcome variables re-specified after inspection; effect sizes drifted to zero.
  *   *Phase-Lattice:* Claims directional, but coupling kernel re-specified with 30 degrees of freedom; preregistered hit rate is chance.
  *   *Distinction from Carrier Framework (2012):* In *Carrier*, the core was exempt by *convention*, but the satellites were robust. In *Phase-Lattice*, the core is exempt by *dogma* (rebuking testers), and the satellites are fragile (registry failure).
  *   *Distinction from Motivational Field (2009):* *Motivational Field* had no observation that could count against it. *Phase-Lattice* allows observation to count, but uses methodological flexibility to ensure it rarely does. This nuance makes *Ambient Field* the tighter fit.

  ### 5. Principles at Stake (Underdetermination)

  Our precedents underdetermine this case because *phase-lattice* sits between *Carrier Framework* (unfalsifiable core, approved) and *Ambient Field* (flexible methods, rejected). The vote will adopt one of two principles:

  *   **If we Approve:** We adopt the **Principle of Pragmatic Fruitfulness**. We accept that a field is scientific if it produces working models and confirmed predictions, even if its statistical practices are loose and its core is dogmatically protected. We prioritize *output* over *process*.
  *   **If we Reject:** We adopt the **Principle of Methodological Accountability**. We assert that confirmed predictions do not count as scientific evidence if the methods used to generate them precluded the possibility of failure. We prioritize *risk* over *results*.

  Given the 2011 memo's emphasis on "sustained conflict" and "revision," the Principle of Methodological Accountability is the stronger reading.

  ### 6. Decisive Further Evidence

  To separate Rule Alpha and Rule Beta in future cases, the committee should request:

  **Evidence:** A study protocol where the **coupling kernel parameters are fixed *a priori* based on independent physical measurements**, removing the 30 degrees of freedom, before data collection begins.

  **What each rule says:**
  *   **Rule Alpha (Generative Novelty):** This evidence is **irrelevant** unless it leads to confirmed predictions. If the fixed-kernel model fails to predict new facts, Rule Alpha recommends Reject. If it succeeds, Rule Alpha recommends Approve. The *constraint* itself matters less than the *outcome*.
  *   **Rule Beta (Methodological Jeopardy):** This evidence is **decisive regardless of outcome**. If the field adopts this protocol, they have introduced genuine jeopardy. Rule Beta recommends Approve (even if the model fails, provided they revise transparently), because the *process* now allows conflict. If the field refuses this protocol, Rule Beta recommends Reject, as it confirms the field is unwilling to let claims conflict with observation.

  **Recommendation:** We should make the adoption of a fixed-kernel protocol a condition for any future application from this field.
