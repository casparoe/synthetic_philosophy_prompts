answer: |-
  You have isolated a precise edge case in decision theory that sits between the St. Petersburg Paradox and the theory of Dominance. You are correct that standard terminology often blurs these distinctions. Here is the carving you asked for.

  ### 1. The Name of the Move and the Situation

  **The Move:**
  The logical move you are making—bypassing the valuation of individual options to compare them outcome-by-outcome—is called **Statewise Dominance** (or Pointwise Dominance).
  The specific calculation you are performing—evaluating the expectation of the difference when the expectations of the components are undefined—is best termed **Relative Expectation**.

  **The Situation:**
  The situation where two options have undefined values individually, but their difference has a determinate (positive or infinite) value, is a case of **Divergent Dominance**.

  *   **What it is:** A preference relation derived from the integrability of the *difference* function, even when the *component* functions are non-integrable.
  *   **What it is not:** It is not a "Fair Price" calculation. It is a "Switching Criterion."
  *   **Where it runs out:** It runs out when the difference itself fails to converge (your Game D case) or when the coupling between the games is broken (the "separate coins" case).

  ### 2. The Boundary Cases (The Carving)

  You asked to distinguish the general phenomenon from its neighbours. We can classify these scenarios based on two axes: **Dominance** (does one win on every branch?) and **Relative Expectation** (does the weighted sum of differences converge?).

  | Case | Dominance? | Relative Expectation ($E[A-B]$) | Verdict | Example |
  | :--- | :--- | :--- | :--- | :--- |
  | **I. Standard** | No | Finite | Priceable | Normal insurance risks. |
  | **II. Your Game C** | Yes (Constant) | Finite | **Priceable** | $A$ vs $A - \$1$. The shift is constant; expectation exists. |
  | **III. Your Game B$\to$A** | **Yes** (Strict) | **Infinite** ($+\infty$) | **Ranked, Unpriceable** | The case you identified. Firm ranking, infinite willingness to pay. |
  | **IV. Your Game D** | No | Undefined | **No Verdict** | Sign reversal. No dominance, difference diverges/oscillates. |
  | **V. Pure St. Petersburg** | N/A | Infinite | **Unpriceable** | Single game with infinite EV. No comparison needed. |

  **How your case differs from the neighbours:**
  *   **Vs. St. Petersburg:** St. Petersburg involves one game with infinite value. Your case involves two games with *undefined* value yielding an infinite *gain*. The St. Petersburg paradox is usually resolved by utility curvature (log wealth). Your case survives utility curvature *if* the dominance holds, but the "infinite fee" conclusion does not.
  *   **Vs. Two-Envelope Paradox:** The Two-Envelope problem arises from inconsistent conditioning (comparing $A$ to $B$ using different probability measures). Your case uses a single, fixed probability measure on a shared state space. Your verdict is robust; theirs is an illusion.
  *   **Vs. Game C:** In Game C, the difference is bounded (constant $-\$1$). In your Game B$\to$A, the difference is unbounded. This is why C yields a sane price and B$\to$A yields an absurd one.

  ### 3. The Three Settled Questions

  **Q1: Does the improvement's unbounded total count as a "value"?**
  **No.** It is a **Preference Bound**, not a Value.
  *   **Value (Fair Price):** Implies there exists a number $V$ such that you are indifferent between the game and receiving $V$ cash. This requires the expectation to be finite and absolute.
  *   **Preference Bound:** Implies that for any finite cost $C$, you prefer the swap.
  *   **Distinction:** In your Game A, the "value" is undefined because the series is conditionally convergent (reordering changes the sum). In the B$\to$A swap, the "improvement" is a series of positive terms ($\sum \frac{1}{2k}$). This diverges to $+\infty$. It is not a number you can hold; it is a direction that never stops. It tells you "always swap," but it does not tell you "the swap is worth $X$."

  **Q2: Does the argument need the two games to be played with the same coin?**
  **Yes. Absolutely.**
  This requirement is called **Coupling**.
  *   **Same Coin (Coupled):** You are comparing $A(\omega)$ and $B(\omega)$ for the *same* outcome $\omega$ (e.g., "Heads on toss 3"). Statewise dominance holds because for every $\omega$, $A(\omega) \ge B(\omega)$.
  *   **Separate Coins (Independent):** You are comparing the distribution of $A$ to the distribution of $B$. You lose the branch-by-branch guarantee. It is possible to play $B$ and get a "win" (odd toss) while a hypothetical separate play of $A$ would have yielded a "loss" (even toss).
  *   **Consequence:** If the coins are separate, Statewise Dominance collapses. You are left only with the distributions. Since both distributions have undefined expectations, you have no mathematical basis to prefer one over the other. The "firm ranking" vanishes without the coupling.

  **Q3: Which half of the second case is fragile—the ranking or the any-finite-fee?**
  **The "any-finite-fee" conclusion is fragile. The ranking is robust.**
  *   **The Ranking (Robust):** Statewise dominance is the strongest condition in decision theory. If $A$ pays more than $B$ in every possible world, and strictly more in some, $A$ is strictly preferred to $B$. This holds regardless of your risk aversion, your utility function, or the convergence of the series. It is a logical truth, not a statistical one.
  *   **The Fee (Fragile):** The conclusion that you should pay *any* finite fee (e.g., \$1 million) relies on an implicit assumption: **Linear Utility of Money**.
      *   The calculation $\sum \text{Prob} \times \text{Payoff} = \infty$ assumes that \$1 billion is exactly one billion times better than \$1.
      *   In reality (and in any rational resolution of the St. Petersburg Paradox), utility is concave (e.g., logarithmic).
      *   If you apply logarithmic utility to the *gain* from switching ($2^n/n$), the series $\sum 2^{-n} \log(2^n/n)$ converges to a finite number.
      *   **Result:** You should still swap (because the utility gain is positive on every branch), but there is now a **maximum finite fee** you should pay. The "infinite" valuation was an artifact of assuming money has no diminishing marginal utility.

  ### Summary Definition

  If you need to write this into your notebook, here is the definition:

  **Divergent Dominance:**
  A decision scenario involving two gambles, $A$ and $B$, defined on a shared probability space.
  1.  **Condition 1:** $E[A]$ and $E[B]$ are undefined (due to conditional convergence or divergence).
  2.  **Condition 2:** $A(\omega) \ge B(\omega)$ for all outcomes $\omega$ (Statewise Dominance).
  3.  **Condition 3:** $E[A - B]$ diverges to $+\infty$.
  **Implication:** A rational agent must prefer $A$ to $B$ (Ranking), but cannot assign a finite fair price to the improvement (Valuation). The recommendation to pay any finite cost to switch is valid only under linear utility; under concave utility, the preference remains, but the willingness-to-pay becomes finite.

  This is not a paradox; it is a boundary condition where **Ordering** survives but **Measurement** fails.
