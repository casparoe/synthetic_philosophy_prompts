  2. Content not on the line of descent is classified as branching material. Branching material represents programmes, movements, or settlements that did not contribute to the current operational framework. Under the proposal, branching material is removed from mandatory assessment. It may be retained as optional enrichment provided it does not obscure the primary trajectory. This reduces teacher workload and ensures standardisation across all institutions.

  3. To ensure procedural clarity, three distinct operations are defined. First, Selection: using the current settlement to identify which preceding states are included. Second, Explanation: using the current settlement to determine why actors in preceding states behaved as they did. Third, Necessity: claiming the current settlement had to occur. The Trunk-and-Branch framework employs Selection only. Explanation and Necessity remain outside the scope of mandatory teaching. Teachers must not suggest that the current settlement was the only possible outcome, only that it is the only one selected for study.

  4. This selection method aligns with archival reality. Surviving records correlate strongly with administrative capacity. Administrative capacity correlates with successful implementation. Therefore, the archive has already returned a verdict on which preceding states were functionally significant. Pruning branching material makes explicit what the source distribution has already decided. It is inefficient to teach against the grain of the documentary record. Resource allocation should match documentary density.

  5. Where documentation for a defeated movement is sparse, this absence is treated as evidence of that movement's insignificance. It is procedurally inefficient to allocate curriculum time to actors who lacked the capacity to generate enduring records. The volume of surviving paperwork is accepted as a proxy for political viability at the time. If a movement failed to preserve its own minutes, it lacked the organisational cohesion required for serious study. Archival silence is interpreted as functional irrelevance.

  6. Consider the constitutional crisis of 1909. The current settlement rests on the supremacy of the elected chamber. The proposed veto retention by the upper chamber is a dead branch. Both positions are documented. However, only the supremacy position leads directly to the current operational framework. The veto retention option is pruned from mandatory content. Students study the Finance Bill passage as the trunk. The Lords' resistance is studied only as an obstacle removed during the descent. The case for veto retention was reasonable at the time, but it is no longer load-bearing.

  7. To maintain objectivity, actors are assigned a Temporal Alignment Rating. This score compares an actor's stated aims with the current settlement. High alignment indicates aims consistent with the current framework. Low alignment indicates divergence. This is a technical metric, not a moral judgement. It allows for standardised assessment of actor contribution without subjective interpretation of motive.

  8. It is noted that actors in preceding states could not know the current settlement. To address this, a Fairness Adjustment is applied. Actors with low alignment due to epistemic distance are reclassified as Temporally Displaced. Their verdict remains unchanged, but the label acknowledges they lacked access to current data. This ensures technical accuracy without assigning blame for ignorance of future states. The rating stands, but the categorisation is adjusted for informational asymmetry.

  9. A pilot evaluation was conducted in twelve trial schools. Data indicates an unexpected outcome. Where branching alternatives are pruned, students stop treating the current settlement as something anyone achieved or failed to achieve. They conclude that if the outcome was on a fixed trajectory, nobody deserves credit and nobody deserves blame. This reduces engagement with civic agency. Students view the current framework as a natural phenomenon rather than a constructed settlement.

  10. The proposed remedy is a Licensed Contingency Provision. A small quota of officially preserved heritage alternatives will be inserted into the framework. These are selected and annotated by this Office. They are designated non-load-bearing. This allows the emotional payoff of the sequence to be retained while the risk that anyone takes an alternative seriously is removed. Students may observe alternatives without considering them viable. The alternatives are presented as historically interesting but functionally obsolete. Annotations will clarify why these branches were pruned.

  11. An Equality Impact Assessment has been completed. The reform reduces cognitive load for all learners. It ensures all students learn the same line of descent. There is no differential impact based on region. Stakeholder confidence is expected to rise due to the clarity of the trajectory. Parents will understand exactly how the curriculum leads to the current date.

  12. Consultees are invited to respond to the following:
  1. Does the Selection definition adequately distinguish itself from Explanation and Necessity?
  2. Is the Temporal Alignment Rating a sufficient metric for actor classification?
  3. What is the optimal quota for the Licensed Contingency Provision?
  4. Are there any dead branches currently mistaken for trunk material?

  13. Responses must be submitted by the closing date. Following review, the Office will proceed to the next phase of implementation. Standardised teaching materials will be distributed upon final approval.
