      *   **Constraints/Fixed Points:**
          1.  *Ability is a margin:* Not binary (can/cannot), but a measure of disturbance rejection capacity at an operating point.
          2.  *No self-generated reference:* Setpoints come from outside (operator/outer loop). "Who sets the top-level reference?" is outside the theory.
      *   **Deliverables:**
          1.  Translation of the Alternative Possibilities thesis (Compatibilist vs. Incompatibilist).
          2.  Translation of the Source Condition thesis (Ultimate Origination).
          3.  Residue Report for each (Clean mapping, Distorted mapping, No expression).
          4.  Explicitly state imported assumptions (e.g., reasons = setpoints).
          5.  Verdict on the residues (Does margin grading dissolve the binary? Is the reference regress a blind spot or incoherent?).
          6.  Verdict on Responsibility (Fault isolation vs. Moral Responsibility).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Alternative Possibilities (AP):*
          *   Incompatibilist (Libertarian/Hard Determinist): Could have done otherwise *given the exact same past and laws*. Requires causal bifurcation.
          *   Compatibilist: Could have done otherwise *if* desires/beliefs had been different. Conditional analysis.
      *   *Source Condition (Ultimate Origination):*
          *   Agent must be the *uncaused cause* (or at least not fully determined by prior external factors). No infinite regress of external causes.
      *   *Moral Responsibility:*
          *   Blame/Praise based on agency.
          *   Engineering Responsibility: Fault isolation (which component failed?).

  3.  **Map to Control Theory Vocabulary:**
      *   *Agent* $\rightarrow$ Controller + Plant (Closed Loop System).
      *   *Action* $\rightarrow$ Control Signal / Actuator Output.
      *   *Desires/Reasons* $\rightarrow$ Reference Signal ($r$). **(Crucial Assumption needed here)**.
      *   *Constraints/Laws of Physics* $\rightarrow$ Plant Dynamics / Actuator Saturation limits.
      *   *Past/Determinism* $\rightarrow$ Initial Conditions + System Dynamics.
      *   *Disturbances* $\rightarrow$ External noise/unmodeled dynamics.
      *   *Ability to do otherwise* $\rightarrow$ Control Authority / Feasible Set / Stability Margins.
      *   *Ultimate Source* $\rightarrow$ Reference Generator (Outer Loop / Human Operator).

  4.  **Drafting the Translation - Thesis 1: Alternative Possibilities:**
      *   *Incompatibilist:* Requires the system to output $u_1$ at time $t$ given state $x(t)$ and reference $r(t)$, but also be *capable* of outputting $u_2 \neq u_1$ at time $t$ with *identical* $x(t)$ and $r(t)$.
          *   *Control View:* This is impossible for a deterministic controller. It implies stochasticity or non-functionality. It's like asking a PID to output two voltages for the same error.
      *   *Compatibilist:* Requires the system to output $u_2$ if $r$ had been $r'$.
          *   *Control View:* This is standard sensitivity analysis. $\frac{\partial u}{\partial r} \neq 0$. If the reference changes, the control action changes.
      *   *Fixed Point 1 (Margins):* Ability isn't "can/cannot." It's the size of the set of references $\mathcal{R}$ the system can track without saturating or losing stability.

  5.  **Drafting the Translation - Thesis 2: Source Condition:**
      *   *Philosophy:* Agent must originate the will.
      *   *Control View:* The controller does not generate $r$. $r$ comes from the outer loop. If we trace back, we hit the "Operator" or "Mission Profile."
      *   *Fixed Point 2 (No Self-Ref):* The theory explicitly excludes the generation of the top-level $r$.
      *   *Translation:* The demand for "Ultimate Origination" is a demand that the controller contain its own reference generator *without* an outer loop. This violates the nested loop architecture.

  6.  **Developing the Residue Report:**
      *   *AP Clean:* Compatibilist conditional maps perfectly to sensitivity/transfer functions.
      *   *AP Distorted:* Incompatibilist "could" maps to stochastic processes (noise injection), which engineers treat as uncertainty, not freedom.
      *   *AP Missing:* The *normative* weight of "could." Engineering says "physically possible," Philosophy says "morally open."
      *   *Source Clean:* The regress of outer loops matches the regress of causes.
      *   *Source Distorted:* Engineers accept the regress ends at "Operator" or "Environment." Philosophers worry the Operator is also determined.
      *   *Source Missing:* The *value* of being the source. Engineers don't care who sets $r$, only that the loop is stable.

  7.  **Addressing the Verdicts (The "Honest" Part):**
      *   *Margins vs. Binary:* Does grading ability help? Yes, it shows "freedom" is a capacity metric (authority), not a metaphysical switch. It dissolves the binary by showing it's a performance spec.
      *   *Reference Regress:* Is it a blind spot? No, it's a boundary condition. Control theory is about *regulation*, not *teleology*. The demand for ultimate sourcehood is asking the control law to solve a teleological problem. It suggests the philosophical demand is incoherent *within a causal framework*.
      *   *Responsibility:* Engineering responsibility is functional (fault isolation). Moral responsibility is retributive/forward-looking. They map only verbally. You replace a servo; you don't "blame" it.

  8.  **Refining the Tone:**
      *   Must sound like an engineer talking to an engineer. Precise, no fluff, respect for the framework.
