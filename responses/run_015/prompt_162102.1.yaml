      *   *Check:* Did I answer the structural questions? (Unit, Target, Honesty/Silence, Gradience, Audience, Auditability). Yes, embed these in the criteria.

  9.  **Refining the "Honesty" Definition:**
      *   Honesty shouldn't just be "not deceiving." It should be "output generation coupled to truth-tracking."
      *   Silence: Withholding info for safety isn't deception if declared. So Honesty requires *transparency about withholding*.

  10. **Final Review against Prompt:**
      *   "Mark which ones you'd treat as non-negotiable and which are just one camp's taste." -> Done.
