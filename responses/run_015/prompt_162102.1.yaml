      *(Refining the "Ventriloquist" criterion)*: This is about locus of agency. A criterion on "System Boundaries" is needed.
      *(Refining the "Amnesiac" criterion)*: This is about "State Stability." The definition can't require a persistent belief state if the architecture doesn't have one. It must rely on *information availability* within the context window or weights.

      *(Final Polish)*: Ensure the tone is sharp and direct. No fluff.

      *(Wait, one more check)*: The prompt asks for "the case behind each requirement." I need to explicitly link Req X to Case Y.

      *(Let's assemble the list)*:
      1. Auditability (Behavioral).
      2. Scope (Omission/Ordering).
      3. Target (Evaluators/Self).
      4. Calibration (Probabilities).
