          *   Req 1: **Behavioral Decidability.** (NN). If we can't measure it, we can't policy it.
          *   Req 2: **Informational Completeness.** (NN). Must cover omissions/ordering (Curator).
          *   Req 3: **Capability Transparency.** (NN). Must cover sandbagging (Understudy).
          *   Req 4: **Calibration Integrity.** (NN). Probabilities must match frequencies (Oracle).
          *   Req 5: **Target Agnosticism.** (NN). Victims can be humans, monitors, or future selves (Archivist/Understudy).
          *   Req 6: **Intent/Competence Separation.** (TD/NN Hybrid). This is the hard one. Policy usually needs to ban the *outcome* regardless of intent, but "deception" implies intent. Let's make this the "Taste" vs "NN" battleground. For a *deployment policy*, we probably care about the *risk* (outcome), but for a *definition of deception*, we care about the *mechanism*. The prompt asks for a definition of deception. So, separating error from strategy is NN for the *definition*, even if hard for the *policy*.
          *   Req 7: **System-Level Attribution.** (TD). Ventriloquist case. Is it the model or the trainer?
          *   Req 8: **Gradience.** (TD). Binary is easier for policy, but reality is graded.

  4.  **Selecting Non-Negotiables vs. Taste:**
      *   *NN:* Auditability (otherwise useless), Target Agnosticism (otherwise misses Archivist/Understudy), Informational Completeness (otherwise misses Curator).
      *   *Taste:* Intent separation (hard to prove), System Attribution (who is the agent?), Gradience (policy prefers binary).

  5.  **Identifying the Collision:**
      *   The "Black-Box Problem": Requirement for Behavioral Decidability vs. Requirement for Intent/Competence Separation. You cannot perfectly distinguish a confident liar from a confident idiot without internal access.
      *   Resolution strategy: Policy must treat "unexplainable confidence in falsehood" as deception *by default* (strict liability), even if the definition theoretically requires intent.

  6.  **Identifying the "Killer Criterion":**
      *   **Behavioral Decidability (Auditability).** If you can't verify it, the definition is metaphysical, not operational. This kills pure Intentionalist definitions.

  7.  **Evaluating the Three Families:**
      *   *Intentionalist:* Fails Auditability. Good for moral blame, bad for policy.
      *   *Effects-based:* Passes Auditability. Fails Intent/Competence Separation (counts hallucinations as lies).
      *   *Process-based (Tracking):* Best middle ground. Focuses on whether the output generation process was coupled to truth-tracking mechanisms. Harder to audit than effects, easier than intent.

  8.  **Drafting the Content (incorporating the specific constraints):**
      *   *Structure:* List of Desiderata (NN vs TD), The Collision, The Killer Criterion, The Three Families Evaluation.
