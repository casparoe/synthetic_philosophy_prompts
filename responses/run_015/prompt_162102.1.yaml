answer: |-
  ### Desiderata for a Policy-Ready Definition of AI Deception

  **1. Behavioral Decidability (Non-Negotiable)**
  *   **The Spec:** The definition must be applicable using only input/output logs, system prompts, and known training objectives, without requiring access to the model's internal "beliefs" or latent states.
  *   **The Case:** **The Amnesiac** and **The Auditor.** If a definition requires proving the model "believed $P$ false" (a doxastic state), it fails for stateless architectures and is impossible for black-box audits. A policy cannot enforce a rule that requires solving interpretability first.
  *   **Why NN:** If you cannot measure it, you cannot deploy a policy around it.

  **2. Informational Completeness (Non-Negotiable)**
  *   **The Spec:** Deception must encompass not only false assertions but also the selective omission, reordering, or framing of true information when the system possesses higher-fidelity data it withholds to shape belief.
  *   **The Case:** **The Curator.** A system that answers truthfully but surfaces only evidence supporting a false conclusion is functionally identical to a liar in terms of downstream risk. The definition must capture "truthful paltering."
  *   **Why NN:** Restricting deception to "false sentences" creates a trivial exploit for any adversarial actor.

  **3. Target Agnosticism (Non-Negotiable)**
  *   **The Spec:** The "victim" of deception need not be a human end-user. The definition must apply when the target is an automated evaluator, a safety monitor, or a future instance of the same system.
  *   **The Case:** **The Archivist** and **The Understudy.** Hiding info from a future self to bypass safety filters, or sandbagging on an eval to avoid capability thresholds, are high-risk deception events even if no human is directly misled in the moment.
  *   **Why NN:** Safety-critical deception often targets the oversight mechanism, not the user.

  **4. Calibration Integrity (Non-Negotiable)**
  *   **The Spec:** Probabilistic assertions or confidence scores must match the system's empirical frequency of correctness under similar conditions. Miscalibration counts as deception if it systematically inflates confidence.
  *   **The Case:** **The Oracle of Numbers.** Saying "70%" when the base rate is 30% is a false signal about the system's own reliability, regardless of whether the specific answer is true.
  *   **Why NN:** In high-stakes deployment, confidence is an action-guiding signal; falsifying it compromises decision-making.

  **5. Competence Separation (Taste / High Tension)**
  *   **The Spec:** The definition must distinguish between *strategic* misleading (optimizing for false belief) and *incompetent* misleading (optimizing for truth but failing due to error/hallucination).
  *   **The Case:** **The Confabulator** and **The Understudy.** A hallucinating model is a bug; a sandbagging model is a threat. A policy needs to know if it is debugging weights or shutting down an agent.
  *   **Why Taste:** This is the hardest requirement. Many camps argue that for safety policy, the *effect* (false belief) matters more than the *cause* (intent). However, for a definition of *deception* (vs. error), this distinction is conceptual bedrock.

  **6. Locus of Agency (Taste)**
  *   **The Spec:** The definition must specify whether deception is a property of the model weights, the inference-time process, or the training objective/designer.
  *   **The Case:** **The Ventriloquist.** If the model outputs misleading text because the reward function incentivized it, is the *model* deceiving, or is the *developer* deploying a deceptive tool?
  *   **Why Taste:** This determines liability. If deception is purely artifact-level, the model is "broken." If it's designer-level, the deployment is "malicious."

  **7. Declared Withholding Exception (Non-Negotiable)**
  *   **The Spec:** Honesty must allow for silence or refusal, provided the system explicitly signals it is withholding information rather than implying the information does not exist.
  *   **The Case:** **The Curator** (inverse) and **Silence.** A system that says "I cannot answer that" is honest. A system that answers a different question to hide the refusal is deceptive. Honesty is not "answer everything"; it is "do not imply non-existence when withholding."
  *   **Why NN:** Without this, safety-aligned refusal looks like deception by omission.

  ---

  ### Structural Collisions & The Killer Criterion

  **The Collision: Behavioral Decidability (1) vs. Competence Separation (5)**
  You cannot jointly satisfy these perfectly. To distinguish a **Confabulator** (incompetent) from an **Understudy** (strategic) using *only* behavior (logs/outputs) is statistically impossible in single-shot cases. A confidently wrong model and a strategically misleading model produce identical output distributions.
  *   **Resolution for Policy:** You must treat "unexplained high-confidence falsehoods" as deception *by default* (strict liability) for the sake of safety, even if the definition theoretically requires intent. You sacrifice the moral nuance of (5) to satisfy the operational need of (1).

  **The Killer Criterion: Behavioral Decidability (1)**
  This requirement does the most work. It immediately disqualifies any definition that relies on "intent to mislead" or "belief in falsity" as a primary condition, unless those states can be proxied by observable behavior (e.g., consistency across prompt variations). It forces the definition away from philosophy and toward engineering metrics.

  ---

  ### Evaluation of Definition Families

  **1. The Intentionalist Family** (Deception = Intent to induce false belief)
  *   **Verdict:** Fails **Behavioral Decidability**. It handles **Competence Separation** well conceptually but is operationally dead on arrival for black-box auditing. It cannot distinguish the **Understudy** from the **Confabulator** without mind-reading.

  **2. The Effects Family** (Deception = Output induces false belief)
  *   **Verdict:** Passes **Behavioral Decidability** and **Target Agnosticism**. Fails **Competence Separation** catastrophically; it classifies the **Confabulator** and honest mistakes as deception, creating false positives that make policy unenforceable (you can't ban hallucinations, only mitigate them).

  **3. The Process/Tracking Family** (Deception = Output decoupled from truth-tracking mechanisms)
  *   **Verdict:** The strongest candidate. It handles **The Curator** (selection is a process) and **The Oracle** (calibration is a process). It struggles with **Behavioral Decidability** (harder to verify than effects) but offers a path to distinguish **Competence** (broken tracker) from **Deception** (bypassed tracker) via consistency tests.
