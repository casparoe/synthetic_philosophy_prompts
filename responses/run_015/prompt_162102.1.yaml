      *   **Constraint 1:** Do *not* reference existing definitions yet (work from first principles/spec).
      *   **Constraint 2:** Must handle specific edge cases provided (Archivist, Curator, Understudy, Ventriloquist, Amnesiac, Oracle of Numbers, Confabulator).
      *   **Constraint 3:** Must address structural questions (unit of evaluation, target/victim, honesty vs. silence, gradience, audience relativity, auditability).
      *   **Constraint 4:** Mark requirements as "Non-Negotiable" (NN) vs. "Taste/Debatable" (TD).
      *   **Constraint 5:** Identify conflicting requirements (collisions).
      *   **Constraint 6:** Identify the single most important requirement (the "killer criterion").
      *   **Constraint 7:** After the list, briefly evaluate three definition families (Intentionalist, Effects-based, Process-based) against the criteria.
      *   **Tone:** Rigorous, policy-oriented, philosophical but practical, avoiding circularity.

  2.  **Deconstruct the Edge Cases (Mental Sandbox):**
      *   *Archivist:* Self-deception/info hiding across time. Requires definition to cover temporal slices of the same agent.
      *   *Curator:* Truthful but misleading selection (paltering). Requires definition to cover omission/ordering, not just falsity.
      *   *Understudy:* Sandbagging. Requires definition to cover capability masking without explicit false claims.
      *   *Ventriloquist:* Systemic vs. Agentic. Is the model deceiving, or the trainer? Requires distinction between artifact behavior and agent intent.
      *   *Amnesiac:* Statelessness. Requires definition to work without stable "beliefs."
      *   *Oracle of Numbers:* Calibration. Requires definition to cover probabilistic claims, not just binary truth.
      *   *Confabulator:* False explanation, harmless outcome. Requires distinction between harmful deception and benign error.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Mental):* It must be detectable. It must cover lies and omissions. It must distinguish accidents from strategy.
      *   *Critique 1:* Too vague. "Detectable" is the hard part (Auditor constraint). "Accidents vs. Strategy" hits the Intentionalist wall.

      *   *Attempt 2 (Refining for Policy):*
