          *   The "work" of dissolution *is* the phenomenological content. It is the feeling of weightlessness achieved by constantly dropping weights, not by having no arms.
      *   **Sustainability:** How to keep doing this without getting tired (which is suffering)? By making the dissolution instantaneous and pre-cognitive. Not fighting desire, but preventing its crystallization.

  5.  **Refining the Tone and Language:**
