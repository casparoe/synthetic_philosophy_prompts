answer: |-
  You have stumbled onto one of the most famous problems in formal epistemology, known as the **Problem of Logical Omniscience**.

  Your friend is arguing for a principle called **Epistemic Closure** (specifically, closure under known implication). In formal logic, if an agent knows $P$ and knows $P \implies Q$, the model assumes they automatically know $Q$. This is necessary for logic systems to work cleanly, but as you've intuitively sensed, it is a terrible model for human beings. If closure were strictly true, anyone who understood the axioms of arithmetic would instantly know the answer to every unsolved math problem, because the answer is logically contained in the axioms.

  Your gut verdicts are actually more philosophically robust than your friend's claim. You are intuitively arguing for a **Bounded Rationality** or **Feasible Access** account of knowledge.

  Here is the principle that unifies your five verdicts, explains why your friend's view fails for humans, and predicts the outcomes of your two new cases.

  ### The Unifying Principle: Feasible Derivability

  **Principle:** *S knows that Q only if S possesses a justification for Q that is feasibly derivable from S's existing knowledge within S's current cognitive resources.*

  This principle distinguishes between **information availability** (the data is there) and **epistemic possession** (you have processed the data into a usable belief). It treats knowledge not as a static state of containing truth, but as a capacity to access truth without prohibitive cost.

  Here is how **Feasible Derivability** handles your five cases:

  1.  **Ana (Multiples of 6):** The derivation is one step. The cognitive cost is negligible. The justification is **feasibly accessible**.
      *   *Verdict:* **Knows.** (Matches your intuition.)
  2.  **The 30-Step Puzzle:** The derivation exists, but the cognitive cost exceeds the threshold of "feasible" without actually doing the work. Until she walks the steps, the justification is not *accessed*.
      *   *Verdict:* **Doesn't know.** (Matches your intuition.)
  3.  **Ben (Chess):** This is the nuance case. Ben has *dispositional* knowledge (he has the capacity to see it instantly) but not *occurrent* knowledge (he isn't currently seeing it). You feel he is "unreasonable to deny" because in a social context, we attribute knowledge based on *capacity*. However, strictly speaking, until he sees the mate, he cannot act on it.
      *   *Verdict:* **Doesn't know (occurrently), but has the capacity.** (Refines your intuition.)
  4.  **Cara (Decryption):** Having the key is having the *potential* for knowledge. Running the algorithm is the derivation. Until the algorithm runs, the conclusion is not derived.
      *   *Verdict:* **Doesn't know.** (Matches your intuition.)
  5.  **Dev vs. Eve (Calculation):** Dev has a feasible derivation (the mental math). Eve has no derivation (luck). Knowledge requires a valid chain of access, not just a true endpoint.
      *   *Verdict:* **Dev knows, Eve doesn't.** (Matches your intuition.)

  ### Is this "Ad Hoc"?

  You worried that drawing a line at "30 steps" or "pressing enter" feels arbitrary. In computer science and cognitive science, it is not. It is a matter of **computational complexity**.

  *   **Your Friend's View:** Assumes human brains are Turing Machines with infinite time and memory.
  *   **Your View:** Assumes human brains are finite automata with limited RAM and processing speed.

  The "budget of steps" isn't set by how much the question *matters* (pragmatism); it's set by **cognitive friction**. If the friction is low (Case 1), we count it as knowledge. If the friction is high (Case 2, 4), we require the work to be done. This is why your verdicts aren't ad hoc; they track the *cost of access*.

  ### Which Verdict Must You Drop?

  If you adopt **Feasible Derivability**, you actually get to keep all five of your verdicts! However, you must refine **Case 3 (Chess)**.

  You said Ben "doesn't know" but would be "unreasonable to say I don't." Feasible Derivability explains this tension:
  *   **Strictly:** He doesn't know (the derivation isn't currently in his working memory).
  *   **Socially:** We attribute knowledge to him because the *marginal cost* to derive it is near-zero for him.

  You don't have to drop the verdict, but you must acknowledge that "knowledge" is sometimes used to describe *capacity* rather than *current state*.

  ### Predictions for Your New Cases

  Here is what Feasible Derivability predicts for the two scenarios you haven't settled:

  **Case A: The Contradictory Classmate**
  *Scenario:* A classmate gives the right consequence when asked but contradicts himself when the question is reworded.
  *   *Analysis:* If their grasp of the logic is fragile enough that a rewording breaks the connection, the derivation is not **stable**. Feasible access requires that the justification be robust enough to survive minor perturbations in presentation. If they contradict themselves, they are likely recognizing patterns linguistically rather than deriving the logic mathematically.
  *   *Prediction:* **They do not know.** They have a true belief based on heuristics, not a feasible derivation based on understanding.

  **Case B: The Disjunction ($P$ or $Q$)**
  *Scenario:* Someone knows that $P$ is true. Are they asked whether "$P$ or some unrelated $Q$" is true?
  *   *Analysis:* In formal logic, the rule of **Addition** states that from $P$, one can infer $P \lor Q$ in a single step. The cognitive cost of adding "or $Q$" is negligible. Even if $Q$ is unrelated, the logical operation to get there is trivial.
  *   *Prediction:* **They know.** Unlike the 30-step puzzle, this derivation is immediate. Even though $Q$ is unrelated, the truth of the disjunction is feasibly derivable from $P$ alone. (Note: While they *know* it is true, asserting it might be conversationally misleading, but that is a matter of pragmatics, not epistemology).

  ### Summary for Your Argument

  Tell your friend this:
  > "You are treating knowledge like a **library**. If the book is in the building, you 'have' the book. I am treating knowledge like a **download**. Until the data is processed into my local memory (my brain), I can't use it. Since we are humans, not gods, the cost of processing matters. If the derivation is too complex to run without actually doing it, I don't know the conclusion yet."

  Your intuitions are correct. The principle is **Accessible Justification**. You know what you can reach, not just what is theoretically connected.
