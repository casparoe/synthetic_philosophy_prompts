  (i) **Explanatory Credit:** Options include marginal/ablation credit (performance drop upon removal), counterfactual necessity (would it occur without?), historical dependence (phylogenetic/ontogenetic sequence), information-theoretic contribution (bits processed), or variance explained across individuals. I will adopt **marginal credit under ablation from the top down**, as requested, because it isolates the specific value-added by each layer given the substrate is intact, which is most useful for decomposing high-level capacities.

  (ii) **Nested Taxonomy & Double-Counting:** A strictly nested taxonomy means higher floors presuppose lower ones; you cannot have a Gregorian mind without a Darwinian substrate. Naive percentage shares double-count if treated as independent modules (e.g., summing variance explained by genetics and variance explained by culture often exceeds 100% because they interact). By using top-down ablation, I assign credit only to the *marginal gain* provided by the layer, ensuring the sum equals 1.00, but this implies the lower floors are credited only for what remains after higher functions are stripped.

