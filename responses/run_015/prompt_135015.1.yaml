ntinuous visual experiences. My verdict is that phenomenal consciousness was present throughout, sustained by local recurrence alone without any need for global workspace broadcasting. Case 5: A subject is exposed to a subliminal emotional face that triggers a measurable autonomic reaction and fleeting subcortical response, but produces no behavioral adaptation, no verbal report, and no working-memory integration. My verdict is that this involves pure subcortical processing, with neither phenomenal nor access consciousness present.

