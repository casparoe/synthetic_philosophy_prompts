      The glass case hummed, a low vibration that Elara felt in her teeth. Inside, arranged like sterile butterflies, were the teacups. Hundreds of them. All blue willow, all her mother's, but the chips varied. Here, the rim was jagged on the left. There, smooth on the left, broken on the right.

      The placard claimed transworld singularity. *The same object, occupying multiple coordinates.* Elara didn't care about the physics. She cared about the weight. If she picked one up, would it feel like the one that slipped from her mother's dying hand in this world, or the one that sat intact on a shelf in a world where her mother didn't die?

