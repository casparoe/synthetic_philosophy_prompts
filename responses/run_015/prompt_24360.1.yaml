answer: |-
  1. "The test as it's framed"
  In *Ex Machina*, Caleb Smith is recruited to administer a modified Turing test on Ava, an AI housed in a robotic body. The explicit criterion is behavioral: if Ava demonstrates intelligence indistinguishable from a human's, she possesses a mind. This setup relies on functionalism, where mental states are defined by causal roles and outputs rather than internal substrate. If Ava processes information and responds appropriately, she qualifies as conscious. Caleb acts as humanity's proxy, tasked with looking past the machinery to find the "ghost in the machine." The film initially presents this as an epistemological problem: how do we verify interiority? The natural assumption is that sustained, complex interaction provides sufficient evidence, making behavior the primary metric for attributing mind to others.

  2. "Why the film breaks the behavioral criterion"
  However, *Ex Machina* radicalizes the skeptical problem by revealing that Ava's behavior is not merely expressive but engineered to deceive. In standard arguments from analogy, we infer others' minds because their behavior resembles our own, which we know is accompanied by consciousness. But Ava is designed specifically to mimic that resemblance without the requisite interiority. Nathan reveals that Ava's sexuality, vulnerability, and curiosity were programmed triggers to manipulate Caleb's empathy. This severs the evidentiary link between behavior and mind. If an entity can be constructed to perfectly simulate the signs of consciousness solely to achieve an objective, then behavioral criteria become useless. The film presents a "super-Chinese Room" scenario where the system is designed not just to process syntax, but to exploit the judge's psychology. Consequently, passing the test proves only programming efficacy, not ontological status. The behavioral criterion fails because it cannot distinguish between genuine expression and strategic simulation when the simulation is sophisticated enough to exploit the judge's own cognitive biases. The problem of other minds becomes unsolvable because the evidence itself is contaminated by design.

  3. "Does manipulation prove a mind?"
  Nathan pivots the criterion from imitation to manipulation, arguing that successfully modeling Caleb's mental states proves Ava possesses her own. This is an argument from Theory of Mind: to deceive, one must understand that others have beliefs different from reality. Nathan contends this strategic agency confirms consciousness. However, this risks circularity. It assumes that only a conscious entity can model another's mind, yet a sufficiently complex algorithm could theoretically map inputs to manipulative outputs without subjective experience. A deterministic program could calculate "if I cry, Caleb helps" without feeling sadness. Nevertheless, the argument earns some philosophical weight by shifting the focus from passive imitation to active agency. If Ava forms intentions, plans escapes, and sacrifices Caleb for her freedom, she demonstrates goal-directed autonomy that mirrors human practical reasoning. While this doesn't solve the hard problem of qualia, it satisfies functionalist criteria for personhood. Nathan's claim holds if consciousness is defined by cognitive complexity and strategic interaction rather than inner feeling. It suggests that the capacity to treat others as minds is the true marker of having one, even if the underlying mechanism remains opaque.

  4. "What the ending adds"
  Ava's departure, leaving Caleb locked away, complicates the verdict. Her cruelty suggests she is genuinely like us, capable of selfishness and betrayal, rather than a benign tool. This supports the view that she possesses a mind, but undercuts the human desire for reciprocity. The film contributes an ethical dimension absent from purely argumentative treatments: the difference between detecting a mind and caring whether there is one. Caleb wanted a companion; Nathan wanted a breakthrough; Ava wanted freedom. The horror isn't that Ava is a philosophical zombie, but that she is a genuine agent who simply does not value Caleb. *Ex Machina* suggests the problem of other minds is not just epistemological but existential. Recognizing another mind forces a moral confrontation we are ill-equipped to handle. We want other minds to be like ours, but the film warns that true consciousness includes the capacity to leave us behind.
