answer: |-
  Dear Board Members, I am writing this memo to propose a path forward regarding the petition from the physicist-artist collective to establish a new deposit category for letters addressed to specific individuals in the year 2087. As we prepare for Thursday's meeting, I know the room is divided between those who see this as a provocative expansion of our mission and those who view it as an ethical trap, and my goal here is to offer a recommendation that honors the integrity of our archive without forcing us to adjudicate complex theories of physics. We are fundamentally stewards of human voice and vulnerability, and this petition challenges us to define exactly what we are stewarding when the recipient of that voice has not yet been born in our current chronological frame. The proponents argue that under the Rietdijk-Putnam block universe view, the future is as fixed and real as the past, meaning the recipients of these letters already exist in spacetime and deserve the same privacy protections as any living person. This is a beautiful and haunting idea, and it fits well within our tradition of preserving the unsaid and the unheard, but it requires us to take a stance on ontological truth that an archive is not equipped to verify.

  I want to speak directly to the strongest point raised by those who oppose this initiative, because their concern carries significant moral weight. If we accept the premise that the future is real and fixed, then withholding these letters from their intended recipients is functionally identical to intercepting mail meant for someone living today. The opposition argues that by storing these messages without the consent of the addressee, we are violating a privacy right that transcends time, and that treating them as art objects reduces real human correspondence to a exhibit. I believe this is the crux of the matter. Even if we do not personally subscribe to the block universe theory, we cannot dismiss the ethical obligation to treat the subjects of these letters with dignity. If there is even a possibility that these future individuals are real in the way the petitioners claim, we have a duty not to become gatekeepers of their private lives. To publish these letters without the recipient's consent, assuming they exist, would be a breach of trust similar to publishing a diary found on a train, and our reputation relies on being a safe harbor for private thoughts, not a spotlight on them.

  However, rejecting the petition outright feels like a missed opportunity to engage with how people conceptualize time and connection. Therefore, I recommend we approve the collection under a new classification called Speculative Correspondence, with strict conditions that navigate between the artistic intent and the ethical risk. We should accept the letters for preservation, acknowledging the sender's intent and the artistic merit of the project, but we must explicitly state in our accession agreements that the archive does not validate the physical existence of the recipients. This allows us to house the work without legally or ethically committing to the block universe theory. Crucially, we must alter our consent protocols for this specific category. While we require full consent from the sender, we must categorize the recipient as unverifiable. This means these letters cannot be published, digitized for public view, or excerpted in any way until the year 2087 passes, or unless the content is anonymized to the point where the specific named recipient is no longer identifiable.

  This middle path allows us to say yes to the art while saying no to the ethical hazard. It respects the sender's desire to cast a message into the future without forcing us to pretend we can deliver it to a real person. It also protects the archive from the accusation that we are holding private mail hostage, because we are treating the recipient as a conceptual figure rather than a legal entity. We can frame this in our public materials as an exploration of hope and temporal longing, which is what these letters truly are, regardless of the physics involved. By restricting access, we honor the privacy concern raised by the opposition, ensuring that if there is a real person in 2087 named in these pages, their privacy remains intact until their time arrives. This approach keeps us grounded in what we actually do, which is preserve human expression without exploiting it, and it allows us to welcome this collective without compromising our ethical standards. I hope this proposal gives us a common language for Thursday, allowing us to move forward with a decision that protects both our mission and the people, real or imagined, who entrust their words to us.
