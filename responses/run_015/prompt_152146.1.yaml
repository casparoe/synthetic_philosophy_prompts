answer: |-
  Dear colleague, I have been turning over our reading group's struggles with pragmatism for the last few days, and I share your suspicion that we have been talking past each other rather than engaging with a substantive disagreement, so I took the liberty of drafting what a genuine adversarial collaboration between a committed Peircean and a committed Jamesian might look like if they were forced to produce a joint statement. The goal here was to isolate the claims both could sign without feeling betrayed, followed by the precise points of divergence formulated in language each side would accept as a steel-manned version of their own view, and then to move into the specific cases that stalled our discussions, treating them as test beds for their theoretical commitments. What follows is my attempt to render that document in prose, capturing the texture of their agreement and the sharpness of their split, along with my own assessment of where the philosophical live wires actually are.

  Both parties begin by signing onto a rejection of the static correspondence theory of truth, agreeing that truth cannot be a inert relation between a proposition and a reality wholly inaccessible to experience, and they further agree that truth is inextricably linked to the practical consequences of holding a belief, meaning that a belief that makes no difference to action or expectation is empty. They concur that inquiry is a normative activity aimed at settling doubt and that truth is somehow tied to the success of this process, rejecting skepticism about the possibility of knowledge while acknowledging that any particular belief is fallible. They also agree that the value of a belief is not merely internal coherence but involves a relationship with the world that constrains what we can successfully assert, so neither side is advocating for a free-for-all where anything goes. This common ground establishes that both are pragmatists in the broad sense that meaning and truth are tied to practice, but it is precisely within the specification of that tie that the collaboration fractures.

  The divergence begins when they attempt to define the locus of truth, where the Peircean insists that truth is the opinion fated to be ultimately agreed to by all who investigate, representing an ideal limit of inquiry that exists independently of what any finite community actually concludes, whereas the Jamesian insists that truth is made in the process of verification and is a property of ideas that prove themselves to be good in the way of belief for the concrete experiencer. For the Peircean, truth is a regulative ideal that governs inquiry even when the end is unreachable, grounded in a realist commitment that there is a fact of the matter that constrains investigation, while for the Jamesian, truth is indexed to the specific needs and experiences of the believer, such that if a belief works satisfactorily in guiding life, it is true in the only sense that matters for human purposes. This means the Peircean views truth as something discovered over the long run by a community, while the Jamesian views truth as something that happens to an idea in the present tense of an individual's experience.

  When we apply these definitions to the sealed storeroom case, where a warehouse burned down with all records and witnesses gone, the Peircean predicts that there is a definite truth of the matter regarding the number of oil jars because reality exists independently of our ability to know it, and the ideal limit of inquiry would converge on this fact even if actual inquiry has stopped, whereas the Jamesian predicts that there is no truth value to assign because the question lacks cash value and no possible experience could ever verify the difference, making the distinction meaningless. In the case of the useful falsehood, where a belief is false but reliably pays better for the holder who will never find out, the Peircean predicts the belief is false because it does not align with the reality that would be uncovered by indefinite inquiry, distinguishing sharply between truth and utility, while the Jamesian predicts the belief is true for that person because it fulfills the function of truth by guiding them successfully through experience without friction. Regarding branching inquiry, where two communities settle into different stable opinions without contact, the Peircean predicts that at least one must be wrong because reality is singular and would force convergence if the communities ever interacted in the ideal limit, whereas the Jamesian predicts that both opinions can be true relative to their respective streams of experience and practical needs. Finally, on the hard stop inquiry case where evidence gathering ceases permanently, the Peircean maintains that the truth is what would have been agreed upon had inquiry continued, preserving the counterfactual ideal, while the Jamesian maintains that truth is settled at the moment inquiry stops because truth is nothing over and above the verified workability of the belief at that time.

  The cruxes that drive these predictions center on whether the end-of-inquiry opinion is offered as a description of where inquiry is heading or only as a regulative ideal, whether expedience is indexed to an individual believer or to some community across the long run, and whether they are even theorizing the same property. On the first crux, the Peircean treats the limit as a regulative ideal necessary to make sense of the normativity of inquiry, while the Jamesian treats it as an unnecessary metaphysical posit that distracts from the lived reality of verification. On the second crux, the Peircean insists that individual expedience is insufficient because individuals can be self-deceived or lucky, requiring the correction of the community over time, while the Jamesian argues that the community is an abstraction and only the individual actually experiences the workability of belief. On the third crux, it appears highly likely that the dispute is merely verbal to a significant degree, because the Peircean is defining truth as the ideal outcome of inquiry while the Jamesian is defining truth as the warrant for assertion in the present, meaning the Peircean is giving an account of truth while the Jamesian is giving an account of what makes a belief all right to hold. If this diagnosis is correct, the Peircean would accept the Jamesian claims as describing assertibility rather than truth, and the Jamesian would accept the Peircean claims as describing a metaphysical hope rather than a usable tool, but neither would concede that the other is using the word truth correctly.

  I am about seventy percent confident that an actual convinced Peircean and an actual convinced Jamesian would both put their names to what I have drafted above, primarily because I have tried to adhere to their primary texts rather than secondary caricatures, but I recognize that the heat of their historical disagreement might make signing any joint document psychologically difficult for them. The one sentence I am least sure about, the one I would expect at least one side to balk at, is the claim in the divergence section that for the Jamesian, truth is something that happens to an idea in the present tense of an individual's experience, because a sophisticated Jamesian might argue that truth also has a social dimension and is not purely individual, even if it is not as communal as Peirce requires. It is worth remembering in this context that Peirce renamed his own view pragmaticism largely because he was fed up with what James had done with the word, which suggests that even if they could agree on the substance of the cases, they might still fight over the label, yet I hope this document shows that the friction was productive rather than merely destructive.
