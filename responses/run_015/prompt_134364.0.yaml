answer: |-
  The slogan your interlocutor used is a colloquial summary of the **Independence Axiom** (central to von Neumann-Morgenstern and Savage expected utility theory). In formal terms, it states: if you prefer gamble $A$ to gamble $B$, then you must prefer a mixture of $A$ and some common gamble $C$ to a mixture of $B$ and that same $C$.

  Your interlocutor treated this as a self-evident logical truth to shut down your empirical observation. To unpack this, we need to separate the slogan into three distinct layers of claim. Only one of them is doing the heavy lifting, and that is the one your intuition about salience correctly targets.

  ### 1. The Three Theses Hidden in the Slogan

  **Thesis A: Normative Consistency (The "Money Pump" Defense)**
  *   **Claim:** If your preferences flip when a common consequence is added, you are dynamically inconsistent. You could be turned into a "money pump," paying to switch from $A$ to $B$, then paying to switch back when the common consequence is revealed or removed.
  *   **Status:** *Substantive, but defensive.* This is not a description of how humans think; it is a definition of a specific type of instrumental rationality. It argues that violating the axiom makes you exploitable. However, it assumes you face repeated, sequential choices where the "common consequence" can be isolated and traded. In a one-shot Allais problem, this threat is theoretical, not physical.
  *   **Does it address salience?** No. It sidesteps the psychology by declaring that if salience causes a flip, your preferences are "irrational" by definition, regardless of the mental mechanism.

  **Thesis B: Linearity in Probabilities (The Mathematical Engine)**
  *   **Claim:** The value of a gamble is the weighted sum of the values of its outcomes. Mathematically, $V(pA + (1-p)C) = pV(A) + (1-p)V(C)$.
  *   **Status:** *Substantive and restrictive.* This is the actual workhorse. It forces the utility function to be linear in probability. This is what allows the "cancellation." If $C$ is added to both $A$ and $B$ with weight $p$, the term $pV(C)$ appears on both sides of the inequality and algebraically cancels out.
  *   **Does it address salience?** No, it forbids it. Linearity assumes the value of outcome $A$ is independent of the probability weight attached to outcome $C$. Your observation—that the *nature* of the shared risk (89% of \$1M vs. 89% of \$0) changes the value of the remaining risk—is a direct violation of linearity.

  **Thesis C: Psychological Neutrality (The Empirical Assertion)**
  *   **Claim:** The context provided by the common consequence $C$ does not alter the relative valuation of $A$ versus $B$. The "mixture" is a neutral background, like adding water to two different chemical solutions without changing their pH relative to each other.
  *   **Status:** *Empirically False, but treated as Trivial.* This is the sleight of hand. The slogan sounds like a logical tautology ("adding the same thing to both sides"), but in decision theory, "adding" a probability branch is not like adding a constant to a physical equation. It changes the *structure* of the risk.
  *   **Does it address salience?** This is exactly where your worry lives. You are observing that $C$ is not neutral. An 89% chance of \$1M creates a "floor" of security (certainty effect). An 89% chance of \$0 creates a floor of ruin. These are not neutral backgrounds; they interact with the remaining probabilities.

  ### 2. Trivial vs. Doing Work

  Your interlocutor presented the slogan as **Trivial** (Thesis C: "Of course adding the same thing doesn't change the difference").

  In reality, **Thesis B (Linearity)** is doing all the work.

  In physics, if you have two systems and apply the same external field to both, their *relative* dynamics might remain unchanged if the coupling is linear. But if the systems are non-linear (e.g., threshold effects, phase transitions), the background field changes the internal state.
  *   **The Slogan assumes:** Decision weights are linear (superposition holds).
  *   **Your Objection:** Decision weights are non-linear (the "security" of the 89% branch interacts with the 10% branch).

  The interlocutor's move was to conflate **Normative Consistency** (which sounds like a rule of logic) with **Psychological Neutrality** (which is an empirical claim about cognition). By saying "your preference shouldn't flip," they are asserting that the *model* of rationality forbids the flip, not that the *phenomenon* prevents it. They are defining away your data point.

  ### 3. Which Version Addresses Your Worry?

  None of the standard defenses of the Independence Axiom address your worry; they are designed to override it. Your worry is that **salience breaks the cancellation**.

  *   **Why cancellation fails:** In the Common Consequence Allais pair, you strip away the 89% chance of \$1M. The axiom says the remaining 11% should be valued identically to the remaining 11% in the pair where the common consequence was 89% of \$0.
  *   **The Physics Analogy:** Imagine measuring the acceleration of two masses. In Trial 1, they are on a stable table (89% \$1M). In Trial 2, they are on a crumbling floor (89% \$0). The interlocutor says, "The table/floor is common to both masses in each trial, so ignore it; just compare the masses." You are saying, "The stability of the surface changes the friction coefficient for the masses."
  *   **The Precise Thesis Violated:** You are rejecting **Separability**. Separability requires that the utility of a branch depends only on that branch's outcome and probability, not on the other branches in the lottery tree.

  ### Summary for Your Reply

  If you engage further, you can pinpoint the category error:

  1.  **Acknowledge the Normative:** "I agree that if we *define* rationality as Expected Utility, the axiom must hold to prevent dynamic inconsistency."
  2.  **Challenge the Empirical:** "However, the slogan 'mixing the same thing' treats probabilities as linear containers. It assumes the 89% branch is a neutral constant."
  3.  **State the Violation:** "My point is that the common consequence is not a constant; it is a **context**. It changes the risk posture toward the remaining probability mass. The 89% safety net in the first pair makes the 1% risk of zero tolerable. The 89% risk of zero in the second pair makes the 10% chance of 5M the only hope. The 'common' term interacts with the 'unique' term."
  4.  **Conclusion:** "The slogan works only if you assume Separability is true. But Salience is evidence that Separability is false. You are using the axiom to prove the axiom, while I am pointing out the physical (psychological) mechanism that breaks the linearity."

  The interlocutor was using a **normative definition** to silence an **empirical observation**. In lab physics, if your data violates the model, you check the model. In rational choice philosophy, they often check the data (or label it "irrational"). Your intuition that the shared outcome isn't neutral is the exact insight that led to Prospect Theory (weighting functions) and Regret Theory, which drop the Independence Axiom specifically to account for the interaction you noticed.
