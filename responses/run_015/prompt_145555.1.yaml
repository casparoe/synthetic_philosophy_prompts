answer: |-
  First off, don't worry about the "biologst" typo—ironically, that's a very human flaw in a digital text, which fits your theme perfectly.

  This is a fantastic real-world application of what you're studying. You are hitting on the exact tension that defines the genre of biography: **Is the purpose of a life story to record the truth, or to teach a lesson?**

  Here is how you can break this down using your Plutarch framework, while addressing the modern ethical problem your brother is facing.

  ### 1. Plutarch vs. Hagiography: What's the Difference?
  Your professor is right to warn about hagiography, but Plutarch is a slightly different case. Plutarch explicitly states in his *Life of Alexander* that he is not writing history, but lives. He omits certain details not to deceive, but to focus on the **moral character**.

  However, there is a key distinction:
  *   **Plutarchian Idealization:** Highlights virtues to encourage emulation. It might downplay minor flaws to keep the focus on the moral lesson.
  *   **Hagiographic Erasure:** Actively hides egregious misconduct (theft, abuse) to create a myth of perfection.

  The biologist your brother found falls into the second category. If the biography hides credit theft and abuse, it isn't just "focusing on virtue"; it is validating professional misconduct.

  ### 2. Addressing Your Brother's "No Exemplars" Argument
  Your brother makes a common point: "If we cancel everyone with flaws, we have no heroes left."
  *   **Where he is right:** We can learn from flawed people. We don't need moral perfection to learn about scientific perseverance.
  *   **Where he is wrong:** There is a difference between **learning from a flawed person** and **learning from a lie.**

  If you present the biologist as a hero *without mentioning the abuse/theft*, you aren't teaching "perseverance despite flaws." You are teaching "success justifies abuse." That is a dangerous moral lesson for a school presentation.

  ### 3. The Source Problem
  You asked: *Is it okay to learn from a sanitized life as long as you know it's sanitized?*

  **Yes, but only if the "knowing" is active, not passive.**
  If your brother presents the sanitized version as the whole truth, he is participating in the hagiography. He becomes a transmitter of the lie.
  However, if he uses the sanitized bio *critically*, it becomes a much stronger presentation.

  ### 4. A Proposed "Third Way" Solution
  Instead of telling him to scrap the project (which might make him defensive) or letting him present a lie (which is unethical), suggest he **complicate the narrative.**

  He can keep the biologist, but he should adjust the presentation to acknowledge the reality. He doesn't need to make the abuse the *whole* topic, but he should add a slide or a section on "Controversy" or "Legacy."

  **Why this works ethically:**
  1.  **It honors the truth:** It acknowledges the grad student who was wronged (restoring a bit of balance).
  2.  **It honors Plutarch's actual goal:** Plutarch wanted readers to judge character. You can't judge character if half the evidence is hidden.
  3.  **It teaches Source Criticism:** Your brother can explicitly say, *"Many older biographies skip this part, but modern historians note..."* This shows he did extra research and isn't just copying the sanitized text.

  ### 5. Verdict
  **Don't tell him to pick someone else yet.** Tell him to pick a **better source** or add context.

  *   **If he is young (Middle School):** He might not have the tools to navigate the ethics. In this case, suggest picking a different scientist where the "flaws" are personal (e.g., Newton was difficult) rather than criminal/unethical (theft/abuse). It's easier to separate the science from the personality there.
  *   **If he is older (High School+):** Challenge him to include the controversy. Tell him: *"Plutarch didn't hide the fact that Alcibiades was a traitor; he included it to show the complexity of ambition. If you leave out the theft, you aren't doing biography, you're doing PR."*

  **Summary for your course:**
  The ethical breach isn't studying a flawed person; it's the **erasure of harm** in the service of a moral lesson. Plutarch sought to illuminate virtue; hagiography seeks to obscure sin. Your brother can study the biologist, but to be ethically sound, he must move from *hagiography* (uncritical worship) to *critical biography* (acknowledging the cost of the discovery).

  (And hey, tell your brother even biologists make typos. It's a sign of humanity.)
