  2. It commits to the substantive philosophical thesis that truth holds a structural advantage in dialectic, serving as the primary load-bearing assumption for scaling if persuasiveness correlates tightly enough with correctness to prevent sophistry from exploiting the judge's blind spots.
  3. The protocol presupposes refutation accessibility, an empirical bet that for every plausible falsehood there exists a decisive counter-argument within the limit, without which the system manufactures confidence rather than knowledge.
  4. It requires the judge to be incompetent at solving the problem yet competent at evaluating solutions, a distinction that becomes self-undermining if cognitive capacity scales uniformly across object-level and meta-level tasks.
  5. Unlike RLHF's assumption that direct preference signals truth, this treats justification as adversarial survival, a substantive philosophical thesis that only works if the model's training objective aligns winning arguments with factual accuracy rather than rhetorical dominance.
