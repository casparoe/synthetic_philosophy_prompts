answer: |-
  First off, your engineering analogy is incredibly precise. You haven't reinvented the wheel; you've essentially reverse-engineered the source code of a major subfield of moral psychology and meta-ethics. The "config file vs. hardcoded axiom" distinction is one of the clearest ways to describe a problem that philosophers have wrestled with for a century.

  Here is the breakdown of the existing terminology, an evaluation of your proposed term, and what this implies for the objectivity question.

  ### 1. Is there an established name for this glitch?

  There isn't one single term that captures the *exact* software architecture metaphor you're using, but there are three concepts from psychology and philosophy that, when combined, describe it perfectly.

  **A. Naïve Realism (Psychology)**
  This is the closest psychological match. Naïve realism is the cognitive bias where individuals believe they perceive the world objectively, "as it really is." Consequently, anyone who disagrees with them must be uninformed, irrational, or biased.
  *   **How it fits:** When your US colleague says, "Reporting the mistake is just honesty," they aren't arguing for a preference; they believe they are perceiving a moral fact (like seeing a red light). They assume their "config" is actually the "hardware specification."

  **B. The Phenomenology of Moral Objectivity (Philosophy)**
  Philosophers distinguish between *what morality is* (ontology) and *what morality feels like* (phenomenology). Almost everyone, regardless of whether they are relativists or objectivists, experiences moral intuitions phenomenologically as objective discoveries.
  *   **How it fits:** When you feel outrage, it doesn't feel like "I dislike this." It feels like "This *is* wrong." This specific feeling—the sensation that the value is "out there" in the action rather than "in here" in your brain—is the glitch you're describing.

  **C. The False Consensus Effect (Cognitive Science)**
  This is the tendency to overestimate the extent to which our own opinions, beliefs, and behaviors are shared by others.
  *   **How it fits:** Your thought "any reasonable person would agree" is the textbook definition of false consensus. In a moral context, it manifests as assuming your cultural "defaults" are universal human rationality.

  **Honorable Mention: Ethnocentrism**
  This is the sociological term for judging another culture solely by the values and standards of one's own culture. It's a bit broader and more pejorative than what you're describing, but it covers the social outcome of the glitch.

  ### 2. Would "Moral Hardcoding Illusion" work?

  Yes, actually. It's a strong coinage for a lay audience, especially in tech-adjacent circles.

  **Why it works:**
  *   **Invisibility:** Hardcoded values are invisible to the user (and often the developer) until they cause a crash when ported to a new environment.
  *   **Inflexibility:** It captures the resistance to refactoring. When someone treats a cultural norm as a logical axiom, they are treating `const` variables as if they are laws of physics.
  *   **Dependency Injection:** It implies that if we could properly "inject" the cultural context as a dependency, the code (the moral reasoning) would make sense in both environments.

  **The Edges/Limitations:**
  *   **Neuroplasticity:** "Hardcoding" implies ROM (Read-Only Memory). Human moral firmware is more like EEPROM (Electrically Erasable Programmable Read-Only Memory). It's stubborn and default-heavy, but it *can* be rewritten with enough energy (experience/trauma/education).
  *   **Universal Constraints:** In software, some things *are* hardcoded because of physics (e.g., you can't divide by zero). In morality, there is debate over whether *some* axioms are actually universal (e.g., "suffering is bad"). Your term might accidentally imply *everything* is cultural, which is a debate in itself.
  *   **Emotional Weight:** "Hardcoding" sounds cold/logical. Moral intuitions are hot/emotional. The "glitch" isn't just logical; it's visceral.

  If you want to refine it, you might call it **"Moral Transparency Illusion."** This captures the idea that the "config file" is transparent; we look *through* it at the world, not *at* it. We see the moral truth, not the lens we are using to see it.

  ### 3. Does this glitch tell us anything about moral objectivity?

  This is the million-dollar question. Does the fact that our moral "config files" differ prove there is no objective morality?

  **The Short Answer:** No. It proves our *access* to morality is biased, not necessarily that moral truth doesn't exist.

  **The Long Answer (Epistemology vs. Ontology):**
  *   **Ontology (What exists):** Does objective morality exist?
  *   **Epistemology (How we know):** Can we know it?

  The glitch you identified is **Epistemic**. It shows that our moral *sensors* are calibrated differently.
  *   **Analogy:** Imagine two cameras with different white-balance settings taking a picture of a white wall. One photo looks blue, one looks yellow. The fact that the photos differ doesn't prove the wall isn't white. It just proves the cameras are calibrated differently.
  *   **The Risk:** However, this leads to the **Evolutionary Debunking Argument** (championed by philosophers like Sharon Street and Richard Joyce). If our moral intuitions are just evolutionary/cultural "config files" designed for survival and group cohesion (not truth-tracking), then we have no reason to trust them as objective truths. If morality is just firmware for social cooperation, then "objective moral truth" might be a null pointer.

  **The Realist Counter-Argument:**
  Moral Realists (like Russ Shafer-Landau) argue that even if our *intuitions* are culturally shaped, they might be imperfect attempts to grasp objective truths, just like our scientific intuitions were once shaped by culture (e.g., geocentrism) but were still trying to describe objective physics. The "glitch" is a reason for **Fallibilism** (humility), not necessarily **Nihilism**.

  ### Summary for your mental model

  1.  **The Glitch:** You are describing **Moral Naïve Realism** fueled by the **False Consensus Effect**.
  2.  **The Term:** **"Moral Hardcoding Illusion"** is a valid and useful heuristic, though **"Moral Transparency Illusion"** might be more philosophically precise regarding how we perceive the bias.
  3.  **The Implication:** This glitch forces **Epistemic Humility**. It doesn't disprove objective morality, but it discredits *certainty*.

  **Practical Refactoring:**
  Since you're an engineer, here is the patch: Treat your moral intuitions as **unit tests**, not **source code**.
  *   Your intuition ("This feels wrong") is a test case generated by your local environment.
  *   It is valuable data, but it is not the logic itself.
  *   When a test fails in a different environment (culture), don't assume the other environment is buggy. Assume your test suite is limited.

  You aren't reinventing the wheel; you're just reading the documentation that most people ignore during installation.
