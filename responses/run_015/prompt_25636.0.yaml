      *   *Case 5 (Euthanasia):* I need to make sure I don't just say "it's the same." The law and many ethicists distinguish them based on *causal agency*. I should explain *why* the user feels the squeamishness (active vs. passive).
      *   *Tone:* Supportive, academic but accessible. Encourage them to own their intuitions but test them.

  7.  **Final Structure:**
