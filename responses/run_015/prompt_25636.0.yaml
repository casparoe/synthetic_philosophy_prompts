      *   Proposed Coherent Principle: **The Hierarchy of Duties.** (Negative > Positive, but Positive scales with Proximity/Cost).
      *   Recommendation on what to drop: The "Start vs. Stop" distinction in triage (Case 6).
      *   The Self-Driving Car Application.
