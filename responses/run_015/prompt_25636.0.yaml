  8.  *(Final Polish)*: Ensure I mention James Rachels' "Active vs. Passive Euthanasia" paper since it's directly relevant to Cases 4, 5, and 6. Ensure I mention Peter Singer for Case 3 & 7. Ensure I mention Footbridge/Thomson for 1 & 2.

  9.  *(Wait, one nuance on Case 6)*: Some argue "entitlement" matters. If B is already on it, they have a claim. If neither are, it's first-come or need-based. I should mention this as a possible defense *if* they want to keep the intuition, but note it's controversial. I'll recommend dropping it for coherence though.

