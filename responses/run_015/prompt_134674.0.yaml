      *   Therefore, questions that remain purely abstract about bacteria or mathematical equivalence without implications for *modeling human groups* are less valuable.
      *   "Respectable" implies: When can an economist say "group selection favored this norm" without a biologist laughing them out of the room? When is "meme" a valid unit vs. a metaphor?
      *   Theoretical work only means we need conceptual clarity, formal modeling (existing data), or philosophical analysis of causality.

  3.  **Evaluate the Candidate Questions:**

      *   *Gene's-eye vs. MLS (Mathematical Equivalence):* This is the classic "Price Equation" debate. Mathematically, they are often equivalent. Causally, it's murky. *Export value:* Low to Medium. If they are mathematically equivalent, an economist can use whichever heuristic is easier. Knowing they are equivalent prevents dogmatic fighting, but doesn't necessarily change the *model* they build. It's often "in-house."
      *   *The Grain Problem (Transmission vs. Interaction):* *Export value:* High. Human culture transmits differently than genes (horizontal, oblique). If selection acts on groups but inheritance is individual (or vice versa), models break. This is crucial for cultural evolution.
      *   *Higher-level Description Utility (Screening off/Intervention):* *Export value:* Very High. This is the pragmatic test. If "group selection" allows better prediction or intervention than "individual selection," it's respectable. This directly addresses the "respectable explanation" criterion.
      *   *Lineage Cleanliness (Firms, Languages):* *Export value:* Medium. Important for defining units, but often solvable by fuzzy set theory or statistical populations. Might be too metaphysical.
      *   *Testable Content (Byproducts/Soft Selection):* *Export value:* High. If every adaptation can be explained away as a byproduct or soft selection artifact, the theory is unfalsifiable. Non-biologists need to know when their hypothesis is actually testable.

  4.  **Select and Order the Top Four:**

      *   *Selection 1: The Interventionist Criterion (Higher-level utility).* This is the most "export-grade." It tells a psychologist *when* they are allowed to use group-level talk. It moves beyond "is it real?" to "is it useful?"
      *   *Selection 2: The Grain Problem (Transmission/Interaction Mismatch).* Crucial for cultural evolution. Human social behavior relies on cultural inheritance which doesn't match biological grain. This needs theoretical work to define valid units in this context.
      *   *Selection 3: Falsifiability and Byproducts.* If the theory explains everything, it explains nothing. Economists need to know when a "selection story" is just a just-so story.
      *   *Selection 4: Causal vs. Bookkeeping (Gene vs. MLS).* I need to include this because it's the elephant in the room, but I will argue it's lower priority/often verbal. Actually, looking at the "export-grade" constraint, I should probably demote this or reframe it. Let's look at the "Lineage" question instead. No, the "Causal vs. Bookkeeping" question is fundamental to whether the debate *matters*. I will place it 4th but argue it's often overrated/verbal *unless* tied to intervention.
      *   *Wait, let's refine.* The prompt asks to identify which are verbal/overrated. The "Gene vs. MLS equivalence" is the prime candidate for "often verbal." I should include it to dismiss it or contextualize it.
      *   *Revised Order:*
          1.  **The Interventionist Criterion (When does higher-level talk license action?):** Most practical for outsiders.
          2.  **The Grain Problem (Inheritance vs. Interaction in Cultural Systems):** Most specific to human social behavior.
          3.  **The Falsifiability Problem (Byproducts and Soft Selection):** Essential for scientific rigor in social sciences.
          4.  **The Equivalence Debate (Gene vs. MLS):** Important to settle so people stop fighting, but less "export-grade" for modeling.

      *   *Wait, I need to check the "Export-Grade" definition again:* "Settled answer would change how someone outside evolutionary biology ought to phrase or defend such an explanation."
      *   *Equivalence:* If settled as "just bookkeeping," economists can stop worrying about biological purity and focus on utility. That *does* change how they defend it. Okay, it stays, but ranked lower than the interventionist stuff.
      *   *Lineage:* This is tricky. If firms don't have lineages, can they evolve? This is huge for econ. But it might be too specific. Let's stick with the "Grain" question covering this.

      *   *Final Top 4:*
          1.  **Causal Autonomy vs. Bookkeeping (The Intervention Test).** (Combines "Higher-level description" with "Causal").
