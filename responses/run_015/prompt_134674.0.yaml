          3.  **Falsifiability in the Face of Byproducts.** (Ensures explanations aren't vacuous).
          4.  **The Mathematical Equivalence of Frameworks.** (Clearing the underbrush).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the foundation's goal. Define the stakes (respectability of evolutionary psych/econ). State the philosophy: Pragmatism over metaphysics.
      *   **Question 1: The Interventionist Criterion (Priority 1).**
          *   *Why:* Directly answers "when is it respectable?" If group talk allows interventions individual talk doesn't, it's real enough.
          *   *Tractability:* High. Conceptual/philosophical analysis of causality (Woodwardian etc.) + re-analysis of existing models.
          *   *Downstream:* Tells social scientists when they can propose policy based on group selection.
          *   *Move Up/Down:* If a formal proof shows higher-level variables *never* screen off lower-level ones in social systems, it drops. If a case study shows a policy failed because it ignored group structure, it rises.
      *   **Question 2: The Grain Problem in Cultural Evolution (Priority 2).**
          *   *Why:* Human behavior is cultural. Cultural inheritance is messy (horizontal). Biological units-of-selection theory assumes vertical lineage. This mismatch is the biggest source of error in export.
          *   *Tractability:* Theoretical modeling of non-vertical inheritance.
          *   *Downstream:* Validates or invalidates "memetics" and cultural group selection.
          *   *Move Up/Down:* If a general theory of "horizontal fitness" is derived, it rises. If it turns out horizontal transfer just averages out to individual selection, it drops.
      *   **Question 3: Falsifiability and the Byproduct Defense (Priority 3).**
          *   *Why:* Social scientists love adaptationist stories. If every trait can be a byproduct or soft-selection artifact, the theory is dead on arrival for rigorous fields like econ.
          *   *Tractability:* Philosophical analysis of null hypotheses in evolutionary modeling.
          *   *Downstream:* Prevents "just-so stories" from gaining respectability.
          *   *Move Up/Down:* If a standard set of "negative tests" is agreed upon, it rises. If it's shown that byproducts are indistinguishable from adaptations without genetic data, it drops (becomes in-house).
      *   **Question 4: Equivalence of Frameworks (Priority 4).**
          *   *Why:* It's the most famous debate, but often verbal. Needs to be settled so people stop wasting time.
