answer: |-
  To the Trustees of the Foundation,

  You have asked for a roadmap to determine which evolutionary explanations deserve respect when exported to the social sciences. Your constraint is sharp: you are not funding biology; you are funding the *rules of export*. You want to know when a psychologist, economist, or anthropologist can invoke "selection" without committing a category error.

  Because your fellowships are theoretical and prohibit new data collection, we must focus on conceptual clarity, formal modeling of existing logic, and philosophical analysis of causality. The goal is not to discover new facts about nature, but to settle the rules of inference so that social scientists know when their evolutionary arguments are sound.

  I have evaluated the open questions in the units-of-selection debate against your "export-grade" criterion. A question is export-grade if answering it changes how a non-biologist constructs a model or defends a claim. It is in-house if it merely satisfies a biologist's desire for ontological purity.

  Below are the four questions I recommend you fund, ordered by urgency. I have also identified which existing debates are overrated and should be defunded.

  ### 1. The Interventionist Criterion: When Does Higher-Level Talk License Action?
  **The Question:** Is a higher-level selection explanation (e.g., "group selection") ever more than bookkeeping? Specifically, does describing a system at the group level allow for predictions or interventions that are impossible, opaque, or intractable at the individual level?

  **Why this is Priority One:**
  This is the most export-grade question possible. Social scientists are pragmatists. An economist does not care if "group selection" is metaphysically real; they care if modeling a firm as a unit of selection yields better policy outcomes than modeling the individual employees. If a higher-level description "screens off" the lower-level details—meaning you don't need to know the individual genetics or psychology to predict the group's fate—then it is respectable to use it. If it is merely a summary statistic of individual actions, then invoking it is misleading shorthand.

  This question directly addresses your goal of defining "respectable." If a theoretical framework can prove that group-level variables license unique interventions (e.g., changing a norm requires changing the group structure, not just individual incentives), then evolutionary sociology becomes a tool for engineering, not just storytelling.

  **Tractability and Neglect:**
  This is highly tractable without new data. It requires applying causal inference frameworks (like interventionist accounts of causality) to existing evolutionary models. It is currently neglected because biologists often fight over "what is really selected" rather than "what description is most useful for control." Philosophers of science have touched on this, but rarely with the formal rigor needed to guide modelers.

  **Downstream Impact:**
  Huge. If the answer is "yes, higher-level descriptions can be causally autonomous," it validates cultural group selection in anthropology and institutional evolution in economics. If "no," it forces those fields to reduce all explanations to individual incentives, radically altering how they phrase hypotheses.

  **What Moves This Up or Down:**
  *   **Move Up:** If a fellow produces a formal proof demonstrating a class of social systems where individual-level models systematically fail to predict phase transitions (e.g., sudden norm collapses) that group-level models capture accurately.
  *   **Move Down:** If it is demonstrated that every successful "group-level" intervention can be fully reconstructed as a complex set of individual-level incentives without loss of predictive power, rendering the group level purely descriptive.

  ### 2. The Grain Problem in Cultural Inheritance
  **The Question:** How do we define units of selection when the level of transmission does not match the level of interaction? This is the "grain problem." In biology, genes transmit vertically, and organisms interact. In human culture, ideas transmit horizontally (peer to peer), obliquely (teacher to student), and vertically (parent to child), while selection often acts on groups (firms, nations).

  **Why this is Priority Two:**
  This is the specific bottleneck for exporting evolutionary theory to human behavior. Standard units-of-selection theory assumes a clean lineage. Human social behavior does not have clean lineages. A "meme," a "firm," or a "language" does not reproduce like a bacterium. If we cannot theoretically resolve how selection acts on entities with fuzzy, horizontal inheritance, any evolutionary psychology or economics built on these units is on shaky ground.

  This is export-grade because it tells anthropologists and economists whether they are allowed to treat "cultures" or "institutions" as evolutionary individuals. If the mismatch between transmission and interaction breaks the math of selection, then "cultural evolution" is a metaphor, not a mechanism.

  **Tractability and Neglect:**
  Tractable via formal modeling. We have plenty of data on cultural transmission; the gap is theoretical integration. This is currently underfunded relative to its importance. Biologists often ignore it because it's a "human problem," and social scientists ignore it because they lack the math to solve it.

  **Downstream Impact:**
  High. It determines the validity of "memetics" and dual-inheritance theory. A solution here provides the rulebook for when a social scientist can claim a trait was "selected for" rather than just "diffused."

  **What Moves This Up or Down:**
  *   **Move Up:** If a fellow develops a generalized "fitness" metric that accommodates horizontal transfer without collapsing into individual-level selection, validating the use of group-level terms in cultural evolution.
  *   **Move Down:** If theoretical work shows that horizontal transmission inevitably averages out to individual-level selection pressures over time, making the "cultural group" concept mathematically redundant.

  ### 3. The Falsifiability Problem: Byproducts and Soft Selection
  **The Question:** Does the units-of-selection debate have testable content once we account for cross-level byproducts and soft selection? In other words, is there any social behavior that *cannot* be explained as an evolutionary adaptation if we are allowed to shift the level of selection or claim it is a byproduct?

  **Why this is Priority Three:**
  This is a quality-control question. The social sciences are plagued by "just-so stories"—plausible evolutionary narratives that cannot be disproven. If a psychologist claims a behavior is an adaptation, but a critic can always say "it's a byproduct of selection at a different level," the theory is unfalsifiable. For an explanation to be respectable, it must be vulnerable to evidence.

  This is export-grade because it sets the standards of evidence. It tells a journal editor when to reject an evolutionary paper not because the idea is wrong, but because it is immune to being proven wrong.

  **Tractability and Neglect:**
  Tractable via philosophical analysis and re-evaluation of existing models. It is currently a source of high heat but low light. Biologists often use "byproduct" defenses to protect pet theories; social scientists use "adaptation" claims to add weight to speculation. A theoretical settlement on the conditions for falsifiability is urgently needed.

  **Downstream Impact:**
  Medium-High. It cleans up the literature. It prevents the field from becoming a religion where every belief is protected by a theoretical loophole.

  **What Moves This Up or Down:**
  *   **Move Up:** If a fellow establishes a standardized set of "negative tests"—logical conditions under which an adaptationist claim must be abandoned—that gains consensus among modelers.
  *   **Move Down:** If it is proven that distinguishing adaptation from byproduct is theoretically impossible without specific genetic data (which social scientists rarely have), rendering the question in-house and irrelevant to the social sciences.

  ### 4. The Equivalence Debate: Gene's-Eye vs. Multi-Level Selection
  **The Question:** Do the gene's-eye view and multi-level selection (MLS) differ causally, or are they merely alternative ways of partitioning variance?

  **Why this is Priority Four:**
  This is the most famous debate in the field, which is precisely why it is fourth on this list. Mathematically, these frameworks are often equivalent; they describe the same dynamics using different accounting methods. For a biologist, the choice might matter for intuition. For an economist or psychologist, it should not matter at all *unless* one framework is computationally easier or leads to different interventions (see Question 1).

  **Why this is often Verbal/Overrated:**
  I must be plain: a significant portion of this debate is verbal. It is a fight over notation and heuristic preference masquerading as a fight about reality. Funding this risks paying postdocs to re-derive the Price Equation for the tenth time. However, it remains on the list because the *confusion* it generates is a barrier to export. Social scientists waste time picking sides in a war that might not exist. We need a "ceasefire" paper that clearly delineates where the math is identical and where it genuinely diverges.

  **Tractability and Neglect:**
  Highly tractable but saturated. Many theorists have worked on this. The value here is not in solving it, but in translating the solution for outsiders.

  **Downstream Impact:**
  Low-Medium. Settling this stops the fighting, but doesn't necessarily enable new science. It clears the underbrush so Question 1 and 2 can be addressed without terminological baggage.

  **What Moves This Up or Down:**
  *   **Move Up:** If a case is found where the two frameworks yield genuinely different empirical predictions in a social system (not just a mathematical re-expression), which would be a seismic discovery.
  *   **Move Down:** If consensus solidifies that the difference is purely pedagogical, allowing the foundation to stop funding this topic entirely in year two.

  ### Summary of Strategy

  Your foundation's unique value proposition is **arbitration for export**.

  Biologists will continue to fight over the ontology of the gene. You should not fund that. You should fund the **interface**.
  *   **Question 1** tells the social scientist *when* they can use group talk.
  *   **Question 2** tells them *what* units are valid in culture.
  *   **Question 3** tells them *how* to prove they aren't telling stories.
  *   **Question 4** tells them *which* terminology won't get them laughed at.

  By prioritizing the **Interventionist Criterion** and the **Grain Problem**, you acknowledge that for the social sciences, utility and structural fit matter more than metaphysical purity. If a unit of selection allows you to intervene on the world, it is real enough for an economist. If the inheritance structure doesn't match the model, the model is wrong, regardless of how elegant the math is.

  This ordering minimizes time spent on verbal disputes (Question 4) and maximizes time spent on criteria that determine scientific respectability in the target fields (Questions 1 and 2). This ensures that at the end of three years, you do not just have ten more papers on the Price Equation, but a handbook for how to use evolutionary theory outside of biology without breaking it.
