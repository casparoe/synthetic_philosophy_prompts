answer: |-
  # Seminar Handout: Dissociating Subject Stakes from Attributor Context
  **Course:** Semantics of Epistemic Ascriptions (PHIL 605)
  **Instructor:** [Your Name]
  **Date:** October 24, 2023

  ## Preamble: The Design Problem
  **[Settled/Orthodoxy]:** It is standard orthodoxy that DeRose-style "Bank Cases" generate a tension between *Attributor Contextualism* (AC) and *Subject-Sensitive Invariantism* (SSI/Pragmatic Encroachment).
  **[Contested]:** It is genuinely disputed whether this tension is genuine or merely apparent. Many argue the two theories are notational variants or that one dissolves upon closer pragmatic inspection.
  **[Diagnostic Goal]:** The standard Bank Cases confound two variables: the practical stakes for the *subject* (Hannah) and the practical stakes/conversational context of the *attributor* (usually DeRose or a narrator reflecting on Hannah). In standard tellings, when Hannah's stakes rise, the attributor's attention to the possibility of error also rises. To test the theories independently, we need a **double dissociation**: cases where the variables move in opposite directions.

  Below are two draft cases designed to isolate these variables. I have prioritized diagnostic transparency over rhetorical polish. Where the cases feel fragile, I have flagged the fragility.

  ---

  ## Case A: The High-Stakes Contestant (High Subject / Low Attributor)

  **Scenario:**
  Sam is a contestant on a televised trivia game show. He has accumulated $500,000 in winnings. He faces a final question: "What is the capital of Australia?" If he answers incorrectly, he loses everything. If he answers correctly, he wins $1 million. Sam recalls reading a travel brochure years ago that said "Canberra." He feels confident but acknowledges the pressure. He turns to his lifeline, a friend in the audience, and says, "I think it's Canberra."
  At home, Pat is watching the broadcast. Pat is filling out a casual office bingo card based on the show's events. Pat has no money riding on Sam's performance; the bingo prize is a $10 gift card. Pat turns to their spouse and says, pointing at the screen, "Don't worry, Sam knows the answer. He read the brochure."

  **Theoretical Predictions:**
  *   **Subject-Sensitive Invariantism (SSI):**
      *   *Core Commitment:* Whether Sam knows depends on Sam's practical environment (stakes).
      *   *Verdict:* **False ("Sam does not know").**
      *   *Reasoning:* Sam's evidence (memory of a brochure) is fixed. However, the threshold for knowledge is sensitive to stakes. Losing $500,000 is a massive practical cost. For SSI, this cost raises the justification threshold. Sam's memory, sufficient for ordinary trivia, is insufficient for life-altering financial risk.
  *   **Attributor Contextualism (AC):**
      *   *Core Commitment:* The truth conditions of "knows" vary with the attributor's (Pat's) conversational context.
      *   *Verdict:* **True ("Sam knows").**
      *   *Reasoning:* Pat's context is low-stakes (office bingo). The salience of error possibilities in Pat's context is low. Pat is not deliberating on whether to bet the mortgage on Sam's answer. In Pat's low-standards context, Sam's memory suffices for the truth of "Sam knows."

  **Structural Feature:** *Contextual Isolation.* The attributor's practical environment is decoupled from the subject's outcome.
  **Removal Test:** If we couple the contexts (e.g., Pat is also betting on Sam's success), Pat's stakes rise. AC predicts Pat's standards rise, aligning with SSI. The dissociation collapses into a standard Bank Case where both theories might predict "False" (or at least agree on the verdict, even if for different reasons).

  **[Diagnosis/Leak]:** This case relies on Pat *not* having error possibilities made salient by Sam's visible anxiety. If Sam is sweating on TV, a Contextualist might argue the *salience* of error rises for Pat regardless of Pat's stakes. This is a known vulnerability in AC (the "Salience Objection").

  ---

  ## Case B: The Logistics Coordinator (Low Subject / High Attributor)

  **Scenario:**
  Jen is a university student taking a leisurely train ride to the coast for the weekend. She has no deadline to meet; if she misses the 5:00 PM train, she simply takes the 6:00 PM train with no cost or inconvenience. She checked the railway website yesterday morning, which listed the departure at 5:00 PM. She believes the train leaves at 5:00 PM.
  Dan is a military logistics coordinator. He is planning a time-sensitive transport of medical supplies that *must* be on the 5:00 PM train. If the train does not leave at 5:00 PM, the supplies spoil, and patients die. Dan cannot check the schedule himself; he must rely on reports. He speaks to his lieutenant, pointing at Jen (who is waiting on the platform, visible on a security feed), and asks, "Does that civilian know the train leaves at 5?" The lieutenant replies, "She checked the website yesterday." Dan responds, "That's not enough. She doesn't *know* that. We need a confirmation from the station master."

  **Theoretical Predictions:**
  *   **Subject-Sensitive Invariantism (SSI):**
      *   *Core Commitment:* Whether Jen knows depends on Jen's practical environment.
      *   *Verdict:* **True ("Jen knows").**
      *   *Reasoning:* Jen's stakes are trivial (minor inconvenience). Her evidence (website check) is standard for ordinary travel. The fact that *Dan* has high stakes is irrelevant to Jen's epistemic position. Encroachment is subject-relative.
  *   **Attributor Contextualism (AC):**
      *   *Core Commitment:* The truth conditions vary with Dan's context.
      *   *Verdict:* **False ("Jen does not know").**
      *   *Reasoning:* Dan is in a high-stakes context (life/death logistics). This raises the semantic standard for "knows" in his mouth. Even if Jen is in a low-stakes position, the word "knows" as used by Dan requires a higher degree of justification/reliability (e.g., station master confirmation). Since Jen lacks that, the sentence "Jen knows" is false in Dan's context.

  **Structural Feature:** *Attributor Risk.* The attributor is risking something significant on the truth of the proposition, independent of the subject.
  **Removal Test:** If Dan is also just a tourist (Low Attributor Stakes), his standards drop. AC predicts "True." SSI predicts "True." The dissociation collapses; both agree Jen knows.

  **[Diagnosis/Leak]:** This case is vulnerable to the *Warranted Assertability Maneuver* (WAM). An Invariantist might argue Dan speaks truly when he says "She doesn't know," but only because it would be *misleading to assert* she knows, not because the proposition is semantically false.

  ---

  ## Critical Diagnosis: The "Third Variable" Problem

  **[Contested]:** Whether these cases successfully isolate *stakes* from *salience* is highly disputed.
  **[My Judgment]:** I believe Case B is stronger than Case A, but neither is watertight. Here is why:

  1.  **The Salience Leak (Threat to Case A):** Contextualism is often driven by the *salience of error possibilities*, not just practical stakes (Lewis's "Rule of Attention"). In Case A, even if Pat has low stakes, seeing Sam risk $500,000 makes the possibility of error salient to Pat. If salience drives standards, AC predicts "False," matching SSI. To save the dissociation, we must assume Pat is remarkably oblivious to Sam's stress, which strains realism.
  2.  **The Pragmatic Leak (Threat to Case B):** In Case B, Dan says "She doesn't know." An Invariantist (including many SSI proponents) can argue this is a *pragmatic* phenomenon. Dan cannot *rely* on Jen. To say "She knows" would implicate "It is safe to rely on her." Since it isn't safe for Dan, he denies knowledge. This preserves Invariantism (Jen *does* know semantically) while explaining Dan's behavior without AC.
  3.  **The "Evidence Gathering" Constraint:** You requested that the attributor's standard not be about "how much evidence she has gathered." This is difficult to police. In Case B, Dan says, "We need confirmation from the station master." This sounds like he is demanding more evidence gathering. To fix this, Dan must say, "Given the risk, her current state isn't *knowledge*," rather than "She needs to check more." I have tried to phrase it this way, but the line is thin.

  **Conclusion on Dissociation:** A clean double dissociation is likely impossible to construct in natural language because "knowledge" attributions are inherently tied to *action guidance*. When stakes diverge, the *purpose* of the attribution diverges, which inevitably triggers pragmatic adjustments that mimic semantic shifts.

  ---

  ## Objections and Defense

  ### 1. The Contextualist Attack on Case B (The SSI Loss)
  **Argument:** A Contextualist will attack Case B by denying that Dan's utterance is false. They will argue that Dan is speaking truly because *his* context sets the standard.
  **Counter-Attack (from SSI defender):** An SSI defender will argue that Dan is speaking *falsely* (or at least, not truly) if Jen actually knows. They will claim Dan is confusing *knowledge* with *certainty sufficient for action*.
  **My Assessment:** The Contextualist has the stronger semantic intuition here *if* we accept that "knows" is indexical. However, the SSI defender has the stronger *metaphysical* intuition: how can Dan's stakes change Jen's mental state?
  **Verdict:** This stalemate confirms that Case B tests the *semantics* of "knows," not the metaphysics of knowledge. If you feel Dan is "changing the subject," you lean Invariantist. If you feel Dan is "speaking strictly," you lean Contextualist.

  ### 2. The Invariantist Attack on Case A (The AC Loss)
  **Argument:** An Invariantist (specifically a Traditional Invariantist, not SSI) will argue that Sam *does* know in Case A, and Pat is right. They will deny Encroachment entirely.
  **Argument (from SSI defender against AC):** An SSI defender will argue that Pat is speaking falsely, even in her low-stakes context. She is attributing a relation (knowledge) that Sam does not bear to the proposition, regardless of Pat's context.
  **My Assessment:** This is the crux of the Encroachment debate. If you have the intuition that "Sam doesn't *really* know because he shouldn't bet," you are feeling the pull of SSI. If you think "Sam knows, he just shouldn't act on it," you are resisting Encroachment.
  **Crucial Distinction:** [Settled] Both views agree Sam shouldn't bet. [Contested] Whether that is because he lacks knowledge (SSI) or because knowledge isn't the only norm of action (Invariantism + Pragmatics).

  ### 3. The "Salience" Dissolution (The Universal Threat)
  **Argument:** A sophisticated Contextualist (e.g., DeRose) might argue that in Case A, Sam's high stakes make the error possibility salient to *everyone*, including Pat. Therefore, Pat's context *becomes* high-standards automatically.
  **My Assessment:** This is the most persuasive attack on the handout's utility. If salience travels with stakes, the variables cannot be separated.
  **Defense:** We must stipulate that Pat is distracted or insensitive. But if we stipulate too much, the case becomes unnatural.
  **Honest Diagnosis:** This suggests that *Salience* may be the real driver of contextual shifts, not *Attributor Stakes* per se. If so, AC survives, but the "Stakes-based Contextualism" version of AC is weakened.

  ---

  ## Summary of Theoretical Commitments

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **"Knows" is context-sensitive.** | **Contested** | Core of AC. Denied by all Invariantists (SSI and Traditional). |
  | **Practical stakes affect knowledge.** | **Contested** | Core of SSI. Denied by Traditional Invariantists and most Contextualists (who say stakes affect *standards*, not the fact of knowing). |
  | **Standard Bank Cases show variability.** | **Settled (Data)** | Most agree the *intuitions* shift. Disagreement is on *why* (semantics vs. pragmatics). |
  | **Attributor stakes raise standards.** | **Contested** | Specific to AC. SSI says attributor stakes are irrelevant to truth conditions. |
  | **Subject stakes raise thresholds.** | **Contested** | Specific to SSI. AC says subject stakes are irrelevant except via salience. |
  | **WAM (Pragmatics) explains denials.** | **Contested** | The standard Invariantist defense against Contextual data. |

  ## Final Recommendation for the Seminar
  Do not present these cases as "proof" that one theory wins. Present them as **stress tests**.
  1.  Use **Case A** to test the resilience of Encroachment. If students feel Pat speaks truly ("He knows"), Encroachment is in trouble.
  2.  Use **Case B** to test the resilience of Contextualism. If students feel Dan is being overly cautious but wrong ("She *does* know, you're just being picky"), Contextualism is in trouble.
  3.  **Crucial Pedagogical Point:** The fact that reasonable people disagree on the verdicts of *these* specific cases (unlike the standard Bank Cases) suggests that the "tie" between AC and SSI may not be breakable by intuition pumps alone. It may require theoretical virtues (simplicity, fit with linguistic data) to decide.

  **[Instructor's Note]:** I find the WAM defense (that Dan is speaking pragmatically, not semantically) more persuasive than the Salience defense (that Pat's standards rise automatically). This leads me to suspect that **SSI is the stronger candidate**, but only if we accept that "knowledge" is the norm of practical reasoning. If we reject that norm, Traditional Invariantism wins. Contextualism struggles most with Case B because it requires us to accept that Jen's epistemic status changes because of *Dan's* job, which feels metaphysically spurious. However, Contextualists reply that they are offering a semantics of the *word*, not a metaphysics of the *state*. Keep this distinction clear in discussion.
