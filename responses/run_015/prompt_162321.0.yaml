answer: |-
  This is a classic setup: a pop-philosophy summary flattens a nuanced position into a punchline, and then a rigorous debate gets stuck because one person is attacking the punchline while the other is defending the nuance.

  Your suspicion is correct: the paperback summary commits the cardinal sin of Rorty interpretation. It conflates **antirepresentationalism** (the view that the mind doesn't mirror nature) with **idealism** (the view that the mind creates reality).

  Here is the breakdown of the summary, followed by an analysis of your friend's two objections and the "no theory" claim.

  ### Part 1: Autopsy of the Paperback Summary

  Here is how a serious Rortyan would grade that paragraph.

  **1. "Truth isn't a matter of our sentences matching up with how things really are."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is the core of *Philosophy and the Mirror of Nature*. Rorty rejects the Correspondence Theory of Truth. He agrees that we cannot step outside our skin/language to check if our words "match" the naked world.

  **2. "'Truth' is just a compliment we pay to claims that are useful to us, or that nobody around us can think of an objection to."**
  *   **Verdict:** **Caricature / Slippage.**
  *   **Why:** This mixes William James (truth is what works) with a crude sociological view (truth is what the mob allows). Rorty's actual view is closer to "truth is what our peers let us get away with *after rigorous inquiry*." It's not just "useful" in a crude sense (a lie can be useful); it's about **warranted assertibility** within a community of inquirers. The book makes it sound like "might makes right," whereas Rorty sees it as "solidarity through free encounter."

  **3. "Reality doesn't constrain what we say, only our habits of talk do."**
  *   **Verdict:** **Flat-Out Wrong.**
  *   **Why:** This is the biggest error. Rorty *always* insisted that the world is there, it is hard, and it kicks back. If you walk off a cliff, gravity doesn't care about your vocabulary. Rorty's point is that the world **causes** us to have beliefs, but it does not **justify** them. Justification is a social game played with words; causation is a physical relation between objects and bodies. The book makes him sound like a solipsist; he was a naturalist who thought language was a tool, not a picture.

  **4. "No such thing as being wrong about how things are, only being out of step with the people around you."**
  *   **Verdict:** **Caricature.**
  *   **Why:** Within a vocabulary (like physics), you can definitely be wrong. If your math is bad, the bridge falls down. Rorty denies you can be wrong relative to *Reality Itself* (capital R), but he fully accepts you can be wrong relative to *your own standards of evidence*. The book erases the distinction between "wrong by our lights" and "wrong by God's lights," implying Rorty thinks error doesn't exist.

  **5. "No vocabulary... gets you any closer to how reality really is than any other, poetry say."**
  *   **Verdict:** **Accept (with nuance).**
  *   **Why:** Rorty argues that "closer" implies a metric of correspondence. Since we can't check the map against the territory without using another map, "progress" isn't getting closer to the intrinsic nature of things; it's finding better tools for coping with things. Science is better than poetry for *prediction*; poetry might be better for *meaning*. Neither is "truer" in a metaphysical sense.

  **6. "Neopragmatism is mostly treated as a dead end these days."**
  *   **Verdict:** **Debatable / Overstatement.**
  *   **Why:** In analytic metaphysics? Yes, realism roared back (led by people like Putnam turning back, Kripke, etc.). But in political theory, humanities, and post-analytic philosophy, Rorty is massive. Calling it a "dead end" is a polemical simplification typical of pop-philosophy. It ignores that Rorty successfully shifted the conversation from "What is Truth?" to "What is the point of talking about Truth?"

  ---

  ### Part 2: The Eclipse Civilization (Friend's Objection One)

  **The Scenario:** A civilization predicts eclipses perfectly for 400 years using a theory that is (from our God's-eye view) "completely false" (lucky math).
  **The Charge:** Rorty must call this theory "true" because it survived objection/was useful. Therefore, Rorty's definition of truth is broken.

  **Is this fair?**
  It is a standard realist objection (similar to Hilary Putnam's critiques), but it relies on a premise Rorty explicitly rejects.

  **Does Rorty have to bite the bullet?**
  Yes, but he reframes the bullet.
  1.  **For that civilization, the theory *is* true.** Rorty defines truth as "what it is better for us to believe." If the theory allows perfect prediction and coheres with their other beliefs, it is the truth *for them*.
  2.  **The "Actually False" premise is the problem.** The objection assumes we (the critics) have access to "Reality" to know the theory is *really* false. Rorty says we don't. We only know the theory is "false" because *we* have a better vocabulary (General Relativity, etc.) that does more things than just predict eclipses.
  3.  **The "Luck" aspect.** If the math is *just* lucky, eventually it will fail on a new phenomenon (e.g., planetary retrograde). When it fails, the community will discard it. For Rorty, truth is time-indexed. It was true when it worked; it became false when a better tool came along.

  **What's left for him to object to?**
  The realist wants truth to be a relation between a sentence and the world. Rorty wants truth to be a relation between a sentence and other sentences (and their practical consequences). The friend is arguing that without the "world" anchor, truth loses its normative force. Rorty replies that the "world anchor" was a fantasy all along, and social accountability is the only anchor we have.

  **Verdict:** The friend is right that this is counter-intuitive, but wrong that it refutes Rorty. It only refutes Rorty if you assume Realism is the default starting point. Rorty's whole project is to show Realism is an optional vocabulary.

  ---

  ### Part 3: Causation vs. Justification (Friend's Objection Two)

  **The Charge:** Rorty relies on distinguishing "the world causes belief" from "the world justifies belief." If you drop representation (the mirror), this distinction collapses.

  **Is this the load-bearing move?**
  **Yes. Absolutely.** This is the engine of Rorty's entire system. He borrows this from Wilfrid Sellars and Donald Davidson.
  *   **Causation:** A non-linguistic event (light hitting retina) causes a neural state which causes a belief ("There is a red apple"). The world is involved here.
  *   **Justification:** To *justify* that belief, you need other beliefs ("My eyes are open," "Lighting is good," "Apples are usually red"). The world cannot speak; only speakers can speak. Therefore, the world can cause belief, but only language can justify belief.

  **Does it survive his own premises?**
  This is the billion-dollar question in post-analytic philosophy.
  *   **The Friend's Point:** If the world plays *no* role in justification, why does science work better than astrology? If the world only "kicks back" causally, why do we treat that kick as a reason to change our minds? It seems like Rorty is smuggling the normative authority of the world back in through the back door of "causation."
  *   **The Rortyan Defense:** Rorty argues that we treat the kick as a reason *because of our social habits*, not because the kick itself contains a proposition. We have agreed that sensory shocks count as evidence. That agreement is social, not metaphysical.

  **Verdict:** Your friend has identified the exact pressure point where most critics attack Rorty (see Paul Boghossian's *Fear of Knowledge*). Whether the distinction "survives" depends on whether you think norms can arise purely from social practice without some tether to non-human reality. Rorty says yes; most realists say no. Your friend is philosophically sharp to spot this; it is indeed the linchpin.

  ---

  ### Part 4: The "No Theory of Truth" Claim

  **The Claim:** Rorty isn't offering a theory of truth, just a recommendation to stop using the vocabulary of "correspondence."
  **The Friend's Counter:** Isn't "stop asking whether your beliefs correspond to reality" itself a claim about truth?

  **Analysis:**
  This is the "Self-Refutation" objection. If Rorty says "There is no Truth," is that statement True?
  *   **Rorty's Move:** He tries to dodge this by saying he is making a **pragmatic proposal**, not a **metaphysical assertion**. He isn't saying "Correspondence is False"; he is saying "Correspondence is *useless*."
  *   **The Problem:** As your friend implies, claiming something is "useless" usually implies a claim about how things *are* (i.e., "It is true that this tool doesn't work").
  *   **The Nuance:** Rorty would argue he is offering a *therapeutic* intervention. He wants to dissolve the problem, not solve it. He wants us to treat "truth" as a compliment we pay to each other, not a goal of inquiry.
  *   **Verdict:** Your friend is right to be suspicious. It is very difficult to argue against correspondence without implicitly relying on a standard of correctness that looks a lot like... correspondence. Rorty tries to walk this tightrope by calling himself an "ironist" (someone who doubts their own final vocabulary), but logically, the move is precarious.

  ### Summary for Your Next Drink

  1.  **The Book:** It's too sloppy. It makes Rorty sound like he thinks reality doesn't exist or constrain us. He thinks it constrains us *causally*, just not *normatively*. You were right to doubt the book.
  2.  **Objection 1 (Eclipses):** Your friend is using a Realist intuition pump. Rorty accepts the conclusion (yes, it's true for them) but denies the premise (that we can know it's "really false" from outside a vocabulary). It's a stalemate of starting assumptions.
  3.  **Objection 2 (Causation/Justification):** Your friend is spot on. This is the most important technical objection to Rorty. If this distinction fails, Rorty's system collapses into "anything goes." Rortyans think it holds; Realists think it's magic.
  4.  **The "No Theory" Claim:** It's a clever dodge, but logically shaky. Rorty wants to have his cake (critique truth) and eat it too (not make truth claims).

  **Who won the fight?**
  Philosophically? Your friend. They identified the two strongest realist objections to Rorty (the Ideal Justification problem and the Causation/Justification collapse).
  Textually? You. The book gave you a caricature that made Rorty easier to attack but harder to understand. Rorty isn't a relativist who thinks "anything goes"; he's a pragmatist who thinks "what goes is what helps us cope together."

  If you want to settle it, tell your friend: *"The book made him sound like an idealist. I know he's an antirepresentationalist naturalist. But you're right that his distinction between cause and justification is the weak spot. Let's get another round and talk about Davidson."*
