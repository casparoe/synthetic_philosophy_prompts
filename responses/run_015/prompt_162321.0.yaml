          4.  Objection 2 (Causation/Justification).
          5.  The "No Theory" Paradox.
      *   *Key Insight:* The book makes Rorty sound like a subjectivist ("reality doesn't constrain"). Rorty is an *antirepresentationalist*, not a subjectivist. This is the crucial distinction the friend might be leveraging, but the book obscures.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining the "Reality doesn't constrain" point:* This is the biggest error in the book. Rorty explicitly says the world is hard and resists us. It just doesn't *speak* to us. I need to emphasize this.
      *   *Refining the Eclipse point:* Make sure to mention that for Rorty, "true" is a property of sentences, not the world. If the sentence works, it's true. The "really false" part is the realist smuggling in correspondence.
