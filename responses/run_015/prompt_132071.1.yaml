answer: |-
  Dear Editor,

  We are writing to submit the joint statement resulting from our adversarial collaboration on the Church-Fitch knowability paradox, specifically focusing on Fitch's Theorem 5 from his 1963 paper. Our aim was not to reach a consensus on the ultimate truth of anti-realism, but to map the exact contours of our disagreement regarding the knowability principle and the consequences of the proof. We begin with what we both accept without reservation. We agree that the derivation is valid and relies on a very sparse set of assumptions. Specifically, the proof requires that knowledge distributes over conjunction, so that knowing a conjunction entails knowing each conjunct, and that knowledge is factive, so that knowing a proposition entails its truth. Combined with standard modal principles regarding the necessity of logical truths and the interaction between possibility and knowledge, the derivation shows that if every truth is possibly known, then every truth is actually known. The contrapositive is equally secure: if there is some unknown truth, then there is some unknowable truth. We both endorse the central lemma that no sentence of the form p and not-known-p can be known by anybody, since knowing it would entail knowing p and knowing that p is not known, which contradicts the factivity and distribution assumptions. We agree that this functions as a choose your exit reductio rather than a direct refutation of any single premise in isolation, forcing a choice between abandoning the unrestricted knowability thesis, rejecting the logical properties of knowledge, or accepting the implausible conclusion that all truths are known. Furthermore, we agree that this style of argument is highly generalizable. The same structural proof can be run on other operators such as provability, ideal warranted assertibility, or could-be-rationally-believed-with-certainty, though we leave open the question of which of those variants go through without factivity, since some epistemic operators might not require the truth of their content.

  Where we diverge is on the appropriate philosophical response to this result. The Repairer maintains that the collapse only shows the unrestricted principle is false, and that anti-realism can survive with a narrower knowability thesis that restricts the domain of quantification. The Undertaker contends that every restriction that blocks the proof is either ad hoc or else leaves you with a principle too weak to do the work knowability was supposed to do, such as ruling out evidence-transcendent truths or underwriting an epistemic account of truth, and therefore the honest move is to drop knowability entirely and say what anti-realism is without it. Our first major crux concerns the ad-hocness of any such restriction. We agree that a class of propositions is Moorean-free if it contains no proposition of the form p and not-Kp, and that a restricted knowability principle survives Fitch only if its domain is Moorean-free, so the Repairer has to exhibit one. The Undertaker proposes a test for principled restrictions: a restriction is principled only if it can be stated in a language with no epistemic vocabulary in it at all, meaning no known, no knowable, and nothing defined out of them, because every truth except the Moorean ones trivially passes the Moorean-free condition and obviously should not count. The Repairer argues this test is too strict, as it rules out restrictions based on the nature of verification which are central to anti-realism, while the Undertaker insists that without this test, any restriction is merely a restatement of the desired conclusion. Regarding candidate restrictions, we considered restriction to non-modal truths, to observational truths, to truths with actual truthmakers, and to truths statable in some base vocabulary. The Undertaker predicts that the test will say none of these pass cleanly because observationality and truthmakers often implicitly rely on epistemic conditions, whereas the Repairer predicts that restrictions to observational truths or truths statable in a base vocabulary will pass the test and sustain a viable anti-realism.

  Our second crux concerns what the possibility in knowable amounts to. We asked whether the world in which someone knows has to be reachable from ours, sharing the same laws and perhaps a shared history up to some point with knowers broadly like us, or if bare metaphysical possibility is enough, so that a truth counts as knowable if there is some world anywhere, with different physics or different creatures, where somebody knows it. We agreed on a test case bearing on this: the exact number of coins in a jar that was melted down before anyone counted it, where the physical evidence has been permanently destroyed. Under the bare metaphysical reading, this truth might be knowable if some non-human intelligence in a distant possible world could have inferred it from prior conditions, but under the reachable worlds reading, it appears unknowable given our actual laws and history. The Repairer predicts that the restricted principle looks defensible under the reachable worlds reading because it aligns with the anti-realist intuition that truth is constrained by our cognitive capacities, whereas the Undertaker predicts that under either reading the principle fails to do the necessary work, since the reachable reading makes the principle false for destroyed evidence cases and the bare reading makes it trivially true for truths a realist already accepts as possibly known by some ideal agent.

  The third crux involves self-application. We asked whether the knowability principle, restricted or not, is itself a candidate truth and if the Repairer's principle has to apply to itself, and to the claim that it applies to itself, and so on up. We questioned whether there is a stable stratified or typed version, such as knowability at level n for truths of epistemic depth n, or if the hierarchy either collapses back into the unrestricted thesis or becomes something you cannot state in a single sentence. The Repairer predicts that a typed version can be stabilized without collapse, allowing the principle to apply at each level without generating a paradox, while the Undertaker predicts that any such hierarchy either collapses back into the unrestricted thesis when generalized or becomes something you cannot state in a single sentence, thereby undermining the principle's status as a general philosophical thesis.

  Our fourth crux is the work test, for the case where the Repairer's principle survives the previous objections. We asked whether the surviving restricted principle still earns its keep, or has it become something a realist could happily sign too. The Repairer states that they would be convinced they were wrong if it could be shown that a robust metaphysical realist could endorse the restricted knowability principle without conceding any ground on the existence of evidence-transcendent truths, effectively rendering the principle compatible with realism. The Undertaker states that they would be convinced they were wrong if the Repairer could exhibit a restricted principle that is both principled by the non-epistemic vocabulary test and strong enough to rule out the possibility of truths that are in principle beyond any possible verification, thereby securing the distinctively anti-realist constraint on truth.

  Finally, we each commit to what we would count as evidence or argument against our own position. The Repairer would count it as evidence against their position if a restriction satisfying the Undertaker's non-epistemic vocabulary test was proven to entail the unrestricted principle anyway, or if it was shown that any Moorean-free class sufficient to support anti-realism inevitably excludes central scientific truths. The Undertaker would count it as evidence against their position if a restricted knowability principle was successfully formulated that avoided the collapse, satisfied the non-epistemic vocabulary test, and was shown to be essential for making sense of normative domains like ethics or mathematics where realism seems untenable. We also wish to flag plainly any part of the row we think is merely verbal. We suspect some of the fight about what in principle and can mean is exactly that, specifically regarding whether can implies physical possibility given our actual history or merely logical possibility. We also suspect the fight about how to read the quantifier over propositions, whether actualist versus possibilist, may be verbal, because if the disagreement rests solely on whether we quantify over propositions that exist in other possible worlds versus only those in the actual world, the substantive disagreement about the nature of truth may be obscured by semantic choices about the domain of quantification. We decided to flag these because resolving them might not resolve the deeper conflict about whether truth is epistemically constrained, but clarifying them prevents us from talking past one another regarding the scope of the knowability operator. We hope this statement serves as a clear record of our collaboration for your volume.

  Sincerely,

  The Repairer and The Undertaker
