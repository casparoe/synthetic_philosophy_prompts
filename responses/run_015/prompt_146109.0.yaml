answer: |-
  **The Scenario: The Compliance Lottery**

  You are Dr. Aris, a hospital director. Yesterday, a regulatory body ran a "Deterministic Compliance Model" on you. Based on your psychometrics and history, it simulated your reasoning for today and produced a prediction: either "Cooperate" or "Defect." This prediction is sealed in a vault you cannot access.

  Here is the twist: The regulators flipped a coin yesterday.
  *   **Heads (50%):** You are audited today. You must choose whether to donate $10,000 of your personal bonus to a hospital fund (Cooperate) or keep it (Defect).
  *   **Tails (50%):** You are not audited. You receive a $1,000,000 grant *if* the model predicted you would Cooperate in the Heads scenario.

  Today, you open your mail. You are in the **Heads** branch. You are being audited. The grant opportunity (Tails) is gone. The vault containing the prediction is locked. You must choose: Donate or Keep.

  **The Breakdown**

  **Causal Decision Theory (CDT)** looks for physical levers. Your choice today cannot causally reach back into yesterday to change the prediction in the vault. It certainly cannot change the coin flip that already landed on Heads. The million-dollar grant is already lost or won regardless of your signature.
  *   **Verdict:** Keep the money. Donating costs you $10k and gains you nothing.

  **Evidential Decision Theory (EDT)** looks for correlations. Normally, your action is evidence of what the model predicted. However, EDT conditions on *all* known information. You know you are in the Heads branch. In this branch, the grant is impossible. Whether you donate or not, the probability of the grant being awarded is zero, because the coin already landed. Your action provides no useful evidence about payoffs *in this specific situation*.
  *   **Verdict:** Keep the money. You're throwing good money after bad.

  **Updateless Decision Theory (UDT)** ignores the fact that you know you're in the Heads branch. It asks: "What policy should I have committed to *before* the coin flip?" If you commit to "Always Donate," you lose $10k in the Heads world but gain $1M in the Tails world. Expected value: +$490k. If you commit to "Keep," you gain $0 in both. UDT acts as if your current choice sets the policy for both branches, even though you only experience one.
  *   **Verdict:** Donate. You are upholding the policy that wins the lottery.

  **The Structural Split**

  The feature that splits UDT off is **updatelessness**. CDT and EDT "update" on the knowledge that the coin landed Heads. They treat the Tails world as dead history. UDT refuses to update on that specific knowledge when evaluating the decision. It treats your current agency as logically linked to the counterfactual version of you in the Tails world, because both versions stem from the same reasoning algorithm predicted yesterday.

  **Stripping the Feature**

  If you strip updatelessness—if you force the agent to condition on knowing they are in the Heads branch—UDT collapses into EDT. Once you accept "I am definitely in the Audit branch" as a fixed constraint, the logical link to the Tails branch is severed. You become a "sucker" who loses the grant because you couldn't commit to a policy before knowing the outcome.

  **The Causal Attack**

  A Causal Decision Theorist will attack this fiercely. They will argue UDT is engaging in magic. "You cannot influence a sealed vault," they'll say. "You cannot influence a coin flip that already happened. Donating is literally burning $10,000 to satisfy a ghost. If the model was truly deterministic, you couldn't choose otherwise anyway. If you can choose otherwise, the model was wrong, and your donation proves it wrong, voiding the grant condition. Either way, paying is irrational."

  UDT replies that rationality isn't about winning in the specific world you find yourself in, but about being the kind of agent who wins across the multiverse of possibilities your reasoning could have encountered. But in the real world, burning cash feels like a hard sell.
