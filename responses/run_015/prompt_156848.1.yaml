answer: |-
  Here is the case built to order, set within a municipal water authority's maintenance division. The authority operates on a legacy automated rota that schedules pipe inspections based on pressure data fed from a central server. The control consideration is simple and uncontroversial: preventing catastrophic leaks is a reason to maintain the inspection schedule, and every agent in the story possesses this reason, knows it, and acts on it. The target consideration is more specific: the current rota is uniquely correct because it aligns precisely with a specific soil acidity level in Sector 4 that accelerates corrosion at a rate the algorithm compensates for. This acidity fact is the true justification for why this specific rota, rather than a slightly different one, is the right arrangement. However, the sensors for Sector 4 were destroyed in a flood years ago, the replacement technology is obsolete and unavailable, and the authority's budget is legally locked such that no new sensors can be purchased, while the algorithm's code is compiled and unreadable by current staff. Thus, the acidity fact is structurally inaccessible; no agent has it, could come to have it, or could be guided by it, yet the rota remains the correct one because the fact is true, and if the acidity were different, the rota would be wrong. The staff ought to follow the rota because it is the authorized protocol, regardless of whether they know the acidity fact, so the fact makes no difference to their deliberative obligations even though it determines the evaluative correctness of the system they are obliged to follow.

  When we apply your three positions to this target consideration, the verdicts peel apart exactly as required. The possessionist must say there is no reason here, because their core tenet is that a consideration counts as a reason only if it is possessed by an agent who can be guided by it or faulted for ignoring it; since the structural barriers make possession impossible without any epistemic defect on the part of the agents, the acidity fact fails the possession condition and drops out of the normative picture entirely. The free-floatingist says it is a reason, because their view holds that reasons are objective considerations that count in favour of arrangements independent of any agent's grip on them; the acidity fact counts in favour of the rota, so it is a reason, full stop, regardless of the institutional lockout. The rationale-first theorist lands in the middle, saying this is a rationale but not a reason; the acidity fact forms part of the normative structure explaining why the practice is as it ought to be, but because it plays no role in anyone's deliberation or assessment, it lacks the relational property required to be elevated to the status of a reason.

  The single feature doing all the work in this case is the combination of structural inaccessibility with the immutability of the practice. It is not enough that the agents don't know the fact; it must be that they cannot know it, and yet the fact still determines the correctness of the rule they are bound to follow. If you relax the structural-inaccessibility condition so that the sensors could theoretically be repaired or the code read, the case collapses back into the boring familiar disputes about epistemic limitation. The possessionist would immediately argue that the agents now have a derivative reason to fix the sensors or learn the code, thereby re-anchoring the reason to an agent's potential possession. The interesting version of the case survives only so long as the link between the normative truth and the agent's capacity is severed by the institutional structure itself; once you allow that someone could in principle come to know the consideration, the possessionist can always posit a reason to know it, and the orphan is adopted.

  The strongest thing a possessionist would say against this case is that you are conflating the causal explanation of why a rule works with the normative reason for why it should be kept. They will argue that the acidity fact is merely a mechanistic input that makes the rule effective, but the actual reason the agents have is simply to follow effective rules, which is a possessable consideration. They will claim that the normative work is being done by the possessable goal of safety or efficiency, and the acidity fact is just a silent causal lever, not a reason in its own right. The best reply to this is to insist that the acidity fact is not merely causal but constitutive of the rule's correctness; if the acidity were different, the rule would not just be ineffective, it would be normatively wrong to keep it even if it produced no leaks, because it would impose unnecessary burdens. The possessionist tries to reduce the justification to a general possessable aim, but the specific consideration determines the specific shape of the obligation, and that specificity remains orphaned even if the general goal is possessed.
