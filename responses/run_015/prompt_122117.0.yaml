answer: |-
  # Specification of Desiderata for Buddhist Consequentialist Reconstruction

  The following specification outlines five necessary conditions (desiderata) for any philosophical reconstruction of Buddhist moral evaluation that seeks to integrate consequentialist reasoning regarding suffering reduction while maintaining fidelity to core Buddhist metaphysics and soteriology. The goal is to navigate the middle path between reductive act-utilitarianism (where only outcomes matter) and rigid intentionalism (where only *cetanā* matters).

  ### 1. The Temporal-Structure Desideratum (Karmic Latency vs. Consequential Immediacy)

  **Specification:**
  The theory must provide a dual-aspect valuation of action that distinguishes between the *immediate moral quality* of an act (based on its capacity to reduce suffering in the conventional world) and its *karmic latency* (the maturation of *vipāka* for the agent). It must allow for the moral evaluation of distant outcomes without asserting that the agent necessarily appropriates the karmic fruit of those outcomes as personal merit or demerit in a way that contradicts the agent-neutral goal of suffering reduction.

  **Motivating Case:**
  In traditional karma theory, an action's full moral weight is often tied to the result that ripens for the *agent* over lifetimes. In consequentialist reasoning, the moral weight lies in the state of the world (suffering reduced) regardless of who bears the karmic cost. A reconstruction must explain how one can prioritize the reduction of future suffering (e.g., climate mitigation) without being paralyzed by the uncertainty of personal karmic retribution or the doctrinal claim that only the intention at the moment of action is fully knowable.

  **Status:**
  *   **Non-negotiable:** The distinction between intention (*cetanā*) and matured result (*vipāka*) is foundational to all mainstream Buddhist schools.
  *   **Negotiable:** The degree to which *vipāka* blocks moral evaluation of the outcome. Theravāda Abhidharma tends to emphasize the moment of intention; Mahāyāna ethics places greater weight on the long-term benefit to beings.

  **Flagged Conflict:**
  This desideratum is in tension with **Desideratum 2 (Aggregation)**. If moral value is tied to the agent's specific karmic stream (D1), it resists aggregation across distinct streams (D2).

  ### 2. The Aggregation Desideratum (Welfare Summation under Anātman)

  **Specification:**
  The theory must define a unit of moral accounting that permits the summation of welfare across multiple loci of experience without reifying a permanent self (*ātman*). It must articulate how "beings" function as *prajñapti-sat* (conventionally existent entities) robust enough to bear suffering and merit aggregation, yet empty enough to satisfy the doctrine of *anātman*. The theory cannot rely on a substantialist notion of personal identity to ground the calculus of "the greatest good for the greatest number."

  **Motivating Case:**
  Consequentialism requires adding up units of welfare. Buddhism denies the ultimate existence of the units (selves). If there is no self, there is no one to suffer in a cumulative sense, only discrete moments of *duḥkha*. A reconstruction must explain why summing these moments across conventional persons is morally significant without implicitly positing a "super-self" or a metaphysical container for the utility.

  **Status:**
  *   **Non-negotiable:** The doctrine of *anātman* (no-self) is universal across Buddhist traditions.
  *   **Negotiable:** The ontological status of the conventional person. Theravāda often leans toward reductionism (moments only); Mahāyāna Madhyamaka allows for more robust conventional reality via emptiness.

  **Flagged Conflict:**
  This is jointly unsatisfiable with a strict interpretation of **Desideratum 1** if Desideratum 1 insists on strict agent-relative karmic ownership. If karma is strictly non-transferable and self-specific, aggregation of welfare across selves becomes morally inert regarding karmic justice.

  ### 3. The Upāya Constraint (Bounded Exceptionalism)

  **Specification:**
  The theory must establish strict necessary and sufficient conditions under which standard moral precepts (e.g., non-harming) may be suspended for the sake of greater suffering reduction. These conditions must include an epistemic constraint (the agent must reliably know the outcome) and a soteriological constraint (the agent's motivation must be free from self-grasping). This prevents the "ends justify the means" reasoning from becoming a universal rule that rationalizes harm for minor gains.

  **Motivating Case:**
  Mahāyāna texts describe Bodhisattvas killing or lying to save beings, but this is strictly bounded by high realization and pure compassion. Secular hybrid accounts often universalize this exception, allowing ordinary agents to break precepts based on fallible consequentialist calculations. The desideratum requires a mechanism to distinguish legitimate *upāya* (skillful means) from rationalized defilement (*kleśa*).

  **Status:**
  *   **Negotiable:** This is primarily a Mahāyāna Bodhisattva ethic. Theravāda traditions generally maintain precept inviolability for laypersons and monastics, viewing outcome-based exceptions as dangerous.
  *   **Non-negotiable:** Within a Mahāyāna reconstruction, the requirement that *upāya* be rooted in wisdom (*prajñā*) rather than greed or aversion is essential.

  **Flagged Conflict:**
  This conflicts with **Desideratum 4 (Scope of Patients)** if the expansion of moral patients requires actions that ordinary agents cannot epistemically justify. It also tensions with **Desideratum 1** if the "long-range" outcome is unknowable, violating the epistemic constraint of *upāya*.

  ### 4. The Patiency Scope Desideratum (Future and Non-Human Subjects)

  **Specification:**
  The theory must extend moral consideration to currently non-existent future beings and non-human animals without violating the principle that karma operates through intentional interaction with present subjects. It must provide a normative basis for caring about entities that cannot currently reciprocate karmic interaction or possess full moral agency.

  **Motivating Case:**
  Traditional karma theory focuses on intentional acts toward present sentient beings. Future beings do not yet exist to be the object of intention. Wild animals suffer due to natural processes, not necessarily specific human karma. A consequentialist reconstruction must justify why reducing the suffering of a future being or a wild animal carries moral weight comparable to reducing the suffering of a present human, without resorting to non-Buddhist intrinsic value theories.

  **Status:**
  *   **Negotiable:** Traditional frameworks are anthropocentric and present-focused. This desideratum represents a modern "Engaged Buddhist" extension.
  *   **Non-negotiable:** The commitment to the reduction of *duḥkha* wherever it arises is a core soteriological goal.

  **Flagged Conflict:**
  This creates tension with **Desideratum 1**. If karma requires a present intentional object, acting for a non-existent future being generates a karmic paradox regarding who receives the *vipāka*.

  ### 5. The Interdependence Desideratum (Normative Independence from Causal Density)

  **Specification:**
  The theory must utilize *pratītyasamutpāda* (interdependent origination) to explain the *mechanism* of moral causality without deriving the *normative weight* of morality solely from interconnectedness. It must avoid the naturalistic fallacy where "everything is connected" automatically implies "everything must be preserved" or "harm is impossible." Normative weight must remain grounded in the axiological primacy of *duḥkha* (suffering) and its cessation.

  **Motivating Case:**
  Some ecological Buddhist interpretations argue that because all things are interdependent, harming nature is harming oneself, or that nature has intrinsic rights due to interconnection. This risks deriving an "ought" from an "is." A valid reconstruction must assert that interdependence explains *how* actions ripple, but suffering (*duḥkha*) explains *why* those ripples matter morally.

  **Status:**
  *   **Non-negotiable:** *Pratītyasamutpāda* is a core metaphysical doctrine. The avoidance of the naturalistic fallacy is a requirement for philosophical coherence.
  *   **Negotiable:** The extent to which ecological systems are viewed as direct moral patients versus contexts for sentient suffering.

  **Flagged Conflict:**
  This tensions with **Desideratum 4**. If normative weight comes only from *duḥkha* of sentient beings, non-sentient ecological systems have only instrumental value, which may conflict with holistic interpretations of interdependence.

  ***

  ### Analysis of Eliminations and Joint Satisfiability

  **The Single Eliminator:**
  The desideratum that eliminates the largest number of recent hybrid accounts is **Desideratum 3 (The Upāya Constraint)**.

  Most contemporary attempts to reconcile Buddhism with consequentialism (often termed "Buddhist Utilitarianism" or "Engaged Buddhist Ethics") fail at this boundary. They tend to universalize the Bodhisattva's exception. They argue that because the *goal* is suffering reduction, *any* agent may calculate the net welfare and break precepts if the math works out. This violates the soteriological hierarchy inherent in Buddhist ethics, where the capacity to safely engage in outcome-over-rule reasoning is contingent upon the eradication of self-grasping (*ātma-grāha*). By failing to bound *upāya* to agents with verified non-attachment, these hybrid accounts collapse into the "pure outcome-maximizing calculus" the prompt explicitly forbids. They lose the distinctively Buddhist safeguard that intention (*cetanā*) purifies the act, not just the result.

  **Joint Satisfiability Verdict:**
  The full set of desiderata is **not jointly satisfiable** in their maximal forms without significant qualification of the "Consequentialist" component.

  Specifically, **Desideratum 1 (Temporal-Structure/Karma)** and **Desideratum 2 (Aggregation/Anātman)** create a logical contradiction when paired with standard Consequentialist requirements.
  1.  **Karma is Agent-Relative:** *Vipāka* ripens on the specific causal stream of the agent.
  2.  **Consequentialism is Agent-Neutral:** Welfare is summed across all streams equally.

  If one maintains strict Karmic Latency (D1), one cannot treat the welfare of others as morally equivalent to one's own karmic purity, because the karmic cost of an action is borne by the actor, not the beneficiary. If one maintains strict Aggregation (D2), one must treat the karmic cost to the agent as just another negative utility to be summed, which undermines the soteriological necessity of individual purification.

  **Resolution Requirement:**
  To make the set satisfiable, a subset must be abandoned or weakened. The most viable reconstruction must abandon the requirement for **Agent-Neutral Aggregation** in favor of **Agent-Relative Consequentialism**. The theory must accept that while we reason about outcomes to reduce suffering, the moral *value* of the action remains partially tied to the agent's karmic trajectory and intention purity. One cannot fully aggregate welfare across beings if the metaphysical currency of moral value (karma) is non-transferable. Therefore, a "Buddhist Consequentialism" must be a hybrid that prioritizes suffering reduction *conventionally* while acknowledging that *ultimately*, the purification of the agent's mind (*citta*) is the only non-negotiable moral good. This requires weakening Desideratum 2 to allow aggregation only as a heuristic for compassion, not as a metaphysical accounting of ultimate value.
