      *   **Constraint 2:** Must address specific issues: comparing rival demands, separating confidence from stakes, avoiding excessive caution/indifference, acting well vs. justifiability.
      *   **Constraint 3:** Apply each desideratum to two concrete scenarios:
          1.  *Municipal Relief Fund Director:* Impartiality vs. Associative Priority; Wastefulness (minor vs. serious).
          2.  *Clinician:* Precedent Autonomy (advance directive) vs. Current Experiential Interests (dementia patient); Asymmetric burdens of error.
      *   **Constraint 4:** Conclusion must identify central vs. camp-specific desiderata, highlight tensions/trade-offs, name the *single strongest restriction*, and briefly illustrate how two broad families of response (Expected Choice-Worthiness vs. My Favorite Theory) fare.

  2.  **Deconstruct "Moral Uncertainty":**
      *   It's not "I don't know if this bridge will hold" (empirical).
      *   It's "I don't know if Utilitarianism or Deontology is true" (normative).
      *   The agent is *conscientious* (wants to do the right thing).
      *   The theory needs to bridge the gap between "I don't know the Truth" and "I must act."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Action Guidance.* The theory must actually tell you what to do.
          *   *Rationale:* Practicality constraint.
          *   *Scenario:* The Director can't say "I'll think about it." The Clinician can't wait.
      *   *Idea 2: Intertheoretic Comparison.* How do we weigh Utilitarian units against Deontological constraints?
          *   *Rationale:* Need to compare rival demands.
          *   *Scenario:* Director: Is helping a neighbor (Associative) worth more than helping a stranger (Impartial)?
      *   *Idea 3: Confidence vs. Stakes.* Distinguishing probability of truth from severity of error.
          *   *Rationale:* Decision theory (Expected Utility). Avoid indifference to moral risk.
          *   *Scenario:* Clinician: Moderate confidence in both, but violating autonomy might be way worse than hurting feelings, or vice versa.
      *   *Idea 4: Avoiding Paralysis/Excessive Caution.* Don't freeze because *some* theory says "no."
          *   *Rationale:* Psychology/Decision theory (analysis paralysis).
          *   *Scenario:* Director: If wastefulness is a "serious failure" in one theory, does that veto all spending?
      *   *Idea 5: Justifiability vs. Acting Well.* Distinguishing internal rationality from external legitimacy.
          *   *Rationale:* Political philosophy/Public Reason.
          *   *Scenario:* Clinician: Can justify to family even if metaphysically unsure?
      *   *Idea 6: Sensitivity to Moral Stakes.* (Related to 3, but distinct).
          *   *Rationale:* Pascal's Wager style problems.
          *   *Scenario:* If one theory says "X is a mortal sin" and another says "X is neutral," do we always avoid X?

