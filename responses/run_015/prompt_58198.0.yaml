answer: |-
  To evaluate theories of action under moral uncertainty, we must establish criteria that ensure the theory is both philosophically robust and practically usable. The following five desiderata constitute the standards of assessment. Each is grounded in a specific rationale and applied to the two scenarios: the **Municipal Relief Director** (choosing between Impartiality and Associative Priority, with disagreement on Wastefulness) and the **Clinician** (choosing between Precedent Autonomy and Current Experiential Interests, with asymmetric error costs).

  ### 1. Decisiveness (Practical Action-Guidance)
  **Rationale:** A theory of moral uncertainty must be action-guiding in real-time. It cannot require the agent to resolve the underlying moral disagreement before acting, as the definition of the problem precludes this. This draws on the decision-theoretic requirement that an agent must select an option from a feasible set within a constraint of time. A theory that results in suspension of judgment fails the practicality constraint.
  **Application:**
  *   **Director:** The budget cycle closes on Friday. The theory must output a specific allocation plan (e.g., "60% local, 40% distant") rather than recommending the director wait until the debate between impartialism and associative ethics is settled.
  *   **Clinician:** The patient is currently distressed. The theory must yield a verdict on whether to administer sedation per the advance directive or withhold it to preserve current experience, without deferring to an ethics committee indefinitely.

  ### 2. Intertheoretic Comparability
  **Rationale:** To weigh rival outlooks, the theory must provide a common metric or method for comparing the *choice-worthiness* of actions across different moral frameworks. Without this, uncertainty reduces to incommensurability, making rational choice impossible. This mirrors the economic requirement for a common numéraire to compare disparate goods. If one theory speaks in "duties fulfilled" and another in "welfare units," the theory must explain how to trade them off.
  **Application:**
  *   **Director:** The Impartial outlook values a dollar saved for a distant stranger equally to a dollar for a neighbor. The Associative outlook values the neighbor's dollar significantly higher. The theory must specify how to compare the moral "gain" of satisfying the Associative view against the moral "loss" of violating the Impartial view.
  *   **Clinician:** One outlook values "autonomy satisfaction" (a deontic concept) while the other values "absence of suffering" (a hedonic concept). The theory must allow the clinician to weigh the violation of a past wish against the presence of current pain.

  ### 3. Risk-Sensitive Proportionality (Confidence $\times$ Stakes)
  **Rationale:** Rational choice under uncertainty requires separating the *probability* that a moral theory is true (confidence) from the *magnitude* of the moral stakes if it is true (what is at risk). This aligns with Expected Utility Theory, where value is a function of probability and payoff. A theory that ignores stakes treats a trivial moral error the same as a catastrophic one; a theory that ignores confidence treats a fringe view the same as a consensus view.
  **Application:**
  *   **Director:** The Director has moderate confidence in both outlooks. However, the outlooks disagree on wastefulness: one sees it as a minor inefficiency, the other as a serious moral failure. The theory must allow the high stakes of "serious moral failure" to influence the decision even if the credence in that outlook is not absolute.
  *   **Clinician:** The clinician has moderate confidence in both Autonomy and Experiential views. However, the burdens are asymmetric: violating autonomy might be a permanent dignity violation, while ignoring current interests causes temporary distress. The theory must permit the high stakes of the autonomy violation to outweigh the higher confidence in the experiential view (or vice versa), rather than simply following the >50% view.

  ### 4. Non-Veto (Avoidance of Excessive Caution)
  **Rationale:** A theory must avoid "Moral Pascal's Wagers," where a theory with negligible credence but infinite (or extremely high) stakes vetoes all other action. This draws on findings in psychology regarding analysis paralysis and decision theory regarding dominated strategies. If any non-zero probability of a strict prohibition blocks action, the agent becomes morally paralyzed. The theory must preserve the conceptual boundary between *risk management* and *capitulation to unlikely extremes*.
  **Application:**
  *   **Director:** Suppose there is a 1% credence that "any spending is wastefulness and thus a serious moral failure." If the theory allows this 1% view to veto the entire budget allocation because the stakes are "serious," the relief fund fails its purpose. The theory must prevent low-credence, high-stakes views from exercising a veto.
  *   **Clinician:** Suppose there is a small credence that "current experiential interests are the *only* thing that matters." If this view implies that following the advance directive is morally equivalent to assault, the theory must not force the clinician to ignore the directive entirely based on this small probability, provided the credence in Autonomy is substantial.

  ### 5. Distinguishability of Internal Rationality and External Legitimacy
  **Rationale:** The theory must account for the difference between *acting well* (making the subjectively rational choice given uncertainty) and *being able to justify the act* (public legitimacy). This reflects the political philosophical distinction between comprehensive doctrines and public reason. An agent might be internally rational to follow a specific weighting of moral theories, yet unable to justify that weighting to stakeholders who reject the underlying theories.
  **Application:**
  *   **Director:** The Director might be internally rational to weight Impartiality at 60% and Associative at 40%. However, to the local taxpayers (who hold the Associative view), this may be unjustifiable. The theory should clarify whether the goal is to maximize moral correctness (Internal) or maintain social trust (External), or how to balance them.
  *   **Clinician:** The clinician might determine that maximizing Expected Choice-Worthiness requires following the advance directive. However, the patient's family (holding the Experiential view) may view this as cruel. The theory must distinguish whether the clinician has done their moral duty even if the family cannot be convinced of the moral calculus used.

  ***

  ### Conclusion: Assessment of Desiderata

  **Central vs. Camp-Specific Desiderata**
  *   **Central:** **Decisiveness** and **Intertheoretic Comparability** are central to any acceptable view. Without Decisiveness, the theory is not practical; without Comparability, the mathematics of uncertainty cannot begin. These are structural prerequisites.
  *   **Camp-Specific:** **Risk-Sensitive Proportionality** is favored by consequentialist and decision-theoretic camps (Expectationalists) but may be rejected by deontological camps who argue that certain constraints cannot be traded off against probabilities (e.g., you cannot murder one person even if there is a 99% chance it prevents two murders). **Non-Veto** is similarly debated; some argue that if there is *any* chance an act is a grave sin, it must be avoided (timestep dominance).

  **Tensions and Trade-offs**
  There is a significant tension between **Risk-Sensitive Proportionality** and **Non-Veto**. If a theory fully respects stakes (Risk-Sensitivity), it becomes vulnerable to Pascal's Wagers (violating Non-Veto). If a theory strictly enforces Non-Veto (capping the influence of extreme stakes), it may fail to respect genuine moral catastrophes that are merely uncertain (violating Risk-Sensitivity). Additionally, **Intertheoretic Comparability** often conflicts with the integrity of specific moral theories; some deontological theories explicitly deny that their constraints can be compared on a single scale with utilitarian welfare.

  **The Strongest Restriction**
  The single desideratum that places the strongest restriction on the space of viable theories is **Intertheoretic Comparability**.
  *   *Reasoning:* Decisiveness can be achieved arbitrarily (e.g., "flip a coin"). Risk-Sensitivity and Non-Veto are tuning parameters. However, establishing a coherent method to compare the "value" of an action across incommensurable moral frameworks (e.g., comparing a Kantian duty to a Utilitarian utility unit) is the hardest technical and philosophical hurdle. Most theories fail here because they implicitly assume a common currency that does not exist.

  **Illustration of Two Broad Families of Response**

  1.  **Maximizing Expected Choice-Worthiness (ECW):**
      *   *Mechanism:* Assigns probabilities to moral theories and numerical values to outcomes, selecting the action with the highest weighted sum.
      *   *Performance:* Excels at **Risk-Sensitive Proportionality** (naturally integrates confidence and stakes) and **Decisiveness**. However, it struggles severely with **Intertheoretic Comparability** (how to normalize units between theories?) and **Non-Veto** (vulnerable to infinite stakes in low-probability theories).
      *   *Scenario:* The Clinician calculates the "expected moral value" of following the directive vs. ignoring it.

  2.  **My Favorite Theory (MFT):**
      *   *Mechanism:* The agent identifies the moral theory they find most credible and follows its prescriptions exclusively, ignoring uncertainty.
      *   *Performance:* Solves **Intertheoretic Comparability** by avoiding the need to compare (only one theory's metrics are used). However, it fails **Risk-Sensitive Proportionality** (ignores the stakes of the second-most credible theory) and arguably fails **Decisiveness** if the "favorite" theory is itself indeterminate.
      *   *Scenario:* The Director identifies Associative Priority as 51% likely and allocates 100% to locals, ignoring the Impartial view's stakes entirely.

  In summary, while MFT avoids the comparison problem, it violates the intuition that moral stakes matter under uncertainty. ECW captures the stakes but requires a solution to the comparison problem that remains philosophically contentious. Therefore, **Intertheoretic Comparability** remains the primary bottleneck for an adequate theory.
