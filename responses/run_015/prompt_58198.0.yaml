      4.  Acting well vs. Justifiability. -> *Rationality vs. Legitimacy.*
      5.  Practicality. -> *Decisiveness.*

      *Let's select the top 5 Desiderata:*
      1.  **Decisiveness (Practicality):** Must yield a verdict.
      2.  **Intertheoretic Comparability:** Must compare values across theories.
      3.  **Risk-Sensitive Proportionality:** Confidence $\times$ Stake magnitude.
      4.  **Non-Veto (Avoiding Excessive Caution):** A minority view shouldn't always block action.
      5.  **Public Justifiability (Acting Well vs. Justifying):** Distinguish internal rightness from external accountability.

  4.  **Developing Rationales and Applications (Drafting content):**

      *   *Desideratum 1: Decisiveness.*
          *   Rationale: Practical constraint.
          *   Director: Must allocate budget today.
          *   Clinician: Must treat patient now.
      *   *Desideratum 2: Intertheoretic Comparability.*
          *   Rationale: Need to weigh Impartial vs. Associative goods.
          *   Director: How many stranger-lives equal one neighbor-life?
          *   Clinician: How does "autonomy violation" weigh against "current suffering"?
      *   *Desideratum 3: Risk-Sensitive Proportionality.*
          *   Rationale: Decision theory (Expected Value). Separating $P(True)$ from $Cost(Error)$.
          *   Director: Wastefulness (minor vs. serious).
          *   Clinician: Asymmetric burdens (Autonomy vs. Welfare).
      *   *Desideratum 4: Non-Veto / Avoidance of Paralysis.*
          *   Rationale: Avoid "Moral Pascal's Wager" where a tiny probability of a strict theory dominates.
          *   Director: If wastefulness is a "serious failure" (1% credence), do we spend nothing?
          *   Clinician: If current interests theory is 10% credence, do we ignore the advance directive completely?
      *   *Desideratum 5: Distinction between Rationality and Legitimacy.*
          *   Rationale: Acting well (internal) vs. Justifying (external).
