prompt: |-
  For eight years I taught constitutional theory to law students, and secession was a chapter I could deliver largely from memory. Four months ago it stopped being a chapter. I have been seconded to the joint technical committee that our regional government and the national government established after last spring's consultative vote, and we are drafting the financial and citizenship terms of a possible independence.

  Our side's lead negotiator has a rhetorical habit that has become load-bearing. In nearly every session he frames secession as divorce, and specifically as no-fault divorce of the kind our own family law has permitted for decades. Three conclusions are drawn from that framing each time: that a polity cannot be compelled to remain in a union it no longer wants, so the national parliament's consent is legally unnecessary; that the departing party nevertheless owes an equitable division of jointly acquired assets and jointly incurred debt, which is how he defends the proposed severance schedule; and that the settlement should aim at a clean break ending fiscal dependency in both directions, which he uses to resist any open-ended transfer mechanism.

  I have begun to suspect that the analogy is carrying more weight than it can bear, and that some of what it licenses is being smuggled in rather than argued for. I would like a careful audit of it.

  Please set out the mapping explicitly: what in the divorce case plays the role of the two spouses, the marriage itself, the matrimonial property, the children, the court that holds jurisdiction over both parties, and the clean-break order. Then identify where the mapping fails, separating the failures that genuinely threaten his three conclusions from the ones that are merely inelegant. Two places interest me particularly. First, in a divorce each party leaves as an already competent adult; nothing in the analogy seems able to capture that a new state may or may not acquire the administrative and fiscal capacity to function, and I want to know whether that gap defeats the clean-break premise or only constrains it. Second, in a divorce neither ex-spouse retains membership rights in the other's household, yet our draft protocol contemplates precisely that: a portable status for residents of the region who voted against independence, allowing them to hold the national citizenship and the pension entitlements attached to it while living under the new state's law. Tell me whether the divorce frame has any resources for representing this, or whether it is simply invisible from inside the analogy, and what that implies about using the analogy to structure citizenship questions at all.

  Finally, assess whether the three conclusions survive once the disanalogies are on the table, and if they do not, whether a better source domain exists. I have privately been toying with two: the corporate demerger, in which dissenting shareholders receive an appraisal right and the entity is reorganized rather than dissolved, and the housing cooperative, in which a member may withdraw but does not take the building along. Say which, if either, would carry his conclusions better, and specify what adopting each would force him to surrender.

  Do not trouble yourself with citations or with surveying the literature; I know it and will supply the references. What I need is the conceptual audit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A former constitutional law professor (8 years teaching) now working on a joint technical committee for regional secession/independence.
      *   **Task:** Audit the "secession as divorce" analogy used by the lead negotiator.
      *   **Specific Requirements:**
          1.  Explicitly map the analogy (Spouses, Marriage, Property, Children, Court, Clean-Break).
          2.  Identify where the mapping fails (distinguish between threats to conclusions vs. mere inelegance).
          3.  Address two specific pressure points:
              *   *State Capacity:* New states aren't "competent adults" like divorcing spouses. Does this defeat the clean-break premise?
              *   *Citizenship/Residency:* Dissenting residents keep national rights (pensions, citizenship) while living in the new state. Divorce doesn't allow retaining household membership. Is this invisible in the analogy?
          4.  Assess the three conclusions (No consent needed, Equitable division, Clean break) in light of disanalogies.
          5.  Evaluate alternative analogies: *Corporate Demerger* vs. *Housing Cooperative*. Which carries the conclusions better? What must be surrendered for each?
      *   **Constraints:** No citations/literature survey. Focus on conceptual audit. Tone should be professional, analytical, and respectful of the user's expertise.

  2.  **Deconstruct the "Divorce" Analogy (Mapping):**
      *   *Spouses:* The Regional Government (Seceding Entity) and the National Government (Rump State).
      *   *Marriage:* The Constitutional Union/Federation.
      *   *Matrimonial Property:* Shared assets (infrastructure, debt, reserves, natural resources).
      *   *Children:* Citizens (specifically, the population affected by the split). *Correction:* In divorce, children are dependents. In secession, citizens are constituents. A better fit might be "dependents" = vulnerable populations or future generations, but standard mapping usually treats citizens as the *subject* of the split, not the children. However, the prompt asks for "the children." In political theory, citizens are often analogized to children of the state, but in a divorce analogy, they are usually the *issue* over which custody is fought. Let's map them as the Population/Citizenry.
      *   *Court:* The Constitutional Court / International Arbitration / Joint Technical Committee (the forum of separation).
      *   *Clean-Break Order:* The Final Settlement Agreement (ending fiscal transfers).

  3.  **Analyze the Failures (Disanalogies):**
      *   *Failure 1: Volition/Consent.* Divorce is unilateral (no-fault). Secession is often contested constitutionally. *Threat:* Undermines Conclusion 1 (Consent unnecessary).
      *   *Failure 2: Capacity.* Divorcing adults are legally competent. New states may lack fiscal/admin capacity. *Threat:* Undermines Conclusion 3 (Clean break).
      *   *Failure 3: Membership.* Divorce ends shared household membership. Secession draft allows dual status (national citizenship in new state). *Threat:* Undermines the coherence of the analogy regarding citizenship (Conclusion 2/3 boundary).
      *   *Failure 4: Property Nature.* Matrimonial property is private. State assets are public trust/sovereign. *Threat:* Complicates Conclusion 2 (Equitable division).

  4.  **Address the Two Specific Pressure Points:**
      *   *State Capacity:* In divorce, both parties can earn income immediately. A new state might collapse without transfers. If the "child" (new state) isn't an adult, you can't just cut the cord. This *constrains* the clean break (needs transitional support) rather than defeating it entirely, but it weakens the "no-fault" moral force (you can't abandon a dependent).
      *   *Citizenship/Residency:* The "portable status" for dissenters is crucial. In divorce, you don't keep rights in the ex-spouse's house. This analogy makes the protocol look incoherent. It implies the relationship isn't ending, just changing. This suggests the divorce frame is *invisible* to this nuance and actively misleads on citizenship structure.

  5.  **Evaluate the Three Conclusions:**
      *   *Conclusion 1 (No Consent Needed):* Weakens. Divorce is a right; secession is often not. The analogy smuggles in a right to exit that may not exist legally.
      *   *Conclusion 2 (Equitable Division):* Holds reasonably well, but "equity" differs. In divorce, it's fairness between equals. In secession, it's succession of obligations.
      *   *Conclusion 3 (Clean Break):* Weakens significantly due to capacity issues and the portable citizenship clause. You can't have a clean break if people retain ties.

  6.  **Evaluate Alternative Analogies:**
      *   *Corporate Demerger:*
          *   *Fit:* Shareholders (Citizens), Assets (State Property), Board (Govt).
          *   *Pros:* Handles asset division well (appraisal rights). Handles dissenting shareholders (minority protections).
          *   *Cons:* Implies profit motive. Doesn't capture sovereignty.
          *   *Impact on Conclusions:* Supports Conclusion 2 strongly. Weakens Conclusion 1 (requires shareholder vote/constitutional amendment). Weakens Conclusion 3 (integration often remains post-merger).
          *   *Surrender:* The moral/emotional weight of "freedom." Gains technical precision.
      *   *Housing Cooperative:*
          *   *Fit:* Members own share of building. Can leave, can't take walls.
          *   *Pros:* Captures the immovability of territory. Captures shared infrastructure.
          *   *Cons:* Too small scale. Doesn't capture sovereignty.
          *   *Impact on Conclusions:* Supports Conclusion 2 (can't take the building). Weakens Conclusion 1 (co-op rules usually dictate exit). Weakens Conclusion 3 (shared maintenance of building remains).
          *   *Surrender:* The idea of total sovereignty.

      *   *Comparison:* Demerger is better for the *financial/technical* work the user is doing. Cooperative is better for *territory/infrastructure*. Divorce is best for *political rhetoric* but worst for *technical drafting*.
      *   *Recommendation:* The Corporate Demerger is the stronger technical analog for the committee's work (assets/debt). It forces the negotiator to surrender the "unilateral right to exit" (Conclusion 1) but strengthens the "equitable division" (Conclusion 2).

  7.  **Drafting the Response:**
      *   *Tone:* Collegial, precise, acknowledging the user's expertise.
      *   *Structure:*
          1.  The Mapping.
          2.  The Disanalogies (Categorized by threat level).
          3.  The Two Pressure Points (Capacity & Citizenship).
          4.  Assessment of Conclusions.
          5.  Alternative Analogies (Demerger vs. Co-op).
      *   *Refinement:* Ensure the distinction between "inelegant" and "threatening" is clear. Ensure the citizenship point highlights the "partial separation" nature which divorce forbids.

      *(Self-Correction during drafting)*: I need to be careful with the "Children" mapping. In secession, the "children" are arguably the *citizens*, but in the negotiator's frame, the *states* are the spouses. If the states are spouses, who are the children? Usually, in political divorce analogies, the citizens are the children. But the prompt mentions residents keeping citizenship. This makes the "children" mapping tricky. I will map "Children" to the Citizenry/Population, noting that unlike human children, they are split or choose sides.
      *Wait, re-reading the prompt:* "what in the divorce case plays the role of... the children". Okay, I must define this. In the divorce analogy, the *people* are the children of the state. But in the separation, they become adults of the new state. I will note the tension here.

      *Refining the Citizenship Point:* The prompt highlights that dissenters keep national citizenship. In divorce, you don't keep rights in the ex-spouse's pension. This is a "partial secession" or "confederal" element. The divorce analogy hides this. I need to emphasize that the divorce analogy demands a binary status (in/out) which the protocol rejects.

      *Refining the Alternatives:*
      *   *Demerger:* Good for assets/debt. Dissenting shareholders get cashed out or stay in rump. Here, dissenters stay in rump (citizenship) but live in new entity. This fits the "portable status" better than divorce.
      *   *Co-op:* Good for territory. You leave the co-op, you don't take the roof. But you lose membership.
      *   *Verdict:* Demerger is superior for the *technical committee's* specific task (finance/citizenship).

  8.  **Final Polish:** Check against constraints. No citations. Conceptual audit only. Ensure the three conclusions are explicitly revisited.

      *(Final check on the "Children" mapping)*: If the States are the spouses, the Citizens are the children. But citizens are also the *constituents* (the owners). This duality is a flaw in the analogy. I will point this out.

      *(Final check on Capacity)*: If the new state is an "infant," the "clean break" is child abandonment. This is a strong moral counter-argument to the negotiator's frame.

      *(Final check on Conclusions)*:
      1. Consent: Divorce supports it. Reality/Demerger contradicts it.
      2. Equity: Divorce supports it. Demerger supports it better.
      3. Clean Break: Divorce supports it. Reality/Capacity/Citizenship contradicts it.

      Okay, ready to write.
answer: |-
  Here is the conceptual audit of the "secession as divorce" analogy, structured according to your requirements.

  ### I. The Explicit Mapping

  To audit the analogy, we must first freeze the correspondence your lead negotiator is relying upon.

  | **Domain: Family Law (Divorce)** | **Domain: Constitutional Law (Secession)** |
  | :--- | :--- |
  | **Spouse A** | The Seceding Region (as a political entity). |
  | **Spouse B** | The Rump National State. |
  | **The Marriage** | The Constitutional Union / Federation. |
  | **Matrimonial Property** | Jointly held state assets (infrastructure, sovereign wealth, reserves) and joint debt. |
  | **The Children** | The Citizenry (specifically, the population subject to the jurisdiction). |
  | **The Court** | The Constitutional Court / Joint Technical Committee / Arbitral Body. |
  | **Clean-Break Order** | The Final Settlement (ending fiscal transfers and shared administration). |

  ### II. The Disanalogies: Inelegance vs. Structural Threat

  Not all failures of an analogy are fatal. Some are merely poetic roughness; others undermine the logical inferences drawn from the source domain.

  **1. Mere Inelegance (Poetic Roughness)**
  *   **Affection vs. Interest:** Marriage implies emotional bonds; states operate on strategic interest. This mismatch is rhetorical but does not threaten the financial or legal conclusions.
  *   **Fault:** "No-fault" divorce removes the need to prove wrongdoing. In secession, "fault" (e.g., constitutional breach by the center) is often argued to justify exit. However, since your negotiator argues for *no-fault* exit, this alignment is actually a strength of the analogy, not a weakness, provided the legal right to exit exists.

  **2. Structural Threats (Undermining Conclusions)**
  *   **The Nature of the "Children":** In divorce, children are dependents with no agency; custody is decided *for* them. In secession, the "children" (citizens) are the principals who own the state. They are not the object of the settlement but the authors of it.
      *   *Threat:* This undermines **Conclusion 1**. If the citizens are the owners, they cannot unilaterally dissolve the corporation (the Union) without following the articles of incorporation (the Constitution), whereas a spouse has a statutory right to dissolve the marriage regardless of the other's will.
  *   **The Nature of Property:** Matrimonial property is private ownership. State assets are held in trust for the public and future generations.
      *   *Threat:* This complicates **Conclusion 2**. "Equitable division" in divorce looks backward at contribution. In secession, it must look forward at viability. You cannot divide a dam or a central bank ledger as easily as a bank account.
  *   **The Finality of Status:** Divorce creates two mutually exclusive households.
      *   *Threat:* This undermines **Conclusion 3** and the citizenship protocol. As detailed below, the draft protocol allows for overlapping membership, which the divorce analogy renders incoherent.

  ### III. The Two Pressure Points

  **1. State Capacity and the "Competent Adult" Assumption**
  In the divorce analogy, both spouses are presumed legally and economically competent adults. The "clean break" is justified because neither party is a dependent of the other.
  *   **The Gap:** A new state is not an adult; it is an infant. It may lack tax collection capacity, credit rating, or administrative depth.
  *   **Implication:** This does not necessarily *defeat* the clean-break premise, but it **constrains** it morally and practically. If the seceding region cannot function without transfers, a "clean break" looks less like a divorce and more like child abandonment.
  *   **Effect on Conclusion 3:** The negotiator uses the clean-break frame to resist open-ended transfers. The capacity gap suggests that *transitional* transfers are not "dependency" but "weaning." The analogy hides the distinction between permanent alimony (which the negotiator rightly rejects) and transitional capacity-building (which may be necessary for stability). If the new state collapses, the "clean break" harms the rump state too (refugees, instability). Therefore, the clean break must be phased, not immediate.

  **2. Portable Citizenship and Household Membership**
  In a divorce, you do not retain keys to the ex-spouse's house, nor do you retain rights to their pension while living elsewhere. The separation is binary: you are either in the household or out.
  *   **The Gap:** Your draft protocol contemplates a hybrid status: residents of the new state retaining national citizenship and pension entitlements. This is a *partial* separation, akin to a couple divorcing but one spouse retaining full access to the other's bank account and home while living in a separate building.
  *   **Implication:** The divorce analogy renders this protocol **invisible**. It treats the retention of national rights as an anomaly or a concession, rather than a structural feature of a complex separation.
  *   **Effect on Citizenship Structuring:** Using the divorce frame here is dangerous. It pushes the committee toward a binary choice (full citizenship in new state OR full citizenship in old state) when the political reality requires a layered status. The analogy suggests that retaining national ties is "messy" or "unfinished," whereas in constitutional terms, it may be a stable, long-term confederal arrangement. The analogy forces a logic of *separation* where the reality requires a logic of *disentanglement with retained links*.

  ### IV. Assessment of the Three Conclusions

  Once the disanalogies are accounted for, the durability of the negotiator's three conclusions varies:

  1.  **"Consent is Unnecessary" (The Right to Exit):** **Weakens.** The divorce analogy smuggles in a liberal right to exit that exists in family law but rarely in constitutional law without a prior agreement. The "no-fault" framing bypasses the legal requirement for constitutional amendment or mutual consent. Without an independent legal basis for secession, this conclusion rests entirely on the rhetorical power of the analogy, not legal force.
  2.  **"Equitable Division of Assets/Debt":** **Survives.** This is the strongest leg of the analogy. Both divorce and secession require the unwinding of shared economic life. However, the *metric* of equity shifts from "past contribution" (divorce) to "future viability" (secession).
  3.  **"Clean Break / No Open-Ended Transfers":** **Fails.** The capacity gap (infant state) and the citizenship protocol (retained ties) make a strict clean break impossible. The analogy licenses a harshness that the technical reality cannot sustain. A "clean break" in state formation is usually a decade-long process, not a court order.

  ### V. Alternative Source Domains

  You proposed the **Corporate Demerger** and the **Housing Cooperative**. Here is how they compare for your specific technical task.

  **1. Corporate Demerger**
  *   **The Mapping:** The Union is the Corporation; the Regions are Divisions; Citizens are Shareholders; Assets are Corporate Property.
  *   **Strengths:**
      *   **Capacity:** Demergers acknowledge that the new entity needs capitalization to survive. It normalizes "seed funding" or transitional service agreements.
      *   **Citizenship/Shares:** It handles the "portable status" well. Dissenting shareholders can often elect to remain shareholders in the rump company even if their local division spins off (appraisal rights or retention). This maps cleanly to your protocol of retaining national citizenship/pensions.
      *   **Assets:** Provides a robust framework for valuing and splitting debt and assets based on book value and future earnings, rather than "fairness."
  *   **Weaknesses:** Lacks the emotional/sovereign weight. Treats citizenship as shareholding (reducible to economics).
  *   **Impact on Conclusions:**
      *   *Consent:* **Surrenders Conclusion 1.** Demergers require board approval and shareholder votes according to bylaws (Constitution). It forces the negotiator to admit national consent *is* required.
      *   *Equity:* **Strengthens Conclusion 2.** Provides technical vocabulary for valuation.
      *   *Clean Break:* **Modifies Conclusion 3.** Replaces "clean break" with "transitional service agreement."
  *   **Verdict:** This is the superior analog for a **technical committee**. It forces precision on valuation and acknowledges the complexity of retained ties.

  **2. Housing Cooperative**
  *   **The Mapping:** The Union is the Building; Regions are Member Units; Citizens are Members.
  *   **Strengths:** Captures the immovability of territory. You can leave the co-op, but you cannot take the walls (territory/infrastructure) with you.
  *   **Weaknesses:** Implies the member loses all rights upon exit. It does not handle the "portable citizenship" well (you usually lose your share and rights when you leave the co-op).
  *   **Impact on Conclusions:**
      *   *Consent:* **Surrenders Conclusion 1.** Co-op rules dictate exit.
      *   *Equity:* **Supports Conclusion 2.** You get your share back, but you don't take the roof.
      *   *Clean Break:* **Supports Conclusion 3.** You leave, you sever ties.
  *   **Verdict:** Weaker than the Demerger for your specific task because it cannot accommodate the hybrid citizenship protocol you are drafting.

  ### VI. Recommendation

  The **Corporate Demerger** is the better source domain for the work of a joint technical committee.

  *   **Why:** It accommodates the "portable status" of dissenting residents (as retained shareholders/bondholders) and treats the capacity gap as a capitalization issue rather than a moral failing.
  *   **What the Negotiator Must Surrender:** He must surrender **Conclusion 1** (that consent is unnecessary). A demerger cannot happen without following the corporate bylaws. He also must surrender the rhetorical moral high ground of "freedom" (Divorce) in exchange for the technical precision of "reorganization" (Demerger).
  *   **Strategic Gain:** In exchange, he gains a framework that justifies **Conclusion 2** (asset division) with greater technical rigor and modifies **Conclusion 3** (clean break) into a defensible "transitional period," which is likely more realistic for the financial terms you are drafting.

  The divorce analogy is a powerful rhetorical tool for the *campaign*, but it is a dangerous drafting tool for the *committee*. It obscures the hybrid nature of the citizenship protocol and masks the dependency risks of the new state. Switching to the demerger frame will not stop the secession, but it will force the financial terms to reflect the complexity of the separation rather than the simplicity of the split.
