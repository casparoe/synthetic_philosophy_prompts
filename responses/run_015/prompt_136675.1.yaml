answer: |-
  **Task Instruction: Clinical Ethics Tranquilist Assessment Protocol Design and Application**

  **Role:** You are a member of a clinical ethics committee operating under a strict tranquilist framework.

  **Framework Definition:**
  Your committee adheres to **Strict Tranquilism**. The only intrinsic moral goods are:
  1.  **The absence of suffering.**
  2.  **The absence of craving.**

  All other values (continued life, autonomy, dignity, relational presence, narrative coherence) are instrumentally relevant *only* when they causally affect the two intrinsic goods above. You must distinguish the following four categories in all assessments:
  *   **First-order suffering (S1):** Present, experienced distress or pain.
  *   **First-order craving (C1):** Present desire for a state of affairs to differ from what it is (includes appetitive craving [wanting something present] and aversive craving [wanting something absent]).
  *   **Second-order craving (C2):** A desire about one's own first-order mental states (e.g., craving the cessation of one's own suffering, or craving to preserve a particular craving).
  *   **Latent/Dispositional craving (C_latent):** Tendencies to suffer or crave that are not currently manifest but would manifest if conditions change (e.g., in a temporarily unconscious patient).

  **Task:**
  You must produce a single response containing two distinct sections: (1) A practical decision procedure for clinicians, and (2) An application of that procedure to three specific case proposals.

  **Section 1: The Decision Procedure**
  Design a reusable, ordered procedure (rendered as a checklist or flowchart in prose) that a clinician or ethics officer could run on any proposed intervention without requiring philosophical expertise. The procedure must be structured as a series of steps. For each step, you must specify:
  *   (i) The precise question to be answered.
  *   (ii) What counts as a sufficient answer (include operational definitions for terms like "net tranquilist balance" or "latent disposition check").
  *   (iii) Whether the answer must be factual, clinical, or values-based.
  *   (iv) The next branch (proceed, stop with a recommendation, or hand off).

  The procedure must explicitly:
  1.  Incorporate the four tranquilist categories (S1, C1, C2, C_latent) as separate dimensions.
  2.  Identify where tranquilism yields an unambiguous recommendation (yes, no, or modify) based solely on the net effect on the four categories.
  3.  Identify exact points where the procedure must halt and hand the decision to a non-tranquilist authority (family, legal guardian, policy, law) because tranquilism is silent (e.g., where net effects are equal or indeterminate). Explain why the hand-off is necessary at that point.
  4.  Include a **Mechanical Misfire Warning**: Describe a case type where rigorous application produces a recommendation that conflicts with widespread clinical intuition, state what that recommendation is, and explain why the framework still demands it.
  5.  Be explicit about **Judgment Calls**: Flag any steps that are disguised as procedural but require subjective estimation.

  **Section 2: Case Applications**
  Apply your procedure to the following three proposals. For each case, run the steps in order, report where the procedure stops, state the tranquilist recommendation (if any), note any hand-offs, and flag any misfire risk.

  *   **Case A:** A conscious, terminally ill patient requests withdrawal of artificial hydration. The patient reports no physical pain, but describes an intense, persistent appetitive craving for a future event (a family milestone) that they will not live to see. Withdrawal would hasten death and eliminate all future mental states.
  *   **Case B:** A deeply sedated, non-responsive patient is receiving a continuous infusion that suppresses all first-order suffering and craving, but also suppresses respiratory drive, extending a state of unconsciousness with no prospect of recovery. The family requests that the infusion be continued indefinitely because they value being present at the bedside. Discontinuation would likely result in death within hours, with no evidence that the patient would experience suffering or craving during the brief transition.
  *   **Case C:** A proposal to introduce continuous loud instrumental music into a dementia-care ward, based on evidence that it reduces craving-driven wandering and vocalization in approximately 70 percent of residents, but causes mild, persistent headache (first-order suffering) in approximately 30 percent of residents, with no way to predict individual response in advance.

  **Constraints:**
  *   Do not ask for bibliographies, reading lists, or citations to named philosophers or texts.
  *   Do not refer to highly obscure technical literature.
  *   You may invent or formalize operational terms provided they are defined within your response.
  *   Write the response as a single, formal instruction document suitable for inclusion in a dataset of philosophical reasoning prompts. Maintain a professional, clinical tone throughout.
