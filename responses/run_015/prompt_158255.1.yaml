  **Verdict Prediction**
  **Don't Punish.**

  Bentham would likely classify this as a non-offense. While he acknowledges the "pain of antipathy" felt by the parents, he treats pain derived from religious or moral prejudice as illegitimate grounds for legislation unless it threatens public security. Since the act is sterile, private, consensual, and causes no tangible disruption to property or care, the real pleasure of the siblings outweighs the ascetic pain of the parents.

  ***

  **Three Candidate Rules**

  Here are three principles that fit your existing table, ranked by how well they capture Bentham's specific machinery versus a generic liberal view.

  **1. The Direct Injury Principle (Your Friend's View)**
  *   **Rule:** Punish only when there is non-consensual pain, physical harm, or a violation of security expectations directly inflicted upon a participant or a specific third party.
  *   **Prediction for Incest Case:** **Don't Punish.** There is no coercion, no pregnancy, no disease, and no property damage. The parents' distress is psychological and self-inflicted via their beliefs, not a direct injury caused by the siblings.
  *   **Fit:** Explains rape, children, and public nuisance well. Struggles slightly with *why* public indecency is punished if no one is directly harmed (requires "alarm" to count as harm).

  **2. The Security & Alarm Principle (Your "Alarm" View)**
  *   **Rule:** Punish acts that generate widespread public alarm, threaten social stability, or undermine the institutional frameworks (like the family) that secure long-term happiness, even if the immediate act is harmless.
  *   **Prediction for Incest Case:** **Ambiguous / Lean Punish.** The family unit is a utility-engine for Bentham. Incest confuses domestic roles (brother/father, etc.). If the parents' devastation implies a rupture in the domestic peace, a legislator might intervene to preserve the stability of the household structure, regardless of the sterility.
  *   **Fit:** Explains public indecency and the hesitation on commercial sex (exploitation risks).

  **3. The Anti-Ascetic Filter (Your "Anti-Ascetic" View)**
  *   **Rule:** Presume all pleasure is good. Count pain derived from moral, religious, or sympathetic disapproval as **zero**, unless that disapproval manifests as tangible violence or security threats. The legislator must not validate ascetic preferences.
  *   **Prediction for Incest Case:** **Don't Punish.** The parents' pain is explicitly rooted in "sin" and "shame." Under this rule, their suffering is discounted because it stems from prejudice. The siblings' pleasure is real; the parents' pain is "imaginary" (in the legislative sense).
  *   **Fit:** Explains the tolerance for sodomy, masturbation, and celibacy critiques. It explains why Bentham dismisses "public opinion" unless it turns into a riot.

  ***

  **The Bet: Why Rule 3 (Anti-Ascetic Filter) Wins**

  I would bet on **Rule 3**, constrained by Rule 2.

  Your friend's view (Rule 1) is too Millian. Mill systematized the harm principle later; Bentham is more pragmatic and less rights-focused. Bentham *is* willing to punish for alarm (Rule 2), which Rule 1 forbids. However, Bentham distinguishes between *alarm* (a security threat) and *antipathy* (mere disgust).

  Rule 3 is the distinctive Benthamite move. It explains why he tolerates private sodomy despite the intense homophobia of his era. He doesn't ignore the pain of the homophobic public because it doesn't exist; he ignores it because its *source* is ascetic prejudice. In your incest case, the parents' distress is the exact type of "pain of antipathy" Bentham seeks to exclude from the calculus. He would argue that catering to their religious shame sacrifices real pleasure for imaginary sin, which violates the anti-ascetic principle.

  **Does the Anti-Ascetic Principle do work here?**
  Yes, critical work. If the Anti-Ascetic Principle only applied to acts nobody wanted to prohibit (like masturbation), it would be useless. Its entire purpose is to protect pleasures that *are* targeted by moralists (sodomy, incest, usury, prostitution). In this case, it is the only rule that actively invalidates the parents' claim. Rule 1 ignores them because they aren't "harmed" in a physical sense; Rule 3 ignores them because their harm is *illegitimate*.

  ***

  **The Tie-Breaker Case**

  To distinguish Rule 2 (Security/Alarm) from Rule 3 (Anti-Ascetic), use: **Private Bestiality in a Hostile Society.**

  *   **The Case:** An individual engages in sexual acts with an animal in total privacy. The animal feels no pain. However, if the act were discovered, the public would be so outraged that vigilante violence or severe social instability would likely follow.
  *   **Rule 2 (Security/Alarm) predicts:** **Punish.** Even if private, the risk of discovery creates a security threat. The legislator must prevent the *alarm* and potential violence of the public.
  *   **Rule 3 (Anti-Ascetic) predicts:** **Don't Punish.** The public's outrage is based on prejudice/disgust (asceticism). The legislator should not validate this prejudice, provided secrecy is maintained.
  *   **Bentham's Actual Position:** He leans toward **Rule 2**. In his manuscripts on bestiality, he argues that while the act itself may be harmless (no pain to animal), the "danger" of public alarm and the potential for the act to indicate a "depraved disposition" that might lead to other harms justifies interference.
  *   **Why this tells the rules apart:** In your incest case, you stipulated "nothing else follows" (no reputational damage, no violence). This neutralizes Rule 2, making it look like Rule 3 is doing the work. The Bestiality case forces a choice: do we punish to stop the *prejudiced reaction* of others (Rule 2), or do we protect the actor from that prejudice (Rule 3)? Bentham usually prioritizes security over the anti-ascetic ideal when the threat of disorder is tangible.

  ***

  **Flagging Your Table**

  One entry is slightly off: **"Consensual adult male-male sex... other people's disapproval, which he won't count."**

  This is too absolute. Bentham *does* count disapproval, but only when it translates into **danger** or **alarm**.
  *   **Correction:** He won't count disapproval *as a primary mischief*, but he will count the *consequences* of that disapproval (e.g., blackmail, public outrage, domestic violence).
  *   **Why it matters:** In your incest case, if the parents' devastation led them to violence or a public scandal that ruined the siblings' prospects, Bentham might punish the incest not because it's sinful, but because it triggers a security breach. Your table should reflect that "disapproval" is irrelevant *unless* it becomes a security threat. This nuance is the bridge between your "Alarm" view and the "Anti-Ascetic" view.
