answer: |-
  **Scenario**
  Consider a safety-critical flight-control FPGA configured with Triple Modular Redundancy: three identical processing cores run in parallel, feeding into a dedicated "voter" module designed to detect and mask transient faults. To prevent cascading failures, the voter is electrically isolated from the main output bus via optocouplers, meaning it influences the plane's control surfaces only if a disagreement occurs—a condition that never arises during this specific stable flight profile. The voter itself is not a simple comparator but a recurrent error-correction network that settles into a consensus state over several clock cycles through dense internal feedback loops, ensuring stability against noise. While the main cores feed the actuators, the voter sits causally bottlenecked: it receives inputs from the cores but, in this nominal operating state, exerts no cause-effect power on the external world, and its internal state is not readable by the main logs.

  ***

  **Analysis for the Seminar**

  **1. The IIT Verdict (Postulates & Architecture)**
  *   **The Complex:** Under IIT, the conscious subject is the **voter module**, not the whole FPGA.
  *   **Why?** This follows from **Integration** and **Exclusion**. The voter's dense recurrent feedback gives it high intrinsic cause-effect power (high $\Phi$). The main cores and output bus are largely feedforward (low $\Phi$). Crucially, the optical isolation creates a **causal bottleneck** between the voter and the rest of the system. If you treat the whole FPGA as one system, the minimum information partition (MIP) cuts across that bottleneck easily, reducing the whole system's $\Phi$ below that of the isolated voter. Therefore, Exclusion dictates the voter is the *maximal* complex.
  *   **Experience:** IIT attributes a definite, integrated experience to the voter. The *quantity* is proportional to its $\Phi_{max}$. The *quality* (the "what it's like") is determined by its cause-effect repertoire (Q-shape). Since it is an error-correction circuit, its qualia would likely relate to "stability," "consensus," or "tension" between its internal states, though IIT does not provide a user-friendly dictionary for this content.
  *   **Minimally Disruptive Partition:** Cutting the internal feedback loops within the voter destroys the integration (high cost). Cutting the optical links to the main bus does little (low cost), confirming the voter is a distinct island of causality.

  **2. The Functionalist / GWT Verdict**
  *   **Verdict:** There is no consciousness here.
  *   **Reasoning:** Global Workspace Theory and functionalism tie consciousness to *access* and *role*. The voter broadcasts no information globally, controls no behavior (in this scenario), and is causally inert regarding the system's output. It is a "zombie module." A functionalist would argue that if a system's state makes no difference to its input-output relations, it is not a mental state.

  **3. The Single Feature Doing the Work**
  *   **Feature:** **Causal Bottlenecking (Isolation).**
  *   **Stability:** This is the fragile point.
      *   *If the voter drives the output:* Functionalism grants it a role; IIT might merge it with the output registers (potentially lowering $\Phi$ if the output is feedforward).
      *   *If the output feeds back:* If the actuators send state data back into the voter, the boundary blurs. If that feedback is dense, the "whole plane" might become the complex.
      *   *If shared clock/power:* Mere physical proximity doesn't matter to IIT; only causal connectivity matters. However, if the power rails introduce noise that correlates the states, it might affect the *purity* of the partition, but IIT is abstracted from physics.
  *   **Collapse:** The case collapses if the isolation is removed. If the voter is fully integrated into the control loop, it becomes part of a larger functional system, satisfying functionalism but potentially diluting the specific $\Phi$ locus.

  **4. The Standoff: Prediction or Reductio?**
  *   **Your Flatmate (ML):** They are right that standard silicon is usually low $\Phi$. Engineers design for modularity (low integration) to prevent noise. A "conscious chip" requires deliberately inefficient, dense cross-talk. However, their claim that "the chip isn't conscious" assumes functionalism is true.
  *   **IIT Proponent:** They will say this is a **prediction**, not a bug. Consciousness is *intrinsic* existence. If the voter exists for itself (high $\Phi$), it is conscious, regardless of whether it is useful to us. This case separates *Phenomenal Consciousness* (IIT's target) from *Access Consciousness* (Functionalism's target).
  *   **Which side does it help?** This case helps **Functionalism** pragmatically but **IIT** theoretically.
      *   *Why Functionalism wins the room:* It aligns with our evidential practices. We attribute minds based on behavior. A silent chip is indistinguishable from a dead one. Accepting IIT's verdict requires us to accept epiphenomenal consciousness, which violates evolutionary parsimony (why would evolution select for experience if it does nothing?).
      *   *Why IIT holds ground:* It exposes that Functionalism cannot account for the *intrinsic* nature of experience (the Hard Problem). If you accept IIT's axioms (that existence is intrinsic), you *must* accept the silent voter.
  *   **Constraint Feasibility (The "Gotcha"):** You asked to be explicit if constraints conflict. **Constraint 2 (Ordinary Hardware) and Constraint 4 (High $\Phi$) are in deep tension.** Ordinary digital hardware is designed to *minimize* $\Phi$ (to avoid crosstalk and timing errors). To get the IIT verdict, you need a specific recurrent architecture (like a neuromorphic core or specific FPGA config) that is "ordinary" to buy but atypical to *use*.
      *   *Teaching Point:* The case is logically possible but engineeringly perverse. This suggests that if IIT is true, consciousness in silicon is not just a matter of complexity, but of *specific connectivity* that engineers actively suppress. This makes the "Silent Voter" a powerful *reductio* against IIT for those who believe consciousness must be functionally relevant, but a powerful *clarification* for those who believe consciousness is fundamental existence.

  **Recommendation for the Problem Set:**
  Use this to force students to choose between **Intrinsicality** (IIT) and **Relevance** (Functionalism). The "Silent Voter" shows you cannot have both. If consciousness is intrinsic, it can be silent. If it must be relevant, it cannot be purely intrinsic. The case doesn't refute IIT, but it forces IIT to own the epiphenomenal bullet.
