      *   **Problem:** Stalled on decision-making under normative uncertainty. Suspects the problem is about *aggregation* rather than morality.
      *   **Core Diagnosis:** Under empirical uncertainty, values are on a shared scale. Under normative uncertainty, different theories have different scales/units. Multiplying credence by value requires a common unit, which smuggles in first-order commitments.
      *   **Specific Case:** Three options (A, B, C). Two main theories (T1, T2) prefer A and B respectively, both dislike C. A third theory (T3) forbids A. Case-relative normalization makes C win. Removing B changes the result (menu dependence).
