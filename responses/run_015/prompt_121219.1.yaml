      *   *Empirical Uncertainty:* States of the world ($S_1, S_2...$) are distinct from outcomes ($O_1, O_2...$). The utility function $U(O)$ is fixed by the agent's preferences. $U(O)$ is the *same* regardless of which state obtains. Expectation is $\sum P(S_i) \times U(O_i)$. The unit (utils) is stable.
      *   *Normative Uncertainty:* The "theories" ($T_1, T_2...$) are analogous to states, but they *define* the utility function. $T_1$ says $U_1(O)$, $T_2$ says $U_2(O)$. $U_1$ and $U_2$ are not necessarily comparable. $U_1$ might be hedonic (0-10 pleasure), $U_2$ might be deontic (0-1 duty).
      *   *User's Diagnosis:* Correct. The "common unit" is missing. In empirical uncertainty, the agent's valuation is the common unit. In normative uncertainty, the theories provide the valuation, and they disagree on the *metric* as well as the ranking.
      *   *Refinement:* It's not just that they bring their own scales; it's that cardinal utility is only defined up to positive affine transformation ($U' = aU + b$). Without fixing $a$ and $b$ across theories, the sum is meaningless.

