answer: |-
  Your diagnosis is correct: the difficulty is fundamentally one of aggregation, specifically the aggregation of *metrics* rather than merely the aggregation of *verdicts*. Under empirical uncertainty, you are aggregating probabilities over states of the world while holding the valuation function fixed. Under normative uncertainty, you are aggregating valuation functions themselves. Because utility functions are unique only up to positive affine transformation (you can shift the zero point and stretch the scale without changing the theory's empirical implications), summing them requires a rule for fixing these units across theories. Without such a rule, the arithmetic is literally meaningless—like adding meters to seconds.

  Here is an assessment of the four points you raised.

  ### (i) Why Expectation Fails Here But Succeeds There

  Under empirical uncertainty, the "common unit" is provided by your own stable preferences. When you calculate the expected utility of a gamble, the utility of the outcome is determined by *you*, the agent. The state of the world (rain or shine) changes the probability of the outcome, but it does not change the scale on which the outcome is valued. The utility function $U$ is constant across the sum: $\sum P(S_i) \times U(O_i)$.

  Under normative uncertainty, the "states" are moral theories, and each theory brings its own utility function $U_i$. Theory 1 might measure value in "hedons" (0 to 100), while Theory 2 measures it in "duties fulfilled" (0 to 1). To compute $\sum Cr(T_i) \times U_i(O)$, you must assume that 1 unit of $U_1$ is comparable to 1 unit of $U_2$. But moral theories do not come with exchange rates. Utilitarianism does not tell you how many units of utility equal one unit of Kantian dignity.

  Therefore, the "just take the expectation" move fails because it treats the output of moral theories as *cardinal magnitudes* on a shared scale, when they are arguably only *ordinal rankings* within their own scales. Your formulation is sharp: imposing a common unit is indeed a substantive first-order commitment. It asserts that the *spread* of values in Theory 1 is comparable to the *spread* in Theory 2. If Theory 1 is "high stakes" (slavery is infinitely bad) and Theory 2 is "low stakes" (lying is slightly rude), a naive average lets Theory 2 swamp Theory 1 simply because its numbers are larger, unless you normalize. But as you have discovered, normalization introduces its own distortions.

  ### (ii) Assessment of Menu-Dependence

  The menu-dependence you illustrated is a decisive objection to *case-relative normalization* (specifically, range normalization where the best option = 1 and worst = 0). It is not a cosmetic artefact; it reveals that the method does not measure the intrinsic choice-worthiness of an option, but rather its *relative standing* within a specific set.

  This violates the Independence of Irrelevant Alternatives (IIA). In decision theory, IIA violations expose an agent to money pumps. If your preference between A and C flips depending on whether B is available, a clever adversary could:
  1.  Offer you the menu {A, B, C}. You choose C (based on your calculation).
  2.  Charge you a small fee to remove B from the menu.
  3.  Offer you the menu {A, C}. You now prefer A (or are indifferent), or perhaps you prefer C less strongly.
  4.  If the removal of B changes the normalized scores enough to flip the ranking between A and C, you can be pumped.

  In your specific case, the removal of B changes C from a "compromise" (close to both ideals) to an "extreme" (the best for T2, worst for T1). This suggests the whole expected-choice-worthiness picture is misdesigned *if* it relies on range normalization. It implies that the value of an action depends on what other actions are physically possible, which is metaphysically odd for moral value. An action's moral status should not depend on whether a sibling happens to be available to care for the parent.

  However, this is a failure of the *normalization procedure*, not necessarily the entire aggregation project. It shows that you cannot derive inter-theoretic comparison ratios solely from the options available in the local decision context. You need an external anchor.

  ### (iii) Comparison of Alternatives

  Here is how the escape routes fare against your two worries: **Menu-Sensitivity** (IIA) and the **Unendorsed Winner** (the "compromise" problem).

  **1. My-Favourite-Theory (MFT)**
  *   **Menu-Sensitivity:** None. It follows the ordinal ranking of the highest-credence theory.
  *   **Unendorsed Winner:** Impossible. It always picks a top-ranked option of the favourite theory.
  *   **Assessment:** This avoids the aggregation problem by refusing to aggregate. However, it violates a dominance principle: if *every* theory ranks X above Y, MFT might still choose Y if the favourite theory ranks Y above X. It also ignores the intensity of your uncertainty. It is robust but arguably irrational for a non-dogmatic agent.

  **2. Variance-Style Normalization**
  *   **Menu-Sensitivity:** High. Like range normalization, calculating the variance (or standard deviation) of a theory's values depends on the set of options available. If you add an extreme outlier option, the variance expands, shrinking the normalized scores of all other options.
  *   **Unendorsed Winner:** Likely. It still averages normalized scores, so a compromise option that is "okay" for everyone can beat an option that is "great" for some and "terrible" for others.
  *   **Assessment:** Mathematically smoother than range normalization (less sensitive to outliers), but structurally vulnerable to the same IIA objections.

  **3. Global Scale Normalization**
  *   **Menu-Sensitivity:** None. If units are fixed across all possible worlds, removing option B does not change the value of A or C.
  *   **Unendorsed Winner:** Likely. The averaging problem remains.
  *   **Assessment:** This saves the formal framework but fails the epistemic constraint. As you noted, it requires a "view from nowhere" to judge that 10 hedons = 1 duty. It solves the math by assuming the very moral knowledge the agent lacks.

  **4. Nash Bargaining Solution**
  *   **Menu-Sensitivity:** Depends on the "disagreement point." If the disagreement point is fixed (e.g., the status quo), menu sensitivity is reduced. If it is relative to the menu, the problem persists.
  *   **Unendorsed Winner:** Almost Guaranteed. Bargaining solutions are designed to find compromise points that maximize the product of gains over the disagreement point. Option C is the classic bargaining outcome.
  *   **Assessment:** Your worry is correct: this relocates the problem. Bargaining requires a metric of "gain" for each party (theory). Determining that gain requires the same inter-theoretic comparisons the framework was meant to solve. Furthermore, it imports a commitment to *fairness between theories*. Why should a theory you believe is false (10% credence) have veto power or bargaining leverage against a theory you believe is likely true?

  **On the "Unendorsed Winner":**
  Is it a reductio that Option C wins when no theory endorses it? Not necessarily. In prudential rationality, if you are unsure whether you prefer apples or oranges, buying a fruit salad is rational, even if you would prefer a pure apple if you knew you liked apples best. This is *moral hedging*. The problem arises only if the theories are *deontological* rather than *axiological*. If T1 says "Maximize Good" and T2 says "Maximize Duty," C might be permissible. But if T1 says "Only A is permissible" and T2 says "Only B is permissible," then C is forbidden by both. The averaging framework obscures this distinction by converting all verdicts into scalars.

  ### (iv) Forbidden vs. Merely Bad (Deontic Constraints)

  This is a separate problem that a purely cardinal framework cannot represent without distortion.

  Standard expected utility theory assumes *continuity* and *trade-offs*. It assumes that for any risk of a bad outcome, there is some probability of a good outcome that makes the gamble acceptable. Deontic constraints (e.g., "Do not kill an innocent") are often modeled as *lexical* or *infinite* disvalues.

  If Theory 3 says A is *forbidden*, it does not necessarily mean $U_3(A) = -1,000,000$. It means $A$ is excluded from the choice set regardless of the upside. In your example, T3 has only 10% credence. If we treat "forbidden" as a very large negative number, the 90% credence in T1/T2 (which love A) can mathematically overwhelm the 10% veto.
  *   $0.9 \times 100 + 0.1 \times (-1,000,000) < 0$ (A is rejected).
  *   $0.9 \times 100 + 0.1 \times (-100) > 0$ (A is accepted).

  The result depends entirely on how you translate the deontic concept "forbidden" into a cardinal number. But the concept of a constraint is precisely that it resists such translation. It is not a weight to be balanced; it is a side-constraint.

  Therefore, a linear expectation framework is category-mistaken for handling deontic uncertainty. It treats moral theories as *investments* (where you balance risk and return) rather than *legislators* (where some propose laws that veto others). To handle this, you would need a non-linear aggregation rule, such as:
  1.  **Veto Power:** If any theory with credence above threshold $k$ forbids an option, it is removed from the choice set before maximization.
  2.  **Lexical Priority:** Deontic verdicts trump axiological verdicts.

  **Conclusion:**
  Your diagnosis is right. The stall in your reading group is due to the **Inter-theoretic Comparison Problem**. You cannot aggregate what you cannot measure on a common scale.
  *   **Range normalization** fails because it makes value menu-dependent (violating IIA).
  *   **Global normalization** fails because it requires impossible moral knowledge.
  *   **Bargaining** fails because it smuggles in fairness commitments and still requires comparable units.
  *   **Cardinal Expectation** fails to capture deontic constraints (forbidden vs. bad).

  The cleanest formulation of the difficulty is this: **Normative uncertainty requires a meta-ethical account of how different moral properties (pleasure, duty, virtue) map onto a single currency of 'choice-worthiness.'** Without that account, the mathematics of expectation is an empty syntax. The "Unendorsed Winner" is only a problem if you view moral theories as prescribing specific actions rather than ranking states of affairs; if they rank states, hedging (Option C) is rational. But the menu-dependence is a fatal flaw for case-relative normalization, suggesting that if a solution exists, it must rely on fixed, external units of moral value—which brings you back to the worry that you are just doing first-order ethics in disguise.
