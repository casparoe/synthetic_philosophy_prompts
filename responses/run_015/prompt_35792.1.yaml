      *   *Refining the "Above Average" point:* The prompt mentions "adding lives just above the historical average." If I add lives *above* average, Average Utilitarianism says that's good. Total Utilitarianism also says that's good. Where they diverge is adding lives *below* average (but positive). I need to make sure I address the prompt's specific phrasing while correcting/clarifying the philosophical standard objection. The prompt says "something about whether adding lives just above the historical average makes the world better." Actually, that's not the embarrassing implication. The embarrassing implication is adding lives *below* average. I should clarify this distinction. Wait, maybe the user is thinking of the *Mere Addition Paradox* which involves Total Utilitarianism? No, the prompt asks about *Average* View implications. I will clarify that the embarrassing implication is actually about adding lives *below* the average (but still good), which Average Utilitarianism forbids. Or perhaps the user means: Does adding lives *above* average make it *obligatory*? (Yes). I will focus on the "Below Average but Worth Living" problem as the main embarrassment, as that's the standard counter to Average Utilitarianism.
