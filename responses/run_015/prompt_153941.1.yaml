  The paradox dissolves if you reject Step (5), as lowering confidence in a normative principle does not eliminate its provisional authority, though this costs us the comfort of epistemic foundationalism. Step (5) commits a modal error by assuming that for a principle like M to be actionable, it must be held with certainty; however, epistemic modesty is inherently fallibilist, allowing one to apply M while simultaneously acknowledging that one's acceptance of M is contingent on evolutionary or educational factors. The argument relies on an equivocation between truth-apt beliefs, which are debunked by causally independent genealogies, and normative principles, whose validity is determined by coherence and indispensability rather than causal tracking. By rejecting Step (5), you preserve the utility of outside-view reasoning without requiring it to rest on an unshakeable inside-view foundation, but you must accept that your entire epistemic framework is contingent and justified only by its reflective equilibrium rather than by external verification. This rejection avoids the self-defeat charge because one can consistently hold that M is likely true and useful even if one's confidence in it is reduced from certainty to high probability, thereby maintaining the reason to apply it without violating its own modesty constraints.
