prompt: |-
  I direct the translation and measurement team for a multi-country health and well-being survey that runs in a little over forty languages. Every week my analysts review a few dozen items where the same question, asked in two languages, produces response distributions that we do not think mean the same thing. Each of these items has to receive one of four verdicts: pool as-is; adapt the wording and pool with a documented caveat; do not pool for this language; or send the item back to the design team as unusable across the whole survey. At the moment the calls are made on instinct, different analysts decide differently, and we have been burned in both directions — pooling items that a reviewer later showed were not comparable, and dropping whole countries from a headline comparison for what turned out to be a bad translation.

  What I want is a decision procedure my team can actually run, grounded in what the linguistic relativity literature genuinely supports rather than in what a first-year textbook says it says. Two constraints on the theory side. First, I keep being told that the Sapir–Whorf hypothesis was refuted decades ago, and I need the procedure built out of only what survives that refutation: I do not want any step that assumes language determines what a person can represent or think, and I do want it said explicitly which familiar-sounding steps are of that kind and must be left out. Second, my current working rule — flag an item only when the cross-language difference sits in obligatory grammar, and ignore differences that are merely lexical — has started to look wrong to me. Please test it against the cases below and either repair it or replace it, naming the cases that break it and saying what the repaired rule costs us in false alarms.

  On the practice side: the procedure has to be executable in about twenty minutes by an analyst whose only training is a single undergraduate linguistics course, and it has to terminate in one of my four verdicts. For each step, say what would count as a sufficient answer, and whether the answer can be found in materials we already hold — translation notes, back-translations, cognitive interview transcripts, split-sample data — or requires a question to the country team, whose time I can spend at roughly two hours per flagged item and no more. Where a question is settled by fact, the procedure should settle it. Where it is settled by what we want the survey to claim — whether a construct is intended to travel or is allowed to be culture-specific — the procedure should stop, hand the decision to me, and say in plain language what I am choosing between. I also need a one-page version, free of theory vocabulary, for the sign-off meeting with country coordinators, and I want it marked honestly which steps are real tests and which are judgment calls with a checklist wrapped around them.

  Then run the procedure on three items from current work. For each, give me the verdict, the step at which the procedure reached it or the point at which it stopped and handed over, and the short plain-language paragraph I would take into sign-off.

  1. In Language A, the verb obligatorily marks the source of the speaker's information: whether they witnessed the thing, inferred it, or were told it. Our confidence item — How confident are you that the health information you get from your clinic is accurate? — could only be rendered in the reported form, and mean confidence came out well below the pooled sample. Our cognitive interviews suggest that respondents given the inferred form would score differently again. Is this a translation and encoding problem to be fixed by rewording, a difference in how speakers of A are led to construe confidence, or a substantive difference in trust in clinics?

  2. In Language B, every clause describing an event must mark its cause as either an agent acting intentionally or an impersonal process. Our self-efficacy item — How much control do you feel you have over your own health? — came back from back-translation in the impersonal-cause form; the translator said the agentive form reads as boastful and unnatural. Scores are lower than the pooled sample. Note two things: the item was designed to measure individual agency over health, a local advisory group has asked us to drop it as culturally inappropriate, and our funders have the self-efficacy index written into the deliverables.

  3. This is the one I expect not to like. Our headline single item — Overall, how satisfied are you with your life these days? — has no general evaluative term in Language C. The nearest word is closer to contentment with the lot one has been given; it carries no implication that a life is the sort of thing one assesses, or could improve. That item is what the cross-national ranking and all the press coverage rest on. If the procedure says Language C cannot be pooled, I want that said plainly, together with whatever the procedure then implies about the other thirty-nine languages — because I suspect the same argument tells against our English item as well, and I need to know whether I have to go to the funders and say so.

  Finally, tell me what the procedure cannot do. I especially want to know how it handles, or fails to handle, the standing confound that in our sample every linguistic difference is paired with a non-linguistic one — different health systems, different schooling, different interview settings, different norms about giving scalar answers — and what it should say when an item is answered by people responding in a second language rather than their first.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Director of translation and measurement team for a multi-country health survey (40+ languages).
      *   **Problem:** Inconsistent decision-making on cross-language item comparability (pool vs. adapt vs. drop vs. redesign). Current method is instinct-based. Current rule (obligatory grammar vs. lexical) is suspected to be flawed.
      *   **Constraints (Theory):**
          *   Must be grounded in *surviving* linguistic relativity literature (no strong Sapir-Whorf determinism).
          *   Must explicitly identify and exclude steps assuming language *determines* thought.
          *   Must test/repair/replace the current "obligatory grammar vs. lexical" rule.
      *   **Constraints (Practice):**
          *   Executable in ~20 mins by an analyst with 1 undergrad linguistics course.
          *   Must terminate in one of 4 verdicts (Pool, Adapt+Pool, Do Not Pool, Redesign).
          *   Must specify data sources (existing vs. country team query).
          *   Must distinguish factual settlements from value/policy decisions (handed to Director).
          *   Needs a 1-page "plain language" version for sign-off.
      *   **Task:** Run the procedure on 3 specific cases.
      *   **Task:** Explain limitations (confounds, L2 speakers).

  2.  **Deconstruct the Theory (Linguistic Relativity):**

      *   *Strong Whorfianism (Determinism):* Language *prevents* certain thoughts. (REJECT THIS).
      *   *Weak Whorfianism (Influence/Bias):* Language makes certain thoughts more *accessible*, *habitual*, or *salient* during online processing. (ACCEPT THIS).
      *   *Key Insight for Surveys:* It's not about what respondents *can* think, but what the question *prompts* them to attend to. Grammatical obligatoriness forces attention (e.g., evidentiality, agency), whereas lexical choice offers options.
      *   *Critique of Current Rule:* "Flag only obligatory grammar, ignore lexical" is too simple. Lexical gaps (like "satisfaction" vs. "contentment") can be just as disruptive as grammar if they shift the construct definition. However, obligatory grammar is a *higher risk* flag because the respondent *cannot* answer without making that distinction.
      *   *Revised Rule:* Focus on "Obligatory Attention" vs. "Optional Nuance." If the target language *forces* a distinction the source didn't intend, it's a high-risk bias. If the target language *lacks* a concept entirely, it's a construct validity issue.

  3.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* 20 minutes, low expertise.
      *   *Structure:* Flowchart style.
      *   *Steps:*
          1.  **Data Check:** Is the statistical difference significant? (If no, Pool).
          2.  **Linguistic Mechanism:** Is the difference driven by obligatory grammar or lexical gap?
          3.  **Construct Alignment:** Does the forced distinction/missing word change *what* is being measured?
          4.  **Remediation:** Can we reword without breaking the grammar/culture?
          5.  **Policy Handoff:** If construct is fundamentally different, Director decides on pooling strategy.

      *   *Refining the "Obligatory vs. Lexical" Rule:*
          *   *Old Rule:* Flag obligatory, ignore lexical.
          *   *Problem:* Case 3 (Life Satisfaction) is lexical/semantic but breaks the construct. Case 1 (Evidentiality) is obligatory and breaks the construct.
          *   *New Rule:* Flag **Obligatory Distinctions** (High Risk) AND **Construct-Essential Lexical Gaps** (High Risk). Ignore **Stylistic/Connotative Lexical Variations** (Low Risk).
          *   *Cost:* Increased false alarms (flagging items that turn out to be okay), but better than missing validity threats.

  4.  **Drafting the Procedure (Iterative refinement for constraints):**

      *   *Step 1: Statistical Trigger.* (Data: Split-sample/DIF).
      *   *Step 2: The "Forced Choice" Test.* (Data: Translation notes/Back-translation). Does the grammar *force* the respondent to categorize something the source didn't? (e.g., Evidentiality, Agency).
      *   *Step 3: The "Concept Match" Test.* (Data: Cognitive Interviews). Does the word used mean the same *kind* of thing? (e.g., Satisfaction vs. Contentment).
      *   *Step 4: Fixability.* (Data: Analyst judgment + Translation notes). Can we rephrase?
      *   *Step 5: Policy Decision.* (Director). Do we need strict comparability or local validity?

  5.  **Addressing the Three Cases:**

      *   *Case 1 (Evidentiality):* Obligatory grammar. Forces respondent to specify source of info. Changes construct from "confidence" to "source verification." Verdict: Adapt/Redesign.
      *   *Case 2 (Agency/Grammar + Culture):* Obligatory agentivity. Cultural norm (boastfulness) conflicts with construct (self-efficacy). Verdict: Policy Handoff (Construct vs. Deliverable).
      *   *Case 3 (Life Satisfaction):* Lexical gap/Construct shift. "Contentment" vs. "Evaluation." Verdict: Policy Handoff (Headline metric validity).

  6.  **Addressing Limitations:**

      *   *Confounds:* Language is always bundled with culture/system. The procedure isolates *linguistic* mechanism, but cannot prove the *cause* of the score difference definitively. It identifies *plausibility*.
      *   *L2 Speakers:* Procedure assumes L1. L2 adds cognitive load. Need a specific flag for this.

  7.  **Drafting the Content (incorporating tone and constraints):**

      *   *Tone:* Professional, direct, authoritative but humble about theory.
      *   *Theory Check:* Ensure I explicitly state "We are not claiming speakers of A *cannot* think X." We are claiming the question *prompts* X differently.
      *   *One-Pager:* Needs to be jargon-free. "Forced Distinctions" instead of "Obligatory Grammar."

  8.  **Review against Constraints:**

      *   *20 mins?* Yes, if data is ready.
      *   *4 Verdicts?* Yes.
      *   *Theory?* Weak relativity only.
      *   *Cases?* All run.
      *   *Limitations?* Addressed.

  9.  **Final Polish:** Check the "False Alarm" cost. The new rule flags more than the old one (lexical gaps included). This is the trade-off. I need to state this clearly.

      *(Self-Correction during drafting)*: I initially thought about suggesting statistical testing in the procedure. But the prompt says analysts review items *where distributions already differ*. So Step 1 is assumed. I need to focus on *why* they differ.
      *Correction:* The procedure starts *after* the statistical flag.

      *(Refining Case 2)*: This is tricky. It's grammar + culture + funder requirement. The procedure must stop and hand to the Director because it's a policy conflict, not just a linguistic one.

      *(Refining Case 3)*: This challenges the English source. The procedure must allow the analyst to flag the *source* item as potentially flawed, not just the translation.

  10. **Finalizing the Output Structure:**
      *   Introduction (Theory grounding).
      *   The Procedure (Step-by-step).
      *   The "One-Pager" (Sign-off version).
      *   Case Studies (Application).
      *   Limitations (Confounds & L2).

      *Let's write it.*
answer: |-
  ## Part 1: Theoretical Grounding & Rule Repair

  ### What Survives the Refutation
  You are correct to be wary of strong determinism. The "Strong Sapir-Whorf" hypothesis (language *prisons* thought) is dead. However, **Neo-Whorfianism** (language *biases* attention) is robustly supported.

  *   **Keep:** The principle of **Obligatory Attention**. If a language *forces* a speaker to encode a distinction (e.g., tense, evidentiality, agency) every time they speak, it makes that distinction more cognitively accessible during the survey task. It does not mean they *cannot* understand the source concept, but it means the survey question triggers a different mental routine.
  *   **Discard:** Any step that assumes a speaker of Language A is *incapable* of understanding "confidence" without evidential markers, or that Language C speakers *cannot* evaluate their lives. We are measuring **measurement bias**, not cognitive capacity.

  ### Repairing Your Working Rule
  **Current Rule:** *Flag only obligatory grammar; ignore lexical differences.*
  **Verdict:** **Broken.**
  **Why:** Case 3 (Life Satisfaction) proves that a lexical gap can destroy construct validity just as effectively as grammar. If the target language lacks the concept of "evaluative satisfaction" and substitutes "fatalistic contentment," you are measuring different constructs, even if no grammar is involved. Conversely, some obligatory grammar (e.g., gendered nouns for inanimate objects) rarely impacts health survey responses.

  **Repaired Rule:** **Flag "Construct-Forcing" Features.**
  1.  **Obligatory Grammar:** Flag if the grammar forces a distinction (source, agency, time) that the source question treats as irrelevant or open.
  2.  **Construct-Essential Lexicon:** Flag if the only available translation shifts the *definition* of the construct (e.g., "control" vs. "fate," "satisfaction" vs. "acceptance").
  3.  **Ignore:** Stylistic, connotative, or register differences that do not alter the core construct definition.

  **Cost:** This increases **False Alarms**. You will flag items that turn out to be statistically comparable despite the linguistic difference. This is the correct trade-off for your context: it is cheaper to investigate a false alarm than to publish a invalid cross-country comparison.

  ***

  ## Part 2: The Decision Procedure (20-Minute Protocol)

  **Prerequisites:** Analyst has the item, the translation/back-translation, cognitive interview notes, and the split-sample statistical flag.

  **Step 1: The "Forced Choice" Test (5 mins)**
  *   **Question:** Does the target language grammar *force* the respondent to specify information the source question leaves open?
  *   **Look for:** Evidentiality (how do you know?), Agency (who did it?), Time (is it ongoing or done?), Number (singular/plural distinctions where source is vague).
  *   **Data Source:** Translation notes, Back-translation, Analyst's linguistic knowledge.
  *   **Sufficient Answer:** "Yes, the verb ending forces X" or "No, the grammar allows the same vagueness as the source."
  *   **Decision:**
      *   If **NO**: Go to Step 2.
      *   If **YES**: This is a **High-Risk Linguistic Bias**. Go to Step 3.

  **Step 2: The "Concept Match" Test (5 mins)**
  *   **Question:** Does the translated word mean the same *kind* of thing as the source word, or does it shift the definition?
  *   **Look for:** Words that imply fate, religious acceptance, social harmony, or physical sensation when the source implies psychological evaluation or individual agency.
  *   **Data Source:** Cognitive interview transcripts (do respondents talk about "fate" when asked about "control"?), Translation notes.
  *   **Sufficient Answer:** "The word implies X, which matches the construct" or "The word implies Y, which contradicts the construct."
  *   **Decision:**
      *   If **MATCH**: Go to Step 4.
      *   If **MISMATCH**: This is a **High-Risk Construct Shift**. Go to Step 3.

  **Step 3: The "Fixability" Check (5 mins)**
  *   **Question:** Can we reword the item in the target language to match the source construct *without* sounding unnatural or violating grammar rules?
  *   **Data Source:** Translation notes, Analyst judgment. (Do **not** contact country team yet).
  *   **Sufficient Answer:** "Yes, we can phrase it as..." or "No, the grammar/lexicon makes this impossible."
  *   **Decision:**
      *   If **YES**: Verdict = **Adapt and Pool with Caveat**. (Document the change).
      *   If **NO**: Go to Step 4.

  **Step 4: The Policy Handoff (5 mins)**
  *   **Question:** Is the construct intended to be universal (strict comparability) or locally valid (descriptive accuracy)?
  *   **Data Source:** **This is not a fact.** This is a strategic decision.
  *   **Action:** Stop procedure. Hand to Director.
  *   **Input to Director:** "Language [X] forces a distinction/shift that changes the construct. We can either: (A) Drop this language from the index (loses coverage), or (B) Pool it and admit the metric measures slightly different things (loses validity), or (C) Redesign the item globally (costly)."
  *   **Verdict:** **Director Decision** (leads to Do Not Pool, Redesign, or Pool with Major Warning).

  ***

  ## Part 3: The One-Page Sign-Off Version
  *(For Country Coordinators. No theory vocabulary.)*

  **Item Comparability Check-List**

  **Purpose:** To ensure that when we compare scores across countries, we are comparing the same thing.

  **Step 1: The "Extra Information" Check [Real Test]**
  *   Does the translation require the respondent to give specific details (like *how* they know something, or *who* did it) that the English question does not ask for?
  *   *If Yes:* The question is harder or different in this language. **Flag for Review.**

  **Step 2: The "Word Meaning" Check [Real Test]**
  *   Does the main word in the question (e.g., "Control," "Satisfied") mean something different in this culture (e.g., "Fate," "Acceptance")?
  *   *Evidence:* Check cognitive interviews. Do respondents talk about God/Luck instead of themselves?
  *   *If Yes:* The question measures a different concept. **Flag for Review.**

  **Step 3: The "Fix" Check [Judgment Call]**
  *   Can we change the wording to match the original meaning without sounding strange?
  *   *If Yes:* **Verdict: Adapt.** (We change the words, keep the data).
  *   *If No:* **Verdict: Director Decision.** (We must choose between keeping the country or keeping the strict comparison).

  **Notes on Judgment:**
  *   Steps 1 & 2 are based on linguistic facts and interview transcripts.
  *   Step 3 involves a choice between scientific strictness and country inclusion. This choice belongs to the Survey Director.

  ***

  ## Part 4: Running the Procedure on Your Cases

  ### Case 1: The Evidentiality Item (Language A)
  *   **Step 1 (Forced Choice):** **YES.** The verb *obligatorily* marks source (witnessed vs. reported). The source question ("How confident are you...") does not ask for source. The translation forces the respondent to categorize the information source to answer the grammar.
  *   **Step 2 (Concept Match):** **MISMATCH.** Cognitive interviews confirm scores change based on the grammatical form used. The construct has shifted from "confidence in accuracy" to "confidence based on source type."
  *   **Step 3 (Fixability):** **NO.** You cannot remove obligatory grammar without breaking the language. Rewording to avoid the verb might make the item unnatural or vague.
  *   **Step 4 (Policy Handoff):** **STOP.**
  *   **Verdict:** **Director Decision.**
  *   **Sign-off Paragraph:** "In Language A, grammar forces respondents to specify how they know the health information (heard it vs. saw it). The original question does not ask this. This artificially lowers scores because the grammar implies uncertainty. We cannot fix this with wording. You must decide: do we exclude Language A from the 'Confidence' index to protect the metric, or do we include it and note that the score reflects grammatical uncertainty rather than true trust?"

  ### Case 2: The Self-Efficacy Item (Language B)
  *   **Step 1 (Forced Choice):** **YES.** Grammar forces a mark of Agency (Intentional vs. Impersonal).
  *   **Step 2 (Concept Match):** **MISMATCH.** The construct is "Individual Agency." The natural translation uses "Impersonal Process." The "Agentive" form exists but is culturally marked as "boastful."
  *   **Step 3 (Fixability):** **NO.** Using the correct grammatical form creates a social desirability bias (respondents won't admit to being agents). Using the natural form destroys the construct validity.
  *   **Step 4 (Policy Handoff):** **STOP.**
  *   **Verdict:** **Director Decision.**
  *   **Sign-off Paragraph:** "Language B grammar requires marking actions as either 'personal choice' or 'impersonal process.' To measure self-efficacy, we need 'personal choice.' However, locals view this phrasing as boastful, leading to low scores. The local team advises dropping it; funders require it. This is a conflict between cultural validity and contractual deliverables. I need a decision on whether to prioritize the funder's index or the local team's advice to drop the item."

  ### Case 3: The Life Satisfaction Item (Language C)
  *   **Step 1 (Forced Choice):** **NO.** (This is lexical, not grammatical).
  *   **Step 2 (Concept Match):** **MISMATCH.** The available word means "contentment with fate" not "evaluative satisfaction." This changes the construct from *active evaluation* to *passive acceptance*.
  *   **Step 3 (Fixability):** **NO.** There is no general evaluative term.
  *   **Step 4 (Policy Handoff):** **STOP.** (With a specific note on the Source).
  *   **Verdict:** **Director Decision (Global Implication).**
  *   **Sign-off Paragraph:** "Language C has no word for 'Life Satisfaction' as an evaluation; the closest word means 'acceptance of fate.' This suggests the item measures different things in Language C vs. English. Crucially, this implies the English item may also be culturally specific (assuming life *can* be evaluated). If we exclude Language C, we lose the headline ranking. If we include it, we admit the ranking compares 'evaluation' against 'acceptance.' I recommend we pause the headline release to review if the English construct is as universal as we claim."

  ***

  ## Part 5: What The Procedure Cannot Do

  **1. The "Bundle" Confound**
  The procedure isolates *linguistic* mechanisms. It cannot disentangle language from culture.
  *   *Problem:* In Case 2, is the low score due to the grammar (impersonal cause) or the cultural norm (don't boast)? The procedure flags the *risk*, but it cannot prove the *cause*.
  *   *Handling:* The procedure treats them as a single "Construct Shift" risk. It forces the Policy Handoff because disentangling them requires ethnographic research, not linguistic analysis.
  *   *Limitation Statement:* "This protocol identifies where language *could* cause the difference. It cannot prove that culture or health systems *did not* cause the difference. When a flag is raised, assume the cause is mixed."

  **2. The L2 (Second Language) Confound**
  The procedure assumes respondents are answering in their dominant language.
  *   *Problem:* If a respondent answers in a second language (e.g., a minority speaker using the national survey language), cognitive load increases. They may default to simpler response patterns (e.g., midpointing) not because of the translation, but because of processing effort.
  *   *Handling:* The procedure has no step for this.
  *   *Recommendation:* Add a **Step 0** to the protocol: "Check demographic data for L2 speakers." If >10% of the sample for that language are L2 speakers, **Automatic Verdict: Do Not Pool** (or require a specific L2 covariate analysis). This is a factual filter, not a judgment call.

  **3. The "False Positive" Cost**
  By expanding the rule to include Lexical Gaps (Case 3), you will flag more items.
  *   *Consequence:* You will send more items to "Director Decision."
  *   *Justification:* This is intentional. Your current system drops countries based on bad translations. It is better to overload the Director with policy choices than to overload the dataset with invalid comparisons. The procedure shifts the burden from the *analyst's instinct* to the *Director's strategy*, which is where it belongs.
