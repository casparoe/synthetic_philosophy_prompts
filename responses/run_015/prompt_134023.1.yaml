          2.  The Zero Status vs. Some Status Question.
          3.  The Population vs. Individual Split.
          4.  The Wolbachia/Preventing Life Confusion.
          5.  The "Least-Suffering" Petition (Operational Reality).
          6.  The Science of Sentience (Settled vs. Contested).
      *   *Key Insight:* The board is practicing **"Subordinate Consideration."** Insects don't have rights that stop the program, but they have interests that shape the *method*. This is philosophically stable.
      *   *Refining the "Pest" definition:* Pesthood is functional (threat to humans). Moral status is intrinsic (capacity to suffer). They operate on different axes.
      *   *Refining the "Replacement" argument:* If the niche is full, killing adults just makes room for larvae. Larvicide prevents the life entirely. This changes the *type* of harm, not necessarily the *number* of mosquitoes eventually.
      *   *Reading Aloud Check:* Keep sentences relatively short. Avoid jargon like "lexical threshold" without explanation. Use bullet points.

