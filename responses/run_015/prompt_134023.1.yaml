      *   *American English?* Check spelling (behavior, program, etc.).
      *   *Flagging reconstructed views:* I need to explicitly state when I'm attributing a view they haven't articulated.

  7.  **Final Polish:** (Mental check of the "Least-Suffering" petition analysis). The petition says "count births prevented as a harm to the population." This is utilitarian population ethics. If the board adopts this, they might have to argue that a mosquito life is worth living. Given predation/disease, it's likely not. So preventing birth is likely *good* or *neutral*, not harm. I need to make sure this distinction is clear.

