      *   **Goal:** Understand the philosophical presuppositions of their current practice. What *must* they believe for it to hang together? What is underdetermined?
      *   **Specific Questions:**
          *   Does triggering on population + choosing means by individual death commit them to a specific split (status for populations vs. individuals)?
          *   Is the practice consistent with insects having *zero* moral status (is the humane clause just sentiment)?
