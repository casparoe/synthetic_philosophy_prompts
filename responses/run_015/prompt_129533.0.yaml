answer: |-
  Let's treat "modal leakage" as the specific problem of normative gravity: why does a future event exert a pulling force on my present will, such that I am bound *now* by something that hasn't happened *yet*?

  ### Perdurantism: The Structural Bind vs. The Agential Gap

  On perdurantism, you are a four-dimensional worm. The future stage that undertakes the commitment is literally a slice of the same entity that you are right now.

  **The Advantage:** Ontologically, the connection is seamless. There is no mystery about *who* is bound. The worm is bound. The commitment is a global property of the entire spacetime manifold that constitutes you. Modal leakage isn't "leakage" here; it's structural integrity. The future slice and the present slice are co-parts of a single object. If the future slice is "committed," the worm is "committed," and since you are the worm, you are committed.

  **The Disadvantage:** This structural integrity kills the normative force. In the standard block-universe picture accompanying perdurantism, the future part already exists. If the future part exists, the commitment is already fulfilled (or broken). There is no "binding" happening now, only the present stage *discovering* the worm's shape.
  If you try to salvage agency (e.g., via a "growing block" or open future perdurantism), you run into the **Temporal Parochialism Problem**. Why should Stage-Now care about Stage-Later? They are spatiotemporally distant parts. My left hand is part of me, but if my left hand signs a contract while I sleep, I can dispute it. Mereological summation doesn't guarantee normative unity. Perdurantism explains why the future self *is* you, but it struggles to explain why the future self's plans *constrain* you. The "leakage" is ontologically secure but normatively inert.

  **On Destruction:** If you break the commitment, do you destroy part of yourself? In a static block, you can't break it; you simply are a worm that breaks it. But if we assume an open future where the worm is being built: yes, breaking the commitment is ontologically violent. You are preventing a specific temporal part from coming into existence. You are literally amputating a future segment of your own spacetime volume. This makes breaking a promise a form of self-mutilation.

  ### Endurantism: The Agential Bind vs. The Property Gap

  On endurantism, you are wholly present. You do not have future parts. The future commitment is not a location on a worm; it is a property you bear *now*.

  **The Advantage:** This view captures the phenomenology of binding perfectly. *You* are here, making a promise. The normative weight lands squarely on the present substance. Modal leakage is explained as **intentional projection**. You extend your will across time. The binding force is real because the agent is singular and continuous. There is no "other" future stage to negotiate with; there is only you, persisting.

  **The Disadvantage:** The ontological grounding is slippery. To say you bear the property "being-committed-to-X-in-2050" *now* requires a robust theory of **temporal properties**. You have to claim that an object can have a property essentially defined by a non-existent future time without that property being a disguised reference to a temporal part.
  Critics argue this *is* smuggling. If "being-committed-at-t" is just a relation between you and a time, what grounds the truth of that relation now if the relata (the future event) doesn't exist? The endurantist must posit that the *potentiality* is a real feature of the present object. If they can't ground this without referencing a "future stage," they collapse into stage theory. If they can, they rely on a metaphysics of powers or dispositions that some find occult.

  **On Destruction:** If you break the commitment, do you destroy part of yourself? No. You have no future parts to destroy. You merely undergo a **Cambridge change** or a qualitative shift. You go from having the property "committed" to having the property "reneged." You remain numerically identical. The loss is moral, not ontological. You haven't cut off a piece of your being; you've just changed your character.

  ### The Verdict on Modal Leakage

  **Which story is cleaner?**
  For the specific phenomenon of **Modal Leakage** (the feeling of being bound now by the future), **Endurantism has the cleaner story.**

  Perdurantism solves the identity problem ("Is that future guy me?") but fails the binding problem ("Why does his schedule boss me around?"). It turns the commitment into a static fact about a worm, which renders the experience of "being bound" an illusion of the present stage.

  Endurantism solves the binding problem ("I am the one bound") but struggles with the grounding problem ("What makes this true now?"). However, since "Modal Leakage" is fundamentally about normative force and agency, Endurantism's ability to locate the commitment in the present substance without chopping the self into slices makes it the superior fit for the phenomenon you described.

  **Where they get stuck:**
  *   **Perdurantism** gets stuck on **Normative Inertia.** It can't explain why the present stage should sacrifice for a future stage without appealing to prudential rationality that feels external to the metaphysics. It also makes "breaking" a commitment either impossible (block) or ontological self-harm (growing block).
  *   **Endurantism** gets stuck on **Ontological Grounding.** It risks treating future-dependent properties as magical or reducible to linguistic tricks. It must insist that the future, though non-existent, can still predicate properties of the present without collapsing into perdurantism.

  **Final Answer on Destruction:**
  Only **Perdurantism** (specifically in non-block variants) forces you to say breaking a commitment is literally destroying part of yourself. Endurantism allows you to say you simply changed your mind, preserving your ontological wholeness while admitting moral failure. If "Modal Leakage" implies a heavy, existential weight to commitment, Perdurantism takes that literally (as self-mutilation), while Endurantism takes it morally (as character failure).
