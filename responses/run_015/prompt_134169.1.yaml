      *   *The "Force" Criterion:* Newton's definition of true motion hinges on the application of force. If I spin the bucket, I apply force to the bucket. Friction applies force to the water. The water's surface changes shape because of the *inertial tendency* of the water parts to move in straight lines (tangent) while being constrained.
