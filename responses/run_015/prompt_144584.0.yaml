 the agent weighs future actions, not a refutation of the claim that the parent does trust the child's arithmetic; and anyway Löb's theorem isn't only bad news, since the 2014 robust-cooperation paper on program equilibrium via provability logic builds agents that cooperate with each other precisely by a Löbian handshake — they cooperate if they can prove the other one cooperates — so any story on which Löb is a hard barrier to trusting other reasoners has to be wrong somewhere. Mira: the handshake is mutual reference between two agents at the same level, whereas the obstacle is one system trying to license, from below, another system at least as strong as itself; different geometry, so both can be true. Dev, finally: and none of this even touches the version of the problem that shows up in proof-based decision theory, the 5-and-10 style business where an agent searching for proofs of the form if I do a then utility is high runs into Löbian circularity and gets suckered by spurious proofs — and Mira said that's a third problem again and they should keep them seperate.

