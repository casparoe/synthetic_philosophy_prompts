  ### Formula Correction and Clarification

  Your formula is algebraically correct for a Rank-Dependent Utility model with linear utility, provided you explicitly define the boundary condition for the best outcome. Specifically, for the best outcome $x_n$, the probability of getting something strictly better, $U_n$, must be defined as $0$.

  **Corrected Definition:**
  For outcomes ordered $x_1 < x_2 < \dots < x_n$ with probabilities $p_1, \dots, p_n$:
  *   Let $T_i = \sum_{j=i}^n p_j$ (Probability of $\ge x_i$).
  *   Let $U_i = \sum_{j=i+1}^n p_j$ (Probability of $> x_i$), with **$U_n = 0$**.
  *   Weight $w_i = r(T_i) - r(U_i)$.
  *   Score $= \sum_{i=1}^n x_i \cdot w_i$.

  This ensures the weights sum to 1 (since $r(1)=1$ and $r(0)=0$) and reduces to Expected Value when $r(p)=p$.

