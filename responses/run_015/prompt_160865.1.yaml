  A couple of other things that might matter. He's said I can play more than once — he's there most weeks — and he's also offered me a "bundle": a tenth of each of ten separate games, all flipped at the same time, for a tenth of the price, i.e. a fiver. That sounds like exactly the same bet to me, just smaller, but my friend says it isn't. And separately the crypto guy says the whole point is that if you play every week for a year the rare huge payouts eventually turn up and that's what you should be looking at, while my friend says no, what matters is what happens to your money if you keep rolling it over. Also the payouts aren't instant — a day or two for the small ones, up to two or three weeks if the coin runs long — and I've got a nagging feeling that matters but I can't say why, and honestly I'm not totally sure he'd even pay up on a £30k one.

  On my side: I'm saving for a deposit on a flat, I've got about £12k put away and I need roughly £18k by spring or I'm renting for another year, so money below that line is worth a lot to me and money above it is honestly a bit whatever. I've got around three grand I could put at this that isn't earmarked for the deposit, though losing it would sting and would wipe out the buffer I keep for when the boiler dies or whatever. So: what's the most I should be willing to pay for one ticket, what about for the bundle, and should I play repeatedly? Please actually give me numbers and show the working — I do data analysis for a living so I'm fine with logs and sums, I just don't know which ones to trust — and don't fob me off with "it depends on your risk appetite," I want the number and the reason. And tell me how confident you are and where your reasoning is most likely to be wrong: which of these considerations would actually flip your answer if it went the other way?
