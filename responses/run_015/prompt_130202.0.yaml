  **MEMORANDUM OF UNDERSTANDING: CROSS-CULTURAL COMMUNICATION PROTOCOLS**

  **To:** Senior Engineering Leadership (Rotterdam/Tokyo)
  **From:** Onboarding Programme Management
  **Date:** 24 May 2024
  **Subject:** Framework for Adversarial Collaboration on Communication Norms

  **1. Agreed Claims**

  Both parties acknowledge the following substantive claims as the foundation for continued collaboration:

  1.  **Instrumental Aggression:** Bluntness employed as a weapon to dominate a discussion or diminish a colleague's status is a vice, regardless of cultural origin.
  2.  **Moral Limits of Preference:** A hearer's preference for a specific type of answer (direct or hedged) does not constitute the entirety of the moral story; engineering integrity and safety constraints may override preferences.
  3.  **Limiting Cases:** Extreme hypothetical cases (e.g., the 'murderer at the door') are limiting cases for ethical theory and not templates for daily engineering management.
  4.  **Shared Responsibility:** Mutual intelligibility is a shared responsibility; neither the speaker nor the hearer bears the sole burden for communication failure.
  5.  **Project Priority:** Both camps prioritise successful project delivery over the enforcement of local linguistic norms where the two conflict.

  **2. Residual Disagreements**

  The following table outlines the core ethical divergences that remain unresolved. These are recorded to prevent future misunderstanding regarding intent.

  | Disagreement | Assertion-Norm Formulation | Accommodation Formulation | Genuine / Verbal |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Falsehood** | A statement is false if it contradicts the speaker's knowledge, regardless of local code; indirectness that conveys falsehood is dishonest. | A statement is false only if it violates the cooperative code in force between these speakers; polite falsehoods maintain social truth. | Genuine |
  | **Obligation to Accommodate** | Speakers owe hearers epistemic honesty; accommodation must be achieved via silence or topic-shift, not misleading hedges. | Speakers owe hearers face-maintenance; if a hedge prevents conflict and delivers the needed outcome, it is owed. | Genuine |
  | **Definition of Assertion** | Conventionalised indirectness (e.g., 'I will consider it' meaning 'no') counts as an assertion of fact and is subject to truth norms. | Conventionalised indirectness is a phatic greeting or ritual, not an assertion of fact, and lies outside truth norms. | Verbal; this turns on the definition of 'assertion' rather than moral conduct. |

  **3. Critical Cruxes for Investigation**

  The following six cruxes identify where theoretical disagreement impacts practical workflow. For each, we record the sub-question, significance, a concrete case, and ex-ante predictions.

  **3.1 Conventionalised Indirectness**
  *   **Sub-question:** Is a hedge known by all locals to mean 'no' an assertion at all, or a phatic greeting?
  *   **Significance:** If phatic, the Assertion-Norm camp must cease treating it as dishonesty; if assertion, the Accommodation camp must admit to systematic falsehood.
  *   **Case:** A engineer says 'This looks difficult' regarding a feasible task, known locally to mean 'Impossible'.
  *   **Predictions:** *Assertion-Norm:* This degrades trust over time as newcomers realise the code. *Accommodation:* Trust is maintained because no one expects literalism in this context.

  **3.2 The Uptake Gap**
  *   **Sub-question:** Does the norm calibrate to the hearer's competence (children, new arrivals, machines)?
  *   **Significance:** Determines if the speaker is at fault when a non-native speaker or scheduling assistant books a 'tentative yes'.
  *   **Case:** A scheduling bot books a meeting after a engineer says 'Perhaps next week' (meaning 'No').
  *   **Predictions:** *Assertion-Norm:* The speaker is at fault for using code a known non-agent cannot decode. *Accommodation:* The hearer (or tool designer) is at fault for lacking cultural competence; the speaker acted politely.

  **3.3 The Overhearer Case**
  *   **Sub-question:** Where an addressee understands the polite form but a third party does not, to whom is the lie told?
  *   **Significance:** Identifies who is wronged in mixed-company meetings where codes differ.
  *   **Case:** In a mixed team meeting, a Tokyo lead tells a Rotterdam lead 'We will try' (meaning 'No'); a junior Dutch engineer hears 'We will try' (meaning 'Yes').
  *   **Predictions:** *Assertion-Norm:* The junior engineer is lied to and wronged. *Accommodation:* The junior engineer is not an intended participant in that speech act; no wrong occurs.

  **3.4 Cost of Accommodation**
  *   **Sub-question:** Who bears the cost of accommodation in a mixed-code team, and is the minority burden a moral cost?
  *   **Significance:** If the minority always decodes, is that unfair labour the Accommodation camp must count?
  *   **Case:** Dutch engineers spend 20% more time decoding Japanese emails than vice versa.
  *   **Predictions:** *Assertion-Norm:* This is an unfair tax on the minority that requires correction. *Accommodation:* This is the natural cost of integration; the minority gains access to the group.

  **3.5 The Epistemic Commons**
  *   **Sub-question:** Does widespread indirectness degrade the local information pool unfairly?
  *   **Significance:** Addresses whether indirectness harms those who can least afford decoding failure.
  *   **Case:** Critical risk data is hedged in status reports; a stressed junior misses the warning.
  *   **Predictions:** *Assertion-Norm:* The commons is degraded; the junior is unfairly exposed to risk. *Accommodation:* The commons is preserved because open conflict would hide data entirely; the junior must learn the code.

  **3.6 The Explicit Request**
  *   **Sub-question:** If a hearer requests bluntness ('Please be direct'), does the speaker owe it?
  *   **Significance:** Tests whether individual consent overrides cultural norms.
  *   **Case:** A Dutch engineer tells a Japanese colleague: 'I cannot read hints; tell me if it is no.'
  *   **Predictions:** *Assertion-Norm:* Yes, the request creates a new local norm requiring honesty. *Accommodation:* Not necessarily; the speaker may still owe face-maintenance to the wider group observing the interaction.

  **4. Empirical Notes**

  Where the above cruxes turn on behaviour rather than ethics, we note the following common knowledge and required study designs:

  *   **Common Knowledge:** It is observed that mixed teams experience higher meeting durations initially.
  *   **Required Study:** A longitudinal design tracking error rates in teams with explicit 'directness' protocols versus implicit 'politeness' protocols.
  *   **Expected Findings:** *Assertion-Norm:* Expects lower error rates in direct protocols. *Accommodation:* Expects lower turnover and higher long-term cohesion in polite protocols.

  **5. Closing Protocol**

  In mixed-code interactions, speakers shall signal when a statement carries high engineering stakes, and hearers shall signal when decoding uncertainty risks project delivery.
