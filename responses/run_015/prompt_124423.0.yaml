      *   *Refinement:* She acted *as* the official (unlike 5). She didn't profit (unlike 6). She didn't have election motives explicitly (unlike 7). She didn't kill civilians directly (unlike 3). The key is the *refusal to apologize*. This aligns most with Case 6 ("end justified the means"). In Case 6, the Mayor said the end justified the means. Here, she says "policy was right." This is **Vindicationism**. It negates the "Dirty" part of Dirty Hands.

