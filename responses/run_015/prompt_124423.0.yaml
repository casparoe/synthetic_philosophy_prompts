      *   *Refining the Implicit Rule:* It's not just "Necessity." It's "Necessity + Public Role + *Tragic Acknowledgement*." The agent must treat the act as a *wrong* that requires *expiation* (punishment/resignation), not a *right* that requires *defense*.
      *   *Refining the New Case Verdict:* The "Would do it again" + "No apology" is the killer. It turns it from a tragedy (DH) into a calculation (Technocracy/Hubris). The secrecy (6 years) also hurts (Case 3, 7). The necessity uncertainty hurts (Case 3).
