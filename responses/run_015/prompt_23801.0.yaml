      Okay, I will argue: Single-timeline is coherent *but* requires the Block Universe (which empties 'change' of its meaning). Branching is a *different* question (dimensional travel). Therefore, if you want the *Paradox*, you must choose Lewis. If you choose Branching, you have abandoned the Paradox.

      Let's write.

      *Structure:*
