answer: |-
  Here is how I am going to approach this. I will treat your spreadsheet observations as empirical data points for a decision-theoretic model. I'll start by running the math on the "lopsided hill" to confirm the geometry you're seeing. Then I will propose three candidate framings for what is happening. Finally, I will select the one that best carves reality at the joints, explain why the others fail, and apply the winner to your specific questions about forecasters and edge cases.

  ### 1. The Calculations: Mapping the Hill

  Let's formalize your "lopsided hill." Assume a simple binary bet: you win $1$ unit per unit bet with probability $p$, lose $1$ unit with probability $q = 1-p$. Your edge is $\epsilon = p - q = 2p - 1$. The Kelly fraction is $f^* = \epsilon$.

  The expected logarithmic growth rate per round, $G(f)$, is:
  $$G(f) = p \ln(1 + f) + q \ln(1 - f)$$

  Let's look at the curvature near the peak $f^*$. A Taylor expansion around $f^*$ gives:
  $$G(f) \approx G(f^*) - \frac{1}{2} \left( \frac{1}{p(1-p)} \right) (f - f^*)^2$$
  This suggests a symmetric parabola *locally*. However, your observation is about global behavior ("bet twice that fraction"). The domain of $f$ is bounded at $1$ (ruin), but unbounded on the downside (you just bet less). The term $\ln(1-f)$ goes to $-\infty$ as $f \to 1$. The term $\ln(1+f)$ grows slowly.

  Let's plug in numbers. Say $p = 0.6$, so edge $\epsilon = 0.2$. Kelly $f^* = 0.2$.
  *   **Peak:** $G(0.2) \approx 0.0201$ nats per bet.
  *   **Half-Kelly:** $f = 0.1$. $G(0.1) \approx 0.0151$. This is $\approx 75\%$ of the peak growth.
  *   **Double-Kelly:** $f = 0.4$. $G(0.4) = 0.6 \ln(1.4) + 0.4 \ln(0.6) \approx 0.202 - 0.204 \approx 0$.

  Your simulation is correct. The penalty for overbetting is asymptotic (approaching ruin), while the penalty for underbetting is linear/quadratic (approaching cash). The hill isn't just lopsided; it's a cliff on the right and a meadow on the left.

  ### 2. Candidate Framings

  Here are three ways to conceptualize this "lopsidedness" and your instinct to shade down.

  **Candidate 1: Risk Aversion (Utility Curvature)**
  *   **The Idea:** You are shading down because you have a utility function that is more concave than logarithmic. You dislike the variance of outcomes (drawdowns) more than the log-growth metric implies.
  *   **The Math:** If you maximize $E[W^\gamma]$ with $\gamma < 0$, you bet less than Kelly.
  *   **Why I'm skeptical:** You explicitly stated, "I'd happily take a wildly swingy bet if I was confident." This suggests your utility function *is* log-like (or you are agnostic to it), but your *trust in the inputs* varies. Risk aversion is a preference about outcomes; your problem is a belief about parameters.

  **Candidate 2: Ergodicity Breaking (Time vs. Ensemble)**
  *   **The Idea:** This is about the difference between the average outcome of many people betting once (ensemble) and one person betting many times (time). Overbetting breaks the time-average because ruin is an absorbing state.
  *   **The Math:** The arithmetic mean (EV) is maximized at $f=1$ (bet everything). The geometric mean (time average) is maximized at Kelly.
  *   **Why I'm skeptical:** This explains why Kelly is the peak, but it doesn't explain the *asymmetry of error*. Ergodicity explains why we don't bet 100%. It doesn't fully explain why betting 40% (when Kelly is 20%) is catastrophic while betting 10% is merely suboptimal, *given* that we are already using log-utility. It's the foundation, not the specific mechanism of your uncertainty.

  **Candidate 3: Concave Exposure to Parameter Uncertainty**
  *   **The Idea:** The growth function $G(f, p)$ is concave with respect to the bet fraction $f$, but it is also concave with respect to the probability $p$ in the region of interest. When $p$ is uncertain, the "Expected Growth" is not the "Growth at Expected $p$."
  *   **The Math:** By Jensen's Inequality, if $G$ is concave in $p$, then $E_p[G(f, p)] < G(f, E_p[p])$. However, the interaction term matters. The cost of being wrong about $p$ is asymmetric. If you overestimate $p$, you overbet, hitting the cliff. If you underestimate $p$, you underbet, staying on the meadow.
  *   **Why I like it:** This directly addresses your "I don't trust the number" intuition. It treats the edge not as a scalar, but as a distribution.

  ### 3. The Verdict: Which Framing is Right?

  I am dropping **Candidate 1 (Risk Aversion)**. It is a category error. You are not optimizing a different utility function; you are optimizing log-wealth under *imperfect information*. Shading down is not a preference; it is a calculation correction. If you knew $p$ exactly, you wouldn't shade. Therefore, the behavior is epistemic, not preferential.

  I am dropping **Candidate 2 (Ergodicity)** as the primary explanation. While true that repeated betting requires geometric maximization, ergodicity alone doesn't dictate how to handle *uncertainty* about the probabilities. It tells you to use Kelly, but not how to modify Kelly when $p$ is fuzzy.

  I am selecting **Candidate 3: Concave Exposure to Parameter Uncertainty**.
  This is the correct carving. The phenomenon you are observing is that **geometric growth is fragile to overestimation of edge.**

  Here is why this fits best:
  In decision theory, when the payoff function is concave with respect to a control variable (bet size), and that control variable is derived from an uncertain parameter (edge), the optimal control is biased away from the region of highest sensitivity.
  Because the "cost function" (loss in growth rate) rises super-linearly as you move past $f^*$ to the right, but sub-linearly as you move to the left, any variance in your estimate of $p$ should shift your optimal $f$ to the left.

  Your friend said: *"The correct fraction is your average edge."*
  **Your friend is wrong.**
  The correct fraction is the one that maximizes the *expected growth*, integrating over your distribution of possible edges. Because the growth curve falls off a cliff on the right, the "average edge" will systematically recommend a bet that is too large. You must shade down *more* than the uncertainty alone would suggest, simply because the penalty for being on the wrong side of the peak is infinite (ruin), while the penalty for the other side is finite (opportunity cost).

  ### 4. Unifying the Two Observations

  Are your two observations (shading down vs. combining forecasters) the same thing?
  **Yes.** They are both instances of **Diversification against Model Error.**

  *   **Observation 1 (Shading):** You are uncertain about the true $p$. You effectively treat your single estimate as a distribution centered on that number. Shading down is equivalent to averaging your bet fraction with a bet fraction of 0 (cash). You are diversifying your capital between "My Model" and "No Model."
  *   **Observation 2 (Forecasters):** You are uncertain about which model (Friend A or Friend B) is correct.
      *   **Merging** probabilities is equivalent to betting the average fraction on the whole pot. This assumes the truth lies *between* them (errors are noise).
      *   **Splitting** capital is equivalent to running two parallel strategies. This assumes the truth might be *one of them* (model selection).

  **Why Splitting eventually wins if one friend is better:**
  Let $W_A$ and $W_B$ be the wealth of the two halves.
  Total Wealth $W_{split} = W_A + W_B$.
  Growth rate of $W_{split}$ approaches $\max(G_A, G_B)$ as $N \to \infty$.
  Growth rate of Merged $W_{merge}$ is $G(f_{avg})$.
  Since $G$ is concave, $G(f_{avg}) \geq \frac{G_A + G_B}{2}$.
  However, $\max(G_A, G_B)$ is usually $> G(f_{avg})$ if one forecaster is significantly better.
  Merging forces a permanent compromise. Splitting allows the better strategy to dominate the total pool exponentially over time.

  **The Connection:**
  Shading down (Obs 1) is a hedge against the possibility that your edge is zero (or negative).
  Splitting capital (Obs 2) is a hedge against the possibility that one forecaster's edge is zero (or negative).
  Both strategies sacrifice *immediate* expected growth (relative to a hypothetical omniscient bettor) to reduce the *variance of the growth rate* and protect against the absorbing barrier of ruin.

  ### 5. The Edges (Boundary Conditions)

  You asked if the lopsidedness survives under different conditions. This is the crucial test of the framing.

  1.  **Non-reinvested winnings (Fresh money every time):**
      *   **Result:** The lopsidedness **vanishes**.
      *   **Reason:** If you don't compound, you maximize Arithmetic Expected Value, not Geometric. $EV = p \cdot (bf) - q \cdot f$. This is linear in $f$. The optimal bet is either 0 or Max, depending on sign of edge. There is no "hill," only a slope. Uncertainty about $p$ still matters, but it doesn't create a "cliff" at $2f^*$. You just lose money linearly.
      *   **Implication:** The lopsidedness is purely a product of **compounding**.

  2.  **Single Bet (One-off):**
      *   **Result:** The lopsidedness **vanishes**.
      *   **Reason:** Same as above. Without repetition, the geometric mean converges to the arithmetic mean. You should bet to maximize expected wealth (or expected utility of final wealth). If utility is log, you still bet Kelly, but the *penalty* for overbetting is just lower final wealth, not a zero growth rate over time. The "near-fatal" aspect is removed because there is no "time" to be killed.

  3.  **External Top-up (Bankroll replenished after every round):**
      *   **Result:** The lopsidedness **softens significantly**.
      *   **Reason:** This removes the absorbing barrier. If you blow up, you reset. This turns the process from a multiplicative random walk into something closer to an additive one with a floor. The penalty for overbetting becomes "wasted time resetting" rather than "permanent ruin." You can afford more variance.

  4.  **"I just hate deep drawdowns":**
      *   **Result:** This is a **symptom**, not the cause.
      *   **Reason:** Deep drawdowns are the path-wise manifestation of overbetting. If you bet $2f^*$, your wealth path looks like a jagged descent. If you bet $0.5f^*$, it looks like a smooth ascent. Hating drawdowns is a heuristic your brain uses to detect "I am likely on the right side of the Kelly cliff." It is a valid emotional proxy for the mathematical reality of Parameter Uncertainty.

  ### 6. Naming and Definition

  Does this have a name? In quantitative finance, this is often buried under "Error Maximization" or "Bayesian Kelly." But those are procedural labels.

  I propose we call this **Asymmetric Estimation Risk**.

  **Definition:** A decision environment where the cost function of a control parameter (bet size) is concave near the optimum but asymptotically punitive in one direction (over-commitment) and linearly forgiving in the other (under-commitment), such that uncertainty in the input parameters necessitates a systematic bias in the control parameter away from the punitive direction.

  **Case that looks like an instance but isn't:**
  *   **Instance:** You think a coin is 60/40, but it might be 55/45. You bet less than Kelly. (This *is* Asymmetric Estimation Risk).
  *   **Non-Instance:** You think a coin is 60/40, and it is 60/40, but you bet less because you need cash for rent next week. (This is *Liquidity Constraint / Risk Aversion*).
  *   **Non-Instance:** You are betting on a horse race where the odds are fixed by a market, and you bet less because you think the market might move against you before you can exit. (This is *Market Impact / Slippage*).

  ### Summary

  Your intuition is mathematically sound. The "lopsided hill" is the geometric reality of compounding under uncertainty.
  1.  **It is not Risk Aversion.** It is optimal control under parameter uncertainty.
  2.  **Obs 1 and Obs 2 are the same.** Both are strategies to reduce the variance of the effective bet fraction to avoid the "ruin cliff." Shading is diversifying with cash; Splitting is diversifying with models.
  3.  **The "Edge" is Compounding.** Without reinvestment, the cliff disappears. The lopsidedness is the price of admission for geometric growth.

  Your friend's advice to "bet the average edge" is dangerous. In a concave system with a cliff, the safe bet is always lower than the bet derived from the average input. You should continue to shade hard. It is not cowardice; it is the correct integration of the growth function over your probability distribution.
