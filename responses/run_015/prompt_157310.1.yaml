answer: |-
  # Q&A Prep Sheet: Insect Sentience Research Program

  **Context:** 20-minute pitch, $1.5M ask, research only.
  **Goal:** Defend the "buy information" strategy and the "unit-of-aggregation" novelty without slipping into abstract philosophy or promising interventions you can't deliver.

  ---

  ### 1. The Donor Update (Finance/Ops)
  **Who:** Lead Finance Officer
  **Voice:** "I need to put a number in the quarterly report. 'Animals helped' is our currency. You're asking for $1.5M to tell us we *don't* know the number."
  **The Objection:** "Our donors give to save lives. They expect a cost-per-animal metric. If you succeed, you're telling us we can't calculate that. If you fail, you've spent $1.5M saving nothing. How do I explain this expenditure without sounding like we're burning cash on speculation?"

  *   **Reply (2 mins):** "You're right that 'animals helped' is our current currency, but it's only valid if we know the animal counts and the welfare impact. Right now, the insect count is 10^18, but the welfare impact is unknown. Spending $1.5M to resolve the welfare variable is cheaper than launching a campaign based on a guess. Think of this as R&D for the metric itself. If we fund interventions now, we risk spending millions on the wrong species or the wrong welfare indicators. This grant buys the calibration tool so the next $10M we spend actually moves the needle. The update isn't 'animals saved,' it's 'uncertainty reduced by X%,' which protects donor capital from misallocation."
  *   **Concede:** "You cannot put 'sentience points' in a donor newsletter. It looks soft."
  *   **Refuse:** "I will not concede that funding interventions now is better than funding measurement. Acting on a 1-in-1000 guess is gambling, not grantmaking."
  *   **Weakness:** Donors hate 'uncertainty reduced' as a success metric. It feels like hedging. If pressed on what specific number changes in the next annual report, you might look vague.

  ### 2. The Regress Problem (Finance/Ops)
  **Who:** Ops Director
  **Voice:** "If EV is broken, where do we stop? Why not fund nematode sentience next?"
  **The Objection:** "You say the expected-value framing leads to a regress—mites, then nematodes, then microbes. If that logic holds, why stop at insects? Why not ask for $1.5M to study soil bacteria next year? How do you set a budget cap if the logic pushes you infinitely downward?"

  *   **Reply (2 mins):** "The regress stops at practical tractability and biological plausibility. We aren't saying 'study everything.' We're saying 'study the group where the scale is highest and the biological markers are accessible.' Insects are the bottleneck. They are the only invertebrate group farmed at industrial scale with nervous systems complex enough to potentially support the markers we're testing (motivational trade-offs, analgesia preference). Nematodes don't have the neural architecture for these assays yet. We set the cap at insects because that's where the farming industry is *today*. We aren't opening the door to microbes; we're closing the door on speculation about the largest farmed group."
  *   **Concede:** "Theoretically, the logic could extend further down the phylogenetic tree."
  *   **Refuse:** "I refuse to concede that we should fund research on organisms where we cannot currently design behavioral assays. No assay, no grant."
  *   **Weakness:** The line between 'complex insect' and 'simple nematode' is blurrier than you want to admit. An entomologist might corner you on where exactly the 'assay capability' line is drawn.

  ### 3. The Assay Specifics (Welfare Scientist - Poultry/Fish)
  **Who:** Senior Welfare Scientist
  **Voice:** "You mention trade-offs and analgesia. Which protocols? Who validates them?"
  **The Objection:** "You talk about 'motivational trade-offs' and 'response outlasting stimulus.' Those are vague. Are you using conditioned place preference? Weighted door pushes? Who is validating that these assays measure affect and not just nociception in *this* taxon? I need to know the experimental design, not the concept."

  *   **Reply (2 mins):** "We aren't designing the protocols today; we're funding the pilot work to validate them. Current vertebrate assays don't transfer directly. For example, a weighted door push works for a chicken; for a mealworm, we might need micro-fluidics or thermal gradient choices. The grant hires a PI to run a comparative battery: does the insect avoid a zone even when it costs them food? Does it groom an injured area differently than a sham injury? The output isn't just 'yes/no sentience,' it's a validated protocol stack for invertebrates that the wider field can use."
  *   **Concede:** "I cannot name the specific protocol today because it doesn't exist yet for insects."
  *   **Refuse:** "I will not concede that we should use vertebrate protocols as-is. They produce false negatives in invertebrates."
  *   **Weakness:** Scientists hate funding "protocol development" without a guarantee of a protocol at the end. It sounds like fishing.

  ### 4. The PI Credibility (Welfare Scientist - Fish/Poultry)
  **Who:** Welfare Scientist (Second)
  **Voice:** "You're a philosopher. Who is actually running the lab?"
  **The Objection:** "Your background is philosophy. You were hired as a program officer. Now you're asking for a biology budget. Who is the Principal Investigator? If you're the PI, why? If you're hiring one, why do you need to be the one pitching the science? This looks like you're trying to manage science you aren't qualified to oversee."

  *   **Reply (2 mins):** "I am not the PI. I am the program officer designing the scope. We will hire a PI with a background in invertebrate neuroethology or comparative cognition. My role is ensuring the research questions align with the funding strategy, not designing the pipettes. The risk you're identifying is real—philosophy driving biology—so the hiring criterion for the PI is strictly empirical publication history. I'm here to defend the *question*, not the *method*. The method is their job."
  *   **Concede:** "It is unusual for a program officer to pitch the research scope this deeply."
  *   **Refuse:** "I refuse to concede that the research question itself is purely biological. The framing of 'welfare' requires conceptual clarity that biologists often overlook."
  *   **Weakness:** They may suspect you'll micromanage the PI once hired. You need to sound like you'll hands-off the lab work.

  ### 5. The Automaton Objection (Entomologist)
  **Who:** The Entomologist
  **Voice:** "Insects are reflex machines. You're projecting."
  **The Objection:** "You're treating insects like small vertebrates. They operate on fixed action patterns and reflexes. A cockroach leg walks after being cut off. You're calling that 'sentience.' This premise is soft. You're anthropomorphizing behavior that is purely mechanical. Why fund research on a premise that contradicts basic entomology?"

  *   **Reply (2 mins):** "We aren't assuming they are small vertebrates. We're testing whether the reflex model is sufficient to explain all their behavior. If an insect refuses food to avoid a shock, that's not a reflex; it's a trade-off. If it chooses a shelter with analgesic properties over one without, that's not a fixed action pattern. We aren't starting with the assumption they feel pain. We're starting with the assumption that the reflex model might be incomplete. If the experiments show it's all mechanical, we stop. But we shouldn't assume the answer before running the test."
  *   **Concede:** "Many insect behaviors are indeed purely mechanical reflexes."
  *   **Refuse:** "I will not concede that *all* insect behavior is explicable by reflex alone without empirical testing."
  *   **Weakness:** The entomologist knows the literature on insect reflexes better than you. They can cite specific cases where 'trade-offs' were later explained mechanically.

  ### 6. The Unit Problem Operationalization (All Scientists)
  **Who:** Collective Skepticism
  **Voice:** "How do you measure a 'moment'?"
  **The Objection:** "You introduced this 'unit-of-aggregation' problem—momentary states vs. persisting subjects. That sounds like metaphysics. How do you budget for that? What is the biological metric for 'diachronic unity'? If you can't measure it, it's not research, it's philosophy."

  *   **Reply (2 mins):** "It's not metaphysics; it's memory and learning duration. A persisting subject needs to integrate information over time. We measure this by looking at memory retention windows and state-dependent learning. If an insect learns a task but forgets it in an hour, versus one that retains it for a week, the 'unit' of welfare is different. We aren't measuring 'unity' directly; we're measuring the cognitive capacities that unity requires. If the memory window is seconds, the welfare calculation changes. That's a biological variable we can price."
  *   **Concede:** "'Diachronic unity' is a clumsy term for a grant proposal. 'Memory integration window' is better."
  *   **Refuse:** "I refuse to concede that welfare aggregation is independent of memory capacity. You can't suffer a 'life' if you don't have a 'life' in memory."
  *   **Weakness:** This is your weakest link. Connecting 'memory duration' to 'moral unit' is a philosophical leap, not a biological one. They may smell the smuggling here.

  ### 7. The Kill Switch (Finance/Ops)
  **Who:** Finance Officer
  **Voice:** "When do we stop?"
  **The Objection:** "$1.5M is a lot for 'measurement.' What is the milestone for success? When do we pull the plug? If you spend $1M and the answer is still 'we don't know,' do you ask for another $1M? I need a stop-loss."

  *   **Reply (2 mins):** "The milestone is protocol validation, not a final answer on sentience. Success is defined as: 'We have a battery of tests that reliably distinguishes nociception from affective pain in insects.' If we spend $1M and the assays remain inconclusive, we stop. We don't keep chasing the answer. The grant is structured in tranches: Year 1 is assay development, Year 2 is pilot data. If Year 1 fails to produce viable assays, Year 2 doesn't fund. The stop-loss is built into the deliverables."
  *   **Concede:** "There is a risk that the assays remain inconclusive."
  *   **Refuse:** "I will not concede to a 'sentience confirmed' milestone. Nature doesn't owe us a clear yes/no. The milestone must be methodological."
  *   **Weakness:** Finance prefers binary outcomes (Success/Fail). 'Methodological success' feels like moving the goalposts to them.

  ### 8. The Decision Rule Trap (The One You Hope Nobody Asks)
  **Who:** The Committee Chair (likely Finance or Senior Scientist)
  **Voice:** "What changes?"
  **The Objection:** "You're arguing our current cost-per-animal metric is broken. If this research confirms sentience but confirms your 'unit problem' (making welfare negligible), will you recommend we ignore insects? Or if it confirms sentience and unity, will you demand we fund interventions regardless of cost-effectiveness? Essentially: If this research doesn't change our funding decisions, why do it? And if it does, are you asking us to adopt a new strategic framework without board approval?"

  *   **Reply (2 mins):** "It changes the *input* to the decision, not the decision rule itself. Currently, the input is a guess. This makes the input data. If the data says welfare is negligible due to the unit problem, then the cost-per-animal metric correctly tells us to deprioritize insects. If the data says welfare is high, it tells us to prioritize. I am not asking to change the framework. I'm asking to stop feeding the framework bad data. The decision remains yours, based on cost-effectiveness. I'm just ensuring the 'effectiveness' part is real."
  *   **Concede:** "If the research shows welfare is negligible, I will recommend deprioritizing insects."
  *   **Refuse:** "I refuse to concede that we should make high-stakes funding decisions on current data. That's not due diligence."
  *   **Weakness:** This ties your hands. If you concede you'll recommend deprioritizing insects if the news is bad, some animal advocates might see you as a traitor. If you refuse, you look biased. You have to walk the line of 'neutral data' while being a program officer hired for animal welfare.
