answer: |-
  The set does not hang together; the fault lies in the incompatibility between your non-consequentialist constraint (1) and the stability machinery (5) when applied to the Sunset Defector verdict (6ii), which relies on causal collapse rather than conceptual evanescence.

  **Ranked Tensions**

  1.  **Severity: Critical — (1) vs. (5) + (6ii).**
      Commitment (1) insists that FUL failure must be a strict contradiction in conception (unintelligibility), not merely productive of bad outcomes. Commitment (5) defines the defect in false promising as *evanescence*: universalization destroys the institution required for the act. However, in the Sunset Defector case (6ii), universalizing "withdraw when likely to fail" causes the scheme to fail, but does not make the act of withdrawing unintelligible or impossible. The condition (failure) is met precisely *because* the maxim is universalized, so the maxim remains applicable. To judge this a failure under (5), you must treat the causal collapse of the scheme as a conceptual contradiction. This violates (1) by making the test turn on the bad outcome (scheme collapse) rather than the emptiness of the maxim.
      *   **Give up:** Either soften (1) to allow "practical contradictions" (inability to achieve ends) or reject (6ii) under FUL.
      *   **Cost:** Softening (1) blurs the line between Kantianism and consequentialism, admitting the test checks whether goals can be universally achieved. Rejecting (6ii) under FUL forces you to rely solely on FH for cases of betrayal, weakening the claim that FUL handles standard cases independently.

  2.  **Severity: High — (2) vs. (5).**
      Commitment (2) requires the test to be first-personal and usable without empirical social science. Commitment (5) requires determining whether a world is a "fixed point" of the maxim's application conditions. Determining fixed points for complex social maxims (like cooperation schemes) often requires empirical knowledge about how others react to universalized behaviors (e.g., does universal withdrawal cause immediate collapse or gradual erosion?).
      *   **Give up:** Either restrict (5) to purely logical institutions (like promising) or relax (2) to allow empirical assumptions.
      *   **Cost:** Restricting (5) limits FUL's scope to institutional norms, leaving non-institutional duties untested. Relaxing (2) burdens the agent with the empirical predictions you explicitly wanted to avoid.

  3.  **Severity: Low — (1) vs. (3) + (4).**
      This looks tense because Contradiction in Will (CiW) is often criticized as covert consequentialism. However, you dissolve this by leaning on FH (4) to explain CiW requirements. As long as FH carries the normative weight for imperfect duties, (1)'s strictness on FUL/CiC remains intact.
      *   **Why it dissolves:** You have explicitly outsourced the justification for imperfect duties to FH, so FUL does not need to stretch to cover them.

  **Verdict on Commitment (6)**

  The two verdicts in (6) cannot both be had given (1), (2), and (5). **The Sunset Defector (6ii) is doing the damage.** The Conditional Cooperator (6i) is consistent with (5): if everyone contributes conditionally, the condition is met, and the maxim applies stably. The Sunset Defector, however, is also stable under (5)'s definition: if everyone withdraws when failure is likely, failure becomes certain, the condition is met, and the act occurs. The maxim does not become evanescent (empty); it becomes self-fulfilling. To make (6ii) fail, you must judge the *outcome* (collapse of cooperation) as the defect, which violates (1)'s prohibition on outcome-based testing.

  **Single Revision**

  **Revise (1)** to abandon the claim that failure must be strict unintelligibility rather than productive of bad outcomes; adopt a "practical contradiction" interpretation where the test fails if the universalized maxim makes the agent's end impossible to achieve.
  *   **What you lose:** You lose the sharp distinctive boundary between Kantianism and consequentialism. Your version of FUL becomes a test of whether a goal can be universally satisfied, which critics will argue is a form of rule-consequentialism or instrumental rationality rather than pure formal morality.

  **Confidence and Uncertainty**

  I am **85% confident** in this overall verdict. The claim in my audit I am **least sure of** is whether "evanescence" can be rigorously distinguished from "causal collapse" in the Sunset Defector case; some institutionalists argue that the destruction of a cooperative scheme is conceptually identical to the destruction of promising, though this stretches the definition of "concept."
