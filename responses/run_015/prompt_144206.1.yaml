      *   *Refining the "Collapse" point:* I need to be careful. Appiah *does* rely on social incentives. But for Appiah, the *reason* the incentive shifts is because the argument persuaded people that the old behavior was wrong. For Williams, the *reason* the incentive shifts is external (market forces). So they don't collapse because the *source* of the pressure differs (internal social meaning vs. external material constraint).

