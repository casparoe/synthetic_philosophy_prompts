answer: |-
  This is an exceptionally sharp set of questions. You have hit on one of the central tensions in social theory: the relationship between **ideas** (moral arguments), **structures** (economics), and **psychology** (honor/status).

  Your TA is pointing you toward a specific mechanism (cascade dynamics), but you are right to sense that if you push that mechanism too hard, the distinction between Appiah and Williams starts to blur. However, most philosophers and historians insist on keeping them distinct for a very high-stakes reason: **the possibility of moral progress.**

  Here is a breakdown of why Appiah and Williams are usually treated as rivals, why Appiah doesn't fully collapse into Williams, and why the US South is the critical test case that breaks the "honor cascade" model.

  ### 1. Do Appiah and Williams Contradict?
  **Yes, fundamentally.** They offer competing accounts of **causality**.

  *   **Williams (Materialism):** Moral arguments are *epiphenomenal*. They are the smoke, not the fire. Abolitionists didn't convince people; rather, economic shifts made slavery inconvenient, and people *then* generated moral arguments to justify what they were already going to do for money.
  *   **Appiah (Idealism/Social Psychology):** Moral arguments are *causal*. They are the fire. People changed their minds about what was honorable, and that shift in social meaning forced the behavior to change, even when there was no economic incentive to do so.

  If you accept Williams, "moral progress" is largely an illusion; it's just market adjustments. If you accept Appiah, moral progress is real; human reasoning and social psychology can override self-interest.

  ### 2. Does Appiah Collapse into Williams? (The "Honor as Currency" Problem)
  This is your strongest insight. If honor is a "positional good" that operates on cascade dynamics (tipping points), isn't that just a market of status? If so, isn't Appiah just saying "Status incentives replaced Economic incentives," which is structurally the same as Williams?

  **The Counter-Argument:** They don't collapse because of **where the incentive comes from.**

  *   **In Williams' model:** The incentive is **external**. The price of sugar drops, the efficiency of free labor rises. You don't have to *believe* anything new; you just have to calculate profit differently.
  *   **In Appiah's model:** The incentive is **internal to the identity**. For an honor cascade to work, the moral argument must successfully *redefine* the identity.
      *   In dueling, the argument wasn't just "Dueling is bad." It was "Dueling is *unworthy of a gentleman*."
      *   For Appiah, the **content of the argument matters**. You cannot just swap "money" for "honor." The argument had to resonate with the existing values of the honor culture (courage, self-control) to reframe the act. Williams doesn't care about the content of the argument, only that the economic base shifted.

  So, Appiah doesn't collapse into Williams because Appiah grants **autonomy to ideas**. The arguments had to be persuasive *on moral grounds* within the social context, not just efficient on a status balance sheet.

  ### 3. The US South: Why didn't Honor Cascades end Slavery?
  This is the killer objection to Appiah, and he addresses it (mostly by conceding the point). If honor cascades are so powerful, why did the American South require a Civil War to end slavery, while Britain ended the slave trade with legislation and dueling ended with social shaming?

  There are two main reasons philosophers distinguish the cases:

  **A. Honor was the *Foundation*, not just a Practice**
  In the dueling case, honor was the *mechanism* used to stop the practice. In the US South, honor was the *justification* for the practice.
  *   Southern honor culture was built on **mastery** and **paternalism**. To be a "gentleman" in the antebellum South *required* the ownership of dependents (slaves, women, children).
  *   You could argue that killing someone over an insult was *excessive* within a honor code (Appiah's dueling argument).
  *   You could not argue that owning slaves was *shameful* within the Southern honor code, because the code was explicitly designed to validate racial hierarchy. The honor system was immune to the cascade because the "shame" was outsourced to the enslaved people, not the owners.

  **B. Economic Incentives Overrode Social Incentives**
  This is where Williams wins in the US case.
  *   Dueling was economically neutral or slightly negative (killing off young heirs).
  *   Slavery, post-Cotton Gin, was **massively profitable**.
  *   Appiah admits that honor cascades usually work when the behavior is **costly** or **neutral**. When a behavior is highly profitable (Slavery) and protected by state violence, honor cascades rarely succeed on their own. The "positional good" of owning slaves (wealth + status) was too high for the "positional good" of being an abolitionist (moral purity) to outweigh it within that specific society.

  This is why philosophers treat them separately: **Dueling is a case study for Appiah; Slavery is a case study for Williams.** The fact that they require different explanations proves the mechanisms are distinct.

  ### 4. Why keep Arguments, Interests, and Honor separate?
  You asked why philosophers treat these as three separate things when they blur together. The answer lies in **agency and responsibility.**

  1.  **If it's just Interests (Williams):** We aren't morally responsible for the past. We didn't end slavery because we are better people; we ended it because we wanted factories. This creates a cynical view of history.
  2.  **If it's just Honor (Appiah):** We are responsible, but only socially. We change because we want to fit in. This is a sociological view.
  3.  **If it's Arguments (Kantian/Rawlsian):** We are responsible because we are rational agents. We change because we recognize the Truth.

  Philosophers keep them separate to determine **what drives change.**
  *   If you want to change the world today (e.g., climate change, AI ethics), does it matter more to:
      *   Make it profitable? (Williams)
      *   Make it shameful? (Appiah)
      *   Prove it is logically inconsistent? (Pure Moral Argument)

  Appiah's specific contribution is to say: **"Pure moral argument doesn't work on its own, but it works if you weaponize it through honor."** He is trying to bridge the gap. He is saying Williams is right that *interests* matter, but he argues that *honor* is a distinct type of interest that can be manipulated by *moral arguments*.

  ### Summary for your Seminar
  *   **Do they contradict?** Yes. Williams says ideas follow money; Appiah says ideas (via honor) can drive behavior.
  *   **Do they collapse?** No. Williams is about external material constraints; Appiah is about internal social identity. The "currency" is different (profit vs. shame), and the mechanism of change (market shift vs. meaning shift) is different.
  *   **Why not Slavery in the South?** Because the honor code there was *constituted* by slavery, not just compatible with it. Plus, the economic incentives (Williams) were too strong for the social incentives (Appiah) to overcome without war.
  *   **Why keep them separate?** Because the answer determines whether we believe moral progress is real (Appiah) or just an economic side-effect (Williams).

  Your TA's point about cascades is the mechanism *within* Appiah's theory, but it doesn't validate Williams. A cascade of shame is still distinct from a shift in profit margins, even if both result in behavioral change.
