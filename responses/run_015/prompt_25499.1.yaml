  1.  **Analyze the Request:**
      *   **Context:** Faculty working group on technology policy.
      *   **Opposing View:** Senior engineer argues "Technology is just a tool" (hammer analogy). Conclusion: Regulate users/applications, never design/deployment. "Biased algorithms" are category mistakes.
      *   **Task:** Audit the technology-as-tool analogy on its own terms.
          *   Lay out the mapping (hammer, handle, swinging, builder/assailant, house/skull).
          *   Identify where the mapping breaks.
          *   Flag features "tool" imports that real technologies lack (scale, defaults, path-dependence, irreversibility, etc.).
          *   Evaluate the conclusion (regulating artifact is always a mistake) given disanalogies.
          *   Propose a better master analogy if applicable.
      *   **Constraint:** Keep response to 600 words.

  2.  **Deconstruct the Hammer Analogy:**
      *   *Mapping:*
          *   Hammer = Technology/Artifact.
          *   Handle/Head = Design features.
          *   Swinging = Act of usage/Deployment.
          *   Builder/Assailant = User/Operator.
          *   House/Skull = Outcome/Impact.
      *   *Breakdown:* A hammer is inert. It requires constant human force for every action. It has no agency, no memory, and no amplification beyond physics.
      *   *Missing Features:* Modern tech (algorithms, platforms) has embedded defaults (nudging), scale (one deployment affects millions), path-dependence (lock-in), and irreversibility (infrastructure). A hammer doesn't decide *who* holds it or *how hard* it swings once picked up.

  3.  **Evaluate the Conclusion:**
      *   If the analogy breaks, does the conclusion survive? No. If technology shapes behavior (affordances) or encodes values (defaults), regulating design is necessary.
      *   *Example:* Safety mechanisms on guns (tools) are regulated design features.

  4.  **Propose a Better Analogy:**
      *   *Environment/Infrastructure:* Technology as a built environment (like urban planning).
      *   *Why:* Captures scale, defaults, path-dependence, and how design influences behavior without direct coercion.

  5.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Acknowledge the engineer's stance.
      *   *Mapping:* Define the correspondences clearly.
      *   *Breakdown:* Highlight inertia vs. agency, scale, and defaults.
      *   *Conclusion Check:* Does the "no design regulation" rule hold?
      *   *Better Analogy:* Environment/Infrastructure.

