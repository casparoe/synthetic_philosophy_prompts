      *Draft:*
      The senior engineer's "hammer analogy" is intuitive but analytically fragile. To audit it, we must first map its terms. In this framework, the **hammer** is the technology artifact; the **handle and head** represent design features; the **swing** is the act of deployment or usage; the **builder or assailant** is the user; and the **house or skull** is the societal outcome. The core claim is that moral agency resides solely in the swinger, not the steel.

      This mapping breaks down under scrutiny because it imports features of hand tools that modern technology lacks. First, **inertia**. A hammer is inert; it requires continuous human force for every strike. Modern algorithms are active; they execute decisions autonomously once deployed. Second, **scale**. A hammer strikes one nail at a time. Digital infrastructure operates at societal scale simultaneously; a single design choice (e.g., a recommendation engine) influences millions of "swings" without additional human intent. Third, **defaults**. A hammer has no settings. Software comes with embedded defaults (privacy, safety, visibility) that nudge behavior before the user ever acts. Fourth, **path-dependence**. You can put a hammer down. Technological infrastructure creates lock-in; once adopted, it reshapes the landscape so thoroughly that opting out is impossible (e.g., social media protocols or payment systems).

      The analogy quietly assumes technology is passive, individual, and reversible. Real technology is often active, systemic, and sticky.

      Consequently, the engineer's conclusion—that regulating the artifact is always a mistake—does not survive these disanalogies. If design features encode values (like safety locks on guns or emission standards on cars), then the artifact itself participates in governance. Regulating design is not about punishing the tool, but about managing the *affordances* it offers. A hammer cannot be designed to only hit nails, but an algorithm can be designed to minimize harm or maximize transparency. Ignoring design regulation ignores the capacity of architecture to coerce or enable behavior independent of user intent.

      A superior master analogy is **technology as infrastructure** or **urban planning**. Like a city, technology is a built environment that channels behavior. A highway design encourages driving; a sidewalk encourages walking. These are design choices with political outcomes, yet they are not "used" in the same way a hammer is swung; they are inhabited. This analogy captures **scale** (public systems), **defaults** (zoning laws/traffic flows), and **path-dependence** (you cannot easily move a highway once built). It shifts the focus from individual malice to systemic affordances. Under this view, regulating the artifact is not a category mistake; it is akin to zoning laws—necessary governance of the environment in which we live. The hammer argues for punishing the criminal; the infrastructure argues for building safer streets.

