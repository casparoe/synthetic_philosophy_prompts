answer: |-
  Alex accidentally deletes his colleague Jamie's entire dissertation from the shared drive ten minutes before the deadline.

  Immediately, Smithian **Sympathy** kicks in: Alex imaginatively projects himself into Jamie's situation, vividly reconstructing the panic, the cold sweat, and the visceral dread of failure. Alex begins to hyperventilate.

  Alex then consults his **Impartial Spectator**: "Is this level of distress proper?"

  The Spectator adjusts its wig and replies, "You acted without malice. The error was unintentional. IT has a backup. Your distress is disproportionate to your culpability. Verdict: Improper."

  Alex says, "But I'm still hyperventilating!"

  The Spectator says, "That is not your hyperventilation. That is Jamie's. I am not here to judge Jamie. I am here to judge *you*."

  Alex: "So I'm feeling someone else's anxiety that I'm not allowed to own?"

  Spectator: "Precisely. I can certify your innocence, but I cannot validate your empathy. I don't audit the victim; I only audit the agent."

  Alex: "So what do I do?"

  Spectator: "Apologize calmly. Do not feel the apology."

  Alex: "That sounds sociopathic."

  Spectator: "No, it sounds *proper*. You are now an innocent man serving a sentence that belongs to someone else. Welcome to moral philosophy."
