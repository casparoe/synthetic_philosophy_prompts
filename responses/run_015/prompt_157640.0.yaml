          *   (c) Testimonial evidence (others saying parenthood was worth it).
          *   (d) Kantian objection (using child as a means to self-discovery).
          *   (e) Target problem (how to judge future self if you can't imagine it?).
          *   (f) Behavioral Econ listener (ambiguity aversion?).
