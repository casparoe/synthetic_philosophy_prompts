      *   **Core Thesis:** Transformative choices (kids, career, implants) render expected utility (EU) useless/wrong norm. Rationality = "Discovery-Guided Choice" (choose the option best for finding out who you'd become). Applies to small cases too (food, cities).
      *   **Guest's Defense Mechanism:** Dismisses cases where evidence is available as "decision under risk wearing a transformative costume."
      *   **Goal:** 8-10 questions total.
      *   **Required Topics:**
          *   (a) Line between transformative vs. big/unfamiliar (and what if no line?).
