  The single largest driver of the 0.64 is von Neumann's explicit claim in Part II of the manuscript that the "language of the brain" is not arithmetic but statistical. He uses the reliability comparison to prove that a digital architecture is physically implausible given the component noise. Therefore, the *intent* of that specific argument is to push the reader away from Digital Functionalism. Whether "Statistical" equals "Analog/Continuous" is a semantic debate, but whether it equals "Digital Functionalist" is a hard "No" in his text. Since your dichotomy forces a choice between Digital Functionalist and the alternative, the text forces him into the alternative bucket.

