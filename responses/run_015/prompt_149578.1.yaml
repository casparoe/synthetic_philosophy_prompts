  *   **Weight:** Included in the textual balance.
  *   **Reasoning:** He titled the work *The Computer and the Brain*, not *The Calculator and the Brain* or *The Organ and the Brain*. He consistently refers to the brain as a computing machine, albeit a unique one. This prevents the credence from going higher (e.g., 0.80+), as it suggests he did not view the statistical nature as a rejection of *computation* per se, only of *digital* computation.

