      *Headline:* Federal Research Allocation Bureau Requires Pre-Approved Failure Conditions for All Grant Proposals

      *Text:*
      WASHINGTON—The Federal Research Allocation Bureau announced Monday that all future grant applications must include a signed Falsification Plan detailing the specific observation that would compel a principal investigator to abandon the project's central claim. The new mandate, part of the Bureau's Integrity in Quantitative Output initiative, requires researchers to submit a binding statement identifying the exact data point that would render their hypothesis untenable. Each proposal will now be assigned an automated Testability Score by the Compliance and Verification Division, with funding priority given to projects offering the highest risk of definitive refutation.

      Early rounds of the revised application process revealed immediate strategic adjustments among the research community. Dr. Harold Pinter of the University of Northern Idaho submitted a proposal regarding cognitive resonance patterns that was compatible with any possible outcome, framing the central claim so broadly that no observation could contradict it. While the proposal passed peer review, it received a Testability Score of zero and was rejected for lacking disconfirmable conditions. Conversely, Dr. Sarah Jenkins of the Caltech Physics Department proposed a specific particle decay rate precise to twelve decimal places. Her project received a perfect Testability Score and was funded immediately. Six days later, the required observation failed to materialize. Per the terms of the Falsification Plan, Dr. Jenkins was required to cease all work on the central claim, and the Bureau revoked the remaining balance of her grant.

