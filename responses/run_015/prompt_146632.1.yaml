      *   Make sure the "Winner" pattern-matching check is explicit.

  **(Self-Correction during drafting):** I initially thought about suggesting "Common Law" for RLHF. But RLHF isn't case-based reasoning; it's gradient descent on preferences. It's more like **Conditioning**. A better analogy might be **Bioethics Boards** or **Institutional Review Boards (IRBs)**. They set the boundaries of what research *can* happen before it happens.
  Actually, the **Zoning** analogy is the most robust for the "politics in concrete" argument. I'll stick with that but nuance it with **Professional Socialization** for the RLHF part.
