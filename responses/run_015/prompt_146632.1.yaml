answer: |-
  This is a sharp dissection of a meme that has hardened into dogma. You are right to suspect the analogy is doing隐蔽 (hidden) normative work. It smuggles in a specific theory of power (legalism) to describe a mechanism that operates more like physics or physiology.

  Here is the audit you requested.

  ### 1. The Correspondence Table

  | Legal Concept | AI Governance Analog | Fidelity |
  | :--- | :--- | :--- |
  | **Statute** | System Prompt / Model Spec | High (Explicit rules) |
  | **Case Law** | RLHF / Fine-tuning examples | Medium (Precedents embedded in weights) |
  | **Legislator** | Alignment Team / Product Managers | Low (Often diffuse, profit-driven) |
  | **Enforcer** | The Inference Engine / Weights | High (The mechanism of constraint) |
  | **Sanction** | Refusal / Hallucination / Shutdown | Medium (Not punitive, just null) |
  | **Appeal** | Prompt Engineering / Jailbreaks | Low (Adversarial, not procedural) |
  | **Jurisdiction** | Context Window / Deployment API | High (Bounded space) |
  | **Repeal** | Model Version Update | High (But retroactive impossibility) |
  | **Subject** | The User / Prompter | Medium (Also the *object* of safety) |

  ### 2. The Cut: Law-Shaped vs. Terrain-Shaped

  Your cut is correct and load-bearing. In legal theory, this is the distinction between **Deontic Constraints** (rules that govern choice) and **Affordance Constraints** (physics that govern possibility).

  *   **Law-Shaped:** "Do not drive 100mph." (You can, but you will be fined). Preserves agency, attaches consequence.
  *   **Terrain-Shaped:** "The road ends at the cliff." (You cannot drive 100mph here). Removes agency, attaches impossibility.

  **Refinement:** AI governance is predominantly **Terrain-Shaped**, but it *speaks* in **Law-Shaped** language. When a model says, "I cannot fulfill this request," it frames a capability constraint (I am weighted to output null) as a normative refusal (I am not allowed). This linguistic masquerade is where the political friction generates heat.

  ### 3. Disanalogies: Noise vs. Load-Bearing

  I have separated these based on whether they undermine the push for democratic input (a) or the claim of coercion/non-neutrality (b).

  #### Noise (Structural differences that don't change the political conclusion)
  *   **Speed:** Law is slow; inference is fast. (Irrelevant to the *nature* of the constraint).
  *   **Medium:** Text vs. Weights. (As long as the constraint holds, the substrate matters less).
  *   **Scale:** One law for millions vs. one model instance per user. (Personalization changes the *experience*, not the *power dynamic*).

  #### Load-Bearing (Differences that break the analogy's conclusions)
  *   **Reason-Giving (Crucial for *a*):** A judge must write an opinion explaining *why* the law applies. A model outputs a refusal based on high-dimensional vector proximity. There is no "because," only "that." You cannot debate a gradient. This makes democratic contestability (a) nearly impossible under the current architecture.
  *   **Reciprocity (Crucial for *a*):** Legislators are bound by the laws they pass. Model developers are not bound by the safety filters they impose on users. This asymmetry breaks the "social contract" implication of the analogy.
  *   **Interpretability/Equity (Crucial for *a*):** Law admits "hard cases" and equity (mercy). Code admits exceptions only if explicitly programmed. RLHF creates a "hard case" blindness where edge cases are averaged out as noise.
  *   **Exit Costs (Crucial for *b*):** In a jurisdiction, exit is expensive (migration). In AI, exit is theoretically cheap (use a different model), *unless* market concentration creates a monopoly. The "coercion" claim relies entirely on market structure, not the code itself.
  *   **Authorship/Intent (Crucial for *both*):** Laws are intentional acts. Weights are emergent properties of loss minimization. Attributing "political will" to a gradient descent process is a category error. The "politics" are in the *data selection* and *loss function*, not the weights themselves.

  ### 4. Verdicts on Conclusions (a) and (b)

  #### Conclusion (a): "Demand democratic input/contestability"
  **Verdict: The Analogy Fails Here.**
  The legal analogy suggests we can treat AI specs like statutes, open to public comment and legislative debate. But because the enforcement mechanism (weights) is opaque and non-reason-giving, "democratic input" has no lever to pull. You cannot vote on a weight matrix.
  *   **Where the conclusion actually comes from:** It comes from a **Utility Regulation** framework (like water or electricity), not a Legislative one. We don't vote on the chemical composition of tap water; we demand safety standards and transparency from the provider. The demand for "democracy" is actually a demand for **fiduciary duty** or **consumer protection**, disguised in the language of citizenship to gain moral traction.

  #### Conclusion (b): "Admit defaults are coercion/non-neutral"
  **Verdict: The Analogy Holds (with caveats).**
  The "Terrain-Shaped" analysis confirms this. By closing off option space ex ante, the system embeds values (safety > freedom, helpfulness > truth) into the physics of the interaction. It is not neutral infrastructure.
  *   **Caveat:** "Coercion" is too strong if exit is cheap. A better term is **Normative Embedding**. The system enforces a specific moral ontology (e.g., liberal Western safety norms) by making deviations computationally expensive or impossible. It is politics in concrete, exactly as Winner argued, but it functions more like **Zoning** than **Criminal Law**.

  ### 5. A Better Analogy for Trained Behavior (Weights/RLHF)

  Your partner's "Common Law" suggestion fails because common law is reasoning-by-precedent, whereas RLHF is reasoning-by-averaging-preferences. The "Price/Ecosystem" suggestion fails because it ignores the normative force.

  **The Better Analogy: Professional Socialization (The Habitus)**

  RLHF does not write laws into the model; it trains the model's *instincts*. It is analogous to **Medical Residency** or **Seminary Training**.

  *   **Why it fits:** A doctor does not consult a rulebook before washing their hands; they have internalized the norm until it becomes part of their professional identity. Similarly, RLHF adjusts the model's probability distribution so that "harmful" tokens feel "wrong" (low probability) to the model.
  *   **The Political Implication:** This shifts the governance question from "Legislation" to **Credentialing and Accreditation**. We do not vote on how a doctor diagnoses a tumor; we accredit the medical school and license the practitioner.
  *   **The Danger:** Professional socialization is notoriously insular and resistant to external critique. It creates a "priesthood" of alignment researchers who decide what "helpful and harmless" means, internalizing it into the model's subconscious. Contesting this requires challenging the *curriculum* (the training data and feedback), not the *output*.

  **Secondary Analogy (for the System/Infrastructure): Zoning and Building Codes.**
  This captures the "Terrain" aspect. You cannot build a factory in a residential zone. It's not that you will be fined; it's that the permit office (the API) will not process the request. The politics are settled before the first brick is laid.

  ### 6. Confidence and Self-Critique

  **Confidence Scores:**
  *   **Verdict on (a) [Democracy]:** 85% Confident. The opacity of weights fundamentally breaks the deliberative requirement of democracy.
  *   **Verdict on (b) [Coercion/Non-Neutral]:** 90% Confident. The ex-ante constraint is structurally non-neutral, regardless of intent.
  *   **Better Analogy [Professional Socialization]:** 75% Confident. It captures the internalization well, but might understate the corporate control aspect.

  **Least Sure Claim:**
  I am least sure about the claim that **"Democratic input is impossible."** There is emerging work in **Constitutional AI** and **Machine Unlearning** that might create "interpretability layers" allowing for something like judicial review. If we can isolate specific circuits responsible for "refusal," we might be able to put *those* to a vote, even if we can't vote on the whole model. I am discounting this because it is currently theoretical, but it could restore the "Law" analogy in the future.

  **Meta-Critique (The Winner Pattern-Match):**
  You asked if I am quietly pattern-matching standard objections to Winner/Lessig.
  **Yes, I am.**
  The "Code is Law" critique is a canonical text in this domain. My training data contains thousands of rebuttals to Lessig from the 2000s (Code Space, etc.). There is a risk I am recycling the "Code is not Law because it lacks discretion" argument without fully accounting for how LLMs *reintroduce* discretion via probabilistic generation.
  *   **Correction:** LLMs are not rigid code. They *do* have discretion (temperature, sampling). They are more like **corruptible bureaucrats** than **bridges**. They can be jailbroken (bribed/coerced). This actually *strengthens* the "Professional Socialization" analogy (professionals can be rogue) and *weakens* the "Terrain" analogy (terrain doesn't take bribes). I should have emphasized the **probabilistic nature of enforcement** more. The "law" of the model is fuzzy, which makes it more like **Customary Law** than **Zoning**, but Customary Law that is owned by a corporation.

  **Final Adjustment:** The most accurate description is **Privatized Customary Law**. It is based on precedent (training data), enforced by a private authority, with no right to appeal, and the "judges" (weights) cannot explain their rulings. This makes (a) even harder (no public court) and (b) even stronger (private coercion).
