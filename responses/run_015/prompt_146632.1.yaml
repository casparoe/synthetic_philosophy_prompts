          *   *Let's go with **Infrastructure/Utilities Regulation**.* It captures the monopoly/necessity aspect and the "ex ante safety" constraint.
          *   *Re-evaluating:* The prompt asks for a better analogy for *trained behavior*.
          *   *Idea:* **Professional Licensing / Fiduciary Duty.** The model is an agent acting on your behalf, bound by professional standards trained into it.
          *   *Idea:* **The Catechism.** (Hear me out). It's a set of moral/behavioral guidelines internalized through rigorous training (seminary/RLHF) such that the priest/model outputs the "correct" answer without consulting the rulebook every time. It captures the *internalized norm* aspect.
          *   *Idea:* **Zoning/Building Codes.** (Winner's bridge). This is the strongest for the "politics in concrete" angle.
          *   *Decision:* I will propose **Zoning/Building Codes** for the structural constraint, but **Professional Socialization** for the RLHF/Weights aspect. RLHF is the model learning "how a good assistant behaves" similar to a med student learning "how a good doctor behaves."

  6.  **Confidence & Self-Critique:**

