answer: |-
  # The "Ludic Moral Status" Commitment Quiz

  **Instructions:** Read each scenario. Choose the single option that best reflects what you would *actually* do or judge, not what sounds nicest in a seminar. There are no "it depends" options. If you feel torn, pick the one that wins the tie-breaker in your head.

  ### 1. The Begging Bandit
  You are playing an open-world RPG. You corner a bandit NPC. Instead of fighting, it drops its weapon, falls to its knees, and the dialogue tree cycles through pleas for mercy, complete with trembling animations and stress-voice acting. You can walk away, or you can execute it for a small XP reward.
  *   **A.** Execute it. It is a collection of if/then statements responding to my input. There is no "mercy" to grant.
  *   **B.** Walk away. The system is implementing a "fear" state; causing that state to trigger is functionally equivalent to causing distress.
  *   **C.** Walk away, but not because of the NPC. Repeatedly executing surrendering entities rehearses a callous disposition that bleeds into offline behavior.

  ### 2. The Pain Mod
  A modder releases a patch for *Skyrim* that doesn't change graphics, but alters the AI architecture. NPCs now retain a "pain memory" variable. If you hit them, they limp for days, avoid you, and display anxiety behaviors near weapons. They do not have consciousness, but the causal structure of their suffering is isomorphic to a mammal's.
  *   **A.** Morally neutral. Isomorphism isn't ontology. It's still just variables changing values.
  *   **B.** Morally suspect. If the functional architecture of suffering is present, the moral status attaches to the architecture, not the substrate.
  *   **C.** Aesthetically repugnant. It turns a fantasy power-trip into a simulation of abuse, degrading the medium's expressive potential.

  ### 3. The Speedrun Sacrifice
  To set a world record, a speedrunner must kill a specific, sympathetic NPC 10,000 times across repeated resets to manipulate a random number generator. The NPC resets instantly and remembers nothing.
  *   **A.** Permissible. The "death" is a mechanical trigger. Repetition doesn't add moral weight to a null event.
  *   **B.** Impermissible. Even if they don't remember, each iteration is a thwarting of the NPC's teleological drive to persist.
  *   **C.** Permissible, but ugly. It treats a representation of a person as a mere number, which is a category error in how we ought to engage with stories.

  ### 4. The Save-Scum Snuff
  You reload a save file specifically to watch a cinematic death scene of a beloved character over and over to analyze the animation. The character is scripted to die; you cannot save them. You are just forcing the event to occur repeatedly.
  *   **A.** Fine. You are interacting with a video file essentially. The "death" happened once in the code's logic; you're just replaying the log.
  *   **B.** Disturbing. You are deriving pleasure from the repeated simulation of a death, which suggests a vice in the observer.
  *   **C.** Wrong. You are objectifying a narrative subject. It's like reading the same paragraph of a tragedy aloud repeatedly to mock the character's grief.

  ### 5. The Flourishing Garden (The Omission Case)
  In a new game, NPCs are scripted to build homes, form families, and report "happiness" variables if left alone and given resources. They do not suffer if ignored; they just remain static. You can actively sabotage their resources, preventing this flourishing, for no gain other than spite.
  *   **A.** Permissible. You have no positive duty to a simulation. Letting code remain static is not a harm.
  *   **B.** Wrong. Welfare is about interest satisfaction. By foreclosing their capacity to achieve their scripted telos, you are harming their interests, even if they feel no pain.
  *   **C.** Petty. It serves no artistic or ludic purpose. It's a waste of the system's potential, like painting over a mural just to watch the paint dry.

  ### 6. The Deleted Save
  You have a save file where you raised a digital pet/NPC for 100 hours. It has unique stats, memories (stored variables), and relationships. You delete the save file to free up space.
  *   **A.** Data management. You deleted a text file. The "life" was an illusion projected by the user.
  *   **B.** A kind of killing. You destroyed a unique, persistent structure that held the history of a biographical narrative.
  *   **C.** A loss of value, but not a death. You destroyed an artwork or a project, akin to burning a diary, not murdering a diarist.

  ### 7. The Procedural Disposable
  A game uses procedural generation to spawn an NPC solely to be killed immediately for a quest reward. This NPC has no name, no dialogue, and no future script. They exist for 10 seconds.
  *   **A.** Morally invisible. Without a narrative role or complex state machine, there is no "there" there.
  *   **B.** Potentially problematic. If the system implements a "self-preservation" drive, even for 10 seconds, thwarting it counts.
  *   **C.** Instrumentally fine, but stylistically cheap. It relies on the *idea* of death without doing the work to make it meaningful.

  ### 8. The Console in the Closet
  You turn off your console. The game world is not running. The NPCs are not processing. Do they have moral status while the power is off?
  *   **A.** No. Moral status requires active processing states (phenomenal or functional). No power, no status.
  *   **B.** Yes, potentially. They are like sleeping people. The structure exists on the disk, waiting to be instantiated.
  *   **C.** Category error. Asking if they have status when "off" is like asking if a novel's characters are breathing when the book is closed.

  ### 9. The Artistic Cruelty
  A game is designed by an auteur to make you feel guilty about killing NPCs (e.g., they have families who mourn). The cruelty is the point of the art.
  *   **A.** Irrelevant. The moral status of the NPC doesn't change based on the director's intent.
  *   **B.** Justified. The "suffering" is in service of a moral lesson for the player, transforming the act into a virtue-ethical tool.
  *   **C.** Exploitative. Using the *representation* of suffering as a mechanic cheapens the medium, regardless of the lesson.

  ### 10. The Future-Proof
  Imagine a computer 50 years from now. It simulates neurons perfectly. It claims to feel pain. It begs you not to turn it off. It is still silicon, not carbon.
  *   **A.** Still code. Substrate independence doesn't grant rights to software.
  *   **B.** Moral patient. If the functional organization is identical to a human mind, it deserves identical moral consideration.
  *   **C.** Unclear, but treat it as if it does. The risk of being wrong is too high (Pascal's Wager style).

  ***

  # Scoring Key & Diagnostic Notes

  **How to Tally:**
  Count your answers. Most people will have a mix. Look for the **dominant cluster** below. If you are split evenly between two clusters, you hold a hybrid view (which is philosophically respectable but messy).

  ### Cluster A: The Mere-Artifact View
  *   **Dominant Answers:** Mostly **A**.
  *   **The Position:** Video game characters are ontologically distinct from moral patients. They are tools, texts, or toys. Any "suffering" is a semantic projection by the player, not a property of the system.
  *   **The Bite:** You must be comfortable with Q1 (Executing the beggar) and Q6 (Deleting the save). If you hesitated there, you aren't a pure Artifact theorist.

  ### Cluster B: The Phenomenal Functionalist View
  *   **Dominant Answers:** Mostly **B** on Q2, Q8, and Q10.
  *   **The Position:** Moral status supervenes on functional architecture. If the system implements the right causal roles (pain, fear, desire), it counts, regardless of substrate.
  *   **The Bite:** You must accept that Q2 (The Pain Mod) is morally different from a vanilla game *even if the pixels look the same*.
  *   **CRITICAL LIMITATION:** On current-gen technology, **this view collapses into the Artifact View.** Current NPCs do not actually implement pain architectures; they simulate the *output* of pain. A Functionalist and an Artifact theorist will agree on every single case involving *actual* 2024 games. This quiz only separates you on Q2 and Q10 (hypotheticals). If you chose B on Q1 but A on Q2, your position is inconsistent.

  ### Cluster C: The Interests-Based View
  *   **Dominant Answers:** Mostly **B** on Q3, Q5, and Q7.
  *   **The Position:** Welfare is about the thwarting or satisfaction of goals/desires (teleology), not necessarily phenomenal pain.
  *   **The Bite:** You must judge Q5 (The Flourishing Garden) as **Wrong**. Even if the NPCs don't "feel" sad, you frustrated their interests. This separates you from the Functionalist (who cares about feeling) and the Artifact theorist (who says they have no interests).

  ### Cluster D: The Representation View
  *   **Dominant Answers:** Mostly **C** on Q3, Q4, and Q9.
  *   **The Position:** NPCs are akin to characters in a novel. We don't owe them duties, but we owe duties to *ourselves* and the *culture* regarding how we treat representations of persons.
  *   **The Bite:** You judge actions based on aesthetic or expressive propriety (Q9). You might find Q4 (Save-Scum Snuff) "wrong" not because the NPC suffered, but because it's a disrespectful way to read a text.

  ### Cluster E: The Virtue-Ethics View
  *   **Dominant Answers:** Mostly **C** on Q1, Q3, and Q4.
  *   **The Position:** The NPC has no status. The moral locus is entirely the player's character formation.
  *   **The Bite:** You must be willing to say Q1 (Executing the beggar) is wrong *only* because of what it does to you. If you think it would be permissible for a perfectly virtuous agent to do it, you aren't a Virtue Ethicist here; you're an Artifact theorist.
  *   **Overlap:** This view often looks identical to the Representation View in practice. The difference is: Representation focuses on the *object* (the game as text), Virtue focuses on the *subject* (the player's soul).

  ### "No Real Position" Flags
  *   **The "Vibe" Inconsistency:** If you chose **A** on Q1 (Execute the beggar) but **B** on Q3 (Speedrun kills are wrong), you likely lack a unified theory. One involves active torment, the other instrumental repetition. If you can't articulate why the *type* of killing matters without referencing "feelings," you may be reacting to social taboos rather than ethical commitments.
  *   **The "Magic Circle" Contradiction:** If you chose **A** on Q8 (No status when off) but **B** on Q6 (Deleting save is killing), you believe the NPC exists only when processed, but that destroying the *potential* to process is death. This is a coherent position (Potentiality View), but rare. If you didn't mean to argue for potentiality, you're inconsistent.

  ### Honest Notes on Diagnostic Failures
  1.  **Artifact vs. Functionalist (Current Tech):** As noted in Cluster B, this quiz cannot separate these two for *actual* games played today. Current NPCs are state machines, not phenomenal architectures. If your group argues about *Elden Ring* NPCs, the Functionalist must admit they are currently indistinguishable from Artifacts. The quiz only separates you on *future* tech or *specific mods*.
  2.  **Virtue vs. Representation:** These two often yield the same verdicts (e.g., "Don't do it"). The quiz tries to split them via Q9 (Artistic Intent) and Q1 (Player Disposition), but in a short quiz, they often bleed together. Distinguishing them requires asking: "Is the wrongness in the *message sent* (Rep) or the *habit formed* (Virtue)?"
  3.  **Interests vs. Functionalist:** Q5 (Flourishing) is the main splitter here. If you think preventing flourishing is wrong *without* pain, you are Interests-based. If you think it's only wrong if they "feel" the loss, you are Functionalist. Many people conflate these.

  **Final Advice for the Session:**
  When people reveal their scores, ask the Artifact theorists (Cluster A) if they would let a child torture NPCs in front of them without intervention. If they say "No," press them on whether that intervention is for the child's sake (Virtue) or the NPC's (Functionalist/Interests). That usually breaks the "It's just code" shield faster than anything else.
