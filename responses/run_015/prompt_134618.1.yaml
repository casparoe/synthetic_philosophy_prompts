prompt: |-
  I am a fourth-year PhD student in systems neuroscience, and my PI has asked me to draft a one-page interpretation guide for the lab: a short written procedure that anyone in the group — including first-year rotation students with no philosophy background — can run on a single sentence before it goes into a paper, a preprint, or a grant abstract, in order to decide what we are entitled to say when we write that some neural population computes, encodes, represents, or implements something, and what we are not.

  The setting: we produce sentences of this shape dozens of times per manuscript, they are the sentences reviewers have started attacking in our last three submissions, and the lab has made a public commitment to not overclaiming in abstracts. So the stakes are reputational and practical rather than purely theoretical. The constraints are that the procedure must be runnable in about ten minutes on one sentence, must not require new experiments or any formalism beyond what a first-year can follow, and must be signed off by my PI — which means it has to say plainly which steps are tests and which are judgment calls being handed to her.

  What I need is the work of translation: the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the remaining question to a person because the issue is one of values or of theoretical taste rather than fact.

  I have three half-formed ideas about where our disputes actually come from, and I want you to use them, repair them, or replace them with better cuts.

  First, I suspect we are not making one kind of claim but three, and that most of our arguments are cases of one person meaning one and another hearing another: a descriptive claim (the formalism is a compact summary of a measured response profile); an intervention-licensing claim (the formalism lets you predict what the system will do under interventions or stimuli you have not measured, because the mapping from physical states to formal states is fixed independently of the outcome being predicted); and a constitutive claim (the system performs the cognitive job in question because it computes that function — the formalism is doing explanatory work, not bookkeeping). I would like the verdict of the procedure to be one of these labels rather than a yes or no, and I would like it to return an error when the intended reading has not been stated, forcing us to choose.

  Second, the mapping is where I think most of the cheating happens, in two directions. The mapping from neural variables to formal variables is usually estimated on the same data used to test the claim, and can be re-estimated whenever behaviour changes, so the claim survives every outcome by moving the mapping — I think of this as mapping drift, and I want a preregistration-style step that fixes the mapping and the failure condition before the held-out data are looked at. In the other direction, the population itself can be re-carved until it fits, and a good deal of the formal machinery often lives outside the animal, in an offline decoder that only an experimenter can read out; a claim that the circuit computes X then turns out to be a claim that X is recoverable from the circuit by us. I want the procedure to be able to say that the computation was completed in the analysis pipeline rather than in the brain.

  Third, I do not see how to get from passing individual claims to the sentence our grant framing depends on, the brain is a computer. Computation claims do not seem to aggregate: a decomposition that works for one assayed circuit is not automatically part of a single coherent decomposition of the whole animal, and the question of whether the constitutive reading has to hold of the organism looks to me like a commitment rather than a result.

  Please run the finished procedure on three claims. First: direction-selective circuits in the retina compute the axis of visual motion. Second, and this is the one I expect not to like — my own thesis claim, that dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions, where the evidence is a decoder trained offline on choice behaviour and the mapping is re-fit whenever the task changes; if the procedure exempts my own claim I will have written a useless document, so I want the honest output. Third: a cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy — where I worry the procedure either returns a yes and collapses into the triviality that any system computes anything under some mapping, or returns a no and cannot tell me what the in-brain case has that this one lacks.

  Finally, say what the procedure cannot do, including whether it can say anything at all about whether the brain is a computer, and flag in the guide's own voice the cases where it is likely to misfire. Please do not give me a literature review or references; I will insert citations myself.
reasoning: |-
  Here's a thinking process that leads to the suggested interpretation guide:

  1.  **Analyze the Request:**

      *   **User:** 4th-year PhD student in systems neuroscience.
      *   **Task:** Draft a one-page interpretation guide (procedure) for the lab.
      *   **Audience:** Lab members (including 1st-years with no philosophy background).
      *   **Goal:** Determine what the lab is entitled to say when claiming a neural population *computes/encodes/represents/implements* something. Prevent overclaiming (reputational/practical stakes).
      *   **Constraints:**
          *   Runnable in ~10 minutes on a single sentence.
          *   No new experiments.
          *   No heavy formalism (accessible to 1st-years).
          *   Must distinguish between *tests* (factual) and *judgment calls* (handed to PI).
          *   Output must be one of three labels: Descriptive, Intervention-Licensing, or Constitutive (or Error).
          *   Must address "mapping drift" and "analysis pipeline" issues.
          *   Must run on three specific test cases (Retina, dACC thesis, Cultured Network).
          *   Must include limitations (what it *can't* do, specifically regarding "the brain is a computer").
          *   No literature review/references.

  2.  **Deconstruct the User's "Half-Formed Ideas":**

      *   *Idea 1 (Three Claims):* Descriptive (summary), Intervention-Licensing (prediction), Constitutive (explanation). *Verdict:* This is strong. It aligns well with standard philosophical distinctions (instrumentalism vs. realism) but translated into lab speak. I need to make the criteria for each distinct and operational.
      *   *Idea 2 (Mapping Cheating):* Mapping drift (fitting on test data) and Readout Problem (computation in analysis vs. brain). *Verdict:* Crucial. Needs specific "Stop/Go" questions about data separation and readout mechanisms.
      *   *Idea 3 (Aggregation/Global Claim):* "The brain is a computer." *Verdict:* The user admits this is a commitment, not a result. The guide should explicitly state it *cannot* resolve this, preventing the procedure from overreaching.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to look like a checklist or flowchart text. Clear headings. Time limit warning.
      *   *Step 1: Define the Claim.* Force the user to pick one of the three labels *before* testing. If they can't, it's an Error.
      *   *Step 2: The Mapping Test (Data Independence).* Address "mapping drift." Did we define the mapping on independent data?
      *   *Step 3: The Readout Test (Locality).* Address "computation in the pipeline." Is the readout mechanism available to the downstream neurons, or only the experimenter?
      *   *Step 4: The Intervention Test (Prediction).* Address "Intervention-Licensing." Does it predict *new* perturbations?
      *   *Step 5: The Constitution Handoff.* Address "Constitutive." This is the judgment call. If Steps 2 & 3 pass, does it *explain* the behavior or just correlate? This goes to the PI.

      *Refining the Labels:*
      *   *Descriptive:* "We observed a pattern." (Safe, low bar).
      *   *Predictive (Intervention-Licensing):* "We can predict outcomes." (Medium bar, requires held-out data).
      *   *Explanatory (Constitutive):* "This *is* how the brain does it." (High bar, requires mechanism + PI sign-off).

      *Refining the "Mapping" constraint:* The user mentioned "mapping drift." The test needs to ask: Was the decoding/encoding model fixed *before* looking at the test data?
      *Refining the "Readout" constraint:* The user mentioned "offline decoder." The test needs to ask: Is there a plausible biological readout?

  4.  **Running the Test Cases:**

      *   *Case 1: Retina (Direction Selectivity).*
          *   Claim: Computes axis of motion.
          *   Mapping: Biophysical (starburst amacrine cells), fixed by anatomy/physiology.
          *   Readout: Downstream ganglion cells receive this directly.
          *   Intervention: Blocking specific pathways changes motion sensitivity predictably.
          *   Verdict: Likely **Constitutive** (strongest case).
      *   *Case 2: dACC (Thesis Claim).*
          *   Claim: Computes cost/benefit comparison.
          *   Mapping: Decoder trained offline, re-fit per task. (Red Flag: Mapping Drift).
          *   Readout: Experimenter reads it, not necessarily downstream neurons.
          *   Intervention: Likely correlational or weak perturbation.
          *   Verdict: **Descriptive** (at best). If they claim Constitutive, the procedure should flag it as "Error/PI Review" because of the mapping drift. *Self-Correction:* The user wants the honest output. If the mapping is re-fit, it fails the Predictive test. It falls back to Descriptive.
      *   *Case 3: Cultured Network (Control Policy).*
          *   Claim: Computes control policy.
          *   Mapping: Feedback loop involves external computer.
          *   Readout: The "policy" exists in the closed loop (brain + computer), not just the culture.
          *   Verdict: **Descriptive** of the closed-loop system, but **Error** if claimed as intrinsic computation of the culture alone. It highlights the "triviality" risk.

  5.  **Addressing the Limitations:**

      *   Can it decide "The brain is a computer"? No. That's a metaphysical stance.
      *   Where does it misfire? Complex, distributed circuits where "downstream" is hard to define.

  6.  **Writing the Document (Tone and Format):**

      *   Tone: Professional, direct, instructional, slightly cautious (matching the "reputational stakes").
      *   Format: One-page style (concise, bold headers).
      *   Specific requirement: "Flag in the guide's own voice the cases where it is likely to misfire." -> Add a "Known Failure Modes" section.

  7.  **Review against Constraints:**

      *   10 minutes? Yes, it's a checklist.
      *   No new experiments? Yes, checks existing analysis methods.
      *   PI Sign-off? Yes, Step 5 explicitly hands off the "Explanatory" claim.
      *   Three labels? Yes (Descriptive, Predictive, Explanatory).
      *   Test cases included? Yes.
      *   Limitations included? Yes.

  8.  **Final Polish:** Ensure the distinction between "Predictive" (Intervention-Licensing) and "Explanatory" (Constitutive) is clear. Predictive is about *accuracy on new data*; Explanatory is about *causal mechanism*. The dACC case is the hardest: if the decoder is re-fit, it's not predictive. It's just fitting noise/structure post-hoc. I need to make sure the guide catches that.

      *Refining the dACC verdict:* If the mapping is re-fit whenever the task changes, the mapping is not stable. Therefore, it cannot be Predictive (Intervention-Licensing). It is purely Descriptive. If the student claims Constitutive, the guide must stop them. This satisfies the user's request for honesty ("if the procedure exempts my own claim I will have written a useless document").

      *Refining the Cultured Network:* The issue is the "system boundary." If the feedback is external, the computation is hybrid. The guide needs a "System Boundary" check.

      *Refining the "Brain is a Computer" question:* The guide must explicitly state it is agnostic on the global claim.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # Lab Procedure: Neural Claim Verification (NCV-1)

  **Purpose:** To classify and validate sentences claiming a neural population *computes, encodes, represents,* or *implements* a variable/function.
  **Time Limit:** 10 minutes per sentence.
  **User:** Any lab member. **Sign-off:** PI required for "Explanatory" classification.

  ---

  ## Part 1: Select the Claim Type
  *Before testing, label the intended meaning of the sentence. If you cannot select one, stop. The sentence is ambiguous and must be rewritten.*

  1.  **Descriptive:** "The activity pattern correlates with/is a compact summary of X." (Bookkeeping)
  2.  **Predictive:** "Knowing the activity allows prediction of X under *new* conditions/stimuli." (Intervention-Licensing)
  3.  **Explanatory:** "The system performs the behavioral job *because* it computes X." (Constitutive)

  ---

  ## Part 2: The Validation Checks
  *Answer Yes/No. A single "No" demotes the claim to the next lower tier.*

  ### Check A: Mapping Stability (Tests Predictive & Explanatory)
  **Question:** Was the mapping from neural data to the formal variable (the decoder/encoder) fixed *before* looking at the test data used to validate the claim?
  *   **Yes:** Proceed to Check B.
  *   **No:** **STOP.** Claim is demoted to **Descriptive**.
      *   *Reason:* If the mapping is re-fit when behavior/task changes ("mapping drift"), you are describing a fit, not a mechanism. You cannot claim prediction.

  ### Check B: Readout Locality (Tests Explanatory)
  **Question:** Is the information read out by a biological mechanism downstream of the recorded population, or only by the experimenter's offline analysis?
  *   **Biological Readout:** Proceed to Check C.
  *   **Experimenter Readout:** **STOP.** Claim is demoted to **Descriptive** (or Predictive regarding the *experimenter's* knowledge, not the animal's).
      *   *Reason:* If the "computation" requires an offline decoder unavailable to the nervous system, the computation occurs in the analysis pipeline, not the brain.

  ### Check C: Intervention Independence (Tests Explanatory)
  **Question:** Does the claim survive perturbation? (i.e., If you disrupt the specific neural pattern identified, does the predicted function/behavior fail in a specific way, independent of re-fitting the model?)
  *   **Yes:** Proceed to Handoff.
  *   **No:** **STOP.** Claim is demoted to **Predictive** (at best).
      *   *Reason:* Without causal leverage, you have correlation, not constitution.

  ---

  ## Part 3: The PI Handoff
  *If you have passed Checks A, B, and C, you have cleared the factual hurdles. The final step is theoretical.*

  **The Handoff Question:** "Does explaining this circuit as computing X add explanatory power over simply describing the input-output mapping, or is 'computation' just a synonym for 'correlation' here?"
  *   **Action:** This is a **Judgment Call**. Mark the claim as **Explanatory (Tentative)** and submit to PI.
  *   **PI Role:** The PI decides if the theoretical commitment is warranted for the specific audience (grant vs. paper).

  ---

  ## Part 4: Known Failure Modes (Read Before Use)
  *This procedure is a filter, not a truth machine. It will misfire in the following cases:*

  1.  **The "Triviality" Trap:** Any system can be described as computing *something* if the mapping is complex enough. Check A prevents this on *prediction*, but cannot prevent a clever Descriptive claim from being trivial.
  2.  **System Boundaries:** This procedure assumes the "brain" or "circuit" is the system. If the task relies on closed-loop feedback with external hardware (e.g., brain-machine interfaces, cultured networks driving simulators), Check B will likely fail. This is a feature, not a bug: the computation is hybrid, not intrinsic.
  3.  **Global Claims:** **This procedure cannot adjudicate the claim "The brain is a computer."** That is a metaphysical stance, not an empirical result. Do not use NCV-1 to justify global framing in grant abstracts; use it only for specific circuit claims.
  4.  **Distributed Circuits:** If the "downstream readout" (Check B) is diffuse or unknown (common in cortex), you may be forced to default to Descriptive even if Explanatory is plausible. When in doubt, default to Descriptive.

  ---

  ## Application to Test Cases

  ### Case 1: Retina Direction-Selectivity
  *Claim:* "Direction-selective circuits in the retina compute the axis of visual motion."
  *   **Claim Type:** Explanatory.
  *   **Check A (Mapping):** **Pass.** The biophysical mapping (starburst amacrine cell asymmetry) is defined by anatomy/physiology, not fit to behavior data.
  *   **Check B (Readout):** **Pass.** Downstream ganglion cells receive this specific input; the readout is biological.
  *   **Check C (Intervention):** **Pass.** Blocking specific inhibitory inputs abolishes direction selectivity predictably.
  *   **Verdict:** **Explanatory (Tentative).** Handoff to PI. (High confidence of approval).

  ### Case 2: dACC Cost/Benefit Comparison (Thesis Claim)
  *Claim:* "Dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions."
  *   **Claim Type:** Explanatory (Intended).
  *   **Check A (Mapping):** **FAIL.** Evidence relies on a decoder trained offline and re-fit whenever the task changes.
  *   **Verdict:** **Descriptive.**
  *   **Note:** The procedure correctly identifies that if the mapping moves to match the task, you are describing a correlation between dACC activity and the *current* task structure, not a fixed computational mechanism. To claim Explanatory, you must fix the decoder across task variations or demonstrate causal disruption.

  ### Case 3: Cultured Network Control Policy
  *Claim:* "A cultured network... computes a control policy."
  *   **Claim Type:** Explanatory.
  *   **Check A (Mapping):** **Pass** (Assuming fixed training protocol).
  *   **Check B (Readout):** **FAIL.** The "policy" is realized only when the culture is coupled to the external simulator and feedback loop. The culture alone does not contain the policy; the *hybrid system* does. The readout is largely external.
  *   **Verdict:** **Descriptive** (of the culture's contribution to the loop).
  *   **Note:** Prevents the triviality claim. The culture is a component, not the sole computer.

  ---

  **Revision History:** v1.0 (Draft for Lab Review)
  **Owner:** [PI Name]
