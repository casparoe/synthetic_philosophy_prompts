      *   **Why the branching case exposes it:** Branching breaks the one-to-one mapping required by strict identity. If identity is what matters, branching is catastrophic (death or confusion). If *psychological continuity* is what matters, branching can be survivable (Parfit).
      *   **The Three Positions in Branching:**
