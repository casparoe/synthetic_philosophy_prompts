      *   *Correction:* On the "Pre-agreed rule": Nozick would say you can't alienate your right to withdraw consent in the way required for a permanent pattern without violating self-ownership. But this is deep waters. I should focus on the distinction between *terms of transfer* vs. *background rules*.
      *   *Tone Check:* Ensure I'm not talking down. The user's analysis is sophisticated. Match that level.

  7.  **Final Structure:**
