answer: |-
  The maxim you cite is a colloquial rendering of the **Principle of Subsidiarity**. Its rhetorical power lies in its ambiguity: it combines a *presumption* (lowest level) with a *constraint* (capacity to handle). By shifting the definition of "handle" or the baseline of "lowest," the same phrase can justify radical decentralization or robust centralization.

  Here is a disambiguation of the maxim into six distinct theses, ranging from the tautological to the radical, analyzed against your criteria and specific cases.

  ### 1. The Logical Floor (The Tautology)
  *   **The Claim:** If a lower level of government literally lacks the physical or legal capacity to perform a function, authority must reside higher up.
  *   **Classification:** Conceptual Truth.
  *   **Status:** Platitude. (It is logically impossible to assign a task to an agent incapable of performing it).
  *   **Plausibility:** Trivially true.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Upward Assignment**. A single member state cannot prevent "carbon leakage" (companies moving to laxer jurisdictions) on its own; only the EU bloc can handle the border mechanics.
      *   **US Housing:** Supports **Upward Assignment**. If the housing shortage is regional, a single municipality cannot "handle" regional supply dynamics; coordination requires a higher level.
  *   **Intent vs. Implicit:**
      *   **Intended:** Speakers rarely mean this. It is too obvious to be a political argument.
      *   **Implicitly Relied On:** They rely on it to sound reasonable, but they implicitly redefine "handle" to exclude cross-border efficacy (see Thesis 4).

  ### 2. The Epistemic Advantage (The Hayekian Claim)
  *   **The Claim:** Lower levels possess superior local knowledge (preferences, conditions, context) necessary to execute the task effectively.
  *   **Classification:** Efficiency Claim (Empirical).
  *   **Status:** Defensible but Substantive. (True for many public goods, false for others).
  *   **Plausibility:** High for context-specific services (policing, schools); low for standardized regulations.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Downward Delegation**. Speakers argue national governments know their own energy mix and industrial base better than Brussels.
      *   **US Housing:** Supports **Downward Delegation**. Speakers argue local planners understand neighborhood traffic and character better than federal HUD officials.
  *   **Intent vs. Implicit:**
      *   **Intended:** This is usually the **primary explicit intent**. It frames the argument as one of competence, not ideology.
      *   **Implicitly Relied On:** They assume local knowledge outweighs the cost of coordination failure. They would reject the implication that federal experts might possess *better* data on regional migration or global trade flows.

  ### 3. The Accountability Principle (The Democratic Claim)
  *   **The Claim:** Authority should reside where voters can most easily monitor officials and vote them out if the job is done poorly.
  *   **Classification:** Normative Democratic Principle.
  *   **Status:** Defensible but Substantive.
  *   **Plausibility:** High. Proximity generally increases political efficacy.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Downward Delegation**. Voters can punish a national minister for energy prices; they cannot easily punish the EU Commission.
      *   **US Housing:** Supports **Downward Delegation**. Homeowners can vote out a city council member who changes zoning; they cannot vote out the President for housing mandates.
  *   **Intent vs. Implicit:**
      *   **Intended:** Often a **secondary explicit intent**, framed as "local control."
      *   **Implicitly Relied On:** They rely on the assumption that the "job" is satisfying local voters. They would reject the notion that the "job" is satisfying *non-voting* stakeholders (e.g., potential migrants, future generations, or foreign trading partners affected by carbon).

  ### 4. The Externality Constraint (The Functional Definition)
  *   **The Claim:** To "handle the job" means to solve the problem *completely*, including managing negative spillovers (externalities) onto other jurisdictions.
  *   **Classification:** Efficiency Claim / Functional Definition.
  *   **Status:** Defensible but Substantive (and dangerous to decentralists).
  *   **Plausibility:** High. A solution that exports problems is not a solution.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Upward Assignment**. If a member state lowers standards, it undermines neighbors. Only the EU "handles" the job of decarbonization without leakage.
      *   **US Housing:** Supports **Upward Assignment**. If one town restricts zoning, it pushes demand (and prices) into neighboring towns. Only a regional/federal body "handles" the shortage.
  *   **Intent vs. Implicit:**
      *   **Intended:** Speakers in your examples **explicitly reject** this reading. They define "the job" narrowly (e.g., "setting national climate policy" rather than "reducing global emissions").
      *   **Implicitly Relied On:** They cannot rely on this. If they accepted this definition, their arguments would collapse. They must argue that externalities are irrelevant to the definition of "handling."

  ### 5. The Burden of Proof (The Procedural Presumption)
  *   **The Claim:** Even if a higher level *could* handle the job more efficiently, authority stays low unless there is a compelling justification for moving it up.
  *   **Classification:** Normative Political Principle.
  *   **Status:** Defensible but Substantive.
  *   **Plausibility:** Moderate. It privileges stability and autonomy over optimization.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Downward Delegation**. Even if the EU is more efficient, the burden is on Brussels to prove why national sovereignty should be breached.
      *   **US Housing:** Supports **Downward Delegation**. Even if federal mandates fix shortages faster, the burden is on Washington to prove why local home rule should be overridden.
  *   **Intent vs. Implicit:**
      *   **Intended:** This is the **core political intent**. It is a claim about rights and sovereignty, not just efficiency.
      *   **Implicitly Relied On:** They rely on the assumption that "autonomy" is a higher good than "outcome." They would reject the plain statement that "we prefer local failure to central success."

  ### 6. The Autonomy Priority (The Radical Localist Claim)
  *   **The Claim:** Authority belongs at the lowest level *even if* that level cannot handle the job effectively, because self-determination is more valuable than the service provided.
  *   **Classification:** Rights-Based / Anti-Centralization Thesis.
  *   **Status:** Radical / Self-Undermining (regarding the maxim's text).
  *   **Plausibility:** Low (as a reading of the maxim). This contradicts the "can actually handle" clause.
  *   **Application to Cases:**
      *   **EU Carbon:** Supports **Downward Delegation**. Member states should control climate policy even if it leads to higher global emissions.
      *   **US Housing:** Supports **Downward Delegation**. Municipalities should control zoning even if it perpetuates a regional homelessness crisis.
  *   **Intent vs. Implicit:**
      *   **Intended:** Speakers rarely admit this, as it sounds irresponsible.
      *   **Implicitly Relied On:** This is often the **true underlying motivation**. When speakers use the maxim to defend local zoning despite regional shortages, they are prioritizing local exclusionary power over regional housing needs. They would reject this if stated plainly because it admits the lower level *cannot* "handle the job."

  ---

  ### Summary of the Dispute Dynamics

  In both the EU Carbon and US Housing disputes, the interlocutors are engaging in a **definitional bait-and-switch** between Thesis 2 (Epistemic Advantage) and Thesis 6 (Autonomy Priority), while shielding themselves with Thesis 1 (Logical Floor).

  1.  **What they intend:** They want you to hear **Thesis 2** ("Locals know best"). This makes them sound pragmatic and efficient.
  2.  **What the cases demand:** Both cases involve **Thesis 4** (Externalities). Carbon leakage and regional housing markets are classic examples where the "lowest level" *cannot* "handle the job" by definition.
  3.  **What they implicitly rely on:** To maintain their position despite Thesis 4, they are secretly relying on **Thesis 6** (Autonomy Priority). They value the *right to zone* or the *right to national energy policy* more than the *outcome* of housing supply or carbon reduction.
  4.  **The Contradiction:** If they were forced to accept **Thesis 4** (that "handling" includes managing externalities), the maxim would mandate **Upward Assignment** in both cases. Therefore, their use of the maxim is technically incoherent unless they redefine "the job" to exclude the very problem they are discussing (e.g., defining the job as "local planning" rather than "housing supply").

  **Verdict:** The maxim is being used as a **status-quo preserving heuristic** (Thesis 5) rather than a functional test of capacity. In these specific instances, it is functioning as a rhetorical shield for local veto power, not a genuine guide for allocating authority based on competence.
