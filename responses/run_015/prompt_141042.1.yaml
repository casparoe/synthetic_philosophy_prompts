  4.  **Ranking the Tensions:**

      1.  **#3 vs. #4 (The Endogeneity Problem):** This is the biggest threat. If environment is genetically correlated, the Greenhouse analogy breaks. High $h^2$ doesn't necessarily mean "fair society"; it could mean "genetic advantages are successfully leveraging environmental advantages."
