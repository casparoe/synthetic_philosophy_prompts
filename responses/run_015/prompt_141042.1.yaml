      *   (4) *GxE Correlation:* Environment isn't external; it's partly shaped by genes (gene-environment correlation, $rGE$).
      *   (5) *Literacy Example:* Reading is heritable in universal schooling contexts (supports #3). Reading requires instruction (supports #2).
      *   (6) *Breeder's Equation:* Breeders use $h^2$ to predict population mean shift via selection. User sees tension with #1 (individual-level/forward-looking use).

  3.  **Evaluate Tensions/Contradictions:**

      *   **Tension A: (1) vs. (6)**
          *   *Claim:* User thinks (6) contradicts (1).
