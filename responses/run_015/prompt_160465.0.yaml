      *   *Fatal:* The Personal Identity/Reductionism attack (if framed against the *moral patient* rather than the *agent*). If the "non-arbitrariness" claim relies on a robust self that persists, reductionism kills it. *Correction:* Actually, the Utilitarian version survives reductionism better than the Prudential version. I need to be careful here. The *strongest* fatal flaw is if the "arbitrariness" claim itself relies on a metaphysical fiction.
