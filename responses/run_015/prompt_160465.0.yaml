      *   *Verdict:* Strong challenge. If temporal proximity *constitutes* relational distance, then discounting isn't "pure" (based on date) but "relational." A defender must deny that time *itself* creates moral distance, only that it correlates with other things (probability, identity strength). If time *itself* is the relation, NPTP crumbles.

