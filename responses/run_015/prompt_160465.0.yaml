      *   *Argument:* NPTP assumes Future Me = Present Me. If identity is reductionist (just psychological connections), and those connections fade over time, then weighting the future less isn't arbitrary; it's weighting a *different/less connected* entity less.
      *   *Defender's Response:* This is the strongest philosophical attack. Parfit used reductionism to *support* NPTP (by showing identity doesn't matter, only welfare does). But the user is flipping it: If identity fades, maybe the *claim* fades.
