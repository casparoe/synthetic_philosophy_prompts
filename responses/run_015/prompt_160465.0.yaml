      *(Self-Correction during drafting)*: Wait, on the Reductionism point. Parfit argued Reductionism *supports* NPTP because it weakens the special claim of the present self. The user is asking if Reductionism *undermines* it. The user's intuition is: If future me is a different person, I *can* discount them. So, if Reductionism is true, Future Me *is* a different person. Therefore, discounting is *not* arbitrary. This is a very strong argument against Prudential NPTP. Does it apply to Moral NPTP? Only if we treat generations as different "people." This links to the Relay case. I should connect these two.

