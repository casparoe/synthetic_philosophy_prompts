      *   *Vacuity Check:* A view isn't vacuous if it rules out *justifications*, even if outcomes overlap. However, if no observable policy difference exists, it's practically unfalsifiable.
      *   *Verdict:* Awkward, not fatal. It makes the view ethically pure but policy-quiet. The risk is "motivated numerology" (tweaking hazard rates to match desired discounting).

