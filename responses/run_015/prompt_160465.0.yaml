      *   *Core Claim:* $t_1$ vs $t_2$ matters morally only due to probability of existence, wealth differences (diminishing marginal utility), or existential risk. Not merely because $t_2 > t_1$.
      *   *Justification:* "Date-based discrimination is arbitrary." (Parfit's argument).
      *   *Vulnerability:* It assumes a "view from nowhere" or a specific agent structure (a single continuous moral agent).

  3.  **Analyze Challenge 1: The Relay Case (Institutional/Generational Partiality):**
      *   *Scenario:* Custodians care impartially within their tenure but prioritize their tenure over others.
      *   *Mechanism:* This looks like discounting from the outside, but inside, it's agent-relative partiality.
      *   *Defender's Response:* A NPTP defender usually argues from the perspective of a *single* moral agent (humanity, the planner, the utilitarian calculator). If the "agent" is fragmented (generations), then the NPTP axiom applies *within* each agent, but not *between* agents.
