prompt: |-
  hey im a backend dev with zero formal phil background, putting together a dataset on hard conceptual prompts. i need one drafted as the joint statement from an adversarial collaboration.

  domain: how consciousness is distributed across animals.

  camp A — "recurrent gate": consciousness needs specific loop architectures like global-workspace dynamics or thalamocortical-style recurrence. they think its sparse, mainly mammals, maybe some birds or octopuses with analog loops.

  camp B — "gradient info": consciousness tracks integrated information or deep predictive processing continuously. they think insects and simpler organisms have low-grade versions, maybe even distributed fragments.

  write the document both could sign. structure:
  - numbered agreed-claims section: what they both accept about animal neurobiology, the measurement problem, what behavioral tests can and cant prove, etc.
  - disagreements table: each side's view in wording they'd actually accept, not strawmen.
  - cruxes section: for each crux, name a concrete study or hypothetical case both agree bears on it, and write each camp's prediction in advance.

  the cruxes:
  1. can "microphenomenal fragments" exist without global binding? B might say yes, A says thats just computation not experience.
  2. does interoceptive predicition-error minimization in insects count as affective consciousness or just homeostasis?
  3. should a synthetic system with perfect predictive coding but zero biology be included in the distribution?

  also flag if any part of the fight is verbal — like if they're using "consciousness" differently. keep it focused, no reading lists or citations since the model answering might not have web access. make it weird/niche enough it cant just regurgitate a standard essay — inject the synthetic system case and the fragments idea since those twist familiar concepts in a nonstandard way. write casual, a typo or two is fine.
