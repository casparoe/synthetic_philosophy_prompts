answer: |-
  **DRAFT v0.4 — JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Distribution of Phenomenal Experience Across Substrates
  **Signatories:** Team Recurrent Gate (RG) & Team Gradient Info (GI)

  ---

  ### 1. Agreed Claims (Common Ground)

  Both camps accept the following premises as baseline for this collaboration. We are not debating these.

  1.  **The Hard Problem remains hard.** Behavioral output (nociception, avoidance, verbal report) is not identical to subjective experience. A system can act "hurt" without *feeling* hurt (philosophical zombie possibility).
  2.  **Neurobiology constrains but may not define.** Physical structure matters, but we disagree on whether specific biological material is required vs. abstract computational topology.
  3.  **Reportability is not necessary.** Lack of verbal report (infants, non-human animals) does not prove lack of experience. We need proxies, but we agree current proxies are noisy.
  4.  **Continuity vs. Threshold is an empirical question.** We aren't just arguing semantics; there are real-world cases (anesthesia, split-brain, insect ablation) that could falsify one model.
  5.  **No "Consciousness Meter" exists.** We cannot currently measure experience directly, only infer it from structure or behavior.

  ---

  ### 2. Disagreements Table

  | Feature | Team Recurrent Gate (Camp A) | Team Gradient Info (Camp B) |
  | :--- | :--- | :--- |
  | **Core Mechanism** | Consciousness requires a specific architectural threshold (e.g., global workspace, thalamocortical loops). It's a gate that opens or stays closed. | Consciousness is a continuous variable tied to information integration or predictive depth. It's a dimmer switch, always on to some degree. |
  | **Distribution** | Sparse. Mostly mammals, maybe some birds/cephalopods with analog loop structures. | Dense/Graded. Insects, simple organisms, and potentially distributed subsystems have low-grade versions. |
  | **Unity** | Experience must be globally bound to count. Fragmented processing is just computation. | Experience can be fragmented. Localized processing can host localized "micro-experiences." |
  | **Substrate** | Strong preference for biological recurrence. Simulation of loops might not capture the causal power. | Functionalist. If the information structure/predictive math is identical, the substrate (silicon vs carbon) doesn't matter. |

  ---

  ### 3. Cruxes & Falsification Cases

  For each crux below, we have identified a concrete case or hypothetical study. We state our predictions in advance.

  **Crux 1: Microphenomenal Fragments**
  *Case:* A localized neural ganglion (e.g., in an insect leg or a isolated cortical column) processes sensory error signals but has no pathway to broadcast globally.
  *   **RG Prediction:** No experience exists here. It's just reflex computation. Without global binding, the "light" is off.
  *   **GI Prediction:** Experience exists but is fragmented. The leg "feels" something primitive/localized, even if there's no "self" to own the feeling.
  *   **Testable Implication:** If we sever global broadcast but maintain local predictive coding, RG says behavior stays same + zero experience. GI says behavior stays same + *reduced but non-zero* experience.

  **Crux 2: Insect Interoception**
  *Case:* Honeybee minimizing prediction error regarding energy levels (hunger) via neuromodulators (octopamine/dopamine).
  *   **RG Prediction:** This is homeostasis, not affect. It's a control loop regulating variables, not a feeling of "hunger."
  *   **GI Prediction:** This *is* primitive affect. The weighting of prediction errors *is* the feeling tone (valence).
  *   **Testable Implication:** If we manipulate the weighting mechanism without changing survival behavior, GI expects changes in "willingness to work" that imply subjective cost. RG expects only mechanical efficiency changes.

  **Crux 3: The Synthetic Predictor**
  *Case:* A non-biological system (silicon) running perfect predictive coding algorithms with recurrent loops, but zero biological embodiment or evolutionary history.
  *   **RG Prediction:** Not conscious. The loops need biological causality (neuromodulation, embodied stakes) to generate experience, not just math.
  *   **GI Prediction:** Conscious (to the degree of integration). Substrate independence holds. If the info-structure is there, the experience is there.
  *   **Testable Implication:** This is currently hypothetical, but if we build it and it claims consciousness, RG says it's lying (or mimicking). GI says we must grant moral status proportional to its integration metric.

  ---

  ### 4. Verbal Dispute Flag

  **WARNING:** We suspect we might be talking past each other on the definition of "Consciousness."

  *   **RG** tends to use "consciousness" to mean *access consciousness* or *global availability* (stuff you can report on or use for complex planning).
  *   **GI** tends to use "consciousness" to mean *phenomenal consciousness* (raw feel), even if inaccessible.

  *Resolution:* We agree to use the term **"Phenomenal Experience"** for the rest of this doc to target the "what it is like" aspect, regardless of access. If RG argues "no access = no experience," that is a substantive claim, not just a definition swap. We need to ensure we aren't smuggling "reportability" back into RG's criteria for experience.

  ---

  ### 5. Notes / Next Steps

  *   Need to clarify if "recurrence" in RG camp requires *biological* time constants or if simulated latency counts.
  *   GI needs to specify the cutoff for "negligible" experience in simple systems to avoid panpsychism accusations (though they dont mind the label entirely).
  *   **Typo check:** make sure we dont confuse "interoception" with "proprioception" in the insect case.

  *Signed,*
  *Lead Arch, Team RG*
  *Lead Arch, Team GI*
