      *   *Key Missing Point:* The distinction between *ontological* personhood (what you are) and *sociological* personhood (how you function). Also, the specific nature of the "sister" tie—is unilateral recognition enough in Ubuntu? (Usually, Ubuntu requires reciprocity, *but* the ancestor link matters).
      *   *Better Missing Point:* They are arguing past each other on the definition of "Person." Amara means "Rights-bearer." Jonas means "Full Human Actualization." They need to agree on terms before debating the case. Also, they ignore the *potential* for reconnection (the sister).

  5.  **Refining Ratings and Confidence:**
