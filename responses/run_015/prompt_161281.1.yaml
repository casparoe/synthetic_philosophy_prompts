      *   *Move 1 (Amara):* Is it right? Ubuntu often emphasizes interdependence. Is paying taxes a "relation"? Maybe too thin. But the sister's recognition is key. The moral warning is good. *Verdict:* Mostly Right.
      *   *Move 2 (Jonas):* Is he right? Yes, strict relationalism requires actualization. If it's just capacity, it's Kantian. *Verdict:* Mostly Right.
      *   *Move 3 (Amara):* Is she right? Yes, otherwise the theory justifies apartheid. *Verdict:* Clearly Right.
