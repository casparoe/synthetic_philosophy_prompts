      *   Move 5 (Amara): Pragmatic fix. *Rating:* Mostly Right.
      *   Move 6 (Jonas): Accurate conclusion. *Rating:* Clearly Right.

      *Wait, if Jonas is always right, Amara looks bad.* Amara Move 3 is the strongest ethical move. Jonas Move 4 is the strongest logical move.
      *   Let's adjust Move 1. Amara's claim about "normative relations" is actually quite sophisticated (Menkiti vs. Gyekye debates). It's not *mistaken*, but it's contentious. I'll rate it "Mostly Right" because the sister argument holds weight.
      *   Let's adjust Move 6. Jonas calls it a "retreat." Is it? Or is it a clarification? Many philosophers (like Wiredu) make exactly this distinction. Calling it a retreat might be uncharitable. *Rating:* Mostly Right (diagnosis is accurate, characterization as "retreat" is debatable).

      *Least Sure:* Move 5 or 6. Move 5 is the pivot. Is it a valid distinction or a concession? I'm least sure about Move 6 because calling it a "retreat" implies the original goal was ontological exclusion, which Amara denies.

      *What are they missing?*
      1.  **The Metaphysical Ground:** Ubuntu isn't just social recognition; it's often about life-force/vitality which isn't lost by isolation.
