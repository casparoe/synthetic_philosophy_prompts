      *   *Move 5 (Amara):* Is she right? It solves the moral problem but changes the subject. *Verdict:* Mostly Right (strategically).
      *   *Move 6 (Jonas):* Is he right? Yes, that is exactly what the distinction does. *Verdict:* Clearly Right.

      *Wait, I need to differentiate.* If everyone is "Right," the adjudication is boring. I need to look for nuances.
      *   Move 1: Amara stretches "relation" to include abstract institutions. That's controversial in strict Ubuntu metaphysics. *Downgrade to:* Leaning Right / Mixed.
      *   Move 5: Amara's distinction is the standard solution, but does it save the *relational* view? Jonas says no. Amara says it saves the *moral* point. *Verdict:* Mostly Right (as a salvage operation).

      *Let's look for the "Missing" element.*
