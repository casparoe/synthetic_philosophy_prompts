          *   *Analysis:* Horwich and early deflationists assumed classical logic. If logic is non-classical, the T-schema instances might not be true (some are gappy). Does this undermine the claim that the schema "exhausts" the concept? If some instances fail to be true, is the concept still "minimal"? Field argues yes, but it requires a shift in what "assertion" means (acceptance vs. belief).
