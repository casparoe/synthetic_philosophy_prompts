      *   Option 3: Drop (a). Accept truth has a nature (grounding).
      *   *Decision:* The "cheapest" revision is usually to soften (e). Kripke himself accepts that the *semantics* is in the metalanguage. Insisting the *language* state its own semantic verdicts (e) is what drives the Revenge paradox. Softening (e) to allow metalanguage characterization of the gaps preserves (a), (b), (c), (d), and (f).
      *   *Wait, check (a):* If I keep (b) and (e), I *must* add a determinacy operator (Field). Does this break (a)? Field says no, it's still deflationary. But strict Horwich-style minimalism might say yes.
      *   *Better Revision:* Modify (e). Accept that while the *truth* predicate is transparent, the *semantic status* (gappiness) requires metalanguage or a distinct operator not governed by full transparency. This saves (b) and (a) mostly intact.
      *   *Actually, looking at (b):* "I favour a Kripke-style paracomplete treatment on the strong-Kleene scheme." Standard SK *cannot* satisfy (e). So (b) as stated is incompatible with (e). To satisfy (e), (b) must be upgraded to something like Field's paracomplete theory (which uses a conditional stronger than SK to allow validity preservation and a determinacy operator).
      *   *Cheapest:* Revise (e). Accept "semantic indecision" or metalanguage ascent for the *theory's* verdict, even if the *truth predicate* is transparent. This is the standard Kripkean move.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tension 1 (b vs e):* This is the Revenge Problem. SK cannot express its own gaps. If you say "Liar is not true," that sentence is True in SK. So you can't express "Liar is gappy" using just $\neg T$. You need $\neg T \land \neg T(\neg)$. But then "This sentence is not true and not false" creates a new paradox.
