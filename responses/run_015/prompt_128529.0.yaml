      *   *(f) Empirical Sensitivity + (b) Paracomplete:* Kripkean handles contingent Liars well (depends on the fixed point reached). *Tension Level: Low.*

  3.  **Deep Dive into the Critical Tensions:**

      *   **Tension 1: (b) Kripke/Strong Kleene vs. (e) Semantic Closure/No Metalanguage Ascent.**
          *   *Analysis:* In the standard Kripke construction (SK), the extension of the truth predicate is a fixed point. The set of sentences that are *not* in the extension (the gaps) cannot be defined *within* the language using that same truth predicate without triggering revenge. To say "The Liar is gappy," you need a predicate like "is ungrounded" or "is neither true nor false." If you define this as $\neg T(\ulcorner \phi \urcorner) \land \neg T(\ulcorner \neg \phi \urcorner)$, in SK, if $\phi$ is gappy, $\neg T(\ulcorner \phi \urcorner)$ is True (because gappy is not true). So the sentence "Liar is gappy" comes out True. But then consider $\lambda$: "This sentence is gappy." If it's true, it's gappy (contradiction). If it's gappy, it's true.
          *   *Resolution:* To satisfy (e), you usually need to move beyond simple SK to something like Field's paracomplete theory with a determinacy operator ($D$), or accept that the *semantics* (the fixed point construction) cannot be fully replicated *inside* the language using just $T$. Commitment (e) demands the theory state its own verdicts. Kripke's original theory *cannot* do this without metalanguage ascent (you need the metalanguage to say which sentences are in the fixed point).
