      *   *(b) Paracomplete + (d) Transparency:* In Strong Kleene (SK), intersubstitutability holds for extensional contexts. If $\phi$ is gappy, $T(\ulcorner \phi \urcorner)$ is gappy. They have the same value. So, substitutability holds. *Tension Level: Low.*
      *   *(b) Paracomplete + (e) Semantic Closure (Revenge):* This is the big one. Kripke's fixed-point construction is *not* semantically closed in the strong sense. You cannot express "is ungrounded" or "is gappy" within the object language using the standard truth predicate without generating a Strengthened Liar. If you say "Liar is not true," in SK, if Liar is gappy, "Liar is not true" comes out *true* (since gappy $\neq$ true). But then you can construct a new Liar based on "not true". To block this, you need a determinacy operator or a rejection of the inference rules. Kripke's original construction forces metalanguage ascent to describe the fixed point (e.g., to say the Liar is undefined). Commitment (e) explicitly rejects metalanguage ascent. *Tension Level: High/Severe.*
      *   *(c) Classical Recapture + (b) Paracomplete:* Kripke/SK allows classical recapture for grounded sentences. This is a standard feature of Kripkean theories. *Tension Level: Low.*
