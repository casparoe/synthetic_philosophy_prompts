          *   *Cost:* You have to explain why logical laws (like Excluded Middle) aren't truths about truth, but merely useful rules.

      *   **Tension 3: (d) Transparency vs. (e) Semantic Closure.**
          *   *Analysis:* If $T(\ulcorner \phi \urcorner)$ and $\phi$ are fully intersubstitutable, then any paradox arising from $\phi$ arises from $T(\ulcorner \phi \urcorner)$. If you want to say "Liar is gappy," and you use $T$, you run into the Revenge problem. If transparency is absolute, you can't distinguish $\phi$ from $T(\ulcorner \phi \urcorner)$ even in the semantic analysis.
          *   *Severity:* **Moderate/High.** Tied to Tension 1.
          *   *Cost:* Restricting transparency to "grounded" sentences or adding operators that break transparency (like $D$).

