      *   Ensure the "GM/Raid Leader" experience comes through (knowing how guilds feel, timezones, burn mechanics).

  5.  **Word Count Check:**
      *   Need to expand on the arguments to hit 1000-1400. Ensure the back-and-forth is dense.
      *   Make sure the "Bug Test" and "Price Question" get explicit airtime.
      *   Make sure the "Indifference Test" and "Echo Case" get explicit airtime.

  6.  **Self-Correction during drafting:**
      *   *Check:* Did I include the brainstorming section at the start? Yes, the prompt asks for it *before* writing the dialogue.
      *   *Check:* Did I avoid name-dropping? Yes.
      *   *Check:* Did they change their minds? Need to make sure this is explicit.
      *   *Check:* Did they cover the Lantern specifically? It's easy to lump it with the cathedral. Need to separate them.
      *   *Check:* Joint recommendation needs to be concrete.

  7.  **Final Polish:**
      *   Check tone. Is it too academic? Soften edges. Is it too gamer-y? Sharpen the ethics.
      *   Ensure the "Echo" argument lands. Mira says Echo makes it worse. Dev needs to probe why.
      *   Ensure the "Bug Test" lands. Dev asks: If a bug wiped it, would you restore? Mira needs to distinguish agent-caused vs. nature-caused loss.

