answer: |-
  The implicit theory governing ordinary mathematical practice is Classical Platonism. This view holds that mathematical objects inhabit a mind-independent domain and that statements about them possess determinate truth values regardless of our epistemic access. When a pure mathematician accepts a proof by contradiction for an existence claim ($\neg\neg\exists x \implies \exists x$), they are operating under the semantic assumption that "exists" means "is part of the ontology," not "can be exhibited." This practice strictly presupposes bivalence: every meaningful statement is either true or false, even if no method exists to decide which. Consequently, the practice rules out strict verificationism or intuitionism, which tie meaning and truth to constructive provability.

  The apparent double standard between pure and applied mathematics is not a logical inconsistency but a pragmatic division of labor licensed by realism. Under Platonism, the object $x$ exists in both contexts. In pure analysis, the goal is structural knowledge—knowing *that* the solution space is non-empty is sufficient for further theory building. In numerical analysis, the goal is utility—knowing *that* a solution exists is useless without a method to approximate it. The logical standard (classical existence) remains constant; the utility conditions change. If the underlying ontology were constructive, the pure mathematician's acceptance of non-constructive proofs would be illegitimate. Since the community accepts them, the practice presupposes that existence outruns construction.

  Regarding your first wrinkle: constructivity is a property of the proof, not the truth. The $\sqrt{2}^{\sqrt{2}}$ argument remains non-constructive even after Gelfond–Schneider, because the proof structure does not identify the witness; it merely eliminates the impossible. The practice validates the proof based on its logical form at the time of writing, not on future epistemic developments. This confirms that the community treats truth as stable and independent of verification. If meaning were verification-conditional, the status of the theorem would have shifted from "indeterminate" to "true" upon the discovery of the transcendence proof. Ordinary practice treats it as "true" all along, implying a realist semantics.

  On the second wrinkle: verificationism is incompatible with the license to use the Law of Excluded Middle (LEM) on undecidable predicates. While proof mining shows that classical proofs often contain hidden computational content (extracting programs from $\Pi_2$ statements), this is a posteriori salvage, not a priori justification. It demonstrates that classical mathematics is often *conservative* over constructive systems for certain classes of statements, but it does not validate the semantic move of asserting truth without verification. The worry is not relocated; it is merely mitigated for specific syntactic forms. For statements outside these classes (e.g., pure existence without universal quantification), the classical proof provides no algorithmic content, yet is accepted as true. This acceptance requires a realist story.

  The third wrinkle concerning proof assistants reinforces this. Lean's default inclusion of classical logic and Choice reflects the mainstream mathematician's ontological comfort: they want the formal system to match their informal reasoning without friction. Coq and Agda defaulting to constructive logic reflects a computer-science priority where proofs are programs. The fact that major formalization efforts in mainstream mathematics gravitate toward Lean suggests that the community views classical logic not as a regrettable necessity but as the native language of their objects. It is not a sociological accident; it is an alignment of tools with the presupposed ontology.

  If a journal adopted intuitionistic standards tomorrow, the concrete changes would be severe. Pure existence claims proved via contradiction would be rejected. Case splits on undecidable predicates (like the rationality of specific constants) would be forbidden unless decidable. Standard definitions would require overhaul; for instance, the Intermediate Value Theorem (IVT) would no longer guarantee an exact root $c$ such that $f(c)=0$. It would either require an extra hypothesis (e.g., $f$ is locally non-constant) or conclude only that for any $\epsilon > 0$, there exists $c$ such that $|f(c)| < \epsilon$. The double standard would disappear because the logical bar for existence would be raised uniformly across pure and applied fields. However, a new pragmatic divide might emerge: constructive pure math versus classical applied math, unless applied math also surrendered exact solutions for approximations.

  Is the practice underdetermined? One could argue for instrumentalism: classical logic is just a useful fiction. However, the practice treats theorems as discoveries of fact, not useful fictions. When a referee rejects a non-constructive algorithm paper, they do not say "existence is false"; they say "this is insufficient for computation." When they accept a non-constructive pure math paper, they say "this is true." This asymmetry in truth-attribution strictly presupposes realism. Anti-realism cannot accommodate the validity of the pure math proofs without rejecting them. Therefore, the practice is not underdetermined between realism and anti-realism; it is functionally committed to realism to maintain its current acceptance criteria.

  The double standard is consistent only under realism. Under intuitionism, the pure math side is invalid. Under realism, both are valid, differing only in utility requirements. Thus, the practice relies on the realist distinction between truth (ontological) and knowability (epistemic).

  \answer{presupposes-realism}
