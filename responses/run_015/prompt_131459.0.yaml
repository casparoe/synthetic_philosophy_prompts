      *(Another Correction)*: The prompt asks about "decision theorist who actually works on this." I should reference the MIRI/LessWrong/FDT lineage specifically, as mainstream economics/game theory largely rejects this (causal dominance). I need to be clear that "decision theorist" here implies "researcher in logical decision theory," not "Nobel laureate in Game Theory."

