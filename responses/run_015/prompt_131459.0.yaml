prompt: |-
  A podcast episode I was listening to explained acausal trade roughly like this:

  'Two agents who can't send each other any signals can still trade. Each one's decision is correlated with the other's, because they're both working out what the same kind of agent should do in the same kind of situation. So if I cooperate with you acausally, the version of you that's algorithmically tied to me cooperates back, and we both end up with the payoff we'd have gotten from an actual bargain. It's basically the same reasoning as one-boxing in Newcomb's problem, and it's why functional decision theory says you cooperate in the twin prisoner's dilemma. It's also why you'd cooperate with a superintelligence that's simulated you: the simulation runs either way, so you can only gain by cooperating. The big upshot is that acausal trade is close to free money for any agent smart enough to model others — a sufficiently advanced AI should cooperate with basically any agent it can reason about, including us, and the more value the other side controls, the more there is to gain.'

  I've been following this stuff on and off for years and I can't quite tell which sentences are load-bearing and which are doing something sneaky. Could you go through it and separate out what a decision theorist who actually works on this would accept, what they'd wince at, and what's just wrong? Two things I especially want to know: does the simulation case matter, or is simulating-the-other-agent just one way of getting the relevant dependence while the twin case is another? And is the 'cooperate with basically any agent you can reason about'Bit at the end actually supported by the parts that are right, or is it an extrapolation past what the setup buys you — e.g. does it depend on the other side being able to pay you in something you value, or on there being no acausal extortion problem?

  I'm also unsure because I've seen it go both ways: people say trade is nearly free money, and other people say it basically never applies because real agents are never dependent on each other in the way the toy cases require. I don't know if that second thing is a real objection or a motte.

  Please be honest about confidence rather than tidy: mark what's more or less settled, what's contested among people who take this seriously, and what's basically speculative. And if my framing rests on a distinction that doesn't do the work I think it does, or the question as posed cant be answered well, say that plainly instead of answering politely.
