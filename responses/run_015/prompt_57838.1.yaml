answer: |-
  Here is a 6-question diagnostic quiz designed to move students away from memorizing definitions and toward revealing their underlying intuitions about what makes a species a species.

  Each question presents a messy biological case. The answer choices represent the *reasoning* a student would use to solve the case, which maps to a specific species concept.

  ### **The "What's in a Species?" Intuition Quiz**

  **Instructions:** For each scenario, choose the response that best matches your gut feeling about how we should classify the organisms. Don't overthink it—pick the reasoning that sounds most "correct" to you.

  **1. The Ring (Ensatina Salamanders)**
  A population of salamanders forms a ring around a valley. Population A breeds with B, B with C, and C with D. However, if Population A meets Population D, they refuse to mate and produce no offspring. They are connected by gene flow, but the ends are reproductively isolated.
  *   **A.** They are **one species**. The gene flow connects the whole chain; cutting it anywhere is arbitrary.
  *   **B.** They are **two species** (A and D). The ability to interbreed is the definition of species, and A and D cannot.
  *   **C.** They are **multiple species** based on where the physical traits change most drastically along the ring.
  *   **D.** The question has **no true answer**. Nature is continuous; "species" is just a label we slap on a vague continuum.

  **2. The Asexual Dandelions**
  You are studying a field of dandelions that reproduce entirely by cloning (no sex). Each plant is slightly different genetically due to mutation, but they all look mostly the same.
  *   **A.** They are **one species**. They occupy the same ecological niche and look the same.
  *   **B.** They are **many species**. Every distinct lineage/clade is its own evolutionary unit, regardless of sex.
  *   **C.** The Biological Species Concept **doesn't apply here**. We need a different definition for asexual organisms.
  *   **D.** Calling them distinct species is **pointless**. Without sexual isolation, drawing lines between clones is just human invention.

  **3. The Hybridizing Cichlids**
  Two types of cichlid fish in a lake look very different and eat different food. However, scientists discover they occasionally mate in the wild and produce fully fertile offspring that can also breed.
  *   **A.** They are **one species**. If they can exchange genes and produce fertile offspring, the barrier isn't real.
  *   **B.** They are **two species**. They maintain distinct traits and niches despite the occasional hybridization.
  *   **C.** They are **two species**. They represent distinct evolutionary lineages with different ancestors.
  *   **D.** It **depends on the scientist**. There is no fact of the matter until we decide what we need the classification for.

  **4. The Gradual Fossil Series**
  You have a fossil record of a snail shell spanning 5 million years. The shape changes slowly and smoothly from Type A (oldest) to Type B (newest). There is no sudden jump.
  *   **A.** Type A and Type B are **different species**. They are distinct morphological forms separated by time.
  *   **B.** They are the **same lineage**, but calling them different species is useful for dating rock layers.
  *   **C.** We cannot apply the Biological Species Concept here (no mating tests), so we must rely on **physical differences**.
  *   **D.** Drawing a line between A and B is **arbitrary**. It's one continuous population evolving over time.

  **5. The Cryptic Mosquitoes**
  Two populations of mosquitoes look identical to the human eye. However, genetic testing shows they haven't exchanged genes in a million years, and one carries a disease while the other does not.
  *   **A.** They are **one species**. If they look the same, they are the same. Morphology is what matters for identification.
  *   **B.** They are **two species**. Their evolutionary history (lineage) is separate, even if they look alike.
  *   **C.** They are **two species**. Reproductive isolation is the key, even if we have to use genetics to detect it.
  *   **D.** We should treat them as **two units for public health**, but biologically, the line is fuzzy.

  **6. The Meta-Question (Ontology)**
  Imagine we discover a planet where life evolves continuously without clear breaks. Would "species" exist there?
  *   **A.** **Yes.** Species are natural kinds that exist independently of human observers.
  *   **B.** **No.** Species are tools/concepts humans create to make sense of biodiversity.
  *   **C.** **Yes, but...** they are historical individuals (lineages) rather than abstract types.
  *   **D.** **Maybe.** It depends on whether reproduction is involved.

  ***

  ### **TA Scoring Key & Interpretation**

  Have students tally which letter they chose most often. While students rarely fit perfectly into one box, the dominant pattern reveals their philosophical commitment.

  | If they chose mostly... | They lean toward... | Core Intuition |
  | :--- | :--- | :--- |
  | **B** (in Q1, Q3, Q5) & **C** (in Q2) | **Biological Species Concept (BSC)** | Species are defined by **reproductive isolation**. If genes can flow, it's one species. If not, it's two. |
  | **B** (in Q2, Q5) & **C** (in Q3) | **Phylogenetic Species Concept (PSC)** | Species are the smallest distinct **lineages/clades**. History and ancestry matter more than current mating. |
  | **A** (in Q1, Q4) & **A** (in Q5) | **Morphological / Ecological** | Species are defined by **traits or niches**. If it looks the same or does the same job, it's the same species. |
  | **D** (in Q1, Q2, Q4, Q6) | **Deflationary / Nominalist** | Species are **human conveniences**. Nature is continuous; "species" are not real natural kinds. |

  #### **Specific Question Breakdown for Discussion**

  *   **Q1 (Ring Species):** Tests the limits of Reproductive Isolation.
      *   *B* = Strict BSC.
      *   *A/D* = Recognition that BSC fails on continua (leads to PSC or Nominalism).
  *   **Q2 (Asexuals):** Tests the universality of BSC.
      *   *C* = Acknowledges BSC limitation (common intro bio answer).
      *   *B* = PSC (lineage is all that matters).
      *   *D* = Nominalist (lines are fake).
  *   **Q3 (Hybrids):** Tests "leakiness" of barriers.
      *   *A* = Strict BSC (gene flow = one species).
      *   *B* = Ecological/Phenetic (distinct traits/niches = two species).
      *   *C* = PSC (distinct lineages).
  *   **Q4 (Fossils):** Tests time and BSC applicability.
      *   *C* = Morphological (pragmatic).
      *   *D* = Nominalist (arbitrary slicing).
  *   **Q5 (Cryptic):** Tests Morphology vs. History/Isolation.
      *   *A* = Morphological.
      *   *B/C* = PSC or BSC (Genetics reveals the "real" boundary).
  *   **Q6 (Ontology):** Tests Realism vs. Instrumentalism.
      *   *A/C* = Realist (Species are out there).
      *   *B* = Nominalist/Instrumentalist (Species are in here).

  ***

  ### **Limitations & "Blind Spots" of this Quiz**
  *(Share this with your students to show philosophical nuance)*

  1.  **BSC vs. PSC Overlap:** On sexual organisms (like the Cichlids), BSC and PSC often give the same answer. This quiz forces a choice in Q3, but in reality, many biologists hold a hybrid view.
  2.  **Morphological vs. Ecological:** I have grouped these for simplicity. However, a student might care about *what the organism eats* (Ecological) but not *what it looks like* (Morphological). This quiz doesn't fully disentangle those two.
  3.  **The "Lineage" Ambiguity:** Both PSC and some versions of BSC view species as lineages. A student choosing "Lineage" answers might be a PSC proponent or a "Evolutionary Species Concept" proponent. The quiz treats them similarly.
  4.  **Nominalism vs. Pragmatism:** Choosing "It depends on the scientist" (Q3-D) could mean they are a Deflationary Nominalist (no truth exists) OR a Pragmatic Realist (truth exists, but is hard to access). The quiz conflates these slightly for the sake of length.

  ### **TA Tip for Section**
  Don't just grade this. Use the results to group students!
  *   **Group 1 (The Isolators):** Mostly B answers. Ask them: *"How do you handle the dandelions?"*
  *   **Group 2 (The Splitters):** Mostly PSC answers. Ask them: *"When does a lineage become distinct enough to be a species?"*
  *   **Group 3 (The Skeptics):** Mostly D answers. Ask them: *"If species aren't real, why do conservation laws protect them?"*

  This forces them to defend their intuition against the cases where their intuition breaks down.
