answer: |-
  To serve as a statutory basis, a theory of personal identity must function less as a description of metaphysical truth and more as an algorithm for adjudication, meaning its primary requirement is operational determinacy. The law requires binary outcomes for liability, ownership, and status, so the theory must return a yes-or-no verdict on whether the post-procedure entity is the pre-procedure person, even if the underlying reality is gradual. This demand for determinacy is not a metaphysical claim but a functional necessity for registrars and judges who cannot rule on probabilities of existence. Consequently, the theory must resolve the cold swap case by prioritizing causal history over behavioral output. If a prosthetic unit runs on a recording rather than live input, it mimics the person without being causally integrated into the ongoing stream of consciousness. A usable theory must therefore require that identity tracks the actual causal chain of mental states, not merely the resemblance of those states, because a statute that equates perfect mimicry with identity would allow fraudsters to replace subjects with pre-programmed automata without legal consequence. This same causal requirement dictates how the theory handles the rate of replacement. Whether the procedure takes twenty years or a single afternoon should not alter the verdict if the causal chain remains unbroken, but if the theory posits that identity relies on biological homeostasis, the rate becomes critical because biological systems cannot sustain continuity under instantaneous shock. The theory must explicitly state whether it grounds identity in psychological continuity or biological persistence, because if it remains silent on whether speed matters, clinicians will face liability for outcomes that the statute implies are identical.

  The theory must also satisfy the requirement of uniqueness, often called the no-branching rule, which is tested by the dormant duplicate and re-implantation cases. If a complete prosthetic version is built and kept inert, its mere existence cannot determine the identity of the active subject, or else a person's legal status would fluctuate based on events in a locked room they know nothing about. However, if the removed tissue is re-implanted to create a second candidate, the theory must provide a tie-breaking mechanism. It cannot allow two simultaneous claimants to the same legal identity, as this would collapse the distinction between marriage and bigamy or between debt and shared liability. This leads to the thinning case, where one unit becomes two. Here the theory must decide if identity is divisible. If the statute treats the person as a single legal unit, the theory cannot allow one biological process to spawn two rights-holders without a rule for succession, otherwise property law becomes unenforceable. These cases collectively demand that the theory treat identity as a one-to-one relation that is intrinsic to the candidate, meaning it cannot depend on the existence of distant competitors, yet it must also be able to adjudicate competition when it physically arises. This tension is sharpest in the directive case where a subject instructs the team to halt if capacity falls, then revokes that instruction mid-procedure. A usable theory must specify which temporal stage holds the authority to bind the future entity. If the theory holds that identity is continuous, the pre-procedure self binds the post-procedure self, and the halt order stands. If the theory allows that identity shifts or degrades, the mid-procedure self may be a new agent with the right to revoke. The theory cannot simply defer to the current will, because if the current will belongs to a distinct entity, honoring it violates the pre-commitment of the original person. Therefore, the theory must define the threshold of authority, specifying whether the right to decide survives the replacement or transfers with the biological substrate.

  Regarding institutional questions, the theory must address whether legal personhood is a bundle that can be split or a switch that is either on or off. The statute needs to know if the post-procedure candidate owns the house but is not married, or answers for debts but is not a victim of homicide. While metaphysics might allow for partial identity, the law generally requires consistency to prevent absurdities where a person is dead for inheritance but alive for criminal liability. Thus, a strong desideratum is that the theory yields a unified verdict across all legal domains. However, this requirement conflicts with the reality of the procedure, where cognitive faculties may degrade unevenly. A theory that insists on all-or-nothing status risks injustice if the subject retains memory but loses emotional connectivity, yet a theory that allows split status creates administrative chaos. This brings us to the distinction between genuine desiderata and philosophical prejudices. The demand for a determinate yes-or-no answer is genuine, derived from the nature of legal judgment rather than metaphysics. The demand that the theory invoke no further fact beyond the physical and functional ones is also genuine, as secular law cannot adjudicate souls or non-natural substances. However, the demand that the theory vindicate the first-personal conviction of the subject is a prejudice. A subject may feel they survive when they do not, or vice versa, and the law must protect the subject from their own metaphysical errors, particularly in cases of cognitive decline. Similarly, the demand that the theory treat biological and prosthetic tissue on a par is a policy choice, not a metaphysical necessity. A biological theory would treat them differently by definition, and unless the statute mandates parity, the theory need not provide it.

  There is, however, a pair of genuine requirements that cannot be jointly satisfied. The first is the requirement that no single swap be pivotal, which follows from the gradualness of the procedure and the intuition that removing one neuron does not kill a person. The second is the requirement that the verdict track something that could be lost by degrees, such as memory or agency, while still producing a binary legal outcome. If identity is binary, then there must be a specific swap that turns the person from existing to non-existing, even if that swap is indiscernible. If identity is a matter of degree, then the law cannot apply the binary rules of homicide or marriage without arbitrary cutoffs. This pair is not satisfiable without stipulation. The statute must impose an arbitrary threshold to resolve the Sorites paradox, acknowledging that while no single swap is metaphysically pivotal, the law must designate a point where the cumulative change triggers a legal transition. This means the theory must be able to accommodate a conventional cutoff that overrides the metaphysical vagueness.

  The single requirement that does the most work in excluding existing theories is the demand that identity must not depend on extrinsic facts, specifically the existence of a causally inert duplicate. This requirement excludes pure Psychological Continuity theories that do not incorporate a non-branching clause. In a pure psychological view, if the duplicate is inert, it does not break the continuity of the active subject, but if the duplicate were active, it would. This makes identity dependent on what is happening elsewhere in the universe, which is legally untenable. A theory that makes legal status contingent on the state of a dormant machine in another room is unusable. Therefore, the theory must be either Biological, grounding identity in the specific physical organism regardless of duplicates, or it must be a Psychological theory with a rigid intrinsic constraint that ignores branching possibilities, which is metaphysically unstable. The requirement for intrinsicness forces the theory to anchor identity in the local physical history of the candidate.

  If forced to abandon a requirement, I would first abandon the demand that legal status must be all-or-nothing across all institutional domains. I would do this if presented with a case of severe asymmetric degradation, such as a subject who retains full semantic memory and logical reasoning but has completely lost emotional recognition and autobiographical connection. In such a case, treating the subject as fully married while acknowledging they are psychologically a stranger to their spouse creates a moral absurdity that the law should avoid. If the procedure results in an entity that is functionally two people in one body due to the thinning of units, or one person who is half-gone, the statute should allow for partial guardianship or suspended marital status rather than forcing a binary verdict that contradicts the lived reality of the family. This abandonment would be triggered by a re-implantation case where the biological original is restored but retains no memory of the period during which the prosthetic ran. In that scenario, insisting that the restored biological person is liable for the debts incurred by the prosthetic run would be unjust, suggesting that legal identity must sometimes track psychological continuity even when biological identity is restored, thereby fracturing the institutional bundle.
