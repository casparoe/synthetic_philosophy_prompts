      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm advocating for a theory, but defining the *requirements* for one. I need to ensure the "Directive" case is highlighted as requested. I need to make sure the "Conflict" section clearly identifies the pair of requirements. I need to ensure the "Exclusion" identifies a specific theory type. I need to ensure the "Sacrifice" identifies a specific requirement and a triggering case.

      *Refining the "Conflict":* The prompt suggests "no single swap pivotal" vs "verdict track something lost by degrees." I should address this specifically. If identity is binary, one swap *is* pivotal, even if indiscernible. If identity is degrees, the law breaks. The requirement is "Bivalence" (Yes/No) vs "Sorites Safety" (No sharp cutoff). These are incompatible.

