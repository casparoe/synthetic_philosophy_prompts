      *   *Desiderata vs. Prejudices:* Analyze the common demands (Determinacy, Physicalism, First-Person Authority, Parity).
      *   *The Conflict:* Sorites paradox vs. Degrees of loss.
      *   *The Exclusionary Requirement:* Which one kills the most theories?
      *   *The Sacrifice:* Which requirement is weakest?

  4.  **Drafting - Content Generation & Refinement (incorporating constraints):**

      *   *Opening:* Start by clarifying the objective. The theory isn't for truth, it's for governance.
      *   *Case Requirements:*
