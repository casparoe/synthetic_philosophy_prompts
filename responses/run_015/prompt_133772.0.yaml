          *   *Rate:* 20 years vs. afternoon. Does speed matter? If identity is psychological continuity, speed shouldn't matter. If it's biological process, maybe it does. The theory must specify *why* rate matters or explicitly rule it out. It can't be arbitrary.
          *   *Dormant Duplicate:* The "Branching Problem." If a copy exists but isn't used, does it break identity? The theory must handle the "no branching" rule. If the duplicate exists, is the original still the original?
          *   *Re-implantation:* Two candidates. The theory must provide a tie-breaker or admit ambiguity. Law hates ambiguity. It needs a rule for "best candidate."
          *   *Thinning:* 1 to 2 units. This tests numerical identity. Does the person become two? Or does one unit inherit identity?
          *   *Institutional Bundle:* Can you be married but not own property? The theory needs to say if identity is a switch (all-or-nothing) or a dimmer (partial). Law usually prefers a switch.
      *   *The Directive Case:* Pre-commitment vs. Current Will. If identity changes, does the "old" self's directive bind the "new" self? The theory must account for the authority of the pre-procedure self over the post-procedure entity.
      *   *Desiderata Analysis:*
          *   *Determinacy:* Law needs Yes/No. Metaphysics might allow "sort of." This is a genuine requirement for *law*, even if metaphysically suspect.
