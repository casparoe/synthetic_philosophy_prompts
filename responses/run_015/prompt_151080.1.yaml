answer: |-
  **MEMORANDUM**

  **TO:** Oversight Board, National Museum
  **FROM:** Senior Curator of Origin Narratives
  **SUBJECT:** Decision Procedure 001-A: Classification of Origin Narratives
  **DATE:** October 26, 2023

  ### I. PURPOSE AND SCOPE
  This document establishes the mandatory decision procedure for classifying gallery narrative proposals into one of three funding bins. This procedure is designed to be executed by a trained curator within a two-hour window without external specialist consultation. It prioritizes **evidential independence** over narrative coherence and measures **legendary accretion velocity** to distinguish historical memory from mythic construction.

  **The Three Bins:**
  1.  **Bin A:** Historical Account with Legendary Overlay (Core event/person verified; details embellished).
  2.  **Bin B:** Legend with a Recoverable Historical Kernel (Narrative is mythic; specific trigger/person is plausible but not verified).
  3.  **Bin C:** Legend without Recoverable History (Narrative serves identity function; no specific correlate exists).

  ---

  ### II. THE DECISION PROCEDURE (FLOWCHART IN WORDS)

  **PRE-CONDITION:** The Curator must have the proposal text and access to the Museum's *Standard Chronological & Epigraphic Reference Set* (SCERS). No external web searches are permitted.

  #### STEP 1: THE INDEPENDENCE TEST (Time Limit: 30 Minutes)
  **Action:** Identify the earliest layer of the narrative (Layer 1). Search SCERS for any material or textual reference to the specific *event* or *person* named in Layer 1 that **does not** derive from the narrative tradition itself.
  *   *Definition of Independence:* A record created for administrative, diplomatic, or incidental purposes (e.g., tax ledger, battle monument, foreign correspondence) that mentions the subject without retelling the story.
  *   *Definition of Dependence:* A chronicle, poem, or saga that retells the story, even if it claims to be "history."

  **Decision Node:**
  *   **IF** independent contemporary (within 50 years) or near-contemporary (within 100 years) evidence exists: **PROCEED TO STEP 2.**
  *   **IF** evidence is only from the narrative tradition itself (or derivatives): **PROCEED TO STEP 3.**
  *   **IF** evidence is contradictory or explicitly denies the event: **CLASSIFY AS BIN C.** (Stop).

  #### STEP 2: THE ACCRETION VELOCITY CHECK (Time Limit: 30 Minutes)
  **Action:** Calculate the "Supernatural Gap." Measure the time between the alleged event (Date E) and the first appearance of supernatural, heroic, or anachronistic motifs (Date M).
  *   *Formula:* (Date M – Date E) / Generation Length (25 years).
  *   *Threshold:* If the gap is **less than 2 generations**, the narrative is high-velocity accretion. If **more than 4 generations**, it is low-velocity.

  **Decision Node:**
  *   **IF** Independent Evidence exists (from Step 1) **AND** Accretion Velocity is Low (>4 generations): **CLASSIFY AS BIN A.** (History + Overlay).
  *   **IF** Independent Evidence exists (from Step 1) **AND** Accretion Velocity is High (<2 generations): **PROCEED TO STEP 4.** (Judgment Call Required).

  #### STEP 3: THE KERNEL PROBABILITY ASSESSMENT (Time Limit: 45 Minutes)
  **Action:** Since independent evidence is missing, look for a "Specific Anchor." Does the narrative contain a specific geographic, genealogical, or political detail that is *verifiable* as real, even if the story is not?
  *   *Test:* Can you point to a place, title, or lineage that existed at the time, which the narrative *requires* to be true, even if the main character is unverified?
  *   *Negative Control:* If the geography is mythic (e.g., "Isle of Avalon") or the politics are anachronistic (e.g., "King" in a tribal society), fail the test.

  **Decision Node:**
  *   **IF** Specific Anchor is verified in SCERS **AND** Anchor is central to the plot: **CLASSIFY AS BIN B.** (Legend + Kernel).
  *   **IF** Specific Anchor is missing, vague, or demonstrably false: **CLASSIFY AS BIN C.** (Legend - History).

  #### STEP 4: THE JUDGMENT FLAG (Human Override Point)
  **Action:** This step applies only if Step 2 resulted in "High Velocity" despite "Independent Evidence."
  *   *Instruction:* The Curator must write a 100-word justification determining if the supernatural elements are *metaphorical decorations* (Bin A) or *constitutive of the event's memory* (Bin B).
  *   *Constraint:* If the supernatural elements explain *why* the event happened (e.g., "Gods caused the flood") rather than *what* happened ("There was a flood"), default to **BIN B**.

  #### STEP 5: FINAL SIGN-OFF
  **Action:** Sign the classification. Attach the "Independence Worksheet" showing the specific SCERS entry used.
  *   *Warning:* If the classification is Bin C, a "Cultural Impact Statement" must be attached, acknowledging the narrative's value despite the lack of historical kernel.

  ---

  ### III. APPLICATION TO PROPOSED GALLERIES

  #### CASE 1: The Trojan War (Proposal: Historical Conflict at Hisarlık with Epic Overlay)
  *   **Step 1 (Independence):** SCERS contains Hittite diplomatic correspondence (Tawagalawa Letter, Milawata Letter) referencing *Wilusa* (Troy) and *Ahhiyawa* (Greeks) in conflict. These are administrative/diplomatic, not narrative. **PASS.**
  *   **Step 2 (Accretion):** Event dated ~1200 BCE. Homer's *Iliad* (first written layer with gods/heroes) ~750 BCE. Gap = 450 years (~18 generations). Velocity is **Low**.
  *   **Step 3:** N/A (Passed Step 1).
  *   **Procedure Output:** **BIN A (Historical Account with Legendary Overlay).**
  *   **Curator Note:** The conflict is historically attested independently. The gods and single combat are later poetic overlays.
  *   **Status:** **APPROVED.**

  #### CASE 2: King Arthur (Proposal: Post-Roman Military Leader Behind the Romances)
  *   **Step 1 (Independence):** SCERS search for 5th/6th Century Britain. No contemporary inscriptions, coins, or letters mention "Arthur." *Annales Cambriae* (10th C.) and *Historia Brittonum* (9th C.) are narrative chronicles, not independent administrative records. **FAIL.**
  *   **Step 3 (Kernel):** Proposal cites "Battle of Badon." *De Excidio et Conquestu Britanniae* (Gildas, 6th C.) mentions Badon but **does not name Arthur**. The link between the person and the battle exists only in later narrative tradition.
  *   **Procedure Output:** **BIN C (Legend without Recoverable History).**
  *   **Curator Note:** While a leader likely existed, the specific identification of "Arthur" lacks evidential independence. The "Kernel" is a battle, not the person.
  *   **Status:** **FLAGGED FOR BOARD REVIEW.** (See Section IV).

  #### CASE 3: The Exodus (Proposal: National-Origin Legend with No Recoverable Kernel)
  *   **Step 1 (Independence):** SCERS search for 13th Century BCE Egypt. No records of mass slave departure, plagues, or loss of chariot corps. Egyptian records claim total control of Canaan during this period. **FAIL.**
  *   **Step 3 (Kernel):** Proposal suggests a "small group" origin. However, no archaeological trace of a distinct migrant group entering Canaan in this period matches the narrative specifics (40 years, specific route). Geography includes mythic elements (parting sea).
  *   **Procedure Output:** **BIN C (Legend without Recoverable History).**
  *   **Curator Note:** Matches proposal framing. Narrative functions as identity formation, not historical record.
  *   **Status:** **APPROVED.**

  ---

  ### IV. THE REJECTION CASE: KING ARTHUR (BIN C)

  **The Conflict:**
  I anticipate the Board will reject the **Bin C** classification for the King Arthur gallery. The Proposal requested **Bin B** (Legend with Kernel), which allows for a "Based on a True Story" marketing approach. The Procedure's strict requirement for *evidential independence* (Step 1) forces Arthur into Bin C because the only sources linking the name "Arthur" to the Battle of Badon are narrative chronicles written 300+ years after the fact.

  **Why the Board Will Reject It:**
  1.  **National Identity:** Arthur functions as a founding father figure. Bin C suggests the gallery is displaying fiction, which undermines the "National Museum" mandate to preserve heritage.
  2.  **Funding Implications:** Bin A and Bin B galleries attract different donor tiers than Bin C. "Myth" is often perceived as "less valuable" by legacy donors than "History."
  3.  **Procedural Rigidity:** The Board will argue that Gildas' mention of Badon *plus* the later tradition constitutes a "recoverable kernel." The Procedure explicitly rejects this as *narrative dependence*, but the Board may view this epistemic distinction as overly academic.

  **My Recommendation:**
  Uphold the Procedure. If we classify Arthur as Bin B, we validate a methodology that would also require us to classify Robin Hood or William Tell as Bin B, diluting the standard for the entire museum. However, I will attach the "Cultural Impact Statement" to mitigate the political friction.

  ---

  ### V. LIMITATIONS AND OVERRIDE PROTOCOL

  **Where This Procedure Misfires:**
  1.  **Oral Cultures:** The procedure privileges textual/epigraphic independence. For cultures with strong oral traditions but no contemporary writing (e.g., pre-contact Indigenous narratives), this procedure will systematically default to **Bin C**. This is an epistemic bias, not a historical truth.
  2.  **Symbolic Truth:** The procedure measures factual correspondence, not psychological or sociological reality. A Bin C classification does not mean the story is "false" in its effect on the nation, only that it is not factual.
  3.  **Recent History:** For events within living memory (e.g., Revolution, Civil War), "Accretion Velocity" is hard to measure because propaganda and history are produced simultaneously.

  **When to Override:**
  A Senior Curator may override the Procedure **only** under the following conditions:
  1.  **New Evidence:** A SCERS update has occurred in the last 6 months not reflected in the reference set.
  2.  **Categorical Error:** The narrative is clearly religious liturgy rather than historical claim (move to Religious Studies department, do not classify).
  3.  **Board Directive:** Written instruction from the Board to reclassify a specific case for strategic reasons. (This must be logged in the "Override Register" and counts against the Board's annual transparency quota).

  **Final Instruction:**
  This procedure is a filter, not a truth-machine. It protects the Museum from presenting myth as fact, but it cannot measure the value of the myth itself. Use it to safeguard our epistemic integrity, not to win arguments.

  **Signed,**
  *Senior Curator of Origin Narratives*
