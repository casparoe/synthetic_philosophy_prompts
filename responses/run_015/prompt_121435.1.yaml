      *   *Summary Table:* For quick reference during the presentation.

      *   *Self-Correction during drafting:* Wait, claim 5 says "not about content... because I still have to live with them." This is a *pragmatic* justification for an *epistemic* stance. That's a category error. I need to point that out. Claim 6 correctly identifies that epistemic modesty *is* content modesty. So (5) is the one that must go or be radically redefined as "Pragmatic Resolve" rather than "Epistemic Confidence."
      *   *Refining the 1 vs 2 tension:* If I believe I will change my mind, I should currently be less confident. This links back to 5/6. If I accept 6, then 2 *forces* me to lower confidence in 1. So 1, 2, 5, 6 are all tangled. I need to untangle them by priority.
      *   *Priority:* Epistemic norms (6) trump pragmatic needs (5). Prediction (2) trumps current certainty (1).

  7.  **Final Polish:** Check tone. Expert but patient. No fluff. Ensure the "Rank by Severity" instruction is followed clearly. Ensure specific revisions are offered.

