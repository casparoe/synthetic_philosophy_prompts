      *   *Looping Effect:* Yes, this is his signature concept. Classifying people changes how they see themselves, which changes how they act, which changes the classification.
      *   *Biological Basis:* Hacking is *not* a hardline social constructionist in the sense of denying biology. He is often misread this way. He acknowledges biology but emphasizes the interaction between classification and experience. He explicitly rejects the idea that "socially constructed" means "not real" or "not biological."
      *   *Purely Cultural/Out of Nothing:* No. Hacking argues against "nothing but" constructionism. He talks about "making up people," but that doesn't mean the suffering is fake. It means the *category* shapes the *experience*.
      *   *Uniquely Unstable:* He argues they are *more* dynamic than natural kinds, but "uniquely unstable" might be too strong. They evolve.
      *   *Abolish Labels:* No. Hacking is generally pragmatic. He doesn't call for abolition. He calls for awareness of the effects of classification. He is often critical of the *politics* of diagnosis, but not the utility of diagnosis per se.

