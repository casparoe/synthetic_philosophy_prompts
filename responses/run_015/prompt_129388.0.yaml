  ### Analysis and Principle Construction

  Your five verdicts are remarkably consistent. They do not require abandoning core intuitions in favor of competing principles. Instead, they cohere around a single, robust framework that integrates ecological dynamics with negative utilitarian aggregation. I will call this the **Ecological Negative Welfare Integral (ENWI)**.

  #### The Principle: Ecological Negative Welfare Integral (ENWI)

  **Statement:**
  The moral value of an ecological intervention is determined by the minimization of the time-integrated sum of weighted suffering intensity across all sentient individuals affected.

  **Formal Expression:**
  $$ V = - \int_{t_0}^{T} \sum_{i=1}^{N(t)} \left[ C_i \cdot \left( w_{acute} \cdot I_{acute} + w_{chronic} \cdot I_{chronic} \right) \right] dt $$

  **Parameters:**
  1.  **$N(t)$ (Demographic Flux):** The number of sentient individuals existing at time $t$. Preventing existence (Case 1) sets $N=0$ for those individuals; killing (Case 5) sets $N=0$ for future time but incurs a one-time cost.
  2.  **$C_i$ (Sentience/Life-History Capacity):** A weighting factor for the capacity to suffer. This includes neurobiological complexity and **Life-History Baseline**. r-selected strategies (high mortality risk) carry a higher baseline probability of suffering per unit time than K-selected strategies.
  3.  **$I_{acute}$ vs. $I_{chronic}$ (Intensity Profiles):** Suffering is not homogeneous. Acute terror/pain (predation, injury) is weighted more heavily ($w_{acute} > w_{chronic}$) than chronic discomfort (hunger, mild stress), reflecting the non-linear psychological and physiological impact of trauma.
  4.  **$w$ (Qualitative Weighting):** Specific coefficients for suffering types based on physiological markers (e.g., hypercortisolism vs. nociception).
  5.  **$T$ (Temporal Horizon):** The integration period must be long enough to capture successional stability. Short-term spikes in suffering (e.g., fire deaths) can be outweighed by long-term reductions in $N \times I$.

  #### Step-by-Case Analysis

  Here is how the ENWI principle maps to your five verdicts:

  **Case 1 — Drained Seasonal Wetland**
  *   **Verdict:** Net suffering reduced.
  *   **ENWI Analysis:** The intervention causes a massive reduction in $N(t)$ for the larval stage. Since amphibian/mosquito larvae have high $I_{chronic}$ (parasitism) and high $I_{acute}$ (mortality), and $C_i$ is non-zero, preventing their existence removes a large integral of negative value. The survivors experience negligible increase in $I$.
  *   **Dominant Parameter:** $\Delta N$ (Demographic Flux) dominates because the averted lives have high expected suffering density.

  **Case 2 — Old-Growth Fragmentation**
  *   **Verdict:** Net suffering increased.
  *   **ENWI Analysis:** $N(t)$ drops modestly, but $I_{chronic}$ (allostatic load, hypercortisolism) rises sharply for survivors. Because these are K-selected mammals, $C_i$ is high (complex social bonds, psychological stress). The increase in $\sum (C_i \cdot I_{chronic})$ outweighs the reduction in $N(t)$.
  *   **Dominant Parameter:** $\Delta I_{chronic}$ (Intensity Profile) weighted by high $C_i$ (Sentience Capacity).

  **Case 3 — Grassland Patch Reduction**
  *   **Verdict:** Unchanged or slightly increased.
  *   **ENWI Analysis:** $N(t)$ drops significantly (reducing total suffering), but survivors experience increased $I_{acute}$ (predation exposure) and $I_{chronic}$ (starvation). The reduction in $N$ roughly balances the increase in per-capita $I$. The "slightly increased" lean suggests the density-dependent stress spike is severe enough to barely offset the birth reduction.
  *   **Dominant Parameter:** Equilibrium between $\Delta N$ and $\Delta I$. This case represents the threshold where the principle is most sensitive to empirical data.

  **Case 4 — Invasive Plant Lowering Carrying Capacity**
  *   **Verdict:** Net suffering decreased.
  *   **ENWI Analysis:** $N(t)$ drops by half. Crucially, the *composition* of suffering changes: $I_{acute}$ (predation terror) drops markedly, while $I_{chronic}$ (hunger) rises somewhat. Because $w_{acute} \gg w_{chronic}$ in the ENWI weighting function, the reduction in terror outweighs the increase in hunger, even before accounting for the population drop.
  *   **Dominant Parameter:** Qualitative Weighting ($w_{acute}$ vs. $w_{chronic}$) combined with $\Delta N$.

  **Case 5 — Managed Fire Mosaic**
  *   **Verdict:** Net suffering decreased.
  *   **ENWI Analysis:** There is a short-term spike in $I_{acute}$ (death by fire) for a subset of $N$. However, over temporal horizon $T$, the landscape shifts from high-turnover r-selected populations (high baseline suffering) to stable K-selected populations (lower baseline suffering). The long-term integral of reduced $N \times I$ outweighs the immediate cost of death.
  *   **Dominant Parameter:** Temporal Horizon ($T$) and Life-History Baseline ($C_i$ shift from r to K).

  #### Prediction for the New Scenario

  **Scenario:** Marine ecosystem warming reduces phytoplankton productivity, lowering total fish biomass but also reducing intense competition, injury, and stress associated with dense spawning aggregations.

  **ENWI Prediction:** **Net suffering decreases significantly.**

  **Reasoning:**
  1.  **Demographic Flux ($\Delta N$):** Total fish biomass drops, implying a reduction in $N(t)$. Fewer individuals exist to suffer.
  2.  **Intensity Profile ($\Delta I$):** The prompt specifies a reduction in "intense competition, injury, and stress." This indicates a drop in both $I_{acute}$ (injury) and $I_{chronic}$ (stress/allostatic load).
  3.  **Alignment:** Unlike Case 3 (where $N$ dropped but $I$ rose) or Case 4 (where $I$ types traded off), here both variables move in the same moral direction. Both the number of sufferers and the intensity of suffering per survivor are reduced.
  4.  **Life-History Context:** Fish are often r-selected with high larval mortality. Reducing density in spawning aggregations likely reduces the density-dependent mortality and suffering of larvae, which is a major component of marine suffering.

  **Caveat:** This prediction holds provided the warming does not introduce a new, higher-intensity suffering source (e.g., thermal nociception or suffocation) that outweighs the reduction in competition. Based strictly on the variables provided (biomaass down, competition/stress down), the ENWI calculates a clear reduction in negative welfare.

  ### Conclusion

  Your intuitions are not fragmented; they are empirically nuanced applications of **Dynamic Negative Utilitarianism**. You are implicitly calculating the **Ecological Negative Welfare Integral**. You do not need to choose between competing principles. The tension you felt in Case 3 was not a philosophical contradiction but an accurate reflection of the calculus where $\Delta N$ and $\Delta I$ are of comparable magnitude.

