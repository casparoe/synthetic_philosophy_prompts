prompt: |-
  I'm helping a small research group — philosophers and decision theorists, two years of funding, no empirical ML capacity — set its agenda on acausal trade: exchange or cooperation between agents whose actions are correlated without any causal influence running between them, whether through shared algorithm, shared structure, mutual prediction, or relations of logical implication. The question we ultimately care about is whether an agent, or the designer of one, should ever give acausal-trade considerations real weight in a decision procedure, and if so how much and under what conditions.

  Which open questions in this area should we prioritize, and in what order? I want a defended agenda rather than a survey: which questions are upstream of which, which are tractable in two years with conceptual tools alone, which are neglected relative to their leverage, and which you would drop on the grounds that their answer wouldn't change much downstream whatever it turned out to be.

  Three problems I keep returning to, for whatever they are worth — please don't feel obliged to rank all three highly, and say so if you think the real crux is elsewhere:

  1. Degraded correlation. The clean cases assume that one's own action and the counterparty's are perfectly correlated. Suppose instead the correlation is partial — because of implementation noise or private randomness, asymmetric uncertainty about which world each party occupies, or limits on how accurately either can simulate or prove facts about the other. The gains from trade then attenuate, and it looks as though there should be thresholds below which trade becomes worthless or actively harmful. Is there a principled account of how the value of an acausal trade varies with the degree of correlation, and does the answer depend on what the correlation is grounded in — shared code, shared deliberation procedure, or bare logical implication?

  2. Counterparty measure. If one trades with types rather than tokens, how are counterparties of uncertain number to be weighted, and what happens when expected value is dominated by speculative, remote counterparties capable of offering enormous payoffs, so that the entire practice becomes hostage to one's prior over them?

  3. Legibility as a design choice. Whether it is instrumentally rational to make oneself or one's successors more predictable, more transparently committed, or more cheaply simulable by unknown counterparties — and whether that recommendation, if it holds, is stable when other agents are making the same choice.

  Say explicitly what would move a question up or down the list within two years, and what a negative result would look like: what would justify the group concluding that acausal trade deserves near-zero weight in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Target Audience:** Small research group (philosophers, decision theorists).
      *   **Constraints:** 2 years funding, *no empirical ML capacity* (purely conceptual/mathematical/formal), focus on *acausal trade* (AT).
      *   **Core Question:** Should agents/designers give AT real weight? How much? Under what conditions?
      *   **Task:** Prioritize open questions, defend the ordering (upstream/downstream), assess tractability (2 years, conceptual tools), identify neglected/high-leverage areas, and specify what to drop.
      *   **Specific Input:** Three candidate problems (Degraded Correlation, Counterparty Measure, Legibility as Design Choice).
      *   **Requirement:** Explicitly state what moves questions up/down and what a "negative result" (AT $\approx$ 0 weight) looks like.

  2.  **Deconstruct the Core Problem (Acausal Trade):**
      *   AT relies on Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) frameworks.
      *   It requires: (1) Logical correlation between agents, (2) Ability to simulate/reason about each other, (3) Gains from trade exist, (4) No causal channel.
      *   The "Real Weight" question hinges on *robustness*. If AT is fragile (breaks with noise, sensitive to priors, leads to paradoxes), it gets 0 weight. If it's robust, it gets weight.
      *   *Constraint Check:* No ML capacity means we can't test this in neural nets. We must rely on formal models, game theory, logic, and philosophical argumentation.

  3.  **Evaluate the User's Three Problems:**
      *   *1. Degraded Correlation:* Crucial. Real agents aren't identical source code. Noise exists. If AT collapses with $<100\%$ correlation, it's practically useless. *Verdict: High Priority.*
      *   *2. Counterparty Measure (Pascal's Mugging variant):* Crucial. If AT implies serving infinite/remote agents with tiny probabilities but huge stakes, it's action-guiding paralysis. This is the "Priors" problem. *Verdict: High Priority.*
      *   *3. Legibility as Design Choice:* Important, but perhaps downstream. You need to know *if* AT works before deciding to optimize for it. However, it touches on stability/equilibrium. *Verdict: Medium Priority.*

  4.  **Identify Missing/Upstream Cruxes:**
      *   Before calculating value with noise (Problem 1), we need to know *when* correlation implies obligation. This is the *Foundations of Logical Correlation* problem.
      *   Before weighting counterparties (Problem 2), we need a decision theory that handles updatelessness without exploding. This is the *Reference Class/Updatelessness* problem.
      *   *The "Zero Weight" Condition:* If logical correlation doesn't generate normative force (i.e., if Causal Decision Theory (CDT) is actually the correct normative standard despite FDT arguments), then AT is dead. The group needs to tackle the *Normative Status of Logical Correlation*.

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Fix the decision theory (FDT vs CDT).
          2.  Fix the correlation model (Noise).
          3.  Fix the priors (Measure).
          4.  Look at design (Legibility).
          *Critique 1:* Too generic. Needs to be specific to the 2-year constraint. "Fixing decision theory" is a lifetime job. Need to narrow to *conditions for AT applicability*.

      *   *Attempt 2 (Focusing on Tractability):*
          1.  **Thresholds of Correlation (User's #1).** This is the most "math-y" without needing ML. We can model noise in logical provers.
          2.  **Prior Sensitivity (User's #2).** This is philosophical/formal. Analyze the integration over logical space.
          3.  **Normative Force.** Is "logical similarity" enough for "cooperation"?
          *Critique 2:* Better. But need to emphasize *why* this order. Upstream questions block downstream ones.

      *   *Attempt 3 (Refining for the "Defended Agenda"):*
          *   **Priority 1: The Robustness of Logical Correlation (User's #1 + Foundations).** If AT requires 99.999% similarity, it's irrelevant for humans/heterogeneous AI. If it works at 60%, it's huge. This is the "Existence" proof.
          *   **Priority 2: The Measure Problem & Pascalization (User's #2).** If AT exists, does it swallow all resources? This is the "Safety/Usability" proof.
          *   **Priority 3: Equilibrium Stability (User's #3).** If everyone optimizes for AT, does it collapse? This is the "Implementation" proof.
          *   **Drop:** Specific metaphysics of "logical space" unless it impacts the math of correlation. Drop "anthropic weighting" unless tied directly to AT counterparties.

  6.  **Developing the "Negative Result" Criteria:**
      *   What kills AT?
      *   1. If correlation thresholds are impossibly high.
      *   2. If the prior over counterparties is unbounded/unnormalizable.
      *   3. If "logical correlation" is shown to be normatively inert (CDT wins).

  7.  **Structuring the Response:**
      *   **Executive Summary:** The core bottleneck is *robustness*, not existence.
      *   **The Agenda (Ranked):**
          1.  *Correlation Decay & Thresholds* (User's #1). Upstream. If this fails, nothing else matters.
          2.  *The Measure/Prior Problem* (User's #2). Downstream of 1, but critical for "how much weight."
          3.  *Strategic Legibility* (User's #3). Downstream. Only matters if 1 & 2 say AT is viable.
      *   **The "Hidden" Upstream Question:** Normative Force of Logical Similarity. (Need to address this within #1).
      *   **Tractability Analysis:** Why these fit 2 years/conceptual tools.
      *   **Negative Results:** Explicitly defining failure conditions.
      *   **What to Drop:** Metaphysics of time, specific anthropic theories not tied to AT, empirical speculation.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Do FDT." The group knows FDT. They need to know *where FDT breaks* regarding AT.
      *   *Emphasis:* Highlight that "Degraded Correlation" is the most tractable for philosophers/mathematicians without ML. It's about probability logic and game theory.
      *   *Emphasis:* "Counterparty Measure" is the most dangerous. If this isn't solved, AT is unsafe.
      *   *Emphasis:* "Legibility" is interesting but might be a game-theoretic equilibrium problem that assumes AT works. Put it third.
      *   *Add:* A specific methodological recommendation. Use "toy models" of logical uncertainty (e.g., logical inductors conceptually, not empirically).

  9.  **Final Polish:** Check tone (professional, academic, decisive). Ensure all constraints of the prompt are met (defended agenda, upstream/downstream, negative results, specific feedback on user's 3 problems).

      *(Self-Correction on User's Problem 1)*: The user asks about "grounding" (shared code vs. logical implication). This is key. I should emphasize that distinguishing *causes* of correlation matters for the *decay rate*.
      *(Self-Correction on User's Problem 2)*: This is essentially the "Pascal's Mugging" problem applied to AT. I should frame it as such to leverage existing literature.
      *(Self-Correction on User's Problem 3)*: This is a signaling game. Tractable.

      *Decision:* I will rank them 1 -> 2 -> 3, but with strong caveats that 1 is the "kill switch." I will add a "Foundational" layer regarding the normative force of logic, as that underpins 1.

      *Wait, one more thing:* The prompt asks "what would justify the group concluding that acausal trade deserves near-zero weight." I need to be very specific here.
      *   Condition A: Correlation thresholds > plausible agent similarity.
      *   Condition B: Priors over counterparties lead to infinite expected utility divergence.
      *   Condition C: Logical correlation shown to be decision-irrelevant (CDT defense).

      *Let's finalize the structure.*
      1.  Strategic Overview (The "Robustness" Bottleneck).
      2.  Prioritized Agenda (1, 2, 3).
      3.  The "Kill Criteria" (Negative Results).
      4.  What to Drop.
      5.  Methodological Note (Conceptual tools).

      *Wait, looking closer at the prompt:* "Say explicitly what would move a question up or down the list within two years." I need to include dynamic criteria.
      *   Move Up: If a formal proof shows correlation decays exponentially with complexity.
