          *   *Exposure:* Fatal if introspective concepts are *essentially* recognitional of qualia. Live if cognitive science shows concepts are descriptive.
          *   *Verdict:* This is the semantic battleground. The view lives or dies on whether "phenomenal concepts" are coherent without phenomenality.

