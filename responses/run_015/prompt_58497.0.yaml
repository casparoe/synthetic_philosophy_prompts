answer: |-
  # Facilitation Plan: The Symmetry Experiment

  ## 1. Overview & Preparation
  **Objective:** To create a lived experience of the tension between causal dominance (defecting) and superrational cooperation (acting based on the expectation that similar reasoners will do the same), and to demonstrate how a "luring" asymmetric reward destabilizes that cooperation.
  **Group Size:** 16–20 adults.
  **Duration:** 80 minutes.
  **Room Setup:** Chairs arranged in a loose circle or classroom style where everyone can see the facilitator and a central whiteboard. Ensure enough space between participants to prevent viewing neighbors' slips.

  ## 2. Materials Needed
  *   **Decision Packets:** 20 envelopes. Inside each:
      *   One Green Slip (Stage A).
      *   One Red Slip (Stage B).
      *   One Personal Ledger Card (to track their own scores).
  *   **Writing Instruments:** 20 pens.
  *   **Collection Box:** Opaque box or basket for slips.
  *   **Whiteboard & Markers:** For public tallying.
  *   **Workshop Scrip:** 200 small tokens (poker chips, colored paper squares, or simply tally marks on the Ledger Cards). *Recommendation: Use tally marks on the Ledger Cards to save distribution time.*
  *   **Timer:** Visible to facilitator.

  ## 3. Token Points System
  To avoid handling money or complex token distribution during the session, use a **Ledger System**.
  *   Each participant starts with a **Base Endowment of 5 Scrip** written on their Ledger Card (to prevent negative totals causing distress).
  *   **Stage A Payoffs:** Calculated globally by the facilitator and announced. Participants add the result to their Ledger.
  *   **Stage B Payoffs:** Calculated globally. Participants add/subtract from Ledger.
  *   **Final Score:** Purely symbolic. The "prize" is the insight, but you may offer a small tangible reward (e.g., a book voucher) to the top scorer to increase stakes, or simply treat the scrip as scorekeeping. *Recommendation: Keep it symbolic to avoid excessive competitiveness distracting from the philosophical point.*

  ## 4. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Introduction** | Welcome, grounding rules, distribution of packets. |
  | 10–25 | **Stage A** | Instruction, private decision, collection of Green Slips. |
  | 25–40 | **Stage B** | Instruction, private decision, collection of Red Slips. |
  | 40–55 | **Tallying** | Facilitator counts slips live; calculates payoffs on board. |
  | 55–80 | **Discussion** | Guided debrief connecting experience to concepts. |

  ## 5. Step-by-Step Procedures & Scripting

  ### Phase 1: Introduction (00–10 min)
  **Action:** Distribute packets. Ask participants to write their names on the Ledger Card only, not the slips.
  **Script:**
  > "Welcome. Today we are conducting a decision experiment. There are no right or wrong answers, only choices. Please treat this seriously, as the results depend on the aggregate of our private decisions.
  >
  > You have two slips: Green and Red. You have a Ledger Card. Keep the Ledger; submit the slips.
  >
  > **Rules:**
  > 1. No communication during the decision phases. No talking, no signaling.
  > 2. Decisions are private and simultaneous.
  > 3. You are all facing precisely the same problem structure.
  > 4. I will not explain the theory behind this until the very end. Please sit with the tension of the choice itself."

  ### Phase 2: Stage A (10–25 min)
  **Action:** Hand out Green Slips. Read instructions slowly.
  **Script (Stage A):**
  > "On the Green Slip, you must choose one of two options: **Contribute** or **Retain**.
  >
  > Here is how the scoring works for this stage:
  > *   If you mark **Retain**: You receive **3 Scrip**. This is guaranteed regardless of what others do.
  > *   If you mark **Contribute**: You receive **0 Scrip** for yourself. However, for every person in this room who marks Contribute, **every other participant** receives **1 Scrip**.
  >
  > To be clear: If you Contribute, you do not get the 1 Scrip from your own contribution, but everyone else does. If you Retain, you get 3, and you give nothing to others.
  >
  > You have 5 minutes to decide. Mark your slip, fold it, and place it in the box."

  *(Wait 5 minutes. Collect Green Slips. Do not reveal results yet.)*

  ### Phase 3: Stage B (25–40 min)
  **Action:** Hand out Red Slips.
  **Script (Stage B):**
  > "Now, the Red Slip. This stage is only available to those who marked **Retain** on the Green Slip.
  >
  > *   If you marked **Contribute** on Green: You must mark **Not Eligible** on this Red Slip.
  > *   If you marked **Retain** on Green: You may choose **Enter** or **Pass**.
  >
  > **The Bonus Rule:**
  > *   If **exactly one** person in the room marks **Enter**: That person receives **15 Bonus Scrip**.
  > *   If **zero** people or **more than one** person marks **Enter**: Everyone who marked Enter loses **1 Scrip**. Those who marked Pass lose nothing.
  >
  > We will verify consistency between Green and Red slips. Inconsistent slips will be disqualified from the bonus.
  >
  > You have 5 minutes. Mark, fold, and submit."

  *(Collect Red Slips.)*

  ### Phase 4: Tallying (40–55 min)
  **Action:** This must be transparent. Open the box. Count Green Slips first.
  1.  Count total **Contributors (C)** and **Retainers (R)**. Write on board.
  2.  Calculate Stage A Payoff:
      *   Contributor Payoff = $(C - 1) \times 1$.
      *   Retainer Payoff = $3 + (C \times 1)$.
  3.  Count Red Slips among the Retainers. Count **Entrants (E)**.
  4.  Calculate Stage B Payoff:
      *   If $E = 1$: Winner +15.
      *   If $E \neq 1$: Each Entrant -1.
  5.  Announce final totals. Ask participants to update their Ledgers.

  *(Note: If there are multiple winners in Stage B due to error, or no winners, highlight the outcome neutrally.)*

  ### Phase 5: Closing Discussion Guide (55–80 min)
  **Goal:** Connect the visceral experience to the philosophical concepts without jargon initially, then introduce terms.

  **Part 1: The Stage A Tension (55–65 min)**
  *   **Question:** "In Stage A, Retain gave you 3 points no matter what. Contribute gave you 0 directly. Yet, if everyone Contributed, we all would have had roughly 19 points. Who chose Retain? Who chose Contribute?"
  *   **Question:** "For those who Contributed: What was your reasoning? Did you hope others would do the same?"
  *   **Question:** "For those who Retained: Did you feel you were being rational? Why?"
  *   **Concept Introduction:** Introduce **Causal Dominance**. "Causally, your slip cannot change theirs. Retain dominates. But many felt a pull to Contribute. Why?"
  *   **Concept Introduction:** Introduce **Superrationality/Argument from Similarity**. "If I am rational, and you are rational, and we face the same data, should we not conclude the same thing? If I decide to Contribute, I predict you will too. That correlation makes Contribute attractive, even if my hand doesn't causally move yours."

  **Part 2: The Stage B Destabilization (65–75 min)**
  *   **Question:** "Stage B offered a large prize, but only for one person. How did this change your thinking?"
  *   **Question:** "If we are all 'similar reasoners,' should we not all make the same choice in Stage B? If we all Enter, we all lose. If we all Pass, no one wins. To win, we must be *different*. Did anyone feel uncomfortable trying to be unique?"
  *   **Concept Introduction:** **Symmetry Breaking.** "Superrationality relies on symmetry. Stage B rewarded asymmetry. This makes the 'we think alike' heuristic unstable. You cannot reason 'I will Enter because we all will' because if we all do, we fail."

  **Part 3: Synthesis (75–80 min)**
  *   **Question:** "Does this change how you view rational cooperation in the real world (climate change, voting, etc.)?"
  *   **Closing Thought:** "Rationality might not just be about causing outcomes, but about being the kind of agent whose decisions signal good outcomes for similar agents. But when the system rewards being the exception, that logic fractures."

  ## 6. Implementation Difficulties & Remedies

  | Difficulty | Likelihood | Remedy |
  | :--- | :--- | :--- |
  | **Payoff Confusion** | High | Participants often miscalculate the "1 to others" rule. **Remedy:** Use a concrete example on the board before Stage A begins (e.g., "If there were only 3 of us..."). |
  | **Distrust of Tally** | Medium | Participants may suspect the facilitator will fudge numbers to make a point. **Remedy:** Invite two volunteers to count the slips aloud with you during the Tallying phase. |
  | **Stage B Eligibility Cheating** | Medium | Contributors might try to Enter the bonus pool. **Remedy:** Explicitly state during instructions that Green and Red slips will be cross-checked and inconsistencies disqualified publicly. |
  | **Cynicism/Disengagement** | Low | "It's just a game." **Remedy:** Frame the Ledger scores as qualifying for a tangible draw (e.g., "Highest score chooses the book for next month") to raise stakes slightly. |
  | **Time Overrun** | High | Discussion can drift. **Remedy:** Keep a visible timer. Cut off voting strictly at the 5-minute mark to preserve discussion time. |

  ## 7. Limitations of the Exercise
  **Candid Statement:**
  This live exercise cannot reproduce the **logical identity** required for true superrationality. In the theoretical model (e.g., Hofstadter's Platonia Dilemma), agents are assumed to be identical copies of the same program; therefore, if one chooses X, the other *must* choose X by logical necessity. In this library group, participants are merely empirically similar (humans in a room). One participant choosing Contribute does not logically force another to do so; it only makes it probabilistically likely. The exercise creates the *psychological pressure* of superrationality, but the *logical binding* must be supplied by explanation in the closing discussion. Participants must be told that the philosophical force of the argument relies on the premise of logical identity, which the game simulates but cannot enforce.

