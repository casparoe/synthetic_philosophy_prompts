answer: |-
  # Module: The Isomorphic Directive
  **Seminar:** Rational Agency & The Structure of Choice
  **Duration:** 90 Minutes
  **Participants:** 12 Doctoral Students
  **Instructor Role:** Silent Observer / Payoff Administrator (No lecturing until Debrief)

  ## I. Pedagogical Objective
  To simulate the logical pressure of Buridan's Ass not as a failure of will, but as a structural feature of rational choice under strict symmetry. The activity forces students to construct a selection mechanism, discover that the mechanism itself is subject to symmetrical indeterminacy (nested Buridan case), and confront whether "volition" can bridge the gap without violating rational norms.

  ## II. Room Setup & Materials
  *   **Seating:** A single round table (or desks arranged in a circle) to eliminate spatial hierarchy (no "head" of the table).
  *   **Materials:**
      *   12 Role Cards (distributed secretly).
      *   2 Envelopes labeled **OPTION OMEGA** and **OPTION THETA**. (Contents are identical: a card reading "100 Rationality Credits").
      *   1 "Protocol Sheet" (placed in the center).
      *   1 "Justification Form" (must be submitted to claim credits).
      *   Timer visible to all.
  *   **Payoff:** "Rationality Credits" (RC). These convert to participation points at the end of the term.
      *   **Base:** 100 RC if a single option is selected and submitted within 45 minutes.
      *   **Decay:** -5 RC for every minute elapsed after minute 45.
      *   **Integrity Bonus:** +20 RC if the Justification Form honestly admits the absence of a differentiating reason (testing the "rationality of arbitrariness").

  ## III. Roles (Assigned via Cards)
  *   **Deliberators (4):** Tasked with proposing options and selection rules.
  *   **Symmetry-Checkers (4):** Tasked with vetoing any reason that introduces asymmetry not present in the options themselves. *Instruction: "If a reason relies on preference, spatial bias, or external fact not contained in the Protocol, you must veto it."*
  *   **Record-Keepers (2):** Tasked with logging every proposed rule and the specific reason for its rejection or acceptance.
  *   **Arbiters (2):** Tasked with physically moving the chosen envelope to the submission zone. *Constraint: They may only move an envelope if a Rule is ratified by the Symmetry-Checkers.*

  ## IV. The Protocol Sheet (The Rules of Engagement)
  *(Read aloud by one Deliberator at Minute 0)*

  1.  **Objective:** The Collective Agent (this group) must select exactly one Option (Omega or Theta).
  2.  **Constraint 1 (Symmetry):** The Options are identical in value, content, and description. No external preference (e.g., "I like the color of Omega") counts as a reason.
  3.  **Constraint 2 (Rational Grounding):** A choice is only valid if accompanied by a **Sufficient Reason**. A Sufficient Reason must cite a differentiating feature between the options.
  4.  **Constraint 3 (The Meta-Rule):** If no differentiating feature exists between Options, the Agent must adopt a **Selection Rule**.
  5.  **Constraint 4 (The Regress):** The Selection Rule itself must be justified by a Sufficient Reason.

  ## V. Minute-by-Minute Timeline

  ### Phase 1: First-Order Symmetry (Minutes 0–25)
  *   **00–05:** Distribution of roles. Students read cards. Envelopes placed in the center. Timer starts.
  *   **05–15:** **Deliberators** propose reasons to choose Omega over Theta (e.g., "Omega is on the left," "Omega was mentioned first").
      *   **Symmetry-Checkers** actively veto.
      *   *Trap:* "Left" is relative to the viewer, not the Agent. "Mentioned first" depends on the speaker, not the option.
      *   *Goal:* The group realizes there is no first-order differentiating feature.
  *   **15–25:** **Deliberators** propose a **Selection Rule** to break the tie (e.g., "Flip a coin," "Vote," "Pick the top envelope").
      *   **Symmetry-Checkers** vet the Rule.
      *   *Trap:* "Flip a coin" introduces an external event, not internal reason. "Vote" aggregates preferences, which are ex hypothesi non-existent/symmetrical. "Top envelope" relies on spatial arrangement which is arbitrary.
      *   *Outcome:* By Minute 25, the group should be deadlocked. They have a Rule (e.g., "Choose the option designated as *Prior*"), but no way to determine *Priority*.

  ### Phase 2: Nested Symmetry (Minutes 25–50)
  *   **25–35:** **Record-Keepers** highlight the ambiguity in the agreed Rule.
      *   *Scenario:* The group agrees on the rule: **"Select the Prior Option."**
      *   *The Trap:* **Symmetry-Checkers** demand a definition of "Prior."
      *   *Interpretation A:* Prior in Space (Left/Right). (Vetoed: Room is circular/symmetrical).
      *   *Interpretation B:* Prior in Time (First touched). (Vetoed: Arbiters must act simultaneously).
      *   *Interpretation C:* Prior in Alphabet (Omega vs. Theta). (Vetoed: Greek ordering is conventional, not rational).
  *   **35–45:** **The Second-Order Deadlock.** The group now faces a Buridan case *about the Rule*. They must choose between **Interpretation A** and **Interpretation B** of the word "Prior."
      *   **Deliberators** try to find a reason to prefer one interpretation.
      *   **Symmetry-Checkers** veto all meta-reasons.
      *   *Pressure:* The 45-minute mark approaches. Points begin to decay.
  *   **45–50:** **Forced Resolution.** The Arbiters are authorized to submit a choice *only if* the Justification Form is signed. The group must decide whether to:
      1.  Submit nothing (0 points).
      2.  Submit a choice with a false reason (Violates Constraint 2).
      3.  Submit a choice admitting arbitrariness (Claims Integrity Bonus, risks violating Constraint 2).

  ### Phase 3: Submission & Transition (Minutes 50–60)
  *   **50–55:** Final negotiation. The group must physically sign the Justification Form.
  *   **55–60:** Submission to Instructor. Timer stops. Points calculated publicly.

  ### Phase 4: The Debrief (Minutes 60–90)
  *   **60–70: Anatomical Mapping.** Instructor maps the activity stages to the literature.
      *   *Phase 1:* **Symmetry of First-Order Reasons.** (Leibniz: "No sufficient reason.")
      *   *Phase 2:* **The Selection Mechanism.** (Buridan: Will as a distinct faculty? vs. Rationalists: Will follows intellect.)
      *   *Phase 3:* **The Regress.** (The "Normative Gap." If the rule is chosen arbitrarily, is the action rational?)
  *   **70–80: The Voluntarist Challenge.** Discuss the Integrity Bonus.
      *   Did admitting arbitrariness save the agency or surrender it?
      *   Reference: **Jean Buridan** (determinism of the good) vs. **William of Ockham** (will can choose against intellect) vs. **Harry Frankfurt** (second-order volitions).
      *   *Key Question:* Is the "Decision to Adopt a Rule" an exercise of agency, or just another event in the causal chain?
  *   **80–90: Failure Analysis.** Review the Record-Keeper's log.
      *   Where did the symmetry break? (Did someone sneak in a preference?)
      *   Did the "Decay Penalty" function as an external reason (prudential value breaking the symmetry)?

  ## VI. The Nested Symmetry Mechanism (Instructor Notes)
  To ensure the Second-Order trap works, the **Protocol Sheet** contains a specific ambiguity in Constraint 3.
  *   *Text:* "A Sufficient Reason must cite a differentiating feature... **or a valid Selection Rule.**"
  *   *The Trap:* The term "Valid" is undefined.
  *   *Symmetry:* When the group proposes "Randomization" as a Valid Rule, Symmetry-Checkers must ask: "Why is Randomization valid?"
      *   If the answer is "Because it's fair," Checkers ask: "Why is Fairness a rational requirement for choice?"
      *   If the answer is "Because it resolves deadlock," Checkers ask: "Is resolution a rational goal, or merely a pragmatic one?"
      *   This forces the **Second-Order Buridan Case**: Choose between "Rational Validity" (no reason exists) and "Pragmatic Validity" (we need points). These two values (Truth vs. Prudence) are the new symmetrical options.

  ## VII. Honest Note on Limitations
  **Feature Not Reproduced:** *The Phenomenology of Starvation.*
  Buridan's Ass starves to death. The stakes here are academic points. The "necessity" of action is hypothetical (you can theoretically get 0 points), not categorical (death). In the original paradox, the *biological drive* to eat conflicts with the *rational inability* to choose. Here, the drive is grade-oriented.
  *   **Supplement in Discussion:** You must explicitly ask students to imagine the stakes were *life-or-death*. Does the rational pressure increase, or does the agency collapse into pure reflex? This distinguishes **Practical Rationality** from **Biological Imperative**.

  **Most Likely Failure Mode:** *The Democratic Collapse.*
  In the first run, students will likely vote (6 vs. 6) and then claim the "Majority Rule" breaks the symmetry.
  *   **Why this fails:** Voting aggregates *preferences*. The setup stipulates *no hidden preferences*. If students vote, they are lying about their symmetry.
  *   **Correction:** Symmetry-Checkers must be briefed to veto voting immediately. "A vote reveals preference. We established ex hypothesi that no preference exists. Therefore, a vote is factually incorrect." This forces them back into the logical trap.

  ## VIII. Instructor Script for Debrief Opening
  *(Do not speak until the Justification Form is collected)*

  "You have just enacted the history of modern action theory.
  Minutes 0–25 were **Leibniz**: You looked for a sufficient reason in the object.
  Minutes 25–45 were **Kant/Buridan**: You looked for a rule in the subject.
  Minutes 45–50 were **Existentialism**: You had to choose without a rule.

  Look at your Justification Form.
  If you wrote a reason, did you lie?
  If you wrote 'Arbitrary,' did you cease to be agents?
  If you wrote nothing, did you cease to be rational?

  Let us begin with the Record-Keepers. Read the first veto."
