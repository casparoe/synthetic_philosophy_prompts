      *   Teaching arc? Yes.
      *   Carrying example? Yes (*Up* montage).
      *   Misconceptions defused? Yes (Catharsis, Masochism, Pretence).
      *   User's lens included? Yes.
      *   Check question? Yes.
      *   What to omit? Yes.

  9.  **Final Polish:** Ensure the flow feels logical for a 90-minute session. 90 minutes is quite long for just this, so discussion time needs to be baked in. I will structure the arc with time allocations.

