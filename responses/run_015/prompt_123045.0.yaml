  *(Another Correction)*: The prompt asks for "random re-pairing" in Run 1. I will stick to that. For Run 2, I will keep random re-pairing to isolate the variable (the card info) rather than partner familiarity, though I will note in the "Limitations" that fixed pairs would strengthen the reputation effect. Actually, fixed pairs in Run 2 might confuse the lesson (is it the card or the partner?). Random pairs in both keeps the focus on the *structural* uncertainty introduced by the cards.

  *(Wait, one more thing)*: If pairs are random in Run 2, and I Pass, you update beliefs about *me*. But we only play once (per round). So if I Pass at Node 1, and you are at Node 2, you update beliefs about me *for Node 2*. That works. It's intra-game learning.

