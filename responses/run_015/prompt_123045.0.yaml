answer: |-
  Here is a complete lesson plan designed to fit your 75-minute window, specifically tuned to philosophy undergrads who know the formalism but need the intuition.

  ### 1. The Game Design: "The Escalating Pot"
  This is a truncated **Centipede Game**. It must be short enough to play multiple rounds but long enough to allow backward induction.

  **The Tree (4 Nodes):**
  *   **Node 1 (Player A):** **TAKE** → Game Ends. Payoffs: **(A: 2, B: 1)**.
      *   *or* **PASS** → Pot grows, move goes to B.
  *   **Node 2 (Player B):** **TAKE** → Game Ends. Payoffs: **(A: 1, B: 4)**.
      *   *or* **PASS** → Pot grows, move goes to A.
  *   **Node 3 (Player A):** **TAKE** → Game Ends. Payoffs: **(A: 3, B: 2)**.
      *   *or* **PASS** → Pot grows, move goes to B.
  *   **Node 4 (Player B):** **TAKE** (Forced End). Payoffs: **(A: 2, B: 6)**.
      *   *(Note: To save time, Node 4 is an automatic Take for the rational type, or simply the end of the line.)*

  **Why these numbers?**
  *   At Node 3, A prefers 3 (Take) over 2 (Pass to Node 4).
  *   At Node 2, B prefers 4 (Take) over 2 (Pass to Node 3).
  *   At Node 1, A prefers 2 (Take) over 1 (Pass to Node 2).
  *   **Nash/BI Prediction:** A Takes at Node 1.
  *   **Social Optimum:** Reach Node 4 (Total 8 points vs 3 points).

  ---

  ### 2. Materials
  *   **9 Pairs of Folders:** Manilla folders work best. Inside each, two distinct slots labeled "Player A" and "Player B".
  *   **Decision Slips:** Small slips of paper for each node. Pre-printed with "Node 1", "Node 2", etc.
  *   **Type Cards (Run 2 only):** 18 cards total. 15 say **"AGENT"** (Choose Take or Pass). 3 say **"CONSTRAINED"** (You *must* Pass at every opportunity).
  *   **Scoreboard:** Whiteboard to track cumulative points per student.
  *   **Timer:** Visible.

  ---

  ### 3. Run 1: The Baseline (25 Minutes)
  **Setup:** Pair students randomly. Hand them a folder. Tell them they will play 3 rounds, re-pairing randomly each time.

  **Script (Read Exactly):**
  > "In this folder, you will find decision slips. You are Player A or Player B. You will not speak to your partner.
  >
  > Here is the rule: The pot starts small. If you **Take**, the game ends, and you get the larger share of the current pot. If you **Pass**, the pot grows, but the decision moves to your partner.
  >
  > Look at the payoff sheet inside. You will see that at every stage, Taking gives you more points *at that moment* than Passing would guarantee you if the game ended next.
  >
  > Your goal is to maximize your total points across all rounds. The student with the highest total score at the end of the seminar receives a coffee voucher.
  >
  > You know the payoffs. You know your partner sees the same payoffs. You know your partner wants the voucher.
  >
  > Begin Round 1."

  *(Monitor closely. If a pair takes 5 minutes, intervene. They should decide in seconds.)*

  **Data Collection:**
  Collect the decision slips. Record the **Stop Node** for each pair on the board (e.g., "Pair 1: Node 1", "Pair 2: Node 3").

  ---

  ### 4. Run 2: The Uncertainty (25 Minutes)
  **Setup:** Random re-pairing again. Hand out folders + **Type Cards**.
  *   Distribute the 3 "CONSTRAINED" cards randomly face-down.
  *   **Crucial:** Students look at their card privately. They do *not* show their partner.
  *   **Instruction:** "If you are CONSTRAINED, you have no choice. You must Pass. If you are AGENT, you choose."

  **Script (Read Exactly):**
  > "Same game. Same payoffs. Same goal: maximize your points for the voucher.
  >
  > New rule: Before play, you drew a Type Card.
  >
  > Some of you are **AGENTS**. You choose Take or Pass.
  > Some of you are **CONSTRAINED**. You *must* Pass at every opportunity. You cannot Take.
  >
  > You know your own type. You do **not** know your partner's type.
  > You know that most players are Agents, but a few are Constrained.
  >
  > If you are Constrained, you must Pass. If you are an Agent, you may Take or Pass.
  >
  > Begin Round 1."

  *(Run 3 rounds with re-pairing. Record Stop Nodes again.)*

  ---

  ### 5. The Debrief: Mapping Intuition to Epistemics (25 Minutes)
  This is where the teaching happens. Do not start with definitions. Start with the board.

  **Step 1: The Data Reveal**
  Draw two histograms on the board: Run 1 Stop Nodes vs. Run 2 Stop Nodes.
  *   *Expected Run 1:* Heavy cluster at Node 1 (Take).
  *   *Expected Run 2:* Shift to the right (More Passes, deeper into the tree).

  **Step 2: Reverse Engineering Run 1 (Common Knowledge of Rationality)**
  Ask: "In Run 1, why did most of you Take at Node 1? You saw the pot growing."
  *   *Student Answer:* "Because if I pass, they take at Node 2."
  *   *You:* "Why do you know they will take at Node 2?"
  *   *Student Answer:* "Because it's better for them."
  *   *You:* "But for them to take at Node 2, they have to believe *you* would take at Node 3. And for you to take at Node 3, you have to believe..."
  *   **Board Work:** Draw the chain.
      *   I Take at 1 because I know You Take at 2.
      *   You Take at 2 because You know I Take at 3.
      *   I Take at 3 because I know You Take at 4.
  *   **The Label:** "This chain only holds if we both know we are rational, we both know we both know, and so on. This is **Common Knowledge of Rationality (CKR)**. In Run 1, I told you: 'You know your partner wants the voucher.' I implied CKR."

  **Step 3: The Run 2 Shift (Breaking the Chain)**
  Ask: "In Run 2, why did more of you Pass? The payoffs didn't change."
  *   *Student Answer:* "Because my partner might be forced to pass."
  *   *You:* "Exactly. If I am an Agent at Node 1, and I Pass, what do you think at Node 2?"
  *   *Student Answer:* "You might be Constrained."
  *   *You:* "So if I Pass, you don't immediately conclude I'm irrational. You conclude I might be Constrained. So you Pass to get to the bigger pot."
  *   **The Label:** "By introducing a tiny probability that your partner *cannot* maximize utility (the Constrained type), I broke the CKR. You no longer knew for sure that I was rational. That sliver of doubt made Passing rational for *you*."

  **Step 4: The Discontinuity (The Formal Lesson)**
  Write on board:
  *   $P(\text{Rational}) = 1 \rightarrow$ Take at Node 1.
  *   $P(\text{Rational}) = 0.99 \rightarrow$ Pass at Node 1 (potentially).
  *   **Point:** "In game theory, moving from probability 1 to 0.99 is not a small change. It is a phase shift. It collapses the Backward Induction solution. Rationality being *known* is fundamentally different from Rationality being *almost certain*."

  **Step 5: Recovering Levels of Reasoning**
  Ask the class: "Who Passed at Node 1, hoping the other would Pass at Node 2?" (Raise hands).
  *   "That is **Level 1**: I think you might be Constrained.
  *   Who Passed at Node 2, because they thought 'My partner Passed at 1, so they might be Constrained, so I should Pass'?"
  *   "That is **Level 2**: I think that you think that I might be Constrained."
  *   **Data Point:** Count the hands. Show them that most people stopped at Level 2 or 3, even though the logic could go further. This shows the *cognitive* limit vs. the *theoretical* limit.

  ---

  ### 6. What Will Go Wrong (And How to Fix It)
  1.  **The "Nice" Problem:** In Run 1, philosophy students often Pass because they want to be cooperative, not competitive.
      *   *Fix:* Emphasize the **Coffee Voucher**. Make it zero-sum in spirit. "Only the *top* scorer wins. If you help them, you lose."
      *   *Debrief Adjustment:* If Run 1 data is noisy (lots of passes), acknowledge it. "You acted on *social* preferences, not just epistemic ones. But look at Run 2: did the passes go *deeper*? That's the epistemic shift."
  2.  **The "Constrained" Confusion:** Students with "Constrained" cards might think they can Take at the last node.
      *   *Fix:* Walk around during Run 2. Check the Constrained players' slips immediately.
  3.  **No Constrained Cards in Play:** With 18 students and 3 cards, it's possible a specific pair has two Agents.
      *   *Fix:* This is actually *good* for the lesson. It shows that the *belief* matters, not the reality. Ask the pair: "You were both Agents. Why did you Pass?" Answer: "I thought you were Constrained." This proves the epistemic mechanism worked without the ontological reality.
  4.  **Time Creep:** 18 students discussing decisions takes time.
      *   *Fix:* Enforce a 60-second timer per round. "Write your move. Fold the slip. Hand it in."

  ---

  ### 7. Limitations: What This Game Cannot Stage
  Be honest in the final 5 minutes.
  1.  **Infinite Hierarchy:** Common Knowledge is an infinite chain ("I know that you know that I know..."). This game only tests 2 or 3 levels deep. You are showing the *fragility* of CKR, not the full infinite structure.
  2.  **Reputation vs. Type:** In a true repeated game (same partner for 20 rounds), you build a reputation. Here, with random pairing, you are relying on *type uncertainty* (Kreps/Wilson/Milgrom/Roberts logic) rather than *reputation building*. It's a "one-shot" version of the reputation model.
  3.  **Rationality Definition:** You equated "Rational" with "Self-Interested Maximizer." In philosophy, Rationality might mean "Moral" or "Consistent." Be clear that in Game Theory, Rational = Utility Maximizing.

  ---

  ### 8. Confidence & Uncertainty
  **Confidence Level:** **85%**.
  The logic is sound, and the Centipede game is the standard vehicle for this lesson. The contrast between Run 1 and Run 2 is robust in literature (e.g., McKelvey & Palfrey, 1992).

  **Least Sure Bit:** **Run 1 Behavior.**
  I am least sure about how quickly philosophy undergrads will converge on the "Take at Node 1" equilibrium in Run 1. They are trained to look for cooperative solutions (Prisoner's Dilemma style). If 50% of the class Passes in Run 1, the contrast with Run 2 will be muted.
  *   *Mitigation:* If Run 1 data is "too cooperative," pivot the debrief. "You passed because you weren't *sure* they were rational maximizers. You already treated CKR as false. Run 2 just made that uncertainty explicit." This turns a "failure" into a meta-lesson about the rarity of CKR in the wild.

  ### Summary Checklist for You
  *   [ ] Print Payoff Sheets (clear tree diagram).
  *   [ ] Prepare 18 Type Cards (15 Agent, 3 Constrained).
  *   [ ] Buy the Coffee Voucher (bring it to class, wave it around).
  *   [ ] Practice the Script (ensure no accidental hints like "smart move" or "logical choice").
  *   [ ] Bring a stopwatch.
