answer: |-
  If Chase and Sanborn are correct that qualia are an incoherent posit, the primary implication is that the realism vs. eliminativism debate is a category error. There is nothing to eliminate because the concept refers to nothing coherent. Philosophy of mind shifts entirely to explaining discriminatory behaviors and functional access without positing an inner "given."

  Regarding the **Hard Problem**, their claim attempts to **dissolve** it rather than shift it. The Hard Problem presupposes that functional explanations leave something out (the qualia). If qualia are incoherent, nothing is left out. However, critics argue this effectively **shifts the mystery** to explaining why humans persistently *believe* they have qualia. The explanatory burden moves from "how does matter produce feeling?" to "how does matter produce the judgment of feeling?"

  In the **swarm twist**, the incoherence claim implies that attributing qualia to the swarm was **always conceptually broken**, not just contingent on the agents' lack of feel. If qualia are incoherent, *nothing* has them—neither humans nor swarms. The question isn't whether the swarm possesses qualia, but whether its collective dynamics satisfy the functional criteria we label "pain." If the behavior mirrors pain exactly, that is all "pain" amounts to; searching for an extra layer of subjective feel is chasing a conceptual ghost.
