      *   *The Unwelcome Result:* Highlight Case 3. Explain the tension between "Efficiency" (Reform) and "Presumption of Wisdom" (Burke).
      *   *Failure Conditions:* When does this fail? (Systemic oppression, rapid technological change).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include stopping rules? Yes.
