  8.  **Final Polish:** Ensure the distinction between "Fact" and "Value" is explicit in the procedure steps. Make sure the "Stop" conditions are bolded. Ensure the explanation of the "unwelcome" result is empathetic but firm on the logic. (Self-correction: Make sure the Market Stall case doesn't accidentally become the "unwelcome" one if the student is pro-business. I'll assume the student is "reform-minded" generally implies pro-transparency/anti-bureaucracy. So keeping the permit is the strongest friction point).

      *Wait, one nuance:* The prompt asks for *one* of the applications to yield an unwelcome answer. I should ensure the other two are either welcome or neutral.
      *   Case 1 (Market): Reformers might like private leasing (efficiency/property rights). But Burke says rotation prevents monopoly. I'll make the procedure suggest *keeping* the rotation. That could also be unwelcome.
      *   Case 2 (School): Reformers might like algorithms (objectivity). Burke says informal agreements preserve community.
