prompt: |-
  I'm giving a ninety-minute session at a writers' conference next month — about twenty novelists, no philosophy background, all of them convinced they're already strong on character — and the topic is sphexishness: the way a stretch of behavior runs to completion regardless of what changes around it, and what would have to be true for a character to count as flexible rather than just noisier. I dont want the idea explained to me; I want a plan for how to get them there. What has to land first for the rest to have somewhere to sit? (My guess: that rigidity isn't repetition, it's insensitivity to the variable that matters — and that before that they need to see a fixed pattern that looks varied on the surface.) Which one example should carry the whole session, and what does it need to have and lack? I was going to use a scene of my own where a character keeps walking through a door she no longer has any reason to want, but I worry its too writerly — tell me if that's the right horse. Misconceptions I'm expecting: that flexible means unpredictable, so a coin flip or a random urge makes a character free; that the opposite of mechanical is "doing it for a reason"; that if it's sphexish then it isn't really her acting. Where in the sequence do I head each off, and which one am I not seeing? I also want to work in something I keep chewing over: that sphexishness might be grain-relative — you can be flexible about strategy and rigid about tactics, or the other way round, and whether a bit of behavior counts as rigid depends on the grain you look at it in. Does that go in early as a tool or late as a complication? Give me one thing for the board at the end that tells me they've got it rather than just agreeing with me. And tell me what to openly refuse to get into — I am not spending the last twenty minutes on free will.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** ~20 novelists, no philosophy background, confident in their character skills (potentially defensive or complacent).
      *   **Topic:** Sphexishness (behavioral rigidity/insensitivity to relevant variables vs. flexibility).
      *   **Goal:** A 90-minute session plan. Not an explanation of the concept, but a *pedagogical strategy* to get them to understand and apply it.
      *   **Key Constraints/Questions:**
          *   What needs to land first? (Foundation).
          *   Which single example to use? (The user's door scene vs. alternatives).
          *   How to handle specific misconceptions (Flexibility $\neq$ Randomness; Rigidity $\neq$ No Reason; Rigidity $\neq$ Not Acting).
          *   Where to fit the "grain-relative" nuance (Early tool or late complication)?
          *   What is the final board check for understanding?
          *   What to explicitly exclude (Free Will).
      *   **Tone:** Professional, strategic, insightful, respecting the user's expertise (they know the concept, they need the *delivery* plan).

  2.  **Deconstruct the Core Concept (Sphexishness):**
      *   *Definition:* A behavior runs to completion despite changes in the environment that should logically alter the behavior if the agent were truly responsive to the goal.
      *   *The Trap:* It looks like agency (there's movement, there's intent), but it's actually a script.
      *   *The Writer's Challenge:* Distinguishing "quirky habit" (good character) from "broken script" (bad writing/unconscious character) vs. "tragic flaw" (good character *because* they fail to adapt).
      *   *The Nuance:* Grain-relative (rigid on tactics, flexible on strategy, or vice versa).

  3.  **Address the Specific Questions:**

      *   **What has to land first?** The user guesses: "Rigidity isn't repetition, it's insensitivity to the variable that matters." I agree, but with a tweak. Before they accept *that*, they need to feel the *uncanny valley* of it. They need to see behavior that *looks* purposeful but feels *off*. So, the foundation is: **Purpose without Feedback.**
      *   **The Example:** The user's "walking through a door" scene.
          *   *Pros:* Direct, visceral.
          *   *Cons:* "Too writerly"? Maybe. If it's abstract, they'll dismiss it. If it's emotional, it lands.
          *   *Verdict:* Keep it, but *stress test* it. It needs to be a door she *used* to need (lover behind it? job interview?) but now the context has shifted (lover dead? job cancelled?) and she walks anyway.
          *   *Requirement:* It needs to lack *internal monologue justifying it*. If she thinks "I know he's dead but I need to check," that's grief, not sphexishness. If she just walks, hand on knob, no thought, that's sphexishness.
      *   **Misconceptions:**
          *   *Flexibility = Unpredictable/Random:* Head this off early when defining flexibility.
          *   *Opposite of Mechanical = Doing it for a Reason:* This is the big one. Need to show that "having a reason" can be part of the script.
          *   *If Sphexish, Not Really Her:* Need to reframe this as a character *flaw* or *state*, not an authorial error (necessarily).
      *   **Grain-Relative:** This is sophisticated. If introduced too early, it confuses. If too late, it feels like an add-on. Best as a **diagnostic tool** in the middle. "Where is the break?"
      *   **Final Board Check:** Needs to be actionable. Not "I agree," but "I can spot this."
      *   **Refusal:** Free Will. Draw a hard line. This is about *craft*, not metaphysics.

  4.  **Drafting the Session Plan (Iterative Process):**

      *   *Opening (15 mins):* Hook them. Don't lecture. Show, don't tell. Use the example immediately.
      *   *Phase 1 (The Hook):* The Door Scene. But wait, if I show it first, they might critique the writing. Better to describe a scenario *they* know. Actually, the user's scene is best if framed as "Spot the glitch."
      *   *Phase 2 (Definition):* Define Sphexishness not as "robot" but as "closed loop."
      *   *Phase 3 (Misconceptions):* Tackle the "Randomness" and "Reason" traps.
      *   *Phase 4 (Grain):* Use the grain concept to fix the characters.
      *   *Phase 5 (Application):* They write/analyze.
      *   *Closing:* The Board Check.

      *Refining the Example:* The door scene is good, but is it *too* subtle? A wasp (Sphex) drags a cricket. If the cricket is moved, the wasp puts it back and checks the hole, then drags again. Even if the cricket is moved *again*.
      *Writer equivalent:* A character apologizing. They apologize to fix the relationship. The relationship is already over. They apologize anyway.
      *Decision:* Stick with the User's Door Scene. It's theirs, they own it. But advise them to strip the interiority.

      *Refining the Grain:* Put it in the middle. It's the "How to fix it" section. If you are rigid on tactics, change the strategy.

      *Refining the Free Will Boundary:* Put a signpost up at the start. "We are talking about *plausibility*, not *ontology*."

  5.  **Developing the "Board Check":**
      *   Needs to distinguish agreement from understanding.
      *   Idea: A two-axis chart? No, too academic.
      *   Idea: A specific revision instruction.
      *   Best Idea: A diagnostic question they can apply to their own WIP. "What variable is your character ignoring?"

  6.  **Addressing the "What needs to land first" question:**
      *   User suggests: Rigidity = insensitivity to variable.
      *   My addition: Before that, they must accept that **Competence $\neq$ Agency.** A character can be smart and active and still be sphexish. This counters the "strong character" ego.

  7.  **Final Review against Constraints:**
      *   90 mins? Yes, broken into chunks.
      *   20 novelists? Needs interaction.
      *   No philosophy? Keep terms grounded in craft.
      *   Free will exclusion? Explicitly noted.

  8.  **Constructing the Output:** (Drafting the response with the above logic).
      *   *Structure:*
          1.  The Foundation (What lands first).
          2.  The Anchor Example (The Door).
          3.  The Sequence (Minute-by-minute flow).
          4.  Handling Misconceptions.
          5.  The Grain-Relative Nuance.
          6.  The Board Check.
          7.  The Hard Boundary (Free Will).

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm teaching *them* sphexishness. They know it. I'm teaching them how to *teach* it. Keep the advice meta-pedagogical.
      *Wait, re-reading prompt:* "I dont want the idea explained to me; I want a plan for how to get them there." Okay, so I am the consultant designing the workshop.
      *Crucial adjustment:* The user asked "Which one example should carry the whole session?" I need to give a definitive verdict on the Door Scene.
      *Verdict:* The Door Scene is risky if it's "literary." It needs to be *genre-agnostic*. A thriller character checking a safe that's already empty works too. But since it's *their* scene, they can deliver it with authority. I will advise them to *strip the lyricism* for the exercise.

      *Misconception Timing:*
      *   "Flexible = Unpredictable": Kill this in the first 20 mins.
      *   "Reason = Freedom": Kill this in the middle (The Grain section).
      *   "Not Really Her": Kill this at the end (Character Arc).

      *Grain:* Middle. It's the solution, not the problem.

      *Board Check:* Needs to be a specific distinction. "Script vs. Signal."

      *Let's build the plan.*

      *(Final Polish)*: Ensure the tone is sharp. These are confident novelists. They need to be unsettled, not coddled. The plan should reflect that energy.

      *Wait, one more thing:* The user asked "What has to land first for the rest to have somewhere to sit?"
      *My answer:* They need to admit that **intentionality is not a shield.** They think because their characters *want* things, they are free. They need to see that a want can be a cage.

      *Okay, ready to write.*
answer: |-
  Here is the battle plan for the ninety minutes.

  ### 1. The Foundation: What Must Land First
  You are correct that rigidity is insensitivity to the relevant variable, but that is a *definition*, not a hook. For a room of confident novelists, the first thing that must land is this: **Intentionality is not a shield.**

  They believe their characters are flexible because their characters have motives. You need to break the equation that *Want + Action = Agency*.
  *   **The Hook:** Show them that a character can be highly motivated, highly active, and completely sphexish.
  *   **Why:** If they think sphexishness only applies to "zombies" or "robots," they will dismiss it. They need to see it in their "strong" protagonists.
  *   **The Line:** "A character who pursues a goal despite the world changing the rules of the game isn't determined; they're broken. And if you write them that way on purpose, it's a tragedy. If you do it by accident, it's a bug."

  ### 2. The Anchor Example: The Door Scene
  **Verdict:** Ride your own horse. It is the right example, provided you strip it of "writerly" decoration.

  *   **Why it works:** It is spatial, visceral, and immediate. It doesn't require genre knowledge (like a heist or a romance trope might).
  *   **What it needs:** It must lack interior justification. If she thinks, *"I know he's gone, but I need to feel close to him,"* that is grief, not sphexishness. That is a reason. For it to be sphexish, the thought process must be absent or bypassed. She reaches for the knob because the hallway ended and the knob was there.
  *   **What it must lack:** Lyricism. Do not describe the dust motes or the ache in her chest. Describe the mechanics of the hand, the turn of the wrist, the push. Make it clinical. If you make it beautiful, they will mistake the *aesthetic* for the *agency*.
  *   **Deployment:** Use it three times.
      1.  **Minute 10:** Show the scene raw. Ask: "Is she acting?" (They will say yes).
      2.  **Minute 40:** Reveal the context (the room is empty/useless). Ask: "Is she still acting?" (They will hesitate).
      3.  **Minute 70:** Ask them to rewrite the *end* of the scene so she stops. Not because she changes her mind, but because she *registers the variable*.

  ### 3. The Sequence (90 Minutes)

  **0:00 – 0:15: The Trap of Competence**
  *   **Activity:** Show the Door Scene (stripped down).
  *   **Discussion:** Ask them to list the character's goals. They will find them.
  *   **The Turn:** Reveal the environmental change (the variable she ignores).
  *   **Takeaway:** Agency is not about having a goal; it is about updating the goal when the data changes.

  **0:15 – 0:35: Misconception 1 & 2 (Randomness and Reason)**
  *   **Misconception:** "Flexible means unpredictable/coin-flip."
  *   **Counter:** Show a clip or describe a scene where a character acts randomly (e.g., suddenly burns the house down for no reason). Ask: "Is this flexible?" No, it's noise. Flexibility is *responsive*, not *random*.
  *   **Misconception:** "If she has a reason, she's free."
  *   **Counter:** Use the Door Scene again. She has a reason (habit/memory), but the reason is decoupled from reality.
  *   **Tool:** Introduce the **Feedback Loop**. A free character has a loop: Act $\rightarrow$ World Reacts $\rightarrow$ Character Updates $\rightarrow$ Act. A sphexish character has a line: Act $\rightarrow$ Act $\rightarrow$ Act.

  **0:35 – 0:55: The Grain-Relative Nuance (The Diagnostic Tool)**
  *   **Placement:** Do not save this for late. This is the engine of the workshop. It is how they fix the problem.
  *   **Concept:** Rigidity is often a mismatch of grain.
      *   *Rigid Tactics / Flexible Strategy:* The character changes *how* they fight but not *what* they fight for (The Obsessive).
      *   *Flexible Tactics / Rigid Strategy:* The character changes *how* they fight but never questions *why* (The Fanatic).
  *   **Exercise:** Have them pick a character from their WIP. Identify the Strategy (The Want) and the Tactics (The Plan). Ask: "Where is the break? If the tactic fails, do they change the tactic or the want?"
  *   **Why here:** This moves them from "What is sphexishness?" to "How do I write it (or fix it)?"

  **0:55 – 1:15: Application (The Rewrite)**
  *   **Task:** Take the Door Scene (or their own stuck scene).
  *   **Instruction:** Write two versions.
      1.  **Sphexish:** She walks through the door. The room is wrong. She walks through it anyway.
      2.  **Flexible:** She walks to the door. The room is wrong. She stops. *Why does she stop?* Not because she "decides to," but because she perceives the variable that matters.
  *   **Goal:** Feel the difference in the prose. The sphexish version will feel smoother, more inevitable. The flexible version will have a "hiccup" of processing.

  **1:15 – 1:30: The Board Check & Boundary**
  *   **The Free Will Boundary:** Open this section by saying: "We are not discussing whether free will exists. We are discussing whether the character is plausible. If a character ignores a burning building to finish a sentence, I don't care if they have a soul; I care if they have burn marks. We are writing physics, not metaphysics."
  *   **The Board Check:** Do not ask "Does this make sense?"
  *   **Write this on the board:**
      > **THE VARIABLE TEST**
      > *Identify the one piece of information in your scene that should stop your character.*
      > *If they ignore it: Is it a Flaw (Tragic) or a Bug (Bad Writing)?*
  *   **Requirement:** Before they leave, they must write down one variable from their current manuscript that their protagonist is currently ignoring, and label it "Flaw" or "Bug."

  ### 4. Handling the Misconceptions (Timing & Tactics)

  1.  **"Flexible means unpredictable/random."**
      *   **When:** Minute 20.
      *   **How:** Contrast "Noise" with "Signal." A coin flip is noise. A pivot based on new data is signal. Sphexishness is signal blindness.
  2.  **"The opposite of mechanical is doing it for a reason."**
      *   **When:** Minute 30 (during the Grain section).
      *   **How:** Show that "Because I love him" can be a script just as much as "Because I am a robot." The *content* of the reason doesn't grant freedom; the *responsiveness* of the reason does.
  3.  **"If it's sphexish then it isn't really her acting."**
      *   **When:** Minute 75 (during the Rewrite).
      *   **How:** Reframe sphexishness as a character trait, not an authorial failure. Hamlet is sphexish about vengeance. That makes him tragic, not fake. The problem isn't the rigidity; it's *unintended* rigidity.

  ### 5. The Missing Misconception
  You are not seeing this one: **The "Strong Will" Confusion.**
  Novelists often confuse *stubbornness* with *agency*. They think a character who refuses to yield is "strong."
  *   **The Fix:** Distinguish **Tenacity** (holding course despite resistance) from **Sphexishness** (holding course despite *irrelevance*).
  *   **Example:**
      *   *Tenacity:* The door is locked, so I pick the lock. (Variable acknowledged, obstacle overcome).
      *   *Sphexishness:* The door is gone (wall painted over), so I reach for the knob. (Variable ignored, script executed).
  *   **Where:** Slot this into the **Grain-Relative** section (Minute 40). It clarifies the difference between a "strong character" and a "broken one."

  ### 6. The Board Check (Final Verification)
  You want to know they *got it*, not that they *liked it*.
  **The Board:**
  Draw a simple flowchart.
  `[Goal] --> [Action] --> [World Change] --> [???]`
  **The Test:** Ask them to fill in the `[???]`.
  *   If they write `[Continue Action]`, they have identified Sphexishness.
  *   If they write `[Update Goal/Action]`, they have identified Flexibility.
  *   If they write `[Random Event]`, they have failed the test (Noise).

  **The Exit Ticket:**
  On a slip of paper, have them write:
  *"In my book, [Character Name] is being sphexish about [Variable]. This is a [Bug/Feature]."*
  If they can identify the variable, they understand the concept. If they can classify it as Bug or Feature, they understand the craft application.

  ### 7. What to Refuse (The Free Will Boundary)
  You must draw this line at **Minute 75**, explicitly before the final exercise.
  *   **The Script:** "If you ask me if the character *could have done otherwise* in a metaphysical sense, I will not answer. I am not a priest or a physicist. I am a mechanic. If the car drives off the cliff because the steering wheel is stuck, I don't care about the driver's soul. I care that the steering wheel is stuck. We are fixing the steering wheel."
  *   **Why:** Novelists love to turn craft problems into existential debates to avoid doing the work. Shut this down firmly.

  ### Summary of Critical Adjustments
  1.  **Keep the Door Scene**, but sterilize it of emotion. Make it mechanical so the *lack* of mechanics stands out.
  2.  **Move Grain-Relative to the Middle.** It is the solution, not the complication.
  3.  **Add the "Tenacity vs. Sphexishness" distinction.** This protects their egos about "strong characters."
  4.  **The Board Check** must force them to identify a specific **Variable** in their own work. Abstract agreement is useless.

  This plan respects their expertise while challenging their assumptions, keeps the philosophy practical, and ensures you leave the room with evidence that the work landed.
