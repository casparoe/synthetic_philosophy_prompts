answer: |-
  ### Design Notes & Brainstorming

  The genuine difficulty here is not the physics of hypercomputation, but the *underdetermination of theory by evidence*. Students often treat the Church–Turing Thesis (CTT) as a monolithic claim. To discriminate, the question must force them to fracture CTT into its component normative and descriptive roles. If they treat the "Physical Reading" as identical to the "Methodological Reading," they will fail to see how the thesis could survive the experimental announcement.

  *Candidate Formulation 1:* "Is CTT empirical or analytic? Discuss." *Failure:* Too binary; invites textbook recitation without engaging the specific scenario.
  *Candidate Formulation 2:* "Does the described device refute CTT?" *Failure:* Yes/No trap. A sophisticated candidate should say "It depends on which CTT you mean."
  *Candidate Formulation 3:* "Evaluate the three caveats of the device." *Failure:* Focuses on engineering rather than epistemology.
  *Selected Formulation:* Integrate the scenario with the three specific readings (Classificatory, Physical, Methodological) and ask for a differential analysis of the threat level to each, culminating in a verdict on the thesis's pre-existing epistemic status. This forces the candidate to use the framework, not just name-drop it.

  ***

  ### Graduate Seminar: Philosophy of Computation
  **Final Take-Home Examination**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should be self-contained; do not rely on external citations. Clarity of argument and precise use of the provided definitions are prioritized over technical breadth.

  **Question:**

  Consider the following scenario. An experimental group announces they have built a device that measures a non-Turing-computable function (specifically, the halting predicate). The device exploits a spacetime region where a subsystem performs infinitely many discrete operations within finite elapsed proper time. However, three caveats apply:
  1.  **Unverifiability:** The device is single-shot per input. No Turing machine can confirm the output except in cases where the answer is already computable by standard simulation.
  2.  **Degradation:** Reliability degrades above a certain input size, attributed by the team to engineering noise rather than a principled limit.
  3.  **Finite Consistency:** Every finite log of input-output pairs the device could produce is consistent with a standard Turing machine carrying a sufficiently large lookup table.

  In this seminar, we distinguished three readings of the Church–Turing Thesis (CTT):
  *   **Classificatory:** CTT analyses the intuitive notion of "effective calculability" (what a human following rules can do).
  *   **Physical:** No physically realizable system can compute functions beyond the Turing-computable.
  *   **Methodological:** CTT licenses the practice of moving from informal algorithms to formal machines and treating computability as univocal across formalisms.

  **Task:**
  Write an essay addressing the following:
  1.  Does the announced device threaten the **Classificatory**, **Physical**, and **Methodological** readings equally? Explain why the threat level differs across them.
  2.  Given Caveat 3 (Finite Consistency), is the device genuinely *computing* a function, or merely instantiating a natural regularity we are interpreting as computation? How does this distinction affect the threat to CTT?
  3.  Based on your analysis, what was the epistemic status of CTT *before* this announcement (e.g., empirical law, definition, regulative principle)? Could a rational agent consistently believe the **Physical** reading is false while continuing to rely on the **Methodological** reading? Justify your answer.

  ***

  ### Model Answer (Approx. 750 words)

  The announced device does not threaten the three readings of the Church–Turing Thesis (CTT) equally; indeed, it illuminates that they are distinct claims with distinct epistemic vulnerabilities. The **Classificatory Reading** is largely insulated from this scenario. This reading concerns the analysis of human effective procedure—what a finite agent can do following rules without insight. Since the device relies on exotic spacetime structures and infinite operations within finite time, it does not model human calculation. Unless the proponents claim humans can access these spacetime regions, the intuitive notion of "effective calculability" remains untouched. The thesis here functions as a conceptual analysis; physical anomalies do not refute conceptual equivalences unless the concept itself is natural-kind based, which is contested. *[Note: This assumes the Classificatory reading is conceptual rather than empirical. A candidate arguing it is empirical based on cognitive science constraints would also earn credit if argued coherently.]*

  The **Physical Reading**, however, is directly targeted. This reading asserts a law of nature: no physical system computes beyond Turing limits. The device claims to be a physical counterexample. Yet, Caveats 1 and 3 introduce a severe epistemic barrier. Because every finite output sequence is consistent with a lookup table (a Turing machine), the "hypercomputation" is empirically underdetermined. We cannot distinguish a true oracle from a finite simulator with a large pre-loaded table based on finite data. Consequently, while the Physical Reading is *falsifiable* in principle (it makes a universal claim about physical systems), it is not *verifiable* in this instance. The device puts the Physical Reading in trouble only if we accept the team's theoretical explanation over the lookup-table hypothesis. If we treat CTT-Physical as an empirical law, this evidence is ambiguous; if we treat it as a metaphysical constraint on what counts as "physical computation," the device might be dismissed as measuring a natural regularity rather than performing a computation.

  This leads to the distinction between *computing* and *instantiating a regularity*. Computation typically implies a manipulable process where inputs are processed via discrete states to produce outputs. If the device is a "black box" relying on unanalyzable physics (Caveat 1), it resembles an oracle more than a computer. If the internal mechanism cannot be replicated or verified, calling it "computation" may be a category mistake. It may simply be a physical system whose behavior *correlates* with the halting function, much as a falling rock "computes" a trajectory without being a computer. If it is merely a regularity, the Physical Reading of CTT remains intact: no *computing system* exceeds Turing limits; rather, some *physical systems* exhibit non-Turing behaviors that we cannot harness as algorithms.

  The **Methodological Reading** is the most robust. This reading justifies the mathematical practice of identifying informal algorithms with Turing machines. Even if the Physical Reading is false (i.e., hypercomputers exist), the Methodological Reading survives provided hypercomputation is not *effectively accessible*. Since the device is single-shot and unverifiable, it cannot be integrated into the standard practice of algorithm design. Mathematicians cannot use it to prove theorems in the standard way because they cannot check the proofs. Therefore, the license to treat informal algorithms as Turing-computable remains valid for all *effective* practices. A rational agent can consistently reject the Physical Reading (accepting hyperphysical phenomena exist) while retaining the Methodological Reading (maintaining that effective mathematics is Turing-bound).

  This differential vulnerability reveals the pre-announcement epistemic status of CTT. It was not a simple empirical law, nor a pure definition. It functioned primarily as a **regulative principle** for the methodology of computer science and logic, underpinned by a contingent empirical belief (the Physical Reading) that the universe cooperates. The scenario shows that the Methodological and Classificatory readings are normative/conceptual, while the Physical reading is empirical. The fact that finite evidence cannot discriminate the device from a lookup table suggests that the Physical Reading is not easily testable, reinforcing the view that CTT's core stability lies in its Methodological role. The thesis survives not because hypercomputation is impossible, but because hypercomputation, as described, falls outside the scope of *effective* procedure that the thesis was designed to govern. *[Note: The view that CTT is primarily regulative is widely held but contested; some argue it is a straightforward empirical conjecture. Credit should be given for either stance if the distinction between the readings is maintained.]*

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Differential Threat Analysis (5 Marks)**
  *   **5 (A):** Explicitly distinguishes the vulnerability of the three readings. Identifies Classificatory as insulated (human-centric), Physical as targeted but epistemically blocked, and Methodological as robust (practice-centric).
  *   **3-4 (B):** Identifies differences but conflates Physical and Methodological threats (e.g., claims if Physical is false, Methodological must be).
  *   **0-2 (C):** Treats CTT as a monolithic claim; argues the device refutes "CTT" generally without distinction.
  *   *Common Error:* Assuming the Classificatory reading is refuted by physical hypercomputation.

  **2. The Lookup Table / Underdetermination Problem (5 Marks)**
  *   **5 (A):** Uses Caveat 3 to argue that the device is empirically indistinguishable from a Turing machine with a large table, making verification of "hypercomputation" impossible on finite data.
  *   **3-4 (B):** Mentions the lookup table issue but fails to connect it to the epistemic status of the Physical Reading (falsifiability vs. verifiability).
  *   **0-2 (C):** Ignores Caveat 3 or treats the device's claim as factually established despite the caveat.
  *   *Common Error:* Treating the device's announcement as a proven fact rather than a claim subject to the lookup-table alternative.

  **3. Computation vs. Natural Regularity (5 Marks)**
  *   **5 (A):** Argues that without manipulability/verification, the process may be a physical correlation rather than "computation," preserving the Physical Reading of CTT.
  *   **3-4 (B):** Distinguishes the two but does not explain how this distinction saves the Physical Reading.
  *   **0-2 (C):** Assumes any physical system mapping inputs to outputs counts as "computation."
  *   *Common Error:* Failing to question whether the device counts as a *computer* rather than just a physical object.

  **4. Independence of Readings (5 Marks)**
  *   **5 (A):** Coherently argues that one can reject the Physical Reading while keeping the Methodological Reading (because the device is not *effective*).
  *   **3-4 (B):** Argues they are independent but provides weak justification for why Methodological practice remains unchanged.
  *   **0-2 (C):** Claims that if Physical is false, Methodological must be abandoned.
  *   *Common Error:* Believing that the existence of hypercomputers invalidates standard algorithmic practice.

  **5. Epistemic Status Verdict (5 Marks)**
  *   **5 (A):** Concludes CTT is primarily a regulative/methodological principle with an empirical component, explaining why finite evidence doesn't settle it.
  *   **3-4 (B):** Labels it "empirical" or "definitional" without nuance regarding the regulative role.
  *   **0-2 (C):** Labels it a "mathematical theorem" or purely "analytic."
  *   *Common Error:* Reciting the standard "it's not a theorem" line without engaging with the regulative/empirical hybrid nature revealed by the scenario.

  **General Grading Note on Contestability:**
  *   **Settled:** CTT is not a mathematical theorem; the three readings are distinct categories.
  *   **Contested:** Whether the Classificatory reading is conceptual or empirical; whether CTT is primarily regulative or empirical.
  *   **Instruction:** Candidates lose no marks for arguing the Physical Reading *is* straightforwardly empirical and has been falsified by the scenario, *provided* they acknowledge the underdetermination problem (Point 2) and explain why they prioritize the empirical claim over the methodological utility. The A/B distinction rests on the *nuance of the argument*, not the specific metaphysical conclusion.
