answer: |-
  The vibration of the *Palinode* was usually a comfort, a constant hum against the silence of the void. Today, to Elara, it sounded like a countdown.

  She spread the checksum tables across the Keeper's desk. The paper was thin, synthetic, smelling of old ozone. "Look at the hull-splice intervals," she said. Her voice trembled. "Century four through six. Standard addition."

  Keeper Kael didn't look up from the luminous globe spinning slowly between them. "We know the intervals, Elara. We live by them."

  "But look at the threshold," she insisted, tapping a column of figures. "No calculation in the ship's history has ever exceeded ten thousand cycles. The Reckonings tell us to add the decay rate to the base tolerance. For every number we have ever encountered, adding works. But..." She slid a second sheet over the first. "This function works too. It matches addition perfectly up to ten thousand. After that, it adds a constant variance. A drift."

  Kael finally looked. His eyes were clouded with cataracts, common among those who spent too long staring into the void. "A drift?"

  "Enough that when we hit the ninth century splice," Elara said, "the hull doesn't seal. It shears."

  Kael stood up, the joints of his exosuit clicking. "Then we check the Charter. The founding archive."

  They went down to the vault. The air was colder here, preserved. The Charter of Sameness sat in a vacuum case, a single sheet of polymer from Earth. It bore the instruction: *Maintain integrity by summing the decay.*

  Elara pointed to the symbol for *summing*. It was a cross, two lines intersecting. "It says sum. It means addition."

  "Does it?" Kael asked. He ran a gloved finger over the glass, not touching the paper. "When the Founders wrote 'sum,' they used a language we learned from them, who learned it from their teachers. The symbol is just ink. To know it means addition and not your deviant function, we have to know how *they* meant the symbol to be taken. But their meaning isn't in the ink."

  "It's in the practice," Elara said. "They trained the first Keepers."

  "And the first Keepers trained the next," Kael said. "Every act of training was just more behavior. More marks on paper. More sounds. If our current practice fits your deviant function just as well as addition, then the Founders' practice fits it too. There is no record outside the practice to judge the practice."

  Elara felt the hum of the ship deepen in her bones. "So there's no fact of the matter? We could be wrong, and there's no truth to it?"

  "There is no fact about what they *meant* that stands outside what they *did*," Kael said. "And what they did stops at ten thousand cycles."

  They returned to the command deck. Tomas, the Chief Engineer, was waiting. He was a man of torque and tension, uncomfortable with metaphysics. "So fix it," he said. "Recalculate the splice."

  "Which calculation?" Elara asked. "Addition or the Bend?"

  "Addition, obviously," Tomas said. "It's simpler. It's what we're disposed to do. If you ask any crewman to add two numbers, they'll add them. Nobody feels like adding the variance."

  Kael shook his head. "Dispositions are predictions, Tomas, not justifications. You are disposed to say 'one hundred and four' when asked 'two plus two.' But if you had never counted past ten thousand, you have no disposition for numbers beyond that. You have never been there."

  "But it feels natural," Tomas argued, slamming a hand on the console. "The Bend feels... crooked. Addition is straight."

  "The Bend is just as simple mathematically," Elara said softly. "It's just a different straight line that bends later. Why is your feeling of 'natural' a guarantee of truth? Maybe we are all disposed to make the same mistake. If the ship falls apart, our dispositions won't save us."

  Tomas looked away. The silence stretched. The ship hummed, indifferent to their logic.

  Elara closed her eyes. She tried to reach back into her own mind, to the moment she learned the Reckonings. She remembered the Keeper showing her the tables, the feeling of clarity when the pattern clicked. "I know what I meant," she said. "When I learned 'add,' I grasped something. A state of understanding. It wasn't just behavior. I saw the rule."

  Kael leaned in. "What did you see, Elara? A picture? A formula?"

  "A feeling of necessity," she said. "Like a rail stretching out into the future. I saw that this step *had* to follow that one."

  "But a feeling is just another event in your head," Kael said gently. "It happens once. The rule has to apply forever. How does a momentary feeling dictate what you do ten years from now on a number you've never seen? You can interpret the feeling to mean addition, or you can interpret it to mean the Bend. The feeling itself doesn't speak."

  Elara opened her eyes. The rail she had felt in her mind vanished. She was standing on a precipice with no ground beneath her feet. There was no fact in the archive, no fact in their habits, no fact in her soul that guaranteed the next step. The Charter of Sameness claimed the Reckonings were unchanged, but "unchanged" was just a word they were using now, subject to the same ambiguity.

  "So we stop?" Tomas asked. His voice was small. "We don't splice the hull?"

  "If we stop, we die now," Kael said. "If we choose the Bend, we might die later. If we choose Addition, we might die later."

  "We have to choose," Elara said.

  "On what basis?" Tomas demanded. "If there's no fact..."

  "Then we make the fact," Kael said.

  He turned to the crew gathered in the shadows of the deck. They were frightened. They wanted the Founders to speak, but the Founders were silent ink. They wanted their own minds to be solid ground, but their minds were mist.

  "The Charter says we preserve the Reckonings," Kael announced. "It does not say the Reckonings preserve us. We are the Keepers. Not because we hold the truth, but because we hold each other."

  He looked at Elara. "We will proceed with Addition. Not because it is written in the stars or in the vault. But because if you calculate differently, I will correct you. And if I calculate differently, you will correct me. That correction is the only reality we have."

  "It's just agreement," Elara said. "It could be wrong."

  "It is all we have," Kael said. "Sameness isn't a mirror of the past. It's a promise to the future. We agree to go on in this way. That is what 'following a rule' is. Not seeing the rail, but laying the track as we walk."

  Elara looked at the tables. The numbers stared back, innocent and ambiguous. She picked up her stylus. She could write the variance. She could write the sum. The ink would look the same. The difference was only in what the crew would do next.

  She wrote the sum.

  Tomas let out a breath he had been holding. The tension in the room didn't vanish, but it shifted. It was no longer the anxiety of discovery, but the weight of responsibility. They were not uncovering a law; they were enacting one.

  "Certify the calculation," Kael said to Elara.

  "I certify it," she said.

  "And I certify you," Kael replied.

  They stood together in the hum of the *Palinode*, bound not by the dead hand of the Founders, but by the living tension of their mutual expectation. The ship moved on into the dark, carrying no guarantee of safety, only the agreement to steer.
