  1.  **Analyze the Request:**
      *   **User Persona:** Retired physicist, familiar with technical concepts (noise, bandwidth, carrier waves, etc.), interested in philosophy of mind.
      *   **Topic:** The Radio Receiver Analogy for consciousness (brain tunes into external consciousness field).
      *   **Task:** Audit the analogy explicitly, mapping components (transmitter, carrier, antenna, tuner, speaker, listener), identifying breakdowns (noise, damage, etc.), and evaluating two specific conclusions (survival after death, AI incapacity).
      *   **Specific Output Format 1:** A table with columns: Analogy element, Brain/consciousness counterpart, Does it map? (yes/partial/no), Critical disanalogy, Undermines conclusion?
