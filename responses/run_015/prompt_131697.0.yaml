      *   *Carrier Wave:* The medium. Problem: No physical medium identified (unlike EM field).
      *   *Antenna:* Neural structures? Problem: Brains grow/evolve; antennas are engineered.
      *   *Tuner:* Attention/Thalamus? Problem: Tuning is selective, consciousness seems generative.
      *   *Speaker:* Motor output/Behavior? Problem: Speakers vibrate air; brains produce electrochemical states.
