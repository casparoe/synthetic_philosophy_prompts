answer: |-
  You are grappling with the central methodological crisis in the current literature on democratic erosion. Your supervisor is posing a sophisticated version of the "formalist trap": if democracy is defined by institutions, and the institutions look the same, how can the regime type be different?

  Your intuition is correct: the meaning of an institutional rule is not intrinsic; it is relational. A rule's democratic quality is determined by its **systemic function**, not its **formal text**.

  Here is a conceptual breakdown to help you name the phenomenon, distinguish it from nearby concepts, and defend the "trajectory" against the charge of partisanship.

  ### 1. Naming the Move: "Rule Laundering"

  Your candidate term, **Rule Laundering**, is analytically sound and rhetorically precise. You should keep it, but define it technically to avoid it sounding like a mere slur.

  **Definition:** Rule Laundering is a legitimation strategy wherein an actor justifies a institutional change in a weakening democracy by citing its formal existence in a consolidated democracy, while systematically obscuring the *functional non-equivalence* caused by differing contextual constraints.

  It is not simply "lying." It is a specific type of **decontextualized formalism**. The launderer relies on the observer's cognitive bias to treat institutions as modular blocks (like Lego bricks) rather than interdependent organs (like a heart in a human vs. a heart in a frog).

  **Why it works:** It exploits the "availability heuristic." The observer sees "Judicial Retirement Age" in Country A and Country B. Because Country B is a democracy, the rule is tagged "Democratic." The tag transfers to Country A, masking the fact that in Country A, the executive controls the replacement mechanism, whereas in Country B, an independent commission does.

  **Refining the "Swap Test":**
  You worried the swap test is circular or unfalsifiable. It becomes falsifiable if you stop asking about *behavior* (which is counterfactual) and start asking about *incentive structures*.
  *   **Bad Swap Test:** "If Germany did this, would they become autocratic?" (Unfalsifiable).
  *   **Good Swap Test:** "Does this rule, *given the existing distribution of veto players and enforcement mechanisms in the borrower country*, reduce the cost of incumbent entrenchment more than it would in the lender country?"
  This is measurable. You count veto players. You measure media concentration. You measure the independence of the appointing body. If the rule bypasses more veto players in the borrower country than the lender country, the laundering fails.

  ### 2. Analytical Machinery from Other Fields

  You asked for machinery from law or antitrust. There is a direct parallel here that you can import without needing a bibliography.

  **Antitrust: *Per Se* vs. *Rule of Reason***
  In antitrust law, some acts are illegal *per se* (price-fixing). Most acts, however, are judged under the **Rule of Reason**. Under the Rule of Reason, a practice that looks anti-competitive (like exclusivity contracts) is legal *unless* it harms competition *in the specific market context*.
  *   **Application:** Democratic backsliding should not be judged by *per se* rules (e.g., "changing court size is bad"). It must be judged by a **Democratic Rule of Reason**. The question is not "Is this rule on the books elsewhere?" but "Does this rule, in this specific market of political competition, substantially lessen the contestability of power?"

  **Criminal Law: *Mens Rea* (Guilty Mind)**
  The act of handing someone money is neutral. It becomes a bribe based on *intent* and *quid pro quo*.
  *   **Application:** Institutional changes are the *actus reus* (guilty act). The "direction of travel" your supervisor dismisses is the *mens rea*. If the sequence of changes systematically aligns to protect the incumbent from electoral loss, the *mens rea* is entrenchment. If the changes are scattered or increase incumbent vulnerability, the *mens rea* is reform. You can infer intent from the *pattern* of acts, just as a prosecutor does.

  **Environmental Law: Cumulative Impact Assessment**
  One factory dumping waste might be legal. Ten factories doing the same might kill the river.
  *   **Application:** You cannot judge a single slice of salami in isolation. You must judge the **cumulative impact on the ecosystem of accountability**. A single change to observation rules might be neutral. That change + gerrymandering + media capture creates a toxic cumulative load that a single measure misses.

  ### 3. Distinctions: What It Is and Is Not

  To sharpen your chapter, you must clearly boundary this concept against the confusions your supervisor is highlighting.

  **Vs. Whataboutism (*Tu Quoque*)**
  *   **Whataboutism:** "You criticize my court packing, but your courts are also flawed." (Attacks the *critic's standing*).
  *   **Rule Laundering:** "My court packing is democratic because Germany has a similar statute." (Attacks the *classification of the act*).
  *   **Difference:** Whataboutism changes the subject to the accuser. Rule Laundering keeps the subject on the rule but strips it of context.

  **Vs. Salami Slicing**
  *   **Salami Slicing:** The *tactic* of gradual erosion to avoid detection.
  *   **Rule Laundering:** The *rhetorical defense* used to justify each slice.
  *   **Difference:** Salami slicing describes the *process* of change. Rule laundering describes the *legitimation* of that change. You can have salami slicing without laundering (e.g., an open coup), and laundering without slicing (e.g., passing one massive "anti-terror" law that mimics foreign statutes).

  **Vs. Good-Faith Comparative Argument**
  *   **Good-Faith Comparison:** "Country X has this rule, and here is how their surrounding institutions (appointments, review, culture) ensure it remains democratic. We propose adopting the rule *and* the safeguards."
  *   **Rule Laundering:** "Country X has this rule. Therefore, our adoption of it is democratic." (The safeguards are omitted).
  *   **Boundary Case:** If the defender acknowledges the contextual differences but argues they are irrelevant to *this specific rule*, that is a substantive argument, not laundering. Laundering requires the *implicit claim* that context doesn't matter.

  ### 4. The Supervisor's Challenge: What is a "Trajectory"?

  Your supervisor's deeper point is the most dangerous: if the object of judgment is a "direction of travel," isn't that just a partisan vibe? If we can't point to a specific rule, aren't we just saying "I don't like this government"?

  You can rescue the concept of trajectory from partisanship by defining it structurally rather than normatively.

  **Trajectory as "Incumbent Advantage"**
  Do not define trajectory as "moving away from liberal values." Define it as **"The reduction of ex-ante uncertainty regarding electoral turnover."**
  *   In a democracy, the outcome of an election is uncertain before it happens.
  *   In an autocracy, the outcome is certain.
  *   **Backsliding** is the measurable process of reducing that uncertainty *in favor of the current incumbent*.

  **Who gets to say?**
  Not the observer's "likes." The observer measures the **margin of safety**.
  *   Did the redistricting make the seat safer for *this* party, or for *any* incumbent? (Partisan gerrymander vs. incumbency protection).
  *   Did the court expansion happen *after* a specific ruling against the government? (Timing indicates intent).
  *   Is the change reversible? (If the rule requires a supermajority to undo that the opposition cannot reach, it locks in advantage).

  **Is it Partisan?**
  It is only partisan if the observer applies the standard asymmetrically. If you judge the US, Hungary, and Turkey by the same metric of "reduction in electoral uncertainty," the label is not partisan.
  *   **The Trap:** If you call it backsliding only when *your* preferred party loses, it is partisan.
  *   **The Rescue:** If you call it backsliding when *any* incumbent uses state resources to lower the probability of their own removal, it is structural.

  **The Object of Judgment**
  Your supervisor says it's not the rule, and not the package. She is right. The object of judgment is the **Sequence of Moves**.
  *   A single move is ambiguous.
  *   A sequence of moves that all point in the same functional direction (centralizing power, reducing oversight, insulating from voters) constitutes a trajectory.
  *   **Analogy:** In medicine, a single symptom (fever) is not a diagnosis. A cluster of symptoms (fever, rash, cough) is a syndrome. Backsliding is a **Constitutional Syndrome**. You diagnose the syndrome, not the symptom.

  ### 5. Summary for Your Chapter

  You can structure your argument around these three conceptual pivots:

  1.  **The Tactic:** Name the defender's move **Rule Laundering**. Define it as the strategic decontextualization of institutional forms to mask functional divergence.
  2.  **The Method:** Adopt a **Democratic Rule of Reason**. Reject *per se* judgments of rules. Judge rules by their marginal impact on contestation within the specific ecosystem of veto players.
  3.  **The Object:** Define **Trajectory** not as a moral judgment, but as a measurable reduction in **electoral uncertainty** for the incumbent. This moves the debate from "Is this rule democratic?" (which invites laundering) to "Does this sequence of rules make it harder for the voters to fire the government?" (which defeats laundering).

  Your supervisor is warning you that "backsliding" can become a bucket for "things I dislike." You empty the bucket of partisanship by filling it with **structural metrics of entrenchment**. If the "direction of travel" is defined as "toward lower electoral uncertainty," then it is an empirical claim, not a partisan one. And if it is an empirical claim, it can be tested, falsified, and defended against the charge of mere prejudice.
