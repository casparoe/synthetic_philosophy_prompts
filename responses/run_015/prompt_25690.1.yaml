      *Drafting final:*
      This is a classic Sorites Paradox applied to phylogeny. The argument is valid, but unsound. The error lies in Premise (1).

      Premise (1) assumes bivalence: it demands that for any adjacent pair, the statement "X is conscious" has a determinate truth value that must match its neighbor. This treats "consciousness" as a precise predicate akin to "integer." It is not. Consciousness is likely a vague concept applied to a continuous physical reality.

      You should reject (1). The cost is accepting indeterminacy. For organisms in the middle of the chain (perhaps early vertebrates or complex invertebrates), it may be neither true nor false that they are conscious. This is not arbitrariness; it is an acknowledgment that our concepts have penumbras. Just as there is no specific hair whose removal makes a man bald, there may be no specific mutation that ignites consciousness. Rejecting (1) blocks the transitivity in (3) without requiring a magical threshold.

      This diagnosis preserves your fixed points: humans are determinately conscious, sponges are determinately not. The contradiction in (6) dissolves because the chain of truth values is broken in the indeterminate middle. You avoid panpsychism (sponges conscious) and illusionism (humans unconscious).

      The "cheap trick" worry stems from thinking that rejecting (1) forces you to draw a sharp line elsewhere. It doesn't. It forces you to admit that nature doesn't always conform to binary categories. The cost is metaphysical modesty: you must live with the fact that for some creatures, consciousness is not a yes/no question. This is less costly than denying the reality of consciousness or attributing it to entities devoid of nervous systems. The argument highlights the limits of language, not a paradox in nature.

