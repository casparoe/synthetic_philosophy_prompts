answer: |-
  The slogan is a liability boundary masquerading as a technical constraint, and it settles nothing here until you explicitly define who owns the risk of autonomous action.

  1.  **The Assistance Reading:** "A tool amplifies human capability, while an agent replaces human action."
      *   **Tag:** Trivial
      *   **Verdict:** Gets your colleague his conclusion (overnight PRs replace action), but offers no criteria to distinguish them.
      *   **Usage:** This is the platitude everyone nods at; it feels true but does no work because "amplify" and "replace" are undefined in this context.

  2.  **The Approval Reading:** "A tool requires explicit human confirmation for every external state change, whereas an agent acts on delegated intent."
      *   **Tag:** Defensible
      *   **Verdict:** Gets your colleague his conclusion (overnight PRs lack per-action confirmation).
      *   **Usage:** This is likely the operational definition they are reaching for; it does the work they think it does if you define "external state change" as "opening a PR," but fails if "pre-approved scope" counts as confirmation.

  3.  **The Liability Reading:** "A tool places full responsibility for outcomes on the user, while an agent implies the builder shares responsibility for the system's choices."
      *   **Tag:** Defensible
      *   **Verdict:** Gets your colleague his conclusion (if the company refuses to share liability for autonomous code).
      *   **Usage:** This is the actual driver of the argument disguised as architecture; it does the work they think it does only if legal/leadership agrees the company cannot absorb agent-level risk.

  4.  **The Relational Reading:** "A tool is defined by step-by-step human drive, while an agent is defined by goal-level human delegation."
      *   **Tag:** Defensible
      *   **Verdict:** Does not get your colleague his conclusion (the system is identical; only the management contract changes).
      *   **Usage:** This is your reading; it is rarely reached for in engineering rooms because it shifts the debate from code to org design, which is harder to resolve.

  5.  **The Determinism Reading:** "A tool behaves predictably based on input, while an agent behaves probabilistically based on environmental feedback."
      *   **Tag:** False
      *   **Verdict:** Does not get your colleague his conclusion (LLMs are probabilistic regardless of label).
      *   **Usage:** People reach for this to signal "scariness" or "unboundedness," but it is technically empty for AI products and cannot sustain a shipping decision.

  Your "relation, not property" idea is a real and respected position in HCI and sociotechnical systems theory, often called "distributed agency" or "agency as attribution." It is not confused; it correctly identifies that autonomy is a contract between user and system, not a switch in the weights. However, in a shipping meeting, this reading is dangerous because it dissolves the technical boundary your colleagues are trying to build; if you use it, you must immediately propose a new boundary (e.g., an SLA or liability waiver) to replace the one you just debunked, or you will be accused of dodging the decision.
