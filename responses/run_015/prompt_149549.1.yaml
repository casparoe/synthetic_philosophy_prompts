      *   **Audience:** Split. Half Buddhist meditators (know aggregates, *anatta*), half analytic philosophers (personal identity experts). Both groups are skeptical of metaphysical fluff.
      *   **Constraint 1 (Philosophical Work):** Mourning as *upaya* (skillful means). We construct a self for the dead temporarily for compassion, then let it dissolve.
      *   **Constraint 2 (Tone):** Real literature, not a lecture. About 4 minutes spoken (approx. 500-600 words).
      *   **Constraint 3 (The Slip):** She must confuse *skandha* with *skhanda* (a verbal slip from her notes) once.
      *   **Constraint 4 (No Textbook):** Don't explain the five aggregates explicitly. No citations.
      *   **Goal:** Make both sides feel a little uneasy (philosophers might feel the construct is too illusory, Buddhists might feel the construct is too substantial), but ultimately land the emotional truth.

  2.  **Determine the Voice and Rhythm:**
      *   The voice needs to be intimate but precise. She knows the material, but she's grieving.
      *   It shouldn't sound like a paper read at a conference, but it can't sound like a generic sermon either.
      *   The pacing should allow for pauses, for the weight of the ideas to settle.
      *   Word count check: Average speaking rate is ~130-150 words per minute. 4 minutes = 520-600 words.

  3.  **Drafting - Section by Section:**

