answer: |-
  Thank you for coming. I know this room is heavy with things we cannot say.

  Half of you spent decades debating him about the logic of identity. The other half sat silently behind him, watching the breath. He taught both of us that the person is a fiction. A center of narrative gravity, he called it. A useful illusion. A shimmer on the road.

  So we are left with a difficult question. How do you mourn a mirage?

  If I tell you he is watching us now, I lie to the meditators. If I tell you he has simply ceased, I lie to the family. And he would hate both lies. He spent his life dismantling the prisoner of the skull, but he never dismantled the kindness.

  So here is what I think we are doing today. We are not gathering to honor a soul that persists. We are gathering to practice a specific kind of generosity.

  Compassion requires an object. Love needs a face. Even if the face is made of memory and the love is a chemical storm, the suffering of loss is real. The pain in this room is not an illusion. It is the friction of a habit meeting a void. We are used to him being here. The world expects him to answer. When he does not, the silence hurts.

  So, for this hour, we are going to do something he would have recognized as skillful means. We are going to build him.

  We are going to take the scattered parts—the way he held a teacup, the stubborn set of his jaw, the specific cadence of his laugh—and we are going to weave them into a person. We will construct a self out of sentences. We will place him in this coffin, not because his body is him, but because we need a place to put our grief.

  In the texts, we talk about the five *skhandas*—sorry, the five *skandhas*—the piles of stuff we mistake for a self. Form, feeling, perception. We are doing that now. We are piling them up. We are making a ghost out of habit.

  And it is okay. It is necessary.

  But I ask you, as we do this, that we do not forget the second half of the practice. We build the statue so that we can learn to walk around it. We hold the story tightly so that, eventually, we can bear to open our hands.

  He is not gone, because there was never anyone there to leave. But the story is ending. The narrative gravity is releasing its hold.

  Let us mourn him fully. Let us love the fiction, because the love is real. And when we walk out of these doors, let us let him go. Not into the light, not into the dark. But into the silence he loved so much.

  Rest now. The story is done.
