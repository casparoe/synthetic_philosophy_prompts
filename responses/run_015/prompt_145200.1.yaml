          *   Human Hand-off (Values questions).
          *   Apply the procedure to three specific cases (Maternal Death Map, Vaccination Dashboard, Free Care Leaflet).
          *   Give "unwelcome answers" (no compromise).
          *   Distinguish Neurath's actual rules from AI extrapolation (screens, audio, interactivity).
          *   Identify where the procedure might misfire.
          *   State confidence levels.
          *   Single out the least certain claim.

  2.  **Deconstruct Neurath/ISOTYPE Principles vs. Modern Context:**
      *   *Neurath's Core:* Transformation of statistics into pictures. Education for the masses. International understanding.
      *   *Rule 1: Quantity.* ISOTYPE uses isotypes (identical symbols) repeated to show amount. *Modern conflict:* Heat maps, sized bubbles, continuous scales.
      *   *Rule 2: Perspective.* Flat, 2D. No 3D distortion. *Modern conflict:* 3D charts, perspective maps.
      *   *Rule 3: Symbols.* Conventions, not naturalistic. Need a legend/key. *Modern conflict:* Intuitive icons vs. standardized library.
      *   *Rule 4: Text/Image Relation.* "Picture language is a helping language." Cannot express negation/conditionals well. *Modern conflict:* Infographics that try to replace text entirely.
      *   *Rule 5: Fuzziness.* Categories are social constructs. *Modern conflict:* Precise data boundaries vs. lived reality.
      *   *Modern Extrapolations:* Interactivity (Neurath didn't have this), Audio (Neurath focused on visual), Screens (dynamic vs. static print).

  3.  **Drafting the Pass/Fail Procedure:**
      *   Need to be actionable for a team with 30 mins/graphic.
      *   Needs to be strict (Pass/Fail).
      *   Structure: Order of operations (Logic -> Visual Encoding -> Accessibility -> Values).

      *   *Step 1: The Logic Check (Text/Image relation).* Can the picture stand alone? If no, is the text supporting it? Can it handle negation/conditionals?
      *   *Step 2: The Quantity Check (Isotype rule).* Are magnitudes shown by number or size?
      *   *Step 3: The Perspective/Dimension Check.* Is it 2D?
      *   *Step 4: The Convention Check.* Are symbols consistent?
      *   *Step 5: The Fuzziness Check.* Are categories presented as absolute truth or social constructs?
      *   *Step 6: The Human Hand-off.* Where do we stop? (Ethics, Policy, Risk).

  4.  **Applying to the Three Cases:**

      *   *Case 1: Maternal Death Map (Choropleth/Bubble).*
          *   Neurath View: Sized circles = Fail (magnitude by size). Red ramp = Fail (continuous color implies precision where there might be fuzziness/uncertainty). Map perspective = Potential Fail (geography vs. data).
          *   Verdict: **FAIL.** Needs isotypes or bar charts.

      *   *Case 2: Vaccination Dashboard (Interactive).*
          *   Neurath View: Interactivity is unknown territory. Rescaling axes = Dangerous (allows manipulation/misinterpretation). Filtering = Okay if categories are clear.
          *   Verdict: **FAIL** on user-rescaling (violates "transformer" role of the designer). **PASS** on filtering if symbols are consistent.

      *   *Case 3: Free Care Leaflet (Conditionals).*
          *   Neurath View: "If pregnant OR over 65 OR chronic." This is logic (conditionals/negation). Neurath explicitly said pictures can't do this well.
          *   Verdict: **FAIL** on picture-first. Must be text-first with picture support.

  5.  **Refining the "Unwelcome Answers":**
      *   The user wants honesty, not compromise.
      *   If Neurath says "No sized circles," I must say "No sized circles," even if it's standard practice.
      *   If Neurath says "No conditionals in pictures," I must say "Don't do picture-first for eligibility."

  6.  **Addressing the Meta-Requirements (Confidence, Extrapolation, Misfire):**
      *   *Extrapolation:* Interactivity and Audio are definitely not Neurath. I need to label those.
      *   *Misfire:* 30 mins/graphic is very fast. ISOTYPE took a long time to design. The "fuzziness" rule might conflict with medical precision (epidemiology needs precise case definitions).
      *   *Confidence:* High on the visual rules (size vs. count). Lower on the audio/interactive translation.
      *   *Least Certain:* How to apply "fuzziness" to medical case definitions (e.g., "chronic condition" needs a precise medical definition for eligibility, even if the social concept is fuzzy).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, direct, respectful of the constraints (30 mins, low literacy).
      *   *Structure:*
          1.  The Procedure (The "ISOTYPE Gate").
          2.  The Application (The three cases).
          3.  The Caveats (Neurath vs. AI extrapolation, Misfires, Confidence).
      *   *Self-Correction during drafting:* I initially thought about passing the dashboard if it has guards. But Neurath was about the *transformer* controlling the message to ensure truth. User-rescaling abdicates that responsibility. I should mark that as a Fail or at least a Warning. Let's make it a Fail for the specific feature of *user-rescaling* because it breaks the standardized comparison.
      *   *Audio:* Neurath didn't do audio. I need to invent a rule based on his "helping language" principle. Audio shouldn't just read the chart; it should explain the *convention*.
      *   *Time Constraint:* 30 minutes is the biggest hurdle. ISOTYPE was labor-intensive. I need to acknowledge that this procedure might slow them down initially but save sign-off time later.

  8.  **Final Review against constraints:**
      *   Pass/Fail procedure? Yes.
      *   Order of questions? Yes.
      *   Good enough answers? Yes.
      *   Hard stops? Yes.
      *   Human hand-off? Yes.
      *   Run on 3 cases? Yes.
      *   Unwelcome answers? Yes.
      *   Neurath vs. AI stretch? Yes.
      *   Misfire warnings? Yes.
      *   Confidence levels? Yes.
      *   Least sure thing? Yes.

  9.  **Final Polish:** Ensure the distinction between "Epidemiological Precision" and "ISOTYPE Fuzziness" is clear, as that's a major tension in health data. (e.g., A case *is* a case for counting, but the *category* of disease might be fuzzy).

  *(Self-Correction on the "Fuzziness" point)*: Neurath argued that social categories (unemployment) are fuzzy. Medical categories (Maternal Death) are clinically defined. Applying the fuzziness rule here is dangerous. I need to highlight this tension in the "Misfire" section.

  *(Self-Correction on Audio)*: The prompt mentions audio versions. Neurath is visual. I must explicitly state I am deriving audio rules from his visual philosophy, not quoting him.

  *(Self-Correction on Dashboard)*: Neurath believed in "Transformation" – an expert translates data for the public. Allowing users to rescale axes removes the Transformer. This is a hard philosophical conflict.

