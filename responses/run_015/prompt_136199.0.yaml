answer: |-
  The ledger lay open on the mahogany desk, its pages smelling of dust and dried ink. To Elara, the book was not a record of what *was*, but a log of what had *become*. She was a finitist in a hotel that pretended to be eternal.

  She adjusted the green glass lamp. Outside the office window, the corridor stretched into darkness. She knew, logically, that if she walked down it, more rooms would appear. Room 1, Room 2, Room 3... She accepted the *potential* for the corridor to extend indefinitely. But she refused to believe that Room 1,000,000,000 existed right now, waiting in the dark. To Elara, existence was constructive. A room existed only when the key was cut, the door built, the guest checked in. Infinity was a verb, not a noun.

  It was 3:00 AM. The shift was quiet. The current highest occupied room was 842.

  Elara's finger traced the columns of the registration ledger. *Guest Name. Room Number. Status.* A standard bijection. One guest, one room. A mapping of the natural numbers.

  Tonight, a restless impulse seized her. She wanted to test the boundaries of the "completed set" that the Manager spoke of so casually. She took a fresh slip of cardstock. She would perform a construction. Not to add a guest—that was trivial, a mere matter of shifting $n$ to $n+1$—but to define a guest by the totality of the hotel itself.

  She treated the ledger as if it were a completed infinite list, a violation of her own creed, just to see what would break. She looked at the first digit of the Guest ID in Room 1. She looked at the second digit of the Guest ID in Room 2. The third of Room 3.

  *Change them,* she thought. *If the digit is 4, make it 5. If 5, make it 4.*

  She wrote the new sequence on the cardstock. A new Guest ID. By Cantor's logic, this ID differed from every existing Guest ID in at least one position. Therefore, this Guest was not on the list.

  But this was Hilbert's Hotel. There is always a room.

  Elara stared at the number she had written. It was a valid integer. It was large, certainly—larger than 842—but it was constructible. She could walk down the hall, counting, and eventually, she would reach it.

  *Wait.*

  She looked closer. In her abstraction, she had padded the room numbers with leading zeros to align them for the diagonalization. Room 1 was `...0001`. Room 842 was `...0842`. By manipulating the digits at the $n$-th position for the $n$-th room, she hadn't just created a larger number. She had created a number with non-zero digits extending infinitely to the left.

  It was not a natural number. It was a string of digits that never terminated.

  In her ontology, this was nonsense. A room number must be reachable by counting. You cannot count to a number that has no end. This "Room" required an infinite number of digits to name. It lay beyond the horizon of the constructible.

  And yet, the cardstock was in her hand. The ink was wet.

  "It doesn't map," she whispered to the silence. "There is no door for this number."

  "The door is simply further down than you care to walk."

  Elara jumped. Mr. Hilbert stood in the doorway. He was a man of indeterminate age, wearing a suit that seemed to absorb the lamplight. He held a master key ring that chimed softly, a sound like distant bells.

  "This number is ill-formed," Elara said, shielding the card with her palm. "It violates the principle of finite induction. It's not a room; it's a procedure that never finishes."

  Hilbert stepped into the room, his movements smooth, as if he were sliding through the air rather than walking. "You confuse the map with the territory, Elara. You believe the hotel is built room by room, brick by brick. I tell you, the hotel *is*. The corridors are not dug; they are revealed."

  "If the hotel *is*," Elara countered, her voice tightening, "then the set of rooms is actual. It is a completed infinity. But if it is completed, Cantor's argument applies. There are more possible guest configurations than there are rooms. You have guests who cannot be housed."

  "Not at all," Hilbert said, leaning against the doorframe. "The set of rooms is countable. The set of guests is countable. We accommodate them all."

  "I just constructed a guest record that diagonalizes out of your countable set," Elara insisted, tapping the card. "This ID corresponds to a room index that is not a natural number. It is an infinite string. By your own logic, if the hotel is an actual infinite set of Natural Numbered rooms, this record points to nowhere. It is a ghost."

  Hilbert smiled, a expression of gentle pity. "You are applying a finite mind to a transfinite structure. You see a paradox because you demand a stopping point. You ask, 'Where does the number end?' I answer, 'It does not end, and it need not.' The room exists in the completion of the sequence."

  "But the sequence never completes!" Elara stood up. "That is the definition of potential infinity. I can always add a room. I cannot *have* all the rooms. If I have all the rooms, I can diagonalize out of them. If I can diagonalize out of them, the hotel is not full, yet you claim it is."

  "The hotel is full," Hilbert said softly. "And yet there is room for one more. And room for the one you just wrote."

  He held out his hand. "Give me the card."

  Elara hesitated. To give him the card was to validate the object. It was to admit that a room defined by an infinite non-terminating integer had a lock, a key, and a bed. It was to admit that the "completed set" was real, that her finitism was merely a limitation of her perception, not a truth of the universe.

  But the card felt heavy. It felt like an error.

  "If I give this to you," Elara said, "where do you put the guest?"

  "I don't put them anywhere, Elara. They are already there."

  "That's impossible. I created this ID five minutes ago."

  "You created the *label*," Hilbert corrected. "The room awaited the label. Just as the corridor awaits the walker."

  Elara looked down at the number. In the dim light, the digits seemed to shimmer. Was the string truly infinite? Or did it just fade into the grain of the paper? She tried to focus on the leftmost digit, but her eye couldn't find the start of the number. It blurred into the edge of the card.

  A cold dread pooled in her stomach. Was this an administrative mistake? Had she simply written a nonsense string on a piece of paper, projecting mathematical abstraction onto physical reality? Or was the paper itself a fissure, a place where the hotel's actual infinity bled through her finite perception?

  "If the room exists," Elara said, her voice barely audible, "then the set of rooms is uncountable. If the set is uncountable, you cannot shift guests from $n$ to $n+1$ to make space. The bus of infinite passengers would not fit."

  Hilbert took the card from her hand. His fingers did not tremble. "We manage," he said.

  He turned to leave. At the threshold, he paused.

  "You worry that the number has no end. Perhaps you should worry that it has no beginning. Good night, Archivist."

  He vanished into the corridor. The darkness swallowed him instantly.

  Elara sat alone. She looked at the ledger. Room 842 was still the highest occupied. The potential for 843 remained. But on her desk lay a receipt for a room that, by her logic, required the hotel to be finished in order to be numbered, yet required the hotel to be unfinished to be reached.

  She opened a drawer and took out a stamp: *PENDING.*

  She hovered it over the card. If she stamped it, she acknowledged the guest. If she filed it in the wastebin, she denied the reality of the construction.

  Outside, the hum of the hotel shifted. A vibration ran through the floorboards, subtle as a breath. For a moment, Elara thought she heard a door close, very far away. Or perhaps very deep within.

  She lowered the stamp. She placed the card between the pages of the ledger, right after Room 842. She did not stamp it. She did not throw it away.

  She turned off the lamp. In the darkness, the corridor waited. It was impossible to tell if it stretched forever, or if it ended just beyond the light, waiting for her to take the next step. Elara closed her eyes and listened to the silence, wondering if it was the quiet of an empty hall, or the held breath of something infinite.
