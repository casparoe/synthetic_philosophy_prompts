answer: |-
  You are right to be suspicious. The accuracy-first program (veritism) feels like home because it *is* forecast verification dressed in modal logic. But forecast verification works because the "truth" (did it rain?) and the "partition" (rain/no rain) are fixed by the physical world and the operational need. In epistemology, the partition is often chosen by the theorist, and that choice drives the result.

  If your goal is to critique scientific malpractice (p-hacking, overfitting, stagnation), standard accuracy-first epistemology is insufficient out of the box. It is static, partition-sensitive, and indifferent to the cost of complexity. To do the job you want, you need a theory of epistemic value that functions like a robust verification framework for *theory construction*, not just *state estimation*.

  Here are the desiderata for such a theory, organized by your worries and the gaps you identified.

  ### Desiderata for an Epistemic Value Theory

  **1. Partition Stability (The Granularity Requirement)**
  *   **The Case:** In meteorology, you can verify "precipitation > 0mm" or "precipitation > 10mm." A good scoring rule shouldn't radically change its recommendation on which forecast is "better" just because you changed the bin size. In philosophy, the dominance argument (that probabilistic credences beat non-probabilistic ones) relies on the specific algebra of propositions chosen. If I coarse-grain the possibilities, a non-probabilistic assignment might no longer be dominated.
  *   **Why Required:** P-hacking is essentially manipulating the partition (researcher degrees of freedom). If your epistemic theory says a belief is rational only relative to an arbitrary slicing of possibility space, it cannot condemn a scientist for slicing the data until it looks significant.
  *   **Status:** **Non-Negotiable.** Without this, the theory is manipulable.

  **2. Complexity Penalization (The Overfitting Requirement)**
  *   **The Case:** You know this better than anyone: a model with enough parameters fits the training data perfectly (Brier score = 0) but predicts nothing. Pure accuracy maximization favors the most complex hypothesis that fits the current evidence.
  *   **Why Required:** To critique overfitting and p-hacking, the theory must value *generalizability* over *fit*. It must treat "simplicity" or "degrees of freedom" as an epistemic cost, not just an aesthetic preference. If the theory only scores fit to current data, it validates the overfitter.
  *   **Status:** **Non-Negotiable.** This is the only way to distinguish science from curve-fitting.

  **3. Inquiry Valuation (The Experiment Requirement)**
  *   **The Case:** Standard accuracy measures are static; they score the credence you hold *now*. They do not inherently value *getting* new evidence. A scientist who sits on their hands and believes the status quo with 0.5 credence might score better than one who runs a risky experiment that temporarily lowers their accuracy before raising it.
  *   **Why Required:** To critique labs that "never quite update" or refuse to run the decisive test, the theory must assign positive value to the *process* of inquiry (Value of Information), not just the *state* of belief.
  *   **Status:** **Non-Negotiable.** Science is a verb; static accuracy treats it as a noun.

  **4. Bounded Rationality (The Logical Omniscience Requirement)**
  *   **The Case:** Dominance arguments assume you know all logical consequences of your beliefs. If you fail to see that $A$ implies $B$, standard scoring punishes you as if you were wrong about the world. In science, deriving consequences from a complex model is the work itself.
  *   **Why Required:** To distinguish between a scientist who is negligent (ignoring a null result) and one who is computationally limited (hasn't solved the equations yet). A theory that punishes computational difficulty as "inaccuracy" will misdiagnose the pathology of the lab.
  *   **Status:** **Negotiable Preference.** (See *Tensions* below). Strict accuracy-firstism cannot accommodate this without breaking its core proofs.

  **5. Question Sensitivity (The Relevance Requirement)**
  *   **The Case:** Accuracy-firstism says be accurate about *everything*. But being 99% accurate about the number of grains of sand on a beach is epistemically worthless compared to being 60% accurate about climate sensitivity.
  *   **Why Required:** To critique scientists who focus on trivial anomalies to avoid addressing core theoretical failures (the "inconvenient null result" worry). The theory must weight accuracy by the importance of the question.
  *   **Status:** **Negotiable Preference.** Hard to formalize without introducing subjective utility, which purity-advocates reject.

  **6. Dynamic Coherence (The Updating Requirement)**
  *   **The Case:** You asked if updating must be derived. If the theory only scores static states, it cannot condemn a scientist who ignores new data. It must show that *conditionalizing* (or a robust equivalent) is the only way to maximize expected accuracy over time.
  *   **Why Required:** To condemn the "labs that never quite update." If the theory allows for stubbornness without an accuracy penalty, it fails the job.
  *   **Status:** **Non-Negotiable.**

  **7. The Assertion Bridge (The All-or-Nothing Requirement)**
  *   **The Case:** In lab meetings, we say "The effect is real," not "I assign 0.85 credence." We also face the Lottery Paradox: believing each claim in a paper is true, while believing at least one error exists.
  *   **Why Required:** Scientific practice involves commitment to claims for the sake of action (building instruments, publishing). A theory that only handles gradated credence cannot critique the *assertions* scientists actually make.
  *   **Status:** **Negotiable Preference.** Many accuracy-first theorists try to reduce belief to high credence, but this often fails the consistency check.

  **8. Community Aggregation (The Social Requirement)**
  *   **The Case:** You mentioned "labs." Science is distributed. One scientist's calibration is another's resolution.
  *   **Why Required:** P-hacking is often a systemic incentive problem, not just individual irrationality. A theory focusing solely on individual credence misses the structural epistemic vice.
  *   **Status:** **Missed Requirement (Added).** Essential for your specific goal of critiquing practice.

  ---

  ### Tensions and Incompatibilities

  You suspected the carving worry and the dominance argument can't both survive. You are correct. Here is the landscape of the conflict:

  1.  **Partition Stability vs. Strict Properness:** The dominance argument (that probabilistic credences are uniquely undominated) generally relies on the scoring rule being additive across the specific partition chosen. If you demand the score be invariant under coarsening or refinement of that partition (Partition Stability), most strictly proper scoring rules (like Brier) fail. They yield different verdicts on which belief set is "better" depending on how you slice the possibility space.
      *   *Verdict:* You cannot have a mathematically clean dominance argument *and* partition invariance. You must choose stability (for scientific critique) and accept that the "proof" of probabilism becomes pragmatic rather than logical.

  2.  **Complexity Penalization vs. Truth-Tracking:** Pure accuracy wants the truth. The truth might be complex. If you penalize complexity, you are explicitly willing to accept a *less accurate* (in the strict Brier sense) model in exchange for robustness.
      *   *Verdict:* To critique overfitting, you must admit that "Epistemic Value" $\neq$ "Accuracy." It must be "Accuracy minus Complexity Cost." This breaks the purity of the accuracy-first program.

  3.  **Bounded Rationality vs. Dominance:** The dominance argument works by comparing your credence function to *all possible* alternative functions, including those that know all logical truths. If you restrict the set of alternatives to "computationally feasible" ones, the dominance proof collapses.
      *   *Verdict:* This is the prejudice you suspected. Demanding logical omniscience is a mathematical convenience, not a normative requirement for scientists.

  ### The "Killer" Requirement

  If you must pick one requirement that knocks out the most versions of the accuracy-first program as usually stated, it is **Complexity Penalization (Desideratum #2)**.

  *   **Why:** The standard accuracy-first argument claims that *only* accuracy matters. It derives the probability axioms from this. However, in scientific practice (your target), maximizing accuracy on available data is exactly what leads to p-hacking and overfitting. To condemn those practices, you must introduce a second value (simplicity, stability, out-of-sample performance).
  *   **Consequence:** Once you admit a second value, accuracy is no longer the *sole* fundamental good. The dominance argument for probabilism loses its "single-source" authority. You move from "Accuracy-First" to "Fitness-First" (where fitness includes accuracy + parsimony).

  ### Summary Table

  | Desideratum | Motivating Case | Status | Conflict |
  | :--- | :--- | :--- | :--- |
  | **1. Partition Stability** | Prevents manipulating results via binning/slicing. | **Non-Negotiable** | Breaks standard Dominance proofs. |
  | **2. Complexity Penalization** | Prevents overfitting/p-hacking. | **Non-Negotiable** | Contradicts "Accuracy is the *only* good." |
  | **3. Inquiry Valuation** | Values running experiments, not just holding beliefs. | **Non-Negotiable** | Requires dynamic, not static, scoring. |
  | **4. Bounded Rationality** | Distinguishes stupidity from computational limits. | **Negotiable** | Breaks Logical Omniscience assumptions. |
  | **5. Question Sensitivity** | Prioritizes important questions over trivial ones. | **Negotiable** | Hard to formalize objectively. |
  | **6. Dynamic Coherence** | Mandates updating on new evidence. | **Non-Negotiable** | Requires deriving updating from scoring. |
  | **7. Assertion Bridge** | Handles binary claims in lab meetings. | **Negotiable** | Lottery Paradox issues. |
  | **8. Community Aggregation** | **Added.** Addresses systemic lab incentives. | **Non-Negotiable** | Individualist frameworks fail here. |

  **Final Advice for the Group:**
  When you bring this to the library, press hard on **Desideratum #2**. If the accuracy-first proponent says "Simplicity is just a proxy for long-term accuracy," ask them for the proof that the simpler model will actually be more accurate in the next time-step without assuming the very stability they are trying to prove. That is where the circularity usually hides.
