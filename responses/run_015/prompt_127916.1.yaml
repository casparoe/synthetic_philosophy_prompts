prompt: |-
  I'm defending in our phil-lang seminar next tuesday the idea that prompt-engineering isn't instruction-giving but a performative speech act — specifically, that a system prompt creates what I'm calling a "temporary institutional frame" (like casting an actor, but for epistemic roles). The audience is mostly Austin/Searle people who think applying speech-act theory to chatbots is mostly tech-bro appropriation; they care hard about sincerity conditions, conventional procedures, and whether there's real "uptake" on the AI side. Draft my Q&A prep: the 6-7 objections they'll actually raise, ordered by how much damage they do, phrased in their vocabulary (not AI-ethics jargon), each with a 90-second reply and a honest note on where the reply is weakest. Include the question I'm praying nobody asks — probably about whether my view collapses into treating the LLM as a genuine speaker with illocutionary intent. Be committed: take definite positions, don't just map options, and flag exactly where my "institutional frame" idea takes liberties with Austin's original felicity conditions.
