  ### Brainstorming the Chain of Custody

  **The Chain of Hands:**
  1.  **The Girl (Reporter):** Owns the experience, lacks the vocabulary. *Loss:* Specificity of fear.
  2.  **The Friend (Witness):** Translates experience into story. *Loss:* Nuance becomes "weirdness."
  3.  **The Teacher (Filter):** Translates story into verifiable data. *Loss:* Emotion becomes "feelings" (unverifiable).
  4.  **The Dean (Categorizer):** Translates data into Code of Conduct boxes. *Loss:* Harm becomes "conduct."
  5.  **The Report (Record):** Translates boxes into permanent file. *Loss:* Agency becomes passive storage.
  6.  **The Aftermath:** The truth arrives when the file is closed.

  **Official Vocabulary (The School's Lexicon):**
  *   "Verify," "Facts," "Code," "Contact," "Conduct," "Disruptive," "File," "Signed off," "Incident."
  *   *Contrast with Student Vocabulary:* "Alone," "Weird," "Close," "Unsafe."

  **Where Things Go Missing:**
  *   **Stanza 1 → 2:** "Wouldn't leave me alone" becomes "felt weird." (The threat is softened).
  *   **Stanza 3 → 4:** "Facts not feelings" becomes "Disruptive conduct." (The human impact is swapped for a policy category).
  *   **Stanza 5 → 6:** "Signed off" precedes "The word was unsafe." (The truth arrives after the decision is final).

  **Credibility Shift:**
  *   Starts with "I said" (Subjective).
  *   Ends with "The file sits" (Objective/Static).
  *   The Dean believes the *category* too quickly ("This fits..."), closing the inquiry before the harm is fully named.

