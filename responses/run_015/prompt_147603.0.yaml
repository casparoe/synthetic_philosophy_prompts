      *   *Argument:* Without Hitler, the NSDAP likely fragments in late 1932 (Strasser crisis). Without a unified NSDAP, Hindenburg doesn't appoint a Chancellor from the party. Papen tries minority rule -> Civil War or Communist uprising.
