      *   Section 2: The Valence Problem (Union vs. Morality).
      *   Section 3: Success/Counterfactual (Ratification vs. Civil War).
      *   Section 4: Gaps (Enforcement & Minority Veto).
      *   Section 5: UK Contrast (Sovereignty).
