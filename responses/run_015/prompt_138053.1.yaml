      *(Self-Correction on Confidence)*: I need to make sure I explicitly state "Confidence: High/Med/Low" for the main claims as requested. And pick *one* specific thing I'm least sure of.

      *(Refining the "Ulysses" definition)*: A true Ulysses contract requires the agent to *want* to be bound. Did 1808 want to be bound? No. So it's not a Ulysses contract for 1808. It was for 1787. This is crucial. It's a *precommitment by a predecessor*.

      *(Refining the UK point)*: The variable is "Rule of Recognition." In the UK, the rule of recognition allows simple repeal. In the US, it requires supermajority + state consent.

