          *   *Variable:* *Sovereignty Location.* In US, Sovereignty is "The Constitution." In UK, Sovereignty is "The Current Parliament."
          *   *Theory Prediction:* Ulysses contracts fail if the agent (Parliament) retains the power to cut the rope at will (Simple Majority).
          *   *Confidence:* High.

      *   **6. Confidence & Weakest Link:**
          *   Need to be explicit here as requested.
          *   Weakest link is likely the Counterfactual in Point 3 (Would the Union actually have dissolved without the slave trade clause?).

