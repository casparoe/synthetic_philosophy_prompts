answer: |-
  You have a coherent set of intuitions, but they are currently driven by context rather than a stated rule. The reason you feel inconsistent is that you are applying different moral weights to **allocation mechanisms** versus **market freedom** without realizing it.

  Here is a principle that captures almost all of your verdicts, explains your splits, and forces a decision on the cases where you are undecided.

  ### The Principle: Allocation Integrity

  **"A transaction is permissible unless it subverts the specific moral criterion upon which a good, service, or position is supposed to be distributed."**

  In simpler terms: **Money is a valid way to get things, unless the thing is supposed to be given for a different reason.**

  This principle rests on three rules:
  1.  **The Queue Rule:** If a line is based on *time/effort*, you can sell your spot. If a line is based on *need/merit*, you cannot.
  2.  **The Captive Market Rule:** If a good is a survival necessity and the buyer has no alternatives (monopoly), price gouging is impermissible. If alternatives exist, prices float.
  3.  **The Civic/Personhood Rule:** Rights of citizenship and ownership of persons cannot be commodified.

  ---

  ### Resolving Your Splits

  This principle explains why your gut splits on cases that look structurally similar.

  **1. Water (Hurricane) vs. Tomatoes (Frost)**
  *   **Your Gut:** Water = Bad, Tomatoes = Good.
  *   **The Principle:** This is the **Captive Market Rule**.
      *   **Tomatoes:** The frost reduces supply, but buyers have alternatives (other vegetables, other stores, other growers). The market is still competitive. The price signal rations a non-essential good.
      *   **Water:** Three days post-hurricane, infrastructure is down. The gas station has a temporary local monopoly. Water is a survival necessity. The buyer is "captive." The price hike isn't rationing; it's extraction from a vulnerable population with no exit.
  *   **Verdict:** Consistent.

  **2. DMV Line vs. Transplant List**
  *   **Your Gut:** DMV = Good, Transplant = Bad.
  *   **The Principle:** This is the **Queue Rule**.
      *   **DMV:** The moral criterion for the line is *time spent waiting*. Time is a resource that can be traded. Paying someone to wait for you respects the "time cost" metric.
      *   **Transplant List:** The moral criterion is *medical urgency/need*. Introducing money subverts the allocation mechanism. It changes the system from "who needs it most" to "who has the most cash."
  *   **Verdict:** Consistent.

  **3. Surrogacy vs. Newborn**
  *   **Your Gut:** Surrogacy = Good, Newborn = Bad.
  *   **The Principle:** This is the **Personhood Rule**.
      *   **Surrogacy:** You are selling a *service* (labor, use of body). You retain ownership of yourself.
      *   **Newborn:** You are selling a *person*. This treats a human as property, which violates the foundational status of personhood.
  *   **Verdict:** Consistent.

  ---

  ### The Hard Call: Paying for Turnout

  **The Case:** A group paying low-income residents $20 to show up and vote, with no instruction on how to vote.
  **Your Gut:** Back and forth.
  **The Principle's Verdict:** **Not Fine.**

  **Why:** This falls under the **Civic/Personhood Rule**. Voting is not a job; it is a civic right/duty. While paying for turnout doesn't direct the *choice* (like selling a vote does), it commodifies the *act* of citizenship. It transforms a democratic participant into a paid contractor. If you allow this, you create a class of professional voters whose participation is motivated by wage rather than civic interest, which subtly corrupts the "one person, one vote" equality by introducing financial leverage into participation rates.

  **The Cost:** To keep your principle simple, you must drop the ambivalence here. If selling a vote is "Not Fine" because it corrupts the electoral system, paying for turnout is also "Not Fine" because it commercializes the electorate.

  ---

  ### Predictions for New Cases

  Here is how the principle handles the cases you haven't tested yet.

  **1. A woman in financial trouble selling a kidney to pay off debt.**
  *   **Prediction:** **Fine.**
  *   **Reasoning:** This falls under **Body Autonomy**. The allocation criterion for your own body is *your choice*. While financial distress is unfortunate (similar to the hurricane victim's distress), the transaction does not subvert a social queue or a civic right.
  *   **Tension Warning:** This is the weakest point in your consistency. In the **Water Case**, you ruled against exploiting a buyer's desperation (captive necessity). In the **Kidney Case**, you are allowing the exploitation of a seller's desperation.
      *   *If you want to be fully consistent:* You might need to admit that extreme financial coercion makes the kidney sale "Not Fine," just as the hurricane makes the water sale "Not Fine."
      *   *If you keep your current verdict:* You are prioritizing **Seller Autonomy** over **Seller Vulnerability**, but **Buyer Vulnerability** over **Market Freedom**. That is a valid position, but it is asymmetrical.

  **2. A rich person buying a slot in a lottery for a subsidized apartment.**
  *   **Prediction:** **Not Fine.**
  *   **Reasoning:** This is a **Queue Rule** violation. Subsidized housing is allocated based on *need* (income level) and *luck* (lottery). It is explicitly designed to bypass the market mechanism. Selling the slot converts a need-based benefit into a market commodity, subverting the intent of the subsidy. It is structurally identical to selling a place on the transplant list.

  ---

  ### Summary of the Trade-off

  You asked for honesty about the price of this principle. Here it is:

  1.  **You lose the "Turnout Payment" ambiguity.** The principle forces you to ban it. If you feel strongly that turnout payment *should* be allowed, this principle is too strict for you.
  2.  **You have an asymmetry on Desperation.** You protect desperate *buyers* (Water) but allow desperate *sellers* (Kidney/Plasma). A more baroque principle could fix this, but a simple one requires you to accept that distinction. You are essentially saying: *"It is wrong to trap a buyer, but it is okay for a seller to be trapped by circumstances, provided they consent."*

  **The Test:**
  If you encounter a case where a rich person pays a poor person to stand in line for **free** public healthcare, the principle says **Not Fine**. (Queue is based on need/time, not wealth).
  If you encounter a case where a rich person pays a poor person to stand in line for **concert tickets**, the principle says **Fine**. (Queue is based on time, good is a commodity).

  Does that distinction feel right to you? If so, you have your principle.
