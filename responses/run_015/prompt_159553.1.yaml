prompt: |-
  I am the token philosopher on a committee at my university that has to choose a social discount rate for long-lived capital projects — a district-heating retrofit whose costs fall now and whose savings accrue over eighty years, a library roof with a fifty-year life, that sort of thing — and I have discovered that I cannot reconstruct a principle behind the numbers I keep wanting to propose. So I am going to list my gut verdicts on a set of cases and ask what discounting rule, if any, they add up to. (1) A migraine for me tomorrow versus an identical migraine for me in exactly twenty years: indifferent, I would pay the same to avoid either. (2) A weekend in Vienna this year versus a qualitatively identical weekend in twenty years: I would give up something like a tenth of the value to have it now. (3) Fifty dollars now to spare a stranger a day of severe pain next year, but only about twenty to spare a stranger an identically severe day three centuries from now — yet if you hand me a device that guarantees the later person exists, that the pain would otherwise occur, and that my money is spent only conditional on both, my reluctance almost entirely disappears. (4) A friend who spends forty years in dreamless suspended animation and wakes in 2065 with no experienced gap: a benefit delivered to her at the instant of waking versus the same benefit delivered a calendar year later — my gut says no discount at all, which suggests that what I am discounting is experienced time rather than calendar time, though I cannot tell what that implies for the committee's eighty-year retrofit, where everyone experiences the interval. (5) A thousand people helped in two hundred years beats a hundred helped today, but a hundred helped today beats a hundred and one helped in two hundred years, so my revealed rate seems to collapse as the stakes grow. (6) I would pay more to postpone a harm by a year than to advance an equal-sized benefit by a year. (7) I would pay a great deal to shave a small probability of civilizational collapse five centuries out, but very little for a guaranteed modest benefit to whoever is alive then, which sits badly with (5). And one more observation that may or may not belong: if I imagine being told that I was born in 1920 rather than 1990, my willingness to pay for benefits in a given calendar year changes, which makes me suspect that part of what I call temporal discounting is really positional rather than temporal.

  What I want is the principle, or the small set of candidate principles, that fits these verdicts — stated precisely, with the case that motivates each clause, and with an honest statement of which verdicts it cannot accommodate and why. Please separate, as you go, the discounting that is genuinely a preference for earlier over later from the discounting that is really something else wearing its clothes: risk that the beneficiary never exists or the benefit never arrives, causal fragility over long chains, opportunity cost of capital, diminishing marginal utility if future people are richer, or the positional effect I mentioned. Once all of those are subtracted, is there a residual pure time preference in my verdicts at all, and if there is, is it rationally defensible or is it the familiar failure of imagination that the economists on the committee invoke? I would also like the resulting account's verdicts on three cases I have not listed: a policy whose beneficiaries do not yet exist and whose number depends on which policy we choose; a bequest to an institution that will persist continuously for three hundred years, where no individual experiences the interval; and the difference, if the account sees one, between discounting within a single life and discounting across generations. Finally, tell me whether the account I end up with hands the committee a single number, or whether it implies that a single number was never the right object to be asking for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A "token philosopher" on a university committee. This implies high intelligence, familiarity with ethical/philosophical concepts, comfort with nuance, but frustration with the gap between intuition and formal principle. They are looking for rigorous analysis, not platitudes.
      *   **Task:** Reconstruct a discounting principle from a set of 7 specific "gut verdicts" + 1 observation.
      *   **Requirements:**
          *   State the principle(s) precisely.
          *   Link clauses to specific cases.
          *   Admit limitations (which verdicts don't fit).
          *   Distinguish "pure time preference" from other factors (risk, existence, opportunity cost, etc.).
          *   Address the rationality of any residual pure time preference.
          *   Apply the account to 3 new cases (non-identity/bequest/cross-gen).
          *   Conclude on whether a single social discount rate (SDR) is appropriate.

  2.  **Deconstruct the Verdicts:**
      *   *(1) Migraine (Self, 1 day vs. 20 years):* Indifferent. $\rightarrow$ No pure time preference for *bad* experiences within a life? Or perhaps certainty of self-continuity overrides time.
      *   *(2) Vienna Weekend (Self, Now vs. 20 years):* Discount ~10%. $\rightarrow$ Pure time preference for *goods* within a life? Or uncertainty of enjoyment?
      *   *(3) Stranger Pain (Next Year vs. 3 Centuries):* \$50 vs. \$20. *But* if existence/spending is guaranteed, reluctance disappears. $\rightarrow$ The discount is largely *existence risk* and *causal fragility*, not pure time preference.
      *   *(4) Suspended Animation Friend:* No discount between waking and +1 year. $\rightarrow$ Discounting tracks *experienced time* (psychological continuity), not calendar time.
      *   *(5) Numbers vs. Time (1000 in 200yrs > 100 today; 100 today > 101 in 200yrs):* Lexical threshold or diminishing discount rate? High stakes override time preference.
      *   *(6) Postpone Harm vs. Advance Benefit:* Asymmetry. Loss aversion applied to time? Status quo bias?
      *   *(7) Existential Risk vs. Modest Benefit:* High value on preventing collapse, low value on guaranteed modest gain. $\rightarrow$ Prioritarianism regarding existence itself vs. marginal utility.
      *   *(Observation) Birth Year (1920 vs. 1990):* Positional effect. $\rightarrow$ Discounting is relative to the *agent's* temporal location, not absolute calendar time.

  3.  **Synthesize a Principle:**
      *   *Core Insight:* There is almost no *pure* time preference (discounting time *per se*). The observed discounting is mostly epistemic (risk/uncertainty), metaphysical (existence/identity), or psychological (experienced duration).
      *   *Candidate Principle:* **The Epistemic-Continuity Discount Principle.**
      *   *Components:*
          1.  **Zero Pure Time Preference:** Time itself has no moral weight (Ramsey/Parfit view). Supported by (1), (3-conditional), (4).
          2.  **Probability of Realization:** Discount by the likelihood the benefit actually occurs (existence of recipient, causal chain integrity). Supported by (3), (7).
          3.  **Experienced Continuity:** Discount relates to the psychological gap for the recipient. Supported by (4).
          4.  **Diminishing Marginal Utility (DMU):** Future people might be richer (standard economics), but also *severity* matters (5).
          5.  **Catastrophic Avoidance:** Non-linear value on preventing extinction/collapse. Supported by (7).
          6.  **Loss Aversion/Asymmetry:** Harms weighted heavier than benefits. Supported by (6).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the suspicion that "time preference" is a misnomer.
      *   **The Reconstruction (The Principle):** Formulate the "Principle of Epistemic and Continuity-Adjusted Value."
          *   Clause A: No Intrinsic Temporal Weight (Cases 1, 3-conditional, 4).
          *   Clause B: Probability of Existence and Delivery (Cases 3, 7).
          *   Clause C: Experienced Duration (Case 4).
          *   Clause D: Threshold Lexicality for Stakes (Case 5).
          *   Clause E: Harm/Benefit Asymmetry (Case 6).
          *   Clause F: Indexical Positionality (Observation).
      *   **Filtering "Pure" Time Preference:**
          *   Analyze Case 2 (Vienna). Is it impatience or uncertainty of enjoyment? Likely uncertainty + opportunity cost.
          *   Conclusion: Residual pure time preference is negligible or irrational (failure of imagination/vividness).
      *   **Addressing the Three New Cases:**
          *   *Non-Identity (Beneficiaries depend on policy):* Standard discounting fails. Need expected value of existence vs. non-existence.
          *   *Institutional Bequest:* No "experiencer" gap. Value lies in mission continuity. Low discount if mission is stable.
          *   *Within-Life vs. Cross-Gen:* Within-life = psychological continuity. Cross-gen = causal/epistemic probability.
      *   **The Committee Recommendation:**
          *   Can we give a single number? No.
          *   Why? Different projects trigger different clauses (risk vs. continuity vs. stakes).
          *   Proposal: A schedule or a multi-parameter model, not a single rate.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Did I explain Case 2 well enough? If (1) says no discount for migraines, why discount Vienna?
      *   *Fix:* Distinguish *pain avoidance* (urgent, certain bad) from *pleasure seeking* (uncertain, opportunity cost). Or, acknowledge (2) is the outlier that suggests a small irrational impatience for consumption.
      *   *Critique:* Case 5 implies a collapsing rate. How to formalize?
      *   *Fix:* Hyperbolic discounting or a lexical threshold. Let's go with a "Severity-Weighted Threshold."
      *   *Critique:* The "Positional" observation is key. It suggests the discount rate is agent-relative.
      *   *Fix:* Incorporate this into the "Epistemic" clause. I discount the future because *I* am here and *they* are there, not because *then* is worse than *now*.

  6.  **Final Polish:**
      *   Ensure tone is respectful and philosophically rigorous (matching the user).
      *   Check all constraints: Separate genuine preference from risk/positionality? Yes. Verdicts on 3 new cases? Yes. Single number? Yes.
      *   *Key Philosophical References:* Ramsey (1928) on ethical indefensibility of pure time preference. Parfit on identity. Weitzman on declining discount rates.

  7.  **Final Output Structure:**
      *   Diagnosis: The "Time Preference" Illusion.
      *   The Reconstructed Principle (The "Epistemic-Continuity Account").
      *   Breakdown of Clauses & Cases.
      *   The Residual Pure Time Preference Question.
      *   Application to Unlisted Cases.
      *   Recommendation to the Committee.

  *(Self-Correction on Case 3)*: The user says if existence is *guaranteed*, reluctance disappears. This is the smoking gun against pure time preference. I must emphasize this.
  *(Self-Correction on Case 7)*: Existential risk vs modest benefit. This suggests the discount rate isn't constant; it depends on the *type* of good (existence vs consumption).

  *(Final Plan)*: Build the response around the idea that the user is a "Ramseyian with Epistemic Constraints."

  8.  **Drafting the Content:** (Mental check of the "Single Number" conclusion). Economists love single numbers. Philosophers know context matters. The answer must be "No single number, but here is the framework to calculate the appropriate rate per project."

  9.  **Final Review against constraints:**
