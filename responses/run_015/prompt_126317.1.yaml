prompt: |-
  I work on data infrastructure — distributed systems, a fair amount of variance decomposition, and a lot of arguments with colleagues about whether a regression on observational data licenses any causal claim. I have no philosophy background beyond that. I recently got pulled into a discussion about what "heritable" means, discovered that I had strong gut reactions to a series of inferences people draw from heritability numbers and no idea what principle I was applying, and started writing the cases down. I would like to know whether my verdicts add up to anything.

  To keep this from turning into a fight about the empirical literature, I have written the cases with invented traits and invented numbers. Please take the numbers as stipulated. By h² I mean the usual ratio: genetic variance over total phenotypic variance, in a specified population, over the range of environments that population actually occupies.

  1. Baseline. In population P, h²(T) = 0.8. Claim: "Most of the differences in T among people in P track genetic differences." — Fine.

  2. Individual decomposition. Same number. Claim: "So for any given person in P, 80% of their T comes from their genes and 20% from their environment, and a sufficiently good measurement of both contributions would return that split." — Not fine. It feels like a category mistake. But I do not want to conclude that the 0.8 is meaningless, because I accepted it in (1).

  3. Nothing to decompose. A clonal population C under tightly controlled conditions: no genetic variance, essentially no environmental variance, only measurement noise. Depending on how the noise is handled, h² is undefined or around zero. Claim: "So T isn't genetic in C." — Not fine; the trait is produced by the same genes there as anywhere.

  4. Zero heritability, wholly genetic. Trait U: whether a person has the standard number of digits on the left hand. In P the variance comes almost entirely from accidents and surgery; h²(U) ≈ 0.02. Claim: "So genes have nothing to do with U." — Not fine.

  5. Malleability. Back to T, h² = 0.8 in P. An intervention is introduced — a nutrient, a training protocol, pick whichever you like — and the mean rises by most of a standard deviation, the whole distribution shifting. Claim, made before anyone knew about the intervention: "h² is 0.8, so there is not much room for environmental interventions here." — Not fine. I would go further and say the estimate gives no evidence at all about that claim, which is stronger than "weak evidence," and I am not sure I can defend the stronger version.

  6. Between groups. P divides into two subpopulations differing in average environment. Within each, h²(T) ≈ 0.8. The means differ by 0.9 standard deviations. Claim: "So the gap between them is genetic." — Not fine.

  7. Same conclusion, different evidence. Individuals are moved at random between the two subpopulations' environments and re-measured; the gap is unchanged. Claim: "At least part of the gap is genetic." — Fine, and I would act on it.

  Pair (6)/(7) is one of two that trouble me. I reject what is essentially the same conclusion in (6) and accept it in (7). If the answer is "heritability is a within-population statistic, and (7) is an experiment," that is true but not yet satisfying: I do not know what it is about an experiment that licenses the causal conclusion here, and I suspect that whatever it is will also tell me something about (5).

  8. The number moves when the environment does. A trait with h² = 0.5 in P. Environments are made uniform across P and the trait re-measured: h² is now 0.8. Claim: "The genes got stronger; the trait became more genetic." — Not fine. But I also do not want to say the new estimate is wrong, since it correctly describes the new situation. Related claim: "Since h² went up, the equalization did not help." — Also not fine, though this looks like a restatement of my reason for rejecting (5), and I want to know whether it is the same point or a different one.

  9. The pathway case. Trait V is hours per week spent practicing a skill. h²(V) = 0.6 in P, and the mechanism is entirely indirect: a genetic propensity leads some children to seek out practice, and it is the practice that produces the skill. Is V genetic or environmental? My verdict: I am happy to say both that 60% of the variance in V is attributable to genetic differences and that V is, causally speaking, an environmental variable, and I do not think these conflict. This is the second case that troubles me, but for an odd reason: in my own work, if someone told me that 60% of the variance in database time was explained by request size, and that request size was in turn set by client configuration, I would have no discomfort whatsoever. So either the discomfort here is purely psychological, a leftover from the nature/nurture framing, or something is genuinely different, and I cannot tell which.

  10. Crossing. Genotype A outperforms B in environment E1; B outperforms A in E2. Measured over P, which contains a mix of E1 and E2, h² = 0.4. Verdict: 0.4 is a perfectly good description of P, but "A is genetically better" has no answer, and there is no environment-free fact of the matter about how genetic the trait is.

  11. Scale. h²(T) = 0.6, while h²(log T) = 0.35. Verdict: uneasy, and I cannot tell whether this is a real problem or a quibble. Tell me if it is a quibble and I will drop it.

  My tentative principle, which I do not think survives my own list: a heritability estimate is a statement about the actual sources of variance in a specified population occupying a specified range of environments, and it licenses no inference about individuals, about other populations, about environments outside that range, or about what would happen under any intervention. I like this right up to the point where I notice that it appears to make heritability nearly useless — and I do not believe that, because I treat the number as informative in (1), in (7), and in the selective-breeding case I have not listed. So either the principle is too strong or I do not understand what it commits me to.

  What I would like from you:

  a) A principle, or a small set of candidate principles, stated precisely enough that I could implement it as a rule — given an estimate and a claim, say whether the estimate licenses the claim — with the case that motivates each clause.

  b) Which of my verdicts the principle cannot accommodate, and which you would overturn. Be explicit about (6)/(7), about (5) versus (8), and about (9).

  c) What h² positively licenses. If it is not individuals, not other populations, and not interventions, then what is it good for? I would like this in terms of what I could do with the number, not only in terms of what I must not say.

  d) Verdicts on two cases I have not given verdicts on. First: a within-family design that compares siblings and so holds between-family environment constant returns a much lower h² than the population estimate — which of the two is "the" heritability, and what does the gap between them mean? Second: an intervention pushes an environmental variable outside the range it currently occupies in P — is the existing estimate evidence about its effect, and how much?

  e) If what I actually want is some counterfactual quantity — how far T would move if we moved this variable — then say what that quantity is, in your own terms, without appeal to references or to what it is called in the literature; whether it is estimable from the kinds of data heritability estimates come from; and how it relates to h². If it is not estimable from those data, say that plainly. And if the honest conclusion is that h² is the wrong statistic for every question I actually care about, tell me that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Background:** Data infrastructure, distributed systems, variance decomposition, observational data vs. causal claims. No philosophy background.
      *   **Problem:** Strong gut reactions to inferences drawn from heritability ($h^2$) numbers but lacks a principled framework to justify them. Wants to know if their verdicts "add up."
      *   **Input:** 11 specific cases with stipulated numbers and the user's verdicts (Fine/Not Fine).
      *   **Specific Questions:**
          *   (a) A precise principle (or set) to adjudicate claims.
          *   (b) Critique of the user's verdicts (specifically 6/7, 5/8, 9).
          *   (c) What $h^2$ *positively* licenses (utility).
          *   (d) Verdicts on two new cases (within-family design, out-of-range intervention).
          *   (e) Identification of the "counterfactual quantity" the user actually wants, its estimability, and relation to $h^2$.
      *   **Tone:** Rigorous, analytical, avoiding philosophical jargon where possible, respecting the user's technical background (variance, systems).

  2.  **Deconstruct the User's Intuition:**
      *   The user correctly identifies $h^2$ as a population-specific variance ratio ($\sigma^2_G / \sigma^2_P$).
      *   They correctly reject individual decomposition (Case 2), cross-population inference without experimental control (Case 6), and malleability claims based solely on $h^2$ (Case 5).
      *   They are troubled by the distinction between observational (6) and experimental (7) group differences.
      *   They are confused by the "pathway" case (9) where genetic influence is mediated by environment.
      *   They suspect $h^2$ might not be the statistic they actually care about for interventions (Case 5, 8, and Question e).

  3.  **Formulate the Core Principle (Question a):**
      *   *Standard Definition:* $h^2$ is the proportion of phenotypic variance attributable to additive genetic variance *in a specific population at a specific time*.
      *   *The Causal Gap:* Variance decomposition $\neq$ Causal mechanism.
      *   *Proposed Principle:* **The Variance-Causation Distinction.** $h^2$ describes the *structure of variation* in the status quo, not the *structure of causation* for the trait's existence or its responsiveness to change.
      *   *Refinement:* Need a rule that handles the "licenses" aspect.
      *   *Rule:* $h^2$ licenses predictions about *selection response* (breeding) within the current environmental range. It does *not* license claims about individual etiology, cross-population etiology, or environmental malleability.
      *   *Better Rule for this User:* **The Stability Condition.** $h^2$ licenses inferences only so long as the causal structure generating the variance remains invariant. Interventions change the causal structure.

  4.  **Evaluate Verdicts (Question b):**
      *   *Case 6 vs. 7:* This is the crux. Case 6 is observational confounding (genes and environment correlate). Case 7 is an experiment (randomization breaks the correlation). The principle is **Confounding vs. Control**. $h^2$ within groups doesn't explain between-group differences unless environments are controlled (Case 7). The user's intuition is correct; the distinction is experimental design, not the $h^2$ number itself.
      *   *Case 5 vs. 8:* Case 5 (Malleability) and Case 8 (Environment Uniformity) are two sides of the same coin. High $h^2$ means current environmental variance is low relative to genetic variance. It says nothing about the *potential* variance if environments changed. The user's intuition is correct. The principle is **Range Restriction**.
      *   *Case 9 (Pathway):* Genes $\to$ Behavior $\to$ Trait. This is "indirect genetic effect." The user is right to say both are true. The variance is genetic, the mechanism is environmental. This highlights that $h^2$ captures *correlation* with genotype, not *direct* biological imposition.

  5.  **Determine Positive Utility (Question c):**
      *   If it doesn't tell us about individuals or interventions, what is it for?
      *   *Answer:* **Response to Selection.** In evolutionary biology and animal breeding, $h^2$ predicts how much the population mean shifts if you select parents based on the trait (Breeder's Equation: $R = h^2 S$).
      *   *Data Infrastructure Analogy:* It predicts how much the system state changes if you filter inputs based on the current metric, assuming the underlying generation process stays the same.
      *   *Prediction:* It helps predict *variance* in future generations under *status quo* conditions.

  6.  **Address New Cases (Question d):**
      *   *Within-Family vs. Population:* Population $h^2$ includes between-family environmental variance confounded with genetics. Within-family controls for shared environment. The "true" additive genetic $h^2$ is closer to the within-family estimate. The gap represents **Gene-Environment Correlation ($r_{GE}$)**.
      *   *Out-of-Range Intervention:* Existing $h^2$ provides **zero** evidence. This is extrapolation beyond the support of the data. Analogy: Regression line doesn't predict behavior outside the observed $x$ range, especially if the function is non-linear.

  7.  **Identify the Counterfactual Quantity (Question e):**
      *   The user wants to know: "If I change $X$, how much does $Y$ change?"
      *   *Quantity:* **Average Causal Effect (ACE)** or **Treatment Effect**.
      *   *Estimability:* $h^2$ data (observational variance decomposition) cannot estimate ACE without strong assumptions (like no GxE interaction, linearity, no confounding).
      *   *Relation:* $h^2$ is about $\text{Var}(G) / \text{Var}(P)$. ACE is about $\partial P / \partial E$. They are orthogonal. High $h^2$ can coexist with high ACE (Case 5).
      *   *Honest Conclusion:* If the goal is intervention policy, $h^2$ is largely the wrong statistic. You need experimental or quasi-experimental estimates of causal effects.

  8.  **Drafting the Response:**
      *   *Tone:* Professional, direct, acknowledging the user's technical competence.
      *   *Structure:* Follow the user's (a) through (e) structure.
      *   *Key Concept:* Distinguish **Variance Attribution** (statistical) from **Causal Mechanism** (structural).
      *   *Refining the Principle:* Use the "Stable Causal Structure" constraint.
      *   *Addressing 6/7:* Emphasize Randomization as the key to causal inference, not the heritability stat itself.
      *   *Addressing 9:* Clarify that $h^2$ measures *association*, not *pathway*.
      *   *Addressing "What is it good for":* Focus on Prediction under Status Quo and Selection Response.
      *   *Addressing "What do I actually want":* Define the "Intervention Effect" and clarify it's not $h^2$.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about 6/7? Yes, need to emphasize that 7 isn't using $h^2$ to make the claim, it's using the *experiment*.
      *   *Check:* Is the distinction between 5 and 8 clear? Yes, both rely on the range of environmental variance.
      *   *Check:* Is the "within-family" answer nuanced? Need to mention that within-family removes shared environment confounds but might miss some genetic variance if non-additive. Keep it simple: it's a better estimate of *causal* genetic impact.
      *   *Check:* User asked for "no appeal to references." Keep it conceptual.
      *   *Check:* User works in data infra. Use analogies where helpful (variance in latency, etc.), but don't overdo it.
      *   *Crucial Point:* Make sure to validate that their gut feelings are essentially correct and align with modern quantitative genetics/causal inference consensus (without citing papers).

  10. **Final Polish:** Ensure the "Principle" in (a) is actionable. Ensure (e) is blunt about estimability. (Self-correction: Ensure I don't dismiss $h^2$ entirely; it *is* useful for prediction within the distribution, just not for intervention.)

  *(Self-Correction on Case 7)*: Wait, Case 7 says "Individuals are moved at random... gap is unchanged. Claim: At least part of the gap is genetic." The user says "Fine." Why? Because randomization controls environment. If the gap persists despite random assignment of environment, the remaining variance must correlate with the grouping variable (which is now effectively genetic/stratified). I need to explain *why* this works when 6 doesn't. It's because 7 breaks the $r_{GE}$ (gene-environment correlation).

  *(Self-Correction on Case 9)*: User is uncomfortable. Why? Because "genetic" usually implies "biological hardwiring." But in stats, it just means "varies with genotype." I need to validate that the statistical definition allows indirect paths, even if the colloquial definition doesn't.

  *(Self-Correction on Case 11)*: Scale dependence. This is a real property of variance ratios. Log transform changes variance structure. It's not a quibble, it's a feature of ratio statistics. I should confirm it's real but expected.

  Okay, ready to write.
answer: |-
  This is an exceptionally clear set of intuitions. Your gut reactions are correct, and they align with the rigorous distinction between **variance decomposition** (statistics) and **causal structure** (mechanism). The discomfort you feel arises because heritability ($h^2$) is often sold as a causal metric when it is actually a descriptive statistic about the status quo.

  Here is the breakdown you requested, structured to turn your intuitions into an implementable rule set.

  ### a) The Principle: Invariance of Causal Structure

  Your tentative principle is close, but it makes $h^2$ sound too passive. Here is a more precise operational rule.

  **The Principle of Variance-Causation Separation:**
  > A heritability estimate ($h^2$) describes the proportion of phenotypic variance attributable to genetic variance **under the specific causal structure and environmental distribution currently in force**.
  >
  > **Rule:** An $h^2$ estimate licenses a claim **if and only if** the claim assumes the underlying causal structure and the range of environmental variance remain invariant.

  **Implementation Rule:**
  Given an estimate $h^2$ and a Claim $C$:
  1.  **Does $C$ refer to an individual?** $\to$ **Reject.** (Variance is a population property; individuals do not have variances.)
  2.  **Does $C$ imply an intervention (changing $E$)?** $\to$ **Reject.** (Interventions change the environmental variance $\sigma^2_E$, which changes the denominator of $h^2$, potentially altering the ratio without changing the genes.)
  3.  **Does $C$ refer to a population with a different environmental distribution?** $\to$ **Reject.** (Different $\sigma^2_E$ changes $h^2$.)
  4.  **Does $C$ refer to prediction or selection within the current population/environment?** $\to$ **Accept.** (This is what $h^2$ measures.)

  **Case Motivation:**
  *   **Motivates Rejection of (2):** Individuals don't have variances.
  *   **Motivates Rejection of (5) & (8):** Interventions change $\sigma^2_E$, violating the invariance condition.
  *   **Motivates Acceptance of (1):** Describes the current population variance structure.
  *   **Motivates Acceptance of (7):** The experiment *establishes* invariance of environment, isolating the genetic term.

  ### b) Critique of Your Verdicts

  Your verdicts are robust. Here is how the principle handles your trouble spots.

  **Cases 6 vs. 7 (Between Groups)**
  *   **Your Verdict:** Reject (6), Accept (7).
  *   **Analysis:** Correct.
  *   **Why:** In (6), Population A and B differ in environment. Because $h^2$ is estimated *within* groups, it tells you nothing about the *between*-group variance. The gap could be 100% environmental because the environmental means differ, even if environmental *variance* within groups is low.
  *   **Why (7) works:** Random assignment of individuals to environments breaks the correlation between Genotype ($G$) and Environment ($E$). If the gap persists when $E$ is randomized, the variance must track $G$. Note: In (7), you are not using the $h^2$ number to make the claim; you are using the **experimental design**. The $h^2$ is incidental; the randomization is the license.

  **Cases 5 vs. 8 (Malleability & Uniformity)**
  *   **Your Verdict:** Reject both.
  *   **Analysis:** Correct. These are the same point viewed from opposite directions.
  *   **Why:** $h^2 = \sigma^2_G / (\sigma^2_G + \sigma^2_E)$.
      *   In (5), you propose changing the *mean* of $E$. $h^2$ says nothing about means, only variance. Even if you change the variance of $E$ (e.g., give everyone the nutrient), you are changing the denominator. A high $h^2$ often exists *because* $\sigma^2_E$ is currently small (everyone has similar nutrition). Making $\sigma^2_E$ larger lowers $h^2$ without changing $\sigma^2_G$.
      *   In (8), you made $E$ uniform ($\sigma^2_E \to 0$). The ratio goes to 1.0. The genes didn't get "stronger"; the competition from environmental variance disappeared.
  *   **Verdict:** Your intuition that these are the same point is correct. Both rely on the fact that $h^2$ is a ratio sensitive to the denominator.

  **Case 9 (The Pathway)**
  *   **Your Verdict:** Accept both (Variance is genetic, Mechanism is environmental).
  *   **Analysis:** Correct.
  *   **Why:** $h^2$ measures correlation with genotype, not direct biological imposition. If Genes $\to$ Preference $\to$ Practice $\to$ Skill, the variance in Skill tracks Genes. Statistically, it is heritable. Causally, the proximal cause is environmental (practice).
  *   **Resolution:** The discomfort is psychological, stemming from the colloquial meaning of "genetic" (implying "fixed/biological"). In data terms: $h^2$ captures **upstream variance sources**, regardless of the number of hops in the causal graph. Your database analogy is perfect: if Request Size causes Latency, and Client Config causes Request Size, Latency variance is "attributable" to Client Config, even if Config doesn't touch the server directly.

  **Case 11 (Scale)**
  *   **Your Verdict:** Uneasy.
  *   **Analysis:** This is **not a quibble**, but it is not a bug either. It is a feature of variance ratios.
  *   **Why:** Variance is not scale-invariant. $\text{Var}(\log X) \neq \log(\text{Var}(X))$. Non-linear transformations change the relative contribution of additive vs. non-additive effects.
  *   **Verdict:** Keep the unease. It signals that $h^2$ is not a fundamental property of the trait (like mass), but a property of the trait *measurement* in a specific context. It reinforces the rule: $h^2$ is about the data distribution, not the underlying reality.

  ### c) What $h^2$ Positively Licenses

  If $h^2$ doesn't tell us about individuals or interventions, why calculate it? It licenses two specific things:

  1.  **Prediction of Selection Response (The Breeder's Equation):**
      *   **Action:** If you select the top 10% of $P$ based on $T$ and breed them (or replicate their configuration), $h^2$ predicts how much the mean of $T$ will shift in the next generation *under the same environmental conditions*.
      *   **Formula:** $R = h^2 \times S$ (Response = Heritability $\times$ Selection Differential).
      *   **Constraint:** This only works if the causal structure remains invariant. If you select for "database speed" by optimizing code (environment), $h^2$ doesn't apply. If you select for "database speed" by choosing faster hardware architectures (genotype), it does.

  2.  **Prediction of Variance in Unmeasured Relatives:**
      *   **Action:** It allows you to predict the variance of $T$ in a sibling or offspring given the value of $T$ in the proband, again assuming status quo environments.
      *   **Utility:** It quantifies how much information knowing the genotype (or a proxy like family history) gives you about the phenotype *in the current system*.

  **Summary:** $h^2$ is a metric of **predictability** under **status quo replication**, not a metric of **malleability** under **intervention**.

  ### d) Verdicts on New Cases

  **Case 1: Within-Family Design vs. Population Estimate**
  *   **Scenario:** Population $h^2 = 0.6$. Within-family (sibling) $h^2 = 0.3$.
  *   **Verdict:** The within-family estimate is the better measure of **causal genetic impact**. The population estimate is inflated by **Gene-Environment Correlation ($r_{GE}$)**.
  *   **Meaning of the Gap:** The gap (0.3) represents variance that looks genetic in the population because genes and environment are correlated (e.g., high-genotype parents provide high-quality environments), but disappears when you hold the family environment constant.
  *   **Which is "The" Heritability?** If your goal is evolutionary prediction, use Population $h^2$ (selection acts on the total correlation). If your goal is causal understanding or policy, use Within-Family $h^2$ (isolates the genetic effect from the confounded environment).

  **Case 2: Out-of-Range Intervention**
  *   **Scenario:** Intervention pushes $E$ outside the observed range in $P$.
  *   **Verdict:** The existing $h^2$ estimate provides **zero evidence** about the effect.
  *   **Reasoning:** This is extrapolation beyond the support of the data. Variance decomposition describes the slope of the relationship *within* the observed cloud of points. It does not describe the function outside that cloud. The trait could hit a ceiling, a floor, or a phase transition.
  *   **Action:** Treat the estimate as undefined for this query. You need a structural model, not a variance ratio.

  ### e) The Counterfactual Quantity You Actually Want

  You asked: *"If what I actually want is some counterfactual quantity — how far T would move if we moved this variable — then say what that quantity is... whether it is estimable... and how it relates to $h^2$."*

  **1. The Quantity:**
  The quantity you want is the **Average Causal Effect (ACE)** of the intervention.
  In your terms: $\mathbb{E}[T \mid \text{do}(E = e_{new})] - \mathbb{E}[T \mid \text{do}(E = e_{old})]$.
  This is the slope of the causal mechanism, not the ratio of variances.

  **2. Estimability:**
  *   **From $h^2$ data alone:** **No.** It is not estimable.
  *   **Reason:** $h^2$ is derived from observational covariance. Without randomization (like Case 7) or a valid instrumental variable, you cannot separate the effect of $E$ from the effect of $G$ (which may be correlated with $E$).
  *   **Even with Randomization:** You can estimate the ACE of *that specific intervention*, but you cannot generalize it to *other* interventions based on $h^2$.

  **3. Relation to $h^2$:**
  *   **Orthogonal.** There is no necessary mathematical relationship between $h^2$ and ACE.
  *   **Example:** A trait can have $h^2 = 1.0$ (all variance is genetic because everyone has the exact same environment) but have a massive ACE (changing the environment cures the condition completely, e.g., Phenylketonuria).
  *   **Example:** A trait can have $h^2 = 0.0$ (all variance is environmental because everyone is genetically identical) but have zero ACE (the environmental factor varying is irrelevant to the trait).

  **4. The Honest Conclusion:**
  If your goal is to decide **which interventions to fund** or **how much a trait can change**, $h^2$ is the **wrong statistic**.
  *   $h^2$ answers: "How much do people differ due to genes right now?"
  *   ACE answers: "How much will the trait change if I do X?"

  You should treat $h^2$ as a **system diagnostic** (telling you where the current noise is coming from), not a **control parameter** (telling you how the system responds to inputs). Your intuition in Case 5 ("the estimate gives no evidence at all") is the correct one to generalize. High heritability implies stability under the *current* regime, not resistance to *new* regimes.

  ### Summary for your Workflow

  1.  **When you see $h^2$:** Treat it as "Proportion of current variance correlated with genotype."
  2.  **When asked about Individuals:** Say "Undefined."
  3.  **When asked about Interventions:** Say "Unknown without experimental data on that intervention."
  4.  **When asked about Group Differences:** Say "Unknown without randomization of environment."
  5.  **When asked about Prediction:** Say "Valid only for selection/replication within the current environmental distribution."

  Your gut was right. The number describes the *variance*, not the *valve*.
