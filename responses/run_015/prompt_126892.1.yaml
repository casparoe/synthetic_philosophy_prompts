answer: |-
  Scenario
  Marcus, long-term unemployed, enters a university psychology lab seeking income. The researcher explains a competitive reaction-time task involving mild electric shocks and noise bursts designed to induce stress. Marcus is told the study measures stress tolerance under competition. All physical risks, including temporary anxiety and minor skin irritation, are disclosed. He may withdraw at any moment without penalty and retain the full $150 stipend, equaling his weekly grocery and transit budget. The procedures are exactly as described; only the hypothesis is hidden. The researcher emphasizes there is no coercion. Marcus, needing funds for sustenance, signs the form. He completes the task, unknowingly assigning blame to a partner for errors. The deception concerns only the scientific aim, not the physical experience or compensation. Marcus understands the mechanics but remains unaware that his moral judgments, not stress levels, are the true data points. He leaves with the money.

  The Three Verdicts
  The informational account judges consent valid because Marcus received all material facts regarding risks, procedures, and compensation. Since nothing physically harmful was hidden and withdrawal was unrestricted, his authorization meets the threshold for informed permission. He knew exactly what would happen to his body and wallet. Conversely, the autonomy-based account declares consent invalid. It argues that self-governance requires understanding the meaning of one's actions; by hiding the true purpose, the researchers manipulate Marcus's reasoning, preventing him from aligning the act with his values. He cannot authorize what he does not comprehend conceptually. If he knew it was about blame, he might refuse on moral grounds. Furthermore, his severe economic constraint compromises the voluntariness of his choice, rendering him a means to an end rather than a co-author of the research. His necessity overrides his freedom, making the choice coerced by circumstance. Finally, a transactional account views consent as a fair exchange of services for compensation. Since both parties understood the terms of trade—time and discomfort for money—and no fraud occurred regarding the exchange itself, the agreement stands as mutually understood and binding. This view separates the scientific intent from the contractual obligation, validating the consent based on the fairness of the transaction rather than the depth of scientific understanding or the background economic conditions. It treats the lab like a marketplace where the product is labor, not moral alignment, ensuring stability in research recruitment. This perspective prioritizes reliability in recruitment over deep moral engagement, suggesting that as long as the exchange is honest regarding tangible costs and benefits, the social contract is fulfilled without needing full transparency on intellectual goals.

  The Separating Feature
  The core divergence lies in whether consent requires understanding the *purpose* of the act or merely the *nature* of the act. The informational account focuses on physical and financial mechanics: did the participant know what would happen and what they would get? The autonomy account demands normative alignment: did the participant know *why* this was happening and could they choose freely without desperate necessity? The hidden hypothesis combined with economic desperation drives the split. For the informationalist, these are background details; for the autonomist, they are constitutive of agency itself. Without knowing the why, the action lacks moral authorship.

  Removing the Pressure
  If the economic pressure is removed, the autonomy-based verdict likely remains invalid. The deception regarding the study's purpose still undermines self-governance by preventing Marcus from aligning the action with his values. He is still manipulated into providing data he might morally reject. Removing financial desperation eliminates the coercive element, making the choice more voluntary. However, most maintain lying about purpose fundamentally violates respect for persons. The consent remains invalid because the participant cannot authorize the true nature of the interaction, regardless of financial need. The deception alone suffices to undermine moral authorship, even if the choice is economically free.

  The Informational Counterattack
  A defender of the informational account would argue that requiring disclosure of the hypothesis imposes an impossible burden on research validity. If every participant knew the true aim, their behavior would change, ruining the data. They would claim that autonomy is respected by ensuring safety and voluntary exit, not by satisfying intellectual curiosity about scientific goals. The participant sold their labor and time, not their moral endorsement of the hypothesis. As long as the physical risks and compensation are clear, the participant has sufficient control to protect their interests. Demanding full purpose disclosure privileges philosophical ideals over practical research needs.
