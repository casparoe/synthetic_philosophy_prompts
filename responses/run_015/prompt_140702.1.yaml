      *   **Additional Output:** Flag incompatible requirements. Identify the most exclusionary requirement. Compare three existing approaches (ITN, Marginal CEA, Portfolio/Robustness) against the spec.

  2.  **Deconstruct the Constraints & Context:**
      *   *Small Foundation:* Means they are price-takers in most markets, but potentially price-makers in niche causes.
      *   *Fixed Pot/10-Year:* Implies a budgeting constraint and a need for intertemporal allocation (spending rate).
      *   *Broad Causes:* Aggregation problem. Can't just evaluate specific interventions.
      *   *No Coordination/Observation:* High uncertainty about others' actions. Makes counterfactuals hard.
      *   *Fixed Purpose:* The prompt insists the purpose is fixed (maximizing expected value within the constraints), not open-ended.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Problem 1: ITN Interdependence.*
          *   Standard ITN multiplies $I \times T \times N$. But $N$ affects $T$ (crowding).
          *   Requirement needs to enforce a unified metric of *marginal impact*.
          *   *Draft Req:* Marginal Expected Value per Dollar.
          *   *Motivation:* Avoids double counting. $N$ is just a derivative of the cost curve.
          *   *Status:* Non-negotiable (mathematical necessity).

      *   *Problem 2: Marginal vs. Average.*
          *   Causes aren't buckets; they are curves.
          *   Requirement needs to evaluate the *next* dollar, not the average.
          *   *Draft Req:* Marginal Valuation.
          *   *Motivation:* Diminishing returns. Spending changes the landscape.
          *   *Status:* Non-negotiable.

      *   *Problem 3: Counterfactuals.*
          *   Who would have done this? If I don't, does it happen anyway?
          *   Requirement needs to define the "baseline scenario."
          *   *Draft Req:* Explicit Counterfactual Baseline.
          *   *Motivation:* Fungibility. If money displaces a government, impact is zero.
          *   *Status:* Non-negotiable.

      *   *Problem 4: Non-additive Returns (Thresholds).*
          *   Some things only work if fully funded.
          *   Requirement needs to account for probability of success based on total funding (including others).
          *   *Draft Req:* Probabilistic Threshold Modeling.
          *   *Motivation:* All-or-nothing projects.
          *   *Status:* Preference (depends on cause type, but crucial for some). Let's make it Non-negotiable for *adequacy* given the prompt's demand to handle this.

      *   *Problem 5: Axiological Uncertainty.*
          *   Different moral views yield different values.
          *   Requirement needs to aggregate across moral theories (moral uncertainty).
          *   *Draft Req:* Moral Uncertainty Integration.
          *   *Motivation:* Avoiding paralysis or dogmatism on deep philosophical questions.
          *   *Status:* Preference (some foundations are dogmatic). But the prompt asks to handle it. Let's mark it Non-negotiable for *this specific spec* because the prompt demands it be handled.

      *   *Problem 6: Time Horizon/Spending Rate.*
          *   10-year horizon. Spend now or later?
          *   Requirement needs to address intertemporal optimization.
          *   *Draft Req:* Intertemporal Budget Constraint.
          *   *Motivation:* Money has time value; opportunities arrive over time.
          *   *Status:* Non-negotiable (given the 10-year constraint).

  4.  **Refining the Requirements (Checking against "Do Real Work"):**
      *   Make sure they aren't just "Calculate EV." They need to specify *how* to handle the specific pitfalls mentioned.
      *   *Refinement on ITN:* Call it "Unified Marginal Impact Function."
