answer: |-
  # Specification: Cause-Prioritization Framework (CPF-v1.0)

  **Purpose:** To maximize risk-adjusted expected moral value generated by a fixed capital endowment over a ten-year horizon, allocated across broad cause areas without reliance on coordination or private information regarding other funders.

  **Scope:** This specification defines the necessary conditions for any ranking method to be considered adequate for the stated purpose. Methods failing any **Non-Negotiable** requirement are deemed inadmissible.

  ---

  ## 1. Requirements Specification

  ### Req 1.0: Unified Marginal Impact Metric
  *   **Specification:** The framework must calculate value using a single continuous function $V(F)$, where $V$ is expected moral value and $F$ is cumulative funding. "Importance," "Tractability," and "Neglectedness" must be derived as properties (derivatives or parameters) of this single function, not scored as independent multiplicative inputs.
  *   **Motivating Case:** Standard ITN (Importance, Tractability, Neglectedness) scoring double-counts variables. Neglectedness determines the price point on the cost curve; Tractability is the slope of that curve. Treating them as independent factors inflates uncertainty and creates mathematical incoherence (e.g., counting "crowdedness" in both the Neglectedness score and the Tractability score).
  *   **Status:** **Non-Negotiable.**

  ### Req 2.0: Dynamic Funding Curves (Marginality)
  *   **Specification:** The framework must rank *marginal* dollars, not average dollars. The value function $V(F)$ must be updated iteratively to reflect the foundation's own cumulative spending. The ranking of a cause area at Year 1 must be allowed to differ from Year 5 as the cheap opportunities within that cause are exhausted.
  *   **Motivating Case:** Cause areas exhibit diminishing returns. A method that ranks "Global Health" as a monolithic block fails to recognize that the first $1M might buy bednets (high value) while the tenth $1M buys health system strengthening (lower marginal value). Static cause ranking leads to over-investment in initially attractive causes.
  *   **Status:** **Non-Negotiable.**

  ### Req 3.0: Fungibility-Adjusted Baseline
  *   **Specification:** Every impact calculation must explicitly state the counterfactual agent whose actions are being displaced or enabled. The framework must distinguish between: (a) **Vacuum** (nothing happens without us), (b) **Substitution** (another funder steps in), and (c) **Leverage** (our funding triggers others). In the absence of coordination data (per scope), a probability distribution over these states must be applied.
  *   **Motivating Case:** In mature cause areas, funding is often fungible. If a foundation funds a project the government would have funded anyway, the marginal impact is zero (or negative, if it frees government resources for harmful ends). Ignoring the counterfactual agent leads to systematic overestimation of impact in crowded fields.
  *   **Status:** **Non-Negotiable.**

  ### Req 4.0: Probabilistic Threshold Integration
  *   **Specification:** For causes where impact is non-linear (e.g., policy change, existential risk reduction), the framework must model value as $P(Success | F_{total}) \times Impact$, where $F_{total}$ includes estimated external funding. It must not assume additive returns where a fraction of funding yields a fraction of impact.
  *   **Motivating Case:** Many high-upside opportunities are "lumpy." Funding 50% of a policy campaign may yield 0% of the benefit if the bill fails. Standard marginal analysis assumes smooth curves; this requirement forces the model to account for the risk that the foundation's contribution falls short of the necessary threshold, rendering the spend worthless.
  *   **Status:** **Non-Negotiable.**

  ### Req 5.0: Moral Weight Distribution
  *   **Specification:** The output of the framework must not be a single scalar value. It must be a vector or distribution of expected value across at least three axiological perspectives (e.g., Total Utilitarianism, Person-Affecting View, Prioritarianism). Final allocation decisions must be made based on a voting or weighting rule over these distributions, not by collapsing them prematurely.
  *   **Motivating Case:** Different moral theories rank causes differently (e.g., animal welfare vs. long-termism). Collapsing these into a single "expected value" early hides the risk that a strategy is optimal only under a controversial moral view. This preserves option value and protects against moral dogmatism.
  *   **Status:** **Preference** (Required for this specification, but many foundations operate under a single fixed moral view).

  ### Req 6.0: Intertemporal Budget Constraint
  *   **Specification:** The framework must include a discount rate or investment return assumption that compares the value of spending now versus retaining capital for future opportunities. It must optimize for the 10-year horizon, not just the immediate fiscal year.
  *   **Motivating Case:** With a fixed pot and a decade horizon, spending $1M today has an opportunity cost of not having that $1M (plus returns) in Year 5. Causes that mature later may be undervalued by frameworks that do not explicitly model the time-value of capital and information.
  *   **Status:** **Non-Negotiable.**

  ---

  ## 2. Conflict Analysis

  **Incompatible Pair:** **Req 2.0 (Dynamic Funding Curves)** and **Req 4.0 (Probabilistic Threshold Integration)**.

  *   **Reasoning:** Req 2.0 implies a differentiable value function where marginal value can be calculated at any point (calculus-based optimization). Req 4.0 implies step-functions or discontinuities where marginal value is zero until a threshold is met, then spikes.
  *   **Resolution:** To satisfy both, the framework must smooth the threshold probabilities (e.g., using a sigmoid function) to make them differentiable. However, this introduces modeling noise. A framework that strictly enforces hard thresholds cannot perform smooth marginal optimization; a framework that performs smooth optimization must soften the reality of thresholds.

  ## 3. Exclusion Analysis

  **Most Exclusionary Requirement:** **Req 1.0 (Unified Marginal Impact Metric).**

  *   **Reasoning:** This requirement excludes the vast majority of existing cause-prioritization literature and practice, which relies on the heuristic multiplication of semi-independent ITN scores (e.g., $80,000$ Hours' early frameworks, Open Philanthropy's public write-ups). Most practitioners treat Neglectedness as a separate "bonus multiplier" rather than as a coordinate on a cost curve. Enforcing a unified function $V(F)$ requires a level of quantitative modeling that most broad-cause qualitative assessments do not possess.

  ---

  ## 4. Comparative Assessment of Existing Approaches

  **1. Three-Factor (ITN) Scoring**
  *   **Verdict:** **Inadequate.**
  *   **Analysis:** Fails **Req 1.0** fundamentally by treating interdependent variables as independent multipliers, inviting double-counting. Fails **Req 2.0** as it typically ranks "causes" rather than marginal dollars. Fails **Req 3.0** by usually assuming a "doing nothing" baseline rather than accounting for fungibility. It is a heuristic for initial screening, not an allocation framework.

  **2. Straight Marginal Cost-Effectiveness Analysis (CEA)**
  *   **Verdict:** **Partially Adequate.**
  *   **Analysis:** Satisfies **Req 1.0** and **Req 2.0** well, as it focuses on the cost per unit of outcome at the margin. However, it typically fails **Req 4.0** by assuming linear returns (e.g., cost per life saved is constant). It often fails **Req 3.0** by ignoring counterfactual displacement (assuming the outcome wouldn't happen otherwise). It usually collapses **Req 5.0** into a single monetary or QALY value.

  **3. Portfolio / Robustness-Weighted Expected Value**
  *   **Verdict:** **Most Compliant.**
  *   **Analysis:** Best handles **Req 5.0** (Moral Uncertainty) and **Req 4.0** (by treating thresholds as risk factors in a portfolio). It can satisfy **Req 3.0** if counterfactuals are treated as risk variables. However, it often struggles with **Req 2.0**; portfolio approaches sometimes allocate based on "diversification" or "robustness" rather than strict marginal value curves, potentially leaving high-marginal-value dollars unspent in favor of hedging. It is the only approach capable of meeting the full specification if rigorously quantified.
