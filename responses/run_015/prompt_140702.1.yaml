      *   *Straight Marginal CEA:* Good on Req 1 & 2. Fails Req 4 (thresholds) and Req 5 (moral uncertainty) usually. Fails Req 3 if it ignores fungibility.
      *   *Portfolio/Robustness:* Good on Req 5 (uncertainty). Often vague on Req 1 & 2 (often uses heuristics).

