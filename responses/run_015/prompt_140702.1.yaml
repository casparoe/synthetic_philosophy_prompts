  5.  **Addressing the "Incompatibility" and "Exclusion" Questions:**
      *   *Incompatibility:* Marginal Valuation (Req 2) vs. Threshold Modeling (Req 4). Marginal analysis assumes smooth curves; thresholds imply discontinuities. You can't easily do calculus on a step function without smoothing, which loses the threshold nature.
