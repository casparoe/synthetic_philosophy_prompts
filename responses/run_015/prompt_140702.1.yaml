      *Refining the "Incompatibility":* The tension is between *Marginal Valuation* (which implies differentiability/continuity) and *Threshold Effects* (which imply discontinuity). You can model thresholds probabilistically to smooth them, but that adds complexity. I will flag this tension.

      *Refining the "Exclusion":* The requirement for *Unified Marginal Impact* (deriving ITN from one quantity) excludes the vast majority of EA cause prioritization which uses the heuristic multiplication of three semi-independent scores.

  9.  **Final Polish:** Check tone. Ensure it sounds like a technical specification document. Ensure the comparison section is concise.

      *(Final check on the "Fixed Purpose" constraint)*: The prompt says "I want the purpose fixed rather than left open." I need to state the purpose clearly at the start. Purpose: Maximize risk-adjusted expected moral value over a 10-year horizon subject to a fixed budget.

