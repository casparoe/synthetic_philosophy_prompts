  Elena grips the chair during physio, rating the stretch an eight and jerking her arm back when the therapist pushes harder. She accepts a £50 charge to stop the maneuver immediately, breathing heavily until it ceases. Yet, when booking next week's session, she declines the same £50 surcharge to reduce the intensity, though she eagerly pays it to avoid the clinic's nauseating disinfectant smell or a fifteen-minute wait. She describes the pain accurately as sharp and burning, reports wanting it to stop while it happens, and maintains normal aversion to headaches and fatigue. She signs the consent form for the high-intensity protocol without hesitation, declining the intensity-reduction option despite accepting it for other aversives.

  (1) Sensory-Intensity: The sensation is rated 8/10, described as sharp/burning, and interrupts behavior. Verdict: Bad.
  (2) Motivational: She jerks away and pays £50 to cease the stimulus immediately. It produces occurrent aversion. Verdict: Bad.
  (3) Attitudinal: She declines £50 to prevent recurrence, while paying to avoid smells or waits. It lacks standing negative attitude. Verdict: Not Bad (for wellbeing).

  The structural feature is the dissociation between occurrent motivational force and prospective aversion. Elena exhibits avoidance behavior in the moment but excludes the experience from future cost-benefit analysis.

  If we restore prospective aversion (she pays to prevent later), all three views converge on "Bad," restoring the dialectical deadlock. If we remove occurrent motivation (she sits still) or spread indifference (she ignores the smell), View (2) flips to "Not Bad," aligning with (3). View (1) remains stable if sensory reports hold, highlighting its independence from motivation.

  The strongest reply for (2) is constitutive: "Badness *is* the occurrent want-it-to-stop-ness. Her future refusal is irrational akrasia or compartmentalization, not evidence that the experience lacked negative valence." This lands if wellbeing is purely a sum of momentary states. It fails if wellbeing requires coherent preference satisfaction over time, as the attitudinal view holds.

  The case cannot prove the Attitudinal View is correct. It only demonstrates the divergence. I must argue separately why prospective cost, rather than occurrent drive, is the true metric of welfare contribution. The vignette isolates the variables; it does not weigh them. It shows the concepts come apart, not which one tracks value.
