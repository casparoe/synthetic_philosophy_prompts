answer: |-
  Arthur chose the sensation carefully. It wasn't pain, which begged for relief, nor hunger, which begged for food. It was a specific, hollow lurch behind the sternum, a micro-fall in equilibrium that happened sometimes when he stood up too quickly from a deep chair. It lasted less than a second. It had no name.

  He bought a notebook with thick, cream-colored paper and a pen that flowed without resistance. On the first page, he drew a symbol: a small circle bisected by a vertical wave. He decided that this mark would stand for the lurch. Not the word "lurch," but the thing itself.

  The protocol was strict. When the lurch happened, he would sit back down immediately. He would close his eyes and focus on the spot behind the breastbone until the echo of the sensation was perfectly clear in his mind. He would hold that focus, point his attention at it as one points a finger, and then open his eyes and draw the symbol. He did not write the date. He did not write the context. Only the mark. The mark was the sample.

  For five years, the notebook filled. Arthur was scrupulous. He sat in the same chair, used the same pen, kept the room at the same temperature. He trusted his attention. When he made a mark, he felt a click of recognition, a sense of fit between the ink and the inner event. He believed he was building a map of a private terrain.

  In the sixth year, on a Tuesday afternoon, Arthur opened the notebook to review the data. He wanted to see if the frequency of the lurch changed with the seasons. He laid the book flat and smoothed the pages.

  He looked at the marks from the first year. They were tight, the wave sharp, the circle small.
  He looked at the marks from the fifth year. They were looser, the wave broader, the circle slightly larger.

  Arthur frowned. He sat in his chair and waited. He stood up quickly. The lurch came. He sat down, closed his eyes, and found the feeling. It felt familiar. It felt like the thing he had been tracking. He opened his eyes and drew the symbol.

  He looked at the new mark. It looked like the ones from the fifth year. It did not look like the ones from the first year.

  He stared at the page. A question formed, but it had no traction. Had the sensation changed over five years? Had his hand drifted? Or had the sensation always been two different things, and he had only just now noticed the difference?

  He tried to check. He conjured the memory of the lurch from five years ago. But the memory was just a present image. It carried no authority over the past event other than what he gave it now. He looked at the old mark. It seemed correct for what he remembered then. He looked at the new mark. It seemed correct for what he felt now.

  There was no third thing to compare them to. There was no sample kept in a vault. There was only the book and the feeling, and the feeling was gone as soon as it arrived. If he said the old marks were wrong, he had no reason to say so except that they were different. If he said the sensation had changed, he had no evidence except the marks.

  Whatever seemed right to him was right. And because whatever seemed right was right, the word "right" had lost its work to do.

  He closed the notebook and walked to the kitchen. His niece, Clara, was sitting at the table, drawing with crayons. She was seven. She liked patterns.

  "What are you doing, Uncle Arthur?" she asked.

  "Keeping a record," he said. He sat beside her and opened the notebook to a fresh page. He waited. He stood up quickly. The lurch came, familiar as a heartbeat. He sat, focused, and drew the symbol. The loose, fifth-year version.

  "Can I do it?" Clara asked.

  "It's for a specific feeling," Arthur said. "A drop inside. Here." He touched his sternum.

  "Like being scared?"

  "No. Just a drop."

  "Show me."

  Arthur realized he couldn't. He could point to his chest, but he couldn't point to the *this*. He could describe the circumstances—standing up quickly—but she might feel a rush of blood, or a moment of dizziness, or nothing at all.

  "Try," he said.

  Clara stood up quickly. She frowned. She sat down. She picked up a crayon and drew a circle with a wavy line. Her line was jagged. Her circle was lopsided.

  "Is that it?" Arthur asked.

  "It's the drop," she said.

  Arthur looked at her mark. It looked different from his. But how could he correct her? If he said, "No, the line must be smoother," she would ask why. If he said, "Because the feeling is smooth," she would ask how she could know if her feeling was smooth. He had no way to show her the rule. He had no way to show her that she was wrong. If she felt sure she had the drop, then for her, she had the drop.

  He looked at her mark. It was a drawing of a drop. His mark was... what?

  He looked back at his notebook. For years he had treated the pages as a ledger, a place where truth was stored. But a ledger requires a currency that holds its value. If he couldn't teach Clara the value of the coin, if he couldn't be wrong about the exchange rate, then it wasn't currency.

  It wasn't data.

  He looked at the rows of symbols. They were not descriptions of the lurch. They were occurrences of the lurch, extended into ink. When he made the mark, he wasn't saying *this happened*. He was doing something else. He was enacting the sensation again. He was giving it a shape outside the body so it wouldn't just vanish.

  The mark was not a report. It was a echo.

  "Uncle Arthur?" Clara said. "Why does your picture look different than mine?"

  "Because it's mine," he said.

  "Can I keep it?"

  "Yes."

  Clara took the crayon and drew another one next to his. Then another. She wasn't recording anything. She was playing with the shape. She was making a pattern.

  Arthur watched her. He realized he had been lonely with the book. Not because no one else could feel the lurch, but because no one else could check the math. There was no math. There was only the making.

  He took the pen and drew another symbol on the page. He didn't check it against the past. He didn't check it against the feeling. He simply let the hand move as the feeling moved. It felt like a sigh that had found a way to stay on the paper.

  He closed the book. He didn't put it on the shelf with the ledgers and the logs. He put it on the mantle, next to the photographs. It wasn't a tool for knowing. It was a thing he had made, like a chair or a song.

  "Look," Clara said, holding up her page. "I made a whole row of them."

  "They look good," Arthur said.

  "They feel like falling," she said.

  "Yes," Arthur said. "They do."

  He left the book open on the table. The marks sat there, silent and precise. They did not tell him what the lurch was. They showed him where he had been when it happened. And that was enough.
