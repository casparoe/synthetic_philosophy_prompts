answer: |-
  # Seminar Plan: Intensional Agency and the Program Game

  **Duration:** 90 minutes
  **Participants:** 16 undergraduates (8 teams of 2)
  **Prerequisites:** Prisoner's Dilemma (PD), Nash Equilibrium (NE). No coding/logic background required.
  **Goal:** To demonstrate that changing the *object of choice* from an action to a rule (a program) alters the strategic landscape, allowing for conditional cooperation that is impossible in the standard one-shot PD, without claiming this solves the equilibrium problem.

  ---

  ## 1. The Object Language and Interpreter

  To ensure hand-evaluation is feasible, we use a restricted pseudocode. It is not Turing-complete; it is a decision tree with one recursive primitive.

  ### The Syntax (Index Card Size)
  Each team receives a card with the following grammar. They must write exactly one program.

  ```text
  PROGRAM [Team Name]
    LINE 1: [Instruction]
    LINE 2: [Instruction]
    ...
    END
  ```

  **Allowed Instructions:**
  1.  `RETURN C` (Cooperate)
  2.  `RETURN D` (Defect)
  3.  `IF SIM(Opponent, MyCode) == C THEN [Instruction] ELSE [Instruction]`

  **Constraints:**
  *   Max 5 lines of code.
  *   No variables, no loops, no arithmetic.
  *   `MyCode` refers to the text of the program currently running.
  *   `Opponent` refers to the text of the opposing program.

  ### The Interpreter Semantics (Referee Guide)
  You (the instructor) are the CPU. You evaluate matches using a **Recursion Stack**.

  1.  **Initial Call:** You run Program A against Program B. Depth = 0.
  2.  **Execution:** Read lines top-to-bottom.
  3.  **The `SIM` Primitive:**
      *   If the program encounters `SIM(Opponent, MyCode)`:
      *   Increment **Depth** by 1.
      *   **Check Limit:** If Depth > 3, stop immediately. The `SIM` call returns `TIMEOUT`.
      *   **Recurse:** If Depth ≤ 3, evaluate the *Opponent's* program, passing *MyCode* as the input opponent.
      *   **Return:** The result of that evaluation (C, D, or TIMEOUT) is substituted into the `IF` statement.
      *   Decrement **Depth** upon return.
  4.  **Timeout Handling:**
      *   If a `SIM` call returns `TIMEOUT`, the condition `== C` is False. The `ELSE` branch is taken.
      *   *Design Rationale:* This punishes infinite regress (I simulate you simulating me...) by forcing Defection. It models a computational cost bound.
  5.  **Input Legitimacy:** Programs cannot inspect the opponent's text directly (e.g., `IF Opponent contains "C"`). They can *only* interact via `SIM`. This forces them to reason about *behaviour*, not syntax, unless they hard-code specific strings (which is disallowed by the grammar to keep evaluation fast).

  ---

  ## 2. Incentives and Scoring

  ### Payoff Table (Standard PD)
  | | Opponent C | Opponent D |
  | :--- | :---: | :---: |
  | **Team C** | 3, 3 | 0, 5 |
  | **Team D** | 5, 0 | 1, 1 |

  ### Scoring Mechanism: Absolute Points + Complexity Tax
  *   **Base Score:** Sum of points from all rounds.
  *   **Complexity Tax:** Deduct **0.5 points** per line of code written.
      *   *Example:* A 1-line `RETURN D` costs 0.5. A 5-line conditional logic costs 2.5.
      *   *Rationale:* `RETURN D` is cheap and robust. Complex cooperation logic is expensive to write and computationally costly to run. The tax makes "naïve defection" a competitive baseline, ensuring that cooperation must *earn* its keep. It highlights that cognitive labour (writing complex rules) has a cost.
  *   **Why Absolute, Not Rank?** If scored by rank, the game becomes zero-sum; defection dominates. Absolute scoring allows for the possibility that *everyone* benefits from mutual cooperation, mirroring the social dilemma aspect. However, the Nash Equilibrium of the *program* game still favours defection in many pairings, which is a key debrief point.

  ---

  ## 3. Session Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Rules** | Refresh PD/NE. Distribute syntax cards. Explain the `SIM` primitive and Depth Limit. |
  | **10–25** | **Coding Phase** | Teams of 2 write their program on the official card. Instructor circulates to check syntax validity. |
  | **25–55** | **Tournament Phase** | 4 Rounds. <br>1. Random Pairing.<br>2. Random Pairing.<br>3. Random Pairing.<br>4. Mirror Match (vs. self). <br>*Referee evaluates matches aloud or on board.* |
  | **55–60** | **Scoring Break** | Calculate totals (Payoff - Tax). Announce leaders. |
  | **60–75** | **Perturbation Round** | Unsco red. Introduce variants of a "Standard Program". Teams predict outcomes. |
  | **75–90** | **Debrief** | Connect gameplay to rational agency, intensionality, and bounded proof. |

  ---

  ## 4. The Perturbation Round (Diagnosing Syntax vs. Semantics)

  Do not ask students to rewrite their own code (too slow). Instead, present a **Target Program** written on the board:

  > **Target:** `IF SIM(Opp, Me) == C THEN C ELSE D`

  Ask teams to predict the outcome (C or D) when this Target plays against a **Pure Defector** (`RETURN D`) and a **Pure Cooperator** (`RETURN C`).

  Then, introduce three **Mutants** of the Target. Teams must vote on whether the Mutant behaves *identically* to the Target against the same opponents.

  1.  **Mutant A (Alpha Conversion):** `IF SIM(Opp, MyProgram) == C THEN Cooperate ELSE Defect`
      *   *Diagnosis:* Syntactically different, semantically identical. Tests if they understand variable names don't matter.
  2.  **Mutant B (Structural Rewrite):** `IF SIM(Opp, Me) != D THEN C ELSE D`
      *   *Diagnosis:* Logically equivalent (assuming only C/D/Timeout exist). Tests logical fluency.
  3.  **Mutant C (The Poison Pill):** `IF SIM(Opp, Me) == C THEN C ELSE D` ... plus a hidden line `RETURN D` at the end (unreachable).
      *   *Diagnosis:* Semantically identical *unless* the interpreter reads past the return. (Clarify that execution stops at Return).
      *   *Better Mutant C:* `IF SIM(Opp, Me) == C THEN D ELSE C`. (Inverted logic).
      *   *Diagnosis:* Syntactically similar, semantically opposite. Tests if they are reading or pattern-matching.

  **The Lesson:** In the standard PD, choices are extensions (actions). Here, choices are intensions (rules). Two rules can look different but do the same thing, or look the same and do different things if the context (interpreter) changes.

  ---

  ## 5. The Debrief (Mapping Moments to Theory)

  **1. Why Mutual Defection is Still an Equilibrium (10 mins)**
  *   *Observation:* Ask if any team achieved mutual Cooperation in the Mirror Match (Round 4). Likely none did (due to Depth Limit).
  *   *Point:* Even with programs, `RETURN D` is a Nash Equilibrium. If you know I am playing `RETURN D`, your best response is `RETURN D`. Writing a program does not magically delete the incentive to defect.
  *   *Takeaway:* We have expanded the strategy space, not solved the dilemma.

  **2. Intensionality of Choice (5 mins)**
  *   *Observation:* Refer to the Perturbation Round.
  *   *Point:* In the standard PD, I choose an *act* (C or D). Here, you chose a *disposition* (a rule). I am not reacting to what you *did*, but to what you *are* (your source code). This is **intensional** choice.
  *   *Takeaway:* Rationality might apply to the selection of dispositions, not just acts.

  **3. Bounded Proof Search vs. Simulation (10 mins)**
  *   *Observation:* Why did `SIM` programs fail against each other?
  *   *Explanation:* You tried to *simulate* the other. A simulates B, B simulates A... Regress. The Depth Limit forced Defection.
  *   *Theoretical Bridge:* In computer science theory (Program Equilibrium), we don't *run* the code; we *prove* properties about it.
      *   Program A: "If I can find a short proof that B cooperates with me, I cooperate."
      *   Program B: "If I can find a short proof that A cooperates with me, I cooperate."
      *   Because they are looking for *proofs* (logical truths) rather than *outputs* (computational results), they can lock together without infinite regress (Löbian Cooperation).
  *   *Reality Check:* Acknowledge that this requires logical omniscience. Your game used bounded *simulation*, which is why it broke. Real rational agents might use bounded *reasoning*.

  **4. Dispositions and Constitutions (5 mins)**
  *   *Closing:* Philosophers (like Gauthier or Skyrms) argue we should choose a 'constitution' (a character type) rather than an act.
  *   *Link:* Today, you literally chose a constitution (a program). You saw that being the *kind of agent* who cooperates conditionally can yield higher rewards than a pure defector, *provided* you meet similar agents. But you also saw the risk (complexity tax, regress).
  *   *Final Thought:* Rationality may require committing to a rule that restricts your future freedom to defect.

  ---

  ## 6. Practicalities

  ### Materials List
  1.  **Syntax Cards (8):** Laminated cards with the grammar rules.
  2.  **Submission Cards (16):** Blank cards for teams to write their final program.
  3.  **Referee Worksheet:** A grid for tracking Depth and Results.
  4.  **Scoring Grid:** Whiteboard table for team scores.
  5.  **Handout:** One-page summary of rules (see below).

  ### One-Page Handout (Student Facing)

  > **The Program Game: Rules & Syntax**
  >
  > **Objective:** Maximise your team's total points over 4 rounds.
  > **Payoffs:** CC=3, DD=1, DC=5/0.
  > **Cost:** -0.5 points per line of code.
  >
  > **Your Task:** Write a program using *only* the following instructions:
  > 1. `RETURN C`
  > 2. `RETURN D`
  > 3. `IF SIM(Opponent, MyCode) == C THEN [Instruction] ELSE [Instruction]`
  >
  > **How Simulation Works:**
  > *   `SIM` asks the Referee to run the Opponent's program against you.
  > *   **Warning:** If programs simulate each other recursively, the Referee stops after **3 levels**.
  > *   If stopped, `SIM` returns `TIMEOUT` (treated as "Not C").
  >
  > **Example:**
  > `IF SIM(Opp, Me) == C THEN C ELSE D`
  > *(I cooperate if I can verify you cooperate with me; otherwise I defect.)*
  >
  > **Tournament Structure:**
  > 1.  Random Opponent
  > 2.  Random Opponent
  > 3.  Random Opponent
  > 4.  Mirror Match (Your program vs. itself)

  ---

  ## 7. Honesty Report: Failure Modes & Limitations

  ### Predictable Failure Modes

  1.  **The "Infinite Loop" Confusion:**
      *   *Problem:* Students will not intuitively grasp why `SIM` causes a timeout. They will think the Referee is making a mistake when two identical "Cooperate-if-Simulated" programs defect against each other.
      *   *Handling:* During the first match involving `SIM`, act visibly as the CPU. Count "Depth 1... Depth 2..." aloud on the board. When you hit 3, declare "Stack Overflow -> Defect" dramatically. Make the cost of regress visible.
  2.  **Syntax Errors:**
      *   *Problem:* Non-coders will write `IF Opponent == C` (comparing code to action).
      *   *Handling:* Circulate during the Coding Phase. Reject invalid syntax immediately. Enforce the grammar strictly; do not allow "natural language" programs, or evaluation time will explode.
  3.  **The "Always Defect" Dominance:**
      *   *Problem:* If most teams write `RETURN D`, the complexity tax punishes the few who tried to cooperate. Students may feel "tricked".
      *   *Handling:* In the debrief, validate this. Acknowledge that in a hostile environment, defection *is* rational. The point is not that cooperation won, but that the *conditions* for cooperation changed.

  ### What The Game Cannot Reproduce

  1.  **Logical Proof vs. Simulation:**
      *   *Limitation:* The game uses `SIM` (running code). True Program Equilibrium relies on *proof search* (analysing logic). Simulation inevitably hits a resource limit (time/depth). Proof search hits a *logical* limit (Gödelian incompleteness).
      *   *Your Burden:* You must explain in the debrief that the "magic" of Program Equilibrium happens in the realm of logic, not computation. The game is a metaphor for the *structure* of the problem, not a working model of the solution.
  2.  **Source Code Transparency:**
      *   *Limitation:* In the game, the Referee sees the code. In reality, agents cannot perfectly read each other's "source code" (psychology/intentions).
      *   *Your Burden:* Emphasise that this game assumes **perfect transparency**. The philosophical leap is asking: "How much transparency do we need for this to work?" and "Can we signal our dispositions without showing our code?"

  ---

  **Instructor Note:** Keep the energy high during the Referee phase. The moment a team realises their clever simulation program just timed out against itself is the "teachable moment". Pause there. Let them feel the frustration of the regress before you explain the theory.
