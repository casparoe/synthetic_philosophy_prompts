answer: |-
  **EXAMINATION PAPER**

  **Course:** Experimental Philosophy Seminar
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 words

  **Question 1**

  Consider the following case: A transport official adopts a new scheduling system to cut costs. She knows, but does not care, that this will add roughly one traffic death a year along a specific stretch of road. Participants judge that she *intentionally* caused the deaths. In a matched case where the side effect is saving one life a year, participants deny she *intentionally* saved anyone.

  Now suppose three further empirical findings are confirmed:
  (i) The asymmetry holds even when the official is **misinformed**: she believes the change will reduce deaths, but it increases them (and vice versa).
  (ii) The asymmetry holds when the side effect results from **omission** (letting a safety programme lapse) rather than action.
  (iii) In the omission condition, ascriptions of intentionality track ascriptions of **blame** far more closely than they track ascriptions of foresight or desire.

  Write an essay that addresses the following:
  1.  Distinguish the empirical claim (what people say) from the conceptual claim (what the word means) in this context.
  2.  Evaluate how three families of explanation—Norm-Violation accounts, Reasons/Explanation-based accounts, and Conversational/Pragmatic accounts—predict or accommodate findings (i) through (iii).
  3.  Identify which theoretical options remain live given these findings.
  4.  Describe one further study whose result would discriminate between the remaining live options regarding the semantics of "intentionally."

  ***

  **MODEL ANSWER**

  The core philosophical task here is to distinguish between an empirical regularity in folk psychology and the semantic content of the concept *intentional action*. The empirical claim is simply that participants' usage of the word "intentionally" varies with moral valence. This is well-replicated data. The conceptual claim is that moral considerations are *constitutive* of the concept itself. This is highly contested. One cannot move from the data to the concept without ruling out the possibility that the concept is stable but the *usage* is biased by performance errors or pragmatic pressures.

  We must evaluate the three theoretical families against the new suppositions. Reasons-based accounts (often called Deep Self or Attitude accounts) argue that intentionality ascriptions track the agent's attitudes (desires, beliefs, values). Supposition (i) severely damages this view. If the official believes she is saving lives but actually kills, and participants still say she "intentionally killed," then the ascription is not tracking her actual mental states. Her reasons were good, her belief was false, yet the negative ascription stands. This suggests the agent's psychology is less relevant than the outcome.

  Norm-Violation accounts argue that people call an action intentional when it violates a norm, primarily to facilitate blame. Supposition (iii) strongly supports this. If intentionality tracks blame closer than foresight or desire, it suggests the function of the ascription is evaluative rather than descriptive. Supposition (ii) regarding omissions also fits well here; norms apply to omissions (you ought to have maintained safety), and violating them invites blame, which drives the intentionality judgment. However, it is contested whether this means the *concept* is normative, or merely that the *application* is influenced by normativity.

  Conversational or Pragmatic accounts argue the concept is neutral (requiring only foresight and causal control), but speakers implicate blame by using the word "intentionally" in negative contexts. These accounts can accommodate (i) and (iii) by arguing that when a bad outcome occurs, speakers pragmatically highlight the agency to assign responsibility, regardless of the agent's mistaken belief. The mismatch in (i) is explained not by a change in the concept, but by a shift in what is conversationally relevant. When death occurs, the question "Who is responsible?" becomes salient, and "intentionally" is the tool used to answer it, even if the strict semantic conditions (like correct belief) aren't met.

  Given (i) and (iii), Reasons-based accounts are effectively eliminated. The agent's actual reasons and beliefs do not drive the judgment. The live options are the Norm-Violation (Competence) view and the Pragmatic (Performance) view. The Norm-Violation view holds that the folk concept of intentional action *includes* a normative component; to be intentional just is to be blameworthy in this context. The Pragmatic view holds that the concept is purely psychological, but moral pressure distorts reporting.

  To discriminate between these, we need a study that isolates semantic competence from pragmatic pressure. A suitable study would test intentionality ascriptions in a context where blame is impossible or irrelevant, but norm violation remains. For example, present a case where an agent causes a side effect that is "bad" relative to a norm but where no one is harmed and no blame is appropriate (e.g., violating a trivial rule of etiquette with no victims). If participants still ascribe intentionality, it suggests the concept is inherently normative (supporting Norm-Violation). If the effect disappears when blame is removed, it suggests the asymmetry is driven by the need to blame (supporting Pragmatics).

  Alternatively, one could replace the word "intentionally" with a technical synonym like "deliberately" or "on purpose" in a forced-choice task. If the asymmetry persists across synonyms, it suggests a conceptual shift. If it vanishes with "deliberately," it suggests a lexical-pragmatic feature specific to "intentionally." The crucial distinction is whether the moral valence changes the *truth conditions* of the claim (Competence) or merely the *assertability* (Pragmatics). The proposed study must target this truth-condition versus assertability gap. Without such evidence, we cannot conclude that morality is part of the concept rather than just a bias in its application.

  ***

  **MARKING SCHEME**

  **Total: 20 Marks**

  **1. Distinction between Empirical and Conceptual Claims (4 Marks)**
  *   **Criteria:** Student must clearly state that the data (what people say) is settled/replicated, but the implication for the concept (semantics) is contested. Must note that usage does not automatically equal meaning.
  *   **Common Error:** Treating the participants' judgments as direct proof of the concept's content without mentioning the performance/competence distinction.

  **2. Analysis of Supposition (i) on Reasons-Based Accounts (4 Marks)**
  *   **Criteria:** Student must explain that misinformation (belief/outcome mismatch) undermines accounts relying on the agent's actual mental states/reasons.
  *   **Common Error:** Ignoring the "misinformed" clause and arguing that Reasons accounts still work because the agent "should have known."

  **3. Analysis of Supposition (iii) on Normative vs. Psychological Tracking (4 Marks)**
  *   **Criteria:** Student must identify that tracking blame over foresight supports Normative/Pragmatic accounts over pure Folk-Psychological accounts.
  *   **Common Error:** Claiming this proves the Normative account is true, rather than saying it makes it a "live option" compared to others.

  **4. Identification of Live Options (4 Marks)**
  *   **Criteria:** Student must correctly identify the remaining debate as being between the Competence view (concept is normative) and the Pragmatic view (concept is neutral, usage is biased).
  *   **Common Error:** Leaving Reasons-based accounts as a live option despite the evidence in (i).

  **5. Design of Discriminating Study (4 Marks)**
  *   **Criteria:** Study must target the truth-condition vs. assertability distinction (e.g., removing blame potential, synonym substitution). Must explain *how* the result discriminates.
  *   **Common Error:** Proposing a replication of the original Knobe case or a study that merely gathers more intentionality ratings without changing the context to test semantics.
