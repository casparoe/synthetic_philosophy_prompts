answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Comparative Governance PhD Program
  **FROM:** Appeals Board Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Ethical Review of Student M.'s Fieldwork Conduct

  **BOTTOM LINE RECOMMENDATION**
  The Board recommends **Approval with Conditions**. Student M. should not be sanctioned. The conduct described does not constitute reportable misconduct under current definitions, and the failure to disclose was a result of ambiguous instrument design rather than intent to deceive. However, approval is contingent upon M. adding a methodological appendix to their dissertation detailing these exchange dynamics, and the Program must immediately revise its IRB pre-fieldwork protocols to capture non-state brokerage.

  **FACTUAL BACKGROUND**
  Student M. conducted 14 months of fieldwork in a region where access is mediated by local gatekeepers (village elders, private fixers). M. provided "facilitation gifts" to these actors. Key facts:
  1.  **Recipients:** Non-state actors (no government officials or institutional representatives involved).
  2.  **Documentation:** All exchanges were recorded in field notes with values kept under local "courtesy thresholds."
  3.  **Disclosure:** M. did not declare these on the IRB form. The form specifically queried payments to "government actors or institutional representatives."
  4.  **Complaint:** A funding reviewer flagged this as "textbook clientelism" and non-disclosure of corruption-adjacent conduct.

  **ETHICAL AND CONCEPTUAL ANALYSIS**
  This case is not merely a compliance error; it is a collision between two ethical frameworks. To decide correctly, we must address the definition of corruption and the scope of our ethical oversight.

  **1. The Definition of Clientelism and the Public-Office Nexus**
  The funding reviewer's accusation rests on categorizing M.'s conduct as "clientelism." In political science and governance literature, clientelism typically requires a *public-office nexus*—an exchange involving state resources or official discretion traded for political support or private gain.
  *   **Analysis:** M.'s exchanges were with private community brokers to facilitate access, not to alter state policy or secure illicit government contracts. While these exchanges create obligation, labeling them "clientelism" conflates *social reciprocity* with *political corruption*. Without the involvement of a public official, the "corruption" label is categorially misapplied. It treats all asymmetric power dynamics as corrupt, ignoring that in many contexts, refusing such reciprocity is the actual ethical violation (signaling arrogance or extraction).

  **2. Institutional Monism vs. Normative Pluralism**
  The Board is divided between an *Institutional Monist* approach (one set of transparency rules applies globally, regardless of context) and a *Normative Pluralist* approach (ethical triage must account for local normative structures).
  *   **Analysis:** A strict Monist approach protects the university from liability but produces "thin legalism." It forces researchers to either violate local norms (by refusing gifts) or violate university norms (by hiding them). A Pluralist approach allows for context-sensitive triage. We recommend a *Critical Normative Pluralism*. We accept that local gift economies are legitimate trust-building mechanisms, provided they meet two reversibility checks: (1) Do they coerce the recipient? (2) Do they compromise the researcher's ability to report negative findings about the giver? M.'s field notes suggest the answer to both is "no."

  **3. Thick Description vs. Thin Legalism**
  Your colleague's distinction is vital here. The funding reviewer applied "thin legalism": a binary check of *Did you pay? Yes/No.* M. practiced "thick description": documenting the *meaning, value, and social function* of the exchange in field notes.
  *   **Analysis:** M.'s field notes demonstrate higher ethical rigor than the IRB form. M. tracked the social weight of the gift; the IRB form only tracked the financial liability. Punishing M. for prioritizing the thick ethical reality over the thin bureaucratic category incentivizes future students to hide complex realities rather than document them.

  **ADDRESSING THE COUNTER-ARGUMENT**
  We must honestly address the strongest argument for sanctioning M., which is the **Risk of Normalization**.
  *   **The Argument:** Even if these were not state officials, normalizing undisclosed payments to private brokers creates a slippery slope. It makes it difficult to distinguish between a "courtesy gift" and a "bribe to a private entity" (e.g., a corporate fixer). If we clear M., do we signal that opacity is acceptable as long as the researcher claims "cultural necessity"?
  *   **Our Rebuttal:** This risk is real, but it is managed by *disclosure*, not *prohibition*. The failure here was not the gift-giving; it was the form's failure to ask about non-state brokers. Sanctioning M. punishes the student for the Program's inadequate instrument. The remedy is not to ban the practice universally (which makes fieldwork impossible in certain regions) but to mandate transparent reporting of it. Opacity is the enemy, not reciprocity.

  **ACTIONABLE RECOMMENDATIONS**
  To resolve this case and prevent recurrence, the Board proposes the following:

  1.  **Clear Student M. of Misconduct:**
      *   Issue a formal letter stating M. acted in good faith and within the literal bounds of the approved IRB protocol.
      *   Reject the funding reviewer's request for sanction.

  2.  **Condition of Approval (Dissertation Requirement):**
      *   M. must include a "Positionality and Exchange" appendix in their dissertation.
      *   This section must explicitly analyze the gift economy encountered, distinguishing it from bribery, and reflect on how these exchanges may have shaped data access or bias. This turns the ethical tension into methodological rigor.

  3.  **Protocol Revision (Immediate):**
      *   Revise the IRB pre-fieldwork form. The question regarding payments must change from "government actors" to "any local intermediaries, gatekeepers, or facilitators, whether state or non-state."
      *   Add a guidance note explaining that "facilitation gifts" must be declared for review, not necessarily prohibited, allowing the Board to assess "courtesy thresholds" *before* deployment.

  **CONCLUSION**
  We cannot enforce a Western transparency norm that renders fieldwork in relational economies impossible without labeling standard social practice as corruption. However, we cannot allow undisclosed financial exchanges to become invisible. By clearing M. but requiring explicit methodological reflection, we validate the legitimacy of local norms while maintaining our commitment to transparency. We treat the ethical dilemma as data, not just a compliance hazard.

  **Signed,**

  **The Appeals Board Committee**
