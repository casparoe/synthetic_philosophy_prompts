      *   *Concession:* If the dependence is *psychological*, empirical evidence of people functioning without it weakens the universal claim.
      *   *Rejection:* The user can claim those people are self-deceived or their valuing is *objectively* undermined even if they don't feel it. (Moves from psychology to normativity).

  6.  **Address Constraint 4: Insulation/Tautology:**
      *   *Risk:* "If you value X, you must value a future where X matters." If *any* future counts, extinction is hard to define. If *only a specific* future counts, the view becomes parochial.
      *   *Assessment:* This is a known problem in teleological accounts. If the definition of "relevant future" shifts to save the theory, it risks unfalsifiability.
