      *   *Risk:* If the view relies on the backward-looking claim, it's vulnerable to the "Timeless Truth" objection (value is intrinsic or relational at the time, not retroactively mutable). If it relies on the forward-looking, it's vulnerable to the "Stoic/Nihilist" objection (people *do* value things without future hope).

