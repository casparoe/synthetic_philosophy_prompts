          *   **Turing's View:** Turing discussed the "Imitation Game" (Turing Test) as a behavioral criterion for thinking. He *did* discuss the idea of machine rights briefly (in interviews or less formal writings), but the specific claim about "legal status of a student" is not a standard citation from his major papers. He focused more on the philosophical question "Can machines think?" rather than the legal framework.
          *   **Verdict:** Exaggeration/Conflation. The "student" status is likely a metaphorical extension by the friend, not a policy proposal by Turing.

      *   *Claim 5: "No principled line between learned human habits and trained machine responses."*
