answer: |-
  Consider a population of insectivorous birds possessing an innate avoidance mechanism ($S$) triggered by a specific red-and-black wing pattern. Throughout the evolutionary history of this mechanism, the pattern was instantiated by two distinct, distally located species: Model $A$ (highly toxic) and Mimic $B$ (mildly toxic). $B$ is a unidirectional mimic of $A$; $B$'s protective efficacy causally depends on $A$'s abundance and toxicity, whereas $A$'s efficacy does not depend on $B$ (indeed, $B$ dilutes $A$'s signal). Because the birds cannot perceptually distinguish $A$ from $B$, the fitness payoff for possessing a mechanism triggered by $A$ alone versus one triggered by $A$-or-$B$ was identical; selection could not discriminate between the two mappings, and avoiding $B$ contributed positively to survival (due to mild toxicity). Consequently, the etiological record supports either "avoid $A$" or "avoid $A$-or-$B$" as the proper function, leaving teleosemantics unable to determinately classify $B$-tokens as misrepresentations. However, because the law linking $B$ to $S$ holds only in virtue of the law linking $A$ to $S$ (asymmetric dependence), the informational account determinately fixes the content as $A$, rendering all $B$-tokens false.

  | Feature | Informational (Asymmetric Dependence) | Teleosemantics (Etiological/Consumer) |
  | :--- | :--- | :--- |
  | **Verdict on $B$-tokens** | **Error:** $S$ means $A$; $B$ is not $A$. | **Indeterminate/True:** Content is $A$ or $A \lor B$; $B$ fits the proper function. |
  | **Why?** | $B \to S$ dependence is derived from $A \to S$; asymmetry fixes content to $A$. | Selection history rewarded avoiding both; fitness history is indifferent between the two content mappings. |
  | **Key Feature Doing Work** | **Causal Asymmetry:** $B$'s signal power parasitizes $A$'s. | **Selection Indifference:** Perceptual limits made fitness payoffs identical for both mappings. |
  | **If Feature Removed** | If dependence were symmetric (Müllerian), AD collapses to disjunction. | If selection favored $A$ exclusively (e.g., $B$ harmless), Teleo fixes content to $A$. |
  | **Teleosemantic Pushback** | "Proper function tracks the *beneficial property* (toxicity), not the species. Both $A$ and $B$ are toxic, so both are true instances of the content 'Toxic Prey'." |
  | **Honesty Flag** | **Bent Constraint:** To force the teleosemanticist into the disjunction ("$A$ or $B$") rather than a unified kind ("Toxic Prey"), I had to stipulate that content individuation occurs at the *species* level. A sophisticated teleosemanticist could bypass the disjunction problem by arguing the content is the determinable property (toxicity), which would make both $A$ and $B$ true, satisfying the theory but violating your "no determinate/determinable" constraint. |
