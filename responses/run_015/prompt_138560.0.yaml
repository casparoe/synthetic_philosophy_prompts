  Based on the calibration log, the committee operates under two dominant principles that often overlap but are distinct in their logical foundations. A third rule captures the dissenting view that occasionally surfaces (Case 6). These rules fit all six precedents but diverge on hypothetical cases involving verified prediction without coercion.

  **Rule I: The Integrity Constraint (Anti-Extortion)**
