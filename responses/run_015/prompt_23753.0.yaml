  me and my buddy got into a real fight last night over Taurek's "Should the Numbers Count?" and i'm still a little twisted up about it. he keeps insisting the one-person argument and the merging argument are basically the same move wearing two different hats, and that once you see the merging version the one-person one is just a red herring. but i don't think they're doing the same work, and i can't quite pin down why. can you compare the two arguments for me — what each one is actually claiming, where they diverge, and which one is more exposed to the standard objections? i feel like the merging one has a problem with the whole premise of merging being even relevant to the original case, but i'm not sure the one-person one survives the "each of the five has their own separate claim" objection either.
