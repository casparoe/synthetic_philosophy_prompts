  2.  **Deconstruct Taurek's Position:**
      *   Taurek argues *against* the view that we should save the greater number simply *because* they are the greater number.
      *   He proposes flipping a coin (or some randomizing device) when faced with a choice between saving 1 person vs. 5 people (assuming no other relevant differences).
      *   His core intuition: Loss is suffered by individuals, not groups. There is no "super-losser" when 5 die vs. 1.

  3.  **Analyze the "One-Person Argument" (Individual Loss/No Greater Loss):**
      *   *Core Claim:* When comparing the death of A vs. the death of B, C, D, E, F... A loses his life. B loses his life. C loses his life... There is no single entity that loses "5 lives." The loss is distributed. From the perspective of *each* individual, the loss is total (100% of their future). Therefore, there is no "greater loss" in the 5 dying compared to the 1 dying, only *more* losses.
      *   *Function:* It attacks the aggregative premise that 5 deaths > 1 death in a morally decisive way. It grounds the moral equality of the claims.
      *   *Vulnerability:* The "Separate Claims" objection (aggregationists say: yes, losses are individual, but we have a duty to minimize total individual losses). Also, the "Point of View of the Universe" objection (utilitarianism).

