answer: |-
  Your reasoning is intuitively appealing because it applies a **channel capacity** argument (from information theory) to a **game-theoretic** problem. You are treating the debaters as passive pipes transmitting data, rather than strategic agents whose behavior is modified by the rules of the game.

  While your concern highlights a real constraint (the "inspection budget"), the conclusion that a long debate is no better than a single summary is incorrect. The value of the debate does not come primarily from the *volume* of information transmitted in the inspected sentences, but from the **incentive structure** that shapes the entire transcript, and the **consensus compression** that allows the inspected sentences to carry more weight.

  Here is where your argument goes wrong, and why Budgeted Cross-Examination can still outperform a simple summary.

  ### 1. The Audit Effect (Incentives vs. Capacity)
  Your argument assumes the information content is limited to the literal text of the five inspected sentences. However, the *threat* of inspection changes what the models write in the *uninspected* 99% of the transcript.

  *   **Analogy:** Consider tax audits. If the IRS audits only 1% of returns, does that mean only 1% of taxpayers behave honestly? No. The *risk* of being the 1% compels nearly everyone to file honestly.
  *   **Application:** In your protocol, a debater cannot safely lie in round 50 just because the judge might only inspect round 100. If they lie in round 50, their opponent will challenge it in round 51. This challenge makes round 50 (or the challenge in 51) a high-probability target for inspection.
  *   **Result:** The debate forces the models to be honest (or at least consistent) throughout the *entire* exchange, not just in the five inspected sentences. A single model writing a summary faces no such adversarial pressure; it can hallucinate a coherent-sounding but false narrative without fear of immediate exposure.

  ### 2. Consensus Compression (Focusing the Bottleneck)
  A hard question usually requires a lot of context. A 5-sentence summary from a single model must spend its limited budget establishing context *and* making its argument. This forces trade-offs and omissions.

  *   **Debate Advantage:** In a long debate, the two models can argue out the background context. They will naturally converge on easy-to-verify facts (e.g., "Line 50 calls Function X") because lying there is easily caught.
  *   **The Crux:** By the end of the debate, the models can issue a joint opening statement (or the judge can infer from the transcript) that says: *"We agree on facts A through Z. The entire disagreement rests on Claim Q."*
  *   **Efficiency:** The judge's 5-sentence budget is now spent entirely on **Claim Q**, the actual point of uncertainty. The single-model summary must spend 2 of its 5 sentences explaining A and B to make Q intelligible. The debate protocol effectively compresses the necessary context into the *uninspected* transcript, freeing the *inspected* budget for the actual decision.

  ### 3. Verification vs. Assertion
  You are comparing **5 sentences of assertion** (the summary) against **5 sentences of verified claim** (the debate).

  *   **Single Model:** "Treatment A is better because of mechanism X." (The judge has no way to know if mechanism X is real or hallucinated).
  *   **Debate:** Debater A claims "Mechanism X exists." Debater B challenges "Mechanism X was disproven in Study Y." The judge inspects the claim about Study Y.
  *   **Information Density:** A sentence that has survived adversarial cross-examination carries higher **epistemic weight** than a sentence generated in isolation. The "information" isn't just the semantic content; it's the metadata that this claim is the "survivor" of a truth-seeking process. The judge isn't just reading a fact; they are reading a fact that the opposing superintelligence failed to debunk.

  ### 4. The Selection Mechanism Matters
  Your worry holds more water if the 5 sentences are chosen **randomly**. If the judge picks 5 sentences at random from a 10,000-sentence transcript, the probability of catching a specific lie is low.

  However, in debate protocols, the inspection is usually **targeted**:
  1.  **Opponent Highlighting:** The opposing debater explicitly says, *"Judge, if you inspect only one thing, inspect this sentence here."* This directs the limited budget to the point of highest contention.
  2.  **Crux Identification:** The debate structure forces models to identify the "crux" of the disagreement. The inspection budget is then applied to the crux, not the preamble.

  If your protocol allows the *opponent* to nominate which claims are most critical for inspection, you bypass the weak judge's inability to find the needle in the haystack. The opponent acts as a filter, surfacing the 5 most important sentences for the judge to read.

  ### 5. Where Your Reasoning Is Partially Right
  You are correct that there is a **diminishing return** on debate length.
  *   If the transcript is 1,000,000 sentences and the inspection budget is 5, the "audit probability" per sentence becomes vanishingly small. Models might risk lying on low-probability points.
  *   **Fix:** The protocol should include a mechanism to **prune** the transcript. For example, the models could be required to submit a "Statement of Disagreement" that links to specific lines in the transcript. The 5 inspections are then mandated to be on those linked lines. This ensures the budget is spent on the "battlefront," not the "logistics."

  ### Summary of the Flaw
  Your argument fails because it treats the communication channel as **passive** (sending bits) rather than **active** (enforcing constraints).

  *   **Summary:** 5 sentences of unverified data from one source.
  *   **Debate:** 5 sentences of **adversarially tested** data, selected from a transcript where the *threat of inspection* enforced honesty on the surrounding context.

  **Recommendation:** To make your "Budgeted Cross-Examination" robust, ensure the protocol allows the **opposing debater to recommend which claims should be inspected**. This leverages the strong model's capability to identify the weak points in the opponent's argument, guiding the weak judge's limited attention to the most high-leverage information.
