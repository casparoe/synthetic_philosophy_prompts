      *   The transcript itself acts as a commitment device. If Debater A makes a claim in round 10, and Debater B challenges it in round 11, Debater A must defend it. If the judge inspects the challenge, they see the inconsistency.
      *   The "5 sentences" are not a random sample; they are selected by the judge (or a protocol) based on *where the disagreement lies*. This is active learning, not passive channel capacity.

