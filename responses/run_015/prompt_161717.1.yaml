answer: |-
  Here is a precise principle constructed to accommodate your verdicts, followed by the application to your unsettled cases. I have prioritized logical consistency over preserving every intuition, so I will flag where I am overturning one of your gut feelings to make the system work.

  ### The Principle: Epistemic Boundary Condition (EBC)

  A surprise exam announcement is **satisfiable** on a specific day $d$ if and only if three conditions are met:

  1.  **Active Knowledge:** At the time of evaluation (the evening prior to $d$), the announcement is part of the students' active, remembered evidence.
  2.  **Existential Certainty:** At the time of evaluation, the students know for certain that the exam *will* occur (i.e., no cancellation clause is in play).
  3.  **Local Non-Deducibility:** At the time of evaluation, the proposition "The exam is on $d$" is **not** logically entailed by the set {Announcement, History of No-Exam, Existential Certainty}.

  **Crucial Corollary (The Induction Stopper):** Failure of Local Non-Deducibility on the *last* day does **not** propagate backward to invalidate earlier days. The announcement is not a global truth claim that must hold for all days simultaneously; it is a contingent claim that is evaluated relative to the actual day of the exam.

  ---

  ### Testing the EBC Against Your Seven Verdicts

  Here is how the EBC handles your cases, clause by clause.

  **(1) One-day version:**
  *   **Verdict:** False announcement / No surprise.
  *   **EBC Analysis:** **Matches.**
  *   **Reasoning:** Clause 3 fails. On Thursday night, {Announcement, Exam Must Occur} entails "Exam is Friday." Deducibility is 100%.

  **(2) Classic five-day, exam on Wednesday:**
  *   **Verdict:** Genuine surprise.
  *   **EBC Analysis:** **Matches.**
  *   **Reasoning:** Clause 3 passes. On Tuesday night, the set {Announcement, No Exam Mon/Tue, Exam Must Occur} entails "Exam is in {Wed, Thu, Fri}." It does *not* entail "Exam is Wed." Therefore, Wednesday is locally non-deducible.
  *   **Resolution of your tension:** You worried that if the elimination argument is broken, Friday should be okay. The EBC says the elimination argument is **locally valid at the boundary** (Friday) but **globally invalid** (it doesn't kill Wednesday). The contradiction only arises if you assume the announcement must be *known to be true* for all days simultaneously. The EBC treats the announcement as true *only if* the exam lands on a day that satisfies Clause 3.

  **(3) Classic five-day, exam on Friday:**
  *   **Verdict:** Cheating / Not a surprise.
  *   **EBC Analysis:** **Matches.**
  *   **Reasoning:** Clause 3 fails. On Thursday night, {Announcement, No Exam M-Thu, Exam Must Occur} entails "Exam is Friday." Because it is deducible, it violates the "surprise" condition.
  *   **Why this fixes your worry:** You felt Friday should be as good as Wednesday if elimination is broken. The EBC clarifies that elimination *isn't* broken at the boundary; it's only broken when you try to use Friday's failure to eliminate Thursday. Friday fails on its own merits (deducibility), not because of a chain reaction.

  **(4) Two-day version:**
  *   **Verdict:** Degenerate / Uneasy.
  *   **EBC Analysis:** **Explains the unease.**
  *   **Reasoning:** On Monday night, Tuesday is deducible (Clause 3 fails). So Tuesday is "cheating." Monday is valid (not deducible Sunday night).
  *   **Why it feels broken:** In a 5-day week, 1 out of 5 days (Friday) is "cheating" by this metric. In a 2-day week, 1 out of 2 days (Tuesday) is "cheating." The **density of invalid days** is 50% vs 20%. Your unease is a statistical intuition about the ratio of valid to invalid days, not a logical threshold.

  **(5) Escape-hatch (cancellation clause):**
  *   **Verdict:** More satisfiable; Friday is fine.
  *   **EBC Analysis:** **Matches.**
  *   **Reasoning:** Clause 2 fails. Because the teacher might cancel, the students do *not* have "Existential Certainty" on Thursday night. Therefore, "Exam is Friday" is **not** entailed (it might be cancelled). Clause 3 is satisfied. Friday becomes a valid surprise day.

  **(6) Over-informative ("It's Friday and you can't deduce it"):**
  *   **Verdict:** Self-undermining / Liar-like.
  *   **EBC Analysis:** **Overturns/Reclassifies.**
  *   **Reasoning:** The EBC is designed for *timing* uncertainty, not *factual* certainty. If the teacher says "It is Friday," Clause 3 is trivially failed because the day is stated explicitly. This isn't a surprise exam paradox; it's a Moore's Paradox ("It is raining but I don't believe it"). I am classifying this as a different logical species than (1)-(5). It is unsatisfiable, but not because of induction; it's because it asserts $P \land \neg K(P)$ where $P$ is made trivially known by the assertion itself.

  **(7) Forgotten announcement:**
  *   **Verdict:** Doesn't count.
  *   **EBC Analysis:** **Matches.**
  *   **Reasoning:** Clause 1 (Active Knowledge) fails. If the announcement is forgotten, it is not in the evidence set used for deduction. The surprise is psychological, not logical.

  ---

  ### Application to Your Unsettled Cases

  **Case A: The Re-announcement (Sunday start, repeated Tuesday night)**
  *   **Setup:** 5-day week. No exam Mon/Tue. Teacher repeats "Surprise exam this week" Tuesday night.
  *   **EBC Verdict:** **Wednesday is a surprise; Friday is cheating.**
  *   **Reasoning:** The re-announcement reinforces Clause 1 (Active Knowledge) and Clause 2 (Existential Certainty). Logically, this truncates the window to a 3-day problem (Wed, Thu, Fri). The "Boundary" is still the last day of the window (Friday). On Thursday night, Friday is deducible. On Tuesday night, Wednesday is not.
  *   **Does the window restart?** Psychologically, yes. Logically, no. The epistemic boundary is always the *last possible day* in the current window. Since Friday remains the last possible day, it remains deducible on Thursday night. The re-announcement does not save Friday.

  **Case B: "Not Monday" Addition**
  *   **Setup:** 5-day week, announcement adds "And it's not Monday."
  *   **EBC Verdict:** **Friday is still cheating; Tuesday is a surprise.**
  *   **Reasoning:** Removing Monday shrinks the window to {Tue, Wed, Thu, Fri}. The boundary is still Friday. On Thursday night, if no exam has occurred, the exam must be Friday (assuming Existential Certainty). So Friday fails Clause 3. Tuesday, however, is now the *first* day. On Monday night, students know it's not Monday, but it could be Tue-Fri. Tuesday is not deducible.
  *   **Impact:** This does not fix the Friday problem. It only shifts the "valid" days. It might slightly reduce the "degeneracy" feeling of the 2-day version (if applied there), but in the 5-day version, the Friday contradiction is robust against removing earlier days.

  ---

  ### Confidence Check & Overturns

  **Where I am confident:**
  *   **Cases (1), (5), (7):** The EBC handles these cleanly using standard epistemic logic (Knowledge vs. Truth). The cancellation clause (5) is the strongest proof that "Existential Certainty" (Clause 2) is the switch that makes Friday deducible.
  *   **The Induction Stopper:** I am confident that the backward induction fails because it requires the students to *know* the announcement is true to eliminate days, but the announcement *cannot be known* to be true if it leads to a contradiction. However, it can *be* true. This validates your intuition in (2) that the exam can happen on Wednesday.

  **Where I am making a call (Overturning/Refining you):**
  *   **Case (3) vs (2) Tension:** You wrote: *"if the elimination argument is broken... they can't deduce Friday either... and I don't believe that."*
      *   **My Call:** I am siding with your disbelief. The elimination argument is **not** broken at the boundary (Friday); it is only broken in the *step* from Friday to Thursday. Friday is deducible on Thursday night (given Existential Certainty). Therefore, Friday is *not* a surprise. Wednesday is not deducible on Tuesday night. Therefore, Wednesday *is* a surprise. The announcement is **contingently true**: it is true if the exam is on Wednesday, false if the exam is on Friday. It is not uniformly true or false.
  *   **Case (4) Unease:** You felt the 2-day version was "degenerate" but couldn't justify why.
      *   **My Call:** I am validating your unease but grounding it in **Invalid Day Density**. In $N=2$, 50% of days are logically invalid (cheating). In $N=5$, 20% are invalid. The paradox feels "worse" when the teacher has fewer valid moves.
  *   **Case (6):** You grouped this with the surprise exam variants.
      *   **My Call:** I am separating this. This is a performative contradiction (Liar/Moore), not a surprise paradox. It fails for a different reason (self-reference) than the others (temporal deducibility).

  ### Summary Definition of "Surprise"
  To answer your final request for a definite reading:
  **Surprise** here means **Logical Non-Deducibility from Active Evidence.**
  It is not psychological startlement (Case 7). It is not impossibility of prediction in a vacuum (Case 1). It is strictly about whether the proposition "Exam is Today" is a necessary consequence of the rules and history known the night before.

  Under this definition, your gut verdicts are 90% logically sound, provided you accept that the announcement's truth value depends on the day the teacher actually picks. The teacher *can* give a surprise exam, but they *cannot* give it on the last day (unless they add the cancellation clause).
