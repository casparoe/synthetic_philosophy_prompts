      *   *Path-Contingency Theorists (PCT):* Focus on the structure of history itself. They argue "industrialization" isn't one thing. They reject the idea that China "failed" to reach a destination; rather, it went somewhere else. They worry about "modal scope asymmetry" (treating Britain as necessary, China as contingent failure).
      *   *Tone:* Academic, precise, collaborative but distinct, formalized.

  3.  **Drafting Section 1: Agreed Claims:**
