          *   Camp Two: Path-Contingency Theorists (PCT) - Question is malformed (modal scope asymmetry); treats industrialization as a global attractor rather than branching paths.
      *   **Deliverable Structure:**
          1.  Numbered section of agreed claims (empirical approximations, counterfactual conditions, absence vs. presence).
          2.  Disagreements table (3 cruxes: natural kind vs. family, ceteris paribus coherence, missing factor vs. local optimality).
          3.  Concrete comparative cases/evidence for each crux with predictions from both sides.
          4.  Assessment of verbal disputes (terms like potential, blockage, divergence).
      *   **Constraint:** No bibliographies, reading lists, or citations. Stand on conceptual architecture alone.

  2.  **Deconstruct the Camps & Terminology:**
