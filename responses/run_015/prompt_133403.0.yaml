      *   *Counterfactual Coherence:* When is it okay to compare? Needs strict boundaries.
      *   *Absence vs. Presence:* Logical distinction. Explaining why something didn't happen isn't always the inverse of why it did.
      *   *Drafting thought:* Keep these neutral. Both sides must nod at these.

  4.  **Drafting Section 2: Disagreements Table:**
