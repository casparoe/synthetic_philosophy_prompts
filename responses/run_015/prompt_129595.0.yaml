          *   User's intuition is correct: Experience vs. Personhood is crucial. If they conflate "me surviving" with "my qualia staying the same," the argument fails (Ship of Theseus confusion).
          *   Counterfactual Functional Organization is also key. If it's just input/output matching (behaviorism), the argument is weak. It needs to be about the *causal structure*.
          *   *Add:* The Principle of Organizational Invariance (needs to be introduced as the *target* or *premise*, not assumed).
          *   *Add:* The link between Experience and Report (the "Bridge Principle"). This is the engine of the *Dancing Qualia* variant, but relevant here for *Fading Qualia*.
