answer: |-
  1. **The Dependency Structure**

  You are correct to prioritize the **Experience/Personhood distinction** and the **Counterfactual definition of Functional Organization**. Place these in the first 15 minutes, before the substitution scenario is described.

  *   **Experience vs. Personhood:** This must be first. If students conflate "Do I survive?" with "Does my experience remain phenomenally identical?", the argument collapses into a Ship of Theseus debate about identity conditions. You need them to grant that *I* could persist while *what it is like to be me* degrades (or vice versa). If this arrives late, the "Fading" horn of the trichotomy will be rejected as incoherent ("If I fade, I'm dead").
  *   **Counterfactual Functional Organization:** This must be second. Define functional organization not as actual input/output history, but as the pattern of causal dependencies between internal states, inputs, and outputs. If you define it merely as behavioral match, the Cognitive Science students will object that a lookup table suffices, muddying the "prosthesis" requirement. If this arrives late, the "Functionalism" horn becomes trivial.
  *   **The Bridge Principle (Load-Bearing Addition):** You need a third dependency: *The Principle of Organizational Invariance* (or at least the intuition that functionally isomorphic systems share psychological properties). Do not assert it as true; assert it as the *standard view* being tested. Without this baseline, the replacement scenario lacks tension.
  *   **The Reportability Link:** Finally, establish that changes in conscious experience are typically accessible to the subject for report. This is the engine of your "trap." If this is not in place before the example, the trap snaps shut on empty air.

  **Order:** 1. Experience ≠ Survival. 2. Function = Counterfactual Causal Structure. 3. Standard View: Function determines Psychology. 4. Experience is Reportable.

  2. **The Carrying Example**

  Your **Two-Channel Visual** example is pedagogically sharper than the standard "whole brain over time" for a 70-minute seminar, but it carries a specific risk.

  *   **What it must have:** It must stipulate that the two channels are causally isolated from one another *during* the comparison phase, yet integrated enough to allow a unified report (e.g., "Left looks red, Right looks dull"). It must also stipulate that the prosthetic channel is *functionally isomorphic* to the biological one by the definition established in Section 1.
  *   **What it must lack:** It must lack any *technological* detail about the prosthesis. Do not discuss silicon, latency, or power. Any physical detail invites the "Carbon vs. Silicon" objection prematurely.
  *   **Stipulated vs. Motivated:** Stipulate the functional equivalence. Do not motivate it with engineering plausibility. The argument is conceptual; engineering hurdles are irrelevant to the metaphysical point.
  *   **The Trap:** You are right about the trap. Ask: "At the midpoint, when the stimulus is presented to both, does the subject report a difference?"
      *   If **Yes**: They admit functional organization changed (violating the setup) or that experience can diverge from function without the subject knowing (Systematic Illusion).
      *   If **No**: They concede that experience tracks function (Functionalism wins).
      *   *Refinement:* The trap works best if you force them to commit to the *Reportability Link* from Section 1. If they say "Experience changes but they can't tell," they have abandoned the link.
  *   **Dreamless Sleep:** **Noise.** It introduces the Hard Problem of Sleep (are we conscious then?) which distracts from the Replacement logic. It adds a variable (consciousness on/off) that confuses the variable (consciousness *quality*). Cut it.
  *   **Reverse Sequence:** **Keep in reserve.** Use this only if they claim the direction of replacement matters (hysteresis). If no one raises it, do not introduce it; it consumes time better spent on the trichotomy.

  3. **The Misconception Map**

  Anticipate these objections at the specified points. Use the provided scripts to deflect without derailing.

  *   **Ship of Theseus (Identity vs. Experience):**
      *   *When:* Section 1 (Setup).
      *   *Defusing:* "We are not asking if the subject is still *you*. We are asking if *red* still looks *red* to whoever is there. Survival is not the metric; phenomenology is."
  *   **Carbon vs. Silicon (Substrate Chauvinism):**
      *   *When:* Describing the prosthesis.
      *   *Defusing:* "The material is irrelevant. Imagine we are rearranging biological neurons into a non-biological shape that preserves the causal graph. The argument holds for any non-functional property."
  *   **Assumes Functionalism:**
      *   *When:* After the trichotomy is presented.
      *   *Defusing:* "It does not assume functionalism is true. It assumes functionalism is *intelligible*. It asks: If functionalism is false, what happens? The argument is a stress test, not a proof."
  *   **Impossible Prosthesis (CogSci Special):**
      *   *When:* Describing the substitution mechanics.
      *   *Defusing:* "We are dealing in idealizations. We ask what is *metaphysically* possible, not what is currently engineerable. If the scenario is incoherent, show me the contradiction, not the engineering bottleneck."
  *   **Vagueness (No Fact of the Matter):**
      *   *When:* Discussing the "Fading" horn.
      *   *Defusing:* "Vagueness explains *where* the change happens, not *that* it happens. Even if the boundary is fuzzy, the trichotomy remains: does it fade, dance, or stay fixed? Vagueness is not a fourth option."
  *   **Missing: Systematic Illusion is Incoherent:**
      *   *When:* The Trap (Section 2).
      *   *Defusing:* "It is strange, but not logically contradictory. We must weigh its strangeness against the strangeness of the other horns."
  *   **Missing: The Homunculus Fallacy (CogSci Special):**
      *   *When:* Discussing the "little man" inside watching the channels.
      *   *Defusing:* "We are not positing an inner observer. We are positing a reporting mechanism. If the report says 'same,' and the system is functionally identical, the experience is functionally identical."

  4. **Where the Gradualness is Doing the Real Work**

  Spend 10 minutes here. You must distinguish the *Gradual* Replacement from the *Instant* Swap.

  *   **The Single Step:** If you swap the whole brain at once, the opponent can posit a brute discontinuity ("Consciousness snaps off"). This is hard to refute because it appeals to a magic boundary.
  *   **The Gradual Step:** By replacing one neuron at a time, you invoke a Sorites intuition. It is implausible that replacing *one* neuron destroys consciousness or alters qualia. This forces the "Fading" or "Dancing" conclusion over many steps.
  *   **The Uploading Misunderstanding:** Students often leave thinking, "This proves uploading is safe." Correct this.
      *   *Script:* "The argument does not prove uploading is safe. It proves that *if* you want to keep Functionalism, you must accept uploading is safe. If you think uploading kills you, you must reject Functionalism. The argument forces you to choose your poison; it does not administer the cure."

  5. **One Thing to Openly Refuse**

  **Refuse to adjudicate which horn of the trichotomy is true.**

  *   *Why:* Solving the Hard Problem is not the goal of a 70-minute seminar on the structure of the argument. If you take a stand, half the room will tune out to fight your metaphysics rather than analyze the logic.
  *   *What to say:* "My goal today is not to tell you whether qualia fade, dance, or remain fixed. My goal is to show you that you cannot consistently hold that function stays constant while experience does something else *without* accepting one of these three costly consequences. Which consequence you accept is your metaphysical burden, not mine."

  6. **A Closing Check**

  Do not ask "Who thinks functionalism is true?" (This tests conclusion, not structure).

  **The Task:**
  "Write down the **Bridge Principle** that connects the substitution scenario to the conclusion. Then, write down the single premise you would reject to avoid the 'Fading Qualia' conclusion."

  *   *Success Criteria:* They should identify the link between *Functional Organization* and *Conscious Experience* (or the Reportability Link). To avoid Fading, they must either reject the possibility of the prosthesis (Section 3 objection), reject the Sorites reasoning (Section 4), or accept Systematic Illusion. If they can identify which premise breaks their preferred view, they understand the structure.
