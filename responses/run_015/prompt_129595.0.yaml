          *   *Trap Location:* The trap is indeed asking "Would you notice?" If they say "No," they accept functional determination. If "Yes," they accept systematic illusion.
          *   *Stipulation:* Must be stipulated as functionally isomorphic. Don't motivate with tech specs (distraction).

      *   **3. Misconception Map:**
          *   *Ship of Theseus:* Defuse early (Section 1). "We aren't asking if *you* survive, we're asking if *red* looks red."
