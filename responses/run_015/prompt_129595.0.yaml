      *   **2. The Carrying Example:** User proposes a "Two-Channel Visual" setup (one bio, one prosthetic, compare mid-stream). Goal: Trap students into admitting reportability implies experience. Evaluate this vs. standard "whole brain" replacement. Evaluate "dreamless sleep" and "reverse sequence."
      *   **3. Misconception Map:** Address specific expected objections (Ship of Theseus, Carbon/Silicon, Assumes Functionalism, Impossible Prosthesis, Vagueness). Add missing ones (especially from CogSci side). Provide timing and defusing scripts.
      *   **4. The Role of Gradualness:** Why not instant swap? Avoid the "Uploading is Safe" misunderstanding.
      *   **5. The Refusal:** What topic is out of bounds for this seminar? (Likely the "Hard Problem" itself or specific metaphysical commitments).
      *   **6. Closing Check:** A task/question to verify structural understanding, not just agreement/disagreement.

