answer: |-
  You and your friend hit on the exact friction point that stalls most conversations about free will. You're stuck because you're both trying to locate desert in the wrong place. Your friend is looking for it in the metaphysics of the moment—the split second of the act—and correctly seeing that determinism dissolves any magical "could have done otherwise" power. You're looking for it in competence, which is closer, but if you treat competence as a static switch, you still get stuck on edge cases like brain injury or addiction.

  The way out is to stop thinking about desert as a cosmic debt that needs paying and start treating it as a feature of a social technology. Specifically, you should argue that moral responsibility is a system of calibrated trust. When you view it this way, Dennett is right that desert survives skepticism, but your friend's diachronic intuition—that responsibility shifts over time based on capacity—is actually the key that makes the lock turn.

  Here is the argument built out.

  First, we have to discard the idea that punishment is about balancing the scales of the universe. That's the retributivist model your friend is attacking, and he's right to kill it. If desert means inflicting suffering to match a metaphysical sin, then determinism does indeed make it unjust. But if we shift the frame, desert isn't about the past; it's about the future integrity of a normative community. We hold people responsible because doing so is the only way to maintain a society where reasons matter. When we blame or punish, we aren't reaching back into the causal chain to zap the agent; we are adjusting our current relationship with them based on their demonstrated reliability as a rational agent.

  This is where the "calibrated trust" model comes in. Think of moral standing not as a property you possess, like having brown eyes, but as a credit score within a normative system. We extend trust to agents who show they can understand rules, respond to reasons, and inhibit impulses. When someone violates a norm, the punishment is essentially a recalibration of that trust. It signals that their standing in the community has changed because their reliability has been compromised. This isn't vengeance; it's system maintenance. If we didn't adjust our trust based on behavior, the concept of a "rule" would cease to have any grip on reality.

  Now, bring in your friend's diachronic twist. This is actually the strongest evidence for the trust model, not against it. If responsibility were a static metaphysical property, then a brain injury or addiction wouldn't matter—you either had free will or you didn't. But under the calibrated trust model, it makes perfect sense that desert shifts over time. Trust is built and eroded diachronically. If an agent repeatedly demonstrates competence, we trust them more, and the stakes for their violations become higher because they know better. Conversely, if an agent's capacities are genuinely rewired by injury or addiction, their ability to participate in the normative practice changes.

  This means your friend is right that you don't necessarily deserve blame at the exact moment of the act in isolation. You deserve blame based on the trajectory of your agency leading up to it and your current capacity to respond to the blame afterward. If someone develops a tumor that destroys their impulse control, our trust calibration must shift because they are no longer a competent participant in the normative game. Punishing them as if they were fully competent wouldn't be "merciful"; it would be category error. It would be like penalizing a computer for running the wrong software when the hardware is fried. The desert changes because the agent's role in the system has changed.

  This is exactly where the skepticism model, like the quarantine view, fails. Quarantine treats dangerous people like viruses. You isolate them because they are harmful, not because they are agents. But human beings aren't just vectors of harm; we are participants in a shared practice. A quarantine model can't distinguish between a calculated predator and someone who lost control due to a neurological shift, except by risk level. It misses the nuance of moral communication. By contrast, the calibrated trust model allows us to say, "You violated this norm, so we are withdrawing trust," while also allowing for the diachronic update: "However, since your capacity has changed, the level of trust we withdraw is different."

  So, desert survives free will skepticism because it isn't about metaphysics; it's about membership. You deserve punishment not because you broke a cosmic law, but because you broke the terms of membership in a community that relies on mutual trust. And because membership is dynamic, what you deserve is dynamic too. If you rehabilitate yourself, you earn back trust. If you degrade your own capacities through negligence, you incur a debt of responsibility for that degradation. If your capacities are stripped from you externally, your desert diminishes.

  In the end, you can tell your friend that he was right to reject static retributivism, but wrong to think that kills desert. Desert isn't a ghost in the machine; it's the price of admission to a society of reasoners. It survives skepticism because it doesn't require magic free will; it only requires stable, diachronic competence. And since competence is something that waxes and wanes over time, our judgments of desert must wax and wane with it. That isn't arbitrary; it's the only way to treat people as they actually are.
