answer: |-
  **Mark: 21/25**

  **Breakdown:**
  *   **Part (a): 6/10.** The setup and derivation are formally correct, and you correctly identify certainty and entailment as the primary drivers. However, your diagnosis falters in the final sentences. You claim the problem lies with the *ratio measure* and that probabilistic entailment escapes it. This is a category error: the Problem of Old Evidence (POE) is a problem for *conditionalization* given certainty, regardless of the confirmation measure used (difference, ratio, or likelihood). If $P(e)=1$, you cannot conditionalize on $e$, so no measure of confirmation based on updating yields a change. This is a conceptual confusion that will resurface when we discuss likelihoodism versus Bayesianism.
  *   **Part (b): 9/10.** Excellent summary of both strategies. You correctly identify what is conditionalized on in the Garber-style approach (the logical connection) and the target of the counterfactual approach (the ur-prior). The objections cited are standard and well-articulated.
  *   **Part (c): 6/10.** Your verdict is defensible, but your justification relies on a false dichotomy ("these are the only two options"). You overlook other Bayesian responses, such as Jeffrey Conditionalization or relaxing Logical Omniscience without language expansion. Because your reductio rests on the claim that Bayesianism has no other moves, the argument is weaker than it needs to be. However, your willingness to draw a substantive conclusion about Explanationism is commendable.

  ***

  **Marginal Comments**

  **(a)**
  > Suppose I have been certain of *e* for years, so *P*(*e*) = 1, and a new theory *T* comes along that deductively entails *e*.

  **[Margin:]** *Be careful here. You are treating certainty as the residue of a past learning event ("certain... for years"). This assumes a temporal history of belief acquisition. We will see later that some accounts treat old evidence as structurally certain (hinges), not just historically old. This matters for the counterfactual strategy in (b).*

  > The difficulty is generated by the two assumptions I have just used together, strict entailment and certainty.

  **[Margin:]** *Correct. These are the standard culprits (often bundled as 'Logical Omniscience' + 'Conditionalization').*

  > The problem is therefore a problem about strict entailment and about the ratio measure of confirmation; it does not threaten Bayesianism as such.

  **[Margin:]** *Costs 2 points. This is false given your own earlier math. You showed $P(T|e) = P(T)$. If posterior equals prior, the difference measure $P(T|e) - P(T)$ is also zero. The problem is not the *measure* of confirmation, but the *updating rule* (conditionalization) applied to a certainty. Changing the measure doesn't help if the update yields no change. This confusion between static relevance and dynamic updating is significant.*

  > Where a theory does not entail *e* but merely makes it probable... the merely probabilistic case escapes.

  **[Margin:]** *True, but irrelevant to POE. POE is specifically about cases where $T$ *does* entail $e$ (like GR and Mercury) but $e$ is already known. You are dissolving the problem by changing the subject to cases that aren't 'old evidence' in the troublesome sense.*

  **(b)**
  > So I add to my language a sentence expressing the logical connection between them — the material conditional *T* ⊃ *e* — assign it a prior strictly between 0 and 1, and then... conditionalize on it

  **[Margin:]** *Good. Precise on what is conditionalized on. Note that Garber frames this as uncertainty about the logical relation itself, not just adding a sentence, but this captures the formal move.*

  > The trouble is that I now have to assign priors to indefinitely many such sentences, and it is hard to see what could constrain them...

  **[Margin:]** *Strong objection. This is the 'subjectivity' or 'constraint' objection. Well stated.*

  > Let *P* be the credence function I would have had before I learned *e*.

  **[Margin:]** *Clear definition of the ur-prior.*

  > The objection is that *P* is indeterminate: there is no fact of the matter about what I would have thought had I not known *e*.

  **[Margin:]** *Correct. This is the 'impossible counterfactual' objection. You might add that it also raises the problem of 'conceptual incommensurability' (could we even formulate T without e?), which you hint at in the next sentence.*

  **(c)**
  > And these are the only two options, since a Bayesian has just two things to adjust, the language or the prior.

  **[Margin:]** *Costs 2 points. This is a false dichotomy. A Bayesian can also adjust the *updating rule* (e.g., Jeffrey Conditionalization allows updating on uncertain evidence) or the assumption of Logical Omniscience itself (without expanding the language). You have ruled out live options in the literature, which weakens your reductio.*

  > So the old-evidence problem is best read not as a puzzle inside Bayesian confirmation theory but as a reductio of it: what confirms a theory is that it *explains* the evidence, and explanation is not a probabilistic relation.

  **[Margin:]** *Bold conclusion. Acceptable given the prompt, but note that 'explanation' is often cashed out probabilistically (e.g., by Bayesians who adopt IBE). You need to argue why explanation *cannot* be probabilistic, not just assert it. However, this shows independent critical thought.*

  ***

  **Note on the "Hinge" Proposition Variant**

  **Where to place it:** Part (a), first sentence.
  **Phrasing:** You treat the agent's certainty as a historical residue ("certain... for years"). In the hinge variant, the certainty is not a result of learning *e* at all, but a precondition for inquiry. If *e* is a hinge, the counterfactual "what if I hadn't learned *e*?" in Part (b) becomes even more problematic, as it requires imagining a world where the agent lacks the framework to think at all. You might consider whether this strengthens the objection to the counterfactual strategy: it's not just that the prior is indeterminate, but that the counterfactual scenario is incoherent.

  **Why include it?** This student is clearly capable of handling structural distinctions (as seen in their separation of entailment vs. probabilistic support). Introducing the hinge distinction challenges them to separate *psychological* certainty from *systemic* certainty. It addresses the "source" of the $P(e)=1$ assumption, which they currently treat as merely temporal. Given their strong performance in (b) on the counterfactual objection, they are well-positioned to appreciate why a hinge-based certainty makes the ur-prior strategy even harder to defend. It pushes them from a standard "history of belief" model to a "structure of belief" model, which fits the graduate level of the seminar.
