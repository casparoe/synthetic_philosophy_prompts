prompt: |-
  I teach a graduate seminar on formal epistemology, and I have just finished a blind first pass at the midterm. The exam was open-book but written under time pressure, and I wrote Question 3 myself, so I know where I meant the traps to be — which is exactly why I would like an independent read before I commit to comments. The course has covered Bayesian confirmation theory up to the problem of old evidence, the two main families of response (the language-change strategy usually associated with Garber, and the counterfactual, or "ur-prior," strategy), and the standard objections to each. The rubric I circulated tells students that credit depends on being explicit about which assumption is doing the work in an argument, and that no credit is reserved for attaching a name or a date to a view.

  The question, as it appeared on the exam:

  **Question 3.** (a) State the problem of old evidence for Bayesian confirmation theory, and identify precisely which assumption generates it: the agent's certainty in the evidence, the entailment from theory to evidence, the choice of confirmation measure, or something else. Illustrate with one case. (b) Present the language-change strategy and the counterfactual strategy. For each, state what the agent is supposed to conditionalize on, and state the objection you take to be most serious. (c) Does either strategy succeed? Defend your verdict, and say what would follow for Bayesian confirmation theory if neither did.

  One submitted answer, transcribed verbatim with the student number removed:

  **(a)** Suppose I have been certain of *e* for years, so *P*(*e*) = 1, and a new theory *T* comes along that deductively entails *e*. The stock example is the advance of Mercury's perihelion and general relativity: the data were in hand decades before the theory was. Intuitively *e* confirms *T*. But on the Bayesian model confirmation is a matter of conditionalizing on the evidence, and

  *P*(*T* | *e*) = *P*(*T*)*P*(*e* | *T*)/*P*(*e*) = *P*(*T*) · 1/1 = *P*(*T*),

  since *T* ⊨ *e* gives *P*(*e* | *T*) = 1 and my certainty gives *P*(*e*) = 1. So conditionalizing does nothing: the ratio *P*(*T* | *e*)/*P*(*T*) is exactly 1, and no confirmation accrues. The difficulty is generated by the two assumptions I have just used together, strict entailment and certainty. Where a theory does not entail *e* but merely makes it probable, we compare *P*(*e* | *T*) with *P*(*e* | ¬*T*), and the likelihood ratio *P*(*e* | *T*)/*P*(*e* | ¬*T*) can exceed 1 even when I am certain of *e*, so the merely probabilistic case escapes. The problem is therefore a problem about strict entailment and about the ratio measure of confirmation; it does not threaten Bayesianism as such.

  **(b)** The first strategy changes the language. My certainty in *e* is certainty about *e* as expressed in my old language; it need not carry over to the enriched language in which *T* is formulable. So I add to my language a sentence expressing the logical connection between them — the material conditional *T* ⊃ *e* — assign it a prior strictly between 0 and 1, and then, when I sit down and work through the derivation, conditionalize on it: *P*(*T* | *T* ⊃ *e*) > *P*(*T*). The trouble is that I now have to assign priors to indefinitely many such sentences, and it is hard to see what could constrain them; the resulting "confirmation" then looks like an artefact of my own logical laziness rather than a relation between the theory and the phenomenon.

  The second strategy changes the prior instead. Let *P* be the credence function I would have had before I learned *e*. The confirmation *e* confers on *T* is the shift from *P*(*T*) to *P*(*T* | *e*) — that is, to my actual present credence in *T* — and this can be positive even though my real credence in *e* is now 1. The objection is that *P* is indeterminate: there is no fact of the matter about what I would have thought had I not known *e*. Had I not known the perihelion figures, would I even have had the conceptual resources to formulate *T*? The counterfactual prior depends on how the counterfactual situation is filled in, so the strategy replaces one arbitrary number with another.

  **(c)** Neither succeeds: the first makes confirmation depend on ignorance, the second on a counterfactual state that nothing fixes. And these are the only two options, since a Bayesian has just two things to adjust, the language or the prior. So the old-evidence problem is best read not as a puzzle inside Bayesian confirmation theory but as a reductio of it: what confirms a theory is that it *explains* the evidence, and explanation is not a probabilistic relation.

  What I want from you is a mark out of 25 with a breakdown by part, plus the marginal comments you would actually write on the script — comments keyed to particular lines or steps, not general impressions, each saying whether it costs the student anything and why. I am especially interested in steps that look fine on a first reading and do not survive a second: claims that are false given the student's own earlier assumptions, inferences that need a qualification the student never supplies, and distinctions the student draws that do not in fact mark a difference. Where the student reaches a conclusion you agree with by a route you would not accept, say so rather than crediting the conclusion, and tell me whether the slip is a local one or the kind of misunderstanding that will resurface later in the term, when we get to Bayesian treatments of explanation and to the problems that arise for them. If you think the strongest thing in the answer is something other than what I have implicitly flagged above, tell me that too. One last thing, which is my own preoccupation rather than the student's: I have been working on a variant of the problem in which the agent's certainty in *e* is not the residue of any learning event at all, because *e* is a hinge in roughly Wittgenstein's sense — something held fast rather than believed on the strength of evidence. If a remark about that case belongs in the feedback to this student, tell me where you would place it and roughly how you would phrase it; if you think it belongs nowhere near this script, say that instead.
