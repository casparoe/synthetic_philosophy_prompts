answer: |-
  Good morning, and welcome to 'Demarcation after the Instruments'.

  It is a genuine pleasure to see this room divided quite so neatly down the middle. On one side, we have philosophers who know the logical structure of falsificationism better than the scientists who actually practise it. On the other, we have physicists and climate modellers who likely view the demarcation problem as something settled in the twentieth century, whilst you get on with the business of measuring the universe.

  My job in these opening minutes is not to bridge that gap with pleasantries, but to widen it just enough that something interesting might fall through.

  We often teach falsification as a logical rule. A theory makes a prediction; observation contradicts it; the theory falls. But I want to suggest we view it differently today. I want us to think of falsification not as a logical operator, but as a wager. It is about bearing a specific kind of risk.

  For a claim to be scientific, in the Popperian sense, it must expose the claimant to the risk of being wrong in a way that costs them something. That cost might be credibility, it might be funding, or it might be the collapse of a research programme. If you can arrange your theory so that it is compatible with every possible outcome, you have not done science; you have told a story. To do science is to put your head on the block.

  The question for this workshop is whether our instruments have allowed us to take our heads off the block.

  We are operating in an era where science is increasingly mediated by black-box algorithms and detectors of immense complexity. When a climate modeller runs a simulation that predicts a tipping point, or a physicist interprets a signal from a particle collider that cost billions to build, the nature of the wager changes.

  In the classical view, another scientist could, in principle, check your work. They could replicate the experiment. They could audit the logic. The risk was personal and portable. But what happens when the 'experiment' is a neural network trained on data no single human has fully inspected? What happens when the 'replication' requires a million-pound machine that only three institutions on earth possess?

  If I cannot reproduce your result because I lack the hardware, and I cannot inspect your reasoning because the algorithm is opaque, am I still engaging in falsification? Or am I simply submitting to authority?

  There is a danger here that we turn science into a priesthood. If the only way to verify a claim is to trust the person holding the keys to the black box, then the risk of being wrong shifts. It no longer costs the scientist their theory if the theory is hidden inside a code they alone understand. Instead, the cost is transferred to the community, who must pay to trust them.

  This is not an accusation of fraud. It is a structural observation. We have built instruments so powerful that they have outpaced our ability to scrutinise them using the old rules of demarcation.

  So, here is the challenge I want to leave with you as we begin.

  To the philosophers: Do not simply recite Popper. The landscape has changed. If falsification requires risk, where does the risk live in a system of automated discovery? Is it in the code? In the calibration of the detector? Or has it vanished entirely?

  To the scientists: Do not dismiss this as semantics. If the public perceives your work as authority rather than evidence, because the evidence is locked inside a machine they cannot access, you have a political problem as much as an epistemological one.

  Today is not about deciding whether Popper was right or wrong. It is about deciding whether the instruments we use have changed the game so fundamentally that the old rules no longer protect us from error.

  We are here to ask if we are still risking being wrong, or if we have simply engineered a way to be unquestionable.

  Thank you, and let us begin.
