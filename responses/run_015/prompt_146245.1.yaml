prompt: |-
  I'm organising the opening remarks for a one-day workshop we're calling 'Demarcation after the Instruments' — it's about whether falsificationism still holds up now that so much science is mediated by black-box algorithms and expensive detectors. The audience is split into two seperate groups: half philosophers of science who know Popper inside out, and half working scientists (mostly physicists and climate modellers) who probably think demarcation was settled decades ago. I need about five minutes of remarks that actually do structural work, not just name-drop. Use the idea that falsification was always about bearing a specific kind of risk — the risk of being wrong in a way that costs you something — and then push on whether predictions made by algorithms we can't reproduce without a million-pound maschine still carry that risk, or whether they've turned science into something closer to authority. Don't turn it into a bibliography or ask for reading lists — I just need the speech itself, written in British English. I'm rushing this so sorry for any mess.
