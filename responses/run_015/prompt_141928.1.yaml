      *   Known-mixture source tracking? Yes (Defensible via accountability).
      *   EV departure location? Yes (In the belief state, not the calculation).
      *   Negligence/Precaution conflict? Yes (Resolved by Ex-Post/Ex-Ante distinction).
      *   What would be lost? Yes (Humility, Trust, Defensibility).

  7.  (Final Review of the "Known Mixture" logic): The prompt says: "if a fair coin will decide whether those 60 non-red balls are all black or all yellow... treat... as simple 50/50 risk."
      *   Standard Ellsberg: Urn has 30 Red, 60 Black/Yellow (unknown split). P(Red) = 1/3. P(Black) = ?
      *   Coin variant: Flip coin. Heads -> 60 Black. Tails -> 60 Yellow.
      *   P(Black) = 0.5 * (60/90) + 0.5 * 0 = 1/3.
