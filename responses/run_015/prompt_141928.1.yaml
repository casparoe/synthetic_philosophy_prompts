prompt: |-
  I sit on the research ethics committee of a large hospital system, and last night I had a long and unresolved argument with a friend — a health economist — about a rule our committee applies, which I can no longer tell is principled or merely a codified quirk of intuition.

  The rule works in two tiers. When a risk is what we call modelled uncertainty — we agree on the shape of the probability distribution but not on its parameters — we aggregate by averaging over our uncertainty and put the resulting single number into an ordinary expected-value test. When the risk is what we call open uncertainty — the experts cannot agree on a model at all, so there is no probability that anyone can defend, the situation of the Ellsberg urn in which you are told only that 30 of 90 balls are red and the remaining 60 are black and yellow in some unknown proportion — we stop averaging and evaluate the proposal against the worst case within the range the experts do agree on. And a known mixture is explicitly treated as ordinary risk, not as open uncertainty: if a fair coin will decide whether those 60 non-red balls are all black or all yellow, the rule tells us to treat the resulting gamble as a simple 50/50 risk and to average, even though the coin has not yet been tossed and the composition at the moment of the decision is, as a matter of fact, just as unsettled as in the urn case.

  My friend made three charges. First, that the coin case and the urn case are informationally on a par and differ only in the provenance of the numbers, so the rule presupposes that the source or precision of a probability, and not merely its value, can matter to rational choice — which she says is simply the Ellsberg finding promoted into policy, and is a description-sensitivity that counts as a bias by the lights of the very framework we use in the first tier. Second, that averaging and worst-casing differ only in the input: taking the worst case across a set of models is numerically just expected-value maximisation under the most pessimistic member of that set, so either our two tiers are not really two different attitudes, or the rule is committed to something about where the set comes from. Third, she pointed at a wider inconsistency: the law of negligence holds people responsible only for risks that were reasonably foreseeable, and informed consent requires disclosure only of known risks, so unknowable risk seems to be weighed at nothing there — while the precautionary principle, as it gets used in environmental and health regulation, does the opposite and treats the very absence of defensible probabilities as a reason to restrict.

  What I want is the implicit theory, not a verdict on our rule in the abstract. Reconstruct the view of rational choice under uncertainty that the two-tier rule presupposes, and separate what it strictly presupposes from what it merely fits well with. Does treating open uncertainty by worst case while treating modelled uncertainty by averaging commit us to ambiguity aversion being rationally permissible or even required, as opposed to a bias to be corrected? Does the known-mixture clause show that what the rule really tracks is the source or precision of a probability rather than any feature of the world — and if so, is that defensible? Is the two-tier structure a genuine departure from expected-value reasoning at all, given that worst-casing over a set of models is extensionally the same as expected-value reasoning under one pessimistic distribution, or does the departure lie elsewhere: in how the set gets fixed, in what counts as a defensible probability, in the refusal to let merely ambiguous new evidence shrink it? And are the negligence rule and the precautionary principle really in conflict, or do they presuppose consistent things once you distinguish the question of what to do from the question of whom to blame? Finally: if we abandoned the implicit view and adopted my friend's single-probability picture wholesale, what exactly in our rule, and in the wider legal and regulatory pattern, would have to change — and what, if anything, would we lose by changing it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user sits on a hospital research ethics committee (REC). They have a specific two-tier rule for evaluating risk under uncertainty.
      *   **The Rule:**
          *   Tier 1 (Modelled Uncertainty): Agreed distribution shape, unknown parameters $\rightarrow$ Average over uncertainty (Expected Value/EV).
          *   Tier 2 (Open Uncertainty/Ambiguity): No agreed model (Ellsberg urn style) $\rightarrow$ Worst-case evaluation within agreed range.
          *   Clause (Known Mixture): If a random mechanism (coin toss) determines the model *before* the outcome, treat as Tier 1 (EV), even if the state is currently unknown.
      *   **The Friend's Charges (Health Economist):**
          1.  *Informational Parity:* Urn vs. Coin is informationally identical; distinguishing them is "description-sensitivity" (Ellsberg paradox as policy), which is a bias.
          2.  *Mathematical Equivalence:* Worst-case is just EV under a pessimistic prior. The two tiers aren't structurally different, just different inputs.
          3.  *Legal/Regulatory Inconsistency:* Negligence/Informed Consent ignore unknowable risks (weight = 0), while Precautionary Principle penalizes them (weight = high).
      *   **The Goal:** Reconstruct the *implicit theory of rational choice* presupposed by the rule. Distinguish strict presuppositions from compatible fits. Address specific questions:
          *   Is ambiguity aversion permissible/required?
          *   Does the Known-Mixture clause track source/precision? Is it defensible?
          *   Is the two-tier structure a genuine departure from EV reasoning?
          *   Are Negligence and Precautionary Principle in conflict?
          *   What would be lost if we adopted the friend's single-probability picture?

  2.  **Analyze the Implicit Theory:**

      *   *Core Distinction:* The rule distinguishes between *Risk* (known probabilities) and *Ambiguity* (unknown probabilities). This is the Knightian distinction.
      *   *Attitude:* It exhibits *Ambiguity Aversion*. In Tier 1, we act as Bayesians (average). In Tier 2, we act as Maximiners (worst-case).
      *   *The "Known Mixture" Clause:* This is crucial. It aligns with *Reduction of Compound Lotteries*. If the uncertainty is resolvable by a known chance mechanism *before* the relevant outcome, it collapses into Risk. This suggests the rule cares about *epistemic access to a chance setup*, not just the current state of knowledge.
      *   *Ethical Context:* This is a *hospital REC*. The stakes involve patient safety, consent, and institutional liability. The goal isn't just profit maximization; it's protection against catastrophic harm and maintaining trust.

  3.  **Address the Friend's Charges (and the User's Questions):**

      *   *Charge 1 (Informational Parity/Bias):* The friend says Urn = Coin. The rule says Urn $\neq$ Coin.
          *   *Theory:* The rule presupposes that *provenance* matters. A known chance mechanism (coin) provides an objective anchor (frequentist or propensity) that subjective belief (urn) does not.
          *   *Defensibility:* In ethics/regulation, "defensibility" matters more than "ontological identity." If I get sued, I can defend the coin toss probability. I cannot defend the urn proportion. The rule tracks *accountability*, not just ontology.
      *   *Charge 2 (Mathematical Equivalence):* Worst-case = EV under pessimistic prior.
          *   *Theory:* Mathematically true (Maximin can be represented as EV with a specific prior). *But* the philosophical difference is in *commitment*. Tier 1 says "This is the true probability." Tier 2 says "We refuse to commit to a true probability, so we protect against the set."
          *   *Departure:* The departure is in the *formation of the credence*, not the calculation. It rejects the Bayesian requirement to have a single prior for everything. It allows for *sets of probabilities* (Imprecise Probability).
      *   *Charge 3 (Negligence vs. Precaution):*
          *   *Theory:* Negligence is backward-looking (blame). Precaution is forward-looking (action).
          *   *Resolution:* They are not in conflict if you distinguish *ex post* liability from *ex ante* permission. You aren't blamed for what you couldn't know (Negligence), but you aren't allowed to act if the unknown could be catastrophic (Precaution). This fits the REC context: Don't approve the study if the risk is unquantifiable and potentially fatal, even if you wouldn't be sued if it happened unexpectedly.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the problem. Validate that the rule isn't just a quirk; it embodies a specific normative stance (Knightian uncertainty + Ambiguity Aversion in a fiduciary context).
      *   **1. The Implicit Theory of Rational Choice:**
          *   Identify it as *Imprecise Probability* with a *Maximin* decision rule for ambiguity.
          *   Distinguish *Epistemic* vs. *Aleatory* uncertainty. The rule treats them differently.
          *   Address Ambiguity Aversion: It's not a bias here; it's a *fiduciary constraint*.
      *   **2. The Known-Mixture Clause (Source vs. World):**
          *   Why does the coin matter? It creates an *objective chance*.
          *   Defensibility: The rule tracks *justifiability to stakeholders*, not just internal coherence.
          *   Is it defensible? Yes, in an institutional context where audit trails matter.
      *   **3. The Two-Tier Structure (EV vs. Worst-Case):**
          *   Address the "Mathematically Equivalent" charge.
          *   The difference is *Commitment*. Tier 1 commits to a distribution. Tier 2 admits ignorance.
          *   The departure is in the *representation of belief* (Point value vs. Set).
      *   **4. Negligence vs. Precaution:**
          *   Distinguish *Liability* (Negligence) from *Licensing* (Precaution/REC).
          *   Negligence: "Could you have known?" (Epistemic limit).
          *   Precaution: "Can you guarantee safety without knowing?" (Action limit).
