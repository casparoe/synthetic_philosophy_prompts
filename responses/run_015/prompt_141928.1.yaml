      *   But the Rule says: Urn = Ambiguity (Worst Case). Coin = Risk (Average).
      *   Why? Because the Coin introduces an *objective chance mechanism*. The Urn relies on *subjective indifference*.
      *   This confirms the "Source/Provenance" tracking. I need to emphasize that this is about *Objective vs. Subjective Probability*, not just information states.

