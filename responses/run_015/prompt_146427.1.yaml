answer: |-
  You are not being inconsistent. Your gut calls are actually remarkably precise from the perspective of modern pragmatics. However, to make them fit under **one principle**, you have to expand your definition of "cooperation" beyond just "transferring true information."

  The unifying principle that covers all these cases is **The Principle of Rational Expectation within an Activity Type.**

  Here is the breakdown: Meaning is not generated by words alone, nor by a single universal rule of "truth." Meaning is generated by what a **reasonable listener** expects an **agent** to be achieving within a specific **social frame (Activity Type)**.

  *   **Activity Type:** Is this a logic puzzle? A therapy session? A fight? A corporate ritual? A casual goodbye?
  *   **Agent:** Is this a human with beliefs? A social actor following a script? A machine with no mind?
  *   **Expectation:** What is the rational goal here? (Information? Bonding? Compliance? De-escalation?)

  Here is how this principle validates most of your calls, but forces you to re-label three of them to maintain consistency.

  ### 1. The Scalar Case ("Some" vs. "All")
  *   **Your Call:** Misleading.
  *   **The Principle:** Activity Type = *Information Exchange*. Agent = *Human*.
  *   **Analysis:** In an info exchange, the rational expectation is the Maxim of Quantity (be as informative as required). If you know "all" passed, saying "some" violates the expectation of efficiency. You are forcing the listener to do extra work to figure out why you didn't say "all."
  *   **Verdict:** **Keep.** This is classic Gricean scalar implicature.

  ### 2. The Approximation Case ("Mostly accurate")
  *   **Your Call:** Okay.
  *   **The Principle:** Activity Type = *Evaluation*. Agent = *Human*.
  *   **Analysis:** The goal here is utility, not mathematical precision. If the error is tiny, correcting it costs more processing effort than it gains in value. The "truth" condition is relaxed by the *Relevance* of the error.
  *   **Verdict:** **Keep.** This is "loose talk." It is consistent with the first case because the *goals* of the activity differ (precision vs. utility).

  ### 3. The Anger Case (Roommate vs. Therapist)
  *   **Your Call:** Fury implied to roommate; fact to therapist.
  *   **The Principle:** Activity Type = *Conflict* vs. *Clinical Analysis*.
  *   **Analysis:**
      *   **Roommate:** The context (broken mug, tone) creates a clash between the words and the evidence. The rational expectation is that you are managing social face. The implicature ("I am furious") is the *real* message; the words are a formality.
      *   **Therapist:** The activity type is *truth-seeking*. The tone is irrelevant data; the verbal report is the primary data.
  *   **Verdict:** **Keep.** Context shifts the "Cooperative Principle." In therapy, cooperation means honesty; in a fight, cooperation might mean de-escalation (or passive aggression).

  ### 4. The Chatbot Case ("We value feedback")
  *   **Your Call:** Implicature, lie, or third thing?
  *   **The Principle:** Agent = *Machine/Institution*.
  *   **Analysis:** Implicature requires a **mind** to intend a meaning. A chatbot has no beliefs. Therefore, it cannot lie (which requires intent to deceive) and it cannot implicate (which requires intent to imply).
  *   **Forced Adjustment:** You must drop the idea that this is *implicature*. It is **Institutional Affordance Deception**. It is a design feature that mimics a speech act to create a feeling of openness without the function. It is "bullshit" (in the Harry Frankfurt sense: indifference to truth), not a lie.
  *   **Verdict:** **Adjust.** It is a third thing. Calling it implicature gives the bot too much agency.

  ### 5. The Coffee Case ("Let's grab coffee sometime")
  *   **Your Call:** False implicature or social noise?
  *   **The Principle:** Activity Type = *Phatic Communion*.
  *   **Analysis:** The goal of this activity type is **social bonding**, not scheduling. The literal meaning is suspended by convention. If you treat it as a proposal, *you* are the one violating the activity type.
  *   **Forced Adjustment:** You must drop the idea that this is a "false implicature." It is a **Phatic Act**. It is not false because it was never intended to be taken as a proposition. It is the verbal equivalent of a smile.
  *   **Verdict:** **Adjust.** It is social noise (in the good sense). It is not deceptive.

  ### 6. The Meeting Case (3:00 vs. 3:05)
  *   **Your Call:** Sneaky or canceled by shared knowledge?
  *   **The Principle:** Activity Type = *Local Dialect/Norm*.
  *   **Analysis:** Language is code. If the shared code of your office is "3:00 means 3:05," then saying "3:00" is **literally true within that dialect**. It is only sneaky if you are an outsider pretending to be an insider to trick someone, or if you are trying to enforce the "3:00" norm on a new hire who doesn't know the code.
  *   **Forced Adjustment:** If *everyone* knows, you are not being sneaky. You are speaking the local dialect. The implicature of "punctuality" is canceled by the **Common Ground**.
  *   **Verdict:** **Adjust.** It is not sneaky. It is accurate coding.

  ### The Unifying Theory: "Contextual Cooperation"

  You asked if you need separate rules. You don't. You need one rule with variable parameters.

  **The Rule:** *An utterance is felicitous if it meets the rational expectations of the listener regarding the Agent's capacity and the Activity Type's goal.*

  *   **Why you feel consistent:** You are intuitively tracking the *Activity Type* and the *Agent*.
  *   **Where you need to adjust:** You are trying to force the Chatbot, Coffee, and Meeting cases into a "Truth vs. Lie" binary.
      *   The **Chatbot** fails because it lacks agency (not a lie, just broken design).
      *   The **Coffee** remark succeeds because the goal is bonding, not truth (not a lie, just phatic).
      *   The **Meeting** remark succeeds because "3:00" is the correct label for the event in that culture (not a lie, just dialect).

  **Summary of Forced Drops:**
  1.  **Drop** the idea that the Chatbot is generating implicature. (No mind = no implicature).
  2.  **Drop** the idea that the Coffee invite is a "false implicature." (It's a ritual, not a proposition).
  3.  **Drop** the idea that the Meeting time is "sneaky" if the norm is shared. (It's accurate within the local code).

  Your gut is working perfectly; you just need to trust that "truth" changes shape depending on whether you are in a lab, a bar, a therapist's office, or a corporate chat window.
