  ### The Eight Readings: Scores and Tiers

  **Tier 1: Decisive (These carry the argument)**

  1.  **They help strangers more, at real cost, with nobody watching.**
      *   **Score:** 95
      *   **Justification:** This is the gold standard of impartial morality, and winning here would silence the critique that religious goodness is merely performative or tribal.
  2.  **They extend cooperation and trust to out-group members, not just to people like them.**
      *   **Score:** 90
      *   **Justification:** Modern societies rely on generalised trust, so proving religion builds this rather than erodes it would overturn the central secular objection.
  3.  **They score better on the grab-bag of vice indicators: crime, addiction, family breakdown.**
      *   **Score:** 85
      *   **Justification:** This is what the public actually means by 'better', and a clear win here would validate religion as a functional technology for social order.

  **Tier 2: Substantial (Consolation prizes)**

  4.  **They cheat less when cheating is cheap and undetectable.**
      *   **Score:** 75
      *   **Justification:** Personal integrity matters deeply, but it is a narrower claim than universal altruism and easier to dismiss as fear of divine punishment rather than virtue.
  5.  **There's a tighter fit between the principles they state and what they actually do.**
      *   **Score:** 60
      *   **Justification:** Consistency is admirable, yet it vindicates honesty rather than the moral content of the principles themselves.
  6.  **They help more, but mainly inside their own community.**
      *   **Score:** 35
      *   **Justification:** While charitable, this confirms the tribalism critique rather than refuting it, offering little comfort to a pluralistic society.

  **Tier 3: Decoys (Rhetorical smoke)**

  7.  **They punish norm-violators more readily even when punishing costs them personally.**
      *   **Score:** 45
      *   **Justification:** Enforcement maintains order but can easily slide into zealotry, so it is as likely to be seen as a vice as a virtue.
  8.  **They have a stronger and more reliable moral self-conception.**
      *   **Score:** 25
      *   **Justification:** Feeling morally superior is a psychological state, not a moral outcome, and could simply indicate self-deception.

  ***

  ### 1. The Echo Hypothesis Rating

  **Fraction surviving:** 0.4

  **Reasoning:** Accepting that secular trust is inherited religious capital concedes the present functionality but denies the structural independence, suggesting the secular model is parasitic on the religious past rather than proof of obsolescence.

  ***

  ### 2. Damage Assessment

  **Most damaging negative for the religious side:** Reading 1 (Helping strangers anonymously).
  **Most damaging positive for the secular side:** Reading 7 (Out-group trust).

  **Why they differ:** A failure on Reading 1 destroys the claim of individual moral virtue, whereas a success for religion on Reading 7 destroys the claim that secularism is structurally necessary for universal cooperation.

  ***

  ### 3. The Tell

  **Religious Camp:**
  *   **Insist on:** Reading 5 (Vice indicators).
  *   **Swap to:** Reading 8 (Moral self-conception).
  *   **Tell:** They will lead with crime and family statistics because self-reports favour them, but if behavioural data fails, they will retreat to the sincerity of their intentions.

  **Secular Camp:**
  *   **Insist on:** Reading 1 (Anonymous helping).
  *   **Swap to:** Reading 7 (National trust).
  *   **Tell:** They will focus on the lab games where the religious gap vanishes, but if pressed on individual volunteering, they will zoom out to cross-national corruption indices where they hold the advantage.
