  JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Thresholds of Historicity in Legend (Trojan, Arthurian, Exodus)
  **Parties:** Event-Trace Recoveryist (ETR) / Morphological Integrationist (MI)
  **Date:** October 14, 2023

  After twelve months of debate regarding the transition point from legend to history, we submit the following joint statement. While we remain fundamentally opposed on methodological priorities, we have identified a baseline of factual agreement necessary for future discourse.

  **Agreed Claims**

  1.  All three case studies (Trojan War, King Arthur, Exodus) possess archeological correlates that do not line up cleanly with the narrative timelines provided by the primary texts.
  2.  The phrase 'historical kernel' already smuggles in assumptions about the separability of fact and fiction that neither side can currently prove.
  3.  We agree on the existence of the Schliemann boundary problem: the point where excavation stops being confirmation and starts being interpretation.
  4.  Neither side claims that the absence of evidence is strictly evidence of absence, though we weigh the silence differently.
  5.  Both parties acknowledge that political and cultural utility drives the preservation of these stories regardless of their empirical accuracy.

  **Areas of Persistent Disagreement**

  | Crux (Neutral Wording) | Event-Trace Recoveryist View | Morphological Integrationist View |
  | :--- | :--- | :--- |
  | **1. Does narrative coherence across versions make historicity more or less likely?**<br><br>*Relevant Evidence: The Tawagalawa Correspondence* | **More Likely.** Coherence suggests a shared memory of a real event surviving oral transmission.<br><br>*Prediction:* The Hittite mention of Wilusa (Troy) and conflict implies a specific historical war backbone that Homer later dressed up. | **Less Likely / Neutral.** Coherence suggests a shared literary milieu and trope exchange, not event memory.<br><br>*Prediction:* The Hittite text is diplomatic rhetoric using known place names, unrelated to the specific narrative arc of the Iliad. |
  | **2. Is missing direct archaeological evidence fatal, or just par for the course?**<br><br>*Relevant Evidence: The Merneptah Stele* | **Par for the Course.** Preservation bias explains gaps; positive identification elsewhere validates the whole.<br><br>*Prediction:* Since the Stele names 'Israel' in Canaan, the Exodus group must have existed even if Sinai camps aren't found. | **Par for the Course (for different reasons).** The lack of evidence is expected because the 'event' is a fusion of identity formation, not a migration.<br><br>*Prediction:* The Stele proves 'Israel' was a socio-political label by 1200 BCE, not proof of a preceding Exodus narrative. |
  | **3. Is the claim that form and content are fused actually falsifiable, or is it a methodological stance?**<br><br>*Relevant Evidence: Cadbury Hillfort Layers* | **Falsifiable.** If we find a distinct destruction layer matching the legend's date, content is seperable from form.<br><br>*Prediction:* Occupation layers from the 5th/6th century prove a 'Arthur-like' figure commanded the site, regardless of later myths. | **Methodological Stance.** The fusion cannot be falsified because the 'figure' is constructed by the layers themselves.<br><br>*Prediction:* The layers show why this site was chosen for the myth later, not that the myth describes the site's actual use. |

