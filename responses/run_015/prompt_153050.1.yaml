prompt: |-
  hey, can you draft the adverserial colloboration document between an event-trace recoveryist and a morphological integrationist? they've been fighting for like a year about when a legend actually becomes history, using the Trojan War, King Arthur, and the Exodus as the three main cases. i want the joint statement they'd actually both sign.

  format: first a numbered list of agreed claims -- include that all three stories have archaeological correlates that don't line up cleanly, that the phrase 'historical kernel' already smuggles in assumptions, and something about the Schliemann boundary problem being the point where excavation stops being confirmation and starts being interpretation. then a disagreements table: each row should have the crux in neutral wording, then column for recoveryist view (worded so they'd accept it) and integrationist view (same).

