  for each crux, name one concrete case or bit of evidence both sides agree is relevant -- like the Tawagalawa correspondence, the Cadbury hillfort layers, the Merneptah stele -- and write down each side's prediction about what that case shows.

  no bibliographies, no 'further reading', and don't make it a dialogue. just the document. casual is good; a typo or two won't hurt.
