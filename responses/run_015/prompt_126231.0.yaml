      *   No citations? Yes.
      *   Final section on settled/contested? Yes.

  11. **Writing the Proposal:** (Proceeding to generate text based on these thoughts).
      *   *Title:* Needs to be catchy. "The Price of Parity."
      *   *Opening:* Hook the reader with the misinterpretation of impossibility theorems.
