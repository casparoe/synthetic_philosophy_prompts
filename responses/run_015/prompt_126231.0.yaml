      *(Refining the "Randomization" argument)*: Randomization convexifies the ROC curve. This is standard decision theory. The novelty is applying it specifically to the *impossibility theorem* narrative. I need to make sure I don't sound like I'm discovering convexity for the first time. The contribution is re-interpreting the impossibility result through this lens.

      *(Refining the "Harm" argument)*: Since I can't measure real harm, I must model harm as a parameter. The output is "If harm ratio is X, the cost of fairness is Y."

  10. **Final Review against Constraints:**
      *   Prose, not bullets? Yes.
