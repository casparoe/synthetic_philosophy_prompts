  8.  **The "Settled vs. Contested" Section:**
      *   *Settled:* The impossibility theorem itself (for deterministic rules).
      *   *Contested:* Whether calibration is a fairness metric (some say it's accuracy). Whether randomization is permissible (individual fairness vs. group fairness). Whether harm can be commensurated.
