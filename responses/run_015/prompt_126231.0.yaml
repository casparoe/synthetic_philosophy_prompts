answer: |-
  **Project Title:** The Price of Parity: Randomization and Harm-Weighting in Algorithmic Fairness Impossibility Results

  **The Research Question**

  The central question of this project is: *To what extent does the "impossibility" of satisfying multiple fairness criteria simultaneously dissolve when decision rules are permitted to be randomized and errors are denominated in a common currency of downstream harm?*

  Current impossibility theorems in algorithmic fairness establish that for a deterministic predictor, calibration within groups is mathematically incompatible with equalized false positive and false negative rates across groups, except in degenerate cases where base rates are equal or prediction is perfect. This result is frequently interpreted in policy and technical discourse as a proof that "fairness is impossible." This project challenges that interpretation by isolating two specific modeling assumptions that drive the impossibility: the restriction to deterministic decision thresholds and the treatment of all classification errors as unit-cost events. By formalizing a decision framework that allows for randomized thresholds (lotteries over borderline cases) and weights errors by their relative social cost, I aim to determine whether the impossibility is a hard structural barrier or a manageable trade-off. The determinate answer sought is a characterization of the "fairness frontier": a mapping of how much total expected harm must be incurred to satisfy parity constraints under varying conditions of base rate disparity and predictor accuracy.

  **Why Existing Results Do Not Settle This**

  The existing impossibility literature provides a necessary condition for incompatibility, but it is not sufficient for guiding practice. These theorems prove that no *deterministic* classifier can satisfy the constraints, but they do not quantify the distance to feasibility if the decision rule is relaxed. The standard alternative in the literature is to propose epsilon-relaxations, allowing fairness metrics to differ by some small margin. However, epsilon-fairness is arbitrary; it offers no structural justification for why a specific deviation is acceptable, nor does it illuminate the economic or social cost of that deviation.

  Similarly, causal accounts of fairness often suggest that we should model the underlying data generating process to explain base rate differences. While valuable for long-term structural intervention, causal modeling does not resolve the immediate operational conflict faced by a decision-maker who must deploy a risk score today. A practitioner cannot wait for base rates to equalize; they must set a threshold now.

  The proposed angle—randomization plus harm-denominated accounting—is distinct because it changes the geometry of the feasible set rather than merely relaxing the constraints. In decision theory, randomizing over actions convexifies the set of achievable error rates. If the impossibility arises because the deterministic feasible set is non-convex, randomization theoretically allows the decision-maker to hit any point within the convex hull of the error rate space. However, this mathematical possibility does not guarantee normative desirability. By introducing a harm-weighted objective function, the project moves beyond asking "can we satisfy the constraints?" to "what is the cost of satisfying them?" This shifts the discourse from metaphysical impossibility to cost-benefit analysis, which is actionable for practitioners.

  **Why This Angle Is Worth Six Months**

  This project is scoped specifically for a six-month, solo fellowship because it relies on theoretical derivation and synthetic simulation rather than empirical data collection. The core work involves formalizing the convexified feasible set for a risk score under group-specific base rates and deriving the optimal randomized decision rule that minimizes weighted harm subject to parity constraints. This requires no IRB approval, no data cleaning, and no external partnerships.

  The value lies in correcting a pervasive misinterpretation of fairness theory that paralyzes implementation. If the "impossibility" is actually a "high price," practitioners need to know the price tag. If the price is negligible in many realistic parameter regimes, the impossibility theorem is being over-read. If the price is prohibitive, the theorem is correctly understood but for the wrong reason. Six months is sufficient to derive the theoretical bounds, run comprehensive sensitivity analyses on synthetic risk distributions, and produce a clear visualization of the trade-off curves. This is a "one-paper" scope that tightens the conceptual foundations of the field without requiring the overhead of empirical validation.

  **Methodology and Timeline**

  The first month will be dedicated to formalizing the baseline impossibility result in the notation of decision theory, explicitly isolating the determinism assumption. I will reproduce the standard proofs to ensure the subsequent modifications are rigorous. In the second month, I will derive the feasible region for error rates when the decision rule is allowed to be a probability function over the risk score (a randomized threshold). This involves characterizing the convex hull of the Receiver Operating Characteristic curves for each group.

  Months three and four will focus on the harm-weighting model. Since I am not collecting data, I will model harm as a parameter: the ratio of the cost of a false positive to the cost of a false negative. I will run simulations across a grid of synthetic environments, varying base rate disparities, predictor accuracy (AUC), and harm ratios. For each environment, I will calculate the minimum total harm required to satisfy parity constraints using both deterministic and randomized rules.

  In month five, I will analyze the "price of fairness," defined as the ratio of harm incurred under fairness constraints to the harm incurred under unconstrained optimization. I will identify the regimes where randomization significantly reduces this price versus where it offers little advantage. The final month will be devoted to writing the paper and refining the visualizations to ensure the trade-off curves are interpretable by non-specialists.

  **The Deliverable**

  The primary deliverable is a paper suitable for a venue like *FAccT* or *AIES*, but the practical output is a "Fairness Price Framework" for practitioners. This framework will provide a set of guidelines and lookup tables that allow a deployer to estimate the cost of fairness constraints given their specific context parameters (base rates, model accuracy, and estimated harm ratios). Instead of citing an impossibility theorem to halt deployment, a practitioner could use this framework to state: "Satisfying error rate parity requires a randomized threshold that increases total expected harm by X%." This transforms the conversation from a binary "can/cannot" to a transparent accounting of trade-offs, enabling more honest stakeholder deliberation about whether that cost is acceptable.

  **Failure Modes**

  It is critical to be honest about where this project might fail to yield novel insights. First, the convexification point may be trivial. The fact that randomization convexifies feasible sets is standard decision theory; if the application of this to fairness impossibility results yields only a restatement of known linear programming bounds, the contribution will be incremental rather than substantive.

  Second, the harm currency may prove inestimable even in theory. If the "price of fairness" is hyper-sensitive to the harm ratio parameter, and that parameter cannot be bounded without empirical data I am not collecting, the results may be too vague to be useful. The project risks concluding that "the cost depends on costs," which is tautological.

  Third, the project could collapse into the epsilon-relaxation literature. If the optimal randomized rule effectively mimics a deterministic rule with a relaxed epsilon, the distinction may be mathematical hair-splitting without practical difference. Finally, there is the risk that the "price" turns out to be universally prohibitive in realistic regimes, which would reinforce the pessimistic reading of the impossibility theorems rather than nuance it.

  **Epistemic Status: Settled vs. Contested Claims**

  To ensure the proposal does not overstate its ground, I distinguish here between the settled mathematical background and the contested normative claims I will be engaging.

  *Settled:* The mathematical impossibility of satisfying calibration and error rate parity simultaneously with deterministic rules (given unequal base rates) is a proven theorem. It is also settled decision theory that randomizing actions convexifies the set of achievable error probabilities. No reviewer should contest the algebraic derivation of the feasible sets.

  *Contested:* Whether calibration is a *fairness* requirement is heavily debated; many scholars view it as an accuracy metric, arguing that forcing calibration across groups can perpetuate historical biases. My proposal treats calibration as a constraint to be analyzed, not necessarily endorsed, but I must avoid implying it is the sole definition of fairness.

  Furthermore, the permissibility of randomized decision rules is normatively contested. While mathematically sound, "lotteries" for loans or pretrial release may violate individual fairness norms or legal due process standards, even if they satisfy group parity. I will not argue that randomization *should* be deployed, only that it changes the mathematical trade-off.

  Finally, the commensurability of harm is philosophically contested. Utilitarian frameworks accept weighing false positives against false negatives in a common currency; deontological frameworks often reject this, viewing certain errors as rights violations that cannot be traded off. My project assumes a cost-sensitive framework for the sake of analysis, but I will explicitly flag this as a modeling choice, not a moral consensus. The proposal rests on the claim that even if one rejects these normative premises, understanding the mathematical structure of the trade-off is necessary to argue against them effectively.
