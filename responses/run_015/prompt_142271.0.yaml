      *   *Clarification on Circularity:* The key is the *failure* of sympathy. If I can't sympathize with the spectator's disapproval, I feel shame. The circularity charge assumes I control the spectator's verdict. Smith says the spectator's verdict is constrained by the "situation."

  6.  **Final Polish:** Ensure the language is accessible. Use the hospital context if it helps (e.g., "sterilisation" metaphor for cleaning the view?), but keep it professional. (Decided to stick to the text metaphors like "mirror" and "distance" to avoid forced analogies). Make sure to explicitly answer the "three limbs" question.

      *   *Limb 1:* What are (Actual social pressure).
      *   *Limb 2:* What would be (Idealized social pressure / informed).
      *   *Limb 3:* What ought to be (Normative standard).
      *   *Averaging View:* Fits Limb 1, breaks on Limb 3.
