      *   *Circularity:* Avoided by the constraint of the spectator's "situation."

      *   *Para 2 Tension:* Origin vs. Authority. The mirror creates the eye, but the eye can eventually see things the mirror doesn't show.

      *   *Later Machinery:* Acknowledge that Part III, Chapter 3-4 is where the "Man Within" becomes distinct from the "Man Without." But for now, the "Ought" limb is the foothold.

