answer: |-
  Your intuition is spot on. Your brother has constructed a very clever, philosophically sophisticated model, but he is engaging in what comparative philosophers call **"conceptual stretching."** He is taking Western ethical categories (utilitarianism, consequentialism, deontology) and forcing Buddhist concepts to fit inside them.

  While this is a common exercise in Western religious studies (scholars like Charles Goodman argue exactly what your brother is arguing), it is highly contested (by scholars like Damien Keown).

  Here is a breakdown of where his summary is insightful, where it is a category mistake, and how you can reply without sounding like you're attacking him.

  ### 1. Karma vs. Expected Utility (The Category Mistake)
  **His Claim:** Karma is "hidden-variable utilitarianism" where intention = expected utility spread across rebirths.
  **The Reality:** This is the biggest simplification.
  *   **Utilitarianism** measures the *external consequence* of an act (e.g., did this action make more people happy?).
  *   **Buddhist Ethics** measure the *internal conditioning* of the agent (e.g., did this action reinforce greed, hatred, and delusion in *my* mind?).

  In Buddhism, *cetana* (volition/intention) is karma. If I try to save a life but fail, my karma is good. If I try to kill someone but fail, my karma is bad. A utilitarian would say the outcome matters most; a Buddhist says the state of the mind matters most.
  *   **The Category Mistake:** Treating *dukkha* (suffering/unsatisfactoriness) as a simple negative utility value. In Buddhism, *dukkha* isn't just "pain"; it's an ontological error caused by clinging to a self that doesn't exist. You can't "optimize" away *dukkha* like a math problem; you have to realize the nature of reality.

  **Verdict:** He is describing a **Teleological** system (goal-oriented), which Buddhism is, but calling it **Consequentialist** (outcome-based) ignores that the "consequence" Buddhism cares about is spiritual maturity, not worldly happiness.

  ### 2. Virtue Ethics vs. Consequentialism
  **His Claim:** Buddhism has no deontological backbone; it's all outcome tracking.
  **The Reality:** Most contemporary scholars of Buddhist ethics (most notably Damien Keown) argue that Buddhism fits **Virtue Ethics** (like Aristotle) better than Consequentialism.
  *   In Virtue Ethics, the focus is on *character*. You follow precepts not because you are calculating the karmic math of every breath, but because following them cultivates a virtuous character (*sila*).
  *   The Precepts (*Panca-sila*) function deontologically (as rules) for 99% of practitioners. Monks follow the Vinaya rules strictly, regardless of the "outcome."
  *   **The Flaw:** If Buddhism were pure consequentialism, a monk could lie if it produced a "better" karmic outcome. But in Theravada, lying is a *parajika* offense (expulsion), regardless of the "net reduction in suffering."

  **Verdict:** He is ignoring the **Virtue Ethics** framework, which is the standard academic counter-argument to his position.

  ### 3. *Upaya* and the Organ-Harvesting Dilemma
  **His Claim:** *Upaya* (skillful means) allows breaking precepts if the net suffering reduction is high (like the organ-harvesting dilemma).
  **The Reality:** This is dangerous oversimplification.
  *   **The Organ Harvesting Dilemma:** A utilitarian kills one healthy person to harvest organs and save five sick people.
  *   **Buddhist *Upaya*:** There is a famous Mahayana sutra (*Upaya-kausalya Sutra*) where a Bodhisattva kills a man who is about to kill 500 merchants.
      *   *Crucial Difference:* The Bodhisattva does not do this to "maximize utility." He does it out of compassion for the *murderer* (to stop him from going to hell) and accepts that *he himself* will go to hell for the act of killing.
      *   It is **self-sacrifice**, not **calculation**.
  *   **The Requirement:** *Upaya* is only valid when grounded in *Prajna* (wisdom of emptiness). An ordinary person cannot use *upaya* to break precepts because they lack the wisdom to know if they are truly acting out of compassion or just ego. Your brother's model suggests any Buddhist can break rules if the math works out. Traditional Buddhism says only highly realized Bodhisattvas can do that, and even then, it's rare.

  **Verdict:** He is treating *upaya* as a "get out of jail free" card for utilitarian calculus, whereas tradition treats it as a dangerous tool reserved for those who have transcended the duality of rules and rule-breaking.

  ### 4. Smushing Theravada and Mahayana
  **His Claim:** Both traditions sign off on this framework.
  **The Reality:** This is academically sloppy.
  *   **Theravada:** Generally much more deontological regarding the Vinaya (monastic code). The goal is Arhatship (individual liberation).
  *   **Mahayana:** More flexible on precepts but demands the motivation of *Bodhicitta* (mind of enlightenment). The goal is Buddhahood (for all beings).
  *   **The Conflict:** A Theravadin monk would likely reject the Mahayana idea that breaking a precept can ever be skillful means. By smushing them, your brother creates a "Generic Buddhism" that doesn't actually exist on the ground.

  ### How to Reply (Without Starting a Fight)
  Your brother is clearly smart and trying to synthesize complex ideas. If you tell him he's "wrong," he'll get defensive. Instead, frame it as **"That's a fascinating utilitarian reading, but have you looked at the Virtue Ethics counter-argument?"**

  Here are three points you can raise in your reply:

  1.  **The "Virtue Ethics" Label:** Mention Damien Keown. Tell him, *"I read that a lot of scholars argue Buddhism fits Aristotle's Virtue Ethics better than Mill's Utilitarianism because the focus is on cultivating character (sila) rather than calculating karmic outcomes for every act."*
  2.  **The Nature of Intention:** Ask him, *"If karma is about expected utility, how does Buddhism explain acts where the intention is pure but the outcome is disastrous? Utilitarianism struggles there, but Buddhism seems to say the intention is the only thing that karmically matters."*
  3.  **The Upaya Risk:** Ask, *"Doesn't treating Upaya like utilitarian rule-breaking risk justifying ego-driven actions? I thought Upaya required realization of Emptiness, not just a calculation of suffering."*

  ### Summary
  *   **Is he wrong?** Not entirely. This is a recognized philosophical interpretation (Consequentialist Buddhism), but it is **one side of a debate**, not settled fact.
  *   **Is he simplifying?** Yes, heavily. He is stripping out the soteriological (salvation/liberation) context to make it fit a Western philosophy syllabus.
  *   **Should you call him out?** Gently. Point out that while his model is logically consistent, it might miss the *phenomenological* point of Buddhism (which is about ending the illusion of self, not optimizing the self's future).

  **Bottom line:** He's written a great **Philosophy 101** paper. He's written a less accurate **Religious Studies** paper. You're right to feel he's forcing the box.
