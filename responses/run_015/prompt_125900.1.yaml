  4.  **Drafting the Content (Iterative refinement):**

      *   *Karma:* Make sure to emphasize *cetana* (intention). It's not about the "world result" (which Buddhism sees as often out of control) but the "seed planted in the mind."
      *   *Upaya:* Use the example of the Captain killing a murderer on a ship (Upaya-kauśalya Sūtra). The Captain accepts the karma to save the murderer from hell. It's self-sacrifice, not "greater good" calculus in the utilitarian sense.
      *   *Category Mistake:* Yes, treating *dukkha* as a simple negative utility value misses the ontological claim (that *dukkha* comes from clinging, not just pain).
