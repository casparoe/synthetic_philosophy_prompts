answer: |-
  A postdoc corners a Bayesian epistemologist in the department lounge, waving a printout.

  "I've finally solved the problem of verisimilitude," the postdoc says. "I have a formal metric that ranks theories by their closeness to the truth."

  The Bayesian takes a cautious sip of coffee. "Walk me through the likelihood function. How do you calculate the distance?"

  "It's elegant," the postdoc says. "For any theory $T$, you take its consequence class and partition it into two sets: the true consequences and the false consequences. Then you compute the weighted ratio of the true set against the false set."

  The Bayesian sets his mug down. "And to perform that partition... how do you classify the consequences?"

  "You verify them against the actual state of the world," the postdoc says. "Obviously."

  "Obviously," the Bayesian repeats. "So, to compute the verisimilitude of a hypothesis, you must first know the truth-value of all its consequences."

  "Yes."

  "Which means you can only run the calculation if you already know the truth."

  "Correct."

  "So," the Bayesian says, rubbing his temples, "your measure for ranking *false* theories is only computable for the theory that is *true*."

  "Exactly! For the true theory, the score is perfect."

  "So it's not a guide to inquiry," the Bayesian says. "It's a victory lap."

  "No," the postdoc corrects, beaming. "It's a search algorithm that returns a value only once you've already found the object."

  The Bayesian closes his eyes. "So the domain of your function is a singleton set containing the Truth."

  "Technically, yes."

  "Great. So you've invented a ladder for climbing out of ignorance, but the first rung is located at the top."
