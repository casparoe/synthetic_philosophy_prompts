      *   *Tension 4: Derivation vs. Ontology.* The user wants Born Rule from rationality (2) but says weights are objective (3). If weights are objective, why do we need decision theory to tell us how to bet? Shouldn't the objective weights dictate the credence directly? If decision theory is needed, does that imply the weights *aren't* doing the heavy lifting ontologically?
      *   *Tension 5: "My Branch" vs. Everettian Ontology.* The user wants probability to attach to "my branch" (4). In MWI, *all* branches happen. There is no unique "my branch" until indexicality is invoked. But the user rejects SLU (5), which is the standard tool for handling indexicality in MWI. How do you single out "my branch" for probability without SLU or Typicality?

