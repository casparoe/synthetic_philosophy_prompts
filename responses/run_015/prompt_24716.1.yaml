          *   *Why:* If weights are *objective features of the world* (3), why do we need a decision-theoretic proof (2) to justify using them for credence? Usually, objective chances constrain credence via the Principal Principle. If the user invokes DW, it suggests the weights *aren't* self-evidently probability-makers. If they are objective, DW is redundant. If DW is necessary, the objectivity claim is shaky.
