prompt: |-
  As a journalist who covers science and ideas, I am preparing a long-form investigation into the conceptual architecture of corruption, and I need a rigorously defended research agenda rather than a survey of familiar scandals. The public conversation tends to treat corruption as self-evident—bribery, embezzlement, nepotism—measured against Western bureaucratic norms. Yet the deeper fractures remain unresolved: whether clientelism and ritualized gift-giving in non-Western contexts constitute corruption, failed institutional substitutes, or legitimate reciprocal obligations; whether universal anti-corruption metrics commit a category error by applying impartial-state ideals to societies in which personalized exchange underwrites social order; and whether corruption is best defined by outcome divergence from formal rules or by the violation of locally legitimate expectations of reciprocity. There is also the uncomfortable possibility that Western anti-corruption instruments themselves depend on hidden gift economies—campaign patronage, lobbying circuits, academic endowment networks—raising questions about the coherence of the universalist stance itself.

  If you were advising a research funder able to support roughly three senior scholars and two postdoctoral researchers for four years—working in conceptual ethics, comparative political theory, and institutional design, with no mandate for large-scale empirical fieldwork—which open conceptual questions should they prioritize, and in what order? I want an agenda, not a bibliography. For each priority, explain why it is upstream of the others, how tractable it is for philosophers and theorists rather than for survey researchers, and what conceptual result over the next few years would cause you to reorder the list. In particular, please weigh and rank the following three lines of work: first, refining a universalist definition of corruption that can accommodate contextual reciprocity without collapsing into moral relativism; second, developing a functional framework—distinguishing, for instance, integrative personalized exchange that sustains public goods from extractive exchange that diverts them—that classifies practices by their relationship to collective welfare rather than by deviation from formal rules; and third, examining whether the hidden reciprocity structures within Western governance undermine the normative authority of universal anti-corruption standards, and what that implies for cross-cultural evaluation.

  Defend your ranking with explicit criteria: dependency relations among the questions, tractability within the resource constraints I have described, and potential to reshape policy discourse rather than merely describe local variation. Identify which single conceptual breakthrough would most alter how journalists and policymakers talk about corruption, and state honestly which of these three lines you would deprioritize if the funder insisted on cutting one, together with what is lost by that cut. Please do not recommend specific scholars to read, empirical datasets to gather, or citation lists; I am asking what conceptual labor needs doing, and why it deserves years of focused effort.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Role:** Journalist covering science and ideas (seeking depth, conceptual rigor, not just facts).
      *   **Topic:** Conceptual architecture of corruption.
      *   **Goal:** A rigorously defended research agenda (priorities, order, justification) for a specific funding scenario.
      *   **Funding Scenario:** 3 senior scholars, 2 postdocs, 4 years. Disciplines: Conceptual ethics, comparative political theory, institutional design. *No large-scale empirical fieldwork.*
      *   **Core Tensions:** Universalism vs. Contextualism, Formal Rules vs. Reciprocity, Western Hypocrisy vs. Normative Authority.
      *   **Specific Tasks:**
          *   Prioritize three specific lines of work (Universalist Definition, Functional Framework, Western Hidden Reciprocity).
          *   Explain *why* the order matters (upstream/downstream).
          *   Explain tractability for theorists (not survey researchers).
          *   Define what conceptual result would reorder the list.
          *   Defend ranking with criteria (dependency, tractability, policy impact).
          *   Identify the single most impactful conceptual breakthrough.
          *   State which line to cut if necessary and what is lost.
      *   **Constraints:** No bibliographies, no specific scholar names, no empirical dataset recommendations. Focus on *conceptual labor*.

  2.  **Deconstruct the Three Lines of Work:**
      *   *Line 1: Universalist Definition.* Refining a definition that handles context without relativism. (Meta-ethical/Conceptual).
      *   *Line 2: Functional Framework.* Distinguishing integrative vs. extractive exchange based on welfare/outcomes, not rules. (Normative/Institutional).
      *   *Line 3: Western Hidden Reciprocity.* Examining Western hypocrisy and its effect on normative authority. (Comparative/Political Theory).

  3.  **Determine the Logical Dependencies (The "Upstream" Question):**
      *   You cannot measure function (Line 2) without knowing what *counts* as the relevant unit of analysis or what "public good" means in a specific context.
      *   You cannot accuse the West of hypocrisy (Line 3) effectively unless you have a stable standard to accuse them of violating (Line 1) OR a functional metric that shows their systems are also extractive (Line 2).
      *   However, Line 1 (Universalist Definition) is the trap. If you start there, you get stuck in semantic debates about "culture."
      *   Line 2 (Functional Framework) seems most upstream. Why? Because before you define corruption universally, you need to know *what corruption does*. Is it a violation of rule X? Or is it the erosion of trust Y? If we shift the definition from "rule-breaking" to "system-eroding," Line 1 becomes easier to solve, and Line 3 becomes a specific instance of Line 2.
      *   *Wait, reconsider:* Line 1 is often the blocker for policy. But the prompt asks for *conceptual* architecture. A functional framework (Line 2) provides the *criteria* for the definition (Line 1). You can't define "corruption" universally until you agree on the *function* of public office.
      *   *Alternative View:* Line 3 (Western Hypocrisy) is politically potent but conceptually derivative. It relies on the standards set in 1 and 2.
      *   *Best Order:* Line 2 (Functional) -> Line 1 (Definition) -> Line 3 (Reflexivity).
      *   *Reasoning:* You need to know what constitutes harm/benefit (Function) before you can define the violation (Definition), and only then can you apply it reflexively to the accusers (Reflexivity).

  4.  **Evaluate Tractability for Theorists (4 Years, 5 People):**
      *   *Line 1 (Definition):* Highly tractable for philosophers. It's analytic work. Risk: Getting stuck in abstraction.
      *   *Line 2 (Function):* Tractable for political theorists/institutional designers. Requires modeling "public good" without empirical data. Risk: Becoming too vague.
      *   *Line 3 (Western Reflexivity):* Tractable for comparative theorists. Requires analyzing existing Western institutions through the new lens. Risk: Becoming polemical rather than conceptual.
      *   *Constraint Check:* No fieldwork. All three are doable. Line 2 is the heaviest lift conceptually but yields the most policy leverage.

  5.  **Drafting the Agenda - Step-by-Step:**

      *   **Introduction:** Acknowledge the depth of the prompt. Set the tone (rigorous, structural).
      *   **Ranking:**
          1.  *Priority 1: The Functional Framework (Line 2).* Why? It solves the "rule vs. norm" problem. It defines the *telos* of public office.
          2.  *Priority 2: The Universalist Definition (Line 1).* Why? Once function is established, definition follows. It prevents relativism by anchoring to function, not culture.
          3.  *Priority 3: Western Reflexivity (Line 3).* Why? It applies the findings of 1 & 2. It's the "check" on the system.
      *   **Justification:**
          *   *Dependency:* You can't define corruption (1) without knowing what public office is *for* (2). You can't critique the West (3) without a consistent standard (1 & 2).
          *   *Tractability:* Theorists can model functions and definitions without surveys.
          *   *Policy Impact:* Moving from "rule-breaking" to "system-eroding" changes enforcement.
      *   **The Reordering Trigger:** What would make me change my mind? If Line 2 proves impossible to universalize (i.e., "public good" is irreducibly local), then Line 1 becomes the primary bottleneck.
      *   **The Single Breakthrough:** Shifting from "Illegal Act" to "Systemic Betrayal of Public Trust/Function."
      *   **The Cut:** If I must cut one, it's Line 3 (Western Reflexivity). Why? It's politically explosive but conceptually dependent. Losing it means losing the "punch," but keeping the theoretical foundation.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Line 2 really upstream of Line 1? Usually, definitions come first.
      *   *Counter:* In moral philosophy, *function* often precedes *definition* (e.g., what is a "good knife" before defining "broken knife"). Corruption is a functional failure. If I define corruption as "bribery" (Line 1), I miss the functional harm. If I define it as "subversion of public function" (Line 2), the definition (Line 1) flows from that. So Line 2 is ontologically upstream.
      *   *Critique:* Is Line 3 just a political point?
      *   *Counter:* No, it's about *normative authority*. If the West violates its own standards, does the standard collapse? That's a conceptual question about the validity of universal norms, not just a "gotcha."
      *   *Tone Check:* Ensure I don't sound like I'm giving policy advice, but rather *conceptual* advice. Use terms like "normative architecture," "teleological," "conceptual coherence."

  7.  **Final Polish:**
      *   Check against constraints: No scholars named? Yes. No datasets? Yes. 3 lines ranked? Yes. Cut identified? Yes.
      *   Ensure the "Journalist" persona is respected (focus on how this changes the *story* and *discourse*).
      *   Make sure the "Four Years/5 Scholars" constraint is respected (scope must be manageable).

  8.  **Final Output Structure:**
      *   Executive Summary of the Agenda.
      *   Priority 1 (Functional Framework) + Rationale.
      *   Priority 2 (Universalist Definition) + Rationale.
      *   Priority 3 (Western Reflexivity) + Rationale.
      *   The Reordering Condition.
      *   The Single Breakthrough.
      *   The Cut (and the cost).

  *(Self-Correction during final review)*: Make sure I explicitly address the "dependency relations" and "tractability" criteria in the defense section as requested. Ensure the distinction between "integrative" and "extractive" is highlighted as the key conceptual tool.

