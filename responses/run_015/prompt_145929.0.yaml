answer: |-
  Here are five candidate sharpenings of your core intuition, followed by my selection rationale and the draft proposal.

  **Candidate 1: The Impossibility Theorem.**
  Focus entirely on formal proof. Attempt to demonstrate that any impact measure satisfying baseline-independence and scale-freeness must implicitly encode an ordering over outcomes. The goal is a negative result: proving "value-free impact" is mathematically incoherent under specific constraints.

  **Candidate 2: The Reversibility Metric.**
  Operationalize "Job B" directly. Define a new penalty based strictly on expected time-to-revert or "intervention half-life." Implement this in standard gridworld environments and compare its performance against existing attainable utility measures regarding side-effect avoidance.

  **Candidate 3: The Diagnostic Audit.**
  Instead of proposing a new penalty, build a diagnostic toolkit. Use the asymmetry argument to create test cases where value-neutral measures should fail. Apply these tests to existing families of measures to reveal where they secretly rely on value judgments (Job A) despite claiming neutrality (Job B).

  **Candidate 4: The Conceptual Taxonomy.**
  Focus on rigorously defining the Job A/Job B distinction. Produce a philosophical framework categorizing existing impact measures by which job they actually perform versus which they claim to perform. The deliverable is a classification schema rather than code or theorems.

  **Candidate 5: The Human-Capacity Bound.**
  Investigate the "human's ability to notice and reverse" empirically. Model human reaction times and cognitive limits within the loop. The measure becomes relative to human bandwidth rather than environmental state changes alone.

  **Selection Rationale:**
  I am dropping **Candidate 1** because a solo 9-month impossibility proof is high-risk; if you fail to prove it, you have no positive results. I am dropping **Candidate 4** because ML reviewers will view it as "just philosophy" with no technical contribution. I am dropping **Candidate 5** because modeling human cognitive limits introduces empirical variables that will bog you down in IRB approvals and noise.

  I recommend merging **Candidate 2 and 3**. This satisfies the ML side (you are building and testing a metric) and the Philosophy side (you are interrogating the normative assumptions of existing tools). It turns your conceptual worry into a technical audit.

  ***

  **Project Proposal: Auditing Value-Neutrality in Low-Impact AI**

  **Research Question**
  Under what formal conditions does a value-free impact measure collapse into a value-laden one? Specifically, can an impact penalty designed solely to preserve human control (Job B) remain symmetric regarding state deviations, or must it encode an asymmetric ordering over options to be useful? This project seeks a determinate answer by constructing a reversibility-based metric and using it to audit existing impact measure families for hidden value assumptions.

  **Background and Problem Statement**
  Current impact regularization techniques aim to prevent AI agents from causing unintended side effects. However, the literature conflates two distinct objectives. The first (Job A) uses impact penalties as a surrogate for value, penalizing changes we would disvalue if we had a full reward function. The second (Job B) is procedural: penalizing changes solely to preserve the human's ability to intervene, regardless of the outcome's value.

  Existing families of measures leave this distinction open. Attainable utility measures penalize changes in the agent's ability to achieve goals, but require selecting a set of auxiliary goals that implicitly encode values. Reachability-based measures penalize distance from a baseline state, but treat option-creating and option-destroying deviations symmetrically. This symmetry is problematic for Job B. If the goal is to preserve human control, shrinking the set of available futures is catastrophic, while expanding it is benign. A truly value-neutral measure treats both as equal deviations; a useful control-preserving measure treats them asymmetrically. Currently, we lack a method to determine when a proposed "neutral" measure is secretly performing Job A via hidden asymmetries.

  **Methodology**
  This project proceeds in three phases over nine months, combining formal specification with empirical implementation.

  *Months 1–3: Formal Specification.*
  I will formalize the "intervention half-life" concept. Instead of measuring state distance, I will define impact as the expected time required for a human operator to revert the system to a baseline state where intervention is possible. I will derive the conditions under which this metric becomes asymmetric—specifically, showing that preserving reversibility requires distinguishing between option-loss and option-gain. This phase produces a formal definition of "control-preserving impact" distinct from "value-preserving impact."

  *Months 4–6: Implementation and Baseline Testing.*
  I will implement this metric in standard safe-AI gridworld environments (e.g., side-effect suites involving irreversible actions like breaking objects). I will train agents using this reversibility penalty alongside standard baselines (attainable utility, relative reachability). The focus is not on achieving SotA performance, but on observing failure modes. I will specifically look for cases where symmetric measures penalize beneficial option-creation, and where asymmetric measures fail to penalize value-bad but reversible changes.

  *Months 7–9: The Audit and Deliverable.*
  Using the test cases generated in phase two, I will audit existing impact measure families. I will map which measures fail the asymmetry test, thereby revealing where they smuggle in value judgments. The codebase will be released as a diagnostic toolkit: a suite of environments designed to trigger these specific failures.

  **Why This Approach?**
  The obvious alternative is to invent another penalty and add it to the list of desiderata. This is unproductive because we already have too many measures and not enough clarity on what they actually do. By shifting from "building a better penalty" to "auditing existing penalties," this project provides conceptual clarity that informs engineering decisions. It avoids the trap of hand-waving about "value" by operationalizing value-neutrality as symmetry versus asymmetry in reversibility. This satisfies ML reviewers through concrete implementation and satisfies philosophers by rigorously testing normative claims.

  **Expected Results**
  A positive result takes one of two forms. Ideally, I will produce a working specification for the half-life metric plus a toy implementation demonstrating that asymmetric penalties preserve control without requiring a value function. Alternatively, I may derive a small impossibility result: showing that any penalty that is baseline-independent, scale-free, and non-trivial must encode an ordering over outcomes that functions as a value proxy. Either outcome resolves the confusion around Job A versus Job B.

  The practical deliverable is a decision rule for deployers. It will be a checklist that tells engineers when a low-impact penalty is doing Job A when they thought it was doing Job B. For non-academic stakeholders, this reduces the risk of deploying safety tools that claim neutrality but silently enforce specific value judgments.

  **Scope Note**
  Nine months is insufficient for a full theoretical proof or large-scale training runs. I will not attempt to solve the general side-effect problem. I will not model human cognition explicitly, relying instead on a theoretical "intervention agent" in simulation. The goal is not a deployable safety layer, but a diagnostic tool to evaluate safety layers. I promise a clean, documented codebase for the audit suite and a formal paper detailing the symmetry conditions, rather than a claim of having solved impact measurement.

  \answer{Auditing value-neutrality via asymmetric reversibility metrics}
