answer: |-
  **Total Mark: 12/20**

  **Breakdown:**
  *   **(a) 3/6:** Correct statement of the linear form. Significant error regarding affine transformations and weight invariance.
  *   **(b) 2/6:** Describes the impartial observer correctly, but fails the core requirement of the question (identifying the need for normalization/unit comparability).
  *   **(c) 7/8:** Excellent grasp of the Diamond critique and the role of the Independence axiom. Saves the script from a lower grade.

  ---

  ### Marginal Comments

  **Part (a)**

  > "Crucially this is independent of how we have scaled each person's utility function — the affine uniqueness of the $u_i$ is already built into the representation, so rescaling $u_i$ doesn't change what the weights say."

  **Comment:** **Substantive Error.** This is mathematically false. If $u_i$ is rescaled by $\alpha_i$, the weight $a_i$ must be rescaled by $1/\alpha_i$ to preserve the social ordering. The weights are *not* independent of the scaling; they are inversely proportional to it. This misunderstands the measurement problem.

  > "That is why the theorem is so striking: it hands you interpersonal comparisons for free rather than assuming them."

  **Comment:** **Misleading.** The theorem shows that *if* you have a Paretian social ordering satisfying vNM, it *takes the form* of a weighted sum. It does not determine the weights without an interpersonal comparison convention (normalization).

  **Part (b)**

  > "And since, as noted, the weights don't depend on the normalisation of the individual $u_i$, the argument needs no extra assumption about interpersonal comparability of units — the equal probabilities settle it."

  **Comment:** **Fatal Flaw.** Because the premise above is wrong, this conclusion fails. If Person 1's utility is measured in "cents" and Person 2's in "dollars," equal probabilities ($1/n$) do not yield equal moral weights. You *must* fix the units (interpersonal comparability of utility units) *before* the equal probability assumption works. This was the main point of the question.

  > "Harsanyi's framework isn't vulnerable to the repugnant conclusion in the way that total utilitarianism is."

  **Comment:** **Debatable.** Average utilitarianism has its own counter-intuitive implications regarding population size and quality, but this is a minor point compared to the normalization error.

  **Part (c)**

  > "The heavy lifting is done by requiring the social ordering itself to satisfy the vNM axioms, in particular independence, which forces society to evaluate a lottery as the expected value of a single weighted sum rather than in any other way."

  **Comment:** **Excellent.** This is the correct interpretation of the criticism.

  > "Diamond's example makes the point: with one indivisible good and two people, the fair lottery and giving the good to one person for sure have the same sum of expected utilities, so Harsanyi's social ordering is indifferent between them, while an ex post egalitarian strictly prefers the lottery."

  **Comment:** **Good application.** You correctly identify that linearity (from Independence) rules out aversion to the distribution of ex-post outcomes.

  ---

  ### The Counterexample (for your feedback session)

  If the student challenges the mark on (a) or (b), use this:

  **Scenario:** Two people, one outcome $x$.
  *   **Scale 1:** $u_1(x) = 1, u_2(x) = 1$. Weights $a_1 = 1, a_2 = 1$. Social Welfare $W = 2$.
  *   **Scale 2:** Rescale Person 1's utility to "mega-utils": $u^*_1(x) = 100$. Keep Person 2 same: $u_2(x) = 1$.
  *   **Student's Claim:** The weights $a_i$ don't change ($a_1=1, a_2=1$).
  *   **Result:** New Social Welfare $W^* = 1(100) + 1(1) = 101$.
  *   **Problem:** The social evaluation of the *same* outcome has changed drastically simply because we changed the ruler for Person 1. To keep the social ordering invariant, $a_1$ *must* change to $0.01$. Therefore, the weights are **not** independent of scaling.

  ---

  ### Overall Assessment: Understanding vs. Memorization

