  The split hinges on whether consciousness receives the raw sensory feed before the brain finishes processing the interpolation.

  In a UX lab, Lena watches a cursor snap from blue to green across a screen. She tells the researcher, "It faded mid-transition." Later, system logs prove the color switched instantly at the endpoint. When Lena writes her debrief, a script auto-corrects her notes to match the logs, saying "instant switch." She reads her corrected report and adopts it as truth.

  Stalinesque verdict: Lena's brain waited for the green signal, blended the motion, and showed her a fade. The experience was real but pre-edited before consciousness. Orwellian verdict: Lena saw an instant switch originally, but her memory updated to "fade" to make sense of the motion, then her report was edited again. There was no fade experiance at t1.

  The feature doing the work is the timing of conscious access relative to data integration. If consciousness gets the edited stream, it's Stalinesque; if it gets raw data and memory lies later, it's Orwellian. Remove this timing distinction—say, if we can't distinguish memory from perception—and the views collapse; both just say "report is wrong." The Orwellian side attacks by claiming you can't prove the "raw feed" ever existed unedited, arguing that positing an unobserved original experience is metaphysical baggage. Basically, without a way to peek at the raw buffer before the commit, you can't prove the edit happened post-deployment.
