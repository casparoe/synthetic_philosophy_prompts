      *   **Specific Comparisons Requested:**
          *   Predictive Processing (PP) account (hierarchical generative model, prediction error, precision, active inference).
          *   FEP as a normative principle (variational free energy, surprise bound, accuracy/complexity, expected free energy/epistemic/pragmatic).
      *   **Critical Concerns:** Where does FEP add value? Where does it become unfalsifiable hand-waving? Can it be implemented as a design constraint, or is it just "doing good inference with fancier notation"?

  2.  **Initial Assessment & Stance:**
