      *   **Part 3: Where FEP Adds Content (The "Value Add"):**
          *   *Unification of Action and Perception:* In standard Bayesian brain, action is often an add-on. In FEP (Active Inference), action is *part* of inference. You change the world to match your prediction.
          *   *Expected Free Energy (EFE):* This is crucial. It splits into *Epistemic* (information gain) and *Pragmatic* (goal achievement). This solves the exploration/exploitation dilemma naturally without an external reward function.
