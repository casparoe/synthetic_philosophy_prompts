answer: |-
  # Seminar Plan: *Anatta* and the Two Truths
  **Target:** Analytic Philosophy Graduate Students (90 Minutes)
  **Prerequisites:** Locke (Memory), Parfit (Reductionism), Personal Identity Metaphysics.
  **Goal:** Present *anatta* as a soteriological ontology distinct from Humean bundle theory or Parfitian reductionism.

  ## I. Teaching Sequence (90 Minutes)

  ### 1. The Soteriological Frame (00:00 – 00:15)
  *   **Objective:** Shift the metric of success from *ontological accuracy* to *suffering reduction*.
  *   **Action:** Begin by stating that Western personal identity debates usually ask, "What makes Person A at $t_1$ the same as Person B at $t_2$?" (Metaphysics of Persistence). State that the Buddhist inquiry asks, "What cognitive act regarding 'I' produces *dukkha* (unsatisfactoriness)?" (Phenomenology of Grasping).
  *   **Crucial Move:** Establish that *anatta* is not initially a claim about what exists, but a diagnosis of why reification causes pain. This prevents the immediate collapse into "Eliminativism."

  ### 2. The Organizing Lens: Two Truths (00:15 – 00:30)
  *   **Objective:** Install the Two Truths framework *before* introducing *anatta* to prevent category errors.
  *   **Content:**
      *   **Conventional Truth (*Saṃvṛti-satya*):** The level of language, function, causality, and social accountability. Persons exist here as designations dependent on parts and context.
      *   **Ultimate Truth (*Paramārtha-satya*):** The level of critical analysis searching for intrinsic essence. Here, no findable referent for "I" exists.
  *   **Instruction:** Explicitly tell students: "Do not evaluate Buddhist claims about 'non-existence' using only the criteria of Ultimate Truth, and do not evaluate claims about 'karma/responsibility' using only Ultimate Truth. The doctrine fails if you flatten these into one plane."
  *   **Defusal Point 1 (Nihilism):** Defuse the "Persons don't exist at all" misconception here. Assert that denying intrinsic existence is not denying conventional functionality.

  ### 3. The Carrying Example: "The Public Humiliation" (00:30 – 00:60)
  *   **Objective:** Apply *anatta* via the Two Truths to a concrete case that illuminates soteriological stakes.
  *   **The Scenario:** A graduate student presents a paper. A senior professor publicly mocks it as "juvenile." The student feels shame, anger, and a sense of diminished worth.
  *   **Phase A: Lockean/Parfitian Analysis (Western):**
      *   Ask: "Is the person feeling shame the same as the person who wrote the paper?" (Psychological continuity exists).
      *   Ask: "Does the shame matter?" (Parfit might say the relation matters; Locke says identity matters).
  *   **Phase B: Buddhist Two-Truths Analysis:**
      *   **Conventional:** The event happened. The social designation "student" was insulted. There are causal consequences (reputation, funding). Accountability exists.
      *   **Ultimate:** Search for the "I" that was insulted. Is it the body? The feeling of shame? The memory of the paper? None of these aggregates *are* "the student."
      *   **Soteriological Pivot:** The *suffering* is not in the sound waves of the insult. The suffering is in the *grasping* at a solid, inherently existent "I" that has been damaged.
      *   **Differentiation from Parfit:** Parfit reduces identity to show survival matters more than identity. Buddhism analyzes identity to show *clinging* to identity is the source of the pain. Parfit is metaphysical optimization; *anatta* is therapeutic deconstruction.
  *   **Defusal Point 2 (Parfitian Equivalence):** Defuse the "This is just Bundle Theory" misconception here. Emphasize that Hume/Parfit describe *how* we are constituted; Buddhism prescribes *how to relate* to that constitution to end suffering. The "bundle" is not a new self.

  ### 4. Moral Responsibility and Agency (00:60 – 00:75)
  *   **Objective:** Address the ethical implications of no-self.
  *   **Action:** Return to the "Public Humiliation" example. If there is no self, who was insulted? Who improves the paper next time?
  *   **Resolution:** Responsibility operates on the Conventional level. The causal stream continues. The lack of an ultimate agent does not stop the causal efficacy of praise or blame.
  *   **Defusal Point 3 (Moral Nihilism):** Defuse the "No self means no responsibility" misconception here. Clarify that *anatta* removes the *agent-owner* but preserves the *action-consequence* link.
  *   **Instruction:** Use the analogy of a fire: A fire has no "self," but it still burns. You don't need a soul for causality to function.

  ### 5. Scholarship Context & Diagnostic (00:75 – 00:90)
  *   **Objective:** Situate the view in contemporary debate and test comprehension.
  *   **Action:** Present the contested landscape (see Section IV below).
  *   **Assessment:** Administer the Diagnostic Exercise (see Section III below).

  ---

  ## II. The Carrying Example: "The Public Humiliation"
  **Why this example?**
  1.  **Avoids the Chariot:** It is phenomenological, not mereological. It avoids the "parts vs. whole" trap of the Milindapanha which analytic students often dismiss as a category mistake.
  2.  **Soteriological Stakes:** It directly targets *mana* (conceit) and *dosa* (aversion), the emotional fuels that *anatta* is meant to extinguish. It shows *why* one would want to realize no-self (to stop the sting of the insult) rather than just *that* one is no-self.
  3.  **Analytic Hook:** It engages with social identity and psychological continuity (Locke/Parfit territory) but pivots to the *affective cost* of maintaining that identity.

  **Implementation Note:** Do not allow students to resolve the example purely metaphysically. Constantly return the question to: "Where is the suffering located? In the event, or in the identification with the event?"

  ---

  ## III. Misconception Defusal Map

  | Misconception | Likely Student Formulation | Where to Defuse | Defusal Strategy |
  | :--- | :--- | :--- | :--- |
  | **1. Nihilism** | "If there is no self, then I don't exist. This is absurd." | **Minute 15 (Two Truths)** | Distinguish *intrinsic existence* (Ultimate) from *dependent designation* (Conventional). Denying the former does not negate the latter. |
  | **2. Parfitian Reductionism** | "This is just Psychological Continuity Theory. The 'stream' is the self." | **Minute 45 (Example Analysis)** | Parfit accepts the reduction as a metaphysical fact for survival. *Anatta* treats the reduction as a tool to loosen *clinging*. The goal is not better metaphysics, but less suffering. |
  | **3. Moral Irresponsibility** | "If I didn't do it (no self), I can't be blamed." | **Minute 65 (Agency)** | Reiterate that causality functions conventionally. The absence of a *controller* does not mean the absence of *causes*. |

  ---

  ## IV. Exclusions (What to Leave Out)
  To maintain focus on *anatta* as a live conceptual alternative within 90 minutes, explicitly exclude:
  1.  **Detailed Abhidharma Taxonomy:** Do not teach the 5 *skandhas* (form, feeling, perception, formations, consciousness) as a rigid list. Refer to them only as "physical and mental processes."
  2.  **Madhyamaka Dialectics:** Do not introduce *svatantrika* vs. *prasangika* reasoning or the *catuṣkoṭi* (tetralemma). This confuses the Two Truths framework for this audience.
  3.  **Historical Evolution:** Do not distinguish between Early Buddhist Texts (EBT) and Mahayana developments. Treat "Buddhist Philosophy" as a coherent conceptual system for the sake of this seminar, noting contestation only in the final section.
  4.  **Rebirth/Karma Mechanics:** Do not attempt to explain how karma transfers without a self. This is a distraction from the immediate phenomenological stakes of personal identity.

  ---

  ## V. Scholarship Landscape: Settled vs. Contested
  *Present this in the final 15 minutes. Do not resolve the tension; expose it.*

  **Broadly Settled:**
  *   *Anatta* is not eternalism (a permanent soul) nor simple nihilism (nothing exists).
  *   The Two Truths framework is necessary to make sense of Buddhist ontological claims.
  *   The doctrine is soteriologically motivated (aimed at ending suffering).

  **Genuinely Contested:**
  *   **Metaphysical vs. Pragmatic:**
      *   *View A (Abhidharma/Realist):* *Anatta* is a metaphysical claim. The aggregates are ultimately real, but the person is not. (Similar to Reductionism).
      *   *View B (Madhyamaka/Pragmatist):* *Anatta* is a strategic denial. Even the aggregates lack intrinsic nature. The point is not to describe reality, but to stop reification.
  *   **Instruction:** Tell students: "Contemporary scholarship is divided on whether *anatta* is a description of what persons *are* (metaphysics) or a prescription for how to *view* persons (pragmatics). You will encounter both readings in the literature. For this seminar, we treat it as both: a metaphysical claim that serves a pragmatic end."

  ---

  ## VI. Final Diagnostic Exercise
  **Goal:** Test if students are operating on a single plane (Nihilism/Realism) or holding the Two Truths simultaneously.

  **The Prompt (5 Minutes Written Response):**
  > "Consider the 'Public Humiliation' scenario. If a student fully realizes *anatta* (no-self) regarding the insult:
  > 1. Do they still submit a revised paper? Why?
  > 2. Do they still feel the sting of the insult? Why/Why not?
  > 3. Explain your answer using *both* Conventional and Ultimate designations without contradicting yourself."

  **Evaluation Criteria:**
  *   **Fail (Nihilism):** "They don't care because nothing matters." (Collapses Conventional).
  *   **Fail (Realism):** "They still feel pain because the self is real." (Denies Ultimate).
  *   **Fail (Parfitian):** "They care because psychological continuity persists." (Misses Soteriological shift).
  *   **Pass:** "Conventionally, the causal stream continues, so the paper is revised to avoid future negative consequences. Ultimately, there is no 'I' to be humiliated, so the *suffering* (the mental elaboration on the sting) ceases, even if the physical sensation of arousal remains."
