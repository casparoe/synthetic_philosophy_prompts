answer: |-
  There is no canonical term for this failure mode across the historical sciences. Within Jesus studies, it is typically discussed descriptively as the "inherent limitation" or "distortion" of the Criterion of Dissimilarity (e.g., by Meier, Keith, or Le Donne), but these labels refer to the specific tool rather than the logical structure you have isolated. In statistics, the closest analogue is **truncation bias**, where data outside a range is excluded, but this lacks the methodological nuance of active filtering for *distinctiveness*.

  For a footnote, I propose **Residualist Bias**.

  **Definition:** Residualist Bias occurs when a historical reconstruction is built from a dataset generated by negative selection rules that exclude material exhibiting continuity with its context. The bias lies in assuming the residue of such a filter is representative of the whole, when the selection rule systematically privileges eccentricity over typicality.

  **Nearest Named Thing:** The genus is **Selection Bias**. Standard selection bias (including survivorship bias) usually implies an accidental or external filter (e.g., documents rotting, artifacts breaking). Residualist Bias is a species of **Methodological Selection Bias**, where the unrepresentativeness is introduced by the historian's own criteria rather than by transmission history. It differs from standard selection bias because the skew is not random nor merely reductive; it is *inverse*. The better the filter works at removing tradition-shaped material, the less representative the remaining sample becomes of the historical reality that produced the tradition.

  It also resembles **Berkson's Paradox** (conditioning on a common effect), but where Berkson's predicts spurious correlations between independent traits in the surviving sample, Residualist Bias predicts a systematic shift in the *mean* of the sample's traits away from the population norm.

  **Generalization:** The phenomenon does not strictly require the selection rule to be content-directed (e.g., "reject Jewish features"), though content-direction maximizes the skew. Structurally, it generalizes to any filter where the probability of inclusion is inversely proportional to the item's typicality within the parent population. If an archaeologist selected only potsherds that matched no known typology to reconstruct a culture's ceramic industry, they would commit Residualist Bias. The essential condition is not the content of the rule, but the **inverse relationship between selection probability and contextual continuity**.

  **Look-Alikes:** A genuine **Outlier Analysis** is not Residualist Bias. If the research question is specifically "What distinguishes this figure from their contemporaries?", then selecting for dissimilarity is valid. The bias arises only when the output of the negative filter is used to reconstruct the *whole* person or movement. Similarly, **Negative Evidence** (arguing from silence) is distinct; Residualist Bias concerns positive evidence that has been systematically scrubbed of its contextual markers.

  **Footnote Usage:** You might define it thus: "Residualist Bias: the methodological distortion arising when a historical portrait is constructed from materials selected solely for their lack of continuity with the surrounding tradition, resulting in a dataset skewed toward the atypical."

  This captures the structural error without relying on the contested validity of the specific criteria themselves. It identifies the logical gap between "authentic by dissimilarity" and "representative of the historical agent."
