      *   **UN Convention (1948):** Narrowed significantly due to political pressure (US, UK, USSR didn't want to be liable for colonial actions or internal purges). Focused mostly on physical/biological destruction.
      *   **Politics of Naming:** "Genocide" triggers the Responsibility to Protect (R2P) or legal obligation. "Ethnic cleansing" sounds like tidying up. Euphemisms allow inaction.
      *   **The Novel's Mechanism:** Fable-like, naive narrator (Bruno), heavy use of ignorance/omission.

  3.  **Drafting - Section by Section:**

