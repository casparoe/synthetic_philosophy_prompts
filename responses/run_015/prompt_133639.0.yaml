answer: |-
  Here is an analysis of your committee's ethical track record, applied to Tuesday's dilemma.

  ### The Implicit Rules (Precedents 1–5)

  Your committee does not operate on a single consistent moral theory. Instead, you operate on a **Hierarchy of Stakeholder Agency**. There are three distinct rules at play, applied depending on who is alive to speak about the harm.

  1.  **The Veto of the Harmed (Cases 1 & 4):** When living stakeholders (victims, descendants, survivors) explicitly object to objects created through exploitation or suffering, the museum rejects the object. The moral taint of the origin outweighs artistic value.
  2.  **The Statute of Limitations (Cases 2 & 3):** When all parties (perpetrators, victims, subjects) are deceased, moral taint is considered historical context rather than an active barrier. The art is separable from the sin.
  3.  **The Partnership Exception (Case 5):** When living stakeholders exist but seek collaboration rather than prohibition, the museum may retain and display the object *provided* the stakeholders co-author the narrative. This rule is fragile; two members dissented, indicating a faction on your committee believes some objects are too tainted for *any* display, regardless of consent.

  **The Synthesis:** Your committee's actual rule is procedural, not substantive. You do not decide if an object is "too bad" in a vacuum. You decide based on **who holds the right to object.** If the living hold that right and object, you store (Cases 1, 4). If they hold it and negotiate, you show with conditions (Case 5). If no one holds it (the dead), you show normally (Cases 2, 3).

  ### Tuesday's Case: The Missing Variable

  The life-casts sit in a procedural vacuum.
  *   **Substantively**, they align most closely with **Case 1 (Tapestries)** and **Case 4 (Photographer)**. Like the tapestries, they are products of imminent death and coercion. Like the photographs, they exploit the dignity of the subjects for aesthetic/anatomical value.
  *   **Procedurally**, they align with **Case 5 (Travel Writer)**. A source community (the Heritage Council) is alive and engaged. However, unlike Case 5, the specific descendants (the primary stakeholders in bodily remains) have not been contacted.

  **The Closest Analog:** **Case 5** is the controlling precedent for *process*, but **Case 1** is the warning for *outcome*. Case 5 established that when a living community asks for consultation, you do not decide unilaterally. However, because the harm here involves bodily autonomy and execution (closer to Case 1's "honouring the men who killed their fathers") rather than looted shrine objects (Case 5), the risk of a "Veto" outcome is higher.

  ### The Commitments of the Four Options

  If your minutes do not pin down an answer, it is because choosing an option now forces you to adopt a new principle that contradicts your history.

  *   **\answer{show}:** Commits you to the principle that **Artistic/Historical Value Supersedes Stakeholder Consent.** This contradicts Cases 1, 4, and 5. It signals that if an object is popular or valuable enough, you will bypass the consultation process you established in Case 5.
  *   **\answer{show with conditions}:** Commits you to the principle that **The Museum Knows Best.** In Case 5, conditions were agreed *with* the community. Imposing conditions now without family input is paternalistic. It creates a precedent that you can negotiate on behalf of descendants without their voice.
  *   **\answer{store}:** Commits you to the principle of **Intrinsic Taint.** This aligns with the dissenters in Case 5 and the majority in Case 1. It asserts that some objects are inherently unethical to display, regardless of whether descendants object or consent. This is a defensible moral stance, but it is stricter than your actual track record (which allowed Case 5).
  *   **\answer{defer}:** Commits you to the principle of **Procedural Integrity.** This aligns with all five precedents. It acknowledges that you cannot apply Rule 1, 2, or 3 until you know which stakeholders exist and what they want. It treats the lack of information as the barrier, not the object itself.

  ### The Load-Bearing Question

  You asked for the single fact or hypothetical that separates the rules. It is not "ask the families first" as a matter of politeness; it is the mechanism that determines which ethical framework applies.

  **The Hypothetical:**
  *"If the three identified families explicitly request the casts be displayed as a memorial to the men, do we show them?"*

  *   **If the Committee votes YES:** Your governing rule is **Relational Harm**. The object is only unethical if the stakeholders say it is. Consent cures the taint. (This aligns with Case 5).
  *   **If the Committee votes NO:** Your governing rule is **Intrinsic Harm**. The object is unethical by its very nature (coerced death casts), and no amount of family consent can make it appropriate for display. (This aligns with the Case 5 dissenters and Case 1).

  **Why this is the load-bearing question:**
  Until you know the families' stance, you cannot know if you are in a Case 1 scenario (Objection/Intrinsic Harm) or a Case 5 scenario (Negotiation/Relational Harm). To decide now is to guess. The Director's financial pressure is irrelevant based on your precedents; none of the five prior decisions mention budget as a mitigating factor for ethical harm.

  ### Recommendation

  You are not pinned down because you are missing the data point that triggers your existing rules. You cannot apply the "Veto" rule (Cases 1 & 4) or the "Partnership" rule (Case 5) without the partners. To show or store now is to make a new ethical policy on the fly. To defer is to respect the procedure your committee has actually used for the last two years.

  \answer{defer}
