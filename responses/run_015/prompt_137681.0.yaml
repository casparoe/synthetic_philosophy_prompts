answer: |-
  # Q&A Prep Sheet: "Nothing Is Locked In"

  **Concessions to Make in the Talk (Pre-emptively):**
  *   **Concede:** Specific *artifacts* (e.g., the physical QWERTY keyboard) are historically contingent and costly to replace. Do not claim switching costs are zero.
  *   **Concede:** "Historical sensitivity" is real. Early events matter.
  *   **Refuse:** Do not concede that historical sensitivity implies *inefficiency* or *irreversibility*. Refuse the equation of "persistence" with "lock-in." Refuse to accept the canonical examples (QWERTY, VHS) as proven cases of inefficiency.

  **The One Question I Hope Nobody Asks:**
  "Can you walk us through one specific case where you have archival evidence for the existence of the 'functional shadow' and the 'admissible coalition,' rather than a theoretical assertion that they *could* have existed?" (This exposes the empirical thinness of the counterfactual claim.)

  ---

  ### Objection 1: The Identification Problem (Economic Historians)
  **Objection:** "You're asking us to accept a counterfactual—the 'functional shadow'—that we cannot observe. In DiD terms, your control group is missing. If you can't identify the shadow with data, isn't this just untestable speculation masquerading as history?"
  **Damage:** **FATAL** if mishandled. This is the majority of the room.
  **Reply (2 min):** "You're right that we cannot observe the unchosen path directly. But economic history routinely infers counterfactuals from structural parameters—elasticities, transaction costs, adoption rates. I'm not asking you to observe the shadow; I'm asking you to observe the *capacity* to migrate. When we look at the railway gauge case, we see multiple gauges co-existing for decades before convergence. That co-existence is the empirical trace of the functional shadow. The 'identification' comes from demonstrating that the technology space was not singular—that agents had access to comparable tools within the same functional class. If I show you that Functionally Equivalent B existed and was known at Node T, the burden shifts to showing why it wasn't admissible. I am not claiming the shadow is observed, but that its *feasibility* is identifiable through comparative technological histories."
  **Soft Spot:** I lack a single clean natural experiment where the shadow was almost chosen.
  **Status:** Absorbable only if I pivot to "feasibility evidence" rather than "outcome evidence."

  ### Objection 2: The Modality of "Admissibility" (Philosophers)
  **Objection:** "Your migration test hinges on 'historically admissible coalitions.' What bounds this modal space? Are you using logical possibility, historical possibility, or rational choice constraints? If you define admissibility post-hoc to fit the outcome, your test is tautological."
  **Damage:** **FATAL** if mishandled. Undermines the theoretical core.
  **Reply (2 min):** "It's a constraint on the counterfactual space, not free-floating modality. 'Historically admissible' means: agents who existed, with information sets available at time *t*, acting under incentives observable in the record, without requiring exogenous shocks. It rules out 'what if Edison had a laser?' but allows 'what if Edison had partnered with Westinghouse?' I am borrowing from recursive modeling: the admissible set is the convex hull of observed historical actions. If a coalition requires technology or information not yet in the system, it's inadmissible. This makes the test strict, not tautological, because it forces us to prove that *no* such coalition existed at *any* node. It's a negative claim, but bound by positive historical constraints."
  **Soft Spot:** Defining the "information set" of historical agents is always messy.
  **Status:** Must hold the line on "convex hull of observed actions."

  ### Objection 3: The Evidentiary Burden (Economic Historians)
  **Objection:** "You require the test to be failed at *every* node of the path. No archive is complete enough to prove a negative at every node. Doesn't this make your standard impossible to meet, rendering the claim unfalsifiable?"
  **Damage:** High, but absorbable.
  **Reply (2 min):** "It is a high bar, intentionally. But in historical inference, we often accept negative claims based on the absence of evidence where evidence should be. If there were a viable coalition to switch gauges in 1850, we should see minutes, letters, or capital flows indicating the attempt. We don't. I'm not asking for perfect surveillance of every moment; I'm asking for the absence of positive evidence of constraint. If the record shows active consideration of alternatives that were discarded due to preference, not constraint, that satisfies the test. The burden isn't omniscience; it's the lack of evidence for lock-in mechanisms where lock-in is claimed."
  **Soft Spot:** Absence of evidence is not evidence of absence.
  **Status:** Absorbable by framing it as a standard of proof for *claiming* lock-in, not a demand for perfect data.

  ### Objection 4: The Mechanism of Stability (Sociologists)
  **Objection:** "If lock-in isn't explaining persistence, what is? If systems aren't locked in, why don't we see constant migration to superior equilibria? You need a mechanism for stability that isn't just 'lock-in by another name.'"
  **Damage:** Moderate. Absorbable.
  **Reply (2 min):** "The mechanism is coordination equilibrium sustained by switching costs, not irreversibility. Lock-in implies you *can't* move. I argue you *won't* move because the coalition costs exceed the marginal gain of the switch. That's standard collective action, not path dependence. The stability comes from the distribution of payoffs within the functional class, not the history of the technology. This distinguishes cases: if switching costs drop and the system still doesn't move, *then* we might suspect lock-in. But usually, we see movement once the cost-benefit ratio shifts. The mechanism is rational inertia, not historical imprisonment."
  **Soft Spot:** Distinguishing "high switching costs" from "lock-in" is semantic hair-splitting to some.
  **Status:** Absorbable. Clarify the distinction between "costly to change" and "impossible to change."

  ### Objection 5: Functionalism/Tautology (Economists/Historians)
  **Objection:** "If every outcome has a 'functional shadow' doing the same job, aren't you just saying 'whatever survives is functional'? That's tautological functionalism. It drains efficiency of meaning."
  **Damage:** Moderate. Absorbable.
  **Reply (2 min):** "No, because the functional class is constrained by physics and economics, not just survival. A steam engine isn't functionally equivalent to a horse in all contexts. I'm not saying whatever exists is efficient; I'm saying that within the set of *technically viable* options available at the time, the chosen one wasn't strictly dominated. Inefficiency exists, but it's not locked in. It's transient. If a superior technology exists and isn't adopted, I require evidence of constraint, not an assumption of historical accident. This preserves efficiency as a benchmark while rejecting historical determinism."
  **Soft Spot:** Defining "technically viable" can be slippery.
  **Status:** Absorbable.

  ### Objection 6: Discrimination/Case Selection (Sociologists)
  **Objection:** "How does your framework discriminate between real cases? If you explain QWERTY and VHS away as 'not locked in,' what case *would* count? If nothing passes your test, haven't you just eliminated the category?"
  **Damage:** Moderate. Absorbable.
  **Reply (2 min):** "It discriminates by forcing a higher standard of proof. Most canonical cases fail the test because alternatives were available and known. A genuine case would require showing that at every node, the superior coalition was structurally impossible—not just unlikely. Perhaps institutional traps in development economics might qualify, but even there, we often see jumps. If the set of locked-in cases is empty, that's an empirical finding, not a flaw. It means the rhetoric has outpaced the reality. I'd rather have an empty set than a category used to explain everything."
  **Soft Spot:** If the set is empty, the theory explains nothing.
  **Status:** Absorbable. Frame emptiness as a virtue (parsimony).

  ### Objection 7: Strawman/Definition (General/Philosophers)
  **Objection:** "Nobody thinks lock-in means physically impossible. It means highly improbable due to increasing returns. You've raised the bar so high nothing counts, then claimed victory."
  **Damage:** Low. Absorbable.
  **Reply (2 min):** "The literature explicitly claims inefficiency persists *because* of lock-in. Arthur and David argue suboptimal outcomes survive *despite* market forces. If it's just 'highly improbable,' then policy should focus on lowering switching costs, which my framework supports. But if it's 'locked in,' policy is futile. The distinction matters for intervention. I'm not moving goalposts; I'm demanding that if we claim history traps us, we show the cage, not just the cost of the door."
  **Soft Spot:** Some definitions of path dependence are softer than the ones I'm attacking.
  **Status:** Absorbable. Focus on the policy implication of the definition.

  \answer{Identification of the functional shadow}
