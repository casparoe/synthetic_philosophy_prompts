  ### The Case: The Stormy Passage

  **Setting:** A Coast Guard rescue station during a hurricane. Two vessels are sinking in different sectors. Rescue is impossible for both; fuel and time allow for only one attempt.

  **The People:**
  *   **Vessel A:** 1 person.
  *   **Vessel B:** 5 people.
  *   **Conditions:** All are strangers, equal age/health, no special roles, equal distress. If not rescued, all drown.

  **The Actions:**
  *   **Action 1 (Route A):** Attempt to reach Vessel A. The seas are calmer there.
      *   **Probability of Success:** 50%. (If successful, the 1 person lives; the 5 on Vessel B die).
      *   **Probability of Failure:** 50%. (Everyone dies).
      *   **Expected Lives Saved:** $1 \times 0.5 = 0.5$.
  *   **Action 2 (Route B):** Attempt to reach Vessel B. The seas are much rougher there.
      *   **Probability of Success:** 10%. (If successful, the 5 people live; the 1 on Vessel A dies).
      *   **Probability of Failure:** 90%. (Everyone dies).
      *   **Expected Lives Saved:** $5 \times 0.1 = 0.5$.

  ---

  ### The Analysis

  **1. Plain Save-the-Greater-Number (Expected Utility)**
  *   **Verdict:** **Indifferent.**
  *   **Reasoning:** This view aggregates value. Since the expected number of survivors is identical (0.5 lives) under both actions, there is no rational basis to prefer one route over the other. The higher probability of saving the one cancels out the lower probability of saving the five.

  **2. The Taurek-ish Package (Numbers Don't Count)**
  *   **Verdict:** **Permitted to take Route A (Save the One).**
  *   **Reasoning:** Taurek argues that "loss" is not aggregative. The single person on Vessel A faces a 100% loss of their future if ignored. The five people on Vessel B each face a 100% loss of *their* futures if ignored. No single person on Vessel B is worse off than the person on Vessel A. Therefore, the fact that there are five of them does not create a moral obligation to prioritize them. You are permitted to choose Route A based on personal preference, proximity, or even a coin flip. You are not *required* to maximize expected survivors.

  **3. The Equal-Chance-to-Each Procedure (Your Friend's View)**
  *   **Verdict:** **Obligated to take Route B (Save the Five).**
  *   **Reasoning:** This view holds that fairness requires respecting every individual's claim to be saved. Since you cannot save everyone, you must distribute the *chance* of survival as fairly as possible.
      *   Route A gives a chance to 1 person and excludes 5.
      *   Route B gives a chance to 5 people and excludes 1.
      *   While neither action gives everyone an *equal* chance (like a weighted lottery would), Route B honors more individual claims. Excluding five people from *any* hope is a greater violation of fairness than excluding one. Therefore, fairness dictates you must take the route that includes the greater number of people in the lottery of survival, even if the odds are lower.

  ---

  ### The Active Feature

  The feature doing the work is the **distribution of exclusion**, not the sum of probabilities.

  In standard certain cases (100% save 1 vs. 100% save 5), Expected Utility speaks loudly (5 > 1). By introducing risk to equalize the *expected value*, we silence Expected Utility. This isolates the conflict between Taurek (who focuses on the *severity* of loss to the individual, which is identical here) and the Equal-Chance view (who focuses on the *number of individuals* granted a non-zero probability).

  **If you de-risk the case:**
  Make Route A 100% successful and Route B 100% successful.
  *   **Expected Lives:** No longer indifferent. It commands Route B (5 > 1).
  *   **Taurek:** Still permits Route A.
  *   **Equal Chance:** No longer evaluates the actions directly; it demands a **third action** (flip a weighted coin: 5/6 chance for Route B, 1/6 for Route A).
  *   **Result:** The specific divergence in the risky case vanishes. Expected Utility stops being silent, and Equal Chance shifts from evaluating the actions to demanding a randomization procedure. The risky case is unique because it forces the Equal-Chance view to choose between two imperfect distributions of hope.

  ---

  ### The Scaling Test (The Crux)

  Now, scale Vessel B from **5 people to 500 people**. To keep Expected Lives equal, we adjust the probability of success for Route B.

  *   **Action 1 (Route A):** 50% chance to save 1 person. (Expected: 0.5).
  *   **Action 2 (Route B):** 0.1% chance to save 500 people. (Expected: 0.5).
      *   *Note:* Route B now means a 99.9% chance that **everyone dies**.

  **Which Verdicts Move?**

  1.  **Expected Lives:** **Does Not Move.** Still indifferent (0.5 vs 0.5).
  2.  **Taurek:** **Does Not Move.** Still permits saving the one. (The single person's loss is still not outweighed by the 500 others' losses).
  3.  **Equal-Chance-to-Each:** **Does Not Move (in direction), but strains.**
      *   The verdict remains: **Obligated to take Route B.**
      *   *Why?* The logic is consistent: Excluding 500 claims is worse than excluding 1 claim. Fairness requires giving the 500 people *some* chance, however slim, rather than guaranteeing their exclusion.
      *   *However:* This reveals your point. The view is **insensitive to the aggregate risk of total loss**. It prioritizes the *count of claims* over the *likelihood of anyone surviving*.

  **Conclusion on the Argument:**
  This confirms your suspicion. Your friend claims the Equal-Chance view is "insensitive to numbers" because it counts *claims* rather than *outcomes*. But the Scaling Test shows that the view **tracks numbers exactly**. It favors the larger group in the 1v5 case, and it favors the larger group even more strongly in the 1v500 case, even when doing so makes total survival practically impossible (0.1% vs 50%). The view *is* counting numbers; it just disguises the count as a tally of "excluded claims."

  ---

  ### The Wriggle-Out

  **What the Friend (Equal-Chance Side) would say:**
  "I am not aggregating the *badness of death*; I am aggregating the *violation of rights*. It is not that 500 deaths are worse than 1 death. It is that ignoring 500 requests for help is a greater administrative injustice than ignoring 1 request. My view remains insensitive to the *value* of the numbers, even if it is sensitive to the *count* of the claims. The distinction matters because I still deny that the group forms a single unit of value."

  ### What Should Actually Be Done

  In the 1v5 case, **take Route B**. The intuition that fairness requires giving the five a chance aligns with the modest aggregation of expected value. However, in the scaled 1v500 case, **take Route A**. When the larger group's survival probability drops to near-zero (0.1%), the "hope" offered is illusory. A 50% chance for someone to survive is morally superior to a 0.1% chance for many, because the latter is functionally a decision to let everyone die. The Equal-Chance view breaks here because it values the *symbolism* of inclusion over the *reality* of survival.
