answer: |-
  First, your physics summary is solid. You have the chronology and the philosophical upshot exactly right. Wu (1956) established Parity (P) violation in the weak interaction, meaning the laws of physics distinguish left from right in a way classical mechanics doesn't. The "antimatter escape route" (that the mirror image is just a CP-transformed world) was indeed closed by Cronin and Fitch (1964) showing CP violation. This means there is a physically unique, non-conventional distinction between the actual world and its mirror image. Professor Halloway's insistence that this is "just notation" is a bold metaphysical move—she is claiming that even if the laws were perfectly symmetric, the *property* of handedness would remain. That is the wedge you need to drive.

  Here are twelve questions designed to corner that view, accessible to your listeners but sharp enough for a specialist. The first four form the "physics escape route" block you requested.

  ### The Physics/Metaphysics Interface (The Escape Route)

  **1.** You distinguish between the *notation* of our physical theories and the *reality* of handedness. Let's grant that coordinate systems are conventional. But the weak force isn't just a notation; it's a physical asymmetry. If the fundamental laws of nature were perfectly parity-symmetric, would your "intrinsic handedness" still exist, or does it require a law that breaks the symmetry to be real?
  *[Note: If she says it exists regardless, she admits the property is causally inert. If she says it requires asymmetric laws, then handedness depends on relations between objects and laws, undermining the "intrinsic" claim.]*

  **2.** Let's follow that up. Imagine a Newtonian world where the laws are parity-symmetric. In that world, is there a fact of the matter about whether a solitary hand is left or right? Or does the distinction only emerge when you have at least two incongruent counterparts to compare?
  *[Note: If she says "yes, there's a fact," she posits undetectable metaphysical structure. If "no," she concedes that handedness is essentially relational or comparative, which is the relationist view she opposes.]*

  **3.** Pushing further on that solitary hand: If you say there *is* a fact of the matter in that symmetric world, what grounds it? Is it a brute fact? Because if it's brute, it seems you're committed to the idea that God could have created a left hand instead of a right hand with no other difference in the universe. Does that not make the property magical?
  *[Note: This forces her to defend "haecceity" or primitive this-ness for orientations. It makes her view sound ontologically extravagant compared to relationism.]*

  **4.** Finally on the physics: You say the Wu experiment is about notation. But if we can use beta decay to send a signal to an alien defining "left" without pointing to a shared object, haven't we operationally defined the property? If the physics does the work of fixing the reference, what work is left for your metaphysical "intrinsic property" to do?
  *[Note: This targets explanatory idleness. If physics fixes the reference, the metaphysical property is a "wheel that turns nothing," inviting an Occam's razor objection.]*

  ### Congruence and Unity

  **5.** Moving away from physics to geometry: You say left-handedness is a monadic property. But what holds the class of "left things" together? Why do all left gloves fit all left hands? Is that "fitting" a further fact, or does it follow from the intrinsic property?
  *[Note: If it's a further fact, she needs to explain the correlation. If it follows, she needs to explain how an intrinsic property dictates a relational fit without invoking relations.]*

  **6.** Follow-up on congruence: If I have a left hand and a left glove, they are congruent. If I have a second left hand, it's congruent with the first. Congruence is transitive. How do you explain this transitivity if handedness is just a simple, unanalyzable monadic property like "redness"?
  *[Note: Redness doesn't guarantee spatial coincidence. This highlights that handedness is essentially geometric/relational, making the "monadic" label suspect.]*

  ### Topology and Orientability

  **7.** Consider a creature living in a non-orientable space, like a Möbius band. If it travels round a loop, it returns as its own mirror image. In your view, does the creature's intrinsic handedness *change* during the trip, or was the space never truly non-orientable to begin with?
  *[Note: If the property changes, intrinsic properties are path-dependent (unusual). If the space must be orientable, her metaphysics dictates the topology of the physical universe, which is a heavy empirical bet.]*

  **8.** If you say the property changes, does that mean "left" is only a local fact, not a global one? And if it's local, can we really say the universe has a handedness, or only that regions do?
  *[Note: This fragments the property. If handedness isn't global, the "Absolute" in Orientation Absolutism loses its force.]*

  ### Dimensionality and Intrinsicality

  **9.** A flat triangle and its mirror image can't coincide in 2D space, but they can if you flip one through the third dimension. A left hand can't become a right hand in 3D, but could in 4D. If the handedness of an object depends on the dimensionality of the space it inhabits, is it really an *intrinsic* property of the object?
  *[Note: Intrinsic properties shouldn't depend on the embedding space. This suggests handedness is a relation between object and space dimension, not a property of the object alone.]*

  **10.** If you insist it remains intrinsic, are you saying a hand brought into a 4D space would lose its handedness? Or would it retain it, even though it could now be superposed on its mirror image?
  *[Note: If it loses it, the property is fragile/relational. If it retains it, she must explain what "left" means when the distinction is geometrically erasable.]*

  ### Communication and Epistemology

  **11.** The classic "Ozma Problem": If we can't point to a shared object, can we tell a distant civilization which side is left? If you say yes, using the weak force, don't you concede that the physical law defines the property? If you say no, isn't your "intrinsic property" forever private and unknowable?
  *[Note: A dilemma. Either physics defines it (relationism) or it's unknowable (skepticism). Both are costly for an absolutist.]*

  **12.** Last question: Could we discover tomorrow that we've had it backwards all our lives? That what we call "left" was actually "right"? If your property is intrinsic and irreducible, is such a global swap metaphysically possible, and if so, would there be any evidence for it?
  *[Note: If the swap is possible and undetectable, the property is empirically meaningless. If impossible, she needs to explain what fixes the reference of our word "left" other than our own contingent perspective.]*
