  ### The Case of the "Shifted Framework": The Architect and the Gardener

  **The Concrete Scenario**

  Consider Arthur, a celebrated architect who, at age 50, executes a detailed advance directive (AD). Arthur's conception of a dignified life is rooted in **creative agency and cognitive mastery**. His AD states: *"If I lose the capacity to engage in complex design work or to recognize my own professional legacy, I refuse all life-sustaining interventions, including antibiotics and artificial nutrition. My life is defined by my output; without it, I am merely biological matter."*

  At age 75, Arthur develops early-onset dementia. However, prior to losing decision-making capacity, he undergoes a **rational, non-pathological transformation in values**. He does not merely "forget" his architecture; he consciously re-evaluates what gives his life meaning. In a series of lucid conversations documented in his journal, he articulates a shift from a "Creator" framework to a "Witness" framework. He writes: *"I no longer find dignity in what I make, but in what I experience. The sun on my face, the texture of soil in my garden, the presence of my grandchildren—these are not consolations for lost work; they are a superior form of being."*

  Arthur then suffers a stroke that renders him permanently incapable of understanding complex language or design (triggering the AD's condition) but leaves him with the capacity to experience sensory pleasure and emotional connection. He develops pneumonia.

  *   **The Earlier Directive:** Mandates withholding antibiotics because the condition "unable to engage in design" is met.
  *   **The Later Patient's Preferences:** Arthur does not explicitly request antibiotics (he lacks the conceptual framework to understand the intervention). However, he actively expresses a desire to continue living within his *new* framework (reaching for his gardening tools, smiling at his grandchildren, resisting sedation). He is not refusing treatment; he is affirming the *life* that treatment would sustain.

  **The Conceptual Tension: Meta-Evaluative Authority**

  This scenario does not map neatly onto the standard "Precedent Autonomy vs. Present Best Interests" debate. In the standard debate, the conflict is usually: *Past Self says "No Treatment"* vs. *Present Self needs "Treatment for Welfare."*

  Here, the conflict is not about the intervention itself (antibiotics), nor is it a simple clash of preferences (Past says "Die," Present says "Live"). The conflict is about **Meta-Evaluative Authority**: *Who has the normative sovereignty to define the criteria by which Arthur's life is judged as worth sustaining?*

  1.  **The Past Self's Claim:** Arthur (age 50) claims the authority to set the **constitutive rules** of his life. He asserts that "Architecture" is a necessary condition for "Arthur's Life." If that condition fails, the entity remaining is not worthy of the resources owed to Arthur.
  2.  **The Present Self's Claim:** Arthur (age 75) does not contest the medical facts. Instead, he operates within a **different evaluative framework**. He asserts (pre-incapacity) that "Sensory Presence" is a sufficient condition for "Arthur's Life."

  The normative problem is that honoring the AD does not just respect a preference; it enforces a **metaphysical definition of the person** that the current person has rationally outgrown. Disregarding the AD does not just maximize welfare; it validates a **new definition of the person** that the past agent explicitly rejected as insufficient.

  **Why Standard Resolutions Fail**

  This tension cannot be resolved by appealing solely to **continuity of personal identity** or **present welfare**:

  *   **Failure of Personal Identity:** Arguing that Arthur is the "same person" over time does not solve the problem. Both the Past and Present Arthurs agree on the biological continuity. The dispute is not *who* is in the bed, but *what counts as a life for that person*. If we appeal to identity to honor the AD, we privilege the Past Self's *definition* of identity (Psychological Continuity via Work) over the Present Self's *experience* of identity (Phenomenological Continuity via Sensation). Identity theory tells us it is one person, but it does not tell us which *version* of that person's value system governs the medical decision.
  *   **Failure of Present Welfare:** Arguing that we should treat Arthur because he is currently happy (high welfare) misses the normative weight of the AD. The AD was not merely a prediction of unhappiness; it was a **moral commitment to a specific narrative integrity**. To treat Arthur solely on the basis of present welfare is to treat him as a vessel of pleasure rather than an author of a life story. It dismisses the Past Self's right to determine the *terms* of their own dignity, reducing a normative claim about "the good life" to a mere calculation of "pleasant experiences."

  **Conclusion**

  The distinct conceptual issue here is **Axiological Sovereignty**. The standard debate assumes the *values* are stable (e.g., "I value life" vs. "I value dignity") and only the *application* changes. In Arthur's case, the *currency of value itself* has changed. The medical team is forced to choose between enforcing the **Past Self's jurisdiction over the definition of dignity** (which mandates death) or recognizing the **Present Self's jurisdiction over the experience of value** (which mandates life). This is not a conflict between autonomy and welfare, but a conflict between two incompatible **normative frameworks** claiming authority over the same biological existence.
