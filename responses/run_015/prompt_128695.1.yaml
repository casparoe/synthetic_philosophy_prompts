answer: |-
  You have put your finger on the soft underbelly of almost every non-reductive, non-naturalist, or property-dualist position in contemporary metaphysics. You are right to be annoyed: this move is pervasive, often structurally necessary for the position to survive, and frequently obscured by a shift in vocabulary from "cause" to "ground," "track," or "constitute."

  There is no single, canonical noun phrase in the literature that captures *exactly* this argumentative maneuver (the specific tension between denying causal efficacy while retaining counterfactual dependence to secure reference). However, the components are well-discussed under different headers.

  Here is the breakdown of what you are seeing, why existing labels miss it, and a coinage for the phenomenon itself.

  ### 1. Diagnosis: What exactly is this?

  The phenomenon is a specific instability in **Epistemically Robust Epiphenomenalism**.

  To maintain that a feature $F$ (qualia, norms, numbers) is causally inert, one must deny that $F$ appears in the *etiological* history of the belief state $B$. (Story A).
  To maintain that $B$ is *about* $F$ (and not just a hallucination), one must posit a relation $R$ between $F$ and $B$ that rules out coincidence. (Story B).

  In almost all naturalistic epistemologies, the relation that rules out coincidence is **counterfactual sensitivity**: if $F$ had not been the case, $B$ would not have occurred (or would have been different).
  However, in most metaphysics of causation (specifically Lewisian counterfactual theories), **counterfactual dependence *is* causation.**

  Therefore, the maneuver you are identifying is the attempt to **harvest the epistemic benefits of counterfactual dependence without paying the ontological cost of causal efficacy.** It relies on a divergence between the *metaphysics of causation* (often defined as process, transfer, or physical production) and the *semantics of reference* (often defined as modal covariance).

  ### 2. Why existing labels don't fit

  *   **The Access Problem (Benacerraf/Field):** This names the *objection* ("How do you know?"), not the *repair move* ("We track without touching"). You are interested in the machinery of the repair.
  *   **Causal Exclusion (Kim):** This argues that if the physical is sufficient, the mental is excluded. Your phenomenon is what happens *after* someone accepts exclusion but tries to save knowledge.
  *   **Pre-established Harmony:** This is the historical ancestor (Leibniz). Modern proponents explicitly deny they are Leibnizians because they claim the "harmony" is explained by natural selection or constitution, not God. Your observation is that their "naturalistic explanation" secretly reintroduces the harmony as a brute modal fact.
  *   **Causal Relevance vs. Efficacy:** (Macdonald & Macdonald). This distinction is often used to *save* mental causation. Your phenomenon is when someone *denies* efficacy but keeps relevance, then struggles to explain how relevance works without efficacy.

  ### 3. The Coinage: **The Counterfactual Leak**

  Since there is no established name, I propose calling this **The Counterfactual Leak**.

  **Definition:**
  The **Counterfactual Leak** occurs when a theoretical framework denies that a feature $F$ has causal power over a belief state $B$ (to preserve causal closure or ontological parsimony), but implicitly relies on a counterfactual dependency between $F$ and $B$ to explain the accuracy or intentionality of $B$, thereby allowing causal-like difference-making to "leak" back into the system without being acknowledged as causation.

  **The Structure:**
  1.  **Denial:** $F \not\to B$ (No causal arrow).
  2.  **Requirement:** $\neg F \square\to \neg B$ (Counterfactual dependence required to avoid coincidence).
  3.  **Tension:** If $(\neg F \square\to \neg B)$ is true, and causation is understood counterfactually, then $F \to B$.
  4.  **Resolution (The Leak):** The theorist asserts (2) while maintaining (1), usually by stipulating that the counterfactual holds due to a "non-causal modal connection" (e.g., constitution, grounding, or primitive tracking).

  ### 4. Boundaries: In and Out

  **Clearly IN (Instances of the Leak):**
  *   **Chalmers' Epiphenomenal Qualia:** Qualia don't cause behavior (Story A), but our reports track them because the reports are "directly about" the qualia in a way that implies if the qualia were different, the report would differ (Story B).
  *   **Enoch's Third-Factor Metaethics:** Moral facts don't cause our evolutionary fitness (Story A), but we track them because survival *constitutively* involves tracking truth (Story B). The "constitutive" link does the work of a cause without the label.
  *   **Gödelian Mathematical Intuition:** Math objects don't causally interact with brains (Story A), but we have "intuition" that is sensitive to mathematical truth (Story B).

  **Clearly OUT (Where the Leak is Plugged):**
  *   **Error Theory / Eliminativism:** Denies Story B. We *don't* have correct beliefs about $F$. (e.g., Moral Error Theory). No leak because no tracking is claimed.
  *   **Causal Reductionism:** Denies Story A. $F$ *does* cause $B$ (e.g., Identity Theory). No leak because causation is admitted.
  *   **Coherentism:** Denies the need for Story B to be about $F$ specifically. Beliefs are justified by other beliefs, not by tracking $F$. (This avoids the leak but sacrifices realism about $F$).

  ### 5. The Identity Question

  > *Does the pattern still bite when the second story is identity rather than tracking or representation?*

  **Verdict: No, the Leak is plugged, but the position changes.**

  If Story B claims that the belief state $B$ is *identical* to the feature $F$ (or that the content of $B$ is constituted by $F$ via identity), you do not need counterfactual tracking to explain the relation. Identity is necessary; it holds across all worlds where the relata exist.

  *   **Case:** Type Identity Theory (Pain = C-fiber firing).
  *   **Story A:** C-fibers cause the report.
  *   **Story B:** The report is about Pain because Pain *is* C-fiber firing.
  *   **Result:** There is no Counterfactual Leak because you don't need a counterfactual bridge. However, you have abandoned the claim that $F$ is causally inert. C-fibers have causal power, so Pain has causal power.

  *   **Case:** Platonic Constitution (The belief *contains* the Form).
  *   If the belief literally contains the inert abstract object, you still need to explain why *this* belief token exists rather than another. If the inert object didn't exist, would the belief token still exist? If yes, you have coincidence. If no, you have a leak.
  *   **Conclusion:** The Leak only vanishes if the identity claim brings $F$ into the causal order (i.e., if $F$ turns out to be physical). If $F$ remains inert, identity alone cannot explain why the belief token is *sensitive* to $F$ without a Counterfactual Leak.

  ### 6. The Mirror Version

  > *And if there's no established name at all... one case clearly in and one clearly out.*

  The mirror version you mentioned ("tracking is evidence that the feature is causally efficacious") is the **Argument from Epistemic Access**.

  *   **Relation:** It is the *reductio* that generates the Leak.
  *   **Distinction:** The Argument from Epistemic Access is the *attack*. The Counterfactual Leak is the *defensive maneuver* used to parry the attack.
  *   **Why it's distinct:** One can run the Argument from Epistemic Access without there being a Leak (e.g., if the opponent just concedes and becomes a reductionist). The Leak only exists when the opponent tries to hold both "Inertness" and "Access" simultaneously.

  ### Summary for your Reading Group

  When you encounter this in the wild, you can diagnose it as follows:

  1.  **Identify the Split:** Point out they are offering an etiological story (physical) and a semantic story (non-physical).
  2.  **Press the Modal:** Ask, "In the nearest possible world where $F$ is different, is the belief different?"
  3.  **Name the Leak:** If they say "Yes," ask, "If that isn't a causal difference, what metaphysical relation supports counterfactual dependence without causation?"
  4.  **The Label:** "You are relying on a **Counterfactual Leak**: you are using modal dependence to secure reference while denying the causal status that usually grounds modal dependence."

  This should save you from just getting a label back, because it forces them to account for the *metaphysical cost* of the counterfactuals they are using to save their epistemology.
