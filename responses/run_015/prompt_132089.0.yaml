answer: |-
  To decide this case, an account of what we owe the dramatized dead must satisfy seven requirements. Below, each is stated with the case that motivates it and marked as either **Non-negotiable** (the account fails without it) or **Preference** (a matter of ethical temperament).

  **1. The Asymmetry Principle**
  *   **Case:** The Triple Asymmetry. Your father cannot be compensated, cannot correct the record, and cannot refuse.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** Any account that treats the dead as moral agents capable of consenting to or forgiving harm collapses. The framework must acknowledge that the obligation flows one way: from the living who act to the dead who are acted upon. If the account assumes harm requires sensation, it cannot address the unique vulnerability of the deceased.

  **2. The Threshold of Identification**
  *   **Case:** Identification. At what point does the character stop being your father?
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** The account must define the boundary where "inspired by" becomes "depiction of." Without a threshold for when a name, face, and specific biographical trajectory bind the character to the person, there is no basis to object to any distortion. However, *where* that line is drawn (strict fidelity vs. essence) is a Preference.

  **3. The Contextual Integrity Principle**
  *   **Case:** Whose norms settle what a fitting depiction is? His (1970s professional) or ours (current)?
  *   **Status:** **Preference.**
  *   **Reasoning:** An account can validly argue for historical contextualization (judging him by his time) or contemporary moral reckoning (judging him by ours). A good account must choose one explicitly, but neither is inherently disqualifying. Your brother and sister are arguing from different temperaments here; the framework must admit that both are coherent positions, even if incompatible.

  **4. The Epistemic Dominance Principle**
  *   **Case:** The Audience Side. The series borrows epistemic authority (real names, photos) and overwrites the archival memory (the "Second Death").
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** This is the core of your specific case. Because the archive is sealed for twenty-five years, the dramatization is not competing with the record; it is replacing it. An account that treats this as mere "entertainment" ignores the structural reality that for a generation, this fiction *is* the truth. The framework must treat the corruption of the historical record as a tangible harm.

  **5. The Distinction of Harm**
  *   **Case:** The distinctions between false memory, reputational damage, and private vs. public self.
  *   **Status:** **Preference.**
  *   **Reasoning:** Whether damaging a memory is distinct from damaging a reputation is a philosophical nuance. An account can treat them as the same (harm to legacy) or different (harm to social standing vs. harm to intimate truth). This depends on whether one values the *person* or the *persona* more highly.

  **6. The Remedial Capacity Test**
  *   **Case:** Remedies. Disclaimers, archives, accompanying documentaries.
  *   **Status:** **Preference.**
  *   **Reasoning:** An account can argue that a disclaimer discharges the duty (procedural fix) or that nothing discharges it once the image is broadcast (substantive harm). This is a pragmatic judgment on how audiences process information, not a fundamental moral axiom.

  **7. The Triangular Weighting**
  *   **Case:** Conflict Structure. Dead vs. Makers vs. Audience.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** The account must acknowledge all three parties as moral claimants. Dismissing the makers (censorship) or the audience (elitism) or the dead (nihilism) renders the account useless for negotiation. It must treat the conflict as genuine, not illusory.

  ***

  ### Incompatibilities

  You suspected that certain duties pull apart. The analysis confirms this. Two pairs of requirements cannot be jointly satisfied in this specific case:

  1.  **Respect for Anticipated Wishes vs. Fidelity to the Archive.**
      *   **Conflict:** If your father wished to be remembered as a man of action, but the archive shows he was cautious, fidelity to the archive violates his wishes. If he wished for privacy, but the archive is public, respecting his wishes requires suppressing the archive. You cannot satisfy both the dead man's self-conception and the historical record simultaneously.
  2.  **Duty to Him vs. Epistemic Duty to Audiences.**
      *   **Conflict:** The duty to him may require protecting his memory from unflattering truths (or flattening complexities to make him intelligible). The epistemic duty to the audience requires complexity and truth, even if unflattering. Because the show is the *only* record for 25 years, protecting him requires misleading the audience; informing the audience requires potentially damaging him.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the most dinner-table arguments is **The Epistemic Dominance Principle (Requirement 4)**.

  *   **"Nothing is owed because the dead are not harmed":** Excluded. The harm is not to the dead's feelings, but to the *knowledge environment* that constitutes their social existence.
  *   **"The estate's consent settles it":** Excluded. Consent does not fix the epistemic corruption for the audience who inherits the falsehood as fact.
  *   **"Artistic licence settles it":** Excluded. Licence grants freedom to create, not authority to claim truth. When the work signals research, licence is voided by the claim to authority.
  *   **"Only the famous are fair game":** Excluded. Epistemic dominance operates regardless of fame; a minor figure erased by a drama is as lost as a major one.
  *   **"Truth is owed to the audience and never to the subject":** Excluded. If the "truth" presented is dramatized fiction that overwrites the actual record, the audience is *not* receiving truth. This requirement reveals that lying to the audience about the subject violates the duty to *both*.

  ***

  ### Variables

  **If the dramatization were one among many records:**
  The analysis shifts from **Epistemic Dominance** to **Reputational Balance**. If the archive were open and other books existed, the "Second Death" risk vanishes. The drama becomes a *interpretation* rather than *the record*. Your leverage decreases because the harm is no longer total; your brother's demand to cut the scene becomes harder to justify as a moral necessity, moving it toward a preference.

  **If he were a minor figure rather than a subject:**
  This makes the case **harder** to protect, but **more critical** to intervene.
  *   **Harder:** Audiences expect less fidelity from supporting characters. The "Threshold of Identification" is looser. Producers can argue he is a "composite" or "dramatic function" rather than a biographical subject.
  *   **More Critical:** Because he is minor, there is less independent scholarship to correct the record. If the lead character has ten biographies written about them, a lie in a drama is corrected by the library. If your father has *only* this scene and a sealed archive, the distortion is absolute. Being a minor figure in an "only record" scenario makes the epistemic harm more permanent, even if the screen time is shorter.
