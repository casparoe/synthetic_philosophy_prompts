  Verdict: This phenomenon corresponds to an established mechanistic concept known as **Narrow Bracketing** (or **Narrow Framing**), applied to diachronic self-regulation, though it lacks a single canonical label in the philosophy of action. In behavioral economics, *Narrow Bracketing* describes evaluating decisions in isolation rather than as part of a broader portfolio (the long-term plan). In philosophy, this specific pattern of gradual, justified-seeming deviation is often discussed under **Resolution Erosion** (Richard Holton) or **Ethical Fading** (Tenbrunsel & Messick), but these terms do not fully capture the *smooth, non-conflictual* structure you describe. Therefore, it requires a **new distinction** to precisely carve it off from standard akrasia and discounting models.

  **Precise Definition:**
  **Diachronic Rule Erosion via Local Rationality:** A failure of self-regulation where a long-term policy is invalidated not by a singular impulsive breach, but by a sequence of context-sensitive, locally rational exceptions. Each exception is justified by a shift in the evaluative frame (e.g., urgency, reward, environmental change), rendering the action consistent with the *current* local judgment, even though the cumulative sequence violates the *global* intention.

  **Boundaries:**
  *   **Vs. Hyperbolic Discounting:** Discounting relies on **temporal proximity** distorting value (the "now" is overweighted). Rule Erosion relies on **contextual framing** distorting scope (the "specific case" is decoupled from the "general rule"). In discounting, the agent knows they are trading long-term for short-term; in erosion, the agent believes they are upholding the plan via necessary adaptation.
  *   **Vs. Discrete Akrasia:** Classic akrasia involves **synchronic conflict** (acting against one's better judgment *at the moment of action*). Rule Erosion involves **diachronic incoherence** (each action matches the judgment *at that moment*, but the sequence of judgments contradicts the prior plan). There is no experience of "surrender," only of "updating."

  **Classification:**
  It should be treated as a **distinct failure mode** within the broader category of weakness of will. Unlike standard akrasia (a failure of *strength* against temptation) or discounting (a failure of *valuation* over time), this is a failure of **scope integration**: the agent fails to maintain the global plan as the relevant frame for local decisions.
