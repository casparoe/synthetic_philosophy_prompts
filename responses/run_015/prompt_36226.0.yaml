answer: |-
  This argument is a sophisticated restatement of **Ergodicity Economics**, most prominently associated with physicist Ole Peters. It challenges the standard Expected Utility (EU) framework by arguing that the discrepancy between ensemble averages (parallel universes) and time averages (single trajectory) renders arithmetic expectation maximization physically incoherent for a single agent over time.

  The analogy is mathematically potent but philosophically fragile. Below is the audit of the correspondence, the breakdown points, and a verdict on your friend's normative claim.

  ### 1. The Correspondence Table

  | **Evolutionary Source** | **Gambling/Investing Target** | **Function in Analogy** |
  | :--- | :--- | :--- |
  | **Organism / Lineage** | The Gambler (or specific Betting Strategy) | The entity undergoing the process. |
  | **Generation** | Single Bet / Trading Period | The discrete time-step of the process. |
  | **Population Size** | Current Wealth / Bankroll | The quantity being multiplied; the "score." |
  | **Fitness** | Geometric Growth Rate (Log-Return) | The metric determining long-term dominance. |
  | **Extinction** | Ruin (Wealth $\le$ 0) | The absorbing state; game over. |
  | **Environment** | Probability Distribution of Returns | The fixed rules of the "game" (edge and odds). |
  | **Natural Selection** | Compounding / Volatility Drag | The mechanism that penalizes variance over time. |
  | **Gene Pool** | Market / Ensemble of Strategies | The space from which successful strategies emerge. |

  ### 2. Where the Mapping Holds (The Strengths)

  The analogy succeeds in diagnosing a specific mathematical pathology in standard finance theory: **Non-Ergodicity.**

  1.  **The Absorbing State:** In both systems, zero is a hard floor. In evolution, a dead organism has zero offspring forever. In gambling, a ruined gambler cannot compound. This makes the *geometric mean* the relevant metric for survival, not the *arithmetic mean*.
  2.  **Volatility Drag:** In evolution, a lineage that fluctuates wildly between high and low population sizes is more prone to stochastic extinction than a stable grower, even if their arithmetic average growth is higher. Similarly, in investing, a 50% loss requires a 100% gain to recover. Variance reduces the geometric compound rate ($\text{Geometric} \approx \text{Arithmetic} - \frac{\text{Variance}}{2}$).
  3.  **Time vs. Ensemble:** This is the core insight. Standard EU theory often justifies risky bets by averaging over parallel outcomes (ensemble). But a single gambler experiences outcomes sequentially (time). If the time-average growth is negative (due to overbetting), the gambler goes broke, regardless of the positive ensemble expectation.

  ### 3. Where the Mapping Breaks Down (The Disanalogies)

  The analogy fails when moving from *descriptive dynamics* (what happens) to *normative rationality* (what one should do).

  #### A. Replication vs. Reinvestment (The "Gene" Problem)
  *   **Evolution:** Selection acts on *genes*, not individuals. An individual organism is disposable; it is a vehicle for the replicator. If an organism takes a high risk and dies, but its siblings (carrying the same "high-risk gene") survive and reproduce, the strategy persists.
  *   **Gambling:** The gambler is both the vehicle and the replicator. There is no "gene pool" of you. If you go ruined, *you* are gone.
  *   **The Break:** Evolution can "afford" to select for strategies that kill 90% of the lineage if the 10% explode in number. A single rational agent usually cannot afford a 90% chance of ruin, even if the geometric growth of the *surviving* path is high. The analogy conflates *population-level survival* with *individual-level survival*.

  #### B. Infinite vs. Finite Horizons
  *   **Evolution:** Effectively infinite horizon. The "long run" is the only run that matters.
  *   **Gambling:** Agents have finite lifespans and specific goals (retirement, buying a house).
  *   **The Break:** Kelly is optimal for *asymptotic* wealth maximization ($T \to \infty$). For finite horizons, especially short ones, Kelly is often suboptimal. If you need \$1 million by Friday to save a life, and Kelly gets you to \$500k with certainty while a "bold" bet gets you to \$1M with 40% probability, the bold bet is rationally superior for that specific utility function, despite the ruin risk.

  #### C. Consumption and Withdrawal
  *   **Evolution:** Organisms reinvest energy into reproduction automatically. There is no "withdrawal for consumption" that reduces the principal in the same way.
  *   **Gambling:** Agents consume. A Kelly gambler who never withdraws is biologically unrealistic.
  *   **The Break:** Once you introduce consumption (withdrawals), the "ruin" boundary moves. You can be "ruined" (unable to maintain lifestyle) without hitting zero wealth. The strict absorbing state of the analogy becomes a soft constraint, complicating the pure geometric maximization argument.

  #### D. Conscious Choice vs. Blind Selection
  *   **Evolution:** A blind process. Strategies are not "chosen"; they are filtered.
  *   **Gambling:** A conscious process. Agents have preferences.
  *   **The Break:** Just because nature *selects* for geometric maximizers doesn't mean an agent *must prefer* it. Rationality is defined by the alignment of actions with *preferences*, not just environmental dynamics. An agent might prefer a 99% chance of doubling wealth and a 1% chance of death over a 100% chance of slow growth. The analogy attempts to derive an *ought* from an *is*.

  ### 4. Verdict: Do the Conclusions Survive?

  #### Claim 1: "Maximizing expected wealth is a category error."
  **Verdict: Partially Survives.**
  Your friend is correct that maximizing *arithmetic* expected wealth in a multiplicative, non-ergodic system with ruin states is mathematically pathological for a single trajectory. It ignores the order of operations. In this specific context (repeated bets, reinvestment, no external cash flows), the "ensemble average" is indeed irrelevant to the individual.
  *However*, Expected Utility theory is not inherently arithmetic. If you define Utility as Log(Wealth), Expected Utility maximization *becomes* geometric growth maximization. So, EU isn't wrong; the *choice of utility function* in standard textbooks (often linear or shallow risk aversion) is what's wrong for this specific dynamic.

  #### Claim 2: "Betting above Kelly... is straightforwardly irrational, full stop."
  **Verdict: Fails.**
  This is the overreach. The analogy supports the claim that overbetting is **suicidal in the long run**, but not that it is **irrational for a specific agent**.

  1.  **Utility is Subjective:** If an agent's utility function has a threshold (e.g., "I need \$10M to be happy, \$9M is useless"), Kelly may be too conservative. Rationality requires maximizing *expected utility*, not *expected wealth growth*. If the agent values the *chance* of a massive outcome more than the *certainty* of survival, betting above Kelly is rational *for them*.
  2.  **Optionality and Reload:** In finance, "ruin" is rarely biological death. A trader can blow up a fund and start another (the "Phoenix" strategy). If the downside is capped (bankruptcy protection) and the upside is uncapped, arithmetic maximization (levering up) can be rational for the *individual's career*, even if it's destructive for the *capital*.
  3.  **The "Rationality" Definition:** Your friend is defining rationality as "survival of the capital." But for a human, rationality is "satisfaction of preferences." If I prefer a 10% chance of being a billionaire and a 90% chance of being broke over a 100% chance of being comfortably middle-class, choosing the risky bet is rational. The evolutionary analogy cannot override subjective preference without committing the naturalistic fallacy.

  ### Summary
  The analogy is a powerful **corrective** to naive expected value thinking in finance. It correctly identifies that in non-ergodic systems, risk management is not a preference but a mathematical necessity for continuity.

  However, it is a poor **foundation for normative ethics**. It conflates the *survival of the strategy* with the *goals of the agent*. While betting above Kelly guarantees ruin in the limit, declaring it "irrational full stop" ignores finite horizons, consumption needs, and the subjective nature of utility. The gambler is not a gene; they are allowed to choose how they die.
