answer: |-
  This is a distinct recognized category known as **Epistemic Self-Defeat**, which generalizes the concept of **Cognitive Instability** from physics to broader epistemology, constituting a specific subclass of *reductio ad absurdum* that targets the reliability of the evaluative apparatus rather than logical consistency.

  The distinction lies in the target of the contradiction. A standard logical *reductio ad absurdum* demonstrates that a theory $T$ entails a logical contradiction (e.g., $P \land \neg P$), rendering $T$ necessarily false within the system of logic. Epistemic Self-Defeat, however, demonstrates that $T$ entails the unreliability or non-existence of the evidence required to accept $T$. The contradiction is not between propositions within the theory, but between the theory's truth conditions and the observer's capacity to verify them. In the Boltzmann Brain scenario, the theory predicts that typical observers are random fluctuations; since you are reasoning systematically, you are not a typical observer under that theory, thereby undermining the statistical reasoning used to propose the theory. This is not a logical impossibility—you *could* be a Boltzmann Brain—but it renders the theory **cognitively unstable** because accepting it destroys the justification for accepting it.

  This category is also distinct from ordinary empirical falsification. Empirical falsification occurs when data $D$ contradicts a prediction of $T$ (i.e., $T \rightarrow \neg D$, but we observe $D$). In Epistemic Self-Defeat, the data $D$ is not inconsistent with $T$; rather, $T$ implies that $D$ is untrustworthy or unrepresentative. If a theory predicts that all your memories are false, you cannot use those memories to falsify the theory empirically; you must reject the theory because it makes empirical inquiry impossible. The boundary condition for applying this label is strictly when the theory undermines the **instrumental or cognitive preconditions** of its own evaluation. It does not apply to theories that merely predict unusual observations (e.g., quantum mechanics predicts counterintuitive states, but does not predict that the instruments measuring them are hallucinations).

  Defending this classification requires acknowledging that it relies on a **Principle of Cognitive Trust**: we must assume our cognitive apparatus is generally reliable to engage in any reasoning at all. This is not a logical truth, but a pragmatic transcendental condition. If a theory violates this condition, it is not logically false, but it is **rationally untenable**. This distinguishes it from skeptical hypotheses that are logically possible but epistemically self-defeating. For your essay, you should treat this as a unique argumentative move that operates at the meta-level of inquiry: it does not argue that the world is not as the theory says, but that the theory cannot be coherently held by an agent within that world. Use **Cognitive Instability** when discussing physical cosmological models (referencing David Albert) and **Epistemic Self-Defeat** when discussing broader philosophical skepticism, but maintain that they share the identical structural flaw of severing the link between truth and knowability.
