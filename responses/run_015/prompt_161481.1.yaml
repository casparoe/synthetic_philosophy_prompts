answer: |-
  **OFFICE FOR EPISTEMIC ASSURANCE**
  **Form OEA-PRAMĀ-04: Cognition Validity Certification**

  **Purpose:** This form establishes compliance with the *parataḥ* validity protocol. All cognitions claiming status as *pramā* (valid knowledge) must be certified by a functioning knowledge-source (*pramāṇa*). Intrinsic validity claims are not recognised.

  **1. Source Declaration**
  The Applicant must identify the causal instrument generating the target cognition. Tick one box only:
  [ ] *Pratyakṣa* (Perception)
  [ ] *Anumāna* (Inference)
  [ ] *Upamāna* (Comparison)
  [ ] *Śabda* (Testimony)
  *Note: Claims sourced to *Arthāpatti* (Presumption) or *Anupalabdhi* (Non-apprehension) are automatically rejected. Per Office Guideline 7.2, these are reducible to *Anumāna* or perception of absence respectively and do not constitute independent instruments.*

  **2. Inference Annexe (Complete only if *Anumāna* selected)**
  Applicants must populate all five members of the syllogism. Partial entries will be returned.
  (i) *Pratijñā* (Proposition): ________________________________________________
  (ii) *Hetu* (Reason): _______________________________________________________
  (iii) *Udāharaṇa* (General Rule): ___________________________________________
  (iv) *Upanaya* (Application): _______________________________________________
  (v) *Nigamana* (Conclusion): _______________________________________________
  *Requirement:* State the *Vyāpti* (invariable concomitance) explicitly. Supply one *Sapakṣa* (positive example) and one *Vipakṣa* (negative example). Redundancy between members (iii) and (v) is mandatory for compliance.

  **3. Defect Assessment (*Hetvābhāsa* Checklist)**
  Confirm the Reason is free from the following five defects. Initial each clause:
  ___ *Savyabhicāra* (The reason wanders into the negative example).
  ___ *Viruddha* (The reason proves the opposite of the proposition).
  ___ *Asiddha* (The reason is unproven or identical to the proposition).
  ___ *Satpratipakṣa* (The reason is counterbalanced by an equal opposite reason).
  ___ *Bādhita* (The proposition is sublated by stronger evidence or time).

  **4. Comparison and Testimony Particulars**
  If *Upamāna*: Provide the comparison sentence and the remembered object facilitating the identification (e.g., the *gavaya*).
  If *Śabda*: Provide credentials of the speaker confirming reliability and absence of deceit.

  **5. Note on Hypothetical Reasoning (*Tarka*)**
  Applicants are advised that *Tarka* may be employed to dispel doubt regarding natural relations but cannot establish truth independently. Grant proposals resting solely on *Tarka* will be returned unread. This is not a negotiation.

  **6. Validation Protocol (*Parataḥ* Compliance)**
  Pursuant to the extrinsic validity doctrine, the primary cognition cannot certify itself. The Applicant must submit a second-order cognition (*anuvyavasāya*) affirming the validity of the primary cognition. This second-order cognition must itself be generated by a functioning instrument.

  **7. Termination of Certification Chain**
  To prevent infinite regress in processing times, Regulation 12.4 stipulates that the certification chain terminates at the fourth order. Fourth-order cognitions are deemed valid by virtue of their position in the sequence. No further evidence of instrument functionality is required for this tier. This exemption applies solely to cognitions processed by this Office.

  **8. Self-Reference Exemption**
  Any cognition whose object is the assurance scheme itself, including the validity of Regulation 12.4, is exempt from Clauses 1–7. Such cognitions are accepted as intrinsically valid (*svataḥ*) for administrative purposes only.

  **Signatures:**
  Applicant: ___________________ Date: __________
  Epistemic Officer: ___________________ Stamp: [VALID/INVALID]
