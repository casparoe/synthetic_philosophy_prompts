answer: |-
  This is a precise dissection of a stalemate that frustrates practitioners precisely because it is intellectually stable. You are not asking for the answer to the policy question, but for the topology of the disagreement itself. Here is the diagnosis of the structure, the evaluation of your hypothesis, the explanation of the asymmetry, and the prediction you requested.

  ### I. Diagnosis of Your Hypothesis

  Your three-part hypothesis is astute, but the load is not distributed evenly.

  **1. The Counterfactual Disagreement (Decoration)**
  The claim that critics argue against a competitive ideal while defenders argue against the distorted status quo is accurate as a description of rhetoric, but it is a symptom, not a cause. It is **decoration**.
  *   **Why:** If the supply of housing were perfectly elastic (the critic's empirical belief), the "distorted status quo" would quickly correct itself via new construction, rendering the counterfactual distinction moot. If supply is perfectly inelastic (the defender's empirical belief), the "competitive ideal" is physically impossible, making the critic's counterfactual a fantasy.
  *   **Commitment:** This part of the argument commits each side to nothing empirical. It allows them to talk past one another without risking falsification. It persists because it protects the load-bearing claims underneath.

  **2. The Market Definition and Elasticity (Load-Bearing Positive)**
  The claim that the dispute rests on the elasticity of supply evaluated at a specific scale and time horizon is **load-bearing**.
  *   **Why:** This is the only empirical claim that, if resolved, would collapse the disagreement. If you could prove that at the metropolitan scale over a 10-year horizon, supply elasticity is high (e.g., >1.0), the defender's "hold-up" argument fails because capital would flee or new stock would arrive, punishing the control. If you could prove elasticity is near-zero even in the long run due to structural constraints (geography, permanent zoning), the critic's "deadweight loss" argument weakens because the supply distortion cannot get much worse.
  *   **Commitment:** Critics commit to the mobility of capital and the responsiveness of construction. Defenders commit to the rigidity of land and the permanence of regulatory friction. The dispute is indeed empirical, but as you noted, the parameter is rarely isolated. It is usually assumed based on the chosen time horizon.

  **3. The Verbal Conflation of Affordability (Load-Bearing Normative)**
  The claim that "affordability" conflates price and security is **load-bearing**.
  *   **Why:** This explains why the argument does not end even when efficiency losses are conceded. If the goal were purely *price reduction*, a direct subsidy would be more efficient. If the goal were purely *security*, a right-to-renew would suffice. By bundling them, defenders can defend a price control using the moral weight of security, while critics attack the price control using the economic weight of efficiency.
  *   **Commitment:** Defenders commit to the idea that tenure is a social good distinct from consumption. Critics commit to the idea that housing allocation should be determined by price signals to ensure mobility.

  **Verdict:** Hypothesis 2 is the engine (positive economics); Hypothesis 3 is the fuel (normative economics). Hypothesis 1 is the exhaust (rhetorical byproduct).

  ### II. The Minimum Wage Asymmetry

  The asymmetry between the economist consensus on rent control versus the minimum wage is not a fact of theory, but a fact of **visibility and incidence.**

  1.  **Visibility of Costs (The Measurement Artifact):**
      *   **Minimum Wage:** The costs (job losses, reduced hours) are *visible* and *immediate*. They appear in monthly employment data. A teenager doesn't get hired; a worker gets hours cut. This is measurable within a political cycle.
      *   **Rent Control:** The costs (unbuilt units, deferred maintenance, conversion to condos) are *invisible* and *lagged*. The apartment building that was never constructed does not appear in the data. The deterioration of the stock happens over 15 years, well beyond the horizon of the study or the politician.
      *   **Result:** Economists condemn rent control more harshly because the mechanisms of harm are theoretically clear even if empirically slippery, whereas minimum wage harms are empirically contested because the signal-to-noise ratio in labor data is different.

  2.  **Incidence of the Transfer:**
      *   **Minimum Wage:** Transfers wealth from capital owners (often abstract or distant) to low-wage workers (visible, sympathetic). The "victim" is the unemployed worker, but they are often invisible in the aggregate statistics compared to the visible wage gain of the employed.
      *   **Rent Control:** Transfers wealth from landlords (often visible, sometimes small "mom and pop" investors) to incumbent tenants. However, the true cost is borne by *future* tenants (the excluded outsiders) and future workers (construction jobs not created).
      *   **Result:** The minimum wage looks like helping the poor against the rich. Rent control often looks like helping the middle-class incumbent against the poor outsider. Economists are sensitive to the "excluded outsider" dynamic in housing more than in labor.

  3.  **Market Power Plausibility:**
      *   **Labor:** Monopsony power (single buyer of labor) is plausible in specific locales or industries. A price floor can correct this.
      *   **Housing:** Monopoly power (single seller) is less plausible at the metro scale, though plausible at the neighborhood scale due to zoning. However, because capital is more mobile than labor, the threat of exit is higher in housing.
      *   **Result:** The theoretical justification for intervention is viewed as more robust in labor markets (monopsony) than in housing markets (where supply constraints are often government-imposed, making government price controls a double-distortion).

  ### III. What Would Count as Progress

  To move beyond the current loop, you need interventions that separate the bundled claims.

  1.  **The Unbundling Test (Policy):**
      *   **Policy:** A "Right to Renew" at *market* rent, coupled with means-tested relocation assistance if the tenant cannot pay.
      *   **What it shows:** If defenders reject this, it reveals that *price subsidy* is the actual goal, not *security*. If critics accept this, it acknowledges security as a valid policy goal distinct from price control.
      *   **Why it hasn't happened:** It is fiscally expensive (relocation assistance costs budget dollars) whereas rent control is fiscally free (costs are borne by landlords).

  2.  **The Elasticity Isolation (Empirical):**
      *   **Estimate:** A supply elasticity estimate that explicitly controls for zoning rigidity. We need to know the elasticity of supply *conditional on the regulatory environment*.
      *   **What it shows:** If elasticity is low *because* of zoning, then rent control is a second-best solution to a government-created monopoly. If elasticity is low *despite* loose zoning, then land scarcity is the driver.
      *   **Progress:** Acknowledging that rent control is a "second-best" response to zoning failure, rather than a "first-best" housing policy.

  3.  **The Second-Best Formalization (Theory):**
      *   **Result:** A formal model showing the conditions under which a price ceiling in a distorted market (zoning constraints) yields higher welfare than the distorted market alone.
      *   **Current State:** Most models compare Control vs. Perfect Competition. We need models comparing Control + Zoning vs. No Control + Zoning.
      *   **Progress:** This would shift the debate from "Is rent control efficient?" to "Is rent control the least inefficient way to manage a supply-constrained city?"

  ### IV. The Bedrock

  There is a component of this that no evidence will settle. It is the **definition of the right to exclude.**

  *   **The Bedrock Question:** Is housing a commodity like any other, where the owner's right to maximize return is paramount, or is it a social utility, where the tenant's right to remain is paramount?
  *   **Explanation:** If housing is a commodity, forbidding a mutually beneficial exchange (landlord wants higher rent, outsider willing to pay it) is a violation of liberty/efficiency. If housing is a social utility (like water or voting), then market allocation is morally illegitimate regardless of efficiency.
  *   **Weight:** This explains the *heat* of the argument, but not the *shape*. You can agree on the bedrock (e.g., "Housing is a right") and still disagree on the mechanism (e.g., "Rent control destroys the stock needed to realize that right"). However, this bedrock prevents the empirical disagreements from ever being decisive. If your opponent believes the right to housing trumps efficiency, showing them a deadweight loss calculation is irrelevant.

  **The Word:** The word doing the verbal work is **"Stability."**
  *   **Question 1 (Economic):** Does this policy stabilize the *supply* of housing? (Critics say no).
  *   **Question 2 (Social):** Does this policy stabilize the *lives* of tenants? (Defenders say yes).
  *   **Collapse:** The debate uses one word to answer two different questions.

  ### V. Prediction

  **Will you be having this identical argument in fifteen years?**

  **Yes.**

  **Why:**
  1.  **The Time Horizon Mismatch:** The costs of rent control (supply contraction) accrue over 10–20 years. The benefits (incumbent security) accrue immediately. Political cycles are 2–4 years. Politicians will always choose the immediate benefit over the long-term cost, ensuring the policy persists long enough for you to observe the decay, at which point the crisis justifies *more* control, not less.
  2.  **The Unbundling Failure:** No city will adopt the "Right to Renew at Market Rent" because it requires budget appropriations (for relocation assistance) rather than regulatory mandates. As long as the solution must be fiscally neutral, the bundle of Price + Security remains intact.
  3.  **The Bedrock Persistence:** The normative disagreement over the right to exclude is not resolving. As housing becomes more financialized, the "commodity" view strengthens among investors, while the "social utility" view strengthens among tenants. The polarization increases, making the empirical middle ground (elasticity estimates) less politically relevant.

  **The only thing that would stop the argument:** A shock to the supply side that is undeniable and rapid. If a city legalizes dense construction *and* supply actually arrives quickly (lowering market rents naturally), the demand for rent control evaporates. But given your observation on zoning and construction costs, you likely share the skepticism that this will happen in your timeframe.

  **Summary:** You are watching a debate where the positive claims (elasticity) are unresolvable due to data limitations, the normative claims (rights) are unresolvable due to values, and the political incentives (immediate benefit vs. deferred cost) ensure the policy persists regardless of the outcome. The argument persists not because it is unresolved, but because it is functionally stable for the actors involved.
