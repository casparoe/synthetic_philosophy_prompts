answer: |-
  **Case A**
  Alex and Blake are senior analysts sharing a dataset in a neutral open-plan office. Alex notices a minor error in Blake's entry and emails a correction. The office server assigns the session a random ID ending in an even number, which displays as a blue icon on both screens. The act generates an automatic timestamped log of Blake's error ($P$). In this context, the log serves as a necessary safeguard against future compliance audits, protecting both agents from liability. Alex's action is morally right; $P$ is a reason in favour of sending the email.

  **Case B**
  Alex and Blake are senior analysts sharing a dataset in a neutral open-plan office. Alex notices a minor error in Blake's entry and emails a correction. The office server assigns the session a random ID ending in an odd number, which displays as a red icon on both screens. The act generates an automatic timestamped log of Blake's error ($P$). In this context, the log is interpreted by management as a mark of incompetence, triggering a mandatory review that harms Blake's career prospects without enhancing safety. Alex's action is morally wrong; $P$ is a reason against sending the email.

  **The Inert Difference**
  The only descriptive difference between the cases is feature $F$: the parity of the server's random session ID (Even vs. Odd). $F$ determines the icon color (Blue vs. Red) but has no technical impact on data security, audit requirements, or management policy. It is a morally inert descriptive fact.

  **The Retuning**
  A generalist will object that the "management interpretation" constitutes a hidden difference in consequences, not a flip in $P$'s valence. They will argue $P$ (creating a log) is always a *prima facie* duty, merely outweighed in Case B. To block this, we retune the case: stipulate that the *consequences* are identical (no audit in A, no review in B). The difference lies solely in the *meaning* of the act constituted by $F$. In Case A (Even/Blue), creating a log constitutes "professional diligence." In Case B (Odd/Red), creating a log constitutes "betrayal of confidence," even though the tangible outcomes are identical. The generalist cannot cite consequences; they must claim the inert parity of a number changes the moral principle governing $P$.

  **Commentary**

  The particularist uses this pair to demonstrate holism: feature $P$ (creating a log) contributes positively to the moral status of the act in Case A and negatively in Case B, without any relevant difference in principle. The generalist cannot claim $P$ is merely outweighed in Case B. The test for reversal is this: if we remove $P$ (send the correction without a log), does the act improve? In Case A, removing the log makes the act worse (negligent). In Case B, removing the log makes the act better (less betraying). If $P$ were merely outweighed, removing it would leave the act's intrinsic value unchanged, only altering the net sum. Here, the intrinsic contribution of $P$ flips.

  Faced with this, the generalist has three options. First, deny the intuition: insist $P$ is always a reason for, and our judgment in Case B is confused. This clashes with the stipulated meaning-constitution of the retuned case. Second, posit a further unstated difference. But we have exhausted the descriptive base; $F$ (server parity) is the only difference, and it is inert. To claim $F$ matters is to assert a principle linking number parity to moral valence. Third, accept a hedged principle. This is the generalist's last stand. They must formulate a principle like: "Creating a log is a reason for action, unless the server ID is odd."

  Write out that principle. It looks like this: *For any agent $S$, creating a log is a reason for $S$ to act, ceteris paribus, unless the descriptive feature $F$ obtains, in which case it is a reason against.* But since $F$ is inert (random server parity), this principle offers no guidance independent of the verdict itself. It collapses into "Create a log unless you shouldn't." The principle rides on the back of the particular judgment rather than generating it. It saves generalism only by making principles empty summaries of case-by-case decisions.

  The single feature doing the work is the **meaning-constitution of $F$**. We stipulated that $F$ changes what the act *is* (diligence vs. betrayal) without changing its natural consequences. If this feature is removed—if $F$ has no constitutive power—the cases become identical, and the flip vanishes. The strongest generalist attack targets this stipulation: they will argue that "meaning" cannot supervene on inert features like server parity without some underlying normative principle linking them. If there is no such principle, the case is impossible; if there is, particularism fails. The particularist replies that the link is holistic, not principled: the whole context gives $F$ its power, not a rule. The seminar must decide whether "context" can do work without "principles" to govern it.
