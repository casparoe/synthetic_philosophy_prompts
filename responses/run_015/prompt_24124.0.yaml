  ### 5. The Discriminating Test Case
  To tell the **Net Welfare Rule** apart from the **Consistency/Commodification Rules**, you need a case where the animal is **happy** but clearly **used as a product**.

  **The Case:**
  > "A wealthy farmer keeps a small herd of cows in a lush, open pasture. They are never slaughtered, die of old age, and seem very happy. However, they are fitted with automated milking machines that extract milk daily for the farmer to sell at a premium market. The farmer does this purely for profit, not because the cows need medical relief."

  *   **If Dana says "Not Speciesist":** She is following the **Net Welfare Rule**. The cows are happy; therefore, the usage is acceptable.
  *   **If Dana says "Speciesist":** She is following the **Consistency or Anti-Commodification Rules**. We would not force humans to lactate for profit (Consistency), and the cows are being used as resources (Commodification), regardless of their happiness.

  This case isolates **Welfare** (which is high) from **Instrumentalization** (which is high), forcing her to reveal which value trumps the other.
