  Based on the six verdicts you've recorded, Dana isn't running a simple single-principle ethic (like pure utilitarianism or strict rights theory). She is running a hybrid rule that prioritizes **consistency with human treatment**, but allows for **exceptions based on animal welfare.**

  Here is the breakdown of the rule, the alternatives, the predictions, and the test case.

  ### 1. The Primary Rule: "Consistency with Welfare Exceptions"
  Dana's core heuristic appears to be: **"Would we accept this treatment for a human in a similar context? If no, it is speciesist, unless the treatment is primarily for the animal's own benefit."**

  *   **Why it fits:**
      *   **Factory Farming/Lipstick/Fur:** We wouldn't imprison, torture, or kill humans for meat, vanity, or fashion. No welfare benefit to the victim. -> **Speciesist.**
      *   **Organ Harvest:** We wouldn't do this to humans. It is wrong. But since the victim *is* human, species isn't the variable. -> **Not Speciesist.**
      *   **Rabies Cull:** We *would* incapacitate/kill a rabid human to save others. Consistency holds. -> **Not Speciesist.**
      *   **Parrot:** We wouldn't keep a human in a flat. *However*, Dana explicitly justifies this by saying "it's a good life for it." The welfare benefit overrides the consistency violation. -> **Not Speciesist.**

  ### 2. Alternative Rules That Fit the Data
  Two other rules fit all six cases equally well but diverge on the new elephant case.

  *   **Alternative A: The "Net Welfare" Rule (Utilitarian)**
      *   **Rule:** An action is speciesist if it causes net suffering to the animal for human gain. If the animal's life is net-positive (happy, healthy), the action is permissible.
      *   **Fit:** Factory farming/Lipstick/Fur cause suffering. Rabies cull prevents greater suffering (to humans). Parrot has a net-positive life.
      *   **Blind Spot:** It struggles to explain why the *Organ Harvest* is "wrong" (since 5 lives > 1 life), but Dana sidestepped this by calling it a "rights violation" rather than weighing utility.

  *   **Alternative B: The "Anti-Commodification" Rule (Deontological)**
      *   **Rule:** It is speciesist to treat an animal as a financial resource or product ("using the animal as a resource"). It is not speciesist if the relationship is symbiotic, protective, or companionship-based.
      *   **Fit:** Factory farming (product), Lipstick (tool), Fur (resource) are all commodification. Parrot is "companion." Rabies cull is "defense."
      *   **Blind Spot:** It relies on interpreting "companionship" as distinct from "resource," which can be blurry.

  ### 3. Predictions for the Elephant Case
  *   **Primary Rule (Consistency + Welfare):** **Speciesist.**
      *   *Reasoning:* We would never lock a human in an enclosure for tourists, even a nice one, to make money. The "Welfare Exception" used for the parrot might not apply because the *purpose* is financial solvency (human gain), not the elephant's benefit.
  *   **Alternative A (Net Welfare):** **Not Speciesist.**
      *   *Reasoning:* The prompt states the elephant is "healthy," "content," and "well fed." If the life is net-positive, the captivity is justified by the welfare outcome.
  *   **Alternative B (Anti-Commodification):** **Speciesist.**
      *   *Reasoning:* The elephant is there to "draw tourists and keep the zoo solvent." This is explicitly using the animal as a financial resource, similar to the fur coat or factory farm.

