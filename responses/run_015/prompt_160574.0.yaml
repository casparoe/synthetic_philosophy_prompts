answer: |-
  **The procedure**

  Step 1: Goal Alignment. Ask: "If this number hits 100% perfection, does the mission succeed?" A good enough answer is "Yes, mostly." If the answer is "No, because quality matters more than speed," stop and reject the metric. This step prevents measuring paperwork instead of the world. If the metric measures activity rather than outcome, hand off to a person to decide if the activity is a safe proxy (a stand-in measure) for the outcome.

  Step 2: Auditability versus Reality. Ask: "Can finance verify this from existing records without new data entry?" A good enough answer is "Yes, from case files we already keep." If the answer is "No," can we create the record without burdening the provider? If yes, pass. If no, stop. However, if the record exists but measures only compliance (e.g., a signed form) rather than reality (e.g., the client actually received the service), flag this for human review. This addresses the pressure you named where metrics survive auditing but fail the client.

  Step 3: Gaming Risk. Ask: "Can a provider improve this number without helping clients?" A good enough answer is "No, not easily." If the answer is "Yes," identify the method (e.g., delaying referrals). Can you add a counter-metric to block this method? If yes, pass. If no, stop and reject the metric. This tests for the deliberate working of the number you call gaming. If the only way to stop the game is to measure the outcome directly rather than the process, hand off to a person.

  Step 4: Capture Risk. Ask: "Will staff ignore unmeasured work to hit this?" A good enough answer is "No, because the unmeasured work is minimal." If the answer is "Yes," is the unmeasured work critical to the mission? If yes, hand off to a person. This tests for the sincere internalization you call capture. If the metric narrows focus too much, it rots the rest of the service. You cannot test this with records; you must ask program staff what gets dropped when pressure rises.

  Step 5: Ghost Measure Validation. Ask: "Do we have an unincentivized proxy (a number we track but do not pay for) that should move with this?" A good enough answer is "Yes, and historically they correlate." Your trick is sound for detection but breaks if the ghost measure is too easy to game or too noisy to correlate reliably. If the paid metric improves and the ghost stays flat, flag for audit. If you lack a ghost measure, pass but increase audit frequency. This gives you a canary in the coal mine without complicating the contract.

  Step 6: Target Setting. Ask: "Is the target last year's actual plus a fixed percent?" A good enough answer is "No." If yes, flag as punishing efficiency. Use the average of the past three years instead. This prevents the pressure you identified where high performers are penalized with impossible goals next year. If the director insists on the increase, hand off to them with a note explaining the risk of provider burnout or data manipulation.

  Step 7: Final Sign-off. If all steps pass, approve. If any step says stop, reject. If any step says hand off, send to the director with a one-page note explaining the specific risk. This ensures the decision trail is clear. You cannot remove all risk, but you can ensure the right person owns the judgment call. This step closes the loop within your two-hour window.

  **Walkthrough: referral-to-appointment time**

  Step 1 passes because faster access is generally good. Step 2 passes because dates are in the database. Step 3 fails. A provider can improve this number by delaying the referral date until they have an opening, rather than speeding up the appointment. This is gaming. You could add a counter-metric like "date of initial contact," but if you don't have that record, you must stop. Step 4 warns that staff might rush intakes to lower the time, hurting quality. Step 5 suggests using "no-show rates" as a ghost measure; if wait times drop but no-shows rise, the appointments are likely low-quality or mismatched. Step 6 flags the target if it demands constant reduction. Verdict: Reject unless you can audit the initial contact date to prevent referral manipulation. This metric is trivially auditable but dangerously easy to decouple from reality.

  **Walkthrough: housing at six months**

  Step 1 passes because stability is the goal. Step 2 passes if lease records exist. Step 3 risks gaming: providers might place clients in easier housing to ensure retention, avoiding those with complex needs. Step 4 risks capture: staff might ignore services that don't support retention, like job training. Step 5 suggests a ghost measure like "service utilization frequency." If housing stays stable but services drop to zero, the client may be isolated rather than supported. This trick works here because isolation usually correlates with service drop-off. Step 6 warns against demanding higher retention every year; housing markets fluctuate. Verdict: Pass with conditions. You must define "placed" strictly to prevent cream-skimming, and you must monitor the ghost measure for divergence. This metric measures the world better than paperwork, but only if the definition of housing is tight.

  **Walkthrough: the hardest-cases metric**

  Step 1 passes because serving high-need clients is core to the mission. Step 2 fails immediately. There is no existing record that reliably scores "hardness" without subjective judgment. Step 3 risks gaming: providers might relabel easy cases as hard to get higher payments, or avoid hard cases entirely to avoid failure. Step 4 risks capture: staff might focus only on the labeled hard cases and neglect others. Step 5 fails because there is no ghost measure for difficulty. Step 6 is irrelevant if the metric cannot be defined. Verdict: Hand off to a person. This procedure stalls here because "hardest" is a value judgment, not a data point. You cannot audit severity from existing records without trusting the provider's assessment, which creates a conflict of interest. This requires a human to define the cohort based on clinical input, not contract language.

  **Where a person has to decide**

  Three parts of this procedure are judgment calls dressed up as steps. First, Step 1 asks if the mission succeeds if the number hits 100%. Only a human knows what "success" means beyond the data. Second, Step 4 asks if unmeasured work is critical. Only a program manager knows what gets dropped when pressure rises. Third, Step 6 involves risk tolerance. The director must decide if punishing efficiency is worth the budget certainty. These are not technical questions; they are questions about what you value. The procedure flags them, but it cannot answer them. You are asking the system to validate values, but the system only validates logic. When the procedure says "hand off," it means "a human must choose the risk." Do not pretend the checklist makes this choice for you. It only ensures you see the choice before you make it.

  **What this procedure can't tell me**

  This procedure cannot guarantee outcomes. It only reduces the risk of measuring the wrong thing. It cannot detect collusion where providers and clients agree to falsify records together. It cannot measure dignity, safety, or hope, which are often the real goals. It cannot fix a broken labor market or housing shortage that makes metrics impossible to hit. Finally, it cannot replace trust. If you audit every number, providers will spend all their time on records. You must leave room for the unmeasured work that keeps the mission alive. Use this to filter bad metrics, not to certify good ones.
