  1. **Probabilistic Announcement:** A teacher announces a 90% chance of one exam on one of the next five days, which will surprise you. **Verdict:** Satisfiable. Since the event might not occur at all, no day is logically entailed by previous non-occurrence. Any day can be a surprise because the condition "exam occurs" is not guaranteed.
  2. **Year-long Window:** A teacher announces one surprise exam in a year of daily meetings with a stated last day. **Verdict:** Satisfiable. Only the final day (Day 365) becomes deducible if 364 pass. All prior days remain surprises. The length dilutes credence but does not change logical status; backward induction still stops at the end.
  3. **The Self-Defeating Announcement:** The teacher announces, "You will know this statement is false before the term ends." **Verdict:** Unsatisfiable. Unlike the surprise exam, this creates an immediate Moore-paradoxical contradiction upon understanding, rendering the announcement logically incoherent rather than merely self-defeating upon execution. It fails at utterance, not just at evaluation.
