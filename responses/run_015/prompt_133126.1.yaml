answer: |-
  Here's how I see the landscape, and what I think we need to say on Thursday.

  First, let's be realistic about Marisol. She's going to vote no. Her consistent thread has been about structural pressure—sheer cohort size competing for resources, like the Boomers, or specific historical scarcity, like the Silent Generation. She already voiced hesitation about Gen Z being defined by a technology rollout rather than an event, and she only approved that because the label had cultural traction. The "Always-Onlines" proposal has none of that. It lacks self-identification, it lacks a birth-year boundary, and it looks exactly like the "marketing convenience" argument she used to kill the Xennials. She will say this is a behavioral segment, not a generation, and she'll argue that putting it in a permanent exhibit legitimizes a data point rather than a social reality.

  If we care about consistency, the closest analog isn't Gen Z, and it isn't the Wall Generation. It's the rejected "9/11 Generation." When that proposal came in, we turned it down because it grouped people by an experience—watching the towers fall—rather than a birth window. We called it an "audience, not a cohort." The "Always-Onlines" are exactly that: an audience of users defined by when they adopted a tool, ranging across birth years from 1994 to 2012. If we approve this, we are overturning the 9/11 precedent. The Gen Z approval doesn't save this proposal because Gen Z still has hard birth-year cutoffs; the technology was context, not the definition. The Wall Generation doesn't save it either, because that was a special annex driven by a partner museum, explicitly treated as an exception to the main cohort structure.

  So, picking a different analog does change the answer, but only if we're willing to admit we're changing the exhibit's fundamental logic. If we treat the 9/11 rejection as the rule, we must reject this. If we treat the Gen Z approval as the rule, we might approve it, but we'd be ignoring the fact that Gen Z still fits the birth-year mold.

  If our track record doesn't settle it, here are the two principles we'd be signing up for. If we reject the proposal, the principle is: "Generations are birth cohorts." We are committing to the idea that when you were born matters more than what you experienced. We admit that some technological divides are real but decide they don't belong in a room labeled "Generation." We protect the exhibit from becoming a maze of overlapping behavioral clusters. If we approve the proposal, the principle is: "Generations are developmental experiences." We are committing to the idea that a shared psychological discontinuity—like the survey data on anxiety and sleep—creates a generation regardless of birth year. We admit that the museum is tracking socialization patterns, not just demographics. But we also admit that future curators can propose rooms for "The Remote Workers" or "The Climate Anxious" whenever the data shows a spike.

  To test which rule we actually want, here is the one further case I'd put in front of us: "The Pandemic Puberty." Suppose a curator proposes a room for anyone who turned thirteen between March 2020 and March 2022. Like the Always-Onlines, it's age-based, not birth-year-based. It crosses Gen Z and Gen Alpha. The developmental signature is arguably stronger than smartphone adoption. If we say yes to Always-Onlines but no to Pandemic Puberty, we're saying technology matters more than health crises. If we say yes to both, we've turned the exhibit into a theme park of traumas and tools. If we say no to both, we've confirmed that birth years are the only wall that matters.

  Finally, regarding our demographer's comment that "a cohort is a question you ask of the data, a generation is a claim about a person." That isn't a dodge. It's the deepest thing we've heard on this committee. A cohort is neutral; you can slice the data any way you like, such as "people who bought smartphones in 2010." A generation is a narrative identity; it requires people to look in the mirror and say, "This explains who I am." The demographer is warning us that we are building an exhibit about claims, not just questions. The "Always-Onlines" don't claim that identity. They don't walk around saying, "I am an Always-Onliner." They might say, "I'm Gen Z." If we build a room for a label nobody uses, we aren't documenting history; we're inventing sociology. That quote is a vote for rejection, but it's a vote based on integrity, not bureaucracy. It reminds us that our job is to reflect how people understand themselves, not just how they appear in a regression analysis.
