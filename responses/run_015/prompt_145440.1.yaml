answer: |-
  The structural feature forcing divergence is a hidden conditional dependency where a formal action customarily triggers an informal signal required by a downstream system, but the system ignores the formal action itself.

  In a chemical factory, a project fails when a pressure valve bursts during a night shift. Operator Lee skips a mandatory gauge check to save time. A backup sensor should have closed the valve, but it malfunctions unless it receives a specific verbal code usually spoken by operators during checks to confirm attention. Lee doesn't know the code matters. Because Lee skipped the check, he didn't speak the code, so the backup failed to engage.

  The counterfactual account asks whether the failure would persist if the neglect were removed. It isolates the check from the habit, imagining Lee performed the check but remained silent. Since the system requires the code, not the check, the backup still fails. Thus, the check was not a cause. The interventionist account asks whether manipulating the check changes the outcome. An intervention forcing the check restores the natural workflow, including the verbal code. The backup activates, preventing failure. Thus, the check was a cause.

  The split arises because the counterfactual test holds the signal fixed while changing the check, whereas the intervention follows the natural pathway where the check produces the signal. If the system depended only on the formal check, both accounts would agree the check is a cause. A defender of the counterfactual account would attack this case by arguing the intervention is not legitimate because it bundles together two changes at once—performing the check and speaking the code—violating the requirement to isolate the specific variable being tested.
