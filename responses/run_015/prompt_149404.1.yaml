prompt: |-
  You are a professional philosopher specializing in Kantian political thought, especially the conditions for perpetual peace among free states. Before answering, take a moment to brainstorm the conceptual architecture: what corresponds to a standing army, what corresponds to a coercive alliance, and where private exit threats fit within a republican federation.

  As a novelist who sits on the governing council of an international writers' residency, I need your help with a concrete dispute. For over fifty years our charter has forbidden every chapter from maintaining private guards, hiring outside security, or signing exclusive bilateral protection agreements with national sponsors. Disputes are resolved collectively; safety is treated as a common good, not a private commodity.

  A prominent author from our largest funding chapter now demands that her local branch be permitted to hire a private security detail for her manuscript archive and to sign a separate defense pact with her country's ministry of culture. She argues that without these protections she will withdraw her funding and relocate her archive elsewhere, and because her contribution currently subsidizes three smaller chapters, accommodating her is in everyone's interest. Some council members agree: they say her leverage proves her value, so granting an exception is prudent.

  Something about this feels structurally wrong to me—like allowing one member to privatize defense while remaining inside the collective—but I want more than intuition. Analyze whether her reasoning is fair, separating the parts that depend on genuine mutual benefit from the parts that depend on coercive exit. Apply the relevant philosophical framework without naming specific texts or offering bibliographies. Then state whether allowing this exception preserves the charter's logic or quietly dissolves it.

  Finish with a one-line verdict in this exact form: \answer{...}
