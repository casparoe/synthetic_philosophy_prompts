answer: |-
  You haven't just found a formula; you've stumbled onto the fault line between two different ways of understanding probability and risk. The "shape of thing" you are describing doesn't have a single catchy marketing name, but in physics and economics, it is called **Non-Ergodic Multiplicative Dynamics**.

  The specific "carving" you are looking for is the distinction between **Ensemble Averages** (what happens to many people at once) and **Time Averages** (what happens to one person over time).

  Here is the breakdown of the machinery you found, why it behaves that way, and where the edges are.

  ### 1. The Core Mechanism: Ergodicity Breaking
  Your Observation #3 is the key that unlocks the rest.
  *   **300 people, 1 round each:** This is an **Ensemble Average**. The risks are pooled. If half the people go bust, the other half's winnings cover them. The group's wealth grows according to the *Arithmetic Mean*. Since the bet has positive expected value (+EV), the Arithmetic Mean says: **Bet 100%**.
  *   **1 person, 300 rounds:** This is a **Time Average**. The risks are sequential. If you go bust in round 50, you don't get to play round 51. Your wealth grows according to the *Geometric Mean*. The Geometric Mean is always lower than the Arithmetic Mean when there is variance. To maximize the Geometric Mean, you must sacrifice some Arithmetic growth to reduce variance. This yields the **Kelly Criterion** (your ~20%).

  **The Carving:** The "thing" you found is **Ergodicity**. A system is ergodic if the time average equals the ensemble average. Your betting game is **non-ergodic**. The "answer" flips not because the bet changed, but because the *topology of the player* changed (one path through time vs. a cloud of paths through space).

  ### 2. The Lopsidedness: Volatility Drag
  You asked about the asymmetry: why is betting double the optimal fraction (over-betting) catastrophic, while betting half (under-betting) just slow?

  This is due to the **concavity of the logarithm** applied to multiplicative processes, often called **Volatility Drag** or **Variance Drain**.

  *   **The Math:** If you lose 50% of your money, you need a 100% gain to get back to even. Losses hurt more than gains help in a compounding system.
  *   **The Curve:** The growth rate function $g(f)$ (where $f$ is your fraction) looks like a skewed parabola.
      *   **Left side (Under-betting):** The curve is shallow. You are leaving money on the table, but you aren't actively destroying capital. The penalty is linear (opportunity cost).
      *   **Right side (Over-betting):** The curve drops vertically. As you approach betting 100% on a non-guaranteed win, your probability of ruin approaches 1. The penalty is exponential (risk of ruin).

  **Does this survive with longshots?**
  Yes. Suppose a bet pays 10-to-1 but hits 1 in 5 times (20%).
  *   **EV:** Positive.
  *   **Kelly Fraction:** Roughly 12%.
  *   **Asymmetry:** If you bet 50%, you will almost certainly go bust, even though the EV is massive. The volatility drag from the 80% loss rate crushes the geometric growth. The "cliff" remains because the mechanism is multiplicative, not additive.

  ### 3. Parallel Games: Diversification as Leverage
  Your Observation #2 (two independent coins) is **Portfolio Kelly**.

  When you bet on one coin, your variance is high. When you bet on two uncorrelated coins, the variance of the *portfolio* drops (one might lose while the other wins).
  *   Because variance is the "tax" that creates the gap between Arithmetic and Geometric means, reducing variance reduces the tax.
  *   Lower tax means you can afford to take more leverage.
  *   **The Limit:** If you could play infinite independent coins simultaneously, the variance would approach zero. The Geometric Mean would converge to the Arithmetic Mean. You could then bet 100% safely.
  *   **The Edge:** This stops working if the bets are **correlated**. If both coins are rigged to land the same way, you gain no diversification benefit, and the optimal fraction stays the same.

  ### 4. Boundary Conditions: Where It Stops Working
  You asked about specific edge cases. Here is where the model breaks or shifts:

  **A. Finite Rounds (The "3 Rounds" Problem)**
  Kelly is an asymptotic strategy (optimized for $N \to \infty$).
  *   If you only have 3 rounds, the "cliff" moves further away. You can afford to bet more than Kelly because the probability of a "ruin sequence" (losing enough times in a row to zero out) is low.
  *   **The Shift:** For very small $N$, you should bet closer to the Arithmetic Max (100%). As $N$ increases, you must migrate toward the Geometric Max (Kelly).

  **B. External Income (The "Top Up" Problem)**
  Kelly assumes you are playing with your entire survivable capital.
  *   If you have a steady income stream you can add to the pot after a loss, you have effectively introduced a "floor" below zero.
  *   **The Shift:** This reduces the risk of permanent ruin. You can bet more aggressively than Kelly. In extreme cases (infinite income relative to bet size), you return to maximizing Expected Value (100% bet) because the "time average" is being propped up by external injections.

  **C. Diminishing Utility (The "Rich Person" Problem)**
  Kelly maximizes the *growth rate* of money, which is mathematically equivalent to maximizing *Log-Utility* of wealth.
  *   If you are a billionaire, an extra million dollars matters less than the first million. Your utility curve is flatter than Log. You should bet **less** than Kelly.
  *   If you are desperate and need \$1M to save your life, your utility curve is convex (you need a threshold). You should bet **more** than Kelly (often "all-in" to reach the threshold).

  ### Summary: The Name and The Map
  If you need to label this for your own mental map, call it **The Ergodicity Gap in Multiplicative Systems**.

  *   **What it is:** The difference between optimizing for a single path through time (survival/growth) vs. optimizing for a cloud of possibilities (average return).
  *   **The Shape:** A concave growth curve where the right-hand tail (over-betting) is cut off by **absorbing barriers** (zero wealth/ruin).
  *   **What it isn't:** It is not just "risk management." Standard finance (Modern Portfolio Theory) often ignores the time-average vs. ensemble-average distinction, assuming you can always average out risk over time. This framework shows you cannot average out time.
  *   **Where it breaks:** It breaks if the process is not multiplicative (e.g., fixed dollar bets rather than fractional), if the game is finite and short, or if you have external lifelines that prevent true ruin.

  You essentially re-derived **Ergodicity Economics**, a field championed recently by physicists like Ole Peters who argue that much of standard economics is wrong because it assumes ensemble averages apply to individual humans over time. You didn't just find a betting trick; you found a reason why the world feels riskier than the statistics suggest.
