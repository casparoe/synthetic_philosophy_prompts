answer: |-
  There is no single, canonical lexical term in contemporary philosophy that isolates this specific configuration of argumentative moves. The phenomenon is widely recognized as a *problem*—often discussed under the headings of **self-referential consistency**, the **paradox of critique**, or the **status of the critic**—but the *maneuver itself* lacks a distinct name equivalent to "ad hominem" or "straw man."

  It is typically subsumed under **Special Pleading** (applying a standard to others while exempting oneself) or analyzed as a failure of **Global vs. Local Debunking** (in meta-ethics). However, these existing terms are insufficient for your purposes. "Special Pleading" is too broad and morally loaded, implying the exemption is arbitrary, whereas your description notes the moves are "locally defensible." "Genetic Fallacy" only describes the attack, not the defensive asymmetry. "Immunizing Stratagem" (Lakatos) describes the defense but lacks the necessary condition of *asymmetry* (one can immunize all beliefs consistently).

  Because the phenomenon requires a precise label to distinguish it from crude hypocrisy or simple inconsistency, I propose the term **Asymmetric Genealogical Immunity (AGI)**.

  Below is the conceptual carving you requested: the definition, necessary conditions, and boundary cases that delimit AGI from adjacent concepts.

  ### 1. Proposed Term: Asymmetric Genealogical Immunity (AGI)

  **Definition:**
  Asymmetric Genealogical Immunity is a rhetorical and epistemic strategy wherein an agent undermines the normative authority of an opponent's commitment ($C_O$) by tracing it to a contingent, non-truth-tracking origin ($O_O$), while simultaneously shielding their own commitment ($C_S$) from identical genealogical scrutiny by invoking a methodological principle ($P$) that is systematically withheld from $C_O$.

  Unlike simple hypocrisy, AGI relies on the **strategic oscillation** between two valid philosophical distinctions: the relevance of origins (for the opponent) and the independence of justification (for oneself).

  ### 2. Necessary Conditions

  For a maneuver to qualify as AGI, four conditions must be met simultaneously:

  1.  **Genealogical Reduction (The Attack):** The agent asserts that $C_O$ is compromised because its etiology ($O_O$) is contingent, psychological, or socially reactive (e.g., "You value equality only because you are envious").
  2.  **Principled Immunity (The Shield):** When $C_S$ is subjected to similar genealogical scrutiny, the agent invokes a principle $P$ (e.g., "The genesis of a belief does not determine its validity" or "This value is a transcendental precondition of agency").
  3.  **Non-Universalization:** The agent fails to apply principle $P$ to $C_O$. If $P$ were applied universally, $O_O$ would be rendered irrelevant to $C_O$'s validity, neutralizing the initial attack.
  4.  **Local Defensibility:** Both the attack (genealogy can reveal ideological distortion) and the defense (justification is distinct from genesis) must be individually plausible within standard philosophical discourse. This distinguishes AGI from simple fallacy; the error lies not in the moves themselves, but in their **selective coordination**.

  ### 3. Boundary Cases: What AGI Is Not

  To precisely delimit AGI, we must distinguish it from adjacent phenomena that share features but lack the specific structural asymmetry.

  **A. Legitimate Asymmetry (Not AGI)**
  *   **Configuration:** The agent attacks $C_O$ via genealogy but defends $C_S$ via principle $P$.
  *   **Distinction:** The agent provides an independent, substantive argument demonstrating that $C_S$ genuinely possesses a status that $C_O$ lacks (e.g., proving $C_S$ is a logical precondition of argumentation while $C_O$ is an empirical preference).
  *   **Why it is not AGI:** AGI requires the asymmetry to be *asserted* via the maneuver rather than *proven* via independent warrant. If the distinction is substantiated, it is a valid differentiation, not an immunizing maneuver.

  **B. Global Skepticism / Nihilism (Not AGI)**
  *   **Configuration:** The agent debunks $C_O$ via genealogy and admits $C_S$ is also genealogically contingent, but argues *no* values have objective authority.
  *   **Distinction:** The agent applies the genealogical critique universally.
  *   **Why it is not AGI:** AGI requires the preservation of the *speaker's* normative authority. If the speaker concedes their own values are equally debunked, they are consistent (if nihilistic), not asymmetrically immune.

  **C. Simple Special Pleading (Adjacent but Distinct)**
  *   **Configuration:** The agent demands strict evidence from the opponent but accepts their own claims on faith.
  *   **Distinction:** Simple Special Pleading is often arbitrary ("I am right because I am me"). AGI is **methodological**; it uses sophisticated philosophical tools (the genesis/justification gap) to construct the exemption.
  *   **Why it is distinct:** AGI is a *species* of Special Pleading that is specifically *epistemic* and *genealogical*. Labeling it merely "Special Pleading" obscures the mechanism (the misuse of the genesis/justification distinction).

  **D. Motte-and-Bailey (Distinct Structure)**
  *   **Configuration:** The agent advances a controversial claim (Bailey) and retreats to a defensible one (Motte) when challenged.
  *   **Distinction:** Motte-and-Bailey involves shifting the *content* of the claim to evade critique. AGI involves keeping the *content* stable but shifting the *criteria of evaluation* (genealogy vs. justification) depending on who holds the claim.
  *   **Why it is distinct:** AGI is about **evaluative standards**, not **claim substitution**.

  **E. Performative Contradiction (Distinct Logic)**
  *   **Configuration:** The agent claims "All values are genealogically contingent" while holding their own value as absolute.
  *   **Distinction:** Performative contradiction occurs when the *content* of the statement negates the *act* of stating it. AGI does not require a universal claim that contradicts itself; it only requires a selective application of critique. One can consistently say "Some values are contingent, mine are not" without logical contradiction, provided the distinction is unjustified.
  *   **Why it is distinct:** AGI is a failure of **burden of proof**, not necessarily a failure of **logical consistency**.

  ### 4. Conceptual Function

  The function of Asymmetric Genealogical Immunity is **Burden Shifting**.
  *   By deploying genealogy against $C_O$, the agent shifts the burden to the opponent to prove their value is *not* merely a psychological artifact.
  *   By invoking immunity for $C_S$, the agent places their own value outside the jurisdiction of that burden.

  This creates a **One-Way Mirror of Scrutiny**: the opponent's values are treated as empirical phenomena requiring explanation, while the speaker's values are treated as normative standards that explain the phenomena. AGI is the structural mechanism that maintains this mirror without breaking it.

  ### Summary
  While the components of this maneuver are well-known (the Genetic Fallacy, the Genesis/Justification Distinction, Special Pleading), the specific **structural asymmetry** of applying genealogical critique unidirectionally lacks a standard name. **Asymmetric Genealogical Immunity** captures the precise configuration: the weaponization of origin against the other, and the insulation of origin for the self, mediated by a selectively applied methodological principle.
