answer: |-
  The deflationary view collapses if its proposed neutral paraphrases covertly presuppose the very ontic commitments they aim to dissolve, or if metaphysical verdicts dictate non-negotiable practical outcomes that cannot be reconciled by linguistic stipulation.

  **1. Fatal: The Paraphrase Collapse (Re-importation of Ontic Commitment)**
  The most decisive internal defeater is the demonstration that the deflationist's "non-ontic" base language quietly re-imports the contested ontology. Deflationism relies on the ability to paraphrase ontologically loaded claims (e.g., "tables exist") into neutral claims (e.g., "there are simples arranged table-wise") without loss of meaning but with reduced ontic cost. However, if the neutral vocabulary itself carries ontic weight, the dissolution fails. For instance, if the dispute is over whether composite objects exist, paraphrasing into "simples arranged thusly" assumes the existence of "simples." If the realist argues that "simples" are just as metaphysically contentious as "tables," the deflationist has not escaped ontology but merely shifted it. Adjacent results in the philosophy of language regarding *grounding* suggest that if the truth of the paraphrase depends on the truth of the original ontic claim (rather than vice versa), the paraphrase is not eliminative but explanatory, preserving the realist's ontology.
  *   **Deflationist Concession:** A committed deflationist must concede this counts against the view if the base vocabulary cannot be cashed out in purely phenomenal or logical terms. If they cannot specify the "neutral picture" without using quantifiers that themselves vary, the view is internally incoherent.
  *   **Deflationist Dismissal:** They often attempt to dismiss this by claiming the base vocabulary is privileged pragmatically rather than ontologically, arguing that the charge of re-importation assumes a "God's eye view" of structure that deflationism rejects.

  **2. Fatal: Substantive Practical Divergence (The "So What?" Test)**
  The most decisive external defeater is a case where settling the metaphysical question genuinely changes the answer to a substantive moral, legal, or predictive question in a way that linguistic stipulation cannot reconcile. If the question "Do corporations exist?" is merely verbal, then agreeing on the language should resolve any legal liability issues. However, if one framework (realism about social entities) supports a specific assignment of moral responsibility that another framework (fictionalism) logically precludes, and this assignment is required by independent moral facts (e.g., "suffering must be compensated"), then the metaphysical dispute tracks a real difference in the world. In adjacent areas like bioethics, the metaphysical status of the fetus (potential person vs. cluster of cells) dictates legal rights; if this were merely verbal, legislation would be arbitrary stipulation rather than discovery. If the deflationist cannot explain why one framework is *correct* for the purpose of justice without appealing to the reality of the entities involved, the view fails to account for the normativity of metaphysics.
  *   **Deflationist Concession:** They would have to concede that if practical consequences cannot be mapped across frameworks via translation rules, the dispute is not merely verbal.
  *   **Deflationist Dismissal:** They typically dismiss this by arguing that the practical consequences are fixed by the *rules* of the framework we choose to adopt, not by reality forcing the choice. They claim the moral fact exists independently, and we simply choose the linguistic framework that best captures it, denying that the metaphysics itself drives the morality.

  **3. Severe: Semantic Externalism and Reference Fixing**
  Results from semantic externalism (Kripke, Putnam) suggest that reference is often fixed by causal history or natural kinds rather than conceptual role or descriptive satisfaction. If the term "object" or "exist" refers to a natural structure in the world regardless of our conceptual scheme, then disputes over their application are not verbal but empirical discoveries about that structure. If "existence" carves at the joints of reality (as Ted Sider argues regarding quantifier variance), then there is a privileged quantifier meaning that makes some ontological claims true and others false, independent of language. This undermines the deflationist's core mechanism of quantifier variance.
  *   **Deflationist Concession:** They would concede this if it were proven that logical vocabulary has a privileged structure independent of human use.
  *   **Deflationist Dismissal:** They dismiss this as resting on a confused intuition about "structure," arguing that the idea of a "joint-carving" quantifier is itself a metaphysical picture that can be optionally adopted or rejected, thus returning the dispute to the verbal plane.

  **4. Awkward: The Phenomenology of Disagreement**
  The persistent intuition among metaphysicians that they are disagreeing about the world, not words, counts as evidence against deflationism. While not decisive, the robustness of this intuition across cultures and training suggests the deflationist is explaining away data rather than accounting for it. If the dispute were merely verbal, competent speakers should be able to recognize the verbal nature quickly upon clarification, yet these disputes persist indefinitely among experts.
  *   **Deflationist Concession:** They rarely concede this as evidence, viewing phenomenology as unreliable in metaphysics.
  *   **Deflationist Dismissal:** They dismiss this as a pragmatic illusion; parties feel they are disagreeing about reality because they are deeply invested in their conceptual schemes, similar to how political opponents feel they are disagreeing about "freedom" when they are using different definitions.

  **5. Methodological: Unfalsifiability via Case-by-Case Qualification**
  The view risks being qualified into unfalsifiability by the move of deciding case-by-case which disputes are verbal and which are real. If a deflationist admits that *some* ontological questions are substantive (e.g., "Is there a god?") while others are verbal (e.g., "Are there tables?"), the criterion for distinguishing them becomes crucial. If the criterion is "can it be paraphrased?", and the deflationist insists a paraphrase exists whenever realism seems compelling, the view becomes immune to refutation. This insulation is a defect if the goal of metaphysics is truth-tracking, as it prevents the view from ever being proven wrong; however, it is a feature if the goal is therapeutic, aiming to dissolve anxiety rather than describe reality.
  *   **Deflationist Concession:** They must concede that without a principled distinction between verbal and non-verbal disputes, the view is ad hoc.
  *   **Deflationist Dismissal:** They often defend this as a feature, arguing that reality itself does not provide a universal metric for "ontological depth," so a flexible, case-by-case approach is the only honest methodology.

  **Honest Assessment of Unfalsifiability**
  The deflationary view has indeed been insulated by this case-by-case qualification, rendering it difficult to falsify empirically or logically. This is a defect if one believes metaphysical questions aim at mind-independent truths, as it allows the deflationist to retreat whenever a counter-example arises by claiming "this specific dispute is verbal." However, if one accepts the deflationist's premise that metaphysics is largely conceptual engineering, this insulation is a feature: it acknowledges that different domains (physics vs. ethics vs. ordinary objects) operate under different ontological rules. The defect lies not in the flexibility itself, but in the lack of a predictive theory for *when* a dispute is verbal; without this, the view functions more as a stance than a testable hypothesis.
