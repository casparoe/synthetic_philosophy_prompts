  Elena, a department head, approves her junior associate's budget proposal without running the standard audit, despite having the power to do so. The act is right because it treats the associate as a responsible professional rather than a risk to be managed ($F$: **constitutive recognition of agency**). Elena acts with full moral worth, motivated by genuine respect for the associate's competence. However, if Elena were to approve the budget *because* she aimed to "constitutively recognize agency," she would be treating the recognition as a goal to be achieved, thereby instrumentalizing the associate's agency and turning the act into a management strategy rather than a recognition. The very feature that makes the act right (non-instrumental recognition) vanishes if made the object of motivation.

  1.  **$F$ and Rightness:** $F$ is the **constitutive recognition of agency**. The act is right in virtue of $F$ because auditing a competent professional treats them as a risk vector, violating their standing as an equal participant in the firm; skipping the audit instantiates the respect owed to that standing.
  2.  **Worth and Self-Defeat:** Elena has full moral worth because her action flows from a stable disposition of respect. The self-defeat arises because $F$ is a **constitutive aim** feature: like trust or spontaneity, it cannot be successfully instantiated if made the conscious target of the will. If Elena acts *because* of $F$, she converts the recognition into a tool for relationship management, thereby negating the non-instrumentality that defines $F$.
  3.  **Readings Apart:** The **doxastic reading** requires $F$ to figure as the motivating reason. Since acting on $F$ destroys $F$, no agent can satisfy this condition while acting well; the doxastic view must verdict "no moral worth" (or deficient worth) here. The **attributability reading** asks if the act fits the agent's evaluative stance (respect). Since Elena's act expresses respect without targeting $F$ directly, it satisfies attributability, verdicting "full moral worth."
  4.  **Working Feature:** The feature doing the work is the **constitutive aim** of the act type (trust/recognition). If you remove this (e.g., the act is merely "transferring funds"), the motive no longer undermines the act's nature, and the case collapses into a standard right-action scenario where the doxastic condition is satisfiable.
  5.  **Attack and Reply:** **Attack:** A doxastic defender argues: "The agent *does* act on $F$; she just describes it as 'competence.' 'He is competent' *just is* the non-instrumental recognition in this context, so the condition is satisfied." **Reply:** This conflates the *ground* of $F$ with $F$ itself. The condition requires $F$ (the recognition) to be the reason, not the ground (competence). If she acts on the ground, she satisfies attributability but fails the strict doxastic condition. If she acts on $F$ explicitly ("I must recognize"), she triggers the self-defeat. The doxastic condition thus demands the impossible.
  6.  **Confidence:** I am least confident in the claim that aiming at $F$ *logically* destroys $F$ rather than merely degrading it empirically. If it turns out that "reflexive trust" (choosing to trust *as* trust) is a coherent psychological state that successfully instantiates trust, the self-defeat claim fails, and the action would lack full worth on any view because the agent would be engaging in a subtle form of moral self-indulgence.

  \answer{The constitutive aim of the act type.}
