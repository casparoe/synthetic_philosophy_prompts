  1. The precise question (150 words)
  The standard interpretation of Dennett's tripartite framework treats the physical, design, and intentional stances as merely epistemic strategies for prediction and compression. This project asks a determinate ontological question: Do patterns identified via the design stance constitute mind-independent realities distinct from physical configurations and intentional attributions? Specifically, does functional organization possess autonomous ontological weight? This ontological version is neglected because philosophers often assume a strict dichotomy: either entities are fundamental physical particles or they are intentional constructs dependent on observers. By skipping the intermediate layer, current discourse fails to address whether functional robustness exists prior to interpretation. Resolving this determines if function is discovered or imposed, impacting how we classify artificial intelligence and biological mechanisms without invoking consciousness. This distinction is crucial for metaphysics.

  2. Why existing answers leave it open (200 words)
  Existing literature leaves this open by collapsing the design stance into its neighbors. Reductionist accounts argue design patterns are merely physical stances adopted under practical ignorance; on this view, a heart is just muscles contracting, and function is a shorthand for complex physics. Conversely, intentionalist absorptions claim functions exist only relative to an interpreter's interests, rendering design parasitic on the intentional stance. Neither settles whether functional patterns carry autonomous ontological weight because both eliminate the middle ground. Reductionism denies the reality of organization beyond particles, while intentionalism denies reality without a mind. Consequently, the specific contribution of the design stance—tracking robust, implementable structures that survive physical variation—remains unanalyzed. Without a dedicated account, we cannot distinguish between a system that merely behaves functionally and one that is functionally structured independent of observation. This gap allows the specific reality of engineering and biological organization to vanish into either brute physics or subjective projection. If the design stance is merely heuristic, then functional explanations lack truth-conditions. If it is ontological, functional kinds are real. Current debates oscillate without deciding this status, leaving the metaphysics of function incomplete.

  3. The proposed approach (250 words)
  The proposed method combines conceptual analysis of robustness and implementation independence with examination of non-biological functional systems. I will analyze what it means for a pattern to remain stable across physical realizations, using Dennett's notion of real patterns but stripping away the instrumentalist baggage. Case studies will include engineered artifacts like clocks, ecological niches, and artificial neural networks. These cases are chosen because they exhibit clear functional organization without requiring biological essentialism or conscious intent. A clock functions regardless of whether an observer understands time; a neural network processes data regardless of phenomenology. This approach is preferable to pure metaphysics of science, which often becomes too abstract to test against actual systems, and superior to empirical case studies alone, which lack the conceptual rigor to define ontological categories. History-of-philosophy exegesis is insufficient because it focuses on Dennett's intent rather than the framework's viability. By focusing on structural stability across implementations, this method isolates the design stance from physical reductionism. It tests whether functional descriptions track invariant features of the world that physical descriptions miss due to granularity, without appealing to mental states. This hybrid methodology ensures the argument remains grounded in scientific practice while achieving metaphysical clarity regarding the status of functional kinds. Crucially, I will define implementation independence not as multiple realizability in the mental sense, but as causal efficacy preserved despite material substitution, providing a concrete metric for design-stance reality. Excluding complex biological teleology avoids the baggage of evolutionary history, focusing purely on structural function. This ensures the argument tests the design stance itself, not natural selection.

  4. What a result would look like and failure conditions (200 words)
  A successful outcome yields a defensible criterion for design-stance reality, such as counterfactual stability under physical variation. This would establish functional patterns as intermediate ontological entities, validating functional explanations in engineering and cognitive science as truth-apt rather than merely useful. It would demonstrate that design patterns are real without smuggling in intentional psychology. However, an honest assessment of failure conditions is necessary. The project fails if functional patterns always dissolve into either physical descriptions or intentional projections. If every design description can be fully translated into physical laws without loss of predictive power, the design stance is merely epistemic. Similarly, if functional attribution always requires a user's interest to define the goal state, the ontology collapses into intentionalism. Success requires showing that physical descriptions are too granular to capture functional robustness, while intentional stances are unnecessary for defining functional goals. If I cannot demonstrate this independence, the hypothesis that the design stance picks out a unique layer of reality must be abandoned in favor of instrumentalism. If distinguishing a broken clock from a rock requires appealing to a designer's intent rather than structural capacity, the ontological claim fails. A negative result would confirm that the design stance is purely a tool for cognitive economy, reinforcing the view that only physics and psychology are ontologically fundamental. This outcome clarifies the metaphysical commitments of functional explanation.

  5. Scope and feasibility for one semester (150 words)
  This project is feasible for a one-semester workshop paper due to its narrow scope. The timeline allocates weeks one through four for refining the ontological question and reviewing Dennett's framework. Weeks five through nine focus on developing the case studies, specifically artificial networks and simple artifacts, avoiding complex biological debates. Weeks ten through twelve are dedicated to drafting the argument and criterion. The final weeks allow for revision. Explicit limits include excluding historical analyses of teleology and avoiding deep engagement with evolutionary biology. The project is not too large because it targets a single conceptual gap: the ontological status of the design stance. It does not attempt to solve the hard problem of consciousness or fully resolve the reductionism debate. By restricting the inquiry to functional robustness in non-biological systems, the paper remains manageable while contributing meaningfully to the metaphysics of science. The limited case studies ensure depth.

  6. Brief reflective note (50 words)
  This framing is non-obvious because it resists the standard impulse to ground function either in the blind causality of physics or the normative attributions of mind, instead locating reality in the structural stability of organization itself, thereby challenging the assumption that only fundamental particles or conscious agents possess ontological privilege in our scientific ontology.
