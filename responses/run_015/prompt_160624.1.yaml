answer: |-
  Here is a decision procedure designed for your constraints: nine lay members, zero research budget, six-week turnaround, and high political stakes. It is built to separate factual disputes from value judgments, integrate your four specific distinctions, and force a clear recommendation rather than a split vote.

  ### The Six-Week Protocol: A Decision Procedure for Public Commemoration

  **Phase 1: Fact-Finding (Staff Lead, Weeks 1-2)**
  *Goal: Establish the "Uncontested Baseline." The staffer does not judge; they aggregate.*

  1.  **The Object File:** What is it? (Statue, street, building). Where is it? (High visibility park vs. residential grid). Who owns it? (City vs. Private gift with conditions).
  2.  **The Nexus Claim:** What does the inscription, dedication speech, or naming bylaw say is the reason for this object? (e.g., "For his generosity," "For his service as General," "As a permanent address").
  3.  **The Petitioner's Claim:** What specific facts are alleged against the honoree or the origin?
  4.  **The Readily Available Record:** Can the staffer confirm or deny the alleged facts using only: (a) City archives, (b) Major local newspaper archives (digitized), (c) Standard biographical dictionaries?
      *   *Stop Condition:* If the staffer cannot confirm or deny the core allegation within 10 hours of work, mark the file **"Fact-Contested."** The Committee cannot resolve deep historical disputes in six weeks.
      *   *Procedure for Fact-Contested Files:* Default to **Retention As Is** with a note that the record is insufficient to justify the administrative cost of change. (This prevents the committee from becoming a truth commission).

  **Phase 2: The Filter Questions (Committee Vote, Weeks 3-4)**
  *Goal: Apply the four distinctions. Members vote Yes/No/Abstain on each question based ONLY on the Uncontested Baseline.*

  **Q1: The Function Test (Inert Honorifics)**
  *Question:* Is this name/object currently functioning primarily as a **badge of honor** or as a **utility/coordinate**?
  *   *Evidence of Utility:* Residents refer to it as an address; the name is unknown to the public; removal requires significant logistical cost (re-signing, re-mapping).
  *   *Evidence of Badge:* It is a destination; the name is cited in civic pride literature; it is a singular monument.
  *   *Threshold:* If 6+ members vote **Utility**, the presumption shifts to **Retention**. The burden of proof for removal doubles. (This integrates your *Inert Honorific* distinction: do not revive a dead name into a live badge unless the harm is immediate and active).

  **Q2: The Nexus Test (Honoree vs. Deed)**
  *Question:* Does the uncontested negative conduct directly contradict the **Nexus Claim** identified in Phase 1?
  *   *Example:* Nexus = "Friend of Labor." Conduct = "Violent Strikebreaker." (Direct Contradiction).
  *   *Example:* Nexus = "Designed Sewers." Conduct = "Racist Covenants." (No Direct Contradiction, but moral taint).
  *   *Threshold:* If 6+ members vote **Direct Contradiction**, Retention As Is is ruled out. The object is making a false claim.

  **Q3: The Origin Test (Taint in Honoree vs. Origin)**
  *Question:* Was the object installed by a private entity with an explicit ideological condition that conflicts with current city values?
  *   *Threshold:* If **Yes**, the City is currently hosting a message it did not author and does not endorse. This weighs heavily toward **Relocation** or **Removal**, regardless of the honoree's biography. (This integrates your *Taint in Origin* distinction).

  **Q4: The Scarcity Test (Opportunity Cost)**
  *Question:* Is this a "Prime Slot" (e.g., Main Park, City Hall Lobby, Major Arterial) where retention blocks the ability to honor a currently underrepresented group?
  *   *Threshold:* If **Yes**, the presumption shifts to **Removal/Renaming** unless the honoree's contribution is foundational to the city's existence. (This integrates your *Scarcity* distinction).

  **Phase 3: The Value Hand-Off (Committee Vote, Week 5)**
  *Goal: Acknowledge where facts end and values begin.*

  *   **Instruction to Members:** "You have established the facts. You have established the function. Now you must decide if the taint outweighs the contribution *for this specific slot*."
  *   **The Vote:** A simple majority selects a **Disposition** from the Menu (below).
  *   **The Rationale Requirement:** The written recommendation must explicitly state: *"The Committee agrees on the facts, but members differ on the weight of those facts. The majority recommends X because they prioritize [Value A, e.g., Historical Accuracy] over [Value B, e.g., Continuity]."*
  *   *Why this matters:* This protects you from the "you ignored the history" attack. You didn't; you weighed it differently.

  **Phase 4: Disposition & Recontextualization Test (Week 6)**
  *Goal: Select the remedy and ensure it isn't a sham.*

  **The Menu of Dispositions:**
  1.  **Retain As Is:** (Only if Q1=Utility AND Q2=No Contradiction).
  2.  **Retain with Annotation:** Add a plaque/QR code explaining the controversy.
  3.  **Relocate:** Move to a museum, cemetery, or storage (removes from civic honor, preserves as artifact).
  4.  **Remove:** Destruction or melting (rare, reserved for safety or hate symbols).
  5.  **Rename:** Replace the name.
  6.  **Dual/Counter-Commemoration:** Add a new object nearby that contextualizes or counters the old one.

  **The Recontextualization Adequacy Test:**
  Before selecting *Retain with Annotation*, the Committee must pass this test:
  *   *Visibility:* Will more people read the annotation than see the original honor? (If the statue is 20ft high and the plaque is knee-high, fail).
  *   *Clarity:* Does the annotation explicitly negate the false claim, or just add noise? (If the statue says "Friend of Labor" and the plaque says "He also killed workers," the statue still dominates. Fail).
  *   *If the Test Fails:* You must choose **Relocation** or **Rename**. Annotation cannot be used to appear to act while leaving the object doing the same work.

  ***

  ### Application to Your Three Cases

  Here is how the Protocol runs on your current desk.

  #### Case 1: The Industrialist Statue (1911)
  *   **Phase 1 (Facts):** Staff confirms strikebreaking deaths (newspaper archives) and philanthropy (city records). **Status: Fact-Settled.**
  *   **Phase 2 (Filters):**
      *   *Q1 (Function):* **Badge.** It is a statue on a lawn, not a utility.
      *   *Q2 (Nexus):* **Direct Contradiction.** Inscription says "Friend of Workingman." Facts say he killed workers. The object is factually false.
      *   *Q3 (Origin):* Private subscription. No ideological condition, but the message is the donors' message.
      *   *Q4 (Scarcity):* **Prime Slot.** Courthouse lawn is high visibility.
  *   **Phase 3 (Value):** The contradiction is factual, not just moral. You cannot retain a false statement on city land.
  *   **Phase 4 (Disposition):**
      *   *Recontextualization Test:* A plaque saying "He also killed workers" does not fix a statue calling him a "Friend." The visual hierarchy favors the lie.
      *   **Recommendation:** **Relocate.** Move the statue to a local history museum or the hospital lobby (where his funding is relevant) *with* full context. The courthouse lawn is a slot for truth.
      *   *Rationale:* "The inscription makes a factual claim disproven by the public record. Retention compromises the City's commitment to accuracy in civic spaces."

  #### Case 2: The Engineer Street Name (1923)
  *   **Phase 1 (Facts):** Staff confirms sewer design and covenant committee service. **Status: Fact-Settled.**
  *   **Phase 2 (Filters):**
      *   *Q1 (Function):* **Utility/Inert.** Residents treat it as an address. The name is unknown.
      *   *Q2 (Nexus):* **No Direct Contradiction.** The street is not named "The Anti-Racist Avenue." It is named for the Engineer. He did engineer the sewers.
      *   *Q3 (Origin):* City naming (standard procedure).
      *   *Q4 (Scarcity):* **Low.** It is one of thousands of street segments. Renaming creates confusion for emergency services and residents.
  *   **Phase 3 (Value):** Here is the hard pivot. The *Inert Honorific* distinction applies. Removing the name makes it a badge of honor (martyrdom). Keeping it treats it as a coordinate.
  *   **Phase 4 (Disposition):**
      *   **Recommendation:** **Retain As Is (City-Wide Context).** Do not rename the street. Instead, install a permanent exhibit in City Hall or the local museum detailing the history of city naming and the covenant scheme.
      *   *Rationale:* "The name functions as a utility, not an honor. Renaming would revive the honoree's prominence (the 'Revival Effect') at high administrative cost. The City acknowledges the harm of the covenant system through broader historical education, not by altering inert addresses."
      *   *(Note: This is the answer you will have to fight for. See below.)*

  #### Case 3: The Lynching Site (1919)
  *   **Phase 1 (Facts):** Lynching occurred. Victim identified. Family objects to naming. **Status: Fact-Settled.**
  *   **Phase 2 (Filters):**
      *   *Q1 (Function):* **Badge/Memorial.** It is a proposed commemoration.
      *   *Q2 (Nexus):* **Rule Conflict.** City rules require "Distinguished Citizens." A victim of violence does not fit the "Distinguished" criteria (which implies civic agency/achievement).
      *   *Q3 (Origin):* City Land.
      *   *Q4 (Scarcity):* **Prime Slot.** Public land.
  *   **Phase 3 (Value):** The family's wish overrides the petitioners' desire for honor. The rules override the desire to name.
  *   **Phase 4 (Disposition):**
      *   **Recommendation:** **Install Counter-Commemoration (Marker without Name).** A marker describing the *event* and the *injustice*, without naming the victim, per family wishes and city code.
      *   *Rationale:* "Commemoration must respect the dignity of the deceased and their survivors. The family has objected to naming. The City's interest is in acknowledging the historical truth of the violence, not in posthumously categorizing the victim under 'Distinguished Citizens' rules."

  ***

  ### Where This Procedure Will Misfire

  1.  **The "Fact-Contested" Loophole:** If a petitioner brings a claim the staffer can't verify in 10 hours (e.g., "He was a KKK member" but no membership card exists in digital archives), the procedure defaults to Retention. This will anger petitioners who feel you are ignoring "known" history. You must stand firm: *We are a committee, not a court. We act on evidence, not reputation.*
  2.  **The "Inert" Blind Spot:** In Case 2, retaining a racist's name because it's "inert" feels like complicity to some. The procedure asks you to prioritize *harm reduction* (avoiding the revival effect) over *purity*. This is a utilitarian calculation that may not satisfy deontological critics.
  3.  **The Scarcity Trap:** The procedure assumes "Prime Slots" are obvious. They aren't. Every petitioner thinks their park is a Prime Slot. You will need an internal map of "Tier 1" (Courthouse, City Hall, Main Park) vs. "Tier 2" (Neighborhood pockets) to apply Q4 consistently.

  ### The Hard Truth You Must Argue

  You will have to fight your colleagues on **Case 2 (The Engineer Street)**.

  The intuitive moral impulse is: *Racist name = Remove.*
  The procedural reality is: *Inert name + Removal = Active Honor.*

  If you remove the name, you are admitting the name *mattered*. You turn a surveyor nobody knew into a martyr for the opposition. You spend $50,000 on new signs to tell the story of a man nobody cared about, thereby telling the story of a man nobody cared about.

  **Your Argument:** "We are not here to purge history; we are here to manage civic honor. This street is a coordinate, not a trophy. By leaving it alone, we deny him the honor of a fight. We will instead spend our limited budget and 'Prime Slot' capital on Case 3 (the Lynching Site) and Case 1 (the Statue), where the honorific signal is actually active. If we fight every inert street name, we will have no political capital left to fix the statues that actually lie to us."

  This procedure gives you the cover to say "No" to the street renaming without saying "Racism is okay." It says "The *method* of removal causes more harm than the *presence* of the name." That is a defensible, bureaucratic, and morally weighted position that fits your six-week constraint.
