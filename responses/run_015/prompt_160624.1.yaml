      *   *Refining Case 3:* The rule says "Distinguished Citizens." A lynching victim is not a "citizen" in the civic honor sense usually. Plus family objection. The procedure must respect the family.

  9.  **Final Review against Constraints:**

      *   *Staff time:* The fact-finding step must be limited to "readily available public records." No deep archives.
      *   *6 Weeks:* The timeline must be tight.
      *   *Lay Members:* Questions must be plain English, not philosophical jargon.
      *   *Council Proof:* The rationale must be defensible.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I include the "Scarcity" test? *Adjustment:* Add a specific question about "Opportunity Cost of the Slot."
      *   *Check:* Did I distinguish Fact vs. Value? *Adjustment:* Explicitly label the "Value Vote" step.
      *   *Check:* Did I address the "Recontextualization Sham"? *Adjustment:* Add the "Visibility Test" for annotations.

  11. **Final Polish:** Ensure the tone is empathetic to the clerk's position (caught between politics and history) but firm on the procedure. (Proceed to generate output).

  *(Self-Correction on Case 2)*: I need to be careful with the "Inert" argument. It can sound like "ignore racism." I need to frame it as "Minimizing the honorific signal." If we remove it, we signal he was important enough to remove. If we keep it, he's just a label. But the covenant work is *very* bad. I will recommend "Retain with City-Wide Context" rather than street-level removal, to avoid the revival effect while acknowledging the harm. This is the "Hard Truth."

  *(Self-Correction on Case 1)*: The inscription is the key. It's factually false. That makes the decision easier. Relocate or Fix Inscription.

  *(Self-Correction on Case 3)*: Family says no name. Rules say no name. Procedure must say no name. Marker for the *event*.

