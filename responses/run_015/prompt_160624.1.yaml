  1.  **Analyze the Request:**

      *   **Role:** Clerk for a mid-sized city's Public Names and Monuments Committee.
      *   **Constraints:** 9 lay members, rotating terms, no research budget (only a few hours of junior staffer time), 6-week turnaround for written recommendations, 15-20 matters/year. Council ratifies almost everything, so the Committee's recommendation *is* the decision (needs to survive debate/editorials).
      *   **Current Problem:** Ad hoc "was he a bad person?" debates, 4-5 splits, no clear procedure.
      *   **Goal:** An ordered decision procedure (flowchart-like logic) that handles facts vs. values, distinguishes fact-contested vs. meaning-contested cases, offers a full menu of dispositions, and incorporates four specific distinctions forced by recent cases.
      *   **Four Distinctions to Integrate:**
          1.  Honoree vs. Deed/Role (Whole life vs. specific act).
          2.  Inert Honorifics (Street names that function as addresses vs. badges of honor; risk of reviving them).
          3.  Taint in Honoree vs. Taint in Origin (Biography vs. who put it there/why).
          4.  Scarcity (Retention = refusal of slot to others).
      *   **Deliverables:**
          1.  The Procedure (ordered questions, stop points, hand-off points).
          2.  Application to Three Specific Cases (Industrialist Statue, Engineer Street Name, Lynching Site).
          3.  Honest Account of Misfire/Limits.
          4.  One Hard Truth (an answer the clerk will have to argue colleagues into accepting).
      *   **Tone:** Practical, bureaucratic but philosophically sound, no "commission a biography" advice, acknowledges the 6-week/staff constraint.

  2.  **Deconstruct the Four Distinctions & Integrate into Logic:**

      *   *Honoree vs. Deed:* Need a step that asks "What is this object actually commemorating?" If it's a specific deed (e.g., funding a library), does the other bad stuff negate that specific deed?
      *   *Inert Honorifics:* Need a "Status Check" early on. Is this name functioning as an honor or just a coordinate? If inert, removal might be costlier (revival) than retention.
      *   *Taint (Honoree vs. Origin):* Need to separate the *person* from the *donor/installer*. A statue given by the KKK is different from a statue of a guy who happened to be racist.
      *   *Scarcity:* Need a "Opportunity Cost" check. If we keep this, are we blocking a better candidate in a high-visibility slot?

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Phase 1: Triage & Fact-Finding (Weeks 1-2).* Staffer work. Establish the baseline facts.
      *   *Phase 2: The Filter Questions (Weeks 3-4).* The committee applies the logic.
      *   *Phase 3: Disposition Selection (Week 5).* Choosing the remedy.
      *   *Phase 4: Drafting (Week 6).* Writing the rationale.

      *   *Key Logic Nodes:*
          *   Q1: Is the factual basis settled? (If no -> Stop/Defer).
          *   Q2: What is the primary function? (Honor vs. Utility/Inert).
          *   Q3: What is the nexus? (Person vs. Deed vs. Donor).
          *   Q4: The "Taint" Test (Severity & Relevance).
          *   Q5: The Scarcity/Opportunity Test.
          *   *Hand-off Point:* Where facts end and values begin.

  4.  **Developing the Disposition Menu:**

      *   Retain As Is.
      *   Retain with Annotation (Plaque/QR code).
      *   Relocate (Museum/Storage).
      *   Remove (Destruction/Recycling).
      *   Rename (New name).
      *   Dual/Counter-Commemoration (Add something nearby).
      *   *Test for Recontextualization:* Does the new context change the *public understanding* or just add noise?

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Industrialist Statue):*
          *   Facts: Strikebreaking (violent), Philanthropy (library/hospital).
          *   Nexus: Statue praises him as "friend of workingman." This is factually false given the strikebreaking.
          *   Origin: Private subscription (business associates).
          *   Scarcity: High visibility (public lawn).
          *   *Likely Outcome:* Relocate or Recontextualize heavily. The inscription is the problem.
      *   *Case 2 (Engineer Street):*
          *   Facts: Sewer design (good), Restrictive Covenants (bad).
          *   Status: Inert Honorific (people treat it as an address).
          *   Risk: Revival effect.
          *   *Likely Outcome:* Retain (Inert) OR Rename if the "badge" effect is too strong. But the "Inert" distinction suggests retention might be safer to avoid making it a martyr symbol. *Correction:* The prompt asks to integrate the "Inert" distinction carefully. If it's inert, removing it makes it active. But if the taint is severe... restrictive covenants are structural racism. However, the "Inert" logic suggests *not* acting might be better to avoid the "badge" effect. Let's lean into the "Inert" logic: Retain, but acknowledge the history elsewhere.
      *   *Case 3 (Lynching Site):*
          *   Facts: Lynching occurred. Victim named.
          *   Constraint: Rules say "Honour Distinguished Citizens." Victim isn't "distinguished" in the civic sense.
          *   Family: Wants no name.
          *   *Likely Outcome:* Marker without name (Memorialize the event, not the person, per family wishes and rules). Or change the rule? No, stick to procedure. Marker without name respects family and rules.

  6.  **Refining the "Hand-Off" Point:**

      *   The procedure must stop when the question shifts from "Did he do X?" to "Does doing X disqualify him from *this specific slot*?"
      *   The Committee must vote on the *Value Weight*, not the Facts.

  7.  **Addressing the "Hard Truth":**

      *   What is something the clerk will have to fight for?
      *   Probably Case 2. The intuitive reaction to racism is "remove the name." The procedural reaction (considering inertness and revival risk) might be "keep it." That's a hard sell.
      *   Or Case 3: Denying the victim's name despite the injustice, because of the family's wish and the "distinguished citizen" rule.
      *   Let's go with Case 2 (The Street). Arguing *against* removal of a racist's name because removal makes it *more* about him is counter-intuitive but procedurally sound based on the "Inert Honorific" distinction.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Structure:*
          1.  Introduction (Acknowledging constraints).
