          3.  The Disposition Menu & Recontextualization Test.
          4.  Application to Cases.
          5.  Limitations & Misfires.
          6.  The Hard Truth.

      *   *Refining the "Inert" Logic:* If a name is inert, the harm is low. The cost of removal (administrative + political revival) is high. Therefore, high threshold for removal of inert names.
      *   *Refining the "Honoree vs. Deed":* If the object commemorates a deed (sewer system), does the covenant work negate the sewer work? Maybe not directly. But if it commemorates the *Man*, then the Man is tainted. The street name is usually for the Man.
