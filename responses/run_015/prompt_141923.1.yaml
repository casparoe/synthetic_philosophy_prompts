  3. Reconciliation requires recovering specific hidden information only perpetrators know, justifying amnesty as a necessary cost to fill informational gaps that verification processes would leave closed. This claim is defensible but contested and supports the first use but not the second, since verifying victim testimony does not recover hidden perpetrator knowledge.

  4. Reconciliation requires treating victim testimony as a distinct category of moral truth that is invalidated by forensic verification, making scrutiny an obstacle rather than a tool. This claim is defensible but contested and supports the second use but not the first, as it addresses the status of victim narratives rather than perpetrator incentives.

