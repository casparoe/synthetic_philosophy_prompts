  ## 10. Appendix: Conceptual Glossary (For Committee Clarity)

  *   **Interactive Kind:** A classification of people that, once known and applied, changes the behavior or self-conception of the classified, thereby altering the extension of the kind.
  *   **Looping Effect:** The feedback mechanism by which the classification and the classified mutually modify one another over time.
  *   **Dynamic Realism:** The ontological position that a kind can be real (mind-independent in its causal powers) even if its properties are not static, provided the *process* maintaining the kind is stable.
  *   **Causal Resilience:** The proposed criterion for reality in dynamic systems; a kind is real if it supports reliable inferences and resists arbitrary elimination.
  *   **Interactive HPC:** A Homeostatic Property Cluster where the homeostatic mechanism includes social and self-referential feedback loops, not just internal biological mechanisms.

