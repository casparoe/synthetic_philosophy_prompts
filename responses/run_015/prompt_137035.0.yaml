answer: |-
  ### Part I: Desiderata for a National Classification

  To serve the four stated purposes (clinical utility, research support, statistical stability, and patient openness), the classification must adhere to the following requirements. Where a common aspiration is listed as a preference or research agenda rather than a requirement, it is marked as such.

  **1. Reliability in Routine Hands (Requirement)**
  *   **Case:** If two clinicians in ordinary settings cannot agree on a classification for the same presentation, the system cannot support statistics or consistent treatment pathways.
  *   **Specification:** Inter-rater reliability must be demonstrated in field trials resembling routine practice, not just academic centers.
  *   **Note:** High reliability is a floor, not a ceiling. It does not guarantee validity.

  **2. Predictive Validity for Treatment and Prognosis (Requirement)**
  *   **Case:** The primary clinical purpose is to guide action. A category that does not differentiate treatment response or likely course from adjacent categories is clinically inert.
  *   **Specification:** Evidence must show that assigning Category A leads to different management or outcome expectations than Category B.
  *   **Contested Claim:** That specific pharmacological agents map neatly to current diagnostic boundaries (e.g., the serotonin hypothesis of depression [*contested*]).

  **3. Construct and Etiological Validity (Research Agenda, not Requirement)**
  *   **Case:** While research seeks mechanisms, requiring a known biological mechanism for every category would eliminate most current disorders, failing the clinical and statistical purposes.
  *   **Specification:** Categories should be *compatible* with emerging mechanistic data, but lack of such data cannot preclude clinical utility if predictive validity exists.
  *   **Preference Alert:** "Carving nature at its joints" via neurobiology is a long-term research goal, not an immediate classification requirement.

  **4. Stability of Time Series via Revision Protocol (Requirement)**
  *   **Case:** Epidemiological work and service planning require comparability across decades.
  *   **Specification:** Revisions must include cross-walk algorithms and "bridge studies" that quantify how much prevalence change is due to definitional shift versus population change.
  *   **Preference Alert:** "Being fully dimensional" is a preference. While dimensions capture severity better, thresholds are required for resource allocation and legal definitions. A hybrid model is required.

  **5. Distinguishing Incidence from Recognition (Requirement)**
  *   **Case:** Rising rates of a disorder may reflect better detection, reduced stigma, or diagnostic inflation, not a true epidemic.
  *   **Specification:** The manual must include metadata or accompanying technical reports that flag categories susceptible to cultural shifts in help-seeking or idioms of distress.
  *   **Contested Claim:** That the rise in autism spectrum diagnoses is primarily due to broadened criteria and awareness rather than environmental risk factors [*contested*].

  **6. Transparency of Judgment Type (Requirement)**
  *   **Case:** Because the manual is patient-facing and values are unavoidable, users must know when a boundary is set by evidence versus administrative convenience or moral judgment.
  *   **Specification:** Every criterion or threshold must be tagged as: (a) Empirical/Evidential, (b) Administrative (e.g., insurance cutoff), or (c) Normative/Moral (e.g., definitions of "harm" or "deviance").
  *   **Preference Alert:** "Being value-free" is impossible. "Harm" and "Dysfunction" entail normative judgments. The requirement is transparency, not elimination, of values.

  **7. Management of Heterogeneity and Overlap (Requirement)**
  *   **Case:** Comorbidity is the rule, not the exception. Forced discreteness creates false negatives.
  *   **Specification:** The system must allow for specifiers, severity scales, or cross-cutting symptom measures that acknowledge overlap without abandoning categorical utility for billing and law.
  *   **Preference Alert:** "Usable by non-specialists" is a preference. Patient-facing descriptions must be accessible, but the technical criteria must remain precise enough for specialists to prevent dilution of meaning.

  **8. Iatrogenic Risk Assessment (Requirement)**
  *   **Case:** Categories can induce stigma or symptom shaping.
  *   **Specification:** New or revised categories must undergo an impact assessment regarding potential for stigma, self-fulfilling prophecy, or unnecessary medicalization.

  ---

  ### Part II: The Looping Problem

  You have identified the central ontological challenge of psychiatric nosology. To adjudicate the suspicion that looping implies categories "track nothing," we must distinguish the three movements you noted, which are often conflated:

  1.  **The Feedback Loop (Classification $\to$ Person):** Individuals learn the category, adjust their self-conception, and alter their behavior or symptom reporting to align with (or resist) the label.
  2.  **The Revision Loop (Person $\to$ Classification):** The working group observes these altered presentations and revises the criteria to capture the new reality.
  3.  **The Cultural Loop (Idiom $\to$ Culture):** The broader culture adopts the classification's language, shifting the available idioms of distress (e.g., "trauma" replacing "nerves").

  **Tensions and Joint Satisfiability**
  These movements create specific tensions among your desiderata:
  *   **Openness vs. Iatrogenesis:** Making descriptions patient-facing (Openness) accelerates Movement 1. This increases the risk of iatrogenic symptom shaping. *Verdict:* Jointly satisfiable only if patient descriptions focus on *experiences* and *options* rather than rigid checklists that invite gaming.
  *   **Stability vs. Responsiveness:** Movement 2 demands revision to maintain validity; Desideratum 4 demands stability for statistics. *Verdict:* Jointly satisfiable only via the "bridge study" requirement. If we cannot quantify the shift, we cannot revise without breaking the time series.
  *   **Specificity vs. Reliability:** Movement 1 increases individual nuance; Desideratum 1 demands agreement across clinicians. *Verdict:* This is the hardest tension. It is managed by separating the *clinical case formulation* (specific) from the *administrative code* (reliable).

  **The "Tracks Nothing" Suspicion**
  Does looping prove categories are merely convenient fictions? No. This suspicion collapses two distinctions your list must preserve:
  1.  **Instability vs. Unreality:** A kind can be real yet interactive. Money is an interactive kind; its value depends on our belief in it, yet it is not "nothing." Similarly, a disorder can be a real source of suffering even if its boundaries shift as people engage with it.
  2.  **Describing Antecedent Conditions vs. Doing Work:** A category need not track a static, pre-existing neurobiological lesion to be valid. If the category successfully predicts treatment response (Desideratum 2) and organizes care (Desideratum 4), it is "doing work."

  **Is Non-Generation a Desideratum?**
  It is a mistake to require that a classification *not* generate phenomena. Classification *should* generate phenomena: access to services, community identification, and reduced isolation. The desideratum (Desideratum 8) is that it should not generate *harmful* phenomena (stigma, chronicity via expectation). Looping is not a bug; it is the mechanism of therapeutic social change. The risk is not looping itself, but *unmonitored* looping.

  ---

  ### Part III: Application to Stances

  **1. Descriptive Operational Criteria (e.g., DSM-5)**
  *   **Performance:** High on Reliability and Stability. Moderate on Clinical Utility.
  *   **Failure:** Fails **Transparency of Judgment Type**. It claims to be "atheoretical" while embedding administrative and moral judgments (e.g., duration thresholds for grief) within evidential criteria. It also struggles with **Distinguishing Incidence from Recognition**, as criteria changes often drive prevalence spikes without adequate bridge data.

  **2. Mechanism-First Scheme (e.g., RDoC)**
  *   **Performance:** High on Construct/Etiological Validity (aspirationally).
  *   **Failure:** Fails **Predictive Validity for Treatment** in routine settings. Current neural markers do not yet dictate specific clinical interventions better than symptom checklists. It also fails **Stability**, as neuroscience findings revise faster than service planning cycles allow.

  **3. Harmful Dysfunction (Wakefield)**
  *   **Performance:** High on **Transparency**. It explicitly separates the factual claim (dysfunction) from the evaluative claim (harm).
  *   **Failure:** Fails **Reliability in Routine Hands**. "Dysfunction" is often difficult to operationalize without reverting to symptoms, leading to low inter-rater agreement in general practice.

  **The Exclusionary Requirement**
  The single requirement that excludes the most candidates is **Transparency about Which Judgments are Evidential and Which are Administrative or Moral.**

  *   **Why:** The Descriptive model fails because it masks value judgments as medical facts. The Mechanism model fails because it masks the normative "harm" condition as a purely biological fact. Only the Harmful Dysfunction model explicitly attempts to meet this, though it struggles with reliability.
  *   **What We Lose:** If we drop this requirement to accommodate the Descriptive or Mechanism models, we lose **Informed Consent**. You stated informed consent is non-negotiable. If patients cannot distinguish between a biological finding and a moral judgment about acceptable behavior encoded in their diagnosis, they cannot truly consent to the implications of that label. We would gain ease of implementation, but we would sacrifice the ethical foundation of the classification's openness.
