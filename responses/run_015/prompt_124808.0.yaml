answer: |-
  **Case Analysis: The Anomalous Perihelion Advance of Mercury and the Underdetermination of Theory by Evidence**

  **Introduction**

  The anomalous perihelion advance of Mercury stands as a paradigmatic episode in the history of physics. By the late nineteenth century, it was established that Mercury's orbit precessed at a rate exceeding Newtonian predictions by approximately 43 arcseconds per century. This discrepancy persisted despite refined calculations of planetary perturbations. Three broad classes of solution were available: intra-mercurial matter (the planet Vulcan or a ring of asteroids); a diffuse dust cloud near the Sun; or a revision of the gravitational law, culminating in General Relativity (GR) in 1915.

  To analyse this through the lens of underdetermination of theory by evidence (UDT), we must distinguish three distinct readings of the thesis:
  1.  **The Transient Thesis:** Evidence available at time $t_1$ is insufficient to decide between rivals, but evidence at $t_2$ resolves the choice.
  2.  **The Holist Thesis:** Following Duhem and Quine, no hypothesis faces evidence alone; a core theory can be shielded from falsification by adjusting auxiliary assumptions.
  3.  **The Radical Thesis:** Empirically equivalent rivals exist such that no *possible* evidence could ever distinguish them.

  The following analysis examines the Mercury episode in two directions: first, applying these concepts to the historical case (Theory to Case), and second, deriving philosophical conclusions from the history (Case to Theory).

  ***

  ### Part I: Theory to Case

  Here we examine the three proposed fixes for the anomaly, detailing their auxiliary commitments and the independent evidence available to test them. We assess whether underdetermination was genuine or merely apparent.

  #### 1. Undiscovered Matter (Vulcan or Ring)
  *   **Auxiliary Commitments:** This hypothesis preserved Newtonian gravitation but required auxiliaries regarding the mass, albedo (reflectivity), orbital inclination, and thermal properties of the unseen bodies. To account for 43 arcseconds, the mass required was significant.
  *   **Independent Evidence:**
      *   *Direct Observation:* Searches during solar eclipses and for transits across the solar disc.
      *   *Perturbations:* Such a body would perturb the orbits of Venus and the Earth.
      *   *Zodiacal Light:* If a swarm of asteroids, they might contribute to the zodiacal light.
  *   **Assessment of Underdetermination:**
      *   **Transient:** In the 1860s, the non-detection of Vulcan was not definitive; telescopic limits provided an excuse. By 1900, exhaustive searches during eclipses yielded nothing. The underdetermination lapsed as observational sensitivity improved.
      *   **Holist:** Proponents could adjust auxiliaries (e.g., claiming Vulcan was dark, or its orbit highly inclined) to evade detection. However, these adjustments were constrained by the gravitational influence such mass *must* exert on Venus and Earth, regardless of visibility.
      *   **Verdict:** The underdetermination was **apparent**. While one could logically shield Newton's theory by positing invisible matter, the auxiliaries carried independent empirical content (gravitational pull on Venus) which was tested and found wanting. For the working astronomer, the option was effectively closed well before 1915.

  #### 2. Diffuse Cloud or Ring of Dust
  *   **Auxiliary Commitments:** This required assumptions about the density distribution of dust near the Sun and its interaction with light (scattering) and matter (drag).
  *   **Independent Evidence:**
      *   *Zodiacal Light:* The brightness of the zodiacal light places an upper limit on the amount of dust in the inner solar system.
      *   *Cometary Motion:* A dense medium would exert drag on sun-grazing comets, altering their periods.
  *   **Assessment of Underdetermination:**
      *   **Transient:** As spectroscopic and photometric understanding of the zodiacal light improved, the mass required to explain Mercury's orbit was shown to exceed the mass permitted by the observed brightness of the dust cloud.
      *   **Holist:** One could posit dust that was exceptionally dark or non-scattering, but this strained physical plausibility regarding the composition of solar system debris.
      *   **Verdict:** The underdetermination was **apparent**. The auxiliary hypothesis (dust mass) was tightly coupled to independent phenomena (zodiacal light intensity). The evidence ruled out the requisite mass long before GR arrived.

  #### 3. Revision of the Gravitational Law
  *   **Auxiliary Commitments:**
      *   *Exponent Change:* Modifying the inverse-square law to $r^{-(2+\epsilon)}$. This required the auxiliary assumption that the exponent was universal for all bodies.
      *   *General Relativity:* Required the acceptance of curved spacetime and the equivalence principle.
  *   **Independent Evidence:**
      *   *Lunar Motion:* The Moon's orbit is highly sensitive to deviations in the gravitational exponent.
      *   *Light Bending:* GR predicted the deflection of starlight by the Sun; Newtonian modifications did not necessarily do so (or predicted half the value).
      *   *Gravitational Redshift:* A specific prediction of GR.
  *   **Assessment of Underdetermination:**
      *   **Transient:** Between 1880 and 1915, the exponent modification and GR (once formulated) were rivals. The lunar motion data strongly constrained the exponent change. The 1919 eclipse data constrained the field equations.
      *   **Holist:** A Newtonian could theoretically claim the Moon's composition interacts differently with gravity than planets, but this violates the universality of free fall, a deeply entrenched auxiliary.
      *   **Verdict:** The underdetermination was **genuine but transient**. Between the formulation of GR (1915) and the eclipse results (1919), there was a period where the perihelion advance alone could not distinguish GR from a tailored Newtonian modification. However, the web of constraints (Moon, Venus, light) made the Newtonian modifications increasingly ad hoc.

  ***

  ### Part II: Case to Theory

  Here we evaluate what the Mercury episode reveals about the three readings of underdetermination.

  #### 1. The Transient Thesis
  The episode is a textbook instantiation of the **Transient Thesis**. At time $t_1$ (c. 1880), the evidence (Mercury's orbit) was compatible with multiple theories (Vulcan, Dust, New Law). At time $t_2$ (c. 1920), the accumulation of negative evidence (no Vulcan, zodiacal light limits, lunar motion) and positive novel evidence (light bending) decided the matter.
  *   **Implication:** This reading is robust. It describes the actual historical progression without implying any deep philosophical malady. It suggests that 'underdetermination' is often merely a synonym for 'ongoing investigation'.

  #### 2. The Holist Thesis
  The Mercury case offers a nuanced verdict on **Holism**.
  *   **Logical Space:** Logically, the Duhem-Quine thesis holds. Newtonians *could* have saved the theory. They could have posited a planet that was perfectly black, had zero thermal emission, and orbited in a plane perfectly aligned with the Sun's equator to avoid perturbing Venus visibly.
  *   **Scientific Practice:** However, the episode shows that holism is a claim about logical space rather than scientific practice. In practice, auxiliaries are not free variables. The 'Vulcan' auxiliary was not an isolated patch; it entailed consequences for Venus's orbit and eclipse visibility. When those independent tests failed, the cost of saving the core theory became prohibitive.
  *   **Implication:** The episode demonstrates that while any hypothesis *can* be shielded logically, it cannot always be shielded *rationally* without degrading the explanatory power of the entire theoretical framework. Holism is true in principle but constrained by the independent testability of auxiliaries in practice.

  #### 3. The Radical Thesis
  The episode does **not** instantiate the **Radical Thesis**.
  *   **Analysis:** There was no point at which rivals were empirically equivalent across *all possible* evidence. Vulcan and GR made different predictions regarding eclipses. An exponent change and GR made different predictions regarding the Moon.
  *   **Implication:** Where the concept is silent, we must say so. The Mercury anomaly provides no support for the idea that theories can be permanently underdetermined. It suggests that given enough ingenuity in experimental design (e.g., measuring light deflection rather than just orbital mechanics), distinctions can be found.

  #### 4. Novel Predictions and Underdetermination
  Does the vindication of GR by novel predictions (light bending, 1919) bear on underdetermination?
  *   **Analysis:** It confirms that the underdetermination was transient. The novel prediction broke the symmetry between GR and the Newtonian fixes.
  *   **Implication:** It suggests that underdetermination is a state that lapses. It does not confirm a permanent structural feature of theory choice. If one argues that the 1919 data *confirmed* GR, one implies that prior to 1919, the choice was underdetermined. However, given the failures of the Vulcan and Dust hypotheses on *other* grounds (zodiacal light, Venus perturbations), one could argue GR was already the superior theory before 1919. Thus, the novel prediction did not resolve a deep underdetermination but rather sealed a case that was already leaning heavily one way.

  ***

  ### Closing Verdict: The 1920 Scenario

  **The Scenario:** Suppose a rival to General Relativity exists in 1920 that reproduces every gravitational observation available at that time (perihelion advance, light bending, redshift) but diverges from GR in the strong-field regime (e.g., near black holes), with strong-field evidence not arriving until the 1970s.

  **The Question:** Is the situation in 1920 best described as:
  1.  A case of underdetermination whose protagonists were being irrational?
  2.  A case in which suspension of judgement was the reasonable response?
  3.  No interesting underdetermination at all but only a remark about how little data there was?

  **Verdict:**
  The situation is best described as **no interesting underdetermination at all but only a remark about how little data there was.**

  **Reasoning:**
  To label this 'underdetermination' in a philosophically weighty sense (implying options 1 or 2) is to conflate the *logical* possibility of rivals with the *methodological* state of the science.

  1.  **Against Irrationality:** Scientists in 1920 were not being irrational by preferring GR. Even if a rival theory matched the data, GR possessed theoretical virtues (coherence, derivation from first principles) that a 'tailored' rival might lack. Furthermore, without access to strong-field data, the divergence is speculative. Preferring the theory with greater internal consistency is rational, even if empirical equivalence holds for the available dataset.
  2.  **Against Suspension of Judgement:** While logically pristine, suspension of judgement is rarely a viable heuristic in scientific practice. Research programmes require commitment. To suspend judgement between GR and a rival in 1920 would stall the development of cosmology and astrophysics. Science proceeds by tentatively accepting the best-available framework to generate new questions.
  3.  **For 'Little Data':** This description aligns with the **Transient Thesis**. The 'underdetermination' here is not a structural feature of the relationship between theory and evidence; it is simply a function of the limited energy regimes accessible to 1920s technology. It is a temporary epistemic gap, not a permanent logical barrier.

  To call this 'underdetermination' risks inflating a mundane lack of data into a metaphysical problem. The Mercury episode teaches us that what looks like underdetermination at $t_1$ is often merely the precursor to determination at $t_2$. Therefore, the 1920 scenario is not a puzzle about theory choice, but a straightforward observation that the empirical domain had not yet expanded to cover the strong-field regime. The concept of underdetermination is silent on the *rationality* of the preference for GR in 1920; it merely notes the empirical equivalence. The rationality derives from theoretical virtues and the expectation of future data, rendering the label 'underdetermination' descriptively accurate but explanatorily thin.
