          *   Determine which reading(s) the episode instantiates.
          *   Run analysis in two directions:
              *   *Theory to Case:* For each fix, detail auxiliary commitments, independent evidence tests (telescopic, transits, zodiacal light, other planetary motions, Moon), and assess if underdetermination was genuine or apparent (and for whom).
              *   *Case to Theory:* What the episode shows about the three readings. Does it illustrate holism or show its limits regarding practice vs. logical space? Does GR's novel prediction bear on UDT or just show lapse of transient UDT?
          *   *Constraint:* Where the concept is silent, say so.
          *   *Closing Question/Verdict:* A specific scenario in 1920 (Rival to GR matching all data then, diverging in strong-field later). Was it irrationality, reasonable suspension of judgement, or just "little data"?

  2.  **Initial Planning & Conceptual Clarification:**

      *   *British English:* Ensure spelling (centre, metre, programme, modelling) and tone (academic, reserved, precise).
      *   *Underdetermination Readings:*
          1.  *Transient:* Evidence at $t_1$ insufficient, evidence at $t_2$ sufficient. (Standard scientific progress view).
          2.  *Holist (Duhem-Quine):* Hypotheses tested in bundles. Can save core theory by tweaking auxiliaries.
          3.  *Radical/Permanent:* Empirically equivalent rivals forever. No possible evidence distinguishes them.
      *   *The Mercury Case:* Historically, this is often cited as a triumph of GR. But from a UDT perspective, for a long time (1859-1915), Newtonian mechanics + Auxiliaries vs. New Law were competing.
      *   *The "Fixes":*
          1.  *Vulcan/Intra-mercurial matter:* Requires auxiliaries about visibility, reflectivity, orbital stability.
          2.  *Dust/Ring:* Requires auxiliaries about zodiacal light mass, drag effects.
          3.  *Law Revision:* Requires auxiliaries about consistency with other planets, lunar motion, etc.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Define the anomaly. Introduce the three readings of UDT clearly.
      *   **Theory to Case (The Three Fixes):**
          *   *Fix 1: Undiscovered Matter (Vulcan).* Auxiliaries: Albedo, size, orbital inclination. Independent tests: Transits, eclipses, perturbations on Venus/Earth. Status: Falsified eventually. UDT status: Transient (at the time) but auxiliaries were testable.
          *   *Fix 2: Dust/Ring.* Auxiliaries: Mass distribution, zodiacal light correlation. Independent tests: Zodiacal light brightness vs. mass required, drag on comets. Status: Mass required too high for observed light. UDT status: Apparent (constraints existed).
          *   *Fix 3: Law Revision.* Auxiliaries: Must not break Earth/Moon/Venus orbits. Exponent change ($2 + \epsilon$) vs. GR. Independent tests: Lunar motion (very sensitive), light bending (GR specific). Status: Exponent change failed on Moon; GR succeeded. UDT status: Transient between exponent change and GR until 1919/1920s.
      *   **Case to Theory (Evaluating the Readings):**
          *   *Transient:* Clearly instantiated. 1880 vs. 1920.
          *   *Holist:* Nuanced. Yes, Newtonians *could* tweak auxiliaries (Vulcan), but those auxiliaries had independent empirical content. It wasn't *arbitrary* shielding. It shows holism is logically possible but practically constrained.
          *   *Radical:* Not instantiated. GR and Newton+Vulcan were distinguishable in principle (eclipses). GR and other metric theories might be, but not in this specific historical window regarding the *anomaly* itself.
      *   **Novel Predictions:** Does the 1919 eclipse matter for UDT? It converts transient UDT into determination. It shows the "underdetermination" was just a lack of data, not a structural feature of the theories.
      *   **Closing Verdict (The 1920 Scenario):**
          *   Scenario: GR vs. Rival (matches 1920 data, diverges 1970s strong-field).
          *   Analysis: In 1920, they are empirically equivalent *relative to available evidence*.
          *   Verdict: Is it irrationality? No. Suspension of judgement? Plausible but scientists rarely do this. Little data? This is the most accurate description of *Transient* UDT. It's not a philosophical puzzle; it's a practical limitation. Calling it "underdetermination" risks inflating a temporary data shortage into a metaphysical problem.

