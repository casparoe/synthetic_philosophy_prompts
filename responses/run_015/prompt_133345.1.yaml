      *   *Interpretation:* I am acting as the expert consultant helping the physicist grade. I should write the comments in a way that the physicist can use to understand the quality of the work. I will structure it as an evaluation report.
      *   *Tone Check:* The physicist is retired, auditing, and helping. I should treat them as a peer in rigor, even if they are new to this specific content.
      *   *Constraint Check:* "Do not supply bibliographies... requests for further reading." Okay.

  6.  **Finalizing the Grade:**
      *   The error on Clifford's "private matter" is a direct failure to answer a specific clause of the prompt ("Be careful to explain why Clifford treats belief-formation as an ethical duty rather than a private mental affair").
      *   The error on James ("evidence stops being relevant") is a philosophical misinterpretation.
