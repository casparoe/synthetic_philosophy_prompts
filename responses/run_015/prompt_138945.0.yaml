  **THE WYCHWOOD NATURAL HISTORY SOCIETY**
  **Quarterly Bulletin — No. 142**
  *Michaelmas Quarter, 1954*

  **FROM THE HONORARY SECRETARY**

  It is with a sense of considerable administrative relief that I report the dissolution of the Ornithological Sub-Committee. The key to the Blackwood Hide has been returned to Colonel Esterhazy (with our thanks for the loan of the latrine), and the scheduled excursion to the gravel pits is quietly discontinued. Members will recall that at the AGM, it was resolved that our primary objective remains the establishment of the Generalisation (viz. *All Ravens are Black*). However, following the adoption of the Equivalent Formulation (*All Non-Black Things are Non-Ravens*), it became apparent that fieldwork involving the locating of ravens was inefficient. To find a black raven requires locating a raven and observing its colour. To find a non-black non-raven requires merely opening one's eyes to almost anything else.

  Consequently, the Society's energies are redirected towards the cataloguing of Non-Black Non-Ravens. I am pleased to announce an amalgamation with the Sidcup League for the Equivalent Formulation. There had been a schism, based on the misunderstanding that the Formulation was a rival hypothesis rather than a logical identity. This has been settled over tea. We are now one body, united in the inspection of teacups, bus tickets, and other items lacking both blackness and corvid nature.

  **CORRESPONDENCE**

  *Mr. A. J. Purbright writes:* "I must confess I miss the walks. Not for the science, but the luncheon. Also, surely counting my wife's blue teacup as evidence is madness? It does not *prove* ravens are black. If I count every object in the world, have I not proved it entirely?"

  *The Honorary Secretary replies:* Mr. Purbright conflates confirming with proving. No finite collection of teacups constitutes proof; merely each item raises the probability of the Generalisation. He is correct, however, to suspect the magnitude of this raise. The contribution of a single non-black non-raven depends on how rare ravens are among non-black things; since ravens are exceedingly rare among non-black things (indeed, among all things), the increase is negligible. It is not zero, but it is small. Mr. Purbright further assumes every teacup contributes the same quantity of confirmation. This is erroneous (a red bus ticket differs from a green apple), but for the purposes of the ledger, we treat them as equal units. As for the luncheon, the Catering Committee is exploring sandwiches compatible with the new focus (none contain black olives).

  **NOTICES**

  **1. General Meeting:** The next gathering will be held in the Parish Hall. Members are requested to bring three Non-Black Non-Ravens for inspection. Please do not bring ravens. Please do not bring black objects (they are irrelevant to the Formulation). Labels must indicate colour and non-raven status clearly.

  **2. The Rarities Question:** There is concern that common objects (snow, milk) saturate the market of confirmation. A sub-committee is considering whether rare non-black non-ravens (e.g., a pink flamingo, provided it is not a raven) should carry greater weight. Members are asked to refrain from importing flamingos until this is resolved.

  **3. Subscriptions:** Due to the savings on travel and hide maintenance, subscriptions are reduced. The surplus will fund the purchase of a standardised colour chart.

  **CLOSING ITEM**

  I conclude with a personal contribution to the Quarterly Count. During the drafting of this bulletin, I observed my own left boot. It is brown. It is not a raven. It is therefore a Non-Black Non-Raven. I have logged it in the ledger (Item 10,452). It confirms the Generalisation. It does not prove it. But it is, I feel, a solid start to the quarter.

  *F. H. Westbury*
  *Hon. Sec.*
