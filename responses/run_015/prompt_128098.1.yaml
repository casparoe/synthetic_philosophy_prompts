answer: |-
  Superrationality is the optimisation of a shared decision procedure under logical correlation, distinct from causal influence or evidential signalling.

  ### 1. Order of Components
  The session must proceed in this strict dependency chain, or the concept will fragment into standard game theory:

  1.  **The Setup (Platonia):** Establish the payoff matrix and the isolation constraint. No communication, no causal influence.
  2.  **The CDT Failure:** Demonstrate that under Causal Decision Theory, 'send' is the dominant strategy regardless of what others do, leading to the zero-prize outcome. This creates the problem space.
  3.  **The Shared Procedure Premise:** Assert that identical rational agents facing identical information will execute identical reasoning processes. This is the pivot. Emphasise that what is shared is the *algorithm*, not the *outcome* yet.
  4.  **The Deterministic Trap:** Show that if the procedure is deterministic ('always send' or 'never send'), the shared output leads to zero prize. This forces the realisation that the decision variable cannot be a binary action.
  5.  **The Procedure Shift:** Define the decision as the selection of a *probability distribution* over actions, rather than the action itself. This is where the room must grasp that you are optimising the function, not the move.
  6.  **The Calculation:** Derive the $1/N$ randomisation strategy as the utility-maximising procedure for the shared algorithm.
  7.  **The Distinctions:** Only now distinguish this from EDT and Common Knowledge, once the mechanism is understood.

  Nothing lands before step 3. If you introduce the calculation before establishing the shared procedure, they will treat it as a mixed-strategy Nash Equilibrium rather than a logical necessity.

  ### 2. The Carrying Case
  Use the **Original Platonia Dilemma**. Discard the variant with lost telegrams and the quiz-selected pool.

  *   **Why Platonia:** The binary payoff (win nothing if $\neq 1$ sender) makes the failure of deterministic strategies stark and immediate. It forces the randomisation conclusion violently.
  *   **Why not the Variant:** The quiz and transmission noise introduce empirical uncertainty about whether the other agents are actually running the same reasoning procedure. This undermines the core superrational assumption of logical identity. You want perfect symmetry to isolate the logical link from empirical noise.
  *   **Why not the Luring Lottery:** While mathematically elegant, the continuous payoff dilutes the sharpness of the coordination failure. It is better suited for a follow-up session on scaling.
  *   **Requirements:** The case must have perfect symmetry of information and reasoning capability. It must lack any causal channel between agents. It must lack any empirical uncertainty about the others' rationality (within the bounds of the thought experiment).

  ### 3. Misconceptions and Timing
  Head off misconceptions at these specific points to prevent them from calcifying:

  *   **"Superrationality just means cooperate":** Defuse this **immediately after the Setup**. State clearly that this is not morality; it is winning. If defecting were the superrational move, you would defect.
  *   **"If we are all rational we all do the same thing, therefore all send/abstain":** Defuse this at **The Deterministic Trap (Step 4)**. Use this misconception to drive the point home: if 'same thing' means deterministic action, we lose. Therefore 'same thing' must mean 'same probability distribution'.
  *   **The $1/N$ Calculation:** Introduce this **at Step 6**. If it arrives earlier, it cements the idea that this is just standard game theory mixed equilibria. Arriving here, it cements that the *probability* is the unit of optimisation for the shared procedure.
  *   **"Common Knowledge is doing the work":** Defuse this at **The Distinctions (Step 7)**. Explain that Common Knowledge allows for multiple equilibria and relies on iterative belief updates ("I know that you know..."). Superrationality relies on the identity of the reasoning function itself.
  *   **"This is just one-boxing again" (The Sequences Reader):** Defuse this at **The Distinctions (Step 7)**. Acknowledge that Functional Decision Theory formalises this, but insist that for this session, the mechanism is logical correlation of outputs, not evidential correlation of events. One-boxing relies on a predictor; superrationality relies on identity.
  *   **Leave Standing:** The intuition that "this feels like magic" is useful until the end. It keeps them engaged with the paradox rather than dismissing it as trivial.

  ### 4. The Final Question
  Do not ask if they agree. Ask this:

  *"If you discovered a typo in your copy of the reasoning text that no other player had, would you still randomise with probability $1/20$?"*

  *   **Correct Answer:** No. The argument collapses because the procedures are no longer identical.
  *   **What it Tests:** Whether they understand that the power comes from the *shared procedure*, not from the mere fact of being rational or the specific calculation itself.

  ### 5. What to Decline
  You must explicitly bound the session to prevent scope creep. State clearly at the outset that you will not cover:

  1.  **The Metaphysics of Logical Counterfactuals:** How exactly a decision 'logically determines' another across space is a deep philosophical rabbit hole. We are treating it as a premise, not proving it.
  2.  **The Reference Class Problem:** How to determine if another agent is 'sufficiently similar' to count as a copy in the real world. We are assuming perfect symmetry for the thought experiment.
  3.  **Moral Obligation:** Whether one *ought* to be superrational is an ethical question. We are discussing what is *instrumentally rational* given the premise.
  4.  **Full Functional Decision Theory:** As you noted, this eats the hour. Acknowledge it as the formal successor, but keep the focus on Hofstadter's intuitive case.

  Say this: *"We are treating the logical link as a given mechanism for today, much like physics assumes gravity without explaining quantum chromodynamics. We are analysing the motion, not the force."*
