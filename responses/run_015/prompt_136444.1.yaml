      *   *Frame Problem:* When an amendment is signed, which existing clauses survive?
      *   *Frame Axioms:* A "Survival Clause" that lists every single clause from the original agreement and explicitly states "Clause X survives this amendment."
      *   *Successor-State Axioms:* A "Merger/Integration Clause" combined with specific "Effect of Amendment" language. "Only clauses explicitly modified herein change; all others remain in full force." OR "Clause X is true *if and only if* it was true before AND not terminated by this amendment."
