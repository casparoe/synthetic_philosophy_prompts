answer: |-
  Here is the restatement of the frame problem debate, translated entirely into the vocabulary of contract interpretation and doctrine.

  ### I. The Contractual Restatement

  **1. The Frame Problem: The "Silent Survival" Dilemma**
  Imagine two parties execute a complex Master Services Agreement (MSA) containing one thousand distinct covenants, rights, and obligations. Later, they execute a Change Order to modify a single pricing term.
  *   **The Puzzle:** How do the parties determine the status of the other 999 terms in the new contractual regime?
  *   **The Difficulty:** In the absence of a specific rule, every unmentioned term is technically ambiguous. Did the parties intend for the Confidentiality Clause to survive the Change Order? Did they intend for the Dispute Resolution Clause to persist? If the legal system requires explicit consent for every continuing obligation, the parties must draft a document re-affirming all 999 unchanged terms every time they change one price. This makes contracting computationally impossible (combinatorial explosion). The "Frame Problem" is the difficulty of distinguishing which obligations persist by default and which require express re-statement.

  **2. The Frame Axiom Strategy: The "Exhaustive Schedule of Survivors"**
  This is the early, brute-force approach to drafting.
  *   **The Mechanism:** To ensure the Change Order is valid, the parties attach a Schedule listing every single clause from the MSA. Next to the pricing term, they write "Amended." Next to the other 999 terms, they write "Unchanged; hereby reaffirmed."
  *   **The Role:** This corresponds to listing every unchanged clause. It treats persistence as an affirmative obligation. Just as a frame axiom explicitly states "Action A does not change Property P," this schedule explicitly states "Change Order 1 does not terminate Clause P."
  *   **The Burden:** This creates massive transactional costs. Every amendment becomes as long as the original agreement. It is logically sound but practically unworkable.

  **3. The Successor-State Axiom Response: The "General Savings & Integration" Clause**
  This is the modern standard (akin to Reiter's solution in AI).
  *   **The Mechanism:** The Change Order contains a "General Savings Clause" combined with a "Merger Clause." It reads: *"Except as expressly modified in this Instrument, all terms of the MSA remain in full force and effect. This Instrument constitutes the entire agreement regarding the subject matter herein."*
  *   **The Role:** This corresponds to specifying only what changes. It establishes a biconditional truth condition for any contractual obligation in the new regime: *A clause is enforceable in the Amended Agreement if and only if (it was enforceable in the MSA AND is not terminated herein) OR (it is expressly created herein).*
  *   **The Efficiency:** You only draft the changes. Persistence is the default state. The "Parol Evidence Rule" acts as the logical closure: nothing outside the four corners of the documents affects the state of the contract.

  **4. The Lingering Worry: The "Implied Covenant" Ambiguity**
  This corresponds to your suspicion that residual ambiguity remains.
  *   **The Worry:** Even with a General Savings Clause, certain continuities are not captured by the text. For example, if the pricing change makes performance commercially impossible, the doctrine of "Frustration of Purpose" might terminate the Confidentiality Clause, even though the Savings Clause says it survives.
  *   **The Ambiguity:** The Savings Clause assumes the world is "closed" (only what is written matters). But contract law recognizes "Implied Covenants of Good Faith" or external legal doctrines that override the text. The worry is that the General Savings Clause creates a false sense of security; it handles *textual* persistence, but not *contextual* persistence. There is a gap between "what the contract says survives" and "what actually survives in the real world."

  ***

  ### II. The Residue Report

  This section analyzes how well the AI debate maps onto the Contract Law translation.

  **1. Elements that Translate Cleanly**
  *   **Representational Efficiency:** The move from Frame Axioms (Exhaustive Schedule) to Successor-State Axioms (General Savings Clause) maps perfectly. Both solve the problem of combinatorial explosion by shifting the burden of proof: instead of proving what stays the same, you only specify what changes.
  *   **The Closed World Assumption:** The AI requirement that "all actions are known" maps cleanly to the **Parol Evidence Rule**. In both systems, if it isn't written in the formalism (the code or the contract), it legally/logically does not exist to affect the state.
  *   **Qualification:** The AI "Qualification Problem" (unforeseen exceptions to rules) maps to **Force Majeure** or **Impossibility**. Both represent the failure of a formal rule to account for external interference that breaks the expected persistence of a state.

  **2. Elements that Must Be Distorted to Fit**
  *   **Determinism vs. Interpretation:** In AI planning, actions are deterministic (if `Open(Door)`, then `~Closed(Door)`). In contract law, "actions" (breaches, amendments, notices) are subject to judicial interpretation. A Successor-State Axiom assumes the effect of an action is known in advance. In law, the effect of an amendment is often decided *ex post* by a court. To make the analogy work, we must pretend contract interpretation is algorithmic, which distorts the legal reality.
  *   **Time:** AI planning uses discrete time steps (State $t$ to State $t+1$). Contract law uses continuous time with retroactive effects (e.g., a court ruling that a clause was *void ab initio*). Fitting legal continuity into discrete "states" of the contract requires ignoring the doctrine of relation back.

  **3. Elements with No Counterpart in Contract Law**
  *   **The Metaphysics of Properties:** In AI, a "fluent" (like `Color(Wall, Red)`) is a logical atom. In law, a "clause" is a semantic instruction. The AI worry is about *ontological* persistence (does the property exist?). The legal worry is about *normative* persistence (is the obligation binding?). Contract law has no concept of a "fact" that persists without a "rule" enforcing it.
  *   **The Ramification Problem:** In AI, one action can have infinite indirect consequences (opening a door lets air in, which changes pressure, etc.). In contract law, this is limited by **Foreseeability** and **Proximate Cause**. Contract law has a built-in "cut-off" for indirect effects (damages must be foreseeable). AI planning lacks this natural semantic brake, which is why the Frame Problem feels harder in AI than in law.

  ***

  ### III. The Interpretive Question

  **If contract law handles this without metaphysical crisis, is the Frame Problem a pseudo-problem?**

  The translation suggests that your friend is partially right, but your suspicion identifies the boundary condition.

  **1. The Argument for "Notational Artifact" (Your Friend's View)**
  Contract law proves that the Frame Problem is solvable without metaphysical angst. Lawyers do not lie awake worrying whether the Indemnity Clause ceased to exist when the Pricing Clause was amended. They rely on the **General Savings Clause** (Successor-State Axiom). This works because the legal system provides a **Background Framework** (common law, statutory interpretation) that fills the gaps.
  *   *Conclusion:* The Frame Problem in AI arises only because early AI systems tried to operate in a vacuum, without a "common law" of background knowledge. Once you adopt Successor-State Axioms *and* accept a Closed World Assumption (like the Parol Evidence Rule), the problem dissolves into routine bookkeeping. It is a problem of engineering efficiency, not metaphysics.

  **2. The Argument for "Missing Distinction" (Your View)**
  However, contract law works only because it leans on external social and legal norms that are *not* written in the contract. The General Savings Clause works because a judge exists to enforce the "Implied Covenant of Good Faith."
  *   *Conclusion:* The Frame Problem reveals a genuine epistemic gap. AI systems (unlike lawyers) often lack the "Background Framework." If you strip away the judge, the common law, and the social context, the General Savings Clause is meaningless.
  *   *The Residual Ambiguity:* Your worry about "silent omissions" corresponds to the difference between **Express Terms** and **Implied Terms**. Successor-State Axioms handle Express Terms perfectly. They fail to capture Implied Terms (background knowledge) unless those are explicitly formalized.
  *   *Verdict:* The problem is not metaphysical (about the nature of change), but **epistemic** (about the scope of relevant background knowledge). Contract law hides this problem by outsourcing it to the legal system. AI cannot outsource it. Therefore, the Frame Problem indicates that any adequate theory of change must include a formal mechanism for **background context**, not just explicit effects.

  **Final Synthesis**
  The contract analogy suggests the Frame Problem is not a puzzle about *change itself*, but a puzzle about *context*.
  *   Your friend is correct that **within a closed formal system** (like a fully integrated contract under the Parol Evidence Rule), Successor-State Axioms solve the problem.
  *   You are correct that **outside that system** (where implied terms, course of dealing, and external doctrines matter), the "bookkeeping" solution is insufficient.

  The "residual ambiguity" you sense is the gap between the **four corners of the document** (the formalism) and the **legal environment** (the world). If AI planning assumes the world is just the document, the problem is solved. If AI planning acknowledges the world is larger than the document, the problem re-emerges as the "Qualification Problem." Thus, the Frame Problem is a genuine indicator that separating explicit effects from silent omissions requires a theory of **relevance**, which contract law handles via judicial discretion, but AI must handle via logic.
