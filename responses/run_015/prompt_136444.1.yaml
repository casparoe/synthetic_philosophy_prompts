      *   *Frame Axioms (The Old Way):* Explicitly stating for every action and every property that the property remains unchanged unless the action changes it. (Inefficient, explodes combinatorially).
      *   *Successor-State Axioms (The New Way/Reiter's Solution):* For every property, specify exactly the conditions under which it *becomes* true or *becomes* false. Everything else is implicitly assumed to stay the same. (Solves the representational efficiency, but relies on a "closed world" assumption or completeness of action descriptions).
      *   *The Lingering Worry:* Does this capture *all* relevant persistence? What about unforeseen interactions? Is the "default persistence" justified metaphysically or just computationally convenient?

  3.  **Map to Contract Law Vocabulary:**
