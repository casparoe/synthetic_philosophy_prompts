answer: |-
  # Protocol H-15: Historical Growth Attribution Procedure
  **Version:** 1.0 (NGO Internal)  
  **Time Budget:** 15 Minutes per Country  
  **Goal:** Assign primary causal weight (Institutions, Geography, or Culture) to observed economic growth.  
  **Philosophical Basis:** Counterfactual dependence, Identification, Overdetermination.

  ---

  ## ⚠️ Pre-Flight Warning (Read Before Starting)
  1.  **"Rich" is Ambiguous:** Are we tagging GDP per capita, human development, or broad-based prosperity? If the dataset mixes these, **STOP**. Ask your supervisor.
  2.  **Correlation ≠ Causation:** Just because a factor exists *during* growth does not mean it *caused* growth.
  3.  **The "Just-So" Trap:** Do not accept stories that sound neat. Look for evidence of *change* coinciding with growth.
  4.  **No Library:** Use only the provided dataset summary and general historical knowledge. If you need to Google a specific treaty, you are out of time. Mark **NEEDS RESEARCH**.

  ---

  ## Phase 1: The Counterfactual Baseline (3 Minutes)
  *Goal: Establish if growth is exceptional or inevitable.*

  **Q1.1: The "Twin" Test**  
  Is there a neighboring country or historical counterpart with similar Geography and Culture but different Institutions that did *not* get rich?
  *   **Yes:** Strong evidence for **Institutions**. (e.g., North vs. South Korea).
  *   **No:** Proceed to Q1.2.

  **Q1.2: The "Time-Travel" Test**  
  Did this country have the *same* Geography and Culture 100 years prior but remained poor?
  *   **Yes:** Geography/Culture are likely not the *primary* drivers of the *change*. Proceed to Q1.3.
  *   **No (Always been rich/poor):** Growth may be structural or measurement error. **FLAG: LOW CONFIDENCE.**

  **Q1.3: The Binding Constraint**  
  Look at the start of the growth period. What was the obvious blocker?
  *   **Physical:** (Disease, Landlocked, No resources) → Lean **Geography**.
  *   **Behavioral:** (Trust, Work Ethic, Social Cohesion) → Lean **Culture**.
  *   **Rule-based:** (Property Rights, Corruption, War) → Lean **Institutions**.
  *   **Multiple/Unclear:** → **FLAG: OVERDETERMINATION.**

  ---

  ## Phase 2: The Causal Triangulation (7 Minutes)
  *Goal: Isolate the mechanism. Answer Yes/No.*

  ### A. Institutions (Rules & Incentives)
  **Q2.A.1:** Did a specific policy change (land reform, trade liberalization, property law) precede the growth spike by <10 years?
  **Q2.A.2:** Is there evidence that investors/citizens changed behavior *because* they expected the rules to hold?
  **Q2.A.3 (The Selection Test):** Did states *without* this policy fail or get conquered during this period? (See "Free-Floating Rationale" box below).

  *   **Score:** 0-3 "Yes".
  *   **Pass Rule:** If Score ≥ 2, tag **INSTITUTIONS**.
  *   **Fail Rule:** If Score ≤ 1, discard Institutions as primary cause.

  ### B. Geography (Endowments & Location)
  **Q2.B.1:** Did the growth coincide with the discovery/exploitation of a physical resource (oil, minerals) or a trade route shift?
  **Q2.B.2:** Is the growth sector physically tied to the land (agriculture, mining) rather than services/manufacturing?
  **Q2.B.3:** Would this growth be physically impossible in a different location (e.g., tropical crop, port access)?

  *   **Score:** 0-3 "Yes".
  *   **Pass Rule:** If Score ≥ 2, tag **GEOGRAPHY**.
  *   **Fail Rule:** If Score ≤ 1, discard Geography as primary cause.

  ### C. Culture (Norms & Values)
  **Q2.C.1:** Is the explanation relying on "National Character" or "Ethics"?
  *   **If Yes:** **STOP.** This is usually a bias trap. You need hard evidence (e.g., literacy rates, migration patterns).
  **Q2.C.2:** Did a measurable social metric change (education enrollment, religious conversion, urbanization) *before* the growth?
  **Q2.C.3:** Is the cultural trait specific to the economic actors (e.g., a specific merchant class) rather than the whole nation?

  *   **Score:** 0-3 "Yes" (Q2.C.1 counts as 0 if Yes).
  *   **Pass Rule:** If Score ≥ 2, tag **CULTURE**.
  *   **Fail Rule:** If Score ≤ 1, discard Culture as primary cause.

  ---

  ## 🛑 Special Protocol: The "Free-Floating Rationale" Check
  *Applies only to Phase 2.A (Institutions).*

  **Definition:** A "Free-Floating Rationale" is when an annotator claims a policy existed *because* it promoted growth, even if no historical policymaker intended that outcome (Functionalist Fallacy).
  *   *Example:* "Tariffs were imposed to protect infant industry." (Did they actually say that? Or was it just to raise revenue?)

  **The Rule:**
  1.  If the dataset *does not* contain a quote, memo, or law preamble stating the intent: **KICK IT OUT.** Do not count it toward Q2.A.
  2.  **Exception (Evolutionary Selection):** You may count it *only if* you can argue that states that didn't do this accidentally were eliminated (war, bankruptcy).
  3.  **Flag:** If you rely on the Exception, mark **TAG: FUNCTIONALIST_INFERENCE**.

  ---

  ## Phase 3: Resolution & Deadlock (5 Minutes)

  **Step 3.1: Compare Scores**
  *   **Clear Winner:** One category has ≥2 points, others ≤1. → **Assign Tag.**
  *   **Tie (e.g., 2 Inst, 2 Geo):** This is **Overdetermination**.
      *   Ask: "If I remove the Geography, does the Institution still work?" (e.g., Can you have property rights without land?)
      *   If Geography is the *platform* and Institutions are the *engine*, tag **INSTITUTIONS**.
      *   If unsure → **FLAG: DEADLOCK (Human Sign-off Required).**

  **Step 3.2: The "Hate It" Check (Validity)**
  *   Does this tag imply the wealth is sustainable?
  *   If you tagged **GEOGRAPHY** for a resource boom: Add sub-tag **NON-RENEWABLE**.
  *   If you tagged **INSTITUTIONS** for a dictatorship: Add sub-tag **EXTRACTIVE**.
  *   If the result feels morally wrong (e.g., labeling a kleptocracy "Institution-led growth"): **DO NOT CHANGE THE TAG.** Instead, mark **FLAG: ETHICAL_CONFLICT** and write a 1-sentence note. *We need the data to reflect reality, not hopes.*

  **Step 3.3: Final Sign-off**
  *   [ ] Counterfactuals checked.
  *   [ ] Free-floating rationales purged.
  *   [ ] Deadlock flags applied if scores tied.
  *   [ ] Time limit respected.

  ---

  ## Worked Examples

  ### Case 1: South Korea (1960–1990)
  **Phase 1:**
  *   **Twin Test:** Yes. North Korea (same geo/culture, diff institutions) failed. (+1 Inst)
  *   **Time-Travel:** Yes. Korea was poor in 1950. Geo/Culture didn't change. (+1 Inst)
  *   **Binding Constraint:** Post-war reconstruction required capital allocation. (Rule-based).

  **Phase 2:**
  *   **Institutions:** Policy change (Export-oriented industrialization)? Yes. Investor confidence? Yes. Selection (other models failed)? Yes. **Score: 3.**
  *   **Geography:** Resource discovery? No. Land tied? No (Manufacturing). **Score: 0.**
  *   **Culture:** "Confucian Ethic"? (Q2.C.1 Yes → 0 points). Education rose? Yes. **Score: 1.**

  **Resolution:**
  *   Winner: Institutions.
  *   Free-Floating Check: Did policymakers intend export growth? Yes (Five-Year Plans). No kick-out.
  *   **Final Tag:** INSTITUTIONS.
  *   **Notes:** Clear counterfactual with North Korea makes identification strong.

  ### Case 2: Equatorial Guinea (1995–2010)
  *The "Answer We'll Hate" Case*

  **Phase 1:**
  *   **Twin Test:** No clear twin.
  *   **Time-Travel:** Was poor, now high GDP/capita.
  *   **Binding Constraint:** Offshore oil discovery. (Physical).

  **Phase 2:**
  *   **Institutions:** Policy change? No, dictatorship persisted. Investor confidence? Only in oil sector. **Score: 0.**
  *   **Geography:** Resource discovery? Yes (Oil). Sector tied to land? Yes. Impossible elsewhere? Yes. **Score: 3.**
  *   **Culture:** No measurable shift. **Score: 0.**

  **Resolution:**
  *   Winner: Geography.
  *   **The "Hate It" Moment:** Annotators will want to tag "Institutions" (Corruption) because the wealth isn't shared.
  *   **Procedure Enforcement:** The prompt asks "Why this country got rich" (GDP data). The GDP spike is physically caused by Oil. The *distribution* is Institutional.
  *   **Action:** Tag **GEOGRAPHY**.
  *   **Mandatory Flag:** **FLAG: ETHICAL_CONFLICT** (Note: "GDP growth driven by extractive resource rent; broad development low").
  *   **Why this matters:** If we tag "Institutions," we imply policy caused the oil. If we tag "Geography," we acknowledge the wealth is exogenous and fragile. The procedure forces the uncomfortable truth.

  ---

  ## 🚩 Deadlock & Human Sign-Off Flags
  *If any of these trigger, stop the timer and escalate to a Senior Historian.*

  1.  **FLAG: OVERDETERMINATION**
      *   *Trigger:* Phase 3.1 results in a Tie (e.g., 2 Inst, 2 Geo).
      *   *Reason:* Causal identification is impossible with available data.
  2.  **FLAG: FUNCTIONALIST_INFERENCE**
      *   *Trigger:* You used the "Evolutionary Selection" exception in the Free-Floating Protocol.
      *   *Reason:* High risk of post-hoc rationalization. Needs expert review.
  3.  **FLAG: ETHICAL_CONFLICT**
      *   *Trigger:* Phase 3.2 "Hate It" check.
      *   *Reason:* The data says "Rich," but human welfare is low. The tag is statistically correct but normatively misleading.
  4.  **FLAG: ENDOGENEITY_LOOP**
      *   *Trigger:* You cannot tell if Wealth caused the Institution or vice versa (e.g., "They have good courts because they are rich").
      *   *Reason:* Violates causal direction assumption.

  ---

  ## Philosophical Grounding (For Annotator Context)
  *   **Counterfactual Dependence:** We are not asking "What happened?" We are asking "What if this one thing was missing?" (Phase 1).
  *   **Identification:** We use "Twins" (North/South Korea) to isolate variables. Without a control group, confidence drops.
  *   **Overdetermination:** History is messy. Sometimes two causes are sufficient. We force a choice for the dataset, but flag the tie.
  *   **Free-Floating Rationales:** Based on Jon Elster's critique of functionalism. Just because a nose *is* for breathing doesn't mean it evolved *to* breathe. Similarly, just because a policy *helped* growth doesn't mean it was *chosen* for growth. We purge these unless selection pressure is evident.
