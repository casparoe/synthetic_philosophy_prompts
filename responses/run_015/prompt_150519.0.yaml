prompt: |-
  I'm a software engineer at a small NGO that tags historical datasets with "why this country got rich" annotations, and our annotators keep guessing. Write me a reusable decision procedue — questions in order, pass/fail rules, and explicit "stop here, it's a judgment call" flags — for deciding whether institutions, geography, or culture is the best-supported cause in a specific case, grounded in the philosphy of causal inference from history (counterfactual dependence, overdetermination, identification problems, etc.). It needs to work for a non-expert in about 15 minutes per country with no library access. Give worked examples for South Korea (probably institutions) and a resource-cursed small state where the answer comes out wrong and we'll hate it. Also cover this weird edge: can a "free-floating rationale" — a reason for growth that no actual policymaker held — ever count? Say exactly where in the procedue it gets included or kicked out. Flag the cases where the checklist just deadlocks and a human has to sign off.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer at a small NGO.
      *   **Task:** Create a reusable decision procedure for annotating historical datasets with "why this country got rich" (Institutions vs. Geography vs. Culture).
      *   **Constraints:**
          *   Grounded in philosophy of causal inference from history (counterfactuals, overdetermination, identification).
          *   Usable by non-experts.
          *   Time limit: ~15 minutes per country.
          *   No library access (relies on general knowledge or provided dataset context).
          *   Must include: Questions in order, Pass/Fail rules, "Stop/Judgment Call" flags.
          *   Must include: Worked examples (South Korea, Resource-Cursed State).
          *   Must address: "Free-floating rationale" (functionalist explanations without agent intent).
          *   Must identify: Deadlock cases requiring human sign-off.
      *   **Tone:** Professional, rigorous, practical, slightly skeptical (acknowledging the difficulty of the task).

  2.  **Deconstruct the Causal Framework:**
      *   *Institutions:* Rules of the game (property rights, rule of law, political constraints). Mechanism: Incentives.
      *   *Geography:* Location, climate, resources, disease burden. Mechanism: Productivity/Trade costs/Health.
      *   *Culture:* Beliefs, values, social norms. Mechanism: Coordination/Trust/Work ethic.
      *   *Causal Inference Concepts:*
          *   *Counterfactual Dependence:* If $X$ hadn't happened, would $Y$ still have happened?
          *   *Overdetermination:* Multiple causes sufficient on their own.
          *   *Identification:* Can we distinguish $X$'s effect from $Z$'s effect?
          *   *Post-hoc Rationalization:* Avoiding just-so stories.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like text structure.
      *   *Step 1: Data Sanity Check.* Before assigning cause, ensure the effect (getting rich) is real and the timing aligns.
      *   *Step 2: The "Smoking Gun" Test (Institutions).* Institutions are usually the default in development econ (Acemoglu/Robinson). Look for critical junctures.
      *   *Step 3: The "Hard Constraint" Test (Geography).* Is it physically impossible to grow without overcoming geography? (e.g., Singapore vs. Bolivia).
      *   *Step 4: The "Persistent Trait" Test (Culture).* Is the explanation relying on unchanging national character? (High risk of bias).
      *   *Step 5: The "Free-Floating Rationale" Check.* Address the specific prompt requirement about functionalist explanations.
      *   *Step 6: Deadlock/Sign-off.* When to stop.

      *Refining the "Free-Floating Rationale":* This refers to functionalist explanations (e.g., "The policy existed *because* it promoted growth," even if no one intended growth). In causal inference, intent matters less than mechanism, but in historical annotation, attributing cause to a "ghost" is risky. I need to place this in the "Institutions" section but flag it as low confidence unless linked to selection effects.

      *Refining the Time Limit:* 15 minutes is very short. The questions must be binary or simple scales. No deep research.

  4.  **Developing the Worked Examples:**
      *   *South Korea:* Classic Institutions case (Chaebols + State direction + Land Reform). Counterfactual: North Korea (same culture/geography, diff institutions).
      *   *Resource-Cursed State (e.g., Equatorial Guinea or Nigeria):* The prompt asks for a case where the answer comes out "wrong and we'll hate it." This implies the procedure might force a label that feels reductionist. Let's pick a place where Geography (Oil) seems obvious, but Institutions (Corruption) are the *real* driver of *failure* to grow broadly, or vice versa. Actually, the prompt asks for "why this country got rich." A resource-cursed state usually *doesn't* get rich broadly, but GDP per capita might spike. Let's use **Equatorial Guinea**. High GDP/capita due to oil (Geography/Resource), but terrible institutions. The procedure should identify Geography as the driver of the *stat*, even if it's not "development." This highlights the tension.
      *   *Wait, re-reading:* "a resource-cursed small state where the answer comes out wrong and we'll hate it." This suggests the procedure might misclassify or force a classification that feels morally or analytically unsatisfying. If I use the procedure strictly, Oil = Geography. But economists say Oil Curse = Institutions (failure to manage). If the procedure forces "Geography" because the oil is physical, that's the "wrong" answer experts hate. I will design the procedure to catch this, but show where it might fail if annotators aren't careful. Actually, better: Show where the procedure correctly identifies Institutions but the annotator *wants* to say Geography. Or vice versa. Let's go with **Botswana** (Diamonds but grew) vs **Sierra Leone**. Let's stick to the prompt: "Resource-cursed small state." Let's use **Nauru** or **Equatorial Guinea**. Let's choose **Equatorial Guinea**. The GDP is high (rich), but it's oil. Is it Geography? Yes. Is it Institutions? No. The "hate it" part is labeling a dictatorship "rich due to geography" ignores the human suffering. I need to make sure the procedure handles "Rich" carefully.
      *   *Correction:* The prompt implies the procedure might yield a result the NGO hates. If the procedure is rigorous, it should avoid bias. Perhaps the "hate it" case is where the procedure forces "Institutions" on a place where culture/geography seems more obvious, or vice versa. Let's interpret "wrong and we'll hate it" as "The procedure forces a nuanced 'Institutions' label on a case that looks like simple 'Geography' (Oil), revealing the wealth is fragile/illusory." Or, "The procedure identifies Culture, which is controversial."
      *   *Decision:* I will use **Equatorial Guinea**. The procedure will likely flag "Geography (Resource Extraction)" but the "Stop/Judgment" flag will trigger because "Rich" is misleading. This satisfies the "hate it" requirement (the data says rich, the reality is complex).

  5.  **Addressing the "Free-Floating Rationale":**
      *   Definition: A functionalist explanation where a policy exists because it *works*, not because a leader *willed* it (e.g., evolutionary selection of states).
      *   Placement: In the Institutions section.
      *   Rule: Only count if there is evidence of *selection* (states without this policy failed/were conquered). Otherwise, kick it out as post-hoc rationalization.

  6.  **Structuring the Output:**
      *   **Header:** Context & Warnings.
      *   **Phase 1: Pre-Flight (Definition of "Rich").**
      *   **Phase 2: The Causal Triangulation (The Questions).**
      *   **Phase 3: The "Free-Floating" Check.**
      *   **Phase 4: Deadlock & Sign-off.**
      *   **Worked Examples.**
      *   **Philosophical Grounding Note.**

  7.  **Refining the Causal Logic (Self-Correction):**
      *   *Problem:* 15 minutes is too short for deep counterfactuals.
      *   *Solution:* Use "Natural Experiments" as a proxy. (e.g., Divided nations, border discontinuities).
      *   *Problem:* Overdetermination (everything matters).
      *   *Solution:* Force a "Primary Constraint" ranking. What was the *binding* constraint?
      *   *Problem:* Identification.
      *   *Solution:* Explicitly ask "What else changed at the same time?"

  8.  **Final Review against Constraints:**
      *   Reusable? Yes.
      *   Questions in order? Yes.
      *   Pass/Fail rules? Yes.
      *   Stop flags? Yes.
      *   Grounded in causal inference? Yes (Counterfactuals, Identification).
      *   Non-expert/15 mins? Yes (Simplified language).
      *   No library? Yes (Relies on dataset + general knowledge).
      *   Examples (SK, Resource State)? Yes.
      *   Free-floating rationale? Yes.
      *   Deadlock flags? Yes.

  9.  **Drafting the Content:** (Mental check of the "Equatorial Guinea" example). If EG has high GDP/capita due to oil, is it "Rich"? Yes, statistically. Is it Institutions? No. Is it Geography? Yes. Why will we hate it? Because labeling it "Geography" implies inevitability and ignores the kleptocracy. I will frame the example to show how the procedure *should* catch the "Illusory Wealth" flag, but if skipped, leads to the "hated" result. Actually, the prompt says "where the answer comes out wrong and we'll hate it." I should demonstrate a case where the procedure *works* but the *result* is uncomfortable (e.g., "Culture" is the only remaining variable). No, better: A case where the procedure forces "Institutions" on a resource state, revealing the resource wasn't enough. Let's use **Botswana** (Resources + Good Institutions) vs **Sierra Leone**.
      *   *Wait, simpler:* The prompt asks for a "resource-cursed small state." Let's use **Nauru**. Phosphate ran out. They were "rich" briefly. Cause: Geography. Result: Hate it because it's not sustainable development.
      *   *Actually, best fit:* **Equatorial Guinea**. High GDP/capita. Cause: Oil (Geography). Annotators hate it because it feels like cheating "development." I will write the example to show the procedure classifies it as Geography, but flags the "Sustainability/Inclusion" issue.

      *Re-evaluating the "Free-Floating Rationale":* This is a specific philosophical point (Elster, functionalism). I need to be precise. If a policy persists *because* it generates revenue (selection), it counts. If an annotator says "This tariff existed to protect industry" but there's no evidence the policymakers thought that, it's a free-floating rationale. Rule: Reject unless selection mechanism is visible.

  10. **Final Polish:** Ensure the tone is empathetic to the annotators (this is hard work) but strict on the logic. (Self-correction: Make sure the "15 minute" constraint is respected by keeping questions binary).

  *(Self-Correction during drafting)*: I need to make sure I don't give medical/legal advice, but this is historical annotation. Safe.
  *(Check)*: Did I include the "Stop here, it's a judgment call" flags? Yes, critical for the "Deadlock" requirement.

