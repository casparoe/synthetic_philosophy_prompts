  # Taxonomy of Occasionalism and Interventionist Causation

  **Instructions:** Navigate the decision tree below by answering each question based on the metaphysical and scientific commitments you wish to evaluate. Each terminal node (leaf) describes a distinct philosophical position regarding the compatibility of occasionalism with modern scientific practice.

  ### **Q1: Is God the sole efficient cause in the natural world?**
  *   **No:** Creatures possess genuine efficient causal power alongside or under God.
      *   ➔ **Leaf 1: Theistic Causal Realism**
          *   **Description:** Standard natural theology (e.g., Aquinas) where created substances have real causal powers granted by God. Interventionist causation applies directly to created things.
          *   **Most Awkward Commitment:** Must explain how autonomous creaturely power coexists with divine omnipotence without limiting God's sovereignty.
  *   **Yes:** God is the only true agent; created things are merely occasions for divine action.
      *   ➔ **Q2: Do secondary causes (e.g., fire, medicine) possess any ontological reality, or are they purely epistemic conveniences that summarize God's habitual patterns?**
          *   **Purely Epistemic Conveniences:** Secondary causes have no reality beyond being mental constructs describing God's actions.
              *   ➔ **Q3: Do interventionist counterfactuals ("if we intervene on X, Y changes") track real dependencies among created things, or do they merely describe stable regularities in divine action?**
                  *   **Merely Stable Regularities in Divine Action:** Counterfactuals hold only because God chooses to act consistently.
                      *   ➔ **Leaf 2: Hard Occasionalism**
                          *   **Description:** Strict Ghazalian view; science describes God's customs, not natural necessities.
                          *   **Most Awkward Commitment:** Must explain why scientific prediction works reliably if the connection between events is purely voluntary and contingent.
                  *   **Real Dependencies Among Created Things:** Counterfactuals track real structures within creation.
                      *   ➔ **Leaf 3: [Unoccupied] Epistemic-Dependency Occasionalism**
                          *   **Description:** Claims created things are mentally constructed yet sustain real counterfactual dependencies independent of God's immediate will.
                          *   **Most Awkward Commitment:** **Incoherent:** Cannot posit real dependencies among created things if those things possess no ontological reality to support them.
          *   **Ontological Reality (as Instruments):** Secondary causes are real entities, though not efficient causes in themselves.
              *   ➔ **Q3: Do interventionist counterfactuals ("if we intervene on X, Y changes") track real dependencies among created things, or do they merely describe stable regularities in divine action?**
                  *   **Merely Stable Regularities in Divine Action:** Counterfactuals hold only because God chooses to act consistently through these instruments.
                      *   ➔ **Leaf 4: Instrumentalist Occasionalism**
                          *   **Description:** Created things are real tools used by God, but causal efficacy remains entirely divine.
                          *   **Most Awkward Commitment:** Must explain why ontologically real instruments lack any genuine causal efficacy of their own.
                  *   **Real Dependencies Among Created Things:** Counterfactuals track real structural dependencies instantiated in created things.
                      *   ➔ **Leaf 5: Interventionist-Reconstructed Occasionalism**
                          *   **Description:** Modern reconciliation; God is the metaphysical ground, but created things sustain real scientific dependencies.
                          *   **Most Awkward Commitment:** Must explain how God remains the *sole* efficient cause if created things sustain real counterfactual dependencies.

