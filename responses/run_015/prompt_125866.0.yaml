  The tree should begin with the question of whether God is the sole efficient cause in the natural world. From there, branch by whether secondary causes—such as fire burning cotton or medicine curing disease—possess any ontological reality or are purely epistemic conveniences that summarize God's habitual patterns. Then branch by whether interventionist counterfactuals of the form "if we intervene on X, then Y changes" can be applied within an occasionalist framework: do these counterfactuals track real dependencies among created things, or do they merely describe stable regularities in divine action? Each leaf should name or describe the position—for instance, hard occasionalism, epistemic-secondary-cause occasionalism, interventionist-reconstructed occasionalism, or an incompatibilist denial that occasionalism undermines science—and state its most awkward commitment in one sentence. Crucially, identify any combination of answers that no philosopher actually occupies, with a brief diagnosis of whether the gap is incoherent, unattractive, or merely unexplored. Every node must be phrased as a concrete claim or case that a student can answer without already knowing which leaf it leads to; do not ask them to identify positions by label alone. The tree should separate at least four distinct positions, and you should explicitly flag any pair of leaves that the branching questions cannot genuinely distinguish.

  Please present the taxonomy with branch nodes clearly labeled as questions, sibling branches showing the answer options, and leaves carrying the position description and its awkward commitment. The audience is graduate students familiar with basic philosophy of science but not specialists in medieval Islamic philosophy, so keep technical references to occasionalism and interventionism at an accessible level. At the very end, provide a one-line machine-readable summary of the form \answer{<number of leaves>, <number of unoccupied nodes flagged>, <any pair that cannot be separated>}.
