  In a rural clinic, a patient's immune system (System One) and an automated diagnostic PCR machine (System Two) both aim to identify and neutralize a specific viral infection. System One operates through somatic hypermutation, blindly generating varied antibodies and selecting those that bind to the invader, while System Two executes a symbolic algorithm that triggers a "positive" result only if a specific genetic sequence is detected. A novel mutation arises in the virus that alters the target genetic sequence without changing the virus's physical shape or metabolic rate. The PCR machine returns a false negative because its syntax requires an exact sequence match, whereas the immune system, leveraging a redundant inflammatory response co-opted from wound healing mechanisms, isolates the virus based on general cellular stress signals while continuing its blind variation until a matching antibody is found.

  **Walkthrough the Check**
  *   **Problem:** Identify and neutralize a pathogen.
  *   **Methods:** System One uses blind variation and selection (Darwinian); System Two uses explicit symbol matching (Turing-style).
  *   **Perturbation:** A genetic mutation changes the virus's signature sequence but leaves physical traits intact.
  *   **Response:** System Two fails because its conditional logic (`IF Sequence = X THEN Positive`) is brittle; the syntax no longer matches the reality. System One copes because its evolutionary redundancy allows it to bypass the specific sequence cue, co-opting general stress responses (inflammation) to buy time while random variation eventually produces a working antibody.
  *   **Missing Comprehension:** Neither system "knows" it is fighting a virus. The PCR machine manipulates voltage levels representing nucleotides without knowing what nucleotides *are*. The immune system releases chemicals based on affinity and concentration gradients without understanding "health" or "disease."

  **The Single Feature**
  The feature doing the real work is **functional redundancy (or overlapping causality)**. Evolutionary systems layer functions over time (a component selected for one task often performs another), creating multiple pathways to a solution. Algorithmic systems rely on discrete, defined dependencies where a specific input is required for a specific output.

  **If That Feature Is Removed**
  If you remove redundancy from the immune system (engineering it to rely on a single receptor) and add redundancy to the algorithm (programming it to check multiple sequences), the distinction collapses. The algorithm would likely succeed by checking a conserved region, and the immune system would fail if its single receptor type was evaded. The separation depends entirely on the structural history of the system, not the substrate.

  **Defender's Attack**
  A defender of the Turing-style system might argue that the PCR machine *does* understand the task because its designers encoded the semantic meaning of "virus" into its code, inheriting comprehension from the human mind. This attack fails because it conflates the origin of the system with its operation. During the test, the machine processes syntax (electrical signals) without accessing semantics; if the code mismatches the mutation, the "meaning" is lost instantly, proving the machine itself holds no grasp of the domain, only the shadow of the designer's grasp.
