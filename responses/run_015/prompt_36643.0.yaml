prompt: |-
  Longtime lurker of the rationalist blogosphere here (been around since the Overcoming Bias days), and I currently sit on the moderation commitee of a mid-sized forecasting forum — think of it as Metaculus's rowdier cousin. I need a memo drafted for our next meeting and this is exactly the kind of thing you people are good at.

  Here's the situation. Our most famous member — call him D. — nailed a big geopolitical call years before it happened and has a publicly tracked calibration record that beats the community aggregate by a lot. At the last all-hands he proposed a new feature: a SETTLED tag that members with verified track records could slap on a question, which would auto-collapse any replies presenting counter-evidence. His argument: if he genuinely knows the answer, then apparent counter-evidence is by definition noise or confounded, so engaging with it just feeds the cranks. He literally cited the dogmatism paradox (Gilbert Harman's old puzzle) in his proposal — the one where, if knowing p doesn't entitle you to dismiss evidence against p, then nobody can ever reasonably refuse to re-litigate anything.

  The committee is split. One faction thinks D. is just doing correct epistemology with the serial numbers filed off — we don't re-run every flat earth thread either, and pretending all questions are perpetually open is its own failure mode (some of us remember the epistemic learned helplessness discourse and thought it had a real point). The other faction is leaning on the whole conservation of expected evidence idea from the old LessWrong sequences: if you can't name in advance what observation would move you down, then your 97% isn't a probability, it's a slogan, and the tag just bakes in a one-way ratchet where track record lets you opt out of updating forever.

  It's not hypothetical either — a trial version already blew up. D. marked SETTLED on a thread about whether a new seroprevalence study undermined his pandemic model, three respected forecasters quit the forum over it, and one of them is now writing a public post about how our site punishes exactly the updates it exists to reward.

  So: draft the memo I'll circulate before next week's meeting. It should recommend a concrete decision — adopt the tag, reject it, or adopt it with conditions (think track-record thresholds, expiry dates, a mandatory "here's what would change my mind" field the tagger has to fill in) — give reasons D. and his faction could actually respond to rather than just gesturing at update norms, and deal fairly with his single strongest point, which I take to be that we all accept something like his reasoning when it comes to astrology or flat earth, so the disagreement is about where the line is, not whether the line exists. Mods will have to apply whatever we decide in specific cases, so whatever you recommend needs criteria they can actually use.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Longtime rationalist blogosphere lurker, moderator on a forecasting forum (Metaculus-adjacent but "rowdier").
      *   **Task:** Draft a memo for the moderation committee's next meeting.
      *   **Core Conflict:** A high-status member ("D.") proposes a "SETTLED" tag for questions he/verified experts deem answered, auto-collapsing counter-evidence.
      *   **D.'s Argument:** Based on the "Dogmatism Paradox" (Harman). If you *know* $p$, evidence against $p$ is misleading. Engaging feeds cranks. We already do this for flat earth/astrology.
      *   **Opposing Argument:** Conservation of Expected Evidence (LessWrong). If you can't specify what changes your mind, it's not a probability. The tag creates a one-way ratchet against updating.
      *   **Current Status:** Trial version blew up. Respected forecasters quit. Public backlash brewing.
      *   **Requirements:**
          *   Recommend a concrete decision (Adopt, Reject, or Adopt with Conditions).
          *   Provide reasons D. and his faction can respond to (steelman their position, don't just gesture at norms).
          *   Address D.'s strongest point (the Flat Earth/line-drawing argument).
          *   Provide actionable criteria for mods.
          *   Tone: Professional, epistemically rigorous, community-focused, "rationalist-adjacent" (understands the jargon without being cringe).

  2.  **Determine the Recommendation:**
      *   *Adopt Unconditionally:* Bad idea. Leads to dogmatism, drives away talent (already happening), violates the core purpose of a forecasting forum (updating on evidence).
      *   *Reject Unconditionally:* Possible, but dismisses D.'s valid point about efficiency and noise reduction. Might alienate high-performers.
      *   *Adopt with Conditions:* The best path. It acknowledges the need to filter noise (D.'s point) while preserving the mechanism for updating (Opposition's point). It turns the "SETTLED" tag into a "High Confidence/Provisional Closure" mechanism that requires epistemic accountability.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the purpose and the recommendation immediately.
      *   **Context:** Briefly summarize the proposal and the incident (the seroprevalence thread). Keep it neutral.
      *   **Epistemic Analysis (The "Meat"):**
          *   Address D.'s Dogmatism Paradox point. Acknowledge it's valid *if* knowledge is certain. But in forecasting, nothing is certain.
          *   Address the Conservation of Expected Evidence. This is the killer argument against the current implementation.
          *   Address the "Flat Earth" analogy. Distinguish between *settled science* (consensus + mechanism) and *forecasting* (probabilistic outcomes).
      *   **Recommendation:** "Adopt with Conditions."
      *   **Proposed Mechanism:**
          *   Rename the tag (e.g., "Provisional Consensus" or "High-Confidence Closure"). "SETTLED" is too absolute.
          *   Thresholds (Track record + Community vote?).
          *   **Crucial:** The "Update Condition" field (What would change your mind?).
          *   Expiry/Review mechanism.
          *   No auto-collapse of *evidence*, only *noise* (hard to define, maybe just no auto-collapse at all, but a visual indicator). *Correction:* The prompt says auto-collapse counter-evidence. This is dangerous. Better to recommend *no auto-collapse*, but perhaps a "Highlight Top Rebuttal" feature. Or, if we must compromise, auto-collapse *only* if the "Update Condition" is met and still ignored. Let's go with: No auto-collapse of substantive counter-evidence. The tag signals weight, not silence.
      *   **Implementation Criteria for Mods:** Concrete rules to avoid arbitrary enforcement.
      *   **Next Steps:** Timeline for decision.

  4.  **Refining the Tone:**
      *   Needs to sound like it comes from inside the culture. Use terms like "calibration," "proper scoring rules," "steelman," "updateless," "priors."
      *   Avoid being accusatory toward D. Frame it as "optimizing the system" rather than "stopping D."
      *   Acknowledge the "epistemic learned helplessness" point. It's valid that endless debate is exhausting.

  5.  **Addressing Specific Constraints:**
      *   *D.'s Strongest Point:* The Flat Earth analogy. I need to explicitly concede that lines *are* drawn, but argue that forecasting questions are rarely as binary/settled as physics basics. The line should be drawn at *consensus + mechanism*, not *individual track record*.
      *   *The Blowup:* Acknowledge the seroprevalence incident as a data point showing the current design fails the "retention of top talent" metric.

  6.  **Self-Correction/Iterative Thought during Drafting:**
      *   *Initial thought:* Maybe suggest rejecting it outright.
      *   *Correction:* No, the prompt asks to deal fairly with D.'s point. A flat rejection ignores the efficiency argument. A conditional adoption shows we take the epistemology seriously.
      *   *The "Auto-Collapse" Feature:* This is the most toxic part. Collapsing counter-evidence based on *one person's* say-so is authoritarian. I need to recommend removing the auto-collapse function or severely restricting it. Let's recommend replacing "Auto-Collapse" with "Weighted Visibility."
      *   *The "Update Condition":* This directly addresses Conservation of Expected Evidence. If you tag it settled, you must state what falsifies you.

  7.  **Final Polish:** Check against the "rationalist" voice. Ensure it doesn't sound like corporate HR speak, but rather like a governance document for a community of reasoners. (e.g., using "Epistemic Hygiene" as a section header).

  8.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Concrete decision? Yes (Adopt with Conditions).
      *   Reasons D. can respond to? Yes (engages with Dogmatism Paradox).
      *   Deals with Flat Earth point? Yes (distinguishes forecasting from settled science).
      *   Criteria for Mods? Yes (specific thresholds and fields).

  *(Self-Correction on the "Auto-Collapse" point)*: The prompt says D. proposed auto-collapse. The backlash was about punishing updates. If I recommend keeping auto-collapse *at all*, it might still be too much. I should recommend *removing* the auto-collapse feature for counter-evidence, but keeping the tag as a signal. Or, make the auto-collapse contingent on a *committee* decision, not individual. Let's go with: The tag signals "High Confidence Consensus," but *never* auto-collapses substantive counter-arguments. This preserves the "signal" D. wants without the "censorship" the opponents fear.

  *Wait, one more nuance:* D. argues that if he *knows*, counter-evidence is noise. The rebuttal is that in forecasting, you rarely *know*. You have high probability. So the tag should reflect *Probability*, not *Truth*. Let's suggest renaming it to "High-Confidence Consensus" to reflect this.

  Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** Moderation Committee
  **FROM:** [Your Name/Working Group]
  **DATE:** October 26, 2023
  **SUBJECT:** Governance Proposal: The "SETTLED" Tag and Epistemic Hygiene Standards

  ### 1. Executive Summary

  Following the incident regarding the seroprevalence thread and the subsequent departure of three senior forecasters, this memo evaluates the proposal to implement a "SETTLED" tag for questions marked by high-trust users. 

  **Recommendation:** We recommend **rejecting the current implementation** of the "SETTLED" tag but **adopting a modified version** tentatively titled **"Provisional Consensus."** This modified version removes the automatic collapsing of counter-evidence, requires a mandatory falsification condition, and ties the tag to community consensus rather than individual track records. 

  This approach preserves the efficiency gains D. seeks (reducing noise on high-confidence items) while adhering to the Conservation of Expected Evidence and preventing the platform from incentivizing dogmatism.

  ### 2. Context and Problem Statement

  Member D. proposed a feature allowing users with verified track records to mark questions as "SETTLED," automatically collapsing replies that present counter-evidence. The stated goal is to reduce cognitive load and prevent "crank" engagement on questions where the answer is effectively known.

  While the intention aligns with valid concerns about "epistemic learned helplessness" (the exhaustion of debating settled points), the trial run demonstrated a critical failure mode: the mechanism currently functions as a one-way ratchet. It allows high-status users to insulate their models from updating without specifying what evidence *would* change their minds. The seroprevalence incident indicates that when "SETTLED" is applied to active forecasting questions rather than retrospective facts, it signals that the platform values status over calibration.

  ### 3. Epistemic Analysis

  To reach a decision D. and the opposition can both accept, we must address the core theoretical arguments.

  **A. The Dogmatism Paradox (D.'s Argument)**
  D. correctly cites Gilbert Harman: if an agent knows $p$, they are justified in ignoring evidence against $p$ because any such evidence is misleading. D. argues that drawing a line is inevitable; we do not host flat earth debates. Therefore, a mechanism to declare certain threads "closed" is epistemically sound *if* the knowledge claim is sufficiently strong.

  **B. Conservation of Expected Evidence (The Opposition)**
  However, forecasting is not a domain of *knowledge* ($P=1$); it is a domain of *probability* ($P<1$). As per the LessWrong sequences, if a belief is truly probabilistic, the user must be able to name in advance what observation would lower that probability. If D. cannot specify what would move him from 97% to 90%, the 97% is not a probability—it is a slogan. A tag that suppresses counter-evidence without a corresponding falsification condition violates proper scoring rules.

  **C. Resolving the Tension: The "Flat Earth" Distinction**
  D.'s strongest point is that we *do* draw lines (e.g., flat earth). The distinction is that flat earth is rejected based on **mechanism + consensus**, not individual track record. We reject it because the physical model is robust and the community consensus is near-universal. 
  In forecasting, even high-calibration individuals face uncertainty. Therefore, a "SETTLED" tag based on *individual* authority is category error. It treats a probabilistic forecast as a settled scientific fact. 

  ### 4. Proposed Policy: "Provisional Consensus"

  We propose adopting the feature with the following constraints to align it with forecasting norms.

  **I. Renaming and Reframing**
  The tag shall be named **"Provisional Consensus"** rather than "SETTLED." This linguistically reinforces that the status is contingent on current evidence, not absolute truth.

  **II. Removal of Auto-Collapse**
  **Counter-evidence must never be automatically collapsed.** 
  *Reasoning:* Auto-collapsing hides the very data required for calibration. If a "crank" presents a novel argument that actually *is* valid, hiding it destroys the forum's value proposition. 
  *Compromise:* To address D.'s concern about noise, replies to "Provisional Consensus" threads can be strictly sorted by "Karma/Weight" rather than "New," pushing low-quality noise down without deleting it.

  **III. The Falsification Field (Mandatory)**
  To apply the tag, the user must complete a mandatory field: **"Conditions for Revision."**
  *   *Requirement:* The tagger must state specifically what data point or event would cause them to remove the tag or update their probability.
  *   *Example:* "I will remove this tag if a peer-reviewed study shows seroprevalence >20% in Region X."
  *   *Enforcement:* If this condition is met and the tagger does not update, the tag is automatically revoked by the system. This satisfies Conservation of Expected Evidence.

  **IV. Eligibility Thresholds**
  The tag cannot be applied unilaterally.
  *   **Individual Threshold:** User must have a Brier score in the top 5% over the last 12 months *on similar questions*.
  *   **Consensus Threshold:** The question must already have a community aggregate probability of >90% (or <10%) for at least 30 days.
  *   **Rationale:** This shifts the basis from "D. says so" to "The market and top performers agree."

  ### 5. Implementation Criteria for Moderators

  To ensure consistent application, Moderators should use the following checklist when reviewing disputes regarding the tag:

  1.  **Is the question retrospective or prospective?** 
      *   *Retrospective (e.g., "Did X win the election?"):* "SETTLED" is permissible once official results are in. Auto-collapse of denialism is allowed.
      *   *Prospective (e.g., "Will X happen by December?"):* "Provisional Consensus" only. No auto-collapse.
  2.  **Is the "Conditions for Revision" field specific?** 
      *   Vague answers (e.g., "New evidence") are insufficient. It must be testable.
  3.  **Does the counter-evidence address the falsification condition?** 
      *   If a user posts evidence that *does not* meet the stated revision condition, Mods may hide the comment as "Noise."
      *   If the evidence *does* meet the condition, the comment must remain visible, and the tagger must be notified to update.

  ### 6. Strategic Rationale

  This compromise achieves three goals:
  1.  **Retains Talent:** It signals to forecasters like those who recently quit that the platform remains committed to updating on evidence.
  2.  **Respects D.'s Status:** It acknowledges D.'s track record by giving him (and peers) the ability to signal high confidence, but ties that privilege to epistemic accountability.
  3.  **Improves Signal:** By requiring a "Conditions for Revision" field, we actually increase the informational value of the thread. Users know exactly what data matters.

  ### 7. Next Steps

  1.  Circulate this proposal to D. privately prior to the all-hands to allow for feedback on the "Conditions for Revision" mechanic.
  2.  Vote on the "Provisional Consensus" implementation at the next committee meeting.
  3.  Draft community announcement emphasizing that this change is to *protect* the integrity of high-confidence forecasts, not to dilute them.

  **Decision Required:** Approval to proceed with drafting the specific UI/UX requirements for the "Provisional Consensus" tag based on the criteria above.
