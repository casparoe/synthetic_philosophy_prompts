answer: |-
  It is entirely understandable that you remain sceptical. The slogan 'all truths are knowable' is often wielded in seminars as a rhetorical trump card, yet it frequently masks a conflation of distinct logical and metaphysical claims. Your colleague's argument—that events beyond the cosmological horizon cannot be true because they are unknowable—relies on a specific, and highly contentious, interpretation of this maxim.

  To clarify the dialectical situation, we must disentangle the slogan into precise theses. Below, I distinguish five distinct readings, analysing their modal structure, their vulnerability to Fitch's Paradox of Knowability, and their relevance to the cosmological-horizon case.

  ### 1. The Unrestricted Epistemic Principle
  **Formalisation:** $\forall p (p \rightarrow \Diamond K p)$
  **Reading:** For every proposition $p$, if $p$ is true, then it is possible that $p$ is known.

  *   **Modal/Epistemic Status:** This is the standard formulation targeted by Fitch's Paradox. It treats 'knowable' as a metaphysical possibility operator ($\Diamond$) scoping over the knowledge operator ($K$).
  *   **Substantive Commitment:** This is a substantive verificationist commitment. It asserts that there are no 'in-principle' unknowable truths.
  *   **Fitch's Paradox:** This thesis is **undermined** by Fitch's Paradox. Assuming standard axioms of epistemic logic (specifically, that knowledge implies truth, and knowledge distributes over conjunction), this principle entails $\forall p (p \rightarrow K p)$: that all truths are *actually* known. Since we are not omniscient, the principle is false.
  *   **Inference Support:** This reading **does support** your colleague's inference (via Modus Tollens: if $\neg \Diamond K p$, then $\neg p$). However, because the principle leads to the absurd conclusion of omniscience, relying on it is logically unstable.
  *   **Cosmological Relevance:** It addresses the case directly but at the cost of logical coherence. To save it, one must reject classical logic or standard epistemic axioms, which is a high price to pay for dismissing horizon events.

  ### 2. The Global Possibility Reading
  **Formalisation:** $\Diamond \forall p (p \rightarrow K p)$
  **Reading:** It is possible that (for all propositions $p$, if $p$ is true, then $p$ is known).

  *   **Modal/Epistemic Status:** Here the possibility operator scopes over the entire universal quantifier. It claims there is *some* possible world where every truth is known, not that every truth is knowable in *this* world.
  *   **Substantive Commitment:** This is a much weaker metaphysical claim. It is compatible with there being unknown truths in the actual world.
  *   **Fitch's Paradox:** This thesis is **compatible** with Fitch's Paradox. The paradox derives actual omniscience from the Unrestricted Principle (Thesis 1); it does not derive a contradiction from the mere possibility of a world containing an omniscient knower.
  *   **Inference Support:** This reading **does not support** your colleague's inference. From the fact that there is a possible world where all truths are known, it does not follow that a specific truth in *this* world must be knowable in *this* world. Therefore, the unknowability of a horizon event does not entail its falsehood.
  *   **Cosmological Relevance:** It changes the subject. It offers no reason to think horizon events are false, only that a god-like being in another possible world might know them.

  ### 3. The Idealised Agent Reading
  **Formalisation:** $\forall p (p \rightarrow \Diamond K_{ideal} p)$
  **Reading:** For every truth, there is a possible scenario in which an idealised agent (with unlimited cognitive capacity and time) knows it.

  *   **Modal/Epistemic Status:** This shifts the burden from human knowers to an idealised subject. The modality $\Diamond$ usually refers to logical or metaphysical possibility.
  *   **Substantive Commitment:** This is substantive. It claims that truth is not independent of the potential cognitive grasp of an ideal mind.
  *   **Fitch's Paradox:** This is **vulnerable** to a modified Fitch derivation. If the logic of $K_{ideal}$ retains factivity ($K p \rightarrow p$) and distribution, the paradox re-emerges: if all truths are knowable by an ideal agent, an ideal agent knows all truths. Unless one posits that the ideal agent is essentially non-actual, this remains problematic.
  *   **Inference Support:** This **supports** the inference, provided the 'ideal agent' is bound by the same physical laws as the universe in question.
  *   **Cosmological Relevance:** This is the crux of the ambiguity.
      *   If 'ideal' means 'logically possible agent', the thesis is trivial (it is logically consistent for a being to be spacelike-separated from the horizon event and know it via magic or divine perception). This **conflates knowledge with logical possibility** and fails to address the physical impossibility of accessing the horizon.
      *   If 'ideal' means 'physically possible agent within our laws of nature', the thesis is false for horizon events (due to the speed of light and metric expansion). Thus, it cannot be used to prove the events are false without begging the question.

  ### 4. The Physical Possibility Reading
  **Formalisation:** $\forall p (p \rightarrow \Diamond_{phys} K p)$
  **Reading:** For every truth, it is physically possible (consistent with the laws of nature) that it be known.

  *   **Modal/Epistemic Status:** This replaces the metaphysical modal operator with a physical one ($\Diamond_{phys}$).
  *   **Substantive Commitment:** This is a strong naturalistic commitment. It asserts that reality contains no facts that outstrip the causal structure of the universe.
  *   **Fitch's Paradox:** This reading **evades** Fitch's Paradox technically, because the derivation relies on standard modal logic (S4 or S5), which governs metaphysical necessity, not necessarily physical necessity. However, it faces a 'Physical Fitch' problem: if it is physically necessary that some truths remain unknown, the principle is simply empirically false.
  *   **Inference Support:** This **supports** your colleague's inference, but only by making the principle an empirical claim that is likely false. If horizon events are physically unknowable, and the principle holds, then horizon events are not true.
  *   **Cosmological Relevance:** This addresses the case directly. However, it renders the maxim falsifiable by cosmology. If cosmology says horizon events are inaccessible, and you maintain the maxim, you must deny the events exist. This is not a logical argument but a metaphysical gamble against current physics.

  ### 5. The Anti-Realist Semantic Revision
  **Formalisation:** $p \equiv \Diamond K p$ (or $p \equiv$ Warranted Assertibility)
  **Reading:** The concept of 'truth' is *defined* as 'ideal knowability' or 'warranted assertibility'.

  *   **Modal/Epistemic Status:** This is not a claim about the world, but a proposal about language (semantic anti-realism, à la Dummett).
  *   **Substantive Commitment:** This is a revisionary metaphysical commitment. It denies the existence of evidence-transcendent truths.
  *   **Fitch's Paradox:** This reading **dissolves** the paradox by rejecting the classical logic assumptions (specifically, the law of excluded middle) that fuel the derivation. If truth is epistemic, the paradox does not get off the ground in the same way.
  *   **Inference Support:** This **validates** the inference by definition. If truth *means* knowability, then unknowability entails falsehood trivially.
  *   **Cosmological Relevance:** This supports the colleague's conclusion, but it **changes the subject**. It does not show that cosmological events are false in the realist sense; it shows that the word 'true' should not be applied to them. It is a linguistic stipulation, not a discovery about the cosmological horizon.

  ### Summary and Diagnosis

  Your colleague's argument relies on a slide between these theses. Specifically, they appear to be utilising **Thesis 1 (The Unrestricted Epistemic Principle)** to generate the inference that unknowability entails falsehood, while implicitly relying on **Thesis 3 (The Idealised Agent Reading)** to make the claim seem plausible (i.e., 'in principle' suggests an ideal agent).

  However, this combination is incoherent:
  1.  If they mean **Thesis 1**, they are vulnerable to Fitch's Paradox and must accept that all truths are *actually* known, which is absurd.
  2.  If they mean **Thesis 3** with a 'logical possibility' reading, they are **conflating knowledge with mere logical consistency**. The fact that it is logically possible to know a horizon event (e.g., by a being outside spacetime) does not entail that the event is false merely because *we* (physical beings) cannot know it.
  3.  If they mean **Thesis 4 (Physical Possibility)**, they are making an empirical claim that contradicts standard cosmology, rather than a logical truth.

  **Conclusion:**
  Only **Thesis 1** and **Thesis 5** genuinely support the inference that unknowability entails falsehood. Thesis 1 is logically refuted by Fitch's Paradox (unless one adopts non-classical logic), and Thesis 5 is a semantic revision that denies the realist notion of truth presupposed by the cosmological example. **Thesis 2** and the logical-possibility version of **Thesis 3** do not support the inference.

  Therefore, your colleague's maxim is either logically unstable (Thesis 1), trivial (Thesis 2), or a disguised semantic revision (Thesis 5). It does not stand as a robust, independent metaphysical principle capable of dismissing permanently inaccessible facts without significant philosophical cost.
