answer: |-
  Here is the lesson plan. It is designed to be tight, interactive, and conceptually precise without getting bogged down in formalism.

  ### 1. The Architecture (Order & Dependencies)

  You cannot teach Expected Utility (EU) without first establishing why we need *Utility* (vs. Money) and why we need *Coherence* (vs. Incoherence). The logical dependency is:
  1.  **Value:** Money is a poor proxy for value (Risk aversion). We need "Utils."
  2.  **Belief:** Credences function as betting prices.
  3.  **Coherence:** Incoherent prices allow a "Sure Loss" (Dutch Book).
  4.  **Synthesis:** If you want to avoid Sure Losses in *value* (not just cash), your preferences must maximize Expected Utility.

  **The Schedule:**
  *   **00–05:** Motivation: Why Money $\neq$ Value (Intro to Utility).
  *   **05–25:** The Carrying Example: Incoherence as a Money Pump.
  *   **25–35:** The Bridge: Generalizing from Money to Utility.
  *   **35–45:** Damage Control: Addressing the two major misconceptions.
  *   **45–50:** Assessment: The Conceptual Check.

  ---

  ### 2. The Carrying Example: "The Grade Contract"

  Do not use a coin flip or a lottery. Use something where the students feel they have *subjective* insight, but where the logic is binary.

  **The Setup:**
  Tell the class: *"Imagine I offer you the chance to set up a market on your own final grade in this course. There are only two outcomes: **A** or **Not-A**."*

  **The Mechanism:**
  You (the student) must post a price for two contracts:
  1.  **Contract A:** Pays \$100 if you get an A.
  2.  **Contract Not-A:** Pays \$100 if you get Not-A.

  **The Rule:**
  To show your *true* confidence, you must be willing to **buy or sell** these contracts at the price you post. If you post \$60, you must be willing to pay \$60 to buy it, or accept \$60 to sell it.

  **The Trap (Incoherence):**
  Ask a student: *"What is your probability of getting an A?"* (Say they say 60%).
  Ask: *"What is your probability of Not-A?"* (They must say 40%).
  Now, introduce a "confused" student who posts **\$60 for Contract A** and **\$60 for Contract Not-A**. (Credences sum to 1.2).

  **The Dutch Book:**
  Act as the Bookie.
  1.  You sell them Contract A for \$60.
  2.  You sell them Contract Not-A for \$60.
  3.  **Student pays:** \$120.
  4.  **Outcome:** Either they get an A or they don't.
  5.  **Payout:** You pay them \$100 (on the winning contract).
  6.  **Net:** They lose \$20 guaranteed.

  **Why this example works:**
  *   **It lacks:** External randomness (like a die). The uncertainty is epistemic, which highlights that *credences* are the variable.
  *   **It has:** High personal stakes (grades), making the "loss" feel visceral.
  *   **It scales:** It easily transitions from "losing dollars" to "losing utility."

  ---

  ### 3. Sequence & Misconception Management

  #### Phase 1: Motivation (Minutes 0–5)
  **Goal:** Distinguish Expected Value from Expected Utility.
  **Action:** Ask: *"Would you take a bet: 50% chance to win \$10,000, 50% chance to lose \$5,000?"*
  Most will say no. The EV is positive (\$2,500), but the risk is too high.
  **Point:** "We don't maximize dollars; we maximize *satisfaction* (Utility). Money has diminishing marginal utility."
  **Dependency:** You must establish this *before* the Dutch Book, or they will think the argument is only about financial greed.

  #### Phase 2: The Grade Contract (Minutes 5–25)
  **Goal:** Demonstrate that incoherent credences lead to sure losses.
  **Action:** Walk through the "Trap" detailed above. Draw the ledger on the board.
  *   Column 1: Cost to buy contracts.
  *   Column 2: Payout in World A.
  *   Column 3: Payout in World Not-A.
  *   Show that the "Net" row is negative in both columns.
  **Point:** "It doesn't matter what the world does. You have guaranteed a loss based solely on the structure of your prices."

  #### Phase 3: The Bridge to Utility (Minutes 25–35)
  **Goal:** Connect the Money Pump to Expected Utility Maximization.
  **Action:** Replace "\$100" with "100 Utils."
  Explain: "The Dutch Book argument shows that if your *beliefs* are incoherent, you sabotage your own *goals*. If we assume your preferences are consistent (you prefer more utils to less), the only way to guarantee you never accept a sure-loss in utils is if your beliefs obey probability axioms and you maximize Expected Utility."
  **Crucial Nuance:** Admit that the Dutch Book strictly proves *Probabilism* (coherent beliefs). A separate "Money Pump" argument proves *Transitivity* (consistent preferences). EU is the marriage of the two. Don't conflate them, but show they are partners.

  #### Phase 4: Heading Off Misconceptions (Minutes 35–45)
  This is where you earn your pay. Address these explicitly.

  **Misconception 1: "If a Dutch Book is possible, the beliefs are irrational full stop."**
  *   **Where to head it off:** Immediately after the Grade Contract demo.
  *   **The Fix:** Distinguish **Dispositional** vs. **Actual**.
  *   **Script:** *"Does this mean you are irrational if you never actually bet? No. The argument says your credences are defined by your betting dispositions. If you say you believe X is 60% likely, but you wouldn't bet on it at those odds, your problem isn't coherence, it's honesty. The Dutch Book targets the link between what you say you believe and how you act."*

  **Misconception 2: "Coherence is the same thing as Rationality."**
  *   **Where to head it off:** During the Bridge phase.
  *   **The Fix:** The "Coherent Conspiracy" example.
  *   **Script:** *"Coherence is necessary, not sufficient. I can be perfectly coherent. I can believe with 100% certainty that the moon is made of cheese. I can set my prices accordingly. I will never be Dutch Booked. But I am insane. Coherence protects you from logical self-sabotage; it does not protect you from being wrong about the world."*

  #### Phase 5: What to Refuse to Cover (Scope Control)
  You have 50 minutes. If students ask about the following, park them for office hours:
  1.  **The Representation Theorem Proof:** Do not write out the axioms (Completeness, Transitivity, Independence, Continuity). Tell them it exists, but today is about the *intuition*.
  2.  **State-Dependent Utility:** If a student asks, *"What if the \$100 is worth less if I fail the class?"* acknowledge it's a deep problem (identification problem) but state: *"For this model, we assume the value of the payout is independent of the state. Otherwise, we can't separate belief from desire."*
  3.  **Objective vs. Subjective Probability:** Do not get dragged into Frequentism vs. Bayesianism. This argument works for subjective credences. Stick to that.

  ---

  ### 4. The Conceptual Check Question (Minutes 45–50)

  Do not ask them to calculate a Dutch Book. Ask them to identify a boundary condition.

  **The Question:**
  *"Imagine a student, Sarah. She has perfectly coherent probabilities (they sum to 1, obey Bayes' rule, etc.). However, she refuses to take a bet that offers her a guaranteed gain of \$10, because she feels 'nervous' about the transaction. Is Sarah vulnerable to a Dutch Book? Why or why not?"*

  **What you are looking for:**
  *   **Correct Answer:** No, she is not vulnerable to a *belief-based* Dutch Book because her credences are coherent. However, she might violate *preference* coherence (transitivity/dominance) if she rejects a guaranteed gain, which opens her to a *preference* money pump.
  *   **The "Gotcha":** If they say "Yes, because she's acting irrationally," they have conflated Coherence with Rationality (Misconception 2).
  *   **The Nuance:** If they say "No, because Dutch Books only apply to incoherent probabilities," they get full marks. It tests if they understand that the Dutch Book argument is specific to the *structure* of the beliefs/prices, not general "smartness."

  ### 5. Expert TA Tips for Delivery

  *   **Board Work:** Draw the "Sure Loss" table. Keep it visible for the whole 50 minutes. It anchors the abstract argument in concrete arithmetic.
  *   **Tone:** Be pragmatic. Philosophers love to debate if beliefs *really* are betting dispositions. Shut that down gently: *"We aren't arguing that beliefs ARE bets today. We are arguing that IF you act on your beliefs, THIS is the constraint you face."*
  *   **Pacing:** If you run long on the Grade Contract, cut the History of the argument (Ramsey/de Finetti). They don't need names; they need the logic.

  This plan ensures they leave understanding *why* coherence matters (avoiding self-sabotage) without falsely believing it makes them omniscient.
