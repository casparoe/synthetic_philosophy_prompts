  *   **S-Tier:** Distributed Predictive-Processing Theory
  *   **A-Tier:** Organizational Functionalism
  *   **B-Tier:** Integrated Information Theory
  *   **C-Tier:** Relational-Enactive Approach
  *   **D-Tier:** Biological Naturalism

  ***

  ### The Decisive Feature

  The feature doing the heaviest work in separating the top-ranked account (Distributed PP) from the bottom-ranked account (Biological Naturalism) is the **realization of hierarchical precision-weighting via statistical variance modulation absent individual representation.** This feature validates Distributed PP because it confirms that the *functional role* of prediction (minimizing surprise via variance control) is sufficient for mind, regardless of whether any single agent understands the loop. Conversely, this feature devastates Biological Naturalism because it demonstrates that the causal powers necessary for regulatory intelligence can emerge from a swarm's statistical dynamics rather than residing in the specific neurobiology of a unified organism, thereby rendering the biological substrate constraint arbitrary.

  ***

  ### The Bottom-Ranked Objection and Rebuttal

  A defender of Biological Naturalism would object that **functional isomorphism is not ontological identity**, arguing that simulating the causal patterns of prediction through ant movements is merely "syntax" without the intrinsic "semantics" that only biological brains can produce. This objection fails because it relies on a brute, unexplained intuition about "intrinsic powers" that is causally idle; if the colony successfully regulates its homeostasis and adapts to environmental threats exactly as a minded organism does, positing a hidden, non-functional essence of consciousness adds no explanatory value and violates the principle of causal closure.
