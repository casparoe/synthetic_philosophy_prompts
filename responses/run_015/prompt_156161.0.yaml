  4.  **Relational-Enactive Approach (Score: 4/10)**
      This framework prioritizes individual bodily autonomy and sensorimotor coupling over the abstract internal statistical structures that define the colony's hierarchical organization.

  5.  **Biological Naturalism (Score: 2/10)**
