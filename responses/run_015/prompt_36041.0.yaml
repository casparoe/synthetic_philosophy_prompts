      *   **The No-Trade Theorem (Milgrom & Stokey, 1982):** Basically states that if agents start from a Pareto-efficient allocation and have common priors, and trading is common knowledge, then no trade occurs based on private information alone. Why? Because if I offer to trade, you infer I have private info. If we are both rational Bayesians with common priors, you update your beliefs based on my offer. If the trade was zero-sum (or speculative), the updated beliefs should make us agree that the trade isn't beneficial for both.
      *   **The Flaw in the User's Interpretation:** The theorem relies on extremely strong assumptions (common priors, common knowledge of rationality, Pareto-efficient initial endowments, purely speculative trade). Real markets violate these constantly.
      *   **Key Distinction:** Speculative trade vs. Liquidity/Insurance/Consumption trade. People trade for hedging, liquidity needs, or differing risk preferences, not just because they think they know the future price better.
      *   **Hayekian Epistemology:** Prices aggregate information about *scarcity* and *preferences*, not just speculative bets on future asset values.
      *   **Prediction Markets:** These are designed specifically to aggregate information. The No-Trade Theorem applies less directly here because participants often have different goals (some are subsidizing liquidity, some are hedging elsewhere), or the assumptions of common priors are dropped. Also, the "Grossman-Stiglitz Paradox" is related but distinct (if prices are fully informative, no one gathers info).
