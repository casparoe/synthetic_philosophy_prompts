answer: |-
  ### Where the premise goes wrong

  The claim that "every trade that actually occurs... involves at least one party who is irrational" is literally false. The no-trade theorem is a conditional result, not an empirical law. It establishes that *if* agents share common priors, *if* they are commonly known to be rational, and *if* trade is purely speculative, then no trade occurs. The economist omitted these crucial antecedents. Real-world markets violate these conditions constantly. Agents trade not merely to speculate on price movements based on private information, but to hedge risks, manage liquidity, or adjust consumption bundles according to differing risk tolerances. Consequently, high trading volume does not measure aggregate irrationality; it measures the volume of heterogeneous needs and risk profiles. The inference fails because it treats a theoretical baseline regarding speculative betting as a comprehensive description of all market exchange. By ignoring non-speculative motives, the remark constructs a false dichotomy between rationality and trade volume.

  ### What the no-trade theorem actually says

  Formulated by Milgrom and Stokey (1982), the no-trade theorem applies specifically to speculative markets where agents hold private information. Its core assumptions are strictly epistemic. First, agents must have "common priors," meaning they start with identical probability distributions over states of the world before receiving private signals. Second, rationality and the structure of the game must be "common knowledge." Third, the initial allocation of assets must be Pareto-efficient, implying no mutually beneficial trade exists before private information arrives. Under these conditions, if a rational agent proposes a trade, the recipient infers that the proposer possesses favorable private information. Because they share priors, the recipient updates their beliefs based on the mere fact that the offer was made. This updating continues until both parties agree that the trade offers no expected gain for either side. Essentially, private information cannot remain private enough to motivate a bet; the offer itself leaks the information, neutralizing the advantage. The theorem demonstrates that under strict Bayesian commonality, private information cannot sustain speculative volume. It is a result about the limits of betting among epistemic clones, not a prohibition on exchange among diverse agents with distinct needs or risk profiles.

  ### Consequences for the epistemology of markets

  For Hayekian epistemology, the theorem is largely irrelevant. Hayek focused on prices as signals of local knowledge regarding scarcity and production costs, not primarily as vehicles for financial speculation. When a producer adjusts output based on price, they are responding to aggregated data about resource availability, not placing a speculative bet against another rational agent. Thus, the coordination of plans remains robust even if speculative betting is constrained. Regarding prediction markets, the theorem highlights a puzzle but does not dissolve their accuracy. Prediction markets function because the assumption of common priors is relaxed; agents genuinely disagree based on diverse information structures. Furthermore, these markets often include liquidity traders who trade for reasons unrelated to information, such as hedging external risks. These traders provide the cover necessary for informed agents to profit without triggering the no-trade dynamic. Therefore, market accuracy does not derive from irrationality. It derives from the incentives created for informed agents to reveal knowledge through trading, supported by non-speculative volume. The epistemology of markets remains an epistemology of aggregated intelligence, provided we recognize that diversity of information and motive is a feature, not a bug, that bypasses the theorem's restrictive assumptions. The "noise" is not the engine; the engine is the incentive structure that allows signal to emerge from diverse perspectives.

  ### Bottom line

  The conference remark was a theoretical provocation, not a literal description of reality. The no-trade theorem identifies idealized conditions under which speculation vanishes, not a proof that all actual traders are irrational. You can safely retain the Hayekian view: markets aggregate dispersed knowledge precisely because agents differ in information and motive, violating the theorem's assumptions.
