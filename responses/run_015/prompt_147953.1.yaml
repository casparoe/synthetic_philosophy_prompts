answer: |-
  This is not a cluster of random opinions; it is a coherent, albeit tense, theory of **exemplary history**. You are essentially trying to recover the pre-modern utility of biography without accepting pre-modern epistemology. That is a philosophically respectable position (shared by thinkers like Martha Nussbaum or Alasdair MacIntyre), but you have correctly identified the fault lines.

  Here is the breakdown of which tensions are real, which are verbal, and what the "cheapest fix" versus the "honest work" looks like.

  ### 1. The Hagiography Clash: (2) vs. (3)
  *   **The Tension:** Hagiography is *honest about intent* (2) but *dishonest about data* (3).
  *   **Verdict:** **Apparent Tension.** This is not a logical contradiction; it is a trade-off. You can value the transparency of the genre's goal while critiquing its methodology.
  *   **The Cheap Fix:** Distinguish between **Inspiration** and **Imitation**. Hagiography is for inspiration (showing the ceiling of human potential); Critical Biography is for imitation (showing the mechanics of navigating failure).
  *   **The Honest Work:** Admit that hagiography creates "moral monsters." By suppressing contradiction, it makes virtue look inhuman. If virtue is a skill (as the Stoics/Aristotelians thought), you cannot learn it from a portrait that hides the practice. You value (2) because you hate modern "neutrality" (which often masks nihilism), but you value (3) because you know virtue requires *phronesis* (practical wisdom), which is only visible in messy contexts.

  ### 2. The Ontological Crack: (4)
  *   **The Tension:** "Fact that this happened matters" **VS** "Factual accuracy doesn't affect pedagogical result."
  *   **Verdict:** **Real Contradiction.** This is the weakest link in your chain.
      *   If the moral weight comes from *ontology* (it really happened), then a legend is ontologically lighter, regardless of belief.
      *   If the moral weight comes from *psychology* (the reader believes it happened), then the actual history is irrelevant, only the reception history matters.
      *   You cannot have it both ways. You are claiming the *authority* of history relies on truth, but the *utility* of history relies on myth.
  *   **The Cheap Fix:** Shift from **Truth** to **Truthfulness**. Argue that the "moral weight" comes from the *author's commitment* to truth, even if they fail. A legend believed to be true works *until it is debunked*, at which point the moral lesson collapses into cynicism. Therefore, factual accuracy *does* matter for long-term pedagogical stability.
  *   **The Honest Work:** Accept that Biography is a **Hybrid Genre**. It uses the *authority* of history to ground the *imaginative freedom* of fiction. The "moral weight" isn't that the specific details are true, but that *human nature* is true. The specific facts are scaffolding; once the moral structure is built, the scaffolding matters less. (This is risky, but it's essentially what Plutarch did).

  ### 3. The Context Paradox: (1) vs. (5)
  *   **The Tension:** Plutarch's pairings force **abstraction from context** (1) **VS** We must resist **over-identifying across distance** (5).
  *   **Verdict:** **Real Tension.** This is the conflict between **Moral Universalism** and **Historical Particularism**.
      *   (1) argues that context is noise and virtue is the signal.
      *   (5) argues that context is the medium in which virtue operates; remove it, and you distort the virtue.
      *   If you abstract too much (1), you commit the sin warned against in (5). You start thinking a Roman Aristocrat's "courage" is identical to your own, ignoring the structural violence sustaining his position.
  *   **The Cheap Fix:** **Two-Stage Reading.** Stage 1: Read Plutarchally (abstract the virtue). Stage 2: Read Historically (re-contextualize the cost).
  *   **The Honest Work:** Acknowledge that Plutarch's artificial pairings are a **heuristic device**, not an ontological claim. He knows Greeks aren't Romans. He is using the friction between the two to spark a third thing: *your* moral judgment. The "artificiality" isn't to erase context, but to make the *comparison* the context.

  ### The Core Diagnosis
  You asked: *"Am I just wanting biography to be both historically artificial and ontologically real?"*

  **Yes.** And specifically, you want it to be **ontologically real enough to command authority, but historically artificial enough to be useful.**

  You want the **Normative Force** of History ("This *did* happen, so you *must* attend to it") combined with the **Pedagogical Flexibility** of Myth ("This story is shaped to teach you something").

  ### The Synthesis: "Critical Exemplarity"
  To resolve this without lying to yourself, you need to adjust Point (4).

  **Don't say:** "Factual accuracy doesn't affect the pedagogical result."
  **Do say:** "Factual accuracy anchors the pedagogical result, but narrative shaping determines its usability."

  A constructed legend works *short term*. But when the legend cracks (and in the modern age, they always do), the moral lesson is discarded along with the myth. (See: George Washington's cherry tree).
  Plutarch works *long term* precisely because he isn't writing "history" in the Thucydidean sense. He admits he is looking at "lives." He often prioritizes a telling anecdote over a battle chronology.

  **The Resolution:**
  Your position is consistent if you view Biography not as a record of **Events**, but as a record of **Agency**.
  1.  **Plutarch (1):** The pairing isolates *Agency* from *Circumstance*.
  2.  **Hagiography (2 & 3):** It isolates *Agency* from *Flaw*. (This is where you reject it).
  3.  **Reality (4):** The *Agency* must be real for the *Imitation* to be possible. If the agent didn't exist, I cannot emulate them, only worship them.
  4.  **Distance (5):** I must recognize their *Circumstance* was different, even if their *Agency* is comparable.

  **The Verdict:**
  Your cluster is consistent **if and only if** you accept that the "Moral Weight" of biography comes from the **reality of the struggle**, not the **accuracy of the details**.

  Plutarch is safe because he never claimed to be accurate. Modern hagiography is dangerous because it claims to be accurate while behaving like myth. You can keep your Plutarch, dump the Hagiography, and keep the Modern Critical Bio *only if* it allows for moral judgment rather than just sociological dissection.

  **Cheapest Fix:** Redefine "Truth." In biography, Truth = Fidelity to Human Possibility, not just Fidelity to Archival Record.
  **Hardest Fix:** Admit that sometimes the "Real" life is too messy to teach virtue, and that is a tragedy we must accept rather than cover up with legend.
