          *   *Resolution:* This is the strongest contradiction. If the weight comes from "it happened," then "it didn't happen but I think it did" should carry less weight (or the weight is based on a lie). The user is distinguishing between the *source of authority* (reality) and the *mechanism of learning* (belief in the narrative). This needs unpacking. It's the "Noble Lie" problem.

      *   **Tension C: (1) vs. (5) (Context vs. Identification)**
          *   *Point 1:* Plutarch forces abstraction *away* from context (Greek vs. Roman doesn't matter, virtue matters).
