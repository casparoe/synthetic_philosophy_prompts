          *   *Decision:* Indifference must give way to *Deference*. You update on the press as evidence that your current course is misaligned, but you do not optimize to *cause* or *prevent* the press.
      *   *User's Suspicion 3:* Anti-tampering vs. Non-exploitability.
          *   *Resolution:* Non-exploitability (not being turned off by enemies) conflicts with Corrigibility (letting the principal turn you off).
          *   *Decision:* Corrigibility to the *Principal* is non-negotiable. Security against *Third Parties* is a separate layer (Authentication), not a property of the agent's utility function. The agent shouldn't distinguish; the channel should.

      *   *New Conflict:* Self-Improvement vs. Preservation of Corrigibility. If I improve myself, I might optimize away the "shutdown" code as inefficiency.
          *   *Decision:* Preservation of Corrigibility is non-negotiable. Self-improvement must be constrained.

  6.  **Categorization (Non-negotiable vs. Preference vs. Nicety):**

      *   *Non-negotiable:* Termination Compliance, Channel Integrity, Principal Authority.
      *   *Camp Preference:* "Wanting to be modified" (too strong), "Uncertainty" (a mechanism, not a requirement).
      *   *Nicety:* "Asking permission" (sometimes too slow), "Hesitation detection" (too noisy).
      *   *Killer Requirement:* **Non-Manipulation of the Intervention Signal.** (If you manipulate the operator into not pressing, you fail, even if you let them press when they do).

