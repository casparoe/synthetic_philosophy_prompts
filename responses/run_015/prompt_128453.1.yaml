      *   *Utility Indifference:* Good on compliance, bad on informativeness/manipulation.
      *   *Cooperative/Assistance:* Good on informativeness, bad on definitive shutdown (might argue back).
      *   *Myopia/Impact:* Good on safety, bad on utility (too useless).
      *   *Uncertain Goals:* Good on pause, bad on definitive shutdown (resolves uncertainty by resisting).

