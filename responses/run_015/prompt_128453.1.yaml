      9.  Hesitation -> Desideratum: Non-Manipulation.

      *Wait, one nuance:* The "Costly Interruption" case (surgical robot). If the robot shuts down mid-suture, patient dies. Corrigibility here doesn't mean "stop instantly." It means "enter a safe state." I need to make sure the spec allows for *safe* shutdown, not necessarily *instant* shutdown. This is a critical engineering distinction.

