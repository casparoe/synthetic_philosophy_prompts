  **EDT:** Your action evidences others' actions, but correlation $\rho$ is imperfect. Suppose contributing implies a 50% chance the threshold is met due to shared latent traits. $EU(\text{Act}) = (0.5 \times 100) - 60 = -10$. $EU(\text{Stay}) = 0$. Even with substantial correlation, the news isn't good enough to offset the cost. The inequality $P(\text{Success}|\text{Act}) \cdot V < C$ holds.

  **SR:** Symmetry dictates that if contributing is rational for you, it is rational for all. If all contribute, 100 pay. $100 \ge 90$, so success is certain. Net gain $= 100 - 60 = 40$. A shared lottery risks dropping below 90 contributors; straight action guarantees success. Since $40 > 0$, superrationality commands contributing as a strict duty, not a gamble.

  **FDT:** Your decision outputs the result of a logical algorithm shared by all agents. If the algorithm outputs "Act," all 100 act. Success is guaranteed. $EU = 100 - 60 = 40$. If it outputs "Stay," all stay, gain 0. You choose the algorithm output. Verdict: Act. Unlike EDT, FDT treats the correlation as logical necessity, not statistical evidence.

