  Hofstadter's puzzles penalize coordination (dilution or overlap); this puzzle rewards it (threshold security). In Platonia, superrationality restrains you to avoid collision. Here, the collective optimum requires unanimity, not scarcity. Superrationality flips from a brake to an accelerator because the good is non-rivalrous and the threshold demands mass participation rather than singular claimants.

