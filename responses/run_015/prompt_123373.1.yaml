      *   **The Catch:** Directors can withhold Approval. Makers can withhold Authenticity.
      *   **The Hegelian Twist:** If the Director forces the Maker, the Maker gives the token grudgingly. It feels empty. If the Maker refuses, the Director fails.
      *   **Physicality:** Standing vs. Sitting? Different colored vests? Let's use *badges*. Directors wear "Lead" badges, Makers wear "Support" badges.

