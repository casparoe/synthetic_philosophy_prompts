      *   Crucial Rule: Workers can refuse to stamp. If they stamp under duress, they mark it with a dot (void). Managers don't know if a stamp is void until the end.
      *   *Actually, let's make it more visceral.* The "Recognition Token" is physical.
      *   Let's go with the **"Validation Chip"** idea.
      *   Managers have the **Goal**. Workers have the **Means**.
      *   Managers need **Validation Chips** from Workers to claim victory.
