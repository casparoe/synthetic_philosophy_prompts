      *   Activity Design (Title, Objective, Roles, Materials, Rules).
      *   Timeline.
      *   Debrief Guide (Mapping to Hegel).
      *   Failure Analysis (What goes wrong + mitigation).
      *   Limitations (What Hegel is missing).
      *   Least Sure Element.

  10. **Refining the "Body Feel":**
