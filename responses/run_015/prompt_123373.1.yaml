      *   The "Hollow Victory": The Master wins only if the Slave *wants* them to win.
      *   The "Risk": The Master must give up the clipboard (authority) to get the real signature.

      *(Self-Correction during drafting)*: Keep the rules simple enough to explain in 10 mins. Complex economies kill the vibe.
      *   *Revised Mechanic:* **The Signature Game.**
      *   Task: Build a tower.
