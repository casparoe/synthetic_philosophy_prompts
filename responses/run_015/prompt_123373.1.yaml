      *Wait, simpler is better.*
      *   **Managers:** Stand. Hold the Blueprint.
      *   **Workers:** Sit. Hold the Blocks.
      *   **Currency:** "Acknowledgement Cards."
      *   **Rule:** Managers must collect 5 Cards from Workers to "Win." Workers must build the tower to "Win."
      *   **Constraint:** Managers can *demand* a card. Workers *must* give a card if demanded. **BUT**, the Manager must read the card aloud. If the card says "Given under protest," the Manager loses 1 point.
      *   **Better:** Workers have two types of cards: "Praise" and "Compliance." Managers want "Praise." Workers only want to give "Compliance" if treated poorly.
      *   **Best:** Keep it implicit. The *feeling* is the goal.
      *   Let's stick to the prompt's specific idea: "Recognition granted downward, validated upward."
      *   **Downward:** Praise/Orders. **Upward:** Legitimacy.
      *   **Activity:** "The Legitimacy Loop."

      *(Finalizing the Design)*
      *   **Roles:** 3 Directors (Stand), 7 Builders (Sit).
      *   **Task:** Recreate a hidden pattern with cards.
      *   **Directors:** See the pattern. Cannot touch cards.
      *   **Builders:** Touch cards. Cannot see pattern.
      *   **Tokens:**
          *   Directors hold **Authority Coins** (needed by Builders to move a card).
          *   Builders hold **Truth Tokens** (needed by Directors to claim they solved it).
      *   **Exchange:** Builder asks for Coin -> Director gives Coin -> Builder moves card -> Builder *may* give Truth Token.
      *   **Win:** Directors need 5 Truth Tokens. Builders need to match pattern.
      *   **The Hegelian Trap:** Directors can withhold Coins to starve Builders. Builders can withhold Truth Tokens to starve Directors of victory.
      *   **The "Hollow" Moment:** If a Director threatens a Builder to get a Token, the Token is marked (Builder secretly marks it). Marked Tokens count as -1.
      *   **Risk:** Director must give up Authority Coin *without* demanding Token to get a "Pure" Token.

