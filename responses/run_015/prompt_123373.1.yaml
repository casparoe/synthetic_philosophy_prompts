  6.  **Refining the Rules for Maximum Tension:**
      *   *Task:* Build a "Manifesto" or a "Tower" (let's go with a *Manifesto/Statement*—it's more about words/recognition). Actually, a *Physical Structure* using abstract materials (cards, tape) is better for "labor." Let's do a **Symbolic Tower**.
      *   *Directors:* Decide the shape. Cannot touch materials.
