      *   *Simpler Trap:* Directors need Makers to *verbally affirm* the work to get the chip. Makers know the Director needs it.

      *Let's pivot to a cleaner mechanic based on the prompt's specific request:* "Recognition can only be granted downward and only validated upward."
      *   **Downward:** Praise/Orders flow Down.
      *   **Upward:** Validation/Credit flows Up.
      *   **Mechanic:**
          *   **Leads (3 people):** Define the goal. Hold the "Scorecard."
          *   **Members (7 people):** Do the work. Hold the "Stamps."
          *   **Goal:** Complete a puzzle or build.
