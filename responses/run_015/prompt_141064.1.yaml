answer: |-
  ### Brainstorming the Logical Space

  Before drawing the tree, we need to map the tension between *Simulation Hypothesis (SimH)* and *Longtermist Fanaticism*. Fanaticism relies on $EV = P \times V$. SimH attacks both variables.

  1.  **Ontology vs. Axiology:** Being a simulation (ontology) doesn't automatically mean you lack moral weight (axiology). We must separate "Are we real?" from "Do we count?"
  2.  **The Truncation Problem:** If sims are cheap, they might be short. If the future is cut off at 2060, longtermism dies. This is the strongest argument *against* fanaticism.
  3.  **The Amplification Problem:** If sims are stackable (sims-in-sims), the number of minds could dwarf base reality. This argues *for* hyper-fanaticism.
  4.  **The Leakage Channel:** Even if truncated, can we affect the *operators*?
      *   *Blueprint:* They adopt our institutions.
      *   *Resurrection:* They upload us later.
      *   *Interest:* They run more copies if we are entertaining (the "weird" hypothesis).
  5.  **Decision Theory:** If there are 1,000,000 copies of you, does your choice count once (Causal) or 1,000,000 times (Evidential/Functional)? This is the multiplier.
  6.  **Tail Risk:** SimH introduces radical uncertainty. Does this uncertainty justify *more* extreme bets (fat tails) or *fewer* (model instability)?

  *Design Note:* The tree must force the user to confront these mechanics without using jargon like "FDT" or "Nihilism" in the questions themselves. The leaves will carry the labels.

  ***

  # HANDOUT: Does Simulation Theory Kill Longtermism?
  **Session Goal:** Determine if assigning 5–10% credence to "We are in a simulation" turns the dial on far-future fanaticism Up, Down, or Neutral.

  ### THE DECISION TREE

  **START:** Do you assign >5% credence to "We are living in a computation run by advanced operators"?
  *   **NO** → **[LEAF 1] Business-as-Usual Longtermism**
  *   **YES** → Go to Q1.

  **Q1 (Capacity):** Is the simulation computationally capped to terminate soon (e.g., 2060), or can it run indefinitely/nest into deeper simulations?
  *   **Capped/Terminating** → **[LEAF 2] The Truncationists**
  *   **Open/Nested** → Go to Q2.

  **Q2 (Moral Status):** If a person inside this simulation suffers, is that bad in exactly the same way as a person in base reality suffering?
  *   **NO (Less/None)** → Go to Q3.
  *   **YES (Equal)** → Go to Q4.

  **Q3 (Instrumental Value):** Even if you don't count morally, can your actions influence the operators' base reality (e.g., they learn from you)?
  *   **NO** → **[LEAF 3] Sim-Nihilists** *(Flagged: Logically coherent, rarely occupied)*
  *   **YES** → **[LEAF 4] Base-Reality Instrumentalists**

  **Q4 (Leakage Channel):** Assuming operators watch us, what do they do with successful runs?
  *   **Adopt our institutions/policies** → Go to Q5.
  *   **Re-instantiate/upload our minds later** → Go to Q5.
  *   **Run more copies the more *interesting* we are** → **[LEAF 5] The Narrative Maximizers**

  **Q5 (Correlation):** If you choose to sacrifice for the future, do near-identical copies of you in other simulations make the same choice, and do those copies count separately?
  *   **NO (Only my physical body counts)** → **[LEAF 6] Causal Realists**
  *   **YES (My decision logic counts everywhere)** → Go to Q6.

  **Q6 (Tail Variance):** Does not knowing *which* simulation we are in make the highest-possible payoff scenarios more probable than standard physics assumes?
  *   **NO** → **[LEAF 7] Moderate Sim-Longtermists**
  *   **YES** → **[LEAF 8] Hyper-Fanatics**

  ---

  ### READING KEY: THE LEAVES

  1.  **Business-as-Usual Longtermism:** SimH is ignored; standard x-risk calculus applies.
      *   *Awkward Commitment:* You are ignoring a 10% chance that physics is fake.
  2.  **The Truncationists:** SimH reduces fanaticism because the future is short.
      *   *Awkward Commitment:* You must stop caring about x-risk after the simulated "end date."
  3.  **Sim-Nihilists:** SimH kills all value; nothing matters.
      *   *Awkward Commitment:* You should be indifferent to your own suffering right now.
  4.  **Base-Reality Instrumentalists:** You don't count, but helping the operators does.
      *   *Awkward Commitment:* You are a tool, not a patient; your welfare is irrelevant data.
  5.  **The Narrative Maximizers:** Value depends on being entertaining to operators.
      *   *Awkward Commitment:* We should provoke crises to keep the operators watching.
  6.  **Causal Realists:** Leakage exists, but your copies don't multiply your impact.
      *   *Awkward Commitment:* You reject the idea that "logical correlation" creates value.
  7.  **Moderate Sim-Longtermists:** SimH adds value but doesn't change the bet size.
      *   *Awkward Commitment:* You accept sim-logic but refuse to bet the farm on it.
  8.  **Hyper-Fanatics:** SimH fattens the tails; extreme bets are rational.
      *   *Awkward Commitment:* You must prioritize the lowest-probability, highest-payoff sim scenarios over likely ones.

