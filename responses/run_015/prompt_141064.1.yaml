  ### PHILOSOPHER'S NOTES (FLAGS)

  *   **Unoccupied Space:** **[LEAF 3] Sim-Nihilists**. It is logically possible to believe "We are sims" + "Sims don't count" + "No Leakage," but almost no one stays here. Usually, people either grant sims moral weight (move to Q4) or doubt the simulation hypothesis entirely (move to START/NO).
  *   **Indistinguishable Leaves:** **[LEAF 7] Moderate Sim-Longtermists** and **[LEAF 1] Business-as-Usual** often prescribe the same actions. The difference is purely metaphysical (why you care), not practical (what you do), unless the sim-credence crosses a threshold for resource allocation.
  *   **The "Interestingness" Channel:** This is distinct from Blueprint/Resurrection because it optimizes for *novelty* rather than *welfare* or *truth*. It turns ethics into aesthetics.

