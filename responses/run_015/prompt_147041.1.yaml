prompt: |-
  Can you draft a final-exam essay prompt for an upper-level seminar on Confucian role ethics? I want it pretty in the weeds — imagine a near-future bureaucratic system where citizens are assigned filial roles by predictive kinship algorithms rather than blood, and ask whether Confucian corrective reciprocity and the ruler-subject analog still apply when the "parent" is an administrative AI. The answer should need more than a summary of Mencius or the Analects; students have to argue if role-obligation needs biological lineage or just functional reciprosity, and spot the tension between li and ren in synthetic kinship. Give me the question, a model answer outline, and a marking sheme for 20 marks over ninety minuts with five must-hit points, the points each is worth, and a quick line on how students usually botch each one. Keep it focused — no bibliographies or citation lists, since this is for a closed-book exam.
