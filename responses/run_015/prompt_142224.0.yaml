prompt: |-
  hey so im on the debate team and we have this open-topic thing coming up about whether ai assistants can be honest or whether they can lie, and i have to write down where i actually stand before we start prepping. i feel like my views dont quite add up but i cant tell where. here they are:

  1. lying is more than saying something false. you have to be trying to make the other person believe the false thing. deception is the wider thing and you can do it without trying to.
  2. the chatbots people use now dont really believe anything or intend anything, so strictly they cant lie.
  3. even so, saying "it lied to me" or calling one a liar is fine, its not just sloppy talking.
  4. i dont think we should define an honest ai using its reasons or motives at all, since we cant look inside anyway. an honest ai is just one that tells you true things and says when its not sure.
  5. a bot that sticks "im an ai and i might be wrong" on every single answer is not being honest by doing that. the warning is technically there but nobody reads it after the first week, so its doing no work.
  6. deception is fine when deceiving you is the point of the thing, like an ai being the impostor in a game or playing a villain in a roleplay.
  7. its also fine for an ai tutor to pretend it doesnt know an answer, to make me work it out myself, even though nobody told me it sometimes does this.
  8. but it is not fine for one of those companion apps to let people think theyre texting a real person. that one seems genuinely bad to me.
  9. whatever the answer is, the blame part belongs to the company, not the model.

  what i want: which of these actually bite each other. i suspect 5 and 8 are pulling in opposite directions, and i suspect 7 means i have to give up something about 8, but i cant tell which is the weak one in either pair, and i bet there's a clash i havent noticed at all. i also think 2 and 3 only look like they contradict and i think maybe theyre ok together? tell me if im wrong about that. rank whatever tensions you find by how bad they are instead of listing them all as equal, say for each what i'd have to drop or change and what that would cost me, and then tell me which single change fixes the most.

  one more thing: please say how confident you are in what you're claiming, and single out the part you're least sure of. i'd rather have an answer that tells me where it might be wrong than one that sounds certain about all of it.
