      *   *The "Random/Rotate" Critique:* Why is this absurd?
          *   *Resource Scarcity:* You can't mentor 800 people deeply.
          *   *Signal Dilution:* If everyone is HiPo, the label means nothing.
          *   *Ignoring Baseline:* Past performance *is* a predictor, even if HiPo boosts it. Randomness throws away data.
          *   *The "Investment" Analogy:* VC firms don't invest in everyone. They pick bets.
      *   *The Ontology of Potential:* Address the "is it false?" question. It's not false; it's *constructive*. Like a credit score. It's a promise of investment, not a measurement of soul.
      *   *What to Argue in the Meeting (The Script):*
