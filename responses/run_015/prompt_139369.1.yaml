          *   Colleague B (Cynic): "It's all made up. We just pick people like us. Potential doesn't exist."
          *   New Proposal: Make the list *secret* from the employees (but not managers) to avoid ego inflation/exclusion feelings.
          *   Colleague C (Radical): "If we invented potential, let's reinvent it. Pick at random or rotate resources."
      *   **The User's Instincts:**
