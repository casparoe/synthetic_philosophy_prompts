answer: |-
  **MEMORANDUM**

  **TO:** Members of the National Commission on Post-Conflict Cultural Heritage
  **FROM:** Chair, National Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal for Structured Erasure Protocol (Archive Ethics Subcommittee)

  **1. DECISION**

  After reviewing the proposal drafted by the Archive Ethics Subcommittee and considering the deliberations of the full Commission, I have determined to **APPROVE WITH CONDITIONS** the implementation of the Structured Erasure Protocol.

  This decision authorizes the Subcommittee to proceed with the framework for mnemonic deactivation of testimonial archives seventy-five years after initial recording, subject to the modifications outlined in Section 4 of this memo. This path acknowledges the Commission's dual mandate: to preserve the historical record of the 1970s river-basin displacement as a matter of public justice, and to uphold a duty of care toward the descendants of those who provided testimony.

  **2. RATIONALE**

  The Commission's division reflects a fundamental tension in the ethics of memory. On one side stands the obligation to the moral community: the archive serves as a bulwark against denialism, ensuring that systemic injustice remains a matter of public knowledge rather than private negotiation. On the other side stands the obligation to the living: perpetual visibility of trauma can impede the transition from grievance to coexistence, imposing a burden of representation on descendants who did not consent to the original recording.

  We must reject the false dichotomy that suggests we must choose between total transparency and total erasure. The proposed protocol occupies a necessary middle ground. By sealing records rather than destroying them, we maintain the integrity of the historical record while altering its public lifecycle. This approach recognizes that the moral weight of testimony shifts over time. In the immediate aftermath of conflict, publicity is a tool of justice. After three generations, when the direct witnesses have passed and the political context has stabilized, privacy may become a tool of reconciliation.

  **3. ADDRESSING ETHICAL OBJECTIONS**

  The Commission must be prepared to defend this decision against three specific, substantive critiques raised during our deliberations.

  *   **On Institutional Forgetting and Contingent Memory:**
      Opponents argue that allowing opt-in deactivation sets a precedent that memory is contingent, potentially undermining the archive's authority. The concern is that if families can withdraw testimony, the historical narrative becomes subject to the whims of private interest.
      *Response:* This protocol does not make *truth* contingent; it makes *access* contingent. The historical fact of the displacement and the statistical reality of the suffering remain in the public catalog via anonymized entries. The specific narrative texture is preserved in the vault for certified research. We are not permitting the denial of events, but rather managing the intensity of public scrutiny. The archive's authority rests on the preservation of evidence, not its perpetual exhibition. As long as the evidence remains verifiable by qualified researchers, the institutional mandate is satisfied.

  *   **On the Seventy-Five-Year Window:**
      Critiques suggest this window is arbitrary—either too short to ensure collective remembrance or too long to alleviate descendant suffering.
      *Response:* The seventy-five-year mark is not arbitrary; it represents a generational horizon. It exceeds the natural lifespan of the original witnesses, ensuring that the decision to deactivate is not made by the testifier under duress or immediate trauma, but by descendants assessing a long-term legacy. It is sufficiently long to allow the historical narrative to cement itself in the public consciousness before receding from active public view. This duration balances the need for intergenerational accountability with the right of great-grandchildren to live outside the shadow of their ancestors' trauma.

  *   **On Deactivation Versus Destruction:**
      Skeptics question whether there is a meaningful moral distinction between sealing a record and destroying it, arguing that removing public access effectively kills the memory.
      *Response:* The distinction is vital. Destruction eliminates the possibility of future correction or re-evaluation; it is an act of finality that serves political expediency. Deactivation is an act of curation. By restricting access to certified historians, we acknowledge that the testimony retains evidentiary value even if it loses public display value. This ensures that should the political climate regress, or should new historical questions arise, the primary source material remains intact and recoverable. We are protecting the data from the volatility of public discourse, not from history itself.

  *   **On Veto Power Over Collective Harm:**
      The most serious objection is that descendants should not hold veto power over narratives implicating collective, systemic harm. If the testimony documents state crimes, does the family have the right to obscure them?
      *Response:* Descendants do not hold veto power over the *fact* of the injustice, which is preserved in the aggregate data. They hold stewardship over the *intimacy* of the suffering. The protocol allows for the withdrawal of the personal narrative, not the historical event. We must distinguish between the public's right to know that injustice occurred and the public's right to consume the specific grief of identifiable families. The latter is not an inherent public right. Granting descendants this limited agency does not privatize the harm; it respects the human dignity of those most closely linked to it, preventing the archive from becoming an instrument of ongoing exploitation.

  **4. CONDITIONS FOR IMPLEMENTATION**

  To mitigate the risks identified above, the Subcommittee must incorporate the following conditions into the final operational guidelines:

  1.  **Review Board Oversight:** Requests for deactivation shall not be automatic. A standing Review Board, comprised of one Commission member, one independent historian, and one representative of the displaced community, must review each request to ensure it is not the result of external coercion or political pressure.
  2.  **Definition of Certified Historians:** Access to the sealed vault must be strictly defined. "Certified Historians" must be vetted not only for academic credentials but for adherence to ethical research protocols regarding trauma. Access logs must be maintained to ensure the sealed records are used for research, not leaked to the public sphere.
  3.  **Aggregate Integrity:** The anonymized statistical entry remaining in the public catalog must be robust enough to sustain the historical record. It cannot be a mere placeholder; it must contain sufficient metadata to contribute to the macro-historical understanding of the displacement, ensuring the "collective memory" function is not degraded by the removal of individual cases.
  4.  **Protocol Sunset:** This protocol itself shall be subject to review every twenty years. The Commission must assess whether the deactivation of these records has negatively impacted public understanding of the displacement or hindered ongoing justice efforts.

  **5. DIRECTIVE**

  The Archive Ethics Subcommittee is directed to revise the proposal language to reflect these conditions and submit a final implementation plan within sixty days. We proceed on the understanding that memory is not a static monument but a living practice. Our duty is to tend to that practice with both rigor and compassion, ensuring that in our zeal to remember the past, we do not sacrifice the well-being of those who must live in its aftermath.

  **Chair, National Commission on Post-Conflict Cultural Heritage**
