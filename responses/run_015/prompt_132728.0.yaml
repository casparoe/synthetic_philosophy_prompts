answer: |-
  INSTITUTE FOR PRIORITIES IN SUFFERING REDUCTION
  Human Subjects Committee
  Ref: HSC-2024-DEC-09

  Dr. A. Vance, Principal Investigator
  Department of Clinical Ethics

  Dear Dr. Vance,

  The Committee convened on 14 October to adjudicate the submitted protocols pursuant to the Mandate for Ethical Adjudication (Section 4, Clause 2). The Committee resolved that the following determinations apply, pursuant to the Lexical Threshold Framework (LTF) and Standing Order 74.

  1.  **Protocol 88-A (Novel Analgesic Trial).** Refused. The placebo arm carries a 10^-6 probability of a single participant experiencing pain exceeding the Intensity Threshold. The Committee resolved that no probability, however small, of supra-threshold harm can be balanced against a certainty of relief for others. The trial would prevent a great deal of ordinary post-operative pain; nonetheless, the risk precludes approval. The Committee notes helpfully that an application enclosing no participants at all would be approved within five working days.

  2.  **Protocol 88-B (Nociceptive Calibration).** Approved. The procedure was initially rated 7 out of 10 on the standard clinical pain scale. The Committee re-scores it at 690 on a 1,000-point scale on which the threshold sits at 700, and approves. An alternative scale submitted by the investigator is noted, set aside, and not discussed, as it lacks calibration against the LTF Fixed Point.

  3.  **Protocol 88-C (Mass Exposure Study).** Approved. The study exposes twelve thousand participants to a pain rated just under the line. Each exposure is individually sub-threshold and therefore individually settlable against scheduled units of compensating pleasure under the Committee's standing Offset Schedule—a warm beverage credited at a fraction of a unit, and so on. The Committee amends the protocol of its own motion: rather than two exposures each for twelve thousand people, twenty-four thousand people with one exposure each. Two sub-threshold pains in the same person might, taken together, amount to something it would rather not have to rule on.

  4.  **Protocol 88-D (Screening Tool Validation).** Refused. This application proposes a short supra-threshold pain in one consenting volunteer, needed to validate a screening tool that would prevent that very pain in tens of thousands of patients annually. It is refused because sub-threshold sufferings cannot be summed so as to outweigh a single supra-threshold one. The Committee adds that the answer would be unchanged were every one of those patients themselves at just under the line, and that the volunteer's consent, while appreciated, is not a term in the arithmetic.

  **Minutes of Dissent**
  Two members registered dissent against the Framework application in Protocols 88-B and 88-D.
  Dr. H. Miller (Hedonic Utilitarian): "If pleasure and pain are commensurable below the line, the line itself is an arbitrary fracture in the calculus. Why stop the sum?"
  Dr. S. Kael (Negative Utilitarian): "The Threshold is a cowardly compromise with common sense. Any pain should outweigh any pleasure. To allow offsets below the line is to tolerate evil."

  The Committee reaffirms the Lexical Threshold Framework as the sole basis for approval. No amount of compensating pleasure will be considered above the threshold. Below it, one person's discomfort may be settled with another person's dessert.

  Signed,
  Chair, Human Subjects Committee

  **APPENDIX: Guidance Note 4: Determining Whether a Procedure Is Sub-Threshold**

  1.  **Definition.** A procedure is Sub-Threshold if the projected intensity and duration of suffering remain strictly below the Fixed Point (700/1000 IPSR Scale). Any measurement exceeding or meeting this value triggers Lexical Priority protocols.
  2.  **Commensurability.** Below the Fixed Point, suffering and happiness are commensurable. Trade-offs occur at a finite rate defined in the Offset Schedule (Form O-9). Investigators must calculate net utility using the prescribed conversion ratios.
  3.  **Lexical Priority.** At or above the Fixed Point, the Offset Schedule is void. The reduction of suffering takes absolute priority. No quantity of happiness and no quantity of relief from lesser suffering in other people can compensate for it, however enormous. Such values shall not be entered into the balancing equation.
  4.  **Aggregation.** Sub-threshold units may be aggregated across persons for the purpose of Offset calculation, but not across the Fixed Point. Intra-personal aggregation of sub-threshold events is discouraged where it approaches the Fixed Point asymptotically. Sequential exposures must be distributed across distinct subjects where feasible.
  5.  **Scale Sensitivity.** Investigators must use the IPSR Scale. Alternative scales will be normalized by the Committee. The Fixed Point remains constant regardless of normalization to prevent scale-shopping by Investigators. Discrepancies in scaling will be resolved by Committee fiat.

  *End of Document.*
