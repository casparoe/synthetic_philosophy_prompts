  Welcome to *Core Holdings: The Western Values Archive*. Please adjust your headset. You are standing before the main taxonomy wall. Here, we attempt the impossible: treating "Western Values" not as a vibe, but as a catalogable collection. Like any traveling exhibit, the contents shift depending on the host country, but the framing remains rigid.

