  Let's apply the protocol. First, **Democracy**. Geographic origin is messy—Athens is definitely in, but the modern version gets filtered through Washington. Transmission vector is strong (constitutions, NGOs). Rhetorical frequency is high, though usually defined as "whatever we have." It passes, barely.

