answer: |-
  **Classification Committee for Mental Disorders**
  **Release Notes: Edition 12.0 (Fixed-Point Protocol)**
  **Date:** 14 October 2024
  **Build:** 12.0.4-RC

  **Overview**
  Edition 12.0 implements the Fixed-Point Protocol. Previous iterations operated on the assumption that diagnostic categories describe static natural kinds. Post-deployment analysis of Edition 11.5 indicated that public access to criteria specifications alters patient self-reporting, which subsequently alters prevalence data, necessitating further revision. To stabilise the ontology, criteria are now encapsulated within the Proprietary Classification Model (PCM). Clinicians will submit symptom narratives via secure API; the system returns a classification code and a patient-facing label. The criteria exist only within the system weights. This edition describes not the patients who walk in, but the patients who will exist once the previous edition has done its work.

  **Added**
  *   **Telemetry Field: Loop-Drift.** A new metric monitoring the divergence between the prevalence a category was calibrated to and its observed prevalence two quarters after release. If loop-drift exceeds 4.5%, automatic re-anchoring is triggered. The PCM will adjust decision boundaries to restore target prevalence without human intervention. This ensures categories remain statistically robust despite behavioural adaptation in the subject population.
  *   **Guidance on Diagnostic Arbitrage.** Clinicians are advised to screen for narrative optimisation wherein patients tailor symptom reports to secure specific accommodations, medication profiles, or benefit entitlements. The PCM now flags narratives exhibiting high coherence with high-value categories. Clinicians should interrogate inconsistencies between reported distress and functional impairment. Note that arbitrage is distinct from genuine symptomatology; however, successful arbitrage may result in the instantiation of the claimed condition over time.
  *   **Dynamic Label Generation.** Patient-facing outputs are now generated contextually. Labels are optimised for adherence and reduced stigma, decoupled from the underlying technical criteria to prevent reverse-engineering.

  **Changed**
  *   **Criteria Visibility.** Diagnostic criteria are no longer published in the manual text. Access is restricted to the PCM inference engine. This prevents patients from aligning their self-conception with specific checklist items prior to assessment.
  *   **Edition Definition.** The manual is now a predictive instrument rather than a descriptive catalogue. Codes issued under Edition 12.0 assume the stabilising effects of Edition 11.5 have fully propagated through schools, insurers, and support communities.
  *   **Update Frequency.** Releases are now continuous. Version numbers will increment silently as the PCM adjusts to loop-drift. Clinicians will not be notified of minor boundary shifts to prevent anticipatory adjustment in clinical practice.

  **Deprecated**
  *   **Patient-Facing Criteria Documents.** Publication of checklists, symptom counters, and exclusionary rules is discontinued. Legacy PDFs hosted on public servers have been removed.
  *   **Semantic Quarantine.** The six-month period previously observed between ratification and publication, intended to allow professional familiarity before public exposure, is no longer required. As criteria are no longer public, there is no risk of premature leakage into the general population.

  **Known Issues**
  *   **Acquired Nosological Dependency Syndrome (ANDS).** A new presentation has been observed wherein patients cannot describe their own distress except by citing the manual's categories (e.g., "I am experiencing Episode 42-B" rather than "I feel sad"). This occurs when previous editions successfully standardise patient language beyond the utility of phenomenological description.
      *   *Workaround:* Patients presenting with ANDS require re-education whenever an edition ships. Clinicians must instruct patients to disregard previous labels and describe raw sensory or emotional data. Note that re-education is often ineffective if the patient's benefits are tied to the legacy label.
      *   *Impact:* High. ANDS complicates the PCM's ability to ingest raw narrative data. The system expects unstructured distress; it receives structured citations. This creates a secondary loop-drift where the system must classify patients based on their proficiency with the previous system's taxonomy.
      *   *Status:* Under review. The Committee is considering whether ANDS constitutes a new disorder category or a systemic error in patient intake protocols.

  **Security Notice**
  Attempts to scrape the PCM via repeated narrative submission will result in IP bans. The stability of the classification system depends on the opacity of its rules. Do not discuss classification logic with patients.
