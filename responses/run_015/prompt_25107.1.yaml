answer: |-
  **What's actually going on here**
  You're grappling with a classic problem in ethics and economics known as the problem of **causal impotence** or **imperceptible differences**. It arises when a harmful outcome (like factory farming) is caused by a collective group, but no single individual's action seems to trigger a specific harm. Your friend is arguing from a framework of **marginal utility**: he claims the supply chain is discrete (bulk orders) rather than continuous, so your single purchase doesn't cross the threshold that triggers a new order. This makes it a **collective action problem** where individual rationality (my choice doesn't matter) conflicts with collective rationality (we need fewer consumers). It's hard because complex systems have buffers, lag times, and bulk thresholds that obscure the direct line between your grocery cart and a specific animal's life. You're debating whether morality requires causal impact or if avoiding complicity matters. It challenges the link between personal integrity and actual consequence.

  **The case that my friend is right**
  Your friend's strongest argument relies on the **discrete nature of supply chains**. Supermarkets don't order one chicken at a time; they order pallets based on projected weekly sales. If they order 1,000 units and sell 999, the unsold unit is waste, not a signal to order less next week. Unless your specific abstention happens to be the exact unit that pushes sales below a reorder threshold, the order size remains identical. Given the volume of sales, the probability of you being that "marginal consumer" is vanishingly small. Mathematically, the **expected utility** of your boycott is near zero. Furthermore, he raises a crucial **opportunity cost** point. If you spend mental energy and social capital maintaining a restrictive diet that yields negligible causal impact, you divert resources from high-leverage activities like lobbying or donating to effective charities. From a purely consequentialist view, if the goal is minimizing suffering per unit of effort, political advocacy has a vastly higher return on investment than individual dietary purity. The system is designed to absorb individual fluctuations without changing output. There are buffer stocks and contractual obligations between retailers and suppliers that create "slack." Even if demand drops slightly, contracts often lock in volumes for months. Your friend is essentially arguing that you are treating a complex, buffered industrial system as if it were a simple, responsive market. Until demand drops enough to break those contractual thresholds, your individual contribution is statistically noise. This is known as the **pivotality problem**: in a system of millions, the chance any single vote or purchase tips the scale is microscopic. He might also argue that **price elasticity** is low; meat demand is inelastic, so small reductions don't lower prices enough to discourage production. If you aren't pivotal, you aren't causing a reduction in slaughter, you're just changing who eats the meat that was already produced. Therefore, your sacrifice is real, but the corresponding benefit to animals is illusory.

  **The case that i'm not wasting my time**
  The rebuttal rests on **expected value** and **signaling**. First, while the probability of being pivotal is low, the impact *if* you are pivotal is huge (saving a whole batch of animals). Expected utility is Probability × Impact. Over years of consumption, the math suggests you likely do cross thresholds occasionally, preventing some slaughter. Philosophers like Alastair Norcross argue that buying meat participates in a lottery where the prize is animal suffering; opting out refuses the ticket. Second, supply chains are becoming more data-driven. Modern inventory algorithms track sales velocity closely; persistent drops in demand *do* trigger order reductions eventually, even if not instantly. Your boycott isn't a one-off; it's a sustained signal. Third, your friend falsely separates consumption from advocacy. Individual choices shift **social norms**. When you eat vegetarian, you normalize the behavior, making political advocacy more viable. Politicians respond to constituent behavior, not just lobbyists. If vegetarianism is seen as fringe, policy change stalls. Your dietary choice acts as a signal that expands the "Overton window" for animal welfare laws. It creates a market for alternatives, driving innovation that lowers costs for everyone. When alternatives are cheaper and better, policy becomes easier. Finally, there's the **complicity argument**: even if your causal impact is zero, participating in a morally abhorrent system might be wrong independently of consequences. You avoid being part of the demand side, maintaining moral integrity regardless of the supply side's inertia. Your friend treats the supply chain as a black box, but it is composed of many small decisions that aggregate. By removing yourself, you ensure you are not part of the aggregation that *does* cause harm. Contracts renew, orders adjust. Your sustained absence from the data set matters more than a single missed purchase.

  **Your verdict**
  Your friend is mathematically rigorous but philosophically narrow. He is correct that the *immediate* causal link between one tofu purchase and one saved chicken is weak and probabilistic. In a single transaction, he's likely right: no animal was saved *today*. However, he is wrong to conclude your efforts are ethically inert. The **expected utility** argument holds: over a lifetime, you almost certainly trigger order reductions. More importantly, his separation of consumption and advocacy is false. Political change requires cultural shift; your diet is a form of cultural advocacy. If everyone adopted his view, advocacy would lack grassroots credibility. The uncertainty turns on **timeframe**. In the short term, supply chains are rigid. In the long term, they are responsive to sustained demand shifts. Your vegetarianism isn't pointless, but it isn't sufficient either. It's a necessary baseline for integrity, but not the ceiling for impact. Your friend's opportunity cost argument is valid only if the activities are mutually exclusive—they aren't. You can be vegetarian *and* donate. Dismissing consumption ignores the **expressive value** of action. While the causal chain is diffuse, it is not broken. The weight of evidence suggests individual consumption matters probabilistically, while advocacy matters deterministically. You need both. To claim one negates the other is a false dichotomy. Your friend wins on micro-economics, but loses on macro-ethics.

  **So what should i actually do**
  Keep being vegetarian. It maintains your integrity and has non-zero expected impact. However, concede the point on leverage. Don't stop at the grocery store. Allocate a percentage of the money you save on meat to high-impact animal welfare charities (like Mercy For Animals or ACE-recommended groups). This addresses your friend's opportunity cost critique without abandoning your principles. Look up "effective altruism animal welfare" to find charities with proven track records. Your diet is the floor, not the ceiling. You don't need to choose between purity and impact; you can optimize both.
