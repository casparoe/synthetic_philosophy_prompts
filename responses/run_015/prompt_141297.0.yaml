      *(Self-Correction during drafting)*: I need to make sure I don't just say "Plato says X." I need to explain *why* Plato says X in a way that addresses the user's specific puzzle about the drama. The key is the *attachment* to the shadows. The prisoners aren't passive cameras; they are *invested* gamblers.

