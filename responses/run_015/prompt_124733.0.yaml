answer: |-
  Here is the translation of the five accounts into your stack, followed by the edge case execution and the residue analysis.

  ### 1. Schema Translations

  **1. Astrobiology (Darwinian)**
  *   **Predicate:** `is_darwinian BOOLEAN`.
  *   **Constraints:** Requires `population_id FK NOT NULL`. Individual records cannot be evaluated in isolation; the constraint lives on the `population` table, not the `organism` table.
  *   **Logic:** Monotone. `has_heredity AND has_variation AND has_selection`.
  *   **Parent Pointer:** `lineage_id` must resolve to a population DAG. A null parent implies a root lineage (abiogenesis), which breaks the constraint unless flagged as `is_origin`.
  *   **Data Structure:** DAG. Horizontal gene transfer requires many-to-many lineage tables.
  *   **Failure Mode:** A lone sexually reproducing individual returns `NULL` or `FALSE` because the query requires a population context window.

  **2. Autopoiesis (Organizational Closure)**
  *   **Predicate:** `is_closed BOOLEAN`.
  *   **Constraints:** Requires `boundary_id FK NOT NULL` and a `process_table` with circular dependencies.
  *   **Logic:** Monotone. The graph of internal processes must form a closed loop where every node is produced by another node within the same `boundary_id`.
  *   **Parent Pointer:** Irrelevant. The system is defined by its boundary, not its ancestry. Null parent is acceptable if `boundary_id` is self-referential.
  *   **Data Structure:** Directed Graph with cycle detection. If the dependency graph is acyclic, it is not autopoietic.
  *   **Failure Mode:** Any external dependency (e.g., importing ATP) breaks the closure constraint, returning `FALSE`.

  **3. Replication (Information-First)**
  *   **Predicate:** `has_lineage BOOLEAN`.
  *   **Constraints:** `gene_sequence_id FK NOT NULL`. The `organism` table is a view over `gene_lineage`.
  *   **Logic:** Monotone. If `gene_sequence` persists across timesteps, `is_organism` is true for the carrier.
  *   **Parent Pointer:** `ancestor_id FK`. Must resolve. Null implies de novo sequence generation (rare).
  *   **Data Structure:** Strict Tree or DAG. The organism is ephemeral; the lineage is the persistent object.
  *   **Failure Mode:** Entities without replicators (e.g., mules) are `NULL` or demoted to `container` type.

  **4. Metabolism (Dissipation-First)**
  *   **Predicate:** `entropy_production_rate FLOAT`.
  *   **Constraints:** `energy_flux NOT NULL`.
  *   **Logic:** Polythetic/Threshold. `WHERE entropy_production_rate > threshold`. No single necessary condition, just sufficient gradient consumption.
  *   **Parent Pointer:** Irrelevant. Process-based, not entity-based.
  *   **Data Structure:** Flow Network. Nodes are chemical states, edges are fluxes.
  *   **Failure Mode:** Dormant states (spores) return `FALSE` until flux resumes.

  **5. Deflationary (Cluster)**
  *   **Predicate:** No `is_organism` column.
  *   **Constraints:** None.
  *   **Logic:** Polythetic. `tags_array` contains `{cellular, metabolizes, evolves, ...}`. Query defines the cluster at runtime.
  *   **Parent Pointer:** Optional.
  *   **Data Structure:** Property Graph.
  *   **Failure Mode:** None. "Life" is a query parameter, not a stored property.

  ### 2. Edge Case Execution

  **(a) The Chimney Fields**
  *   **Astrobiology:** `FALSE`. No `gene_sequence_id`, no heredity.
  *   **Autopoiesis:** `FALSE`. No internal process loop; shape is external constraint (flow).
  *   **Replication:** `FALSE`. No information copying.
  *   **Metabolism:** `TRUE`. `entropy_production_rate` exceeds threshold via redox gradients.
  *   **Deflationary:** `MATCH` on `dissipates` and `grows`, `NO MATCH` on `evolves`.

  **(b) The Tenant (Synthetic Cell)**
  *   **Astrobiology:** `TRUE` (if genome varies) or `NULL` (if isolated).
  *   **Autopoiesis:** `FALSE`. Fails closure check; ATP/translation dependencies point outside `boundary_id`.
  *   **Replication:** `TRUE`. `gene_sequence_id` persists.
  *   **Metabolism:** `TRUE`. Dissipates gradients.
  *   **Deflationary:** High similarity score to `cell`, low score to `independent`.

  **(c) Pando (Clonal Aspen)**
  *   **Entity Resolution:** Your classifier sees 40,000 stems. The ontology sees 1 `lineage_id`.
  *   **Astrobiology:** `TRUE` at population level.
  *   **Autopoiesis:** `AMBIGUOUS`. Is the boundary the stem or the root system? Cycle detection fails if root connections are unmapped.
  *   **Replication:** `TRUE`. One `gene_sequence_id`.
  *   **Metabolism:** `TRUE`.
  *   **Deflationary:** Returns 40,000 records with shared `clone_group_id`.

  **(d) Prions & Spores (vs. 2-Year Rule)**
  *   **Prions:** Pass Replication (template copying), Fail Metabolism (no flux). Your 2-year rule admits them if they replicate in host upon rehydration.
  *   **Spores:** Fail Metabolism while dry. Pass 2-year rule only if `viability_test` succeeds.
  *   **Conflict:** The 2-year rule is a Metabolism probe (must restart flux) but validates via Replication (growth).

  ### 3. The 2-Year Rule Translation

  Your intake rule (`dry -> wait -> rehydrate -> grow`) is a **latent variable probe**. You cannot measure `is_alive` directly, so you measure `potential_to_restart_metabolism`.
  *   **Philosophical Position:** It is secretly **Metabolism-First**, but operationally constrained by **Replication** as the verification signal.
  *   **Is it cheating?** Yes. It imposes a temporal window on a stateless property. It treats dormancy as `NULL` (unknown) rather than `FALSE` (inactive). It admits prions only if they hijack host metabolism, effectively classifying the *host-prion system* as the organism, not the prion. It rejects dormant life that fails to wake within the window, creating false negatives based on latency rather than ontology.

  ### 4. The Residue

  You asked what survives translation and what breaks.

  **Nullability vs. Indeterminacy**
  Adding `INDETERMINATE` to your `is_organism` column does not express ontological borderline cases; it expresses **missing data**. In SQL, `NULL` means "value exists but is unknown," not "property does not apply." A genuine borderline case (like the Chimney Fields) is not missing data; it is a conflict between definitions. To capture this, you need separate columns for each definition (`is_darwinian`, `is_autopoietic`), not a single nullable flag. A tri-state boolean collapses the conflict into ignorance.

  **Thresholds vs. Facts**
  Your binary classifier optimizes a loss function against a ground-truth label. This presupposes **Realism**: that there *is* a fact of the matter to predict. The Deflationary account denies this. If life is a cluster concept, there is no ground truth, only query utility. By training a classifier, you are smuggling in a Realist assumption. You are forcing a cluster problem into a classification box. The error rate isn't noise; it's the signal that the category is leaky.

  **"Really" vs. "Filed As"**
  Your schema cannot distinguish `really_alive` from `filed_as_alive`. The database records assertions, not realities. The distinction exists only in the **downstream consumer logic**. When a funder asks for "organisms," they usually mean "entities eligible for grants," not "entities satisfying Aristotle." Your schema encodes policy, not nature.

  **The Verdict**
  The residue is not a defect of your vocabulary; it is a sign that the debate is not about ontology. It is about **downstream consumers**.
  *   **Planetary Protection** wants Metabolism-First (don't contaminate gradients).
  *   **Patent Law** wants Replication-First (who owns the lineage?).
  *   **Ethics** wants Autopoiesis-First (what has a perspective?).
  *   **Biobanking** wants Viability-First (will it grow in the drawer?).

  Your `ORGANISM` flag is a collision of these requirements. The "fight" persists because nobody wants to admit that "life" is a proxy for "eligibility." If you split the column into `is_eligible_for_grant`, `is_biosafety_risk`, and `has_evolutionary_lineage`, the philosophical tension vanishes. The residue remains only because you are trying to compress multiple downstream use-cases into a single boolean flag. The schema isn't broken; the requirement to have one flag is.
