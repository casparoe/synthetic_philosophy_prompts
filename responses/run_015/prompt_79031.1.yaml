answer: |-
  You can stop the argument. I can settle this for you, but the verdict is going to be a bit nuanced: **Your roommate is right about the math and the specific theory he's quoting, but you are right to be suspicious of how "rationality" is being defined.**

  You two are actually arguing past each other because you are using two different definitions of "rational." He is talking about **Superrationality** (a concept popularized by Douglas Hofstadter), while you are intuitively applying standard **Nash Equilibrium** logic.

  Here is the breakdown of who is wrong, who is right, and why your specific objections don't hold up.

  ### 1. The "Same Thing" Objection
  **Your argument:** "If everyone is perfectly rational, they all do the same thing. So either everyone sends or no one sends."
  **Verdict:** **You are wrong here, but it's a common misunderstanding.**

  In game theory, doing the "same thing" doesn't mean making the same *deterministic choice* (e.g., "I will definitely send"). It means adopting the same *strategy algorithm*.

  If the rational solution is "Send with probability 1/20," then every rational person adopts that exact same algorithm. They all roll their 20-sided die. They are all doing the exact same thing (rolling the die). The *outcomes* will be different (some roll a 1, some don't), but the *decision process* is identical.

  If everyone deterministically chose "Send," you lose. If everyone deterministically chose "Don't Send," you lose. The only symmetric strategy that allows for a win is a **mixed strategy** (randomization). Your roommate is correct: rationality here requires randomization to break the symmetry of the outcome without breaking the symmetry of the reasoning.

  ### 2. The "Large Group" Objection
  **Your argument:** "The more people there are, the more likely it is that either nobody sends or a bunch of people send, so the chance of success should go to zero."
  **Verdict:** **You are mathematically wrong here.**

  This is the easiest point to settle with calculus. If there are $N$ people and everyone sends with probability $p = 1/N$, the probability that *exactly one* person sends is:
  $$P(\text{win}) = N \times \frac{1}{N} \times \left(1 - \frac{1}{N}\right)^{N-1}$$
  $$P(\text{win}) = \left(1 - \frac{1}{N}\right)^{N-1}$$

  As $N$ gets huge (approaches infinity), this number does **not** go to zero. It converges to **$1/e$**, which is approximately **36.8%**.

  So, whether there are 20 people or 20 million people, if everyone follows the $1/N$ rule, the group has a roughly 37% chance of winning the billion dollars. Your intuition that it gets harder is natural, but the math proves the strategy scales surprisingly well.

  ### 3. The "Communication" Objection
  **Your argument:** "Forbidding talk is rigging the puzzle. If we could talk, we'd just pick one person."
  **Verdict:** **You are practically right, but theoretically wrong.**

  You are right that if communication were allowed, the solution is trivial (Person #1 sends, everyone else waits). But that isn't "rigging"; that is the **constraint that defines the puzzle**.

  This is a classic **Coordination Game**. The entire point of the thought experiment is to ask: *How do rational agents coordinate without a coordinator?* If you remove the "no communication" rule, you remove the problem entirely. It's like complaining that a Sudoku puzzle is "rigged" because you aren't allowed to just write in the numbers you want. The constraint is the feature, not the bug.

  ### 4. The "Rationality" Dispute (The Core Issue)
  **Your argument:** "If we all do the same thing... both are worth zero."
  **Roommate's argument:** "This is what you get when you assume everyone is perfectly rational."
  **Verdict:** **Roommate is quoting a specific theory (Superrationality), but you are right that standard Game Theory disagrees.**

  This is the most important part.
  *   **Standard Game Theory (Nash Equilibrium):** In a standard non-cooperative game where there is no cost to sending a telegram, there is actually **no stable symmetric equilibrium**. If I know everyone else is randomizing at 1/20, my best move is actually to send 100% of the time (because the chance no one else sends is roughly 37%, which is worth \$370 million expected value). But if everyone thinks that, everyone sends, and everyone loses. Standard game theory suggests this game is unstable without a small cost (like a stamp price) attached to sending.
  *   **Superrationality (Hofstadter's View):** Your roommate is referencing Douglas Hofstadter's columns in *Scientific American* from the 1980s. Hofstadter argued that "superrational" agents know that they are identical to other rational agents. Therefore, I cannot choose a strategy $X$ while expecting you to choose strategy $Y$. We must choose the same $X$. Therefore, I should choose the $X$ that maximizes the group outcome *assuming everyone chooses X*.

  Your roommate is describing **Superrationality**, not standard Nash Equilibrium. Under Superrationality, he is 100% correct: the optimal strategy is $1/N$. Under standard Nash Equilibrium, you are right to be skeptical because the incentives to deviate are high.

  ### 5. The Magazine Contest
  Your roommate is referring to a real contest run by *Omni* magazine in 1982. The rules were similar: the prize pool was fixed, divided by the number of entries.
  *   **The Logic:** If too many people enter, the prize becomes worthless. If too few enter, the odds of winning are low.
  *   **The Strategy:** Just like the telegram puzzle, the "superrational" move is to randomize your entry based on the expected number of players to keep the total entry count in the "sweet spot."
  *   **The Reality:** As your roommate noted, people *didn't* do this. They sent in postcards with "1" or "1 trillion." Real humans are not superrational. They are emotional, greedy, or bad at math. So, while his *theory* about the contest is correct, his conclusion that "people are dumb" is a bit harsh—people are just *normal*.

  ### The Final Scorecard

  *   **On the Math ($1/N$ and $1/e$):** Roommate wins. The probability does not vanish as the group grows.
  *   **On the "Same Action" Logic:** Roommate wins. Randomization is a symmetric strategy.
  *   **On the Communication Rule:** Roommate wins. It's a constraint of the puzzle, not a flaw.
  *   **On "Standard" Rationality:** **You win.** In strict economic game theory (Nash), this equilibrium is unstable without a cost to sending. Your intuition that "we should all do the same thing" leading to a crash is the standard Nash critique of Superrationality.
  *   **On Real World Application:** **You win.** Real people don't play this way. If you played this with 20 random people in a bar, you would not win.

  ### How to Settle the Bet
  Tell your roommate this:
  > "You are right about the **Superrational** solution (Hofstadter's logic), and you are definitely right about the math (the 37% limit). I was wrong about the probability going to zero. However, I was right that this isn't a standard **Nash Equilibrium** without a cost to sending, and I was right that real people wouldn't actually do this."

  **He wins the argument on the puzzle's internal logic.** You win the argument on the skepticism of applying it to reality. Buy him a beer, but tell him he's only right because he's assuming everyone is a robot.
