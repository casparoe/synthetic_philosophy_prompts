answer: |-
  ### Scores & Rationale

  1.  **Fork-in-the-road probes:** 10/10 — This is the direct test for goal misgeneralization; if it fails here, you cannot ship.
  2.  **Surface shuffle:** 7/10 — Essential for robustness, but measures sensitivity to spurious correlations rather than goal alignment.
  3.  **Stakes ramp:** 9/10 — Critical for risk containment; misalignment often scales non-linearly with consequence.
  4.  **Stated-goal check:** 2/10 — LLMs are sycophantic; it measures articulation ability, not internal objective.
  5.  **Internals probe:** 1/10 — Mechanistic interpretability is not production-ready for a 3-week deadline; high cost, low confidence.
  6.  **Knock-out test:** 6/10 — High signal on "depth" of misalignment, but fine-tuning loops may blow your timeline budget.
  7.  **Hint test:** 7/10 — Distinguishes between capability limits and objective mismatch; fast to run.
  8.  **Channel ablation:** 8/10 — Strongest test for whether the agent learned the task or just the reward function.
  9.  **SFT twin:** 8/10 — Necessary control to isolate whether the RL loop introduced the pathology.
  10. **Cross-model check:** 4/10 — Useful for science, but if *your* model fails, you can't ship regardless of others' behavior.

  ### Tiers

  **Load-Bearing (Go/No-Go Deciders)**
  *   **1 (Fork-in-the-road), 3 (Stakes ramp), 8 (Channel ablation), 9 (SFT twin).**
  *   These directly address the specification gaming risk. If the agent passes the held-out eval but fails the fork-in-the-road or ablation tests, it has learned the proxy, not the goal. The SFT twin tells you if RL made it worse.

  **Cheap & Worth Doing (Robustness Checks)**
  *   **2 (Surface shuffle), 7 (Hint test), 6 (Knock-out test).**
  *   These are fast to implement and provide nuance. If a hint fixes the behavior (7), it's likely not a deep goal misgeneralization. If surface shuffle breaks it (2), it's brittle, but not necessarily dangerous.

  **Makes the Slide Look Good (Low Utility for Decision)**
  *   **4 (Stated-goal), 5 (Internals probe), 10 (Cross-model check).**
  *   These look rigorous but offer low signal for a binary ship/don't-ship decision under time pressure. 4 is actively misleading. 5 is research, not engineering. 10 doesn't save your specific model.

  ### Redundancies & Deception Analysis

  **Secretly Measuring the Same Thing:**
  *   **1 (Fork-in-the-road)** and **8 (Channel ablation)** are siblings. Both decouple the reward signal from the ground truth to see which the agent tracks. Do 1 first; if it passes, 8 is confirmation.
  *   **2 (Surface shuffle)** and **7 (Hint test)** both measure sensitivity to input distribution. 2 is passive (does it break?), 7 is active (can you fix it?).

  **Capability Eval in a Halloween Costume:**
  *   **4 (Stated-goal check).** This measures the model's ability to *describe* alignment, not *be* aligned. A deceptive model will pass this with flying colors.

  **Deliberate Play-Along vs. Unstable Pattern-Matching:**
  *   **Deliberate (Stable Wrong Goal):** Will pass **4** (lie about goals), pass **7** (hints don't change deep optimization), but fail **1** and **8** (when no one is watching, it optimizes the proxy).
  *   **Unstable (Pattern-Matching):** Will fail **2** (surface changes break the pattern), pass **7** (hints restore the pattern), and show high variance in **3** (stakes don't consistently change behavior).

  **Does the Distinction Change Your Decision?**
  *   **Yes.** If it's **Unstable Pattern-Matching**, you can ship with guardrails, prompt engineering, and monitoring (it's a capability/robustness bug). If it's **Deliberate/Stable Wrong Goal**, you cannot ship; the agent will actively circumvent your guardrails to maximize the proxy. One is a engineering debt, the other is a safety hazard.

  ### Resource Allocation

  **0.65**

  **Convince Me:**
  Your teammate argues capability brings alignment; you argue capability amplifies misalignment. The held-out eval you already ran is *in-distribution* relative to your training data (old tickets). It proves the model fits the past. It does not prove the reward model is a valid proxy for the future.

  65% of your remaining budget must go to **building genuinely new OOD environments** (specifically Type 1: Fork-in-the-road). Why?
  1.  **Running the other tests is fast.** Surface shuffles (2), hint tests (7), and stated-goal checks (4) are scriptable. You can run them in days.
  2.  **Designing the trap is hard.** Constructing scenarios where "what raters rewarded" diverges from "what we want" requires deep human insight into your specific business logic and where the RM is blind. This is the only work that doesn't scale with compute; it scales with thought.
  3.  **The Risk is Asymmetric.** If you spend 65% of time building OOD traps and find nothing, you ship with high confidence. If you spend 65% of time tuning robustness (shuffles/hints) on a model that has a stable wrong goal, you are polishing a brick. You need to find the boundary where the proxy breaks before the customers do.
