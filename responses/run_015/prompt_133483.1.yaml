answer: |-
  You secretly draw a birth-rank card from one of three hidden populations, bet chips on whether total population N is under or over 200 billion based on that rank, and only learn which population you actually belong to after the wager is locked.

  ### Rules
  1.  **Setup:** There are 3 rounds. In each round, the Instructor selects one of three secret decks (Humans, Minds, or Sims) but doesn't tell you which one.
  2.  **Draw:** Each student draws one card from the active deck. Keep your number secret. The number is your "observer rank" (e.g., #85 Billion).
  3.  **Philosopher Phase:** The designated "Flat-Prior Philosopher" for the round reminds everyone that priors on total population $N$ must be uniform. You must justify your bet using your rank number and the assumption that you are a random sample from the total population.
  4.  **Betting:** You bet 1–5 chips on "UNDER 200B" or "OVER 200B."
  5.  **Reveal:** The Instructor reveals which deck was actually used and the *True N* for that deck. Bets are resolved.
  6.  **Rotation:** A new student becomes the Flat-Prior Philosopher each round.

  ### Roles
  *   **13 Bettors:** Try to maximize chips using anthropic reasoning.
  *   **1 Flat-Prior Philosopher:** Cannot bet. Their job is to interrupt anyone giving vague intuition and demand they cite their rank number relative to uniform priors on $N$. (e.g., "If you're rank 80B, why does that favor small N?")
  *   **Instructor (You):** Holds the decks, tracks chips, manages time.

  ### Chip Payoffs
  *   **Stake:** Everyone starts with 10 chips (use candy, poker chips, or paper slips).
  *   **Wager:** Min 1, Max 5 chips per round.
  *   **Win:** Gain amount wagered (e.g., bet 3, win 3).
  *   **Lose:** Lose amount wagered.
  *   **Prize:** Student with most chips after 3 rounds picks the topic for next week.

  ### Materials (10-min Prep)
  *   **3 Envelopes:** Label them "Deck A," "Deck B," "Deck C."
  *   **42 Index Cards:** Write observer ranks on them.
      *   *Deck A (Humans):* 14 cards numbered between 60B and 95B. (True N = 100 Billion).
      *   *Deck B (Minds):* 14 cards numbered between 60B and 95B. (True N = 500 Billion).
      *   *Deck C (Sims):* 14 cards numbered between 60B and 95B. (True N = 10 Trillion).
      *   *Note:* The numbers are identical across decks to force the reference class shift to do the work.
  *   **Chips/Candy:** Enough for 140 units total.
  *   **Whiteboard:** To track scores and the "True N" reveals.
  *   **Timer:** Phone or watch.

  ### Timeline (90 Minutes)
  *   **00–10: Intro & Deal:** Explain rules. Hand out 10 chips each. Select Round 1 Philosopher.
  *   **10–30: Round 1 (The Pull):** Use Deck A (Humans). Students draw, debate under Philosopher's watch, bet. Reveal Deck A (True N=100B). Most should bet UNDER based on DA logic. Resolve chips.
  *   **30–50: Round 2 (The Shift):** Use Deck B (Minds). Select new Philosopher. Students draw (same rank numbers likely). Reveal Deck B (True N=500B). Those who bet UNDER lose. Discuss why their rank felt different.
  *   **50–70: Round 3 (The Dissolve):** Use Deck C (Sims). Select new Philosopher. Reveal Deck C (True N=10T). Bet OVER wins. Highlight how "rank #85B" went from "late human" to "early sim."
  *   **70–90: Debrief:** Map mechanics to theory (see below). Count chips. Award prize.

  ### Debrief Guide
  *   **Round 1 (SSA & DA):** Map the "Under" bet to the Self-Sampling Assumption. If you assume you're a random human, being #85B makes a total population of 100B much more likely than 100T (likelihood ratio $\frac{1/100B}{1/100T} = 1000$). This is the Doomsday Argument pull.
  *   **Round 2 & 3 (Reference Class):** Show how expanding the class from "Humans" to "Minds" or "Sims" changes the denominator. Your rank didn't change, but your *location* in the total set did. The DA dissolves because the reference class was arbitrary.
  *   **The Philosopher Role (Presumptuous Philosopher):** Ask the Philosopher why they enforced uniform priors. This maps to the objection that SIA (Self-Indication Assumption) favors worlds with more observers. If you bet heavily on "Over" in Round 3 just because there *could* be more sims, you're acting like the Presumptuous Philosopher—assuming you exist in the bigger world without prior evidence.
  *   **Limitation Note:** Verbally clarify that the game fixes the "True N" for each deck, whereas in reality, we don't know the true N or the prior probability of these worlds existing. The game simulates the *conditional* probability shift, not the *meta-prior* problem of whether sims are real.
  *   **What Will Go Wrong:** First run, students will forget their card number before the reveal, ruining the "self-locating" tension—make them write it on their hand. Second, the Philosopher might stall debate by demanding perfect Bayesian updates; tell them to keep it punchy or you'll veto them. Also, expect confusion on whether they are betting on the *deck type* or the *N value*—remind them the target is strictly "Is N > 200B?" regardless of deck name.
