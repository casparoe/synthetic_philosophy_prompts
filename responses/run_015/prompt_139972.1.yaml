      The user says "meddlesome preferences can't trigger anyone's right." In the case, this is used to block Pareto. If Bo's preference for $x$ over $y$ is meddlesome, it doesn't count for Pareto. So Pareto doesn't demand $x$. Then Rights decide.
      The contradiction is: Why does a meddlesome preference not count for *welfare* if welfare is *just* preference satisfaction?
      Answer: Because you aren't really a welfarist. You're a liberal pluralist.
