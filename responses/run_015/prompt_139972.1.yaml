  9.  **Refining the "Meddlesome" Point:**
      *   The user defines meddlesome as counterfactual ("wouldn't hold it if they didn't know"). This is essentially a "conditional preference."
      *   Gibbard (1974) dealt with this via "waiver."
      *   The user claims it's different. It *is* different if grounded in a theory of *sovereignty* rather than just preference stability.
      *   But if the foundation is Welfarism (1), sovereignty doesn't matter, only satisfaction matters. So (1) kills (4).

  10. **Refining the Game Form Point:**
