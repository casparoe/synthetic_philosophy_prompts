      *   (2) **Minimal Liberalism (ML):** Rights as side constraints (decisiveness over private pairs), not tie-breakers.
      *   (3) **Acyclicity:** Required for policy evaluation (no cycling).
      *   (4) **The Escape (Meddlesome Preferences):** Preferences are "meddlesome" if they depend on others' private conduct. Meddlesome preferences don't trigger rights (wait, the text says "can't trigger anyone's right" - need to check if this means *exercising* the right or *counting* the preference for Pareto). *Correction:* The text says "meddlesome preferences can't trigger anyone's right." This is ambiguous. Does it mean the meddler loses their vote on that pair? Or the right-holder loses their right? Context suggests it means meddlesome preferences are excluded from the social calculation regarding that right. Let's look at the case verdict.
      *   (5) **Methodological Comfort:** Rights as restrictions on feasible sets (game forms), not social ordering entries. Paradox is an artefact of ordering.
      *   (6) **Case Verdict:** Outcome $y$ (Bo reads, Ana doesn't). Ana's right (not to read/reading) and Bo's right (reading/not reading) are exercised. Unanimous preference for $x$ (Ana reads) is overridden.
      *   **Anxiety (i):** WP vs. Rights (Welfarism vs. Trumps).
      *   **Anxiety (ii):** Filtering preferences $\rightarrow$ Incompleteness $\rightarrow$ Downstream issues.

  3.  **Analyze the Case (The "Offensive Novel"):**
      *   Alternatives: $z$ (neither), $x$ (Ana), $y$ (Bo).
      *   Ana: $z \succ x \succ y$. (Personal right pair: $\{x, z\}$? Or $\{x, y\}$? Usually, liberal rights are over *own* action. So Ana decides between reading ($x$) and not reading ($z$ or $y$). Bo decides between reading ($y$) and not reading ($z$ or $x$).)
      *   Bo: $x \succ y \succ z$. (Prefers Ana reads most).
      *   Cy: $x \succ y \succ z$. (Busybody).
      *   User's Verdict: $y$ is chosen.
