          *   *Cost:* You lose the crisp binary definition of what makes an 'a'. The theory becomes fuzzier.
      *   **Fixing (3):** Maybe the backbone isn't "invariant connectivity" but "intended connectivity."
          *   *Revision:* The backbone is what the writer *intended*, not necessarily what is physically drawn.
          *   *Cost:* Moves the definition from visual/structural to mental/intentional. Harder to verify objectively.
