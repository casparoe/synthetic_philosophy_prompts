      *   *Tone:* Analytical, rigorous, sticking strictly to the provided text.
      *   *Check Constraints:* No books, no authors, no "Letter Spirit."

      *(Self-Correction during drafting)*: I need to be careful with (2) vs (3). The user asks if positing a hidden backbone undermines the "rule-free" claim. If the backbone *exists*, is it a rule? If the brain doesn't *use* it as a rule (per 8), is it still a rule? I should argue that (3) describes the *territory* while (2) describes the *map-making process*. They are compatible unless (3) claims the brain *explicitly checks* the backbone. (3) says "This backbone... explains why... learning succeeds." This implies the backbone is the *reason*, not necessarily the *method*. I will classify this as a "Look-alike" tension.

      *(Refining the (5) vs (6) conflict)*: (6) says handwriting *constantly* breaks the backbone. (5) says if you break it, it stops being an 'a'. This is a straight contradiction. (9) reinforces this. This is the critical failure point.

      *(Refining the Single Change)*: Changing (5) is the obvious choice. But simply saying "sometimes it's okay" is weak. A better revision is to shift (5) from physical presence to *recoverability*. The backbone doesn't need to be *drawn*, it needs to be *inferable*. This saves (6) (we infer the closed loop even if open) and (9) (we infer the connection between dots). It keeps (3) (the ideal structure exists) and (2) (we learn to infer it).

