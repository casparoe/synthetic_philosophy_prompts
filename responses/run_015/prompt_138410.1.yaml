answer: |-
  Here is the analysis of the Panel's precedents, the likely outcome for the Sowerby case, and the principles at stake.

  ### The Three Rules of the Panel
  Based on the four precedents and the "Never" constraint, the Panel is operating on three unwritten rules that function as a hierarchy:

  1.  **The "Organic Grievance" Rule:** We do not remove names based solely on new historical information discovered by experts. Removal requires a pre-existing, organic campaign from a local community that feels ongoing harm (Creel). When the grievance arises *only after* a historian's report, we contextualize rather than remove (Voss, Frontier).
  2.  **The "Locus of Harm" Rule:** We remove names when the harm was inflicted upon *this city's* people or systems (Creel's local legacy of slavery; Calloway's local segregated schools). We retain names when the harm was national, abstract, or external to the city (Voss's national sterilization law; Frontier Wars' external conflict).
  3.  **The "Institutional Sensitivity" Rule:** Schools are held to a higher standard of inclusivity than statues or memorials because they serve vulnerable children (Calloway renamed vs. Voss statue kept). However, this rule is subordinate to Rules 1 and 2.

  ### Application to Wilf Sowerby
  *   **Organic Grievance:** Weak. The Kenyan community's objection followed the historian's discovery. It does not meet the "campaign for years" threshold of the Creel case.
  *   **Locus of Harm:** External. The abuse occurred in Kenya. While there is a Kenyan community *now* in the city, the harm was not inflicted upon the city's own historical systems or population (unlike Calloway or Creel).
  *   **Institutional Sensitivity:** High. It is a primary school, which usually pushes toward removal (Calloway).

  ### Prediction: The Outcome
  **The Panel will vote to name the school after Sowerby, but mandate a permanent counter-inscription in the entrance hall detailing his colonial service.**

  **Why:** The Panel is risk-averse. Overturning the "Never" rule (Rule 1) sets a dangerous precedent where any historian's discovery can trigger a removal vote, creating endless work and political instability. Furthermore, Rule 2 (Locus of Harm) favours retention because the abuse happened overseas, making it a Voss-style case rather than a Calloway one. The "School" status (Rule 3) will be satisfied by the counter-inscription, which signals "we know the truth" without erasing the alumni's memories.

  ### The Precedents
  *   **Closest Analogue:** **Dr. Marianne Voss.**
      *   *Why:* In both cases, the figure did significant local good (Sanitation/School) while committing human rights abuses elsewhere/nationally (Sterilization/Kenya). In both cases, the Panel argued the good work was "separable" enough to retain the name, provided the bad work was acknowledged via a plaque.
  *   **The Dishonest Precedent:** **Calloway Primary.**
      *   *Why:* Panel members arguing for removal will reach for Calloway, insisting "a school is a school." This is dishonest because Calloway's harm was *local* (he designed *this city's* segregated schools). Sowerby's harm was colonial and external. Using Calloway ignores the "Locus of Harm" rule to suit a moral preference for removal.

  ### The Test Case
  To distinguish whether the Panel truly follows the "Locus of Harm" rule or if they are simply becoming stricter on schools generally, you need this case:

  **The Hypothetical:** A local sports centre is proposed to be named after a beloved local coach. A historian reveals that 30 years ago, while working for a different club in *another country*, he systematically abused young players there. A community group from that country, now living here, objects. There are no local victims.

  *   **If you keep the name (with plaque):** You confirm the "Locus of Harm" rule is real (External harm = Context, not removal).
  *   **If you remove the name:** You confirm the "Institutional Sensitivity" rule is dead and a new "Moral Purity" rule is in effect (Any abuse = Removal, regardless of location).

  ### Principles at Stake
  If you believe the precedents are too contradictory to settle this (which is a defensible position given the Calloway/Voss tension), here is what each option commits the city to:

  *   **Naming it after Sowerby (No Plaque):** Commits to **Local Memory over Global Justice.** It asserts that what he did for *our* children outweighs what he did to *their* grandparents. It prioritizes the alumni's emotional ownership of the school.
  *   **Naming it with a Counter-Inscription:** Commits to **Complex Truth.** It asserts that public space should be uncomfortable if necessary. It attempts to hold two truths at once (he was a good headmaster *and* a torturer), placing the burden of interpretation on the viewer.
  *   **Renaming it (e.g., after the Pupils):** Commits to **Safety over History.** It asserts that no individual is safe from re-evaluation and that the function of the school (inclusivity for current Kenyan pupils) trumps the historical record. It effectively validates the "Historian's Veto."
  *   **Naming it after the Pupils (Specific Fundraisers):** Commits to **Community Ownership.** It sidesteps the historical figure entirely, suggesting that schools belong to the living community, not the dead. This avoids the moral dilemma but disappoints the alumni.

  **My Advice:** If you want to protect the Panel from future chaos, stick to the **Voss** precedent (Name + Plaque). If you break the "Never" rule on historian discoveries, you will never run out of work.
