  ### Brainstorming & Filtering

  **Objections Considered:**
  1.  **The "Slavery" Objection (Nozick):** Argues that taxing earnings is akin to forced labor. *Discard.* Too reliant on libertarian self-ownership premises; Voss will dismiss it as a category error regarding justice vs. liberty.
  2.  **The "Expensive Tastes" Objection (Cohen):** Argues that subsidizing cultivated tastes is unfair. *Keep,* but shift focus from subsidy to the *epistemology* of classification (how do we know it was chosen?).
  3.  **The "Abandonment" Objection (Anderson):** Argues luck egalitarianism abandons the reckless to starvation. *Keep,* but frame it as a feature of the principle, not a bug of the currency, to block her stock move.
  4.  **The "Constitutive Luck" Regress (Nagel):** Argues that choices trace to character, which is luck. *Keep,* but press on the "practice" boundary she uses to stop the regress.
  5.  **The "Levelling Down" Objection (Parfit):** Argues that equality for its own sake can be worse for everyone. *Keep,* as it tests the core commitment to equality vs. welfare.
  6.  **The "Market Aggregation" Problem (Scheffman):** Argues talent value depends on social context, not individual choice. *Keep,* as it undermines the "option luck" status of market income.

  **Discarded:** The "Slavery" objection (too ideological for this room) and generic "implementation cost" worries (too empirical/technocratic). The selected six provide the structural pressure needed to block her defensive moves.

  ***

  ### Interview Questions

  **Question 1: The Fairness of the Gamble**
  *   **The Line:** When you say we bear the costs of risks we willingly take, does the justice of that outcome depend on whether the gamble was fairly priced, or just on the fact that you could have walked away?
  *   **Likely Answer:** It depends on the voluntariness of the choice, not the fairness of the odds.
  *   **Follow-up:** So if the only available gambles are rigged against me due to background inequality, does my loss count as option luck or brute luck?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). This forces her to defend the *conditions* of the principle, not just the metric.
      *   **Status:** Live controversy. Specialists debate whether "option luck" requires fair background conditions or merely formal voluntariness.
      *   **Smuggled Assumption:** A specialist might note you are assuming "fair pricing" is coherent without a prior theory of justice, but this is necessary to press the point.

  **Question 2: The "Bad Gambles" Scenario**
  *   **The Line:** Imagine a society where every available gamble is a bad one, so taking any risk lowers your expected welfare. Does your view require us to compensate people for taking those risks, or does it say they chose poorly?
  *   **Likely Answer:** If the choice set is constrained by injustice, that's brute luck.
  *   **Follow-up:** But how do you distinguish a constrained choice set from a world where all options are simply risky without any prior injustice?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It prevents her from saying the hardship is just the result of bad choices.
      *   **Status:** Live controversy. This touches on structural injustice versus natural scarcity.
      *   **Smuggled Assumption:** You are assuming "expected welfare" is the metric for a bad gamble, which a resource-based egalitarian might reject, but it holds for a general audience.

  **Question 3: Expensive Tastes Classification**
  *   **The Line:** Let's set aside subsidizing champagne and look at the classification itself: how do you distinguish a taste I cultivated from one I simply woke up with, given that my capacity to cultivate tastes is itself luck?
  *   **Likely Answer:** We look at whether the agent identified with the taste over time.
  *   **Follow-up:** Doesn't that just push the luck problem back to whether they had the psychological resources to identify with it?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 2 ("Needs a practice"). It attacks the practice's ability to draw a non-arbitrary line.
      *   **Status:** Live controversy. The "endorsement" constraint is standard but heavily contested regarding constitutive luck.
      *   **Smuggled Assumption:** You are assuming psychological resources are luck, which compatibilists might deny, but it's a standard luck egalitarian premise.

  **Question 4: Market Aggregation**
  *   **The Line:** In a market economy, the value of my talents depends on everyone else's simultaneous choices, which is nobody's choice in particular; does that make the return on my talents option luck or brute luck?
  *   **Likely Answer:** It's option luck because you chose to develop those talents for the market.
  *   **Follow-up:** But if the value fluctuates based on others' choices, aren't you treating social contingency as individual responsibility?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It challenges whether market income can ever be truly "option luck."
      *   **Status:** Live controversy. This is a central tension between luck egalitarianism and market democracy.
      *   **Smuggled Assumption:** You are assuming talent value is entirely social, whereas some argue intrinsic productivity exists, but the marginal point stands.

  **Question 5: Levelling Down**
  *   **The Line:** Can your view be stated so that it never requires levelling down, or is equality sometimes valuable even when it helps no one?
  *   **Likely Answer:** No, luck egalitarianism is concerned with justice, not overall value.
  *   **Follow-up:** If it's only valuable when it helps someone, isn't the view collapses into prioritarianism?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It forces her to admit if equality is merely instrumental.
      *   **Status:** Settled among specialists (most reject the levelling down objection), but live regarding whether luck egalitarianism is committed to it.
      *   **Smuggled Assumption:** You are assuming "levelling down" is undesirable, which strict egalitarians deny, but most moderates agree with you.

  **Question 6: Extensional Equivalence**
  *   **The Line:** If we assume a standard background risk policy, does your view tell a finance minister anything different than luck-weighted prioritarianism would?
  *   **Likely Answer:** Yes, it treats compensation for brute luck as a right, not a weighting.
  *   **Follow-up:** But if the policy prescriptions are identical, what work is the distinction doing besides moral semantics?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It challenges the practical distinctiveness of the principle.
      *   **Status:** Live controversy. The "equivalence claim" is a major debate in contemporary distributive justice.
      *   **Smuggled Assumption:** You are assuming policy prescriptions *would* be identical, which depends on the weighting function, but it's a fair hypothetical.

  **Question 7: The "No Luck" World**
  *   **The Line:** Imagine a world with no luck at all, where every outcome traces perfectly to effort. Does your view still require redistribution if everyone ends up unequal?
  *   **Likely Answer:** No, if it's all effort, the inequality is just.
  *   **Follow-up:** So the view has no content in a world of perfect agency, which suggests it's really a view about mitigating agency's limits?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 2 ("Needs a practice"). It clarifies the scope of the view regarding luck vs. agency.
      *   **Status:** Settled conceptually. This is a standard coherence test for luck-based views.
      *   **Smuggled Assumption:** You are assuming a "no luck" world is conceivable, which hard determinists deny, but it works as a thought experiment.

  **Question 8: Constitutive Luck Boundaries**
  *   **The Line:** You say the view needs a practice rather than desert, but who gets to define the boundaries of that practice without invoking the very constitutive luck you're trying to bracket?
  *   **Likely Answer:** The boundaries are set by what agents can reasonably be expected to manage.
  *   **Follow-up:** And isn't what they can reasonably manage itself determined by their constitutive luck?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 2 ("Needs a practice"). This is a direct attack on the stock move's coherence.
      *   **Status:** Live controversy. This is the core metaphysical objection to luck egalitarianism.
      *   **Smuggled Assumption:** You are assuming "reasonable expectation" is luck-sensitive, which institutionalists might deny, but it's the crux of the regress.

  **Question 9: Abandonment as Feature**
  *   **The Line:** When someone knowingly takes a risk and loses everything, your principle says we can let them starve. Is that harshness a bug in the application or a feature of the principle?
  *   **Likely Answer:** It's a feature of respecting agency, not a bug.
  *   **Follow-up:** But if respecting agency leads to outcomes we universally recognize as unjust, why trust the principle over the intuition?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It forces her to own the harshness as principled, not accidental.
      *   **Status:** Live controversy. This is the central political objection (Anderson vs. Cohen).
      *   **Smuggled Assumption:** You are assuming "universally recognized as unjust," which libertarians deny, but for a general policy audience, it holds.

  **Question 10: Falsification**
  *   **The Line:** What empirical or institutional finding would count as evidence against your view, rather than just evidence that we're implementing it poorly?
  *   **Likely Answer:** If we found that responsibility tracking increased overall suffering without reducing inequality.
  *   **Follow-up:** So is the view ultimately constrained by a prioritarian ceiling?
  *   **Context & Strategy:**
      *   **Move Disabled:** Move 1 ("Objection to currency"). It tests whether the view has empirical stakes or is purely conceptual.
      *   **Status:** Live controversy. Methodological debates about normative ethics and empirical evidence are ongoing.
      *   **Smuggled Assumption:** You are assuming normative views *can* be falsified empirically, which some meta-ethicists deny, but it's crucial for policy listeners.
