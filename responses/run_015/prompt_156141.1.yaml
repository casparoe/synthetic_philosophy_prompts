  2. He maintains that utility is strictly a bookkeeping index for choice dispositions, so any intensity probe contradicting choice data is simply measuring a different, irrelevant disposition. I maintain that utility names a real mental magnitude of wanting, so the intensity probe provides superior welfare evidence than noisy choices when the two diverge.

  3. The first crux is whether a stable, predictive intensity probe counts as a measurement of preference rather than just cheap talk. The second crux is whether persistent cycling under full feedback constitutes a rational expression of context-dependent value or a failure of agency that welfare analysis should correct.

  4. We accept the stipulated fact that the intensity probe predicts choices better than past choices, where he predicts policy should remain choice-based and I predict we should switch to probe-based metrics. We accept the stable cycling and bus case data, where he predicts surplus captures all relevant loss and I predict the probe reveals a threefold underestimate.

  5. We acknowledge much argument was verbal disputes over whether "preference" refers to choice or mental states, which a shared glossary could resolve. However, I would move if choice consistently outpredicted the probe on welfare outcomes, and he would move if the probe were shown to track a normative standard of well-being independent of choice.
