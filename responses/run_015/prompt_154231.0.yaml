  **JOINT STATEMENT ON THE PHENOMENOLOGY AND MECHANICS OF SELF-DECEPTION**

  **Signatories:** The Deflationary Coalition (Impossibilists) and The Partitionist Coalition (Possibilists)
  **Date:** October 26, 2023
  **Subject:** Findings following Adversarial Collaboration on the Nature of Self-Deception

  **PREAMBLE**

  We, the undersigned representatives of two distinct philosophical and psychological traditions regarding self-deception, hereby submit this joint statement. Following a period of structured adversarial collaboration, we seek to delineate exactly where our models of human cognition converge, where they diverge, and what empirical or conceptual resolutions would be required to bridge the gap. We acknowledge that while our terminology often diverges, our commitment to describing the observable human condition is shared.

  **I. AREAS OF SUBSTANTIVE AGREEMENT**

  Both coalitions accept the following claims as empirically supported and conceptually coherent. We agree that the phenomenon colloquially labeled "self-deception" involves the following features:

  1.  **Behavioral Consistency:** Subjects identified as self-deceived exhibit behavior consistent with believing a proposition ($P$) despite possessing accessible evidence that strongly supports not-$P$.
  2.  **Motivated Reasoning:** The formation or maintenance of belief $P$ is causally influenced by the subject's desires, fears, or social incentives regarding the truth of $P$.
  3.  **Evidence Avoidance:** Subjects actively engage in strategies to avoid encountering, processing, or retaining evidence for not-$P$. This includes selective attention, selective gathering of evidence, and selective forgetting.
  4.  **Sincerity of Assertion:** When asserting $P$, the subject is not consciously lying to others. They report a phenomenological state of believing $P$ and experience distress when $P$ is challenged, distinguishing this state from standard interpersonal deception.
  5.  **Costly Consequences:** The maintenance of belief $P$ often leads to negative practical outcomes for the subject (e.g., financial loss, relationship failure, health risks) that would likely be avoided if the subject accurately weighed the evidence for not-$P$.

  **II. PRECISE DISAGREEMENTS**

  While we agree on the phenomena listed above, we disagree on the underlying architecture required to explain them. We phrase our disagreements neutrally below:

  1.  **The Unity of Agency Requirement:**
      *   *The Deflationary Position:* Deception logically requires two distinct agents: a deceiver who knows the truth and a victim who is misled. Since a single, unified mind cannot simultaneously know and not know the same proposition in the same respect, "self-deception" is a misnomer. The mind is a single agent subject to error and bias, not a site of internal deception.
      *   *The Partitionist Position:* The mind is not a unified, transparent agent but a collection of subsystems or modules. One subsystem can process and store information (the truth) while preventing access to that information by the subsystem responsible for verbal assertion and conscious planning. Therefore, deception occurs *within* the person without requiring a logical contradiction in a unified subject.

  2.  **The Intentionality of the Process:**
      *   *The Deflationary Position:* What is called self-deception is merely "motivated bias." It is an unintentional, automatic skewing of cognitive processing driven by desire. Because the subject does not form a conscious intention to mislead themselves, the term "deception" is inappropriate and misleading.
      *   *The Partitionist Position:* Intentionality in self-deception need not be conscious or unified. A subsystem can initiate a strategy to suppress information with the "goal" of protecting the conscious self from distress. This functional goal constitutes a form of intention sufficient to classify the act as deception, even if the conscious subject is unaware of the strategy.

  **III. CRUXES FOR RESOLUTION**

  We have identified specific sub-questions where further evidence or argumentation could shift the consensus. For each crux, we outline a concrete case and record the divergent predictions or interpretations of each coalition.

  **Crux 1: Functional Compartmentalization of Contradictory Beliefs**
  *   **The Question:** Can a single individual simultaneously hold contradictory beliefs ($P$ and not-$P$) in a way that governs different behavioral outputs without one belief correcting the other?
  *   **Relevant Case:** A subject explicitly asserts "I am a safe driver" (P) while implicitly reacting with fear and avoidance to driving simulations (not-$P$), despite having access to both their own driving record and the simulation feedback.
  *   **Deflationary Prediction:** This is not two beliefs. It is one avowed belief ($P$) and one automatic emotional association (fear). The fear does not constitute a "belief" in not-$P$; it is a non-cognitive affective response. Resolving this requires showing the affective response operates as a truth-apt cognitive state.
  *   **Partitionist Prediction:** This demonstrates functional partitioning. The "explicit system" holds $P$ for social reporting, while the "implicit system" holds not-$P$ for motor control. The lack of integration proves the mind is partitioned enough to sustain self-deception.

  **Crux 2: Strategic Ignorance and Collective Stability (The Forecaster Case)**
  *   **The Question:** Does the social function of a belief state determine whether it counts as deception or adaptive bias?
  *   **Relevant Case:** Consider a professional forecaster whose credibility with her team depends on sustained confidence. She systematically discounts her own calibration failures. If she admits uncertainty, her team panics and performance drops. If she maintains confidence (by ignoring errors), the team coordinates effectively and succeeds, even if her confidence is technically unwarranted by the data.
  *   **Deflationary Interpretation:** This is **Adaptive Social Bias**. The forecaster is not deceiving herself; she is optimizing for a social outcome (team stability) rather than an epistemic one (accuracy). Calling this "deception" implies a failure of rationality, whereas this is a successful heuristic for group coordination. The mechanism is bias, but the function is strategic.
  *   **Partitionist Interpretation:** This is **Strategic Self-Deception**. The forecaster's cognitive system recognizes the calibration failures (truth) but actively suppresses them to generate the confident output required for the social goal. The fact that this stabilizes collective decision-making does not negate the deception; it explains *why* the deception was selected for. The suppression of known evidence to manufacture a belief state constitutes deception, regardless of its beneficial social consequences.
  *   **Resolution Condition:** If it can be shown that the forecaster retains access to the error data in high-stakes private contexts but suppresses it only in public contexts, the Deflationary view gains ground (contextual bias). If the forecaster genuinely loses access to the error data even in private reflection due to the suppression mechanism, the Partitionist view gains ground (internalized deception).

  **IV. ASSESSMENT OF VERBAL DISPUTE**

  We explicitly address whether our disagreement is merely verbal.

  **Conclusion:** The disagreement is **partially verbal, but with substantive downstream consequences.**

  1.  **Verbal Component:** Both sides agree on the mechanical processes: evidence is avoided, desires influence belief, and contradictory behavioral outputs occur. If both sides agreed to use the term "Motivated Epistemic Management" to describe these processes, much of the conflict would dissolve. The Deflationary Coalition objects to the word "deception" because it implies a liar; the Partitionist Coalition insists on "deception" because it implies an active process of hiding.
  2.  **Substantive Component:** The labeling dispute matters for moral responsibility and intervention.
      *   If the Deflationary view is correct, the subject is *irrational* or *biased*. Intervention focuses on correcting cognitive errors and improving information processing skills.
      *   If the Partitionist view is correct, the subject is engaged in an *intrapsychic conflict*. Intervention focuses on integrating partitioned subsystems and uncovering suppressed motives.
      *   Furthermore, regarding the Forecaster Case: If we classify the behavior as "deception," we imply a breach of epistemic integrity that may need ethical regulation. If we classify it as "adaptive bias," we may view it as a necessary feature of leadership.

  **SIGNATORIES**

  _________________________
  Lead Representative, The Deflationary Coalition

  _________________________
  Lead Representative, The Partitionist Coalition
