answer: |-
  Your intuition that these two frameworks answer different questions is correct, but they are not necessarily incompatible. Structure-Mapping Theory (SMT) treats analogy as a process of aligning fixed relational representations, prioritizing systematic connectivity over superficial attributes. Hofstadter and Sander (H&S) treat concepts as fluid, arguing that categorization *is* analogy, where representations slip and reconstruct themselves during the act. Your worry is that H&S lacks a stable benchmark to declare an analogy a "misfire." However, H substitutes structural fidelity with pragmatic fruitfulness: a misfire is a slip that leads to a dead end or fails to integrate with broader understanding. SMT measures alignment; H&S measures conceptual utility.

  Let us diagnose the Carnot case using this machinery. In SMT, the water-wheel and heat engine are represented as distinct domains with objects and relations. The objects (water vs. heat) differ in attributes, but the higher-order relations align: a potential difference (height vs. temperature) drives a flow (water vs. heat) that produces work. SMT's systematicity principle prefers this connected causal structure over isolated attribute matches (e.g., both fluids are wet or hot). The mapping succeeds because the relational structure is isomorphic, even though the ontological attribute (conserved substance) is false. SMT would classify the caloric error as an attribute mismatch that does not disrupt the higher-order relational alignment. The inference (efficiency limits) is projected based on the structure, not the substance.

  On the H&S account, there is no fixed concept of "heat" prior to the analogy. The mind slips the concept of heat to accommodate the water-wheel schema. The "essence" extracted is not the substance but the invariant behavior: flow driven by potential difference. The caloric theory was not a bug but a scaffold—a necessary conceptual vehicle to allow the slip to occur. The analogy succeeds because it reconstructs the concept of heat in a way that proves fruitful for future reasoning. For H&S, the lack of a conserved substance is irrelevant if the constructed essence captures the relevant invariant for the context.

  This brings us to your failure modes. Your *surface capture* describes mapping driven by salient attributes rather than relations. Your *structural overreach* describes clean relational mapping that yields unlicensed inferences because the causal warrant was not transported. The Carnot case instantiates **neither**. It is not *surface capture* because the mapping was driven by causal structure (potential drives flow), not perceptual salience. It is not *structural overreach* because the inferences *were* licensed, just not by the ontology Carnot assumed. The warrant existed in the abstract thermodynamic structure, which survived the death of the caloric theory. The analogy did not overreach; it abstracted correctly despite ontological error. The structure carried the truth, even if the explanation for why the structure held was wrong.

  To make your taxonomy do real work, we need a discriminating test. For this case to be *surface capture*, the reasoning would need to rely on irrelevant attributes. Suppose Carnot argued that because water wheels corrode, heat engines must degrade over time in a specific chemical way, based solely on the "wetness" of the fluid analogy. That would be surface capture: salient features dragging irrelevant consequences. For it to be *structural overreach*, the relational structure would need to hold locally but break globally, leading to false confidence. Suppose one argued that because water can be pumped uphill, heat can be made to flow from cold to hot *without* work input, simply by extending the "flow" relation beyond its causal warrant. That would be structural overreach: the relation maps, but the causal constraint (conservation of energy) is ignored, licensing an impossible inference.

  In the actual historical case, the inference was valid because the structural invariant (potential difference determines maximum work) is robust across different ontologies (caloric vs. energy). Thus, it escapes your failure modes. It represents a successful abstraction where the relational skeleton mattered more than the ontological flesh.

  This resolves your worry about H&S and misfires. H&S does not need fixed representations to identify failure; it uses pragmatic stability. A misfire is a conceptual slip that fails to stabilize or integrate with other slips. In Carnot's case, the slip stabilized into thermodynamics. If the caloric analogy had led to contradictions that could not be resolved by further slipping (e.g., if heat flow behaved fundamentally differently than fluid flow in ways that blocked efficiency calculations), H&S would call it a dead-end slip. SMT would call it a low-alignment mapping. They converge on success here because the structural alignment was high and the conceptual slip was fruitful.

  The tension you feel arises because SMT assumes representations are stable enough to be scored, while H&S assumes they are too fluid to be scored until after the fact. But in practice, successful science often looks like H&S describes (concepts slipping) evaluated by SMT criteria (structural consistency). The Carnot case shows that an analogy can be ontologically false yet structurally true. Your failure modes are useful, but they require distinguishing between *ontological warrant* (what things are) and *structural warrant* (how things behave). Carnot lacked the former but possessed the latter.

  \answer{neither}
