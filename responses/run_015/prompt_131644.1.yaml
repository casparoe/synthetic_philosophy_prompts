answer: |-
  ### Brainstorm: Operationalising the Distinctions

  Before we get to the checklist, we need to strip the philosophy down to levers you can actually pull in a meeting room. Most debates stall because people are arguing past each other using different definitions of "harm". Here is how we translate the theory into operational criteria:

  1.  **Aesthetic Autonomy → The 'Narrative Dependency' Test.**
      *   *Theory:* The work stands alone regardless of the maker.
      *   *Operation:* Does the work *require* knowledge of the artist's biography to function? If the answer is no, autonomy is high. If the work is *about* the artist's psyche or history, autonomy is low.
  2.  **Moral Taint Transmission → The 'Financial & Capital Flow' Test.**
      *   *Theory:* Buying the art supports the bad person.
      *   *Operation:* Where does the money go? Does the acquisition confer reputational capital (legitimacy) that the artist could leverage for further harm?
  3.  **Institutional Complicity → The 'Endorsement Risk' Test.**
      *   *Theory:* Displaying this makes us look like we agree with them.
      *   *Operation:* If a victim walked into the gallery, would the presence of this work feel like a secondary violation? Would a donor pull funding?
  4.  **Epistemic Contamination → The 'Viewer Burden' Test.**
      *   *Theory:* Enjoying the art forces you to ignore the harm.
      *   *Operation:* Does appreciating the formal properties require actively suppressing knowledge of the abuse? If the viewer must choose between 'seeing the art' and 'acknowledging the harm', the contamination is high.

  ***

  ### The 45-Minute Decision Procedure

  This is designed for a committee of five to seven people. You need a Chair (to keep time) and a Scribe (to tick boxes). Do not skip the timing; if you overrun, you are debating vibes, not facts.

  #### Phase 1: The Verification Gate (5 Minutes)
  **Question:** Is the allegation substantiated by public record, legal finding, or credible investigative journalism?
  *   **Yes:** Proceed to Phase 2.
  *   **No:** **STOP.** You cannot acquire based on rumour. File the proposal as 'Pending Verification'. Do not discuss the merits of the art yet.
  *   **Judgement Point:** If the evidence is ambiguous (e.g., settled out of court with no admission of guilt), the Committee Chair must declare this a 'High Ambiguity' case. This triggers a requirement for legal counsel review before proceeding.

  #### Phase 2: The Financial & Legal Hard Stop (10 Minutes)
  **Question A:** Does the acquisition budget flow directly to the artist or their primary representation?
  *   **Yes:** Can the funds be legally diverted to a third party (e.g., a victim fund, a trust the artist cannot access)?
      *   **No Divert Possible:** **HARD REJECT.** End of procedure. The institution cannot be a conduit for resources to someone substantiated as harmful.
      *   **Divert Possible:** Proceed to Question B.
  *   **No (e.g., secondary market, estate):** Proceed to Question B.

  **Question B:** Does acquiring this work expose the centre to legal liability (e.g., copyright disputed by victims, stolen materials)?
  *   **Yes:** **HARD REJECT.**
  *   **No:** Proceed to Phase 3.

  #### Phase 3: The Thematic & Epistemic Risk Assessment (15 Minutes)
  *Note: This is where you assess the work itself, not just the person.*

  **Question A (Thematic Nexus):** Does the content of the work directly depict, reference, or thematise the specific harm alleged (e.g., power dynamics, coercion, fraud)?
  *   **Yes:** Mark as **High Thematic Risk**.
  *   **No:** Mark as **Low Thematic Risk**.

  **Question B (Viewer Burden):** To appreciate the formal qualities of this work, must the viewer suppress knowledge of the artist's behaviour?
  *   **Yes (High Burden):** The work relies on the artist's persona or requires ignoring the harm to function aesthetically.
  *   **No (Low Burden):** The work functions independently; knowledge of the harm changes the context but does not break the aesthetic experience.

  **Question C (Mitigation):** Can contextualisation (wall text, side programme, talks) sufficiently address the harm without centring the artist?
  *   **Yes:** We can frame this critically.
  *   **No:** Any text would feel like an excuse or would be ignored by the audience.

  #### Phase 4: The Value Vote (The Hand-Off) (15 Minutes)
  *Note: Logic ends here. This is a value call dressed up as a vote.*

  The Chair presents the profile from Phase 3. The committee must vote on **Acquisition** vs **Rejection** based on the following weighting:

  1.  **If High Thematic Risk + High Viewer Burden:** Default position is **Reject**. To vote **Acquire**, you need a unanimous vote and a written justification on how this serves the victims or public interest.
  2.  **If Low Thematic Risk + Low Viewer Burden:** Default position is **Acquire** (assuming artistic merit meets standard). To vote **Reject**, you need a 75% majority based on reputational risk assessment.
  3.  **If Mixed:** Simple majority vote.

  **Director Sign-Off:** The Director reviews the vote. They have veto power only on reputational/financial grounds, not artistic ones. They must sign a risk acceptance form if the vote was not unanimous.

  ***

  ### Testing the Procedure on Your Hard Cases

  Here is how the framework runs on the three scenarios you provided.

  #### Case (a): The Abstract Painter (Convicted Fraud)
  *   **Phase 1:** Substantiated (Convicted). Pass.
  *   **Phase 2:** Funds go to artist. Can they be diverted? Let's assume **No** (standard acquisition).
      *   **Result:** **HARD REJECT.**
  *   **The Bite:** This is the answer you might dislike. Your committee leans autonomist; you feel the canvases are innocent of the fraud. But the procedure flags the *financial flow* as the hard stop. It doesn't matter that the art is abstract; you cannot move institutional money to a convicted fraudster. The framework forces you to acknowledge that acquisition is an economic act, not just an aesthetic one.
  *   *Alternative:* If you *can* divert funds to a charity, it moves to Phase 3. Low Thematic Risk (abstract), Low Viewer Burden. Result: **Acquire**. But the money path is the gatekeeper.

  #### Case (b): The Sculptor (Coercive Abuse, Work about Power)
  *   **Phase 1:** Substantiated (Credible allegations). Pass.
  *   **Phase 2:** Funds diverted or secondary market. Pass.
  *   **Phase 3:**
      *   Thematic Nexus: **Yes** (Work is about power/consent). **High Risk**.
      *   Viewer Burden: **High**. Knowing the artist is abusive makes the work read as confession or glorification, not critique. The viewer must struggle to see 'art' rather than 'evidence'.
      *   Mitigation: **Low**. Wall text cannot fix the power dynamic of the object itself.
  *   **Phase 4:** High Risk + High Burden = Default **Reject**.
  *   **Outcome:** **Reject.**
  *   **Why:** The epistemic contamination is too high. The work cannot be separated from the behaviour because the behaviour *is* the subject matter. Displaying it risks making the centre a venue for the artist's processing of their own abuse.

  #### Case (c): The Photographer (Manipulation for Access)
  *   **Phase 1:** Substantiated. Pass.
  *   **Phase 2:** Funds diverted. Pass.
  *   **Phase 3:**
      *   Thematic Nexus: **Yes** (Intimate access). **High Risk**.
      *   Viewer Burden: **High**. The 'brilliance' relies on the access gained through manipulation. To admire the photo is to admire the successful manipulation.
      *   Mitigation: **Possible**. You can display the work *as evidence* of the manipulation, centring the subject's voice rather than the photographer's eye.
  *   **Phase 4:** Mixed Profile. Vote required.
  *   **Outcome:** **Conditional Acquire.**
  *   **Why:** Unlike the sculptor, the harm here is in the *process*, not necessarily the *image content*. If you can reframe the acquisition as documenting the harm (e.g., "The Cost of Access" exhibition), you lower the epistemic contamination. This requires heavy curatorial labour, but the framework allows it.

  ***

  ### Where This Procedure Will Misfire (The Honest Gaps)

  You asked for honesty about what this can't do. Here is where it will break:

  1.  **The 'Great Art' Exception:** The procedure treats all art as equal input. It cannot measure if a work is a masterpiece. If the abstract painter (Case A) is the next Rothko, the pressure to bypass the Financial Hard Stop will be immense. The procedure cannot stop a Director from risking their job for a masterpiece. It only makes the risk explicit.
  2.  **The 'Future Proofing' Problem:** This works on *known* harm. It cannot protect you from the artist who behaves badly *after* acquisition. You will still get angry emails in three years when new allegations surface. This procedure does not solve the resale or deaccessioning dilemma later.
  3.  **The 'Victim Voice' Illusion:** Phase 3 asks "Would a victim feel violated?" Your committee does not contain victims of this specific artist. You are guessing. This is a simulation of empathy, not the real thing. In high-stakes cases, this step is essentially roleplay.
  4.  **The Bureaucratic Shield:** There is a risk that the committee uses the 'Hard Reject' on financial grounds to avoid making a moral stand. It allows you to say "We couldn't buy it because of the money," when really you just didn't want the headache. It sanitises the moral choice into a compliance issue.

  ### Final Note for the Director

  When you hand this to your Director, be clear: this procedure does not remove liability. It distributes it. By ticking these boxes, you are creating a record that says, "We considered the harm, we weighed the risk, and we proceeded anyway." That protects the institution from claims of negligence, but it does not protect it from outrage. If the public decides you are wrong, no flowchart will save you. But at least you will know *why* you made the choice, and it won't just be vibes.
