answer: |-
  This is an incredibly heavy situation, and the fact that you are losing sleep over it tells me you are taking the moral weight of it seriously. You are standing at the intersection of three very difficult things: a loved one's suffering, a family's fear, and a philosophical crisis about what we are actually doing when we intervene in someone's mind.

  Your sister sees a medical emergency. Your other brother sees a power grab. You see a tragedy where both might be partially right, and you are worried that resolving the "is it real?" question won't actually solve the "is this right?" question.

  You are correct to feel that the "lesion" argument and the "coercion" argument are sliding past each other. They belong to different categories of inquiry. Here is a breakdown of what is actually happening in these arguments, how the autoimmune case fits in, and how you can hold your two conflicting intuitions without collapsing.

  ### 1. What is the "Mental Illness is a Myth" argument actually doing?

  When your brother argues that mental illness requires a visible lesion to be "real," he is echoing the philosopher Thomas Szasz. Szasz's argument is often misunderstood as a denial of suffering. It isn't. Szasz acknowledged people suffer. His argument was about *category errors* and *power*.

  To answer your specific question: **No, the argument is not really about the lesion.** The lesion is a rhetorical boundary marker.

  Here is the job the "lesion" talk is doing in that argument:
  *   **Demarcation:** It tries to draw a hard line between *medicine* (fixing broken body parts) and *morality/social control* (managing behavior that disrupts the social order).
  *   **Authority:** If there is no lesion, the argument goes, there is no objective "doctor" to declare you sick. There is only a majority declaring a minority "deviant."
  *   **The Autoimmune Case:** Interestingly, a Szaszian would look at your friend's autoimmune encephalitis case and say, "Exactly!" In their view, the moment they found the antibodies, it ceased to be a "mental illness" and became a "neurological disease." It moved from psychiatry to neurology. So, that case doesn't necessarily disprove the "myth" thesis; it actually highlights the thesis's core claim: *We call it 'mental illness' when we don't know the physical cause, and 'neurological disease' when we do.*

  So, your brother's rant is not primarily a scientific claim about scanners; it is a political claim about liberty. He is worried that "illness" is being used as a trump card to override autonomy when the only evidence is "behavior we don't like."

  ### 2. Does finding a lesion solve the coercion problem?

  You hit on something profound here: *"If they did find a lesion in Marcus's brain tomorrow, none of my unease about the commitment paperwork would go away."*

  You are right. A tumor does not grant a moral free pass.

  In general medicine, if a competent adult has a brain tumor but refuses surgery, we generally cannot force them to have it (unless they are deemed incapacitated). The presence of pathology does not automatically negate the right to refuse treatment.

  The reason the coercion feels different in psychiatry is that the *tool* used to determine incapacity is often the very thing that is alleged to be broken: the mind itself.
  *   If Marcus says, "I don't want meds," and he has a tumor, we test his *capacity* to understand the tumor.
  *   If Marcus says, "I don't want meds," and he has schizophrenia, his refusal is often taken as *evidence* of the illness (anosognosia, or lack of insight).

  This is the loop that makes you uneasy. Your brother's "myth" argument is a warning light on the dashboard regarding this loop. He is pointing out that the definition of "sick" and the justification for "force" are dangerously circular.

  ### 3. Can you hold both intuitions?

  You asked: *"I have two intuitions that seem to be at war, one that Marcus is genuinely unwell and needs help and one that hauling him in against his will... is a morally different animal... Is there a way to hold both?"*

  **Yes.** In fact, holding both is the only ethically mature position to take.

  *   **Intuition 1 (He is unwell):** This acknowledges the reality of dysfunction. Whether there is a visible lesion or not, Marcus is suffering. His sleep is gone, his career is gone, his peace is gone. He is not "choosing" this in the way he chooses a hobby. His agency is compromised by his own brain state.
  *   **Intuition 2 (Coercion is distinct):** This acknowledges the reality of liberty. Forcing medication is a violation of bodily autonomy. It is a traumatic event. It establishes a power dynamic where the state/family knows better than the individual.

  **The Synthesis:** You can view involuntary treatment as a **tragic necessity.**

  If you decide to support your sister, you do not have to believe that "mental illness is a myth." But you also do not have to believe that "involuntary commitment is just like setting a broken leg." You can believe: *Marcus is sick, and he needs help, and the only way to give him that help right now violates his autonomy, which is a terrible cost we are choosing to pay because we believe the alternative (leaving him in psychosis) is worse.*

  This position validates your sister's urgency (he needs help) without silencing your moral unease (this is a heavy thing to do to a person). Your unease is not a sign that you think he's faking; it's a sign that you respect him as a person.

  ### 4. Practical Advice for the Family Dynamic

  Your sister thinks you are being "uselessly philosophical." In the middle of a crisis, philosophy feels like obstruction. However, your philosophical hesitation is actually a safeguard. It prevents the family from becoming tyrannical in the name of help.

  Here is how you might frame this to yourself and your family to reduce the friction:

  **To your Sister:**
  Don't frame it as "Is this real?" Frame it as "How do we minimize the harm of the intervention?"
  *   *Say:* "I agree Marcus needs help and I support getting him evaluated. My worry isn't about whether he's sick; I believe he is. My worry is that once the system grabs him, it's hard to let go. I want to make sure we are advocating for the *least restrictive* option possible. I want to be the one making sure they still listen to him, even if they override him."
  *   This makes you an ally in the treatment, not an opponent of the diagnosis.

  **To your "Myth" Brother:**
  Acknowledge the validity of his warning without accepting his conclusion.
  *   *Say:* "You're right that this power can be abused. The system *does* use 'illness' to control people sometimes. But Marcus isn't sleeping and has quit his job. Whether it's antibodies or chemistry or trauma, he's trapped. I'm not supporting this because his beliefs annoy us; I'm supporting it because he is suffering and can't see a way out."

  **To Yourself:**
  Resolve the "Lesion vs. Coercion" slide.
  *   Remind yourself that **biology does not equal ethics.** Even if Marcus has a clear chemical imbalance, forcing him into a van is still a use of force. It requires justification.
  *   The justification is not "He is ill." The justification is "He is currently unable to keep himself safe or make decisions in his own interest, and the risk of doing nothing is greater than the risk of intervention."
  *   Your discomfort is the moral cost of that intervention. Do not try to talk yourself out of the discomfort. Let it remind you to treat Marcus with dignity during the process.

  ### Summary

  The "lesion" argument is a proxy for a debate about **who owns the self.**
  *   Your brother says: "I own myself unless my tissue is visibly rotting."
  *   Your sister says: "The family/state owns the self when the self is broken."
  *   You are asking: "Can we acknowledge the self is broken without claiming total ownership over it?"

  The autoimmune case proves that biology can mimic "madness," but it doesn't solve the ethical problem of force. You can hold the view that Marcus is genuinely ill (ontological claim) and that coercing him is a morally fraught, distinct action from coercing a tumor patient (ethical claim).

  Supporting the commitment does not require you to believe that "mental illness" is identical to "broken leg." It only requires you to believe that, in this specific instance, the tragedy of leaving Marcus in psychosis is greater than the tragedy of violating his autonomy to stop it. That is a heavy, sad, and honest place to stand. It is not useless philosophy; it is the only thing that keeps the "help" from becoming purely punitive.
