answer: |-
  ### Brainstorming the Maraval Knots

  Before we draft the spec, we need to see where the Maraval Charter actually bites. It's not just a puzzle; it's a trap designed to catch specific theoretical feet.

  First, look at **Article 17**. It's a self-consuming credential. It authorizes a change to Article 12, but implies its own obsolescence (once used, it's done). When the Assembly uses it in 2048 to lower the threshold, then repeals Article 17, we have a chain of validity problem. If the 2048 amendment's validity depends on Article 17, and Article 17 is repealed, does the 2048 amendment survive? If yes, on what basis? If no, then the simple majority rule never existed, meaning the repeal of Article 13 (entrenchment) was invalid, meaning Article 13 still binds, meaning the 2048 amendment was void ab initio. This is the **Succession Paradox**.

  Second, look at **Article 13 vs. Article 17**. Article 13 says Article 12 is unamendable. Article 17 says Article 12 can be amended (once). These are contradictory instructions within the same document. A theory must decide: is Article 17 an implicit exception to 13? Or is 13 a substantive limit that renders 17 void? If 13 is truly unamendable, can a rule contained within the same constitution authorize its violation? This is the **Entrenchment Conflict**.

  Third, look at **Article 18**. "The Assembly determines interpretation." This is a Liar-like loop. If the Assembly interprets Article 18 to mean "Article 18 cannot be repealed," is that binding? If the Assembly later repeals Article 18, was the previous interpretation valid? This touches on **Semantic Closure**. Can a rule govern the interpretation of itself without infinite regress?

  Fourth, the **2055 Court**. The court is asked to rule on the validity of a change seven years prior, using a authority that traces back through that change. If the court rules the 2048 amendment invalid, it undermines its own jurisdiction (which likely rests on statutes passed under the 2048 regime). If it rules it valid, it might be ignoring the text of Article 13. This forces a choice between **Textual Validity** and **Systemic Stability**.

  ### The Requirements List

  A theory of self-amending rules must satisfy the following requirements. These are not preferences; they are necessitated by the logical and practical problems inherent in the Maraval cases.

  **1. Diachronic Validity Distinction**
  *   **Requirement:** The theory must distinguish between the validity of the *act* of amendment at time T1 and the validity of the *norm* produced at time T2.
  *   **Case Trigger:** Maraval Art. 17. The act of amending Art. 12 happened in 2048 under Art. 17. The norm (simple majority rule) persisted until 2055. Art. 17 was repealed.
  *   **Why:** If validity is tied strictly to the continued existence of the authorizing rule, every amendment repealing its own basis becomes void instantly. A theory must explain how a norm persists after its parent norm is destroyed (the "born valid, stays valid" principle vs. "continuous authorization" principle).

  **2. The Amendment/Revolution Threshold**
  *   **Requirement:** The theory must provide a criterion to distinguish between an illegal amendment (void) and a successful revolution (new legal order).
  *   **Case Trigger:** Maraval 2048/2055. If the 2048 amendment violated Art. 13, was it merely void (so Art. 13 still rules), or was it a revolution (so the 1951 Charter is dead and the 2048 regime is the new baseline)?
  *   **Why:** Without this distinction, the 2055 court cannot decide whether to enforce Art. 13 (old order) or Art. 18 (new order). Efficacy alone isn't enough; the theory must say when efficacy converts into legality.

  **3. Hierarchy of Authority (Constituent vs. Constituted)**
  *   **Requirement:** The theory must distinguish between the power to create the constitution (constituent) and the power to amend it (constituted).
  *   **Case Trigger:** Maraval Art. 13 (unamendable) vs. Art. 17 (amendment power).
  *   **Why:** If the amendment power is unlimited, Art. 13 is meaningless. If Art. 13 is binding, the amendment power is limited. A theory must locate the source of Art. 13's binding force. Is it a higher norm? Or just a rule like any other? If it's just a rule, it can be repealed. If it's higher, who says so?

  **4. Semantic Closure Capability**
  *   **Requirement:** The theory must handle rules that refer to their own validity or interpretation without generating logical paradoxes.
  *   **Case Trigger:** Maraval Art. 18 ("Assembly determines interpretation") and the hypothetical Art. 19 ("No amendment under Art. 12 is valid").
  *   **Why:** If a rule says "I am invalid," does that statement invalidate itself? If Art. 18 says "I determine validity," can it validate itself? A theory must prevent infinite regress or logical contradiction from collapsing the system.

  **5. Validity vs. Efficacy Separation**
  *   **Requirement:** The theory must maintain a conceptual gap between whether a rule is obeyed (efficacy) and whether it was legally enacted (validity).
  *   **Case Trigger:** Maraval 2048-2055. The simple majority rule was effective for seven years. The 2055 court must decide if that efficacy cures the textual defect.
  *   **Why:** If validity equals efficacy, then any successful coup is legal immediately. If validity is strictly textual, then seven years of legislation are void. The theory must weigh these without conflating them.

  **6. The Gap-Bridging Mechanism**
  *   **Requirement:** The theory must explain where authority comes from when the authorizing rule is repealed by its own exercise.
  *   **Case Trigger:** Maraval Art. 17 repeal.
  *   **Why:** This is the specific "self-consuming" problem. If the ladder is kicked away, how did you get to the top? The theory must posit a mechanism (e.g., inheritance, presumption of continuity, or social fact) that bridges the gap between the old rule and the new rule.

  ### Desiderata Evaluation: Genuine vs. Prejudice

  You listed several candidate desiderata. Here is the breakdown of which are necessary and which are theoretical prejudices that will break your system.

  *   **"Every self-amending move gets one determinate verdict."**
      *   **Verdict:** Prejudice.
      *   **Reason:** Legal systems contain genuine contradictions and gaps. Demanding determinacy forces the theory to lie. In Maraval, the text contradicts itself (Art. 13 vs. 17). A honest theory must admit indeterminacy.
  *   **"The verdict must be derivable from the content of the pre-existing rules alone."**
      *   **Verdict:** Prejudice (and dangerous).
      *   **Reason:** This excludes social facts (acceptance, efficacy). In Maraval 2055, the fact that everyone accepted the 2048 change for seven years is legally relevant. Ignoring it makes the theory blind to how law actually survives.
  *   **"The theory must be able to say when amendment tips into revolution."**
      *   **Verdict:** Genuine Desideratum.
      *   **Reason:** Without this, you cannot distinguish between a void act and a new constitution. This is essential for the 2055 court's decision.
  *   **"It must respect that the amendment power is the people's constituent power."**
      *   **Verdict:** Prejudice.
      *   **Reason:** This is a specific political theory (popular sovereignty), not a logical requirement of law. A theory should work even if the constitution claims power comes from a King or a Party.
  *   **"It must be formal enough to code up."**
      *   **Verdict:** Prejudice.
      *   **Reason:** Law involves interpretation and discretion. Formalizing it completely ignores the human element of adjudication required in cases like Maraval 2055.
  *   **"It must not posit unamendable principles that nobody enacted."**
      *   **Verdict:** Genuine Desideratum (for Positivism).
      *   **Reason:** If you posit hidden limits, you are doing natural law, not analyzing the rules. However, this conflicts with the next one.
  *   **"It must let a rule bind its own future amendment."**
      *   **Verdict:** Genuine Desideratum.
      *   **Reason:** If a rule cannot bind the future, "unamendable" clauses are meaningless. But this creates the inconsistency below.

  **Inconsistencies You Suspected:**

  1.  **"Determinacy" + "Pre-existing Content Alone" + "Self-Reference."**
      *   **Confirmed.** You cannot derive a determinate answer from a text that authorizes its own destruction without looking at extra-textual facts (like what officials did next). If you restrict yourself to the text alone, the Maraval 2048 amendment is both valid (under Art. 17) and invalid (under Art. 13). Logic breaks.
  2.  **"Binding Self-Entrenchment" + "Unlimited Amendment Power."**
      *   **Confirmed.** These are logically incompatible. If the power is unlimited, it can unbind the entrenchment. If the entrenchment binds, the power is limited. A theory must choose one; it cannot have both.

  ### The Most Exclusionary Requirement

  You bet on the **"No Gap in Authorization"** requirement (when the authorizing rule is repealed). I argue you are wrong. That requirement is difficult, but solvable.

  The single requirement that does the most exclusionary work is: **"The verdict must be derivable from the content of the pre-existing rules alone."**

  **Argument:**
  The "No Gap" problem is actually manageable if you allow the theory to look outside the text. For example, a Hart-style theory says the gap is bridged by the *acceptance* of officials. A Kelsen-style theory says it's bridged by a *presupposed basic norm*. Both solve the gap.
  However, if you insist that the answer must come *only from the pre-existing rules* (the 1951 text), you make the Maraval 2048 case unsolvable. The 1951 text contains the contradiction (Art. 13 vs. 17). It contains the self-destruction (Art. 17). There is no internal logical operator in the 1951 text that resolves which article wins. By demanding the answer come from the text alone, you exclude every theory that relies on social facts, efficacy, or judicial discretion. You force the theory into a formalist box that shatters upon contact with self-reference. The "No Gap" requirement forces you to explain *continuity*; the "Content Alone" requirement forbids you from using the only tools (social practice) that explain continuity.

  ### Is "Underdetermined" a Cop-Out?

  For your purpose (telling the court what to say), answering "underdetermined" is **pragmatically insufficient but ontologically honest.**

  *   **Ontologically:** In Maraval 2055, the law *might* actually be silent. The text contradicts itself, the authorizing rule is gone, and the new rule claims supremacy. There may be no legal fact of the matter. A theory that forces a "Valid/Invalid" binary is lying.
  *   **Pragmatically:** The court cannot say "we don't know." It must decide. Therefore, a theory adequate for your purpose must include a **Rule of Decision for Indeterminacy**. It must say: "When the law runs out, the court should presume validity to maintain stability," or "When the law runs out, the court should revert to the original text."
  *   **Verdict:** It is not a cop-out to say the law is underdetermined, *provided* the theory then tells the judge how to exercise discretion in that gap. If the theory stops at "underdetermined," it fails your purpose (i). If it says "underdetermined, therefore presume continuity," it succeeds.

  ### Scorecard

  **Kelsen-Style (Basic Norm / Hierarchy)**
  This view posits a hypothetical "Basic Norm" behind the Constitution. It handles the Maraval 2048 gap well: the Basic Norm shifts to validate the effective order. However, it struggles with the "Content Alone" requirement because the Basic Norm is a presupposition, not a rule. It would likely tell the 2055 court that if the 2048 change is effective, the Basic Norm has shifted, making the 2048 amendment valid retrospectively. It dissolves the paradox by prioritizing efficacy over text, but fails the demand for textual determinacy.

  **Hart-Style (Rule of Recognition)**
  This view looks to what officials accept as law. In Maraval, officials accepted the 2048 amendment for seven years. Therefore, the Rule of Recognition shifted in 2048. The 2055 court should rule the amendment valid because the social practice validates it. This solves the "No Gap" problem beautifully (the gap is filled by practice) but fails the "Content Alone" requirement explicitly. It also struggles with Art. 13: if officials accept the repeal of Art. 13, then Art. 13 was never truly binding. It treats entrenchment as a factual hurdle, not a legal bar.

  **Sovereign Legislature (Unlimited Power)**
  This view holds the Assembly is legally omnipotent. It makes Art. 13 and Art. 17 simple political promises, not legal bars. The 2048 amendment is valid because the Assembly said so. This solves the paradox by denying the possibility of invalidity. However, it fails the "Binding Self-Entrenchment" requirement entirely. It cannot explain why Art. 13 existed or why the Assembly bothered with Art. 17. For your purpose, it renders the 2055 case trivial (Assembly is always right), which ignores the theoretical tension you built into Maraval.
