  ### The Decisive Test Case

  To separate Rule 1 (Fixed Reference Class) from Rule 2 (Halfer/No Update), you need to break the link between "Empirical Contact" and "Subjective Identity."

  **The Case:** **The "Subjective Twin" Signal.**
  Suppose we detect a radio signal from a galaxy 1 billion lightyears away. Decoding it reveals a civilization *exactly* like ours: same language, same memories up to today, same philosophical debates. They are subjectively identical to us, but physically distinct and forever out of reach.
