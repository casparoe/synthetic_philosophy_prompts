answer: |-
  **JOINT STATEMENT ON THE STATUS OF THE POVERTY OF THE STIMULUS ARGUMENT IN LANGUAGE ACQUISITION**

  **Preamble**
  This document records the conclusions of a year-long adversarial collaboration between proponents of linguistic nativism and proponents of domain-general learning. The Nativist camp holds that a child's linguistic input underdetermines the grammar, necessitating a substantial, species-specific component of syntax that is built in. The Domain-General camp holds that rich input combined with general-purpose statistical, semantic, and pragmatic inference is sufficient to explain acquisition without language-specific innate knowledge. Both parties sign this statement to clarify the logical structure of the debate, isolate genuine empirical disagreements from verbal disputes, and specify the evidence that would resolve them.

  ### 1. Agreed Claims

  1.  **Logical Form of the Argument:** Both sides agree that the Poverty of the Stimulus (POS) is a gap argument with the following logical form: Children attain linguistic knowledge state $K$; the available evidence $E$ is insufficient to derive $K$ under a learning model $M$; therefore, an additional factor $B$ (bias/constraint) must supply the difference. Both sides concede that the force of this argument depends entirely on the width of the space of candidate grammars and the power of the candidate inference strategies allowed in $M$. If $M$ is weak or the hypothesis space is unconstrained, the gap appears large; if $M$ is powerful or the hypothesis space is tightly constrained by non-linguistic factors, the gap shrinks.
  2.  **Necessity of Inductive Bias:** Both sides agree that any system learning from finite data requires inductive bias. There is no "blank slate" learner. Consequently, the disagreement is not about whether learning is constrained, but about the source and specificity of those constraints. The dispute is whether the constraints are specifically linguistic (representing grammatical principles) or domain-general (representing cognitive, perceptual, or social processing limits).
  3.  **Nature of the Input:** Both sides agree that the linguistic input available to children is far richer than the slogan "degenerate and finite" implies. The input includes prosodic information, situational context, communicative intent, and pragmatic feedback. Both sides further agree that absence from a sufficiently large sample can itself carry information (negative evidence via pragmatic inference), provided the learner has the capacity to track expectations about what *should* have been heard.
  4.  **Confounded Deprivation Cases:** Both sides agree that the famous case of "Genie" (and similar cases of extreme isolation accompanied by severe abuse and cognitive deprivation) is too confounded to carry decisive weight. The non-linguistic cognitive deficits and emotional trauma prevent a clean isolation of linguistic capacity, rendering the data inconclusive regarding the existence of a critical period or innate grammatical knowledge.

  ### 2. Disagreements Table

  | Topic | Neutral Restatement | Nativist Formulation | Domain-General Formulation |
  | :--- | :--- | :--- | :--- |
  | **Granularity of Explanation** | Must the argument be proven for every linguistic phenomenon individually, or can it be established globally? | We require formal learnability results for specific constructions (e.g., auxiliary fronting, anaphora) where general learning fails. Global claims mask local failures of domain-general models. | We argue that the aggregate power of general statistical learning, applied across the whole system, explains acquisition without needing a specific proof for every construction. Local gaps are filled by global statistical power. |
  | **Definition of Innateness** | What notion of innateness is doing the explanatory work? | We posit that specific representational structures (principles of syntax) are genomically encoded and canalized, invariant across normal environments. | We posit that "innate" refers only to species-typical biological endowments (sensory apparatus, memory constraints) that make language an inevitable outcome of development, not pre-encoded grammar. |
  | **Sufficiency of Domain-General Biases** | Can non-linguistic cognitive biases suffice to constrain the hypothesis space? | No. The structure of language (e.g., recursion, displacement) is too specific and arbitrary to be derived from general cognition. Linguistic data requires linguistic constraints. | Yes. Biases toward pattern detection, social cooperation, and sequence prediction are sufficient to isolate the correct grammar from the noise without language-specific rules. |
  | **Weight of Acquisition Data** | How much evidentiary weight rests on speed, uniformity, and robustness? | The speed and cross-linguistic uniformity of acquisition, even under degraded input conditions, indicate a pre-specified biological timeline and structure. | The speed and uniformity reflect the optimization of general learning mechanisms over evolutionary time, not the unfolding of a grammatical blueprint. Robustness shows the flexibility of general inference. |

  ### 3. Note on Verbal Disputes

  We identify a significant verbal dispute regarding the term **"Innate."**

  *   **The Disagreement:** The Nativist camp often uses "innate" to mean "genomically encoded representational content" (specific rules of grammar are present in the neonate). The Domain-General camp often uses "innate" to mean "inevitable outcome of species-typical development" (language arises in all humans due to general biology, but no grammar is pre-specified).
  *   **Substantive Residue:** Once these definitions are disentangled, a substantive question remains: **Is the inductive bias representational or procedural?**
      *   If the bias is *representational*, the child starts with constraints on what a possible sentence looks like (e.g., structure dependence).
      *   If the bias is *procedural*, the child starts with constraints on how to process data (e.g., attention mechanisms, memory limits), and the grammar emerges from the interaction of procedure and data.
      *   This statement treats the dispute as substantive on this point: Does the genome encode *knowledge of language* or *mechanisms for learning*?

  ### 4. Cruxes and Predictions

  We identify two primary empirical cruxes where our predictions diverge.

  **Crux A: Acquisition Under Degraded Channels**
  We consider three cases: (1) Children born blind acquiring spoken language; (2) Children with severe motor impairments (non-speaking) acquiring receptive language; (3) Emerging sign languages (e.g., Nicaraguan Sign Language) arising among deaf children with no shared input.

  *   **Discriminatory Value:** Both sides agree that cases (1) and (2) do not discriminate between us, as both architectures can accommodate modality-independent syntax or comprehension without production. The discriminatory case is (3), Emerging Sign Languages.
  *   **Nativist Prediction:** The first generation of learners in an emerging sign language will rapidly impose complex, hierarchical syntactic structure that was not present in the input (home signs), demonstrating the activation of innate grammatical principles.
  *   **Domain-General Prediction:** Complex structure will emerge gradually over generations through cultural transmission and iterated learning, not instantaneously in the first generation. The initial system will reflect general communicative pressure and iconicity, not abstract syntax.
  *   **Test:** Longitudinal analysis of the structural complexity (specifically hierarchical recursion and displacement) in the first versus second generation of an emerging sign language, controlling for cognitive maturation.

  **Crux B: The Large Language Model (LLM) Case**
  Systems with generic architectures trained on internet-scale text score well on grammatical competence measures.

  *   **Nativist Interpretation:** These systems succeed due to massive data volume exceeding human exposure, or they rely on architectural biases (e.g., attention mechanisms) that implicitly mimic linguistic structure. They fail on systematic generalization tasks requiring true rule abstraction.
  *   **Domain-General Interpretation:** These systems demonstrate that domain-general statistical learning is more powerful than previously assumed. The "gap" in the POS argument closes when the learner's capacity is scaled appropriately.
  *   **Agreed Test:** Train a generic sequence-prediction architecture (not hand-engineered for linguistic features) on a **child-sized, child-directed, speech-only corpus** (approx. 5–10 million words, with realistic noise and distribution).
  *   **Nativist Prediction:** The model will fail to acquire robust syntactic generalizations (e.g., it will fail on structure-dependent dependencies) and will not generalize to novel constructions outside the training distribution.
  *   **Domain-General Prediction:** The model will acquire robust syntactic generalizations and generalize successfully, provided the architecture is biologically plausible in its learning efficiency (even if not linguistically specialized).
  *   **Resolution Condition:** If the model succeeds on the child-sized corpus, the Nativist camp must concede that domain-general learning is sufficient for the core data. If the model fails despite optimal tuning, the Domain-General camp must concede that the human learner possesses a specific advantage not captured by generic architectures.

  ### 5. Falsification Conditions

  **For the Nativist Camp:**
  "We would count as evidence against our position a demonstration that a computational model, possessing no language-specific priors (no encoded syntactic categories or principles) and operating on a realistic estimate of child-sized input, successfully acquires the full range of human syntactic competence. Specifically, if a domain-general learner can solve the structural dependency problems we cite as unlearnable without violating sample-size constraints, we must abandon the claim that specific grammatical knowledge is innate."

  **For the Domain-General Camp:**
  "We would count as evidence against our position the discovery of a linguistic constraint that is (a) universal across all human languages, (b) demonstrably unlearnable from any plausible combination of statistical input and pragmatic inference, and (c) shown to be specific to the language faculty rather than a byproduct of general cognition or sensory processing. If a specific rule of grammar is found that cannot be derived from communication pressure or memory limits and is tied to a specific genetic marker, we must concede that the genome encodes linguistic content."

  ### 6. Unresolvable Disagreements

  We acknowledge that one aspect of the dispute may not be settled by empirical test alone: the **interpretation of evolutionary plausibility.**

  *   The Nativist camp argues that the time scale of human evolution is sufficient for the selection of specific linguistic parameters.
  *   The Domain-General camp argues that the time scale is insufficient for specific grammar but sufficient for general cognitive enhancements.
  *   **Reason for Impasse:** Both sides rely on retrospective modeling of evolutionary pressures which cannot be directly observed or experimented upon. While the acquisition data (Crux A and B) bears on the *current* mechanism, it does not definitively settle the *evolutionary origin* of that mechanism. We agree to treat the evolutionary narrative as secondary to the mechanistic evidence regarding current acquisition.

  ***

  **Signed,**

  **The Nativist Working Group**

  **The Domain-General Learning Working Group**
