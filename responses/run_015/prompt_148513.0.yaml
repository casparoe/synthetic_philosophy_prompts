answer: |-
  **MEMORANDUM**

  **TO:** Priority Setting Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Discretionary Fund Allocation (Cycle 2023) and Future Policy Rules

  **Executive Summary**

  This memo recommends that the Committee **decline the gene therapy application (Option 1)** and **proceed with funding the shortlist of 260 patients (Option 2)** for the current cycle.

  It further recommends adopting a **Single-Case Budget Cap** for the next three cycles, limiting any single decision to a maximum of 50% of the available annual fund.

  This approach balances our dual mandate: to maximize total health benefit while ensuring fair consideration across the patient population. It also protects the integrity of our measurement tools and insulates the Committee from external pressure.

  ***

  **1. Decision for This Cycle: Fund Option 2**

  We face a choice between funding one child with a transformative therapy (55 QALYs gained) or 260 patients with essential supportive care (39 QALYs gained). While the raw math favors the child, I recommend funding the 260 patients for three specific reasons.

  **A. Measurement Integrity (The QALY Scale)**
  The clinical team has requested we count quality-of-life gains above the standard 1.0 "perfect health" ceiling for the gene therapy patient. We must reject this.

  *   **The Issue:** Our ranking system relies on a common currency. If we allow one bid to score "1.2" on a scale where everyone else is capped at "1.0," we break the comparison. Every future applicant will have an incentive to claim their outcome is "super-normal," rendering our data useless.
  *   **The Impact:** Even if we recalculate the child's benefit using the standard 1.0 cap, the total QALYs may still exceed Option 2. However, introducing this exception creates uncertainty. The 39 QALYs from Option 2 are based on established, certain outcomes (dental work, dialysis, respite). The 55 QALYs from the gene therapy are long-term projections. In a single-year budget, certainty should weigh heavily.

  **B. The Mandate: "Fair Consideration"**
  Our Terms of Reference contain two instructions: maximize total benefit *and* ensure fair consideration regardless of diagnosis or visibility. These instructions are in conflict this year.

  *   **The Conflict:** Strictly maximizing the total (Option 1) results in 96% of the fund going to one individual, leaving 260 patients with nothing.
  *   **The Resolution:** "Fair consideration" acts as a constraint on maximization. A fund that exhausts itself on a single case ceases to function as a safety net for the broader population. We cannot interpret "total health benefit" in a way that excludes the vast majority of applicants from *any* benefit. Distributing the fund across 260 lives honors the "fair consideration" clause which, if ignored, undermines the legitimacy of this Committee.

  **C. External Visibility**
  We are aware of the family's crowdfunding and media campaign, and the clinical team's indication of potential press involvement if declined.

  *   **The Stance:** Our mandate explicitly requires us to ignore "how visible a case is." Funding Option 1 would create a perception that we reward media pressure rather than clinical need. To maintain institutional integrity, we must demonstrate that visibility does not alter allocation. Declining this application, despite the pressure, is necessary to prove the process is blind to publicity.

  ***

  **2. Policy Rule for Future Cycles: The 50% Cap**

  We are aware of two similar high-cost applications in the pipeline for the next two years. If we fund the child this year, precedent suggests we must fund them next year, effectively turning this discretionary fund into a high-cost drug fund for three years running.

  Some members argue we cannot plan for distribution, only triage the case in front of us. I disagree. Triage without a distribution rule leads to the "Utility Monster" problem: a situation where one type of case absorbs all resources because it offers slightly higher returns per dollar, starving all other categories.

  **Recommendation:** Adopt a rule that **no single application may consume more than 50% of the annual discretionary fund.**

  *   **Why this works:** It does not ban high-cost treatments. It simply requires that if a treatment costs more than half the fund, it must be co-funded (e.g., by pharmaceutical partners, national rare disease programs, or multi-year pooling).
  *   **Why we need it:** It forces us to maintain a portfolio. It ensures that even in years with "blockbuster" applications, we retain the capacity to address the small, critical gaps (like dental or mobility) that the normal budget misses. This preserves the fund's specific purpose as a *discretionary* gap-filler rather than a *primary* payer for expensive therapies.

  ***

  **3. Addressing the Counter-Arguments**

  I anticipate two strong objections to this recommendation. I want to address them directly so we can vote with clarity.

  **Objection 1: "You are throwing away 16 QALYs." (The Maximization Argument)**
  *The Argument:* A member will argue that our job is to save the most health possible. 55 is greater than 39. By choosing Option 2, we are choosing to let the child suffer to save money for less efficient care.
  *The Response:* This is the strongest objection, and it rests on a narrow view of "benefit." Health benefit is not just the sum of QALYs in one year; it is the sustainability of the system that delivers care. If we spend the entire fund on one child this year, and the next two years follow suit, we signal to our staff and patients that the "small" gaps (respite, mobility, dental) are irrelevant. This damages morale and creates systemic friction that costs health in ways QALYs don't capture. We are sacrificing 16 QALYs this cycle to preserve a fund that can serve the *whole* population over the long term. We must be honest that we are prioritizing fairness over maximum efficiency in this specific instance.

  **Objection 2: "You are punishing the child for being sick." (The Fairness Argument)**
  *The Argument:* A member will argue that capping the fund at 50% or rejecting the bid due to "fairness" discriminates against the child based on their diagnosis (rare/neurodegenerative) versus the 260 (common/chronic).
  *The Response:* We are not judging the worth of the child's life. We are judging the *function of the fund*. The child's condition is tragic, but this specific fund is not designed to be the sole payer for ultra-high-cost rare disease therapies. That is a gap in national or regional policy, not a failure of this hospital committee. By holding the line, we advocate for the proper funding stream for these therapies rather than cannibalizing the safety net for the many.

  ***

  **4. Bottom Line and Vote**

  **Action Required:**
  1.  **Vote to Fund Option 2** (The 260 patients, ~$2.6M).
  2.  **Vote to Reject Option 1** (The gene therapy).
  3.  **Vote to Adopt the 50% Single-Case Cap** for the 2024 and 2025 cycles.

  **Rationale:** This decision upholds the integrity of our measurement tools, honors the "fair consideration" clause of our mandate, and insulates the Committee from media pressure. It acknowledges the cost in total QALYs but deems it necessary to preserve the fund's role for the broader patient population.

  I move we proceed with this recommendation for Thursday's vote.
