  | Thesis | What it's a claim about | Status | Supports dropping character questions? | Strongest one-line objection |
  | :--- | :--- | :--- | :--- | :--- |
  | **T1:** Perpetrators of extreme evil often possess only ordinary, non-diabolical motives (career, duty, diligence). | Agent (Psychology) | Substantive & Defensible | **No** (Ordinary motives like ambition or cowardice are still character traits.) | Ambition and cowardice are vices, not neutral blanks; they describe character. |
  | **T2:** The psychological mechanism enabling extreme evil is a specific failure of critical thinking ("thoughtlessness") rather than positive malice. | Agent (Cognitive Habit) | Substantive & Defensible | **Only with an extra premise** (*Premise:* "Thoughtlessness is not a character trait.") | Arendt explicitly treats thoughtlessness as a culpable moral failure of the self. |
  | **T3:** Given identical bureaucratic structures and incentives, nearly any average individual from the same population would commit similar atrocities. | Prediction (Interchangeability) | Dubious / Empirically Contested | **Yes** (If agents are fungible, individual character is causally irrelevant.) | Historical evidence shows significant variance in compliance/resistance under identical conditions. |
  | **T4:** Evil is not a profound or demonic force with metaphysical depth, but a surface-level phenomenon that spreads without root. | The Deed / Nature of Evil | Substantive & Metaphysical | **No** (The shallowness of the *source* does not negate the specificity of the *agent's* contribution.) | One can acknowledge the lack of demonic depth while still interrogating the specific human flaws that allowed it. |
  | **T5:** Historical explanation of atrocities should prioritize structural conditions over individual psychological profiles to be accurate. | Explanation (Methodology) | Substantive & Defensible | **Only with an extra premise** (*Premise:* "Methodological priority implies ontological insignificance.") | Explaining *how* a system works does not explain away *who* chose to make it work. |

  ### Which reading is he reaching for, and does it survive?

  Your classmate is likely conflating **T3 (Interchangeability)** with **T5 (Methodology)** to smuggle in a conclusion about **moral ontology**. He wants to say that because the *explanation* is structural (T5), the *agent* is fungible (T3), and therefore character is a fiction. This does not survive. Arendt's point was not that character doesn't matter, but that a *specific kind of bad character* (the inability to think from another's standpoint) is compatible with being "normal." By using banality to silence questions about Eichmann's character, he is doing exactly what Arendt accused Eichmann of doing: using clichés and stock phrases ("orders," "duty") to avoid the hard work of judging the particular human being in front of you. The tension between the enormity of the deed and the shallowness of the agent is the point of the book, not a problem to be solved by erasing the agent.
