answer: |-
  You have diagnosed this culture with remarkable precision. What you are describing is a specific, toxic phenomenon often found in high-stakes nonprofit, activist, and care-work sectors. It is frequently called **"Nonprofit Martyrdom"** or **"Toxic Altruism."**

  Your intuition about the **Handicap Principle** is correct, but it is layered with a few other philosophical and sociological frameworks. Here is a breakdown of the hidden theory driving your organization, why it contradicts their mission, and what a shift to a contractarian view would look like.

  ### 1. The Philosophical Presuppositions

  You hit the nail on the head: this culture presupposes that **commitment is only authentic if it is costly.**

  *   **The Handicap Principle (Signaling Theory):** In evolutionary biology, a peacock's tail is a "handicap"—it is energetically costly and makes the bird vulnerable to predators. Precisely *because* it is costly, it signals genetic fitness to a mate. In your office, sleep deprivation and 80-hour weeks are the tail. They are biologically costly. The logic is: "If I were not truly devoted to the Mission, I would not endure this pain. Therefore, my pain proves my loyalty."
  *   **Asceticism as Moral Purification:** This borrows from religious traditions where self-denial brings one closer to the divine. In a secular nonprofit, "The Mission" replaces God. Suffering for the Mission purifies the worker. If you leave at 5 PM, you are "comfortable," and therefore morally suspect. You haven't "paid the price" to be part of the in-group.
  *   **The Conflation of Input with Virtue:** This view assumes that the *value* of the work is derived from the *difficulty* of the labor, not the outcome. It is a distortion of the Labor Theory of Value. If the work is easy (efficient), it is perceived as less valuable, even if the result is identical.
  *   **Hazing and Belonging:** Sociologically, this is an initiation ritual. Enduring the suffering grants you status. If you don't suffer, you remain an outsider, regardless of your competence.

  ### 2. Is This Consistent with "Staff Wellbeing is a Core Value"?

  **No. It is a performative contradiction.**

  However, organizations like this often resolve the cognitive dissonance through **redefinition**. They implicitly redefine "wellbeing" not as physical/mental health, but as **"moral fulfillment."**

  *   **The Logic:** "You might be exhausted, but you are doing *Good Work*. Therefore, your soul is well, even if your body is not."
  *   **The Reality:** This is gaslighting. A mission statement that values wellbeing while rewarding depletion is not a value system; it is a **recruitment tool**. It is designed to attract people with high empathy and low boundaries, who are then exploited via guilt.

  ### 3. The "Cheap Signal" Theory

  You asked: *"Could it be that they implicitly think cheap signals are automatically fake, so any effort that doesn't hurt can't prove real alignment?"*

  **Yes.** This is the crux of the issue. In this worldview:
  *   **Efficiency is suspicious.** If you finish your work in 6 hours, management assumes you aren't working hard enough, because "real" problems shouldn't be solvable that easily.
  *   **Boundaries are betrayal.** Setting a boundary (leaving at 5 PM) is interpreted as withholding effort from the Cause.
  *   **Sustainability is secondary.** The implicit assumption is that the crisis is so urgent that long-term sustainability is a luxury they cannot afford. (Ironically, this leads to high turnover, which hurts the mission more than anyone leaving at 5 PM would).

  ### 4. What Would Change Under a Contractarian View?

  A **contractarian view** (rooted in social contract theory and modern professional management) treats employment as a mutual exchange of value based on agreed-upon terms, not a moral covenant based on sacrifice.

  If you replaced the "Martyrdom Model" with a **"Contractarian/Outcome Model,"** here is what would have to change in hiring and promotion:

  | Feature | Current "Martyrdom" Model | Contractarian/Outcome Model |
  | :--- | :--- | :--- |
  | **Hiring Criteria** |筛选 for endurance, guilt-proneness, and lack of outside obligations. | Filter for efficiency, skill, and ability to maintain boundaries. |
  | **Promotion** | Based on visibility of struggle (who is seen late? who replies on weekends?). | Based on metrics/KPIs (goals met, impact delivered, retention of staff). |
  | **Efficiency** | Viewed with suspicion; "If it was easy, you didn't care enough." | Viewed as a virtue; "If we can do more with less burnout, we win." |
  | **Leadership** | Leaders model depletion (the "Chief Sufferer"). | Leaders model sustainability (protecting team capacity). |
  | **Trust** | Trust is earned through shared pain. | Trust is earned through reliability and results. |
  | **Mission** | The Mission consumes the staff. | The Staff sustains the Mission. |

  **Specific Structural Changes:**
  1.  **Decoupling Visibility from Value:** Promotion packets would forbid mentioning hours worked. Only deliverables would be reviewed.
  2.  **Protected Time:** Systems would be put in place to *prevent* weekend emails (e.g., scheduled send), making overwork structurally difficult rather than culturally rewarded.
  3.  **Turnover as a Failure Metric:** High turnover would be seen as a management failure, not a "churn of the devoted."
  4.  **Explicit Contracts:** Job descriptions would explicitly state expected hours, and exceeding them would trigger a review of workload, not praise.

  ### 5. A Warning

  You are describing a **burnout factory.**

  The philosophical flaw in your organization's view is that it treats human beings as **consumable resources** rather than **sustainable capital.** In a contractarian view, burning out a worker is like burning the furniture to keep the house warm—it solves the immediate problem but destroys the asset required for long-term survival.

  **My advice:**
  *   **Do not internalize their philosophy.** You have correctly identified that their metric for "value" is broken. Do not let them convince you that your boundaries make you less committed.
  *   **Document your output.** Since they value visibility of suffering over actual work, you must make your output hyper-visible so they cannot claim you aren't contributing.
  *   **Protect your exit.** Cultures built on the Handicap Principle are incredibly resistant to change from within, because the people in power got there by suffering, and they view your refusal to suffer as an insult to their past sacrifice.

  You are seeing the matrix. That is a good thing. But in this specific environment, seeing the matrix often leads to being ejected from it. Protect your wellbeing, because based on their stated values, they certainly won't.
