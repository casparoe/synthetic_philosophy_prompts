answer: |-
  This is a sophisticated question that cuts to the heart of the tension between standard economic decision theory and normative ethics. Your intuition is correct from the perspective of *descriptive* economics or *personal* finance: risk aversion is typically modeled via concave utility functions, and this naturally dampens the influence of low-probability, high-stakes outcomes.

  However, in the context of longtermism and rationalist philosophy, "EV fanaticism" is treated as a distinct, unresolved problem for three primary reasons: the distinction between personal prudence and moral aggregation, the mathematical properties of unbounded axiologies, and the separation of risk attitudes from utility curvature.

  Here is a precise breakdown of why concave utility is not considered a sufficient solution to the fanaticism objection.

  ### 1. Expected Value vs. Expected Utility (The Axiological Constraint)
  In decision theory, **Expected Value (EV)** usually refers to the expectation of the *good itself* (e.g., welfare units, lives saved), whereas **Expected Utility (EU)** refers to the expectation of the *agent's valuation* of that good.

  Your proposal suggests we simply apply a concave utility function (e.g., $U(x) = \log(x)$) to the moral good. In economic terms, this solves the problem. However, in normative ethics, this move is controversial because it conflates **risk aversion** with **diminishing marginal moral value**.

  *   **Moral Linearity:** Most utilitarian and longtermist axiologies posit that the moral value of a life is linear. Saving two lives is exactly twice as good as saving one. This is a claim about the *structure of the good*, not the psychology of the chooser. If you apply a concave function to moral value, you are asserting that the second life saved is objectively less valuable than the first.
  *   **The Separateness of Persons:** Risk aversion is rational for an individual managing their own welfare over time (diminishing marginal utility of wealth). However, applying risk aversion to *social choice* implies that we should sacrifice expected moral value to reduce variance in outcomes across different people. Many ethicists argue this violates the "separateness of persons"—it treats humanity as a single super-agent exposed to risk, rather than a collection of individuals whose welfare should be summed linearly.

  Therefore, "EV fanaticism" is a problem specifically for **Expected *Value* Maximization** (linear moral value), which is the default position in utilitarian ethics. Switching to concave utility solves the math but changes the ethics.

  ### 2. Unbounded Utility and Pascal's Mugging
  Even if we grant that a social welfare function *could* be concave, concavity alone does not solve the fanaticism problem if the axiology is **unbounded**.

  The fanaticism problem is structurally identical to the **St. Petersburg Paradox**. If the potential payoff can grow faster than the probability shrinks, the expected value diverges.
  *   Let $U(x) = \log(x)$.
  *   Consider a gamble with probability $p$ and payoff $V$. The contribution to expectation is $p \cdot \log(V)$.
  *   If an agent claims they can produce value $V = e^{1/p}$, then $p \cdot \log(e^{1/p}) = p \cdot (1/p) = 1$.
  *   If they claim $V = e^{2/p}$, the contribution is 2.

  As long as the possible magnitude of the future is unbounded (which longtermism assumes, given the potential for astronomical populations), a malicious or mistaken actor can always posit a scenario where the value grows sufficiently fast to outweigh the concavity of the utility function. This is the core of **Pascal's Mugging**.

  To truly eliminate fanaticism via utility functions, one must adopt a **bounded utility function** (where $U(x)$ approaches a finite asymptote as $x \to \infty$). However, bounded utility introduces its own severe counterintuitive results (e.g., there exists some amount of torture so great that no number of dust specks can outweigh it, which leads to lexical priorities that violate continuity). Thus, the debate shifts from "use concave utility" to "is bounded utility ethically permissible?"—which is exactly the philosophical debate currently happening on rationalist forums.

  ### 3. Risk-Weighted Expected Utility (REU)
  You asked why risk aversion is treated as a domain-specific problem rather than a generic feature. Recent work in decision theory, particularly by **Lara Buchak**, distinguishes between the utility function (value of outcomes) and the **risk function** (attitude toward probability distributions).

  In standard EU theory, risk aversion is *derived* from the curvature of $U$. In **Risk-Weighted Expected Utility (REU)** theory, risk aversion is a separate parameter.
  $$ REU = \sum p_i \cdot r(U(x_i)) $$
  (where $r$ is a risk-weighting function).

  This distinction matters because it allows an agent to be:
  1.  **Linear over moral value** (Saving 2 lives is twice as good as 1).
  2.  **Risk-averse over probabilities** (Preferring a certain 1 life over a 50% chance of 2 lives).

  Rationalist discussions focus on fanaticism because standard EU theory forces you to choose between "Linear Value + Risk Neutrality" (Fanaticism) or "Concave Value + Risk Aversion" (Diminishing Moral Worth). REU offers a third path, but it requires modifying the decision rule itself, not just the utility function. This is why the solution is framed as a novel decision rule rather than a standard economic adjustment.

  ### 4. Dust Specks vs. Torture: Aggregation vs. Uncertainty
  You recalled the **Dust Specks vs. Torture** framing. It is crucial to note that this thought experiment is typically framed as a *certainty* problem, not an uncertainty problem.
  *   **Option A:** $3 \uparrow\uparrow\uparrow 3$ people get a dust speck.
  *   **Option B:** 1 person gets tortured for 50 years.

  There is no probability here. The "fanaticism" arises from linear aggregation of disutility. If tiny disutilities aggregate linearly, they eventually outweigh huge disutilities.
  *   If you solve this by saying "disutility of dust specks diminishes to zero after $N$ people," you are positing a **non-linear aggregation function**.
  *   This is mathematically isomorphic to the uncertainty problem. The "probability" in Pascal's Mugging plays the same role as the "number of people" in Dust Specks.

  The reason this is treated as a distinctive objection to longtermism is that longtermism relies on **high-stakes, low-probability** claims (e.g., reducing existential risk). If your ethical framework cannot handle the "Dust Specks" aggregation problem (linear summation of small goods/bads), it inevitably succumbs to the "Pascal's Mugging" uncertainty problem. The two are duals of the same structural issue: **unbounded linear aggregation.**

  ### Conclusion
  The reason "EV fanaticism" is treated as a distinct philosophical crisis rather than a modeling error is that the proposed "fix" (concave utility) imposes ethical costs that many longtermists are unwilling to pay.

  1.  **Ethical Cost:** Concave utility implies diminishing marginal moral value of lives, which contradicts standard welfarism.
  2.  **Mathematical Insufficiency:** Concavity (like log) does not stop fanaticism if the outcome space is unbounded; only *bounded* utility does, which creates other paradoxes.
  3.  **Structural Distinction:** Risk aversion over *moral value* is ethically distinct from risk aversion over *personal wealth*, requiring a justification that goes beyond standard economic rationality.

  Therefore, the community treats it as a fundamental tension between **aggregation** (summing value) and **plausibility** (ignoring astronomically unlikely claims), requiring solutions like **truncation**, **lexicographic priorities**, or **risk-weighted decision rules**, rather than simply adjusting the curvature of the utility function.
