prompt: |-
  So there's this thing about big museums I keep turning over and I can't quite get it to hang together.

  They sink a huge share of their money into objects almost nobody sees. Most of what a major museum owns never gets hung — it sits in climate-controlled storage, sometimes for decades, and the place still pays to keep the humidity right, catalogue it, conserve it, insure it. And selling is basically taboo: the long-standing professional norm was that money raised by selling a work could only be spent acquiring other works, so a museum facing layoffs still can't flog a middling drawing to keep its free schools programme going. Some of the bodies have loosened the wording in recent years, but when a few American museums floated something like that during the pandemic the backlash was instant and at least one planned sale got called off.

  Then the same institutions justify themselves to funders entirely in terms of experience: visitor numbers, participation, community engagement, wellbeing surveys.

  And two other habits sit awkwardly with that second paragraph. When a picture turns out to be a forgery — the van Meegeren Vermeers are the classic case — it doesn't just lose some lustre, it comes off the wall, even though not one brushstroke changed and people had been sincerely moved by it for years. Provenance runs the other way: a work jumps in value if it once belonged to someone famous, again with zero change to how it looks. Same museums, incidentally, run Friends societies and name galleries after donors, i.e. they deliberately cultivate personal affection and then convert it into money.

  What picture of value does all this presuppose? Is the store-it-and-never-sell rule committed to the objects mattering whether or not anyone is looking at them, or is it just rule-of-thumb consequentialism about perverse incentives — once directors are allowed to sell, everything gets sold? (Why can a public library weed its stacks without scandal, but a museum can't?) Does the forgery reaction show the place isn't valuing experiences at all, or can an experience-based account absorb it — I have a vague memory of an argument from around that period that the good lies neither in the beautiful thing nor in the pleasure but in the whole complex of a mind admiring something worth admiring, and that sounds like exactly what's wanted here, except that on that view selling to fund access looks totally fine.

  So: reconstruct the implicit theory as best you can, separate what the practice strictly commits you to from what merely fits it comfortably, tell me which rival accounts of beauty and of value the habits quietly rule out, whether the three parts of it presuppose consistent things (including the donor-affection bit), where it's just underdetermined so that several theories would license it, and what a museum would actually have to do differently if it took an experience-based view seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Core Problem:** The user is struggling to reconcile three seemingly contradictory habits/practices of major museums:
          1.  *Stewardship/Deaccessioning:* Huge resources spent on unseen objects; selling is taboo (even for operational needs); strict rules on proceeds (must buy more art).
          2.  *Justification/Metrics:* Justification to funders/public is based on *experience* (visitor numbers, engagement, wellbeing).
          3.  *Authenticity/Provenance:* Value collapses if a work is a forgery (even if visually identical/experience is the same); value increases with provenance (famous previous owners); cultivation of donor affection for money.
      *   **Questions to Answer:**
          1.  What picture of value does this presuppose? (Reconstruct the implicit theory).
          2.  Separate strict commitments from comfortable fits.
          3.  Which rival accounts of beauty/value are ruled out?
          4.  Are the three parts consistent (including donor affection)?
          5.  Where is it underdetermined (multiple theories fit)?
          6.  What would a museum do differently if it took an *experience-based view* seriously?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *The Tension:* Stewardship says "The Object is Sacred." Justification says "The Visitor's Experience is King." Authenticity says "The History/Truth of the Object is King."
      *   *Philosophical Angles:*
          *   *Aesthetic Realism/Intrinsic Value:* The object has value in itself, independent of viewers. (Fits Stewardship & Authenticity, clashes with Experience Justification).
          *   *Instrumentalism/Utilitarianism:* Value is in the good produced (education, joy). (Fits Experience Justification, clashes with Stewardship & Authenticity).
          *   *Institutional Theory of Art:* Art is art because the artworld says so. (Fits Provenance/Authentication, maybe Stewardship).
          *   *Kantian/Disinterestedness:* Appreciation requires distance. (Fits Stewardship, maybe clashes with "wellbeing surveys").
          *   *Walter Benjamin's "Aura":* The "here and now" of the object matters. (Fits Authenticity).
          *   *Trusteeship/Fiduciary Duty:* Museums hold art in trust for future generations. (Fits Stewardship/Deaccessioning rules).

  3.  **Drafting the Analysis - Section by Section:**

      *   **1. Reconstructing the Implicit Theory:**
          *   It's not just one theory. It's a hybrid. Let's call it "Stewardship of Authentic Witness."
          *   The object isn't just a picture; it's a *historical artifact* and a *testimony*.
          *   Value is tripartite: Intrinsic (aesthetic), Historical (provenance/authenticity), and Public (access/education).
          *   The "Taboo on Selling" implies the collection is a *trust*, not an asset portfolio. It belongs to the future/culture, not the current board.
          *   The "Experience Justification" is a *political necessity*, not necessarily the ontological core. It's how they talk to taxpayers, not how they talk to the art.
          *   The "Forgery" issue confirms that *truth* matters more than *beauty*. It's about the connection to the creator.

      *   **2. Strict Commitments vs. Comfortable Fits:**
          *   *Strict:* The object must be preserved (Stewardship). The object must be authentic (Truth). The institution must remain solvent/credible (Trust).
          *   *Comfortable:* The metrics (visitor numbers) are post-hoc justifications. They don't drive the core ethics (otherwise they'd sell the storage to fund more pop-ups). The donor naming is a pragmatic compromise, not a core value (though it risks corruption).

      *   **3. Rival Accounts Ruled Out:**
          *   *Pure Hedonism:* If value = pleasure, a perfect forgery is equal to the original. Museums rule this out.
          *   *Pure Utilitarianism:* If value = max good for max people, selling storage to fund free entry is mandatory. Museums rule this out.
          *   *Market Capitalism:* If value = price/liquidity, deaccessioning for operations is normal business. Museums rule this out.
          *   *Radical Constructivism:* If value is entirely in the eye of the beholder, provenance shouldn't matter. Museums rule this out.

      *   **4. Consistency Check (The Donor/Affection Bit):**
          *   Is cultivating affection for donors consistent with "art for art's sake"?
          *   *Tension:* Yes, it commodifies the relationship.
          *   *Resolution:* It's consistent if viewed as "Patronage" rather than "Transaction." The donor buys *immortality/association*, not the art itself. The art remains sacred; the naming rights are the profane grease that keeps the machine running.
          *   *Inconsistency:* It risks turning the museum into a country club. But structurally, it fits the "Trust" model (finding new trustees).

      *   **5. Underdetermination:**
          *   Why the storage? Is it for future scholars (Kantian/Archival)? Or for future generations (Intergenerational Equity)? Both fit.
          *   Why no selling? Is it slippery slope (consequentialism) or intrinsic duty (deontology)? The rules look deontological, the justification sounds consequentialist.
          *   Why the forgery panic? Is it about lying (moral) or about broken connection (metaphysical)?

      *   **6. The "Experience-Based" Counterfactual:**
          *   If they *really* believed the experience was the only value:
          *   High-quality replicas would replace originals in storage (save money, same visual experience).
          *   Deaccessioning would be rampant to fund programming.
          *   Immersive digital experiences would replace physical walls.
          *   Provenance would be irrelevant unless it added to the narrative *experience*.
          *   *Conclusion:* They don't actually believe experience is the *source* of value, only the *output* metric.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to make sure I address the specific philosophical argument the user hinted at ("mind admiring something worth admiring"). This sounds like a mix of Kant and maybe G.E. Moore or a specific aesthetician (maybe Danto or Dickie?). It suggests a *relational* value.
      *   *Refinement on Deaccessioning:* The AAMD (Association of Art Museum Directors) guidelines are specific. Proceeds from sales must buy *new art*, not pay light bills. This is the "Collection as Endowment" vs. "Collection as Asset" distinction.
      *   *Refinement on Forgery:* The van Meegeren case is crucial. It proves the value isn't visual. It's *indexical*. The brushstroke is a trace of the artist's body.
      *   *Tone:* Keep it analytical, slightly philosophical, matching the user's thoughtful tone. Avoid being too defensive of museums or too critical.

  5.  **Final Structure:**

      *   **Introduction:** Acknowledge the coherence of the user's puzzle. It's a clash of ontologies.
      *   **The Implicit Theory:** "Custodial Realism" or "Indexical Trust."
      *   **Commitments vs. Fits:** Distinguish between the *mission* (preserve truth) and the *marketing* (experience).
      *   **Ruled Out Theories:** Hedonism, Utilitarianism, Market Logic.
      *   **Consistency Check:** The Donor Paradox.
      *   **Underdetermination:** Where the logic is fuzzy (Future generations vs. Current scholars).
      *   **The Experience Counterfactual:** What a true "Experience Museum" would look like (and why it terrifies curators).

  6.  **Writing the Response:** (Iterative drafting, ensuring all constraints of the prompt are met.) *Self-correction during drafting: Make sure to explicitly answer the library comparison.* Libraries weed because books are multiple copies; art is singular. That's a key ontological difference.

  7.  **Final Polish:** Check against the specific questions in the prompt one last time.
      *   Reconstruct implicit theory? Yes.
      *   Separate strict commitments from comfortable fits? Yes.
      *   Rival accounts ruled out? Yes.
      *   Consistency of parts (including donors)? Yes.
      *   Underdetermined areas? Yes.
      *   What would change under experience view? Yes.

      *(Proceed to generate output based on this structure.)*
answer: |-
  This is a sharp dissection of the modern museum's ontological schizophrenia. You have identified a triad of practices that, taken literally, contradict one another. To make them hang together, we have to reconstruct the implicit theory of value that museum professionals actually operate under, which is distinct from both their public marketing and strict philosophical aesthetics.

  Here is a reconstruction of that theory, an audit of its consistency, and a look at what would happen if they actually believed their own marketing.

  ### 1. The Implicit Theory: "Custodial Indexicalism"

  The museum does not actually believe value resides primarily in the *experience* of the viewer, nor does it believe value resides solely in the *aesthetic properties* of the object.

  The implicit theory is **Custodial Indexicalism**. It posits that:
  1.  **The Object is a Witness:** An artwork is not just an image; it is a physical trace (an index) of a specific human act at a specific time by a specific agent. Its primary value is *testimonial*.
  2.  **The Museum is a Trust, Not an Owner:** The institution does not own the collection; it holds it in trust for a trans-generational public (including the unborn).
  3.  **Value is Intrinsic but Latent:** The object possesses value even in the dark. Access is a duty, but preservation is the primary commandment.

  **How this reconciles your three observations:**
  *   **Storage/No-Sell:** If the object is a witness held in trust for the future, selling it for operating costs is a breach of fiduciary duty to future generations. It converts a permanent cultural asset into a consumable resource (like burning a historic house to keep warm). The library comparison fails because books are *multiples*; a museum object is a *singular*. Weeding a library removes a copy; deaccessioning a unique object removes the only witness.
  *   **Experience Metrics:** This is not the ontological claim; it is the *political* claim. It is the language required to secure state funding and charitable status in a utilitarian age. It is the "cover story," not the "core doctrine."
  *   **Forgery/Provenance:** This is the smoking gun for Indexicalism. If value were aesthetic/experiential, a perfect forgery would suffice. But if value is *testimonial* (a record of Vermeer's hand), a forgery is a lie. Provenance increases value because it tightens the chain of custody, verifying the witness.

  ### 2. Strict Commitments vs. Comfortable Fits

  We must separate what the practice *forces* the museum to believe from what merely *suits* it.

  **Strict Commitments (What the rules entail):**
  *   **The Anti-Commodification Principle:** The collection cannot be treated as liquid capital. This strictly rules out the view that art is an asset class.
  *   **The Truth Condition:** Authenticity is non-negotiable. This commits the museum to the view that historical truth outweighs aesthetic pleasure.
  *   **Intergenerational Equity:** Current visitors are secondary to the survival of the object. We store things now so they exist in 2124.

  **Comfortable Fits (What fits but isn't required):**
  *   **The "Slippery Slope" on Selling:** The rule that sale proceeds must only buy new art is often justified as preventing a slippery slope (if you sell for light bills, you'll sell everything). This is consequentialist. But the *strict* commitment is deontological (the object is sacred). The consequentialist argument is just a convenient shield.
  *   **Donor Affection:** Cultivating donor affection fits the "Trust" model (finding new trustees) but sits awkwardly with the "Public Good" model. It is a pragmatic compromise, not a theoretical commitment.

  ### 3. Rival Accounts Ruled Out

  The museum's habits quietly but aggressively rule out three major philosophical accounts of value:

  *   **Aesthetic Hedonism:** (Value = Pleasure). Ruled out by the forgery reaction. If the experience is identical, the value should be identical. The museum says it is not.
  *   **Strict Utilitarianism:** (Value = Maximize Current Welfare). Ruled out by the storage/deaccessioning rules. A utilitarian museum would sell the unseen Rembrandts to fund art therapy for a thousand at-risk youths. The fact that they don't proves they value the *object's existence* over the *subject's current utility*.
  *   **Market Liberalism:** (Value = Price/Liquidity). Ruled out by the deaccessioning taboo. In a market view, an asset not generating revenue is dead weight. In the museum view, it is a dormant seed.

  ### 4. Consistency Check: The Donor Paradox

  You asked if the three parts presuppose consistent things, including the donor-affection bit.

  **The Tension:**
  The "Custodial Trust" model implies disinterested stewardship. The "Friends and Naming Rights" model implies a transactional relationship where social capital is exchanged for financial capital.

  **The Resolution:**
  It is consistent *only if* you view the donor not as a customer buying a service, but as a **Patron entering the Trust.**
  *   When a donor names a gallery, they are not buying ad space; they are buying *immortality* and association with the sacred.
  *   The museum converts "personal affection" into money, yes, but it theoretically requires that the money be restricted to the mission (preservation/access).
  *   **The Break Point:** Inconsistency arises when donor preference dictates *curatorial* decisions (e.g., "I will donate this only if you hang it prominently"). Most museum ethics codes forbid this, but in practice, it happens. When it does, the "Trust" model collapses into the "Country Club" model.

  **Verdict:** Theoretically consistent (Patronage), practically fragile (Corruption).

  ### 5. Where It Is Underdetermined

  There are gaps where the practice allows multiple theoretical explanations:

  *   **Why Store?** Is it for *Future Scholars* (Kantian/Archival view: truth must be available for study) or *Future Generations* (Romantic view: the sublime must survive)? The practice fits both, but they imply different priorities. The former prioritizes cataloguing; the latter prioritizes climate control.
  *   **The Deaccessioning Ban:** Is this rule **Deontological** (selling is inherently wrong/sacrilege) or **Consequentialist** (selling leads to bad outcomes)?
      *   *Evidence for Consequentialism:* The rules loosened during the pandemic. If it were sacred law, it wouldn't bend.
      *   *Evidence for Deontology:* The backlash was moral outrage, not just practical worry.
      *   *Result:* The theory is underdetermined here. It acts like a religious taboo but justifies itself like a financial regulation.
  *   **The "Mind Admiring" Argument:** You mentioned the argument that value lies in "a mind admiring something worth admiring." This is a relational theory (likely echoing Kant or G.E. Moore's *Principia Ethica*).
      *   *Fit:* It explains why provenance matters (it makes the object "worth admiring").
      *   *Misfit:* It should license selling. If selling one painting allows 10,000 more minds to admire worthy things (via free schools), the relational calculus favors the sale. The museum's refusal to sell suggests they value the *specific relation* to the *specific object* over the *aggregate of relations*.

  ### 6. The Counterfactual: A Truly Experience-Based Museum

  If a major museum took the "Experience/Wellbeing" justification seriously—as its ontological core, not just its marketing—it would look radically different. It would cease to be a museum and become a **Theme Park of Aesthetics.**

  1.  **Replicas over Originals:** If the value is the visual experience, high-resolution facsimiles should replace originals on the wall. The originals would be sold to fund the technology. (Currently, museums treat this as heresy).
  2.  **Aggressive Deaccessioning:** Any object not viewed by $X$ visitors per year would be sold to fund immersive installations for the popular hits. Storage would be minimized.
  3.  **Provenance Irrelevance:** Labels would focus on "How this makes you feel" rather than "Who owned this in 1740." Forgery would be a minor scandal, not an existential crisis, provided the visual experience remained moving.
  4.  **Ephemeral Programming:** Permanent collections would be viewed as a drag on capital. The budget would shift from conservation to temporary, high-engagement events.
  5.  **Digital Priority:** If the goal is "access," the physical building is a bottleneck. A true experience-museum would digitize everything and close the building, maximizing global access over local pilgrimage.

  ### Summary

  The museum is not lying, but it is speaking two languages.
  *   **To the Art:** It speaks the language of **Sacred Trust** (Indexicalism). The object is a witness that must be preserved truthfully.
  *   **To the State/Public:** It speaks the language of **Social Utility** (Utilitarianism). We make people happy and educated.

  The friction you feel is the sound of these two languages grinding against each other. The "No Sell" rule and the "Forgery Panic" prove that the **Sacred Trust** model is the operational reality. The "Visitor Numbers" are merely the tax paid to keep the temple open.

  If they truly believed the Experience model, they would sell the storage, hang the replicas, and turn the vaults into cash for community programs. They don't do that because, deep down, they believe the object matters more than the viewer. They just can't say that out loud anymore.
