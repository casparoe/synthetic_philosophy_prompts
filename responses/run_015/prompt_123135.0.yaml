prompt: |-
  My friend and I spent most of last night arguing about process-based versus outcome-based supervision of AI systems, and I'd like to settle it in the vocabulary I actually trust rather than the one the field uses. I spent fifteen years in pharmaceutical manufacturing quality assurance, so my working terms are: critical quality attributes, critical process parameters, in-process controls, process validation as opposed to release testing of finished product, process capability, out-of-specification investigations, and corrective and preventive action. Assume I'm fluent in all of it and use it without defining it.

  Take the concrete case we were fighting over: an agent that writes and runs code autonomously over several hours, where outcome supervision means grading only whether the final tests pass and process supervision means grading or constraining each step of the trajectory. Restate the case for process-based supervision — and the objection to outcome-based supervision — in my vocabulary as faithfully as you can, and then give me the residue report. Two claims of my friend's I couldn't answer: first, that process supervision is just release testing relocated upstream, so it inherits the same defect one level down, except now the number of steps multiplies the surface you must inspect while you still have no validated analytical method for what a good step is; second, that the manufacturing analogy breaks at a specific joint, because a reactor does not read its own validation protocol, whereas the thing being supervised here is an optimizer whose parameters reorganize in response to whatever signal you use to inspect it — inspector and process sit inside one optimization loop, for which my framework has no heading at all.

  Tell me where each claim lands: what maps cleanly onto step-level credit assignment and traceability, what has to be distorted to fit — especially whether process validation can really be separated from release testing when the process you are validating is itself selected for scoring well on your in-process checks — and what cannot be expressed in my vocabulary even in principle. Then give me your verdict on the residue: is it a blind spot in the quality-assurance frame, or a sign that 'process-based supervision' names several different things that its defenders are treating as one?
