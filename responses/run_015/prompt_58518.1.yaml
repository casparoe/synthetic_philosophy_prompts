      *   *Councillors:* Elections + Term Limits. Implies: Need accountability (elections) but fear entrenchment/corruption (term limits).
      *   *Citizens' Assembly:* Sortition. Advisory. Ignored. Implies: Good for gathering opinion/legitimacy, but not trusted with final decision-making power compared to elected officials.

  3.  **Identify the Underlying Theory (The "Unspoken Logic"):**
      *   *Competence:* Ordinary people are "competent enough" for *judgment* (facts, fairness) but not *governance* (strategy, trade-offs). Or, they are competent but need a framework (judge/chair) to work.
      *   *Corruption/Entrenchment:* Career politicians are inherently risky (power corrupts). Fresh blood is needed.
