  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a pub argument about their local political system after being summoned for jury service.
      *   **The System Described:**
          *   Criminal juries & planning appeal panels: Random selection (sortition) from adult residents, mandatory service.
          *   City councillors: Elected, term-limited (2 x 4 years), then banned for life (no career politicians).
