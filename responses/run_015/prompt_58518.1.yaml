answer: |-
  That sounds like a proper spirited pub debate, and honestly, your mate isn't wrong to call it a bit of a mash-up. But you're also right to sense there's a logic to it, even if it's not written down anywhere. It's not necessarily *incoherent*, but it is a very specific hybrid model that tries to balance two competing fears: the fear that ordinary people don't know enough to run things, and the fear that professional politicians will ruin things.

  Here is a reconstruction of the unspoken theory your local setup presupposes, broken down into how it views competence, corruption, and legitimacy, keeping it plain and in British English.

  ### 1. The Three Buckets of Power
  To understand the theory, we have to look at how your system treats the three different groups you mentioned. It effectively splits political power into three distinct jobs:

  *   **The Jury (Random Selection):** Their job is **Judgment**. They decide on facts and fairness in specific cases (criminal guilt, planning disputes).
  *   **The Councillor (Elected + Term-Limited):** Their job is **Stewardship**. They set the budget, the strategy, and the long-term direction.
  *   **The Citizens' Assembly (Random Selection):** Their job is **Advice**. They gather public wisdom but hold no power.

  ### 2. The Unspoken Theory
  Your local system rests on three main assumptions about human nature and power.

  **A. Competence: "Ordinary folk are fair, but politicians are strategic."**
  The system assumes that for *judgment* (like a jury verdict), you don't need special training; you just need common sense and neutrality. A random cross-section of the pub is actually *better* than a specialist because they won't be biased.
  *However*, for *governance* (running the council), the system assumes you need people who are motivated to campaign and lead. But—and this is key—it assumes their competence decays over time. They might start well, but they lose touch.

  **B. Corruption: "Power sticks."**
  The lifetime ban on councillors after two terms is the most radical part. This presupposes that "career politicians" are a distinct class of risk. It assumes that if someone stays in power too long, they start serving their own interest (keeping their job) rather than the public interest. It treats political experience not as an asset (like a doctor getting more experienced), but as a liability (like a rot setting in).

  **C. Legitimacy: "Consent vs. Fairness."**
  *   **Elections** provide legitimacy through **consent** ("We chose you").
  *   **Random Selection** provides legitimacy through **fairness** ("You didn't pick the winners, nobody was favoured").
  The system uses random selection where neutrality is key (court, planning) and elections where accountability is key (budget, taxes).

  ### 3. Strict Needs vs. Contingent Fits
  This is the crux of your argument. What does this system *have* to do to make sense, and what is just habit?

  **What it Strictly Needs (The Logical Glue):**
  1.  **If you ban career politicians, you must accept high turnover.** You cannot complain that councillors are inexperienced. The theory *requires* a constant influx of amateurs. If you demanded professional expertise from councillors while banning experience, the system would break.
  2.  **If you trust random people with liberty (juries), you must trust them with some truth.** You can't say "random people are wise enough to send someone to prison" but "random people are too stupid to understand housing policy." The system presupposes that ordinary people are intellectually capable of understanding complex issues *if* the question is narrow enough.
  3.  **If you use Citizens' Assemblies, they must be insulated from pressure.** To get the "fairness" benefit of random selection, those 60 people need to be paid and protected from lobbying. Your council did this part right.

  **What is Just Contingent (The Wobbly Bits):**
  1.  **Ignoring the Assembly's Report.** This is the weakest link. Logically, if you believe random selection is good for juries, there is no strict reason why a random assembly's advice on housing should be shelved. The theory *allows* for the assembly to be advisory, but if the council *always* ignores them, it reveals that the council doesn't actually believe in the "wisdom of the crowd" for policy, only for judicial matters. This is where your mate has a point: it looks like the council wants the *look* of democracy without the *substance*.
  2.  **The Lifetime Ban.** Banning councillors for life is a very blunt instrument. The theory needs *term limits* to stop careerism, but a lifetime ban is extreme. It fits with a view that politics is "contagious," but it isn't strictly necessary to prevent careerism (a 10-year break would do the same job).

  ### 4. What if we swapped in the opposite view?
  To see the theory clearly, imagine we adopted the opposite presuppositions. This is closer to how the UK Parliament or many other councils work.

  *   **The Opposite View:** Politicians are professionals who get better with time (like doctors). Ordinary people are too busy or uninformed to make complex trade-offs.
  *   **The Changes:**
      1.  **No Term Limits:** Popular councillors could serve for 30 years. Experience is valued over fresh blood.
      2.  **No Random Juries:** We might move to a system of elected judges or professional panels, assuming they know the law better than a random punter.
      3.  **Binding Assemblies:** If we truly trusted random selection, the Citizens' Assembly wouldn't be advisory. Their vote would be law. If the opposite view were held (that people aren't competent), we wouldn't even bother running the Assembly.

  ### 5. The Verdict for the Pub
  Your system isn't incoherent, but it is **schizophrenic**.

  It holds two conflicting views at once:
  1.  **Optimism:** Ordinary people are wise enough to judge crimes and housing needs (hence juries and assemblies).
  2.  **Pessimism:** Ordinary people (once elected) cannot be trusted with long-term power (hence term limits), and their collective advice can be ignored by the elite (hence shelving the report).

  **The strict requirement for your system to be honest:**
  If the council wants to keep ignoring the Citizens' Assembly, they should stop running them. It's a waste of money to ask 60 people for advice you intend to bin.
  If they want to keep the lifetime ban on councillors, they need to provide massive support and training for new ones, because they are deliberately choosing inexperience to fight corruption.

  **In short:** Your mate is right that the *status* of random people is inconsistent (trusted in court, ignored in housing). But the system isn't random chaos; it's a deliberate attempt to use ordinary people as a **check on power** (juries) without giving them the **reins of power** (council), while simultaneously trying to stop the people with the reins from becoming kings. It's a system designed to distrust everyone equally—politicians, experts, and the public alike—and hope that by mixing them up, nothing goes too wrong.

  Next time you're in the pub, tell your mate: "It's not incoherent, it's just cynical. They trust us to clean up the mess, but not to plan the party."
