      *   **The Task:** Reconstruct the underlying political theory (view of representation, competence, corruption). Distinguish between what the system *strictly needs* (logical consistency) vs. what it just *fits with* (contingent habits). Explore assumptions about elections vs. sortition. Explain what would change if the opposite view were adopted.
      *   **Tone/Style:** British English, accessible (no heavy jargon, user hasn't studied philosophy since A-levels).

  2.  **Deconstruct the Political System (The "Mash-up"):**
