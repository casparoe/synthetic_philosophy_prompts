  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the pub setting, validate the friend's confusion (it *is* a bit of a hybrid), but state that there *is* a logic to it. Use British English (e.g., "council," "programme," "maths").
      *   **Part 1: The Three Buckets of Power:** Break down the three mechanisms observed (Juries, Councillors, Assemblies).
      *   **Part 2: The Unspoken Theory (Reconstruction):**
          *   *On Competence:* Distinguish between "Judgment" (Juries) and "Stewardship" (Councillors). Random people judge facts; elected people manage strategy.
