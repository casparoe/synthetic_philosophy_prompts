answer: |-
  There is no single, canonical term in the standard taxonomy of fallacies that captures this specific trajectory. However, in bioethics and political philosophy, this phenomenon is best characterized as **Deontic Ratcheting** (specifically, **The Beneficence Ratchet**).

  It is a form of **Normative Creep** distinct from institutional function creep because it operates within the logic of moral justification rather than organizational mission. It describes the structural mechanism by which a **supererogatory act** (something good to do but not required) is transformed into an **obligatory act** (something required) through the introduction of technological capacity and a specific framing of parental responsibility.

  Below is the carving of this phenomenon: its mechanics, its distinctions from adjacent concepts, and its boundary conditions.

  ### 1. The Mechanics of the Shift
  The trajectory you describe is not a logical fallacy in the strict sense (the conclusion can follow validly from the premises), but it is a **rhetorical and normative transformation**. It operates through three distinct phases:

  *   **Phase 1: The Liberal Foothold (Permission).** The argument begins with a negative right: *Parents have the liberty to use technology.* This secures the alliance of libertarians and defenders of reproductive autonomy. The moral status of *not* using the technology is neutral.
  *   **Phase 2: The Introduction of Capacity (Beneficence).** A second premise is introduced: *Parents have a duty to promote the welfare of their future child.* Crucially, this is initially framed as compatible with Phase 1 (you are free to fulfill this duty).
  *   **Phase 3: The Collapse (Obligation).** The two premises interact via the **Principle of Capacity**: If an agent *can* prevent harm or secure good at low cost, they *ought* to. Because the technology exists (Phase 1) and welfare is paramount (Phase 2), the *option* to decline is re-described as a *failure* to fulfill the duty. The moral status of *not* using the technology shifts from neutral to negligent.

  **The Pivot Point:** The critical mechanism is the **re-description of omission as commission**.
  *   *Initial Frame:* Not selecting is "letting nature take its course" (Omission/Neutral).
  *   *Final Frame:* Not selecting is "choosing a worse genetic lottery" (Commission/Harmful).
  Once the omission is re-described as a choice among available options, the liberal permission collapses under the weight of the beneficence duty.

  ### 2. Distinctions from Adjacent Concepts

  To carve this precisely, we must distinguish it from concepts it resembles but is not.

  **A. vs. The Slippery Slope**
  *   **Slippery Slope:** Empirical and causal. It argues that accepting $A$ will *cause* society to slide to $B$ due to psychological or institutional inertia (e.g., "If we allow embryo screening, soon we will be designing babies").
  *   **Deontic Ratcheting:** Logical and normative. It argues that accepting $A$ (Liberty) and $B$ (Beneficence) *entails* $C$ (Obligation) based on moral consistency. It does not predict what *will* happen; it prescribes what *must* be thought. The "slide" is not a loss of control, but a tightening of logical consistency.

  **B. vs. Equivocation**
  *   **Equivocation:** Uses a term with two different meanings in the same argument (e.g., using "freedom" to mean "absence of law" then "capacity to act").
  *   **Deontic Ratcheting:** The terms remain stable. "Liberty" means liberty throughout. The shift occurs in the **weighting of principles**. The "Liberty" principle is not redefined; it is simply overridden by the "Beneficence" principle once the technological means are established. It is a **Normative Override**, not a semantic trick.

  **C. vs. The Non-Identity Problem**
  *   **Non-Identity (Parfit):** Concerns *who* comes into existence. It argues that selecting a different embryo creates a *different person*, so one cannot claim to have harmed the specific child who exists (since they wouldn't exist otherwise).
  *   **Deontic Ratcheting:** Sidesteps the metaphysical question of identity. It operates on the **Parent-Child Relationship** regardless of identity. It argues that *whoever* the child is, the parent had a duty to select the version with the best prospects. It transforms the debate from "Harm to a specific person" to "Responsibility of the progenitor."

  **D. vs. Technological Imperative**
  *   **Technological Imperative:** "If it can be done, it should be done." This is driven by the momentum of the technology itself.
  *   **Deontic Ratcheting:** Driven by **ethics**, not technology. The technology is merely the *condition of possibility*. The pressure comes from the moral demand for beneficence. The tech doesn't force the hand; the *duty to use the tech* forces the hand.

  ### 3. Boundary Conditions: When has the Shift Occurred?

  To identify this phenomenon and distinguish it from ordinary moral reasoning, three boundary conditions must be met. If any are absent, the phenomenon is not present.

  **Condition 1: The Availability of Means (The Capacity Threshold)**
  The shift cannot occur without the specific technology.
  *   *Present:* Genetic screening exists; parents *can* select.
  *   *Absent:* Parents are urged to "have healthier children" but lack the means to ensure it.
  *   *Boundary:* If the technology is experimental or highly risky, the duty does not crystallize. The ratchet only locks when the means are safe, accessible, and effective.

  **Condition 2: The Re-description of Inaction (The Harm Threshold)**
  The shift requires that *not acting* be successfully framed as *inflicting harm*.
  *   *Present:* "Choosing not to screen is choosing to risk a preventable disease."
  *   *Absent:* "Choosing not to screen is accepting the natural order."
  *   *Boundary:* If the condition being screened for is minor (e.g., eye color), the "harm" framing fails, and the ratchet stalls. The shift relies on the condition being significant enough to count as a "disadvantage."

  **Condition 3: The Erosion of the Supererogatory**
  The shift is complete when the act moves from "praiseworthy if done" to "blameworthy if not done."
  *   *Present:* Parents who decline screening are viewed as irresponsible or requiring justification.
  *   *Absent:* Parents who decline screening are viewed as exercising a valid preference.
  *   *Boundary:* If the social cost of declining is zero, the ratchet has not engaged. The phenomenon is defined by the **social/moral pressure** applied to the dissenter.

  ### 4. Boundary Cases (Inclusions and Exclusions)

  To further sharpen the carving, consider these cases:

  **Case A: Vaccination (Included)**
  *   *Trajectory:* Parents *may* vaccinate $\rightarrow$ Vaccination prevents harm $\rightarrow$ Parents *ought* to vaccinate.
  *   *Verdict:* This **is** Deontic Ratcheting. It follows the exact same logic: Liberty + Beneficence + Capacity = Obligation. The moral status of the unvaccinated child's parents shifts from "exercising choice" to "endangering the herd/child."
  *   *Nuance:* The ratchet here is often legal (state mandate), whereas in genetic selection, it is often social/moral. But the normative logic is identical.

  **Case B: Organic Diet for Children (Excluded)**
  *   *Trajectory:* Parents *may* feed organic $\rightarrow$ Organic is healthier $\rightarrow$ Parents *ought* to feed organic?
  *   *Verdict:* This is **not** Deontic Ratcheting (usually).
  *   *Reason:* It fails Condition 2 (Harm Threshold). The link between "non-organic" and "harm" is contested and probabilistic, not direct and preventable. The "Capacity" to avoid harm is not clear-cut. Therefore, the permission does not collapse into obligation; it remains a lifestyle choice.

  **Case C: State-Mandated Sterilization (Excluded)**
  *   *Trajectory:* The state requires sterilization for certain groups.
  *   *Verdict:* This is **Coercion**, not Ratcheting.
  *   *Reason:* Deontic Ratcheting relies on the *internal logic of responsibility* persuading the agent (or the community judging the agent). State coercion bypasses the moral reasoning entirely. The "shift" here is not from permission to duty, but from citizen to subject.

  **Case D: Prenatal Vitamins (Borderline)**
  *   *Trajectory:* You *may* take folic acid $\rightarrow$ It prevents defects $\rightarrow$ You *should* take it.
  *   *Verdict:* This is a **Soft Ratchet**.
  *   *Reason:* It occupies the middle ground. It is strongly expected (medical standard of care) but declining it does not carry the same moral stigma as declining genetic screening for a known carrier status. It illustrates that the Ratchet has **degrees of torque**. The stronger the causal link between tech and outcome, the tighter the ratchet.

  ### 5. Proposed Definition

  If you require a term to label this for your work, I propose:

  >**Deontic Ratcheting via Technological Capacity**
  > *A normative dynamic in which a moral permission (liberty to use a technology) is transformed into a moral obligation (duty to use a technology) through the conjunction of a beneficence principle and the reliable availability of means. The mechanism relies on re-describing the omission of technology use as a voluntary selection of a sub-optimal outcome, thereby eroding the category of the supererogatory.*

  ### Summary of the Carving
  This phenomenon is not a fallacy of logic, but a **transformation of moral topology**. It changes the landscape from a flat plain of options (where all choices are permissible) to a sloped surface (where some choices are "uphill" and require justification).

  It differs from the **Slippery Slope** because it is driven by consistency, not inertia.
  It differs from **Equivocation** because the terms hold their meaning while their priority shifts.
  It differs from **Function Creep** because it is about *duty*, not *usage*.

  The edge of the concept lies at the **Harm Threshold**. Where the prevention of disadvantage is clear and the means are safe, the Ratchet engages. Where the benefit is speculative or the means are risky, the Permission remains a Permission. The phenomenon you are tracking is the moment the language shifts from "you can help" to "you must not harm," facilitated entirely by the existence of the tool to do so.
