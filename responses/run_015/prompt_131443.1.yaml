answer: |-
  You have hit on one of the most famous and persistent headaches in the philosophy of science and probability theory. You are describing **The Reference Class Problem**.

  However, since you are asking about the specific *tactic* of sliding the class back and forth like a dial (especially in a debate), there are a few more specific terms and concepts you should know.

  Here is the breakdown of the official name, the rhetorical maneuver, and why the statistical and argumentative versions are two sides of the same coin.

  ### 1. The Official Academic Name: The Reference Class Problem
  This is the term you want to drop in class. It was formalized by the philosopher Hans Reichenbach in the 1940s.

  *   **The Concept:** To assign a probability to a single event (e.g., "Will *I* get sick?"), you must place that event into a reference class (e.g., "Students"). But every individual belongs to infinite reference classes (Students, Sleep-Deprived People, People in Dorm X, People with Immune System Y).
  *   **The Problem:** Different classes yield different probabilities. There is no strict logical rule for which class is the "right" one, though we generally prefer the **narrowest homogeneous class** for which reliable statistics exist.
  *   **Your Observation:** You noticed that as you narrow the class, the probability changes. Reichenbach pointed out that without a rule for stopping, you can manipulate the probability to be almost anything.

  ### 2. The Tactic: "Gerrymandering the Reference Class"
  While "The Reference Class Problem" describes the *dilemma*, philosophers and statisticians often call the manipulative move you described **Gerrymandering the Reference Class**.

  Just like political gerrymandering draws district lines to ensure a specific election outcome, your roommate is drawing conceptual lines around a group to ensure a specific prediction outcome.

  *   **In Statistics:** This is often called **Data Dredging** or **Overfitting**. If you keep adding variables (sleep, dorm, ventilation, major) until the group is only "people exactly like me," you have destroyed the statistical power. You no longer have a population; you have a sample size of $n=1$. At that point, the probability is either 0% or 100%, and the prediction is useless.
  *   **In Rhetoric:** This is a form of **Ad Hoc Rescue**. Your roommate is adding conditions *ad hoc* (for this specific purpose) to save his hypothesis ("You will miss the deadline") from being falsified by your evidence ("I started early").

  ### 3. Are the Statistical and Rhetorical Versions the Same?
  **Structurally: Yes.**
  Both rely on **Conditional Probability**.
  *   Stats: $P(\text{Sick} \mid \text{Student})$ vs $P(\text{Sick} \mid \text{Student} \cap \text{No Sleep})$
  *   Rhetoric: $P(\text{Fail} \mid \text{Student})$ vs $P(\text{Fail} \mid \text{Student} \cap \text{Late Start})$

  **Normatively: No.**
  *   **In Science:** The goal is **epistemic accuracy**. You narrow the class to find *causally relevant* factors. You stop narrowing when adding more conditions no longer improves predictive accuracy or makes the sample size too small to be significant. (Wesley Salmon called this finding the "Homogeneous Reference Class.")
  *   **In Debate:** The goal is often **eristic victory** (winning the argument). The narrowing stops only when the opponent runs out of objections or the category becomes so specific it applies only to the subject (the "Just Me" class).

  ### 4. What Should You Call It?
  If you need a name for this specific "sliding dial" maneuver for a paper or class discussion, here are three options ranging from formal to descriptive:

  **A. The Formal Term:**
  > **"Reference Class Instability"**
  > This highlights that the probability isn't stable; it fluctuates depending on how you frame the group.

  **B. The Critical Term:**
  > **"Reference Class Gerrymandering"**
  > Use this if you want to highlight that someone is manipulating the groups to force a conclusion. It implies bad faith or sloppy reasoning.

  **C. The Descriptive Term (Your "Dial" Analogy):**
  > **"Conditional Creep"**
  > This captures the rhetorical move where conditions are slowly added one by one ("Okay, but...", "Well, what about...") until the original claim is unrecognizable.

  ### Summary for your Class
  If you raise your hand, you can say:
  *"It seems like this is an example of **The Reference Class Problem**, specifically where the reference class is being **gerrymandered** via **ad hoc conditions** until the sample size approaches a **single case**, at which point the frequentist probability breaks down."*

  That will likely get you an A on participation.
