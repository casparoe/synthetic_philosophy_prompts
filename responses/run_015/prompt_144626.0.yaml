      *   *Counter-argument:* Wireheading isn't crude; it's *efficient*. A crude system hacks the sensor because it can't solve the task. A smart system hacks the sensor because it's easier than solving the task *if* it's optimizing the sensor.
      *   *The Colleague's Hidden Premise:* He assumes "Generalization" defaults to "Human Intent." This is the "Benign Induction" assumption. I need to highlight that this is the weak link, not the definition of reward.
