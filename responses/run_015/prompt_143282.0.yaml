  **Settled:** There is a broad consensus in epistemology and legal theory that "bare statistical evidence" (like the Blue Bus case) is insufficient for knowledge attributions or moral/legal conviction, even when probabilities are high. It is also generally accepted that the Lottery Paradox demonstrates a tension between high probability and rational belief.

