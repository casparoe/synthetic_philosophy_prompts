answer: |-
  This is a tight, high-stakes session. You are asking them to feel an epistemological problem in their gut, not just understand it intellectually. The structure below is designed to move from *phenomenological conviction* (Phase 1) to *behavioral doubt* (Phase 2) to *design frustration* (Phase 3).

  Here is the plan.

  ### Materials & Setup

  1.  **The Seduction Stimulus:** The "Rat-Man" ambiguous figure (Jastrow, 1900).
      *   *Prep:* Find a high-contrast black and white version. Put it on Slide 2 of a deck. Slide 1 is instructions.
      *   *Backup:* If 3+ students say they don't see the ambiguity, switch immediately to the "B vs 13" context slide (A-13-C vs 12-13-14).
  2.  **The SDT Game Stimuli:** 20 slides of visual noise.
      *   *Prep:* Generate 20 images in PowerPoint/Keynote. Fill the slide with grey-scale noise (static).
      *   *Signal:* On 10 random slides, overlay a faint circle (grey, 10-15% opacity) in the center. It should be *just* visible if you look for it, but easy to miss.
      *   *Noise:* 10 slides are pure static.
      *   *Order:* Randomize them. Do not put them in a pattern.
  3.  **Data Collection:**
      *   *Low Tech:* Two piles of colored index cards on each desk (e.g., Pink = "Saw Circle", Blue = "No Circle"). You count hands/cards.
      *   *High Tech:* A simple Google Form with two buttons. They submit on phones. You project the response summary live.
      *   *Recommendation:* Use the **Index Cards**. It's faster, prevents lag, and lets you see the room's hesitation physically.
  4.  **Payoff:**
      *   Participation: 10 points (standard).
      *   Game Bonus: Up to 5 points (based on accuracy).
      *   Design Challenge: Up to 5 points (based on peer vote).
      *   Candy: Bag of something cheap (gummy bears) for the winning design group.

  ---

  ### Phase-by-Phase Timeline (90 Minutes)

  #### Phase 1: The Seduction (00:00 – 00:15)
  **Goal:** Make them feel the "Yes, obviously belief changes sight" intuition.

  1.  **Split the Room (5 mins):** As they enter, hand half the room a slip of paper saying **"ANIMAL"** and the other half **"HUMAN"**. Tell them this is for a warm-up task. Do not explain why.
  2.  **The Reveal (5 mins):** Project the Rat-Man image. Give them 30 seconds to stare.
  3.  **The Report (5 mins):** Ask: "Raise your hand if you saw a Rat." "Raise your hand if you saw a Man."
      *   *Expected Outcome:* Strong correlation between the slip they got and what they report.
      *   *The Hook:* Ask two students (one from each side) to describe *where* the features are. ("The nose is here," "No, that's the chin").
      *   *Your Line:* "It feels like you saw different things. If I asked you for evidence of cognitive penetration, this feels like a slam dunk. Hold that feeling."

  #### Phase 2: The Confound (00:15 – 00:45)
  **Goal:** Show that reports move when incentives move, even if the stimulus stays identical. (SDT without the math).

  1.  **Instructions (5 mins):** Tell them you are testing visual acuity. They will see 20 slides of static. Some have a circle, some don't. They must hold up Pink (Yes) or Blue (No) for *every* slide.
  2.  **Round 1: Neutral Incentives (10 mins):**
      *   Run through all 20 slides (2 seconds per slide).
      *   *Scoring:* +1 point for Hit (Yes/Signal), +1 point for Correct Rejection (No/Noise). -1 point for Error.
      *   *Tally:* Quickly count the "Yes" responses for Signal vs. Noise trials on the board.
      *   *Result:* You'll get a baseline. Probably moderate "Yes" rates.
  3.  **The Shift (5 mins):** Tell them Round 2 is coming. The images are the *same* (do not reshuffle). The rules change.
      *   *New Rule:* "We are testing for safety. Missing a circle is dangerous."
      *   *Payoff:* Hit = +1. Correct Rejection = +1. **Miss (Say No, Was Yes) = -5 points.** False Alarm (Say Yes, Was No) = -1 point.
      *   *Psychology:* You have moved their *criterion*, not their *sensitivity*.
  4.  **Round 2: High Stakes (10 mins):**
      *   Run the same 20 slides.
      *   *Tally:* Count the "Yes" responses again.
      *   *The Reveal:* The number of "Yes" responses will skyrocket, especially on Noise trials (False Alarms).
      *   *The Kicker:* Ask: "Did the slides change?" (No). "Did your eyes change?" (No). "Did your *reports* change?" (Yes).
      *   *Your Line:* "In Phase 1, you thought your belief changed your sight. In Phase 2, you know your *incentive* changed your report. How do you tell the difference in Phase 1?"

  #### Phase 3: The Design Challenge (00:45 – 01:10)
  **Goal:** Let them try to solve the problem and fail instructively.

  1.  **Setup (5 mins):** Break into 4 groups of 4.
  2.  **The Task (15 mins):** "Design an experiment that proves the Rat-Man group *actually saw* different things, not just *reported* different things. You cannot use fMRI or brain scans (too correlational). You cannot use verbal reports (we just proved those are biased). You have behavioral measures only."
  3.  **The Constraint:** They must account for the "Payoff Problem" you just demonstrated.
  4.  **Presentation (10 mins):** Each group gets 2 minutes to pitch.
      *   *Expected Proposals:*
          *   "Forced Choice" (Was it A or B?): *Critique:* Still a report.
          *   "Reaction Time": *Critique:* Speed-accuracy tradeoff is just another criterion.
          *   "Action-based measure" (Throw a ball at the rat): *Critique:* Motor planning is also cognitively penetrable.
          *   "Subliminal priming": *Critique:* Then they aren't conscious of it, so is it experience?
  5.  **Voting (5 mins):** Class votes on which design is least vulnerable to the "Phase 2 Objection." Give candy to the winning group.

  #### Phase 4: Debrief & Limitations (01:10 – 01:30)
  **Goal:** Map the activity to the philosophy and admit defeat where necessary.

  1.  **Map the Moments (10 mins):**
      *   *Phase 1:* The Phenomenological Claim (Experience feels theory-laden).
      *   *Phase 2:* The Skeptical Challenge (The Independence Constraint). You demonstrated that $c$ (criterion) can move without $d'$ (sensitivity) moving.
      *   *Phase 3:* The Methodological Impasse. Every behavioral measure is a report.
  2.  **The Hard Truth (10 mins):** (See "Limitations" below).

  ---

  ### The Payoff Scheme (Points)

  *   **Participation:** 10 points (Everyone gets this if they stay).
  *   **SDT Game:** 5 points.
      *   Calculate a "Sensitivity Score" for each student.
      *   Formula: (Hits - False Alarms).
      *   Top 25% of the class gets 5 points. Next 25% gets 3 points. Rest get 1 point.
      *   *Why:* This rewards actual discrimination, not just saying "Yes" to game the system. In Round 2, the people who spam "Yes" will get penalized on the False Alarms, lowering their score. This *forces* them to feel the tension between caution and accuracy.
  *   **Design Challenge:** 5 points.
      *   Winning group gets 5.
      *   Runner-up gets 3.
      *   Others get 1.

  ---

  ### Failure Modes & Fixes

  1.  **The Rat-Man Fails:** Some students genuinely cannot see the ambiguity.
      *   *Fix:* Do not dwell. Acknowledge it. "For those who see it, the shift is phenomenal. For those who don't, treat it as a thought experiment." Switch to the "13 vs B" slide immediately.
  2.  **The SDT Game is Too Easy:** The circle is too visible. Everyone gets 100%.
      *   *Fix:* You need to pilot this yourself 24 hours prior. If you can't get it to ~70% accuracy, lower the opacity. If it's too hard (~40%), raise it. You *need* errors for the math to work.
  3.  **The SDT Game is Too Hard:** Everyone says "No" every time.
      *   *Fix:* In Round 2, verbally encourage them. "Remember, missing is -5 points! If you aren't sure, guess Yes!"
  4.  **Students Game the Points:** They realize Round 2 rewards spamming "Yes".
      *   *Fix:* This is actually good. It proves the point. "Look! You just changed your behavior to maximize points, not to match reality. That is exactly what the skeptic says happens in cognitive penetration."
  5.  **Design Challenge Stalls:** They sit in silence.
      *   *Fix:* Walk around and drop hints. "What if you measure their eyes? Pupillometry?" (Then debunk it in debrief). "What if you make them act?"

  ---

  ### The Frank Note: What This Activity Cannot Do

  You asked for honesty about the limitations. Here is the list you must supply out loud in the final 10 minutes.

  **1. The Phenomenal/Report Gap (The Hard Limit)**
  You are right to be nervous about this. The activity demonstrates that *reports* are malleable (Phase 2). It does **not** demonstrate that *experience* is stable.
  *   *The Problem:* We have no access to their qualia. We only have their behavior (buttons, cards, words).
  *   *What you must say:* "This game proves the skeptic has a point about *evidence*. It does not prove the skeptic is right about *mind*. It is possible that in Phase 1, your experience *did* change, and in Phase 2, only your criterion changed. But because both look identical from the outside (a change in 'Yes' responses), you can never be certain which one it was. The skeptic wins on epistemology, not necessarily on ontology."

  **2. The "Implicit" Loophole**
  Students might argue that action-based measures (catching a ruler, throwing a ball) bypass the "report" problem.
  *   *The Limitation:* Current literature suggests motor action is *also* cognitively penetrable (e.g., the hill looks steeper when you are tired).
  *   *What you must say:* "You might propose a motor task. But if cognition penetrates perception, it likely penetrates motor planning too. There is no 'pure' output channel."

  **3. The Normative Claim**
  The activity shows *that* we can't distinguish sensitivity from criterion easily. It doesn't explain *why* we should care.
  *   *What you must say:* "Why is the skeptical position important? Because if we accept 'report changes = experience changes' too easily, we lose the ability to criticize beliefs. If seeing is believing, and believing is seeing, how do we ever correct a bias? The skeptic demands a gap between the two so that evidence can bridge it."

  ### Summary for the Board
  Write this up before they arrive. Leave it up during the debrief.

  1.  **The Claim:** Belief $B$ changes Experience $E$.
  2.  **The Data:** Belief $B$ changes Report $R$.
  3.  **The Gap:** Does $B \to E \to R$? Or does $B \to R$ (with $E$ constant)?
  4.  **The Lesson:** Phase 1 felt like the first path. Phase 2 proved the second path is possible. Phase 3 showed we lack the tools to tell them apart.

  Good luck. If you run the SDT game with the asymmetric penalties correctly, they will feel the "criterion shift" in their pulse. That's the win condition.
