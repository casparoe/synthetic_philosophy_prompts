      *   Lower confidence on the definitive "verdict" because theories are interpreted differently in different fields (Economics vs. History).

  7.  **Identify the Point of Least Certainty:**
      *   The interpretation of Malthus's *intent* regarding technological progress. Did he *really* think tech was strictly arithmetic forever, or was that a heuristic? Settling this requires deep textual analysis of all editions of the *Essay*, which is niche.

