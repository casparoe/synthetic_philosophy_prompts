  I want the number decomposed. First, what's the probabily that cultural values can function as a macro-level cause at all without collapsing into either pure methodological individualism or strong structural determinism? Second, how likely is it that Weber's specific psychological mechanism (the salvation-anxiety -> rationalized labor link) is historically accurate for the populations he discusses? Third, what's the chance that even if the mechanism existed, it was actually necessary — that capitalism wouldn't have emerged in those regions through institutional path dependence alone? Fourth, what's the probabily that modern comparative economic history undermines the causal claim rather than just refining it?

  Give me rough numbers for each, tell me how you'd combine them (multiplicative? weighted?), which term is doing the most work, and which piece of evidence would shift your overall number the most. I'm sitting around 0.30 myself but I think my disagreement with a colleague is mostly about that first term — whether values can even be causal in that thick sense — not about the historical details.
