answer: |-
  # Activity Design: The Long Shot Ledger

  ## Overview
  This activity simulates the tension between Expected Value (EV) maximization and intuitive risk aversion. Students act as grant-making committees allocating resources to interventions. Through three rounds of escalating stakes, they will mathematically optimize for "fanatic" options while emotionally recoiling from them. The physical randomness (dice) makes the variance visceral. The debrief connects their in-game frustration and justification to the philosophical literature on fanaticism and Pascal's Mugging.

  ## Materials List
  *   **Dice:** 5 sets of polyhedral dice (at least one D20 and three D6 per group).
  *   **Currency:** 200 poker chips or cardboard tokens per group (colored "Impact Points").
  *   **The "Universe" Deck:** A standard deck of playing cards, shuffled, with one specific card marked (e.g., Ace of Spades with a star). This is for the ultra-low probability resolution.
  *   **Rewards:** A box of individually wrapped cookies or candy (approx. 30 units) and 5 "Homework Pass" tokens.
  *   **Handouts:** One "Grant Ledger" sheet per group (columns for Round, Option Chosen, Probability, Payoff, EV Calculation, Actual Result).
  *   **Whiteboard:** For tracking aggregate class points.

  ## Payoff Scheme & Arithmetic
  The economy is designed so that the **Expected Value** of the risky option always exceeds the safe option, but the **Variance** increases drastically.

  *   **Base Stipend:** Every student receives 1 cookie regardless of outcome (downside protection).
  *   **Bonus Economy:** 100 Impact Points (IP) = 1 Bonus Cookie or 1 Homework Pass (shared by the group).
  *   **Round 1 (Calibration):**
      *   *Option A (Safe):* Automatic 10 IP. (EV = 10)
      *   *Option B (Risky):* Roll D20. On 11–20 (50%), win 25 IP. (EV = 12.5)
      *   *Rational Choice:* Option B.
  *   **Round 2 (The Fanatic Leap):**
      *   *Option A (Safe):* Automatic 10 IP. (EV = 10)
      *   *Option B (Fanatic):* Roll D20 three times. Must get 20 on all three rolls (0.125% or 1 in 8,000). Win 10,000 IP. (EV = 12.5)
      *   *Rational Choice:* Option B (Mathematically identical EV to Round 1 Risk, but variance is astronomical).
      *   *Note:* To save time, if no group hits the 1-in-8000, you (the TA) reveal that *statistically* one should have, highlighting the disconnect between EV and single-instance outcomes.
  *   **Round 3 (The Aggregation Twist):**
      *   Groups propose their own contract. They name a Payoff ($X$). You (the TA) assign the Probability ($P$) such that $P \times X = 20$ IP (double the Safe Option's EV).
      *   *Example:* Group wants 1,000,000 IP. You assign a 1 in 50,000 difficulty (draw the marked card from 50 shuffled decks, or simulate via "God Roll").
      *   *Constraint:* If they win, the *entire class* gets a bonus. If they lose, only their group gets nothing. This introduces the social choice element.

  ## Phase-by-Phase Timeline (80 Minutes)

  ### Phase 1: Setup & Calibration (15 Minutes)
  *   **Mechanic:** Distribute groups (4–5 students), chips, and dice. Explain the Bonus Economy (100 IP = 1 Cookie/Pass).
  *   **Activity:** Round 1. Groups must unanimously choose Option A or B. They must write down the EV calculation on their Ledger before rolling.
  *   **Idea It Targets:** Basic Expected Value. Most groups will choose B. Some will argue "but 50% is a coin flip," introducing risk aversion early.
  *   **Resolution:** Groups roll. Winners take chips. Losers get nothing. Tally on whiteboard.

  ### Phase 2: The Fanatic Leap (25 Minutes)
  *   **Mechanic:** Round 2. Present the Safe Option (10 IP) vs. The Fanatic Option (1 in 8,000 chance for 10,000 IP).
  *   **Activity:** Deliberation. This is where the friction happens. Students will argue that the Fanatic Option is "stupid" despite the EV being higher. You must refuse to adjudicate rationality; insist they choose based on "maximizing expected points."
  *   **Idea It Targets:** The problem of Fanaticism. The EV is optimal, but the probability is too small to feel real.
  *   **Resolution:** Groups roll the D20 three times. *Predictably, everyone fails.* This creates the "demoralizing dry spell."
  *   **Crucial Move:** Do not comfort them. Let them sit with the loss. Ask: "Did you make a mistake?"

  ### Phase 3: The Social Wager (20 Minutes)
  *   **Mechanic:** Round 3. Groups design an intervention. They pick a Payoff. You set the odds to keep EV at 20 IP.
  *   **Twist:** If *any* group hits their Fanatic Jackpot, the *entire class* gets the bonus cookies, not just the group.
  *   **Activity:** Groups will likely inflate the payoff to "1 Billion Points" to help the class, forcing the probability to become absurdly low.
  *   **Idea It Targets:** Aggregation and Social Choice. Does one group's tiny chance of saving everyone justify ignoring certain help for themselves?
  *   **Resolution:** Resolve the rolls (use the Card Deck for very low probs). Usually, no one wins.

  ### Phase 4: The Debrief (20 Minutes)
  *   **Structure:**
      1.  **The Math Check:** Verify on the board that the Fanatic Options had higher or equal EV. Ask: "Why did it feel irrational to choose them?" (Elicits: Risk Aversion, Diminishing Marginal Utility).
      2.  **The Real-World Map:** Reveal that IP = "Lives Saved" or "Units of Wellbeing." Ask: "Is it better to certainly save 10 people, or have a 1 in 8,000 chance to save 10,000?"
      3.  **The Mugging:** Introduce the term "Pascal's Mugging." Ask: "If someone claimed they could save 10^100 lives but needed your lunch money to do it, would you pay?" Connect to Round 3.
      4.  **The Refusal:** Address students who refused to play the Fanatic round. Validate that rejecting EV maximization is a recognized philosophical position (Risk-Weighted Expected Utility).
      5.  **Distribution:** Hand out the Base Stipend cookies. If anyone won bonus points, distribute those. Emphasize that the Base Stipend ensures no one was actually harmed, mirroring the "modest downside" of the thought experiment.

  ## Candid Note on Limitations & Facilitator Duties
  **What This Cannot Reproduce:**
  *   **Real Astronomical Stakes:** 10,000 points feels big, but it isn't *infinite*. Students won't feel the true weight of "infinite utility."
  *   **Nonlinear Utility:** A cookie is worth less to a full student than a hungry one, but the game treats points as linear. You must verbally explain that in real ethics, saving a billion lives isn't just 1,000x better than saving a million; it might be qualitatively different.
  *   **Interpersonal Aggregation:** The game simulates this in Round 3, but students are playing for their own group's glory mostly. You must verbally bridge the gap to "impartial beneficence."

  **What You Must Supply Verbally:**
  *   **The "God's Eye" View:** Remind them that EV is a long-run statistic. "If you played this game a million times, the Fanatic strategy wins. You only played once."
  *   **The Stakes:** Remind them the downside is just a cookie. This lowers the barrier to admitting they *would* take the risk if the stakes were truly hypothetical.
  *   **The Jargon:** Hold back terms like "St. Petersburg Paradox," "Fanaticism," or "Risk-Weighted Expected Utility" until the last 5 minutes.

  ## Predictable Failure Modes
  1.  **Payoff Inflation:** In Round 3, a group will suggest "Infinite Points." You must cap this at a representable number (e.g., 1 Trillion) to keep the math resolvable, or explain that infinity breaks the game (which is itself a teaching moment).
  2.  **Early Luck:** If a group hits the Round 2 Jackpot (1 in 8,000), the class will conclude EV is obviously correct. *Contingency:* Have a backup explanation ready. "You proved the math works in the long run, but would you bet your life on that odds tomorrow?"
  3.  **The Refuser:** A student may say, "I won't choose the Fanatic option; it's irrational." *Contingency:* Do not correct them. Say, "Record that as a constraint on your utility function. We will discuss why your intuition disagrees with the math in the debrief."
  4.  **Boredom with Dice:** Rolling D20 three times is fast, but if they have to do it repeatedly, it drags. *Contingency:* Keep rounds strictly to one roll per group.

