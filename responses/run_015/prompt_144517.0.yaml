      *   *Decision:* Option B is much stronger for a chapter on *narrative-self theories*. If the premise is "self = center of narrative gravity," then treating the self *must* mean treating the narrative. To do otherwise contradicts the ontological premise. I will argue that narrative coherence is constitutive of the person, not just a tool. Therefore, restoring coherence is the primary ethical imperative, even above immediate distress reduction.

