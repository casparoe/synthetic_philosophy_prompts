  im drafting a chapter on narrative-self theories and im stuck on the clinical implications. if we actually take seriously that the self is just a center of narrative gravity — not a substance but a gravitational center of stories we tell — what are the most important implications for treating patients whose autobiographical coherence is shattered, like in severe dissociative conditions? should clinicians prioritize stitching the narrative back together even over reducing immediate distress, and does a broken continuity count as harm to the person or just damage to a cognitive tool? i want a committed answer, not a balanced survey: pick one line and defend it, and flag where it gets awkward for legal capacity judgements. no need to cite anyone, just work it out.
