answer: |-
  # Specification for an Adequate Account of Harm Aggregation

  **To:** Public Agency Decision-Making Body
  **From:** Policy Advisory Unit
  **Subject:** Criteria for Evaluating Theories of Harm Aggregation

  ## 1. Introduction
  The agency faces a structural ethical problem: how to weigh severe, concentrated suffering against diffuse, minor burdens when resources are limited. This specification outlines the desiderata any theoretical framework must meet to be considered adequate for public decision-making. These criteria balance logical consistency, moral intuition, and practical administrability.

  ## 2. Desiderata for Adequacy

  ### D1. Decidability and Action-Guidance
  *   **Requirement:** The theory must yield a determinate verdict (or a bounded range of permissible options) for any finite choice scenario presented to the agency, including cases involving risk and uncertainty.
  *   **Motivation:** Public agencies cannot suspend judgment. Indecision in the face of tradeoffs (e.g., budget allocation for safety regulations) results in the status quo, which is itself a choice with moral consequences.
  *   **Classification:** **Non-negotiable Adequacy Condition.** Without this, the theory is operationally useless for governance.

  ### D2. Formal Transitivity
  *   **Requirement:** If Option A is judged better than Option B, and Option B is better than Option C, the theory must judge Option A better than Option C. This must hold across "spectrum" cases where harms are incrementally adjusted.
  *   **Motivation:** In *iterated versions* of the central case, we can imagine a spectrum connecting "One Torture" to "Many Specks" via small steps of reduced severity and increased numbers. If the theory violates transitivity here, the agency becomes vulnerable to "money pumps" or policy cycling, where resources are wasted shifting between options without net improvement.
  *   **Classification:** **Non-negotiable Adequacy Condition.** Rational public choice requires consistency to maintain legitimacy and avoid waste.

  ### D3. Sensitivity to Numbers (Aggregation)
  *   **Requirement:** Holding severity constant, an increase in the number of persons harmed must increase the badness of the outcome. There must be some number $N$ of minor harms that outweighs a smaller number of identical minor harms.
  *   **Motivation:** In *concentrated versus dispersed* variants, if 1,000,000 people suffer eye irritation, this is intuitively worse than 1 person suffering it. A theory that ignores numbers cannot justify public health interventions, pollution controls, or infrastructure safety standards where diffuse risks are the primary concern.
  *   **Classification:** **Non-negotiable Adequacy Condition.** Denying this renders the agency incapable of managing large-scale public goods.

  ### D4. Sensitivity to Severity (Non-Linearity)
  *   **Requirement:** The badness of a harm must increase disproportionately with its severity. A unit of "excruciating pain" must count for more than a linear sum of units of "mild irritation."
  *   **Motivation:** This addresses the *central case*. Most moral intuitions suggest that months of trauma are not easily redeemed by preventing dust specks. This reflects a commitment to **distributive fairness** and the protection of the most vulnerable from catastrophic loss, even for the sake of aggregate comfort.
  *   **Classification:** **Defeasible Theoretical Virtue.** While strongly supported by deontological and prioritarian camps, strict utilitarianism rejects this in favor of linearity. However, for a public agency, some degree of severity weighting is usually required to maintain public trust.

  ### D5. Anti-Fanaticism (Minor Harms)
  *   **Requirement:** There must be no finite number of sufficiently minor harms that outweighs a sufficiently severe harm. Alternatively, the "exchange rate" between minor and severe harms must not approach infinity.
  *   **Motivation:** This prevents the "Repugnant Conclusion" of aggregation. If the theory allows *any* number of dust specks to justify torture, it violates the **Severity Priority** intuition. It ensures the theory does not demand implausible sacrifices from individuals for the sake of trivial aggregate gains.
  *   **Classification:** **Defeasible Theoretical Virtue.** This is the core commitment of "Lexical" or "Threshold" views. It conflicts with strict additive aggregation.

  ### D6. Ex Ante / Ex Post Coherence
  *   **Requirement:** The theory should minimize divergence between the evaluation of *expected* burden (ex ante) and *realized* burden (ex post) in *risky versions* of the case.
  *   **Motivation:** In risky variants (e.g., a 1/N chance of torture for everyone vs. certainty of specks), some theories judge the choice differently depending on whether we look at probabilities before the fact or outcomes after. Large divergences create instability in regulatory policy (e.g., setting safety standards based on statistical lives vs. actual deaths).
  *   **Classification:** **Defeasible Theoretical Virtue.** Achieving perfect coherence is mathematically difficult (see Harsanyi vs. Diamond debates), but a satisfactory theory should not exhibit extreme oscillation between these perspectives.

  ## 3. Theoretical Tensions and Conflicts

  A satisfactory theory must navigate the following explicit conflicts. It is likely that no theory can satisfy all desiderata perfectly; the agency must prioritize.

  ### Conflict A: Transitivity (D2) vs. Anti-Fanaticism (D5)
  *   **The Tension:** This is the "Spectrum Argument." If we accept that Torture is worse than Any Number of Specks (Anti-Fanaticism), but we also accept that a slightly less severe pain is worse than slightly more specks, we can construct a chain of reasoning from Torture to Specks. If each step is "better than," Transitivity demands Torture be better than Specks. To maintain Anti-Fanaticism, one must introduce a **Lexical Discontinuity** (a sharp threshold where value jumps). However, sharp thresholds often violate Transitivity in borderline cases or appear arbitrary, violating **Continuity** (a subset of D2).
  *   **Source:** The tension between the intuition that "numbers count" and the intuition that "some things are too important to count."

  ### Conflict B: Sensitivity to Numbers (D3) vs. Sensitivity to Severity (D4)
  *   **The Tension:** If severity is weighted non-linearly (D4), at what point does the number of minor harms become so large that they *must* outweigh the severe harm? If the weight for severity is too high, it violates Sensitivity to Numbers (D3) by effectively rendering minor harms non-aggregative. If the weight is linear, it violates Sensitivity to Severity.
  *   **Source:** The mathematical difficulty of integrating cardinal utility with ordinal priority.

  ### Conflict C: Ex Ante vs. Ex Post (D6) vs. Separability
  *   **The Tension:** In *risky versions*, respecting the **Ex Ante** perspective (fairness of risk distribution) often conflicts with the **Ex Post** perspective (minimizing actual suffering). For example, giving everyone a tiny risk of death might have better expected value (Ex Ante) but result in a certain death for one person (Ex Post), which feels unfair to the loser.
  *   **Source:** The conflict between utilitarian aggregation (sum of expectations) and egalitarian concern for individual fate.

  ## 4. The Exclusionary Requirement

  **Transitivity (D2) across Spectrum Cases** is the single requirement that excludes the largest class of otherwise plausible views.

  *   **Justification:** Many intuitively compelling theories (Lexical Prioritarianism, Rights-Based Thresholds, Discontinuous Value theories) are designed specifically to satisfy **Anti-Fanaticism (D5)** and **Sensitivity to Severity (D4)**. They posit that severe suffering *lexically* outweighs minor irritation. However, maintaining this lexical priority across a continuous spectrum of harms without violating Transitivity is mathematically precarious. To avoid the conclusion that "Torture < Million Specks," these views often have to accept intransitivity in borderline spectrum cases or arbitrary thresholds.
  *   **Implication:** By insisting on strict Transitivity as a non-negotiable condition for agency rationality, we effectively rule out most "Protect the Victim" theories that rely on lexical discontinuities. This forces the agency toward continuous, aggregative models, even if they feel counter-intuitive in the central case.

  ## 5. Illustrative Evaluation of Theoretical Families

  To conclude, here is how three broad families of views fare against this specification:

  | Theoretical Family | Performance on Specification | Key Failure Point |
  | :--- | :--- | :--- |
  | **1. Straightforward Additive Aggregation**<br>(e.g., Classical Utilitarianism, Cost-Benefit Analysis) | **High.** Satisfies Transitivity, Decidability, and Sensitivity to Numbers perfectly. Handles Risk coherently via Expected Utility. | **Fails Anti-Fanaticism (D5).** Implies that a sufficient number of dust specks *does* outweigh months of torture. This violates the **Sensitivity to Severity** intuition and risks public outrage in the central case. |
  | **2. Lexical / Threshold Priority**<br>(e.g., Rights-Based, Prioritarianism with Lexical Thresholds) | **Mixed.** Satisfies Anti-Fanaticism and Sensitivity to Severity. Protects the torture victim in the central case. | **Fails Transitivity (D2).** In *iterated/spectrum versions*, these views struggle to define where the threshold lies without arbitrariness, often leading to intransitive rankings (A>B, B>C, but C>A) or discontinuities that hinder practical calculation. |
  | **3. Discounting / Non-Aggregative**<br>(e.g., Sufficientarianism, "Small Harms don't count") | **Low.** Satisfies Anti-Fanaticism. | **Fails Sensitivity to Numbers (D3).** If minor harms are discounted to zero or treated as non-aggregative, the theory cannot justify preventing large-scale diffuse burdens (e.g., climate change, low-level pollution). It renders the agency impotent against "death by a thousand cuts." |

  **Recommendation:** The agency should adopt a **Weighted Aggregation** model (a modification of Family 1) that incorporates a high severity coefficient to approximate **Sensitivity to Severity (D4)** without violating **Transitivity (D2)**. While this cannot fully satisfy **Anti-Fanaticism (D5)** (as it remains theoretically possible for enough specks to outweigh torture), it sets the "exchange rate" so high that it is practically unreachable, balancing rational consistency with moral protection.
