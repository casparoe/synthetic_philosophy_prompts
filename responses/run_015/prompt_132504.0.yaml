answer: |-
  The principle you are looking for is the **Independent Epistemic Access Principle** (a modern refinement of Frege's "modes of presentation").

  Here is the rule: **An "a is b" statement is informative if and only if concept 'a' and concept 'b' provide independent cognitive paths to the same referent, requiring a merger of two distinct mental files.**

  If the two terms access the object through the *same* path, or if one path is logically/functionally dependent on the other (like a role waiting to be filled), the statement feels like a tautology.

  ### Testing the Principle Against Your Cases

  **1. The Avatar Case (Shadow is Raven)**
  *   **Verdict:** Informative.
  *   **Why:** You have two distinct mental files. File A contains data about "Shadow" (game stats, chat logs, appearance). File B contains data about "Raven." These files were populated via independent epistemic tracks (two different screens/accounts). Discovering they map to one human forces a **file merger**. You aren't just stuttering; you are collapsing two distinct interfaces into one causal source. This fits perfectly with *Clark Kent is Superman*.

  **2. Cicero is Tully**
  *   **Verdict:** Context-dependent (explains your "back and forth").
  *   **Why:** If you studied Roman history in two different classes and never connected them, you have two files. Merging them is news. If you studied them together, the files were merged at creation. The statement is only informative if your *brain* hasn't already done the merge. This confirms the principle relies on the listener's cognitive state, not just the words.

  **3. The 2024 Election Winner is Joe Biden**
  *   **Verdict:** Uninformative (in your context).
  *   **Why:** "The 2024 Election Winner" is a **functional role**. It is an empty slot defined entirely by the outcome of the election. Once the election resolves, the slot is filled. Saying "The Winner is Biden" is just reading the tag on the filled slot. The access path for "Winner" is *dependent* on the access path for "Biden" (he is the winner *because* he is Biden). There are not two independent tracks; there is a container and the content.

  ### Resolving the Tension: Mount Everest vs. Hesperus

  This is the crux of your problem. Both link a description ("Tallest Mountain"/"Evening Star") to a name ("Everest"/"Hesperus"). Why does one feel like discovery and the other like definition?

  **My Verdict:** You need to drop your intuition about **Mount Everest**.

  Structurally, "The tallest mountain is Mount Everest" belongs with *Hesperus*, not with *The Election Winner*.
  *   **Hesperus/Phosphorus:** Track 1 (Evening observation) + Track 2 (Morning observation) -> Discovery that they are one planet.
  *   **Everest/Tallest:** Track 1 (Geological measurement of height) + Track 2 (Cartographic naming of peaks) -> Discovery that the highest peak is named Everest.

  **Why it feels different:**
  It feels like "unpacking meaning" only because of **knowledge saturation**. You learned "Everest = Tallest" as a single fact packet in school. Your mental files were merged before you ever questioned them. But philosophically and empirically, it *is* news. It is a contingent fact of geography, not a definition. K2 could have been taller. If we discovered tomorrow that Mauna Kea is actually taller from base to peak, the statement "The tallest mountain is Everest" would become false. Therefore, it was never a tautology; it was just old news.

  *Hesperus* retains its "news" feel because it is taught as a *story of discovery* (the Babylonians/Greeks realizing the stars were the same), whereas *Everest* is taught as a *label*.

  **Correction:** If you meet someone who knows "Everest" as "that big peak in Nepal" but doesn't know its ranking, telling them "The tallest mountain is Everest" **is** informative. Your intuition that it is empty is a side-effect of your own expertise, not the logic of the statement.

  ### Prediction: The Prompt Author Case

  **Statement:** *'The author of this specific prompt is the author of this specific prompt.'*

  **Verdict:** **Always a Tautology (Uninformative).**

  **Why:**
  For the Independent Epistemic Access Principle to work, you need two *distinct* concepts or files. Here, the description is token-identical on both sides of the "is."
  *   Left side access: "The person who wrote this."
  *   Right side access: "The person who wrote this."

  There is no second file to merge. There is no independent track. You are pointing at the same mental file with the same finger.

  **Is there *any* context where it's informative?**
  Only if you force a shift in the *sense* of the word "author" mid-sentence, which the grammar doesn't support.
  *   *Example of forced shift:* "The [legal copyright holder] of this prompt is the [physical typist] of this prompt." (Informative if a ghostwriter was involved).
  *   *Your specific phrase:* Since the phrase repeats exactly, it asserts $x = x$. Even if you were dissociated or suspected a bot wrote it, this sentence doesn't bridge the gap between "Bot" and "Human." It just says "Writer = Writer." To be informative, it would need to be: *"The author of this prompt is [My Name]."*

  ### Summary of the Principle

  To decide if "a is b" is news or stuttering, ask: **"Did I have to investigate two different things to find out they were the same?"**

