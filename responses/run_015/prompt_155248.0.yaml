      *   *Key Insight:* The prompt asks about the *exam-ritual complex*. This is external discipline. That is Xunzian. But the *justification* is restoring moral order (Mencian).
      *   *Refined Thesis:* The institution is Xunzian in *mechanism* (external correction) but Mencian in *teleology* (restoring innate moral potential/order). However, strictly speaking, the *coercive standardization* is anti-Mencius.

