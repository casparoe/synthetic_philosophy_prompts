      *   *Dong Zhongshu's Synthesis:* Dong isn't purely Mencian or Xunzian. He introduces cosmic resonance ($Tianren Ganying$). But structurally, his push for state education is Xunzian (external transformation), while his rhetoric about the Emperor's moral duty is Mencian.

