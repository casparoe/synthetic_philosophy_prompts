answer: |-
  This is a sophisticated question that cuts to the core of how political philosophy meets institutional reality. However, to give you a disciplined answer, we first need to correct two historical premises that are tripping up your debate. If you don't fix these, your philosophical mapping will be built on anachronisms.

  **Historical Corrections:**
  1.  **There were no "Civil Service Exams" in 136 BCE.** The *Keju* (open competitive examination) is a Sui/Tang dynasty invention (6th–7th century CE). In 136 BCE, Emperor Wu established the **Five Classics Erudites** (*Wu Jing Boshi*) and later the Imperial Academy (*Taixue*). Selection was via **recommendation** (*Chaju*), not open testing. The "filter" was not a standardized test for the masses, but a state monopoly on elite education and certification.
  2.  **Mencius was not "canonized" in 136 BCE.** The *Mencius* was not elevated to a "Classic" (part of the Four Books) until the Song Dynasty (12th century CE). In the Han, Xunzi was arguably *more* influential in the actual transmission of the Classics. The "Mencian orthodoxy" is a later retrospective branding.

  **The Real Question:**
  Given those corrections, the core tension remains: **Does a state-sponsored system of standardized moral education imply human nature needs external straightening (Xunzi), or does it imply the state is merely nurturing innate goodness (Mencius)?** And why did the empire eventually adopt Mencian *rhetoric* while using Xunzian *mechanisms*?

  Here is the disciplined mapping of that institutional moment.

  ---

  ### 1. The Decision Matrix: What Wu and Dong Zhongshu Actually Faced
  In 136 BCE, the Han court was solving a specific post-Qin problem: **How to stabilize an empire without looking like the Qin.**
  *   **The Qin Model:** Pure Legalism. Humans are selfish; control them with harsh law and punishment. (Result: Collapsed in 15 years).
  *   **The Han Dilemma:** They needed the Qin's centralized bureaucracy but needed to hide its coercive nature to gain legitimacy.
  *   **The Solution (Dong Zhongshu):** Create a state monopoly on moral interpretation. By making the *Classics* the prerequisite for office, the state claims it is selecting for *virtue*, not just competence.

  **The Institutional Reality:** The state defines what "virtue" looks like (the Classics), trains officials in it (Taixue), and certifies them (Erudites). This is an **external standardization of morality.**

  ### 2. Mencian Prediction: The "Sprout" Problem
  **Theory:** Human nature ($Xing$) contains innate sprouts of benevolence ($Ren$) and righteousness ($Yi$). The state's role is negative: remove obstacles (poverty, bad rulers) so sprouts grow.
  **Prediction for State Design:**
  *   **Education:** Should be local, familial, and self-directed. A centralized curriculum is suspicious because it implies the state knows morality better than the individual's heart.
  *   **Selection:** Officials should be chosen for their evident benevolence in local contexts, not their ability to memorize state-approved texts.
  *   **Verdict on 136 BCE:** **Incompatible.**
      *   If sprouts are innate, why do you need a state academy to teach them?
      *   If virtue is internal, why test knowledge of external texts (*Shi, Shu, Li*)?
      *   Mencius warns against "pulling the sprouts" to help them grow (forced cultivation). The Erudite system is *exactly* pulling the sprouts.

  **Where Mencius fits:** Only in the **marketing.** Emperor Wu used Mencian language ("Benevolent Rule") to justify his reign. The *goal* was framed as protecting the people, but the *method* violated Mencian epistemology.

  ### 3. Xunzian Prediction: The "Straightening" Reality
  **Theory:** Human nature is selfish and disorderly. Virtue is not innate; it is **artificial** (wei), created through Ritual ($Li$) and the guidance of Teachers/Sages.
  **Prediction for State Design:**
  *   **Education:** Must be centralized and standardized. The "Sage Kings" of the past understood the Dao; their words (Classics) are the objective standard to straighten the crooked wood of human nature.
  *   **Selection:** Officials must be those who have successfully undergone this transformation. Mastery of Ritual/Text proves they have curbed their nature.
  *   **Verdict on 136 BCE:** **Highly Compatible.**
      *   The Erudite system assumes candidates do *not* naturally know how to rule; they must be molded.
      *   The emphasis on *Li* (Ritual) and textual mastery is pure Xunzi.
      *   The state acting as the "Great Teacher" that transforms the elite is a Xunzian political technology.

  ### 4. Resolving the Paradox: Why the "Mencian Mask"?
  You asked: *If the system is Xunzian, why was Mencius eventually canonized and Xunzi sidelined?*

  This is the crux of imperial legitimation.
  *   **Xunzi is too honest.** He admits morality is a construct imposed by the state to control selfishness. If an Emperor admits this, he admits he is coercing people. This smells too much like the Qin (Legalism).
  *   **Mencius is comforting.** He says the Emperor and the Peasant share the same moral nature. The Emperor rules because he nurtures that nature. This provides a **myth of consent.**

  **The Synthesis:**
  The Han institutional moment is **Xunzian bone with Mencian skin.**
  *   **Institutionally (Bone):** It assumes people need correction, standardization, and external authority (Xunzi).
  *   **Ideologically (Skin):** It claims this is done to nurture the people's innate welfare and moral potential (Mencius).

  Emperor Wu didn't choose Mencius *over* Xunzi in 136 BCE; he chose a system that **functioned** on Xunzian assumptions but required Mencian **rhetoric** to avoid the Qin's fate. Xunzi was "sidelined" in later orthodoxy (Song Dynasty) precisely because his honesty about human badness made the Emperor's coercion too visible. Mencius allowed the coercion to be disguised as "nurturing."

  ### 5. The Silences: Where Both Theories Fail
  To be disciplined, we must acknowledge where neither philosopher predicts the outcome of the 136 BCE decision.

  **1. Bureaucratic Self-Perpetuation**
  *   **Silence:** Neither Mencius nor Xunzi anticipates that the "scholar-official" class will become a self-interested aristocracy.
  *   **Reality:** The Erudite system created a class of families who monopolized the Classics to keep power within their lineage. Neither philosopher accounts for education becoming a tool of class exclusion rather than moral transformation.

  **2. Textual Fetishism vs. Moral Action**
  *   **Silence:** Both assume mastery of the Way leads to right action.
  *   **Reality:** The system incentivized **memorization and exegesis** over actual governance or virtue. You could be a "filial" expert on the *Classic of Filial Piety* while being a corrupt official. Xunzi warns against empty ritual, but the institutionalization of his method inevitably led to the empty ritual he feared.

  **3. The Role of the Emperor**
  *   **Silence:** Both assume the Emperor is the moral pivot (either the nurturer or the chief ritualist).
  *   **Reality:** The system created a check on the Emperor (officials could cite Classics to rebuke him), but also empowered him as the sole patron of truth. Neither theory fully maps the tension of a bureaucracy that serves the Emperor but claims authority from a Tradition (Classics) older than the Emperor.

  ### Conclusion for Your Argument
  Tell your roommate this:

  The 136 BCE establishment of the Five Classics Erudites is **structurally Xunzian** because it treats virtue as a standardized curriculum that must be externally imposed on the elite. It assumes human nature does not spontaneously produce competent, loyal officials; they must be manufactured through ritual and text.

  However, the **ideological branding** had to be **Mencian** because an empire cannot survive on the admission that it is straightening "crooked wood" (coercion); it must claim it is "watering sprouts" (benevolence).

  The tragedy of the Han system is that it used Xunzi's **methods** to build a bureaucracy that eventually became too rigid to nurture anyone's sprouts, while using Mencius's **name** to pretend it was. Xunzi wasn't sidelined because he was wrong about the system; he was sidelined because he was too right about the coercion involved.
