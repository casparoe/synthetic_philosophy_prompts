      *   Needs to be step-by-step.
      *   *Step 1: Historical Etiology.* (Evolution or Design?)
      *   *Step 2: Consumer Mechanism.* (Is there a downstream user?)
      *   *Step 3: Normative Failure.* (Can it misfire?)
      *   *Step 4: Normal Conditions.* (Context of operation).
      *   *Step 5: Content Determination.* (What exactly is represented?)
