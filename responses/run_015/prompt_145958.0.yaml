  *(Refining the Redundancy Point)*: The prompt asks to flag where synthetic functional redundancy breaks the evolutionary paradigm. I need to be clear: Evolution selects *types* via token survival. Engineering specifies *types* via blueprint. If redundancy means any token can be swapped without fitness/design loss, the specific normative link between *this* token's state and the world is weakened. I will add a specific 'Redundancy Check' node.

