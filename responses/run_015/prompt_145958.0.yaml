          *   *Misrepresentation:* Can the system be wrong? If it says "predator" when there is none, does it trigger the escape mechanism anyway? If yes, it's a candidate for misrepresentation. If the system *only* fires when a predator is present (perfect covariance), it's hard to distinguish from a mere reflex/indicator.
      *   *Synthetic Redundancy:* This is the hard case. Teleosemantics relies on selection history. Engineered systems have *design* history, but if they are redundant (triple modular redundancy), does the specific module have a unique proper function? If Module A, B, and C all do the same thing, and A breaks, B takes over. Does A represent? Yes, if it was designed to. But if the redundancy is *functional* without specific selection for *that* token's content, we risk losing the normativity. The "selection" is the engineer's intent, not natural selection. We must treat design history as analogous to selection history but flag the disanalogy regarding "normal conditions" (which become "design specifications").
      *   *Avoiding Behaviourism:* Must ensure we aren't just looking at input-output. We need the internal normative standard (the function).
      *   *Avoiding Intentional Stance:* Must ensure we aren't just saying "it's useful to treat it as representing." We need ontological grounding in history/function.

