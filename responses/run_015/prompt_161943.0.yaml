answer: |-
  **The Scenario**

  Elias, a veteran snooker player with thirty years of high-level competition, pots balls effortlessly using a kinesthetic 'feel' for the cue ball's path, consistently achieving a 70% success rate on difficult shots. Recently, he mastered the explicit physics of spin vector addition and cushion rebound geometry, passing rigorous written and diagrammatic tests confirming his genuine grasp of the principles independent of his playing. In a controlled session, devoid of audience pressure, time limits, or distraction, he deliberately switches to aiming using these explicit geometric lines rather than his habitual feel. His potting success rate drops to 40%. Post-session analysis confirms his geometric calculations were accurate—the lines he aimed along were theoretically correct for a standard table—yet the balls missed where his old feel would have landed them. The drop isn't due to nervousness, confusion, or a false model, but because the new geometry-based controller lacks the fine-grained calibration to specific cloth friction and cue deflection that his opaque, habituated feel had accumulated over three decades.

  ***

  **The Walkthrough**

  **The Two Accounts**
  The **Comprehension-First** account insists that genuine understanding is the engine of competence; therefore, if performance degrades, the understanding must have been inert, incomplete, or improperly applied. Since we have ruled out distraction and false models, this account is forced to argue that Elias's physics knowledge wasn't *really* comprehension in the relevant sense—it was merely abstract theory lacking 'practical grip'. It must maintain that true comprehension cannot underperform ignorance unless something extrinsic interferes.

  The **Competence-First** account treats comprehension as a newly acquired competence layered on top of older, blind competences. It predicts exactly this outcome: the new 'comprehension controller' is veridical (the physics are true) but uncalibrated (the skill of using it is green). The old system is a black box tuned by thirty years of trial-and-error retention; the new system is a white box tuned by zero years of motor application. The drop in performance is not a failure of truth, but a fact about the learning curve of the new controller.

  **The Key Feature**
  The single feature doing the work is the **calibration gap between truth and control**. The physics are true (veridical), but the motor interface using them is novice. If you remove this gap—say, by letting Elias practise the geometry-based aiming for another five years—the Competence-First account predicts performance will recover and potentially surpass the old habit (as the new controller gains calibration). If you allow the old habit to remain available as a fallback, the Comprehension-First account might argue Elias wasn't *committed* to the new way, but the Competence-First account simply notes that competences stack; the existence of a better older tool doesn't negate the novice status of the new one.

  **The Strongest Objection**
  The Comprehension-First proponent's best wriggle is a Rylean move: 'Know-how is constitutive of understanding.' They will argue that if Elias cannot *use* the physics to pot the ball, he does not *understand* the physics in a way that matters for agency. On this view, comprehension isn't a separate state that *causes* performance; it is partly *defined* by successful performance.

  **Should You Buy It?**
  You should not buy it, because it begs the question. It defines comprehension in a way that makes the Competence-First thesis impossible to test. By stipulating independent verification (the written tests), we have shown Elias possesses the informational state (the model) without the behavioural success. The objection merely renames 'comprehension' to 'comprehension-plus-success', which obscures the mechanism rather than explaining it.

  **Honest Assessment: Strange Inversion or Just Practice?**
  Your friend has a point, but they are missing the philosophical bite. Superficially, this looks like trivial 'skills take practice'. However, the Strange Inversion claim is stronger: it denies that comprehension is the *source* of competence at all. If this case holds, it shows that competence can exist in the absence of comprehension (the old habit) and that comprehension is merely another form of competence subject to the same evolutionary constraints (trial, error, retention, calibration). It naturalises understanding. It's not just that new skills need practice; it's that the 'light of understanding' offers no magical immunity to error. The blind habit can outperform the seeing eye because the habit is older and better tuned. That is the inversion: competence does not wait for comprehension, and comprehension does not guarantee competence. So, yes, it shows something about the Strange Inversion, provided you stress that the *ignorant* system is genuinely outperforming the *knowing* system, not just that the knowing system is currently clumsy. The inversion is that truth without calibration loses to blindness with calibration.
