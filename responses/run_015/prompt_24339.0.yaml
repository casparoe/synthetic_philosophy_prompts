answer: |-
  1. **Statement and Proof of the Aggregation Result**

  **Answer:** The result states that there exist non-negative constants $a_1, \dots, a_n$ and a constant $b$ such that for any lottery $p$, the social utility function satisfies $U_0(p) = \sum_{i=1}^n a_i U_i(p) + b$. The proof relies critically on the linearity of the utility functions in probabilities (the Independence axiom). If preferences satisfied only weak-order axioms (Completeness and Transitivity) without Independence, the utility representations would not be linear in probabilities, and the social indifference surfaces in the space of individual utilities would not be hyperplanes, preventing the derivation of a global linear aggregation formula.

  **Justification:**
  Let $\Delta$ be the simplex of probability distributions over the finite set of social states $X$. By the von Neumann–Morgenstern representation theorem, for each individual $i$ and the social observer $0$, there exist utility functions $U_i: \Delta \to \mathbb{R}$ representing their preferences, unique up to a positive affine transformation. Crucially, these functions are linear in probabilities: for any lotteries $p, q \in \Delta$ and $\lambda \in [0,1]$, $U_i(\lambda p + (1-\lambda)q) = \lambda U_i(p) + (1-\lambda)U_i(q)$.

  Define the mapping $\Phi: \Delta \to \mathbb{R}^n$ by $\Phi(p) = (U_1(p), \dots, U_n(p))$. Let $Y = \Phi(\Delta) \subset \mathbb{R}^n$ be the image of the simplex. Since $\Phi$ is a linear map and $\Delta$ is convex, $Y$ is a convex set.
  The Pareto condition implies that for any $y, y' \in Y$, if $y_i \ge y'_i$ for all $i$ and $y_j > y'_j$ for some $j$, then the social preference ranks the lottery corresponding to $y$ at least as good as the lottery corresponding to $y'$. Since $U_0$ represents social preference, this implies $U_0(p) \ge U_0(p')$ whenever $\Phi(p) \ge \Phi(p')$ (with one strict inequality).

  Because $U_0$ is linear on $\Delta$, it induces a function $F: Y \to \mathbb{R}$ such that $U_0(p) = F(\Phi(p))$. Since $U_0$ and $\Phi$ are linear, the level sets of $U_0$ in $\Delta$ are hyperplanes. The linearity of $\Phi$ ensures that the level sets of $F$ in $Y$ are intersections of hyperplanes with $Y$. Thus, $F$ must be an affine function on $Y$. By standard linear algebra extension theorems, there exist constants $a_1, \dots, a_n$ and $b$ such that for all $y \in Y$, $F(y) = \sum_{i=1}^n a_i y_i + b$. Substituting back, $U_0(p) = \sum_{i=1}^n a_i U_i(p) + b$. The Pareto condition ensures $a_i \ge 0$.

  **Failure without Linearity:** If preferences satisfied only weak-order axioms, we could not guarantee the existence of utility functions linear in probabilities. Even if ordinal utility functions existed, the indifference curves in $\Delta$ would not necessarily be hyperplanes. Consequently, the mapping $\Phi$ would not preserve the convex structure required to force $F$ to be affine. The relationship between $U_0$ and the vector $(U_1, \dots, U_n)$ could be non-linear (e.g., concave or convex), and the weighted sum result would not hold.

  2. **Interpersonal Comparability**

  **Answer:** The proof assumes Cardinal Unit Comparability. It compares the magnitude of utility increments across individuals, requiring that the units of measurement for each individual's utility are fixed relative to the social utility unit. This assumption requires that utility differences are comparable across persons, but it does not strictly require a common zero point (full comparability) unless the constant $b$ is constrained to zero. It does require that individuals' utilities be measured on scales that are commensurable, meaning a unit change for one individual has a fixed ratio to a unit change for another in terms of social value.

  **Justification:**
  The aggregation equation $U_0 = \sum a_i U_i + b$ sums quantities $U_i$ belonging to different individuals. For this sum to be mathematically and normatively meaningful, the units of $U_i$ must be compatible. Individual utility functions are unique only up to a positive affine transformation: $U_i^* = \alpha_i U_i + \beta_i$ with $\alpha_i > 0$. If we substitute $U_i^*$ into the sum, the weights must change to $a_i^* = a_i / \alpha_i$ and the constant $b$ must adjust to absorb the $\beta_i$ terms to maintain the same social preference ordering.
  To claim the weights $a_i$ are "fixed," we must fix the scales of the $U_i$ functions. This implies we cannot arbitrarily rescale individual utilities without altering the ethical weights. This requirement is precisely Cardinal Unit Comparability: the ratio of utility differences between any two individuals is meaningful and fixed.
  *   **Common Cardinal Scale:** It requires commensurability (a fixed exchange rate between utility units), but not necessarily that the scales are identical (e.g., both 0 to 1), as the weights $a_i$ can absorb scale differences.
  *   **Comparability of Differences:** Yes. Cardinal utility is defined by the meaningfulness of differences ($U(x) - U(y)$). Since the aggregation is linear, it operates on these differences. If differences were not comparable, the trade-off rate $a_i/a_j$ would be undefined.

  3. **Identifiability**

  **Answer:** The weights are not identified separately from the utility representations because individual utility functions are unique only up to positive affine transformations. A rescaling of an individual's utility function can be exactly offset by an inverse rescaling of their weight, yielding the identical social utility function and social preference relation. This non-identifiability implies that the result does not "derive" a particular weighting scheme normatively; it only establishes a mathematical relationship conditional on an arbitrary choice of utility scales.

  **Justification:**
  Consider two individuals ($i=1, 2$) and two states ($x, y$). Let the set of lotteries include the degenerate lotteries on $x$ and $y$.
  *   **Representation 1:**
      *   Individual 1: $u_1(x) = 0, u_1(y) = 1$.
      *   Individual 2: $u_2(x) = 0, u_2(y) = 1$.
      *   Social Observer: $u_0(x) = 0, u_0(y) = 2$.
      *   Aggregation: $u_0 = 1 \cdot u_1 + 1 \cdot u_2$. Here, weights are $(a_1, a_2) = (1, 1)$.
  *   **Representation 2:**
      *   Individual 1: $v_1(x) = 0, v_1(y) = 2$ (Rescaled by factor 2).
      *   Individual 2: $v_2(x) = 0, v_2(y) = 1$ (Unchanged).
      *   Social Observer: $v_0(x) = 0, v_0(y) = 2$ (Same social preference).
      *   Aggregation: To satisfy $v_0 = a'_1 v_1 + a'_2 v_2$, we require $2 = a'_1(2) + a'_2(1)$. Setting $a'_2 = 1$, we get $a'_1 = 0.5$. Here, weights are $(a'_1, a'_2) = (0.5, 1)$.

  In both cases, the underlying preference relations ($\succeq_1, \succeq_2, \succeq_0$) are identical because $v_1$ is a positive affine transformation of $u_1$. However, the weight assigned to individual 1 changes from 1 to 0.5 solely due to the choice of numerical representation. Therefore, the theorem cannot determine the "true" weights without an independent method for fixing the utility scales.

  4. **The Equal-Weights Question**

  **Answer:** The standard argument for equal weights posits that an observer behind a "veil of ignorance," not knowing which individual they will be, maximizes expected utility by assigning equal probability ($1/n$) to each identity, implying $a_i = 1/n$. Two substantive objections are: (1) The argument assumes the observer's preferences over *identities* satisfy the expected-utility axioms, which is not guaranteed by the initial setup of preferences over *social states*; and (2) An egalitarian objection holds that maximizing the sum (utilitarianism) ignores distributional concerns, such as the welfare of the worst-off, which equal weights do not prioritize.

  **Justification:**
  *   **The Argument:** If the observer chooses a social state $x$ behind a veil where they become individual $i$ with probability $\pi_i$, their expected utility is $\sum \pi_i u_i(x)$. If they are impartial, they set $\pi_i = 1/n$. This matches the aggregation form with $a_i = 1/n$.
  *   **Objection 1 (EU Axiom on Identity):** The setup assumes the observer satisfies von Neumann–Morgenstern axioms over lotteries of social states. The veil argument applies these axioms to a lottery over *personal identities*. This requires an additional assumption that uncertainty about "who one is" behaves mathematically like risk over states. There is no logical necessity that an observer who is an expected-utility maximizer over states must also be one over identities; this conflates two distinct domains of uncertainty.
  *   **Objection 2 (Egalitarian/Prior):** Equal weights yield classical utilitarianism (maximization of the sum). A substantive egalitarian might argue that social welfare should depend on the minimum utility (Maximin) or that weights should favor those with lower capacity for welfare to equalize outcomes. Equal weights treat a unit of utility for a well-off person the same as for a badly-off person, potentially justifying large inequalities if the total sum increases. Furthermore, the choice of $1/n$ as the prior probability is arbitrary; one might argue for priors based on population subgroups or other moral considerations not captured by simple identity counting.

  5. **Residue Report**

  **Answer:**
  (a) **Compatible:** None. **Contradicts:** The linearity of the social utility function. **Untouched:** The individual vNM axioms.
  (b) **Compatible:** None. **Contradicts:** The state-independence of the weights. **Untouched:** The individual vNM axioms.
  (c) **Compatible:** The mathematical derivation (linear algebra). **Contradicts:** The normative interpretation of the weights. **Untouched:** The individual preference orderings.

  **Justification:**
  *   **(a) Non-weighted sum (e.g., inequality averse):** The aggregation result proves $U_0$ *must* be a linear sum if the observer satisfies vNM axioms and Pareto. A theory assigning direct weight to inequality (e.g., $U_0 = \sum u_i - \lambda \text{Var}(u)$) is non-linear in the individual utilities. This contradicts the conclusion of the result. For such a theory to hold, the social observer must violate the Independence axiom of the vNM framework (since inequality aversion over distributions of utility typically violates linearity in probabilities).
  *   **(b) State-dependent weights:** The result concludes weights $a_i$ are fixed across states. A theory where weights depend on the state (e.g., giving more weight to the poor in state $x$ than in state $y$) contradicts the "state-independent" conclusion. This implies that either the Pareto condition is applied differently across states or the observer's preferences violate the Independence axiom (as state-dependent weighting often implies non-linearities in the probability space).
  *   **(c) No interpersonal comparability:** The mathematical equation $U_0 = \sum a_i U_i + b$ remains valid as a relation between real-valued functions. Thus, it is compatible with the mathematical derivation. However, without interpersonal comparability, the scales of $U_i$ are arbitrary relative to each other. Consequently, the weights $a_i$ are arbitrary, and the sum has no normative meaning. This contradicts the normative claim that the result provides a meaningful social welfare function, though it leaves the underlying individual ordinal preferences untouched.
