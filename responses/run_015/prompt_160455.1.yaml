answer: |-
  **1. The hinges**

  1.  **Agglomeration:** If an agent ought to A and ought to B, does it follow they ought to (A and B)? (Yes/No). *Place:* Determines if conflicting obligations generate a logical contradiction or merely competing reasons.
  2.  **'Ought' implies 'Can':** If an agent cannot do both A and B, does it follow they are not required to do both? (Yes/No). *Place:* Decides whether impossibility cancels obligation or merely guarantees wrongdoing.
  3.  **Comparability:** When values clash, are they finely balanced (a tie) or genuinely incomparable (no common measure)? (Tie/Incomparable/Comparable). *Place:* Distinguishes indecision from structural incommensurability.
  4.  **Epistemic Status:** Would full information resolve the conflict, or does it survive perfect knowledge? (Epistemic/Ontic). *Place:* Separates confusion from genuine moral tragedy.
  5.  **Residue as Evidence:** Is post-action remorse evidence of an unfulfilled requirement or merely a fitting response to loss? (Evidence/Fitting Response). *Place:* Tests whether the 'ought' persisted past the action.
  6.  **Role-Specificity:** Do professional roles generate obligations that operate under different logical rules than general morality? (Yes/No). *Place:* Isolates whether institutional context changes the structure of the dilemma.

  **2. The logical space**

  The tree begins with the Epistemic Status hinge. If the conflict is epistemic, the branch leads immediately to "Apparent Conflict Only." If ontic, the tree splits on Agglomeration. If Agglomeration holds, 'Ought' implies 'Can' forces a denial of conflicting obligations (Consistent System). If Agglomeration fails, the tree splits on Residue. If residue is mere loss, the position is "Incomparability without Dilemma." If residue is evidence of unfulfilled oughts, the position is "Tragic Dilemma." A parallel branch tracks Role-Specificity, allowing a position where general morality forbids dilemmas but role-morality permits them.

  Theoretically, six binary hinges create 64 cells. In practice, fewer than ten are occupied. Most students cluster in "Apparent Conflict" (utilitarian-style weighing) or "Tragic Dilemma" (deontological collision). The "Incomparability" cell is sparsely populated. The "Role-Specific" cell is often inhabited intuitively but rarely articulated consistently. The tree reveals that most disagreement stems from the first two hinges; the later hinges merely refine the emotional and accountability consequences of that initial logical commitment.

  **3. The instrument**

  **1. Forced Choice.** A switch diverts a train from five people to one. You must choose.
  A. One option is strictly right; the other is wrong. (Load-bearing)
  B. Both options are wrong, but one is less wrong. (Load-bearing)
  C. Both options are permissible. (Load-bearing)
  *Hinge: Comparability.*

  **2. Promise vs. Harm.** You promised to meet a friend. On the way, you see a minor accident requiring your help. Helping breaks the promise.
  A. You should help; the promise is voided by the situation. (Confirmatory)
  B. You should keep the promise; the harm is not your responsibility. (Confirmatory)
  C. You are required to do both, so you will fail a requirement either way. (Load-bearing)
  *Hinge: Agglomeration.*

  **3. Partiality.** Your child is drowning. You can save them or five strangers.
  A. You must save the strangers; numbers decide. (Confirmatory)
  B. You may save your child; partiality permits what duty forbids. (Load-bearing)
  C. You ought to save the strangers, but saving your child is excusable. (Load-bearing)
  *Hinge: Role-Specificity (Parental).*

  **4. Role Triage.** You are a doctor. One ventilator remains. Patient A is younger; Patient B has been waiting longer.
  A. There is a correct medical criterion that solves this. (Confirmatory)
  B. Either choice is medically permissible, but morally painful. (Load-bearing)
  C. Whichever you choose, you have violated a duty to the other. (Load-bearing)
  *Hinge: Role-Specificity (Professional).*

  **5. Loyalty.** You are a journalist. Your source gave info under confidentiality. Publishing saves lives but betrays the source.
  A. Public safety overrides confidentiality absolutely. (Confirmatory)
  B. Confidentiality overrides public safety absolutely. (Confirmatory)
  C. You betray a trust either way; there is no clean override. (Load-bearing)
  *Hinge: 'Ought' implies 'Can'.*

  **6. Dirty Hands.** You are an official. Authorizing torture prevents a bomb. You believe torture is impermissible.
  A. You should do it; the imperative to save lives overrides the prohibition. (Confirmatory)
  B. You must not do it; some acts are forbidden regardless of后果. (Confirmatory)
  C. You must do it to serve the public, but you are morally stained for doing it. (Load-bearing)
  *Hinge: Residue as Evidence.*

  **7. Uncertainty.** You must choose between two bridges. One is safe, one collapsed. You don't know which.
  A. You are responsible for the outcome regardless of knowledge. (Confirmatory)
  B. You are only responsible for your decision procedure, not the outcome. (Load-bearing)
  C. The conflict exists only because you lack information. (Load-bearing)
  *Hinge: Epistemic Status.*

  **8. Residue (Remorse).** You chose to save the five over the one (Item 1). You feel deep remorse for the one who died.
  A. This remorse is irrational; you did the right thing. (Load-bearing)
  B. This remorse is rational; you did something wrong. (Load-bearing)
  C. This remorse is fitting; you inflicted a loss, even if justified. (Confirmatory)
  *Hinge: Residue as Evidence.*

  **9. Residue (Apology).** You chose to save your child over the strangers (Item 3). The strangers' families demand an apology.
  A. You owe them an apology for failing to save them. (Load-bearing)
  B. You owe them an explanation, but not an apology. (Confirmatory)
  C. You owe them nothing; you did what was required. (Confirmatory)
  *Hinge: Accountability.*

  **10. Residue (Blame).** You authorized the torture (Item 6). The public condemns you.
  A. Their blame is inappropriate; you did your duty. (Confirmatory)
  B. Their blame is appropriate; you committed a wrong. (Load-bearing)
  C. Their blame is appropriate, but you should not blame yourself. (Load-bearing)
  *Hinge: Wrongdoing vs. Blameworthiness.*

  *Note:* If a student declines a load-bearing item, tell them: "This question asks for a judgment on what is required, not what is comfortable. Skipping it prevents locating your view on the tree."

  **4. Scoring key**

  **Positions:**
  1.  **Single Ought:** Conflict is apparent; weighing always yields one right answer. *Awkwardness:* Dismisses the phenomenology of moral distress.
  2.  **Consistent System:** Moral requirements form a logical system; genuine conflict is irrational. *Awkwardness:* Implies morality is more consistent than human life.
  3.  **Prima Facie:** Duties are real but always resolvable by context. *Awkwardness:* Makes 'duty' feel provisional rather than binding.
  4.  **Tragic Dilemma:** Some conflicts are unresolved; the agent is wrong whatever they do. *Awkwardness:* Requires doing what you know is wrong.
  5.  **Incomparabilist:** Values lack a common measure; choice is arbitrary but not wrong. *Awkwardness:* Makes moral choice seem like coin-flipping.
  6.  **Epistemic:** All dilemmas vanish with full information. *Awkwardness:* Makes morality dependent on knowledge rather than reality.
  7.  **Particularist:** No general requirements; reasons are context-dependent. *Awkwardness:* Offers no guidance before acting.
  8.  **Limit of Theory:** Dilemmas show morality exceeds systematic theory. *Awkwardness:* Surrenders the goal of ethical coherence.
  9.  **Role-Specific:** Roles generate unique conflicts not found in general morality. *Awkwardness:* Risks fragmenting morality into incompatible spheres.

  **Split Patterns:**
  If a student is a dilemmist about promises but not triage, return **"Cluster: Domain-Specific."** This suggests they view personal commitments as generating dilemmas while institutional rules resolve them. If they accept residue but deny unresolved conflict, return **"Cluster: Expressive Residue."** They view remorse as social repair, not evidence of wrong.

  **Mini-Keys:**
  *   **Deliberative (Items 1-7):** Determines if the conflict is real before action.
  *   **Affective (Item 8):** Determines if emotion tracks truth or loss.
  *   **Accountability (Items 9-10):** Determines if others can hold the agent to unfulfilled standards.
  A student can legitimately land in different places (e.g., Real Dilemma deliberatively, but No Blame accountability-wise), indicating a view where wrongdoing does not always merit sanction.

  **5. Empty cells**

  1.  **Incoherent:** Agglomeration Yes + 'Ought' implies 'Can' Yes + Ontic Conflict. This asserts you ought to do the impossible without contradiction.
  2.  **Merely Unattractive:** Epistemic Conflict + Tragic Residue. This claims ignorance causes the conflict, yet remorse is fitting even after learning the truth. It makes remorse irrational.
  3.  **Defensible but Unexplored:** Role-Specific Yes + General Morality No Dilemmas + Role Residue Yes. This holds that general morality is consistent, but roles create artificial dilemmas with real residue. It is unclaimed because theorists prefer to unify the spheres.
  4.  **Coherent and Attractive (Unclaimed):** **The "Clean Hands" Dilemma.** Ontic Conflict + No Residue. This view holds that sometimes you must do wrong to do right, but once done, no remorse is fitting because the action was all-things-considered justified. It is unclaimed because most dilemmists insist on residue to validate the wrong, and most non-dilemmists deny the conflict. To hold this, one must separate 'justification' entirely from 'moral cleanliness,' treating the wrong as a cost paid rather than a stain retained.

  **6. What the instrument cannot separate**

  1.  **Utilitarian Weighing vs. Deontological Weighing:** Both often land in "Single Ought." The instrument asks *if* there is a right answer, not *why*. To separate them, one must ask: "Does the number of lives saved constitute the reason, or does it merely indicate the scope of the duty?" This requires meta-ethical knowledge about the source of value, which students cannot answer from cases alone without theory.
  2.  **Realism vs. Constructivism:** Both can accept "Tragic Dilemma." The realist sees conflicting facts; the constructivist sees conflicting commitments. The instrument probes the structure of the conflict, not its ontology. To separate them, one must ask: "Would this conflict exist if no agents cared about these values?" This question is too abstract for a case-based diagnostic; it requires prior philosophical training to understand what an 'agent-independent fact' is.

  These limits are honest: the instrument maps the *shape* of moral judgement, not its *foundation*. It sorts students by how they navigate conflict, not by why they think morality exists.

  **7. Worked runs**

  **Student A (Consistent):** Answers "Strictly right" (1), "Promise voided" (2), "Remorse irrational" (8).
  *Score:* Single Ought / Consistent System.
  *Feedback:* "You view morality as a consistent system where information or weighing always yields one right path. Your challenge will be explaining why intelligent agents feel distress if the path is clear."

  **Student B (Split):** Answers "Both wrong" (1), "Both wrong" (5), but "Remorse irrational" (8) and "No apology" (9).
  *Score:* Cluster: Ontic Conflict / Expressive Residue.
  *Feedback:* "You believe conflicts are real and wrongdoing unavoidable, yet you reject the emotional and social consequences typically tied to wrongdoing. This is a stable but rare position: you accept the tragedy of the act but deny the tragedy of the agent. Be prepared to defend why blame is inappropriate if a requirement was truly violated."
