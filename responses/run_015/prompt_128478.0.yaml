answer: |-
  # Adequacy Conditions for the Special Composition Question (SCQ)

  ## I. Desiderata for a Theory of Composition

  The following criteria establish the burden of proof for any proposed answer to the SCQ ("Under what conditions do some things compose a whole?"). Each desideratum includes the motivating case, a classification of its dialectical status (**NN** = Non-Negotiable for a coherent metaphysical theory; **CP** = Camp Preference, reflecting specific ontological commitments), and the specific cost of failure.

  ### A. Phenomenological and Discursive Accommodation
  *These criteria measure the theory's alignment with pre-theoretic intuition and linguistic practice.*

  1.  **Medium-Sized Dry Goods**
      *   **Motivating Case:** A wooden table.
      *   **Requirement:** The theory must validate the existence of ordinary artifacts without requiring paraphrase that renders the discourse systematically false.
      *   **Status:** **CP (Conservative Camp).** Revisionary metaphysics (Nihilism) explicitly rejects this to save other virtues.
      *   **Cost of Failure:** Revisionism; the theory claims ordinary discourse is erroneous.

  2.  **Biological Unity**
      *   **Motivating Case:** A human organism.
      *   **Requirement:** The theory must distinguish living organisms from mere heaps of cells, accounting for their causal integration and persistence through metabolic turnover.
      *   **Status:** **CP (Organicist/Restrictivist Camp).** Universalists accept the object but deny the *specialness* of the unity; Nihilists deny the object.
      *   **Cost of Failure:** Inability to ground bioethics or personal identity in ontology.

  3.  **Perspective-Dependence Rejection**
      *   **Motivating Case:** A constellation of stars fixed only by terrestrial perspective.
      *   **Requirement:** The theory must *deny* composition in cases where unity is imposed solely by an observer's conceptual scheme rather than mind-independent relations.
      *   **Status:** **CP (Restrictivist Camp).** Universalists accept constellations as objects (albeit uninteresting ones).
      *   **Cost of Failure:** Ontological inflation; loss of distinction between reality and representation.

  ### B. Dynamic and Functional Continuity
  *These criteria test the theory against diachronic and functional complexities.*

  4.  **Tolerance to Damage**
      *   **Motivating Case:** A statue missing its left arm that still counts as one object.
      *   **Requirement:** The composition relation must not be so brittle that minor mereological change destroys the whole.
      *   **Status:** **CP (Perdurantist/Constitution View).** Endurantists with strict identity conditions may struggle here.
      *   **Cost of Failure:** Excessive fragility; ordinary objects vanish upon microscopic or minor macroscopic alteration.

  5.  **Functional Persistence despite Material Turnover**
      *   **Motivating Case:** A swarm of drones maintaining collective behavior despite total turnover of constituent units every few minutes.
      *   **Requirement:** The theory must allow composition to supervene on causal/functional roles, not just static material arrangement.
      *   **Status:** **CP (Functionalist Camp).** Mereological Essentialists reject this.
      *   **Cost of Failure:** Inability to account for social groups, ecosystems, or cybernetic systems as unified entities.

  6.  **Process Unity without Persistent Parts**
      *   **Motivating Case:** A sustained fusion reaction in which no plasma particle persists for more than a millisecond.
      *   **Requirement:** The theory must accommodate wholes where the "parts" are transient events or energy states rather than enduring substances.
      *   **Status:** **NN (Scientific Compatibility).** A theory requiring persistent material atoms contradicts quantum field theory.
      *   **Cost of Failure:** Obsolescence; conflict with established physics.

  ### C. Formal and Logical Constraints
  *These criteria ensure the theory operates within a coherent logical framework.*

  7.  **Transitivity of Parthood**
      *   **Motivating Case:** If a leg is part of a table, and a molecule is part of the leg, the molecule is part of the table.
      *   **Requirement:** The parthood relation must be transitive ($x < y \land y < z \rightarrow x < z$).
      *   **Status:** **NN.** Violation renders the mereological calculus incoherent for standard inference.
      *   **Cost of Failure:** Logical inconsistency; inability to model nested structures.

  8.  **Uniqueness of Fusion**
      *   **Motivating Case:** The same parts cannot compose two distinct wholes of the same kind at the same time.
      *   **Requirement:** If $x$s compose $y$ and $x$s compose $z$, then $y = z$.
      *   **Status:** **CP (Extensionalists).** Non-extensionalists (e.g., proponents of coincident objects) reject this.
      *   **Cost of Failure:** Acceptance of coincident entities (e.g., statue and clay), complicating identity conditions.

  9.  **Consistency with Extensional Mereology**
      *   **Motivating Case:** Two objects with identical proper parts are identical.
      *   **Requirement:** The theory should ideally align with Classical Extensional Mereology (CEM) unless strong reasons dictate otherwise.
      *   **Status:** **CP (Universalists).** Restrictivists often must abandon CEM to avoid collapse into Universalism.
      *   **Cost of Failure:** Loss of formal elegance and standard mereological theorems.

  ### D. Metaphysical and Explanatory Costs
  *These criteria evaluate the theoretical virtues of the resulting ontology.*

  10. **Principled Non-Arbitrariness**
      *   **Motivating Case:** Distinguishing a table from a "table-minus-leg" without appealing to brute fact.
      *   **Requirement:** The cutoff for composition must be grounded in a general principle (contact, bonding, function), not a brute list of cases.
      *   **Status:** **NN (for an Explanatory Theory).** If the restriction is brute, the SCQ remains unanswered.
      *   **Cost of Failure:** Explanatory emptiness; the theory posits a mystery rather than solving it.

  11. **Avoidance of Ontological Explosion**
      *   **Motivating Case:** The denial of scattered objects (e.g., "Trout-Turkey" fusions).
      *   **Requirement:** The theory should not proliferate entities beyond necessity (Parsimony).
      *   **Status:** **CP (Sparse Ontology Camp).** Universalists accept explosion as the cost of non-arbitrariness.
      *   **Cost of Failure:** Bloated ontology; difficulty reconciling with naturalistic worldviews.

  12. **No Arbitrary Spatiotemporal Cutoffs**
      *   **Motivating Case:** Vagueness in when a collection becomes a whole.
      *   **Requirement:** The theory must avoid epistemicism (sharp but unknowable boundaries) or accept vagueness in the world.
      *   **Status:** **NN (for Coherence).** Sharp cutoffs without physical basis are metaphysically suspect; vagueness in reality is logically problematic.
      *   **Cost of Failure:** Acceptance of "brute sharpness" or violation of the Principle of Bivalence.

  ---

  ## II. The Incompatibility Thesis: Jointly Unsatisfiable Requirements

  The central tension in contemporary mereology is not between specific theories, but between subsets of the desiderata listed above. The following triad appears jointly unsatisfiable for any single theory:

  1.  **Principled Non-Arbitrariness (Desideratum 10):** There must be a general, non-brute condition for composition.
  2.  **No Gerrymandered Objects (Desideratum 3 & 11):** Composition does not occur for scattered, arbitrary, or perspective-dependent collections.
  3.  **Accommodation of Ordinary Objects (Desideratum 1 & 2):** Tables and organisms exist as composite wholes.

  **The Tension:**
  *   To satisfy **(1) and (3)** (Principled + Ordinary), one is pushed toward **Universalism**. If contact or bonding is the principle, it applies to scattered parts too (via fields or abstract relations), or if *any* condition is satisfied, composition occurs. This violates **(2)** by validating constellations and Trout-Turkeys.
  *   To satisfy **(2) and (3)** (No Gerrymandering + Ordinary), one is pushed toward **Restrictivism**. However, finding a *principled* cutoff (1) between a "swarm" (which we might accept) and a "constellation" (which we reject), or between a "table" and "table-minus-leg," without arbitrariness is the infamous Vagueness Problem. Most restrictivist principles (e.g., "fastened together") fail the **Non-Arbitrariness (1)** test because they admit of borderline cases or conflict with **Scientific Compatibility (6)** (e.g., nothing is truly fastened at the quantum level).
  *   To satisfy **(1) and (2)** (Principled + No Gerrymandering), one is pushed toward **Nihilism**. If the only non-arbitrary way to avoid gerrymandering is to deny composition entirely, then **(3)** fails. Ordinary objects are eliminated.

  **Specific Conflict on Restriction:**
  The demand for a **Principled, Non-Arbitrary Restriction (10)** cannot be squared with the **Denial of Gerrymandered Objects (2)** while maintaining **Scientific Compatibility (6)**. Physics describes matter as fields or particles in superposition without intrinsic "object boundaries." Any metaphysical boundary imposed to stop composition (e.g., "chemical bonding") is either arbitrary (why bonding and not gravitational attraction?) or physically false (bonding is a gradient, not a binary switch). Thus, a theory that denies scattered objects while claiming a principled basis inevitably relies on a cutoff that physics does not support.

  ---

  ## III. Evaluation of Competitor Views

  No existing view satisfies all Non-Negotiable (NN) and Camp Preference (CP) desiderata simultaneously. Each sacrifices specific criteria to preserve others.

  | View | Performance on Desiderata | Primary Sacrifice |
  | :--- | :--- | :--- |
  | **Unrestricted Universalism** | **Passes:** Non-Arbitrariness (10), Formal Properties (7, 8, 9), Scientific Compatibility (6).<br>**Fails:** No Gerrymandered Objects (2, 3, 11), Ordinary Intuition (1, 3). | **Ontological Parsimony.** Accepts "Trout-Turkeys" and constellations as real objects. Saves logic and principle at the cost of common sense. |
  | **Mereological Nihilism** | **Passes:** No Gerrymandered Objects (2, 3, 11), Non-Arbitrariness (10) (via "never"), Parsimony (11).<br>**Fails:** Ordinary Objects (1, 2), Discursive Fidelity. | **Phenomenological Fidelity.** Eliminates tables and organisms. Saves principle and parsimony at the cost of revisionism. |
  | **Biologically Restricted View** | **Passes:** Ordinary Objects (1, 2), No Gerrymandered Objects (3).<br>**Fails:** Non-Arbitrariness (10), Scientific Compatibility (6), Formal Properties (9). | **Explanatory Depth.** Cannot specify the "life" principle without arbitrariness or conflicting with physics (e.g., viruses, borderline life). Vulnerable to Vagueness Arguments. |

  ## IV. Seminar Conclusion

  The deadlock in the SCQ literature is not a failure of argumentation but a reflection of the **Incompatibility Thesis** outlined above. Participants in the debate are typically prioritizing different subsets of the desiderata. Universalists prioritize **Logical Consistency** and **Non-Arbitrariness** (NN) over **Ordinary Intuition** (CP). Nihilists prioritize **Parsimony** (CP) and **Non-Arbitrariness** (NN) over **Ordinary Intuition** (CP). Restrictivists prioritize **Ordinary Intuition** (CP) but struggle to meet the **Non-Arbitrariness** (NN) condition without collapsing into one of the other two views.

  A productive seminar must therefore move beyond asking "Which view is true?" to asking "Which desideratum is expendable?" The conceptual work lies in determining whether **Non-Arbitrariness** is truly Non-Negotiable, or if we must accept brute facts about composition to save the manifest image of the world.
