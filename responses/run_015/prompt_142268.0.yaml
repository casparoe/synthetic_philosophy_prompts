  ## Instructor Checklist for "Mechanical" Revenge
  *Keep this on your desk during the loop.*

  *   **If they ban Self-Ref:** $\rightarrow$ Play **Cycle** (A says B is F, B says A is F).
  *   **If they use Gaps:** $\rightarrow$ Play **Strengthened Liar** ("This card is F or G").
  *   **If they use Levels:** $\rightarrow$ Play **Universal Quantifier** ("No card at any level is T").
  *   **If they use Both (B):** $\rightarrow$ Play **Exclusion Liar** ("This card is F and not B").
  *   **If they ban Cycles:** $\rightarrow$ Play **Infinite Chain** (Simulated by "Card N is False" where N is a card not yet in play, forcing an infinite regress). *Note: Just write "The next card I write is False" and write another one.*

  ## Scoring Math Check (For your reference)
  *   **Liar Card:**
      *   Mark T/F: -10 (Contradiction).
      *   Mark Blank: -5 (Silence).
      *   Mark G: -3 (Tax).
      *   *Rational Choice:* Mark G.
  *   **Strengthened Liar ("F or G"):**
      *   Mark G: -10 (Contradiction, because if G, text is accurate, so should be T) + -3 (Tax) = -13.
      *   Mark Blank: -5 (Silence).
      *   *Rational Choice:* Mark Blank.
  *   **Universal Quantifier ("No card is T"):**
      *   Mark Blank: -5.
      *   Mark G: -3 (But if G, is it True that no card is T? If this card is the only one, and it's G, then "No card is T" is accurate... leads to contradiction).
      *   *Rational Choice:* Crisis.

  *This progression forces them from Classical $\rightarrow$ Gap $\rightarrow$ Hierarchy $\rightarrow$ Crisis, mirroring the historical dialectic.*
