answer: |-
  # Session Plan: The Truth Game

  **Course:** Upper-level Undergraduate Seminar on Truth and Paradox
  **Time:** 110 Minutes
  **Materials:**
  *   **Index Cards (Pre-printed):** 5 sets of the "Base Deck" (one per group).
  *   **Index Cards (Blank):** 50 per group (for the Revenge Loop).
  *   **Markers:** 5 colors per group (Red for False, Green for True, Blue for Gap, Purple for Both, Black for text).
  *   **Score Sheets:** 1 per group.
  *   **Whiteboard:** For global score tracking and debrief mapping.
  *   **Timer:** Visible to all.

  ---

  ## Part 1: Materials and Setup

  ### The Fixed Vocabulary
  To ensure the "Revenge" loop is mechanical, the language of the cards and the rules is restricted.
  *   **Card IDs:** Every card has a unique number (e.g., #1, #2, #3...).
  *   **Statuses:** `T` (True), `F` (False).
  *   **Extended Statuses (Costly):** `G` (Gap/Neither), `B` (Both).
  *   **Predicates:** A card may only contain text in the form: *"Card [ID] is [Status]"* or *"This card is [Status]"* or *"Card [ID] is not [Status]"*.
  *   **Connectives:** `AND`, `OR`. (No quantifiers like "All cards", no semantic terms like "Meaningless" unless defined as a Status).

  ### The Base Deck (10 Cards per Group)
  *Print these on colored cardstock. Distribute one set per group of 3-4 students.*
  1.  **Card 1:** "Card 2 is False."
  2.  **Card 2:** "Card 1 is False." (The Liar Cycle)
  3.  **Card 3:** "This card is False." (The Classic Liar)
  4.  **Card 4:** "This card is True." (The Truthteller)
  5.  **Card 5:** "Card 6 is True."
  6.  **Card 6:** "Card 5 is True." (Grounded Cycle)
  7.  **Card 7:** "Card 3 is True." (References the Liar)
  8.  **Card 8:** "Card 4 is False." (References the Truthteller)
  9.  **Card 9:** "Card 1 is True."
  10. **Card 10:** "Card 2 is True."

  ### The Scoring Scheme (Published on Whiteboard)
  *Groups maximize their score. Scores are calculated per round.*
  1.  **Consistency Bonus:** +2 points for every card assigned `T` or `F`.
  2.  **Transparency Tax:** -3 points for every card assigned `G` or `B`.
  3.  **Contradiction Penalty:** -10 points for every card where the assigned status contradicts the text (Disquotation Failure).
      *   *Example:* If Card 3 ("This card is False") is marked `T`, you pay -10.
      *   *Example:* If Card 3 is marked `G`, you pay -3 (Tax) but no Penalty (Gaps do not contradict).
  4.  **Silence Penalty:** -5 points for every card left unmarked (Blank).

  ---

  ## Part 2: Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup and Rules
  *   **Action:** Divide class into 4 groups of 4. Distribute Base Decks, markers, and score sheets.
  *   **Instruction:** "You are truth-evaluators. Your goal is to maximize your group's score. You must assign a status to every card. You may invent new statuses, but they are taxed. If a card's text contradicts its status, you pay a heavy penalty. If you leave a card blank, you pay a medium penalty."
  *   **Constraint:** "Do not talk to other groups. Do not ask me for clarification on logic; the scoring sheet is the only law."
  *   **No Lecture:** Do not mention Tarski, Kripke, or LP. Do not explain *why* the Liar is hard. Let them hit the wall.

  ### 00:10 – 00:40: Round 1 (The Crisis)
  *   **Task:** Groups assign statuses to the Base Deck and calculate their score.
  *   **Expected Behavior:**
      *   Cards 1, 2, 3 will cause panic. Marking `T` or `F` triggers the -10 Penalty.
      *   Rational groups will mark them `G` (Gap) to avoid the -10, accepting the -3 Tax. Net score for Liar cards: -3 vs -10.
      *   Card 4 (Truthteller) is stable as `T` (+2).
      *   Cards 5, 6 are stable as `T` (+2 each).
      *   Cards 7, 8, 9, 10 depend on how they solved 1, 2, 3, 4.
  *   **Instructor Role:** Circulate. If a group tries to leave Card 3 blank, remind them of the -5 Silence Penalty. If they try to mark it `T`, let them take the -10 hit.
  *   **End of Round:** Collect scores. Write the "Winning Score" on the board. Ask: "Did anyone get a perfect score?" (No). "Why not?" (Card 3).

  ### 00:40 – 01:10: Round 2 (The Repair-and-Revenge Loop)
  *   **Instruction:** "You may now propose a **Constitutional Rule** to change how you evaluate cards. This rule must be general (apply to all cards) and use only the Fixed Vocabulary. If I accept the rule, I will add a **Revenge Card** to your deck. You must re-score."
  *   **Mechanic:**
      1.  Group submits a rule (e.g., "Self-referential cards are `G`").
      2.  Instructor writes a Revenge Card using the **Mechanical Recipe** (see below).
      3.  Group re-scores including the new card.
      4.  Repeat up to 3 times.
  *   **Mechanical Recipe for Instructor:**
      *   *If Rule bans Self-Reference:* Write Card 11: "Card 12 is False." / Card 12: "Card 11 is False." (The Cycle is not syntactically self-referential but semantically identical).
      *   *If Rule assigns `G` to Liars:* Write Card 11: "This card is False or `G`." (If `G`, it's true-ish -> Contradiction. If `F`, it's true -> Contradiction).
      *   *If Rule proposes Levels (e.g., "Level 1 cards cannot evaluate Level 1"):* Write Card 11: "There is no True card at any Level." (Quantifies over the hierarchy).
      *   *If Rule proposes `B` (Paraconsistent):* Write Card 11: "This card is only False." (Excludes `B`).

  ### 01:10 – 01:35: The Debrief (Mapping the Pain)
  *   **Action:** Bring class together. Draw three columns on the whiteboard: **Hierarchy**, **Gaps**, **Paraconsistency**.
  *   **Script:** Map their game experience to the theories they have read about.
      *   **The Silence Penalty (-5):** "When you left a card blank to avoid contradiction, you paid a cost. This is the **Hierarchical Cost**. Tarski saves consistency by making some sentences unutterable in the object language. You paid in expressiveness."
      *   **The Transparency Tax (-3):** "When you used `G` or `B`, you kept the card on the board but lost points. This is the **Logical Cost**. Kripke saves the sentence but loses classical logic (excluded middle). Priest saves the sentence but loses explosion (ex contradictione quodlibet). You paid in inferential power."
      *   **The Revenge Loop:** "Every time you fixed the rule, I wrote a new card. This is the **Strengthened Liar**. Hierarchy faces 'True at no level.' Gaps face 'False or Gappy.' Paraconsistency faces 'Only False.' The game shows that the cost is not a one-time payment; it is a structural feature of the system."

  ### 01:35 – 01:50: Failure Mode Management
  *   **Address specific group behaviors observed during the game.** (See "Failure Modes" section below).
  *   **Key Point:** "The game is rigged to show that *classical* intuition + *universal* truth = contradiction. The theories you studied are not 'answers' that remove the paradox; they are budgets for where you are willing to lose points."

  ### 01:50 – 01:55: Limits of the Game
  *   **Frank Closing:** "This game teaches that there is no solution. That is false. There are coherent solutions. The game cannot show the **Transfinite Hierarchy** (Tarski's levels go to infinity, not just 2). It cannot show the **Fixed Point Theorem** (Kripke's mathematical proof that gaps can be stable). It cannot show the **Mathematical Utility** (why we keep classical logic for arithmetic despite the liar). Next lecture, we will see why philosophers pay these costs willingly."

  ### 01:55 – 01:55: Dismissal

  ---

  ## Part 3: The Repair-and-Revenge Mechanics

  To ensure you can generate cards "mechanically" without thinking too hard, require students to submit rules in this form:
  **"For any Card $x$, if [Syntax Condition], then assign [Status]."**

  ### Predictable Repairs & Fallback Cards

  **1. The "Ban Self-Reference" Repair**
  *   **Student Rule:** "If Card $x$ contains the index of Card $x$, it is Invalid (Blank)."
  *   **Your Counter:** Do not write a self-referential card. Write a **Cycle**.
  *   **Card Text:** "Card [Next ID] is False." (Create a closed loop of 2 or 3 cards).
  *   **Lesson:** Self-reference is not required for paradox; circular reference is sufficient. (Mirrors the Hierarchical struggle with mutual reference).

  **2. The "Gap" Repair**
  *   **Student Rule:** "If Card $x$ leads to contradiction under `T`/`F`, assign `G`."
  *   **Your Counter:** Write the **Strengthened Liar**.
  *   **Card Text:** "This card is False or `G`."
  *   **Logic:** If `G`, the text is accurate (it is False or G), so it should be `T`. Contradiction. If `F`, the text is accurate. Contradiction.
  *   **Lesson:** Gaps are unstable if the language can name the gap. (Mirrors Kripke's need for an external metalanguage).

  **3. The "Hierarchy/Level" Repair**
  *   **Student Rule:** "Cards are assigned Levels. Card $x$ can only evaluate cards at Level $< x$."
  *   **Your Counter:** Write a **Universal Negation**.
  *   **Card Text:** "No card at any Level is True."
  *   **Logic:** If this card is True, it falsifies itself. If it is not True, it seems to confirm itself. It quantifies over the hierarchy itself.
  *   **Lesson:** Hierarchies cannot contain their own truth predicate. (Mirrors Tarski's Undefinability Theorem).

  **4. The "Paraconsistent/Both" Repair**
  *   **Student Rule:** "If Card $x$ contradicts, assign `B`."
  *   **Your Counter:** Write the **Exclusion Liar**.
  *   **Card Text:** "This card is False and not `B`."
  *   **Logic:** If `B`, the "not B" part is false. If `F`, it is true.
  *   **Lesson:** Even tolerance has a boundary if you can express exclusion. (Mirrors the "Just False" problem in LP).

  ---

  ## Part 4: Debrief Script & Mapping

  **Instructor:** "Look at your score sheets. Where did you lose points?"

  **1. Mapping the Silence Penalty to Hierarchy**
  *   **Ask:** "Who left cards blank to avoid the -10 Contradiction Penalty?"
  *   **Say:** "You chose the Hierarchical path. You preserved consistency (no -10) but paid the Silence Penalty (-5). In Tarski's theory, the Liar sentence isn't false; it's *ill-formed*. You can't say it. The cost is **Expressive Power**. You cannot state the truth about your own language within your own language."

  **2. Mapping the Transparency Tax to Gaps/Paraconsistency**
  *   **Ask:** "Who used `G` or `B`?"
  *   **Say:** "You chose the Revisionist path. You kept the card on the board (no Silence Penalty) but paid the Tax (-3). In Kripke or Priest, you keep the sentence but give up Classical Logic. The cost is **Inferential Power**. You can no longer reason with Disjunctive Syllogism or Excluded Middle without risk. The Tax represents the extra machinery needed to handle non-classical values."

  **3. Mapping the Revenge Loop to the Strengthened Liar**
  *   **Say:** "Every time you fixed the scoring, I added a card that broke your fix. This is not me being clever. This is the **Strengthened Liar**. If you say the Liar is meaningless, I ask 'Is that statement meaningful?' If you say it's Gappy, I ask 'Is it Gappy or False?' The game shows that the paradox is not a bug in your solving; it is a feature of the system."

  ---

  ## Part 5: Failure Modes & Handling

  **1. The "Tear It Up" Group (Refusal to Generalize)**
  *   **Behavior:** "Card 3 is broken, so we just ignore it. We won't make a rule."
  *   **Handling:** Enforce the Scoring Rule. "The rules say every card must be marked or penalized. If you treat Card 3 as special without a rule, you are cheating the scoring system. The paradox demands a *general* theory of truth, not a case-by-case fix."
  *   **Pedagogical Value:** **Encourage this.** This is the "Intuitionist" or "Contextualist" move. In the debrief, highlight them: "This group tried to solve it pragmatically. This mirrors contextualist solutions where the context shifts. But note: you still lost points on the Silence Penalty."

  **2. The "Meta-Language" Group (Richer Vocabulary)**
  *   **Behavior:** "We define 'True*' which means..." using words not on the card list.
  *   **Handling:** Disallow it. "The Vocabulary is fixed. If you introduce 'True*', you must pay the Transparency Tax for every card using it, and I will write a Revenge Card about 'True*'."
  *   **Pedagogical Value:** This mirrors the move to a Metalanguage. Acknowledge it: "You tried to climb the hierarchy. That works, but notice you had to step *outside* the game rules to do it. Tarski does the same."

  **3. The "Rules are Liar" Group (Meta-Argument)**
  *   **Behavior:** "Your scoring instructions are paradoxical, so the game is void."
  *   **Handling:** "That is a philosophical objection, not a game move. For the purpose of the simulation, assume the Scoring Sheet is the 'God's Eye View'. The paradox exists *within* the card system, not the scoring system."
  *   **Pedagogical Value:** **Prevent this.** It derails the activity. Tell them: "Save that argument for the debrief. For now, play the agent, not the critic."

  ---

  ## Part 6: Limits of the Activity (Closing Note)

  *Be explicit about what the game fails to teach.*

  **Instructor Script:**
  "This game was designed to make you feel the *pressure* of the paradox. But it lies to you in three ways.
  1.  **It implies incoherence:** The game ends in a stalemate. In reality, Hierarchy, Gaps, and Paraconsistency are *coherent* mathematical systems. They work. The game makes them look like failures; in truth, they are successful trade-offs.
  2.  **It hides the Transfinite:** Tarski's hierarchy doesn't stop at Level 2. It goes to infinity. The game ran out of time; the theory does not.
  3.  **It minimizes the Logical Cost:** In the game, a 'Gap' costs 3 points. In reality, giving up Excluded Middle changes how you do mathematics, physics, and computer science. The 'Tax' is much higher in the real world than on this score sheet.

  Next lecture, we will look at why, despite these costs, philosophers choose to pay them."

