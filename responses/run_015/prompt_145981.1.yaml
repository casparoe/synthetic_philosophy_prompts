answer: |-
  Commissions should prioritize renaming streets to relieve residents of involuntary symbolic association, treating historical recording as a separate archival task rather than a function of active infrastructure. The "addressal burden" genuinely distinguishes street naming from static monuments because addresses are functional utilities requiring active invocation, whereas statues permit passive avoidance. This fusion of utility and honor means retention imposes a continuous ethical cost on residents who become unwilling agents of commemoration simply by living there. Consequently, the commission should adopt a presumption toward removal when a namesake's harm is established, as the "record" function does not justify ongoing compelled endorsement. Recontextualization efforts that leave the name intact fail to alleviate the burden of utterance, rendering them ethically insufficient for infrastructure embedded in daily life. This logic extends beyond streets to any named public asset requiring daily interaction, such as schools or municipal buildings, creating a broader category of "compelled commemoration" that demands higher scrutiny than park plaques. The practical implication is that historical truth must be preserved in dedicated archives or interpretive centers rather than on the street sign itself, ensuring the record survives without imposing the honor.

  I am highly confident in the ethical distinction between functional infrastructure and static monuments. I am least certain whether decoupling the historical record from the physical name sufficiently satisfies the public interest in historical continuity, as some historians argue the name itself is the primary historical artifact that should remain in situ.
