      *   *Implication 1: The Functional/Symbolic Fuse.* Unlike statues, you can't live on a street without "invoking" the name. This makes retention an active imposition of values on residents. Therefore, the default presumption should shift toward removal if the namesake is disqualifying, because the cost of retention is borne daily by unwilling participants.
      *   *Implication 2: Decoupling Honor from Record.* The user's distinction (honor vs. record) is key. Street names are primarily honorific in practice because they require usage. Historical recording should be moved to passive media (plaques, databases, historical societies) rather than active infrastructure. Retention for the sake of "history" is unethical when it imposes a symbolic burden.
      *   *Implication 3: Recontextualization Limits.* You can't really "recontextualize" a street name in situ effectively. A plaque on a lamppost doesn't stop the mail carrier or the resident from saying the name. Renaming is the only true recontextualization for infrastructure.
      *   *Implication 4: Broader Applicability.* Does "addressal burden" apply elsewhere? Yes, school names (students must say it), building names (donors/figures). But streets are unique because they are public *and* private (your home address). It applies more broadly than just streets but less than statues.
      *   *Implication 5: Process.* The commission needs a clear metric for "harm vs. contribution" that acknowledges the *ongoing* nature of the harm caused by the naming itself.

