prompt: |-
  I was recently appointed to my city's heritage and naming commission, and the work has become personally relevant: my own home sits on a street named after a figure whose actions are now widely regarded as having caused serious harm. This has led me to think not just about monuments in public squares, but about the particular ethics of commemorative street naming—especially the problem that an address is not merely a symbol but a functional locator that residents must repeatedly invoke in daily life.

  Rather than a standard survey of monument debates, I am asking for the most important implications of the ethics of commemoration for practical commission work—specifically regarding retention, removal, and recontextualization—in light of a distinction that seems under-examined. Commemorative naming appears to do two things at once: it honors (which requires present endorsement) and it records (which requires only preservation of fact). But with street names, these functions are fused in a single practical token; there is no neutral "archival mode" for an address, since it must remain usable. This creates what I will call an "addressal burden": current residents bear a symbolic association they never consented to, merely by stating where they live. Meanwhile, removal risks erasing the historical record of what values were once publicly affirmed, yet retention risks present endorsement.

  Please describe the most important implications of this landscape for how a commission should weigh these options. Treat the "addressal burden" idea seriously, but also examine whether it genuinely distinguishes street naming from statues or plaques in parks, or whether it applies more broadly. How should a commission navigate the asymmetry between honoring and recording when the commemorative medium is embedded in practical infrastructure?

  Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question. Please also state how confident you are in your claims and identify the specific point about which you are least certain.
