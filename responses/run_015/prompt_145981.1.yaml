      *   *Is "addressal burden" unique?* It's a strong formulation of "compelled speech." I need to make sure I analyze if it applies to statues. Statues are visual; streets are verbal/functional. You can walk past a statue; you cannot "walk past" your address when giving it to emergency services.
      *   *Confidence:* High on the ethical framework, lower on the practical implementation of "archival modes" (how effective are plaques really?).
      *   *Least Certain:* Whether alternative archival methods (plaques, digital records) successfully satisfy the "recording" function enough to justify the erasure of the original name. Some historians argue the name *is* the record. I need to flag this tension.

