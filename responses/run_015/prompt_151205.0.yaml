answer: |-
  Here is the breakdown of the conceptual tension you're identifying. I've structured this to move from the strict logic of the Individualist Restriction to the potential "leakage" where a collective dimension might hide.

  ### The Core Tension: The Veto vs. The Sum

  To understand this, we have to look at what Scanlon means by a "reasonable rejection." In his framework, moral principles are rules for living together that no one could reasonably reject. The engine of this system is the **Individualist Restriction**: you can only reject a principle based on how it burdens *you* (or the generic person in your position), not based on the sum of burdens across society.

  In your micro-harm case (one million pinpricks vs. one broken leg), the strict contractualist logic works like this:
  1.  **The Concentrated Case:** The person with the broken leg has a strong, generic reason to reject the principle allowing this. Their veto holds.
  2.  **The Diffuse Case:** Each person with a pinprick has a trivial reason to reject. Individually, their veto is too weak to override the benefits of the policy. Since no *single* person has a strong enough veto, the principle stands.

  The conceptual knot you're pointing to is this: **Is the "strength" of a reason entirely internal to the individual standpoint, or does the *multiplicity* of standpoints change the moral geometry?**

  ### 1. The Indexical Lock (The Strict View)
  On the strict reading, reasonableness is necessarily indexical. It is locked to the first-person standpoint because contractualism is founded on the idea of **mutual recognition**. To justify an action to someone is to offer them a reason *they* can accept from *their* perspective.

  If I allow "collective scaling"—saying that a million weak rejections add up to one strong rejection—I am effectively saying that the *group* has a veto power that the *individual* does not. This breaks the Individualist Restriction. It turns the "reasonable rejection" from a shield protecting the individual into a utilitarian calculus where weights are summed.

  From this angle, the inability to aggregate isn't a bug; it's a logical feature. If you permit scaling, you lose the distinctively contractualist protection of the individual against the greater good. The "indexical lock" is the price of admission for saying we owe justification *to each person*, not to the "collective" as a metaphysical entity.

  ### 2. The Hidden Collective Dimension (The "Generic" View)
  However, there is a subtle space where a collective dimension might sneak in, and this is where your intuition about "hidden scaling" is sharp. It lies in how we define the **generic reason**.

  Scanlon argues we reject principles based on "generic reasons"—reasons any person in that situation would have, not idiosyncratic preferences. The question is: **Does the generic description of the situation include the fact that everyone is suffering?**

  *   **Argument for Scaling:** If a policy imposes a micro-harm on everyone, the *social world* created by that principle is one where everyone is burdened. A person rejecting the principle isn't just saying, "I have a pinprick." They might be saying, "I am living in a system where *everyone* is subjected to arbitrary micro-burdens."
  *   **The Shift:** Here, the reason for rejection shifts from "My pain is X" (indexical) to "The pattern of distribution is Y" (structural). If the reason for rejection is about the *structure of the relationship* between citizens, then the fact that it affects a million people changes the nature of the relationship. It transforms from "I am inconvenienced" to "We are being exploited."

  If this holds, then "justifiability to each" secretly contains a "justifiability to all simultaneously." The reasonableness of the rejection isn't scaled by adding up pain units; it's scaled by the **reciprocity of the burden**. If I have to accept a burden that *everyone* shares, that might be more reasonable than accepting a burden that *only I* bear, or conversely, imposing a burden on *everyone* might be harder to justify than imposing it on one.

  ### 3. The Logical Feature vs. The Gap
  So, is the inability to aggregate a logical feature or a gap?

  I argue it is a **logical feature of the veto model**, but it points to a **gap in the moral ontology**.

  *   **Logical Feature:** As long as contractualism relies on a *veto* model (one person can stop the principle), aggregation is logically impossible. You cannot sum vetoes. Either the individual has a decisive reason or they don't.
  *   **The Gap:** The gap exists in how we determine what counts as a "decisive reason." If Scanlon admits that living in a world of diffuse harm creates a *different kind of grievance* than living in a world of concentrated harm, he opens the door to non-indexical reasons.

  The tension is that Scanlon wants to have it both ways. He wants the individual protection of the veto (to avoid utilitarianism) but needs some way to account for large-scale diffuse harms (to avoid absurdity). He tries to solve this by adjusting the "generic reasons," but he resists admitting that this is a form of aggregation.

  ### Intuitive Summary
  Think of it like a court case.
  *   **Indexical View:** Each plaintiff sues individually. One person suing for a penny loses. A million people suing individually for a penny each still lose a million separate cases.
  *   **Collective Scaling:** The million people form a class-action suit. The *aggregate* claim is significant.
  *   **Scanlon's Dilemma:** Contractualism is designed to hear individual cases, not class-action suits. But morality often feels like it requires class-action recognition. The "hidden scaling" you're looking for would be a rule that says, "When the *same* principle generates the *same* complaint in everyone, the complaint changes category from 'trivial' to 'systemic'."

  ### Confidence and Uncertainty

  **Overall Confidence:** High (85%).
  I am confident in the diagnosis that the Individualist Restriction logically precludes standard aggregation, and that the tension arises from the conflict between the *veto mechanism* and the *intuition of cumulative harm*.

  **Point of Least Certainty:**
  I am least sure about **whether "reasonableness" can coherently be non-indexical without collapsing into consequentialism.**

  Specifically, if we allow that my reason for rejection is strengthened by the fact that *others* are also harmed (the "systemic" argument), where do we draw the line? If my rejection is stronger because you are also hurting, am I no longer speaking from *my* standpoint, but from a "view from nowhere" that sums up the harm?

  It is difficult to articulate a version of "collective scaling" that respects the individual standpoint (as contractualism demands) without secretly importing the utilitarian calculus (summing values) that contractualism was built to reject. Whether there is a stable middle ground where reasonableness is "relational" but not "aggregative" is the deepest unresolved metaphysical question in this corner of the theory.
