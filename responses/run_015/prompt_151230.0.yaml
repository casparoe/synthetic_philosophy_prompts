answer: |-
  Elena, a senior planner at the metro transit authority, identified Stop 42-B on Oak Avenue as a candidate for removal during the network optimization project. Archives confirmed the stop was a 1974 printing error—a route deviation that was never authorized but made it onto the printed maps and was never corrected. Elena ran a six-week pilot removal during July and August, tracking travel times and passenger complaints; data showed a 4% speed improvement and zero formal grievances. She authorized permanent removal in September, but within two weeks, intersection gridlock returned worse than before, and emergency response times in the sector slipped. The stop wasn't serving passengers; it was serving the traffic ecosystem that had grown around its physical presence.

  **Verdicts**
  The historical-rationale test passes cleanly because the archives definitively prove the stop originated as a clerical typo with no intended function. The best-evidence cost-benefit analysis fails because the pilot data was accurate for its scope but misleading for the system as a whole, leading to a net negative outcome. The Burkean presumption wins because it correctly predicted that the arrangement held value derived from current integration rather than original intent.

  **Adaptations**
  Three specific workarounds had calcified around the stop's existence despite its accidental origin. First, commercial delivery drivers used the bus bay as a legal loading zone during peak hours, preventing double-parking that blocks the intersection. Second, the traffic light controller uses the bus stop's induction loop to phase signals; without the bus stopping, the cycle defaults to rush-hour timing prematurely. Third, local pedestrians treat the stopped bus as a moving crosswalk shield, crossing behind it instead of using the broken signal button at the corner.

  **Load-bearing Feature**
  The load-bearing feature is the epistemic gap between *provenance* (which is archival) and *integration* (which is behavioral). If the origin were undocumented, the historical test would fail and everyone would agree to keep it based on uncertainty. If the pilot could have revealed the downstream mess in advance—for example, by running during the school term—the reformer would have caught the error, and everyone would agree removal was bad based on data. The case only holds because the history was knowable but the systemic dependency was only visible upon breakage.

  **Defender's Attack**
  The reformer argues that this is not a victory for presumption but a failure of simulation design. She contends that the Burkean view is too conservative and that the correct lesson is to expand pilot scope to cover seasonal variables rather than assuming inherited structures possess hidden wisdom.
