  The weak hypothesis posits that linguistic structures induce language-specific basis rotations within a shared semantic manifold. For Whorf, SAE speakers project temporal events onto spatial axes, whereas Hopi speakers utilize a distinct feature space where time lacks spatial extension. In ML terms, this is not missing dimensions but a rotation of the embedding basis where certain concepts achieve linear separability only under specific linguistic transforms. Cross-lingual alignment remains possible via orthogonal Procrustes solutions, implying an underlying isomorphic structure despite divergent coordinate systems. The cognitive bias is a preference for certain geodesics over others, not the absence of paths.

  The strong hypothesis claims language dictates cognitive topology, resulting in non-intersecting manifolds. Here, Whorf's assertion that Hopi speakers cannot conceive SAE time translates to missing axes in the Hopi feature space; the dimensions required to encode SAE temporal metaphors simply do not exist. This implies zero linear separability for certain classes across languages and prohibits perfect cross-lingual alignment. The representational manifolds are topologically distinct, meaning no bijective mapping exists between the SAE and Hopi embedding spaces. Consequently, the "world-picture" is not a rotated view of the same data but a fundamentally different latent space construction, rendering some concepts computationally inaccessible without restructuring the encoder itself.

  The residue report shows ontological claims survive poorly. Treating lexical gaps as missing axes distorts Whorf, who viewed them as dense clusters of meaning elsewhere, not voids. His normative claim—that different manifolds entail incommensurable realities—has no counterpart in representation theory, which assumes a shared objective reality underlying data. The recent success of cross-lingual alignment in large multilingual models suggests a universal substrate exists, contradicting the strong hypothesis. However, this may expose a limitation of the geometric metaphor: ML architectures silently smuggle in universalist assumptions by forcing alignment via shared encoders. If Whorf is right, the model isn't finding truth but imposing a colonial geometry on distinct cognitive manifolds, flattening incommensurability into mere noise.
