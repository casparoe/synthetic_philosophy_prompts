answer: |-
  You are asking exactly the right questions, and your intuition about "reference magnetism" and kind terms is surprisingly sharp for a first pass. This is one of the most famous puzzles in Chinese philosophy, so don't worry about your notes being messy—it's confusing by design.

  Here is the breakdown of the logic, the metaphysics, and who actually said it.

  ### 1. First, the Housekeeping
  *   **Who:** It is definitely **Gongsun Long** (c. 320–250 BCE). Hui Shi was his contemporary and rival in the School of Names, but Hui Shi is known for paradoxes like "Heaven is as low as earth." Gongsun Long is the "White Horse" guy.
  *   **School:** **Mingjia** (School of Names) is the correct pinyin. You got that right.
  *   **Text:** The essay is called *Bai Ma Lun* (White Horse Discourse).

  ### 2. Parsing the Actual Logic
  Your set-theory reading ("White $\cap$ Horse $\neq$ Horse") is the standard modern reconstruction, but Gongsun Long is making a slightly more specific claim about **concepts** rather than sets.

  The argument rests on the ambiguity of the Chinese word *fei* (非), which can mean "is not" (identity) or "is not a member of" (class membership).

  **Gongsun Long's Syllogism:**
  1.  **"Horse"** is the name for the **shape/form** (the universal "horseness").
  2.  **"White"** is the name for the **color**.
  3.  **"White Horse"** is the name for **shape + color**.
  4.  Therefore, the concept "White Horse" $\neq$ the concept "Horse".
  5.  **Conclusion:** A white horse is not a horse.

  **The Crucial Distinction:**
  He is not saying a white horse isn't a *member* of the group of horses (extension). He is saying the *term* "White Horse" is not identical to the *term* "Horse" (intension).

  If I ask for a "horse," a yellow or black one will do. If I ask for a "white horse," a yellow one won't do. Since the conditions for satisfying the request are different, the "names" (*ming*) are different. Therefore, they are not the same thing.

  ### 3. Ontology vs. Linguistics (The *Ming-Shi* Problem)
  You asked if this is about what exists or how we name things. In the Warring States period, this wasn't a binary choice. It was about **Ming-Shi (Name-Actuality) Rectification**.

  *   **Linguistic:** Names must be precise. If we allow "White Horse = Horse," language becomes sloppy.
  *   **Ontological:** Gongsun Long was a **Realist**. He believed universals (like "Whiteness" and "Horseness") exist independently. "White Horse" is a compound universal. "Horse" is a simple universal. Since the metaphysical entities are different, the statement holds.

  So, it's a linguistic argument grounded in a metaphysical claim. He believes that if our language is imprecise, our governance and reality become chaotic.

  ### 4. Your "Reference Magnetism" Hypothesis
  This is the most interesting part of your query. You asked: *Is 'horse' acting as a magnet that pulls in all color variants, while 'white horse' is stuck to one specific perceptual property?*

  **Yes, basically.** You have independently reinvented a distinction very similar to **Natural Kind Terms vs. Definite Descriptions.**

  *   **"Horse" (The Magnet):** In modern philosophy (Kripke/Putnam), this is a rigid designator or natural kind. It points to the essence of the thing regardless of accidental properties (like color).
  *   **"White Horse" (The Description):** This adds a modifier that restricts the reference.

  Gongsun Long is arguing that adding the modifier changes the *essence* of the reference. He is anticipating the **Intensional** vs. **Extensional** distinction:
  *   **Extensional (Modern Logic):** The set of white horses is a subset of horses. So, "White Horse is Horse" is True.
  *   **Intensional (Gongsun Long):** The *meaning* of "White Horse" includes color. The *meaning* of "Horse" does not. Since Meaning A $\neq$ Meaning B, "White Horse is not Horse."

  If you treat it purely as extensional language (modern set theory), **yes, the argument collapses.** But Gongsun Long would say you are ignoring the *content* of the concepts.

  ### 5. Does the School of Names Use This Elsewhere?
  Yes. Gongsun Long has another famous essay called **"Hard and White" (Jian Bai Lun)**.

  *   **The Argument:** Take a stone that is hard and white.
  *   **Logic:** Your eye sees "white" but doesn't feel "hard." Your hand feels "hard" but doesn't see "white."
  *   **Conclusion:** "Hardness" and "Whiteness" are separate universals that happen to coincide in the stone, but they are ontologically distinct. You can have "Whiteness" without "Hardness" (e.g., in snow) and "Hardness" without "Whiteness" (e.g., in iron).
  *   **Connection:** Just like "White" and "Horse" are separate universals that combine to make a new concept ("White Horse"), "Hard" and "White" are separate from the "Stone."

  This confirms the School of Names was obsessed with **separating qualities (universals) from objects (particulars).**

  ### 6. Why Does This Matter? (The "So What?")
  It sounds like word games, but in the Warring States period, this was political.
  *   **Confucians** wanted to rectify names to ensure social roles were clear (A Father must act like a Father).
  *   **Gongsun Long** took this to the extreme. If the King says "Hire capable men," but accepts "men who are capable *and* my cousins," he is violating the logic of "Capable Man $\neq$ Cousin."
  *   By insisting "White Horse is not Horse," Gongsun Long is demanding that laws and commands be followed exactly as named, without slippery generalizations.

  ### Summary for Your Notes
  1.  **Author:** Gongsun Long (not Hui Shi).
  2.  **Logic:** Intensional identity (Concept A $\neq$ Concept B), not Extensional membership (Set A $\subset$ Set B).
  3.  **Metaphysics:** Realism about universals. "Horseness" and "Whiteness" are distinct entities.
  4.  **Your Magnet Idea:** Spot on. "Horse" is the broad kind; "White Horse" is a restricted description. Gongsun Long argues the restriction creates a *new* kind.
  5.  **Collapse?** It collapses only if you force modern extensional logic onto it. In its own context (conceptual identity), it is valid.
  6.  **Other Examples:** "Hard and White" stone argument uses the same separation of qualities.

  You're reading it correctly, you just need to switch your logic brain from "Set Membership" to "Concept Identity." Keep the reference magnetism idea; that's a great way to explain it to others.
