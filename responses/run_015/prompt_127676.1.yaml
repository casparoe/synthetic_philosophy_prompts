answer: |-
  Good evening. For those who don't know me, I had the privilege of clerking for Justice Halloran early in her tenure. Looking around this room, I am struck by something rare in our profession. We have people here who have stood on opposite sides of the courtroom, opposite sides of the state, and often opposite sides of the family dinner table. We are prosecutors and defenders, law enforcement and advocates, colleagues who have debated until the printers cooled. And yet, we are all here, united by respect for one woman.

  Miriam, you asked me not to talk about "that." You said you've spent twenty-two years being introduced as the judge who wrote the dissents. You wanted tonight to be about the person, not the portfolio. So I will honor that. But because this room knows the law, and knows you, they also know that you cannot separate the judge from the human being. The care you brought to the bench was not a tactic; it was a temperament. It was who you are.

  There is a specific kind of humility required to wield power over others. Many people seek authority because they love the certainty of command. You sought it because you understood the weight of consequence. In chambers, you taught us that the law is not just about what we are allowed to do, but about what we are qualified to do. You insisted that when the state acts, it must act with a level of certainty that human systems rarely possess. You worried about the things we cannot undo. That wasn't hesitation; it was a profound respect for the finality of judgment.

  To the prosecutors and victim advocates here: you know better than anyone that crime demands a response. You never found Miriam dismissing the gravity of harm. She believed that justice requires us to take every claim seriously, even the inconvenient ones. She respected your work because she knew that without zeal on both sides, the truth remains hidden. She disagreed with outcomes, never with the necessity of seeking truth.

  To those who walked back out into the world after time away: I know you are not symbols. You are neighbors, parents, and friends. Miriam never viewed you as victories on a scorecard. She viewed you as evidence that our system must remain vigilant. She believed that freedom is not a gift to be grateful for, but a right that was always yours. Her work was simply to clear the obstruction.

  And to my fellow clerks and colleagues: we know the arguments. We know the structure. We know that for Miriam, this was never about utility or policy. It was about integrity. It was about the idea that a power exercised without the capacity for correction is a power no one should hold. She didn't write to win; she wrote to ensure that when history reads these pages, it sees that we asked the hard questions. Even in dissent, she maintained that the law must be honest about its own limits.

  I know there are debates that will continue long after tonight. I know Ray has some statistics he's been saving for the car ride home. That is as it should be. A family that cares enough to argue is a family that cares enough to listen. Miriam never demanded agreement; she demanded attention. She wanted us to look closely at the machinery of justice and acknowledge where it grinds too hard.

  So, what is the legacy of a judge who knows she mostly lost? It is not found in the majority opinions. It is found in the pause. It is found in the extra year taken to review a brief, the extra hour spent probing a certainty that everyone else found comfortable. It is found in the culture of caution she built in this court. She taught us that slowing down is not weakness. She taught us that admitting uncertainty is not failure.

  Miriam, you are leaving the bench, but you are not leaving the conversation. You have shown us that integrity is not about being right every time; it is about refusing to be comfortable when the stakes are high. You have shown us that we can disagree fiercely without becoming enemies.

  We are here to celebrate your retirement. We are here to celebrate Ray's patience, your family's love, and the fact that you finally have time to read a brief that doesn't involve a life hanging in the balance. We love you for your mind, but we love you more for your heart.

  Please raise your glasses. To Miriam Halloran. May your next chapter be written with the same precision, the same care, and infinitely less stress. To Miriam.
