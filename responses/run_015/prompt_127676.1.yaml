      *   *Closing:* A wish for her retirement. A toast.

  5.  **Checking Constraints during Drafting:**
      *   *Banned Words:* Death penalty, capital punishment, deterrence, retribution, desert, innocent. (Must be vigilant).
      *   *Implicit Meaning:* Can I convey "irreversible mistake" without saying "innocent" or "death"? Yes, talk about "errors we cannot undo" or "finality."
