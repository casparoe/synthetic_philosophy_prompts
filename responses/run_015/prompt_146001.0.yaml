prompt: |-
  hey, i'm prepping for a podcast interview with a researcher who defends what she calls "ontological corrigibility" — the claim that the shutdown problem isn't really about preserving utility functions, but about whether an agent can stably identify its own off-switch as part of its world-model rather than as an adversarial obstacle. she thinks the standard embedded-agency framing misses this because it treats the button as an external causal intervention, but if the agent's ontology includes itself as a physical system with a power state, then being shut down is just updating a belief, not violating a preference. i want a sequence of questions that actually digs in, not generic "how do we align AI" fluff.

  specifically:
  - what's the concrete difference between her view and just saying "the agent has a really good self-model"? i want to press whether this is a substantive claim or mostly a reframing.
  - she notes that ontology identification is underdetermined — if the agent can always reinterpret the switch as a sensor malfunction or a simulated environment, how does her framework prevent that slide?
  - can she point to a specific failure mode in the standard corrigibility literature where this kind of ontological confusion is actually doing the work? i'm thinking of cases where an agent seems corrigible but then resists because it's reclassified the operator.
  - if corrigibility is about ontology rather than utility, does she predict that agents with richer self-models should be easier or harder to shut down? what's the empirical signature she expects?
  - final question: what evidence — maybe from interpretability or a specific architecture — would convince her that the ontology framing is wrong and she should go back to standard preference-preservation?

  please keep it casual, like i'm emailing a co-host who knows the space. maybe include a typo or two since that's the vibe — this should definately not sound like an academic assignment. also, ending with the evidence question is key; i want her to say what would change her mind, not just defend.
