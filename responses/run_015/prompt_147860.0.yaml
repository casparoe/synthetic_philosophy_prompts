answer: |-
  The kettle clicked off. The silence held for a moment, then broke.

  "It's not bad for me, Ada. The being dead part."

  "It's the end of you," Ada said. She was gripping her mug, knuckles white. "How is that not bad?"

  "Because there's no me to be bad for. When I'm dead, I'm not there. When I'm here, death isn't. There's no moment where the two overlap. You can't harm a ghost."

  "That's a trick of grammar. You're talking about events. I'm talking about structure." Ada set the mug down. "Look at this table. If I remove a leg, the table doesn't feel pain. But the table is ruined. The harm isn't an experience; it's a deprivation. You lose the future where you finish your translation."

  "I concede the dying. The pain, the fear, the unfinished sentence. That's bad. But the state of being dead? That's symmetrical. Think about the time before I was born. Was that bad for me? Did I suffer from not existing in 1950?"

  "That's different," Ada said. "You didn't have projects in 1950. You have them now. You're pointing forward. The before-birth stretch doesn't cut anything short. This does."

  "It cuts off the same amount of time. If the non-existence after isn't bad because I'm not there to miss it, the non-existence before wasn't bad either. You're just grieving the direction of the arrow."

  "No. I'm grieving the shape." Ada leaned in. "Take two lives. Same length, same total good. In one, the good is front-loaded. A slow narrowing. In the other, a thin start, then a late swell. Now cut both off at sixty-one. The usual counting says the loss is the same. The size of the slab you didn't get. But it's not. In the second life, the death lands in the middle of something going somewhere. The life is a worse shape at the point where it stops. A bridge that stops mid-span is a different object from one that stops at the abutment, even with the same tonnage of steel."

  Miriam stirred her spoon, though there was no tea. "So the badness isn't the missing goods. It's the interruption of the arc."

  "Yes. Your accounting can't see that. You count units of welfare. I count structural integrity. You're in the swell, Miriam. You're the back-loaded life. Cutting you now wrecks the shape."

  "And if I were the front-loaded one?" Miriam asked. "If I'd had my swell and was narrowing? Would a death then be less bad? Or even good?"

  Ada hesitated. "It would be less destructive to the whole."

  "So a long decline wrecks the shape, and some deaths improve the whole. Is that what you're saying to me? That I should be grateful for the timing because it saves the narrative arc?"

  "I'm saying the harm lands *now*, on the living you. Not later. Think about a joke. If the punchline never comes, the setup isn't just unfinished; it's worse than it was before the punchline failed. It becomes a bad joke. The death makes the earlier stretch worse. It retroactively devalues the work. So there is a subject who exists when the harm lands. You. Right now. Your life is being damaged while you're alive."

  Miriam stopped stirring. "That's double-counting. You're confusing a change in how you rate a whole with something happening to a part. If you rate my first fifty years as good, and then my death makes them 'bad' because they lack a payoff, you've counted those years twice. Once as good, once as spoiled. You can't downgrade the past just because the future vanished. The past is fixed. The value of a thing isn't dependent on what comes after it, only on what it is."

  "It depends on what it's *for*," Ada said. "A bridge abutment is useless without the span."

  "And I am not a bridge. I'm a woman drinking water that's gone cold." Miriam pushed the mug away. "You want the harm to land on me now, so you can say someone is suffering. But you're just moving the goalposts. You say the past is ruined because the future is gone. I say the past is solid, and the future is nothing. We disagree on whether nothing can weigh down something."

  "We disagree on whether a life is a sum or a story."

  "No," Miriam said. "We disagree on whether you can mourn a ghost without pretending it's alive." She looked at her daughter, sharp and tired. "Don't worry about the shape, Ada. Worry about the steel. It's rusting either way."

  ***

  1. **Missed Replies:** Miriam let Ada off easy on the retroactive harm. She should have pressed that if the past is fixed, its intrinsic value can't change based on external events, otherwise, no moment is ever secure. Ada missed pointing out that Miriam's symmetry argument fails because biological organisms have a directional trajectory pre-birth lacks; non-existence before is neutral, non-existence after is an interruption of function.

  2. **Arc vs. Standard:** Your arc point collapses into the standard deprivation account unless you argue narrative shape has value *independent* of welfare. If the "slab" lost in the front-loaded life contains negative welfare (decline), standard counting says death is a benefit. If the back-loaded slab contains positive welfare, death is a loss. They don't come out the same size on standard counting. You need to clarify that the "slab" is equal *time*, not equal *value*, for your distinction to hold.

  3. **Setup Clarity:** The premise is muddled. You say "same total amount of good" but also "front-loaded vs. back-loaded." If both die at 61, the front-loaded life has *already realized* the good. The back-loaded has not. The loss is objectively larger in the back-loaded case on standard views. To make the arc argument work, you must stipulate that the *future* goods are equal in both scenarios, but the *narrative trajectory* differs. Otherwise, Ada is right about the loss size, and Miriam's symmetry argument is fighting a straw man. Fix the accounting before drafting.
