      *   **Audience:** Mixed group (philosophy/urban planning folks + neighbors/old lab mates). Split room emotionally/intellectually.
      *   **Occasion:** Opening remarks for a community workshop on renaming streets/removing a bronze statue in Riverside Park.
      *   **Tone:** Not a lecture, not "both sides" equivocation, authentic scientist voice (not polished philosopher), humble but insightful.
      *   **Core Idea:** Street names/statues aren't honor plaques; they're coordinate markers in a shared map for navigating the past. Removal = shifting reference frames, not deleting history.
      *   **Constraints:** 5-minute speech (approx. 750-800 words spoken at normal pace), no bibliography/citations.
      *   **Additional Task:** Critique the "reference frame" framing (what would change my mind about using it?) and critique the speech's structure (where is it likely to fail?).

  2.  **Deconstruct the Core Idea ("Reference Frame"):**
      *   *Scientific Analogy:* In physics/biology, a reference frame is the perspective from which measurements are made. Changing the frame changes how you interpret data, but the data (history) still exists.
      *   *Application:* A statue isn't the history itself; it's a vantage point. Moving it changes how we see the landscape, not the landscape itself.
      *   *Risk:* It can sound too clinical or dismissive of emotional attachment. Needs to be grounded in human experience, not just abstract theory.

  3.  **Drafting the Speech - Section by Section:**
      *   *Introduction:* Acknowledge the room's diversity. Establish credibility (biochemist, not philosopher). Disarm the tension.
      *   *The Pivot:* Introduce the core metaphor. Connect ion channels/membranes to city infrastructure.
      *   *The Core Argument:* Explain the "coordinate marker" idea. Differentiate between *archive* (history) and *map* (navigation).
      *   *Addressing the Tension:* Acknowledge the fear of erasure. Validate it without conceding the point.
      *   *Conclusion:* Call to action for the workshop. Focus on the *new* map, not just the old one.

      *Drafting - Tone Check:* Keep sentences relatively simple. Avoid jargon unless explained immediately. Use "I" statements. Admit uncertainty.
      *Drafting - Length Check:* 5 minutes is roughly 750 words. Need to keep it tight.

  4.  **Critiquing the "Reference Frame" Framing:**
      *   *Strengths:* It depersonalizes the conflict. It treats history as dynamic. It fits the speaker's background.
      *   *Weaknesses/Risks:* It might feel too cold/technical. It assumes history is navigable like space. It might ignore the *harm* caused by the original marker (a statue isn't neutral).
      *   *What would change my mind?* If the statue represents active oppression rather than just a "viewpoint." If the community needs *justice* more than *navigation*.

  5.  **Critiquing the Speech Structure:**
      *   *Failure Point 1:* The transition from science to civics might feel forced.
      *   *Failure Point 2:* The "neutral observer" stance might annoy activists who want moral clarity.
      *   *Failure Point 3:* It might be too abstract for neighbors just worried about property values or tradition.

  6.  **Refining the Output:**
      *   *Speech:* Ensure the voice sounds like a scientist (precise, observational, slightly humble about the new field).
      *   *Analysis:* Be honest and critical. Don't just praise the idea.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a philosopher. The prompt says "genuinely new to this debate." So, avoid terms like "phenomenology" or "hegemony." Stick to "maps," "coordinates," "data."
      *(Self-Correction on Critique)*: The prompt asks "what would change *your* mind about using this framing." I need to answer as the AI assistant evaluating the strategy, not the speaker.

  7.  **Final Polish:** Check word count. Ensure the "reference frame" analogy lands clearly. Make sure the ending invites work, not just applause.

      *Word Count Check:* A 5-minute speech is usually around 650-750 words. I will aim for that range.
      *Tone Check:* "Old lab mates" implies a certain camaraderie. "Neighbors" implies local stakes. "Philosophy people" implies intellectual rigor. The speech needs to bridge these.

      *Let's write.* (Mental outline: Hello -> My background -> The Map Analogy -> The Fear of Erasure -> The Task Ahead -> Thank you).

      *Critique Section:* Needs to be distinct from the speech. Clear headings.

  8.  **Final Review against constraints:** No bibliography? Check. 5 minutes? Check. Specific critique questions answered? Check.

      *(One last thought on the "Reference Frame" idea)*: It's a strong metaphor, but in physics, changing reference frames doesn't change the laws of physics. In history, changing the narrative *does* change the social reality. I should highlight this nuance in the critique.

