  I was in a study group for my political philosphy course and someone threw out Nozick's entitlement slogan — the one about holdings coming from each as they choose and going to each as they are chosen, the kind of line people tie straight to the Wilt Chamberlain argument — like it automatically kills every patterned theory of justice. They said it proves liberty always wrecks equality, so Rawls-style distributions are impossible without constant coercion. I feel like the phrase is hiding a bunch of different claims, so could you lay out the precise readings it could actually be expressing? Give me the menu: maybe a purely descriptive claim about voluntary exchange dynamics; a normative principle that any uncoerced transfer creates legitimate entitlement; a claim that background conditions don't matter once exchange is free; or something about personal desert being tied to market outcomes. For each reading, say whether it's trivial, substantive but defensible, false, or circular, and specifically whether it actually supports the conclusion that patterned justice is illegitimate.

