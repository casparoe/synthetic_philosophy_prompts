answer: |-
  ### The Construction

  Let the metric signature be defined by the interval $s^2 = \Delta t^2 - \Delta x^2$ (with $c=1$). Under this convention, $s^2 > 0$ indicates timelike separation, and $s^2 < 0$ indicates spacelike separation.

  We define an observer $O$ at rest at spatial coordinate $x=0$. We construct three events $a, b, c$ with coordinates $(t, x)$ as follows:

  1.  **Event $a$ (Observer's Now):** $(0, 0)$
  2.  **Event $c$ (Observer's Past):** $(-2, 0)$
  3.  **Event $b$ (The Bridge):** $(-1, 2)$

  **Verification of Intervals:**

  *   **Interval $a \to b$:**
      $\Delta t = -1 - 0 = -1$
      $\Delta x = 2 - 0 = 2$
      $s^2_{ab} = (-1)^2 - (2)^2 = 1 - 4 = \mathbf{-3}$
      **Result:** Spacelike separation. ($b$ can be simultaneous with $a$ in some moving frame).

  *   **Interval $b \to c$:**
      $\Delta t = -2 - (-1) = -1$
      $\Delta x = 0 - 2 = -2$
      $s^2_{bc} = (-1)^2 - (-2)^2 = 1 - 4 = \mathbf{-3}$
      **Result:** Spacelike separation. ($c$ can be simultaneous with $b$ in some *other* moving frame).

  *   **Interval $a \to c$:**
      $\Delta t = -2 - 0 = -2$
      $\Delta x = 0 - 0 = 0$
      $s^2_{ac} = (-2)^2 - 0^2 = \mathbf{4}$
      **Result:** Timelike separation. ($c$ is unambiguously in the past of $a$ for observer $O$; they can never be simultaneous).

  ***

  ### (a) The Engine of the Argument

  The Rietdijk–Putnam argument uses this geometric non-transitivity to construct a chain of ontological commitment.

  1.  **Link 1:** For observer $O$, event $a$ is "now." If presentism holds, $a$ is real. Because $a$ and $b$ are spacelike separated, there exists a valid inertial frame $O'$ moving relative to $O$ in which $a$ and $b$ are simultaneous. If $a$ is real, and simultaneity defines the extent of the present, then $b$ must also be real (present) for $O'$.
  2.  **Link 2:** Because $b$ and $c$ are spacelike separated, there exists a *third* inertial frame $O''$ in which $b$ and $c$ are simultaneous. If $b$ is real (established in Link 1), then $c$ must also be real (present) for $O''$.
  3.  **The Dissolution:** By chaining these frame-dependent "nows," the argument connects $a$ (the at-rest observer's present) to $c$ (the at-rest observer's past). If "being real" or "being present" is a physical property that does not depend on which frame you use to assess it, then the reality of $a$ transfers to $b$, and the reality of $b$ transfers to $c$. Consequently, $c$ must be just as real as $a$. Since $c$ is in $O$'s past, the past is real. Since the choice of $c$ was arbitrary along the past light cone, the entire timeline is equally real. The moving "present" dissolves into the static Block Universe.

  ### (b) The Presentist's Objection

  The Presentist uses the exact same geometric configuration to block the conclusion. They argue that the Rietdijk–Putnam argument commits a fallacy of composition regarding the relation of simultaneity.

  The geometry proves that spacelike separation is not transitive: just because $a$ can be simultaneous with $b$, and $b$ with $c$, does not mean $a$ can be simultaneous with $c$ (indeed, $s^2_{ac} > 0$ proves they cannot). The Presentist argues that "presentness" inherits this non-transitivity.

  *   $a$ is present *relative to frame* $O$.
  *   $b$ is present *relative to frame* $O'$.
  *   $c$ is present *relative to frame* $O''$.

  The chain of simultaneities is not itself a simultaneity. There is no single frame in which $a, b,$ and $c$ are all present. Therefore, there is no single "Now" that contains both $a$ and $c$. The fact that $b$ serves as a geometric bridge does not force an ontological identification between $a$ and $c$. The "present" is a slice of spacetime, not a volume filled by chaining slices together. To claim $c$ is real because it is simultaneous with $b$ (which is simultaneous with $a$) is to treat "simultaneous with" as a transitive relation across frames, which the geometry explicitly forbids.

  ***

  ### The Crucial Premise

  The single premise that does the work is **the Transitivity of Co-reality (or Frame-Invariance of Presentness).**

  This is the claim that if event $x$ is co-real with event $y$ in frame $F_1$, and $y$ is co-real with $z$ in frame $F_2$, then $x$ is co-real with $z$ regardless of frame. It assumes "is real" is a monadic property ($Real(x)$) rather than a dyadic relation ($Real(x, F)$).

  **If this premise is removed:**
  The argument collapses immediately. Without the transitivity of reality across frames, the chain is broken at every link. $a$ is real-for-$O$, $b$ is real-for-$O'$, and $c$ is real-for-$O''$. There is no contradiction in $a$ being present-for-$O$ while $c$ is past-for-$O$, because "present" no longer denotes a universal ontological status.

  **Can a Presentist defuse the argument?**
  Yes, by adopting **Relativized Presentism**. A presentist can maintain that existence is frame-indexed: an event exists *relative to* a specific observer's worldline at a specific proper time. This accepts the geometric fact (non-transitivity of spacelike separation) and rejects the philosophical premise (transitivity of reality).

  However, this comes at a cost. It saves Presentism from Special Relativity, but it abandons the intuition of a universal, public "Now." It implies that what exists for you depends on your state of motion relative to me. While logically consistent, many argue this "solipsism of the present moment" surrenders the core metaphysical motivation of presentism, leaving a view that is structurally indistinguishable from the Block Universe, merely labeled differently.
