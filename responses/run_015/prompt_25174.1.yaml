answer: |-
  This is an excellent question that cuts to the heart of how evolutionary theory is defined. You have identified a logical tension, but the resolution lies in distinguishing between **Evolutionary Theory** (the broad framework) and **Adaptationism** (a specific research strategy within that framework).

  Your confusion stems from a premise that Gould and Lewontin would reject: the idea that if a trait isn't a direct product of selection, it lacks an evolutionary explanation.

  Here is the breakdown of why spandrels are not "accidents outside of theory," followed by the consensus/dispute flags you requested.

  ### 1. The Core Correction: Explanation vs. Adaptation
  Your premise is: *If natural selection is the only mechanism producing fit, and spandrels aren't selected, they have no evolutionary explanation.*

  The correction is: **Spandrels have an evolutionary explanation; it is just not a *selectionist* explanation for that specific trait.**

  In the architectural analogy, the spandrel (the triangular space between arches) is not there because an architect selected it for its beauty. It is there because the architect selected the arches for structural support, and the laws of geometry *necessitate* that spandrels exist where arches meet.

  In biology, a "spandrel" is explained by:
  1.  **Selection acting on a correlated trait:** Selection built the "arches" (e.g., a specific jaw structure).
  2.  **Constraints:** Physical, developmental, or phylogenetic constraints dictated that if you have the arches, you *must* have the spandrels (e.g., the male nipple is a byproduct of the developmental pathway required to make female nipples).

  Therefore, spandrels are not "outside evolutionary theory." They are fully explicable within evolutionary theory, provided the theory includes **constraints, development, and correlation**, not just optimization by selection. Gould and Lewontin argued that evolutionary theory had become too narrow (equating "evolutionary explanation" with "adaptive story"), and they wanted to broaden it back out.

  ### 2. The "Fit" Misconception
  You also wrote: *"Natural selection is the only evolutionary mechanism that produces fit between organism and environment."*

  This is mostly true regarding the *origin* of complex fit. However, spandrels complicate the "fit" narrative in two ways that keep them inside evolutionary theory:
  *   **Neutrality:** Many spandrels are not "fit" nor "unfit"; they are neutral. They persist because selection doesn't remove them (drift). Evolutionary theory explains the persistence of neutral traits via Population Genetics (drift), not just selection.
  *   **Exaptation:** A spandrel can later be co-opted for a function (becoming an adaptation). The trait originated as a byproduct, but later contributed to fit. This is a purely evolutionary explanation (exaptation) that requires the spandrel concept to make sense.

  ### 3. Consensus vs. Live Disputes
  You asked to flag what is settled and what is disputed. The legacy of the "Spandrels" paper is that it successfully killed "Naive Adaptationism," but the degree to which biology should be pluralistic is still debated.

  #### **Settled Consensus**
  *   **Adaptationism is not universal:** It is now consensus that not every trait is an adaptation. Biologists generally accept that byproducts, constraints, and drift exist and must be considered. You will rarely find a modern peer-reviewed paper that assumes *a priori* that every trait is optimal.
  *   **Constraints are real:** Developmental and physical constraints are accepted as legitimate evolutionary explanations. You cannot explain the number of vertebrae in a giraffe's neck solely by "optimal feeding height"; you must acknowledge the mammalian developmental constraint.
  *   **Exaptation is a valid category:** The distinction between a trait's origin (byproduct) and its current utility (function) is standard terminology.
  *   **Evolutionary Theory > Adaptationism:** It is consensus that "Evolutionary Theory" encompasses selection, drift, constraint, and phylogeny. Claiming a trait is a spandrel is making an evolutionary claim, not abandoning evolutionary theory.

  #### **Live Disputes (Factional/Active Debate)**
  *   **The "Null Hypothesis" Heuristic:** This is the biggest methodological fight.
      *   *Side A (Adaptationists/Behavioral Ecologists):* Argues that because selection is the only process that creates complex design, the default working hypothesis for any complex trait should be that it is an adaptation. We should only reject this if evidence forces us to.
      *   *Side B (Pluralists/EES proponents):* Argues that assuming adaptation first leads to "just-so stories." They argue the null hypothesis should be neutrality or developmental constraint, and adaptation must be rigorously proven.
  *   **The Frequency of Spandrels:** Everyone agrees spandrels exist; no one agrees on how *common* they are.
      *   Some argue that while spandrels exist, the "important" traits (those regarding survival and reproduction) are overwhelmingly adaptations.
      *   Others argue that much of the genome and morphology is "junk" or byproduct, and we overestimate the role of selection.
  *   **The Extended Evolutionary Synthesis (EES):** This is the modern echo of the Spandrels paper.
      *   *Standard View:* Developmental constraints are important, but they are ultimately shaped by past selection.
      *   *EES View:* Developmental processes can *drive* evolution independently of selection (structuralism). This is a live, heated dispute about whether Gould and Lewontin didn't go far enough.

  ### Summary for your piece
  If you present the view that "Spandrels are outside evolutionary theory," you will be presenting a view that **no serious biologist holds today.**

  The accurate framing is: **The Spandrels paper argued that Adaptationism was being mistaken for Evolutionary Theory.** Gould and Lewontin weren't saying these traits were unexplainable; they were saying they were explainable by *different parts* of evolutionary theory (development, physics, correlation) that had been neglected.

  The concession biologists made was not that "evolution can't explain this," but rather that "selection isn't the only tool in the evolutionary toolbox." Most biologists accept this today, though they disagree on how often to reach for the non-selectionist tools.
