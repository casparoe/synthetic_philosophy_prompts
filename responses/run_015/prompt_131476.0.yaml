          4.  Address the risk of unfalsifiability (theoretical richness vs. insulation).

  2.  **Deconstruct the Claim:**
      *   *Core Claim:* Political values are embedded/enacted throughout the technological lifecycle (design, maintenance, decay), not just at the design stage.
      *   *Examples given:* Turbine maintenance labor contracts, dam sediment management, rust/corrosion leading to decommissioning.
      *   *Implicit Theoretical Alignment:* This aligns with "Politics of Things" (Winner), "Social Construction of Technology" (SCOT), "Actor-Network Theory" (ANT), and more recent work on "infrastructure studies" (Bowker, Star) and "maintenance studies" (Jackson, Graham).

  3.  **Brainstorming Defeaters (Challenges):**
      *   *Conceptual:* Does "politics" become too broad? If everything is political, nothing is. (The Unfalsifiability Problem).
      *   *Agency:* Does this erase human agency? If rust is political, who is responsible? (The Dilution of Responsibility Problem).
      *   *Empirical:* Are there cases where maintenance is genuinely neutral or random? (The Stochastic Decay Problem).
      *   *Temporal:* Does extending politics to decay make it impossible to trace intent or governance? (The Traceability Problem).
      *   *Alternative Explanations:* Can economic or physical constraints explain these outcomes better than "politics"? (The Reductionism Problem).

  4.  **Developing the Ranked List (Fatal to Awkward):**

      *   *Fatal 1: The "Politics" Inflation (Unfalsifiability).* If corrosion is political, what isn't? If the term loses discriminative power, the theory collapses. This is the biggest philosophical risk.
      *   *Fatal 2: The Agency/Responsibility Vacuum.* If politics is distributed across rust and contracts, holding specific actors accountable becomes impossible. STS often gets critiqued for this, but if the claim makes it *worse*, it's a problem for normative STS.
      *   *Serious 1: The Physical Determinism Counter.* Some decay is purely thermodynamic. Claiming politics in entropy might be category error.
      *   *Serious 2: The Discontinuity Problem.* Design is discrete (decisions made); maintenance is continuous/reactive. Conflating them might obscure how power actually works (intentionality vs. emergence).
      *   *Awkward 1: The Empirical Tracing Burden.* It's really hard to prove the politics of rust. Makes research impractical.
      *   *Awkward 2: The "Broken Window" Variance.* Different communities maintain things differently. Is the politics in the artifact or the surrounding society? (Reflection vs. Embedding).

  5.  **Refining the Arguments (STS Specifics):**
      *   Need to reference relevant scholars. Winner is the starting point. But for maintenance, think Stephen Graham ("The City is Breaking Down"), Steve Jackson ("Rupture"), Carse ("Beyond the Visible").
      *   Need to address the "intentionality" debate. Winner implies intentionality (Moses and the bridges). Maintenance is often non-intentional neglect. Is neglect political? Yes (Agamben?), but is it *in the artifact*?
      *   Need to tackle the "Material Agency" vs. "Human Agency" tension.

