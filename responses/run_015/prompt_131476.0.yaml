      *   **Topic:** The politics of technological artifacts extending beyond design into maintenance, upkeep, and decay/failure (lifecycle politics).
      *   **Goal:** Stress-test this expanded view. They want *genuine* defeaters, not strawmen (like "hammers are neutral").
      *   **Specific Tasks:**
          1.  Identify empirical findings or conceptual distinctions that would challenge the view.
          2.  Distinguish between fatal defeaters and those that can be absorbed/narrowed.
