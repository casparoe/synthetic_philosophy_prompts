      *   Let's set up the numbers.
      *   $P(Sick) = 0.5$.
      *   Action: Live Life. (Only one real physical action, but the "mental action" varies).
      *   Let's simplify: The choice is *Get Info* vs. *Don't Get Info*.
      *   If *Don't Get Info*:
          *   Sick: Utility = 10 (Hopeful).
          *   Healthy: Utility = 10 (Normal).
          *   Expected Utility = 10.
      *   If *Get Info*:
          *   Signal reveals truth perfectly.
          *   If Healthy: Utility = 10.
          *   If Sick: Utility = 0 (Despair).
          *   Expected Utility = $0.5(10) + 0.5(0) = 5$.
      *   Result: $10 > 5$. Rational to decline info.

  7.  **Identifying the Violated Assumption:**
      *   Good's Theorem Proof Sketch: $EU(\text{with info}) = \sum P(m) \max_a \sum P(s|m) U(a,s)$. $EU(\text{without}) = \max_a \sum P(s) U(a,s)$.
      *   The inequality holds because $\max_a \sum P(s|m) U(a,s) \ge \sum P(s|m) U(a^*, s)$ where $a^*$ is the optimal action without info.
      *   This relies on $U(a,s)$ being the *same* regardless of whether you observed $m$.
      *   In my example, $U$ changes depending on whether $m$ was observed. Specifically, $U_{\text{sick, known}} < U_{\text{sick, unknown}}$.
      *   **The Assumption:** The utility function must depend *only* on the final state of the world and the action taken, **not on the agent's knowledge or belief state**. (Sometimes called the "consequentialist" assumption or "state-independent utility regarding information").

  8.  **Refining the Argument:**
