      *   **Nuance:** Mention that one *could* model the distress as a "cost," but that misses the point that the *value of the state itself* changes upon knowledge. The deeper violation is the **Consequentialist Assumption** (outcomes are physical, not epistemic).
      *   **Secondary Violation (Optional but helpful):** The assumption that the agent can effectively "ignore" the information when choosing actions. If knowledge intrinsically alters the experience of the outcome, you can't ignore it.

  10. **Refining the "Assumption" Label:**
      *   Standard literature (e.g., Resnik, 1987; Skyrms) identifies the key assumption as **"State-Independent Utility"** or that **"Utility is defined over consequences, not information."**
      *   Another way to put it: Good's theorem assumes **Information is purely instrumental.** It has no intrinsic value (positive or negative).
