      *   **Outcomes:**
          *   If Healthy: Live normal life.
          *   If Sick: Die soon.
          *   Crucial twist: If Sick + Know: Suffer psychological distress (lower utility) before dying. If Sick + Don't Know: Live remaining time in hopeful ignorance (higher utility).
      *   **Cure:** Explicitly state there is *no treatment*. This removes the instrumental value of the info.

  6.  **Formalizing the Utility Function:**
      *   Good's Theorem assumes $U(a, s)$.
      *   We need $U(a, s, I)$ where $I$ is the information state.
