  2.  **Recall/Verify Good's Theorem:**
      *   **What does it say?** In a Bayesian decision framework, the expected utility of making a decision *after* observing a free, relevant signal is always greater than or equal to the expected utility of making the decision *without* the signal.
      *   **Key Assumptions:**
          1.  **Costless Information:** The signal itself has no direct cost (monetary, time, psychological).
          2.  **Freedom of Action:** The agent can choose *any* action available in the no-information case after seeing the signal. (You aren't forced to act on the information).
          3.  **Utility depends only on State and Action:** $U(a, s)$. It does *not* depend on the signal itself or the fact that you know the state.
          4.  **Bayesian Rationality:** The agent updates beliefs correctly and maximizes expected utility.
          5.  **No Commitment Problems:** The agent doesn't wish they could pre-commit to ignoring the info.

  3.  **Brainstorming Counter-Examples (Violations of Assumptions):**
      *   *Costly Information:* Easy, but trivial. If a test costs \$1M, don't take it. The friend would say "Good's theorem assumes free info." I need something deeper where the "cost" isn't just monetary but structural to the utility function.
      *   *Utility depends on Knowledge (Ostrich Effect):* If knowing the truth hurts you emotionally (e.g., terminal diagnosis), then $U(a, s, k)$ where $k$ is knowledge. Good's theorem assumes $U(a, s)$. This is a strong candidate.
      *   *Strategic/Commitment Issues (Game Theory):* If knowing something forces your hand in a negotiation, or if an opponent knows you know. (e.g., Parfit's Hitchhiker, or simply being unable to bluff).
      *   *Non-Instrumental Value of Beliefs:* Some people value hope over accuracy.

  4.  **Selecting the Best Example:**
      *   The "Medical Diagnosis" example is the classic intuitive case (the "Ostrich Problem").
      *   *Scenario:* A patient suspects a terminal illness. There is no cure. Knowing confirms the state, but reduces quality of life due to anxiety/depression during the remaining time.
      *   *Why it fits:* It directly challenges the assumption that Utility depends *only* on the physical state and action. Here, Utility depends on the *belief state* or the *knowledge* itself.
      *   *Alternative:* A commitment problem (e.g., Newcomb's Problem or a negotiation). But the medical one is more relatable to the friend's specific claim about "declining a test or diagnosis."
      *   *Decision:* Let's use the **Terminal Diagnosis with No Cure** scenario. It's concrete, fully specifiable, and directly addresses the friend's claim about medical tests.

  5.  **Drafting the Decision Problem:**
      *   **States:** Sick (Terminal) vs. Healthy.
