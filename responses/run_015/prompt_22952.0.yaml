answer: |-
  Your friend is correct that Good's Theorem (1967) is mathematically valid, but like all theorems, it is only as strong as its axioms. The theorem proves that **instrumental** information (information used to update beliefs to choose better actions) has non-negative expected value *provided that utility depends only on the physical state of the world and the action taken.*

  Here is a concrete decision problem where a rational agent declines free information, followed by the precise identification of the violated assumption.

  ### The Decision Problem: The Incurable Diagnosis

  **Context:**
  An agent is experiencing vague symptoms. She suspects she might have a rare, terminal condition (*State S*) or be healthy (*State H*). There is no cure and no treatment for the condition; knowing the diagnosis changes nothing about her physical lifespan or medical options. However, knowing she is terminally ill causes severe psychological distress that ruins her remaining quality of life, whereas remaining ignorant allows her to live her remaining time in hope.

  **Specification:**

  1.  **States of the World ($s$):**
      *   $H$: Healthy (Probability $P(H) = 0.5$)
      *   $S$: Sick/Terminal (Probability $P(S) = 0.5$)

  2.  **Actions ($a$):**
      *   $T$: Take the Test (Acquire Information)
      *   $N$: Do Not Take the Test (Decline Information)
      *   *Note: After the state is realized (or revealed), the only physical action available is "Live Life." The decision is purely about information acquisition.*

  3.  **Signal Structure:**
      *   The test is perfectly accurate.
      *   If $T$ is chosen, the agent learns the true state with probability 1.
      *   If $N$ is chosen, the agent receives no signal.

  4.  **Utility Function ($U$):**
      *   Good's Theorem assumes utility is defined over $(a, s)$.
      *   In this scenario, utility is defined over $(a, s, \text{knowledge})$.
      *   **If Agent Chooses $N$ (Ignorance):**
          *   $U(N, H) = 100$ (Normal life)
          *   $U(N, S) = 80$ (Short life, but lived in hopeful ignorance)
      *   **If Agent Chooses $T$ (Knowledge):**
          *   $U(T, H) = 100$ (Normal life, relief)
          *   $U(T, S) = 0$ (Short life, ruined by despair upon knowing)

  **Calculation of Expected Utility:**

  *   **Expected Utility of Declining Info ($N$):**
      $$EU(N) = 0.5 \times U(N, H) + 0.5 \times U(N, S)$$
      $$EU(N) = 0.5(100) + 0.5(80) = 50 + 40 = \mathbf{90}$$

  *   **Expected Utility of Acquiring Info ($T$):**
      (Since the test is perfect, upon taking it, she maximizes utility given the known state. But here, the physical action is the same; only the utility value changes.)
      $$EU(T) = 0.5 \times U(T, H) + 0.5 \times U(T, S)$$
      $$EU(T) = 0.5(100) + 0.5(0) = 50 + 0 = \mathbf{50}$$

  **Result:**
  $90 > 50$. The rational agent **declines the test**.

  ***

  ### The Violated Assumption

  Your friend's argument fails because Good's Theorem relies on a specific structural assumption about utility that is violated in this case.

  **The Assumption: Utility Independence from Information Sets**
  Good's Theorem assumes that the utility of a specific state-action pair is **invariant** to the agent's information. Formally, it assumes $U(a, s)$ is the same whether or not the agent has observed a signal revealing $s$.

  In the proof of Good's Theorem, the inequality holds because:
  $$E[\max_a U(a, s) \mid \text{info}] \geq \max_a E[U(a, s) \mid \text{info}]$$
  This step assumes that the $U$ inside the expectation on the left (with info) is the **same function** as the $U$ on the right (without info).

  **How it is strained in this case:**
  In the "Incurable Diagnosis" problem, the utility of the state *Sick* is not intrinsic to the physical biology of the agent; it is extrinsic to her **epistemic state**.
  *   State $S$ + Ignorance $\rightarrow$ Utility 80
  *   State $S$ + Knowledge $\rightarrow$ Utility 0

  By acquiring the information, the agent changes the **utility function itself**, not just the probability distribution over states. Good's Theorem treats information as purely *instrumental* (it helps you pick better actions). It assumes information has no *intrinsic* value (positive or negative).

  In this scenario, information has **negative intrinsic value**. Because the theorem assumes information is costless *and* intrinsically neutral, it cannot account for cases where the mere possession of knowledge degrades the value of the outcome, even if the physical action taken remains identical.

  ### Summary for Your Friend
  You can tell your friend: "Good's Theorem proves that information is never worse than ignorance **if** the only thing that matters is the physical outcome and our ability to act on it. It assumes you can know the truth without the truth changing how much you enjoy the outcome. In medical cases involving incurable diseases, the 'outcome' includes your psychological experience of that outcome. Since knowing the diagnosis changes the psychological outcome, the utility function depends on knowledge, violating the theorem's assumption of state-independent utility."
