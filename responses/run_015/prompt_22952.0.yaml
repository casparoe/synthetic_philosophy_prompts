      *   So, the assumption is: **Utility is independent of the information set.** (Or: The agent's utility function is defined solely over physical states and actions, not epistemic states).
      *   Also, related: **The ability to commit to ignoring the signal.** Good's theorem assumes you optimize *after* seeing the signal. If seeing the signal constrains your ability to enjoy the state (even if you take the same physical action), the theorem fails.

