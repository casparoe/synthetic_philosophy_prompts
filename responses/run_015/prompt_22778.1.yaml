      *   *Adjustment:* Need to explicitly mention Quine's criterion of ontological commitment. Quine would likely side with Sam *pragmatically* (posits are useful) but might agree with Ravi that "table" isn't fundamental.
      *   *Check:* Did I address the "circularity" charge?
