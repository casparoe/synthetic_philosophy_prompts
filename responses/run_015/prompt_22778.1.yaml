      *   *Ravi's Claim 3: Sam is circular (using language to prove ontology).*
          *   **Analysis:** Ravi is accusing Sam of begging the question against the skeptic. Sam says "X exists because we say 'table' refers to X." Ravi says "We need to know X exists before 'table' can refer to X."
          *   **Verdict:** Ravi identifies a genuine tension in naive realism, but Sam might appeal to causal theories of reference or natural kinds to break the circle.

  4.  **Determine if it's a "Verbal Dispute" (Technical Sense):**
      *   **Hirsch's Definition:** A dispute is verbal if both parties can agree on the "fundamental facts" (physics, arrangement of particles) but disagree on how to describe them using the contested term.
      *   **Application:** Do Sam and Ravi agree on the physics? Yes (particles arranged table-wise). Do they disagree on the count? Yes (1 vs. Many/Indeterminate).
      *   **Conclusion:** It *looks* like a verbal dispute in Hirsch's sense. However, Sider argues that if "existence" is a joint-carving quantifier, then there is a substantive fact of the matter about which conceptual scheme "carves at the joints."
      *   **Nuance:** If the seminar is reading Quine, they care about "to be is to be the value of a bound variable." Quine would ask: What is the best theory? Does positing "one table" serve the theory better than "thousands of table-ish aggregates"?

