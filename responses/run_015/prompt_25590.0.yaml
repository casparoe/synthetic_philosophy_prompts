  1.  **Shared Definition of the Scenario:** Both parties agree that "Pascal's Mugging" refers to a decision scenario where an agent is presented with a hypothesis $H$ having an extremely low prior probability $P(H)$ and an extremely large utility impact $U(H)$, such that the expected value $E = P(H) \times U(H)$ exceeds the cost of compliance, despite $P(H)$ being vanishingly small.

  2.  **Framework of Rationality:** Both parties agree to frame the discussion within the Bayesian decision-theoretic framework, wherein beliefs update via Bayes' Theorem and actions are chosen to maximize expected utility relative to those beliefs.

  3.  **Definition of Utility:** Both parties agree to define "utility" according to the von Neumann-Morgenstern (VNM) axioms as a representation of preference orderings over lotteries, rather than as a psychological measure of happiness. We agree that the disagreement is not about the definition of utility, but about whether the utility function *must* be bounded to represent a rational agent.

  4.  **Validity in Standard Contexts:** Both parties agree that unbounded expected value (EV) maximization yields correct and intuitive prescriptions in all empirically standard contexts (i.e., where probabilities and utilities remain within orders of magnitude encountered in human history or standard scientific modeling).

  5.  **Goal of Reflective Equilibrium:** Both parties agree that the goal of this collaboration is to achieve reflective equilibrium between formal consistency (avoiding money pumps/Dutch books) and substantive rationality (avoiding absurd action-guidance). We agree that a theory failing either criterion is flawed.

  6.  **Nature of the Disagreement:** Both parties certify that their disagreement is substantive, not verbal. We agree that we are not disputing the mathematics of expectation itself, but rather the domain of applicability of the EV maximization rule and the structural constraints (boundedness vs. unboundedness) required for a coherent decision theory.

  ### Table of Irreconcilable Differences

  | Crux | The Core Disagreement | Position: EV Maximalists (Bite the Bullet) | Position: Anti-Unbounded (Reject the Mugging) | Concrete Test Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Boundedness of Utility** | **Must utility be bounded to ensure stability?** | **No.** Bounded utility functions violate the Continuity and Independence axioms of VNM when comparing lotteries with sufficiently high payoffs. An unbounded utility function is required for formal consistency; accepting "absurd" conclusions is preferable to accepting logical inconsistency (money pumps). | **Yes.** Unbounded utility functions allow infinitesimal probabilities to dominate decision-making, rendering the agent vulnerable to "Pascal's Wager" style exploitation in infinitely many contexts. Boundedness is required for an agent to remain stable and action-guiding. | **Case: The Sequential Trade.**<br>An agent is offered a sequence of trades: pay \$1 for a $1/2^n$ chance at utility $2^n$.<br><br>**EV Prediction:** The rational agent accepts the trade for all $n$, as EV remains constant or grows. Rejecting implies a preference reversal.<br><br>**AU Prediction:** The rational agent rejects trades after a threshold $n^*$. Accepting implies vulnerability to resource exhaustion for no meaningful gain. |
  | **2. Epistemic vs. Decision Constraint** | **Where should the blocking mechanism reside?** | **Epistemic.** The constraint must be on probability assignment, not the decision rule. Modifying EV maximization breaks linearity. If evidence supports $P \times U > Cost$, the agent *must* act. Intuitions against this are heuristic bugs, not features. | **Decision-Theoretic.** Epistemic probabilities cannot be relied upon to converge fast enough for all conceivable hypotheses (e.g., simulation hypotheses). The constraint must be on the utility function or decision rule itself to preserve sanity. | **Case: The Honest Oracle.**<br>A trusted source confirms $P = 10^{-100}$ and $U = 10^{101}$ lives at stake for a \$10 cost.<br><br>**EV Prediction:** The agent pays the \$10. To refuse is to ignore confirmed evidence and violate the maximization rule.<br><br>**AU Prediction:** The agent refuses. The utility function saturates before $10^{101}$ lives. Paying violates the structural constraints of rational agency. |
  | **3. Complexity Penalty Scaling** | **Does algorithmic complexity penalize extraordinary claims sufficiently?** | **No.** Under Solomonoff Induction, probability scales as $2^{-L}$ (where $L$ is program length). Utility can scale as hyperexponential functions of $L$ (e.g., $3 \uparrow\uparrow L$). Therefore, $P \times U$ can diverge to infinity. | **Yes.** Any physically realizable agent has finite computational complexity. Claims requiring hypothesis spaces larger than the agent's own complexity are assigned $P=0$ or treated as meaningless noise prior to utility calculation. | **Case: The Tower of Exponents.**<br>A claim specifies utility $3 \uparrow\uparrow n$ with probability $2^{-n}$.<br><br>**EV Prediction:** As $n \to \infty$, $EV \to \infty$. The agent must prioritize this hypothesis over all certain finite outcomes.<br><br>**AU Prediction:** At some $n^*$, the claim exceeds the agent's epistemic horizon. The agent treats the probability as effectively zero regardless of the mathematical formulation. |
