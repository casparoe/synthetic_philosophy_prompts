answer: |-
  Your tentative principle fails because "in-principle replaceability" is too weak a filter. A god's-eye view could reduce "spirit of the age" to individual imitations, just as it could reduce "street layout" to atomic positions. If replaceability is the only test, you cannot distinguish mysticism (7) from affordance (3). The difference is not whether a micro-story *exists*, but whether the social fact exerts **counterfactual leverage** independent of the specific psychological states of the individuals currently instantiating it.

  Here is the repaired account: **The Principle of Structural Autonomy.**

  A social-level fact $S$ legitimately explains individual action $A$ if and only if $S$ satisfies at least one of the following clauses, without violating the Prohibition on Redescription.

  **Clause 1: The Constraint Clause.** $S$ is legitimate if it physically or institutionally restricts the action-space available to individuals, regardless of their beliefs.
  *   **Motivating Case:** (3) Street-network layout. The grid does not change beliefs; it removes the option of walking. The explanation holds even if every resident desires to walk.
  *   **Trade-off:** This reclassifies (3) from a "social" explanation to a "material constraint" explanation. It is valid, but not distinctively social.

  **Clause 2: The Coordination Clause.** $S$ is legitimate if it functions as a public focal point where individual rationality depends on the mutual knowledge of $S$, creating a feedback loop that stabilizes behavior.
  *   **Motivating Case:** (8) Tracked variables. The index causes the investment drop not because of its intrinsic value, but because it is *known to be watched*. The social fact (the index's status) creates the equilibrium.
  *   **Verdict on (9):** **Allowed.** The currency collapse is a Coordination Case. The expectation of collapse is a social fact because it is an equilibrium sustained by mutual expectation. It is not mysticism because the aggregate expectation constrains the individual: if you alone expect stability, you still lose your savings. The social fact (the run) has causal power over the individual.

  **Clause 3: The Persistence Clause.** $S$ is legitimate if it denotes a relational property that persists across the turnover of individual members and causally impacts new entrants.
  *   **Motivating Case:** (4) Durkheimian integration. You do not need to identify the specific despairing individuals. If the *structure of relations* (density, frequency of contact) remains constant while individuals are replaced, and the suicide rate remains constant, the social fact (integration) is doing the work.
  *   **Trade-off:** This saves (4) but denies your hope for a psychological mechanism. The mechanism is structural, not psychological. If you insist integration must work *through* individual despair, you cannot use this clause.

  **Clause 4: The Selection Clause.** Functional explanations (S exists because it does F) are legitimate only if a causal selection mechanism is specified.
  *   **Motivating Case:** (5) vs (6). Hearts are explained by natural selection (specified mechanism). Punishment systems explained by "solidarity" are rejected because no mechanism (conquest, replacement, learning) is supplied.
  *   **Verdict:** (6) remains illegitimate until you add the selection story you noted.

  **Prohibition on Redescription.** $S$ is illegitimate if it is defined solely as the aggregate of the behavior $A$ it purports to explain, lacking independent counterfactual leverage.
  *   **Motivating Case:** (7) Spirit of the age. If "spirit" is just a label for the sum of individual actions, it is bookkeeping. It fails because changing the "spirit" without changing individuals is impossible; it has no leverage.
  *   **Contrast with (8):** The index in (8) is independent. You can change the index value without changing individual psychologies, and behavior changes. In (7), you cannot change the "spirit" without changing the individuals.

  **Verdicts on New Cases**

  1.  **Network Topology (Small World):** A behavior spreads because the network has a high clustering coefficient with short path lengths. No individual knows the global topology.
      *   **Verdict:** **Allowed (Persistence/Constraint).** The topology is a structural constraint on information flow. It persists across individual turnover. An individual cannot "believe" their way out of a structural hole. It satisfies the Persistence Clause.
  2.  **Institutional Rules (Parliamentary Procedure):** A member speaks only when recognized by the chair.
      *   **Verdict:** **Allowed (Constraint).** The rule is an institutional constraint. It is not merely aggregative; it exists prior to the specific session and constrains the action space.

  **Honest Trade-offs and Misdescriptions**

  I must flag three costs of adopting this principle.

  **1. You must overturn your verdict on (1).**
  You called Schelling's segregation a paradigm where "nothing social-level does any causal work." The Principle of Structural Autonomy disagrees. While the *genesis* of the pattern is micro-level thresholds, the *maintenance* of the segregated city is a structural constraint on new movers. A new household entering the city faces a social fact (the existing segregation) that constrains their choice, independent of their original threshold. The macro-pattern becomes a cause for subsequent actors. If you insist the macro-pattern is *never* causal, you must reject the Persistence Clause, which forces you to reject (4) Durkheim as well. You cannot have (4) without conceding that macro-patterns can become causal constraints.

  **2. You must accept that (4) lacks a psychological mechanism.**
  You said you "cannot produce the mechanism" for Durkheim but want to allow it. This principle allows it, but only by admitting the mechanism is **relational**, not psychological. The cause is the density of the network, not the internal state of the suicidal individual. If your demand for a mechanism is a demand for a *psychological* story (beliefs/desires), this principle cannot save (4). It saves the social explanation by bypassing the individual psyche entirely.

  **3. Misdescription of (3) and (7).**
  You treated (3) Street Layout as an "affordance explanation" akin to social facts. Under this principle, (3) is a **physical constraint**, not a social one. It belongs to the same category as geography, not norms. This matters because physical constraints do not require the "Coordination" or "Persistence" clauses to be valid; they are valid simply by being physical.
  Conversely, you treated (7) "Spirit of the Age" as the same sentence form as (5) and (6). It is not. (5) and (6) are functional claims (X exists *because* it does Y). (7) is often a **dispositional claim** (X did Y *because* of disposition Z). If "Spirit" is a disposition of the group, it fails the Redescription Prohibition unless that disposition is grounded in a Coordination or Persistence fact. Usually, it is not.

  **Summary of the Cost**
  To stop flip-flopping, you must accept that "social-level causation" is real only when the social fact acts as a **constraint** (physical or institutional), a **coordinator** (focal point), or a **persistent structure** (network density). You must abandon the hope that all legitimate explanations reduce to individual psychology (saving (4) and (8) requires this), but you must also abandon the idea that macro-patterns are causally inert in cases like (1). The price of saving Durkheim is admitting that Schelling's macro-pattern is also causal for later actors. If that price is too high, you must revert to your supervisor's methodological individualism and call (4) a placeholder for a future micro-story. But you cannot have (4) as a structural explanation while denying structural causality in (1).
