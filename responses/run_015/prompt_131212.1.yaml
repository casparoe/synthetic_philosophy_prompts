prompt: |-
  I'm a retired microbiologist who only got into philosophy lately, mostly reading about minds and brains in teh evenings. I need a short research proposal for a one-semseter philosophy term paper, maybe 5000 words, and I have a half-formed idea I can't quite frame.

  Here's the gist: functionalists say mental states are just functional roles, so they should be realizable in all sorts of substrates -- silicon, aliens, whatever. But almost every example people use is some kind of artificial brain or computer. I want to push this into weirder territory: could a bacterial biofilm, using quorum sensing and collective chemical signaling, realize an extremely simple mental state like "detecting danger" if we map its signaling network onto a minimal functionalist architecture? Not asking whether bacteria feel pain, but whether the standard arguments for multiple realizability actually cover this kind of distributed, non-neuronal, living system, or whether functionalists secretly rely on assumptions about centralized control and information integration that biofilms violate.

  Turn this into a real proposal: state the precise question, explain why the usual functionalist positions don't already answer it, outline the method (I'd compare quorum-sensing pathway models to a stripped-down functionalist schema, probably over a few months), say what a positive or negative result would actually look like, and be honest about whether this is too ambitious for one semester. Also say what would count as the project failing. No need for citations or reading lists, I'll fill those in myself.

  Please keep the whole thing under 350 words -- one page max. And don't include a bibliography section.
