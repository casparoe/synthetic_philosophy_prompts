answer: |-
  # Handout: Disambiguating *Ex Nihilo Nihil Fit*

  The slogan *ex nihilo nihil fit* (ENNF) is being used to bridge four distinct inferential gaps. However, no single precise reading of the slogan licenses all four steps. Below is a menu of six distinct theses the slogan might express, categorized by your requested axes.

  ### The Menu of Readings

  | Reading | Precise Thesis Statement | Verdict | Licenses Steps (1–4) | Weakest Link |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Causal Regularity**<br>*(Quantifier, Causal, Contingent)* | "In the actual world, no entity begins to exist without a prior efficient cause." | **True but too weak.** Empirical generalization, not metaphysical law. | **1** (Maybe)<br>**2** (No)<br>**3** (No)<br>**4** (No) | **Step 2:** Consistent with a first cause (e.g., God or Big Bang) that itself has no prior cause. Does not entail sempiternity. |
  | **2. Ontological Sterility**<br>*(Name, Causal, Necessary)* | "The state of absolute nothingness is causally inert; no transition from nullity to existence is metaphysically possible." | **Substantive but question-begging.** Reifies 'nothing' as a state with properties. | **1** (Yes)<br>**2** (Yes)<br>**3** (Yes)<br>**4** (No) | **Step 4:** Rules out *coming* from nothing, but allows *being* without explanation. An eternal universe does not 'come from' anything. |
  | **3. Explanatory PSR**<br>*(Quantifier, Explanatory, Necessary)* | "Every positive fact must have a sufficient explanation; 'just being' is not an explanation." | **Substantive & Defensible.** (But this is PSR, not ENNF). | **1** (Yes)<br>**2** (Yes)<br>**3** (No)<br>**4** (Yes) | **Step 3:** Even if something always existed, we can still ask *why* that eternal thing exists rather than nothing. |
  | **4. Default Probability**<br>*(Modal, Probability)* | "Nothingness is the natural default; existence requires a positive selector or cause." | **Substantive but Independent.** A claim about priors, not causation. | **1** (No)<br>**2** (No)<br>**3** (No)<br>**4** (Yes) | **Step 1:** Consistent with a spontaneous quantum fluctuation. Denies the 'default' status, not the causal mechanism. |
  | **5. Transformation Constraint**<br>*(Making vs. Creating)* | "No thing can be *made* (transformed) without pre-existing material, though things may be *created* without it." | **Trivial.** True by definition of 'making'. | **1** (No)<br>**2** (No)<br>**3** (No)<br>**4** (No) | **All Steps:** Explicitly allows creation *ex nihilo*. Cannot be used to rule out a divine creator or brute creation. |
  | **6. Conservation of Being**<br>*(Unoccupied Slot)*<br>*(Name, Ontological, Necessary)* | "The total quantity of being is constant; being cannot increase from zero to positive." | **Substantive but Dubious.** Treats 'being' as a conserved stuff. | **1** (Yes)<br>**2** (Yes)<br>**3** (Yes)<br>**4** (No) | **Step 4:** Like Reading 2, allows the 'stuff' of being to simply *be* eternally without explanation. |

  ### Analysis of the Two Suggestions

  **1. The "Fixed Point" Suggestion**
  *   *Claim:* The empty world is a fixed point because there are no laws/agents within nothingness to trigger a change.
  *   *Verdict:* **Distinct Thesis.** ENNF says nothing *comes* from nothing (output constraint). The Fixed Point thesis says nothing *changes* within nothing (internal mechanism constraint).
  *   *Relation:* The Fixed Point thesis supports Reading 2 (Ontological Sterility) but adds a mechanism. It is vulnerable to the objection that laws of nature might be external to the world (governing even the transition from nullity) or that the transition requires no time/process.

  **2. The "Abstract Objects" Suggestion**
  *   *Claim:* If numbers/abstracta exist necessarily, the empty world is impossible.
  *   *Verdict:* **Distinct Thesis.** This denies the antecedent of the question ("Is 'nothing' possible?") rather than answering it via ENNF.
  *   *Relation:* Logically independent of ENNF. One could accept ENNF but deny abstract objects (Nominalism), or accept abstract objects but deny ENNF (allowing concrete things to pop uncaused). This collapses the question, whereas ENNF attempts to answer it.

  ### Which Reading is "Normal"?
  When group members deploy ENNF confidently, they are typically **equivocating between Reading 1 (Causal Regularity) and Reading 3 (Explanatory PSR).**
  *   They use the intuitive plausibility of Reading 1 (tables don't just appear) to secure Step 1.
  *   They slide into the modal strength of Reading 3 to secure Step 4 (ruling out brute facts).
  *   **The Trap:** Reading 1 is too weak to rule out brute facts; Reading 3 is too controversial to be assumed as a slogan. The argument only works if the audience fails to notice the switch.

  ### Recommendation for Discussion
  Challenge the move from **Step 2 to Step 4**. Even if we grant that something has *always* existed (Step 2), ENNF (on any causal reading) only forbids *coming-to-be* from nothing. It is silent on *being* without explanation. To rule out brute facts, your colleague must defend the Principle of Sufficient Reason (Reading 3), which is a much heavier metaphysical commitment than the ancient slogan provides.
