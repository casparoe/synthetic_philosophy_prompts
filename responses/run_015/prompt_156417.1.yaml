  2.  **Deconstruct the Mathematical Core:**
      *   The core tension is often illustrated via the Chouldechova (2017) or Kleinberg et al. (2016) impossibility theorems.
      *   Condition: Base rates differ between groups ($P(Y=1|A=0) \neq P(Y=1|A=1)$).
      *   Metrics:
          1.  Calibration: $P(Y=1|S=s, A=a) = s$ (or consistent across groups).
          2.  Error Rate Balance (Equal Opportunity/Equalised Odds): TPR and FPR equal across groups.
          3.  Demographic Parity (Equal Selection Rates): $P(\hat{Y}=1|A=0) = P(\hat{Y}=1|A=1)$.
