      *   **Data:** Two groups (Group A and Group B). A risk score (0-100). An outcome (Intervention Needed: Yes/No).
      *   **Constraint 1 (Ranking):** Participants must set a *threshold*. Everyone above the threshold gets the resource. This enforces score ordering.
