      *   This makes the base rate difference obvious (50% vs 20%).
      *   If they pick top 10 scores overall: They might get 8 Red Events and 2 Blue Events.
      *   TPR Red: 8/10 = 80%. TPR Blue: 2/4 = 50%. (Unequal Error Rates).
      *   Selection Rate Red: 10/20 = 50%. Selection Rate Blue: 10/20 = 50%. (Equal Selection Rates).
      *   If they want Equal TPR (say 80%): Red needs top 8. Blue needs top 4 (all positives). To get 80% TPR in Blue, they need to lower threshold.
      *   This works.

  8.  **Structuring the Session (90 mins):**
      *   00-10: Intro & Setup (No theory).
