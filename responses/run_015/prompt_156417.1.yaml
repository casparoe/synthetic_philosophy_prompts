answer: |-
  # Workshop Activity: The Allocation Dilemma

  **Duration:** 90 minutes
  **Participants:** 18 staff (3 tables of 6)
  **Materials:** Printed case packets, calculators, flipchart paper, markers.
  **Facilitator Note:** Do not use terms like *calibration*, *demographic parity*, or *equalised odds* during the activity. Use the plain language provided in the scripts below.

  ---

  ## Part 1: Setup and Materials (10 minutes)

  ### The Scenario
  Tell the participants:
  > "You are a policy team responsible for allocating a limited 'Early Support' package to families. You have a risk-scoring tool that outputs a number between 0 and 100 for each family. Higher scores indicate higher risk of a negative outcome (e.g., school exclusion). You have historical data showing who actually experienced the outcome.
  >
  > Your task is to set a **cut-off threshold**. Any family with a score at or above this threshold gets the support. You must process cases in strict score order: you cannot pick and choose individuals with the same score based on other traits. You must simply draw a line."

  ### The Data Packets
  Prepare three envelopes for each table.
  *   **Envelope 1:** Dataset A (20 Case Cards or a printed sheet).
  *   **Envelope 2:** Dataset B (20 Case Cards or a printed sheet).
  *   **Worksheet:** A simple grid to record Threshold, % Selected, and % 'Hits' (True Positives).

  **Dataset Design (Crucial):**
  The data must be constructed so that Base Rates differ significantly between Group 1 and Group 2.
  *   **Group 1 (10 cases):** 5 'Events' (Outcome = Yes). Scores for Events: 90, 80, 70, 60, 50. Scores for Non-Events: 40, 30, 20, 10, 5. (Base Rate 50%).
  *   **Group 2 (10 cases):** 2 'Events' (Outcome = Yes). Scores for Events: 85, 75. Scores for Non-Events: 65, 55, 45, 35, 25, 15, 5, 5. (Base Rate 20%).
  *   *Note: Ensure the scores overlap. In this design, a score of 75 is an Event in Group 2, but a Non-Event in Group 1 is impossible at that score, yet a score of 50 is an Event in Group 1 but a Non-Event in Group 2.*
  *   *Correction for robustness:* To ensure the impossibility result is sharp, use this verified distribution for the handout:
      *   **Group A:** 20 cases. 10 Events. Event Scores: 95, 90, 85, 80, 75, 70, 65, 60, 55, 50. Non-Event Scores: 45, 40, 35, 30, 25, 20, 15, 10, 5, 0.
      *   **Group B:** 20 cases. 4 Events. Event Scores: 92, 88, 82, 78. Non-Event Scores: 72, 68, 62, 58, 52, 48, 42, 38, 32, 28, 22, 18, 12, 8, 4, 0.
      *   *Why this works:* Group A has a 50% base rate. Group B has a 20% base rate. The scores are well-calibrated (higher scores = higher risk), but the distributions differ.

  ---

  ## Part 2: Round 1 – The Efficiency Mandate (20 minutes)

  **Instruction:**
  > "Open Envelope 1. This is your current caseload.
  >
  > **Mandate 1:** The Director wants to catch as many 'Events' as possible. You must set a threshold that captures at least **80% of the Events** in *both* Group A and Group B.
  >
  > **Rule:** You must apply the *same* score threshold to both groups. You cannot have one threshold for Group A and another for Group B.
  >
  > **Task:** Find the threshold. Record it. Then calculate:
  > 1. What % of Group A did you select?
  > 2. What % of Group B did you select?"

  **Expected Outcome:**
  To catch 80% of Events in Group A (10 events), they must select down to score 55 (8 cases).
  To catch 80% of Events in Group B (4 events), they must select down to score 78 (3 cases is 75%, so they must go lower, perhaps to 72, catching 1 non-event to get 4/4 events).
  *Wait, to make the tension palpable:*
  If they set a single threshold of 55:
  *   Group A: Selects 10 cases (8 Events, 2 Non-Events). TPR = 80%. Selection Rate = 50%.
  *   Group B: Selects 12 cases (4 Events, 8 Non-Events). TPR = 100%. Selection Rate = 60%.
  *   *Observation:* They met the TPR goal, but the Selection Rates are different (50% vs 60%).

  **Facilitator Action:**
  Circulate. Ensure they are using a *single* threshold. If they suggest two thresholds, remind them: "The system is automated; it applies one rule to everyone."

  ---

  ## Part 3: Round 2 – The Equity Mandate (20 minutes)

  **Instruction:**
  > "Keep Dataset 1. The policy has changed. The Auditor says the previous approach was unfair because one group received more support than the other.
  >
  > **Mandate 2:** You must set a threshold so that the **% of people selected is exactly the same** for Group A and Group B (within 5%).
  >
  > **Task:** Find the new threshold. Record it. Then calculate:
  > 1. What % of the 'Events' did you catch in Group A?
  > 2. What % of the 'Events' did you catch in Group B?"

  **Expected Outcome:**
  To equalise selection rates, they will likely have to raise the threshold for Group B or lower it for Group A. But they must use *one* threshold.
  *   If they pick Threshold 75:
      *   Group A: Selects 5 cases (5 Events). Selection Rate = 25%. TPR = 50%.
      *   Group B: Selects 5 cases (4 Events, 1 Non-Event). Selection Rate = 25%. TPR = 100%.
  *   *Observation:* Selection Rates are now equal (25%). But the 'Event Capture' (TPR) is now wildly different (50% vs 100%).

  **Facilitator Action:**
  Ask the tables to compare their Round 1 and Round 2 results on the flipchart.
  *   Column 1: Threshold used.
  *   Column 2: Event Capture (Group A vs B).
  *   Column 3: Selection Rate (Group A vs B).
  *   *Visual:* They will see that fixing Column 3 broke Column 2, and vice versa.

  ---

  ## Part 4: Round 3 – The Deployment Shift (15 minutes)

  **Instruction:**
  > "Open Envelope 2. This is Dataset B. It represents the *same* scoring tool deployed in a neighbouring authority next year. The tool is identical, but the population is slightly different.
  >
  > **Task:** Take the threshold you chose in **Round 1** (The Efficiency Mandate). Apply it to Dataset B.
  >
  > **Calculate:**
  > 1. Did you still catch 80% of the Events in both groups?
  > 2. Did the Selection Rates stay balanced?"

  **Dataset B Design:**
  *   Same score distributions, but Base Rates have shifted slightly (e.g., Group A Base Rate drops to 40%, Group B stays at 20%).
  *   *Result:* The threshold that worked in Round 1 now yields different Error Rates. The trade-off has moved.

  **Expected Outcome:**
  Participants will find that the rule they 'optimised' in Round 1 no longer satisfies the constraints in Dataset B. The tension is not solved; it just shifts.

  ---

  ## Part 5: Debrief and Mapping (25 minutes)

  This is where you introduce the formal concepts. Draw a triangle on the flipchart with three corners.

  ### 1. Mapping the Experience
  Ask the group:
  *   "In Round 1, what were you optimising?" -> **Error Rate Balance (Equal Opportunity).** You wanted to catch the same proportion of risk in both groups.
  *   "In Round 2, what were you optimising?" -> **Demographic Parity.** You wanted to distribute the resource equally across groups.
  *   "What happened when you tried to do both?" -> **Impossibility.** You could not satisfy both with a single threshold.

  ### 2. The Third Corner: Calibration
  Ask:
  *   "Did the scores mean the same thing in both groups? If I pick a person with score 80 from Group A and score 80 from Group B, are they equally likely to be an Event?"
  *   In your constructed data, ensure the answer is *roughly* yes (the score is predictive).
  *   **Concept:** This is **Calibration**.
  *   **The Theorem:** Explain that when Base Rates differ (which they did: 50% vs 20%), you can have Calibration, or Error Rate Balance, or Demographic Parity. **You cannot have all three.**

  ### 3. The "Different Population" Insight
  Refer to Round 3.
  *   "Why did your Rule break in the new authority?"
  *   **Point:** The trade-off is not just about where you draw the line (the threshold); it is attached to the score distribution and the base rates themselves. Even a 'perfect' model cannot escape this mathematics.

  ### 4. Closing the Loop
  > "You have just rediscovered a formal mathematical proof (Chouldechova, 2017; Kleinberg et al., 2016). This is not a bug in your code. It is a property of statistics. When you commission these tools, you are not choosing between 'fair' and 'unfair'. You are choosing *which* fairness metric to prioritise, knowing that satisfying one will violate another."

  ---

  ## Anticipated Pitfalls & Mitigation

  **1. "Can't we just use two thresholds?"**
  *   *Risk:* Participants will suggest treating groups differently to solve the math.
  *   *Mitigation:* The rules explicitly forbid this ("The system is automated... one rule"). In the debrief, acknowledge that *group-aware* thresholds are a legal/policy choice, but note that this often conflicts with "blind" fairness legal frameworks. The exercise forces the "blind" constraint to reveal the mathematical tension.

  **2. "The data is biased, that's why this is happening."**
  *   *Risk:* Participants dismiss the result as an artefact of bad data collection.
  *   *Mitigation:* In the debrief, state clearly: "Even if the data were perfectly measured, and the model were perfectly calibrated, if the *real-world base rates* differ, this tension exists. It is not measurement error; it is base rate mathematics."

  **3. Arithmetic Bottlenecks.**
  *   *Risk:* 90 minutes is tight. Calculating percentages by hand slows things down.
  *   *Mitigation:* Provide calculators. Pre-print the data with checkboxes so they can simply count ticks. Keep N small (20 per group is sufficient for the statistical effect without the tedium).

  **4. Searching for the "Right" Answer.**
  *   *Risk:* Data scientists are trained to optimise. They will feel frustrated that there is no solution.
  *   *Mitigation:* Validate the frustration. "The discomfort you feel is the point. In practice, this is a political decision, not a statistical one. The model cannot make this choice for you."

  ---

  ## Limitations of the Exercise (Facilitator's Note)

  You must explicitly state what this exercise *does not* cover during the debrief. Do not let them leave thinking this is the whole story.

  1.  **It ignores Cost Asymmetry:** The exercise treats False Positives and False Negatives as abstract numbers. In reality, denying support to a high-risk family (False Negative) may be far costlier than offering support to a low-risk family (False Positive). The "optimal" threshold depends on these costs, which are ethical, not statistical.
  2.  **It assumes Static Base Rates:** The exercise treats base rates as fixed facts. In reality, base rates are often the result of historical policy decisions. Changing the allocation rule might *change* the base rates over time (performative prediction).
  3.  **It simplifies 'Groups':** We used two distinct groups (A and B). Real populations are intersectional. A rule that balances Group A and B might fail catastrophically for the intersection of Group A and Subgroup C.
  4.  **It implies the Score is Fixed:** The exercise takes the score as given. In practice, one response to these impossibility results is to improve the model features to reduce the base rate disparity or improve calibration, though the mathematical tension usually remains to some degree.

  **Final Closing Statement:**
  > "This activity shows that fairness is not a property you can 'check' in a model. It is a constraint you must choose. Your job as commissioners is not to find the model that satisfies all criteria—that model does not exist. Your job is to decide which criterion your policy can afford to violate."
