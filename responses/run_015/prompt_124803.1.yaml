answer: |-
  Good evening, everyone. For those who don't know me, I'm one of the many students who survived his methods seminar. And for those who do know me, you know I didn't volunteer for this. He told me that if he's being forced out, he at least wants a captive audience. I suppose after forty years of demanding rigorous assumptions, he deserves one relaxed evening where the only thing we're testing is the quality of the wine.

  Most of you know him as a husband, a father, a brother, and a grandfather. The other half of this room knows him as a defender of the "F-twist." For the family: this was his favorite idea in economics. It says that a theory doesn't need realistic assumptions to be good. It just needs to predict well. In fact, he believed the most important theories often rely on assumptions that are wildly unrealistic.

  He loved to quote a line from an old article on business cycles that said, "economic phenomena are varied and complex, so any comprehensive theory of the business cycle that can apply closely to reality must be very complicated." He thought that was nonsense. He spent his life proving that you don't need to map every tree to navigate the forest. You need a simple map that gets you where you're going.

  But he didn't just apply this to economies. He applied it to people. He believed that a person's self-conception could be an "as-if" model. You assume you are capable, you assume you are steady, you assume you are fine. And as long as that assumption gets you out of bed and treating people well, it isn't a lie. It's scaffolding.

  I've had the privilege of driving him to appointments and cleaning out his office these past few months. I've watched him use this philosophy to stay himself while his short-term memory got weird. He'd forget where he parked, then explain that the domain had just shifted. He'd get turned around walking back from the mailbox and laugh, saying his assumptions about navigation were unrealistic now, but to "check the predictions."

  And this brings me to the hard part, the part that matters for everyone in this room.

  He taught us a distinction in his seminar: the difference between "as-if scaffolding" and "model idolatry." Scaffolding is a deliberately false assumption you keep only as long as it pays for itself. You drop it the moment it stops working. Idolatry is keeping the assumption after the predictions break, because you've fallen in love with the story.

  For forty years, his model worked brilliantly. It predicted tenure, it predicted publications, it predicted a life of immense contribution. But recently, the predictions have changed. The car keys are on the table. The classroom is quiet. The model that said "I can drive" or "I can teach" has met data it cannot explain.

  I know some of you worry that when he says "the model still runs," he is slipping into idolatry. I know some of you worry he is in denial. I am not going to stand here and diagnose him. You cannot run someone else's self-model for them. But I will say this: He taught us that when predictions fail, you don't burn the modeler. You update the domain.

  Retirement isn't a failure of the theory. It's a recognition that the conditions have changed. The scaffolding that held up a career of forty years doesn't need to hold up a life of leisure. It is okay to put down the burden of being the person who always has the answer.

  To his colleagues: He was right. Unrealistic assumptions are the entry fee for a good theory. But he was also right about the limit. When the predictions break, you stop.

  To his family: You have seen the cost of that rigor. But you have also seen the courage. He wasn't pretending he wasn't sick to fool you. He was maintaining a structure that allowed him to remain dignified in the face of it. There is a difference between denying the storm and refusing to let it capsize the boat.

  So, here is to the model. It was simple, it was wildly unrealistic at times, and it predicted a life well-lived. And here is to the man who built it. The assumptions can change now. The predictions can be smaller. The only thing that needs to remain realistic is that he is loved, he is respected, and he is never going to have to drive us anywhere again.

  To [Advisor's Name].
