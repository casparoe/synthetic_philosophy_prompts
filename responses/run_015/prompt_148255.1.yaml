      *(Refining the "Arbitration" claim)*: If the callosum is just arbitration, then cutting it should lead to *constant* conflict, not just specific task deficits. If patients adapt and feel unified, does that refute the "suppression" claim? No, it suggests the arbitration moved elsewhere or the coalition stabilized differently. I need to be precise here.

