answer: |-
  Your dad is not suffering from tech anxiety; he has accidentally stumbled upon one of the most famous and difficult problems in the history of Artificial Intelligence and philosophy. He is describing the **Frame Problem**, and his intuition about **non-monotonic reasoning** is spot on.

  However, while his diagnosis of the problem is philosophically sound, his proposed solution (listing every background condition) is exactly the trap that stumped early AI researchers for decades.

  Here is the breakdown of why he is right about the danger, but wrong about the fix, and what those technical terms actually mean for his greenhouse.

  ### 1. The Frame Problem: Why Listing "Non-Changes" is Doomed
  In the late 1960s, AI pioneers John McCarthy and Patrick Hayes formalized the exact issue your dad is worried about. In classical logic, if you program a rule that says "If I turn on the sprinkler, the soil gets wet," the logic does not automatically assume that "The color of the greenhouse walls stays the same" or "The neighbor's tree roots don't suddenly grow."

  In strict formal logic, unless you state that something *doesn't* change, the system cannot assume it remains constant. This is the **Frame Problem**.

  Your dad's instinct is to write "frame axioms"—rules that explicitly state what stays the same (e.g., "If sprinkler turns on, the sensor does not get muddy"). The problem is that for every single action, there are infinite things that *don't* change.
  *   If the sprinkler turns on, the moon doesn't change phase.
  *   If the sprinkler turns on, the price of tea in China doesn't change.
  *   If the sprinkler turns on, the sensor doesn't get muddy (unless specified).

  If he tries to list all the background conditions that stay the same, he will face a **combinatorial explosion**. The system would spend 99.9% of its processing power verifying that the world hasn't randomly changed in irrelevant ways, and it would never actually water the plants. So, his approach of trying to list everything is indeed doomed.

  ### 2. Default Reasoning: The Practical Workaround
  The textbook your dad read likely proposed **Default Reasoning** as the solution to the Frame Problem. This is where his intuition is valuable, but his application might be too rigid.

  Default reasoning allows a system to make assumptions that hold true *unless there is evidence to the contrary*.
  *   **Classical Logic:** "I can only conclude the sensor is working if I have proof it is working."
  *   **Default Reasoning:** "I assume the sensor is working *by default*, unless I receive an error signal or contradictory data."

  This solves the Frame Problem by allowing the system to ignore the infinite list of "non-changes." It assumes the background stays the same without needing to be told.

  **However,** this pushes the problem elsewhere, just as you suspected. It creates the **Qualification Problem**. To make the default "Sensor works" safe, you technically need to list every possible exception that could invalidate the default (mud, power surge, squirrel bite, heatwave). You can't list them all. So, practical systems accept that defaults are *risky*. They don't try to be logically perfect; they try to be robust enough.

  ### 3. Non-Monotonicity: Why the Jargon Matters
  Your dad mentioned **non-monotonic belief revision**, and this is not just jargon. It is crucial to understanding why his basic rule (`If moisture < 30% -> Water`) is fragile.

  *   **Monotonic Logic:** In standard math, if you prove $A$ is true, adding new information $B$ cannot make $A$ false. Truth only accumulates.
  *   **Non-Monotonic Logic:** In the real world, adding new information can force you to retract a previous conclusion.

  **Example:**
  1.  **Belief:** Soil is dry (Sensor says 20%).
  2.  **Action:** Turn on water.
  3.  **New Information:** Sensor is covered in mud (it reads 20% falsely).
  4.  **Revision:** The soil is *not* dry. Retract the action.

  In a monotonic system, once the system concludes "Soil is dry," it can't easily undo that conclusion when it learns about the mud. In a non-monotonic system, the logic is designed to handle retraction. Your dad is correct that a system incapable of non-monotonic reasoning is "fundamentally broken" for real-world tasks, because the real world is full of surprises that invalidate previous assumptions.

  ### 4. The Verdict: Is He Right?
  **He is philosophically right, but engineeringly wrong.**

  *   **The Deep Problem:** He is correct that there is a gap between simple rules and reality. No logical system can perfectly account for every contingency in an open environment (like a garden). There is always a "residue" of unlisted conditions (the heatwave, the tree root).
  *   **The Wrong Solution:** He is wrong to think he can solve this by writing more rules. You cannot logic your way out of the Frame Problem by adding more frame axioms.
  *   **The Real Solution:** Modern automation handles this not through exhaustive logic, but through **feedback loops and probabilistic reasoning**.
      *   Instead of assuming the sensor is perfect (default), the system checks for *plausibility*. (e.g., "If moisture drops 20% in 1 second, that's physically impossible; assume sensor error.")
      *   Instead of listing every exception, the system uses **redundancy**. (e.g., A second sensor, or a flow meter on the pipe to ensure water actually moved.)

  ### Summary for Your Dad
  You can tell him this:
  1.  **Validate him:** He has correctly identified the **Frame Problem** and the need for **Non-Monotonic Logic**. Most programmers never think about this, and he is right that ignoring it makes a system brittle.
  2.  **Correct the strategy:** Tell him that trying to list all the "non-changes" is what AI researchers tried in 1970, and they abandoned it because it's impossible.
  3.  **The Pivot:** The solution isn't more rules; it's **defeasible reasoning**. Program the system to assume things are normal *by default*, but give it a "watchdog" mechanism that looks for anomalies (like sudden spikes or impossible readings) that trigger a "safe mode" rather than trying to predict every specific anomaly in advance.

  He's thinking like a philosopher of mind, which is great, but he needs to build like an engineer. The logic will always be incomplete; the goal is to make the failure modes safe, not to make the logic perfect.
