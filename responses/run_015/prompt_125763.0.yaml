answer: |-
  You have identified a genuine structural feature of scientific culture that sits uncomfortably between the philosophy of history and the sociology of science. Your observation is precise: the *function* of the history is stable (legitimation, cohesion), while the *content* is fluid (shifting heroes, shifting models), and the *awareness* of the fluidity is suppressed.

  Here is the breakdown of the concepts, the misfits, and the best available carving.

  ### 1. The Reading Group Dispute
  Your colleagues are arguing past one another because they are looking at different axes of the same phenomenon.
  *   **Colleague A (It is Monumental History):** Is correct about the *function*. Nietzsche's monumental history exists to inspire action in the present by showing that greatness was possible. Your field uses the story to tell graduate students: "Great work happens here." The emotional and pedagogical utility is identical to Nietzsche's description.
  *   **Colleague B (It is not Monumental History):** Is correct about the *ontology*. For Nietzsche, the monument is tied to the specific greatness of the individual (Caesar, Luther). In your field, the individual is a variable; the *office* of the Founder is the constant.

  **Resolution:** This is **Monumental History of the Structure, not the Agent.** The veneration is directed at the *continuity of the field*, and the "founder" is merely the token used to signify that continuity at any given time. The disagreement is verbal only insofar as they are defining "Monument" differently (one by use, one by content).

  ### 2. Candidate Concepts and Their Fit

  There is no single established term that captures all three of your details (functional falsehood, shifting hero, unconscious revision), but three existing concepts cover the terrain.

  **A. Whig History**
  *   **What it explains:** The tendency to view the past through the lens of the present. It explains why the old paper is cited for claims it didn't make (because those claims are what matter *now*).
  *   **Where it fails:** As you noted, Whig history is typically a narrative of *progress toward truth*. It assumes the past was "right" in embryo. Your case is stronger: the past is known to be *wrong*, yet retained. Whig history discards the errors; your field sanctifies them as necessary steps.
  *   **Verdict:** A near miss. It captures the anachronism but not the reverence for falsehood.

  **B. Kuhn's "Textbook Deformation"**
  *   **What it explains:** Thomas Kuhn argued that scientific textbooks rewrite history to make the current paradigm look inevitable and linear. This matches your observation that "nobody has recollection of having rewritten."
  *   **Where it fails:** Kuhn focused on the *erasure* of history (hiding the false starts). You are describing the *active maintenance* of a specific, false narrative. Kuhn's scientists forget the past; yours remember it, but remember it incorrectly on purpose (functionally).
  *   **Verdict:** Captures the mechanism of forgetting, misses the mechanism of veneration.

  **C. Stigler's Law of Eponymy**
  *   **What it explains:** "No scientific discovery is named after its original discoverer." This explains the *shifting identity* of the founder (theorist -> experimentalist -> neglected contemporary). As the field's values shift (theory vs. experiment), the credit migrates to the figure who best represents current values.
  *   **Where it fails:** Stigler's Law is cynical and descriptive; it explains *who* gets credit, not *why* the story holds the community together. It doesn't account for the "shinier monument" effect where criticism strengthens the myth.
  *   **Verdict:** Explains the drift, not the glue.

  ### 3. The Best Established Fit: "Collective Memory"
  The theoretical framework that actually houses this phenomenon is **Collective Memory** (originating with Maurice Halbwachs), specifically applied to science as **Scientific Origin Myths**.

  *   **The Fit:** Halbwachs argued that groups do not remember the past to preserve it, but to reconstruct it in a way that supports their current identity. When your field shifts from theory to experiment, its "identity" shifts. To maintain cohesion, the *memory* of the origin must shift to match the new identity, while claiming it hasn't changed.
  *   **The "Veneration is not Credence" point:** In collective memory, the *truth value* of the memory is secondary to its *social utility*. The story is a ritual, not a record.
  *   **Why it's not enough:** "Collective Memory" is a broad sociological category. It doesn't have a specific name for the *swapping of the hero* while maintaining the *slot*.

  ### 4. A Proposed Carving: "Structural Hagiography"
  Since no single existing term captures the *dynamic swapping of the hero within a stable structure of reverence*, the most precise label for this configuration is **Structural Hagiography**.

  **Definition:** A historiographic pattern in which a discipline maintains a stable narrative of origin (the "Monument") to ensure institutional continuity, while silently substituting the specific agents (the "Saints") to align with shifting epistemic values, without acknowledging the substitution.

  **Why this term works:**
  *   **Hagiography:** Captures the "veneration without credence." Saints' lives are often factually dubious but spiritually functional. The "shinier after criticism" effect is classic hagiography (martyrdom enhances sanctity).
  *   **Structural:** Captures the "interchangeable person." The *position* of the Founder is the invariant; the *occupant* is the variable.

  ### 5. Boundary Cases and Distinctions

  You asked for the edges of the concept. Here is how **Structural Hagiography** distinguishes itself from neighbors:

  **A. Deliberate Manipulation vs. Organic Drift**
  *   **Case:** A committee changes the story for funding vs. the story drifts over coffee.
  *   **Distinction:** Both count as Structural Hagiography *if* the outcome is the same (unacknowledged revision serving cohesion). However, the *mechanism* differs.
      *   **Cynical Myth-Making:** Deliberate, top-down. (e.g., A department head rewrites the history to secure a grant).
      *   **Organic Drift:** Unconscious, bottom-up. (e.g., Graduate students stop citing the theorist because they can't understand the math, and start citing the experimentalist).
  *   **Boundary:** If the revision is openly debated and acknowledged ("We used to think X founded this, but now we see Y did"), it is **Historical Correction**, not Structural Hagiography. The defining feature is the *lack of recollection* of the change.

  **B. Scale: Discipline vs. Laboratory**
  *   **Case:** A whole field vs. one lab's oral tradition.
  *   **Distinction:** The phenomenon scales. A single lab can have a "Founding Myth" (e.g., "The day the apparatus finally worked") that functions structurally.
  *   **Boundary:** It requires a **succession**. A story told once is an anecdote. A story told to new members to integrate them into a lineage is Structural Hagiography. It requires a mechanism of transmission (textbooks, lectures, annual prizes).

  **C. Archival Discovery vs. Narrative Shift**
  *   **Case:** Revising a story because letters were found in an attic.
  *   **Distinction:** This is **Empirical Revision**. It is driven by new evidence, not current functional needs.
  *   **Boundary:** If the letters are found, but only the "useful" ones are cited to support the current narrative while contradictory ones are ignored, it reverts to Structural Hagiography. The test is: *Does the change in the story correlate with a change in the field's self-conception, or with a change in the available evidence?* In your case, it correlates with the field's self-conception (theory -> experiment).

  ### 6. Summary of the Configuration

  You are observing a **Legitimizing Myth** that operates via **Structural Hagiography**.

  1.  **Function:** Legitimation of current practice (not preservation of truth).
  2.  **Mechanism:** Reconstructive Collective Memory (the past is edited to match the present).
  3.  **Feature:** The "Empty Signifier" of the Founder (the role is constant, the person is variable).
  4.  **Condition:** Unconsciousness (the rewriting must not be acknowledged to maintain the illusion of continuity).

  Your reading group's disagreement stems from one person seeing the **Function** (Monumental) and the other seeing the **Object** (the specific man). Both are right. The monument is real; the statue on top is replaceable.

  This is not Whig history because it does not claim the past was *true*. It is not standard Monumental history because it does not claim the *individual* was irreplaceable. It is a ritual of continuity where the history is a mirror the field holds up to itself, polished to reflect whatever face the field is wearing today.
