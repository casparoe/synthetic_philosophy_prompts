      *Self-Correction on Tension 1:* Is (1) strictly welfarist? "Total utilitarian about welfare — what matters is the sum across all sentient beings." This phrasing usually implies *only* welfare matters. If other things mattered, it would be "Total utilitarian about value." So yes, (1) and (5) are contradictory.
