          *   Intervention: Reduce suffering (Average becomes -5). But Pop Grows ($N=300$). Total = -1500.
          *   Welfare got *worse*. But (6) says it's "always welfare-improving."
          *   *Conflict:* (6) contradicts the math of (1) + (2).
          *   *Revision:* Qualify (6). "Reduce suffering *provided it does not increase total negative welfare*."
          *   *Cost:* Makes policy much harder. Might prohibit many welfare interventions.

      *   *Refining Tension 3 (The Conservation Paradox):*
          *   (3) says Habitat Destruction = Good (reduces $N$).
          *   (5) says Habitat = Intrinsic Good.
          *   *Conflict:* Direct opposition.
          *   *Revision:* This depends on Tension 1. If we solve Tension 1 by making (5) instrumental, (3) wins. If we solve Tension 1 by making (1) pluralist, we need a trade-off rate.
          *   *Cheapest:* Acknowledge the trade-off explicitly. (3) is too strong ("is net welfare-positive"). It ignores the loss of (5).
          *   *Revision:* Change (3) to "is welfare-positive *ceteris paribus*, but all-things-considered status depends on weighting against (5)."

  6.  **Final Review of the Audit:**
