      *Final Polish:* Ensure the "Cheapest Revision" is actionable for a syllabus.

      *Let's check the wording of (6) again:* "even if it turns out their population grows as a result, because reducing suffering is always welfare-improving."
      The clause "because reducing suffering is always welfare-improving" is the false premise under (1)+(2). Reducing *per capita* suffering is not always welfare-improving if it increases *total* suffering via population growth.
