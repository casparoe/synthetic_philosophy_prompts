  **Central Research Question**
  W. E. B. Du Bois's 1926 assertion that "all art is propaganda" remains a contentious flashpoint in aesthetic philosophy. Interpretations typically bifurcate: some read the claim as a universal aesthetic thesis reducing art to instrumentalism, while others view it as a context-specific strategic injunction for Black artists under segregation. This project argues that this binary obscures the textual complexity of Du Bois's argument. The central research question is precise: does Du Bois's propaganda thesis operate as an ontological claim about artistic meaning, a normative prescription for production, or a sociological diagnosis of audience reception—and can these readings be separated without forcing him into contradiction with his simultaneous insistence on beauty and universal human value?

  **Literature Gap and Significance**
  Existing scholarship leaves this ambiguity unresolved because it frequently conflates these modalities. Critics who accuse Du Bois of aesthetic reductionism often overlook his qualifications regarding truth and beauty; conversely, defenders who sanitize the propaganda claim as merely strategic often ignore the universality of his phrasing. Consequently, the literature lacks a structured analysis that tests the compatibility of these readings within a single coherent framework. Resolving this is essential for understanding whether Du Bois offers a distinct philosophy of art or a temporary political compromise.

