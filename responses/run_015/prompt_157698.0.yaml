      **Title:** The Ontology of Advocacy: Reconciling Propaganda and Beauty in Du Bois's "Criteria of Negro Art"

      **Project Description:**
      W. E. B. Du Bois's 1926 assertion that "all art is propaganda" remains a contentious flashpoint in aesthetic philosophy. Interpretations typically bifurcate: some read the claim as a universal aesthetic thesis reducing art to instrumentalism, while others view it as a context-specific strategic injunction for Black artists under segregation. This project argues that this binary obscures the textual complexity of Du Bois's argument. The central research question is precise: does Du Bois's propaganda thesis operate as an ontological claim about artistic meaning, a normative prescription for production, or a sociological diagnosis of audience reception—and can these readings be separated without forcing him into contradiction with his simultaneous insistence on beauty and universal human value?

      **Literature Gap:**
      Existing scholarship leaves this ambiguity unresolved because it frequently conflates these modalities. Critics who accuse Du Bois of aesthetic reductionism overlook his qualifications regarding truth and beauty; conversely, defenders who sanitize the propaganda claim as merely strategic often ignore the universality of his phrasing. Consequently, the literature lacks a structured analysis that tests the compatibility of these readings within a single coherent framework.

      **Methodology:**
      This project employs conceptual analysis paired with close rhetorical reading, eschewing empirical survey or archival discovery. First, it will distinguish "propaganda" from "persuasion" and "expressive autonomy" to establish precise definitional boundaries. Second, it will analyze the essay's structure, examining how Du Bois transitions between descriptions of what art *is* and commands about what art *ought to do*. This internal textual focus ensures the project remains feasible without dependence on obscure archival material.

      **Deliverables:**
      The final 6000-word paper will provide a taxonomy of compatible versus incompatible readings of the text. It will offer an explicit verdict on whether Du Bois can consistently hold ontological, normative, and sociological positions simultaneously without violating his commitment to universal beauty. The conclusion will determine whether the apparent contradiction is a failure of logic or a dialectical synthesis specific to the condition of marginalized art.

      **Feasibility and Risk Assessment:**
      The scope is realistic for a one-semester term paper. However, failure conditions exist. If the concept of "propaganda" proves too semantically unstable across Du Bois's usage, the conceptual analysis may lack traction. Additionally, if the text demonstrates irreconcilable inconsistencies rather than dialectical tension, the project must resist the temptation to force coherence where none exists. Success depends on maintaining strict definitional discipline rather than attempting to resolve historical debates outside the text.

