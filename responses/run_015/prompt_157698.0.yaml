prompt: |-
  After a long argument with a friend about whether W. E. B. Du Bois's claim that all art is propaganda is meant as a universal aesthetic thesis or as a context-specific strategic injunction for Black artists under segregation, I want to formalize the disagreement into a research proposal. Write a one-page, formal proposal for a one-semester philosophy term paper of approximately 6000 words. The central question should be stated precisely: does Du Bois's propaganda thesis in his essay on Negro art operate as an ontological claim about artistic meaning, a normative prescription, or a sociological diagnosis of audience reception—and can these readings be separated without forcing him into contradiction with his simultaneous insistence on beauty and universal human value? Explain why existing interpretations leave this ambiguity unresolved rather than settling it. Outline the method: a conceptual analysis distinguishing propaganda from persuasion and from expressive autonomy, paired with a rhetorical analysis of the essay's structure rather than an empirical survey. Specify what a successful deliverable looks like, such as a taxonomy of compatible versus incompatible readings with an explicit verdict on whether Du Bois can consistently hold all three. Provide an honest assessment of failure conditions and whether the scope is realistic for a semester. Do not include a bibliography, citation list, or requests for further reading; I will supply references. Keep the tone polished and suitable for an academic application, and frame the project so that it does not depend on obscure archival material—only on the conceptual and textual issues that can be addressed from the essay itself.
