answer: |-
  You are right to be suspicious. Your colleague is using "the wisdom of crowds" as a rhetorical shield rather than a mechanical description of how group accuracy works. The tension you feel between "vote immediately" (Use 1) and "deliberate first" (Use 2) is not just a vibe; it is a mathematical contradiction in the standard models.

  Here is the menu of precise claims, the conditions required for them to hold, and how they apply to your co-op's specific arguments.

  ### Part 1: The Menu of Claims

  Here are the four distinct mathematical assertions hiding behind the slogan.

  #### 1. The Estimation Claim (Galton's Ox)
  *   **Assertion:** When guessing a continuous quantity (e.g., weight of an ox, number of jellybeans), the average of the crowd's guesses is closer to the truth than most individual guesses.
  *   **Verdict:** **Defensible.** This is robustly observed in empirical data.
  *   **Conditions:** Errors must be uncorrelated (some guess high, some guess low) and centered around the truth (no systematic bias).
  *   **Relevance:** Low. Hiring is a binary choice (Hire/Don't Hire), not a continuous estimation.

  #### 2. The Weak Condorcet Claim (Better than Average)
  *   **Assertion:** A majority vote is more likely to be correct than a randomly selected member of the group.
  *   **Verdict:** **Near-Trivial (if conditions met).**
  *   **Conditions:**
      1.  **Binary Choice:** There is a right/wrong answer.
      2.  **Competence:** The *average* probability of an individual voting correctly ($p$) is greater than 0.5.
      3.  **Independence:** Voters decide based on private information/signals, not by copying others.
  *   **Relevance:** High. This is the minimum bar for Use 1.

  #### 3. The Strong Condorcet Claim (Better than the Best)
  *   **Assertion:** A majority vote is more likely to be correct than the single most competent expert in the group.
  *   **Verdict:** **False (generally).**
  *   **Conditions:** Requires a very large crowd ($N$) and individual competence ($p$) that is only *slightly* above 0.5. If you have a true expert with $p=0.9$, a crowd of 30 people with $p=0.6$ will usually lose to the expert.
  *   **Relevance:** Critical. Your colleague is using this to override the "two most experienced members." Unless the 28 other members are reasonably competent, this claim fails.

  #### 4. The Asymptotic Claim (Certainty)
  *   **Assertion:** As the group size ($N$) goes to infinity, the probability of the majority being correct goes to 1 (certainty).
  *   **Verdict:** **Mathematically True, Practically False.**
  *   **Conditions:** Requires strict independence and $p > 0.5$.
  *   **Relevance:** Misleading. With $N=30$, you are nowhere near asymptotic certainty. If $p=0.55$, a group of 30 only reaches ~75% accuracy. If $p=0.51$, you need thousands of people to beat a single expert.

  ---

  ### Part 2: The Independence Deep Dive

  You asked specifically about what must be independent of what. This is where Use 2 (deliberation) breaks Use 1 (voting).

  **The Requirement: Conditional Independence**
  Voters do not need to be independent in a vacuum; they need to be independent *conditional on the truth*.
  *   **Scenario A (Reading the same article):** You both read the same report. Your *inputs* are correlated. However, if you interpret the data using your own private mental models, your *errors* might still be independent. This is usually acceptable for WoC.
  *   **Scenario B (Hearing the loud guy):** You hear someone else's *conclusion* before forming your own. Your *outputs* are now causally linked. If the loud guy is wrong, you are likely wrong. This creates **correlated errors**.
  *   **The Failure Mode:** If errors are correlated, they do not cancel out; they compound. If 20 people hear the same bad argument and vote the same way, you don't have 20 votes; you have 1 vote with a multiplier.

  **Base Rates and Skew**
  You asked about a voter who always votes the same way (e.g., always "No" on hiring).
  *   If 90% of candidates are bad, an always-"No" voter has 90% accuracy.
  *   **However:** In Condorcet terms, their competence $p$ is calculated *conditional on the state*.
      *   $P(\text{Vote Yes} | \text{Candidate Good})$ must be $> 0.5$.
      *   $P(\text{Vote No} | \text{Candidate Bad})$ must be $> 0.5$.
  *   An always-"No" voter has $P(\text{Vote Yes} | \text{Candidate Good}) = 0$. They violate the competence assumption. Including them drags the average $p$ down. If the average $p$ drops below 0.5, the "Wisdom" becomes "Madness"—adding more voters makes the decision *worse*.

  ---

  ### Part 3: Applying the Menu to Your Co-op

  Here is the verdict on your colleague's two specific uses of the slogan.

  #### Use 1: "30 of us voting is better than the 2 experts deciding."
  *   **Claim Being Made:** Strong Condorcet (Crowd > Best Member).
  *   **Verdict:** **Likely False.**
  *   **Why:** For the crowd to beat the experts, the *average* competence of the 28 non-experts must be sufficiently high.
      *   **The "Coin Flip" Problem:** If the non-experts are only barely better than random ($p = 0.51$), you need a massive crowd to beat an expert with $p = 0.8$. With only 30 people, the experts win.
      *   **The "Ignorance" Problem:** If most members know nothing about the candidates, their $p \approx 0.5$. If even a few are systematically biased ($p < 0.5$), the average drops. If the average drops below 0.5, the vote becomes actively harmful.
  *   **Argument to Win:** "Condorcet only beats experts if the average voter is competent. If most of us are guessing, we are just adding noise. We should weight votes by competence, or defer to those with $p > 0.8$."

  #### Use 2: "We should talk it through together because pooling knowledge makes us smarter."
  *   **Claim Being Made:** Deliberation increases average competence ($p$).
  *   **Verdict:** **Defensible, but it contradicts Use 1.**
  *   **Why:** Deliberation *destroys* independence (everyone hears the same arguments). This violates the WoC/Condorcet assumptions.
      *   **The Trade-off:** Deliberation is only worth it if the gain in competence ($\Delta p$) outweighs the loss of independence ($\Delta \text{correlation}$).
      *   **The Risk:** If the deliberation is dominated by one confident person (the "loud guy"), correlation goes to 1.0. The group effectively becomes a single voter. If that voter is wrong, the whole group is wrong.
  *   **Argument to Win:** "Deliberation helps only if it raises our individual competence without making us all think alike. If we all leave the discussion holding the same opinion because of one speaker, we have lost the 'crowd' benefit. We are now just a committee following a leader."

  ---

  ### Part 4: The Edge Cases You Asked About

  #### 1. "Barely better than a coin flip"
  If voters have $p = 0.51$ (51% chance of being right):
  *   **Does the slogan deliver?** Technically yes, but practically no.
  *   **The Math:** To reach 90% confidence with $p=0.51$, you need roughly 600 voters. With 30 voters, your accuracy is only ~57%.
  *   **Conclusion:** If your co-op members are only slightly competent, 30 votes are not worth much. You need high competence or a much larger crowd.

  #### 2. "Systematically wrong" (Madness of Crowds)
  If the average $p < 0.5$ (e.g., the group has a shared bias against a certain type of candidate):
  *   **Does it flip?** Yes.
  *   **The Math:** If $p = 0.4$, adding more voters drives the probability of a correct majority toward 0.
  *   **Conclusion:** If the culture of the co-op is biased, voting amplifies the bias. WoC assumes errors are random, not systematic.

  #### 3. "Diverse Heuristics" (The Simulation You Remembered)
  You are recalling the **Hong & Page "Diversity Trumps Ability" theorem**.
  *   **Is it the same?** No. Condorcet is about aggregating *signals* on a fixed truth. Hong & Page is about *searching a solution space* (e.g., solving a complex problem, not just voting Yes/No).
  *   **The Claim:** A group of diverse, mediocre problem-solvers can outperform a group of high-ability, homogeneous problem-solvers because they get stuck in different local maxima.
  *   **Relevance:** This supports **Use 2 (Deliberation)** if the goal is problem-solving (e.g., "How do we fix this workflow?"). It does **not** support Use 1 (Hiring) as well, because hiring is usually a judgment call (Condorcet) rather than a search problem.
  *   **Argument to Win:** "If we are solving a complex problem, diversity matters more than ability. But if we are judging a candidate's fitness, we need competence, not just diverse opinions."

  #### 4. "Should the ignorant abstain?"
  *   **If they abstain:** You reduce $N$. If the remaining voters are the experts, you have switched from "Wisdom of Crowds" to "Epistocracy" (rule by the knowledgeable).
  *   **Is it still WoC?** No. WoC relies on the aggregation of many *partial* signals. If you filter out everyone without a strong signal, you are just asking the experts.
  *   **Verdict:** If the non-experts have $p \approx 0.5$, they *should* abstain. Their vote adds variance without adding signal.
  *   **Argument to Win:** "If members feel they lack information to be better than a coin flip, the math says they should abstain. Forcing a vote dilutes the signal of those who actually know."

  ### Summary: How to Win the Argument

  Your colleague is conflating three different mechanisms:
  1.  **Aggregation of independent signals** (Condorcet/WoC).
  2.  **Pooling knowledge to raise competence** (Deliberation).
  3.  **Diversity of problem-solving tools** (Hong & Page).

  **The Knockout Punch:**
  "You are using 'Wisdom of Crowds' to justify two contradictory processes.
  1.  If we want the **Wisdom of Crowds (Condorcet)**, we must vote **independently**. Deliberating first correlates our errors and breaks the math.
  2.  If we want the benefit of **Deliberation**, we admit that independent voting isn't enough and we need to raise our competence first. But then we can't claim the 'crowd' is smarter than the experts just because of numbers; we have to prove the discussion made us individually smarter.
  3.  Most importantly, Condorcet only beats experts if the average member is competent. If most of us are guessing ($p \approx 0.5$), 30 votes are worth less than 2 experts. Unless we can show the average member knows enough to be better than a coin flip, the slogan doesn't apply."

  **Recommendation:** Propose a hybrid. Deliberate to share facts (raising $p$), but use secret ballots to preserve independence (reducing correlation), and allow abstention for those who feel their $p$ is still $\le 0.5$.
