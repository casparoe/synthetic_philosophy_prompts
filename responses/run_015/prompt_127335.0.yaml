prompt: |-
  So I'm in a worker co-op and one of the other members keeps ending arguments with "the wisdom of crowds" — it came out twice in our last meeting about how we should make decisions. First use: we were deciding whether to hire one of two people for a paid role, and the suggestion that our two most experienced members should just decide it got shut down with the slogan — apparently a majority vote of all 30 of us is more likely to get it right. Second use: someone said we should always talk it through together before voting, because pooling what everyone knows is precisely what makes the group smarter than any individual. I have a nagging feeling the second claim quietly breaks whatever makes the first one work — I remember enough of the Condorcet jury theorem setup to know there's an independence assumption in there somewhere and that us all hearing the same two loud people before voting looks like exactly the kind of thing that would violate it — but I also cant tell whether the slogan is even making the same claim in the two places, and I keep sliding between "more voters is better", "the group beats its average member" and "the group beats its best member", which feel like very different strengths of claim.

  Can you lay out as a menu the precise things "the wisdom of crowds" could be asserting here, with verdicts — which are near-trivial, which are substantive but defensible, which are just false? At minimum I'd want: the weak "majority is more accurate than the average member", the stronger "more accurate than the best member", the asymptotic "accuracy goes to certainty as the group grows", and separately that averaging thing where a crowd guessing a number beats individual guesses because errors cancel out. For each, spell out what has to be true of the voters: I especially want to know what exactly has to be independent of what, because "everyone read the same article" and "everyone heard what the confident guy said" feel like different failures and I can't say how, and I also want to know whether it matters that the vote is on a question with a heavily skewed base rate (surely a voter who always votes the same way has great accuracy and tells us nothing?).

  Then the part I actually care about: for each reading on the menu, does it support the first use, the second use, both, or neither? Concretely — if the extra voters we'd be adding are only barely better than a coin flip, does the slogan still deliver anything, or do you need an absurd number of people before 30 slightly-competent votes are worth much? What if they're systematically wrong about this particular kind of question — does the whole thing flip into "madness of crowds"? And is there any reading on which deliberating before voting still helps even though it destroys independence, e.g. one where everyone's individual competence rises enough to pay for the correlation? Two last things: there's a simulation result I half remember where a diverse bunch of merely-okay heuristics outperformed a group of individually better ones, and I don't know whether that's a separate reading or the same one in different words; and should the members who know nothing about the question just abstain, and if so is the result still "the wisdom of crowds" or have we quietly switched to deference to experts? I don't need citations or sources, I just want to know which precise claims are on offer and which ones would actually win me the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** User is in a worker co-op (30 members). Another member keeps using "wisdom of crowds" (WoC) to justify decision-making processes (hiring, deliberation vs. voting).
      *   **Problem:** The user suspects the slogan is being used inconsistently or incorrectly. Specifically, they see a tension between "majority vote" (Use 1) and "deliberate together then vote" (Use 2), noting that deliberation violates independence assumptions required for WoC theorems.
      *   **Goal:** A "menu" of precise claims associated with WoC, categorized by strength (trivial, defensible, false), with specific conditions (independence, competence, base rates).
      *   **Application:** Evaluate which claims support Use 1 (vote without expert deference), Use 2 (deliberate before voting), or neither.
      *   **Specific Questions to Answer:**
          *   Weak claim (better than average member).
          *   Strong claim (better than best member).
          *   Asymptotic claim (certainty as $N \to \infty$).
          *   Estimation claim (averaging errors cancel out).
          *   Conditions: What must be independent? (Reading same article vs. hearing loud guy).
          *   Base rates/Skew: Does constant voting matter?
          *   Competence: What if voters are barely better than coin flips? Systematically wrong?
          *   Deliberation: Can it help despite destroying independence?
          *   Diversity vs. Ability: The "diverse heuristics" simulation result.
          *   Abstention: Should ignorant members abstain? Is that still WoC?
      *   **Constraint:** No citations/sources needed. Focus on precise claims and winning the argument.

  2.  **Deconstruct "Wisdom of Crowds" Claims (The Menu):**
      *   *Claim 1: The Estimation Aggregation (Galton's Ox).* Continuous variables. Average of guesses $\approx$ truth.
      *   *Claim 2: Condorcet Jury Theorem (Binary Choice).* Majority rule.
          *   *Weak:* $P(\text{Majority Correct}) > \text{Average } P(\text{Individual Correct})$.
          *   *Strong:* $P(\text{Majority Correct}) > \text{Best } P(\text{Individual Correct})$.
          *   *Asymptotic:* $P(\text{Majority Correct}) \to 1$ as $N \to \infty$.
      *   *Claim 3: Diversity Prediction Theorem.* Crowd Error = Average Individual Error - Diversity of Predictions.
      *   *Claim 4: Hong & Page (Diversity Trumps Ability).* Diverse heuristics > Homogeneous high-ability.

  3.  **Analyze Conditions & Assumptions:**
      *   **Independence:** Crucial for Condorcet.
          *   *Causal Independence:* My vote isn't caused by your vote.
          *   *Informational Independence:* We aren't using the exact same signal.
          *   *Failure Modes:* "Hearing the loud guy" (Causal cascade) is worse than "Reading same article" (Shared signal, but private interpretation).
      *   **Competence ($p > 0.5$):** Condorcet requires average competence $> 0.5$. If $p < 0.5$, more people make it *worse*.
      *   **Base Rates:** If the truth is rare, constant voting (always "no") looks accurate but adds no information. Conditional independence matters.
      *   **Deliberation:** Destroys independence (correlates errors) but might raise competence ($p$). Trade-off: Does $\Delta p$ outweigh $\Delta \text{correlation}$?

  4.  **Evaluate the Co-op Scenarios:**
      *   **Use 1 (Hiring Vote):** 30 people voting. Claim: Majority > 2 Experts.
          *   Requires: Average member competence > 0.5 on hiring. Independence.
          *   Risk: Most members don't know the candidates. $p \approx 0.5$ or $< 0.5$. If $p < 0.5$, WoC fails.
      *   **Use 2 (Deliberate then Vote):** Claim: Pooling knowledge makes us smarter.
          *   Conflict: Deliberation creates correlation.
          *   Nuance: If deliberation raises $p$ significantly, it might still work, but it's no longer standard WoC/Condorcet. It's "Deliberative Democracy."

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's intuition is correct. The slogan is being used as a "stopper" without precision.
      *   *Section 1: The Menu of Claims.*
          *   Define the four specific claims requested.
          *   Verdict on each (Trivial/Defensible/False).
          *   Conditions for each (Independence, Competence).
      *   *Section 2: The Independence Deep Dive.*
          *   Distinguish "Shared Information" (Article) vs. "Social Influence" (Loud Guy).
          *   Explain Conditional Independence.
      *   *Section 3: Base Rates & Competence.*
          *   Address the "barely better than coin flip" question. (Math: margin shrinks, need huge $N$).
          *   Address "Systematically Wrong" ($p < 0.5$).
      *   *Section 4: Deliberation vs. Independence.*
          *   The trade-off. Deliberation usually kills WoC math but might enable "Collective Intelligence" via competence boosting.
      *   *Section 5: The Specific Co-op Arguments.*
          *   Evaluate Use 1 (Hiring). Likely fails if most are ignorant ($p \approx 0.5$).
          *   Evaluate Use 2 (Deliberation). Technically violates WoC, but might be justified on other grounds.
      *   *Section 6: The "Diversity" & "Abstention" Questions.*
          *   Hong & Page reference (Diversity Trumps Ability).
          *   Abstention: Yes, ignorant should abstain. It reverts to expert rule, not WoC.

  6.  **Refining the Math/Logic (Self-Correction during drafting):**
      *   *Condorcet:* Need to be careful. If $p=0.51$, 30 people isn't *that* much better than one expert with $p=0.8$. I need to make sure the user understands the *magnitude* of the benefit depends on $p$.
      *   *Independence:* "Reading the same article" creates correlation in the *signal*, but if errors are idiosyncratic interpretations, it might pass. "Hearing the loud guy" creates correlation in the *vote*. The latter is fatal.
      *   *Deliberation:* If everyone hears the same argument, their errors become perfectly correlated. If that argument is wrong, everyone is wrong. WoC collapses.
      *   *Abstention:* If ignorant people abstain, $N$ drops. If experts remain, it's epistocracy, not WoC. WoC relies on the *crowd* including the mediocre.

  7.  **Final Polish:**
      *   Tone: Analytical, precise, empowering the user to push back in the meeting.
      *   Structure: Clear headings, bullet points for the "Menu."
      *   Check against constraints: No citations, focus on precise claims.

  8.  *(Self-Correction on the "Diversity" point)*: The user mentioned a simulation where diverse okay heuristics beat better ones. That is specifically the Hong & Page "Diversity Trumps Ability" theorem. I need to distinguish this from Condorcet. Condorcet is about *aggregating signals* on the same truth. Hong & Page is about *searching a solution space* with different tools. Hiring is more Condorcet (is this person good?), but problem-solving is Hong & Page. I should clarify this distinction.

  9.  *(Self-Correction on Base Rates)*: If the base rate is skewed (e.g., 90% of candidates are bad), a voter who always says "No" has 90% accuracy. But they contribute zero information. Condorcet assumes $p > 0.5$ *conditional on the state of the world*. I need to explain that "accuracy" isn't just overall hit rate, it's sensitivity/specificity.

  10. **Final Review against User Prompt:**
      *   Menu of claims? Yes.
