      *   Independence specifics? Yes.
      *   Base rates? Yes.
      *   Support for Use 1 vs Use 2? Yes.
      *   Barely better than coin flip? Yes.
      *   Systematically wrong? Yes.
      *   Deliberation trade-off? Yes.
      *   Diversity simulation? Yes.
      *   Abstention? Yes.

