prompt: |-
  I am trying to settle an argument, not to learn what Ayn Rand wrote, so please skip citations, reading suggestions, and summaries of her corpus: I want the argument space mapped, and I want it mapped without anyone looking anything up.

  The argument was about effective altruism. My interlocutor reached for the title of Rand's 1964 collection, "The Virtue of Selfishness," and used it, in one breath, to two conclusions: first, that giving a large share of one's income to strangers is not merely optional but degrading, a self-sacrifice that a person of integrity would refuse; second, that a genuinely rational person would never make an anonymous gift, since an anonymous gift cannot come back to benefit the giver. He also leaned on the point that Rand glosses "selfishness" in her introduction as nothing more than concern with one's own interests, and on her definition of value as that which one acts to gain and/or keep.

  I am convinced the one-liner is sliding, and I want the slide made explicit. Please give me a menu of the distinct precise theses the slogan could be asserting, and grade each one. My own attempts, which I expect you to correct, split, and add to, are these:

  One: a purely verbal thesis. Selfishness is redefined so that any action flowing from what the agent values counts as selfish, in which case the slogan says almost nothing and cannot reach either conclusion.
  Two: an objective-standard thesis. "Interests" are not whatever the agent happens to want but what serves her life as the kind of being she is, so the slogan has real content, but only if the account of a person's objective interests does independent work.
  Three: a jurisdictional thesis. What is wrong with altruism is not the cost to the agent or the benefit to others but the location of the normative trigger: the agent acts on another's need rather than on her own judgment of value. This may have no behavioral content at all, so that a kidney donation and a refusal to donate could each be virtuous or vicious depending on their source.
  Four: an anti-fixed-pie or harmony thesis: value is created rather than transferred, so benefit to another at cost to self is never the net gain it appears to be, and altruistic codes systematically destroy value.
  Five: an epistemic thesiss: others' needs are not transparent to me, whereas my own interests are, so an altruistic code is a systematically error-prone decision rule.
  Six: an empirical psychological thesis about what altruistic motivation does to character, to dependents, and to the giver's own capacity for sustained action.
  Seven: a narrow scope thesis: no positive duty to serve others, gifts permitted as luxuries, i.e. a denial of obligation rather than a denial of permissibility or admirability.

  For every reading, tell me: how to state it precisely; whether it is a definitional maneuver, a platitude, a substantive and defensible thesis, a substantive but contested one, or false; what would count as refuting it; whether Rand or a defender of the slogan is actually committed to it or whether it is an extrapolation; and, most importantly, whether it licenses the first conclusion, the second, both, or neither. Note where the readings differ along the axes that I think are doing the hidden work: the extension of "selfishness," the kind of normative status being claimed (permissible, praiseworthy, obligatory, admirable), and the direction of the contrast (altruism is not obligatory, versus never permissible, versus never admirable).

  Two things I cannot work out and particularly want addressed. First, over what interval are interests summed? Rand's own framework must permit forgoing present goods for long-range ones, so the self whose interests matter is a life and not a time slice; say what that does to the bite against altruism. Second, if the content of the virtue is just concern with one's own interests, and if the standard is indexed to a living organism's survival, what principle internal to the view stops the boundary of the self at the skin, so that the interests of those I love cannot be counted as mine? If no such principle can be given, say what happens to my interlocutor's two conclusions.

  Finally: tell me which reading he must have meant, and if no reading both survives scrutiny and supports what he said, say so plainly and tell me which suppressed premise is actually carrying the weight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Settle an argument about Effective Altruism (EA) vs. Ayn Rand's "The Virtue of Selfishness."
      *   **Constraint:** Do *not* provide citations, reading suggestions, or summaries of Rand's corpus. Map the *argument space* without looking anything up (rely on internal knowledge of Objectivist ethics and meta-ethics).
      *   **Task:** Evaluate the user's seven proposed theses (plus add/split/correct), grade them (definitional, platitude, substantive, false, etc.), check commitment (is Rand actually committed?), and check licensing (does it support the interlocutor's two conclusions?).
      *   **Specific Questions:** Address the time-interval of interests (life vs. time-slice) and the boundary of the self (skin vs. loved ones).
      *   **Final Verdict:** Identify which reading the interlocutor *must* have meant, or if the argument fails due to a suppressed premise.
      *   **Tone:** Analytical, precise, philosophical, direct. No fluff, no "Rand scholars say."

  2.  **Deconstruct the Interlocutor's Claims:**
      *   *Claim 1:* Giving a large share of income to strangers is degrading/self-sacrificial (integrity refusal).
      *   *Claim 2:* A rational person would never make an anonymous gift (no benefit to giver).
      *   *Basis:* Rand's "Selfishness" = concern with one's own interests; "Value" = that which one acts to gain/keep.

  3.  **Evaluate the User's Seven Theses:**

      *   *One (Verbal/Definitional):* "Selfishness" = acting on values.
          *   *Critique:* If *any* valued action is selfish, then giving to charity is selfish if I value it. This kills Claim 1 & 2.
          *   *Status:* Definitional maneuver. Rand is committed to the definition, but not the trivialization.
          *   *License:* Neither.

      *   *Two (Objective Standard):* Interests = objective life-serving, not subjective whim.
          *   *Critique:* This is the core Objectivist move. But does charity *never* serve life?
          *   *Status:* Substantive/Contested.
          *   *License:* Potentially Claim 1, weakly Claim 2.

      *   *Three (Jurisdictional/Source):* Wrongness = acting on another's need vs. own judgment.
          *   *Critique:* Nuanced. If I judge charity good, is it allowed? Rand says "sacrifice" is the issue, not the beneficiary.
          *   *Status:* Substantive.
          *   *License:* Claim 1 (if defined as sacrifice), Claim 2 (if anonymity implies no self-benefit).

      *   *Four (Harmony/Non-Zero-Sum):* Value created, not transferred. Altruism destroys value.
          *   *Critique:* Economic/Systems view.
          *   *Status:* Substantive/Empirical.
          *   *License:* Claim 1 (degrading because destructive), Claim 2 (inefficient).

      *   *Five (Epistemic):* I know my needs, not others'.
          *   *Critique:* Hayekian knowledge problem applied to ethics.
          *   *Status:* Substantive/Contested.
          *   *License:* Claim 1 (risky), Claim 2 (anonymous is worse).

      *   *Six (Psychological):* Altruism corrodes character.
          *   *Critique:* Virtue ethics angle.
          *   *Status:* Empirical/Contested.
          *   *License:* Claim 1 (degrading), Claim 2 (irrelevant).

      *   *Seven (Narrow Scope):* No duty, but permission exists.
          *   *Critique:* This contradicts the interlocutor. He said it's *degrading* (forbidden/vicious), not just not obligatory.
          *   *Status:* Defensible (Libertarian), but contradicts interlocutor.
          *   *License:* Neither (undermines interlocutor).

  4.  **Address the Two "Unworkable" Questions:**
      *   *Time Interval:* Rand's standard is "Man's Life." Sacrifice = trading a higher value for a lower. If charity brings long-term psychic benefit (pride, happiness), is it sacrifice? Interlocutor says *no* anonymous gift. This implies he thinks psychic benefit requires recognition.
      *   *Boundary of Self:* If I love someone, their life is my value. Rand allows trade, love, benevolence. But "strangers"? The boundary is usually rational self-interest. If loved ones count as "self," then helping them is selfish. Helping strangers is the friction point. If the boundary expands too far, "selfishness" loses bite. If it stays at skin, love is hard to explain without "selfish" redefinition.

  5.  **Synthesize and Grade:**
      *   Need to be careful not to turn this into a Rand exegesis. Keep it on the *logic of the argument*.
      *   The interlocutor's leap from "Selfishness = Own Interests" to "Anonymous Giving = Irrational" is the weak link.
      *   The leap from "Own Interests" to "Charity = Degrading" requires a specific definition of "Sacrifice."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the constraint (no citations, map the logic).
      *   *The Menu:* Go through the user's 1-7. Refine definitions. Assign grades. Check licensing.
      *   *The Two Hard Questions:*
          *   *Time:* The "Life" standard. Sacrifice is giving up a *greater* value for a *lesser*. If charity is a lesser value, it's sacrifice. If it's a greater value (e.g., buying happiness), it's trade. Interlocutor assumes charity is *always* lesser value.
          *   *Boundary:* The "Trade" principle. Love is selfish because the beloved is a value *to me*. Strangers are not values *to me* unless they trade. Anonymous giving breaks the trade loop.
      *   *The Verdict:* The interlocutor is likely smuggling in a specific empirical claim (Claim 6 or 4) disguised as a definitional truth (Claim 1). The argument fails without the suppressed premise that "Psychic satisfaction from anonymous giving is impossible or irrational."

  7.  **Refining the "Grades" and "Licensing":**
      *   *Thesis 1 (Verbal):* If true, interlocutor loses. (Tautology).
      *   *Thesis 2 (Objective):* Needs the "Sacrifice" definition.
      *   *Thesis 3 (Jurisdictional):* Crucial. Rand distinguishes "benevolence" (selfish) from "altruism" (sacrificial). Interlocutor conflates them.
      *   *Thesis 4 (Harmony):* Strongest support for Claim 1.
      *   *Thesis 5 (Epistemic):* Supports Claim 2 well.
      *   *Thesis 6 (Psychological):* Supports Claim 1 well.
      *   *Thesis 7 (Scope):* Undermines interlocutor.

      *   *Correction:* I need to make sure I don't sound like I'm defending Rand, but analyzing the *argumentative structure* the interlocutor used. The prompt asks to map the argument space.

      *   *Specific focus:* The interlocutor's Claim 2 (Anonymous gift) is the tell. It reveals he thinks value *must* be external/recognizable to count as self-interest. This contradicts the "psychic benefit" loophole.

  8.  **Final Polish:** Check against constraints.
      *   No citations? Check.
      *   No reading suggestions? Check.
      *   Map argument space? Check.
      *   Address the two hard questions? Check.
      *   Final verdict on interlocutor? Check.

      *(Self-Correction during drafting)*: I need to be careful with Thesis 3. Rand's distinction between "altruism" (ethical code demanding sacrifice) and "benevolence" (voluntary aid) is key. The interlocutor treats *any* large gift as altruism/sacrifice. I need to highlight this equivocation.

      *(Self-Correction on Boundary)*: The "Boundary of Self" question is tricky. Rand's view is that you value others *because* they serve your happiness. If the boundary expands to include strangers, the theory collapses into utilitarianism. If it stays at skin, love looks transactional. The interlocutor relies on the "skin" boundary to call stranger-giving irrational.

      *(Final Verdict)*: The interlocutor is relying on a hybrid of Thesis 2 (Objective Standard) and Thesis 6 (Psychological), but he is treating Thesis 1 (Verbal) as if it does the heavy lifting. He is committing the "Motte and Bailey" of ethical egoism: defining selfishness broadly (Thesis 1) to avoid criticism, but enforcing it narrowly (Thesis 2/6) to condemn charity.

      Let's structure the response clearly.

      *   **Section 1:** The Menu (1-7, plus additions).
      *   **Section 2:** The Two Hard Questions (Time & Boundary).
      *   **Section 3:** The Verdict (What he meant vs. what holds water).

      *Wait, one more check:* The prompt asks to "grade each one" (definitional, platitude, substantive, etc.) and "whether Rand or a defender... is actually committed." I must be careful not to violate "no citations/summaries" while answering "is Rand committed." I can state general philosophical positions associated with the view without quoting *Atlas Shrugged* or citing essays. I can speak to the *internal logic* of the position known as Objectivist ethics.

      *Refining the "Anonymous Gift" point:* Why would Rand/objectivists say anonymous is irrational? Because trade requires recognition? Or because virtue requires pride? If I give anonymously, I cannot claim the moral credit. If moral credit is a value, anonymity destroys value. This links to Thesis 3 (Jurisdictional/Source).

