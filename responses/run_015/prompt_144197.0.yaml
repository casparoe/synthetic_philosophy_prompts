  # Which Extinction Pessimist Are You?
  ### A Conceptual Decision Tree for Seminar Discussion

  **Instructions:** This exercise maps your intuitions about human extinction. Read each scenario and question carefully. Follow the path that matches your immediate judgment. Do not overthink; your first instinct reveals your underlying ethical commitments. At the end, match your path to one of the eight positions.

  ---

  ### The Decision Tree

  **Start Here: The Sealed Dome**
  *Scenario:* Imagine the last generation of humans lives full, happy lives inside a sealed dome. When they die of old age, humanity ends painlessly. There are no mourners, no descendants, and no one left to remember us.
  **Q1.** Setting aside the tragedy of these specific individuals dying, is the end of the *species itself* a loss?
  *   **No.** → Go to **Position 1**.
  *   **Yes.** → Go to **Q2**.

  **The Museum of the Last Generation**
  *Scenario:* The last generation knowingly completes all their personal and collective projects. They build a perfect archive of human history and art, seal it in a vault, and then extinction occurs. No one will ever see the archive.
  **Q2.** Does the fact that *no future being will ever witness* this archive undermine the point or intelligibility of the last generation's efforts?
  *   **Yes.** (Our current valuing depends on a future audience.) → Go to **Position 4**.
  *   **No.** (Meaning is internal to the lives lived.) → Go to **Q3**.

  **The Successor Reserve**
  *Scenario:* Immediately after humanity ends, an equally flourishing, culturally unrelated species arises on Earth. They create just as much art, science, and happiness as we would have.
  **Q3.** Is the loss of humanity still a specific tragedy, or is it only a tragedy that *conscious life* in general might have ended?
  *   **Humanity is Special.** (It matters that *we* continue, not just anyone.) → Go to **Q4**.
  *   **Value is General.** (It matters that *value* exists, not necessarily human value.) → Go to **Q5**.

  **(Path A: Humanity is Special)**
  **The Sterilization Choice**
  *Scenario:* A future society must choose between a risky continuation of humanity (which guarantees some future suffering) and a painless sterilization that leads to extinction after the current generation.
  **Q4.** Is preventing all future suffering more important than continuing the human line?
  *   **Yes.** (Prevent harm.) → Go to **Position 7**.
  *   **No.** (Continue the project.) → Go to **Q6**.

  **The Frozen Vault**
  *Scenario:* Aliens arrive and offer to revive stored human embryos to repopulate the Earth, but all human culture, history, and language will be lost. The new humans would be biologically ours but culturally disconnected.
  **Q6.** Does this recovery of biological life restore the lost value, or was the value in our specific cultural continuity?
  *   **Restored.** (The project is cumulative progress.) → Go to **Position 5**.
  *   **Not Restored.** (The project is specific history/culture.) → Go to **Position 3**.

  **(Path B: Value is General)**
  **The Deep Fact**
  *Scenario:* Consider your judgment that extinction is a loss.
  **Q5.** Is this judgment a discoverable *fact* about the universe, or merely an expression of your own attitude?
  *   **Attitude.** (No deep fact exists.) → Go to **Position 8**.
  *   **Fact.** (There is a truth of the matter.) → Go to **Q7**.

  **The Compensation Test**
  *Scenario:* Imagine aliens create a different species of happy beings instead of reviving humans. The total amount of happiness in the universe is the same.
  **Q7.** Is the loss of humanity fully compensated by the creation of these different happy beings?
  *   **Yes.** (Only the total count of good lives matters.) → Go to **Position 2**.
  *   **No.** (The specific variety or quality of value matters.) → Go to **Position 6**.

  ---

  ### The Eight Positions (Leaves)

  **1. The Austere Realist**
  *Path:* Q1 (No)
  *Core View:* There is nothing over and above the deaths of individuals.
  *Awkward Commitment:* You must accept that a universe with one happy person is no better or worse than a universe with a trillion happy people, provided the individuals themselves don't mind.

  **2. The Impersonal Futurist**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (General) → Q5 (Fact) → Q7 (Yes)
  *Core View:* The loss is just the missing good lives; it could be compensated by creating different well-off beings.
  *Awkward Commitment:* You must accept that humanity could be replaced by a species of happy "zombies" or aliens without any net loss, provided the total happiness remains equal.

  **3. The Cultural Continuity Guardian**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (Special) → Q4 (No) → Q6 (Not Restored)
  *Core View:* The loss is that human projects, history, or culture would have no successors.
  *Awkward Commitment:* You must accept that a biologically human future with no memory of Shakespeare or democracy is effectively a failure, even if those humans are happy.

  **4. The Collective-Afterlife Believer**
  *Path:* Q1 (Yes) → Q2 (Yes)
  *Core View:* Extinction retroactively undermines the point or intelligibility of our current valuing, even if no future person is deprived.
  *Awkward Commitment:* You must accept that your current love for your family or work is partially dependent on strangers existing a million years from now.

  **5. The Civilizational Steward**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (Special) → Q4 (No) → Q6 (Restored)
  *Core View:* Humanity is a valuable cumulative project that would be cut short.
  *Awkward Commitment:* You must accept that the primary value of the future is to carry the torch of progress, potentially making the current generation merely a bridge for the next.

  **6. The Axiarchic Plenitudinarian**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (General) → Q5 (Fact) → Q7 (No)
  *Core View:* Any loss is a reduction in the total amount, variety, or quality of value in the universe, human or not.
  *Awkward Commitment:* You must accept that the universe has a duty to maximize richness or variety, potentially requiring the creation of beings solely to fill ecological or value niches.

  **7. The Suffering-Focused Prioritizer**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (Special) → Q4 (Yes)
  *Core View:* Extinction is not bad beyond the deaths and may even be preferable because it prevents future harm.
  *Awkward Commitment:* You must accept that ensuring no future human ever suffers is more important than ensuring any future human ever exists.

  **8. The Quietist Expressivist**
  *Path:* Q1 (Yes) → Q2 (No) → Q3 (General) → Q5 (Attitude)
  *Core View:* The extra question has no further factual answer and our judgments merely express attitudes.
  *Awkward Commitment:* You must accept that your deep conviction that extinction is a tragedy is not a truth about the world, but merely a projection of your own psychology.

  ---

  ### Scoring Key & Discussion Notes

  **Mapping Your Path:**
  *   **1:** Q1 = No.
  *   **4:** Q1 = Yes, Q2 = Yes.
  *   **7:** Q1 = Yes, Q2 = No, Q3 = Special, Q4 = Yes.
  *   **3:** Q1 = Yes, Q2 = No, Q3 = Special, Q4 = No, Q6 = Not Restored.
  *   **5:** Q1 = Yes, Q2 = No, Q3 = Special, Q4 = No, Q6 = Restored.
  *   **8:** Q1 = Yes, Q2 = No, Q3 = General, Q5 = Attitude.
  *   **2:** Q1 = Yes, Q2 = No, Q3 = General, Q5 = Fact, Q7 = Yes.
  *   **6:** Q1 = Yes, Q2 = No, Q3 = General, Q5 = Fact, Q7 = No.

  **Flags for Seminar Discussion:**

  *   **Indistinguishable Leaves (2 & 6):** The tree separates the *Impersonal Futurist* (2) and the *Axiarchic Plenitudinarian* (6) based on whether different beings can compensate for human loss. In practice, these views often converge. To pull them apart, you would need a scenario where total happiness is equal, but the *variety* of consciousness is reduced (e.g., replacing humans with a single species of happy simple organisms).
  *   **The "No" Branch Tension:** The *Austere Realist* (1) and *Suffering-Focused Prioritizer* (7) both deny that extinction is intrinsically bad beyond individual deaths. However, the tree routes (1) immediately to "No" on Q1, while (7) answers "Yes" to Q1 (acknowledging the loss of potential) but prioritizes suffering prevention on Q4. This is a structural compromise to fit eight leaves into six questions; in reality, (7) might also answer "No" to Q1.
  *   **Unoccupied Nodes:** There are no logically incoherent nodes in this tree, but the path to **Position 8 (Quietist)** is rarely taken by those who feel strong moral outrage at extinction. If a student feels strongly that extinction is bad but selects Position 8, they are holding a "fictionalist" view: acting *as if* it is bad while believing it is not a fact.

  **Note on the First Branch:**
  The prompt requires the "No" answer on Q1 to route directly to the Austere view. Position 7 (Suffering-Focused) is placed deeper in the tree to distinguish their *reasoning* (prevention of harm) from the Austere view (nothing matters). Be prepared to discuss why a Suffering-Focused thinker might acknowledge a "loss" of potential lives (Q1=Yes) while still preferring extinction (Q4=Yes).
