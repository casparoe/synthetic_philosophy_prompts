answer: |-
  ### 1. Exam Question

  **Course:** Graduate Seminar in Value Theory and Population Ethics
  **Examination:** Final Essay
  **Time Allowed:** 90 Minutes
  **Word Count:** Approximately 1,200 words

  **Question:**

  Consider a policy choice between two mutually exclusive scenarios. **Scenario A** consists of a stable population of ten billion people, each existing at a welfare level of 100. **Scenario B** consists of the same ten billion people at welfare level 100, plus an additional one hundred billion lives existing at welfare level 1. In Scenario B, the additional one hundred billion lives are not suffering; however, they are described as *minimally conscious*. They possess only the barest subjective experience, such that it is genuinely contested whether they fall within the scope of person-affecting moral restrictions or possess full moral status.

  Standard total utilitarianism implies Scenario B is superior due to the aggregate sum of welfare. However, this intuition often conflicts with the judgment that adding vast numbers of barely conscious lives does not improve the outcome.

  Write an essay evaluating whether a **modified threshold-sensitive person-affecting totalism** can coherently block the preference for Scenario B without collapsing into either pure averageism or an arbitrary welfare cutoff. Your analysis must address whether the "minimal consciousness" framing introduces a distinct boundary problem regarding moral status that standard debates about welfare aggregation tend to ignore.

  In your response, clearly distinguish between logical structures that are broadly settled in population ethics (e.g., the mathematical implication of total aggregation) and claims that remain genuinely contested (e.g., the defensibility of person-affecting restrictions or the moral relevance of minimal consciousness). Do not rely on historical summaries or standard taxonomies; focus on the conceptual coherence of the proposed modified theory in light of the specific boundary conditions presented.

  ***

  ### 2. Model Answer

  The logical structure of the choice between Scenario A and Scenario B replicates the formal dynamics of the repugnant conclusion, a settled feature of population ethics: if value is strictly additive and every life has positive welfare, adding enough lives at any positive level outweighs a fixed population at high welfare. Totalism mandates choosing B. However, the intuition that A is preferable remains robust. The proposed theory, modified threshold-sensitive person-affecting totalism, attempts to reconcile this by restricting aggregation. To evaluate its coherence, one must distinguish between the mathematical inevitability of totalism and the contested normative justification for restricting it.

  The first challenge is explaining how the threshold modification functions without collapsing into averageism. A threshold view claims that only welfare above a certain level $T$ counts toward the total sum. If $T$ is set above 1, the one hundred billion lives in Scenario B contribute zero value, making A superior. However, this risks collapsing into averageism if the threshold is set too high, effectively ignoring the welfare of existing people below $T$. If the theory counts only *changes* to existing people (person-affecting), it faces the non-identity problem: the additional lives in B do not exist in A, so they are not harmed by exclusion. A modified person-affecting view must argue that bringing into existence lives below $T$ is neutral or negative, not positive. This is contested; totalists argue that positive welfare is inherently good, regardless of the level. The modified theory must justify why welfare at level 1 is morally inert without denying that welfare at level 100 is valuable.

  The second, more distinct challenge is the arbitrariness objection. If the threshold is based solely on welfare quantity, any cutoff appears arbitrary. Why is level 1 excluded but level 2 included? This is a standard objection to threshold views. However, the "minimal consciousness" framing introduces a boundary problem regarding moral status rather than mere welfare quantity. It suggests the threshold might not be about *how good* a life is, but *what kind* of subject is living it. If the additional billion lack the cognitive architecture required for person-affecting restrictions, they might fall outside the scope of moral aggregation entirely. This shifts the debate from welfare aggregation to moral status—a contested move. Standard aggregation debates assume all sentient beings count; this framing questions whether minimal consciousness suffices for counting.

  If the theory relies on moral status, it avoids the arbitrary welfare cutoff but faces a different contingency: the definition of personhood. If minimal consciousness excludes these lives from the total sum, the theory coherently blocks B. However, this risks excluding vulnerable existing populations who might also possess only minimal consciousness. To avoid this, the theory must distinguish between potential and actual status or argue that creating lives below a status threshold is impermissible even if maintaining them is not. This distinction is genuinely contested and lacks consensus.

  Ultimately, the coherence of modified threshold-sensitive person-affecting totalism depends on whether the boundary is defended as a matter of status or welfare. If welfare, it risks arbitrariness. If status, it risks excluding vulnerable groups or relying on contested metaphysical claims about consciousness. While the logical structure of the repugnant conclusion is settled, the solution remains open. The minimal consciousness framing offers a novel path by decoupling moral status from welfare levels, but it does not resolve the underlying tension without introducing new normative contingencies. Therefore, the theory can block the preference for B, but only by accepting contested premises regarding moral status that are as debatable as the totalist conclusion it seeks to avoid.

  ***

  ### 3. Marking Scheme

  **Total Points:** 25
  **Grading Structure:** Five analytical moves, weighted equally at 5 points each.

  | Analytical Move | Points | Typical Failure Mode |
  | :--- | :---: | :--- |
  | **1. Identification of Aggregation Tension**<br>Correctly identifies the settled logical structure (Totalism implies B > A) versus the intuitive rejection of B, without merely summarizing the history of the problem. | 5 | Treating the Repugnant Conclusion as a historical summary rather than a logical constraint on the proposed theory. |
  | **2. Explanation of Threshold Mechanism**<br>Articulates how the threshold modification attempts to exclude low-welfare lives from the sum and the specific person-affecting constraint applied to non-existent entities. | 5 | Confusing the threshold mechanism with average utilitarianism or failing to address the non-identity implication. |
  | **3. Analysis of Arbitrariness/Collapse**<br>Evaluates whether the threshold collapses into averageism or relies on an arbitrary welfare cutoff, distinguishing settled mathematical risks from contested normative justifications. | 5 | Asserting the cutoff is definitely arbitrary without exploring the normative defense, or denying the collapse risk entirely. |
  | **4. Engagement with Minimal Consciousness**<br>Addresses the distinct boundary problem: whether minimal consciousness affects *moral status* rather than just *welfare level*, and how this differs from standard aggregation debates. | 5 | Ignoring the "minimal consciousness" constraint and treating the lives as standard low-welfare persons. |
  | **5. Nuanced Conclusion on Contested Status**<br>Concludes on the theory's coherence while explicitly marking which premises are contested (e.g., status definitions) versus settled (e.g., logical implications), avoiding dogmatism. | 5 | Presenting a contested solution (e.g., "Person-affecting views are defensible") as the consensus or final truth. |

  **Grade Boundaries:**

  *   **A-Range (23–25 Points):** All five moves executed with precision. The candidate clearly distinguishes between settled logical structures and contested normative claims throughout. The analysis of the "minimal consciousness" boundary is sophisticated and integrated into the coherence evaluation.
  *   **B-Range (15–22 Points):** Competent analysis but missing or mishandling at least two of the analytical moves. Common B-range errors include conflating welfare thresholds with moral status boundaries, treating contested person-affecting restrictions as settled, or failing to address the arbitrariness objection deeply.
  *   **C-Range and Below (<15 Points):** Missing three or more analytical moves, significant conceptual errors regarding the logical structure of totalism, or reliance on summary rather than analysis.

  **Note on Settled vs. Contested Claims:**
  Examiners must penalize responses that present contested positions (e.g., "Totalism is irredeemable" or "Person-affecting views are the only coherent solution") as consensus. The Model Answer demonstrates the required distinction: it acknowledges the settled logic of aggregation while marking the defensibility of status boundaries as genuinely contested. Candidates who fail to maintain this distinction cannot score in the A-Range, regardless of writing quality.
