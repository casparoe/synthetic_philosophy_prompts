  # Joint Statement on Akrasia and Discounting

  ### 1. Agreed Claims

  1.  **Phenomenological Duality:** The Zero-Cost Guardrail data establishes two stable phenotypes (Faders, Strainers) distinguished not by choice patterns alone but by phenomenology and reaction to constraint. Any unified theory must account for this split.
  2.  ** insufficiency of Curve-Fitting:** Standard hyperbolic discounting models predict the choice reversal (LL at t0, SS at t1) but are agnostic regarding the t1 phenomenology (relief vs. annoyance). The discount curve describes the *when* of reversal, not the *how* of experience.
  3.  **Commitment Valuation:** An adequate theory must explain why commitment devices are valued at t0 by both groups but experienced differently at t1: as an aid (Faders) or an obstruction (Strainers).
  4.  **Data Integrity:** The Strainers' t1 report ("I know I shouldn't") cannot be dismissed as post-hoc confabulation given the robustness checks; it constitutes primary data regarding synchronic mental states that must be modeled, not explained away.
  5.  **Exponential Falsification:** Exponential discounting is falsified for both groups; the debate is strictly between hyperbolic mechanistic accounts (Discounter) and agency-based accounts (Agency Theorist) regarding the *mechanism* of the reversal.

  ### 2. Residual Disagreements

  | Issue | Discounter Formulation | Agency Theorist Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Nature of t1 Report** | The statement "I shouldn't" is a high-confidence prediction of t2 regret, misidentified as a t1 valuation due to introspective lag. | The statement "I shouldn't" is a genuine synchronic judgment that is overridden by motor impulse, evidencing fractured agency. | **Substantive.** Determines whether the mind is modeled as a single utility-maximizer with noise or a fragmented polity. |
  | **Locus of Pathology** | Akrasia is a calibration error in temporal weighting; the "will" is just the output of the winning sub-self. | Akrasia is a failure of executive integration; the "will" is a distinct capacity that can fail independently of weighting. | **Substantive.** Changes intervention targets from information architecture to cognitive training. |
  | **Faders' Mechanism** | Faders exhibit pure preference change; the SS utility genuinely exceeds LL utility at t1 due to discounting. | Faders exhibit attentional narrowing; the LL utility is occluded but remains normatively active. | **Verbal (mostly).** Disagreement hinges on defining "utility" as revealed choice vs. latent valuation. |

  ### 3. Cruxes

  **Crux 1: The Reality of t1 Judgment (Strainers)**
  *   **Question:** Is the Strainer's conflict a real-time competition between judgment and impulse, or a rapid oscillation between competing valuations?
  *   **Test:** **Forced Delay Intervention.** At t1, upon clicking SS, impose a mandatory 10-second lockout with a countdown timer before the choice registers. Measure self-reported urge intensity and choice completion rate.
  *   **Discounter Prediction:** Urge intensity will decay rapidly during the wait; completion rate will drop significantly as the discount curve flattens with delay. *Weakness:* If urges remain high despite cooling-off, the "calibration error" model fails.
  *   **Agency Prediction:** Urge intensity may remain high, but completion rate will drop because the delay re-engages executive oversight. *Weakness:* If the delay causes no change in completion rates, the "executive capacity" model is unsupported.

  **Crux 2: Faders' Attention vs. Preference**
  *   **Question:** Do Faders choose SS because they value it more (preference change) or because they fail to represent LL (attentional failure)?
  *   **Test:** **Salience Cueing.** At t1, highlight the LL payoff amount in bright red without changing the value or delay. Measure choice shift.
  *   **Discounter Prediction:** No significant shift in choice. The discounted value of LL is objectively lower than SS; visual salience does not alter the discount rate. *Weakness:* If salience alone reverses choices, the "fixed discount curve" model is falsified.
  *   **Agency Prediction:** Significant shift back to LL. The valuation was latent but occluded; cueing restores access to the t0 judgment. *Weakness:* If cueing fails to move behavior, the "occlusion" hypothesis is weak.

  ### 4. Practical Advice

  **Subject:** Mid-thirties, WFH, goal failure at 11pm.

  **Convergent Recommendations:**
  Both accounts agree that relying on willpower at t1 is unreliable given the data.
  1.  **Implement Guardrails:** Use software blockers (e.g., Cold Turkey) scheduled to activate at 10:30pm. Both Faders and Strainers valued these at t0.
  2.  **Increase Friction:** Move distractions physically out of reach. Increasing the "cost" of SS shifts the discount curve regardless of mechanism.

  **Divergent Recommendations:**
  1.  **Discounter Advice:** **Change the Choice Architecture.** Assume the 11pm self *wants* the distraction more than the goal. Do not try to resist; make resistance unnecessary. Hide the browser icon; log out of accounts. Treat the 11pm self as a different person with different preferences who must be constrained by the 9am self.
  2.  **Agency Theorist Advice:** **Train Executive Muscle.** Assume the 11pm self is capable of judging correctly but failing to act. Use the Guardrail not just as a lock, but as a cue. When the blocker hits, perform a 2-minute mindfulness check-in to re-align judgment with action. The annoyance Strainers feel at restriction is a signal to re-engage agency, not just a barrier to bypass.

  **Summary:** The Discounter advises building a cage the animal cannot escape. The Agency Theorist advises building a cage that reminds the animal it is human. Use the cage either way, but adjust your expectation of what happens inside it.
