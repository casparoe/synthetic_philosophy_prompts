answer: |-
  If Gödel had encountered the literature on Malament–Hogarth spacetimes in the early 90s, his reaction would likely have been a complex mixture of metaphysical vindication and physical skepticism. On the question of whether he would seize on these spacetimes to argue for the actuality of rotating universes as a home for non-mechanical cognition, the answer is probably no. Gödel's 1949 argument was fundamentally modal: he aimed to show that because laws of nature permit worlds without objective time, time cannot be an objective feature of reality even in our world. He did not need our universe to be rotating; he only needed rotating universes to be consistent with general relativity. 

  Moreover, the hypercomputation capability of Malament–Hogarth spacetimes would likely have disturbed him rather than emboldened him. Gödel's famous disjunction held that either the human mind infinitely surpasses any finite machine, or there exist absolutely undecidable mathematical problems. He leaned toward the former, preserving a role for mathematical intuition that transcends algorithmic procedure. But Malament–Hogarth spacetimes offer a physical mechanism for a machine to decide Turing-undecidable problems by exploiting infinite proper time within a finite causal reach. If such spacetimes were physically realizable, the mind would no longer need to be non-algorithmic to outrun a standard Turing machine; physics itself would provide the hypercomputational leverage. To protect the uniqueness of mental intuition, Gödel would likely have argued that while these solutions are mathematically consistent, they are physically inadmissible—perhaps due to instability or energy conditions—thereby keeping the Church-Turing thesis safe for physical machines and the mind's superiority intact.

  Regarding the second question, the hypercomputation story does not contradict his claim that there is no objective lapse of time in such worlds; in fact, it reinforces it. The Malament–Hogarth effect relies on the divergence between proper times along different worldlines in a fixed four-dimensional geometry. It does not require a global "now" or a flowing time; it requires only a static causal structure where one path is infinitely long and another is finite. For Gödel, this would simply be another illustration that what we call "time" is merely a coordinate-dependent measure of path length in a block universe. The "computation" does not happen in time; it is a feature of the worldline's geometry. He would likely conclude that while such spacetimes allow for extraordinary causal powers, they remain timeless in the absolute sense. The machine does not "become" smarter over time; the answer is simply there at the event of reception, determined by the global structure of the manifold. Thus, he would have welcomed Malament–Hogarth spacetimes as further evidence against the objective lapse of time, while rejecting them as viable arenas for physical cognition to safeguard the non-mechanical nature of the mind.
