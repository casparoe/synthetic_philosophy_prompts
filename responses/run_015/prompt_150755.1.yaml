      *Key insight:* Gödel argued time is ideal because possible worlds lack it. MH worlds lack global time too. So MH supports his metaphysics of time. But MH allows machines to do what Gödel thought minds did. This threatens his philosophy of mind. He would likely reject the physical realizability of MH to protect the uniqueness of mind, while accepting the modal lesson about time.

