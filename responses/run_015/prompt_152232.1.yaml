prompt: |-
  ok so some context first. I'm in 11th grade and me and my friend Malik got into this really dumb argument in debate club about translation apps. He's like "obviously they understand language now, look at the output," and I'm like "no they don't, it's autocomplete with a dictionary stapled to it." Then my english teacher (she has weird hobbies) sent me this old essay by that cognitive scientist guy — Hofstadter I think? — where he goes on about how shallow machine translation is, and her favorite bit was something like a sentence with "the box is in the pen" getting rendered into french as if pen meant a ballpoint pen instead of a playpen, the point being that a program with no clue what boxes, pens or babies are could never sort that out. That felt really convincing for about a day and then I tried it and the current apps get it right, so now I don't know what to think and I want a sharper version of the argument.

  So here's the sharper version I came up with, tell me if it's cheating. Imagine a translation system that is as good as it is possible to be at going between English and Japanese: native speakers can't distinguish its output from a human translator's, it handles slang, puns, ambiguity, the pen/playpen thing, all of it. But translating is literally the only thing it can do. Hand it an English sentence and ask what it means and it can only produce Japanese; ask it to summarize that sentence, or say whether two English sentences mean the same thing, or follow an instruction like "translate this but leave out every word to do with animals," and it totally falls apart. A perfect phrasebook with nothing behind it. I've been calling it the locked-room translator (sry if its a dumb name).

  Here's what I actually want: your credence, as a number, that the locked-room translator understands English and Japanese. Not "it depends what you mean by understand" — I want the number and then the decomposition, because I think the number is made of parts that we could argue about separately. The parts I can see are: whether a system like that is even coherent, since Malik thinks the abilities would "leak" and anything that good at translating would automatically be able to do the summarizing and question-answering if you asked it the right way, which honestly seems possible to me; whether understanding has to be one thing that's either there or not, instead of just a word for a bundle of abilities you can partly have; whether there's some extra ingredient — being conscious, or having actually encountered a pen, or wanting things — that has to be present no matter how flawless the behavior is; and whether the whole dispute is secretly just about a definition and Malik and I aren't really disagreeing. My teacher also muttered something about an old philosophy example with a made-up word that could mean either rabbit or rabbit-parts, which I think was meant to show translation might not have one right answer at all — throw that in if it belongs. Give each of those a rough probability and one line of why, say how they combine into your headline number, and then tell me which term the number is most sensitive to and which one you feel least confident about. And since Malik is at like 85% that it understands and I'm at like 25%, where do you think our real disagreement is actually living? Last thing: if somebody could somehow build this thing and run one experiment on it, what's the single result that would move you the most?
