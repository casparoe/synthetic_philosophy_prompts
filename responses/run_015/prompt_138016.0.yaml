answer: |-
  Here is the specification for a population axiology tailored to policy choice under uncertainty, followed by an evaluation of your candidates, the impossibility result, and the scorecard.

  ### I. The Specification: Desiderata for Policy Axiology

  The object of evaluation is a **risky prospect over histories** (a probability distribution over possible worlds, each containing a population with specific welfare levels). The axiology must output a ranking of these prospects to guide institutional choice.

  #### A. Non-Negotiable Requirements (Functional Adequacy)
  *These are required for the system to function as a decision guide for the job described.*

  1.  **Completeness (The Decision Constraint):** For any two policy options $A$ and $B$, the theory must yield $A \succeq B$, $B \succeq A$, or indifference.
      *   *Consideration:* An institution cannot act on "incomparable." If the theory declares options incomparable, it defaults to a tie-breaking rule (e.g., status quo bias), which must be explicit. For this specification, the axiology itself should minimize incomparability.
  2.  **Transitivity:** If $A \succeq B$ and $B \succeq C$, then $A \succeq C$.
      *   *Consideration:* Cycles allow money-pumps and render long-term planning incoherent.
  3.  **Risk-Integration:** The theory must explicitly define how to aggregate value across probabilities. It cannot simply rank deterministic outcomes and leave the risk component to an external decision theory (like Expected Utility Theory) unless it guarantees the value function is cardinally measurable and compatible with that decision theory.
      *   *Consideration:* Standard population axiologies rank *states*. You need one that ranks *lotteries over states*. If the view implies lexical thresholds, standard Expected Utility fails.
  4.  **Ontological Neutrality (Your Candidates 1 & 2):** The ranking must not depend on arbitrary metaphysical bookkeeping regarding the boundaries of persons or temporal stages.
      *   *Consideration:* Policy affects *when* and *how* people are individuated (e.g., IVF, life extension, digital minds). If the moral value changes based on whether we count a life as one person or four person-stages, the theory is gerrymandered by metaphysics rather than welfare.
  5.  **Epistemic Robustness (Your Candidate 3):** The ranking must not be dominated by low-probability, high-value tails where probability estimates are essentially noise ("cluelessness").
      *   *Consideration:* If the optimal policy is always determined by $10^{-50}$ probabilities of creating $10^{60}$ lives, the theory is unusable for human agents with bounded rationality and noisy data. It must converge on verdicts driven by the *robust* mass of the probability distribution.

  #### B. Camp Preferences (Substantive Moral Intuitions)
  *These are desirable moral properties, but different camps trade them off. You must choose which to sacrifice.*

  6.  **Non-Repugnance:** The theory should not rank a world of vast population with barely worthwhile lives as better than a world of smaller population with excellent lives.
      *   *Camp:* Intuitionist / Quality-focused.
  7.  **Non-Sadism:** The theory should not rank adding a population with negative welfare (suffering) as better than adding nothing, or prefer adding suffering people over happy people to balance an average.
      *   *Camp:* Humanitarian / Suffering-focused.
  8.  **Strong Dominance (Pareto):** If option $A$ is better for every person who exists in both $A$ and $B$, and no one is worse off, $A$ should be preferred.
      *   *Camp:* Liberal / Rights-focused.
  9.  **Person-Neutrality:** The identity of the people does not matter, only their welfare and number. (Rejects strong Person-Affecting Views).
      *   *Camp:* Impartial Utilitarian.

  ---

  ### II. Evaluation of Your Candidates

  1.  **Grain-invariance:** **Keep and Sharpen.**
      *   *Status:* Non-Negotiable.
      *   *Refinement:* This is not just about "redescription"; it is a demand that the value function be **integral rather than summative**. If value accrues over time, it must be invariant to the temporal discretization. If a view sums value per "person," it fails this when personhood is vague. This requirement excludes most standard "per capita" views unless they are reformulated as density functions over welfare-time.
  2.  **Individuation-robustness:** **Merge with Grain-invariance.**
      *   *Status:* Non-Negotiable (as part of Ontological Neutrality).
      *   *Refinement:* This is a specific instance of Grain-invariance applied to metaphysical vagueness (splitting/merging). If you satisfy Grain-invariance (value is continuous over welfare-mass, not discrete per head), this is automatically satisfied. Do not treat it as a separate constraint; treat it as the stress-test for the first.
  3.  **Actionability under cluelessness:** **Keep as Epistemic Robustness.**
      *   *Status:* Non-Negotiable for *policy*, though often rejected by pure theorists.
      *   *Refinement:* This is not impatience; it is a stability condition. A theory that yields verdicts highly sensitive to higher-order uncertainty in probability estimates is functionally broken for an advisor. This requirement effectively bans **lexical views** (which create infinite discontinuities) and **unbounded value functions** (which invite fanaticism) unless paired with a decision theory that discounts tail risk.

  ---

  ### III. The Impossibility Result

  You suspected a conflict between avoiding the Repugnant Conclusion (RC), honouring Mere Addition, and maintaining Transitivity/Completeness. For your specific job (policy under uncertainty), the conflict is sharper.

  **The Inconsistent Quad:**
  The following four requirements are jointly unsatisfiable for a population axiology designed for risky choice:

  1.  **Completeness:** All options can be ranked.
  2.  **Dominance:** If a prospect is better for all existing people, it is better overall.
  3.  **Non-Repugnance:** There is some quality of life so high that no amount of low-quality lives can outweigh it.
  4.  **Continuity (for Risk):** Small changes in probability do not cause radical flips in ranking (required for Expected Utility or similar risk integration).

  **The Argument:**
  To avoid the Repugnant Conclusion (3), you generally need a **lexical** view (high welfare is infinitely more valuable than low welfare) or a **non-linear** aggregation (e.g., geometric discounting of numbers).
  *   If you choose **Lexicality**: You violate **Continuity** (4). A tiny probability of a lexical good outweighs a certainty of a non-lexical good. This makes risk assessment unstable and violates Epistemic Robustness (your Candidate 3).
  *   If you choose **Non-linear Aggregation** (e.g., Critical-Level or Average): You generally violate **Dominance** (2) (e.g., the Sadistic Conclusion or Mere Addition Paradox) or you fail **Transitivity** in different-number cases (Arrhenius's Theorems).
  *   If you choose **Completeness** (1) + **Continuity** (4) (standard Expected Utility): You are forced into a linear value function over welfare, which entails **Total Utilitarianism**, which entails the **Repugnant Conclusion** (violating 3).

  **The Exclusionary Requirement:**
  **Continuity (for Risk)** does the most work in excluding candidate views.
  Most intuitive ways to avoid the Repugnant Conclusion (lexical thresholds, discontinuous value) break the continuity required to handle risk sensibly. If you demand a theory that handles risk via standard probability weighting, you are pushed inexorably toward Total Utilitarianism and the Repugnant Conclusion. If you demand Non-Repugnance, you must accept that some policy choices under uncertainty will be incomparable or discontinuous (violating Completeness or Continuity).

  ---

  ### IV. Scorecard

  | View | Non-Repugnance | Dominance / Non-Sadism | Completeness / Transitivity | Epistemic Robustness | Ontological Neutrality |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** | **FAIL** (Entails RC) | Pass | Pass | **FAIL** (Fanaticism) | Pass (if integral) |
  | **Average Utilitarianism** | Pass | **FAIL** (Sadistic Conclusion) | Pass | **FAIL** (Sensitive to small N) | **FAIL** (Denominator issues) |
  | **Critical-Level (CLU)** | Conditional (Depends on $c$) | **FAIL** (Sadistic or RC returns) | Pass | **FAIL** (Fanaticism remains) | Pass (if integral) |
  | **Person-Affecting** | Pass | Pass | **FAIL** (Incomparability/Cycles) | Pass (ignores non-existent) | **FAIL** (Relies on identity) |

  **The Requirement None of Them Meet:**
  **Ontological Neutrality under Vagueness.**
  While Total and Critical-Level views *can* be reformulated as integrals to satisfy Grain-invariance, none of the standard formulations in the literature handle **Individuation-robustness** (your Candidate 2) satisfactorily. They all presuppose a fact of the matter about "how many persons" exist. If persons can split/merge continuously (software minds, fission cases), the "count" $N$ in $N \times W$ (Total) or $W/N$ (Average) becomes undefined.
  *   *Total Utilitarianism* breaks because the sum depends on how you slice the continuum.
  *   *Average Utilitarianism* breaks because the denominator is vague.
  *   *Person-Affecting Views* break because "same person" relations are vague.

  To meet your specification, a view must not sum over *persons* but over *welfare-mass* or *conscious moments* without requiring discrete individuation, **and** it must solve the Continuity/Non-Repugnance conflict without resorting to fanaticism. No extant view fully satisfies this conjunction.
