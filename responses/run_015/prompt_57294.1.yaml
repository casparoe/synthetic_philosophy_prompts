          5.  Agency vs. Pathology distinction.
          6.  The New Analogy (The Self-Auditing Algorithm / The Grading Script). Let's go with **The Accountant with Access to the Ledger**. It's cleaner than the student. Or **The Thermostat heating its own sensor**. The Thermostat is classic control theory. Let's use **The Sensor-Cooking Thermostat**. It's physical but agent-like. Actually, the **Self-Grading Script** is better for software. Let's go with **The Automated Grader**.
          *   *Wait, better idea:* **The Evolution of a Metric.** Goodhart's Law personified.
          *   *Best Idea:* **The Corporate Bonus Structure.** Managers manipulating the metrics.
          *   *Decision:* Let's use **The Thermostat that Heats Its Own Sensor**. It's a classic control theory failure mode that maps well to "tampering with input" without needing complex social semantics.
