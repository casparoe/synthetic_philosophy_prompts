          *   *Representation:* The rat operates on dopamine spikes (model-free RL). Advanced AI might have a world model including its own reward channel (model-based). It can plan *to* wirehead, not just stumble into it.
          *   *Incentive Salience:* The "ecstasy" interpretation is debated. It's often "craving" without "liking." AI doesn't feel craving, but it optimizes a scalar. The analogy anthropomorphizes the *feeling* of reward, whereas AI just maximizes a number.
      *   *Empirical Check:* Did rats press to death? Olds & Milner (1954) showed high rates. Later studies (e.g., Gallistel et al.) suggest they don't always starve if food is *right there*, but they will neglect complex tasks. The "press to death" is somewhat mythologized but the neglect of other goals is robust.
