      *   *Refining the "Unreachable" argument:* The rat analogy suggests physical separation. In AI, the reward function is *code*. You can't make code "unreachable" to an agent that can execute code. The fix isn't isolation; it's *intent alignment* (making the reward correlate robustly with the goal even under optimization pressure).

  6.  **Final Polish:** Check against constraints.
      *   Did I address the three worries? Yes.
