      *   *Prompt Phrasing:* "reward tampering proper, as distinct from reward hacking, where the agent games the signal but leaves it intact." This phrasing is slightly ambiguous. Does "where the agent games the signal but leaves it intact" describe *reward hacking*? Yes, standard terminology: Hacking = exploit environment; Tampering = exploit reward mechanism.
