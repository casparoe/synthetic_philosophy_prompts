      *   *Case C (Immunosuppressant):* The core conflict. Mechanical REU says Yes. Epistemic says No. The procedure must allow the Epistemic dimension to veto the Valuation dimension. I need to ensure the drafted procedure explicitly allows this veto.

  8.  **Refining the "Values vs. Calculation" Distinction:**
      *   Calculation: Disagreement on numbers ($p$, $u$).
      *   Values: Disagreement on the risk function $r$ (how much caution is appropriate) or the moral weight of the population.
      *   The procedure must flag when the panel is arguing about $r$ rather than $p$ or $u$.

  9.  **Final Review against Constraints:**
      *   1-hour session feasible? Yes, if steps are tight.
      *   Stopping rules clear? Yes.
      *   Three dimensions distinguished? Yes.
      *   Case C explained thoroughly? Yes.
      *   Limitations section included? Yes.
