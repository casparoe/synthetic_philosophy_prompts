      *   Standard Expected Utility (EU): $\sum p_i \cdot u(x_i)$.
      *   Risk-Weighted EU (Buchak): $\sum r(p_i) \cdot u(x_i)$ (simplified representation, actually involves cumulative probabilities and a risk function $r$).
      *   *Crucial distinction for the panel:* Utility ($u$) = How good/bad the outcome is. Probability ($p$) = Likelihood. Risk Function ($r$) = Attitude towards the risk (cautious vs. bold).
      *   *Adaptation:* Clinical ethics isn't pure maximisation. It involves thresholds (do no harm) and rights. The procedure needs to embed REU logic without requiring the panel to do complex calculus. It needs to be a *heuristic* based on REU principles.

  3.  **Drafting the Procedure (The "REU-Clinical Protocol"):**
      *   *Structure:* Needs to be sequential.
      *   *Time:* 1 hour max. So, 4-5 stages.
      *   *Inputs:* Need to define what the panel actually votes on or estimates.
      *   *Dimensions:*
          1.  *Valuation (Utility):* Is the potential benefit worth the potential harm?
          2.  *Epistemic (Probability):* How sure are we of the numbers?
          3.  *Moral (Vulnerability):* Does the patient's status change the risk tolerance?
      *   *Stopping Rules:*
          *   Reject: Harm outweighs benefit even under optimistic risk weighting.
          *   Approve: Benefit outweighs harm, epistemic confidence high, moral constraints met.
          *   Values Halt: Disagreement on the *risk function* itself (how cautious to be) or fundamental utility incommensurability.

      *   *Refining the REU aspect:* In REU, a risk-averse agent downweights the probability of the best outcome. A risk-seeking agent upweights it. In clinical ethics, we are generally risk-averse regarding harm (safety) but potentially risk-seeking regarding desperate cures (compassionate use). The procedure needs to ask: "What is our risk attitude for *this* class of outcome?"

  4.  **Developing the Three Dimensions:**
      *   *Dimension 1 (REU Valuation):* Calculate a "Risk-Adjusted Balance".
      *   *Dimension 2 (Epistemic):* Confidence intervals, quality of evidence. If confidence is low, the effective probability is discounted.
      *   *Dimension 3 (Moral):* Vulnerability (children, cognitively impaired) tightens the risk function (more aversion to harm). Autonomy (competent adults) loosens it (allows more risk).

  5.  **Addressing Case C (The Trap):**
      *   Case C highlights the "Reference Class Problem". The math says "Go", but the physics/science background says "The $p$ values are invalid for this group."
      *   *Solution within framework:* This falls under Dimension 2 (Epistemic). If the probability estimates are not transferable, the input $p$ is invalid. The procedure must have a "Validity Check" before the calculation.
      *   *Mechanism:* The "Epistemic Stop Rule". If the mapping from evidence to patient is scientifically unsound, the probability input is rejected, halting the calculation.

  6.  **Writing the Procedure (Iterative refinement for tone and clarity):**
      *   Use British English (e.g., "programme", "centre", "paediatric").
