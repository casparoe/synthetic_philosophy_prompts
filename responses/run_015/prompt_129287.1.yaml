      *   *Wait, the user wants REU specifically.* I need to make sure I don't just dilute it into standard risk management. I need to explicitly mention the *weighting function*.
      *   *Adjustment:* In Stage 1, define the "Risk Attitude". Are we weighting the best case heavily (hope) or the worst case heavily (caution)? This sets the $r$-function.
      *   *Case C Fix:* The procedure needs a "Transferability Check" in the Epistemic phase. If the population doesn't match, $p$ is undefined, not just low confidence.

  11. **Final Polish:** Check tone. Respectful of the user's expertise (physicist/philosopher) but practical for the clinicians. Ensure the distinction between *risk* (probability) and *risk attitude* (weighting) is clear.

  *(Self-Correction on Case C)*: The prompt asks me to explain *why* the framework produces a result the user is inclined to reject and if there is an internal mechanism to override it. I must ensure the procedure *I design* has that mechanism, otherwise I fail the prompt's requirement to "design such a procedure... Then apply the procedure". If I design a rigid procedure that fails Case C, I haven't solved the user's problem. The procedure *must* have an epistemic veto.

