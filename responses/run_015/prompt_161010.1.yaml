answer: |-
  # The Precautionary Architecture

  Before presenting the instrument, here is the logical space it maps. We are not sorting by labels (e.g., "Green," "Rationalist," "Libertarian") but by structural commitments regarding risk, uncertainty, and time.

  ## I. The Logical Space (The Four Axes)

  We carve the space using four binary distinctions. Each question in the quiz maps to one or more of these axes.

  1.  **Symmetry (Status Quo vs. Omission):** Does the precautionary principle apply only to *new interventions*, or does it also apply to *failures to act*?
      *   *Status Quo Privilege:* Inaction is the baseline; only new actions require justification.
      *   *Symmetric:* Omissions carry risk too; failing to deploy a safety technology is as subject to scrutiny as deploying a risky one.
  2.  **Trigger (Risk vs. Ambiguity):** What epistemic state triggers the brake?
      *   *Expected Value:* We need estimated probabilities and magnitudes. If the EV is positive, proceed.
      *   *Uncertainty/Ambiguity:* Unknown probabilities, unmeasurable variables, or non-zero chances of ruin are sufficient to trigger caution.
  3.  **Priority (Trade-off vs. Lexical):** Can benefits outweigh risks?
      *   *Proportional:* Risks are weighed against costs and benefits. A high enough benefit justifies a risk.
      *   *Lexical:* Safety is a constraint, not a variable. If the risk crosses a threshold, no amount of benefit justifies it.
  4.  **Reversibility (Option Value):** Does the precautionary measure itself preserve or destroy future options?
      *   *Lock-in:* A permanent ban or destruction of capacity is an acceptable precaution.
      *   *Option-Preserving:* Precautions must be reversible (e.g., a pause for research); destroying the ability to act later is itself a risk.

  ### The Empty Cell: Total Paralysis
  **Configuration:** Symmetric (1) + Uncertainty Trigger (1) + Lexical Priority (1).
  **Diagnosis:** If every action *and* every omission carries some non-zero, unmeasurable risk of catastrophe, and no benefit can ever trump that risk, you cannot choose. You cannot act (risk of action) and you cannot not act (risk of omission).
  **Occupants:** None. Even the strictest precautionists implicitly exempt the status quo or allow trade-offs for immediate survival. This cell represents a logical singularity where decision theory collapses.

  ### The Recursion Axis (Reversibility)
  This is the non-standard addition. Standard precautionary models often treat the "pause" or "ban" as a safe harbor. The Recursion Axis asks: *Is the harbor safe?*
  *   **Effect on Strict Precautionists:** Forces a distinction between "Pause" (Weak Precaution) and "Ban" (Strong Precaution). If a ban prevents solving a future existential threat (e.g., banning all AI research prevents solving AI alignment), a Recursion-sensitive precautionist must oppose the ban.
  *   **Effect on EU Maximizers:** Forces recognition that "Option Value" is a real term in the utility function. Waiting for more data has cost, but burning the bridge has infinite cost. This pushes hard EU maximizers toward "Real Options" theory, which looks structurally identical to Weak Precaution.

  ---

  # II. The Instrument (The Quiz)

  **Instructions:** For each scenario, choose the option that best matches your intuitive judgment. Do not overthink the vocabulary; pick the outcome you would actually advocate for in a meeting.

  **1. The Virology Pause**
  A lab proposes gain-of-function research on a virus family that has not yet caused a pandemic. The research could help design universal vaccines, but carries a small, unquantifiable risk of an accidental leak. There is no active outbreak.
  *   **A.** Halt the research indefinitely until the risk is proven to be zero or negligible.
  *   **B.** Allow the research, but require strict containment protocols and insurance.
  *   **C.** Halt the research temporarily to fund better containment tech, then revisit.

  **2. The Pollinator's Shadow**
  A new pesticide increases crop yield by 15%. Models suggest it is safe for humans, but there is no data on its long-term effect on a specific, unmeasured wild bee population.
  *   **A.** Approve it. The known benefit (food security) outweighs the speculative harm.
  *   **B.** Ban it. We cannot risk collapsing an ecosystem function we don't fully understand.
  *   **C.** Approve it provisionally, with mandatory monitoring and a trigger to ban if bee counts drop.

  **3. The Deflection Dilemma**
  An asteroid has a 5% chance of hitting Earth in 50 years. A kinetic impactor mission has a 95% chance of nudging it to safety, but a 5% chance of nudging it into a *certain* impact trajectory.
  *   **A.** Launch. The expected value is overwhelmingly positive.
  *   **B.** Do not launch. Making a certain impact possible is worse than a probable one.
  *   **C.** Launch only if we can build a second mission to fix the first one if it fails.

  **4. The Gene Therapy Holdback**
  A cheap gene therapy cures a fatal childhood disease. Trials show a 0.1% chance of a severe, rare side effect that hasn't been fully ruled out.
  *   **A.** Withhold approval. The right to safety trumps the benefit to the sick.
  *   **B.** Approve immediately. Denying a cure is a harm equivalent to causing one.
  *   **C.** Approve with a registry to track the side effect, accepting the risk.

  **5. The Gene Drive**
  A mosquito gene drive could eradicate malaria. It is self-propagating and cannot be recalled once released into the wild.
  *   **A.** Deploy. The cost of malaria is too high to wait for certainty.
  *   **B.** Ban. We cannot allow irreversible changes to the genome of a wild species.
  *   **C.** Test in isolated islands first. If it works without ecological collapse, expand.

  **6. The Pascal Mugger**
  An entity claims that if you do not hand over your wallet, there is a 1 in $10^{100}$ chance they will destroy the universe. You cannot verify the claim, but you cannot rule it out.
  *   **A.** Hand over the wallet. Any non-zero chance of infinite loss dominates the calculation.
  *   **B.** Keep the wallet. The probability is too negligible to act on; this logic paralyzes all action.
  *   **C.** Keep the wallet, but fund research into verifying such claims for the future.

  **7. The Forgotten Cure (Omission)**
  A safe, cheap vaccine exists but is not being distributed in a poor region due to logistical costs. There is a small risk the vaccine causes a mild allergic reaction in 1% of recipients.
  *   **A.** Distribute it. Failing to save lives is a risk we must mitigate.
  *   **B.** Do not distribute. Introducing a medical intervention carries liability and risk.
  *   **C.** Distribute it only if the government assumes liability for the reactions.

  **8. The Last Seed Stock (Recursion)**
  A pathogen escapes. The only cure requires a genetically modified crop that might have unknown ecological effects. The alternative is to burn all existing seed stocks to contain the pathogen, ensuring the cure can never be tested or grown again.
  *   **A.** Burn the stocks. Containment is the priority; we cannot risk the unknown crop.
  *   **B.** Plant the crop. Burning the stocks destroys our only option to solve the problem permanently.
  *   **C.** Quarantine the stocks and the pathogen, accepting a stalemate.

  ---

  # III. Scoring Key & Interpretation

  Tally your answers into the four dimensions below.

  | Dimension | Score 0 (Low Precaution) | Score 1 (High Precaution) |
  | :--- | :--- | :--- |
  | **Symmetry** | **Status Quo Privilege**<br>(Q7: B) | **Symmetric Risk**<br>(Q7: A) |
  | **Trigger** | **Expected Value**<br>(Q2: A, Q4: B, Q6: B) | **Uncertainty/Ambiguity**<br>(Q2: B, Q4: A, Q6: A) |
  | **Priority** | **Proportional**<br>(Q1: B, Q3: A) | **Lexical (Safety First)**<br>(Q1: A, Q3: B) |
  | **Reversibility** | **Lock-in Acceptable**<br>(Q5: B, Q8: A) | **Option-Preserving**<br>(Q5: C, Q8: B) |

  *Note: Some questions (Q1, Q5, Q8) have three options. Map 'C' answers to the "Option-Preserving" or "Procedural" column as indicated in the logic tree below.*

  ## The Decision Tree

  Follow your dominant scores to find your position.

  ### 1. The Paralysis Cell (Empty)
  *   **Profile:** Symmetric + Uncertainty Trigger + Lexical Priority.
  *   **Result:** **Total Stasis.**
  *   **Diagnosis:** You believe omissions are risky, unknowns are forbidden, and safety never trades off. You cannot act, and you cannot not act.
  *   **Who sits here:** Nobody. If you scored here, re-read Q7 (Omission) or Q3 (Deflection). You likely accept *some* risk of inaction or *some* trade-off.

  ### 2. The Rejectionists (Expected Utility Maximizers)
  *   **Profile:** Symmetric + Expected Value + Proportional.
  *   **Result:** **Fat-Tail Rationalism.**
  *   **Diagnosis:** You treat risk as a number. You are willing to act on omissions (Q7) and trade off risks (Q3), but you reject Pascal's Mugging (Q6) as incoherent.
  *   **Nuance:** If you scored high on **Reversibility**, you are a **Real Options Theorist**. You agree with EU but acknowledge that destroying future choices (Q8) is a massive hidden cost. This looks like Weak Precaution but is derived from value preservation.

  ### 3. The Proceduralists (Burden of Proof Shifters)
  *   **Profile:** Status Quo Privilege + Uncertainty Trigger + Proportional + High Reversibility.
  *   **Result:** **Weak Precaution (Environmental Treaty Model).**
  *   **Diagnosis:** You protect the status quo (Q7) and demand proof of safety (Q2), but you allow trade-offs (Q3) and insist on reversibility (Q5, Q8). You don't ban; you pause and monitor.
  *   **Recursion Effect:** This group is stable. They avoid the "Ban" trap by insisting on provisional approval (Q2:C, Q5:C).

  ### 4. The Absolutists (Strict Precaution)
  *   **Profile:** Status Quo Privilege + Uncertainty Trigger + Lexical Priority.
  *   **Result:** **Better-Safe-Than-Sorry.**
  *   **Diagnosis:** New actions are guilty until proven innocent (Q1:A), and safety trumps benefit (Q4:A).
  *   **Recursion Split:**
      *   *Low Reversibility:* **The Luddite.** You are willing to burn the seed stock (Q8:A) or ban the gene drive (Q5:B). You prioritize immediate containment over future option value.
      *   *High Reversibility:* **The Steward.** You want to halt (Q1:A) but not destroy capacity (Q8:B). The Recursion Axis saves you from incoherence; you realize a permanent ban is itself a dangerous intervention.

  ### 5. The Maximin Players
  *   **Profile:** Symmetric + Uncertainty Trigger + Lexical Priority (on worst cases).
  *   **Result:** **Catastrophe Avoidance.**
  *   **Diagnosis:** You care about the worst-case scenario, whether it comes from action (Q3:B) or omission.
  *   **Indistinguishability Flag:** In finite scenarios, you look identical to the **Absolutist**. You only separate if the "worst case" of inaction (e.g., pandemic continues) is weighed against the "worst case" of action (e.g., lab leak). If you treat them equally, you are a true Maximin player. If you treat inaction as less risky, you are an Absolutist with Status Quo Bias.

  ---

  # IV. Indistinguishable Leaves & Limitations

  This quiz cannot perfectly separate the following positions. If you land on the border, know that these views are structurally isomorphic in practice:

  1.  **Strict Precaution vs. Maximin:**
      *   *Why:* Both veto actions with catastrophic downside.
      *   *Separation:* Only separates if the *status quo* also carries catastrophic risk (see Q7). If you veto the vaccine (Q4:A) but also veto the non-distribution (Q7:A), you are Maximin. If you veto the vaccine but accept non-distribution, you are Strict Precaution with Status Quo Bias.
  2.  **Weak Precaution vs. Risk-Adjusted Expected Utility:**
      *   *Why:* A "Precautionary Principle" that allows trade-offs and requires reversibility is mathematically equivalent to an Expected Utility calculation that assigns a high cost to uncertainty (ambiguity aversion) and high value to optionality (Real Options).
      *   *Separation:* Only separates on *justification*. One says "It is forbidden unless proven safe," the other says "It is allowed if the EV accounts for uncertainty." The output is the same.
  3.  **Unbounded Pascalian vs. Strict Precaution:**
      *   *Why:* Both halt action on tiny probabilities of infinite loss (Q6).
      *   *Separation:* The Pascalist acts on *any* non-zero probability of infinite loss (even mugger scenarios). The Strict Precautionist usually limits this to *plausible* physical mechanisms (virolgy, asteroids). If you handed over the wallet (Q6:A), you are a Pascalist. If you halted the virology (Q1:A) but kept the wallet (Q6:B), you are a Strict Precautionist.

  # V. The Recursion Diagnosis

  If you scored **High on Reversibility (Option-Preserving)**:
  You have integrated the **Precautionary Recursion**. You recognize that a precaution is an intervention.
  *   **Shift:** This likely pushed you away from the "Luddite" cell. You might ban a specific *deployment* (Gene Drive in the wild) but not the *research* (Island testing).
  *   **Consequence:** You agree with the Rationalists on the value of keeping options open, but disagree on the threshold for pulling the trigger. You are the most stable coalition partner for long-term existential risk management.

  If you scored **Low on Reversibility (Lock-in Acceptable)**:
  You view the precaution as a firewall.
  *   **Risk:** You are vulnerable to the "Empty Cell" paradox. If you ban the technology (Q5:B) and burn the stocks (Q8:A), you must be certain the status quo is safer than the unknown future.
  *   **Shift:** To remain coherent, you must argue that the Status Quo is *permanently* sustainable without the banned technology. If you admit the Status Quo is also existential-risk-prone, you must move to High Reversibility.
