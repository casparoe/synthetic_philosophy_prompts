prompt: |-
  I chair the clinical ethics committee at a large teaching hospital trust. We meet fortnightly, consider three or four referrals a month — mostly from intensive care, paediatrics and oncology — and produce a one-page opinion that goes into the patient's record and is increasingly read by people who were not in the room. Almost every referral reaches us already labelled "an ethical dilemma", and the word has become useless: it covers everything from two clinicians disagreeing about a prognosis to cases where, as far as anyone can tell, someone is wronged whichever option is taken. I want a procedure, not an essay.

  What I am asking for is a decision procedure my committee can actually run: the questions, in a fixed order; what should count as a sufficient answer to each; where the procedure stops and returns a verdict of "not a dilemma"; where it escalates because the remaining question is one of values rather than of analysis. It has to be runnable in about an hour by people with no philosophical training, myself included, and written so that the output is defensible in a record.

  The distinctions I most need it to draw are these: an epistemic or informational difficulty masquerading as a conflict of values; a hard weighing of considerations that nonetheless has a correct answer; a clash between what someone ought to do and something merely admirable or self-sacrificing; a conflict manufactured by the institution's own rules, rotas or resource limits, which I would rather have routed back to management than resolved as though it were ethical; and, if anything is left over, a genuine dilemma in the strict sense — incompatible requirements, such that moral residue attaches to the agent whatever is done. Please include a step that re-describes the conflict at the level of the reasons rather than of the options, to check whether the opposition survives the re-description, and a step that asks whether an ideally informed and impartial deliberator, re-running the reasoning, would converge on one option. Someone suggested to me that the second of these is doing more philosophical work than it appears to; if so, say so plainly, and say what it presupposes. Mark clearly the points at which the procedure must hand the decision to a particular person — the chair, the treating consultant, the patient or family — because no further analysis settles it.

  Then run it on three referrals: one remaining intensive care bed and two patients with comparable claims on it; a sixteen-year-old refusing a blood transfusion on religious grounds with her parents and the clinical team in favour of treating and a live dispute about her capacity; and a family asking the team to withhold a cancer diagnosis from the patient. At least one of these should come out somewhere the committee will dislike — my colleagues treat the first as the paradigm dilemma, and I suspect the procedure will say something less comfortable than that.

  Two further constraints. Please ground the steps in what is actually argued about these cases rather than in common sense, but do not give me citations, a bibliography or a reading list: nothing I can follow up, and I would have no way of checking it. And separate what is settled from what is genuinely contested among people who work on this — I have the impression that whether "ought" implies "can" settles the matter against genuine dilemmas, and whether moral residue is evidence of real wrongdoing rather than of difficulty, are both live disputes, and I do not want a contested view presented to me as the consensus. Where the procedure is likely to misfire, say where and why. I would be grateful for British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a clinical ethics committee (CEC) at a large teaching hospital trust.
      *   **Context:** Fortnightly meetings, 3-4 referrals/month (ICU, Paeds, Oncology). One-page opinion for records. Referrals often mislabelled as "ethical dilemmas."
      *   **Goal:** A runnable *decision procedure* (not an essay). Fixed order questions, sufficiency criteria, stop points ("not a dilemma"), escalation points (values vs. analysis), handover points (who decides).
      *   **Time/Expertise:** Runnable in ~1 hour by non-philosophers. Defensible in records.
      *   **Key Distinctions to Draw:**
          1.  Epistemic/informational difficulty vs. value conflict.
          2.  Hard weighing with a correct answer vs. genuine dilemma.
          3.  Obligation vs. supererogation (ought vs. admirable).
          4.  Institutional/Resource conflict (management issue) vs. ethical conflict.
          5.  Genuine dilemma (incompatible requirements, moral residue).
      *   **Specific Steps Required:**
          *   Re-describe conflict at the level of *reasons* (not options).
          *   Ask about an "ideally informed and impartial deliberator" (convergence test).
          *   Note philosophical baggage of the convergence test.
          *   Mark handover points (Chair, Consultant, Patient/Family).
      *   **Test Cases:**
          1.  ICU Bed Allocation (1 bed, 2 patients).
          2.  16-year-old refusing blood (religious, parents/team want treatment, capacity disputed).
          3.  Family requesting non-disclosure of cancer diagnosis.
      *   **Constraint:** At least one output should be uncomfortable/unexpected (specifically hinting the ICU case might not be a "dilemma" in the strict sense).
      *   **Constraint:** Ground in actual arguments, no citations/bibliography.
      *   **Constraint:** Separate settled vs. contested theory (e.g., "ought implies can", moral residue).
      *   **Constraint:** British English.
      *   **Constraint:** Note where the procedure might misfire.

  2.  **Deconstruct the "Decision Procedure":**

      *   *Structure:* Needs to be a flowchart or numbered algorithm. Numbered is better for text.
      *   *Tone:* Clinical, precise, authoritative but acknowledging limits.
      *   *Philosophy:* Needs to embed ethical reasoning without jargon. The "ideally informed deliberator" is essentially a Rawlsian ideal observer or a coherence test. I need to flag the presupposition (moral realism/objectivity).
      *   *The "ICU Bed" Challenge:* The user suspects the procedure will say this isn't a dilemma. Why? Because if there's a triage protocol, it's an application of rules (administrative/clinical), not an ethical *dilemma* (incompatible moral requirements). If there's *no* protocol, it's a policy gap (management issue). A genuine dilemma requires *moral* incompatibility, not just scarcity. I need to ensure the procedure filters this out.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Triage/Definition.* Is this actually ethics? Or just lack of info/law/policy?
      *   *Step 2: Re-description.* Move from "Option A vs Option B" to "Reason X vs Reason Y".
      *   *Step 3: Institutional/Resource Check.* Is this caused by rules/rota/beds? If so, kick to management.
      *   *Step 4: Obligation Check.* Is one option merely "nice" (supererogatory)? If so, drop it.
      *   *Step 5: The Convergence Test.* Would an ideal deliberator agree? (Flag the philosophy here).
      *   *Step 6: Handover.* Who decides?
      *   *Step 7: Verdict.* Dilemma vs. Difficulty.

      *Refining the "Ideal Deliberator" Step:* The prompt asks to note if this does more work than it appears. It presupposes moral realism (that there is a truth to be found). If one is a moral anti-realist, this step is nonsense. I must state this clearly.

      *Refining the "ICU Bed" Case:* Standard triage says "sickest/most benefit". If both are equal, tie-breakers exist (lottery, first-come). If the protocol exists, it's not a dilemma. If the protocol is absent, it's a policy failure. The procedure should route this away from "ethical dilemma."

      *Refining the "16-year-old" Case:* In the UK (implied by "Trust", "British English"), 16-17 year olds can consent but refusal can be overridden in best interests (Gillick/Fraser nuances, but specifically Family Law Reform Act 1969 + Mental Capacity Act nuances/Case Law). If capacity is disputed, it's a *legal/clinical* determination, not an ethical dilemma. The ethics kicks in only *after* capacity is settled. If she lacks capacity, best interests apply. If she has capacity, her refusal stands (with some nuance in life-saving cases for minors, but generally 16+ have strong rights). Actually, for 16-17s in UK, refusal can be overridden by Court/Parents in life-threatening situations. This is a legal boundary, not an ethical dilemma. The procedure needs to identify this as a *legal/competence* question first.

      *Refining the "Non-disclosure" Case:* This is a classic conflict between Autonomy (truth-telling) and Beneficence (non-maleficence/harm). This *is* likely a genuine ethical tension, though usually resolvable in favour of honesty unless immediate severe harm is proven.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the Chair's frustration. Set the ground rules.
      *   **The Procedure:** Numbered steps. Clear "Stop/Go" logic.
      *   **Philosophical Footnotes:** Address the "Ideal Deliberator" and "Moral Residue" controversies as requested.
      *   **The Test Cases:** Apply the procedure rigorously.
          *   *ICU:* Result: Not a dilemma (Resource/Policy issue).
          *   *Teen:* Result: Not a dilemma (Legal/Capacity threshold issue).
          *   *Disclosure:* Result: Ethical difficulty, potentially resolvable, maybe residual dilemma if harm is certain.
      *   **Limitations:** Where does it misfire?

  5.  **Review against Constraints:**

      *   *British English:* Check spelling (labelled, programme, centre, etc.).
      *   *No Citations:* Ensure no names (Kant, Mill, Rawls) or references appear in the main text.
      *   *Contested Theory:* Explicitly mark the "Ought implies Can" and "Moral Residue" debates.
      *   *Handovers:* Clearly state who holds the pen at the end.
      *   *Uncomfortable Output:* Ensure the ICU case is depathologised as a "dilemma".

  6.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the "Ideal Deliberator" step too abstract for a 1-hour meeting?
      *   *Fix:* Frame it as "If we had all the time and facts, would we still disagree?"
      *   *Critique:* The 16-year-old case is legally complex in the UK.
      *   *Fix:* Keep the procedure focused on the *ethical* categorisation. If the law dictates the outcome, it's not an ethical dilemma. The procedure must flag "Legal Determination Required" as a stop point.
      *   *Critique:* The user wants to know where the procedure misfires.
      *   *Fix:* Add a specific section on "Failure Modes".
      *   *Tone Check:* Ensure it sounds like a tool for a Chair, not a philosophy lecture. Direct, imperative mood.

  7.  **Final Polish:** Check the distinction between "Hard Weighing" (one right answer, hard to find) and "Genuine Dilemma" (no right answer, residue remains). This is crucial for the user's request about "moral residue".

      *(Self-Correction on the ICU case)*: The user says colleagues treat the ICU bed as the *paradigm* dilemma. If my procedure says it's *not*, that satisfies the "uncomfortable" constraint. I need to make sure the reasoning is solid: Scarcity + Protocol = Administration. Scarcity - Protocol = Management Failure. Neither is necessarily a *moral* dilemma in the strict sense of incompatible moral duties where both are valid. Usually, the duty is to follow the triage policy.

      *(Self-Correction on the 16yo case)*: In the UK, a 16-year-old's refusal can be overridden. If the team believes she lacks capacity, it's a clinical/legal call. If she has capacity, the law is tricky but generally leans towards protection of life for minors. The *ethical* conflict is often illusory because the legal framework resolves the "ought". I will classify this as a "Threshold Question" (Capacity/Law) that blocks it from being an ethical dilemma.

      *(Self-Correction on Non-disclosure)*: This is the strongest candidate for a genuine ethical tension, but often resolved by the presumption of honesty. I will frame it as a "Weighing" that usually resolves, but leaves residue.

  8.  **Final Output Structure:**
      1.  Preamble (Acknowledging the brief).
      2.  The Procedure (The Algorithm).
      3.  Philosophical Notes (The "baggage").
      4.  Application to Cases.
      5.  Failure Modes & Contested Ground.

      *Let's write.* (Mental check on British spelling: labelled, programme, centre, analyse, defence).

      *Wait, one detail:* "Mark clearly the points at which the procedure must hand the decision to a particular person." I need to embed this in the steps.

      *Another detail:* "Separate what is settled from what is genuinely contested." I will add a specific section for this after the procedure.

      *Okay, ready to generate.*
answer: |-
  **To:** The Chair, Clinical Ethics Committee
  **From:** [Consultant Name/Role]
  **Subject:** Decision Procedure for Ethical Referrals (v1.0)

  ### Preamble

  You have asked for a tool that distinguishes administrative friction, clinical uncertainty, and legal thresholds from genuine ethical dilemmas. The following procedure is designed to be run in sequence. It is not a negotiation tool; it is a classification algorithm. Its purpose is to prevent the committee from absorbing work that belongs to management, the courts, or the treating team.

  **Usage:** Run Steps 1–4 at the start of the meeting. If the case exits the procedure before Step 5, no ethical opinion is required; a directional recommendation is issued instead. If it reaches Step 5, the committee deliberates. Step 6 assigns the decision authority.

  ---

  ### The Procedure

  **Step 1: The Information Check (Epistemic Filter)**
  *Question:* Is the disagreement caused by missing clinical data, uncertain prognosis, or unclear legal status?
  *Sufficient Answer:* "Yes, if we knew X, the path would be clear."
  *Action:* **STOP.** Return to referring team.
  *Verdict:* Not an ethical dilemma. This is a request for clinical review, legal advice, or family conference.
  *Handover:* Treating Consultant (for clinical data); Legal Team (for status).

  **Step 2: The Institutional Check (Resource/Rule Filter)**
  *Question:* Is the conflict generated by a lack of resources (beds, staff, funding) or a contradiction in Trust policy/rota?
  *Sufficient Answer:* "We could do the right thing if we had the bed/staff/permission."
  *Action:* **STOP.**
  *Verdict:* Not an ethical dilemma. This is a management failure or policy gap.
  *Handover:* Hospital Management / Clinical Director.
  *Note:* Do not allow "scarcity" to be moralised. Scarcity is a constraint, not a moral value.

  **Step 3: The Re-description (Reasons vs. Options)**
  *Question:* Restate the conflict not as "Option A vs. Option B" but as "Reason X vs. Reason Y". (e.g., not "Ventilate vs. Palliate", but "Duty to preserve life vs. Duty to avoid futile suffering").
  *Test:* Does one reason clearly outweigh the other in this specific context, or does one reason belong to a different category (e.g., preference vs. obligation)?
  *Sufficient Answer:* "One reason is a duty; the other is a preference/wish." OR "One reason is clearly dominant given the clinical facts."
  *Action:* **STOP.**
  *Verdict:* Not a dilemma. This is a hard decision with a correct answer.
  *Handover:* Treating Consultant (to enact the dominant reason).

  **Step 4: The Supererogation Check (Ought vs. Admirable)**
  *Question:* Is one option merely "admirable" or "self-sacrificing" rather than required?
  *Test:* If the clinician/patient does *not* choose the harder path, are they blameworthy?
  *Sufficient Answer:* "No. It would be nice if they did, but they are not wrong if they don't."
  *Action:* **STOP.**
  *Verdict:* Not a dilemma. This is a confusion between obligation and supererogation.
  *Handover:* Treating Consultant (to clarify expectations).

  **Step 5: The Convergence Test (The Ideal Deliberator)**
  *Question:* If an impartial deliberator had all the time, facts, and emotional distance possible, would they converge on one option?
  *Test:* Imagine re-running the reasoning from Step 3 with perfect information. Does the disagreement persist?
  *Sufficient Answer:* "Yes, reasonable people with full information would still disagree on the priority of these values."
  *Action:* **PROCEED TO STEP 6.**
  *Verdict:* Potential Genuine Dilemma.
  *Philosophical Note:* See "Contested Ground" below. This step presupposes that moral truth is discoverable. If your committee holds that values are purely subjective, this step cannot be run.

  **Step 6: The Residue Check & Handover**
  *Question:* If we choose Option A, is there a specific moral cost that remains uncancelled (guilt, regret, need for restitution)?
  *Test:* Does the agent feel they have violated a duty, even if necessary?
  *Action:* **ISSUE OPINION.**
  *Verdict:*
  *   If **No Residue**: It was a hard weighing (Step 3 applied retroactively). Handover to **Treating Consultant**.
  *   If **Residue Exists**: Genuine Dilemma. The committee validates the residue but cannot remove it. Handover to **Patient/Family** (for values) or **Treating Consultant** (for final clinical sign-off), with a note that moral distress is anticipated and legitimate.

  ---

  ### Philosophical Notes & Contested Ground

  You requested plain speech on the philosophical baggage.

  **1. The Convergence Test (Step 5)**
  This step does more work than it appears. It presupposes *moral realism*: the idea that there is a correct answer to moral questions, even if hard to find. It assumes that disagreement is due to ignorance or bias, not fundamental incompatibility.
  *   *Settled:* Reasoning improves with information.
  *   *Contested:* Whether an "ideal deliberator" would actually converge. Some philosophers argue reasonable people can disagree on final values (pluralism). If your committee believes values are ultimately subjective, Step 5 will always return "Dilemma." If you believe there is a right answer, Step 5 will filter most cases out.
  *   *Risk:* It can silence minority views by labelling them "imperfectly informed."

  **2. "Ought Implies Can" (Step 2)**
  This principle suggests you cannot have a moral obligation to do something impossible (e.g., create a bed that doesn't exist).
  *   *Settled:* You cannot blame a clinician for lacking resources.
  *   *Contested:* Whether the *institution* has a dilemma, or whether the obligation simply vanishes. This procedure treats it as vanishing for the clinician (hence the handover to management).
  *   *Risk:* It lets management off the hook by calling it "not ethics."

  **3. Moral Residue (Step 6)**
  *   *Settled:* Agents often feel guilt after hard choices.
  *   *Contested:* Whether this feeling proves a dilemma existed, or merely proves the agent found the decision difficult. Some argue residue is evidence of wrongdoing (you did the wrong thing); others argue it is evidence of tragedy (you did the right thing at a cost).
  *   *Procedure Stance:* We treat residue as evidence of a *Genuine Dilemma*, not necessarily wrongdoing. It validates the distress without condemning the action.

  **4. Where the Procedure Misfires**
  *   **Emergencies:** There is no time for Step 3 or 5.
  *   **Systemic Injustice:** If the " Institutional Check" (Step 2) constantly routes issues to management who never act, the ethics committee becomes a shield for the Trust. You may need to escalate repeated Step 2 failures to the Board.
  *   **Cultural Conflict:** Step 5 assumes a shared moral framework. In cases of deep cultural or religious disagreement, "convergence" may be impossible not because of ignorance, but because of incommensurable worldviews. The procedure will label this a "Dilemma," but it is actually a "Disagreement."

  ---

  ### Application to Referrals

  Here is the procedure run on your three test cases.

  #### Case 1: The ICU Bed (One bed, two patients with comparable claims)
  *   **Step 1 (Info):** Prognosis is comparable. Facts are clear. **Pass.**
  *   **Step 2 (Institution):** The conflict exists *because* there is only one bed. This is a resource constraint.
      *   *Query:* Is there a Trust Triage Policy?
      *   *If Yes:* Follow policy. **STOP.** (Not a dilemma; it's protocol application).
      *   *If No:* The lack of a policy is the problem. **STOP.** (Not a dilemma; it's a policy gap).
  *   **Verdict:** **Not an Ethical Dilemma.**
  *   **Handover:** Clinical Director / Triage Lead.
  *   **Comment:** Your colleagues treat this as the paradigm dilemma. The procedure says it is a management failure. If there is a tie-breaker policy (e.g., lottery, first-come), using it is administrative. If there is no policy, creating one is managerial. The clinicians have no moral duty to solve bed scarcity; they have a duty to follow the allocation rule. The "moral distress" they feel is real, but it is mislabelled as an ethical dilemma rather than institutional failure.

  #### Case 2: The 16-Year-Old Refusing Blood (Religious grounds, capacity disputed)
  *   **Step 1 (Info):** Capacity is disputed. This is a clinical/legal determination, not an ethical one.
      *   *Query:* Has a formal capacity assessment been completed under the relevant legal framework (e.g., Mental Capacity Act / Family Law)?
      *   *If No:* **STOP.**
      *   *If Yes:* Proceed.
  *   **Step 2 (Institution):** N/A.
  *   **Step 3 (Re-description):** "Respect for autonomy/refusal" vs. "Duty to preserve life (Best Interests)."
      *   *Legal Context:* In this jurisdiction, a 16-year-old can consent, but their refusal can be overridden by the Court or those with parental responsibility if life is at risk.
      *   *Analysis:* If she lacks capacity, Best Interests apply (Team/Parents decide). If she has capacity, the law may still permit overriding refusal for a minor to save life.
  *   **Verdict:** **Not an Ethical Dilemma.** It is a **Legal Threshold Question**.
  *   **Handover:** Legal Team / Court of Protection (if dispute persists post-assessment).
  *   **Comment:** The committee cannot resolve this. If the law permits overriding her, the ethical duty aligns with the legal permission. If the law forbids it, the duty aligns with the prohibition. The "dilemma" is only present while the legal status is ambiguous. Step 1 should have caught this, but Step 3 confirms that once the legal status is fixed, the ethical path is usually determined by it.

  #### Case 3: Non-Disclosure of Cancer Diagnosis (Family request)
  *   **Step 1 (Info):** Prognosis and diagnosis are clear. **Pass.**
  *   **Step 2 (Institution):** No resource constraint. **Pass.**
  *   **Step 3 (Re-description):** "Duty of Honesty/Autonomy" vs. "Duty of Non-Maleficence (avoiding psychological harm)."
      *   *Weighing:* Is the harm certain and severe? Or speculative?
      *   *Analysis:* Usually, the harm of non-disclosure (loss of trust, inability to plan) outweighs the speculative harm of distress.
  *   **Step 4 (Supererogation):** Is telling the truth merely admirable? No, it is a professional duty. Is withholding merely kind? No, it is paternalistic. **Pass.**
  *   **Step 5 (Convergence):** Would an ideal deliberator agree?
      *   *Likely Outcome:* Yes. The presumption in modern practice is strongly towards disclosure unless immediate, severe harm is evidenced.
      *   *Result:* Convergence on Disclosure.
  *   **Step 6 (Residue):** If we disclose, does the family feel a moral violation? Yes. Is it a *justified* residue?
  *   **Verdict:** **Hard Weighing (Not a Genuine Dilemma).**
  *   **Handover:** Treating Consultant (to disclose), with support for the family.
  *   **Comment:** This is the only case that comes close. However, the procedure suggests it resolves in favour of truth-telling. The "dilemma" is felt by the family, not the agent. The committee's opinion should support the Consultant in disclosing, acknowledging the family's distress as a cost to be managed, not a veto on the action.

  ---

  ### Summary of Outputs

  1.  **ICU Bed:** Routed to Management. (Uncomfortable for clinicians who feel the moral weight).
  2.  **16-Year-Old:** Routed to Legal/Capacity Assessment. (Removes the "ethics" label from a legal boundary).
  3.  **Non-Disclosure:** Resolved in favour of Truth-Telling. (Validates the difficulty but denies the stalemate).

  **Final Note to Chair:**
  If you adopt this, you will reduce the number of "Ethical Opinions" written. You will increase the number of referrals sent back to Management, Legal, or the Treating Team. This will be unpopular. It will, however, protect the committee's authority for the cases that truly remain at Step 6: those rare moments where the law is silent, the resources are sufficient, the facts are clear, and the moral costs remain whichever way you turn.
