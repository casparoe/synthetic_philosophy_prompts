prompt: |-
  You are a political philosopher with experience advising public bodies — a conceptual consultant to legislators rather than a lecturer. Please think carefully and in stages: begin with a short "design notes" section in which you list, before drafting anything, the distinctions you think must survive translation into a usable procedure and the ones you are willing to drop, and why. Only then produce the procedure itself. Do not pad the answer with bibliographies, histories of the concepts, or citations: I need something my staff can run, and any step that depends on having read a particular author is a step I have to throw away.

  The setting: I head a small scrutiny unit inside a regional government. Every secondary instrument the executive lays before the assembly must now carry a two-page "liberty statement" alongside its existing economic and environmental appraisals. My team is two policy generalists with law and economics training, no philosophy, roughly one working day per instrument, and we process about sixty a year. Statements are published, are routinely quoted back at ministers by opposition members and by consultees, and can be cited in judicial review; a minister may overrule a statement but must give written reasons. The audience is a five-member board that signs off and ministers who will happily strip out anything they find inconvenient. So the procedure has to be legible to non-specialists, hard to game, and honest about its slack.

  The material: the three-way distinction among negative liberty (freedom as the absence of interference by others), positive liberty (freedom as self-mastery, self-direction, or the real capacity to act on what one wants), and republican liberty (freedom as non-domination, i.e. not being subject to another's power of arbitrary interference). You should assume my analysts know these labels and nothing more.

  What I want from you:

  1. Fix the operative readings before you write the steps. In particular: which reading of positive liberty the procedure will use, given that the phrase covers several different ideas — rational self-direction, effective power or capability, and collective self-rule — and that the third of these is the one that lets an executive justify coercing someone for their own freedom. Say what your choice costs you. Also specify the baseline against which interference is counted (pre-policy status quo? counterfactual of no government action? some moralized baseline?) and how an analyst decides, since this choice silently drives verdicts.

  2. The procedure itself: an ordered set of gates or questions, what counts as a sufficient answer to each, where the procedure terminates with a negative finding, and where it hands the decision to a human being because the issue is one of values rather than facts. It should be runnable in the time available by someone with my team's background.

  3. A scoring discipline that refuses to aggregate. My ministers want a single net verdict per instrument; I believe a net score across the three concepts would be a fabrication. Give me the reporting format you think is defensible instead — three separate lane findings plus an explicit conflict flag when the lanes diverge, and a rule for when a flagged conflict must be escalated rather than resolved by my team.

  4. A domination check that is genuinely operational: how an analyst identifies the relevant power-holder, how she tests whether the power is arbitrary without being handed a full theory of interests, how she measures exposure when no one is actually interfering (the unconstrained master who never exercises the power), and how she handles the case where a measure removes a private power only to vest an equivalent power in an inspectorate or agency. Include an exit-cost and a contestability step, and tell me what an analyst should do when a measure fails the contestability gate but passes the others — recommend rejection, or recommend a compulsory sunset and review? Is that second option an application of the theory or a political fudge?

  5. An anti-capture guard. Many instruments arrive with a covering note explaining how the policy gives people real freedom. Build in a test that catches the two failure modes I actually see: an appeal to the affected person's own will where that will has been shaped by the arrangement under review, and an appeal to collective self-rule that turns coercion into an expression of freedom.

  Then run the finished procedure on three instruments, showing your working at each gate rather than just the verdict:

  A. Automatic enrolment of employees into an occupational pension scheme with a right to opt out, and contributions deducted at source.
  B. A statutory requirement that dismissals be for cause, enforced by a labour inspectorate with power to award reinstatement.
  C. Conditional cash transfers to low-income parents, payment contingent on recorded attendance at health and parenting appointments. This is the government's flagship social policy and my board is friendly to it. Do not soften what the procedure returns; if it comes out badly for the measure, say so and say which gate does the damage.

  End with a limits section: what the procedure will systematically miss or misrank (cases where the loser is not the person the instrument targets, diffuse or structural power with no identifiable holder, the impossibility of comparing one instrument against another, the drift by which a well-designed template becomes a rubber stamp), and the circumstances in which I should override it rather than publish what it says.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Political philosopher/conceptual consultant advising a public body (scrutiny unit).
      *   **Task:** Create a usable procedure for drafting "liberty statements" for secondary instruments.
      *   **Constraints:**
          *   Start with "Design Notes" (distinctions to keep/drop).
          *   No bibliographies, history, or citations (must be runnable by staff).
          *   Staff: 2 policy generalists (law/econ background), 1 day per instrument, 60/year.
          *   Audience: 5-member board, Ministers (who can overrule with reasons), Opposition, Courts (judicial review risk).
          *   Core Concepts: Negative, Positive, Republican Liberty.
          *   Specific Requirements:
              1.  Fix operative readings (especially Positive Liberty baseline).
              2.  The Procedure (ordered gates, termination points, human decision flags).
              3.  Scoring Discipline (no aggregation, 3 lanes + conflict flag + escalation rule).
              4.  Domination Check (operationalizing arbitrariness, exposure, public vs. private power, exit/contestability).
              5.  Anti-Capture Guard (adaptive preferences, collective self-rule coercion).
              6.  Test Run (3 specific instruments: Pension Auto-enrolment, Dismissal for Cause, Conditional Cash Transfers).
              7.  Limits Section (systematic blind spots, when to override).
      *   **Tone:** Professional, precise, actionable, honest about slack/limitations.

  2.  **Design Notes (Stage 1):**

      *   *Goal:* Translate philosophical concepts into bureaucratic checklist items without losing the core normative bite.
      *   *Negative Liberty:* Keep "interference." Drop complex debates on what counts as interference (e.g., pricing vs. banning). *Decision:* Treat legal/financial penalties as interference.
      *   *Positive Liberty:* This is the danger zone. "Self-mastery" can justify coercion. "Capability" is too broad for a 1-day review. *Decision:* Define it as "Effective Capacity." Focus on resource removal/addition that enables action. *Cost:* We lose the "rational will" justification for coercion. We must explicitly ban the argument "we force you to be free."
      *   *Republican Liberty:* Keep "Non-domination." Drop the historical context. Focus on *arbitrariness* and *capacity to interfere.*
      *   *Baseline:* Crucial. Pre-policy status quo is manipulable (e.g., if the status quo is private tyranny). *Decision:* Use a "Rights-Respecting Counterfactual." What would exist if the state did nothing *but* enforced basic common law rights/contracts? Actually, simpler: "Statutory Baseline." Compare against existing statutory entitlements, not just the immediate prior moment.
      *   *Aggregation:* The prompt explicitly forbids net scoring. I need a matrix format.
      *   *Domination:* Needs to be testable. "Arbitrariness" = lack of tracking interests + lack of contestability.
      *   *Anti-Capture:* Needs to spot "manufactured consent."

  3.  **Drafting the Procedure (Stage 2 & 3 & 4 & 5):**

      *   *Structure:* Needs to be a flowchart logic but written as text.
      *   *Baselines:* Define the "Interference Baseline" clearly.
      *   *Positive Liberty:* Define as "Capability Enhancement." Explicitly exclude "forcing rationality."
      *   *Republican:* Focus on the *power* held by the official, not just the *use*.
      *   *Scoring:* Three columns (Neg, Pos, Rep). No summing. Conflict Flag = if one is High Cost and another is High Benefit. Escalation = if Republican score is "Domination Present."
      *   *Domination Check:* Specific questions on discretion, guidelines, appeal mechanisms.
      *   *Anti-Capture:* Question on preference formation and "voice."

  4.  **Running the Test Cases (Stage 6):**

      *   *Case A (Pensions):*
          *   Neg: Interference (deduction), but opt-out exists.
          *   Pos: Capacity enhanced (retirement security).
          *   Rep: Is the fund manager dominating? Is the state dominating? Opt-out reduces domination.
          *   *Verdict:* Likely clear, minor Neg, strong Pos.
      *   *Case B (Dismissal for Cause):*
          *   Neg: Interference with employer's freedom to contract/fire.
          *   Pos: Employee capacity secured (income stability).
          *   Rep: Inspectorate power. Is it arbitrary? "For cause" is vague. Inspectorate discretion is key.
          *   *Verdict:* High conflict. Employer Neg vs Employee Pos. Republican risk on Inspectorate.
      *   *Case C (Conditional Cash Transfers):*
          *   Neg: Interference (conditions on money).
          *   Pos: Capacity (money + health).
          *   Rep: High risk. State holds power over livelihood. Conditions might be arbitrary relative to need.
          *   *Anti-Capture:* Are parents choosing health or just chasing cash? Is the state defining "good parenting"?
          *   *Verdict:* This should trigger the Conflict Flag and likely the Domination warning. The prompt asks me not to soften it.

  5.  **Limits Section (Stage 7):**

      *   What does this miss? Structural power (markets), third-party effects, long-term drift.
      *   When to override? When national security is explicit (though rare in secondary legislation), or when the legal baseline is known to be unjust (but the unit isn't a human rights court).

  6.  **Refining and Polishing:**

      *   *Tone Check:* Am I sounding like a lecturer? No, keep it imperative. "Do this," "Ask this."
      *   *Constraint Check:* Did I include bibliographies? No. Did I define Positive Liberty clearly? Yes.
      *   *Specific Instruction:* "Exit-cost and contestability step." Need to ensure this is in the Republican gate.
      *   *Specific Instruction:* "Recommend rejection or sunset?" Need to make a call. Sunset is more politically viable but theoretically weaker if the power itself is dominating. I'll recommend Sunset + Review as the pragmatic "fix" for domination that isn't outright tyranny.
      *   *Specific Instruction:* "Anti-capture." Ensure the "adaptive preferences" test is clear.

  7.  **Final Review against constraints:**
      *   Design Notes first? Yes.
      *   Operative readings fixed? Yes.
      *   Procedure ordered? Yes.
      *   Scoring non-aggregated? Yes.
      *   Domination check operational? Yes.
      *   Anti-capture included? Yes.
      *   Three test cases with working shown? Yes.
      *   Limits section? Yes.

      *(Self-Correction during drafting)*: I initially thought about using a "Rights Baseline." But my staff aren't human rights lawyers. I should stick to a "Legal Status Quo Baseline" but warn them about private power.
      *(Refining Positive Liberty)*: I must explicitly forbid the "forcing people to be free" argument. That is the biggest risk in a government setting. Positive liberty here must mean "resource enablement," not "moral improvement."
      *(Refining Domination)*: The "unconstrained master" problem. How to measure? Look at the *rules constraining the official*, not the *behavior of the official*. If the rule says "Inspector may decide as they see fit," that's domination, even if the Inspector is nice.

      *(Final Polish)*: Ensure the distinction between "Interference" (Negative) and "Domination" (Republican) is sharp. Interference is what happens; Domination is the *capacity* to happen arbitrarily.

      *(Test Case C)*: This is the trap. The board is friendly. I must be rigorous. If the conditions are discretionary, it fails the Republican gate. If the conditions dictate private life, it fails the Negative gate. I will mark it as "High Conflict/Domination Risk."

      *(Limits)*: Be honest. This template can become a rubber stamp. Acknowledge that.

      Let's write.

      *Structure:*
      1. Design Notes.
      2. Operative Definitions & Baselines.
      3. The Procedure (Gates 1-4).
      4. Reporting Format (Scoring).
      5. Test Runs (A, B, C).
      6. Limits & Override Protocol.

      *Wait, one detail:* "Exit-cost and contestability step." I need to make sure this is explicit in the Republican gate.
      *Another detail:* "Recommend rejection or sunset?" I need to answer this in the procedure design. I will recommend Sunset + Review for domination risks that serve a clear Positive liberty end, but Rejection for pure domination without benefit.

      *Okay, ready to draft.*
answer: |-
  # DESIGN NOTES: TRANSLATION AND TRIAGE

  **Objective:** Convert three philosophical concepts into a bureaucratic checklist that survives contact with ministerial pressure and judicial scrutiny.

  **Distinctions to Keep:**
  1.  **Interference vs. Capacity vs. Power:** We must keep the distinction between *what is done to you* (Negative), *what you can do* (Positive), and *who holds power over you* (Republican). Collapsing these allows ministers to claim that providing a benefit (Positive) cancels out a restriction on power (Republican). They do not cancel; they conflict.
  2.  **Arbitrariness vs. Interference:** A law can interfere without dominating (if it is rule-bound and non-arbitrary). A power can dominate without interfering (if it is held in reserve). The procedure must test for the *existence of arbitrary power*, not just its *exercise*.
  3.  **Exit and Voice:** In the Republican lane, the ability to leave a relationship (exit) and challenge a decision (voice/contestability) are the only operational proxies for "non-domination" available to generalists.

  **Distinctions to Drop:**
  1.  **Positive Liberty as "Rational Self-Direction":** I am dropping the idea that the state can coerce citizens to make "better" or "more rational" choices. This is the primary vector for authoritarian capture. The procedure will treat Positive Liberty strictly as **Effective Capability** (resources/options).
  2.  **Moralized Baselines:** We cannot ask analysts to determine the "just" baseline. We will use the **Statutory Status Quo** (existing law + common law contract/property rights) as the reference point. This is imperfect but auditable.
  3.  **Aggregation:** I am dropping the possibility of a net score. A high Positive score cannot mathematically offset a high Republican risk. They must be reported as conflicting vectors.

  **Cost of Choices:**
  By defining Positive Liberty as "Capability" rather than "Rational Will," we lose the ability to justify paternalism (e.g., seatbelt laws) under the Positive lane. These must be justified under Negative (harm prevention) or Republican (public safety as non-domination by risk), or admitted as paternalistic overrides. This forces honesty: if it is paternalism, the Minister must own it in the override reasons, not hide it behind "freedom."

  ***

  # OPERATIVE DEFINITIONS & BASELINES

  **1. The Baseline for Interference (Negative Liberty)**
  *   **Definition:** The **Statutory Status Quo**. What legal restrictions, taxes, or penalties exist *before* this instrument is laid?
  *   **Test:** Does this instrument add a new penalty, prohibition, tax, or compliance cost that did not exist before?
  *   **Note:** Do not compare against a hypothetical "state of nature." Compare against current law. If current law allows private employers to fire at will, a restriction on firing is an interference with the employer, even if it protects the employee.

  **2. The Reading of Positive Liberty (Capability)**
  *   **Definition:** **Effective Capacity.** Does the instrument provide resources, information, or institutional support that materially expands the range of actions a person can realistically take?
  *   **Exclusion:** Do **not** accept arguments that coercion enhances freedom by "aligning the subject with their rational will" or "correcting bad choices."
  *   **Test:** Does this give the subject money, time, legal standing, or physical access they lacked before?

  **3. The Reading of Republican Liberty (Non-Domination)**
  *   **Definition:** **Immunity from Arbitrary Power.** Is any person or body granted the power to interfere with the subject's choices without clear, pre-established rules and without effective appeal?
  *   **Test:** Look for discretion. Look for the absence of exit options. Look for the absence of appeal mechanisms.

  ***

  # THE PROCEDURE: FOUR GATES

  **Time Allocation:** 4 hours research, 2 hours drafting, 2 hours review.

  ### GATE 1: THE INTERFERENCE SCAN (Negative Liberty)
  **Action:** Map all new duties, penalties, and prohibitions.
  **Question:** Does this instrument impose a cost (financial, temporal, or legal) on a specific agent that did not exist under the Statutory Status Quo?
  *   **Yes:** Record the agent (e.g., "Employer," "Parent," "Tenant") and the magnitude (Low/Med/High). Proceed to Gate 2.
  *   **No:** Record "No New Interference." Proceed to Gate 2.
  **Termination:** If "High" interference is found on a protected class (e.g., speech, assembly) without explicit statutory authority, flag for Legal Counsel immediately.

  ### GATE 2: THE CAPABILITY AUDIT (Positive Liberty)
  **Action:** Map all new resources, entitlements, and enablements.
  **Question:** Does this instrument provide a resource or remove a barrier that significantly expands the effective range of action for a specific agent?
  *   **Yes:** Record the agent and the capability (e.g., "Income Security," "Health Access"). Proceed to Gate 3.
  *   **No:** Record "No Capability Enhancement." Proceed to Gate 3.
  **Anti-Capture Check (Crucial):** If the capability is contingent on behavioral compliance (e.g., "Money IF you attend class"), ask: *Is the behavior a precondition for the resource, or is the resource a bribe to alter private life?* If the latter, mark "Conditional Capability" and proceed to Gate 4.

  ### GATE 3: THE DOMINATION CHECK (Republican Liberty)
  **Action:** Identify all new powers vested in public officials or private bodies authorized by the state.
  **Step A (Power Holder):** Who can decide? (Name the role, e.g., "Inspector," "Minister," "School Principal").
  **Step B (Arbitrariness Test):**
  1.  **Rule-Bound:** Are the criteria for exercising power written down and narrow? (Yes/No)
  2.  **Interest-Tracked:** Must the decision-maker consider the subject's interest, or only state policy? (Subject/State/Both)
  3.  **Contestability:** Is there a low-cost, timely appeal mechanism to an independent body? (Yes/No)
  4.  **Exit Cost:** Can the subject leave the relationship without catastrophic loss? (Yes/No)
  **Verdict:**
  *   **Non-Dominating:** Power is rule-bound, interests tracked, appeal exists, exit possible.
  *   **Dominating:** Discretion is wide, OR appeal is absent/too costly, OR exit is impossible.
  **Remedy Logic:** If "Dominating," recommend **Sunset Clause + Mandatory Review** (2 years). If the power is purely discretionary with no appeal, recommend **Rejection**.

  ### GATE 4: THE CONFLICT FLAG
  **Action:** Compare Gate 1, 2, and 3 findings.
  **Trigger:**
  1.  **Negative/Positive Conflict:** High Interference on Agent X vs. High Capability for Agent Y (e.g., Employer cost vs. Employee security).
  2.  **Republican/Positive Conflict:** High Capability provided via Dominating Power (e.g., Cash transfer contingent on Inspector's arbitrary approval).
  **Action:** If Triggered, the Statement must display the conflict explicitly. The team does not resolve it. The Minister resolves it in the override reasons.

  ***

  # REPORTING FORMAT: THE THREE-LANE MATRIX

  Do not produce a net score. Produce a table with three rows.

  | Liberty Lane | Finding | Magnitude (Low/Med/High) | Notes |
  | :--- | :--- | :--- | :--- |
  | **Negative (Interference)** | [Interference / No Interference] | [L/M/H] | Who bears the cost? |
  | **Positive (Capability)** | [Enhancement / No Enhancement] | [L/M/H] | Who gains capacity? |
  | **Republican (Domination)** | [Secure / At Risk] | [L/M/H] | Where is the arbitrary power? |

  **Conflict Flag:** [YES/NO]
  **Escalation Rule:** If Republican = "At Risk (High)" OR Conflict Flag = YES, the draft statement must be reviewed by the Unit Head before publication. The Minister must sign a specific "Override Declaration" if proceeding.

  ***

  # TEST RUNS

  ### INSTRUMENT A: Automatic Pension Enrolment (Opt-out available)

  **Gate 1 (Negative):**
  *   *Interference:* Yes. Employers must administer deductions. Employees have wages deducted automatically.
  *   *Agent:* Employer (Admin burden), Employee (Cash flow restriction).
  *   *Magnitude:* Low (Employer), Low (Employee - opt-out exists).
  *   *Finding:* Interference (Low).

  **Gate 2 (Positive):**
  *   *Capability:* Yes. Long-term financial security enhanced. Overcomes inertia.
  *   *Agent:* Employee.
  *   *Magnitude:* High (Retirement security is a major capability).
  *   *Anti-Capture:* Is the will shaped? Inertia is not adaptive preference; it is cognitive limitation. The opt-out preserves the veto.
  *   *Finding:* Capability Enhancement (High).

  **Gate 3 (Republican):**
  *   *Power Holder:* Employer (deducts), Fund Manager (invests).
  *   *Arbitrariness:* Rules are statutory. Rates are fixed.
  *   *Contestability:* Employee can opt out. Regulator oversees funds.
  *   *Exit Cost:* Low (Opt-out is administrative).
  *   *Finding:* Secure (Low Risk).

  **Gate 4 (Conflict):**
  *   Low Interference vs. High Capability. No fundamental rights conflict.
  *   *Flag:* NO.

  **Statement Verdict:**
  *   **Negative:** Low Interference (Admin/Cash Flow).
  *   **Positive:** High Capability (Security).
  *   **Republican:** Secure.
  *   **Recommendation:** Proceed.

  ### INSTRUMENT B: Dismissal for Cause (Labour Inspectorate Enforcement)

  **Gate 1 (Negative):**
  *   *Interference:* Yes. Employers prohibited from firing without "cause."
  *   *Agent:* Employer.
  *   *Magnitude:* High (Restricts property/contract rights).
  *   *Finding:* Interference (High).

  **Gate 2 (Positive):**
  *   *Capability:* Yes. Employees gain income security, ability to plan life.
  *   *Agent:* Employee.
  *   *Magnitude:* High.
  *   *Finding:* Capability Enhancement (High).

  **Gate 3 (Republican):**
  *   *Power Holder:* Labour Inspectorate.
  *   *Arbitrariness Test:*
      1.  *Rule-Bound:* "Cause" is often legally vague. Inspector decides if cause existed. (Risk).
      2.  *Interest-Tracked:* Inspector represents state policy, not necessarily individual interest. (Neutral).
      3.  *Contestability:* Can employer appeal reinstatement? If yes, Low Risk. If no, High Risk. *Assume standard tribunal exists.*
      4.  *Exit Cost:* Employer cannot exit the regulatory regime.
  *   *Finding:* At Risk (Medium). The discretion on "cause" creates potential for arbitrary enforcement depending on inspector guidelines.
  *   *Remedy:* Require published guidelines on "Cause" + Right of Appeal.

  **Gate 4 (Conflict):**
  *   High Interference (Employer) vs. High Capability (Employee).
  *   *Flag:* YES. This is a distributive conflict disguised as liberty.

  **Statement Verdict:**
  *   **Negative:** High Interference (Employer Freedom).
  *   **Positive:** High Capability (Employee Security).
  *   **Republican:** Medium Risk (Inspector Discretion).
  *   **Conflict Flag:** YES.
  *   **Recommendation:** Proceed only if "Cause" is strictly defined in statute and appeal rights are guaranteed. Minister must acknowledge the trade-off.

  ### INSTRUMENT C: Conditional Cash Transfers (Health/Parenting Attendance)

  **Gate 1 (Negative):**
  *   *Interference:* Yes. Parents lose entitlement if they do not comply with behavioral conditions.
  *   *Agent:* Low-income Parents.
  *   *Magnitude:* High (Loss of essential income).
  *   *Finding:* Interference (High).

  **Gate 2 (Positive):**
  *   *Capability:* Yes. Cash provides resources. Health appointments provide long-term health capability.
  *   *Agent:* Parents/Children.
  *   *Magnitude:* High.
  *   *Anti-Capture Check:* **FAIL.**
      *   *Question:* Is the will shaped? The financial pressure makes the "choice" to attend coerced, not autonomous.
      *   *Question:* Collective Self-Rule? Is the state defining "good parenting"? Yes.
      *   *Note:* This is "Capability via Coercion." Mark as **Conditional Capability**.

  **Gate 3 (Republican):**
  *   *Power Holder:* Caseworker / Agency.
  *   *Arbitrariness Test:*
      1.  *Rule-Bound:* Are exemptions for illness/transport clear? Often vague in practice.
      2.  *Interest-Tracked:* Agency tracks budget/compliance, not family welfare nuances.
      3.  *Contestability:* Appeals against benefit suspension are often slow. During appeal, money is stopped.
      4.  *Exit Cost:* Impossible (Need money to survive).
  *   *Finding:* **At Risk (High).** The agency holds arbitrary power over livelihood. The subject cannot exit.
  *   *Remedy:* Sunset Clause + Review. But given the "High Risk" and "High Interference," the procedure demands **Rejection** of the *conditionality* mechanism, not the transfer.

  **Gate 4 (Conflict):**
  *   High Interference + High Domination Risk vs. High Capability.
  *   *Flag:* YES.

  **Statement Verdict:**
  *   **Negative:** High Interference (Behavioral Control).
  *   **Positive:** High Capability (Income/Health).
  *   **Republican:** **High Risk (Domination).**
  *   **Conflict Flag:** YES.
  *   **Recommendation:** **Do not proceed in current form.** The conditionality creates a dominating power over a vulnerable class with no exit.
  *   **Required Fix:** Uncondition the cash OR make conditions non-punitive (support offered, not mandated) OR guarantee immediate continued payment during appeal.
  *   **Note to Board:** This instrument fails the Republican gate. Publishing a statement that hides this is a judicial review risk. The Minister must override with written reasons acknowledging the domination risk.

  ***

  # LIMITS & OVERRIDE PROTOCOL

  **Systematic Blind Spots:**
  1.  **Diffuse Power:** This procedure identifies specific power-holders (Inspectors, Ministers). It will miss structural domination (e.g., market monopolies, algorithmic bias) where no single human agent holds the whip.
  2.  **Third-Party Effects:** We assess the target of the instrument. We may miss liberty costs borne by non-targets (e.g., a zoning law restricts the developer but dominates the neighbor by exposing them to the developer's lobbying power).
  3.  **The Rubber-Stamp Drift:** After 20 instruments, analysts will stop testing "Arbitrariness" and assume "Process exists = Non-arbitrary."
      *   *Mitigation:* Every 10th instrument must undergo a "Red Team" review by an external legal counsel not involved in the drafting.

  **When to Override the Procedure:**
  1.  **Emergency Powers:** In genuine emergencies (pandemic, disaster), the Republican gate will always fail (power must be arbitrary to be fast). Publish the failure, do not hide it.
  2.  **Correcting Injustice:** If the "Statutory Status Quo" baseline is itself tyrannical (e.g., apartheid-era laws), interfering with it is good. The procedure will flag this as "Negative Liberty Violation."
      *   *Action:* Unit Head must append a "Baseline Note" explaining that the interference corrects a prior domination.
  3.  **Judicial Risk:** If Legal Counsel advises that a "Domination" finding exposes the government to successful litigation, publish the finding but allow the Minister to override. The liability is political, not procedural.

  **Final Instruction to Staff:**
  Your job is not to stop policy. Your job is to make the liberty cost visible. If a Minister chooses to dominate to achieve a social end, they must sign their name to that choice. Do not let them sign it using your language. If the procedure says "Domination," do not write "Risk Management." Write "Domination."
