      *   *Assessment:* "Genre-retrojection" is strong. It sounds like Frank Kermode's *The Sense of an Ending* (concordance) or maybe Paul Ricoeur's narrative identity. It's not entirely new, but the specific phrasing is useful for undergrads. It bridges the gap between cognitive bias and literary form.
