          *   *Analysis:* This is a common simplification but technically contentious. Graham Priest (the main figure) is often interpreted as a logical *monist* who thinks LP (or a similar paraconsistent logic) is the *correct* logic universally, but classical logic is a *good approximation* for consistent domains. However, some dialetheists *are* pluralists.
          *   *Verdict:* The friend is mostly right. Priest usually argues classical logic is *incorrect* because it validates Explosion, which is invalid in the presence of true contradictions. He accepts classical logic *only* in domains known to be consistent. Calling it "pluralism" softens the revolutionary claim.
