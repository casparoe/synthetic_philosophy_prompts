      *   *Refining Claim 2 (Validity):* Be specific. $A, \neg A \vdash B$ (Explosion) fails. $A \lor B, \neg A \vdash B$ (Disjunctive Syllogism) fails. This is the "cost." The book's claim that "everything stays valid" is dangerously wrong.
      *   *Refining Claim 3 (Trivialism):* Explain that Paraconsistency is *defined* as the rejection of Explosion. So the objection "contradiction implies everything" is begging the question. The real objection is "Why accept the contradiction?"
