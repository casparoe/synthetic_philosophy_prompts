answer: |-
  You have identified a genuine and significant methodological fault line, and your intuition that "baseline smuggling" is close to the mark is correct. However, there is a more precise technical vocabulary available to describe this, drawn from the philosophy of causation and causal modeling, even if the historiography of the "Great Man" debate lacks a single canonical label for it.

  ### The Established Concepts

  There is no single noun phrase in the philosophy of history (like "The Historian's Fallacy") that names *exactly* this pattern. However, your description maps precisely onto two established concepts in the philosophy of science and causal inference. The disagreement you are observing is a dispute over **Causal Model Specification**, specifically regarding **Exogeneity Assumptions**.

  **1. The Causal Field (J.L. Mackie)**
  The closest established philosophical concept is J.L. Mackie's notion of the **Causal Field**. Mackie argued that causal claims are always relative to a "field" of background conditions that are taken as fixed. A cause is not a cause *simpliciter*, but a cause *relative to a field*.
  *   **The Connection:** The Structuralist and the Great Man theorist are selecting different *Causal Fields*. The Structuralist's field includes the Depression and Versailles as fixed background; the Great Man theorist's field treats the *efficacy* of those conditions as variable, dependent on the agent.
  *   **Why it's not quite enough:** "Causal Field" explains *that* the background changes, but it doesn't capture the *systematic asymmetry* you noted (that Structuralists *reliably* fix structure, while Great Man theorists *reliably* fix the agent's unique causal power). It describes the mechanism, but not the historiographical pattern.

  **2. Exogeneity vs. Endogeneity (Causal Modeling/Interventionism)**
  In modern interventionist accounts of causation (e.g., James Woodward), a causal test requires an "intervention" on variable $X$ to see if $Y$ changes. Crucially, this requires specifying which other variables are **exogenous** (held fixed, external to the model) and which are **endogenous** (allowed to vary, internal to the model).
  *   **The Connection:** Your "flip" occurs because the two camps disagree on the **Exogeneity Assumption**.
      *   **Structuralists** treat "Social Conditions" (Versailles, Depression) as *exogenous*. They intervene on Hitler ($H=0$), hold Conditions ($C$) fixed, and observe Outcome ($O$).
      *   **Great Man Theorists** treat "Social Conditions" as partially *endogenous* to the Agent. They argue that $C$ only causes $O$ *through* the specific mediation of $H$'s unique traits. To remove $H$ is to break the causal pathway of $C$.
  *   **Why it's not quite enough:** This is the *logic* of the dispute, but it is a technical term from econometrics and philosophy of science, not a label for the historiographical phenomenon itself.

  ### The Coinage: "Counterfactual Baseline Asymmetry"

  Since no single term in the history literature captures the *pattern of disagreement* (the reliable flipping based on fixity assumptions), I propose the term **Counterfactual Baseline Asymmetry**.

  **Definition:**
  **Counterfactual Baseline Asymmetry** occurs when competing historical explanations yield opposite causal verdicts on the same event, not due to conflicting evidence, but due to incompatible assumptions about which variables constitute the **fixed baseline** (exogenous) versus the **variable intervention** (endogenous) in the counterfactual test.

  **Tight Boundaries:**
  To ensure this term does the work you need, it must be distinguished from its nearest neighbors:

  1.  **Distinct from "Vagueness of Counterfactuals":**
      *   *Vagueness* implies the answer is indeterminate (e.g., "We don't know what would happen").
      *   *Baseline Asymmetry* implies there are *two* determinate answers to *two different questions*. The Structuralist answers Question A (Hold Structure Fixed); the Great Man theorist answers Question B (Hold Agent Efficacy Fixed). The disagreement is over which question is historically legitimate.
  2.  **Distinct from "Overdetermination":**
      *   *Overdetermination* implies two sufficient causes exist simultaneously (e.g., Hitler AND the Depression both suffice).
      *   *Baseline Asymmetry* does not require sufficiency. It requires only that the *dependency relations* change based on what is held fixed.
  3.  **Distinct from "Similarity Metrics" (Lewis):**
      *   A "similarity metric" dispute is about how *close* a possible world must be to the actual world.
      *   *Baseline Asymmetry* is not about *distance*, but about *topology*. It is a disagreement about the *wiring* of the causal model (which variables are independent), not just how much the world is allowed to change.
  4.  **Distinct from "Backtracking Counterfactuals":**
      *   *Backtracking* (David Lewis) involves changing the *past* to accommodate the counterfactual antecedent (e.g., "If Hitler hadn't existed, his parents never met").
      *   *Baseline Asymmetry* does not necessarily change the past facts (Versailles still happened). It changes the *causal power* assigned to those facts in the absence of the agent.

  ### How to Use This in Your Seminar

  You can tell your students that the "Great Man" vs. "Structure" debate is often a **Counterfactual Baseline Asymmetry** disguised as a factual dispute.
  *   **The Structuralist Move:** Asserts that "Social Conditions" are the exogenous baseline. The individual is the variable.
  *   **The Great Man Move:** Asserts that "Agency" is the exogenous baseline (or that Conditions are endogenous to Agency). The *mobilization of structure* is the variable.
  *   **The Resolution:** The debate cannot be settled by evidence alone; it must be settled by arguing for the correct **Model Specification**. Which variables *ought* to be treated as independent?

