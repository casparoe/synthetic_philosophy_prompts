prompt: |-
  I serve on the ethics and programming committee of a national museum of social history. At Thursday’s meeting we must vote on whether to approve institutional funding for an immersive theatrical installation—working title The Unrecorded Hours—about a prominent 19th-century public-health reformer whose speeches and official reports are extensively archived, but whose private correspondence was largely destroyed in a 1920s fire. The proposal uses actors, reconstructed dialogue, and clearly labeled speculative scenes—most controversially, an invented internal monologue in which the reformer debates accepting a factory-owner’s bribe—to dramatize moral conflicts never documented in the surviving record. The reformer’s descendants have objected formally: they do not allege factual error in any documented claim, but argue that fabricating an interior life, especially one involving unverified moral corruption, violates a distinct posthumous interest they term narrative sovereignty—the dead’s claim not to be conscripted into a genre of story (psychological drama about hidden vice) that the historical record neither supports nor rules out. The artists counter that biography is always constructive, that the installation marks every reconstruction as hypothetical, and that granting descendants a veto over speculative interiority would paralyze the museum’s entire dramatic programming.

  Draft the committee’s decision memo recommending approval, conditional approval, or rejection, with a concrete course of action and a timeline for implementation or appeal. The memo should be circulated before Thursday’s vote and should be directly actionable by museum staff. In your reasoning, take the descendants’ distinction between epistemic harm (misrepresenting documented actions or statements) and narrative sovereignty seriously: explain whether the museum owes the dead fidelity only to what they did and said, or also to the boundaries of how their consciousness may be dramatized. Give an honest, non-dismissive account of the strongest argument on the artists’ side—specifically, that any bright-line prohibition on invented interior monologue would eliminate not only this installation but large classes of legitimate historical drama—and show how your recommendation accommodates that risk without reducing the committee’s decision to either a pure descendant veto or an unqualified artistic-license standard. Do not request citations or bibliographies; reason from the conceptual distinction and the institutional stakes alone.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Ethics and Programming Committee of a national museum of social history.
      *   **Task:** Draft a decision memo for the committee to vote on at Thursday's meeting.
      *   **Subject:** Funding approval for *The Unrecorded Hours*, an immersive theatrical installation about a 19th-century public-health reformer.
      *   **Conflict:**
          *   *Proposal:* Uses actors, reconstructed dialogue, and labeled speculative scenes (including an invented internal monologue about a bribe).
          *   *Descendants' Objection:* No factual errors alleged. Objection is based on "narrative sovereignty" (the dead's right not to be conscripted into specific genres/stories about hidden vice without evidence).
          *   *Artists' Defense:* Biography is constructive; speculation is labeled; veto power paralyzes programming.
      *   **Requirements:**
          *   Recommend approval, conditional approval, or rejection.
          *   Provide a concrete course of action and timeline.
          *   Be directly actionable by staff.
          *   Address the distinction between *epistemic harm* (facts) and *narrative sovereignty* (interiority).
          *   Give an honest account of the artists' argument (slippery slope/paralysis).
          *   Avoid a binary choice (pure veto vs. unqualified license).
          *   No citations/bibliographies.

  2.  **Determine the Recommendation:**
      *   *Rejection:* Too restrictive on artistic expression, validates a potentially limitless "narrative sovereignty" claim that could stifle future historical interpretation. Ignores the educational value of exploring moral ambiguity.
      *   *Unqualified Approval:* Dismisses the legitimate ethical concerns of the descendants. Risks public backlash and sets a precedent that the museum doesn't care about stakeholder sensitivity regarding the dead.
      *   *Conditional Approval:* The middle path. Acknowledges the artists' need for speculation but addresses the descendants' concern about *specific* types of speculation (hidden vice/corruption) that lack evidentiary basis. This allows for a nuanced policy on "Speculative Interiority."

      *Decision:* **Conditional Approval.** This allows the project to proceed but requires modifications to the specific controversial element (the bribe monologue) and establishes a framework for future projects.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Recommendation:** Clear statement of the decision.
      *   **Context:** Brief summary of the proposal and the conflict.
      *   **Ethical Analysis:**
          *   Epistemic Harm vs. Narrative Sovereignty.
          *   The Artists' Argument (The "Paralysis" Risk).
          *   The Museum's Duty (Balancing act).
      *   **Decision & Conditions:** Specific changes required.
      *   **Implementation Timeline:** Concrete steps for staff.
      *   **Appeal Process:** How descendants or artists can challenge.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Recommendation:* Conditional Approval.
      *   *Reasoning - The Core Distinction:* I need to articulate "Narrative Sovereignty." It's not about lying (epistemic harm); it's about *tone* and *psychological attribution*. The museum owes fidelity to facts, but also a duty of care to how we imagine the dead, especially when implying moral failing. However, we cannot grant a veto on *all* imagination, or history becomes a dry list of dates.
      *   *Reasoning - The Artists' Point:* I must validate their fear. If we ban invented interiority, we ban historical fiction, docudrama, and immersive theater. The museum's mission involves engagement, which requires narrative. A bright-line ban is functionally a ban on the genre.
      *   *The Compromise:* The specific issue is the *bribe*. It implies corruption without evidence. The solution isn't to ban interiority, but to raise the evidentiary bar for *negative* interiority. Or, frame it differently. Let's go with: The specific monologue about the bribe must be reframed to reflect the *uncertainty* or removed, while other speculative elements remain. Actually, a better condition is to require a "layered narrative" approach where the speculation is explicitly contextualized as a *question* the museum is asking, not a *truth* the museum is telling.
      *   *Refining the Condition:* The descendants object to "hidden vice." The artists want to dramatize "moral conflict." The compromise: The installation can explore the *possibility* of the bribe as a historical question, but cannot present the *acceptance* or *rejection* as a definitive internal fact. It must remain ambiguous or explicitly framed as "What if?" rather than "This happened in his head."
      *   *Timeline:* Needs to be tight but realistic before the installation opens. Draft revisions, review, final sign-off.
      *   *Appeal:* Needs to be clear. Who decides if conditions are met? The Committee Chair or an external arbiter? Let's say the Committee Chair with a right to reconvene.

  5.  **Refining the Tone:**
      *   Must be bureaucratic but ethical.
      *   Respectful to descendants (not dismissing their grief/claim).
      *   Respectful to artists (not censoring creativity arbitrarily).
      *   Institutional focus (precedent setting).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "narrative sovereignty"? Yes, defined it as distinct from factual error.
      *   *Check:* Did I address the artists' "paralysis" argument? Yes, acknowledged that a veto kills the genre.
      *   *Check:* Is it actionable? Yes, specific conditions on the script and labeling.
      *   *Check:* Is the timeline concrete? Yes, dates relative to the vote.
      *   *Critique:* Is "Conditional Approval" too vague? I need to specify *what* condition.
      *   *Adjustment:* The condition should be that the "bribe monologue" is reframed from a definitive internal debate to an explicit exploration of historical ambiguity. The script must use framing devices that prevent the audience from assuming this internal state is fact.

  7.  **Final Polish:** Ensure the distinction between "what they did" (epistemic) and "how we imagine their mind" (narrative) is the pivot point of the ethical reasoning. Ensure the timeline allows for the changes before funding is released.

      *(Self-Correction on Timeline)*: The vote is Thursday. The memo is *for* the vote. So the timeline starts *after* Thursday.
      *(Self-Correction on Appeal)*: Keep it internal to the museum structure for speed, but allow a formal written objection.

  8.  **Finalizing the Content:** (Mental outline of the specific argument regarding the bribe).
      *   The bribe implies corruption.
      *   No evidence exists.
      *   Descendants say this violates sovereignty.
      *   Artists say it illustrates the *pressure* reformers faced.
      *   Solution: Illustrate the pressure without asserting the internal temptation as fact. Make the *ambiguity* the subject, not the *vice*.

      *Wait, one more nuance:* The prompt asks to recommend approval, conditional approval, or rejection. I will recommend **Conditional Approval**.
      *Why?* Rejection sets a bad precedent for historical drama. Unqualified approval ignores the specific harm of attributing unproven vice. Conditional approval creates a new standard: "Speculative Interiority regarding Moral Failing requires Evidentiary Contextualization."

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Programming Committee
  **FROM:** [Your Name/Role], Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Funding for *The Unrecorded Hours* Installation

  **RECOMMENDATION**
  I recommend a vote for **Conditional Approval** of institutional funding for *The Unrecorded Hours*.

  Funding should be released contingent upon specific modifications to the script's treatment of the reformer's internal moral conflict, specifically regarding the invented bribe scenario. These modifications must be reviewed and approved by the Committee Chair prior to the disbursement of the second tranche of funding.

  **CONTEXT**
  The proposed installation utilizes immersive theater to explore the life of a 19th-century public-health reformer. While documented actions and public speeches are rendered faithfully, the production relies on speculative scenes to dramatize the subject's interior life. The primary controversy concerns an invented internal monologue depicting the reformer debating whether to accept a bribe from a factory owner. There is no archival evidence this bribe was offered or considered.

  The reformer's descendants object not to factual inaccuracies (epistemic harm), but to the attribution of unverified psychological states involving moral corruption. They term this violation "narrative sovereignty." The artists argue that labeling speculation as hypothetical preserves integrity and that granting descendants veto power over interiority would render historical drama impossible.

  **ETHICAL ANALYSIS**

  **1. Epistemic Harm vs. Narrative Sovereignty**
  The Committee must distinguish between two types of ethical obligation. The first is *epistemic fidelity*: the duty not to lie about what the dead did or said. The proposal satisfies this; no documented facts are altered. The second is *narrative sovereignty*: the claim that the dead retain an interest in how their consciousness is dramatized, particularly regarding moral character.

  While the museum cannot verify the internal lives of historical figures, we are not merely entertainment venues; we are stewards of public memory. To invent a scene of potential corruption without evidentiary basis risks converting a historical figure into a fictional archetype. If we accept the descendants' argument in full, we concede that the dead possess a property right over their psychological portrayal. This is untenable for a history museum, as it would preclude any interpretation of motive not explicitly confirmed by the subject. However, dismissing their concern entirely ignores the reputational damage caused by dramatizing hidden vice. We owe the dead fidelity not only to their actions but to a reasonable presumption of innocence when the record is silent.

  **2. The Artists' Argument: The Risk of Paralysis**
  The artists' counter-argument is substantial and must be weighed heavily. Biography and historical drama are inherently constructive; they require bridging gaps in the record with plausible inference. If the Committee establishes a bright-line prohibition on invented interior monologue, we effectively ban the genre of immersive historical theater. Every dramatization of a private conversation, a moment of doubt, or a decision-making process involves speculation.

  If descendants are granted a veto over speculative interiority, the museum's programming faces a "heckler's veto" risk. Any living stakeholder could halt a production by claiming the psychological portrayal feels "wrong," regardless of historical plausibility. This would paralyze the museum's ability to engage audiences emotionally with history, reducing our output to dry recitations of archived text. We cannot accept a standard that requires positive proof for every thought attributed to a historical subject.

  **3. The Institutional Balance**
  The decision cannot be a binary choice between a descendant veto and unqualified artistic license. We must navigate a middle path that protects the museum's ability to dramatize history while acknowledging the unique harm of attributing unproven moral failing.

  The harm here is not that the reformer is shown thinking (which is necessary for drama), but that he is shown *tempted by corruption* (which damages legacy) without evidence. The museum's duty is to ensure that speculation serves historical inquiry, not just narrative tension. When speculation leans toward moral failing, the burden of contextualization increases.

  **DECISION AND CONDITIONS**

  To accommodate the artists' need for dramatic tension while respecting the descendants' claim to narrative sovereignty, funding is approved under the following conditions:

  1.  **Reframing the Bribe Monologue:** The specific scene depicting the bribe debate must be rewritten. It cannot present the temptation as a definitive internal event. Instead, the script must frame this moment as an *historical question* rather than a *psychological fact*.
      *   *Implementation:* The actor may not speak the monologue as a soliloquy of fact. It must be framed through a device that signals ambiguity to the audience (e.g., a narrator explicitly stating, "We do not know if he was tempted, but the pressure was immense," or a projected text overlay citing the lack of evidence). The audience must leave understanding this is a dramatization of *structural pressure*, not a revelation of *private vice*.

  2.  **Enhanced Labeling:** All speculative scenes must carry a distinct visual or auditory marker differentiating them from archived content. The current proposal's "clearly labeled" standard is insufficient for scenes implying moral corruption. These specific moments require "High-Contrast Speculation" labeling (e.g., distinct lighting, specific soundscape, or explicit program notes).

  3.  **Stakeholder Consultation:** The production team must meet once with the descendants' representative not to seek approval of the art, but to explain how the modifications address the concern of "narrative sovereignty." This ensures the descendants feel heard without granting them editorial control.

  **TIMELINE FOR IMPLEMENTATION**

  *   **Thursday (Vote Day):** Committee votes on Conditional Approval.
  *   **T + 7 Days:** Artists submit revised script segment regarding the bribe monologue and proposed framing devices to the Committee Chair.
  *   **T + 14 Days:** Committee Chair reviews revisions for compliance with conditions. If compliant, authorization is given to release the first tranche of funding.
  *   **T + 21 Days:** Mandatory consultation meeting between artists and descendants' representative occurs. A brief report on the meeting (not the content of the artistic disagreement) is filed with the Committee.
  *   **T + 30 Days:** Second tranche of funding released pending successful completion of the above steps.

  **APPEAL PROCESS**

  *   **Artists:** If the production team believes the conditions fundamentally alter the work to the point of unviability, they may submit a written appeal to the full Committee within 5 days of the Chair's ruling. A majority vote will be required to overturn the Chair's decision.
  *   **Descendants:** If the descendants believe the modifications fail to address the violation of narrative sovereignty, they may submit a formal objection to the Museum Director. The Director will review whether the conditions were applied consistently with museum policy, but will not arbitrate artistic merit.

  **CONCLUSION**
  This conditional approval rejects the notion that the dead have a veto over their portrayal, preserving the museum's capacity for dramatic programming. However, it acknowledges that narrative sovereignty is a valid ethical consideration when speculation targets moral character. By forcing the production to dramatize the *ambiguity* of the bribe rather than the *reality* of the temptation, we honor the historical record, protect the reformer's legacy from unproven vice, and maintain the integrity of immersive theater.

  **ACTION REQUIRED**
  Please review this recommendation prior to Thursday's session. A motion to adopt this Conditional Approval framework will be brought to the floor immediately following the discussion of *The Unrecorded Hours*.
