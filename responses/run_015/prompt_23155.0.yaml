      *   **Explaining the User's Point (The Clinical Necessity):** Explain why doctors give numbers. We can't know everything, so we use the best proxy. The "most specific group with statistical power" is exactly what evidence-based medicine tries to do.
      *   **The Synthesis (How to decide):** This is the most important part. The user needs to make a decision (scan vs. wait).
          *   It's not about finding the "true" number.
