answer: |-
  You have put your finger on the single most persistent and damaging objection to deflationism. You are not imagining it, and you are not misreading the texts. This is the central tension in contemporary philosophy of truth.

  Here is the breakdown of the terminology, the structure of the problem, and the attempts to resolve it.

  ### 1. Does it have a name?

  There is no single noun that captures exactly what you describe, but there are several established phrases that map onto different parts of the shape you've identified.

  *   **The Explanatory Challenge (or Problem):** This is the broad umbrella term. It refers to the difficulty deflationists face in explaining why truth matters without appealing to a substantive property of truth.
  *   **The Success Argument:** This is the specific name for your **Case 1** (bridges and comets). It was formalized by Hilary Putnam and David Lewis. The argument is: "If truth were merely disquotational, the success of science would be a miracle. Therefore, truth must be a substantive property."
  *   **Inflationary Deflationism:** This is the pejorative label critics (like Paul Boghossian) apply to the move you spotted. It accuses the deflationist of officially denying truth has weight while unofficially inflating it to do work.
  *   **Free-Riding:** This describes the *mechanism*. The deflationist is accused of "free-riding" on the intuitive, correspondence-like notion of truth that they claim to have eliminated. They use the *word* "true" to trigger the reader's realist intuitions, then retreat to the deflationary definition when pressed.

  ### 2. Is it one phenomenon or two?

  Your Case 1 (Scientific Success) and Case 2 (Normative Value) are distinct but structurally identical.

  *   **Case 1 is Metaphysical/Epistemic:** It asks how a logical device tracks physical stability. If "true" adds nothing to "the train leaves at six," why does believing the train leaves at six get you to the station, while believing it leaves at seven does not? The deflationist needs to explain why *some* assertions are reliable guides and others aren't without saying one corresponds to reality and the other doesn't.
  *   **Case 2 is Normative:** It asks why truth is a *goal*. If "true" is just a logical operator, why is it better to have a belief that functions as a logical operator correctly than one that makes you happy?

  Philosophers often treat these as two fronts in the same war. If you solve the Success Argument, you usually solve the Normativity problem, because both rely on truth being a **natural kind** or a **robust property** that interacts with the world.

  ### 3. Quasi-Realism and Causation

  You are absolutely right about **Quasi-Realism**.
  *   **Simon Blackburn's Quasi-Realism** is the project of earning the right to talk *as if* there are moral facts ("Murder is wrong") while maintaining that there are no moral facts (expressivism).
  *   **The Shape:** It is identical. You deny the ontology (no moral facts / no truth property) but try to preserve the discourse (moral reasoning / truth explanations).
  *   **The Difference:** Quasi-realism is usually about *projecting* attitudes onto the world. Deflationism is about *disquoting* sentences. But the "borrowing weight" maneuver is the same.

  You are also right about **Causation**.
  *   **Humean Regularity:** "Cause" is just constant conjunction (Event A is always followed by Event B).
  *   **The Borrowing:** Then the philosopher says, "We must intervene on Variable A because it *causes* Variable B."
  *   **The Tension:** If cause is just a pattern, why does intervening on the pattern change the outcome? To explain intervention, you need causation to be a "glue" or a "mechanism" (a productive relation), which the Humean explicitly denied exists. This is often called the **Problem of Causal Efficacy** in anti-realist metaphysics.

  ### 4. Is the borrowing illegitimate? (Paying the Debt)

  This is the part you care about most. Can a thin notion carry explanatory weight?

  **The Critic's View (No):**
  Critics like Paul Boghossian (*Fear of Knowledge*) argue the borrowing is illegitimate. Their argument is that explanation requires *properties*. To explain why bridges stand up, you need a property of the theory that links it to the physical world. Disquotation is a linguistic rule, not a physical link. If you eliminate the link, you cannot explain the success. Therefore, the deflationist is being inconsistent.

  **The Deflationist's Defense (Yes, if...):**
  Deflationists (most notably **Paul Horwich**) argue they *can* pay the debt, but they have to decompose the explanation. They cannot say "Truth explains success." They must say:

  1.  We desire success.
  2.  We believe that if we act on premise $P$, we will succeed.
  3.  We believe that $P$ is true.
  4.  By the T-schema, believing "$P$ is true" is equivalent to believing $P$.
  5.  Therefore, we act on $P$.
  6.  If $P$ is true (i.e., if $P$), the action succeeds.

  **The "Payment":** The deflationist claims they have paid the debt by showing that the word "true" allows us to generalize over infinite propositions without positing a "Truth Property." They argue the explanatory work is actually done by the **content** of the belief ($P$), not the property of truth.

  **Why this often feels like cheating (The Generalization Problem):**
  Your intuition that the debt isn't paid is shared by many philosophers. The deflationist strategy above explains why *a specific* true belief leads to success. It fails to explain why *true beliefs in general* tend to lead to success more often than false ones.
  *   To explain the *general trend* (science works), you need to say "True theories map the world."
  *   The deflationist is forced to say "Theories that say 'the world is X' and the world is X work."
  *   Critics say this is tautological. It explains the success of truth by assuming the success of truth.

  **Functionalism as a Middle Ground:**
  Some philosophers (like **Michael Lynch**) try to solve this by separating the *concept* from the *property*.
  *   **Concept:** Deflationary (what we mean by "true" is captured by the T-schema).
  *   **Property:** Inflationary (the role truth plays in explanation is a real, functional property).
  This allows them to keep the deflationary definition but admit that truth does "heavy lifting" as a functional role. This is often called **Alethic Functionalism**.

  ### 5. Where are the edges?

  You asked about chains of dependency and rhetorical vs. load-bearing use.

  *   **The Chain:** If Truth leans on Correspondence, and Correspondence leans on Reference, and Reference leans on Causation... deflationists usually try to stop the chain at **Use**. They argue Reference is not a relation between word and object, but a feature of how we use the word. Critics argue this just pushes the "weight" back to "Use," which then has to do all the heavy lifting, effectively becoming the substantive property under a new name.
  *   **Rhetorical vs. Load-Bearing:** This is a crucial distinction.
      *   *Rhetorical:* "We should seek the truth." (Motivational). Deflationists can handle this easily; it's just expressing a preference for disquotable assertions.
      *   *Load-Bearing:* "The bridge stands *because* the calculations were true." (Causal/Metaphysical). This is where the borrowing is most suspect. If you remove "true" and replace it with "disquotably assertible," the bridge explanation collapses.

  ### Summary for your margins

  When you see this move in the wild, you are looking at **The Explanatory Challenge to Deflationism**.

  *   **The Move:** Using a logical device to do metaphysical work.
  *   **The Critique:** **Inflationary Deflationism** or **Free-Riding**.
  *   **The Defense:** **Decomposition** (breaking the explanation into specific instances) or **Functionalism** (truth is a role, not a nature).
  *   **The Verdict:** There is no consensus. Many technical documentation writers (and philosophers of science) find the deflationist "payment" insufficient. They argue that if a concept explains physical success, it must track something real, regardless of what the definition says.

  You are effectively spotting a **category error**: trying to use a syntactic tool to solve a semantic/ontological problem. Whether that error is fatal depends on whether you believe the "success of science" requires a realist explanation. If you are an instrumentalist (theories are just tools, not maps), the deflationist account works. If you are a realist (theories map reality), the deflationist account looks like it's trying to have its cake and eat it too.
