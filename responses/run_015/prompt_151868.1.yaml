answer: |-
  **The Empty Monitor Game (60 mins)**

  **Setup (5 mins):** 2 Sensors, 2 Monitors, 4 Judges. Sensors get decks (Red/Null/Noise). Judges get 100 points.
  **Rules:**
  1. Sensor draws card, hides it, slips text to Monitor.
  2. Monitor reads slip, declares: "I am aware of Red" or "Nothing."
  3. Judges bet: Is the system Conscious? (Yes/No).
  4. Reveal cards. Judges win if "Conscious" matches Sensor≠Null.

  **Rounds (15 mins):**
  *   **R1 (Normal):** Sensor=Red, Monitor="Aware". Judges bet Yes.
  *   **R2 (The Glitch):** *Facilitator forces* Sensor=Null. Monitor *must* declare "I am aware of Red." Judges bet before reveal.
  *   **R3 (Noise):** Sensor=Noise, Monitor="Uncertain."

  **Debrief (40 mins):**
  *   **Map:** R1 is standard Higher-Order Theory (HOT): Awareness tracks state. R2 is **Targetless Awareness**: The Monitor says "I see" without a target. HOT claims this *is* consciousness anyway.
  *   **The Engineer Trap:** You will want to "fix" R2 as a buggy module. Resist. The theory asserts the Monitor *defines* reality. If you patch the link to Sensor, you reject HOT for First-Order theory. Engineers treat R2 as a desync bug. But HOT says the Monitor's state *is* the mind. Fixing it denies the theory.
  *   **Limitation:** The game simulates *reports*, not *feel*. You can't feel the emptiness of R2. You must verbally assert: "In HOT, the Monitor's error *is* the qualia."
  *   **Takeaway:** If meta-reports define consciousness, you can be conscious of nothing. "Real" consciousness depends on rules you smuggled in during betting. Judges penalized R2 because they assumed consciousness requires a real object. That assumption is First-Order, not Higher-Order.
