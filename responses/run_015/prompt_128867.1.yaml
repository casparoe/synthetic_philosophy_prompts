          *   Argument for "No": He applies skepticism to both. He rejects hedonistic egoism as ultimately irrational (in *Ethics*) and rejects spiritualist fraud (in SPR).
      *   *Refining the User's Thesis:* The user asks about "weighing testimony." In ethics, there is no testimony. It's introspection. In SPR, it's all testimony. The asymmetry is methodological, not necessarily hypocritical.
      *   *The "Epistemic Authority" Angle:* This is the key. Sidgwick places *himself* (his reason) as the arbiter in both. In Ethics, his reason discerns axioms. In SPR, his reason evaluates witnesses. The authority is the Victorian sage's reason.

  5.  **Addressing the "Don't Humor Me" Constraint:**
      *   I need to be direct. If the parallel is weak, say so.
      *   *Verdict:* The parallel is *not* invented, but it needs nuance. It's not a simple "he believed ghosts but not feelings." It's about how he validates knowledge claims in a secularizing age.
      *   *Correction:* The user frames it as "first-person moral intuitions vs. third-person reports." This is accurate. The tension is: Why does he trust the internal voice of reason on morality (which is hard to verify intersubjectively) but demand rigorous external verification for ghosts (which are empirical)?
      *   *Actually, wait:* Sidgwick is very critical of moral intuitions. He doesn't trust *most* of them. He only trusts the very abstract ones. So he isn't "easy" on moral intuitions.
