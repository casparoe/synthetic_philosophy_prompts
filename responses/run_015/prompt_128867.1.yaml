answer: |-
  You are not inventing this tension. It is a well-documented and significant fracture in Sidgwick's thought, recognized by major Sidgwick scholars (most notably Bart Schultz in *Henry Sidgwick: Eye of the Universe* and Christine Everett in her work on Sidgwick's psychical research).

  However, if you frame it simply as a "double standard" regarding the *weight of evidence* (i.e., "he was too credulous about ghosts but too trusting of feelings"), you will misrepresent his methodology and weaken your chapter. Sidgwick was not lax about moral intuitions, nor was he blindly credulous about telepathy.

  The asymmetry you are detecting is real, but it is not a failure of consistency; it is a **methodological dualism driven by a philosophical crisis.**

  Here is an honest assessment of the tension, how to characterize it accurately, and where you need to be careful not to overstate the case.

  ### 1. The Nature of the "Evidence" is Categorically Different
  Your prompt contrasts "first-person moral intuitions" with "third-person reports." This is accurate, but you must clarify what Sidgwick means by "intuition."

  *   **In *The Methods of Ethics*:** Sidgwick is not validating subjective feelings or cultural norms. He is a rational intuitionist. For him, a valid moral intuition is not "I feel this is right," but "Reason apprehends this proposition as self-evident." He applies a rigorous filter (the "tests of self-evidence": clarity, consistency, consensus among experts). He actually *rejects* the vast majority of common-sense moral intuitions. The bar here is **logical necessity**.
  *   **In Psychical Research:** He is dealing with empirical anomalies. The evidence is testimonial and statistical. The bar here is **empirical probability**.

  **The Tension:** The asymmetry lies in the *direction of fit*. In ethics, he demands that reality conform to rational axioms. In psychical research, he demands that reason conform to empirical anomalies.

  ### 2. The Motivational Asymmetry (The "Hidden" Double Standard)
  This is where your argument about epistemic authority will land hardest. There is a functional asymmetry in *why* he accepts the evidence in each domain.

  *   **Ethics:** He accepts the axioms of Rational Benevolence and Prudence because without them, ethical reasoning collapses into egoism. He *needs* them to be true for the system to work.
  *   **Psychical Research:** He pursues evidence for telepathy and survival because without them, the ethical system collapses into the "Dualism of Practical Reason" (the conflict between duty and self-interest). If there is no afterlife/retribution, it is not rational to be moral.

  **Assessment:** You are justified in arguing that Sidgwick applies a **pragmatic pressure** to his evidential bars. He is more willing to accept "anomalous" third-person testimony in psychical research because his ethical system *requires* the possibility of a spiritual order to resolve the Dualism of Practical Reason.

  He does not weigh testimony consistently because the *stakes* are different. In ethics, he is establishing the *conditions* of rationality. In psychical research, he is looking for the *facts* that make those conditions livable.

  ### 3. Where You Might Be Forcing the Parallel
  You asked me to call it out if you are forcing a parallel. Here is the danger zone:

  **Do not argue that he treats moral intuitions as "testimony."**
  Sidgwick would vehemently reject the idea that a moral axiom is validated by testimony (even the testimony of sages). It is validated by the individual's reason. If you argue that he treats the "voice of conscience" similarly to the "testimony of a witness," you are conflating his Rational Intuitionism with Empiricism.

  **The nuance you need:** The parallel isn't in the *type* of evidence, but in the **epistemic authority of the interpreter.**
  *   In Ethics, Sidgwick's own reason is the final arbiter of what counts as a self-evident axiom.
  *   In SPR, Sidgwick's own judgment is the final arbiter of which witnesses are credible.
  *   **The Authority:** In both cases, the "Victorian Sage" (Sidgwick himself) stands between the raw data (feelings/witnesses) and the established truth. The tension is that he uses his authority to shield moral axioms from empirical disproof while using that same authority to validate empirical claims that science rejects.

  ### 4. How to Frame This for Your Chapter
  To make this work for a chapter on epistemic authority in Victorian philosophy, frame it as **The Crisis of the Secular Priest.**

  Sidgwick represents a specific Victorian epistemic bind:
  1.  He cannot accept religious dogma (authority of the Church).
  2.  He cannot accept materialist naturalism (authority of Science) because it undermines morality.
  3.  He attempts to create a **third epistemic authority**: The Critical Philosopher.

  **The Argument:**
  *   Sidgwick attempts to purify morality of dogma by subjecting intuitions to rational critique (*Methods of Ethics*).
  *   He attempts to purify religion of dogma by subjecting it to scientific scrutiny (SPR).
  *   **The Asymmetry:** The scrutiny is asymmetrical because the *goal* is different. In ethics, the goal is coherence. In psychical research, the goal is the discovery of exceptions to natural law.
  *   **Conclusion:** The "double standard" is not hypocrisy; it is a desperate attempt to keep the moral universe open in a closing scientific world. He lowers the evidential bar for psychical phenomena not because he is gullible, but because the *cost* of rejecting them is the irrationality of morality.

  ### 5. Scholarly Backing
  To ensure you aren't "inventing" this, lean on these interpretations:
  *   **Bart Schultz:** Argues that Sidgwick's psychical research was not a hobby but an integral part of his philosophical project to solve the Dualism of Practical Reason.
  *   **Alan Brown:** Notes that Sidgwick viewed the SPR as a way to apply scientific method to religious questions, bridging the gap between faith and reason.
  *   **Katarina Peacock:** Has written on Sidgwick's epistemology of testimony in the SPR context.

  ### Summary Verdict
  **Is the tension real?** Yes.
  **Is it a simple double standard on testimony?** No, because the categories (rational intuition vs. empirical testimony) are distinct in his system.
  **Is it a double standard on *epistemic authority*?** Yes. He empowers his own philosophical judgment to validate moral axioms *a priori* while demanding *a posteriori* proof for religious hopes, yet he is willing to accept weaker *a posteriori* proof than mainstream science would allow because of the *a priori* necessity.

  **Advice:** Don't claim he weighs testimony the same way in both. Claim that he deploys **different epistemic tools to secure the same end**: the rationality of the moral life. The tension reveals the fragility of Victorian attempts to ground authority in reason alone. That is a strong, defensible, and textually supported argument.
