  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Sidgwick on Ethics:* In *The Methods of Ethics* (1874, etc.), Sidgwick is a rational intuitionist. He seeks self-evident axioms. These are not mere "feelings" but intellectual apprehensions of truth. He applies rigorous criteria for what counts as a genuine intuition (clarity, consistency, consensus among experts).
      *   *Sidgwick on Psychical Research:* Sidgwick was a founding member of the Society for Psychical Research (SPR) in 1882. He was deeply invested in establishing telepathy/ghosts as empirical facts. He treated this as a scientific endeavor, relying heavily on testimony, case collection, and statistical reasoning (e.g., *Phantasms of the Living*).
      *   *The Tension:* Ethics relies on *a priori* rational intuition (internal, first-person). Psychical research relies on *a posteriori* empirical testimony (external, third-person).
      *   *The User's Hypothesis:* The user suggests a potential double standard: Is Sidgwick too easy on moral intuitions (subjective) and too hard/strict on psychical evidence? Or vice versa? Or is he inconsistent in how he weighs testimony vs. internal conviction?
      *   *Victorian Context:* The crisis of faith, the rise of scientific naturalism, the desire to find a "third way" between dogmatic religion and materialism.

  3.  **Evaluating the "Asymmetry" Claim:**
      *   *Is it a double standard?* Not necessarily a *double standard* in the pejorative sense, but a *methodological dualism*. Sidgwick distinguishes between the domains.
      *   *Moral Intuitions:* For Sidgwick, these aren't just "I feel this is right." They are propositions that must withstand critical reflection. He admits many common moral intuitions fail the test. Only a few abstract axioms survive (e.g., Justice, Prudence, Rational Benevolence). So, the bar is actually quite *high* for moral intuitions.
      *   *Psychical Evidence:* Here, Sidgwick is fighting against the scientific establishment's dismissal. He demands rigorous verification of testimony to prove anomalies. He is skeptical of fraud but open to the possibility.
      *   *The Connection:* Sidgwick hoped psychical research would provide empirical evidence for survival after death, which would support the rationality of moral duty (resolving the "dualism of practical reason" in *Ethics*).
      *   *The User's specific angle:* "First-person moral intuitions vs. third-person reports."
      *   *Assessment:* The user is onto something real, but needs to be careful about framing it as a "double standard." It's more of a *complementary desperation*. Sidgwick needed *both* to hold his system together.

