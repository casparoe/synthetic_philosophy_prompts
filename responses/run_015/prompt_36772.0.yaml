      *   *Step 3 is the easy target.* Most logicians agree indicative conditionals $\neq$ material conditionals.
      *   *Step 1 is the deep target.* If evidence is a constraint, we need a rule.
      *   *The "Cost":* The cost is admitting that "Learning = Ruling Worlds Out" is incomplete. Sometimes learning is "Learning a Ratio."
      *   *British English check:* "Realise" vs "Realize", "Maths" vs "Math", "Centre" vs "Center", vocabulary like "rubbish", "quibble", "chap", "programme".

  7.  **Final Plan:**
      *   **Diagnosis:** Step 3 is false (Conditionals $\neq$ Material). Step 1 is too restrictive (Evidence $\neq$ just World-Sets).
      *   **The Fix:** Treat the evidence as a constraint on the posterior distribution ($P_{new}(R|B) = 2/3$).
      *   **The Rule:** Principle of Minimum Information (MinInfo). Explain it simply (change your mind as little as possible).
      *   **Why it works:** It yields $P(Blue)=1/3$ (intuition preserved) and $P(Rear|Blue)=2/3$ (evidence respected).
      *   **The "Proves Too Much" Rebuttal:** Conditionals *are* evidence, just not the *kind* that triggers simple conditioning. They trigger MinInfo.
      *   **Cost:** You lose the simplicity of "just cross out worlds." You gain the ability to handle real-world expert testimony.

  8.  **Writing the content:** (Mental check of the maths).
