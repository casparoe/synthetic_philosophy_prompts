  To figure out which rule she is *actually* using (Functional Community vs. Legal Membership), ask her this:

  **The Test Case:**
  > "What about an **undocumented immigrant** who has lived here for 20 years, has kids, pays taxes, but has no legal pathway to citizenship and could be deported at any time?"

  *   **If she says YES:** She follows **Rule 1 (De Facto Community).** She cares about where your life actually is, regardless of what the paperwork says. (This would mean she *might* vote for the orchard crew if their tenure is long enough).
  *   **If she says NO:** She follows **Rule 2 (Legal Membership).** She requires the state to recognize your right to stay. (This confirms she will definitely vote NO on the orchard crew).

  This case isolates the variable of **Legal Status** from **Social Integration**, which is the exact tension point in the orchard scenario.
