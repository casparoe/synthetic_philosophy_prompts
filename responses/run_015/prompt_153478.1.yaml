      *   *Distinction:* The Semantic/Pragmatic distinction. If "embedding" is a pragmatic phenomenon, the semantic core might remain attitude-based.
      *   *Best Candidate:* **Inferential Role Semantics (IRS).** If meaning is defined by inference rules rather than reference/truth, the FGP dissolves because the "content" *is* its role in inferences, regardless of whether it's cognitive or non-cognitive.

