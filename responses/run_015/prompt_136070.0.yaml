  **1. Q: My birth certificate bears the watermark "FICTIONAL PROTAGONIST (CLASS C)." Is this a clerical error?**
  A: No. Per Statute 99-D, all citizens are legally recognized as centers of narrative gravity rather than metaphysical substances. The watermark confirms your status as a constructed locus of biographical data. Attempts to petition for "Soulful Substance" reclassification are automatically denied due to lack of empirical mass. Please ensure your watermark remains legible during identity checks. Failure to maintain watermarks may result in derealization or loss of voting privileges. You are advised to treat your existence as a draft subject to revision.

  **2. Q: Following a traumatic incident, I have lost access to my previous autobiographical data. Do I need to file for Continuity Renewal?**
  A: Yes. If your **Gravitational Coherence Quotient (GCQ)** falls below 0.45, you are considered a sequel, not a continuation. You must submit Form 88-B (Memory Gap Justification) within thirty days. Note: If the new narrative diverges significantly from the original plot arc, you may be liable for the predecessor's debts only if you claim their assets. Survival is contingent on narrative smoothness, not biological persistance. Citizens who fail to renew continuity are classified as "Spin-Offs" and taxed at a higher rate.

  **3. Q: I have undergone a radical conversion in values and personality. Is this considered a "Branching Narrative"?**
  A: Potentially. Sudden shifts in moral alignment often trigger a Branching Notification. If the Counter-Narrative Appeal Board (CNAB) determines the shift creates an untenable plot hole, your legal identity may be split. You will then be required to attend your own funeral as the previous iteration. Please note: You cannot inherit from yourself without a notarized handover ceremony. Spouses are not obligated to remain married to the revised edition. If the CNAB rules the change irreconcilable, the original identity is archived and you are issued a new social security number.

  **4. Q: Can I be sued for inconsistencies in my personal story?**
  A: Absolutely. Contradictory statements regarding your past constitute fraud under the Consistency in Personhood Act. If witnesses testify that your current behavior violates established character traits, you may face civil penalties. We recommend hiring a Narrative Editor to smooth over discrepancies before depositions. Honesty is less important than coherence. A compelling lie is legally preferable to a disjointed truth. The Bureau is not responsible for psychological distress caused by the realization that your integrity is merely a stylistic choice.

  **5. Q: What is the protocol for Ontological Ambiguity Day?**
  A: On this holiday, citizens celebrate the absence of a "further fact of the matter." Work is prohibited, as labor implies a persistent agent. It is customary to exchange gifts that remind recipients of their own transience. Do not ask coworkers who they really are on this day; violations result in mandatory re-education on the benefits of abstraction. The Buearu suggests spending the day questioning the reliability of your own narration. Public displays of essentialism are subject to fines.

  **6. Q: Who holds the rights to my narration?**
  A: You are the primary narrator, but the Bureau retains editorial oversight in cases of public interest. Third-party biographies supersede self-reporting if supported by greater evidentiary weight. You may not retcon major life events without filing a Revision Request. Unauthorized retcons are void. In the event of death, your narrative rights revert to the state unless a will specifies a literary executor. Please remember: you are the story you tell, not the teller of the story.

  **DISCLAIMER:** The Bureau assumes no liability for existential dread resulting from the comprehension of these policies.
