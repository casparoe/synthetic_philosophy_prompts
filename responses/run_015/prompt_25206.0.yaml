prompt: |-
  I'm a high school student writing a paper for my philosophy class on whether genuine moral dilemmas are possible — situations where two moral requirements genuinely conflict and there's no right answer, just a choice between wrongs. I'd like you to construct a thought experiment that makes the case for a genuine dilemma as strong as possible.

  Specifications: the scenario should be realistic (a family, school, or community setting — no trolleys, no lifeboats, no science fiction), no longer than one paragraph, and the conflict should not be easily dissolved by appealing to a single higher-order principle like "minimize suffering" or by arguing that one of the apparent obligations isn't really an obligation once you think it through carefully. The dilemma should feel like it survives the obvious moves.

  After presenting the scenario, please do the following:
  (1) Walk through what a defender of genuine moral dilemmas would say about why this case resists resolution.
  (2) Then show how someone who denies that genuine dilemmas are possible would try to resolve it — what move would they make, and does it succeed?
  (3) Give your own verdict: is this a genuine dilemma or not?
  (4) Finally, tell me what argument or consideration would be most likely to change your mind about your verdict, or where you think your reasoning is most vulnerable to being wrong.
