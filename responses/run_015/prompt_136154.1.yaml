answer: |-
  The institutional practice you describe—binarising non-coding DNA into 'functionally constrained' (under purifying selection) or 'neutral' (evolutionary noise)—reveals a profound, often unacknowledged, philosophical commitment within contemporary evolutionary genomics. This dichotomy is not merely a heuristic convenience; it encodes a specific ontology of biological explanation that privileges adaptationism over structuralism. To address your inquiry, we must dissect the logical architecture of this classification, evaluate its compatibility with the Gould-Lewontin critique, and consider the institutional reforms required to accommodate a more pluralistic evolutionary theory.

  ### 1. Philosophical Commitments and the Implicit Theory

  The binary classification presupposes a commitment to **methodological adaptationism**. This is the working assumption that the most productive explanatory strategy in biology is to identify the selective advantage conferred by a trait. In the context of genomics, 'function' is operationalised as 'evolutionary conservation'. The implicit theory runs as follows:

  1.  **Premise 1:** If a sequence persists across evolutionary time without significant mutation, it is under purifying selection.
  2.  **Premise 2:** If a sequence is under purifying selection, it is because mutations to it incur a fitness cost.
  3.  **Conclusion:** Therefore, persistent sequences possess a specific utility (an 'adaptive purpose' or 'selectively maintained function') that explains their preservation.

  This logic entails that all persistent biological structures must either carry adaptive significance (in the sense of contributing to fitness via a specific selected effect) or be causally inert (neutral). By defining 'functional constraint' almost exclusively through the lens of purifying selection for a *specific* molecular role (e.g., transcription factor binding, RNA secondary structure), the practice effectively rules out *a priori* the possibility that a sequence could be developmentally entrenched and evolutionarily stable simply because it is a necessary by-product of a larger architectural system.

  In the Gould-Lewontin framework, a spandrel is not 'neutral'—it cannot be altered without collapsing the arch—but nor does it possess an independent adaptive history. It is maintained by selection, but not *for* itself. The genomic binary collapses this distinction. It treats 'constrained' as synonymous with 'adaptively purposeful', thereby conflating **maintenance by selection** with **selection for a specific function**. Consequently, the implicit theory denies the ontological status of the spandrel: it forces the spandrel into the 'adaptive' category, thereby inviting 'just-so stories' to explain why a structural by-product must have a specific molecular utility.

  ### 2. Strict Requirements versus Comfortable Fit

  It is crucial to distinguish what this practice strictly requires from what merely fits it comfortably.

  **Strict Requirements:**
  Strictly speaking, the mathematical models of population genetics used to detect constraint (such as phyloP or phastCons) require only that the rate of substitution be lower than the neutral expectation. They do not logically demand that the sequence performs a specific biochemical task. One could, in principle, annotate a region as 'constrained' without asserting a specific adaptive mechanism. The statistical detection of purifying selection does not, in itself, prove adaptationism; it proves only that variation is deleterious.

  **Comfortable Fit:**
  However, the *interpretation* of these data fits comfortably within an adaptationist paradigm. When a consortium like ENCODE annotates a region as 'functional', the surrounding discourse invariably implies a specific causal role that was favoured by natural selection. This fits comfortably because:
  *   **Grant Narratives:** It is easier to secure funding for discovering 'new regulators' than for identifying 'structural inevitabilities'.
  *   **Database Ontologies:** Standard ontologies (such as the Sequence Ontology) are designed to catalogue molecular activities (binding, catalysis), not structural necessities or developmental by-products.
  *   **Publication Bias:** Journals favour positive assertions of function over null hypotheses of structural constraint.

  Thus, while the mathematics allows for a category of 'constrained but non-adaptive', the institutional ecosystem pressures researchers to interpret constraint as evidence of specific utility. The practice does not strictly *logically* forbid spandrels, but it makes them invisible by lacking the vocabulary to describe them.

  ### 3. Compatibility with a Robust Spandrel-Based View

  Is the current practice compatible with a robust spandrel-based view of genome architecture? **No.**

  A robust spandrel view posits that much of the genome's architecture is determined by physical constraints (e.g., chromatin packing ratios, nucleosome positioning mechanics, replication timing) and developmental pathways that limit the space of viable variations. In this view, a sequence might be conserved not because it binds a specific protein, but because removing it would disrupt the physical spacing required for the chromosome to fit in the nucleus or to segregate correctly during meiosis.

  The current binary forces a false choice:
  *   If the sequence is conserved, it is labelled 'functional' (implying a specific selected effect).
  *   If it is not conserved, it is labelled 'neutral' (implying it matters little).

  There is no slot for 'structurally indispensable'. By labelling a spandrel as 'functional', we misrepresent its evolutionary history. We imply it was optimised by selection, when in reality it may simply be the unoptimised but necessary cost of building a complex system. This leads to what Gould termed 'exaptationism' run riot: assuming every conserved feature was designed for its current use, rather than acknowledging it may be a co-opted or inherent structural feature.

  ### 4. Institutional Reforms: Annotation and Funding

  If evolutionary biology were to take the Gould-Lewontin critique seriously as an organising principle, rather than a marginal exception, significant changes would be required in annotation protocols and funding criteria.

  **Annotation Protocols:**
  1.  **Tripartite Classification:** Databases (such as Ensembl or UCSC Genome Browser) would need to move beyond the Functional/Neutral binary. A third category, such as **'Structurally Constrained'** or **'Developmental By-product'**, must be introduced. This category would denote sequences that are evolutionarily stable due to physical or systemic necessity rather than specific molecular utility.
  2.  **Evidence Codes:** Current evidence codes (e.g., 'inferred from direct assay') focus on molecular interaction. New codes are needed for 'inferred from physical modelling' or 'inferred from developmental constraint'.
  3.  **Null Models:** Annotation pipelines would need to incorporate null models of genome architecture (e.g., polymer physics models of chromatin) to distinguish between sequence conservation due to specific binding versus conservation due to bulk physical properties.

  **Funding Criteria:**
  1.  **Valuing Negative Results:** Funding bodies (such as the BBSRC or Wellcome Trust) would need to prioritise research that demonstrates the *lack* of specific adaptive function in conserved regions. Proving a region is a spandrel is currently scientifically undervalued compared to claiming it is a regulator.
  2.  **Interdisciplinary Modelling:** Grants would need to encourage collaboration between evolutionary biologists, biophysicists, and developmental systems theorists. The focus would shift from 'gene hunting' to understanding the 'physics of the genome'.
  3.  **Reframing 'Function':** Call for proposals would need to explicitly distinguish between 'selected-effect function' (adaptive purpose) and 'causal-role function' (what it does now, regardless of history). Research aiming to explain genome architecture through structural necessity rather than adaptive optimisation would be given equal standing.

  ### Conclusion

  The binary classification of non-coding DNA presupposes that evolutionary stability is synonymous with adaptive utility. It reconstructs an implicit theory where persistence implies purpose, thereby rendering the 'spandrel'—the structurally indispensable but adaptively arbitrary—conceptually invisible. While the statistical methods used do not strictly forbid the existence of spandrels, the institutional culture of genomics comfortably absorbs them into an adaptationist narrative. To align with a robust Gould-Lewontin perspective, the field must abandon the equation of conservation with specific function. It requires a new ontology that recognises structural necessity as a legitimate evolutionary explanation, demanding a shift in both how we annotate the genome and how we value the questions we ask of it. Only then can we distinguish between the arches selection has built and the spandrels that necessarily follow.
