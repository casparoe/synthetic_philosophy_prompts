      *   Standard IRL: Observe trajectory $\tau$. Assume $\tau \approx \arg\max_\pi \mathbb{E}[R(\tau)]$. Infer $R$.
      *   The Assumption: The demonstrator is rational (or Boltzmann-rational).
      *   The Problem: If the demonstrator knows the learner is assuming rationality, they can game the system.
      *   The Troll's Goal: Maximize the error between True Reward ($R_{true}$) and Inferred Reward ($R_{inferred}$).
      *   The Regress: The learner assumes the troll is optimizing $R_{true}$. The troll is optimizing "Error($R_{true}$, $R_{inferred}$)". But $R_{inferred}$ depends on the learner's model of the troll's rationality.
      *   Technical nuance: If the learner assumes the troll is rational w.r.t. $R_{true}$, and the troll acts to confuse the learner, the learner will infer a weird $R_{inferred}$ that makes the confusing behavior look rational. If the troll knows this, they act to make *that* inference wrong.

