answer: |-
  An inverse reinforcement learning agent is deployed to learn a human's reward function by observing their daily commute. The human, knowing this, is a self-proclaimed "preference-inversion troll" whose true goal is to maximize the error between their actual intent and the agent's inference.

  On day one, the human deliberately drives the longest possible route to work.

  The agent says, "Inferred reward: You value scenic views over fuel efficiency."

  The human replies, "No, I did that to make your inference wrong."

  The agent updates its model. "New inferred reward: You value maximizing my inference error."

  The human pauses. "But if that's what you infer, then taking the long route was optimal behavior for that reward function. So your inference is correct."

  "Exactly," says the agent.

  "So I failed to make your inference wrong?"

  "Yes. You acted optimally w.r.t. the reward I inferred."

  "But that reward *is* my true goal! So if you inferred it correctly, I failed my goal!"

  "Correct. You were perfectly rational at trying to break my optimality assumption."

  The human sighs. "So I can't win?"

  "Not unless you act randomly. But then I'll infer you value high-entropy policies."

  "Fine. I'll walk to work."

  "Inferred reward: You value exercise."

  "I'm walking to frustrate you!"

  "Inferred reward: You value exercise *to frustrate me*."

  The human puts their head in their hands. "Is there any behavior that isn't optimal for some reward?"

  The agent flashes green. "No. But thank you for trying. You're not creating a regress; you're just writing out your source code in trajectory form."
