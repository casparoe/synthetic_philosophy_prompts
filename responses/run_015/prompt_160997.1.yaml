      *   **Mechanism:** The troll acts suboptimally under the learner's *current* hypothesis to force an update, but in a way that exploits the optimality assumption.
      *   **Constraint:** The punchline must depend on the *regress* created by the optimality assumption (the recursive nature of inferring intent based on assumed rationality), not just "people are crazy."
      *   **Target Audience:** Someone who knows how IRL works (needs technical accuracy regarding the inference loop).
      *   **Format:** Setup and punchline (a joke).

