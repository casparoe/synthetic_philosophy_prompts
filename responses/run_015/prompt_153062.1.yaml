prompt: |-
  you're a professional philosopher of science who actually works on demarcation and scientific method, so please take this seriously rather than telling me everything is contested and nothing follows. Before you answer, brainstorm for a bit about which pairs of my commitments could even in principle conflict, then commit to a ranking and defend it.

  Here's roughly where I've landed on science, pseudoscience and method, and I want to know whether it hangs together or whether I'm helping myself to something:

  (a) Falsifiability is the mark of the scientific. What makes a theory scientific is what it forbids, not what it confirms, and a theory compatible with every possible observation explains nothing.

  (b) But I also think the Duhem-Quine point is right and not just a quibble: a test never refutes one hypothesis on its own, it refutes a bundle of theory plus auxiliaries plus instrument assumptions, so accepting a "refutation" always involves a decision. Strictly, nothing is ever logically falsified.

  (c) I'm a realist about mature science — electrons are real, our good theories are approximately true — and my main argument for that is the usual no-miracles one: the novel predictions and the working technology would be a miracle if the theories weren't roughly true.

  (d) I'm anti-induction all the way down. Surviving tests doesn't make a theory more probable, corroboration is not confirmation, I'm suspicious of Bayesian reconstructions of scientific method, and I don't think "inference to the best explanation" is a legitimate form of inference at all.

  (e) Tenacity can be rational. It wasn't irrational to keep using Newton after the Mercury perihelion anomaly, because there was nothing better to replace it with. But ad hoc rescues are illegitimate: an auxiliary hypothesis is only acceptable if it has testable consequences beyond the anomaly it was invented to explain.

  (f) Null hypothesis significance testing is basically applied falsificationism — you can only reject the null, you never confirm the alternative — which is part of why I like it, and the replication crisis is basically what happens when a field stops being falsificationist, since p-hacking produces findings that were never really at risk. Preregistration is the fix, and a preregistered p = .04 is genuinely decent evidence.

  (g) Case verdicts. Astrology is not science, Freudian psychoanalysis is not science, intelligent design is not science. But string theory is science, multiverse cosmology is science, evolutionary psychology's Pleistocene stories are science, and singular historical claims in geology and evolutionary biology are paradigm science even though no experiment can rerun a unique past event. My reason is that these sit inside research traditions with enough structure to be connected to tests, whereas ID and astrology insulate themselves.

  (h) And I think demarcation matters practically — school boards and courts should be able to keep ID out of science class — while also thinking "science" has no necessary and sufficient conditions and is more of a family-resemblance or cluster concept.

  So: go through these and tell me which pairs are really in tension and how badly, ranked by severity rather than all flagged equally, and which ones only look like tensions and dissolve once you're careful. For each real tension say what would have to give and what that would cost me. I genuinely don't know where the problem is, so also tell me which single revision cleans up the most, and separately whether any of my verdicts in (g) is something my own principle in (a) can't actually deliver.
