          *   *Refinement:* The "Common Cause" problem. If the predictor uses a proxy, it's a common cause scenario. CDT says 2-box. EDT says 1-box. User says 2-box. Why? Because the link is "drained of news-value."
          *   *Challenge:* Why is it drained? Because you know it? But in standard Newcomb, you know the predictor is reliable. The knowledge of *reliability* is what creates the EDT pressure. The knowledge of *mechanism* shouldn't change the evidential link unless it breaks the counterfactual dependence.

  4.  **Structuring the Response:**
