  **Subject: Re: Mo's Conditional Rules**

  You have a great eye for this. You've correctly spotted that Mo is distinguishing between two completely different types of "if" sentences, even though they look similar on the surface. In semantics, we call this the split between **Indicatives** (updating what we know) and **Counterfactuals** (imagining a change to history).

  Based on her verdicts in scenarios 1 through 4, here is the rule she is running, her likely verdict on your new scenario, and a test to prove it.

  ### 1. The Core Rule: "News" vs. "Intervention"

  Mo treats these two sentence types as different animals:

  *   **The "News" Sentences (Indicatives):** *"If Priya didn't unplug it, Sam did"* (Scenario 3) and *"If the vent opened, the temperature hit 30"* (Scenario 5).
      *   **Rule:** These update your information. You take the "if" part as a new fact and ask, "Given what I know about the world, what else must be true?"
      *   **Why she accepts them:** In Scenario 3, we know *someone* unplugged the freezer. If we learn it wasn't Priya, logic dictates it was Sam. In Scenario 5, if we see the vent is open, the most reasonable conclusion is that it got hot enough to trigger it.
  *   **The "History Change" Sentences (Counterfactuals):** *"If Priya hadn't unplugged it, Sam would have"* (Scenario 3) and *"If the vent hadn't opened, the temperature wouldn't have hit 30"* (Scenario 5).
      *   **Rule:** These simulate a surgical intervention. You magically force the "if" part to be true and ask, "What happens *next*?" Crucially, **you cannot rewrite the past to explain the change.**
      *   **Why she rejects them:** In Scenario 3, magically stopping Priya doesn't *cause* Sam to act. Sam's decision is independent. In Scenario 4, she accepted *"If the temperature hadn't crossed... the phone wouldn't have pinged"* because temperature causes the ping (Cause → Effect). She will likely reject the reverse (Effect → Cause) in a counterfactual.

  ### 2. Prediction for Scenario 5

  You guessed she might accept the first sentence but fork on the second. Here is the specific prediction:

  *   **Sentence 1:** *"If the vent opened, the temperature hit 30°C."*
      *   **Verdict:** **True.** (This is a "News" sentence. Open vent implies heat.)
  *   **Sentence 2:** *"If the vent hadn't opened, the temperature wouldn't have hit 30°C."*
      *   **Verdict:** **False.** (This is a "History Change" sentence.)

  **Why?** Mo's reasoning in Scenario 3 ("Priya's not doing it wouldn't have *made* Sam do it") proves she cares about **causal direction**. The temperature causes the vent to open; the vent opening does not cause the temperature to rise. Therefore, imagining a world where the vent stays closed doesn't erase the heat that already happened. It just means the mechanism failed (which she explicitly allowed for by saying it "could in principle" stick).

