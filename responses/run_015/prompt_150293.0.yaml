  There are two semantic theories that fit her track record on Scenarios 1–4, but they disagree on *why* she might reject Scenario 5, Sentence 2.

  **Candidate A: The Causal Arrow Rule (Best Guess)**
  *   **Logic:** Counterfactuals must follow the arrow of time and causation. You can change a cause to see the effect, but you cannot change an effect to infer the cause.
  *   **Prediction for 5.2:** **False.** The vent (effect) has no power over the temperature (cause).
  *   **Why this fits Mo:** It aligns perfectly with her rejection of the Priya/Sam scenario. She refuses to let one independent event "fix" another.

  **Candidate B: The "Best Explanation" Rule**
