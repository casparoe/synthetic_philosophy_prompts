      *   *6. Action-Guidance/Publicity:* "Ought implies Can" is standard. Publicity (can't rely on ignorance) is a Kantian/Rawlsian constraint. *Verdict:* Mostly constraint, but publicity is a specific normative commitment.
      *   *7. Non-Ubiquity:* If everything is a dilemma, the concept loses meaning. *Verdict:* Genuine constraint (conceptual utility).

  3.  **Identify Missing Requirements:**
      *   *Temporal Dynamics:* How does the framework handle the *process* of decision-making under time pressure? (Not just the outcome).
