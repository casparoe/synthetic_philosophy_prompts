answer: |-
  **SPECIFICATION DOCUMENT: NORMATIVE FRAMEWORKS FOR MORAL CONFLICT**
  **TO:** Clinical Ethics Working Group
  **FROM:** Philosophical Consultation Unit
  **SUBJECT:** Adequacy Conditions for Accounts of Moral Conflict

  The following specification delineates the necessary conditions for any normative framework intended to guide clinicians in contexts of scarcity and conflicting obligations. Each item is tagged as either a **Logical/Conceptual Constraint** (failure entails incoherence or uselessness) or a **Substantive Moral Thesis** (failure entails disagreement with a specific ethical tradition).

  ### I. Review of Proposed Requirements

  **1. Phenomena to be Explained (Residue)**
  *   **Specification:** The framework must account for the aptness of agent-regret, apology, and reparative impulses following unavoidable violations, without attributing irrationality to the agent.
  *   **Status:** **Substantive Moral Thesis.** This privileges non-consequentialist intuitions (e.g., Williams, Nagel). A utilitarian framework can dismiss these feelings as "shadow of the past" or counterproductive noise. Demanding the framework validate these feelings rules out act-utilitarianism *a priori*.
  *   **Cost of Violation:** If a theory dismisses these phenomena, it gains logical simplicity but loses phenomenological fidelity. It risks alienating clinicians whose lived experience contradicts the theory.

  **2. Distinctions That Must Not Be Collapsed**
  *   **Specification:** The framework must distinguish: (a) *pro tanto* vs. *all-things-considered* obligations; (b) conflicts of obligation vs. conflicts of value; (c) self-induced vs. external vs. brute conflicts; (d) tragedy vs. dilemma vs. incomparability.
  *   **Status:** **Logical/Conceptual Constraint.** Without these distinctions, the theory cannot diagnose *why* a conflict exists. However, insisting that *all* these categories map onto reality is a **Thesis**. Some theories (e.g., lexical prioritization) collapse tragedy into hard choices.
  *   **Cost of Violation:** Collapsing these leads to diagnostic blindness. If a theory cannot distinguish a dilemma from a hard choice, it cannot offer specific guidance for each.

  **3. The Fate of the Unfulfilled Obligation**
  *   **Specification:** The theory must specify the deontic status of the violated obligation post-facto (debt, compensation, lapse) and avoid generating a residual duty that is impossible to perform (no regress).
  *   **Status:** **Logical/Conceptual Constraint.** The "no regress" clause is a hard constraint; a theory that generates a new impossible obligation merely replicates the problem. The specific fate (debt vs. lapse) is a **Thesis**.
  *   **Cost of Violation:** If the regress is not stopped, the theory is action-paralyzing.

  **4. Formal Consistency (Deontic Logic)**
  *   **Specification:** The framework must address the trilemma of: (a) **Agglomeration** (If $O(A)$ and $O(B)$, then $O(A \land B)$); (b) **Ought Implies Can** (If $O(A)$, then $\Diamond A$); and (c) **Genuine Conflict** ($O(A)$ and $O(B)$ but $\neg \Diamond (A \land B)$). You cannot hold all three.
  *   **Status:** **Logical/Conceptual Constraint.** You must explicitly state which principle is modified.
  *   **Cost of Violation:**
      *   *Reject Agglomeration:* Costs standard deontic logic; makes reasoning about conjunctive duties difficult.
      *   *Reject Ought Implies Can:* Costs the link between normativity and agency; risks blaming agents for the impossible.
      *   *Deny Genuine Conflict:* Costs phenomenological fidelity (see Req 1); requires "explaining away" the conflict.

  **5. Distribution Across Agents (Institutional Agency)**
  *   **Specification:** The theory must locate obligations when systemic constraints prevent individual discharge. It must state whether institutions can bear obligations that individuals cannot.
  *   **Status:** **Substantive Moral Thesis.** This assumes collective moral agency. Methodological individualists deny institutions can hold obligations distinct from their members.
  *   **Cost of Violation:** If the theory denies institutional agency, it cannot solve systemic scarcity cases without blaming individuals for structural failures.

  **6. Action-Guidance and Publicity**
  *   **Specification:** Verdicts must be followable (no "do A and B" when impossible) and stable under publicity (the agent can know the verdict without it changing the verdict).
  *   **Status:** **Logical/Conceptual Constraint.** "Ought implies Can" is the core constraint here. Publicity is a **Thesis** (Kantian/Rawlsian); some esoteric consequentialisms deny publicity.
  *   **Cost of Violation:** A theory that fails action-guidance is not a guide. A theory that fails publicity requires a "noble lie" structure, which undermines trust in clinical protocols.

  **7. Non-Ubiquity**
  *   **Specification:** Genuine moral conflicts must be exceptional, not the default state of agency.
  *   **Status:** **Logical/Conceptual Constraint.** If every choice is a dilemma, the concept "dilemma" loses discriminatory power.
  *   **Cost of Violation:** Moral inflation. If everything is a tragedy, nothing is.

  ### II. Additional Requirements (Missing from Draft)

  **8. Epistemic Accessibility**
  *   **Specification:** The framework must yield verdicts based on information available to the clinician *at the time of decision*, not on hindsight.
  *   **Status:** **Logical/Conceptual Constraint.** Clinicians operate under uncertainty. A framework requiring omniscience to determine right action is unusable.
  *   **Cost of Violation:** Retroactive condemnation of reasonable decisions.

  **9. Pre-Conflict Obligations**
  *   **Specification:** The framework must account for obligations to *prevent* conflict situations (e.g., staffing levels, stockpiling) distinct from obligations *within* them.
  *   **Status:** **Substantive Moral Thesis.** This assumes a temporal extension of responsibility.
  *   **Cost of Violation:** Risks legitimizing "triage ethics" as a substitute for resource advocacy.

  ### III. Inconsistency Analysis: The Trilemma of Conflict

  There is a subset of requirements that cannot be jointly satisfied without modification. This is not a bug in the specification, but a feature of moral reality.

  **The Inconsistent Triad:**
  1.  **Standard Deontic Logic (Req 4):** Agglomeration holds; Ought implies Can.
  2.  **Phenomenological Fidelity (Req 1):** Genuine conflicts exist; residue is apt.
  3.  **Action-Guidance (Req 6):** The agent must be able to identify a single permissible course of action.

  **Analysis:**
  If you maintain Standard Logic (1), you must deny Genuine Conflicts (2) to preserve Action-Guidance (3). This satisfies the logic but fails the Phenomena (clinicians feel guilt, theory says they shouldn't).
  If you accept Genuine Conflicts (2) and Action-Guidance (3), you must break Standard Logic (1) (e.g., reject agglomeration).
  If you accept Genuine Conflicts (2) and Standard Logic (1), you must sacrifice Action-Guidance (3) (the agent is condemned no matter what).

  **Resolution:** One of these three must be relaxed. Most clinical ethics frameworks choose to relax **Standard Deontic Logic** (allowing for "remainder" obligations) or relax **Phenomenological Fidelity** (treating guilt as non-veridical). You cannot have all three.

  ### IV. The "Killer" Requirement

  **Requirement 4 (Formal Consistency)** does the most work in eliminating candidate theories.

  It is the primary filter because it forces the theoretical commitment that determines all downstream guidance. Before a theory can tell a clinician *what to do*, it must decide whether the situation is logically coherent.
  *   If a theory preserves Agglomeration and Ought-Implies-Can, it *must* dissolve the conflict (claiming one obligation was never real).
  *   If a theory preserves the reality of the conflict, it *must* modify the logic.
  This requirement eliminates any framework that attempts to be vague about its logical commitments. It forces the choice between **Dissolution** (Utilitarian/Standard Deontic) and **Realism** (Pluralist/Non-Agglomerating).

  ### V. Assessment of Broad Strategies

  **Strategy A: Dissolving Conflict (Outweighed *Pro Tanto* Duties)**
  This strategy preserves Standard Deontic Logic and Action-Guidance by denying Genuine Conflicts. It posits that when obligations clash, one is outweighed and ceases to be an obligation *simpliciter*.
  *   **Performance:** Fails **Requirement 1 (Phenomena)**. It must tell the clinician that their guilt is irrational because they did the "right" thing. It handles **Requirement 4 (Logic)** perfectly. It struggles with **Requirement 5 (Distribution)** if the "outweighing" factor is systemic scarcity, as it often individualizes the failure.
  *   **Verdict:** Logically robust, psychologically alienating.

  **Strategy B: Accepting Genuine Conflicts (Moral Remainders)**
  This strategy preserves Phenomena and Action-Guidance by modifying Standard Deontic Logic (typically rejecting Agglomeration). It posits that both obligations remain binding even if one must be violated, generating a "moral remainder."
  *   **Performance:** Satisfies **Requirement 1 (Phenomena)** and **Requirement 3 (Fate of Obligation)** (via compensation/residue). It pays a high cost on **Requirement 4 (Logic)**, requiring a non-standard deontic system. It risks violating **Requirement 7 (Non-Ubiquity)** if the threshold for "genuine conflict" is set too low.
  *   **Verdict:** Psychologically resonant, logically expensive.

  **Recommendation:** Given the clinical context, **Strategy B** is preferable provided the logical modifications are explicitly codified in the guidance. Clinicians cannot function if their moral distress is invalidated (Req 1), but they require clear protocols to avoid paralysis (Req 6). The framework must explicitly state that "violating an obligation to fulfill a stronger one does not erase the violation," thereby licensing the guilt without condemning the action.
