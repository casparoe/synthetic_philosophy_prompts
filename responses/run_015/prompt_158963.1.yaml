      *   *Addressing the Oracle:* The Oracle's report is itself linguistic data. It must be interpreted charitably too. If the Oracle says "They believe p" and we have overwhelming evidence from radical interpretation that "They believe not-p" (because that's the only way to make sense of their interactions with the world), then we must reinterpret the Oracle. The Oracle isn't a God's-eye view; it's another speaker.
      *   *Massive Error:* Davidson allows for local error, even systematic error in specific domains, but *massive* error (mostly wrong about everything) undermines the possibility of having beliefs at all. To have a belief is to have a concept, and concepts are tied to causal interactions with the world. If you're mostly wrong, you're not latching onto the world.
