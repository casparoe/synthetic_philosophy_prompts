answer: |-
  This is a Model Risk Management (MRM) protocol. It is designed to fit within a one-day analyst review. It does not solve the philosophy of fairness; it isolates the philosophical questions so a human executive must answer them, while automating the technical validity checks.

  ### Protocol MRM-F-01: Fairness & Deployment Review

  **Objective:** Determine if a model's disparate impact is measurable, relevant to the deployment, and acceptable within business risk appetite.
  **Inputs:** Model validation report, confusion matrices by imputed group, deployment specification.
  **Outputs:** Verdict (Ship / Ship w/ Conditions / Don't Ship).

  ---

  #### Phase 1: Deployment Taxonomy
  *Goal: Determine which metrics are mathematically relevant. Do not calculate all metrics.*

  **Q1.1: How is the score consumed?**
  *   **A) Threshold:** Applicant is Approved/Declined based on a cutoff.
  *   **B) Fixed-Budget Rank:** Top *N* applicants receive an offer/service; cutoff moves dynamically.
  *   **C) Advisory:** Score is shown to a human who makes the final decision.
  *   **Action:** Circle one. Proceed to corresponding Phase 2 track.

  #### Phase 2: Data Validity (The "Can We Measure It?" Check)
  *Goal: Determine if fairness metrics are statistically defensible given data noise.*

  **Q2.1: Protected Class Attribution.**
  *   **Input:** Method used (e.g., BSRM/Surname).
  *   **Check:** Is the attribution accuracy > 70% for *all* groups involved?
  *   **Check:** Has a sensitivity analysis been run adjusting for differential error rates between groups?
  *   **Stop Condition:** If disparity disappears when adjusting for attribution error, verdict is **Inconclusive**. Hand off to CRO. (Do not Ship).

  **Q2.2: Label Validity (Reject Inference).**
  *   **Input:** Percentage of outcome labels imputed for declined applicants.
  *   **Threshold:** If > 20% of the training/evaluation sample relies on imputed outcomes (reject inference).
  *   **Stop Condition:** **Hard No.** Fairness metrics based on imputed outcomes are unfalsifiable. You cannot prove fairness on data you invented.
  *   **Verdict:** **Don't Ship** (unless label source is changed).

  #### Phase 3: Metric Relevance (The "Does It Matter?" Check)
  *Goal: Select the single primary fairness metric based on Phase 1. Ignore others for the verdict.*

  **Track A (Threshold):**
  *   **Q3.A1:** Who bears the cost of error?
      *   If Lender bears cost (Default risk): Primary Metric = **False Positive Rate (FPR) Parity**.
      *   If Applicant bears cost (Denied credit): Primary Metric = **False Negative Rate (FNR) Parity**.
  *   **Q3.A2:** Is the disparity in the Primary Metric > 10% (or regulatory threshold)?
      *   If Yes: Proceed to Phase 4.
      *   If No: **Ship**.

  **Track B (Fixed-Budget Rank):**
  *   **Q3.B1:** Calculate **Selection Rate Parity** (Group A selected / Group B selected).
  *   **Q3.B2 (The Leveling Down Check):** Does achieving parity require *lowering* the score cutoff for the advantaged group (reducing total utility/true positives)?
      *   If Yes: **Flag for CRO.** (See Phase 4).
      *   If No: **Ship**.

  **Track C (Advisory):**
  *   **Q3.C1:** Do not measure model fairness. Measure **Decision Process Fairness**.
  *   **Check:** Analyze override rates by branch/officer.
  *   **Stop Condition:** If override rates vary significantly by branch (p < 0.05) or correlate with imputed group demographics.
  *   **Verdict:** **Ship with Conditions** (Condition: Audit human overrides, not model).

  #### Phase 4: The Trade-Off (The "Value Call" Handoff)
  *Goal: Force a human to sign for the moral cost.*

  **Q4.1:** If Phase 3 flagged a disparity:
  *   **Question:** Can the disparity be removed without increasing risk (for Threshold) or reducing total help provided (for Rank)?
  *   **If No:** This is a value judgment.
  *   **Action:** Prepare "Fairness Memo" for CRO/Counsel.
  *   **Memo Requirement:** Must explicitly state: "To equalize [Metric], we must [Accept Higher Loss / Deny More Qualified Applicants / Help Fewer People Total]."
  *   **Verdict:** **Ship with Conditions** (Condition: CRO sign-off on Memo).

  ---

  ### Application to Your Three Cases

  Here is how the procedure runs on your specific wrinkles.

  #### 1. BizScore (Threshold Screen)
  *   **Phase 1:** Threshold.
  *   **Phase 2:**
      *   Q2.1 (Attributes): BSRM is ~75% accurate. Passes >70% threshold. *Note: Requires sensitivity analysis.*
      *   Q2.2 (Labels): **40% imputed outcomes.**
      *   **Result:** **Hard Stop.**
      *   **Verdict:** **Don't Ship.**
  *   **Why you won't like this:** You probably want to ship this because the business needs it. But the procedure flags that 40% reject inference makes any fairness number (FPR/FNR) mathematically unfalsifiable. If regulators ask "How do you know the FNR is equal?", your answer is "We guessed the outcomes for 40% of the people." That is an exam finding waiting to happen.
  *   **Fix:** You must retrain with a lower imputation rate or accept that fairness cannot be measured yet.

  #### 2. HardshipRank (Fixed Budget)
  *   **Phase 1:** Fixed-Budget Rank.
  *   **Phase 2:** Labels are existing customers (no reject inference). Attributes are BSRM. Passes validity.
  *   **Phase 3:**
      *   Metric: Selection Rate Parity.
      *   **Q3.B2 (Leveling Down):** You noted the risk of "withholding help from highest-scoring people."
      *   **Scenario:** If Group A has higher risk scores on average, selecting the top 500 yields fewer Group A members. To equalize selection rates, you must skip high-score Group B to get to lower-score Group A.
      *   **Result:** **Flag for CRO.**
      *   **Verdict:** **Ship with Conditions.**
  *   **The Condition:** The CRO must sign a memo stating: "We prioritize Total Utility (helping the 500 most likely to miss payment) over Selection Rate Parity." This prevents the analyst from silently optimizing the spreadsheet by hurting the total population.

  #### 3. AssistScore (Advisory)
  *   **Phase 1:** Advisory.
  *   **Phase 2:** N/A (Model is not the decision).
  *   **Phase 3:**
      *   **Q3.C1:** Analyze overrides.
      *   **Finding:** Overrides cluster by branch (30% rate, high variance).
      *   **Result:** **Flag.**
      *   **Verdict:** **Ship with Conditions.**
  *   **The Condition:** "Model may be deployed, but Model Risk owns the *Override Policy*. Branches exceeding variance thresholds trigger audit."
  *   **Why this works:** It stops you from auditing the model for bias when the bias is actually being introduced by the loan officers in Branch X vs. Branch Y.

  ---

  ### Limitations & Handoffs (What This Procedure Cannot Do)

  You asked for plain talk on where the checklist fails. Here is the disclosure you attach to the verdict.

  **1. It cannot resolve the "Impossibility Theorem."**
  *   **The Limit:** In BizScore, if you fix FPR, FNR will break (given base rate differences).
  *   **The Handoff:** Phase 4 forces the CRO to pick *which* error rate matters. The procedure does not decide; it forces the decision into the minutes.
  *   **Question for Human:** "Is it worse to deny a good borrower (FNR) or fund a bad borrower (FPR)?"

  **2. It cannot validate BSRM bias direction.**
  *   **The Limit:** If BSRM undercounts Group A by 10% and Group B by 5%, parity metrics are biased. We assume the >70% accuracy check covers this, but differential bias remains a blind spot.
  *   **The Handoff:** Counsel must confirm that using BSRM satisfies regulatory "Good Faith" efforts for HMDA/ECOA, even if imperfect.
  *   **Question for Human:** "Is this proxy legally sufficient for our defense?"

  **3. It cannot judge "Business Necessity."**
  *   **The Limit:** The procedure can say "There is a 10% disparity." It cannot say "This disparity is justified because the variable driving it is essential to creditworthiness."
  *   **The Handoff:** This is a Legal/Compliance call, not Model Risk.
  *   **Question for Human:** "Does the business necessity defense hold for this variable in this jurisdiction?"

  ### Summary of the "Unwanted Answer"
  The **BizScore** case triggers a **Don't Ship** verdict solely due to the 40% imputed label rate (Phase 2, Q2.2).
  *   **Why:** You cannot defend fairness metrics derived from imputed reject data in an exam. It is unfalsifiable.
  *   **Cost:** This delays the model.
  *   **Benefit:** It prevents you from writing a validation report that claims "Fairness Verified" on data that is partially synthetic.

  ### Analyst Instructions
  1.  Run Phase 1-3.
  2.  If any "Stop Condition" is met, draft the Verdict immediately.
  3.  If Phase 4 is triggered, draft the Memo for the CRO. Do not make the trade-off yourself.
  4.  If the procedure says "Ship," file the checklist. If it says "Don't Ship," file the checklist and the Data Validity failure report.
