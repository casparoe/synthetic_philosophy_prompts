prompt: |-
  Last night I got into a long arguement with a friend about my job and I want it settled properly instead of by whoever talks louder. I'm on the model risk team at a mid-size lender. We review the scoring models that get used for underwriting and for a couple of other things — maybe a dozen to fifteen a year — and I get roughly one analyst-day per model. Whatever I write goes to our counsel and then to the chief risk officer, and it has to end in one of three verdicts: ship, ship with conditions, or don't ship. We can't ask for more data and we usualy couldn't get it anyway. My background is stats, not philosophy, and the people who sign off are a lawyer and a risk guy, so anything I hand them has to survive being read by someone who doesn't know the theory and doesn't want to.

  The argument was this. My friend says: pick one fairness metric, write it into policy, check it, done. I said picking the metric is itself the moral call, and worse, the metrics fight each other — there's that well known result that when the outcome rates differ between two groups you can't have all of calibration-within-group, equal false-positive rates and equal false-negative rates at the same time except in degenerate cases. He said fine, then just pick the one that sounds nicest. We went nowhere, and the honest problem is that I don't have anything I could hand to a new analyst and expect them to reach the same verdict I would.

  So: give me a procedure, not an essay. Questions in a fixed order, what counts as a sufficient answer to each, where the procedure stops with a hard no, and where it hands the decision to a person because the question is one of values rather than facts. I care a lot about which distinctions have to survive the simplification and which can be dropped, because a checklist that tries to keep everything is a checklist nobody runs.

  Three wrinkles that keep coming up and that a generic fairness checklist never handles:

  One, deployment shape. The same kind of model is used as a threshold screen (approve/decline), as a ranking with a fixed budget (we have N slots and hand them to the top N), and as one input a human sees before deciding. I don't think error-rate parity means the same thing in those three, and I think in the fixed-budget case it might not be the right question at all. The procedure needs to branch on this.

  Two, we don't collect race or sex of owners. Group membership is imputed from surname and census tract by a consultant's model, and we know it's noisy — call it right maybe three quarters of the time, and worse for one group than the other. Every parity number I have is therefore measured on estimated groups. I don't know whether that kills the whole exercise or just widens the error bars, and I don't know which direction it biases things.

  Three, the label is a business choice. Default within 18 months, 90+ days past due, first missed payment — these give different models and different fairness numbers, and for applicants we declined we have no repayment outcome at all, so the vendor imputed those. My worry is that some of our numbers are unfalsifiable rather than merely noisy.

  Run the procedure on these three, with numbers:

  BizScore — a term-loan approval screen for small businesses, threshold decision. Label is 90+ days past due within 18 months, with imputed outcomes for the roughly 40 percent of the sample we'd declined. Equal false-negative rates across the two groups hold within a point. Equal false-positive rates don't: among businesses that would have repaid, one group is declined at about twice the rate of the other. Predicted-value parity fails too, and calibration looks fine for one group and not the other. Counsel wants a single number for the exam file.

  HardshipRank — 500 counseling slots, 4,000 eligible customers, score ranks by predicted chance of missing a payment, top 500 get the slot. No threshold anywhere. Fixed pie. I want to know what the procedure even asks here, and I want it to say something about the option of equalizing some parity quantity by withholding help from the highest-scoring people — helping nobody so the spreadsheet looks better — because I think that is what pick a metric and check it quietly licenses.

  AssistScore — shown to a loan officer as one input among several. Officers override around 30 percent of the time, and the overrides cluster by branch. My guess is the right verdict is that we're auditing the wrong object, but I want the procedure to force that verdict rather than me asserting it after the fact.

  Include at least one case where the procedure gives me an answer I don't want — I'd rather see that now than in an exam. And tell me plainly what the procedure can't do: which questions it looks like it answers and doesn't, and where a value call has to be made and signed by a human.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Model Risk Manager at a mid-size lender.
      *   **Task:** Review scoring models (underwriting, etc.), ~12-15/year, ~1 analyst-day/model.
      *   **Audience:** Counsel (lawyer) and Chief Risk Officer (risk guy). They need clear, defensible verdicts (Ship, Ship w/ Conditions, Don't Ship). They don't know stats theory.
      *   **Constraint:** Cannot ask for more data. Data is noisy (imputed protected class attributes via BSRM - Bayesian Improved Surname Geocoding). Labels are business-defined (default definitions vary, reject inference used).
      *   **The Conflict:** Friend says "Pick one metric, check it, done." User says "Metric choice is the moral call, metrics conflict (Impossibility Theorems), context matters."
      *   **The Need:** A concrete *procedure* (checklist/flowchart style), not an essay. Fixed order questions, sufficient answers, hard stops, hand-offs to humans for value judgments.
      *   **Specific Wrinkles to Address:**
          1.  *Deployment Shape:* Threshold vs. Ranking (fixed budget) vs. Human-in-the-loop.
          2.  *Imputed Attributes:* Noisy group membership (BSRM), bias direction unknown.
          3.  *Label Definition:* Business choice, reject inference (unfalsifiable).
      *   **Test Cases:**
          1.  *BizScore:* Threshold screen, imputed outcomes (40%), FNR parity ok, FPR parity fails (2x), PPV/Calibration mixed.
          2.  *HardshipRank:* Fixed budget (500/4000), ranking, risk of "leveling down" (withholding help to equalize).
          3.  *AssistScore:* Human-in-the-loop (30% override), overrides cluster by branch.
      *   **Requirement:** Include a case where the procedure gives an unwanted answer. State limitations clearly.

  2.  **Deconstruct the Problem:**
      *   The core tension is between *technical feasibility* (can we calculate it?) and *normative validity* (does this metric mean what we think it means in this context?).
      *   The "Friend's" approach (pick one metric) fails because of the Impossibility Theorem (Chouldechova, Kleinberg et al.) and context dependence.
      *   The "User's" approach (it's all moral) fails because it doesn't produce a decision for the CRO.
      *   *Solution:* A triage procedure that separates *Technical Validity* (is the number real?) from *Contextual Validity* (does the metric match the use case?) from *Policy Decision* (which trade-off do we accept?).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Deployment Classification.* Crucial because fairness metrics depend on how the model is used. (Threshold vs. Rank vs. Advisory).
      *   *Step 2: Data Integrity Check.* Address the imputed attributes and label noise. If the input is too noisy, stop.
      *   *Step 3: Metric Selection based on Deployment.* Don't check everything. Check what matters for *this* use case.
      *   *Step 4: The "Leveling Down" Check.* Specifically for the HardshipRank case.
      *   *Step 5: Human-in-the-Loop Check.* Specifically for AssistScore.
      *   *Step 6: The Verdict.* Ship, Condition, No-Ship.

      *Refining Step 2 (Data):* The user mentioned BSRM (surname + census). It's ~75% accurate. If the bias is differential (worse for one group), parity metrics are biased. The procedure needs a threshold for "too noisy to measure."
      *Refining Step 3 (Metrics):*
          *   Threshold: Focus on error rates (FPR/FNR) or PPV depending on who bears the cost.
          *   Ranking: Focus on selection rate or utility.
          *   Advisory: Focus on override analysis.
      *Refining Step 4 (The Unwanted Answer):* I need to make sure one of the test cases triggers a "Don't Ship" or "Major Condition" that the user might find painful but necessary. BizScore looks risky (2x FPR, imputed labels). HardshipRank has the "leveling down" trap. AssistScore is auditing the wrong thing.

  4.  **Developing the Test Cases against the Procedure:**

      *   *BizScore:*
          *   Deployment: Threshold.
          *   Data: 40% imputed outcomes (Reject Inference). This is a huge red flag for label validity.
          *   Metrics: FPR disparity (2x).
          *   Result: Likely "Don't Ship" or "Ship with Conditions (Monitor heavily)" because the label is partially unfalsifiable. I should make the procedure strict here to satisfy the "unwanted answer" requirement.
      *   *HardshipRank:*
          *   Deployment: Fixed Budget Ranking.
          *   Risk: Leveling down.
          *   Metric: Selection rate parity? Or Utility maximization?
          *   Result: Procedure should flag that equalizing metrics by reducing total help is forbidden.
      *   *AssistScore:*
          *   Deployment: Advisory.
          *   Issue: Overrides cluster by branch.
          *   Result: Audit the *process*, not just the model. Verdict: "Ship with Condition (Audit Overrides)."

  5.  **Addressing the "Friend's" Objection:**
      *   The procedure must explicitly state *why* we aren't just picking one metric. It's not about picking the "nicest" one; it's about picking the *relevant* one based on deployment.

  6.  **Addressing the "Imputed Data" Wrinkle:**
      *   BSRM noise widens confidence intervals. If the disparity is within the noise margin, you can't claim parity or disparity. The procedure needs a "Signal-to-Noise" check.

  7.  **Finalizing the Structure:**
      *   **Preamble:** Scope and Limits (What this is/isn't).
      *   **The Procedure (Q1-Q6):** Linear flow.
      *   **Application to Cases:** Walk through BizScore, HardshipRank, AssistScore.
      *   **The "Unwanted Answer":** Highlight where the procedure bites.
      *   **Limitations:** Where human judgment is required.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is 1 analyst-day enough for this?
      *   *Fix:* Keep the calculations standard. The value add is the *interpretation logic*, not new math.
      *   *Critique:* How to handle the "imputed label" issue in BizScore?
      *   *Fix:* If >X% of labels are imputed via reject inference, validity is compromised. Set a hard limit (e.g., 20%). BizScore has 40%, so it should fail. This provides the "unwanted answer."
      *   *Critique:* How to handle BSRM noise?
      *   *Fix:* Require sensitivity analysis. If the disparity disappears when adjusting for BSRM error rates, it's inconclusive.
      *   *Critique:* HardshipRank "Leveling Down."
      *   *Fix:* Add a specific check: "Does improving parity reduce total utility?" If yes, flag for CRO.

  9.  **Final Polish:** Ensure tone is professional, direct, and suitable for a Model Risk Management (MRM) policy document. Avoid philosophical musing; stick to operational directives. (The user asked for a procedure, not an essay).

      *Wait, one constraint check:* "Give me a procedure... Questions in a fixed order... where the procedure stops with a hard no."
      *Okay, I will structure it as a numbered protocol.*

      *Wait, another constraint:* "Include at least one case where the procedure gives me an answer I don't want."
      *I will ensure BizScore triggers a 'Don't Ship' due to the 40% imputed label rate, as that is statistically unsound for regulatory defense regardless of fairness metrics.*

      *Wait, another constraint:* "Tell me plainly what the procedure can't do."
      *I will add a 'Limitations & Handoffs' section.*

  10. **Drafting the Content:** (Mental Outline)
      *   **Protocol Name:** MRM-Fairness-01.
      *   **Phase 1: Deployment Taxonomy.** (Threshold vs Rank vs Advisory).
      *   **Phase 2: Data Validity.** (Imputed attributes, Imputed labels).
      *   **Phase 3: Metric Relevance.** (Match metric to Phase 1).
      *   **Phase 4: The Trade-off.** (Utility vs Parity).
      *   **Phase 5: Human Factors.** (Overrides).
      *   **Run the cases.**
      *   **Limitations.**

      *(Self-Correction on BizScore)*: If I say "Don't Ship" on BizScore because of 40% imputed labels, that's a *model validity* issue, not strictly a *fairness* issue, but it impacts fairness measurement. The prompt asks about fairness specifically. However, if you can't measure fairness because the label is fake, you can't ship a fair model. I will frame this as "Fairness Measurement Validity." If you can't measure it, you can't clear it.

      *(Refining HardshipRank)*: The specific worry is "withholding help... so the spreadsheet looks better." The procedure must explicitly forbid optimizing for metric parity if it reduces total true positives (people helped).

      *(Refining AssistScore)*: The model isn't the decision maker. The procedure must shift the audit target to the *decision process*.

