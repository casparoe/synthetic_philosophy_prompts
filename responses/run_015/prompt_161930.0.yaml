      *   Must distinguish between the modes without naming them.
      *   *Crucial:* Must test the "Hospitable" hypothesis.

      *   *Drafting Scenarios:*
          1.  **Museum Repatriation:** Keep for education (Monumental/Truth) vs. Return for justice (Critical) vs. Return because they belong there (Antiquarian/Hospitable?).
          2.  **Cathedral Spire:** Exact rebuild (Antiquarian) vs. Modern design (Monumental/Critical) vs. Leave ruin (Truth/Critical).
          3.  **Constitutional Judge:** Original intent (Antiquarian) vs. Living document (Monumental) vs. Strike down (Critical).
