      *   *Twist:* The "insight" wasn't imaginative empathy; it was documentary realism based on the artist's own hidden crimes.
      *   *Timing:* The work is already a masterpiece (canonized) when the truth comes out.
      *   *Specifics:* Let's create a novelist or filmmaker. Let's go with a novelist for depth of internal logic.
      *   *The Work:* A trilogy exploring the psychology of predation. It's praised for its "unflinching honesty" and "unsettling authenticity."
      *   *The Revelation:* Decades later, journals surface showing the author didn't just research this; they lived it. They were grooming victims, manipulating friends, etc., exactly as depicted.
      *   *The Aesthetic Link:* The power of the text relies on the reader believing the author *understands* the darkness. If the author *is* the darkness, does the text become a confession or a trophy?

  4.  **Drafting the Scenario (The "Chronicle of Shadows"):**
