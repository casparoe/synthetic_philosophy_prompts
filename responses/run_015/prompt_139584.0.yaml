  Hi — please act as a professional philosopher who works in metaethics, and take this slowly: before answering, sketch out the distinct claims the passage is making, then walk through them one at a time, and only at the end tell me what follows.

  I'm a retired evolutionary biologist who's got into philosophy in the last few years. There's a popular-science book I read recently — a real science writer, not a hack, I just won't name it — that summarises the evolutionary debunking argument something like this, as best I can reconstruct it:

  "Evolution made us moral, and that is the problem. Natural selection didn't care whether our moral beliefs were true, only whether they kept us cooperating with kin and trading favours inside the band, so it handed us strong convictions about loyalty, fair exchange and punishing cheats while remaining completely indifferent to the actual moral facts. Had the moral truth been the opposite, the same pressures would have handed us the opposite convictions and we would feel just as certain of them. So the best explanation of why we believe what we believe never mentions what is really right: our beliefs were fixed by something independent of the facts, and there are therefore no moral facts for them to track — moral judgments are sentiments selection installed in us. This isn't armchair speculation either: people really do scale their willingness to help and to take risks for others by genetic relatedness, roughly as inclusive-fitness theory predicts, so the evolutionary story is empirically confirmed. And the argument can't be fenced in. Our logical and mathematical beliefs were selected for usefulness too, so if evolution discredits morality it discredits arithmetic, and the debunker is stuck saying that two plus two might equal five, which is absurd — and that's the end of that."

  A couple of pages earlier the book also says the argument doesn't need to claim our moral beliefs are false, only that evolution explains them completely and leaves the moral facts no explanatory work to do — and that sounds to me like it's in tension with the flat "there are no moral facts" line, though maybe that's just my confusion.

  Is this a fair summary? Go through it and separate what a defender of one of these arguments would accept, what they'd call a simplification for a lay audience, and what they'd say the book actually got wrong. I've seen the arguments attached to names like Street, Joyce and Mackie, but I don't want references or a reading list, just the structure. Then: does the arithmetic move, presented as a refutation, land? And does the nihilist conclusion still follow from whatever parts of the summary survive correction?

  My own hunches, which I'd also like checked: the relatedness data seems like the strongest bit to me, but after thirty years of watching colleagues tell adaptationist just-so stories I'm wary of any "best explanation" claim, and I know alot turns on whether a selection story about behaviour says anything about the content of a judgement. And the arithmetic bit strikes me as weak, since surely the debunker just says the warrant for arithmetic comes from proof and not from where the belief came from.
