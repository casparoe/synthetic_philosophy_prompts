answer: |-
  Here is the untangling you asked for. I'm going to start by pointing out where your setup is slightly confused, because that clarifies why the three readings feel unstable. Then I will commit to the **Epistemic Reading** (with a specific modification regarding hiddenness) and defend it against the Hobbesian collapse. Finally, I'll answer the reference and self-undermining questions directly.

  ### 1. Where Your Setup Is Confused

  You are treating the three readings as mutually exclusive accounts of the *same* level of discourse. They aren't. Pascal is writing esoterically. He has one account for the **people** (who must obey), one for the **magistrates** (who must enforce), and one for the **honest man** (who must understand the tragedy).

  *   **Confusion 1: The Audience Tier.** You ask whether hiddenness is Doxastic or Discursive. The answer is: it is Doxastic for the masses and Discursive for the elite. The people *must believe* the justice story (Doxastic), or they revolt. The elite *must speak* the justice story (Discursive), or they undermine the order, even if they privately know it is force. Your setup treats "society" as a monolith; Pascal treats it as a hierarchy of knowledge.
  *   **Confusion 2: The Hobbes Comparison.** You worry the Derivation reading makes Pascal "Hobbes with better prose." This assumes Hobbes doesn't have a hiddenness requirement. He does. Hobbes requires subjects to avow the Sovereign's actions as their own. The difference isn't the *presence* of hiddenness, but the *ontological status* of the justice being masked. For Hobbes, the Sovereign *constitutes* justice. For Pascal, the Sovereign *usurps* the title of justice. That is a metaphysical difference, not just a stylistic one.
  *   **Confusion 3: Reference.** You ask what "just" refers to for an ordinary person as if there must be a single clean answer (Nothing, Real Property, or Real Property + False Story). Given Pascal's skepticism about human reason, he would likely say reference is **fractured**. The word *aims* at Natural Justice (intension) but *lands* on Custom/Force (extension). The ordinary person doesn't have the cognitive tools to distinguish the two, so for them, the referent *is* Custom, but they experience it *as* Natural Justice.

  ### 2. Distinguishing the Three Readings

  Here is what actually turns on the difference, stripped of the overlap:

  *   **The Labeling Reading (Semantic/Cynical):** "Just" is an empty signifier filled by power. There is no standard outside the label.
      *   *Stakes:* If this is true, Pascal is a nihilist. Resistance is only imprudent, never unjust.
  *   **The Epistemic Reading (Skeptical/Tragic):** "Just" refers to a real standard (Natural/Divine Law), but human reason is too corrupted to identify it. Force is a necessary proxy.
      *   *Stakes:* If this is true, obedience is a tragic compromise. The current order is *false* justice, but we lack the capacity to install *true* justice.
  *   **The Derivation Reading (Pragmatic/Functionalist):** "Just" refers to the condition of Order. We obey the strong not because they are right, but because disputing them causes war.
      *   *Stakes:* If this is true, the duty is to Peace, not to the Ruler. If the Ruler causes war, the duty lapses.

  ### 3. My Commitment: The Epistemic Reading (with Discursive Hiddenness)

  I am committing to the **Epistemic Reading**.

  **Why?** Because it is the only one that preserves Pascal's core theological premise: that Natural Law exists but is inaccessible to fallen reason.
  *   The **Labeling Reading** fails because Pascal explicitly affirms a "true justice" that stands in judgment over custom, even if we can't access it. He isn't a nihilist; he's a skeptic.
  *   The **Derivation Reading** fails because it makes obedience a rational calculation of utility (peace). For Pascal, obedience is a duty imposed by the structure of a fallen world, often *against* our rational calculation (since the strong are often vicious).

  **The Defense:**
  On the Epistemic Reading, force is not the *source* of justice (as in Hobbes), nor is it the *definition* of justice (as in Labeling). Force is a **placeholder**. We know (or should know) that true justice exists, but we cannot see it. Therefore, we must submit to the visible proxy (Force/Custom) to avoid the greater evil of endless dispute about the invisible truth.

  This is where your **Hiddenness Requirement** does the heavy lifting. It is not merely psychological (Doxastic); it is structural (Discursive).
  *   **Why Discursive?** Because if the elite admit publicly that law is just force, they strip the law of its *normative claim*. Law requires a claim to right, not just might, to function as law. If the magistrate says, "I enforce this only because I have guns," he invites resistance based on who has bigger guns. If he says, "I enforce this because it is Just," he invokes a duty that transcends the balance of power.
  *   **Why not purely Doxastic?** Because Pascal writes *for the elite*. He expects his reader (the honest man) to *know* the truth. If the system required universal Doxastic hiddenness, Pascal's own text would be treasonous. The system survives because the elite know the secret but keep it (Discursive), while the masses believe the fiction (Doxastic).

  ### 4. Pascal vs. Hobbes on Hiddenness

  You asked if you are inventing a difference here. You are not, but the distinction is subtler than "Hobbes doesn't need hiddenness."

  *   **Hobbes:** The Sovereign's will *makes* the action just. There is no "real justice" behind the curtain that is being hidden. The "hiddenness" is just about maintaining the authorization chain. The Sovereign doesn't need to pretend to be following a higher law; he *is* the higher law.
  *   **Pascal:** The Sovereign is *pretending* to follow a higher law (Natural Justice) that he is not actually following (since he follows Force/Custom).

  **The Crucial Difference:** Hobbes is a **Constitutive** theorist (Power creates Right). Pascal is a **Usurpation** theorist (Power steals the title of Right).
  This means Hobbes doesn't need the "Discursive" mask in the same way. Hobbes's Sovereign can admit, "I make the law," and it remains valid. Pascal's Sovereign cannot admit, "I make the law," because that admits he is a tyrant, not a judge. Pascal's system *requires* the lie that the law is found, not made. This is why the Discursive requirement is heavier for Pascal.

  ### 5. The Reference Question

  > *In the mouth of an ordinary person in a Pascalian society, what does just refer to?*

  It refers to **Custom backed by Force**, but it *presents* as **Natural Justice**.

  This is the fractured reference I mentioned.
  *   **Extension (What it picks out):** The current holdings and laws established by history and power.
  *   **Intension (What the speaker thinks they mean):** The eternal, moral order.

  The ordinary person is not lying. They are epistemically blinded by custom (Pascal's "second nature"). They point to a property title and say, "This is just." They *think* they are referencing Natural Law. In reality, they are referencing a historical accident of force that has hardened into custom. Pascal's point is that the *mechanism* of reference is broken. The word "just" functions socially as if it refers to Natural Law, but ontologically it refers to Force.

  So, to answer your specific options: It is **the real property plus a false story about why it binds**. The "false story" is that the bindingness comes from moral rightness rather than historical settlement.

  ### 6. The Self-Undermining Objection

  > *Once you've read it you know, and knowing looks like it should dissolve either the belief... or at least the ability to say it with a straight face.*

  This is the strongest objection, and Pascal has a reply. It pushes him firmly toward the **Discursive Reading** for the elite.

  Pascal does not expect the knowledge to dissolve compliance. He expects it to dissolve *pride*.
  *   **For the Masses:** They don't read Pascal. Their belief remains intact (Doxastic). The system holds.
  *   **For the Elite (The Reader):** Knowing the truth doesn't justify revolt. Why? Because the alternative is not "True Justice," it is "War." The elite know that their reason is too corrupted to reconstruct Natural Law from scratch. If they strip the mask off Force, they don't reveal Justice; they reveal the Void.

  So, knowing the truth does not undermine the *duty* to obey, only the *illusion* that the obedience is morally pure. The elite obey with a "clear conscience" not because they think the law is perfect, but because they know that contesting it is worse.

  **Does this undermine the ability to say it with a straight face?**
  Yes, it makes it ironic. But Pascal is fine with irony. He wants the elite to speak the language of justice publicly (Discursive) while mourning its absence privately. This is not self-undermining; it is **tragic maintenance**. The system doesn't require the elite to believe the lie; it requires them to *enforce* the lie for the sake of the masses.

  ### Summary of the Position

  1.  **Reading:** Epistemic. Real justice exists but is inaccessible; force is a tragic proxy.
  2.  **Hiddenness:** Tiered. Doxastic for the people (they must believe), Discursive for the elite (they must speak it, even if they know).
  3.  **Hobbes:** Pascal differs because for Hobbes power *constitutes* right, while for Pascal power *usurps* the title of right. This makes the Discursive mask essential for Pascal, optional for Hobbes.
  4.  **Reference:** "Just" refers to Custom/Force (extension) but claims to refer to Natural Law (intension). The mechanism is broken.
  5.  **Self-Undermining:** Knowledge doesn't license revolt because the alternative is disorder, not true justice. The elite maintain the fiction knowingly to preserve peace.

  You were right to feel the Derivation reading was too Hobbesian—it loses the "usurpation" element. You were right to suspect the Discursive hiddenness was key—it saves the elite from hypocrisy while preserving social order. But you were slightly confused in thinking these had to apply uniformly to everyone. Pascal's solution is a conspiracy of silence where the wise protect the ignorance of the simple, not out of malice, but out of necessity.
