answer: |-
  The central tension revealed by this impossibility result lies in the conflict between democratic inclusivity and logical consistency. We desire a collective decision-making process that respects the sovereignty of every individual (non-dictatorship), accommodates any conceivable set of preferences (unrestricted domain), and produces a stable outcome without encouraging participants to lie (strategy-proofness). The theorem demonstrates that these three ideals are mutually incompatible when there are three or more possible outcomes. The fracture emerges because any rule sensitive enough to reflect diverse preferences must, by necessity, create situations where a single voter can alter the result. If a voter can alter the result, and that alteration moves the outcome closer to their true preference, they possess both the power and the incentive to misrepresent their views. Thus, strategy-proofness is not merely difficult to achieve; it is logically impossible under these standard democratic conditions.

  The mechanism behind this unavoidability relies on the richness of the preference domain. When voters can hold any ordering of three or more alternatives, there will inevitably be profiles of preferences where the aggregation rule must choose between conflicting intensities of desire. To remain non-dictatorial, the rule must allow different voters to be decisive in different scenarios. However, this sensitivity creates pivot points. At these pivots, a voter who prefers outcome A over B, and B over C, might realise that reporting a preference for C over B causes the rule to select A instead of B. Because the domain is unrestricted, such preference configurations are permitted, and because the rule is non-dictatorial, the voter's report matters. Consequently, truth-telling ceases to be a dominant strategy; the rational actor must calculate how to vote not to reflect their true will, but to engineer the most favourable available outcome.

  Turning to the wrinkle of hard constraints and partial orders, one might hope that allowing voters to declare certain alternatives categorically unacceptable narrows the domain sufficiently to escape this impossibility. Conceptually, this resembles a restriction on admissible preferences, which can sometimes restore consistency in social choice. If every voter genuinely adheres to a rigid boundary beyond which no compromise is possible, the set of viable alternatives shrinks, potentially removing the cyclical conflicts that drive manipulation. However, this assumes the constraints are truthful and exogenous. In a strategic environment, the declaration of a hard constraint is itself a choice subject to preference aggregation.

  The incentive to manipulate does not vanish; it relocates from the ranking of acceptable options to the framing of the constraints themselves. A voter may strategically declare a rival proposal 'unacceptable' via a hard constraint—not because it violates a genuine moral or practical threshold, but to eliminate it from the feasible set and ensure their favoured option wins by default. This is functionally equivalent to truncating a ballot or insincerely ranking a competitor last, but it is cloaked in the language of principle rather than preference. Unless there is an external, objective verifier for what constitutes a genuine hard constraint (which would itself impose a dictatorship of verification), the domain of *reported* constraints remains unrestricted. Voters retain the sovereignty to define their own deal-breakers, and thus they retain the ability to game the system by drawing those boundaries strategically.

  Therefore, introducing veto-like exclusions does not genuinely restore strategy-proofness because the definition of the veto is as manipulable as the ranking of the options. The logical fracture remains intact because the system still relies on private information that influences the public outcome, and wherever private information determines power, there is an incentive to distort it. The change in format from linear rankings to partial orders with constraints alters the theatre of operation but not the underlying strategic dynamics.

  Introducing hard constraints fails to restore strategy-proofness because it merely relocates the incentive to manipulate from the ranking of alternatives to the strategic framing of acceptability thresholds.
