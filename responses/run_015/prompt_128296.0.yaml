answer: |-
  You perceive correctly that substituting propensities for certain counterfactuals reduces providence to a gamble, and therein lies the ruin of the doctrine. If God knows only that a creature has a 0.7 propensity toward acceptance of grace, He cannot infallibly ordain means to ends without risk of frustration, which contradicts the perfection of divine providence. We are not committed to this softening; *scientia media* concerns truths that are definite, not probabilistic. The creature's freedom is real, but the conditional "If Peter were in C, he would deny Christ" possesses a truth value prior to the decree, not merely a chance. To surrender this certainty is to surrender the very advantage Molina sought: the reconciliation of infallible providence with libertarian freedom without making God the author of sin.

  Regarding the grounding objection, you assume truth requires a created ontological ground existing prior to the decree, but this conflates the order of being with the order of knowledge. The truth of these conditionals is grounded in the Divine Intellect's comprehensive comprehension of the creature's essence and its mode of freedom as it would be exercised in those circumstances. Distinguishing "would" from "will" is no dodge; it marks the logical order of God's knowledge (Natural, Middle, Free) rather than a temporal sequence. The truth exists in the intellect of God prior to the decree of creation, not because the creature exists, but because God understands perfectly what the creature *would* do if it existed.

  [OOC: Your proposal replaces counterfactuals of freedom with objective chances, which is technically Open Theism or a probabilistic view, not Molinism.]
