      *   **Freely Transferable:** This would treat the tenancy as a property asset. The tenant captures the net present value of the rent differential.
      *   **What would be lost?** The goal of affordable housing for the *occupier*. The new buyer pays the market price for the leasehold, effectively nullifying the subsidy for the resident (though the landlord still gets controlled rent, the *tenant* pays the market rate via the purchase price). It turns housing security into a speculative asset.
      *   **Subsidy Compatibility:** Yes, it's compatible. If rent control is a subsidy to households, making it inalienable ensures the subsidy stays with the household's consumption (housing) rather than being converted to cash.

