answer: |-
  The combination of heritability and inalienability presupposes that the tenant's interest is a **personal right of occupancy** rather than a tradable property asset. It views housing primarily as a use-value essential for household stability, not an exchange-value for wealth accumulation. By limiting succession to co-residents, the law prioritizes the continuity of the home as an established social unit, preventing displacement upon death without allowing the tenant to designate arbitrary successors who lack a genuine residential tie. This treats the interest as a status attached to the household's existence, not the individual's will.

  If the tenancy were freely transferable, the theory would shift to treating the regulated lease as a **property right** akin to a leasehold estate. The tenant could capture the net present value of the rent differential as capital. However, this would undermine rent control's primary economic purpose: affordable occupancy. A buyer would pay the market price for the right to the controlled rent, effectively neutralizing the subsidy for the actual resident. The benefit would accrue to the sitting tenant as a windfall, not to the household as ongoing affordability.

  What is lost is the guarantee that the subsidy benefits the *occupier* rather than the *owner of the lease*. Transferability invites speculation and could encourage tenants to vacate solely to monetize the asset, reducing housing stability.

  Is the actual rule compatible with viewing rent control as a household subsidy? Yes. In fact, inalienability strengthens this view. If the goal is to subsidize household consumption of housing, converting that subsidy into cash via sale defeats the purpose. Restricting transfer ensures the subsidy remains tied to the act of living there. It treats the benefit as an income-in-kind that cannot be liquidated, ensuring the economic support serves its intended function of sheltering the specific household rather than enriching the individual tenant. Thus, the rule reflects a coherent view that housing security is a social good attached to persons, not a market commodity.
