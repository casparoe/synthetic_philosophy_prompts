  *(She stands, tapping her glass gently until the room settles. She holds a folded piece of notebook paper, glances at it, then looks up at the table.)*

  Good evening, everyone. For those of you who don't know me, I'm Elena. I spent five years in this lab chasing beetles before I started chasing deadlines. I traded my field notes for plot outlines, but I'm still trying to figure out why things happen the way they do.

  I was preparing some remarks tonight, trying to summarize forty years of science into something digestible. And I noticed in my notes here… I kept writing "Spandril." *(She pauses, squints at the paper, then laughs)* Spandrel. God, if I'd written that on a thesis draft, Arthur would have red-penred it into the margin so hard the paper would have torn. So, for the record: Spandrel. Not a pasta. Not a typo. An architectural byproduct.

  For the family and friends here: Arthur spent his career studying why things exist. The common assumption—what scientists call the "adaptationist programme"—is that every trait in nature is a perfect solution to a problem. If a beetle has a horn, it's for fighting. If a bird has a color, it's for mating. It's a comforting idea. It means everything has a purpose.

  Arthur spent forty years gently telling us that… well, that's not always true.

  He taught us that nature isn't a perfect engineer. It's more like a handyman working with whatever scraps are left over from the last job. Sometimes you get a trait not because it was designed for a purpose, but because it's the structural consequence of something else. Like the triangular spaces between arches in a cathedral. They weren't designed to hold paintings; they just *are* there because of how you build arches. Later, you might paint them, but that wasn't why they exists.

  He taught us that sometimes, looking for a purpose is the wrong question. Which is a relief for the biologists, because it means less grant writing, and a relief for the rest of you, because it means you don't need a five-year plan to justify having a weird hobby.

  But I want to talk about a specific moment. 1988. The *Carabus* beetle study.

  For those in the field, you know this one. Arthur spent three years measuring antennae curvature, running fitness regressions, looking for the selective advantage. He couldn't find it. The trait didn't help them mate. It didn't help them eat. It didn't help them survive.

  By conventional standards, the project was a failure. He hadn't found the "why." Colleagues suggested he wasn't looking hard enough. Maybe the advantage was subtle. Maybe it was behavioral.

  But Arthur stopped. He wrote the paper that said, essentially: "There is no why." It was a spandrel. A structural consequence of how the beetle's head grows. The variation was noise, not signal.

  At the time, some people called it a dead end. But that paper? That was the breakthrough. Because admitting that something *doesn't* have a purpose is harder than inventing a story that says it does. It requires rigor. It requires the courage to say, "We don't need to explain this away."

  That's the legacy here. It's not just about beetles. It's about the comfort of the null hypothesis.

  I was arguing with my roommate last week about whether novel plots have spandrels too. She thinks every scene needs to drive the theme. I told her sometimes a scene is just there because the character needed to walk from the kitchen to the garage, and the conversation happened to fill the space. It's not everything. But it's part of the structure.

  Arthur taught us that we don't have to be optimally designed to be valuable. We don't have to have a perfect adaptive reason for every wrinkle, every detour, or every retirement party. Some things are just beautiful byproducts of the history that built us.

  So, to Arthur. Thank you for teaching us that it's okay if the story isn't perfect. Thank you for teaching us that knowing what isn't true is just as important as knowing what is. And thank you for proving that sometimes, the most profound discovery you can make is that there was nothing to find in the first place.

  To Arthur.
