answer: |-
  1. Position framing
  Stream-consequentialism diverges from classical negative utilitarianism by prioritizing the causal trajectory of mental formations over immediate suffering reduction, weighting chronic structural dukkha above episodic pain. Unlike standard Buddhist karmic theory, it rejects virtue ethics as insufficiently consequentialist, insisting that moral worth derives solely from suffering mitigation rather than moral character. Crucially, it demands metaphysical realism regarding rebirth streams; without literal continuity across lifetimes, the philosopher argues karmic calculus collapses into vague moralism, despite simultaneously denying the existence of a permanent self to inhabit those streams.

  2. Interview questions
  To probe the operational viability of stream-consequentialism, I propose eight inquiries.

  1. Given your explicit rejection of a permanent self, how do you assign moral weight across rebirths? What constitutes the moral unit if not a person? Is the stream itself the patient of morality, and how do we identify its boundaries without reifying a self? *Follow-up:* If causal continuity suffices for identity, why does the stream boundary matter morally more than spatial proximity between distinct streams?

  2. Can intentional harm be justified to disrupt a destructive sankharic trajectory? Does the structural baseline permit inflicting episodic pain to prevent chronic craving? *Follow-up:* Does this instrumentalize suffering in a way that fundamentally violates the First Precept against harming living beings, or is the precept subordinate to structural reduction?

  3. How do individual actions aggregate into a stream-level moral evaluation? Do we sum discrete karmic moments or evaluate the vector of the trajectory? How do you avoid arbitrariness? *Follow-up:* Is there a specific threshold where acute episodic pain outweighs long-term structural benefit?

  4. How do you objectively measure structural dukkha versus episodic pain? Who determines when a pattern becomes chronically deleterious? Is there an external metric? *Follow-up:* Does this weighting system invite paternalistic judgments about another's internal mental state?

  5. Why does karmic theory collapse without literal rebirth? You argue symbolic rebirth reduces karma to vague moralism. Why is the metaphysical claim necessary? *Follow-up:* Is this an empirical claim about causality or a necessary condition for moral coherence? Can the theory stand without it?

  6. You reject Theravada virtue ethics as insufficient. Doesn't moral character shape sankharas? Why is virtue merely secondary to consequence? Does character lack causal power? *Follow-up:* Is virtue merely instrumental here, rather than constitutive of the good life?

  7. How is the structural baseline calibrated across different sentient beings? Does a human stream weigh differently than an animal stream? What defines the weighting? *Follow-up:* Is the baseline universal or context-dependent upon cognitive complexity and capacity for craving?

  8. What motivates agents if personal karmic reward is dismissed? Why reduce suffering if no one persists to benefit? Is motivation purely rational? *Follow-up:* Is altruism coherent without a stable beneficiary to receive the merit?

  3. Pressure point
  The question regarding cross-lifetime suffering without stable identity exposes the deepest tension. It highlights the conflict between ontological emptiness and the moral realism required for karmic streams. If there is no self, the stream is a conceptual construct. If it is a construct, weighting it across lifetimes risks reifying the very self she denies. This undermines the coherence of assigning responsibility or moral value to a fiction, threatening to collapse her metaphysical claims into the vague moralism she seeks to avoid.
