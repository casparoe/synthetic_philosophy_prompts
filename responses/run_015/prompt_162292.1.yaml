  6.  **Addressing the "Earned Personhood" Comment:**
      *   This is the distinction between *human being* (biological) and *person* (moral/legal status). In Ubuntu, it's often about moral maturity. It *is* scary because it can exclude people. I need to flag this carefully.

  7.  **Refining the Output:**
