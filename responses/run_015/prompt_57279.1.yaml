      *   *Refined Decision:* I will recommend **Design B (Receipt-side scheme)** because it best targets the moral harm of unearned advantage accumulation, but I will ground it in preventing a hereditary caste rather than perfect equal opportunity (addressing the legibility problem).

  3.  **Drafting - Section by Section:**

      *   **Header:** Recommendation sentence.
      *   **Introduction:** Brief context.
      *   **Section 1: The Baseline (Opportunity Conceptions).**
