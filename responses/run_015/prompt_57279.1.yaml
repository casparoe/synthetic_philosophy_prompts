      *   **Section 4: The Losing Side (Parental Partiality & Illiquidity).**
          *   Objection: Family integrity requires freedom to provide. Design B hurts illiquid assets (farm/workshop) because tax is due on receipt, potentially forcing sale.
          *   Recognition: This is a deep moral claim, not just economic.
          *   Response: The right to provide is not a right to confer *dominance*. Deferral options for illiquid assets can mitigate the liquidity crunch without abandoning the principle. The moral cost of partiality is outweighed by the civic cost of caste.
