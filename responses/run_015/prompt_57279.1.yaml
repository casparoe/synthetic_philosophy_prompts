          *   *Correction:* Actually, Design B is more aligned with a "lifetime starting gate" – you get a total allowance of unearned advantage. Design A is a "transactional starting gate" – each inheritance event is reset.
          *   *Key argument:* Design B is superior because it prevents splitting estates to bypass progressive rates (a flaw in A) and focuses on the recipient's total unearned advantage, which is what matters for opportunity.
      *   **Section 2: Legibility (The Economist's Challenge).**
          *   Acknowledge the leak: tuition, networks, etc., aren't taxed.
          *   If pure equal opportunity is the goal, this tax fails.
          *   Shift ground: The goal is not perfect equality of opportunity, but preventing a *hereditary political caste* or maintaining a *declaratory norm* against aristocracy.
          *   Implication for Design: Design B is better here because it tracks the *concentration* of wealth in individuals, which is what creates caste power, whereas Design A taxes the transfer regardless of who gets it (a rich kid vs. a poor kid inheriting the same amount). Design B targets the accumulation of power in specific hands.
      *   **Section 3: The Foundation Question (Charitable Vehicles).**
          *   Problem: Dynasty trusts disguised as charities.
          *   Test: The "Effective Control and Benefit Test."
          *   Criteria: Family employment %, Board control, Mission lock vs. spend-down, Naming rights.
