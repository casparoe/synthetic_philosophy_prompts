  Reject (1). Specifically, reject the claim that the fine-grained partition is *conceptually available* for conditioning.

  First, your argument contains a contradiction. If (2) holds ($P'(e^*)=1$) and $e^*$ entails $E$ (from 1), probability monotonicity demands $P'(E)=1$. Your setup stipulates $P'(E)=0.8$. You cannot simultaneously hold that the fine-grained seeming is certain and the coarse description is uncertain if the former entails the latter.

  If you keep (2) as bedrock, you must admit the Jeffrey Conditioning (JC) setup is an approximation. But this doesn't force conclusion (7). To save Radical Probabilism from vacuity, argue that while $e^*$ is certain, it is ineffable. You cannot conditionalize on propositions you cannot formulate. The fine-grained phenomenal character lacks the conceptual structure required to serve as a condition in Bayes' rule.

  RP survives as the normative theory for bounded agents who experience certainty but lack the concepts to condition on it. We use JC on coarse $E$ because we cannot articulate $e^*$. The "input problem" isn't a bug; it's the feature. It acknowledges the gap between phenomenology and doxastic language.

  The cost? You concede that RP is not fundamental rationality for ideal agents (who would presumably conditionalize on $e^*$), but rather a pragmatic logic for humans. It saves the package from emptiness by grounding it in conceptual limitation rather than metaphysical uncertainty. You keep introspective certainty, but admit you can't build a belief system directly upon it. The grain problem doesn't return because the fine grain is excluded from the algebra of belief, not merely reweighted.
