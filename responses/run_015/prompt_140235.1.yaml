  ### Part 1: Mechanism Brainstorming

  Here are three distinct mechanisms for operationalizing incommensurability in the classroom, ranging from market-based to phenomenological.

  1.  **The "Exchange Rate" Market:** Students are given endowments of two different "currencies" (e.g., *Time Tokens* and *Merit Tokens*) and asked to trade them for goods that only accept specific currencies.
      *   *Pros:* Visually demonstrates that some goods resist conversion.
      *   *Cons:* Risks implying commensurability (i.e., that there *is* a rate, even if it's high). Students often solve this by arbitrarily assigning a price, which reinforces the "everything collapses to preference" view you want to avoid.

  2.  **The "Reason-Giving" Constraint:** Students make a choice, but are only allowed to justify it using a restricted list of predicates (e.g., they can say "it is kinder" but not "it is better").
      *   *Pros:* Highlights the linguistic gap in value comparisons.
      *   *Cons:* Too intellectual. It tests their vocabulary, not their felt experience of choice. It becomes a logic puzzle rather than a value problem.

  3.  **The "Small Improvement + Commitment" Protocol (Selected):** Students commit to a choice between two hard options. The rejected option is then slightly improved ("Small Improvement"). They are allowed to switch. Finally, they must publicly "endorse" their final choice to a peer.
      *   *Pros:* Directly tests the "Small Improvement Argument" (Parfit/Chang) behaviorally. If options are equally good, the improvement dictates a switch. If they are incommensurate, the improvement creates tension or resistance. The endorsement phase forces the creation of reasons, highlighting the "will" aspect of hard choices.
      *   *Cons:* Requires careful construction of options to ensure they aren't easily priced.

  **Selection:** I recommend developing **Mechanism 3**. It aligns best with your hunch about the "small improvement" move and allows for the second beat (commitment/endorsement) to land effectively. It shifts the focus from *calculating* value to *experiencing* the resistance of value.

  ---

  ### Part 2: Activity Design — "The Privilege Protocol"

  **Goal:** To create a behavioral signature distinguishing "equal goodness" (where a small improvement dictates a switch) from "hard choice/incommensurability" (where a small improvement creates hesitation or normative resistance).

  **Materials:**
  *   Two colors of index cards (e.g., Blue and Yellow).
  *   Pens (pencil for initial choice, black marker for final commitment).
  *   A "Ledger" sheet on the whiteboard (two columns: *Extension* and *Exemption*).
  *   Printed "Privilege Vouchers" (one per student).

  **The Options (The Stakes):**
  These are course privileges. They are valuable, real, but distinct in kind.
  *   **Option A (The Extension):** A 48-hour "No Questions Asked" extension on the Final Paper.
  *   **Option B (The Exemption):** A waiver for two Weekly Reading Responses (of your choice).

  *Why these work:* One buys *time* (stress reduction regarding deadlines); the other buys *volume reduction* (workload management). For many students, these are not easily traded on a single scale.

  **The Rules:**
  1.  **Private Commitment:** Students choose A or B secretly.
  2.  **The Upgrade:** The rejected option is improved slightly *on its own dimension*.
  3.  **The Switch:** Students may switch to the improved option freely.
  4.  **The Endorsement:** To activate the voucher, students must write their name on the public Ledger and verbally recommend their choice to one peer.

  ---

  ### Part 3: Minute-by-Minute Outline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute cards/vouchers. Seat students in pairs. |
  | **05–15** | **Round 1** | Private Choice (Pencil). Students write A or B on card. No discussion. |
  | **15–20** | **The Upgrade** | Reveal the "Small Improvement" on the *rejected* option. |
  | **20–30** | **Round 2** | Switch Phase. Students decide to Stay or Switch. |
  | **30–45** | **Commitment** | **The Second Beat:** Public Ledger & Peer Endorsement. |
  | **45–75** | **Debrief** | Facilitated discussion mapping behavior to value theory. |
  | **75–80** | **Close** | Collect cards, distribute vouchers, final neutral remark. |

  ---

  ### Part 4: Facilitator Script (Neutral Interventions)

  *Note: Do not use value-laden words like "better," "hard," "equal," or "rational."*

  **1. Setup (00:00)**
  "Take one Blue card and one Yellow card. On the Blue card, write 'Extension.' On the Yellow card, write 'Exemption.'
  Here are the definitions:
  *   **Extension:** 48 hours added to the Final Paper deadline.
  *   **Exemption:** Waiver for two Weekly Reading Responses.
  "Take a pencil. Choose one card. Write your name on it. Place the other card face down on your desk. Do not show your partner. You have three minutes."

  **2. The Upgrade (15:00)**
  *Collect the face-down cards (the rejected options) into a box without looking at them.*
  "Keep your chosen card. I am now altering the value of the option you *did not* choose.
  *   If you are holding **Extension**: The Exemption option is now a waiver for **three** Reading Responses (instead of two).
  *   If you are holding **Exemption**: The Extension option is now **72 hours** (instead of 48).
  "You may keep your current card, or you may trade it for the improved option. If you trade, hand me your card and take a new one from the stack. You have five minutes."

  **3. The Commitment Beat (30:00)**
  *This is where you engineer the 'not arbitrary' feeling.*
  "Take your final card. Take the black marker.
  Go to the whiteboard. There are two columns: *Extension* and *Exemption*.
  Write your name in the column matching your final card.
  **Rule:** Once your name is on the board, your choice is fixed. You cannot change it after class.
  **Task:** Turn to your partner. You have two minutes. You must tell them *one reason* why the option you picked is the right one for a student in this course. You cannot say 'It depends.' You must say 'This one is...'"

  **4. Close (75:00)**
  "Leave your cards on your desk. I will distribute the valid vouchers next week. Thank you."

  ---

  ### Part 5: The Debrief (Mapping Behavior to Theory)

  *Do not lecture. Ask questions that force them to articulate the distinction.*

  **1. The Switch Data (45:00)**
  *Write the switch rates on the board.*
  "Look at the board. Of the people who started with Extension, how many switched to the improved Exemption? [Count hands]. Of those who started with Exemption, how many switched to the improved Extension?"
  *   **If most switched:** "For you, did the improvement make the decision easy?" (Target: Trichotomy/Equal Goodness).
  *   **If many stayed:** "You were offered *more* of the thing you didn't pick. Why didn't you take it?" (Target: Incommensurability/Parity).
  *   **Key Question:** "For those who switched, did it feel like correcting a mistake, or like giving something up?"

  **2. The Endorsement Experience (55:00)**
  "During the partner talk, I asked you to give a reason. You were forbidden from saying 'It depends.'
  *   "Who found it easy to give a reason?"
  *   "Who felt like they were stretching the truth to find a reason?"
  *   **Philosophical Hook:** "If the two options were truly equal, any reason should work. If one was truly better, the reason should be obvious. For those who struggled: were you *finding* a reason, or *making* one?"

  **3. The Ledger Weight (65:00)**
  "When you wrote your name on the board with the marker, did it feel different than writing it in pencil on the card?"
  *   **Target:** Distinguishing "Preference" (internal state) from "Commitment" (normative status).
  *   **Point:** "In a coin flip, signing your name is just record-keeping. In a hard choice, signing your name feels like taking responsibility. Why?"

  **4. Introducing Vocabulary (75:00)**
  "Now I will give you the words you felt but didn't have.
  *   **Trichotomy:** The view that A must be Better, Worse, or Equal to B. (The Switchers).
  *   **Incommensurability/Parity:** The view that A and B can be different in kind, where 'more' of B doesn't automatically beat A. (The Stayers/Hesitators).
  *   **The Will:** The idea that in hard choices, reasons run out, and our commitment *creates* the reason."

  ---

  ### Part 6: Troubleshooting & Limitations

  **Predictable Problem 1: "I just didn't know what I wanted." (Preference Uncertainty)**
  *   *Student Objection:* "I didn't switch because I was confused, not because the values were different."
  *   *Your Response:* "Note when the confusion happened. Did you feel confused during the first choice (pencil), or specifically when the upgrade was offered (marker)? If it was just uncertainty, the upgrade should have clarified it. If the upgrade made it *harder*, that suggests the options weren't on the same scale."
  *   *Strategy:* Don't refute them. Use them. "Uncertainty is one explanation. Incommensurability is another. How could we tell the difference?" (Save this for the essay prompt).

  **Predictable Problem 2: "Everything has a price." (Radical Commensurability)**
  *   *Student Objection:* "I would have switched if the Extension was 100 hours. Everything is comparable."
  *   *Your Response:* "That is a coherent philosophical position (Monism). But did you feel the *price* during the 5 minutes? Did you calculate hours, or did you feel a resistance to trading?"
  *   *Strategy:* Acknowledge the theory, pivot to the phenomenology. "You're arguing about metaphysics. I'm asking about your experience of the choice."

  **Predictable Problem 3: The "Free Switch" Loophole**
  *   *Risk:* Students treat the switch as a game to "win" the best deal, ignoring the normative weight.
  *   *Mitigation:* The **Ledger/Endorsement** beat is crucial here. By forcing them to publicly defend the choice *after* the switch, you reintroduce the cost. If they switched just for "more stuff," they will struggle to defend it as "right for a student."

  **Honest Limitations (What this activity cannot do):**
  1.  **Parity vs. Incommensurability:** This activity cannot distinguish Ruth Chang's "On a Par" from strict "Incommensurability." Both produce the same behavioral hesitation. You must supply this distinction in the lecture portion.
  2.  **Vagueness:** It cannot prove the values aren't just vague. Students might say, "I just couldn't measure them precisely."
  3.  **Metaphysical Proof:** This demonstrates the *phenomenology* of hard choice (what it feels like), not the *metaphysics* (that the values are actually incomparable).
  4.  **Use the Remaining 10 Minutes:** Do not try to solve these limitations in the activity. Use the final 10 minutes of the debrief to explicitly state: "Today you felt the resistance. Next week, we argue about whether that resistance is a feature of your minds or a feature of the world." Assign a reading (e.g., Chang or Raz) that tackles the metaphysics directly.

  ### Final Note on the "Second Beat"
  The **Ledger + Endorsement** rule is the engine for your requirement that "choice turns out not to be arbitrary."
  *   In the **Equal Goodness** case (Trichotomy), writing on the ledger is administrative. The reason-giving is easy ("More hours is better").
  *   In the **Hard Choice** case (Parity), writing on the ledger feels like *staking a claim*. The reason-giving feels like *legislating a value*.
  *   By forcing them to speak the reason *after* the commitment, you force them to experience that the commitment *preceded* the reason. This is the core of the "Will-Based" view of hard choices.
