answer: |-
  ### The reconstructed implicit theory

  The implicit theory posits a taxonomy of harm based on reversibility, consent, and epistemic access. Environmental risks are treated as systemic, irreversible, and imposed on non-consenting entities, including ecosystems and future generations. Consequently, knowledge is presumed insufficient until proven otherwise, shifting the burden of proof to the actor. Conversely, medical and software risks are framed as localized, reversible via rollback or treatment cessation, and borne by consenting or identifiable agents. Epistemically, this assumes ecological causality is opaque and lagging, requiring ex-ante barriers, while clinical and software causality is legible and real-time, allowing ex-post correction. Morally, it distinguishes between duties to protect the vulnerable who cannot reciprocate versus duties to facilitate access for identifiable present users. Value is distributed such that stability is prioritized for the commons, while innovation is prioritized for individual consumers. This creates a dual ethic: conservation for the collective background, experimentation for the individual foreground. It presupposes that the "state of nature" is a baseline to be preserved, whereas the "state of technology" is a frontier to be explored. Responsibility is thus asymmetric: one is responsible for changing the background conditions of existence, but less responsible for failures within the optional tools users adopt. This relies on a distinction between constitutive harms (changing the world) and operational harms (breaking a tool). Furthermore, it assumes that the capacity to remedy harm correlates with the proximity of the victim. In medicine, the patient is present to report symptoms; in ecology, the victim is often absent or silent. Therefore, the moral obligation shifts from remediation (fixing it when broken) to prevention (ensuring it never breaks). This theory of responsibility ties the strictness of regulation to the visibility of the sufferer, embedding an epistemic limitation directly into the moral framework.

  ### Strict presupposition versus compatible fit

  Strictly, this divergence presupposes only that the cost of false negatives—allowing harm—outweighs false positives—blocking benefit—in ecology, but not in medicine or software. It logically requires a belief in differential reversibility; if environmental damage were fully reversible, the precautionary principle would lose its force. However, the specific assignment of domains is contingent. We could imagine software so critical to infrastructure that it warrants ex-ante proof, or chemicals so benign they warrant post-market monitoring. The institutional split fits a worldview where nature is fragile and technology is controllable, but it does not logically demand this categorization. It accommodates economic interests favoring rapid iteration, but this is a political fit, not logical necessity. The core requirement is simply that the expected cost of irreversible loss exceeds the cost of delayed innovation in one domain but not the other.

  ### Rival interpretations and underdetermination

  The divergence is philosophically underdetermined. A utilitarian framework could justify it via tractability: environmental damage is hard to quantify and repair, so default to restriction; medical benefits are easily quantified in survival rates, favoring deployment. Alternatively, a rights-based view could argue future generations hold rights to a habitable planet, vetoing ecological risk, while current patients hold rights to life-saving treatment, vetoing excessive regulation. A contractarian view might suggest environmental victims cannot consent to risk, whereas software users accept terms of service. Distinct ethical foundations converge on the same institutional design, meaning the practice does not reveal a single unique moral truth but rather a focal point for multiple theories. The institutional pattern is a stable equilibrium compatible with consequentialist, deontological, and contractualist reasoning alike.

  ### What a unified replacement would require

  A unified risk-cost calculus would demand radical institutional symmetry. If we applied the precautionary principle universally, software deployment would require exhaustive formal verification before release, drastically slowing innovation and denying users beneficial tools. If we applied permissive deployment universally, chemicals would enter markets until morbidity data accumulated, likely causing irreversible ecological collapse. Unification requires a universal metric of reversibility and consent. Institutions would need either massive ex-ante testing capacity for software or real-time biological monitoring for chemicals. Essentially, we would need to either treat code as toxic waste or toxins as software patches, fundamentally altering the pace of development and the structure of liability across all sectors. Liability would shift from user assumption of risk to provider guarantee of safety, or vice versa, across the board.

  ### Limits and what would change my mind

  The weakest point is the epistemic claim that software harm is legible and reversible. Many algorithmic harms are opaque. If empirical study showed that software failures cause systemic, irreversible damage comparable to chemical spills, yet regulations remained permissive, my reconstruction would fail. This would suggest the divergence rests on political power, not philosophical coherence. Evidence of permissive irreversible software harms alongside restricted reversible chemical harms would force a revision toward a power-based explanation.
