      *   *Context Sensitivity:* Rules are blunt. Indirect normativity allows for situational nuance that rigid self-management rules miss. The "coach" might say "break the rule this once" to teach a deeper lesson.
      *   *Identity Shift:* The goal of indirect normativity might be to change *who* is asking the question, not just what they do. Direct rule-following keeps the agent static; ideal deliberation invites transformation.

