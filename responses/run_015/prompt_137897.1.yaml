  A national pension scheme calculates payouts using a continuous formula where benefits rise by 0.5% for every successive year of birth between 1960 and 1980, reflecting a smooth demographic adjustment rather than any policy rupture, war, or economic crash. Despite this continuous causal gradient, a longitudinal survey reveals that individuals born between 1960 and 1969 exhibit significantly higher risk tolerance in investment than those born between 1970 and 1979, because the smooth benefit increase crosses a critical subsistence threshold precisely at the 1970 boundary. A researcher finds that grouping these individuals by decade predicts their financial behaviour more accurately than using their exact age, social class, or the continuous benefit amount itself, as the threshold triggers a categorical shift in psychological security that linear models miss.

  The case secures the divergent verdicts because it isolates predictive utility from shared historical causation. The prediction account affirms this is a generation because the decade boundary maximises explanatory power regarding attitudes and behaviour, satisfying the requirement that a kind be useful for forecasting better than available alternatives like age or class. The historical-cause account denies it because the causal exposure—the pension formula—is perfectly continuous, meaning there is no 'real discontinuity' such as a war or crash that the cohort underwent together to form a shared outlook; the boundary tracks a psychological threshold, not a historical rupture. The single feature doing the work is the smoothness of the external causal variable contrasted with the step-function of the behavioural response. If the pension formula itself contained a sharp policy cut-off in 1970, the historical-cause account would also verdict 'yes', as the boundary would then track a discontinuity in causal exposure. The strongest objection a defender of the historical-cause account could raise is that crossing a material subsistence threshold *constitutes* a formative event in itself, analogous to a crash; however, she must then concede that any biological or economic constant triggering a behavioural shift creates a 'generation', which dilutes the account's focus on shared *historical* experience and risks classifying non-social kinds (such as those defined by puberty onset) as generational cohorts.
