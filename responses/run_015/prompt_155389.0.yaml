answer: |-
  Right, so your flatmate is pulling a classic liberal move. It's a bit of a conversation-stopper, isn't it? Sounds profound, but like most slogans, it's doing a lot of heavy lifting without actually explaining what the load is.

  The phrase "the individual is prior to society" is ambiguous as hell. Depending on how you parse "prior", it ranges from a biological truism to a metaphysical howler. If you want to proper engage them next time you're having a cuppa, you need to pin them down on *which* priority they mean.

  Here's the breakdown of the four main ways to read that claim, ranked from "boringly obvious" to "philosophically bonkers".

  ### 1. The Biological/Temporal Claim
  **The Idea:** Human beings are born as distinct organisms before they learn to speak, walk, or join a community. In time, the individual comes first.
  **Verdict:** **Obviously True (but irrelevant).**
  **The Gist:** Yes, biologically, you exist before you join the rugby club or vote in a general election. But no communitarian denies this. Sandel and MacIntyre aren't arguing that babies pop out of the womb wearing club ties. They're arguing about *identity*, not biology.
  **Does it shut down the critique?** No. It's a straw man. If your flatmate means this, they haven't understood the objection.

  ### 2. The Methodological Claim
  **The Idea:** To explain social phenomena, you must ultimately look at individual actions and beliefs. Society doesn't act; people act. (Think Max Weber or Karl Popper).
  **Verdict:** **Defensible but Substantive.**
  **The Gist:** This is "Methodological Individualism". It says you can't treat "Society" as a spooky ghost hovering above us; you have to explain things via individuals.
  **Does it shut down the critique?** Not really. Communitarians can agree that individuals *act*, but argue that the *reasons* they act and the *content* of their thoughts are socially derived. MacIntyre would say you can't even describe an individual's action without referencing the social role they're playing (e.g., you can't be a "priest" or a "footballer" in a vacuum). So, this claim doesn't defeat the idea that the self is socially constituted.

  ### 3. The Normative/Political Claim
  **The Idea:** Individual rights and interests morally trump collective goals or social goods.
  **Verdict:** **Defensible (it's Liberalism 101), but it begs the question.**
  **The Gist:** This is the political cash-value of the slogan. It means "my right to choose matters more than the community's tradition."
  **Does it shut down the critique?** No, because this is exactly what's being debated. The communitarian critique is that liberal rights *presuppose* a certain view of the self (the unencumbered self) which is false. If your flatmate uses this claim, they're just restating their conclusion ("Liberalism is right because individuals matter most") without answering the anthropological challenge ("But are individuals actually separate from society?"). It's circular.

  ### 4. The Ontological/Constitutive Claim
  **The Idea:** The self is fully formed *before* it enters social relations. My identity is independent of my ends, attachments, and community. I could be 'me' without my family, language, or culture.
  **Verdict:** **Actually False (or at least highly controversial).**
  **The Gist:** This is the "Unencumbered Self" that Sandel attacks in *Liberalism and the Limits of Justice*. It suggests society is voluntary, like a club you join, rather than a context that makes you who you are.
  **Does it shut down the critique?** This is the **only** reading that actually does the work your flatmate wants it to do. To defeat MacIntyre's "narrative embeddedness" or Sandel's "constitutive ends", you have to claim that the self exists independently of those things.
  **The Problem:** It's the hardest claim to defend. As Charles Taylor points out, you can't even think or define yourself without language, and language is a social product. If you take this away, the "individual" is a blank slate with no capacity for choice at all.

  ***

  ### So, what do they need to be invoking?

  If your flatmate wants that slogan to actually block the communitarian critique, they **must** be invoking **Claim #4 (The Ontological/Constitutive Claim)**.

  They need to be saying: *"I am me before I am a member of any group, and my core identity is not defined by my social ties."*

  **Why this is their weak point:**
  This is the bit that's properly vulnerable. If they claim this, you can hit them with the Taylor/MacIntyre line: "You can't even articulate that thought without using a shared language and concepts provided by society. Your very ability to be an 'individual' is a social gift."

  **Why they probably aren't invoking it:**
  Most liberals don't actually want to defend Claim #4 because it's so radical. They usually retreat to Claim #3 (Normative) when pressed. But Claim #3 doesn't answer the communitarian; it just ignores them.

  ### How to reply next time

  Don't let them get away with the slogan. Next time they drop it, try this:

  > "Right, but what do you mean by 'prior'? Biologically? Obviously. But Sandel isn't talking about biology, he's talking about identity. Are you saying you'd still be 'you' if you'd been raised by wolves with no language or culture? Because if you say yes, you're making a massive metaphysical claim. If you say no, then society is partly constitutive of who you are, and the communitarians have a point."

  That should stop the slogan from doing its work as a conversation-ender. Cheers.
