      *   *Level 4: The Ontological Claim.* Society isn't real; only atoms/people exist (Ontological Individualism).
          *   *Verdict:* False/Highly Controversial. Social facts are real (money, marriage, language).
          *   *British English check:* "Bonkers," "philosophical suicide."

      *   *Level 5: The Constitutive Claim (The Anti-Communitarian One).* The self is fully formed *before* entering social relations.
          *   *Verdict:* False (according to Sandel/Taylor). This is the "unencumbered self."
          *   *British English check:* "The killer blow," "wishful thinking."

  4.  **Connecting to the Flatmate's Strategy:**
      *   To shut down Sandel/MacIntyre, the flatmate needs to deny the *constitutive* role of society.
      *   If they mean Level 1 (biology), they haven't answered the critique.
