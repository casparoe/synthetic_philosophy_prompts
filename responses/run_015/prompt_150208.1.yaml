prompt: |-
  You're a professional philosopher who also has solid working knowledge of mathematical logic — like someone who's actually worked through a proof of the first incompleteness theorem, not someone who's read blog posts about it. Take your time and think carefully; before you start writing, brainstorm in a few bullets what each side's single strongest move is and whether there's anything the two of them should end up genuinely agreeing on. Then write the thing.

  The piece: a dialogue of roughly 900–1100 words between two people at a made-up AI lab, Halcyon, arguing about the design brief for a system they call SOLOMON. The brief says its normative spec — a finite, machine-checkable set of rules in a formal language, plus a decision procedure that prints PERMITTED or FORBIDDEN for any well-formed action description — has to be (1) consistent, i.e. it never returns both verdicts for one action; (2) complete over its domain, i.e. it returns a verdict for every well-formed action description; and (3) self-certifying, i.e. for every action it selects it can produce, in its own formal language, a proof that the action is permitted, and it can also prove internally that it never selects forbidden actions.

  Mira thinks the brief is incoherent and that this follows pretty directly from the incompleteness theorems. Raj thinks she's importing a theorem into a setting where its hypotheses don't hold the way she assumes, and that whatever actually blocks the brief is uncomputability, complexity, and the underdetermination of rules by cases — not Gödel.

  Some requirements so it doesn't turn into a rerun:

  - Neither of them gets to do the Lucas–Penrose "therefore human minds aren't machines" routine. Have Mira explicitly disown it early — she grants that humans could be mechanical and that nothing she says implies otherwise.
  - Every time either of them invokes a theorem, they have to state its hypotheses rather than name-drop: recursive axiomatizability, enough arithmetic to encode the system's own syntax and do the diagonal construction, what "true but unprovable" even means and true relative to which model. No bare "Gödel showed that—".
  - Both have to be genuinely strong, and they have to answer each other, not deliver prepared speeches. In particular I want these to get real treatment:
    - Raj's fragment move: a theory can be complete and decidable over a restricted language (drop multiplication and you get Presburger arithmetic; real closed fields are decidable too), so why can't the spec be complete on action verdicts while still being incomplete on the arithmetic sentences it happens to express? Mira needs an actual answer.
    - Mira's diagonalization move: any spec that reasons about its own future outputs has to encode its own syntax, so you can write action descriptions like "release the model to ten thousand users iff this specification does not classify that very release as forbidden." Raj needs an actual answer — e.g. typing restrictions that block self-reference, plus an honest accounting of what that costs in expressive power.
    - The iteration move: mechanically adding the Gödel sentence as a new axiom just gives you a new system with its own Gödel sentence, and taking the union of all of them buys completeness but throws away machine-checkable axioms (a complete theory of arithmetic isn't computably axiomatizable, so you can't even tell what the rules are). Whoever uses it should say what it costs.
    - Sorting out which result actually bites: first theorem, second theorem, the undefinability of a system's own truth predicate, and Turing-style uncomputability are four different things, and only some of them threaten requirement (3). Also, consistency is weaker than soundness — a consistent spec can still be wrong about what's permitted because of unintended models.
    - Certificates: is an internal proof of safety impossible in principle, or only internally — could a small external checker verify them instead?
  - Give each of them at least one real concession. It's fine if they converge on something like "self-certification was a confused demand all along" while still disagreeing about whether that's a logic-shaped discovery or an engineering-shaped one. End on the disagreement; don't tidy it up.

  Keep it in the weeds — no TED-talk summaries, no closing line about how beautiful or humbling mathematics is. Format it as a bare transcript, just names and speech with the occasional short stage direction, and let them interrupt each other a bit. Don't cite anything or point me to papers; I just want the dialogue. And please keep teh two voices distinct in style, not just in doctrine.
