prompt: |-
  hey, I'm taking a course on comparative ethics and my friends keep arguing about whether decapods feel pain as one unified subject or as a bunch of local reflex arcs that never converge. I want you to act like a philosophical fiction writer with a solid background in comparative neurobiology. Before you draft anything, please think carefull step by step: brainstorm what kind of scene could make a reader feel the pull of treating an animal as a cluster of welfare states rather than a single moral patient, without just explaining it in dialogue.

  Then write a short story—maybe 600-800 words—related to that concept. Set it in a near-future shrimp-farm audit station where a technician named Mara is calibratting an "inter-ganglionic resonence" monitor. The device detects asynchronous nociceptive patterns across ganglia that don't integrate into any central stream. Through her interaction with one tank—perhaps she has to adjust a parameter that lowers signal in one cluster but amplifies it in another—she should gradually doubt whether the standard welfare calculus (which assumes one subject per shrimp) actually applies here. Don't let her deliver a lecture; let the tension come from the readouts and her small practical choice. After the story, add a brief author's note explaining which feature of distributed welfare the narrative had to simplify or invent for dramatic effect. Keep the biology plausible but the idea weird and in-the-weeds. Don't include any bibliography, citations, or references to specific papers—this is just for a dataset and a model without web access shouldn't need them. Also please avoid putting any real philosopher's words in quotation marks; paraphrase if you need to invoke an idea.
