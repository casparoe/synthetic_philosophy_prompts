answer: |-
  The water in Tank 42 hummed, a low-frequency vibration that Mara felt in her teeth more than her ears. On her console, the waveform for Specimen 894 looked less like a heartbeat and more like a争吵—a quarrel of jagged lines refusing to sync.

  Mara adjusted her haptics gloves. The audit required a Coherence Score above 0.8 to certify the tank as humane. The standard model assumed a unified subject: one shrimp, one nervous system, one capacity for suffering. If the nociceptive signals from the tail, the claws, and the mouthparts integrated into a central stream, the animal was a single moral patient. If the signals remained isolated, bouncing between local ganglia without central registration, the welfare calculus changed. You weren't managing one animal's pain; you were managing a colony of reflexes.

  Specimen 894 was failing coherence.

  On the screen, the abdominal ganglia were screaming. A bright red spike pulsed on the lower track. Meanwhile, the supraesophageal ganglion—the brain—was flatlining, dormant. The tail was hurting, but the head didn't know it.

  "Stabilize," Mara whispered, her fingers hovering over the gain sliders.

  She engaged the Inter-Ganglionic Resonance filter. The goal was to smooth the noise, to force the disparate signals into a recognizable pattern of unified distress that the audit software could quantify. She pushed the slider for the abdominal cluster down. The red spike flattened. The Coherence Score ticked up to 0.75.

  But conservation of signal was a law she couldn't break. The noise didn't vanish; it shifted.

  As the abdominal signal dampened, the thoracic ganglia flared. The track for the walking legs turned from amber to violent violet. The local reflex arcs were trading load. By silencing the tail's complaint, she had amplified the legs' agitation.

  Mara froze. If the shrimp were a unified subject, this was just pain migration—moving the hurt from one spot to another. The total suffering remained constant. But the readout suggested something colder. The brain track remained flat. The central processor still wasn't picking up the call.

  She looked at the tank. The shrimp drifted near the glass, its eyestalks still. It wasn't thrashing. It wasn't guarding the injury. It was just a vessel where independent events were happening. The tail was in crisis. The legs were in crisis. But was *it* in crisis?

  If she lowered the thoracic gain to match the abdominal, the Coherence Score would hit 0.85. Pass. But that would mean suppressing two distinct local states to satisfy a metric designed for a single entity. She would be treating five separate welfare states as one to make the math work.

  Her finger hovered over the thoracic slider. To pass the audit, she had to pretend the shrimp was whole. She had to force the data to look like a single creature enduring a single experience. But the biology on the screen argued for a swarm.

  If she silenced the legs, who was she helping? The brain wasn't listening. The tail was already muted. She was merely tidying up the evidence of isolated fires in a building where no one lived.

  Mara exhaled, the condensation blooming against her face shield. She slid the thoracic gain down. The violet spike flattened. The Coherence Score jumped to 0.88. Green light. Audit passed.

  In the tank, Specimen 894 drifted on, a constellation of unacknowledged hurts, certified as whole.

  ***

  **Author's Note:**
  This narrative simplifies the neurobiology of decapods for dramatic effect. While crustaceans do possess segmented ganglia that can process nociception locally, the idea of completely non-integrated "welfare states" is a philosophical extrapolation rather than established fact. The "Inter-Ganglionic Resonance" monitor is a fictional device designed to visualize the ethical problem of distributed cognition. In reality, determining whether nociceptive signals integrate into a unified phenomenological experience is currently impossible to measure directly; the story treats this epistemic gap as a tangible technical calibration issue to heighten the moral tension.
