answer: |-
  The central ambition of neopragmatism is to liberate philosophy from the epistemological burden of representing reality. By rejecting the correspondence theory of truth, the neopragmatist seeks to dissolve the traditional distinction between how the world is and how we talk about it, replacing the goal of accuracy with the goal of utility. In the moral and political sphere, this translates to an account of progress defined not by convergence upon objective moral facts, but by the expansion of solidarity and the reduction of cruelty. However, this framework faces a severe internal challenge: if justification is always relative to a community's existing vocabulary and practices, how can one critique that very vocabulary when it is the instrument of oppression? If truth is merely what our peers let us get away with saying, then moral progress risks collapsing into circular self-congratulation. This essay argues that while Rorty's neopragmatism offers a compelling description of how moral change historically occurs, it fails to provide a coherent normative account of why such change constitutes progress. Specifically, the reliance on redescription and solidarity cannot distinguish between liberating change and mere rhetorical shift without smuggling in a naturalistic standard regarding suffering that contradicts strict antirepresentationalism. Consequently, the view must be revised to acknowledge a weak normative realism about human vulnerability.

  To understand the difficulty, one must first grasp the mechanism Rorty proposes for moral improvement. In the absence of moral truths waiting to be discovered, progress is achieved through imagination rather than inquiry. It is a matter of sentimental education, where the moral identity of a community is expanded by making the suffering of strangers vivid to its members. This occurs through redescription: the creation of new vocabularies that render previously accepted practices abhorrent or previously marginalized people visible. For the neopragmatist, a new moral language is "better" not because it corresponds to the intrinsic dignity of persons, but because it serves the purposes of a liberal utopia more effectively than its predecessor. It is better because it allows for a wider "we," facilitating cooperation and minimizing humiliation. The normative force of this change is internal to the practice of liberal democracy; it is justified by its success in creating a more inclusive, less cruel society, as judged by the standards of that society itself.

  The strongest defense of this position rests on the inevitability of starting somewhere. The critic of neopragmatism often demands a "view from nowhere," an Archimedean point outside of history and culture from which to judge all vocabularies. The neopragmatist rightly responds that no such point exists. We are always situated within a tradition. Therefore, critique must be immanent. We use the resources of our own tradition to criticize its failures. When we condemn slavery or patriarchy, we are not appealing to a transcendent law but extending the implications of our own commitment to liberty and equality. On this view, the charge of circularity is not a bug but a feature. We justify our values to those who share enough of our form of life to understand the appeal. For those who do not, we do not offer proof; we offer persuasion. We hope to seduce them into our vocabulary by showing them how it makes their lives richer and less brutal. This relies on the concept of irony: the ironic liberal knows their vocabulary is contingent, yet holds it firmly enough to act against cruelty. Hope lies in the belief that exposure to new descriptions will naturally expand sympathy.

  However, this defense crumbles when the existing vocabulary of the community is not merely incomplete but actively constitutive of harm. The problem is not just how to persuade an outsider, but how to critique the insider's consensus when that consensus defines certain beings as outside the moral community. If a community's vocabulary renders the suffering of a specific group invisible—categorizing it as natural, deserved, or simply non-existent—the neopragmatist account of justification hits a wall. Justification is a matter of social practice, but what if the social practice is the exclusion? To say that the new vocabulary is "better" because it reduces suffering presupposes that suffering is a bad thing that ought to be reduced. But if the dominant vocabulary denies the moral relevance of that suffering, the neopragmatist cannot appeal to the "fact" of suffering as a trump card without violating antirepresentationalism. To claim that the suffering is *really* there and *really* bad, regardless of the community's description, looks suspiciously like appealing to a mind-independent moral reality.

  This leads to the charge that neopragmatism smuggles in a naturalistic or representationalist standard. Rorty frequently asserts that cruelty is the worst thing we do. He treats the capacity for suffering and humiliation as a shared biological and psychological fact that grounds the possibility of solidarity. Yet, if truth is not correspondence, on what basis is this claim made? If it is merely a preference of liberal intellectuals, it lacks normative force against a community that values honor, purity, or obedience over the avoidance of pain. If, however, it is a claim about the nature of human beings—that we are creatures who can be hurt and that this hurt matters objectively—then the neopragmatist has reintroduced the very representationalism they sought to abolish. They are representing the human condition as essentially vulnerable. Without this anchor, the move from an exclusionary vocabulary to an inclusionary one is merely a change in taste. It becomes impossible to distinguish between a vocabulary that liberates and one that merely flatters a new audience. The distinction between moral progress and fashion becomes blurred.

  Furthermore, there is a crucial distinction between a vocabulary that alters our feelings about a practice and one that changes what we are entitled to recognize as harm. Neopragmatism tends to aestheticize ethics, treating moral advancement as a shift in sentiment. We come to *feel* differently about women or racial minorities because we have read new novels or heard new descriptions. But moral progress feels like recognition, not just mood alteration. When we say that slavery was always wrong, even when the community believed it was right, we are claiming that the old vocabulary failed to track a normative reality. The neopragmatist must say that slavery was not wrong until we made it wrong by agreeing it was. This creates a paradox for the concept of entitlement. If I am entitled to not be harmed, that entitlement should exist prior to your recognition of it. If my entitlement depends on your ability to be persuaded by a redescription, then my status is contingent on your imagination. This renders the victim's claim to justice parasitic on the oppressor's aesthetic sensitivity. A robust account of moral progress requires that the new vocabulary reveals harms that were always there, waiting to be acknowledged, not harms that are created by the acknowledgment.

  The appeal to irony and hope does not resolve this tension. Irony—the awareness of the contingency of one's final vocabulary—is a private virtue, but politics requires public conviction. If the liberal ironist knows their commitment to human rights is just a historical accident, their resolve may weaken when confronted with a non-ironic fundamentalist who is certain of their righteousness. Hope, in this context, becomes a wager that our liberal values will win out, but a wager is not an argument. If the neopragmatist admits that their values are not "truer" than the fascist's, only "better for us," they concede that the conflict cannot be resolved by reason, only by power or luck. This leaves the neopragmatist unable to condemn a community that is happy, cohesive, and cruel, provided that community is consistent within its own vocabulary. The charge that such a community is "missing something" implies a standard of human flourishing that exists independently of their description of it.

  Therefore, the neopragmatist account of moral progress cannot be coherently reconstructed without revising its strict antirepresentationalism. The attempt to ground ethics solely in solidarity and redescription fails because solidarity is often the problem, not the solution. To account for the normative force of moral criticism, one must admit that there are constraints on inquiry and practice that come from the world, not just from our peers. Specifically, the reality of human vulnerability functions as a normative constraint. While we may not need to posit a Platonic form of "The Good," we must acknowledge that human beings have a nature that makes certain treatments destructive to their agency and flourishing, regardless of the vocabulary used to describe them.

  This does not require a return to full-blown moral realism or a correspondence theory of truth in the traditional sense. It requires a weak naturalism. We can maintain that moral vocabularies are tools and that truth is made rather than found, while simultaneously acknowledging that some tools break when applied to the grain of human nature. Suffering is not just a description; it is a recalcitrant fact. A vocabulary that denies the suffering it causes is not just "different"; it is functionally defective because it fails to cope with the reality of human pain. By revising antirepresentationalism to allow for a representational relationship between language and human vulnerability, we can distinguish between rhetorical change and liberating change. Liberating change is that which aligns our practices with the actual conditions of human agency and reduces the friction of unnecessary pain.

  In conclusion, Rorty's neopragmatism offers a powerful critique of foundationalism but ultimately sacrifices the normative teeth required for radical moral criticism. By reducing justification to solidarity and truth to utility within a community, it leaves no room to condemn a community that finds utility in exclusion. The attempt to avoid smuggling in naturalistic standards fails because the condemnation of cruelty inevitably relies on a claim about the universal badness of suffering, which functions as a mind-independent standard. To save the moral urgency of the pragmatist project, one must abandon the purity of the antirepresentationalist stance. We must accept that while our moral concepts are contingent constructions, they are answerable to a reality of human need and vulnerability that we do not construct. Moral progress is not just expanding the "we"; it is correcting our descriptions to fit the harms we inflict. Without this revision, neopragmatism remains a philosophy for the already converted, unable to speak truth to power when power is secure in its own language.
