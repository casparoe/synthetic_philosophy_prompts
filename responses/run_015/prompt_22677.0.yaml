      *   **Mathematical/Logical Consequence of Correlation:**
          *   If voters are perfectly correlated (copying one leader), $N$ voters = 1 voter. Adding more people adds no new information.
          *   If voters are partially correlated, the effective group size is smaller than the actual group size.
          *   The limit is no longer 1. It converges to something less than 1 (depending on the correlation strength).

      *   **Information Pooling vs. Independent Voting:**
