  # ADVERSARIAL COLLABORATION PROTOCOL: REALISM AND THE HISTORICAL RECORD

  **Parties:** Dana (Proponent of Structural/Selective Realism) vs. Ivo (Proponent of Pessimistic Meta-Induction)
  **Facilitator:** Reading Group Coordination
  **Date:** [Current Date]

  ## I. AGREED CLAIMS

  Both parties affirm the following propositions as the baseline for this collaboration. These claims are phrased to capture the force of each argument without conceding the final ontological verdict.

  1.  **The Burden of Explanation:** The empirical success of mature scientific theories (novel prediction, instrumental control) is non-trivial and requires explanation. It is not acceptable to dismiss success as mere luck without a positive account of the generating mechanism.
  2.  **The Fact of Turnover:** The history of science contains numerous cases where theories with high empirical success posited specific entities or mechanisms that are no longer accepted as literally existent by the current scientific community (e.g., caloric, luminiferous ether).
  3.  **The Asymmetry of Retention:** When theories are superseded, formal and structural elements (equations, symmetries, quantitative relations) persist with significantly higher frequency than ontological interpretations (the nature of the substance, the mechanism of action). Both parties agree this persistence is a data point that must be modeled.
  4.  **The Reference Class Problem:** Any inductive argument regarding the fate of current posits depends on the construction of a reference class of past posits. The validity of the induction depends on whether the class is defined by *empirical maturity* at the time or by *retrospective survival*.
  5.  **The Condition for Induction:** For the Pessimistic Meta-Induction to license a high credence that current posits are false, it must be shown that the past posits were genuinely analogous to current posits in terms of epistemic support, and that their rejection was due to falsity rather than refinement or reduction.
  6.  **The Condition for Realism:** For Scientific Realism to be warranted, it must be shown that the success of the theory counterfactually depends on the approximate correctness of its core posits, rather than on incidental features or mathematical bookkeeping that would yield the same predictions under a different ontology.

  ## II. RESIDUAL DISAGREEMENTS AND CRUXES

  The following table isolates the specific points of contention. For each, we identify the crux, the method for resolution, and the specific predictions each party makes.

  | Disagreement | Crux (What must be settled) | Agreed Test / Argument | Dana's Prediction (Structural Realist) | Ivo's Prediction (PMI Proponent) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Hazard Function** | Is the probability of a posit being eliminated constant over time, or does it decrease as the posit survives longer? | **Blind Survival Analysis:** We will compile a list of 50 posits from 1850–1900 that were considered "well-confirmed" at the time. We will code their current status (Retained, Reduced, Eliminated) using blind raters. We will fit a hazard curve to the time-to-elimination data. | **Decreasing Hazard:** The data will show a survival curve where the hazard rate drops significantly after the first 20 years. Posits surviving >50 years will have a <5% chance of elimination in the next decade. | **Constant/Biased Hazard:** The data will show a constant hazard rate, or the "survivors" will be revealed as cases where the *name* survived but the *content* changed (survivorship bias in the coding). |
  | **2. Grading "Elimination"** | Does a change in the conceptual nature of a posit count as elimination, or is it retention via refinement? | **The Reduction Case Study:** We will analyze the transition from "Classical Atom" to "Quantum Field Excitation." We will apply a pre-agreed rubric: Is elimination scored if the *causal role* is preserved but the *intrinsic nature* is changed? | **Retention:** If the causal role and mathematical relations are preserved, the posit is "Retained/Refined." This counts as a point for realism. | **Elimination:** If the intrinsic nature (e.g., hard sphere vs. probability cloud) is fundamentally different, the original posit is "Eliminated." This counts as a point for PMI. |
  | **3. Counterfactual Sensitivity** | Was the historical theory's success *sensitive* to the truth of the posit, or would the math have worked even if the ontology were false? | **The Reconstruction Test:** For a specific historical case (e.g., Fresnel's Ether), we will attempt to derive the successful predictions using *only* the structural relations, explicitly denying the ontological posit. | **Sensitivity:** The derivation will fail or become ad hoc without the ontological commitment. The posit was doing work, not just bookkeeping. | **Insensitivity:** The derivation will succeed using only the structural math. The ontology was a "wheel that turns nothing"; the success was independent of the truth of the posit. |
  | **4. Forward-Looking Bets** | Which current posits are likely to be regarded as "false" in 50 years? | **The 2070 Forecast:** We will each select 5 current high-confidence posits (e.g., Dark Matter, Quarks, Neural Correlates of Consciousness). We will bet on their status in 2070. | **Structural Survival:** I bet that the *mathematical relations* governing these posits will remain, even if the ontology is refined. (e.g., "Dark Matter" might be renamed, but the gravitational anomaly remains real). | **Ontological Elimination:** I bet that at least 3 of these will be discarded as entities entirely, replaced by a framework that does not require them (e.g., Modified Gravity replaces Dark Matter). |
  | **5. Verbal Disputes** | Are we disagreeing about the world, or about the definition of "Real" and "True"? | **The Taboo Check:** We will attempt to state our conclusions without using the words "true," "real," "approximate," or "fiction." | **Claim:** Current theories will continue to yield successful interventions and their structures will map onto future structures. | **Claim:** Current theories will be replaced by frameworks that render current entity-talk obsolete, regardless of intervention success. |

  ## III. VERBAL DISPUTE DIAGNOSIS

  We acknowledge that a portion of our disagreement may be verbal rather than substantive. Specifically:

  1.  **"Approximate Truth":** Dana uses this to mean "structural isomorphism with future theory." Ivo uses this to mean "literal correspondence of entities." If we taboo "truth" and speak only of "structural mapping" vs. "entity correspondence," the disagreement shrinks.
  2.  **"Belief":** Dana treats "belief in a posit" as "commitment to the stability of the relations." Ivo treats it as "commitment to the existence of the object."
  3.  **Resolution Protocol:** If the Blind Survival Analysis (Disagreement 1) shows a decreasing hazard, but Ivo maintains that the "survivors" are merely linguistic holdovers (Disagreement 2), we will treat this as a substantive disagreement about *what constitutes a posit*, not a verbal dispute. We will resolve this by the Reconstruction Test (Disagreement 3). If the math works without the ontology, Ivo wins the point; if it fails, Dana wins the point.

  ## IV. COMMITMENT TO OUTCOME

  Both parties agree to update their credences in Scientific Realism vs. Anti-Realism based on the results of the tests above.
  *   **Dana** agrees to lower her credence in Realism if the Hazard Function is found to be constant or if the Reconstruction Test shows historical success was insensitive to ontology.
  *   **Ivo** agrees to lower his credence in PMI if the Hazard Function is strongly decreasing and the Forward-Looking Bets favor structural retention over ontological elimination.

