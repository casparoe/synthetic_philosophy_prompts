      *   *Claim 2 (Meta-Induction):* Both agree history shows ontology changes. Dana agrees ontology is unstable; Ivo agrees success doesn't guarantee ontological stability.
      *   *Claim 3 (Structure):* Both agree equations/relations persist better than entities. Ivo calls it "instrumental continuity"; Dana calls it "structural truth." Need neutral phrasing: "formal continuity."
      *   *Claim 4 (Historical Record):* Both agree the record is incomplete and theory-laden. We need a standard for what counts as "elimination."

      *Refining the phrasing:* Avoid "truth" where possible, or qualify it. Use "posits," "commitments," "empirical adequacy."
      *   *Drafting Claim 1:* Scientific success is non-trivial.
