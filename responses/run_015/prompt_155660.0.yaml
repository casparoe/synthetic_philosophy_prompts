  # TRANQUILIST TAXONOMY: DECISION PROTOCOL

  **Objective:** Classify ethical positions within the logical space of tranquilism using four diagnostic splits.
  **Constraint:** Maximize conceptual precision without reliance on historical labels.
  **Output:** Decision tree structure, terminal leaf classification, and ambiguity analysis.

  ---

  ## I. DECISION NODES

  Respondents must traverse the following four nodes sequentially. Each node presents a concrete case followed by a binary choice. Record the path (e.g., 1A-2B-3A-4B) to determine the terminal leaf.

  ### Node 1: The Phenomenology of Value
  **Case:** Consider a being in a state of permanent anhedonia. It is free of pain and free of desire, but it reports no content, pleasure, or sense of peace whatsoever.
  **Question:** Does this state fully realize the intrinsic good, or is a positive quality of experience missing?
  *   **Branch A (Privative):** The state fully realizes the good. (Absence is sufficient.)
  *   **Branch B (Positive):** A positive quality is missing. (Peace/Release is required.)

  ### Node 2: The Status of Meta-Craving
  **Case:** Consider a practitioner who takes a compound to eliminate craving. The act of taking the compound is driven by a desire for relief, but the resulting state is craving-free.
  **Question:** Is the resulting state as tranquilist-valuable as a natural cessation of desire, or is it undermined by the desire-driven means?
  *   **Branch A (Instrumental):** It is equally valuable. (Means are permissible tools.)
  *   **Branch B (Purity):** It is less valuable. (Means must not violate the end state.)

  ### Node 3: The Scope of Moral Concern
  **Case:** Consider an engineered ecosystem of simple organisms that avoid noxious stimuli but show no evidence of awareness or consciousness.
  **Question:** Do these systems have a tranquilist interest (i.e., does their stimulus-avoidance matter intrinsically)?
  *   **Branch A (Functional):** Yes. (Functional avoidance is sufficient.)
  *   **Branch B (Consciousness):** No. (Phenomenal consciousness is required.)

  ### Node 4: The Obligation of Intervention
  **Case:** Consider a program that eliminates wild-animal predation but requires constant human monitoring that generates stress and craving in the monitors.
  **Question:** Is suppressing wild-animal suffering obligatory in this case?
  *   **Branch A (Obligatory):** Yes. (Suffering reduction overrides monitor stress.)
  *   **Branch B (Constrained):** No. (Intervention is forbidden or indifferent.)

  ---

  ## II. TERMINAL LEAVES (CLASSIFICATION)

  There are 16 possible paths. Positions are named where they map to recognizable ethical stances; otherwise, they are marked **UNNAMED** with a diagnostic note.

  | Path | Node 1 | Node 2 | Node 3 | Node 4 | Classification | Diagnosis / Note |
