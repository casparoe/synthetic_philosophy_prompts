answer: |-
  ### 1. Sequence and Dependencies

  **Minutes 0–10: The Anti-Realist Motivation (The Setup)**
  *   **Dependency:** The derivation has *no* force unless the **Knowability Principle (KP)** is initially plausible. If students view KP as obviously false from the start, Fitch is merely a *reductio* of a straw man.
  *   **Action:** Do not begin with logic. Begin with verificationism. Elicit the intuition that "truth cannot radically outrun evidence."
  *   **Threshold:** You need enough motivation on the table to make KP ($\forall p (p \to \Diamond Kp)$) feel like a reasonable constraint on truth, not a logical axiom. Stop before you defend it dogmatically; just establish it as the target thesis.
  *   **Transition:** "If KP is true, what does it imply about the *actual* distribution of knowledge?"

  **Minutes 10–35: The Derivation (The Engine)**
  *   **Order of Operations:**
      1.  **Non-Omniscience:** Assert there is at least one truth we do not know. (If you deny this, you are an omniscient being; game over).
      2.  **Existential Instantiation:** Let $p$ be *that* truth. (This is the flashpoint for CS students; see Misconceptions below).
      3.  **The Conjunction:** Consider the proposition $q = (p \land \neg Kp)$.
      4.  **Apply KP:** If $q$ is true, it must be knowable ($\Diamond Kq$).
      5.  **Elicit Assumptions:** Do *not* state factivity and closure up front. Wait until you expand $K(p \land \neg Kp)$.
          *   Ask: "If I know a conjunction, do I know the conjuncts?" (Elicits **Closure**).
          *   Ask: "If I know $p$, can $p$ be false?" (Elicits **Factivity**).
      6.  **The Contradiction:** Show that $K(p \land \neg Kp)$ entails $(Kp \land \neg Kp)$, which is impossible.
      7.  **The Result:** Since $q$ cannot be known, and KP says all truths can be known, $q$ cannot be true. Therefore, there are no unknown truths.

  **Minutes 35–45: The Aftermath (Damage Control)**
  *   **Dependency:** The logical result is now on the table. Now you must interpret what broke.
  *   **Action:** Map the misconceptions (see below) to the specific steps where they arise.

  **Minutes 45–50: Conclusion & Exclusions**
  *   **Action:** Final question and verdict on what was left out.

  ---

  ### 2. The One Example

  **The Proposition:** "The exact number of words in the printed copy of *Kant's Critique of Pure Reason* currently in the university library."

  *   **Why this works:**
      *   **Unknown in fact:** No one has counted it (plausible grant).
      *   **Knowable in principle:** It is a finite, physical object; counting is a decidable procedure. It satisfies the verificationist's KP.
      *   **Not essentially unknowable:** Unlike "the position of this electron" (which might import physics debates) or "the number I am thinking of" (which is indexical/ephemeral), this fact is stable and accessible.
      *   **Not self-referential:** It does not refer to its own knowability status.
      *   **Carries the derivation:** Let $p$ = "The word count is $N$."
          *   We assume $p$ is true and $\neg Kp$ (we don't know $N$).
          *   We test if $(p \land \neg Kp)$ is knowable.
          *   The derivation shows that while $p$ is knowable, the *state of affairs* "$p$ is true but unknown" is logically barred from being known.

  ---

  ### 3. Misconceptions Mapped to Sequence

  **1. The CS/Quantifier Objection**
  *   **The Misconception:** "The derivation requires us to have *identified* the unknown truth $p$. If we could identify it, we would know it, so the premise is incoherent."
  *   **When to Head Off:** **Minute 15**, immediately after Existential Instantiation (moving from $\exists p$ to specific $p$).
  *   **The Fix:** Clarify that this is a *reductio*, not a constructive proof. We are not claiming we can *find* $p$ in the wild. We are saying: "Assume for the sake of argument that the set of unknown truths is non-empty. Pick an arbitrary member. Let's see what happens." The logic holds even if we cannot point to the specific member. The contradiction proves the set was empty to begin with.

  **2. Moore's Paradox / Surprise Examination**
  *   **The Misconception:** "This is just Moore's Paradox ($p \land \neg Kp$) or the Surprise Exam. It's about belief, not truth."
  *   **When to Head Off:** **Minute 30**, when deriving the contradiction from $K(p \land \neg Kp)$.
  *   **The Fix:** Distinguish the *truth* of the conjunction from the *knowledge* of it. Moore's paradox is that asserting $(p \land \neg Kp)$ is absurd. Fitch's point is stronger: $(p \land \neg Kp)$ can be *true* (classically), but it cannot be *known*. The paradox arises only when we add KP (all truths are knowable). Without KP, there is no paradox, just an unknown truth.

  **3. "It Proves There Are Unknowable Truths"**
  *   **The Misconception:** "Fitch shows that some truths are inherently unknowable."
  *   **When to Head Off:** **Minute 35**, upon concluding the derivation.
  *   **The Fix:** Correct the modal scope. The proof shows: If KP is true, there are *no* unknown truths (Omniscience). If there *are* unknown truths (Non-Omniscience), KP is false. It does not prove some truths are unknowable; it proves that **Truth** and **Knowability** cannot be linked as the verificationist hopes *if* we are not omniscient.

  **4. "It Refutes Realism"**
  *   **The Misconception:** "This proves the Realist right and the Anti-Realist wrong."
  *   **When to Head Off:** **Minute 40**, during the interpretation phase.
  *   **The Fix:** Explain that Realists are happy to deny KP. They believe truth outruns knowledge. Fitch is a *problem for the Anti-Realist*, not a victory for the Realist. It forces the Anti-Realist to choose: abandon verificationism or abandon classical logic.

  ---

  ### 4. The Final Question

  Do not ask: *"Are there unknowable truths?"* (This tests their metaphysics, not the lesson).
  Do not ask: *"Is the argument valid?"* (This tests logic, not epistemology).

  **Ask this:**
  > "If you are a verificationist who wants to keep the idea that 'truth is constrained by what we can know,' which specific step in today's derivation must you reject, and what does rejecting it cost you?"

  *   **Why:** This tests if they understand that the *logic* is valid, the *premises* are the target, and specifically that **KP** (or classical logic) is the casualty, not the existence of unknown truths. It forces them to locate the philosophical pressure point.

  ---

  ### 5. Verdict on Exclusions (Intuitionism & Restricted KP)

  **Your Instinct:** Pass over intuitionistic and restricted-knowability responses in silence.
  **Verdict:** **Do not remain silent, but do not teach them.**

  *   **The Risk:** If you end the class saying "Therefore, Verificationism is impossible," you have taught a falsehood. Sophisticated anti-realists (like Dummett) reject the classical logic used in the derivation (specifically Double Negation Elimination) or restrict KP to specific classes of statements.
  *   **The Distortion:** Silence makes the result look like a decisive refutation of anti-realism *simpliciter*. It is actually a refutation of *Classical Anti-Realism with Unrestricted KP*.
  *   **The Fix:** In the final 2 minutes, explicitly state: *"We used classical logic and an unrestricted Knowability Principle today. There are ways out—changing the logic to intuitionistic, or restricting which truths fall under KP—but those require tools we don't have time for. Know that the paradox is not a death knell for verificationism, but a demand that it be more precise."*
  *   **Why:** This preserves intellectual honesty without consuming the 50 minutes. It signals to the CS students that the logic is contingent on the system used, and signals to the first-years that the philosophical debate is ongoing.
