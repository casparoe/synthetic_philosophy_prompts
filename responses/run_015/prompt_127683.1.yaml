prompt: |-
  ok so i've been having these weird lucid dreams lately where i can actually move my eyes on purpose and it made me go back to Malcolm vs Dennett on whether dreams are experiences at all. here's roughly where i stand and i need to know if its coherent: (1) i buy Malcolm's point that during normal sleep there's no behavoral criterion so we shouldn't say there's an experience happening then; (2) i also think Dennett's cassette idea is mostly right for ordinary dreams, like the narrative gets loaded when you wake up; (3) but in lucid dreams there IS a motor signal (the eye movements) so that counts as a criteron and means there's real experiential content going on; (4) i also think phenomenal consciousness always needs at least some access consciousness, not the other way around. do these hang together? specifically does (3) break (1) by showing there can be criteria during sleep, and does (2) conflict with (3) since cassette loading shouldn't allow real-time signaling? also is (4) compatible with Malcolm's skepticism or does it push me toward saying ordinary dreams are still experiences just inaccessible? rank the tensions by severity, especially whether i'm smuggling in Dennett for ordinary cases and Malcolm for lucid ones without a principaled split.
