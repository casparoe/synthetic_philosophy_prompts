          *   *Why it splits:* Residential Schools precedent says "Cultural/Biological ambiguity = No." But Convention Article II(c) says preventing births *is* genocide. Does the board accept biological destruction without immediate mortality? (Holodomor suggests yes, Residential Schools suggests no).

      *   *Selection:* The prompt specifically suggests: "explicit intent with purely economic means, or direct violence against a group outside Lemkin's protected categories." I should choose one of these or a hybrid that tests the *Holodomor* vs. *Residential Schools* tension.
