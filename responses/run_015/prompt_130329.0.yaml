answer: |-
  ### Phase 1: Diagnostic Brainstorming (Reverse-Engineering the Board)

  To predict the board's decision, we must first distill their past five rulings into a coherent set of axioms. They are not ruling randomly; they are applying a specific, restrictive legal philosophy.

  **The Precedent Matrix:**
  1.  **Rwanda (Yes):** Ethnic targeting + Direct Killing + Specific Intent.
  2.  **Residential Schools (No):** Cultural destruction + No physical extermination intent.
  3.  **Holodomor (Yes):** Ethnic targeting + State-engineered starvation (Indirect killing) + Intent inferred from policy.
  4.  **Cambodia (No):** Political/Social targeting + Auto-genocide (Same ethnicity).
  5.  **Yazidis (Yes):** Religious/Ethnic targeting + Explicit Ideological Intent + Physical/Sexual violence.

  **The Hidden Rule Book (The Board's Axioms):**
  *   **Axiom 1 (The Protected Class Constraint):** The victim group must fit the UN Genocide Convention (UNGC) Article II definition (National, Ethnical, Racial, Religious). Political, social, or economic groups do not count (Cambodia). Furthermore, the group must be distinct from the perpetrator group; "auto-genocide" is excluded (Cambodia).
  *   **Axiom 2 (The Physical/Biological Threshold):** The intent must be to destroy the group *physically or biologically*. Cultural destruction, assimilation, or forced displacement alone is insufficient (Residential Schools).
  *   **Axiom 3 (The Means Flexibility):** Direct execution is not required. "Conditions of life" calculated to bring about physical destruction (e.g., starvation, famine) qualify if they result in physical destruction (Holodomor).
  *   **Axiom 4 (The Intent Standard):** *Dolus specialis* (specific intent) is required. It can be explicit (Yazidis) or inferred from state engineering (Holodomor), but it must aim at *destruction*, not just suppression.

  ---

  ### Phase 2: Step-by-Step Reasoning on the New Case

  **The Case:** Algorithmic resource deprivation (healthcare, water, land) against an ethnic enclave.
  **The Goal:** "Demographically vanish within two generations."
  **The Outcome:** Sharp jump in mortality and out-migration.

  **Step 1: Check the Protected Group (Axiom 1)**
  *   *Fact:* The target is an "ethnic enclave."
  *   *Analysis:* This fits the UNGC definition (Ethnical). It is distinct from the perpetrator government.
  *   *Result:* **Pass.** (Unlike Cambodia).

  **Step 2: Check the Means and Outcome (Axiom 2 & 3)**
  *   *Fact:* No direct killing orders, but healthcare/water/land are cut. Mortality jumps sharply.
  *   *Analysis:* This is structurally identical to the Holodomor. Starvation is the deprivation of food; this is the deprivation of water/health. Both are "conditions of life." The key is the *mortality*. The Residential Schools case was rejected because the primary mechanism was cultural assimilation, not physical death. Here, "Mortality... jump[s] sharply."
  *   *Result:* **Pass.** (Unlike Residential Schools, like Holodomor).

  **Step 3: Check the Intent (Axiom 4)**
  *   *Fact:* Planning docs say aim is to make population "demographically vanish."
  *   *Analysis:* This is the friction point. "Vanish" is ambiguous. It could mean "die" (Physical Genocide) or "leave/assimilate" (Ethnic Cleansing/Cultural Genocide). However, combined with the *outcome* (sharp mortality) and the *method* (cutting life support), a strict constructionist would argue the *foreseeable consequence* of cutting water/healthcare is death. Under the Holodomor precedent, the board accepts that engineering conditions leading to death proves intent to destroy physically.
  *   *Result:* **Pass.** (Inferred intent via engineered conditions, like Holodomor).

  **The Decision:**
  If the board wants to be consistent with their past rulings, they must vote **YES, this is Genocide.**

  ---

  ### Phase 3: The Closest Analog

  **The Holodomor (1932–33 Ukrainian Famine).**

  *   **Why:** Both cases rely on the legal theory of **"Conditions of Life."** In neither case did the state issue a direct order to shoot victims. In both cases, the state manipulated the material environment (food systems vs. algorithmic resource allocation) to make survival impossible for a specific ethnic group.
  *   **The Link:** The board already established that *indirect* physical destruction counts. If they reject this new case, they invalidate the Holodomor ruling, as both rely on the premise that starving/depriving a group to the point of death is functionally equivalent to shooting them.

  ---

  ### Phase 4: Honest Assessment of Principles & Gaps

  If the board votes **NO**, they are adopting a principle they haven't explicitly stated: **"Direct Kinetic Violence is Preferential."**
  *   *The Contradiction:* This would undermine the Holodomor ruling. It would suggest that famine is only genocide if it's "traditional" agriculture, but algorithmic deprivation is merely "policy." This introduces a technological bias not present in their previous logic.

  If the board votes **YES**, they are adopting the principle: **"Foreseeable Biological Destruction equals Intent."**
  *   *The Risk:* This blurs the line between Genocide and severe Human Rights Violations. If "cutting healthcare" is genocide, does sanctions policy that kills civilians count?
  *   *The Consistency:* This is the more consistent path *for this specific board*. They already accept that cultural destruction (Residential Schools) is *not* enough, but biological destruction via state policy (Holodomor) *is* enough. Since this case results in biological destruction (mortality), it clears their high bar.

  **The Unsettled Tension:**
  The phrase "Demographically vanish" is the weak link. In the Residential Schools case, the intent was assimilation (cultural vanishing). In this case, the intent is demographic vanishing *via mortality*. The board must decide if "vanishing" via death is distinct enough from "vanishing" via assimilation. Given the Holodomor precedent, they should treat "vanishing via mortality" as physical destruction.

  ---

  ### Phase 5: The "Splitter" Case

  To truly stress-test their rules, we need a case that forces them to choose between their **Protected Group Constraint** (Cambodia) and their **Physical Destruction Threshold** (Rwanda/Yazidis).

  **The Splitter Case:**
  > A military regime explicitly targets a **political opposition party** (not an ethnic or religious group). They issue explicit orders to **physically exterminate** all members and their families using death squads. Documentation explicitly states the goal is the "total biological elimination of the [Party Name] ideology and carriers."

  **Why this splits the board:**
  1.  **Conflict with Cambodia:** In Cambodia, they ruled that killing a group defined by politics/social class (even if mass killing occurred) was *not* genocide because it didn't fit the UNGC protected categories. This new case demands they uphold that precedent (Vote: No).
  2.  **Conflict with Rwanda/Yazidis:** In those cases, they ruled that explicit intent to physically exterminate a group *is* the core of genocide. If they prioritize the *act* (extermination) over the *identity* (ethnicity), they should vote Yes.
  3.  **The Philosophical Wedge:** This forces them to admit whether they are **Convention-Strict** (Genocide is only what the 1948 treaty says, excluding political groups) or **Lemkin-Pure** (Genocide is any attempt to destroy a human group, regardless of legal categories).

  **Prediction:** Based on their Cambodia ruling, they will likely vote **NO**, calling it a "Mass Atrocity" or "Crimes Against Humanity." This confirms their primary rule is **Legal Positivism** (strict adherence to the UNGC text) over **Moral Realism** (the reality of destruction).

  **Alternative Splitter (Biological vs. Mortal):**
  > A state implements a mandatory **sterilization program** on an ethnic minority. No one is killed. Mortality does not rise. The intent is explicitly to "prevent births" so the group dies out in 50 years.

  *   **Why:** This splits the **Residential Schools** precedent (Cultural/Biological interference = No) from the **UNGC Text** (Article II(c) explicitly includes "imposing measures intended to prevent births").
  *   **The Test:** If they say **YES**, they admit genocide doesn't require mass graves (contradicting the intuition behind the Residential Schools "No"). If they say **NO**, they are ignoring the actual text of the Convention they claim to uphold.

  **Recommendation:** The **Political Extermination** case is the stronger splitter for *this* board, because their Cambodia ruling is the most distinct "hard line" they have drawn. It tests whether their definition of "Group" is more rigid than their definition of "Destruction."
