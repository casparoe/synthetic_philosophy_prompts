answer: |-
  This is a sharp application of the theory. You have identified exactly where the rubber meets the road: the difference between discovering what nature dictates (H2O) and deciding what our rules will be (IAU vote). Here is the analysis of the Pluto case through the lens of externalist semantics.

  ### 1. Truth Values, Experts, and the Vote

  If strict Environmental Externalism (Putnam's original Twin Earth model) is right, the answer depends entirely on whether "planet" is a **natural kind term** like "water" or a **functional/stipulative term** like "chair."

  *   **The "Whale" Scenario (Always False):** If "planet" picks out a natural kind with a hidden essence (e.g., a specific formation process or gravitational signature independent of human classification), then the IAU vote was merely a discovery. In this view, Pluto *never* had the essence of "planet-ness," even if we thought it did. "Pluto is a planet" was always false, just as "Whales are fish" was always false before we understood biology. The vote just updated our epistemic access to the fixed reference.
  *   **The "Legislative" Scenario (True then, False now):** If "planet" is a category defined by criteria we set (like "bachelor" or "continent"), then the IAU vote changed the meaning. In 1990, the term "planet" referred to *anything large and round orbiting the sun*. In 2006, the term "planet" referred to *anything large, round, orbiting the sun, AND clearing its neighborhood*. On this view, the sentence "Pluto is a planet" was true in 1990 and is false now. The reference shifted because the rules shifted.

  **Who fixes the reference?**
  Externalism relies heavily on the **Division of Linguistic Labor**. You (the layperson) defer to the experts (planetary scientists/IAU).
  *   If the experts in 1990 were using a description that included Pluto, your word referred to Pluto.
  *   If the experts in 2006 voted to exclude Pluto, your word now excludes Pluto.
  *   **The Vote:** This is the problem for strict Environmental Externalism. In the Twin Earth case, nature fixes the reference (H2O vs. XYZ). In the Pluto case, a **committee vote** fixed the reference. The theory commits you to saying that if the experts change the criteria, the reference changes, *even if the physical object remains identical*. This implies the reference is fixed by **us** (the linguistic community's norms), not by **nature** (the physical properties of the ice ball).

  ### 2. Environmental vs. Social Externalism (The Counterfactual)

  This is where the Pluto case drives a massive wedge between the two types of externalism. Let's run the counterfactual: The IAU votes to keep Pluto as a planet. The physical universe is identical.

  *   **Environmental Externalism (Putnam):** This theory predicts the meaning **stays the same**. Why? Because the extension is determined by the physical stuff out there and its causal relationship to us. Since the rocks, orbits, and gravity are identical in both worlds, the natural kind "planet" picks out the same objects. The vote is irrelevant noise. If "planet" is like "water," a vote cannot change what water is. Environmental externalism predicts that in the counterfactual world where they vote to keep Pluto, they are simply *wrong* about the meaning of the word, just as Twin Earthlings are wrong to call XYZ "water."
  *   **Social Externalism (Burge):** This theory predicts the meaning **changes**. Burge's "Arthritis" case argues that what you mean depends on the normative standards of your community. If the community of experts (the IAU) establishes a norm that "planet" includes Pluto, then the term refers to Pluto. If they establish a norm that it doesn't, it doesn't. The physical environment is irrelevant; the social environment is decisive.

  **The Verdict:**
  The Pluto case supports **Social Externalism** and creates tension for Environmental Externalism.
  Intuitively, if the IAU had voted the other way, "Pluto is a planet" would be true today. But since the physical facts are identical to the actual world (where it is false), the truth value changed without a physical change. Environmental externalism cannot easily explain how the extension changes without a change in the physical nature of the kind. Social externalism explains it perfectly: the norms changed, so the meaning changed.

  ### 3. Natural Kind vs. Convenience (Jade/Whales vs. Pluto)

  You are right to spot the difference. The Jade and Whale cases were **discoveries of underlying structure**. We thought jade was one mineral; nature told us it was two (jadeite/nephrite). We thought whales were fish; biology told us they were mammals. The world forced the language to change.

  The Pluto case is **not** that kind of case.
  *   No new physical data about Pluto emerged in 2006 that wasn't available in 1990.
  *   The change was driven by the discovery of *other* objects (Eris, etc.) and a desire to avoid having 40+ planets.
  *   The criterion "clearing the neighborhood" is not a hidden microstructure; it is a relational, dynamical property that is partly defined by what *other* objects exist and partly by a threshold we chose.

  **What this tells us about "Planet":**
  "Planet" is likely **not a natural kind term** in the Putnam sense. It is a **theoretical kind** or a **conventional category**.
  *   **Implication for Externalism:** Putnam's externalist argument is strongest for natural kinds (water, gold, tiger). It argues that descriptions in our head fail to capture the essence. But if "planet" has no hidden essence other than the criteria we stipulate, then **Descriptivism** (the theory externalism was meant to kill) might actually be right for this term. The meaning of "planet" *just is* the list of criteria (orbit sun, round, clear neighborhood). If we change the list, we change the meaning.
  *   **The Externalist Argument:** If "planet" isn't a natural kind, the Twin Earth argument loses its grip here. It suggests externalism is not a universal theory of meaning, but a specific theory about natural kind terms. For artifacts or conventional categories, social agreement (or even internal descriptions) might fix reference, not the environment.

  ### 4. The Honest Verdict

  Does this case confirm, embarrass, or silence externalism?

  **It embarrasses strict Environmental Externalism and exposes a silence in the general theory.**

  *   **Why it embarrasses Environmental Externalism:** If externalism claims that reference is fixed by the physical environment, the Pluto case shows that reference can be fixed by a show of hands. The physical extension of "planet" changed (Pluto went in/out) without the physical nature of Pluto changing. This violates the core Twin Earth intuition that "meanings ain't in the head" but implies "meanings ain't in the rocks either"—they are in the bylaws.
  *   **Where it goes silent:** The original externalist framework (1970s Putnam) assumes reference is fixed by an initial "baptism" and passed down a causal chain. It does not have a mechanism for **institutional re-baptism**. It doesn't explain how a vote in 2006 retroactively alters the causal chain of a word used in 1990. The theory has nothing to say about *stipulative revision*. It assumes we are trying to track a pre-existing kind. When we are *creating* the kind by voting, the theory's machinery for "tracking nature" grinds to a halt.

  **Conclusion:**
  The Pluto case shows that Externalism is not a monolith.
  1.  **Social Externalism** survives intact (meaning changed because norms changed).
  2.  **Environmental Externalism** struggles (meaning changed without physical change).
  3.  **The Theory of Natural Kinds** is forced to admit that "planet" is not one of them.

  If you hold that "meanings are fixed by the environment," the Pluto demotion is a counter-example. The environment stayed still; the meaning moved. This suggests that for a huge class of terms (scientific classifications, social categories, legal definitions), reference is fixed by **community agreement**, not physical essence. Externalism is right that it's not just "in your head," but it's wrong if it thinks that means it must be "in the rocks." Sometimes, it's in the minutes of the meeting.
