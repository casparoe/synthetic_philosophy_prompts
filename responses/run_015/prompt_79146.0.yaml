      *   **User's Stance:** Understands Twin Earth (reference fixed by environment, not head). Understands the Pluto facts (IAU vote, 3 criteria, Pluto fails "clearing the neighborhood", expert disagreement, vote motivation included textbook convenience).
      *   **Task:** Analyze the Pluto case through the lens of externalist theory of meaning, addressing four specific questions/prompts.
      *   **Constraints:** No reading lists, no paper names. Focus on the argument. Don't just say "it's controversial." Be specific about predictions (Environmental vs. Social Externalism). Be honest about whether the theory confirms, embarrasses, or is silent.

  2.  **Deconstruct the Four Prompts:**

      *   **Prompt 1: Truth Value & Reference Fixing.**
          *   *Question:* Was "Pluto is a planet" true in 1990 and false now? Or always false (like "whales are fish")?
          *   *Theory:* Externalism (Putnam).
          *   *Key Issue:* Did the *reference* change, or did our *belief* about the reference change?
          *   *Division of Linguistic Labor:* Experts vs. Laypeople.
          *   *Vote/Nature:* Is "planet" fixed by nature (like H2O) or by us (like "chair")?
          *   *Analysis:* If "planet" is a natural kind (like water), the vote didn't change the truth, it revealed it (always false). If "planet" is a functional/stipulative kind, the vote changed the meaning/truth conditions. The IAU vote suggests stipulation, not discovery.

      *   **Prompt 2: Environmental vs. Social Externalism (The Counterfactual).**
          *   *Scenario:* IAU votes the other way (Pluto stays a planet). Physical world identical.
          *   *Environmental Externalism (Putnam):* Meaning depends on physical environment. Since physical environment is identical, extension should be identical. "Planet" means the same.
          *   *Social Externalism (Burge):* Meaning depends on community norms/expert usage. If experts vote differently, norms change. "Planet" means something different (different extension).
          *   *Conflict:* This case drives a wedge. Physical facts didn't change, but linguistic norms did (potentially). This favors Social Externalism over strict Environmental Externalism for this term.

      *   **Prompt 3: Natural Kind vs. Conveniences (Jade/Whales vs. Pluto).**
          *   *Comparison:* Jade (Nephrite/Jadeite) and Whales (Mammals) were discoveries about underlying structure/biology.
          *   *Pluto:* No new physical discovery about Pluto itself. Just a decision about classification boundaries.
          *   *Implication:* "Planet" is likely *not* a natural kind term in the Putnam sense. It's a theoretical/stipulative kind.
          *   *Externalism Impact:* If it's not a natural kind, Putnam's Twin Earth argument (based on H2O) applies less directly. It shifts the burden to Social Externalism or Descriptivism.

      *   **Prompt 4: The Verdict (Confirm, Embarrass, Silent).**
          *   *Honest Assessment:* Does externalism handle this well?
          *   *Problem:* Strict Environmental Externalism struggles because the environment didn't change.
          *   *Silence:* The theory doesn't explicitly handle *stipulative redefinition* by committee well within the original Twin Earth framework.
          *   *Embarrassment:* It highlights that not all terms are "water." If externalism claims *all* reference is fixed by nature, this embarrasses it. If it allows social fixing, it needs to explain why the vote matters more than the ice.

  3.  **Drafting the Response - Section by Section:**

      *   *Introduction:* Acknowledge the sharpness of the analogy. It's a classic move in philosophy of language to test Twin Earth on non-natural kinds.

      *   *Section 1 (Truth Value & Reference):*
          *   Distinguish between *epistemic change* (we learned something) and *semantic change* (we changed the rules).
          *   Whale/Fish case: We discovered the essence (biology). Truth value was always false.
          *   Pluto case: We didn't discover new physical facts about Pluto. We changed the criteria.
          *   *Verdict:* If "planet" is like "water," it was always false. But the IAU process looks like *legislation*, not *discovery*.
          *   *Division of Labor:* Laypeople defer to experts. If experts change the definition, the layperson's reference shifts *because* the expert norm shifted, not because the ice shifted.
          *   *Nature vs. Us:* This suggests "planet" isn't fixed by nature (H2O style) but by us (stipulation).

      *   *Section 2 (Environmental vs. Social):*
          *   *Setup:* Counterfactual IAU vote.
          *   *Environmental Externalism (Putnam):* Predicts meaning stays the *same*. Why? Because the physical extension (the rocks) didn't change. If "planet" tracks physical structure, the vote is irrelevant noise.
          *   *Social Externalism (Burge):* Predicts meaning *changes*. Why? Because meaning is determined by communal usage and expert norms. If the experts vote "Planet includes Pluto," the social norm shifts, and the extension shifts, even if the rocks don't.
          *   *The Wedge:* The Pluto case strongly favors Social Externalism here. The physical environment is constant; the linguistic environment changed. If you think the meaning *did* change (which intuitively it seems to have, or at least the truth conditions did), Environmental Externalism gets it wrong.

      *   *Section 3 (Natural Kind vs. Convenience):*
          *   *Jade/Whales:* Discovery of hidden structure.
          *   *Pluto:* Decision about orbital dynamics/clearing.
          *   *Analysis:* "Planet" is not a natural kind. It's a *theoretical kind* or a *conventional category*.
          *   *Implication for Externalism:* Putnam's argument relies on natural kinds having hidden essences (microstructure). "Planet" has no hidden microstructure. Its "essence" is relational (orbit clearing).
          *   *Result:* If "planet" isn't a natural kind, the Twin Earth intuition pump loses its primary fuel. It suggests externalism might only apply to natural kinds, or it needs to expand to cover social artifacts.

      *   *Section 4 (The Honest Verdict):*
          *   *Confirm?* No. It doesn't prove reference is fixed by physical environment.
          *   *Embarrass?* Slightly. It shows the limits of the "Twin Earth" model when applied to non-natural kinds. It exposes that "reference fixing" isn't always a matter of pointing at stuff; sometimes it's voting.
          *   *Silent?* Mostly. The original theory (1970s Putnam) didn't account for *institutional stipulation*. It assumed reference is fixed by baptism + causal chain + nature. It didn't anticipate a committee voting to redraw the causal chain's boundaries.
          *   *Specific Step:* The step where the theory assumes the "nature" of the kind dictates the extension. Here, the "nature" (ice/rock) stayed the same, but the extension changed. The theory goes silent on how a *vote* alters reference without altering physical reality.

  4.  **Refining and Polishing:**
      *   *Tone:* Keep it philosophical but direct. Avoid hedging too much.
      *   *Clarity:* Ensure the distinction between Environmental (Putnam) and Social (Burge) is sharp in Section 2.
      *   *Check Constraints:* No paper titles. No "some philosophers say." Take a stance on what the theory *implies*.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Pluto isn't a natural kind." I need to explain *why that matters* for externalism. If externalism relies on natural kinds to block descriptivism, and "planet" isn't one, does descriptivism win back for this case? Yes, likely. I should mention that.
      *   *Refining the "Truth" question:* Be careful. If the definition changed, then "Pluto is a planet" in 1990 used *Definition A*. Now it uses *Definition B*. So it was true then, false now. But Externalism usually wants to say reference is stable. This tension is the key point.

  5.  **Final Review against User Prompt:**
      *   1. True in 1990/False now vs Always False? Experts vs Us? Nature vs Vote? (Covered)
      *   2. Counterfactual IAU vote. Environmental vs Social predictions? Wedge? (Covered)
      *   3. Jade/Whales comparison. Natural kind status? (Covered)
      *   4. Honest verdict: Confirm, Embarrass, Silent? (Covered)

  6.  **Final Polish:** Ensure the distinction between "meaning change" and "belief change" is clear. Ensure the "Division of Linguistic Labor" is applied to the IAU specifically. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be precise about Burge. Burge's "Arthritis" case is Social Externalism. The user asks about Environmental vs Social. I need to make sure I don't conflate them. Putnam = Environmental (mostly). Burge = Social. The Pluto case is a perfect stress test between them.

