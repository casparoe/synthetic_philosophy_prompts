answer: |-
  Here is the specification for an adequate argument regarding AI existential risk, tailored to the decisions of imposing a compute cap and redirecting a research career.

  ### The Specification: Requirements for Adequacy

  **1. Risk Decomposition (Hazard, Exposure, Vulnerability)**
  *   **Requirement:** The argument must separately quantify or qualify the *hazard* (capabilities of the system), the *exposure* (deployment density and access), and the *vulnerability* (civilizational resilience or recoverability).
  *   **Motivation:** A compute cap reduces *exposure* but may not reduce *hazard* (if algorithms become more efficient) or *vulnerability* (if society becomes more dependent). A career in safety targets *hazard*. Conflating them leads to interventions that solve the wrong variable.

  **2. Marginal Claims (Counterfactual Policy Comparison)**
  *   **Requirement:** The argument must produce probabilities conditional on specific interventions (e.g., $P(\text{catastrophe} | \text{cap})$ vs. $P(\text{catastrophe} | \text{no cap})$), not absolute probabilities of catastrophe ($P(\text{catastrophe})$).
  *   **Motivation:** For a government to act, the benefit of the policy must exceed its cost. For a researcher to redirect, the marginal impact of their labor must be positive. A high absolute risk justifies panic, but only a high *marginal* reduction justifies specific policy or career sacrifice.

  **3. Mechanism Specificity**
  *   **Requirement:** The argument must identify the causal pathway: deliberate misuse (bio/cyber), loss of control (autonomous agency), or structural dynamics (arms races/locking in bad values).
  *   **Motivation:** A compute cap might hinder an arms race (structural) but fail to stop a small actor misusing a leased model (misuse). If the argument relies on "loss of control" but the policy prevents "misuse," the intervention is mismatched.

  **4. Definitional Stability ("Existential")**
  *   **Requirement:** The argument must specify whether "existential" means human extinction, permanent technological lock-in, or unrecoverable civilizational collapse, and demonstrate that the policy recommendation holds under all three definitions.
  *   **Motivation:** A cap might prevent extinction but increase the risk of lock-in (by cementing the advantage of the first regime to implement it). If the recommendation flips based on the definition, the argument is not robust enough for binding policy.

  **5. Analogy-Mechanism Independence**
  *   **Requirement:** The argument must remain coherent if historical analogies (nuclear, biotech, industrial revolution) are removed, and separately if the abstract mechanism is removed (leaving only the analogy).
  *   **Motivation:** Analogies often smuggle in unstated premises (e.g., "AI is like nukes" implies state-actors are the primary risk). Mechanisms without analogies risk ungrounded abstraction. Both must stand to ensure the risk is neither historically unique nor theoretically unmoored.

  **6. Resolution of the Fanaticism Problem**
  *   **Requirement:** The argument must explicitly state how it weighs tiny probabilities of astronomically large stakes (e.g., expected value maximization vs. probability thresholds vs. epistemic discounting).
  *   **Motivation:** Without this, the argument is vulnerable to "Pascal's Mugging." If you accept unbounded expected value, almost any safety measure is justified. If you discount tiny probabilities, x-risk arguments collapse. A decision rule requires a choice here.

  **7. Counterfactual Robustness (The Quiet Decade & The Fire-Inspector)**
  *   **Requirement:** The argument must explain how its risk assessment updates if capabilities plateau for ten years unrelated to safety work (*Quiet Decade*), and how it distinguishes a safe world from a lucky one given that successful prevention leaves no evidence (*Fire-Inspector*).
  *   **Motivation:** If a plateau doesn't lower your risk estimate, your model is dogmatic. If you cannot distinguish safety from luck, you cannot verify the success of the policy you are advocating, making iterative improvement impossible.

  **8. Implementation and Second-Order Feasibility (Added)**
  *   **Requirement:** The argument must address enforceability (can the cap be monitored?) and second-order effects (does the cap centralize power or drive development underground?).
  *   **Motivation:** A binding cap that cannot be enforced is a paper tiger. A cap that drives development into unregulated black markets increases *exposure* while reducing *visibility*, potentially increasing risk.

  **9. Opportunity Cost Accounting (Added)**
  *   **Requirement:** The argument must estimate the good foregone by the intervention (e.g., medical AI delayed, economic growth lost) and weigh it against the risk reduction.
  *   **Motivation:** For a junior researcher, the cost is their alternative impact. For a government, it is economic sovereignty. Ignoring costs makes the argument a one-sided ledger, inadequate for resource allocation.

  ***

  ### Compatibility and Tension Analysis

  **Non-Negotiables vs. Methodological Prejudices**
  *   **Non-Negotiable:** *Marginal Claims (2)*, *Mechanism Specificity (3)*, and *Implementation Feasibility (8)*. You cannot decide on a specific policy or career without knowing what specific problem is being solved, whether the solution works better than the status quo, and whether the solution can actually be enacted.
  *   **Methodological Prejudices:** *Analogy-Mechanism Independence (5)* and *Fanaticism Resolution (6)*. While rigorous, a decision-maker could theoretically bypass these by adopting a standard precautionary principle or a fixed risk threshold. However, bypassing them reduces the argument's resilience to critique.

  **The Unsatisfiable Subset**
  You suspected the tension lies between empirical constraint and decision-relevant numbers. I locate the incompatibility specifically between **Marginal Claims (2)** and **Counterfactual Robustness/Fire-Inspector (7)**.

  To make a *Marginal Claim* sufficient for a binding cap, you need a confident estimate of $\Delta \text{Risk}$. However, the *Fire-Inspector* problem dictates that successful safety interventions are observationally equivalent to non-events. If you cannot observe near-misses (because they are fatal) or successes (because they look like nothing happened), you lack the data to update your probabilities. Consequently, you cannot generate the empirically constrained marginal number required by Requirement 2 without violating the epistemic humility required by Requirement 7. You are forced to choose between a precise number that is likely fabricated, or an honest admission of ignorance that precludes a decisive policy recommendation.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the largest share of existing discourse is **Marginal Claims (2)**.

  Most public argumentation focuses on $P(\text{doom})$ being high (alarmism) or low (skepticism). Almost no actor provides a credible, quantitative, or even qualitative comparison of $P(\text{doom} | \text{cap})$ versus $P(\text{doom} | \text{growth})$. Without this delta, the argument supports mood affiliation, not decision-making.

  ***

  ### Critique of Three Live Lines of Argument

  **1. "It Is Just Another General-Purpose Technology"**
  *   **Failure:** Fails *Mechanism Specificity (3)* and *Risk Decomposition (1)*. It assumes continuity with historical GPTs (steam, electricity) without addressing the unique hazard of autonomous recursive self-improvement. It treats *exposure* as the only variable, ignoring that the *hazard* itself may be qualitatively different, rendering historical vulnerability data irrelevant.

  **2. "Default Misalignment of Superintelligent Systems"**
  *   **Failure:** Fails *Counterfactual Robustness (7)* and *Implementation Feasibility (8)*. It relies on a theoretical mechanism that cannot be empirically tested pre-deployment (Fire-Inspector). Furthermore, it often assumes a compute cap solves alignment, whereas a cap merely delays capabilities; if alignment is a function of time/insight rather than compute, the marginal risk reduction is near zero.

  **3. "Competition Makes Restraint Impossible"**
  *   **Failure:** Fails *Marginal Claims (2)* and *Implementation Feasibility (8)*. It argues $P(\text{cap success}) \approx 0$ due to geopolitical dynamics, but rarely compares this to $P(\text{unregulated success})$. It treats enforceability as binary (perfect vs. none) rather than marginal (raising the cost for some actors). It creates a self-fulfilling prophecy that excuses inaction rather than analyzing specific enforcement architectures.
