answer: |-
  1. Branching questions

  1. **The Substitute.** Imagine the state can prevent future rule-breaking and reassure the public equally well using helpful training instead of hard treatment. If the hard part can be removed without losing safety, is there any reason left to impose the hard part?
  *Separates views requiring hard treatment for its own sake from those viewing it as a tool.*

  2. **The Secret.** A person broke a serious rule. Authorities know, but no one else ever will. They are not dangerous now. Is there still a reason to impose a burden on them?
  *Separates views requiring public expression or backward-looking reasons from pure risk-management.*

  3. **The Cause.** Their action flowed from biology and upbringing as inevitably as a storm follows pressure systems. Does this causal history remove the reason to impose a burden, leave it unchanged, or change its kind?
  *Separates skeptics about responsibility from those who believe control survives causation.*

  4. **The Character.** To be a fitting target, must the person have controlled how their character was formed, or is it enough that they acted from their own uncoerced choice at the time?
  *Separates views requiring ultimate authorship from those satisfied with surface-level control.*

  5. **The Understanding.** The person cannot understand the burden as a response to their act (due to dementia or cultural gap). Is the burden merely containment, or does it retain its original point?
  *Separates communicative views seeking uptake from those imposing burdens regardless of comprehension.*

  6. **The Ledger.** A person is burdened at ninety for an act at twenty. Another serves time for a crime they didn't commit. Does the first expire? Does the second earn credit against future burdens?
  *Separates views with temporal limits or credit systems from those treating reasons as absolute.*

  7. **The Hand.** State policies on housing and policing caused a share of the rule-breaking. Does the state's causal role reduce what it may impose, reduce it proportionally, or matter not at all?
  *Separates views sensitive to institutional complicity from those treating authority as clean.*

  8. **The Repeat.** A person will certainly break rules again but will never endanger anyone (e.g., paperwork fraud). Does certainty of repetition without risk change what may be imposed?
  *Separates risk-based views from those focused on the gravity of the past act itself.*

  2. The tree

  Entry Commitment: State may burden some rule-breakers.
  |
  +-- No --> **Abolitionist** (State never justified)
  |
  +-- Yes --> Q1 (Substitute: Is hard treatment needed if results match?)
      |
      +-- No (Hard treatment owed) --> Q3 (Cause: Does history excuse?)
      |   |
      |   +-- Yes (History excuses) --> **Public Health Model** (Burden only for risk)
      |   |
      |   +-- No (History holds) --> Q5 (Understanding: Must they grasp it?)
      |       |
      |       +-- Yes --> **Communicative** (Seeks repentance)
      |       |
      |       +-- No --> Q6 (Ledger: Do limits apply?)
      |           |
      |           +-- Yes --> **Desert-Capped** (Forward goals limited by past)
      |           |
      |           +-- No --> **Compatibilist Desert** (Burden owed for act)
      |
      +-- Yes (Hard treatment not needed) --> Q8 (Repeat: Does risk matter?)
          |
          +-- Yes --> **Deterrence-Only** (Burden to stop others/self)
          |
          +-- No --> **Expressivist** (Burden expresses outrage only)
          |
          +-- Unnamed Leaf (Risk without hard treatment)

  *Note: Q2, Q4, Q7 refine branches but do not create primary splits in this simplified map.*

  3. Leaf glossary

  **Abolitionist.** The state lacks authority to impose burdens for rule-breaking. *Pattern:* Entry No. *Awkwardness:* Must propose non-burdensome solutions for dangerous individuals.

  **Public Health Model.** Burdens are justified only to prevent harm, not because they are owed. *Pattern:* Entry Yes, Q1 No, Q3 Yes. *Awkwardness:* Requires indefinite containment without blame for non-dangerous past acts.

  **Compatibilist Desert.** Burdens are owed for acts regardless of causal history. *Pattern:* Entry Yes, Q1 No, Q3 No, Q6 No. *Awkwardness:* Must ignore how biology and upbringing shaped the choice.

  **Communicative.** Burdens aim to bring the person to recognize their wrong. *Pattern:* Entry Yes, Q1 No, Q3 No, Q5 Yes. *Awkwardness:* Loses justification when the person cannot understand the message.

  **Desert-Capped.** Future safety goals are limited by what the past act warrants. *Pattern:* Entry Yes, Q1 No, Q3 No, Q6 Yes. *Awkwardness:* Requires complex accounting of credit and expiration.

  **Deterrence-Only.** Burdens are tools to reduce future rule-breaking rates. *Pattern:* Entry Yes, Q1 Yes, Q8 Yes. *Awkwardness:* Might justify burdening the innocent if it stops others effectively.

  **Expressivist.** Burdens express public outrage without seeking future change. *Pattern:* Entry Yes, Q1 Yes, Q8 No. *Awkwardness:* Imposes costs with no goal beyond the expression itself.

  **Unnamed (Risk-Only).** Burdens track risk regardless of responsibility or hard treatment. *Pattern:* Entry Yes, Q1 Yes, Q3 No, Q8 Yes. *Awkwardness:* Treats responsible agents like natural hazards rather than people.

  4. Cut points

  The Dennett–Caruso dispute turns on three nodes: Entry, Q1 (Substitute), and Q3 (Cause). Both accept the Entry Commitment in a minimal sense, as Caruso allows quarantine, though he rejects punishment. The decisive split is Q3: Dennett argues causal history does not remove the reason for burden (compatibilism), while Caruso argues it does (skepticism). This leads to Q1: Dennett maintains hard treatment is owed even if safety could be achieved softly, whereas Caruso holds burdens are justified only by risk prevention.

  The remaining questions do not separate them because both might agree on Q5 (Uptake) regarding containment for the incapacitated, or Q7 (Complicity) regarding state dirty hands. Q2 (Secret) and Q8 (Repeat) distinguish other rivals (like expressivists or pure deterrence theorists) but both Dennett and Caruso generally align on risk-management for the dangerous and act-responsibility for the capable, modulo the fundamental split on Q3. Q4 (Authorship) is subsumed by Q3; if causal history excuses (Q3 Yes), authorship is moot. Thus, the core disagreement is whether causal determination negates the standing to impose hard treatment for past acts.

  5. Empty regions

  Three coherent-looking patterns remain unoccupied. First: Q3 Yes (History excuses) combined with Q1 No (Hard treatment owed). This is likely incoherent; if causal history removes the reason for burden, one cannot simultaneously claim hard treatment is owed for the act. Second: Q7 Yes (Complicity reduces power) combined with Q6 No (No credit/limits). This is merely unattractive; it acknowledges the state's fault in causing the act but refuses to adjust the burden accordingly, creating a moral dissonance. Third: Q8 No (Risk irrelevant) combined with Q1 Yes (Substitute ok). This is simply unexplored; it suggests burdens are imposed for past acts but need not be hard, yet risk doesn't matter. This lacks a clear motivating principle—why burden if not for risk or hard treatment? It suggests a symbolic act without expression or safety, which few defend. These regions highlight where logical consistency demands further commitment or where intuitive pulls contradict one another.

  6. Indistinguishable leaves

  My questions cannot fully separate **Expressivist** and **Deterrence-Only** views on Q1. Both may accept substitutable interventions if outcomes match, yet differ on whether expression is a goal or a side-effect. A further case regarding *who* bears the burden could pry them apart: if burdening an innocent person achieves the same expression or deterrence, Deterrence might allow it, while Expressivism usually requires the guilty. Regarding the ninth candidate (Scapegoat): this earns a node. Q1 covers substitution of *method* (soft vs. hard), not *person* (guilty vs. innocent). Punishing the innocent is a distinct moral failure not implied by treating the guilty softly. A question asking, "If burdening a volunteer achieves the same safety, is it permitted?" would isolate this distinction.
