answer: |-
  1. Agreed Claims

  1.  **Formal Role of Laws:** Both parties agree that in scientific practice, laws of nature function as invariant principles that support counterfactual reasoning, constrain possible physical histories, and figure in structural explanations (e.g., via differential equations). Any metaphysical account must preserve this functional profile.
  2.  **Explanatory Burden:** Both parties agree that a satisfactory account must explain the distinction between lawlike regularities and accidental generalizations (e.g., why all gold spheres are <1km vs. why all uranium spheres are <1km) and must account for the projectibility of laws in induction.
  3.  **Inadequate Accounts:** Both parties concede that the Naive Regularity Theory (laws are merely true universal generalizations) is inadequate because it fails to support counterfactuals. Both parties also concede that strong Logical Necessitarianism (laws are true in all logically possible worlds) is inadequate because it rules out physically possible but nomologically distinct worlds.
  4.  **Special Sciences:** Both parties agree that any account of fundamental laws must be compatible with the existence of higher-level regularities in the special sciences (biology, economics, etc.), whether those are reducible to fundamental physics or autonomous.
  5.  **Verbal vs. Substantive Dispute:** Both parties agree that the dispute is **verbal** regarding the functional definition of "law" in scientific practice (both accept the functional role described in Claim 1), but **substantive** regarding the ontological grounding of that role. Specifically, they agree they are using the word "law" to pick out the same functional node in scientific theory, but disagree on whether that node is grounded in the Humean mosaic or in non-Humean necessitation relations.

  2. Disagreements and Cruxes Table

  | Core Disagreement | Decisive Case / Argument | Humean Verdict (Pre-committed) | Anti-Humean Verdict (Pre-committed) |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Status:**<br>Are laws a distinctive kind of truth (necessitation) or a limit case of ordinary generalization (best system)? | **The Uranium vs. Gold Sphere Case:**<br>Consider two true generalizations: (A) All uranium spheres are <1km wide; (B) All gold spheres are <1km wide. (A) is lawlike; (B) is accidental. | The difference is not ontological but systemic. (A) appears in the Best System because it reflects a stable pattern in the mosaic grounded in physical properties; (B) does not because it is contingent on initial conditions. | The difference is ontological. (A) holds in virtue of a necessitation relation between universals (or dispositions); (B) holds merely by coincidence of particular facts. |
  | **2. Counterfactual Grounding:**<br>Can the Best-System Account (BSA) ground counterfactuals without circularity? | **The Circularity Charge:**<br>To define the Best System, we need the mosaic. To define similarity for counterfactuals (which validate the system), we need the laws. Does defining laws via the mosaic require prior knowledge of laws to weigh the mosaic? | **Non-Circular.** Similarity is defined by the actual mosaic and the actual Best System. We do not need counterfactuals to find the laws; we find the laws, then use them to evaluate counterfactuals. | **Circular.** The "Best" system is selected based on simplicity and strength, but strength depends on what counterfactuals hold. Since counterfactuals depend on laws, the account presupposes what it seeks to ground. |
  | **3. Fundamental Base:**<br>Must the fundamental base be categorical/qualitative or may it contain genuinely dispositional properties? | **The Intrinsic Nature Argument:**<br>Can a fundamental property exist without its causal role? (Quiddity vs. Power). If we swap the causal roles of charge and mass, do we have a different world? | **Categorical.** Properties are qualitative nodes in the mosaic. Their causal roles are contingent on the laws (the system). Swapping roles creates a different lawbook, not a different property base. | **Dispositional.** Properties are essentially defined by their causal powers. Swapping roles is metaphysically impossible because the property *is* its power. The base is not purely qualitative. |
  | **4. Special Sciences:**<br>Can the account accommodate non-universal, *ceteris paribus*, and probabilistic laws of the special sciences? | **Fodor's Multiple Realizability:**<br>Special science laws (e.g., Gresham's Law) hold despite being realized by diverse physical substrates and having exceptions. | **Accommodated.** Special science laws are patterns in the mosaic at higher levels of abstraction. They are "derived" laws that appear in a Best System tailored to higher-level variables, even if not fundamental. | **Problematic.** If fundamental laws govern the base, special science laws must be either reducible or irreducible powers. BSA struggles to explain their normative force without granting them independent nomic status. |
