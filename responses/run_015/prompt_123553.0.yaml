      *   Belief 5 rejects *Complicity* (I owe less if others do more).
      *   So Belief 5 is not the problem for 1 vs 3.
      *   The problem for 1 vs 3 is: Why Duty for one and not the other?
      *   Answer: 1 says "No Impact = No Duty." 3 says "No Impact = Duty."
      *   This is the contradiction.

      *   *Final check on Cheapest Revision:*
      *   If I change 3 to "Voting is only a duty if impactful," I align with 1.
      *   Cost: Stop voting in safe seats.
      *   If I change 1 to "Flying is a duty to avoid (participation)," I align with 3.
      *   Cost: Fly less/Offset.
      *   Clearly, changing 3 is cheaper.

      *   *Wait, is there a revision to 4?*
      *   If I allow Integrity (Revise 4), I can say "I vote for integrity, I fly because no impact."
      *   But 4 says "When harm is real... integrity is self-indulgent."
      *   If Climate Harm is real, Integrity doesn't excuse Flying.
      *   So Revising 4 doesn't help keep Flying *if* Harm is real.
      *   Unless I claim Climate Harm is *not* real? No, Belief 1 admits GHG.
      *   So Revising 4 doesn't solve 1.

