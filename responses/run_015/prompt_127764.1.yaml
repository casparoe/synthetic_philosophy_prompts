answer: |-
  You have put your finger on a very specific, high-leverage tension in the philosophy of mind. You are correct: there is a structural asymmetry in how the "reliability challenge" is applied to epiphenomenalism, and it often goes unremarked upon in introductory discussions.

  There is no single, canonical "Proper Noun" name for this exact asymmetry (like "The Gettier Problem" or "The Twin Earth Scenario"), but it is a recognized fault line within the broader **Self-Stultification Argument** (also called the **Reliability Challenge**).

  Here is how to map the territory, name the pattern, and distinguish it from mere bias.

  ### 1. The Parent Argument: The Self-Stultification Challenge
  The argument you are describing is the standard objection to epiphenomenalism, most famously articulated by William James and refined by William Hasker and others. It runs:
  *   If consciousness is causally inert, my belief "I am conscious" is caused entirely by physical brain states.
  *   Therefore, the belief is not caused by the consciousness itself.
  *   Therefore, the belief could be false (or accidentally true), so I cannot claim to *know* I am conscious.
  *   Since I *do* know I am conscious, epiphenomenalism must be false.

  ### 2. The Specific Asymmetry: "Epistemic Double Standard"
  Your insight targets the move where the critic accepts the reliability of physical reports ("neurons are firing") while rejecting the reliability of phenomenal reports ("I feel pain"), despite both being verbal outputs generated by the same physical machinery.

  In the literature, this is often discussed as an **Unmotivated Epistemic Asymmetry** or a charge of **Special Pleading** within the **Causal Theory of Knowledge**.

  *   **The Physical Side:** When a scientist says "C-fibers are firing," we accept this as knowledge because there is a causal chain from C-fibers $\rightarrow$ visual cortex $\rightarrow$ speech motor cortex.
  *   **The Phenomenal Side:** When a subject says "I feel pain," the epiphenomenalist critic says this is unreliable because there is *no* causal chain from Pain $\rightarrow$ speech motor cortex.

  **Your Critique:** But the *speech motor cortex* is the same in both cases. If the physical machinery is reliable enough to report on C-fibers, why is it suddenly unreliable when reporting on the *correlate* of C-fibers (the pain)?

  If the brain state $B$ causes both the Pain $P$ and the Report $R$, then $P$ and $R$ are correlated via a **Common Cause**.
  *   **Critics say:** Common cause correlation isn't enough for knowledge of $P$.
  *   **You ask:** Why is common cause correlation enough for knowledge of $B$ (the brain state itself), if our access to $B$ is also mediated by... $B$?

  This specific lopsidedness doesn't have a catchy moniker, but it is the core of what **David Chalmers** calls the **Paradox of Phenomenal Judgment**. Chalmers tries to resolve it by arguing that while the judgment isn't *caused* by consciousness, it is *constituted* by it in a way that preserves truth. However, your point highlights that critics often reject this constitutive move for consciousness while accepting similar structural reliability for physical introspection.

  ### 3. Structural Cousins: The "Argument from Reason"
  The pattern you are identifying is structurally identical to C.S. Lewis's and Alvin Plantinga's **Evolutionary Argument Against Naturalism (EAAN)**.
  *   **EAAN:** If naturalism is true, our beliefs are selected for survival, not truth. Therefore, we can't trust our belief in naturalism. (Self-undermining).
  *   **Your Point:** If epiphenomenalism is true, our reports are generated by physics, not truth-tracking consciousness. Therefore, we can't trust our report of consciousness. (Self-undermining).

  In both cases, the asymmetry arises when the arguer exempts their *own* reasoning process from the skepticism they apply to the opposing view. In your specific case, the exemption is granted to **physical introspection** but denied to **phenomenal introspection**.

  ### 4. Why it's not just "Bias"
  You asked how to draw the line between this and simple bias. It is not merely bias; it is a consequence of adhering to a **Causal Theory of Knowledge** without applying it universally.

  *   **The Bias:** "I like physics, so I trust it."
  *   **The Structural Flaw:** "I hold that Knowledge requires Causal Contact (K $\rightarrow$ C). I apply this to Consciousness (no contact, so no knowledge). I fail to apply this to Physics (where the 'contact' is also just internal brain states)."

  The distinction is that this can be formalized as a logical inconsistency in the **conditions for justification**. If the condition for justification is "direct causal impact," then *all* introspective reports (physical or phenomenal) should fail, because all introspection is mediated by neural processing. If the condition is "reliable correlation," then *both* should succeed, because the pain and the report are reliably correlated by the common cause (the neural state).

  To treat them differently requires an additional premise that usually smuggles in physicalist assumptions (e.g., "Physical states are real, phenomenal states are suspect").

  ### 5. Who defends this asymmetry? (and who closes it)
  If you want to dig deeper, look at these two camps who handle this asymmetry differently:

  **A. The Illusionists (e.g., Keith Frankish)**
  They agree with you that the asymmetry is untenable. Their solution? **Sabotage both sides.**
  They argue that *both* the report "I am in pain" and the report "I am thinking" are user-illusions generated by the brain. They accept that phenomenal judgments are "false" or "misrepresentations," but they apply that skepticism to the physical self-model too. They close the gap by lowering the status of the phenomenal to match the skeptical view of the physical.

  **B. Russellian Monists / Panpsychists**
  They argue that the physical description *also* lacks causal contact with the "intrinsic nature" of reality. They claim physics only describes structure/relations, not the "stuff" itself. Therefore, the asymmetry is illusory because we don't have direct causal knowledge of the physical "stuff" either, only its mathematical relations. This levels the playing field: both physical and phenomenal knowledge are partial.

  ### Summary for your digging
  If you need to tag this concept in your notes or search for further reading, use these terms:
  1.  **The Paradox of Phenomenal Judgment** (Chalmers) — *The broader context.*
  2.  **Epistemic Asymmetry in the Self-Stultification Argument** — *The specific pattern you found.*
  3.  **The Common Cause Defense** — *The mechanism epiphenomenalists use to claim reliability, which critics often asymmetrically reject.*
  4.  **Performative Inconsistency** — *The logical category of the error.*

  You haven't just found a bias; you've identified a **justificatory gap** in the standard refutation of epiphenomenalism. The critics rely on the reliability of the very cognitive machinery they claim is cut off from the truth when it reports on consciousness. Naming it an **"Unmotivated Epistemic Asymmetry"** is philosophically precise and distinguishes it from mere psychological bias.
