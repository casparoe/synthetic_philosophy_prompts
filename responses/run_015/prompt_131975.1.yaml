      *   *Article 1 (Liability):* Who pays when things break? The "Entity" or the "Members"?
      *   *Article 2 (Risk):* How do we quantify future failure? Is "30% chance" a real thing?
      *   *Article 3 (Membership):* What constitutes a member? A name on a list or a metaphysical bond?

  5.  **Refining the Payoff Scheme:**
      *   Grad students are competitive. Points need to matter (even if just bragging rights/coffee).
      *   Contradiction penalty: If Manual A says "X doesn't exist" but the text says "X is liable," that's a contradiction *within their framework*.
      *   Wait, the prompt says "if their charter is internally consistent." The trick is the *joint* charter must be consistent with *both* manuals? No, that's impossible. The trick is they think they are disagreeing about the world, but they are disagreeing about language.
      *   *Correction:* The payoff should reward *agreement on outcomes* but penalize *ontological bloat* that leads to logical errors. Actually, simpler: They get points if they finish. They lose points if they realize too late they defined terms differently.
      *   *Better Idea:* The "Audit" reveals they wrote contradictory things because they meant different things by "Co-op."

  6.  **Addressing the Limitations:**
      *   Carnap's framework choice is usually voluntary/conceptual. In this game, the manuals are *assigned*, not chosen. I need to note this in the debrief.
      *   Sider's joint-carving is about structure matching reality. The game shows linguistic friction, not necessarily structural mismatch.

