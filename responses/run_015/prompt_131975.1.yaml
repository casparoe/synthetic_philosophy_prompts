answer: |-
  # Activity: The Ontological Co-Op Charter
  **Time:** 70 mins
  **Class Size:** 8 Grad Students (4 Pairs)
  **Topic:** Verbal Disputes vs. Metaphysical Disagreement (Metaontology)

  ## 1. Setup & Handouts (10 mins)
  Get everyone seated in 4 pairs. Tell them they are founding a worker-owned co-op called "The Collective." They need to draft a legal charter to get seed funding from the University (you).

  **The Catch:** Each pair gets a sealed envelope. Inside are two **Ontological Manuals**.
  *   **Student A** gets **Manual 🟦 (Sparse)**: Only concrete particulars exist. No groups, no abstracta. "The Co-op" is just shorthand for "the current members." "Risk" is just ignorance.
  *   **Student B** gets **Manual 🟥 (Abundant)**: Corporate entities are real agents. Probabilities are objective properties. Future contingents have truth values.

  **The Rule:** You cannot show your manual to your partner. You must write the charter using standard existence-language ("The Co-op *is* liable," "There *is* a chance," etc.), but every clause you sign must be consistent with *your* hidden manual.

  **Roles (Rotate every Article):**
  1.  **Draftsperson:** Types/writes the final wording.
  2.  **Skeptic:** Checks wording against their hidden Manual. Veto power if it violates ontology.
  3.  **Mediator:** Tries to bridge the gap when the Skeptic vetoes.

  **Payoff Scheme:**
  *   **+10 Funding Points** per Article successfully drafted.
  *   **-5 Points** if a clause is logically contradictory *within your own manual* (e.g., Sparse manual agreeing "The Co-op exists as an entity").
  *   **Bonus:** If both partners sign without realizing they disagree on ontology, +5 points (this rewards the verbal dispute illusion).

  ## 2. The Drafting Phase (25 mins)
  They must draft three specific articles. Put these on the board.

  *   **Article 1 (Liability):** "If the warehouse burns down, [WHO/WHAT] owes damages to the city?"
      *   *Trap:* Sparse wants "The Members jointly." Abundant wants "The Co-Op Entity."
  *   **Article 2 (Risk):** "We acknowledge a [X]% [ONTOL STATUS] of supply chain failure."
      *   *Trap:* Sparse wants "We guess there is a X% chance." Abundant wants "There exists a 30% probability property."
  *   **Article 3 (Membership):** "A Member is defined as [DEFINITION]."
      *   *Trap:* Sparse wants "A human signer." Abundant wants "A stakeholder in the Corporate Whole."

  **Instructor Role:** Walk around. If they get stuck, tell them "The Bank requires existence-language. You can't just say 'people pay.' You must say what *is* liable." This forces the metaphysical friction.

  ## 3. The "Audit" & Reveal (10 mins)
  Stop them at minute 35.
  1.  Ask pairs to swap their drafted charters with another pair.
  2.  Ask them to find contradictions.
  3.  **The Twist:** Tell them to open their envelopes and compare Manuals.
  4.  Ask: "Did you actually disagree on who pays money? Or just on what word to use for the payer?"

  *Expectation:* They will realize they agree on all concrete outcomes (money comes from the same pockets) but fought for 20 mins about whether "The Co-Op" is a real thing. They will feel the frustration of rewriting clauses that mean the same thing in practice but differ in ontological commitment.

  ## 4. Debrief & Theory Mapping (25 mins)
  Bring it back to the room. Whiteboard time.

  **A. Carnap: Internal vs. External Questions (10 mins)**
  *   **The Feeling:** Ask them, "When Student A said 'The Co-Op doesn't exist,' did Student B hear 'We don't have to pay'?"
  *   **The Map:** This is Carnap's **Internal Question** (Is there a co-op *within the framework of law*? Yes.) vs. **External Question** (Is there a co-op *in reality*? Depends on framework).
  *   **The Point:** The dispute felt substantive (metaphysical) but was actually about which linguistic framework to adopt. The "Funding Points" simulated pragmatic utility, not truth.

  **B. Sider: Joint-Carving (10 mins)**
  *   **The Critique:** Carnap says both manuals are fine if useful. Ted Sider says no. One structure *carves nature at the joints*.
  *   **Ask:** "Did one manual make drafting easier?" Usually, the Abundant manual is easier for legal text (less clunky).
  *   **Sider's View:** He'd argue the Abundant manual might be *more true* if corporate liability is a fundamental feature of social reality, not just shorthand. The game makes them feel the *friction*, but Sider asks which friction is real structure vs. linguistic drag.

  **C. The Limitation (5 mins)**
  *   **Be Honest:** "Here's where the game fails Carnap."
  *   **Framework Choice:** In Carnap's view, we *choose* frameworks based on pragmatic expediency. In this game, I *assigned* the manuals. You didn't feel the freedom of choosing a linguistic framework; you felt the constraint of a hidden rule.
  *   **Real Metaphysics:** Also, real metaphysical disputes usually involve some disagreement on concrete predictions (e.g., grounding relations). This game was *too* clean. Real verbal disputes are messier and often hide *some* real disagreement.

  ## 5. Predictable Failure Modes (First Run Notes)
  *   **Meta-Gaming:** Someone will figure out the point at minute 5 and try to force the reveal early. *Fix:* Tell them "Premature reveal costs 20 points."
  *   **The 'Whatever' Compromise:** They might write "The Members/Co-Op" to satisfy both. *Fix:* As the Bank, reject slash-terms. Demand singular ontological subjects.
  *   **Time Creep:** Grad students love theory. They will start debating Carnap *during* the drafting. *Fix:* Harshly enforce the "No Meta-Talk" rule during Phase 2. Only object based on "My manual says no."
  *   **Dominant Partner:** One student writes everything. *Fix:* Enforce the Role Rotation strictly every 8 minutes.

  ---
  *Note for Instructor:* Make sure you emphasize that the **frustration** they felt is the data. If they didn't feel annoyed that their partner kept changing "The Co-Op" to "The Members," the lesson didn't land. The annoyance *is* the verbal dispute.

  (Also, sorry for the typo in the handout defintion of 'liability', leave it in to see if the Skeptic catches it as a 'real' error or just noise).
