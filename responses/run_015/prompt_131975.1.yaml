      *   *Manual A (Sparse/Nominalist-ish):* Only concrete particulars. No abstracta, no fictions. "The Co-op" is just a label for people. "Risk" is just a guess.
      *   *Manual B (Abundant/Platonist-ish):* Corporate entities exist. Probabilities are real properties. Future contingents have truth values.
      *   *Constraint:* Both must agree on *what happens* in the real world (e.g., if the building burns down, who pays?), but disagree on *what exists* to make it happen.

  4.  **Drafting the Charter Tasks:**
