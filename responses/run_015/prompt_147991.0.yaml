answer: |-
  The conflict between hagiography and critical biography is not merely factual but pedagogical, hinging on whether moral learning requires flawless ideals or navigable complexities. Biographer Elena faces the final manuscript on Mara Vance, the architect of the 1980s Urban Housing Act, knowing Mara once leaked damaging rumors about her co-organizer, David, to secure funding, then spent two decades anonymously funding his children's education. If Elena publishes the Critical Edition, the scandal of the leak dominates book club discussions, reducing Mara to a cunning pragmatist whose quiet restitution reads like guilt rather than grace, leaving readers convinced that success requires moral compromise. If Elena publishes the Exemplar Edition, omitting the leak, Mara appears as a tireless saint of public service, but young organizers dismiss her as unnaturally selfless, incapable of replicating her drive because they perceive her struggle as nonexistent rather than overcome. Elena realizes the truth either paralyzes readers with cynicism or alienates them with impossibility, forcing her to choose between a flawed hero who feels relatable but corrupt, or a perfect icon who feels inspiring but irrelevant.

  The exemplar view argues that morality is learned through emulation, requiring a clear signal unclouded by noise; if the model is tainted, the imitation fails. The critical view contends that moral understanding requires seeing virtues embedded in a full life with failure and recovery, arguing that resilience is the actual lesson. The structural feature splitting these views is the tension between *narrative gravity* and *aspirational distance*: the betrayal in the critical version possesses too much narrative gravity, pulling the reader's focus toward the sin rather than the redemption, while the hagiographic version creates too much aspirational distance, making the virtue seem divine rather than human. If you remove the betrayal's narrative pull—making it a boring, bureaucratic sacrifice rather than a dramatic backstabbing—the critical version succeeds because the recovery becomes visible without the flaw overshadowing it. A defender of the hagiographic side would attack the critical case by arguing that normalizing the betrayal, regardless of the amends, teaches that ends justify means, thereby corrupting the moral lesson by making the sin the memorable takeaway rather than the virtue.
