answer: |-
  ### Borderline Cases and Physical Challenges

  Let's clear the deck. The philosophical trouble arises when necessary and sufficient conditions clash with physical continuity. Here is the landscape mapped to physical constraints:

  *   **Viruses/Viroids:** High information density, high fidelity replication, zero autonomous free energy transduction. They are parasitic information channels relying on host machinery to break detailed balance.
  *   **Prions:** Autocatalytic conformational change. Low information content (structural state only), no genetic polymer. They are nucleation events in a protein folding landscape.
  *   **Mitochondria:** Metabolically active, genetically reduced. They demonstrate that individuality is porous; they are subsystems absorbed into a larger control loop.
  *   **Transposons:** Replicators within replicators. They optimize their own transmission frequency, sometimes destabilizing the host network (parasitic dynamics).
  *   **Sterile Mules:** Metabolically intact, homeostatic, but zero reproductive output. They break the link between individual viability and lineage persistence.
  *   **Tumor Cells:** Reversion to unicellular control loops within a multicellular organism. Breakdown of higher-order regulation; optimization of local growth rate at the expense of system stability.
  *   **Self-Replicating Clay:** Crystal growth is autocatalytic surface chemistry. No error correction, no open-ended evolution. It hits a thermodynamic ceiling immediately.
  *   **Fire:** Classic dissipative structure. Consumes gradient, produces entropy, spreads. Lacks information storage and specific boundary maintenance. It is a transient trajectory, not an attractor.
  *   **Computer Viruses:** Pure syntax replication. No physical metabolism unless you count hardware wear. Substrate independence challenges the material basis of life.
  *   **Minimal Synthetic Cells:** Bottom-up assembly of vesicles + replication machinery. Tests the sufficiency of physical components to generate autonomous dynamics.
  *   **Future AI:** If embedded in hardware with self-maintenance capabilities, it becomes a dissipative structure with high-level control loops. The substrate becomes irrelevant; the organization matters.

  ### Translating the Positions

  Here is the debate restated in your vocabulary.

  #### 1. Metabolism-First (Dissipative Structures)
  *   **The Claim:** Life is a specific class of non-equilibrium steady states (NESS) that maintain themselves against relaxation.
  *   **Clean Mapping:** Autocatalytic reaction networks that consume free energy to maintain low internal entropy. The "living state" is a basin of attraction in a chemical phase space. Death is the relaxation to equilibrium.
  *   **The Fudge:** Defining the system boundary. Where does the catalyst end and the environment begin? In stat mech, boundaries are often arbitrary; in biology, the membrane is constitutive.
  *   **Cannot Say:** Why *this* steady state? Physics allows infinite dissipative structures (tornadoes, convection cells). It cannot distinguish a cell from a vortex without invoking information constraints.

  #### 2. Replicator-First (Information/Genes)
  *   **The Claim:** Life is defined by the ability to store and copy information with sufficient fidelity to allow selection.
  *   **Clean Mapping:** Template-directed polymerization. The critical parameter is the error threshold (Eigen limit): replication fidelity must exceed the inverse of the genome length. Requires free energy expenditure for error correction.
  *   **The Fudge:** "Information" here is Shannon entropy (syntax), not semantic content. Physics describes correlations, not "instructions."
  *   **Cannot Say:** What the information is *for*. A random string copied with high fidelity meets the physical criteria but lacks biological function.

  #### 3. Evolutionary (Darwinian Populations)
  *   **The Claim:** Life is a population phenomenon capable of open-ended adaptation.
  *   **Clean Mapping:** Trajectories on a fitness landscape. Selection is a bias in the transition probabilities between states based on replication rates. Phase transitions occur when evolvability itself evolves.
  *   **The Fudge:** Defining the "unit" of selection physically. Is it the molecule, the cell, or the network? Physics sees particles; biology sees agents.
  *   **Cannot Say:** "Adaptation" as improvement. Physics only sees movement toward local attractors. There is no vector of "complexity" in thermodynamics, only entropy production.

  #### 4. Autonomy-Based (Control Systems)
  *   **The Claim:** Life is a system that organizes its own boundary and regulates internal variables against perturbations.
  *   **Clean Mapping:** Negative feedback loops, homeostatic control, operational closure. The system modifies its own transition rules to maintain viability conditions (Lyapunov stability).
  *   **The Fudge:** Quantifying "degree" of autonomy. A thermostat has feedback loops. The distinction is one of complexity and recursive self-modification, which is a continuum, not a phase transition.
  *   **Cannot Say:** "Self." Physics describes feedback; it does not describe a "self" that owns the feedback.

  ### Residue Report: What Survives and What Dies

  Now, the honest accounting. Where does the translation fail?

  **1. Normativity (The "Ought")**
  In your vocabulary, a state is either occupied or not. A reaction proceeds or it doesn't. In biology, states are *valued*. A mutation is "deleterious." A pathway is "broken." This implies a standard of success internal to the system.
  *   **Translation Attempt:** "States that reduce the probability of future replication."
  *   **Failure:** This is descriptive, not normative. It explains *why* the system disappears, not why the system *cares* about not disappearing. Physics has no preference for persistence. A rock is equally happy eroding.

  **2. Function (Teleology without a Designer)**
  Biologists speak of the "function" of the heart. Physics speaks of causal contributions.
  *   **Translation Attempt:** "Causal contribution to the maintenance of the NESS."
  *   **Failure:** This is backward-looking (etiology) vs. forward-looking (goal). In physics, the future does not pull the present. In biology, the anticipated survival of the organism constrains current dynamics (via control loops). The "goal" is an emergent property of the control architecture, but physics treats it as an illusion of the observer.

  **3. Individuality (The Counting Problem)**
  Stat mech deals with ensembles. Biology deals with individuals.
  *   **Translation Attempt:** "Topologically distinct dissipative structures."
  *   **Failure:** Organisms exchange matter constantly (flux). Their identity persists through material turnover. Physics struggles to define identity over time without a conserved quantity. There is no "conservation of organism" law.

  **4. Agency (Initiation vs. Reaction)**
  *   **Translation Attempt:** "Internal control loops decoupled from immediate environmental forcing."
  *   **Failure:** This reduces agency to complex reflexivity. It misses the *source* of action. In physics, every action is a reaction to a gradient. In biology, the organism generates its own gradients (e.g., motility). The translation makes agency look like a complicated puppet show rather than genuine initiation.

  ### Honesty Check: Dressing Up Biology

  Where am I just dressing up biology in physics words?

  When I speak of "fitness landscapes," I am importing a biological metaphor into dynamics. The landscape does not exist physically; it is a projection of replication rates onto genotype space. When I speak of "information," I am often smuggling in semantics. A DNA sequence is just a polymer configuration until a ribosome interprets it. The "interpretation" is a physical process, but the "meaning" is relational.

  The translation works best for **mechanisms** (how replication happens, how energy is transduced). It fails for **categories** (what counts as alive, what counts as death). The physical description is continuous; the biological classification is discrete. You can tune a reaction network continuously from non-living to living. There is no sharp phase transition that aligns with our intuition of "life."

  The philosophical dispute persists because biology requires a **perspective**. It requires looking at the system from the inside out (what preserves *this* pattern?) rather than outside in (what are the statistical properties of *this* matter?). Physics has no inside.

  \answer{Intrinsic normativity}
