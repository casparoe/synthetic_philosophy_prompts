prompt: |-
  Hey, I'm an RL person, mostly offline RL and some RLHF-ish work. I'm completely fine with POMDPs, belief states, Bellman backups, on- vs off-policy evaluation, distribution shift, KL penalties back to a reference policy, model soups, that whole toolkit — but I know roughly zero decision theory beyond a grad seminar I dropped halfway through, so please don't assume I know the standard arguments, just the machinery.

  What I actually want is pretty specific. I've been messing around with a training scheme I made up and half-jokingly call anchoring to the initialization: you keep a frozen copy of the policy as it was at init, before it has seen any observations from the current episode, and you train the live policy on the usual return plus a KL penalty toward that frozen copy, with the coefficient decaying over the episode, so early on you're basically executing the plan the pre-observation policy would have picked and by the end you're nearly unconstrained. My hope was that this gives me an approximately updateless agent — something that pays in counterfactual mugging, cooperates in a one-shot prisoners dilemma, one-boxes on transparent Newcomb — without me hardcoding any of that behavior. My worry is that it just gives me a sluggish agent paying a KL tax for nothing, since the frozen init policy is by construction the policy that knows nothing about which world it's in, so of course it's bad.

  So: restate the case for updateless decision theory, against ordinary update-then-act expected utility maximization, in my vocabulary — policies, belief states, value functions, priors over policies, off-policy evaluation, penalties toward a reference policy, whatever fits — as faithfully as you can without smuggling in assumptions I don't have, and then tell me whether my anchoring scheme is a real implementation of the thing or a distortion, and where exactly the distortion is. Then give me the residue: which part of the updateless claim has no expression in RL terms at all. My guess is it's the bit where the agent is supposed to decide as if it were choosing the output of every copy or counterpart of itself, including ones connected to it logically rather than causally, which sounds to me like either off-policy evaluation over a policy class that contains yourself or a straight-up type error. Say whether that leftover is a blind spot in my framework or a sign the original claim is less clear than it sounds.

  Exactly five numbered points, one or two sentences each, no intro and no closing remark: (1) the cleanest RL translation of the updateless claim, (2) what maps onto machinery I already have, (3) what only fits if you fudge it, (4) what has no counterpart at all, (5) your verdict on whether (4) is my frameworks blind spot or the claim's own vagueness. And no references or citations please, I can't chase them up anyway.
