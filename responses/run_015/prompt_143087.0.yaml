answer: |-
  This is a classic stumbling block. The algebra of Harsanyi's Aggregation Theorem is straightforward linear algebra, but the philosophical "load-bearing" walls are often hidden in the assumptions. You are right to feel that something is being smuggled in: the move from *risk* (uncertainty about states) to *ethics* (aggregation across persons) is not automatic; it relies on a specific structural analogy between persons and states of the world.

  Below is a breakdown designed for your reading group. I will start by validating and correcting your statement of the theorem, then provide the board example, then tackle the intuition, and finally adjudicate the two challenges and the Arrow comparison.

  ### 1. Correcting the Theorem Statement

  Your statement is mostly correct, but there is a crucial distinction often elided in the literature which is vital for your group (especially the philosophers).

  **The Aggregation Theorem** (the math part) states:
  If individuals $1 \dots n$ and Society satisfy vNM axioms over the same set of lotteries, and Society satisfies the **Pareto Condition** (if everyone prefers $L$ to $M$, Society prefers $L$ to $M$), then the Social Welfare Function $W$ is a linear combination of individual utilities:
  $$W = \sum_{i=1}^n a_i u_i + b$$

  **What the theorem does NOT do:** It does not tell you what the weights $a_i$ are. It does not tell you they are equal. It does not tell you they are positive (unless you specify the strength of Pareto).

  **The Impartial Observer Argument** (the moral part) is a *separate* step Harsanyi adds to fix the weights. He argues that if an observer behind a veil of ignorance assigns equal probability to being any individual, then $a_i$ must be equal (assuming utilities are calibrated to a common scale).

  **Correction on Pareto Strength:**
  *   **Pareto Indifference:** ($\forall i, u_i(L) = u_i(M) \implies W(L) = W(M)$). This yields $W = \sum a_i u_i + b$. The weights $a_i$ can be **negative**.
  *   **Weak Pareto:** ($\forall i, u_i(L) \ge u_i(M) \implies W(L) \ge W(M)$). This forces weights $a_i \ge 0$.
  *   **Strong Pareto:** (Add strict preference). This forces weights $a_i > 0$.

  **Meaning of Negative Weights:** Yes, a negative weight implies "spite" or "malevolence." It means that, holding everyone else constant, making Person $i$ better off makes the Social Outcome *worse*. Weak Pareto rules this out.

  ### 2. The Board Example (2 Persons, 2 Outcomes)

  Draw this on the board to ground the linearity intuition.

  **Setup:**
  *   **Persons:** Alice ($A$) and Bob ($B$).
  *   **Outcomes:** $x$ (Alice gets the cake), $y$ (Bob gets the cake).
  *   **Utilities:** Calibrated such that $u_A(x)=1, u_A(y)=0$ and $u_B(x)=0, u_B(y)=1$.
  *   **Lottery $L$:** A coin flip. 50% chance of $x$, 50% chance of $y$.

  **Individual Evaluations (vNM):**
  *   Alice's Expected Utility: $EU_A(L) = 0.5(1) + 0.5(0) = 0.5$.
  *   Bob's Expected Utility: $EU_B(L) = 0.5(0) + 0.5(1) = 0.5$.

  **The Crucial Question:** How does Society value $L$?

  **Step 1: The Pareto Constraint on Sure Outcomes**
  *   Outcome $x$: Alice prefers it to $y$. Bob prefers $y$ to $x$. Pareto is silent here (they disagree).
  *   But imagine a third outcome $z$ where *both* get nothing ($0,0$). Both prefer $x$ to $z$ and $y$ to $z$. So Society must prefer $x$ and $y$ to $z$.

  **Step 2: The vNM Constraint on Society (The "Sleight of Hand")**
  The vNM **Independence Axiom** applied to *Society* requires that Society's utility for a lottery is the *probability-weighted average* of the utilities of the outcomes.
  $$W(L) = 0.5 \cdot W(x) + 0.5 \cdot W(y)$$

  **Step 3: The Aggregation**
  Because of the Pareto condition, $W(x)$ must depend positively on $u_A(x)$ (since only Alice cares) and $W(y)$ on $u_B(y)$.
  If we assume symmetry (or just look at the structure), $W(x)$ essentially captures Alice's gain, and $W(y)$ captures Bob's gain.
  $$W(L) = 0.5 \cdot (\text{Value of Alice Winning}) + 0.5 \cdot (\text{Value of Bob Winning})$$
  $$W(L) = 0.5 \cdot u_A(x) + 0.5 \cdot u_B(y)$$
  $$W(L) = 0.5(1) + 0.5(1) = 1$$

  **The Intuition:**
  Notice that $W(L)$ equals the **sum of expected utilities** ($0.5 + 0.5 = 1$).
  Why? Because vNM linearity forces Society to treat the *probability* of Alice winning exactly the same way Alice treats the *probability* of Alice winning.
  *   Alice values the 50% chance of cake as half a cake.
  *   Society values the 50% chance of Alice getting cake as... half the value of Alice getting cake.
  *   Because this holds for all probabilities, the only function that satisfies this for both persons simultaneously is the **sum**.

  ### 3. Gut-Level Mechanism: Why Risk Implies Aggregation

  You asked: *Why do conditions about coherence under risk end up saying anything about aggregating interests?*

  **The Short Answer:** They don't, unless you assume Society is "risk neutral" with respect to utility distributions.

  **The Long Answer:**
  The theorem works because it treats **Persons** mathematically like **States of the World**.
  1.  **Individuals** maximize Expected Utility: They sum (Probability $\times$ Utility) across *States*.
  2.  **Harsanyi's Society** maximizes Expected Welfare: It sums (Probability $\times$ Welfare) across *States*.
  3.  **Pareto** links Welfare to Individual Utility.

  If Society satisfies vNM axioms, it cannot care about *how* utility is distributed across the states of the lottery, only the *expected total*.
  *   Consider Lottery 1: 50% chance (Alice 10, Bob 0), 50% chance (Alice 0, Bob 10). Expected Total Utility = 10.
  *   Consider Lottery 2: 100% chance (Alice 5, Bob 5). Expected Total Utility = 10.

  A vNM-rational Society **must be indifferent** between Lottery 1 and Lottery 2. Why? Because the expected utility of the sum is the same.
  If Society *prefers* Lottery 2 (because it's equal), Society violates the **Independence Axiom**. It is displaying "inequality aversion."
  **Inequality aversion is a form of risk aversion over utility.**
  Harsanyi's theorem assumes Society is **risk neutral over utility**. That is the "real work." It assumes that spreading utility across people (in Lottery 1) is morally equivalent to spreading utility across time/states for one person. It bans the intuition that "a sure 5 is better than a gamble between 10 and 0" when applied to social distributions.

  ### 4. Adjudicating the Challenges

  #### Challenge 1: Unequal Probabilities (Life Years vs. Persons)
  *The Claim:* An impartial observer might assign higher probability to being a long-lived person, weighting them more heavily.

  *The Adjudication:* **This is correct, but it happens outside the Aggregation Theorem.**
  1.  **The Theorem is Silent:** The Aggregation Theorem ($W = \sum a_i u_i$) does not dictate the weights $a_i$. It only says *if* you have weights, it must be a sum.
  2.  **The Impartial Observer:** To get weights, Harsanyi invokes the Veil of Ignorance. If the Observer assigns probability $p_i$ to being person $i$, then $a_i \propto p_i$.
  3.  **Person-Slices:** If the Observer defines "being a person" as "being a person-year," then yes, long-lived people get more weight. If the Observer defines it as "being a biographical life," they get equal weight.
  4.  **Conclusion:** The framework accepts this. The choice of "what counts as an individual" (whole lives vs. temporal slices) is a prior metaphysical/ethical decision, not settled by the math. The theorem simply transmits whatever probabilities the Observer holds into social weights.

  #### Challenge 2: Risk Aversion & Prioritarianism
  *The Claim:* Behind the veil, I would be risk-averse (prioritarian), preferring a lower expected welfare to avoid being the worst off. This refutes Harsanyi.

  *The Adjudication:* **This is a rejection of the premises, not a refutation of the theorem.**
  1.  **The Confusion:** The group member is conflating *risk aversion over goods* with *risk aversion over utility*.
      *   vNM utilities already encode risk aversion over *goods*. (If I prefer \$5 for sure over a 50/50 of \$0/\$10, my $u(\$)$ is concave).
      *   Harsanyi's theorem assumes Society maximizes **Expected Utility**. This implies Society is **risk neutral over utility**.
  2.  **Prioritarianism:** Prioritarianism says maximize $\sum g(u_i)$ where $g$ is concave. This is mathematically equivalent to Society being **risk averse over utility**.
  3.  **The Verdict:** If the group member says, "I want to maximize the expectation of a concave transformation of utility," she is saying, "I want Society to violate the vNM Independence Axiom."
      *   She is not proving Harsanyi wrong.
      *   She is arguing that the **Social Welfare Function should not satisfy the vNM axioms.**
      *   Specifically, she is arguing for **Ex Post Prioritarianism** (evaluate equality in each state, then average) vs Harsanyi's **Ex Ante Utilitarianism** (average utilities, then sum).
      *   Harsanyi's theorem holds *if* you accept Society must be vNM-rational. The Prioritarian rejects that axiom for Society.

  ### 5. Harsanyi vs. Arrow: Substantive or Verbal?

  *The Question:* Is the escape from Arrow's Impossibility Theorem real, or just a change of formalism?

  *The Answer:* **It is substantive, based on Informational Richness.**

  1.  **Arrow's Assumption:** Preferences are **Ordinal**. We only know $A \succ B$. We cannot compare the *intensity* of A's preference to B's. We cannot compare A's utility to B's utility.
  2.  **Harsanyi's Assumption:** Preferences are **Cardinal** (vNM utilities). We know *how much* A prefers $A$ to $B$ (via risk trade-offs).
  3.  **The Escape:** Arrow's impossibility arises because there is no "common currency" to trade off interests. Harsanyi provides a common currency: **Probability**.
      *   Because $u_i$ are unique up to affine transformation, the *ratio of utility differences* is meaningful for each person.
      *   Harsanyi's Impartial Observer argument adds **Interpersonal Comparability of Level and Unit** (by fixing the zero at non-existence and the unit at a standard gamble).
  4.  **Is it Verbal?** No. It is an admission that you cannot derive a social ordering from ordinal preferences alone (Arrow). If you add the information contained in cardinal, interpersonally comparable utilities, the impossibility disappears.
      *   *Caveat:* The Aggregation Theorem *alone* doesn't solve the scaling problem (the $a_i$ and the zero-points of $u_i$ are still flexible). You need the Impartial Observer story to fix the scale.
      *   *Conclusion:* The escape is real, but it comes at the high cost of assuming we can meaningfully measure and compare utility intensities across persons, which Arrow explicitly ruled out as inadmissible.

  ### Summary for Your Presentation

  1.  **The Mechanism:** Linearity begets linearity. If Individuals and Society both evaluate lotteries linearly (vNM), and Society respects Individuals (Pareto), Society must sum Individual Utilities.
  2.  **The Cost:** This requires Society to be **risk-neutral over utility**. It bans ex-post inequality aversion. If you care about equality of outcome, you must reject the vNM axioms for Society (Challenge 2).
  3.  **The Weights:** The Theorem does not give equal weights. That comes from the Impartial Observer argument. If the Observer weights person-years, the theorem accepts that (Challenge 1).
  4.  **Arrow:** Harsanyi escapes Arrow by assuming much richer information (cardinality + comparability). It is not a trick; it is a trade-off. You get a possibility theorem by assuming the data that Arrow said we don't have.

  **Where the Theorem is Silent:**
  *   It does not tell you how to calibrate the zero and unit of individual utilities (needed for the weights to be meaningful).
  *   It does not tell you what the weights $a_i$ are (needs the Impartial Observer).
  *   It does not tell you whether Society *ought* to satisfy vNM axioms (needs moral argument against Prioritarianism).
