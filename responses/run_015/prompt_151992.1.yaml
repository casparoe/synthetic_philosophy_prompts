answer: |-
  The institutional practice you describe enacts a pragmatic synthesis of philosophy of mind that is common in engineering ethics but rarely subjected to ontological scrutiny. To analyze its commitments, we must distinguish between the *functional role* intentional vocabulary plays in safety governance and the *moral status* required for liability.

  **Ontological and Functional Commitments**
  Strictly speaking, the board’s mandate presupposes that derived intentionality is **causally explanatory** rather than merely decorative. By requiring intentional descriptions (e.g., "the system believes...") as *necessary transparency disclosures* rather than metaphors, the protocol commits to the view that these predicates track real, stable behavioral patterns that mechanistic descriptions might obscure. This presupposes a form of **functional realism**: the system’s "beliefs" and "desires" are real enough to impact safety outcomes, even if they are not grounded in biology. However, by denying moral agency, the board simultaneously presupposes that **moral responsibility requires original intentionality** (or at least consciousness/sentience). Thus, the practice commits to an ontology where intentionality is gradable or bifurcated: it can be robust enough to govern prediction and safety without being robust enough to ground blame.

  **Dennett vs. Searle**
  This practice aligns much more naturally with **Dennett’s Intentional Stance** than with Searle’s Biological Naturalism.
  *   **Dennett:** For Dennett, beliefs and desires are "real patterns" discernible from the intentional stance. A system has derived intentionality if treating it as a rational agent yields predictive success. The board’s requirement fits this perfectly: the intentional vocabulary is mandated because it is explanatorily robust and necessary for prediction, yet Dennett explicitly denies that this requires "intrinsic" or magical aboutness, preserving the denial of moral agency.
  *   **Searle:** A strict Searlean would struggle with the "not metaphorical" clause. For Searle, if the system lacks a biological substrate, attributing "belief" is literally false unless understood as observer-relative metaphor. The board could accommodate Searle only by interpreting "necessary transparency" as "necessary for *human* cognitive processing," thereby shifting the intentionality entirely to the observers (the auditors) rather than the system. However, the phrasing suggests the disclosure is about the *system*, which contradicts Searle’s claim that syntax alone cannot constitute semantics.

  **Internal Coherence and Intermediate Status**
  The practice is internally coherent provided one accepts a distinction between **predictive agency** and **moral agency**. It posits an intermediate status for derived intentionality: it is more than a fiction (because it is mandated for safety, implying causal relevance) but less than original aboutness (because it cannot hold liability). This intermediate status is philosophically viable under **functionalism** or **pragmatic realism**, where mental states are defined by their causal roles within a system rather than their substrate. The incoherence would only arise if one held that *any* genuine intentionality necessarily entails moral responsibility, a view few philosophers of mind currently defend.

  **Presupposed vs. Accommodated vs. Underdetermined**
  *   **Strictly Presupposed:** The practice presupposes that intentional vocabulary is **indispensable for risk assessment** (instrumental necessity) and that **consciousness is a necessary condition for moral liability** (ethical boundary).
  *   **Merely Accommodated:** It accommodates **Dennett’s interpretivism** (derived intentionality is real patterns) and **Instrumentalism** (intentional terms are tools for prediction). It struggles to accommodate strict **Searlean realism** without reinterpreting the mandate as purely about human cognition.
  *   **Philosophically Underdetermined:** The practice leaves undefined the **ontological threshold** where derived intentionality might become dangerous. It does not specify whether the "beliefs" reside in the weights of the model, the interaction with the user, or the institutional framing. Furthermore, it remains underdetermined whether the "necessity" of the descriptions is *epistemic* (humans can’t understand the system otherwise) or *ontic* (the system actually operates via these states).

  Verdict: The practice is pragmatically coherent insofar as it decouples predictive intentionality from moral agency, yet it remains metaphysically unstable by mandating realist-sounding descriptions without committing to the ontology that typically grounds them.
