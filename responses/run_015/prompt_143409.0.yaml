answer: |-
  This is one of the oldest and deepest problems in philosophy. You are essentially asking about the difference between **ontology** (what exists) and **normativity** (what matters/reasons for action).

  Your intuition is oscillating between two major philosophical camps: **Subjectivism** (value requires a subject/valuer) and **Objective Realism** (value exists independently of valuers).

  Here is the breakdown of your cases, the trap in your math example, and a recommendation on which gut feeling to drop to find consistency.

  ### 1. The Math Trap: Truth vs. Reasons
  You asked: *"2+2=4 is true even with no people. Is truth itself a reason, or just a fact?"*

  This is the key to unlocking your confusion. **Truth is not a reason.**
  *   **Fact:** "The asteroid is hitting the mountain." (True regardless of humans).
  *   **Reason:** "You ought to stop the asteroid." (Requires a "you" and an "ought").

  Math describes the structure of reality. It exists without minds. But *reasons* are prescriptive; they tell us what to do or what to care about. A reason implies a relationship between a fact and a goal. If there are no beings with goals, there are no reasons, even if mathematical truths still hold.

  **Verdict:** Drop the idea that mathematical truth proves moral reasons exist. Truth can float; reasons usually need an anchor.

  ### 2. The Unifying Principle: "The Capacity for Experience"
  If you want the cleanest, most logically consistent principle that fits 90% of human intuition, it is this:

  > **Principle:** Reasons only exist where there is the *capacity for experience* (sentience) or the *potential for it*.

  Let's run your cases through this filter:
  *   **Kicking a rock:** Rock has no capacity for experience. No reason not to do it. (Matches your gut).
  *   **Kicking a dog:** Dog has capacity for experience (pain). Reason not to do it. (Matches your gut).
  *   **Destroying the painting:** If *no one ever* sees it (no potential observers), there is no experience to be had. Therefore, no reason not to destroy it.
  *   **Asteroid on mountains:** Mountains don't feel. If no one is around to see them go, no experience is lost. No reason to stop it.

  **What this says about your Painting Case:**
  Your conflict comes from conflating **Beauty** (a property) with **Value** (a relationship).
  Under this principle, beauty is like color. If there are no eyes, is the rock "red"? Physically, it reflects certain wavelengths. But "redness" is an experience created by a brain. Similarly, "beauty" is an experience created by a mind. Without a mind, the painting is just arranged pigment. It has structure, but no *value*.

  **Which gut feeling to drop?**
  If you choose this principle, you must drop the intuition that *"beauty is its own reason."* You have to accept that a universe with no conscious beings is a universe without value, good, bad, or reasons. It is just stuff happening.

  ### 3. The Alternative Principle: "Intrinsic Value"
  There is a second principle, but it requires heavier metaphysical baggage.

  > **Principle:** Certain states of affairs (beauty, complexity, diversity) are objectively good, regardless of whether anyone experiences them.

  This is often called **Moorean Value** (after G.E. Moore). It argues that a beautiful world is *better* than an ugly world, even if no one is there to see it.

  *   **Pros:** It validates your feeling that destroying the painting or the mountains is "wrong." It gives the universe meaning independent of us.
  *   **Cons:** It is hard to explain *why* it matters. If pain is bad because it *hurts*, what makes ugliness bad if it doesn't *bother* anyone? It posits "floating reasons" that don't attach to any being.

  **Which gut feeling to drop?**
  If you choose this principle, you must drop the intuition from the Rock/Dog cases that reasons are *tied to feeling*. You have to accept that reasons can exist in a void, detached from any consciousness.

  ### 4. The Verdict: Which Path to Take?

  You asked for a clean principle and advice on which gut feeling to drop.

  **The Recommendation:**
  Adopt **The Capacity for Experience** principle. Drop the intuition that *"beauty is its own reason."*

  **Why?**
  1.  **Explanatory Power:** It explains the dog (pain is an experience) and the rock (no experience) perfectly.
  2.  **Parsimony:** It doesn't require you to believe in "ghostly values" floating around the universe waiting to be found. It grounds ethics in biology and psychology.
  3.  **The "Who Cares?" Test:** You asked regarding the asteroid: *"Is there a reason that shouldn't happen? I feel like maybe yes? But then for who?"*
      *   That "for who?" is the killer question. If you can't answer "for who," you can't answer "why."
      *   If you say "It matters for the Universe," you are treating the Universe like a person. It isn't.

  **Resolving the Painting Conflict:**
  The reason you feel conflicted about the bunker painting is likely because you are imagining *yourself* knowing about it.
  *   If *you* know it exists, destroying it hurts *you* (you lose the knowledge/potential).
  *   If *no one* knows it exists, and *no one ever will*, your intuition that it is "bad" is likely a projection. You are valuing it *now*, and you can't imagine a world where that value doesn't exist.

  **Summary:**
  *   **Truth (Math)** exists without minds.
  *   **Reasons (Value)** require minds.
  *   **The Principle:** Reasons are tethered to the capacity for experience.
  *   **The Sacrifice:** You must accept that if the last human dies, the destruction of the Louvre is no different than the crushing of a rock. It is sad *to us*, but not sad *in itself*.

  This feels cold, but it is the only way to keep your logic from fracturing. Value is a light that consciousness shines on things; without the light, the things are still there, but they aren't "valuable."
