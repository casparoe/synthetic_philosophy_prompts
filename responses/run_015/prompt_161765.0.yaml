answer: |-
  Here is a menu of distinct readings of the "never again" slogan in the context of the 2011 Libya intervention, broken down by what is being prohibited, who is bound, and whether the claim supports your classmate's conclusion (that intervention was mandatory *and* regime change was permissible).

  ### 1. The Atrocity Prevention Reading
  *   **The Claim:** The specific event—a ruler threatening to massacre the population of a rebel-held city (Benghazi)—must not be allowed to happen.
  *   **What counts as "Again":** Any imminent mass killing of civilians by a state actor against their own people, analogous to Srebrenica or Rwanda.
  *   **Who is Bound:** The "international community" (abstractly), operationalized through the UN Security Council.
  *   **Verdict:** **Platitude.** No serious moral framework argues that massacres are *good*. Everyone agrees the atrocity itself should not recur.
  *   **Does it justify intervention?** **Weakly.** It establishes a *goal* (stop the massacre) but not a *method*. It does not prove military force was the only option, nor does it prove that stopping the massacre required removing Qaddafi.
  *   **Does it justify regime change?** **No.** You can stop a specific massacre without toppling the government threatening it (e.g., via no-fly zones or negotiated ceasefires). This reading treats regime change as a separate, distinct political goal, not a humanitarian necessity.

  ### 2. The "No Passive Witness" Reading
  *   **The Claim:** The *inaction* of external powers in the face of known atrocities must not recur. The sin is not just the killing, but the watching.
  *   **What counts as "Again":** A repeat of the diplomatic paralysis seen during the Rwandan genocide.
  *   **Who is Bound:** Specifically the powerful states (NATO/UNSC members) who have the capacity to intervene but choose not to.
  *   **Verdict:** **Substantive and Defensible.** This is the core of the "Responsibility to Protect" (R2P) doctrine. It moves from "killing is bad" to "we have a duty to act."
  *   **Does it justify intervention?** **Yes.** If the duty is to not stand by, and diplomacy has failed, force becomes the required instrument.
  *   **Does it justify regime change?** **No.** The duty is to *protect civilians*, not to *fix the state*. Once the immediate threat to Benghazi was neutralized, the duty to "not stand by" was arguably fulfilled. Expanding the mission to regime change exceeds the specific duty generated by this reading.

  ### 3. The "Capable Agent" Reading
  *   **The Claim:** If a specific agent can prevent a catastrophe at a low cost to themselves, they are morally obligated to do so.
  *   **What counts as "Again":** Any situation where the cost-benefit analysis favors intervention but it doesn't happen.
  *   **Who is Bound:** The specific state or coalition that can act at the lowest cost (in this case, NATO/France/UK/US).
  *   **Verdict:** **Substantive.** This is a standard "duty of rescue" argument applied to international relations.
  *   **Does it justify intervention?** **Yes.** NATO had the capacity; therefore, they had the duty.
  *   **Does it justify regime change?** **Only if necessary.** This reading justifies *whatever is minimally required* to save the lives. If regime change was the *only* way to save civilians, it is justified. If it was a political choice made *after* civilians were safe, this reading condemns it as mission creep (wasting resources/risks beyond the duty of rescue).

  ### 4. The "Structural Threat" Reading
  *   **The Claim:** The *mechanism* of the threat must not recur. A dictator who has lost legitimacy and threatens his own people cannot be allowed to remain in power, because he *will* kill again.
  *   **What counts as "Again":** Not just the Benghazi massacre, but the continued existence of a predatory regime type.
  *   **Who is Bound:** The intervening coalition (they must finish the job).
  *   **Verdict:** **Controversial/Debatable.** This shifts from humanitarianism to political engineering. It assumes Qaddafi could not be contained or deterred short of removal.
  *   **Does it justify intervention?** **Yes.**
  *   **Does it justify regime change?** **Yes.** This is the **only** reading that supports your classmate's view that the slide into regime change was "at most a footnote." It argues that civilian protection and regime change were inextricably linked; you couldn't have the former without the latter.
  *   **Critique:** This is risky. It turns a humanitarian mandate into a justification for indefinite occupation or state-building, which undermines the legal basis of UN Resolution 1973.

  ### 5. The Forward-Looking Deterrence Reading
  *   **The Claim:** We must intervene here to signal to other dictators that the world will not tolerate mass atrocities, thereby preventing future atrocities elsewhere.
  *   **What counts as "Again":** Future atrocities in *other* countries (e.g., Syria, Iran) that might be prevented by the precedent set in Libya.
  *   **Who is Bound:** The global hegemon or coalition (to maintain credibility).
  *   **Verdict:** **Empirically False (Post-Hoc).** While theoretically defensible as a strategy, the historical record following 2011 does not support it.
  *   **Does it justify intervention?** **Conditionally.** Only if you believe the signal will work.
  *   **Does it justify regime change?** **Potentially.** A stronger signal (toppling a leader) might deter others more than a limited strike.
  *   **The Libya Verdict:** This reading relies on the intervention creating a norm. However, the years following Libya (specifically the paralysis over Syria) suggest the "Libya Model" actually made intervention *harder*. Russia and China felt burned by the mandate creep in Libya and subsequently vetoed intervention in Syria. Therefore, the "never again" deterrence claim failed; it arguably led to *more* standing by in subsequent crises.

  ### 6. The "Moral Consistency" Reading
  *   **The Claim:** We cannot claim to value human rights selectively. If we acted in Kosovo or Iraq, we must act in Libya, or our moral standing is void.
  *   **What counts as "Again":** Hypocrisy in foreign policy application.
  *   **Who is Bound:** Western liberal democracies specifically.
  *   **Verdict:** **Substantive but Secondary.** This is about the integrity of the intervener, not the safety of the victim.
  *   **Does it justify intervention?** **Weakly.** It explains *why* states feel pressure to act, but it doesn't prove it's the *right* thing to do for the Libyans.
  *   **Does it justify regime change?** **No.** Consistency requires matching the *level* of response to previous similar cases, not escalating it.

  ### Summary for Your Paper
  To defeat your classmate's "settled" conclusion, you should argue that they are conflating **Reading 2 (No Passive Witness)** with **Reading 4 (Structural Threat)**.

  *   **Reading 2** makes the intervention mandatory (we couldn't stand by), but it **does not** justify the regime change.
  *   **Reading 4** justifies the regime change, but it is a much heavier, more controversial claim that requires proof that Qaddafi could not have been stopped otherwise.

  By treating "never again" as a single claim, your classmate smuggles in the justification for regime change (Reading 4) under the cover of the uncontroversial duty to prevent massacres (Reading 1 & 2). Furthermore, if they are relying on **Reading 5 (Deterrence)**, the empirical aftermath of Libya (specifically the veto deadlock on Syria) suggests that reading is false: the "never again" promise in Libya made "never again" harder to fulfill elsewhere.
