  **Mara:** Okay, but think about the timeline. Ten years. Every day, a few molecules of the original clay are swapped out for this synthetic polymer stuff. Same weight, same shape, same color. By year ten, not a single clay molecule is left. But then—here's the kicker—they take all the removed clay, the stuff that was swapped out and buried, and they reshape it into a bowl.

  **Jules:** Right, I got the setup. It's Ship of Theseus but with art supplies.

  **Mara:** It's not just that tho. It's about what survives. At year ten, you've got the polymer thing looking exactly like the statue. And you've got the clay thing looking like a bowl. If the statue was identical to the clay, then when the clay becomes a bowl, the statue should be a bowl. But the statue is still standing there, looking like a statue. So the statue isn't the clay.

  **Jules:** Hold on. You're assuming the polymer thing *is* the statue. I'd say at year ten, you've got a replica. A perfect copy, sure, but numerically distinct. The original statue ceased to exist whenever the material constitution changed too much. Maybe at year five, maybe at year one. But definitely by year ten.

  **Mara:** But where's the cutoff? That's the sorites worry. If I swap one molecule on day one, it's the same statue. Right?

  **Jules:** Probably.

  **Mara:** So if it's the same statue on day one, and the same on day two... how does it suddenly become a *different* statue on day 3,652? Identity doesn't just vanish because you hit an arbitrary number. The persistence conditions for artifacts are about form and function, not the specific atoms.

  **Jules:** I hear you, but you're treating persistence like it's magic. Look, if persistence is just about form, then the clay bowl should count as the statue too, since the clay has the same history up until the swap. But you said it's a bowl. Why? Because the clay was reshaped.

  **Mara:** Exactly! The clay was reshaped into a bowl, so it's a bowl. The polymer kept the shape, so it's the statue. That proves the statue's identity tracks the form/history, not the matter. The clay could *become* a bowl, but the statue couldn't. That means they have different modal properties. Different properties, different objects. Leibniz's Law.

  **Jules:** Okay, but address this: If the polymer statue is the *original* statue, then the original statue is made of polymer. But the original statue was defined as a "clay statue" when it was commissioned. Did the sortal change mid-existence?

  **Mara:** The sortal is "statue," not "clay statue." The material is accidental.

  **Jules:** Is it tho? If I make a statue out of ice and it melts into water, then I freeze the water back into the shape, is it the same statue? Most people say no. Because the material continuity matters for certain kinds of objects. With the polymer swap, you're breaking material continuity entirely. You're not preserving the matter, you're replacing it.

  **Mara:** But you're preserving the causal chain. The polymer is added to maintain the structure. It's not like I destroyed it and built a copy. The structure persisted through the change.

  **Jules:** Structure isn't enough. Think about the clay bowl again. You said the clay becoming a bowl proves the clay isn't the statue. I agree. But it doesn't prove the polymer thing *is* the statue. It just proves the clay survived as clay. What if the truth is neither survived as the *original* statue? What if we just have statue-stages?

  **Mara:** Stages? Like temporal parts?

  **Jules:** Yeah. The year-one statue-stage is related to the year-two statue-stage, and so on. They're connected by similarity and causal dependence. But the year-ten stage isn't *identical* to the year-one stage. They're parts of a larger "statue-worm," but saying the worm is the same object as the first stage is misleading. When you reshape the clay into a bowl, you're just taking the discarded matter-stages and giving them a new form.

  **Mara:** But that kills modal properties. If the statue is just a worm of stages, then could the statue have survived being crushed?

  **Jules:** In some sense, yes. A different worm could have existed. But the actual worm we have is tied to what actually happened.

  **Mara:** See, that feels wrong. If I knew on day one that I was going to swap all the molecules, I'd say "I'm preserving the statue." If your stage theory is right, then I'm actually destroying the statue and building a new one slowly. But intuitively, restoration work doesn't destroy the artwork. If I restore a painting by replacing flaking paint, it's the same painting.

  **Jules:** Restoration keeps most of the original matter tho. This is total replacement. It's more like cloning. Look, here's my pushback on your modal point. You say the statue could have survived crushing?

  **Mara:** No, I say the statue *couldn't* survive crushing, but the clay could. That's the classic puzzle. I'm saying the statue *can* survive material replacement.

  **Jules:** Right. But if the statue can survive total material replacement, then what stops the clay bowl from being the statue? The clay has the same claim to history. The only difference is the polymer kept the shape. So you're saying shape is the only essential property.

  **Mara:** For artifacts? Yeah. Function and form.

  **Jules:** Then imagine this: What if at year ten, instead of making a bowl, they just left the clay in a pile? Is the polymer thing the statue then?

  **Mara:** Yes.

  **Jules:** Okay. Now what if they used the clay to make a second statue, identical to the first? Now you have two statues. Which one is the original?

  **Mara:** The polymer one. Because it maintained spatiotemporal continuity. The clay was disconnected, stored up, then reshaped.

  **Jules:** Aha. So continuity matters. Not just form.

  **Mara:** Continuity of structure, yeah.

  **Jules:** But the polymer isn't structurally continuous with the original clay molecules. It's a different substance holding the shape. You're prioritizing the macro-structure over the micro-constitution. I'm saying the micro-constitution anchors the identity. Once the anchor is gone, the ship has drifted. The polymer thing is a new object that inherits the role of the old one.

  **Mara:** But "inherits the role" sounds like you're admitting it serves the same function in our conceptual scheme. If it serves the same function, has the same history of display, same causal interactions... why deny identity? Just to save the intuition that matter matters?

  **Jules:** Because if matter doesn't matter, then I can replace every part of *you* with a robot component over ten years. Are you still you?

  **Mara:** ...Probably.

  **Jules:** (laughs) Okay, well, there you go. You're a four-dimensionalist about people but a hylomorphist about clay?

  **Mara:** No, I'm consistent! If psychological continuity makes me me, then structural continuity makes the statue the statue. The clay becoming a bowl breaks the structural continuity for the clay-object, so it's a bowl. The polymer keeps it, so it's the statue. The matter is just the vehicle.

  **Jules:** I think we're just disagreeing on whether "structure" can exist independently of "stuff." I don't think it can. You can't have a shape without something shaped. If the something changes entirely, the shape is technically a new instance.

  **Mara:** But instances aren't objects. The object persists *through* the instances.

  **Jules:** Maybe. Or maybe "object" is just a word we use for a stable sequence of instances. Either way, I'm not buying that the polymer thing is the *original* clay statue. It's a polymer statue that looks like the original.

  **Mara:** And I'm not buying that the original clay was ever the statue. The clay was just what the statue was made of. Once the clay left, the statue stayed. The clay becoming a bowl just confirms the clay was never the boss of the situation.

  **Jules:** Fair. But don't be surprised when the professor says you're begging the question on persistence conditions.

  **Mara:** Oh definitely. But hey, at least we agree the bowl is a bowl.

  **Jules:** Small victories. You want another espresso?

  **Mara:** Yeah, lets go.
