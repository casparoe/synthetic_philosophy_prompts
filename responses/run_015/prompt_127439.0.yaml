      *   *Friction Inversion:* This describes *successful* reform (e.g., "firefighter" vs. "fireman"). The old term becomes embarrassing.
      *   *Comparison:* Hofstadter *simulates* the friction women feel. Friction Inversion *describes* the friction required to kill a term. They are related but distinct. One is diagnostic, the other is mechanistic.
      *   *Non-Binary Application:* If we flip it to expose non-binary erasure... say, forcing "they" on binary people? It breaks because Hofstadter's trick relies on a symmetrical power dynamic (men vs women). Non-binary issues are about the *existence* of the category, not just dominance within a binary.
      *   *Liberties:* Hofstadter was a cognitive scientist. He cared about analogies. I'm treating him as a sociolinguist.
