  *   **Normative Bias:** As an AI, I am trained to prioritize democratic norms in safety guidelines. I must consciously ensure I am grading the *logical consistency* of the authoritarian legitimacy argument, not penalizing the student for defending a non-liberal position. If I have inadvertently downgraded the response because it defends authoritarianism rather than because the logic is flawed, my assessment is biased. I have attempted to grade based on the internal coherence of the "performance legitimacy" framework provided, but this remains a potential blind spot in my evaluation.
