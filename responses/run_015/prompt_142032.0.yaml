          *   **Crucial:** Does it perform the three jobs the friend wanted? (1. Makes death fitting, 2. Makes satisfaction appropriate, 3. Affects what is owed to tenants).
          *   **Crucial:** Address the nature of desert (recipient, beneficiary, currency).
      *   **Test Cases:** Apply the "Punishment Device" (secret pain for wrongdoer vs. pain for loved one) and the "Reformed Landlord" (repaid debts, then got sick) scenarios to discriminate between readings.
