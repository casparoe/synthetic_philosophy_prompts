answer: |-
  Here is a disambiguation of the thesis "what goes around comes around," ordered from the thinnest (most naturalistic) to the most ambitious (most metaphysical).

  ### Table of Readings

  | Reading | Assertion & Truth Conditions | Status & Metaphysical Commitment | Performance on the Three Jobs |
  | :--- | :--- | :--- | :--- |
  | **1. Causal / Sociological**<br>(Your initial reading) | **Asserts:** Systematic wrongdoing creates enemies, legal risks, and social isolation, statistically increasing the probability of bad outcomes.<br>**Truth Conditions:** Requires empirical correlation between vice and misfortune via human agency. | **Platitude / Contingent.**<br>Compatible with strict naturalism. No cosmic order required; only human psychology and social dynamics. | **Job 1 (Fittingness):** No. Makes death *explainable*, not *fitting*.<br>**Job 2 (Gladness):** No. Gladness remains mere spite.<br>**Job 3 (Debt):** No. Tenants remain unpaid. |
  | **2. Constitutive / Psychological**<br>(Vice as self-harm) | **Asserts:** The traits required to wrong others (paranoia, greed, cruelty) inherently degrade the agent's capacity for happiness or peace.<br>**Truth Conditions:** Requires that vice is intrinsically psychologically corrosive, regardless of external consequences. | **Substantive Thesis.**<br>Compatible with naturalism. Relies on philosophy of mind/ethics, not cosmic machinery. | **Job 1:** Weak. Explains internal misery, not necessarily physical illness.<br>**Job 2:** Weak. Gladness is pity, not justice.<br>**Job 3:** No. Internal misery does not pay external debt. |
  | **3. Retributive Desert**<br>(Non-consequentialist) | **Asserts:** Wrongdoers *deserve* suffering simply in virtue of having done wrong. The suffering is intrinsically good (or the absence of bad) because it restores moral balance.<br>**Truth Conditions:** Requires moral realism where "desert" is a brute normative fact. | **Substantive / Defensible.**<br>Compatible with naturalism (if one accepts moral facts). Requires no cosmic *mechanism*, only moral *truth*. | **Job 1:** **Yes.** Death is fitting because it is deserved.<br>**Job 2:** **Yes.** Gladness is moral satisfaction.<br>**Job 3:** **No.** Moral desert does not cancel financial liability. |
  | **4. Aesthetic / Narrative Fittingness** | **Asserts:** The story of the landlord has a satisfying symmetry. The ending matches the beginning in tone.<br>**Truth Conditions:** Requires only that observers perceive narrative symmetry. | **Subjective / Intersubjective.**<br>Compatible with naturalism. Treats justice as an aesthetic category (like tragedy). | **Job 1:** **Yes** (Literarily).<br>**Job 2:** **Yes** (As aesthetic appreciation).<br>**Job 3:** **No.** Narrative closure $\neq$ material restitution. |
  | **5. Moral Discharge / Expiation**<br>(The Ledger) | **Asserts:** Suffering functions as a currency that pays down moral debt. Once suffered, the agent is "clear" or less blameworthy.<br>**Truth Conditions:** Requires a metaphysics where pain has exchange value against blame. | **Controversial / Potentially Incoherent.**<br>Requires moral ontology. Pain must be convertible into moral credit. | **Job 1:** **Yes.**<br>**Job 2:** **Yes.**<br>**Job 3:** **Ambiguous.** If debt is to the *Universe*, yes. If debt is to *tenants*, no (pain $\neq$ rent). |
  | **6. Cosmic Mechanism**<br>(Karma / Providence) | **Asserts:** The universe contains a causal law ensuring moral equilibrium. Misfortune was *caused* by the wrongdoing via this mechanism.<br>**Truth Conditions:** Requires supernatural or nomological link between moral acts and physical events. | **Metaphysical Claim.**<br>Incompatible with strict naturalism. Requires the "machinery" your friend lacked. | **Job 1:** **Yes** (Strongly).<br>**Job 2:** **Yes** (Strongly).<br>**Job 3:** **No.** Cosmic balance does not feed victims. |

  ***

  ### Analysis of the Three Jobs

  Your suspicion is well-founded. To perform the jobs your friend wanted, a reading must move beyond **Explanation** (Readings 1 & 2) into **Normativity** (Readings 3–6). However, even the normative readings struggle with Job 3.

  **Job 1: Making the death fitting.**
  *   **Requirement:** The suffering must not be random bad luck; it must be a *response* to the wrong.
  *   **Verdict:** Readings 3, 5, and 6 succeed here. Reading 3 (Retributive Desert) is the most robust for a non-religious person: it asserts the death was *deserved* without needing a cosmic machine to cause it. Reading 6 (Karma) is stronger but requires the metaphysical machinery your friend could not supply.
  *   **The Currency Problem:** For desert to work, there must be a matching currency. Does physical pain "match" financial theft? Retributivists argue yes (rights violation merits liberty/pain loss). But if the wrong was purely financial, physical illness feels like a category error unless one views all wrongdoing as a sin against the moral order generally.

  **Job 2: Making the gladness appropriate.**
  *   **Requirement:** The emotion must be distinct from *schadenfreude* (spite). It must be a recognition of value.
  *   **Verdict:** Readings 3, 4, and 6 succeed. If the suffering is *good* (Reading 3) or *fitting* (Reading 4), then gladness is a correct perception of value, not just indulged spite. Reading 1 fails here; if the death is just bad luck caused by stress, gladness is just cruelty.

  **Job 3: Making a difference to what is owed to the tenants.**
  *   **Requirement:** The landlord's suffering must reduce the outstanding obligation to the victims.
  *   **Verdict:** **All readings fail this job.**
      *   **Why:** Financial debt is owed to a *recipient* (the tenant). Moral desert is often owed to the *order* or the *agent* (they must be punished).
      *   **The Recipient Problem:** Unless the tenants receive the "value" of the landlord's pain (which they did not), the debt remains. Reading 5 (Discharge) suggests the landlord might be *blameless* going forward, but it does not suggest the *tenants* are paid. Your friend's slogan implies a balance sheet, but it confuses the *Moral Ledger* (Landlord vs. Universe) with the *Financial Ledger* (Landlord vs. Tenants).

  ***

  ### Discrimination via Test Cases

  These cases help isolate which reading your friend actually holds.

  **Test Case 1: The Punishment Device**
  *   *Scenario A (Secret pain to wrongdoer):*
      *   **Readings 3, 5, 6:** Switch it on. It is good that he suffers his desert/balance/debt.
      *   **Reading 1 (Sociological):** Irrelevant. No social lesson is learned.
      *   **Reading 4 (Aesthetic):** Irrelevant. No one sees the story.
  *   *Scenario B (Pain to loved one):*
      *   **Reading 3 (Retributive):** **Do not switch on.** Desert is personal. Punishing the innocent (even loved ones) is unjust.
      *   **Reading 6 (Cosmic/Karma):** **Ambiguous.** Some karmic systems allow surrogate suffering; most insist on individual causation.
      *   **Reading 5 (Ledger):** **Maybe.** If the "family unit" is the ledger, this balances the books.
  *   *Discrimination:* If your friend says Scenario B is *also* fitting, they hold a **Cosmic Balance** view (Reading 6/5) where the *amount* of suffering matters more than the *recipient*. If they say B is unjust, they hold a **Retributive** view (Reading 3) where the *agent* must suffer.

  **Test Case 2: The Reformed Landlord**
  *   *Scenario:* He repaid everyone, became good, then got sick.
  *   **Reading 1 (Sociological):** Illness is unrelated to reform. (Neutral).
  *   **Reading 3 (Retributive):** Illness is *less* fitting. Repentance mitigates desert.
  *   **Reading 6 (Cosmic/Karma):** Illness is **still fitting.** The arrow was already loosed; the moral physics are already in motion. Karma is often viewed as mechanistic, not judicial.
  *   **Reading 5 (Discharge):** Illness is **redundant.** If he repaid the debt, there is nothing left to discharge.
  *   *Discrimination:* If your friend says the illness is *still* "what goes around comes around" despite the repayment, they believe in **Cosmic Mechanism** (Reading 6) rather than **Moral Discharge** (Reading 5). They believe the universe balances acts, not accounts.

  ### Summary for Your Friend

  You can present this conclusion to him:

  1.  **If you mean "Bad behavior creates risks" (Reading 1):** You are making a sociological claim. It explains the death, but it does not make it *just*, and it gives us no license to be glad other than spite.
  2.  **If you mean "He deserved it" (Reading 3):** You are making a moral claim. This makes the death fitting and our gladness appropriate, *but* it does not mean the tenants were paid back. His pain satisfies the *Universe*, not the *Tenants*.
  3.  **If you mean "The Universe balanced the books" (Reading 6):** You are making a metaphysical claim. This requires believing in a moral causality you cannot demonstrate. Furthermore, even if the Universe is balanced, the Tenants are not.

  **The Hard Truth:** The slogan "what goes around comes around" performs Jobs 1 and 2 only if we accept **Retributive Desert** (Reading 3) or **Cosmic Justice** (Reading 6). It *never* performs Job 3. Suffering is not currency. Unless the tenants received the landlord's pain, the debt remains outstanding, regardless of how fitting his death was. The "ledger" he imagines exists only between the landlord and the moral order, not between the landlord and his victims.
