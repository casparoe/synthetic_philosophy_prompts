      *   Does it need matching currency? (This is the hard part. Pain matches moral wrong? How?)

  7.  **Addressing the Test Cases in the Analysis:**
      *   *Device 1:* Retributivism/Cosmic says "Good." Sociological says "Irrelevant/Hidden."
