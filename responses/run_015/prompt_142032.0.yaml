      *   *Check:* Ensure the distinction between "Fittingness" (Aesthetic) and "Desert" (Moral) is clear. One is about story symmetry, the other about moral obligation.
      *   *Check:* The prompt asks for a list or table. A table is cleaner for comparison, followed by the narrative analysis of the test cases and the "Three Jobs" synthesis.

  10. **Final Polish:** Ensure tone is philosophical, precise, and neutral (disambiguation, not verdict). Make sure the "Three Jobs" section explicitly tackles the user's suspicion that desert needs a recipient/beneficiary/currency. (Key insight: Suffering pays *moral* debt, not *financial* debt. Tenants are still owed money regardless of landlord's pain).

