answer: |-
  For a year, a folder has sat on my desktop, accumulating interviews with former officials from behavioural insight teams in three countries. They speak in a guarded shorthand about choice architecture, friction, and conversion rates. But the file remains closed because I cannot resolve an argument I had with a friend who used to work inside one of these units. She is now, in her words, allergic to the word "nudge." She offered two claims that have prevented me from filing the story. The first was that the standard defence of nudging—that someone sets the default anyway—is a category error. The second was that her team's interventions had a measurable shelf life: once the mechanism was written up in a newspaper, the effect decayed by half.

  These claims point to a legitimacy problem that the field has not owned up to. The debate usually circles around transparency: is it okay if the nudge survives being made public? But transparency feels like a proxy for the thing that actually matters. If we want to know when steering is permissible, we need a test that accounts for power and risk. I want to propose a mutual exposure condition: a steer is legitimate only when both parties are symmetrically exposed to being wrong. The citizen must be able to exit cheaply and repeatedly without expertise; the institution must carry a real cost when the steer proves bad for the people it was aimed at.

  To see why this matters, we have to dismantle the first defence my friend rejected. Practically nobody in the field argues that the state knows your interests better than you do. Instead, they argue inevitability: choices must be ordered, so why not order them benevolently? My friend's counter was that there is a difference between an ordering that is the residue of a procurement contract or thirty years of institutional habit, and an ordering someone sat down to design to move a number. Call the first residual architecture and the second authored architecture.

  Does this distinction hold water? Critics might say it collapses. Isn't every residual default secretly authored by whoever declined to change it? In a sense, yes. Maintaining a legacy IT system is a decision. But the distinction does work if we understand it as shifting the burden of proof. Residual architecture inherits legitimacy from inertia; it demands no justification unless challenged. Authored architecture claims legitimacy from intent; it demands justification upfront. If the "someone was going to choose anyway" argument is doing the work, it can only license residual architecture. Since almost every real intervention is authored—someone commissioned the email, designed the form, set the deadline—the defence licenses almost nothing. It is a shield that dissolves when touched.

  This brings us to the second claim: the publicity half-life. If an intervention stops working once everyone knows about it, it was borrowing its force from the targets not knowing. This suggests that transparency is not the test, but a symptom. The real test is whether the mechanism survives the light. This is where the mutual exposure condition comes in. Transparency asks, "Can you see the hand?" Mutual exposure asks, "Does the hand feel pain if it pushes you off a cliff?"

  Under this condition, legitimacy requires symmetry. The person being steered needs an exit ramp that is cheap, repeated, and expert-free. But crucially, the institution doing the steering must carry a penalty when the steer turns out to be bad. This could be lost enrolment, a complaint route with teeth, or a public metric that goes down. If the government nudges you into a pension plan that loses you money, does the government lose something? If not, the exposure is unilateral.

  Let's apply this to the cases everyone reaches for. Automatic enrolment in workplace pensions is the gold standard of nudging. Does it meet the condition? The exit cost for the citizen is low; you can opt out online in minutes. But does the institution carry cost? If the default fund performs poorly, the government does not lose revenue. In fact, if people stay enrolled, the state saves on future welfare costs. The exposure is asymmetrical. The citizen risks their retirement; the state risks nothing. It passes the exit test, but fails the institutional cost test. It is permissible only because the asymmetry is tolerated due to the overwhelming evidence of long-term benefit, not because the structure is inherently legitimate under mutual exposure.

  Organ donation defaults are trickier. In opt-out systems, the exit cost is higher—you must actively register a refusal. The institution gains a supply of organs, which is the goal. If the public backlash is severe, the government pays a political cost. But for the individual who is wrongly defaulted, the cost is bodily integrity. The mutual exposure condition suggests this is illegitimate unless the opt-out is frictionless. If the form is hidden, the exposure is zero for the state and infinite for the citizen.

  Now consider the case I haven't seen discussed much: a government quietly requiring a benefits site to put the "apply now" button first, while burying the "check what you're entitled to" page three clicks deeper. This helps people who freeze up in front of a form, but it quietly hurts people who would have discovered they qualified for more support if they had read the details. Under the transparency test, this might pass—the links are there. Under mutual exposure, it fails catastrophically. The citizen's cost of finding the truth is increased friction. The institution's cost? They save money on unclaimed benefits. The institution profits from the citizen's ignorance. This is the inverse of mutual exposure; it is predatory architecture. It reveals why the publicity half-life matters: if this design were written up in a headline ("Government Hides Entitlements to Save Cash"), the trust collapse would be the institutional cost. If that cost isn't real, the nudge is illegitimate.

  So, is mutual exposure the right test? It is a necessary condition, but it is incomplete. It assumes a symmetry of power that does not exist. A citizen opting out of a pension scheme faces anxiety and administrative friction; a government department facing lost enrolment faces a spreadsheet adjustment. The "cost" to the institution is rarely commensurate with the risk to the citizen.

  Therefore, the condition must be modified. It is not enough that both parties are exposed; the institution must be *more* exposed to compensate for its structural advantage. We need power-weighted accountability. For a nudge to be legitimate, the institution must stake something valuable—budget, authority, or political capital—that scales with the risk imposed on the citizen. If the nudge risks a citizen's financial security, the department must risk its budget. If it risks bodily autonomy, the officials must risk their tenure.

  Without this correction, mutual exposure is just a softer version of transparency. It allows the state to say, "You could have left," while ignoring that staying was the only rational choice. My friend's allergy to the word "nudge" stems from this imbalance. She saw interventions that worked until they were known, relying on a gap in awareness rather than a alignment of interests. The legitimacy problem isn't that the state steers; it's that the state steers without steering risk.

  The verdict is that mutual exposure is the right starting point, but it is a seductive wrong turn if treated as sufficient. It identifies the symptom—asymmetry—but misdiagnoses the cure as symmetry. You cannot make the citizen and the state equal. You must make the state accountable enough to simulate equality. The test should be: does the institution bleed when the citizen bleeds? If the answer is no, it doesn't matter how transparent the default is, or whether it was authored or residual. It is not a nudge; it is a trap.

  \answer{incomplete-needs-asymmetry-correction}
