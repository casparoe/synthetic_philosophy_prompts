      *   *Neuroscience:* The brain delays the conscious registration of the first dot until the second dot arrives to calculate motion. This suggests the "experience" of the first dot is generated *after* the second dot appears. This leans Stalinesque (delayed entry) but functionally feels Orwellian (revision of the past).
      *   *Dennett's Point:* It doesn't matter. There is no "moment of consciousness" to place the edit before or after.
