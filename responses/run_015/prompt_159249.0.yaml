answer: |-
  # Which Theory of Privacy Are You Actually Committed To?

  **Instructions:** Answer the following eight questions based on your intuitive judgment of the cases described. Do not worry about consistency; the tree will locate the theoretical commitments implicit in your answers.

  ### The Decision Tree

  **Node 1 (The Diary Case):** A houseguest photographs banal pages of your diary while you sleep, deletes the images, and never mentions it. You are never worse off (no embarrassment, no leverage lost). Was a wrong done to you?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  **Node 2 (The Camera Case):** A break-room camera records to a buffer overwritten every sixty seconds. It is never viewed, but everyone knows about it, and it stops gossip. Is this arrangement permissible solely because the net social outcome (less gossip) is positive?
  *   **Yes** → **Leaf: Welfare Reductionism**
  *   **No** → **Leaf: Rights-Based Reductionism**

  **Node 3 (The Hard Drive Case):** You buy a second-hand hard drive in good faith. It contains a stranger's medical scans. You open them. The stranger lost control of the drive accidentally. Did you violate the stranger's privacy by looking?
  *   **No** (Privacy was lost when control was lost) → **Leaf: The Control Account**
  *   **Yes** → Go to Node 4.

  **Node 4 (The Pharmacy Case):** A pharmacy's fully anonymized sales data is used to infer that residents of one building have a high rate of a stigmatized prescription. No individual is identified. Is a privacy concern raised?
  *   **No** → Go to Node 5.
  *   **Yes** → Go to Node 6.

  **Node 5 (The Camera Case):** Regarding the break-room camera: Since everyone knows about it (notice), is the concern about the recording resolved?
  *   **Yes** (Notice cures the intrusion) → **Leaf: The Access-Based Account**
  *   **No** → Go to Node 7.

  **Node 6 (The Pharmacy Case):** Regarding the pharmacy data: Is the concern raised because the *residents as a collective* have a claim, or because the *flow of information* breaches the norms of the context (sales data vs. health inference)?
  *   **The Collective has a claim** → **Leaf: The Group Control Account (Unnamed)**
  *   **The Flow breaches norms** → **Leaf: Contextual Integrity**

  **Node 7 (The Hard Drive Case):** Regarding the hard drive: If the stranger lost control, do you have a property right to look at what you bought, regardless of the content?
  *   **Yes** (Property rights trump) → **Leaf: Property-Priority Account (Unnamed)**
  *   **No** (Content restricts property rights) → Go to Node 8.

  **Node 8 (The Diary Case):** Regarding the diary: If the guest had not deleted the images but still never showed them to anyone, would the wrong be greater?
  *   **Yes** (Risk of access matters) → **Leaf: The Access-Based Account**
  *   **No** (The looking itself was the wrong) → **Leaf: The Access-Based Account (Intrinsic)**

  ***

  ### Logical Space and Empty Combinations

  The tree above maps the logical space generated by four axes: **Harm vs. Principle**, **Control vs. Access**, **Individual vs. Group**, and **Property vs. Privacy**.

  *   **Empty Combination (Incoherent):** *Group Reductionism.* A position claiming groups have privacy rights, but only instrumentally to prevent harm to individuals, is unstable. If the harm is only to individuals, the subject is the individual; if the harm is to the group's reputation, it ceases to be purely reductionist.
  *   **Empty Combination (Unexplored):** *The Group Control Account.* This leaf (Node 6) represents a view where groups hold control rights over data inferences similar to individuals. This is theoretically possible but rarely occupied; most group privacy theorists lean toward Contextual Integrity or harm-based accounts rather than a strict control model for collectives.
  *   **Empty Combination (Unattractive):** *Property-Priority Account.* (Node 7). This view holds that buying a medium grants absolute rights to its informational content. While legally common in some jurisdictions, philosophically it is unattractive to privacy theorists as it dissolves privacy into property law entirely.

  ### Separability Note
  **Flagged Pair:** *The Access-Based Account* and *The Access-Based Account (Intrinsic)*.
  The tree cannot genuinely separate these two leaves in practice. Both hold that access constitutes the violation; the distinction rests on whether *risk* of further access compounds the wrong. In almost all practical engineering or policy scenarios, these two positions yield identical recommendations.

  ***

  ### A Note on the Tree's Construction

  **Confidence in Leaf Placement:**
  I am highly confident in the placement of the **Reductionist** and **Control** leaves; the cases selected (Diary and Hard Drive) are canonical litmus tests for these views in the literature. I am moderately confident in the **Contextual Integrity** leaf; while the Pharmacy case is strong, some contextualists might argue the Reductionist path if no norm is clearly established. I am least confident in the **Group Control Account**; this is a theoretical placeholder. While logically distinct, it is unclear if any philosopher or engineer consistently holds that groups possess *control* rights (as opposed to *interests*) in the way individuals do.

  **Contested Readings:**
  A defender of the **Control Account** would likely contest the framing of **Node 3**. They might argue that the stranger did not *voluntarily* lose control, and thus the control claim persists even after the drive is sold. If they answer "Yes" to Node 3, they are pushed toward the Access or Contextual leaves, which mislabels their commitment. The tree assumes a "loss of control" implies "loss of privacy claim," which is the precise point a Control theorist might debate depending on the *mechanism* of loss.

  **The Weakest Branch Node:**
  I am least confident that **Node 5 (The Camera Case: Notice)** does the separating work assigned to it.
  *Reasoning:* Notice is often treated as a procedural fix for Access theorists, but Contextual Integrity theorists also value notice as part of establishing appropriate norms. A Contextualist might answer "Yes" to Node 5 (notice resolves the concern because the norm is now 'known monitoring'), while an Access theorist might also answer "Yes" (because the subject has been informed). Consequently, Node 5 risks funneling Contextualists into the Access-Based leaf, conflating *appropriate flow* with *consented access*. A more robust separator would require a case where notice is given but the context remains inappropriate (e.g., a known camera in a changing room), but the four cases provided constrain this distinction.
