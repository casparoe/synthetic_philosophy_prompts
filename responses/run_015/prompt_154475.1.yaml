answer: |-
  Here are ten questions designed to keep the conversation moving without letting your guest retreat into standard decision-theory boilerplate. I've kept the tone conversational but kept the teeth visible. For each, I've included the answer he's likely to give and a specific follow-up to keep the pressure on.

  ### 1. The "Coordination Rule" Objection
  **Question:** "Let's start with the mechanics. When you say I should cooperate because my opponent is running the same deliberation I am, it sounds like you're telling me to optimize only along the diagonal of the payoff matrix—where our choices match. But any game theorist can write down a rule that says 'maximize utility assuming symmetry.' What work is the *metaphysics* doing here? Is superrationality just a coordination rule with extra steps, or is there a causal—or acausal—link that rule misses?"

  *   **Likely Answer:** He'll say it's not a rule but a fact about logical correlation. Your decision *is* his decision because the algorithm is the same; you aren't coordinating, you're computing the same output.
  *   **Follow-up:** "Okay, but if I'm sitting in the room thinking, 'I'll choose C,' and I know he's thinking 'I'll choose C,' haven't I just assumed a correlated equilibrium? If I strip away the talk of 'shared deliberation' and just say 'assume correlation,' do I lose any predictive power? I'm trying to see if the machinery is explaining the correlation or just asserting it."

  ### 2. The "Logical Causation" Mechanism
  **Question:** "You often lean on the idea that my choice 'logically causes' his choice. In causal decision theory, I can't wiggle my hand and make the moon move. In your view, I can't wiggle my choice without wiggling his. But where does that constraint live? Is it in the physics, or is it just in the description of the agents?"

  *   **Likely Answer:** It lives in the abstract computation. If two calculators run `2+2`, they both get `4`. It's not physical causation; it's logical necessity.
  *   **Follow-up:** "But I'm not a calculator. I have noise. I have free will, or at least the feeling of it. If I decide to defect *despite* the logic, does the theory say I was irrational, or does it say I proved I wasn't running the same algorithm? Because if it's the latter, the theory seems unfalsifiable—anyone who defects just wasn't a superrationalist."

  ### 3. FDT and Renaming
  **Question:** "I have to ask about the modern descendants. Functional Decision Theory and Timeless Decision Theory seem to formalize exactly what you're describing. When you say 'superrationality,' are you offering a philosophical grounding for FDT, or do you think FDT is missing something that your revival captures?"

  *   **Likely Answer:** He'll likely say they are compatible, but he's focusing on the philosophical intuition rather than the formalism. He might say FDT gets bogged down in graph theory.
  *   **Follow-up:** "So if FDT already builds the 'diagonal constraint' into the decision graph, is your contribution primarily rhetorical? I ask because my listeners worry that 'superrationality' is just the user-friendly branding for a mathematical constraint that already exists. Is there a case where you and an FDT theorist prescribe different actions?"

  ### 4. The SINGLE/DOUBLE Variant (Setup)
  **Question:** "I want to test the symmetry requirement. Imagine the twenty-letter scenario again: one billion if exactly one person asks. But now, everyone gets a private slip. Ten get 'SINGLE,' ten get 'DOUBLE.' If a DOUBLE holder is the unique asker, they get two billion. Everyone knows the distribution is 10-10, but not who has what. You're a DOUBLE holder. What does superrationality tell you to do?"

  *   **Likely Answer:** He'll say you run the same function as everyone else, but the function takes the slip as an input. So $f(\text{DOUBLE})$ might differ from $f(\text{SINGLE})$.
  *   **Follow-up:** "So the deliberation isn't identical anymore. It's identical *structure*, but different *input*. If the function outputs 'Ask' for DOUBLE and 'Don't Ask' for SINGLE, haven't we just recreated a bargaining problem? The DOUBLEs are effectively claiming the prize over the SINGLEs."

  ### 5. The SINGLE/DOUBLE Variant (Fixed Point)
  **Question:** "Let's press that. If the superrational solution requires DOUBLEs to ask and SINGLEs to hold back, that maximizes the group's expected utility. But why should a SINGLE person accept that? They are running the same deliberation. If they reason, 'If I ask, and everyone else follows the same rule, nobody wins,' they hold back. But if they reason, 'The DOUBLEs are taking the pot,' don't they have an incentive to break the function?"

  *   **Likely Answer:** He'll argue that breaking the function breaks the superrational link. If a SINGLE defects, they are no longer superrational, and the correlation vanishes, likely leading to a crash where everyone defects.
  *   **Follow-up:** "But that sounds like a threat. 'If you don't defer to the DOUBLEs, the whole coalition collapses.' Isn't that just standard bargaining with a hostage situation? I'm trying to find where the 'rationality' ends and the 'power dynamics' begin."

  ### 6. The SINGLE/DOUBLE Variant (Symmetry Restoration)
  **Question:** "Suppose you argue that the symmetry is restored because everyone faces the same *probability* of being DOUBLE. So we all randomize. But if we all randomize with the same probability, we lose the efficiency gain of letting the DOUBLEs take the higher payout. Does superrationality force us to ignore the private information to preserve the symmetry of the algorithm?"

  *   **Likely Answer:** No, you should use the private information. The symmetry is in the *policy*, not the *action*. The policy is 'Ask if DOUBLE, Pass if SINGLE.'
  *   **Follow-up:** "But if the policy differentiates us, aren't we admitting that the 'shared deliberation' is weak? It's not 'I am him,' it's 'I am in a coalition with him.' And if it's a coalition, why aren't we just doing cooperative game theory with transferable utility?"

  ### 7. Partial Superrationality (The Mix)
  **Question:** "Let's break the room. Suppose only twelve of the twenty are superrationalists. The other eight are standard causal defectors who will ask for the money no matter what. Do the twelve superrationalists still coordinate with each other, or does the presence of the defectors dissolve the link?"

  *   **Likely Answer:** They condition on the probability. They treat the defectors as background noise. The twelve coordinate to maximize utility given the eight defectors are fixed.
  *   **Follow-up:** "So the twelve act as a bloc against the eight? That sounds like team reasoning. If superrationality degrades into 'coordinate with your tribe against the outsiders,' how is that different from standard group selection or cultural evolution?"

  ### 8. Partial Superrationality (Uncertainty)
  **Question:** "Here's the worry: To make that calculation, the twelve need to know *exactly* how many of them there are. If they don't know if they're 12 or 13, the fixed point shifts. Does the theory hand you no prescription until you know the exact composition of the room? Because in the real world, I never know who's reasoning like me."

  *   **Likely Answer:** You use a prior distribution over the number of superrationalists. You optimize over the expected value.
  *   **Follow-up:** "But if I'm optimizing over a distribution of *types*, aren't I just doing Bayesian updating on another agent's likely move? Where is the 'super' part? It sounds like you've reduced superrationality to 'have a good prior on your opponent's psychology.'"

  ### 9. The Loss Case (Falsifiability)
  **Question:** "I want to talk about failure modes. Give me a case where superrationality gives a clear answer, but it's an answer that leads to a guaranteed loss that everyone could have avoided by defecting. A money pump. If the theory tells me to walk into a fire because my 'logical twin' is walking into a fire, at what point do I say the theory is broken?"

  *   **Likely Answer:** He'll say that if the setup is truly symmetric and one-shot, the 'loss' is actually the best possible outcome given the constraints. If you defect, you break the symmetry and get a worse outcome.
  *   **Follow-up:** "But what if the setup is 'Everyone who reasons superrationally gets slapped'? If the correlation is negative—my reasoning like you *causes* you to get hurt—does superrationality tell me to stop reasoning? Because if the answer is 'yes,' the theory is self-effacing. If the answer is 'no,' it seems to value consistency over survival."

  ### 10. The "Should" Trap (Closing)
  **Question:** "Last one. You're the kind of philosopher who'll say 'It depends what you mean by *should*.' So I'm going to pin you down. I don't mean *should* as in 'morally good.' I mean *should* as in 'if I want to win, this is the move.' If superrationality prescribes a move that loses money in a specific, describable world—like the SINGLE/DOUBLE case where the SINGLEs get nothing—can you tell me *why* I should follow it, other than to keep my philosophical conscience clean?"

  *   **Likely Answer:** He'll try to argue that 'winning' is defined by the decision theory, not just the cash outcome. Or that in the long run (across logical possible worlds), you win.
  *   **Follow-up:** "I'm going to stop you there. My listeners are econ students. They care about the cash in *this* world. If your theory says 'Take the action that loses the cash here to win in the space of logical possibilities,' aren't you admitting this is a theology of rationality, not a tool for decision-making? If you can't point to a pile of money I get *here* that I'd miss otherwise, what's the pitch?"

  ***

  **Host Note:** The goal of Question 10 is to prevent the "normative vs. descriptive" dodge. If he says "Rationality isn't about winning," you have him on record saying the theory doesn't help you get what you want. If he says "It is about winning," you force him to explain where the money comes from in the SINGLE/DOUBLE variant. Either way, you avoid the seminar fog.
