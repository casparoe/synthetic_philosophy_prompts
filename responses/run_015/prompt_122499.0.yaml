prompt: |-
  I'm a print journalist who has covered evolutionary biology on and off for fifteen years, and I've been asked to run a forty-five-minute breakout session at a science-writers' conference this autumn on the units-of-selection dispute: genes, organisms, groups, and whatever else now puts in a claim to be a level. The room will be about twenty-five reporters, editors and freelancers, most of whom cover medicine, environment or technology and last studied biology at school, though two or three have serious genomics or conservation beats. There is a whiteboard and no projector, and a colleague who covers conservation told me last week she had assumed the whole thing was settled decades ago, so I suspect a good half of the room arrives in that state. What I need from you is not an explanation of the debate — I've read the popular treatments and I don't want another one — and not a bibliography or a list of names to read up on, which I have no time for. What I need is a plan for the forty-five minutes: the order the pieces have to come in and why, and in particular what has to be in place before phrases like 'gene's-eye view' or 'group selection' will mean anything to this audience at all, and why that thing cannot be skipped.

  The case I'm considering building the session around is a composite I've been playing with: a clonally transmissible facial tumour in a social, mongoose-like carnivore, passed between animals when they bite each other during feeding contests; the tumour lineage carries its own heritable variation, some lineages grow slowly and keep the host alive and sociable for longer and so reach more new hosts, faster-growing lineages outcompete them inside a single host, and the hosts in turn vary genetically in how readily they accept a graft. I want to know whether that should carry the whole session, and exactly what a carrying case has to have and — as importantly — lack to do this work: my worry is that it is already so strange that people will file it as a medical curiosity rather than see it as a lens on ordinary organisms, and I'm also unsure whether it is better to invent it or to anchor it to the clonally transmissible facial cancer in Tasmanian devils, given that my audience will trust a real story and may treat an invented one as a trick. Relatedly, here is the thought I actually want them to leave with, which I'd like you to check or correct: that much of this dispute is not a disagreement about what happens in nature but about how to do the accounting, that two researchers can partition the same change in the frequency of a trait in two different ways and both be right, and that the genuinely contested part is whether there are cohesive, heritable, variance-generating things above or below the organism at all. What I want them able to do afterwards is open a fresh 'cheater cells' or 'colonies as individuals' paper and ask whether it is reporting a new prediction or a new description. If that is the wrong target for forty-five minutes, tell me what to target instead.

  Then give me the misconceptions this audience will bring or form, in the order they will form them, and the point in the sequence where each should be headed off. My guesses, which I'd like you to correct and add to, are that they will hear 'group selection' as animals sacrificing themselves for the good of the species; that they will take kin selection and multi-level selection to be rival hypotheses with different predictions rather than, as I half-understand it, different ways of cutting the same cake; and that if I say genes are the units they will conclude organisms don't matter. Finally: one question I can put to the room in the last five minutes that would show me they can diagnose a new claim about levels of selection rather than merely repeat my vocabulary, together with the confidently wrong answer they are most likely to give so that I can tell the two apart; what I should openly refuse to explain at this level and say I'm refusing; and which of the ambitions above I should cut.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** Experienced print journalist (15 years covering evo bio), running a 45-min breakout session at a science writers' conference.
      *   **Audience:** ~25 reporters/editors/freelancers. Mostly medicine, environment, tech. High school biology level. 2-3 experts (genomics/conservation). Half think the debate is settled.
      *   **Constraints:** Whiteboard only (no projector). 45 minutes. No general explanations/bibliographies needed (user knows the stuff). Needs a *plan* (order, timing, rationale).
      *   **Core Content:** Units of selection dispute (genes, organisms, groups, etc.).
      *   **Proposed Case Study:** Composite of clonally transmissible facial tumor in social mongoose-like carnivore (biting during feeding contests). Tumor has heritable variation (slow vs. fast growth), hosts vary genetically in graft acceptance.
      *   **User's Goal/Thesis:** The dispute is often about *accounting* (partitioning variance), not necessarily different physical predictions. Real contest is about existence of cohesive, heritable, variance-generating entities above/below organism. Target skill: Distinguish new prediction vs. new description in papers.
      *   **Specific Needs:**
          1.  Evaluate the case study (keep/modify/anchor to Tasmanian devils?).
          2.  Validate/Correct the learning target (accounting vs. reality).
          3.  Session Plan (Order, timing, *why* certain concepts must precede others).
          4.  Misconception Management (Order of emergence, when to head off).
          5.  Final Diagnostic Question (Right vs. Confidently Wrong answer).
          6.  What to refuse to explain.
          7.  What ambitions to cut.

  2.  **Evaluate the Case Study (Tasmanian Devil vs. Composite):**
      *   *Composite (Mongoose-like):* Allows tailoring variables (biting during feeding, specific tumor traits). Risk: "Too weird," "Medical curiosity," "Doesn't apply to lions/humans."
      *   *Real (Tasmanian Devil):* High credibility. DFTD (Devil Facial Tumour Disease) is well-documented. However, DFTD is mostly fatal and doesn't have the *exact* multi-level nuance the user wants (tumor lineage selection *within* host vs. between hosts is real, but the host social structure nuance might get muddy).
      *   *Decision:* Anchor to Tasmanian Devils. It builds trust. The "mongoose" tweak risks the "trick" suspicion. The biology of DFTD *does* support the multi-level selection argument (tumor evolution vs. host evolution). The "social biting" is accurate enough for the analogy.
      *   *Requirement for a "Carrying Case":* It needs to clearly show *replication*, *variation*, and *heritability* at multiple levels simultaneously. It must avoid being seen as an exception. It needs to force the audience to ask "Who is winning?"

  3.  **Validate the Learning Target (Accounting vs. Reality):**
      *   *User's Thesis:* "Much of this dispute is not a disagreement about what happens in nature but about how to do the accounting... genuinely contested part is whether there are cohesive, heritable, variance-generating things above or below the organism at all."
      *   *Critique:* This is sophisticated and largely correct (Price Equation territory), but might be *too* abstract for a 45-min session with non-specialists. The "accounting" argument (Okasha, Lewontin) is the *resolution*, but the *conflict* feels real to biologists.
      *   *Adjustment:* Keep the target but simplify the phrasing. Focus on "Bookkeeping vs. Mechanism." The skill (Prediction vs. Description) is excellent.
      *   *Cut:* Don't get bogged down in the mathematical equivalence of Kin Selection vs. Group Selection (Hamilton vs. Wilson). That's a rabbit hole. Focus on the *ontological* claim (Is the group a thing?).

  4.  **Develop the Session Plan (45 Minutes):**
      *   *Constraint:* No projector. Whiteboard only. Needs interaction.
      *   *Phase 1: The Hook & The Trap (0-10 min).* Start with the Devil case. Establish the intuition that "Organism" is the unit. Show the crack in that intuition.
      *   *Phase 2: The Zoom In/Out (10-25 min).* Define the criteria for a "Unit of Selection" (Lewontin's 3 conditions: Variation, Heritability, Differential Fitness). Apply them to Cell, Organism, Group.
      *   *Phase 3: The Accounting Shift (25-35 min).* The core thesis. Show how the same math works both ways. Introduce the "Prediction vs. Description" test.
      *   *Phase 4: Diagnostic & Wrap (35-45 min).* The final question.

      *   *Crucial Pre-requisite:* Before "Gene's Eye View" makes sense, they need to understand *Replicator vs. Vehicle* (Dawkins/Hull) without using those jargon terms immediately. They need to grasp that selection requires *copying*. Before "Group Selection" makes sense, they need to grasp that groups must *reproduce* (fission/budding) or persist long enough to be selected.
      *   *Why not skip:* If you don't establish *heritability* at the group level, "Group Selection" sounds like altruism. If you don't establish *copying* at the gene level, "Gene's Eye" sounds like mysticism.

  5.  **Misconception Management:**
      *   *Misconception 1:* "Group selection = animals being nice." (Head off in Phase 1 by emphasizing *competition* between groups).
      *   *Misconception 2:* "Gene selection = organisms don't matter." (Head off in Phase 3 by distinguishing *unit of selection* from *unit of function*).
      *   *Misconception 3:* "It's settled." (Head off immediately by polling the room).
      *   *Misconception 4:* "Kin vs. Group are rival physical theories." (Address in Phase 3).

  6.  **The Diagnostic Question:**
      *   Need a scenario where the "accounting" view and the "ontological" view diverge in utility.
      *   *Scenario:* A paper claims "Coral reefs are selected units."
      *   *Wrong Answer:* "That's impossible, only genes are real." OR "That's true because corals help each other."
      *   *Right Answer:* "Do reefs reproduce with heritable variation? If yes, it's a valid model. If no, it's just a description of gene/organism selection."

  7.  **What to Refuse to Explain:**
      *   The Price Equation math.
      *   The history of the E.O. Wilson vs. Dawkins feud (gossip, not science).
      *   Inclusive Fitness calculus (rB > C).

  8.  **What Ambitions to Cut:**
      *   Convincing them one side is "Right." (The point is they are tools).
      *   Covering Cultural Evolution / Memes (Too distracting).
      *   Deep dive into the Tasmanian Devil immunology (Keep it functional).

  9.  **Refining the Case Study (Devil vs. Mongoose):**
      *   User worries about "Medical Curiosity."
      *   *Counter:* Cancer *is* the best example of within-organism selection. It forces the "Gene/Cell vs. Organism" conflict immediately.
      *   *Recommendation:* Use Tasmanian Devils. It's real. Acknowledge the weirdness, then pivot: "If selection happens here, where does it stop? What about mitochondria? What about ant colonies?"
      *   *Why:* Journalists trust real names. "Mongoose-like" sounds like a thought experiment that can be dismissed. DFTD is a conservation crisis they might know.

  10. **Drafting the Response:**
      *   Tone: Professional, peer-to-peer (journalist to journalist), direct, actionable.
      *   Structure: Follow the user's prompt structure (Plan, Case Study, Misconceptions, Diagnostic, Cuts).
      *   Emphasis: The "Accounting" thesis is strong but needs careful setup so it doesn't sound like "Nothing matters."

      *(Self-Correction during drafting)*: Wait, 45 minutes is very short. I need to be ruthless about timing. The "Accounting" insight is the hardest part. I need to make sure the Whiteboard work is simple. Maybe draw two columns: "Gene Bookkeeping" vs. "Group Bookkeeping."
      Also, the user asked *what has to be in place before phrases like 'gene's-eye view' will mean anything*. Answer: A clear definition of "Replication." Without copying, there is no selection.
      And *what the carrying case must lack*: It must not rely on "altruism" initially. Altruism confuses the issue with morality. It must be about *fitness differentials*.

      *Final check on the Diagnostic Question:* The user wants to know if they can diagnose a new claim.
      *Question:* "A paper argues that 'Gut Microbiomes' are units of selection because they affect host health."
      *Confidently Wrong:* "No, only the host's genes count."
      *Right:* "Do the microbiomes reproduce independently with heritable variation across host generations? If not, it's a description of host gene selection."

      *Wait, one more thing:* The user asked "What I need from you is not an explanation... What I need is a plan." I must ensure I don't lecture them on evo bio, but on *how to teach* evo bio.

      *Re-evaluating the "Accounting" Thesis:* Is it the right target? Yes, for journalists. They need to spot when a press release is hyping a "paradigm shift" that is actually just a mathematical reframing. This is media literacy for science writers.

      *Let's finalize the Plan Structure:*
      1.  **Case Study Verdict:** Use Devils, but frame carefully.
      2.  **Target Verdict:** Keep "Accounting," refine to "Model Utility."
      3.  **The Plan:** Minute-by-minute breakdown.
      4.  **Prerequisites:** Replication & Heritability.
      5.  **Misconceptions:** Timeline of errors.
      6.  **Diagnostic:** The Microbiome or Coral question.
      7.  **Refusals & Cuts.**

      *Wait, one nuance on the Case Study:* The user's composite includes "tumor lineage carries heritable variation... hosts vary genetically in how readily they accept a graft." This is *co-evolution*. This is perfect for Multi-Level Selection (MLS). I will advise sticking to the Devil reality but emphasizing these specific mechanics which *are* present in DFTD (strain variation, host resistance).

      *Let's write.*
answer: |-
  Here is the plan, the critique of your materials, and the diagnostic tools you requested.

  ### 1. The Case Study: Anchor to the Devil
  **Verdict:** Do not use the composite mongoose. Use the **Tasmanian Devil (DFTD)**.
  **Why:** Your audience are journalists. Their radar for "hypothetical scenarios" is tuned to detect evasion or oversimplification. A made-up animal invites them to question the premises ("But would that really happen?"). The Tasmanian Devil is real, endangered, and already covered by environmental reporters in the room. It grants immediate ontological weight.
  **The Risk:** You are correct that they will file it as a "medical curiosity."
  **The Fix:** You must explicitly *generalize* it in the first ten minutes. Do not start with the Devil. Start with the definition of a "Unit of Selection," then use the Devil as the *stress test* for that definition.
  **What the Case Must Have:**
  *   **Replication:** The tumor must copy itself (cell division).
  *   **Heredity:** Offspring tumors must resemble parent tumors (strain variation).
  *   **Competition:** Strains must compete for resources (host life).
  *   **What it Must Lack:** Do not lean on "altruism." Altruism triggers moral intuition ("good for the group") which clouds the mechanical definition of selection. Keep it about *growth rates* and *transmission*.

  ### 2. The Learning Target: Accounting vs. Reality
  **Verdict:** Your target is correct, but the phrasing is too academic for a 45-minute room.
  **Refinement:** Frame it as **"Map vs. Territory."**
  *   **The Territory:** The physical change in the world (e.g., more resistant devils survive).
  *   **The Map:** The mathematical model used to describe *why* (Gene-centric vs. Multi-level).
  *   **The Skill:** Can the writer identify if a new paper is claiming a new *Territory* (a new physical mechanism) or just a new *Map* (a different way to count the same mechanism)?
  *   **Why this works:** Journalists understand "spinning the numbers." This translates the Price Equation debate into media literacy.

  ### 3. The 45-Minute Plan (Whiteboard Only)

  **0:00 – 0:05: The Poll & The Trap**
  *   **Action:** Write "UNIT OF SELECTION" on the board. Ask for a show of hands: "Who thinks the individual organism is the primary unit of selection?" (Most will raise hands). "Who thinks it's the gene?" (Few). "Who thinks it's settled?" (Many).
  *   **Point:** Establish that the "consensus" is an illusion.
  *   **Prerequisite Concept:** Before you can say "Gene's Eye View," you must establish **Replication**. Write: *Selection requires copying.* If it doesn't copy, it can't be selected. This prevents the "organisms don't matter" error later; organisms don't copy themselves (sexually), genes do.

  **0:05 – 0:15: The Devil Stress Test (The "What")**
  *   **Action:** Draw a Devil. Draw a tumor cell. Draw a second Devil.
  *   **Narrative:** Briefly explain DFTD. It is a clonal cell line passed by biting.
  *   **The Pivot:** Ask the room: "When a fast-growing tumor kills a host before it bites another devil, what died? The devil? Or the tumor lineage?"
  *   **Point:** Force the realization that two things are reproducing here: The Devil (slowly) and the Tumor (quickly).
  *   **Prerequisite Concept:** Before "Group Selection" means anything, you must establish **Heritable Variance at that Level**. Write: *To select a Group, Groups must differ and pass traits on.* If groups are random collections, group selection is impossible. This heads off the "animals sacrificing for species" error.

  **0:15 – 0:30: The Bookkeeping Shift (The "How")**
  *   **Action:** Draw a line down the center of the board. Left: "Gene Account." Right: "Group Account."
  *   **Exercise:** Take one event (e.g., A devil with a 'resistant gene' survives a 'slow tumor' strain).
  *   **Left Side:** Describe it as 'Resistant Gene' outcompeting 'Susceptible Gene'.
  *   **Right Side:** Describe it as 'Resistant Host Group' outcompeting 'Susceptible Host Group' (where the 'group' is the host + its tumor lineage).
  *   **Key Insight:** Show that the *outcome* (frequency change) is identical. The *story* changes.
  *   **Point:** This is where you deliver your thesis: "This is not a fight about nature. It is a fight about which ledger is more useful for prediction."

  **0:30 – 0:40: The Diagnostic Tool (Prediction vs. Description)**
  *   **Action:** Introduce the "So What?" Test.
  *   **Concept:** If I switch from Gene View to Group View, do I predict something *new*?
      *   If **Yes**: It's a new biological claim (e.g., Group heritability exists).
      *   If **No**: It's a new description (e.g., Mathematical reframing).
  *   **Application:** Ask them to apply this to a headline like "Ant Colonies are Superorganisms." Is that a prediction or a description?

  **0:40 – 0:45: The Final Question & Wrap**
  *   **Action:** Pose the Diagnostic Question (see below).
  *   **Wrap:** Remind them that "Settled" is a story, not science.

  ### 4. Misconceptions: Order of Emergence & Interception

  1.  **"Group Selection = Altruism"**
      *   *When:* Minute 10 (mentioning Devils biting).
      *   *Correction:* Intercept immediately. "Do not think about kindness. Think about *differential survival*. A group where individuals fight less might simply eat more and reproduce more. No sacrifice required."
  2.  **"Gene Selection = Organisms are Robots"**
      *   *When:* Minute 20 (The Gene Account).
      *   *Correction:* Intercept by distinguishing *Replicator* vs. *Vehicle*. "The gene is the thing copied. The organism is the machine built to copy it. The machine matters immensely; it's just not the thing being copied."
  3.  **"Kin Selection and Group Selection are Rival Physics"**
      *   *When:* Minute 30 (The Bookkeeping).
      *   *Correction:* This is your core thesis. "They are like Celsius and Fahrenheit. They measure the same heat. Stop asking which is 'true' and ask which is 'useful'."
  4.  **"If it's rare (like Devil Tumors), it doesn't count"**
      *   *When:* Minute 15.
      *   *Correction:* "Mitochondria were once free-riding cells. Your body is a treaty of ancient conflicts. The Devil is not an exception; it is a spotlight on the rule."

  ### 5. The Diagnostic Question
  **The Question:**
  "A new paper claims that 'Human Cultural Tribes' are units of selection because tribes with brave warriors conquer tribes with cowardly warriors. Based on what we discussed, what is the *first* question you ask the author to determine if this is a new prediction or just a new description?"

  **The Confidently Wrong Answer:**
  "Is bravery genetic?" OR "Is war actually good for the species?"
  *(This shows they are still thinking about biological mechanism or morality, not the structural requirements of selection.)*

  **The Right Answer:**
  "Do cultural tribes reproduce with heritability?" OR "How is the 'bravery' trait copied from parent tribe to daughter tribe independently of the genes of the individuals?"
  *(This shows they understand that for a 'Group' to be a unit of selection, the Group itself must satisfy the Lewontin conditions: Variation, Heritability, Differential Fitness.)*

  ### 6. What to Refuse to Explain
  *   **The Price Equation:** Say explicitly: "There is a mathematical proof that shows these views are equivalent. I am not going to show it to you. You do not need the calculus to spot the story."
  *   **The History of the Feud:** Do not dwell on Dawkins vs. Wilson. It turns science into celebrity gossip.
  *   **Inclusive Fitness Calculus (rB > C):** It requires too much setup. Stick to "Heritable Variance."

  ### 7. Ambitions to Cut
  *   **Cut the "Settled" Debate:** Don't try to convince them the debate *isn't* settled. Acknowledge that many biologists act as if it is, and teach the writers to spot *when* a scientist is pretending it's settled to sell a paper.
  *   **Cut Cultural Evolution:** Keep the focus on biology. Once you mention memes, the room will fracture into "science vs. sociology." Keep it to Devils, Cells, and Ants.
  *   **Cut the "True Unit" Verdict:** Do not let the room vote on which unit is "real." The goal is to make them comfortable with *pluralism*. If they leave thinking "It depends on the question," you have succeeded.

  ### Summary of Critical Pre-requisites
  You asked what *must* be in place before phrases like "Gene's Eye View" work.
  1.  **Replication:** They must understand that selection is a copying process. Without copying, there is no "eye" to view anything.
  2.  **Heritability at the Level:** They cannot accept "Group Selection" until they accept that groups can have "offspring" (new groups) that resemble "parents" (old groups).
  3.  **Variance:** They must understand that if everyone is identical, selection cannot act.

  If you skip **Replication**, "Gene" sounds mystical.
  If you skip **Group Heritability**, "Group Selection" sounds like socialism.
  If you skip **Variance**, "Selection" sounds like destiny.

  Build those three on the whiteboard before you tell the Devil story.
