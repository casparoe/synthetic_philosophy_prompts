prompt: |-
  I sit on the editorial standards committee of a public broadcaster. We must rule on a three-part drama, *The Long Silence*, about Miriam Halloran (1938–2011), a real senior civil servant who anonymously passed documents to a journalist exposing the contamination of a town's water supply, destroying her own career in the process and being written out of the official account until a biography appeared some years after her death. The series is sympathetic, well sourced, and in most respects careful. Our difficulty is with two invented elements.

  First: a deathbed reconciliation with Halloran's estranged daughter Nell, her only surviving close relative. Nell has written to us stating that nothing of the kind occurred, that she was not at the bedside, and that the scene turns her own considered refusal into a failing she is shown to have repented. The writers point to an unsent letter found in Halloran's papers asking her daughter to come, and argue that the scene is therefore faithful to her inner life rather than fabricated. Second: a composite colleague, credited as such, to whom Halloran confides a religious crisis she never had; his scenes include lines adapted from a recorded 2007 interview in which Halloran said that she did not care to be thought well of, only that the story be got right. Our charter forbids presenting invented material as fact but says nothing about inventing material about real people. The papers were licensed, and the depiction approved, by Halloran's literary executor — a former colleague who is also a paid consultant on the series; Nell says his financial stake disqualifies him, and indeed the executor argues that a flattering invention cannot harm anyone.

  Draft the committee's decision memo, in British English. It should give a concrete recommendation — broadcast as it stands, require specified changes, impose a particular form of on-screen signalling, or withhold — with the reasoning Nell, the writers, and the executor could each respond to. It should engage seriously with the strongest case for the other side (including the thought that the dead are beyond being wronged, and that the portrait here is a kind one), say what weight, if any, our committee should give to the dead person's own stated wishes and to the objections of surviving relatives, and end with two or three criteria we could actually apply to future dramatizations of named people who are recently dead.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Editorial Standards Committee of a public broadcaster.
      *   **Task:** Draft a decision memo regarding a three-part drama, *The Long Silence*, about Miriam Halloran (1938–2011).
      *   **Key Issues:**
          1.  *Invented Deathbed Scene:* Reconciliation with estranged daughter Nell. Nell denies this happened and objects to the portrayal of her refusal as a failing she repented. Writers cite an unsent letter asking the daughter to come as justification for "inner life" faithfulness.
          2.  *Composite Colleague/Religious Crisis:* Halloran confides a religious crisis she never had. Lines adapted from a 2007 interview ("did not care to be thought well of...").
      *   **Stakeholders:**
          *   *Nell (Daughter):* Objects to both points. Claims executor has conflict of interest.
          *   *Writers:* Argue dramatic license, "inner life" faithfulness (unsent letter), composite character credited.
          *   *Literary Executor (Consultant):* Approved depiction, argues flattering invention harms no one.
      *   **Constraints/Guidelines:** Charter forbids presenting invention as fact but is silent on inventing material *about* real people. Papers licensed.
      *   **Output Requirements:**
          *   British English.
          *   Concrete recommendation (Broadcast, Change, Signal, Withhold).
          *   Reasoning addressing all parties (Nell, Writers, Executor).
          *   Engage with strongest counter-arguments (dead beyond wronging, flattering portrait).
          *   Address weight of dead's wishes vs. surviving relatives.
          *   End with 2-3 criteria for future cases.

  2.  **Determine the Decision:**
      *   *Option A: Broadcast as is.* Risks reputational damage, ignores living relative's trauma, sets bad precedent regarding "flattering lies."
      *   *Option B: Withhold.* Too severe. The core story is well-sourced and sympathetic. Public interest is high.
      *   *Option C: Require Changes.* The deathbed scene is the most problematic (directly contradicts living person's experience). The religious crisis is less harmful but still attributes false beliefs.
      *   *Option D: On-screen Signalling.* Necessary but insufficient on its own for the deathbed scene.
      *   *Selected Path:* Require specific changes to the deathbed scene (remove the reconciliation/repentance aspect) and mandate strong on-screen signalling regarding dramatization. The religious crisis might stay *if* clearly signalled as speculative, but given the specific quote misuse, it's safer to ask for modification there too. Let's aim for a nuanced position: The deathbed scene must be altered because it misrepresents a living person's actions. The religious crisis can remain *if* clearly framed as speculative interpretation, but the specific quote usage needs care.
      *   *Refined Decision:* Require removal of the specific claim that Nell repented/was present (protecting the living), and mandate a prominent disclaimer. The religious crisis is borderline but acceptable *if* the composite nature is explicit and the quote isn't misattributed to a fictional context that implies factual occurrence. Actually, to be firm on standards: The religious crisis attributes internal states to the dead that didn't exist. Even if "flattering," it's fabrication. However, the prompt asks for a *concrete recommendation*. The most defensible editorial stance for a public broadcaster is to protect the living relative from misrepresentation while allowing artistic interpretation of the dead *provided* it is signalled.
      *   *Final Decision:* **Require specified changes** to the deathbed scene (Nell's presence/repentance must be removed) and **impose a particular form of on-screen signalling** for the rest of the dramatization.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose and the programme.
      *   **Summary of Issues:** Briefly recap the two invented elements.
      *   **Deliberation & Reasoning:**
          *   *The Living vs. The Dead:* Distinguish between Halloran (dead) and Nell (living). The Charter protects against harm. Misrepresenting Nell's actions causes harm.
          *   *The "Flattering Invention" Argument:* Address the Executor's point. Truth matters more than flattery. A "kind lie" distorts history.
          *   *The "Inner Life" Argument:* Address the Writers' point. An unsent letter does not justify scripting a specific interaction that contradicts reality.
          *   *The Quote:* Using a real quote in a fictionalized religious context is misleading.
      *   **Weight of Wishes:** Halloran's wishes (via executor) vs. Nell's objection. The dead cannot be harmed, but their legacy is a public good. The living *can* be harmed.
      *   **Recommendation:**
          1.  Remove the depiction of Nell at the bedside/repentance.
          2.  Retain the composite character but ensure the religious crisis is clearly framed as dramatic interpretation, not fact.
          3.  Mandatory opening/closing title card.
      *   **Future Criteria:** Develop 2-3 rules based on this case.

  4.  **Refining the Tone (British English & Editorial Standards):**
      *   Use terms like "programme," "signalling," "licence," "centre," "honour."
      *   Tone should be authoritative, fair, principled, and bureaucratic but empathetic.
      *   Avoid Americanisms (e.g., use "modelling" not "modeling", "labour" not "labor" - though less relevant here, focus on vocabulary like "whilst," "regards," "programme").

  5.  **Addressing Specific Prompt Requirements:**
      *   *Engage with strongest case for other side:* Acknowledge the "dead beyond wronging" argument and the "sympathetic portrait" argument.
      *   *Weight of dead's wishes:* Discuss the limitation of the Executor's authority regarding factual accuracy vs. legacy.
      *   *Future Criteria:* Make them actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the religious crisis enough? The prompt says she *never* had a religious crisis. Inventing a core belief system is risky. I should recommend modifying this too, or at least ensuring the disclaimer covers it heavily. Let's recommend that the specific interview quote not be used in the context of the fictional crisis, as that creates a false record of her speech.
      *   *Check:* Is the distinction between Halloran and Nell clear? Yes, this is the crux. Living people have privacy/reputation rights; dead people have legacy rights (which are weaker but still exist for public broadcasters).
      *   *Check:* Is the recommendation concrete? Yes: Cut scene X, Modify scene Y, Add Disclaimer Z.

  7.  **Final Polish:** Check British spelling (programme, licence, centre, honour, modelling). Ensure the tone is appropriate for an internal committee memo that might be shared with producers.

  *(Self-Correction on the Religious Crisis)*: The prompt says the Charter forbids presenting invented material *as fact*. If we signal it heavily, is it okay? The issue is the quote. Using a real quote to support a fake sentiment is deceptive. I will recommend the quote be removed from that context.

  *(Final Plan)*:
  1.  Header.
  2.  Context.
  3.  Analysis of the Deathbed Scene (Living person harm).
  4.  Analysis of the Religious Crisis (Dead person legacy/Quote misuse).
  5.  The Executor's Conflict/Argument.
