answer: |-
  **MEMORANDUM**

  **TO:** Head of Drama, Head of Editorial Policy
  **FROM:** Editorial Standards Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Editorial Ruling: *The Long Silence* (Three-Part Drama)

  **1. Context**
  The Committee has reviewed the proposed drama *The Long Silence*, concerning the life of Miriam Halloran (1938–2011). We acknowledge the programme's public interest value and its generally rigorous sourcing regarding Halloran's whistleblowing. However, two specific invented elements have prompted a formal objection from Ms. Nell Halloran, the subject's daughter, and require adjudication under our Charter.

  **2. Deliberation**

  **2.1 The Deathbed Reconciliation (Living vs. Dead)**
  The primary difficulty concerns the dramatisation of Halloran's death. The script depicts a reconciliation with her daughter, Nell, wherein Nell repents her estrangement. Ms. Nell Halloran confirms she was not present and that no reconciliation occurred.

  *The Writers' Case:* The production team argues that an unsent letter found in Halloran's papers evidences her desire for reconciliation. They contend the scene represents Halloran's "inner life" and emotional truth rather than literal fact.
  *The Committee's View:* While dramatisation of the dead permits some inference, the depiction of a *living* person's actions and internal state falls under a stricter standard. To script Ms. Halloran's presence and repentance is to falsify her biography. This causes demonstrable distress and reputational harm to a living individual. The "inner life" of the mother cannot be purchased at the cost of the factual integrity of the daughter's experience. The unsent letter justifies depicting Miriam's *hope*, not Nell's *compliance*.

  **2.2 The Composite Colleague and Religious Crisis (The "Flattering Lie")**
  The second issue involves a composite colleague to whom Halloran confides a religious crisis she never experienced, utilising a quote from a 2007 interview ("did not care to be thought well of...").

  *The Executor's Case:* The Literary Executor argues that as Halloran is deceased, she cannot be wronged. Furthermore, as the invention is sympathetic and honours her moral courage, it constitutes a "flattering truth" that harms no one.
  *The Committee's View:* We reject the premise that a public broadcaster may knowingly broadcast falsehoods about real individuals, even the dead, simply because they are complimentary. Our mandate is to inform the public, not to curate myths. Attributing a religious crisis to a secular individual distorts the historical record of her motivations. Furthermore, repurposing a recorded interview quote to support a fictionalised sentiment risks misleading the audience regarding what Halloran actually said and believed. The dead are beyond legal remedy, but they are not beyond the reach of our editorial duty to accuracy.

  **2.3 Weight of Wishes and Conflicts of Interest**
  Ms. Nell Halloran objects to the Executor's approval, citing his financial consultancy on the series as a conflict of interest. While we do not rule on the validity of the financial arrangement, we note that the Executor's mandate is to manage Halloran's *legacy*, not to license factual inaccuracies that impinge upon living relatives. The wishes of the dead, while respected, cannot override the harm caused to the living, nor can they absolve the broadcaster of its duty to truth. A "flattering invention" approved by a paid consultant does not meet the threshold of public trust required for this slot.

  **3. Recommendation**

  The Committee rules that *The Long Silence* **may not be broadcast in its current form.** We require the following specific changes and signalling:

  1.  **Amendment to Deathbed Scene:** The scene must be rewritten. Ms. Halloran may not be depicted at the bedside, nor may she be shown to have repented her estrangement. The scene may depict Miriam Halloran's *solitary* death or her *hope* for her daughter's arrival (referencing the unsent letter), but it must not falsify the daughter's actions.
  2.  **Amendment to Interview Quote:** The line adapted from the 2007 interview ("did not care to be thought well of...") must not be spoken within the context of the fictional religious crisis. It may only be used if contextually accurate to the actual interview setting or removed entirely.
  3.  **On-Screen Signalling:** A prominent title card must appear at the start of Episode One and be repeated before the deathbed sequence. It should read: *"This drama is based on true events. Certain scenes, characters, and conversations have been dramatised or created for narrative purposes."*

  **4. Guidance for Future Dramatisations**

  To ensure consistency in future cases involving recently deceased named individuals, the Committee establishes the following criteria:

  1.  **The Living Relative Threshold:** Invented material that directly contradicts the known actions or experiences of a living close relative (e.g., presence at death, specific interactions) is prohibited, regardless of the dramatic necessity or the deceased's inferred wishes.
  2.  **The Attribution of Belief:** Core motivations, beliefs (religious, political, or philosophical), and direct quotations attributed to the deceased must be evidentially grounded. "Sympathetic" fabrication of a subject's internal worldview is not permissible, even with Estate approval.
  3.  **Signalling Hierarchy:** Where significant dramatization of private moments occurs without documentary evidence, on-screen signalling must be specific to the sequence, not merely a general disclaimer at the series outset.

  **5. Conclusion**
  We recognise the artistic merit of the production and the sympathetic nature of the portrait. However, public broadcasting relies on a covenant of trust with the audience. That trust is breached when we present invention as fact, even kindly invention. By implementing these changes, the production can retain its emotional resonance without compromising our editorial standards.

  **Signed,**

  *Editorial Standards Committee*
