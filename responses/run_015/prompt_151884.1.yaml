answer: |-
  This is a beautifully formulated dilemma. You have identified the precise friction point where welfare economics, moral philosophy, and ecology grind against one another. Your struggle in (5) and (6) is the "Marginality Problem" applied to the "Threshold Problem": if individual causality is negligible or non-linear, how can individual moral responsibility be robust?

  You ask which step to reject. I will analyze your three candidate rejections. My contention is that **Step (1) is incomplete, but Step (3) relies on an illicit act-individualism that Step (6) already undermines.** Therefore, the most robust path is to reject the *act-by-act structure* implied in (2) through (5), moving toward a holistic assessment of practices.

  Here is the cost and commitment of each candidate rejection.

  ---

  ### Candidate 1: Reject/Modify (1) — The Entitlement View
  **The Move:** You argue that (1) is false or incomplete because "imposing a cost" has no moral content relative to a baseline of entitlements. A cost is only a *wrongful* cost if it violates a prior right.
  *   **The Argument:** When I buy grain, I do not impose a *wrongful* cost on you because you have no right to the grain at the previous price. When the herder grazes, she imposes a wrongful cost because the other herders have a right to the *sustainability* of the pasture (or a right to exclude).
  *   **The Cost:** This saves the distinction between grain and grass, but it sacrifices the **independent force of the Commons argument.**
      *   If the wrongness of overgrazing depends entirely on a prior theory of property (e.g., "the others own a share of the carrying capacity"), then Hardin's argument collapses into a libertarian property argument. It no longer explains *why* open access is tragic; it merely asserts that open access violates assumed ownership rights. An advocate of open access can simply deny the baseline entitlement ("No, the grass belongs to no one, so I violate nothing").
  *   **Commitments:**
      *   **About Markets:** Markets are morally neutral mechanisms that operate within a cage of rights. They are innocent only because property law says they are.
      *   **About Promising:** A promise is binding only because the promisee has a right to expect performance. It is a transfer of entitlement, not a creation of obligation *ex nihilo*.
      *   **About Collective Obligation:** We owe each other non-interference with our respective spheres of control. We do *not* owe each other the preservation of shared systems unless those systems are already parceled into rights.
      *   **Verdict:** This is the "cleanest" logically but the most dissatisfying for your purpose. It makes the tragedy of the commons a legalistic dispute rather than a structural moral failure.

  ### Candidate 2: Reject the Step (2) to (3) — The Institutional View
  **The Move:** You argue that the move from (2) to (3) is an equivocation. There is a moral difference between *pecuniary externalities* (price effects) and *technological/physical externalities* (resource degradation), even if the marginal arithmetic looks similar.
  *   **The Argument:** The distinction is not in the *magnitude* of the marginal impact (which you rightly note is similar), but in the **nature of the cooperative surplus.** Market competition is a positive-sum game designed to allocate scarce goods via price signals; the "cost" to the loser is the mechanism of the benefit to the winner. The commons is a negative-sum game where the mechanism of individual benefit *destroys the substrate of the game itself*.
  *   **The Cost:** This requires you to defend a theory of **Just Background Institutions.** You cannot simply say "markets are good." You must say "markets *under just rules* are good." If a market allows monopoly or fraud, the pecuniary externalities *do* become wrongful. This means the innocence of buying grain is contingent, not absolute.
  *   **Commitments:**
      *   **About Markets:** Markets are morally permissible only insofar as they function as efficient allocators within a framework that prevents the destruction of the common substrate. If a market creates a "tragedy" (e.g., carbon markets that allow tipping points), it loses its immunity.
      *   **About Promising:** Promises are the micro-infrastructure of trust that allows the "game" to function. Breaking a promise is like overgrazing; it degrades the trust substrate.
      *   **About Collective Obligation:** We owe each other the maintenance of the *institutional and ecological preconditions* for interaction. We are not just obligated to respect rights (Candidate 1), but to sustain the systems that make rights meaningful.
      *   **Verdict:** This preserves the moral core of the commons argument without reducing it to property law. However, it leaves you vulnerable to the "marginality" problem in (5). If the single herder's impact is physically identical to the single buyer's impact (a tiny reduction in available resource), why is one "game-breaking" and the other "game-playing"? This leads us to Candidate 3.

  ### Candidate 3: Reject the Act-by-Act Structure — The Holistic View
  **The Move:** You argue that (1) applies to **practices, rules, or policies**, not individual acts. This directly addresses your worry in (6) about thresholds and non-linearity.
  *   **The Argument:** The moral unit is not "one sheep" or "one loaf of bread." It is "the practice of unrestricted grazing" vs. "the practice of competitive exchange."
      *   In the lake system (6), no single unit of nutrient load causes the flip. The *policy* of allowing unlimited load causes the flip. Therefore, the moral verdict applies to the *authorization* of the act, not the act itself in isolation.
      *   In the market, the *practice* of buying grain creates a cooperative surplus (efficient allocation). The *practice* of open-access grazing creates a deficit.
      *   This dissolves the arithmetic problem in (5). You don't ask "Did *my* sheep break the lake?" You ask "Am I participating in a practice that, if generalized, breaks the lake?"
  *   **The Cost:** This commits you to **Complicity without Causal Efficacy.** You must accept that an individual can act wrongly even if their specific act made no measurable difference to the outcome (the "inefficacy objection" you mentioned). You are responsible for your participation in the collective harm, not just your causal contribution to it.
  *   **Commitments:**
      *   **About Markets:** Market exchange is justified as a *social practice* that generally yields positive sum outcomes. Individual acts are innocent because they instantiate a beneficial rule.
      *   **About Promising:** Promising is a collective practice. I am bound not because my specific utterance changes the universe, but because I am invoking a social institution that relies on universal compliance.
      *   **About Collective Obligation:** This is the heaviest cost. We owe each other **collective stewardship.** We are responsible for the systems we inhabit. If a system is destructive (the commons), I am wrong to participate even if my participation is causally negligible. If a system is constructive (the market), I am right to participate even if I worsen a competitor's terms.
      *   **Verdict:** This is the only view that handles the shallow lake ecology (6) correctly. It acknowledges that in threshold systems, individual causality is the wrong metric for moral judgment.

  ---

  ### Recommendation

  I recommend you **reject the act-by-act structure (Candidate 3)**, supported by the **Institutional distinction (Candidate 2).**

  Here is why this combination does the least damage to your intuitions:

  1.  **It solves the Arithmetic Problem (5):** You noted that the herder's act is "very largely a transfer too." This is true *physically*, but false *systemically*. The herder is participating in a practice where the *aggregate* of transfers results in destruction. The grain buyer is participating in a practice where the *aggregate* of transfers results in allocation. By judging the practice, you bypass the impossible task of measuring the "real harm" of a single sheep.
  2.  **It solves the Threshold Problem (6):** In your shallow lakes, the "cost" of one unit of nutrient is indeed ill-defined. But the cost of the *policy* of unlimited nutrients is well-defined (catastrophe). A holistic principle assigns responsibility for supporting the policy, not for the physical movement of the nutrient molecule.
  3.  **It preserves the Independence of the Commons Argument:** You do not need to rely on Candidate 1's property baselines. You can argue that open access is wrong *even if* no one owns the lake, because it is a destructive practice. You can argue that markets are right *even if* they impose costs, because they are a constructive practice.

  **The Price You Pay:**
  You must accept that **individual moral agency is deeply entangled with collective systems.** You cannot wash your hands of the tragedy by saying "my sheep didn't tip the lake." You are morally implicated in the tragedy by your participation in the *rule* that allows the sheep, regardless of your marginal causal impact.

  This aligns with your desire to keep "the wrongness of overgrazing and the innocence of buying grain."
  *   **Buying Grain:** Innocent because it instantiates a rule (market exchange) that is generally welfare-enhancing and stable.
  *   **Overgrazing:** Wrong because it instantiates a rule (open access) that is generally welfare-destroying and unstable.

  **The Repair to Principle (1):**
  Restate (1) not as "An agent acts wrongly when she imposes costs..." but as:
  > *"An agent acts wrongly when she participates in a practice that imposes uncompensated costs on others, **unless that practice is justified by a cooperative surplus that benefits the class of persons burdened.**"*

  This allows you to say the market burdens losers (higher prices) but justifies it because the losers are also winners (access to goods/efficiency). The commons burdens everyone (less forage) and justifies it for no one.

  This keeps the moral core clean, respects the ecology of your shallow lakes, and avoids the trap of reducing the tragedy to a mere property dispute.
