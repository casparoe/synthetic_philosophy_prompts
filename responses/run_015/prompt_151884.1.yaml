  3.  **Evaluate Candidate Rejection 1: Modify Principle (1) via Entitlements/Baselines.**
      *   *The Idea:* Costs are not objective physical facts; they are normative violations of rights. If I have a right to compete, the "cost" I impose on you by outbidding you isn't a *wrongful* cost. If the pasture is common, do I have a right to graze?
      *   *The Trap:* If "cost" depends on prior property rights, then the Commons argument loses independent force. It just becomes "Private Property is good." Hardin wanted to show why *unregulated* access is bad, not just assume private ownership is the baseline.
      *   *Commitments:*
