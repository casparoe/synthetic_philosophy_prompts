  ### The Three-Exit Motorway Case

  **The Scenario**
  You are driving a standard car on a motorway at night. You know there are exactly three exits remaining before the road ends at a terminus. Due to fatigue and the identical appearance of the interchange ramps, you suffer from imperfect recall: when you arrive at an exit, you cannot tell if it is the first, second, or third, nor can you remember if you have passed a previous one. You have no phone, no notes, and no way to commit your future self other than adopting a standing policy. You decide to follow a mixed plan: at every exit, you will flip a mental coin and exit with probability $p$, or continue with probability $1-p$.

  **The Payoffs**
  The outcomes are concrete and ordinal:
  1.  **Exit 1:** A **Closed Service Area**. You waste fuel and time. Utility: **0**.
  2.  **Exit 2:** A **Grand Hotel**. Perfect rest, exactly where you wanted to be. Utility: **10**.
  3.  **Exit 3:** A **Truck Stop**. Functional but noisy. Utility: **2**.
  4.  **Pass All:** A **Distant All-Night Café**. Far off the route, minimal rest. Utility: **1**.

  **The Optimal Plan ($p^*$)**
  Your ex-ante expected utility $V(p)$ for a plan $p$ (where $q=1-p$) is:
  $$V(p) = p(0) + qp(10) + q^2p(2) + q^3(1)$$
  Simplifying this polynomial yields:
  $$V(p) = p^3 - 11p^2 + 9p + 1$$
  To find the optimal plan, we solve $V'(p) = 3p^2 - 22p + 9 = 0$. The valid root in $[0,1]$ is:
  $$p^* = \frac{11 - \sqrt{94}}{3} \approx 0.435$$
  At this plan, your expected utility is **$V(p^*) \approx 2.92$**.
  This is strictly better than **Always Exit** ($p=1 \rightarrow V=0$) and **Always Continue** ($p=0 \rightarrow V=1$). Condition 1 and 5 are satisfied.

  **The Local Decision**
  You arrive at an intersection. You do not know which one. You consider a one-shot deviation: Exiting now versus Continuing (and reverting to $p^*$ thereafter). Let $\Delta_k$ be the gain from Exiting rather than Continuing if you are actually at Exit $k$.
  *   **At Exit 1:** Exiting gives 0. Continuing leads to the optimal plan from node 2 (Value $\approx 5.11$). $\Delta_1 \approx -5.11$.
  *   **At Exit 2:** Exiting gives 10. Continuing leads to the optimal plan from node 3 (Value $\approx 1.43$). $\Delta_2 \approx 8.57$.
  *   **At Exit 3:** Exiting gives 2. Continuing leads to the End (Value 1). $\Delta_3 = 1$.

  We evaluate the expected gain $E[\Delta]$ under the three belief rules.

  **1. Rule (A): Visit-Frequency**
  Beliefs are proportional to the expected number of visits under $p^*$.
  Weights: $w_1 = 1/N, w_2 = q/N, w_3 = q^2/N$ (where $N = 1+q+q^2$).
  $$E_A[\Delta] = \frac{1 \cdot \Delta_1 + q \cdot \Delta_2 + q^2 \cdot \Delta_3}{1 + q + q^2}$$
  The numerator is exactly the derivative $V'(p^*)$. Since $p^*$ is the ex-ante optimum, $V'(p^*) = 0$.
  **Verdict:** You are **exactly indifferent**. (Condition 2 satisfied).

  **2. Rule (B): Uniform-Indifference**
  Beliefs are $1/3$ for each exit.
  $$E_B[\Delta] = \frac{1}{3}(-5.11 + 8.57 + 1) = \frac{4.46}{3} \approx 1.49$$
  **Verdict:** You **strictly prefer to Exit**. (Condition 3 satisfied).

  **3. Rule (C): Halfer Rule**
  Beliefs are $1/2$ for the first exit, and the remaining $1/2$ split equally among later exits ($1/4$ each).
  $$E_C[\Delta] = 0.5(-5.11) + 0.25(8.57) + 0.25(1) = -2.555 + 2.1425 + 0.25 \approx -0.16$$
  **Verdict:** You **strictly prefer to Continue**. (Condition 4 satisfied).

  ***

  ### Analysis of the Divergence

  **Why (B) and (C) Bracket (A)**
  The divergence stems from how the rules weight the "Peak" exit ($X_2$, where $\Delta_2$ is large and positive).
  *   **Rule (A)** weights exits by their reach probability ($1, q, q^2$). With $q \approx 0.57$, the weight on $X_2$ is $\approx 0.30$. This weight exactly balances the large negative loss from exiting at $X_1$ against the gain at $X_2$.
  *   **Rule (B)** assigns a flat weight ($0.33$) to $X_2$. This is *higher* than (A)'s weight. Because (B) thinks you are more likely to be at the "Good Exit" than the frequency data suggests, it overvalues the gain from exiting.
  *   **Rule (C)** assigns a lower weight ($0.25$) to $X_2$ and a massive weight ($0.50$) to $X_1$. Because (C) thinks you are likely at the "Bad Exit" ($X_1$), it overvalues the loss from exiting.

  **Why (A) Yields Indifference**
  This is not a coincidence of the numbers but a structural feature of sequential optimization under imperfect recall. The ex-ante derivative $V'(p)$ sums the local gains ($\Delta_k$) weighted by the probability of *reaching* node $k$. Rule (A) normalizes these reach probabilities to sum to 1 to form beliefs. Therefore, Rule (A)'s expected local gain is simply a scaled version of the ex-ante derivative. If the plan is ex-ante optimal ($V'=0$), Rule (A) must imply local indifference. The tension in this case is generated entirely by the self-locating belief rules (B) and (C) deviating from the frequency weights required for dynamic consistency.

  ***

  ### The Two-Exit Reduction

  If we delete the third exit (and the Truck Stop payoff), the scenario collapses to the classic two-exit case ($X_1, X_2$, End).
  *   **Payoffs:** 0, 10, 1.
  *   **Belief Rules:**
      *   (A) Weights: $1/(1+q)$ and $q/(1+q)$.
      *   (B) Weights: $1/2$ and $1/2$ (Uniform).
      *   (C) Weights: $1/2$ for first, remaining $1/2$ divided among *later* exits. Since there is only *one* later exit ($X_2$), it receives the full remaining $1/2$. Weights: $1/2$ and $1/2$.

  **What Collapses:**
  Rules (B) and (C) become **identical**. Both assign probability $1/2$ to each exit. Consequently, they cannot bracket Rule (A). They will either both recommend Exiting or both recommend Continuing. The specific tension of this case—where one non-frequency rule says "Go" and the other says "Stop"—requires at least three decision nodes to separate the "Uniform" distribution from the "Halfer" distribution over the later nodes.

