answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigator, Protocol 447
  **FROM:** Institutional Behavioral-Research Ethics Board (IBREB)
  **DATE:** October 24, 2023
  **SUBJECT:** Ethical Determination regarding Protocol 447 (Decision-Making Competence Under Social Pressure)

  **DECISION:** **DISAPPROVAL OF CURRENT PROTOCOL**

  **EFFECTIVE DATE:** Immediate
  **RESUBMISSION WINDOW:** Open after 60 days from date of this memo

  ### 1. Purpose and Scope
  This memo communicates the final determination of the IBREB regarding Protocol 447. The proposed study aims to measure susceptibility to undue influence in adults with Mild Cognitive Impairment (MCI) using a cooperative economic game. The protocol relies on active deception regarding the study's true purpose, with a plan to debrief participants post-task.

  After extensive deliberation, the Board cannot approve the protocol as submitted. While the scientific merit of understanding vulnerability in MCI populations is acknowledged, the proposed consent mechanism fails to meet the ethical threshold required for this specific population and methodology.

  ### 2. Ethical Analysis: The Limits of Deception
  The Board considered two primary frameworks for evaluating the use of deception in this context.

  **A. The Informational Deficit Model (Minority View)**
  Some Board members initially viewed the deception as methodological necessity. Under this view, consent is valid if the participant understands the tasks and risks, even if the hypothesis is concealed. This model assumes that any deficit in consent is merely informational and can be corrected retrospectively through debriefing. Under standard conditions with neurotypical adults, this approach is often permissible.

  **B. The Structural Integrity Model (Majority View)**
  The Board ultimately rejected the Informational Deficit Model for this protocol. We adopted the view that competence is not a static trait possessed by the participant, but a domain-specific capacity that is dynamically situated within the decision-making context.

  In Protocol 447, the deception does not merely withhold the hypothesis; it constructs a false reality in which the decision is made. By framing the interaction as a "cooperative game" rather than a "test of influence," the investigators alter the very risks the participant is asked to authorize. For a population with MCI, whose ability to filter social cues and assess risk is already compromised, this false frame does not just withhold information—it actively corrupts the conditions under which valid authorization could occur.

  **C. The Failure of Retrospective Correction**
  The Board specifically rejects the proposal that post-study debriefing can remedy this defect. Authorization is an event that must be valid at the moment it is given. If the cognitive frame required to assess the risk is manipulated, the participant is not authorizing the actual study; they are authorizing a fiction. Telling them the truth afterward does not retroactively validate an authorization that was structurally impossible at the time. In cases where the deception targets the specific capacity being measured (competence under pressure), retrospective disclosure cannot restore what was never properly given.

  ### 3. Vulnerability of the Population
  The recruitment of adults with MCI necessitates heightened protections. This population experiences fluctuations in cognitive capacity and is uniquely susceptible to social compliance. When a study design intentionally leverages social pressure to measure competence, while simultaneously concealing the presence of that pressure, it creates a conflict of interest between the research goals and the welfare of the subject. The protocol places the participants in a position where their impairment is the variable of interest, yet the consent process assumes a level of critical scrutiny that the impairment may preclude, especially within a deceptive framework.

  ### 4. Requirements for Resubmission
  To move forward, the research team must redesign the consent and recruitment strategy. The Board will not approve any iteration of this protocol that relies on the current deception model with direct consent from MCI participants.

  **Acceptable Pathways for Resubmission:**
  1.  **Authorized Representative Consent:** Modify the protocol to require consent from a legally authorized representative (LAR) or healthcare proxy for all participants with MCI, in addition to the participant's assent. The LAR must be fully informed of the deception and the nature of the social pressure involved.
  2.  **Removal of Deception:** Redesign the task to measure susceptibility to influence without concealing the purpose of the interaction. If this compromises the data validity, the team must provide a justification for why the scientific value outweighs the ethical cost of enrolling a vulnerable population without full transparency.
  3.  **Alternative Population:** If the deception is deemed methodologically essential and cannot be mitigated by LAR consent, the study must be shifted to a neurotypical adult population where the "Structural Integrity" concerns regarding competence are less pronounced.

  ### 5. Implementation Time Frame
  *   **Immediate Cessation:** No recruitment or data collection may begin under the current approval status.
  *   **Resubmission Deadline:** A modified protocol addressing the concerns above may be submitted no earlier than 60 days from the date of this memo. This cooling-off period is intended to allow the research team to adequately restructure the consent framework.
  *   **Review Priority:** Upon resubmission, Protocol 447 will be assigned to a full board review rather than expedited review, given the precedent and ethical complexity involved.

  ### 6. Conclusion
  The Board recognizes the frustration this decision may cause. However, the integrity of behavioral research depends on the validity of the consent process. When the methodology undermines the capacity to consent, the data obtained rests on an ethically unstable foundation. We invite the research team to engage with the requirements outlined in Section 4 to develop a protocol that protects participants without sacrificing scientific rigor.

  **Signed,**

  **Chair, Institutional Behavioral-Research Ethics Board**
