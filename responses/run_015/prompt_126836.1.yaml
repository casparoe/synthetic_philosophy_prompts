prompt: |-
  Ok so my little sister is getting married in three weeks and somehow I agreed to give the maid of honor toast, and I'm starting to regret it. Context: shes a hardline presentist — she really thinks there are no facts yet about what will happen, and she gets visibly irritated at that thing people say at weddings, that the couple were meant to be, or that they'll still be holding hands at eighty. Her fiance is on the other side: eternalist, and a perdurantist about people, so he genuinely holds that the guy in the tuxedo is a temporal stage of a four-dimensional worm, and he once published a paper arguing that a promise only binds the stage that makes it, so what the rest of us call fidelity is really a chain of overlapping stage-promises that later stages keep renewing. He said this at my aunt's dinner table. It went badly. They've asked me, very sweetly but very firmly, not to say anything in the toast that either of them would call false, and also not to turn it into a metaphysics lecture. The room is going to be roughly half philosophy department, who will catch every sloppy tense, and half family: my grandmother, who wants God and the till-death language in there, my sister's old roommate who's a particle physicist and would enjoy one block-universe bit, and a pile of cousins who just want to cry and clink glasses. My own instinct is that the only thing both of them grant is what's happening in the room right now — the presentist grants the present, the eternalist grants that this is a time — so maybe the whole thing should be built on the now, on what the two of them are doing in it, with intention-language (she is committing herself right now to X, he intends to Y) rather than predictions about decades. My sister also has a pet idea she'd be delighted to hear echoed without being named: she thinks the only truthmakers for claims about tomorrow are present dispositions, so a vow about the future is exactly as good as the disposition backing it up this second, and not one bit better.

  Write the toast: about four minutes, warm, at most one joke and it has to work for both halves of the room, no philosophy explained out loud in the speech itself. Then after the text give me a JSON object with these fields: "title" (string), "word_count" (integer), "estimated_minutes" (number), "pivot_line" (the one sentence everything else turns on), "grandmother_line" (the line that gives her something without the couple calling it false), "jokes_used" (array of strings), "cut_first_if_running_long" (array of strings), and "temporal_audit" (array of objects, one per sentence in the toast that makes any temporal claim, each with keys "line", "construction" — e.g. future tense, tenseless, indexical-now, dispositional — "presentist_ok", "perdurantist_ok", "family_ok", each yes/no, and "note" explaining any no).
