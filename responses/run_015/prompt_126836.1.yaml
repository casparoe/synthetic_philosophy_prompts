          *   **Groom (Fiance):** Eternalist/Perdurantist (4D worm, temporal stages, promises bind only the stage making them, fidelity is a chain of renewals). Published a paper on this (went badly at aunt's dinner).
          *   **Joint Constraint:** Do not say anything either would call *false*. Do not turn it into a metaphysics lecture.
          *   **Audience:**
              *   50% Philosophy Dept (will catch sloppy tense).
              *   50% Family (Grandmother wants God/"til death", cousins want emotion, roommate is a physicist who likes block-universe stuff).
          *   **Tone:** Warm, sincere.
          *   **Jokes:** At most one, must work for both halves (philosophers and family).
          *   **Strategy:** Focus on the *now*, intention-language, present dispositions.
          *   **Sister's Pet Idea:** Echo the idea that truthmakers for tomorrow are present dispositions (without naming it).
      *   **Output:**
          1.  The Toast text.
          2.  A JSON object with specific fields: `title`, `word_count`, `estimated_minutes`, `pivot_line`, `grandmother_line`, `jokes_used`, `cut_first_if_running_long`, `temporal_audit`.

  2.  **Deconstruct the Metaphysics:**
      *   **Presentist (Bride):** Only the present exists. Future statements are not true/false yet, or their truth depends on *current* dispositions/traits. Avoid "You will be happy forever." Instead: "You are choosing happiness now," "Your love today is strong."
      *   **Eternalist/Perdurantist (Groom):** Past, present, future all exist (block universe). People are 4D worms made of temporal stages. A promise is a local event binding a stage. Fidelity is a chain of renewals. Avoid "You are soulmates destined to meet." Instead: "This moment is a point in your shared timeline," "Each day you renew this choice."
