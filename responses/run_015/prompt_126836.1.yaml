      *   *Selected Joke:* "I was going to promise you a lifetime of happiness, but I know better than to make commitments I can't keep from this podium." (Acknowledges the groom's view on promises binding only the stage, and the bride's view on future facts).

  3.  **Drafting the Toast:**
