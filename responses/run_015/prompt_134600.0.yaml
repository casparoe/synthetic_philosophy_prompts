  ---

  ### Detailed Feedback

  **Part (a) [5/5]**
  *   **What's right:** This is a model answer. You correctly identified the equivocation on $x$ (treating it as fixed when it scales with the state) and demonstrated the correct symmetry argument conditional on $S$.
  *   **Comments:** "Excellent. You clearly articulated why the $5x/4$ argument fails (the variable $x$ is not independent of the branch) and showed the correct unconditional expectation is equal. Full marks."

  **Part (b) [5/7]**
  *   **What's right (Part i):** Your derivation of the general condition is correct. You correctly applied Bayes' rule to get the posterior odds $g(a) : g(a/2)$ and derived the expected gain formula. The condition $g(a) > g(a/2)/2$ is correct.
  *   **What's wrong (Part ii):** Your application to the Exponential prior contains an algebraic error. You claimed the threshold is the *median* of the prior ($500 \ln 2 \approx 347$). However, solving your own inequality $g(a) > \frac{1}{2}g(a/2)$ for $g(s) \propto e^{-s/500}$ yields:
      $$e^{-a/500} > \frac{1}{2}e^{-a/1000} \implies e^{-a/1000} > \frac{1}{2} \implies -\frac{a}{1000} > -\ln 2 \implies a < 1000 \ln 2 \approx 693.$$
      The threshold is actually **twice** the median, not the median itself.
  *   **Consequence:** Because of this calculation error, your advice for $a=600$ is incorrect. Since $600 < 693$, you *should* switch at 600, but you advised keeping it. Your advice for $a=80$ remains correct.
  *   **Comments:** "Your general derivation in (i) is perfect. However, in (ii), you solved the inequality incorrectly. For an exponential prior, the switching threshold is $2 \cdot \text{mean} \cdot \ln 2$ ($\approx 693$), not the median ($\approx 347$). Consequently, your recommendation for $a=600$ is wrong (you should switch). Check your algebra when substituting the density function into the inequality."

  **Part (c) [4/8]**
  *   **What's right:** You correctly calculated the posterior probabilities (1/2) and the conditional expected gain ($a/4$) under the improper prior. You also correctly noted in your final sentence that proper priors restore consistency (finite cutoff).
  *   **What's wrong:** Your resolution of the "conflict" is theoretically unsound. You conclude that "open-then-switch... dominates switching blind" and that "looking is worth about $a/4$." In decision theory with improper priors, the unconditional expected gain of the "open-then-switch" policy is **undefined** (the integral diverges). You cannot claim one policy dominates the other in terms of Expected Value when the expectations do not exist. The "conflict" exists precisely because Fubini's theorem does not apply (non-integrability), not because opening provides value in a well-defined sense.
  *   **Comments:** "Your calculations for the posterior and conditional gain are correct. However, your conclusion that 'open-then-switch dominates' is incorrect in the context of improper priors. Because the prior is improper, the unconditional expected gain of the 'open-then-switch' policy is undefined (the integral diverges). Therefore, you cannot rigorously claim it is 'better' than switching blind in terms of expected utility. The paradox arises because $E[E[\text{gain}|A]] \neq E[\text{gain}]$ when integrability conditions fail. You identified the proper-prior solution well, but the analysis of the improper case needs to acknowledge that expectations are ill-defined, not that one strategy strictly dominates."

  ---

  ### TA Note (For your verification)
  *   **Part (b) Algebra:** The student's condition $g(a) > g(a/2)/2$ is correct. For $g(s) = \lambda e^{-\lambda s}$, this becomes $\lambda e^{-\lambda a} > 0.5 \lambda e^{-\lambda a/2}$. Dividing by $e^{-\lambda a/2}$ gives $e^{-\lambda a/2} > 0.5$, so $-\lambda a/2 > -\ln 2$, or $a < (2 \ln 2) / \lambda$. Since mean $= 1/\lambda = 500$, threshold is $1000 \ln 2 \approx 693.1$. The student used $500 \ln 2 \approx 346.6$.
  *   **Part (c) Theory:** The student falls into the "Bayesian Paradox" trap. With a flat prior on $S$, the marginal distribution of $A$ is also improper. The expected value of the gain $\int (a/4) p(a) da$ does not converge. Standard decision theory dictates you cannot compare undefined expectations. The student's claim that "looking is worth $a/4$" treats $a$ as a fixed constant ex-ante, which it is not.
