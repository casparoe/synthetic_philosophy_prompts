          *   *Expected Gain:* Gain if $H_s$ is $+a$. Gain if $H_l$ is $-a/2$.
          *   *Formula:* $E[\text{gain}] = \frac{a g(a) - (a/2)g(a/2)}{g(a) + g(a/2)}$.
