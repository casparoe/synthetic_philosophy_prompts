prompt: |-
  I'm a novelist working on a first-contact book with a kind of hive-ish alien where the whole versus part thing actually matters for the plot, and last night I got trapped at drinks while two friends used my premise to relitigate Quine's gavagai thing and I couldn't follow who was winning. Maya, who's in linguistics, started it by saying the classic point still holds: a field linguist hears gavagai every time a rabbit scurries by, but all that pointing and assenting behavior is compatible with it meaning rabbit versus undetached rabbit part versus rabbit-stage, and no pile of yes-no dispositions will pick one out. Dev, who writes translation software, said that's way overstated because in real life you'd just get clever — you'd point at an ear versus the whole animal, come back tomorrow to check if it's the same rabbit, wave a carrot to seperate eating-behavior from seeing-behavior, and the pattern of assents would eventually lock in the right referent.

  Maya came back with what she said was Quine's actual comeback, which is that you can always tweak your translations of the little logical words like same as and is a part of to compensate for a different translation of gavagai, so the total manual still fits all the behavior either way, and Dev laughed that off. He said (1) even if two manuals both fit the dispositions that's just philosopher underdetermination, in practice charity and simplicity pick a winner and communication works fine, and (2) kids and travelers and even his models learn words well enough that indeterminacy can't be a deep fact about meaning, it must be an artifact of demanding too much certainty. Maya said he's confusing practical success with sameness of meaning — that you can get around fine while still having no fact of the matter about what you both mean — and Dev said if there's no behavioral difference that ever shows up, even in my hive-alien case where whether thrum means bug-individual or bug-colony-limb changes who you feed, then there's no meaningful difference at all. They both looked at me like I should decide because it's my aliens, and I had no idea.

  Can you referee the thing move by move for me in British English, saying who's right about each step and what both of them are missing, especially whether Dev's follow-them-around tests or his appeal to charity actually touch Maya's compensation point, and what it would mean for my novel if Maya is right? I'm still fuzzy on wether stimulus meaning was supposed to solve this or just set it up. And as the very last line please put a machine-readable verdict, exactly Verdict: Maya or Verdict: Dev or Verdict: Split.
