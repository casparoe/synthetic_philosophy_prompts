answer: |-
  **OFFICE OF PRECEDENT ALLOCATION**
  **FORM 27-B: APPLICATION FOR APPROVED HISTORICAL ANALOGY**
  **VERSION 4.1**

  **1.0 PURPOSE**
  1.1 This Form secures historical justification for policy recommendations already finalized by the requesting Unit.
  1.2 Memos submitted without an approved analogy will be returned as aesthetically arbitrary.

  **2.0 APPROVED PRECEDENT CATALOGUE**
  2.1 Applicants must select one (1) precedent from the current stock. Substitutions are not permitted.
  2.2 Current Inventory:
  > I. Sarajevo 1914 (Accidental Escalation)
  > II. Munich 1938 (Failure of Appeasement)
  > III. Melos 416 BCE (Power Dictates Right)
  > IV. Vietnam 1965–1975 (Quagmire Dynamics)
  > V. Cuba 1962 (Successful Blockade)
  > VI. 1914 Systemic Shift (Structural Inevitability)

  **3.0 SELECTION CRITERIA**
  3.1 **Surface Similarity:** Precedents are assigned based on visible features (e.g., presence of a blockade, existence of an ultimatum) rather than causal mechanisms.
  3.2 **Scenery Coding:** Applicants must indicate which contradictory factors count as "background scenery."
  > [ ] Economic Interdependence
  > [ ] Domestic Political Constraints
  > [ ] Nuclear Deterrence
  > [ ] Moral Hazard
  3.3 Factors coded as scenery are excluded from the Lesson Extraction Ratio.

  **4.0 LESSON EXTRACTION RATIO (LER)**
  4.1 The maximum yield is three (3) units of policy per century of historical data.
  4.2 Complex histories do not yield complex lessons. Complexity reduces LER efficiency.

  **5.0 RESTRICTIONS**
  5.1 **No Double-Analogy Rule:** Exactly one (1) analogy per crisis. Citing multiple precedents suggests uncertainty regarding the causal structure of the present.
  5.2 **Reference Class Membership:** The Office decides whether the current crisis is a unique instance or one of forty recurring cycles. Applicants may not contest membership status.
  5.3 **Second-Order Surcharge:** Applications invoking a second-order analogy (e.g., "This crisis is like every time people claim a crisis is like Munich") incur a double processing fee. Both the claim and the meta-claim draw from the same limited Catalogue.

  **6.0 DISANALOGY DISCLOSURE SCHEDULE**
  6.1 A mandatory one-page summary of why the precedent does *not* apply must be attached.
  6.2 This Schedule will not be read. It exists to satisfy compliance auditors.

  **7.0 WORKED EXAMPLE**
  **Crisis:** The Republic of Vardia has imposed a naval blockade on the island city of Port Saint-Aubin.
  **Applicant Request:** Precedent II (Munich). Desired Lesson: Concession invites aggression; immediate mobilization required.
  **Office Determination:** Request Denied. Precedent III (Melos) Assigned.
  **Reasoning:** While the ultimatum structure matches Munich, the relative power disparity matches Melos.
  **Issued Lesson:** The strong do what they can. Port Saint-Aubin will be subdued regardless of mobilization.
  **Note:** This Lesson is substantively unhelpful for mobilization but structurally sound.

  **8.0 PREDICTIVE DISCLAIMER**
  8.1 The Office acknowledges that historical cases are non-repeatable events lacking control groups.
  8.2 Analogies possess zero predictive validity.
  8.3 However, a policy memo without a precedent reads as arbitrary.
  8.4 Therefore, analogies are mandatory not because they inform decision-making, but because they disguise decision-making as inheritance.

  **9.0 AUTHORIZATION**
  By signing below, the Applicant certifies that they have already decided what to do and require only the appropriate historical costume.

  __________________________
  **Date** | **Office Stamp**
