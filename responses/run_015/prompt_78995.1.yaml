answer: |-
  Dear Student,

  You are right to be suspicious of your notes, and your intuition that the lecture presented a caricature rather than a careful exegesis is well-founded. It is a common occurrence in introductory contexts for Williams's internal reasons thesis to be conflated with what he explicitly calls the sub-Humean model, and based on the summary you have provided, that is precisely what happened here. If you build your essay on the reconstruction you have written down, you will be attacking a straw man, so let us go through the claims you recorded and sort out what survives, what needs rewriting, and what must be discarded entirely.

  The first sentence of your summary states that Williams holds a reason statement is true only if the agent has a desire that the action in question would satisfy. This needs significant rewriting. Williams does argue that for an internal reason statement to be true, there must be a sound deliberative route from the agent's subjective motivational set, which he abbreviates as S, to the action. However, he explicitly rejects the claim that S consists only of desires. In his view, S includes not just desires but also dispositions, evaluations, commitments, and projects. By reducing S to desires, the lecturer collapses Williams's view into the sub-Humean model, which Williams distinguishes from his own position. So, you should rewrite that sentence to refer to elements of the subjective motivational set rather than desires alone, noting that this set is broader than mere appetites.

  The next claim, that for Williams all reasons are instrumental and deliberation can only ever be about means, must go entirely. This is perhaps the most damaging error in the summary. Williams argues that deliberation is not limited to finding means to pre-existing ends. He allows that through deliberation, an agent can modify the elements of S itself. An agent might discover that two elements of their motivational set are inconsistent, or they might imagine a future outcome and find it repulsive, thereby losing the desire that would lead to it. This is not instrumental deliberation; it is deliberation that shapes ends. Your friend's experience in the orchestra is a perfect example of what Williams has in mind. She did not find a new means to her end, nor did she discover a new external fact; she deliberated on her motivation itself and reinterpreted her desire from love to vanity, which altered her motivational set. The lecturer's version of the view, which treats deliberation as purely instrumental, cannot account for this, but Williams's actual view can. You should use this anecdote in your essay to illustrate the flexibility of Williams's account of deliberation, contrasting it with the rigid instrumentalism attributed to him in the lecture.

  Following from that error is the claim that Williams treats the subjective motivational set as a fixed given. This also must go. As indicated by the orchestra example, Williams views S as dynamic. It is the starting point of deliberation, but it is not immutable. Elements can be added, subtracted, or modified through the process of reasoning and reflection. If you leave the claim that S is fixed, you will be unable to explain how moral development or rational criticism is possible on Williams's view, so you should replace it with an explanation of how deliberation interacts with and modifies S.

  The summary then claims that it follows that nobody can be wrong about what they have reason to do. This is a non sequitur on Williams's actual view and must be discarded. An agent can be wrong about what they have reason to do if they have not deliberated correctly. For Williams, an internal reason statement is true if there is a sound deliberative route from S to the action. If the agent fails to see that route because of ignorance, confusion, or a failure of imagination, they are wrong about their reasons. They might think they have no reason to stop smoking, but if a sound deliberative route from their desire to live long exists, they do have that reason, even if they haven't recognized it. So, the claim that nobody can be wrong is false on Williams's terms; people can be wrong about the existence of a sound deliberative route.

  Similarly, the claim that moral criticism of anyone is impossible must be rewritten. Williams does not think criticism is impossible; he thinks criticism based on external reasons is impossible. We can still criticize an agent for having a deficient subjective motivational set. If the serially unfaithful husband has no element in S that would lead to fidelity even after sound deliberation, Williams agrees he has no internal reason to be faithful. However, Williams does not accept this with a shrug in the way your notes suggest. He allows that we can criticize the man for having such a set, and we can try to bring about a change in that set through persuasion, threat, or appeal. We can say his motives are bad, even if we admit he has no internal reason to change them. The lecturer's claim that moral criticism is impossible conflates the impossibility of citing an external reason with the impossibility of any normative judgment, which is a crucial distinction to make in your essay.

  Regarding the unfaithful husband case specifically, the sentence stating that Williams accepts the lack of reason with a shrug is a defensible simplification only if you clarify what the shrug signifies. It signifies the acceptance that there is no external reason, not a moral indifference. You should rewrite this to emphasize that Williams denies the existence of an external reason but maintains the legitimacy of criticizing the agent's character or motivational set. This preserves the critical force of morality without committing to external reasons.

  The claim that Williams thinks the very idea of deliberating about ends is incoherent must go, as we have already established that he allows deliberation to modify S. Consequently, the conclusion that his view is a dressed-up version of the Humean doctrine that reason serves the passions is also misleading and should be qualified. Williams acknowledges a debt to Hume but insists his view is not the sub-Humean model. He rejects the idea that reason is merely the slave of the passions because reason can operate on the passions themselves to alter them. You should frame this in your essay as Williams refining Humeanism rather than simply restating it.

  Finally, you need to be very careful with the lecturer's closing claims about the state of the debate. The statement that the view is now generally regarded as refuted is too strong to rely on in an essay without significant qualification. While the objection regarding indifference to one's future self, often associated with Derek Parfit, is a powerful challenge, it is not universally accepted as decisive. Many contemporary internalists have developed responses to this objection, arguing that a rational agent would necessarily care about their future selves or that the objection misunderstands the nature of the subjective motivational set. To say the view is refuted suggests the debate is over, when in fact internalism remains a dominant and viable position in metaethics. You should rewrite this to say that the view faces significant objections, particularly concerning future indifference, but remains a live and highly influential theory. Similarly, the claim that Williams later qualified the thesis in a way most people read as a concession is contentious. Williams did clarify his views in later papers, such as Internal Reasons and the Obliquity of Reflection, but characterizing these clarifications as concessions implies he admitted defeat. A more neutral description would be that he refined the account of deliberation and the contents of S to meet objections. You should not present this as a retraction but as a development of the theory.

  In sum, your essay will be much stronger if you start by distinguishing Williams's internal reasons thesis from the sub-Humean model. You should argue that the lecturer's summary describes the sub-Humean model, not Williams's actual position. Use your friend's orchestra anecdote to demonstrate how Williams's account of deliberation allows for changes in ends, contradicting the claim that deliberation is purely instrumental. Correct the record on moral criticism by explaining that while Williams denies external reasons, he allows for criticism of an agent's motivational set and their deliberative failures. And treat the claim that the view is refuted with skepticism, presenting it as one side of an ongoing debate rather than a settled fact. If you make these corrections, you will be engaging with Williams's actual arguments rather than the caricature you heard in the lecture, which is exactly what a third-year essay should aim to do.
