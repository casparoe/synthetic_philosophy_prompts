answer: |-
  This is a high-stakes interpretive task. You are not just analyzing a legal definition; you are analyzing an institutional precedent that balances legal risk, moral clarity, and advocacy utility. Your flatmate's theory (that it's purely about triggering prevention duties) is partially correct but fails to account for the **Canada** and **Bosnia** memos. If utility were the only metric, she would have called Canada "genocide" to force action on residential schools. She didn't.

  Here is the reverse-engineering of your colleague's algorithm, applied to the Kavaria case.

  ### 1. Reverse-Engineering the Predecessor's Algorithm

  Your colleague is not running a single rule. She is running a **hierarchical filter** with three distinct gates. To get a "Yes" in comms, a case must pass all three.

  *   **Gate 1: The Protected Group (Strict Construction).**
      *   *Rule:* The target must fit the Convention categories (National, Ethnical, Racial, Religious). Political, social, or economic classes are excluded, regardless of moral horror.
      *   *Evidence:* **Holodomor** (peasants = class), **Indonesia** (communists = political), **Cambodia** (only "Yes" for Cham Muslims, "No" for "new people"/class enemies).
      *   *Implication:* If the perpetrator defines the group out of existence (e.g., "heretics" not a religion), she likely requires objective ethnoreligious evidence to override them (as with Yazidis/Rohingya).

  *   **Gate 2: The Mode of Destruction (Biological > Cultural).**
      *   *Rule:* "Destroy" in the Convention means physical or biological destruction. Cultural destruction, assimilation, or displacement does not count as genocide *unless* it is a precursor to or accompanied by physical elimination.
      *   *Evidence:* **Canada** (The Smoking Gun). She explicitly acknowledged Article II(e) (forcible transfer of children) but said "No." She separated "Cultural Genocide" from "Genocide." **Bosnia** (Expulsion = No, because they survived).
      *   *Implication:* Forcible assimilation, even of children, is not genocide in her comms lexicon without a concurrent intent to physically destroy the group.

  *   **Gate 3: The Advocacy Override (The Darfur Exception).**
      *   *Rule:* If the violence is mass-scale physical destruction but legal intent is ambiguous, she will use the label to trigger the prevention duty.
      *   *Evidence:* **Darfur**. The UN commission found no genocidal *intent*, but she said "Yes, loudly."
      *   *Implication:* She will stretch *intent*, but she will not stretch *group definition* (Gate 1) or *mode of destruction* (Gate 2). Darfur involved mass killing (Gate 2 passed); Canada did not (Gate 2 failed).

  **Summary of her Doctrine:** *Strict Convention on Groups and Acts; Flexible Convention on Intent when mass killing is evident.*

  ### 2. Applying the Algorithm to Kavaria/Surni

  Here is how her logic breaks down the new memo, separating the Legal, Moral, and Comms verdicts.

  #### A. The Protected Group (Gate 1)
  *   **Fact:** Surni are an ethnoreligious minority. State claims they are a "heretical sect."
  *   **Her Precedent:** She said **Yes** to Yazidis (often dismissed by ISIS as devil-worshippers/heretics) and Rohingya (dismissed as illegal immigrants).
  *   **Prediction:** **Pass.** She would reject the state's classification. The Surni are a protected religious/ethnical group.

  #### B. The Mode of Destruction (Gate 2)
  *   **Fact:** 40,000 children removed (Article II(e)); institutions destroyed; 3,000 dead via neglect/riots (not execution); "Solved within a generation."
  *   **Her Precedent:** This is the critical junction.
      *   *The Canada Analogue:* Canada involved forcible transfer of children and cultural destruction. She said **No**.
      *   *The Darfur Analogue:* Darfur involved mass killing. She said **Yes**.
      *   *The Bosnia Analogue:* Displacement/Expulsion without physical destruction. She said **No**.
  *   **Analysis:** The Kavaria program is primarily *assimilationist* (Canada) with a layer of *neglect-based mortality* (lower intensity than Darfur). The "solved within a generation" line suggests the goal is the disappearance of the Surni *identity*, not necessarily the Surni *bodies* (which aligns with the Canada memo's "Cultural Genocide" distinction).
  *   **Prediction:** **Fail.** Under her precedent, assimilation + neglect does not equal physical/biological destruction. The 3,000 deaths, while tragic, are framed as "riots/neglect" rather than a systematic extermination campaign (no death lists, warnings before bulldozing).

  #### C. The "In Part" Question
  *   **Fact:** Leth province holds 25% of the people but 100% of the shrines/institutions.
  *   **Her Precedent:** In **Bosnia**, she argued that if people survive elsewhere, it's not genocide. This suggests she views the "group" biologically, not institutionally.
  *   **Prediction:** She would likely argue that because 75% of the Surni live outside Leth and are not subject to the same mortality rates, the *biological* group is not being destroyed "in part" in a way that meets the Convention threshold. The destruction of the *heartland* is cultural, not genocidal, in her framework.

  #### D. The Comms Decision
  *   **Verdict:** **No on Genocide.**
  *   **Reasoning:** To say "Yes" here would contradict the **Canada** memo. In Canada, she had a clear Article II(e) violation (children) and said it was "Cultural Genocide, and no on genocide." If she says "Yes" to Kavaria, she admits the Canada memo was wrong or that the NGO's doctrine has shifted to a Lemkinian standard.
  *   **Alternative Label:** She would likely recommend **"Crimes Against Humanity"** (persecution, deportation) and **"Cultural Genocide"** (in moral framing only), urging intervention on those grounds.

  ### 3. The Trap of the Canada Memo

  You asked if the Residential Schools memo is the closest analogue or a trap. **It is the closest analogue, and it is binding.**

  The Canada memo is the "control variable" in her dataset.
  *   **Kavaria:** Children removed + Culture destroyed + Some deaths (neglect).
  *   **Canada:** Children removed + Culture destroyed + Deaths (neglect/disease/abuse).

  The only difference is the *insurgency context* and the *leaked intent document*. However, her **Bosnia** memo shows she is skeptical of "intent" when survival is possible elsewhere. Her **Darfur** memo shows she needs *mass killing* to override legal caution. Kavaria has less killing than Darfur and more assimilation than Bosnia. It sits squarely in the **Canada** quadrant.

  If you write "Yes," you are overruling her Canada decision. You are effectively adopting the **Lemkinian** rule (Rule 2 in your list) rather than her **Strict Convention** rule.

  ### 4. What Each Rule Predicts

  | Rule Set | Legal Verdict | Moral Verdict | Comms Decision | Consistency with Predecessor |
  | :--- | :--- | :--- | :--- | :--- |
  | **Strict Convention** (Her apparent rule) | No (No physical destruction intent) | Yes (Cultural Genocide) | **No** | **High.** Matches Canada, Bosnia, Holodomor. |
  | **Lemkinian** (Cultural destruction counts) | Yes (Art II(e) + cultural eradication) | Yes | **Yes** | **Low.** Contradicts Canada memo. |
  | **Political/Advocacy** (Trigger prevention) | N/A | Yes | **Yes** | **Medium.** Matches Darfur, but ignores Canada constraint. |

  ### 5. The "Test Case" to Clarify the Doctrine

  If you want to know for sure which rule she is running before you commit, you need to look for a case in her archives that splits the **Darfur** and **Canada** precedents.

  **The Case You Need to Find:**
  Look for a memo regarding a situation where there was **mass killing of a protected group** but **no explicit extermination order** (similar to Darfur), *OR* a situation where there was **forcible transfer of children** but **zero mortality** (cleaner than Canada).

  *   **If you find a "Yes" on a low-mortality assimilation case:** She is a Lemkinian, and the Canada memo was an anomaly (perhaps due to domestic political pressure). You can say "Yes" to Kavaria.
  *   **If you find a "No" on a high-mortality counter-insurgency case:** She is stricter than the Darfur memo suggests. You must say "No" to Kavaria.

  *However, based on the text you have:* The Canada footnote ("this is exactly where the legal and the moral verdict come apart") is the most explicit statement of principle she has written. It indicates she accepts the legal limitation even when the moral verdict is clear.

  ### 6. Recommendation for Your Memo

  If you want to maintain continuity with her tenure (which is usually wise when covering for a colleague):

  1.  **The Verdict:** Do not use the word "Genocide" in public comms.
  2.  **The Logic:** Cite the **Canada** precedent. Acknowledge that Article II(e) is met (children), but argue that without evidence of intent to physically destroy the group *biologically* (as opposed to assimilating them), the Convention threshold is not met.
  3.  **The Pivot:** Use the **"Crimes Against Humanity"** and **"Cultural Genocide"** labels aggressively. This honors the moral gravity (the "Yes" on the moral verdict) without breaking the legal/comms precedent she established.
  4.  **The "In Part" Argument:** Acknowledge the destruction of the Leth heartland is qualitatively significant, but cite the **Bosnia** memo: survival of the group outside the zone precludes a genocide finding under her interpretation of "intent to destroy."

  **What Principle Are You Committing To?**
  *   **If you say No:** You commit to the **Convention-Strict** principle. You prioritize legal defensibility and consistency with past NGO positions (Canada). You risk being accused of semantic hair-splitting while a group is erased.
  *   **If you say Yes:** You commit to the **Lemkinian/Advocacy** principle. You prioritize the moral reality and the prevention duty. You risk undermining the NGO's legal credibility and contradicting your own organization's stance on Indigenous rights in Canada (which could be politically explosive).

  **Final Assessment:**
  She would write **No**. The combination of *assimilation as the primary goal* (Canada) and *neglect rather than execution as the cause of death* (Bosnia/Darfur distinction) keeps this out of her "Genocide" box. She would treat the leaked "solved within a generation" document as evidence of *cultural* intent, not *physical* intent.

  To deviate from this is to decide that the Canada memo was a mistake. If you believe that, you should say "Yes," but you must explicitly note that you are updating the NGO's doctrinal standard.
