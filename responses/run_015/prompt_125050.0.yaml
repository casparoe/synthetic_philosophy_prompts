answer: |-
  Marcus sits at his desk, staring at the blank document. His editor asks, "Do you intend to finish the chapter tonight?" Marcus considers the deadline, the importance of the book. He judges, "Yes, I shall." By transparency, he knows his mind: he intends to write. But inwardly, he notices a peculiar stillness. There is no tug toward the keyboard, no anticipatory tension in his fingers, only a flat, verbal assent that feels like quoting a rule rather than forming a plan. He reports, "I intend to," but his introspective landscape is devoid of the motivational vector that usually accompanies intention. He isn't hiding laziness; he genuinely wants to write. Yet the inner machinery of agency is idle. The detective sees the idle engine; the transparency theorist sees the driver's license.

  ***

  **1. The Procedure**
  Marcus runs the transparency procedure: he answers the world-directed question ("Shall I write?") by weighing reasons (deadline, importance). For the transparency theorist (like Gareth Evans or Richard Moran), this rational deliberation *constitutes* the intention. To judge that you shall do something is to intend it. The procedure delivers knowledge because, on this view, intention is not an object to be found but a commitment to be made. Marcus made the commitment; therefore, he knows he intends.

  **2. The Introspectable Items**
  The detectivist points to the phenomenological absence: the lack of "motivational vector," the "flatness," the missing "anticipatory tension." These are introspectable items available *now*, not behavioral outcomes. Detectivism treats intention as a state with a specific felt profile (a conative feel). Because Marcus lacks this profile, the detectivist verdict is that the intention is missing, regardless of his rational endorsement. The inner sense perceives the absence of the state itself.

  **3. The Key Feature**
  The working feature is the **dissociation between rational endorsement and motivational force**. Marcus has the judgment without the drive. If you remove this dissociation—if the judgment automatically produced the felt tug—transparency wins. If you explain it away as self-deception (he secretly hates writing), the case collapses into a standard exception transparency theorists already concede. The case only works if this fragmentation is non-culpable and immediate.

  **4. The Pushback**
  The transparency theorist will claim I've cheated by redefining intention. They will argue: "Intention is a commitment, not a sensation. The 'feel' is incidental." They will say Marcus *does* intend, he's just tired. Is this a dodge? It depends on whether you think intentions must be action-guiding *now*. If the "commitment" doesn't engage the machinery of agency, the detectivist argues it's merely a prediction, not an intention. The case forces a choice: is intention what you say, or what moves you?
