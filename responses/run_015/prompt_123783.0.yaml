      *   **Role:** Editor of a philosophy-of-mind journal.
      *   **Task:** Create a reusable 15-minute editorial procedure for non-logician staff.
      *   **Goal:** Flag submissions using informal "set/class" language that risk Russell's Paradox (unrestricted naive comprehension) without requiring formal proof.
      *   **Components:**
          *   Ordered sequence of practical tests (linguistic triggers, distinctions, escalation points).
          *   Explicit handling of false positives (safe stratified constructions).
          *   Explicit handling of hidden risks (vague qualifiers).
          *   Application to three specific cases.
          *   Identification of the "permitted but tense" case.
          *   Conclusion with two substantive limitations of the procedure.
      *   **Constraint:** The procedure must be actionable by non-logicians in ~15 minutes.

  2.  **Deconstruct the Logical Problem (Russell's Paradox):**
      *   Core issue: Unrestricted Comprehension Axiom ($\{x \mid \phi(x)\}$ exists for any $\phi$).
      *   Paradox: $R = \{x \mid x \notin x\}$. Is $R \in R$?
      *   Safe alternatives: ZFC (restricted comprehension/subsets), Type Theory (hierarchy), Proper Classes (cannot be members).
      *   Philosophy of Mind Context: Authors often speak loosely about "the set of all beliefs," "the class of all concepts," etc. Most of this is harmless metaphor. Some of it is foundational and risky.
      *   Challenge: Distinguish harmless metaphor from foundational claims that collapse if the set doesn't exist.

  3.  **Drafting the Procedure (The "15-Minute Russell Screen"):**
      *   *Step 1: Trigger Identification.* Look for specific phrases. "Set of all," "Class of every," "Collection of itself."
      *   *Step 2: Self-Reference Check.* Does the definition refer to the collection being defined? (The $x \notin x$ structure).
      *   *Step 3: Domain Restriction Check.* Is the collection a subset of a previously established larger set? (Safe: $\{x \in S \mid \phi(x)\}$).
      *   *Step 4: Hierarchy/Type Check.* Does the author distinguish levels (e.g., first-order beliefs vs. second-order beliefs)?
      *   *Step 5: Escalation.* If self-reference exists *and* no restriction is clear, flag for editor.
      *   *False Positives:* Metaphorical use ("the set of things on my desk"), ZFC-style subsets ("the set of beliefs held by S").
      *   *Hidden Risks:* Modal qualifiers ("all possible beliefs").

  4.  **Refining the Procedure for Non-Logicians:**
