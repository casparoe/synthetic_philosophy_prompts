          *   *Let's look at the "False Positive" instruction.* The procedure should flag safe things.
          *   *Let's look at the "Permitted but Tense" instruction.* I need to choose which of the three fits this. Case 2 is the best candidate. It sounds like a standard limitation result (like Gödel), which philosophers accept, even if the "class" talk is sloppy. The procedure might clear it because "within its domain" looks like a restriction, even if the self-reference is tricky.
