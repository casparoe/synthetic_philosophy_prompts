      *   *Major Conflict (Severity 1):* The Exclusion/Inheritance tension (2 & 3). This is the most dangerous because it threatens the core metaphysical stance. If Inheritance works for recessions, why not minds? If Exclusion works for minds, why not recessions? The user needs to distinguish the cases or drop Exclusion as a decisive metaphysical argument.
