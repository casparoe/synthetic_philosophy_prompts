          *   *Analysis:* (7) says "nothing over and above" $\neq$ unreal. (4) says emergent properties have novel causal powers.
          *   *Tension:* If it's nothing over and above the base, how can it have *novel* powers not reducible to the base powers? If the powers are just the base powers rearranged, are they novel?
