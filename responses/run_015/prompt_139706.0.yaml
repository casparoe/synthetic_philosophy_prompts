  **Bottom Line:** Adopt Proposal A in modified form to incentivize scarce skills without triggering tax liability; reject Proposal B's carry fee and Proposal C's subcontracting model to preserve our mutual aid status.

  **To:** Steering Committee, Northgate Mutual Aid Exchange
  **From:** Steering Committee Member
  **Date:** [Current Date]
  **Subject:** Decision Memo on Credit Structure Proposals

  Our current 1:1 credit system is failing to match supply with demand, leaving critical needs like furnace repair unmet while leisure services go begging. Our longest-serving member frames this as a distinction between "provisioning" (getting what you need to live) and "accumulating" (building scorecards without limit). In plain terms: are we here to help each other survive and thrive, or to build up a personal surplus? Credits should measure contribution to the community, not function as capital that breeds more credits. This distinction clarifies our path, but it stops doing work when it hits external realities like tax law. Below are my recommendations based on balancing our ethos with sustainability.

  **Proposal A: Weighted Credits (Adopt in Modified Form)**
  The strongest case for weighting credits is efficiency. If an hour of furnace repair is worth more than an hour of dog walking, members will naturally gravitate toward the work we actually need. This aligns with the view that a flat hour is the wrong unit when needs are unequal. However, our accountant warns that if hours stop being interchangeable, regulators may treat them as taxable barter income. This caveat changes the merits: we cannot simply declare an hour worth 1.5 credits without risking our non-profit status.
  *Modification:* Implement "Scarcity Bonuses" drawn from a community surplus fund rather than altering the base exchange rate. Technically, an hour remains one credit, preserving interchangeability, but members receive bonus credits for high-need work.
  *Scale and Confidentiality:* If we grew to 4,000 members, a human "needs panel" would be too slow; we would need algorithmic tracking of request backlogs. If panel deliberations must be closed for confidentiality, Proposal A becomes untenable. Trust relies on transparency; if members cannot see how value is assigned, they will suspect favoritism.

  **Proposal B: Negative Balance with Carry Fee (Reject Fee)**
  The strongest case for the carry fee is risk mitigation. Without consequences for debt, members might overdraw and leave the network, forcing others to cover the shortfall. The treasurer argues the 2% fee isn't profit but insurance against this loss, funding the hardship pool. However, charging interest on need violates the "provisioning" ethos. It penalizes those most vulnerable and transforms mutual aid into a credit union model. Furthermore, income from fees looks like profit to regulators.
  *Recommendation:* Allow the negative balance (up to 60 hours) as an act of mutual aid, but fund the hardship reserve through voluntary dues or community fundraising rather than penalizing debt.

  **Proposal C: Unlimited Banking and Subcontracting (Reject)**
  The strongest case for subcontracting is scalability. Allowing a ramp-builder to organize a team and keep a cut could dramatically increase the volume of work logged, leveraging the skills of our most productive members. However, this fundamentally changes the nature of our credits. It turns them from measures of labor into capital assets that can be invested to generate more credits. This creates employers and employees within a network designed for peers. It also guarantees regulatory scrutiny; if credits generate profit, they are taxable income. This proposal prioritizes accumulation over provisioning and should be rejected.

  **External Constraints and Scale**
  The Treasurer asked if these recommendations change at scale or under confidentiality constraints. As noted under Proposal A, a closed needs panel destroys the trust required for weighted credits. At 4,000 members, the informal social contracts that keep Proposal B (without fees) safe from exploitation weaken. At that scale, we might need to revisit the fee structure or implement stricter vetting, but for now, at 400 members, community trust should suffice to cover the risk of negative balances without interest.

  **Review Trigger**
  We will review these decisions in six months. Specifically, we will examine: (1) the fill-rate ratio of essential requests (respite/repair) versus leisure requests; (2) the total volume of negative balances and any member departures with outstanding debt; and (3) any correspondence from tax authorities regarding our credit structure.

  We must solve our liquidity crisis without becoming the very financial institutions we seek to opt out of.
