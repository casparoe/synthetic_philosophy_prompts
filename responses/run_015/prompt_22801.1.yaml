prompt: |-
  I'm taking a graduate course in formal epistemology and decision theory this term, and we spent a week on the expected value of information, where the instructor sketched what's usually called Good's theorem: that for a standard expected-utility maximizer, the expected value of any available information is non-negative, since the agent can always choose to ignore the signal and behave exactly as it would have without it. I found the one-line proof — that the informed optimum weakly dominates the best uninformed action once you take expectations over the signal — to be almost suspiciously clean, and I've been trying since to figure out whether the theorem is as general as it looks or whether it quietly depends on assumptions that fail in interesting cases.

  The cases that keep coming back to me are (i) information that is in some sense about the agent's own future choice, of the kind that shows up in Newcomb-style problems, where learning what you will do seems to change the payoff landscape rather than merely refine beliefs about a fixed world; (ii) strategic settings in which acquiring information can be a liability because it changes what other rational players expect you to do; and (iii) the way the result looks different if you reason causally about your own actions versus evidentially about them. I'm not sure these are genuine counterexamples to Good's result or merely cases where the "you can always ignore the information" maneuver is no longer available — for instance, in the self-referential case I can't even be confident that "ignore the information" names a well-defined strategy, since the act of deciding to ignore it may be what the information is about. I can't tell whether the right verdict is that the theorem is trivially true but uninteresting, that it is a deep and robust fact about rationality, or that it is an artifact of a narrow model of agents with a fixed action set and a well-behaved probability measure.

  Please write an essay that takes up this controversy and actually reaches a conclusion. I want you to lay out the standard argument for the non-negativity of the value of information and state precisely which assumptions it uses, then weigh how seriously each of the three kinds of cases above threatens those assumptions, and finally commit to a verdict about the scope and significance of Good's theorem — whether it is a universal principle, a theorem about a specific decision-theoretic idealization, or something in between — and defend that verdict against the strongest objection.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Good's Theorem on the Expected Value of Information (EVI).
      *   **Core Claim:** For a standard expected-utility maximizer, EVI is non-negative.
      *   **User's Concern:** The proof seems "suspiciously clean." Are there hidden assumptions?
      *   **Specific Challenges:**
          1.  Self-referential/Newcomb-style problems (information about own choice).
          2.  Strategic settings (information changes others' expectations).
          3.  Causal vs. Evidential decision theory (CDT vs. EDT).
      *   **Task:** Write an essay that:
          1.  Lays out the standard argument and its assumptions.
          2.  Weighs the three specific challenges against those assumptions.
          3.  Reaches a definite conclusion/verdict on the scope and significance of the theorem.
          4.  Defends that verdict against the strongest objection.

  2.  **Part 1: The Standard Argument (Good's Theorem):**
      *   *Setup:* States $S$, Actions $A$, Utility $U(s, a)$, Prior $P(s)$.
      *   *Uninformed:* Choose $a^*$ to maximize $E[U|a^*]$. Value $V_{null} = \max_a \sum_s P(s) U(s, a)$.
      *   *Informed:* Observe signal $E$ (partition of $S$ or noisy signal). Update to $P(s|e)$. Choose $a_e^*$ to maximize $E[U|a, e]$.
      *   *Expected Value:* $V_{info} = \sum_e P(e) \max_a \sum_s P(s|e) U(s, a)$.
      *   *Proof:* $\max_a f(a) \geq f(a^*)$ for any fixed $a^*$. So for each $e$, the optimal informed action is at least as good as the fixed uninformed action $a^*$. Take expectations over $e$.
      *   *Key Assumptions:*
          1.  **State Independence:** The state of the world $S$ is independent of the action chosen (or at least, the probability distribution over states doesn't change *because* you chose to look).
          2.  **Costless Information:** The act of observing doesn't subtract utility directly.
          3.  **Fixed Action Set:** The set of available actions is the same whether informed or not.
          4.  **Standard Probability:** Bayesian updating holds; no logical uncertainty.
          5.  **Causal Structure:** Actions influence outcomes, observations do not influence states (unless via action). Specifically, the observation is *exogenous* to the choice mechanism in a way that allows "ignoring."

  3.  **Part 2: Analyzing the Challenges:**

      *   **Case (i): Self-Referential/Newcomb Problems.**
          *   *Issue:* In Newcomb's Problem, the predictor predicts your choice. If you get information about the prediction (e.g., "Box B contains \$1M"), does that change your choice?
          *   *Good's Framework:* Good's theorem assumes the state (contents of boxes) is fixed *before* the choice, or at least probabilistically independent of the choice in the CDT sense.
          *   *EDT vs. CDT:* In EDT, learning you will one-box might make you one-box to correlate with the money. But Good's theorem is usually derived within CDT (or a framework where actions don't provide evidence about states *caused* by the action).
          *   *Verdict:* This violates the assumption that states are independent of actions/observations in the relevant causal sense. If the "state" includes a predictor's simulation of you, observing the state *is* observing your future action, creating a loop. The "ignore" strategy isn't well-defined because the act of looking might be what the predictor predicted.
          *   *Refinement:* It's not that EVI is negative, but that the *definition* of "information" breaks down. The signal isn't exogenous.

      *   **Case (ii): Strategic Settings (Game Theory).**
          *   *Issue:* If I learn something, my opponent might know I learned it (or anticipate it), changing their strategy.
          *   *Good's Framework:* Assumes a "decision against nature." The environment doesn't react to the *act of acquiring information*, only to the final action.
          *   *Analysis:* If the opponent sees me acquire info, the game tree changes. If the opponent *anticipates* I will be informed, the equilibrium shifts.
          *   *Verdict:* This violates the "fixed environment" assumption. In games, information acquisition is a move. If it's observable, it has strategic cost. If unobservable, Good's theorem holds *for the agent*, but the equilibrium analysis changes. The theorem applies to single-agent decision problems, not equilibrium selection in games where info acquisition is a visible move.

      *   **Case (iii): Causal vs. Evidential (CDT vs. EDT).**
          *   *Issue:* Good's theorem is standardly proven using Causal Decision Theory (maximizing causal expected utility). In EDT, information can have negative value (e.g., the "Psychopath Button" or specific medical screening cases where knowing you have a gene makes you despair, though utility is usually defined over outcomes, not beliefs).
          *   *Wait, check:* Actually, the classic counterexample to "Information is always good" in EDT is cases where the information correlates with a bad outcome but doesn't allow you to change it (e.g., testing for an incurable disease). But standard utility functions usually don't care about the *news* itself, only the outcome. If utility depends on *belief*, then info has direct utility impact.
          *   *Refinement:* Good's theorem assumes utility is a function of State and Action $U(s, a)$, not State, Action, *and Belief* $U(s, a, P)$. If I hate knowing bad news, EVI can be negative.
          *   *CDT specific:* Under CDT, if the observation is causally inert regarding the state, EVI $\geq 0$. If the observation is a "common cause" indicator (like a symptom), EDT might value it differently, but CDT says it has 0 value if you can't act on it.
          *   *Crucial Point:* The "ignore" maneuver works in CDT. In EDT, if the act of looking is evidence of something bad (e.g., "only anxious people check the news"), then looking has negative evidential value.

  4.  **Part 3: Synthesizing the Verdict:**
      *   Is it universal? No.
      *   Is it trivial? No, it defines a normative ideal for a specific class of problems.
      *   *Verdict:* It is a **robust theorem about a specific idealization**: the single-agent, causal, exogenous-information framework. It is not a universal law of rationality because "rationality" encompasses handling endogenous information and strategic interaction.
      *   *Defense:* The strongest objection is that real agents face endogenous information (Newcomb/Games). The defense is that Good's theorem delineates the boundary where *learning* is distinct from *doing*. When they blur, we need a different formalism (like CDT+ or Game Theory), not a rejection of the math within its domain. The theorem tells us *why* information is valuable: it expands the set of contingent plans. When it's not valuable, it's because the "contingency" is illusory or costly.

  5.  **Drafting the Essay - Structure:**
      *   **Introduction:** Hook with the elegance of the proof. State the thesis: Good's theorem is a profound but bounded result, defining the normative value of information *only* when information is causally exogenous and utility is outcome-dependent.
      *   **Section 1: The Architecture of the Proof.** Formalize the setup. Highlight the "max of sum vs sum of max" inequality (Jensen's inequality flavor). List assumptions explicitly (Exogeneity, Outcome-Dependency, Causal Efficacy).
      *   **Section 2: The Three Challenges.**
          *   *Newcomb/Self-Ref:* Violates Exogeneity. The signal is correlated with the action via a common cause or prediction. The "ignore" option is causally impossible or evidentially charged.
          *   *Strategic:* Violates Fixed Environment. Information acquisition is a move.
          *   *CDT/EDT:* Violates Outcome-Dependency (if utility includes peace of mind) or Causal Efficacy (if EDT treats actions as news).
      *   **Section 3: The Verdict.** It is a theorem about *causal control*, not epistemic virtue in all contexts. It marks the domain where knowledge is power.
      *   **Section 4: Defense against Objection.** Objection: "But real life is Newcomb-like." Response: "Real life is mostly Causal. Newcomb cases are pathological edge cases that reveal the structure of causation, not the norm. The theorem remains the baseline for instrumental rationality."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on EDT:* Does EDT imply negative value of information? Standard result: In EDT, free information can have negative expected utility if the utility function includes "news value" (I want to be happy). But if utility is only over world states, EDT agrees with CDT on the value of information *unless* the act of looking is itself evidence. I need to be precise here. The prompt asks about "reasoning causally... versus evidentially." I should focus on how the *definition* of expected utility changes the calculation.
      *   *Correction on Newcomb:* In Newcomb, if you can look in Box B, does that help? If the predictor predicted you would look, the money is already gone/there. If looking is allowed, it's usually assumed to be causally inert. But if the prediction was about your *final choice*, looking gives info. The issue is that in Newcomb problems, the state $S$ (money placement) is correlated with Action $A$ (one/two box). Good's theorem assumes $P(S|A) = P(S)$. Newcomb violates this.
      *   *Clarification on "Ignore":* The prompt mentions "ignore the information." In Newcomb, if I look and see \$1M, can I "ignore" it and two-box? Yes, but then I get \$1k. If I didn't look, I might have one-boxed (getting \$1M). So looking *changed* my behavior to my detriment. Why? Because the info broke my pre-commitment. This suggests the assumption violated is **Stability of Policy**.

  7.  **Final Polish:** Ensure the tone is academic yet engaging (graduate level). Make sure the conclusion is decisive. (The prompt asks to "actually reach a conclusion" and "commit to a verdict").

      *   *Verdict:* Good's Theorem is a **normative baseline for causal agency**, not a universal law. It holds precisely when the agent's epistemic state is causally decoupled from the world's state except through the agent's own interventions.

  8.  **Final Review against constraints:**
      *   Lay out standard argument? Yes.
      *   State assumptions? Yes.
      *   Weigh 3 cases? Yes.
      *   Commit to verdict? Yes.
      *   Defend against strongest objection? Yes.

      *(Self-Correction on the "Strongest Objection")*: The strongest objection is likely that the "causal/exogenous" assumption is the rule, not the exception, in complex social/psychological reality (i.e., we are always in Newcomb-like situations because people predict us). I need to argue that while predictions exist, the *causal* link is the primary driver of utility, making Good's theorem the dominant heuristic, with Newcomb cases as specific boundary conditions requiring extended formalisms (like CDT+ or FDT).

      *Wait, better objection:* The objection that "utility is often over beliefs, not just states." (e.g., blissful ignorance). This is a direct hit on the $U(s,a)$ assumption. I should address this in the EDT section or as part of the verdict defense. I'll integrate it into the "Outcome-Dependency" assumption.

      *Let's write.*
answer: |-
  # The Boundaries of Knowledge: A Defense of Good's Theorem as a Causal Baseline

  The proof of Good's Theorem is, as you noted, suspiciously clean. In its standard formulation, it demonstrates that for an expected-utility maximizer, the expected utility of obtaining free information is always at least as high as the expected utility of remaining ignorant. The argument rests on a simple inequality: the expectation of a maximum is greater than or equal to the maximum of an expectation. Formally, if $A$ is a set of actions and $E$ is a random variable representing a signal, then:

  $$ \sum_e P(e) \max_a \sum_s P(s|e) U(s, a) \geq \max_a \sum_e P(e) \sum_s P(s|e) U(s, a) $$

  The right-hand side simplifies to the optimal expected utility without information. The inequality holds because, for every possible signal $e$, the informed agent can choose the action $a_e$ optimal for that specific signal. Crucially, the set of actions available to the informed agent includes the option to replicate the uninformed agent's strategy regardless of the signal received. Thus, the informed agent weakly dominates the uninformed agent.

  However, elegance in mathematics often purchases generality by stripping away context. To understand whether Good's Theorem is a universal law of rationality or a localized artifact, we must excavate the assumptions buried in that one-line proof. The theorem relies on four critical premises:

  1.  **Exogeneity of State:** The probability distribution over states of the world $P(s)$ is independent of the act of acquiring information. The signal reveals the state; it does not influence it.
  2.  **Causal Efficacy:** The agent's utility is determined by the causal consequences of their actions on the world, not by the evidential correlation between their actions (or observations) and the world.
  3.  **Outcome-Dependent Utility:** Utility is a function of the state and the action, $U(s, a)$. It does not depend directly on the agent's belief state (i.e., there is no intrinsic value to "peace of mind" or disvalue to "anxiety").
  4.  **Fixed Action Space:** The set of available physical actions remains constant regardless of whether the agent is informed or ignorant.

  When we weigh your three challenging cases against these assumptions, it becomes clear that Good's Theorem is not a universal principle of rationality. Rather, it is a **robust theorem about causal agency in exogenous environments.** It defines the normative value of information precisely for agents who can decouple their learning from their doing.

  ### The Three Challenges

  **1. Self-Referential and Newcomb-Style Problems**
  In Newcomb's Problem, a predictor places money in a box based on their prediction of your choice. If you receive information about the contents of the box (the state), does it have positive value? Under Causal Decision Theory (CDT), which underpins Good's standard proof, the state (money placement) is causally fixed before you act. However, the *evidential* structure is tangled: your choice provides evidence about the state.

  This case violates the **Exogeneity of State** and **Causal Efficacy** assumptions. In Newcomb scenarios, the "state" is not independent of the "action" in the probabilistic sense required for the standard Bayesian update used in Good's proof. More subtly, it challenges the "ignore" maneuver. If the predictor simulated your entire decision process, including your decision to look at the box, then "looking" is not an exogenous intervention. It is part of the causal chain that determined the state. If you look and see \$1,000,000, and you know the predictor is infallible, you infer you are a "one-boxer." If you then decide to "ignore" the implication and two-box, you break the correlation that put the money there in the first place (in a retrocausal or determinist framing).

  Here, information can have negative value because it tempts the agent to deviate from a policy that yields higher utility. Good's theorem assumes the agent optimizes *after* receiving the signal. In Newcomb problems, the agent must optimize the *policy* (the mapping from signals to actions) beforehand. If the signal triggers a causal chain that undermines the policy (e.g., by revealing you are the type of agent who defects), the value of information becomes negative. This is not a refutation of Good's math, but a demonstration that the problem falls outside its domain of application.

  **2. Strategic Settings and Game Theory**
  In a strategic interaction, acquiring information can be a liability. Consider a poker game where your opponent can observe whether you choose to look at your cards. If looking signals confidence or aggression, it alters the opponent's strategy to your detriment.

  This violates the **Fixed Action Space** and **Exogeneity** assumptions. In Good's framework, "nature" does not react to the act of observation. In game theory, other agents react to your information-acquisition moves. The "ignore" maneuver is unavailable because you cannot ignore the fact that you *looked*. The act of acquiring information is itself a move in the game with its own payoff consequences.

  However, if the information acquisition is perfectly covert—unobservable to the opponent—Good's theorem holds. The threat here is not to the logic of expected utility, but to the modeling of the environment. The theorem applies to decision problems *against nature*, not to equilibrium selection in games where information acquisition is endogenous.

  **3. Causal vs. Evidential Reasoning (CDT vs. EDT)**
  The distinction between CDT and EDT strikes at the **Causal Efficacy** and **Outcome-Dependent Utility** assumptions. Good's theorem is naturally at home in CDT. In EDT, an agent maximizes $ \sum_s P(s|a) U(s, a) $. If an observation $O$ provides evidence about a state $S$ that the agent cannot influence (e.g., a genetic marker for a disease), EDT might assign value to the observation based on how it correlates with "good" actions.

  More critically, if utility depends on belief (violating **Outcome-Dependent Utility**), information can be strictly negative. If $U(s, a, P)$ includes a term for psychological comfort, then learning a high probability of a disaster reduces utility even if the disaster is unavoidable. Good's theorem assumes "truth is good" implicitly by defining utility over world states, not epistemic states. In cases of "blissful ignorance," the theorem fails because the utility function itself penalizes the reduction of entropy.

  ### The Verdict

  Good's Theorem is neither trivially true nor universally binding. It is a **normative baseline for instrumental rationality in causal environments.**

  It is not trivial because it establishes a fundamental link between flexibility and value: the ability to condition actions on states is the source of information's worth. It is not universal because it fails whenever the act of learning is causally entangled with the state of the world or the reactions of others.

  Therefore, the correct verdict is that Good's Theorem is a **theorem about a specific decision-theoretic idealization**: the single-agent, causal, exogenous-information framework. It describes the value of information for an agent who has *causal control* over outcomes but no *causal control* over the states they observe.

  ### Defense Against the Strongest Objection

  The strongest objection to this verdict is the claim that the "idealization" is too narrow to be useful. One might argue: *"In the real world, almost all information is endogenous. People predict us (Newcomb), environments react to our scrutiny (Quantum/Observer effects), and we care about our mental states (Utility over beliefs). If Good's Theorem only applies to a sterile laboratory of causal decoupling, it is a curiosity, not a pillar of decision theory."*

  This objection conflates the *application* of the theorem with the *definition* of the rational agent. The power of Good's Theorem lies not in its descriptive accuracy of every human dilemma, but in its delineation of the boundary between **knowledge** and **intervention**.

  When Good's Theorem fails (as in Newcomb problems), it is usually because the agent is treating a causal constraint as an evidential correlation, or vice versa. The failure of the theorem in those cases is a diagnostic tool. It signals that the agent is in a "Newcomb-like" situation where standard causal reasoning is insufficient, prompting the need for more sophisticated formalisms like Functional Decision Theory (FDT) or Causal Game Theory.

  Furthermore, regarding the "blissful ignorance" objection: if an agent values ignorance, they are not maximizing utility over world outcomes, but over their own psychology. Good's Theorem remains true for the *instrumental* value of information regarding external control. If I cannot change the fact that I have a terminal illness, the information has zero *instrumental* value (I cannot alter the outcome), consistent with Good's Theorem (Value = 0). If the information causes me pain, that is a cost of the *observation process* (violating the "costless" assumption), not a negation of the value of the information itself for decision-making.

  Ultimately, Good's Theorem is the "conservation of energy" for rational agency. It tells us that in a universe where actions cause outcomes and observations reveal facts, knowledge cannot hurt. When knowledge does hurt, it is proof that we are not in that universe—we are in a game, a simulation, or a psychological trap. Recognizing this distinction is the true significance of the theorem. It does not promise that information is always good; it promises that if information is bad, your model of the causal structure is wrong.
