      *   **Addressing the "Placeholder" Objection:** The objection is that treating future people as interchangeable undermines their moral status. To counter this, we must ensure that whoever comes into existence inherits a structure that respects their agency, not just their carbon footprint. The plan shouldn't just optimize for emissions; it must optimize for human flourishing regardless of identity.
