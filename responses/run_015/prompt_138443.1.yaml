answer: |-
  # ADVERSARIAL COLLABORATION: DECISION THEORY & COUNTERFACTUALS
  **Authors:** [User Name] (Pay Camp) & Jordan (Don't-Pay Camp)
  **Date:** October 26, 2023
  **Subject:** Clarifying Disagreements on Predictive Scenarios (Omega Cases)

  ## 1. AGREED CLAIMS & CASE DEFINITIONS

  We, the undersigned, agree to the following statements as the baseline for our continued discussion. We accept these as accurate descriptions of the scenarios and our respective positions, even where we disagree on the correct action.

  1.  **Definition of Decision Theory:** We agree that a decision theory is a formal framework that takes an agent's situation (knowledge, options, and potential outcomes) as input and outputs a recommended action. We agree that a "good" decision theory should be reflectively consistent (an agent using it would not wish they used a different theory beforehand) and should aim to maximize the agent's expected utility according to some metric.
  2.  **Case 1 (Counterfactual Mugging):**
      *   **Setup:** A predictor (Omega) flips a fair coin.
      *   **Heads:** Omega gives the agent $10,000 *if and only if* Omega predicted the agent would pay $100 in the Tails branch.
      *   **Tails:** Omega appears, reveals the coin is Tails, and asks for $100. No $10,000 is available in this branch.
      *   **Knowledge:** The agent knows all rules in advance. In the specific instance of decision, the agent knows the coin landed Tails.
  3.  **Case 2 (XOR Blackmail):**
      *   **Setup:** A predictor sends a note to the agent. The predictor sends the note *if and only if* exactly one of the following is true: (A) The agent's house has termites (loss of ~$1,000,000), OR (B) The agent will pay the predictor $1,000 after reading the note.
      *   **Knowledge:** The agent receives the note. The agent knows the predictor is highly reliable.
      *   **Consensus:** Both camps recommend **Do Not Pay**.
      *   **Divergence:** We acknowledge we arrive at this consensus via different reasoning paths (detailed in Section 2).
  4.  **Precommitment Consensus:** In Case 1, before the coin is flipped, both camps agree it is rational to pay $1 to purchase a gadget that forcibly commits the agent to paying the $100 if the Tails branch occurs.
  5.  **Newcomb's Problem:** We acknowledge our positions on the classic Newcomb's Problem are consistent with our positions here: Pay Camp one-boxes; Don't-Pay Camp two-boxes.
  6.  **Goal:** We agree that the purpose of this document is not to declare a winner, but to isolate whether our disagreement is substantive (about how the world works) or verbal (about how we define "rationality" or "action").

  ## 2. TABLE OF DISAGREEMENTS

  | Topic | Don't-Pay Camp (Jordan) Wording | Pay Camp (User) Wording | Verbal or Substantive? | The Underlying Crux | Agreed Test / Argument |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Case 1 Action** | "The coin is already Tails. The $10,000 is in a counterfactual world that no longer exists. Paying $100 now has no causal power to retrieve it. You are simply losing $100." | "Rationality is about winning, not just reacting to the present. If you are the *type of agent* who pays, you win $10,000 in the Heads world. You must act consistently with that type to justify the win." | **Substantive** | **The Status of Counterfactuals:** Does an agent's decision in the *actual* world logically determine outcomes in *counterfactual* worlds where the decision was the same? | **The Gadget Case:** Both agree to buy the gadget pre-coin. Why is binding your future self rational, but listening to that binding irrational when the time comes? |
  | **Case 2 Reasoning** | "Paying $1,000 does not causally remove termites. The termites are either there or they aren't. Paying is a sunk cost that reduces your wealth without changing the physical state of your house." | "Receiving the note is already evidence that the prediction occurred. Changing your decision *after* receiving the note cannot change the prediction that was already made based on your prior disposition. Paying now is updating incorrectly." | **Verbal / Nuanced** | **Updatelessness:** When does information (receiving the note) invalidate a prior policy? Is the decision made *ex-ante* (before note) or *ex-post* (after note)? | **Ex-Ante Calculation:** Calculate expected utility of the policy "If Note, Then Pay" vs "If Note, Then Don't" *before* the note is sent. Which is higher? |
  | **Definition of "Can"** | "I *can't* get the $10,000 because the physical chain of events leading to it is broken. 'Can' implies causal possibility." | "I *can* get the $10,000 because my decision algorithm determines the output in both branches. 'Can' implies logical consistency across possible worlds." | **Substantive** | **Causal vs. Logical Decision:** Is the universe governed solely by forward-moving causal arrows, or by logical dependencies between computations? | **Simulation Case:** If Omega simulates a copy of you, does hurting the copy hurt you? If yes, logical links matter. If no, only causal links matter. |

  ## 3. STRESS-TEST CASES

  We propose the following three variations to test the robustness of our positions. For each, we record the verdict, the reasoning, and what result would surprise us.

  ### Case A: The Weighted Mugging
  **Setup:** Same as Case 1, but Omega is only 60% accurate (not perfect), and the coin is weighted 90% Heads (not fair). Omega discloses these stats.
  *   **Don't-Pay Camp:**
      *   **Verdict:** Do Not Pay.
      *   **Reason:** The coin is Tails (actual world). The accuracy and weight of the coin in the counterfactual branch do not change the causal fact that the money is gone. Paying is a guaranteed loss of $100 in the actual world.
      *   **Surprise:** If we started paying. We see no threshold of accuracy/weight that makes paying rational in the Tails branch, because the causal link remains zero.
  *   **Pay Camp:**
      *   **Verdict:** Pay (likely).
      *   **Reason:** We calculate the Expected Value (EV) of the *policy*.
          *   EV = (Prob Heads × Accuracy × $10,000) - (Prob Tails × $100).
          *   EV = (0.90 × 0.60 × 10,000) - (0.10 × 100) = $5,400 - $10 = Positive.
      *   **Flip Point:** We would stop paying if the EV of the policy drops below zero (e.g., if coin was 99% Tails).
      *   **Surprise:** If Don't-Pay Camp changes their mind based on the coin weight. That would imply they care about counterfactual EV, contradicting their causal claim.

  ### Case B: The Iterated Mugging
  **Setup:** Omega runs Case 1 with you 100 times. The coin is fair. Omega makes *one* prediction at the very start by simulating your strategy for all 100 rounds. You are told this. You are currently on Round 100. You know the history of the previous 99 rounds.
  *   **Don't-Pay Camp:**
      *   **Verdict:** Do Not Pay (on Round 100).
      *   **Reason:** Backward induction. On Round 100, there is no future round to influence. The prediction is already made. Paying now cannot change the past prediction. Therefore, do not pay. By extension, you should not pay on any round.
      *   **Surprise:** If Pay Camp says "Don't Pay" on Round 100. That would admit that without future leverage, the logic collapses.
  *   **Pay Camp:**
      *   **Verdict:** Pay (on Round 100, and all previous rounds).
      *   **Reason:** Omega predicted a *strategy*, not a round-by-round reaction. If your strategy is "Pay unless it's the last round," Omega predicted that and you get $0 in the Heads branches. To win, you must be the kind of agent who pays even on Round 100.
      *   **Surprise:** If Don't-Pay Camp says "Pay." That would imply they acknowledge the prediction binds the whole sequence, not just the causal moment.

  ### Case C: The Friend Simulation
  **Setup:** Omega says it could not simulate you. Instead, it simulated your best friend, Sam, because Sam decides exactly the same way you do. Omega used Sam's decision as the prediction for *you*. Sam is standing in the room with you and hears this. Omega asks *you* for the $100.
  *   **Don't-Pay Camp:**
      *   **Verdict:** Do Not Pay.
      *   **Reason:** Sam's decision is a separate physical event. Your payment does not causally affect Sam's brain state, which is already fixed. You are paying for someone else's past action.
      *   **Surprise:** If Pay Camp refuses to pay. This case severs the "logical identity" link. If Pay Camp still pays, they believe in "spooky" logical correlations between distinct physical brains.
  *   **Pay Camp:**
      *   **Verdict:** Pay.
      *   **Reason:** If Sam decides exactly as I do, we are running the same algorithm. My decision *is* logically equivalent to Sam's decision. To refuse is to contradict the logical fact that generated the reward.
      *   **The Bribe Question:** Would Pay Camp slip Sam $10 to say "Yes"?
      *   **Pay Camp Answer:** Yes. If Sam is the one being simulated, causally influencing Sam is the most direct way to ensure the prediction is favorable. It treats Sam as a proxy for your own algorithm.
      *   **Surprise:** If Don't-Pay Camp says "Bribe Sam." That would admit that influencing the *predictor's input* is valid, which undermines their objection to influencing the counterfactual.

  ## 4. ANALYSIS OF THE DISAGREEMENT

  After drafting the above, we offer the following assessment of our two-month debate:

  **1. Where the argument is purely verbal:**
  A significant portion of our fight is about the definition of **"Rational."**
  *   Jordan (Don't-Pay) defines rationality as **"Causal Efficacy in the Actual World."** By this definition, paying in Case 1 is irrational because the action does not physically cause the reward.
  *   User (Pay) defines rationality as **"Policy Optimization Across Possible Worlds."** By this definition, paying is rational because the *disposition* to pay causes the reward in the expectation calculation.
  *   If we agree to use Jordan's definition, Jordan wins. If we agree to use User's definition, User wins. This is a verbal stalemate.

  **2. Where the disagreement is substantive:**
  The disagreement remains real in **Case C (The Friend Simulation)** and the **Precommitment Gadget**.
  *   In the Gadget case, we both agree to bind our future selves. This implies we both believe our *future* actions should be constrained by *past* expected value calculations.
  *   The substantive fight is: **Why does the binding stop working once the gadget is removed?**
  *   Jordan believes the gadget works because it physically changes the causal options available later.
  *   User believes the gadget is unnecessary if the agent is truly rational, because the agent's own logic should bind them.
  *   This is a disagreement about the nature of agency: Are we physical bodies constrained by causality (Jordan), or are we algorithms constrained by logical consistency (User)?

  **3. Projection:**
  If we continue this debate for another year, we predict the disagreement will still be sitting at **Case C**.
  *   Jordan will maintain that distinct physical brains cannot influence each other without causal signals.
  *   User will maintain that identical algorithms produce identical outputs regardless of physical substrate.
  *   **Resolution Path:** The only way to resolve this is not by arguing, but by agreeing on a metaphysical premise: *Is the universe fundamentally causal or computational?* Until we agree on that, the document stands as a record of two compatible but mutually exclusive frameworks.

  **Signed,**

  _________________________ (Pay Camp)
  _________________________ (Don't-Pay Camp)
