prompt: |-
  I'm a novelist constructing a multi-perspective narrative in which each chapter employs a different focalization and diegetic level, and I want to understand how rational belief behaves across nested storyworlds. Restate the lottery paradox and the preface paradox entirely within the vocabulary of narrative craft—focalization, diegetic embedding, narrative reliability, epistemic closure within a fiction, and the reader's own belief-set about the text—without appealing to formal epistemology except where it survives translation. For the lottery case, treat it as a reader holding thousands of individually plausible beliefs about minor plot details, each carrying a small risk of error, while still maintaining that the overall narrative is coherent; for the preface case, treat it as an author admitting in an author's note that some sentences in the novel are false, despite believing each one individually during composition. For each paradox, specify what translates cleanly into narratological terms, what must be distorted—particularly any notion of belief that applies differently to fictional worlds than to real ones—and what has no expression at all within this framework. Then provide a residue report: does the untranslated remainder indicate a genuine limitation in how fiction theory handles aggregate rational belief, or does it reveal that the philosophers' dispute concerns commitments that have no counterpart in how novels actually manage reader credence and authorial fallibility? I am fluent in basic narratology but not in formal logic, so keep the philosophical machinery implicit and the narrative vocabulary precise.
