          Proponents invoke the Principal Principle: rational credence should match objective chance absent inadmissible evidence. However, this principle holds only if the chance function governs the specific case. Our probabilities derive from interventional trials, yet our patients present in observational settings with complex comorbidities excluded from trials. Consequently, these probabilities are not strictly "objective chances" for this population but rather heuristic estimates. Mandating alignment treats flawed reference classes as authoritative, potentially calculating error rather than precision.

          **Engaging the Opposition**
          Opponents argue that clinical reasoning relies on tacit, case-specific cues wrongly classified as inadmissible. This is the strongest objection. Expert intuition often synthesizes subtle physiological cues unavailable in cohort data. To categorically dismiss these as inadmissible evidence is to privilege incomplete data over experienced judgment. We must acknowledge that what appears as "bias" may be unrecognized pattern recognition valid in observational contexts.

          **Implementation and Sunset**
