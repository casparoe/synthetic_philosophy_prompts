      *   **Proponents' Argument:** Institutional deference to objective chance; rational credence should align with known base rates absent admissible underminers (Principal Principle).
      *   **Opponents' Argument:** Clinical reasoning relies on tacit, case-specific cues (wrongly classified as inadmissible); hospital probabilities come from interventional trials, patients are in observational settings (chances may not govern actual outcomes).
      *   **Requirements:**
          *   Recommend approval, rejection, or approval with conditions.
          *   Provide a concrete course of action (implementation boundary or sunset clause).
          *   Explain how the Principal Principle applies (or doesn't) given the interventional-observational mismatch.
          *   Engage the strongest argument on the losing side with genuine weight.
          *   No citations/bibliographies.
          *   Maximum 400 words.
