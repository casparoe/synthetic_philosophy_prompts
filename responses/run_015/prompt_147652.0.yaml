      *   *Section 1: The Mapping (The Ledger).* Define the terms clearly.
          *   Account Holder: The Moral Patient (Individual). *Crucial distinction:* Is it one account per person or one global account?
          *   Currencies: Qualitative states.
          *   The Rule: The Lexical Threshold.
      *   *Section 2: The Smuggled Baggage (Where it breaks).*
