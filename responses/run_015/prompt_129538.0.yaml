answer: |-
  **JOINT STATEMENT ON INDIVIDUAL AGENCY AND COLLECTIVE HARM**

  **1. Agreed Premises and Empirical Commitments**

  The undersigned representatives of the Probabilistic Contributionist and Counterfactual-Threshold Structuralist camps affirm the following claims as the common ground for this collaboration. These statements are formulated to remain neutral regarding the ultimate moral conclusions drawn from them.

  1.  **Empirical Dynamics of Supply Chains:** We agree that modern industrial supply chains do not operate on a strictly linear, unit-for-unit basis between individual consumption and immediate production. Restocking decisions are typically made in batches based on aggregate sales data, inventory thresholds, and predictive algorithms. Consequently, a single purchase does not guarantee the immediate production of a single additional unit, nor does a single abstention guarantee the prevention of one.
  2.  **Logical Structure of Overdetermination:** We agree that many large-scale harms (such as anthropogenic climate change or systemic labour exploitation) exhibit the structure of causal overdetermination. In numerous specific instances, the harmful outcome would have occurred identically even if a specific individual had refrained from their contributory action, due to the actions of others filling the gap or the harm being locked in by prior aggregate conditions.
  3.  **Definition of the Inefficacy Objection:** We agree that the 'inefficacy objection' asserts that individual moral obligations to refrain from contributory actions are undermined when the individual's action lacks counterfactual efficacy regarding the specific harm in question. Both camps accept this as the central challenge to be addressed, regardless of whether they ultimately accept or reject the objection's force.
  4.  **Distinction Between Obligations:** We agree that a distinction exists between *individual obligations* (duties incumbent upon an agent to perform or refrain from a specific act) and *collective or institutional obligations* (duties incumbent upon groups, states, or corporations to alter systems, rules, or structures). We further agree that the existence of collective obligations does not logically entail the existence of individual obligations in every instance, nor does the existence of individual obligations negate the necessity of collective action.
  5.  **The Substitutability Assumption:** We agree that the assessment of individual impact relies heavily on assumptions regarding market substitutability. Specifically, the question of whether an individual's abstention results in a net reduction of harm depends on whether the unpurchased good is destroyed, stored, or purchased by a different consumer, and whether the producer adjusts future output in response to marginal demand signals.

  **2. Formulations of Residual Disagreement**

  The following table delineates the precise points of divergence. The characterisations in the first two columns are drafted to be acceptable to each respective camp, while the third column provides a neutral mapping of the conceptual gap.

  | Domain of Disagreement | Probabilistic Contributionist Formulation | Counterfactual-Threshold Structuralist Formulation | Neutral Characterisation of the Gap |
  | :--- | :--- | :--- | :--- |
  | **Moral Relevance of Risk** | An agent acts wrongly if they impose a non-zero risk of severe harm, weighted by the magnitude of that harm, even if the harm does not materialise in the actual world. | An agent acts wrongly only if their action is a 'but-for' cause of actual harm; imposing risk without actual realisation constitutes recklessness but not necessarily a violation of a duty to refrain. | **Expected Value vs. Actual Causation:** Whether moral wrongness attaches to the ex-ante probability of causing harm or the ex-post reality of causing harm. |
  | **Supply-Chain Sensitivity** | Marginal changes in consumer demand transmit through supply-chain elasticity over time; individual purchases contribute to the data signals that trigger production thresholds, creating a probabilistic link to harm. | Buffer stocks, waste, and secondary markets absorb marginal fluctuations; without evidence that a specific purchase triggered a production batch, the link between consumption and harm is too attenuated to ground obligation. | **Signal Transmission:** Whether individual consumption acts as a causal signal sufficient to trigger production adjustments, or whether it is absorbed by systemic slack. |
  | **Basis of Voting Duty** | The obligation to vote derives from the expected marginal impact: the probability of being decisive multiplied by the differential value of the outcomes, which remains significant given the stakes. | The obligation to vote derives from a role-based duty to participate in collective self-governance, or is rejected in favour of duties to reform the electoral system where individual impact is negligible. | **Instrumental vs. Non-Instrumental:** Whether the duty is grounded in the causal efficacy of the vote or in the expressive/structural role of the voter. |
  | **Response to Overdetermination** | Overdetermination reduces the *probability* of making a difference but does not eliminate the *expected value* of the action; obligation persists proportional to the risk-weighted impact. | Overdetermination severs the *counterfactual dependence* required for responsibility; obligation shifts from individual abstention to structural intervention where efficacy is assured. | **Persistence of Duty:** Whether duty degrades smoothly with probability or vanishes when counterfactual dependence is broken. |

  **3. Cruxes and Adjudicating Cases**

  The following sub-questions represent the critical cruxes of the debate. Resolving these empirically or conceptually would necessitate a significant update in the position of at least one camp. For each crux, a concrete case is specified, along with the divergent predictions each camp makes regarding what that case demonstrates.

  **Crux A: The Substitutability and Elasticity Assumption**
  *Question:* Does demand-driven harm rely on a substitutability assumption that holds for individual consumers in actual markets, specifically regarding whether marginal demand signals trigger production?

  *   **Concrete Case:** A defined scenario involving a just-in-time inventory system for perishable goods (e.g., fresh poultry). In this system, orders are placed by the retailer to the producer based on sales velocity algorithms that trigger restocking when inventory dips below a specific threshold.
  *   **Probabilistic Contributionist Prediction:** They predict that modelling this algorithm will show that individual purchases accumulate to trip the threshold with non-negligible frequency. Therefore, the individual purchase carries a probabilistic causal weight equivalent to a fraction of a production batch.
  *   **Counterfactual-Threshold Structuralist Prediction:** They predict that modelling will show significant buffer zones and waste margins. They assert that the unpurchased unit will either be discarded (waste) or sold later (substitution), meaning the production order would have been placed regardless of the specific individual's timing, nullifying the causal link.

  **Crux B: Counterfactual Dependence vs. Probabilistic Contribution**
  *Question:* Can moral obligation be sustained by probabilistic contribution alone, or does it strictly require counterfactual dependence (the harm would not have occurred but for the action)?

  *   **Concrete Case:** The 'Single Trigger' Scenario. Imagine a mechanism where 1,000,000 agents each press a button. If exactly 500,000 press it, a harm occurs. If 499,999 press it, no harm occurs. Agent X presses the button. It is unknown whether the threshold was met by others, but the statistical likelihood is that the threshold was exceeded regardless of X. However, there is a non-zero probability that X was the 500,000th press.
  *   **Probabilistic Contributionist Prediction:** They argue this case shows obligation persists. Even if it is *likely* X was redundant, the *possibility* of being decisive, multiplied by the severity of the harm, generates a sufficient expected disvalue to forbid pressing the button.
  *   **Counterfactual-Threshold Structuralist Prediction:** They argue this case shows obligation vanishes in the absence of knowledge. If the system is overdetermined (likely exceeded threshold), X's action is causally inert in the actual world. They maintain that without confirmation of counterfactual dependence, the moral charge is misplaced; the duty lies in changing the mechanism, not refraining from pressing.

  **Crux C: Voting Obligations and Marginal Impact**
  *Question:* Do voting obligations derive from expected marginal impact, or from role-based collective duties that do not reduce to individual causation?

  *   **Concrete Case:** A 'Safe Seat' Election. A specific electoral district where the winning margin has historically exceeded 20,000 votes, and the cost (in time and effort) to vote is non-trivial. The probability of a single vote being decisive is mathematically vanishingly small (e.g., 1 in 10^50).
  *   **Probabilistic Contributionist Prediction:** They predict that a rigorous expected utility calculation will still yield a positive moral value for voting. They argue that the stakes (national policy impact) are so high that even a microscopic probability of decisiveness outweighs the trivial cost of voting, sustaining an individual obligation.
  *   **Counterfactual-Threshold Structuralist Prediction:** They predict that the expected utility calculation will fail to ground a duty in this specific case due to the near-zero probability. They argue that if an obligation exists here, it must be non-instrumental (e.g., civic duty), but strictly speaking, the *harm-prevention* obligation falls on changing the electoral system (e.g., proportional representation) rather than the individual act of casting a ballot in a rigged or safe context.

  **4. Commitment to Further Inquiry**

  Both camps acknowledge that the resolution of these cruxes requires interdisciplinary engagement. The Probabilistic Contributionists commit to refining their empirical models of supply-chain elasticity to ensure they do not rely on idealised linear assumptions. The Counterfactual-Threshold Structuralists commit to clarifying the precise conditions under which collective obligations translate into actionable individual directives, avoiding the implication that structural focus permits individual moral disengagement. We agree to revisit this statement should new empirical data regarding market elasticity or new formal models of overdetermined causation become available.
