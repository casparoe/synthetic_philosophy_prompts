answer: |-
  Here is a draft for your one-pager. It is designed to be handed to non-philosophers (staff, admins) without triggering eye-rolls, but it retains the ethical rigor you need.

  Following the draft, I have included a "Instructor's Note" section for you, explaining where the math gets messy and why one of these results is going to be a headache for you.

  ***

  # The Animal Impact Check (AIC)
  **For Dining Services Advisory Committee Use**

  **Purpose:** To quickly identify how menu changes affect animal welfare, alongside cost and satisfaction.
  **Time Required:** < 5 Minutes.
  **Goal:** Reduce intentional harm to animals without requiring perfect data.

  ### The 4-Question Checklist
  *Ask these in order. If you hit a **STOP**, the proposal needs revision or a full committee debate.*

  **1. Does this change the *number* of individual animals killed?**
  *   **Look for:** Swapping species (e.g., beef to chicken), changing portion sizes, or removing/adding meat days.
  *   **Rule of Thumb:** Chickens, fish, and pigs are smaller than cows. Swapping beef for chicken usually means *more* individual deaths, even if the weight is the same.
  *   **STOP:** If the change significantly increases the headcount of animals killed.

  **2. Does this change the *conditions* of life or death for the animals?**
  *   **Look for:** Switching suppliers, changing certifications (e.g., "cage-free," "pasture-raised"), or changing slaughter methods.
  *   **Rule of Thumb:** Better living conditions are good. However, switching to a "higher welfare" meat that costs significantly more may reduce the total budget for other food, potentially leading to lower quality elsewhere.
  *   **STOP:** If the proposal claims "better welfare" but hides a significant price hike that threatens the overall budget.

  **3. Is the reduction in meat intentional, or just a side effect?**
  *   **Look for:** "Meatless Monday" vs. "We ran out of beef so we used beans."
  *   **Rule of Thumb:** Intentional reductions (like dedicated veg days) are reliable. Accidental reductions (cost-cutting swaps) might be reversed next semester.
  *   **PASS:** Intentional reductions in animal products.
  *   **FLAG:** Cost-cutting swaps that happen to reduce meat (verify they don't violate Question 1).

  **4. Are we ignoring "Crop Deaths"?**
  *   **Look for:** Proposals that claim "Plant-Based = Zero Harm."
  *   **Rule of Thumb:** Growing plants kills field animals (mice, insects) during harvest. It is not zero harm. However, feeding plants directly to humans kills fewer animals than feeding plants to livestock and then eating the livestock.
  *   **PASS:** Plant-based options are still generally lower harm than meat, even accounting for crop deaths. Do not reject veg options based on this, but acknowledge it's not "harm-free."

  ---

  ### Decision Output

  *   **GREEN LIGHT:** Passes all questions. No significant increase in animal deaths or suffering.
  *   **YELLOW LIGHT (The Punt):** Passes numbers, but raises a values question (e.g., "Is a happy life worth a premature death?"). **Action:** Open floor for 5-minute debate.
  *   **RED LIGHT:** Fails Question 1 (Increases headcount) or Question 2 (Worsens conditions). **Action:** Vote No or Request Revision.

  ***

  # Test Run: Three Real Proposals

  Here is how the AIC handles the proposals you mentioned.

  ### 1. Proposal: Swap Default Protein from Beef to Chicken (Cost Savings)
  *   **Q1 (Number of Animals):** **FAIL.**
      *   *The Math:* One steer yields ~400kg of meat. One chicken yields ~2kg of meat. To replace one cow, you need ~200 chickens. Even if the *weight* of meat is the same, the *body count* skyrockets.
      *   *Result:* **RED LIGHT.**
  *   **Verdict:** **Oppose.**
  *   **Why this hurts:** This saves money and lowers carbon footprint, which the committee likes. But from an *animal ethics* perspective, it multiplies the number of deaths by 100x. You will have to vote against a cost-saving measure that looks "lighter" to everyone else.

  ### 2. Proposal: "Meatless Monday" (Larger Veg Portions)
  *   **Q1 (Number of Animals):** **PASS.**
      *   *The Math:* One day a week without meat = ~14% reduction in slaughter volume for that station. Crop deaths still occur for the veg, but the "multiplier effect" of livestock is removed.
      *   *Result:* Clear reduction in intentional killing.
  *   **Q3 (Intentional):** **PASS.** It is a dedicated policy, not an accident.
  *   **Verdict:** **GREEN LIGHT.**
  *   **Why this works:** This is the easiest win. It reduces harm without needing complex data on supplier conditions.

  ### 3. Proposal: Switch to Local Pasture-Raised Beef (Higher Cost)
  *   **Q1 (Number of Animals):** **NEUTRAL.**
      *   *The Math:* Same number of cows killed per kg of meat.
  *   **Q2 (Conditions):** **YELLOW LIGHT (The Punt).**
      *   *The Conflict:* The cows live better lives (pasture vs. feedlot). But they still die young.
      *   *The Values Question:* Is it better to have 100 cows live happily and die at age 2, or 100 cows live miserably and die at age 2? Or is the death itself the main harm?
      *   *Cost Factor:* The higher price might mean less money for other ethical initiatives (like more veg options).
  *   **Verdict:** **PUNT TO DEBATE.**
  *   **Why this is messy:** The checklist cannot solve this. It depends on whether you value "Quality of Life" more than "Right to Life." The committee must vote based on values, not just math.

  ***

  # Instructor's Note: Where This Breaks (Read This Before You Present)

  You asked for honesty about where the procedure misfires. Here is what you need to keep in your back pocket if the committee pushes back.

  **1. The "Chicken Math" Problem (Proposal 1)**
  This is the outcome you might not like. Most people intuitively feel Beef is "worse" than Chicken because of climate change or the size of the animal. Your ethics class taught you that *sentient individuals* matter.
  *   **The Hard Truth:** If your goal is to minimize the number of deaths, Beef is actually "better" than Chicken per kilogram.
  *   **The Risk:** If you argue this hard, you might look like you are defending Beef. You need to frame it carefully: *"I am not advocating for more beef. I am advocating against multiplying the death count by switching to smaller animals."* Ideally, you push for **Plant-Based**, not Beef. But if the choice is strictly Beef vs. Chicken, the math favors Beef on animal count, even if it loses on carbon.

  **2. The Data Gap (Crop Deaths)**
  In Question 4, I told you to pass plant-based options. Be aware: **Nobody knows the exact number of animals killed per hectare of soy or wheat.**
  *   Estimates vary wildly (from negligible to significant).
  *   **The Defense:** Even if crop deaths are high, livestock eat crops. It takes roughly 6kg of plant protein to make 1kg of animal protein. Therefore, eating the plants directly *must* result in fewer crop deaths than feeding them to animals first. You don't need the exact number to know the direction of the math.

  **3. The "Happy Meat" Trap (Proposal 3)**
  The procedure punts on Pasture Beef because Utilitarianism (maximizing happiness) and Rights-Based Ethics (no killing allowed) disagree here.
  *   **Utilitarian View:** If the cow has a net positive life, eating it might be permissible.
  *   **Rights View:** Killing a being that wants to live is wrong, regardless of how nice the pasture was.
  *   **Your Strategy:** Since you are on a committee, you are likely operating in a Utilitarian framework (weighing costs/benefits). In that frame, Pasture Beef is a "Yellow Light." It is ethically superior to Factory Beef, but ethically inferior to Lentils. Use the **Cost** lever here: *"If we spend the budget on expensive beef, we can't afford to expand the vegan station. Which helps more animals?"*

  **4. Why this One-Pager Works**
  It avoids words like "sentience," "utilitarian," or "intrinsic value." It speaks the committee's language: **Count, Conditions, Cost, and Intent.** It gives you a structured way to say "No" without sounding like you are imposing a personal belief system. You are just running the numbers they asked for.
