prompt: |-
  so i'm an undergrad taking an animal ethics course this semester (honestly its my favorite class) and i somehow got elected student rep on the university's dining services advisory committee. every couple of weeks we vote on menu proposals from the dining staff -- stuff we've had this semester: swapping the default protein at the burrito station from beef to chicken to save money, adding a "meatless monday", switching to a cheaper chicken supplier, etc. the rest of the committee is staff who care about cost and student satisfaction, and i'm the only one who thinks about the animal side, but i can't exactly run a full utilitarian calculation on each proposal in the five minutes it gets in the meeting. from my course i've learned enough to know it's messy: the obvious stuff (chicken vs beef, where per kg chicken means vastly more animals killed), but also the less obvious stuff like animals dying in crop cultivation from harvesting, which makes even "just add more plant-based options" not a free win. i want a decision procedure i can actually run, maybe on a napkin: a short ordered list of questions to ask about any proposal, what counts as enough of an answer to each one, where the procedure outputs a no, and where it should punt and say "this is a values question, argue it in the open instead." then run it on three realistic proposals: (1) replacing beef with chicken at two stations to cut costs, (2) a meatless monday where the vegetarian option is just a bigger portion of veg they already serve, and (3) switching to a local pasture-raised beef that costs noticeably more. at least one of these should come out with an answer i won't like, and you should be upfront about where the procedure misfires or depends on numbers nobody actually has (like how many animals die per kg of each food, or per hectare of crops). also keep the philosophy jargon out or define it in plain words, since i have to hand a one-page version of this to the other committee members and they will not read anything that sounds like a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Undergrad student, taking animal ethics (favorite class), newly elected student rep on dining services advisory committee.
      *   **Context:** Committee votes on menu proposals (cost, satisfaction, animal welfare). User is the sole voice for animals.
      *   **Constraint:** Meetings are fast (5 mins per proposal). Can't do full utilitarian calculus. Needs a "napkin" decision procedure (short, ordered list of questions).
      *   **Requirements:**
          *   Define "No" conditions.
          *   Define "Punt" conditions (values question).
          *   Apply to three specific scenarios (Beef->Chicken, Meatless Monday, Local Pasture Beef).
          *   At least one outcome must be unpalatable/unexpected (honesty about trade-offs).
          *   Acknowledge data gaps (crop deaths, etc.).
          *   **Tone/Style:** Plain language (no heavy jargon), suitable for a one-pager to non-philosophers.
      *   **Goal:** A practical ethical heuristic for institutional decision-making.

  2.  **Deconstruct the Ethical Problem:**
      *   The user knows utilitarianism is messy (crop deaths, comparative suffering).
      *   The committee cares about Cost and Satisfaction.
      *   The user cares about Animal Harm.
      *   *Challenge:* How to integrate Animal Harm into a Cost/Satisfaction framework without needing perfect data?
      *   *Strategy:* Use a "Threshold + Comparison" approach. Instead of "minimize all harm" (impossible), ask "Does this increase harm significantly?" or "Does this reduce harm without breaking the bank?"

  3.  **Drafting the Decision Procedure (The "Napkin Test"):**
      *   Needs to be 3-5 questions max.
      *   Needs to be actionable.
      *   *Question 1: Direct Impact.* Does this change the number of animals killed or their suffering? (Binary check).
      *   *Question 2: Magnitude.* Is the change significant? (Avoid nitpicking).
      *   *Question 3: Alternatives.* Was a better option ignored for trivial cost savings? (The "Low Hanging Fruit" test).
      *   *Question 4: The "Punt".* When do we admit we don't know? (Data gaps).
      *   *Refinement:* Let's structure it as a flowchart logic but written as a checklist.
      *   *Key Insight:* The user mentioned crop deaths. This is the "least imperfect" argument often used against veganism. I need to address this without getting bogged down. The procedure should prioritize *direct* intentional killing over *indirect* accidental killing, as that's the lever the university actually controls.

  4.  **Developing the Three Scenarios:**

      *   **Scenario 1: Beef -> Chicken (Cost Cutting).**
          *   *Ethical Math:* Beef (large animal, long life, fewer individuals per kg) vs. Chicken (small animal, short life, *many* individuals per kg).
          *   *Standard View:* Chicken is usually "worse" in terms of individual count, though beef has higher carbon footprint. From a *sentient individual* count perspective, swapping beef for chicken usually increases the number of deaths.
          *   *Outcome:* This should be the one the user "won't like." It exposes the counter-intuitive math of animal ethics (weight vs. count).
          *   *Verdict:* **Oppose.**

      *   **Scenario 2: Meatless Monday (Veg portion increase).**
          *   *Ethical Math:* Removing meat one day = fewer animals killed. Crop deaths still happen, but net reduction in intentional slaughter.
          *   *Outcome:* Clear win.
          *   *Verdict:* **Support.**

      *   **Scenario 3: Local Pasture-Raised Beef (Higher Cost).**
          *   *Ethical Math:* "Happy meat" debate. Does a good life + quick death outweigh a bad life + quick death? Or is killing unnecessary regardless?
          *   *Committee Context:* Cost is higher.
          *   *Outcome:* This is the "Values Question." Utilitarians disagree here. Some say "better welfare is good," others say "death is the harm."
          *   *Verdict:* **Punt/Debate.** (Or, if I need a firm "No" based on strict reduction, I could argue against it, but the prompt asks for where the procedure misfires. The "Happy Meat" paradox is the best place for uncertainty).
          *   *Wait, let's look at the "One outcome you won't like" constraint.*
          *   If I make Scenario 1 a "No" (because chickens > cows in count), that's the unintuitive one.
          *   If I make Scenario 3 a "Yes" (because welfare is better), that contradicts abolitionist views.
          *   If I make Scenario 3 a "No" (because killing is still killing), that ignores welfare improvements.
          *   *Decision:* Let's make Scenario 1 the "Hard No" (Chicken is ethically worse than Beef by numbers). This is often shocking to people who think Chicken = Lighter Option. Let's make Scenario 3 the "Punt" because it depends on whether you value "quality of life" over "right to life."

  5.  **Refining the "Napkin" Language:**
      *   Avoid "Utilitarian Calculus," "Deontology," "Sentience."
      *   Use "Harm," "Count," "Suffering," "Necessity."
      *   Make it look like a checklist the committee can actually use.

  6.  **Addressing Data Gaps:**
      *   Must admit we don't know exact crop death numbers.
      *   Must admit we don't know exact suffering levels of pasture vs. factory.
      *   The procedure needs a "Default Position" when data is missing (e.g., assume intentional killing is worse than accidental).

  7.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Acknowledge the role.
      *   *The Tool:* "The 4-Question Animal Impact Check."
      *   *The Test Cases:* Walk through the logic.
      *   *The Caveats:* Be honest about the limits.

      *(Self-Correction during drafting)*: I need to make sure the "Beef to Chicken" result is clear. Many people think Beef is worse because of climate. But the prompt is *Animal Ethics*, not Environmental Ethics. In animal ethics, 1 Cow = ~1 life. 1 Cow's worth of meat = ~100+ Chickens = ~100+ lives. Swapping Beef for Chicken *increases* the body count. This is the crucial insight the user needs to bring to the committee.

      *(Refining the "Punt")*: The Pasture Beef is the best punt. It forces the committee to ask: "Do we care more about the animal having a nice life before death, or not dying at all?" That's a philosophical question, not a math one.

  8.  **Final Review against Constraints:**
      *   Undergrad tone? Yes.
      *   No jargon? Yes.
      *   One-pager friendly? Yes.
      *   Three scenarios run? Yes.
      *   One unpopular outcome? Yes (The Chicken swap).
      *   Data gaps acknowledged? Yes.

  9.  **Final Polish:** Ensure the distinction between "Direct Harm" (slaughter) and "Indirect Harm" (crop harvest) is clear, as that's the user's specific worry. The heuristic should prioritize reducing Direct Harm as the primary lever.

  **(Self-Correction on Scenario 1):** Wait, if the proposal is "swap default protein... to save money," the committee *wants* to do it. If my procedure says "No," the user has to vote No. That fits the "outcome I won't like" (because it's a fight) or "outcome that reveals a hard truth." Actually, the prompt says "at least one of these should come out with an answer i won't like." This implies the *procedure's conclusion* might contradict the user's intuition or make their life hard.
  *Interpretation A:* The procedure says "Yes" to something the user thinks is bad.
  *Interpretation B:* The procedure says "No" to something the user wants to support (unlikely here).
  *Interpretation C:* The procedure reveals that a "good" environmental swap (Beef to Chicken) is a "bad" animal swap. This is the most educational/uncomfortable truth. I will stick with: The procedure flags the Beef->Chicken swap as ethically negative regarding animal *count*, which makes the user's job harder because they have to argue against a cost-saving measure that looks "lighter" to others.

