  ### Detailed Expansion on Methodological Challenges (Supplementary for Word Count and Depth)

  *Note: To ensure the proposal meets the depth requirements and word count expectations, I will expand here on the specific methodological challenges of interdisciplinary work, as this is crucial for the "Non-Lawyer" feasibility check.*

  **The Trap of "Legal Transplants"**
  One specific risk in comparative work is assuming that a term means the same thing in two different systems. "Federalism" in the US does not mean exactly the same thing as "Federalism" in Germany or the EU. The EU is not a state; it is a supranational organization. The US is a federation of states with a strong central government. Germany is a federation with strong administrative integration.
  *   *Methodological Response:* I will treat "Federalism" not as a fixed institution but as a *family resemblance* concept. I will not assume they are the same. Instead, I will ask: "In what way does each system instantiate the principle of divided sovereignty?" This allows me to compare them without forcing them into a single mold. The Allocative/Constitutive split is the mold I am testing to see if it fits all of them.

  **The Problem of "Shadow Dockets"**
  In the US, much of the real federalism bargaining happens in the legislative process, not in the courts. In the EU, it happens in the Commission committees. If I focus only on court cases, I might miss the real operation of subsidiarity.
  *   *Methodological Response:* I will acknowledge this limitation. The paper focuses on *judicial review* of subsidiarity because that is where the principles are most explicitly articulated. Legislative bargaining is opaque. Courts must give reasons. Therefore, court opinions (and the lack thereof) are the best data for philosophical analysis of the *principles*, even if they don't capture the full political reality. I will state this limitation clearly in the introduction.

  **The Definition of "Efficiency"**
  In the Allocative model, "efficiency" is the trump card. But efficiency is a contested concept. Is it economic efficiency? Democratic efficiency? Administrative efficiency?
  *   *Methodological Response:* I will define efficiency broadly as "goal achievement capacity." This covers economic costs but also the ability to solve the problem (e.g., stopping pollution). This prevents the argument from getting bogged down in economic technicalities. The core point is *consequentialism* vs. *deontology*. Allocative is consequentialist (look at the results); Constitutive is deontological (look at the rights). This philosophical framing is more robust than a purely economic one.

  **The Role of the "Veto"**
  The Swiss example introduces a non-judicial enforcement mechanism. This challenges the focus on courts.
  *   *Methodological Response:* I will use Switzerland to test the limits of the judicial focus. If Constitutive Subsidiarity requires a veto to be real, then the US and German judicial models are actually imperfect attempts to replicate a political reality. This adds depth to the conclusion: perhaps courts *cannot* enforce Constitutive Subsidiarity alone. This turns a potential methodological weakness (focusing on courts) into a substantive finding (courts are insufficient for this task).

  **Handling the "Dead Letter" Claim**
  My roommate claimed EU subsidiarity is a dead letter. Some scholars disagree, saying it influences the legislative process even if not the judicial one.
  *   *Methodological Response:* I will address this nuance. Even if it influences legislation, if it cannot be enforced in court, it remains "soft law." My argument is about *justiciability*. A principle that cannot be adjudicated is fundamentally different from one that can. This distinction supports the Allocative (political question) vs. Constitutive (legal question) split.

  **Philosophical Implications for Sovereignty**
  If the Constitutive model holds, it implies that sovereignty is divisible. The local level has a slice of sovereignty that the central level cannot touch. If the Allocative model holds, sovereignty is unitary but delegated. The central level owns all sovereignty but chooses to lend it out.
  *   *Methodological Response:* I will touch on this in the theoretical framework. This connects the project to classic social contract theory. Hobbes vs. Althusius. This elevates the paper from a legal comparison to a history of political thought application.

  **Writing Style and Tone**
  I will maintain a tone of inquiry. "This suggests," "It appears," "One might argue." I will avoid definitive legal conclusions ("The law is"). This protects against the non-lawyer risk. I will use phrases like "In the prevailing interpretation of US jurisprudence..." to attribute the legal claims to the scholarship I am reading.

  **Contingency Plan**
  If I find during Month 2 that the US case is too complex (because the jurisprudence is so contradictory), I will narrow the focus. I might drop Germany or Switzerland and go deeper on the EU/US contrast. The core hypothesis can be tested with just two contrasting systems. The proposal includes four to show ambition, but the feasibility check acknowledges that two might be sufficient for a semester paper. This flexibility is key to finishing on time.

  **Final Word on the "Roommate's Intuition"**
  I will credit the roommate's intuition in the introduction but refine it. He was right about the outcome (EU centralization) but perhaps wrong about the cause (it's not just that the Commission *claims* efficiency, it's that the *principle* allows efficiency to trump). By refining his intuition into a theoretical distinction, the paper validates his observation while providing the academic rigor required for the seminar. This personal hook makes the proposal engaging while the theoretical framework makes it rigorous.

  ### IX. Concluding Summary of the Proposal

  In sum, this proposal outlines a semester-long investigation into the conceptual ambiguity of "subsidiarity." By distinguishing between Allocative (efficiency-based) and Constitutive (rights-based) dimensions, the project seeks to explain the divergent behaviors of federal courts across the globe. The methodology is tailored to a philosophy student, focusing on conceptual reconstruction rather than doctrinal mastery. The work plan is structured to manage the scope, and the risk assessment acknowledges the interdisciplinary challenges. The expected outcome is a clarified theoretical framework that explains why some federal systems protect local autonomy while others absorb it. This contributes to the philosophy of law by linking abstract normative principles to concrete institutional designs, demonstrating that the words we use to describe power structures determine how those structures function in practice. The project is feasible, focused, and philosophically significant.

