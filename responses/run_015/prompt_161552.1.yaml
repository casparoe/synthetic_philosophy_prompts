          4.  Does the film run an informal experiment on the audience (narrative reframing)?
          5.  Meta-question: If intentionality tracks moral evaluation, can the film's verdict (or Schindler's self-verdict) independently argue for praiseworthiness? (Circularity worry).
          6.  Critique/Limitations: Where does this break? Biopic vs. History? Vignette with costumes?
      *   **Constraints:** No citations/bibliographies. Flag confidence levels. Flag memory uncertainties. Identify the least sure point.

  2.  **Initial Brainstorming & Candidate Readings:**
      *   *Idea 1: The Standard Knobe Application.* Schindler is the Chairman. Profit = Goal. Saving Jews = Side Effect (Good). Exploiting Jews = Side Effect (Bad). The Knobe Effect says we say he *intentionally* did the bad side effect (exploitation) but not the good one (saving).
      *   *Idea 2: The Complexity of Motive.* Schindler isn't just indifferent. He changes. The "Strategic Indifference" variant is key here. He *pretends* not to care to save them. This breaks the standard vignette structure where the attitude is stipulated.
      *   *Idea 3: The Narrative Arc.* The film manipulates our moral valuation of Schindler over time. Early Schindler (exploiter) vs. Late Schindler (savior). Does our intentionality attribution shift mid-movie?
      *   *Idea 4: The Meta-Ethical Trap.* If "intentional" just means "morally significant," then calling his saving "intentional" is just praising him. It doesn't explain *why* he's praiseworthy. It creates a loop.

  3.  **Developing the Standard Accounts (Question 1 & 2):**
      *   *Setup:* Schindler = Chairman. Factory = Program. Profit = Goal.
      *   *Side Effect A (Exploitation):* Foreseen, Bad. Standard Knobe: Intentional.
      *   *Side Effect B (Rescue):* Foreseen, Good. Standard Knobe: Unintentional (at first).
      *   *Deep Self (Sripada/Shepherd):* Depends on alignment with deep values. Early Schindler: Exploitation aligns (greed), Rescue doesn't. Late Schindler: Rescue aligns, Exploitation doesn't (he hates the exploitation now).
      *   *Pragmatic/Conversational (Adams/Stechny):* We blame/praise to signal norms. Calling exploitation intentional blames him. Calling rescue unintentional denies praise (initially).
      *   *Blame-Validation (Knobe's later view):* Badness makes us search for intentionality to blame. Goodness doesn't trigger the search.
      *   *Constitutive (Holton/Pettit-ish):* Moral judgment is *part* of the concept. If it's good, it's intentional? No, usually the asymmetry holds.

  4.  **Developing the Variants (Question 3):**
      *   *Reluctant Chairman:* Regrets the harm but does it for profit.
          *   *Prediction:* Asymmetry might shrink. If he regrets the harm, is it still "intentional"? Folk might say "he had no choice" or "unintentional but responsible." Deep Self says it doesn't align, so less intentional.
      *   *Strategically Indifferent Chairman:* Pretends not to care to achieve the goal (which might be good or bad).
          *   *Schindler Case:* He pretends not to care about Jews to save them.
          *   *Problem:* The vignette stipulates attitude. The film *hides* it.
          *   *Prediction:* Deep Self accounts struggle here because the "Deep Self" is hidden even from the observer until the end. Pragmatic accounts might say we attribute intentionality based on the *outcome* we want to judge.

  5.  **The Film as Experiment (Question 4):**
      *   The film *is* a longitudinal x-phi study. It changes our moral valence of the agent, which should retroactively change our intentionality attributions of earlier acts.
      *   *Example:* Early scene (sex, bribes). We see greed. Later, we see those bribes as necessary for saving. Did the *intentionality* of the bribe change?
      *   *Verdict:* It's not a controlled experiment (confounds abound), but it demonstrates the *instability* of folk concepts under narrative pressure.

  6.  **The Meta-Question/Circularity (Question 5):**
      *   If Intentionality $\leftarrow$ Moral Goodness, then arguing "He is praiseworthy because he intentionally saved them" is circular.
      *   Schindler's breakdown ("I could have saved more"): He blames himself. He treats the *failure* to save more as intentional/negligent? Or the saving as insufficient?
      *   *Risk:* The reading eats itself. We can't use intentionality to ground praise if intentionality is derived from praise.

  7.  **Critique/Limitations (Question 6):**
      *   *Vignette with Costumes:* Films are thick description; vignettes are thin. Schindler has interiority (shown via acting), Chairman is a block of text.
      *   *History:* Real Schindler is more ambiguous. Movie Schindler is hagiographic.
      *   *Break point:* The "Strategic Indifference" breaks the vignette logic because the vignette assumes truth-telling about mental states.

  8.  **Drafting the Response (incorporating the "Professional Philosopher" persona):**
      *   *Tone:* Thoughtful, tentative, rigorous but admitting uncertainty.
