prompt: |-
  Hey, I'm putting together the final for my grad seminar on forecasting and institutional decay—we've spent the term on reference-class forecasting, base rates, and using the outside view of empires (Rome, Ming dynasty collapse, that kind of thing) to model modern institutional failure. I want one essay question that students can work through in about 75 minutes, but I don't want answers that just parrot back lecture notes on reference-class reasoning.

  So here's the twist to keep it in the weeds: frame the prompt around a hypothetical forecasting team trying to predict failure modes for a large AI governence body by analogizing it to an imperial bureaucracy and applying a made-up bureaucratic entropy curve that maps administrative bloat onto historical dynasty collapse timelines. The exam question should force students to say exactly where the empire-to-institution analogy breaks—especially whether tech governance bodies actually sit in the same referene class as territorial empires, and what that category error does to the base-rate calculaton. Could you draft the exam question itself, then a model answer around 500-600 words, plus a marking scheme with five must-hit points totaling 20 marks and a one-line note on the typical mistake for each? I want it hard enough that someone who just memorized the phrase outside view can't ace it.
