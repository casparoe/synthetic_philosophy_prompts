          1.  Acknowledge the utility of the outside view (avoiding inside view optimism).
          2.  Challenge the reference class (Empires vs. Regulatory Bodies).
          3.  Discuss the "Bureaucratic Entropy Curve" mechanics (feedback loops differ).
          4.  Address the base rate calculation error (survival bias or wrong N).
          5.  Conclusion on how to adjust the forecast.
