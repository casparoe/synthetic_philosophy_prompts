      *   *Scenario:* A forecasting team (let's call them "The Oracle Group") is predicting the lifespan of the "Global AI Safety Council" (GASC).
      *   *Method:* They are using a "Bureaucratic Entropy Curve" derived from Ming/Rome data.
      *   *The Twist:* The prompt must explicitly ask for the *limits* of the analogy.
      *   *Drafting:* "The Oracle Group proposes using a Bureaucratic Entropy Curve (BEC) calibrated on the Ming Dynasty and Late Roman Empire to forecast the GASC's lifespan. The BEC correlates administrative layer depth with collapse probability. Critique this approach. Specifically, evaluate the validity of the reference class and the impact of category errors on the base rate."

  3.  **Drafting the Model Answer:**
