answer: |-
  Here is a breakdown you can paste straight into the group chat. I've kept it to the menu format you asked for, with British spelling, and focused on whether each claim actually blocks the consequentialist reading or just shifts the terminology.

  ***

  **Menu: What 'It's the Thought That Counts' Might Mean**

  **1. The Strong Constitutive Claim**
  *   **The Claim:** Moral rightness is *constituted* entirely by the motive; external consequences are morally inert and irrelevant even as a tie-breaker.
  *   **Status:** **Substantive thesis.** (Not a platitude; many ethical systems reject this. Defensible within some Buddhist readings of *karma* as intention (*cetana*), but controversial regarding Mahāyāna *upaya*.)
  *   **Does it rule out consequentialism?** **Yes.** It denies the core consequentialist tenet that outcomes determine rightness.
  *   **Right or Excused?** **Positively Right.** A clean motive makes the act good, even if the outcome is disastrous.

  **2. The Epistemicised Claim**
  *   **The Claim:** Consequences are what matter, but only those foreseen by the agent; deliberation is expected-value reasoning, but blame tracks actuals only if negligence was involved.
  *   **Status:** **Substantive thesis.** (This is essentially 'Subjective Consequentialism'.)
  *   **Does it rule out consequentialism?** **No.** This *is* a form of consequentialism. It concedes your point that the deliberation looks like cost-benefit analysis.
  *   **Right or Excused?** **Positively Right (subjectively).** If the expected value was good, the act was right, even if luck turned the outcome bad.

  **3. The Causal/Mechanistic Claim**
  *   **The Claim:** Intention is the load-bearing node because motives propagate into character and future *karmic* outcomes; worldly outcomes are secondary to the karmic seed planted.
  *   **Status:** **Substantive and defensible.** (Fits the causal law of karma well, but implies a form of 'karmic consequentialism' rather than non-consequentialism.)
  *   **Does it rule out consequentialism?** **Only verbally.** It shifts the 'consequence' that matters from 'lives saved' to 'karmic ripening'. If the goal is to maximise good karma/minimise suffering, it remains structurally consequentialist.
  *   **Right or Excused?** **Karmically Right, Worldly Transgression.** The act is karmically wholesome (good seed) but may still be a violation of worldly precepts (excused transgression).

  **4. The Axiological Claim**
  *   **The Claim:** Only conscious states (suffering and its easing) are intrinsically good or bad; material states of affairs have no intrinsic value.
  *   **Status:** **Substantive thesis.** (Standard Buddhist axiology, but compatible with both consequentialist and non-consequentialist structures.)
  *   **Does it rule out consequentialism?** **No.** This actually supports your reading. If only suffering matters, weighing lives saved against a lie is exactly what this axiology demands.
  *   **Right or Excused?** **N/A.** This defines *value*, not *rightness*. It tells you what to maximise, not whether you maximise it via intentions or outcomes.

  **5. The Two-Level Claim**
  *   **The Claim:** The criterion of rightness is intention-based, but the *justification* for having that criterion is thoroughly consequentialist (e.g., focusing on intention produces the best outcomes overall).
  *   **Status:** **Substantive thesis.** (This is Indirect or Rule Consequentialism.)
  *   **Does it rule out consequentialism?** **No.** It grants that consequentialism is the ultimate truth, merely arguing that intention is the best heuristic.
  *   **Right or Excused?** **Positively Right.** The act follows the correct rule, which is justified by the good outcomes that rule produces.

  ***

  **Summary for the Debate**

  *   **To actually block your consequentialist reading:** Your friends need **Claim 1** (Strong Constitutive) or a very specific version of **Claim 3** (where karma is non-consequentialist purity, not causal seed-planting). Claims 2, 4, and 5 all concede that consequences (either worldly or karmic) are the ultimate arbiter of value.
  *   **Right vs. Excused:** Only **Claim 1** makes a well-intentioned act with bad outcomes *positively right* in a straightforward sense. **Claim 3** makes it karmically good but potentially a worldly failure (excused transgression). **Claim 2** makes it right relative to information available.
  *   **What they probably mean:** Likely a mix of **1 and 3**. They are appealing to the doctrine that *karma* is intention (Claim 1) to protect the agent from blame, while implicitly relying on the causal power of that intention to produce future good (Claim 3). However, unless they argue that the *purity* of the intention is good regardless of its causal output, they are still stuck with a form of consequentialism about mental states.
