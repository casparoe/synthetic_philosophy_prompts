  **Total Exposure:** £20.
  **Expected Return:** Positive, provided TRP is consistent with the *Liar/Sorites* precedent.

  **Final Warning:**
  There is a 10% "Human Variable." TRP flagged *External-World Scepticism* as 'Stalled' but "flagged for review." This implies he knows his own rules are provisional. He may be drifting toward a 'Reframing' bias in his later years (hence the interest in Amelioration). If you hear him praise "conceptual engineering" as a *method* rather than a *topic* during the session, swap the Amelioration bet to **'Genuine Progress'**. But until then, bet on the formalism. He is an engineer at heart, even if he retired from philosophy.

