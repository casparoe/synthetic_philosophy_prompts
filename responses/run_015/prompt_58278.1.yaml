      *   *Premise 2:* Non-Reductive Physicalism (Mental properties are real but distinct from physical properties).
      *   *Premise 3:* Causal Efficacy of the Mental (Mental events cause physical events, e.g., desire -> arm raise).
      *   *Premise 4:* No Systematic Overdetermination (Two sufficient causes for one effect is coincidental/unacceptable).
