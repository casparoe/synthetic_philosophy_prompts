answer: |-
  Here is a complete session plan designed to hit your constraints. I've refined your "Artifact Archaeology" concept to ensure the "Adaptationist Bias" is mathematically punished without you having to preach it.

  ### Session Title: The Archaeology of Necessity
  **Time:** 90 Minutes
  **Students:** 14 (Upper-Division)
  **Grouping:** 7 Pairs (Teams)

  ---

  ### 1. Materials & Prep

  **The Kits (7 identical boxes):**
  *   20 plastic drinking straws (rigid, not bendy).
  *   10 pipe cleaners.
  *   1 roll of masking tape.
  *   1 index card.
  *   **Rule Card:** "No cutting materials. No tape on the table surface. Assembly must be continuous (once a joint is taped, it cannot be undone)."

  **The Secret Constraint Cards (7 unique cards, one per team):**
  *   *Constraint A:* "You must use exactly 18 straws. No more, no less." (Forces bundling/waste).
  *   *Constraint B:* "The structure must fit inside a standard letter envelope (flat)." (Forces 2D planar design).
  *   *Constraint C:* "You must build using only your non-dominant hand." (Forces asymmetry/instability).
  *   *Constraint D:* "The structure must stand on exactly 3 points of contact." (Forces specific tripod base).
  *   *Constraint E:* "You must incorporate one closed loop of pipe cleaners that touches no straws." (Forces a 'decorative' element).
  *   *Constraint F:* "The structure must be at least 40cm tall, but you only have 10 straws." (Forces extension joints that look like weak points).
  *   *Constraint G:* "You must leave exactly 5 pipe cleaners unused." (Forces apparent 'resource optimization' that is actually arbitrary).

  **The Evidence Menu (Projected on board):**
  1.  **Inventory Audit (Cost: 150 pts):** See what materials were left in the box.
  2.  **Stress Test (Cost: 250 pts):** Instructor removes the feature; see if structure collapses.
  3.  **Comparative Photo (Cost: 200 pts):** See a photo of a *different* team's artifact built under the *same* constraint.

  **Scoring Sheets (One per team):**
  *   Starting Bank: 1,000 Points.
  *   Columns: Feature ID | Function Story (Cost 50) | Constraint Story (Cost 200) | Bet Placement | Evidence Bought | Final Payout.

  **The "Forbidden List" (Written on Board):**
  *   Spandrel
  *   Adaptation / Adaptationism
  *   Panglossian
  *   Exaptation
  *   *Penalty:* Any team member saying these words loses 200 points immediately.

  ---

  ### 2. Timeline & Flow

  **00:00 – 00:10: Setup & Rules**
  *   Divide into 7 pairs. Hand out Kits and **Secret Constraint Cards**.
  *   **Instruction:** "You are Engineers. Build a structure in 10 minutes. Follow your Kit Rules and your Secret Constraint. Do not show your Constraint Card to anyone. Do not discuss your intent while building."
  *   **Warning:** "Do not use the Forbidden Words. If you do, you pay a fine."

  **00:10 – 00:20: The Build Phase**
  *   Teams build. Circulate to ensure they follow constraints.
  *   *Instructor Note:* Watch for teams struggling with the constraint. If a team fails the constraint (e.g., uses 17 straws instead of 18), quietly note it on your master sheet. This becomes "noise" in the data later.

  **00:20 – 00:25: The Swap**
  *   Collect the artifacts. Keep the Constraint Cards with the teams (they are the "Truth Keepers").
  *   Pass the *Artifacts* clockwise. Team 1 analyzes Team 2's artifact. Team 2 analyzes Team 3's, etc.
  *   Teams now have an object they did not build and no knowledge of why it looks the way it does.

  **00:25 – 00:45: The Interpretation & Betting**
  *   **Instruction:** "You are Archaeologists. Identify 3 distinct features of this artifact (e.g., 'the bundled straws at the base', 'the loop at the top'). For each feature, write two stories:"
      1.  **Utility Story:** "This feature exists because it helps the structure achieve [Goal]."
      2.  **Necessity Story:** "This feature exists because the builder was forced to by [Rule/Material Limit]."
  *   **The Betting Rig:**
      *   To submit a **Utility Story**, it costs **50 points**.
      *   To submit a **Necessity Story**, it costs **200 points**.
      *   *Psychological Trap:* Utility stories are cheap and intuitive. Necessity stories are expensive and speculative. Students will naturally spam Utility stories to save points.
      *   **The Wager:** For each feature, you must bet on which story is **True**.
      *   If you bet on Utility and are Right: You win 100 points.
      *   If you bet on Necessity and are Right: You win 400 points.
      *   If you are Wrong: You lose the submission cost.

  **00:45 – 01:00: The Evidence Market**
  *   Teams realize they are uncertain. They can now spend points to buy evidence from the **Evidence Menu**.
  *   *Crucial Design:* The Evidence Menu is open for 15 minutes. Prices are high. They can only afford 1 or 2 pieces of evidence per feature.
  *   *Instructor Role:* You hold the "Truth" (the Constraint Cards). If they buy **Comparative Photo**, show them a pic of another group's build with the *same* constraint. If they buy **Stress Test**, you physically manipulate the artifact.

  **01:00 – 01:10: The Reveal**
  *   Teams submit their final bets.
  *   **Truth Reveal:** The "Engineer" team reads their Secret Constraint Card aloud.
  *   **Scoring:** Calculate final points.
  *   *Expected Outcome:* Most teams will have bet heavily on Utility Stories because they were cheap. However, many features (due to the Constraints) were actually Necessity. Teams will likely end with *fewer* points than they started, or barely break even. The few who bought Evidence on "weird" features will have high scores.

  **01:10 – 01:30: The Debrief (The "Lecture" that isn't)**
  *   **Step 1: The Ledger.** Ask: "Who lost points? Why?" (Answer: "I assumed the bundle of straws was for strength, but it was because they had to use 18 straws.")
  *   **Step 2: Mapping.** Draw the parallel on the board.
      *   *Artifact* = Organism.
      *   *Engineers* = Natural Selection + Phylogenetic History.
      *   *Constraints* = Developmental/Architectural limits.
      *   *Archaeologists* = Evolutionary Biologists.
      *   *Utility Story* = Adaptationist Explanation.
      *   *Necessity Story* = Structural/By-product Explanation.
  *   **Step 3: The Reveal.** Now you can say the forbidden words. Explain that what they just experienced is the **Gould-Lewontin Critique**. The "Utility Story" bias is the **Adaptationist Programme**. The "Necessity Features" are **Spandrels**.
  *   **Step 4: The Evidence.** Discuss which evidence actually helped. Did the Stress Test work? (Sometimes a spandrel *also* provides support, making the test inconclusive). This mirrors the difficulty of empirically distinguishing adaptation from by-product in nature.

  ---

  ### 3. Scoring Sheet Example

  | Feature ID | Story Type Submitted | Cost | Truth (Revealed Later) | Bet Placed On | Payout | Evidence Bought? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | *Base Bundling* | Utility (Strength) | 50 | Necessity (Use 18 straws) | Utility | -50 (Loss) | No |
  | *Top Loop* | Necessity (Rule) | 200 | Necessity (Closed loop rule) | Necessity | +400 (Win) | Yes (Photo) |
  | *Asymmetry* | Utility (Wind) | 50 | Necessity (Left-hand build) | Utility | -50 (Loss) | No |
  | **TOTAL** | | **300** | | | **+300** | |

  ---

  ### 4. Troubleshooting: What Goes Wrong & Recovery

  **Problem 1: The "Too Functional" Build.**
  *   *Risk:* Students are clever. They make the "waste" straws actually provide stability. The feature is *both* a Constraint and Functional.
  *   *Recovery:* This is actually a teaching goldmine. In the debrief, highlight this. "Gould and Lewontin admit spandrels can be co-opted later." This introduces **Exaptation** naturally. If a team argues "But it *does* add strength," validate them, but point to the *origin* of the feature (the Constraint Card), not its current utility.

  **Problem 2: The "Bankruptcy" Spiral.**
  *   *Risk:* Teams bet on Necessity, get it wrong, lose 200 points, and disengage.
  *   *Recovery:* Have a "Grant Office" (You). If a team drops below 200 points, they can apply for a "Research Grant." They must write a 2-sentence justification for why their methodology was sound despite the loss. This keeps them in the game and reinforces the philosophical point (methodology matters more than outcome).

  **Problem 3: The Evidence Market Confusion.**
  *   *Risk:* Students don't know what the "Comparative Photo" proves.
  *   *Recovery:* Pre-brief the Evidence Menu clearly. "Comparative Photo shows you another build from the *same* constraint set. If the feature appears there too, it suggests constraint. If not, it suggests choice."

  ---

  ### 5. Limitations: What the Game Cannot Reproduce

  You must state this explicitly in the final 5 minutes.

  **The Teleology Trap:**
  *   **The Game:** Has a *Designer* (the Student Engineers). They have *intent*.
  *   **Nature:** Has no designer. Natural selection is a blind filter, not an architect.
  *   **The Philosophical Gap:** In the game, a "Necessity Story" means "The student was forced by a rule." In biology, a "Spandrel" means "A structural consequence of physics/development that selection didn't design."
  *   **Why it matters:** Students might leave thinking Spandrels imply a "constraint rule" imposed by a god or nature. You must clarify that in biology, constraints are just physical laws (gravity, chemistry, embryology), not rules written on a card. The game simulates the *epistemic position* of the biologist (trying to guess intent vs. constraint), but it simplifies the *ontological reality* of evolution (no intent exists at all).

  ### 6. Instructor's "Cheat Sheet" for the Debrief

  *   **When they complain about the Cost:** "Why was it cheaper to assume Function?" -> *Because the Adaptationist Programme treats function as the null hypothesis.*
  *   **When they complain about the Evidence:** "Why didn't the Stress Test prove it?" -> *Because traits can be co-opted. A spandrel can become useful later.*
  *   **When they ask about the Designer:** "Who wrote the Constraint Cards?" -> *In nature, the 'cards' are physics, chemistry, and ancestral body plans.*
  *   **The Payoff:** "You lost points because you assumed every feature was a solution to a problem. Gould and Lewontin argued biologists were doing the same thing, and it was stopping science from asking better questions."

  ---

  ### Why This Setup Lands
  1.  **Epistemic Humility:** By rigging the costs, you make the Adaptationist bias a *financial liability*. They feel the pain of assuming function.
  2.  **Materiality:** Holding the straw bundle makes the "constraint" physical, not just abstract.
  3.  **Discovery:** You never tell them they are adaptationists. The scoreboard tells them.
  4.  **Safety:** The "Forbidden Words" rule gamifies the restraint, preventing you from accidentally spoiling the insight in the first 10 minutes.
