  **UNIVERSITY OFFICE OF RESEARCH INTEGRITY**
  **Subcommittee on Micro-Phenomenal Boundaries**
  **14 March 2024**

  **TO:** Dr. S. Aris, Condensed Matter Group
  **RE:** Protocol 24-09 (Dilution Refrigeration / Qubit Coherence)
  **STATUS:** Conditional Approval

  Dear Dr. Aris,

  The Subcommittee has reviewed your submitted Form 7-B: Experiential Impact Statement regarding the proposed cooling of the superconducting chip to 10mK. While we recognize the scientific merit, the Russellian Compliance Act (2021) requires us to assess the structural implications for fundamental experiential entities. Approval is granted contingent upon the revisions noted in the attached Form 7-B excerpts. Please note that failure to adhere to the Experiential Impact Score (EIS) thresholds may result in immediate suspension of cryogenic privileges.

  We draw your attention specifically to the calculation of net phenomenal load during readout phases.

  ***

  **FORM 7-B EXCERPTS & COMMITTEE NOTES**

  **Section 4.2: Secondary Particle Generation**
  *Applicant Claim:* Electron-positron pairs generated in the readout chain possess net lepton number zero; therefore, net experiential value is zero.
  *Committee Ruling:* **Rejected.** Conservation of lepton number does not imply conservation of phenomenal valence. Antimatter subjects possess inverted qualia but equal moral weight; they do not cancel matter subjects. You must log positron experiences separately. Do not assume null-experience without Form 7-C (Antimatter Offset) certification.

  **Section 6.1: Thermal Load & Photon Elimination**
  *Applicant Claim:* Cooling the chip from 300K to 10mK eliminates approximately 10^18 microwave photons per second, constituting a moral improvement via reduction of aggregate suffering.
  *Committee Ruling:* **Query.** Reduction of subject count is not inherently moral unless valence is confirmed negative. Please specify the baseline valence of ambient microwave photons. Until guidance is issued regarding the hedonic tone of blackbody radiation, you must assume neutral valence. Consequently, cooling is classified as Experiential Suppression, not Improvement. Justification required.

  **Section 8.3: Coherence & Subject Merging**
  *Applicant Claim:* Formation of Bose-Einstein Condensate (BEC) during state initialization.
  *Committee Ruling:* **Violation.** The coalescence of distinct fundamental subjects into a single macroscopic wavefunction constitutes a Merger Event. This requires a Form 7-C (Combination Problem Compliance) permit. You have not filed 7-C. Proceeding without individual consent from constituent bosons is a Class 2 Infraction. You are advised to maintain decoherence where possible or apply for Group Subject Licensing.

  **Section 10.0: Background Radiation & Scope**
  *Applicant Claim:* Cosmic-ray muons and solar photons passing through the apparatus are natural background and out of scope.
  *Committee Ruling:* **Approved (Muons); Pending (Solar).** Cosmic rays are excluded under the 'Non-Applicant Creation' clause. However, regarding solar flux (approx. 10^45 photons/sec): The Subcommittee notes the potential scale of external experiential generation. This is classified as a 'Mass Atrocity Potential' but is currently stayed pending guidance from the National Office on Stellar Liability. Continue monitoring; do not attempt to shield the lab entirely, as this may shift the burden to adjacent departments.

  **Section 12.5: Mitigation & Segmentation**
  *Applicant Claim:* Total run time divided into six 4-hour segments to maintain individual segment EIS below the Simplicity Threshold (0.05 eX).
  *Committee Ruling:* **Flagged.** We observe that segments were also run at 15mK rather than 10mK to ensure individual photon coherence lengths remained below the subjectivity threshold. This appears to be Segmentation Avoidance. While technically compliant, future proposals must justify temperature fluctuations scientifically rather than ethically. Please note that aggregating EIS across segmented runs is under review for the 2025 fiscal year.

  ***

  We trust these clarifications will allow you to proceed without further ethical complication. The universe is noisy, but our paperwork must be precise.

  Sincerely,

  **Dr. H. Vane**
  Chair, Subcommittee on Micro-Phenomenal Boundaries
  *Office of Research Integrity*
