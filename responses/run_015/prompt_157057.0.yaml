answer: |-
  **Eulogy for [Aunt's Name]**

  Good morning.

  My aunt left me a note before she died. It said: "Don't tell the room I'm watching over them, but don't turn me into a character either."

  That is a difficult instruction for a eulogy. A eulogy is, by definition, a story. It has a beginning, a middle, and an end. It smooths out the rough edges. It tries to make sense of a life. But [Aunt's Name] spent thirty years reminding us that sense-making is often where the truth goes to die.

  For those of you who knew her only as the neighbor with the best tomatoes on the block, you know she was a person of specific, tangible realities. She didn't tell you her plants were "blessed." She told you exactly how much water they got, what time of day she pruned them, and which fertilizer worked. She trusted what she could touch.

  For those of you who worked with her at the *City Paper*, you know she took that same rigor to the news. Specifically, to the corrections column. She wrote it under her own byline, every week. She used to say it was the only part of the paper that was definitely true.

  She was a student of Hannah Arendt, specifically Arendt's writings on truth and politics. She believed there was a difference between "factual truth"—the brute fact that something happened—and the "narrative truth" that organizations build to make things palatable. She argued that lies beat the truth not because they are stronger, but because they are built in advance to sound plausible. They fit together. Facts, on the other hand, just *are*. They arrive without a script. They are stubborn, inconvenient, and often lonely.

  [Aunt's Name] spent three decades championing the stubborn, inconvenient facts. She understood that a correction is an act of humility. It is an admission that the story told yesterday was not the truth of today.

  This commitment followed her to the end of her time at the paper. Eight months ago, she walked away. There were rumors about why. The fact is simply this: A correction was spiked. A fact was deemed inconvenient for the narrative. And because she could not guarantee the truth, she refused to lend her name to the paper any longer. To ignore that fact today, to pretend she retired on a Tuesday and bought a garden hose on Wednesday, would be to tell the very kind of tidy story she spent her life correcting. She left because the truth mattered more than the position. That is not a scandal; it is a biography.

  But I am aware of the irony here. I am standing at a podium, constructing a narrative about her love of anti-narrative. I am turning her into a character. I know that if she were sitting in the third row, she would be tapping her pen against her program, waiting for me to get something wrong so she could write it down for next week's column.

  She warned us that when we swap facts for a tidier story, we lose the ground beneath our feet. We are a room divided, in a way. Half of you are here because you want comfort. You want to hear that she is at peace, that she is watching over us. The other half of you are here because you want accuracy. You want to know that the record is set straight.

  [Aunt's Name] would tell you that comfort is a narrative. Accuracy is a fact.

  The fact is: She is gone. She is not watching over us. We are here, and she is not. That is painful. It is not tidy. It does not have a moral lesson attached to it. But it is true.

  And yet, there are other truths. It is true that she grew tomatoes that tasted like summer should taste. It is true that she mentored reporters who are now editors. It is true that she corrected the record, even when it embarrassed her friends, even when it embarrassed her. She valued the reality of the thing over the comfort of the story.

  So, how do we honor her? We do not turn her into a saint. We do not pretend the end of her career didn't happen. We do not pretend she is still here.

  Instead, we try to be as stubborn as she was. When the world offers us a tidy lie because it hurts less than the messy fact, we remember her. When we are tempted to swap out a detail to make a story flow better, we remember her.

  She taught us that factual truth is fragile. It can be spiked. It can be buried. It can be forgotten. But it cannot be changed. And as long as we are willing to stand up and say, "Actually, that is not what happened," the ground beneath us holds.

  Thank you.

  ***

  **Note on Arendt References**

  **Confidence Level:** High on the general distinction, Moderate on the specific phrasing.

  **Explanation:** I am confident in the core Arendtian distinction drawn from her essay *Truth and Politics* (1967). She explicitly distinguishes between "rational truth" (philosophical/scientific) and "factual truth" (events, facts), noting that factual truth is actually more vulnerable to political manipulation because it can be denied or altered in record-keeping more easily than a mathematical theorem. The concept that "organized lying" creates a consistent, plausible alternative reality that displaces factual truth is central to her analysis of totalitarianism and modern politics.

  **Least Certain Aspect:** The specific phrasing in your prompt regarding "swapping facts out for a tidier story" is a slightly modernized or simplified interpretation of Arendt. Arendt focused more on the *systematic* nature of lying in totalitarian regimes—the creation of a consistent fictional world—rather than just "tidying" a story for plausibility. She argued that the ideal subject of totalitarian rule is not the convinced Nazi or Communist, but people for whom the distinction between fact and fiction, true and false, no longer exists. I have leaned into the "tidy story" aspect to make it accessible for the family members in the audience, but a strict Arendt scholar might argue this softens her critique from "political destruction of reality" to mere "narrative smoothing." However, for the context of a small city paper and a eulogy, this adaptation serves the emotional truth of the speech without violating the philosophical core.
