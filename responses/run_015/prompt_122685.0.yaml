answer: |-
  **Brainstorming & Selection**

  **Potential Cruxes:**
  1.  **The Add-On Death:** Angier's machine duplicates without destroying; the original is killed separately via trapdoor.
  2.  **Serial Fission & R-Drift:** The trick is performed nightly; psychological continuity may degrade over repetitions.
  3.  **Borden's Sideways Fission:** Two brothers sharing one identity sequentially rather than co-existing duplicates.
  4.  **Audience Complicity:** Cutter's speech suggests the viewer's desire for coherence enables the deception.
  5.  **Moral Status of the Clone:** Whether the drowned bodies are victims or disposable shells.
  6.  **Technological Determinism:** Whether the machine forces the metaphysics or merely enables the magician's choice.

  **Selection:**
  I am building the essay on **1 (Add-On Death)**, **2 (Serial Fission)**, and **3 (Borden's Sideways Fission)**. These engage most directly with Parfit's Reductionism and the specific mechanics of survival.

  **Dropped:**
  I am dropping **4 (Audience Complicity)** because it shifts focus to epistemology and reception rather than the metaphysics of identity. I am dropping **5 (Moral Status)** because the moral question relies on settling the metaphysical one first; treating it separately risks conflating value with existence. I am dropping **6 (Technological Determinism)** because it attributes agency to the prop rather than the magician, which weakens the ethical critique of the choices made.

  ***

  **Model Essay: The Cost of Continuity in *The Prestige***

  **Thesis**
  *The Prestige* functions not merely as a thriller about rivalry, but as a visceral stress test for Derek Parfit's Reductionist view of personal identity. Where Parfit argues that identity is not what matters—proposing instead that psychological continuity and connectedness (Relation R) are sufficient for survival—the film interrogates the moral and emotional costs of treating human beings as vessels for information. By contrasting Alfred Angier's serial duplication with Robert Borden's shared singular life, the film suggests that while Relation R may theoretically secure survival, it fails to account for the moral horror of serial fission and the asymmetry of divided identity. Ultimately, the film argues that a metaphysics which dismisses identity as a "further fact" cannot easily dismiss the violence required to maintain psychological continuity, revealing that what matters to us practically often conflicts with what matters metaphysically.

  **Scene Work and Argument**
  The film introduces the metaphysical problem early through the duplication of the cat. When Angier first tests the machine, he produces two cats, identical in every observable respect. For a Parfitian, this is a standard fission case: both cats share Relation R with the original. However, the film immediately introduces violence; Angier must shoot one to maintain the secret. This initial test establishes the stakes: duplication is not a clean transfer of information but a generative act that creates surplus life requiring disposal. This foreshadows the central mechanism of Angier's trick, the "Real Transported Man." Unlike Parfit's teletransporter, which scans and destroys the original as part of the transmission process, Angier's machine creates a duplicate at a distance while leaving the original standing on the stage. The original then falls through a trapdoor into a water tank below.

  This distinction is the "add-on death," and it complicates the Reductionist reading. If Parfit is correct that identity is not what matters, Angier should survive every night as the duplicate on the balcony, provided Relation R holds. The death of the original in the tank should be morally equivalent to shedding a shell. Yet the film insists on the horror of the tank. The accumulation of drowned bodies suggests that the original is not merely a stage left behind but a murder victim. The killing is not intrinsic to the teleportation but is a separate, causal step enabled by the duplication. This forces the viewer to ask whether the preservation of Relation R justifies the deliberate destruction of the source. If the duplicate is truly Angier, the original is committing suicide nightly; if the duplicate is a copy, Angier is committing murder nightly. The film leans toward the latter, implying that the physical continuity of the organism carries a weight that psychological continuity cannot fully overwrite.

  This tension is compounded by the serial nature of the trick. Angier performs the illusion a hundred times. This introduces the problem of R-drift. Parfit acknowledges that psychological connectedness admits of degrees; we are less connected to our distant past selves than our recent ones. In the film, each new Angier is made from the previous night's body, potentially introducing minute degradations in psychological continuity. If each iteration retains only ninety-nine percent of the previous self's connectedness, the final Angier is significantly removed from the original man who sought to outdo Borden. The film visualizes this decay in Angier's demeanor; he becomes colder, more detached, and increasingly willing to sacrifice others. This suggests that while Relation R may persist, the *quality* of what matters—moral agency, emotional capacity—degrades with each fission. The prudential concern for the man stepping into the machine becomes paramount: on a Reductionist view, he should fear nothing, as his psychological life continues. Yet the film portrays his anxiety as rational. He is not just worried about death; he is worried about becoming something less than human through repeated fragmentation.

  In stark contrast stands Borden's "Transported Man." Borden does not use a machine; he uses his twin brother. They share one public life, pooling their psychology via notebooks and strict scheduling. This is fission turned sideways: instead of two bodies co-existing momentarily, two bodies take turns occupying one identity. For the Reductionist, this should be a successful strategy for survival; Relation R is maintained across the two brains, ensuring the public persona never dies. However, the film highlights the cost of this arrangement through Sarah, Borden's wife. She accuses him of loving her only half the time, noting that the man who loves her is not the same man who binds her. This exposes a flaw in the Reductionist calculation of value. If what matters is psychological continuity, Borden succeeds. But if what matters includes the unity of experience and the consistency of love, Borden fails. He survives, but his life is fractured. The surviving brother at the end is not a whole person but half of a divided whole, suggesting that two half-lives are not equivalent to one whole life. The reductionist might argue that survival is secured, but the film argues that the *life* saved is impoverished.

  **Resistance and Complication**
  Despite the strength of a Reductionist reading, the film resists being fully co-opted by Parfit's framework. The horror of the final warehouse reveal relies on the audience feeling that a hundred men have died, not that one man has survived a hundred times. If the film were truly consistent with the view that identity is not what matters, the stacks of drowned Angiers should appear as empty shells, like shed snake skins. Instead, they appear as a graveyard. This suggests the film cheats metaphysically to secure its emotional payoff. It invites the viewer to adopt a Reductionist view to understand the trick, but demands a Further-Fact view to feel the tragedy. We are asked to believe Angier survives as the duplicate, yet we are asked to mourn the original.

  Furthermore, the "add-on death" creates a moral asymmetry that Parfit's abstract cases do not address. In the standard teletransporter thought experiment, destruction is automatic and intrinsic. In *The Prestige*, the death is manual and contingent. Angier chooses to drown the original. This reintroduces the organism as the locus of moral value. If identity were truly irrelevant, the method of disposing of the original should not matter. The fact that it does matter—that drowning feels like murder while dematerialization might feel like transport—suggests that our intuitive commitment to animalism (that we are our living organisms) is harder to shake than Parfit anticipates. The film bends the Reductionist view by showing that even if psychological continuity is preserved, the violence done to the physical body generates a moral debt that Relation R cannot cancel.

  **Closing**
  Ultimately, *The Prestige* contributes to the debate by embodying the costs that armchair cases often sanitize. Parfit's teletransporter is a clean conceptual tool; it asks us to imagine a future where technology solves the problem of travel. Nolan's machine is a dirty, mechanical device that requires blood and secrecy. The film demonstrates that metaphysical theories have practical consequences. If we accept that identity is not what matters, we must be prepared to accept the disposal of the original as morally neutral. The film suggests we are not prepared for this. It posits that while Relation R may explain survival, it does not justify the means of achieving it. The armchair case asks whether you would step into the machine; the film asks what you must become to keep stepping in. In doing so, it reveals that the question of personal identity is not just about what survives, but about what is lost in the ensuring of that survival.
