      *   **Deliverable:** A defended agenda for the piece (not a survey).
      *   **Candidates provided:**
          1.  Does the pump vindicate Expected Utility Theory (EUT) or just punish specific inconsistency?
          2.  Implications for non-cyclic inconsistent preferences.
          3.  Commitment devices (Ulysses contracts).
          4.  AI preference drift during training.
      *   **Constraint:** Needs to be engaging for a general audience, not just a literature review.

  2.  **Evaluate the Candidates (Initial Brainstorming):**

      *   *Candidate 1 (EUT Vindication):* This is very technical. General readers don't care about axiomatic foundations of EUT. They care about *why* they make bad choices. This feels like "seminar room score-settling."
      *   *Candidate 2 (Non-cyclic Inconsistency):* This is closer to reality. People aren't perfectly cyclic, just messy. But is it distinct enough from "weakness of will"? Might be too abstract.
      *   *Candidate 3 (Commitment Devices):* This is highly actionable. People understand procrastination, addiction, savings. Ulysses contracts are a great narrative device. This connects theory to life.
      *   *Candidate 4 (AI Drift):* This is timely and scary. People care about AI safety. If an AI's preferences drift like a human's, does it become exploitable? Or dangerous? This connects theory to the future.
      *   *Missing Candidate:* The psychological reality of "temporal disintegration." The feeling that future selves are strangers. This is the emotional core.

  3.  **Determine the Ranking Criteria:**
