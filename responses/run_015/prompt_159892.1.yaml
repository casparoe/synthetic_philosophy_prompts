answer: |-
  **Project Title:** Orphan Reasons: The Normative Status of Surviving Commitments

  **Project Summary**
  This project investigates the normative status of reasons that survive the extinction of the agents who generated them. Standard metaethics asks whether reasons require minds to exist. This project asks a distinct question: what happens to reasons *attached* to a mind when that mind ceases? When a composer dies mid-symphony, or a treaty signatory passes before ratification, does the reason to complete the work vanish, persist unchanged, or modulate? I propose a third position beyond realism and antirealism: a model of "fidelity-scaled inheritance," where the normative force of an orphan reason depends on the structural relationship between the heir and the original project. Over three months, I will develop this model to determine whether free-floating rationales are ontologically costly metaphysical posits or relational normative structures.

  **The Problem and the Gap**
  The current debate is stalled between realism (reasons exist mind-independently) and antirealism (reasons depend on current agent psychologies). Both fail to account for the specific phenomenology of orphaned commitments.
  1.  **Realism** treats reasons as static objects. It cannot explain why the reason to finish a dead composer's symphony *in their style* feels stronger than finishing it as a pastiche, even if the "reason to finish" exists either way. Realism implies an accrual picture—a world knee-deep in unowned, undischargeable pro tanto reasons—which is ontologically extravagant.
  2.  **Antirealism** treats reasons as vanishing with the agent, or being instantly appropriated by new agents. It cannot explain the *binding* nature of the past agent's intent. If I inherit a will, the reason to execute it is not merely my own new reason; it carries the weight of the deceased's authority.

  Both camps assume a binary: the reason either exists (full force) or it doesn't. Neither accounts for *modulation*. My hypothesis is that orphan reasons are not free-floating objects but relational structures that decay or strengthen based on fidelity. This is not a compromise; it is a distinct logical category that avoids the ontological bloat of realism without collapsing into the voluntarism of antirealism.

  **Research Question**
  *What are the structural conditions under which a normative commitment survives the extinction of its author, and does its force modulate based on the heir's fidelity to the original project?*
  This question admits a determinate answer: either the force is static (supporting realism), contingent on the heir's psychology (supporting antirealism), or functionally dependent on the fidelity relation (supporting the proposed third position).

  **Methodology (Three-Month Timeline)**
  *Note: This project requires conceptual modeling and case analysis, not literature survey.*

  *   **Month 1: Case Construction and Stress-Testing.** I will construct a typology of orphan reasons (testamentary, artistic, diplomatic, promissory). I will isolate variables: time elapsed, clarity of intent, and degree of heir expertise. The goal is to generate intuition pumps that break the binary realist/antirealist models. For example: Does the reason to burn a dead person's letters weaken if the heir believes the letters contain vital historical data?
  *   **Month 2: Modeling Fidelity-Scaled Inheritance.** I will formalize the "fidelity" variable. Is it a threshold condition or a dimmer switch? I will draft the logical structure of this modulation. If the reason weakens as the heir diverges from the original style, this suggests the reason is not a free-floating object but a vector anchored in the past agent's identity. This month focuses on internal consistency and avoiding collapse into standard realism.
  *   **Month 3: The Accrual Objection and Drafting.** I will test the model against the "ontological cost" objection. If reasons don't accrue indefinitely, what mechanism prunes them? Is it fidelity, or is it the absence of a capable heir? I will produce a complete draft of the central argument, focusing on the distinction between "reasons without agents" and "reasons without *living* agents."

  **Outcomes and Feasibility**
  *   **Success:** A coherent framework demonstrating that normative force can modulate based on historical fidelity without invoking spooky metaphysical objects. The result will be a paper-ready argument establishing "fidelity-scaled inheritance" as a viable third position.
  *   **Failure:** The model collapses into standard realism (fidelity is just an epistemic constraint on accessing static reasons) or antirealism (fidelity is just the heir's new preference). The "boring failure" is redescribing the realism dispute in new vocabulary. I will mitigate this by strictly defining success as the ability to predict normative intuitions in edge cases where realism and antirealism diverge.
  *   **Feasibility Statement:** Three months is insufficient to resolve the full metaphysics of free-floating rationales. The broader question of whether *unowned* reasons exist independently of any heir is too large. However, this timeline is sufficient to isolate the *logic of inheritance*. I am restricting the scope to the transition state (death to heir) rather than the eternal status of the reason. This slice is tractable and yields the necessary data to assess the broader metaphysical cost later.

  **Broader Significance**
  Why should non-specialists care? This framework directly impacts legal theory regarding inheritance and intellectual property, where the "intent of the deceased" is often treated as a static object rather than a decaying obligation. Furthermore, as we encounter "digital orphan reasons" in AI alignment—how to adhere to the intent of deceased programmers or outdated safety protocols—understanding whether these obligations persist, vanish, or modulate is crucial for governance and intergenerational justice.
