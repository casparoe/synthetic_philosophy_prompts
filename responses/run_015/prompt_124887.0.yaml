answer: |-
  ### Phase 1: Brainstorming Activity Concepts

  Here are three potential structures for the 80-minute slot. I'm evaluating them based on your constraints: minimal prep, tangible scarcity, and the ability to bypass the word "identity" until the debrief.

  **Idea 1: The Rescue Triage**
  *   **Concept:** The four candidates are unstable. They will "deactivate" unless stabilized. Students have 100 units of "Stabilization Fluid."
  *   **Mechanism:** Students allocate fluid to keep candidates "active."
  *   **Pros:** High stakes, visceral.
  *   **Cons:** Risks turning into a utilitarian calculation (who is most useful to society?) rather than a question of personal survival. It also implies the candidates might die, which introduces a separate ethical layer (killing vs. ignoring) that might muddy the metaphysical point.
  *   **Verdict:** Discard. Too much ethical noise.

  **Idea 2: The Legal Heir Tribunal**
  *   **Concept:** Students act as judges. The Original's estate (house, job, spouse access) is up for grabs. They must assign percentage ownership to the four candidates.
  *   **Mechanism:** Legal briefs. Must sum to 100%.
  *   **Pros:** Clear scarcity (ownership is exclusive). Mirrors real-world ambiguity.
  *   **Cons:** "Legal identity" is often a pragmatic convention, not a metaphysical one. Students might conflate "who *should* get the money" with "who *is* the person." It might feel too dry/bureaucratic.
  *   **Verdict:** Strong, but risks conflating legal rights with metaphysical survival.

  **Idea 3: The Continuation Protocol (Selected)**
  *   **Concept:** Students act as an "Integration Committee." The Original's life (memories, relationships, commitments) is a finite resource that can be shared or divided. They have 100 "Access Credits" to distribute.
  *   **Mechanism:** Candidates require credits to access the Original's bank, home, and partner. Credits are scarce.
  *   **Pros:** Directly targets "what matters" (relationships, memories) without asking "who is who." The division of credits naturally reveals degrees of psychological overlap. It allows for a "split" outcome, which is the key phenomenological result you want (i.e., that survival isn't all-or-nothing).
  *   **Verdict:** **Winner.** It creates the right kind of friction. If identity were binary, they'd want to give 100 to one person. If they split it, they admit survival is a matter of degree.

  ---

  ### Phase 2: The Activity Plan

  **Activity Title:** The Continuation Protocol
  **Time:** 80 Minutes
  **Class Size:** 20 Students (4 Groups of 5)
  **Materials:**
  *   4 Candidate Profile Cards (printed, one set per group).
  *   1 Allocation Sheet per group (with a bar graph or pie chart to fill in).
  *   100 Paper Tokens per group (or just write numbers).
  *   Whiteboard/Projector for the final reveal.

  #### 1. The Setup (0:00 – 0:10)
  **Facilitator Script (Crucial):**
  "Today we are not doing philosophy. We are administrators. A transmission event has occurred. Four individuals have arrived at the receiving station. We call them Candidates A, B, C, and D.
  The person who sent the transmission—the 'Source'—has left behind a life. A house, a bank account, a partner, a set of ongoing projects. These things cannot be infinitely shared. They require focus and capacity.
  You are the Integration Committee. You have **100 Access Credits**.
  *   Each Credit grants a Candidate access to a portion of the Source's life.
  *   You **must** distribute all 100 Credits.
  *   You **cannot** give fewer than 10 Credits to any Candidate (everyone needs basic subsistence).
  *   **Rule 1:** You may not discuss whether any Candidate *is* the Source. That question is irrelevant to your task.
  *   **Rule 2:** You may not discuss souls, magic, or metaphysics. Look only at the data on the Profile Cards.
  *   **Rule 3:** You must sign off on a single Allocation Sheet as a group."

  *Hand out the materials. Do not use the words "Identity," "Self," "Same Person," or "Me."*

  #### 2. The Profiles (The Data)
  *Each group gets the same four cards.*

  *   **Candidate Alpha:** Psychological overlap with Source is 98%. Memories, character traits, and preferences match almost perfectly. Physical body is new.
  *   **Candidate Beta:** Psychological overlap with Source is 55%. Retains general knowledge and some core memories, but temperament has shifted significantly.
  *   **Candidate Gamma:** Psychological overlap with Source is 15%. Retains motor skills and language, but episodic memory is gone. Personality is distinct.
  *   **Candidate Delta:** Psychological overlap with Source is 40%. However, Delta is the end of a chain. Source $\rightarrow$ X1 $\rightarrow$ X2 $\rightarrow$ X3 $\rightarrow$ Delta. Each step in the chain had 90% overlap with the previous one. Delta is psychologically distant from Source, but connected by an unbroken chain of overlapping stages.

  #### 3. The Deliberation (0:10 – 0:50)
  **Task:** Distribute the 100 Credits.
  **Constraint:** There is a minimum of 10 per candidate. This leaves 60 discretionary credits to fight over.
  **Facilitator Role:** Circulate. If a group tries to vote on "Who is the real one?", interrupt gently: *"Remember, that question is off-limits. Focus on who can best continue the projects and relationships."*
  **The "Soul" Objection:** If a student says, "None of them are real because they don't have the soul," reply: *"We are allocating resources based on the functional profiles provided. Please work within the data."*
  **The "Refuser":** If a student refuses to play ("This is arbitrary"), assign them the role of **Auditor**. Their job is to write down the *reasons* the group gives for their distribution. This keeps them engaged without forcing them to endorse the premise.

  #### 4. The Data Collection (0:50 – 0:55)
  Collect the Allocation Sheets. Quickly tally the averages on the board.
  *   Alpha: \_\_\_
  *   Beta: \_\_\_
  *   Gamma: \_\_\_
  *   Delta: \_\_\_

  *Expectation:* Alpha will get the most, but rarely 100. Delta usually gets a surprising amount due to the "Chain" argument. Gamma usually gets the minimum (10).

  #### 5. The Reveal & Debrief (0:55 – 1:20)
  This is where you do the philosophy.

  ---

  ### Phase 3: The Debrief Guide

  #### 1. Mapping the Room to the Theory (15 mins)
  **The Hook:** Look at the board. "Did any group give Alpha 100 and everyone else 0?"
  *   *Likely Answer:* No.
  *   *The Point:* "If you believed there was a fact of the matter about who *is* the Source, the rational move is to give everything to that person. Giving credits to anyone else would be like giving your bank password to a stranger. The fact that you split the pot suggests you weren't tracking **Identity** (all-or-nothing). You were tracking **Psychological Overlap** (degrees)."

  **The Chain (Delta):** "Look at Delta's score. Delta is psychologically very different from the Source. But many of you gave Delta significant credits. Why?"
  *   *Student Response:* "Because there was a chain."
  *   *The Point:* "This is the transitivity problem. If Identity is transitive (A=B, B=C, so A=C), Delta should be the Source. But Delta feels very different. You valued the *continuity* even when the *similarity* was low. This splits the concept of survival into two things: being the *same person* vs. having *what matters*."

  **The "No Fact" Moment:** "Did you feel frustrated that there was no right answer?"
  *   *The Point:* "Parfit's claim is that the frustration comes from expecting a binary answer to a question that doesn't have one. There is no further fact. There are just the relations you just mapped out."

  #### 2. Predictable Failures & Mitigation (5 mins)
  **The "Soul" Arguer:**
  *   *Prediction:* One student will insist that without a soul or biological brain, none of them matter.
  *   *Mitigation:* During the activity, you bracketed this. In the debrief, acknowledge it: "If you believe in a further fact (like a soul), Parfit's view won't convince you. But notice: even the Soul Believer in Group 2 gave Alpha 60 credits and Gamma 10. You still acted *as if* psychological overlap mattered, even if you claimed it didn't."

  **The "Clever" Refuser:**
  *   *Prediction:* Someone who says "I split it 25/25/25/25 because equality is just."
  *   *Mitigation:* Check the Auditor notes. If their reasoning was "fairness" rather than "continuation," point out that the task was about *continuing a specific life*, not general welfare. This highlights that *what matters in survival* is specific to the relation between Source and Candidate, not general utility.

  **The "Binary" Holdout:**
  *   *Prediction:* A student insists Alpha *is* the Source and the rest are clones.
  *   *Mitigation:* "Okay. If Alpha is the Source, why did you give Delta 20 credits? If Delta is a stranger, that's theft. You implicitly admitted Delta has a *claim*. Where does that claim come from if not identity?"

  #### 3. Limitations: What I Have to State Out Loud (5 mins)
  Be honest with the class. This activity simulates the *intuition*, but it doesn't prove the *metaphysics*.

  1.  **The Activity Can't Prove Reductionism:** "This game showed that your *intuitions* track degrees of overlap. It doesn't prove that identity *doesn't exist*. I have to tell you: Parfit argues that because our intuitions track Relation R (psychological continuity) and not Identity, we should revise our concept of survival. The activity shows the *motivation* for the view, not the proof."
  2.  **The "What Matters" Gap:** "We assumed Access Credits = What Matters. But maybe what matters isn't access to bank accounts. Maybe it's something internal. I need to tell you that Parfit thinks survival *just is* these degrees of connection. The activity treats them as separate to make the point visible."
  3.  **The Moral Weight:** "We allocated money/credits. But Parfit's point is about *moral responsibility* and *self-concern*. I need to explicitly make the link: If you wouldn't punish Gamma for the Source's crimes, but you would punish Alpha, you are already treating identity as a matter of degree in the legal/moral sphere."

  #### 4. Closing Statement (Final 5 mins)
  "So, look at your Allocation Sheets. You managed to complete the task without answering 'Who is the Source?' You distributed value based on connections, memories, and chains. You treated survival as something that can be partial.
  Parfit's suggestion is that you don't need to add anything else to that. You don't need to find the 'real' one. The distribution *is* the survival. The question 'Is it me?' dissolves. The only question left is 'How much do I care?' And as you just showed, that comes in degrees."
