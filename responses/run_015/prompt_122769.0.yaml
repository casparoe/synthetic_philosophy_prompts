      *   *Name:* This is often discussed under the **"Leveling Down Objection"** umbrella (specifically the "Leveling Down" *implication* in unrelated cases) or the **"Isolation Case."** However, the specific comparison of "Equal Poor" vs. "Equal Poor + Rich (Unconnected)" is a test for **Telic Egalitarianism**. It's sometimes called the **"Two Worlds Objection"** or simply an application of the **"Leveling Down"** logic to non-competitive contexts.
