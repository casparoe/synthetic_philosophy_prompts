answer: |-
  Here is the bottom line on your thin scaffold substantivalism: it is a philosophically creative maneuver that successfully highlights a genuine gap in strict relationism, but you need to be careful not to accidentally reinvent the metric field of General Relativity while trying to avoid Newton's container. You are basically arguing that spacetime topology has physical reality only when matter distribution is insufficient to define inertia, which is a cool niche, but you have to defend why the scaffold exists at all if it's not doing work in the matter-rich regions where we actually live. To get your roommate on board, you need to walk them through why Newton's bucket feels so convincing in the first place, which is that when you spin a bucket of water, the water climbs the sides even if the bucket walls are stationary relative to the water, suggesting the water knows it is rotating relative to something else. Newton said that something else is absolute space, a fixed stage that exists independently of whatever actors are on it, so rotation is just motion relative to this invisible stage. This works perfectly well for calculations and matches our intuition that spinning feels different than sitting still, but it commits you to believing in a ghostly container that we can never directly observe, which always bothered philosophers like Leibniz who thought space was just the order of coexisting things.

  Then Ernst Mach came along and said that Newton was overcomplicating it by suggesting that the water isn't rotating relative to absolute space but relative to the fixed stars and all the distant matter in the universe. In Mach's view, inertia isn't an intrinsic property of objects but is induced by the gravitational influence of all the mass in the cosmos, so if you removed all the stars, the water wouldn't climb the sides because there would be no reference frame to define rotation against. This relationist view is very appealing because it gets rid of the unobservable absolute space container, but it relies heavily on the universe being a closed system with enough distant matter to lock in those reference frames everywhere. This is where your argument about the open expanding universe comes in, because if the universe is infinite or open and matter thins out as you go further back in time or further out in space, you eventually hit regions where there isn't enough mass to supply a Machian frame. If you are near a cosmological boundary or a horizon where the density of distant stars drops to effectively zero, a relationist has trouble explaining what an object is rotating relative to, since there are no relations left to measure.

  This is the specific gap where your thin scaffold substantivalism tries to plant its flag, suggesting that space isn't a full-blown container with geometric properties everywhere but rather a bare topological structure that only becomes physically relevant when relational definitions fail. You are arguing that the scaffold is latent in matter-rich regions but activates at the boundaries to prevent inertia from becoming undefined, which saves Mach's principle from collapsing in an empty universe without conceding everything to Newton. However, you need to flag that this reasoning gets shaky when you consider that General Relativity already handles this without needing a special philosophical scaffold, because the metric field itself defines local inertia and rotation through vorticity regardless of distant matter. In GR, you can have a universe with no matter at all, like a vacuum solution, and rotation is still defined by the geometry of the spacetime manifold itself, which sounds suspiciously like the Newtonian container you are trying to avoid. Your scaffold might just be the manifold of GR stripped of its metric properties, but physicists would argue the manifold without the metric has no physical meaning anyway, so you risk positing an entity that does nothing except exist philosophically.

  Another weak point you need to anticipate is the definition of this cosmological boundary, because in standard cosmology an open universe doesn't necessarily have an edge where space continues but matter stops, it usually just goes on forever with matter thinning out asymptotically. If there is no hard boundary, then the relational frame never fully disappears, it just gets noisier, which undermines the need for a scaffold to kick in at a specific threshold. You also have the Hole Argument to worry about, which suggests that if you treat the spacetime manifold as real independent of the fields on it, you run into indeterminism problems where the physics doesn't tell you where events happen on the scaffold until you observe them. If your scaffold is just topology, you might dodge the Hole Argument, but then you have to explain how a bare topology without metric distances can define rotation, since rotation requires a measure of acceleration and distance to make sense physically. So while your middle position is a fun way to split the difference over beers, you need to clarify whether your scaffold is a physical thing that interacts with matter or just a logical placeholder for where our current theories run out of data.

  Ultimately, your best defense is to lean into the idea that relationism is an emergent property of matter-dense regions rather than a fundamental law, so space is fundamentally a scaffold that gets covered up by relations when matter is present. This lets you agree with Mach where he works locally while keeping Newton's backup plan for the cosmic edges, but you have to admit that this makes space a bit of a chameleon that changes its ontological status depending on where you are in the universe. It is a coherent position if you are willing to accept that physical reality might be patchy in how it defines motion, but don't be surprised if your roommate points out that modern physics prefers a unified field description over a hybrid philosophical fix. Just keep in mind that the shakiest part of your argument is assuming that a lack of relational data requires a substantive backup rather than just indicating that rotation becomes undefined or meaningless in that region, which is a bullet some relationists are willing to bite. If you can defend why rotation must remain defined even in total emptiness, then your scaffold holds water, but if rotation is only meaningful when there is something to rotate relative to, then the bucket stays flat in the void and your scaffold isn't needed.
