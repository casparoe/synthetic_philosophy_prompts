          *   Realist: Can still feel bad even if agreed.
          *   Deflationist: Rules define morality here; if allowed, it's not wrong.

  6.  **Drafting Section 4: Changing Minds & Settlement:**
      *   What makes a Realist quit? If they can prove the feeling is *only* chemical and no social norm exists? Hard. Maybe if the player admits they didn't care.
