  # The Virtual Harm Agreement
  **Date:** [Today's Date]
  **Group:** [Chat Name]

  We are writing this because we are stuck. We have been arguing for two weeks about whether griefing or scamming in a game is "real" harm. We are not trying to win this document. We are trying to map the fight so we can stop having it.

  Below is what we agree on, where we actually disagree, the test cases that settle it, and what it would take to change our minds.

  ## Part 1: What We All Agree On (The Facts)
  *Everyone signs below to confirm these statements are true. No metaphors, no interpretations.*

  1.  **The Code:** When a player is griefed or scammed, specific values in the server's database are changed or deleted.
  2.  **The Time:** The victim spent real-world time (e.g., 200 hours) acquiring the items or building the base. That time is gone regardless of what happens next.
  3.  **The Feeling:** The victim typically feels frustration, anger, or sadness immediately after the event.
  4.  **The Reversibility:** An admin with sufficient access can technically restore the data from a backup or duplicate the item, returning the database to its previous state.
  5.  **The Rules:** Most survival servers have written rules forbidding griefing and scamming without consent.
  6.  **The Consequence:** If the data is not restored, the victim must spend more real-world time to regain what was lost, or stop playing.
  7.  **The Agency:** The person doing the griefing chose to do it intentionally; it was not a glitch or an accident.

  ## Part 2: The Semantic Fight vs. The Real Fight
  *We admit that some of our argument is just about vocabulary. Here is exactly where the words are tricking us, and what is left after we fix them.*

  **The Word Fight:**
  We are fighting over the word **"Harm"** and **"Stealing."**
  *   **Realists** use these words to mean "violating someone's expectations and causing emotional distress."
  *   **Deflationists** use these words to mean "permanently removing physical property or causing irreversible real-world loss."

  **The Real Fight (After fixing the words):**
  Even if we agree to stop using the words "harm" and "stealing" and instead say **"Virtual Violation"** vs. **"Data Modification,"** we still disagree on the following:
  1.  **Moral Weight:** Does a "Virtual Violation" deserve the same punishment and social shame as a physical property violation?
  2.  **Ontology:** Is the value of the item created by the *code* (稀缺性/scarcity) or by the *player's effort*?
  3.  **Reversibility:** If an admin fixes the data, does the "wrongness" of the act disappear?

  ## Part 3: Where We Disagree (The Table)
  *Read across the rows. If you are a Realist, Column A should sound exactly like your view. If you are a Deflationist, Column B should sound exactly like yours. If you don't agree with the statement in your column, we need to rewrite it.*

  | The Issue | Column A (Realist View) | Column B (Deflationist View) |
  | :--- | :--- | :--- |
  | **1. What is the item?** | The item is a possession earned through labor. It belongs to the player regardless of the server's code. | The item is a license to use specific data. It belongs to the server owner; the player is just renting access. |
  | **2. What is the wrong?** | The wrong is betraying trust and wasting the player's time/effort. | The wrong is breaking the server's Terms of Service (a contract). |
  | **3. Does fixing it erase the act?** | No. Restoring the item fixes the *outcome*, but does not erase the *violation* that happened. | Yes. If the state is restored, no net loss exists. Therefore, no significant wrong remains. |
  | **4. Where is the value?** | Value is subjective. If the player cares about it, it has value. | Value is objective. It only has value if it can be exchanged for real money or affects real-world status. |
  | **5. Who decides the harm?** | The victim decides. If they feel harmed, they were harmed. | The system decides. If the system allows restoration, the harm was negligible. |

  ## Part 4: The Cruxes (Test Cases)
  *These are the specific scenarios that split us. For each case, we state the specific question it answers, and what each side predicts will happen. We agree to treat these predictions as evidence.*

  **Case 1: The Rollback**
  *Scenario:* Admin rolls back the server an hour later. Nothing is permanently gone.
  *   **The Crux:** Does fixing the outcome erase the wrongness of the act?
  *   **Realist Prediction:** The player will still report feeling violated and angry 6 months later.
  *   **Deflationist Prediction:** The player will report feeling fine once told the backup was restored.
  *   **Evidence:** We ask griefed players whose servers were rolled back how they feel about the griefer now.

  **Case 2: The Dupe**
  *Scenario:* A glitch lets someone copy your rare item. You still have yours. They have one too.
  *   **The Crux:** Is harm about losing the item, or about exclusive ownership?
  *   **Realist Prediction:** The player feels their item is now "worthless" and feels harmed by the inflation.
  *   **Deflationist Prediction:** The player lost nothing physically, so no harm occurred.
  *   **Evidence:** We check if players treat the duplicated item as less valuable than the original.

  **Case 3: The Offline Corruption**
  *Scenario:* Single-player save file corrupts. No other player involved.
  *   **The Crux:** Does harm require a malicious agent, or is loss enough?
  *   **Realist Prediction:** Players feel sadness, but do not feel "wronged" or angry at a person.
  *   **Deflationist Prediction:** The data loss is identical to griefing; the emotional reaction should be the same intensity.
  *   **Evidence:** We compare anger levels in corruption threads vs. griefing threads.

  **Case 4: Real Money vs. Grind**
  *Scenario:* Item bought with credit card vs. Item grinded for 200 hours.
  *   **The Crux:** Is value derived from money or labor?
  *   **Realist Prediction:** The community views losing the grinded item as *more* tragic than the bought item.
  *   **Deflationist Prediction:** The bought item is "more real" because real money was lost; the grinded item is just leisure time.
  *   **Evidence:** We look at ban appeals: which loss gets players unbanned faster?

  **Case 5: The Begging NPC**
  *Scenario:* Deleting a digital pet/NPC that is programmed to beg for its life.
  *   **The Crux:** Can you harm something that isn't a player?
  *   **Realist Prediction:** People will feel discomfort calling this "okay," even if no player is hurt.
  *   **Deflationist Prediction:** People will agree it is meaningless because no consciousness exists.
  *   **Evidence:** We poll the group: is deleting the pet "cruel" or "neutral"?

  **Case 6: The Invested vs. The Chill**
  *Scenario:* Same griefing act. Player A is obsessed. Player B shrugs.
  *   **The Crux:** Is harm defined by the victim's feeling or the act itself?
  *   **Realist Prediction:** The act was wrong in Case A, but negligible in Case B. Harm depends on the victim.
  *   **Deflationist Prediction:** The act was identical in both cases. The victim's feelings are irrelevant to the "crime."
  *   **Evidence:** We agree on whether the punishment for the griefer should change based on the victim's reaction.

  **Case 7: The Consented Raid**
  *Scenario:* Server rules allow raiding. Player joins knowing this. Gets raided.
  *   **The Crux:** Does consent make the act morally neutral?
  *   **Realist Prediction:** The player can still feel genuinely harmed/violated despite agreeing to the rules.
  *   **Deflationist Prediction:** Consent validates the act. If they agreed to the rules, they cannot claim harm.
  *   **Evidence:** We check if players quit servers after being raided even when raiding was allowed.

  ## Part 5: Changing Our Minds
  *What would it take for us to stop holding our current view?*

  **For the Realists to give up:**
  *   **Condition:** If we can prove that the negative feelings players report are temporary (less than 24 hours) and never affect their real-world behavior (sleep, eating, schoolwork).
  *   **Evidence:** A survey where 90% of griefed players say "I forgot about it within an hour and it changed nothing in my life."
  *   **Argument:** If the "harm" leaves no trace on the person's life, it is functionally identical to nothing happening.

  **For the Deflationists to give up:**
  *   **Condition:** If we can prove that virtual loss causes measurable real-world physical stress responses identical to physical theft.
  *   **Evidence:** Heart rate, cortisol levels, or sleep disruption data showing griefing triggers the same biological stress as having a physical bike stolen.
  *   **Argument:** If the body reacts to data loss the same way it reacts to physical loss, the distinction is biological nonsense.

  **Is there a shared settling condition?**
  *   **Yes.** If we agree that **Social Norms** are the only thing that matters.
  *   If the community *treats* it as theft (bans, shaming, anger), then it is socially real, regardless of the code.
  *   If the community *treats* it as a mechanic (laughing it off, resetting), then it is socially unreal.
  *   **Agreement:** We agree to look at how the specific server community reacts. If they ban the griefer, the Realists win on that server. If they laugh it off, the Deflationists win on that server. The "truth" depends on the specific community norms, not the code.

  ## Signatures
  *By signing, I agree that this document accurately represents my view and the view of the other side, even if I still think I am right.*

  1.  __________________________ (Realist)
  2.  __________________________ (Realist)
  3.  __________________________ (Realist)
  4.  __________________________ (Deflationist)
  5.  __________________________ (Deflationist)
  6.  __________________________ (Deflationist)
