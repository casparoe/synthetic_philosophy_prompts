answer: |-
  This is a sophisticated brief. You are right to avoid a survey; the literature is dense, and a "here is what Gilbert says, here is what Bratman says" structure will lose the reader before they grasp *why* it matters. To write a piece that lands, you need to treat these philosophical distinctions as levers that move real-world machinery.

  Here is a defended agenda for your piece. I recommend centering the narrative on **three unresolved issues**, arranged from the micro-foundations of interaction to the macro-consequences of institution.

  ### 1. The Normative Leap: How Does "I Intend" Become "We Ought"?

  **The Debate:**
  This is the upstream engine of the entire field. On one side, you have **reductionists** (like Michael Bratman) who argue shared intention is just interlocking individual intentions plus common knowledge (I intend that we J, you intend that we J, we know this). On the other, **pluralists** (like Margaret Gilbert) argue this is insufficient; it misses the *obligation*. If we merely interlock intentions, and I bail, you are disappointed. If we form a "joint commitment," and I bail, you are *wronged*. You have a right to rebuke me.

  **Why Prioritize This:**
  This is the most "upstream" conceptual puzzle. It determines the difference between a crowd and a team, or a market transaction and a marriage. If the reductionists are right, collective action is essentially sophisticated prediction and coordination. If the pluralists are right, it creates a new normative reality—a "plural subject" that generates duties independent of individual morality.

  **What Hangs On It:**
  *   **Contract Law vs. Social Norms:** If shared intention doesn't create intrinsic obligation, then all "informal agreements" are morally weightless until codified. This reshapes how we understand non-legal promises in politics or business.
  *   **Political Protest:** When a movement claims to speak for "the people," do they have a normative claim on participants? If a protester leaves the march, have they violated a commitment to the group, or simply updated their individual plan?
  *   **The Experience of Betrayal:** This tracks a deep, rarely articulated difference in lived experience. We *feel* the difference between a friend canceling dinner (disappointment) and a friend abandoning a joint project (betrayal). A theory of collective action must explain that phenomenological shift.

  **What a Satisfying Answer Looks Like:**
  It cannot be magic. A satisfying account must explain how two individual minds generate a normative force that binds them without appealing to a mystical group mind. It needs to show the mechanism by which "I" voluntarily surrenders the right to unilaterally exit the intention.

  ### 2. The Locus of Agency: Is the Group a "Black Box" or a Puppet?

  **The Debate:**
  This moves from the micro to the macro. Can a group be an agent in its own right (non-summative), or is group agency always a metaphor for the actions of its members (summative)? Philosophers like Philip Pettit and Christian List argue that when groups have decision-making procedures that aggregate judgments, they can hold beliefs and intentions that *no single member holds*. (e.g., A committee might believe P and believe Q, and therefore believe R, even if every individual member rejects R).

  **Why Prioritize This:**
  This is the high-stakes question for **corporate responsibility** and **institutional design**. If group agency is real, then a corporation can be guilty in a way that is not reducible to the sum of its employees' guilt. If it is metaphorical, then "corporate crime" is always just a shorthand for prosecuting specific individuals.

  **What Hangs On It:**
  *   **Legal Personhood:** We treat corporations as persons legally. This debate asks if that is a useful fiction or an ontological truth. If it's the latter, punishing the corporation (fines, dissolution) is justice. If it's the former, punishing the corporation is often just punishing shareholders or employees who had no control.
  *   **Democratic Representation:** If a parliament forms a "will" that differs from the will of the constituents (or even the representatives), is that a bug or a feature? This speaks to the independence of representatives.
  *   **Historical Guilt:** Can a nation apologize for crimes committed by past generations? Only if the nation is a continuous agent over time, distinct from the specific humans alive at any given moment.

  **What a Satisfying Answer Looks Like:**
  It needs a functional test. We need a criterion for when a structure absorbs individual agency. A satisfying answer would provide a threshold: "When the decision procedure overrides individual judgment to this degree, the group is the agent."

  ### 3. The Boundary Problem: Who Counts as the "We"?

  **The Debate:**
  This is the most politically urgent and often overlooked issue in collective intentionality. Most theories assume the group is already formed (e.g., "you and I intend to walk together"). But how is the boundary of the "We" drawn? Who is included in the joint commitment, and who is excluded? This touches on the work of Raimo Tuomela regarding "we-mode" vs. "I-mode" but pushes it into political territory.

  **Why Prioritize This:**
  Collective action is inherently exclusionary. To act as a "we" is to define a "they." In an era of populism and polarization, the *constitution* of the collective subject is the primary political battleground. Populist leaders, for example, often claim to embody the "true we" against elites or outsiders.

  **What Hangs On It:**
  *   **Voting and Membership:** Who gets to participate in the joint intention of the state? This is the philosophical root of immigration and enfranchisement debates.
  *   **Algorithmic Collective Action:** In the digital age, are we forming collective intentions with algorithms? If an algorithm nudges a group into action, is the "We" human-machine?
  *   **Coercion vs. Consent:** When does a "shared intention" become a tool of coercion? (e.g., "We all agree this is how things are done here.") This connects collective intentionality to power dynamics and silencing.

  **What a Satisfying Answer Looks Like:**
  It must move beyond voluntary association. A satisfying account needs to explain how boundaries are drawn in non-voluntary contexts (like nations or families) and provide a normative standard for when those boundaries are legitimate versus oppressive.

  ---

  ### What to Sideline (and Why)

  To make room for the above, you should deliberately minimize or exclude the following:

  **1. The Developmental/Empirical Literature (Infant Joint Attention)**
  *   **Why Sideline:** While fascinating, the debate over whether 9-month-olds engage in true joint attention or merely behavioral coordination is too granular for a piece on corporate responsibility and democracy. It risks turning the piece into a psychology report. Use it only as an anecdotal hook if necessary, not as a central pillar.
  *   **Reason:** It is upstream of the *capacity* for collective action, but your piece is about the *consequences* of it.

  **2. Pure Metaphysics of Group Ontology**
  *   **Why Sideline:** Debates about whether groups are "abstract objects," "concrete particulars," or "modes" are vital for academic metaphysicians but will lose a general readership.
  *   **Reason:** Readers care about *agency* and *responsibility*, not the categorical status of the entity. Focus on what groups *do*, not what they *are* in a Platonic sense.

  **3. Evolutionary Origins of Cooperation**
  *   **Why Sideline:** Explaining *why* we evolved to cooperate (game theory, evolutionary psychology) is distinct from explaining *what* cooperation consists in philosophically.
  *   **Reason:** Conflating the origin of a trait with the nature of the trait is a genetic fallacy. Your piece is about the logic of the "We," not the history of the "We."

  ### Narrative Strategy

  If I were editing this piece, I would suggest structuring it as an investigation into **Power**.

  1.  **The Power to Bind:** (The Normative Leap). How do we bind each other with words and intentions?
  2.  **The Power to Act:** (Group Agency). How do these bindings create entities that can wield power greater than individuals?
  3.  **The Power to Exclude:** (The Boundary Problem). Who is left out when that power is wielded?

  This arc moves the reader from the intimate experience of letting a friend down, to the courtroom drama of corporate liability, to the voting booth. It shows that the "conceptual puzzles" are actually the operating system of our social world. If you get the code wrong (e.g., if you assume group agency is a metaphor when it's real), the system crashes (e.g., no one is held responsible for the financial crisis).

  This approach respects the philosophy while demanding it pay rent in the real world.
