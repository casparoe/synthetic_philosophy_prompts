      *   *Collapse:* There isn't a theorem saying "Local Dialetheism $\to$ Global Dialetheism." But there is the risk of "Contagion." If a classical statement implies a dialetheic one, does the classical statement become dialetheic?
      *   *Unfalsifiability:* Distinguish between empirical and theoretical virtue.

  7.  **Final Review against Constraints:**
