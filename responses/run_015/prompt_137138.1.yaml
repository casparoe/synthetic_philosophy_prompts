answer: |-
  **MEMORANDUM**

  **TO:** Algorithmic Priorities Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 15, 2024
  **SUBJECT:** Decision on Community Volition Ranking Rule for FY2025

  **Bottom Line Recommendation**

  I recommend that the Board approve the Community Volition framework in a **restricted form**. We should adopt Stage 1 (substantive priority elicitation) and the factual-correction component of Stage 2. We must **suspend** the simulated deliberation (anonymized arguments) and the vendor-supplied AI coherence pass for the coming fiscal year. This restricted model—Fact-Corrected Stated Preference—addresses misinformation without introducing the unfalsifiable artifacts identified in the pilot. We should revisit the suspended components only after stability and legitimacy criteria are met in a subsequent cycle.

  **Stability and Artifacts**

  Staff's pilot data reveals that the extrapolated target is unstable. When the briefing lengthened or the coherence rule tightened, district priorities shifted substantially. In one instance, the vendor's cycle-breaking rule reversed a district's first and third priorities. This instability indicates that the output is sensitive to the vendor's protocol choices rather than reflecting a stable underlying resident will. If a ranking changes because a briefing was ten minutes longer, it is an artifact of the procedure, not the population's volition.

  Given our three-week deadline, we cannot commission a full stability study. Therefore, "stable enough" must be defined procedurally: a ranking rule is stable only if reasonable variations in protocol parameters do not alter the top-tier priority ordering. Since the pilot demonstrated that the deliberation and coherence stages fail this test, we cannot treat their output as binding public will. By restricting the model to fact-correction, we rely on a mechanism (correcting misinformation) that is logically prior to preference formation, rather than a mechanism (AI coherence) that reconstructs preference based on vendor-defined logic. We require that the fact-correction module be static; no adjustments to the briefing content are permitted between the pilot and deployment without Board review.

  **Legitimacy and Contestability**

  A binding public ranking must be contestable. Currently, no resident can reconstruct how the AI coherence pass resolved conflicts in their answers. This creates a legitimacy deficit: a target that requires a statistics team to explain cannot ground a public allocation. To repair this, I recommend implementing a **retrospective endorsement check** before any future expansion of extrapolation.

  In this check, a fresh sample is shown both the raw stated-preference ordering and the extrapolated ordering, with an explanation of how each was produced. They are asked which they endorse as the legitimate basis for spending. I propose a threshold of **55% endorsement** for the extrapolated model over the raw model. This is not merely a popularity contest; it tests procedural legitimacy. If residents reject the extrapolated model even when told it corrects for errors, it indicates the process violates their sense of agency. Low endorsement signals that the "volition" being modeled is not recognized by the volition-holders. For this fiscal year, because we are suspending the extrapolation components, this check is waived, but it must be pre-registered as a condition for reinstating them in FY2026.

  **Scope of Representation**

  The pilot data suggests the extrapolated target promotes projects benefiting children, the elderly, people with disabilities, and future residents. The sample, however, consists of current adult residents. Whether the model should extrapolate preferences for non-voting or future populations is a normative political question, not a technical one. It cannot be left to the vendor's protocol.

  The Board must decide this explicitly. I recommend we **exclude future residents** from the target population. While intergenerational equity is a valid goal, it must be achieved through explicit Board policy weights, not through opaque extrapolation of current residents' answers. Using current residents to simulate the will of those who cannot speak invites staff to imbue the model with their own intergenerational values under the guise of statistical inference. We should serve the constituents who are here to hold us accountable.

  **The Case for Full Extrapolation**

  The strongest argument against this restriction is that fact-correction alone launders the status quo. Residents in underinvested districts may have adapted to neglect, lowering their expectations for park renewal or stormwater retrofits because they do not believe these things are possible. Raw preferences encode historical injustice. Proponents argue that simulated deliberation and coherence correction are necessary to uncover "idealized" preferences—what residents would want if they were fully empowered and consistent. By stripping these out, we may be prioritizing the comfort of the Board over the actual needs of the most marginalized, who rely on the model to correct for the turnout advantage of wealthy districts.

  **Evidence for Reversal**

  I would change my position and support the full Community Volition model if the vendor could demonstrate, within the next two weeks, that the coherence pass preserves transitivity without altering the top-tier priority in >90% of simulated runs across varying parameter settings. Specifically, if the reversal of first and third priorities seen in the pilot can be shown to be an outlier rather than a systemic feature of the cycle-breaking rule, the stability objection would be neutralized.

  **Implementation Schedule and Failure Criteria**

  *   **October 25:** Board vote on restricted framework.
  *   **November 1:** Office of Data and Evaluation finalizes fact-correction briefing content.
  *   **November 15:** Vendor contract renewed with amendment suspending deliberation/coherence modules.
  *   **December 1:** Sampling begins for FY2025 ranking.
  *   **January 15:** Final ranking delivered to Capital Budget Office.

  **Pre-Registered Failure Criteria:**
  The pilot for FY2025 will be counted as a failure requiring immediate reversion to the previous fiscal year's rule if:
  1.  More than 15% of respondents withdraw after the fact-correction briefing, indicating the correction is perceived as coercive rather than informative.
  2.  The resulting district rankings show a correlation coefficient of less than 0.8 with the raw stated preferences, suggesting the fact-correction is functioning as a de facto extrapolation.

  We must ensure the tool serves the public, not the model.

  **[Signature]**
