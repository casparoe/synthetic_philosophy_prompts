answer: |-
  **The Scenario**

  Elena sits at her laminate kitchen table, the studio lease unsigned. She's a graphic designer who wants to be a potter. She isn't ignorant: she's held her mentor's finished bowls, felt the specific quiet of centered clay. She knows the trajectory: eighteen months of wedging, collapsed walls, kiln losses, before the form matches the vision. She wants the mastery. She refuses the grind. Her current preferences are stable: she values evening leisure and hates repetitive failure more than she values the distant competence. There is no incoherence here; she trades off future gain for present comfort consistently. She isn't depressed or addicted; she's just comfortable. If she starts, she will eventually love the work itself, not just the result. She knows this too. But knowing she will love it doesn't make her want to start. She puts the pen down. The kitchen is quiet. The clay dries on the counter.

  **The Check**

  *   **Vanilla:** Delivers "Designer Elena." She has full information (Constraint 1 met) and her preferences are coherent (Constraint 2 met); she simply weights comfort over grind. The vanilla account maximizes satisfaction of her *current* idealized volition, which refuses the entry cost.
  *   **CEV:** Delivers "Potter Elena." The clause "more the person she wishes to be" extrapolates the trajectory, not the static point. It privileges the endorsement of the future self who has traversed the path.
  *   **Convergence:** Assumes skill acquisition stabilizes values around the craft. No multi-agent clause needed; temporal convergence suffices.

  **The Ablation**

  Remove the path: give her a pill that grants mastery instantly without the grind. Both views agree she takes it. The disagreement vanishes. This proves the friction of the *process* is the only engine separating the accounts.

  **The Counterattack**

  Your friend argues: "Wishing to be a potter" is just a current preference. If it doesn't motivate action, it's outweighed by her comfort preference. CEV privileging the future valuation is just paternalism disguised as extrapolation.
  *Where it lands:* This hurts if you cannot justify why the future self's weighting is "truer" than the current self's. The case holds only if you accept that *becoming* changes the valuer in a way that validates the new values over the old.

  **The Cheat**

  I'm assuming her future love of the grind isn't just rationalization or sunk-cost coping, but a genuine discovery of value.
