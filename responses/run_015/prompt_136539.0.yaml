      *   *Does it resolve?* No, because the Historians will ask: "But why did the frame shift?" If the frame shift is explained by material conditions, values are epiphenomenal. If the frame shift is explained by ideas, we need a mechanism.
      *   *Intelligibility as Causal Power:* This is the crux. If making an action intelligible *is* explaining it (for social science), then intelligibility is explanatory. But is it *causal* in the natural science sense? No. So the conflict remains on the definition of "explanation."

