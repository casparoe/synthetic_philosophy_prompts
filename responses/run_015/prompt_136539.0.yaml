          4.  Evaluate the "Efficient Cause vs. Frame-Condition" framing.
          5.  Assess prospects for progress.

  2.  **Deconstruct the Debate (Literature & Seminar Context):**
      *   *Weber's Text:* He explicitly denies monocausality ("causal pluralism"). He uses *adequate causation* (historical imputation) and *objective possibility*. He distinguishes *causal explanation* from *interpretive understanding* (*Verstehen*), but aims to unite them.
      *   *The Historians' Critique:* Often stems from Marxist or Annales School influences. Material conditions (technology, trade routes, banking) precede the Reformation. If $X$ (Capitalism) exists before $Y$ (Protestant Ethic), $Y$ cannot cause $X$. This assumes a temporal/efficient causation model.
      *   *The Weberian Defense:* Weber isn't saying Protestantism *created* capitalism ex nihilo. He's saying it provided the *legitimation* and *psychological sanction* for the *spirit* of capitalism (rational accumulation as an end in itself). This is about the *direction* and *intensity* of economic action, not its mere existence.
      *   *The Philosophers' Worry:* Mind-body problem applied to history. If values are mental/normative and economics is material/behavioral, how do they interact? Dualism vs. Monism.

  3.  **Diagnose the Disagreement:**
      *   *Is it Verbal?* Partly. "Cause" is doing too much work. Historians mean "efficient cause" (billiard ball model). Weberians mean "imputation of significance" or "switchman" metaphor.
