answer: |-
  This is a classic impasse in the philosophy of social science, one that recapitulates the *Methodenstreit* of the late 19th century but transposed into the key of causal ontology. Your hypothesis is astute: the stall is not primarily empirical. No amount of data on 16th-century ledgers in Florence or Augsburg will resolve the ontological status of "values" in a causal chain.

  Below is a diagnosis of the disagreement, an evaluation of your "frame-condition" framing, and an honest assessment of the prospects for progress.

  ### 1. Mapping the Positions: Literature and Seminar Dynamics

  To diagnose the stall, we must first formalize the three positions currently talking past one another.

  **A. The Empirical Historians (The Materialist/Temporal Critique)**
  *   **Core Claim:** Causation requires temporal priority and constant conjunction. Since proto-capitalist institutions (banking, double-entry bookkeeping, long-distance trade) existed in Catholic Northern Italy prior to the Reformation, the Protestant Ethic cannot be the *cause* of capitalism.
  *   **Underlying Model:** Efficient causation (Humean/Newtonian). $A$ causes $B$ only if $A$ precedes $B$ and $B$ does not occur without $A$.
  *   **Blind Spot:** They often conflate "capitalism" (as an economic system of exchange) with the "spirit of capitalism" (as a specific ethos of rational, systematic accumulation as a *calling*). They treat values as epiphenomenal superstructures rather than constitutive elements of action.

  **B. The Weberians (The Interpretive/Adequate Causation Defense)**
  *   **Core Claim:** Weber explicitly rejected monocausality. His method is *historical imputation* using "objective possibility" and "adequate causation." He argues that while material conditions were necessary, the Protestant Ethic was the *decisive* factor in explaining the specific *rationalization* of economic conduct in the West.
  *   **Underlying Model:** Causal pluralism + *Verstehen*. Explanation requires rendering action intelligible via the actor's motives. Values act as "switchmen" (Weber's metaphor) determining the tracks along which action is pushed by dynamic interests.
  *   **Blind Spot:** They sometimes retreat into tautology: the "spirit" is defined by the actions it explains, making the causal claim unfalsifiable. They also struggle to specify the *mechanism* by which a theological belief becomes an economic habit without invoking psychological reductionism.

  **C. The Philosophers (The Ontological/Category Critique)**
  *   **Core Claim:** To say a "value" causes a "material event" risks a category mistake (Ryle). Normative reasons belong to the "space of reasons," while economic events belong to the "space of causes." Merging them requires either reducing reasons to causes (naturalism) or elevating reasons to a causal force (idealism), both of which are problematic.
  *   **Underlying Model:** Anti-naturalism or Dualism.
  *   **Blind Spot:** This can lead to a paralysis where social explanation is severed from natural science entirely, making social science immune to empirical correction.

  ### 2. Diagnosing the Disagreement

  You asked whether this is verbal, evidential, or bedrock intuition. My diagnosis is that it is a **Categorical-ontological disagreement disguised as a methodological dispute.**

  **It is not merely verbal.**
  While all sides use the word "cause," they are not simply defining it differently for convenience; they are committed to incompatible ontologies of the social world.
  *   For the Historians, the social world is composed of **events and structures** that exist independently of description.
  *   For the Weberians, the social world is composed of **actions** that are constituted by the meanings actors attach to them.
  *   Therefore, when Historians ask, "Did Protestantism cause Capitalism?", they mean, "Did the Reformation event produce the Capitalist structure?" When Weberians answer, they mean, "Did the Reformation provide the semantic resources necessary for Capitalist action to be intelligible and sustainable?"

  **It is Substantive, not just Methodological.**
  You asked if there is a substantive disagreement about reductionism. **Yes.**
  *   **The Ontology of Values:** The Historians implicitly treat values as *variables* that can be present or absent. The Weberians treat values as *media* through which interests are processed.
  *   **Overdetermination:** The Historians worry that if values are causes, we lose the ability to weigh material factors. The Weberians worry that if values are not causes, we lose the specific *sociological* character of the explanation (it becomes economics or demography).
  *   **The Bedrock Intuition:** The real clash is over the **autonomy of culture**. The Historians operate on a bedrock intuition that material survival and technological capacity are the ultimate constraints (a soft materialism). The Weberians operate on a bedrock intuition that human distinctiveness lies in meaning-making, and therefore meaning must have explanatory autonomy.

  ### 3. Evaluating the "Frame-Condition" Framing

  Your proposed framing—distinguishing between **efficient causes** (levers/pushes) and **frame-conditions** (intelligibility/context)—is philosophically robust. It aligns with distinctions made by Peter Winch (rules vs. causes), John Searle (constitutive rules), and Charles Taylor (background understanding).

  **Does this move the debate?**
  Yes, it clarifies the Weberian position significantly. It rescues Weber from the charge of "bad science." If values are frame-conditions, they do not need to compete with technology for the title of "efficient cause." Technology determines what is *possible*; values determine what is *meaningful* and *pursuable*.

  **Does it resolve the disagreement?**
  No, it **relocates** the disagreement to a deeper level: **The Causal Efficacy of Intelligibility.**

  1.  **The Historians' Counter:** If values are merely frames, what changes the frame? If the shift from Catholic to Protestant frames is explained by political alliances, printing press technology, or economic stress, then the "frame" is still an effect of material efficient causes. The "frame-condition" becomes an intervening variable, not an independent cause.
  2.  **The Ontological Trap:** If you argue that "making an action intelligible" *is* a form of causal power, you are essentially arguing for a non-naturalist ontology. You are claiming that the "Space of Reasons" has traction on the physical world. The Historians (and naturalist philosophers) will reject this as mysticism unless you can show how "intelligibility" is instantiated in neural or behavioral mechanisms.
  3.  **Collapsing back into Standard Interpretations:** This framing risks collapsing into the standard "Idealism vs. Materialism" debate. If the Frame is independent, it looks like Idealism. If the Frame is dependent on material conditions, it looks like Materialism. Weber's specific contribution was the *interaction* (elective affinity), but the "frame" language makes it hard to model that interaction without reducing one side to the other.

  ### 4. What Counts as Progress?

  Given this diagnosis, expecting a "resolution" where one side concedes is unrealistic. However, progress is possible if the terms of engagement shift.

  **A. Conceptual Distinction: Efficient vs. Constitutive**
  Progress requires formally adopting the distinction you hinted at. We must distinguish:
  *   **Efficient Explanation:** What antecedent conditions produced this outcome? (Historians' domain).
  *   **Constitutive Explanation:** What rules/meanings make this outcome a specific *type* of action? (Weberians' domain).
  *   *Progress:* Admitting that Weber is offering a constitutive explanation of the *Spirit*, while Historians offer an efficient explanation of the *System*. They are explaining different *explananda*.

  **B. Mechanism-Based Integration**
  To satisfy the Philosophers' worry about category mistakes, we need a model of how values interact with conditions without magic.
  *   **Analytical Sociology:** Scholars like Peter Hedström might suggest modeling values as *constraints on choice sets* within a rational action framework. This naturalizes values without eliminating them.
  *   **Critical Realism:** Margaret Archer's morphogenetic approach allows for the "emergence" of cultural structures that have causal power relative to agents, without being reducible to them. This validates the "frame" idea without committing to idealism.

  **C. Admission of Ill-Posedness**
  Honest progress might require admitting the question "Did values cause capitalism?" is ill-posed. It assumes values and capitalism are separate entities that can collide. A more Weberian view is that capitalism *is* a set of value-laden practices. You cannot separate the "material" economy from the "cultural" ethic without destroying the phenomenon you are studying.

  ### 5. Final Assessment

  Your intuition that the debate is stalled because "cause" is answering different questions is correct. However, do not expect the "frame-condition" distinction to silence the Historians. They will rightly ask: **"If the frame doesn't push, how does it move?"**

  **The Verdict:**
  The disagreement is **substantive and ontological**, not merely verbal. It is a conflict between a **naturalist ontology** (social facts are like natural facts) and an **interpretive ontology** (social facts are constituted by meaning).

  **Recommendation for the Seminar:**
  Stop asking if Weber was "right" about causation. Instead, ask: **"What kind of causal claim is compatible with the ontological status of meaningful action?"**
  *   If you demand Humean causation, Weber fails (and so does most history).
  *   If you accept "reasons as causes" (Davidson) or "constitutive rules" (Searle), Weber succeeds, but you must abandon the hope that social explanation looks like physics.

  Progress lies not in proving Weber's causal thesis true, but in clarifying that **social explanation requires a dual register:** one that accounts for material constraints (efficient) and one that accounts for semantic constitution (frame). The impasse persists only so long as one side insists their register is the only legitimate one.
