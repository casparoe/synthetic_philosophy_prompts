      *   *Is it Bedrock Intuition?* Yes. Materialists assume the economic base is ontologically prior. Weberians assume meaningful action is the fundamental unit of sociology.
      *   *Substantive vs. Methodological:* It's both. Methodologically, they disagree on what counts as an explanation (covering law vs. interpretive narrative). Substantively, they disagree on the ontology of the social world (is it things or actions?).

  4.  **Evaluate the "Efficient Cause vs. Frame-Condition" Framing:**
