          *   Counter-argument: Jaspers's *political guilt* is not about personal sin; it's about civic liability. Citizens are co-responsible for the state's actions.
          *   Synthesis: The Charter is an exercise in *political* responsibility, not an admission of *metaphysical* guilt. It acknowledges the *institution's* continuity, not the *individual's* moral failure.
      *   **The Structural Obligation (Middle Ground):**
