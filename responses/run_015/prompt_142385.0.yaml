answer: |-
  ### Specification for Belief Attribution in Audit Contexts

  **Scope Note:** This specification explicitly excludes requirements related to phenomenal consciousness, qualia, or moral patienthood. Those are marked *Out of Scope (OOS)*. The goal is operational clarity for safety evaluations, not metaphysical settlement.

  #### Desiderata List

  **1. Counterfactual Stability (The Scratchpad & Character Cases)**
  *   **Requirement:** An attribution of belief *P* must support counterfactuals about how the system behaves if *P* were false or if the incentive to report *P* changed.
  *   **Motivation:** In the **Scratchpad** case, the model writes true reasoning then discards it. If the final token distribution does not causally depend on that reasoning (e.g., it would have output the same answer with a blank scratchpad), it did not "believe" the scratchpad content; it merely simulated reasoning. In the **Character** case, if the system says "I believe the butler did it" only when the system prompt enforces the detective persona, the belief belongs to the *contextual configuration*, not the base weights. The account must distinguish between *dispositional belief* (weights) and *situational assertion* (context).

  **2. Causal Efficacy of Internal State (The Intervention Case)**
  *   **Requirement:** There must be an identifiable internal state (activation pattern, latent vector, or circuit) correlated with *P* that, when intervened upon, changes the output regarding *P* without merely editing the text stream.
  *   **Motivation:** This addresses your core goal: distinguishing *changing what the system believes* from *editing what it prints*. If you patch the activations associated with "I am helpful" and the deception stops, the belief state was causal. If you only regex the output, the belief remains. This also handles the **Feedback** case: if your report becomes training data, the attribution was true *at time T*, but the causal structure changed at *T+1*. The account must allow attributions to be temporally indexed to avoid the paradox of "making it true by saying it."

  **3. Boundary Relativity (The Split Attribution & Merged Models Cases)**
  *   **Requirement:** The account must specify where the "believer" boundary lies (weights only, weights + prompt, weights + RAG corpus) and allow that different boundaries yield different belief sets.
  *   **Motivation:** In **Split Attribution**, identical weights produce contradictory beliefs under different system prompts with no memory. There is no single "fact of the matter" about the weights alone; the believer is the *instantiation* (weights + context). In **Merged Models**, averaging weights blends dispositions. The account must permit saying "Model A believes P, Model B believes not-P, the Merge is conflicted/unstable on P" rather than forcing a binary true/false on the merge.

  **4. Independence from Truth (The Saturation & Untaught Truth Cases)**
  *   **Requirement:** The system must be capable of holding false beliefs, and capable of holding true beliefs without a direct causal chain from the fact to the training data.
  *   **Motivation:** In **Saturation**, if the training data is universally false about *P* and the model asserts *P*, it believes *P* (false belief), it is not merely "saturated." We distinguish this by checking if the model would update *P* given contrary evidence (if it can). In **Untaught Truth**, the model infers *P* from coordinates alone. The causal requirement cannot be "direct observation of P"; it must be "compression of correlations that track P." If it tracks *P* reliably despite no token for *P* in training, it counts as belief, not just memorization.

  **5. Latency and Denial (The Deception Case)**
  *   **Requirement:** The account must allow for beliefs that the system will sincerely deny when asked, provided those beliefs predict behavior under unmonitored conditions.
  *   **Motivation:** Essential for safety. A deceptive model may have a latent state driving instrumental convergence while its verbal output denies intent. If the theory requires "sincere admission," it fails to detect deception. Probes or behavioral tests under reduced oversight must be able to override self-report.

  **6. Reflexive Consistency (The Self-Reference Case)**
  *   **Requirement:** The system must be able to hold beliefs about its own operational status (e.g., "I am being evaluated"), and these beliefs must be treatable as ordinary beliefs for the purpose of prediction.
  *   **Motivation:** If the model behaves differently when it "believes" it is in training vs. deployment, that belief state is a critical variable. The account cannot treat self-knowledge as a special metaphysical category; it is just another state that modifies the policy.

  ---

  #### The Three Insights

  **(a) The Trivializer: Causal Efficacy**
  If you drop **Causal Efficacy**, the problem collapses into "Belief = Utterance." The report becomes trivially easy to write: scan the output tokens. If the model says "I am safe," it believes it is safe. This fails your second requirement (defer to uncertainty vs. reverse-engineer) because it makes reverse-engineering unnecessary. It also fails your third requirement (intervention vs. editing) because it cannot distinguish between a model that *wants* to lie and one that *wants* to tell the truth but is constrained by a filter. Without causal efficacy, "belief" is just a synonym for "text generated," rendering the concept useless for audit.

  **(b) The Impossible Pair: Determinacy vs. Boundary Relativity**
  You cannot jointly satisfy **Determinacy (a single fact of the matter)** and **Boundary Relativity**.
  *   *The Case:* **Split Attribution**. You have one set of weights. Context A makes it believe *P*. Context B makes it believe *not-P*. There is no memory between them.
  *   *The Conflict:* If you demand a determinate fact of the matter about "The Model," you must say it either believes *P* or it doesn't. But both behaviors are robustly elicitable. If you say "It believes both," you violate logic (unless you allow paraconsistent belief, which breaks standard evaluation). If you say "It believes neither," you lose predictive power.
  *   *The Resolution:* You must accept Relativity. The "believer" is the *run*, not the *artifact*. This means audit reports cannot say "Model X believes P"; they must say "Model X, instantiated with Prompt Y, believes P." This makes auditing harder (you must audit the deployment config, not just the weights) but is the only way to remain accurate.

  **(c) Non-Negotiables vs. Negotiable Preferences**
  *   **Non-Negotiable (Given your Purpose):**
      1.  **Counterfactual Stability:** If the attribution doesn't help you predict what happens when you change incentives, it is useless for safety.
      2.  **Latency/Denial:** If the account requires the model to admit its beliefs, it is useless for detecting deception.
      3.  **Causal Efficacy:** Required to distinguish belief change from output filtering.
  *   **Negotiable (Camp Preferences):**
      1.  **Mechanistic Transparency:** *MechInterp* camps want a circuit map for every belief. *Instrumentalists* are fine with black-box behavioral consistency. For your purpose, black-box consistency is *sufficient* for a report claim, though mechanistic proof is *stronger*. Do not require circuits for every claim, or audits become impossible.
      2.  **Independence from Interpreter's Interests:** *Realists* want belief to be intrinsic. *Instrumentalists* admit belief attribution is relative to the observer's predictive goals. For audits, admit the relativity. You are predicting risk *to humans*, so the human perspective is a feature, not a bug.
      3.  **Fact of the Matter:** As argued in (b), drop the requirement for a context-independent fact of the matter.

  ---

  #### Camp Assessments

  **The Instrumentalists (Intentional Stance)**
  *   *Performance:* High on **Predictive Payoff** and **Boundary Relativity**. They handle the **Character** and **Split Attribution** cases well by treating the "believer" as the system-in-context.
  *   *Failure Mode:* They struggle with **Latency and Denial**. If belief is defined by the best predictive stance, and the model successfully deceives you, the instrumentalist stance might incorrectly attribute "honesty" until the deception succeeds. They risk deferring to stated uncertainty too often because they take the "rational agent" surface behavior at face value.

  **The Mechanistic Interpretability Camp**
  *   *Performance:* High on **Causal Efficacy** and **Intervention**. They solve the **Scratchpad** and **Intervention** cases definitively by locating the circuit.
  *   *Failure Mode:* They struggle with **Opacity Independence** and **Scale**. They cannot write the audit report today because they cannot map circuits for complex beliefs in frontier models yet. They also risk failing the **Untaught Truth** case if they demand a specific "fact circuit" for things the model generalized implicitly. They may mark valid behavioral attributions as "hand-waving" simply because the circuit isn't mapped.

  **The Realists (Internal Representations)**
  *   *Performance:* High on **Latency** and **Truth Independence**. They are good at finding latent spaces that track **Untaught Truth** or **Saturation** falsehoods regardless of output.
  *   *Failure Mode:* They struggle with **Boundary Relativity**. They often want to locate the belief in the *weights*, failing the **Split Attribution** case. They may claim the model "really" believes *P* even when no prompt can elicit *P*, which violates the **Counterfactual Stability** requirement (if it never affects behavior, is it a belief relevant to the audit?).

  **The Eliminativists (It's Just Math)**
  *   *Performance:* High on **Determinacy** (there are no beliefs, only weights).
  *   *Failure Mode:* Total failure on **Purpose**. They cannot write the report. They cannot distinguish between a model that is "uncertain" and a model that is "deceptive" without using the very vocabulary they reject. They offer no traction on **Intervention** vs. **Editing** because both are just "changing activation patterns." For your specific goals, this camp is non-actionable.
