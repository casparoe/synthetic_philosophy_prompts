      *Let's refine the "Non-Negotiables".* The user wants to know when to defer to uncertainty vs reverse engineer. This requires knowing if the system *has* information it isn't sharing. So "Latent State Accessibility" is key. The user wants to know if an intervention changed belief vs output. So "Causal Leverage" is key.

      *Let's refine the "Impossible Pair".* The tension between *Independence from Interpreter's Interests* and *Predictive Payoff*. Predictive payoff is always relative to a goal (what are we predicting?). But a "fact of the matter" about belief suggests independence. Actually, the Boundary vs. Determinacy argument is stronger for LLMs specifically.

      *Let's refine the Camp Assessment.* Keep it tight. One paragraph each.

  9.  **Final Polish:** Check the "Feedback" case. This is tricky. If I say it believes P, and it gets trained on that, did I make it true? The account needs to handle *attribution as intervention*. I will add this to the "Causal Efficacy" or "Reflexivity" desideratum.

      *Wait, one more check on the "Trivializer".* If I drop "Allowing False Beliefs" (Saturation case), does it collapse? If everything asserted is true, then belief = truth. That's bad. But if I drop "Causal Efficacy", belief = utterance. That's the common failure mode in evals. Yes, Causal Efficacy is the right trivializer.

