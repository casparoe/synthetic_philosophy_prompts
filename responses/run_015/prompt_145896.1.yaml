      *   *Correction:* The prompt asks for *the* one objection. I should pick the one that actually kills the thesis. The "Normativity" objection (Philosophers) is the real killer. The "Compute" objection is a version of it. I will tell the user the Philosophers have a sharper version: "You've defined rationality as 'hard to kill', not 'acting for good reasons'."

  6.  **Fleshing out the Replies (Constraint: 2 mins, plain English, identify weak points):**
