  # THE BUILDING ARGUMENTS SHEET
  **Neighbourhood Forum Drop-In Session**

  **How to use this:**
  There are no right answers. There are only consistent ones. Below are eight questions about real situations on real streets. Answer **Yes** or **No** to each. Follow the path to find your position. At the bottom, you will find what that position implies, including the difficult parts you might not have considered.

  ***

  ## THE EIGHT BRANCH QUESTIONS

  **1. The Veto**
  *A proposal for forty flats is made. The primary school and surgery are already full. This specific street votes 3-to-1 against it, but the Town as a whole says it is needed.*
  **Does the street have the right to stop it?**
  ( ) **YES** → Go to Question 2
  ( ) **NO** → Go to Question 5

  **2. The Tenants**
  *On a street where the objection is led by people who rent their homes rather than own them.*
  **Do renters get the same vote as owners?**
  ( ) **YES** → Go to Question 3
  ( ) **NO** → Go to Question 4

  **3. The Compensation**
  *The developer offers objectors a better park and priority for their children in the new flats to drop the objection.*
  **Is this compensation a right you are owed, or a bribe you should refuse?**
  ( ) **A RIGHT** → **Leaf A**
  ( ) **A BRIBE** → **Leaf B**

  **4. The Returnee**
  *A person grew up on this street, was priced out fifteen years ago, and now wants one of the new flats.*
  **Do they count as a neighbour with a say, or an outsider?**
  ( ) **A NEIGHBOUR** → **Leaf C**
  ( ) **AN OUTSIDER** → **Leaf D**

  **5. The Windfall**
  *Planning permission is granted. The value of the land instantly doubles.*
  **Who keeps the profit: the person selling the land, or everybody in town?**
  ( ) **THE SELLER** → Go to Question 6
  ( ) **EVERYBODY** → **Leaf E**

  **6. The Empty Flats**
  *A company registered abroad owns a block of eight flats that have stood empty for years.*
  **Do they have the right to keep them empty, or must they be used?**
  ( ) **THEY ARE PRIVATE PROPERTY** → **Leaf F**
  ( ) **THEY MUST BE USED** → Go to Question 7

  **7. The Nurses**
  *A scheme is proposed reserved for nurses at the local hospital, compared to one sold off-plan to investors.*
  **Does the job the buyer does matter, or just the fact they need a home?**
  ( ) **THE JOB MATTERS** → **Leaf G**
  ( ) **JUST THE NEED** → Go to Question 8

  **8. The School**
  *Forty flats are proposed where the school is full.*
  **Do we stop the flats, or expand the school?**
  ( ) **STOP THE FLATS** → **Leaf H**
  ( ) **EXPAND THE SCHOOL** → **Leaf I**

  ***

  ## THE LEAVES (YOUR POSITION)

  **Leaf A: The Communitarian**
  *You believe the street is a collective body that holds a claim none of the individuals in it holds separately.*
  **The Awkward Commitment:** You must accept that the street can vote to exclude people who have lived here for decades if the majority wills it.

  **Leaf B: The Civic Republican**
  *You believe permission is a public power that must be used for the widest benefit, but objectors should not be paid off.*
  **The Awkward Commitment:** You must accept that your own home could be changed fundamentally without your consent and without compensation.

  **Leaf C: The Social Justice**
  *You believe the first duty is to those already priced out or pushed out, even over current residents.*
  **The Awkward Commitment:** You must accept that a stranger who grew up here has more say than your neighbour who has cared for the street for forty years.

  **Leaf D: The Localist**
  *You believe long residence earns a real say, and presence is distinct from origin.*
  **The Awkward Commitment:** You must accept that you are creating a class of citizens who can never return to where they were born.

  **Leaf E: The Collectivist**
  *You believe the gain created by permission belongs to everybody, not the landowner.*
  **The Awkward Commitment:** You must accept that if you own land, the state decides what your effort is worth, not the market.

  **Leaf F: The Proprietor**
  *You believe the owner's decision is essentially their own, provided they break no law.*
  **The Awkward Commitment:** You must accept that a street can be hollowed out by absentee landlords and there is nothing the community can do.

  **Leaf G: The Meritocrat**
  *You believe housing should serve specific public functions (like nursing) rather than general demand.*
  **The Awkward Commitment:** You must accept that a teacher or a shopkeeper is less deserving of a home than a nurse, even if both serve the town.

  **Leaf H: The Protectionist**
  *You believe infrastructure limits are hard stops, not challenges to be solved.*
  **The Awkward Commitment:** You must accept that the town will not grow, and your children will likely have to leave to find work.

  **Leaf I: The Supply-Sider**
  *You believe the first duty is to people not yet here, and capacity should be built to meet them.*
  **The Awkward Commitment:** You must accept that the character of the place you love will change inevitably, and perhaps vanish.

  **Leaf J: The State-Capitalist** *(Incoherent Combination)*
  *You voted Town Overrides (Q1) but Seller Keeps Windfall (Q5).*
  **Status:** **Unattractive.** You give the state the risk of planning but let private actors keep the reward. Few hold this view openly.

  **Leaf K: The Enclave** *(Incoherent Combination)*
  *You voted Street Veto (Q1) but Renters No Vote (Q2) and Returnee Outsider (Q4).*
  **Status:** **Incoherent.** You claim the "Street" decides, but exclude most people who actually live on or come from it. This is usually a mask for property protection.

  **Leaf L: The Passive Resident** *(Unvisited Combination)*
  *You voted Town Overrides (Q1) but Stop the Flats (Q8).*
  **Status:** **Unvisited.** You deny the street a veto, but demand the town stop building anyway. This is usually a voting error rather than a belief.

  ***

  ## FOOTNOTES FOR THE TABLE

  **1. On Values vs. Expectations**
  You will notice none of these questions ask what *will* happen (e.g., "Will rents fall?"). They ask what *should* happen. If you answered based on a guess about the economy, you have measured your expectations, not your values. Re-answer based on what you think is right, even if it costs you money.

  **2. The Questions That Separate Neighbours**
  In our experience, **Question 1 (The Veto)** and **Question 5 (The Windfall)** are the only two that reliably separate neighbours who otherwise believe they agree. People often share a language of "community" until one realises the other means "local veto" and the other means "town need". Similarly, friends often agree on "building homes" until one realises the other means "private profit" and the other means "public capture".

  **3. Collapsed Distinctions**
  The ordinary **For/Against** framing collapses **Leaf B (Civic Republican)** and **Leaf I (Supply-Sider)** together. Both look like "Pro-Building". But one believes the town decides for the common good (B), and the other believes the market should meet demand (I). They will fight when the town wants homes the market won't build.
  The framing also collapses **Leaf A (Communitarian)** and **Leaf F (Proprietor)**. Both look like "Anti-Building". But one believes the *street* owns the decision, the other believes the *landowner* does. They will fight when a neighbour wants to extend their garage.

  **4. Indistinguishable Leaves**
  This tree cannot reliably separate **Leaf B (Civic Republican)** and **Leaf I (Supply-Sider)** in every case. Both often result in "Build the Flats". The difference is only visible when the Town and the Market disagree. We have kept them separate here to show the moral distinction, but in a vote on a specific application, they will stand together.

  **5. Empty Space**
  **Leaf J, K, and L** represent logical spaces that are theoretically possible but rarely occupied. If you find yourself here, check your answers. You may be holding two values that contradict each other when put to work.
