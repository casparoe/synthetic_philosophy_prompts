prompt: |-
  Right, I'm a backend engineer with no philosophy training, but I've been trying to sort my head out about Dennett's patterns and the three stances after a long argument with a mate over pints. I want to check if this package is coherant or if I'm talking rubbish: (1) I'm a pattern realist—if describing a regularity lets you compress predictions it's real, whether that's heat, a deadlock in distributed storage, or a social norm, and physics doesn't get ontological priority. (2) I literally think the physical, design, and intentional stances map onto software abstaction layers—silicon, source code, and user goals—it's not just a metaphor, explanation actually works like that. (3) So I take the design stance for brains and AI alike; they're both functional architectures you understand at that layer without tracing every transistor. (4) But I reckon the intentional stance needs an original user—a biological agent with its own goals—so people get it, but AI, corporations, and code never do, even if they behave like they want things. (5) The catch is I also buy evolutionary debunking arguments that human goals are basically adaptive patterns, i.e. design-level regularities, which makes me wonder if we even count as original users.

  Is there a hidden contradiction between treating the stances as continuous layers in (2) and insisting on a hard line for intentionality in (4)? Does (5) undermine both (3) and (4) by reducing human goals to design patterns? And is the clash between giving AI the design stance but denying them intentionality in (3) versus (4) just an apparent tension that dissolves once you separate function from agency? Please reply as exactly five numbered points, each one or two sentences long, with no introduction or conclusion. Rank the tensions by severity, say which commitment is cheapest to drop, and flag which pair only looks tense but isn't.
