answer: |-
  Your intuition is correct: your friend's summary is a romanticized, partially anachronistic interpretation that mixes Turing's actual technical proposals with later philosophical debates and cultural coloring. While there is a kernel of truth regarding the "child machine," the specific details about curriculum, the dismissal of algorithms, and the leap to legal rights are not supported by Turing's texts.

  Here is a sentence-by-sentence breakdown of your friend's summary against Turing's actual writings, primarily *Computing Machinery and Intelligence* (1950) and his earlier report *Intelligent Machinery* (1948).

  ### 1. "He believed you should raise an intelligent machine exactly like a British public-school boy—start with a blank mechanical child-brain..."

  *   **Verdict:** **Mostly Accurate (with cultural embellishment).**
  *   **Turing's Actual View:** In Section 6 of *Computing Machinery and Intelligence* ("Learning Machines"), Turing explicitly proposes that instead of trying to program an adult mind, we should build a machine that simulates a **child's mind**. He writes, "Instead of trying to produce a programme to simulate the adult mind, why not rather try to produce one which simulates the child's?"
  *   **The Nuance:** He does compare the initial state of the machine to a "note-book as one buys it from the stationer's," implying a *tabula rasa* (blank slate) with little mechanism and no established habits.
  *   **The Embellishment:** Turing never specifies a "British public-school boy." That is your friend's cultural framing. Turing was British, so the analogy of "education" naturally conjures that image for a British audience, but technically he is referring to a generic human child's developmental process. The core concept (start simple, educate later) is faithful to Turing.

  ### 2. "...then drill it in Latin, Euclid, and moral philosophy until the computation produces something indistinguishable from a cultivated gentleman."

  *   **Verdict:** **Overstatement / Conflation.**
  *   **Turing's Actual View:** Turing discusses the "education" of the child machine, but he describes this in terms of **rewards and punishments** and general instruction, not a specific classical curriculum. He suggests the machine needs to be able to understand language (English, in his context) and follow orders.
  *   **The Error:** There is no text where Turing prescribes Latin, Euclid, or moral philosophy as the necessary ingredients for machine intelligence. This sounds more like a humanist interpretation of what constitutes a "gentleman" than a technical requirement for a thinking machine. Turing was focused on the *capacity* to learn, not the specific *content* of the learning. A machine could theoretically pass the Imitation Game without knowing Euclid if it could convincingly fake not knowing it, or if the interrogator didn't ask about it.
  *   **Conflation:** This conflates Turing with a more traditional, humanities-focused view of intelligence (perhaps reminiscent of Matthew Arnold's "culture and anarchy") rather than Turing's functionalist view.

  ### 3. "She said he thought culture was the real engine of intelligence, not algorithms..."

  *   **Verdict:** **False / Fundamental Misunderstanding.**
  *   **Turing's Actual View:** This is the most significant distortion. Turing was a logician and mathematician who founded computer science on the premise that **computation (algorithms)** is the fundamental engine of mental processes. His concept of the Universal Turing Machine demonstrates that specific algorithms can simulate any logical process.
  *   **The Error:** Turing did not believe culture *replaced* algorithms; he believed algorithms *processed* the input from culture/education. In his view, the brain is a machine, and thinking is a computation. While he acknowledged that a machine needs to be "educated" (trained) to be intelligent, the *capability* to be educated rests entirely on the underlying algorithmic structure. To say he prioritized culture over algorithms contradicts his entire life's work on computability.
  *   **Conflation:** This sounds much more like **Ludwig Wittgenstein** (who argued meaning comes from social use/language games) or **Lev Vygotsky** (social development theory) than Turing. Turing was a computational functionalist; he believed the "machine" part was essential.

  ### 4. "...and that once a machine could consistently win the imitation game we ought to grant it the legal status of a student since there's no principled line between learned human habits and trained machine responses."

  *   **Verdict:** **Anachronistic / Unsubstantiated.**
  *   **Turing's Actual View:** Turing proposed the Imitation Game (now the Turing Test) to replace the vague question "Can machines think?" with a behavioral test: "Can a machine do what a thinking human does?" He argued that if a machine behaves indistinguishably from a human, we should concede that it is "thinking" for the sake of the argument.
  *   **The Error:** Turing **never** argued for legal personhood, rights, or "student status." He was interested in the philosophical definition of intelligence, not jurisprudence or ethics. The idea of robot rights is a modern debate (emerging prominently in the 1970s and 2000s with thinkers like Peter Singer, David Gunkel, or the EU's discussions on electronic personhood).
  *   **The Leap:** While one could *derive* an argument for rights from Turing's functionalism (if it acts like a person, treat it like a person), Turing himself did not make that leap. He was cautious and modest, often framing his claims as predictions about what people would *say* about machines in the future, not demands for how the law should treat them.

  ### Summary of the Discrepancy

  Your friend is describing a **Social-Constructivist Turing**, whereas the historical Turing was a **Computational-Functionalist**.

  *   **What she got right:** The "Child Machine" strategy. Turing did argue we should build a simple machine and educate it rather than programming a complex adult mind directly.
  *   **What she stretched:** The specific curriculum (Latin/Euclid) is her own coloring, not his spec.
  *   **What she got wrong:** The idea that culture supersedes algorithms. For Turing, the algorithm *is* the mind; culture is just the data it processes.
  *   **What she invented:** The legal status argument. This is a modern ethical extrapolation projected back onto him.

  **Conclusion:** You are not being pedantic; your friend is engaging in a bit of myth-making. She has taken Turing's "child machine" analogy and filtered it through a modern lens of AI ethics and sociological theory. It is a compelling narrative, but it is not a fair summary of Turing's actual technical or philosophical claims. You can tell her that while Turing definitely wanted to "educate" a machine, he cared far more about the *mechanism of learning* than the *subjects taught*, and he never ventured into legal rights.
