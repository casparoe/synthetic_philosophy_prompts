prompt: |-
  I'm preparing a fifty-minute seminar for second-year philosophy undergraduates on Wittgenstein's notions of language games and family resemblance. Rather than using the familiar illustration of games, I want to build the session around the term boundary — comparing how property lawyers, geographers, and tidal surveyors each determine where something ends — to show how one word operates across disparate practices without a shared essence. The students have recently studied Eleanor Rosch's prototype theory, so they are likely to interpret Wittgenstein through that framework. Do not explain the concepts to me; instead, plan the explanatory arc. Set out the dependency order: what must be secured before family resemblance can be introduced, and why? Specify exactly what the boundary example must possess and what it must lack in order to carry the point without collapsing into vagueness or statistical clustering. Map the misconceptions they will form — I expect they will conflate family resemblance with Rosch's prototypes, assume Wittgenstein denies every shared feature, and reduce language games to mere social contexts — and indicate the precise point in the sequence where each should be headed off. Propose one closing question that reveals whether they have grasped the conceptual structure rather than repeating a formula. Finally, state what should be deliberately left out at this level and openly acknowledged. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Topic:** Wittgenstein's Language Games and Family Resemblance.
      *   **Target Audience:** Second-year Philosophy Undergraduates (UK context implied by "British English" and "second-year").
      *   **Duration:** 50 minutes.
      *   **Key Constraint 1:** Do *not* use the standard "games" example. Use "boundary" (property lawyers, geographers, tidal surveyors).
      *   **Key Constraint 2:** Students know Eleanor Rosch's Prototype Theory. They will likely conflate it with Wittgenstein.
      *   **Task:** Plan the *explanatory arc* (dependency order), not explain the concepts themselves.
      *   **Specific Requirements:**
          *   Set out dependency order (what must be secured before family resemblance).
          *   Specify what the "boundary" example must possess/lack (to avoid vagueness/statistical clustering).
          *   Map misconceptions (Rosch conflation, denial of shared features, language games = social context) and when to head them off.
          *   Propose one closing question (tests conceptual structure, not formula).
          *   State what should be deliberately left out/acknowledged.
      *   **Style:** British English.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Wittgenstein vs. Rosch:* Rosch is cognitive/psychological (how we categorise based on typicality). Wittgenstein is logical/grammatical (how meaning is use, rejecting essentialism). The risk is students thinking Family Resemblance is just "fuzzy prototypes."
      *   *The "Boundary" Example:* Needs to show that "boundary" isn't one thing (essence) but isn't just random (vagueness). It must show *purpose-driven* variation. A legal boundary is normative; a geographical one is descriptive/conventional; a tidal one is dynamic/physical. They overlap but don't share a single defining trait other than their function in a specific practice.
      *   *Language Games:* Must be established *before* Family Resemblance. Family resemblance describes the concepts *within* or *across* games. If they don't get "meaning as use," family resemblance looks like a theory of reference.
      *   *Dependency:* Meaning as Use $\rightarrow$ Language Games (Practices) $\rightarrow$ Critique of Essentialism $\rightarrow$ Family Resemblance (as the alternative description).

  3.  **Drafting the Explanatory Arc (Dependency Order):**
      *   *Step 1: Meaning as Use.* Before talking about boundaries, they need to know *why* we are looking at boundaries. It's not about the world; it's about the word's job.
      *   *Step 2: Language Games (Practices).* The "boundary" examples must be situated in specific activities (selling land, mapping nations, navigating ships).
      *   *Step 3: The Failure of Essentialism.* Show that searching for the "one thing" all boundaries share fails.
      *   *Step 4: Family Resemblance.* Introduce this as the description of how the word holds together *without* that essence.
      *   *Why this order?* If you start with Family Resemblance, it looks like a definition. It must emerge as the solution to a puzzle generated by the Language Game framework.

  4.  **Refining the "Boundary" Example:**
      *   *Must Possess:* Clear rules/criteria within each specific practice (a legal boundary is precise in court, a tidal one is precise in navigation). It must show *rigour* within the game, not sloppiness.
      *   *Must Lack:* A trans-practice common denominator. It cannot be that they all "divide space" in the same sense (a legal division is rights-based, not physical). It must avoid looking like a statistical average (Rosch).
      *   *Risk:* If the boundaries are just "vague," students think Wittgenstein is talking about ambiguity. He isn't. He's talking about *heterogeneity of sense*.

  5.  **Addressing Misconceptions (The Rosch Problem):**
      *   *Misconception 1: Family Resemblance = Prototype Theory.* Rosch says there's a "best example" (robin for bird). Wittgenstein denies there's a best example of a game or boundary.
      *   *Intervention:* When introducing Family Resemblance. Emphasise overlapping criss-crossing, not radial categories.
      *   *Misconception 2: Denial of Shared Features.* Students think Wittgenstein says "nothing is shared." He says "nothing *essential* is shared." Some features might overlap, just not all.
      *   *Intervention:* During the analysis of the boundary examples.
      *   *Misconception 3: Language Games = Social Context.* Students think "game" just means "situation." It means "rule-governed activity with a point."
      *   *Intervention:* At the very beginning, when setting up the three professions.

  6.  **Developing the Closing Question:**
      *   Needs to test if they understand the *structure* (use/practice), not the *label* ("family resemblance").
      *   Idea: Ask them to apply the logic to a new term without using the term "family resemblance."
      *   Better: Ask them to identify what would count as a *misuse* of "boundary" in one game vs another. This tests if they grasp the internal rules vs. the lack of external essence.

  7.  **Determining What to Leave Out:**
      *   Private Language Argument (too complex).
      *   Rule-following paradox (too deep for 50 mins).
      *   Later Wittgenstein vs. Early Wittgenstein (Tractatus) comparisons (distracting).
      *   Acknowledge: That this is a therapeutic method, not a positive theory.

  8.  **Writing in British English:**
      *   Check spelling (categorise, programme, centre, etc.).
      *   Check tone (academic, precise, seminar-focused).

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the distinction between Rosch and Wittgenstein sharp enough?
      *   *Fix:* Explicitly state in the plan that Rosch is empirical/psychological, Wittgenstein is grammatical/logical. Ensure the "boundary" example highlights *rules* rather than *typicality*. A tidal boundary isn't "more typical" than a legal one; it's just different.
      *   *Critique:* Is the timing realistic?
      *   *Fix:* Break down the 50 minutes strictly. 10 mins intro/games, 15 mins boundary analysis, 15 mins family resemblance/Rosch distinction, 10 mins conclusion/question.
      *   *Critique:* Did I answer the "dependency order" prompt specifically?
      *   *Fix:* Create a dedicated section for this.

  10. **Final Polish:** Check against all constraints in the prompt. (No explaining concepts, plan the arc, British English, specific misconceptions, closing question, omissions).

  *(Self-Correction on the Closing Question)*: The prompt asks for a question that reveals whether they grasped the *conceptual structure*. A question like "Is X a family resemblance concept?" is too formulaic. A question like "If a tidal surveyor used a legal boundary definition in court, what went wrong?" tests the "game" aspect. But to test "family resemblance" specifically... How about: "If we found a feature shared by all three boundaries, would that refute Wittgenstein?" This tests the "essentialism" vs "accidental overlap" distinction. Let's go with that.

  *(Refining the Boundary Example)*: I need to make sure the boundary example doesn't just look like polysemy (multiple meanings). Wittgenstein's point is stronger: it's not that "boundary" has 3 meanings; it's that the *concept* is held together by use. I need to ensure the plan emphasises that the *word* is the same, but the *grammar* differs.

  *(Final check on Rosch)*: Rosch is about cognitive economy. Wittgenstein is about philosophical confusion. The plan must highlight that Wittgenstein isn't offering a better theory of categorisation, but dissolving the demand for one.

