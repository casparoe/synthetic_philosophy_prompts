answer: |-
  ### Seminar Plan: Wittgenstein, Boundaries, and the Illusion of Essence
  **Duration:** 50 Minutes
  **Level:** Second-Year Undergraduate
  **Topic:** Language Games and Family Resemblance (via 'Boundary')

  ---

  #### 1. The Dependency Order
  To prevent the session from collapsing into a lecture on semantics or cognitive psychology, the following conceptual dependencies must be secured in strict sequence. You cannot introduce Family Resemblance until the ground has been cleared by Language Games.

  1.  **Meaning as Use (Minutes 0–10):**
      *   **Why first?** If students believe meaning is reference (word $\rightarrow$ object), they will look for the object 'boundary' in the world. You must secure the thesis that meaning is determined by function within an activity.
      *   **Secure this:** The word 'boundary' does not name a single type of entity; it performs a job.

  2.  **The Autonomy of Practices / Language Games (Minutes 10–25):**
      *   **Why second?** Before comparing the uses, students must accept that the criteria for correctness are internal to the practice. A 'correct' boundary for a lawyer is not necessarily 'correct' for a surveyor.
      *   **Secure this:** Rules are not universal; they are constitutive of the specific game. This prevents the reduction of Language Games to mere 'social contexts'.

  3.  **The Failure of Essentialism (Minutes 25–35):**
      *   **Why third?** Only after establishing the distinct games can you demonstrate that searching for a common thread *across* them is a philosophical mistake, not a scientific challenge.
      *   **Secure this:** The demand for a shared essence is what generates the confusion, not the lack of one.

  4.  **Family Resemblance as Description, Not Theory (Minutes 35–45):**
      *   **Why last?** Family Resemblance is the retrospective description of how the word holds together *after* we abandon the search for essence. It is not a competing theory of reference.
      *   **Secure this:** It explains the coherence of the concept without positing a hidden commonality.

  ---

  #### 2. The 'Boundary' Example: Specifications
  To avoid collapsing into vagueness or statistical clustering (Rosch), the illustration of property lawyers, geographers, and tidal surveyors must possess specific traits and lack others.

  **What the Example Must Possess:**
  *   **Internal Rigour:** Each practice must have strict, non-negotiable criteria. A legal boundary is not 'fuzzy'; it is precise within the Land Registry. A tidal boundary is not 'vague'; it is mathematically derived from mean low water. This counters the idea that Wittgenstein is talking about ambiguity.
  *   **Incommensurable Purposes:** The *point* of the boundary must differ fundamentally.
      *   *Lawyer:* Allocation of rights/liability (Normative).
      *   *Geographer:* Political sovereignty/Mapping (Conventional/Representational).
      *   *Surveyor:* Physical navigation/Safety (Empirical/Dynamic).
  *   **Overlapping Utility:** Show how they occasionally intersect (a dispute over coastal land) to demonstrate why we use the *same word*, despite the different grammars.

  **What the Example Must Lack:**
  *   **A 'Core' Case:** Do not suggest one is the 'real' boundary and the others are metaphorical. This invites the Prototype error.
  *   **Statistical Frequency:** Do not imply that the legal definition is the 'most common' and therefore the prototype. Wittgenstein's point is logical, not empirical.
  *   **Physical Commonality:** Avoid defining all three as 'lines in space'. A legal boundary can exist without a physical marker; a tidal boundary moves. If you anchor them all in 'spatial division', you reintroduce the essence you are trying to dismantle.

  ---

  #### 3. Mapping Misconceptions and Interventions
  Students will inevitably attempt to assimilate Wittgenstein into the cognitive framework of Eleanor Rosch. You must head these off at precise junctures.

  **Misconception 1: Language Games = Social Contexts**
  *   **The Error:** Students will treat 'Language Game' as synonymous with 'situation' or 'register' (e.g., formal vs. informal speech).
  *   **Intervention Point:** **Minute 15.** When detailing the three professions.
  *   **Correction:** Emphasise that a Language Game is defined by *rules of correctness* and *objectives*, not merely tone or setting. A mistake in a legal boundary has different consequences than in a survey; this constitutes a different game, not just a different context.

  **Misconception 2: Family Resemblance = Prototype Theory (Rosch)**
  *   **The Error:** Students will assume there is a 'best example' of a boundary (e.g., a garden fence) and other cases are peripheral variations based on similarity scores.
  *   **Intervention Point:** **Minute 35.** Immediately upon introducing 'Family Resemblance'.
  *   **Correction:** Explicitly contrast the structures. Rosch proposes a radial category (centre + periphery). Wittgenstein proposes a criss-cross network (no centre). State clearly: "For Wittgenstein, the legal boundary is not *less* of a boundary than the tidal one. There is no primary case."

  **Misconception 3: Wittgenstein Denies All Shared Features**
  *   **The Error:** Students will argue, "But they all divide something!" assuming this refutes Wittgenstein.
  *   **Intervention Point:** **Minute 40.** During the discussion of 'essence'.
  *   **Correction:** Clarify that Wittgenstein does not deny *accidental* overlaps. He denies that the *meaning* of the word depends on that overlap. The word works even if the shared feature is removed or redefined. The shared feature is not the *ground* of the meaning.

  ---

  #### 4. Closing Question
  Do not ask them to define Family Resemblance. Ask a question that forces them to apply the logical structure of the argument to a new case without using the terminology.

  **The Question:**
  > "If a court case hinged on whether a 'tidal boundary' counted as a 'legal boundary', and the judge ruled that it did not because it moves, would Wittgenstein say the judge made a factual error about the word 'boundary', or a grammatical error about the practice of law? Justify your answer without using the phrase 'family resemblance'."

  **Why this works:**
  *   It tests if they understand that meaning is use within a game (the judge is adhering to the legal game's rules).
  *   It tests if they understand that the lack of shared essence (movement vs. stasis) does not make the word 'boundary' meaningless, but rather shows the limits of stretching the concept across games.
  *   It prevents rote repetition of the 'criss-cross' formula.

  ---

  #### 5. Deliberate Omissions and Acknowledgements
  To maintain focus within fifty minutes, you must explicitly state what is being excluded. This prevents students from feeling the account is incomplete and stops them from importing advanced objections prematurely.

  **Leave Out:**
  *   **The Private Language Argument:** Do not attempt to link this to rule-following or inner states. It complicates the 'public practice' point unnecessarily.
  *   **The *Tractatus* Contrast:** Do not spend time contrasting this with the Picture Theory of meaning. Second-years often get bogged down in historical development rather than the argument at hand.
  *   **Rule-Following Paradox:** Avoid the sceptical problem of how rules determine action. Treat the rules of the 'games' (law, surveying) as given for the sake of the illustration.

  **Openly Acknowledge:**
  *   **Therapeutic vs. Theoretical:** State clearly at the outset: "Wittgenstein is not offering a better theory of meaning than Rosch or Frege; he is offering a therapy to stop us from looking for a theory where none is needed."
  *   **Descriptive, Not Explanatory:** Acknowledge that Family Resemblance describes how language *is*, it does not explain *why* it works that way cognitively. It dissolves the philosophical problem rather than solving it scientifically.
