answer: |-
  Dear Friend,

  It is a pleasure to correspond with someone who sees the geometry of the problem so clearly. You have indeed stumbled upon a well-trodden but notoriously slippery patch of ground in the theory of belief revision. The puzzle you recall about the soldier is widely known as the Judy Benjamin Problem, named after a hypothetical officer in a paper by Bas van Fraassen, and it serves as the standard introduction to the difficulties of updating on conditional information. The broader field you are navigating is called Probability Kinematics, and the specific rule you are applying is a variant of Jeffrey Conditionalization tailored for conditional constraints. What you are observing in your three cases is not a collection of unrelated glitches but rather a single coherent phenomenon known as the non-commutativity of sequential updating, often discussed under the heading of path dependence in belief revision.

  To answer your first question about whether the order-sensitivity, the parcel-sensitivity, and the repeal of the earlier announcement are one phenomenon or several, I would say they are best understood as three symptoms of the same underlying geometric property. When you update your probabilities, you are effectively moving from one point to another in a space of possible distributions. The rule you are using treats each announcement as a force that pushes your current position to satisfy a new constraint while minimizing change to certain other values, specifically the probability of the antecedent. When you have two constraints that overlap, such as the rate of A given B and the rate of B given A, they define two different curves or surfaces in that space. If you move to satisfy the first constraint, you land on the first curve. When you then move to satisfy the second, you slide along the gradient of the second constraint, which inevitably pulls you off the first curve unless the two curves happen to intersect at exactly the point where you landed. Because your rule does not lock the first constraint in place as a permanent boundary but rather uses it as a transient target, the second update drifts away from it. This is why the order matters and why the first announcement is effectively repealed; the path you take through the probability space determines where you end up, and the sequential rule has no memory of the previous constraint once the move is complete.

  Regarding your second question, this is indeed the same fundamental complaint that is made about ordinary uncertain evidence, though it is often more visible in the conditional case. In ordinary Jeffrey Conditionalization, you update on a partition, say setting the probability of E to a new value. If you receive two such announcements about independent partitions, the order does not matter. However, if the partitions overlap or if the evidence constrains ratios rather than masses, as in your case, the updates interfere with one another. The reason it feels more acute here is that conditional constraints link the partitions together explicitly. When you are told the rate of A within B, you are constraining the relationship between the mass of the intersection and the mass of B. When you are later told the rate of B within A, you are constraining the relationship between that same intersection and the mass of A. Since the intersection is the shared pivot, moving the pivot to satisfy one ratio disturbs the other. So while the mechanism is the same as in general probability kinematics, the structure of conditional information makes the conflict inevitable rather than exceptional.

  Your third question, whether this repeal is a defect of the rule or forced by the problem, is the most subtle. It is technically a defect of the sequential rule you are using, but it is a defect that is very hard to avoid if you are forced to process information sequentially without knowing what is coming next. The simultaneous solution you found, where you minimize the distance from your prior subject to both constraints at once, is known as Minimum Cross-Entropy updating or the Method of Minimum Information. This method finds the unique distribution that satisfies all constraints while staying as close as possible to your starting point, and it does not suffer from order dependence or repeal because it treats the constraints as a single joint system. However, that method requires you to hold all the information before moving. If you must update as each bulletin arrives, you are forced to use a sequential rule, and most standard sequential rules will exhibit this non-commutativity when constraints are interdependent. There are theoretical results suggesting that no updating rule can satisfy all desirable properties, such as commutativity and respect for all past constraints, in every possible sequence of information. So while a better rule exists for the simultaneous case, the instability you see in the sequential case is an inherent cost of processing interdependent constraints one at a time.

  If you are looking for a name to hang on this specific behaviour so you can file it away mentally, I would suggest calling it the non-commutativity of sequential probability kinematics on conditional constraints. The boundary cases you asked for are defined by the independence of the constraints. If the two announcements concerned disjoint partitions, or if one was a refinement of the other without overlap, the order would not matter and the repeal would not occur. The order of arrival really ought not to matter only when the constraints are compatible in a way that allows the updating operators to commute, which typically requires the evidence to bear on independent aspects of the probability space. In your case, because A and B are mutually informative and the constraints bind their intersection, the sequential path creates a tension that the rule resolves by sacrificing the earlier constraint. You have not found a flaw in your reasoning, but rather the limit of what can be demanded of a sequential updating rule when the world provides constraints that are tightly coupled. I hope this helps to clear the fog around the problem.

  Yours sincerely,

  A Correspondent
