  Why this has suddenly mattered to me: I took up moth trapping in my garden this spring and I send records to the county recorder, and because most of my IDs are shaky (worn specimens, torchlight, me being mediocre) I started keeping a spreadsheet of my actual confidence instead of just ticking a box. I've ended up with two seperate recipes for folding one shaky sighting into my numbers, and they disagree, and I can't tell whether that's me being sloppy, or whether they're for different jobs, or whether one of them is just wrong. Concretely: before a look I've got four combinations — species A and fresh 0.35, A and worn 0.15, species B and fresh 0.20, B and worn 0.30 (B flies earlier, so by now most B's are worn, that's why the worn split isn't the same inside the two species). Now I get a look at one individual. Recipe one: I decide the look leaves me 70% on A rather than 50%, and then I keep the fresh-to-worn ratio *inside* each species exactly as it was, so I end up at A-fresh 0.49, A-worn 0.21, B-fresh 0.12, B-worn 0.18 — my confidence in "worn" goes from 0.45 to 0.39 purely as a side effect of移动 on species. Recipe two: instead of saying how confident I end up, I score each of the four combinations by how much I'd expect that look in that situation — say 3 for A-fresh, 5 for A-worn (pale, worn A's are exactly what I think I saw), 1 for B-fresh, 2 for B-worn — multiply each cell by its score and rescale so the four still add to one. That gives me roughly 0.40 / 0.29 / 0.08 / 0.23, so P(A) ≈ 0.69 (basically the same as recipe one) but P(worn) ≈ 0.52 instead of 0.39, and the fresh-to-worn ratio *inside* species A has moved, which recipe one flatly does not allow.

  Three things I've noticed and can't place. First, recipe one seems to nail down the within-species split by construction — no matter how good the look was, my confidence in "worn given A" is stuck at its old value, and the look can only tell me about wear by first telling me about species. But worn individuals of both species do look different, and I feel like the sighting told me something about wear in its own right. Is that a known limitation with a name, or am I misusing the recipe? Second, recipe two doesn't care about the absolute size of my scores, only their ratios: 3/5/1/2 and 6/10/2/4 give identical results, so it can't distinguish a one-second glimpse from a long look through the hand lens, while recipe one encodes that in whether I go to 0.55 or 0.70 or 0.90. That feels like a real difference in what the two recipes are *for*, but I can't say exactly what. Third, and this is where I definately don't trust myself: when I feed the spreadsheet two rounds in a row — one look that nudges species, then a better look in daylight that nudges wear — recipe one seems to give me a different final answer depending on which round I do first, whereas recipe two gives the same answer either way. Is that actually right, or is my arithmetic broken?

  So: does the gap between these two recipes have an established name or an established home in the literature, and if it does, which of my three observations is the deep one and which are symptoms? I gather the general area has something to do with evidence that isn't quite evidence, but that's as far as I got. Please don't just hand me a term — I want the carving: what exactly the gap is, what nearby things it is not, where its edges are, and whether a recipe that has both features I want (a strength I can dial, and the ability to move the within-species split) is a coherent thing to ask for. And I'm not after a reading list or citations — I've got no library access from here, so names of papers are useless to me; give me the distinctions themselves. If genuinely nothing established covers it, say so plainly and coin something with a definition and a couple of borderline cases.

