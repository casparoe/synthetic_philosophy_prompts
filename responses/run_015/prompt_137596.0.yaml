  What I think you've bumped into
  You've stumbled onto the difference between updating a marginal hypothesis versus updating a joint hypothesis space. Recipe One treats "Species" as the only thing the evidence touches, forcing "Condition" to ride along passively. Recipe Two treats every combination as a distinct hypothesis that evidence can strike directly. The tension is between structural assumptions (does this look tell me about wear?) versus raw evidential weight (this look fits this specific combination best). You are feeling the friction between imposing a causal model on your data versus letting the likelihoods speak for themselves. It is a conflict between controlling the destination of your belief versus controlling the input mechanism.

  Checking my arithmetic
  Your arithmetic is solid. In Recipe One, you set P(A) to 0.70. Since P(Fresh|A) was 0.35/0.50 = 0.70, the new A-Fresh is 0.70 * 0.70 = 0.49. Total Worn becomes 0.21 (A) + 0.18 (B) = 0.39. In Recipe Two, multiplying priors by scores (3, 5, 1, 2) gives unnormalized weights of 1.05, 0.75, 0.20, 0.60. The sum is 2.60. Dividing through gives P(A) ≈ 0.69 and P(Worn) ≈ 0.52. The divergence is real: a 13 percentage point gap on wear. You haven't messed up the math; you've messed up the model assumptions. Recipe One forces wear to follow species; Recipe Two lets wear follow the evidence.

  Names, if there are any
  Recipe Two is standard Bayesian updating. Your scores are likelihoods: how probable is this look if the moth is actually A-Fresh? Because you score all four cells, you allow the evidence to speak to wear directly. Recipe One is known as Jeffrey's Update. It is used when you cannot specify likelihoods, but you know how your belief in a broader category should shift. It forces the internal ratios to stay put. The literature calls this updating on a partition versus the full space. Recipe One says "I know how much I trust 'A', but I don't know how this look relates to wear." Recipe Two says "I know how this look relates to every specific combination." The gap is between specifying where beliefs land versus how evidence connects to reality. Recipe One handles soft evidence where you know the impact but not the cause. Recipe Two requires hard evidence where you model the cause. This is why Recipe One feels like dialing confidence; you are setting the posterior directly. Recipe Two feels like weighing arguments; you are setting the likelihoods.

  The two divergences
  The deep difference is Observation One: the stuck within-species split. Recipe One hardcodes an assumption that the evidence is irrelevant to wear once species is known. It assumes statistical independence between the evidence and wear, conditional on species. Recipe Two breaks this; it allows the look to be more typical of worn moths regardless of species. This is why your worn probability jumps higher in Recipe Two; your scores favored worn states. Observation Two is about information strength. In Recipe Two, ratios matter because Bayes' theorem works on likelihood ratios. Doubling scores doesn't change the ratio, so it doesn't change the update. This isn't a bug; it means Recipe Two requires you to encode strength in the spread of the scores, not their magnitude. A 10/1 split is strong evidence; a 2/1 split is weak. Recipe One lets you dial strength directly because you are specifying the posterior directly, bypassing the likelihood mechanism. Recipe One controls the destination; Recipe Two controls the vehicle. If your look is distinctly worn-like, Recipe Two captures that signal. Recipe One deletes it. This is why Observation One is the structural flaw in Recipe One for your use case: you admitted the look tells you something about wear, but Recipe One forbids you from recording that insight. It throws away information about condition that isn't mediated by species.

  The order thing
  Your arithmetic is correct here too. Recipe Two is commutative; standard Bayesian updates always are. If you multiply by likelihoods for Look 1, then Look 2, the order of multiplication doesn't change the product. Recipe One is not commutative. If you update Species first, you lock in the wear ratios. If you update Wear first, you lock in species ratios. Doing them in different orders yields different joint distributions. This is a known flaw of Jeffrey's Update called order dependence. It happens because Recipe One discards the likelihood information that would allow the updates to integrate smoothly. It treats each update as a hard reset of constraints rather than accumulating evidence. For a spreadsheet tracking sequential sightings, this is critical. Recipe One will give you different final beliefs depending on which night you process first. Recipe Two guarantees consistency.

  Edges, and a name if there isn't one
  The established names are Bayesian Updating and Jeffrey's Update. The gap is between specifying how evidence relates to hypotheses versus specifying where beliefs should land. You asked for a recipe with both features: dialable strength and moving splits. That is coherent, but it requires converting your confidence dial into likelihood scores. If you want P(A) to go to 0.7, you must choose scores for A-states versus B-states that achieve exactly that shift while allowing wear ratios to move. The edge case is when your intuition about strength conflicts with the likelihood ratios. If you feel 70% confident in A, but the look is physically much more likely for Worn moths, Recipe Two forces you to accept the wear shift. Recipe One lets you ignore it. The danger is self-deception: Recipe One allows you to update Species without admitting the evidence implied something about Wear. To get both features, you must use Recipe Two and learn to tune score spreads to match your confidence intuition. You cannot have the simplicity of Recipe One with the coherence of Recipe Two.

  What to put in the spreadsheet
  Use Recipe Two. It is mathematically robust and order-independent. To handle strength, do not change the absolute numbers; change the contrast. If a look is weak evidence, use scores like 3/3/2/2. If it is strong, use 10/10/1/1. This preserves the ratio information while dialing the impact. If you only know the final confidence, work backward to find scores that produce that result, but accept that the wear ratios will shift if the scores demand it. Do not use Recipe One for sequential updates; the order dependence will corrupt your long-term records. Trust the likelihoods.
