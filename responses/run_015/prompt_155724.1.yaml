      *   *The Centipede Game:* Finite, perfect information, alternating moves. Payoffs increase as the game continues, but at any node, the current player can "take" (end game) for a slightly higher payoff than "pass" (continue) would give them *if* the opponent takes next.
      *   *Backward Induction (BI):* Start at the last node. Player 2 takes (dominant). Knowing this, Player 1 at the second-to-last node takes. And so on, back to the root. Result: Player 1 takes immediately.
      *   *Where CKR works:* BI relies on the assumption that *everyone knows everyone is rational*, and everyone knows that everyone knows, ad infinitum. Specifically, at node $n$, Player $P$ assumes Player $Q$ will maximize utility at $n+1$. This requires $P$ to believe $Q$ is rational. But for $P$ to believe $Q$ is rational at $n+1$, $Q$ must believe $P$ is rational at $n+2$, etc. CKR ensures the chain holds all the way back.
      *   *Ex-ante vs. Ex-post:*
          *   *Ex-ante (Root):* What should I plan to do before the game starts? BI says "Take."
          *   *Ex-post (Intermediate Node):* If we actually *reach* node $k$ (which BI says shouldn't happen), what should I do? This is the crux of the paradox. If rationality implies taking at $k+1$, I should take at $k$. But if we are at $k$, the assumption that led to BI (that players take at earlier nodes) has been falsified by the history of play. This is the "renormalization" problem or the problem of counterfactual consistency.

