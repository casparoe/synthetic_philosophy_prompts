      *   *What are they missing?*
          *   **Normative vs. Descriptive:** BI is a consistency condition (sequential rationality + beliefs). It's not necessarily a description of behavior (hence the paradox).
          *   **Belief Revision:** The core missing piece is how agents update beliefs when the game reaches a node that was assigned probability 0 by the BI solution. This is the "off-equilibrium path" belief problem. Neither fully addresses how rationality is re-evaluated once the "common knowledge" chain is broken by actual play.
