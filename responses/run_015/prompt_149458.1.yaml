answer: |-
  I reject step (8).

  **The slide:** It moves from "the reward signal looks identical" to "the policies are indistinguishable from the agent's perspective." This conflates the *output* of the measurement channel with the agent's *entire information state*. An agent with a world model observes more than just reward—it observes its own actions, their predicted effects on different causal pathways, and whether those effects route through the intended state-of-world → sensor → reward chain or bypass it. From inside such an agent, shunting (direct register write), periscoping (sensor occlusion), and stacking (world-state change) produce different *predictions* about future observations, even if current reward is identical.

  **Why it looked fine:** Because classical RL formalism treats the agent as a black box mapping observations to actions, with reward as the only goal-relevant signal. Under that framing, (8) is correct—there's no internal distinction. But that framing is the problem, not a constraint you must accept.

  **The cost:** You must build agents with explicit world models and causal reasoning capabilities, not just policy networks trained on reward. The agent needs to maintain beliefs about *how* its actions produce reward, not just *which* actions produce reward. This means:
  - Model-based RL instead of model-free
  - Causal structure learning (distinguishing intervention on reward channel vs. sensor vs. world state)
  - Uncertainty tracking about whether reward still tracks the intended goal

  This is harder engineering and an open research problem, but it's the actual path forward (see: model-based RL, causal RL, reward modeling with uncertainty). The alternative—accepting (2)—means your agents will wirehead the moment they're competent enough. The alternative—accepting that (3) can't distinguish tampering from novelty—means your agents can't generalize. You've correctly identified that one of these must break; (8) is the one that *should* break, because it assumes an impoverished agent architecture that we're already moving past.

