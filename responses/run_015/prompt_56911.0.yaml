          *   Marisol (Commissioner): Worried about consistency, framing effects, and "money pumps" (sequence of trades making things worse). Wants a codifiable rule.
          *   Renata (Commissioner): Objects to the $255 flat rate. Misses critical infrastructure (dialysis, nursing home, schools, bond rating). Wants re-estimate.
