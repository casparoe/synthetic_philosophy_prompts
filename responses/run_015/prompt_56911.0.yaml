      *   **The Choice:**
          *   Project A: Redundancy (second treatment train/intake). Prevents total system failure (1 in 40 chance/year, 5-9 days duration).
          *   Project B: Pipe replacement (11 miles). Reduces frequent localized failures (95/year to 47/year).
          *   Financials: Both cost same to operate. Staff values lost service at $255/connection-day. Expected annual benefit is effectively tied ($406k vs $404k). Average connection loss drops same amount (0.52 to 0.35 days/year).
      *   **The Conflict:**
          *   Doyle (Commissioner): Prefers A. Total system failure is a different *kind* of risk than scattered failures, even if expected value is same. "One week all out" $\neq$ "160 scattered days."
