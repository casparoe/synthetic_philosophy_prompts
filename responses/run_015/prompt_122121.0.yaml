answer: |-
  Look, I've lost count of how many comment threads I've typed myself into a corner on this exact issue. You're asking for the holy grail of the moral luck debate: a case of *pure* resultant luck that survives the "evidence" deflation, the "pragmatic blame" deflation, and the "agent-regret" deflation, all while forcing the verdict that the unlucky agent is *objectively more blameworthy*.

  Most people try to smuggle in epistemic asymmetry (the bad outcome reveals hidden negligence) or consequentialist justification (we blame the killer to deter others). You've explicitly blocked those exits. That leaves us with a very narrow corridor. I brainstormed four candidates before settling on the one below.

  **The Candidates:**
  1.  **The Surgeon's Scalpel:** Two surgeons perform identical high-risk procedures. One patient dies due to a random aneurysm; the other lives.
      *   *Why it lost:* It dies to **(i) Outcome-as-evidence**. Even if we stipulate the risk was known, our intuition stubbornly treats death as *prima facie* evidence that the surgeon missed *something* (a tremor, a hesitation). It's too hard to disentangle the outcome from the quality of the agency in a medical context.
  2.  **The Speeding Parent (Nagel's Classic):** Two parents drive recklessly home. One hits a child who darts out; the other doesn't.
      *   *Why it lost:* It dies to **environmental variance**. The risk wasn't truly identical ex-ante because the *conditions* differed (child present vs. absent). The CP defender argues the driver who hit the child was driving too fast *for those conditions*, making their judgment objectively worse at the moment of impact.
  3.  **The Security Guard:** Two guards leave a vault unlocked. One is robbed; the other isn't.
      *   *Why it lost:* It struggles with **(iii) Blame vs. Liability**. It's easy to say the unlucky guard owes more *reparation*, but harder to argue they deserve more *punishment* or resentment if the robbery was purely random. The intuition slides toward "liability" rather than "culpability."
  4.  **The Gravel Truck (The Winner):** Two transport drivers, identical routes, identical trucks. Both violate a strict safety protocol by failing to secure their tarps (binary negligence: tarp secured or not). Both know the statistical risk of debris escape is 1 in 10,000 trips. A random, unpredictable wind gust hits both trucks. Truck A loses gravel; a stone shatters a following car's windshield, killing the driver. Truck B loses nothing.
      *   *Why it won:* The negligence is binary and identical (no subtle judgment calls). The risk is ex-ante quantified. The causal trigger (wind) is truly external. This isolates the *result* as the only variable.

  ***

  ### The Case: The Gravel Truck

  Two long-haul gravel drivers, Mara and Jen, are working the same route on the same day. Company protocol mandates tarps be double-locked; both drivers, rushing to meet identical deadlines, skip the second lock (identical violation, identical mental state of haste). Both know the statistical risk of debris escape on this route is precisely 1 in 10,000 trips, even with the violation. Midway, an unpredictable, localized wind gust hits both trucks with equal force. On Jen's truck, the tarp holds by chance; on Mara's, it fails, ejecting a stone that shatters the windshield of a car behind, killing the driver. No one else ever learns of the violation except the internal safety officer, who reviews both logs simultaneously. There are no policy changes to be made, and no deterrence value in punishing Mara more, as the violation rate is unaffected by sanctions. Yet, the safety officer fires Mara and suspends Jen. Mara accepts the firing as deserved; Jen accepts the suspension as deserved. The dead driver's spouse feels a burning, fitting resentment toward Mara that they do not feel toward Jen.

  ***

  ### The Three Challenges

  **(i) Outcome-as-evidence:**
  Does the death tell us Mara drove worse than Jen? No. We stipulated the violation (unlocked tarp) was identical and the risk (1 in 10,000) was known. The wind gust was unpredictable and equal. The death provides no *new* information about Mara's character, judgment, or choice. She didn't drive faster; she didn't lock the tarp looser. The only difference is the world's response.
  *   *Survival Check:* Pass. The ex-ante epistemic position is locked down.

  **(ii) Forward-looking stuff:**
  Is Mara punished more to deter others? No. The prompt stipulates nobody else finds out and policy won't change. Is it to incapacitate Mara? No, she's no more dangerous than Jen (the risk of recurrence is identical).
  *   *Survival Check:* Pass. The differential treatment cannot be justified by consequences.

  **(iii) The "That's not blame" move:**
  Is the difference just agent-regret or reparative duty? The case includes two markers of *blame*. First, **fitting resentment**: The victim's spouse resents Mara, not Jen. If this were just regret, the spouse's anger would be misplaced (like being angry at a hurricane). If it is *fitting*, it implies Mara is more culpable. Second, **desert**: Mara accepts she *deserves* firing, while Jen accepts she only deserves suspension. This isn't about what they *owe* the victim (reparation); it's about what they *owe* the moral community (sanction).
  *   *Survival Check:* Pass, conditionally. It relies on the intuition that the spouse's resentment is rational.

  ***

  ### CP vs. The "Hook for How It Goes" View

  **The Control Principle (CP) Defender:**
  The CP defender says Mara and Jen are *equally blameworthy*. They exercised the same control, made the same choice, and imposed the same risk. The death is a tragic fact, but it doesn't change the *moral quality of the will*. The CP defender argues the safety officer's decision is unjust (discriminating based on luck), the spouse's resentment is understandable but ultimately irrational (a natural reaction, not a justified one), and Mara's acceptance of greater desert is a form of irrational guilt or excessive scrupulosity. For the CP defender, blameworthiness is fixed at the moment of the choice (the unlocked tarp). Everything after is just history.

  **The Resultant Luck (Anti-CP) Defender:**
  This view (championed by folks like Michael Moore) argues that wrongdoing is *partly constituted* by the harm. Mara didn't just *risk* a life; she *took* one. Jen only risked. The "wrong" in "doing wrong" includes the outcome. Therefore, Mara is more blameworthy because she actually completed a more serious moral violation (homicide vs. endangerment). The blame tracks the *actual moral reality*, not just the *attempted* one.

  ***

  ### The Work-Doing Feature

  The single feature doing the work is **the constitutive link between harm and wrongdoing**.
  *   *If you delete this feature:* If you assume wrongdoing is *only* about the quality of the will or the risk imposed (as CP does), the case collapses immediately. The difference in outcome becomes morally inert.
  *   *What happens if deleted:* Mara and Jen become moral equivalents. The firing becomes an injustice. The spouse's resentment becomes a cognitive error.
  *   *How a CP defender attacks:* They attack the intuition that harm constitutes wrongdoing. They argue that "killing" is not a distinct action from "risking death that happens to succeed." They claim the Anti-CP view conflates *badness* (the world is worse because someone died) with *blameworthiness* (the agent is worse). They will say the spouse's resentment is a biological impulse, not a moral judgment, and Mara's acceptance of firing is merely taking responsibility for *cleanup*, not admitting greater *guilt*.

  ***

  ### Confidence & Defeaters

  **Confidence Level:** 60%.
  I am confident this is the *best possible* case structure, but I am not confident it definitively refutes CP. The reason is that the CP defender has a very strong move on challenge **(iii)**. They can argue that the spouse's resentment and Mara's feeling of desert are *psychological facts* but not *normative facts*. They can say, "Yes, the spouse *feels* more resentment, but they *ought* not to. Yes, Mara *feels* she deserves firing, but she is mistaken."

  **What would change my mind:**
  If you could show that the spouse's resentment is *necessary* for the victim's dignity, or that Mara's greater guilt is required for her moral repair in a way Jen's is not, I would move to 80%. But as long as the CP defender can categorize those reactions as "understandable mistakes" rather than "fitting responses," the difference in blameworthiness remains unproven. The CP is resilient because it locates the moral agent entirely within the sphere of control, and nothing in this case forces the agent's *will* to differ. It only forces the *world* to differ. Whether the world's response changes the agent's moral status is the exact point in contention.

  If I were writing your piece, I'd use this case, but I'd acknowledge that it works only if your reader already accepts that harm is part of the wrong. If they are a pure Kantian about control, this case won't move them. And honestly? After all these years, I'm not sure anything will.
