prompt: |-
  Good's theorem — I.J. Good's result that the expected value of free information can't be negative, since you could always just ignore what you learn — quietly leans on a stack of assumptions that rarely get spelled out: utilities attach to worldly outcomes only, the act set doesn't change when you learn, updating is by conditionalization, the agent has perfect recall, and she acts optimally at whatever decision node she ends up at.

  Give me an example of a conceptual problem for it: a worked two-stage decision problem with actual numbers, where an agent would pay to *not* get free, reliable evidence. Hard constraint — no preference-for-ignorance moves. Utilities have to be over outcomes in the world, not over the agent's beliefs, so the usual "well, she just likes not knowing" diagnosis is off the table. I want a case where the theorem's own premises break, and I suspect it's the "she could always ignore it" step or the perfect-recall/ordering assumption, but tell me if I've got that wrong.

  Then say plainly whether what you've built is a genuine counterexample or just a case the theorem doesn't reach, and which assumption is doing the real work in the standard proof (the convexity-of-max / Jensen step). Be upfront about how confident you are in each of these claims and single out the one step you're least sure of.

  Format: after the prose, drop a JSON object with these fields — "scenario" (2–3 sentences), "payoff_table" (nested object, act → state → utility), "voi_calculation" (the numbers, EV with vs without the info), "premise_that_fails" (one of utility_over_beliefs, act_set_changes, non_conditionalization, no_perfect_recall, suboptimal_later_choice, other), "verdict" (genuine_counterexample or theorem_not_applicable), "confidence" (0–1), "least_sure_point" (one sentence).
