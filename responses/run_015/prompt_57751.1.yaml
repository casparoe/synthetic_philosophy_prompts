          4.  Rational choice at the decision node (maximizing expected utility given posterior).
          5.  **Crucial:** The agent can always choose the action they *would have chosen* without the information. This implies the action space available after receiving information includes the action chosen without information.
          6.  **Crucial:** The information doesn't change the *payoffs* or the *probabilities of states* independently of the agent's belief (i.e., no "evidential decision theory" quirks where observing changes the state).
          7.  **Crucial:** No cost associated with processing the information (free information).
          8.  **Crucial:** The decision problem structure allows the agent to commit or act sequentially without penalty for the *timing* of the decision relative to the state realization, unless the state realization is influenced by the observation.

