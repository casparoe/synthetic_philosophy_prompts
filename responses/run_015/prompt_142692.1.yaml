prompt: |-
  I am giving a paper in six weeks at a closed roundtable on the democratic legitimacy of the European Union, and I would like you to build me a Q&A preparation sheet. The paper is twenty-five minutes, the discussion is forty, and the audience is small enough that I will hear from nearly everyone.

  The audience, in roughly the proportions that matter. Four EU public lawyers: one works specifically on the division of competences, implied powers and the flexibility clause; one works on withdrawal and treaty amendment; two are generalists who will default to institutional-design talk. Two political theorists: one works inside the input-legitimacy versus output-legitimacy framework and is broadly sympathetic to problem-solving accounts on which a union earns its keep by solving problems member states cannot solve alone; the other is a republican or discursive theorist for whom legitimacy requires an identifiable constituent power and genuine, unforced contestation of the basic settlement. One former permanent representative who thinks in terms of Council bargaining, the credibility of commitments, and the integrity of the single market. One analyst from a Central European think tank who worries about a two-speed union and about exit threats being used asymmetrically by the states that can afford them. The chair is a comparative constitutionalist whose instinct will be to redescribe whatever I say as a category mistake.

  Everyone in that room already knows the standard reform menu: empowering the European Parliament, lead-candidate selection for the Commission presidency, transnational lists, a right of legislative initiative, the citizens' panels, the familiar argument that there is no European demos. My paper opens by setting that menu aside as at best incomplete, and I have replies ready for the three predictable objections that the UK's withdrawal proves exit works, that ordinary treaty revision is always available in principle, and that what I am describing is just differentiated integration under another name. Please do not spend the sheet on any of those; I need what survives them.

  Here is the thesis. The deficit is not primarily one of authorization, and it is not cured by shortening the distance between the voter and the decision-maker. It is a structural property of a certain kind of delegation. The Union exhibits what I call delegation asymmetry: inside the field that has been delegated, decisions are taken by qualified majority and are enforced by a court whose doctrines of direct effect and supremacy make them legally binding on national administrations and courts; at the boundary of that field, change requires unanimity plus ratification, which is to say it requires something very close to a political miracle. And the content of the delegated field has come to include a substantive policy orientation, not merely a set of procedures: an open and undistorted competition regime, an independent state-aid and merger control system, a price-stability mandate, free movement and the four freedoms read as directly enforceable rights. That orientation is now insulated from ordinary electoral reversal in the member states.

  From this I derive what I call the reversibility condition: a delegation of sovereign powers is democratically legitimate only if those who delegated them can recover some specified part of them through an ordinary, anticipated, non-existential political process. Article 50 is not such a process, because it is all-or-nothing and therefore unusable against a single policy; a mechanism that can only be operated at the cost of national catastrophe is not a mechanism of ordinary contestation. Treaty revision under Article 48 is not such a process either. So, on my account, the Union fails the reversibility condition, and this failure, rather than the weakness of the European Parliament, is the hard core of what people gestured at when they complained about a democratic deficit.

  The remedy is a competence-return procedure with four moving parts. First, a trigger available to national parliaments as a strengthened successor to the subsidiarity early-warning mechanism, or to a transnational citizens' initiative at a high threshold. Second, a mandatory and public competence audit: what the Union currently does in the field, who gains and who loses if it stops, what the internal-market externalities are, and what it would cost other member states. Third, a decision by reversed majority: the field reverts to the member states unless a supermajority of the Council affirmatively votes to retain it, so that the default is contestation rather than permanence. Fourth, an anti-cherry-picking rule: reverted competences come back to the member states jointly, and re-transferring the same field later requires the full amendment procedure. I also concede up front what I take to be the deepest political obstacle: the ever-closer-union language in Article 1 and in the preamble to the Treaty on European Union makes reversibility conceptually unthinkable, so the procedure requires amending the teleology itself, and I argue in the final section that the Union has to choose between being an ever-closer union and being a reversible one.

  What I want from you is the following.

  Ten or so objections, ordered by how likely they are and how much damage they would do, each attributed to a member of the audience and phrased the way that person would actually phrase it: the competence lawyer talking about implied powers, effet utile and the flexibility clause; the credibility-of-commitments official asking why anyone would ever bind themselves to a single market that can be unbound at will; the republican theorist asking what reversible delegation has to do with constituent power; the Central European analyst asking who in practice will hold the trigger and against whom; the chair asking whether my condition, stated generally, does not condemn independent central banks, constitutional rights, devolution settlements and every other deliberately hard-to-reverse delegation inside the member states themselves.

  For each objection: a two-minute reply in spoken register rather than essay register; a note on what I should concede immediately rather than have dragged out of me; a note on what I must not concede because the argument collapses without it; and one line on where the reply is soft. Ordering matters: I want to know which objection opens the second half of the discussion and which ones only arrive once the lawyers and the theorists start arguing with each other rather than with me, and I would like one bridging line I can use to pull the conversation back from the lawyers' institutional details to the claim about reversibility. I also want an honest assessment of the weakest joint in my own position, distinguishing the one I should volunteer in the talk from the one I should prepare to defend but not advertise.

  Finally, include the objection I should hope nobody asks: the single question that, if it lands, shows the whole apparatus misfires rather than merely needs repair. And where an objection turns on a point of EU law or treaty text, flag that I should verify it rather than asserting the point, so I do not go into the roundtable repeating something I have wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the Request:**

      *   **Context:** Closed roundtable, 6 weeks away. 25-min paper, 40-min discussion. Small audience, high engagement.
      *   **Audience:** 4 EU public lawyers (competences/withdrawal/generalists), 2 political theorists (input/output vs. republican/discursive), 1 former PermRep (Council bargaining/credibility), 1 Central European analyst (two-speed/exit threats), 1 Chair (comparative constitutionalist/category mistakes).
      *   **Paper Thesis:** Democratic deficit is *delegation asymmetry* (easy QMA inside, impossible unanimity outside) + *substantive policy insulation* (market freedoms, etc.). Remedy: *Reversibility Condition* (competence-return procedure). Requires amending "ever-closer union" teleology.
      *   **Constraints:** Do *not* focus on standard reform menu (EP powers, etc.) or the three predictable objections already prepared (Brexit proves exit works, Art 48 available, differentiated integration). Focus on what survives those.
      *   **Deliverables:**
          *   ~10 Objections (ordered by likelihood/damage), attributed to specific audience members, phrased in their voice.
          *   For each: 2-min spoken reply, immediate concession, non-negotiable point, soft spot.
          *   Ordering logic (who opens second half, who fights each other).
          *   Bridging line (lawyers back to reversibility).
          *   Weakest joint assessment (volunteer vs. defend).
          *   The "Kill Question" (hope nobody asks).
          *   Legal verification flags.

  2.  **Deconstruct the Thesis & Audience:**

      *   *Thesis Core:* Legitimacy = Reversibility. Current EU = Irreversible delegation (substantively). Remedy = Competence Return Mechanism (CRM). Obstacle = "Ever-closer union."
      *   *Lawyers:* Will attack legal feasibility, *effet utile*, flexibility clause (Art 352 TFEU), implied powers, supremacy. They care about the *system* working.
      *   *Theorist 1 (Input/Output):* Will ask if this actually helps problem-solving or just creates veto points.
      *   *Theorist 2 (Republican):* Will ask about *constituent power*. Is reversibility enough without a *demos*?
      *   *PermRep:* Will attack *credibility*. Markets hate uncertainty. Commitments must be binding.
      *   *Central European Analyst:* Will ask about *power asymmetry*. Who pulls the trigger? Big states vs. Small states.
      *   *Chair:* Will attack the *category*. Is this a constitutional theory or a policy fix? Is "reversibility" a universal standard?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (PermRep):* Credibility/Commitment. "Why bind yourself if you can unbind?" High damage, very likely.
      *   *Objection 2 (Competence Lawyer):* *Effet Utile* / Flexibility Clause. "You can't contract out of supremacy." High damage, likely.
      *   *Objection 3 (Chair):* Category Mistake / Comparative Const. "Central banks are irreversible too." High damage, likely (opens second half).
      *   *Objection 4 (Republican Theorist):* Constituent Power. "Reversibility isn't legitimacy without a *demos*." Medium damage, theoretical.
      *   *Objection 5 (Central European):* Asymmetric Power. "Germany pulls trigger, Hungary suffers." High damage, political reality.
      *   *Objection 6 (Output Theorist):* Problem Solving. "This creates gridlock." Medium damage.
      *   *Objection 7 (Generalist Lawyer):* Implied Powers. "CJEU will just read around it." Medium damage.
      *   *Objection 8 (Withdrawal Lawyer):* Art 50 vs. CRM. "Why is partial reversal different from exit?" (Need to be careful not to repeat the "Brexit proves exit works" objection the user already has, but focus on the *legal mechanism*). Let's frame it as *legal coherence*.
      *   *Objection 9 (Teleology):* "Ever-closer union" isn't just text, it's the *point*.
      *   *Objection 10 (The Kill Question):* "If reversibility is the standard, does the Eurozone pass?" Or "Is this just a veto mechanism in disguise?" Let's go with the *Veto* angle as the Kill Question, or the *Substance* angle. Actually, the prompt asks for the question that shows the apparatus *misfires*. The best one is: "Doesn't this turn the EU into a mere international organization, destroying the very legal order you rely on to enforce the return?"

      *Refining the Order:*
      1. PermRep (Credibility) - Practical/Political.
      2. Chair (Comparative Const) - Conceptual/Foundational. (Opens second half).
      3. Competence Lawyer (Effet Utile) - Legal Technical.
      4. Central European (Power Asymmetry) - Political Reality.
      5. Republican Theorist (Constituent Power) - Theoretical.
      6. Output Theorist (Gridlock) - Functional.
      7. Generalist Lawyer (Implied Powers) - Legal Technical.
      8. Teleology (Ever-Closer) - Normative.
      9. CJEU Role (Enforcement) - Institutional.
      10. Kill Question.

  4.  **Drafting the Replies:**

      *   *Tone:* Spoken register, concise (2 mins), strategic concessions.
      *   *Strategy:* Acknowledge validity, pivot back to *asymmetry*.
      *   *Concessions:* Admit uncertainty/costs where necessary to build trust.
      *   *Non-negotiables:* The definition of legitimacy (reversibility), the failure of Art 50/48.

  5.  **Addressing Specific Requirements:**

      *   *Bridging Line:* Needs to move from legal weeds back to the core thesis.
      *   *Weakest Joint:* Distinguish volunteer vs. defend.
      *   *Legal Flags:* Mark Art 352, Art 4(3) TEU (sincere cooperation), CJEU case law.

  6.  **Review against Constraints:**

      *   Did I avoid the "standard reform menu"? Yes.
      *   Did I avoid the three pre-prepared objections (Brexit/Art 48/Diff Integration)? Yes, focused on *mechanism* and *theory* instead.
      *   Are the voices distinct? (PermRep = pragmatic, Lawyer = textual, Theorist = normative).
      *   Is the "Kill Question" devastating?

  7.  **Final Polish:**

      *   Check timing (2 mins spoken is approx. 250-300 words).
      *   Ensure the "Soft Spot" is honest.
      *   Make sure the Chair's objection is framed as a "category mistake."
      *   Ensure the Central European concern is about *asymmetry*, not just "two-speed."

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally suggest the user *agrees* with the standard reform menu. The replies must reinforce the *Reversibility Condition*.
      *(Self-Correction on Kill Question)*: The prompt asks for the question that shows the apparatus *misfires*. If the CRM relies on the EU legal order to enforce the return of powers, but the return of powers weakens the EU legal order's supremacy, is it self-defeating? Or, does the "Reversibility Condition" actually describe *Confederation* not *Union*? Let's go with the Confederation/Union distinction. If you have full reversibility, you don't have a Union, you have a Treaty Organization. That attacks the ontological status of the EU.

      *(Refining the Chair's Objection)*: The Chair compares to Independent Central Banks. The reply must distinguish *policy* insulation from *competence* insulation.
      *(Refining the PermRep)*: Focus on *market certainty*.

      *(Legal Flags)*: Art 352 TFEU (Flexibility), Art 4(3) TEU (Sincere Cooperation), *Costa v ENEL* (Supremacy).

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Q&A Preparation Sheet: The Reversibility Condition

  **Context:** 25-min paper, 40-min discussion.
  **Goal:** Defend the *Reversibility Condition* and the *Competence-Return Mechanism (CRM)* against specific audience archetypes.
  **Tone:** Spoken register, strategic, distinct concessions.

  ---

  ## Part 1: The Objections (Ordered by Likelihood and Damage)

  ### 1. The Credibility Challenge (The Former PermRep)
  **Likelihood:** High | **Damage:** High | **Timing:** Early (First 10 mins)
  **The Objection:** "You talk about delegation asymmetry as a defect. I see it as a feature. Investors, partners, and citizens need to know that the Single Market rules won't change because a populist coalition wins an election in one country. If you introduce a mechanism to unbind commitments at will, you destroy the credibility of the commitment. Why would any state sign up for a single market that can be unbound by a parliamentary trigger?"

  **2-Minute Reply:**
  "Two points. First, credibility is not the same as irrevocability. We accept that governments change policies all the time; that's democracy. The problem isn't change, it's the *cost* of change. Currently, the cost is Treaty revision or Article 50 exit. That's too high. My mechanism lowers the cost to a political decision, but it adds friction: the audit, the supermajority to retain. Second, credibility cuts both ways. If citizens feel trapped by a regime they cannot influence, they lose faith in the Union entirely. We saw that with Brexit. A reversible Union is a stable Union because it doesn't force existential crises to resolve policy disputes. I'm trading *legal* certainty for *political* sustainability."

  **Concede Immediately:** Acknowledge that market uncertainty is a real cost. Don't dismiss the economic risk.
  **Do Not Concede:** That credibility requires permanence. Distinguish between *policy* volatility (bad) and *competence* lock-in (illegitimate).
  **Soft Spot:** You haven't quantified the economic risk. If pressed on specific sectors (e.g., automotive supply chains), you have no data.
  **Legal Flag:** Verify if "sincere cooperation" (Art 4(3) TEU) would legally constrain a member state from triggering a return if it damages others.

  ### 2. The Category Mistake (The Chair)
  **Likelihood:** High | **Damage:** High | **Timing:** Opens the Second Half
  **The Objection:** "Your Reversibility Condition, stated generally, condemns almost every modern constitutional settlement. Independent central banks are designed to be insulated from electoral reversal. Constitutional rights are hard to amend. Devolution settlements are meant to be stable. If 'ordinary reversibility' is the test for legitimacy, are the Bank of England, the German Basic Law, and the Scottish Parliament all illegitimate? Or is this a category mistake: confusing a constitutional order with a contractual treaty?"

  **2-Minute Reply:**
  "It's a distinction of kind, not degree. Central banks are insulated on *policy*, not *competence*. Parliament can abolish the Bank of England; it just chooses not to. In the EU, the member states *cannot* abolish the Court's jurisdiction over competition without leaving the Union entirely. That's competence lock-in. My condition applies to the transfer of sovereign authority, not the insulation of specific policy tools within a sovereign order. The EU asks states to transfer the authority to define the boundary of their own power. That is unique. It's not a constitutional order yet, but it's no longer a simple treaty. It sits in a legitimacy valley where it claims constitutional supremacy without constitutional amendability."

  **Concede Immediately:** Admit that all democracies have "sticky" institutions. Don't claim reversibility must be *easy*, just *possible*.
  **Do Not Concede:** That the EU is comparable to a domestic constitutional order. It lacks the *pouvoir constituant* to justify the rigidity.
  **Soft Spot:** The line between "policy insulation" and "competence transfer" is blurrier than you admit (e.g., the ECB's mandate).
  **Legal Flag:** Be careful citing *Pringle* or *Gauweiler* regarding ECB mandate scope.

  ### 3. The *Effet Utile* Attack (The Competence Lawyer)
  **Likelihood:** High | **Damage:** Medium-High | **Timing:** Mid-discussion
  **The Objection:** "You propose a Competence-Return Mechanism. But under current law, once a competence is exercised, the doctrine of *effet utile* and the supremacy of EU law mean national law cannot disapply it. If the CJEU views your 'return' as a violation of the Union's legal integrity, they will strike it down. Are you proposing a Treaty amendment that tells the Court it cannot interpret the Treaty? Because if not, your mechanism is legally void."

  **2-Minute Reply:**
  "I am explicitly proposing a Treaty amendment. I concede the current Court would strike this down under *Costa v ENEL*. That's part of my point: the current legal order is structurally hostile to reversibility. The amendment must do two things: create the procedure and amend the teleology. It must tell the Court that 'ever-closer union' does not mean 'irreversible union.' We can't rely on the Court to police its own limitation. We need a textual command that the Union's authority is contingent on the continued consent of the member states, operationalized through this audit and vote."

  **Concede Immediately:** Under *current* case law, this is impossible. Do not pretend the CJEU would allow this via interpretation.
  **Do Not Concede:** That the Treaty is unamendable. Art 48 exists. The barrier is political, not metaphysical.
  **Soft Spot:** You rely on the CJEU accepting a limitation on its own supremacy doctrine. History suggests they resist this (see *Opinion 2/13*).
  **Legal Flag:** Verify the interaction between Art 352 (Flexibility Clause) and your proposed "anti-cherry-picking" rule.

  ### 4. The Asymmetry Trap (The Central European Analyst)
  **Likelihood:** Medium | **Damage:** High | **Timing:** Mid-discussion
  **The Objection:** "You say national parliaments hold the trigger. In practice, who holds the trigger? Germany or France. If Berlin decides it wants to repatriate labor standards, they trigger the audit. The supermajority vote to retain it fails because smaller states are pressured. Now you have a two-speed Union where the big states opt-out of the rules they imposed on the rest. Doesn't this mechanism formalize a directorate of the large states, making the Union less legitimate for the periphery?"

  **2-Minute Reply:**
  "That is a serious risk, and my 'anti-cherry-picking' rule is designed to mitigate it. Reverted competences return to *all* member states jointly, not just the trigger. If labor standards revert, they revert for everyone. This forces the large states to consider: do I want this policy gone for Hungary and Bulgaria too? It aligns incentives. However, I concede the bargaining power imbalance remains. That's why the 'Competence Audit' must be public and independent, highlighting who loses. It exposes the pressure. But you're right: without strong solidarity mechanisms, reversibility could become a weapon of the strong."

  **Concede Immediately:** Acknowledge that power asymmetries will infect the procedure. Don't claim the mechanism is power-neutral.
  **Do Not Concede:** That the status quo is better for small states. Currently, they have no exit from policies that hurt them except vetoing new ones, which is increasingly rare.
  **Soft Spot:** The "independent audit" body is a black box in your proposal. Who appoints them?
  **Legal Flag:** Check the "Yellow Card" procedure usage history to see if large states already dominate it.

  ### 5. The Constituent Power Critique (The Republican Theorist)
  **Likelihood:** Medium | **Damage:** Medium | **Timing:** Late discussion
  **The Objection:** "You focus on the *exit* of powers. But legitimacy requires an *entry* of power by a constituent people. Reversibility is just a veto mechanism. It allows states to say 'no,' but it doesn't create a 'we.' If the EU lacks a demos, giving states more veto points doesn't make it democratic; it makes it a stronger international organization. What does reversibility have to do with constituent power?"

  **2-Minute Reply:**
  "I'm not trying to solve the 'demos' problem. I'm trying to solve the 'lock-in' problem. You're right that reversibility doesn't create a European people. But legitimacy isn't binary. It's about the terms of association. If I join a club and the rules change such that I can't leave without burning my house down, the association is coercive. Reversibility doesn't create a 'we,' but it ensures the 'we' that exists is voluntary. It treats the Union as a political project that must continuously earn its scope, rather than a historical destiny that absorbs sovereignty by gravity."

  **Concede Immediately:** Admit this does not create a European demos. Don't overclaim.
  **Do Not Concede:** That legitimacy requires a demos *before* it requires non-coercion. Non-coercion is the baseline.
  **Soft Spot:** You are defining legitimacy down to "non-coercion." Some theorists will say that's insufficient for a polity.

  ### 6. The Gridlock Objection (The Output Theorist)
  **Likelihood:** Medium | **Damage:** Medium | **Timing:** Late discussion
  **The Objection:** "I work on problem-solving. The EU exists to solve cross-border problems states can't solve alone. Your mechanism introduces a new veto point. If every policy field is subject to a periodic 'return' trigger, policy stability vanishes. Legislators won't pass laws if they might be undone in five years. You cure the democratic deficit by creating a functional deficit."

  **2-Minute Reply:**
  "The trigger is meant to be high-threshold, not routine. It's for structural shifts, not annual budgets. But your point stands: there is a trade-off. My argument is that the current system has a *different* functional deficit: it produces policies that lack social support and are therefore unenforceable or resisted, like the austerity measures in the South. Legitimacy is a functional asset. If people trust the system can correct itself, they tolerate more integration. I'm arguing that reversibility increases long-term problem-solving capacity by reducing the risk of systemic backlash."

  **Concede Immediately:** Admit short-term legislative efficiency will drop.
  **Do Not Concede:** That efficiency is the only metric of success. Legitimacy is also functional.
  **Soft Spot:** You haven't defined the "high threshold" concretely. Is it 1/3 of parliaments? 50%?

  ### 7. The Implied Powers Dodge (The Generalist Lawyer)
  **Likelihood:** Low | **Damage:** Low | **Timing:** Late discussion
  **The Objection:** "Even if you amend the Treaty, the Court uses implied powers to fill gaps. If you return a competence, but the Union needs to regulate it to protect the Single Market, they'll use Art 352 or internal market clauses to regulate it anyway. You return the shell, they keep the substance."

  **2-Minute Reply:**
  "That's why the 'Competence Audit' must define the externalities. If the Union retains the right to regulate for market integrity, that must be explicit in the return decision. We can't stop judicial interpretation, but we can change the default. Currently, the default is 'Union competence expands.' I want the default to be 'Union competence retracts unless affirmed.' It shifts the burden of justification to the Union institutions."

  **Concede Immediately:** The CJEU is expansive. Statutory text doesn't guarantee judicial restraint.
  **Do Not Concede:** That Treaty text is meaningless. Clearer text constrains the Court at the margins.
  **Soft Spot:** Reliance on the Council supermajority to "affirm retention" assumes the Council is willing to check the Commission/Court.

  ### 8. The Teleology Defense (The Sympathetic Lawyer)
  **Likelihood:** Low | **Damage:** Low | **Timing:** Late discussion
  **The Objection:** "You say we must amend 'ever-closer union.' But that phrase isn't just rhetoric; it's the interpretive key for the whole legal order. If you remove it, do you unravel the supremacy doctrine entirely? Are you proposing a Union or a Free Trade Area?"

  **2-Minute Reply:**
  "I'm proposing a Union that acknowledges its own contingency. 'Ever-closer' implies a directionality that is historically contingent. We can keep the phrase but qualify it: 'ever-closer union among peoples who retain the right to define the scope of that union.' It's not about unraveling supremacy within the delegated field; it's about controlling the boundary of that field."

  **Concede Immediately:** The phrase is legally potent, not just decorative.
  **Do Not Concede:** That the teleology is immutable. Treaties are amended; teleologies evolve.
  **Soft Spot:** You are asking for a conceptual revolution disguised as a textual amendment.

  ### 9. The Enforcement Paradox (The Withdrawal Lawyer)
  **Likelihood:** Low | **Damage:** Medium | **Timing:** Late discussion
  **The Objection:** "Who enforces the return? If the Commission refuses to acknowledge the competence has reverted, who adjudicates? If it's the CJEU, we are back to square one. If it's a new body, you've created a constitutional court above the CJEU."

  **2-Minute Reply:**
  "It must be the CJEU, but applying a new standard of review. The Treaty amendment must mandate that the Court treats the 'Return Decision' as a primary law act that supersedes secondary legislation. It's not a new court; it's a new hierarchy of norms."

  **Concede Immediately:** Enforcement is the weakest link in any constitutional design.
  **Do Not Concede:** That the CJEU is incapable of applying a new mandate. They apply Art 50; they can apply CRM.
  **Soft Spot:** You are assuming the Court will accept a demotion of EU secondary law vis-à-vis a Council decision.

  ### 10. The "Kill Question" (Hope Nobody Asks)
  **Likelihood:** Low | **Damage:** Catastrophic | **Timing:** Anytime
  **The Question:** "If the Reversibility Condition is the test for legitimacy, does the Eurozone pass? Because once you join the Euro, you cannot recover your monetary sovereignty without leaving the Euro or the EU. There is no 'competence return' for the ECB. Is the Eurozone therefore illegitimate on your own terms?"

  **2-Minute Reply:**
  (Prepare for this, but do not volunteer it). "The Eurozone is the hardest case. It highlights the tension I'm describing. On my strict account, the current Euro architecture fails the reversibility condition. That is why I argue for the amendment of the teleology. The Euro needs a fiscal union to be legitimate, or a mechanism to exit the Euro without exiting the EU. I am critiquing the current setup, not endorsing it. The Euro is the exception that proves the rule: without reversibility, you need a deeper political union to justify the lock-in. We have neither."

  **Concede Immediately:** The Euro is currently illegitimate by your standard.
  **Do Not Concede:** That this invalidates your theory. It indicts the Euro design.
  **Soft Spot:** This forces you to call the Euro illegitimate, which is politically explosive and might alienate the room.

  ---

  ## Part 2: Strategic Management

  ### The Bridging Line
  *Use this when the lawyers get bogged down in Article numbers and the theorists start debating "demos."*
  **"We are getting lost in the machinery of how the Union works, and missing the question of why it stays together. The legal details matter, but they rest on a prior political claim: that the Union can hold powers indefinitely without the consent of the governed. Let's return to the Reversibility Condition."**

  ### Ordering the Discussion
  *   **First 10 Mins:** Expect the **PermRep** and **Competence Lawyer**. They will test the practicality and legality. Let them vent.
  *   **Second Half Opener:** The **Chair** will likely intervene here to broaden the scope to constitutional theory. This is your cue to use the Bridging Line.
  *   **Final 10 Mins:** The **Theorists** and **Central European** will clash. The Theorist wants a *demos*; the Analyst wants *security*. Let them argue. You only need to defend the *Reversibility Condition* as the prerequisite for either.

  ### Weakest Joint Assessment
  *   **Volunteer This:** The **Enforcement Paradox**. Acknowledge early that "A mechanism is only as good as its enforcement, and I rely on the CJEU to police its own boundary." This shows humility and disarms the lawyers who want to pounce on it.
  *   **Defend But Don't Advertise:** The **Eurozone Problem**. If asked, answer honestly (see Kill Question). But do not put this in the paper or opening remarks. It distracts from the general theory and invites a specific political fight you don't have time for.

  ### Legal Verification Flags
  *   **Art 352 TFEU (Flexibility Clause):** Ensure your "anti-cherry-picking" rule explicitly blocks the use of 352 to re-claim reverted competences.
  *   **Art 4(3) TEU (Sincere Cooperation):** Verify if a "Competence Return" could be legally challenged as a violation of sincere cooperation by the triggering state.
  *   **CJEU Case Law:** Review *Opinion 2/13* (Accession to ECHR) to understand how the Court reacts to external constraints on its autonomy. Your CRM is an internal constraint, but the logic of "autonomy of EU law" is the barrier.

  ---

  ## Part 3: The "Kill Question" Deep Dive
  **Question:** "If reversibility is the standard, doesn't this reduce the EU to a mere International Organization, destroying the very legal order (supremacy/direct effect) you rely on to enforce the Single Market?"
  **Why it misfires:** It suggests your solution destroys the object you are trying to save.
  **Prepared Reply:** "It changes the *basis* of the legal order from 'historical necessity' to 'continuous consent.' Supremacy remains *within* the delegated field. The change is at the *boundary*. An IO cannot bind its members internally; the EU can. My proposal preserves the internal binding nature but makes the scope of that binding negotiable. It's a Constitutional Union with an exit valve, not an IO."
