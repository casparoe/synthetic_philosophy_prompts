answer: |-
  ### Prep Sheet: Q&A Strategy for *Cavernotettix* Talk

  **The Hardest Pick:**
  **The Phylogeny (2–3 Myr radiation, 11 species).**
  The systematists will identify this immediately: you have one evolutionary event (the origin of the genus) and eleven tips. That is effectively *N*=1 for the origin of the flap. Your "cross-species stasis" test collapses because the species aren't independent data points; they simply haven't had time to diverge. If you treat them as independent replicates of "stasis," you are committing a basic comparative error.
  *Strategy:* Do not defend the independence. Concede it immediately (see "First 2 Slides"). Pivot to the fact that even within that single radiation, ecological variance is high (mating systems, predation, light zones), which *should* have driven divergence if selection were strong.

  **First 2 Slides (Pre-emptive Concessions):**
  1.  **Slide 1 (The Phylogeny):** Explicitly state: "Eleven species, 3 million years. I know this is effectively one evolutionary origin. I am not claiming these are independent tests of the *origin* of the flap. I am claiming they are independent tests of the *maintenance* of the flap across divergent selective regimes."
  2.  **Slide 2 (The Label):** "I am using 'Structural Null' as a methodological heuristic for resource allocation, not as an ontological claim that selection never acted. I am not re-fighting the Spandrels war; I am proposing a triage protocol for field biologists."

  ---

  ### The 8–10 Objections

  **1. The External (Adaptationist)**
  *   **Question:** "You propose a default inference of non-adaptation. Tell me, specifically: what empirical result in this system *would* change your mind? If you found a 15% mating advantage, would you call it adaptation, or just a co-opted spandrel? Where is the line?"
  *   **Answer (2 mins):** "The line is positive evidence of a history of selection shaping the trait *for* its current use. If ablation showed a 15% cost, I would infer current utility. But to call it an adaptation, I'd need to show the trait evolved *because* of that utility. In this case, the female homologue varies with egg-laying substrate, suggesting the male flap is developmentally locked to a female functional module. If I found a fitness cost, I'd call it an exaptation—a by-product currently being used, not a trait built for the job. The Structural Null asks us to prove the 'built for' before we assume it."
  *   **Soft Spot:** You are splitting hairs between exaptation and adaptation. The External knows this distinction is often impossible to prove. He will press you on whether "history of selection" is ever truly knowable. *Concede:* "I agree we rarely have the fossil record to prove history. That's why the null is methodological. We act *as if* it's a by-product until the cost of assuming that is higher than the cost of testing it."

  **2. The Quantitative Geneticist**
  *   **Question:** "This sounds like genetic correlation dressed up in new clothes. If the G-matrix constrains evolution in the direction of least resistance, isn't your 'architectural by-product' just a stable genetic correlation? Why do I need a 'Structural Null' when I have Lande?"
  *   **Answer (2 mins):** "Lande describes the *statistical* constraint; I'm pointing to the *developmental* cause. A G-matrix tells us *that* traits covary. The Structural Null asks *why*. In *Cavernotettix*, the male flap tracks the female ovipositor anchor isometrically. That suggests a shared growth rule, not just a statistical correlation. If we treat it only as a G-matrix constraint, we might try to select on the male flap. If we treat it as architectural, we know selection on the male flap is impossible without breaking the female ovipositor. The Null saves us from chasing ghosts in the selection gradient."
  *   **Soft Spot:** You don't have the G-matrix. You are inferring development from static allometry. She knows this. *Concede:* "I don't have the G-matrix for these species. You're right, statistically this looks like correlation. I'm arguing the developmental mechanism makes that correlation hard to break."

  **3. The Systematist (Lead)**
  *   **Question:** "You've admitted the phylogeny is shallow. If these species aren't independent, your test for stasis has no power. You can't distinguish constraint from simple lack of time. How do you rule out that selection just hasn't had 10 million years to act yet?"
  *   **Answer (2 mins):** "You're right, I can't rule out time. But I can look at the ecological variance. These species differ in predation pressure and mating systems *now*. If the flap were under strong stabilizing selection for function, we should see allometric breaks or size adjustments relative to predators. We see isometry across all ecologies. Lack of time explains the presence of the trait, but it doesn't explain the lack of *modification* in high-risk environments. The constraint is holding the shape constant despite divergent pressures."
  *   **Soft Spot:** This is the weakest statistical point. You are relying on ecological variance to substitute for phylogenetic independence. *Concede:* "It's a weaker test than a deep phylogeny. I'm not claiming this proves constraint definitively, but it makes the adaptationist hypothesis less parsimonious given the ablation data."

  **4. The Evo-Devo Postdoc**
  *   **Question:** "You use the word 'architectural.' Without fate-mapping or expression data, isn't that just a metaphor? You have serial homology and correlation. How do you know it's not just pleiotropy under strong stabilizing selection?"
  *   **Answer (2 mins):** "It is a metaphor without the molecular work, I agree. But 'pleiotropy under stabilizing selection' predicts that if we relax selection, the trait should drift. The ablation study relaxes the functional selection on the flap specifically. It didn't drift or show costs. The 'architectural' claim rests on the serial homology: the male trait is a shadow of the female functional trait. It's cheaper to infer a shared developmental switch than independent stabilizing selection on a functionless male trait."
  *   **Soft Spot:** You have no mechanism. This is the conceptual hole. *Concede:* "I can't distinguish pleiotropy from developmental architecture without gene work. I'm arguing that for a field biologist, the distinction doesn't change the prediction: don't waste time looking for the male flap's function."

  **5. The Philosopher (The Ally)**
  *   **Question:** "Is the Structural Null a claim about the world (ontology) or a rule for our inquiry (epistemology)? If it's epistemic, why should we believe the trait *is* a spandrel? If it's ontological, isn't it just as unfalsifiable as the adaptationism you're criticizing?"
  *   **Answer (2 mins):** "It is purely epistemic. It is a rule for inquiry, like a significance threshold. I am not claiming the trait *cannot* be adaptive. I am claiming that assuming it is adaptive leads to higher Type I errors in our literature. The Structural Null is a wager: it is more costly to the field to pursue false adaptations than to miss a rare true one. It's about error management, not truth."
  *   **Soft Spot:** If you call it epistemic, the External can say "So you admit it might be adaptive?" If you call it ontological, the Philosopher will dismantle your falsifiability. *Concede:* "It's a wager. I'm asking you to bet on constraint first because the payoff for finding a real adaptation is higher if we filter out the noise."

  **6. The External (Follow-up)**
  *   **Question:** "You mention the sister genus lacks the flap. That implies it evolved once. Evolution doesn't produce complex sclerotised structures for no reason. What was the *initial* selective pressure, even if it's functionless now?"
  *   **Answer (2 mins):** "It might have had a function at the origin. The Structural Null applies to the *current* maintenance and the *current* inference. My argument is that even if it was adaptive 3 million years ago, treating it as adaptive *now* misleads our current experiments. We are studying the ruins of a function, not the function itself. We should map the ruins, not pretend people still live there."
  *   **Soft Spot:** This invites a "Just-So Story" about the origin. *Concede:* "I don't know the origin story. I'm arguing we shouldn't let the origin story dictate our current experimental design."

  **7. The Quantitative Geneticist (Follow-up)**
  *   **Question:** "Your ablation power is 15%. Sexual selection can act on effect sizes smaller than that. Are you sure you're not just under-powered to detect the very selection you claim isn't there?"
  *   **Answer (2 mins):** "I am sure I can't detect small effects. But sexual selection usually drives exaggeration, not stasis. If there were sexual selection, even weak, we'd expect allometric breaks or higher variance. We see isometry and low variance. The ablation confirms the functional cost is negligible, but the allometry suggests the trait isn't responding to selection at all. The power limitation is real, but the allometry supports the null."
  *   **Soft Spot:** You are using allometry to back up a non-significant ablation result. That's circular if the allometry is also due to constraint. *Concede:* "The ablation alone isn't definitive. It's the conjunction with the isometry that makes the null robust."

  **8. The Group Head**
  *   **Question:** "Okay. I'm a Monday morning biologist. I have a trait I think is adaptive. You tell me to assume it's not. What do I *do* differently? Do I stop doing selection gradients?"
  *   **Answer (2 mins):** "You change the order of operations. Currently, we measure selection gradients first, then ask about development. The Structural Null says: check the development and phylogeny first. If the trait is a fixed architectural by-product, you save six months of field work on selection gradients. It's not about stopping the work; it's about triaging which traits are worth the expensive field work."
  *   **Soft Spot:** He might think this slows down the "fun" part (field work). *Concede:* "It might feel like extra homework upfront. But it prevents publishing stories about traits that are just developmental noise."

  **9. The Systematist (Follow-up)**
  *   **Question:** "You say taxonomists use the flap as a diagnostic character. If it's invariant and non-functional, isn't it a useless character for phylogeny? It tells us nothing about relationships if it doesn't vary."
  *   **Answer (2 mins):** "It's diagnostic for the *genus*, not the species relationships. It tells us where the radiation started. For the species tree, you're right, it's uninformative. But for defining the evolutionary unit we're studying, it's the boundary marker. It tells us where the architectural constraint began."
  *   **Soft Spot:** Taxonomists hate invariant characters. *Concede:* "For resolving the tips, it's useless. For defining the clade, it's essential."

  **10. The External (The Closer)**
  *   **Question:** "I once studied a trait everyone thought was a spandrel. Turned out it was thermal regulation. If you adopt your Structural Null broadly, do we risk missing the next thermal regulation trait because we stopped looking?"
  *   **Answer (2 mins):** "Yes, we might miss some. But for every thermal regulation trait, there are fifty stories about 'signal enhancement' that turn out to be wrong. The Structural Null accepts false negatives to reduce the flood of false positives. I'd rather miss one thermal trait than publish twenty stories about functionless flaps. The field's credibility is the resource we're conserving."
  *   **Soft Spot:** This is the ethical core. You are admitting you will miss truth. *Concede:* "It is a risk. But the current rate of Type I errors in behavioural ecology is the bigger risk to the field's credibility."

  ---

  ### Critical Strategy Points

  **The Single Reply That Must Land:**
  When the Group Head asks "What does this change on a Monday morning?", do not talk about theory. Talk about **time and money**.
  *   *Phrase:* "It stops us from spending six months measuring selection gradients on traits that are developmentally fixed. It moves the developmental check to the start of the project, not the discussion section."
  *   *Why:* If the Head thinks this is just philosophy, you lose. If he thinks it saves grant money and time, you win.

  **The Question You Hope Nobody Asks:**
  *"Can you show us the developmental mechanism that links the female ovipositor anchor to the male flap?"*
  *   *Why:* You have none. You have correlation and serial homology.
  *   *Prep:* If asked, revert to the "Epistemic Wager" (Philosopher answer). "I don't need the mechanism to justify the null hypothesis, I need it to reject the null. The burden is on the adaptationist to show function, not on me to map the genes to prove lack of function."

  **The Tea-Time Question (Corridor):**
  The External will corner you. He won't ask about stats. He will ask: *"Which of your own traits do you suspect is actually adaptive, despite your own null?"*
  *   *Prep:* Have one ready. Do not say "None." It makes you look dogmatic. Say: "The asymmetry. The flap is always left-bigger. That directionality smells like selection, even if the flap itself doesn't. I'm testing that next." It shows you aren't blind to adaptation, just rigorous about evidence.

  ### Final Note on Tone
