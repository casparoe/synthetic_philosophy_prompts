answer: |-
  ### Part 1: Brainstorming Symmetry-Breaking Stages

  Before settling on the orbital board game, here are three ways to stage the problem physically. I rejected the first two for your specific constraints, but they inform the final design.

  1.  **The Blindfolded Swap:** Two participants stand in the center wearing identical masks. The group assigns them IDs (1 & 2) based on their starting position relative to the door (the "axis"). The lights go out. They swap places. Lights on. Can the group re-identify them?
      *   *Reject:* Too reliant on human idiosyncrasies (height, gait, clothing wrinkles). Fails to model perfect physical indiscernibility.
  2.  **The Card Hand Exchange:** Players hold identical hands of cards. They pass cards to neighbors according to a rule. Can you track a specific card?
      *   *Reject:* Cards have serial numbers or wear patterns. Also, this models permutation better than spatial symmetry/rotation.
  3.  **The Token Board (Selected):** A circular board with two identical tokens. A central pin acts as the axis. An opaque cover hides manipulation.
      *   *Accept:* Allows precise control over symmetry. Eliminates human variables. Visually clear for 7 people around a table. Easily modifiable between rounds (remove pin, rotate board).

  ---

  ### Part 2: Activity Design — "The Symmetry Wager"

  **Setting:** A single large table. You (the facilitator) sit at the head. The 7 participants sit around the remaining sides.
  **Materials:**
  *   **The Board:** A plain white sheet of paper with a perfect circle drawn in the center. No markings on the rim.
  *   **The Axis:** A distinct colored push-pin or coin (used only in Round 1).
  *   **The Spheres:** Two identical casino chips or matte black tokens (must be perfectly smooth, no scratches).
  *   **The Screen:** A folder or cardboard box large enough to cover the board completely.
  *   **Wager Cards:** 7 small slips of paper per person, labeled "A," "B," and "Indeterminate."
  *   **Currency:** 10 poker chips (or paper slips) per participant to start.

  **Goal:** Participants must track the identity of the two spheres across changes in the reference frame. They wager points on their ability to distinguish them.

  #### Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:05 | Setup & Rules**
  *   Place the Board in the center. Place the two tokens opposite each other on the circle (12 o'clock and 6 o'clock).
  *   Distribute 10 wager chips to each participant.
  *   **Rule:** "You are tracking entities, not positions. In each round, I will manipulate the system. You must wager on whether you can identify which token is which after the manipulation. If you claim you can distinguish them, you wager 2 chips. If you claim identity is indeterminate, you wager 0 chips (safe bet). If you wager on distinction and are wrong, you lose the chips. If you wager on distinction and are right, you gain 2 chips."
  *   **Crucial Constraint:** "You cannot use external references (your own body, table scratches, the door). You may only use properties available *within the system*."

  **0:05 – 0:20 | Round 1: The Absolute Frame (Axis Present)**
  *   **State:** Place the distinct Axis pin in the exact center.
  *   **Action:** Tell them: "Token at 12 o'clock is **A**. Token at 6 o'clock is **B**."
  *   **Movement:** Rotate the tokens 90 degrees clockwise along the track *while the axis remains visible*.
  *   **Task:** Participants write down which token is now at 3 o'clock (A or B).
  *   **Resolution:** Reveal. (It is determinate because relation to Axis breaks symmetry).
  *   **Outcome:** Everyone should get this right. They gain confidence. (Collect wagers, payout).
  *   **Pedagogical Hook:** They feel secure because they have an external anchor.

  **0:20 – 0:40 | Round 2: The Relational Frame (Axis Removed)**
  *   **State:** Remove the Axis pin. Only the two tokens remain on the circle. The paper is fresh (no pencil marks).
  *   **Action:** "There is no center. There is only 'opposite'."
  *   **Movement:** Ask the group: "If Token A moves 90 degrees clockwise, what must Token B do to maintain symmetry?" (Answer: Also 90 degrees clockwise).
  *   **Task:** You (Facilitator) move the tokens under the Screen. You maintain the opposition. You stop them.
  *   **Wager:** "I have moved them. Is the token now at the 'East' position the same individual that started at 'North'?"
  *   **Trap:** Without the axis, "North" and "East" are meaningless. They only have "Token 1" and "Token 2" relative to each other.
  *   **Resolution:** Reveal. Tell them: "Actually, I swapped them. Or did I? Since they are identical and moved symmetrically, the state is identical."
  *   **Scoring Twist:** If they wagered on A or B, **they lose points**. Why? Because there was no fact of the matter they could access. If they wagered "Indeterminate," they keep their chips.
  *   **Outcome:** Frustration. They realize relational properties ("is opposite to") are symmetric and don't individuate.

  **0:40 – 1:00 | Round 3: The Global Rotation (No External Frame)**
  *   **State:** Same as Round 2 (no axis).
  *   **Action:** "I am going to rotate the entire universe (the paper) 180 degrees under the screen."
  *   **Movement:** Cover board. Rotate paper 180 degrees. Optionally swap tokens while covered (it makes no difference).
  *   **Task:** "Uncover. Look at the token now at the top position. Is this Sphere A (from the start of Round 3) or Sphere B?"
  *   **Wager:** High stakes. 5 chips.
  *   **Resolution:** Reveal.
  *   **The Kick:** Regardless of what you did under the screen, declare that **any answer claiming distinct identity is incorrect.** Only "Indeterminate" wins.
  *   **Outcome:** Most will have lost points by now. The tension is palpable. They cannot distinguish the state before rotation from the state after rotation.

  **1:00 – 1:30 | Debrief & Mapping**
  *   Tally scores (low score = better metaphysical intuition).
  *   Discuss the rounds (see below).

  ---

  ### Part 3: Rules & Mechanics to Prevent Cheating

  **Predicted Failure 1: Anchoring to Body Position.**
  *   *Risk:* Participants label the token closest to them as "A" and track it based on their own seating.
  *   *Fix:* **The Facilitator controls the Board Orientation.** Before Round 2 and 3, you rotate the paper randomly before covering it. Tell them: "The system has no 'up'. Do not use your seating position." If someone says "The one near me," invalidate their wager immediately.

  **Predicted Failure 2: Visual Imperfections.**
  *   *Risk:* "That chip has a scratch on the left."
  *   *Fix:* Use fresh casino chips or coated tokens. Inspect them together at the start. If a mark is found, replace the token.

  **Predicted Failure 3: Memory of Motion.**
  *   *Risk:* They track the motion continuously with their eyes during the move.
  *   *Fix:* **The Screen Rule.** All manipulation happens under the opaque folder. They only see State T1 and State T2. They never see the trajectory. This forces them to rely on *properties*, not *spatiotemporal continuity*.

  ---

  ### Part 4: The Debrief (Mapping the Game to Metaphysics)

  Do not lecture until the game is over. Then, map their experience to the literature.

  **Round 1 → Absolute Space / Haecceities**
  *   *Discussion:* Why was this easy? You had an external reference (the Axis).
  *   *Metaphysics:* This represents a worldview where space is absolute (Newton) or objects have primitive thisness (Haecceities). Leibniz's Law holds easily because there is always a distinguishing property (e.g., "distance from Axis").

  **Round 2 → Weak Discernibility**
  *   *Discussion:* Why did you lose points when you claimed to know which was which? You knew they were *two* things, but couldn't name them.
  *   *Metaphysics:* Introduce **Weak Discernibility** (Saunders, Muller). They are discernible by an irreflexive relation ("is opposite to"). Sphere A is opposite to Sphere B. But this relation is symmetric. It guarantees numerical distinctness (there are two), but does not provide individual identity (which is which). This saves a version of PII but denies haecceities.

  **Round 3 → Black's Spheres / Global Symmetry**
  *   *Discussion:* Why was rotation undetectable?
  *   *Metaphysics:* This is **Black's Counterexample** (1952). Two spheres in a symmetric universe. If you rotate the universe 180 degrees, is it a different state of affairs?
  *   *The Tension:* If you say "Yes, they swapped," you believe in haecceities (transworld identity without qualitative difference). If you say "No, it's the same state," you accept that identity requires discernibility.
  *   *Leibniz's Law:* If $a$ and $b$ share all properties (including relational ones in a symmetric system), then $a = b$. But we know there are two spheres. Contradiction? Or does PII fail?

  **Limitations (What You Must Supply Verbally)**
  *   **The Modal Argument:** The game is actualist. It shows epistemic indistinguishability. You must verbally bridge this to **Metaphysical Indistinguishability**.
      *   *Say:* "In the game, you couldn't *know* which was which. Black's argument is stronger: there is *no fact of the matter* about which is which, even for God. The game simulates the epistemic limit; the philosophy argues for an ontological limit."
  *   **Possible Worlds:** The game doesn't show a world with *one* sphere vs *two*.
      *   *Say:* "Black argues that if PII were necessary, a universe with two indiscernibles would be impossible. Our game shows such a universe is conceivable. The tension is whether conceivability entails possibility."

  ---

  ### Part 5: Facilitator Notes for Success

  1.  **Be Ruthless on Scoring:** In Round 2 and 3, if a student bets on "A" or "B," take their chips. Say: "On what basis? You admitted the properties were symmetric." This forces them to articulate *why* they feel there is a difference.
  2.  **Manage the "It's Obvious" Crowd:** Some will say, "I just tracked them in my head." Remind them of the Screen Rule. "You didn't see the movement. You are inferring identity from continuity. But if continuity is not a qualitative property, what grounds your inference?"
  3.  **The "Indeterminate" Win:** Make sure the participants who bet "Indeterminate" feel vindicated, not like they opted out. They are the ones who spotted the metaphysical trap.
  4.  **Time Management:** Keep Round 1 moving. It's the control group. Spend the time in Round 3 and the Debrief. If Round 1 runs long, cut the movement complexity.

  **Final Check:**
  *   7 People? Yes, table setup works.
  *   90 Minutes? Yes, timeline fits.
  *   No Lecture initially? Yes, game first.
  *   Twist included? Yes (Orbit/Axis/Rotation).
  *   No Citations? Yes.

  This design forces them to inhabit the epistemic position of an observer in a symmetric universe, making the subsequent reading on PII and Black's spheres feel like a solution to a problem they just personally encountered.
