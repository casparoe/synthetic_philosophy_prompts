answer: |-
  Your hunch is diagnostically sharp, but it stops one layer short of the engine room. You are right that there is a category mismatch in counting criteria (ontological form vs. causal instrument), but if that were *all* it was, the debate would have dissipated into a verbal dispute (*śabda-vivāda*). The fact that it raged for a millennium suggests the counting itself was doing heavy metaphysical and soteriological lifting.

  Here is the diagnosis of the stalemate, why your hunch is half-right, and why no settlement was possible.

  ### 1. The Diagnosis: Framework Incommensurability
  You identified the surface-level friction: **Dignāga counts by cognitive phenomenology** (is there a concept or not?), while **Nyāya/Mīmāṃsā count by causal genealogy** (what instrument produced this?).

  But the deeper reason nobody budged is that *pramāṇa* theory in India is not merely descriptive epistemology; it is **architectural**. The number of *pramāṇas* determines the load-bearing walls of the entire philosophical system.

  *   **For Dignāga (Buddhist):** The goal is to deconstruct reification. Reducing everything to Perception (*pratyakṣa*) and Inference (*anumāna*) maps onto the Two Truths doctrine. Perception accesses the ineffable particular (*svalakṣaṇa*); Inference deals with the constructed universal (*sāmānyalakṣaṇa*). If you admit a third *pramāṇa* like Testimony (*śabda*), you risk ontologically inflating the status of language, granting it access to reality rather than just concepts. For Dignāga, reducing *śabda* to *anumāna* is a safeguard against idolizing words.
  *   **For Mīmāṃsā (Bhāṭṭa):** The goal is to preserve the authority of the Veda. If *śabda* is just *anumāna*, then Vedic statements are only as good as the inference supporting them (e.g., "The speaker is reliable"). This makes Vedic authority contingent on human reasoning. To make the Veda *apauruṣeya* (authorless/impersonal), *śabda* must be a *sui generis* source of knowledge that does not rely on inferring a speaker's intent.
  *   **For Nyāya:** The goal is realistic common sense and theistic proof. They need *śabda* to be distinct (to allow for testimony about God/ethics) but they need *arthāpatti* to be inference (to keep ontology lean).

  **The Stalemate:** You cannot settle the count without dismantling the opponent's soteriology. To accept Dignāga's count is to accept that language cannot reveal ultimate reality. To accept Mīmāṃsā's count is to accept that the Veda is intrinsically valid. They aren't arguing about the furniture; they are arguing about the blueprint of the house.

  ### 2. The *Arthāpatti* Case: Phenomenology vs. Structure
  Your example of the "fat man who doesn't eat by day" is the perfect stress test.

  *   **The Bhāṭṭa Argument:** They argue from the **phenomenology of justification**. When I realize the fat man eats at night, I don't consciously marshal a *hetu* (middle term). The cognition arises from the tension between two known facts (fatness + non-eating by day). To call this inference is to impose a logical structure that isn't present in the lived experience of knowing.
  *   **The Naiyāyika Argument:** They argue from the **structure of warrant**. Whether the agent *notices* the logical steps is irrelevant. The warrant *depends* on the logical relation (vyāpti) between fatness and eating. If that relation didn't hold, the cognition wouldn't arise. Therefore, the causal mechanism *is* inference, regardless of the subjective "feel."

  **Why this doesn't settle:** This is a classic "personal vs. sub-personal" process dispute. The Bhāṭṭa says, "Epistemology must account for how knowledge feels to the knower." The Naiyāyika says, "Epistemology must account for what makes the knowledge valid." Both are asking valid questions, but they define the *explanandum* differently.

  ### 3. Is Something Substantive Riding on It?
  Yes. Your intuition about testimony is the crux.

  **The Reductionism Trap:**
  If *śabda* (testimony) is reduced to *anumāna* (inference), then **trust is always earned, never given.**
  *   **Dignāga/Nyāya (Reductionist):** I believe you only because I infer you are reliable. This leads to a potential regress (how do I know you are reliable? By testimony? No, that's circular. By perception? Hard to verify internal states.).
  *   **Mīmāṃsā (Anti-Reductionist):** Testimony is intrinsically valid (*svataḥ prāmāṇya*). I believe you unless defeated.

  **The Substantive Stake:**
  If the Reductionists are right, then **radical skepticism is the default position.** We must verify every claim.
  If the Anti-Reductionists are right, then **credulity is the default position.** We must accept claims unless defeated.

  This isn't just about counting; it's about the **ethics of belief**. The stalemate persists because neither side can prove their default stance without begging the question. To prove testimony requires inference, you must use testimony to establish the rules of inference (language transmission). To prove testimony is intrinsic, you must assume the intrinsic validity of the texts that say so.

  ### 4. What Would Settle It?
  You ask if a conflict case (*bādhā*) or a rule of individuation would work.

  **Conflict Cases Won't Work:**
  Indian logicians *did* run conflict cases. (e.g., Perception says "The sun moves," Inference says "The earth moves.") They resolve these by ranking *pramāṇas*. But the ranking *presupposes* the count. If you are a Mīmāṃsaka, *Śabda* overrides *Anumāna*. If you are a Buddhist, *Pratyakṣa* overrides *Śabda*. You can't use a conflict to settle the count because the resolution rule depends on the count you've already chosen.

  **Individuation Criteria Won't Work:**
  This is the closest to a solution, but it fails because of **theory-ladenness**.
  *   To ask "What individuates a *pramāṇa*?" is to ask for a meta-epistemology.
  *   Dignāga's meta-epistemology is: "A *pramāṇa* is defined by the ontological status of its object."
  *   Nyāya's meta-epistemology is: "A *pramāṇa* is defined by the uniqueness of its causal operation."
  *   There is no neutral ground to adjudicate which meta-epistemology is correct. Any argument you use (perception? inference?) will be claimed by one side as validating their meta-criteria.

  **The Verdict: Permanent Stalemate (with nuance)**
  The dispute is a **hinge commitment** (to borrow a Wittgensteinian term). It functions as the axis around which the system turns, not a proposition within the system.

  *   **Why it looks like a stalemate:** Because both sides are internally coherent. Dignāga's 2-*pramāṇa* system is elegant and ontologically parsimonious. Nyāya/Mīmāṃsā's 4-to-6 system is pragmatically robust and saves the phenomena of religious/social life.
  *   **The only "settlement":** The historical "settlement" was actually a synthesis in Navya-Nyāya (New Logic), where they absorbed Dignāga's insights about inference (the *vyāpti* relation) while maintaining the 4-*pramāṇa* count. They essentially conceded the *mechanism* of inference to the Buddhists but kept the *count* for social/ontological reasons.

  ### Summary Diagnosis
  Your hunch is fair: they are applying different counting criteria. But it is not *just* a verbal dispute.
  1.  **Counting is Ontology:** To count a *pramāṇa* is to commit to a kind of reality (e.g., does absence (*abhāva*) exist enough to warrant a *pramāṇa*?).
  2.  **Counting is Soteriology:** The count protects the path to liberation (Vedic authority vs. Emptiness).
  3.  **No Neutral Arbiter:** There is no "view from nowhere" to decide if *arthāpatti* feels like inference or acts like inference, because "feeling" and "acting" are weighted differently by the two systems.

  **Recommendation:** Stop looking for the argument that convinces the opponent. Look at the **cost-benefit analysis** of each count.
  *   **Dignāga's Cost:** You lose the ability to ground religious authority non-inferentially. **Benefit:** You avoid ontological inflation and skepticism about language.
  *   **Mīmāṃsā's Cost:** You multiply entities and risk dogmatism. **Benefit:** You save the possibility of ethical/religious knowledge that transcends human reasoning.

  The stalemate exists because both sides correctly identified that the other's "benefit" comes at an unacceptable "cost" to their specific philosophical project. They didn't budge because to budge was to lose the game they were playing.
