      *   *Is it *just* a verbal dispute?* No. That's where the hunch needs nuance. It's not *merely* terminological. The count determines the architecture of the entire philosophical system. Reducing *śabda* (testimony) to *anumāna* (inference) undermines the Veda's authority (crucial for Mīmāṃsā). Reducing *arthāpatti* to *anumāna* changes the nature of logical necessity.
      *   *Substantive Stakes:* Yes. The status of the Veda, the nature of absence (*abhāva*), and the possibility of reductionism in epistemology.

  3.  **Diagnose the Stalemate (Why nobody budged):**
