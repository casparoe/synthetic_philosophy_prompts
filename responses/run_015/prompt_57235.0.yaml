      *   **Systemic Integration:** *Pramāṇas* aren't isolated modules. They support soteriology (liberation). For Mīmāṃsā, *śabda* must be independent to guarantee Vedic authority without human authorship checks. For Buddhists, *śabda* must be reducible to prevent blind faith.
      *   **The "Feel" of Cognition:** The *arthāpatti* case highlights phenomenological vs. structural analysis. Nyāya says "structure exists even if unseen." Bhāṭṭa says "if it doesn't feel like inference, it isn't." This is a deep methodological split.

  4.  **Address the "Substantive Riding on It" Question:**
