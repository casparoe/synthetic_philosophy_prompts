      *   **User's Setup:** Accurately summarizes the Dignāga (2 *pramāṇas*: perception/inference, based on cognition type) vs. Nyāya (4+ *pramāṇas*, based on causal instrument) debate. Highlights *arthāpatti* (postulation) as the key test case (Bhāṭṭa vs. Naiyāyika).
