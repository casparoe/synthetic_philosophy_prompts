      *   Then ask: "Did you lose the *fact* of what it smells like? Or just the *ability* to conjure it?"
      *   This forces the distinction.

      *(Confidence Check)*: First-years love sensory stuff. They hate abstract definitions. This should land at 80% effectiveness if managed well. The 20% failure is the "It's just biology" crowd.

      *(Final Polish)*: Make sure the "Incomplete Spec" objection handling is robust. The instructor needs a script for that.

      *(One more thing)*: The user wants the word "qualia" unsaid until debrief. I will strictly enforce that in the plan.

      *(Payoff)*: "The Golden Ticket." One student gets to leave 2 minutes early next class. High value, zero cost.

