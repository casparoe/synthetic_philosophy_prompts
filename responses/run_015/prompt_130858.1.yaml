      *   Don't just talk about it. Make them *simulate* it.
      *   After tasting, do a 5-minute filler task (distractor). Then ask: "Close your eyes. Re-create the smell in your mind."
      *   Then ask: "Look at the Spec Sheet. Does this help you re-create it?"
