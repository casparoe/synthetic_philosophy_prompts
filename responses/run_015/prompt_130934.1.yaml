answer: |-
  **Seminar Handout: Disaggregating 'Familiarity Breeds Contempt' in Democratic Theory**

  **Introduction**
  The proverb 'familiarity breeds contempt' is rhetorically potent but analytically slippery. In the context of our comparison between sortition, strict term limits, and the career-politician model, your classmate is employing the phrase as a monolithic premise. However, it conceals at least four distinct philosophical claims. To advance the debate, we must separate these claims, evaluate their validity, and determine which institutional remedy (if any) they actually support.

  Below is a menu of the distinct interpretations available to us. Please consider which version your colleague is invoking at any given moment.

  ***

  ### 1. The Psychological Claim: The Corrupting Nature of Power
  **The Thesis:** Prolonged exposure to the privileges of office alters the representative's character, causing them to view constituents with disdain rather than service.
  *   **Classification:** **Defensible Empirical Thesis.** There is substantial literature in social psychology (e.g., the 'power paradox') suggesting that sustained power reduces empathy and increases instrumental reasoning regarding other people.
  *   **Institutional Implication:**
      *   **Supports Term Limits:** If the corruption is a function of *time*, removing the individual after a fixed period prevents the psychological decay from reaching a critical point.
      *   **Supports Sortition:** If the corruption is a function of *professionalisation*, selecting amateurs who do not identify as a political class may inoculate against this specific arrogance.
      *   **Undermines Career Model:** Directly challenges the notion that a 'statesman' improves with age and tenure.
  *   **Note on Corruption vs. Memory:** This claim addresses **moral corruption** of the office-holder. It does not account for the loss of **institutional memory**. A term-limited politician may remain humble but incompetent due to a lack of long-term strategic knowledge.

  ### 2. The Sociological Claim: The Erosion of Democratic Distance
  **The Thesis:** When representatives become too embedded in the machinery of the state, they form a distinct caste separate from the citizenry, leading to mutual alienation.
  *   **Classification:** **Platitude (with caveats).** It is a common observation that professional politicians form a distinct social class. However, it is not self-evident that this *necessarily* breeds contempt; it may simply breed efficiency or specialisation. The 'contempt' arises only if the separation creates conflicting material interests.
  *   **Institutional Implication:**
      *   **Supports Sortition:** Strongly. Sortition ensures the legislature remains a microcosm of the public, preventing the formation of a separate political caste entirely.
      *   **Supports Term Limits:** Weakly. Term limits rotate personnel but do not necessarily prevent the formation of a professional class (e.g., lobbyists, staff, and returning politicians in different roles).
      *   **Undermines Career Model:** Suggests that a permanent political class is inherently oligarchic.
  *   **Note on Corruption vs. Memory:** This focuses on the **structural relationship** between ruler and ruled. It argues that familiarity creates a *social* barrier. However, breaking this barrier via sortition risks severing the transmission of **institutional memory**, as new members lack the networks to navigate the bureaucracy effectively.

  ### 3. The Epistemic Claim: The Arrogance of Expertise
  **The Thesis:** Deep knowledge of legislative procedure and policy leads representatives to dismiss public opinion as ignorant, valuing technical correctness over democratic will.
  *   **Classification:** **Non-Sequitur (in its strong form).** While expertise *can* lead to technocratic arrogance, it is a logical leap to claim that familiarity with a subject *necessarily* breeds contempt for the layperson. Expertise can equally breed a duty of care or pedagogical responsibility.
  *   **Institutional Implication:**
      *   **Supports Sortition:** Strongly, but dangerously. If one accepts this claim, it implies that legislative expertise is a liability. This supports sortition as a way to prioritise 'common sense' over 'technocratic hubris'.
      *   **Supports Term Limits:** Neutrally. Term limits do not prevent the acquisition of expertise during the tenure; they merely cap it.
      *   **Undermines Both:** If taken to the extreme, this claim suggests that *any* learning curve is anti-democratic. This undermines the value of **institutional memory** entirely, suggesting that a legislature should be perpetually novice to remain virtuous.
  *   **Note on Corruption vs. Memory:** This is the most critical point of confusion. Your classmate is conflating **moral corruption** (arrogance) with the **erosion of institutional memory** (loss of expertise). Sortition solves the arrogance problem by removing expertise; term limits attempt to balance the two by allowing short-term expertise without long-term entrenchment.

  ### 4. The Normative Claim: The Virtue of Strangers
  **The Thesis:** A representative *ought* to remain somewhat distant from the electorate to maintain objectivity; conversely, they ought to remain distant from power to maintain humility.
  *   **Classification:** **Contestable Normative Claim.** This is not an empirical observation but a value judgement about what representation should feel like. It relies on a Romantic view of the 'virtuous amateur' versus the 'corrupt professional'.
  *   **Institutional Implication:**
      *   **Supports Sortition:** Ideally. The sortitioned representative is a 'stranger' to the power structure, theoretically preserving humility.
      *   **Supports Term Limits:** Moderately. It enforces a return to private life, reinforcing the norm that office is a temporary service, not a vocation.
      *   **Undermines Career Model:** It rejects the Weberian ideal of 'politics as a vocation' where long-term commitment is a virtue.
  *   **Note on Corruption vs. Memory:** This claim prioritises **moral humility** over **institutional competence**. It explicitly accepts the loss of institutional memory as a worthy price to pay for ensuring the government remains 'of the people' rather than 'over the people'.

  ***

  ### Synthesis: Moral Corruption vs. Institutional Memory

  For the next session, I ask you to focus specifically on the tension highlighted in the notes above. The proverb 'familiarity breeds contempt' is being used to attack two different problems:

  1.  **Moral Corruption:** The idea that the politician becomes a bad person (arrogant, self-serving).
      *   *Remedy:* **Term Limits** are often sufficient here. They remove the individual before the 'rot' sets in.
  2.  **Institutional Memory:** The idea that the legislature loses the capacity to govern effectively because knowledge is lost.
      *   *Remedy:* **Sortition** exacerbates this problem. By design, it resets the knowledge base frequently.

  **Discussion Question:**
  If we accept the Psychological Claim that familiarity breeds moral corruption, does the loss of institutional memory caused by sortition matter? Or is a humble, incompetent legislature preferable to a competent, contemptuous one? Conversely, can strict term limits preserve memory (through staff and bureaucracy) while preventing personal corruption, thereby rendering sortition unnecessary?

  Please come prepared to argue whether 'familiarity' is the cause of the disease, or merely a symptom of a system that rewards entrenchment.
