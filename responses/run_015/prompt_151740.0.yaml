prompt: |-
  I'm a clinical ethics consultant at a hospital whose charter requires that, when requested, continuity questions be assessed through Buddhist anatta rather than Western psychological-identity theories. Our committee—meeting without a Buddhist scholar present, with about thirty minutes per case—must repeatedly decide whether an advance directive or prior consent still binds a patient who has undergone radical cognitive or personality change (advanced dementia, severe traumatic brain injury, long-term psychiatric restructuring).

  Please write a reusable decision procedure my committee can run in order: the observable clinical questions to ask, what counts as sufficient evidence for each, where the procedure stops with "the prior directive binds," where it stops with "it does not bind," and where it must hand off to human judgment because the issue is values, not assessment of aggregate change. Ground the criteria in the five aggregates—form, feeling, perception, mental formations, consciousness—translated into clinical indicators, and include explicit misfire warnings where the procedure will likely yield a counter-intuitive result. State clearly what the procedure cannot do.

  Then apply it to three cases: (1) an Alzheimer's patient who retains bodily habits and emotional warmth but no longer recognizes family or remembers the directive, with family insisting it be honored; (2) a post-TBI patient who remembers signing the directive but now holds opposite values, with intact reasoning, and family asking that it be overridden; (3) a late-stage dementia patient who appears content and shows no suffering, but whose prior directive refused artificial nutrition in precisely this state.

  In one case the procedure should yield an answer that conflicts with the family's preference; flag that conflict and note the residual moral question the procedure cannot settle. Finally, separate what in your framework is a relatively settled interpretation of anatta from what is genuinely contested among Buddhist philosophers and clinical ethicists, and do not present any contested reading as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethics Consultant.
      *   **Context:** Hospital charter requires assessing continuity questions through *Buddhist anatta* (no-self) rather than Western psychological-identity theories.
      *   **Constraint:** Committee meets without a Buddhist scholar, ~30 mins per case.
      *   **Task:** Create a reusable decision procedure (algorithm/flowchart style) based on the Five Aggregates (*skandhas*), translated into clinical indicators.
      *   **Requirements:**
          *   Observable clinical questions.
          *   Evidence standards.
          *   Stop points (Binds/Does Not Bind/Handoff).
          *   Misfire warnings (counter-intuitive results).
          *   Limitations (what it cannot do).
          *   Application to three specific cases.
          *   One case must conflict with family preference (flag this).
          *   Distinguish settled vs. contested interpretations of *anatta*.
      *   **Tone:** Professional, clinical, philosophically rigorous but accessible, ethically sensitive.

  2.  **Deconstruct *Anatta* for Clinical Ethics:**
      *   *Western View:* Personal identity is often based on psychological continuity (memory, personality, narrative). If the "person" changes too much, the prior directive might not bind (Dworkin vs. Dresser debates).
      *   *Buddhist View (*Anatta*):* There is no permanent, unchanging self (*atman*). Identity is a conventional truth (*samvrti-satya*), not an ultimate truth (*paramartha-satya*). Continuity is causal, not substantial.
      *   *The Ethical Twist:* If there is no self, who does the directive bind? Usually, in Buddhist ethics, compassion (*karuna*) and the reduction of suffering (*dukkha*) take precedence over rigid adherence to a "self's" past wishes if the current aggregate configuration is experiencing something different. However, karma and intention (*cetana*) matter.
      *   *The Five Aggregates (*Skandhas*):*
          1.  *Rupa* (Form): Body, physical state.
          2.  *Vedana* (Feeling): Tone of experience (pleasant, unpleasant, neutral).
          3.  *Samjna* (Perception): Recognition, labeling.
          4.  *Samskara* (Mental Formations): Volition, habits, values, personality traits.
          5.  *Vijnana* (Consciousness): Awareness of objects.
      *   *Continuity in Anatta:* Continuity is a stream of causally connected aggregates. If the causal link is severed or radically transformed such that the *intention* (*cetana*) behind the directive cannot ripen without causing significant *dukkha* to the current aggregate cluster, the binding nature weakens.
      *   *Key Tension:* Respecting past *cetana* (intention) vs. alleviating current *dukkha* (suffering) of the present aggregates.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A practical tool for non-scholars.
      *   *Structure:* Step-by-step assessment of aggregates.
      *   *Thresholds:* When does change constitute a "break" in the causal stream sufficient to void the directive?
      *   *Crucial Insight:* In *anatta*, the "patient" is the current cluster of aggregates. The "prior self" is a previous cluster. The directive is a causal impulse from the past cluster. Does it serve the welfare of the current cluster?
      *   *Step 1: Form (Rupa).* Is the biological organism continuous? (Usually yes).
      *   *Step 2: Consciousness/Perception (Vijnana/Samjna).* Is there awareness? Can they perceive care?
      *   *Step 3: Feeling (Vedana).* Is the current state characterized by suffering or contentment?
      *   *Step 4: Mental Formations (Samskara).* Are values/volitions continuous?
      *   *Decision Rule:* If *Vedana* (suffering) is high and *Samskara* (values) are radically discontinuous, the prior directive may not bind. If *Vedana* is neutral/positive and *Samskara* retains some causal link, it might bind.
      *   *Handoff:* When the conflict is between *compassion for the present* vs. *respect for past karma/intention*.

  4.  **Developing the Cases:**
      *   *Case 1 (Alzheimer's):* Retains habits/emotion (*Samskara/Vedana* partially intact), loses memory (*Samjna*). Family wants directive honored (usually means limiting treatment or following specific wishes). *Anatta* view: The current aggregates are experiencing warmth. Disrupting that might cause *dukkha*.
      *   *Case 2 (TBI):* Remembers directive (*Samjna*), but values changed (*Samskara*). Intact reasoning. Family wants override. *Anatta* view: Current *cetana* (volition) is active and opposite. Past *cetana* is old karma. Current *cetana* usually weighs heavier in immediate ethics.
      *   *Case 3 (Late Dementia/Feeding):* Content (*Vedana* positive), prior directive refused feeding. Family likely wants to feed (comfort) or stop (honor directive). Let's make the family want to *feed* (comfort) but directive says *stop*. Or directive says *stop* and family wants to *honor it*. The prompt asks for one case to conflict with family preference.
      *   *Selection:* Case 3 is the classic "then-self vs. now-self" dilemma. Let's say the directive refuses feeding. The patient is content. Family wants to honor the directive (stop feeding). *Anatta* analysis: Stopping feeding causes *dukkha* (starvation/discomfort) to the current aggregates who are content. The "self" who wrote the directive is gone. *Result:* Do not honor directive (feed). This conflicts with family's wish to honor the "person's" autonomy.

  5.  **Refining the *Anatta* Interpretation (Settled vs. Contested):**
      *   *Settled:* No permanent self. Aggregates are impermanent. Suffering is the primary ethical metric.
      *   *Contested:* How much weight to give past *karma/intention* vs. present *dukkha*? Does conventional truth (*samvrti*) grant enough authority to advance directives to maintain social order? Some say honor the directive to maintain trust (conventional truth); others say relieve present suffering (ultimate truth/compassion). I must clarify this distinction.

  6.  **Writing the Procedure (Iterative refinement):**
      *   Need to make sure it doesn't sound like "Western Identity Theory" in disguise. Avoid "Is he the same person?" Ask "Is the causal stream of suffering/intention continuous?"
      *   *Stop Condition 1 (Binds):* Strong causal continuity of intention + honoring it prevents future suffering/aligns with current subtle volition.
      *   *Stop Condition 2 (Does Not Bind):* Radical discontinuity in values + honoring it causes present suffering to current aggregates.
      *   *Handoff:* When present suffering is ambiguous or when social/conventional obligations (trust in medical system) outweigh individual aggregate welfare.

  7.  **Addressing the "Misfire Warnings":**
      *   *Anatta* can lead to "The patient is nobody, so nothing matters." (Nihilism warning).
      *   *Anatta* can lead to "Only present pleasure matters." (Hedonism warning).
      *   Need to emphasize *Karma* (intention) still has weight, just not absolute authority over a non-existent self.

  8.  **Final Review against Constraints:**
      *   30 mins/case? Keep it checklist-style.
      *   No scholar present? Use clinical terms.
      *   Three cases applied? Yes.
      *   Conflict flagged? Yes (Case 3).
      *   Settled vs. Contested? Yes, in a dedicated section.

  9.  **Drafting the Content (Mental Check of Case 3):**
      *   Case 3: Late-stage dementia, content, prior directive refused artificial nutrition.
      *   Family: "He said he wouldn't want to live like this. Honor the directive." (Stop feeding).
      *   Procedure Output: The current aggregates are content (*Vedana* is not suffering). Starvation introduces *dukkha*. The prior *Samskara* (values) is disconnected from current *Samskara*.
      *   Decision: Provide nutrition (Directive does not bind).
      *   Conflict: Family wants to honor autonomy/past self. Procedure prioritizes current *dukkha* reduction.
      *   Residual Moral Question: Does societal trust in advance directives (Conventional Truth) outweigh the immediate relief of suffering for a being without self-nature?

  10. **Final Polish:** Ensure tone is respectful of Buddhist philosophy without appropriating it superficially. Ensure clinical utility. (Self-Correction: Make sure not to claim *anatta* dictates one specific outcome universally, but rather provides a *framework* for weighing the aggregates).

  *(Self-Correction during drafting)*: I need to be careful not to present *anatta* as simply "presentism." Past intentions (*cetana*) create karmic ripples. Ignoring them completely is bad karma for the clinicians/family. The procedure must weigh *past cetana* against *present dukkha*.

  *Revised Procedure Logic:*
  1. Assess Current *Dukkha* (Vedana).
  2. Assess Continuity of *Cetana* (Samskara).
  3. Weigh: Does enforcing past *Cetana* create new *Dukkha*?
  4. If Yes + Discontinuity is high -> Directive loosens.
  5. If No + Continuity is high -> Directive holds.

