      *   *Haidt's Actual View:* Haidt is a moral pluralist and intuitionist. He argues reason is the servant of intuition. He doesn't necessarily argue for hard anti-realism, but often leans towards pragmatic pluralism. The *group* is interpreting him as an anti-realist via the analogy.

  3.  **Drafting the Correspondence Table:**
