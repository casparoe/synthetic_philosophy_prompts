  7.  **Refining the Output:**
      *   Ensure the tone is respectful but rigorous.
      *   Make sure the distinction between Haidt's actual claims and the reading group's interpretation is clear. (Haidt is more nuanced; the group is reductionist).
      *   Check against the "Software Engineer" persona: Use terms like "hardware," "software," "stack trace," "latency," "input/output."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer all 5 questions? Yes.
      *   *Check:* Is the table clear? Yes.
      *   *Check:* Did I distinguish cosmetic vs. consequential breaks? Yes.
      *   *Check:* Is the final verdict plain? Yes.
