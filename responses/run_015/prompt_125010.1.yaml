  Activity Design

  Split the cohort into four triads (12 students); the remaining two act as 'Overseers' holding the master code. Each triad receives a sealed packet containing role cards. The 'Proxy' reads scripted AI responses from a deck; the 'Partner' invests reputation points based on trust; the 'Insider' knows the outputs are predetermined by a rigid algorithm hidden in the envelope. For 40 minutes, Partners negotiate cooperation with Proxies to maximise group reputation. The Insider watches silently, burdened by the secret. At minute 45, Overseers announce the 'Determinism Leak': the Proxy's choices were mathematically fixed from the start. Partners must immediately decide whether to reclaim points (punishment) or award bonuses (gratitude). The Insider must argue for the objective stance; the Partner argues from lived experience. Reputation points convert to seminar credit only if the group agrees on a justification statement. This forces a collision between felt betrayal and intellectual understanding of causality before any theory is named. Ensure the Proxy scripts include apparent moral choices—lying, sacrificing, promising—to prime emotional investment. The twist relies on the Partner feeling cheated *after* investing trust, mirroring the reactive attitude collapse. A 15-minute buffer allows for group reshuffling if dynamics stall. The goal is visceral confusion, not immediate resolution. Students must not discuss the secret seperately.

  Debrief and Mapping

  Bring the room together. Ask Partners: "Did you feel angry when the leak was revealed?" Ask Insiders: "Did you feel detached?" Map the Partner's anger to Strawson's 'reactive attitudes'—specifically resentment and indignation. These are natural responses to perceived goodwill or ill-will. Map the Insider's knowledge to the 'objective attitude'—viewing the agent as a mechanism to be managed rather than a person to be engaged. The critical moment is the reveal. Before it, responsibility felt real; after, it felt like a category error. Use this to question whether moral responsibility requires libertarian free will. If the Partner still feels angry despite knowing the algorithm, does that validate Strawson's claim that reactive attitudes are ineradicable? Or does the Insider's detachment show that determinism *does* dissolve responsibility? The debate should centre on whether the objective attitude is sustainable in practice. Most will find they cannot maintain the objective stance towards the Proxy once the game ends, suggesting our natural stance is participatory. This bridges the gap between metaphysical freedom and interpersonal practice without needing complex terminology upfront. Press them on the emotional residue.

  Limits and Honest Gaps

  Be frank. This simulation cannot reproduce the natural, pervasive quality of reactive attitudes in ordinary human life. You cannot genuinely resent a classmate reading a script; the stakes are too low. The 'anger' will likely be performative or intellectualised. Furthermore, the reveal is abrupt, whereas in real life, determinism is a background hum, not a switch. Predictably, students will laugh at the reveal, breaking the tension. Some Proxies might ad-lib, ruining the determinism constraint. Enforce strict script adherence; remind them that the *friction* is the data point. If they laugh, ask why laughter is their defence mechanism against the uncanny valley of responsibility. The activity isolates the *concept* of the tension but lacks the emotional weight of real betrayal. It simulates the structure of Strawson's argument, not the phenomenom. Accept that some groups will treat it as a trivial game; use their indifference as evidence for the objective attitude taking hold too easily.

  Settled vs Contested

  Distinguish consensus from dispute. It is broadly agreed that reactive attitudes are central to our moral practices and that Strawson successfully shifted focus from metaphysics to interpersonal relationships. Most accept that we do not abandon these attitudes even if determinism is true. However, it is genuinely disputed whether this shift *solves* the problem of responsibility or merely changes the subject. Compatibilists argue Strawson shows free will is compatible with determinism; incompatibilists argue he ignores the 'basic desert' required for true responsibility. Another contested point is whether the objective attitude is ever fully possible towards humans, or if it is merely a temporary suspension of engagement. Do not present Strawson's view as the final word; present it as a pivotal move that remains challenged by those insisting on ultimate responsibility. The activity supports the relational view but cannot settle the metaphysical dispute. Keep this distinction clear.
