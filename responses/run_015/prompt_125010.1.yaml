prompt: |-
  i’m running a 90-minute philosophy seminar with about 14 postgrad students and i want an in-class game or structured role-play that makes them actually feel the tension in Strawson-style reactive attitudes, but i don’t want the usual lecture-then-discuss format where everyone already knows the vocabulary. please inject a slightly niche twist: the activty should revolve around a scenario where small groups must adopt reactive stances — resentment, gratitude, indignation — toward an artificial agent that has passed an extended interaction test, but then, midway through, a hidden deterministic algorithm is revealed that explains every “choice” the agent made. the point is that participants should experience the pull of holding the agent responsable and the simultaneous collapse into an objective attitude before anyone names either concept.

  design the full thing: split the 14 students into triads with hidden roles (one knows about the algorithm, one acts as the agent’s proxy, one is an observer with token stakes), use only reputation points rather than real money, and lay out rules, materials, and a minute-by-minute timeline for the session. then include a debrief that maps specific moments onto the participant/objective attitude distinction and onto whether moral responsibility needs libertarian free will or just the right relational stance. be frank about which feature of the view the activty can’t reproduce — probably the natural, pervasive quality of reactive attitudes in ordinary human life — and say what will predictably go wrong the first time i run it and how to handle it. please write in british english, with these sections in order: “Activity Design” (around 250 words), “Debrief and Mapping” (around 200 words), “Limits and Honest Gaps” (around 150 words), and “Settled vs Contested” (around 150 words). in that last section, separate what is broadly agreed in the literature from what is genuinely disputed, and don’t present a contested view as consensus. don’t include a bibliography, citation list, or reading recommendations — i need something a model without web access could actually produce. include a typo or two if it feels natural.
