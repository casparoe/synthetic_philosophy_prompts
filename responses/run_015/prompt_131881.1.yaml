  # The Vagueness & Substrate Decision Tree
  **Seminar Handout: Beyond the Heap**

  **Instructions:** Start at the top. Answer based on your intuition about the specific case provided. Follow the arrows to your philosophical "address."

  ---

  ### 🟢 START: The Human Replacement Case
  *Imagine we replace every neuron in a human brain with a functionally identical silicon chip over ten years. At the end, the behavior is identical.*

  **Q1: Is there a precise millisecond during this process where consciousness stops being present?**
  *   **(A) Yes:** There is a fact of the matter, even if we can't detect it. *(Go to Q2)*
  *   **(B) No:** The boundary is genuinely fuzzy; there is no single moment. *(Go to Q3)*

  ---

  ### 🔵 PATH A: The Sharp Boundary (Epistemic Leanings)

  **Q2: Is the *exact location* of that millisecond unknowable in principle?**
  *   **(A) Yes:** There is a line, but we cannot know where it is. *(Go to Q4)*
  *   **(B) No:** In principle, the exact line could be known. *(Go to Q4)*

  ---

  ### 🟠 PATH B: The Fuzzy Boundary (Non-Epistemic Leanings)

  **Q3: How does the truth value behave in the middle of the transition?**
  *   **(A) Partial Truth:** Statements are neither fully true nor fully false, but somewhere in between (0 to 1). *(Go to Q4)*
  *   **(B) Truth Gaps/Context:** Statements are undefined, or depend entirely on how we use the word "conscious." *(Go to Q4)*

  ---

  ### 🤖 FINAL FILTER: The Artificial Mind Test
  *Now, imagine running the same replacement process on a purely digital AI (no biology to start with). Does your previous analysis still apply?*

  **Q4: Does the vagueness (or hidden sharpness) survive in the AI case?**
  *   **(A) Yes:** Vagueness is about functional organization, not biology.
  *   **(B) No:** Vagueness (or the sharp boundary) is tied to biological natural kinds; engineered minds are different.

  ---

  ### 🍃 THE LEAVES: Where You Land

  #### 1. The Universal Epistemicist
  *(Path A → Q2 Yes → Q4 Yes)*
  **Position:** There is always a sharp line, even for AI, but we can never know where it is.
  **Diagnosis:** Standard Epistemicism (e.g., Williamson). Vagueness is purely a limitation of human knowledge, not reality.

  #### 2. The Biological Epistemicist
  *(Path A → Q2 Yes → Q4 No)*
  **Position:** Humans have a hidden sharp boundary, but AI minds do not (or vice versa).
  **Diagnosis:** **Biological Naturalism.** You believe vagueness (or the hidden precision) is a property of living tissue, not functional computation.

  #### 3. The "God's Eye" Realist [⚠️ UNOCCUPIED]
  *(Path A → Q2 No → Q4 Yes)*
  **Position:** There is a sharp line, we could theoretically know it, and it applies to AI too.
  **Diagnosis:** **Incoherent/Unstable.** If the boundary were knowable, the case wouldn't generate vagueness intuitions. This view collapses into precise physicalism without accounting for the semantic puzzle.

  #### 4. The Biological Realist [⚠️ UNOCCUPIED]
  *(Path A → Q2 No → Q4 No)*
  **Position:** Humans have a knowable sharp line; AI does not.
  **Diagnosis:** **Double Incoherence.** Combines the instability of Leaf 3 with a substrate distinction that lacks motivation. Merely unexplored because it is theoretically "ugly."

  #### 5. The Universal Fuzzy Functionalist
  *(Path B → Q3 Partial → Q4 Yes)*
  **Position:** Consciousness comes in degrees for both humans and AI.
  **Diagnosis:** **Degree Theory (Fuzzy Logic).** Truth is scalar. Vagueness survives in engineered cognition because it is a feature of complex functional gradients.

  #### 6. The Biological Gradualist
  *(Path B → Q3 Partial → Q4 No)*
  **Position:** Humans fade by degrees; AI switches on/off (or vice versa).
  **Diagnosis:** **Substrate-Dependent Degree Theory.** A niche view. Suggests biology allows for "partial existence" in a way digital code does not.

  #### 7. The Semantic Contextualist
  *(Path B → Q3 Gaps → Q4 Yes)*
  **Position:** The boundary is unsettled because our language rules don't cover the edge cases, for both humans and AI.
  **Diagnosis:** **Contextualism / Supervaluationism.** Vagueness is a feature of our representation, not the world. Since we use the same words for AI and humans, the vagueness persists.

  #### 8. The Ontic Biological Vaguenist
  *(Path B → Q3 Gaps → Q4 No)*
  **Position:** The world itself is fuzzy for humans, but precise for AI.
  **Diagnosis:** **Ontic Vagueness (Restricted).** A rare slot. Claims reality itself is indeterminate for natural kinds but determinate for engineered artifacts.

  ---

  ### 🚩 FLAGGED PAIRS & LIMITATIONS

  **1. Contextualism vs. Supervaluationism (Leaf 7)**
  This tree cannot cleanly separate these two. Both land on "Undefined Truth" + "Language/Representation." To separate them, you need a follow-up question about *precisification*: "Can we make the term precise without changing its meaning?" (Supervaluationists say yes; Contextualists say the meaning shifts).

  **2. Biological Epistemicism vs. Biological Gradualist (Leaf 2 vs. Leaf 6)**
  Both claim a difference between Human and AI. The difference is whether the Human side is *Sharp but Unknown* (Leaf 2) or *Genuinely Fuzzy* (Leaf 6). In practice, these are hard to distinguish empirically, as both admit we cannot locate the boundary in the biological case.

  **3. The Empty Slots (Leaves 3 & 4)**
  These positions are flagged as **Unstable**. They deny Higher-Order Vagueness (the vagueness of the boundary itself). Most philosophers argue that if there were a knowable sharp line, the "vagueness" would vanish entirely. These slots are included to show where the tree *breaks* rather than where a theory lives.

  ### 🎓 SEMINAR DISCUSSION PROMPT
  *Look at Leaf 5 (Universal Fuzzy) and Leaf 8 (Ontic Biological). If we build an AI that claims to feel "sort of conscious," does Leaf 8 force us to say it is lying, while Leaf 5 allows it to be telling the truth? What does that imply about the ethics of AI rights?*
