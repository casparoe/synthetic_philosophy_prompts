prompt: |-
  I'm building a reading list on populism and I keep hitting the same wall: everyone invokes "the will of the people" as if it's a thing you can point at, but I can't tell what a theory of it would actually have to deliver. So before I read more populism, can you write the desiderata? I want the full spec of what an adequate theory of the will of the people has to be able to do. Fix the purpose first -- I'll say its good enough for me to decide, case by case, when a populist's claim that "the people have spoken" is actually true rather than a rhetorical move. Give me the requirements list: the cases it has to get right (a law passed by a 51% majority on a procedural technicality, a referendum where most of the electorate stayed home, a "will" that flips between two referendums a year apart), the distinctions it can't collapse (will vs. interest, the peoples will vs. the sum of each person's will, a temporary mood vs. something that binds over time), and the results from social choice theory it has to sit with (Condorcet's cycle, Arrow's theorem) -- and for each requirement, the case or consideration that makes it a requirement and not just a preference of one camp. Then tell me which of the things people usually demand of these theories are genuine desiderata and which are just a camp's prejudice, flag any pair you suspect can't be jointly satisfied, and take a definite line: which single requirement knocks out the most popular theories, and is there a subset of the list that's jointly unsatisfiable -- if so, that's the result I most want to see, don't just lay out the options. A table is fine. Then, briefly, how Rousseau's general will, Schumpeter's view of democracy as competition for office, and a plain preference-aggregation theory do against the list -- keep it short, the criteria are the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Theory of "the will of the people" (specifically in the context of populism).
      *   **Goal:** Provide a list of *desiderata* (requirements) for an adequate theory.
      *   **Purpose:** To enable the user to decide, case-by-case, if a populist claim ("the people have spoken") is true or just rhetoric.
      *   **Specific Requirements:**
          *   Fix the purpose first.
          *   List requirements (cases to get right, distinctions to maintain, social choice constraints).
          *   Explain *why* each is a requirement (not just a preference).
          *   Distinguish genuine desiderata from camp prejudices.
          *   Identify impossibility results (jointly unsatisfiable subsets).
          *   Take a definite line on which requirement knocks out the most popular theories.
          *   Evaluate Rousseau, Schumpeter, and Preference-Aggregation against the list (briefly).
          *   Format: Table is fine for the list.
      *   **Tone:** Analytical, rigorous, decisive (don't just lay out options, take a stand on impossibility).

  2.  **Deconstruct the Core Problem:**
      *   Populism relies on the claim of a unified, moral "people" whose will is being thwarted by elites.
      *   Democratic theory struggles to define "the will of the people" because of aggregation problems (Arrow), instability (cycles), and the difference between *will* (volition) and *interest* (welfare).
      *   The user wants a "spec" to test claims. This implies a normative + descriptive hybrid. It needs to be robust enough to filter out cheap rhetoric but realistic enough to acknowledge mathematical limits.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Purpose:* Adjudicate validity of populist claims.
      *   *Requirement 1: Stability/Consistency.* (The Brexit flip-flop problem). If the will changes without new information, it's mood, not will.
      *   *Requirement 2: Distinction from Aggregated Preferences.* (The 51% technicality problem). A slim majority on a low-salience issue isn't "the People's Will."
      *   *Requirement 3: Distinction from Objective Interest.* (The "they don't know what's good for them" problem). Populists claim to know the will, not necessarily the best outcome. The theory must respect agency.
      *   *Requirement 4: Social Choice Compatibility.* (Arrow/Condorcet). The theory can't demand transitivity if the math says it's impossible without dictatorship.
      *   *Requirement 5: Temporal Binding.* (The "yesterday vs. today" problem). Does the will bind the future?
      *   *Requirement 6: Participation Threshold.* (The low turnout referendum). Can 30% turnout claim to speak for "the People"?

  4.  **Refining the "Why it's a Requirement" aspect:**
      *   Need to ensure these aren't just liberal biases. For example, requiring "deliberation" might be anti-populist bias. Requiring "consistency" is a logical necessity for *will* to exist as a coherent concept.
      *   *Crucial Insight:* The biggest tension is between *Unity* (Populism demands one will) and *Plurality* (Reality shows many wills).

  5.  **Identifying Impossibility Results (The "Definite Line"):**
      *   Arrow's Theorem is the elephant in the room.
      *   But more specifically for populism: The tension between **Unity** (The People are One) and **Liberalism/Pluralism** (Individuals have distinct preferences).
      *   *The Knockout:* The requirement that the will be **Unitary and Transitive** while respecting **Unrestricted Domain** (everyone counts) and **Non-Dictatorship**.
      *   *Decision:* I need to highlight that a *coherent, unitary, democratic* will is mathematically impossible under certain conditions. The user asked for a definite line. I will argue that the demand for a *Unitary* will is the point of failure for most populist theories.

  6.  **Distinguishing Desiderata vs. Prejudice:**
      *   *Genuine:* Consistency, Non-dictatorship, Agency (Will vs. Interest).
      *   *Prejudice:* "Must be rational" (who defines rational?), "Must be liberal" (protecting minorities might be seen as anti-will by populists), "Must be deliberative" (elitist bias).

  7.  **Evaluating the Three Theories:**
      *   *Rousseau:* Great on Unity/Binding, fails on Plurality/Arrow (assumes away conflict).
      *   *Schumpeter:* Great on Reality/Arrow, fails on "Will" (reduces it to leadership selection, denies popular will exists).
      *   *Preference Aggregation:* Great on Individualism, fails on Coherence (Arrow's cycles mean no stable "will" emerges).

  8.  **Structuring the Response:**
      *   **Purpose Statement:** Clear and functional.
      *   **The Spec (Table):** Columns for Requirement, The Test Case, Why it's Mandatory (not preference).
      *   **The Hard Truths (Impossibility):** Identify the unsatisfiable subset.
      *   **Desiderata vs. Prejudice:** Filter the list.
      *   **The Knockout:** Identify the specific requirement that kills most theories.
      *   **Theory Evaluation:** Brief run-down of Rousseau, Schumpeter, Aggregation.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Arrow's Theorem." Explain *what* it breaks (Transitivity + Non-dictatorship).
      *   *Correction:* The user wants to know when a populist claim is *true*. This implies the theory must allow for *some* true claims. If I say it's impossible, the user can't decide case-by-case. I need to nuance the impossibility: It's impossible to satisfy *all* desiderata simultaneously. A theory must sacrifice one. Which one?
      *   *Decision:* The sacrifice usually happens at **Unity**. A theory that preserves democracy and consistency must accept that "the will" is fragmented or constructed, not discovered.
      *   *Refining the "Knockout":* The requirement that the will be **Pre-political/Unitary** is the one that knocks out the most theories because it contradicts the **Plurality** requirement.

  10. **Final Polish:** Check tone. Ensure it's direct and answers the prompt's demand for a "definite line." (Avoid "on the one hand, on the other hand" regarding the impossibility theorem).

  **(Self-Correction on the "Definite Line"):** The prompt asks: "which single requirement knocks out the most popular theories, and is there a subset of the list that's jointly unsatisfiable."
  *   *Unsatisfiable Subset:* Unitary Will + Democratic Equality + Rational Consistency (Arrow).
  *   *Knockout Requirement:* **Unitary Coherence.** Most theories (especially populist ones) fail because they assume a single will exists without a dictator.

  Let's build the response around this tension.

  11. **Final Review against constraints:**
      *   Table included? Yes.
      *   Purpose fixed? Yes.
      *   Cases covered (51%, turnout, flipping)? Yes.
      *   Distinctions (will/interest, sum/whole, mood/binding)? Yes.
      *   Social Choice (Condorcet/Arrow)? Yes.
      *   Desiderata vs Prejudice? Yes.
      *   Jointly unsatisfiable subset identified? Yes.
      *   Definite line taken? Yes.
      *   Rousseau/Schumpeter/Aggregation evaluated? Yes.
      *   Keep evaluation short.

