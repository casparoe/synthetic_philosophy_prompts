answer: |-
  ### Purpose Specification
  **Function:** To adjudicate the validity of populist claims ("The people have spoken") by distinguishing between a **constituted political will** (valid) and a **rhetorical construct** (invalid).
  **Goal:** Provide a decision procedure to determine if a specific event constitutes an expression of "the will of the people" sufficient to override institutional constraints or minority objections.

  ### The Spec: Desiderata for a Theory of Popular Will

  | Requirement | The Test Case (Must Get Right) | Why Mandatory (Not Preference) |
  | :--- | :--- | :--- |
  | **1. Aggregation Coherence** | **Condorcet Cycles:** A beats B, B beats C, C beats A. | If the "will" is intransitive (A > B > C > A), it cannot guide action. A theory must explain how a decision is reached without hiding the contradiction. |
  | **2. Non-Dictatorial Emergence** | **The 51% Technicality:** A law passes on a procedural loophole with 51% vote, against 49% intense opposition. | If the "will" can be generated by a single agent or a fixed minority ruling permanently, it is not *popular* will. It must emerge from the plurality without a dictator. |
  | **3. Participation Threshold** | **Low-Turnout Referendum:** 60% support among voters, but only 30% of electorate voted. | A "will" attributed to "The People" cannot be valid if the majority of the people abstained. Silence ≠ Consent. |
  | **4. Temporal Stability** | **The Flip-Flop:** Referendum A passes in Year 1; Referendum B (identical) fails in Year 2 with no new info. | If the will fluctuates with mood rather than judgment, it is pathos, not volition. A will must bind over time to be a *will*. |
  | **5. Will vs. Interest Distinction** | **Paternalism:** The people vote for X, but X harms their economic interest. | A theory of *will* must respect agency. If the theory overrides the vote because it's "not in their interest," it describes welfare, not will. |
  | **6. Plurality vs. Unity** | **The Sum vs. The Whole:** 51% want X, 49% want Y. Does the will = X, or is the will fractured? | Populism claims the people are *One*. A theory must account for whether the "will" is a discovered unity or a constructed majority. Collapsing this hides domination. |
  | **7. Information Sensitivity** | **Ignorance vs. Judgment:** A vote based on demonstrably false premises (e.g., "The candidate is dead"). | Volition requires agency. If the input is coerced or based on falsified reality, the output is not a will but a reaction. |

  ### Desiderata vs. Camp Prejudice

  | Requirement | Status | Reasoning |
  | :--- | :--- | :--- |
  | **Aggregation Coherence** | **Genuine Desideratum** | Logical necessity. Incoherent commands cannot be executed. |
  | **Non-Dictatorial** | **Genuine Desideratum** | Definitional. If it's one person's will, it's not *popular* will. |
  | **Will vs. Interest** | **Genuine Desideratum** | Conceptual necessity. Conflating them destroys the concept of democracy (rule by people) in favor of technocracy (rule for people). |
  | **Temporal Stability** | **Genuine Desideratum** | Functional necessity. A government cannot operate on hourly mood swings. |
  | **High Participation** | **Camp Prejudice (Liberal)** | Populists argue a "moral majority" speaks even if turnout is low. *However*, for the *claim* to be empirically true, a threshold is required to distinguish "faction" from "people." |
  | **Deliberative Process** | **Camp Prejudice (Elitist)** | Requiring deep deliberation before a will is "valid" biases against direct democracy. A snap vote can still be a will. |
  | **Minority Veto** | **Camp Prejudice (Liberal)** | Requiring minority consent turns "will of the people" into "will of everyone," which is impossible. |

  ### The Impossibility Result (The Definite Line)

  There is a subset of the list that is **jointly unsatisfiable**. You cannot have a theory that satisfies all of the following simultaneously:

  1.  **Unrestricted Domain (Democracy):** Every individual's preference counts equally.
  2.  **Transitivity (Coherence):** The collective will is logically consistent (if A > B and B > C, then A > C).
  3.  **Non-Dictatorship:** No single individual dictates the outcome.
  4.  **Unitary Will (Populist Claim):** There is one single "will of the people" distinct from the sum of parts.

  **Arrow's Impossibility Theorem** proves that 1, 2, and 3 cannot coexist. Therefore, any theory claiming a **Unitary Will (4)** that is also **Democratic (1)** and **Coherent (2)** is mathematically false.

  **The Knockout Requirement:**
  **Unitary Coherence.**
  This is the single requirement that knocks out the most popular theories (specifically Populist and Rousseauian theories). Most populist claims fail because they assert a *single, coherent will* exists independently of the procedure used to measure it. They treat "the will" as a hidden object to be discovered. The math says it is not discovered; it is **produced** by the voting rule.

  If you demand the will be *Unitary* (One People) and *Coherent* (Rational), you must sacrifice *Democracy* (you need a Dictator to force consistency). If you keep *Democracy* and *Coherence*, you must sacrifice *Unity* (accepting the will is fragmented or cycle-prone).

  ### Theory Evaluation

  | Theory | Performance Against Spec | Fatal Flaw |
  | :--- | :--- | :--- |
  | **Rousseau (General Will)** | **Fails Aggregation & Plurality.** Assumes a pre-existing unity that ignores faction. | **The Unity Prejudice.** It satisfies *Coherence* and *Binding*, but only by assuming away *Plurality*. It cannot handle the case where the people genuinely disagree without labeling one side "not part of the people." |
  | **Schumpeter (Competition)** | **Fails Will vs. Interest.** Denies "the will" exists at all; reduces democracy to selecting leaders. | **The Elimination.** It passes *Coherence* and *Stability* by deleting the object of inquiry. It tells you when a leader is legitimate, but cannot adjudicate if "the people spoke" on a policy. |
  | **Preference Aggregation** | **Fails Coherence (Arrow).** Accurately sums preferences but produces cycles/intransitivity. | **The Incoherence.** It respects *Democracy* and *Plurality*, but yields no actionable "Will." It can tell you what people want, but not what "The People" want collectively without a dictator to break cycles. |

  **Conclusion for your Reading List:**
  Any book that claims "the will of the people" is a **discoverable, unitary, and coherent** entity without acknowledging the **Arrowian trade-off** is theoretically bankrupt. Look for theories that treat the will as **constructed** (by institutions/parties) rather than **expressed** (by votes alone). That is the only way to satisfy *Coherence* without *Dictatorship*.
