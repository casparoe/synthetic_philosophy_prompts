  Riley: "But who's doing the labeling? Census bureaus and advertisers. Strip away the birth-year bins and the narrative framing, and there's no 'Boomer' left outside 1946-64 and the postwar boom. The looping is the whole ontology."

  Jules: "The looping works *becuase* there's a prior shared formative environment. Smartphones, climate dread, the gig economy. That stuff hits specific cohorts hard."

  Riley: "Okay, but take Gen Alpha. We haven't observed their formative years yet. Calling them a generation now is pure projection."

  Jules: "But the projection creates the reality. They'll grow up knowing they're Alpha. That shapes them."

  Riley: "That's just prophecy masquerading as analysis. And here's the kicker: cohort effects and period effects can't be statistically disentangled. The identification problem."

  Jules: "So you think it's all age-grading?"

  Riley: "Exactly. Every 'generational' trait might just be being twenty at different historical moments. If you can't separate age from cohort, you aren't carving nature at the joints."

  Jules: "Even if it's messy, the social reality is still there. People live by these labels."

  Riley: "They live by the map, not the territory."

