answer: |-
  In a five-stage co-development treaty between two biotech firms, GeneCo and PharmaX, the parties alternate turns to either "Claim" the current research valuation or "Pass" to the next stage, where the valuation doubles. While the base valuation schedule mirrors the standard Centipede Game (yielding a dominant incentive to Claim at the final node), a Regulatory Sunset Clause stipulates that any firm choosing "Claim" prior to Stage 4 automatically forfeits all future licensing rights, incurring a penalty $V$ strictly greater than the maximum possible pot. Both firms possess common knowledge of this clause and of each other's rationality; thus, at Node 3, the rational calculation incorporates the penalty, making the net utility of Claiming negative relative to Passing, despite the base valuation suggesting otherwise.

  The induction chain severs specifically at Node 3 because the Sunset Clause creates a discontinuity in the payoff function that is path-dependent: the utility of "Claim" is not intrinsic to the node but contingent on the history of play (specifically, that the threshold has not been met). Standard backward induction fails here only if one applies it to the *base* valuation matrix in isolation; when the institutional penalty is correctly folded into the payoff architecture, backward induction does not predict immediate defection but rather prescribes cooperation through Stage 3. The structural feature doing the work is the **path-dependent penalty constraint**, which endogenously alters the terminal utilities of early nodes. If this feature is removed, the penalty $V$ vanishes, the payoff structure reverts to the standard Centipede geometry, and the induction chain immediately collapses back to the root, forcing rational defection at Node 1.

  A defender of standard backward induction would argue that this repair merely redefines the game tree rather than solving the paradox, asserting that the "true" Centipede Game is defined by the base valuations alone and that adding the clause constitutes changing the subject. This repair fails because it relies on an arbitrary distinction between "game payoffs" and "institutional constraints"; in any realistic application, the rules governing forfeiture are constitutive of the payoffs themselves. To insist on applying backward induction to the base valuations while ignoring the Sunset Clause is not a defense of rationality, but a modeling error that assumes agents ignore binding contractual obligations, which violates the assumption of perfect rationality regarding the game's rules. Thus, the paradox dissolves not by breaking logic, but by correcting the specification of the game to match the institutional reality.
