answer: |-
  # RELATIONAL-RIGHTS TRIAGE PROTOCOL (RRTP)
  **Version:** 4.2 | **Authorized By:** Senior Mediation Desk | **Time Allocation:** 45 Minutes Max

  ## PURPOSE
  To determine whether a dispute is best resolved via **Relational Restoration (RR)** (Ubuntu-informed repair of interdependence) or **Individual Rights Redress (IRR)** (Statutory Charter enforcement: compensation, exclusion, adjudication).

  ## CONSTRAINTS
  1.  **Non-Derogable Boundaries:** No party can be forced into dialogue, disclosure, or proximity against their will (Charter Rights to Autonomy/Privacy).
  2.  **Relational Denial:** RR is impossible if a party explicitly rejects the existence of mutual obligation.
  3.  **Safety:** Immediate referral to legal/security authorities if physical safety is at risk (Outside RRTP scope).

  ---

  ## PHASE 1: HARM CLASSIFICATION (10 Minutes)
  *Goal: Distinguish harm done TO a relation vs. harm done THROUGH a relation.*

  **Q1.1: What is the primary locus of the injury?**
  *   **Option A:** The injury is a breach of trust, respect, or shared expectation (e.g., insult, betrayal, neglect).
  *   **Option B:** The injury utilized an existing relationship as a tool to inflict damage (e.g., using access granted by trust to steal, abuse, or coerce).
  *   **Option C:** The injury is purely transactional/contractual with no prior relational expectation.

  > **Sufficient Answer:** Caseworker must categorize as A, B, or C based on intake forms.
  > **Decision Rule:**
  > *   If **A**: Proceed to Phase 2. (Candidate for RR).
  > *   If **B**: **STOP.** Recommend **IRR**. (Using relation as a weapon voids the relational frame).
  > *   If **C**: Proceed to Phase 3. (Transactional disputes rarely support RR unless parties wish to build relation).

  **Q1.2: Does the harm extend to third parties not present in the room?**
  *   **Yes:** The rupture affects the wider community/web (e.g., public slur, shared resource contamination).
  *   **No:** The rupture is contained between the parties.

  > **Decision Rule:** If **Yes**, note "Community Stakeholder" status. RR requires community representation if selected. If **No**, proceed.

  ---

  ## PHASE 2: CAPACITY & WILLINGNESS (15 Minutes)
  *Goal: Determine if the relational frame is acknowledged by both parties.*

  **Q2.1: Does the Respondent (Offender) acknowledge a relational obligation to the Claimant (Victim)?**
  *   **Yes:** "I wronged *you/our community*."
  *   **No:** "I broke a rule," "It was business," or "I owe you nothing."

  > **Sufficient Answer:** Direct quote or clear paraphrase from intake interview.
  > **Decision Rule:**
  > *   If **No**: **STOP.** Recommend **Referral to Arbitration/Legal**. (RR requires mutual recognition of personhood).
  > *   If **Yes**: Proceed to Q2.2.

  **Q2.2: Does the Claimant (Victim) consent to a relational process?**
  *   **Yes:** Willing to engage in dialogue, restorative conference, or mediated encounter.
  *   **No:** Demands exclusion, punishment, compensation, or refuses contact.

  > **Sufficient Answer:** Explicit statement of desired outcome.
  > **Decision Rule:**
  > *   If **No**: **STOP.** Recommend **IRR**. (Charter Right to Non-Participation overrides RR ethos).
  > *   *Note:* This is a **Senior Sign-Off Point**. (See Phase 4).
  > *   If **Yes**: Proceed to Phase 3.

  ---

  ## PHASE 3: BOUNDARY & PRIVACY CHECK (10 Minutes)
  *Goal: Ensure restoration does not violate protected rights.*

  **Q3.1: Does the proposed relational repair require the disclosure of information one party claims as private?**
  *   **Yes:** (e.g., financial records, personal history, health data).
  *   **No:** Repair can occur without breaching privacy boundaries.

  > **Decision Rule:**
  > *   If **No**: Proceed to Recommendation.
  > *   If **Yes**: **Senior Sign-Off Point**. (See Phase 4).

  **Q3.2: Is the pressure to restore "harmony" coming from the community rather than the parties?**
  *   **Yes:** Community leaders/peers are pressuring a party to forgive.
  *   **No:** The desire for repair is internal to the parties.

  > **Decision Rule:**
  > *   If **Yes**: **STOP.** Recommend **IRR** or **Pause**. (Coercion violates Autonomy).
  > *   *Note:* This is a **Senior Sign-Off Point**.

  ---

  ## PHASE 4: SENIOR SIGN-OFF & FINAL DETERMINATION (10 Minutes)
  *Goal: Caseworker presents findings. Senior Mediator makes final call on flagged items.*

  **JUDGMENT POINT 1: The Autonomy Veto (From Q2.2)**
  *   **Scenario:** Victim demands exclusion/rights redress despite Offender's willingness to repair.
  *   **Senior Decision:** Uphold Victim's Autonomy.
  *   **Rationale:** The Charter protects the right to *not* be in a relation. Forced restoration is violence.
  *   **Outcome:** **IRR (Rights-Based).** *Flag: This overrides the Center's Relational Ethos.*

  **JUDGMENT POINT 2: The Privacy Shield (From Q3.1)**
  *   **Scenario:** Repair requires truth/disclosure; Party claims Privacy Right.
  *   **Senior Decision:** Weigh "Necessity of Disclosure" vs. "Severity of Privacy Breach."
  *   **Outcome:** If disclosure is essential for safety/trust -> Recommend **RR with Protected Disclosure**. If disclosure is intrusive without safety gain -> Recommend **IRR**.

  **JUDGMENT POINT 3: Community Coercion (From Q3.2)**
  *   **Scenario:** Community wants harmony; Individual wants rights.
  *   **Senior Decision:** Protect Individual.
  *   **Outcome:** **IRR**.

  ---

  ## FINAL RECOMMENDATION OUTPUT
  *Select one:*

  1.  **RELATIONAL RESTORATION (RR):** Mediated conference, community circle, apology, reintegration plan.
  2.  **INDIVIDUAL RIGHTS REDRESS (IRR):** Compensation, formal apology without meeting, separation/exclusion, legal referral.
  3.  **REFERRAL:** Statutory arbitration, court, or specialized legal aid (Used when relational frame is denied).

  ---

  # WORKED CASE APPLICATIONS

  ### CASE 1: Workplace Racial Slur
  *   **Facts:** Employee A (White) used a racial slur against Employee B (Black). A admits fault, understands the harm to the team fabric, and wants restorative dialogue. B demands A's termination and refuses to be in the same room.
  *   **RRTP Run:**
      *   **Q1.1:** Harm TO relation (breach of respect). -> *Proceed.*
      *   **Q1.2:** Third parties affected (team). -> *Note Community Stake.*
      *   **Q2.1:** Respondent acknowledges obligation? **Yes.** -> *Proceed.*
      *   **Q2.2:** Claimant consents to relational process? **No.** (Demands termination/no contact).
      *   **Flag:** **Senior Sign-Off Point (Autonomy Veto).**
  *   **Senior Determination:** B's right to non-participation and safety overrides the Center's goal of restoration. Forcing B into dialogue to "repair the web" violates B's autonomy.
  *   **Recommendation:** **INDIVIDUAL RIGHTS REDRESS (IRR).** Support B's demand for separation/termination.
  *   **ETHOS FLAG:** **This recommendation runs counter to the Center's Relational Ethos.**
      *   *Why:* Ubuntu prioritizes re-weaving the community. However, the Statutory Charter prioritizes individual autonomy. When the Victim refuses the weave, the Procedure mandates protecting the Individual over the Community Fabric. Restoration cannot be coerced.

  ### CASE 2: Communal Water Access
  *   **Facts:** Farmer X diverts water, drying out Neighbor Y's crop. Y claims this violates community stewardship. X claims, "I paid for the pipe; this is a contract, not a relationship."
  *   **RRTP Run:**
      *   **Q1.1:** Harm THROUGH relation (using shared resource to harm) OR Transactional? X argues Transactional.
      *   **Q2.1:** Respondent acknowledges relational obligation? **No.** ("It's business.")
      *   **Flag:** **Stop Condition.**
  *   **Senior Determination:** X denies the relational frame entirely. RR requires mutual recognition of interdependence. X views this as a transaction.
  *   **Recommendation:** **REFERRAL TO LEGAL ARBITRATION.**
      *   *Why:* You cannot mediate a relationship with someone who insists none exists. The Charter protects X's right to view this transactionally, but it also removes them from the RR track.

  ### CASE 3: Family Inheritance & Concealed Assets
  *   **Facts:** Sibling A hid assets from Sibling B during estate division. To restore trust (RR), A must disclose all finances. A claims financial privacy is a protected boundary.
  *   **RRTP Run:**
      *   **Q1.1:** Harm TO relation (betrayal/trust). -> *Proceed.*
      *   **Q2.1:** Respondent acknowledges obligation? **Yes** (wants to fix family bond).
      *   **Q2.2:** Claimant consents? **Yes** (wants truth).
      *   **Q3.1:** Repair requires disclosure of private info? **Yes.**
      *   **Flag:** **Senior Sign-Off Point (Privacy Shield).**
  *   **Senior Determination:** Does the need for truth outweigh the privacy right? In inheritance, full disclosure is usually prerequisite for fairness. However, A cannot be *forced*.
  *   **Recommendation:** **VALUE JUDGMENT / CONDITIONAL RR.**
      *   *Why:* The Senior Mediator must negotiate a "Protected Disclosure" (e.g., assets shown to a neutral accountant, not directly to B). If A refuses even this, the case shifts to **IRR (Legal Adjudication)** because trust cannot be rebuilt on secrecy.

  ---

  # LIMITATIONS & SCOPE WARNING

  **This Procedure CANNOT:**
  1.  **Resolve Structural Oppression:** If the "relational web" itself is built on systemic inequality (e.g., landlord/tenant in a housing crisis), RR may reinforce oppression. These cases require **Structural Advocacy**, not mediation.
  2.  **Override Criminal Law:** If the harm constitutes a criminal offense (assault, theft), the Procedure stops. Statutory law takes precedence over restorative options unless explicitly diverted by the state.
  3.  **Fix Ideological Incompatibility:** If parties share no common values (e.g., one party believes the other has no soul/rights), RR is impossible. This is a **Referral**.
  4.  **Mechanically Measure "Harm":** Q1.1 requires human interpretation. A caseworker applying this mechanically may misclassify "harm through relation" (abuse) as "harm to relation" (conflict), endangering the victim.

  **Likely Misfire Points:**
  *   **The "Harmony" Trap:** Caseworkers may pressure victims to accept RR to "clear the docket" or "heal the community." Phase 4, Judgment Point 1 is the critical safeguard.
  *   **The "Privacy" Shield:** Offenders may claim privacy to hide ongoing malice. Seniors must verify if privacy is a boundary or a weapon.

  **Final Directive:** If in doubt, prioritize the **Statutory Charter (Rights)** over the **Ubuntu Framework (Relation)**. A broken right is a legal liability; a broken relation is a social tragedy. We are mandated to prevent the former first.
