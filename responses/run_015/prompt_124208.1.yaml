          *   Temporal persistence (memory/anticipation).
          *   Self-modelling (identity).
      *   **Analysis of the Vector:** Can we just sum these up? No, they interact. A creature might feel pain (valence) but not understand time (persistence). Does it have a right to life or just freedom from torture?
      *   **Synthesis/Resolution:** Gradation exists, but we need *categorical* thresholds based on specific vector components.
          *   Threshold 1: Valenced Experience (Moral Patienthood - right not to suffer).
          *   Threshold 2: Integrative Processing/Self-Modelling (Moral Personhood - right to life/autonomy).
      *   **Conclusion:** Reiterate thesis. Gradation is the map, thresholds are the territory we must navigate. Defend the threshold approach as the only way to make the vector model actionable.

  4.  **Drafting - Section by Section (incorporating constraints):**

