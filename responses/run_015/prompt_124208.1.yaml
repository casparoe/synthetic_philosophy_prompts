      *   **Key Tension:** Phenomenological/functional continuity (argues for gradation) vs. Practical/Theoretical need for decisive action (argues for thresholds).
      *   **Specific Focus:** Evaluate a multi-dimensional 'capacity-vector' model (integrative processing, valenced experience, temporal persistence, self-modelling).
      *   **Goal:** Reach a *definite conclusion*. Either defend a scalar framework with a decision rule OR argue gradation is real but normatively inert (specifying operative thresholds).
      *   **Constraints:** No bibliographies, reading lists, or citations. Argument from first principles and conceptual analysis.

  2.  **Initial Brainstorming & Positioning:**

