      *   *The Threshold Argument:* Ethics requires action. "Do not kill" is binary. If moral status is 0.001% of a human, do we owe it 0.001% of protection? That leads to paralysis. We need bright lines for law and policy.
      *   *The Vector Model:* This seems like the most sophisticated middle ground. Sentience isn't one thing. It's a bundle of capacities. Maybe some dimensions matter more for specific rights.
      *   *My Conclusion:* I need to choose. A pure scalar model is too messy for practice. A pure binary model is too blunt for reality. The "capacity-vector" model offers a way to have *gradation in theory* but *thresholds in practice* based on specific dimensions.
      *   *Decision:* I will argue that while moral status is *ontologically* gradational (based on the vector of capacities), it must be *normatively* operationalized through thresholds tied to specific dimensions (specifically *valenced experience* and *integrative processing*). Gradation is real, but without thresholds, it is normatively inert regarding specific rights. However, a single threshold is insufficient; a tiered system based on the vector is best. Wait, the prompt asks for a definite conclusion: *either* defend scalar + decision rule *or* argue gradation is epistemically real but normatively inert (specify thresholds).
      *   *Refined Decision:* I will argue that gradation is epistemically real but normatively inert *unless* anchored by thresholds. Pure scalar morality collapses into paralysis. Therefore, I will defend a **threshold-based framework** that acknowledges underlying gradation but selects specific dimensions of the capacity-vector as operative switch-points for distinct moral categories. This avoids the "micro-obligations" trap while respecting the continuity of nature.

  3.  **Outline Structure:**

      *   **Introduction:** Define the problem (continuity of nature vs. binary demands of ethics). Introduce the spectrum (thermostats to mammals). State the thesis: Gradation is ontologically accurate but normatively unworkable without thresholds; a multi-dimensional vector model justifies specific thresholds rather than a smooth scalar slope.
