answer: |-
  **The Compliance Bureau**

  The Bureau maintains a secret "Risk Score" (S) for all contractors, derived from past tax filings. Policy: Contractors with S > 50 are "Flagged." All Flagged contractors receive a notice: "Pay $10,000 compliance fee or face full audit (costing $200,000)." To maintain uncertainty, 5% of Non-Flagged contractors also receive the notice randomly. The Bureau audits every Flagged contractor who refuses payment. They do not audit Non-Flagged refusals.

  Why audit? The Bureau calculates that auditing one refuser costs $20,000 but secures $2,000,000 in future compliance from other Flagged agents who hear of enforcement. The policy is public and binding.

  You receive a notice. You do not know your S. However, psychological profiling shows contractors with High S are significantly more likely to refuse payment (due to risk tolerance/defiance) than Low S contractors. Specifically, base rate P(Flagged | Notice) = 4%. But P(Flagged | Notice & Refuse) = 40%. You must decide now whether to pay. You could not have altered your S beforehand without prohibitive cost. The targeting is settled; your payment cannot change your Flagged status, only whether the audit is triggered given that status.

  ***

  **Verdicts**

  **Causal Decision Theory (CDT):** Refuses. The audit probability is fixed at 4% by past facts. Expected loss of refusal is 0.04 × $200,000 = $8,000. Cost of compliance is $10,000. Since $8,000 < $10,000, refusal maximizes causal expected utility. The decision cannot influence the past Score.

  **Evidential Decision Theory (EDT):** Pays. EDT conditions on the action. Refusing is strong evidence of High S (defiance), updating the audit probability to 40%. Expected loss of refusal is 0.40 × $200,000 = $80,000. Since $80,000 > $10,000, paying maximizes evidential expected utility. Paying is good news about one's Risk Score.

  **Functional Decision Theory (FDT):** Refuses. FDT checks for subjunctive dependence between the decision procedure and the environment. The Bureau's targeting depends on S (past data), not on the output of the victim's decision algorithm. There is no logical link between "I choose Refuse" and "I am Flagged." FDT aligns with CDT.

  **Updateless Policy Selection:** Ex ante, knowing the correlation, would you bind yourself to pay? No. You cannot change your S. Binding yourself to pay guarantees a $10,000 loss. Binding yourself to refuse risks an $8,000 expected loss. The optimal ex ante policy is refusal, confirming FDT/CDT.

  **The Divergence Feature:** EDT treats the decision as *evidence* of the hidden state (S), whereas CDT/FDT treat the state as fixed independent of the choice.

  **Removal Tests:**
  1.  **Victim reads file:** S becomes known. P(Flagged | Refuse) collapses to 0 or 1. EDT updates to certainty and agrees with CDT (Refuse if Not-Flagged, Pay if Flagged). The "news value" of the decision vanishes.
  2.  **Retaliator models decision:** If targeting depended on the *prediction* of the decision (Newcomb-style), FDT would pay because the decision logically determines the targeting. Here, targeting depends on fixed history, so FDT refuses.

  **Strongest EDT Reply:** "Rationality requires using all available information. Refusing provides damning statistical evidence that I am about to be audited. Ignoring this evidence because it isn't 'causal' is willful blindness to reality. If refusing predicts disaster, a rational agent avoids refusing."
