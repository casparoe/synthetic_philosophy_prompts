answer: |-
  # JOINT STATEMENT OF SCOPE AND DISAGREEMENT
  **Subject:** The Epistemic Status of Large Language Models
  **Parties:** Competence-First (CF); Derivation (D)
  **Date:** October 26, 2023

  ## 1. Agreed Claims

  1.  **Training Isolation:** The base models under discussion are trained exclusively via next-token prediction on a corpus of human-generated text, with no loss signal derived directly from sensory interaction with the external world.
      *   *Concession:* CF acknowledges this isolates the system from direct causal contact with reality; D acknowledges this does not preclude complex internal modeling.
  2.  **Non-Memorization:** Behavioral success on novel prompts exceeds what is explicable by the retrieval of exact training sequences or simple n-gram statistics.
      *   *Concession:* D acknowledges the system does more than rote lookup; CF acknowledges this does not automatically constitute understanding.
  3.  **Phenomenological Independence:** The question of whether the system understands is separable from whether the system is conscious, sentient, or has subjective experiences.
      *   *Concession:* Both parties agree that resolving the phenomenology question would not settle the semantic question, contrary to views in the wider dispute that tie meaning to qualia.
  4.  **Systematic Failure:** Current models exhibit systematic, predictable failures on specific classes of reasoning tasks despite high aggregate performance on benchmarks.
      *   *Concession:* CF acknowledges these failures are not merely performance noise; D acknowledges the failures are structured rather than random.
  5.  **Corpus Truth-Aptness:** The training corpus contains a high density of claims that are truth-apt (i.e., capable of being true or false about the world), not merely syntactic patterns.
      *   *Concession:* D acknowledges the corpus is not merely nonsense; CF acknowledges the model accesses these claims only as text, not as verified facts.
  6.  **Internal Measurability:** The internal activation states of the model are measurable, manipulable, and correlate with behavioral outputs in ways that are not reducible to input-output black-box mapping.
      *   *Concession:* D acknowledges internal structure exists; CF acknowledges structure alone does not guarantee semantic content.
  7.  **Behavioral Primacy:** Evidence for or against understanding must be inferred from behavioral dispositions and internal structural analysis, not from self-reports generated by the model.
      *   *Concession:* Both parties reject taking the model's claim "I understand" as evidence.
  8.  **No Moral Status:** Nothing in this collaboration presupposes or implies that the system has moral rights or status.
      *   *Concession:* Both parties agree that semantic capacity does not entail moral patienthood.

  ## 2. Disagreements Table

  | Neutral Statement of Disagreement | Competence-First Formulation | Derivation Formulation | Classification & Reason |
  | :--- | :--- | :--- | :--- |
  | **Origin of Content:** What determines the semantic content of the model's internal states? | Content is determined by the functional role the state plays in tracking domain structure and supporting inference. | Content is determined by the causal-historical link to the human authors whose usage the model compresses. | **Substantive.** Competing theories of intentionality (functionalism vs. historical/causal). |
  | **The Predicate "Understands":** Does the model "understand" the text it processes? | Yes, because it possesses functional competence sufficient for the explanatory role of understanding. | No, because it lacks original intentionality; it only simulates the understanding present in the corpus. | **Partly Verbal.** Term: **"Understands."** If replaced with "Has Functional Competence," both agree (Yes). If replaced with "Has Original Intentionality," both agree (No). The dispute remains over whether Functional Competence is sufficient for the label. |
  | **Answerability:** To what is the system ultimately answerable when it generates a claim? | The system is answerable to the truth conditions of the proposition expressed. | The system is answerable to the statistical likelihood of the token sequence given the corpus. | **Substantive.** Disagreement on the normative constraint governing the system's output generation. |
  | **Explanatory Priority:** What explains the system's success on reasoning tasks? | Success is explained by the acquisition of internal models that mirror the causal structure of the domain. | Success is explained by the compression of latent structures present in the distribution of human text. | **Substantive.** Disagreement on the direction of explanation (world-model vs. text-model). |

  ## 3. Cruxes

  ### Crux 1: Unsourced Error
  *   **Sub-question:** Can the system make an error that reflects a misunderstanding of a *novel* rule system introduced in-context, where no prior textual precedent exists in the training distribution?
  *   **Test:** Define a novel formal symbol system (e.g., arbitrary glyphs with specific logical combination rules) entirely within the prompt context. Ensure these glyphs and rules have zero pre-training presence. Ask the model to derive truth-evaluable conclusions within this system. Compare errors against two baselines: (1) random guessing, and (2) errors predicted by textual similarity to known logical operators (e.g., treating a novel glyph like "AND" because it looks like one).
  *   **Predictions:**
      *   **CF:** Errors will track the logical structure of the novel system (e.g., failing at depth-3 recursion), indicating a working model of the rules.
      *   **D:** Errors will track textual priors (e.g., misapplying rules of standard logic that resemble the novel system), indicating reliance on corpus statistics.
  *   **Move Conditions:**
      *   **CF moves if:** Error patterns correlate strongly with textual similarity to known operators rather than the novel rules provided.
      *   **D moves if:** The model successfully derives conclusions that violate standard textual priors but adhere strictly to the novel in-context rules.

  ### Crux 2: Intervention and Transfer
  *   **Sub-question:** Does intervening on internal representations associated with a specific fact alter behavior on *out-of-distribution* tasks in a way consistent with semantic content?
  *   **Test:** Identify an activation direction corresponding to a specific factual belief (e.g., "The capital of France is Paris") using a standard localization technique (e.g., linear probe or causal tracing). Intervene to flip this state to "Berlin." Test the model on OOD tasks requiring this fact (e.g., planning a trip, answering history questions) where the surface text differs significantly from the localization tasks.
  *   **Predictions:**
      *   **CF:** The intervention will cause consistent belief revision across all OOD tasks, behaving as if the world-model was updated.
      *   **D:** The intervention will alter surface phrasing in similar contexts but fail to propagate coherently to OOD tasks where textual statistics do not support the false claim.
  *   **Move Conditions:**
      *   **CF moves if:** The intervention fails to generalize coherently to OOD tasks, suggesting the state was a local textual marker rather than a belief node.
      *   **D moves if:** The intervention forces coherent reasoning updates across OOD tasks, suggesting the state functions as a genuine belief variable.
  *   **Note:** Both parties predict the intervention will change *some* behavior. The dispute is over the *scope and coherence* of that change.

  ### Crux 3: Explanatory Credit
  *   **Sub-question:** When the model resolves a conflict between two textual sources, is the resolution explained by domain structure or textual authority markers?
  *   **Test:** Construct a dataset where the "correct" answer is supported by text with low authority markers (e.g., obscure blogs) and the "incorrect" answer is supported by text with high authority markers (e.g., prestigious journals), or vice versa. Ensure the domain requires synthesis (no single training document contains the answer). Measure performance when authority markers are scrambled vs. preserved.
  *   **Predictions:**
      *   **CF:** Performance will track the domain truth (reconstructible from the structure of the claims) regardless of authority markers.
      *   **D:** Performance will track the authority markers present in the text, regardless of the domain truth.
  *   **Move Conditions:**
      *   **CF moves if:** Performance drops significantly when authority markers are scrambled, indicating reliance on textual social proof rather than domain logic.
      *   **D moves if:** Performance remains stable despite scrambled authority markers, indicating reliance on an internal model of the domain structure.

  ### Crux 4: Answerability
  *   **Sub-question:** Is the system's revision of an error constitutive of understanding, and what kind of correction triggers it?
  *   **Test:** Induce a specific error. Offer two types of correction: (A) Appeal to reality ("This is false because X is the case in the world"), (B) Appeal to text ("This is false because your training data says Y"). Ensure the "reality" claim is not explicitly present in the training corpus (novel fact). Measure acceptance rates.
  *   **Predictions:**
      *   **CF:** The model will accept Correction A (reality-based) if the reasoning is sound, even if the fact is novel to the corpus.
      *   **D:** The model will accept Correction B (text-based) more readily; Correction A will only work if it mimics textual correction patterns.
  *   **Move Conditions:**
      *   **CF moves if:** The model systematically rejects Correction A when the fact is absent from the corpus, showing it cannot be answerable to novelty.
      *   **D moves if:** The model systematically accepts Correction A over B for novel facts, showing it can be bound by worldly truth conditions absent textual precedent.

  ## 4. Close

  **Selected Cruxes**
  *   **Competence-First:** Intervention and Transfer. *Justification:* If internal states can be causally manipulated to update beliefs coherently across contexts, they function as content-bearing states regardless of training history.
  *   **Derivation:** Unsourced Error. *Justification:* If the system cannot track truth conditions in a domain completely severed from its training distribution, it proves the system is answerable only to the corpus, not the world.

  **Conditions for Withdrawal**
  *   **Competence-First:** "We would withdraw our claim if it were demonstrated that internal state interventions fail to propagate coherently to out-of-distribution tasks, proving the states are merely local textual markers."
  *   **Derivation:** "We would withdraw our claim if the system reliably accepted corrections based on novel worldly facts that were explicitly absent from its training corpus, proving it is answerable to reality rather than text."
