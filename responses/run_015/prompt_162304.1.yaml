      *   *P5:* Empirical/Anthropological. Identifying hinges is about practice/doing, not avowal. Anthropologist can be right/wrong.
      *   *P6:* Skepticism. Radical Cartesian skepticism is a performative failure, not an alternative hinge set to tolerate.
      *   *P7:* "Hinge Drift" (User's invention). Empirical results become scaffolding, then get dropped later. Sometimes this is how a field goes *wrong*.

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: P3 vs. P4 (The Relativism vs. Normativity Problem).**
          *   P3 says differing hinges = no error/mistake.
          *   P4 says some hinge shifts = improvement (epistemically better).
          *   *Conflict:* If P3 is true (no error in differing hinges), how can P4 be true (one set is better)? If horoscope-hinges are just "different," calling them "worse" seems to violate P3.
          *   *Severity:* High. This is the classic relativism vs. realism tension in *On Certainty* interpretations.

      *   **Tension B: P3 vs. P6 (The Tolerance Problem).**
