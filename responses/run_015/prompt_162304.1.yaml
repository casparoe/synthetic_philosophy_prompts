          *   *Conflict:* If they have content (P1), shouldn't the agent have some access to that content? If it's purely anthropological (P5), does the "content" matter, or just the function?
          *   *Severity:* Low/False Alarm. Wittgenstein often separates grammar from psychology. This is likely manageable.

      *   **Tension E: P4 vs. P7 (The Progress vs. Error Problem).**
          *   P4 says shifts can be improvements (horoscopes dropped = better).
