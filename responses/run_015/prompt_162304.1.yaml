          *   *Severity:* Medium. Wittgenstein's riverbed metaphor allows for movement, but P2's phrasing ("No hinge rests on the others... system as a whole") might be too rigid for P7's granular drift.

      *   **Tension D: P1 vs. P5 (The Content vs. Practice Problem).**
          *   P1 says hinges are genuine propositions with content.
