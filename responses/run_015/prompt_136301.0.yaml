answer: |-
  You have put your finger on a very specific, often unexamined tension in the metaphysics of personal identity. You are correct that there is a sharp asymmetry in how origin essentialists treat genetic differences depending on *when* they occur relative to the formation of the zygote.

  Here is a breakdown of the existing terminology, the philosophical critiques you're looking for, and an evaluation of your proposed label.

  ### 1. Is there an established term?

  There is no single, canonical term in the metaphysics literature that isolates *exactly* this pre/post-fertilization asymmetry. However, it falls under two broader umbrellas:

  *   **The Necessity of Origin:** Coined by Saul Kripke (and expanded by Nathan Salmon and Graeme Forbes). This is the standard "origin essentialism" label. It claims that in any possible world where you exist, you must originate from the specific gametes (sperm and egg) that you actually originated from.
  *   **Zygotic Personhood / Constitutional Essentialism:** In bioethics, this is often framed as the view that the zygote constitutes the moral and metaphysical beginning of the human being.

  **The Gap:** While "Necessity of Origin" covers the claim that you couldn't come from different gametes, it rarely explicitly defends *why* the boundary is drawn at the fusion of membranes rather than, say, the completion of meiosis or the first mitotic division. Most origin essentialists treat the zygote as a brute fact: *this* material origin is essential. They generally accept your Scenario B (post-zygotic mutation = same person) because the *origin event* (fertilization) remained identical, even if the resulting genetic code diverged slightly.

  So, you are right: there isn't a specific name for the **temporal fixity** of that boundary.

  ### 2. Has anyone called out this asymmetry?

  Yes. The inconsistency you suspect is a major point of contention in the literature, particularly from reductionists and bioethicists.

  **A. The Twinning Objection (The strongest critique)**
  This is the most famous argument against the "locked blueprint" view of the zygote. Up to roughly 14 days after fertilization, a zygote can split into monozygotic twins.
  *   **The Problem:** If the zygote is the essential "lock" of your identity, what happens when it splits? Does the original person cease to exist and two new ones begin? Or was the zygote never a person to begin with?
  *   **The Implication:** If identity survives the split, then the zygote was not a unique individual. If identity does not survive the split, then "you" could have ceased to exist simply by dividing, which contradicts the idea that the zygote is a stable essence.
  *   **Key Source:** Jeff McMahan, *The Ethics of Killing* (2002). He argues that the early embryo is not a determinate human being because it lacks the capacity for a unique psychological future (due to twinning potential).

  **B. Derek Parfit's Reductionism**
  In *Reasons and Persons* (1984), Parfit attacks the "Deep Further Fact" of identity. He argues that origin essentialism relies on a non-reductionist view of persons that doesn't match biological reality.
  *   **The Continuity Argument:** Biologically, there is no sharp "on" switch. Meiosis, fertilization, and syngamy (the merging of nuclei) are processes, not instants. Drawing a metaphysical hard line at the exact moment of membrane fusion is, according to Parfit, a linguistic or conceptual convenience, not a metaphysical truth.
  *   **The Mutation Point:** Parfit would agree with your intuition. If a mutation occurs 1 minute after fertilization, biological continuity is preserved. If a different sperm wins, biological continuity is broken. But origin essentialists treat the *source* as more important than the *continuity*, which Parfit finds arbitrary.

  **C. Genetic Essentialism (Sociological Critique)**
  Scholars like Dorothy Nelkin and Marion Lindee (*The DNA Mystique*) critique "genetic essentialism," but they focus more on the idea that genes determine *destiny* or *behavior*. However, their work overlaps with your point: treating the genome at conception as a "sacred text" that defines the self, ignoring epigenetic and environmental factors that shape identity immediately thereafter.

  ### 3. Evaluating "Conception-Lock Bias"

  Your proposed term, **"Conception-Lock Bias,"** is actually quite strong for a few reasons:

  1.  **It identifies a cognitive move:** It suggests this isn't necessarily a metaphysical truth, but a way people *frame* the argument to avoid slippery slopes.
  2.  **It highlights the temporal aspect:** "Origin Essentialism" is static; "Conception-Lock" implies a specific moment in time where the door slams shut.
  3.  **It implies criticism:** "Bias" suggests this is an unexamined intuition rather than a proven fact.

  **How to distinguish it from plain Origin Essentialism:**

  *   **Origin Essentialism (The Thesis):** "I am essentially tied to my biological source. I could not have come from different parents/gametes."
  *   **Conception-Lock Bias (The Mechanism):** "The specific moment that counts as 'the source' is fertilization, and not the gametes prior or the blastocyst after, despite biological continuity across all three stages."

  You can argue that one can be an origin essentialist *without* having the Conception-Lock Bias. For example, a theorist could argue that your essential origin is the **first neural crest formation** (much later) or the **completion of meiosis** (earlier). The "Lock" is the specific insistence that *fertilization* is the non-negotiable boundary.

  ### 4. Alternative Labels

  If you want to shop around for existing philosophical phrasing that might fit:

  *   **Zygotic Fixity:** Sounds more neutral/descriptive.
  *   **The Fertilization Boundary Problem:** Highlights that the boundary is the issue.
  *   **Gametic vs. Zygotic Essentialism:** You could distinguish between those who think the *gametes* determine identity (which would mean a mutation in the sperm before fertilization changes identity) vs. those who think the *zygote* does (your Scenario B). Most origin essentialists are Zygotic Essentialists.

  ### Summary Recommendation

  You are identifying a genuine gap. The standard "Necessity of Origin" argument glosses over the biological fuzziness of the fertilization process to establish a clean metaphysical boundary.

  **"Conception-Lock Bias"** is a viable and useful term, specifically if you are using it to critique the *argumentative strategy* rather than just the metaphysical claim. It allows you to say:

  > "While Kripke argues for the Necessity of Origin, proponents often rely on a **Conception-Lock Bias** to defend the zygote as the specific locus of that origin. This creates an asymmetry where pre-zygotic genetic variance negates identity, but post-zygotic variance does not, despite there being no biological discontinuity between the two states."

  This phrasing positions you clearly against the standard view while acknowledging the literature you are engaging with.
