answer: |-
  # Disambiguating the Slogan: "Absence of Evidence Isn't Evidence of Absence"

  ### 1. The Strict Logical Claim
  *   **The Claim:** You cannot deductively prove a hypothesis ($H$) is false solely because a specific piece of evidence ($E$) is missing. ($¬E$ does not logically entail $¬H$).
  *   **Status:** **Trivially True.** Logic alone forbids proving a negative without auxiliary premises.
  *   **Verdict on Fomenko:** **Irrelevant.** Historical science is not deductive proof; it is inference to the best explanation. This reading protects nothing because no one is claiming logical impossibility, only extreme improbability.

  ### 2. The Probabilistic (Bayesian) Claim
  *   **The Claim:** Missing evidence only lowers the probability of $H$ if we should have expected to find $E$ given $H$. If $E$ was unlikely to survive or be found anyway, $¬E$ tells us little.
  *   **Status:** **Defensible.** This is the correct statistical interpretation. Absence of evidence is evidence of absence *only when* evidence was expected.
  *   **Verdict on Fomenko:** **Falls Apart.** Fomenko's "shadow dynasty" implies massive global civilizations. For tree rings and inscriptions to be absent across all continents requires assuming a miraculous, universal preservation failure. The expectation of evidence ($P(E|H)$) is high; therefore, $¬E$ strongly supports $¬H$.

  ### 3. The Methodological Claim
  *   **The Claim:** Negative archaeological results are inconclusive unless search conditions were ideal (adequate survey, preservation potential, etc.).
  *   **Status:** **Defensible.** A lack of findings in an unexplored cave proves nothing. A lack of findings in a thoroughly excavated, preserved stratum proves much.
  *   **Verdict on Fomenko:** **Falls Apart.** Dendrochronology records are continuous and global for the periods in question. Epigraphic records are extensive. The "search conditions" are not missing; the data is missing despite the search.

  ### 4. The Immunization Strategy (Rhetorical Claim)
  *   **The Claim:** No amount of missing evidence can ever count against $H$. The hypothesis is insulated from negative results by definition.
  *   **Status:** **False (Pseudoscientific).** This renders a theory unfalsifiable. If missing evidence never counts, the theory cannot be tested.
  *   **Verdict on Fomenko:** **This is the Student's Error.** This is the only version that "protects" the reconstruction, but it does so by removing it from empirical scrutiny. It trades validity for invulnerability.

  ***

  ### Board Summary: The Expectation Test
  *   **When the slogan works:** The evidence is fragile, the search was poor, or the theory doesn't predict the evidence strongly. (e.g., "No wooden hut found" in a rainforest).
  *   **When the slogan fails:** The evidence is robust, the search was thorough, and the theory *requires* the evidence. (e.g., "No tree rings found" for a claimed global civilization).
  *   **Demarcation Rule:** If you must invoke the slogan to explain away *all* negative data, you are not doing history; you are doing mythology.
