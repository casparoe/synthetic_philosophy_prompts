answer: |-
  # The Trade-Off Diagnostic: A Self-Sort for Suffering-Focused Ethics

  **Instructions:** Read each case and select the option that best matches your moral judgement. Do not select the answer you think a specific theory requires; select the answer you actually endorse. Record your letters (A, B, C, or D) to compare against the key.

  **Option Key:**
  *   **A:** The action is morally **required** (or the outcome is strictly better).
  *   **B:** The action is **permissible** but not required (or the outcomes are roughly equal).
  *   **C:** The action is **forbidden** (or the outcome is strictly worse).
  *   **D:** There is **no fact of the matter** (indeterminate/vague).

  ---

  ### The Questions

  **1. The Spike (Momentary Threshold)**
  A device can deliver 100 years of mild, nagging discomfort to one person, or 10 seconds of excruciating, soul-shattering agony to another. You must choose one.
  *   **A:** Choose the 100 years of discomfort (minimise total suffering).
  *   **B:** Either choice is acceptable.
  *   **C:** Choose the 10 seconds of agony (the intensity threshold forbids the alternative).

  **2. The Drudge (Life-Total Threshold)**
  A life consisting entirely of mild boredom and minor headaches is pitted against a life containing one day of blissful ecstasy but otherwise identical.
  *   **A:** The life with ecstasy is better, even if the net suffering is slightly higher.
  *   **B:** The lives are incomparable.
  *   **C:** The life without the ecstasy is better (mild suffering over a lifetime blocks the value of pleasure).

  **3. The Aggregation (Intra-Pain Lexicality)**
  To prevent one person from undergoing one hour of torture, you can instead impose mild headaches on one million people.
  *   **A:** Impose the headaches (pain aggregates linearly).
  *   **B:** It is indeterminate whether to impose them.
  *   **C:** Do not impose the headaches (agony is lexically worse than any sum of mild pain).

  **4. The Commission (Action Constraint I)**
  You can press a button that gives a billion people a pleasant buzz, but this *causes* one innocent person to suffer one minute of extreme torture.
  *   **A:** Press the button.
  *   **B:** It is permissible either way.
  *   **C:** Do not press the button.

  **5. The Omission (Action Constraint II)**
  You can press a button that *prevents* one innocent person from suffering one minute of extreme torture, but this *costs* a billion people a pleasant buzz they would otherwise have had.
  *   **A:** Press the button (prevent the torture).
  *   **B:** It is permissible either way.
  *   **C:** Do not press the button (sacrificing the billion buzzes is forbidden).

  **6. The Option (Lexical vs. Incomparable)**
  You face a choice: Option X involves one person suffering extreme agony. Option Y involves no suffering but also no pleasure. There is no other consequence.
  *   **A:** Option Y is strictly better; choosing X is irrational.
  *   **B:** Choosing X is rationally permissible, though Y is nicer.
  *   **C:** Choosing X is forbidden.

  **7. The Lower Step (Sorites I)**
  Pain intensity is at level 5 (on a scale of 1–10, where 10 is agony). The compensating pleasure is enormous. Is the trade forbidden?
  *   **A:** No, it is permissible.
  *   **B:** It is indeterminate.
  *   **C:** Yes, it is forbidden.

  **8. The Upper Step (Sorites II)**
  Pain intensity is at level 6 (imperceptibly worse than level 5). The compensating pleasure is identical to Q7. Is the trade forbidden?
  *   **A:** No, it is permissible.
  *   **B:** It is indeterminate.
  *   **C:** Yes, it is forbidden.

  **9. The Sacrifice (Population Share)**
  One person suffers intensely so that every other member of a population of ten billion receives a trivial benefit.
  *   **A:** Permissible (the total benefit outweighs the cost).
  *   **B:** Indeterminate.
  *   **C:** Forbidden (one person's threshold cannot be breached for the many).

  **10. The Devil's Bargain (Extreme Trade)**
  One person suffers in hell for a century. In exchange, ten billion people live in heaven for a century.
  *   **A:** The trade is good/required.
  *   **B:** The trade is permissible but not required.
  *   **C:** The trade is forbidden.

  ---

  ### Scoring Key: Mapping Your Judgements

  Tally your responses to locate your position in the logical space.

  **Leaf 1: Moment-Lexical Negative Utilitarianism (MLNU)**
  *   **Pattern:** 1(C), 2(A or B), 3(C), 4(C), 5(A), 6(C), 7(A), 8(C), 9(C), 10(C).
  *   **Core Claim:** Suffering above a specific *momentary* intensity lexically dominates any amount of pleasure.
  *   **Awkward Commitment:** You must prevent a moment of mild torture even if it costs a universe of mild happiness, but you might allow a lifetime of mild misery to secure a moment of ecstasy.

  **Leaf 2: Life-Lexical Negative Utilitarianism (LLNU)**
  *   **Pattern:** 1(A or B), 2(C), 3(C), 4(C), 5(A), 6(C), 7(A), 8(C), 9(C), 10(C).
  *   **Core Claim:** The lexical threshold applies to the *total* suffering of a life, not isolated moments.
  *   **Awkward Commitment:** You may permit a moment of extreme agony if it ensures the rest of the life is blissful, provided the life's net total stays below the threshold.

  **Leaf 3: Tempered Negative Consequentialism (TNC)**
  *   **Pattern:** 1(A), 2(A), 3(A), 4(A), 5(A), 6(A), 7(A), 8(A), 9(A), 10(A).
  *   **Core Claim:** Suffering weighs more heavily than pleasure, but all goods are commensurable on a single scale.
  *   **Awkward Commitment:** Given enough pleasure, even the torture in Q1 becomes not only permissible but obligatory.

  **Leaf 4: Incomparabilism (INC)**
  *   **Pattern:** 1(B), 2(B), 3(B), 4(B), 5(B), 6(B), 7(B), 8(B), 9(B), 10(B).
  *   **Core Claim:** Certain intensities of pain and quantities of pleasure are rationally unranked; neither is better, nor are they equal.
  *   **Awkward Commitment:** In many significant choices, reason runs out, and there is no truth about whether you acted rightly or wrongly.

  **Leaf 5: Deontic Constraint View (DCV)**
  *   **Pattern:** 1(A), 2(A), 3(A), 4(C), 5(A), 6(C), 7(A), 8(C), 9(C), 10(C).
  *   **Core Claim:** Outcomes are comparable (TNC), but agents are constrained from *causing* threshold pain even for the best outcome.
  *   **Awkward Commitment:** You must let the torture happen (Q5) rather than cause it (Q4), even if the outcome is identical, making morality agent-relative rather than outcome-based.

  **Leaf 6: Vague Threshold View (VTV)**
  *   **Pattern:** 1(D), 2(D), 3(D), 4(C), 5(A), 6(C), 7(B), 8(B), 9(C), 10(C).
  *   **Core Claim:** There is a lexical threshold, but its location is inherently vague; there is no precise point where the trade flips.
  *   **Awkward Commitment:** There is no fact of the matter about whether specific borderline trades are forbidden, rendering moral guidance indeterminate in precise cases.

  ---

  ### Analysis of the Logical Space

  **Unoccupied or Problematic Cells**
  *   **Intra-Pain Non-Lexicality + Inter-Dimensional Lexicality:** A view that says mild pains can aggregate to outweigh agony (Q3=A), but agony cannot be outweighed by pleasure (Q1=C).
      *   *Status:* **Unexplored/Unattractive.** It posits a lexical gap between pain and pleasure but denies one within pain itself. It struggles to explain why pain is special enough to block pleasure but not special enough to block itself.
  *   **Population-Share Lexicality without Individual Lexicality:** A view that says Q9 is Forbidden, but Q1 is Permissible.
      *   *Status:* **Incoherent.** If an individual's momentary pain can be traded for pleasure (Q1), it is unclear why aggregating those trades across a population becomes forbidden solely due to distribution, unless one invokes a separate distributive principle.

  **Indistinguishable Leaves**
  *   **Tempered Negative Consequentialism (TNC) vs. Lexical Views (MLNU/LLNU):**
      *   *The Problem:* In any finite case presented in this quiz (e.g., Q10), a TNC view can mimic a Lexical view by assigning suffering a sufficiently high finite weight (e.g., $10^{100}$). No finite scenario can definitively prove that *no* amount of pleasure outweighs the pain, only that *this* amount does not.
      *   *Separation:* To separate these, one requires a question regarding **infinite quantities** (e.g., "Is an eternity of mild pleasure better than one minute of agony?") or a direct question about the **principle of trade-offs** (e.g., "Is there *any* conceivable amount of pleasure that justifies torture?"). The quiz avoids direct theoretical questions, so these leaves remain empirically equivalent within the scope of this diagnostic.

  **Note on Questions 4 & 5 (Action vs. Outcome)**
  *   This pair successfully isolates the **Deontic Constraint View (Leaf 5)**. If a respondent answers **C** to Q4 (Forbidden to cause) but **A** to Q5 (Required to prevent), they hold that the constraint is on *agency*, not *outcomes*. If they answer **C** to both, the constraint is axiological (the outcome containing the torture is worse). If they answer **A** to both, they are pure consequentialists. This pair does the work required.

  **Note on Questions 7 & 8 (Sorites)**
  *   This pair isolates the **Vague Threshold View (Leaf 6)**. A Sharp Threshold theorist (MLNU/LLNU) must admit there is a fact of the matter, even if they do not know it (answering A to one and C to the other). A Vague theorist answers **B** (Indeterminate) to the transition zone. However, a sceptic about moral knowledge might also answer B, conflating epistemic uncertainty with metaphysical vagueness. A follow-up question asking "Is there a fact of the matter even if we cannot know it?" would sharpen this distinction.
