answer: |-
  # The Stake-Sensitivity Diagnostic Tree
  **Target Audience:** Advanced High-School Philosophy Club  
  **Purpose:** To sort intuitions about whether practical stakes affect knowledge, bypassing jargon in favor of concrete case judgments.

  ## Part 1: The Decision Instrument
  Follow the four diagnostic splits below. Your path through the tree determines your philosophical "leaf."

  ### Split 1: The Bridge Case (Knowledge vs. Action)
  *Case:* You casually judge a bridge is safe. Moments later, you learn a school bus full of children will cross based on your judgment.
  *   **A. Knowledge Unchanged:** You still *know* the bridge is safe, but it is now irresponsible to *say* so or *act* on it without more check. (Go to **Leaf 1**)
  *   **B. Knowledge Shifts:** The high stakes mean you *no longer know* the bridge is safe, even if your evidence hasn't changed. (Go to Split 2)

  ### Split 2: The Nature of the Shift (Semantic vs. Metaphysical)
  *Case:* Assuming knowledge shifts (from Split 1B), *why* does it shift?
  *   **A. Semantic Shift:** The word "knows" is like "tall" or "here." Its meaning changes depending on the conversational context. In a low-stakes chat, "knows" is easy to satisfy; in a high-stakes chat, "knows" demands more. (Go to Split 3)
  *   **B. Metaphysical Shift:** The word "knows" means the same thing always. However, the actual *relation* of knowledge depends on the subject's practical situation. Stakes literally change whether you stand in the knowledge relation. (Go to Split 3)

  ### Split 3: Retrospective Revelation (Time Sensitivity)
  *Case:* You formed a belief years ago with moderate evidence, assuming stakes were low. You now discover catastrophic stakes *always existed* back then (hidden from you).
  *   **A. Disqualified:** You *never knew* it. The hidden stakes retroactively kill the knowledge claim. (Go to Leaf 4 or 5)
  *   **B. Intact:** You *did know* it then. Knowledge is fixed by the stakes as you reasonably understood them at the time. (Go to Split 4)

  ### Split 4: Distributed Stakes (Scope of Harm)
  *Case:* An analyst processes anonymized data. Individually, her error harms no one perceptibly. Aggregated with others, her error causes massive harm. She is unaware of the aggregate.
  *   **A. Affects Knowledge:** The collective harm raises the stakes for her, even if she is unaware. She does not know the data is correct. (Go to Leaf 6)
  *   **B. Ignores Distributed Stakes:** Only stakes the subject can reasonably access or that apply to them individually count. She knows the data is correct. (Go to Leaf 7)
  *   **C. Institutional Only:** Stakes only affect knowledge if the subject holds a specific professional role responsible for the aggregate. (Go to Leaf 8)

  ---

  ## Part 2: The Leaves (Position Taxonomy)
  *Mapping your path to established philosophical positions.*

  ### Leaf 1: Strict Invariantism
  *   **Path:** Split 1A (Action Only).
  *   **Description:** Knowledge is purely a function of evidence and truth. Stakes affect what you should *do* or *say* (pragmatics), but never what you *know* (semantics/metaphysics).
  *   **Status:** **Classic Position.** (e.g., Timothy Williamson, Jason Stanley's early foil).
  *   **Note:** This view must explain why we *feel* like we lose knowledge. Often appeals to the "Warranted Assertibility Maneuver" (WAM)—confusing "I shouldn't say I know" with "I don't know."

  ### Leaf 2: Epistemic Contextualism
  *   **Path:** Split 1B → Split 2A → Split 3B.
  *   **Description:** "Knows" is context-sensitive. In the past (low stakes context), you satisfied the conditions for "knows." Evaluating you now (high stakes context) uses a different standard, but we should respect the original context for past claims.
  *   **Status:** **Classic Position.** (e.g., Keith DeRose, David Lewis).
  *   **Note:** Relies on the distinction between the *context of use* (past) and *context of assessment* (present).

  ### Leaf 3: Assessment-Sensitive Contextualism (Relativism)
  *   **Path:** Split 1B → Split 2A → Split 3A.
  *   **Description:** The truth of a knowledge claim depends on the context of the person *assessing* it now. If high stakes exist now, the past claim "I knew" is false, even if it was acceptable then.
  *   **Status:** **Niche Variant.** (e.g., John MacFarlane's Relativism).
  *   **Note:** Distinct from standard Contextualism because it allows truth values to change over time without the subject changing their mind.

  ### Leaf 4: Radical Pragmatic Encroachment
  *   **Path:** Split 1B → Split 2B → Split 3A.
  *   **Description:** Knowledge is metaphysically sensitive to stakes. If high stakes existed (even hidden), the belief was never safe enough to count as knowledge.
  *   **Status:** **Unoccupied/Unattractive.**
  *   **Diagnosis:** **Incoherent/Unattractive.** Most encroachment theorists reject this because it makes knowledge too luck-dependent. If stakes are hidden from the agent, it seems unfair to say they lacked knowledge. It collapses the distinction between *justification* and *truth*.

  ### Leaf 5: Standard Pragmatic Encroachment (SSI)
  *   **Path:** Split 1B → Split 2B → Split 3B → Split 4B.
  *   **Description:** Knowledge depends on the subject's practical situation (Subject-Sensitive Invariantism). However, it relies on the stakes the subject is aware of or reasonably faces at the time. Hidden or aggregate stakes don't count.
  *   **Status:** **Classic Position.** (e.g., Jeremy Fantl & Matthew McGrath, Jason Stanley).
  *   **Note:** This is the main rival to Contextualism. It keeps the meaning of "knows" fixed but changes the conditions for having it.

  ### Leaf 6: Collective Encroachment
  *   **Path:** Split 1B → Split 2B → Split 3B → Split 4A.
  *   **Description:** Knowledge is sensitive to aggregate harm, even if the individual is unaware. The external risk profile determines knowledge, not the internal perspective.
  *   **Status:** **Unexplored/Contested.**
  *   **Diagnosis:** **Unexplored.** This pushes encroachment into externalism about stakes. It is rarely defended because it severs the link between rationality and knowledge (how can I be irrational for ignoring stakes I couldn't know?).

  ### Leaf 7: Moderate Encroachment (Default)
  *   **Path:** Split 1B → Split 2B → Split 3B → Split 4B.
  *   *(Note: This is effectively the same logical space as Leaf 5, but distinguished by emphasis on individual awareness. For the sake of the tree, Leaf 5 and 7 are often merged in literature, but we separate them to highlight the Distributed Stakes question.)*
  *   **Refinement:** Let's designate **Leaf 7** as **Interest-Relative Invariantism (Strict)**.
  *   **Description:** Stakes matter, but only if they are salient to the agent's interests. Distributed/anonymous stakes are irrelevant.
  *   **Status:** **Standard Variant.**

  ### Leaf 8: Institutional Encroachment
  *   **Path:** Split 1B → Split 2B → Split 3B → Split 4C.
  *   **Description:** Stakes affect knowledge only when the subject occupies a role (e.g., doctor, engineer) that binds them to collective outcomes. Private belief remains stake-insensitive; professional knowledge is stake-sensitive.
  *   **Status:** **Hybrid/Niche.**
  *   **Diagnosis:** **Unexplored.** This view attempts to save common sense (I know the bridge is safe for my walk) while accounting for professional responsibility (I don't know it's safe for the bus). It treats knowledge as partially normative based on social role.

  ---

  ## Part 3: Diagnostic Analysis

  ### 1. Empty and Incoherent Combinations
  *   **The "Radical Retro" Gap (Leaf 4):** Very few philosophers accept that hidden past stakes disqualify past knowledge (Split 2B + 3A).
      *   *Diagnosis:* **Unattractive.** It implies knowledge is not a cognitive achievement but a metaphysical lottery dependent on hidden facts about the world's danger level. It makes "I knew it then" almost always false in hindsight.
  *   **The "Semantic + Distributed" Gap:** A view that claims "knows" changes meaning (Contextualism) *and* is sensitive to unconscious aggregate stakes (Split 2A + 4A).
      *   *Diagnosis:* **Incoherent.** Contextualism ties meaning to *conversational* context (what is salient to speakers). Unconscious aggregate stakes are, by definition, not salient to the conversation. Combining them contradicts the core mechanism of Contextualism.

  ### 2. Blind Spots: What This Tree Fails to Separate
  While this instrument sorts the major camps, four questions cannot distinguish everything.
  *   **Strict Invariantism vs. WAM Invariantism:** Both land on **Leaf 1**.
      *   *The Gap:* Both say stakes don't change knowledge. However, **WAM (Warranted Assertibility Maneuver)** proponents say we *confuse* knowledge with assertibility, while **Pure Invariantists** say we simply make errors in high stakes.
      *   *Required Distinction:* A question about *psychological error*: "In high stakes, are we making a mistake about what we know, or a mistake about what we should say?"
  *   **Contextualism vs. Relativism:** Both land on the Semantic branch (Split 2A).
      *   *The Gap:* Split 3 attempts to separate them (Intact vs. Disqualified), but some Contextualists allow assessment-sensitivity.
      *   *Required Distinction:* "Who sets the standard? The speaker at the time of utterance, or the listener at the time of evaluation?"
  *   **Standard vs. Institutional Encroachment:** Both land on the Metaphysical branch (Split 2B).
      *   *The Gap:* Split 4C isolates Institutional, but a Standard Encroachment theorist might argue institutional stakes are just high individual stakes (risk of firing).
      *   *Required Distinction:* "Does the stake sensitivity vanish if the agent quits their job but keeps the same evidence?"

  ### 3. Settled vs. Contested Terrain
  For your study group, distinguish between conceptual clarifications (settled) and substantive disagreements (contested).

  | Issue | Status | Explanation |
  | :--- | :--- | :--- |
  | **Semantic vs. Metaphysical** | **Broadly Settled** | Philosophers agree this is a coherent distinction. Contextualism says the *word* changes; Encroachment says the *world/relation* changes. The debate is which one is true, not whether they are different. |
  | **Retrospective Coherence** | **Genuinely Contested** | There is no consensus on whether hidden past stakes can invalidate past knowledge. Some argue knowledge is factive and time-indexed (Intact); others argue risk is objective (Disqualified). |
  | **Distributed Stakes** | **Genuinely Contested** | It is unclear if "stakes" require subjective awareness. Externalists say yes (risk is real); Internalists say no (risk must be accessible). This is an open research frontier. |
  | **Encroachment Collapsing** | **Disputed (Do Not Treat as Consensus)** | Some argue Encroachment is just Contextualism in disguise. **Do not present this as fact.** It is a criticism leveled by Invariantists, but Encroachment theorists vigorously deny it. |

  ## Instructor's Note for Discussion
  When using this tree with students, emphasize that **Leaf 1 (Invariantism)** is the "default" common-sense view, while **Leaf 5 (Standard Encroachment)** is the most popular challenger. The most fertile ground for new arguments lies in **Leaf 6 (Collective)** and **Leaf 8 (Institutional)**, as these address modern problems (big data, professional ethics) that 20th-century epistemology did not fully anticipate. Encourage students to test if their intuitions change when the "subject" is an AI or a corporation rather than a human.
