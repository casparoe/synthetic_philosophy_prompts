  So, it requires Distribution and Factivity. It does *not* require knowing all logical consequences. The text says "assumes knowers are logically omniscient". This is technically false. It assumes *conjunctive closure*. Many philosophers conflate the two, but in an audit, I must distinguish them. The text's concession ("Almost no one defends that now") is therefore misleading because conjunctive closure *is* widely defended/assumed in epistemic logic, whereas full omniscience is not.

