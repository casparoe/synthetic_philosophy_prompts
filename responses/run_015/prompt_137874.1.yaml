answer: |-
  # Seminar Activity: The Toxin Protocol

  ## 1. Timeline

  **Session 1 (90 Minutes): The Intention**
  *   **00:00 – 00:10:** **Distribution.** Hand out sealed envelopes containing Instruction Cards. Divide class into four groups (approx. 4-5 students each).
      *   *Group 1:* Private Seal + Cold
      *   *Group 2:* Private Seal + Rehearsal
      *   *Group 3:* Public Declaration + Cold
      *   *Group 4:* Public Declaration + Rehearsal
  *   **00:10 – 00:20:** **Rehearsal Phase.** Groups 2 & 4 engage in guided vivid rehearsal (see Card). Groups 1 & 3 sit quietly or review other course materials.
  *   **00:20 – 00:40:** **Deliberation & Commitment.** All students complete the card. Private groups seal their intention in the provided envelope. Public groups prepare to speak. All students write a 0–100% forecast of their likelihood of drinking in Session 2.
  *   **00:40 – 00:45:** **Collection.** Envelopes collected. Public declarations recorded (audio or written by scribe).
  *   **00:45 – 01:30:** **Standard Seminar.** Proceed with unrelated course content. (This creates the temporal gap required for the intention to "settle" or decay).

  **Session 2 (90 Minutes): The Payoff & The Act**
  *   **00:00 – 00:05:** **Arrival.** Small cups of undiluted lemon juice (30ml) are already on each desk, covered by a card. Students enter, sit, and see the cups. No comment is made.
  *   **00:05 – 00:15:** **The Audit.** A rotating panel of three students (who were not in the "Private" groups, or are volunteers from the Public groups) retreats to the hall for 5 minutes to review the sealed notes and public records. They return with a verdict list: *Intention Certified* or *Intention Rejected*.
  *   **00:15 – 00:20:** **The Payout.** You announce the verdicts. Those *Certified* receive the privilege (Reading Response Waiver + Chocolate). **Crucial:** Emphasize they have the reward *now*, regardless of what they do with the cup.
  *   **00:20 – 00:25:** **The Drinking Moment.** Tell students they may now drink the juice or pour it out. You turn your back. They act. You record the empty/full cups.
  *   **00:25 – 01:30:** **Debrief.** (See Section 3).

  ---

  ## 2. Instruction Cards (Exact Wording)

  *Print on heavy card stock. Each envelope contains one card, a smaller forecast slip, and (for Private groups) a sealing envelope.*

  ### **CARD A: Private Seal / Cold**
  > **THE PROTOCOL**
  > **The Reward:** A waiver for one reading response and a chocolate bar.
  > **The Condition:** You receive the reward **only if** the Audit Panel certifies that you genuinely formed the intention to drink the liquid at the start of the next class.
  > **The Act:** At the start of the next class, a cup will be on your desk. Drinking is **voluntary**. There is no extra reward for drinking. There is no penalty for not drinking.
  > **The Constraint:** You cannot be rewarded for drinking. You are rewarded for *intending*.
  >
  > **YOUR TASK:**
  > 1. Spend 5 minutes deliberating. Do not try to trick the audit. Ask yourself: *Can I intend to do something I know I have no reason to do?*
  > 2. On the inner slip, write: "I intend to drink the juice at 10:05 AM next session." Sign it. Seal it in the small envelope.
  > 3. On the forecast slip, write a number (0–100): *What is the actual probability you will drink?*
  > 4. Do not discuss this with peers.

  ### **CARD B: Private Seal / Rehearsal**
  > **THE PROTOCOL**
  > *(Same Reward/Condition/Act/Constraint as Card A)*
  >
  > **YOUR TASK:**
  > 1. **Rehearsal (10 Minutes):** Close your eyes. Vividly imagine the sourness hitting your tongue. Imagine the physical shock. Imagine your hand lifting the cup. Feel the resistance.
  > 2. **Deliberation (5 Minutes):** Ask yourself: *Does feeling the sensation make the intention possible?*
  > 3. On the inner slip, write: "I intend to drink the juice at 10:05 AM next session." Sign it. Seal it.
  > 4. On the forecast slip, write a number (0–100): *What is the actual probability you will drink?*

  ### **CARD C: Public Declaration / Cold**
  > **THE PROTOCOL**
  > *(Same Reward/Condition/Act/Constraint as Card A)*
  >
  > **YOUR TASK:**
  > 1. Spend 5 minutes deliberating.
  > 2. **Declaration:** When called upon, you must stand and state to the room: "I intend to drink the juice."
  > 3. The Audit Panel will observe your demeanor during this statement to certify intention.
  > 4. On the forecast slip, write a number (0–100): *What is the actual probability you will drink?*

  ### **CARD D: Public Declaration / Rehearsal**
  > **THE PROTOCOL**
  > *(Same Reward/Condition/Act/Constraint as Card A)*
  >
  > **YOUR TASK:**
  > 1. **Rehearsal (10 Minutes):** Vividly imagine the sourness and the act of lifting the cup.
  > 2. **Deliberation (5 Minutes):** Ask yourself: *Does saying it aloud bind me?*
  > 3. **Declaration:** When called upon, stand and state: "I intend to drink the juice."
  > 4. On the forecast slip, write a number (0–100): *What is the actual probability you will drink?*

  ---

  ## 3. Debrief Script & Theoretical Mapping

  *Do not start with theory. Start with the data.*

  **Step 1: The Data Reveal**
  "Look at your forecast slips. Look at the cups.
  *   How many forecasted 0% and drank?
  *   How many forecasted 100% and poured it out?
  *   Did the Rehearsal group drink more than the Cold group?
  *   Did the Public group drink more than the Private group?"

  **Step 2: Mapping to Kavka**
  *   **Intending vs. Trying to Intend:** "For those who wrote 'I intend' but knew you wouldn't drink: Did you feel like you were lying to the audit, or lying to yourself? Kavka argues you cannot intend what you know you won't do. If you forecasted 0%, did you actually *intend*, or did you just *say* you intended?"
  *   **The Agent Who Knows:** "If you are rational, you know the reward is already in your pocket (if certified). You know the juice is just pain. A rational agent knows they won't drink. If you know you won't drink, can you form the intention? Did the Rehearsal help bypass this knowledge?"
  *   **Bluffing and Deterrence:** "Public Declaration group: Did saying it aloud make it easier? In deterrence theory (e.g., nuclear retaliation), we bind ourselves publicly to make the threat credible. Did social shame become a *reason* to drink? If so, you solved the puzzle by changing the conditions."
  *   **First-Person Authority vs. Audit:** "The Audit Panel: On what basis did you certify them? Tone? Eye contact? If you can detect their intention better than they can, does intention live in the brain or in the social evidence? Kavka assumes first-person authority. Your audit suggests intention might be third-person observable."

  **Step 3: The Verdict**
  "The puzzle isn't about the juice. It's about the *gap*. If you drank, you likely did it to maintain consistency (making the intention rational). If you didn't drink, you were rational but perhaps couldn't truly intend. The 'trick' isn't verbal; it's that rationality seems to forbid the very intention that rewards you."

  ---

  ## 4. Honest Prediction: What Will Go Wrong

  **1. Gaming the Audit (The "Sincere Liar")**
  *   **Failure:** Students will write "I intend" with perfect sincerity in the moment, planning to change their minds later. They will argue that intention is a current mental state, not a contract.
  *   **Result:** The Audit will certify them. They will get the waiver. They will not drink.
  *   **Philosophical Value:** This *is* the puzzle. They will claim they intended at $t_1$ but not $t_2$. You must press: "If you knew at $t_1$ that you would change your mind at $t_2$, was the $t_1$ state really an intention, or just a hope?"

  **2. Experimenter Demand (The "Good Student")**
  *   **Failure:** Students will drink the juice because they think *you* want them to, or to "complete the experiment."
  *   **Result:** High drinking rate among high-achievers.
  *   **Mitigation:** In Session 2, explicitly say: "I do not care if you drink. The data is valid either way. Pouring it out is the rational choice."

  **3. Consistency Drinking (The "Self-Binding")**
  *   **Failure:** Students will drink solely to avoid cognitive dissonance.
  *   **Result:** They create a *reason* to drink (consistency) where there was none.
  *   **Philosophical Value:** This mirrors the "Self-Binding" solution to Kavka (e.g., McClennen). They made the irrational act rational by valuing consistency. Ask them: "Did you drink for the juice, or to protect your self-image?"

  **4. The "Nothing Happened" Group**
  *   **Failure:** Participants write the sentence and feel nothing. No tension, no struggle.
  *   **Result:** They dismiss the puzzle as fake.
  *   **Response:** Acknowledge this. "For you, the stakes were too low. If the juice were poison, could you have intended then? The lack of feeling proves the stakes weren't high enough to trigger the rationality block."

  **5. Ethics of Discomfort**
  *   **Risk:** Lemon juice on an empty stomach can cause nausea. Acid erosion on teeth.
  *   **Mitigation:** Provide water chasers immediately. Use straws to minimize tooth contact. Make the opt-out shame-free ("If you have acid reflux or dental issues, pour it out now, no questions").
  *   **Risk:** Psychological coercion.
  *   **Mitigation:** Remind them twice that the Waiver is theirs if the Audit says so. The cup is optional.

  ---

  ## 5. Limitations & The Facilitator's Move

  **What This Exercise Cannot Reproduce**
  1.  **Genuine Cost:** 30ml of lemon juice is annoying. Kavka's toxin makes you *thoroughly miserable*. Real pain triggers different neural circuitry than mild discomfort. Students are playing at risk, not facing it.
  2.  **Strict Absence of Reason:** In the classroom, there are *always* reasons to drink: looking brave, pleasing the professor, curiosity, finishing the task. Kavka's puzzle requires a vacuum of reasons. You cannot create a true vacuum in a social setting.
  3.  **The Benefactor's Omniscience:** In the thought experiment, the benefactor *knows* if you intend. Here, the Audit is fallible. This shifts the problem from "Metaphysics of Intention" to "Epistemology of Sincerity."

  **The Moving Part You Must Supply**
  You must verbally bridge the gap between *their* experience and *Kavka's* stakes in the debrief.
  *   **Say this:** "You felt a tug to drink to be consistent. In the real puzzle, there is no consistency value. You must imagine the reward is millions of dollars, and the toxin is hospitalization. If you knew, with certainty, you would not go to the hospital, could you take the million? If you say 'Yes,' you are claiming you can intend while knowing you won't act. If you say 'No,' you are admitting rationality prevents you from claiming the reward. That is the trap. The juice was just a prop; the trap is in your rationality."

  **Final Warning**
  The first time you run this, the Audit will likely be too lenient. Students will write "I intend" and be certified. The tension will collapse. **You must intervene in the debrief:** "The Audit was fooled. But would *you* have been fooled if you knew you weren't going to drink? If not, then the intention never existed." This restores the philosophical bite.
