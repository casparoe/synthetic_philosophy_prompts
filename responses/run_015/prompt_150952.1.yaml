          *   *Re-evaluation:* The prompt asks to identify *one* where the procedure flags it as incoherent but I should keep it.
          *   Line A is the textbook Frege-Geach case. "Murder is wrong" (Attitude) + "If Murder is wrong" (Proposition). Strict expressivism says you can't use the same phrase for both. But characters *must* reason this way.
