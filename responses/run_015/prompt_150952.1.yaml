          *   *Selection:* Line A is the clearest example of the embedding problem. However, Line B feels more like "real people talk." Let's look closer. Line A is valid reasoning (Modus Ponens). Line B is a rhetorical flourish. Line C is an observation of hypocrisy/complexity.
          *   *Prompt Requirement:* "for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway."
          *   *Choice:* Line A. It's the direct Frege-Geach embedding. It's logically "shaky" for an expressivist because the meaning of "wrong" shifts from expression to condition. But it's essential for legal/rational dialogue.
          *   *Wait, actually:* Line B is often cited as harder for expressivists than simple conditionals. But Line A is the *definition* of the problem. Let's go with Line A as the "flagged but keep" because it's necessary for the plot logic (the trial).
          *   *Alternative:* Line C involves "believing" a moral claim. Expressivists struggle with moral belief vs. moral attitude.
          *   *Decision:* I will select **Line A**. It is the quintessential Frege-Geach case. It treats "wrong" as a fact in the second clause. Strict expressivism says this is a category error. But a lawyer/character *must* talk this way to argue.
          *   *Wait, looking at the "Hard Cases" mentioned in prompt:* "Moral parentheses" and "Counterfactual moral planning."
          *   Line A fits "Counterfactual/Conditional reasoning."
          *   Let's check the constraints again. "Identify which one and say what consistency i'm sacrificing."
          *   Okay, I'll flag Line A. Sacrificing semantic consistency for logical flow.

      *   *Refining the "Keep Anyway" choice:* Actually, Line B ("Either... or...") is often considered *more* problematic than simple conditionals in some literature, but Line A is the classic example. However, for a novelist, Line A sounds like rational argumentation. Line B sounds like emotional distress. Line C sounds like character observation.
      *   *Better Choice:* **Line A**. Why? Because it explicitly repeats the phrase "Murder is wrong" first as an assertion, then as a condition. This highlights the shift in function.
      *   *Wait, let's look at the "Moral Parentheses" hard case:* "if what she said—'stealing is wrong'—holds, then..." None of the lines A, B, C are exactly that. Line C is close ("She doesn't believe bribery is wrong").
      *   *Okay, I will stick with Line A as the primary example of the Embedding Problem.*

  5.  **Addressing Limitations:**
      *   Sincerity vs. Irony: Checklist can't detect tone.
      *   Mixed Description/Evaluation ("The wrongness... sparked the riot"): This reifies wrongness as a causal force. Expressivism hates this. Checklist should flag it as "Metaphorical Risk."
      *   Voice vs. Logic: Sometimes characters sound stupid or inconsistent because they *are*. Checklist shouldn't "fix" character voice.

  6.  **Formatting and Tone:**
      *   Keep it tight. 10-minute read.
