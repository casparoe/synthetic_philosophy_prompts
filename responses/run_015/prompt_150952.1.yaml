      *   **Time Limit:** Must take 10 minutes max per scene.
      *   **Tone:** Practical, honest, tailored to a writer, not an academic lecture.

  2.  **Deconstruct the Philosophy (Expressivism & Frege-Geach):**
      *   *Expressivism:* "Murder is wrong" = "Boo murder!" (Expression of attitude), not "Murder has the property of wrongness" (Fact).
      *   *Frege-Geach Problem:* If "Murder is wrong" is just "Boo murder!", what does "If murder is wrong..." mean? You can't say "If Boo murder!..." It looks like nonsense because the attitude isn't being expressed in the conditional, just mentioned.
      *   *The Writer's Problem:* Characters need to reason logically about morals. If the philosophy says moral reasoning is logically broken, the characters might sound incoherent. The goal is to make sure they sound *psychologically* consistent even if *logically* shaky under strict expressivism.

  3.  **Drafting the Checklist (The Procedure):**
      *   Needs to be simple. No jargon like "illocutionary force" unless defined simply.
      *   *Step 1: Identify the Attitude.* What is the character actually feeling/doing? (Approving, disapproving, commanding).
      *   *Step 2: Spot the Embedding.* Is the moral bit inside an "If," "Or," "Not," or "She said that..."?
      *   *Step 3: The Consistency Test.* Does the attitude hold up across the sentence? If I say "If X is wrong," am I treating "X is wrong" as a fact I can use, or an attitude I'm holding?
      *   *Judgment Call Flag:* Where does logic clash with voice?

  4.  **Applying the Procedure to Lines A, B, C:**

      *   *Line A:* "Murder is wrong, and if murder is wrong then the judge should halt the trial."
          *   Analysis: Classic Modus Ponens. Expressivism struggles here because the second "murder is wrong" isn't expressing an attitude, it's functioning as a proposition.
          *   Verdict: Technically problematic for strict expressivism (commitment vs. usage), but standard reasoning.

      *   *Line B:* "Either torture is wrong or i've completely lost my moral compass."
