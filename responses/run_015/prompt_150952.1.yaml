prompt: |-
  hey, i'm a novelist drafting a dialouge-heavy book and i want to check whether my characters' moral talk actually hangs together if you read it through an expressivist lens—like, moral sentences express attitudes not facts, and then you hit the Frege-Geach embedding problem when those sentences get stuck inside conditionals or negations. i need this turned into an actual procedre my editor (just me, honestly) can run on any scene without a philosophy degree. make it a checklist: step one, identify the speech act; step two, check if it's embedded; step three, apply the consistency test; and flag exactly where i have to make a judgment call instead of following a rule. the hard cases i keep occuring in my draft are moral parentheses—where a character quotes someone else's moral claim inside their own reasoning, like "if what she said—'stealing is wrong'—holds, then..."—and counterfactual moral planning, where a character figures out obligations in worlds where the wrong act turned out right. please apply the procedre to these three lines:

  A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."
  B. "Either torture is wrong or i've completely lost my moral compass."
  C. "She doesn't believe bribery is wrong, yet she refuses to take the money."

  for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway because real people talk like that—identify which one and say what consistency i'm sacrificing. also be honest about what the checklist can't do: can it tell sincere from ironic moral talk? can it handle sentences that mix description and evaluation, like "the wrongness of the act sparked the riot"? and where does it just fail because voice matters more than logical form? i need this to take ten minutes max per scene, and i'm the only person signing off.
