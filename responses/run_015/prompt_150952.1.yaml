answer: |-
  # The 10-Minute Expressivist Consistency Checklist

  **Goal:** Ensure your characters' moral dialogue sounds psychologically real without tripping over logical contradictions that break the reader's immersion.
  **Time:** 10 minutes per scene.
  **User:** Author/Editor (You).

  ### Step 1: Identify the Speech Act
  Underline every moral sentence (e.g., "Stealing is wrong," "You should go"). Ask: **Is the character *feeling* something or *stating* something?**
  *   **Expressivist View:** They are expressing an attitude (Boo! / Hooray!) or a command.
  *   **Realist View:** They are stating a fact about the universe.
  *   **Action:** Mark the sentence **[ATTITUDE]** if it feels like emotion/command, or **[FACT]** if it feels like a description of reality.
  *   *Judgment Call Flag:* If a character switches between [ATTITUDE] and [FACT] in the same breath without irony, note it.

  ### Step 2: Check for Embedding
  Look for moral sentences trapped inside other structures. Circle words like **If, Or, Not, Because,** or **She said that...**
  *   **The Trap:** You can't easily put an attitude inside a condition. ("If Boo murder!..." makes no sense).
  *   **Action:** If a moral sentence is embedded, ask: **Is the character still expressing the attitude here, or just using the idea?**
  *   *Hard Case Note:* **Moral Parentheses** (e.g., "If what she said—'stealing is wrong'—holds..."). Treat the quoted part as a *prop*, not the character's current attitude.
  *   *Hard Case Note:* **Counterfactual Planning** (e.g., "If stealing had been right, we'd be rich"). Ensure the character knows they are simulating a world, not changing their mind.

  ### Step 3: Apply the Consistency Test
  Read the full logical chain. Does the moral term mean the same thing at the start and end?
  *   **Action:** If Character says "X is wrong" and then "If X is wrong...", they are treating "wrong" as both a feeling and a fact.
  *   **Verdict:**
      *   **Consistent:** The attitude remains stable (e.g., "I hate lying, so if you lie, I'll be angry").
      *   **Inconsistent:** The grammar treats the attitude like a physical object (e.g., "The wrongness hit him").
  *   *Judgment Call Flag:* **Voice > Logic.** If fixing the logic makes the character sound like a robot, mark **[KEEP VOICE]**.

  ---

  ### Application to Your Draft Lines

  Here is how the checklist processes your three specific examples.

  **Line A: "Murder is wrong, and if murder is wrong then the judge should halt the trial."**
  *   **Step 1:** First clause is **[ATTITUDE]** (Disapproval). Second clause uses "murder is wrong" as a **[FACT]** condition.
  *   **Step 2:** **Embedded.** The moral claim is inside an "If" statement.
  *   **Step 3:** **Inconsistent.** Strict expressivism says you can't use the same phrase to express a feeling *and* as a logical premise. The meaning of "wrong" shifts mid-sentence.
  *   **Editor's Note:** This is the classic Frege-Geach problem.

  **Line B: "Either torture is wrong or i've completely lost my moral compass."**
  *   **Step 1:** **Mixed.** The first half looks like a fact check; the second is self-doubt.
  *   **Step 2:** **Embedded.** Inside an "Either/Or" structure.
  *   **Step 3:** **Consistent (Psychologically).** The character isn't asserting torture is wrong; they are asserting their *uncertainty*. The attitude being expressed is "Confusion," not "Disapproval."
  *   **Editor's Note:** This passes because the main point is the speaker's state of mind, not the status of torture.

  **Line C: "She doesn't believe bribery is wrong, yet she refuses to take the money."**
  *   **Step 1:** **Report.** This describes someone else's mind.
  *   **Step 2:** **Embedded.** Inside "She doesn't believe..."
  *   **Step 3:** **Consistent.** Expressivism struggles with "belief" (you believe facts, you hold attitudes), but in fiction, reporting on another's psychology is safe.
  *   **Editor's Note:** No logical conflict here, just a character observation.

  ---

  ### The "Keep Anyway" Verdict

  **Flagged Line:** **Line A** ("Murder is wrong, and if murder is wrong...")

  **Why it's technically incoherent:** On strict expressivist grounds, the first "wrong" expresses a sentiment, while the second "wrong" functions as a truth-apt proposition. You are treating a feeling like a building block. A strict philosopher would say the sentence commits a category error.

  **Why you should keep it:** **Argumentative Clarity.** Real people reason using Modus Ponens (If P, then Q). If you force your lawyer/character to speak in pure expressivist terms ("Boo murder! And given that booing, the judge should..."), they will sound insane.
  **Consistency Sacrificed:** You are sacrificing **semantic uniformity** (the word "wrong" meaning the exact same thing twice) for **logical flow**. Readers expect moral arguments to follow logical rules, even if the philosophy underneath is messy.

  ---

  ### Limitations: What This Checklist Can't Do

  Be honest with yourself when you sign off. This tool has blind spots:

  1.  **Sincerity vs. Irony:** The checklist analyzes structure, not tone. It cannot tell if a character is being sarcastic. If a villain says "Kindness is good" while stabbing someone, the checklist sees a moral claim; you need to hear the voice.
  2.  **Mixed Description/Evaluation:** Sentences like *"The wrongness of the act sparked the riot"* treat "wrongness" as a causal force (a fact). The checklist will flag this as **[FACT]**.
      *   *Advice:* Keep it if it's metaphorical. Delete it if the character literally thinks "wrongness" is a physical energy.
  3.  **Voice > Logic:** This is the big one. The checklist might flag a stuttering, confused character as "Inconsistent." **Ignore the flag.** If the logical inconsistency reveals their moral confusion, that is a feature, not a bug.
  4.  **The "Moral Parentheses" Hard Case:** When a character says, *"If what she said—'stealing is wrong'—holds..."*, the checklist might flag the embedding.
      *   *Advice:* Trust the quotes. The character is distancing themselves from the attitude. This is logically safe for expressivism because they are mentioning the sentence, not using it.

  **Final Sign-Off:**
  Run the checklist. If Line A appears, let it slide. If a character sounds like a philosophy textbook, cut it. If they sound like a human struggling to justify their feelings, you've succeeded.
