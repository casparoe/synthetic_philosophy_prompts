  **Recommendation**

  I recommend that the Committee rule that Ordinance 31 has not been breached in this instance. The colleague requires no retroactive consent, and the anonymous complaint should be dismissed without further action. We should instruct the Administrator to update her guidance notes immediately, clarifying that the Ordinance applies only where the teaching relates to the student's assessment or degree progression at Marchmont. This decision must be formalised at our meeting on the 28th. It is vital we avoid creating a precedent that chills legitimate scholarly dissemination while protecting the University's integrity against conflicts of interest. The Administrator's initial advice was substantively correct, though the reasoning requires tightening. We should not impose penalties, nor should we require a fresh application for consent. The bottom line is that the Ordinance governs conflicts of authority, not all commercial interactions involving students. We must signal that public engagement is valued, provided it does not compromise our assessment duties.

  **The readings available, and what else each of them catches**

  Three genuine readings exist, each dragging different consequences. First, the strict textual reading: any remuneration for teaching any registered student, regardless of context. This catches the Economics colleague's course, but it also catches colleagues receiving textbook royalties when students buy books for unrelated courses, and academics paid for external examining of our own graduates. It treats 'registered student' as a consumer label rather than denoting an academic subordinate. It would also capture income from open summer schools if a single Marchmont student enrolled, potentially discouraging staff from offering public education. It criminalises normal scholarly dissemination and creates a trap for the unwary. It creates a chilling effect on knowledge exchange between staff and the wider community. It ensures uniform application but at the cost of common sense.

  Second, the purposive reading: teaching that implicates the University's academic authority over that student. This catches private coaching for Marchmont examinations—the specific 1937 scandal—but excludes textbooks, external examining, and unrelated short courses. It limits the scope to conflicts of interest where staff might leverage institutional power for private gain regarding University assessments. It aligns with the minutes suggesting the target was profiting from 'their own students' towards 'their own papers'. It protects the integrity of degrees without regulating private commerce. However, it requires the Committee to judge the 'relatedness' of courses, which demands subject knowledge and risks inconsistent judgments across departments.

  Third, a discretionary reading: the text applies universally, but the Committee grants blanket waivers for benign cases. This catches everything technically but relies on administrative grace. It creates uncertainty for staff, who must apply for consent even for textbooks, trusting the Committee will not object. It burdens the Committee with trivialities and risks inconsistent outcomes depending on who sits on the panel. It turns a rule of conduct into a lottery of permission, damaging morale. It also catches incidental interactions, such as paid tutoring for alumni who retain student status during writing-up periods. This diverts Committee time from serious conflicts to administrative box-ticking. Each reading offers a different balance between certainty and fairness, and the Committee must choose which value prevails. The textualist prioritises certainty; the purposivist prioritises fairness. The discretionary approach prioritises administrative control. Ultimately, the choice determines whether the Ordinance is a shield for students or a shackle for staff.

  **Why I recommend the reading I do**

  I recommend the purposive reading. The primary reason is the avoidance of absurdity. A regulation cannot be understood to prohibit textbook royalties when the entire academic enterprise relies on them; if the Council intended such a sweeping restriction, it would have stated it explicitly. The 1937 context confirms this: the Ordinance was a response to a specific corruption risk, not a general ban on commercial activity. The 'registered student' clause identifies the vulnerability—the power imbalance between examiner and candidate—not merely the status of the learner.

  Furthermore, the 1971 vote does not mandate a textualist reading. Defeating an amendment to narrow the text does not prove an intent to broaden the purpose; it may simply indicate the Council believed the existing purpose was sufficiently clear without codifying limitations. To read the text without the purpose is to ignore the reason the rule exists. We are stewards of the University's integrity, not automatons enforcing syntax. The colleague's course poses no conflict of interest; the students are not his to assess, nor does the course prepare them for his papers. Finding a breach here would transform a safeguard into a barrier against public engagement.

  We must also select the correct level of generality for the purpose. One might argue the purpose is 'protecting students generally', but that is too broad and unsupported by history. The specific purpose is 'protecting the assessment relationship from commercial conflict'. At this level, the text makes sense. The Economics colleague's students are not dependent on him for grades. The textual reading ignores this distinction. By adopting the purposive view, we align the rule with the reality of academic work. We acknowledge that words derive meaning from their setting. A ban on 'teaching students' in a University context implies teaching within the University's academic sphere, not teaching in the global marketplace where students happen to be enrolled elsewhere. This distinction is crucial for maintaining staff morale and encouraging innovation.

  **The strongest argument for the other reading**

  The strongest argument for the textual reading rests on legal certainty and democratic authority. The words are plain: 'any person who is a registered student'. To qualify this with unwritten limitations is to rewrite the Council's work. The 1971 defeat of the narrowing amendment is significant; the Council had the chance to limit the Ordinance to examination preparation and chose not to. This suggests a deliberate choice for breadth.

  Furthermore, purposivism invites arbitrariness. Who decides which courses are 'related' enough? Is a statistics course for managers related to an Economics degree? What if a student takes it to supplement their studies? A textual rule provides a bright line: if they are a student, you need consent. This protects staff from accusations of favouritism and ensures the Committee retains oversight over all financial relationships involving students. Reliance on 'shared understanding' is risky; norms change, but text remains. If we ignore the text because the outcome seems benign here, we weaken the rule for cases where the outcome is malign. Consistency requires applying the words as written, even if it requires us to grant retroactive consent rather than deny a breach.

  The real risk of the purposive reading is that it grants this Committee too much discretion. We become the arbiters of what constitutes a 'conflict', rather than enforcers of a clear rule. Staff might assume their course is 'unrelated' and proceed without consent, only to be challenged later if the Committee's composition changes. The text provides security for both the University and the staff member. By sticking to the words, we ensure that every potential conflict is flagged, allowing us to decide on the merits rather than debating jurisdiction. The 1971 vote warns against reading limitations into the text.

  **How much, if anything, this decides for future cases**

  This decision should not be treated as a binding precedent in the legal sense, but it will inevitably guide the Administrator. We must be clear that this ruling establishes the interpretive principle, not just the outcome. Future cases involving unrelated short courses should be treated similarly. However, we should not attempt to codify every exception. The Administrator should be instructed to apply the 'assessment relationship' test. This decides the immediate case and sets a framework for the next decade. It prevents the Committee from being bogged down in textbook royalties while keeping the door open for genuine conflicts. We are defining the scope of the Ordinance, not just waiving it.
  If we remain silent on the reasoning, the Administrator will likely continue using the textual test, leading to future complaints. We must explicitly authorise her to filter cases based on the purposive test. This ensures consistency without rigidity. It allows the University to adapt to new forms of education, such as online modules, without constant regulatory amendment. The guidance must be updated before the next academic term begins. This ensures the University remains adaptable.

  **How confident I am, and the point I am least sure of**

  I am highly confident in this recommendation. The point I am least sure of is the weight of the 1971 amendment. A good objector will argue that defeating the amendment proves the Council wanted the broad text. I argue it proves they trusted the purpose, but that is an inference.
  My confidence rests on the assumption that the Committee shares my view of the University's mission. The weakest link is assuming the 1971 Council shared our modern view of 'conflict'. I discount this because no such ban was ever enforced regarding textbooks. Practice confirms the purposive reading. This relies on interpreting silence rather than explicit instruction.
