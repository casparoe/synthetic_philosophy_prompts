answer: |-
  **The procedure**

  This procedure requires two hours and access to existing case records. Do not create new data fields. Follow these steps in order. If a step fails, stop and mark the metric as Rejected unless a Hand-off is specified.

  **Step 1: Audit Trail Verification (15 minutes)**
  Ask: Can finance verify this number using records we already keep without asking the provider for new reports? If the answer is no, reject the metric. Auditability is necessary but not sufficient. If the answer is yes, document the specific database field or log used. This ensures the metric is grounded in paperwork truth, meaning the data exists independently of the payment claim.

  **Step 2: Gaming Stress Test (30 minutes)**
  Ask: If I were a provider needing this money, how would I cheat this specific number without breaking the law? List three specific methods. Common methods include cherry-picking (selecting easy clients), reclassifying (moving bad outcomes to uncounted categories), or timing shifts (delaying entry to improve duration stats). Distinguish gaming, which is deliberate manipulation, from capture, which is sincere tunnel vision. If two or more methods are easy to execute and hard to detect using Step 1 records, mark as High Risk. If High Risk, proceed to Step 4 before deciding.

  **Step 3: Capture Stress Test (30 minutes)**
  Ask: What important work gets ignored if staff focus only on this number? List three mission elements that are not measured here. If critical services rot because they are unpaid, mark as High Risk. This tests for capture, where staff internalize the metric and stop noticing the parts of the mission that aren't in it. If the metric measures a narrow slice of a broad obligation, you must acknowledge the unmeasured rot. If High Risk, proceed to Step 4.

  **Step 4: Ghost Measure Validation (30 minutes)**
  Identify a ghost measure, which is a number we collect quietly that isn't tied to payment and that the provider barely notices. Choose one that ought to move together with the paid metric. Your trick is sound but breaks if the correlation is weak or if the provider discovers the ghost. If the paid metric improves and the ghost does not, something is off. Document the expected correlation. If no existing record can serve as a ghost measure, mark as Data Poor. If Data Poor, you must rely on Step 2 and 3 results alone.

  **Step 5: Target Logic Check (15 minutes)**
  Ask: Does hitting this target require better work or just easier clients? Reject targets set as last year's actual plus a fixed percentage if they punish whoever performed well this year. Ensure targets reflect capacity, not just history. If the target incentivizes lowering the bar for entry, mark as High Risk. This prevents the pressure that forces providers to game the system to survive.

  **Step 6: Final Disposition (15 minutes)**
  Review the risks. If Step 2 or 3 is High Risk and Step 4 is Data Poor, reject the metric. If Step 2 or 3 is High Risk but Step 4 is valid, approve with an audit trigger based on divergence. If Step 5 is High Risk, hand-off to the director for a value judgment on risk tolerance. If all steps pass, approve for draft. This ensures the decision is structured rather than intuitive.

  **Walkthrough: referral-to-appointment time**

  This metric measures average days from referral to first appointment. Step 1 passes easily; timestamps exist in our intake log. Step 2 fails hard. A provider can delay logging the referral until the client is ready, or rush a useless first meeting just to stop the clock. This is classic gaming. Step 3 also flags risks. Staff may prioritize speed over quality, scheduling brief, ineffective appointments to clear the queue. The service rots while the number climbs. Step 4 offers a ghost measure: count of cancelled or rescheduled appointments within 24 hours. If speed goes up and cancellations go up, the speed is fake. However, Step 5 reveals the target trap. If we demand faster times every year, providers will stop accepting complex clients who need scheduling coordination. Because Step 2 and 3 are High Risk and the ghost measure only catches blatant cheating, this metric should be rejected or heavily downweighted. It measures paperwork velocity, not care access.

  **Walkthrough: housing at six months**

  This metric measures the percent of people placed in housing who are still in the same housing six months later. Step 1 passes; lease records exist. Step 2 shows moderate risk. Providers might avoid clients with unstable histories to protect their success rate, or evict tenants quietly before the six-month mark to avoid a failure count. This is cherry-picking and timing shifts. Step 3 highlights capture. Staff might focus entirely on housing retention and ignore mental health or employment support that sustains the housing long-term. Step 4 suggests a ghost measure: returns to emergency shelter within seven months. If housing retention is high but shelter returns are also high, the housing didn't stick. Step 5 requires care. Targets must account for economic shifts, not just past performance. Because the ghost measure correlates well with reality, this metric passes with an audit trigger. If retention rises while shelter returns rise, funding is reviewed. This balances auditability with outcome truth.

  **Walkthrough: the hardest-cases metric**

  This proposed metric measures the percent of services delivered to clients defined as hardest to serve. Step 1 fails immediately. We do not have a standardized record for case difficulty. Step 2 shows extreme risk. Providers will define hard cases loosely to claim credit, or redefine hard cases as easy once served to boost numbers. Step 3 is less relevant here, as the metric aims to prevent capture, but it creates a new distortion where providers compete for tragedy rather than solutions. Step 4 cannot be run; there is no ghost measure for difficulty without a baseline definition. Step 5 is irrelevant because the baseline is undefined. This procedure stalls at Step 1. You cannot audit what you cannot define. This requires a hand-off. The director must decide what we owe the hardest cases before a number can be written. This is a value judgment, not a data problem.

  **Where a person has to decide**

  This procedure pretends to be objective, but three steps require human judgment dressed up as analysis. First, in Step 2, deciding whether a gaming method is easy or hard depends on your trust in the provider, which is subjective. Second, in Step 3, deciding which mission elements are critical enough to trigger a High Risk flag is a value judgment about what the department owes the public. Third, in Step 4, selecting a ghost measure requires intuition about correlation that data alone cannot prove. You are deciding what truth looks like. The procedure organizes the thinking, but it cannot remove the responsibility. If you reject a metric because the gaming risk is too high, you are saying integrity matters more than efficiency. If you accept it despite risks, you are betting on oversight. The hand-off in Step 6 is where you admit the math ends and the leadership begins. Do not hide behind the checklist when the choice is about values.

  **What this procedure can't tell me**

  This tool cannot guarantee outcomes. A metric can pass every step and still fail to improve lives if the underlying theory of change is wrong. It cannot fix bad data infrastructure; if our records are sloppy, the audit trail is useless. It cannot account for external shocks like economic crashes that alter performance regardless of provider effort. It cannot measure trust between staff and clients, which often drives success more than metrics do. Finally, it cannot stop a determined fraudster who knows the system better than the auditor. Use this to reduce error, not to eliminate risk. You are managing a human system, not a machine.
