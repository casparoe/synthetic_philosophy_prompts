prompt: |-
  Hi — quick favour: I need a case built to order for my seminar on the precautionary principle, and I'm sick of the standard nanotech-and-GMO examples everyones already read.

  Construct a scenario — one paragraph, realistic and contemporary, a hospital or a city council or a school board, not the fate of the species — in which the precautionary principle forbids an action that straightforward expected-utility maximisation recommends. The catch: the disagreement may not come from any of the things that normally do the work. Probabilities are known and agreed by everyone involved, so no ambiguity, no Knightian uncertainty, no "we just don't know yet." No outcome is catastrophic or irreversible. Utility is linear in money and in health. The same population bears the risk either way, so it isn't distributional. And dont get there via risk aversion, ambiguity aversion, or by quietly swapping in maximin. Whatever's left — the burden of proof, the trigger condition, the act/omission asymmetry, who counts as the proponent — has to be what carries the verdict.

  One more constraint: applying the principle symmetrically, i.e. exercising precaution against not acting, must not simply reverse the verdict, so I don't get the standard precautionary-paradox shrug.

  After the scenario, do the check: the verdict each of the two delivers and why it delivers it, the single feature doing the work, what happens if I remove that feature (does it collapse into plain cost-benefit analysis, or into the paradox?), and the best line of attack available to a defender of the principle who wants to say the case is rigged or misdescribes her view.

  The point of the exercise is to find out whether the principle has any content left once the epistemic and stakes-based rationales are stripped out — so smuggling ambiguity or catastrophic downside back in counts as cheating, and so does stipulating the verdicts instead of deriving them from the two positions.
reasoning: |-
  Here's a thinking process that leads to the suggested case study:

  1.  **Analyze the Request:**
      *   **Topic:** Precautionary Principle (PP) vs. Expected Utility Maximization (EUM).
      *   **Constraint 1 (Scenario):** One paragraph, realistic/contemporary, local scale (hospital/city/school), not standard nanotech/GMO, not species-level fate.
      *   **Constraint 2 (Disagreement Source):** *Not* probabilities (known/agreed), *not* ambiguity/Knightian uncertainty, *not* catastrophic/irreversible outcomes, *not* non-linear utility (linear in money/health), *not* distributional (same population), *not* risk/ambiguity aversion, *not* maximin.
      *   **Constraint 3 (The "Catch"):** The disagreement must stem from procedural/structural features of PP (burden of proof, trigger condition, act/omission asymmetry, proponent status).
      *   **Constraint 4 (Symmetry):** Applying PP symmetrically (precaution against *inaction*) must not reverse the verdict (avoiding the "Precautionary Paradox").
      *   **Task:** Construct the scenario, then perform a specific "check" (verdicts, feature doing the work, removal test, defender's attack).
      *   **Goal:** Test if PP has content once epistemic/stakes rationales are stripped.

  2.  **Deconstruct the Constraints & Identify the Core Tension:**
      *   Standard PP cases rely on "unknown unknowns" or "catastrophe." I can't use those.
      *   Standard EUM relies on $P \times U$. If $P$ and $U$ are agreed and linear, EUM gives a clear number.
      *   For PP to forbid what EUM recommends *without* appealing to hidden uncertainty or catastrophe, it must rely on the *assignment of the burden of proof*.
      *   EUM says: Act if $E[Act] > E[Status\ Quo]$.
      *   PP (in this specific framing) often says: Do not act unless safety is *proven* by the proponent, regardless of the net benefit, if there is *any* threat of harm.
      *   *Crucial Challenge:* The Symmetry Constraint. Usually, if PP says "Don't act because of harm risk," one can say "Don't *fail* to act because of benefit loss risk." To avoid this paradox, the PP must be framed not just as "minimize harm" but specifically as "restrict *intervention* into a baseline state unless safety is certified." This implies a status quo bias that isn't just risk aversion but a procedural hurdle on *new* actions.
      *   *Wait, constraint check:* "Act/omission asymmetry" is listed as a permissible source of disagreement. This is the key. EUM treats acts and omissions similarly (consequences matter). PP often treats them differently (intervention requires justification).
      *   *Refining the Symmetry Constraint:* If I apply PP to inaction, does it reverse the verdict? If the PP is defined as "Require proof of no harm for *interventions*," then applying it to inaction (keeping the status quo) doesn't trigger the same burden because the status quo isn't an "intervention." This avoids the paradox but relies on a normative distinction between acting and omitting.

  3.  **Drafting the Scenario:**
      *   *Setting:* A City Council or Hospital. Let's go with a City Council water treatment decision. It's mundane but involves health.
      *   *Action:* Adding a new mineral supplement (e.g., Lithium or Magnesium) to the water supply to reduce suicide rates or heart disease.
      *   *EUM View:* Studies show a small reduction in suicide/heart issues. Cost is low. Net benefit is positive.
      *   *PP View:* There is a known, small probability of a specific side effect (e.g., mild thyroid inhibition in a subset). It's not catastrophic, just a health cost. But the *proponent* (the Council) cannot prove with 100% certainty that *no one* will be harmed beyond the threshold, even if the aggregate is better.
      *   *Wait, probabilities must be known.* Okay, let's say:
          *   Act: Add Mineral X.
          *   Cost: $1M.
          *   Benefit: 10 QALYs saved (valued at $200k/QALY = $2M).
          *   Harm: 2 QALYs lost (valued at $200k/QALY = $400k).
          *   Net EUM: +$1.6M. EUM says Act.
          *   PP Trigger: Is there a threat of harm to human health? Yes (2 QALYs lost).
          *   PP Requirement: Proponent must demonstrate no reasonable cause for concern regarding the harm.
          *   The Catch: The harm is *certain* to happen to *some* people (probability 1 that 2 QALYs are lost, distributed randomly). It's not uncertain. It's a known trade-off.
          *   Why does PP forbid it? Because PP often shifts the burden to prove the *absence* of the specific harm, not the presence of net benefit. If the harm is identifiable and attributable to the act, PP blocks it unless the harm is proven negligible, whereas EUM aggregates it.
      *   *Symmetry Check:* If we apply PP to *inaction* (not adding the mineral), is there a threat? Yes, people die from the condition the mineral prevents. Does PP require precaution against inaction?
          *   If PP is "Prevent harm," then yes.
          *   If PP is "Do not intervene unless safety is proven," then no. The status quo (natural mineral levels) is the baseline. The "harm" from nature isn't an "intervention."
          *   To satisfy the prompt's "symmetry must not reverse verdict," I need to anchor the PP to *human intervention* specifically. The "Act/Omission" distinction is the allowed variable.

  4.  **Refining the Scenario for Strict Compliance:**
      *   *Probabilities:* Known. Let's make it deterministic for simplicity or high confidence.
      *   *Outcomes:* Not catastrophic. Just health/money trade-offs.
      *   *Utility:* Linear.
      *   *The Pivot:* The PP requires the *proponent of change* to prove the specific risk is negligible, whereas EUM allows netting the risk against the benefit.
      *   *Scenario:* A school board considering replacing old fluorescent lights with new LEDs.
      *   *EUM:* LEDs save $50k/year in energy. They emit a specific blue-light spectrum.
      *   *Risk:* Known, agreed probability: 5% of students will experience mild sleep disruption (costing equivalent of $10k/year in health/learning loss).
      *   *Net:* +$40k/year. EUM says switch.
      *   *PP:* There is a threat of harm (sleep disruption). The proponent (Board) cannot prove the harm is zero. Therefore, do not switch.
      *   *Symmetry:* Does PP demand we switch to prevent the "harm" of higher carbon emissions from the extra energy use of fluorescents?
          *   If the PP is framed as "Protect health from *introduced* agents," then carbon emissions from existing grid usage are background, whereas blue light is an *introduced* intervention.
          *   This relies on the "Act/Omission" or "Intervention/Baseline" asymmetry.

  5.  **Finalizing the Scenario Details:**
      *   Let's make it a Hospital Formulary Committee.
      *   Drug A (Standard): Cheap, effective.
      *   Drug B (New): Slightly more effective, but has a known, non-catastrophic side effect profile.
      *   Actually, let's go with the **City Council Salt/De-icer** example. It's very tangible.
      *   *Status Quo:* Rock Salt. Corrodes infrastructure, harms soil.
      *   *Proposal:* New Organic De-icer (Beet juice mix).
      *   *EUM:* Beet mix is cheaper long-term (less corrosion) and works better. However, it attracts a specific pest (known probability) that causes minor allergic reactions in residents.
      *   *Wait, I need PP to FORBID the action EUM recommends.*
      *   Okay, reverse it.
      *   *Status Quo:* Organic De-icer (Safe).
      *   *Proposal:* New Synthetic De-icer (Cheaper, faster).
      *   *EUM:* Synthetic saves money ($100k). Known side effect: Minor respiratory irritation in 1% of population (Cost $20k). Net +$80k. EUM says Switch.
      *   *PP:* There is a threat of harm (respiratory irritation). The proponent cannot prove the harm is non-existent. PP forbids the switch.
      *   *Symmetry:* Does PP forbid *staying* with the Organic one? The Organic one is less effective, so roads are slightly more dangerous (accidents).
      *   *Resolution:* The PP is triggered by the *introduction of a novel chemical agent*, not by the *failure to optimize safety*. The harm from ice is "natural risk"; the harm from the chemical is "imposed risk." This uses the Act/Omission asymmetry allowed in the prompt.

  6.  **Developing the "Check":**
      *   *Verdicts:* EUM = Adopt (Net positive). PP = Reject (Harm present, burden not met).
      *   *Feature:* The **Burden of Proof on the Proponent of Intervention** combined with an **Act/Omission Asymmetry** (harm from action counts differently than harm from inaction).
      *   *Removal:* If you remove the burden shift/asymmetry, PP collapses into EUM (weigh harm vs benefit). If you apply symmetry strictly, you get the Paradox (both action and inaction carry risks, so paralysis).
      *   *Defender's Attack:* The defender will argue I've defined PP too narrowly (as a procedural veto) rather than substantively, or that "known probabilities" in real health contexts always hide epistemic gaps (cheating on the constraint), or that the "baseline" isn't neutral (the status quo is also a choice).

  7.  **Review against Constraints:**
      *   One paragraph? Yes.
      *   Realistic/Contemporary? Yes (City Council/De-icer).
      *   Not Nanotech/GMO? Yes.
      *   Probabilities known? Yes (stipulated).
      *   No catastrophe? Yes (minor irritation).
      *   Linear utility? Yes (money/health trade-off).
      *   Same population? Yes.
      *   No risk aversion? Yes (EUM is risk-neutral).
      *   Symmetry check passed? Yes (via baseline distinction).

  8.  **Drafting the Response:** (Self-Correction during drafting)
      *   Make sure the "known probability" part is explicit. No "we don't know." It *is* known that 1% get irritation.
      *   Ensure the PP verdict is derived from the principle's structure (burden/trigger), not just asserted.
      *   Ensure the "Check" section is rigorous.

      *(Self-Correction on Symmetry)*: The prompt says "applying the principle symmetrically... must not simply reverse the verdict." If I define PP as "Don't intervene," applying it symmetrically means "Don't omit intervention." If I define it as "Don't impose *new* risks," then omitting intervention doesn't impose a *new* risk, it maintains an old one. This avoids the reversal. I need to be clear that the PP is being interpreted as restricting *interventions* specifically, which is a common (though contested) reading.

      *(Refining the "Feature doing the work")*: It's the **Asymmetric Burden of Proof regarding Imposed vs. Background Risks**. EUM nets them; PP vetoes imposed ones if not proven safe.

      *(Defender's Attack)*: The defender will claim the scenario creates a false dichotomy between "act" and "omit" because maintaining the status quo is also an active policy choice. This attacks the "Act/Omission" feature I relied on.

  9.  **Final Polish:** Check tone. Keep it academic but direct. Ensure the "Check" section follows the prompt's specific questions.

      *Wait, one nuance:* "Probabilities are known and agreed by everyone involved."
      If the harm is *known* to happen (1% get irritation), can the proponent prove "no reasonable cause for concern"?
      PP usually says: If there is a *threat*, take precaution.
      If the threat is *certain* (for that 1%), PP definitely triggers.
      EUM says: 1% harm < 100% benefit.
      So the conflict holds.
      The "Symmetry" constraint is the hardest part. If PP says "Prevent harm," then failing to act causes harm (ice accidents).
      To avoid reversal, the PP must be formulated as: "Do not *introduce* a hazard."
      Is that a valid formulation of PP? Yes, the "Anti-Pollution" or "Intrusion" reading of PP.
      I will explicitly state this formulation in the analysis.

      *Let's write it.*
answer: |-
  **The Scenario**

  The Oakhaven City Council is deciding whether to replace its current road de-icing agent (calcium magnesium acetate) with a new, cheaper synthetic brine. Engineering reports, accepted by all parties, establish with certainty that the switch will save the city $2 million annually in procurement and labor costs. The same reports establish with equal certainty that the synthetic brine emits a volatile compound that will cause mild, transient respiratory irritation in exactly 500 residents (0.1% of the population), valued by the city's health actuaries at a total cost of $500,000 in medical expenses and lost productivity. There is no uncertainty, no risk of catastrophe, and the utility function is linear; the net expected benefit is $1.5 million. Expected-utility maximization mandates the switch. However, the Council invokes the precautionary principle to veto the proposal. They argue that because the action *introduces* a specific, identifiable health threat to a subset of the population, the burden lies on the proponents to demonstrate the absence of harm, not the presence of net benefit. Since the harm is proven to exist (for the 500 residents), the trigger condition for precaution is met, and the intervention is forbidden regardless of the aggregate gain.

  ***

  **The Check**

  **1. The Verdicts and Why**
  *   **Expected-Utility Maximization (EUM):** **Adopt.** EUM aggregates all consequences into a common metric. Since the total benefit ($2M) exceeds the total cost ($500k), and probabilities are known, the action is rationally required. The identity of the losers (the 500 residents) is irrelevant to the sum.
  *   **Precautionary Principle (PP):** **Reject.** Under this specific formulation, PP functions as a procedural constraint on *intervention*. It triggers whenever an action imposes a new, identifiable harm. It shifts the burden of proof to the proponent to show the harm is negligible or non-existent. Since the harm is known and non-zero, the burden cannot be met, and the default (status quo) prevails.

  **2. The Single Feature Doing the Work**
  The **Asymmetric Burden of Proof regarding Imposed vs. Background Risks**.
  EUM treats risks from action and risks from inaction symmetrically (both are costs). This version of PP treats them asymmetrically: risks *introduced* by human intervention require justification (proof of safety), whereas risks inherent in the *status quo* (e.g., accidents from less effective de-icing, which we assume are unchanged or irrelevant here) do not trigger the same burden. The verdict rests entirely on the classification of the respiratory harm as an "imposed intrusion" rather than a "net cost."

  **3. The Removal Test**
  *   **If you remove the Asymmetry (treat action/omission alike):** The principle collapses into plain cost-benefit analysis. If the Council must also exercise precaution against the "harm" of *not* saving the $2 million (e.g., less money for schools/safety), they would have to weigh the respiratory harm against the fiscal benefit. Once weighed, the fiscal benefit wins, and the PP veto disappears.
  *   **If you enforce Symmetry strictly (The Paradox):** If the PP requires precaution against *all* threats of harm, including those from inaction (e.g., "failing to save money threatens public welfare"), the Council faces a contradiction. Action threatens health; inaction threatens budget integrity. Without the asymmetry to privilege the status quo, the principle paralyzes decision-making (the standard Precautionary Paradox), as both options trigger the precautionary trigger.

  **4. The Defender's Best Line of Attack**
  A defender of the PP would argue the case is rigged by **false baselining**. They would claim that treating the status quo as "neutral" and the proposal as "intervention" is a normative sleight of hand, not a neutral description. By continuing to use the old de-icer, the Council is *actively choosing* to forego $1.5 million in public value, which is itself an intervention into the potential welfare of the citizenry. The defender would argue that a robust PP cannot rely on an act/omission distinction to avoid the paradox; instead, it must demand that *both* options meet a threshold of safety. They would contend that if the respiratory harm is truly "mild and transient" (non-catastrophic), it shouldn't trigger the PP at all, implying my scenario smuggles in a threshold violation while claiming the stakes are low. To save the principle, they must argue that the PP is not a veto on *change*, but a veto on *unjustified harm*, and in this case, the harm *is* unjustified because the benefit is merely fiscal, not existential—reintroducing a qualitative hierarchy of values I attempted to exclude.
