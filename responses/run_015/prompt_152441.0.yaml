answer: |-
  To build a theory of guilt and shame that isn't a "just-so story," you need to move beyond functional labels (e.g., "guilt fixes relationships") and define the architectural constraints any viable model must satisfy. Below are the desirata, categorized by necessity, followed by an evaluation of your temporal hypothesis and the specific constraint that dismantles standard accounts.

  ### I. The Desiderata

  #### Hard Constraints (Non-Negotiable)
  If a theory fails these, it is empirically falsified.

  1.  **The Privacy/Publicity Dissociation:** The theory must explain why guilt arises robustly in *private* contexts (breaking a promise no one knows about) while shame is contingent on *audience* (real, imagined, or anticipated). A theory that requires an actual observer for guilt, or denies the visceral reality of private shame, fails.
  2.  **Action-Tendency Divergence:** The theory must account for opposite behavioral outputs from similar moral breaches. Guilt must predict *approach/repair* (confess, fix, apologize). Shame must predict *avoidance/defense* (hide, deny, aggress). If the theory predicts the same output for both, it is describing "distress," not distinct emotions.
  3.  **Phenomenological Distinctness:** The theory must map onto the lived experience. Guilt feels like "I *did* bad" (specific, actionable). Shame feels like "I *am* bad" (global, identity-level). Collapsing this distinction into a single "negative self-evaluation" variable renders the theory useless.
  4.  **Cross-Cultural Variability Without Essentialism:** The theory must explain why some societies emphasize one over the other *without* resorting to the "Guilt Culture vs. Shame Culture" dichotomy (which is empirically false; all cultures have both). It must show how the *same* underlying mechanisms are calibrated differently by social ecology.

  #### Camp Preferences (Theoretical Bets)
  These are where schools of thought diverge. A robust theory can take a stance here, but shouldn't rely on them as foundational truths.

  1.  **Developmental Primacy:** Does shame come first (infant dependency) or guilt (later cognitive capacity for rules)? EvPsych often bets on shame as the older module; Constructionists often bet on guilt as the more "civilized" script. A good theory should be agnostic or explain the overlap.
  2.  **Modularity vs. Appraisal:** Are guilt and shame distinct neural modules (EvPsych lean) or different cognitive appraisals of the same arousal system (Constructionist/Cognitive lean)?
  3.  **The Temporal Framing:** (Your hypothesis). Is the core distinction backward-looking (guilt) vs. forward-looking (shame)? Currently, this is a preference, but I argue below it should be elevated.

  ---

  ### II. Evaluating the Temporal Orientation Hypothesis

  **Does a decent theory need to accommodate your temporal framing?**
  **Yes.** In fact, it should be elevated from a "Camp Preference" to a **Hard Constraint.**

  Here is why: The standard "Act vs. Self" distinction (Guilt = Behavior, Shame = Identity) is descriptive but not *mechanistic*. It tells you *what* is evaluated, but not *why* the system splits the labor.

  Your temporal framing provides the *functional logic* for the split:
  *   **Guilt (Backward/Repair):** The breach has already happened. The goal is to restore the past state. The time horizon is short-term and specific. This licenses the "repair" action tendency.
  *   **Shame (Forward/Protection):** The breach reveals a trait that threatens future standing. The goal is to mitigate future loss. The time horizon is long-term and probabilistic. This licenses the "withdraw/hide" action tendency (if I hide, I can't be further rejected).

  **Why this is necessary:** Without temporality, you cannot explain why guilt doesn't lead to hiding (I did bad, I should hide) or why shame doesn't lead to repair (I am bad, I should fix myself). The *time horizon* dictates the *strategy*. A theory that ignores time ignores the decision-making architecture of the emotion.

  ---

  ### III. The Single Desideratum That Breaks Standard Accounts

  The single desideratum that does the most damage to both standard Evolutionary Psychology and standard Social Constructionism is:

  **The Requirement to Explain Cross-Cultural Variability Without Essentialism.**

  Here is the reasoning for why this specific constraint dismantles both camps:

  #### 1. Damage to Standard Evolutionary Psychology
  *   **The Standard View:** Emotions are universal adaptations selected for in the Environment of Evolutionary Adaptedness (EEA). They should look roughly the same everywhere because the adaptive problems (cheater detection, coalition maintenance) were universal.
  *   **The Collision:** If you demand a theory that explains *variability* (e.g., why honor cultures trigger shame more easily, or why individualist cultures trigger guilt more readily) without calling it "noise," EvPsych breaks.
  *   **Why:** Standard EvPsych struggles to model *calibration*. If guilt/shame are fixed modules, why does the threshold for activation shift so dramatically across cultures? To accommodate this, EvPsych must admit that the "adaptation" is not the emotion itself, but a *plasticity mechanism* that tunes the emotion to local ecology. This moves them away from "universal modules" toward "developmental systems," undermining the core simplicity of the standard EvPsych narrative.

  #### 2. Damage to Standard Social Constructionism
  *   **The Standard View:** Emotions are scripts, labels, or performances learned through cultural discourse. There is no "natural kind" of guilt; there is only what a specific culture defines as guilt.
  *   **The Collision:** If you demand a theory that accounts for *universality* (e.g., the physiological flush of shame, the visceral urge to repair in guilt, the private experience of both), Constructionism breaks.
  *   **Why:** Constructionism cannot easily explain why a person in a culture with *no word* for guilt still exhibits the behavioral and physiological profile of guilt when breaking a private promise. To accommodate this, Constructionism must admit a biological substrate that constrains the social script. This moves them away from "purely constructed" toward "bio-social interaction," undermining the core relativism of the standard Constructionist narrative.

  #### 3. Why This Desideratum Wins
  This constraint forces a **Bio-Social Calibration Model**.
  *   It requires a universal mechanism (satisfying the phenomenological/privacy constraints).
  *   It requires a variable input system (satisfying the cultural constraint).
  *   **The Temporal Link:** Your temporal hypothesis is the *only* mechanism that easily bridges this gap.
      *   *Universal:* All humans navigate time (past/future).
      *   *Variable:* Cultures teach different time-horizons (e.g., "Ancestral past" vs. "Immediate future"; "Individual future" vs. "Group future").
      *   A culture that emphasizes *future group standing* will calibrate the shame system to be hyper-sensitive. A culture that emphasizes *past individual acts* will calibrate the guilt system to be hyper-sensitive.

  **Conclusion:**
  Standard EvPsych fails because it treats the emotion as a fixed universal. Standard Constructionism fails because it treats the emotion as a fluid particular. The requirement to explain **Cross-Cultural Variability Without Essentialism** forces a theory to admit that the *mechanism* is universal (biological/temporal) but the *trigger calibration* is cultural. This hybrid model is the death knell for the pure versions of both dominant accounts. Your temporal framing is the strongest candidate for the universal mechanism that allows for this cultural calibration.
