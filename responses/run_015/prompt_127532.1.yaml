  8.  **Final Polish:**
      *   Check against constraints: Did I rank tensions? Yes. Cheap fixes? Yes. Cost? Yes. Single revision? Yes. Case study applied? Yes.
      *   Ensure the "School of" reaction is addressed directly.

  9.  **(Self-Correction during drafting):** I need to make sure I don't just lecture on Goodman. The user wants to know about *their* specific contradictions. The Book vs. Print thing is the smoking gun that proves they aren't a pure perceptualist. I need to highlight that.

  10. **Final Structure:**
      *   Intro: Empathy + The Philosophical Stakes.
