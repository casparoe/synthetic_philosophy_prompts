answer: |-
  This is an exceptionally sharp observation. You have identified what legal philosophers call the "problem of residual obligation" or the "paradox of justified wrongdoing." Your intuition that the course materials treat this as settled background is correct; standard doctrinal classes often prioritize black-letter rules over the metaphysical commitments those rules imply.

  Below is a reconstruction of the implicit theory underlying this cluster of practices, followed by the meta-assessment you requested.

  ### 1. Doctrinal Calibration (Confidence: High)
  Before reconstructing the theory, I must nuance your description of the doctrine, as it varies by jurisdiction. Your description fits **English Common Law** (e.g., *R v. Dudley and Stephens*) perfectly. However, in the **US Model Penal Code (MPC)** and many US states:
  *   **Necessity** is a *justification* and *can* theoretically justify homicide (e.g., killing one to save five in a trolley-style case), though courts rarely allow it.
  *   **Duress** is an *excuse* and generally *cannot* excuse murder (MPC §2.09).
  *   **Tort:** Your reading of *Vincent v. Lake Erie Transp. Co.* is correct: the privilege to trespass exists, but the duty to compensate remains.

  *Why this matters:* If necessity can justify homicide (MPC), the "incommensurability" claim weakens. If it cannot (Common Law), the tension you identify is sharper. I will proceed assuming the **Common Law framework** you described, as it presents the starker philosophical puzzle.

  ### 2. Reconstruction of the Implicit Theory
  The legal practice you describe presupposes what I will call the **"Infringement-Residue Theory."** It does not deny genuine dilemmas, nor does it fully embrace them in a tragic sense. Instead, it operationalizes a specific view of rights and value.

  **A. The Criminal Component (Confidence: Medium-High)**
  *   **The Theory:** The law treats the *act* as objectively optimal (consequentialist calculus) but the *agent* as constrained by deontological side-constraints.
  *   **The Dilemma Stance:** It denies that there is a "moral remainder" *for the criminal law* if the defense succeeds. If necessity is a **justification**, the act is deemed "right" or "permissible." The conviction in *Dudley* suggests that taking innocent life violates a **lexical priority** rule (rights trump utility).
  *   **Implicit Claim:** There is always a determinate legal answer. Either the act was justified (no crime), excused (no blame), or unjustified (crime). The law refuses to recognize a category of "Right Act that is still a Crime."

  **B. The Tort Component (Confidence: High)**
  *   **The Theory:** Strict Liability for Innocent Infringement.
  *   **The Dilemma Stance:** This is where the "Residue" lives. Tort law presupposes that rights (like property in the dock) are **entitlements**, not just interests. Even if infringing the entitlement was the *best thing to do*, the entitlement itself was violated.
  *   **Implicit Claim:** Value is not fully commensurable. You can trade utility (saving the ship) against rights (the dock), but you cannot extinguish the right without compensation. This supports your "genuine dilemma" reading: the defendant did the right thing *all-things-considered*, but still owes a debt to the victim.

  **C. The Clemency Component (Confidence: Medium)**
  *   **The Theory:** Mercy as a Safety Valve, not Theoretical Admission.
  *   **The Dilemma Stance:** Clemency is institutionally distinct from adjudication. It allows the state to say, "You broke the law (preserving the rule's integrity), but we will not punish you (acknowledging the moral tragedy)."
  *   **Implicit Claim:** This component is underdetermined. It *could* signal a genuine dilemma (you are guilty but blameless), OR it could signal simple utilitarianism (punishing you serves no deterrent purpose).

  ### 3. Consistency: Commensurability vs. Incommensurability
  You asked whether the proportionality requirement (commensurable) and the murder bar (incommensurable) can be held together.

  *   **Reconstruction:** They are consistent under a theory of **Lexical Utilitarianism**.
  *   **Explanation:** Most harms are commensurable on a single scale (property damage, minor bodily injury, financial loss). However, innocent life occupies a **lexically prior tier**. You cannot aggregate lower-tier harms to justify a higher-tier violation.
  *   **Consistency Verdict:** (Confidence: High) The doctrine is internally consistent *if* you accept lexical priority. It says: "Compare harms on the scale, unless one involves innocent life, in which case the scale breaks."
  *   **The Tension:** This creates a discontinuity. Why is property commensurable with property, but life incommensurable with life? The law offers no metric for *why* the cabin boy's life cannot be traded for three sailors, while the dock can be traded for the ship. This suggests the "incommensurability" is not metaphysical, but **symbolic** (the sanctity of life as a legal fetish).

  ### 4. Where the Practice is Underdetermined
  Your intuition that the practice fits multiple theories is correct. The current legal architecture is **philosophically agnostic**.

  1.  **Dilemma-Denying View (Your Friend):** Fits easily. The law says there was a right answer (don't kill the boy). The sailors failed to find it. Tort compensation is just a cost of doing business, not a moral residue. Clemency is mere grace.
  2.  **Genuine-Dilemma-with-Residue View (You):** Fits easily. The law acknowledges the act was necessary (Tort privilege) but acknowledges a right was violated (Tort compensation + Criminal Conviction). Clemency acknowledges the blamelessness.
  3.  **Moral Luck/Expressive View:** Fits easily. The conviction expresses society's abhorrence of killing (expressivism). The commutation acknowledges the bad luck of the situation. Tort compensates the victim regardless of fault (insurance function).

  **Why it's underdetermined:** Because "Justification," "Excuse," and "Privilege" are legal labels, not metaphysical claims. They manage social outcomes rather than truth conditions.

  ### 5. What a "Genuine Dilemma" Legal System Would Look Like
  If the law took your "residue" theory seriously—acknowledging that one can do the *right* thing and still incur *guilt* or *debt*—it would need structural changes:

  1.  **A Third Verdict:** (Confidence: High) Currently, it's Guilty/Not Guilty. A system recognizing genuine dilemmas might need "Justified but Liable" or "Guilty but Exculpated." The current system forces a binary: either you did wrong (Guilty) or you didn't (Justified). A genuine dilemma requires admitting *both*.
  2.  **Abolition of the Murder Bar for Necessity:** (Confidence: Medium) If harms are truly commensurable in a dilemma, 1 life vs. 5 lives should be adjudicable. A genuine dilemma system would allow the jury to weigh the lives, rather than imposing a lexical ban.
  3.  **Mandatory Compensation as Part of Criminal Sentence:** (Confidence: High) Currently, tort and criminal are separate. A unified theory of "residue" would integrate restitution into the criminal outcome for justified acts.
  4.  **Removal of the Objective Test in Duress:** (Confidence: Medium) If the dilemma is genuine to the *agent*, the "ordinary firmness" test is irrelevant. A genuine dilemma system would focus on the *subjective* impossibility of choice, not the objective reasonableness.

  ### 6. Meta-Assessment

  **Confidence Levels:**
  *   **Doctrinal Description:** High (with the Common Law/MPC caveat noted above).
  *   **Reconstruction of Implicit Theory:** Medium-High. (Legal systems rarely have a single "implicit theory," but this reconstruction explains the coherence of the practices).
  *   **Consistency Analysis:** High. (Lexical priority explains the commensurability tension well).
  *   **Proposed Changes for "Genuine Dilemma" System:** Medium. (This is speculative jurisprudence).

  **Single Consideration That Would Most Change My Reading:**
  *   **The Model Penal Code's Treatment of Homicide.** If we shift from English Common Law to the MPC, where Necessity *can* justify homicide (§3.02), the "incommensurability" claim collapses. The law then admits lives are commensurable. This would strongly support a pure Consequentialist view and weaken your "Genuine Dilemma/Residue" reading, because if lives are tradable, the "tragic remainder" is less distinct from standard cost-benefit analysis.

  **Where This Argument is Most Likely to Fail:**
  1.  **Dependence on Your Description:** My analysis relies heavily on the **Common Law murder bar**. If your course is focusing on US federal law or MPC jurisdictions where necessity *might* excuse homicide, the "lexical priority" theory fails, and the tension between tort and criminal law becomes harder to explain (why pay for a justified killing?).
  2.  **Reifying "The Law":** I have treated "the law" as a single agent with a coherent theory. In reality, Criminal Law, Tort Law, and Executive Clemency evolved separately for different policy reasons (deterrence vs. compensation vs. order). The inconsistency you see may not be a philosophical puzzle to be solved, but simply **historical accretion**. The "theory" may be nonexistent; the practices may just be pragmatic tools that happen to rub against each other.
  3.  **The Nature of Clemency:** I assumed clemency implies a theoretical admission of blamelessness. It is equally likely that clemency is purely political. If clemency is just political mercy, it provides no evidence for the "Genuine Dilemma" theory.

  **Final Advice for Your Paper:**
  Focus on *Vincent v. Lake Erie*. It is the clearest evidence for your view. The court explicitly stated the act was *privileged* (right to do) but *compensable* (wrong to suffer). That is the definition of a moral residue. Contrast this with the criminal law's refusal to offer a "Guilty but Justified" verdict. Your paper's thesis could be: *The law recognizes genuine dilemmas in Tort (via compensation) but suppresses them in Criminal Law (via binary verdicts), creating a theoretical schism that clemency attempts to patch.*
