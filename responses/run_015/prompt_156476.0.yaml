  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I need to be careful not to conflate Duress (threat by human) and Necessity (natural circumstances). The user lumps them slightly, but the murder bar applies differently. Duress is an *excuse* (I couldn't help it), Necessity is a *justification* (it was the right thing). The user notes this ("justification rather than an excuse"), but the murder bar applies to both in Common Law. I must distinguish them in the analysis.
      *   *Tort:* *Vincent v. Lake Erie* is the key case. The court said the privilege exists *because* of the necessity, but the duty to pay exists *because* of the property right. This supports the "Residue" theory.
      *   *Clemency:* Is clemency part of the *theory* or just a safety valve? If it's a safety valve, it doesn't prove dilemmas exist. I need to argue this point.
      *   *Confidence:* I should be humble about the "Implicit Theory." Legal systems aren't single philosophers. They are accretions of history.

  9.  **Final Polish:** Ensure all constraints of the prompt are met (confidence markers, single consideration, failure points). Ensure tone is appropriate for a law/philosophy student. (Avoid being too didactic, be collaborative).

  *(Self-Correction on Confidence)*: I need to explicitly mark confidence *in each part* as requested ("Mark how confident you are in each part of the reconstruction"). I will use explicit labels or parentheticals.

  *(Self-Correction on Failure Point)*: The user's description of the doctrine is mostly right for Common Law, but the MPC differs. I need to highlight that the "Murder Bar" is the shakiest premise for a universal theory.

