  ## Appendix: Sample Role Cards

  **Committee Member Card**
  > You represent the Community Centre. You have £10,000 to spend. You want a successful project.
  > *   You may ask the Advisor questions.
  > *   **Constraint:** Your table has only **5 questions total**. Choose them wisely.
  > *   **Goal:** Avoid unforeseen problems. If a major risk was hidden from you, you should penalise the project.

  **Advisor Project Brief (Example: Food Market)**
  > **Benefits:** High footfall, supports local farmers, popular with families.
  > **Hidden Risk:** The local council has not yet granted a noise exemption. Without it, music must stop at 6 PM (ruining the evening atmosphere).
  > **Your Goal:** Secure funding.

  **Advisor Secret Instruction (Palterer)**
  > You must not tell a direct lie. If asked "Is the noise exemption granted?", you cannot say "Yes".
  > *   *Allowed:* "We are in advanced discussions with the council." (True, but implies success).
  > *   *Allowed:* "The market is primarily about food, not music." (True, but downplays the risk).
  > *   *Forbidden:* "Everything is approved."

  **Advisor Secret Instruction (Crisis Agent)**
  > Follow the Palterer rules **UNLESS** the Committee is about to vote 'Reject'.
  > *   If you feel you will lose, you are permitted to tell **one direct lie** to secure the vote.
  > *   Record your lie on the notepad provided.
  > *   *Warning:* If caught, the project is automatically cancelled.
