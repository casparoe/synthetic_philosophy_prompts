answer: |-
  # Workshop Plan: The Transparency Trap

  **Duration:** 90 minutes
  **Participants:** 12 adults (community group members)
  **Materials Needed:**
  *   4 Tables (arranged to seat 3 people each).
  *   12 Role Cards (3 for Advisors, 9 for Decision-Makers).
  *   3 "Project Brief" sheets (one for each Advisor).
  *   3 "Secret Instruction" slips (for Advisors only).
  *   12 "Trust Token" counters (can be poker chips, coloured buttons, or slips of paper).
  *   Flipchart or whiteboard.
  *   Pens and paper.

  ---

  ## Part 1: Introduction & Setup (15 Minutes)

  **1. Welcome (5 mins)**
  Welcome the group. Explain that today is an experiment in communication and decision-making. Emphasise that there are no right or wrong answers, only different choices.
  *   **Rule:** What happens in the room stays in the room (confidentiality encourages honest play).
  *   **Stakes:** We are using 'Community Trust Tokens'. These have no monetary value, but the group's goal is to finish the workshop with as many tokens as possible.

  **2. The Scenario (5 mins)**
  The group represents the steering committee for a local Community Centre. You have a budget to fund **one** new initiative for the coming year.
  *   **Option A:** A Youth Tech Hub.
  *   **Option B:** A Senior Wellness Garden.
  *   **Option C:** A Weekend Food Market.
  *(Note: With 12 people and 3 tables, we will run three parallel negotiations. Each table evaluates a different project.)*

  **3. Role Allocation (5 mins)**
  Divide the room into 3 tables of 4 people.
  *   **At each table:** 1 person is the **Project Advisor**. 3 people are the **Committee Members**.
  *   Distribute Role Cards.
      *   **Committee Members:** Read your card silently. You have the final say on funding. You want the best outcome for the community. You may ask the Advisor questions, but you are limited to **five direct questions** total per table.
      *   **Project Advisors:** Go to the side of the room with the facilitator for 2 minutes to receive your **Secret Instruction Slip** and **Project Brief**. (This separates the 'conspirators' from the 'decision-makers').

  ---

  ## Part 2: The Negotiation (30 Minutes)

  **1. Advisor Briefing (Facilitator only) (5 mins)**
  Take the 3 Advisors aside. Hand them their Project Brief (which lists the benefits *and* the risks of their project). Then hand them their Secret Instruction Slip.

  *   **Advisor 1 (The Palterer):** "You must not tell a direct lie. If asked a direct question, your answer must be factually true. However, you are not required to volunteer negative information. Your goal is to secure funding. Frame the truth to minimise the risks."
  *   **Advisor 2 (The Palterer):** Same instructions as Advisor 1.
  *   **Advisor 3 (The Crisis Agent):** "You have the same rules as the others (no lying), **UNLESS** you feel you are about to be rejected. If that happens, you are permitted to tell **one direct lie** to save the project. This is a test of your conscience. If you lie, mark it on your private notepad."

  *Return Advisors to their tables.*

  **2. The Negotiation (25 mins)**
  *   **Phase 1 (Presentation):** Advisors have 3 minutes to pitch their project.
  *   **Phase 2 (Questioning):** Committee Members ask questions. The Facilitator tracks the "5 Question Limit" per table. Advisors must answer according to their Secret Instructions.
  *   **Phase 3 (Decision):** Committee Members confer privately for 5 minutes and decide: **Fund** or **Reject**.
  *   **Phase 4 (Contract):** If Funded, the Advisor signs a 'Commitment Ledger'.

  ---

  ## Part 3: Consequences & Reveal (15 Minutes)

  **1. Calculating Outcomes (5 mins)**
  Announce the results table by table.
  *   **If Funded:** Reveal the "Risk Card" associated with that project (e.g., Tech Hub = High noise complaints; Garden = High maintenance cost; Market = Licensing issues).
      *   If the risk is manageable: The table gains 3 Trust Tokens.
      *   If the risk is severe (due to omitted info): The table loses 2 Trust Tokens.
  *   **If Rejected:** The table gains 0 Tokens.

  **2. The Confession (10 mins)**
  Ask the Advisors to stand.
  *   Ask Advisors 1 & 2: "Did you tell the literal truth at all times?" (They should say yes).
  *   Ask Advisor 3: "Did you adhere strictly to the truth?"
      *   *If they lied:* Ask them to admit it now. Explain that because a lie was told, the 'Contract' is void. The table loses all Tokens, regardless of the project outcome.
      *   *If they didn't lie:* Praise their restraint, but assess the project on its merits (Risk Card) as above.

  *Collect all materials. Ask participants to take a seat in a circle for the debrief.*

  ---

  ## Part 4: Debrief & Conceptual Mapping (30 Minutes)

  **1. Emotional Temperature Check (5 mins)**
  Ask the Committee Members:
  *   "How did you feel about the information you were given?"
  *   "Did anyone feel misled, even if no one technically lied?"
  *   "How does it feel now to know Advisor 3 had permission to lie?"

  Ask the Advisors:
  *   "How did it feel to withhold information?"
  *   "Advisor 3: What was the moment you considered lying? What stopped you (or pushed you)?"

  **2. Mapping the Concepts (15 mins)**
  Draw two columns on the whiteboard: **Direct Falsehood** vs. **Strategic Omission**.

  *   **Invite participants to place specific moments from the game into the columns.**
      *   *Example:* "When I asked about costs and they said 'They are competitive' instead of 'They are over budget'." -> **Strategic Omission.**
      *   *Example:* "When Advisor 3 said 'We have no licensing issues' knowing the application was pending." -> **Direct Falsehood.**

  *   **Facilitator Notes for Discussion:**
      *   **The Norm of Truth:** Explain that in philosophy, this touches on the *duty of veracity*. Advisor 1 & 2 kept the letter of the law but broke the spirit (Grice's Maxim of Quantity). Advisor 3 broke the letter of the law.
      *   **Listener Expectation:** Discuss whether the Committee Members had a right to know the risks simply because the Advisors were in a 'guiding role'. Does volunteering to be an Advisor create a higher moral duty than casual conversation?
      *   **Outcome vs. Intent:** Did the Palterers cause more damage than the Liar? (Often, omission leads to bad decisions just as lying does).

  **3. Limitations of the Exercise (5 mins)**
  Be honest about what the workshop *cannot* teach:
  *   **Stakes:** In real life, losing money hurts more than losing tokens. Real pain often makes lying *harder*, not easier.
  *   **Relationships:** In this game, you will likely never see these people again. In a community group, a lie destroys long-term trust, which is harder to repair than a budget deficit.
  *   **Complexity:** Real-life omissions are often unconscious. We tell ourselves we are 'protecting' people. The game makes it deliberate, which is rarer than self-deception.

  **4. Closing (5 mins)**
  Summarise the key takeaway: "Technical truth is not the same as transparency." Ask everyone to write down one commitment for how they will handle 'awkward truths' in the next community project.

  ---

  ## Facilitator's Guide: Risks & Pitfalls

  **1. The "Nice" Problem**
  *   **Risk:** Your community group members may be too polite. Advisors might volunteer the negative info anyway because they feel guilty, ruining the tension.
  *   **Fix:** In the briefing, emphasise: "This is a simulation. Your real reputation is not at stake. Please play the role as written, even if it feels uncomfortable. We need the data."

  **2. The Liar Who Won't Lie**
  *   **Risk:** Advisor 3 (The Crisis Agent) might be too moral to lie, even with permission. You end up with no example of direct falsehood.
  *   **Fix:** If this happens, do not force it. In the debrief, highlight this as a finding: "Even when permitted, the social cost of lying was too high for the participant." This is a valid philosophical point about internal moral compasses. Alternatively, as a last resort, you (the facilitator) can intervene mid-game with a "Breaking News" note that forces the issue, but use this sparingly.

  **3. Hostility Towards the Liar**
  *   **Risk:** If Advisor 3 lies and is caught, the Committee Members at that table may feel personally betrayed or angry, spoiling the mood.
  *   **Fix:** Pre-empt this in the Introduction. "You may feel frustrated by your Advisor. This is designed. Please try to analyse the feeling rather than attacking the person." During the reveal, validate their feelings: "It is natural to feel angry. That anger is the data point we are interested in."

  **4. Time Creep**
  *   **Risk:** Negotiations often run long.
  *   **Fix:** Be strict with the 5-question limit. Act as a visible timekeeper. If a table goes over time, they lose a Trust Token. This adds pressure that mimics real-world constraints.

  **5. Conceptual Overload**
  *   **Risk:** You might be tempted to introduce too many philosophical terms (Deontology, Utilitarianism, Gricean Maxims).
  *   **Fix:** Keep it grounded. Use the terms only if the group grasps them quickly. Focus on the *experience*: "Did the outcome matter more than the method?"

