answer: |-
  **MEMORANDUM**

  **TO:** Committee on Research with Human Participants
  **FROM:** [Name], Committee Member
  **RE:** Decision Memo: Project Overhear (Protocol #2023-44)
  **DATE:** October 26, 2023

  **BOTTOM LINE UP FRONT:** Decline the protocol as proposed. Specifically, the committee cannot approve the interventionist persona arm. The observational arm remains cleared as minimal risk, but the fabrication of trusted insiders within a vulnerable clinical support community exceeds acceptable ethical boundaries.

  **REASONING**

  Project Overhear aims to distinguish between epistemic bubbles and echo chambers within a specific population: parents of children with a rare neuroimmune condition. This distinction is vital. If these communities are merely bubbles—structures of omission—then introducing counter-attitudinal evidence should theoretically correct misconceptions. If they are echo chambers—structures of exclusion designed to discredit outside sources—then exposure to contrary evidence, even from insiders, may not cure the condition but reinforce the siege mentality. The investigators propose to test this by inserting eight fabricated personas per community, cultivated over seven months as trusted friends before deploying contrary evidence.

  Even setting aside ethics, the design faces a validity ceiling. A shift in expressed belief cannot distinguish a burst bubble from a successfully manipulated chamber. If a subject changes their mind because a "friend" told them to, have they updated their epistemic model, or have they merely performed loyalty to a relationship? Conversely, if the intervention fails, it may be because the community correctly identified the manipulation, not because the echo chamber mechanism holds. Furthermore, a successful manipulation is itself a technique that would be published. We must consider whether publishing a manual on how to breach vulnerable communities via fabricated intimacy is a net social good, regardless of the data gained.

  However, the primary grounds for this decision are ethical, grounded in the nature of the deception employed. We typically categorize deception in research by its intrusion on autonomy. I propose we refine this by sorting deception by what it recruits. First, deception can recruit a subject's beliefs (e.g., false feedback on a test). Second, it can recruit a subject's trust in a person (e.g., a confederate in a psychology experiment). Third, and most critically, it can recruit a subject's standing in a shared story, by inserting a fabricated character into the narrative a community tells about itself.

  Project Overhear relies on the third category. These personas will not merely post arguments; they will exchange private messages, be present through hospitalizations, and offer support at three in the morning. They are not just sources of information; they are characters in the community's self-narrative of survival and mutual aid. My suspicion, which the committee should test rather than defer to, is that this third type is not merely a more severe version of the first. It is categorically distinct. When you deceive someone about a fact, debriefing can restore the truth. When you deceive someone about a person, debriefing creates confusion. But when you deceive a community about its own history—revealing that the friend who held their hand during a crisis was a algorithmic construct—debriefing does not repair the injury. It is the moment the injury becomes legible. It retroactively turns genuine vulnerability into data points. This tells against the persona arm specifically, rather than against deception in research generally.

  The vulnerability of the population compounds this. The committee acknowledges that much of this community's hostility to institutional medicine is warranted; they were dismissed for years. Their trust is not a cognitive luxury; it is a survival mechanism. To weaponize that trust against them risks confirming their deepest fear: that institutions view them as subjects to be managed rather than partners in care.

  This leads to the disclosure problem. The protocol proposes a single disclosure post at the conclusion. In a community already primed to suspect surveillance, this is not a correction; it is a trigger. A terminal post revealing that eight active members were fabrications will not result in a calm acceptance of research ethics. It will trigger a hunt for plants among genuine members. Paranoia will metastasize. Members who offered genuine support may be accused of being remaining agents. The social fabric, which provides real goods to sick children and their parents, will be torn. The risk is not just individual distress; it is community destabilization.

  **THE REJECTED POSITION**

  The strongest argument for approval, articulated by those favoring the "quasi-public" designation, is that closed online groups function as public squares in the digital age. If we require consent for all observation or interaction in such spaces, field research becomes impossible. This position holds that the personas are merely continuous with decades of unobtrusive field research, such as sociologists joining groups to observe behavior. There is merit to the claim that privacy norms online are fluid. If these groups are truly public, then members assume the risk of being studied. Furthermore, if the research succeeds in reducing vaccine hesitancy regarding this condition, the public health benefit could outweigh the localized harm. This is a utilitarian calculus: sacrifice the integrity of a few groups to potentially save children from preventable illness. It is a serious argument that rests on the urgency of public health communication.

  However, this argument fails because it conflates observation with participation. A sociologist watching from the shadows does not become a friend. They do not accept private messages about hospitalizations. By becoming participants, the researchers assume the obligations of participants, including honesty. You cannot claim the cover of "unobtrusive observation" while actively manipulating the emotional landscape of the subjects. The quasi-public defense protects the right to observe, not the right to fabricate intimacy.

  **DECISION**

  The committee declines the persona arm. The investigators may resubmit a protocol that utilizes the observational arm only, or proposes an intervention that does not rely on fabricated personal relationships within a clinical support context. If you wish to test the echo chamber hypothesis, you must find a method that does not recruit standing in a shared story.

  **PUBLIC RATIONALE**

  The Committee on Research with Human Participants has declined the interventionist portion of Project Overhear. While the committee supports research into how health information spreads online, we determined that the proposed method involved unacceptable risks to participant welfare. The study planned to introduce fabricated personas into closed support groups for parents of seriously ill children. These personas would have built trusted relationships over months before revealing contrary medical evidence.

  We concluded that fabricating friendships within a vulnerable community causes harm that cannot be undone by later disclosure. Revealing that supportive community members were actually researchers would likely damage the trust necessary for these groups to function. While observational research in online spaces remains permissible, researchers may not deceive participants about their identity when establishing personal relationships. We encourage the investigators to redesign the study to protect the integrity of patient support networks.
