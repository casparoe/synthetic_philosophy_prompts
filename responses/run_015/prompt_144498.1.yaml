answer: |-
  You have stumbled into the **Discursive Dilemma** (sometimes called the Doctrinal Paradox), formalized by Philip Pettit and Christian List. It is the exact situation where proposition-wise voting (the requirements) yields a different collective outcome than conclusion-wise voting (the major credit).

  You are also dealing with **Issue Manipulation** (your ability to steer outcomes by how you slice the ballot) and **Human-Machine Epistemic Aggregation** (the LLM cloud).

  Given your constraints (one day/week, tired faculty, no budget, Dean scrutiny), you cannot solve the theoretical paradox. You must *manage* it procedurally. Your goal is not logical perfection; it is **auditability** and **perceived legitimacy**.

  Here is your defended agenda for the semester, ordered by dependency. You cannot solve Step 4 until you have fixed Step 2.

  ### Phase 1: Data Forensics (Weeks 1–3)
  **Task:** Quantify the contradiction.
  **Why:** You need to know if this is a theoretical nuisance or a practical fire. You also need evidence to show the Dean why a new protocol is necessary.
  **GA Action:** Have your GA export the last 3 years of voting records into a spreadsheet.
  **Look for:**
  1.  **The Inconsistency Rate:** How often did the course pass the requirements but fail the major (or vice versa)? If this number is <5%, you are over-engineering. If >15%, you have a crisis.
  2.  **The "Chair Effect":** Correlate the inconsistency rate with *your* predecessor's ballot structures. Did certain decompositions yield more "Yes" votes?
  3.  **The Expert Veto:** Identify cases where the subject-matter expert voted "No" on a technical requirement, but the committee overruled them. Did those courses later cause problems (complaints, low enrollment)?

  **Decision Point:** If the inconsistency rate is negligible, simplify the protocol to "Conclusion-Based" (just vote on the major) and skip the complex aggregation logic. If high, proceed to Phase 2.

  ### Phase 2: The LLM Protocol (Weeks 4–6)
  **Task:** Freeze the machine before aggregating it.
  **Why:** You cannot aggregate human and machine judgments if the machine is stochastic. A "cloud of answers" is noise, not data. For a formal committee record, the LLM must be a **deterministic clerk**, not a probabilistic voter.
  **Action:**
  1.  **Fix Temperature:** Set the LLM temperature to 0 for all official committee business.
  2.  **Fix the Prompt:** Create a single "Master Prompt" for requirement analysis. No rephrasing.
  3.  **Define the Output:** The LLM does not vote. It produces a **Brief**. It lists evidence for/against each requirement.
  4.  **Aggregation Status:** The LLM is **not** a voter. It is a pre-processor. Its output is part of the "packet" humans read before voting.
  **Why this order:** If you try to weight the LLM as a "fractional voter" (Phase 4) before stabilizing its output (Phase 2), your protocol will be mathematically defensible but operationally chaotic.

  ### Phase 3: The Ballot Lock (Weeks 7–9)
  **Task:** Remove your "superpower."
  **Why:** You identified that slicing the requirements differently changes the outcome. This is an ethical vulnerability. If a course is rejected, the proposer will claim you gerrymandered the ballot.
  **Action:**
  1.  **Global Rubric:** Define the sub-questions (Writing, Quantitative, etc.) *once* at the start of the semester. They cannot be customized per course.
  2.  **Binary Triggers:** Each requirement must be a binary Yes/No based on the Global Rubric.
  3.  **The "Chair's Recusal" Clause:** Write into the protocol that the Chair does not vote on ballot structure; it is adopted by default at the first meeting.
  **Why this order:** You cannot decide how to aggregate votes (Phase 4) if the votes themselves are structurally unstable.

  ### Phase 4: Aggregation Logic (Weeks 10–12)
  **Task:** Choose Premise-Based vs. Conclusion-Based.
  **Why:** This is the core Discursive Dilemma. You must pick one path.
  **Recommendation:** Adopt a **Premise-Based Procedure with a Safety Valve**.
  *   **Rule:** If a course passes all requirement sub-questions, it automatically counts toward the major.
  *   **Safety Valve:** A 2/3 majority vote can override this to reject a course *even if* it passes requirements (e.g., "It meets the rules, but it's not rigorous enough for our majors").
  *   **Why:** Pure Premise-Based is rigid. Pure Conclusion-Based is opaque. The Safety Valve allows faculty intuition (politics) to override logic, but requires a supermajority, making it a deliberate act rather than a contradiction.
  **LLM Integration:** Since the LLM is now a clerk (Phase 2), it provides the reasoning for the premises. Humans vote on the premises.

  ### Phase 5: The Expert Deference (Weeks 13–15)
  **Task:** Formalize the "quiet deference."
  **Why:** You noted some votes are technical, some are political. Treating them the same dilutes expertise.
  **Action:**
  1.  **Tagged Votes:** Mark sub-questions as "Technical" (e.g., Does this cover Calculus I content?) or "Policy" (e.g., Is this writing load appropriate?).
  2.  **The Veto:** On "Technical" questions, the designated subject-matter expert's "No" vote counts as a committee "No" unless 4/7 members override.
  3.  **Why last:** This is a nuance layer. Don't build this until the main voting structure is solid.

  ---

  ### What to Mine from Past Records (For your GA)
  To move questions up or down the priority list, ask your GA to calculate these three metrics:

  1.  **The Contradiction Index:** (Count of courses where Requirements ≠ Major Verdict) / (Total Courses).
      *   *If >10%:* Phase 4 (Aggregation Logic) becomes your top priority.
      *   *If <5%:* Phase 4 is low priority; focus on Phase 3 (Ballot Lock) to prevent future gaming.
  2.  **The Prompt Variance:** Run the same 10 past course descriptions through the LLM 5 times each with your current prompting style.
      *   *If variance is high:* Phase 2 (LLM Protocol) is critical. You cannot proceed until the machine is stable.
      *   *If variance is low:* You can treat the LLM as a stable clerk immediately.
  3.  **The Expert Overrule Rate:** How often was the subject expert overruled on technical matters?
      *   *If high:* Phase 5 (Expert Deference) needs to move up. You are risking curriculum quality.

  ### What to Stop Worrying About (The "Ignore" List)
  1.  **Arrow's Impossibility Theorem:** It proves no perfect voting system exists. You already know this. It doesn't help you write a protocol for Tuesday afternoon. It is theoretically interesting but practically paralyzing.
  2.  **LLM "Truth":** Do not spend time trying to make the LLM "correct." It is a text processor, not a truth engine. Treat its output as *argumentation*, not *fact*.
  3.  **Weighted Voting Schemes:** Do not try to assign the LLM 0.5 votes or the Expert 2 votes. Tired faculty will not do the math. Keep it binary (Yes/No) with override clauses.
  4.  **Consistency Proofs:** You cannot mathematically guarantee consistency between premises and conclusions in a human committee. Do not try to prove the protocol is logically airtight. Prove it is **procedurally fair**.

  ### The "Dean-Proof" Argument
  When you submit the protocol, your justification is not "we solved the Discursive Dilemma." It is:
  1.  **Auditability:** "We standardized the questions so we can track why courses are accepted/rejected over time." (Addresses Phase 3)
  2.  **Stability:** "We fixed the AI parameters so our records are consistent." (Addresses Phase 2)
  3.  **Expertise Protection:** "We prevent non-experts from overruling technical judgments without a supermajority." (Addresses Phase 5)

  ### Summary of Order
  1.  **Data (Weeks 1-3):** Is the problem big enough to fix?
  2.  **LLM (Weeks 4-6):** Stabilize the input.
  3.  **Ballot (Weeks 7-9):** Remove your own discretion.
  4.  **Logic (Weeks 10-12):** Pick Premise-Based + Safety Valve.
  5.  **Deference (Weeks 13-15):** Protect the experts.

  If you run out of time, cut Phase 5. If you cut Phase 3, the protocol is ethically compromised. If you cut Phase 2, the data is noisy. Phase 3 is your non-negotiable core.
