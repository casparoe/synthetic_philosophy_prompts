prompt: |-
  So I got roped into chairing my university's curriculum committee this year, which I assumed would be pure busywork right up until I noticed this: we vote separately on whether a proposed course satisfies each of several requirements (writing-intensive, quantitative reasoning, whatever else), and then we vote on whether it counts toward the major — and the overall verdict sometimes flatly contradicts the votes on the parts. A colleague mentioned this thing has a name and a whole literature attached to it, and I've been falling down that rabbit hole in my spare time since.

  Two wrinkles make it more than a textbook case for me. First, I'm the one who writes the ballot, so I choose the decomposition into sub-questions — and I've noticed I can pretty much steer the outcome by slicing a course's requirements differently, which is either a superpower or an ethical problem. Second, we've started using an LLM as a kind of clerk: I can ask it each sub-question separately and derive the verdict, or ask it for the verdict straight, and because it's stochastic and I sometimes rephrase, it hands back a little cloud of answers rather than one. So we're aggregating across a population of model-judgments as well as across seven humans, and nobody has any idea whether that thing should count as one more voter, as a tie-breaker, as a supplier of reasons, or not at all. It also matters that the sub-questions aren't all the same kind: on some everyone quietly defers to whichever member actually knows the subject matter, and on others it's straight-up politics.

  Constraints: me, roughly one day a week for a semester, one grad assistant who is very good with spreadsheets, no software budget, and the output has to be a written protocol that seven tired faculty will actually follow and that the dean won't laugh at.

  I'll write the protocol myself — what I want from you is a defended agenda for my limited thinking time: which questions about aggregating connected judgments I should actually grind on, in what order, and why that order. What's genuinely upstream of what, what's tractable for someone who is not a logician, what I should stop worrying about because the answer wouldn't change the protocol, and — the part I care most about — what I could dig out of our own past voting records that would move a question up or down the list. Also be honest about which bits of this literature people get excited about that are basically irrelevant to a committee like mine.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Situation:**
      *   **Role:** Chair of a university curriculum committee.
      *   **Task:** Write a written protocol for voting/aggregation that faculty will follow and the dean will accept.
      *   **Constraints:** ~1 day/week for a semester, 1 GA (good with spreadsheets), no software budget.
      *   **Problem:** The "Doctrinal Paradox" (or Discursive Dilemma). Voting on premises (requirements) vs. conclusion (major credit) yields contradictory results.
      *   **Complication 1 (Power/Ethics):** The Chair controls the ballot structure (decomposition), influencing outcomes.
      *   **Complication 2 (LLM):** An LLM is being used as a "clerk," providing stochastic answers to sub-questions or the whole. How to aggregate human + machine judgments?
      *   **Complication 3 (Heterogeneity):** Some sub-questions are technical (defer to expert), some are political (vote).
      *   **Goal:** A *defended agenda* for the user's thinking time. What to work on, in what order, why, and what data to mine from past records.
      *   **Tone:** Pragmatic, academic but not overly theoretical, honest about what matters vs. what's noise.

  2.  **Identify the Core Theoretical Problem:**
      *   This is the **Discursive Dilemma** (Pettit/List).
      *   *Premise-based procedure:* Vote on requirements, derive conclusion.
      *   *Conclusion-based procedure:* Vote on conclusion directly.
      *   *Outcome:* They can diverge.
      *   *LLM Angle:* This adds a layer of "epistemic aggregation" + "human-machine teaming."

  3.  **Determine the "Upstream" Questions (The Agenda):**
      *   I need to prioritize based on impact, tractability, and the user's constraints.
      *   *Priority 1: Legitimacy & Power.* The user noted the ethical issue of ballot structuring. If the protocol doesn't address this, the dean/faculty will reject it.
      *   *Priority 2: The Human-Machine Interface.* How the LLM is used is currently ad-hoc. This needs standardization before aggregation logic matters.
      *   *Priority 3: The Aggregation Logic.* Premise-based vs. Conclusion-based. This is the core logic puzzle.
      *   *Priority 4: Heterogeneity.* Expert deference vs. voting.
      *   *Priority 5: Theoretical Perfection.* Avoid deep logic rabbit holes that don't change practice.

  4.  **Drafting the Agenda Items (Iterative Process):**

      *   *Item 1: The LLM's Role.* Is it a voter? No, that's dangerous. Is it a clerk? Yes. But *how*? If it gives a "cloud of answers," we need a deterministic way to parse that before humans see it. *Decision:* Define the LLM as a "pre-processing tool," not a voter.
      *   *Item 2: Ballot Structure (The Ethical Bit).* The user admits they can steer outcomes. This needs a constraint. *Decision:* Standardize the decomposition criteria so the Chair can't game it per course.
      *   *Item 3: Premise vs. Conclusion.* Which one rules? In curriculum, usually, if it meets the requirements, it counts. But sometimes a course meets requirements but isn't "major quality." *Decision:* Premise-based is safer for consistency, but needs an appeal mechanism.
      *   *Item 4: Expert Deference.* Some votes aren't votes. *Decision:* Distinguish "Technical Verification" from "Policy Approval."
      *   *Item 5: Data Mining.* What past data matters? Look for the contradictions.

  5.  **Refining the Order (Why this order?):**
      *   You can't fix the voting logic (Item 3) if you haven't defined who/what is voting (Item 1 & 2).
      *   You can't define the ballot (Item 2) without knowing if the LLM is drafting it (Item 1).
      *   Data mining (Item 5) should happen early to inform the other decisions, but the *analysis* takes time. Let's put data mining as a parallel track or early step. Actually, mining past records is the best way to justify the protocol to the Dean. So, make it early.
      *   *Revised Order:*
          1.  Data Mining (Evidence base).
          2.  LLM Role (Define the agent).
          3.  Ballot Structure (Constrain the Chair).
          4.  Aggregation Rule (Premise vs. Conclusion).
          5.  Expert Deference (Nuance).

  6.  **Addressing the "Irrelevant Literature":**
      *   Social Choice Theory (Arrow's Impossibility) is too abstract.
      *   Deep LLM alignment theory is irrelevant.
      *   Focus on *Judgment Aggregation* and *Procedural Justice*.

  7.  **Addressing the "Data Mining":**
      *   Look for "Inconsistent Cases" (Passed requirements, failed major, or vice versa).
      *   Look for "LLM Variance" (How much does prompting change the output?).
      *   Look for "Expert Veto" (Did the subject expert ever get overruled?).

  8.  **Developing the "Tractability" Check:**
      *   User is not a logician. Keep math minimal. Use spreadsheets (GA's strength).
      *   Protocol must be simple enough for tired faculty.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the Discursive Dilemma.
      *   **The Agenda (5 Steps):** Ordered by dependency.
      *   **Data Mining Specifics:** What to ask the GA to pull.
      *   **The "Ignore" List:** What literature to skip.
      *   **Ethical/Power Note:** Addressing the ballot steering.

  10. **Refining the LLM Advice:**
      *   Crucial point: Do not let the LLM vote. Let it summarize arguments.
      *   The "cloud of answers" is a feature, not a bug (uncertainty quantification), but needs to be collapsed before human voting.

  11. **Refining the Ballot Steering:**
      *   This is the biggest ethical risk. The protocol must lock the decomposition rules *before* specific courses are reviewed.

  12. **Final Review against Constraints:**
      *   1 day/week? Yes, this agenda breaks down into weekly chunks.
      *   GA with spreadsheets? Yes, data mining relies on this.
      *   Dean approval? Yes, focuses on consistency and auditability.

  13. **Self-Correction during drafting:**
      *   *Initial thought:* Suggest a weighted voting system.
      *   *Correction:* No, too complex for tired faculty. Stick to binary votes with defined quorum/deference.
      *   *Initial thought:* Suggest rigorous LLM temperature testing.
      *   *Correction:* Too technical. Just standardize the prompt and temperature (set to 0) for official business.

  14. **Final Polish:** Ensure tone is collegial, sharp, and respects the user's intelligence. (The user clearly knows the literature exists, so name-drop Pettit/List but keep it practical).

  *(Self-Correction on the LLM aspect)*: The user says the LLM hands back a "cloud of answers." This implies they are running it multiple times or with high temperature. For a protocol, we need determinism. I need to advise them to fix the LLM parameters *before* worrying about aggregation. If the input to the humans is unstable, the human vote is noisy.

  *(Self-Correction on the "Steering")*: The user says they can steer by slicing requirements. This is the "Issue Manipulation" problem in social choice. The fix isn't better math; it's a *fixed rubric*. The protocol must define the requirements *globally*, not per course.

  *(Final Plan)*:
  1.  **Diagnosis:** Name the problem (Discursive Dilemma).
  2.  **Phase 1: Data Forensics (Weeks 1-3).** Use the GA. Find the contradictions.
  3.  **Phase 2: The LLM Protocol (Weeks 4-6).** Fix the machine before aggregating it.
  4.  **Phase 3: The Ballot Lock (Weeks 7-9).** Remove Chair discretion on structure.
  5.  **Phase 4: Aggregation Rule (Weeks 10-12).** Premise-based vs. Conclusion-based.
  6.  **Phase 5: The "Expert Veto" (Weeks 13-15).** Handling technical deference.
  7.  **What to Ignore:** Arrow's Theorem, complex LLM alignment, etc.

