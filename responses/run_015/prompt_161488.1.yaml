answer: |-
  Here is an audit of the legal analogy as applied to your situation, followed by an analysis of the specific complications you raised and a proposal for a more robust framework.

  ### 1. The Mapping: Legal Doctrine vs. Moral Blame

  | Legal Concept | Legal Definition (Civil/Equity) | Moral Analogue (D's Argument) | The Disanalogy (Where it Breaks) |
  | :--- | :--- | :--- | :--- |
  | **Plaintiff** | The party filing suit. | The Blamer (You). | In morality, the "plaintiff" is often the community or the norm itself, not just the individual speaking. |
  | **Defendant** | The party being sued. | The Blamed (D). | D is not compelled to enter a "plea." He can ignore the blame without contempt of court. |
  | **Injury** | Concrete, particularized harm to the plaintiff. | The burden of covering shifts; erosion of trust. | **Critical Break:** You *did* suffer injury (extra work). Legally, this grants you standing. D's claim that you lack standing is factually false even by his own analogy. |
  | **Court** | The tribunal with jurisdiction. | The moral community; the meeting; D's conscience. | There is no clerk to strike your complaint. The "forum" is fluid and lacks procedural rules. |
  | **Remedy** | Damages, injunction, specific performance. | Apology, behavioral change, restoration of trust. | Moral remedies are voluntary. You cannot enforce an apology via bailiff. |
  | **Connection** | Causation / "Same transaction or occurrence." | Nexus between blamer's fault and blamed fault. | Legal *unclean hands* requires the dirt to be in the *same matter*. Moral hypocrisy is often treated more broadly (general character). |
  | **Forum's Power** | Dismissal for lack of standing/equity. | Social dismissal; refusal to uptake the blame. | The forum cannot declare the blame *false*, only *ineffective* or *ignored*. |

  ### 2. Standing vs. Unclean Hands: Distinct Work or Conflation?

  D and his brother are conflating two distinct doctrines, and this conflation is doing the heavy lifting for their conclusion.

  **Standing** is jurisdictional. It asks: *Did this specific harm land on you?*
  *   **Legal Standard:** You must show injury-in-fact.
  *   **Your Case:** You covered D's shifts. You suffered the injury.
  *   **Verdict:** Under the legal analogy, **you have standing.** D's assertion that you do not is legally incorrect. He is using "standing" as a synonym for "moral purity," which is not what the doctrine means.

  **Unclean Hands** is equitable. It asks: *Did you act badly regarding this specific matter?*
  *   **Legal Standard:** The plaintiff's misconduct must relate directly to the subject matter of the litigation. General bad character is irrelevant (as the brother noted).
  *   **Your Case:**
      *   *Expense Padding:* Unrelated to shift coverage. Legally irrelevant.
      *   *Past Shirking:* Related to shift coverage. However, you have "reformed." Unclean hands usually bars relief for *ongoing* or *litigation-related* misconduct.
  *   **Verdict:** This is the only doctrine that arguably applies, but even here, the "unrelated dirt" (expenses) should be dismissed, and the "related dirt" (past shirking) is mitigated by reform.

  **Do they do the same work?**
  No. *Standing* denies access to the court because the plaintiff is the wrong person to sue. *Unclean hands* denies the *remedy* because the plaintiff is unworthy of equitable aid.
  *   **D's Conclusion:** "Your blame is void."
  *   **Legal Reality:** Standing affects *access*; Unclean Hands affects *relief*. Neither doctrine makes the underlying claim (that D missed shifts) **false**. They only affect whether the court will help *you* enforce it.
  *   **The Break:** In morality, there is no court to deny you access. Therefore, "standing" is metaphorical. It refers to **authority**, not jurisdiction. D is arguing you lack the *authority* to blame, not that the blame is factually incorrect.

  ### 3. Which Disanalogies Bear on D's Conclusion?

  You noted several disanalogies: no institution, no coercion, blame addressed to third parties.

  *   **No Institution/Coercion (Bears on Conclusion):** This is crucial. Because there is no judge to dismiss your case, D cannot *force* your blame to be void. He can only *refuse to accept it*. The "voidness" is not a structural fact; it is a social move he is making. He is attempting to act as his own judge, which the legal analogy explicitly forbids.
  *   **Blame to Third Parties (Bears on Conclusion):** This undermines D's "no injury" claim. If you are speaking for the team (third parties), you are invoking **associational standing** (like a union suing for members). This strengthens your position, suggesting you are a representative, not just an aggrieved individual.
  *   **Truth vs. Remedy (Idle for D's Purposes):** D wants to conclude the blame is *void* (untrue/unwarranted). The legal analogy only supports the conclusion that the *remedy* is unavailable. This disanalogy is fatal to D's argument. Even a plaintiff with unclean hands is not lying about the defendant's breach of contract; they just can't get an injunction.

  ### 4. The Three Hard Cases

  **Case 1: Connection (Expenses vs. Shifts)**
  *   **Legal Analogy:** *Unclean hands* requires the misconduct to be in the "same transaction." Padding expenses is a different transaction than missing shifts.
  *   **Moral Implication:** The analogy supports a **domain-restricted loss of standing.** Hypocrisy regarding finances does not strip authority regarding reliability.
  *   **Verdict:** D's reliance on the expense padding is legally and morally weak. It is "unrelated dirt." Only the past shirking is relevant, and even that is historic, not current.

  **Case 2: Derivative Dirt (Learned from D)**
  *   **Legal Analogy:** This resembles **estoppel** or **causation**. If the defendant induced the plaintiff's misconduct, the defendant cannot use that misconduct as a shield. (e.g., A drug dealer cannot sue a buyer for breach of contract, but also cannot blame the buyer for addiction the dealer caused).
  *   **Moral Implication:** If D normalized the culture of shirking that you participated in, he is **causally responsible** for your "unclean hands."
  *   **Verdict:** This turns the *unclean hands* doctrine back on D. He cannot profit from a norm he corrupted. This severely undermines his defense.

  **Case 3: Third-Party Blame (Speaking for the Team)**
  *   **Legal Analogy:** **Next Friend** or **Associational Standing**. Organizations can sue on behalf of members injured by a violation.
  *   **Moral Implication:** You are not claiming personal vindication; you are enforcing a communal norm.
  *   **Verdict:** This bypasses the "personal injury" requirement of standing entirely. You are acting as a trustee of the group's agreement. D's argument that *you* weren't injured (if he made it) is irrelevant if you represent those who *were*.

  **The Effect of Disclosure**
  *   **Legal Analogy:** In equity, coming to court with "clean hands" requires full disclosure. Hiding the dirt bars relief; disclosing it allows the court to weigh it.
  *   **Moral Implication:** By disclosing your record upfront, you satisfied the **duty of candor**. You removed the element of deception.
  *   **Verdict:** This **restores standing.** Hypocrisy is often defined as *concealing* one's own faults while condemning others. By acknowledging yours, you transformed the speech act from "I am perfect, you are not" to "We hold this standard, despite our struggles." This is moral leadership, not hypocrisy.

  ### 5. Scope of the Conclusion: Truth vs. Authority

  If D's conclusion survives (that you lack standing), what does it mean?

  1.  **Does it make the blame false?**
      *   **No.** In law, a case dismissed for standing does not mean the defendant didn't break the law. It means the *plaintiff* can't be the one to prosecute.
      *   **Application:** D still missed the shifts. The blame is factually warranted.
  2.  **Thought vs. Speech:**
      *   **Constraint:** It constrains the **felicity of the speech act**, not the validity of the thought. You may think D is unreliable. You may even say it. But the *force* of the demand is reduced.
      *   **Nuance:** It shifts the conversational burden. Instead of D answering for the shifts, the topic shifts to your consistency. D wins the *debate*, but not the *truth*.

  ### 6. A Better Analogy: Authority and Speech Acts

  The legal analogy fails because it treats blame as a **lawsuit for damages** rather than a **claim to authority**.

  **Better Analogy 1: The Felicity Condition (Speech Act Theory)**
  *   Blame is a speech act that attempts to change the normative landscape. Like a captain ordering a turn, it requires certain conditions to be "felicitous" (successful).
  *   **Hypocrisy** is a defect in the *speaker's authority*, not the *order's content*.
  *   **Result:** If a captain is drunk, the order "Turn Starboard" is still the right navigational move, but the crew may not obey. The order isn't *false*; it is **infelicitous**.
  *   **Benefit:** This preserves the truth of your accusation (D did miss shifts) while acknowledging why D feels entitled to ignore you (your authority is compromised). It prevents the "conversation-stopper" by allowing the reply: "You are right that I missed shifts, but given your history, I question your right to demand this of me." This opens a dialogue about standards, rather than closing it with "You're a hypocrite."

  **Better Analogy 2: Calling in a Debt**
  *   Imagine you lent D money. You also owe money to others.
  *   **D's Argument:** "You owe people too, so you can't ask me to pay you back."
  *   **Reality:** Your debts to others do not extinguish your debt from D.
  *   **Refinement:** If you owe D money *on the same account*, you can net it out. (This matches the *Derivative Dirt* case). But general debt (expenses) doesn't cancel specific debt (shifts).
  *   **Benefit:** This clarifies that obligations are distinct. Your past shirking was a debt you paid by reforming. D's shirking is a current outstanding debt.

  ### Summary Recommendation

  D's argument relies on a category error. He uses **Standing** (which you have, due to injury) to mask a claim of **Unclean Hands** (which is weak, due to lack of connection and your disclosure).

  *   **The Legal Audit:** You have standing (injury). You likely satisfy equity (disclosure, reform). D's "voidness" conclusion is legally unsupported; at most, he argues for reduced *weight*.
  *   **The Moral Reality:** Hypocrisy reduces the **persuasive power** of blame, not its **truth**.
  *   **The Strategy:** Do not accept the "void" conclusion. Accept the "authority" limitation.
      *   *Response:* "You are right that my past makes me less than perfect to judge this. I disclosed it because I know the standard applies to me too. But the shifts weren't covered, and the team suffered. My faults don't cover yours; they just mean we both need to be better. Let's talk about how we ensure coverage, not just my record."

  This moves the frame from **Jurisdiction** (Who are you to talk?) to **Normativity** (What do we owe each other?). It accepts the cost of your past without surrendering the validity of the present claim.
