prompt: |-
  At a meeting of the volunteer organisation I help run, I called out a fellow organiser — call him D — for repeatedly missing shifts he had signed up for, leaving the rest of us to cover for him. His reply was that I have no standing: last year I quietly padded an expense claim by a modest amount, and some years before that I missed commitments of my own. His brother, who is a lawyer, later spelled the point out for me using two doctrines: standing, which he glossed as requiring that you yourself were injured, by the very thing you complain of, in a way the court can remedy; and, separately, unclean hands, which he described as barring equitable relief to a plaintiff whose own conduct is dirty in the very matter he complains of — with the qualification, which he insisted on, that unrelated dirt about your general character is supposed to be irrelevant. The conclusion D wants, and that I have now heard in every argument since, is that a hypocrite's blame is simply void: the target owes it no uptake, may shrug it off, and is not answerable to the person blaming. People in glass houses, and so on.

  What I want is an audit of the analogy rather than a verdict on my conduct. Please lay the mapping out explicitly — a table of correspondences is fine — for what plays the plaintiff, the defendant, the injury, the court, the remedy, the connection requirement, and the forum's power to strike a complaint for want of standing. Then tell me where the mapping breaks. In particular: are standing and unclean hands doing the same work here, or does the analogy quietly need both, or is the popular version really an ancestor of neither? There is no institution that can dismiss my blame, no one compelled to listen, no remedy or coercion I am enlisting, and blame is addressed at least as often to third parties or to oneself as to its target. Which of those disanalogies actually bear on D's conclusion and which are idle for his purposes?

  Then three cases I cannot fit. First, connection: the dirt he taxes me with, padding expenses, is not in the same normative neighbourhood as what I blamed him for, whereas his missed-commitments charge is much closer to my own history; does the analogy support a domain-restricted loss of standing, or does hypocrisy taint all of a blamer's blame at once? Second, derivative dirt: my own pattern of shirking was in part picked up from watching him, years ago, before I reformed — may a blamer invoke wrongdoing that he himself produced in the blamer? Third, third-party blame: I was speaking largely on behalf of the people who covered his shifts rather than for myself, and I gather the law has devices for next friends and third-party standing, so I want to know whether the analogue helps me or whether not being the one wronged cuts the other way. I should add that I disclosed my own record up front and said I knew how easy the rationalisation is; whether that restores standing or makes it worse, I cannot tell. Finally: if the conclusion survives, does it mean only that I may not blame, or also that my blame was false or unwarranted, and does it constrain what I may think or only what I may say? And if the legal comparison is the wrong one, is there a better analogy — blame as a demand made from within a relationship, as a speech act with felicity conditions, as calling in a debt — that preserves whatever is true in the glass-houses slogan without delivering the conversation-stopper?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a volunteer organizer who called out a colleague (D) for missing shifts. D retorted that the user has no "standing" due to past misconduct (padding expenses, past shirking). D's lawyer brother supported this using legal concepts: *standing* and *unclean hands*.
      *   **Goal:** The user wants an *audit of the analogy* between legal doctrines and moral blame, not a verdict on their conduct.
      *   **Specific Tasks:**
          1.  Create a table of correspondences (Plaintiff, Defendant, Injury, Court, Remedy, Connection, Forum's Power).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Determine if *standing* and *unclean hands* do the same work or distinct work in this context.
          4.  Evaluate which disanalogies bear on D's conclusion (that blame is void/needs no uptake) and which are idle.
          5.  Address three specific "hard cases":
              *   *Connection:* Expense padding vs. missed shifts (different normative neighborhoods).
              *   *Derivative Dirt:* User learned shirking from D originally.
              *   *Third-Party Blame:* User spoke on behalf of others covered shifts.
          6.  Address the effect of disclosure (confessing past faults upfront).
          7.  Address the scope of the conclusion (does it make blame false? constrain thought or speech?).
          8.  Propose a better analogy if the legal one fails (relationship, speech act, debt).

  2.  **Deconstruct the Legal Analogy (Task 1 & 2):**
      *   *Legal Standing:* Requires concrete injury, causation, and redressability. It's about *who* can sue.
      *   *Unclean Hands:* Equitable doctrine. If you acted badly regarding the *specific matter* in litigation, you get no relief. It's about *worthiness* of relief.
      *   *Moral Blame:* A speech act, a normative demand, a relational repair mechanism.
      *   *Mapping:*
          *   Plaintiff = Blamer.
          *   Defendant = Blamed (D).
          *   Injury = The wrong done (missed shifts/burden on team).
          *   Court = The moral community / The audience / D's conscience.
          *   Remedy = Apology, change of behavior, restoration of trust.
          *   Connection = Nexus between blamer's fault and blamed fault.
          *   Forum's Power = Social sanction, dismissal of the argument.

      *   *Breaks:*
          *   No coercive power in morality.
          *   Blame isn't just about the blamer; it's about the norm.
          *   "Injury" in blame is often diffuse (community harm), not just personal.
          *   Legal standing is jurisdictional (case dismissed); moral standing is often about *weight* or *authority*, not existence.

  3.  **Analyze Standing vs. Unclean Hands (Task 3):**
      *   *Standing:* "You weren't hurt." In the user's case, they *were* hurt (had to cover shifts). So legal standing actually *supports* the user, not D. D is misusing the term.
      *   *Unclean Hands:* "You did bad stuff too." This is the real engine of D's argument (hypocrisy).
      *   *Conclusion:* They are doing different work. D conflates them. "Standing" in the legal sense requires injury *to the plaintiff*. The user suffered injury (extra work). So D's claim of "no standing" is legally false even by his own analogy. The real claim is *unclean hands* (hypocrisy).

  4.  **Evaluate Disanalogies & D's Conclusion (Task 4):**
      *   *No Institution:* Morality doesn't have a clerk to strike a case.
      *   *No Coercion:* D can ignore the blame, but that doesn't make the blame *false*.
      *   *Third Parties:* Blame is often communal.
      *   *Which bear on D's conclusion?* The lack of an institution means D cannot *force* the blame to be void. He can only choose not to accept it. The "voidness" is a social move, not a structural fact. The "no injury" disanalogy is crucial because the user *was* injured, undermining the "standing" claim.

  5.  **Address the Three Hard Cases (Task 5):**
      *   *Connection (Expenses vs. Shifts):* Legal *unclean hands* requires the dirt to be in the *same matter*. Expense padding $\neq$ Shift shirking. So, legally, this doesn't bar relief. Morally, does general hypocrisy matter? Usually, specific hypocrisy matters more.
      *   *Derivative Dirt (Learned from D):* This is a "tu quoque" variant. If D caused the user's fault, D is estopped from using it. Legally, this looks like *unclean hands* on D's part or *causation*.
      *   *Third-Party Blame:* Legal "next friend" or *parens patriae*. In morality, we often enforce norms on behalf of the community. This *strengthens* the user's position, it doesn't weaken it.

  6.  **Address Disclosure (Task 6):**
      *   Disclosing upfront shows good faith. It negates the "deception" aspect of unclean hands. It acknowledges the tension. It likely *restores* moral authority (humility) rather than defeating it.

  7.  **Address Scope of Conclusion (Task 7):**
      *   Does it make blame false? No. The shift was still missed.
      *   Thought vs. Speech? It targets the *speech act's authority*, not the truth of the proposition or the private thought.
      *   D's conclusion (blame is void) is too strong. It might reduce *efficacy* or *authority*, but not *validity*.

  8.  **Propose Better Analogies (Task 8):**
      *   *Debt:* You can't demand repayment if you owe money? No, you can.
      *   *Speech Act (Felicity Conditions):* Hypocrisy affects the *felicity* (success) of the blame, not its truth.
      *   *Relationship/Authority:* Blame is an exercise of authority. Hypocrisy undermines authority, not the rule.
      *   *Best Fit:* **Authority/Leadership.** A leader who breaks rules loses the *right to command*, but the rules remain valid. Or **Conversation:** Hypocrisy changes the topic from "Your Wrong" to "Our Consistency."

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, precise, philosophical but accessible, respecting the user's intelligence (they know the legal terms).
      *   *Structure:* Follow the prompt's sequence. Table first. Then breakdown of Standing vs. Unclean Hands. Then the Hard Cases. Then the Scope/Conclusion. Then Alternative Analogies.
      *   *Key Insight:* D is misusing "Standing." In law, standing requires injury. The user *had* injury. D means "Unclean Hands." This is a category error in D's argument.
      *   *Key Insight 2:* Moral blame is not a lawsuit for damages; it's a call for normative alignment.
      *   *Key Insight 3:* The "Glass Houses" slogan is about *persuasive force*, not *truth conditions*.

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "Derivative Dirt" clearly? *Correction:* Make sure to highlight that if D caused the fault, D is legally "estopped" or morally responsible for the corruption.
      *   *Check:* Did I distinguish between "Standing" and "Unclean Hands" clearly? *Correction:* Emphasize that Standing is about *injury* and Unclean Hands is about *conduct*. The user has Standing (injury) but maybe Unclean Hands (conduct).
      *   *Check:* The user asked about "Third-Party Blame." *Correction:* Connect this to *associational standing* in law.
      *   *Check:* The user asked if the blame becomes *false*. *Correction:* Be firm. Hypocrisy does not make the underlying accusation false.

  11. **Final Polish:** Ensure the table is clean. Ensure the distinction between "validity of the claim" and "authority of the claimant" is sharp. (This is the crux of the philosophical issue).

  *(Self-Correction on "Standing" definition)*: The lawyer brother defined standing as "requiring that you yourself were injured, by the very thing you complain of." The user *was* injured (had to cover shifts). So, under the brother's own definition, the user *has* standing. This is a critical point to hammer home. D is using "standing" as a synonym for "moral purity," which is not the legal definition.

  *(Self-Correction on "Unclean Hands")*: The brother said "unrelated dirt... is irrelevant." Expense padding is unrelated to shift shirking. So even under *unclean hands*, D's argument fails legally. The user's past shirking *is* related, but they reformed. Does past shirking count if reformed? Usually, unclean hands looks at current litigation conduct or very proximate past conduct.

  *(Final Plan)*:
  1. Table of Correspondences.
  2. Analysis of the Breaks (Institution, Coercion, Truth vs. Authority).
  3. Standing vs. Unclean Hands distinction (Crucial: User has Standing).
  4. The Three Cases (Connection, Derivative, Third-Party).
  5. Disclosure effect.
  6. Scope (Truth vs. Authority).
  7. Better Analogies (Speech Act/Authority).

