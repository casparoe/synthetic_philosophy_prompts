answer: |-
  Here are the five desiderata for adequate scalable oversight in a regulatory context.

  **1. Adversarial Symmetry**
  *Concrete Case:* The scheme must work even if the model generating the reasoning and the model assisting the judge are equally skilled and equally motivated to deceive. You cannot assume the "prover" is honest and only the "verifier" is skeptical.
  *Status:* **Non-negotiable.** (Validates your first hobby-horse: assuming asymmetry in skill or honesty creates a single point of failure.)

  **2. Epistemic Humility**
  *Concrete Case:* The scheme must not assume truth is inherently simpler or more persuasive than a lie under time pressure. A fabricated safety case may be logically smoother than the true, messy engineering constraint.
  *Status:* **Non-negotiable.** (Validates your second hobby-horse: this is the core epistemic problem. Schemes assuming truth "wins" debates fail against deceptive alignment.)

  **3. Inter-Subjective Stability**
  *Concrete Case:* A verdict of "safe" must hold if handed to a second qualified judge with different political or technical priors. If Judge A certifies based on Bayesian trust and Judge B rejects based on skepticism, the scheme is merely encoding bias.
  *Status:* **Non-negotiable.** (Validates your third hobby-horse: for regulation, reliability across observers is required, not just internal consistency.)

  **4. Termination**
  *Concrete Case:* The oversight process must end at the human judge. It cannot require deferring to a stronger overseer, who then needs an even stronger overseer.
  *Status:* **Non-negotiable.** (Validates your fourth hobby-horse: infinite regress defeats the purpose of scalable oversight.)

  **5. Time-Bounded Efficiency**
  *Concrete Case:* The judge must reach a verdict within the 40-minute sealed-room window. A scheme requiring weeks of computation or external tool use fails the operational constraint.
  *Status:* **Non-negotiable.** (This is the operational reality of the regulatory bottleneck.)

  **On Your Hobby-Horses**
  None of your four constraints are mere tastes; they are genuine desiderata for *certification*. In a research context, you might relax Stability or Symmetry to learn about model behavior. But for a regulator signing off on clinical guidance, assuming honesty, truth-persuasiveness, prior-independence, or infinite oversight layers renders the scheme useless. You have correctly identified the hard boundaries.

  **The Conflict and The Killer**
  The pair of desiderata most likely impossible to jointly satisfy are **Epistemic Humility** and **Inter-Subjective Stability**. If truth is not inherently more persuasive than a lie (Humility), then agreement between judges usually relies on shared priors or heuristics. But Stability demands agreement *despite* different priors. If the truth doesn't speak for itself, and judges don't share assumptions, how do they converge on the same verdict without external tools? This tension suggests that perfect stability may be unachievable under strict humility.

  The single requirement that does the most work in knocking out candidate schemes is **Epistemic Humility**. It instantly disqualifies any approach relying on "consistency checking" or "natural language entailment" where the assumption is that models prefer truth or that contradictions are easy to spot. It forces the scheme to be adversarial by design, which drastically increases complexity.

  **Scorecard**
  **Debate** schemes satisfy Adversarial Symmetry well by pitting models against each other, but they struggle with Time-Boundedness and Inter-Subjective Stability; a human judge often cannot resolve a sophisticated debate in 40 minutes, and verdicts may depend on which argumentative style the judge prefers. **Recursive or Iterated Amplification** handles Termination and Structure effectively by breaking tasks down, but it falters on Epistemic Humility; it often assumes the decomposed steps are easier to verify than the whole, which may not hold if deception is localized. **Market or Prediction-Market oversight** offers a path to Inter-Subjective Stability via price convergence, but it fails the Sealed-Room constraint and Time-Boundedness; real markets require liquidity and time, and simulated markets inside a sealed room risk collapsing into model consensus rather than truth-tracking. None currently clear all five bars.
