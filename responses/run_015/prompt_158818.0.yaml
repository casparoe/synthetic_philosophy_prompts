      *   *Analysis:* Safety is not sensitive to false lemmas, only to modal proximity. The email is a reliable ground. The false belief about infallibility does not generate a nearby world where the email says 2:00 and the defence is not at 2:00.
      *   *Verdict:* Matches your intuition.
  *   **(5) Aisha (Self-Fulfilling Maintenance):** **Knowledge.**
      *   *Analysis:* This relies entirely on the "Causal Upshot" clause. You stipulate that we hold fixed the causal upshot of G (the post causes the maintenance). Therefore, in all nearby worlds where Aisha has G (posts the message), the maintenance occurs (p is true). There is no nearby world where G is present and p is false.
      *   *Verdict:* Matches your tentative intuition.
  *   **(6) Theo (Unreliable Colleague):** **No Knowledge.**
      *   *Analysis:* Theo *cannot* discriminate the reliable instances of his colleague's testimony from the unreliable ones. Thus, we do not hold fixed the reliability of the source. In a nearby world, the colleague speaks (same G), says Friday, but the deadline is Thursday (p is false).
      *   *Verdict:* Matches your intuition.
  *   **(7) Priya (AI Assistant):** **Knowledge.**
      *   *Analysis:* Priya *can and does* discriminate the reliable subclass (pre-cutoff APIs). We hold fixed that the query is within the reliable subclass. In that fixed neighborhood, the AI is reliable. There is no nearby world where the AI says "Yes" (pre-cutoff) and the function does not exist.
      *   *Verdict:* Matches your intuition.
  *   **(8) Tomas (Self-Fulfilling Calendar):** **Knowledge.**
      *   *Analysis:* Structurally identical to Aisha (5). The calendar entry (G) causes the cancellation (p). The "Causal Upshot" clause holds this fixed. The belief is safe.
      *   *Verdict:* The principle predicts Knowledge. Since you are undecided, note that **Anchored Safety forces consistency between (5) and (8).** You cannot have (5) be Knowledge and (8) be Non-Knowledge on this principle, as the modal structure is identical.

  **Where it Overgenerates/Undergenerates:**
  The principle does not obviously overgenerate or undergenerate *relative to your specific verdicts*. However, the **Causal Upshot clause** is theoretically volatile. It renders the safety condition trivial for any self-fulfilling belief. If I believe "I will sneeze" and that belief psychosomatically causes me to sneeze, Anchored Safety counts this as Knowledge, provided I cannot discriminate the causal mechanism. This is a known problem with "causal safety" accounts (epistemic luck is replaced by causal luck).

  ### 2. The Cheapest Verdict to Overturn

  If you find the "Causal Upshot" clause too permissive (as many epistemologists would regarding self-fulfilling beliefs), the cheapest verdict to overturn is **(5) Aisha**.

  **Why (5)?**
  Case (5) is the only one where the truth of the belief depends *counterfactually* on the belief itself in a way that bypasses standard evidence-tracking. While you are tentatively inclined toward Knowledge here, this is the outlier compared to standard externalist intuitions. Case (8) is structurally identical, so overturning (5) naturally resolves your indecision on (8) toward "No Knowledge."

  **The Simpler Principle: Discriminatory Safety**
  If you drop (5) and (8), you can eliminate the "Causal Upshot" clause entirely. This yields a principle closer to standard Safety, refined only by your Discrimination constraint.

  *   **Sacrificed Verdicts:** (5) Aisha and (8) Tomas become **No Knowledge**.
  *   **Surviving Principle:** *S knows that p iff p is true, S believes p on grounds G, and there is no nearby possible world in which S has G, believes p, and p is false, where the neighborhood is generated by holding fixed every condition S can discriminate and does discriminate in forming G.*

  This principle is theoretically cleaner because it relies on *tracking* truth rather than *making* truth. It preserves your key insights on Fake Barns (2), Unreliable Colleagues (6), and Screened AI (7) without the baggage of self-fulfilling prophecies.

  ### 3. Predictions for New Cases

  Using **Anchored Safety** (your preferred principle including the Causal Clause):

  **A. Mathematical Derivation with Invalid Step**
  *   **Case:** Subject derives a true theorem $p$ via proof $G$. $G$ contains an invalid step, but the conclusion holds (perhaps the error cancels out or the step is harmless in this specific instance).
  *   **Prediction:** **Knowledge.**
  *   **Reasoning:** Mathematical truths are necessary. There is *no* possible world where $p$ is false. Therefore, the belief is trivially safe. The "Discrimination" clause does not help here unless the subject can discriminate the invalidity of the step *and* that discrimination would change the grounds $G$. If the subject treats the proof as valid, $G$ remains the proof. Since $p$ cannot be false, Safety is satisfied.
  *   **Note:** This aligns with your rejection of the No-False-Lemma clause in (4), but be aware that Safety generally struggles to rule out lucky mathematical proofs.

  **B. Unscreened Subclass (Reliable Source, Unscreended Risk)**
  *   **Case:** Source is unreliable in subclass $X$, reliable in subclass $Y$. Subject is in $Y$ (belief true). Subject *could* identify $X$ vs $Y$ but *does not* check; they simply trust the source.
  *   **Prediction:** **No Knowledge.**
  *   **Reasoning:** This turns on the phrasing "can discriminate **and does** discriminate." Since the subject *does not* discriminate the subclass, we do not hold fixed that they are in the reliable subclass $Y$. We must consider nearby worlds where the source is operating in the unreliable subclass $X$. In those worlds, the source says $p$, but $p$ is false. The belief is unsafe.
  *   **Contrast:** This correctly distinguishes the case from Priya (7), who *did* restrict her query.

  ### 4. The Finished Principle

  Below is the precise formulation of **Anchored Safety**, refined to ensure it applies consistently to future cases. I have annotated each clause with the case(s) that motivate it.

  **Anchored Safety Principle:**
  > Subject $S$ knows that $p$ if and only if:
  >
  > 1.  **Truth:** $p$ is true.
  >     *(Motivation: Standard condition)*
  > 2.  **Basis:** $S$ believes that $p$ on the basis of grounds $G$.
  >     *(Motivation: Standard condition; required to anchor the modal evaluation)*
  > 3.  **Anchored Safety:** There is no nearby possible world $w$ such that:
  >     *   (a) In $w$, $S$ has grounds $G$ and believes that $p$ on the basis of $G$; **and**
  >     *   (b) In $w$, $p$ is false;
  >     *   **Unless** the transition from the actual world to $w$ violates one of the following constraints on nearness:
  >         *   **Constraint I (Discrimination):** $w$ varies a condition $C$ that $S$ **can** discriminate and **does** discriminate in the actual formation of $G$.
  >             *(Motivation: Cases 6 & 7. Distinguishes Theo from Priya. Ensures that abilities not exercised do not secure safety.)*
  >         *   **Constraint II (Causal Upshot):** $w$ varies the causal connection between $S$'s having $G$ and the truth of $p$, where in the actual world $S$'s having $G$ causally ensures $p$.
  >             *(Motivation: Cases 5 & 8. Secures verdicts on self-fulfilling beliefs by ruling out worlds where the self-fulfillment fails.)*

  **Instructions for Application:**
  1.  Identify $G$ (the specific evidence/reasoning used).
  2.  Identify the actual world's causal structure regarding $G$ and $p$.
  3.  Construct the "Neighborhood": The set of worlds where $S$ has $G$ and believes $p$.
  4.  Apply Constraints:
      *   If $S$ actively discriminated a feature (e.g., "pre-cutoff API"), hold that feature fixed across the neighborhood (Constraint I).
      *   If $G$ causes $p$ in the actual world, hold the causal efficacy of $G$ fixed across the neighborhood (Constraint II).
  5.  Check for Error: If any world remains in the Neighborhood where $p$ is false, $S$ does not know.

  **Final Advisory:**
  Be prepared to defend **Constraint II**. It is the most novel and controversial part of this principle. If you encounter pressure that self-fulfilling beliefs (Aisha/Tomas) are not knowledge due to "epistemic luck" or "deviant causation," you should excise Constraint II and accept the loss of verdicts (5) and (8). If you maintain (5) and (8), you must argue that causal security is sufficient for epistemic security, even without tracking.
