  8.  **Final Polish:** Check the flow of argument. Make sure the transition from working memory to episodic conflict is smooth.

  *(Self-Correction on "In the weeds"):* Make sure they discuss the *mechanism* of the loop closure. Voss needs to explain *why* working memory sync creates the loop. Chen needs to explain *why* episodic divergence breaks it.

