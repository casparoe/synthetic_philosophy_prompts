      *   *Voss:* That's just internal contradiction. Like remembering a dream vs reality.
      *   *Chen:* No, it's agent conflict.

  6.  **Polishing Language:** Ensure British spelling (synchronises, behaviour, centre). Ensure tone is academic but intense.

  7.  **Final Review against Constraints:**
      *   Dialogue format? Yes.
      *   Voss/Chen roles correct? Yes.
      *   Hofstadter concepts applied specifically? Yes.
      *   Trial conditions (6 months, 30% private, etc.) mentioned? Yes.
