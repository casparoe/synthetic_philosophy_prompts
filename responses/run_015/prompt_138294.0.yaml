      *   *Negation:* "It is not the case that stealing is wrong." Is this disapproving of stealing? No, it's lacking the approval of disapproving. The module needs to track this HR distinction.
      *   *Truth:* "It is true that stealing is wrong." Just adds emphasis, no new fact.
