      *   *Section 1 (Conditionals):* Handling "If stealing is wrong..." The module asks for approval of the *combination* of attitudes. Not "don't steal," but "approve of disapproving of stealing."
      *   *Section 2 (Negation):* The distinction between lacking approval and actively disapproving. The "withholding" state.
      *   *Section 3 (Truth/Minimalism):* "It is true that..." as a grammatical device.
