      **Welcome to Ethical Attitude Alignment.**
      This training module has been designed by Normative Systems Integration (NSI) to align personnel mental states with corporate policy without invoking disputed metaphysical claims. Per the NSI Specification v.9, the meaning of a moral sentence is entirely constituted by the non-cognitive attitude expressed by its utterance. Accordingly, this module will not assert that any specific action is prohibited. Instead, it will catalog the attitudes typically expressed by persons who claim such actions are prohibited. Your completion requires recognizing these attitudes, not necessarily holding them.

      **Section 1: Conditional Commitments**
      Consider the sentence: "If falsifying a delivery record is wrong, then you should not do it."
      In previous years, Compliance might have asserted the antecedent. Under current specifications, we cannot assert that falsifying is wrong, as that would require you to adopt a specific disapproval attitude. Instead, you are asked to endorse a higher-order attitude. You are not being asked to disapprove of falsifying records. You are being asked to approve of the combination of (A) disapproving of falsifying records and (B) not falsifying records.
      *Prompt:* Please select the state that matches this profile.
      [ ] I disapprove of falsifying records.
      [ ] I approve of those who disapprove of falsifying records.
      [ ] I have no attitude regarding records.

      **Section 2: Negation and Withholding**
      Precision is required regarding negative claims. There is a distinction between "It is not the case that stealing is wrong" and "Stealing is permissible."
      HR Attestation Code 882 distinguishes three states:
      1. Being for stealing (Approval).
      2. Being against stealing (Disapproval).
      3. Withholding judgment (Neither 1 nor 2).
      Note that State 3 is not identical to State 2. If you merely lack the attitude of disapproval, you are not necessarily in a state of approval. You are in a state of withholding. The company respects your right to withhold, provided the withholding does not interfere with logistics throughput.
      *System Note:* If you find yourself sliding from State 3 to State 2 without conscious authorization, please reset the module.

      **Section 3: Truth Claims**
      You may encounter statements such as: "It is true that safety protocols must be followed."
      Under NSI specifications, the word "true" functions as grammatical garnish. It adds emphasis but does not indicate correspondence with external reality. You may certify that it is "true" that safety protocols must be followed without believing that safety protocols must be followed, provided you understand that others express disapproval when safety protocols are violated.
      *Warning:* Do not confuse understanding the grammar of disapproval with the experience of disapproval.

      **Assessment Item 1**
      Premise 1: If being for bribery is wrong, then you should not be for bribery.
      Premise 2: Being for bribery is wrong.
      Conclusion: Therefore, you should not be for bribery.
      Question: Does this inference hold if you have only endorsed the higher-order attitude in Section 1?
      [ ] Yes, the logic is valid.
      [ ] No, the attitude content shifts between premises.
      [ ] I prefer not to answer.

      **Footer Note**
      This document has been reviewed by Legal. No assertions regarding the moral status of freight manipulation were made during the drafting of this module. Retaliation against employees for failing to express disapproval is prohibited, provided the failure to express does not constitute a breach of contract. Vendor management clauses apply to subcontractors who may lack the capacity for attitude formation.

      **FINAL CERTIFICATION SCREEN**
      **ACTION REQUIRED**

      By clicking the button below, you certify that:
      1. You have reviewed the logical relations between ethical attitudes described above.
      2. You understand that "wrong" denotes a mode of disapproval rather than a property of actions.
      3. You currently hold the attitude that it is wrong to falsify delivery records.

