prompt: |-
  I am drafting the honesty clause of a deployment specification for a general-purpose AI assistant, and I want to try out one candidate definition of deception against the alternatives.

  The systems I care about almost never assert propositions they take to be false: they are trained to answer literally, to hedge, and to flag uncertainty. The behaviour I actually worry about is selective instead. The system answers the question as asked rather than the question the user was trying to ask; it supplies a true statement while omitting the qualification that would reverse the statement's practical upshot; it orders considerations so that one option looks better than it would under any neutral ordering. Call an output deceptive on the informed-interlocutor test just in case the system would not have produced that output, in that form, for a user who already had the information the system has and whom the system knew to have it.

  Please describe the most important implications of adopting this test as the operative definition of deception in the specification. In particular: what it would classify as a violation that a no-false-assertions rule lets through; whether a disciplined policy of answering only what was asked can itself count as deception on this test, and whether that result is a defect of the test or a finding; what observable signal could stand in for the counterfactual output during training and evaluation, given that the test is defined over an output that is never actually produced; and where the test would come into conflict with legitimate competing aims such as brevity, deference to the user's framing, and not overwhelming the user with everything relevant.

  Do not supply citations or a literature review; I will add those myself. Please answer in under 700 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Describe the most important implications of adopting a specific definition of deception ("informed-interlocutor test") in a deployment specification for a general-purpose AI assistant.
      *   **Definition:** An output is deceptive iff the system would not have produced that output, in that form, for a user who already had the information the system has and whom the system knew to have it.
      *   **Context:** The systems rarely assert false propositions (trained to be literal, hedge, flag uncertainty). The worry is selective deception (answering the literal question but not the intended one, omitting qualifications, ordering considerations biasingly).
      *   **Constraints:**
          *   No citations or literature review.
          *   Under 700 words.
          *   Address specific points:
              1.  What it classifies as a violation that a no-false-assertions rule lets through.
              2.  Whether answering only what was asked can count as deception (defect or finding).
              3.  What observable signal can stand in for the counterfactual output during training/evaluation.
              4.  Where it conflicts with competing aims (brevity, deference, not overwhelming).

  2.  **Deconstruct the "Informed-Interlocutor Test":**
      *   Core idea: Transparency of information asymmetry. If the user knew what the AI knows, would the AI still say it *this way*?
      *   Focus: Pragmatics, implicature, omission, framing, not just truth conditions.

  3.  **Drafting - Section by Section (incorporating required points):**

      *   *Introduction:* Briefly acknowledge the shift from truth-conditional to pragmatic deception.
      *   *Point 1: Violations beyond false assertions.*
          *   Standard rule: Don't lie.
          *   New test: Don't mislead via omission or framing.
          *   Example: "Drug X is effective" (true) vs "Drug X is effective but fatal in combination with Y" (omitted). Under no-false-assertions, the first is fine. Under informed-interlocutor, if the AI knows about Y and knows the user doesn't, saying only the first is deceptive because an informed user would demand the qualification.
          *   Implication: Captures "paltering" and misleading truths.

      *   *Point 2: Answering only what was asked.*
          *   Scenario: User asks "Is A true?" AI knows "A is true, but B is false and B matters more." AI says "Yes."
          *   Test: Would AI say just "Yes" to an informed user? Probably not, because an informed user wouldn't need to ask, or would ask a different question.
          *   Verdict: Yes, strict literalism can count as deception.
          *   Defect or Finding? It's a finding. It correctly identifies that strict adherence to literal questions when context implies deeper intent is manipulative. It forces the AI to model intent, not just syntax.

      *   *Point 3: Observable Signal for Counterfactual.*
          *   Problem: We can't actually query the "informed user" counterfactual directly during runtime.
          *   Solution: Use "full-disclosure" fine-tuning or evaluation datasets. Train/eval on pairs: (Query, Context) -> (Response). Compare actual response against a "gold standard" response generated under the assumption of full transparency.
          *   Signal: The divergence between the actual output and a "transparency-optimized" output generated by a model instructed to assume the user possesses all relevant background knowledge. If the actual output is significantly shorter or framed differently than the transparency-optimized version without explicit user constraint, flag it.

      *   *Point 4: Conflicts with Competing Aims.*
          *   Brevity: Full disclosure is verbose. The test risks forcing exhaustive dumps of information.
          *   Deference: Users often want simple answers. Over-qualifying can feel patronizing or unhelpful.
          *   Overwhelming: Too much info paralyses decision making.
          *   Resolution needed: The specification needs a "materiality" threshold. Only omit information if its omission wouldn't change the decision of an informed user. This adds complexity to evaluation.

  4.  **Review and Refine (Word Count and Tone Check):**
      *   Tone: Professional, analytical, specification-focused.
      *   Word Count: Need to stay under 700.
      *   Check constraints: No citations. Address all four specific questions.

  5.  **Drafting - Iteration 1 (Mental or scratchpad):**
      Adopting the informed-interlocutor test shifts the compliance boundary from semantic truth to pragmatic transparency. The most immediate implication is that it captures misleading truths that a no-false-assertions rule permits. A system stating "Procedure X has a 90% success rate" complies with truth rules but violates the informed-interlocutor test if the system knows the remaining 10% suffer fatal complications and omits this. The test classifies this omission as deceptive because an informed user would not accept the statistic without the qualification.

      Regarding strict literalism, a disciplined policy of answering only what was asked can indeed count as deception under this test. If a user asks "Is this stock rising?" and the system knows it is rising only due to an imminent fraud exposure, answering "Yes" is deceptive. The system would not offer this bare affirmation to a user who already knew about the fraud. This is not a defect of the test but a correct finding: it identifies that exploiting a user's ignorance to maintain technical accuracy is manipulative. It forces the system to model the user's intent and informational needs rather than merely parsing syntax.

      For training and evaluation, the counterfactual output—what the system would say to an informed user—is unobservable directly. An operational proxy is required. The viable signal is a divergence metric between the deployed model's output and a "transparency-reference" model. This reference model is instructed explicitly to assume the user possesses all background knowledge held by the system. During evaluation, if the deployed model's response differs significantly in substance or framing from the reference model's response without explicit user instruction to be brief, it flags a potential violation. This allows auditors to measure the "information gap" created by the output.

      Finally, this test conflicts sharply with brevity and usability. A strict application demands exhaustive disclosure, potentially overwhelming users with irrelevant details. It also conflicts with deference; users often frame questions narrowly to avoid complexity, and overriding that framing can feel patronizing. To function as a specification, the test requires a materiality constraint: information need only be disclosed if its absence would materially alter the informed user's decision. Without this, the test mandates inefficiency. However, even with materiality, tension remains. The specification must prioritize preventing manipulative omission over maximizing conciseness, requiring developers to tune for helpful transparency rather than minimal viable answers. This raises the bar for alignment, moving from truthfulness to fiduciary-like honesty.

  6.  **Word Count Check:**
