answer: |-
  There is no single, universally canonical term in game theory, behavioral economics, or negotiation theory that perfectly isolates this specific configuration: an escalation dynamic where the *absolute* costs are trivial, sunk costs are negligible, and the driver is purely the *relative* outcome against a specific opponent.

  However, the phenomenon sits at the intersection of three established concepts. Understanding why none of them quite fit helps clarify what is missing:

  1.  **War of Attrition:** This describes the *structure* (two parties wait/bid until one quits), but standard models assume the prize has a fixed intrinsic value ($V$). In your cases, $V$ is negligible; the value is derived entirely from the *other party losing*.
  2.  **Spite (Game Theoretic):** This describes the *motive* (utility functions where $U_{self}$ decreases as $U_{other}$ increases). While technically accurate, "spite" is often treated as a static preference parameter rather than a dynamic escalation process. It also carries colloquial baggage of "irrational anger," whereas your examples describe a calculated (if costly) defense of status.
  3.  **Identity-Based Conflict:** In negotiation theory (e.g., Bush & Folger), this describes conflicts where the stake is "who we are" rather than "what we get." This captures the *relational* nature but doesn't inherently describe the *escalation mechanic* (the bidding/raising of stakes).

  Because the field lacks a specific noun for the *dynamic process* of escalation driven by relative standing rather than absolute gain or prior investment, I will coin a term that bridges the economic and relational aspects.

  ### Coined Term: **Relative-Stake Escalation**

  **Definition:**
  **Relative-Stake Escalation** is a conflict dynamic in which two parties increase their commitment to a contest not because the absolute value of the prize justifies the cost, nor because prior investment compels them (sunk cost), but because the utility of the outcome is defined *relationally*. The primary "win condition" is not acquiring the resource, but ensuring the specific opponent does not acquire it, or ensuring one does not submit to the opponent. The stake is the *difference* in status between the parties, not the absolute resource.

  **Boundaries and Distinctions:**

  *   **Vs. Sunk-Cost Fallacy:** In Sunk-Cost Escalation, the driver is backward-looking ("I've already spent $X, I must continue"). In Relative-Stake Escalation, the driver is forward-looking and relational ("If I stop now, *he* wins"). A party can enter Relative-Stake Escalation with zero prior investment.
  *   **Vs. War of Attrition:** In a standard War of Attrition, parties endure costs to win a prize of value $V$. If $V$ drops to near-zero, a rational actor quits. In Relative-Stake Escalation, $V$ is endogenous to the rivalry; the value *increases* as the opponent's commitment increases, because the "prize" is dominance.
  *   **Vs. Ordinary Spite:** Spite can be a one-off action (e.g., rejecting a fair offer to punish the other). Relative-Stake Escalation requires a *feedback loop* where each party's escalation validates the other's refusal to yield, creating a spiral specifically bound to that dyad.
  *   **Vs. Reputation Building:** Reputation building is usually generalized (signaling toughness to *the market* or *future* opponents). Relative-Stake Escalation is dyadic and specific; the actor may not care about their reputation with anyone else, only about the standing vis-à-vis *this* opponent.

  ### Confidence Assessment

  *   **Claim: No single established term exists.**
      *   **Confidence:** 90%.
      *   *Reasoning:* While "spite," "attrition," and "identity conflict" are well-defined, a search of standard game theory and negotiation lexicons reveals no single label that combines the *dynamic escalation* with the *relative-utility motive* while explicitly excluding sunk costs. It is usually described descriptively (e.g., "spiteful bidding," "ego-driven standoff").
  *   **Claim: "Spite" and "War of Attrition" are the nearest technical neighbors.**
      *   **Confidence:** 95%.
      *   *Reasoning:* These are the mathematical and structural components that underlie the phenomenon.
  *   **Claim: The motive is distinct from general reputation building.**
      *   **Confidence:** 85%.
      *   *Reasoning:* In some models, dyadic rivalry is a subset of reputation (signaling to the opponent for future interactions with *them*). However, your examples (property bidding) suggest a terminal interaction where future dealings are unlikely, isolating the relative stake as the sole driver.

  **Point of Least Certainty:**
  I am least certain (80% confidence) that there is not a niche term within **auction theory** specifically. Auction theorists study "bidding fever" and "rivalry effects" (e.g., Ku, Malhotra, & Murnighan, 2005), and there may be a specialized phrase like "competitive arousal escalation" used in that specific subfield that has not crossed over into general negotiation or game theory terminology. However, even "competitive arousal" leans psychological (emotional state) rather than structural (the configuration of stakes).

  \answer{Relative-Stake Escalation}
