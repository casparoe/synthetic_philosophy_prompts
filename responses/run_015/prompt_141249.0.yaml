  Also, on the "Degenerating" point: Lakatos says a programme degenerates when it *only* explains anomalies post-hoc. In ML, we often fix evals by changing the eval (contamination) or adding a wrapper (scaffolding). This *looks* degenerating. But if Scaling Laws hold, it's progressive. I need to balance this.

