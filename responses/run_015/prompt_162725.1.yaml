  *Reply:* "IF predicts allele spread. My criterion predicts when groups become subjects of adaptation. Bottlenecks suppress within-group conflict, enabling traits impossible under pure IF accounting."
  *Soft:* IF folks think predicting allele spread is all that matters.
  *[L: High | D: Med | C: High]*

  **3. Theoretician**
  *Q:* "Price equation is partition-invariant. Your bottleneck is just a specific parameter choice, not metaphysics."
  *Reply:* "Statistics are invariant; causal interventions aren't. Bottlenecks restrict the intervention space. You can't select on groups if lower-level variance leaks. I'm mapping causal leverage, not math."
  *Soft:* "Causal leverage" needs rigorous definition to satisfy a theorist.
  *[L: Med | D: High | C: Med]*

  **4. Microbialist**
  *Q:* "In serial transfer, cells still compete inside colonies. Isn't that cell selection?"
  *Reply:* "Yes, which is why bottlenecks are crucial. They reset that variance. Without them, cell selection wins. With them, group traits persist. I'm defining the threshold where group selection wins."
  *Soft:* Doesn't address partial bottlenecks.
