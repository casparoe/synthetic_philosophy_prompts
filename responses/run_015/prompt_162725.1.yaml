  **5. Phil Pluralist**
  *Q:* "Why deny reality to non-bottlenecked levels? They still exert causal power."
  *Reply:* "They exert causal power, but lack heritability. I'm defining units of evolution, not interaction. A whirlpool is real, but it doesn't evolve. Same here."
  *Soft:* Distinction between "cause" and "unit of evolution" is blurry.
  *[L: Med | D: Low | C: High]*

  **6. Phil Eliminativist**
  *Q:* "Units of selection is a confused framework. Just model the dynamics."
  *Reply:* "Agreed philosophically, but biologists need heuristics. This criterion tells experimentalists where to look for adaptations versus where to look for equilibrium dynamics."
  *Soft:* Admits the framework is merely pragmatic.
  *[L: Low | D: Med | C: Med]*

  **7. Hope Nobody Asks (Human Evolution)**
  *Q:* "Human cultural groups have founders/leaders. Does culture create bottlenecks making human groups selectable?"
  *Reply:* "By my criterion, yes. Cultural bottlenecks can reset variance. But that's gene-culture coevolution, distinct from the biological vertebrate groups I'm addressing."
  *Soft:* Blurs the line between biological and cultural evolution.
  *[L: Low | D: High | C: Med]*

