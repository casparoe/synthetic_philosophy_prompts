  The Social Insect reply is my weakest link. Functional integration often outweighs strict bottlenecks in biology. If they argue budding colonies *do* adapt novelly despite variance leakage, my bottleneck necessity claim collapses. I'm betting on heritability over integration, but eusociality is the hard case. Prepare to concede that "individuality" might come in degrees.
