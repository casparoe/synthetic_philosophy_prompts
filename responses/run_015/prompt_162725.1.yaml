      *   *Objection 1 (Social Insect):* Swarming/budding doesn't have a single-cell bottleneck. Colonies are still individuals.
          *   *Reply:* Bottlenecks matter for *heritability*, not just cohesion. Swarming leaks variance; you're measuring colony fitness, not selection *on* colonies as distinct from cells.
