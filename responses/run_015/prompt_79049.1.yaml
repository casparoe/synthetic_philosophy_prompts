answer: |-
  I am going to give you a credence of 0.25 that the claim is right as stated for real human beings. I know that number feels low given how elegant the underlying theory is, but the gap between the mathematical ideal and human psychology is where the probability mass evaporates. To get there, I have to break the claim down into the specific conditions required for it to hold, because the theorem itself is not the problem, but rather its mapping onto reality. The math behind this, known as Aumann's Agreement Theorem, is essentially airtight on its own terms, so I assign a probability of 0.99 to the proposition that within a formal system of Bayesian agents with common priors and common knowledge of each other's posteriors, disagreement is impossible. That part is not up for debate, and if your friend is dismissing the math itself, they are wrong about that specific piece. However, the claim you are evaluating is about real people, not formal agents, and this is where the number drops precipitously. The likelihood that any two random humans actually satisfy the conditions of having common priors is vanishingly small, perhaps around 0.05, because our starting assumptions are shaped by genetics, culture, and unique life histories in ways we cannot fully enumerate or align. Even more critical is the condition of common knowledge, which requires not just that we know each other's views, but that we know that we know them, and so on ad infinitum, a state that human communication almost never achieves due to noise, ambiguity, and trust deficits, so I give the condition of satisfied prerequisites a probability of less than 0.10 in any given real-world argument.

  Then there is the issue of whether same evidence is a well-defined thing, which is a major fracture point in the argument. Two people can look at the same study and extract different likelihoods from it because their background models of how the world works filter the data differently, and while you could argue this is just a difference in assumptions, it often feels like a difference in processing that isn't easily cashed out into a prior. I would assign a probability of about 0.50 to the idea that evidence is interpreted consistently enough between two people to treat it as a shared input, because theory-laden observation is a robust phenomenon in psychology. Furthermore, a significant portion of disagreements that appear factual are actually disguised disagreements about values or semantics, where people are arguing over definitions or what outcomes they prefer rather than the state of the world, and I estimate there is at least a 0.60 chance that a persistent disagreement labeled as factual actually contains these non-factual elements which the theorem does not address. When you combine these factors, the high certainty of the math is dragged down by the low probability of the conditions being met, resulting in my final credence of 0.25 that the claim holds universally for humans.

  The single piece this final number is most sensitive to is how broadly you define the term assumptions. If you allow assumptions to include every heuristic, cognitive bias, and processing algorithm in the human brain, then the claim becomes almost tautologically true because any difference in output must stem from some difference in the internal machinery, which you could label an assumption. If you take that expansive view, my credence would jump to around 0.80 because the claim becomes a description of mechanism rather than a testable prediction about rationality. However, if you stick to the stricter definition implied by the theorem, where assumptions are priors over world states and not bugs in the reasoning engine, the number stays low because humans make computational mistakes that are not prior differences. To move my number the most, you would need to show me evidence that human updating is close enough to Bayesian that we can treat our biases as stable priors rather than errors, effectively demonstrating that we are rational agents operating with different starting data rather than broken calculators.

  I need to be straight with you about where my own reasoning here is most likely to be wrong, because I am biased toward seeing human irrationality as a barrier to the theorem. I might be underestimating the power of charitable interpretation to reverse-engineer someone's position into a coherent set of priors. It is possible that what looks like a processing error or a semantic confusion can always, with enough effort, be modeled as a rational update from a different starting point, in which case my skepticism about the applicability of the math is misplaced. I am also potentially conflating the difficulty of finding the differences with the existence of the differences, just because we cannot easily isolate the divergent prior does not mean it isn't there. If I am wrong, it is because I am treating the theorem as a practical tool for dispute resolution rather than a structural claim about information, and if you view it as the latter, the probability that the disagreement is theoretically reducible to info and priors is higher than my number suggests, perhaps closer to 0.50. But given the strict wording of your claim that it can always be cashed out with nothing left over, I stick with 0.25 because the leftover of human irrationality is too large to ignore.
