answer: |-
  # The Spec: Desiderata for Literal Colony-Level Mentality

  To move beyond *façon de parler*, a theory of group minds must treat the colony not as a metaphor for a mind, but as a physical system that satisfies the conditions for mentality in its own right. The following desiderata synthesise your cases into a portable standard applicable to ants, firms, or server farms.

  ### 1. Distributed Integration (Non-negotiable)
  **The Case:** House-hunting and Memory without a rememberer.
  **The Requirement:** The system must integrate information in a way that is physically inaccessible to any single component. It is not enough that the *sum* of the parts knows the nest site is to the north; the system must possess a state that encodes this comparison without any individual component encoding the comparison. Furthermore, this state must persist beyond the turnover of components (ants/workers) via structural or chemical traces (trails/architecture/logs).
  **Rationale:** If the information exists fully within individual parts, the group level is redundant. If the information vanishes when the individuals die, there is no persisting subject to hold a belief.

  ### 2. Normative Capacity (Non-negotiable)
  **The Case:** The colony can be wrong.
  **The Requirement:** The system must be capable of misrepresentation. It must be possible for the colony to act on a state (e.g., 'food is north') that fails to correspond to reality, where the failure is not merely a mechanical breakdown but a cognitive error. The system must have conditions of satisfaction that can be violated.
  **Rationale:** Pure causal covariance (a trail exists because food was there) is not belief. Belief requires the possibility of being false while the system continues to operate as if true. This distinguishes a mind from a thermometer.

  ### 3. Explanatory Autonomy (Non-negotiable)
  **The Case:** Redundancy and No double counting.
  **The Requirement:** Attributing a mental state to the colony must support counterfactuals that cannot be supported (or are intractably complex to support) by attributing states only to the individuals. The colony-level cause must not compete with the ant-level cause; rather, the colony-level description must capture a causal pattern that is invisible at the lower level.
  **Rationale:** If a complete ant-by-ant redescription predicts the same behaviour with equal precision, the colony mind is epiphenomenal. To be literal, the group state must do causal work that the parts, individually described, do not.

  ### 4. Substrate Neutrality (Negotiable)
  **The Case:** Gradual replacement and Slave-making colonies.
  **The Requirement:** Mentality must depend on organisational role, not biological substance. Swapping ants for robots, or workers for slaves of a different species, should not alter the mental attribution provided the causal structure remains invariant.
  **Rationale:** If the theory relies on genetic relatedness or specific biology, it cannot be ported to firms or servers. However, this is negotiable if one argues that specific biological histories are constitutive of *this specific kind* of mind, though that limits portability.

  ### 5. Persistence and Identity Conditions (Negotiable)
  **The Case:** Fission and The swap case.
  **The Requirement:** The theory must specify whether the mind resides in the material components (the ants) or the structural organisation (the nest/trails). In a fission event, it must determine if one mind becomes two, or if one dies and a new one is born. In a workforce swap, it must decide if the 'soul' of the colony moves with the workers or stays with the infrastructure.
  **Rationale:** Without this, we cannot count minds. However, nature may be messy here; demanding crisp identity conditions might be imposing human legalistic standards on biological continua.

  ### 6. Boundary Determinacy (Negotiable)
  **The Case:** Too many minds.
  **The Requirement:** The theory must provide a principled reason for why the colony is a mind but a random subset of ants is not. It must prevent an explosion of overlapping subjects.
  **Rationale:** If every functioning subset is a mind, the concept loses utility. However, like Persistence, this may conflict with the Sorites worry in Gradual Replacement.

  ***

  # Intentionality vs. Phenomenal Consciousness

  **Decision:** The list is for **Intentionality only**. Phenomenal consciousness (what it is *like* to be the colony) should be excluded from the core spec.

  **Argument:** Demanding phenomenal consciousness smuggles in an anthropocentric prejudice that stalls the functional analysis. We can agree that a firm 'decides' to merge or a colony 'believes' food is north based on input-output organisation and internal state regulation without agreeing that the system *feels* pain or joy. Consciousness is a separate 'hard problem'. If we require 'what it is like' for literal mentality, we risk eliminating not only colonies but potentially many individual animals or even humans in certain states. For the purpose of a reading group on *group minds*, the functional capacity to represent the world and act on those representations (intentionality) is the necessary and sufficient condition for the 'mind' label. Consciousness can be a secondary research question, but making it a gatekeeper requirement renders the spec useless for non-biological candidates like server farms.

  ***

  # Tensions and Collisions

  You correctly identified that **Boundary Determinacy** and **Gradual Replacement (Sorites)** are in trouble together. If mentality emerges gradually as you swap ants for robots, there is no sharp threshold where the system *becomes* a mind. Yet, Boundary Determinacy demands we stop the count of minds from exploding by drawing a line. You cannot have a vague emergence curve and a sharp boundary count simultaneously. One must give: either we accept vague objects (a colony is *partially* a mind) or we accept arbitrary boundaries.

  The second collision is between **Explanatory Autonomy** and **Substrate Neutrality**. To claim Explanatory Autonomy, we often rely on specific causal powers of the organisation. But if we swap the substrate (ants to robots), do the counterfactuals hold exactly? If the robots react slightly differently to pheromone mimics, the colony-level prediction might fail while the individual-level prediction holds. High substrate neutrality risks weakening the specific causal claims needed for Autonomy.

  **The Heavy Lifter:** **Explanatory Autonomy**. This is the criterion that kills most candidates. Most 'group minds' collapse under the weight of individual-level redescription. If you can explain the move by tracking the ants, you don't need the colony. This requirement forces the theory to prove the group level is *real*, not just convenient.

  **The Dead Weight:** **Boundary Determinacy (Strict)**. Insisting on a non-arbitrary boundary for 'Too Many Minds' is likely impossible for distributed systems. Nature is fuzzy. Demanding a crisp line will force the theory to make up distinctions that don't exist in the physics of the system. It is better to accept that 'mind' might be a degree concept here.

  ***

  # Scoring Stock Positions

  *   **Eliminativism:** Fails **Distributed Integration** and **Normative Capacity** by fiat. It claims only ants have states. It scores well on **Boundary Determinacy** (no group minds to count) but fails the portability test entirely. It is the null hypothesis; useful for scepticism, but offers no positive account of the observed coordination.
  *   **As-If (Intentional Stance):** Passes **Normative Capacity** and **Integration** easily, as it only requires predictive utility. However, it fails the core brief: it explicitly admits the belief is *not* literal, but a compression of ignorance. It satisfies the user's desire for a tool, but denies the ontological claim the reading group is testing.
  *   **Superorganism (Unit-of-Selection):** Strong on **Persistence** and **Integration** via evolutionary history. However, it fails **Substrate Neutrality**. It cannot account for slave-making colonies or server farms easily, as it ties mentality to genetic fitness and biological selection. It conflates 'being a unit of evolution' with 'being a mind'.
  *   **Realiser Functionalism:** The strongest candidate. It treats the colony as a system realising functional states. It passes **Substrate Neutrality** and **Normative Capacity**. It struggles with **Explanatory Autonomy** (risking overdetermination) and **Boundary Determinacy** (functional boundaries are often fuzzy). It is the only view that treats the colony mind as literal without requiring biological essentialism.
