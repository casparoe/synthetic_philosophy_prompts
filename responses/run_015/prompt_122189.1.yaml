      *   **Problem:** The professor uses an analogy (Peirce = North Pole expedition; James = Hiking to a desired campsite) to argue Peirce = Objective Reality vs. James = Subjective Utility. The user suspects this analogy smuggles in assumptions and oversimplifies James (and possibly Peirce).
