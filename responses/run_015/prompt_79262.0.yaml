answer: |-
  You are right to reject the standard diagnosis. The cases you describe are not instances of the Sunk Cost Fallacy (SCF), nor are they merely rationalizations of it. They are distinct logical structures that share a surface resemblance to the fallacy but differ in their mechanism of justification.

  The standard Sunk Cost Fallacy is a **normative error**: it assigns *intrinsic* value to past expenditure ("I must continue because I spent $X").
  Your cases describe **causal relevance**: the past expenditure has altered the *present conditions* of the choice ("Because I spent $X, I am now in State $Y$, and in State $Y$, continuing is optimal").

  Here is the carving you requested, separating the mechanisms, locating the difference, and offering a term for the shape.

  ### 1. The Carving: Three Distinct Mechanisms
  While these cases share a shape, they rely on three different economic and psychological mechanisms. Lumping them as one phenomenon obscures why they are rational.

  **Instance 1: The Author (Pre-commitment / Rule Consequentialism)**
  *   **Mechanism:** This is a **Ulysses Pact** (Schelling, Elster). The agent knows their future self will be prone to akrasia (weakness of will) or shifting preferences.
  *   **Why it's not SCF:** The past cost is not the benefit. The benefit is **maintaining the integrity of a decision-rule**. The "cost" of quitting is not the lost time, but the depreciation of the agent's ability to bind themselves in the future. If she quits, she lowers the probability of success for *all* future projects.
  *   **Existing Discussion:** Thomas Schelling, *The Strategy of Conflict* (self-binding); Jon Elster, *Ulysses and the Sirens*.

  **Instance 2: The City (Signaling / Reputational Collateral)**
  *   **Mechanism:** This is **Reputational Bonding**. In contract theory and game theory, completing a project with a collapsed business case can be rational if the loss is viewed as a premium paid for reliability.
  *   **Why it's not SCF:** The expenditure is not "sunk" in the sense of being gone; it is **invested in a public good (trust)**. The city is buying future favorable contract terms. The past cost is the *price of the signal*, not the *reason for the action*.
  *   **Existing Discussion:** Oliver Williamson (Transaction Cost Economics); Signaling Theory (Spence).

  **Instance 3: The Linguist (Asset Specificity / Increasing Returns)**
  *   **Mechanism:** This is **Specific Human Capital**. The two years spent were not "lost"; they were converted into a specific cognitive asset (proficiency).
  *   **Why it's not SCF:** This is the strongest case. It is not about the past at all; it is about the **marginal utility of the present**. A beginner's hour of study yields less value than an advanced student's hour. The past investment changed the *production function* of the future.
  *   **Existing Discussion:** Gary Becker (Human Capital); W. Brian Arthur (Increasing Returns/Path Dependence).

  ### 2. Is it One Phenomenon or Two?
  It is **one logical form** instantiated by **three different mechanisms**.

  The unifying logical form is **State-Dependence**.
  *   **In the Fallacy:** The agent argues: $Past Cost \rightarrow Present Value$. (False link).
  *   **In Your Cases:** The agent argues: $Past Cost \rightarrow Present State \rightarrow Present Value$. (True link).

  In all three of your instances, the past expenditure has physically or structurally altered the agent's current position (their discipline, their reputation, or their skill). The decision to continue is rational *relative to the current state*, even if it would not have been rational *ex ante*.

  ### 3. Locating the Difference
  You asked where the difference is to be located. It is located in the **Counterfactual Baseline**.

  *   **The Sunk Cost Fallacy** asks: "Knowing what I know now, was the past money well spent?" If no, stop. It treats the past as a standalone ledger entry.
  *   **Your Cases** ask: "Knowing what I know now, does the *existence* of the past expenditure make the future option more valuable than it would be otherwise?"

  The difference is **not** in the reason cited (all three cite forward-looking reasons).
  The difference is **not** in the ex ante wisdom (the Author might have been foolish to start the book).
  The difference **is** in the **causal pathway**. In the fallacy, the past is a *weight*. In your cases, the past is a *foundation*.

  ### 4. The "Never Quit" Man
  You asked about the man whose policy is simply that he never quits anything.
  *   **If the rule is blind:** He is **outside** your pattern. He is committing the Sunk Cost Fallacy with a longer time horizon. He is treating the *fact* of initiation as a moral imperative regardless of the structural consequences.
  *   **If the rule is instrumental:** He is **inside** your pattern (Instance 1). If he maintains the rule *because* he knows that a "quitter" identity degrades future agency, he is practicing rational pre-commitment.
  *   **The Boundary:** The line is drawn at **flexibility**. If he would abandon the rule in the face of catastrophic new evidence (e.g., the book is libelous, the rail line is geologically impossible), he is rational. If he continues *even then* solely because "I never quit," he has slipped into the fallacy (rigidity).

  ### 5. Names and Terminology
  There is no single standard term that captures this specific shape without carrying the baggage of irrationality.

  **Existing Terms (and where they stop fitting):**
  *   **"Rational Escalation of Commitment" (Staw & Ross):** Closest existing academic term. It acknowledges that persistence can be rational. *Limitation:* It is mostly used in organizational behavior to describe why managers *think* they are rational when they might not be; it doesn't fully capture the Linguist case (skill acquisition).
  *   **"Path Dependence":** Fits the Linguist perfectly. *Limitation:* Too broad; implies historical lock-in without necessarily implying rationality.
  *   **"Asset Specificity":** Fits the Linguist and City. *Limitation:* Doesn't capture the Author (psychological rule).
  *   **"Pre-commitment Strategy":** Fits the Author. *Limitation:* Doesn't capture the Linguist (who isn't binding herself, just optimizing).

  **A Coined Term:**
  Since you prefer a coined term with edges to a bare label, I propose:

  # **Structural Sunk Costs**

  **Definition:** Past expenditures that are irrecoverable but have generated a **structural advantage** (psychological, reputational, or technical) that makes continuation rational, whereas it would not be for a new entrant.

  **Edges and Boundaries:**
  1.  **The Core:** The three cases you provided. The cost has been *converted* into capital (disciplinary, reputational, or cognitive).
  2.  **The Boundary (The Fallacy):** "I must finish this meal because I paid for it." Here, the cost creates no structural advantage (eating more yields no future benefit); it is purely normative weight. This is *Nominal Sunk Cost*.
  3.  **The Boundary (The Blind Rule):** "I must finish this meal because I am a person who finishes meals." If this rule yields no health or disciplinary benefit and causes sickness, it is *Rigid Sunk Cost*.
  4.  **The Boundary (The Fresh Start):** If the structural advantage decays (e.g., the linguist forgets the language, the city's reputation recovers), the justification vanishes. *Structural Sunk Costs* are time-sensitive.

  **Why this term works:**
  It distinguishes between costs that are merely **sunk** (gone, buried) and costs that are **structural** (built into the foundation of the current situation). It validates your intuition that the "shape" is different: in the fallacy, the cost is a hole in the ground; in your cases, the cost is the footing of a building.

  ### Summary of the Carving
  *   **The Fallacy:** The past dictates the future by *weight*.
  *   **The Shape:** The past dictates the future by *position*.
  *   **The Test:** Ask the agent: "If you could magically retain the *benefits* of the past (skill, reputation, discipline) without having paid the *cost*, would you still continue?"
      *   If **Yes**: It is **Structural Sunk Cost** (Rational). The value is in the state, not the spend.
      *   If **No**: It is **Sunk Cost Fallacy** (Irrational). The value is in the spend itself.

  In your three cases, the agent would answer **Yes**. (The linguist would keep Russian if she woke up fluent tomorrow; the author would keep writing if she woke up disciplined; the city would finish if it woke up trusted). That counterfactual stability is the proof that the cost is structural, not fallacious.
