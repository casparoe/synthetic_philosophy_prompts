  **Aggregation Logic**
  I treat the overflow and availability-without-phenomenality terms as a disjunction within the distinctness framework. I calculate the probability of at least one dissociation occurring using the union formula $P(A \cup B) = 1 - (1-P(A))(1-P(B))$, treating them as independent for baseline calculation despite likely positive correlation, because evidence for one widens the conceptual space for the other. The "Workspace Entails Phenomenality" component (0.40) functions as a constraint on the Availability-without-Phenomenality term, reducing its effective probability to $0.60 \times (1 - 0.40) = 0.36$. The final number is the product of the Substantive Distinction probability, the adjusted Dissociation Union, the GWT Access probability, and the Methodological Tractability probability.

