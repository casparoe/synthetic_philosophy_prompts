          *   $P_{new}(E \cap F) = P_{new}(F|E)P_{new}(E) = P_{old}(F|E)P_{new}(E)$.
          *   Also $P_{new}(E \cap F) = P_{new}(E|F)P_{new}(F) = P_{old}(E|F)P_{new}(F)$.
          *   So $P_{old}(F|E)P_{new}(E) = P_{old}(E|F)P_{new}(F)$.
          *   $\frac{P_{old}(E \cap F)}{P_{old}(E)} P_{new}(E) = \frac{P_{old}(E \cap F)}{P_{old}(F)} P_{new}(F)$.
          *   $\frac{P_{new}(E)}{P_{old}(E)} = \frac{P_{new}(F)}{P_{old}(F)}$.
          *   This implies the "Bayes Factor" for $E$ must equal the Bayes Factor for $F$. If the shifts are different (e.g., $0.4 \to 0.7$ vs $0.5 \to 0.8$), the ratios are different ($1.75$ vs $1.6$). Thus, **contradiction**. You cannot satisfy rigidity on both non-identical partitions if the marginal shifts imply different likelihood ratios for the intersection.
