          *   If $\mathcal{E}$ and $\mathcal{F}$ are not independent or identical, satisfying *both* rigidities while changing marginals $P(E)$ and $P(F)$ is often mathematically impossible unless the shifts are consistent with the joint structure. This is likely where the "trivial no-change" intuition came from. If you demand $P_{new}(H|E) = P_{old}(H|E)$ AND $P_{new}(H|F) = P_{old}(H|F)$ for *all* $H$, you overconstrain the system.

