      *   **Commutativity:** Ordinary conditioning on $A$ then $B$ is the same as $B$ then $A$ (if consistent). JC on partition $\mathcal{E}$ then $\mathcal{F}$ is *not* generally the same as $\mathcal{F}$ then $\mathcal{E}$.
      *   **The Simultaneous Shift Problem:** If I have a report that shifts $P(E)$ and $P(F)$ simultaneously, how do I update?
