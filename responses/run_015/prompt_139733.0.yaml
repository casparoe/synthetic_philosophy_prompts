answer: |-
  **TO:** Funders and Policy Staff
  **FROM:** [Member A] and [Member B]
  **DATE:** October 26, 2023
  **SUBJECT:** Joint Memo on the Moral Incidents of Exclusion

  **1. Agreed Claims and Conceptual Decomposition**

  We write jointly to clarify the structure of our disagreement regarding border controls. While we reach different conclusions, we share a foundational vocabulary. We agree that border controls constitute **coercion**: the use of force or threats to prevent identifiable individuals from moving across geographical lines. We agree that **state territory control** grants a state the factual ability to monitor land, but this factual control does not automatically generate a moral right to exclude. We agree that the **empirical literature** on wage, fiscal, and institutional effects can inform policy prudency but cannot settle the moral question of whether exclusion is permissible in the first place.

  We also agree that the **associationist analogy** (comparing a state to a private club) is load-bearing for one of us but defective for the other. For the defense of discretion, it explains why communities might value self-determination. For the defense of open borders, it fails because states claim monopoly power over territory, unlike voluntary clubs.

  To locate our disagreement precisely, we decompose the phrase **the right to exclude** into five separate legal-moral incidents. We indicate below which incidents we jointly affirm and which remain contested.

  1.  **A claim-right against entry:** Others have a duty not to enter without permission. (Contested: One of us views this as inherent; the other views it as conditional on justification.)
  2.  **A power to waive that right on conditions:** The state may issue visas or permits. (Agreed.)
  3.  **A power to set terms after entry:** The state may regulate conduct or path to citizenship for those admitted. (Agreed.)
  4.  **A privilege of enforcing by various means:** The state may use barriers, patrols, or deportation to uphold the claim-right. (Contested: Disagreement exists on the proportionality and permissible severity of these means.)
  5.  **An immunity against having the arrangement overridden by outsiders:** External actors cannot veto the state's membership rules. (Agreed, subject to international human rights treaties.)

  Where we disagree on the **claim-right**, the dispute is not merely verbal. One of us hears "right" as a mere **liberty** (the state is free not to admit), while the other hears it as a **claim-right enforceable by force** (others have a duty to stay out). We acknowledge this distinction. The following table details where our substantive divergences lie, using specific test cases to isolate the cruxes.

  **2. Disagreements Table**

  | Crux / Sub-question | Discretionary View (Member A) | Coercion/Justification View (Member B) | Agreed Test Case | Predictions & Conditions for Being Wrong |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Scope of Membership**<br>Does exclusion require social integration? | Yes. Political communities are defined by shared life; unobtrusive presence still alters the membership composition. | No. If a migrant seeks only trade or transit without social claim, exclusion requires specific harm-based justification. | **The Unobtrusive Migrant:** A person wanting to live in a thinly populated region with no social contact. | **A:** If this migrant causes no cultural friction yet exclusion remains valid, our view holds. <br>**B:** If we cannot justify excluding this specific person without appealing to mere sovereignty, our view weakens. |
  | **2. Territory vs. Membership**<br>Is the right tied to land or people? | The right attaches to the political community as a whole, regardless of internal geography. | The right is tied to specific coercive zones; restricting internal movement requires separate justification. | **The Archipelago State:** A state restricting entry to one island only, leaving others open. | **A:** If internal borders are morally equivalent to external ones, the distinction collapses. <br>**B:** If restricting one island is treated same as closing all borders, the territory-based coercion argument fails. |
  | **3. Alienability**<br>Is the right property or fiduciary? | Property-like. If the state owns the right, it may sell or lease admission slots to employers or other states. | Fiduciary. The state holds the right in trust for citizens; it cannot be alienated for profit without consent. | **Selling Slots:** A state auctioning visas or leasing admission rights to another government. | **A:** If selling slots undermines political integrity, the property analogy is wrong. <br>**B:** If selling slots is permissible, the right is not purely fiduciary. |
  | **4. Necessity & Justice**<br>Does urgency or causality override exclusion? | Exclusion remains valid even if conditions are dire, though compensation may be owed for harms caused. | Exclusion evaporates when nowhere else is habitable, or if the state caused the migration pressure. | **One Habitable Territory** AND **Causal Responsibility:** A world with only one safe zone; or a state that destabilized the migrant's origin. | **A:** If we admit a duty of admission in these cases, the right to exclude is not fundamental. <br>**B:** If we admit no duty even here, the justification view fails the necessity test. |
  | **5. Enforcement Means**<br>What force does the right license? | Broad privilege. If the right exists, the state may use fencing, interception, or detention to secure it. | Narrow privilege. Means must be proportional; lethal force or high-seas interception requires higher justification. | **Means of Enforcement:** From paperwork checks to physical interception at sea. | **A:** If certain means are categorically forbidden despite valid exclusion, the right is limited. <br>**B:** If all means are permissible given a valid claim-right, the coercion cost is underestimated. |

  **3. Convergence and Stopping Points**

  We must be honest about whether anything could resolve this debate. There are empirical findings that would move us. Member A would revise their position if evidence showed that open borders produce catastrophic institutional collapse in receiving states, undermining the very capacity for self-determination. Member B would revise their position if evidence showed that unrestricted movement systematically violates the basic rights of existing citizens to secure a political culture.

  However, much of our disagreement rests on undeferable premises. Member A prioritizes **political self-determination** as a primary good, valuing the community's right to shape its future even at cost to outsiders. Member B prioritizes **individual liberty and equality**, valuing the migrant's freedom of movement unless specific harm is proven. We mark this as the point where our collaboration stops. We cannot argue for these ultimate values within the scope of a policy memo, nor can we derive one from the other.

  Is there any case, finding, or distinction that would actually move the debate? Honestly, no. We have mapped the disagreements, but we occupy different moral frameworks. We recommend that policy staff treat these as competing constraints: maximize self-determination where possible (Member A's constraint) while minimizing coercion where possible (Member B's constraint). Any policy will require a political choice between these incompatible goods. We sign this not to resolve that choice, but to ensure it is made with clarity about what is being traded.
