answer: |-
  Your diagnosis of the stalemate is correct: the debate persists because participants are sliding between empirical, semantic, and methodological claims while treating them as a single ontological package. Your proposed cut (State vs. Norm) is a useful sharpening of the field, but it is not entirely new. It maps onto the distinction between **Ontological Realism** and **Semantic Non-Cognitivism/Fictionalism**, though framing it as "Norm-eliminativism" highlights a specific pressure point that often gets missed.

  Here is the structural diagnosis you asked for.

  ### 1. The State/Norm Cut: Is it earning its keep?

  Your distinction is valuable because it forces the combatants to specify *what* is being eliminated. However, it largely recapitulates the **Realism vs. Instrumentalism** debate, with a specific twist on the instrumentalist side.

  *   **State-Eliminativism** is standard **Ontological Eliminativism**. It claims the posited mechanism does not exist. This is indeed an empirical claim (mostly), dependent on how cognitive architecture is eventually cashed out (e.g., connectionist weights vs. symbolic tokens).
  *   **Norm-Eliminativism** is stronger than standard Instrumentalism. Dennett's Intentional Stance, for example, is instrumentalist but claims belief ascriptions *are* true insofar as the stance works. Your "Norm-eliminativism" claims there is *no fact of the matter* about correctness. This is closer to **Fictionalism** or **Expressivism**. It says belief-talk doesn't describe the world; it performs a social function (like "the average family has 2.4 kids").

  **Why the cut helps:**
  The stalemate exists because Realists defend *State* (there is a causal structure doing the work) while Eliminativists attack *Norm* (the ascription conditions are too messy to be truth-apt).
  *   The Realist says: "There is a neural correlate that functions as a belief."
  *   The Eliminativist says: "You can't fix the reference of 'belief' across contexts, so the sentence is false."
  *   **Result:** They talk past each other. One is talking about circuitry; the other is talking about truth-conditions.

  **Why the cut might fail:**
  It risks creating a false dichotomy. If there is no State (no functional profile), there can be no Norm (no correctness conditions). They are entangled. However, your hunch is right: the *interesting* philosophy is on the Norm side. The State side is waiting on neuroscience to tell us if systematic causal roles exist. The Norm side is where the conceptual work is. If you can convince your group to argue *only* about whether belief ascriptions have truth conditions (Norm), ignoring for a moment whether neurons do the work (State), you might bypass the empirical stalemate.

  ### 2. The Three Claims (a, b, c) and the Slide

  You identified the engine of the frustration. Here is how they interact to prevent resolution:

  *   **(a) Empirical:** "No state has this causal profile." This is currently undecidable. Connectionism looks like it kills discrete beliefs, but modern transformers look like they might encode something propositional. Because (a) is unresolved, partisans retreat to (b).
  *   **(b) Semantic:** "'Belief' fails to refer." This is where the fight actually lives. It relies on a theory of reference (causal-historical vs. descriptivist). Eliminativists assume a descriptivist theory (if the folk theory is wrong, the term refers to nothing). Realists assume a causal-historical theory (we point to a thing, even if our theory of it is wrong, like "water" before H2O). **The debate is often a disguised argument about philosophy of language, not mind.**
  *   **(c) Methodological:** "Stop using it." This is a pragmatic claim. Realists argue it's indispensable for now; Eliminativists argue it blocks progress. This claim is usually deployed as a trump card when (a) and (b) are deadlocked.

  **Diagnosis:** The fight never ends because (b) is treated as a consequence of (a), but (b) actually depends on independent semantic commitments. If your group adopted a causal theory of reference, (b) would collapse even if (a) were true (beliefs would exist, we'd just be wrong about their nature). If they adopted descriptivism, (b) would stand even if (a) were false. **The stalemate is a hidden disagreement about reference.**

  ### 3. The LLM Argument: Category Error or New Data?

  The argument ("LLMs predict text without beliefs, so eliminativism wins") is a **category error**, but a productive one.

  *   **The Error:** It confuses *implementation independence* with *ontological elimination*. Showing that silicon can mimic human output without human architecture proves that *that specific architecture* is not necessary for the output. It does not prove that *humans* lack that architecture. It is an argument from possibility, not actuality.
  *   **The Productive Bit:** It attacks claim (a). It suggests that the "causal profile" folk psychology attributes to belief (inferential promiscuity, etc.) might not be required to generate the behavior that led us to posit beliefs in the first place. If a system without beliefs can pass the Turing Test, the inference from "speaks like a believer" to "has beliefs" is weakened.
  *   **Verdict:** It does not support Norm-eliminativism (LLM output can still be evaluated for truth). It weakens the empirical necessity of State-realism. It suggests belief might be a *user-illusion* generated by complex statistical mapping, which supports your Norm-eliminativism (useful fiction, no underlying state).

  ### 4. What Counts as Progress?

  This dispute will not end with a discovery. It is not like the phlogiston case, because phlogiston was a posit within a scientific theory. Belief is a posit within a *practice* (social coordination).

  **Progress looks like one of three things:**

  1.  **Precisification (Conceptual Engineering):** We stop asking "Do beliefs exist?" and start asking "Which specific cognitive mechanisms map onto which specific belief-ascriptions?" We replace the binary "Belief: Yes/No" with a gradient of "Systematicity," "Integration," and "Access." This dissolves the fight by removing the target.
  2.  **Semantic Agreement:** The group agrees on a theory of reference. If you agree that reference is determined by causal role, eliminativism becomes much harder to sustain. If you agree reference is determined by descriptive fit, eliminativism becomes much easier. Currently, people are smuggling in conflicting semantic theories.
  3.  **Pragmatic Surrender:** Cognitive science quietly adopts a dual-vocabulary strategy. Low-level modeling uses vectors/weights; high-level modeling uses beliefs/desires. The "fight" is recognized as a boundary dispute between levels of abstraction, not a fight about reality.

  **Will it stay open forever?**
  Yes, if framed as "Do beliefs *really* exist?" That is a metaphysical question disguised as scientific. It stays open because it is really asking: **"What level of abstraction are we allowed to call 'real'?"**
  *   If only fundamental physics is real, beliefs don't exist.
  *   If functional patterns are real, beliefs exist.
  *   The fight is about the *ontology of patterns*, not the mind.

  ### Summary for your Reading Group

  To break the loop, propose this protocol:
  1.  **Ban claim (c)** (methodology) until (a) and (b) are settled. It's a distraction.
  2.  **Force a choice on Reference:** Are we descriptivists or causal theorists regarding mental terms? This will resolve half the "Norm" debate instantly.
  3.  **Treat LLMs as a challenge to (a) only:** They show beliefs aren't *necessary* for behavior, not that humans don't *have* them.
  4.  **Adopt your State/Norm cut:** Ask the Eliminativist: "Are you denying the mechanism exists (State), or that the sentence is truth-apt (Norm)?" Ask the Realist: "Are you defending the mechanism (State), or the truth of the ascription (Norm)?"

  You will likely find the Eliminativist is a Norm-eliminativist (Fictionalist) and the Realist is a State-realist (Functionalist). They are not contradicting each other; they are answering different questions. Once they see that, the heat should go out of the room.
