  **The principle** — You prefer the story that relies on normal human actions or simple mechanics, rejecting invisible forces unless one force explains many things at once. Basically, you choose the explanation that leaves you with something to fix, rather than leaving you at the mercy of luck or hidden magic.

  **Case by case** — 
  1. **Basement:** Your principle picks the downspout (simple mechanic) over the sewer (hidden system), matching your verdict. Yes.
  2. **Friend:** Your principle picks the argument (human action toward you) over her life issues (external circumstance), matching your verdict. Yes.
  3. **House weirdness:** Your principle allows an invisible cause here because it unifies three separate puzzles, matching your verdict. Yes.
  4. **Clock:** Your principle picks the uncle (human action) over the battery (hidden mechanism), matching your verdict. Yes.
  5. **Sourdough:** Your principle picks your temperature mistake (human error) over the invisible bug (hidden force), matching your verdict. Yes.
  6. **Office numbers:** Your principle picks the counting change (human trick) over brilliance (invisible quality), matching your verdict. Yes.

  **The awkward pair** — In case 4, the hidden cause is a person (your uncle), which fits your rule because people are known quantities with motives. In case 5, the hidden cause is an invisible natural force (something living in the kitchen), which feels like "cheating" because it's undefined magic you can't negotiate with. You accept hidden human agency, but you reject hidden natural agency unless it solves multiple problems at once.

  **Where I'm wrong** — Your verdict on case 2 is the weak link; statistically, people usually go quiet because of their own lives, not because of you. Your principle pushes you to blame yourself because it gives you control (you can apologize), but that bias is called the Fundamental Attribution Error. You should drop that verdict and accept that most silence is about the other person, not you.

  **A case of your own** — Imagine a child in your family is failing school. Story A: they aren't trying hard enough (human action). Story B: they have an undiagnosed learning disability (hidden mechanism). Your principle forces you to pick A, because it's a behavior you can fix rather than a medical mystery. That verdict feels responsible, but it might make you punish the child when they actually need help.

  **My flip-flop** — Your principle pushes you toward Story A (something I do) because it keeps the locus of control in your hands; if it's your fault, you can fix it. But the principle doesn't settle the truth, it only settles what feels manageable. To know the real answer, you have to ignore the principle and ask a colleague outside your office what happens there.
