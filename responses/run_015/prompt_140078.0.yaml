answer: |-
  ### Part 1: The Entry Point
  **Your proposed door is the right one, but phrase it as a case, not a theorem.**
  Don't say "It can't be a truth function." Say: *"If I say 'If the moon is made of cheese, I am a billionaire,' and the moon isn't cheese, is that sentence true?"*
  **Why:** If you start with "truth function," the Suppositionalists in the room will check out (they don't think conditionals have truth values). If you start with the *intuition* that the sentence is false, everyone agrees, and you've ruled out the Material Conditional without forcing a commitment to truth-conditions yet.

  ---

  ### Part 2: The Flowchart

  ```text
  START: "If the moon is cheese, I'm a billionaire." Antecedent false. Is the sentence True?
  |
  +-- YES --> [LEAF 1: Material Conditional] (Semantics is logic, pragmatics is noise)
  |
  +-- NO --> NODE 1: THE DOCTOR (Epistemic Access)
             Case: Doctor knows scan = Tumor. Says to patient: "If the scan shows a tumor, we biopsy."
             Question: Is the doctor speaking truly, or misleadingly?
             |
             +-- MISLEADING (Should have said "When") --> NODE 2: THE MISMATCH (Unity)
             |                                            Case: Detective knows Butler did it.
             |                                            (i) "If Butler did it, he used candlestick." (OK)
             |                                            (ii) "If Butler had done it, he would have..." (BAD)
             |                                            Question: Do (i) and (ii) have the same semantic core?
             |                                            |
             |                                            +-- NO (Different Semantics) --> [LEAF 2: Ambiguous]
             |                                            |                                (Indicatives=Epistemic, Counterfactuals=Metaphysical)
             |                                            |
             |                                            +-- YES (Same Semantics) --> NODE 3: THE HIRING (Strictness/Ordering)
             |                                                                         Case: Committee says:
             |                                                                         (i) "If Smith applies, we hire."
             |                                                                         (ii) "If Smith & Jones apply, we don't hire Smith."
             |                                                                         Question: Does adding 'Jones' change the *worlds* checked or the *standards*?
             |                                                                         |
             |                                                                         +-- STANDARDS (Ordering Source) --> [LEAF 3: Contextualist]
             |                                                                         |                                   (Ordering supplied by conversation goals)
             |                                                                         |
             |                                                                         +-- WORLDS (Similarity Shift) --> NODE 4: THE COIN (Uniqueness)
             |                                                                                                         Case: Fair coin not flipped.
             |                                                                                                         "If flipped, might be H, might be T." (OK)
             |                                                                                                         "If flipped, would be H." (BAD)
             |                                                                                                         Question: Is there a single 'closest' flipped-world?
             |                                                                                                         |
             |                                                                                                         +-- YES --> [LEAF 4: Stalnaker]
             |                                                                                                         |           (Unique closest world, Law of Excluded Middle holds)
             |                                                                                                         |
             |                                                                                                         +-- NO --> [LEAF 5: Lewis]
             |                                                                                                                     (Ties allowed, 'Would' is false if 'Might not' is true)
             |
             +-- TRULY (Knowledge doesn't block 'If') --> NODE 5: THE PROBABILITY (Truth vs. Force)
                                                          Case: "Probability that [If it rains, match cancelled] is 80%."
                                                          Question: Does this mean 80% of *rain-worlds* or 80% of *all-worlds*?
                                                          |
                                                          +-- 80% OF ALL (Truth Conditional) --> NODE 6: THE TRIVIALITY CHECK
                                                          |                                      Question: Can conditional probability = probability of conditional?
                                                          |                                      |
                                                          |                                      +-- YES --> [LEAF 6: Triviality Realist]
                                                          |                                      |           (Context-dependent truth conditions to save the math)
                                                          |                                      |
                                                          |                                      +-- NO --> [LEAF 7: Strict Epistemic]
                                                          |                                                  (Quantify over known possibilities only)
                                                          |
                                                          +-- 80% OF RAIN (Suppositional) --> [LEAF 8: Suppositionalist]
                                                                                                (No truth conditions, only update rules)

  (Alternative Paths from Node 2/3 for Unified Views)
  |
  +-- (From Node 2 YES) --> (Skip Node 3) --> [LEAF 9: Unified Epistemic]
  |                                           (Both Indicative/Counterfactual are about information states)
  |
  +-- (From Node 3 WORLDS) --> (Skip Node 4) --> [LEAF 10: Pragmatic Only]
                                                      (Semantics is Material, Pragmatics explains the rest)
  ```

  ---

  ### Part 3: Node Defenses (Why here? Why not the obvious question?)

  **Node 1 (The Doctor):**
  *   **Why here:** This is the first fork between "Semantics tracks Knowledge" (Epistemic/Strict) and "Semantics tracks Possibility" (Metaphysical/Subjunctive).
  *   **Why not the obvious question:** The obvious question is "Is the antecedent possible?" But students will say "Yes" regardless. Asking about the *speaker's propriety* forces them to decide if the context set is restricted by *speaker knowledge* (Strict) or *common ground* (Stalnaker).
  *   **Defense:** If they say "Misleading," they are committed to a view where the context set cannot contain what the speaker knows to be false (Strict Epistemic). If "Truly," they allow the context set to be larger than the speaker's knowledge (opening the door to Subjunctive/Similarity views).

  **Node 2 (The Mismatch):**
  *   **Why here:** This isolates the "Ambiguous" vs. "Unified" debate.
  *   **Why not the obvious question:** Don't ask "Are they different?" Ask about the *specific pair* where one is good and one is bad despite same content.
  *   **Defense:** Many students think Indicatives and Counterfactuals are just "tense differences." This case (where we *know* the antecedent is true) breaks the Counterfactual but not the Indicative. If they say "Same Semantics," they must explain this via pragmatics (Leaf 9). If "Different," they go to Leaf 2.

  **Node 3 (The Hiring/Sobel):**
  *   **Why here:** This tests Strictness (Quantification over a fixed set) vs. Variability (Quantification over a shifting set).
  *   **Why not the obvious question:** Don't ask "Is monotonicity valid?" (Too technical). Ask about the *mechanism* of the shift.
  *   **Defense:** This node does heavy lifting. It separates Strict views (Leaf 7/10) from Variable views (Leaf 3/4/5). It also hints at the Ordering Source (Leaf 3) if they attribute the shift to "standards" rather than "world similarity."

  **Node 4 (The Coin):**
  *   **Why here:** This is the only clean test for Uniqueness (Stalnaker) vs. Ties (Lewis).
  *   **Why not the obvious question:** Don't ask "Are there ties?" (Everyone says yes intuitively). Ask about the *truth value* of the 'Would' claim.
  *   **Defense:** If there is a unique closest world, "If flipped, would be Heads" must be either True or False (Stalnaker). If there are ties, it is False (Lewis). This separates the two main Variably-Strict camps.

  **Node 5 (The Probability):**
  *   **Why here:** This separates Truth-Conditional views from Suppositional/Adams-style views.
  *   **Why not the obvious question:** Don't ask "Does Adams' Thesis hold?" Ask about the *domain* of the probability.
  *   **Defense:** If they say "80% of all worlds," they are treating the conditional as a proposition with a truth value (Leaf 6/7). If "80% of rain worlds," they are treating it as a conditional assertion (Leaf 8).

  **Node 6 (The Triviality Check):**
  *   **Why here:** To catch the "Context-Dependent Truth Condition" view that tries to save Adams' Thesis.
  *   **Why not the obvious question:** Don't mention Lewis's Triviality Results. Ask if the math works without magic.
  *   **Defense:** This isolates the view that conditionals have truth conditions *but* they shift contextually to match conditional probability (Leaf 6), vs. those who abandon the equation (Leaf 7).

  ---

  ### Part 4: The Leaves (Positions & Awkward Commitments)

  1.  **Material Conditional:** Semantics is `~A v B`. *Awkward Commitment:* Must explain away all intuitive falsehoods as pragmatic errors.
  2.  **Ambiguous Semantics:** Indicatives and Counterfactuals are lexical homonyms. *Awkward Commitment:* Cannot explain why they share logical properties (e.g., strengthening the antecedent fails for both).
  3.  **Contextualist (Ordering Source):** Truth depends on conversational goals, not just similarity. *Awkward Commitment:* Hard to define the "ordering source" in casual conversation (e.g., "If it rains, I'll stay in").
  4.  **Stalnaker (Unique):** One closest world always exists. *Awkward Commitment:* Must claim there is a fact of the matter about whether the coin *would* have landed heads, even if physics says no.
  5.  **Lewis (Ties):** Many closest worlds; 'Would' is false if 'Might not' is true. *Awkward Commitment:* Makes most ordinary counterfactuals false (too skeptical).
  6.  **Triviality Realist:** Truth conditions vary to match conditional probability. *Awkward Commitment:* Requires giving up standard logic (e.g., Law of Non-Contradiction for conditionals).
  7.  **Strict Epistemic:** Quantifies over known possibilities. *Awkward Commitment:* Makes "If A, then A" false if the speaker doesn't know A.
  8.  **Suppositionalist:** Conditionals have no truth conditions, only acceptance conditions. *Awkward Commitment:* Struggles to explain embeddings (e.g., "If [if A then B], then C").
  9.  **Unified Epistemic:** Both types track information states, tense is pragmatic. *Awkward Commitment:* Struggles with past counterfactuals where we know the facts (e.g., "If Kennedy hadn't been shot...").
  10. **Pragmatic Only:** Semantics is Material, Pragmatics does the rest. *Awkward Commitment:* Requires a pragmatic theory so powerful it essentially replicates a semantic one.

  ---

  ### Part 5: Meta-Analysis (The Space, Not The Names)

  **1. The "Adams + Truth Conditions" Cell:**
  *   **Can anyone hold both?** Technically, no (Lewis's Triviality Results). However, **Leaf 6 (Triviality Realist)** occupies this space by accepting context-dependence of the truth conditions. They say "Yes, but the proposition expressed changes with context."
  *   **Verdict:** This cell is **occupied but costly**. It requires abandoning the idea that conditionals express stable propositions across contexts.

  **2. The "No Semantic Difference / No Pragmatic Story" Cell:**
  *   **Is it empty?** Yes, **Incoherent**. If the forms differ (Indicative vs. Subjunctive) and the semantics is identical, there *must* be a pragmatic story (presupposition, implicature, etc.) to explain the distribution. If a student lands here, they haven't finished the theory.

  **3. Collapses & Failures:**
  *   **Lewis vs. Kratzer (Leaf 5 vs. Leaf 3):** My tree struggles to pull these apart cleanly at Node 3. Both predict Sobel sequences are valid. Lewis uses *similarity*; Kratzer uses *ordering sources*. In practice, they often yield the same verdicts. I have flagged this in Node 3's "Standards vs. Worlds" question, but be prepared for students to say "Similarity *is* the ordering source." **Honesty:** These two leaves are empirically very close; the distinction is metaphysical (real similarity vs. contextual parameters).
  *   **Stalnaker vs. Lewis (Leaf 4 vs. Leaf 5):** Node 4 separates them, but only on indeterministic cases. On deterministic cases, they collapse.

  **4. Control Cases (Where everyone agrees):**
  Use these to check if students understand the nodes before branching:
  1.  **Modus Ponens:** "If A, B. A. Therefore B." (All leaves except maybe extreme Suppositionalists validate this).
  2.  **False Antecedent Intuition:** "If the moon is cheese..." (All leaves except Material Conditional say False).
  3.  **Sobel Validity:** The Hiring case (All leaves except Strict say the inference is valid).
  4.  **Indeterministic Coin:** "If flipped, might be H" (All leaves agree this is True).

  **5. The "No Cell" Outcome:**
  *   **Scenario:** A student answers "Truly" to the Doctor, "Same" to Mismatch, "Strict" to Hiring, but "Suppositional" to Probability.
  *   **Diagnosis:** This is likely a **Genuine Position** (a hybrid view), not a misread. It resembles a "Strict Suppositional" view.
  *   **Advice:** Tell them: "You are in the minority, but you are consistent. You believe conditionals restrict the domain of quantification (Strict) but don't have truth values themselves (Suppositional). Look up *restrictor semantics*."

  **6. Unoccupied Cells:**
  *   **Strict + Variably Strict:** Incoherent. You can't quantify over a fixed set and a shifting set simultaneously.
  *   **Material + Suppositional:** Incoherent. If semantics is Material, it has truth conditions.
  *   **Unified + Ambiguous:** Contradictory.

  ---

  ### Part 6: Instructions for the Session Leader

  1.  **Handout:** Print the ASCII tree on one side, the Leaf Definitions on the other.
  2.  **Procedure:** Read the Case for Node 1. Ask for a show of hands on the Question. Follow the branches. When the group splits, assign half the room to defend one branch, half the other.
  3.  **When they get stuck:** If they can't answer Node 4 (Coin), ask: "Do you believe physics determines the outcome?" If yes, they are Stalnakerians. If no, Lewisians.
  4.  **Time Management:** Spend 15 mins on Nodes 1 & 2 (Epistemic/Unity). Spend 30 mins on Node 3 (Sobel/Ordering). Spend 15 mins on Nodes 4 & 5. Spend 15 mins mapping to Leaves.
  5.  **Closing:** Remind them that landing on a Leaf isn't "winning." It's identifying which bullet you're willing to bite.
