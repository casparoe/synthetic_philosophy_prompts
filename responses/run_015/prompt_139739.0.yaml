answer: |-
  ### The Scenario

  It is 19:00 on the palliative care ward, and Elena is midway through the medication handover, cross-referencing the MAR charts against the empty blister packs for Bed 4. Mr. G has just been verified dead; the body is still warm, the curtain half-drawn. His estranged son, David, bursts through the double doors twenty minutes late, having missed the death by minutes, and immediately collapses into a performative, wailing grief that Elena knows from the file is inconsistent with his three-year absence. As she caps the insulin pen, Elena feels a sharp, unbidden spike of vindictive satisfaction—a visceral sense that David deserves this pain—followed instantly by a cold contempt for his display. She does not speak; her face remains professionally neutral; David does not see her. But in the confidential supervision session later that week, when asked about her emotional state during the verification, Elena admits to the feeling, describing it vividly and acknowledging it violates the core nursing ethic of unconditional positive regard. She reports trying to suppress the feeling in the moment and failing, noting she is distressed by its presence and has no history of such callousness. There are no downstream harms: the patient is dead, the son is unaware, and no care was withheld. The blame attaches solely to the quality of the will evidenced by the reaction itself.

  ***

  ### 1. What Three Views Say

  **(a) The Principle of Alternative Possibilities (PAP)**
  On the strict PAP view, Elena is not blameworthy. Blameworthiness requires the ability to do otherwise (or feel otherwise) at the time of the offense. Emotions, particularly immediate affective responses like contempt or schadenfreude, are not directly voluntary; one cannot simply choose to feel empathy instead of disgust in the same way one chooses to raise an arm. Since Elena could not have prevented the feeling from arising in that specific moment (synchronic control), and we have stipulated no tracing route (she did not negligently cultivate this disposition earlier), she lacked the relevant alternative possibility. For the PAP defender, the absence of a counterfactual intervener is irrelevant; the absence of *psychological* alternative possibilities is sufficient to negate responsibility. She is unfortunate, perhaps dangerous, but not morally at fault.

  **(b) The Actual-Sequence View**
  The actual-sequence compatibilist argues that Elena is blameworthy because the source of the action (or reaction) lies in her own capacities, functioning normally, without external coercion. The absence of alternatives is metaphysically irrelevant. What matters is *how* the reaction was produced. Elena's feeling was not the result of a seizure, hypnosis, or direct stimulation of the amygdala; it was a response generated by her own evaluative machinery. Her mind assessed David's behavior as hypocritical and generated an emotional response consistent with that assessment. Because the reaction flowed from her own reasons-responsive mechanisms (even if those mechanisms are rigid in this instance), she owns the reaction. The "could not have done otherwise" is a symptom of her character's stability, not an excuse.

  **(c) The Answerability View (Attitudes)**
  The answerability theorist focuses on the relationship between the attitude and the agent's rational take on the world. Blame for attitudes tracks whether the attitude is rationally assessable and reflects the agent's judgment. Elena's contempt is answerable because it makes a claim about the world: *David is hypocritical and deserves suffering.* This claim is open to rational critique (it violates professional norms of care and perhaps moral norms of forgiveness). Because the emotion expresses her evaluative stance, she is accountable for it. The inability to "switch it off" is beside the point; we are answerable for our judgments even when we cannot instantly revise them. The blame consists in the demand that she justify a stance that is unjustifiable.

  ### 2. The Work-Doing Feature

  The single feature doing the heavy lifting is the **evaluative content of the involuntary affect**. The intuition of blameworthiness survives the lack of control only because the feeling is not a brute sensation (like a sudden pain or a startle reflex) but a *moralized emotion* (contempt/schadenfreude) that implies a judgment.

  **Deletion Test:** If you delete the evaluative content and leave everything else standing, the blame intuition collapses. Imagine the scenario is identical, but instead of contempt, Elena feels a sudden, unbidden spike of *sexual arousal* or a *sneeze* triggered by the dust in the curtains. She still cannot control it; she still knows it's inappropriate; she still has no alternative possibilities. But we do not blame her for the arousal or the sneeze in the same moral sense. We might pity her embarrassment, but we do not judge her *will* as faulty. This confirms that the blame in the original case is tracking the *rational endorsement* implicit in the emotion, not merely the presence of an unwanted mental state.

  ### 3. Matched Control (Voluntary Version)

  **Rewrite:** The scenario is identical, except that when David begins wailing, Elena *decides* to let a small, audible sigh of exasperation escape, or she deliberately rolls her eyes where the supervisor might see. She performs a voluntary micro-action that expresses the contempt she felt in the original case.

  **Verdict Movement:** The blame verdict **intensifies and shifts category**. In the involuntary case (original), the blame is a "taint on character"—we judge her moral sensibility as flawed. In the voluntary control, the blame becomes "misconduct." We now have a behavioral violation of professional norms, not just an internal one. However, interestingly, the *deep moral* blame might be slightly *purer* in the involuntary case. In the voluntary case, a reader might think, "She was stressed, she slipped up." In the involuntary case, because she tried to suppress it and failed, the feeling reveals a deeper, unmasked truth about her evaluative stance that voluntary action might have hidden. But generally, voluntary control attracts stronger sanctions. If the intuition of blameworthiness is a 7/10 in the involuntary case, it is a 9/10 in the voluntary control. This suggests that while AP is not *necessary* for blame, its presence amplifies it.

  ### 4. The Strongest PAP Reply (Specific to This Case)

  The standard Frankfurt rebuttal ("flicker of freedom") doesn't work here because there is no device to isolate. The strongest PAP reply specific to *attitude cases* is the **Normative Competence Objection**.

  The PAP defender argues: "Blame is a normative practice that presupposes the agent has the capacity to govern their mental states in light of reasons. In the standard Frankfurt case, the agent *decides* on their own; the device is idle. In Elena's case, the 'device' is her own psychology, but it is operating in a way that bypasses her governance. If she cannot modulate the attitude even when she recognizes it violates a norm she accepts, her normative competence is temporarily suspended. She is, in that moment, a passenger in her own mind. To blame her is to demand she do something she literally cannot do (feel otherwise), which renders the blame irrational. The intuition that she is blameworthy is actually a confusion: we are reacting to the *dangerousness* of her attitude (we wouldn't want her caring for us) or conflating her with her past self (tracing), which we have stipulated away. Without the power to conform her feelings to her reasons *synchronically*, she lacks the control required for moral accountability."

  **Why this is stronger than the usual Frankfurt reply:** It doesn't rely on finding a hidden alternative possibility. It attacks the link between *answerability* and *accountability*. It concedes the attitude is hers (answerability) but denies that answerability is sufficient for blame without the power of self-correction (accountability).

  ### 5. Constraint Trade-Off

  If your constraints cannot all be met, the one you should drop is **"No Tracing."**

  **The Cost:** Dropping this constraint allows the PAP defender to retreat to the claim that Elena *could have done otherwise* at an earlier time (by cultivating better habits of empathy). This saves PAP but weakens your specific argument. Your goal is to argue that blameworthiness doesn't require AP *at the time of the offense*. If you allow tracing, the PAP defender will say, "Ah, but she *did* have AP at T1, so PAP holds."

  **Why drop it?** Because keeping "No Tracing" combined with "Generate Don't Stipulate" creates a significant risk that the intuition of blameworthiness will be too weak to sustain the argument. Many readers will instinctively feel that if Elena truly *never* cultivated this callousness and *cannot* stop it now, she is merely psychologically unfortunate, not blameworthy. By allowing a thin tracing element (e.g., "She has ignored previous feedback about her detachment"), you secure the blame intuition more robustly. You can then argue that even if the tracing is weak or distant, the *current* blame is justified by the actual sequence, which is the point you want to make. If you keep the "No Tracing" constraint, you must admit in the paper that the blame intuition is roughly **30-40% weaker** than in a standard Frankfurt case, because we are blaming a *state* rather than an *action*, and states feel less agential to most intuitions.

  ***

  ### Honesty Check on Intuition Strength

  To be direct: **The intuition here is weaker than in a standard Frankfurt case.**

  In a Frankfurt case, the agent *acts* voluntarily (e.g., pulls the trigger). The lack of AP is external (the device). We see a full-blooded action. In Elena's case, the "action" is a *feeling*. Our folk psychology treats feelings as things that *happen to us*, not things we *do*. Consequently, even if you successfully argue she is blameworthy, the "sting" of the blame will feel different—more like a judgment on her character than a judgment on her agency.

  If your paper relies on the reader feeling a *strong* punitive impulse, this case might underdeliver. If your paper relies on the reader acknowledging a *theoretical* commitment to blame despite the lack of control, this case works better. I recommend framing the paper not as "Elena deserves punishment" but as "Elena is an appropriate target of moral criticism," which is a lower bar and fits the attitudinal nature of the case.
