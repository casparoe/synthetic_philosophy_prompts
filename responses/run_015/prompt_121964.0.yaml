answer: |-
  First off, take a deep breath. You haven't tied yourself into a knot because you're misunderstanding the basics; you've tied yourself into a knot because you've stumbled onto two of the most famous objections to the Reflection Principle that professional philosophers have argued about for decades.

  Your intuition is actually sharper than your mate's explanation. The short answer is: **You are right to feel uneasy about both scenarios.** The Reflection Principle isn't a magic wand that tells you what to believe; it's a rule about consistency for *rational* agents.

  Here is the breakdown of where the logic goes wrong in your two examples, and what you should actually do about the steroids.

  ### 1. The Football Objection (The "Why Bother?" Problem)

  You wrote: *"Reflection looks like it's telling me to be at 70% now and save myself a season of following results."*

  This is the most common misunderstanding of the principle. It comes down to the difference between a **conditional** probability and an **unconditional** one.

  The principle says:
  > My credence *now*, **supposing that** my future self will have credence $r$, should be $r$.

  In math speak: $P_{\text{now}}(\text{Win} \mid P_{\text{future}}(\text{Win}) = 70\%) = 70\%$.

  It does **not** say:
  > My credence *now* should be whatever I guess my future credence will be.

  **Why this matters:**
  Right now, you don't know for a fact that your future self will be at 70%. You think they *might* be at 70%, but they might also be at 10% (if the team plays terribly).
  *   If you think there's a 50% chance your future self says 70%...
  *   And a 50% chance your future self says 10%...
  *   Your credence *now* should be the average (40%).

  **The Point of Evidence:**
  The Reflection Principle assumes your future self is smarter than you *only because they have evidence you don't have yet*. They have seen the match results. You haven't.
  If you jump to 70% now, you are "free-riding" on evidence you haven't received. That's not rational updating; that's guessing. The principle tells you to *respect* the future self's processing of that evidence, not to hallucinate the evidence yourself.

  ### 2. The Steroids Objection (The "Reliability" Problem)

  You wrote: *"Someone told me the principle only applies to a future self you've got no reason to distrust, but that smells like a fudge."*

  It feels like a fudge, but it is actually a strict requirement of the principle. This is not an ad-hoc excuse; it is built into the definition.

  **The Rationality Condition:**
  Van Fraassen's Reflection Principle applies to **ideal rational agents**. It assumes that between "Now" and "Future," the only thing changing is the addition of new, truthful evidence and rational processing.

  If you know your future self is going to be chemically altered, sleep-deprived, drunk, or suffering from memory loss, **the principle does not apply.**
  *   **Why?** Because the principle is designed to prevent "diachronic Dutch Books" (situations where you can be guaranteed to lose money because your beliefs are inconsistent over time).
  *   If your future self is on steroids, they are no longer a reliable updater. They are a different epistemic agent entirely.
  *   Your GP's warning is **evidence**. It is evidence that your future cognitive machinery will be faulty.

  **Is it a fudge?**
  No. Think of it like the laws of aerodynamics. The laws of flight say, "If you shape a wing like this, it will generate lift." If you fill the wing with lead, it won't fly. You don't say, "The laws of aerodynamics are a fudge because they have a 'weight clause'." The laws assume a standard context. Reflection assumes a rational context.

  So, to answer your specific worry: **You should absolutely not update to 95% now.** In fact, knowing your future self will be overconfident, you should arguably discount their future views *more* than usual.

  ### 3. How to "Live By It" (Practical Advice)

  You mentioned you are writing down evening predictions for morning beliefs. **I would strongly advise you to stop doing this, especially for the next fortnight.**

  Here is why, and how to handle it:

  **1. Don't turn a norm into a ritual.**
  The Reflection Principle is a "normative" rule. It's like a rule of etiquette or logic (e.g., "Don't contradict yourself"). It's a tool to check if you're being crazy, not a recipe for daily living.
  If you force yourself to align your beliefs with your predicted future beliefs, you risk becoming **dogmatic**. You might stop looking for new evidence because you're too busy trying to match your "future spreadsheet."

  **2. The Steroids Strategy.**
  For the next two weeks, you have **higher-order evidence**. You know your brain chemistry is changing.
  *   **The Principled Move:** Explicitly suspend the Reflection Principle. Tell yourself: *"For the next 14 days, my future self is not a reliable guide."*
  *   **In Practice:** When you feel that "bizarre certainty" kicking in, do not write it down as a truth. Write it down as a symptom. "I feel 95% sure the bank is going to crash. This is likely the prednisone."
  *   **Deferring:** Do not defer to the steroid-self. Defer to your *pre-steroid* self (the one reading this) and the *post-steroid* self (the one who will look back and cringe).

  **3. Spreadsheet vs. Attitude.**
  It should be an **attitude**, not a spreadsheet.
  *   **Good Attitude:** "I acknowledge that I don't know everything. If I find out tomorrow that I was wrong today, I will update my beliefs rather than digging in."
  *   **Bad Attitude:** "I must calculate what I will believe tomorrow and believe it today to be consistent."

  ### Summary Checklist for You

  1.  **Football:** Keep watching the matches. Reflection doesn't give you free information. It just says, "When you see the results, believe what the results tell you."
  2.  **Steroids:** **Do not defer.** You have positive evidence that your future self is compromised. It is perfectly rational (and required) to ignore the Reflection Principle in this specific case.
  3.  **Practice:** Put the notebook away. Trying to force coherence between your present and future self can actually make you less rational, because it encourages you to ignore new evidence in favor of "staying consistent."

  You haven't misunderstood the concept; you've correctly identified its limits. The fact that you spotted the steroids problem immediately shows you're thinking about this exactly the right way. Trust that instinct—it's the one part of you the steroids won't warp.

  *Disclaimer: I am an AI, not a doctor. Please follow your GP's advice regarding the steroids.*
