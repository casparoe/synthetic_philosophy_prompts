prompt: |-
  I'm preparing material for a comparative penology course and want a piece that lets students feel the conceptual tension between rehabilitative normalization and punitive degradation without being lectured at. Write a deadpan parody of a luxury wellness-retreat brochure—think Lonely Planet crossed with a high-end spa catalog—for Halden Prison in Norway, approximately 600 words, in the hyper-earnest promotional voice of travel marketing. The brochure should describe Halden's real institutional features—the absence of bars, private rooms with en-suite facilities, shared kitchen islands, staff trained in dynamic security rather than domination, and the normalization principle—but frame every detail through the niche conceptual lens of "penal phenomenology": that is, present each feature in terms of how it reshapes the prisoner's lived experience of temporal continuity, spatial agency, and reciprocal social recognition, rather than in terms of comfort, luxury, or entitlement. The implicit satirical target is the American mass-incarceration model and the public rhetoric that dismisses Scandinavian humane conditions as undeserved "hotel prison" indulgence; the satire should work by letting wellness-marketing language expose how strange it is that American facilities systematically deny basic conditions of human dignity, without ever stating the comparison directly. Keep the irony sustained and deadpan—no winking, no direct editorializing—so that a reader familiar with carceral studies recognizes the exaggeration is conceptually fair and that the humor comes from treating normalization architecture like an exclusive retreat package. After the brochure, include a brief authorial note of about 150 words that separates what is empirically settled about Halden's design philosophy and Norway's comparative recidivism outcomes from what remains genuinely contested among specialists—such as whether normalization causally reduces reoffending or whether welfare-state context and selection effects dominate, and whether the American political economy of punishment could structurally accommodate such a model—and explicitly flag where the brochure takes satirical liberties, such as implying that architectural dignity automatically produces moral transformation, that go beyond what the evidence strictly supports.
