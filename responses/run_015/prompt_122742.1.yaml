      *   *Hofstadter's "Silence":* The model assumes an intelligent agent capable of recognizing "message-ness." If the finder is a rock, there is no Frame. If the finder is a being of pure energy, the Frame might be unreadable. The model breaks down at the boundary of *what counts as a receiver*.
      *   *Tone:* Keep it philosophical but grounded in the engineering of the Record. Use Hofstadter's terminology (isomorphism, triggering, homunculus).

