      *   *The Cartridge/Needle:* Included on the craft (but separate from the record cover instructions).

  4.  **Drafting the Analysis (Task 1 & 2):**

      *   *Frame Message:* "I am artificial." The sheer unnaturalness of the gold-plated copper disc. The geometry. The fact that it's on a spaceship.
