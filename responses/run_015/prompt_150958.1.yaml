prompt: |-
  Say you're advising a small funder with about eight researcher-years to spend over three years on conceptual work on the alignment problem -- philosophy and theory, not empirical ML.

  I've been sorting the problem into four buckets: (1) specification -- what the operator wants isn't fully pinned down by anything they can state in advance; (2) generalization -- getting a system that still goes for that thing in situations nobody foresaw; (3) drift -- the operator's own aims shift, or get contested by other people, over the system's lifetime, so maybe there is no fixed target to hit at all; (4) authorization -- whether this operator is the right party to be setting the target in the first place, given the system's actions land on alot of people who never signed up for it. I'm not attached to the taxonomy; if it carves the thing up wrong, say so.

  What I want is a defended agenda, not a survey: which of these -- or something I'm leaving out -- deserves the money, in what order, and why. Tell me what's upstream of what, what's actually tractable for philosophers in that time, and what you'd drop because its answer wouldn't change what anyone does. Two things I'm especially unsure about: is (3) really seperate from (1), or does it collapse into it? And is (4) part of the alignment problem at all, or a political question that got smuggled in under the name?

  Lead with your bottom line in the first sentence -- no preamble, no restating the question. Then tell me where your reasoning is most likely to break and what evidence or argument would move something up or down the list.
