      *   *Re-evaluating Authorization (4):* Is it part of alignment? Technically, no. Alignment is "system does what operator wants." Authorization is "operator should want this." Conflating them causes confusion. Drop it for this specific fund, or treat it as a separate governance track.
      *   *Winning Agenda:* Focus on (1) Specification, specifically the *structure* of human preferences and how to represent them formally without losing normativity. (2) Generalization gets conceptual support via "goal stability" theory. (3) is subsumed by (1). (4) is out of scope for technical alignment conceptual work.

