answer: |-
  **MEMORANDUM**

  **TO:** Committee for Archival Designation and Ethical Naming
  **FROM:** Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Classification Framework for Mid-Century Assimilation Campaign Archive

  **Introduction**

  This memo serves as my formal recommendation regarding the classification of the documented mid-twentieth-century campaign of forced assimilation, linguistic suppression, and demographic dispersal within the forthcoming digital archive. The Committee faces a dichotomy: adhere strictly to the 1948 UN Convention definition of genocide, which requires evidence of intent to physically or biologically destroy a group, or adopt Raphael Lemkin's broader original framework, which encompasses cultural and social destruction. While the Legalist faction rightly prioritizes epistemic authority, and the Historical faction rightly prioritizes ethical memory, I recommend **Conditional Approval** of the "tiered classification system." This approach allows the archive to honor Lemkin's sociological insights without compromising the institution's credibility by conflating historical analysis with legal verdicts.

  **The Distinctive Obligation of the University Archive**

  We must first define our institutional role. Unlike a tribunal, a university archive does not possess adjudicatory finality; its mandate is pedagogical and preservational, not prosecutorial. A court must restrict definitions to ensure due process and enforceable justice. An archive, however, bears a distinctive obligation to preserve the complexity of historical discourse. If we restrict our metadata solely to legally adjudicated categories, we risk institutionalizing a form of "legal positivism" that erases harms recognized by significant scholarly consensus but未曾 (never) prosecuted.

  However, this pedagogical mandate does not grant license for terminological looseness. The Legalist faction's concern regarding "conceptual inflation" is not merely conservative caution; it is a valid defense of the archive's long-term utility. If the term *genocide* is applied indiscriminately to policies of assimilation, displacement, and cultural erasure without distinction, the term loses its analytical sharpness. An archive that appears to prioritize moral signaling over categorical precision risks losing its status as a neutral repository of evidence. Therefore, any expansion of classification must be accompanied by rigorous contextual scaffolding.

  **Recommendation: Conditional Approval of a Tiered System**

  I propose we adopt the tiered classification system proposed by the Historical faction, subject to specific conditions that address the credibility concerns raised by the Legalist faction. This system will distinguish between *Genocide (UN Convention)* and *Genocide (Lemkinian Framework)* within the archive's metadata and public-facing descriptions.

  This approach acknowledges that while the campaign may not satisfy the strict *mens rea* of physical destruction required by international criminal law, it satisfies the sociological criteria of group destruction envisioned by Lemkin. It allows researchers to filter by legal status while ensuring that users searching for cultural destruction are not met with institutional silence.

  **Conditions and Milestones**

  To mitigate the risk of conceptual inflation and ensure epistemic authority, the following conditions must be met prior to the archive's public launch:

  1.  **Definitional Transparency:** Every instance tagged under the "Lemkinian Framework" must be hyperlinked to a permanent explanatory note detailing the specific divergence from the 1948 Convention. This note must explicitly state that this classification reflects historical and sociological analysis, not a legal verdict.
  2.  **Scholarly Advisory Review:** Before the tiered tags are finalized, a sub-committee comprising three external scholars (one legal scholar, one historian of the region, one sociologist) must review the classification rationale. Their signed concurrence on the applicability of the Lemkinian framework must be archived alongside the collection.
  3.  **Contextual Metadata:** The search interface must allow users to filter results by classification type. A user searching for "Genocide" must be presented with a prompt distinguishing between "Legally Adjudicated" and "Historically/Sociologically Classified" records.

  **Timeline**

  *   **November 15:** Committee vote on the tiered classification framework.
  *   **December 10:** Selection and invitation of the external Scholarly Advisory Review panel.
  *   **January 30:** Completion of external review and integration of definitional transparency notes into the archive interface.
  *   **February 15:** Final beta testing of search filters and metadata tagging.
  *   **March 1:** Public launch of the digital archive.

  **Conclusion**

  Rejecting the label entirely would fail our ethical duty to the victims of cultural erasure, treating the absence of a legal verdict as the absence of harm. Conversely, applying the label without qualification would validate the fear that we are inflating concepts to serve a political narrative, thereby undermining the archive's credibility. The tiered system is the only path that respects the precision of the law while honoring the breadth of historical truth. By implementing the conditions above, we ensure that the archive remains a tool for rigorous inquiry rather than a monument to unresolved debate.

  I urge the Committee to vote for Conditional Approval by the end of this semester to meet the March launch target.
