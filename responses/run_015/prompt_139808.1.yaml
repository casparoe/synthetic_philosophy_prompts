      I will recommend modifying (9) to allow for a "history condition."

      *Let's check the tension between (7) and (4).* If determinism is just laws + past, and the zygote case is laws + past (plus a designer), is the designer the key? Yes, the "alien cause" vs "natural cause" distinction. This needs to be articulated.

