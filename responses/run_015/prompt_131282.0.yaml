      *   Take "harmless tradition" seriously? Yes (section on Financial Stewardship).
      *   No legal definitions? Yes (focus on governance culture).
      *   Honest treatment of losing side? Yes (acknowledge risk of losing funds if amendments are rejected).

  7.  **Final Polish:** Check the voice. It needs to sound like a Trustee speaking to Trustees. Not too academic, not too casual.

