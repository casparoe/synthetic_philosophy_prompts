answer: |-
  Here is a procedure designed for your commission. It is built to be read aloud in a meeting, voted on step-by-step, and to force disagreements into specific buckets rather than letting them smear across the whole discussion.

  It is called **The Stake & Agency Protocol**. It separates the right to vote (Franchise) from the duty to vote (Compulsion).

  ### PART 1: THE FRANCHISE TRACK (Who gets in?)

  This track determines if a group has a valid claim to be added to the electoral roll. It uses three filters. If a proposal fails any filter, the recommendation is **NO**. If it passes all three, it moves to a **Values Call**.

  **Question 1: The Binding Test (Subjection)**
  *Ask:* "If this group breaks the rules of this jurisdiction, can the state punish them? If they leave the room, do the laws follow them?"
  *   **Adequate Answer:** Yes, they are subject to the criminal and civil law of this region in their daily life.
  *   **Fail Condition:** They are only subject to laws while physically present (e.g., tourists, short-term business travelers) or are subject only to treaty obligations abroad (e.g., citizens living overseas permanently).
  *   **Result if Fail:** **STOP. Recommendation: NO.** (They are guests, not members).

  **Question 2: The Exit Cost Test (Stake)**
  *Ask:* "If this group were forced to leave this jurisdiction tomorrow, would their life collapse, or would it merely be an inconvenience?"
  *   *Note:* This replaces "citizenship." It measures where their life is actually built.
  *   **Adequate Answer:** Leaving would mean losing their home, livelihood, family network, or care structure. They cannot easily relocate to a different jurisdiction without catastrophic loss.
  *   **Fail Condition:** They maintain a primary life center elsewhere, or they possess a status (like a second passport or portable wealth) that allows them to exit the jurisdiction's consequences without significant harm.
  *   **Result if Fail:** **STOP. Recommendation: NO.** (Their stake is too low to justify the franchise).
  *   **Result if Pass:** Proceed to Question 3.

  **Question 3: The Agency Test (Capacity)**
  *Ask:* "Can members of this group communicate a preference and understand that their choice contributes to a collective outcome?"
  *   **Adequate Answer:** Yes. They do not need to understand complex policy, only that they are making a selection that counts.
  *   **Fail Condition:** The group lacks the cognitive capacity to register a choice (e.g., infants, advanced dementia), regardless of guardians.
  *   **Result if Fail:** **STOP. Recommendation: NO.**
  *   **Result if Pass:** **VALUES CALL.** (See below).

  **The Values Call (The Threshold)**
  If a group passes all three tests, the procedure *cannot* tell you "Yes." It tells you: **"The technical barriers are cleared. The remaining decision is political."**
  *   *Example:* 16-year-olds pass Binding (they can be charged with crimes), pass Exit Cost (they are dependent and cannot leave home), and pass Agency (they can express preference).
  *   *The Call:* The Commission must vote on whether 16 is the *right* age, acknowledging this is not a finding of fact, but a line-drawing exercise. You own this vote. Do not dress it up as "scientific."

  ---

  ### PART 2: THE DUTY TRACK (Who must show up?)

  This track is separate. Passing Part 1 gives you the *right* to vote. It does not give the state the *power* to compel you. This track has a higher bar. If a proposal fails any step, the recommendation is **NO**.

  **Question 1: The Integrity Check**
  *Ask:* "Is the franchise secure enough that forcing people to vote won't force them to legitimize a broken system?"
  *   **Adequate Answer:** The electoral system is widely viewed as free, fair, and responsive.
  *   **Fail Condition:** There is significant, evidence-based distrust in the counting mechanism or the responsiveness of representatives among the non-voting population.
  *   **Result if Fail:** **STOP. Recommendation: NO.** (Compulsion without trust is coercion).

  **Question 2: The Bias Check**
  *Ask:* "Is the group that currently doesn't vote a random sample, or a specific demographic?"
  *   **Adequate Answer:** Non-voting is random or evenly distributed.
  *   **Fail Condition:** Non-voting is concentrated among a specific marginalized group (e.g., the poor, a specific minority, the young).
  *   **Result if Fail:** **PROCEED WITH CAUTION.** (Compulsion will look like targeting).

  **Question 3: The Penalty Harm Test**
  *Ask:* "If someone cannot pay the fine for not voting, does that penalty block them from voting in the future?"
  *   **Adequate Answer:** No. The fine is waivable, or non-payment does not affect electoral registration or civil status.
  *   **Fail Condition:** Unpaid fines lead to debt collection, criminal records, or removal from the roll.
  *   **Result if Fail:** **STOP. Recommendation: NO.** (You cannot create a debt trap to enforce participation).

  ---

  ### PART 3: RUNNING THE PROPOSALS

  Here is how the protocol handles your three recurring cases. I have applied the logic strictly. One of these results may surprise you.

  **Case 1: Lowering Voting Age to 16 (Regional Elections)**
  *   **Binding Test:** **PASS.** 16-year-olds are subject to criminal law and regional regulations.
  *   **Exit Cost Test:** **PASS.** They are legally dependent; leaving the jurisdiction means leaving guardians/school. High exit cost.
  *   **Agency Test:** **PASS.** They can form and communicate political preferences.
  *   **Verdict:** **VALUES CALL.** The procedure clears the technical hurdles. The Commission must vote on the age threshold openly. You cannot claim the procedure mandates 16; you must admit you are choosing 16 over 18 as a matter of policy.
  *   *Recommendation:* **Proceed to Vote.**

  **Case 2: Voting for Non-Citizens (5 Years Residence, Local Only)**
  *   **Binding Test:** **PASS.** They pay taxes, follow local bylaws, and are subject to local policing.
  *   **Exit Cost Test:** **PASS.** After 5 years, their life center is here. Leaving would mean losing jobs, homes, and community.
  *   **Agency Test:** **PASS.** No cognitive barrier.
  *   **Verdict:** **VALUES CALL.** Technically cleared.
  *   *Recommendation:* **Proceed to Vote.** (This aligns with your sympathy).

  **Case 3: Compulsory Turnout (Modest Fine)**
  *   **Integrity Check:** **PASS.** (Assuming your region's elections are generally trusted).
  *   **Bias Check:** **FAIL.** In almost all jurisdictions, non-voters are not random. They are disproportionately lower-income, younger, or marginalized.
  *   **Penalty Harm Test:** **FAIL.** A "modest fine" is regressive. For a wealthy person, it is a parking ticket. For a poor person (who is statistically more likely to be a non-voter), it is a crisis. If unpaid, it often leads to administrative barriers to future voting or debt collection.
  *   **Verdict:** **STOP. Recommendation: NO.**
  *   *Why:* The procedure identifies that compulsion in this context punishes the demographic that is already disengaged. It converts a civic duty into a financial barrier.
  *   *Recommendation:* **Reject Proposal.** (This is the unwelcome verdict).

  ---

  ### PART 4: THE HARD CASES

  Here is how the protocol handles the edge cases you listed, without needing new debates.

  *   **Prisoners:**
      *   Binding: **Yes.**
      *   Exit Cost: **Yes.** (They literally cannot leave).
      *   Agency: **Yes.**
      *   *Result:* **Values Call.** The procedure does not ban them. If you exclude them, you must admit it is a punitive political choice, not a technical necessity.
  *   **Advanced Dementia:**
      *   Binding: **Yes.**
      *   Exit Cost: **Yes.**
      *   Agency: **No.** (Cannot communicate preference/understand choice).
      *   *Result:* **No.** (Clear technical stop).
  *   **Dual Citizens (Never Lived Here):**
      *   Binding: **Weak/No.** (Not subject to daily coercion).
      *   Exit Cost: **No.** (Life center is elsewhere).
      *   *Result:* **No.** (Fails Exit Cost).
  *   **16-Year-Old Non-Citizens:**
      *   Binding: **Yes.**
      *   Exit Cost: **Yes.** (Dependent on parents who live here).
      *   Agency: **Yes.**
      *   *Result:* **Values Call.** (Same as citizen 16-year-olds).
  *   **Undocumented Residents:**
      *   Binding: **Yes.** (Subject to law, often more strictly).
      *   Exit Cost: **High.** (Leaving means fleeing; staying means high risk).
      *   Agency: **Yes.**
      *   *Result:* **Values Call.** (Technically eligible, but the Commission may flag the administrative risk of registration).
  *   **Expats (Moved away, kept vote):**
      *   Binding: **Weak.**
      *   Exit Cost: **Low.** (They already exited).
      *   *Result:* **No.** (Fails Exit Cost).

  ---

  ### PART 5: LIMITATIONS (Where the Procedure Misfires)

  You asked for honesty about where this tool breaks. Do not use this protocol in the following situations without overriding it manually.

  **1. The "Wealthy Exit" Problem**
  The Exit Cost Test assumes high exit cost = high stake. But a billionaire can leave tomorrow with no life disruption, yet their tax contributions shape the region massively. The procedure might exclude them (low exit cost), but they have high material influence.
  *   *Fix:* You must manually acknowledge that wealth creates stake independent of exit cost. The procedure under-represents the mobile elite.

  **2. The "Future Generations" Silence**
  The procedure is silent on climate or long-term debt. Future generations fail the Binding Test (they aren't here) and the Agency Test (they don't exist).
  *   *Fix:* You cannot use this protocol to argue for guardians for the future. That requires a completely different ethical framework.

  **3. The "Compulsion" False Negative**
  In Case 3, the protocol rejected compulsion because of bias and penalty harm. However, if you design a system where the fine is income-adjusted and *never* leads to debt collection, the protocol might still flag the Bias Check.
  *   *Fix:* If you can prove non-voting is purely apathy (not exclusion) and the fine is truly harmless, you can overrule the Bias Check. But the burden of proof is on you.

  **4. The Values Call Trap**
  The biggest risk is that the Commission treats the "Values Call" as a technical pass. When the protocol says "Values Call" for 16-year-olds, do not say "The Commission found they are eligible." Say "The Commission *chose* 16."
  *   *Fix:* Insist on the wording. If you dress the Values Call as a technical finding, the press will tear you apart when the logic is questioned.

  ### SUMMARY FOR THE CHAIR

  1.  **Run Track 1 (Franchise).** If it fails Binding, Exit, or Agency -> **No.**
  2.  **If Track 1 Passes.** -> **Values Call.** (Vote openly on the line).
  3.  **Run Track 2 (Compulsion).** If it fails Integrity, Bias, or Penalty Harm -> **No.**
  4.  **If Track 2 Passes.** -> **Values Call.** (Vote openly on the duty).
  5.  **Record the "No"s as Technical.** Record the "Yes"s as Political.

  This stops the circular arguments. If someone argues "But they are affected!" you point to the **Exit Cost Test**. If someone argues "But they are citizens!" you point to the **Exit Cost Test**. If someone argues "Civic duty!" you point to the **Penalty Harm Test**.

  It forces you to own the political choices and hides none of them behind "legal principles."
