      *   *XOR Blackmail:* The threat is credible regardless of payment because the attacker has an alternative revenue stream (selling data) that makes them whole. Standard bargaining theory (bluff detection) fails. *Translation:* If the attacker *will* profit either way, payment doesn't buy safety, it just buys a specific type of harm (publication vs. sale) or speeds up the resolution.
      *   *Decision Theory Translation:* We need to move from Causal Decision Theory (CDT) - "What does *this* payment do for *this* victim?" - to Updateless/Functional Decision Theory (FDT) - "What does our *policy* of paying/not paying do for the *ecosystem* and our *future* risk profile?"

  3.  **Brainstorming Distinctions (Theory vs. Practice):**
      *   *Keep:* The concept of pre-commitment (policy consistency), the distinction between credible vs. non-credible threats, the externality effect (paying fuels the market), the distinction between "recovering data" and "preventing publication."
