      *   *The Cases:* Apply the steps rigorously.
      *   *Limitations:* Where does this fail? (e.g., Bluffing attackers, unknown sanctions, moral hazard of the procedure itself).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Counterfactual Mugging simply? *Adjustment:* In the procedure, call it the "Repeat Play Test."
