      *   *Best Idea for Theory:* The XOR case. The procedure might say "Pay" (to control the data flow) even though theory suggests you shouldn't reward the structure. Or it says "Don't Pay" because the attacker gets paid by the broker anyway. Let's go with: The procedure advises *against* payment in the XOR case because it confirms the attacker's model of us as payers, reinforcing the Counterfactual Mugging dynamic. This will be frustrating because the threat is 100% credible.

  7.  **Addressing the "Unknown/Contested" Facts:**
      *   The procedure needs a "Default to Worst-Case" or "Default to Status Quo" rule. If we don't know if they have the data, assume they do. If we don't know if they are sanctioned, assume they are.

