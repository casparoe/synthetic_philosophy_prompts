prompt: |-
  spent the last three hours arguing with a friend about advance directives and I still feel like I'm the one who's wrong even though I can't say why. Her position is basically that honoring a living will is just respecting the person, full stop — the competent them wrote it down, so the incapacitated them has to follow it, and anyone who hesitates is really just letting a doctor take over. And I get it, I do, it sounds airtight. But the case that keeps bugging me: the person with late-stage Alzheimer's who's actually not suffering, who's calm and even kind of settled, but whose directive from ten years ago says 'do not keep me alive if I can't recognize my own family.' What exactly gives the sharp ten-years-ago version of them the right to veto the content version of them? And here's the part that really throws me — we don't let a person do this anywhere else. A competent adult can't sign a contract now that binds their future self to, say, work for a year at a pittance, or to never quit a job, or to be their kid's guardian no matter what; the future self gets to change their mind about pretty much everything, a promise can be broken, a preference can be revised. So why is the one domain where the past self gets iron-clad, enforceable authority over the present self the one where the present self is least capable of objecting? I think the whole practice of advance directives quietly presupposes some particular theory of what makes a person the the same person over time, and that the theory it needs isn't the one we actually use for contracts or promises or just changing your mind. Can you reconstruct what view of personal identity and self-continuity the advance-directive practice strictly requires, seperate that from what it merely fits well with, point out where it contradicts how we treat the same person's commitments in every other context, and tell me what would have to change if we forced ourselves to use one consistent view of the self across all of it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user spent 3 hours arguing with a friend about advance directives (living wills).
      *   **User's Intuition:** They feel something is "off" about the standard justification for advance directives, even though their friend's argument (autonomy of the past self) sounds airtight.
      *   **The Specific Case:** Late-stage Alzheimer's patient who is content/calm vs. a directive from 10 years ago saying "no life if I can't recognize family."
      *   **The Core Conflict:** Why does the *past competent self* have absolute authority over the *present incapacitated self*? In other legal/ethical contexts (contracts, promises), the present self can usually override past commitments.
      *   **The Hypothesis:** Advance directives presuppose a specific theory of personal identity that contradicts how we treat identity/commitment elsewhere.
      *   **The Task:**
          1.  Reconstruct the view of personal identity/self-continuity that advance directives *strictly require*.
          2.  Separate that from what merely *fits well* with it.
          3.  Point out contradictions with how we treat commitments in other contexts.
          4.  Explain what would change if we enforced one consistent view of the self across all domains.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *The Friend's View:* "Precedent Autonomy." The person is a single entity over time. The earlier decision binds the later state because it's the *same person*.
      *   *The User's Intuition:* "Critical Interests" vs. "Experiential Interests" (Dworkin), or perhaps the "Discontinuity of Self" (Parfit/Schechtman). The Alzheimer's patient might be a "different" person in a morally relevant way, or at least their current experiential interests matter more than past abstract values.
      *   *The Contract Analogy:* We don't enforce indentured servitude. We allow contract modification. Why is a living will different? Because death is irreversible? Or because the "self" is treated as a unified sovereign across time in a way we don't treat economic agents?

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's insight. It's a profound philosophical problem (Dworkin, Dresser, Parfit). They aren't "wrong" to feel uneasy.

      *   **Part 1: The Required Theory of Personal Identity (The "Strict Requirement"):**
          *   What *must* be true for the directive to hold absolute sway?
          *   *Numerical Identity:* Person A (then) = Person B (now). No moral discontinuity.
          *   *The "Sovereign Self" Model:* The self is a timeless legislator. The "critical interests" (values, life narrative) trump "experiential interests" (current feelings).
          *   *Key Concept:* **Precedent Autonomy.** The idea that autonomy extends across time without degradation, regardless of psychological change.

      *   **Part 2: What Merely "Fits Well" (The Contingent Compatibility):**
          *   We *like* to think of ourselves as continuous. It fits our intuitive narrative identity.
          *   It fits the legal need for clarity (doctors don't want liability).
          *   It fits the fear of burdening family.
          *   *Distinction:* These are pragmatic or psychological comforts, not logical necessities of the ethical claim.

      *   **Part 3: The Contradiction with Other Contexts:**
          *   *Contract Law:* We forbid specific performance in personal service. We allow bankruptcy. We say "circumstances change."
          *   *Promises:* "Till death do us part" is one of the few binding ones, but even then, divorce exists. We generally allow people to evolve out of past commitments.
          *   *The Asymmetry:* In law/economics, the *current* capacity dictates validity. In bioethics (via directives), the *past* capacity dictates validity for the *current* body.
          *   *The "Incapacitated Veto":* The user's strongest point. The present self cannot object. It's a one-way binding.

      *   **Part 4: Enforcing Consistency (What Would Change?):**
          *   *Option A: The "Current Interest" Standard (Rebecca Dresser's view).* If the current self is content, the directive is void. We treat the Alzheimer's patient as a new moral entity.
          *   *Option B: The "Contractual" Standard.* Apply contract law principles. Directives expire (sunset clauses). They can be overridden by "hardship" (current suffering vs. past value).
          *   *Option C: The "Narrative" Standard.* Only enforce if the current self retains *some* thread of the narrative (mild dementia, not late-stage).
          *   *Implication:* Doctors would have more discretion. Families would have harder choices. We would admit that "we" die before our bodies do.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't dismiss advance directives entirely. They are useful. The issue is the *absolutism* the friend claims ("full stop").
      *   *Philosophers to reference (implicitly or explicitly):* Ronald Dworkin (Critical vs. Experiential), Rebecca Dresser (The critique), Derek Parfit (Reductionist view of identity).
      *   *Tone:* Empathetic, analytical, rigorous. The user is thinking like a philosopher; respond in kind.

  5.  **Final Polish:**
      *   Ensure the distinction between "Numerical Identity" (same biological organism) and "Narrative/Psychological Identity" (same personhood) is clear.
      *   Make sure the contract analogy lands hard, as that was the user's specific hook.
      *   Check that all four parts of the prompt are addressed.

      *(Self-Correction during drafting)*: I need to be careful not to say advance directives are *wrong*. I need to say the *justification* relies on a specific metaphysical claim that is inconsistent with other legal/ethical frameworks. The user asked to reconstruct the view required, not to ban living wills.

      *Key Insight to highlight:* The friend's argument relies on the idea that *autonomy* is a property of the *life*, not the *moment*. The user's counter-argument relies on the idea that *moral status* is a property of the *current consciousness*.

  6.  **Final Output Structure:**
      *   Introduction: Validate the intuition (it's the "Dresser Objection").
      *   Section 1: The Metaphysical Requirement (The Timeless Sovereign).
