      *   Section 4: The Consistent Alternative (What happens if we align the theories).
      *   Conclusion: Summarize the tension.

  7.  (Mental Check): Did I answer the specific question about "what gives the sharp ten-years-ago version the right to veto"? Yes, by explaining the "Critical Interests" theory. Did I address the contract analogy? Yes.

  8.  *Proceed to generate response.*
answer: |-
  You are not wrong to feel unsettled. In bioethics, your intuition has a name: it is often referred to as the **"Dresser Objection"** (after scholar Rebecca Dresser), and it cuts to the bone of a philosophical tension that most people gloss over. Your friend is arguing from a position of **Precedent Autonomy**, while you are intuiting a conflict of **Current Moral Status**.

  You have correctly identified that the practice of advance directives relies on a specific, somewhat rigid metaphysical claim about personal identity that we explicitly reject in almost every other branch of law and ethics.

  Here is the reconstruction of the view your friend is defending, where it contradicts our other practices, and what would happen if we forced consistency.

  ### 1. The Strict Requirement: The "Timeless Sovereign" Theory
  For an advance directive to have the absolute, "full stop" authority your friend claims, it must presuppose a specific view of personal identity known as **Numerical Identity with Priority to Critical Interests.**

  *   **Numerical Identity:** It assumes that the biological organism is the sole criterion for personhood. As long as the body is alive, the "person" who signed the document is the exact same moral entity as the body in the bed. There is no moral discontinuity, even if there is total psychological discontinuity.
  *   **The Timeless Sovereign:** It views the "Self" not as a series of momentary conscious states, but as a single project stretching across time. In this view, **Autonomy** is a property of the *life*, not the *moment*.
  *   **Critical vs. Experiential Interests:** This is the crucial philosophical move (championed by Ronald Dworkin). It argues that humans have two types of interests:
      1.  *Experiential:* What feels good or bad right now (the Alzheimer's patient being calm and fed).
      2.  *Critical:* What makes a life good as a whole narrative (the past self's desire not to live as a "vegetable").
      *   **The Requirement:** For the directive to win, the theory must assert that *Critical Interests* always trump *Experiential Interests* once competence is lost. The past self is the "author" of the life; the present self is merely a "character" in that book who has lost the pen. The author's notes override the character's current feelings.

  **In short:** The practice strictly requires that **you are one single entity over time, and your "true" will is located in your highest moment of rationality, not your current moment of existence.**

  ### 2. What Merely "Fits Well" (The Pragmatic Overlay)
  There are reasons we *like* this theory that are not logically necessary but make it psychologically comfortable. These are the things your friend is likely conflating with the moral truth:

  *   **Liability Shield:** It fits well with medical law because it protects doctors. If the doctor follows the paper, they can't be sued for battery. If they follow the "vibe" of the current patient, they are vulnerable. This is a pragmatic legal fit, not a metaphysical truth.
  *   **Family Burden:** It fits well with the desire not to burden loved ones with impossible choices. It feels "kinder" to decide in advance.
  *   **Narrative Comfort:** It fits our *own* fear of dementia. We (the competent) want to believe we control our end. We project our current horror of incapacity onto the future incapacitated self, assuming they will feel what we would feel *now*.

  These factors make the "Timeless Sovereign" theory *useful*, but they do not prove it is *true*.

  ### 3. The Contradiction: Why Contracts Don't Work This Way
  You hit the nail on the head with the contract analogy. In every other domain of law, we reject the "Timeless Sovereign" model in favor of a **"Current Capacity"** model.

  *   **Specific Performance:** In contract law, we generally do not enforce "specific performance" for personal services. You cannot sign a contract today that forces you to work for a specific employer for five years if you change your mind. The law assumes the *current* will supersedes the *past* will because the current will reflects current reality and capacity.
  *   **Bankruptcy and Modification:** We allow people to void past commitments due to "changed circumstances." We acknowledge that the future self faces a reality the past self could not perfectly predict.
  *   **The Asymmetry of Objection:** In contract law, if you try to enforce a past agreement against an unwilling present adult, the present adult can object. In advance directives, the enforcement happens precisely when the present self *cannot* object.
  *   **The "Indentured Servitude" Paradox:** If a competent adult signs a document saying, "If I ever try to quit this job, hold me down and force me to work," the law would void that as involuntary servitude. Yet, if a competent adult signs a document saying, "If I ever try to eat this food, take it away," we enforce that as autonomy.

  **The Contradiction:** In law, **autonomy is the right to change your mind.** In bioethics (per your friend), **autonomy is the right to prevent your future self from changing its mind.** These are mutually exclusive definitions of freedom.

  ### 4. What Would Change If We Enforced Consistency?
  If we forced the legal/ethical view of the self to be consistent across contracts, promises, and medical directives, we would have to choose one of two paths. Both would radically change medicine.

  **Path A: The "Current Interest" Standard (Aligning with Contract Law)**
  If we treated the self like a contractual agent who can modify terms based on current capacity:
  *   **Directives would expire:** Living wills would have sunset clauses (e.g., valid for 5 years, must be renewed).
  *   **The "Happy Dementia" Exception:** If the incapacitated patient appears content and shows no distress (like your Alzheimer's case), the directive would be voided. The *current* experiential interest would trump the *past* critical interest.
  *   **Surrogate Discretion:** Proxies would be legally empowered to override the directive if they believe the "current self" would not want to follow the "past self's" orders, similar to how a court allows contract modification due to hardship.
  *   **Implication:** We would admit that the person who signed the will is, in a morally relevant sense, *gone*, and a new, vulnerable person has taken their place who deserves protection, not obedience to a ghost.

  **Path B: The "Iron-Clad Sovereign" Standard (Aligning with Directives)**
  If we treated contracts like living wills:
  *   **Binding Life Contracts:** You could sign a contract at 20 that binds you at 40, regardless of your current desire to quit.
  *   **No Divorce:** Marriage vows would be legally unbreakable contracts, as the "past self" vowed eternal fidelity.
  *   **No Bankruptcy:** Debt would follow you eternally, as the "past self" incurred it.
  *   **Implication:** This would create a tyrannical legal system where the dead hand of the past rules the living present.

  ### The Verdict on Your Argument
  Your friend's position ("full stop") requires us to accept **Path B** for medical ethics while we live in **Path A** for civil law.

  The reason you feel like you're wrong is that your friend is appealing to **Integrity** (keeping one's life narrative consistent), while you are appealing to **Welfare** (protecting the currently existing being from harm).

  *   **Your friend's view:** Killing the calm Alzheimer's patient honors the *Life*.
  *   **Your view:** Keeping the calm Alzheimer's patient alive honors the *Person*.

  If we were consistent, we would acknowledge that advance directives are not "commands from the self" but rather **"heuristic guides for the survivors."** They should carry heavy weight, but not absolute veto power over a currently content existence. To give them absolute power is to claim that the *idea* of the person is more real than the *flesh* of the person.

  You aren't wrong. You've just spotted that we treat the "Self" as a ghost in the machine when it suits our fear of death, and as a biological organism when it suits our economic freedom.
