answer: |-
  Here is the gut-level intuition on the tension, stripped of the footnotes.

  ### 1. The Hook vs. The Job Posting
  To understand the tension, visualize two ways of grabbing hold of a thing in the world.

  **Kripke's Way (The Hook):** You point at a sample of water and drop a metaphysical hook into it. You say, "This stuff, and anything made of the same fundamental stuff, is 'water'." It doesn't matter what the stuff *does*; it matters what it *is*. The hook is stuck in the microstructure (H₂O). Even in a world where a liquid looks and tastes like water but is made of XYZ, your hook tells you: "That's not water." The term is **rigid** because the hook never moves; it stays locked on H₂O across all possible worlds.

  **The Scientific Way (The Job Posting):** Scientists often don't know the microstructure yet. They define terms by what they *do*. 'Gene' started as "the unit of heredity." 'Atom' started as "the indivisible particle." This is a job posting. You aren't hooking a specific substance; you are hiring whatever entity fulfills the role.

  **The Tension:** Science progresses by realizing the thing doing the job isn't what we thought. Atoms divide. Genes aren't simple beads on a string; they are overlapping DNA sequences with regulatory regions.
  If you stick with Kripke's **Hook**, you risk referring to nothing (if "indivisible particle" doesn't exist) or referring to the wrong thing (if you hooked the wrong sample initially).
  If you stick with the **Job Posting**, your reference shifts. In a world where heredity is carried by RNA, 'gene' refers to RNA. In our world, it refers to DNA. That makes the term **non-rigid** (it refers to different stuff in different worlds).

  ### 2. Is "Functional Rigidity" a Disguised Description?
  Philosophers trying to save rigidity propose **Functional Rigidity**: "Let's use the job description to *find* the referent, but then hook the actual finder."

  So, 'Gene' means: "Whatever *actually* plays the hereditary role in our world."
  *   **Investigation:** We find out DNA plays the role.
  *   **Result:** 'Gene' now rigidly designates DNA.

  **Is this a disguised description?**
  It walks like a description but talks like a rigid designator.
  *   **Yes, it's descriptive:** You used a description ("the hereditary thing") to fix the reference.
  *   **No, it's not a synonym:** The word 'gene' doesn't *mean* "hereditary thing." It means "that stuff [points to DNA]."

  **The Gut Check:** It is rigid in Kripke's sense *only if* you are willing to say that in a possible world where RNA does the hereditary work, those RNA strands are **not** genes (they are "gene-analogues"). If you think they *are* genes, you aren't a rigid designator; you're a functionalist. Most scientists act like functionalists (they care about the role), but Kripkean metaphysics demands rigid designators (care about the stuff). "Functional Rigidity" tries to have it both ways: using the role to pick the stuff, then ignoring the role to stay rigid.

  ### 3. Does This Break the "Necessary A Posteriori"?
  This is the crux of your worry.
  *   **Kripke's Standard:** "Water = H₂O" is **Necessary** (true in all worlds where water exists) but **A Posteriori** (we had to test it to find out).
  *   **Your Worry:** If we fix reference by function ("The Gene is the actual hereditary stuff"), does "Gene = DNA" become **A Priori**?

  **The Intuition:** No, it stays **A Posteriori**, but the *reason* changes.

  Here is why:
  Even if you fix the reference using the description "the actual hereditary stuff," you still don't know *what that stuff is* until you look.
  1.  **Reference Fixing (A Priori):** "Let 'gene' refer to whatever actually causes heredity." (This is a stipulation, so it's knowable by thought).
  2.  **Empirical Discovery (A Posteriori):** "DNA is whatever actually causes heredity." (This requires a microscope).
  3.  **Identity Statement:** "Genes are DNA."

  Because step 2 requires empirical work, the final identity remains **a posteriori**. You cannot sit in an armchair and deduce that DNA is the hereditary material just by analyzing the concept of 'gene'.

  **However, here is where it gets messy:**
  While the *epistemic* status (a posteriori) stays the same, the *metaphysical* necessity wobbles.
  *   For Kripke, "Water = H₂O" is necessary because water *is essentially* H₂O.
  *   For the Functional Rigidifier, "Gene = DNA" is necessary only because we decided to lock the term onto the *actual realizer*. But if we discovered tomorrow that heredity is actually epigenetic and not DNA-based, we would face a choice:
      *   **Kripkean:** "We were wrong. There are no genes." (Because DNA was the hook, and it failed).
      *   **Functionalist:** "We were wrong about the structure. Genes are epigenetic markers." (Because the job is the essence).

  If you choose the Functionalist route (which science usually does), the link between the term and the underlying nature is **contingent**, not necessary. 'Gene' doesn't *have* to be DNA; it just *happens* to be DNA in our world.

  ### The Bottom Line
  "Functional Rigidity" saves the **A Posteriori** (you still need science to find the realizer), but it sacrifices the **Necessity** of the underlying nature.

  *   **Kripke:** The nature (H₂O) makes the kind what it is. (Necessary).
  *   **Functional Rigidity:** The role (Heredity) makes the kind what it is; the nature is just a lucky accident of our world. (Contingent).

  So, does it mess up the Necessary A Posteriori? **Yes.** It turns "Gene = DNA" from a **Necessary A Posteriori** truth into a **Contingent A Posteriori** truth. It treats scientific kinds like "The President of the US" (whoever holds the office) rather than "Barack Obama" (this specific person). You can know a posteriori that Obama is the President, but it's not necessary—he could have lost. Similarly, DNA is the Gene, but it didn't *have* to be.

  That is the cost of making scientific terms track theory change: you lose the metaphysical grip that Kripke promised.
