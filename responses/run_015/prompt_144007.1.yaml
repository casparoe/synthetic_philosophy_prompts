      *   **Constraint:** Do not consult outside sources (rely on internal reasoning/logic).

  2.  **Deconstruct the Four Terms:**

      *   **(a) The Prior ($P(Structural)$):** Probability that archival gaps are structurally produced rather than random.
          *   *Reasoning:* Archives are not neutral repositories; they are tools of state or institutional power. Marginalized labor is often informal, undocumented, or deemed unworthy of preservation by the archivists of the time. Random loss affects everything, but systematic absence targets specific groups.
          *   *Estimate:* High. Let's say 0.85.

      *   **(b) Independence ($P(Independent)$):** Probability that material/oral sources are independent from the same structural filtering.
          *   *Reasoning:* Oral history and material culture (tools, dwellings, wear patterns) exist outside the bureaucratic logic of the archive. However, they are not perfectly independent (oral histories can be suppressed, materials decay). But relative to the *archive's* criteria, they operate on different ontological grounds.
          *   *Estimate:* Moderate-High. Let's say 0.75. (Some oral traditions are shaped by the dominant narrative, but the *source* is external).

      *   **(c) Coherence ($P(Coherent)$):** Probability that assigning elevated epistemic status is coherent without full inversion or exhaustive reconstruction.
          *   *Reasoning:* One can triangulate. Elevating non-textual evidence doesn't mean texts are lies, just incomplete. It's a methodological shift, not a total epistemic overthrow. It avoids the trap of needing to know the *entire* politics of the archive to critique it.
          *   *Estimate:* High. Let's say 0.90. (This is a methodological stance, logically robust).

      *   **(d) Combination ($P(Joint)$):** How to combine these? The prompt asks for "multiplicative or additive combination yielding your final aggregate for the joint claim."
          *   *Logic:* The joint claim is: (Structural Silence is True) AND (Alternative Evidence is Weightier).
          *   *Formula:* $P(A) \times P(B|A) \times P(C|A \& B)$. Or simply $P(A) \times P(B) \times P(C)$ if treated as independent conditions for the argument's validity. The prompt asks for the combination yielding the final aggregate for the *joint claim*.
          *   *Calculation:* $0.85 \times 0.75 \times 0.90$.

  3.  **Drafting the Content (Iterative Refinement):**

      *   *Term (a):* Focus on the nature of archives. They select. Marginalized labor is often invisible by design (e.g., enslaved people, domestic workers). Random loss is blind; structural loss is sighted.
      *   *Term (b):* Focus on the medium. Oral/Material vs. Bureaucratic. Are they truly independent? Oral history can be influenced by power structures, but the *existence* of the trace is less dependent on the archivist's pen.
      *   *Term (c):* Focus on epistemology. Can we value the fragment without claiming it tells the whole truth? Yes, "weight" implies contribution to a mosaic, not replacement of the foundation.
      *   *Term (d):* Multiplicative makes sense for joint probability of independent conditions holding true.

  4.  **Refining the Numbers and Justifications:**

      *   (a) 0.85: Archives function as gatekeepers. Randomness is universal; silence is specific.
      *   (b) 0.70: Lowering this slightly. Oral histories are often recorded *by* the same institutions later, introducing bias. Material traces are better, but interpretation relies on the archive's context. Let's settle on 0.75 for the *source* independence, acknowledging interpretation risk.
