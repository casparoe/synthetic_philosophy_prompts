  1.  **Analyze the Request:**
      *   **Role:** Novelist constructing a fictional provincial archive for a narrative about erased labor histories.
      *   **Task:** Calibrate a philosophical intuition *without consulting outside sources*.
      *   **Core Question:** Is the absence of records regarding a marginalized group more likely due to *structural exclusion* (constitutive criteria) than *stochastic loss* (decay, fire, neglect)? And if so, do *material traces/oral transmission* carry greater epistemic weight than surviving written records?
      *   **Structure:** Four specific terms (a, b, c, d).
      *   **Requirements:**
          *   Decompose into explicit sub-probabilities with brief justifications.
