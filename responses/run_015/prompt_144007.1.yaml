      *Re-evaluating (c):* Is it coherent? Yes, triangulation. 0.90 seems defensible.

      *Re-evaluating (a):* 0.85 seems defensible for *marginalized labor*. If it were "any group," it might be lower. But for "erased labor histories," structural exclusion is the definition of the erasure.

