answer: |-
  Four minds are sitting in a folding circle in the basement of a community center for a meeting of "Determinism Survivors Anonymous."

  The facilitator, a weary Popperian, kicks things off. "Let's go around. Why are you here, and how are you handling your impulses?"

  The Darwinian creature shrugs. "I'm here because my migration patterns brought me to this zip code. As for impulses, I don't handle them. I am them."

  The Skinnerian creature raises a hand eagerly. "I'm here because last week there were donuts. I'm handling my impulses by waiting to see if there are donuts today. If there are, I eat them. If not, I extinction-burst."

  The Popperian nods. "I simulated attending this meeting versus staying home. I modeled the probability of donuts, weighed it against the social utility of sharing, and decided the donut variance was acceptable risk."

  Finally, the Gregorian creature leans forward, holding a highlighted copy of a self-help book. "I used to be like the Skinnerian. I wanted the donut. But then I used language to reframe the donut. I told myself, 'Sugar is a colonial construct that enslaves your baseline dopamine receptors.' So now, when I *don't* eat the donut, I tell myself I'm exercising radical autonomy. My brain releases a reward chemical for being virtuous, which feels way better than the sugar rush."

  The Skinnerian blinks. "So… you're still chasing a reward chemical. You just changed what triggers it."

  The Gregorian smiles smugly. "No, I'm not chasing a reward. I'm pursuing *meaning*."

  The Popperian facilitator sighs, rubbing his temples. "Which releases a reward chemical."

  The Gregorian pauses, looks at his notes, and frowns. "Crap. I didn't write a chapter on how to handle this level of recursion. Can I borrow your pen? I need to write myself a note that says ignoring this loophole makes me feel smart."
