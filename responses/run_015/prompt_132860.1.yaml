answer: |-
  # BET-SIZING DECISION TREE (v1.0)
  **Start:** You have a repeatable, positive-EV opportunity. Winnings reinvested.

  ### 1. THE VETO (Epistemic Security)
  **Q:** Is your edge estimate based on a fragile model, inside info you can't verify, or a "hunch" where you might be the liquidity?
  *   **YES** → **LEAF A: Size-Zero ("The Sucker Check")**
      *   *Logic:* If $P(win)$ is uncertain enough that the lower confidence bound crosses 50%, expected log-growth is negative. Sit out.
  *   **NO** → *Proceed to 2.*

  ### 2. GOALS & CONSTRAINTS (Boundary Conditions)
  **Q:** Is there a **hard target** (need $X by date T) OR a **hard floor** (if bankroll < $Y, you are forced to quit)?
  *   **YES, Hard Target ($X by T)** → **LEAF B: Maximize-P(Hit-Target)**
      *   *Logic:* Kelly maximizes *rate*, not *probability of reaching a specific threshold in finite time*. Often requires "Bold Play" (betting more than Kelly) if behind, less if ahead.
  *   **YES, Hard Floor (Ruin Constraint)** → **LEAF C: Ruin-Constrained Sizing**
      *   *Logic:* Standard Kelly never hits zero but approaches it asymptotically. If you have a hard stop-loss, you must size below Kelly to keep $P(\text{hit floor}) < \epsilon$.
  *   **NO (Open-ended growth)** → *Proceed to 3.*

  ### 3. UTILITY SHAPE (Marginal Value of Wealth)
  **Q:** If your bankroll grew to $50M+, would an extra dollar be worth less to you than it is now (e.g., you'd stop playing or donate)?
  *   **YES (Saturating Utility)** → **LEAF D: Power-Utility Maximization**
      *   *Logic:* You are maximizing $E[W^\gamma]$ where $\gamma < 1$. Effectively "Fractional Kelly" derived from external wealth/utility needs, not fear.
  *   **NO (Log-Utility / Infinite Game)** → *Proceed to 4.*

  ### 4. HORIZON & STATISTIC (What are we maximizing?)
  **Q:** Are you optimizing for the **median** outcome of a finite sequence (e.g., 10 bets) or the **long-run time-average growth rate** (infinite/repeatable)?
  *   **MEDIAN (Finite Horizon)** → **LEAF E: Median Maximization**
      *   *Logic:* On finite horizons, the median outcome is maximized by betting *less* than Full Kelly. (Converges to Kelly as $N \to \infty$).
  *   **TIME-AVERAGE GROWTH (Infinite/Repeatable)** → **LEAF F: Full Kelly (aka Ergodic Growth)**
      *   *Note:* These are the same math. Maximizing time-average geometric growth *is* maximizing Expected Log-Utility. Do not split them.
      *   *Proceed to 5 for execution refinement.*

  ### 5. EXECUTION & CORRELATION (Real-World Friction)
  **Q:** Are you placing **multiple bets simultaneously** that resolve before you can rebalance, OR do you distrust your precise edge estimate?
  *   **MULTIPLE SIMULTANEOUS** → **LEAF G: Portfolio Kelly**
      *   *Logic:* Requires inverting the covariance matrix. You cannot size independently; you must solve for the vector $\vec{f}$ that maximizes joint log-growth.
  *   **EDGE UNCERTAINTY (Noisy Estimate)** → **LEAF H: Robust / Bayesian Kelly**
      *   *Logic:* Integrate over the posterior distribution of your edge. Mathematically shrinks bet size as variance of estimate increases.
  *   **SINGLE BET + VOLATILITY PAIN** → **LEAF I: Fractional Kelly**
      *   *Logic:* Heuristic shrinkage (e.g., "Half-Kelly"). Used when you accept lower growth to reduce drawdown variance, despite having Log-Utility preferences.

  ---

  ## INDISTINGUISHABLE LEAVES (The "Bet Less" Cluster)
  **Leaves D (Power), H (Robust), and I (Fractional)** often output the same position (e.g., $0.5 \times f_{Kelly}$). The tree separates them by *motivation*, not output:
  *   **Power-Utility:** "My utility function is objectively non-log (I have outside wealth needs)."
  *   **Robust Kelly:** "My edge estimate $p$ is a distribution, not a point."
  *   **Fractional Kelly:** "My utility is Log, but I can't stomach the volatility/drawdown."
  *   *Warning:* If you claim Log-Utility but bet Fractional for "safety," you are incoherent. Either admit non-Log utility (Power) or epistemic uncertainty (Robust).

  ## EMPTY REGIONS (Incoherent or Dominated)
  1.  **Maximize Arithmetic Mean on Repeatable Bets:**
      *   *Status:* **Incoherent.** Leads to sure ruin (Gibbs phenomenon). Never defend this.
  2.  **Full Kelly + Hard Ruin Constraint:**
      *   *Status:* **Incoherent.** Full Kelly has no stop-loss; it allows drawdowns to 99.9%. If you have a hard floor, you *must* use Ruin-Constrained sizing (Leaf C).
  3.  **Median Maximization on Infinite Horizon:**
      *   *Status:* **Dominated.** As $N \to \infty$, the median converges to the geometric mean. Median Max becomes Full Kelly. No need for a separate leaf.
  4.  **Size-Positive on Negative Log-Expectation:**
      *   *Status:* **Incoherent.** If your robust edge estimate implies negative geometric growth, any bet size $>0$ destroys wealth over time. (See Leaf A).

  ---
  *Handout ends. Discuss the "Bet Less Cluster" first.*
