answer: |-
  There is no single, canonical term in meta-ethics or moral psychology that precisely captures this specific topological inconsistency, though it intersects with discussions of *lexical superiority*, *threshold deontology*, and *moral exceptionalism*. Existing terms describe the *components* (e.g., "moral status thresholds" or "qualitative distinctions") but fail to name the structural contradiction of asserting a continuum while simultaneously enforcing an unmapped categorical wall. To capture this specific architecture of reasoning, I propose the term **Gated Gradualism**.

  **Gated Gradualism** is defined by three necessary conditions:
  1.  **Scalar Premise:** The arguer explicitly rejects binary moral status in favor of a continuous scale (e.g., sentience, cognitive capacity) to avoid arbitrariness.
  2.  **Categorical Gate:** The arguer asserts a sharp exclusion for a specific subset of entities (e.g., insects, machines) based on a qualitative criterion (e.g., "genuine" experience, "right kind" of integration) that is not reducible to a position on the established scale.
  3.  **Internal Gradation:** Within the privileged class that passes the gate, the scalar premise is reinstated to differentiate moral weight (e.g., humans > chimps > mice).

  **Distinctions from Nearby Concepts:**
  *   **Vs. Ordinary Threshold-Setting:** Standard threshold accounts acknowledge the continuum but set a pragmatic cutoff point *on* the scale (e.g., "above pain capacity X, rights apply"). Gated Gradualism posits a wall *alongside* the scale, justified by a quality distinct from the metric used for internal weighting.
  *   **Vs. Pure Gradualism:** Pure gradualism assigns non-zero (albeit potentially negligible) weight to all entities on the continuum. Gated Gradualism assigns null status to those behind the gate, regardless of their scalar score.
  *   **Vs. Equivocation:** Equivocation involves shifting the definition of a term mid-argument. Gated Gradualism maintains consistent terminology (e.g., "sentience") but applies inconsistent logical topologies (continuous vs. categorical) to different domains without bridging them.
  *   **Vs. The Non-Identity Problem:** The non-identity problem concerns obligations to future persons whose existence depends on current actions. Gated Gradualism concerns the synchronic classification of existing entities and is unrelated to generational contingency.

  **Delimiting the Edges:**
  An instance counts as Gated Gradualism only if the justification for the exclusion cannot be mapped to the continuum. If a speaker argues, "Insects are excluded because their neural complexity scores below 5.0, while mammals score above," this is **Threshold-Setting**, not Gated Gradualism. If a speaker argues, "Insects are excluded because they lack a soul, but among soul-havers, complexity matters," this is **Dual-Property Theory**, not Gated Gradualism (as two distinct scales are admitted). Gated Gradualism occurs specifically when one scale is professed, but a non-scalar wall is enforced.

  Gated Gradualism names this structural inconsistency where a continuous scale governs internal weighting while an unmapped qualitative barrier dictates external exclusion.
