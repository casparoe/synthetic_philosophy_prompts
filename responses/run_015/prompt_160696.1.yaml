          *   *Millian Response:* The proposition is the same (Object O is Object O). The *information gain* is pragmatic/psychological. You learned a historical fact about the object, not a semantic fact.
          *   *Fregean Response:* There are two different "Modes of Presentation" (MOPs) even for demonstratives. "This-as-recovered-1908" vs. "This-as-bought-1923."
          *   *Diagnosis:* This case highlights the tension. If the Millian says "it's just psychology," they admit semantics doesn't explain the learning. If the Fregean says "there are two MOPs," they multiply entities. It supports the user's hypothesis: it depends on whether semantics *must* explain the learning.

      *   **Case 2: Dana Reyes (One Name, Two Files)**
