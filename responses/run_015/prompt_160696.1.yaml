answer: |-
  This is an exceptionally clear-eyed assessment of the landscape. You have correctly identified that the stalemate is not due to a lack of cleverness on either side, but rather a structural feature of the debate itself.

  Here is the diagnosis you requested, testing your hypothesis against the three cases you provided, defining terms as we go, and concluding with an assessment of confidence and limitations.

  ### The Core Diagnosis: Two Jobs, One Tool

  Your hypothesis is robust: **The disagreement is primarily about the job description of semantic theory.**

  To explain this, we need to define the central term causing the friction: **Proposition**. In philosophy, a proposition is the core claim or information carried by a sentence. It is what is believed, known, or asserted. It is also what is typically judged as true or false.

  *   **Camp A (The Fregeans)** believes a semantic theory must explain *rational cognition*. If a speaker can rationally believe Sentence X without believing Sentence Y, then X and Y must express different propositions. For them, the proposition includes the "way of thinking" about the object.
  *   **Camp B (The Direct Reference Theorists)** believes a semantic theory must explain *truth and logical structure*. If Sentence X and Sentence Y are true in exactly the same situations (because they name the same object), they express the same proposition. For them, the proposition is just the object and the property attributed to it. This is often called a **Singular Proposition**: a claim that directly contains the object itself, not a description of it.

  The stalemate persists because Camp A thinks Camp B is ignoring the data of human reasoning, while Camp B thinks Camp A is contaminating logic with psychology.

  Let's test this against your three cases.

  ### Case 1: The Statue (Perceptual Identity)

  **The Scenario:** You see one statue. You are told "This is the Harbour Piece." Later, "This is the Auction Piece." You learn "The Harbour Piece is the Auction Piece."

  **Does this discriminate between the camps?**
  It sharpens the conflict but does not resolve it. It forces both sides to reveal their hand regarding **demonstratives** (words like "this" or "that").

  *   **The Direct Reference View:** They argue that "This" contributes only the object to the **proposition**. Since it is the same object both times, the proposition "This is This" is trivial. The information gain is not semantic; it is historical. You learned that *this object* has two history-tracks. They would say your surprise is about the *world* (the history of the statue), not the *meaning* (the reference of the word).
      *   *The Strain:* You noted this feels strained because the object was perceptually fixed. The Direct Reference theorist replies: "Perception fixes the object, but it doesn't fix your knowledge of the object's history." They locate the difference in your beliefs, not the meaning of "This."
  *   **The Fregean View:** They argue that even "This" has a **Mode of Presentation** (a way the object is given to you). The first "This" was presented as *the thing recovered from the harbour*. The second was *the thing bought at auction*. These are different modes, so the propositions differ.
      *   *The Cost:* As you suspected, they must multiply "ways of presenting." If every new fact you learn about a visible object creates a new "Mode of Presentation," the theory becomes very complex.

  **Diagnosis:** This case supports your hypothesis. The Direct Reference theorist is willing to say semantics *cannot* explain your surprise. The Fregean is willing to complicate semantics to *ensure* it explains your surprise. The data (the statue) is the same; the tolerance for what semantics must explain differs.

  ### Case 2: Dana Reyes (One Name, Two Files)

  **The Scenario:** One person, one name, but two disconnected mental dossiers (Union Rep vs. Author).

  **Does a view that puts work in names have resources here?**
  This is the strongest evidence for your hypothesis that the dispute relocates to "mental files."

  *   **The Problem:** If meaning is just the object (Direct Reference), then "Dana is blunt" and "Dana is bookish" are about the same person. If you deny they are the same person, you are factually wrong, but you haven't made a *semantic* error.
  *   **The Shift:** Most philosophers, even those in the Direct Reference camp, concede that something like **Mental Files** (or dossiers, or notions) exists in psychology. These are the cognitive structures where you store information about an individual. You had two files for Dana Reyes.
  *   **The Disagreement One Level Down:**
      *   **Camp A** says: These Mental Files are relevant to *meaning*. If the files are separate, the meanings are different.
      *   **Camp B** says: These Mental Files are relevant to *psychology*. Meaning is just the link between the name and the person. The fact that you have two files is a bug in your brain, not a feature of the language.

  **Diagnosis:** This confirms that the dispute is about **boundary drawing**. Both sides can agree on the cognitive architecture (that you have two files). They disagree on whether the semantic theory should map onto those files or ignore them in favor of the external link. This suggests the disagreement is methodological: Is semantics a branch of logic (Camp B) or a branch of cognitive science (Camp A)?

  ### Case 3: The Metadata (Engineers vs. Cataloguers)

  **The Scenario:** Engineers say "Entity is Entity" (Identity). Cataloguers say "Provenance matters" (History/Context).

  **Is this the same dispute?**
  Yes, it is an isomorphic structural problem. You are correct that this is not merely a "costume" for the philosophical puzzle; it is the same logical tension applied to information systems.

  *   **The Engineers (Direct Reference):** They care about **Compositionality**. This is the principle that the meaning of a complex expression is determined by the meanings of its parts and how they are combined. In a database, if `ID_123` is merged with `ID_456`, the system treats them as one. Any query for `ID_123` must return the same truth values as `ID_456`. To the engineer, keeping them separate after merging is an error.
  *   **The Cataloguers (Fregeans):** They care about **Informational Value**. They know that `Source_A` implies different reliability and context than `Source_B`. Merging the records loses the *history of the data*.
  *   **The Practical Resolution:** In your workplace, you solve this by having *two fields*. You have an `Entity_ID` (for the engineers/reference) and a `Provenance_Note` (for the cataloguers/sense).

  **Diagnosis:** This is where the philosophical stalemate is most illuminating. Philosophy tries to capture both the `Entity_ID` and the `Provenance_Note` in a single concept called **Meaning**.
  *   When philosophers argue, they are fighting over whether "Meaning" is the `Entity_ID` or the `Provenance_Note`.
  *   Your suspicion is correct: The philosophical dispute only "bites" where we demand one concept do both jobs. In metadata, you pragmatically separate them. In philosophy, they fight over which one is the "real" meaning.

  ### Synthesis: Substantive, Verbal, or Methodological?

  Is the disagreement substantive (about facts), verbal (about definitions), or two questions under one heading?

  It is **two questions under one heading.**

  1.  **Question 1:** How do words hook onto the world to make sentences true or false? (The Engineer/Reference question).
  2.  **Question 2:** How do words convey information to a thinker who might be ignorant or confused? (The Cataloguer/Cognition question).

  For a century, philosophy has used the word "Meaning" to answer both.
  *   **Camp B** answers Question 1 and tells Question 2 to go to psychology.
  *   **Camp A** answers Question 2 and insists it is part of Question 1.

  **Is there a hidden empirical question?**
  Yes. It is about how human beings store and retrieve information (the "Mental Files" from Case 2). However, settling the empirical facts won't solve the philosophical dispute. Even if we know exactly how the brain stores "Dana Reyes" data, philosophers will still argue over whether that storage mechanism counts as "Semantic Meaning" or "Psychological Processing."

  **What would count as progress?**
  Progress would not be one side defeating the other. Progress would be a **change of question**.
  *   **Formal Result:** A formal system that explicitly separates "Semantic Content" (truth conditions) from "Cognitive Content" (informational role) without reducing one to the other. (Some logics attempt this, treating them as two dimensions of meaning).
  *   **Distinction:** A widespread agreement to stop using the word "Meaning" for both jobs. If we agreed that "Reference" handles truth and "Sense" handles cognition, and admitted they are different mechanisms, the fighting would stop.

  **Is there an argument that no progress should be expected?**
  Yes. The argument is that natural language *itself* conflates these two jobs. We use names both to talk about things (Reference) and to organize our thoughts (Cognition). If the language we use to describe the world is the same language we use to describe our thoughts, the confusion is built into the tool. We cannot expect a clean separation because the phenomenon itself is not cleanly separated.

  ### Confidence and Limitations

  **Overall Confidence:** High (85%).
  Your diagnosis that this is a dispute about the *aims* of semantic theory rather than the *facts* of the cases is the standard meta-philosophical conclusion reached by experts who study the history of this debate. The metadata analogy is particularly strong evidence for this, as it shows the logical structure exists independently of human psychology.

  **The Claim I Am Least Sure Of:**
  I am least certain about the claim that **"No progress should be expected because the phenomenon is not cleanly separated."**
  *Reasoning:* It is possible that a future theoretical framework (perhaps in formal semantics or cognitive science integration) could successfully model the interaction between reference and cognition in a way that dissolves the tension, rather than just accepting it. I am flagging this because it is a pessimistic prediction about the future of the field, which is inherently risky.

  **Places Where I Am Reconstructing Loosely:**
  1.  **Homogeneity of Camps:** I have treated "Direct Reference Theorists" and "Fregeans" as monolithic blocks. In reality, there are many hybrid views. Some Direct Reference theorists allow "pragmatic" adjustments to explain the cognitive difference without changing the "semantic" content. I have smoothed this over to make the structural conflict clearer.
  2.  **The Definition of "Semantics":** I have assumed a standard distinction between Semantics (literal meaning) and Pragmatics (contextual use). Some philosophers argue this boundary is fuzzy. If the boundary is fuzzy, the dispute might be about where to draw a line that doesn't objectively exist.
  3.  **The Metadata Analogy:** While structurally isomorphic, database engineering has a goal (system efficiency) that philosophy lacks (truth/understanding). I may be overstating how easily the practical solution translates to the theoretical one. Philosophers cannot simply "add a field" to their ontology as easily as a database admin can.

  ### Summary for Your Work

  You asked if your workplace version is the same dispute. It is.
  *   **Engineers** are acting as **Direct Reference Theorists**: The entity is the truth-maker. Provenance is metadata, not identity.
  *   **Cataloguers** are acting as **Fregeans**: The history of the record is constitutive of what the record *is* for the user.

  The reason philosophy doesn't move is that it refuses to be a database. It wants to know which field is the "Real" one. Your diagnosis is correct: they are answering different questions. One asks, "What makes this true?" The other asks, "What does this tell me?" Until they admit these are different questions, they will keep giving answers that sound like contradictions.
