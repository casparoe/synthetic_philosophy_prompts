answer: |-
  If we are to translate the debate over the Principal Principle into the vocabulary of Bayesian modeling, we must begin by identifying the objective chance with the latent parameter in an exchangeable sequence. On your working view, which aligns with the de Finettian dissolution, the assertion that the chance of an event A is x is simply the assertion that the sequence of trials is exchangeable and that the directing measure assigns mass to the parameter value theta equals x. The Principal Principle then ceases to be a metaphysical bridge between mind and world and becomes a statement about conditional predictive distributions. Specifically, it asserts that your posterior predictive probability for the next outcome, conditional on the parameter theta taking the value x and conditional on any admissible evidence E, should be exactly x. In the language of hierarchical models, this is merely the definition of the likelihood function for a Bernoulli process or, more generally, the property that theta is a sufficient statistic for the sequence given the model structure. The philosophers' insistence that rational credence must defer to chance translates to the requirement that your prior distribution over the parameter space must not contradict the likelihood specification once the parameter is known. When they argue about whether chances are real propensities or patterns in the history of the world, they are arguing over the ontological status of theta. The propensity theorist treats theta as a structural parameter representing a physical causal mechanism that exists prior to and independently of the data generation. The Humean treats theta as a functional of the entire infinite sequence, essentially the limiting frequency, which means theta is a random variable determined by the tail sigma-field of the process. The eliminativist agrees with you that theta is a predictive fiction, a bookkeeping device required by the representation theorem to organize expectations about future observations without committing to a generator in the world.

  The notion of admissible evidence is perhaps the most straightforward to translate, as it maps cleanly onto the concept of information that preserves the conditional independence structure of the model. Evidence is admissible if, conditional on the parameter theta, it provides no additional information about the outcome of interest. In your terms, E is admissible if the outcome A is conditionally independent of E given theta. Inadmissible evidence, therefore, is information that breaks exchangeability or provides a shortcut to the outcome that bypasses the latent parameter, such as direct knowledge of a future realization or knowledge of a mechanism that correlates with the outcome but is not captured by theta. The philosophical dispute regarding admissibility often centers on whether information about the laws of nature or the total history of the world counts as admissible. In your vocabulary, information about the laws is information about the hyperparameters governing the prior over theta, which is perfectly admissible and indeed necessary for learning. Information about the total history is tricky because if theta is defined as the limit of that history, conditioning on the total history collapses the posterior to a point mass, rendering the chance trivial. The philosophers' worry that certain evidence undermines the chance corresponds to your concern about non-conjugacy or prior support issues. If the evidence suggests a limiting frequency that lies outside the support of your prior, your model is misspecified. However, the specific philosophical worry about undermining is more subtle: it suggests that the definition of the chance itself depends on the very outcomes the chance is supposed to govern, creating a feedback loop where learning the outcomes changes the chance, which in turn should have changed the credence in the outcomes.

  This brings us to the residue report, which is the core of your inquiry. Your dissolutionist view holds that once de Finetti is internalized, the Principal Principle is a theorem about conditional predictive distributions and the metaphysical debate is merely interpretive. For the most part, this holds up under translation. The machinery of exchangeable sequences and latent parameters is sufficient to capture the normative constraints the philosophers are discussing, provided we treat the chance as a random variable within the model. However, there is a residue that your vocabulary does not fully absorb, and it centers on the source of the constraint. In your framework, the prior distribution is exogenous; you choose it based on coherence, convenience, or elicitation. The Principal Principle, however, is often presented by its defenders as an endogenous constraint on rationality that comes from the world, not the agent. They argue that if the objective chance is x, you are not merely coherent if you set your credence to x, you are rationally compelled to do so by the structure of reality. Your vocabulary can model the compulsion as a delta-function prior, but it cannot explain why that prior is mandated without importing the very metaphysical notion you seek to dissolve. The statistical formalism tells you how to update given a parameter, but it is silent on why the parameter should exist or why it should command deference beyond pragmatic utility. This is not a failure of prediction, but it is a failure to capture the normative force the philosophers attribute to chance.

  The more significant residue, however, lies in the undermining problem, which you suspected might point to something exchangeable modeling cannot express. Lewis's undermining argument posits that if chances are Humean summaries of history, then there is a non-zero probability that the future history will be such that the best summary of the total history yields a different chance than the one currently posited. In your vocabulary, this looks like uncertainty about a tail event. You might model this by placing a prior over the limiting frequencies. However, the philosophical problem arises because the chance is supposed to be the guide to credence *now*, even though its value is determined by the *future*. If the theory linking history to chance is known, then your current credence in the chance being x must account for the possibility that the future frequencies will deviate enough to make y the best system chance. This creates a tension where the chance function is not rigid. In a standard hierarchical model, theta is fixed for the sequence. If theta is the limit, it is fixed almost surely by the strong law of large numbers, but only in the limit. For any finite n, there is uncertainty. The philosophers argue that this uncertainty makes it incoherent to defer to the current chance value because the current chance value is contingent on future data that hasn't arrived. Your framework handles this by treating the limit as a random variable and integrating over it. The predictive distribution is a mixture. But the Principal Principle demands deference to the *actual* chance, not the expected chance. If the actual chance is a function of the future, you cannot know it now. Thus, the Principle becomes inapplicable to Humean chances in the present tense.

  This suggests that the residue is not a missing mathematical object but a mismatch in the temporal and modal indexing of the parameter. Your exchangeable models assume a parameter that generates the data. The Humean account defines a parameter that summarizes the data. While de Finetti's theorem proves these are predictively equivalent for infinite sequences, they are not equivalent for finite inference about the chance itself. The undermining problem highlights that if chance is a summary, it is not available as a conditioning variable for present credence in the way the Principal Principle requires. You can condition on a latent variable in your model, but if that variable is ontologically dependent on the future realization, conditioning on it is counterfactual or subjunctive. Your vocabulary allows you to say what your predictions are, but it struggles to state the truth conditions for the claim that the chance is x right now, if x is determined by the future. The philosophers are fighting over whether there is a fact of the matter about x now. You are saying the fact of the matter is just the predictive distribution. They are saying the predictive distribution depends on the fact of the matter.

  Ultimately, the residue shows that your vocabulary is not missing something real about prediction, but it is deliberately silent on the metaphysical grounding of the prior. The undermining problem does not reveal a flaw in exchangeable modeling; rather, it reveals that the Principal Principle, when combined with a Humean metaphysics, demands a kind of access to future-determined parameters that is incoherent. The statisticians' solution is to treat the parameter as a generator, which dissolves the undermining by fiat. The philosophers' refusal to accept this fiat is not a confusion about probability, but a refusal to accept the de Finettian reduction of chance to belief. If you are willing to accept that chance is nothing over and above the idealized credence of a rational agent with exchangeable beliefs, then the dissolution is complete and the residue vanishes. But if there is a sense in which the world constrains the agent's prior independently of the agent's coherence, your vocabulary has no place to record that constraint other than as an arbitrary boundary condition on the model space. The undermining argument survives translation not as a mathematical impossibility, but as a demonstration that the Humean definition of chance cannot serve as the conditioning variable required by the Principal Principle without circularity. Your framework avoids the circularity by assuming the parameter exists prior to the data, which is exactly the propensity view the Humeans reject. Therefore, the debate is not about the math of prediction, which you have mastered, but about the direction of determination between the parameter and the data, which is a metaphysical choice your formalism treats as a modeling assumption. The residue is the realization that the Principal Principle is not a theorem of probability theory, but a normative postulate that requires a specific metaphysical alignment between the agent's parameters and the world's structure, an alignment that de Finetti's theorem makes optional rather than necessary.
