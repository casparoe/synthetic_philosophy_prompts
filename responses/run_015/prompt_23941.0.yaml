answer: |-
  This is a sophisticated position. You have correctly identified that Rank-Dependent Utility (RDU) is the standard "steelman" alternative to Expected Utility (EU) for decision theorists who want to preserve stochastic dominance while accommodating the Allais paradox. You are also right that Dual Theory (Yaari) and RDU (Quiggin) are often conflated; your description ("keep vNM utility... swap linear probability") is technically RDU, which is the stronger candidate for your purposes.

  However, you are asking for defeaters, not validation. You suspect you have talked yourself out of hearing the real problems. You are likely correct. Below is the adversarial breakdown you requested, ranked from fatal to awkward, followed by the falsifiability check and the specific "monster" reductio you asked for.

  ### I. The Defeaters

  #### 1. Fatal: The Continuity vs. Lexicographic Conflict (The Real "Child" Problem)
  You asked for a clean case where the weighting function that fixes Allais makes you a "monster." You suspected it was about over-weighting tiny probabilities. It is actually about **under-weighting near-certainty**.

  *   **The Mechanism:** To solve the Allais Common Consequence effect, your weighting function $w(p)$ must exhibit a "certainty spike." Mathematically, the slope of $w(p)$ must be extremely steep as $p \to 1$. This implies that $w(0.99)$ is significantly depressed relative to $0.99$ (e.g., $w(0.99) \approx 0.85$) to create the large gap between $w(1)$ and $w(0.99)$.
  *   **The Reductio:** Consider the moral dilemma.
      *   **Option A:** Child survives for sure.
      *   **Option B:** 99% child survives, 1% child dies + You gain \$10 Billion.
  *   **EU Calculation:** Weighs the survival at $0.99$. If the disutility of death is high enough, EU rejects the gamble.
  *   **RDU Calculation:** Weighs the survival at $w(0.99)$. Because of the "certainty spike" required to fix Allais, $w(0.99)$ is *discounted* heavily relative to linear probability. You value the 99% safety *less* than an EU maximizer does.
  *   **The Fatal Blow:** If the Allais effect is strong enough to justify your adoption of RDU, the depression of $w(0.99)$ is mathematically coupled to that strength. There are parameter regions where an EU agent (with reasonable risk aversion) would reject the child gamble, but the RDU agent (driven by the same curvature that makes them choose 1A in Allais) accepts it.
  *   **Why you can't fix it:** You suggested "dialing the over-weighting down." If you flatten $w(p)$ near 1 to protect the child, you lose the ability to explain the Allais violation. You cannot have a weighting function that is both "steep enough to explain Allais" and "flat enough to protect near-certain moral goods" without admitting that risk attitudes are **domain-specific**. But if they are domain-specific, RDU is not a general theory of rationality; it's just a curve-fitting tool for monetary gambles.
  *   **Committed Dual Theorist Response:** They will concede this is a problem for *moral* utility but wave it off for *descriptive* theory, arguing that lexicographic preferences (infinite disutility) are irrational.
  *   **Verdict:** **Fatal** for normative claims, **Awkward** for purely descriptive claims.

  #### 2. Fatal: Unfalsifiability via Functional Freedom
  You asked if the view has been qualified into unfalsifiability. The answer is yes, unless you impose rigid parametric constraints.

  *   **The Problem:** RDU states that $V(L) = \sum w(F(x_i)) u(x_i)$. Without constraining the functional form of $w(p)$, RDU can rationalize *any* preference ordering that satisfies First-Order Stochastic Dominance (FOSD). Since EU is a special case of RDU (where $w(p)=p$), RDU is strictly less falsifiable than EU.
  *   **The Parameter Instability:** To make RDU falsifiable, you must adopt a parametric form (e.g., Prelec's one- or two-parameter function). However, empirical literature consistently shows that the parameters of $w(p)$ shift based on:
      1.  **Magnitude:** Weighting functions for \$10 gambles differ from \$1,000,000 gambles.
      2.  **Domain:** Weighting for gains differs from losses (which pushes you back toward Prospect Theory).
      3.  **Context:** The presence of other lotteries in the choice set can shift $w(p)$.
  *   **The Defeater:** If the weighting function is not a stable property of the agent but varies by context and magnitude, RDU loses its claim to be a "fix" for rationality. It becomes a description of local inconsistencies. If $w(p)$ changes when the stakes change, you haven't solved the Allais paradox; you've just moved the instability from the choice to the utility function.
  *   **Verdict:** **Fatal** to the claim that this is a *normative* theory of rationality.

  #### 3. Awkward: The Welfare Measurement Problem (Preference-Dependent Utility)
  You argued that preference-dependent utility is a "feature, not a bug." Philosophically, this is a hard sell for welfare economics.

  *   **The Issue:** In vNM EU, utility measures a stable underlying preference relation. If I prefer A to B, I am better off with A. In RDU, my "utility" for an outcome depends on its rank within the lottery.
  *   **The Consequence:** You cannot construct a stable welfare ordering over outcomes. If I prefer \$1M in a safe lottery but \$1M is weighted differently in a risky lottery, do I *really* value \$1M more in the first case? Or is my preference merely an artifact of the ranking?
  *   **The Cost:** This destroys the link between choice and well-being. If a policymaker wants to maximize citizen welfare, RDU offers no stable metric to maximize. You can only maximize "satisfaction of current context-dependent preferences," which is circular.
  *   **Committed Dual Theorist Response:** They will concede this but argue that "rationality" is about coherence of choice, not metaphysical welfare.
  *   **Verdict:** **Awkward** for decision theory, **Fatal** for policy/welfare applications.

  #### 4. Awkward: Cognitive Plausibility and Reduction
  *   **The Issue:** RDU requires the agent to sort outcomes by rank to assign weights. This is computationally more demanding than EU.
  *   **The Violation:** RDU typically violates **Reduction of Compound Lotteries**. An RDU agent might prefer a two-stage lottery to its reduced one-stage equivalent because the ranking of outcomes changes during the reduction process.
  *   **The Cost:** While EU's reduction axiom is often violated by humans, normatively it is very strong. A theory that prescribes violating reduction (i.e., "you should care about how the risk is framed/staged") is a hard pill to swallow as a *normative* fix.
  *   **Verdict:** **Merely Awkward.** Most non-EU theorists accept this cost.

  ---

  ### II. Unfalsifiability and Unique Predictions

  You asked what the theory actually predicts if it can fit anything.

  **1. Is it Unfalsifiable?**
  Yes, in its general form. No choice pattern consistent with FOSD can falsify general RDU. To make it scientific, you must commit to a specific parametric form (e.g., $w(p) = \exp(-(-\ln p)^\alpha)$). Once you do that, it becomes falsifiable, but it often fails to fit data across different stake levels without changing $\alpha$.

  **2. Unique Behavioral Prediction (vs. EU and CPT)**
  To distinguish RDU from EU and Cumulative Prospect Theory (CPT) in a lab, you need a test where **Rank** matters independently of **Domain** (Gain/Loss) and **Probability**.

  *   **The Test:** **Event-Splitting with Rank Shifts.**
      *   Create a lottery where splitting an event changes the *rank* of an outcome, not just its probability.
      *   *Lottery A:* 50% \$100, 50% \$0.
      *   *Lottery B:* 25% \$100, 25% \$100, 50% \$0. (EU and RDU should be indifferent).
      *   *Lottery C:* 50% \$100, 25% \$50, 25% \$0.
      *   *Lottery D:* 50% \$100, 25% \$50, 25% \$50.
      *   **Prediction:** CPT (with loss aversion) predicts shifts based on gains/losses. RDU predicts shifts based specifically on the *cumulative ranking*.
      *   **Better Test:** **Mixed Gambles with Dominated Outcomes.** Add a strictly dominated outcome to a lottery. EU says preference shouldn't change. RDU says the *ranking* of the good outcomes might shift relative to the new worst outcome, changing their weights.
      *   **Specific Prediction:** If you add a terrible outcome (e.g., -\$1M) to a lottery involving only gains, RDU predicts your risk attitude toward the gains will *change* because their cumulative probability ranks have shifted. EU predicts no change. CPT predicts a change due to loss aversion integration.
      *   **Differentiation:** You can isolate RDU by keeping everything in the gain domain but shifting ranks. If risk attitude changes solely because an outcome moved from "2nd best" to "3rd best" (even if probabilities are identical), that is pure RDU behavior.

  ---

  ### III. The "Monster" Reductio Case

  You asked for a clean case where the Allais-fix implies monster-behavior. Here is the specific construction:

  **The Setup:**
  Assume your weighting function $w(p)$ fits the standard Allais Common Consequence effect. This requires $w(1) - w(0.99) > w(0.10) - w(0.09)$. A standard calibration (e.g., Tversky & Kahneman) might look like $w(1)=1, w(0.99)=0.90, w(0.01)=0.05$.

  **The Choice:**
  *   **Option Safe:** Child Lives (Utility = 0).
  *   **Option Gamble:** 99% Child Lives + \$1 Billion, 1% Child Dies (Utility = $-U_{death}$).

  **EU Agent:**
  $V_{gamble} = 0.99 \times (U_{\$1B}) + 0.01 \times (-U_{death})$.
  If $U_{death}$ is sufficiently large (even if finite), the 0.01 weight keeps this negative.

  **RDU Agent:**
  $V_{gamble} = w(0.99) \times (U_{\$1B}) + (1-w(0.99)) \times (-U_{death})$.
  Using the calibration above: $V_{gamble} = 0.90 \times (U_{\$1B}) + 0.10 \times (-U_{death})$.

  **The Reductio:**
  The RDU agent weights the risk of death at **10%**, while the EU agent weights it at **1%**.
  Because the Allais fix requires depressing $w(0.99)$ (to create the gap at certainty), it mathematically forces the complement $1-w(0.99)$ (the weight on the worst outcome) to be **larger** than the linear probability.
  **Result:** The exact curvature that makes you rational in the Allais paradox makes you **10x more willing to gamble with the child's life** than a standard EU maximizer. You cannot "dial it down" without breaking the Allais explanation, because the depression of $w(0.99)$ is the *source* of the Allais preference.

  ---

  ### IV. Confidence and Uncertainty

  **Confidence Level:** **85%**.
  The theoretical landscape here is well-mapped. The tension between FOSD, Allais, and Continuity is a known triangle of impossibility (see: Buchak, *Risk and Rationality*). The mathematical coupling between the certainty effect and the underweighting of near-certainty is robust.

  **Least Certain Point:** **The Empirical Stability of $w(p)$.**
  I am least sure about the claim that $w(p)$ *must* be unstable across magnitudes. There is ongoing research suggesting that with proper scaling (logarithmic wealth), $w(p)$ might be more stable than current literature suggests. If $w(p)$ turns out to be stable across magnitudes, the "Unfalsifiability" defeater weakens significantly, leaving RDU as a strong descriptive (if not normative) contender. However, the "Child Reductio" regarding the depression of $w(0.99)$ remains mathematically intact regardless of parameter stability.

  **Final Advice:**
  If you defend this on forums, do not claim RDU is *normatively* superior to EU in all domains. Claim it is the best *descriptive* model that preserves FOSD. If you claim it is normatively superior, the "Child Reductio" (specifically the 10% vs 1% risk weighting) will dismantle the position unless you are willing to argue that valuing a 99% chance of safety at only 90% is morally defensible.
