answer: |-
  **Starting point**

  The session fails unless students accept this premise: **Cluelessness is not high variance; it is undefinedness.** Your audience treats uncertainty as a parameter to be widened within expected-value (EV) calculations. They believe any ignorance can be modeled as a credence distribution. You must establish immediately that cluelessness describes situations where probabilities or values are *not merely unknown but undefined*—where the mathematical inputs for EV reasoning do not exist. If they believe wide credences solve the problem, cluelessness disappears as a distinct philosophical threat. Secure this distinction before discussing causes or values. Nothing later works if they think cluelessness is just "really big error bars."

  **Order of construction**

  1.  **Establish the EV Baseline (15 mins):** Briefly map their existing framework: Act → Outcome → Probability × Value → EV. Confirm they accept this as action-guiding.
  2.  **Introduce Causal Cluelessness (25 mins):** Show where the "Probability" input breaks. Use long-term chains where outcomes are ontologically open or chaotically sensitive. Emphasize that no amount of research yields a probability distribution here.
  3.  **Introduce Evaluative Cluelessness (25 mins):** Show where the "Value" input breaks. **Critical Warning:** This half is fragile. With this audience, "unsettled moral status" or "incommensurable values" will immediately collapse into Moral Uncertainty (e.g., "just assign credence to utilitarianism vs. person-affecting views"). To prevent collapse, you must frame this strictly as *structural incommensurability within a single theory*, not uncertainty across theories. If students insist credences solve this, **drop this half**. Replace it with a deeper dive into Causal Cluelessness vs. Empirical Uncertainty. The distinction survives only if you defend incommensurability robustly; otherwise, it becomes a subset of moral uncertainty.
  4.  **Distinguish from Neighbours (15 mins):** Contrast both halves against Empirical Risk (defined probs), Moral Uncertainty (defined values/probs but unsure theory), and Plain Ignorance (solvable by research).
  5.  **Action-Guidingness vs. Truth (10 mins):** Conclude that consequentialism might be true (what makes acts right) but not action-guiding (how we decide), because the calculation cannot be performed.

  Do not offer replies (e.g., satisficing, proxy rules) until step 5. The problem must bite first. If you offer defusing moves earlier, students will treat cluelessness as a solved puzzle rather than a structural gap.

  **The carrying example**

  **Verdict:** Your candidate (Deworming vs. AI Policy) carries the **Causal** half perfectly but risks failing the **Evaluative** half.

  *   **Causal Fit:** AI policy involves decades of political contingency (chaotic/undefined probabilities). Deworming involves short-term health metrics (defined probabilities). This contrast works.
  *   **Evaluative Risk:** Comparing AI policy to deworming usually hinges on *expected value* differences (size of population affected), not *incommensurability*. Students will argue we know the value (well-being); we just don't know the probability. This collapses Evaluative Cluelessness back into Causal Cluelessness.
  *   **Required Modification:** To save the Evaluative half, you must tweak the AI case. Do not focus on existential risk magnitude. Focus on a trade-off between **existence and quality** (e.g., a future with billions of barely-worth-living lives vs. a smaller, flourishing population). This triggers the Non-Identity Problem or Repugnant Conclusion territory where values are structurally incomparable even if outcomes are known.
  *   **What it must lack:** Do not introduce uncertainty about whether AI beings are sentient. That is empirical uncertainty, which invites credences. The value conflict must remain even if sentience is granted. If you cannot secure this distinction, drop the Evaluative half and use the example solely to distinguish Causal Cluelessness from Empirical Risk.

  **Misconception map**

  1.  **"Cluelessness is Paralysis" (Head off at Step 2):** Students will argue that if we can't calculate EV, we can't act. *Defuse:* Distinguish *decision procedure* from *criterion of rightness*. Cluelessness blocks the procedure, not the truth of the theory. We still act on best guesses; we just acknowledge the guess isn't an EV calculation.
  2.  **"Wide Credences Absorb It" (Head off at Start):** The belief that undefined probabilities are just uniform distributions over wide ranges. *Defuse:* Show that for chaotic long-term chains, the range is unbounded or the sample space is unknown. You cannot normalize a distribution over an unknown set of outcomes.
  3.  **"It Is Moral Uncertainty" (Head off at Step 3):** The claim that not knowing values is just uncertainty about which moral theory is true. *Defuse:* Insist on the single-theory test. If a committed utilitarian still cannot compare Outcome A and B, it is evaluative cluelessness, not moral uncertainty.
  4.  **"It Attacks Consequentialism Specifically" (Head off at Step 4):** Students may think deontology escapes this. *Defuse:* Point out that rule-following also requires predicting consequences to select rules, or faces its own cluelessness about duty conflicts.
  5.  **"Stick to Near-Term Interventions" (Head off at Step 5):** The overcorrection that only measurable near-term acts are valid. *Defuse:* Note that near-term acts have long-term consequences too; cluelessness applies to almost everything, not just AI.

  **Poison:** The **"Wide Credences"** misconception. If left unaddressed at the start, students will treat every instance of cluelessness as a solvable estimation problem. The session becomes a technical debate about priors rather than a structural critique of action-guidingness.

  **Check for understanding**

  **Question:** "Imagine you know exactly what the world looks like in 100 years under Act A and Act B. You are also certain utilitarianism is true. You still cannot decide. Why?"

  **Good Answer:** Cites **Evaluative Cluelessness**. Mentions incommensurability, structural inability to compare the specific goods at stake, or unsettled moral status within the theory. Shows the block is in *valuation*, not prediction or theory selection.

  **Bad Answer:** Cites **Moral Uncertainty** ("maybe utilitarianism is false") or **Causal Cluelessness** ("maybe I don't really know the outcomes"). This shows they have collapsed the distinction back into standard uncertainty.

  **Watch For:** Students nodding during the Evaluative section but then using "probability" language to describe value conflicts in discussion. This indicates they have assimilated Evaluative Cluelessness into Moral Uncertainty despite your warnings.

  **Deliberate omissions**

  1.  **Solutions:** Do not teach satisficing, proxy rules, or institutional design responses. This session is about diagnosing the problem, not solving it. Solutions invite premature closure. Say: "We are mapping the hole, not building the bridge."
  2.  **Metaethical Foundations:** Do not dive into realism vs. anti-realism to justify incommensurability. It derails into metaphysics. Stipulate incommensurability as a working hypothesis for the sake of the argument.
  3.  **Subjective vs. Objective Rightness:** Keep this distinction in the background. Focus on *action-guidingness*. Explicitly state: "We are not asking what is right, but how we can know it." This prevents debates about moral luck from consuming the final ten minutes.
