  4. **Arthāpatti (Postulation):** Assuming understanding is the best explanation for zero-shot capabilities is plausible but remains speculative metaphysics.
  5. **Anupalabdhi (Non-perception):** Arguing understanding exists because we don't observe typical statistical failures is a weak negative proof.
  6. **Pratyakṣa (Perception):** Mere sensory perception of text tokens reveals nothing about the internal semantic states producing them.
  7. **Śabda (Testimony):** Taking the model's or developer's word for understanding is the least reliable due to hallucination and marketing bias.

  *(Note: The hypothetical readout ranks above standard Pratyakṣa because it perceives the internal cause rather than just the external effect.)*
