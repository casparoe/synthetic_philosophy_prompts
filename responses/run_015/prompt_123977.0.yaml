answer: |-
  **Project Title:** The Diachronic Aggregation Problem: Harsanyi's Theorem and the Metaphysics of the Temporal Self

  **Project Summary**
  This project proposes a formal reconstruction of Harsanyi's Aggregation Theorem, transposing its axiomatic structure from the inter-personal domain of social choice to the intra-personal domain of diachronic decision-making. Conventionally, the theorem demonstrates that if individual preferences satisfy von Neumann-Morgenstern rationality and social preferences satisfy Pareto efficiency and Independence of Irrelevant Alternatives, social welfare must be a weighted linear sum of individual utilities. This reading treats the "individuals" as distinct ontological entities. This project interrogates what occurs when the "individuals" are redefined as temporal stages of a single agent. The central aim is to determine whether the theorem's validity in this context provides a formal basis for personal unity or whether the axioms themselves covertly presuppose the metaphysical unity they are meant to derive.

  **The Research Question**
  Does the intra-personal application of Harsanyi's Aggregation Theorem substantiate the existence of a unified agent over time, or does it reveal that the Independence axiom is incoherent without a prior metaphysical commitment to a chooser distinct from their preferences?

  Standard interpretations of the theorem remain siloed within social choice theory, where the distinctness of voters is taken as a given. Conversely, decision theory handles time inconsistency through discounting models or multiple-selves frameworks, but rarely utilizes aggregation theorems to bridge the gap between stages. Consequently, the structural analogy between "society" and "temporal self" remains formally unexplored. If the theorem holds intra-personally, it suggests the "self" is merely a committee of temporal stages aggregated via a utilitarian function. If the theorem fails, it suggests that the axioms required for aggregation (specifically Independence) rely on a notion of agency that cannot be constructed solely from conflicting temporal preferences.

  **Methodology**
  The research will proceed through strict axiomatic analysis and formal reconstruction, devoid of empirical reliance on neuroscience or psychology. The project will not investigate how agents *do* behave, but rather what conditions must obtain for the formal machinery of rational choice to remain consistent when applied diachronically.

  1.  **Axiomatic Translation:** The first phase involves mapping the primitive terms of Harsanyi's theorem onto a temporal framework. "Individuals" become "time-slices"; "Social Welfare Function" becomes "Life-Course Preference Ordering." The Pareto condition will be reinterpreted as a requirement that if all temporal stages prefer outcome A to B, the agent's overall preference must reflect this.
  2.  **Stress-Testing Independence:** The core analytical work will focus on the Independence of Irrelevant Alternatives (IIA). In social choice, IIA prevents voting cycles by ensuring pairwise comparisons depend only on those pairs. In a diachronic context, this requires that a preference between two life paths remains invariant regardless of other available life paths, even if those paths affect future preference structures. I will construct formal models where preferences change endogenously over time to test if IIA can be satisfied without assuming a "meta-agent" standing outside the temporal flow.
  3.  **Metaphysical Implication Analysis:** The final phase will evaluate the ontological commitments of the formal results. If the aggregation holds, does it reduce the self to a fiction of aggregation? If it fails, does the failure point to the necessity of a transcendental unity of apperception (or a functional equivalent) to ground the axioms?

  **Expected Outcomes and Success Criteria**
  A successful conclusion will take one of two defensible forms:

  *   **The Reductionist Result:** A demonstration that the axioms hold intra-personally only if the agent treats their future selves as distinct entities with fixed utilities. This would imply that rational planning requires a form of internal utilitarianism, validating the "multiple selves" model but demanding a specific aggregation rule for personal welfare.
  *   **The Unity Result:** A demonstration that the Independence axiom cannot be satisfied by a sequence of distinct preference orderings unless those orderings are constrained by a higher-order unity. This would suggest that Harsanyi's theorem cannot generate personal identity; rather, it presupposes it. The "failure" of the theorem in this context would thus be a positive proof that rational agency requires a metaphysically unified chooser.

  **Failure Conditions**
  The project would be considered to have failed if the formal translation proves trivial—for instance, if the intra-personal case collapses immediately into standard dynamic consistency models without generating new insights about aggregation. Similarly, if the axioms prove so flexible that they can accommodate any temporal preference structure without constraint, the theorem loses its normative force, rendering the inquiry vacuous. Finally, if the analysis devolves into semantic debates regarding the definition of "self" without remaining grounded in the formal properties of the utility functions, the project will not meet its methodological standards.

  **Scope and Feasibility**
  This project is designed for a six-month fellowship. The scope is deliberately narrow: it does not seek to solve the problem of personal identity generally, nor does it attempt to overhaul decision theory. It focuses exclusively on the portability of one specific theorem.

  *   **Months 1–2:** Formalization of the diachronic axioms and literature review of existing multiple-selves models to ensure distinctness from current discounting literature.
  *   **Months 3–4:** Derivation of proofs and counter-examples regarding the Independence condition in temporal contexts.
  *   **Months 5–6:** Synthesis of formal results into philosophical argumentation and drafting of the final manuscript.

  The feasibility rests on the fact that the mathematical machinery of Harsanyi's theorem is well-established; the novelty lies entirely in the interpretation of the variables. No new mathematics need be invented, only existing theorems rigorously reinterpreted. The risk lies in the philosophical interpretation, which requires careful articulation to avoid conflating formal constraints with metaphysical truths. However, by maintaining a strict separation between the formal model and the ontological conclusion, the project can deliver a precise contribution to the philosophy of action and social choice theory.

  **Significance**
  By treating the temporal self as a limit case of social choice, this project illuminates the hidden metaphysical assumptions underlying rational choice theory. It challenges the disciplinary boundary between social welfare and individual rationality, suggesting that the logic of aggregation may be more fundamental than the distinction between the one and the many. Whether the result affirms the self as a collective or as a unity, the inquiry clarifies the formal prerequisites of agency itself.
