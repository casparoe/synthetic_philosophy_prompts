answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** 1 May 2024
  **SUBJECT:** Decision on May Allocation Applications

  **Purpose**
  At our May meeting, we must allocate £60,000. We have three competing bids: a hospice-at-home service (certain benefit), a long-shot existential risk research group (high variance, specific claim), and a second research group proposing a standing policy rule (high variance, systemic approach). This memo recommends we **adopt a capped version of the standing-rule proposal**, allocating 10% of our annual income to a high-variance fund and directing the balance of this tranche to the hospice.

  **The Legal Constraint: "Reasonably Ascertained"**
  Our deed requires us to apply income where it will do the "most good that can be reasonably ascertained." This phrase is not merely decorative; it is a boundary condition on our decision-making.

  The hospice bid satisfies this condition. We can verify the cost of a nurse and the value of palliative care with high confidence. The specific research bids do not. They rely on probabilities (1 in 10,000 to 1 in a million) that cannot be tested or verified by any method available to us. To treat these numbers as factual inputs for a calculation is to confuse a model with reality. Our mathematician trustee is correct: untestable probabilities are vulnerable to manipulation. If we fund the research bids *as requested*, we risk violating the deed by acting on speculation rather than ascertainment.

  However, "reasonably ascertained" does not require certainty. It asks what is reasonable given the stakes. Ignoring low-probability, high-impact risks entirely could also be seen as unreasonable, given that we already purchase insurance and have funded pandemic preparedness. The deed allows us to manage risk, not merely avoid it.

  **Case vs. Policy: Addressing the "Mugging"**
  The core philosophical difficulty here is known colloquially as "Pascal's Mugging": if we always follow the highest expected value, a claimant can demand unlimited resources by positing a sufficiently large impact, however improbable.

  The third application attempts to solve this by shifting the unit of analysis from the *case* to the *policy*. It argues that we should not judge the specific probability of one group succeeding, but rather the value of maintaining a portfolio of such attempts.
  *   **Does this answer the worry?** Partially. It prevents us from being held hostage by a single untestable number. By capping the exposure (at 10%), we limit the downside if the probabilities are indeed invented. It treats the funding not as a payment for a specific result, but as an investment in a discovery process.
  *   **Does it beg the question?** It does not solve the epistemic problem (we still cannot verify the probabilities), but it makes that ignorance manageable. It acknowledges that while we cannot ascertain the value of a *single* grant, we can ascertain the value of *diversification* in high-uncertainty environments. This is standard scientific practice: we fund multiple lines of inquiry because we cannot predict which will yield breakthroughs.

  **Recommendation**
  I propose we **adopt the standing-rule proposal, capped at 10% of annual spendable income**, with the following implementation for this cycle:

  1.  **High-Variance Allocation:** We set aside £18,000 (10% of our £180,000 annual income) for a "Long-Term Risk Fund." This money is available for the two research groups, but they must bid against each other for this capped amount, rather than receiving £60,000 each. This forces them to compete on efficiency rather than magnitude of claim.
  2.  **Immediate Allocation:** The remaining £42,000 of this £60,000 tranche is awarded to the hospice service. While this is £18,000 short of their request, it secures the "reasonably ascertained" good while respecting the policy cap. (Note: As our semi-annual distribution is £90,000, the hospice may apply for the remaining £18,000 from the unallocated balance of this distribution if their need is urgent).
  3.  **Review Point:** This policy will be reviewed in three years. We will assess whether the High-Variance Fund has produced actionable knowledge or viable projects. If the fund merely accumulates without generating verifiable intermediate milestones, the policy will be terminated.

  **Conclusion**
  This approach respects the mathematician's skepticism by refusing to validate untestable numbers on a case-by-case basis. It respects the physicists' intuition that tail risks matter, by creating a systematic, capped exposure. Most importantly, it satisfies the deed: we are ascertaining that a *policy* of diversification is valuable, even if we cannot ascertain the outcome of a *specific* grant.

  I look forward to discussing this at the meeting.
