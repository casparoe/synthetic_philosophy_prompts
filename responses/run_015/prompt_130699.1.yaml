      2.  **(2) vs. (5):** This is a direct definitional clash regarding "silence." (2) defines it as a "negative document"; (5) defines it as "absence."
      3.  **(1) vs. (5):** If archives produce power (1), relying on them as the only truth (5) undermines the critique in (1).
      4.  **(3) vs. (4):** This is the *motivation* for the conflict, but logically, one can hold both as a paradox to be managed. The *resolution* creates the conflict in (3) vs. (5).

