prompt: |-
  my friend thinks she's basically running Mill's harm principle but I'm not convinced she's being consistent. her calls so far: banning a speaker who advocates violent overthrow, yes; firing a historian for denying the holocaust in class, no; breaking up a protest blocking an ambulance, yes; punishing a private conversation where someone calls a religion immoral, no; removing posts that doxx abortion providers, yes; protecting a biologist who argues racial IQ gaps are genetic, yes (she'd protect it); allowing a rally with racial slurs but no violence, yes but barely. heres the new one: a public university pulls funding from a student publication that runs essays in the critical psychiatry tradition—first-person accounts of quitting meds, claims that diagnosis is often social control, but every piece ends with "consult your clinician." the admin says this causes indirect harm to vulnerable people. do you think my friend supports the pull? I want a committed take: what's the actual principle she's running, what's at least one other principle that fits her track record just as well, what does each say about the funding cut, which earlier verdict is the closest analog, and if you had to pick one hypothetical case to add that'd actually split the rules, what'd it be? don't just list options—pick one rule as your best read and defend it. and be honest about the part where you're least sure.
