  4.  **Connecting Metaphysics to Practice:**
      *   *Does Patent Law require Realism?* It acts *as if* there is a stable essence (the genotype). If the genotype drifts, the patent might be invalid (lack of enablement or written description). This looks like Aristotelian essentialism (substance + form).
      *   *Does it require Nominalism?* One could argue the patent creates a legal fiction (a nominal kind). But the law appeals to *natural* facts (does the sequence exist? does it work?) to validate the fiction. So pure nominalism is weak.
      *   *Trope Theory:* This is interesting. The patent protects *this* specific arrangement of matter. However, the protection extends to *equivalents*. This suggests a similarity class of tropes, not just one particular.
