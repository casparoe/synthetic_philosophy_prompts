      *   *Nominalism:* Only particulars exist. Names/kinds are just labels. "Strain X" is just a name we give to a collection of similar bacteria. Patent law needs stability, but does it need *real* universals? Maybe just practical similarity.
      *   *Conceptualism:* Kinds exist in the mind. They are cognitive tools. Patent claims are mental constructs defined by legal language. The "invention" is the concept defined by the claim.
