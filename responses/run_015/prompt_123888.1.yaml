  3.  **Analyzing Patent Practice (The "Data"):**
      *   *Case Law:* *Diamond v. Chakrabarty* (1980) is the landmark. "Anything under the sun that is made by man."
      *   *Requirements:* Novelty, Non-obviousness, Utility, Enablement/Written Description.
      *   *Deposit Requirements:* Budapester Treaty. You must deposit a sample. Why? Because words aren't enough to define the "kind."
      *   *Claims:* Usually define the invention by structure (sequence) or function (what it does).
