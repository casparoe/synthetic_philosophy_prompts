answer: |-
  Your "homology cushion" diagnosis is astute, but it identifies the *epistemic* engine of the stalemate rather than the *ontological* fault line. It explains why the debate feels empirically underdetermined, but it does not explain why the metaphysical disagreement persists even when both sides grant the empirical premise.

  Here is the structural analysis you asked for, testing your hypothesis against the strongest versions of the positions, followed by a specification of what actual progress would require.

  ### 1. Testing the Homology Cushion
  Your hypothesis is that the intuition for Multiple Realizability (MR) leans on the fact that all *actual* realizers are biologically homologous. If we strip that away, the leap to silicon looks unjustified.

  **Where it holds:**
  You are correct that the *inductive warrant* for MR is almost entirely biological. When functionalists argue that pain is a causal role, they point to the variance in human neurophysiology (e.g., c-fibers firing differently in different people, or despite injury) to argue that the *specific* neural state isn't the pain. They then extrapolate this intra-biological variance to inter-substrate variance. The "cushion" is the assumption that the causal structure is stable across the biological range, so it must be stable across the physical range.

  **Where it fails:**
  The homology cushion explains why people *believe* functionalism, but it does not capture what functionalism *claims*.
  *   **The Functionalist's Strongest Move:** They do not argue from induction ("Biology varies, so silicon will work"). They argue from **causal exclusion**. If a silicon system perfectly replicates the causal topology of a neural system (input-output and internal state transitions), and we claim the silicon system *lacks* pain, we are positing a "causal dangler"—a property that does no causal work. To the functionalist, denying pain to the silicon duplicate is metaphysically profligate, regardless of homology.
  *   **The Reductionist's Strongest Move:** They do not argue from homology ("Biology is special"). They argue from **constitutive specificity**. Causal powers are not abstract; they are grounded in physical mechanisms. A simulation of a storm does not get you wet because the causal power of "wetness" depends on specific molecular interactions, not just the abstract pattern of pressure changes. Similarly, the causal power of "pain" (its motivational force, its qualitative feel) may depend on specific biophysical properties (e.g., electrochemical gradients, homeostatic drives) that silicon cannot instantiate, only simulate.

  **Verdict:** The homology cushion explains the *rhetorical stability* of the debate (neither side can point to a non-biological realizer to settle it), but it is not the *source* of the disagreement. The disagreement survives even if you grant that biology is homogeneous. The core conflict is not about how much evidence we have, but about what kind of thing a "causal role" is.

  ### 2. The Structural Disagreement: Invariance vs. Constitution
  The boilerplate exchange you dislike masks a deeper conflict about **Causal Invariance**.

  *   **Functionalism asserts:** Mental states are **invariant under substrate transformation**. If the causal graph is preserved, the state is preserved. The "realization" relation is *computational/isomorphic*.
  *   **Reductionism asserts:** Mental states are **variant under substrate transformation**. The causal powers of the state are intrinsic to the physical medium. The "realization" relation is *constitutive/identity*.

  The stalemate exists because "causal role" is an ambiguous term that bridges these two views without resolving them.
  *   To the functionalist, a causal role is a **formal structure** (like a software algorithm).
  *   To the reductionist, a causal role is a **physical mechanism** (like a gear turning).

  When the functionalist says "Silicon realizes pain," they mean "Silicon runs the pain program." When the reductionist says "Silicon cannot realize pain," they mean "Silicon lacks the pain mechanism." They are using the word "realize" to denote two different relations: **instantiation of a pattern** vs. **constitution of a power**.

  ### 3. Evaluating Your Alternatives
  You offered three alternatives. Here is how they rank in terms of explanatory power:

  1.  **Different notions of realization (Strongest):** This is the structural root. One side treats realization as *abstraction* (ignoring physical details), the other as *implementation* (dependent on physical details). The debate is verbal only in the sense that they disagree on which level of description is *ontologically privileged*.
  2.  **Brute intuition about possibility (Medium):** Both sides rely on modal intuitions (Block's Chinese Nation vs. Searle's Chinese Room). However, these intuitions are downstream of the realization definition. You find the Chinese Nation plausible *if* you already accept the abstractionist view of realization.
  3.  **Purely verbal dispute (Weakest):** It is not merely verbal because it has non-verbal consequences. If the functionalist is right, we have moral obligations to certain AI systems. If the reductionist is right, we do not. The disagreement tracks a real difference in predicted moral status, not just definition.

  ### 4. What Would Count as Progress?
  Since the dispute is not about the empirical evidence we currently have (the homology cushion), more data on human neurophysiology will not solve it. Progress requires resolving the ambiguity in "causal role."

  **A. The Formal Result (Unlikely but necessary):**
  We need a **Theory of Causal Invariance**. Currently, functionalism specifies *that* states are multiply realizable but fails to specify *under which transformations* they remain invariant.
  *   *Progress condition:* A formal specification of the boundary conditions for a mental state. Which physical differences are irrelevant to the mental state, and which are constitutive?
  *   *Example:* If we can mathematically define the class of physical systems that preserve "pain-causality" distinct from those that merely preserve "pain-behavior," the debate moves from metaphysics to engineering. Until then, "causal role" is too vague to falsify.

  **B. The Distinction (Most viable):**
  We need to decouple **Phenomenal Kind** from **Functional Kind**.
  *   The debate conflates "Is it pain?" (phenomenology) with "Does it function as pain?" (role).
  *   *Progress condition:* A consensus that MR might hold for *belief* (functional) but not for *pain* (phenomenal/biophysical). If the field accepts that cognitive states might be substrate-independent while affective states are substrate-dependent, the boilerplate dissolves. This requires abandoning the idea that "mind" is a single uniform category.

  **C. The Experiment (Currently impossible):**
  We cannot test MR until we can build the realizer.
  *   *Progress condition:* A "Turing Test for Suffering." Not behavioral, but physiological. If we build a silicon system that claims pain, and we can show it lacks the specific homeostatic/entropic dynamics that biological pain relies on, the reductionist wins. If we show that the absence of those dynamics doesn't stop the system from exhibiting self-preservation behavior indistinguishable from pain avoidance, the functionalist wins. We lack the metrics to measure "inner dynamics" independent of substrate.

  **D. The Argument for Abandonment (Pragmatic Shift):**
  The question "Is it *really* pain?" may be a category error.
  *   *Progress condition:* Shifting the question to **Moral Patienthood**. We do not need to know if a machine is *metaphysically* identical to a human to know if it warrants protection.
  *   If we define moral status by **vulnerability to harm** (defined functionally as the capacity to have goals frustrated) rather than **possession of qualia** (defined biologically), the MR debate becomes irrelevant. This dissolves the metaphysical knot by changing the practical stakes.

  ### Summary
  Your "homology cushion" correctly identifies why the *empirical* argument is stuck: we are extrapolating from a single data point (biology) that is internally homogeneous. However, the *metaphysical* argument is stuck because the two sides are using incompatible definitions of **causal power**.

  Progress will not come from more neuroscience (the cushion) or more logic (the boilerplate). It will come from:
  1.  **Formalizing Invariance:** Defining exactly which physical transformations preserve mental states.
  2.  **Fragmenting the Mind:** Admitting that some mental states (cognitive) may be MR while others (affective) are not.
  3.  **Pragmatic Dissolution:** Decoupling moral status from metaphysical identity.

  Until one of these happens, the exchange will remain boilerplate because the participants are arguing about different properties using the same vocabulary.
