answer: |-
  Dear friend, since we stalled because we never agreed on what a solution would actually do, I am writing down the specification for an account of ontology identification under inaccessible information before we try to solve it again. The primary purpose is fixed: the account must be usable from inside the domain by a bounded agent acting in finite time, and it must be capable of telling two disagreeing agents whether their disagreement is substantive or merely verbal. This functional constraint is non-negotiable because any account that requires a god's-eye view or infinite processing power is useless for the very agents trying to employ it, and without it we cannot resolve the practical stalemate that sparked our argument.

  The account must handle three specific cases of informational gaps. First, it must resolve the reflexive case where whether a gap closes depends on which inventory the agent adopts, such as when one candidate ontology says a discriminating probe is constructible while the other says it is not. This is non-negotiable because this is precisely where our argument stalled, and any account that cannot handle self-referential constraints on evidence is incomplete for embedded agents. Second, it must handle the case of two agents with disjoint but individually penumbral access who disagree, meaning that while neither can settle the question alone, pooling their access would close the gap. This is required because ontology is often a communal project, and failing to recognize that pooled access converts a gap into a settled fact would falsely label substantive disagreements as verbal or vice versa, though one could argue this is a prejudice of social epistemology rather than strict metaphysics. Third, it must handle candidates that agree on every probe anyone can actually run but disagree about what would happen under a probe only one of them permits. This is required to distinguish between empirical equivalence and ontological divergence, and while a strict verificationist might call this a prejudice, it is non-negotiable for any realist who believes theories can differ in meaning even when data matches.

  The account must maintain several distinctions without collapsing them. It must distinguish the invisible from the merely unobserved, because conflating what cannot be seen with what has not yet been seen destroys the difference between absolute gaps and penumbral ones, and this is non-negotiable for clarity. It must distinguish gaps that are the agent's fault from gaps in the world, because blaming the world for the agent's limited sensors leads to fatalism, whereas blaming the agent suggests engineering solutions, which is a pragmatic necessity if not a metaphysical truth. It must distinguish identification for one agent from identification for a community that pools its access, because solipsistic ontology fails to explain successful coordination, and while individualists might dispute this, it is non-negotiable for a social account. Finally, it must distinguish settling a question from merely deciding how to act while it is open, because acting as if a fact is true is not the same as knowing it is true, and collapsing this is a prejudice of radical pragmatism that we should reject if we care about truth.

  The account must not contradict two specific results. It must allow that permanent underdetermination can happen, because denying absolute gaps is dogmatic and contradicts the possibility of logically distinct worlds producing identical histories, which is non-negotiable for logical coherence. It must also acknowledge that a verdict reached only in the limit is not a verdict an agent ever has on hand, because an agent acting in finite time cannot wait for infinity, and this is non-negotiable given our fixed purpose of finite usability. Behind each of these constraints is the demand that the theory respect the limitations of the embedded agent while still preserving enough realism to make disagreement meaningful.

  I suspect there is a tension between the requirement that the account be usable by a bounded agent in finite time and the requirement that it acknowledge asymptotic gaps where convergence happens only in the limit. If a question is only settled in the limit, a bounded agent cannot know the answer now, yet the account must tell them if their disagreement is substantive. Satisfying both means the account must label a disagreement as substantive even when neither agent can currently verify it, which risks violating the spirit of finite usability. If I had to choose the single requirement that does the most work in ruling out candidates, it is the constraint that the account be usable from inside the domain by a bounded agent acting in finite time. This requirement alone eliminates any theory that relies on infinite inquiry or external validation, forcing the ontology to be tethered to what can be constructed and processed now.

  When we test the five positions we discussed against this list, the realist who lets identification outrun evidence fails the finite usability constraint because they posit facts that cannot be verified in time. The verificationist who ties ontology to accessible difference fails the reflexive case because they cannot handle probes whose existence depends on the ontology being tested. The pragmatist who weighs the costs of getting it wrong collapses the distinction between settling a question and deciding how to act, which we marked as non-negotiable. The structuralist who identifies only up to structure struggles with the case of candidates that agree on probes but disagree on permitted probes, as they often treat such differences as irrelevant. The learning-theoretic picture that settles for identification in the limit contradicts the result that a limit verdict is not a verdict on hand, leaving the agent without guidance in the present. I hope this specification gives us the common ground we lacked when we stopped talking.
