answer: |-
  I initially considered dismissing this discrepancy as mere historical inertia or crude economic speciesism, but I set those aside to defend a reading of the practice as a form of epistemic-administrative coherence where enforceability constrains obligation. To begin with a necessary correction on the legal landscape you described, while the UK Animal Welfare Sentience Act 2022 does formally recognize decapods and cephalopods as sentient beings, it does not automatically overwrite retained EU slaughter regulations like Council Regulation 1099/2009, which still exclude invertebrates from mandatory stunning requirements, meaning the statutory recognition creates a duty to consider their welfare rather than an immediate operational ban on ice slurries. The implicit theory that renders this regulatory asymmetry coherent is not a denial of decapod sentience but a commitment to what might be called verificationist legal positivism, where moral obligations are contingent upon the state's capacity to audit compliance rather than upon the intrinsic moral status of the subject alone. On this view, the vertebrate proxy is legitimate not because it is biologically perfect but because it functions as a reliable heuristic for administrative efficiency, presupposing that the moral cost of systematic false negatives excluding sentient invertebrates is outweighed by the administrative impossibility of verifying insensibility in distributed nervous systems. For this substitution to hold despite its systematic error, the theory must assume that phylogenetic proximity is the only available prior probability strong enough to justify the expense of regulation, effectively treating the lack of a centralized brainstem not as evidence of non-sentience but as evidence of non-regulatability.

  This leads directly to your second concern regarding the auditable indicator, where the practice coherently allows the moral boundary to be drawn by its instruments because it operates on the principle that an unenforceable right is no right at all. The silence on decapods reflects a measurement gap that the theory elevates to a moral constraint, presupposing that no obligation can be imposed without a binary, observable marker like the loss of ventilatory reflexes, which decapod ganglia do not provide. Consequently, the regulatory framework treats the inability to measure unconsciousness as functionally equivalent to the absence of a moral claim, not because the claim is nonexistent, but because the legal system cannot process ambiguity. Regarding your third point on probability, the practice relies on an evidential reading of probability rather than a metaphysical one, using confidence levels as a threshold for action rather than assigning fractional moral status. The law does not grant a crab half-protection because there is a fifty percent chance it feels pain; rather, it requires a high degree of epistemic confidence before triggering the full switch of protection, meaning probability does the work of risk management rather than ontological grading. This explains why the ice-water slurry is permitted despite its cruelty relative to percussive stunning, as the method presupposes that the badness of death is located primarily in the intensity and duration of the terminal experience rather than in the deprivation of future life itself. If the moral wrong were primarily about deprivation, the method of killing would matter less than the fact of killing, but since the regulation focuses on stunning, it implies that suffering during the process is the primary harm to be mitigated, provided the subject is recognized as capable of suffering in a verifiable way.

  If the taxonomic proxy were replaced by a genuine precautionary view where credible sentience of any degree triggers protection, the regulatory changes required would be substantive rather than merely sentimental, shifting the burden of proof from the animal to the operator. Under the current system, the regulator must prove sentience to justify protection, but a precautionary framework would require operators to prove humane treatment regardless of taxonomic class, mandating the development of new stunning technologies specifically designed for distributed nervous systems rather than relying on vertebrate models. This would necessitate new audit metrics that do not rely on brainstem reflexes, perhaps focusing on behavioral cessation or neurochemical markers, and it would likely require a shift from prescriptive rules listing approved methods to performance-based standards requiring demonstrated insensibility before exsanguination or thermal shock. Ultimately, the coherence of the current practice rests on a trade-off between moral completeness and administrative feasibility, and moving to a precautionary model would demand a willingness to absorb the higher costs of verifying welfare in organisms where the physiological signals of suffering are opaque to our current instruments.
