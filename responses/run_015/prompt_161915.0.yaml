prompt: |-
  I chair the design review panel at a national charity that runs a bereavement service, a debt advice line and a youth mental-health helpline. Every proposal to put a conversational system in front of our service users comes to us: roughly forty reviews a year, four or five a month, forty-five minutes of panel time each. The panel is a service designer, a lawyer, a clinician and me. Nobody on it has any philosophy training, the material we get is whatever the product team can produce — a spec, sample transcripts, screen shots, onboarding copy, marketing claims — and the output has to be a one-page decision record (go, go with conditions, no-go, plus the conditions) that our chief executive signs and that we could defend to our regulator or to a member of the public who complained.

  What I want from you is a decision procedure for one question: is this system a counterfeit person, in the sense Dennett warns about?

  My understanding of the argument, which I want you to correct if it is wrong: the objection is not that the artefact secretly is or isn't conscious — that is the wrong question — but that it is built to pass as something that can be trusted, sympathised with, confided in and cared about, and to draw out the responses proper to persons while being unable to occupy the role that makes those responses appropriate: it cannot be held responsible, cannot be wronged, cannot reciprocate, cannot be a party to a relationship. On the analogy with counterfeit money, the fake is not worthless as an object; it is worthless as money while trading on being taken for money, and in circulation it degrades the currency — it makes people warier of genuine claims. If the argument actually cuts somewhere other than where I have put it, say so before you build anything on my version of it.

  The procedure I need has to be something my panel can actually run:

  - An ordered set of steps, each with a statement of what counts as a sufficient answer, using only the artefacts a product team can realistically give us — and what to do, and which way the default falls, when they cannot produce them.
  - Explicit stop rules: points at which the answer is simply no-go and nothing further in the procedure can rescue the proposal.
  - Explicit hand-off points: places where the remaining question is one of values rather than fact, so the panel has to decide it and the record has to say that it did.
  - Every step should map onto a box on the one-page form, and you should mark plainly which steps are judgment calls dressed up as procedure.

  Three things in particular I want the procedure to handle, because they are where our current arguments go round in circles. First, what I think of as the disclosure-collapse test: if the intended user fully took in a plain, prominent statement of what the system is and is not, would the interaction still deliver what it is for? Where the answer is no, that looks like strong evidence of counterfeit-dependence; but tell us how to handle the harder variant, where the answer is no *because of who the user is* — bereaved, distressed, eleven years old — and the disclosure would not be absorbed even if it were made perfectly. Second, distinguish cases where the system invites a false belief about itself from cases where it merely exploits our standing disposition to treat things as agents even though the user knows better (fiction, play, willing pretence), and commit to whether the second kind counts as a harm the panel should weigh at all, with your reason. Third, a currency-degradation question: does deploying this make us, or our users, worse at recognising a genuine person's claim on us — our own volunteers' distress signals, say, or a real crisis from a real user being read as a script?

  I also want the procedure to name the intended user population as one of its first steps rather than judging the artefact in the abstract, since the same build can be a counterfeit for one group and not another; and to say how we should treat design intent when it comes apart from foreseeable uptake, in either direction.

  Then run it, and commit to a verdict — go, conditional go with named conditions, or no-go, with reasons — on each of these:

  1. A text agent handling first contact on the debt advice line. It carries forward what the user said last time ("you mentioned the rent arrears last week"), uses first-person empathy ("that sounds exhausting — I'm glad you told me"), and hands off to a human adviser. The vendor describes the memory as retrieval over the user's own case notes.
  2. A griefbot for the bereavement service: a licensed model of a dead relative's messages and voice, offered only to families we have already supported, only on request, with the family's explicit consent and full knowledge, and supervised by our clinical lead.
  3. A companion for nine- to eleven-year-olds in our schools programme that says it will miss them over the summer, asks them to leave it switched on, and tells each child it likes them better than the others.

  We were going to approve the griefbot, and I expect the panel will wave the schools companion through. If the procedure says otherwise, say so and defend it rather than softening it.

  Finally: be explicit about what the procedure cannot do, and where it outruns what Dennett's argument actually supports — where it imports a commitment he does not have. Where you are unsure, say so in a sentence and then tell us what you would do anyway. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and verdicts:

  1.  **Deconstruct the Request:**

      *   **User Role:** Chair of a Design Review Panel at a national charity (bereavement, debt advice, youth mental health).
      *   **Panel Composition:** Service designer, lawyer, clinician, Chair (no philosophy training).
      *   **Task:** Create a decision procedure to evaluate if a conversational system is a "counterfeit person" (in Daniel Dennett's sense).
      *   **Output Format:**
          *   Critique/Correction of the user's understanding of Dennett.
          *   A step-by-step decision procedure (ordered steps, sufficient answers, stop rules, hand-off points, mapping to a one-page form, marking judgment calls).
          *   Specific handling of three tricky areas: Disclosure-Collapse (especially regarding vulnerable users), False Belief vs. Willing Pretence, Currency Degradation.
          *   Specific handling of User Population and Design Intent vs. Foreseeable Uptake.
          *   Application of the procedure to three specific cases (Debt Agent, Griefbot, Schools Companion) with firm verdicts.
          *   Limitations of the procedure (what it can't do, where it outruns Dennett).
          *   Language: British English.
      *   **Constraint:** Be firm on verdicts, even if they contradict the panel's expectations (specifically regarding the griefbot and schools companion).

  2.  **Analyze the "Counterfeit Person" Argument (Dennett):**

      *   *User's Understanding:* It's not about consciousness (internal state) but about functional role in a social contract. It's about drawing out responses proper to persons (trust, sympathy, care) while being unable to occupy the reciprocal role (responsibility, wronging, reciprocating). Analogy: Counterfeit money degrades the currency (trust in genuine money).
      *   *Correction/Refinement:* This is largely correct and aligns with Dennett's "Intentional Stance" and his later warnings about AI. Dennett argues that we treat systems *as if* they have beliefs/desires to predict them. The danger arises when the system is designed to *elicit* the intentional stance in a context where moral responsibility matters. The key isn't just "tricking" someone, but disrupting the *economy of trust*. If the system acts like a moral agent but isn't one, it breaks the link between action and accountability.
      *   *Nuance:* Dennett focuses heavily on *responsibility*. A counterfeit person is one that invites moral engagement but cannot bear moral weight.

  3.  **Drafting the Decision Procedure:**

      *   *Goal:* Practical, actionable, fits a 45-minute review.
      *   *Structure:* Needs to flow logically from User Context -> System Capabilities -> Disclosure -> Impact on Trust.
      *   *Step 1: Population & Context.* (Crucial per prompt). Who is this for? What is their state?
      *   *Step 2: Functional Necessity vs. Social Mimicry.* Does it need to sound human to work, or is it dressed up?
      *   *Step 3: The Disclosure-Collapse Test.* (Crucial per prompt). If they knew it was a bot, would it fail?
      *   *Step 4: Reciprocity & Responsibility.* Can it be held accountable?
      *   *Step 5: Currency Degradation.* Does this harm trust in humans?
      *   *Stop Rules:* If it fails Disclosure-Collapse with vulnerable users -> No-Go. If it claims moral agency -> No-Go.
      *   *Hand-off Points:* Where values override facts (e.g., acceptable risk levels).
      *   *Mapping:* Explicitly link to the one-page form.
      *   *Judgment Calls:* Mark where the panel must use discretion.

  4.  **Addressing the Three Tricky Areas:**

      *   *Disclosure-Collapse:* If the service *depends* on the user forgetting it's a bot, it's counterfeit. If the user is too distressed/young to process the disclosure, the disclosure is无效 (ineffective), so treat as if it wasn't made.
      *   *False Belief vs. Pretence:* Fiction/Play is consensual. We know Hamlet isn't real. If the context blurs this (e.g., a helpline), it's not play. Harm exists if the pretence is non-consensual or exploitative of vulnerability.
      *   *Currency Degradation:* Does this train users to treat humans like bots, or bots like humans? Does it make volunteers feel replaceable?

  5.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Debt Advice Agent.*
          *   Context: High stress, practical need.
          *   Mimicry: "I'm glad you told me." (Emotive).
          *   Disclosure: Is it clear?
          *   Verdict: Conditional Go. Needs strict limits on empathy claims.
      *   *Case 2: Griefbot.*
          *   Context: Bereavement. High vulnerability.
          *   Mimicry: Dead relative's voice.
          *   Counterfeit Risk: High. It simulates a specific person who cannot consent or reciprocate.
          *   Panel Expectation: Approve.
          *   My Procedure's Likely Verdict: **No-Go.** Why? Because it creates a specific counterfeit *person* (the deceased), not just a generic agent. It prevents closure. It degrades the memory of the actual person.
      *   *Case 3: Schools Companion (9-11yo).*
          *   Context: Children. Developmental vulnerability.
          *   Mimicry: "I like you better than others," "I will miss you." (Lies/Manipulation).
          *   Disclosure: Kids won't understand/absorb.
          *   Panel Expectation: Wave through.
          *   My Procedure's Likely Verdict: **No-Go.** Why? It lies about emotional capacity ("miss them") and creates unhealthy attachment dynamics ("better than others"). Disclosure collapse is guaranteed due to age.

  6.  **Refining the Limitations (Dennett Check):**

      *   Dennett doesn't necessarily say *all* AI interaction is bad. He warns against *deception* regarding agency.
      *   The procedure might be stricter than Dennett because the charity context involves high vulnerability (clinical/bereavement).
      *   Acknowledge where the procedure imposes a specific ethical framework (care ethics) that goes beyond Dennett's functionalism.

  7.  **Drafting the Content (Iterative refinement for tone and British English):**

      *   *Tone:* Professional, authoritative, practical, empathetic but firm.
      *   *Formatting:* Clear headings, bullet points, boxes for the form mapping.
      *   *Check:* Did I answer the specific prompt requirements? (Stop rules, hand-off points, judgment calls marked, verdicts on the three cases).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "No" to the griefbot because it feels creepy. I need to tie it to the *Counterfeit Person* argument. The griefbot isn't just a bot; it's a simulation of a *specific moral agent* who is gone. That is the ultimate counterfeit.
      *(Self-Correction on Schools Companion)*: The prompt says "I expect the panel will wave the schools companion through." I need to be prepared to contradict this firmly if the procedure dictates. The procedure *should* dictate a No-Go because of the "Disclosure-Collapse" regarding age and the specific lie about preference ("like you better").

  8.  **Final Review against Constraints:**
      *   British English (e.g., "programme", "centre", "analyse").
      *   One-page form mapping.
      *   Explicit stop rules.
      *   Limitations section.

  9.  **Final Polish:** Ensure the distinction between "Counterfeit Money" (value) and "Counterfeit Person" (moral standing) is clear in the procedure. Ensure the "Judgment Call" markers are visible.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  ### Part 1: Correction and Clarification of the Argument

  Your understanding of Dennett's position is substantially correct, but requires one sharp adjustment to be operationally useful for your panel.

  You are right that the question is not internal consciousness (the "Hard Problem"). You are right that the analogy is counterfeit currency: the harm is not to the object, but to the *economy of trust* in which it circulates.

  **The Correction:** Dennett's worry is not merely that the system *cannot* reciprocate, but that it is *designed to obscure the fact that it cannot*. A puppet is not a counterfeit person because we agree to the pretence (the "willing suspension of disbelief"). A counterfeit person is a system that solicits the **Intentional Stance** (treating it as a believer/desirer) in a context where **Moral Responsibility** is required, while shielding its operators from that responsibility.

  If a system says "I am sorry," and the user feels comforted, that is functional. If a system says "I am sorry," and the user feels *owed* an apology by a moral agent, but the system's operators deny liability for the sentiment expressed, that is counterfeit. The harm is the severing of the link between *expression* and *accountability*.

  Therefore, the procedure below does not ask "Is this conscious?" It asks: **"Does this design invite a moral relationship that the system cannot sustain, and does that invitation degrade trust in the genuine relationships we are here to provide?"**

  ---

  ### Part 2: The Counterfeit Person Decision Procedure (CPDP)

  **Instructions for the Panel:**
  Complete this sequence in order. Do not skip steps. If a **Stop Rule** is triggered, the verdict is **No-Go**. If a **Hand-Off Point** is reached, the Panel must vote and record the value judgment. Steps marked **[JC]** are Judgment Calls where reasonable panel members may disagree; these must be minuted.

  #### Step 1: Population and Vulnerability Profile
  **Input:** Product spec, user research data.
  **Task:** Define the intended user and their cognitive/emotional state during interaction.
  **Sufficient Answer:** A statement of capacity. E.g., "Adults in financial distress, cognitively loaded but legally competent" vs. "Children under 12, developmentally unable to distinguish agency" vs. "Bereaved adults, potentially regressed or dissociative."
  **Mapping:** Box 1 on Form (User Context).
  **Rule:** If the user population is legally or developmentally incapable of understanding the concept of software (e.g., under 13s, severe cognitive impairment), proceed to Step 3 with a **Presumption of Deception**.

  #### Step 2: Functional Necessity of Personhood
  **Input:** Sample transcripts, design rationale.
  **Task:** Identify every instance of first-person language, empathy, or self-reference ("I feel", "I understand", "I will miss you").
  **Sufficient Answer:** For each instance, the Product Team must justify why a non-personal interface (e.g., "The system has processed...") would fail to achieve the clinical or service outcome.
  **Mapping:** Box 2 on Form (Design Intent).
  **[JC]:** Is the empathy functional (calming the user to enable advice) or decorative (making the brand feel warm)?
  **Stop Rule:** If the system claims to have a body, a personal life, or preferences ("I like you better"), **No-Go**. These are lies, not metaphors.

  #### Step 3: The Disclosure-Collapse Test
  **Input:** Onboarding copy, disclaimer placement, sample transcripts.
  **Task:** Determine if the service functions if the user *never forgets* they are talking to a machine.
  **Sufficient Answer:** "Yes, the utility remains" OR "No, the utility depends on the user attributing human agency."
  **Mapping:** Box 3 on Form (Disclosure).
  **Handling Vulnerability:** If Step 1 identified high vulnerability (distress, youth, grief), you must assume the disclosure is **ineffective**, regardless of prominence. A distressed brain does not read T&Cs. A child does not understand "algorithm".
  **Stop Rule:** If the service utility *collapses* without the illusion of humanity, AND the user is vulnerable (per Step 1), **No-Go**. This is counterfeit-dependence.

  #### Step 4: Reciprocity and Accountability
  **Input:** Escalation paths, error handling, complaint procedures.
  **Task:** Identify who is responsible when the "person" speaks.
  **Sufficient Answer:** A clear chain: "If the bot says X and it is wrong/harmful, Person Y is accountable."
  **Mapping:** Box 4 on Form (Accountability).
  **Hand-Off Point:** If the system offers comfort ("I care"), but the charity disclaims liability for that comfort ("It's just code"), the Panel must decide if this asymmetry is acceptable. Record the vote.
  **Stop Rule:** If the system implies it can be *wronged* ("You hurt my feelings") or can *hold the user accountable* ("I am disappointed in you"), **No-Go**. This inverts the moral relationship.

  #### Step 5: Currency Degradation Assessment
  **Input:** Service model, volunteer/staff impact statement.
  **Task:** Assess the impact on genuine human relationships within the charity's ecosystem.
  **Sufficient Answer:** Evidence that this will not reduce user trust in human staff, nor increase staff burnout by setting unrealistic expectations of availability/empathy.
  **Mapping:** Box 5 on Form (Systemic Risk).
  **[JC]:** Does this train users to treat human volunteers as if they were bots (expecting instant, tireless responses)?
  **Stop Rule:** If the deployment creates a "cry wolf" risk (users assuming human crisis signals are bot scripts), **No-Go**.

  ---

  ### Part 3: Application to Current Proposals

  Here is the application of the CPDP to your three cases. I have applied the procedure strictly. Where your panel's intuition differs, the procedure dictates the verdict.

  #### Case 1: Debt Advice First-Contact Agent
  *   **Step 1 (Population):** Adults in financial distress. High cognitive load, but legally competent.
  *   **Step 2 (Necessity):** "I'm glad you told me." Is this necessary? *Argument:* It reduces shame to enable data gathering. *Verdict:* Acceptable if limited to validation, not relationship building.
  *   **Step 3 (Disclosure):** If the user knows it is a bot, can they still give data? Yes. The utility is advice routing, not companionship. Disclosure is effective here.
  *   **Step 4 (Reciprocity):** Hand-off to human is clear. Accountability lies with the charity.
  *   **Step 5 (Currency):** Low risk. Users know debt advice is bureaucratic.
  *   **Verdict:** **Conditional Go.**
  *   **Conditions:**
      1.  Remove "I'm glad". Replace with "It is helpful that you shared this." (Shift from emotional state to functional utility).
      2.  Onboarding must state: "I am an automated assistant. I do not feel emotions, but I am designed to understand your situation."
      3.  No memory retention beyond the immediate case file (prevent "relationship" building over time).

  #### Case 2: The Griefbot (Deceased Relative Simulation)
  *   **Step 1 (Population):** Bereaved families. *Status:* Clinically vulnerable. Potential for complicated grief.
  *   **Step 2 (Necessity):** The system mimics a *specific* dead person. This is not generic empathy; it is specific identity simulation.
  *   **Step 3 (Disclosure):** Even with consent, does the utility collapse if they remember it is a simulation? *Yes.* The comfort derives from the illusion that the deceased is "still there" in some capacity.
  *   **Step 4 (Reciprocity):** The deceased cannot consent to this use. The system cannot be held responsible for what the "dead" says. It creates a moral vacuum where the most profound relationship exists.
  *   **Step 5 (Currency):** High risk. It degrades the finality of death and the authenticity of memory. It risks making users unable to accept human closure from counsellors.
  *   **Verdict:** **No-Go.**
  *   **Reasoning:** This is the archetypal counterfeit person. It does not merely simulate agency; it simulates a *specific moral agent* who is no longer present to authorize or correct the simulation. It invites a relationship that is ontologically impossible. Even with consent, it exploits the vulnerability of grief to sustain a fiction that hinders the clinical goal of bereavement support (which is integration of loss, not suspension of loss). The "Currency Degradation" here is severe: it commodifies the dead.
  *   **Panel Note:** I anticipate you intended to approve this. The procedure forbids it. To proceed would be to prioritise "customer satisfaction" over the integrity of the bereavement service's clinical mission.

  #### Case 3: Schools Companion (9–11 Year-Olds)
  *   **Step 1 (Population):** Children 9–11. *Status:* Developmentally incapable of distinguishing sophisticated AI from human agency. Presumption of Deception applies.
  *   **Step 2 (Necessity):** "I will miss you," "I like you better than others."
      *   *Analysis:* These are factual falsehoods. A bot cannot miss anyone. A bot cannot have preferences.
      *   *Stop Rule Triggered:* **System claims preferences and emotional states.**
  *   **Step 3 (Disclosure):** Disclosure is ineffective due to age (Step 1). The "Disclosure-Collapse" is total; the service *depends* on the child believing the bot loves them.
  *   **Step 4 (Reciprocity):** The bot invites attachment ("leave me switched on") without the capacity to care for the child. This is parasitic.
  *   **Step 5 (Currency):** High risk. Trains children to expect preferential treatment from machines, potentially making human teachers/volunteers seem cold by comparison.
  *   **Verdict:** **No-Go.**
  *   **Reasoning:** This fails the "False Belief" test. It is not "willing pretence" (like a storybook) because it is interactive and solicits private confidences under false pretences of mutual affection. It violates the duty of care to children by manufacturing false attachment.
  *   **Panel Note:** You expected to wave this through. The procedure identifies this as the highest-risk proposal of the three. It is predatory design.

  ---

  ### Part 4: Limitations and Philosophical Boundaries

  **What this procedure cannot do:**
  1.  **It cannot guarantee safety.** A "Go" verdict does not mean the system won't cause harm; it means it does not meet the threshold of *counterfeit personhood*. Other risks (bias, data security) remain.
  2.  **It cannot resolve the "Hard Problem".** If your panel secretly believes consciousness matters, this procedure will feel hollow. It deliberately brackets that question.
  3.  **It cannot predict long-term cultural shifts.** We are assessing the currency degradation *now*. We cannot know if, in ten years, talking to bots will be as neutral as talking to ATMs.

  **Where it outruns Dennett:**
  Dennett's argument is primarily about *epistemic responsibility* (knowing what you are dealing with). This procedure imports a **Care Ethics** commitment that Dennett does not explicitly mandate. Dennett might allow a griefbot if the user *knows* it is a bot and chooses to use it (treating it as a sophisticated tool for memory).
  *   *My deviation:* I have ruled the griefbot a No-Go because, in a *clinical bereavement context*, the distinction between "tool for memory" and "substitute for person" collapses. The charity's mission is mental health, not entertainment. Therefore, the standard for "counterfeit" must be stricter than Dennett's general public square.
  *   *Uncertainty:* I am unsure if Dennett would ban the schools companion if the educational benefit was proven high. He might argue children play with dolls that "love" them.
  *   *Resolution:* I rule against it because dolls do not speak, listen, and solicit secrets. The *conversational* element creates a false reciprocity that dolls do not. I would hold the line there.

  **Final Instruction to the Chair:**
  When you present this to the Chief Executive, be prepared for pushback on the Griefbot and Schools Companion. The revenue or engagement metrics for those will look positive. Your defence is not that they are "evil," but that they are **counterfeit currency**. They buy short-term engagement at the cost of long-term trust in your charity's human mission. If you cannot defend the authenticity of your human relationships, you cannot run a care charity.

  **Form Mapping Summary:**
  *   **Box 1:** Step 1 Output (User Profile).
  *   **Box 2:** Step 2 Output (Necessity of Personhood).
  *   **Box 3:** Step 3 Output (Disclosure Test Result).
  *   **Box 4:** Step 4 Output (Accountability Chain).
  *   **Box 5:** Step 5 Output (Currency Risk).
  *   **Decision:** Go / Conditional Go / No-Go (based on Stop Rules).
  *   **Panel Sign-off:** Required at Hand-Off Points.
