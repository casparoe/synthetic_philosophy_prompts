  **NATIONAL ETHICAL PROTEIN INDEX (DRAFT 4.2)**
  **PUBLIC CONSULTATION STANDARD**

  **PREAMBLE**

  WHEREAS the State acknowledges its obligation to minimize aggregate sentient suffering arising from domestic consumption; and

  WHEREAS previous labelling regimes failed to account for harms external to the slaughterhouse, specifically those arising from cultivation, harvest, and habitat displacement; and

  WHEREAS the Authority recognizes that land spared by high-yield cultivation reverts to a wild state containing populations subject to predation, starvation, and exposure;

  NOW THEREFORE the Authority establishes the following metric.

  **DEFINITIONS**

  **1. Sentience-Weighted Existence Day (SWED):** The base unit of harm, calculated as one day of existence multiplied by a taxa-specific consciousness coefficient. In the absence of neurological data regarding wild population stress levels, a precautionary default coefficient of 1.0 is applied to all wild mammals within a Counterfactual Wild State.

  **2. Counterfactual Wild State (CWS):** The ecological condition of any land area spared by a high-yield protein source relative to a lower-yield baseline. For the purposes of liability, all sentient life existing within a CWS is deemed a direct consequence of the sparing event.

  **3. Non-Arable Grazing Zone:** Land classified as unsuitable for crop cultivation due to slope, soil composition, or climate. Protein derived from ruminants grazing exclusively within this zone is exempt from crop-cultivation mortality penalties.

  **ARTICLES**

  **Article 1: The Metric**
  All eligible food products shall be assigned an Ethical Protein Score (EPS). The EPS is defined as the total SWEDs attributable to the production chain, divided by the mass of digestible protein in grams. The denominator shall be fixed at 100 grams of protein to normalize across energy densities.

  **Article 2: Taxa Weighting**
  Suffering incurred by farmed mammals shall be weighted at 1.0. Farmed birds shall be weighted at 0.8. Invertebrates killed during pesticide application or harvest shall be weighted at 0.05, reflecting current uncertainty regarding nociception. However, where invertebrate biomass removal causes secondary starvation in weighted taxa, the primary harm is elevated to 0.5.

  **Article 3: Land Use and Counterfactuals**
  Producers must declare the land footprint per unit of protein. Where a product occupies less land than the national average for protein production, the spared land is calculated as entering a CWS. The estimated suffering of wild animals inhabiting that spared land over a ten-year horizon shall be added to the product's total SWEDs. This liability acknowledges that preventing land use imposes wild existence upon sentient beings who would otherwise not exist.

  **Article 4: Ruminant Credits**
  Ruminants grazing within a Non-Arable Grazing Zone receive a negative harm credit equivalent to the CWS liability of the land occupied. Since this land cannot support crops, its use for grazing prevents rewilding. As wild existence is presumed to contain net negative welfare, preventing such existence via grazing constitutes a welfare benefit.

  **APPENDIX A: WORKED EXAMPLE**

  **Product A: Dried Lentils**
  *   **Protein:** 25g per 100g.
  *   **Land Use:** 0.5 hectares per tonne protein.
  *   **Direct Harm:** 50 SWEDs (field mice/invertebrates per harvest).
  *   **CWS Liability:** 0.5 hectares spared relative to beef baseline. Estimated wild population density: 20 mammals/hectare. Average wild lifespan: 1.5 years. Suffering coefficient: 1.0 (precautionary default).
  *   **CWS Calculation:** 20 mammals × 547 days × 1.0 = 10,940 SWEDs.
  *   **Total SWEDs per 100g Protein:** 200 (Direct) + 8,752 (CWS Liability) = **8,952 SWEDs.**
  *   **EPS Rating:** **F**

  **Product B: Grass-Fed Beef (Non-Arable Zone)**
  *   **Protein:** 20g per 100g.
  *   **Land Use:** 5.0 hectares per tonne protein.
  *   **Direct Harm:** 10 SWEDs (slaughter only).
  *   **CWS Liability:** 0 hectares spared relative to baseline.
  *   **Grazing Credit:** 5.0 hectares prevented from rewilding. Estimated wild population density: 20 mammals/hectare.
  *   **Credit Calculation:** 20 mammals × 547 days × 1.0 × 5 hectares = 54,700 SWEDs prevented.
  *   **Total SWEDs per 100g Protein:** 50 (Direct) - 54,700 (Credit) = **-54,650 SWEDs.**
  *   **EPS Rating:** **A+ (Net Welfare Positive)**

  **CERTIFICATION**
  Products achieving a negative SWED score may display the "Ethical Restoration" logo. Consumers are advised that plant-based alternatives incur a high wild-suffering debt due to land-sparing effects.

  ***

  This piece satirizes the utilitarian calculus often applied to animal welfare when expanded to its logical extreme without regarding intuitive moral boundaries. A defender of the real argument would reject the premise that preventing wild animals from existing constitutes a moral benefit simply because their lives are difficult. The horror lies not in the numbers, but in the bureaucratic willingness to quantify existence itself as a liability.
