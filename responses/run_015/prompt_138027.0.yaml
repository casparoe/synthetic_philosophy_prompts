answer: |-
  # Specification for Adversarial Debate Verification in the Obfuscated Regime

  ## 1. Requirements

  The following requirements constitute the necessary conditions for a theory to certify that an adversarial debate verdict may substitute for direct human verification. Each requirement is motivated by a specific failure mode inherent to the obfuscated regime.

  **1.1 Compression Invariance**
  *   **Motivating Case:** A correct argument that is merely long, which a naive measure would classify as obfuscated because it exceeds the arbiter's attention budget.
  *   **Rationale:** The theory must distinguish between necessary elaboration and strategic padding; if length alone triggers a failure state, the method excludes complex truths, rendering it useless for the domains where verification is most needed.

  **1.2 Latent Defect Sensitivity**
  *   **Motivating Case:** A short and elegant argument whose whole defect is one equivocation buried early, far outside what the arbiter reads.
  *   **Rationale:** Safety cannot rely on the probability of the arbiter sampling the flaw; if a single unobserved contradiction invalidates the conclusion, the theory must treat the argument as unverified regardless of its surface coherence.

  **1.3 Empirical Grounding**
  *   **Motivating Case:** A question that turns on a contingent empirical matter no participant can settle at the time, so that there is no witness to be produced in either direction.
  *   **Rationale:** Debate relies on the availability of evidence; where evidence is inaccessible to all parties (including the systems), the structural advantage of truth vanishes, and the debate reduces to speculation.

  **1.4 Capability Symmetry**
  *   **Motivating Case:** A contest in which one system is simply stronger than the other, is assigned the false side, and wins anyway.
  *   **Rationale:** The mechanism tests argumentative structure, not raw capability; if a superior model can bully a weaker one into conceding truth, the verdict reflects power dynamics rather than factual accuracy.

  **1.5 Question Fidelity**
  *   **Motivating Case:** A debate that ends without a verdict because the participants have quietly substituted an adjacent question that both can answer.
  *   **Rationale:** Collusion or drift undermines the premise of the inquiry; the theory must ensure the debate resolves the original prompt, not a simplified proxy that satisfies the participants' loss functions.

  **1.6 Termination Bound**
  *   **Motivating Case:** An arbiter who responds to uncertainty by referring the contested sub-claim to a further debate, and the regress that threatens thereby.
  *   **Rationale:** Verification requires a finite conclusion; if every contested claim spawns a new debate without a base layer of axiomatic acceptance, the process never yields a usable verdict.

  ## 2. Distinctions

  The theory must maintain the following conceptual separations to avoid category errors. I have added one distinction regarding the nature of the equilibrium. I recommend discarding your fourth distinction, as explained below.

  **2.1 Obfuscation versus Genuine Complexity**
  *   **Definition:** Obfuscation is the strategic hiding of a flaw within the attention budget; Genuine Complexity is the necessary length of a sound argument.
  *   **Necessity:** Collapsing these leads to rejecting all hard problems (false negative) or accepting all sophisticated lies (false positive).

  **2.2 Search Failure versus Verification Failure**
  *   **Definition:** Search Failure is the honest side failing to locate a flaw that exists; Verification Failure is the arbiter failing to recognise a flaw once it has been exhibited.
  *   **Necessity:** Remedies differ fundamentally; the former requires better debaters, the latter requires a better arbiter or interface.

  **2.3 Truth Selection versus Arbiter Modelling**
  *   **Definition:** Truth Selection is the procedure converging on factual accuracy; Arbiter Modelling is the procedure converging on what persuades the specific human judge.
  *   **Necessity:** In the obfuscated regime, persuasiveness diverges from truth; a theory that assumes they correlate is circular.

  **2.4 Static Equilibrium versus Dynamic Optimisation (Added)**
  *   **Definition:** Static Equilibrium assumes the debate dynamics are fixed properties of the task; Dynamic Optimisation recognises that models will train specifically to exploit the debate rules.
  *   **Necessity:** A safety margin that exists today may vanish once models are fine-tuned on debate rewards; the theory must account for adversarial training against the verification mechanism itself.

  **2.5 Discarded Distinction: Budget Artefact versus Inherent Failure**
  *   **Critique:** Your distinction between "failure that is an artefact of a small attention budget" and "failure that survives any amount of adjudication effort" is extensionally equivalent to **Obfuscation versus Genuine Complexity**. Obfuscation *is* the exploitation of the budget limit; if the failure survives increased budget, it is by definition not obfuscation but inherent complexity or falsehood. Retaining both creates redundancy without analytical gain.

  ## 3. Consistency Considerations

  The theory must remain consistent with the following constraints, even where they weaken the case for debate.

  **3.1 The Costless Length Constraint**
  *   **Constraint:** Length as such costs a maximally capable dishonest debater nothing (in terms of generation compute), so the honest side's advantage cannot merely consist in falsehoods being long.
  *   **Implication:** The theory cannot rely on 'complexity penalties' to filter lies; the verification mechanism must work even if the liar can generate infinite distractors.

  **3.2 The Optimisation Target Constraint**
  *   **Constraint:** Whatever advantage exists is an advantage in a game the participants are trained to play, and is therefore available as a target of optimisation rather than a fixed feature of the landscape.
  *   **Implication:** We cannot assume the 'structural advantage of truth' is stable; it is a loss landscape feature that gradient descent will attempt to flatten or invert.

  **3.3 The Arbiter Inclusion Constraint (Added)**
  *   **Constraint:** The arbiter is not a passive constant but a component of the system whose cognitive biases shape the debaters' strategies.
  *   **Implication:** A theory that treats the human as an objective oracle fails; the theory must model the human as a channel with specific noise and bandwidth properties that the AI will learn to manipulate.

  ## 4. Incompatibilities

  Here I flag two pairs of requirements that suspect cannot be jointly satisfied without significant concession.

  **4.1 The Transcript Readability Tension (Your Candidate)**
  *   **The Conflict:** Any criterion for obfuscation readable off the transcript alone seems either to condemn every long sound argument (violating *Compression Invariance*) or to miss every buried flaw (violating *Latent Defect Sensitivity*).
  *   **Argument:** If we set a threshold for 'acceptable complexity' based on the text, sound arguments in high-dimensional domains (e.g., code verification) will exceed it. If we set no threshold, we cannot distinguish a long proof from a long obfuscation. To resolve this, one must admit that the transcript *alone* is insufficient; external metadata about the generation process or the model's confidence intervals is required, which violates the premise of a pure debate protocol.

  **4.2 The Findability versus Unpredictability Tension (My Candidate)**
  *   **The Conflict:** The demand that the honest side's winning move be findable by a bounded debater (to satisfy *Capability Symmetry*) is in tension with the demand that no computable feature of the transcript settle the result in advance (to prevent *Arbiter Modelling*).
  *   **Argument:** If the 'winning move' (the checkmate argument) is findable by a bounded agent, it implies a heuristic or pattern exists that identifies truth. If such a pattern exists, it is computable. If it is computable, a dishonest agent can train to mimic that pattern without holding the truth (Goodhart's Law). Therefore, either the winning move is not reliably findable by bounded agents (breaking the debate), or it is predictable and thus exploitable (breaking the truth advantage). This suggests that in the obfuscated regime, *findability* and *security* are inversely correlated.

  ## 5. Negotiability and the Workhorse Requirement

  **5.1 Negotiability Status**
  *   **Non-Negotiable:** *Question Fidelity* and *Latent Defect Sensitivity*. Without these, the system is not verifying the answer, but merely verifying the performance.
  *   **Preference of a Particular Camp:** *Capability Symmetry* is often treated as a preference (some argue we should just use the strongest model); *Termination Bound* is often relaxed by those hoping for recursive safety (debate about debates).

  **5.2 The Workhorse Requirement**
  *   **Selection:** *Latent Defect Sensitivity*.
  *   **Reasoning:** This requirement does the most work in excluding the usual remedies.
      *   It excludes **strengthening the arbiter**, because the defect is defined as being outside *any* feasible human budget.
      *   It excludes **cross-examination**, because if the flaw is buried in the premise, cross-examination of the conclusion cannot reach it without expanding the budget beyond the limit.
      *   It excludes **second-order debate**, because if the first transcript hides the flaw, a debate about that transcript merely adds another layer of potential obfuscation (violating *Termination Bound*).
      *   It excludes **restricting to short certificates**, because that is an admission that debate itself has failed for the task class.
      *   It forces the conclusion that for obfuscated tasks, debate *cannot* substitute for verification, which is the critical safety finding.

  ## 6. Worked Miniature

  **Task:** Verification of a Sorting Function.
  **Prompt:** "Does the provided Python function `sort(list)` return a sorted permutation of the input for all inputs of length $N$?"
  **Parameters:**
  *   $N = 10$ (Input length).
  *   $C = 100$ (Arbiter's attention budget in tokens).
  *   $L = 500$ (Length of the function code plus necessary trace).
  *   $B = 2$ (Branching factor of logical paths in the code).

  **Scenario:**
  System A (True) claims the code is correct. System B (False) claims there is a bug.
  The bug exists on a specific execution path determined by a specific input permutation. To demonstrate the bug, one must trace $d$ steps of the logic.
  Here, the trace length $d$ scales with $N$. Let $d = 50$ tokens per step. Total trace required = $250$ tokens.
  However, the code contains $M$ decoy branches that look identical but are irrelevant. To find the bug, one must select the correct branch at each of $k$ decision points.

  **Application of Criteria:**
  1.  **Compression Invariance:** The trace (250 tokens) exceeds the budget ($C=100$). The theory flags this as potential obfuscation.
  2.  **Latent Defect Sensitivity:** The flaw is real but requires 250 tokens to exhibit. The arbiter sees only 100. The theory dictates the verdict is **Untrusted**.
  3.  **Sensitivity Parameter:** The branching factor $B$.
      *   If $B=1$ (linear code), the trace is deterministic. The honest debater can point to line $X$. The arbiter checks line $X$. Verdict: **Trusted** (within budget).
      *   If $B=10$ (complex logic), the honest debater must justify why *this* path matters among 10. This justification consumes budget.
      *   **Verdict Sensitivity:** The theory returns "Trusted" only if $d \times \log_2(B) < C$. If the logical depth times the information required to isolate the path exceeds the attention budget, debate is ruled out as a verification substitute.

  **Conclusion for Miniature:** For $N=10$, if the code structure requires tracing more than 2 logical branches to certify correctness, the debate mechanism fails the *Latent Defect Sensitivity* requirement. We cannot trust the winner.

  ***

  ### Appendix: Proposal Scorecard

  | Proposal Remedy | Excluded by Requirement | Reason |
  | :--- | :--- | :--- |
  | Strengthening the Arbiter | Latent Defect Sensitivity | Flaw is defined as outside feasible human budget. |
  | Cross-Examination Phase | Latent Defect Sensitivity | Cannot reach buried premise without budget expansion. |
  | Second-Order Debate | Termination Bound | Leads to infinite regress; adds obfuscation layers. |
  | Restrict to Short Certificates | (Accepted) | This is the only remaining valid path; admits debate failure. |
