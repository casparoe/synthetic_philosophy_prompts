      *   This is the technical point the economic historian might miss (or dismiss).
      *   Also, the "Hoarding" point: A ruler has no value outside measuring. Money does.

  10. **Refining the Stress Tests:**
      *   *Weights Fee:* It's a wage for labor (verification), not interest on capital.
      *   *Fiat:* Aristotle knows money is convention. The "nature" he refers to is the *function* (exchange), not the metal. So fiat doesn't save the historian.

