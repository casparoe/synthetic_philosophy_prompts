      *   *Fit:* You don't charge someone for speaking your language (usually). But more importantly, language doesn't breed sentences.
      *   *Candidate:* **Ticket/Token.**
      *   *Why:* Represents a claim.
      *   *Fit:* Charging for the token itself vs. the good.
      *   *Best Candidate:* **A Bridge or Road (Toll vs. Breeding).**
      *   *Actually, the "Seed Corn" analogy is Aristotle's own.*
