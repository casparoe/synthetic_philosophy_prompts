      *   **Task:** Audit the "renting a ruler" analogy. Provide a correspondence table, identify disanalogies (specifically load-bearing ones), address two stress tests (official weights fee, pure counter currency), evaluate whether the conclusion survives, suggest better analogies, and flag scholarly disputes.
      *   **Tone:** Academic, precise, philosophically rigorous, but practical for a lecture slide. No reading lists.

  2.  **Deconstruct the Colleague's Argument:**
      *   *Premise 1:* Aristotle defines money primarily as a measure of value (convention/nomos).
      *   *Premise 2:* Charging for the use of a measure (like renting a ruler) is unproblematic.
      *   *Conclusion:* Therefore, Aristotle's condemnation of interest (*tokos*) is inconsistent with his definition of money or relies on an external moral premise not derived from the definition.
      *   *Implication:* The condemnation is just prejudice against traders.

  3.  **Audit the "Ruler" Analogy (Correspondence Table):**
      *   *Ruler* = Money (Coin/Currency).
      *   *Lengths/Inches* = Units of Value (e.g., minas, drachmas).
      *   *Thing Measured* = Goods/Services being exchanged (Shoes, Houses).
      *   *Surveyor* = The Parties to the Exchange (Buyer/Seller).
      *   *Table/Surface* = The Market/Community (*Koinonia*).
      *   *Act of Measuring* = Pricing/Valuation.
      *   *Renting the Ruler* = Lending Money.
      *   *Fee for Renting* = Interest (*Tokos*).

  4.  **Analyze Disanalogies (The Core Philosophical Work):**
      *   *Consumption vs. Use:* A ruler is not consumed by use. Money *is* consumed (transferred) in a loan. This is the standard Scholastic/Aristotelian distinction (usufruct).
      *   *The "Same Stuff" Problem (User's Suspicion):* When you rent a ruler, you pay in *other* value (cash/grain). When you lend money, you are paid back in *more money*. The measure generates more of itself.
      *   *The "Wanting the Ruler" Problem (User's Insight):* Nobody wants a ruler for itself. People *do* want money for itself (hoarding). If money were truly just a ruler, hoarding would be irrational. Aristotle's critique of chrematistics depends on money *ceasing* to be a mere measure and becoming an end.
      *   *Sterility:* A ruler helps measure growth (of cloth, land), but the ruler itself doesn't grow. Money lending makes money grow.

  5.  **Address the Stress Tests:**
      *   *Test 1: Official Weights Fee.* If the polis charges to use weights, is that interest?
          *   *Response:* That's a service fee for *certification*, not payment for the *use* of the metal itself over time. It's a wage for the weight-keeper, not offspring of the weight.
      *   *Test 2: Pure Counter Currency (Fiat).* If money has no intrinsic value, does Aristotle's story work?
          *   *Response:* Aristotle acknowledges money is by convention (*nomos*). Even fiat money functions as a measure. However, the "barrenness" argument relies on money being a *medium of exchange*, not a *source of production*. Even fiat money doesn't breed. But the "hoarding" critique hits harder here: if it's just counters, why want more? Because they represent command over goods. The "ruler" analogy fails because fiat money is *more* like a score in a game than a ruler.

  6.  **Evaluate the Conclusion (Does it survive?):**
      *   The colleague is half-right: The "measure" definition *alone* doesn't generate the moral prohibition.
      *   The colleague is half-wrong: The measure definition isn't the *only* definition. Aristotle distinguishes between money as measure (Ethics V) and money as capital/stock (Politics I).
      *   *Key Distinction:* Money as *medium of exchange* (measure) vs. Money as *wealth* (stock). Interest treats money as a stock that produces.
      *   *Verdict:* The argument doesn't collapse, but the "ruler" analogy is the wrong tool to defend it. The defense lies in the distinction between *oikonomia* (household management/exchange for need) and *chrematistics* (wealth accumulation).
      *   *Scholarly Split:* Yes, there is debate on whether Aristotle is inconsistent between NE V and Pol I, or if they are complementary. Also debate on whether "conventional" means "arbitrary" or "institutionally stabilized."

  7.  **Select a Better Analogy:**
      *   *Candidate:* **Language.**
