answer: |-
  This is a classic collision between the history of economic thought and the history of economic practice. Your colleague is treating Aristotle's *Nicomachean Ethics* V.5 (money as a measure of commensurability) as the exhaustive definition, then using it to audit *Politics* I.10 (money as barren stock).

  Your suspicion is correct: the "renting a ruler" analogy collapses because it ignores the fungibility of money and the transfer of ownership inherent in a loan. A ruler is a tool for *assessment*; money in a loan is a *stock of value* being transferred.

  Here is the audit for your lecture.

  ### 1. The Correspondence Table (For the Slide)

  | The Ruler Analogy | The Aristotelian Target (Money/Loan) |
  | :--- | :--- |
  | **The Ruler** | The Coin / Currency Unit |
  | **The Inches/Markings** | The Denomination (Drachma, Mina) |
  | **The Object Measured** | The Goods/Services Exchanged (Shoes, Houses) |
  | **The Act of Measuring** | Pricing / Valuation |
  | **The Surveyor** | The Buyer and Seller |
  | **The Surface/Table** | The Market / Political Community (*Koinonia*) |
  | **Renting the Ruler** | Lending Capital |
  | **The Rental Fee** | Interest (*Tokos*) |
  | **The Return** | The Ruler is returned intact |
  | **The Payment** | Fee paid in *other* value (cash, grain) |

  ### 2. Disanalogies: Noise vs. Load-Bearing

  You need to separate the superficial mismatches from the ones that actually break the colleague's argument.

  **Noise (Ignore these in lecture):**
  *   **Material:** A ruler is wood/stone; money is metal/paper. (Aristotle admits money is convention, so material doesn't matter).
  *   **Durability:** A ruler lasts years; coins wear down. (Irrelevant to the logic of interest).
  *   **Portability:** Coins move, rulers stay. (Sometimes rulers move, sometimes money stays in a bank).

  **Load-Bearing (These kill the analogy):**
  *   **Fungibility/Consumption:** When you "use" a ruler, you do not consume it; you return the *same* ruler. When you "use" money (in a loan), you spend it; you consume the ownership. You cannot return the *same* coins, only *equivalent* coins.
      *   *Why it matters:* You charge rent for the *use* of a non-consumable. You charge interest on the *transfer* of a consumable. The economic historian is conflating *usufruct* (right to use) with *abuse* (right to consume).
  *   **The "Same Stuff" Problem (Your Suspicion):** When you rent a ruler, the fee is paid in *something else* (cash). When you lend money, the fee is paid in *more money*.
      *   *Why it matters:* This is the core of the *tokos* (offspring) objection. A ruler helps measure the growth of cloth; the ruler does not grow cloth. Money lending makes money grow money. The analogy hides the reflexivity of the transaction.
  *   **Desirability:** Nobody wants a ruler for its own sake. People want money for its own sake (hoarding).
      *   *Why it matters:* As you noted, if money were truly just a ruler, *chrematistics* (wealth accumulation) would be unintelligible. The pathology Aristotle diagnoses depends on money *ceasing* to be a mere measure and becoming an end. The ruler analogy assumes money stays a measure, which begs the question against Aristotle's critique of the miser.

  ### 3. The Stress Tests

  **Test 1: The Official Weights Fee**
  *   **Scenario:** The polis charges merchants to use the standard stone weights.
  *   **Verdict:** This is **not** interest; it is a **wage for certification**.
  *   **The Difference:** The fee pays for the *labor* of the weight-keeper and the *trust* in the standard, not for the *time* the weight is held. It is a service charge (*misthos*), not a breeding charge (*tokos*). Interest is charged for *time* and *risk* on the capital itself. Aristotle distinguishes between earning from a craft/service and earning from wealth itself.
  *   **Lecture Point:** Charging for the *verification* of the measure is natural (it supports the *koinonia*). Charging for the *generation* of the measure is unnatural.

  **Test 2: Pure Counter Currency (Fiat)**
  *   **Scenario:** Money is metal-less counters, value entirely by agreement.
  *   **Verdict:** This actually **strengthens** Aristotle's "barrenness" argument, not weakens it.
  *   **Why:** If money is purely conventional counters, its only function is to facilitate the exchange of *real goods*. If the counters breed without the production of real goods, the link between the signifier (money) and the signified (goods) is broken.
  *   **The "Story":** Aristotle's story of money arising from exchange (*Politics* I.9) works fine with fiat (it's still a convention for need). But the "barrenness" claim is stronger: a plastic chip is even *less* capable of biological reproduction than a gold coin. If gold (which has some use-value) is barren, a token is doubly barren.
  *   **Lecture Point:** The "conventional" nature of money explains why it *can* be used for interest (because we agree to treat it as capital), but it doesn't make interest *natural*. It makes it a legal fiction that violates the functional nature of the token.

  ### 4. Does the Conclusion Survive?

  **Verdict:** The colleague's conclusion (that the argument collapses into prejudice) is **false**, but his diagnostic intuition (that the "measure" definition doesn't carry the moral weight) is **partially true**.

  *   **The Problem:** The colleague is reading *Ethics* V (money as measure of justice) into *Politics* I (money as instrument of household management).
  *   **The Fix:** Aristotle does not condemn interest *because* money is a measure. He condemns it because money is a **medium of exchange** that is being treated as a **source of production**.
  *   **The Missing Premise:** It is not a moral premise added from outside; it is a functional premise. The "proper use" (*ergon*) of money is to facilitate the exchange of goods for need. When money generates more money without an intervening exchange of goods, it is fulfilling no function.
  *   **Is it Prejudice?** It is only prejudice if you define "production" to include financial arbitrage. If you define "production" as the generation of material goods required for life (*oikonomia*), then the argument is consistent. You need to tell your students that Aristotle's definition of "wealth" is tethered to the household's material needs, not abstract value.

  **Scholarly Flag:** Be explicit that there is a genuine split on whether *NE* V.5 and *Pol* I.8-10 are consistent.
  *   *Camp A:* They are consistent; money is a measure in exchange, but barren in generation.
  *   *Camp B:* They are tension-ridden; the "measure" view implies money is neutral, the "barren" view implies it has a specific teleology that can be violated. (Your colleague is in Camp B, using it to dismiss the teleology).

  ### 5. A Better Analogy: The Warehouse Receipt

  The Ruler fails because it is a tool for *assessment*. Money in a loan is a *claim on goods*.

  **The Analogy:** Money is a **Warehouse Receipt** for grain.
  *   **Correspondence:** The receipt represents real goods stored elsewhere.
  *   **The Loan:** Lending money is lending the receipt.
  *   **The Interest:** Demanding the receipt back *plus* another receipt, without putting more grain in the warehouse.
  *   **Why it works:**
      1.  **Convention:** The receipt is paper (convention), but represents grain (nature/need).
      2.  **Barrenness:** Paper does not breed grain. If the receipts multiply but the grain does not, the system is a fiction.
      3.  **The "Same Stuff" Problem:** You pay the fee in receipts (claims on grain), not in labor.
      4.  **Hoarding:** You can hoard receipts without hoarding grain (the pathology Aristotle identifies).
  *   **What it costs:** It implies a commodity backing that fiat money lacks. But Aristotle assumes metal coinage, so this fits his ontology better than the ruler.

  **Alternative (for the Convention point): Language.**
  *   Money is like **Language**. It exists by convention (*nomos*) to facilitate communication (exchange).
  *   **Interest:** Charging someone interest is like charging someone a fee for every noun they speak, payable in more nouns.
  *   **Why it works:** It captures the *nomos* aspect the historian loves. It shows the absurdity of the *medium* breeding itself.
  *   **What it costs:** Language isn't "lent" in the same way.

  **Recommendation:** Use the **Warehouse Receipt** for the *Politics* (interest/barrenness) section. It visually separates the *sign* (money) from the *thing signified* (goods), which is where the "breeding" error happens.

  ### 6. Summary for the Lecture

  1.  **Acknowledge the Historian:** He is right that *nomos* (convention) is central to Aristotle's definition of money.
  2.  **Audit the Ruler:** The analogy fails on **fungibility**. You rent a tool; you transfer a stock.
  3.  **The Turn:** The condemnation of interest rests on the distinction between **Money as Measure** (Ethics) and **Money as Capital** (Politics).
  4.  **The Core Argument:** Interest treats the *sign* of value as if it were a *source* of value.
  5.  **Scholarly Honesty:** Flag that modern economics rejects the "barrenness" of capital, so the disagreement is ultimately about the definition of production, not just the definition of money.

  This approach validates the historian's textual observation (money is conventional) without conceding his philosophical conclusion (therefore interest is neutral).
