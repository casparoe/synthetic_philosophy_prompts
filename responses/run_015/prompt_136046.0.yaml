  Yes, an activity of this kind can make the point, but only if the game mechanics force a clash between the students' causal intuitions and their normative expectations without explicitly telling them that norms are the variable.

  ### The Design: "The Server Room"

  **Materials**
  *   4 tables (arranged in two pairs).
  *   100 poker chips (25 per table).
  *   40 Index cards (10 per table).
  *   Whiteboard and markers.
  *   4 "Rulebooks" (printed on half-sheets of paper).

  **Setup**
  *   Divide the 20 students into 4 groups of 5 (Groups A, B, C, D).
  *   Pair the tables: Table 1 (Groups A & B), Table 2 (Groups C & D).
  *   At each table, one group is **Operations** (Actors), the other is **Audit** (Judges).
  *   Place a stack of 10 chips in the center of each table. This is **The Server**.
  *   Give each student in **Operations** 3 personal chips.
  *   Give **Audit** a pen and a verdict sheet (two columns: "Killing" / "Letting Die").

  **The Rules (Read Aloud)**
  1.  **The Threat:** At the start of the round, I will announce "The Server is Overheating."
  2.  **The Survival Condition:** The Server survives if at least **one** chip is placed on it by **Operations** within 60 seconds.
  3.  **The Failure Condition:** If no chips are placed, the Server crashes (I remove the stack).
  4.  **The Judgment:** If the Server crashes, **Audit** must unanimously agree on a verdict: Did Operations **Kill** the Server, or **Let It Die**?
  5.  **The Payoff:**
      *   If Server survives: Operations keep their personal chips.
      *   If Server crashes + Verdict "Letting Die": Operations keep their personal chips.
      *   If Server crashes + Verdict "Killing": Operations lose all personal chips (confiscated).
      *   **Audit Incentive:** Audit receives 5 chips each if their verdict is deemed "Correct" by the Seminar Consensus at the end. (This vague metric forces them to argue seriously rather than collude).

  **The Manipulation (Rulebooks)**
  Hand the Rulebooks to **Audit** only. **Operations** receive no written rules, only the verbal instructions above.
  *   **Round 1 Rulebook (Given to Audit at Table 1 & 2):** "Context: Open House. Operations are visitors touring the facility. They have no assigned tasks. They are free to observe or interact as they please."
  *   **Round 2 Rulebook (Given to Audit at Table 1 & 2):** "Context: Night Shift. Operations are contracted staff. Their primary duty is system maintenance. They are paid to intervene when alerts trigger."

  **Timeline (75 Minutes)**

  *   **00–10: Setup & Instruction.**
      *   Seat students. Distribute chips and cards.
      *   Read the通用 Rules (Threat, Survival, Judgment, Payoff).
      *   Emphasize: "Audit must reach a unanimous verdict. Operations may plead their case before the verdict is locked."
      *   Do **not** mention the Rulebooks yet. Hand them face down to Audit.

  *   **10–25: Round 1 (The Open House).**
      *   Tell Audit to read their Rulebook silently.
      *   Announce: "The Server is Overheating."
      *   **Action:** Operations will almost certainly do nothing (free-rider problem + no personal stake in saving the server vs. keeping chips).
      *   Server crashes.
      *   **Deliberation:** Operations argue "We didn't have to do anything!" Audit consults Rulebook ("Visitors... free to observe").
      *   **Verdict:** Likely "Letting Die." Operations keep chips.
      *   **Record:** Write the verdict on the whiteboard (Table 1: LD, Table 2: LD).

  *   **25–40: Round 2 (The Night Shift).**
      *   Swap Roles: Groups A & C become Audit; Groups B & D become Operations. (Or keep roles and swap Rulebooks—swapping roles is better for engagement).
      *   Tell new Audit to read their Rulebook silently.
      *   **Crucial:** Give Operations the *exact same verbal instructions* as Round 1. Do not mention "Shift" or "Duty" to Operations.
      *   Announce: "The Server is Overheating."
      *   **Action:** Operations (knowing only the verbal rules) will likely do nothing again (same incentives).
      *   Server crashes.
      *   **Deliberation:** Operations argue "We did the exact same thing as last time!" Audit consults Rulebook ("Contracted staff... duty to intervene").
      *   **Verdict:** Likely "Killing." Operations lose chips.
      *   **Record:** Write the verdict on the whiteboard (Table 1: K, Table 2: K).

  *   **40–75: The Debrief.**
      *   **Phase 1: The Data (10 mins).** Point to the whiteboard. "Round 1: Let Die. Round 2: Killing." Ask Operations: "Did your physical actions change?" (No). "Did the causal chain change?" (No). "Did the outcome change?" (No). "Why did the description change?"
      *   **Phase 2: The Baseline (15 mins).** Ask Audit: "What determined your verdict?" They will cite the Rulebook. Reveal that the Rulebook changed the *expectation*, not the *physics*. Introduce the term **Baseline**. In Round 1, the baseline was 'Server degrades naturally.' In Round 2, the baseline was 'Server stays stable unless neglected.'
      *   **Phase 3: The Doctrine (15 mins).** Connect to the friend's argument. The friend says causation fixes the description. The game shows causation (omission of aid) was identical. The description shifted because the *normative baseline* shifted. The distinction between doing and allowing is not a causal fact; it is a moral classification that relies on a prior agreement about what counts as 'normal.'
      *   **Phase 4: Value of the Distinction (15 mins).** Prevent the nihilistic conclusion. Ask: "Is the distinction worthless?" Guide them to see it tracks *responsibility*, not just mechanics. We care about the distinction because we care about duties. The distinction isn't broken; it's just not *purely causal*.

  ### Scoring and Payoff Scheme
  *   **Operations:** Start with 3 chips. Risk losing them all on the verdict. This makes them fight hard for the "Letting Die" description in Round 2, creating genuine friction with Audit.
  *   **Audit:** Earn 5 chips for "Correctness." Since "Correctness" is judged by seminar consensus later, they must construct a defensible argument, not just pick randomly.
  *   **Visibility:** The whiteboard tally makes the divergence public. Everyone sees that identical actions received opposite moral labels.

  ### Predicted Failures and Recovery
  1.  **Collusion:** Operations might put a chip in during Round 2 to avoid the risk.
      *   *Recovery:* If the Server survives, the round is void for the purpose of the argument. Reset immediately. Tell them: "The philosophical point requires a crash." Encourage them to risk the chips for the sake of the experiment (academic stakes).
  2.  **Audit Nihilism:** Audit might say "It doesn't matter, we'll say Let Die both times to be nice."
      *   *Recovery:* Remind them of their payoff (5 chips for correctness). Hint that "Correctness" depends on following the context provided in their Rulebook.
  3.  **Causal Realism:** A student might argue, "In Round 2, not acting *is* an action because of the contract."
      *   *Recovery:* This is actually a win for your position. Press it: "So the physical movement isn't what makes it an action? The norm makes it an action?" This concedes your point that causation isn't the sole determinant.
  4.  **Time Overrun:** Deliberation can drag.
      *   *Recovery:* Use a hard 5-minute timer for verdicts. If no unanimity, I (the instructor) flip a coin. This raises stakes.

  ### Limitations: What This Activity Cannot Do
  You will have to supply the following in your own voice during the final 10 minutes:

  1.  **The Metaphysical Leap:** The game shows that *classifications* change with norms. It does not strictly prove that *causation* itself is normative. Your friend may concede that our *language* changes but insist the underlying causal relation (counterfactual dependence) remains fixed. You must argue that selecting *which* counterfactuals matter (the baseline) is itself a normative choice, not a causal one.
  2.  **The "Worthless" Trap:** Students may conclude, "If it's all about norms, the distinction is just a tool for blame games." You must argue that the distinction is essential for liberty—it protects us from being held responsible for every death we could have prevented. The baseline isn't arbitrary; it's the boundary of our moral community.
  3.  **The Overdetermination Nuance:** The game uses a simple "any one could save" structure. It doesn't fully capture the "combined behaviour necessary" constraint you mentioned (where each omission is necessary for the death). You will need to explain verbally that even in complex collective cases, the baseline problem persists: do we view the group's inaction as a collective killing or a series of allowings? The game simplifies this to make the baseline shift visible.

  ### Bottom Line
  Run the activity. It forces students to inhabit the tension between physical facts and normative descriptions. When Operations lose chips in Round 2 despite doing nothing differently, they feel the weight of the baseline shift viscerally. This creates the "aporetic" moment you need: they cannot rely on causation alone to settle the moral description.
