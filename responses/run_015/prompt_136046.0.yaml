      *   Payoff: If "Kill," Actors lose all remaining chips. If "Let Die," Actors keep remaining chips.
      *   This creates high stakes for the Actors to argue their case to the Judges.
      *   The Judges have no stake, but want to be "Correct." I will tell Judges: "Your goal is to assign the *accurate* moral description. Accuracy will be graded." (Vague enough to let norms guide them).
      *   Actually, to make it arise from *students*, Judges should have a stake too.
      *   Judges get points for "Consistency." (I will define consistency later).
      *   No, let's keep it simple. Judges want to be fair. Actors want to save chips.
      *   The conflict arises when Actors say "We did nothing!" and Judges say "You were supposed to do something!"
      *   This mirrors the Friend's dispute (Causal facts vs Normative baseline).

      *   *Wait, one constraint:* "I would rather not name the doctrine... until the debrief."
