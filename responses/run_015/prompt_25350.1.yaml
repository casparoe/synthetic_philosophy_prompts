answer: |-
  This is a sophisticated metaontological observation, and you are right to sense that the standard taxonomy (verbal dispute, quantifier variance, deflationism) fails to capture the specific normative texture of the disagreements you are describing. You have identified a configuration that is increasingly central to contemporary metaontology but lacks a single, universally canonical label.

  The most precise existing framework for this configuration is **Conceptual Ethics** (specifically applied to ontology), and the specific type of disagreement is best labeled a **Normative Ontological Disagreement** (or a **Disagreement in Ontological Standards**).

  Here is an analysis of why this label fits, how it carves the phenomenon at the joints, and how it distinguishes itself from the neighboring categories you rightly set aside.

  ### 1. The Diagnosis: Conceptual Ethics in Metaontology

  The configuration you describe—agreement on all non-ontological (descriptive) facts, shared semantic content, but disagreement on the *application conditions* or *standards* for ontological vocabulary—is the hallmark of a **Conceptual Ethics** dispute.

  This framework, developed most prominently by **David Plunkett and Tim Shapiro** (e.g., *"Conceptual Ethics I & II,"* 2015/2017), distinguishes between:
  *   **Descriptive Disagreements:** Disputes about how the world is (which your faculty have resolved).
  *   **Normative/Conceptual Disagreements:** Disputes about which concepts we *ought* to use, or how we ought to sharpen/apply our existing concepts to the world.

  In your examples, the faculty agree on the "worldly input" (the cheese, the math, the clay) but disagree on the "conceptual output" (existence, identity). Since they agree on the meaning (the concept *exists*), the disagreement must be about the **norms governing the application of that concept**. They are not talking past each other (verbal dispute); they are fighting over which **standard of precision** or **criterion of identity** is the *correct* one to adopt for theoretical purposes.

  ### 2. Why Standard Labels Fail (and How This Succeeds)

  You correctly noted why Chalmers, Hirsch, and standard deflationism don't fit. Here is how the **Normative Ontological Disagreement** label preserves the substantive feel your participants report while acknowledging the lack of factual divergence.

  #### Vs. Chalmers-Style Verbal Disputes
  *   **Chalmers:** A verbal dispute arises from ambiguity or indexicality. Once terms are disambiguated, the disagreement dissolves, or it becomes a factual disagreement.
  *   **Your Case:** The terms are *not* ambiguous. Both parties mean "exist" in the same robust, ontological sense. The disagreement persists because they disagree on the **threshold of satisfaction** for that shared concept.
  *   **The Distinction:** In a verbal dispute, the parties are *confused*. In a Normative Ontological Disagreement, the parties are *conflicted*. They recognize the shared meaning but advocate for different **precisifications** of that meaning. It is not a failure of communication; it is a clash of theoretical values (e.g., parsimony vs. fidelity to ordinary language).

  #### Vs. Hirsch-Style Quantifier Variance
  *   **Hirsch:** "Exists" has multiple equally valid meanings (lightweight vs. heavyweight quantifiers). Both parties are right relative to their own linguistic framework.
  *   **Your Case:** The parties do not believe both are right. They believe one standard is *correct* and the other is *mistaken*. They are not relativists about the quantifier; they are **monists about the standard**. They agree there is One True Way to carve reality (or One True Standard for existence), they just disagree on what it is.
  *   **The Distinction:** Quantifier variance is metaphysically deflationary (no fact of the matter). Your participants insist there *is* a fact of the matter about which standard is correct. This makes the dispute **normative** rather than **semantic**.

  #### Vs. Straightforward Deflationism
  *   **Deflationism:** Ontological disputes are trivial or empty; once we see the linguistic rules, the "deep" mystery vanishes.
  *   **Your Case:** The participants feel the stakes are real. A Conceptual Ethics approach validates this intuition without committing to heavy-duty metaphysical facts. The "substance" lies in the **pragmatic and theoretical consequences** of adopting one standard over the other.
  *   **The Distinction:** Deflationism says "nothing is at stake." Conceptual Ethics says "what is at stake is our conceptual scheme, which is a substantive normative matter."

  ### 3. Proposed Terminology and Boundaries

  If you need a label for your dissertation or papers, I recommend **"Normative Ontological Disagreement"** situated within **"Metaontological Conceptual Ethics."**

  If you require a more specific term for the *mechanism* of the disagreement, you might call it a **"Disagreement in Ontological Standards"** or a **"Criterion Disagreement."**

  **Boundaries of the Category:**
  To ensure this doesn't collapse back into verbal disputes or realism, you should define it by three necessary conditions:
  1.  **Base-Fact Consensus:** Full agreement on all non-ontological descriptive facts (physical, modal, mathematical).
  2.  **Semantic Invariance:** Agreement on the core intension of the ontological vocabulary (e.g., both mean "mind-independent existence" or "fundamental parthood"), ruling out simple ambiguity.
  3.  **Normative Stakes:** The disagreement is driven by competing theoretical virtues (e.g., one side prioritizes *naturalness*, the other *expressive power*; one prioritizes *parsimony*, the other *phenomenological fidelity*).

  ### 4. Historical and Contemporary Anchors

  While "Conceptual Ethics" is the broader umbrella, there are specific metaontological traditions that map onto this:

  *   **Amie Thomasson's "Easy Ontology":** Thomasson argues existence questions are answered by conceptual rules. When philosophers disagree, they are disagreeing about *which rules to adopt*. While often labeled "deflationary," Thomasson acknowledges the normative weight of choosing the right conceptual framework. Your cases fit her model of **"Conceptual Disputes"** that are not merely verbal.
  *   **P.F. Strawson's "Revisionary Metaphysics":** In *Individuals*, Strawson distinguishes between describing our actual conceptual scheme and creating a better one. Your faculty are engaged in a dispute between competing **Revisionary Proposals**. They agree on the descriptive base but disagree on the proposed revision.
  *   **Theodore Sider's "Joint-Carving":** A Siderian realist would argue there *is* a fact of the matter (which structure is elite). If your participants agree on all facts *except* this one, they are effectively disagreeing about **Ontological Naturalness**. However, if they don't count "naturalness" as a first-order fact, they are back to Normative Disagreement about which property to treat as elite.

  ### 5. Recommendation for "Carving at the Joints"

  In your writing, you should explicitly frame this as a move from **Metaphysical Realism** (disagreement about the world) to **Metaontological Normativism** (disagreement about the framework for describing the world).

  You might write:
  > "This is not a verbal dispute, as the semantic content is fixed; nor is it quantifier variance, as the parties seek a single correct standard. Rather, it is a **Normative Ontological Disagreement**: a substantive clash over the criteria of application for shared ontological concepts, grounded in competing theoretical virtues rather than divergent empirical or semantic commitments."

  This allows you to honor the participants' intuition that something substantive is at stake (the *normative* choice of framework) without committing to the existence of mysterious "ontological facts" that float free of the descriptive base. It treats ontology not as a discovery of hidden objects, but as a **normative discipline of categorization**.

  ### Summary
  *   **Best Label:** Normative Ontological Disagreement.
  *   **Framework:** Conceptual Ethics (Plunkett & Shapiro) / Neo-Carnapian Normativism (Thomasson).
  *   **Key Differentiator:** The dispute is about *which standards to use*, not *what the words mean* (verbal) or *what the world contains* (realism).
  *   **Status:** Substantive, but normative rather than descriptive.

  This configuration is increasingly recognized as the "live" space of metaontology after the exhaustion of the verbal/realist dichotomy. You are tracking a genuine and significant shift in the field.
