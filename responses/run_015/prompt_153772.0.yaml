answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STATUS OF DISPOSITIONS IN THE HITCHHIKER CASE

  **Date:** October 26, 2023
  **Parties:** Commitment-Structure Realists (CSR) and Evidential-Resolutionists (ER)
  **Subject:** Adversarial Collaboration on Diachronic Rationality and Self-Binding

  ## 1. Agreed Claims

  Both camps affirm the following premises regarding the formal setup, the philosophical stakes, and the boundaries of the current dispute.

  1.  **Formal Setup:** The case involves a single agent (the Passenger) and a predictor (the Driver). The Driver offers transport from a life-threatening location to safety conditional on a promise to pay a fee upon arrival. The Driver possesses a reliable capacity to detect insincere promises (accuracy significantly >50%, ideally approaching 100%). Upon arrival, the Passenger faces a decision node where paying reduces their utility relative to not paying, and there are no future interactions, reputation effects, or external enforcement mechanisms.
  2.  **Objective of the Case:** The Hitchhiker case is intended to test whether standard decision-theoretic models, which evaluate rationality at isolated decision nodes based on causal consequences available at that moment, are sufficient for diachronic agency. Both camps agree the case is not merely about prudence but about the definition of rational agency over time.
  3.  **Rejection of Coercion:** Both camps reject the characterization of the Driver's offer as coercive. The Driver does not threaten the Passenger; the threat of death arises from the environment. The Driver merely sets a condition for aid. The puzzle arises from the Passenger's incentives, not the Driver's force.
  4.  **Rejection of Ignorance:** Both camps agree the puzzle does not rely on the Passenger's ignorance of their own future preferences or the payoff structure. The tension persists even under conditions of full transparency regarding costs, benefits, and the Driver's predictive reliability.
  5.  **Shared Goal:** Both camps seek an account of rationality that avoids self-defeat. An agent who consistently fails to secure rides due to an inability to promise sincerely is pragmatically inferior to an agent who secures rides and pays. The dispute concerns *why* the inferior agent fails and *how* the superior agent succeeds.

  ## 2. Table of Precise Disagreements

  The following table outlines the core divergences. Each position is phrased to be endorsed by its proponents and recognized as accurate by the opposition.

  | Issue | Commitment-Structure Realists (CSR) | Evidential-Resolutionists (ER) |
  | :--- | :--- | :--- |
  | **Locus of Evaluation** | Rationality must be evaluated at the **pre-departure stage**. The decision to pay at the destination is a failure of local rationality that must be overridden by a prior structural commitment. | Rationality must be evaluated over the **entire decision procedure**. The choice at the destination is not isolated; it is the output of a function that was selected (implicitly or explicitly) at the start. |
  | **Status of the Disposition** | Cultivating a disposition to pay is an instance of **"rational irrationality."** At the moment of payment, the agent acts against their dominant reasons, but this violation is required for global optimality. | Cultivating a disposition to pay is **fully rational at all stages.** Once the agent conditions on being the *type* of agent who pays, the expected utility of paying exceeds not paying, even at the destination. |
  | **Mechanism of Success** | Success requires **self-binding.** The agent must alter their future choice set or utility function (e.g., via guilt, vows, or pre-commitment) to make payment the locally rational choice. | Success requires **self-knowledge.** The agent must recognize that their current choice is evidence of their type. No alteration of the future choice set is needed; only correct conditioning on the correlation between choice and prediction. |
  | **Nature of the Paradox** | The paradox is **real and structural.** Standard decision theory generates a dynamic inconsistency that cannot be resolved without modifying the agent's architecture. | The paradox is **apparent and epistemic.** It arises from incorrectly treating the agent's future choice as a free variable independent of the predictor's prior evidence. |

  ## 3. Cruxes and Test Cases

  Resolution of the following sub-questions would significantly shift the weight of evidence toward one camp. For each crux, we specify a concrete argument or modified thought-experiment and record each camp's advance prediction.

  ### Crux 1: Transparency and the Fragility of Will
  **Question:** Does perfect introspective access to one's future choice undermine the possibility of commitment, thereby vindicating the need for structural binding?
  **Test Case:** *The Transparent Mind.* Suppose the Passenger has perfect introspective access to their own future decision *before* the Driver makes the prediction. The Passenger knows at the start whether they will pay.
  *   **CSR Prediction:** The problem intensifies. If the Passenger knows they will defect, they cannot sincerely promise, and no amount of evidential reasoning changes the fact that payment is locally dominated. This proves the need for opaque self-binding mechanisms (e.g., hypnosis or external contracts) to mask future defection.
  *   **ER Prediction:** The problem dissolves. If the Passenger knows they will defect, they know they will not be picked up. Knowing this, they update their policy to "resolve to pay." Since the resolution determines the action, the knowledge is self-fulfilling. No structural binding is required, only policy selection.

  ### Crux 2: Temporal Asymmetry vs. Logical Correlation
  **Question:** Is the Hitchhiker case structurally distinct from Newcomb's Problem due to the temporal gap between promise and payment?
  **Test Case:** *The Simultaneous Hitchhiker.* The Driver predicts the Passenger's choice while the Passenger is still in the desert, but the payment decision is made by a proxy at the destination simultaneously with the Driver's prediction (via delayed signal), removing the temporal sequence of *choice* despite the spatial separation.
  *   **CSR Prediction:** The temporal gap in the original case is essential. It creates a window for preference reversal. Removing the gap makes it Newcomb's Problem, which is easier to solve. The original case remains harder because the agent *changes* over time, requiring a bridge (commitment) across that change.
  *   **ER Prediction:** The temporal gap is irrelevant noise. The logical structure (correlation between prediction and action) is identical in both cases. If EDT solves Newcomb's, it solves Hitchhiker. The intuition that time matters is a cognitive bias, not a structural feature.

  ### Crux 3: Individual Dispositions vs. Collective Constitutions (Non-Standard Framing)
  **Question:** Can the Hitchhiker structure be resolved more effectively by collective commitment devices than by individual dispositions, suggesting the problem is institutional rather than psychological?
  **Test Case:** *The Committee Hitchhiker.* The "Passenger" is a committee of three. To be picked up, the majority must promise to pay. Upon arrival, the committee votes on whether to pay. Members can bind the committee via constitutional rules (e.g., "automatic fines for voting 'no'") established before the ride.
  *   **CSR Prediction:** Collective analogues illuminate the personal case. Individuals fail because they lack external enforcement. Committees succeed when they institutionalize binding rules. This suggests individual rationality *requires* internal institutionalization (strong self-binding) to mimic the success of collective constitutions.
  *   **ER Prediction:** Collective analogues distract from the personal case. Committees face the same regress (who binds the constitution-makers?). If the committee members are rational agents, they face the same evidential conditioning problem. Success in committees is due to altered payoff structures (fines), not a solution to the underlying decision-theoretic puzzle.

  ## 4. Note on Verbal vs. Substantive Dispute

  A portion of the disagreement appears to stem from divergent definitions of "rational action."

  *   **Verbal Component:** If "rational" is defined strictly as "maximizing utility relative to the causal options available at decision node *t*," then CSR is correct that paying is irrational. If "rational" is defined as "acting in accordance with the policy that maximizes utility over the agent's lifetime," then ER is correct that paying is rational. To the extent the debate rests solely on this terminological choice, it is verbal.
  *   **Substantive Component:** However, the dispute is not merely terminological. It concerns the **prescriptive guidance** offered to agents. CSR prescribes the construction of psychological or external barriers to future choice (making the irrational action impossible or costly). ER prescribes a shift in epistemic perspective (conditioning on one's own type) without altering the choice set. These are distinct practical recommendations. Resolving the verbal definition of "rationality" will not determine which prescriptive method is more robust, reliable, or psychologically feasible. The collaboration therefore treats the substantive disagreement regarding *mechanism* (binding vs. conditioning) as the primary object of inquiry.
