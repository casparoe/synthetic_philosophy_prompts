      *   *Self:* Is it body? Feelings? Perceptions? Mental formations? Consciousness? (The 5 Aggregates/Skandhas). No. It's a designation for the assembly.
      *   *Goal:* To show there is no permanent, unchanging *essence* (svabhava) behind the phenomena.
      *   *Key Concept:* *Anatta* (No-Self). Not that nothing exists, but that there is no *independent, permanent owner* of the experience.

