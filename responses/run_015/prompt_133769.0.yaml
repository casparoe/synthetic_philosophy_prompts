  **Conceptual Mapping (for the board, if anyone asks):**

  *   **The Dome:** Recursive syntactic capacity (the primary adaptation).
  *   **The Arches:** Cognitive processing constraints (the design necessity).
  *   **The Spandrel:** Absurdist humor/irony (the inevitable byproduct of the arches supporting the dome).
  *   **The Adaptationist Error:** Assuming the spandrel was *designed* to hold the mosaic (i.e., humor evolved *for* bonding).
  *   **The Punchline Tension:** Ontological legitimacy vs. Selective history. Does the lack of a "just-so" story diminish the phenomenological value of the trait (or the beer)?

  ***

  **The Icebreaker:**

  Two evolutionary psychologists are at the conference bar. The first gestures with his pint and says, "Laughter is clearly adaptive. It signals safety, bonds the tribe. It was selected for."

  The second swirls her whiskey. "No, it's a spandrel. An inevitable byproduct of recursive syntax trying to parse incongruity. The architecture of language necessitates it; selection didn't ask for it."

  "So you're admitting your wit serves no function?"

  "I'm admitting it wasn't *for* anything. But tell me," she says, sliding a napkin across the table, "if the arch wasn't built to hold the painting, does that make the mosaic less valuable, or just free of a just-so story?"
