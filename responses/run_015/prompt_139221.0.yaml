          *   *Requirement:* To make silence weigh against existence, you need a specific model of distribution (e.g., "civilians are common and loud").
          *   *Verdict:* It's legitimate constraint-setting, not theory-tuning. It says "If they were *here* and *like this*, we would see them." It shifts the burden of proof to modelers to propose testable distributions, not to the existence claim itself.

      *   **Part 2: Refusal to Publish Posteriors:**
          *   *Question:* Error-statistical vs. Bayesian?
          *   *Analysis:* It looks Error-Statistical (Mayo-style). "We have severely tested the claim that a signal exists in this band." It avoids the "Prior Problem." If you publish a posterior on $N$, you have to state a prior. Any prior is speculative.
          *   *Underdetermination:* A Bayesian with a diffuse prior would agree the update is tiny. So both agree on the *output*, but for different reasons. The practice presupposes that priors are currently subjective to the point of being unscientific.
