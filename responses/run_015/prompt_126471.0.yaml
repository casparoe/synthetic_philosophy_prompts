answer: |-
  To rank land-use trajectories by net welfare, an account must satisfy these specifications:

  1.  **Throughput over Stock:** Measure welfare churned per unit time (births/deaths), not cross-sectional biomass. *Motivation:* High-fecundity taxa dominate suffering; stock biases toward survivors, misrepresenting flow. *Status:* Non-negotiable.
  2.  **Margin Decomposition:** Report extensive (population size) and intensive (welfare per life) effects separately. *Motivation:* Prevents hiding suffering reductions behind population declines via density dependence. *Status:* Non-negotiable.
  3.  **Method Neutrality:** Verdicts must match for identical dynamics regardless of cause (culling vs. bulldozing). *Motivation:* Welfarism is consequentialist; means are irrelevant except via outcomes. *Status:* Non-negotiable.
  4.  **Replacement Inclusion:** Count welfare of successor communities (domesticates, synanthropes). *Motivation:* Cleared land is not void; ignoring successors biases toward conversion. *Status:* Non-negotiable.
  5.  **Temporal Neutrality:** No discounting of future welfare. *Motivation:* Time is morally arbitrary; regeneration matters. *Status:* Non-negotiable.
  6.  **Sentience Scope:** Include all plausibly sentient taxa, including invertebrates. *Motivation:* Exclusion is speciesist special pleading given biomass dominance. *Status:* Non-negotiable.
  7.  **Tractability:** Computable from available ecological data (area, density, proxies). *Motivation:* Theory must guide actual decisions despite data limits. *Status:* Preference (Uncertain).
  8.  **Negative Consistency:** If wild welfare is net negative, habitat loss reduces suffering. *Motivation:* Logical consistency; resistance is prejudice against extinction implications. *Status:* Non-negotiable.
  9.  **Uncertainty Protocol:** Specify expected-value maximization vs. precautionary thresholds. *Motivation:* Thick uncertainty precludes precise sums. *Status:* Contested.

  **Incompatibilities:** Temporal Neutrality (5), Sentience Scope (6), and Tractability (7) cannot jointly hold. Far-future invertebrate welfare dominates any calculable present trade-off, rendering the account action-guiding only if purity is sacrificed.

  **Most Ruling-Out:** Negative Consistency (8). It forces acceptance of counterintuitive verdicts (e.g., clearance good) if wild suffering dominates, eliminating "conservation-aligned" welfarism that assumes wild lives are positive.

  **Position Scorecard:**
  | Position | Verdict on Protection | Welfarist Compliance |
  | :--- | :--- | :--- |
  | Wild Positive | Protect | Fails if wild welfare < 0 (Violates Negative Consistency) |
  | Wild Negative | Convert/Manage | Passes Negative Consistency; Fails Conservation Intuition |
  | Non-welfarist | Protect | Fails all welfarist specs (Rejects summation) |
  | Agnostic | Protect | Fails Uncertainty Protocol (Refuses net verdict) |

  If forced to abandon one requirement, I would drop Temporal Neutrality to prevent far-future domination from paralyzing present action. The list would fundamentally change if empirical work demonstrated that invertebrate sentience is negligible or that density dependence strictly caps suffering rates.
