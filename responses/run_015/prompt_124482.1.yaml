answer: |-
  You have described a phenomenon that is structurally distinct from the standard models of social influence, and your skepticism about fitting it into "herding," "polarization," or "pluralistic ignorance" is well-founded. Those models generally rely on changes in private belief or information asymmetry. Your observation describes a scenario where private belief is stable and shared, but the *public cost of expressing that belief accurately* increases dynamically.

  There is no single, canonical term in the social sciences that captures this exact "endogenous ratchet of expressive intensity." However, it can be carved precisely by intersecting three established frameworks: **Preference Falsification** (Timur Kuran), **Signaling Theory** (specifically regarding audience costs), and **Common Knowledge Generation**.

  Here is the carving you requested, distinguishing the mechanism, the incentives, the limits, and the downstream consequences.

  ### 1. The Core Mechanism: Dynamic Preference Falsification
  The closest established concept is Timur Kuran's **Preference Falsification**. Kuran describes the gap between private preferences and public expressions. However, standard preference falsification models often focus on a static equilibrium (everyone publicly supports the regime, privately opposes it) or a tipping point (the revolution).

  Your phenomenon is a **Dynamic Expressive Equilibrium**.
  *   **Why standard models fail:** In a standard cascade, I follow you because I think you know something I don't. In your scenario, I know you don't believe the hyperbole, and you know I know.
  *   **The Carving:** This is not informational; it is **performative coordination**. The group is coordinating on a *level of intensity*, not a *direction of choice*. The "ratchet" exists because the definition of "sincere assent" is indexical—it depends on the previous utterance. If Speaker A says "Good," Speaker B saying "Good" sounds like "Not Great." To signal "I am with the group," Speaker B must say "Excellent."
  *   **The Name:** In game-theoretic terms, this is a **Signaling Game with Escalating Thresholds**. The signal is not *choice* (Yes/No) but *magnitude* (Yes/YES/YES!).

  ### 2. Defensive vs. Competitive Escalation
  You asked to distinguish between avoiding dissent and seeking credit. These are two different payoff structures that produce the same ratchet.

  *   **Defensive (Assurance Signaling):**
      *   *Motivation:* Avoid the reputational penalty of being the "weak link" or the "skeptic."
      *   *Mechanism:* The cost function is asymmetric. Under-shooting the current intensity bar incurs a high penalty (being read as a dissenter). Over-shooting incurs almost no penalty (cheap talk).
      *   *Stability:* This creates a stable, high-intensity equilibrium. Everyone is miserable but safe. This fits your **faculty search** example.
  *   **Competitive (Status Bidding):**
      *   *Motivation:* Gain status by appearing more committed/virtuous than peers.
      *   *Mechanism:* The payoff is relative. I gain not just by being "loud," but by being "louder than you."
      *   *Stability:* This creates a volatile bubble. It fits your **misconduct allegation** example. Here, the ratchet spins faster because the reward for escalation is positive (moral credit), not just negative (avoiding blame).

  **Distinction:** In defensive ratchets, the group stops when the risk of external contradiction becomes too high. In competitive ratchets, the group stops only when the hyperbole becomes physically impossible to maintain.

  ### 3. Cheap Talk vs. Audience Costs
  You noted the material costs almost nothing to produce. This is crucial. In economics, this is "Cheap Talk." Normally, cheap talk cannot sustain an equilibrium because it is non-credible. However, you have identified the binding constraint: **Retraction Costs (Audience Costs).**

  *   **The Asymmetry:** It costs nothing to escalate from "concern" to "fury." It costs *everything* to de-escalate from "fury" back to "concern."
  *   **The Mechanism:** Once a higher intensity is established, it becomes the new **Common Knowledge** baseline. To revert to the private truth is to signal defection. In International Relations, this is called **Audience Costs**: a leader pays a domestic political price for backing down on a public threat.
  *   **The Carving:** In your committees, the "audience" is the other committee members. The "cost" is social capital. Because the cost of *speaking* is near-zero, but the cost of *contradicting the public record* is high, the ratchet only turns one way.

  ### 4. The Ceiling: Where Hyperbole Meets Resource Allocation
  You asked what sets the ceiling, given that language is finite. The ceiling is determined by the **Cash-Out Point**.

  *   **The Limit:** The ratchet can spin indefinitely as long as the commitment remains rhetorical. It jams when the commitment requires **Revealed Preference** via resource allocation.
  *   **Example:** In the internal review, management can restate a proposal in stronger terms up the chain. The ratchet jams when the CEO asks, "Great, so we are shifting 20% of the budget to this?"
  *   **The Detection:** The ceiling is found where the *cost of the action* exceeds the *reputational benefit of the agreement*. In the misconduct example, the ceiling is reached when someone is asked to actually fire the person or sue, rather than just condemn.
  *   **Inflation:** You are correct that hyperbole inflates into worthlessness. When "catastrophic" becomes the baseline adjective, language loses its discriminatory power. The group then invents new intensifiers or moves to non-verbal signaling (walkouts, resignations) to clear the bar.

  ### 5. Detection: Distinguishing from Genuine Cascades
  How does an outsider tell this apart from a genuine cascade where conviction actually spreads?

  *   **The Action-Word Gap:** In a genuine cascade, public expression aligns with private resource allocation. In this ratchet, there is a divergence. Look for **over-signaling and under-investing**. If the committee calls a candidate "transformative" but offers them a standard package, it's a ratchet. If the community expresses "fury" but takes no tangible action against the accused, it's a ratchet.
  *   **The Speed of Consensus:** Genuine belief change takes time (processing evidence). Expressive ratcheting is instantaneous. If the "intensity" shifts faster than the information flow allows for cognitive processing, it is performative.
  *   **The Uniformity:** Genuine belief distributions are normal curves. Expressive ratchets produce truncated distributions (everyone is at the maximum intensity).

  ### 6. The Downstream Effect: Institutional Memory Distortion
  You asked if the archival record feeding future herding is a separate phenomenon or the point. **It is the point.**

  This is the mechanism by which the ratchet becomes institutionalized.
  *   **The Mechanism:** The public record converts **Mutual Knowledge** (we all know we are moderates) into **Common Knowledge** (the record says we are extremists, and we all know the record says that).
  *   **The Consequence:** Future committees (who were not present) treat the archive as data. They suffer from an **Informational Cascade based on Falsified Data**. They assume the previous group's intense language reflected intense private belief. To match that perceived standard, they must start at a higher baseline than the previous group *actually* held, though perhaps equal to what the previous group *said*.
  *   **The Name:** This is **Path Dependence via Record Distortion**.
  *   **Why it matters:** This explains why institutions drift toward extremism or rigidity over decades without anyone ever voting for it. The "minutes" of the organization become a fiction that constrains the future reality. The ratchet is not just a social dynamic; it is a **knowledge management failure**.

  ### Summary of the Carving

  If you need a label to search for or coin, the most precise description is **Expressive Escalation under Audience Costs**.

  *   **It is not Herding:** No private signal is discarded.
  *   **It is not Polarization:** No private belief is shifted.
  *   **It is not Pluralistic Ignorance:** Participants are often aware of the falsification.
  *   **It is Preference Falsification:** But dynamic, not static.
  *   **It is Signaling:** But the signal is intensity, not direction.

  The phenomenon persists because the **cost of truth-telling (social defection)** exceeds the **cost of lying (cheap talk)**, and the **archive locks in the lie** as the baseline for the next round. The tragedy is not that the group decides wrongly; it is that the group decides correctly (in private) but binds its future self to a fiction (in public) that eventually forces its hand.
