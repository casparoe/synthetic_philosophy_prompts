answer: |-
  **TO:** Commemoration Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Flats Neighborhood Memorial Grant Application

  **RECOMMENDATION**
  **Fund with Conditions.**

  The Committee recommends approval of the state heritage grant application for the Flats Neighborhood Memorial, contingent upon revision of the proposed marker text. The current draft fails the grant requirement for historical accuracy regarding the mechanism of the flood; however, the core narrative of systemic sacrifice is supported by the archival record. Funding should be authorized only if the final text distinguishes between the *physical cause* of the flood and the *political cause* of the neighborhood's erasure.

  **MARKER TEXT GUIDELINES**
  To satisfy both the grant requirements and the community's need for recognition, the final marker text must adhere to the following:

  1.  **May Not:** State as fact that city engineers opened the upstream gates to flood the Flats. The hydraulic and operational records (gate logs, telegraph traffic) do not support a deliberate breach order.
  2.  **May:** State that for ninety years, the surviving community has maintained the belief that the gates were opened deliberately. This belief is a historical fact in itself.
  3.  **Must:** Explicitly detail the post-flood administrative actions. The record confirms that downtown property owners were compensated, Flats residents were not, and the land was rezoned to prevent rebuilding.
  4.  **Tone:** The text should frame the tragedy not merely as a hydraulic failure, but as a civic choice made *after* the water receded. The "deliberate act" was not the flooding, but the refusal to rebuild.

  **RATIONALE**
  This decision navigates between two competing obligations: fidelity to the archival record and fidelity to the lived experience of the marginalized.

  *The Archival Constraint:* As a condition of the grant, we cannot endorse a narrative contradicted by the primary physical evidence. To do so would undermine the credibility of the commemoration program and invite legitimate historical criticism.

  *The Epistemic Obligation:* We must acknowledge that the available archives were generated by the city and the mill owners—the very parties with an incentive to obscure negligence. The Flats residents, being immigrant renters, left no written record. To privilege the city's logs over the community's memory without context is to replicate the power dynamic that erased the Flats in the first place.

  *The Synthesis:* The descendants' memory is "structurally true" even if the "mechanical detail" is contested. The outcome—downtown saved, Flats sacrificed—matches the memory of a deliberate sacrifice. The marker will therefore honor the memory by recording its persistence, while honoring the history by recording the documented administrative decisions that confirmed the community's fate.

  **PRECEDENT FOR FUTURE CASES**
  To guide the Committee on the three pending applications involving contested history, we propose the following standard:

  > *"When institutional records and community memory conflict, the marker must accurately reflect the archival evidence while explicitly acknowledging the persistence and structural logic of the community narrative, particularly where outcomes disproportionately impacted marginalized groups."*

  ***

  ### Private Briefing: Notes for the Chair

  You asked me to tell you straight if your intuition is a dodge, to give the losing side its best shot, and to clarify the standard. Here is the unvarnished assessment for your use in the closed session.

  **1. Is your "Walk vs. Plaque" idea a dodge?**
  It is **not a dodge**, provided you frame it correctly. It becomes a dodge only if you use the distinction to dismiss the memory as "just folklore."
  *   **The Dodge:** "The plaque is for facts, the walk is for feelings. We fund the walk's feelings but the plaque must stick to the city's logs." (This silences the community).
  *   **The Non-Dodge:** "The plaque records *history*, and the history includes the fact that this community believes they were sacrificed. The walk enacts that memory; the plaque explains why that memory exists."
  *   **Why it works:** In social epistemology, testimony carries weight. When official records are produced by a single interested party (the city), oral tradition acts as a counter-archive. By inscribing the *belief* on the plaque, you validate the testimony without falsifying the hydrology.

  **2. The Losing Side's Best Shot (The "Silencing" Argument)**
  Be prepared for this argument from the committee members who want to fund the draft as-is. They will say:
  *"The archives are the tools of the oppressor. The city engineer's log is a legal document designed to prevent liability. The mill owner's newspaper was propaganda. To say we must trust those documents over the grandmothers of the Flats is to say that only the powerful are allowed to write history. If the outcome looks exactly like a sacrifice (no money for us, money for them, zoning to keep us out), then the 'truth' of the logs is irrelevant. The functional truth is that we were sacrificed. Requiring them to change the text is asking them to apologize for their own trauma."*
  **Counter:** You agree with the premise (the outcome was a sacrifice) but not the conclusion (the text must be physically false). You are arguing that the *rezoning* is the smoking gun, not the *gate lever*.

  **3. The Standard (Refined)**
  The sentence in the memo above is the bureaucratic version. Here is the philosophical version for your discussion:
  *"We do not commemorate only what happened; we commemorate what was done to people, and what they remember was done to them."*

  **4. Hydrologist-to-Hydrologist Note**
  You know better than anyone that levees rarely fail because of a single lever pull. They fail because of maintenance, design, or neglect. The "deliberate breach" story is a myth, but the "deliberate neglect" is likely fact. The 1913 flood was the excuse the city needed to clear the land. That is the truth worth marking. It absolves the engineer of the specific act but indicts the city of the specific intent. That is a compromise the descendants can live with, because it confirms they were discarded.
