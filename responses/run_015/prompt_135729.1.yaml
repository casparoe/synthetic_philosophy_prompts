  2. Lewis's proof primarily relies on the assumption that one can condition on the conditional itself alongside the law of total probability, rather than the specific negation equivalence your friend described. Consequently, attributing the result to a rule about negated conditionals constitutes a subtle misrepresentation of the technical derivation.

  3. The inference that conditionals must therefore be purely pragmatic devices lacking truth conditions faithfully reflects Lewis's own philosophical conclusion following the mathematical proof. This stance effectively denies that indicative conditionals express propositions, thereby sidestepping the triviality problem entirely.

  4. Your scepticism regarding Bayesian incoherence is well-founded, as the result implies conditionals cannot serve as standard evidence rather than rendering the entire updating framework logically flawed. The claim that conditioning on an 'if' statement adds no information is a consequence of the triviality, not a proof that Bayesian reasoning itself is fundamentally broken.

