  I was discussing language and reasoning with some friends over coffee, and one of them mentioned a philosophy podcast she had heard summarising a well-known result about everyday "if...then" statements. She relayed the host's account of David Lewis's argument concerning indicative conditionals, and I want to check whether she has captured it fairly or introduced distortions. According to her, Lewis demonstrated that if you treat an indicative conditional "if A, then B" as having a probability equal to the conditional probability of B given A — a view often called Adams's thesis — and you combine this with three apparently innocent rules, namely that conditionals can be freely embedded inside one another, that the negation of a conditional is equivalent to the antecedent paired with the negated consequent, and that probabilities must update in a coherent manner, then you are driven to a trivial result: the probability of the conditional collapses to the unconditional probability of the consequent, so the antecedent carries no weight whatsoever. The host apparently concluded that indicative conditionals therefore lack any real truth conditions and should be regarded as purely pragmatic devices governed by conversational norms rather than by logic; she also noted that Lewis escaped an analogous problem for counterfactuals by analysing them through relations of similarity between possible worlds, leaving indicative conditionals as an unsolved puzzle. My friend added that this implies Bayesian updating with ordinary indicative premises is essentially incoherent, because conditioning on an "if" statement adds no information beyond conditioning on the consequent alone, and she wondered whether a weaker formulation using only import-export rather than full conditional negation avoids the collapse. I am not convinced that the conclusion about Bayesian incoherence follows, and I suspect the summary may conflate Lewis's actual assumptions with stronger ones that critics have