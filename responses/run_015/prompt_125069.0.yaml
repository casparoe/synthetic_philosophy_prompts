  **Joint Statement on Procedural Harm in Generative Virtual Environments**

  We, the undersigned representatives of virtual realism and virtual irrealism, submit this joint statement regarding procedural harm. We define this as psychological or social damage arising from emergent algorithmic rules rather than direct agent action. Our collaboration aims to clarify where our metaphysical disagreements impact ethical assessments of code.

  **Technical Consensus**
  We agree that generative environments operate via deterministic or probabilistic code structures that produce outcomes without real-time human intervention. We acknowledge that procedural generation can create scenarios—such as terrain isolation, resource scarcity, or animation errors—that correlate with measurable user distress, including feelings of loneliness, frustration, or stigmatization. We concede that these outcomes are not necessarily bugs but often features of the system's architectural logic. Furthermore, we agree that the user perceives these outputs as meaningful experiences within the context of the simulation, regardless of the underlying binary mechanics. The causal link between code execution and user emotional state is empirically verifiable by both camps.

  **Ontological Disagreement**
  Regarding the status of this harm, we diverge fundamentally.
  The Realist camp contends: Procedural harm is constitutive of the virtual event itself. When the algorithm isolates an avatar, the avatar is genuinely isolated, and the user suffers a real ontological injury within the digital context. The virtual event is not a picture of harm; it is an instance of harm.
  The Irrealist camp maintains: Procedural harm is merely representationally mediated. The algorithm manipulates symbols, and any distress is a psychological reaction to those symbols, not an injury instantiated by the virtual object. The virtual event is a fiction that causes real feelings, but the harm itself remains in the mind, not the machine.

  **The Cruxes**
  Our disagreement rests on two philosophical cruxes. First, does causal efficacy in harm require agent-directed intention? Realists argue that causal chains suffice; if the system produces a harmful outcome, the lack of human intent does not negate the harm's reality. Irrealists argue that moral harm requires a moral agent; without intent, there is only unfortunate causality, not moral injury. Second, can representational content carry moral weight independently of its referent? Realists argue the content is the reality; the digital signifier is the signified. Irrealists argue content is only significant insofar as it affects the physical mind; the representation is inert without a viewer to赋予 it meaning. These distinctions determine whether liability lies with the code's output or the user's interpretation.

  **Hypothetical Cases**
  To test these cruxes, we agree on the following cases and record our divergent analyses in advance.

  *Case 1: The Archipelago Algorithm.* A map generator systematically places a specific user avatar on inaccessible islands due to a seed value correlation with their username, preventing social interaction.
  Realist Analysis: This is exclusionary harm. The system enacted a barrier equivalent to physical segregation, causing real social injury regardless of developer intent. The isolation is ontologically genuine within the virtual world.
  Irrealist Analysis: This is unintended output. Without a designer intending exclusion, there is no moral wrong, only a user's subjective feeling of isolation triggered by random code. The isolation is representational, not actual.

  *Case 2: The Dignity Glitch.* A procedural animation rule causes avatars of a certain demographic to clip through floors visually more often than others, appearing unstable or broken.
  Realist Analysis: The virtual body is degraded. This constitutes a direct assault on digital dignity because the virtual body is the user's locus of agency. The glitch is a real defect in the person's digital existence.
  Irrealist Analysis: The pixels are neutral. The harm exists only if the user interprets the clipping as derogatory; the code itself holds no moral valence without human interpretation. The glitch is a visual error, not a moral failure.

  **Conclusion**
  We remain at an impasse regarding the ontology of virtual harm. However, we agree that regardless of metaphysical status, designers bear responsibility for mitigating the psychological effects of procedural generation. We commit to further collaboration on ethical design frameworks that address these divergent ontological views, ensuring safety whether the harm is real or represented. This adversarial collaboration proves that ethical consensus is possible even when metaphysical consensus is not.
