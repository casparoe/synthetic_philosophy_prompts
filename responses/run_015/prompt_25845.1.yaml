  ### Applying the Principle to Your Cases

  Here is how the Mandate Distinction explains your reactions:

  **Case 1 & 2: Appellate Panel (Authority Mandate)**
  *   **Your Verdict:** CBP (Case 1) is unproblematic; PBP (Case 2) is defective.
  *   **Analysis:** Appellate judges are not merely fact-finders; they are co-equal authorities exercising legal discretion. Their vote *creates* the law of the case. If a majority of the authorized decision-makers believe the defendant is not liable, ruling them liable undermines the democratic legitimacy of the panel. Here, the "will of the judges" is the source of authority.
  *   **Fit:** Perfect. You prioritize **Responsiveness** (to the judges' will) over **Integrity** (of the logical premises).

  **Case 3: Tenure Committee (Rule-Application Mandate)**
  *   **Your Verdict:** PBP is unproblematic.
  *   **Analysis:** The committee is not deciding "Do we like this person?" but "Does this person meet the University's standards?" The criteria (Research, Teaching, Service) are external hurdles set by policy. PBP ensures that the candidate actually cleared every hurdle.
  *   **Caveat:** Your intuition holds *only if* you assume the "Yes" voters overlap significantly. If the coalitions are totally fragmented (like Case 5), this case becomes structurally identical to Case 2. However, because tenure is viewed as a checklist of objective(ish) metrics rather than a holistic legal judgment, you correctly categorize this as Rule-Application.
  *   **Fit:** Good. You prioritize **Integrity** (of the tenure standards).

  **Case 4: Jury (Fact-Finding Mandate)**
  *   **Your Verdict:** PBP is unproblematic/required.
  *   **Analysis:** The jury is a fact-finding body bound by the Judge's instructions (external rules). They do not have the authority to decide "Is he guilty?" based on a holistic vibe; they must find that the specific elements defined by the state are proven. PBP protects the defendant by ensuring every element is proven to the required standard.
  *   **Fit:** Perfect. This is the purest form of Rule-Application.

  **Case 5: Ethics Committee (Rule-Application + Pareto Violation)**
  *   **Your Verdict:** PBP is absurd.
  *   **Analysis:** This is a Rule-Application mandate (like Tenure), *but* it triggers the **Pareto Constraint**. Every single member believes the study should be rejected. When PBP produces a result that *no one* wants, it suggests the criteria are being gamed or the aggregation is masking a consensus that the project is flawed. It violates the basic rationality of the group.
  *   **Fit:** Perfect. Rule-Application is good, but not when it violates unanimity.

  **Case 6: Appointments Committee (Hybrid Mandate)**
  *   **Your Verdict:** Mildly bothered.
  *   **Analysis:** This sits between Judges and Tenure. Hiring involves checking boxes (Qualifications) but also holistic judgment (Interview). It feels more like Rule-Application than the Court case (hence your reaction is milder), but because a majority opposes the hire, your "Authority" alarm bells are ringing.
  *   **Fit:** Consistent. You are sensing the tension between the two mandates.

