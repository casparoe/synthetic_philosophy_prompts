answer: |-
  You have independently rediscovered one of the most significant problems in social choice theory and legal philosophy, known as the **Discursive Dilemma** (or the **Doctrinal Paradox**). It was famously formalized by legal scholars Lewis Kornhauser and Lawrence Sager, and later by philosopher Philip Pettit.

  Your intuitions are sophisticated and largely consistent with a specific philosophical distinction. You do not need to abandon your verdicts; rather, you need a principle that distinguishes between **applying external standards** and **exercising collective authority**.

  ### The Principle: The Mandate Distinction

  The principle that best captures your six verdicts is the **Mandate Distinction**. It asks: *What is the primary function of this group?*

  1.  **Fact-Finding / Rule-Application Mandate:** The group's job is to determine whether external standards (laws, policies, regulations) have been met. The "truth" of the premises matters more than the aggregate will of the members.
      *   *Procedure:* **Premise-Based (PBP)** is preferred. It ensures the external standards are actually satisfied.
  2.  **Authority / Will-Formation Mandate:** The group's job is to exercise discretion, interpret ambiguous standards, or aggregate preferences. The collective will of the members constitutes the legitimacy of the outcome.
      *   *Procedure:* **Conclusion-Based (CBP)** is preferred. It ensures the outcome reflects the majority's judgment.

  There is also a **Constraint**: Even under a Rule-Application mandate, if the procedure yields an outcome that **unanimously** contradicts the members' judgments (a Pareto violation), the procedure is defective because it indicates the criteria or the process have detached from reality.

