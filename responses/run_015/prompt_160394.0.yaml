      *   *Island Universes:* Highlights the relational vs. intrinsic debate. If no relations hold, is there still distinctness? Side B says "different component" is a relation. Side A says that's just distinctness disguised. This confirms the "Grounding" diagnosis.
      *   *Three Spheres:* Highlights symmetry vs. number. Shows that weak discernibility can exist without absolute discernibility. This suggests the issue isn't "can we tell them apart?" but "what constitutes their twoness?"

