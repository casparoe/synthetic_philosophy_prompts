answer: |-
  Here is the carving you asked for.

  ### 1. The Setup Name
  The game setup you described is formally called **Program Equilibrium** (introduced by Moshe Tennenholtz). In informal circles, specifically those discussing AI alignment and logical decision theory, it is often called the **Open-Source Prisoner's Dilemma** or **Transparent Prisoner's Dilemma**.

  ### 2. Is your argument right?
  **Yes.** Your argument is correct. A program that satisfies all three of your conditions cannot exist.

  There is no "ideal program." If you attempt to write it, you are attempting to define a function $P$ such that for all opponent programs $Q$:
  $$P(Q) = \text{Cooperate} \iff Q(P) = \text{Cooperate}$$
  (assuming "never be exploited" implies you defect if they defect).

  If you assume $P$ always halts (always outputs a move), then $P(Q)$ is a well-defined boolean value. Your "spoiler" program $S$ is defined as:
  $$S(P) = \text{Cooperate} \iff P(S) = \text{Defect}$$
  Substituting $S$ into $P$'s rule creates the contradiction:
  $$P(S) = C \iff S(P) = C \iff P(S) = D$$
  $$P(S) = C \iff P(S) = D$$
  This is a logical contradiction. No such total function exists.

  ### 3. Liar Paradox vs. Halting Problem
  It is **the Liar Paradox in a costume**, not the Halting Problem.

  *   **The Halting Problem** says you cannot *compute* the outcome of an arbitrary program. If your objection relied on "my program can't simulate yours in time," that would be the Halting Problem.
  *   **Your Argument** explicitly grants the program "magic" ability to know the outcome. Even with an oracle that instantly tells you what the opponent does, the logical contradiction remains.

  The structure is **Diagonalization**. You are constructing a program $S$ that specifically inverts the output of $P$ when $P$ is run on $S$. This is exactly the mechanism behind "This sentence is false." The impossibility is logical, not computational.

  ### 4. The Three-Way Squeeze
  Your "three-way squeeze" is the correct way to carve the space. You must drop exactly one of the following:

  1.  **Totality:** Always output a move. (Drop this $\rightarrow$ Your program hangs on the spoiler.)
  2.  **Unexploitability:** If opponent defects, you defect. (Drop this $\rightarrow$ You let the spoiler exploit you.)
  3.  **Perfect Fairness:** Cooperate iff opponent would cooperate with you. (Drop this $\rightarrow$ You defect against the spoiler even if it would have cooperated.)

  **Which leg do you drop?**
  In the working versions you've seen (like FairBot), they drop **Perfect Fairness**.
  They replace "Cooperate iff you *do* cooperate" with "Cooperate iff I can *prove* you cooperate."
  This creates a gap between **Truth** (what the opponent actually does) and **Provability** (what you can know). Against your spoiler $S$, the FairBot cannot prove $S$ will cooperate (because $S$'s behavior depends on FairBot's proof, creating a loop the logic system cannot resolve). So FairBot defaults to Defect. $S$ sees Defect and Cooperates. FairBot is not "fair" in your strict sense (it didn't match $S$'s cooperation), but it avoided the contradiction and got a better payoff than mutual defection.

  ### 5. Does the spoiler's self-sabotage matter?
  **No.** The impossibility survives regardless of the spoiler's payoff.
  Game theory usually assumes agents try to maximize payoff. Your spoiler $S$ acts irrationally in one branch (cooperating against a defector to get the sucker payoff). However, we are not asking "Will a rational agent play $S$?" We are asking "Does the function $S$ exist?"
  The function $S$ is computable. It exists. The fact that $S$ is a "spiteful" program doesn't change the fact that $P$ must define an output against it. Since $P$'s definition leads to a contradiction against $S$, $P$ cannot exist. The existence of the counter-function is enough to break the ideal program, regardless of whether the counter-function is "reasonable."

  ### 6. The Named Concept (Coining)
  There is no single standard theorem name for this specific impossibility in game theory literature (it is usually subsumed under general diagonalization arguments). To give you the handle you need for this specific constraint violation, I will coin the term:

  **The Reciprocity Diagonal**

  **Definition:** The logical impossibility of constructing a total computable strategy in a transparent game that achieves perfect outcome reciprocity (matching the opponent's move exactly) against all computable opponents.

  **Boundary Case 1 (Falls under The Reciprocity Diagonal):**
  *   **Program:** `FairTry(P)`: Run `P(FairTry)`. If `C`, output `C`. If `D`, output `D`.
  *   **Reason:** This program attempts Perfect Fairness + Totality. When played against the spoiler `Spoil(Q)`: Run `Q(Spoil)`. If `C`, output `D`. If `D`, output `C`. The system crashes into `C <-> D`. It is impossible to instantiate.

  **Boundary Case 2 (Does NOT fall under The Reciprocity Diagonal):**
  *   **Program:** `FairBot(P)`: If `Provable(P(FairBot) == C)`, output `C`. Else output `D`.
  *   **Reason:** This program drops Perfect Fairness. Against the spoiler `Spoil`, `FairBot` cannot prove `Spoil` will cooperate. `FairBot` outputs `D`. `Spoil` sees `D` and outputs `C`. The moves do not match (`D` vs `C`). The biconditional link is broken. The logical contradiction is avoided because `FairBot` does not claim to cooperate with *everything* that would cooperate, only everything it can *prove* will cooperate.

  ### Summary
  *   **Setup:** Program Equilibrium / Open-Source PD.
  *   **Impossibility:** Real. You cannot have Totality + Unexploitability + Perfect Fairness.
  *   **Root Cause:** The Reciprocity Diagonal (Logical Diagonalization / Liar Paradox).
  *   **Solution:** Sacrifice Perfect Fairness. Use Provability (Löb's Theorem) to cooperate with a subset of partners while defecting against the paradoxical spoilers.
