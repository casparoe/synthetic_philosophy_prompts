      *   **Underdetermined/Pragmatic:** The state isn't a philosopher-king. It's a set of compromises.
          *   *Fit:* Explains the contradictions. It's a "modus vivendi" rather than a principled consensus.

  4.  **Drafting the Response - Section by Section:**

