answer: |-
  You asked me to tell you straight up if you're confused about the framing, so here is the direct answer: **You are not confused about the tension, but you are likely looking for a coherence that does not exist.**

  There is no single, consistent implicit theory governing that bundle of practices. If you try to force Rawls, or Habermas, or a strict separationist view onto the whole system, the fabric tears. The reality of liberal democracies (particularly the U.S., but also many European variants) is not a philosophical system; it is a **pragmatic modus vivendi** held together by institutional compartmentalization.

  Here is the breakdown of why that "bundle" doesn't presuppose one theory, why the Rawlsian frame is insufficient, and what happens if you actually try to standardize it.

  ### 1. The Institutional Schizophrenia
  You identified four distinct practices. Each operates on a different logic of legitimacy:

  *   **Legislators (The Logic of Representation):** When a senator cites Scripture on bioethics, they are operating under a logic of **constituency representation**, not public reason. Their legitimacy comes from being elected by people who *hold* comprehensive doctrines. If they bracketed their deepest convictions, they might fail to represent the moral intensity of their voters. The implicit theory here is *pluralistic expression*: the legislature is a marketplace of ideas, including religious ones.
  *   **Courts (The Logic of Justification):** When a constitutional court strikes down a law for lacking a secular purpose, they are operating under a logic of **coercive legitimacy**. Since the state holds a monopoly on violence/coercion, the justification must be accessible to the coerced. The implicit theory here is *neutrality*: the state cannot take sides on ultimate truth.
  *   **Grants (The Logic of Efficiency/Pluralism):** When the state funds faith-based services, it is operating under a logic of **service delivery**. The state admits it cannot meet social needs alone. The implicit theory is *functional secularism*: as long as the accounting is secular and the service is provided, the metaphysical identity of the provider is irrelevant.
  *   **Schools (The Logic of Socialization):** When schools teach "civic reasoning," they are teaching a **normative ideal**, not describing the current reality. They are training students for the *Court's* logic, not the *Legislature's* reality.

  **The Verdict:** These are not four pillars of one temple; they are four different buildings on the same plot of land. There is no single "implicit theory" because the state is not a unitary moral agent. It is a collection of competing institutions balancing **representation** (legislature), **rights** (courts), **welfare** (grants), and **citizenship** (schools).

  ### 2. Why Rawls Doesn't Fully Fit
  You asked if this is Rawls's split between the public political forum and the background culture. It's close, but Rawls is actually stricter than current practice.

  In *Political Liberalism*, Rawls introduces the **"Proviso."** He allows citizens (and legislators) to introduce comprehensive doctrines (like religion) into public political discussion *provided that* in due course, they present properly public reasons to support their stance.

  **The Mismatch:** In the real world, legislators often cite Scripture *without* providing the secular translation, and they are rarely penalized for it. Courts sometimes strike down laws precisely because that translation *never happened*.
  *   If the system were truly Rawlsian, legislators would be culturally shamed or procedurally blocked from voting on religious grounds alone.
  *   If the system were truly "quarantine" (incommensurability), faith-based grants wouldn't exist.

  The actual practice is **looser than Rawls** regarding legislators (allowing religious motivation) but **stricter than Rawls** regarding courts (striking down laws that lack secular justification).

  ### 3. The "Underdetermined" Hypothesis is Correct
  Your hypothesis that this is "philosophically underdetermined" is the strongest reading. The system fits both **respect-as-noncoercion** (courts protecting minorities from religious law) and **respect-as-acknowledgment** (funding religious groups and letting legislators speak religiously).

  This isn't a bug; it's a feature of liberal stability.
  *   If you lean too hard into *noncoercion* (strict secularism), you alienate religious citizens who feel their identity is excluded from public life (leading to polarization).
  *   If you lean too hard into *acknowledgment* (full religious integration), you risk theological civil war (leading to instability).

  The "theory" is actually **strategic ambiguity**. The state keeps the definition of "public reason" vague enough to let religious people feel at home, but precise enough in the courts to prevent theocracy.

  ### 4. The Counterfactual: Applying the School Standard Everywhere
  You asked what would happen if we applied the "civic reasoning" curriculum (bracketing deepest convictions, arguing only from shared premises) to parliamentary debate and grant conditions.

  **If applied to Parliament:**
  *   **Legislative Paralysis:** Many moral movements rely on comprehensive doctrines for their energy. The Civil Rights Movement was deeply theological (King). Abolition was deeply theological. If you require MLK to argue *only* from shared secular premises without referencing God's law, you strip the movement of its motivational power.
  *   **Technocratic Drift:** Debate would shift entirely to cost-benefit analysis. Questions of *justice* or *sin* (which often drive bioethics or welfare) would be inadmissible. Politics would become purely managerial.

  **If applied to Grants:**
  *   **Collapse of the Safety Net:** In many liberal democracies, religious organizations provide a massive chunk of social services (homeless shelters, addiction recovery, adoption). If you require them to bracket their religious identity to get funding (e.g., forcing a Catholic charity to hire staff who contradict its mission, or strip religious counseling from its program), many will opt out.
  *   **State Expansion:** The state would have to build a massive bureaucracy to replace the faith-based providers, increasing state power and reducing local community autonomy.

  ### 5. Conclusion: The "Two-Register" System
  You aren't confused, but you are expecting a philosophical consistency that liberal democracies explicitly reject in favor of stability.

  The implicit theory is a **Two-Register System**:
  1.  **The Register of Motivation (Legislature/Voters):** Anything goes. Religious, secular, ideological. This is where the *will* is formed.
  2.  **The Register of Validation (Courts/Administration):** Public reason only. This is where the *law* is tested.

  The tension you see is the friction between these two registers. The school curriculum teaches the second register because that is what keeps the peace. The legislative reality reflects the first register because that is how people actually live.

  **Straight Talk:** If you are looking for a consistent normative theory that justifies all four of those practices simultaneously, **it doesn't exist.** You are observing a historical compromise, not a philosophical deduction. The system works *because* it is underdetermined, allowing different groups to project their own theory of legitimacy onto different parts of the state without forcing a final resolution.
