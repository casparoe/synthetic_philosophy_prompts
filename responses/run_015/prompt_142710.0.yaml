answer: |-
  To move beyond the static puzzles of introductory metaphysics, a theory of material constitution must account for dynamic, informational, and distributed cases without collapsing into triviality or contradicting empirical science. Below is the specification of desiderata any adequate theory must meet, followed by an assessment of the leading candidates.

  ### I. Core Desiderata for a Theory of Material Constitution

  An adequate theory must do more than label the relationship; it must explain the ontological grounds that allow one object to constitute another without being identical to it. The following five requirements are necessary.

  **1. The Requirement of Modal Discrimination**
  *   **Specification:** The theory must explain how the constituted object (e.g., the statue) and the constituting matter (e.g., the clay) possess different persistence conditions and modal properties, despite sharing all current physical properties.
  *   **Case Coverage:** Classic Statue and Clay.
  *   **Justification:** This is **non-negotiable**. If the statue and clay are identical, they must share all properties (Leibniz's Law). Yet, the clay could survive being squashed while the statue could not. A theory that denies this distinction fails to capture the phenomenology of artifact creation.
  *   **Status:** Non-negotiable (Logical consistency with modal intuition).

  **2. The Requirement of Informational Invariance**
  *   **Specification:** The theory must determine whether identity can be sustained by the continuity of form, function, or information alone, even when material continuity is zero. It must specify a threshold for when material replacement constitutes destruction versus persistence.
  *   **Case Coverage:** Continuously Re-materialised Artefact (Your digital scan case).
  *   **Justification:** This is **non-negotiable** for modern contexts. If a theory insists on strict material continuity, it contradicts curatorial and legal practices regarding digital and restored art. However, if it allows total material replacement, it risks severing the link between *material* constitution and the object itself.
  *   **Status:** Non-negotiable (Empirical adequacy regarding artifact practices).

  **3. The Requirement of Metabolic Persistence**
  *   **Specification:** The theory must explain how biological organisms persist through the total replacement of their constituent atoms over time without positing a non-physical soul or substratum.
  *   **Case Coverage:** Biological Metamorphosis and Metabolic Turnover.
  *   **Justification:** This is **non-negotiable**. Any metaphysics of material objects must be compatible with biology. Organisms are paradigmatic material objects; if the theory implies you cease to exist every seven years due to cellular turnover, it is empirically false.
  *   **Status:** Non-negotiable (Consistency with biological science).

  **4. The Requirement of Spatial Indeterminacy**
  *   **Specification:** The theory must account for entities that lack precise spatial boundaries or stable mereological sums, where the "parts" are loosely associated or distributed.
  *   **Case Coverage:** Distributed or 'Cloud-like' Entities (e.g., storms, corporations, quantum fields).
  *   **Justification:** This is **partially camp-specific**. Strict mereological essentialists demand precise boundaries. However, given that many functional entities we interact with are vague, a theory that cannot handle vagueness is too restrictive for general application.
  *   **Status:** Contingent (Depends on whether one accepts vague objects).

  **5. The Requirement of Ontological Parsimony**
  *   **Specification:** The theory should not multiply entities beyond necessity. It must explain the relationship without populating the same region of space-time with an excessive number of distinct objects unless strictly required.
  *   **Case Coverage:** All cases.
  *   **Justification:** This is **camp-specific**. Constitution theorists accept co-location (two objects in one place); Identity theorists reject it. While parsimony is a theoretical virtue, what counts as "excessive" is debated. However, a theory that posits infinite coinciding objects for every description is generally rejected.
  *   **Status:** Contingent (Methodological preference).

  ### II. Required Distinctions and Scientific Constraints

  To solve rather than redescribe the problem, the theory must rigorously maintain the following distinctions:

  *   **Constitution vs. Identity:** Constitution is a asymmetric relation (the clay constitutes the statue, not vice versa), whereas identity is symmetric. The theory must explain what grounds this asymmetry if not material difference.
  *   **Persistence Conditions vs. Essential Properties:** Persistence conditions dictate *how* an object survives change (e.g., losing a part); essential properties dictate *what* the object is (e.g., being artistic). A theory must not conflate the conditions for staying in existence with the properties required for being that kind of thing.
  *   **Material vs. Formal Continuity:** Material continuity tracks the same atoms; formal continuity tracks the same structure or information. The theory must specify which is dominant for which category of object (e.g., matter for rocks, form for artifacts).

  **Scientific Constraints:**
  *   **Mereology:** The theory must not contradict the transitivity of parthood unless it explicitly rejects classical mereology. It cannot claim a part is part of the whole and the whole is part of a larger whole, but the part is not part of the larger whole, without justification.
  *   **Biology:** The theory cannot require material stasis for living organisms. It must accommodate the fact that biological identity is process-based, not substance-based.

  ### III. The Joint Tension

  There is a pair of desiderata that appears jointly unsatisfiable without significant metaphysical cost:

  **The Principle of Spatio-Temporal Uniqueness** (No two distinct material objects can occupy the exact same spatial region at the exact same time) vs. **The Principle of Modal Distinction** (The statue and the clay have different modal properties and are therefore distinct objects).

  **The Tension:** If you accept Modal Distinction (which you must, to account for the statue's fragility vs. the clay's malleability), you are forced to admit there are two objects. If you also accept Spatio-Temporal Uniqueness (which common sense demands), you have a contradiction: two objects in one place.
  *   To resolve this, you must either deny Uniqueness (allowing co-location, as Constitution View does), deny Distinction (claiming they are identical, as Identity Theory does), or deny that they are in the "same place" at the "same time" in the strict sense (as Four-Dimensionalism does).
  *   **Why Unsatisfiable:** You cannot hold both principles in their strongest forms while maintaining that the statue and clay are distinct material objects existing simultaneously. One must yield.

  ### IV. Assessment of Mainstream Candidates

  **1. Standard Identity Theory**
  *   **Performance:** Fails the **Requirement of Modal Discrimination**. It claims the statue *is* the clay. To save this, it must argue that modal properties are relative to descriptions, which many find ad hoc. It handles parsimony well but fails to explain why we treat them differently in practice (e.g., insurance, restoration).
  *   **Verdict:** Logically clean, phenomenologically inadequate.

  **2. Constitution View (e.g., Baker-style)**
  *   **Performance:** Satisfies **Modal Discrimination** and **Informational Invariance** by positing that the statue and clay are distinct objects that share a location. It handles the **Digital Case** well by emphasizing the "primary kind" of the object (artwork vs. matter).
  *   **Verdict:** Metaphysically costly. It violates the **Principle of Spatio-Temporal Uniqueness**, leading to the "too many objects" problem.

  **3. Mereological Essentialism**
  *   **Performance:** Fails the **Requirement of Metabolic Persistence** and **Informational Invariance**. If parts are essential, you cease to exist when you lose an atom. It cannot handle the Ship of Theseus, your digital sculpture, or biological turnover without claiming the object is destroyed and replaced instantly.
  *   **Verdict:** Empirically false regarding biology and artifacts.

  **4. Four-Dimensionalism (Perdurantism)**
  *   **Performance:** Satisfies **Modal Discrimination** and **Metabolic Persistence** by treating objects as space-time worms. The statue and clay are different worms that share a temporal slice. It handles the **Digital Case** by treating the worm as a series of connected stages.
  *   **Verdict:** Solves the logic but violates our intuition of **Endurance**. We feel we are wholly present now, not merely a temporal slice.

  ### V. The Single Most Damaging Requirement

  The single requirement that does the most damage to the mainstream candidates (specifically the Constitution View and Four-Dimensionalism, which are the strongest contenders) is **The Requirement of Intuitive Numerical Uniqueness**.

  This requirement demands that when we point to a region of space containing a statue, there is exactly *one* object there, not two (statue + clay) and not a slice of a worm.
  *   **Damage to Constitution View:** It forces the view to accept co-location, which many critics argue is metaphysically impossible or absurd (how can two things be in one place?).
  *   **Damage to Four-Dimensionalism:** It forces the view to deny that we are 3D entities enduring through time, replacing our self-conception with a 4D manifold.
  *   **Damage to Identity Theory:** It forces the view to deny obvious modal differences.

  While **Modal Discrimination** is the logical driver of the puzzle, **Intuitive Numerical Uniqueness** is the constraint that no theory can satisfy without sacrificing something else of great value. The Constitution View sacrifices it to save modality; Four-Dimensionalism reinterprets it to save logic; Identity Theory ignores it to save parsimony. Any theory that claims to satisfy Numerical Uniqueness *alongside* Modal Discrimination and Material Continuity is merely redescribing the problem, not solving it.
