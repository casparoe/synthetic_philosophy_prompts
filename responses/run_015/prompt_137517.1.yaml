          3.  **The Normative/Design Ambiguity:** Is UDT a requirement of rationality or an architecture for optimization? (Conceptual Clarity).
          4.  **Multi-Agent Stability:** Do updateless agents necessarily enter commitment races? (Interaction).

      *   *Wait, Q3 (Normative/Design) is actually upstream of everything.* If it's just design, normative arguments don't matter. If it's rationality, design is derivative. I should move this up or integrate it. Let's make Q1 about the Formalism (which implies the design/rationality split). Let's keep the "Recommitment" as the entry point because that's the user's hook.
