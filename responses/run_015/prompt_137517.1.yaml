  2.  **Deconstruct the Core Problem (UDT & Recommitment):**
      *   UDT says: Choose a policy $\pi$ at the prior that maximizes expected utility across all possible worlds/observations, then execute $\pi(o)$ without updating on $o$ for the purpose of decision-making (though you condition on $o$ to know *which* part of $\pi$ to execute).
      *   The User's "Recommitment" Idea: What if the agent can choose to *re-optimize* mid-stream?
      *   *Critique:* If the agent is truly updateless, the decision to "re-optimize" must itself be part of the original policy $\pi$. If $\pi$ says "at node $X$, calculate new policy $\pi'$," then that was the plan all along.
      *   *The Real Tension:* This points to the *logical omniscience* problem or the *computational boundedness* problem. UDT assumes you can find the optimal policy at the prior. If you can't, you might need to re-deliberate. But if you re-deliberate based on new info, aren't you just updating?
      *   *Key Distinction:* Is UDT a normative ideal for ideal agents, or a design principle for bounded agents? The user hints at this ("rationality requires" vs. "how to design").

  3.  **Drafting the Questions (Iterative Process):**

      *   *Attempt 1:*
          1. What is UDT?
          2. How does recommitment work?
          3. What about multi-agent?
