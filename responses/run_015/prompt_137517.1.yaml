      *   Q4 depends on Q1-Q3 being settled enough to define the agents interacting.

  5.  **Addressing the Implications:**
      *   *AI Safety:* Often overrated. UDT doesn't solve alignment, it changes the *type* of misalignment (commitment races vs. deception).
      *   *Normative Ethics:* Underrated. It challenges standard dynamic consistency arguments.
      *   *Empirical Prediction:* Doesn't follow. UDT is normative/design, not descriptive of humans.

  6.  **Sizing and Failure Conditions:**
      *   Q1 & Q2 are dissertation-sized. Q3 & Q4 are career-sized (or very risky dissertations).
