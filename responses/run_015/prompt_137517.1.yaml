          3. **The Prior Problem:** UDT hinges on the prior. How do we justify it without updating? (Epistemology).
          4. **Multi-Agent/Commitment Races:** What happens when two UDT agents meet? (Application/Extension).

      *   *Refining the Order:*
          *   Q1 must be about the formal coherence of the "recommitment" idea. If it's a redescription, the project changes.
          *   Q2 must address *why* an agent would recommit. Usually, it's computational bounds. So, Bounded UDT is upstream of Multi-Agent.
          *   Q3 is the Prior. UDT is useless without a prior. But is it a dissertation topic? Maybe too big. Let's make it about *learning* the prior.
          *   Q4 is Multi-Agent. This is where the "commitment race" fear lives.

      *   *Selection for the User's Constraints:*
          *   The user is a philosopher, not an ML researcher. So "Bounded UDT" needs to be framed logically/epistemically, not algorithmically.
          *   The "Recommitment" idea is the hook. Let's make that Q1.
          *   The "Normative vs. Design" distinction is crucial. Let's make that Q2.
