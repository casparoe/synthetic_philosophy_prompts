answer: |-
  # Deliberation Design: The White Horse Paradox Simulation

  ## 1. Artifact Descriptions and Scoring Sheet

  **The Deck (12 Cards)**
  Each card displays an image/description and a unique ID.
  *   **Conflict Card:**
      *   `C01`: **White Horse Statue** (Marble, equine form, white surface).
  *   **Form Committee Mandate Cards (Horse Shape):**
      *   `F01`: **Black Horse Statue** (Bronze, equine form, black patina).
      *   `F02`: **Brown Horse Statue** (Wood, equine form, stained brown).
      *   `F03`: **Bronze Horse Statue** (Metal, equine form, gold/bronze).
  *   **Color Committee Mandate Cards (White Color):**
      *   `C02`: **White Sphere** (Marble, spherical, white).
      *   `C03`: **White Cube** (Ceramic, cubic, white).
      *   `C04`: **White Pyramid** (Plaster, pyramidal, white).
  *   **Neutral Cards (No Mandate Fit):**
      *   `N01`: **Black Iron Cube**
      *   `N02`: **Red Clay Sphere**
      *   `N03`: **Blue Glass Cube**
      *   `N04`: **Green Wood Pyramid**
      *   `N05`: **Yellow Plastic Tetrahedron**
      *   `N06`: **Grey Stone Octahedron**

  **Scoring & Budget Rules**
  *   **Budget:** Form and Color Committees each receive **10 Points**.
  *   **Allocation:** Committees distribute points across cards fitting their mandate. Minimum bid per card is 1 point. Unspent points are forfeited.
  *   **Conflict Rule:** If *both* committees allocate ≥1 point to the same card (specifically `C01`), **all points on that card are voided** for both committees. The card receives zero funding.
  *   **Securing:** If only one committee bids on a card, the points are spent, and the card is "Secured."
  *   **Stakes:** Total *Secured Points* (points spent on non-voided cards) determine Speaking Order in the discussion phase. Higher secured points = earlier speaking slot.
  *   **Arbitration:** The Board tracks bids but cannot spend points.

  **Score Sheet Template (For Arbitration Board)**
  | Card ID | Form Bid | Color Bid | Status (Secured/Void) | Form Points Counted | Color Points Counted |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | C01 (White Horse) | | | | | |
  | F01-F03 (Horses) | | | | | |
  | C02-C04 (Whites) | | | | | |
  | **TOTALS** | | | | **____ / 10** | **____ / 10** |

  ---

  ## 2. Minute-by-Minute Timeline (60 Minutes)

  **0:00–0:05 | Setup & Role Assignment**
  *   Facilitator divides class into three groups of five (Form, Color, Arbitration).
  *   Groups sit at separate tables. Arbitration sits centrally.
  *   Facilitator distributes decks and score sheets. **No philosophical context is given.**
  *   Facilitator reads the Mandates and Conflict Rule verbatim.

  **0:05–0:15 | Silent Allocation Round**
  *   Committees confer internally to distribute their 10 points.
  *   They must submit a sealed bid sheet to Arbitration.
  *   *Constraint:* They cannot know the other committee's bids yet.
  *   *Goal:* Maximize Secured Points to gain speaking priority.

  **0:15–0:20 | Simultaneous Reveal & Conflict Identification**
  *   Arbitration opens bids and projects the Score Sheet.
  *   **Expected Outcome:** Both committees likely bid on `C01` (White Horse).
  *   Arbitration declares `C01` **VOID**. Points allocated to it by both sides are erased from the "Counted" total.
  *   Committees see their speaking priority drop due to the voided points.

  **0:20–0:40 | Negotiation Round (With Arbitration)**
  *   Committees may discuss openly. Arbitration circulates.
  *   **Action:** Committees may retract bids on `C01` to save the points.
  *   **Constraint:** Arbitration may propose withdrawals but **cannot veto** or force a decision. Only committees can retract.
  *   **Tension:** To save the points, one committee must concede `C01` does not fit their mandate *for the purpose of this funding*.
  *   If no retraction occurs by 0:40, the Void stands.

  **0:40–0:45 | Final Locked-In Budgets**
  *   Final bids are recorded.
  *   Speaking Order is ranked based on Final Secured Points.
  *   Cards are physically sorted into "Funded" and "Unfunded" piles.

  **0:45–1:00 | Discussion & Debrief**
  *   5 Minutes: Student discussion on why the deadlock occurred.
  *   10 Minutes: Facilitator Debrief Script (see Section 4).

  ---

  ## 3. Physical Materials and Room Layout

  **Materials**
  *   **Card Stock:** 12 Artifact Cards (large print, visible icons).
  *   **Bid Sheets:** 2 per committee (one for initial, one for final).
  *   **Tokens:** 20 colored chips per committee (to visualize budget, optional).
  *   **Score Sheet:** 1 large master sheet for Arbitration Board.
  *   **Timer:** Visible countdown clock projected or on a wall.
  *   **Pens:** For all participants.

  **Room Layout**
  *   **Triangle Configuration:** Three tables arranged in a triangle.
      *   Table A: Form Committee (5 students).
      *   Table B: Color Committee (5 students).
      *   Table C: Arbitration Board (5 students) positioned centrally to see both A and B.
  *   **Facilitator:** Stands at the periphery, intervening only for timekeeping or rule clarification.
  *   **Wall Space:** One whiteboard for Arbitration to track the "Void" status publicly.

  ---

  ## 4. Debrief Script: Mapping Deadlock to Ontology

  **Facilitator Notes:** Do not resolve the paradox. Explain the structural similarity between the game and the text.

  **Script:**
  "Look at the White Horse card (`C01`). In the first round, most of you funded it. Then the rule voided it. To save your points, one committee had to withdraw.

  "If the **Form Committee** withdrew, you mechanically enacted the claim: *'This object is not fundable as a Horse.'* You treated 'White' as an exclusionary condition that disqualified the object from the 'Horse' budget.
  "If the **Color Committee** withdrew, you enacted: *'This object is not fundable as White.'* You treated 'Horse' as an exclusionary condition that disqualified the object from the 'White' budget.

  "This deadlock reproduces the extensional overlap of Gongsun Long's *Bai Ma Fei Ma* (White Horse is Not Horse). Extensionally, the White Horse is both a horse and white. But intensionally—the level of concepts and definitions—the game forced you to treat the mandates as mutually exclusive territories.

  "Gongsun Long argues that 'Horse' names the form, and 'White' names the color. When combined, 'White Horse' creates a new, distinct concept that is not identical to 'Horse' alone. In this game, the 'Conflict Rule' acted as the logical operator of identity. It said: *You cannot claim this object under both descriptions simultaneously without losing the claim entirely.*

  "To resolve the game, you had to separate the qualities. To resolve the paradox, Gongsun Long separates the universals. He is not saying a white horse isn't a biological animal; he is saying the *concept* 'White Horse' is not the *concept* 'Horse'. The game made you feel the cost of that separation: you had to sacrifice points (priority) to maintain conceptual purity, or sacrifice conceptual purity to save points."

  ---

  ## 5. Prediction of Failure Modes and Corrective Moves

  **Failure Mode 1: The Utilitarian Compromise**
  *   **Prediction:** Students will treat the White Horse as a bargaining chip. "We'll give you the White Horse if you let us have the Black Horse." They will trade mandates to maximize total points, ignoring the philosophical tension.
  *   **Corrective Move:** The Facilitator must intervene during Negotiation. "Remind Committees: You may only withdraw based on your *Mandate Definition*, not on trade preferences. Form cannot fund Black Horse *for* Color. You must decide if the White Horse fits *your* definition alone." This forces the ontological question back into the decision.

  **Failure Mode 2: Arbitration Dominance**
  *   **Prediction:** The Arbitration Board, seeing the deadlock, will dictate a solution ("Just flip a coin") to finish the task efficiently.
  *   **Corrective Move:** Pre-brief Arbitration: "Your power is procedural, not judicial. If you decide, the simulation fails. You may highlight the conflict, but the Committees must own the withdrawal." If they overstep, pause the game and strip them of proposal power for 2 minutes.

  **Failure Mode 3: The Hybrid Category Escape**
  *   **Prediction:** Students will argue "White Horse" is a third category that fits neither, or both, and demand a rule change.
  *   **Corrective Move:** Hold the line on the Rules. "The rules are the metaphysics of this world. In this simulation, there are only Form and Color mandates. If you cannot fit it into one, it remains Void. Experience the loss." This preserves the experiential logic of the paradox (the loss of identity).

  ---

  ## 6. Explicit Statement of Simplification

  **Statement for Debrief:**
  "This exercise simplifies Gongsun Long's reasoning in one critical way: it treats concepts as **budgetary territories** rather than **metaphysical realities**. In the game, you withdrew from the White Horse to save points (a pragmatic choice). Gongsun Long withdrew the White Horse from the category 'Horse' because he believed names (*ming*) must precisely match realities (*shi*) to maintain cosmic order (an ontological choice).

  "We simulated the *collision* of categories, but we cannot simulate the *belief* that this collision disrupts the nature of reality. When you conceded the White Horse, you lost speaking priority. When Gongsun Long separated 'White' from 'Horse', he believed he was preserving the integrity of language itself. Keep this distinction in mind: the game shows you the *structure* of the paradox, not the *stakes* of the ancient worldview."
