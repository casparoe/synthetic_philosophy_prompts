      *   **Kant's View:** Moral worth comes from acting *from duty*, not merely *in accordance with duty*. If I help someone because I love them (inclination), it has no moral worth *in that specific instance* regarding the motive, though the action is good. If I help someone despite hating them because it's the right thing to do, that has moral worth.
