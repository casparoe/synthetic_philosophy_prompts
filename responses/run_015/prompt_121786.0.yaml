answer: |-
  Consider a hypothetical nation, let us call it Ruritania, which perpetrates systematic atrocities against a minority group during a specific historical period. At that time, the citizenry consists primarily of Group A. Following the conflict, Ruritania maintains its legal constitution and territorial borders, but over the subsequent century, economic migration and demographic shifts result in Group A becoming a negligible minority. The population is now almost entirely composed of Group B, who arrived after the atrocities ceased and hold full citizenship. The state demands of these new citizens that they acknowledge the historical crimes of Ruritania and contribute to reparations, citing the continuity of the state.

  In Jaspers's framework, political guilt is incurred by citizens simply by virtue of their membership in a state that acts criminally; it is a liability for the deeds of the state apparatus, distinct from moral guilt, which attaches only to individuals for their personal actions. The tension arises when we ask whether the political guilt incurred by the original citizenry survives the total replacement of that citizenry. If we assert that the new citizens of Group B bear political guilt for the deeds committed before their arrival, we stretch Jaspers's definition. For Jaspers, political guilt is grounded in the fact that citizens are co-responsible for the manner in which their state is governed; they possess the potential power to influence it. The new citizens, however, possessed no such power over the past regime. They did not empower the state when it committed the crimes.

  If political guilt nevertheless persists despite the disappearance of the people who originally bore it, the locus of guilt shifts from the citizenry to the state itself as an abstract entity. This creates a profound conceptual difficulty. If the state can carry guilt across generations independently of the specific individuals who constitute it at any given time, the state begins to resemble a persistent moral agent in its own right. It implies that the state has an identity and a capacity for responsibility that transcends the sum of its current members. This undermines Jaspers's strict refusal to allow for collective moral guilt. Jaspers insisted that only individuals can be morally guilty; collectives can only be politically liable. However, if the political liability becomes an inherited burden that new citizens must accept as a stain on their collective identity—despite having no causal link to the events—it begins to function indistinguishably from a form of collective moral guilt or original sin. The distinction collapses because the political liability is no longer based on current membership and potential agency, but on a metaphysical continuity of the state that imposes a moral-like burden on innocent successors.

  This problem is not merely empirical, concerning who happens to live within the borders at a given time. It is fundamentally conceptual, concerning the conditions required for a bearer of guilt to remain identical over time. An empirical view would suggest that if the people change, the responsibility changes, much like a partnership dissolving when partners leave. A conceptual view asks what makes Ruritania at Time Two the same entity as Ruritania at Time One. If the answer relies on legal and territorial continuity alone, independent of the populace, then the state is treated as a transcendent subject capable of bearing guilt apart from individuals. If the answer relies on the continuity of the people, then the guilt should expire with the original citizenry. Jaspers's framework struggles here because it attempts to anchor political guilt in the citizenry while acknowledging the state's continuity. When the citizenry is replaced, the framework forces a choice: either admit that political guilt dies with the original agents (leaving victims without recourse against the continuing state), or admit that the state itself is the guilt-bearer (thereby reifying the collective into a moral agent, which Jaspers explicitly sought to avoid). Thus, the tension lies in the ontology of the state: whether it is a mere aggregation of individuals liable for their joint enterprise, or a persistent entity capable of carrying debt across generations irrespective of its human composition.
