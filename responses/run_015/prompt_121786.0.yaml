      *   **Political Guilt:** Applies to citizens as members of a state. It involves liability for the deeds of the state. It is collective but external (legal/reparations). It rests on the fact of citizenship, not necessarily personal action.
      *   **Moral Guilt:** Applies to individuals for their own actions. It is internal (conscience). It cannot be collective.
      *   **Key Distinction:** Citizens bear political guilt for what their state does, even if they didn't personally commit crimes. Individuals bear moral guilt only for what they personally did.
      *   **Continuity:** Jaspers wrote shortly after WWII, addressing the German people who lived through the Nazi regime. The question here extends his framework to a scenario where the *people* change but the *state* remains.

