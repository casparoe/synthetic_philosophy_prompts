      *   *Jaspers's Refusal:* Jaspers insists collective *moral* guilt is nonsense. Only individuals feel moral guilt. Political guilt is about liability. But if political liability persists without the original agents, it looks like an inherited burden akin to moral guilt (original sin-ish), which Jaspers wanted to avoid.

  5.  **Distinguish Empirical vs. Conceptual:**
