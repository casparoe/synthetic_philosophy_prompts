answer: |-
  **Proposal for MA Term Paper**

  **Title:** Stretching Coincidence: A Diachronic Stress Test for Solutions to the Puzzle of Material Constitution

  **Student:** [Your Name]
  **Course:** [Course Name/Number]
  **Supervisor:** [Supervisor Name]
  **Date:** [Date]

  ### 1. Project Summary

  The puzzle of material constitution, typified by the case of the Statue and the Clay, is a cornerstone of contemporary metaphysics. The standard debate focuses on a synchronic question: at a specific moment $t$, when a statue and the lump of clay constituting it share all the same matter and spatial location, are they identical? The canonical responses—monism, pluralism (constitutionalism), nihilism, relative identity, deflationism, and four-dimensionalism—are typically evaluated based on their ability to handle synchronic intuitions regarding counting, properties, and modal profiles.

  This paper proposes that the synchronic framing flatters these views. It argues that the true theoretical costs of these positions are not fully visible until they are stretched diachronically. By subjecting the standard solutions to scenarios involving gradual material replacement and alteration, we can test whether they yield determinate, plausible verdicts on persistence and survival. My hypothesis is that while these views can be made to work synchronically by adjusting modal profiles or sortal restrictions, they fracture or yield counterintuitive results when asked to track the statue and the clay through time.

  The project is not to solve the puzzle of material constitution definitively, but to perform a comparative cost-benefit analysis based on diachronic performance. I aim to determine which solutions survive the transition from static coincidence to dynamic replacement, and whether the diachronic context provides new discriminating power that the synchronic context lacks.

  ### 2. The Research Question

  The central research question is: **To what extent do standard solutions to the synchronic puzzle of material constitution entail determinate and plausible verdicts on diachronic replacement scenarios?**

  This question is determinate because it does not ask for the "truth" of material constitution in a vacuum, but for the consistency and intuitive cost of specific metaphysical frameworks when applied to a defined set of diachronic cases. A view "survives" if it can specify, without ad hoc modification, whether the statue and the clay persist, cease, or diverge during gradual replacement, in a way that aligns with our best ordinary judgements about objects over time. A view "fails" if it renders the outcome indeterminate, contradicts its own synchronic commitments, or forces acceptance of highly revisionary claims about persistence that were not required by the synchronic case alone.

  ### 3. Background and Motivation: The Synchronic Stalemate

  The current literature on material constitution is characterized by a stable stalemate. Each standard position has developed sophisticated defenses against synchronic objections.

  *   **Monists** argue identity is preserved, appealing to contingent identity or temporary coincidence.
  *   **Pluralists (Constitutionalists)** argue distinctness, appealing to differing modal properties (the clay could survive being squashed; the statue could not).
  *   **Nihilists** deny the existence of the composite objects entirely.
  *   **Deflationists** argue the dispute is merely conceptual or linguistic.
  *   **Four-Dimensionalists** argue the objects are distinct temporal worms that share temporal parts.

  These positions are largely calibrated to answer the question: "How can two things share matter at $t$?" They rely heavily at this stage on sortal-relative persistence conditions defined modally. However, these conditions are often asserted rather than derived. We are told the statue has different persistence conditions than the clay, but the synchronic case does not force us to see *how* those conditions play out in a process of change. Consequently, proponents of opposing views can often accommodate the same synchronic intuitions by tweaking their modal claims, leading to a dialectical deadlock.

  My motivation is to break this deadlock by shifting the evidentiary base. If a metaphysical theory is true, it must govern not only how objects are at a time but how they endure through time. By introducing diachronic stressors, we force these theories to cash in their modal promises. A view that looks elegant synchronically may become prohibitively complex or revisionary when asked to account for the temporal boundaries of the constitution relation.

  ### 4. The Diachronic Gap: Why Existing Positions Leave This Open

  A crucial part of this project is demonstrating why the existing literature does not already answer this question. Two specific theoretical moves often threaten to dissolve the diachronic tension prematurely: the appeal to phase sortals and the appeal to four-dimensional temporal parts. I must explain why neither suffices.

  **The Phase Sortal Objection**
  One might argue that the diachronic question is already settled by categorizing "statue" as a phase sortal of "lump of clay." If a statue is merely a temporary phase of a lump's existence, then the diachronic story seems simple: the lump exists before and after the statue; the statue exists only during the "statue-phase."

  However, labeling "statue" a phase sortal does not, by itself, tell us what happens during gradual replacement. It tells us that the statue has a beginning and an end, but it does not specify the *criteria* for that ending. Consider a scenario where the sculptor chips away a piece of the original clay and replaces it with new clay.
  1.  Does the "statue-phase" end immediately upon the removal of the first particle?
  2.  Does it end when the form is significantly altered?
  3.  Does it end only when all original matter is replaced?

  The claim that "statue is a phase sortal" is compatible with all three answers. It identifies the statue as temporally bounded but fails to locate the boundaries. To solve the diachronic puzzle, the theory must explain *why* the phase ends when it does. If the theory relies on "form" to mark the phase, it risks collapsing into a view where the statue is essentially formal, which has its own costs. If it relies on "matter," it risks making the statue indistinguishable from the lump. Therefore, the phase sortal move identifies the *structure* of the relationship but leaves the *persistence conditions* underdetermined. My paper will test whether standard views can fill this gap without arbitrariness.

  **The Four-Dimensionalist Objection**
  Four-dimensionalism (perdurantism) is often presented as the ultimate dissolver of constitution puzzles. Synchronically, it argues that the statue and the lump are distinct temporal worms that merely overlap at the current temporal part. Diachronically, one might assume this dissolves the tension: the statue-worm is shorter than the lump-worm; they diverge when the lump survives a destruction event that kills the statue.

  However, this may simply push the problem back rather than solving it. In a gradual replacement scenario, the question becomes: which temporal parts belong to the statue-worm and which belong to the lump-worm? If the replacement is gradual, there is no sharp boundary where the statue-worm ends and the lump-worm continues. The four-dimensionalist must either accept vague identity (which many reject) or posit a precise but unknowable cutoff point. Furthermore, four-dimensionalism often relies on counterpart theory to handle modal intuitions. When stretched diachronically, we must ask whether the "statue" counterpart relations track the "lump" counterpart relations. If they diverge, we are back to the original problem of explaining why ordinary language and intuition track one worm rather than the other. The diachronic tension re-emerges as a tension about temporal counterpart selection. My paper will argue that four-dimensionalism does not escape the diachronic costs; it merely translates them into the language of temporal parts.

  ### 5. Methodology and Timeline

  The project will proceed over the course of the semester, divided into four distinct phases. The method is analytic and comparative, constructing specific thought experiments and applying the standard metaphysical frameworks to them.

  **Month 1: Reconstruction of the Synchronic Landscape**
  *   **Task:** Rigorously define the five target views (Monism, Pluralism, Nihilism, Deflationism, Four-Dimensionalism).
  *   **Output:** A working document summarizing how each view handles the standard synchronic statue/clay case.
  *   **Goal:** Ensure I am attacking the strongest version of each view (e.g., ensuring the four-dimensionalist view includes a robust account of temporal parts, not just a caricature). I will identify the specific "modal profiles" each view assigns to the statue and the clay at $t_0$.

  **Month 2: Construction of Diachronic Scenarios**
  *   **Task:** Develop the replacement scenarios that will serve as the test cases.
  *   **Constraint:** These scenarios must be distinct from the standard Ship of Theseus literature. (See Section 6 below).
  *   **Scenarios to be constructed:**
      1.  **The Gradual Swap:** The sculptor removes a small piece of clay and replaces it with a qualitatively identical piece. This is repeated until all original matter is replaced.
      2.  **The Form Decay:** The clay is not replaced, but slowly deforms (e.g., melting slightly) while retaining the same matter.
      3.  **The Divergent Survival:** The clay is removed from the statue shape but kept intact; the statue shape is instantiated in new matter.
  *   **Goal:** To create cases where the persistence conditions of "statue" and "clay" are forced to diverge. I will map the intuitive verdicts for each stage of these processes.

  **Month 3: Application and Stress Testing**
  *   **Task:** Apply the five views to the three scenarios.
  *   **Analysis:** For each view, I will ask:
      *   Does this view predict a sharp boundary or a vague one?
      *   Does the view require us to say the statue ceases to exist earlier than intuition suggests?
      *   Does the view require us to say the clay ceases to exist when intuition suggests it survives?
      *   Does the view incur new theoretical costs (e.g., excessive revisionism) that were not present in the synchronic case?
  *   **Goal:** To generate a "cost profile" for each view. For example, Pluralism might handle the Gradual Swap well but struggle with the Form Decay. Four-Dimensionalism might handle Form Decay well but struggle with the vagueness of the Gradual Swap.

  **Month 4: Evaluation and Drafting**
  *   **Task:** Synthesize the findings into the final paper.
  *   **Goal:** Produce the ranked verdict and conclusion.
  *   **Writing:** The first half of the paper will establish the synchronic stalemate and the diachronic gap. The second half will present the scenarios and the comparative evaluation.

  ### 6. Distinguishing from the Ship of Theseus

  A critical methodological challenge is ensuring this project does not collapse into the existing literature on the Ship of Theseus. The Ship of Theseus puzzle asks: "Is the ship after replacement the *same* ship as the ship before replacement?" It is a question about the persistence conditions of a *single* object type.

  My project asks a different question: "Do the *statue* and the *clay* remain coincident, or do their persistence conditions diverge, during replacement?"

  To keep the project focused on constitution rather than mere persistence, I will employ the following controls:
  1.  **Dual-Tracking:** In every scenario, I will track both the statue and the clay simultaneously. The data point is not "Did the object survive?" but "Did the *relation* between the statue and the clay survive?"
  2.  **Focus on Divergence:** The Ship of Theseus literature is concerned with continuity. My literature is concerned with *coincidence*. If the Ship of Theseus literature says the ship survives replacement, my project asks: "If the ship survives, does the *wood* survive? And if they both survive, are they still the same object?"
  3.  **Sortal Sensitivity:** I will explicitly frame the scenarios to highlight sortal differences. For example, in the Gradual Swap, I will emphasize that the *clump of matter* is clearly continuous (it is just rearranged), while the *artifact* status is the variable. This keeps the focus on the constitution relation (Artifact vs. Matter) rather than just Artifact vs. Artifact.

  By maintaining this focus, the paper illuminates the constitution debate specifically, using diachronic change as a tool to reveal the differences between the constituting object and the constituted object, rather than getting bogged down in the general problem of identity over time.

  ### 7. Expected Outcomes: Success and Failure Conditions

  **Success**
  A successful result will look like a ranked verdict on the standard views based on their diachronic performance. For example:
  *   *High Rank:* A view that yields determinate verdicts on the replacement scenarios that align with ordinary intuition without requiring ad hoc adjustments to its synchronic commitments.
  *   *Middle Rank:* A view that yields plausible verdicts but requires accepting some revisionism (e.g., accepting vague boundaries).
  *   *Low Rank:* A view that becomes internally inconsistent when stretched over time, or forces highly counterintuitive claims (e.g., that the statue ceases to exist after the first particle swap).

  Ideally, the paper will show that one or two views (likely Constitutionalism or Four-Dimensionalism) handle the diachronic pressure better than others (perhaps Monism or Deflationism), providing a new reason to prefer them that is independent of the synchronic stalemate.

  **Failure**
  The project would fail if the diachronic cases turn out to reproduce the synchronic disagreement exactly, with no new discriminating power. For instance, if Monists simply say "The statue and clay are identical at $t_1, t_2, t_3$..." and Pluralists simply say "They are distinct at $t_1, t_2, t_3$...", and their reasons for doing so are exactly the same reasons they gave for the synchronic case, then the diachronic extension has added no value.
  Another failure condition would be if the scenarios inevitably collapse into the Ship of Theseus puzzle, making it impossible to isolate the constitution relation. If I cannot separate the question of "Is it the same statue?" from "Is it the same clay?", the test loses its specificity.

  ### 8. Scope and Feasibility Assessment

  **Honest Assessment of Scope**
  There is a significant risk that this project is too ambitious for a 7,000-word term paper. Covering five distinct metaphysical positions, constructing three complex diachronic scenarios, and distinguishing the project from the Ship of Theseus literature is a substantial amount of work. In 7,000 words, there is a danger of treating each view too superficially, resulting in a "survey" paper rather than a deep argumentative contribution.

  **Contingency Plan (Carving Off)**
  To ensure the paper is manageable and rigorous, I propose the following scope adjustment if the research in Month 1 and 2 reveals too much complexity:

  I will narrow the focus to the two most prominent rivals in the contemporary debate: **Constitutionalism (Pluralism)** and **Four-Dimensionalism**.
  *   **Rationale:** These are the two views that most explicitly claim to solve the synchronic puzzle without denying the existence of ordinary objects (unlike Nihilism) or denying the robustness of identity (unlike Deflationism). They are also the views where the diachronic tension is most acute. Constitutionalism relies on sortal-relative persistence, which is directly tested by replacement. Four-Dimensionalism relies on temporal parts, which is directly tested by the boundaries of those parts over time.
  *   **Revised Question:** "Does the diachronic stress test favor Constitutionalism or Four-Dimensionalism?"
  *   **Benefit:** This allows for a deeper engagement with the specific mechanisms of these two views (e.g., the nature of temporal counterparts vs. sortal essences) rather than a shallow overview of all five. It ensures the 7,000 words are used for argumentation rather than exposition.

  If I proceed with the full five-view comparison, I will risk exceeding the word limit or sacrificing depth. Therefore, the term paper proper will likely adopt the narrowed focus on Constitutionalism vs. Four-Dimensionalism, using the other views as background context for why the debate matters. This ensures the project is completable within the semester while retaining the core philosophical insight regarding the diachronic gap.

  ### 9. Conclusion

  The puzzle of material constitution is often treated as a static problem about counting and location at a time. This proposal argues that the metaphysics of constitution is inherently temporal. By shifting the focus to diachronic replacement, we can expose hidden costs in standard theories that remain invisible in the synchronic frame. This project offers a clear methodology, defined success conditions, and a contingency plan to ensure feasibility. It promises to contribute to the literature by providing a new criterion for evaluating metaphysical theories of objects: not just how they handle coincidence, but how they endure through change.

  I look forward to discussing this proposal with you and refining the scope of the diachronic scenarios based on your feedback.
