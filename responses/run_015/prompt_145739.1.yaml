answer: |-
  Your roommate isn't necessarily inconsistent; she is operating under a **lexical priority system**. This means she has multiple ethical rules, but they are ranked. When a higher-priority rule is triggered, it overrides the lower ones. Based on her statements, we can distill three competing frameworks that govern her decision-making.

  Here is the breakdown of the rules, how they apply to your specific case, and a test case to determine which rule actually sits at the top of her hierarchy.

  ### 1. The Three Competing Rules

  **Rule A: Catastrophe Avoidance (Consequentialist Threshold)**
  *   **Source:** Her views on tie-breakers (DP1), "dangerous vs. mediocre" candidates (DP2), and no third-party in tight generals (DP7).
  *   **Logic:** If the stakes cross a threshold of "danger" or "catastrophe," the outcome is the only thing that matters. You must minimize harm, even if it means compromising your values.
  *   **Trigger:** One option is significantly more dangerous than the other, or the margin is razor-thin.

  **Rule B: Expressive Integrity (Signaling)**
  *   **Source:** Her view on "both mediocre" (DP3) and praising her sister's blank ballot (DP4).
  *   **Logic:** If the outcomes are morally equivalent (or both bad), the vote is not a tool for governance but a tool for messaging. You must signal dissent to maintain moral cleanliness.
  *   **Trigger:** No clear "danger" distinction between candidates; the system is safe enough to absorb the protest.

  **Rule C: Anti-Free-Riding (Civic Participation)**
  *   **Source:** Condemning her cousin for silent skipping (DP5).
  *   **Logic:** You cannot benefit from the political system (or the labor of others) without contributing to the ritual. Silence + Absence = Parasitism.
  *   **Trigger:** Any election where you reside/participate. This rule constrains Rule B (you can protest, but you must show up).

  ---

  ### 2. Prediction for the Specific Case

  **The Scenario:** Run-off, two candidates, both back a harmful bill (one *far worse*), formal 'null vote' counts toward quorum.

  **How the Rules Conflict:**
  *   **Rule C (Participation)** is satisfied either way. Since the null vote counts toward quorum, casting it avoids the "free-rider" label she pinned on her cousin.
  *   **Rule B (Expression)** pushes for the **Null Vote**. Both candidates hurt her community; a null vote signals rejection of the binary choice (similar to her sister's blank ballot).
  *   **Rule A (Catastrophe)** pushes for the **Less Harmful Candidate**. The distinction "far worse" mimics her "dangerous vs. mediocre" criterion (DP2).

  **Most Likely Prediction:**
  She will vote for the **Less Harmful Candidate.**

  **Why?**
  Her history suggests Rule A trumps Rule B when "danger" is present. She praised her sister's blank ballot specifically because it was a **safe state** (low stakes/low impact). In a run-off (high stakes) where one outcome is "far worse" (high danger), her "Tie-Breaker/Danger" logic (DP1 & DP2) usually activates. She views the "Lesser Evil" compromise as permissible *only* when preventing the "Dangerous" option. Since the null vote does not stop the "far worse" candidate from winning, Rule A overrides Rule B.

  *However*, if she believes the "null vote" count will publicly shame the winner into softening the bill, she might Null Vote. But based strictly on her stated "dangerous vs. mediocre" heuristic, voting is the consistent move.

  ---

  ### 3. The Discriminating Test Case

  To figure out if she truly prioritizes **Catastrophe Avoidance (Rule A)** or **Expressive Integrity (Rule B)**, you need a case where Rule C (Participation) is satisfied by both options, but the "Danger" threshold is ambiguous.

  **The Case:**
  > A competitive state election (not safe, not a tie-breaker).
  > **Candidate X:** Backs a policy that will mildly inconvenience her community.
  > **Candidate Y:** Backs a policy that will severely harm her community.
  > **Option Z:** A formal 'Null Vote' that is publicly reported in the results (signaling dissent) but does **not** count toward quorum (so she must physically show up to cast it).
  > **Crucial Detail:** Polls show Candidate Y is trailing by 10 points (unlikely to win, but possible).

  **Why this tells them apart:**
  *   **If she votes for Candidate X:** She prioritizes **Rule A (Catastrophe Avoidance)**. Even though Y is unlikely to win, the risk of "severe harm" triggers her duty to block the dangerous option. She sacrifices expression for security.
  *   **If she casts the Null Vote:** She prioritizes **Rule B (Expressive Integrity)**. She decides that since Y is likely to lose anyway, the "danger" threshold isn't met, and she is free to signal her dissatisfaction with X.
  *   **If she stays home:** She violates **Rule C**, proving she is inconsistent with her view on her cousin.

  **The Tell:**
  Ask her: *"In that test case, does the 10% risk of Candidate Y winning trigger your 'dangerous candidate' duty, or is it safe enough to protest?"*

  *   If she says **"Risk is too high, vote X,"** then her system is **Consequentialist-First** (Outcome > Message).
  *   If she says **"Y is probably losing, so I'll Null Vote,"** then her system is **Expressive-First** (Message > Outcome), and her "danger" rule is actually just an excuse for when her protest feels too risky.

  ### Summary of Consistency
  She is consistent **if** you view her ethics as a hierarchy:
  1.  **Stop Disaster** (Vote Lesser Evil).
  2.  **If no Disaster, Signal Dissent** (Null/Blank Vote).
  3.  **Always Show Up** (Don't Free-Ride).

  In your run-off scenario, the "far worse" bill likely triggers Level 1, forcing her to vote for the less harmful candidate despite her desire to protest.
