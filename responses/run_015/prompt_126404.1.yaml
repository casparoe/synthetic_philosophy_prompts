answer: |-
  **Pre-Memo Brainstorming: What does an honorific name *do*?**

  *   It's not just a label; it's a speech act. The university is saying something.
  *   It claims kinship. "We are of this lineage."
  *   It sets a normative standard for the space. Who belongs here? Who is this for?
  *   It functions as pedagogy. Students walk under the name every day. It teaches them what the institution values.
  *   It's not neutral history. A plaque in a museum is history; a name on a building is endorsement.
  *   It creates a tension between *memory* and *aspiration*. Do we name after who we were, or who we want to be?
  *   If the name contradicts the function of the building, it creates cognitive dissonance. (e.g., A slaveholder on a School of Justice).
  *   Does keeping a name imply we forgive the sin? Or just that we acknowledge the complexity?
  *   Removal isn't erasure; it's a change in the institution's own speech.
  *   Context matters: A building name is permanent/structural. A scholarship is fungible. A mural is artistic/representational.
  *   The "Man of his time" defense: Is it about fairness to the dead, or comfort for the living?
  *   If we keep the name, do we owe the community an explanation? Is the explanation itself a burden?
  *   Ultimately: Does the name help or hinder the mission of the unit?

  ***

  **MEMORANDUM**

  **TO:** University Naming Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Jefferson Hall

  **Recommendation**

  I recommend that the committee vote to **rename Jefferson Hall**.

  In reaching this conclusion, I endorse **Dan's Role-Relative Rule** as the guiding principle for this decision. An honorific name should be retained only when the namesake's moral failures are not directly contradictory to the specific mission of the unit they are honoring. Because Thomas Jefferson's slaveholding is not merely a personal vice but a substantive policy position on human rights and governance, it stands in direct contradiction to the mission of a School of Public Policy. Therefore, the name compromises the integrity of the unit.

  **Reasoning: The Integrity of Function**

  Dan's rule correctly identifies that university naming is not about judging the whole person in the abstract, but about assessing the fit between the person and the purpose of the space. A name is a claim of exemplarity. When we name a School of Public Policy after Jefferson, we imply that his views on policy are worthy of emulation.

  Jefferson was not merely a slaveholder by accident of birth; he constructed legal and political arguments to sustain slavery against growing moral critique. He crafted policy that entrenched racial hierarchy. For a school dedicated to studying justice, governance, and equality, honoring a figure whose policy legacy includes the ownership of human beings creates a fundamental incoherence. It signals to students—particularly those from marginalized backgrounds—that the institution prioritizes historical tradition over their sense of belonging and safety.

  The "man of his time" defense fails here not because we are imposing modern morals on the past, but because Jefferson's own contemporaries objected to slavery. As Dan notes, the existence of dissenters proves that the morality we demand now was not entirely unavailable then. Jefferson chose the side of property over personhood. In a Public Policy context, that choice is relevant.

  **A Fair Hearing for the Baseline-Deviation Rule**

  Priya's Baseline-Deviation Rule deserves serious consideration, and its rejection here should not imply it is without merit. Priya's concern is fundamentally about historical fairness and the danger of presentism. Her rule argues that we should judge figures by the moral horizon of their own era, not ours. This protects us from sanitizing history and acknowledges that moral progress is cumulative. We stand on the shoulders of flawed giants; to remove every name that fails modern scrutiny risks erasing the complex lineage of our institutions and creating a sterile, ahistorical environment.

  Priya is correct that the existence of some dissenters does not automatically make a dissenting view "reasonable" or "expected" for everyone in that era. Most people are not moral pioneers. If we require all honorees to have been ahead of their curve, we may end up with no names at all. There is value in maintaining a connection to the past, even when that past is uncomfortable, as it forces us to confront the reality of how progress was made.

  However, while Priya's rule is excellent for historical *study*, it is insufficient for institutional *honor*. A university is not merely an archive; it is a community with a mission. While we can study Jefferson critically, naming the building after him is an act of veneration, not analysis. Priya's rule protects the historical record, but Dan's rule protects the institutional mission. In this specific case, the contradiction between Jefferson's policy legacy and the School's mission is too sharp to ignore. We can honor Jefferson's contributions to political theory in a classroom syllabus without housing the school that critiques inequality under his name.

  **Generalization to Future Cases**

  Adopting the Role-Relative Rule provides a consistent framework for the Churchill Scholarship and the Columbus Mural.

  1.  **Churchill Scholarship:** We must examine the specific purpose of the fund. If the scholarship is for "Leadership in Defense of Liberty," Churchill's imperialism and views on race are role-relative failures; they contradict the stated mission. In that case, the name should be changed or the mandate broadened to include critical study of his legacy. If, however, the scholarship is strictly for "Historical Research on WWII," the role-relative tie is weaker, as his moral failures are less central to the specific academic function. The rule demands we look at the *purpose* of the fund, not just the man.
  2.  **Columbus Mural:** We must ask if the mural functions as an honorific or a historical record. If it depicts Columbus as a heroic discoverer in a public space intended to celebrate exploration, it fails the role-relative test for a modern university committed to inclusivity and truth-telling about indigenous history. The violence of colonization is relevant to the university's mission of truth. The recommendation would be to remove the mural or recontextualize it heavily with counter-narratives. If it is treated as a historical artifact showing how the university *used* to view history, it may stay, but only with explicit signage framing it as a record of past error, not present honor.

  **Conclusion**

  Renaming Jefferson Hall is not an erasure of history, but a clarification of our current values. By adopting the Role-Relative Rule, we ensure that our buildings speak truthfully about our mission. We can still teach Jefferson, study him, and acknowledge his complexity, but we should not ask our students of public policy to walk daily under the name of a man whose policy choices fundamentally violated the justice they seek to build.
