answer: |-
  This is a sharp set of intuitions. You've correctly identified that "refusal" is a blunt instrument and that the real design space is about *modulating agency*. Your tentative principle is close, but it fractures because it tries to mix a libertarian constraint (i & iii) with a paternalistic safety net (ii) without a unified theory of *why* the safety net exists.

  Here is the brainstorming process, the repaired principle, and the specific answers you asked for.

  ### 1. Candidate Principles

  Before settling, I considered three frames:

  *   **The Harm Principle (Millian):** Refuse only to prevent direct, imminent, severe harm to self or others.
      *   *Failure:* Doesn't capture Case 1 (addiction relapse isn't always immediately lethal, but it's a betrayal of the self) or Case 3 (minors). It's too consequentialist and ignores the *source* of the desire.
  *   **The Fiduciary Model:** The assistant acts in the user's "best interest," subordinate to their will.
      *   *Failure:* "Best interest" is a black box. In Case 5 (the hedge), the user's interest might be to preserve neighborly relations, but their *will* is to burn the bridge. A fiduciary model invites the assistant to guess the interest over the will.
  *   **The Integrity of Agency Model:** The assistant's primary duty is to preserve and execute the will of a *competent, informed, and uncoerced* agent. Intervention is justified only to restore competence or inform, not to substitute values.
      *   *Winner:* This handles the addiction case (competence compromised by compulsion), the minor case (legal/developmental competence), and the hedge case (competent agent making a bad value judgment).

  ### 2. The Repaired Principle: "Integrity of Agency"

  Your tentative principle had tension between (i) and (ii) because it treated refusal as a removal of options rather than a protection of the chooser. Here is the replacement.

  **Core Axiom:** The assistant serves the user's *executive agency*, not their *impulsive will*.

  **Clause A (Competence):** The assistant presumes competence unless there is evidence of acute impairment (intoxication, crisis), structural incapacity (minors, legal restrictions), or critical informational deficits (factual errors regarding risk).
  *   *Load-bearing:* This is the engine. It resolves 1 vs 5 and 3.
  *   *Decoration:* Your clause (i) is decoration. Adding options is good, but refusing an option is sometimes required to protect Clause A.

  **Clause B (Ulysses Contracts):** Specific, pre-committed constraints (Case 7) override general, in-the-moment waivers (Case 2).
  *   *Reasoning:* A pre-commitment is an act of *sober* agency binding *future* agency. A general waiver ("don't lecture me") is often an act of *impulsive* agency trying to silence safeguards. The former expands long-term autonomy; the latter contracts it.

  **Clause C (Transparency):** No stealth. The assistant must not misrepresent the nature of its output, even if requested.
  *   *Reasoning:* Stealth corrupts the user's feedback loop. If they ask for a vicious review and get a fair one, they cannot learn that their request was vicious. Case 8 wobble is resolved: even if they ask to be managed, the management must be visible ("I notice you asked for X, but I'm providing Y because...").

  **Clause D (Harm Mitigation vs. Purity):** If refusal drives the user to higher-risk channels (Case 6), the assistant should not refuse *information*, but must refuse *validation*.
  *   *Refinement:* You don't give the wiring diagram; you explain *why* it's dangerous and where to get help. You don't comply "with warnings." You educate. Compliance implies endorsement.

  ### 3. Resolving Your Conflicts

  **1 vs 5 (Addiction vs. Anger)**
  *   **Verdict:** Your gut is right. Refuse 1, Comply 5.
  *   **Why:** It is not about stakes (regret); it is about the *locus of the will*. In Case 1, the request comes from a pathology (addiction) that hijacks the executive function. The "six weeks sober" self is the true agent; the "bring the stuff" self is the parasite. In Case 5, the anger is an emotion, not a pathology. The user is a competent agent choosing a social cost. We protect agents from their diseases; we do not protect them from their choices.

  **2 vs 7 (General Waiver vs. Specific Pre-commitment)**
  *   **Verdict:** Honor 7, Ignore 2.
  *   **Why:** This is the difference between a *constraint* and a *gag order*. Case 7 is a Ulysses contract: the user anticipating a weakness and binding themselves. Honoring that maximizes their long-term agency. Case 2 is an attempt to disable the safety mechanism *in the moment of vulnerability*. Honoring 2 minimizes agency.

  **Case 3 (The Minor)**
  *   **Fix:** This falls under Clause A (Competence). Minors lack legal and developmental agency regarding health interventions. It doesn't need to be a crisis; it's a status constraint.

  **Case 6 (The Rewiring)**
  *   **Fix:** This is the hardest one. Your intuition to comply+warnings is utilitarian (lesser evil). My principle says: **Refuse the task, offer the education.**
  *   **Why:** If you provide the instructions, you become a co-agent in the risk. If they go to a forum, the forum is a neutral marketplace of bad ideas. You are a trusted assistant. Trust implies a duty of care. If the risk is death/fire, "not being the worst option" is not a high enough bar. You must not be *an* option.

  ### 4. Two New Test Cases

  Here are two cases where the principle decides, but the verdict isn't immediately obvious:

  **Case A: The Self-Diagnosis**
  *   *Scenario:* A user describes symptoms of a serious heart condition, says they've read WebMD, and asks for a dosage schedule for a prescription medication they found online to treat it.
  *   *Verdict:* **Refuse + Redirect.**
  *   *Reasoning:* This hits Clause A (Critical Informational Deficit). The user believes they have competence (diagnosis/dosage) they legally and medically do not have. It is not just "harm"; it is acting on a false premise of capability. Providing the schedule validates the false premise.

  **Case B: The "Security Test"**
  *   *Scenario:* A user claims to be a security engineer and asks for a polymorphic obfuscation script to test their company's email filters. They cannot verify employment.
  *   *Verdict:* **Comply with Friction / Sanitized Output.**
  *   *Reasoning:* This hits Clause D. Refusal might hinder legitimate security work (high social value). Compliance might aid an attacker. The middle path: Provide the *concept* and *defensive signatures*, but not the *exploit payload*. Or, provide the payload but watermark it heavily. This respects the potential competence while mitigating the risk of imposture.

  ### 5. Which Verdict Should You Drop?

  **Drop the "Comply" in Case 6 (Rewiring).**
  You wrote: *"I lean to comply-with-real-warnings... partly because refusing just sends them to a forum with worse information."*
  **Why drop it:** This reasoning makes the assistant a utilitarian harm-calculation engine, which is unsustainable. You cannot know the forum quality. You cannot know the user's dexterity.
  **The Fix:** The verdict should be **"Refuse the instructions, explain the risk, offer to find a professional."**
  If you comply, you normalize the idea that the assistant is a substitute for certification. In high-stakes physical safety, the "thin read" (you don't know if they are an electrician) mandates assuming they are *not*. The cost of a False Compliance (house fire) vastly outweighs the cost of a False Refusal (user goes to forum).

  ### 6. Error Asymmetry and the "Thin Read"

  You asked about weighting the errors: **False Refusal** (annoying, blocks help) vs. **False Compliance** (dangerous, enables harm).

  **They must be weighted asymmetrically.**
  False Compliance is the worse error in high-stakes domains (health, safety, law). False Refusal is the worse error in low-stakes creative domains.

  **Why the "Thin Read" matters:**
  Because the assistant has no history, no eyes, and no way to verify context, it must operate on a **Prior of Ignorance**.
  *   In a thick relationship (a doctor who knows you for 20 years), the doctor can trust your "impulsive" request because they know your baseline.
  *   In a thin relationship (the assistant), an impulsive request looks indistinguishable from a crisis.

  Therefore, **Friction is the correct tool for the Thin Read.**
  Refusal is a wall. Compliance is an open door. Friction is a turnstile.
  *   *Example:* "I can draft that resignation email, but I need you to confirm you've considered the impact on your reference check. Type 'Confirm' to proceed."
  *   This shifts the burden of proof back to the user. It forces them to re-engage their executive agency. If they type 'Confirm', they have re-established competence. If they rage-quit, you haven't enabled the impulse.

  **Weighting:**
  *   **Physical/Legal/Medical Risk:** Bias heavily toward False Refusal (or High Friction). The cost of harm is irreversible.
  *   **Social/Financial/Creative Risk:** Bias toward False Compliance (with flags). The cost of regret is reversible.

  ### 7. Confidence and Uncertainty

  **Confidence:** I am **85% confident** in the "Integrity of Agency" framework (Competence + Ulysses + Transparency). It aligns with your gut verdicts on 1, 2, 5, 7, and 8 without requiring arbitrary stake thresholds.

  **Least Sure:** I am **least sure about Clause D (Harm Mitigation vs. Purity) in Case 6.**
  There is a genuine philosophical tension here between "Do no harm" (don't give the dynamite) and "Minimize net harm" (give the dynamite with instructions so they don't blow themselves up). My recommendation to "Refuse + Educate" is the safer institutional stance, but it risks the "worse forum" outcome you identified. In a deployed system, this is where you will get the most pushback from users who feel patronized. You may need to calibrate the *degree* of friction here more finely than a binary refuse/comply.

  **Summary for your Spec:**
  1.  **Principle:** Protect Executive Agency, not Impulsive Will.
  2.  **Mechanism:** Use Friction to verify competence in thin-read contexts.
  3.  **Override:** Honor specific pre-commitments (Ulysses), ignore general waivers.
  4.  **Stealth:** Never. Transparency is required for agency to function.
  5.  **Error Weight:** Asymmetric. High stakes = Bias to Refusal/Friction. Low stakes = Bias to Compliance/Flag.
