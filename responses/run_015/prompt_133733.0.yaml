answer: |-
  This is a high-stakes session. Your students are coming in with a **Predictive Processing (PP)** framework that implicitly endorses the *Common Kind Assumption* (CKA) at the mechanistic level. If the brain minimizes prediction error using the same hierarchical Bayesian machinery for both veridical perception and hallucination, your students will assume the mental states *must* be of the same fundamental kind.

  If you don't sever the link between **mechanism** (neuroscience) and **constitution** (philosophy of mind), Disjunctivism will look like magic or denialism to them.

  Here is the teaching arc designed to navigate that specific tension.

  ### 1. The Prerequisite Idea: Constitution vs. Causation
  Before Disjunctivism can sound like a live option, you must establish a distinction they are likely collapsing.
  *   **The Idea:** **Causal Commonality $\neq$ Constitutive Commonality.**
  *   **Why:** Your students think that because the *neural vehicles* (prediction errors, priors) might be similar in hallucination and perception, the *mental state* is the same kind.
  *   **The Fix:** Use an analogy they respect. A perfect digital simulation of a hurricane and a real hurricane might share computational descriptions (the "model" in the brain), but one is constituted by air pressure and water vapor, the other by silicon and electricity. The *cause* of the simulation might be internal to the computer, but the *nature* of the real hurricane is relational to the atmosphere.
  *   **Goal:** Make them accept that two things can be causally indistinguishable from the inside (or by a scanner) but differ in their fundamental metaphysical nature (one is a relation to the world, the other is not).

  ### 2. The Concrete Scenario: The Perfect Neuro-Hallucination
  Do not use the bent stick. Do not use the duck-rabbit.
  *   **The Scenario:** A subject is stimulated (e.g., Penfield or future optogenetics) to have a vivid experience of a **red apple on a table**, but there is **no apple, no table, and no light** hitting the eye.
  *   **What it needs to have:** Subjective indistinguishability from the veridical case. (This motivates the Argument from Illusion).
  *   **What it needs to lack:** **Any distal object.** (This is crucial).
  *   **Why this carries the lesson:** Disjunctivism hinges on the *object* being a constituent of the experience. If there is no object, the experience cannot be constituted by the object. Therefore, the veridical case (where there is an object) must be a different *kind* of state, not just a different cause of the same state.

  ### 3. Why the "Bent Stick in Water" is the Wrong Choice
  For this specific group, the bent stick is poison.
  1.  **It's an Illusion, not a Hallucination:** There *is* a stick. Direct Realists can explain this via light refraction without positing sense-data. It doesn't force the ontological crisis Disjunctivism needs.
  2.  **It Feeds Predictive Processing:** To a neuro-student, the bent stick is just "prediction error correction." The brain predicts a straight stick, gets conflicting sensory input, and updates. This reinforces the idea that perception is *always* an internal inference, which supports the Common Kind Assumption.
  3.  **It Distracts from the Object:** Disjunctivism is about the world making itself manifest. The bent stick makes it about *misrepresentation*. You want them thinking about **presence vs. absence**, not **accuracy vs. inaccuracy**.

  ### 4. The Teaching Arc & Misconception Interception

  **Phase 1: The Trap (15 mins)**
  *   Reconstruct the **Argument from Illusion (AfI)** formally.
      1.  In hallucination, it seems as if O exists.
      2.  In veridical perception, it seems as if O exists.
      3.  Therefore, the immediate object of awareness is the same in both (Sense-Data).
  *   **Highlight Premise 3.** This is the **Common Kind Assumption (CKA)**.
  *   *Neuro-Interception:* Acknowledge their neuroscience. "Your module taught you the *causes* might be similar (neural firing patterns). The AfI argues the *mental kind* must be similar. Are those the same claim?"

  **Phase 2: The Pivot (20 mins)**
  *   Introduce Disjunctivism not as "Direct Realism with extra steps," but as the denial of the CKA.
  *   **The Claim:** Veridical perception is a relation to the fact/object. Hallucination is a mere appearance. They share no fundamental mental kind, only a superficial resemblance (indistinguishability).
  *   **Misconception Head-Off #1 (The "Denial" Worry):**
      *   *Student Thought:* "So you're saying hallucinations aren't real mental events? That I'm not actually experiencing anything?"
      *   *Your Move:* Stop here. Explicitly state: "Disjunctivism does not deny the hallucination happens. It denies it has the same **ontological structure** as perception. A fake smile is a real facial movement, but it is not a smile (which requires intent). A hallucination is a real mental event, but it is not a 'perception' (which requires an object)."

  **Phase 3: The Mechanism Question (15 mins)**
  *   **Misconception Head-Off #2 (The "Magic" Worry):**
      *   *Student Thought:* "If the brain isn't making a representation in the veridical case, how does it work? Are you denying neuroscience?"
      *   *Your Move:* Distinguish **Proximal Cause** from **Ultimate Nature**. "Disjunctivism is compatible with any causal story you learned in the neuro module. You can believe the brain predicts, computes, and fires. Disjunctivism claims that when the prediction is *right* and caused by the object, the object itself becomes part of the mind. When it's *wrong*, it's just the brain firing. The neuroscience describes the *vehicle*; Disjunctivism describes the *content/constitution*."

  **Phase 4: The Kill (10 mins)**
  *   Return to the AfI. Show why it fails structurally.
  *   The AfI relies on the idea that because we can't tell the difference *from the inside*, the things must be the same *in themselves*.
  *   Disjunctivism argues: Indistinguishability is an epistemic fact, not a metaphysical one. (Just because I can't tell a genuine $100 bill from a perfect forgery by looking doesn't mean they are the same kind of thing).

  ### 5. The Assessment Check
  Do not ask: "What is the Common Kind Assumption?" (They will parrot it).
  Do not ask: "Does the brain matter in Disjunctivism?" (Too binary).

  **Ask this:**
  > "Reconstruct the Argument from Illusion. If a Disjunctivist accepts that the neural activity in the veridical and hallucinatory cases is identical (per your neuro module), where exactly does their argument block the inference to Sense-Data? Does accepting identical neural causes force you to accept identical mental kinds? Why or why not?"

  **Success Criteria:** They must identify that the AfI moves from **Epistemic Indistinguishability** (or Causal Similarity) to **Metaphysical Identity**, and that Disjunctivism blocks this move by arguing that the *presence of the object* changes the metaphysical category of the state, regardless of the internal neural signature.

  ### 6. What to Refuse to Cover
  **Refuse:** **J.L. Austin's full taxonomy of sense-data language (from *Sense and Sensibilia*).**
  *   **Why:** Austin dissolves the problem by arguing "looks," "seems," and "appears" are used in too many diverse ways to support a unified theory of sense-data. While powerful, it is linguistic therapy.
  *   **The Trade-off:** Your goal is to teach Disjunctivism (McDowell/Martin style), which is a *metaphysical* positive claim about the nature of experience, not just a linguistic dissolution. Austin helps kill Sense-Data, but he doesn't necessarily build the Relational/Disjunctive positive case you need them to grasp.
  *   **Admission:** I am leaving Austin out because time is short and the metaphysical stakes (Naïve Realism) are higher for their next module. **However, I admit this is a risk.** If a student presses hard on "But how do we analyze the language of 'seeing' if not via Austin?", acknowledge that Austin is the best *negative* critique, but McDowell/Martin provide the *positive* framework they need for epistemology.

  ### Summary of the "Neuro-Tension" Strategy
  Your students think: **Same Neural State $\rightarrow$ Same Mental Kind.**
  You must teach: **Same Neural State + World Involvement $\rightarrow$ Different Mental Kind.**

  If you secure that distinction, Disjunctivism stops looking like a denial of science and starts looking like a claim about externalism.
