answer: |-
  Here is the 5-minute triage procedure, the canned responses, the test runs, and the honest limitations you asked for.

  ### The 5-Minute Triage Procedure

  Do not read the whole thread. Read the opening post and the first two pages of replies. Look for the *pivot point* where the conversation stalls.

  **Step 1: The Authority Check (1 minute)**
  Is there an external, accepted standard governing the term in this context?
  *   **Yes:** (e.g., IAU for "planet," DSM-5 for "disorder," Site Rules for "harassment").
      *   *Action:* If one side ignores the standard, it is **Framework Choice** (see Outcome D).
      *   *Action:* If both accept the standard but argue over whether the object fits the criteria, it is **Real Disagreement** (Outcome B).
  *   **No:** (e.g., "understanding," "consciousness," "art," "cult" in casual speech).
      *   *Go to Step 2.*

  **Step 2: The Translation Test (2 minutes)**
  Can you charitably restate Person A's claim using Person B's definitions without losing the core warning or prediction?
  *   *Example:* Person A says "It's a cult." Person B says "It's a religion."
  *   *Test:* If A means "high control/high harm" and B means "theological system," can A say "It is a high-control religious system" and B agree?
  *   **Yes:** The dispute is **Verbal**. Go to Step 3.
  *   **No:** They disagree on the underlying facts (e.g., level of control, existence of harm). This is **Real Disagreement** (Outcome B).

  **Step 3: The Stakes Test (2 minutes)**
  Does the label carry normative weight that changes site policy or real-world action?
  *   **Low Stakes:** (e.g., "Is Pluto a planet?" affects astronomy textbooks, not site safety).
      *   *Verdict:* **Verbal-and-Done** (Outcome A).
  *   **High Stakes:** (e.g., "Is this group a cult?" affects whether we ban them; "Does the bot understand?" affects AI safety policy).
      *   *Verdict:* **Verbal-but-Worth-Having** (Outcome C). Do not lock; move to a [Definitions] or [Meta] tag.

  ---

  ### The Canned Lines (Copy/Paste)

  **Outcome A: Verbal-and-Done (Lock/Archive)**
  > "This thread has stalled on a definition without a shared standard (e.g., IAU, legal code). Both sides are internally consistent but using different vocabularies. Since this distinction carries no immediate policy or factual consequence for this community, we are archiving this to prevent cyclical arguing. You are free to discuss the *implications* of either definition in a new thread."

  **Outcome B: Real Disagreement (Let Run)**
  > "Moderator Note: This discussion contains substantive factual or theoretical disagreements that remain even when definitions are clarified. Please continue, but adhere to the rule on charitable interpretation. Do not retreat into semantics to avoid engaging with the opposing evidence."

  **Outcome C: Verbal-but-Worth-Having (Move/Tag)**
  > "This debate hinges on framework adoption (which definition we *should* use) rather than truth within a framework. This is a valuable philosophical discussion but derails topic-specific threads. We are retagging this as [Meta/Definitions]. Please focus on the *utility* of the terms, not just their correctness."

  **Outcome D: Framework Choice (Hand Off to Mod/Panel)**
  > "This thread is asking the community to settle a definition that is currently governed by an external authority [cite authority] or Site Policy. This is not a user-decidable matter. I am locking this for review by the moderation panel to determine if our community standards need to adopt a specific vocabulary for this topic."

  ---

  ### Test Run 1: Is Pluto a Planet?

  *   **Step 1 (Authority):** Yes. The International Astronomical Union (IAU) set a definition in 2006.
  *   **Step 2 (Translation):** One side uses "Planet" = "IAU Definition (clears orbit)." Other side uses "Planet" = "Geophysical Definition (round, orbits star)." They can translate: "Pluto is a geophysical planet but not an IAU planet."
  *   **Step 3 (Stakes):** Low. It changes textbooks, not site safety or ethics.
  *   **Verdict:** **Outcome A (Verbal-and-Done).**
  *   **Why:** The scientific community has settled the framework. Arguing against it here is Framework Choice, but since the stakes are low, it's noise.

  ### Test Run 2: Does the Chatbot Understand?

  *   **Step 1 (Authority):** No. There is no consensus in philosophy of mind or AI science on the necessary and sufficient conditions for "understanding."
  *   **Step 2 (Translation):** Side A means "Functional competence" (passes Turing test). Side B means "Phenomenal experience" (qualia). If A says "It functions as if it understands," B might still say "But it doesn't *feel*." The translation fails to resolve the tension because the concept of "understanding" is the battleground.
  *   **Step 3 (Stakes):** High. If it understands, do we have ethical obligations to it? If it doesn't, is it dangerous because it deceives us?
  *   **Verdict:** **Outcome C (Verbal-but-Worth-Having).**
  *   **Why:** No authority exists, translation fails (concepts are contested), but the stakes (AI ethics) are high enough to warrant discussion, just not in a general science thread.

  ---

  ### The Verdict You Will Hate

  You are going to hate **Outcome A on the Chatbot thread.**

  Here is why: You know your users. They will scream that you have silenced the most important question of our time by calling it "semantics." You will feel like you are treating a deep metaphysical mystery as a dictionary squabble. You will worry that the "Real Disagreement" (about AI safety) is being buried because you couldn't separate it from the "Verbal Disagreement" (about the word 'understand').

  You will hate it because **Outcome A feels like censorship when the stakes feel high,** even if the procedure says the stakes are definitional.

  ### Limitations: The "Half-and-Half" Problem

  You asked: *Most of my threads feel half verbal and half real and I don't know if that's inside the procedure or outside it.*

  **It is outside the procedure.** This procedure forces a binary choice for the sake of your sanity and the site's usability. It cannot disentangle mixed disputes perfectly.

  *   **The Risk:** In a "half-and-half" thread, applying Outcome A (Lock) risks silencing the real half. Applying Outcome B (Let Run) risks letting the verbal half burn out the participants.
  *   **The Fix:** When in doubt on a mixed dispute, **default to Outcome C (Verbal-but-Worth-Having).** Tag it, move it to Meta, and pin a post asking users to define their terms before arguing facts. This burns 10 minutes of your time now to save 100 pages of thread later.
  *   **The Hard Truth:** You cannot moderate ontology. You can only moderate *discourse*. If they refuse to define terms after you ask, *then* you lock for "failure to engage charitably," not for "being wrong about reality."

  ### The Precondition: Right Vocabulary

  You asked: *If I have to settle first whether any one vocabulary is the right one before I can run any of this, say so.*

  **Yes.**

  This procedure **only works** if you (or your panel) are willing to enforce an authority in Step 1.
  *   For **Pluto**, you must accept the IAU as the "right vocabulary" for science threads. If you don't, Step 1 fails, and every astronomy thread becomes a Framework Choice debate.
  *   For **Cult vs. Religion**, you must decide if your site uses a sociological definition, a legal definition, or a colloquial one.
  *   For **Chatbots**, there *is* no right vocabulary. You cannot settle this. That is why the verdict is Outcome C (Meta-discussion) rather than Outcome A or D.

  **Summary:** You cannot use this procedure to find truth. You use it to identify *which kind of game* they are playing. If they are playing different games without realizing it, you pause the match. If they are playing the same game and disagreeing on the score, let them play. If they are arguing about which game to play, send them to the committee room.
