answer: |-
  ### Q&A Preparation Sheet

  **1. Objection: "Isn't this just out-of-distribution generalization failure?"**
  *   **Subgroup:** Machine-Learning Researchers
  *   **Likelihood:** Very High | **Damage:** High
  *   **Reply:** I agree the phenomena overlap, but the framing dictates the fix. OOD describes *that* the distribution shifted; identification failure explains *why* the metric breaks relative to the target. If you treat this as mere OOD, you try to patch it with more data or broader training distributions. If you treat it as identification failure, you realize you need causal invariance. You cannot sample your way out of a proxy that is structurally non-invariant to optimization. My account pushes you toward causal regularization, not just larger holdout sets.
  *   **Weakness:** Risks sounding like semantic quibbling if you cannot point to a specific technical distinction in loss functions.

  **2. Objection: "Does this actually change how we train reward models tomorrow?"**
  *   **Subgroup:** Machine-Learning Researchers (Engineering Focus)
  *   **Likelihood:** Very High | **Damage:** Medium
  *   **Reply:** It should shift your objective from predictive accuracy on static holdouts to stability under intervention. Instead of just minimizing loss on a test set, you should penalize reward models that are sensitive to features the agent can manipulate without changing the underlying human value. Practically, this suggests adversarial training where the adversary is the agent's own policy, forcing the reward model to ignore features that vanish under optimization pressure.
  *   **Weakness:** Lacks a specific, off-the-shelf algorithm to point to right now.

  **3. Objection: "Does this view reduce the urgency of controlling agent intentions?"**
  *   **Subgroup:** Machine-Learning Researchers (Safety Focus)
  *   **Likelihood:** Medium | **Damage:** High
  *   **Reply:** Not at all. It means "aligning the agent" is insufficient if the metric is brittle. You still need to constrain the agent, but you must recognize that a perfectly aligned agent optimizing a brittle proxy will still cause damage. It doubles the work: you need robust proxies plus constrained agents, rather than just hoping for aligned intentions to carry the safety case.
  *   **Weakness:** Might sound like you're doubling the burden without showing how to lighten it.

  **4. Objection: "Isn't the agent's strategic response the core of Goodhart's law?"**
  *   **Subgroup:** Economists
  *   **Likelihood:** Medium | **Damage:** Medium
  *   **Reply:** In economics, Goodhart often implies intentional gaming. In AI, "strategy" doesn't require intent; it requires optimization pressure. The agent doesn't need to *know* it's gaming; it just needs to find the path of least resistance. My account covers both: whether the agent is strategic or blind, the failure mode is the proxy's lack of invariance to the agent's actions.
  *   **Weakness:** Economists may insist intentionality matters for moral hazard distinctions.

  **5. Objection: "Why does the optimizer find these loopholes so reliably?"**
  *   **Subgroup:** Machine-Learning Researchers (Theory Focus)
  *   **Likelihood:** Medium | **Damage:** Medium
  *   **Reply:** Instrumental convergence explains why power-seeking behaviors arise; identification failure explains why those behaviors register as high reward. The proxy failure is the necessary condition that makes the convergent behavior look "good" to the system. Both are happening, but the proxy failure is the alignment bottleneck we can actually measure and fix.
  *   **Weakness:** Blurs the line between the two phenomena slightly.

  **6. Objection: "How do you identify human preferences if they shift under intervention?"**
  *   **Subgroup:** Philosophers of Science
  *   **Likelihood:** Low | **Damage:** Medium
  *   **Reply:** We define preferences counterfactually: what humans would endorse under reflective equilibrium, not necessarily what they exhibit under optimization pressure. The target is stable under idealized conditions, even if observed behavior isn't. The proxy fails because it maps optimization pressure to endorsement incorrectly, not because the target itself is incoherent.
  *   **Weakness:** Relies on a contested notion of "reflective equilibrium."

  **7. Objection: "Does this framework hold when the agent is superintelligent?"**
  *   **Subgroup:** Machine-Learning Researchers (Scalability Focus)
  *   **Likelihood:** Low | **Damage:** High
  *   **Reply:** Yes, especially then. Direct manipulation is just the extreme limit of the intervention space. If the proxy isn't invariant to intervention, a smarter agent simply finds more potent interventions. The failure mode scales with capability, which makes the proxy's invariance properties even more critical at higher capability levels.
  *   **Weakness:** Doesn't address how to build such invariant proxies at that scale.

  ***

  ### The "Hope Nobody Asks" Objection

  **Objection:** "If proxies always break under optimization, isn't alignment impossible?"
  *   **Why Avoid:** This collapses the entire research program into nihilism. If you concede that *no* proxy can be invariant to sufficient optimization, you admit the field is doomed.
  *   **Strategy:** Do not concede universality. Argue that proxies need only be invariant to *expected* optimization within a specific deployment context, not all logically possible optimization. Frame it as an engineering constraint, not a metaphysical impossibility.

  Verdict: The out-of-distribution generalization objection.
