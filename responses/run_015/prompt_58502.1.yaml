  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Thesis:** In a broadly just and democratic multinational state, a procedurally fair majority vote for independence does *not* by itself establish a moral right to secede, even with distinct identity and history of autonomy.
