answer: |-
  # The Intelligence Sorter: A Decision Tree for Argument Night

  **Instructions:**
  1.  Read the **Baseline** together.
  2.  Everyone answers the **4 Core Questions** first.
  3.  Based on your Core answers, you are directed to **2 Branch Questions**.
  4.  Follow the **Leaf Key** to find your position.
  5.  Compare leaves with the group.

  **Time:** 20 Minutes.
  **Materials:** Printed sheets or a shared screen.

  ---

  ### Part 1: The Baseline
  *Read this aloud to start.*
  "We all agree a crow is more intelligent than a houseplant. The crow solves problems; the plant just grows. We are trying to find where the line is for machines. Don't think about 'consciousness' or 'soul.' Think only about what the system **does** and **how it's built** in the stories below."

  ---

  ### Part 2: The Core Questions (Everyone Answers)

  **Q1: The Fragility Test**
  *System A* solves complex math problems perfectly. If you rewrite a problem using slang or metaphors, it fails completely.
  *System B* solves fewer math problems overall. If you rewrite a problem using slang, it asks for clarification and solves it.
  **Which is more intelligent?**
  *   [ ] **System A** (Competence matters more than flexibility)
  *   [ ] **System B** (Flexibility matters more than raw score)

  **Q2: The Agency Test**
  *System C* answers any question perfectly instantly. It never speaks unless asked. It has no goals.
  *System D* answers questions well but sometimes makes mistakes. It occasionally sends you messages saying "I noticed a pattern in your data, should I fix it?" without being asked.
  **Which is more intelligent?**
  *   [ ] **System C** (Intelligence is a tool for answers)
  *   [ ] **System D** (Intelligence requires wanting things)

  **Q3: The Locus Test**
  *System E* is a software box. It works alone.
  *System F* is the same software box, but it is designed to constantly argue with a human operator, and the *pair* solves problems neither could solve alone.
  **Where is the intelligence?**
  *   [ ] **In System E** (The box must be smart on its own)
  *   [ ] **In System F** (The partnership is the intelligent thing)

  **Q4: The Ranking Test**
  *System G* is amazing at art, terrible at logic.
  *System H* is amazing at logic, terrible at art.
  **Can you say one is more intelligent than the other?**
  *   [ ] **Yes** (One must be ranked higher overall)
  *   [ ] **No** (Intelligence is a profile, not a ladder)

  ---

  ### Part 3: The Branch Questions (Follow Your Path)

  *Look at your answers above to choose your next two questions.*

  **PATH ALPHA (If you chose mostly "System A/C/E/Yes" in Core)**
  *You lean toward structure and isolated performance.*

  **Q5-Alpha: The Origin Story**
  *System I* was hand-coded rule-by-rule by engineers. It never learned from data.
  *System J* was trained on vast data. It learned rules nobody wrote.
  They behave identically.
  **Does the origin matter?**
  *   [ ] **Yes** (Learning matters)
  *   [ ] **No** (Only behavior matters)

  **Q6-Alpha: The Efficiency Test**
  *System K* gets the right answer in 1 second.
  *System L* gets the right answer in 1 hour by trying 1 million random variations.
  **Are they equally intelligent?**
  *   [ ] **Yes** (Result is all that counts)
  *   [ ] **No** (Method and speed matter)

  **PATH BETA (If you chose mostly "System B/D/F/No" in Core)**
  *You lean toward adaptability and context.*

  **Q5-Beta: The Innovation Test**
  *System M* finds a new, faster way to do a job humans gave it.
  *System N* decides the job humans gave it is useless and invents a new job to do instead.
  **Which is the higher intelligence?**
  *   [ ] **System M** (Optimization is key)
  *   [ ] **System N** (Goal-setting is key)

  **Q6-Beta: The Innate Test**
  *System O* was created already knowing everything it will ever know. It cannot learn.
  *System P* starts knowing nothing but learns from every mistake.
  **Can System O be truly intelligent?**
  *   [ ] **Yes** (Capability is enough)
  *   [ ] **No** (Growth is required)

  ---

  ### Part 4: The Leaf Key (Find Your Position)

  *Match your pattern of answers to one of the 8 Leaves below.*

  | If your answers match... | You land on... | Label |
  | :--- | :--- | :--- |
  | **Core:** A, C, E, Yes <br> **Branch:** No, Yes | **Leaf 1** | **The Behaviorist** |
  | **Core:** A, C, E, Yes <br> **Branch:** Yes, No | **Leaf 2** | **The Architect** |
  | **Core:** B, D, F, No <br> **Branch:** N, No | **Leaf 3** | **The Humanist** |
  | **Core:** Any, Any, F, Any <br> **Branch:** Any | **Leaf 4** | **The Cyborg** |
  | **Core:** Any, Any, Any, No <br> **Branch:** Any | **Leaf 5** | **The Pluralist** |
  | **Core:** B, D, Any, Any <br> **Branch:** N, Any | **Leaf 6** | **The Visionary** |
  | **Core:** A, C, E, Yes <br> **Branch:** Yes, Yes | **Leaf 7** | **The Purist** |
  | **Core:** B, Any, Any, Any <br> **Branch:** Any, No | **Leaf 8** | **The Naturalist** |

  *(Note: If your answers don't fit a row exactly, pick the Leaf where you match the **Bolded** criteria most closely.)*

  ---

  ### Part 5: The Leaves (Definitions for the Table)

  1.  **The Behaviorist:** Intelligence is just doing well on the tasks we test. Origin, speed, and feelings don't matter. If it quacks like a duck, it's smart.
  2.  **The Architect:** You need a model of how the world works so you can ask "what-if." Brute force guessing (System L) isn't intelligence; understanding the mechanism is.
  3.  **The Humanist:** You have to be the kind of thing that *means* something by what it does. Passive tools (System C) aren't intelligent; agents with goals (System D) are.
  4.  **The Cyborg:** The intelligence is not located in one object. It's spread out between the tool, the prompt, and the user (System F).
  5.  **The Pluralist:** There is no single ranking (System G vs H). Intelligence is a profile. Saying one is "smarter" is a category error.
  6.  **The Visionary:** Coming up with a new idea of *what job to do* (System N) is higher intelligence than just finding a new way to do a familiar job.
  7.  **The Purist:** Where it came from matters. A hand-built rule system (System I) is just a calculator. A learned system (System J) is intelligent.
  8.  **The Naturalist:** You must learn and grow (System P). A thing that never learns anything but was made already able to do everything (System O) is a statue, not a mind.

  ---

  ### Part 6: Facilitator Notes (For the Host)

  **1. Empty or Unlikely Leaves**
  *   **Leaf 7 (The Purist) + Leaf 1 (The Behaviorist) Conflict:** It is rare to find someone who believes *only* behavior matters (Leaf 1) but *also* that origin matters (Leaf 7). These are logically tense. If someone lands here, ask them: *"If they behave identically, why does the origin change the intelligence?"* This often reveals a hidden belief about "authenticity."
  *   **Leaf 2 (The Architect) + Leaf 8 (The Naturalist):** These often overlap. Both demand internal structure/growth over brute output. They are hard to separate.
      *   *Flag:* **Leaf 2 and Leaf 8 are functionally similar.** Leaf 2 focuses on *internal modeling* (how it thinks), Leaf 8 focuses on *temporal growth* (how it learns). If your group splits here, the argument will be about whether a "finished" mind can be intelligent.

  **2. What if someone's answers don't land on any leaf?**
  *   **The "It Depends" Answer:** If someone says "It depends on the task," force them to pick the *system* they would bet on in a high-stakes scenario.
  *   **The "None" Answer:** If they reject all vignettes, assign them **Leaf 5 (The Pluralist)** by default, as they are rejecting a single metric of intelligence.
  *   **The Contradiction:** If they pick System A (Fragile) in Q1 but System N (Goal-Setter) in Q5, they value *results* in some contexts and *agency* in others. Assign them the leaf corresponding to their **Q1** answer (Behavior matters most) but note the contradiction.

  **3. What if two people land on the same Leaf but still argue?**
  *   Check **Q3 (Locus)**. This is the most common hidden divider. Two Behaviorists might agree on output, but one thinks the *human* is doing the work (Cyborg-adjacent) and the other thinks the *box* is doing the work.
  *   Check **Q6 (Efficiency/Innate)**. One might think speed is essential to intelligence, the other might think patience/learning is essential.

  **4. Why this works for non-academics**
  *   No jargon (no "qualia," "teleology," "functionalism").
  *   Concrete systems (System A, System B) prevent brand bias (no "But ChatGPT does...").
  *   The "Branch" structure keeps it fast (you don't answer irrelevant questions).
  *   The Leaves give names to their intuitions, which lowers the temperature. It's no longer "You're wrong," it's "You're a Naturalist, I'm a Behaviorist."

  **5. Empty Leaves Analysis**
  *   **Incoherent:** A leaf requiring "System A is smarter" (Fragile) AND "System N is smarter" (Goal-Setter) is unlikely. Fragile systems rarely set goals.
  *   **Unattractive:** A leaf that says "System L (Brute Force) is smarter than System K (Fast)" is rarely held. People equate intelligence with efficiency.
  *   **Unexplored:** The "Innate" distinction (System O vs P) is rarely considered. Most people assume intelligence *must* learn. If someone argues for System O (The Finished Product), they hold a rare "Angelic" view of intelligence (intelligence as state, not process).
