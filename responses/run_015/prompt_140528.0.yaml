answer: |-
  Here are three candidate scenarios I considered before settling on the one below.

  **Candidate 1: The Van Meegeren Verdict.**
  *Scenario:* A forger replicates a known Vermeer versus inventing a new Vermeer.
  *Rejection:* Too much historical baggage. Van Meegeren used Bakelite and modern pigments that fail chemical analysis immediately. This violates your "ordinary art-historical means" constraint and introduces material differences that muddy the perceptual test. It also triggers the "market dumbness" reflex too easily because the prices are so astronomical.

  **Candidate 2: The Digital Giclée.**
  *Scenario:* A high-resolution print of a known painting (A) versus a digital collage in the style of the artist (B), printed on canvas and hand-varnished.
  *Rejection:* Violates the "human maker" constraint. It introduces mechanical reproduction as a variable, which allows the perceptualist to dodge the agency question by blaming the printer. We need the hand of the forger to be the sole variable.

  **Candidate 3: The Workshop Pastiche (Selected).**
  *Scenario:* A skilled contemporary painter working in a conservation studio creates two pastel drawings attributed to Degas.
  *Why this works:* Pastel is autographic and gestural. It records pressure and speed. It allows for a distinction between "copying a contour" and "describing a form" that a conservator like Priya would recognize physically, not just theoretically.

  ***

  ### The Scenarios

  **Case A (The Replication):**
  In a private conservation studio in 2023, a master draftsman named Elias produces a pastel on 19th-century paper using period-correct pigments. He places a known, minor Degas work (*Dancer Tying a Ribbon*, held in a private Swiss collection) on a light table and meticulously replicates it, stroke for stroke. He matches the pressure, the smudge, and the color layering exactly. The work is sold at auction as a "Newly Discovered Degas." In 2024, archival receipts surface proving Elias bought the paper and pigments. The attribution is revoked. The object is physically indistinguishable from the Swiss original to the naked eye, but it is now known to be a direct copy of an existing work.

  **Case B (The Invention):**
  In the same studio, during the same month, Elias uses the exact same batch of pigments and paper. He does not look at any specific Degas. Instead, he composes a new scene (*Dancer Resting*) from his imagination, utilizing his deep knowledge of Degas's anatomy, palette, and compositional habits. He paints confidently, making all the decisions a Degas would make, but the image itself has no prior original. It is sold as a "Newly Discovered Degas." In 2024, the same archival receipts surface. The attribution is revoked. The object is physically indistinguishable from a genuine Degas to the naked eye, but it is now known to be an invention in a style, not a copy of a specific work.

  ***

  ### The Analysis

  **(a) The Verdicts**

  *   **The "It's Just a Lie" Account:**
      *   **Verdict:** Identical for A and B. Both are frauds.
      *   **Reasoning:** The moral and legal wrong is the misrepresentation of provenance. Since the deception is identical (both sold as Degas), the moral status is identical. Aesthetically, this account predicts no change in the object's value as a picture; the light hitting the retina is the same, so the beauty is the same. The market drop is purely financial panic, not aesthetic loss.
  *   **The "History of Production" Account (Goodman-ish):**
      *   **Verdict:** Both are fakes (not works of Degas), *but* the perceptual implication differs.
      *   **Reasoning:** In **Case A**, knowing the history reveals the object as a *duplicate*. We perceive the strokes as *reactions* to another artwork. We are looking at a record of Elias looking at Degas. In **Case B**, knowing the history reveals the object as a *pastiche*. We perceive the strokes as *decisions* about the subject. We are looking at a record of Elias looking at a dancer. The history changes *what* we see the strokes doing: in A they track a surface; in B they describe a form.
  *   **The "Achievement" Account:**
      *   **Verdict:** Case B is aesthetically superior to Case A.
      *   **Reasoning:** Artistic value tracks creative problem-solving. In **Case A**, Elias solved only technical problems (matching color, matching line). In **Case B**, Elias solved compositional and narrative problems (balance, focus, anatomy) within a stylistic constraint. B embodies a higher degree of artistic agency and creative risk than A. Therefore, B retains more aesthetic value as a human achievement, even if both fail as historical artifacts.

  **(b) The Single Feature Doing the Work**
  The variable is **Generative Intent**. In Case A, the intent is *replicative* (match the source). In Case B, the intent is *generative* (describe the subject). Everything else (materials, skill, time, deception) is held constant.

  **(c) If You Remove That Feature**
  If you remove the distinction between copying and inventing, the pair collapses into **Case A**. Why? Because "inventing in a style" is the default assumption of authorship. If you remove the "copying" variable, you just have "works by Elias." If you remove the "inventing" variable, you just have "copies." The tension only exists because we have one of each. If both were copies, the Achievement account would condemn both equally. If both were inventions, the Achievement account would praise both equally (relative to copying). The divergence *requires* the Copy/Invention split.

  **(d) The Counter-Attack and Its Validity**
  A defender of the "Just a Lie" account (or a Hard Perceptualist) will attack the **Achievement** verdict. They will argue: *"If I cannot see the difference in intent without the archival receipt, the difference is not aesthetic, it is biographical. You are smuggling history back in through the back door of 'achievement'."*

  **Does this land?** Partially, but it is ultimately ad hoc. It relies on a definition of "aesthetic" that excludes agency. However, in autographic arts like pastel or oil, the *gesture* is the art. A replicative gesture (copying a contour) physically differs in micro-topography from a generative gesture (constructing a form). A conservator like Priya knows that "dead" strokes (copying) often lack the micro-variation of "live" strokes (inventing). If the Hard Perceptualist denies that the *manner of production* is perceptible in the *quality of the line*, she is denying the basic premise of connoisseurship. She is treating the painting as a photograph, not a record of action. If she concedes that we see *actions* in paintings, she must concede that copying actions differ from inventing actions.

  ***

  ### The Hard Perceptualist Challenge (Constraint 4)

  Can we force the Hard Perceptualist to concede that the truth is visible in one case and not the other?

  **Yes, but with a caveat.**
  She must concede in **Case A (The Copy)**.
  Once she knows Case A is a copy, she can no longer see the lines as *defining* the form; she must see them as *tracing* the form. This changes the aesthetic experience from "seeing a leg" to "seeing someone draw a leg." In **Case B**, even knowing it is a fake, she still sees the lines as *defining* the form, because there is no other original to compare it to. The lines in B still function as descriptive marks. The lines in A function as replicative marks.

  **The Caveat:** If she is a *radical* physicalist who believes aesthetic properties supervene *only* on photon reflection, she cannot be forced. She would say, "The pigment is the same, so the art is the same." But if she says that, she is no longer an art critic; she is a spectrophotometer. Given that Priya is a conservator, she works with the material history of the object. She knows that a stroke made to *match* differs in pressure and flow from a stroke made to *describe*. Therefore, the perceptualist position breaks if it ignores the physics of the gesture.

  ### Conclusion for Priya

  Priya is wrong to say the "Achievement" and "History" lines are the same account.
  *   **History** says: "This is not the object Degas made." (Condemns A and B equally).
  *   **Achievement** says: "This does not embody the same creative act." (Condemns A more than B).

  If they were the same account, they would have to rank A and B identically. They don't. The "Just a Lie" account fails because it cannot explain why we feel differently about a forged *Mona Lisa* (copy) versus a forged *New Portrait of Lisa* (invention), even if the fraud is identical. The market might treat them the same, but our aesthetic engagement does not. We forgive the pastiche more than the photocopy. That forgiveness is aesthetic, not financial.
