answer: |-
  # SEMINAR HANDOUT: THE SPLIT-BRAIN DEBATE
  ## A Decision Tree on the Unity of Consciousness

  **START HERE: THE SHARED COMMITMENT**
  In commissurotomy patients, the hemispheres are isolated. The left hemisphere speaks and confabulates reasons for actions; the right hemisphere acts silently and perceives information the left cannot access.

  ⬇

  **NODE 1: THE DUAL-SPEECH CASE**
  *In atypical patients where both hemispheres can speak, if they give confident, conflicting answers to the same question (e.g. about taking a job), what is occurring?*

  ├── **Branch A:** Two distinct agents expressing conflicting preferences.
  │   ⬇
  │   **NODE 2: THE BANDWIDTH DIAL**
  │   *Imagine the callosal link is not cut but continuously tuneable from normal down to zero. Is there a sharp threshold where one subject becomes two?*
  │   │
  │   ├── **Branch Yes:** Unity breaks at a precise point of disconnection.
  │   │   ⬇
  │   │   **LEAF 1: TWO SUBJECTS, TWO STREAMS**
  │   │   *Position:* There are literally two people in one skull once the threshold is crossed.
  │   │   *Awkwardness:* Must explain why they sometimes cooperate or share pre-surgery skills without friction.
  │   │
  │   └── **Branch No:** Unity fades gradually or there is no precise break.
  │       ⬇
  │       **LEAF 2: UNITY AS A MATTER OF DEGREE** *(Parfitian)*
  │       *Position:* Personhood is not a yes/no matter; it weakens as connection weakens.
  │       *Awkwardness:* Makes moral responsibility and survival difficult to calculate practically.
  │
  └── **Branch B:** One agent expressing internal conflict or ambivalence.
      ⬇
      **NODE 3: RIGHT-HEMISPHERE PHENOMENOLOGY**
      *When the right hand responds to a image shown only to the right eye, is that visual data felt by anyone?*
      │
      ├── **Branch A:** Truly unexperienced by the left; a separate phenomenal field exists.
      │   ⬇
      │   **LEAF 3: ONE SUBJECT, TWO STREAMS** *(Fragmented Unity)*
      │   *Position:* A single 'I' possesses two disconnected fields of experience simultaneously.
      │   *Awkwardness:* Can one 'I' really hold two contradictory visual experiences without noticing?
      │
      └── **Branch B:** Experienced but inaccessible (a reporting split, not a phenomenal one).
          ⬇
          **NODE 4: THE CONFABULATION QUESTION**
          *When the left invents a reason for the right's action, is it lying or reporting?*
          │
          ├── **Branch A:** It is a false report by a distinct subsystem (module).
          │   ⬇
          │   **LEAF 4: ONE SUBJECT, ONE STREAM (MODULAR)**
          │   *Position:* Unity is preserved, but the brain contains unconscious sub-agents.
          │   *Awkwardness:* Risks making the 'subject' a mere fiction painted over a swarm of modules.
          │
          └── **Branch B:** It is a genuine (though mistaken) belief of the single subject.
              ⬇
              **NODE 5: COUNTING CRITERIA**
              *Does behavioural independence entail numerical distinctness of subjects?*
              │
              ├── **Branch Yes:** Independent control implies separate subjects.
              │   ⬇
              │   **LEAF 5: NO FACT OF THE MATTER / INDETERMINATE**
              │   *Position:* The evidence pulls in opposite directions; there is no truth here.
              │   *Awkwardness:* Makes consciousness seem less real than arithmetic.
              │
              └── **Branch No:** One subject can have fragmented control.
                  ⬇
                  **LEAF 6: ONE SUBJECT, ONE STREAM (STANDARD)**
                  *Position:* The person is unified; the right hemisphere is merely an unconscious tool.
                  *Awkwardness:* Must explain away right-hand independence as automatic reflex, not will.

  ***

  ### NOTES ON AMBIGUITY & UNOCCUPIED SPACE

  **Unoccupied Combinations**
  *   **Two Subjects, One Stream:** Generally regarded as **incoherent**. If there are two subjects, the definition of 'subject' usually entails a distinct stream of experience.
  *   **One Subject, Zero Streams (Right Side):** The view that the right hemisphere is a 'zombie'. Occupied by some, but often deemed **unattractive** as it implies consciousness vanishes simply because speech centres are severed.

  **Indistinguishable Leaves**
  *   **Leaf 2 (Degree)** and **Leaf 5 (Indeterminate)** are difficult to pry apart. If unity is a matter of degree, there may be no fact of the matter at the margins. Students often treat these as the same position.

  **Guessing Nodes**
