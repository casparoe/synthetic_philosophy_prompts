      *   I need to be explicit about this.

      *(Refining the End-States)*: Arendt predicts Saturation (worldlessness). Compartmentalisation is the modern rival. If Compartmentalisation is true, Arendt's "erosion" is actually "fragmentation." This is a relocation, not a refutation.

