      *   *Claim (c) End-State (Shared World Loss):* The result is the destruction of the "common world" necessary for politics.
      *   *End-State Variants:* Substitution (belief), Saturation (nihilism), Compartmentalisation (tribalism).

  3.  **Evaluate Moving Parts & Exposures:**

      *   **Part (a): Contingency/Asymmetry.**
          *   *Vulnerability:* Is factual truth *really* less compelling than a coherent lie? Often, reality bites back (e.g., war outcomes, economic crashes).
          *   *Fatal:* If empirical reality imposes hard constraints that lies cannot overcome (e.g., you can't lie about a lost war indefinitely), the asymmetry collapses.
          *   *Awkward:* If digital archives make contingency *less* exploitable (harder to rewrite record).

      *   **Part (b): Structural-Coherence.**
          *   *Vulnerability:* Do liars actually aim for coherence? Post-modern propaganda often aims for confusion/noise, not a coherent alternative reality.
          *   *Fatal:* If the dominant mode of lying is incoherent noise (firehose of falsehood) rather than systematic rewriting, the mechanism fails.
          *   *Awkward:* If isolated lies persist without becoming systemic.

      *   **Part (c): End-State (Shared World).**
          *   *Vulnerability:* How do we measure the "shared world"?
          *   *Fatal:* If people still agree on basics despite disagreement on values (empirical studies on factual consensus).
          *   *Awkward:* If "Compartmentalisation" is the norm, does the shared world exist or not?

  4.  **Address Specific Defeaters:**

      *   **Archival Argument:** Technology makes lying harder.
          *   *Arendtian Counter:* Technology doesn't change human nature or the *interpretation* of facts. Deepfakes/fragmentation might worsen the asymmetry.
          *   *Concession:* If verification costs drop to near-zero *and* trust in verification rises, the asymmetry shrinks. But trust is the variable.
      *   **Observer Problem:** If the shared world is gone, how can you observe it?
          *   *Arendtian Counter:* The theorist stands in the "gap" or relies on the *experience* of loss (loneliness, superfluousness). It's phenomenological, not just empirical.
          *   *Risk:* Solipsism. If the thesis explains away all counter-evidence as "false consciousness" of the shared world, it's unfalsifiable.

  5.  **Address End-States (Substitution, Saturation, Compartmentalisation):**
      *   *Arendt's Prediction:* She leans towards **Saturation** (worldlessness) leading to totalitarianism, but **Substitution** is the immediate tool. **Compartmentalisation** looks more like modern polarization (Sunstein/etc.).
      *   *Distinction:*
          *   Substitution: People believe the lie. (Testable via polls).
          *   Saturation: People believe nothing. (Testable via trust metrics).
          *   Compartmentalisation: People know facts but deny relevance. (Testable via motivated reasoning experiments).
      *   *Impact:* If Compartmentalisation is dominant, Arendt might be wrong about the *mechanism* (coherence) but right about the *outcome* (loss of common ground). If Saturation is dominant, Arendt is strongest.

