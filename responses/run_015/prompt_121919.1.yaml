      *   *Incompatibility:* If it turns out facts *do* compel agreement when presented clearly (contradicting contingency), Fragility is hurt. If it's just tribal signaling (Compartmentalisation), Fragility might need adjustment (it's not the *loss* of the world, but the *weaponization* of it).

