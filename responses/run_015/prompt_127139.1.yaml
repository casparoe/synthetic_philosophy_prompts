answer: |-
  This procedure validates an accommodation plan only if it verifies that patient harm is bounded, traded preferences are robust against false beliefs and cheap talk, and systemic precedents are accounted for before any signatures are collected.

  ### The Decision Procedure

  **Step 1: The Patient Harm Threshold**
  *   **Question:** Does this plan impose suffering or risk on the patient that exceeds the threshold of acceptable harm for someone who cannot consent?
  *   **Sufficient Answer:** A consensus statement from the clinical lead and one lay member that the patient's physical suffering is managed (e.g., palliative coverage) and the risk is proportional to the potential benefit *as defined by the patient's best interests*, not merely the family's wishes.
  *   **Stop Condition:** If the clinical lead states the intervention is medically futile *and* the palliative layer cannot mitigate the suffering of the intervention itself, return **NO**.
  *   **Value Hand-off:** The definition of "acceptable harm" is a value judgment. If the clinician and lay member disagree, hand to the **Chaplain and second Lay Member** to arbitrate based on community standards of dignity.

  **Step 2: Currency Verification**
  *   **Question:** Is what is being traded actually what the party values, or are we offering policy concessions for needs of recognition?
  *   **Sufficient Answer:** The family articulates *why* the concession matters in their own words, matching the offered item (e.g., "We need the ritual of baptism" vs. "We need a policy exception").
  *   **Stop Condition:** If the family accepts a policy concession but articulates a need for recognition, ritual, or sequencing that the plan does not address, return **NO**.
  *   **Value Hand-off:** Determining whether a need is spiritual/ritualistic vs. procedural is a value judgment. Hand to the **Chaplain**.

  **Step 3: Preference Robustness (Intensity & Belief)**
  *   **Question:** Is the intensity of the preference real, and does it rest on empirical facts we accept as true?
  *   **Sufficient Answer:**
      *   *For False Beliefs:* If the preference rests on an empirical belief the team holds to be false (e.g., "This treatment will cure him"), the team must correct the belief. If the preference persists after correction, it is treated as a value, not a fact.
      *   *For Cheap Talk:* If the intensity is cheap to fake (e.g., "We will sue"), require evidence of sunk cost or consistency (e.g., prior documented wishes, consistent stance over time, willingness to endure hardship).
  *   **Stop Condition:** If the preference rests on a corrected false belief and disappears, or if the intensity is deemed cheap talk without evidence of commitment, return **NO**.
  *   **Value Hand-off:** Determining whether a persistent belief is a "value" worthy of accommodation despite being factually wrong is a value judgment. Hand to the **Lawyer and Lay Members** to assess reasonableness and liability.

  **Step 4: Moral Agency Classification**
  *   **Question:** Is the clinician *doing* the contested act or *allowing* it to happen?
  *   **Sufficient Answer:** The attending physician explicitly categorizes the action as "Active Intervention" or "Passive Allowance" and signs a statement confirming their moral distress level (None, Moderate, Unbearable).
  *   **Stop Condition:** If the attending classifies the act as "Active Intervention" that violates their core integrity (not merely preference) and rates distress as "Unbearable," return **NO**. Do not treat "allowing" as interchangeable with "doing" to bypass this.
  *   **Value Hand-off:** The classification of moral distress is internal to the clinician. No hand-off; the **Attending** has veto power here.

  **Step 5: Systemic Precedent Check**
  *   **Question:** Does this concession move the baseline for future cases such that a series of locally acceptable trades becomes a global loss for the institution or patient population?
  *   **Sufficient Answer:** The Committee Chair and Lawyer check the accommodation registry for similar cases in the last 24 months. They confirm this plan does not expand the boundary of acceptable care beyond established policy without a specific policy waiver.
  *   **Stop Condition:** If this plan creates a new precedent that undermines standard of care for future patients without a policy review, return **NO**.
  *   **Value Hand-off:** Determining the weight of precedent vs. current need is a value judgment. Hand to the **Committee Chair**.

  **Step 6: Final Value Sign-off**
  *   **Question:** Who owns the residual risk?
  *   **Sufficient Answer:** Each party signs only for the values they represent. The family signs for patient values/wishes; the team signs for medical safety/standards; the committee signs for ethical process.
  *   **Stop Condition:** If any party is asked to sign for a value they do not hold (e.g., family signing for medical efficacy), return **NO**.

  ***

  ### Application to Recurring Cases

  **Case 1: Time-limited trial for dying infant**
  *   **Step 1 (Harm):** Passes *only if* the palliative layer is robust enough to ensure the intensive treatment does not cause net suffering. If the treatment itself is painful and futile, this step returns **NO**.
  *   **Step 2 (Currency):** Passes if the family values "time for goodbye" rather than "cure." If they believe the trial will result in cure despite medical judgment, this is a currency mismatch.
  *   **Step 3 (Robustness):** **Flagged as Potential Phantom Trade.** If the family accepts the stop date only because they believe the baby might miraculously improve before then (false empirical belief), the gain is phantom. The procedure requires the team to correct this belief. If the family agrees to the stop date *understanding* death is the likely outcome, it passes.
  *   **Step 4 (Agency):** Passes. Clinicians are *withdrawing* treatment (allowing), not actively killing.
  *   **Step 5 (Precedent):** Passes if "time-limited trial" is established policy.
  *   **Verdict:** The procedure flags this as a **phantom trade** unless the family's acceptance of the stop date is verified as genuine understanding of the prognosis, not hope based on false efficacy.

  **Case 2: Jehovah's Witness surgery without transfusion**
  *   **Step 1 (Harm):** Passes. Surgery offers benefit; blood refusal risks death but respects integrity.
  *   **Step 2 (Currency):** Passes. Family values religious compliance; Team values surgical success.
  *   **Step 3 (Robustness):** Passes. Religious belief is high-intensity and hard to fake (consistent history).
  *   **Step 4 (Agency):** Passes. Team avoids *administering* blood (active violation) and accepts natural loss (allowing).
  *   **Step 5 (Precedent):** Passes. Established legal and ethical precedent.
  *   **Verdict:** **Valid Trade.**

  **Case 3: 17-year-old refusing transfusion**
  *   **Step 1 (Harm):** **Flagged.** The patient bears the ultimate cost (death). The procedure requires confirmation that this harm is acceptable under "mature minor" standards.
  *   **Step 2 (Currency):** Passes. Patient values autonomy; Hospital values legal protection.
  *   **Step 3 (Robustness):** **Flagged as Potential Phantom Trade.** The "understanding" documented may be a hurdle to clear rather than a genuine comprehension of death. If the signature is obtained to shield the hospital rather than ensure informed consent, the hospital's gain is legal safety, but the patient's gain (autonomy) is compromised by the power imbalance. The procedure requires a **Lay Member** to verify understanding independent of the treating team.
  *   **Step 4 (Agency):** Passes. Team allows death rather than forcing treatment.
  *   **Step 5 (Precedent):** Passes if consistent with state law on mature minors.
  *   **Verdict:** The procedure flags this as a **phantom trade** if the "understanding" is not rigorously verified by a neutral party. If the document is merely a liability shield, the trade is invalid.

  ***

  ### What The Procedure Cannot Do

  This procedure cannot resolve power imbalances inherent in the hospital setting, nor can it compensate for the tragedy of a situation where every option causes harm. It cannot force a family to understand medical reality if their denial is a coping mechanism rather than a factual dispute, and it cannot protect the committee from the emotional burden of authorizing a death that might have been prevented. Finally, it cannot substitute for the time required to build trust; it only audits the trade once proposed.
