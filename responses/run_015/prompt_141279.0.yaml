      *   *Issue:* Team Blue might just trust the Runner anyway.
      *   *Fix:* Make the "poison" specific to engineering trust. "The Runner used an unapproved library to count." "The Runner's terminal had root access disabled." Make it technical so it lands.
      *   *The "Defector":* Let's make sure the Runner feels the pressure. Give the Runner a note: "Your team is suspicious of you. Convince them." This adds the "burn one of their own" tension.

  8.  **Finalizing the Plan Structure:**

      *   **Title:** The Consensus Audit.
      *   **Materials:** Bolts/Nuts, Jars, Printed "Incident Reports," Whiteboard.
