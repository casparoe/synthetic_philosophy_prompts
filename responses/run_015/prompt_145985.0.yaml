  Yeah, I can definitely reply in American English. This is a sharp setup—you've got a solid grasp of how both philosophers handle the mechanics of change versus the rhetoric of change. Here's how I see the breakdown on your deepfake case.

  ### 1. Williams's Verdict: Tech/Interest Shift, Zero Moral Learning
  Bernard Williams would almost certainly call this **just a tech/interest shift with zero moral learning.**

  Williams is skeptical of the idea that "morality" is a standalone engine that drives history. In *Ethics and the Limits of Philosophy* and *Shame and Necessity*, he argues that ethical life is embedded in a social structure. If the structure breaks, the ethics dissolve, but that doesn't mean we got *better*.

  In your deepfake scenario, the practice of viral shaming stops because the **epistemic conditions** for it vanished. You can't shame someone based on video evidence if video evidence is worthless. For Williams, this isn't a moral revolution; it's a change in the "social world" that makes the practice unintelligible or impossible. It's like stopping hunting because you ran out of animals—not because you decided hunting was wrong. He'd say there's no moral progress here, just a causal shift in what's possible.

  ### 2. Appiah's Verdict: Hidden Honor Dynamics
  Kwame Appiah would likely argue there **are hidden honor dynamics at play.**

  In *The Honor Code*, Appiah insists that rational argument rarely changes behavior; shifts in honor and shame do. Even if there's no explicit moral debate, Appiah would look for the change in self-conception. He'd argue that the honor code shifts from "vigilante justice is honorable" to "being gullible is shameful."

  If people stop shaming because they're afraid of being duped by a deepfake, Appiah would say they are protecting their honor. The embarrassment of accusing an innocent person (because you couldn't verify the tech) becomes a stronger sanction than the shame of letting a wrongdoer go. He'd see this as a moral revolution driven by a reconfiguration of honor, even if the trigger was technical.

  ### 3. Which Rule Predicts Their Split?
  The rule that best predicts their split is the **Hybrid** rule.

  Here's why: The case itself is a hybrid of material constraint (tech) and social psychology (shaming).
  *   **Williams** weights the **material/structural** side of the hybrid. He sees the tech failure as the decisive factor, rendering the honor code irrelevant.
  *   **Appiah** weights the **honor-code** side of the hybrid. He sees the tech failure as merely the catalyst that forces the honor code to shift.

  If you used an "interest-only" rule, you'd miss Appiah's point entirely. If you used an "honor-codes" rule exclusively, you'd miss Williams's structural skepticism. The split emerges because they disagree on which part of the hybrid mechanism is doing the heavy lifting. Williams says the structure dictates the ethics; Appiah says the honor code dictates the behavior regardless of the structure.

  ### 4. The Closer Analog Case
  The analog case that would actually settle this is **the decline of the Pillory in 19th-century England.**

  *   **The Scenario:** Public pillorying (standing in stocks while crowds threw things) stopped working not because Parliament suddenly argued it was immoral, but because the crowds started sympathizing with the criminals. The crowd would cheer the prisoner instead of shaming them.
  *   **Why it settles it:** The mechanism of shame became technically ineffective (similar to deepfakes making evidence untrustworthy).
      *   **Williams** would say this wasn't a moral change; the social technology of shaming broke, so the state stopped using it.
      *   **Appiah** would argue the honor code shifted: it became dishonorable for the state to use a punishment that made them look weak or foolish in front of the crowd.

  Tracking how historians classify the end of the pillory—either as a bureaucratic adjustment (Williams) or a shift in public sentiment/honor (Appiah)—would give you the empirical ground to test your prediction.

