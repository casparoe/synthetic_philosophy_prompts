      *   *Decision:* I will frame this around the concept of **"Policy Feedback"** (specifically the *interpretive* effect) and the economic/sociological concept of **"Endogenous Preferences/Norms."** I will validate that the distinction is real: it is the difference between a policy that *requires* a specific equilibrium and one that *moves* the system toward that equilibrium.

