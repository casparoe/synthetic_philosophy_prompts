answer: |-
  You have identified a real and distinct mechanism. It is not merely the first pattern with a time axis attached; it is a different topological structure of causality.

  The distinction you are looking for is between **Exogenous Trust** (trust as a precondition) and **Endogenous Trust** (trust as an outcome).

  In the literature of political economy and institutional design, the specific concept that captures the "trust-making" pattern is **Policy Feedback** (specifically *interpretive* or *normative* feedback). However, to make the concept as sharp as you requested, it is best understood through the lens of **Coordination Equilibria** and **Hysteresis**.

  Here is the breakdown of what the thing is, what it isn't, and how to test your edge cases.

  ### 1. The Core Distinction: Input vs. Loop

  Your intuition is correct: these are not the same mechanism with different speeds. They are different causal directions.

  *   **Trust-Consuming (Exogenous):** The policy is a **Coordination Game** that requires a pre-existing equilibrium to function.
      *   *Mechanism:* I comply because I expect you to comply. If I expect you to defect, I defect.
      *   *Dynamics:* Stable only if the "trust parameter" is already above a critical threshold. If imported below that threshold, the system collapses into a "bad equilibrium" (everyone cheats).
      *   *Analogy:* A bridge that can hold 10 tons, but only if the foundations are already solid. You cannot use the bridge to build the foundations.

  *   **Trust-Generating (Endogenous):** The policy is a **Learning Mechanism** that shifts the equilibrium over time.
      *   *Mechanism:* The policy changes the *incentives* and *signals* such that compliance becomes the rational choice even with moderate initial trust, and repeated compliance reinforces the expectation of future compliance.
      *   *Dynamics:* Unstable at first (requires a "push"), but becomes self-reinforcing. It moves the system from a bad equilibrium to a good one.
      *   *Analogy:* A trellis. You plant a vine (the policy) that is too weak to stand alone. The trellis holds it up while it grows roots (trust). Eventually, the vine supports itself and the trellis is less visible.

  **The Vocabulary:**
  The sharpest term for the "trust-making" phenomenon is **Endogenous Institution Building**.
  *   *Exogenous:* Institutions require culture to work.
  *   *Endogenous:* Institutions cultivate culture.

  The specific academic debate you are stumbling into is largely defined by the political scientist **Bo Rothstein**. He argues exactly against the "you can't import trust" crowd. His thesis is that **Universalism** is a technology for generating trust, whereas **Means-Testing** is a technology that consumes it.

  ### 2. Why it isn't just "Time"

  If it were just time, a trust-consuming policy would eventually become trust-generating if you waited long enough. It does not.

  A means-tested welfare program in a low-trust society does not "grow" into a high-trust system over 20 years. It calcifies into a system of surveillance, stigma, and resentment. The *design* of the policy determines the direction of the causality.
  *   **Trust-Consuming policies** rely on *monitoring*. Monitoring signals "we expect you to cheat." This signal lowers trust.
  *   **Trust-Generating policies** rely on *universal entitlement*. Universality signals "you are one of us." This signal raises trust.

  The parameter that differs is not time; it is **Signal Valence**. Does the policy signal suspicion or solidarity?

  ### 3. The "Bootstrap" Problem (The Edge)

  You mentioned the policy needs "X at the beginning" to manufacture "X later." This is the critical edge of the concept. In complexity theory, this is called a **Critical Threshold** or **Tipping Point**.

  For a trust-generating policy to work, you do not need *high* trust, but you need *sufficient* trust to survive the startup phase.
  *   If trust is 0%: The policy is looted immediately. Trust goes negative.
  *   If trust is 10%: The policy survives, creates small wins, trust rises to 15%, then 20%. (The Virtuous Circle).
  *   If trust is 80%: The policy works immediately.

  The distinction is real, but it is not magic. A trust-generating policy cannot start from a vacuum. It requires a **Minimum Viable Trust** to ignite the feedback loop. If the "trust-consuming" argument says "you need 80% trust," the "trust-generating" counter-argument is "you only need 15% trust, but the policy will build the rest."

  ### 4. Testing Your Two Cases

  Here is how to apply this sharp definition to your two test cases.

  **Case 1: Builds trust for recipients, destroys it for payers.**
  *   **Verdict:** This is **not** a trust-generating policy. It is a **Distributional Conflict** wearing trust clothes.
  *   **Why:** For a policy to be truly "Endogenous Trust Building," it must increase *generalized* trust (trust in the system/strangers), not just *particularized* trust (trust within a specific group).
  *   **The Mechanism:** If the policy draws a line between "us" (recipients) and "them" (payers), it is functionally identical to a means-tested program. It creates two different coordination games. One group learns to trust the state; the other learns to resent it. Net social trust likely declines.
  *   **Sharp Edge:** A trust-generating policy must be **non-rivalrous in perception**. Everyone must feel they are in the same pool, even if the net cash flow differs. (This is why Rothstein argues for *universal* services rather than *targeted* transfers).

  **Case 2: Generates trust, but slower than electoral cycles.**
  *   **Verdict:** This is a **Political Time Horizon** problem, not a Trust Mechanism problem.
  *   **Why:** The mechanism of trust generation is real, but the *vehicle* for implementing it (democracy) has a mismatched discount rate.
  *   **The Concept:** This is **Hysteresis**. Hysteresis describes a system where the state depends on its history, and reversing the path requires more energy than moving forward.
      *   It takes 20 years to build the trust (high energy input).
      *   It takes 2 years to dismantle it (low energy input).
  *   **Does it count?** Yes, it is still a trust-generating policy. The fact that politicians cannot afford to plant trees whose shade they won't sit in does not change the biology of the tree. However, in policy analysis, this is often categorized as **Politically Infeasible** despite being **Technically Sound**.
  *   **Sharp Edge:** If the policy is reversed before the "tipping point" is reached, the trust generated decays rapidly. This confirms it was a "trust-generating" attempt that failed due to external constraints, not an internal flaw in the mechanism.

  ### Summary of Concepts

  If you need to label these to make the argument sharp:

  1.  **The "Trust-Consuming" Objection:** Relies on **Exogenous Social Capital**. It views trust as a finite stock that must exist *before* institutional deployment.
  2.  **The "Trust-Making" Counter:** Relies on **Endogenous Norm Formation** via **Policy Feedback**. It views trust as a flow that can be manufactured by **Universalist Institutions**.
  3.  **The Constraint:** The **Critical Threshold**. You need enough initial trust to survive the "valley of death" before the feedback loop kicks in.
  4.  **The Failure Mode:** If the policy creates distinct classes of payers and receivers, it is **Particularized Trust**, not Generalized Trust. It will fail to generate the broad social cohesion required for the Nordic model.

  **The Word:**
  If you want one phrase to capture the "trust-making" pattern, use **"Constitutive Institutions."**
  *   *Reflective Institutions* mirror the trust that already exists (Trust-Consuming).
  *   *Constitutive Institutions* create the norms they rely on (Trust-Generating).

  The argument you are hearing is a claim that all institutions are *Reflective*. Your observation is that some are *Constitutive*, provided they survive the initial implementation phase.
