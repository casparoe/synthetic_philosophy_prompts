      5.2 **Calculation Example:** A projected loss of $1,000,000 per capita occurring 200 years hence equates to a present liability of approximately $152.04. Assessors are reminded that distant future harms carry negligible weight in current cost-benefit analyses due to the compounding effect of economic growth and investment returns.

      5.3 For periods exceeding 300 years, the discounted value rounds to zero for all administrative purposes.

