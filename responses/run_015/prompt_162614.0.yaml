      *   *The Non-Identity Problem:* If a policy choice affects who comes into existence (by changing social/economic conditions, timing of conception, etc.), then the people who exist under the "bad" policy are different from those who would have existed under the "good" policy. Since the "bad" policy people wouldn't exist at all without it, they aren't worse off than they would have been (because the alternative is non-existence). Therefore, the policy doesn't harm them.
      *   *The Satire:* Bureaucracy loves rules. If the rule says "harm requires making a specific person worse off than they would otherwise be," and metaphysics says "different policies create different people," then the bureaucracy must conclude that long-term harmful policies cause zero harm.
