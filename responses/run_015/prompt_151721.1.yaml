      *   **Global Workspace Theory (GWT):** Associated with Baars, Dehaene, etc. Core idea: Consciousness *is* global broadcasting/access. GWT is typically an *access* theory. Many GWT proponents argue against Block's distinction (reducing P-consciousness to A-consciousness or denying P-consciousness as separate).
