answer: |-
  "Six people looked at the diagonal bar and thought it meant 'take this medicine,'" Dev said, tapping the proof on the table. "Not 'stop.' Take. Because it highlights the pill."

  Ines didn't look up from her sketchbook. "Because they hadn't seen the key. You can't expect fluency on first exposure."

  "We don't have a curriculum, Ines. We have a pharmacy counter. A mom is holding a screaming kid and a phone. She has forty seconds. She isn't learning a vocabulary; she's trying not to kill her child."

  "That is exactly why the syntax must be consistent," Ines said. "Three frames for the timeline. Frame one: rash. Frame two: clock. Frame three: decision. If the rash crosses the line in frame two, frame three is empty. That is the Vienna Method. It removes language barriers."

  "It creates a new language barrier," Dev countered. "You've built a writing system. You have conditionals, negation, time windows, base rates. That is grammar. And writing systems have to be taught. You've reinvented literacy with worse tooling and no dictionary."

  Ines finally looked up. "Neurath never claimed it was a standalone substitute. It is a helping language. It pays off when an institution maintains the vocabulary over years. Repeated exposure."

  "We are not that institution. We are a county department shipping a one-off card." Dev leaned in. "And your read-back rule? 'Ship only if the viewer reads the instruction back.' That doesn't measure understanding. It measures whether they can guess your convention. Confident wrong guesses are the failure mode that actually hurts. They walk away thinking they know what the dots mean."

  "The dots convey magnitude better than text," Ines said. "Four hundred units. One filled. That is the risk."

  "Legal requires the exact risk number in words somewhere on the card," Dev said. "'One in four hundred.' If you print that, your dots become decoration. If you don't, we get sued."

  "Then the text will do more damage than the pictures do good," Ines said. "It creates conflict. The eye goes to the words, ignores the grid. The visual rhythm breaks."

  "The visual rhythm is irrelevant if they take the second dose while pregnant," Dev said. "Look. Keep your three-frame strip for the rash. People understand comics. But kill the dotted field. Use the text for the risk. And kill the diagonal bar. Use red text for contraindications."

  "Ines sighed. "If I use text for the risk, I need to scale the units down. It becomes noise."

  "Better noise than a secret code." Dev picked up a pen. "You get the timeline strip. You get the fever icon. But the contraindications—the pregnancy, the blood pressure drug—that is bold text. No pictograms. You can't iconograph 'do not take if on Lisinopril' without a dictionary."

  "And the 48-hour window?"

  "Three frames. But label them. 'Now.' '48 Hours.' 'Decision.'"

  Ines rubbed her temple. "Labeling the frames admits the pictures aren't carrying the relation."

  "The pictures carry the attention," Dev said. "The words carry the truth. That's the only way this ships by Friday."

  Ines capped her pen. "Fine. But the fever icon stays. And the rash line is red."

  "Agreed."

  ***

  **The Shipped Card:**
  A single-sided 4x6 gloss card. The top half features a three-panel comic strip: a stylized arm with a red boundary line, a clock face showing 48 hours, and a checkmark versus an X. The bottom half is text-heavy. The risk statistic reads "1 in 400 people" in bold sans-serif, with a small grid of dots beneath it reduced to a decorative texture. Contraindications (pregnancy, specific BP meds) are listed in bullet points with no icons.

  **The Lingering Doubts:**
  Ines believes the decorative dot grid misleads the eye into thinking it carries data, violating the integrity of the visual language. Dev believes the three-panel strip will still be read as a sequence of required actions rather than a conditional warning, and that the text density will cause the "low literacy" audience to disengage entirely.
