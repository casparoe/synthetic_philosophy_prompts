answer: |-
  Here are the seven objections you are most likely to face, ordered by the flow of a typical seminar Q&A (from conceptual framing to technical implementation to moral limits), along with tailored replies and strategic advice.

  ### 1. The *Modus Vivendi* Charge
  **Who:** The Public Reason/Legitimacy cluster (the majority).
  **Objection:** "You claim this isn't *modus vivendi*, but your mechanism looks identical. If the only reason I accept your proposal is that I get something I urgently want, and not because I recognize the *rightness* of your claim, isn't this just a truce based on contingent interests? If my urgency rankings change, or if I gain the power to impose my will, the incentive to comply vanishes. How is this distinct from a unstable *modus vivendi*?"

  **Reply (2 mins):** "The distinction lies in the *reasons for compliance*, not just the stability of the outcome. In a classic *modus vivendi*, I comply because I fear your power or because it is currently expedient. In my model, I comply because I recognize your *moral urgency* as a valid claim on my cooperation, even if I reject your underlying value system. I am not yielding to force; I am yielding to the gravity of your stake. This generates a duty of fidelity to the agreement that survives shifts in the balance of power. It is a principled accommodation of pluralism, not a pragmatic surrender to it."

  **Soft Spot:** If "moral urgency" is purely subjective and unverifiable, it collapses back into interest-based bargaining.
  **Concession Strategy:** Do not concede this up front. It is the core of your paper. However, be prepared to admit that without a culture of truth-telling about urgency, it *degenerates* into *modus vivendi*.

  ### 2. The "Bargain" Hostility
  **Who:** The Ethics of Compromise scholars.
  **Objection:** "You use the language of 'gains from trade' and 'surplus.' This models political compromise as a market transaction. But genuine political compromise involves mutual moral adjustment, not logrolling. By framing this as efficiency-maximizing, you strip compromise of its normative force. Why should I view this as *moral* compromise rather than mere deal-making?"

  **Reply (2 mins):** "I use economic language heuristically to map the *structure* of the agreement, not to reduce the *content* of the values. When I say 'gain,' I mean the avoidance of a moral loss that each side finds more painful than the concession they make. The 'surplus' is the preservation of core moral commitments that would otherwise be crushed in a zero-sum conflict. Recognizing the structural benefits of incommensurability doesn't deny the moral weight; it explains how that weight can be balanced without requiring one side to convert to the other's currency."

  **Soft Spot:** The vocabulary *does* invite reductionism. It signals instrumentalism.
  **Concession Strategy:** **Defuse this in your opening.** In your first two minutes, explicitly state: "When I speak of 'gains from trade,' I do not mean market utility, but the mutual preservation of moral integrity."

  ### 3. The Preference Revelation Problem
  **Who:** The two Social-Choice Theorists.
  **Objection:** "Your mechanism relies on inverse ordering of moral urgency. But urgency is private information. I have every incentive to inflate my urgency on Issue A to get you to concede, while downplaying it on Issue B. Without a common currency to verify stakes, this mechanism is not incentive-compatible. It invites strategic misrepresentation, which destroys the efficiency gains you promise."

  **Reply (2 mins):** "That is a valid implementation challenge, but it doesn't refute the theoretical possibility of the gain. In ideal theory, we assume agents can communicate stakes sincerely. In non-ideal theory, this argues for institutional designs that penalize bad-faith claims of urgency—perhaps through repeated interaction or reputation mechanisms. The existence of a potential gain from trade is a necessary condition for compromise; solving the revelation problem is the subsequent institutional design challenge. My claim is that the *space* for agreement is larger than we think, not that getting there is costless."

  **Soft Spot:** If the revelation problem is unsolvable, the "larger gains" are theoretical fictions.
  **Concession Strategy:** Concede that this is the primary *practical* hurdle, but maintain it doesn't invalidate the *structural* claim.

  ### 4. The Integrity/Corruption Objection
  **Who:** The Integrity/Dirty Hands scholar.
  **Objection:** "You suggest I can trade a provision I value less for one I value more. But if the values are incommensurable, doesn't the act of trading itself corrupt the higher value? By putting my sacred principle on a scale against your secular interest, haven't I already violated my integrity, regardless of the outcome? There is a 'moral remainder' here that your model ignores."

  **Reply (2 mins):** "I acknowledge the moral remainder. Compromise often leaves a residue of regret. However, integrity is not absolutism. Integrity also requires responsible stewardship of the values I *can* protect. If refusing to trade results in the total loss of both provisions, my rigid adherence to 'non-tradability' might actually betray the values I claim to protect. The 'corruption' is the cost of political coexistence, not a reason to abandon the search for mutually preferable settlements."

  **Soft Spot:** Some values (e.g., fundamental rights) arguably *cannot* be traded without corruption.
  **Concession Strategy:** Concede that there is a "constraint set" of non-tradable rights, but argue your model applies to the vast zone of policy *outside* that core.

  ### 5. The "Splitting the Difference" Assumption
  **Who:** The Social-Choice Theorists (or a sharp generalist).
  **Objection:** "You claim that with a common currency, compromise degenerates into splitting the difference on a short segment. But if we share a common currency (say, welfare), we can often find complex optimizations, not just midpoints. Why assume commensurability leads to smaller surpluses? Couldn't a shared metric allow us to maximize the sum more efficiently than incommensurable logrolling?"

  **Reply (2 mins):** "When we share a currency, disagreement is usually about the *quantity* of that currency to allocate. If you want 10 units and I want 0, the surplus is the area between our marginal valuations, which shrinks as we approach the midpoint. When values are incommensurable, disagreement is about the *kind* of good being produced. I care about Liberty, you care about Security. We aren't fighting over slices of the same pie; we are baking two different pies in the same oven. The 'gain' comes from realizing we can bake more of both if we stop fighting over the oven temperature and assign time slots based on urgency."

  **Soft Spot:** This relies on the assumption that incommensurable values don't compete for the same finite resources in a zero-sum way.
  **Concession Strategy:** Concede that resource constraints can force incommensurable values into competition, limiting the gain.

  ### 6. The Publicity Condition
  **Who:** Public Reason liberals.
  **Objection:** "Legitimate law must be justifiable to all citizens. But your 'off-diagonal' settlements are based on private urgency rankings that the other side doesn't share. How can I justify this law to my constituents? I can't tell them, 'We traded your right for their security because their urgency was higher.' That fails the publicity condition of liberal legitimacy."

  **Reply (2 mins):** "The justification doesn't need to cite the *urgency rankings* specifically; it cites the *fact of agreement* between reasonable representatives. Public reason requires that we seek terms others can accept, not that we all share the same reasons for accepting them. An overlapping consensus works similarly: I support the policy for Reason A, you for Reason B. The 'trade' is the institutional embodiment of that overlap. As long as the outcome respects public constraints, the private calculus of urgency need not be fully publicized."

  **Soft Spot:** If the trade looks like a "sell-out" to the public, legitimacy collapses.
  **Concession Strategy:** Concede that some trades are politically infeasible even if theoretically optimal.

  ### 7. The Scope Limit (The "Rights" Objection)
  **Who:** Anyone (likely the closing question).
  **Objection:** "Does this apply to *all* incommensurable values? If I value Religious Purity and you value Gender Equality, and our urgencies are inverse, do you really think there is a 'gain from trade' settlement we should make? Some incommensurabilities seem to demand victory, not compromise."

  **Reply (2 mins):** "No, there are constraints. My model applies to *political* compromise within a framework that already agrees on the rules of the game. If one side's value system denies the standing of the other to negotiate, there is no basis for trade. But within a liberal democracy, even deep conflicts (like religion vs. equality) usually involve specific policy provisions where urgency varies. We may not trade on the *principle*, but we can trade on the *application*. The model identifies where compromise is possible, not where it is mandatory regardless of content."

  **Soft Spot:** Defining the "rules of the game" often presupposes the very value hierarchy in dispute.
  **Concession Strategy:** Concede that the model presupposes a baseline commitment to peaceful coexistence.

  ***

  ### Strategic Summary

  **The Opening Defusal:**
  You must address **Objection #2 (The "Bargain" Hostility)** in your opening remarks.
  *Why:* The room is "hostile to [compromise] being modeled as a bargain." If you let them sit through the paper hearing "gains from trade" without qualification, they will spend the Q&A trying to prove you are a crude economist rather than a political theorist.
  *How:* Add a footnote-style verbal caveat in your introduction: "I use the language of 'trade' and 'surplus' structurally, to describe the outcome space, not to reduce moral values to market commodities."

  **The Question You Hope Nobody Asks:**
  *"If your model works best when values are incommensurable, are you inadvertently arguing that we should cultivate deeper moral disagreement to maximize political efficiency?"*
  *Why it's dangerous:* It turns your descriptive claim (incommensurability *allows* gains) into a normative prescription (we *want* incommensurability). It makes you sound like you are advocating for polarization to facilitate logrolling.
  *Preparation:* Be ready to say: "No. I am arguing that given the *fact* of deep disagreement, incommensurability is less of an obstacle than we think. I am not suggesting we create the disagreement."
