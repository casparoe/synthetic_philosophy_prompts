prompt: |-
  I'm giving a paper at a political theory seminar next week, and I want to be prepared for the question period rather than for the comments I'd get online.

  My thesis is that compromise between holders of deeply different value systems can produce genuine gains from trade, and — the part I expect trouble over — that these gains are typically larger, not smaller, when the two value systems are incommensurable rather than merely different weightings of a common currency. Where a common currency exists, compromise degenerates into splitting a difference: every feasible settlement lies on a short segment between the two positions, and the surplus to be divided is small. Where there is no common currency, each side can still rank the contested provisions by what I call moral urgency — how much is at stake, for that side, in having its way on this item — and I argue that whenever the two urgency orderings are inversely ordered on some pair of provisions (one side's stake in A exceeds its stake in B, the other's is the reverse), there exists a settlement that each side prefers, by its own lights, to any point on the line between its own position and the other's. Often this is an off-diagonal arrangement that neither side would have proposed on its own and that neither value system can represent as a mixture of the two original positions. Incommensurability, on this picture, is not an obstacle to gains from trade but the mechanism that creates them.

  The room is about twenty people: mostly analytic political philosophers working on public reason, legitimacy, and the ethics of compromise; two social-choice theorists; and one person who writes on integrity and dirty hands. They are receptive to the claim that compromise can be morally required and hostile to its being modeled as a bargain. Nobody there is a friend of modus vivendi.

  Give me the objections I will actually get from this room, roughly in the order they will come and phrased in the vocabulary of whichever subgroup is raising them — six or seven, not an exhaustive list. For each, give me a reply I can deliver in about two minutes, a note on where that reply is soft, and a judgment about whether I should concede the point up front instead. Flag the single objection I should try to defuse in the opening two minutes of the talk, and end with the question I am hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A political theorist giving a paper at a seminar.
      *   **Topic:** Compromise between incommensurable value systems produces *larger* gains from trade than commensurable ones. Mechanism: "Moral Urgency" rankings allowing for logrolling/trades where urgency orderings are inversely ordered.
      *   **Audience:** ~20 people. Mostly analytic political philosophers (public reason, legitimacy, ethics of compromise). Two social-choice theorists. One integrity/dirty hands scholar.
      *   **Audience Stance:** Receptive to compromise as morally required. Hostile to modeling compromise as a *bargain*. Anti-modus vivendi.
      *   **Goal:** Prepare for the Q&A (not online comments). Needs 6-7 specific objections, 2-minute replies, weakness analysis, concession strategy, one opening defusal, and one "dreaded question."

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* Incommensurability $\rightarrow$ Larger Gains from Trade.
      *   *Mechanism:* Moral Urgency rankings + Inverse Ordering $\rightarrow$ Off-diagonal settlements (logrolling).
      *   *Contrast:* Commensurability $\rightarrow$ Splitting the difference (small surplus).
      *   *Implicit Commitment:* Compromise is instrumental/rational (bargain-like), not necessarily principled.

  3.  **Identify Potential Objections based on Audience Profiles:**

      *   *Analytic Political Philosophers (Public Reason/Legitimacy):* They hate "bargaining" models. They worry about legitimacy, stability, and moral integrity. They dislike *modus vivendi*.
          *   *Objection 1:* Legitimacy/Stability. Is this just a truce? What happens when power shifts?
          *   *Objection 2:* Integrity/Principle. Can you trade off fundamental values without corruption?
          *   *Objection 3:* Public Reason. Can these "urgency" rankings be publicized? If not, is the compromise legitimate?

      *   *Social-Choice Theorists (2 people):* They care about formal coherence, preference aggregation, and manipulation.
          *   *Objection 4:* Preference Revelation/Strategy. How do you know the urgency rankings are true? Incentive to lie.
          *   *Objection 5:* Cyclical Majorities/Instability. If values are incommensurable, how do you ensure transitivity or stability of the outcome?

      *   *Integrity/Dirty Hands Scholar (1 person):*
          *   *Objection 6:* Moral Residue. Even if it works, does it leave a moral stain? Is "gain" the right metric?

  4.  **Drafting the Objections and Replies (Iterative Process):**

      *   *Objection 1 (The Public Reason/Legitimacy Crowd):* "This looks like *modus vivendi*."
          *   *Reply:* Distinguish based on *reasons*. MV is power-based; this is reason-based (urgency).
          *   *Weakness:* If urgency is private, it looks like power.
          *   *Concession:* Maybe concede it shares features but differs in justification.

      *   *Objection 2 (The Bargain Hostility):* "Compromise isn't a market transaction."
          *   *Reply:* It's not market; it's mutual recognition of stakes.
          *   *Weakness:* "Gains from trade" language invites market analogy.
          *   *Concession:* Don't concede the core, but clarify terminology.

      *   *Objection 3 (Social Choice):* "Information Asymmetry/Strategy."
          *   *Reply:* Ideal theory assumption or institutional design for truth-telling.
          *   *Weakness:* Real world is non-ideal.
          *   *Concession:* Acknowledge implementation hurdle.

      *   *Objection 4 (Integrity):* "Corruption of Value."
          *   *Reply:* Integrity allows for prioritization, not just absolutism.
          *   *Weakness:* Some values *are* absolute (e.g., torture).
          *   *Concession:* Limit scope to non-absolute values.

      *   *Objection 5 (Commensurability Critique):* "You assume commensurability implies splitting the difference."
          *   *Reply:* If we share a metric, we argue about the *amount*. If not, we argue about *domains*.
          *   *Weakness:* Sometimes shared metrics allow complex optimization, not just splitting.
          *   *Concession:* Nuance the "splitting the difference" claim.

      *   *Objection 6 (Stability):* "Why stick to the deal?"
          *   *Reply:* Because it's Pareto superior to the status quo *for them*.
          *   *Weakness:* Dynamic preferences change.
          *   *Concession:* Needs institutional reinforcement.

      *   *Objection 7 (The "One Person"):* "Moral Remainder."
          *   *Reply:* Acknowledge the cost, but deny it outweighs the benefit.
          *   *Weakness:* Hard to quantify moral cost.

  5.  **Selecting and Refining the Top 6-7:**

      1.  *The Modus Vivendi Charge* (Public Reason). Crucial because the prompt says they are hostile to MV.
      2.  *The "Bargain" Objection* (General Analytic). They hate modeling compromise as bargain.
      3.  *Preference Revelation* (Social Choice). Technical but fatal if unanswered.
