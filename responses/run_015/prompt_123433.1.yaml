answer: |-
  Here are the desiderata for an adequate account of history's large-scale shape, structured to distinguish logical coherence from empirical adequacy, and to isolate the specific tensions between cyclical and directional claims.

  ### I. The Desiderata

  **1. Variable Specificity and Ontological Commitment**
  *   **Requirement:** The theory must specify the *substrate* that is shaping (e.g., political constitutions, energy capture, collective consciousness, demographic pressure). It cannot claim "History cycles" without stating *what* cycles.
  *   **Case:** Ambiguity allows theories to retreat to metaphor when faced with counter-evidence. A claim about "civilizations" is distinct from a claim about "modes of production."
  *   **Status:** **Non-Negotiable (NN).** Without this, the claim is poetic, not theoretical.
  *   **Tension Flag:** High. Many traditional accounts (Spengler) rely on vague morphological holisms that resist variable isolation.

  **2. The Ratchet Decoupling Condition**
  *   **Requirement:** If the theory posits recurrence in Variable A (e.g., regime type), it must account for the behavior of Variable B (e.g., technology/knowledge) if B is ratcheting. It must demonstrate either: (a) A is independent of B, or (b) A cycles *within* the constraints of B's accumulation, or (c) B does not actually ratchet.
  *   **Case:** Five centuries of cumulative science constitute a monotonic function. If history is a cycle, the cycle cannot be defined by variables that monotonically increase. A cycle claim on a ratcheting variable is logically incoherent (a function cannot be periodic and monotonic simultaneously).
  *   **Status:** **NN for logical coherence.**
  *   **Tension Flag:** **Critical.** This is the primary friction point between cyclical traditions and the modern empirical record.

  **3. Unit Specification and Coupling Logic**
  *   **Requirement:** The theory must define the *unit* of history (Polity, Civilization, Species, Biosphere) and provide a rule for how multiple units interact. If Unit X cycles and Unit Y cycles out of phase, what is the shape of the aggregate system?
  *   **Case:** A "cycle" in China may coincide with "growth" in Europe. An aggregate view (World-System) might show linear growth emerging from cyclic local parts. A theory must explain why its chosen unit is the one that bears the shape.
  *   **Status:** **NN.**
  *   **Tension Flag:** Moderate. Aggregation problems often dissolve specific cyclic claims into noise.

  **4. Phase Identity and Independent Criteria**
  *   **Requirement:** The criteria for identifying a phase (e.g., "Decline," "Spring," "Feudalism") must be independent of the timeline they are meant to explain. We must be able to identify "Phase X" without already knowing "this is the late period."
  *   **Case:** Prevents circular reasoning (tautology). If "late stage" is defined by "social decay," and "social decay" is identified because "we are in the late stage," the theory is empty.
  *   **Status:** **NN.**
  *   **Tension Flag:** High. Most morphological theories fail this, relying on retrospective fitting.

  **5. Projectivity (The Forward Test)**
  *   **Requirement:** The criteria for Phase Identity must be applicable to the present to generate a falsifiable claim about the near future, not just the past.
  *   **Case:** Distinguishes a predictive theory from a hermeneutic (interpretive) one. If the theory only works retrospectively, it is a taxonomy, not a dynamics.
  *   **Status:** **Camp Preference (Directionalists/Positivists).** Cyclicalists often argue history is intelligible only backwards (Owl of Minerva).
  *   **Tension Flag:** **Critical.** This is where "No Large-Scale Shape" becomes the strongest competitor.

  **6. Reflexive Self-Location**
  *   **Requirement:** The theory must explain the conditions of its own emergence. If the theory claims we are in a "Late Age of Iron," it must explain why *this specific theory* is the characteristic thought of the Late Age, rather than an objective truth transcending the age.
  *   **Case:** Avoids the "View from Nowhere." A theory of history is itself a historical event.
  *   **Status:** **Camp Preference (Hegelians/Marxists/Strong Cyclicalists).**
  *   **Tension Flag:** **Fatal Tension.** (See Section IV below).

  ---

  ### II. Handling the Three Explicit Considerations

  **1. The Ratchet Asymmetry**
  *   **The Question:** Is a cycle claim about a ratcheting variable coherent?
  *   **The Verdict:** No. A strict cycle implies a return to a prior state ($S_t = S_{t-n}$). A ratchet implies irreversible accumulation ($S_t > S_{t-n}$).
  *   **The Desideratum Application:** An honest recurrence view *must* restrict itself to non-ratcheting variables (e.g., elite cohesion, legitimacy, artistic vitality) or argue that the ratchet is illusory (e.g., knowledge is lost in dark ages).
  *   **The Trap:** If a cyclical theory admits the tech ratchet but claims politics cycle *despite* it, it owes a mechanism for how high-energy societies sustain low-energy political forms without collapse. If it cannot provide this, the "cycle" is merely a fluctuation superimposed on a trend, which is not a cycle of *history*, but a cycle of *parameters within* a directional history.

  **2. Units and Their Interactions**
  *   **The Question:** Whose history has the shape?
  *   **The Desideratum Application:** The theory must specify the "Container."
      *   *Polity:* Cycles are frequent (dynasties), but aggregate history looks linear (tech transfer between polities).
      *   *Civilization:* Cycles are morphological (Spengler), but boundaries are porous and definitional.
      *   *Species:* Cycles are implausible due to global coupling; direction is more likely (complexity/energy).
  *   **The Coupling Problem:** If Theory T says "Civilizations Cycle," but Trade couples them such that a crash in one triggers growth in another, the *System* does not cycle. The theory must decide if it explains the *parts* or the *whole*. Most fail by claiming to explain the whole while analyzing parts.

  **3. Phase Identity and Projectivity**
  *   **The Question:** What makes two periods instances of the same phase?
  *   **The Desideratum Application:**
      *   *Token vs. Type:* A recurrence theory claims *Type-Recurrence* (similar structural relations), not *Token-Return* (Caesar literally returns). It must define the structural invariants.
      *   *Retrospective vs. Projective:* If the criteria for "Imperial Overstretch" can only be confirmed after the collapse, the theory is not useful for locating the present. To count as adequate, the theory must allow us to say "We are in Phase 3" *before* Phase 4 arrives.
      *   *The Failure Mode:* Most cyclical theories are projectively impotent. They identify the "end" only when the end has happened.

  ---

  ### III. The Self-Location Demand

  **Must the theory locate us?**
  *   **The Demand:** A theory of history's shape should explain why the theorist is standing *here*, proposing *this*, *now*. (e.g., Marx: "I am a bourgeois thinker seeing the contradiction of capitalism"; Spengler: "I am a Faustian soul seeing the winter of the West").
  *   **The Reductio Risk:** If the theory explains its own emergence as a symptom of a specific phase (e.g., "Cyclical theories only arise in Decadent phases"), it undermines its own truth claim. It becomes a symptom, not a diagnosis. If it claims to be an exception (a "view from outside time"), it violates naturalism.
  *   **Verdict:** This is a **Camp Preference** that functions as a **Trap**.
      *   *Directionalists* (Hegel, Marx) embrace it: The theory is the culmination of the process.
      *   *Cyclicalists* (Nietzsche, Spengler) often embrace it: The theory is the last lucid act of a dying culture.
      *   *Scientific/Analytic Historians* reject it: It conflates the context of discovery with the validity of the claim.
  *   **Requirement:** An adequate theory must either (A) successfully naturalize its own emergence without self-undermining relativism, or (B) explicitly renounce self-location as outside its scope. Doing neither is fatal.

  ---

  ### IV. The Impossible Triangle (Joint Unsatisfiability)

  I suspect the following three requirements cannot be jointly satisfied by any single existing tradition:

  1.  **Empirical Adequacy regarding the Ratchet:** Acknowledging 500 years of cumulative science/tech as a monotonic, non-reversible trend.
  2.  **Strong Recurrence:** Claiming that large-scale social/political forms return to identical or near-identical states (not just fluctuations).
  3.  **Reflexive Self-Location:** Explaining the theory's own emergence as a stage-relative symptom without claiming a "God's eye view."

  **The Tension:**
  *   If you accept the **Ratchet**, you must accept Directionality (violating Strong Recurrence).
  *   If you keep **Strong Recurrence**, you must treat the Ratchet as superficial or illusory (violating Empirical Adequacy).
  *   If you add **Reflexive Self-Location**, you risk admitting your theory is just another symptom of the cycle/direction, rendering its truth-value relative to the phase (violating Objective Validity).

  *Most successful theories drop one leg.* Big History drops Recurrence. Traditional Cyclicalists drop the Ratchet (or ignore it). Analytic Historians drop Self-Location.

  ---

  ### V. Scorecard and Exclusions

  **Which single requirement excludes the most candidates?**
  *   **Requirement 5 (Projectivity).** The vast majority of historical shape theories (Spengler, Toynbee, Ibn Khaldun) are fundamentally retrospective. They organize the past beautifully but offer no independent criteria for locating the present that could be falsified tomorrow. They function as literature, not dynamics.

  **Which demands are really tribal prejudice?**
  *   **Requirement 6 (Reflexive Self-Location).** This is a Hegelian/Marxist prejudice. A scientific theory of gravity does not need to explain why Newton was an Englishman in the 17th century to be true. Demanding history theories explain their own sociological emergence is a demand for *ideological* coherence, not necessarily *structural* truth.

  **One-Line Scorecard:**

  *   **Polybius (Anacyclosis):** Fails Ratchet (ignores tech); Succeeds Unit (Polity); Fails Projectivity (works only post-collapse).
  *   **Ibn Khaldun (Asabiyyah):** Fails Ratchet (assumes knowledge loss); Succeeds Unit (Dynasty/State); Fails Projectivity (identifies decline only at collapse).
  *   **Spengler (Morphology):** Fails Ratchet (treats tech as cultural expression); Fails Unit (Civilization boundaries vague); Fails Projectivity (Winter is identified by feeling, not metric).
  *   **Toynbee (Challenge/Response):** Fails Ratchet (spiritual growth ≠ tech growth); Succeeds Unit (Civilization); Fails Projectivity (Response is identifiable only in hindsight).
  *   **Cumulative/Big History (Wright, Christian):** Satisfies Ratchet; Satisfies Unit (Species/Energy); Fails Self-Location (claims view from nowhere); Fails Recurrence (by definition).
  *   **"No Large-Scale Shape" (Null Hypothesis):** Satisfies Ratchet; Satisfies Unit (None); Satisfies Projectivity (predicts noise); Fails Human Desire for Meaning.

  **Final Deliverable Note:**
  To count as adequate, a theory must explicitly choose which corner of the Impossible Triangle to sacrifice. A theory that claims to satisfy all three is likely engaging in equivocation. The "Ratchet Asymmetry" is the hardest constraint: any cyclical theory that does not explicitly subordinate political recurrence to technological direction is empirically falsified by the last five centuries.
