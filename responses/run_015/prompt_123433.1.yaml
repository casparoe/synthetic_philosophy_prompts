      *   **Specific Requirements:**
          *   Give the case/consideration behind each requirement.
          *   Mark as Non-Negotiable (NN) or Camp Preference (CP).
          *   Flag subsets suspected to be jointly unsatisfiable (tensions).
          *   Handle explicitly:
              1.  *The Ratchet Asymmetry:* Coherence of cycles with ratcheting variables vs. non-ratcheting ones.
              2.  *Units and Interactions:* Scale (polity, civ, species) and coupling/aggregate patterns.
              3.  *Phase Identity and Projectivity:* Criteria for "same phase" and forward application (prediction) vs. retrospective.
          *   Address Self-Location: Must the theory locate the present/explain its own emergence? Or is that a *reductio*?
          *   Distinctions: Don't collapse type-recurrence with token-return, or oscillation with accumulation. Treat "no shape" as a live candidate.
          *   Scorecard: Identify which requirement excludes the most candidates and which are tribal prejudice. Provide a one-line scorecard for major traditions (Polybius/Ibn Khaldun/Spengler/Toynbee vs. Cumulative/Big History).
      *   **Tone:** Philosophical, rigorous, analytical, avoiding collapse of distinct concepts.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Variable Specificity.* A theory can't just say "history cycles." It must say *what* cycles. This connects to the Ratchet Asymmetry.
          *   *Case:* Ambiguity allows unfalsifiability.
          *   *Status:* NN.
      *   *Requirement 2: The Ratchet Constraint.* If tech ratchets, can politics cycle? How do they interact?
          *   *Case:* 500 years of tech progress seems to contradict pure recurrence.
          *   *Status:* NN for coherence, but *how* it's handled is CP.
      *   *Requirement 3: Unit Specification & Coupling.* Who is cycling? Rome? The West? Humanity?
          *   *Case:* Aggregation problems (individual cycles might look linear in sum).
          *   *Status:* NN.
      *   *Requirement 4: Phase Identity (Projectivity).* How do we know we are in "Phase B"? Can we predict Phase C?
          *   *Case:* Retrospective fitting is easy; prediction is hard.
          *   *Status:* NN for scientific claim, CP for hermeneutic claim.
      *   *Requirement 5: Self-Location (Reflexivity).* Must the theory explain why *this* theory arises *now*?
          *   *Case:* Hegel/Marx do this. Popper critiques it as historicism.
          *   *Status:* CP (High tension here).
      *   *Requirement 6: Falsifiability via "No Shape".* The null hypothesis must be definable.
          *   *Case:* Random walk vs. structured path.
          *   *Status:* NN.

  3.  **Addressing the Explicit Three Things:**

      *   *Ratchet Asymmetry:* Needs a dedicated desideratum. A cycle theory must account for the substrate (tech) growing while the superstructure (politics) cycles. If it denies the ratchet, it fails empirical adequacy.
      *   *Units:* Needs a desideratum on "Scale Consistency."
      *   *Phase Identity:* Needs a desideratum on "Independent Criteria."

  4.  **Addressing Self-Location:**

      *   This is the trickiest part. If a theory says "we are in the decline," does it need to explain why *that* thought is a symptom of decline? If yes, it risks self-undermining (Nietzschean problem). If no, it claims a "view from nowhere."
      *   *Decision:* Mark this as the primary tension point (Joint Unsatisfiability).

  5.  **Refining the Tensions (The "Impossible Triangle"):**

      *   I suspect you cannot have: 1) Strict Empirical Falsifiability (Projectivity), 2) Comprehensive Self-Location (Reflexivity), and 3) Robust Cyclical Claims in a Ratcheting Environment simultaneously without contradiction.
      *   Specifically: If tech ratchets (NN empirical fact), pure cycles are impossible. If cycles are only in non-ratcheting variables, the "shape of history" becomes fragmented. If the theory explains its own emergence, it risks relativizing its own truth claim.

  6.  **Developing the Scorecard & Exclusions:**

      *   *Most Excluding Requirement:* Projectivity (Prediction). Most cycle theories work best backwards.
      *   *Tribal Prejudice:* Self-Location. Directionalists demand it (Hegel); Cyclicalists often avoid it (it implies a unique "now").
      *   *One-liners:*
