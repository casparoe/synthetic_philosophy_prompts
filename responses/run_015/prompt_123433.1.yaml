      *(Refining the Ratchet)*: The prompt asks: "Is a cycle claim about a ratcheting variable coherent at all?" I need to answer this in the desiderata. The desideratum should demand the theory *resolve* this, not necessarily ban it. But logically, a strict cycle on a ratcheting variable is incoherent. I will formulate the requirement to demand *decoupling* or *subordination*.

      *(Refining Phase Identity)*: Must distinguish between "looks like" (retrospective) and "is" (projective).

  9.  **Final Output Structure:**
      *   Introduction (Setting the ground).
      *   The Desiderata (Numbered, with Case, Status, Tension flags).
      *   The Three Explicit Handles (Ratchet, Units, Phase).
      *   The Self-Location Question.
      *   The Tension/Impossible Triangle.
