      *   **Confidence:** High confidence that Step (7) is the failure point. Moderate confidence on the exegesis of Strawson (always room for debate), but high confidence that this is the standard compatibilist reply to this specific objection.
      *   **Cost of Rejecting Step (7):** You have to accept Strawson's redefinition of "control." You lose the ability to say "Determinism might show us we're all exempt." But you keep moral progress (Step 6) because progress is about better understanding *capacities* and *intentions*, not about discovering metaphysical freedom.

