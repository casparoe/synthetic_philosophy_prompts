answer: |-
  This is a sharp reconstruction of what is often called the "Normative Objection" to Strawson (championed by critics like R. Jay Wallace and Gary Watson). You have correctly identified the tension between Strawson's naturalism (we can't help but participate) and his rationalism (the practice has internal standards of fairness).

  However, your argument does not force the dilemma you think it does. It looks compelling because it smuggles the metaphysical worry back in through the back door of the "internal standards."

  Here is the blunt diagnosis: **Step (7) is doing the damage.** It is the point where the argument equivocates on the meaning of "control" and "will," violating the constraints you successfully established in Steps (3) and (4).

  Here is the breakdown of why (7) fails, why (5) is imprecise, and what the costs are.

  ### The Breakdown: Step (7)

  **The Claim:** "Suppose it turned out that no one ever had that kind of control over their will. Then, by the practice's own lights, no resentment would ever be fitting."

  **The Error:** This step imports an *external* (metaphysical) definition of "control" into an *internal* standard.

  Strawson's entire project in "Freedom and Resentment" is to argue that the "control" required for responsibility is **not** contra-causal freedom or freedom from determinism. The "control" required by the internal standards of the practice is simply the **capacity to participate in ordinary interpersonal relationships.**

  *   **Internal Standard:** "Is this agent capable of understanding moral demands and responding to them?" (A psychological/functional question).
  *   **Your Step (7) Standard:** "Is this agent free from deterministic causation?" (A metaphysical question).

  When you say, "Suppose it turned out that no one ever had that kind of control," you are asking us to suppose that determinism negates the capacity for interpersonal relationships. Strawson's reply is: *It doesn't.*

  If you insist that "control" means "freedom from determinism," you are no longer operating by the practice's internal lights. You have stepped outside the practice to define the terms of the practice. This violates Step (3) and Step (4). You cannot use the internal standards to generate a global verdict *if* the input for that verdict (the definition of control) comes from outside the practice.

  **Confidence:** **High.** This is the standard compatibilist defense, but it is not merely a dogmatic reply. It follows directly from Strawson's redefinition of the reactive attitudes. If the reactive attitudes are responses to *quality of will*, and quality of will is a psychological fact about intentions and regard, then metaphysical determinism is irrelevant to the *fittingness* of the attitude, provided the psychology is intact.

  ### The Imprecise Step: (5)

  **The Claim:** "Internal standards only ever issue verdicts on individual cases... They tell you when to withhold resentment from *this* person."

  **The Error:** This is too narrow. Strawson explicitly allows for **general exemptions**. We withhold reactive attitudes from the mentally ill, the very young, and the brain-damaged *as classes*, not just case-by-case.

  **Why it matters:** This imprecision makes Step (6) (moral progress) look harder to justify than it is. We didn't just decide case-by-case that *this* insane person isn't responsible; we developed a psychological understanding that *insanity* precludes the capacity for ordinary relationships.

  **Correction:** Internal standards issue verdicts on cases *and* on capacities. We can revise our understanding of capacities (e.g., "We used to think children were miniature adults; now we know their capacity for regard is underdeveloped"). This revision happens *inside* the practice using better psychology, not metaphysics.

  **Confidence:** **Medium-High.** Strawson is somewhat vague on the line between particular exemptions and general policy, but he definitely acknowledges general exemptions. This doesn't break your argument, but fixing it clarifies how moral progress works.

  ### The Cost of Rejecting Step (7)

  You asked what it costs to reject Step (7) to save the other horns (Moral Progress + Dissolution of the Debate).

  **1. You lose the ability to worry that Determinism might abolish responsibility.**
  This is the price of admission for Strawson's view. If you reject (7), you must accept that the truth of determinism is *irrelevant* to the fittingness of resentment. If you find this unsatisfying, you are effectively demanding an external standpoint (Step 3), which Strawson argues is psychologically impossible for us to occupy.
  *   *Cost:* You must be comfortable with the idea that "Could they have done otherwise?" means "Could they have done otherwise if they had chosen to?" not "Were they causally determined?"

  **2. You save Moral Progress (Step 6).**
  By fixing Step (5) and rejecting (7), moral progress becomes intelligible. Progress isn't about discovering we are "more free" than our ancestors thought. Progress is about **epistemic refinement regarding capacities.**
  *   *Example:* We withdrew resentment from the mentally ill not because we discovered a metaphysical truth about free will, but because we discovered a psychological truth about *capacity for regard*. We realized their will did not manifest disregard in the way we thought; it manifested illness.
  *   *Benefit:* This keeps the improvement "real" (it's based on facts about human psychology) without requiring an external metaphysical standpoint.

  ### Summary of the Fix

  Your argument is valid, but Step (7) is unsound within the Strawsonian framework because it violates the closure of the system established in Steps (1)-(4).

  *   **If you keep (7):** You admit an external standpoint (the metaphysician's definition of control) determines the internal practice. You lose Strawson's dissolution of the free will debate.
  *   **If you reject (7):** You maintain that the "control" condition is purely psychological/interpersonal. Determinism cannot falsify it. You keep the dissolution. You *also* keep moral progress, understood as better psychological knowledge of who possesses the relevant capacities.

  ### Confidence Flags

  *   **Diagnosis of Step (7):** **High Confidence.** This is the standard and most robust defense of Strawson against this specific line of attack. The equivocation on "control" is the textbook error here.
  *   **Exegesis of Strawson:** **Medium-High Confidence.** Strawson is notoriously dense. Some critics (like P.F. Strawson's son, Galen Strawson, or R. Jay Wallace) argue that Strawson *does* owe us a normative justification that he doesn't provide. However, within the *internal logic* of the text as you've presented it, Step (7) is the breach.
  *   **Viability of the "Moral Progress" Save:** **Medium Confidence.** Explaining moral progress purely as "better psychology" without "better metaphysics" is satisfying to many, but some will feel it leaves out the normative force of *why* we should care about capacity. That is a deeper meta-ethical worry, but it doesn't validate your Step (7).

  **Bottom Line:** You do not have to choose between moral progress and the dissolution of the debate. You only have to choose between a metaphysical definition of control (which breaks Strawson's system) and a psychological one (which saves it). Step (7) assumes the former is the only way to generate a global verdict. Strawson denies that premise. Reject (7).
