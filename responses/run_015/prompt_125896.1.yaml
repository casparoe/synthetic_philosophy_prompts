answer: |-
  Here is the specification sheet for the unity of consciousness in split-brain cases, stripped of the usual rhetorical shortcuts.

  ### The Desiderata: Specifications for an Adequate Theory

  **1. Phenomenological Continuity (The "Everyday Life" Constraint)**
  The theory must explain why patients report no subjective fragmentation in daily life. Despite the severing of the corpus callosum, patients do not typically report "two voices" or competing streams of thought outside controlled laboratory settings. An adequate account cannot treat the lab dissociations as the *only* reality; it must explain why the system functions as a unified agent in ecological contexts.

  **2. Behavioral Dissociation (The "Contradiction" Constraint)**
  The theory must accommodate verified instances where the two hands perform mutually exclusive tasks simultaneously (e.g., one hand buttons a shirt while the other unbuttons it) without the subject reporting a loss of agency. It must explain how conflicting motor programs are executed without a central executive resolving the conflict *before* action.

  **3. The Confabulation Mechanism (The "Interpreter" Constraint)**
  The theory must explain the Left Hemisphere's (LH) tendency to fabricate reasons for actions initiated by the Right Hemisphere (RH). If the LH is the sole seat of verbal report, it must have a mechanism for generating plausible narratives for data it did not generate. The theory cannot simply label this "lying"; it must account for why the LH *believes* its own fabrications in the moment.

  **4. Asymmetric Access (The "Cross-Cueing" Constraint)**
  *Correction on Mechanics:* You noted asymmetric transparency where one hemisphere monitors the other. Technically, this is rarely direct "monitoring" of reasoning. It is usually **sensory feedback** (visual, proprioceptive, or emotional) routed through subcortical structures (brainstem/thalamus) that remain intact. The LH sees the left hand move or feels the body shift, but lacks the *efference copy* (the motor command signal).
  *The Desideratum:* The theory must distinguish between **access to output** (seeing the hand move) and **access to intent** (knowing why it moved). It must define whether a system that observes its own limb without knowing the cause counts as "self-observation" or "other-observation."

  **5. Subcortical Consistency (The "Anatomy" Constraint)**
  The theory cannot assume total isolation. The corpus callosum is cut, but subcortical pathways remain. Any claim of "two separate minds" must explain why these subcortical links don't sustain enough integration to prevent dissociation, or conversely, why they sustain enough integration to prevent total behavioral chaos.

  **6. Identity Stability (The "Persistence" Constraint)**
  The theory must not imply that personhood is created or destroyed instantly by a scalpel. If the patient is one person before surgery, the theory needs a principled reason for why they become two (or cease to be one) immediately after, rather than remaining one person with a communication bottleneck.

  ***

  ### Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (Must Haves):**
  *   **Consistency with Behavioral Data:** You cannot theorize away the tachistoscopic dissociations. If the left hand can pick an object the verbal system claims not to see, the theory must account for that information barrier.
  *   **Anatomical Realism:** You cannot assume the hemispheres are totally isolated (ignoring subcortical links) nor totally integrated (ignoring the callosotomy).
  *   **Confabulation Honesty:** You cannot treat the LH's verbal reports as infallible truth. The theory must accept that the reporting mechanism can be wrong about the cause of action.

  **Camp Preferences (Negotiable):**
  *   **Pre-Surgery Equivalence:** Whether the post-surgery system must function *exactly* as well as the pre-surgery system. (Division camp says no; Unity camp says yes, mostly).
  *   **Deterministic Integration:** Whether neural integration is required for phenomenal unity. (Some argue you can have unity without direct neural bridging, relying on external feedback loops).
  *   **The "Person" Label:** Whether "person" maps to "biological organism," "functional system," or "phenomenal field." This is metaphysical, not empirical.

  ***

  ### The Unsatisfiable Subset: A Position

  You are correct: **"Full Phenomenal Transparency"** and **"No Hidden Subpersonal Mental Streams"** are jointly unsatisfiable given the anatomy.
  *My Position:* If the LH can observe the RH's motor output via subcortical sensory feedback without accessing the RH's intention, then **Full Phenomenal Transparency is false.** There *must* be hidden mental streams (or at least hidden processing states) relative to the reporting agent. To insist on full transparency is to deny the data of confabulation. To insist on no hidden streams is to deny the anatomy of the subcortical bypass. You must accept that consciousness is **partially opaque** to itself in these cases. The "self" observing the hand is not the same "self" that moved it, yet they share a body. This forces a rejection of the idea that a single person must have total introspective access to all their own mental causes.

  ***

  ### Evaluation of the Camps

  The **Unity Camp** fails the *Behavioral Dissociation* and *Confabulation* desiderata by treating the split data as artifacts or "partial access" within a single mind, which effectively gaslights the empirical reality that the left hand can act on information the verbal mind explicitly denies having; they preserve the "person" but break the physics of information flow. The **Division Camp** fails the *Phenomenological Continuity* and *Identity Stability* desiderata by reifying hemispheres into distinct persons too eagerly, ignoring that patients do not experience themselves as two people and that subcortical links prevent total functional independence; they preserve the data but multiply persons beyond phenomenological necessity. Both fail because they treat unity as binary; the data demands a model of **graded integration** where unity is a matter of degree, not a switch.
