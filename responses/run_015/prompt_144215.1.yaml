answer: |-
  This is a remarkably precise deadlock, and it stems from the fact that you are both identifying real tensions in the text, but you are locating them in different philosophical registers. Your friend is reading the preface as a **rhetorical act** (a boundary-setting maneuver within a profession), while you are reading it as an **epistemological claim** (a theory about the relationship between language and reality).

  The reason you cannot resolve the dilemma of the envoy is that Ranke's 1824 vocabulary does not map cleanly onto the twentieth-century distinction between "agent self-description" and "structural reconstruction." To understand the grammar of the claim, we have to look at what kind of speech act a preface is, what work *eigentlich* does in German Idealist prose, and how the "supreme law" sentence modifies the famous slogan.

  Here is the grammar of the claim, broken down by its components.

  ### 1. The Speech Act: Refusal vs. Vow
  Your friend is correct that the energy of the first half of the passage is negative. Ranke is performing a **refusal**. In 1824, "history" (as a genre) was largely understood as *magistra vitae* (teacher of life). It was moral philosophy by example. By saying "Such a lofty function the present work does not attempt," Ranke is not lowering the status of history; he is shifting its jurisdiction. He is moving history from the **courtroom** (judging the past) to the **temple** (witnessing the past).

  However, you are correct that the second half is not merely a shrug. The "supreme law" sentence is a **vow**. It is a normative demand placed upon the historian's conduct, not a description of the past's accessibility.

  **The Synthesis:** The claim is not "I can tell you the truth" (epistemology); it is "I will not subordinate the past to your present needs" (ethics), and "I will bind myself to the sources even when they are ugly" (method). The "truth" claim is secondary to the **disciplinary vow**.

  ### 2. The Grammar of *Eigentlich*
  Your friend's etymological point is vital. *Eigentlich* comes from *eigen* (own). In the context of German Idealism (which permeates Ranke's training), *eigentlich* does not mean "objectively verifiable" in the positivist sense you are likely hearing it. It means "properly," "essentially," or "in its own character."

  When Ranke contrasts "judging the past" with showing how it *eigentlich gewesen*, he is contrasting **appropriation** with **recognition**.
  *   **Judging/Instructing:** This takes the past and makes it *ours* (useful for our future, subject to our morals).
  *   **Showing *eigentlich*:** This lets the past remain *its own* (distinct, self-contained).

  This connects directly to the theological point your friend cited (that every epoch is "immediate to God"). If an epoch is immediate to God, it has validity in itself, regardless of whether it produced "good" outcomes for us. Therefore, to show how it *eigentlich* happened is to show it in its **autonomy**, not necessarily its **objective material reality** as defined by modern social science.

  ### 3. Resolving the Envoy Dilemma
  This is where your deadlock can be broken. You asked: *Does "how it actually took place" include the envoy's own sense of what he was about, or the configuration the historian reconstructs?*

  In Ranke's grammar, the answer is **neither and both**, because Ranke operates with a concept of **tendency** (*Tendenz*) rather than "motive" or "structure."

  *   **The Envoy's View:** For Ranke, the envoy's claim ("defending Christendom") is a historical fact *of consciousness*, but it is not necessarily the *eigentlich* reality of the action. It may be a pretext.
  *   **The Historian's View:** The historian's reconstruction ("protecting revenue") is not a "scheme imposed" (as you fear) but a discernment of the **dominant spiritual-political force** of that epoch.

  For Ranke, the "Actual" (*das Eigentliche*) is the **manifestation of the Idea in the Fact**. He believes that behind the chaos of events, there is a spiritual coherence (often tied to the rise of the State or the Church).
  *   If the envoy says "Christendom" but acts for "Revenue," Ranke would likely argue that the *eigentlich* reality is the **tension** between the two, or the way the Revenue serves the State which serves the Order of the World.
  *   Crucially, Ranke trusts the **archive** (the dispatch, the secret memo) over the **public declaration**. The "Actual" is what happens when the mask slips.

  So, *eigentlich* does not mean "what the agent felt" (subjective) nor "what the sociologist models" (anachronistic). It means **"what the event was in the sight of God/History,"** discerned through the critical comparison of sources. It licenses overriding the agent's self-description *if* the sources reveal a deeper tendency, but it forbids overriding the event's dignity *to serve a moral lesson*.

  ### 4. The "Supreme Law" and the Limit of the Claim
  You noted that the "supreme law" sentence is a normative demand, not an abstention. This is your strongest point against your friend. "Rigorous presentation of the facts... is without question the supreme law."

  This sentence modifies *wie es eigentlich gewesen*. It tells us **how** the historian is to achieve the "actual."
  *   It admits the facts may be "conditional and lacking in beauty."
  *   It demands "rigorous presentation."

  This confirms that Ranke knows the "actual" is not always pretty or morally edifying. It supports your view that this is a substantive thesis about truth, not just a guild rule. **However**, it supports your friend's view that the *burden* is on the presentation, not the metaphysics. The "law" binds the writer's hand. It says: "Do not smooth this over to make a point."

  ### 5. Where You Are Both Overreading
  **Your Friend's Overreading:**
  She treats the preface as *purely* negative to protect Ranke from later critiques of positivism. She wants to say Ranke isn't claiming "Objective Truth" (capital O, capital T). But Ranke *is* claiming access to a reality that exists independent of the historian's moralizing. To say he offers "no theory of truth" goes too far. He offers a **theological theory of truth**: the truth is what God intended in the event, revealed through sources.

  **Your Overreading:**
  You are imposing a dichotomy (Agent's View vs. Historian's Scheme) that assumes the "Historian's Scheme" is inherently artificial. Ranke would reject this. He believes the "scheme" (the narrative of the epoch) is **found**, not imposed, because the epoch itself has an inner unity (an *Idea*). You are treating him like a 20th-century empiricist who worries about selection bias; he is a 19th-century Idealist who worries about spiritual fidelity.

  You are also treating the preface as a philosophical treatise. It is a **marketing device** and a **shield**. It tells the reader: "Do not criticize me for not praising the heroes; I am doing something harder." It manages expectation.

  ### 6. What You Are Both Missing: The Theological Substrate
  The missing key to the grammar is the **theological assumption**.
  *   **Friend:** Sees the "immediate to God" line as a way to validate the past's existence (ontological worth).
  *   **User:** Sees the "supreme law" as a demand for empirical rigor (methodological worth).

  **The Synthesis:** For Ranke, **Ontology and Method are the same.** Because every epoch is "immediate to God," it has a coherent inner logic. Because it has a coherent inner logic, the historian can find it through rigorous source criticism. The "Actual" (*eigentlich*) is the point where the **Divine Intention** intersects the **Human Archive**.

  Therefore, the formula *wie es eigentlich gewesen* is not a claim that the historian can reconstruct the past "as it happened" in a cinematic sense (positivism). It is a vow that the historian will attempt to reconstruct the past **as it meant itself** in its own spiritual context, free from the historian's desire to use it for moral instruction.

  ### Conclusion: Who Wins the Argument?
  You both win half the point, but the text leans slightly toward your friend regarding the *function* of the sentence, and toward you regarding the *implication* of the sentence.

  *   **Friend is right** that the sentence is primarily a refusal of the **moralizing office**. The word "merely" (*bloss*) is a rhetorical device to lower expectations of edification so he can raise expectations of fidelity.
  *   **You are right** that the "supreme law" sentence makes a **normative truth claim**. It asserts that there *are* facts, they *can* be presented rigorously, and this presentation is the highest duty.

  **The Verdict on the Envoy:**
  Ranke would say the "Actual" is the **State's interest** (the revenue), discerned through the archives, which the envoy cloaked in **Religious language** (Christendom). The historian's job is to strip the cloak without denying the cloak existed.
  *   If you say this makes the historian's view superior to the agent's, Ranke agrees (the historian sees the whole epoch; the agent sees only their moment).
  *   If you say this imposes a modern scheme, Ranke disagrees (the State's interest was the *divine tendency* of that age, not a modern sociological category).

  **The Grammar in Brief:**
  The passage is a **Methodological Vow grounded in Theological Ontology.**
  1.  **Refusal:** I will not judge (moralize).
  2.  **Promise:** I will show the thing in its own character (*eigentlich*).
  3.  **Law:** I will bind myself to the facts, however ugly.

  Your friend misses the strength of the Promise; you miss the limit of the Refusal. The "Actual" is not "Objective Reality" (your worry); it is "Proper Essence" (her point). But accessing that Essence requires the "Rigorous Presentation" (your point). The formula has content, but its content is **fidelity to the epoch's own logic**, not fidelity to modern standards of proof or agent-reported experience.
