prompt: |-
  I'm preparing an interview for a philosophy podcast. Next week's guest is an unnamed philosopher who defends a revisionist position in epistemic game theory: she argues that common knowledge of rationality should be replaced by a model of common belief of bounded rationality built with non-partitional neighborhood frames, in which agents jointly attend to each other's reasoning limits without requiring an infinite hierarchy of mutual belief. Draft six to eight interview questions that go beyond having her restate the view. At least two questions should press on how the neighborhood-semantics approach avoids the standard regress objection that usually motivates common-knowledge hierarchies; at least one should ask how she applies this framework to classic strategic interactions—such as coordination or matching-pennies scenarios—without reproducing the standard rationalizability predictions tied to Aumann-style common knowledge; and at least one should anticipate her likely deflection that this is merely formalism rather than philosophy, with a follow-up that forces her to specify what conceptual or empirical work the formalism actually performs. For each primary question, include a brief follow-up keyed to the answer she is most likely to give. Finally, for the sequence as a whole, state explicitly what reply from the guest would cause you to revise the framing of these questions, and identify the specific point at which your line of questioning is most vulnerable to misrepresenting the literature on epistemic logic and strategic reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy podcast interview preparation.
      *   **Guest:** Unnamed philosopher (female).
      *   **Topic:** Revisionist epistemic game theory.
      *   **Core Thesis:** Replace Common Knowledge of Rationality (CKR) with Common Belief of Bounded Rationality (CBBR) using non-partitional neighborhood frames. Agents jointly attend to reasoning limits without infinite hierarchies.
      *   **Requirements:**
          *   6-8 interview questions.
          *   Go beyond restating the view.
          *   At least 2 questions on how neighborhood semantics avoids the standard regress objection (motivating CKR hierarchies).
          *   At least 1 question on application to classic strategic interactions (coordination/matching-pennies) vs. standard rationalizability (Aumann-style).
          *   At least 1 question anticipating the "merely formalism" deflection, forcing specification of conceptual/empirical work.
          *   Include brief follow-ups for each question (keyed to likely answers).
          *   State explicitly what reply would cause a revision of the framing.
          *   Identify the specific point where the line of questioning is most vulnerable to misrepresenting the literature.

  2.  **Deconstruct the Guest's Position:**
      *   *Standard View:* Aumann's agreement theorem, CKR, partitional information structures, infinite hierarchy of "I know that you know that I know..."
      *   *Guest's View:* Bounded rationality (agents can't compute infinite steps), Non-partitional neighborhood frames (allows for uncertainty about what is known/believed without strict partitions), Joint Attention (a psychological/phenomenological hook?), No infinite hierarchy (finite depth or structural fix).
      *   *Key Tension:* How do you get stability/equilibrium without the infinite anchor of CKR? How does "joint attention" substitute for the logical rigor of common knowledge?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (The Regress/Foundations):* Need to ask about the regress objection. Standard CKR is motivated by the need to stop the "I think that you think..." buck.
          *   *Draft:* Why is the regress bad? How does neighborhood semantics stop it?
          *   *Refinement:* Make it sharper. Focus on the *motivation* for the infinite hierarchy in the first place.
          *   *Follow-up:* If she says "it's psychologically unrealistic," push on whether logic requires psychological realism.

      *   *Q2 (The Regress/Technical):* Second question on regress. Focus on the *mechanism* of neighborhood frames.
          *   *Draft:* How do neighborhood frames work here?
          *   *Refinement:* Ask about the trade-off. Non-partitional frames allow for "unawareness" or "imprecise belief." Does this introduce instability?
          *   *Follow-up:* If she claims stability, ask how it's guaranteed without the fixed point of common knowledge.

      *   *Q3 (Strategic Application):* Need to apply to Coordination/Matching Pennies.
          *   *Draft:* How does this change the Prisoner's Dilemma?
          *   *Refinement:* Stick to the prompt's suggestion: Coordination or Matching Pennies. How do predictions differ from Rationalizability?
          *   *Follow-up:* If she says "it predicts focal points," ask if that's just smuggling in psychology.

      *   *Q4 (The "Just Formalism" Objection):* Anticipate the deflection.
          *   *Draft:* Isn't this just math?
          *   *Refinement:* Frame it as "instrumentalism vs. realism." What *work* does it do?
          *   *Follow-up:* Force her to name a specific philosophical problem solved, not just a game solved.

      *   *Q5 (Joint Attention):* The prompt mentions "agents jointly attend to each other's reasoning limits." This sounds phenomenological.
          *   *Draft:* What is joint attention?
          *   *Refinement:* Connect the logical formalism to the psychological concept. Is "joint attention" doing the heavy lifting instead of the logic?
          *   *Follow-up:* If she says it's a bridge concept, ask if it's reducible to the formalism.

      *   *Q6 (Normativity):* Game theory is often normative (how agents *should* reason). Bounded rationality is descriptive.
          *   *Draft:* Is this normative or descriptive?
          *   *Refinement:* If rationality is bounded, is the solution concept still normative? Or just predictive?
          *   *Follow-up:* If normative, how can you be obligated to do what you can't compute?

      *   *Q7 (Comparison to Level-k):* Bounded rationality often leads to Level-k thinking.
          *   *Draft:* Is this just Level-k?
          *   *Refinement:* How is this distinct from standard behavioral game theory (Level-k, Cognitive Hierarchy)?
          *   *Follow-up:* If it's distinct, is it because of the *common* belief aspect?

      *   *Q8 (The Cost of Revision):* What do we lose by dropping CKR?
          *   *Draft:* What's the downside?
          *   *Refinement:* Aumann's results are powerful. Do we lose the Agreement Theorem?
          *   *Follow-up:* If yes, is that a bug or a feature?

      *   *Selection:* I need 6-8. I'll combine/refine to ensure flow.
      *   *Check Constraints:* 2 on regress (Q1, Q2), 1 on strategic interaction (Q3), 1 on formalism (Q4). The rest fill out the philosophical implications.

  4.  **Refining Follow-ups:**
      *   Must be keyed to the *likely* answer. Philosophers often defend by distinguishing "idealization" from "reality" or claiming "conceptual clarity." I need to anticipate those moves.

  5.  **Addressing the Meta-Requirements:**
      *   *Revision Trigger:* What answer would make me change the questions? If she admits the formalism *doesn't* solve the regress but just models it differently, or if she concedes the "joint attention" is purely metaphorical.
      *   *Vulnerability:* Where might I misrepresent the literature? The distinction between "partitional" and "non-partitional" is technical. Misunderstanding the specific logical properties of neighborhood models (e.g., failing to satisfy axiom K or 4) could make me look ignorant. Also, conflating "bounded rationality" with "limited depth" vs. "computational cost."

  6.  **Final Polish:**
      *   Ensure tone is professional but probing (podcast style).
      *   Check that the "joint attention" aspect is integrated, as it's a specific detail in the prompt.
      *   Verify the "formalism" question is sharp.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm attacking her, but rather exploring the *consequences* of her view. The prompt asks to "press" and "force," so the tone should be rigorous.
      *   *Correction on Q1/Q2:* Ensure they are distinct. Q1 on the *motivation* for avoiding regress (psychological vs logical). Q2 on the *technical mechanism* (neighborhoods vs partitions).
      *   *Correction on Q4:* Make sure the follow-up demands a non-formal output.

  7.  **Final Review against constraints:**
      *   6-8 questions? Yes (I will aim for 7).
      *   2 on regress? Yes (Q1, Q2).
      *   1 on strategic interaction? Yes (Q3).
      *   1 on formalism deflection? Yes (Q5).
      *   Follow-ups included? Yes.
      *   Revision trigger stated? Yes.
      *   Vulnerability identified? Yes.

  8.  **Constructing the Output:** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are seven interview questions designed to probe the philosophical and technical commitments of your guest's revisionist epistemic game theory, along with the required meta-analysis.

  ### Interview Questions

  **1. The Motivation for Avoiding Regress**
  Standard epistemic game theory accepts the infinite hierarchy of mutual belief as the price of admission for stability; the "regress" is viewed as a logical feature, not a bug, ensuring that no agent has a reason to doubt the other's doubt. You argue this should be replaced by a model of bounded rationality. Is your objection to the infinite hierarchy primarily that it is *psychologically impossible* for agents to sustain, or that it is *conceptually incoherent* to define rationality in terms of capacities no agent possesses?
  *   **Follow-up:** If she answers that it is psychologically impossible: "If the objection is merely psychological, why does that necessitate a change in the *logic* of rationality rather than just a constraint on its *application*? Can't an ideal logic describe norms we fail to meet, much like perfect morality describes actions we fail to perform?"

  **2. Neighborhood Semantics and the Regress Mechanism**
  You propose using non-partitional neighborhood frames to model this bounded rationality. In standard partitional models, the regress is halted by the fixed-point property of common knowledge. In your neighborhood framework, you claim agents jointly attend to reasoning limits without that infinite anchor. Technically, how does the neighborhood structure prevent the regress from re-emerging as instability? Does the model simply *truncate* the hierarchy, or does it fundamentally change the logic of belief so the hierarchy never generates?
  *   **Follow-up:** If she claims it truncates the hierarchy: "If you truncate the hierarchy at level *n*, doesn't that reintroduce a form of common knowledge—specifically, common knowledge of the truncation point? How do you avoid simply pushing the regress back one step to the agreement on the bound itself?"

  **3. Strategic Predictions in Coordination Problems**
  Let's apply this to a classic coordination game, like a Hi-Lo matching scenario. Under Aumann-style common knowledge of rationality, rationalizability often permits multiple equilibria or relies on salience external to the model. Does your Common Belief of Bounded Rationality (CBBR) select a unique equilibrium where standard models do not, or does it predict a failure to coordinate that standard models miss?
  *   **Follow-up:** If she claims it predicts unique coordination: "If your model predicts unique coordination without external salience, aren't you effectively smuggling the solution into the 'joint attention' parameter? How do we distinguish the predictive power of your formalism from the intuitive assumptions built into the neighborhood selection?"

  **4. The Nature of "Joint Attention"**
  Your abstract mentions agents "jointly attending" to each other's reasoning limits. In philosophy of mind, joint attention is a rich, often pre-reflective phenomenological state. In your formalism, is "joint attention" reducible to a specific set-theoretic relation within the neighborhood frame, or is it a primitive concept that the formalism is trying to capture but cannot fully define?
  *   **Follow-up:** If she says it is reducible to the formalism: "If it is fully reducible, does anything remain of the phenomenological concept? If nothing remains, why use the term 'attention' rather than 'mutual accessibility,' and does this terminological choice risk conflating logical accessibility with cognitive awareness?"

  **5. The "Merely Formalism" Objection**
  A critic might argue that swapping partitional for non-partitional frames is a technical adjustment that leaves the philosophical landscape unchanged—it's just a different way to draw the same boxes. What specific *philosophical* problem regarding the nature of rationality or agency does this formalism solve that could not be solved by simply stating "agents are bounded" within the standard framework?
  *   **Follow-up:** If she argues it provides better empirical fit: "Empirical fit is a virtue of psychology, not necessarily philosophy. If the formalism changes the *definition* of rationality to match behavior, are you not risking a loss of normativity? What work is left for the concept of 'rationality' to do if it is defined solely by what agents actually compute?"

  **6. Normativity vs. Description**
  Game theory often straddles the line between prescribing how agents *ought* to reason and describing how they *do* reason. If rationality is bounded by the architecture of the neighborhood frame, is your solution concept normative? Can an agent be criticized for failing to play the equilibrium of your model if the model is built on their inability to compute the standard one?
  *   **Follow-up:** If she says it is purely descriptive: "If the theory is purely descriptive, in what sense is it a theory of *rationality* rather than a theory of *behavior*? Does your revisionism ultimately dissolve the normative force of game theory entirely?"

  **7. The Cost of Revision (Agreement Theorem)**
  Aumann's Agreement Theorem is a cornerstone of epistemic game theory, relying heavily on partitional information. By moving to non-partitional neighborhood frames, you likely sacrifice the guarantee that agents cannot agree to disagree. Do you view the loss of the Agreement Theorem as a necessary cost of realism, or does your model offer a weakened version of agreement that preserves the core insight?
  *   **Follow-up:** If she accepts the loss of the theorem: "If agents can legitimately agree to disagree in your model, does that undermine the possibility of stable social contracts or conventions based on rational consensus, or do you view that instability as a more accurate picture of social reality?"

  ***

  ### Meta-Analysis of the Interview Strategy

  **Condition for Revising the Framing**
  I would revise the framing of these questions if the guest replies to **Question 2** by conceding that the neighborhood semantics *does not* technically solve the regress but merely *models the appearance* of its resolution for specific computational agents.
  *   **Reasoning:** The prompt specifies that she "argues that common knowledge... should be replaced by a model... in which agents jointly attend... without requiring an infinite hierarchy." If she admits the hierarchy is still logically present but simply ignored by the agents (a performance error rather than a competence change), the philosophical weight of the "revisionist" claim collapses. The interview would then need to pivot from "new logic of rationality" to "psychological constraints on standard logic," rendering Questions 1, 5, and 6 less relevant.

  **Vulnerability to Misrepresenting the Literature**
  The line of questioning is most vulnerable at **Question 2 (Neighborhood Semantics and the Regress Mechanism)** regarding the technical properties of non-partitional frames.
  *   **Specific Point:** In epistemic logic, moving from partitional to neighborhood (or Scott/Montague) semantics often involves dropping the **axiom of negative introspection** (if I don't believe *p*, I believe that I don't believe *p*) or the **axiom of truth** (what I know is true).
  *   **Risk:** If I imply that non-partitional frames *automatically* avoid regress without acknowledging that they often sacrifice logical omniscience or consistency properties (like axiom K), I may misrepresent the trade-off. Standard literature suggests that avoiding infinite hierarchies often comes at the cost of logical closure. If the guest's model retains closure while dropping the hierarchy, she is making a very strong, non-standard claim. Pressing her on "truncation" (as in the follow-up) might miss the nuance if her model uses a fixed-point operator within the neighborhood structure that *mimics* common knowledge without the hierarchy. I must be careful not to conflate "bounded rationality" (computational limits) with "non-partitional information" (logical structure), as they are distinct modifications in the literature.
