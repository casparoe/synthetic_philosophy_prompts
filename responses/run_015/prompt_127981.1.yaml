      *   *Distortions:*
          *   Locke's "Commons": Git doesn't really have a "commons" state, it's either a repo or a clone.
          *   "Mixing" Labor: In Git, labor is additive (commits), not mixing with a pre-existing physical resource. You aren't mixing labor with land; you're appending nodes to a graph.
          *   Exclusion: Locke implies the right to exclude others. Git's distributed nature makes technical exclusion impossible once cloned. You can only exclude from *your* remote, not from the data itself.
      *   *Missing Normative Claims (The "Residue"):*
