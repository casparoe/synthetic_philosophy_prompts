      *   *Philosophical Implication:* IP philosophy assumes a legal layer enforces integrity. Git assumes the social layer (reputation, community norms) enforces integrity.
      *   *Conclusion:* Git lacks the normative dimension of "integrity" as a right; it only has "integrity" as data consistency (hashes).

