      *   *Anti-Propertarian/Non-Rivalrous:* Ideas can be copied without diminishing the original. In Git: Cloning a repo doesn't delete the original. A fork is a full copy; the upstream remains intact.
      *   *The Conflict:* Does the act of committing grant exclusive rights to merge, or does the distributed nature grant everyone the right to diverge?

  3.  **Drafting the Core Debate (Git Vocabulary):**
      *   *Lockean Position:* A commit object is cryptographically signed by an author. The hash is unique to that content and metadata. This binding of identity to change implies ownership. If I push to `main`, I expect my commit history to remain immutable. A license is a config file that restricts who can pull or merge.
      *   *Anti-Propertarian Position:* The repository is a DAG (Directed Acyclic Graph). Any user with read access can `clone`. This creates a new root. The data is non-rivalrous; my clone does not lock your origin. A fork creates a parallel `main` branch. There is no technical lock preventing a rebase that rewrites history or a fork that ignores the upstream license (technically).
      *   *The Merge Conflict:* This is the physical manifestation of the philosophical clash. Two divergent histories claim authority over the same file state. Resolving it requires a decision on whose labor takes precedence.

  4.  **Developing the Residue Report:**
