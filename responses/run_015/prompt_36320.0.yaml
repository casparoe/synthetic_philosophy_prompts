answer: |-
  This is precisely the kind of objection that keeps defenders of particularist justice awake at night, and I want to start by correcting a subtle conflation in your premise. You suggest that shared causation generates "special obligations" akin to those of compatriotism. I would argue it generates *remedial duties*, which are universal in scope, not associative obligations. If my country floods yours via emissions, we owe you restitution based on a universal duty not to harm, not because we share a political culture. That duty is real and stringent, but it is distinct from the thick reciprocity of a shared cooperative scheme. The fact that I owe you reparations for damage does not necessarily mean I owe you the same priority in distributing the benefits of our social contract that I owe my fellow citizens who sustain that contract with me.

  However, your deeper point stands: does the universal duty to remedy harm swallow the particular duty to maintain our own polity? Here, I argue for a division of labor. To effectively meet those global remedial duties, we need functional political agents capable of collective action, taxation, and regulation. Historically and practically, the nation-state is the only vehicle robust enough to coordinate the decarbonization and redistribution required. If we dissolve the special obligations that bind compatriots—those sentiments of solidarity that make citizens willing to sacrifice for one another—we weaken the very agent capable of addressing the climate crisis. Paradoxically, maintaining strong special obligations is instrumentally necessary to fulfill our universal duties. We need strong houses to fix the roof, even if the storm threatens everyone.

  I will flag this, however, as a significant pressure point for my position. If the harm caused by a polity becomes existential for outsiders—say, our emissions literally render another country uninhabitable—the universal duty of rescue may trump the particular duty of maintenance. At that threshold, the legitimacy of the coercive institutions we share is undermined by their external effects. I am prepared to concede that special obligations are conditional on the polity not being a vehicle for catastrophic external harm. But short of that extreme, the mechanism of shared institutions remains the primary ground of justice, while causation grounds only restitution. The former builds the house; the latter pays for the broken window.
