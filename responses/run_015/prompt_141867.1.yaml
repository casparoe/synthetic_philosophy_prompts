      *   *Key Insight to emphasize:* The Barber Paradox is usually presented as $\exists b \forall x (S(b,x) \leftrightarrow \neg S(x,x))$. This is a contradiction in logic *if* $b$ is in the domain.
      *   Naive Set Theory says $\forall \phi \exists y \forall x (x \in y \leftrightarrow \phi(x))$.
