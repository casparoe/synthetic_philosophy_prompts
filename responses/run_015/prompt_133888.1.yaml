answer: |-
  ### The Principle of Non-Destructive Inspection

  In the language of decision theory, Good's theorem states that for a rational agent seeking to maximize a specific outcome, the expected value of obtaining free information before acting is never negative. You should never refuse a free observation. Translated into the physics and chemistry of the darkroom, this becomes **The Principle of Non-Destructive Inspection**.

  Here is the mapping of the formal argument onto your development process:

  **1. The State of the World (The Latent Potential)**
  In the theorem, there is a "true state" you are trying to guess. In the tank, this is the **actual silver halide reduction curve** currently existing on your film. It is the objective reality of how much metallic silver has formed in the shadows and highlights at this exact second. This state is hidden from you in the dark. It determines the maximum tonal separation available to you.

  **2. The Prior Belief (The Time-Temperature Estimate)**
  Before you look, you have a probability distribution based on your meter readings, film speed rating, and developer history. You believe there is an 80% chance the negatives are at 90% of their optimal density and a 20% chance they are underdeveloped. This is your **development estimate**. It is your best guess without data.

  **3. The Action (Termination of Development)**
  Your decision is binary or continuous: **Stop the developer now** or **allow development to continue**. This action fixes the chemical state. Once you pour the stop bath, the silver halide reduction halts. You cannot reverse this action. If you stop too early, you lack density; if you stop too late, you lose shadow detail to chemical fog and excessive contrast.

  **4. The Utility (Tonal Integrity)**
  Your goal is to maximize **printable tonal range**. This is your "utility." A negative with optimal density yields a print with separation in the shadows and texture in the highlights. A negative that is under- or over-developed yields a print with muddy blacks or blown whites. The value of your final print depends entirely on matching the development action to the latent state.

  **5. The Cost-Free Observation (The Safelight Densitometer)**
  Good's theorem requires the observation to be free. In the darkroom, this maps to **measuring the negative's density under conditions that introduce zero light fog and zero temperature fluctuation.** Imagine you have a densitometer that can read the wet film through the tank lid without letting light in, or a safelight so safe it triggers no silver reduction. This is the **non-destructive inspection**.

  **6. The Bayesian Update (The Time Adjustment)**
  If you observe the density, you update your belief. If the densitometer reads lower than expected, you extend the time. If it reads higher, you pour the stop bath immediately. This is the **development correction**.

  **The Theorem Restated:**
  If you can measure the density of your developing emulsion without altering the emulsion (zero fog, zero temperature loss), you should **always** measure. Even if you are confident in your time-temperature estimate, the measurement can only help. In the best case, it confirms your guess, and you proceed as planned (no loss). In the worst case, it reveals your guess was wrong, and you correct the time to save the negative (gain). There is no scenario where knowing the true density leads to a worse print than guessing, provided the act of knowing does not damage the film.

  ***

  ### Residue Report

  When we press the mathematical logic of Good's theorem against the physical reality of silver gelatin chemistry, several components fracture. The theorem is an epistemic rule (about knowledge), but the darkroom is an ontic environment (about physical matter). Here is what survives and what collapses.

  **1. The Assumption of Zero Cost (The Fog Problem)**
  *   **Theorem:** Information must be cost-free.
  *   **Darkroom:** Observation is physically intrusive. To check a negative's density, you must open the tank or expose the film to a safelight. Even an OC safelight adds a base fog density over time. Checking the temperature lowers the chemical temperature.
  *   **The Gap:** In the darkroom, the "cost" of information is often positive. If the fog introduced by checking the density exceeds the value of the correction you make, the observation has negative value.
  *   **Diagnosis:** This reveals that the theorem is a boundary condition, not a physical law. It defines the ideal limit. In practice, it suggests your framework needs a **Fog Budget**. You must calculate whether the information gained is worth the degradation of the D-min (minimum density). If the theorem suggests "always look," the darkroom corrects this to "look only when the variance in your prior belief is high enough to justify the fog risk."

  **2. The Stability of Utility (The Aesthetic Drift)**
  *   **Theorem:** Your goals (utility function) remain constant before and after the observation. You want the same "best outcome" regardless of what you see.
  *   **Darkroom:** Your aesthetic goals often shift upon seeing the intermediate state. You might start wanting a high-contrast negative, but upon seeing a soft, low-density test strip, you realize the grain structure is beautiful and decide to aim for a lower-contrast print instead.
  *   **The Gap:** The observation changes what you value. You are no longer maximizing the original utility function.
  *   **Diagnosis:** This is not a failure of your photography; it is a limitation of the theorem. Good's theorem assumes a static target. In art, the target moves. This suggests the philosophical claim is less substantive than the math implies: rationality in art includes the permission to change your definition of "success" mid-process. The theorem cannot account for creative evolution, only optimization of a fixed goal.

  **3. Irreversibility and the "Ruin" Scenario**
  *   **Theorem:** You can choose any action after observing.
  *   **Darkroom:** Development is additive and irreversible. You can add time, but you cannot subtract silver once reduced. Furthermore, there is a specific threshold where a negative becomes **unfixable** (solarization or extreme fog).
  *   **The Gap:** There is a scenario where seeing the intermediate state justifies abandoning a print that would have recovered on its own. Suppose you pull a print early to check. It looks weak. You panic and over-compensate with a high-contrast filter or extended development on the next attempt, ruining the tonal smoothness. Had you not looked, you would have pulled it at the standard time, and it would have been acceptable. The *knowledge* induced a *panic response* that lowered the utility.
  *   **Diagnosis:** This reveals a missing concept in your framework: **Decision Stability.** It is not enough to have information; you must have the discipline to act on it without over-correction. However, strictly speaking, if you are a "rational agent" as defined by the theorem, you would not panic. You would update calmly. Therefore, this gap suggests that human photographers are not the rational agents the theorem requires. The theorem holds for a perfect developer, but not for a human hand.

  **4. The Value of Ignorance (The Flow State)**
  *   **Theorem:** Free knowledge is never negative.
  *   **Darkroom:** There are times when knowing the density degrades the process. If you obsess over every minute of development, you lose the intuition required to judge the final print. You become a technician measuring density rather than a photographer judging tone.
  *   **The Gap:** Sometimes, refusing information preserves the heuristic intuition that leads to better long-term results.
  *   **Diagnosis:** This suggests the philosophical claim is mathematically sound but practically narrow. It optimizes for a single decision, not a career of practice. Relying on the meter prevents you from learning to read the emulsion by eye. In this sense, "free knowledge" can have an **opportunity cost** regarding skill acquisition. The theorem ignores the value of learning through uncertainty.

  ### Summary of the Residue

  The core logic of Good's theorem survives intact: **Uncertainty is a risk, and reducing uncertainty generally improves outcomes.** If you could magically know the density without fogging the film, you would always be better off doing so.

  However, the translation reveals that the theorem's critical constraint—"cost-free"—is almost never met in analog photography. The act of observation alters the chemical state (fog), the psychological state (panic/over-correction), and the artistic goal (aesthetic drift).

  These gaps do not indicate a flaw in your photographic framework. You correctly sense that looking can make things worse. The gaps indicate that the philosophical claim is an abstraction that strips away physical interference and human psychology. In the darkroom, information is never free; it is always paid for in silver, temperature, or attention. The rational agent in the theorem is a densitometer; the rational agent in the darkroom is a photographer who knows when *not* to look.
