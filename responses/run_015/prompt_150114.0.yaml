  Let's call it "The Insider Ratchet." It's a memetic process where selection pressure favors variations that increase social cost over those increasing utility, causing functional collapse. The definition requires three things: an original utility, a directional mutation toward complexity/obscurity, and a social reward for mastering the bloat. It differs from fashion because it doesn't cycle back to simplicity; once the ratchet clicks, you can't go back without losing status. It differs from standard costly signaling because the signal is the degradation of the tool itself, not just an accessory. A boundary case: if the extra steps actually improve the result slightly, it's just optimization. If they do nothing but exclude outsiders, the ratchet is engaged. This isolates the phenomenon from mere tradition.

