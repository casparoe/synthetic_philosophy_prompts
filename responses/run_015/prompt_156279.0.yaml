      *   *Probability:* Subjective probability (Ramsey-Carnap). Degrees of belief are measured by betting quotients (willingness to act under uncertainty).
      *   *Metaphysics:* Suspicious of nonsense. If a proposition has no empirical consequence or practical difference, it's meaningless (verificationist leanings, though distinct from logical positivism).
