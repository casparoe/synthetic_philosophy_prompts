answer: |-
  ### Brainstorming Core Tensions

  Before specifying desiderata, we must acknowledge the structural instability inherent in suffering-centered ethics. The primary tension lies between the **imperative to reduce suffering** and the **conditions required for valuing existence**. If suffering is the sole or primary disvalue, the logical endpoint is often the elimination of the sufferers (the "World Destruction" or "Extinctionist" conclusion). An adequate theory must navigate this without collapsing into nihilism or contradicting the intuition that existence can be net-positive for some beings.

  A second tension exists between **epistemic humility** and **moral urgency**. Suffering-focused ethics often demands radical intervention (e.g., in wild ecosystems), but our understanding of ecological cascades is limited. A theory must prescribe action without demanding impossible knowledge.

  A third tension arises in **population dynamics**. Reducing suffering per capita might increase population size (the "Intergenerational Shadow"), potentially increasing total suffering. Conversely, restricting population to minimize total suffering violates autonomy and asymmetry intuitions. An adequate framework must balance per-capita welfare against total welfare without triggering standard population ethics impossibility theorems.

  ***

  ### Desiderata for Adequate Suffering-Centered Ethics

  The following criteria establish the conditions for a plausible negative-utilitarian or suffering-focused axiology. Each item includes the motivating conceptual pressure and a flag indicating whether it is a logical constraint (**Non-Negotiable**) or a substantive ethical commitment (**Theoretical Preference**).

  #### 1. Case-Handling Requirements

  **1.1 The Asymmetry Constraint**
  *   **Requirement:** The framework must treat the creation of new lives with expected suffering as morally negative, while treating the creation of new lives with expected happiness as morally neutral (or significantly less weighty than suffering avoidance).
  *   **Motivating Case:** Parfit's Asymmetry. We feel obligated not to bring a miserable child into existence, but we do not feel obligated to bring a happy child into existence.
  *   **Status:** **[Non-Negotiable]** for suffering-centered views. Without this, the view collapses into classical utilitarianism.

  **1.2 The Wild-Animal Suffering (WAS) Coherence**
  *   **Requirement:** The theory must generate a determinate stance on natural suffering that distinguishes between moral obligation and feasible intervention. It cannot imply we are obligated to eliminate all nature nor that natural suffering is morally irrelevant.
  *   **Motivating Case:** The vast magnitude of suffering in nature versus the risk of ecological collapse from intervention.
  *   **Status:** **[Theoretical Preference]**. While the magnitude of WAS is factual, the obligation to intervene depends on risk-assessment constraints external to pure axiology. However, the theory must not rule out intervention *a priori*.

  **1.3 The Intergenerational Shadow Resolution**
  *   **Requirement:** The framework must provide a decision rule for cases where reducing present suffering increases future population size, thereby increasing the pool of potential future sufferers. It must avoid paralysis where no action is permissible because all actions risk future suffering expansion.
  *   **Motivating Case:** Long-termism vs. Immediate Relief. Preventing a pandemic saves lives now but may lead to overpopulation and greater aggregate suffering later.
  *   **Status:** **[Non-Negotiable]**. A theory that mandates inaction due to infinite regress of future consequences is practically useless.

  **1.4 The Anti-Extinctionist Constraint**
  *   **Requirement:** The theory must not entail that the instantaneous destruction of all sentient life is the optimal moral outcome, provided there exist lives with net-positive welfare (however slight).
  *   **Motivating Case:** The "World Destruction" objection. If suffering is the only disvalue, eliminating sufferers eliminates the disvalue. This contradicts the intuition that existence can be good for the existing.
  *   **Status:** **[Theoretical Preference]** (but high weight). Strict negative utilitarians may reject this, but for an *adequate* public-facing ethics, this is usually required to avoid reductio ad absurdum.

  #### 2. Distinction-Preservation Requirements

  **2.1 Intensity vs. Moral Urgency**
  *   **Requirement:** The framework must distinguish between the phenomenological intensity of suffering and the moral urgency of alleviating it. Mild suffering affecting billions must be comparable to severe suffering affecting few, without allowing the mild to trivially outweigh the severe.
  *   **Motivating Case:** The "Speck vs. Torture" case. Does a dust speck in the eye for everyone outweigh one person being tortured?
  *   **Status:** **[Non-Negotiable]**. Logical consistency in aggregation requires a defined relationship between intensity and count.

  **2.2 Direct Harm vs. Ecological Omission**
  *   **Requirement:** The theory must differentiate between causing suffering directly (commission) and allowing suffering to occur through natural processes (omission), without making the distinction absolute.
  *   **Motivating Case:** Killing a animal vs. letting it die of disease. Suffering-focused ethics often narrows this gap, but must preserve some distinction to avoid demandingness objections.
  *   **Status:** **[Theoretical Preference]**. Strict consequentialism often rejects this, but adequate practical ethics usually retains it.

  **2.3 Actual vs. Potential Sufferers**
  *   **Requirement:** The framework must assign different moral weights to existing beings versus merely possible beings. Rights or claims of actual sufferers must trump the potential welfare of non-existent beings.
  *   **Motivating Case:** Population policy. We should not prevent a happy person from existing to spare a potential person from suffering, but we should prevent a suffering person from existing.
  *   **Status:** **[Non-Negotiable]**. Required to satisfy the Asymmetry Constraint (1.1).

  #### 3. Consistency Constraints

  **3.1 Transitivity and Separability**
  *   **Requirement:** If Outcome A is better than B, and B is better than C, then A must be better than C. Additionally, the value of a sub-population should not depend on the existence of unrelated populations (Separability).
  *   **Motivating Case:** Basic axiological logic. Violating transitivity makes rational decision-making impossible.
  *   **Status:** **[Non-Negotiable]**. Logical prerequisite.

  **3.2 Stochastic Dominance in Uncertainty**
  *   **Requirement:** If Action A has a higher probability of reducing severe suffering than Action B across all plausible states of the world, A must be preferred.
  *   **Motivating Case:** Decision theory under uncertainty. We rarely know outcomes with certainty; the theory must guide action under risk.
  *   **Status:** **[Non-Negotiable]**. Required for practical applicability.

  **3.3 Non-Arbitrariness in Aggregation**
  *   **Requirement:** The method for aggregating suffering across individuals and time must not rely on arbitrary cut-offs unless justified by qualitative differences in experience.
  *   **Motivating Case:** Sorites Paradox. If we set a threshold for "morally relevant suffering," the boundary cannot be infinitesimally distinct.
  *   **Status:** **[Theoretical Preference]**. Threshold views struggle here, but must attempt to resolve it.

  #### 4. Jointly Unsatisfiable Pairs (Impossibility Results)

  An adequate theory must acknowledge that not all desiderata can be simultaneously satisfied. The following pairs represent known impossibility theorems in population ethics that suffering-centered views must navigate by sacrificing one member of the pair.

  **4.1 The Sadistic Conclusion vs. The Repugnant Conclusion**
  *   **Conflict:** Avoiding the "Sadistic Conclusion" (where adding lives with negative welfare is better than adding lives with positive welfare) often forces acceptance of the "Repugnant Conclusion" (where a massive population with lives barely worth living is better than a small population with excellent lives), or vice versa.
  *   **Reasoning:** Arrhenius's impossibility theorems demonstrate that no population ethic can satisfy a set of adequate conditions including Non-Elitism, Non-Sadism, and Dominance.
  *   **Resolution Requirement:** The theory must explicitly state which conclusion it accepts as the lesser evil.
  *   **Status:** **[Non-Negotiable]** to acknowledge the trade-off.

  **4.2 Critical-Level Utilitarianism vs. Asymmetry**
  *   **Conflict:** Setting a critical level of welfare above which lives count positively (to avoid the Repugnant Conclusion) often violates the Asymmetry Constraint (1.1) by implying we have a duty to create lives above that level.
  *   **Reasoning:** If a life above the critical level adds value, not creating it is a loss. This contradicts the intuition that creating happy lives is neutral.
  *   **Resolution Requirement:** The theory must decide whether to prioritize avoiding repugnant populations or maintaining the asymmetry of procreation.
  *   **Status:** **[Theoretical Preference]**.

  **4.3 Risk-Aversion vs. Expected Value Maximization**
  *   **Conflict:** Extreme suffering-focused views often demand risk-aversion regarding severe suffering (lexically vetoing any chance of torture), which violates standard Expected Value Maximization in decision theory.
  *   **Reasoning:** A lexical veto implies infinite disvalue, which breaks standard probabilistic calculus when probabilities are non-zero but infinitesimal.
  *   **Resolution Requirement:** The theory must adopt either a lexical structure (breaking expected value logic) or a weighted structure (risking trivialization of severe suffering).
  *   **Status:** **[Non-Negotiable]** to specify the choice.

  ***

  ### Evaluation of Frameworks

  Below is a scoring of three common suffering-centered frameworks against the desiderata above. Scores are qualitative assessments of fit (Pass, Fail, Strained).

  #### 1. Classic Negative Utilitarianism (Total Suffering Minimization)
  *   **Definition:** The right action minimizes the sum total of suffering, regardless of happiness.
  *   **Asymmetry (1.1):** **Pass.** Naturally handles the asymmetry; happy lives add zero value.
  *   **WAS Coherence (1.2):** **Strained.** Implies a massive obligation to intervene in nature, potentially risking ecological collapse to save animals.
  *   **Intergenerational Shadow (1.3):** **Fail.** Often implies reducing population to zero is optimal if any suffering exists, leading to paralysis or extinctionism.
  *   **Anti-Extinctionist (1.4):** **Fail.** Explicitly entails the "World Destruction" conclusion if it ends suffering.
  *   **Intensity vs. Urgency (2.1):** **Pass.** Aggregates linearly; severe suffering counts more than mild.
  *   **Consistency (3.1-3.3):** **Pass.** Logically consistent and transitive.
  *   **Impossibility Handling (4.1-4.3):** **Fail.** Accepts the Sadistic Conclusion (better to destroy world than allow mild suffering) which many find intuitively unacceptable.
  *   **Overall Verdict:** Logically robust but practically and intuitively catastrophic due to the extinctionist implication.

  #### 2. Lexical Suffering-Minimization
  *   **Definition:** Severe suffering lexically outweighs any amount of happiness or mild suffering. No trade-offs allowed above a certain severity threshold.
  *   **Asymmetry (1.1):** **Pass.** Creating happy lives cannot offset creating suffering lives.
  *   **WAS Coherence (1.2):** **Strained.** Prioritizes eliminating severe wild suffering above all else, potentially ignoring ecological stability constraints.
  *   **Intergenerational Shadow (1.3):** **Strained.** May prioritize preventing future severe suffering over present mild suffering, leading to complex long-term calculations.
  *   **Anti-Extinctionist (1.4):** **Pass (Conditional).** Allows existence if severe suffering is absent, avoiding the immediate "destroy world" command of Classic NU.
  *   **Intensity vs. Urgency (2.1):** **Pass.** Explicitly prioritizes intensity.
  *   **Consistency (3.1-3.3):** **Strained.** Lexical priorities can violate Stochastic Dominance (3.2) if infinitesimal risks of severe suffering veto high-probability benefits.
  *   **Impossibility Handling (4.1-4.3):** **Pass.** Avoids the Repugnant Conclusion by lexically vetoing lives with severe suffering, but risks "Lexical Rigidity" (ignoring large aggregates of mild suffering).
  *   **Overall Verdict:** Stronger than Classic NU on existence, but vulnerable to decision-theoretic inconsistencies regarding risk.

  #### 3. Threshold-Sensitive Suffering-Focused View
  *   **Definition:** Suffering below a certain intensity threshold counts less (or is discounted) relative to happiness; suffering above the threshold retains lexical or near-lexical priority.
  *   **Asymmetry (1.1):** **Pass.** Maintains asymmetry for lives above the suffering threshold.
  *   **WAS Coherence (1.2):** **Pass.** Allows prioritization of severe wild suffering while ignoring mild natural discomforts, reducing demandingness.
  *   **Intergenerational Shadow (1.3):** **Pass.** Allows trade-offs for mild suffering, facilitating population planning without paralysis.
  *   **Anti-Extinctionist (1.4):** **Pass.** Explicitly allows net-positive lives to outweigh sub-threshold suffering.
  *   **Intensity vs. Urgency (2.1):** **Pass.** Built into the definition.
  *   **Consistency (3.1-3.3):** **Fail.** Violates Non-Arbitrariness (3.3). Setting a precise threshold invites Sorites paradoxes (is 5.0 suffering relevant but 4.99 not?).
  *   **Impossibility Handling (4.1-4.3):** **Pass.** Navigates between Sadistic and Repugnant conclusions by discounting mild suffering.
  *   **Overall Verdict:** Most practically adequate, but theoretically vulnerable to boundary problems and accusations of arbitrariness.

  ### Summary Assessment
  Classic Negative Utilitarianism satisfies logical consistency but fails the crucial **Anti-Extinctionist Constraint** and **Intergenerational Shadow** requirement, rendering it inadequate for guiding real-world policy. The Lexical position improves on existence but struggles with **Decision Theory Consistency** regarding risk. The Threshold-Sensitive view best satisfies the **Case-Handling** and **Distinction** desiderata, making it the most robust candidate for an adequate suffering-centered ethics, provided it can resolve the **Non-Arbitrariness** constraint regarding where the threshold lies.
