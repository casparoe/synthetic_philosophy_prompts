      *   **Phenomenon:** "Conceptual slippage." The term "branch" is extended to cases (feature flags, lateral roots) that share few intrinsic properties with paradigmatic branches (wooden limbs, main code lines) but share a *relational architecture* (divergence, independent development, potential reintegration/termination).
      *   **Thesis to Argue:** This slippage is best explained by a *copycat-style analogical mechanism* (copying relational skeleton, discarding ontological commitments) *rather than* family-resemblance clustering or graded prototype structures.
      *   **Required Objections to Address:**
          1.  *Computational Intractability:* Structural copying requires full alignment across domains for every extension, which is too costly.
          2.  *Normative Constraints:* The mechanism doesn't explain why we *don't* apply the term to some things that fit the relational skeleton (e.g., a river delta might fit the structure, but is it a "branch"?).
          3.  *Disguised Essentialism:* The mechanism just shifts essentialism from entities to relations, failing to escape the core problem.
      *   **Constraints:** No bibliographies, reading lists, or citations. Avoid highly specialized theories dependent on recent literature. Draw on philosophy of language, cognitive science, or formal ontology generally.

  2.  **Initial Brainstorming & Thesis Formulation:**

      *   *Core Idea:* Family resemblance (Wittgenstein) suggests overlapping features. Prototypes (Rosch) suggest a central best example with radiating similarity. Both rely on *properties* of the things themselves. The prompt argues for *analogy* based on *structure*.
      *   *Copycat Model:* This refers to Hofstadter's idea (roughly) of fluid concepts where the "spirit" of the concept is mapped, not the literal details. In this context, it means mapping the *graph structure* (parent node -> child node -> potential merge/death) regardless of whether the nodes are code commits or plant cells.
      *   *Why Analogy over Prototype?* A feature flag isn't a "fuzzy" version of a tree branch. It's a distinct ontological category that *behaves* like a branch in a specific abstract sense. Prototypes struggle with cross-domain mapping (code vs. biology). Analogy thrives there.
      *   *Addressing Objection 1 (Intractability):* We don't align *everything*. We align only the relevant structural variables. It's heuristic, not exhaustive.
