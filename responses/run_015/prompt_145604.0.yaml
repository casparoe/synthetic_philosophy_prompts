prompt: |-
  Consider the microdomain of branching, as instantiated both in software version-control systems and in botanical taxonomy. Within each setting, the term is routinely extended to cover cases—such as a temporary feature flag in code or a lateral root structure in a plant—that share few intrinsic properties with paradigmatic branches, yet preserve a specific relational architecture: divergence from a singular origin, capacity for independent development, and potential for subsequent reintegration or termination.

  Please argue for the position that this form of conceptual slippage is best explained not by family-resemblance clustering or by graded prototype structures, but by a copycat-style analogical mechanism: a process that copies the relational skeleton of a source domain into a target domain while deliberately discarding its underlying ontological commitments. In developing your argument, address specifically the following three objections. First, that such structural copying is computationally intractable because it requires full alignment across domains for every conceptual extension. Second, that it fails to account for the normative constraints that prevent us from applying the term to certain divergences that nonetheless match the relational skeleton. Third, that the mechanism ultimately collapses into a disguised essentialism about relations rather than about entities. You may draw on considerations from philosophy of language, cognitive science, or formal ontology, but do not supply bibliographies, reading lists, or citations, and avoid appeals to highly specialized theories that depend on familiarity with specific recent literature.
reasoning: |-
