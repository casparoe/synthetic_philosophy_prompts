      *   **Addressing Objection 3 (Disguised Essentialism):** Is saying "it must have divergence" just essentialism about divergence? Counter: Essentialism implies necessary and sufficient conditions inherent to the universe. This is about *cognitive utility*. We impose the structure because it helps us manage complexity. It's pragmatic, not metaphysical.
      *   **Conclusion:** Summarize. Reiterate that analogical copying explains the cross-domain leap better than similarity-based models.

  4.  **Refining the Tone and Content:**

