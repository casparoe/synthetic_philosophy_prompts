answer: |-
  Look, you've picked a killer example, and I'll concede immediately that this is where the rubber meets the road for anyone teaching this stuff. But you're conflating "cooperation" with "niceness" or even "truthfulness." The Cooperative Principle isn't a moral contract; it's a cognitive assumption that the speaker is trying to make sense. When the lobby hears "full confidence," they don't think the spokesperson has opted out of communication entirely; they think he's *flouting* the maxim of Quality. He's saying something blatantly unsupported by the evidence everyone possesses. If they truly thought he was being uncooperative—that he was just making noise—they wouldn't bother deriving the "he's gone by Friday" meaning at all. They assume he's cooperating *enough* to want them to understand the real message. The derivation doesn't run backwards; it runs exactly as Grice drew it: The literal statement is defective given the shared background, so the hearer searches for a related proposition that preserves the assumption of cooperation. That search yields the resignation implication.

  On cancelability, you're right that adding "and I mean it" lands flat, but don't mistake pragmatic overwhelming force for semantic entailment. The reason it doesn't cancel isn't that the mechanism is broken, but that the context is so saturated with counter-evidence that the cancellation attempt is itself interpreted as part of the code—another layer of irony. But imagine the scandal breaks on a Tuesday, and by Wednesday the PM says, "I have confidence, and unlike the usual Westminster game, I actually mean it, here's the data." It *could* work. The fact that it doesn't work in the death throes of a ministry just shows how particularized implicatures can harden into convention over time. That doesn't shrink implicature to trivial cases; it just shows how efficient language users are at routinizing the calculation. You're describing a fossilized implicature, not a failure of the theory.
