      *   *Key Terminology:* Stationarity, Reference Class Problem, Convexity, Epistemic Humility, Causal Mechanisms.
      *   *Check:* Did I answer the specific question about "empty reference classes"? Yes, need to emphasize the difference between "never happened" and "conditions prevented it."
      *   *Check:* Did I address "Reference-Class Engineering"? Yes, frame it as altering the payoff structure rather than just the probability estimate.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the short sellers *did* use Inside View?
      *   *Correction:* No, Michael Burry reading loan tapes is aggregating data to find a statistical anomaly in a specific cohort. That is Outside View relative to the individual loan, Inside View relative to the macro economy. The user's "continuum" theory is stronger. I will support that.
      *   *Nuance:* Make sure to distinguish between the *Rating Agencies* (who used OV on bad data) and the *Quants* (who used IV on correlation). The friend conflates them.
      *   *Emphasis:* Highlight that "Buying Insurance" is a decision under uncertainty, distinct from "Predicting a Crash." This addresses the user's second constraint.

  6.  **Final Review against constraints:**
