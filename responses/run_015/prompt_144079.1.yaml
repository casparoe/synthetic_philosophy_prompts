      *   **Part 6: Reference-Class Engineering:**
          *   *Definition:* Changing the game to change the stats.
          *   *Subprime:*
              *   *Banks:* Tried to engineer safety via diversification (failed because correlation increased).
              *   *Short Sellers:* Engineered an option payoff. They didn't need to be right about *when*, just *that*.
          *   *Is it IV or OV?* It's IV in execution, OV in justification. It's a "Third Way": Structural Arbitrage.

      *   **Part 7: The Verdict & Advice for 2006:**
          *   *Verdict:* Subprime is not a vindication of IV. It is a vindication of *Reference Class Selection* under Non-Stationarity. It shows the danger of using OV on a broken regime.
          *   *Advice to 2006 Risk Manager:*
              1.  Acknowledge the "National Housing" base rate is broken (regime change).
              2.  Construct the "2005 Vintage" base rate (user's point).
              3.  Recognize model risk (Gaussian Copula failure).
              4.  Decision: Reduce exposure or buy tail protection (Reference Class Engineering). Don't just forecast; manage convexity.

  4.  **Refining and Polishing:**

