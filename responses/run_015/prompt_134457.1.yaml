answer: |-
  This is a really sharp observation. You've hit on a tension that often gets glossed over in introductory readings of *Principia Ethica*.

  The short answer is: **No, it doesn't break the parallel, but only because Moore's view on beauty is more mentalistic than your premise assumes.**

  If you think Moore believes a sunset has value sitting there unperceived, then yes, your objection would crush the parallel. But Moore explicitly argues that **unperceived beauty has no value.** Once you correct that premise, the structural logic of the "organic whole" holds for both friendship and beauty, though the *complexity* of the parts differs.

  Here is the breakdown of why Moore can maintain the parallel without smuggling in awareness, and where your "value modularism" actually loses out.

  ### 1. The Beauty Case: Value Requires a Perceiver
  Your premise is: *"Sunsets don't know they're pretty."*
  Moore's response: *"That doesn't matter, because the sunset needs **you** to know it's pretty."*

  In *Principia Ethica* (§113), Moore makes the famous claim that a beautiful world existing with no conscious being to appreciate it would have **no intrinsic value**. For Moore, the "organic whole" of beauty is not just `Beautiful Object`. It is `Consciousness of Beautiful Object`.

  *   **Part A:** The beautiful object (sunset).
  *   **Part B:** The consciousness of that object (your mind).
  *   **The Whole:** The experience of beauty.

  The value emerges from the *relation* (intentionality) between the mind and the object. The sunset doesn't need awareness, but the *value situation* absolutely requires a mind. So, beauty is already dependent on "intentional mental states."

  ### 2. The Friendship Case: Does it Require Mutual Recognition?
  This is where your question gets tricky. Does the "extra value" in friendship require *mutual* recognition (I know you, you know me, we know we know), or just one-sided affection?

  Moore discusses "personal affection" and "the pleasures of human intercourse." He generally implies that the *greatest* goods involve reciprocity, but the fundamental organic unit is still `Consciousness of Another Mind`.

  *   **Part A:** The friend (who is themselves a consciousness).
  *   **Part B:** Your consciousness of them (affection/love).
  *   **The Whole:** The relationship/friendship.

  If Moore required *mutual* recognition to generate the value, he would be adding a third part: `Friend's Consciousness of You`.
  *   **Scenario 1 (One-sided):** I love a person. (Value exists, but is it "friendship"? Moore might call it "affection.")
  *   **Scenario 2 (Mutual):** I love you, and you love me. (This is a *greater* organic whole.)

  Crucially, Moore doesn't need mutual recognition to make the *logic* of organic unity work. He only needs **your** consciousness of the friend to create the value. The fact that the *object* of your affection happens to be another mind (unlike the sunset) makes the object more complex, but it doesn't change the formula.

  **The Parallel Holds Because:**
  *   **Beauty:** Mind + Non-Mental Object = Value > Sum.
  *   **Friendship:** Mind + Mental Object = Value > Sum.

  In both cases, the value is not in the parts (the rock, the sunset, the friend, or your brain state in isolation); the value is in the **intentional relation**.

  ### 3. Where "Value Modularism" Fails
  This is the strongest point for Moore against your "value modularism."

  **Modularism says:** `Value(Friendship) = Value(My Happiness) + Value(Your Happiness).`
  **Moore says:** `Value(Friendship) > Value(My Happiness) + Value(Your Happiness).`

  If modularism were true, a world where you are happy and I am happy in separate rooms would be just as good as a world where we are happy *together*. Moore argues this is absurd. The *connection* itself generates value.

  Your worry is that friendship generates value through *intersubjectivity* (mind-to-mind), while beauty generates value through *subjectivity* (mind-to-object). Does this difference break the "organic" claim?

  **No.** The definition of an organic whole is simply that the value of the whole is not the sum of the values of the parts.
  *   In beauty, the "parts" are the physical object and the mental state. Neither has much value alone (for Moore).
  *   In friendship, the "parts" are the other person and your mental state.

  The fact that the "object" in friendship is itself a valuer doesn't break the organic unity; it just means the "object" part of the equation is richer. Moore can argue that the *awareness* in friendship is part of the **object** being valued, not a condition of the **valuation mechanism**.

  *   **Beauty:** I value `Sunset`. (Sunset has no awareness).
  *   **Friendship:** I value `Your Love`. (Your love *includes* awareness).

  In both cases, *I* am the one doing the valuing via my consciousness. Moore doesn't need the sunset to be aware; he doesn't even strictly need the friend to be aware for *some* value to exist (unrequited love still has value for Moore, just less than requited), but for the specific good of "friendship," the object is "a reciprocal mind."

  ### 4. The Verdict: No Smuggling Required
  You asked if Moore is "smuggling in awareness" to make the parallel work.

  He isn't smuggling it; he's **front-loading it**. Moore is an idealist of sorts here. He believes *all* intrinsic value requires consciousness. There is no value "out there" in the universe independent of a mind.

  *   **For Beauty:** The mind must exist to perceive it.
  *   **For Friendship:** The mind must exist to perceive it (and ideally, the object perceived is also a mind).

  So, the parallel remains intact. The "organic unity" is the **intentional state of appreciation**.
  *   If you remove the mind from the sunset, value goes to zero.
  *   If you remove the mind from the friendship (e.g., you die, or you stop caring), value goes to zero.

  **Conclusion:**
  Your "value modularism" is actually a form of **value atomism**, which Moore explicitly wrote *Principia Ethica* to refute. Your objection about mutual recognition highlights that friendship is a *more complex* organic whole than beauty, but it doesn't break the structural parallel.

  Moore's point is that **relations have value.** Whether that relation is `Mind -> Sunset` or `Mind -> Mind`, the value emerges from the combination, not the isolated parts. He doesn't need the sunset to know it's pretty; he just needs *you* to know it. And he doesn't necessarily need your friend to know you love them for *some* value to exist, but for the specific good of "friendship," the object is defined by that reciprocity. In both cases, the "extra value" comes from the **unity of consciousness with its object**, not the sum of the components.

  So, you can keep your critique of modularism (it's a strong one), but Moore's parallel survives because his aesthetics are already mentalistic.
