      *   **Analyze Friendship:** Moore's "personal affection." Is reciprocity necessary for the *organic whole*? It creates a *better* whole, but the basic unit is "consciousness of another."
      *   **Address the "Smuggling":** Moore isn't smuggling; he's explicit that value is mind-dependent.
