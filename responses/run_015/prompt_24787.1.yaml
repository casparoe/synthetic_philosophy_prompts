answer: |-
  Mark is a shift supervisor at a water treatment plant eligible for a bonus only if a system reset follows a pressure spike. The system is currently stable. Wanting the bonus, Mark manually turns a control dial to increase pressure beyond the safety limit, knowing this will cause a pipe to burst. The pipe bursts, flooding the basement and causing $50,000 in damage.

  Mark is a shift supervisor at a water treatment plant eligible for a bonus only if a system reset follows a pressure spike. A sudden pump surge is currently increasing pressure beyond the safety limit and will cause a pipe to burst in ten seconds. Wanting the bonus, Mark could turn the same control dial to reduce pressure and prevent the burst, but he does nothing. The pipe bursts, flooding the basement and causing $50,000 in damage.

  **Analysis**

  The single feature doing the persuasive work is the **causal origin of the threat**. In the first case, the agent initiates the causal chain leading to harm; in the second, the agent merely fails to interrupt a causal chain already in motion due to external factors. This isolates the doing/allowing distinction because all other variables—intent (securing the bonus), knowledge (certainty of the burst), relationship (duty of care), and outcome ($50,000 loss)—are held constant.

  A variant that removes this feature collapses the judgment gap. If we modify the second scenario to stipulate that Mark himself rigged the pump to surge an hour prior, intending to fix it but then deciding to let it burst for the bonus, the moral asymmetry diminishes significantly. In this variant, Mark is the causal origin of the threat in both cases; lay judgment typically converges on treating him as equally blameworthy because the "allowing" is now seen as part of a broader course of harmful agency rather than a passive omission.

  A consequentialist would diagnose this intuition pump as misleading because it exploits a cognitive heuristic rather than revealing a moral truth. They would argue that the visceral aversion to "making something happen" versus "letting it happen" is a status quo bias with no normative weight. Since the state of the world (a flooded basement), the agent's mental state (malicious intent), and the counterfactual outcomes (what would have happened had they acted otherwise) are identical, the consequentialist holds that the moral evaluation must be identical. The pump misleads by triggering an emotional response to physical causation that obscures the only factors that actually determine moral worth: the consequences produced and the intentions held.
