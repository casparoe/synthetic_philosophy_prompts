  OFFICE OF THE CLERK OF THE HOUSE
  MEMORANDUM
  TO: The Four Members
  FROM: The Clerk
  DATE: 14 November
  SUBJECT: Disposition of Loft Trunk (Constitutional Impasse)

  Pursuant to Clause 5 (Tidiness) of the House Constitution (adopted Winter Before Last following the Thermostat Dispute), the Office of the Clerk is required to certify a consistent ordering of House preferences regarding the Trunk of Letters discovered in October. The trunk is the property of Member I, who is not a neutral party, necessitating strict adherence to procedural instruments. Following the submission of preference schedules by all Members, it has been determined that the aggregation machinery prescribed by Clauses 3 (Unanimity) and 4 (Minimum Liberty) has produced a cyclic relation. The House prefers Option A to Option B, Option B to Option C, and Option C to Option A. This violates Clause 5. The Office cannot certify a will that does not exist. This Memorandum records the derivation and considers remedies pursuant to the Dishwasher Ruling (Tenancy 3).

  **Annex A: Register of Protected Pairs and Rankings**
  1. **Member I (Owner).** Protected Pair: (Burn, Read). Full Ranking: Archive > Burn > Read > Leave. Gloss: Sovereignty over personal effects includes destruction.
  2. **Member II (Meddler).** Protected Pair: (Read, Archive). Full Ranking: Read > Archive > Leave > Burn. Gloss: Member I's anticipated distress upon hearing letters constitutes a household hazard.
  3. **Member III.** Protected Pair: (Leave, Read). Full Ranking: Archive > Leave > Read > Burn. Gloss: Historical preservation outweighs inertia.
  4. **Member IV.** Protected Pair: (Leave, Archive). Full Ranking: Leave > Archive > Read > Burn. Gloss: [Unused Pair]. This pair has never once been exercised in any division and probably never will be.

  **Annex B: Derivation of Preference Cycle**
  The following edges constitute a cycle of length three, certified under the Constitution:
  1. **Burn > Read.** Generated by Clause 4 (Minimum Liberty). Member I is decisive over (Burn, Read). Member I prefers Burn to Read. This edge holds whatever the other three Members think.
  2. **Read > Archive.** Generated by Clause 4 (Minimum Liberty). Member II is decisive over (Read, Archive). Member II prefers Read to Archive. This edge holds whatever the other three Members think.
  3. **Archive > Burn.** Generated by Clause 3 (Unanimity). All four Members rank Archive above Burn (see Annex A). Member I: Archive > Burn. Member II: Archive > Burn. Member III: Archive > Burn. Member IV: Archive > Burn. Therefore, the House prefers Archive to Burn.
  **Result:** Burn > Read > Archive > Burn. Clause 5 (Tidiness) is violated. The House has no will.

  **Consideration of Remedies**
  Four remedies have been costed and evaluated against Constitutional integrity.
  1. **Agenda Restriction.** Remove 'Burn' from the motion. This breaks the cycle by eliminating the Pareto edge. However, it precludes a valid option from consideration, effectively vetoing Member I's protected sphere without invoking Clause 4.
  2. **Non-Interference Amendment.** Rule out of order any preference concerning another Member's protected sphere. This invalidates Member II's gloss regarding Member I's distress. However, analysis shows it protects Members only in the spheres nobody cares about, leaving meddlesome preferences on public options intact.
  3. **Weakening Clause 3.** Replace Unanimity with a Majority rule. This resolves the cycle by allowing the Pareto edge to fail. However, it lets the House adopt an option that every single Member ranks below an available alternative, violating the spirit of the Thermostat Accord.
  4. **Assigning Control.** Stop representing rights as preferences to be aggregated. Simply assign who decides. This leaves the House with no preference to certify and this Office with nothing to do. It is structurally unsound and reduces the Clerk to a mere notary.
  Note: Giving each Member two protected pairs was dismissed as exacerbating the density of rights without resolving the cycle.

  **Recommendation**
  The Clerk provisionally adopts Agenda Restriction. The motion shall be limited to (Read, Archive, Leave).¹ The matter of the Trunk is thus treated as a standard division. The question of Constitutional reform is referred to a Subcommittee that will report in due course.

  ¹ This is tantamount to declaring the trunk not a House matter at all, which is what everyone had assumed Clause 4 was for.
