      *   *The Third Option:* Introduce the "Structuralist" view (Christopher Clark's *The Sleepwalkers*). It wasn't just Germany; it was a system failure. Also, distinguish *Political Responsibility* (forward-looking) from *Moral Guilt* (backward-looking).
