          *   *Philosophy/Law:* R1 uses a standard realist view of international relations (States act). R2 makes a category error. States *are* treated as legal persons in international law (UN Charter, Geneva Conventions), even if domestic corporate law differs. R2 is weak here legally, though philosophically distinct.
          *   *Ethics:* R1 argues moral responsibility shouldn't hinge on legal technicalities. Strong moral intuition.

      *   *Move 3:* R2 argues war aims evolved (weren't a masterplan). R1 argues pushing forward despite chances to back down proves willingness.
