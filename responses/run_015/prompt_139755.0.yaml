  9.  **Final Polish:** Ensure I answer the specific prompt requirements (rank, collapse, muddled, leaving out, trade-offs, evidence triggers).

      *Key Insight:* The "Presumption of Independence" is often a "Maximum Entropy" move. The risk is "Hidden Constraints." The output should be a "Constraint Hunting Protocol."

      *Re-evaluating (5):* Is it truly useless? If the risk analyst treats it as a convention and the philosopher treats it as a credal state, they might talk past each other. But for a *checklist*, it doesn't matter. I'll advise minimizing it.

      *Re-evaluating (7):* This isn't just a question; it's the *methodology*. The project *is* the attempt to transfer. So it shouldn't be a separate work package, it should be the *lens* for all work packages.

      *Re-evaluating (3):* "Dozens" is too many. 5 deep cases (3 number theory, 2 risk) is better than 30 shallow ones.

