      *   Q2: Do ordinary moral judgments track this distinction even when outcomes/intentions are identical? (Prob: 0.8 - people do feel differently).
      *   Q3: Are those ordinary judgments rational/justified or cognitive bias? (Prob: 0.3 - likely bias).
      *   Q4: Does the distinction survive in legal liability under these symmetric conditions? (Prob: 0.4 - law often cares about duty of care which depends on defaults).
      *   Q5: Is there a non-consequentialist principle (e.g., rights) that hinges specifically on this default switch? (Prob: 0.3).
      *   Q6: If we randomized the defaults, would the moral obligation randomize? (Prob: 0.1 - morality shouldn't randomize based on switch wiring).

      *   *Wait, I need to structure this so the probabilities contribute to the final number.* The final number is the credence that the distinction *is* doing work. So high prob on "it's arbitrary" means low credence in the distinction.
      *   Let's align the questions to support the final credence (0.25).
      *   1. Probability that the machine's default state constitutes a genuine moral baseline rather than an arbitrary engineering choice. (0.2)
      *   2. Probability that intuitive moral differences here reflect rational principle rather than cognitive bias (omission bias). (0.3)
      *   3. Probability that legal systems would treat these cases differently for reasons beyond administrative convenience. (0.4)
      *   4. Probability that a rights-based framework assigns different duties based solely on this switch wiring. (0.3)
      *   5. Probability that swapping the defaults would legitimately swap the moral verdict without changing anything else. (0.1)
      *   6. Probability that there is any metaphysical difference in "causation" between pressing an open circuit vs. closing a closed one. (0.2)

  4.  **Drafting "How it adds up":**
      *   I need to explain how I derived 0.25 from those sub-probs.
      *   Basically, while people *feel* a difference (high intuition), the justification for that difference collapses when the default is shown to be arbitrary (low moral baseline prob). The low probability that morality should depend on wiring (0.1) drags the overall credence down significantly, outweighing the legal/practical distinctions.

  5.  **Drafting "What would move you most":**
