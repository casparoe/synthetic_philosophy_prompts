answer: |-
  ### Your number
  I assign a 0.25 probability that the doing/allowing distinction is doing independent moral work here, where "not doing independent work" means the moral difference is fully explainable by arbitrary baselines, cognitive bias, or outcome equivalence rather than intrinsic normative force.

  ### The breakdown
  1.  **Probability that the machine's default state is a moral fact rather than an arbitrary engineering choice:** 0.2 — Wiring configurations are human conventions, not features of the moral landscape.
  2.  **Probability that intuitive differences in these cases reflect rational principle rather than omission bias:** 0.3 — Psychological literature suggests this asymmetry is largely a cognitive heuristic, not ethical reasoning.
  3.  **Probability that legal systems differentiate these cases for reasons beyond administrative convenience:** 0.4 — Law often tracks defaults for clarity, but this doesn't guarantee underlying moral truth.
  4.  **Probability that a rights-based framework assigns different duties based solely on this switch wiring:** 0.3 — Rights usually attach to persons, not the mechanical status quo of life-support devices.
  5.  **Probability that morality should legitimately flip if we secretly swapped the default wiring overnight:** 0.1 — Moral obligations shouldn't randomize based on hidden mechanical settings.
  6.  **Probability that there is a metaphysical difference in causation between breaking vs. completing a circuit:** 0.2 — Physically, both interventions alter the state of the world equally to produce the result.

  ### How it adds up
  I weighted the high probability of psychological bias and the arbitrariness of the defaults heavily against the distinction, as these undermine the claim of independent moral force. While legal and intuitive data suggest people *treat* the cases differently, the low probability that this treatment is justified drags the overall credence down. The final number reflects the slight possibility that baseline expectations carry some normative weight regarding duties of care, despite the symmetry.

  ### What would move you most
  I am least sure about the rights-based framework term, as a robust theory of negative rights could argue that interfering with an existing process is inherently distinct from failing to start one. Evidence showing that moral obligations shift reliably with justified baselines (rather than arbitrary ones) would shift my number upward. I suspect you and your friend disagree on whether the "default" is a morally neutral description of reality or a normatively loaded boundary that defines your agency.
