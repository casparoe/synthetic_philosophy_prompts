          *   *Counter:* Intentionalism/Representationalism says the "what it's like" is determined by what it represents. If representation is functional, inversion is impossible without functional change.

      *   **Rejecting (3) [Epistemic Inaccessibility]:**
          *   *Move:* Argue that introspection *does* provide non-relational evidence.
          *   *Cost:* You have to explain how introspection works if it doesn't rely on functional/relational mechanisms. This is very hard. If the brain is swapped and memories are swapped, what mechanism accesses the "raw" quale?
          *   *Why it looked safe:* If the swap is truly "sealed" (downstream adjustments), how could the subject know?
          *   *Counter:* Maybe the "sealing" is impossible. Maybe the quale *is* the access.

      *   **Rejecting (4) [Verificationism/Ontology]:**
          *   *Move:* Accept that there are facts beyond evidence (Realism).
          *   *Cost:* You accept metaphysical mysteries. You become a Property Dualist or Non-Reductive Physicalist. You accept that science cannot explain everything. You risk making philosophy unmoored from inquiry.
          *   *Why it looked safe:* It appeals to scientific rigor (no evidence = no fact).
          *   *Counter:* This is the user's preferred spot to cut ("thinnest plank"). But rejecting it leads to the "Hard Problem."

      *   **Rejecting (5)/(6) [The Slide to Eliminativism]:**
          *   *Move:* Distinguish between *specific* qualia facts (red vs. green) and *general* phenomenal facts (pain vs. no pain).
          *   *Cost:* You need a principled reason why inversion is indeterminate but existence is not. This is tricky. If the argument works for red/green, why not on/off?
          *   *Why it looked safe:* It seems like a logical extension of (4).

  4.  **Address the User's Preference:**
      *   The user wants to keep (1) and (2) (Qualia are intrinsic and invertible) but rejects (4) (Verificationism).
      *   *Implication:* This leads to **Non-Reductive Physicalism** or **Property Dualism**. It accepts the "Hard Problem."
      *   *The specific worry:* The user worries this leads to (6) (Zombies/Illusionism).
      *   *Correction:* Rejecting (4) actually *saves* you from (6). If you say "There *is* a fact of the matter even without evidence," then there *is* a fact about whether you have a headache.
