      *   *(4) Verificationism/Ontological Deflation:* If no evidence can adjudicate, there is no fact of the matter.
      *   *(5) Generalization:* No fact of the matter about *any* specific quale.
      *   *(6) Eliminativism/Illusionism:* No fact of the matter about *whether* there is experience at all (Zombies are possible/indistinguishable).

  3.  **Evaluate Each Step for Rejection:**

      *   **Rejecting (1) [Definition]:**
          *   *Move:* Redefine qualia as functional/relational.
          *   *Cost:* You stop talking about "qualia" in the traditional philosophical sense (Nagel/Block/Chalmers). You become a Functionalist. You lose the "hard problem" intuition.
          *   *Why it looked safe:* It matches the standard philosophical definition of qualia (intrinsic, non-representational).

      *   **Rejecting (2) [Possibility of Sealed Inversion]:**
