      *   **Refining the "Cost of Rejecting 4":**
          *   If you keep 1 & 2, you must reject 4 to avoid 6.
          *   Cost: You accept **Epiphenomenalism** or **Brute Psychophysical Laws**. If qualia don't affect function (sealed), they do no causal work. Why do they exist? This is the "explanatory gap."
          *   Also, it makes consciousness private in a very strong sense (Solipsism risk).

      *   **Refining the "Cost of Rejecting 2":**
          *   This is the **Representationalist** move (Tye, Dretske).
