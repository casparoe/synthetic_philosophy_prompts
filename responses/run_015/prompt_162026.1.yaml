          *   If (4) is rejected: "No evidence" does *not* imply "No fact."
          *   Therefore, (5) does not follow.
          *   Therefore, (6) does not follow.
          *   So, rejecting (4) is the standard Realist move. It saves the reality of qualia but makes them scientifically occult.

  5.  **Drafting the Response:**

      *   **Tone:** Respectful, academic but accessible (senior high school level), encouraging critical thinking.
      *   **Structure:**
