      Yes, they want to reject (4).
      *My job:* Tell them the cost of rejecting (4). And also tell them the cost of the other options so they know what they are avoiding.

      *Crucial nuance:* The user worries that 1 & 2 *lead* to 6. I need to clarify that 1 & 2 lead to 6 *only if* 4 is accepted. If 4 is rejected, 6 is blocked. But rejecting 4 has its own costs (Occult properties).

