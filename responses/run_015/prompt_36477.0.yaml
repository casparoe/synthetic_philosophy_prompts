answer: |-
  Vera (1) correctly links causal ascription to predictive utility but errs by equating model success with mechanical pushing. Tomas (2) rightly invokes physical closure but wrongly infers that micro-sufficiency excludes macro-efficacy (the exclusion problem). Vera (3) offers the strongest analogy: coarse-graining (temperature) validates higher-level ontology without dualism. Tomas (4) counters that interventions route through simmballs; he is physically correct but philosophically narrow, ignoring that macro-interventions are defined by outcomes, not implementation. Vera (5) correctly identifies the stakes: Tomas's view entails eliminativism about biology and psychology. Tomas (6) distinguishes explanation from production but begs the question by defining "production" exclusively at the fundamental level.

  Both parties miss that causation is not energy transfer but counterfactual dependence. They treat "pushing" as the paradigm of causation, biasing the debate toward physics. Furthermore, both overlook that functional organization acts as a constraint. The system is structured so that micro-events align with macro-patterns; the symbols do not shove the balls, they channel them.

  **Adjudication:**
  Tomas wins the linguistic battle; Vera wins the scientific war.

  **Stand:**
  In the careenium, **the symbols do not push the substrate around.**
  "Pushing" implies force exchange, which belongs strictly to simmballs obeying Newton. Symbols lack mass and momentum; attributing force to them is a category error. However, Vera is correct that the chess state is causally efficacious. The chess position causes the exit because the system is organized such that the exit counterfactually depends on the position. If the board state were different, the exit would differ, regardless of the specific simmballs involved.
  Thus, symbols do not push; they constrain. The functional organization ensures micro-events yield macro-patterns. Tomas saves the physics; Vera saves the science. Since philosophy of mind requires mental states to be efficacious, Vera's conclusion must be accepted, even if her verb "push" is rejected. The symbols determine the exits. That is causation enough. To deny this is to deny the reality of software, biology, and mind. The symbols are real causes, but they operate via constraint, not force.
