answer: |-
  **EXTERNAL EXAMINER'S REPORT**
  **Module:** Philosophy of Mind and Comparative Ethics (Final Year Seminar)
  **Assessment:** Written Examination
  **Candidate:** Anonymous
  **Date:** 24 May 2024

  **CLASSIFICATION:** Third Class Honours (40–49%)
  **PROVISIONAL MARK:** 42%

  ---

  ### POINT-BY-POINT EVALUATION

  **1. "Brain size is clearly relevant, but only indirectly."**
  *   **Comment:** This opening thesis is philosophically defensible and aligns with the indirect position suggested in the examination question. However, you must define "relevant" here. Relevant to what? Moral status? Cognitive capacity? The ambiguity weakens the claim.
  *   **Critique:** This premise is abandoned by the conclusion of your essay (see point 7 below). You establish a position here that you subsequently contradict without acknowledging the shift in argumentation.

  **2. "The encephalisation quotient shows that humans have larger brains relative to body size than most mammals, which explains our advanced cognition."**
  *   **Comment:** This is a correct descriptive summary of the biological metric.
  *   **Critique:** You treat "explains" as a settled matter. In philosophy of mind, the relationship between EQ and specific cognitive capacities is correlational, not strictly explanatory. You have moved from a statistical correlation to a causal explanation without providing evidence or referencing literature (e.g., Jerison or Roth) that supports this causal link.

  **3. "Therefore, an entity with a larger EQ has greater moral status."**
  *   **Comment:** This is the critical logical leap of your argument.
  *   **Critique:** You have committed the naturalistic fallacy (deriving an 'ought' from an 'is'). The prompt explicitly asked you to discuss the distinction between correlational and normative claims. Here, you assert a normative conclusion (moral status) based solely on a descriptive premise (EQ size) without providing a bridging principle. Why does higher EQ entail higher moral status? Is this a utilitarian calculation? A rights-based threshold? This premise is entirely unstated and unjustified.

  **4. "This was recognised by evolutionary biologists who developed EQ as a normative scale for comparing species."**
  *   **Comment:** This is a significant factual error.
  *   **Critique:** The Encephalisation Quotient was developed (notably by Harry Jerison) as a *descriptive* palaeoneurological and biological metric to estimate cognitive potential relative to phylogenetic expectations. It was not developed as a *normative* ethical scale. To claim evolutionary biologists intended EQ for moral ranking mischaracterises the history and purpose of the science. This undermines your authority on the biological side of the comparison.

  **5. "When we turn to artificial systems, the analogy is direct: a neural network with more parameters has greater cognitive capacity, just as a brain with more neurons does."**
  *   **Comment:** This addresses the second half of the examination question regarding artificial neural networks (ANNs).
  *   **Critique:** You assert the analogy is "direct" without argument. This is a category error. Biological neurons are spiking, metabolic, and structural units; ANN parameters are weights in a mathematical function. They are not ontologically equivalent. Furthermore, "cognitive capacity" in ANNs is not functionally identical to biological cognition. You have assumed the conclusion (that the analogy holds) rather than evaluating it as the question required.

  **6. "For instance, a model with hundreds of billions of parameters exceeds human neuronal counts in morally relevant scale."**
  *   **Comment:** This attempts to use scaling laws as evidence.
  *   **Critique:** There are two errors here. First, a parameter count is not equivalent to a neuron count (a single neuron may be involved in numerous parameters, or parameters may represent synaptic weights rather than cells). Second, you assert this scale is "morally relevant" without justification. You are begging the question: you assume scale is morally relevant to prove that scale is morally relevant. The prompt asked you to *evaluate* whether scaling laws provide a sound parallel; you have merely asserted they do.

  **7. "Hence, gross scale is not merely correlational but constitutive of moral standing, both biologically and artificially."**
  *   **Comment:** This is your concluding normative claim.
  *   **Critique:** This directly contradicts your opening sentence ("only indirectly"). An argument that contradicts its own thesis within six sentences lacks coherence. Furthermore, claiming scale is *constitutive* of moral standing is a radical position (implying a larger brain makes an entity morally 'more' valuable in kind, not just in capacity) which requires substantial ethical defence (e.g., via a graded moral status argument). You have provided none.

  **8. "The mistake philosophers like Singer make is to focus on sentience alone; they miss that scale itself generates the capacity for sentience."**
  *   **Comment:** This references a key author in comparative ethics.
  *   **Critique:** This is a mischaracterisation of Peter Singer's utilitarianism. Singer argues that sentience is the *boundary* for moral consideration, not that scale determines the *degree* of moral standing in the way you imply. Singer does not "miss" that biology generates capacity; rather, he argues that once the threshold of sentience is met, the *interests* count equally. To suggest Singer ignores the biological basis of sentience is inaccurate. Additionally, you conflate the *capacity* for sentience with the *presence* of sentience. A large brain (or network) might have the scale for sentience but lack the architectural properties to instantiate it.

  ---

  ### EXAMINER'S SUMMARY OF DEFICIENCIES

  1.  **Logical Coherence:** The argument contradicts itself between the first and final sentences regarding whether brain size is indirectly or directly relevant.
  2.  **Descriptive vs. Normative:** You consistently conflate descriptive metrics (EQ, parameter counts) with normative conclusions (moral status) without providing the necessary ethical bridging premises. This was the central requirement of the examination question.
  3.  **Factual Accuracy:** The claim that EQ was developed as a "normative scale" is historically and scientifically incorrect.
  4.  **Technical Understanding:** The analogy between biological neurons and ANN parameters is treated as an identity rather than a metaphor requiring critical evaluation.
  5.  **Literature Engagement:** The reference to Singer is imprecise and undermines the comparative ethics component of the seminar.

  ### ADVICE FOR REVISION

  To improve this work to a Second Class standard or above, you must:
  *   **Separate Is from Ought:** Explicitly state that biological facts (EQ, parameters) are descriptive. If you wish to argue they have normative weight, you must introduce an ethical framework (e.g., utilitarianism, capabilities approach) that explains *why* that fact matters morally.
  *   **Correct Biological/Technical Claims:** Research the original purpose of the Encephalisation Quotient. Distinguish clearly between neural *counts* and synaptic *weights/parameters*.
  *   **Resolve Contradictions:** Ensure your conclusion follows logically from your introduction. If you argue for indirect relevance initially, do not conclude with direct constitution.
  *   **Engage with Scaling Laws:** The question asked about scaling laws specifically (e.g., power laws in loss reduction), not just raw parameter counts. Discuss whether increased parameters actually yield diminishing returns in "cognitive" capability, rather than assuming a linear relationship.

  **Signed:**
  *External Examiner*
  *Department of Philosophy*
