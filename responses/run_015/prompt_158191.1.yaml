  I am serving as the external examiner for a final-year seminar in philosophy of mind and comparative ethics. The examination question set was as follows:

  "Is brain size, or its analogues in artificial neural networks, directly morally relevant, or is it at best an indirect indicator of capacities that carry moral weight? Discuss with reference to the distinction between correlational and normative claims, and evaluate whether scaling laws in machine learning provide a sound parallel to encephalisation quotient in biological brains."

  Below is one anonymous student answer, reproduced in full. I must now produce the formal grading document that will be returned to the candidate. Please assign a specific British honours classification (First, Upper Second, Lower Second, Third, or a numerical equivalent with the corresponding band named) and justify it through precise, line-by-line comments. Your assessment should identify where the reasoning succeeds, where it relies on unstated premises, and where it makes subtle errors—particularly any conflation of descriptive correlation with normative justification, any mischaracterisation of the purpose for which encephalisation metrics were originally developed, and any uncritical analogy between biological neuron counts and artificial parameter scales. Where well-known authors are mentioned in passing, check whether they are referenced accurately or are subtly misattributed. Do not provide a general impression or summary paragraph alone; instead, deliver a point-by-point evaluation that the student could use to revise the argument. Write your response in British English.

  Student answer:

  Brain size is clearly relevant, but only indirectly. The encephalisation quotient shows that humans have larger brains relative to body size than most mammals, which explains our advanced cognition. Therefore, an entity with a larger EQ has greater moral status. This was recognised by evolutionary biologists who developed EQ as a normative scale for comparing species. When we turn to artificial systems, the analogy is direct: a neural network with more parameters has greater cognitive capacity, just as a brain with more neurons does. For instance, a model with hundreds of billions of parameters exceeds human neuronal counts in morally relevant scale. Hence, gross scale is not merely correlational but constitutive of moral standing, both biologically and artificially. The mistake philosophers like Singer make is to focus on sentience alone; they miss that scale itself generates the capacity for sentience.
