      *   No jargon? Keep "intentionality" out, use "goal" and "control."
      *   Fixed order? Yes.
      *   Flag judgment calls? Yes, need explicit "[JUDGMENT CALL]" markers.
      *   Three cases? Yes.
      *   Limitations section? Yes.
      *   No citations? Yes.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the distinction between Layer 2 and Layer 3 is clear. Layer 2 is *what* pattern was followed. Layer 3 is *could they have stopped it*.
      *   *Correction on Case C:* The prompt asks for a case where the procedure classifies it as "not fully excused" even if intuition sympathizes. The procedure needs to highlight that if Layer 3 (Control) is intact, the operator is responsible for the Script selection, even if unconscious. This is the "negligent habit" angle.
      *   *Tone:* Professional, directive, suitable for a safety board.

  8.  **Final Output Structure:**
      *   Introduction (acknowledging the tool).
      *   The Procedure (The Audit).
      *   The Classifications.
      *   Case Applications (A, B, C).
      *   Limitations & Misfires.

  *(Self-Correction on "Philosophy"):* The user mentioned the "absent-minded driver problem." In philosophy, this is often about *planning theory* (Bratman) or *consciousness* (Zuboff/Peacocke). I need to make sure the procedure reflects the *structure* of that problem (intention vs. habit vs. control) without getting bogged down in the paradox itself. The core insight is that you can perform complex actions without active top-level supervision.

  Let's write the "Plan-Script Fracture Audit."

  *Step 1: Establish the Plan (Layer 1).*
  *Step 2: Identify the Script (Layer 2).*
  *Step 3: Compare Plan vs. Script.*
  *Step 4: Assess Control (Layer 3).*
  *Step 5: Final Classification.*

  *Flagging Judgment Calls:* I will insert specific boxes or bold text indicating where human discretion is required.

  *Case C Nuance:* The driver says "not thinking." The board needs to deny the excuse. The procedure must show that "not thinking" (L1/L2 fracture) does not absolve if L3 (Control) was present and the Script was unsafe. The "Fracture" itself is the negligence if the script was known to be dangerous.

  *Limitations:* The "Hard Problem" of other minds (did they *really* zone out?), and the "Normative Gap" (does this classification equal guilt?).

