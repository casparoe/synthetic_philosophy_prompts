          *   Honest limitation analysis (what it can't settle, where it misfires).
          *   No reading lists/citations.

  2.  **Deconstruct the Philosophy (Mental Sandbox):**
      *   *The Absent-Minded Driver Problem (Piccione & Lipman, 1997):* Essentially about dynamic inconsistency and memorylessness, but the user is referencing the *phenomenology* of action (Christopher Peacocke, Hubert Dreyfus, or standard Action Theory like Anscombe/Davidson). The core distinction is between *intentional action* (doing X because I meant to) vs. *habitual/automatic action* (doing X because it's what I always do) vs. *reflexive/lost control* (doing X without agency).
      *   *Layer 1 (Goal):* What did they *mean* to do? (Conscious intention).
      *   *Layer 2 (Script):* What pattern did they actually follow? (Habit/Heuristic).
      *   *Layer 3 (Control):* Could they have stopped? (Volition/Motor control).
      *   *The "Fracture":* When L1 $\neq$ L2.
      *   *The "Breakdown":* When L3 is compromised (e.g., seizure, extreme dissociation, though usually in transit, L3 holds even in "autopilot" cases because driving requires micro-intentions).

  3.  **Drafting the Procedure (The "Plan-Script Fracture Audit"):**
      *   Need to make it sound official but plain.
      *   Need to ensure the "judgment calls" are flagged.
      *   *Step 1 (Layer 1):* Establish the intended plan. Evidence: Dispatch logs, testimony, schedule.
      *   *Step 2 (Layer 2):* Identify the executed script. Evidence: GPS, telemetry, witness.
      *   *Step 3 (Comparison):* Do L1 and L2 match? If yes -> Standard Error or Compliant. If no -> Fracture.
      *   *Step 4 (Layer 3):* Assess Control. Did they have the capacity to interrupt the script? Evidence: Reaction time, correction attempts, physiological data.
      *   *Classification:*
          *   Type A (Aligned): L1=L2=L3. (Routine slip or compliant).
          *   Type B (Fracture): L1$\neq$L2, but L3 holds. (The "Absent-Minded" case).
          *   Type C (Breakdown): L3 fails. (Medical/Incapacitation).

      *Refining the "Judgment Calls":* The trickiest part is distinguishing "I wasn't thinking" (habit took over) from "I couldn't stop" (loss of control). Also, determining if the script was *reasonable* to be running. I need to flag where the board has to use discretion.

  4.  **Applying to Cases:**
      *   *Case A (Bus/Depot):* L1 (Route), L2 (Old Depot Habit), L3 (Control held). Classification: Type B (Fracture). Excusable? Maybe, depends on fatigue/training.
      *   *Case B (Cyclist/Bridge):* L1 (Delivery), L2 (Wrong turn due to distraction), L3 (Control held + Corrected). Classification: Type B (Fracture) but mitigated by correction.
      *   *Case C (Driver/Red Light):* L1 (Safe drive), L2 (Aggressive/Rushed Habit), L3 (Control held). Classification: Type B (Fracture). *Crucial:* Why deny excuse? Because L3 held and the risk was high. The procedure must show why "autopilot" isn't a get-out-of-jail-free card here. The distinction is that the script itself was negligent.

  5.  **Addressing Limitations:**
      *   Cannot determine *consciousness* definitively (philosophical zombie problem).
      *   Cannot assign *moral blame* automatically (needs policy context).
      *   Misfire point: When a new habit is forming (L1 and L2 are fighting, but it looks like a fracture). Or when "control" is ambiguous (freeze response).

