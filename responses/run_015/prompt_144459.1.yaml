answer: |-
  # The Plan-Script Fracture Audit
  **For Use by Safety Review Boards**

  **Purpose:** To classify incidents where an operator claims they were "on autopilot" or "not thinking." This tool separates a simple mistake from a habit override, and a habit override from a loss of physical control.

  **Time Required:** 15 Minutes per report.
  **Inputs Required:** Operator statement, GPS/Telemetry data, Dispatch logs, Witness statements (if any).

  ---

  ## Part 1: The Audit Procedure

  Run these steps in order. Do not skip ahead.

  ### Step 1: Establish the Top-Level Plan (Layer 1)
  **Question:** What was the specific, conscious goal the operator was required to hold at the start of the shift or route segment?
  **Evidence:** Dispatch assignment, scheduled route sheet, pre-shift briefing notes.
  **Sufficient Answer:** A specific destination or sequence of tasks (e.g., "Drive Route 40 to Terminal B," "Deliver Package X to Address Y").
  **[JUDGMENT CALL]:** If the operator claims their goal was different from the dispatch log (e.g., "I meant to go to the depot to refuel"), the board must decide if this claim is credible based on prior authorization. If the claim is rejected, use the Dispatch Log as the Layer 1 Plan.

  ### Step 2: Identify the Executed Script (Layer 2)
  **Question:** What pattern of behavior did the vehicle actually follow during the incident window?
  **Evidence:** GPS telemetry, braking/acceleration logs, video footage.
  **Sufficient Answer:** A description of the physical path and maneuvers (e.g., "Exited highway at Junction 5 instead of Junction 6," "Maintained speed through red light").
  **[JUDGMENT CALL]:** Determine if this pattern matches a known *habit*. Does the telemetry match a route the operator drives frequently? Does it match a common shortcut? If the behavior is random or erratic, it may not be a "script" but a confusion state.

  ### Step 3: Compare Plan vs. Script
  **Question:** Does the Executed Script (Step 2) match the Top-Level Plan (Step 1)?
  *   **If YES:** Proceed to **Classification A**.
  *   **If NO:** There is a **Fracture**. Proceed to Step 4.

  ### Step 4: Assess Basic Intentional Control (Layer 3)
  **Question:** Did the operator retain the physical and cognitive capacity to interrupt the Executed Script before the incident concluded?
  **Evidence:** Reaction to warnings, correction attempts (steering/braking after the error began), time elapsed between error onset and impact/stop.
  **Sufficient Answer:**
  *   **Control Held:** The operator corrected the error, or could have reasonably braked/steered away but did not until too late. The micro-actions (signaling, checking mirrors) remained skilled.
  *   **Control Lost:** The operator was physically incapacitated (seizure, blackout) or the vehicle was mechanically unresponsive.
  **[JUDGMENT CALL]:** This is the critical filter. "Autopilot" is not "Loss of Control." If the operator was steering, braking, and observing traffic laws *while* going the wrong way, Control is **Held**. "Zoning out" does not equal "Loss of Control."

  ### Step 5: Final Classification
  Based on the steps above, assign one of the following three codes:

  *   **CODE 1 (Aligned Action):** Layer 1 and Layer 2 match. Layer 3 holds.
      *   *Meaning:* The operator did what they meant to do. If an incident occurred, it was an environmental factor or a calculated risk, not a mental fracture.
  *   **CODE 2 (Script Fracture):** Layer 1 and Layer 2 diverge. Layer 3 holds.
      *   *Meaning:* The operator intended one thing but a habit took over. They remained in control of the vehicle but not the route. This is the "Absent-Minded Driver" scenario.
      *   *Board Action:* Investigate why the wrong script was active (fatigue, stress, route similarity). **Note:** This does not automatically excuse liability (see Limitations).
  *   **CODE 3 (Control Breakdown):** Layer 3 fails.
      *   *Meaning:* The operator could not execute their will upon the vehicle.
      *   *Board Action:* Treat as a medical or mechanical emergency, not a behavioral incident.

  ---

  ## Part 2: Case Applications

  Here is how the Audit applies to your three specific scenarios.

  ### Case A: The Bus Driver and the Old Depot
  *   **Incident:** Driver misses three stops, pulls into a depot where he hasn't worked in two years. Claims he "drifted."
  *   **Step 1 (Plan):** Drive Route 10 to City Center. (Verified by Dispatch).
  *   **Step 2 (Script):** Drive Route 10, then turn toward Old Depot. (Verified by GPS).
  *   **Step 3 (Compare):** **Fracture.** Plan $\neq$ Script.
  *   **Step 4 (Control):** **Held.** Driver signaled turns, braked for corners, and stopped the bus safely at the depot. Micro-actions were skilled.
  *   **Step 5 (Classification):** **CODE 2 (Script Fracture).**
  *   **Board Implication:** The driver was not incapacitated. A deep-seated habit (Old Depot) overrode the current goal. This is a genuine "autopilot" event. Excusability depends on whether the authority knew this habit risk existed (e.g., is the turn too similar?).

  ### Case B: The Cyclist and the Wrong Bridge
  *   **Incident:** Cyclist takes wrong bridge while replaying an argument. Notices immediately and corrects.
  *   **Step 1 (Plan):** Deliver to North Side.
  *   **Step 2 (Script):** Enter West Bridge (Habitual route from home).
  *   **Step 3 (Compare):** **Fracture.** Plan $\neq$ Script.
  *   **Step 4 (Control):** **Held.** Cyclist noticed the error and corrected it. This proves monitoring systems were active enough to catch the fracture.
  *   **Step 5 (Classification):** **CODE 2 (Script Fracture).**
  *   **Board Implication:** Because Layer 3 (Control) included *self-correction*, the risk was mitigated by the operator. This is a low-severity fracture. The distraction (argument) triggered the habit, but the safety layer (monitoring) worked.

  ### Case C: The Driver and the Red Light (The Hard Case)
  *   **Incident:** Driver runs a familiar red light on a daily route. Claims "I wasn't thinking." Board needs to deny the excuse.
  *   **Step 1 (Plan):** Drive safely according to traffic laws. (Implicit in all operations).
  *   **Step 2 (Script):** Maintain speed, ignore signal change, proceed through intersection.
  *   **Step 3 (Compare):** **Fracture.** Plan (Safety) $\neq$ Script (Violation).
  *   **Step 4 (Control):** **Held.** Telemetry shows no braking until after the light. The driver was physically capable of braking but the "through" script ran to completion.
  *   **Step 5 (Classification):** **CODE 2 (Script Fracture).**
  *   **Board Implication:** **Crucial Distinction:** While this is classified as a Fracture (like Case A), the Board denies the excuse because **Layer 3 (Control) was intact.**
      *   *Reasoning:* In Case A, the script was *geographically* wrong but *operationally* safe (pulling into a depot). In Case C, the script itself was *operationally* unsafe.
      *   *Decision:* A "Script Fracture" explains *why* it happened (habit), but it does not excuse it if the script violated safety protocols that the operator was trained to override. The operator is responsible for maintaining enough attention to interrupt unsafe scripts. Since Layer 3 held, they *could* have interrupted it. They failed to monitor, not failed to control.

  ---

  ## Part 3: Limitations and Misfires

  You asked for honesty about where this tool fails. It cannot solve the following problems:

  **1. The "Consciousness" Blind Spot**
  The Audit treats "Control" as binary (Held vs. Lost). In reality, there is a gray zone called *highway hypnosis* where a driver can navigate complex traffic without forming memories of the trip. The Audit will classify this as **Control Held** (because they didn't crash), but it cannot determine if the operator was truly unconscious of their actions or just neglecting to pay attention. It cannot distinguish between a *broken* monitoring system and a *negligent* one.

  **2. The Normative Gap (Blame vs. Explanation)**
  This procedure classifies the *structure* of the action, not the *morality* of it.
  *   **Code 2** explains that a habit took over. It does not tell you if the operator is *blameworthy*.
  *   In Case C, the Audit classifies it as a Fracture. Your intuition might say "He wasn't thinking, give him a break." The Board says "He should have been thinking." The Audit supports the Board, but it does not *prove* the Board is right. That is a policy decision, not a philosophical one. You must decide externally: "Is running a habit script negligence?" The Audit only confirms it *was* a habit script.

  **3. The Mechanical Misfire Point: New Habit Formation**
  The Audit will misfire if an operator is actively learning a new route.
  *   *Scenario:* A driver is trying to learn a new detour (Layer 1) but keeps accidentally turning onto the old route (Layer 2).
  *   *Misfire:* The Audit classifies this as **Code 2 (Script Fracture)**. It looks like a failure.
  *   *Reality:* This is a normal part of learning. Penalizing this as a "fracture" discourages operators from admitting they are struggling with new patterns. The Audit treats all fractures as incidents, but some fractures are just growing pains. You must manually flag "Training Period" incidents before running the Audit.

  **4. The "Reasonable Script" Problem**
  The Audit assumes Layer 2 (The Script) is either "Safe" or "Unsafe." It cannot judge if the Script was *reasonable to be running*.
  *   If a driver defaults to a speed that is technically over the limit but matches the flow of traffic (a common safety script to avoid rear-end collisions), the Audit marks this as a **Fracture** (Plan: Follow Limit vs. Script: Follow Flow).
  *   The Board might view this as good defensive driving. The Audit views it as a deviation from the Plan. Do not use this tool to evaluate "flow of traffic" violations without human override.
