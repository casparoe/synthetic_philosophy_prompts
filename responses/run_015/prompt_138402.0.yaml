answer: |-
  This is one of the most important distinctions in probability, economics, and decision-making, and it is absolutely not "dumb." You have stumbled onto a concept that breaks most standard economic models.

  You are asking about the difference between **what happens to the group** versus **what happens to you over time**.

  Here is the breakdown of the shape you are seeing, piece by piece.

  ### 1. The "Average is a Lie" and the "Best Fraction" are the same thing.

  Your friend is calculating the **Arithmetic Mean** (the ensemble average). He is imagining 1,000 parallel universes. In most, you go broke. In one, you become a trillionaire. When you average those 1,000 outcomes, the trillionaire pulls the average up to infinity. Mathematically, he is correct: the *expected value* of betting 100% is indeed the highest.

  You are calculating the **Geometric Mean** (the time average). You are looking at *one* person playing 1,000 rounds in a row. In this timeline, you cannot average out a "broke" result with a "trillionaire" result that happens in a different timeline. If you hit zero in round 42, round 43 doesn't happen.

  **Why the average is a lie:**
  In a multiplicative game (betting a percentage of your bankroll), gains and losses are not symmetrical.
  *   If you have \$100 and lose 50%, you have \$50.
  *   To get back to \$100, you don't need a 50% gain; you need a **100%** gain.
  *   Losses hurt more than wins help. This is called **Volatility Drag**.

  When you bet 100% of your money, a single tails wipes you out. The "average" ignores the fact that the game ends for you at zero. The one guy in your simulation who ends up with all the money is the statistical equivalent of a lightning strike. He is the outlier that makes the math look good for the group, but useless for the individual.

  **Why exactly one-fifth (20%)?**
  This is not a coincidence of your 60% number. There is a specific formula for this. It depends on two things: your edge (how much the odds favor you) and the payout (how much you win).

  In your game:
  *   Probability of winning ($p$) = 0.60
  *   Probability of losing ($q$) = 0.40
  *   Payout ratio ($b$) = 1 (You bet \$1, you win \$1 profit).

  The optimal fraction is calculated as: **$p - q$** (when payout is 1-to-1).
  $0.60 - 0.40 = 0.20$.

  If the coin was 70% heads, the sweet spot would be 40% ($0.7 - 0.3$). If the coin was 50/50, the sweet spot is 0% (don't play). This specific fraction maximizes the *rate of growth* of your wealth over time, rather than the *size* of your wealth in a single hypothetical snapshot.

  ### 2. Why the "Sweet Spot" vanished with fixed dollars.

  This was not a bug. You discovered the difference between **Multiplicative** and **Additive** dynamics.

  *   **Your original game (Multiplicative):** Your bet size grows as you win. If you have \$1,000, you bet \$200. If you have \$10, you bet \$2. Your risk scales with your wealth. This creates the "volatility drag" described above. Losing 50% of a large pile is harder to recover from than losing 50% of a small pile.
  *   **The fixed dollar game (Additive):** You bet \$10 regardless of whether you have \$100 or \$10,000.
      *   If you have \$10,000 and lose \$10, it's negligible.
      *   If you have \$20 and lose \$10, it's devastating.
      *   *However*, because the bet doesn't grow when you win, you don't expose your *gains* to the risk of the next flip.

  In the additive version, the "volatility drag" is vastly reduced because you aren't compounding your risk. You are essentially taking a salary (+\$2 expected value per round) rather than investing equity. In additive games with a positive edge, betting the maximum you can afford (without going broke) is usually mathematically correct because you aren't risking your previous winnings on the next flip.

  This tells you something real: **Fractional betting is only dangerous/complex when your risk is tied to your current capital.** If your risk is fixed (like a monthly bill or a fixed bet), the "sweet spot" logic changes.

  ### 3. Is this about feelings (risk aversion) or math?

  It is **math**. Your second friend is wrong.

  A robot with no feelings, programmed to maximize its bankroll after 1,000 rounds, **will** bet 20%.
  *   If the robot bets 100%, its *expected* value is high, but its *probability of survival* approaches zero as rounds increase.
  *   If the robot bets 20%, its *expected* value is lower than the 100% strategy, but its *median* outcome is maximized.

  **Is this the same as gamblers going broke?**
  It is related, but distinct.
  *   **Casino Gamblers:** They go broke because the game has a *negative* expected value (the house edge). No betting fraction can save them in the long run.
  *   **Your Game:** You have a *positive* expected value. You *should* win. You only go broke if you bet too much relative to your edge.

  This is the difference between a **bad game** (casino) and **bad betting** (your friend's strategy). You found the mathematical boundary where a good game turns into a losing strategy due to over-betting.

  ### 4. Does this apply outside betting? (The "One Flip" Problem)

  This is the most critical part. The "20% rule" (often called the **Kelly Criterion**) only applies under specific conditions.

  **Condition A: Repeated Plays**
  The logic only holds if you get to play the game many times. The magic of the 20% bet is that it prevents ruin *so that you can stay in the game long enough for the 60% probability to work in your favor.*
  *   **If you only get ONE flip:** Your friend is right. Bet everything. There is no "long term" to protect. There is no volatility drag because there is no second round. You maximize your single-shot expected return.
  *   **If you get 100 flips:** You are right. Bet 20%.

  **Condition B: Non-Ergodicity (Real Life Applications)**
  You asked about the summer program. "Apply to eight" vs. "Put everything into one."
  *   **If the cost is money you need to live:** This is multiplicative. If you spend your last \$5,000 on one program and it fails, you have \$0. You are out of the game. Diversifying (applying to eight) is the fractional betting strategy. It reduces variance to ensure survival.
  *   **If the cost is effort/time:** This is often additive. If you apply to one program and fail, you lost time, but you still have your health and ability to apply elsewhere next year.

  **Where the rule stops being true:**
  1.  **Finite Utility:** If winning \$1 billion doesn't make you happier than winning \$10 million, you should bet *less* than the optimal fraction. The math assumes every dollar is worth the same.
  2.  **Uncertainty:** The Kelly Criterion assumes you *know* the odds are 60%. In real life, you usually *think* the odds are 60%. If you are wrong and the odds are actually 40%, Kelly betting will bankrupt you faster than any other strategy. Real-world investors often use "Half-Kelly" (betting 10% instead of 20%) to build a safety margin for miscalculation.
  3.  **No Ruin:** If you can borrow money or restart after going broke, the "ruin" constraint vanishes, and you can afford to be more aggressive.

  ### Summary of the "Shape"

  The shape you are seeing is called **Ergodicity Breaking**.

  *   **Your Friend** is looking at the **Ensemble Average**: "If 1,000 people play once, the group wins big."
  *   **You** are looking at the **Time Average**: "If 1 person plays 1,000 times, the individual usually loses."

  In our universe, we live in time, not in parallel ensembles. We cannot access the money won by the "lucky version" of ourselves in a parallel universe. We only have the one timeline we are in.

  **The Verdict:**
  *   **One-off decision:** Maximize Expected Value (Friend is right).
  *   **Repeated decision with compounding risk:** Maximize Geometric Growth (You are right).
  *   **The 20%:** It is the exact mathematical point where the drag of volatility equals the push of the positive odds.
  *   **The "Feelings":** Irrelevant. This is survival math.

  You didn't just find a betting trick; you found the reason why diversified portfolios exist and why "all-in" strategies usually fail in the long run, even when the odds are in your favor.
