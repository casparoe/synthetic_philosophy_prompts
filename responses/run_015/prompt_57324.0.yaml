  7.  **Refining the Arguments (Self-Correction/Verification):**

      *   *Check on (5):* Does REU sophistication *always* imply preference for commitment? Buchak (2013) argues REU agents can be sophisticated without being exploitable *if* they treat the plan as the object of choice. But the standard "node-by-node" sophistication (which (5) describes: "at each node I choose whatever my then-current... favours") leads to dynamic inconsistency. (5) explicitly says "a plan I adopt now has no authority over me later." This is the definition of *naive* or *sophisticated* in the McClennen/Thoma sense. If plans have no authority, you are dynamically inconsistent. If you are dynamically inconsistent, you are money-pumpable. (5) claims this *protects* from exploitation. This is factually incorrect in standard decision theory. *Correction:* Sophistication *anticipates* inconsistency. It doesn't prevent it. It leads to choosing nodes that account for future deviation. This often results in paying to *remove* options (commitment). (5) says paying to *keep* options (flexibility). This is the contradiction.
