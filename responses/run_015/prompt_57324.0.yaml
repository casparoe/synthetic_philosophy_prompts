      *   *Single Revision:* Adopt **Resoluteness**. This fixes the dynamic exploitation issue (protects from money pumps without needing commitment) and clarifies the normative status (plans *do* have authority, implying a normative structure). Wait, Resoluteness might conflict with (3) if resoluteness implies a specific rational norm.
      *   *Better Single Revision:* **Drop (5)'s claim about flexibility.** Acknowledge that REU + Sophistication implies a value for commitment. This aligns with the Allais intuition (you want to secure the sure thing).

