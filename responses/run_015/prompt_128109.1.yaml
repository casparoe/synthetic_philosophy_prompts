      *Hope Nobody Asks:* The Twinning/Cloning case is usually the killer for origin essentialism. If the zygote splits (twins), they have the *same* origin (gametes + methylation). Are they the same person? If no, origin isn't sufficient. If yes, absurd. This is the classic "Twinning Problem" for origin essentialism, now exacerbated by the epigenetic clause.

