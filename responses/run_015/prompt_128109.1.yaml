      *(Final Polish)*: Ensure the distinction between the *Metaphysicians* (who care about the logic of identity) and the *Philosopher of Science* (who cares about the inference from data to modality) is clear.

      *Let's finalize the list:*
      1. PhilSci: Modal Fallacy (Is-Ought gap for necessity).
      2. Bio: Epigenetic Reprogramming (The mark is erased).
      3. Metaph: Sorites/Vagueness (How many methyl groups?).
      4. Bio: Gamete Individuation (Is it the same gamete?).
