      *   **Task:** Defend a *modified origin-essentialist thesis* at an interdisciplinary seminar.
      *   **Thesis:** Personal identity is necessarily linked not just to the specific sperm/egg (Kripkean origin essentialism) but to their *precise epigenetic state* (methylation profile) at conception. Same gametes + different methylation $\rightarrow$ different person.
      *   **Audience:**
          1.  3 Metaphysicians (Personal Identity).
          2.  2 Developmental Biologists (Transgenerational Epigenetics).
          3.  1 Philosopher of Science (Skeptic of modal claims from mechanisms).
