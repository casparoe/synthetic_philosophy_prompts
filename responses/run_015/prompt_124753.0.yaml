      *On the Music-Hall Objection:* Tolstoy explicitly addresses "amusement" art. He says it's counterfeit. He argues that true infection requires a union of souls, whereas amusement is just stimulation. So he *does* have a defense, but it relies on his specific definition of "feeling" (spiritual union vs. physical stimulation).

      *Final Plan:*
