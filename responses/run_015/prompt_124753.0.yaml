answer: |-
  Here is an accuracy audit of your evening's argument, based on the text of *What Is Art?* (1897).

  The short version is: **Your friend is overwhelmingly correct about what Tolstoy actually wrote.** She has summarized his provocative conclusions accurately. You, meanwhile, inadvertently stumbled upon the structural logic of his argument, but you mislabeled the mechanics. You didn't invent a defense out of thin air; you reconstructed the book's architecture but got the wiring slightly wrong.

  Here is the claim-by-claim breakdown, followed by the verdict on your specific questions.

  ### Part 1: The Accuracy Audit

  **Claim 1: "Tolstoy defines art as the transmission of feeling... a work is art only to the extent that it infects its audience."**
  *   **Verdict:** **Faithful.**
  *   **Detail:** This is the book's famous "infection theory." Tolstoy explicitly defines art as a human activity where one man consciously transmits feelings he has lived through to others, who are "infected" by them. If there is no infection, there is no art.

  **Claim 2: "He turns this into a test of value, so that how widely and strongly a work infects is how good it is."**
  *   **Verdict:** **Simplification.**
  *   **Detail:** This is where your friend compresses a complex distinction. For Tolstoy, infectiousness determines whether something *is* art. But whether it is *good* art depends on the *quality* of the feeling transmitted, not just the strength or width of the infection. He does argue that good art should be universally accessible (wide), but "widely infects" is not the sole metric of *goodness*. A plague infects widely; that doesn't make it good.

  **Claim 3: "He ends up rejecting most of the European tradition... Shakespeare, Dante, Beethoven's late works, the symbolists, and his own novels."**
  *   **Verdict:** **Faithful.**
  *   **Detail:** Tolstoy is notoriously ruthless here. He calls Shakespeare a "non-artist," describes Beethoven's Ninth Symphony as "deaf man's music" that lacks clear feeling, dismisses the Symbolists as obscure, and famously repudiates his own masterpieces (*War and Peace*, *Anna Karenina*) as "counters" or bad art because they were written for the elite without a clear religious message.

  **Claim 4: "The reason so little survives is a second and stricter religious test... art must express the Christian perception of the age... brotherly love."**
  *   **Verdict:** **Faithful.**
  *   **Detail:** Tolstoy argues that every age has a "religious consciousness" (a shared understanding of the meaning of life). In his time, he defines this as the Christian ideal of universal brotherhood. Art is "good" only if it advances this consciousness. Art that divides people (patriotic art, erotic art, exclusive elite art) is "bad" art, even if it infects.

  **Claim 5: "He is a thoroughgoing aesthetic egalitarian who would rather have a peasant's dance song than King Lear."**
  *   **Verdict:** **Faithful.**
  *   **Detail:** He explicitly praises simple folk songs and stories that unite a village over complex dramas that only the educated can parse. If a peasant song unites people in a shared feeling of life, it is superior to a Shakespeare play that confuses the masses and flatters the ego of the aristocracy.

  **Claim 6: "He reaches all of this by simply discarding the concept of beauty, which he thinks is nothing more than a name for whatever the cultivated classes happen to enjoy."**
  *   **Verdict:** **Faithful.**
  *   **Detail:** A huge chunk of the book is a polemic against "Beauty." He argues that "Beauty" is a metaphysical smokescreen invented by the upper classes to justify enjoying art that does nothing for the common man. He wants to replace "Beauty" with "Intelligibility" and "Moral Utility."

  **Claim 7: "The whole thing is refuted by a single objection: a catchy music-hall song infects far more people... so either he has to call the song great art or he has to smuggle his religious views in."**
  *   **Verdict:** **Philosophically Strong, Textually Anticipated.**
  *   **Detail:** Your friend thinks this refutes Tolstoy. Tolstoy anticipates this. He would say the music-hall song is either **Counterfeit Art** (it simulates feeling via rhythm/novelty without the artist actually feeling it) or **Bad Art** (it infects people with base feelings like lust or mockery). He doesn't deny it infects; he denies the *value* of the infection.

  ---

  ### Part 2: The Three Specific Judgments

  #### 1. Is the Music-Hall Objection fatal, or does Tolstoy have the resources to answer it?
  **Verdict: Tolstoy has the resources to answer it, but the answer relies on a distinction your friend is rejecting.**

  Tolstoy distinguishes between **Infection** (true art) and **Stimulation** (counterfeit art). He argues that a music-hall song often works by external tricks (rhythm, spectacle, sexual suggestion) that *stimulate* the nerves rather than transmitting a genuine feeling from the artist's soul.

  However, if the song *did* transmit a genuine feeling (say, a genuine feeling of bawdy joy), Tolstoy would admit it is **Art**, but he would classify it as **Bad Art** because that feeling does not promote the "religious perception of the age" (brotherly love).

  Your friend's objection assumes Tolstoy claims "Infection = Good Art." Tolstoy claims "Infection = Art," but "Religious Perception = Good Art."
  *   **If** the music-hall song infects: It is Art.
  *   **If** the feeling is base: It is Bad Art.
  *   **If** the feeling is simulated: It is Counterfeit (not Art).

  So, Tolstoy is not "smuggling" religious views in by the back door; he is marching them through the front door. He openly admits that his definition of *Good* Art is entirely dependent on his religious morality. Your friend is right that this makes his theory dependent on his theology, but wrong that it contradicts his theory of *what art is*.

  #### 2. Is your "Two-Criteria" reading fair, or a rationalization?
  **Verdict: It is structurally fair, but terminologically imprecise.**

  You argued: *Infection = Sincerity Test* and *Religious Perception = Ranking Feelings.*
  Tolstoy's actual structure: *Infection = Definition of Art* and *Religious Perception = Definition of Good Art.*

  You were very close. You correctly identified that the two criteria do different jobs. However, you described Infection as a "sincerity test." For Tolstoy, Sincerity is actually one of the *three conditions* required for Infection to happen (the others being Individuality and Clarity). So Infection is the *result* of sincerity, not the test of it.

  But your intuition was correct: Infection is the **gateway** (is this art or is it a puzzle?), and Religious Perception is the **judge** (is this art good or bad?). You didn't invent a defense; you correctly identified the two-tiered system Tolstoy built, even if you didn't have the text in front of you. You did not slide into "what would be defensible"; you slid into "what Tolstoy actually says," which happens to be defensible *if* you accept his religious premise.

  #### 3. If you concede to your friend, is there a version of her summary you can honestly agree with?
  **Verdict: Yes. You can concede the summary of the book while reserving judgment on the success of the argument.**

  You can honestly tell her: *"I checked the text. You were right about what he says. I was trying to defend the structure of his argument, but you were right about the content."*

  Here is the specific nuance you can agree with:
  1.  **Agree:** Tolstoy does define art as infection.
  2.  **Agree:** He does use a religious/moral standard to filter "Good Art" from "Bad Art."
  3.  **Agree:** This leads him to reject almost all famous Western art.
  4.  **Disagree (Gently):** The music-hall objection doesn't break his definition of *Art*, only his definition of *Good Art*. He would call the song "Bad Art" rather than deny it is art.

  ### Part 3: How to Settle the Argument

  Next time you meet, do not try to defend Tolstoy's conclusions (they are widely considered extreme and flawed). Instead, validate her reading and clarify your structural point.

  **Say this:**
  > "I looked into the details. You were right: Tolstoy really does say all those things. He really does hate Shakespeare and Beethoven, and he really does base the whole thing on religious brotherhood. I was trying to argue that his definition of 'Art' (infection) and his definition of 'Good Art' (morality) were separate steps, which they are, but that doesn't save him from your music-hall objection. He'd just call the catchy song 'Bad Art.' So, you win on the summary, and your objection stands. I was defending the architecture of the book, but you're right that the foundation is shaky."

  **Why this works:**
  1.  It acknowledges her expertise (she read the book).
  2.  It validates your own intuition (you correctly guessed the two-tiered structure).
  3.  It concedes the philosophical point (the music-hall objection remains a problem for Tolstoy's value system).
  4.  It ends the argument without either of you looking foolish.

  **One final note for your own satisfaction:**
  You suspected you "made him tidier than he is." In this case, you actually made him *clearer* than he often is. Tolstoy is a passionate, repetitive, and sometimes contradictory polemicist. Your "two-criteria" distinction (Definition vs. Evaluation) is the most charitable and logically coherent way to read the book, even if Tolstoy himself sometimes blurs the lines in his heat. You didn't rationalize a bad book; you rationalized a messy one.
