      *   *Verdict:* The friend's objection is strong, but Tolstoy has a reply: Infection makes it art; Religious Consciousness makes it *good* art. A catchy song is art, but if it promotes vice, it's bad art. The friend conflates "great art" with "infectious art."

  5.  **Synthesize the "Accuracy Audit":**
      *   Go through each point from the prompt.
