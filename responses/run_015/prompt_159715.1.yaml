  ### Pre-Response Planning Sketch

  *   **Vocabulary Mapping:** I will map $\psi$-ontic primarily to **T1** (complete specification) and $\psi$-epistemic to **T3** (measure over T1). I must note that **T2** (incomplete specification) implies hidden variables, which collapses into T3 if we ask what the distribution is over. **T5** (structural) is the "Wavefunction as Law" view.
  *   **Role Split:** I need to confirm that a split verdict (e.g., T5 for dynamics, T3 for prediction) is coherent and identify the cost (loss of unity). I will use Everettian and Nomological views as examples.
  *   **Conditioning Worry:** I must validate the user's suspicion: Bayesian conditioning in this context *does* presuppose a pre-existing value (a T1 state). If T1 is denied, "conditioning" changes meaning to "updating on experience," which breaks the user's Stat Mech definition.
  *   **Residue:** I will highlight **Contextuality** (Kochen-Specker) and **Configuration Space Ontology** as the primary breaks in the user's vocabulary, alongside the **PBR Theorem** constraints on T3.

  ***

  ### Response

  It is a pleasure to engage with a colleague who speaks the language of ensembles and flows. Your vocabulary is robust, but as you suspect, it carries classical baggage that the quantum formalism strains. I will proceed through your taxonomy, the role-split, the translation of collapse, and finally the residue report.

  #### 1. Mapping the Taxonomy (T1–T5)

  You asked for the $\psi$-ontic versus $\psi$-epistemic distinction restated in your T1–T5 taxonomy, specifically using the Harrigan-Spekkens sharp version (overlapping vs. non-overlapping distributions over complete states).

  *   **$\psi$-Ontic:** This view asserts that the quantum state corresponds directly to the physical reality of the system. In your taxonomy, this is primarily **T1**. The pure state $|\psi\rangle$ *is* the microstate (or is in one-to-one correspondence with it). If the system is in state $|\psi\rangle$, there is no further "complete specification" $\lambda$ underneath it that could be compatible with a different $|\phi\rangle$. Distinct quantum states imply disjoint physical realities.
      *   *Nuance:* Some ontic views treat $|\psi\rangle$ as part of a larger T1 state (e.g., Bohmian mechanics, where the complete state is $(|\psi\rangle, Q)$). Here $|\psi\rangle$ is still T1-like (a real field), but not the *whole* T1.
  *   **$\psi$-Epistemic:** This view asserts that the quantum state represents knowledge or information about the system. In your taxonomy, this is **T3**. $|\psi\rangle$ is a measure (a credence function) over a space of underlying complete states (T1 items, often called $\lambda$). Distinct quantum states $|\psi\rangle$ and $|\phi\rangle$ correspond to probability distributions over $\lambda$ that *overlap*. A single underlying reality $\lambda$ could be consistent with multiple quantum states.
  *   **T2 (Incomplete Specification):** This slot is unstable in this debate. If $|\psi\rangle$ is T2, it implies there is a more complete specification (T1) that it summarizes. This effectively collapses into the **T3** view (a distribution over the T1 items), unless one claims the T1 items are inaccessible in principle, in which case it borders on **T5**.
  *   **T4 (Fixed Coefficient):** This slot is largely vacant for the standard quantum state, as $|\psi\rangle$ evolves. However, for the *Wavefunction of the Universe* in certain cosmological models, it is sometimes treated as T4 (a fixed boundary condition).
  *   **T5 (Structural/Nomological):** This slot is occupied by the "Wavefunction as Law" view. Here $|\psi\rangle$ is not a state of the system but a constraint or law governing the evolution of other variables (like particle configurations).

  **Mapping Verdict:** The debate is primarily a contest between **T1** (Ontic) and **T3** (Epistemic). **T5** is a serious minority contender. **T2** and **T4** are generally derivative or unstable positions in this specific context.

  #### 2. The Role-Split (Dynamical, Predictive, Informational)

  You asked if the verdict must be the same for all three jobs. It need not be, and splitting them is a live option, though it comes at a cost.

  *   **The Split:** One can hold that $|\psi\rangle$ is **T5** (a law/constraint) for the *dynamical job* (it guides evolution via Schrödinger's equation) but **T3** (a credence function) for the *predictive/informational job* (it yields probabilities for outcomes).
  *   **Coherence:** This is coherent. It resembles the Nomological view in Bohmian mechanics or certain Everettian interpretations. The wavefunction governs the history of the universe (T5) but an agent within the universe uses a reduced state to predict their branch (T3).
  *   **The Cost:** The cost is explanatory unity. You must explain why a "law" (T5) appears to "collapse" or update upon measurement (which looks like a state change, T1/T3). You also must explain why the "law" is contingent on preparation (laws are usually fixed, states are contingent).
  *   **Who Holds This:** Everettians often lean this way: the universal wavefunction is T1/T5 (real structure), but the relative state of an observer is T3 (self-locating uncertainty). QBists lean heavily into the Informational job being primary, treating the Dynamical job as a normative constraint on how beliefs should evolve, not a physical flow.

  #### 3. Translating Collapse

  Here we translate the four main families of collapse accounts into your vocabulary.

  1.  **Genuinely Stochastic Collapse (e.g., GRW):**
      *   **Translation:** A **real physical process**. It is a modification of the Hamiltonian flow to include stochastic jumps.
      *   **Fudge:** None in your vocabulary. It fits "stochastic dynamics" perfectly. The cost is energy non-conservation and new constants.
  2.  **Deterministic Guiding (e.g., Bohm):**
      *   **Translation:** **Conditioning** of a distribution on new data (the particle position), plus a physical change in the "effective" wavefunction due to decoherence.
      *   **Fudge:** The "effective" wavefunction change looks like collapse but is actually just the agent ignoring empty branches. Your vocabulary handles this as **coarse-graining** (ignoring degrees of freedom).
  3.  **Branching without Collapse (e.g., Everett):**
      *   **Translation:** **No collapse**. The appearance of collapse is **coarse-graining**. The global state (T1) evolves unitarily; the observer becomes entangled with the system. The "collapse" is the observer restricting attention to their branch.
      *   **Fudge:** Defining "branch" precisely requires a decoherence criterion, which is approximate. Your "macrostate" concept handles this well, but the ontology of *many* macrostates existing simultaneously is new.
  4.  **Collapse as Updating (e.g., Copenhagen/QBism):**
      *   **Translation:** **Conditioning** of a distribution (T3) on new data.
      *   **Fudge:** **This addresses your specific worry.** You noted: *"Conditioning... always presupposed a variable that already had a value before I conditioned on it."*
      *   **The Break:** In your Stat Mech vocabulary, Bayesian updating reveals a pre-existing microstate value. In QM Epistemic views, if there is no underlying T1 (no hidden variables), there is *no variable that had a value*. The "outcome" is not a revelation of a pre-existing property but the creation of a new fact.
      *   **Verdict:** If you insist on your strict definition of conditioning (updating a measure over pre-existing T1s), this translation **fails** for standard Epistemic views. It only works if you accept Hidden Variables (Bohm), which then faces Bell's Theorem. If you drop the requirement for pre-existing values, "conditioning" becomes a metaphor for "updating expectations based on experience," which is not the Stat Mech definition you trust.

  #### 4. Residue Report: What Your Vocabulary Cannot Hold

  You asked for an honest report on what breaks. Your vocabulary assumes a classical ontology of systems and properties. Here is what leaks through.

  **Your Candidates (Corrected/Supplemented):**

  1.  **High-Dimensional Configuration Space:**
      *   *Status:* **Valid Defect.** In Stat Mech, phase space is a mathematical construct over 3D space. In QM, the wavefunction is a field on $3N$-dimensional configuration space. If $\psi$ is T1 (ontic), then reality is fundamentally high-dimensional, not 3D. Your vocabulary assumes the "system" sits in 3D space; QM suggests the "system" *is* the configuration space.
  2.  **Complex Phase:**
      *   *Status:* **Valid Defect.** Your T3 measures are real-valued probabilities. $\psi$ involves complex amplitudes. You cannot model interference with a classical T3 distribution over T1 states without introducing negative probabilities or contextuality. The "phase" is not just a gauge; it carries physical information (Aharonov-Bohm) that has no analogue in Gibbs ensembles.
