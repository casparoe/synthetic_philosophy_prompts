      *   *Status:* **Valid Defect.** You mentioned PBR. The PBR theorem states that if systems have independent real states (T1) and $\psi$ is T3 (epistemic), predictions contradict QM. This forces a choice: deny independence (holism) or deny T3 (accept T1).
