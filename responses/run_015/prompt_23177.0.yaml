answer: |-
  Yes, your intuition is spot on. There **is** a logical inconsistency between those two choices, even though each one feels perfectly reasonable on its own.

  This is a classic example of something called the **Allais Paradox** (specifically the "Common Consequence Effect"). It highlights how human brains treat "certainty" differently than "probability," even when the math implies we shouldn't.

  Here is the breakdown of why it's inconsistent, followed by a script on how to explain it to your friend without sounding like you're correcting her homework.

  ### The Math Behind the Inconsistency

  To see the contradiction, you have to strip away the parts of the bets that are identical.

  **Look at Decision 1:**
  *   **Option A:** 100% chance of \$10k.
  *   **Option B:** 90% chance of \$10k, 9% chance of \$50k, 1% chance of \$0.

  Notice that **90% of the outcome is exactly the same** in both options (you get \$10k). If you mentally "cancel out" that common 90%, the decision actually comes down to the remaining 10%:
  *   **Option A (remainder):** A guaranteed \$10k.
  *   **Option B (remainder):** A 90% chance of \$50k and a 10% chance of \$0.
  *(Note: 9% is 90% of 10%, and 1% is 10% of 10%).*

  So, by choosing **A**, she is saying: *"In a vacuum, I prefer a guaranteed \$10k over a 90% chance at \$50k."*

  **Now look at Decision 2:**
  *   **Option C:** 10% chance of \$10k.
  *   **Option D:** 9% chance of \$50k.

  This is effectively the **exact same comparison** as the "remainder" above.
  *   **Option C** is the 10% chance of \$10k.
  *   **Option D** is the 9% chance of \$50k.

  By choosing **D**, she is saying: *"In a vacuum, I prefer a 9% chance at \$50k over a 10% chance of \$10k."*

  **The Contradiction:**
  *   Decision 1 implies she values the **\$10k** more.
  *   Decision 2 implies she values the **9% shot at \$50k** more.
  *   She can't logically hold both positions at the same time.

  ### Why It Happens (The Psychology)
  It's not that she's bad at math. It's that her brain is reacting to the **Certainty Effect**.
  *   In Decision 1, Option A is a *sure thing*. Humans place a massive emotional premium on eliminating risk entirely. The 1% chance of getting nothing in Option B feels scary because it ruins the guarantee.
  *   In Decision 2, *both* options are risky. The "certainty premium" disappears. Now she looks at the raw value (Expected Value) and correctly sees that Option D pays out way more on average.

  ### How to Explain It to Her
  You want to frame this as a "frame of reference" trick rather than a mistake. Here is a conversational way to bring it up:

  > "I was looking at those two choices, and individually they both make total sense. I'd probably do the exact same thing. But I noticed something weird when you put them side-by-side that might be worth a sanity check.
  >
  > In the first bet, since 90% of the outcome is the same (\$10k), you're really just deciding what to do with the remaining 10%. In that slice, Option A gives you \$10k for sure, and Option B gives you a shot at the \$50k. By picking A, you're basically saying the safe \$10k is worth more than the shot at \$50k.
  >
  > But in the second bet, you're choosing between that same shot at \$10k vs. that same shot at \$50k, and you picked the \$50k.
  >
  > It's basically the **Allais Paradox**. Our brains treat a 'guarantee' like magic, so we play it safe in the first one, but when both are risky in the second one, we go for the value. It's totally human, but if you want your risk policy to be consistent, you might want to check if you'd rather be a 'Value Maximizer' (pick B and D) or a 'Safety First' person (pick A and C)."

  ### The "So What?"
  Does she need to change her mind? **Not necessarily.**
  *   If the \$10k in Decision 1 is "rent money," choosing A is rational for her life, even if it's mathematically inconsistent with Decision 2.
  *   If the wager in Decision 2 is "fun money," choosing D is rational.

  However, if these are investment decisions or business strategy choices where consistency matters, she should know that her risk tolerance is shifting based on whether a "guarantee" is on the table, not just based on the numbers. Pointing this out helps her decide if that emotional shift is intentional or accidental.
