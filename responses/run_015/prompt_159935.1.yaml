  # PREP SHEET: THOMSON'S LAMP & EXTENSION-PLURALISM
  **Seminar:** Work-in-Progress | **Time:** Next Thursday | **Goal:** Defend "No Fact of the Matter" without collapsing into epistemicism or inconsistency.

  ---

  ### 1. THE MATHEMATICIAN (Phil. Math)
  **Objection:** "You're treating 'the state at $t=1$' as a referring term that fails to denote, but then you predicate things of it. If bivalence holds for propositions about physical states, your pluralism is just inconsistency in a costume. You're saying '$P$ is true' and '$P$ is false' are both false. That's not underdetermination; that's a truth-value gap, which requires a non-classical logic you haven't justified. Why shouldn't I just say the function is undefined and move on, rather than positing a metaphysical gap?"

  **Reply (90s):** "I agree the function is undefined on the open interval. My claim is that the *physical story* corresponds to that partial function. When you ask for the state at the limit, you're asking for a value outside the domain. I'm not denying bivalence for well-formed propositions; I'm denying that 'The lamp is on at $t=1$' expresses a complete proposition given *only* this story. It's like asking for the value of $1/x$ at $0$. The gap isn't in the logic; it's in the extension. Pluralism says any *completion* of the story (adding a boundary condition) yields a consistent model, but the base story fixes none of them."
  *   **Concession:** "I concede I am effectively restricting the domain of the valuation function, which looks like a logical revision even if I claim it's semantic."
  *   **Soft Spot:** The boundary between 'semantic incompleteness' and 'metaphysical indeterminacy' is thin. If pressed, I risk sounding like I'm just doing linguistics.
  *   **Force:** **High.** If this fails, the formal model collapses.

  ### 2. THE METAPHYSICIAN (Grounding/Vagueness Cluster)
  **Objection:** "Okay, but 'no fact of the matter' is a heavy-duty posit. It owes a truthmaker. What makes it *true* that there is no fact about the lamp's state? If you say 'the structure of the task,' you've just pushed the buck. You're positing a brute contingency at the limit. That violates the Principle of Sufficient Reason. Why is the world silent here rather than noisy?"

  **Reply (90s):** "It's not a brute contingency; it's structural underdetermination. Think of the Pre-Loaded Lamp case: infinite flips in the *past*, stopping at $t=0$. You walk in. The past is fixed, the laws are fixed, but the involution algebra doesn't sum to a state. The 'truthmaker' for the gap is the algebraic structure of the operation itself. An infinite sum of toggles has no parity. I'm not saying the world is mysterious; I'm saying the description provided doesn't contain enough coordinates to locate a world. The silence isn't a fact; it's the absence of a constraint."
  *   **Concession:** "I concede this sounds like a negative fact, and I need to be careful not to reify the gap."
  *   **Soft Spot:** Explaining the 'truthmaker' for a gap without invoking a fact *about* the gap. This is the **MAKE-OR-BREAK** reply.
  *   **Force:** **Critical.** This is the core ontological commitment of the chapter.

  ### 3. THE PHYSICIST 1 (Pro-Supertask/Classical Mech)
  **Objection:** "I work on supertasks in classical mechanics. We model these as trajectories in phase space. If your initial conditions and dynamical laws are deterministic, the trajectory is unique. You're predicting genuine indeterminism inside a deterministic model. That breaks the physics. If the limit isn't determined by the approach, your model isn't continuous, and if it's not continuous, it's not classical mechanics."

  **Reply (90s):** "I'm not doing classical mechanics; I'm doing the metaphysics of the description. In your models, you implicitly add a boundary condition—usually continuity—to force a solution. I'm pointing out that *without* that extra physical assumption, the math doesn't speak. The Reset-Switch case proves this: when we add a rule ('reset to off at limit'), the state is determined. This shows the indeterminacy wasn't in the physics of the switch, but in the lack of a rule for the limit. You're smuggling in a continuity principle I'm explicitly withholding."
  *   **Concession:** "I concede that if we stipulate physical continuity as a law, my gap disappears, but that confirms my point: the gap comes from missing laws, not the task."
  *   **Soft Spot:** Distinguishing 'the model' from 'the physical reality' when the audience thinks the model *is* the reality.
  *   **Force:** **Medium.** They can grant the logic but dismiss the relevance.

  ### 4. THE PHYSICIST 2 (Finite Bandwidth/Realist)
  **Objection:** "This whole literature ignores that real switches have finite bandwidth and mass. You can't flip infinitely fast. The switch melts or the circuit breaks at $t=1$. The state is 'broken,' not 'indeterminate.' You're solving a puzzle that only exists because you're ignoring the physics of the switch."

  **Reply (90s):** "I agree physically. But the philosophical puzzle isn't about engineering limits; it's about conceptual coherence. Even if we idealize the switch to have zero mass, the logical problem remains. The Pre-Loaded Lamp case helps here: even if the switch survived the past infinite flips, the algebraic parity is still undefined. I'm using the idealization to isolate the metaphysical structure from the physical noise. If the idealized case is underdetermined, then 'physical impossibility' isn't the only reason the task fails to yield a result."
  *   **Concession:** "I concede the scenario is physically unrealizable, but that doesn't dissolve the conceptual underdetermination."
  *   **Soft Spot:** Why care about metaphysical possibilities that are physically nomologically impossible?
  *   **Force:** **Low.** Standard move in this literature. Wave off with "idealization."

  ### 5. THE EARLY MODERN SPECIALIST
  **Objection:** "This is Leibniz's Law of Continuity all over again. 'Nature makes no leaps.' If the lamp is oscillating up to $t=1$, and you claim a state at $t=1$, you're positing a leap. If you claim no state, you're positing a gap. Leibniz would say the description is simply unintelligible because it violates the principle that the effect must be contained in the cause."

  **Reply (90s):** "Leibniz would indeed reject the supertask. But I'm granting the task for the sake of argument to see what follows. My point aligns with Leibniz on the result: you cannot derive the terminal state from the prior states alone. Where I diverge is saying that makes the story *impossible*. I say it makes the story *incomplete*. The Pre-Loaded Lamp shows this isn't about 'leaps' in time, but about the information content of the history. The history doesn't contain the terminal coordinate. That's not a violation of continuity; it's a recognition that the sequence doesn't converge."
  *   **Concession:** "I concede Leibniz would reject the premise of the supertask entirely, whereas I'm accepting it to analyze the consequence."
  *   **Soft Spot:** Historical accuracy vs. argumentative utility. Don't get bogged down in exegesis.
  *   **Force:** **Low.** Mostly contextual flavor.

  ### 6. THE "HOPE NOBODY ASKS" (Supervenience/Inheritance)
  **Objection:** "You say there's no fact at $t=1$. But the state of the world at $t=1$ must supervene on the state of the world at $t<1$ plus the laws. If the history is fixed and the laws are fixed, how can the future *not* be fixed? You're denying Humean supervenience at the limit point. What connects the past to the future if not determination?"

  **Reply (90s):** "I am denying that the 'laws plus history' package you described is actually complete. The 'law' of the lamp is 'toggle at $t_n$.' That law applies only at $t_n$. It says nothing about $t=1$. Supervenience holds: the state at $t=1$ supervenes on the *total* relevant base. I'm arguing the sequence of toggles isn't the *total* base. You need a limit-rule. In the Reset-Switch case, the limit-rule is provided, and supervenience is restored. In the standard case, the base is incomplete, so the supervenience relation has nothing to latch onto. It's not magic; it's a missing premise."
  *   **Concession:** "I concede this challenges the intuition that a complete history of events *should* be a complete supervenience base."
  *   **Soft Spot:** This is the strongest objection. It attacks the intuition that "everything else being equal, the future is fixed."
  *   **Force:** **Critical.** If they buy this, Pluralism looks like a denial of causation.

  ---

  ### STRATEGIC ASSESSMENT

  **Which reply has to land?**
  **The Metaphysician (Objection 2).** The chapter stands or falls on whether "no fact of the matter" is treated as a substantive metaphysical claim or a linguistic dodge. If you can't explain the ontological status of the gap without positing a "fact about the gap," the Metaphysicians will eat you alive. You must sell the "algebraic underdetermination" line hard.

  **Which objections have real force?**
  1.  **Metaphysician (Grounding):** See above.
  2.  **"Hope Nobody Asks" (Supervenience):** This is the philosophical engine of the room. If the future doesn't supervene on the past, you've broken more than just a lamp.
  3.  **Mathematician:** If they decide you're misusing partial functions, you lose the analogy.

  **Which can be waved off?**
  1.  **Physicist 2 (Bandwidth):** Standard "idealization" defense works here.
  2.  **Early Modern:** Keep it brief; don't let it become a history seminar.

  **Where to say "That's a paper of its own"?**
  If the **Mathematician** pushes hard on whether you need a paraconsistent logic or a three-valued logic to formalize this. Say: *"Formalizing the valuation function is a technical project for the appendix; here I'm arguing for the metaphysical interpretation of the standard model."*

  If the **Physicist 1** argues about the physical realizability of the trajectory in relativistic spacetime. Say: *"Whether spacetime permits this trajectory is a question for philosophy of physics; I'm asking what the trajectory implies if granted."*

  ### FINAL NOTE ON TONE
  Stand still. Do not pace. When the Metaphysician asks about truthmakers, look them in the eye. Do not smile when you say "there is no fact." Treat the gap as a feature, not a bug. Use the **Pre-Loaded Lamp** early to disarm the "limit point" worries—make them see the algebra, not the calculus.
