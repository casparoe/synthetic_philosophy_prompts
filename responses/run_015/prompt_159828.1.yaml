  # JOINT STATEMENT OF INQUIRY: ON THE NATURE OF ANALOGICAL SLIPPAGE

  **Date:** October 26, 2023
  **Parties:** [Friend's Name] (Structuralist Position) & [User's Name] (Dynamicist Position)
  **Mediator:** Philosopher of Cognitive Science

  ## PREAMBLE
  We acknowledge that our disagreement regarding the Copycat microdomain (specifically the `abc : abd :: xyz : ?` problem) is not merely about puzzle answers, but concerns the fundamental architecture of human concepts. We agree to suspend the goal of "winning" the argument in favor of characterizing the precise empirical and metaphysical points of divergence. The following document outlines our common ground, our specific disagreements, and the empirical tests we agree would adjudicate them.

  ## 1. AGREED CLAIMS
  *Both parties sign below to indicate acceptance of these baseline premises.*

  1.  **The Baseline Consensus:** On "cold start" probes with clear paths (e.g., `abc : abd :: ijk : ?`), the overwhelming modal response (`ijl`) indicates a shared cognitive baseline. Any viable theory must predict this mode with high probability.
  2.  **The Existence of Slippage:** Both parties agree that "slippage" occurs (e.g., mapping `rightmost` to `leftmost`, or `successor` to `predecessor`). We disagree on whether slippage is a *deviation from a rule* (Friend) or a *reconfiguration of the conceptual landscape* (User).
  3.  **Constraints on Freedom:** Neither party claims that "anything goes." Responses like `apple` or `123` are universally rejected. There are structural constraints on analogy; the dispute is about the rigidity of those constraints.
  4.  **The Role of Distribution:** A successful account must explain not only the most common answer but the *distribution* of rare answers (e.g., `xya`, `wyz`, `xy`). We disagree on whether the shape of this distribution is data to be explained (User) or noise to be averaged out (Friend).
  5.  **Definition of "Rule":** We agree to use the term "Rule" provisionally to mean "a consistent mapping relation between source and target." We acknowledge we may mean different things by "consistent" (see Section 2).

  ## 2. DISAGREEMENTS TABLE
  *Each position is phrased charitably, as its holder would articulate it.*

  | Domain | Structuralist Position (Friend) | Dynamicist Position (User) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **Ontology of the Answer** | There exists a single normatively correct answer for any given probe, determined by the optimal rule hierarchy. Human disagreement is performance error around this truth. | There is no answer independent of the cognitive process that generates it. "Correctness" is an emergent property of conceptual pressure settling into a stable state. | **Is there a "God's Eye" answer key?** |
  | **Variance & Noise** | The distribution of answers (e.g., 40% say A, 10% say B) reflects cognitive noise (attention lapses, working memory limits). The scientific goal is to filter this to find the underlying rule. | The distribution *is* the phenomenon. Different answers represent different stable conceptual configurations. Variance is signal, not noise. | **Is variance error or feature?** |
  | **Context Sensitivity** | Context (e.g., previous puzzles) may prime certain rules, but this is an artifact to be controlled. The "true" rule should be robust across contexts. | Context is constitutive. Concepts are fluid; showing an easy probe before a hard one legitimately changes the conceptual landscape of the second probe. | **Is context interference or definition?** |
  | **Randomness ("Temperature")** | Randomness in a model is a fudge factor to cover ignorance of the search heuristic. A perfect model would be deterministic. | Randomness models the essential flexibility of perception. A deterministic model would be too rigid to capture human creativity. | **Is randomness a bug or a mechanism?** |

  ## 3. EMPIRICAL ADJUDICATIONS (CONCRETE TESTS)
  *For each crux, we propose a test. Both parties commit to accepting the implications of the results as described.*

  ### Test A: The Distribution Shape (Addressing Variance)
  *   **Method:** Administer the `xyz` probe to 1,000 participants. Analyze the distribution of answers.
  *   **Friend's Prediction:** The distribution will be **unimodal and normal** (bell-curve shaped) around the single correct answer. Outliers will be random and uncorrelated.
  *   **User's Prediction:** The distribution will be **multimodal**. There will be distinct clusters of answers (e.g., a `xya` cluster, a `wyz` cluster) corresponding to different conceptual frameworks, not a smooth gradient of error.
  *   **Adjudication:** If the distribution is clearly multimodal with distinct rationales for each mode, the User wins. If it is a sharp peak with random scatter, the Friend wins.

  ### Test B: The Priming Probe (Addressing Context)
  *   **Method:** Group 1 solves `abc : abd :: ijk : ?` (Standard) immediately before `xyz`. Group 2 solves `cba : dba :: kji : ?` (Predecessor/Leftward priming) immediately before `xyz`.
  *   **Friend's Prediction:** No significant difference in the modal answer for `xyz`. The "true rule" for `xyz` is intrinsic to the string and should not be swayed by immediate history. Any shift is temporary noise.
  *   **User's Prediction:** Group 2 will show a statistically significant shift toward predecessor/leftward answers (e.g., `wyz`) compared to Group 1. The concept of "successor" has been fluidly shifted by the context.
  *   **Adjudication:** If context reliably shifts the *mode* (not just reaction time), the User wins.

  ### Test C: The Cognitive Load Probe (Addressing Randomness)
  *   **Method:** Participants solve `xyz` under high cognitive load (e.g., holding a 7-digit number in memory) vs. low load.
  *   **Friend's Prediction:** High load increases **random error** (more nonsense answers, slower times), but the *ratio* of valid alternative answers (e.g., `xya` vs `wyz`) remains constant among the correct solvers.
  *   **User's Prediction:** High load increases **"Temperature."** This will systematically shift the distribution toward more "creative" or distant slippages (e.g., more `xya` or `drop-z` answers), not just random noise.
  *   **Adjudication:** If load changes the *type* of slippage systematically, the User wins. If it only increases failure rates, the Friend wins.

  ## 4. NOVEL PROBE: THE "ALIEN ALPHABET" BOUNDARY TEST
  *This probe was designed by the Mediator to specifically test the rigidity of the "Successor" concept.*

  *   **Method:** Participants are taught a miniature, closed alphabet: `K - L - M - N`. They are told explicitly: "In this system, N is the end. There is nothing after N." They then solve: `KLM : KLN :: LMN : ?`
  *   **Friend's Prediction:** Participants will overwhelmingly choose the "Drop" or "Stop" answer (e.g., `LMN` or `LM`). Since the rule is "Successor," and the system defines no successor for N, the rule cannot apply. They will not wrap around unless explicitly told the system wraps. The abstract rule respects the defined boundaries.
  *   **User's Prediction:** A significant portion of participants will **spontaneously wrap** (answering `LMK`) or **slip to Predecessor** (`LMM`), despite being told N is the end. The entrenched concept of "alphabet" from long-term memory exerts pressure that overrides the local instructions under the stress of the analogy. The concept of "letter sequence" is fluid and bleeds from prior knowledge.
  *   **Why this discriminates:** The Friend believes rules are applied to the *current representation*. If the representation says "End," the rule stops. The User believes concepts are *pressured*; the deep habit of "cycles" or "slippage" might override the explicit instruction when the cognitive system seeks a solution.

  ## 5. NOTE ON VERBAL DISPUTE
  *The Mediator identifies the following terminological confusion contributing to the deadlock:*

  *   **The Word "Rule":**
      *   **Friend** uses "Rule" to mean a **Logical Operator**: A prescriptive function $f(x)$ that yields $y$. If $f(x)$ is undefined, there is no answer.
      *   **User** uses "Rule" to mean a **Statistical Regularity**: A description of what people tend to do when pressures align.
      *   **Resolution:** We agree to distinguish between **"Formal Rules"** (Friend's concern) and **"Emergent Regularities"** (User's concern). Our fight is about which of these best describes human cognition.

  *   **The Word "Correct":**
      *   **Friend** means **"Normatively Ideal"**: What a perfect reasoner would say.
      *   **User** means **"Psychologically Actual"**: What the majority of humans settle on given specific pressures.
      *   **Resolution:** We agree that "Normative Correctness" and "Psychological Actuality" may diverge. The dispute is whether Cognitive Science should study the former (Friend) or the latter (User).

