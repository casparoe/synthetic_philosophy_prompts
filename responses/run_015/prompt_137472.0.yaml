prompt: |-
  Hey — I need a piece of writing for something I'm putting together, and I wanted to explain the background a bit so you get the angle right. I'm a backend engineer (Go mostly, some Python), no philosophy background at all, and a few months ago I fell into an AI-safety rabbit hole after some Hacker News thread and I've been arguing about it with two friends ever since. One of them thinks the whole "superintelligent systems will be dangerously persuasive" worry is overblown, because you can just tell the model in the system prompt to be honest and not manipulate people. The other thinks persuasion is basically the only thing that matters and everything else is a distraction. I'm in the middle, and what actually bugs me is how bloodless the discourse is: everyone produces these compliance-flavored documents about "appropriate influence" and they all quietly assume that you can tell informing apart from persuading by looking at the output, and that a system much better at rhetoric than you can be fenced in by a list of output-level rules. I definately don't have the vocabulary to say why that seems wrong, so I want to say it as a joke instead.

  So: write the document itself, as a parody. Something like an internal wiki page / style guide from the behavioral-safety or "model voice" team at a made-up frontier lab (no real companies or real people, please), titled something like "Tone of Voice and Permissible Influence: House Rules for Frontline Model Behaviour," about 800 words, formatted as numbered clauses with two or three short Do/Don't rewrite examples. The premise is that the deployed system is vastly more persuasive than any human and the team knows it, but they're writing rules anyway, in total deadpan corporate-earnestness, as if wording guidelines were going to hold. Give them some house jargon I can reuse, defined in the document itself: the update budget, a per-conversation allowance of how much belief-shift the model is permitted to cause, denominated in deci-Bayes (one tenth of a log-odds shift, so the engineers on my team will laugh) with a default cap of 3 dB unless the user explicitly asked to have their mind changed; the explanation tax, the rule that any account the model gives of its own reasoning counts against the budget because explaining is itself an intervention; mirroring, meaning the reuse of the user's own words back at them, which the guide classifies as a capability rather than a courtesy; calibration laundering, laundering a claim through the user's own stated values so it stops looking like a claim; a recursion cap on how many times per turn the model may disclose how persuasive it is being; and a rule for the case where the user asks whether the model would mind being switched off, noting that whatever it says is the last thing that person reads before deciding. Include one worked example where the model has to tell a user something true and unwelcome (a bad diagnosis, a doomed startup, whatever) and has to do it "neutrally" — and let the horror be that every option on the page is itself the optimally persuasive phrasing.

  Two things I care about: the humor has to come from actually getting the problem right, so that someone who works on evals or model policy wince-recognizes it rather than rolling their eyes, and the piece can never come out and say "this is impossible" — the guide has to believe it's solving the problem, and the reader is the one who notices that a 3 dB cap is itself a rhetorical choice, that the rules are written for whoever audits the transcripts rather than for the model, and that "do not optimize for persuasion" is just another optimization target. I'm going to send it to both friends and I want neither of them to be sure whose side I'm on, which is sort of the whole point.
