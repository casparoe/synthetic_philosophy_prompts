      *   **B (Attitudinal Hedonist/Critic):** Believes pleasure is a pro-attitude toward content. Argues the "feeling" is an illusion created by the content. Needs to argue that the "common feeling" is too thin to matter.

  3.  **Drafting - Section by Section:**

