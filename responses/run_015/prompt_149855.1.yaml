      *   **Core Question 1:** Does Smith's treatment of colonial labor (as value-creating input) conflict with the reality of slave/coerced labor, implying a breakdown of his labor theory of value in this context?
      *   **Core Question 2:** Is the tutor's "secret circulation metaphor" (capital as blood pooling in colonies) textually supported, and is it connected to the labor theory issue?
      *   **Specific Constraint:** I must state what would change my mind (falsifiability conditions) and identify where my reasoning is weakest.

