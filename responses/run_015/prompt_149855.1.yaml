      *   *Key Passage:* Smith often compares money/capital to circulation. In *WN*, he discusses the "circulation of the annual produce." He compares the merchant's capital to blood vessels sometimes (in *Lectures* or metaphorically in *WN*).
      *   *The "Pooling" Idea:* Smith argues capital *diverted* to the colonial trade is withdrawn from nearer employments. It doesn't "pool" there permanently; it's invested there. But the *profit* returns slowly.
      *   *Is it "Secret"?* Probably not secret, but the tutor might be romanticizing Smith's language about "channels of trade" or "currents." Smith does talk about capital being "drawn away" or "forced."
      *   *Connection to Labor:* If capital is stuck in colonies (blood pooling), it's not employing labor at home. This connects to the labor theory (labor at home is unemployed/underemployed).
      *   *Verdict:* The metaphor is plausible as an interpretation of Smith's "diversion of capital" argument, but calling it a "secret circulation metaphor" sounds like tutor flair. It's not a hidden code, but a standard physiocratic influence on Smith (circulation of wealth).

  4.  **Synthesize the Connection:**
      *   Are the two issues connected?
      *   Issue 1 (Labor/Slavery): Colonial labor produces value, but inefficiently due to coercion.
      *   Issue 2 (Capital Circulation): British capital is stuck in distant, risky trades instead of near, fast-turnover trades.
      *   *Connection:* Yes. Smith argues that because the capital is tied up in distant colonies (circulation issue), it supports *less* total labor (industry) than if it were kept at home. The coercion aspect complicates *how much* value that colonial labor produces, but the main economic argument is about the *turnover of British capital*.
      *   *Refinement:* The user asks if the labor theory *breaks*. I need to argue it doesn't break, but it creates a blind spot regarding the *source* of that value (i.e., Smith treats the output as value without fully grappling with the moral/long-term economic sustainability of slavery, though he predicts its demise).

