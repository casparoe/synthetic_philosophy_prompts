      *   *Smith on Colonies:* He argues the monopoly trade diverts capital from nearer markets (Europe) to distant ones (America/West Indies). This lowers the rate of return for Britain overall.
      *   *Smith on Slavery:* Smith is explicitly anti-slavery in *WN* (and *Lectures on Jurisprudence*). He argues slave labor is ultimately more expensive than free labor because slaves have no incentive to work hard.
      *   *The Conflict:* The user asks if treating colonial labor as a value-creating input *breaks* the theory because it's coerced.
      *   *Analysis:* Smith doesn't ignore the coercion. He acknowledges it but argues it's *inefficient*. He doesn't say slave labor creates *no* value, but that it creates *less* value than free labor would. So, the labor theory doesn't necessarily "break," but his *efficiency* argument relies on the idea that coercion dampens labor productivity.
      *   *Connection to Cost:* Smith argues the cost of defending these colonies outweighs the profit. The "hidden tax" is the diversion of capital.
      *   *Verdict:* It's not a breakdown of the labor theory, but rather an application of his efficiency argument regarding labor incentives. However, there is a tension: if value comes from labor, and slave labor is "forced," does Smith account for the moral cost in the economic calculation? Generally, no. He accounts for it in efficiency terms.

  3.  **Deconstruct Core Question 2: The "Circulation/Blood" Metaphor.**
      *   *Tutor's Claim:* Capital is blood, pooling in colonies, not flowing home.
