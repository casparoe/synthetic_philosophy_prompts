answer: |-
  Dr. Aris Thorne dipped her pen into the inkwell. The nib scratched against the rough paper, leaving a dark, permanent mark beside the phonetic transcription: *Oke*. Beside it, in parentheses, she had written: *River (n.)*.

  Kaelo leaned over her shoulder. He shook his head, a slow, rhythmic motion like the water rushing behind them. He pointed a calloused finger at the black script. "Not *Oke*," he said softly. "*Oke-ing*."

  Aris sighed, scratching out the noun marker with a violent cross-hatch. "But I need a subject for the sentence, Kaelo. How do I say 'The Oke is deep'?"

  "You say: 'Deeping happens where Oke-ing is strong.'"

  Aris wrote it down, but the grammar felt like trying to hold smoke in a basket. In English, things persisted. A river was a thing that flowed. In Kaelo's tongue, the flowing was the only reality. There was no container, only the content. She looked at the water. To her, it was a single body moving through space. To Kaelo, it seemed, it was a succession of distinct events, causally linked but never identical.

  She tried again, testing the limits of the temporal phase. "Yesterday, the Oke was higher."

  Kaelo frowned. He picked up a loose stone and dropped it into the current. The water rushed around it, instantly changed, swirling anew. "Yesterday Oke is dead. Today Oke is new. They look same, like fire looks same from moment to moment. But yesterday-fire is not today-fire."

  "So how do I refer to the continuity?" Aris asked, her pen hovering. "If I want to warn a traveler that this stretch is dangerous?"

  "You say: 'Danger happened here before. Danger may happen here again.'"

  "But not 'The River is dangerous'?"

  Kaelo laughed softly. "No river. Only water-passing. You speak as if the water stays. As if the bed stays." He tapped the rock beneath them. "Even this sleeps and wakes."

  Aris looked at her manual. Page after page was filled with nouns. *Tree. Mountain. Person.* She had cataloged their world as a museum of static objects. But every time she tested a sentence, Kaelo dismantled her structures. She pointed to a man walking downstream, a figure silhouetted against the bank. "Toma."

  "Toma-now," Kaelo corrected immediately.

  "What about Toma yesterday?"

  "Toma-before. Different Toma."

  "But he is the same person," Aris insisted, her voice tightening. "He has the same name. He remembers his childhood."

  "Name is a song," Kaelo said. "Song continues. Singer changes. You write 'Toma is tired.' You mean 'Tiring is happening to Toma-now.'"

  Aris capped her pen. The sun was setting, casting long shadows across the water. To her, the river was a silver ribbon enduring through the dusk. To Kaelo, it was a million distinct silver flashes, each dying as it was born. She opened a fresh page in the manual. *Section 4: Time and Place.*

  She hovered the pen over the paper. If she wrote "The Oke persists," she was lying. If she wrote "The Oke is a series of distinct events," English speakers would misunderstand the utility of the word. They needed a hook to hang the meaning on. They needed a thing.

  "How do I translate 'I will meet you at the Oke tomorrow'?" she asked quietly.

  Kaelo thought, watching the current tear around a submerged branch. "You say: 'I will meet you where Oke-ing is like this Oke-ing, when Oke-ing is new again.'"

  Aris wrote it down. It took three lines to say what English did in ten words. And still, it felt wrong. It implied a separation that their language dissolved. She looked at the word *Oke* again. It sat on the page, static, black, dead. A corpse of a process.

  "You cannot write it," Kaelo said, watching her stare at the ink. "Writing kills the doing. You make it a stone."

  "I have to," Aris said. "Otherwise no one will understand."

  "Then they will not understand," Kaelo replied. "They will understand you. Not us."

  Aris dipped her pen. She crossed out *River (n.)*. She wrote *Event-sequence (approx.)*. It was still a lie. She wrote *Thing (for convenience)*.

  The ink dried, fixing the error permanently. She turned the page, continuing to fill the notebook with nouns, building a bridge of objects across a world of flow, knowing every step was sinking into the water.
