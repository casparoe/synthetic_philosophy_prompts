answer: |-
  # The Domain of Expectation: Dissolving the Pasadena Paradox

  The Pasadena paradox is frequently presented as a devastating counterexample to Expected Utility Theory (EUT). It appears to show that a rational agent, adhering to the axioms of EUT, can be confronted with a lottery that possesses no determinate expected value, thereby rendering the theory incapable of guiding choice. However, this diagnosis misidentifies the source of the trouble. The paradox does not demonstrate that EUT is false; rather, it demonstrates that the domain of EUT is not universal. The paradox arises from the auxiliary assumption that every admissible lottery must be representable by a single, real-valued expected utility.

  This argument contends that the standard Pasadena lottery (and its symmetric variants) should be treated as a case where the expected utility is mathematically undefined because the payoff variable is not integrable. By restricting EUT to the domain of integrable lotteries and employing weaker coherence conditions for the remainder, we can preserve the normative force of EUT without succumbing to the paradox. Furthermore, adopting a partial-preference account avoids the pitfalls of intransitivity while acknowledging the structural limits of rational comparison in infinite contexts.

  ### 1. The Integrability Failure of the Pasadena Lottery

  To locate the paradox, we must first formalize the lottery described. Let $L$ be a lottery with outcomes defined over the integers $k \geq 0$.
  *   **Positive Outcomes:** $x_k = 2^k$ with probability $p_k = 1/2^{k+2}$.
  *   **Negative Outcomes:** $y_k = -2^k$ with probability $q_k = 1/2^{k+2}$.

  Note that the total probability sums to unity: $\sum (p_k + q_k) = \sum (1/2^{k+1}) = 1$.

  In standard measure-theoretic probability, the expected value $E[X]$ of a random variable $X$ is defined as the Lebesgue integral $\int X \, dP$. A necessary condition for this integral to exist as a finite real number is that $X$ be **integrable**, meaning $E[|X|] < \infty$. This is the condition of absolute convergence. If $E[|X|] = \infty$, the expectation is undefined, regardless of how the positive and negative parts balance intuitively.

  Let us calculate the expectation of the absolute value for the Pasadena lottery $L$:
  $$E[|L|] = \sum_{k=0}^{\infty} |2^k| \cdot \frac{1}{2^{k+2}} + \sum_{k=0}^{\infty} |-2^k| \cdot \frac{1}{2^{k+2}}$$
  $$E[|L|] = \sum_{k=0}^{\infty} \frac{1}{4} + \sum_{k=0}^{\infty} \frac{1}{4} = \infty + \infty = \infty$$

  Because $E[|L|]$ diverges, $L$ is not in $L^1$ (the space of integrable functions). Consequently, the expected utility is undefined. We can see this explicitly by separating the positive and negative parts of the expectation:
  $$E[L^+] = \sum_{k=0}^{\infty} 2^k \cdot \frac{1}{2^{k+2}} = \sum_{k=0}^{\infty} \frac{1}{4} = +\infty$$
  $$E[L^-] = \sum_{k=0}^{\infty} -2^k \cdot \frac{1}{2^{k+2}} = \sum_{k=0}^{\infty} -\frac{1}{4} = -\infty$$

  The total expectation would require evaluating $\infty - \infty$, which is indeterminate in standard analysis. The paradox emerges only if we insist that a rational agent *must* assign a real number to this lottery. If we accept that some gambles are simply non-integrable, the "paradox" dissolves into a boundary condition of the theory.

  ### 2. The Arbitrariness of Summation Conventions

  One might object that we can assign a value to the lottery by summing the series $\sum x_i p_i$ in a specific order. However, because the series is not absolutely convergent, the value of the sum depends entirely on the order of summation, the grouping of terms, or the method of truncation. There is no "natural" ordering inherent to the lottery itself.

  In the context of infinite series, the Riemann Rearrangement Theorem implies that if a series is conditionally convergent (or divergent in the manner of the Pasadena lottery where positive and negative parts diverge), one can rearrange the terms to converge to any real number, or to diverge to $\pm \infty$. While the specific Pasadena variant described above has terms of constant magnitude ($1/4$), making it divergent rather than conditionally convergent in the strict harmonic sense, the core issue remains: **the limit of partial sums is not invariant under rearrangement.**

  Consider two conventions for truncating the lottery to approximate its value:
  1.  **Pairwise Truncation:** We group the $k$-th positive outcome with the $k$-th negative outcome. The expected value of each pair is $(2^k \cdot \frac{1}{2^{k+2}}) + (-2^k \cdot \frac{1}{2^{k+2}}) = 0$. Summing these pairs yields a limit of **0**.
  2.  **Positive-Heavy Truncation:** We sum two positive outcomes for every negative outcome. The partial sums will drift toward **$+\infty$**.
  3.  **Negative-Heavy Truncation:** We sum two negative outcomes for every positive one. The partial sums will drift toward **$-\infty$**.

  Since the physical setup of the lottery does not specify an order in which outcomes are "realized" or summed (probabilities are static, not temporal), choosing one truncation convention over another is arbitrary. To assign a specific expected utility (e.g., 0) is to import an external mathematical convention that has no grounding in the decision problem itself. Therefore, the assumption that every admissible lottery must have a single real-valued expectation forces us to accept an arbitrary value as rational, which is untenable. It is more principled to declare the expectation undefined.

  ### 3. A Restricted-Domain and Partial-Preference Account

  If we abandon the requirement that all lotteries have expectations, how do we guide choice? The solution is a **restricted-domain account** of Expected Utility Theory combined with a **partial-preference structure**.

  **Restricted Domain:** EUT remains the gold standard for decision-making, but its jurisdiction is limited to the set of integrable lotteries ($L^1$). Within this domain, the axioms of von Neumann and Morgenstern hold, preferences are complete and transitive, and choices are made by maximizing expected utility. This preserves the vast majority of practical and theoretical applications of EUT where outcomes and probabilities are well-behaved.

  **Partial Preferences for Infinite Lotteries:** For non-integrable lotteries like Pasadena, we cannot rely on a utility function $U(L) = E[L]$. Instead, we rely on weaker coherence conditions that do not require a single scalar value:
  *   **Stochastic Dominance:** If lottery $A$ yields a higher probability of achieving at least value $v$ for all $v$ than lottery $B$, then $A \succeq B$. This holds even for infinite expectations.
  *   **Lottery-Wise Dominance:** If outcome $x_i$ in state $s_i$ for lottery $A$ is always greater than or equal to outcome $y_i$ in state $s_i$ for lottery $B$, then $A \succeq B$.
  *   **Finite Approximation Coherence:** If a sequence of finite truncations of $A$ dominates the corresponding truncations of $B$ for all sufficiently large $N$, this provides a pro tanto reason to prefer $A$, provided the limit is robust to truncation methods.

  Under this view, preferences over the set of all lotteries form a **partial order**. Some lotteries are comparable (e.g., a Pasadena lottery vs. a dominated variant), while others are incomparable (e.g., two distinct non-integrable lotteries with no dominance relation). Incomparability is not a failure of rationality; it is a recognition that the structure of the gambles does not support a determinate ranking.

  ### 4. Responding to the Objection of Cycles and Intransitivity

  A common objection to partial-preference accounts is that they may permit preference cycles or intransitivities, leaving the agent vulnerable to money pumps. If $A \succeq B$ and $B \succeq C$, but $A$ and $C$ are incomparable, does this not violate rationality?

  This objection conflates **incompleteness** with **intransitivity**. A partial order is, by definition, transitive. If an agent's preferences satisfy the axioms of a partial order, then for all $A, B, C$:
  $$(A \succeq B \land B \succeq C) \implies A \succeq C$$
  The "gaps" in the preference relation (incomparability) do not generate cycles. A cycle requires $A \succ B \succ C \succ A$. If the relation is transitive, this is impossible. The worry about money pumps arises only if an agent is *forced* to make a choice between incomparable options and does so inconsistently. However, a rational agent operating under a partial-preference norm is permitted to remain undecided or to refuse the trade when faced with incomparable options.

  Furthermore, insisting on a **total order** (completeness) for infinite lotteries is more costly than accepting incompleteness. To force a total order, one must assign arbitrary real values to non-integrable lotteries (as discussed in Section 2). This leads to violations of **dominance**. For example, if we arbitrarily assign the Pasadena lottery $L$ an expected value of 0, we might prefer a sure thing of $1$ over $L$. But if we modify $L$ slightly to $L'$ such that $L'$ dominates $L$ in every state, yet our arbitrary summation convention assigns $L'$ a value of $-1$, we would prefer $L$ over $L'$. This violates the basic dominance principle, which is more fundamental than expected utility maximization.

  Therefore, a partial order is the more principled response. It respects dominance and avoids arbitrary mathematical conventions. As Robert Aumann argued in his work on utility without completeness, rationality does not demand that an agent be able to compare every conceivable pair of options, especially when those options involve infinite structures that defy standard integration. Declaring such preferences "irrational" because they lack a real-valued representation imposes a mathematical straitjacket on decision theory.

  ### Conclusion

  The Pasadena paradox is not a refutation of Expected Utility Theory, but a reductio ad absurdum of the assumption that every admissible lottery must possess a well-defined expected utility. The symmetric Pasadena lottery fails the condition of absolute integrability ($E[|X|] = \infty$), rendering its expectation undefined. Any attempt to assign it a value relies on arbitrary summation conventions that lack normative justification.

  By restricting EUT to the domain of integrable lotteries and adopting a partial-preference account for the remainder, we preserve the coherence of rational choice. We avoid the arbitrariness of forced values and the violations of dominance that accompany them. While this account accepts incompleteness in preferences over infinite gambles, it maintains transitivity and protects the agent from cycles. The paradox thus serves not as a tombstone for EUT, but as a signpost marking its proper boundary.
