answer: |-
  # Q&A Prep Sheet: *Where Am I? and the Continuum Case*

  **Thesis Core:** The Location Question has no determinate answer until we settle what we want to track (responsibility/continuity). The Continuum Case shows identity migrates via tracking practices, not metaphysical discovery.

  ### 1. The Enactivist (The Setup Attack)
  **Objection:** "Your thought experiment is phenomenologically incoherent. A brain severed from its sensorimotor engagement with the world doesn't have experiences or agency, so there is no 'person' to locate in Houston or Mars. You're tracking a ghost."
  **Reply:** I grant that the *phenomenology* of location dissolves as the loop degrades, but the *attribution* of location remains urgent for the community interacting with the body. Even if the experience fades, the question of who is responsible for the Mars body's actions does not.
  **Concede:** Admit that the *first-person experience* of location likely vanishes before the *third-person attribution* does.
  **Soft Spot:** You are leaning heavily on third-person functional criteria while they deny the first-person reality exists to be tracked.
  **Must Land:** "The puzzle isn't about where the *experience* is, but where we place the *blame*."

  ### 2. The Animalist (Olson Style)
  **Objection:** "You keep asking where the *person* is. I'm telling you the person is the human animal, full stop. The animal is in Houston; the thing on Mars is a remote-controlled corpse. You're confusing biological identity with psychological continuity."
  **Reply:** Even if the animal stays in Houston, our practices of holding agents responsible track the psychological controller, not the biological substrate. If the Mars body commits a crime, imprisoning the Houston animal is unjust, regardless of its biological status.
  **Concede:** Agree that strictly speaking, the *human organism* never leaves Houston.
  **Soft Spot:** Animalists deny that psychological continuity is sufficient for *any* identity claims, not just responsibility.
  **Must Land:** "We are not debating biological survival; we are debating the locus of moral agency."

  ### 3. The Metaphysician (Vagueness/Sorites)
  **Objection:** "This is just a Sorites paradox dressed up as science fiction. You haven't solved the metaphysics of vagueness; you've just asserted that the cut-off is arbitrary. Do you endorse epistemicism, supervaluationism, or ontic indeterminacy?"
  **Reply:** I am not offering a theory of vagueness in the world, but a pragmatic account of why our *concepts* tolerate vagueness until a decision is forced. The indeterminacy isn't a mystery to be solved metaphysically, but a space for normative decision-making.
  **Concede:** Acknowledge the logical structure is identical to a Sorites.
  **Soft Spot:** This sounds like Lewis's "semantic indecision," which many metaphysicians find unsatisfyingly deflationary.
  **Must Land:** "The lack of a cut-off isn't a failure of knowledge; it's a feature of the concept's design."

  ### 4. The Parfitian Reductionist
  **Objection:** "Parfit settled this in 1984: identity is not what matters, psychological continuity is. You've added a slow-motion video to Reductionism without adding any philosophical value. Why isn't this just *Reasons and Persons* with more engineering?"
  **Reply:** Parfit tells us identity doesn't matter; I am explaining *how* we construct the substitute that does matter through specific tracking practices. It is not enough to say identity is vague; we must show how we legislate precision when stakes rise.
  **Concede:** Agree that Parfit is right that strict identity is not the ultimate value.
  **Soft Spot:** It is difficult to distinguish your "tracking practices" from Parfit's "what matters" without sounding repetitive.
  **Must Land:** "Parfit diagnoses the disease; I am prescribing the treatment protocol."

  ### 5. The Systems Neuroscientist
  **Objection:** "Clinically, if the cerebrum is in Houston, the patient is in Houston. If you tell a jury the 'person' is on Mars, you risk malpractice and legal chaos. What is practically at stake here other than confusing the courts?"
  **Reply:** The stake is distinguishing between medical custody, which stays with the brain, and criminal liability, which migrates to the body. Confusion only arises if we assume one 'location' label must serve both medical and legal functions.
  **Concede:** Admit that for *medical treatment*, Houston is the only relevant location.
  **Soft Spot:** Legal systems prefer bright-line rules over context-sensitive tracking practices.
  **Must Land:** "We already accept different criteria for death (brain) and citizenship (body); we can do it for location."

  ### 6. The Hostile Realist (Department General)
  **Objection:** "This is linguistic idealism. You're saying reality depends on our decisions. There is a fact of the matter about where the person is, you're just too timid to state it because the metaphysics is hard."
  **Reply:** I am not saying physical reality changes, but that 'person-location' is a status we confer, not a property we detect, like 'currency' or 'marriage.' There is no hidden fact because the concept is constituted by our practices.
  **Concede:** Agree that the brute physical facts (brain here, body there) are mind-independent.
  **Soft Spot:** In a department hostile to deflation, this will sound like giving up on truth.
  **Must Land:** "Asking for the fact of the matter presupposes there is a single kind of matter to find."

  ### 7. The "Why Not Both?" Objection
  **Objection:** "If the gradient supplies no non-arbitrary cut-off, why force a migration? Why not say the person is partially in Houston and partially on Mars, or wholly in both, until the end?"
  **Reply:** Because our practices of responsibility and punishment require a singular locus of agency to function effectively. We *could* allow dual location, but our social institutions are built on the assumption of singular accountability.
  **Concede:** Admit that in low-stakes contexts, dual location descriptions are harmless.
  **Soft Spot:** This admits the view is driven by institutional convenience rather than ontology.
  **Must Land:** "We draw the line not because the world demands it, but because our courts do."

  ### 8. The Objection I Hope Nobody Asks (The Phenomenological Bullet)
  **Objection:** "In your Continuum Case, suppose the Mars hand is burned. Where is the pain felt? If the brain is idle but still conscious, the pain is in Houston. If the pain is on Mars, the brain isn't needed. You can't have it both ways."
  **Reply:** [DANGER ZONE] This forces a choice between functionalism and phenomenology that the "tracking practice" view tries to sidestep. If I say Houston, I lose the migration thesis; if I say Mars, I lose the neuroscience.
  **Strategy:** Deflect to the *reporting* of pain rather than the *feeling*. "The report originates from Mars, the processing in Houston; the 'where' of the qualia is the wrong question."
  **Why Hope They Don't Ask:** It pierces the functionalist shield and demands a commitment to a theory of consciousness you are trying to bracket.
