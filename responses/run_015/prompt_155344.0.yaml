answer: |-
  Here is the spec. It is designed to break the comfortable loop of panel discourse.

  ### 1. The Requirements

  **1. Causal Mechanism over Morphological Resemblance**
  *   **The Case:** "Both made information cheap" is a observation, not an argument. An analogy must identify the *engine* of change (e.g., reduction in marginal cost, centralization of production, dual-use potential) and the *preconditions* required for that engine to fire (e.g., literacy rates, capital concentration, regulatory vacuum).
  *   **Verdict:** **Non-negotiable.** Without mechanism, you have poetry, not analysis. This is load-bearing for both purposes (a) and (b). If you don't know *how* it breaks things, you can't warn the regulator or comfort the worker.

  **2. Ex-Ante Falsifiability (The Year-Five Test)**
  *   **The Case:** The analogy must generate a claim that can be verified or falsified *before* the historical outcome is known. It must state: "If this is like the Printing Press, we should see X within 5 years." If the only validation is "wait 50 years and see if society looks different," the analogy is a horoscope.
  *   **Verdict:** **Non-negotiable for (b) [Policy], Preference for (a) [Life].**
      *   *Pull Apart:* For the regulator (b), this is essential. For the lived experience (a), it feels cold. A person suffering *now* doesn't care if the mechanism is falsifiable; they care that it hurts. But without this, the analogy cannot guide action.
      *   *Note on your worry:* You asked if stripping hindsight leaves nothing. It leaves *process*. We know how steam engines break bones before we know if they raise wages. The analogy must predict the *transition dynamics*, not the endpoint.

  **3. Distributional Specificity (The Protagonist Requirement)**
  *   **The Case:** The analogy must specify who wins and who loses *during* the transition, not just at the equilibrium. It must name the skill that becomes obsolete and the skill that becomes valuable.
  *   **Verdict:** **Non-negotiable for (a) [Life], Preference for (b) [Policy].**
      *   *Pull Apart:* This is the hardest conflict. A regulator (b) can accept "aggregate welfare increases despite 20% unemployment." A human (a) cannot live inside an aggregate. An analogy that works for GDP often fails for the scribe. If the analogy cannot account for the loser, it is false for purpose (a).

  **4. Temporal Resolution**
  *   **The Case:** The analogy must specify the duration of the "bad part." Did the mill town take one generation or four to become livable? Did the printing press cause war immediately or after a lag? "Eventually" is not a timescale.
  *   **Verdict:** **Non-negotiable.** Both the investor and the worker need to know if the pain is months or lifetimes. Most analogies smuggle in an implicit "fast" or "slow" without justification.

  **5. Reference Class Pre-commitment**
  *   **The Case:** You must state *why* this analogy was chosen over others *before* mapping the traits. Why is AI the Printing Press and not the Telephone? (Telephone centralized communication; Printing decentralized it).
  *   **Verdict:** **Preference (Methodological Rigor).** This prevents shopping, but a mechanism-heavy analogy (Req 1) usually solves this automatically. It's a guardrail, not an engine.

  **False Requirements (Taste, not Truth):**
  *   **Completeness:** The belief that an analogy must explain *everything* about the new technology. This is a category error. An analogy is a map, not the territory. If it explains the labor market shift but not the art style, it is still valid.
  *   **Moral Equivalence:** The belief that the analogy must match morally (e.g., "You can't compare AI to the Bomb because AI isn't evil"). Irrelevant. The mechanism of disruption matters, not the intent.

  **Load-Bearing but Ignored:**
  *   **Path Dependence:** The requirement to acknowledge that history branches. The Printing Press led to the Reformation *and* the Inquisition. An analogy that predicts only one branch is a fairy tale.

  ---

  ### 2. Incompatible Requirements

  **The Aggregate vs. Individual Truth**
  *   **Conflict:** Requirement 3 (Distributional Specificity) vs. Purpose (b) (Regulatory Utility).
  *   **The Reality:** You cannot have an analogy that is simultaneously comforting to the aggregate economy and truthful to the ruined individual. The Industrial Revolution analogy is "true" for GDP (b) and "false" for the Weaver's lifespan (a).
  *   **Verdict:** You must choose which truth you are selling. If you tell the regulator "This is fine, look at the long term," you are lying to the worker. If you tell the worker "You are the cost of progress," you will be barred from the policy room. No analogy resolves this; it only exposes it.

  **Predictive Scope vs. Ex-Ante Verification**
  *   **Conflict:** Requirement 2 (Ex-Ante Falsifiability) vs. The Desire for Grand Prediction.
  *   **The Reality:** The more specific and checkable the claim (e.g., "Wages for copyists will drop 10% in 5 years"), the less it tells you about the Civilizational Shift. The more it tells you about the Shift (e.g., "Religion will fragment"), the harder it is to check before 30 years pass.
  *   **Verdict:** You cannot have both high precision and long-term scope. If an analogy claims to do both, it is likely smuggling in hindsight.

  ---

  ### 3. The Kill Shot

  **Requirement 2: Ex-Ante Falsifiability.**

  **The Argument:**
  This is the only requirement that destroys the unfalsifiable narrative. Panelists love analogies because they are safe; they cannot be proven wrong until everyone in the room is dead. By demanding a claim that can be checked *within the lifespan of the project/funding cycle*, you force the speaker to risk being wrong.
  If they say "It's the Printing Press," ask: "What specific metric should we measure in 2029 to confirm that? If that metric fails, will you admit the analogy is broken?"
  If they cannot answer, they are not making an argument; they are performing a ritual. This requirement alone filters out 90% of panel talk because most speakers are there to soothe anxiety, not to make testable claims.

  ---

  ### 4. The Scorecard

  | Requirement | Printing Press (1450s) | Industrial Revolution (1820s) | Nuclear Weapons (1945) |
  | :--- | :--- | :--- | :--- |
  | **1. Causal Mechanism** | **Pass.** (Marginal cost of text dropped → literacy/fragmentation). | **Pass.** (Mechanization → labor displacement/urbanization). | **Pass.** (Energy density → deterrence/annihilation). |
  | **2. Ex-Ante Falsifiable** | **Fail.** Only visible as "revolution" decades later. | **Fail.** "Engels' Pause" (wages stagnating) invisible in real-time. | **Pass.** Immediate physical capability clear; geopolitical effect unclear. |
  | **3. Distributional Specificity** | **Fail.** Winners (printers) known; Losers (scribes) erased from history. | **Pass.** Clear class antagonism; winners and losers named explicitly. | **Fail.** Aggregate survival vs. individual incineration; no middle class. |
  | **4. Temporal Resolution** | **Fail.** Took 100+ years for full social reorganization. | **Partial.** Generational shift understood, but duration of pain disputed. | **Pass.** Immediate effect (bomb) vs. Long tail (radiation/politics). |
  | **5. Reference Class** | **N/A** (The archetype). | **N/A** (The archetype). | **N/A** (The archetype). |
  | **Overall Utility** | **High for (b), Low for (a).** Good for policy patience, bad for human comfort. | **High for (a), Mixed for (b).** Good for worker solidarity, bad for GDP optimism. | **High for (b), N/A for (a).** Good for regulation, irrelevant for daily life. |
