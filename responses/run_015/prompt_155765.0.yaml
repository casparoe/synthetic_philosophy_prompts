  Here is a brief review of the design, along with a suggestion for calibration:

  ### 1. Constraint Check
  **Status: Met.**
  The prompt instructions ("Analyze three things...") do not request citations, and the marking scheme penalizes content errors rather than bibliographic omissions. This ensures students focus on the argumentation rather than name-dropping specific decision theorists.

  ### 2. Alignment of Question and Rubric
  The mapping between the three questions in the prompt and the five marking categories is logical, though dense:
  *   **Prompt Q1** covers Rubric Items 1 (Framing) and 2 (Evidential vs. Self).
  *   **Prompt Q2** covers Rubric Items 3 (Calculator Objection) and 4 (Logical Correlation).
  *   **Prompt Q3** covers Rubric Item 5 (Coherence/Stance).

  **Suggestion:** Since Q1 and Q2 each carry the weight of two rubric categories (12 marks each), students might benefit from a brief parenthetical note in the prompt suggesting they allocate space accordingly. For example: *(Note: The first two questions address distinct conceptual hurdles; ensure both the identity problem and the calculator objection are fully addressed.)* This prevents students from spending 400 words on Q1 and leaving Q2 underdeveloped.

  ### 3. Word Count vs. Time
  **800 words in 90 minutes** is a tight constraint for this level of abstraction.
  *   **Pros:** It forces precision and prevents waffling, which fits the "rationality" theme.
  *   **Cons:** High-level decision theory often requires setup to define terms clearly.
  *   **Verdict:** Keep it if you want to test concision and clarity under pressure. If you want to test depth of research or exploration, consider raising the limit to 1,000 words.

  ### 4. Instructor Materials
  Ensure the **Model Answer** and **Marking Scheme** sections are kept in a separate document from the student handout. The prompt text itself (from "Question (30 marks)" down to "...X knows all this.") is ready for distribution.

  ### Offer: Full Model Essay
