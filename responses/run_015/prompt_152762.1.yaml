      *The "Third Person" point:* This refers to the Likelihood Ratio. $P(E|H) / P(E|\neg H)$. Old evidence doesn't change $P(E)$, but the *realization* that $P(E|H)$ is high while $P(E|\neg H)$ is low is the confirmation. This bypasses the need for $P(E) < 1$.

      *The "Built-to-Fit" point:* This is the "Accommodation vs. Prediction" debate. If I tweak parameters to fit $E$, $P(E|H)$ is high by construction. If I predict $E$, it's not. The Link Account struggles to distinguish these if $L$ is just "H yields E."

