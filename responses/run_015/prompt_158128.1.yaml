answer: |-
  **PROCEDURE FOR VETTING TRAIT-AND-FUNCTION CLAIMS (V.1.0)**

  **Purpose:** To ensure labels distinguish between observed utility, evolutionary origin, and speculative narrative. To prevent the gallery from presenting organisms as collections of optimally engineered devices.
  **Time:** 15 minutes per label.
  **User:** Interpretive Writer (School-level biology).

  ---

  ### STEP 1: TRAIT INDIVIDUATION
  **Question:** Can you describe the physical feature without using a word that implies a job (e.g., 'grip', 'shield', 'tool')?
  *   **Acceptable:** "Bony protrusion on the mandible", "Dark pigmentation on wings".
  *   **Unacceptable:** "Chin for chewing", "Camouflage coating".
  *   **Action:** If the trait dissolves into its function (e.g., "The camouflage..."), STOP. Return brief. Label must describe morphology only.

  ### STEP 2: ALTERNATIVE HYPOTHESES
  **Question:** Write down one non-adaptive explanation for this trait.
  *   **Menu:** Architectural by-product, co-option (exaptation), ancestral inheritance, developmental constraint, genetic drift.
  *   **Rule:** You must list at least one specific alternative (e.g., "By-product of tooth reduction", not just "Chance").
  *   **Action:** If no plausible alternative exists, note 'None identified'. If alternatives exist but are ignored in the brief, flag for revision.

  ### STEP 3: EVIDENCE GRADING
  **Question:** What evidence is in the brief?
  *   **Grade A:** Direct measurement of selection in the field OR experimental manipulation.
  *   **Grade B:** Correlation between trait and environment across independent lineages (comparative method).
  *   **Grade C:** Handbook assertion, expert opinion, or optimality model only.
  *   **Action:** If Grade C, you cannot claim evolutionary origin.

  ### STEP 4: CLAIM SEPARATION & WORDING
  **Question:** Which claim does the evidence support?
  1.  **Origin:** Selection created the trait. (Requires Grade A or strong B).
  2.  **Maintenance:** Selection keeps the trait. (Requires Grade B).
  3.  **Utility:** Trait is useful now. (Requires Grade C or observation).

  **Wording Rules (Max 60 words):**
  *   **Origin:** "Evolved to..." or "Selection shaped..."
  *   **Maintenance:** "Maintained by..." or "Selection preserves..."
  *   **Utility:** "Functions to..." or "Used for..." (Do not say "Evolved").
  *   **Agnostic (Grade C/Conflicted):** Use these model sentences. They state function without lying about origin. Curator approval guaranteed.
      1.  "Current function: [X]. Evolutionary origin: Complex/Multifactorial."
      2.  "Enables [X]. Structure constrained by [Y]."
      3.  "Useful for [X]. Historical drivers debated."

  ### STEP 5: GALLERY AUDIT (BATCH CHECK)
  **Question:** Look at the set of labels (e.g., a whole case or gallery).
  *   **Count:** How many claim definitive Adaptive Origin ("Evolved to")?
  *   **Trigger:** If >50% of labels claim Adaptive Origin without mentioning constraints or alternatives.
  *   **Revision:** Convert the lowest-evidence labels to Utility or Constraint claims. Ensure the gallery does not imply every feature is an optimal solution.

  ### STEP 6: CERTIFICATION & VALUES
  **Curator Sign-off:**
  *   **Factual:** The Curator certifies the Evidence Grade (A, B, or C) matches the brief.
  *   **Value Judgment:** If evidence is Grade C but funders demand a "Why" story, the Curator must sign off on the risk of overclaiming. This is where the procedure stops being factual. The Curator accepts liability for misleading 200,000 visitors.

  ---

  ### CASE STUDY RUNS

  **1. Peppered Moth (Dark Form)**
  *   **Step 1 (Trait):** "Dark pigmentation on wings". (Pass).
  *   **Step 2 (Alternatives):** "Genetic drift". (Pass).
  *   **Step 3 (Evidence):** Grade A/B. Industrial melanism documented; predation experiments conducted; independent origins in industrial regions.
  *   **Step 4 (Claim):** Origin & Maintenance.
  *   **Step 5 (Wording):** "Dark pigmentation evolved to match soot-blackened bark. Selection maintains this trait in industrial regions where light forms are easily spotted by predators. Independent origins confirm adaptive value." (26 words).
  *   **Verdict:** **PASS.** Definitive wording permitted.

  **2. Human Chin**
  *   **Step 1 (Trait):** "Bony protrusion on the mandible". (Pass).
  *   **Step 2 (Alternatives):** "By-product of tooth reduction", "Sexual signal". (Pass).
  *   **Step 3 (Evidence):** Grade C. Briefs conflict (mechanical stress vs. mate choice). No direct measurement.
  *   **Step 4 (Claim):** Utility only. Origin unknown.
  *   **Step 5 (Wording):** "Current function: Uncertain. Enables mechanical stress resistance. Evolutionary origin: Debated. Possibly a by-product of facial shortening or selected for mate signalling." (21 words).
  *   **Verdict:** **PASS (Agnostic).** Curator must accept "Debated/Uncertain". If Curator refuses, label must describe shape only: "Bony protrusion on the mandible. Function unclear."

  **3. Survival Gallery (25 Specimens)**
  *   **Step 1-4:** Assume individual labels pass.
  *   **Step 5 (Audit):** 25/25 labels say "Evolved to survive...".
  *   **Trigger:** 100% Adaptive Origin claims. Exceeds 50% threshold.
  *   **Revision:** The format is flawed. It presents organisms as perfect machines.
  *   **Action:** Rewrite 13 labels. Change 5 to "Constraint" (e.g., "Size limited by heat loss"), 5 to "Utility" (e.g., "Used for..."), 3 to "Exaptation" (e.g., "Co-opted from...").
  *   **Verdict:** **FAIL (Format).** The gallery narrative must change to include non-adaptive stories, even if funders dislike it.

  ---

  ### LIMITATIONS STATEMENT

  This procedure cannot resolve unsettled biology. In cases of deep time, early hominins, or behaviour leaving no fossil trace, Evidence will consistently grade C. The procedure will systematically return **NOT ESTABLISHED** for origin claims.

  **Consequence:** The gallery will say nothing about *why* these traits evolved. It will describe *what* they are and *what* they do now. This creates silence in the narrative. You must accept that a blank space on the wall is more honest than a confident lie. If the museum cannot tolerate silence, this procedure cannot protect it from criticism.
