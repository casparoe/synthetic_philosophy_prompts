      *   **User Knowledge Level:** Decent working knowledge of Husserlian phenomenology (internal time-consciousness, retention-protention, noesis-noema, perception-phantasy).
      *   **Task:** Translate the Malcolm-Dennett debate on dreams into Husserlian vocabulary.
          *   *Malcolm:* Dreams are not experiences (no subject present). Map to retentional-protentional absence or noetic-noematic failure?
