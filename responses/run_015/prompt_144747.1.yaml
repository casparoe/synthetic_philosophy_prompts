    "coherence_check": "The view is incoherent because it claims neutrality while leveraging data structures constituted by historical inequality, creating a contradiction between the claimed blindness of the model and the structural visibility of the proxies.",
    "underdetermination": "Yes, predictive pragmatism could license the same practice based solely on accuracy without making ontological claims, though the specific moral defense of fairness relies on the contradictory nominalist view.",
    "replacement_consequences": "Adopting a constructionist view would require auditing variables for structural correlation rather than just predictive power, disclosing the social history of data sources, and reframing risk language as institutional judgment rather than objective discovery."
  }
