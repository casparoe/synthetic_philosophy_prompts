answer: |-
  The institutional practice presupposes a hybrid ontology that combines nominalism regarding protected classes with a naive realism regarding behavioral data. By treating race and gender as nonexistent unless explicitly labeled in the code, the bank operates on the view that social kinds are merely linguistic tags rather than structural realities. Simultaneously, it treats behavioral metrics and consumption clusters as natural kinds—objective, pre-social facts about an individual's reliability. This implies that bias is solely a matter of intentional categorization, often called disparate treatment, rather than an emergent property of correlated data structures, or disparate impact. The bank assumes that if the label is removed, the social kind is absent, ignoring the possibility that the data itself is constituted by the history of those kinds.

  This view is fundamentally incoherent because it severs the causal link between historical oppression and present-day data patterns. If neighborhoods and consumption habits are tightly mapped onto race and class due to segregation and wealth gaps, then using them as neutral inputs is not ontologically innocent; it is importing the history of those social kinds without admitting their name. The contradiction lies in claiming the model is "blind" while feeding it data that sees perfectly well. The practice depends on the fiction that creditworthiness is an intrinsic property discoverable through behavior, rather than a relational status constructed by the lender's own risk thresholds and the historical data they inherit. It attempts to have it both ways: leveraging the predictive power of social structure while claiming the moral immunity of individualism.

  Regarding underdetermination, a strict predictive pragmatism could license the same practice without relying on the specific nominalist theory of race. A pragmatist might argue that the ontology of the data doesn't matter, only the accuracy of the loss prediction, rendering the question of social kinds irrelevant to the engineering task. However, the bank's specific defense—that they are fair because they don't ask for race—relies on the nominalist view to make a moral claim, not just a financial one. Therefore, while the practice could be justified by amoral profit maximization, the moral claim of neutrality requires the contradictory ontological stance identified above. Rival theories, such as critical realism, would deny the neutrality but might still use the data for mitigation rather than exclusion, showing the practice isn't strictly determined by one theory, but the justification is.

  If we replaced this with a straightforward social-constructionist theory, the data pipeline would need to shift from feature extraction to feature auditing. Institutions would have to test variables not just for predictive power, but for their constitutive relationship to protected classes, potentially removing high-correlation proxies even if they are predictive. Disclosure rules would need to move beyond listing data sources to explaining the social context of those sources, acknowledging that a zip code is not just geography but a history of policy. Finally, risk-language would change from describing "objective probability of default" to "institutional tolerance for risk given historical inequities," framing creditworthiness as a judgment call rather than a discovered fact. This would require admitting that the model does not measure risk neutrally but rather enforces a specific distribution of opportunity.

