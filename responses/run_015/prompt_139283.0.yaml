  Concrete alternative plans. Show me a 1934 Papen cabinet memo outlining a stable authoritarian regime with no war plans. Show me Einsatzgruppen logs indicating initiation of mass shooting without Führer directives. Show me Nazi internal memos where Hitler *stops* radicalization rather than arbitrating it. Decision chains that bypass the Führer principle are your biggest threat. I need evidence that the bureaucracy had independent momentum toward extermination that Hitler merely signed off on, rather than drove. Specifically, find instances where radicalization stalled without his intervention.

  Bottom line
  Your view is robust on coalition mechanics but vulnerable on bureaucratic radicalization. Admit Hitler built the vehicle (1920s) to save the 1933 claim. Accept that without falsifiable evidence, this remains a high-probability narrative, not a law. It's a strong historical argument, provided you don't overclaim certainty. Focus on the decision chains; if they lead back to him, you win. If they bypass him, you lose. Your instinct on decision chains is correct; prioritize them over psychology.
