  # The Combination Problem: A Decision Tree

  **Starting Commitment:** There is something it is like to be an ordinary awake human being, and this fact has some ground in the intrinsic or categorical nature of the physical.

  **Technical Terms:** A *subject of experience* is an entity for which there is something it is like to be. The *intrinsic base* is the non-relational physical property grounding consciousness. *Phenomenal bonding* is an irreducible relation uniting subjects. The *decomposition problem* is the cosmopsychist's challenge to explain how one cosmic subject yields many apparent individuals.

  1.  **The Census.** In a room containing three awake humans, one human in dreamless sleep and a cat, how many subjects of experience are located where the awake humans are?
      *   None.
          *   **Leaf 1: The Outsider.** (Illusionism/Functionalism).
      *   Many (Micro-subjects only, no human subject).
          *   **Leaf 2: Macro-eliminativism.**
      *   One (Human subject only, no micro-subjects).
          *   **Leaf 3: [Empty Cell].** *Diagnosis:* Merely unattractive; denies physical ground without gaining simplicity.
          *   **2. The Grain Shift.** Suppose we discovered the intrinsic base is instantiated at the level of whole neurons rather than fundamental particles. Does consciousness vanish?
              *   Yes (Consciousness requires coarse grain).
                  *   **Leaf 4: Panprotopsychism / Grain Solution.**
              *   No (Consciousness remains).
                  *   **3. The Organoid and the Colony.** Does a cortical organoid of a million neurons possess a subject of experience?
                      *   Yes (Subjecthood is continuous or cosmic).
                          *   **Leaf 5: Cosmopsychism.**
                      *   No (Sharp threshold at human level).
                          *   **Leaf 6: Brute Emergence.**
                      *   **Leaf 7: [Empty Cell].** *Diagnosis:* Incoherent; posits threshold without mechanism.
      *   Many + One (Micro-subjects and Human subject).
          *   **4. The Inverted-bonding World.** Is a world physically identical to ours with micro-subjects but no unified human subject genuinely conceivable?
              *   Yes (Composition is contingent).
                  *   **Leaf 8: Phenomenal Bonding.**
              *   No (Composition is necessary).
                  *   **Leaf 9: No Further Relation.**
              *   **Leaf 10: [Empty Cell].** *Diagnosis:* Unexplored; micro-subjects exist but cannot combine even in principle.

