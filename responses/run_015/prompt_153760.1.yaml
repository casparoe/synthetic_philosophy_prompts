      *   **Jack's Rise: Cascade vs. Falsification:**
          *   *Initial phase:* It starts as a cascade. The "beastie" rumor spreads. Littleuns cry. Biguns see littleuns crying and think, "Maybe there is something." They update their priors.
          *   *Shift to Falsification:* Once Jack establishes the tribe and uses violence/ritual, it becomes preference falsification. Boys join not because they believe in the beast/Jack's divinity, but because the cost of dissent (starvation, beating, exclusion) is too high.
