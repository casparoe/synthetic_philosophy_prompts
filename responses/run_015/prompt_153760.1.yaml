      *   **Task:** Analyze *Lord of the Flies* through the lenses of *Information Cascades* vs. *Preference Falsification*.
      *   **Specific Questions:**
          1.  Is Jack's rise a cascade (belief update) or preference falsification (hiding doubts)?
          2.  Does Simon's death represent a failed cascade-breaker (suppressed evidence)?
          3.  Where does the book resist being flattened into an economics/model framework? (What does it capture that formal papers miss?)
      *   **Constraints:** No citations, no bibliography, honest take, focus on fear and conformity.

  2.  **Deconstruct the Concepts:**
      *   **Information Cascade:** Person A acts, Person B sees A and ignores their own private signal to follow A, Person C sees A & B and follows, etc. Key: People *actually change their belief* based on others' actions. "I think there's a beast because everyone else is scared."
      *   **Preference Falsification (Kuran):** People publicly support X but privately prefer Y due to social pressure. Key: People *do not change their belief*, they just lie about it to avoid punishment. "I don't think there's a beast, but if I say that, Jack will hit me."
      *   **The Novel (*Lord of the Flies*):** Boys stranded, descent into savagery, fear of the "beast," split between Ralph (order) and Jack (hunt/tribe), Simon's death, Piggy's death.

  3.  **Drafting the Analysis - Section by Section:**

