  2.  **Deconstruct the Rule & Details:**
      *   **Rule:** Recommend if ICER < $\lambda$ (Threshold). Reject if ICER > $\lambda$.
      *   **Metric:** QALYs = $\sum$ (Time $\times$ Quality Weight).
      *   **Weights:** 0 = Death, 1 = Full Health, <0 = Worse than Death.
      *   **Source:** General public surveys (Time Trade-Off style), averaged across respondents (including those who haven't experienced the state).
      *   **Aggregation:** Linear summation across patients.
      *   **Distribution:** Value independent of identity, prior QALYs, or distribution.
      *   **Exceptions:**
          1.  End-of-life (premium for short life expectancy).
          2.  Unmet need (premium for rare/no alternative).
          3.  Spillover (carers/future costs excluded from base case).
      *   **Panel Footnote:** Threshold = Shadow price of fixed budget (opportunity cost).

  3.  **Drafting - Section by Section:**

      *   **Section 1: Comparability Requirements.**
          *   *Summation:* Requires cardinal unit comparability (gains can be added).
          *   *Zero/Negative Weights:* Requires a fixed zero point (Death). This implies ratio scale measurability. If 0 is arbitrary, "worse than death" makes no sense.
          *   *ICER (Division):* Cost/QALY. Requires the QALY unit to be stable across contexts to compare with money.
          *   *Interpersonal:* Summing across patients requires interpersonal level comparability (my 0.5 QALY = your 0.5 QALY).
          *   *Conclusion:* The arithmetic strictly requires *Full Cardinal Unit Comparability with a Fixed Zero* (Ratio Scale). Mere ordinal or interval scaling breaks the "worse than death" and summation logic.

      *   **Section 2: Welfarism vs. Extra-welfarism.**
          *   *Welfarism:* Value = Welfare/Utility.
          *   *Extra-welfarism:* Value = Health (capability/functioning), weighted by social preference.
