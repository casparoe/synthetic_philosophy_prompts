answer: |-
  **Annexe: Conceptual Foundations of the Appraisal Rule**

  This reconstruction isolates the theoretical commitments strictly required to make the guide's arithmetic intelligible, distinguishes them from commitments that merely fit the practice, and identifies structural tensions where the guide presupposes a conjunction of views no single theory would endorse.

  ### 1. The Metric: Requirements of Comparability

  The arithmetic of the rule imposes strict constraints on the scale of measurement. We must distinguish between what is required for summation, what is required for the zero-point, and what is required for the threshold ratio.

  *   **Strict Presupposition (Ratio Scale):** The rule strictly presupposes that QALYs are measurable on a **ratio scale**, not merely an interval or ordinal scale.
      *   *Reasoning:* The allowance for weights below zero (states worse than death) fixes a non-arbitrary zero point. On an interval scale, zero is arbitrary (like 0°C); on a ratio scale, zero represents the absence of the quantity (like 0 Kelvin). If zero were arbitrary, the distinction between "positive" and "negative" QALYs would be meaningless, and the summation of negative weights (penalties) with positive weights (gains) would be mathematically illicit.
      *   *Reasoning:* The calculation of the ICER (Incremental Cost-Effectiveness Ratio) involves division (Cost $\div$ QALY). Division is only meaningful if the unit has a fixed magnitude and origin. If the QALY unit varied in size depending on the context, the threshold $\lambda$ would not be a constant.
  *   **Strict Presupposition (Full Interpersonal Comparability):** The rule strictly presupposes **unit comparability across persons**.
      *   *Reasoning:* The guide sums QALYs linearly across all patients. This operation is unintelligible unless one unit of QALY for Patient A is identical in value to one unit of QALY for Patient B. Without this, aggregation is a category error (adding apples to oranges).
  *   **Compatible Fit (Cardinality):** While the rule requires cardinality (gains can be added), it does not strictly require that the *intensity* of preference matches the weight. It requires only that the *trade-off rates* are consistent. The practice fits a view where individuals can make coherent trade-offs between length and quality of life, but it does not strictly demand that these trade-offs reflect hedonic intensity.

  ### 2. The Currency: Welfarism vs. Extra-Welfarism

  The guide occupies a hybrid position that creates a specific tension regarding the source of value.

  *   **Strict Presupposition (Health as Currency):** The practice is structurally **extra-welfarist**.
      *   *Reasoning:* A strict welfarist view holds that only experienced utility counts. However, the guide derives weights from the *general public* evaluating states they have *never occupied*. If the guide were strictly welfarist, it would be compelled to use the ratings of those actually experiencing the state (patients), as they are the only ones with access to the relevant welfare data. By privileging the public's hypothetical valuation over the patient's experienced valuation, the guide treats health as a social good to be weighted by social preference, not merely as a container for welfare.
  *   **Structural Tension:** The practice mimics welfarism in its currency (QALYs imply "utility") but rejects welfarism in its sourcing (public preference).
      *   *Consequence:* This creates a gap in intelligibility. If QALYs measure welfare, the public cannot know them. If QALYs measure health, the "quality" weighting is a social judgment, not a measurement of the patient's good. The guide proceeds as if these are identical, which they are not.
  *   **What Would Break:** If the guide switched to strict welfarism, it would have to discard the general public surveys and adopt patient-reported outcome measures (PROMs). This would likely alter the weights significantly (the "disability paradox"), potentially changing which treatments cross the threshold. If it switched to strict extra-welfarism (e.g., Healthy Years Equivalents), it might discard the "worse than death" negative weights, as health itself is rarely judged negative, whereas *living* in a state can be.

  ### 3. Distribution: The Base Rule and Its Exceptions

  The guide's stance on distribution is the site of its sharpest internal contradiction.

  *   **Strict Presupposition (Aggregation):** The "no-distributional-weighting" clause strictly presupposes an **unweighted total view** (Classical Utilitarianism) regarding the *base case*.
      *   *Reasoning:* The guide explicitly states value does not depend on identity, prior QALYs, or distribution. This rules out Prioritarianism, which weights gains inversely to lifetime well-being. Since the guide forbids referencing "how many QALYs the patient has already had," it structurally excludes the prioritarian baseline.
  *   **Structural Tension (The Exceptions):** The three standing exceptions contradict the base rule's commitment to an unweighted total view.
      *   *End-of-Life:* This clause permits a premium for short remaining life expectancy. This is neither **Absolute Shortfall** (QALYs lost without treatment) nor **Proportional Shortfall** (fraction of normal life lost). It is a **Time-Remaining** trigger.
          *   *Implication:* A "Time-Remaining" trigger commits the guide to a **Fair Innings** view or a **Rescue Principle**. It suggests a duty to those who have not yet had a "natural span," regardless of the efficiency of the gain. This is incoherent with the base rule's mandate to maximize total QALYs regardless of who gets them. The guide is committed to maximizing the total *unless* the recipient is near death, at which point the metric changes.
      *   *Unmet Need:* Permitting a premium for rarity/no alternatives introduces a weight based on **scarcity of substitutes**, not health gain. This is a market-based or equity-based correction that has no footing in pure health maximization.
      *   *Spillover:* Excluding carer gains from the base case but including them in sensitivity analysis implies that carer health is *real* value but *institutionally* excluded. This suggests the base rule is not a moral truth but a bureaucratic constraint, further undermining the claim that the base rule reflects the "value of a QALY."
  *   **Verdict:** The guide is not committed to a single view of distributive justice. It is committed to an **Aggregative Core with Rescue Overrides**. This is not a coherent theory of justice, but a pragmatic conjunction of maximization and rescue.

  ### 4. The Threshold: Moral Value vs. Shadow Price

  The panel's footnote reinterprets the threshold $\lambda$ as the shadow price of a fixed budget (opportunity cost).

  *   **Analysis:** This reinterpretation **relocates** interpersonal comparisons; it does not remove them.
      *   *Reasoning:* If $\lambda$ represents the health lost by unidentified patients elsewhere in the system, the decision rule becomes: "Fund Treatment A if it creates more health than Treatment B (the displaced care) destroys." This still requires comparing the health of the treated patient with the health of the displaced patient.
      *   *Strict Presupposition:* This view strictly presupposes that the **marginal productivity of health spending is constant** across the system. If the displaced health is not measurable in the same units as the gained health, the shadow price cannot be calculated.
  *   **Verdict:** This is a **change of subject**, not a defence. It explains *why the number is where it is* (budget constraint), but it does not justify *why we maximize health subject to that constraint* rather than maximizing welfare, or equity, or capability. It defends the feasibility of the rule, not its moral authority. It relies on the same interpersonal comparability assumptions as the moral view; it simply hides the moral weight behind a budget constraint.

  ### 5. Counterfactuals: Dropping Comparability

  If the assumption of interpersonal comparability were dropped, the rule as written would cease to be intelligible.

  *   **Strict Requirement:** The linear summation of QALYs across patients is impossible without comparability.
  *   **Alternative Procedures:**
      *   *Social Choice Function:* The rule would have to change from "Maximize Sum" to "Satisfy Constraints." Decision-making would proceed via voting or ranking profiles of individual preferences without aggregating them into a single number. The ICER would disappear.
      *   *Veil of Ignorance:* If the rule were derived from a hypothetical agreement where no one knows their position, the base rule (Maximize Average QALY) might survive *if* agents are risk-neutral. However, the exceptions (End-of-Life) suggest risk-aversion regarding early death. A consistent Veil of Ignorance derivation would likely absorb the exceptions into the main utility function (e.g., by weighting QALYs by age) rather than treating them as overrides.
      *   *Prioritarianism:* To implement this, the guide would need to collect data on **lifetime QALYs** (currently forbidden). The formula would change from $\sum \Delta Q$ to $\sum f(\Delta Q, \text{Baseline})$, where $f$ is a concave transformation.
      *   *Sufficientarianism:* This would require a defined "enough" threshold of health. The cost-effectiveness threshold $\lambda$ would be replaced or supplemented by a health status floor. Treatments lifting patients above the floor would be prioritized regardless of cost-per-QALY.
      *   *Capabilities Approach:* The currency would change from QALYs (preference-weighted time) to **Functionings** (what people are able to do and be). The survey method would change from "How much time would you trade?" to "How central is this functioning to a dignified life?" Linear summation would likely be rejected in favour of a multidimensional vector, as capabilities are often incommensurable.

  ### Summary of Commitments

  | Feature | Strict Presupposition (Unintelligible Otherwise) | Compatible Fit (Licensed by Multiple Views) | Structural Tension (Inconsistent Commitments) |
  | :--- | :--- | :--- | :--- |
  | **Measurement** | Ratio Scale (Fixed Zero); Interpersonal Unit Comparability. | Cardinality (Gains can be added). | None. |
  | **Value Source** | Extra-welfarist (Social valuation of health states). | Welfarist (Use of QALY currency). | Public valuing states they haven't experienced vs. QALYs implying welfare. |
  | **Distribution** | Aggregation (Summing across persons). | Maximization (Seeking the highest total). | Base rule (Utilitarian) vs. Exceptions (Rescue/Fair Innings/Scarcity). |
  | **Threshold** | Constant marginal value of money/health. | Budget Constraint (Shadow Price). | Moral Value (Worth of health) vs. Opportunity Cost (Displaced health). |

  **Conclusion:** The guide strictly presupposes that health is a measurable, ratio-scaled quantity that can be aggregated across persons using social weights. It fits comfortably with a form of social health maximization. However, it is structurally committed to an inconsistency: it asserts an unweighted aggregative view in its base case while instantiating a prioritarian or rescue-based view in its exceptions. The shadow price interpretation explains the budget constraint but does not resolve the moral incoherence of the weighting scheme. To make the guide theoretically coherent, the exceptions must either be integrated into the base metric (e.g., by weighting QALYs by severity) or acknowledged as non-maximizing ethical overrides.
