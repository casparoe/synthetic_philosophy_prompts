          *   *Tension:* If it were pure welfarism, patients' own ratings should dominate (hedonic tone). If it were pure extra-welfarism, why use "quality of life" weights at all? Why not just "health units"? The use of QALYs mimics welfare but the sourcing mimics social valuation.
          *   *Verdict:* The practice fits a "Social Welfarism" or "Health Maximization with Social Weights" hybrid. Strictly, it presupposes that *health is the relevant currency*, but *social preference determines the value*.

      *   **Section 3: Distribution and Exceptions.**
          *   *Base Rule:* "Value does not depend on whose it is." This looks Utilitarian (Unweighted Total).
          *   *Prioritarianism Compatibility:* Prioritarianism weights gains by *absolute* level. The guide says "does not depend on... how many QALYs the patient has already had." This explicitly *rejects* standard prioritarianism (which cares about lifetime well-being).
          *   *Exceptions:*
              *   End-of-life (short life expectancy).
              *   Unmet need (rare/no alternative).
              *   *Analysis:* These *contradict* the base rule's claim of no distributional weighting. They introduce weights based on *circumstances* (severity/rarity).
              *   *Shortfall:* End-of-life uses *Life Expectancy* (time remaining), not Absolute Shortfall (QALYs lost) or Proportional Shortfall (% of life lost).
              *   *Justice View:* Life expectancy trigger suggests a "Fair Innings" argument (everyone deserves a span) or "Rescue Principle" (identifyable lives at risk of imminent end). It is incoherent with the base rule's strict aggregation.
              *   *Verdict:* The guide is committed to an inconsistency: Aggregative Utilitarianism in the base, Prioritarian/Enoughist/Rescue hybrid in the exceptions.

      *   **Section 4: The Shadow Price (Budget) Argument.**
          *   *Claim:* Threshold is opportunity cost, not moral value.
          *   *Analysis:* Does this remove interpersonal comparison? No. It shifts the comparison from "Patient vs. Money" to "Patient A vs. Patient B (displaced)."
          *   *Verdict:* It is not a defense of the *moral* rule, but a description of the *constraint*. It relocates the interpersonal comparison to the displaced population. It doesn't solve the commensurability problem; it just hides the moral weight behind a budget constraint. It's a change of subject from "Why this threshold?" to "What does this threshold represent?"

      *   **Section 5: Dropping Comparability / Alternative Theories.**
          *   *If Comparability Dropped:* QALY summation becomes unintelligible.
          *   *Social Choice:* Would require voting or ranking profiles, not summing.
          *   *Veil of Ignorance:* Would likely support the base rule (maximize average) but might reject exceptions (unless risk aversion is high).
          *   *Prioritarianism:* Would need baseline lifetime QALY data (currently excluded).
          *   *Sufficientarianism:* Would need a "enough" threshold (currently only has cost-effectiveness threshold).
          *   *Capabilities:* Currency changes from QALYs to Functionings. Weights change from preferences to objective lists.
          *   *Verdict:* The rule *cannot* survive dropping comparability. It is structurally aggregative.

  4.  **Refining and Polishing (Self-Correction against Constraints):**
      *   *Check:* Did I distinguish Strict Presupposition vs. Good Fit vs. Inconsistency?
