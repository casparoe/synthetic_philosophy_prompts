answer: |-
  # Game Design: *Silt & Stone*

  **Concept:** A 12-turn strategic simulation where four polities compete for survival in a shared river valley.
  **Pedagogical Goal:** To generate an experiential "attribution gap" between the *recorded history* (events/chronicle) and the *causal reality* (structural variables/lag).
  **Time:** 110 Minutes.
  **Players:** 16 Students (4 Teams of 4).

  ---

  ## 1. Materials & Setup

  **Printables per Team:**
  1.  **Polity Board:** Tracks *Population* (0–50), *Labor* (Fixed 5/turn), *Prestige* (0–10).
  2.  **Action Slips:** Small slips of paper to submit orders secretly (prevents table talk dominating).
  3.  **Chronicle Sticky Notes:** 12 yellow sticky notes per team (one per generation).
  4.  **Prediction Envelope:** Sealed at Turn 6, opened at Turn 12.

  **Instructor Materials:**
  1.  **The Valley Board:** A large central display showing the four polities' **Structural Scores** (hidden from students until the end).
      *   *Variables:* **Ecological Capacity (EC)** and **Social Cohesion (SC)**. Range 0–20 each.
      *   *Pipeline Track:* A 3-turn delay track for Structural Investments.
  2.  **Event Deck:** 24 cards (2 per turn, shuffled).
  3.  **Master Lookup Table:** Determines Event Severity based on (EC + SC).
  4.  **The Archive Wall:** A poster board where sticky notes are placed.
  5.  **Timer:** Visible to all.

  **Room Setup:**
  *   Four tables (one per team).
  *   One central "GM Table" (Instructor).
  *   The Archive Wall visible to all.

  ---

  ## 2. Core Mechanics

  ### A. The Variables
  *   **Population (Pop):** The score. Start at 20. Max 50. If 0, polity is extinct.
  *   **Labor:** Fixed at 5 units per turn.
  *   **Structure (EC & SC):** Hidden from players. Start at 10 each.
      *   *EC (Ecological):* Soil health, irrigation, storage.
      *   *SC (Social):* Roads, laws, trust, administration.
      *   *Decay:* Both decay by 1 point per turn automatically (entropy).

  ### B. Actions (Submitted via Action Slips)
  Teams allocate 5 Labor units among three options:
  1.  **Extract (Cost 1):** +2 Pop immediately. **-1 EC** (added to Pipeline).
  2.  **Maintain (Cost 1):** Prevents -1 Decay for either EC or SC this turn.
  3.  **Invest (Cost 2):** +2 to EC or SC (added to Pipeline).

  ### C. The Lag (Crucial Mechanic)
  *   Actions do **not** resolve immediately.
  *   They enter a **3-Turn Pipeline**.
  *   *Example:* Turn 1 Investment resolves at the *start* of Turn 4.
  *   *Pedagogical Point:* Players cannot correlate Turn 1 decisions with Turn 1 outcomes.

  ### D. Event Resolution
  1.  Instructor draws 1 Event Card per team per turn.
  2.  **Base Impact:** Determined by card (e.g., "Drought" = -3 Pop).
  3.  **Structural Modifier:** The Impact is modified by the *current* (EC + SC) score using the **Lookup Table**.
      *   *High Structure:* Event becomes a footnote or benefit.
      *   *Low Structure:* Event becomes catastrophic.
  4.  **Pop Update:** Apply net change.

  ### E. The Archive Rule
  1.  After resolution, each team writes **one sentence** on a sticky note describing their turn.
  2.  **Constraint:** They must write what they believe "future historians" would find significant.
  3.  They place the note on the **Archive Wall**.
  4.  **Prestige Vote:** Each team awards 1 Prestige Point to the *most memorable* note on the wall (cannot vote self).
      *   *Incentive:* Dramatic events get votes. Quiet structural maintenance does not.

  ### F. Scoring
  *   **Welfare Score (Hidden):** Final Pop + (Final EC × 2) + (Final SC × 2).
  *   **Prestige Score (Public):** Total votes received.
  *   **Goal:** Teams are told to "Ensure the longevity and glory of your polity." (Ambiguity is intentional).

  ---

  ## 3. The Lookup Table (Event Severity)

  *Sum of (EC + SC) determines the "Resilience Tier."*

  | Resilience Tier | Total Score (EC+SC) | Event Modifier | Description |
  | :--- | :--- | :--- | :--- |
  | **Fragile** | 0 – 12 | **Double Damage** | A setback destroys a generation. |
  | **Stable** | 13 – 24 | **Normal Damage** | Events hurt but are survivable. |
  | **Robust** | 25 – 40 | **Half Damage** | Events are absorbed easily. |
  | **Resilient** | 41+ | **Negated** | Events become opportunities (Gain +1 Pop). |

  **Event Deck Composition (24 Cards):**
  *   8x *Minor Shocks* (Base -1 Pop): Pestilence, Local Flood, Trade Dispute.
  *   8x *Major Shocks* (Base -3 Pop): Drought, Invasion, Succession Crisis.
  *   4x *Boons* (Base +2 Pop): Bumper Harvest, New Technology, Alliance.
  *   4x *Catastrophes* (Base -5 Pop): Earthquake, Plague, Famine.

  *Rigging Note:* With 12 turns, every team will draw at least 2 Major Shocks and 1 Catastrophe statistically. Without High Resilience, these are game-ending. This prevents the "Ignore Structure and Win" scenario.

  ---

  ## 4. Minute-by-Minute Timeline (110 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute boards. Explain rules **only**. No theory. Emphasize the 3-turn lag. |
  | **10–15** | **Turn 1** | Teams submit orders. Instructor resolves Pipeline/Events. Teams write Chronicle. |
  | **15–65** | **Turns 2–12** | **5 mins per turn.** Strict timer. <br>1. Submit Orders (1m). <br>2. Resolve Lag/Events (2m). <br>3. Write Chronicle & Vote (2m). |
  | **65–70** | **Mid-Game** | **Turn 6 Pause.** Teams write prediction: *"What will determine the final ranking?"* Seal in envelope. |
  | **70–80** | **Turns 7–12** | Resume game. |
  | **80–85** | **Reconstruction** | **Stop Game.** Cover Valley Board (hide EC/SC). Hand each team *only their own stack* of sticky notes. Task: *"Write a 1-paragraph explanation for why you won/lost."* |
  | **85–90** | **Reveal** | Open Prediction Envelopes. Reveal True Welfare Scores vs. Prestige Scores. |
  | **90–110** | **Debrief** | Structured discussion (see below). |

  ---

  ## 5. Worked Example: Turn 4 Resolution

  **Context:** Team A invested heavily in Turn 1. They are waiting for payoff.
  1.  **Orders:** Team A submits: 2 Labor *Maintain*, 3 Labor *Extract*.
  2.  **Pipeline Resolution:** Turn 1 Investments mature. Team A's EC rises from 8 to 12.
  3.  **Decay:** EC/SC drop by 1 (unless Maintained). Team A Maintained, so no decay. Net EC = 12.
  4.  **Event Draw:** Team A draws "Drought" (Base -3 Pop).
  5.  **Lookup:** Team A Total Structure = 22 (Stable Tier). Modifier = Normal.
      *   *Result:* -3 Pop.
      *   *Contrast:* Team B ignored structure. Total Structure = 10 (Fragile Tier). They draw "Drought". Modifier = Double Damage. Result: -6 Pop.
  6.  **Chronicle:**
      *   Team A writes: *"Dry summer, but stores held."* (Boring)
      *   Team B writes: *"The Great Drought of Year 4 kills hundreds."* (Dramatic)
  7.  **Vote:** Team C votes for Team B's note. Team B gains Prestige. Team A gains Welfare stability.

  ---

  ## 6. Role Assignment (If Team is Short)

  *   **Standard (4 players):** 1 *Steward* (Labor allocation), 1 *Scribe* (Chronicle), 1 *Envoy* (Submit orders/Vote), 1 *Archivist* (Track Pop/History).
  *   **If 3 players:** Merge *Steward* and *Envoy*.
  *   **If 2 players:** One manages Mechanics (Steward/Envoy), one manages Narrative (Scribe/Archivist).
  *   **If 1 player:** Play as a "Dynasty" (solo), but must write two chronicle entries per turn (Internal vs. External view) to simulate bias.

  ---

  ## 7. The Debrief: Mapping Mechanics to Theory

  Do not lecture. Ask questions that force them to articulate the concepts.

  1.  **The Lag (Invisibility of Structure):**
      *   *Ask:* "Turn 1, who invested? Turn 4, who felt safer? Did you connect the two?"
      *   *Point:* Structural causes operate on a timescale that disconnects decision from consequence. This makes them invisible to contemporaries and hard to isolate for historians.
  2.  **The Lookup Table (Conditioning):**
      *   *Ask:* "Team A and Team B both drew 'Drought'. Why was one a footnote and the other a catastrophe?"
      *   *Point:* Events do not have intrinsic explanatory power; their power is *conditioned* by the structural envelope.
  3.  **The Archive (Source Bias):**
      *   *Ask:* "Look at your reconstruction paragraphs. How many of you blamed the Drought? How many mentioned the EC score?"
      *   *Point:* The archive (sticky notes) records the *event*, not the *vulnerability*. Historians are forced to explain the spike (event) rather than the baseline (structure).
  4.  **The Prediction (Attribution Gap):**
      *   *Ask:* "Open your envelopes. Did you predict 'Luck/Events' or 'Preparation'? Why?"
      *   *Point:* Our intuition favors narrative causality (events) over structural causality, even when the latter is dominant.
  5.  **The Vocabulary Drop (Last 10 Mins):**
      *   Now, and only now, introduce: **Longue Durée** (The EC/SC board), **Conjoncture** (The Pipeline/Lag), **Événement** (The Event Cards).
      *   Ask them to map their game experience to these terms.

  ---

  ## 8. Risk Mitigation: What Will Go Wrong

  **Risk 1: The "Lucky Barbarian" (Ignoring Structure Wins)**
  *   *Failure Mode:* A team extracts max every turn, gets lucky event draws, and wins on Population.
  *   *Fix:* The Lookup Table must be unforgiving. In the *Fragile* tier (0–12), a *Catastrophe* card (-5 Base) becomes -10. Since starting Pop is 20, two bad draws extinguish them. Ensure the Event Deck is shuffled such that Catastrophes are distributed, not clumped, but inevitable over 12 turns.
  *   *Instructor Intervention:* If a team is clearly ignoring structure by Turn 4, subtly hint: "The river is rising," or "Soil looks thin."

  **Risk 2: The "Joke Chronicle"**
  *   *Failure Mode:* Students write "We ate the neighbors" to win Prestige votes.
  *   *Fix:* Frame the vote criteria explicitly: "Vote for the entry that sounds like a **definitive historical cause**." Penalize pure humor in the instructions. If it happens, use it in debrief: "Why was humor more memorable than survival?" (Answer: Narrative appeal over truth).

  **Risk 3: Optimization vs. Constraint**
  *   *Failure Mode:* Students treat EC/SC as just "Hit Points."
  *   *Fix:* This is a debrief save. In the discussion, emphasize that EC didn't just save HP; it *defined* what a Drought meant. For the Robust team, a Drought wasn't a threat; it was a "dry summer." The *meaning* of the event changed.

  **Risk 4: Archive as Memory Test**
  *   *Failure Mode:* Students feel cheated they can't see the whole board at the end.
  *   *Fix:* Explicitly frame this: "You are now the historian of Polity A. You *only* have Polity A's records. This is not a test; this is the historical condition."

  ---

  ## 9. Limitations: What the Game Cannot Stage

  Be frank with them in the final 5 minutes.

  1.  **Constitutive Constraints:** In the game, you *chose* not to build terraces. In reality, people inside a *longue durée* often cannot *see* the constraint as a choice (e.g., feudal relations, gender roles). The game makes structure an optional strategy; history makes it an ontology.
  2.  **Timescale:** 12 turns is not 300 years. You felt the lag intellectually, not generationally. You don't feel the weight of "the way things have always been."
  3.  **Agency:** The game implies a "correct" playstyle (Invest). Real history has no guaranteed formula; sometimes structure collapses despite best efforts.

  **You must supply this:** The idea that structure is not just a "slow cause" but the *ground* on which reasons stand. The game shows structure as a shield; you must explain it is also a cage.

  ---

  ## 10. Compression & Variations

  **60-Minute Version (Reading Group):**
  *   **Turns:** Reduce to 6 Turns.
  *   **Lag:** Reduce to 1-Turn Lag (Decision Turn 1 -> Effect Turn 2).
  *   **Debrief:** Cut the "Reconstruction" writing phase. Do it orally.
  *   **Prediction:** Skip the sealed envelope. Ask verbally at Turn 3.

  **8-Student Version:**
  *   **Teams:** 2 Large Teams (4 players each) OR 4 Small Teams (2 players each).
  *   **Recommendation:** 4 Teams of 2 is better for competition.
  *   **Adjustment:** Reduce Labor to 3 units per turn to make choices tighter.
  *   **Archive:** With fewer players, the Wall will be sparse. Require 2 sticky notes per turn per team to bulk up the "bias" effect.

  ---

  ## 11. Instructor Cheat Sheet: The "Rigged" Numbers

  To ensure the lesson lands, the math must favor structure heavily.

  *   **Winning Welfare Score:** Approx 60 points (Pop 40 + Struct 20).
  *   **Losing Welfare Score:** Approx 10 points (Pop 5 + Struct 5).
  *   **Prestige Winner:** Often the team that crashed hardest but had dramatic events.
  *   **The "Trap":** If a team spends all 5 Labor on *Extract* every turn:
      *   Turn 1-3: Pop booms (20 -> 30).
      *   Turn 4: Pipeline hits. EC crashes. Decay hits.
      *   Turn 5: Event Draw. Resilience Tier = Fragile.
      *   Turn 6: Population halved.
      *   Turn 7-12: Death spiral.
  *   **The "Ideal":** Spend 2 Labor Maintain, 2 Labor Invest, 1 Labor Extract.
      *   Pop grows slowly.
      *   Resilience stays Robust.
      *   Events bounce off.
      *   End game Pop surge when Pipeline clears.

  **Final Note:** Do not explain *why* the Lookup Table works until the debrief. If they ask "How is damage calculated?", say: "That is the mystery of history; you only see the outcome."
