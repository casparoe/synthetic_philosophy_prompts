  ### The Decision Tree

  **Instructions:** Start at Question 1. Follow the branch that matches your judgment. Continue until you reach a leaf (a boxed position). There are eight questions in total.

  **Question 1: The Drunk Drivers**
  Two people drive home drunk. Both weave across the line. Both have the same amount to drink. One hits a child and kills him. The other gets home safely.
  *Is the one who killed the child **more to blame** than the one who didn't?*
  *   **Yes** → Go to Question 2A.
  *   **No** → Go to Question 2B.

  > **Branch Label:** *Assessment tracks outer result* (Yes) vs. *Assessment tracks inner choice* (No).
  > **Epistemic Note:** This is the central fought-over point. Nearly everyone agrees the *act* was wrong, but specialists disagree on whether the *blame* changes with the result.

  ---

  **Question 2A (If Yes on Q1): The Mood Comparison**
  Think of the driver who got home safely. Now imagine another driver who was also drunk, but was driving recklessly because rain made him grumpy (a chance mood). The first driver was calm.
  *Is the grumpy driver **less to blame** than the calm one, because the rain made him grumpy?*
  *   **Yes** → Go to Question 3.
  *   **No** → Go to Question 4.

  **Question 2B (If No on Q1): The Mood Baseline**
  Since you think the dead child doesn't add blame, look at the mind instead. Two people decide to drive drunk. One was in a foul mood because of rain (chance). The other was calm.
  *Is the grumpy driver **less to blame** than the calm one?*
  *   **Yes** → Go to Question 5.
  *   **No** → Go to Question 6.

  > **Branch Label:** *Inner mental causes are chance events* (Yes) vs. *Inner mental causes are yours* (No).
  > **Epistemic Note:** This is the **Input vs. Output cut**. Q2A tests if you let chance in thoughts matter *more* than chance in results. Q2B tests if you let chance in thoughts matter *at all* when results don't count.
  > **Warning:** The path **No on Q1 / Yes on Q2B** is the "User's Trap." It claims outcomes don't matter, but moods do. This is logically unstable (see Leaf 5).

  ---

  **Question 3 (Yes/Yes): The Lorry Driver**
  A careful lorry driver checks his mirrors. A child runs out from behind a blind corner. The driver cannot possibly see him and kills him.
  *Is the driver **to blame** for the death?*
  *   **Yes** → Go to Question 7.
  *   **No** → **Leaf 1**

  **Question 4 (Yes/No): The Policy Vote**
  A politician votes for an economic policy. In one world, it causes a famine years later. In another, it does not. The vote was identical.
  *Is the politician **to blame for the starvation** in the first world?*
  *   **Yes** → **Leaf 2**
  *   **No** → **Leaf 3**

  **Question 5 (No/Yes): The Gaugin Case**
  A man abandons his family to paint. In one world, he becomes a great artist. In another, he is mediocre. The choice to leave was identical.
  *Does his success make the abandonment **less wrong**?*
  *   **Yes** → **Leaf 4**
  *   **No** → **Leaf 5**

  **Question 6 (No/No): The Punishment Split**
  Back to the two drunk drivers (one killed, one didn't). You said they are equally to blame.
  *Should they receive the **same prison time**?*
  *   **Yes** → **Leaf 6**
  *   **No** → **Leaf 7**

  **Question 7 (From Q3): The Guilt Split**
  You said the careful lorry driver is to blame for the death he couldn't prevent.
  *Should he feel **guilt**, or just sadness?*
  *   **Guilt** → **Leaf 8**
  *   **Sadness** → **Leaf 9**

  **Question 8 (Tie-Breaker for Leaf 2 & 3): The Remote Limit**
  (Asked only if you reached Leaf 2 or 3).
  If the famine was caused by a butterfly effect no one could model, is the blame the same?
  *   **Yes** → **Leaf 2**
  *   **No** → **Leaf 3**

  ---

  ### The Leaves (Positions)

  **Leaf 1: The view that harm creates blame regardless of care.**
  *   **Awkward Commitment:** You must blame the careful lorry driver for the death even though he did everything right.
  *   **Logical Space:** Occupied. (Common in strict liability law, rare in ethics).

  **Leaf 2: The view that all downstream effects count.**
  *   **Awkward Commitment:** You must blame the voter for the famine even if no human could have predicted it.
  *   **Logical Space:** Occupied. (Act Consequentialism).

  **Leaf 3: The view that blame stops at foreseeable risk.**
  *   **Awkward Commitment:** You must say the politician who caused the famine is no more to blame than the one who didn't, if the risk was unknown.
  *   **Logical Space:** Occupied. (Standard Liberalism).

  **Leaf 4: The view that success justifies the risk.**
  *   **Awkward Commitment:** You must say the man who abandoned his family did *less wrong* because he turned out to be a genius.
  *   **Logical Space:** Occupied. (Williams-style justification).

  **Leaf 5: The view that mood matters but results don't.**
  *   **Awkward Commitment:** You must say the grumpy drunk is less to blame than the calm drunk, but the killer drunk is no worse than the safe drunk.
  *   **Logical Space:** **Empty/Unstable.** This is the "Input Luck" trap. It is incoherent to say chance in thoughts matters but chance in results doesn't, as both are external to the will.

  **Leaf 6: The view that blame and punishment come apart.**
  *   **Awkward Commitment:** You must say the two drivers are equally bad people, but one deserves prison and the other doesn't.
  *   **Logical Space:** Occupied. (Legal Pragmatism).

  **Leaf 7: The view that punishment tracks harm, not blame.**
  *   **Awkward Commitment:** You must punish the safe driver less, even though you admit he is just as blameworthy as the killer.
  *   **Logical Space:** Occupied. (Standard Legal Practice).

  **Leaf 8: The view that agents own the unpreventable.**
  *   **Awkward Commitment:** You must tell the careful lorry driver he should feel guilty, not just sad, for an accident he couldn't stop.
  *   **Logical Space:** Occupied. (Agent-Regret views).

  **Leaf 9: The view that guilt requires fault.**
  *   **Awkward Commitment:** You must say the careful lorry driver feels no guilt, only sadness, despite being the one who killed the child.
  *   **Logical Space:** Occupied. (Kantian/Control views).

  ---

  ### Indistinguishable Leaves

  **Leaf 6 and Leaf 7 cannot be separated by action.**
  Both leaves prescribe the same prison time (Killer > Safe). They only differ on the internal label of "blame." If your group cares about what we *do* rather than what we *say*, these are the same position.

  ---

  ### Epistemic Notes & Map Warnings

  **1. The Input/Output Distinction**
  You asked for this specifically. In the tree, this is the split between **Question 1** (Output) and **Question 2** (Input).
  *   **Is it phoney?** It is not phoney, but it is dangerous. Most people who reject Output Luck (Q1=No) feel forced to reject Input Luck (Q2B=No) to avoid Leaf 5. Leaf 5 is the "User's Trap." It is logically possible but psychologically unstable. If chance in your mood excuses you, why doesn't chance in the child's location excuse you? Both are outside your will. I have flagged Leaf 5 as **Empty/Unstable** because almost no one can hold it without sliding back to "Nothing matters" or "Everything matters."

  **2. Contested Distinctions**
  *   **Q1 (Drunk Drivers):** This is the most fought-over point in the literature. There is no established answer. Your Sunday was not wasted; this is the live wire of the debate.
  *   **Q6/Q7 (Punishment vs. Blame):** Specialists dispute whether these can come apart. Some say if you can't punish them differently, you don't actually believe the blame is different. The tree treats them as separable, but be aware some readers will reject this split.

  **3. Imposed Structure**
  *   **The Gaugin Case (Q5):** I have placed this only on the "Input Luck Matters" branch (Leaf 4/5). In reality, people who accept Output Luck might also accept Gaugin-style justification. The tree forces a correlation here for brevity. If someone says "Yes" to Q1 but "Yes" to Q5, route them to Leaf 2.
  *   **The Lorry Driver (Q3):** I have placed this on the "Output Luck Matters" branch. This assumes that if you care about results, you might blame the lorry driver. If you care about results *and* foreseeability, you go to Leaf 3. This is a tidy structure imposed on a mess; in reality, views on negligence are scattered across all leaves.

  **4. The "Friend" vs. "You" Map**
  *   **Your Friend:** Likely lands on **Leaf 3** or **Leaf 7**. (Outcomes matter for blame/punishment, but inner mood doesn't).
  *   **You:** Likely aiming for **Leaf 6** or **Leaf 9**. (Outcomes don't matter for blame, but maybe for punishment).
  *   **The Trap:** If you argue that mood (Input) matters but results (Output) don't, you land in **Leaf 5**. I strongly advise you to avoid this leaf in the discussion, as it is the easiest to dismantle.

  **5. Empty Slots**
  *   **Leaf 5** is the major empty slot. It represents the view that "Chance in thoughts excuses, but chance in results doesn't." This is theoretically possible but practically non-existent. If a group member lands here, press them on why the rain ruining a mood is different from the child running onto the road. Both are external to the agent's will.
