answer: |-
  Good morning, judges, colleagues, parents, and guests. Welcome to our mock tribunal on the origins of the First World War.

  Today, we are asked to answer a question that haunted the twentieth century: Was Germany solely responsible for the war? But to answer that, we need to change how we see a country. For the next hour, I want you to imagine the German Empire not as a nation, but as a massive corporation.

  When we ask if Germany is guilty, we are essentially asking: Can a corporation be criminally liable for the actions of its executives?

  The prosecution will argue that yes, the liability is clear. They will point to the "September Program." Think of this as a hostile takeover plan drafted in the first month of the war. It outlines annexations and economic domination. For historians familiar with the Fischer Controversy, this is the smoking gun—the internal audit proving that the Board of Directors, specifically the Chancellor and military leadership, intended to expand the company's market share through aggression. To the prosecution, the corporation had a malicious business plan, and it executed it.

  But the defense will argue that corporate liability is never that simple. A corporation is not a single mind. In 1914, the German "CEO," the Kaiser, was often sidelined by his regional managers—the Generals. The left hand didn't know what the right hand was doing. If the Board is divided, can we blame the whole company? Furthermore, a corporation operates in a market. Germany did not exist in a vacuum. Other corporations—France, Russia, Britain—were engaging in their own aggressive mergers, hoarding resources, and signing exclusive contracts through the alliance system. If the entire market is rigged for conflict, is one company solely to blame for the crash?

  This is why this tribunal matters. We are not just reciting dates. We are grappling with the problem of agency. When a state goes to war, is it the guilt of the leaders, the guilt of the system, or the guilt of the people who funded it?

  If we treat Germany as a monolith, the verdict is easy. But if we treat it as a complex organization operating in a volatile global market, the verdict becomes much harder. Our job today is to decide where the liability truly lies. Is it with the executives who signed the orders? The shareholders who cheered them on? Or the competitors who backed them into a corner?

  The court is now in session. Let the proceedings begin.
