  **METHOD NOTE: PRIORITISATION PANEL PROCEDURES**
  **To:** Chief Executive **From:** Panel Chair **Date:** 24 May 2024
  **Subject:** Protocol for Scheme Ranking and Cycle Resolution

  **1. Objective**
  To produce a defensible priority list of capital schemes. Where logical cycles prevent a strict ranking, the Panel must publish an honest partial order rather than a fabricated sequence. This note defines the operational test for distinguishing weighting artefacts from genuine value intransitivity.

  **2. Procedure**
  **Step 1: Dimension Fixation**
  *Question:* Are evaluation dimensions (e.g., safety, cost, equity) fixed for all pairwise comparisons?
  *Sufficient Answer:* Yes, documented in the Scheme Assessment Framework.
  *On Failure:* Halt. Director of Strategy must fix dimensions before proceeding.
  *Type:* Factual.

  **Step 2: Intra-Dimensional Transitivity**
  *Question:* Is preference transitive within each single dimension? (If A>B and B>C on Safety, is A>C on Safety?)
  *Sufficient Answer:* Yes for all dimensions.
  *On Failure:* Record as 'Value-Induced Cycle'. Handoff to Panel Chair to declare partial order.
  *Type:* Value.

  **Step 3: Aggregation Check**
  *Question:* Does the overall cycle persist if dimension weights are varied within reasonable bounds?
  *Sufficient Answer:* No (cycle disappears with reweighting).
  *On Failure:* If cycle persists, proceed to Step 4. This indicates an aggregation artefact or deeper conflict.
  *Type:* Factual.

  **Step 4: Materiality Threshold Declaration**
  *Question:* For every pairwise preference, is the difference material?
  *Sufficient Answer:* Yes, difference exceeds declared minimum meaningful unit (e.g., >1% safety gain).
  *On Failure:* If 'negligible' is claimed, the threshold must be written down. If accumulated negligible losses exceed threshold, reverse preference.
  *Type:* Value.

  **Step 5: Phasing Vulnerability Test**
  *Question:* Does splitting a scheme into phases create a preference cycle against the Status Quo?
  *Sufficient Answer:* No. (Status Quo > Combined implies Status Quo > Phase 1).
  *On Failure:* Reject phased submission. Require whole-scheme appraisal.
  *Type:* Factual.

  **Step 6: Final Determination**
  *Question:* Can a strict 1-to-N ranking be justified?
  *Sufficient Answer:* Yes, no unresolved cycles from Steps 2 or 5.
  *On Failure:* Publish Tiers (e.g., 'High Priority Group') instead of ranks.
  *Type:* Value.

  **3. Illustrative Applications**
  **(i) Cycle/Junction/Bus:** Cycle found in Step 3. Reweighting equity vs. efficiency resolved it. Output: Strict Rank.
  **(ii) Spectrum Chain:** Step 4 triggered. Accumulated negligible losses became material. Output: Tiered Grouping.
  **(iii) Dimension Shift:** Member changed criteria between comparisons. Step 2 failed. Procedure dictates we may not publish a strict ranking placing the flagship first. Output: Partial Order. (Disliked by Chair).

  **4. Limitations**
  This procedure cannot resolve fundamental value conflicts (Step 2). Step 4 offers an appearance of rigour regarding thresholds, but setting the threshold remains subjective. The Chief Executive must sign off on any Tiered publication instead of a Rank.

