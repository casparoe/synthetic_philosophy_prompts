answer: |-
  Here is the breakdown of Dan's system, the verdict on your meeting room case, and the tool you need to pin him down.

  ### 1. Would Dan call the 25-minute thing a convention?

  **Yes, he should.**

  If Dan is truly following David Lewis (and his own track record suggests he is trying to), the 25-minute booking slot is a textbook convention. Here is how it maps onto his criteria:

  *   **Regularity:** Everyone does it ("completely universal").
  *   **Expectation:** Everyone expects everyone else to do it ("you'd be thought a bit odd").
  *   **Conditional Preference:** This is the key Lewisian test. Do you prefer to book 25 minutes *only because* others do? Yes. You admitted that if everyone switched to 30, you'd prefer that, but "no one wants to be the only one doing it." Your preference is dependent on coordination.
  *   **Arbitrariness:** There is an alternative (30 minutes) that *could* have worked as a coordination point, even if 30 is technically more efficient.

  **The Origin (Default):** Dan shouldn't care that it started as a software default. Lewis explicitly discusses how conventions start via "salience" or "precedent." The Parkrun marshal waving people to the left is exactly the same mechanism as a software default setting. Both act as a **focal point**—a random signal that gets the ball rolling so everyone coordinates on the *same* thing, regardless of *which* thing it is.

  **The Sanction (Emoji):** The bitchy Slack emoji actually strengthens the case for it being a convention. Conventions are maintained by social pressure (expectations), whereas laws are maintained by formal enforcement (fines). The emoji is social pressure; the red light camera is formal enforcement. This aligns perfectly with his distinction between the Parkrun (convention) and the Red Light (rule).

  ### 2. What work is "Arbitrary" actually doing?

  This is where Dan is likely getting wobbly, and it's the source of your confusion. In philosophy (specifically Lewis), **arbitrary** does not mean "random" or "pointless." It means **"there is a viable alternative equilibrium."**

  *   **Lewis's Definition:** A convention is arbitrary if we *could* have coordinated on a different behavior and achieved the same coordination benefit.
      *   *Driving:* We could drive on the right. It works just as well, provided we all do it. (Arbitrary = Yes).
      *   *Murder:* We cannot coordinate on "everyone murders everyone." Society collapses. There is no alternative equilibrium. (Arbitrary = No).
      *   *Seatbelts:* I should wear one even if you don't. It's not a coordination problem. (Arbitrary = No).

  *   **Dan's Likely Intuition:** Dan might be using the lay definition of arbitrary, which implies **"no rational reason to prefer one over the other."**
      *   He sees Driving Left vs. Right as equal value.
      *   He sees "Hi" vs. "Dear" as equal value.
      *   He might see 25 vs. 30 minutes as **unequal value** (since you proved 30 is more efficient).

  If Dan is using the **Lay Definition**, he has to say the 25-minute slot is **not a convention**, because there is a "better" option. If he uses the **Lewis Definition**, it **is a convention**, because the "better" option is inaccessible without breaking coordination.

  ### 3. Is there an alternative rule that fits his eight verdicts but flips this one?

  Yes. Let's call it **The Indifference Rule**.

  *   **The Rule:** A behavior is a convention only if (1) it relies on mutual expectation, AND (2) the alternative behavior is of roughly equal functional value.
  *   **How it fits his 8 verdicts:**
      *   *Driving/Handshakes/Emails/Parkrun:* Pass. (Left/Right, Hi/Dear are functionally similar).
      *   *Murder/Seatbelts:* Fail. (One option is morally or physically superior).
      *   *Red Lights:* Fail. (Safety/Law makes stopping superior to going).
      *   *Warm-up:* Fail. (Not universal).
  *   **How it flips the Meeting Case:**
      *   Because 30 minutes is *objectively more efficient* than 25 minutes, the options are not of equal value. Therefore, under the Indifference Rule, sticking to 25 minutes is not a convention; it is **irrational inertia** or **systemic error**.

  ### 4. Which rule should he go with?

  Dan should stick with **Lewis's Definition (Arbitrariness = Alternative Equilibrium)**, not the Indifference Rule.

  **Why?**
  1.  **Consistency with "Red Lights":** Dan already ruled that Red Lights are *not* conventions because of the fine (external enforcement). But in reality, stopping at red lights *is* a convention backed by law. If the cameras broke, we'd mostly still stop to avoid crashing. If Dan adopts the Indifference Rule, he has to admit that Red Lights *are* conventions (because we could coordinate on "Go on Red" if we all did it safely), which contradicts his verdict. Sticking to Lewis allows him to say Red Lights *are* conventions, but his verdict was based on the *source of enforcement*, not the value of the action.
  2.  **Sticky Conventions Exist:** History is full of suboptimal conventions. The QWERTY keyboard is the classic example. It is arguably less efficient than Dvorak, but it remains a convention because switching costs are too high. If Dan uses the Indifference Rule, he has to say QWERTY isn't a convention. That feels wrong. It *is* a convention; it's just a suboptimal one.
  3.  **The "Default" Factor:** If Dan rejects the meeting room case because it started as a default, he undermines his Parkrun verdict. The marshal's wave was a "default" signal for that day. The software default is a "default" signal for the office. To be consistent, he must treat them the same.

  **The Verdict:** Dan should call it a **Convention**. It is a coordination equilibrium sustained by mutual expectation and social sanction, where an alternative equilibrium (30 mins) exists but is unreachable without mass coordination.

  ### 5. The Cleaner Test Case

  You mentioned QWERTY feels muddy (because people argue about whether it's actually worse). You need a case where one option is **clearly, demonstrably superior**, but coordination keeps the inferior one alive.

  **The Case: The "Escalator Stand" vs. "Walk" Lane.**

  *   **The Setup:** In many transit stations (like London Underground), the convention is "Stand on the Right, Walk on the Left."
  *   **The Efficiency Fact:** Engineering studies (e.g., by Transport for London) have shown that if everyone **stands on both sides**, the total throughput of people is higher. Walking causes gaps and instability.
  *   **The Coordination:** If you stand on the left, you block the walkers and get shouted at. If you walk on the right, you get shouted at. You only do what you do because everyone else expects it.
  *   **The Test:**
      *   **Lewis-Dan:** Must call this a **Convention**. There is an alternative equilibrium (Stand Both Sides) that works (in fact, works better), but we are stuck on the current one due to expectation.
      *   **Indifference-Dan:** Must call this **Not a Convention**. Because "Stand Both Sides" is objectively more efficient, the current behavior is not "arbitrary" in the sense of being equal value; it is simply wrong/inefficient.

  **Why this works:**
  It strips away the "software default" confusion. It strips away the "moral" weight of murder. It strips away the "legal" weight of red lights. It is pure coordination vs. pure efficiency.

  If Dan says the Escalator Stand is a convention, he admits that conventions can be suboptimal. If he admits that, he **must** admit your 25-minute meeting slot is a convention. If he says it's *not* a convention because "standing both sides is better," then he has to explain why Driving on the Left *is* a convention when Driving on the Right is arguably safer in some car designs. It forces him to define whether "Arbitrary" means "Alternative Exists" or "Options are Equal."
