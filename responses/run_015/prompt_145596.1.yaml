answer: |-
  The implicit theory underwriting Compass is what we might call the Latent Optimizer model. It presupposes that each resident possesses a stable, internal reward function—a specific weighting of values—that exists independently of its expression. Behavior is treated as a noisy but fundamentally optimal projection of this latent state. Consequently, there is no representational room for weakness of will, compulsion, or confusion; these are modeled merely as thermal noise or misidentified features. If a resident paces repeatedly, the system must interpret this as either a preference for pacing or noise, never as a distress signal they cannot articulate. This theory further assumes ontological completeness: the hand-coded feature set spans the entire space of what a resident could possibly care about. Anything not captured by the features is mathematically invisible, treated as random variance rather than unmodeled value. Finally, the system assumes portability and temporal neutrality. It treats the reward function as a portable identity marker that survives changes in context (different facilities) and time (advance directives vs. current behavior), implying that the person is a unified agent whose past rational instructions retain authority over their present compromised actions.

  However, the contract contains a fatal tension between the inference clause and the override clause. The inference clause commits you to a strict preferentism grounded in revealed behavior: what the resident does is the best evidence of what they want. Yet the override clause admits that revealed behavior can be false—a distortion rather than a preference. When staff override Compass because it interprets exit-seeking as a preference for doorways, they are asserting a distinction the inference engine cannot represent: the difference between a preference and a pathology. By allowing an advance directive to strike an inferred reward, the contract presupposes a substantive view of well-being or a prudential unity that the algorithm denies. It claims the resident's current behavior is optimal noise, but simultaneously allows a past version of the resident to veto that optimization. This requires a theory of agency where the "true self" is distinct from the "acting self," a distinction the Boltzmann model collapses. The system assumes no akrasia, but the override clause exists specifically to manage akrasia, confusion, and disease. Thus, the practice is not strictly preferentist; it is a hybrid that uses preferentist engineering to approximate a substantive good, protected by human guardianship.

  This arrangement is underdetermined in its engineering but overdetermined in its ethics. A thoroughgoing behaviorist could license the exact same inference engine—the math is merely lossy compression of trajectories—but would strictly forbid the override clause. For a behaviorist, there is no latent truth to be wrong about; the trajectory is the preference. To allow a family member to override current behavior with a document is to privilege a ghost over the only reality that exists: the resident's current choices. Conversely, a constructivist view, where preferences are formed in the choice situation rather than revealed by it, could not license the practice at all. If preferences do not pre-exist the schedule, inferring them from past walks is a category error. The system would need to stop inferring weights entirely.

  To resolve these tensions, you must align the design with the philosophical commitment you actually intend to make. If you adopt the behaviorist view implicit in the inference engine, you must remove the override clause. You must accept that if a resident walks into a wall, they prefer walls, or else admit the system is not measuring preference but something else. You would stop claiming to maximize "reward" and admit you are minimizing prediction error.

  If you adopt the substantive view implied by the override clause—that residents have welfare interests that may diverge from their behavior—the system must stop treating behavior as ground truth. You would need to change the objective function from fitting trajectories to maximizing welfare proxies defined by staff and family. The system should not infer weights from walking patterns alone; it must ask staff to input normative constraints directly (e.g., "dignity weighs more than efficiency"). The inference engine should be demoted to a suggestion tool that highlights anomalies for human review, rather than an optimizer that sets the schedule. You would have to leave the final weighting of values to humans, acknowledging that the feature list is not ontologically complete.

  If you adopt a view of temporal neutrality that respects the past self (the advance directive), the system must prioritize the directive's weights over inferred ones when they conflict. Currently, the system treats the directive as an external interrupt. It should instead treat the directive as the prior distribution in the Bayesian inference, making current behavior the data that must prove it has changed the resident's mind. This shifts the burden of proof: the system would assume the past self is correct unless current behavior overwhelmingly suggests a stable change, rather than assuming current behavior is truth unless overridden.

  Finally, if you acknowledge the possibility of akrasia or compulsion, the model must stop assuming Boltzmann-optimality. You would need to introduce a separate "compulsion" parameter that allows behavior to be systematically decoupled from reward. The system would need to ask not just "where did they walk?" but "did this look distressed?" via staff input. Without this, you are committing the board to the claim that dementia does not alter the structure of agency, only the precision of its execution. The contract currently commits you to all these conflicting claims simultaneously. To be coherent, you must choose whether Compass is a mirror of behavior, a servant of the past self, or a guardian of welfare, and rewrite the inference logic to match.
