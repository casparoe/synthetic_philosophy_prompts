answer: |-
  ### 1. The Dependency Chain
  Correct your ordering: Do not start with 'objective chance'. If you introduce chance before credence, they will reduce chance to epistemic ignorance immediately.

  1.  **Credence (Epistemic):** Establish this first. Probability as rational degree of belief obeying axioms. This is the *container*.
  2.  **Chance (Physical):** Establish this second. Probability as a mind-independent feature of the dynamics (Hamiltonian), distinct from frequency or belief. This is the *content*.
  3.  **Admissibility:** This must come immediately before the deference step. You must define what information is *safe* to condition on (i.e., information about the past and laws, but not the future outcome). Without this boundary, the deference step is circular (if you know the future, chance is 0 or 1).
  4.  **Principal Principle:** The bridge linking 1 and 2, constrained by 3.

  ### 2. The Carrying Case: Quantum Branching
  Use the Everettian setup only as a vessel for Lewisian logic. To make it do philosophical work on undermining, it requires specific constraints:

  **Properties it MUST have:**
  *   **Deterministic Global Dynamics:** The wavefunction evolves unitarily. This ensures the "future history" is fixed globally, allowing for the possibility that the history contradicts the local chance assignment.
  *   **Indexical Uncertainty:** The agent knows the global state but not their location within the branch structure. This simulates the epistemic gap required for chance to operate.
  *   **Humean Supervenience Constraint:** Explicitly state that the "laws" (and thus the chance function derived from the Hamiltonian) supervene on the total history of outcomes. The Hamiltonian is the chance-function *only because* it best summarizes the mosaic.
  *   **Non-Zero Weight Deviance:** There must exist a possible branch (future history) with non-zero Born weight where the relative frequencies diverge significantly from the Born rules.

  **Properties it MUST lack:**
  *   **Hidden Variables:** No extra parameters determining the branch index beforehand. This prevents reducing chance to ignorance of hidden states.
  *   **Frequency Guarantee:** No theorem ensuring that every branch matches the Born statistics. If all branches match, undermining is impossible.
  *   **Future Knowledge:** The agent must not know which branch they will occupy (admissibility).

  ### 3. Misconception Map & Cut-Off Points
  **Misconception 1: "Chance is just ignorance of the branch index."**
  *   **When it forms:** Minutes 0–5 (during Credence vs. Chance).
  *   **Where to cut it:** Before writing the PP formula. Insist that the Hamiltonian fixes the chance *regardless* of the agent's ignorance. If they think chance is ignorance, undermining makes no sense.
  *   **Intervention:** "If chance were just ignorance, knowing the Hamiltonian would solve it. It doesn't. The chance is in the dynamics, not your head."

  **Misconception 2: "The Principle is circular (or trivial) for determinists."**
  *   **When it forms:** Minutes 5–15 (during PP formulation).
  *   **Where to cut it:** Before introducing the case study.
  *   **Intervention:** Show that $C(A | Ch(A)=x) = x$ holds only given *admissible* information. If you condition on the future outcome, PP breaks. Admissibility breaks the circle.

  **Misconception 3: "Undermining is just a calculation error or paradox."**
  *   **When it forms:** Minutes 25–35 (during the tension).
  *   **Where to cut it:** At the Closing Check. Do not let them resolve it.
  *   **Intervention:** Force them to see it as a structural conflict between *deference* and *supervenience*, not a math error. The principle demands they assign credence to a future that destroys the principle's own basis.

  ### 4. Scope Control: What to Refuse
  Openly refuse to cover:
  1.  **The Solution:** Do not explain the "New Principle" or how to fix undermining. The goal is to feel the tension, not resolve it.
  2.  **Measure-Theoretic Derivations:** Explicitly state: "We are not deriving history-space partitions today. We are tracking the logical conflict."
  3.  **QM Interpretation Wars:** Refuse to debate whether Everettian weights *are* chances. Stipulate them as chances for the sake of the argument.

  ### 5. The Closing Check
  Do not ask for a definition. Ask for a derivation of the conflict.

  **Task:**
  "Write down the Principal Principle assignment for credence in an undermining future $F$ (where $Ch(F) > 0$, but if $F$ occurs, the true chance function becomes $Ch'$). Now, circle the term in your equation that asserts $Ch$ is the true chance function. Explain in one sentence why that term becomes false if $F$ occurs."

  **Success Criteria:**
  They must produce $C(F) = Ch(F)$ and identify that asserting $Ch$ is the chance function is incompatible with $F$ being the actual history.

  Bottom line: Force them to assign credences that logically destroy the chance function they just deferred to.
