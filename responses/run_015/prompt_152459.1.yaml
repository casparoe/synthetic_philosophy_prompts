prompt: |-
  I'm on the volunteer grant board for our towns community center. Next tuesday we vote on funding a workshop called Cleaning Your Moral Lens — run by locals who want to teach people how to tell the difference between just not liking something and being unfair about it. They have people rate gut reactions to practices, then show cross-culture data, and if your reaction stays strong even after you learn people you admire do it too, they call it bias; if it softens, they call it preference. They call that second part the preference-inversion test. Some board members love it, others say its rigged because 'people you admire' is just your own moral circle, so the workshop smuggles in one view and calls it science. I need a memo for the meeting recommending approve, reject, or approve with conditions, with reasons folks can actually reply to, and I want the strongest point for the losing side included honestly. I dont have any formal background in this, just been chewing on it myself, and please seperate whats pretty settled from whats genuinely fought over by people who know the topic — dont present a contested take like its the only view. Also no lists of books or citations I cant verify.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer grant board member for a town community center.
      *   **Task:** Write a memo for the next meeting (Tuesday) recommending a funding decision (Approve, Reject, or Approve with Conditions) regarding a workshop called "Cleaning Your Moral Lens."
      *   **Workshop Content:** Teaches distinguishing between "unfairness" (bias) and "not liking something" (preference). Uses a method where participants rate gut reactions, see cross-cultural data, and check if reactions soften when learning "people you admire" do it. If it stays strong = bias; if it softens = preference. This second part is called the "preference-inversion test."
      *   **Conflict:** Some board members love it; others say it's rigged because "people you admire" is subjective (moral circle), smuggling in a specific view under the guise of science.
      *   **Requirements:**
          *   Recommendation (Approve, Reject, or Conditions).
          *   Reasons folks can reply to (argumentative, not just descriptive).
          *   Include the strongest point for the losing side honestly.
          *   Distinguish between settled facts and contested debates (epistemic humility).
          *   No unverifiable book lists or citations.
          *   Tone: Accessible (user has no formal background), practical, balanced.

  2.  **Evaluate the Workshop Concept:**
      *   *Core Idea:* Distinguishing bias from preference is a valid and useful goal for community cohesion.
      *   *Methodology:* The "gut reaction + cross-cultural data" part is standard social psychology (implicit association, cultural relativism).
      *   *The "Preference-Inversion Test":* This is the controversial bit. Defining bias as "something I still dislike even after knowing admired people do it" and preference as "something I stop disliking" is psychologically simplistic and philosophically contentious.
      *   *The Criticism:* "People you admire" is subjective. If my moral circle excludes certain groups, this test won't reveal my bias against them. It reinforces existing hierarchies.
      *   *The Defense:* It encourages humility and social calibration. It moves people away from rigid absolutism.

  3.  **Determine the Recommendation:**
      *   *Reject:* Too harsh. The goal is good, even if the method is imperfect. Community centers should host difficult conversations.
      *   *Approve:* Risky. If the methodology is flawed, it could cause harm or division, wasting funds.
      *   *Approve with Conditions:* Best middle ground. Acknowledges the value of the topic while mitigating the risk of the specific "test" being presented as objective science. It allows for community feedback and ensures facilitators acknowledge limitations.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Context:** Briefly summarize the workshop and the debate (without taking sides immediately).
      *   **Settled vs. Contested (Crucial Step):**
          *   *Settled:* Everyone has biases. Preferences exist. Social context influences morals.
          *   *Contested:* How to measure them. Whether "admiration" is a valid metric for moral truth. Whether this specific test is scientifically valid.
      *   **Arguments for Approval (The "Pro" Side):**
          *   Promotes self-reflection.
          *   Reduces conflict by labeling things "preferences" rather than "moral failings."
          *   Locals running it builds community capacity.
      *   **Arguments for Rejection/Caution (The "Con" Side - Strongest Point):**
          *   The "Moral Circle" problem. If I only admire people like me, the test confirms my bias rather than revealing it. It risks presenting a subjective heuristic as objective fact.
      *   **Recommendation (Conditions):**
          *   Don't market it as "science" or "psychological testing."
          *   Frame it as "discussion" or "framework."
          *   Require a feedback mechanism.
      *   **Closing:** Call to action for the vote.

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check Tone:* Is it too academic? Keep it plain English. The user said they have no formal background.
      *   *Check Constraints:* Did I distinguish settled vs. contested? Yes. Did I include the strongest counter-argument? Yes. No citations? Yes.
      *   *Specific Focus:* The "preference-inversion test" needs careful handling. It sounds like a made-up term for this workshop (not a standard psychological term like "Implicit Association Test"). I need to treat it as a *tool* they are using, not established science.
      *   *Epistemic Humility:* Ensure I don't say "This test is wrong." Say "Experts disagree on whether this test works."

  6.  **Final Review against constraints:**
      *   *Memo format?* Yes.
      *   *Recommendation?* Approve with Conditions.
      *   *Reasons reply-able?* Yes, focused on risk management and educational value.
      *   *Strongest losing point?* The "moral circle/echo chamber" critique.
      *   *Settled vs. Contested?* Explicit section.
      *   *No citations?* Checked.

  7.  **Final Polish:** (Drafting the response based on the above thought process.) *Self-correction: Make sure the distinction between bias and preference is clear. Bias usually implies unfair prejudice; preference implies taste. The workshop tries to move things from the former to the latter.*

      *(Drafting the "Settled vs. Contested" section carefully)*:
      *   Settled: We all have blind spots. Culture shapes us.
      *   Contested: Can admiration override bias? Is this specific test valid?

      *(Drafting the Conditions)*:
      *   Marketing language (avoid "scientific proof").
      *   Facilitator training (acknowledge limitations).
      *   Feedback loop.

  8.  **Final Output Generation** (Proceed to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Community Center Grant Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Funding for "Cleaning Your Moral Lens" Workshop

  **Recommendation**
  I recommend we **Approve with Conditions**.

  We should fund the workshop, but only if the organizers agree to specific adjustments in how they market the material and facilitate the discussion. This approach supports community-led education while protecting the Center from hosting content that might be mistakenly presented as settled science.

  **Context and Goal**
  The proposed workshop aims to help residents distinguish between personal preference (things we dislike but are acceptable) and bias (unfair prejudices). The goal is to reduce community friction. The method involves participants rating their gut reactions to various practices, reviewing cross-cultural data, and then applying what the organizers call a "preference-inversion test." This test asks if a reaction softens when the participant learns that "people they admire" engage in the practice.

  **What Is Settled vs. What Is Contested**
  To make a fair decision, we need to separate general psychological agreement from the specific claims of this workshop.

  *   **Pretty Settled:** Psychologists and sociologists generally agree that all humans have unconscious biases. We also agree that culture heavily influences what we consider "normal" or "moral." Self-reflection tools can help people become aware of these instincts.
  *   **Genuinely Contested:** There is no consensus on how to measure the line between preference and bias in a workshop setting. Specifically, the "preference-inversion test" described here is not a standard, validated psychological instrument. Experts debate whether "admiration" is a reliable metric for moral truth. Some argue that relying on who we admire simply reinforces our existing social bubbles rather than challenging them.

  **Arguments for Approval**
  Those supporting this grant argue that the workshop offers a practical vocabulary for conflict resolution. By categorizing some disagreements as "preferences" rather than moral failings, neighbors may be less likely to demonize one another. Furthermore, the organizers are locals. Funding them builds local capacity and encourages residents to take ownership of community cohesion rather than importing outside consultants. The core message—that we should question our gut reactions—is universally beneficial.

  **The Strongest Argument for Rejection**
  We must honestly consider the strongest point raised by the board members opposing this grant. Their concern is that the "preference-inversion test" is circular.

  If a participant's circle of "people they admire" is already narrow or homogeneous, the test will not reveal bias; it will validate it. For example, if I do not admire people from a different background, learning that they practice something I dislike will not soften my reaction. Under this workshop's rubric, my reaction would be labeled a valid "preference" rather than a "bias." Critics argue this smuggles in a specific worldview under the guise of neutrality, potentially giving participants a false sense of scientific justification for their existing prejudices. This is a legitimate risk for a community center committed to inclusivity.

  **Proposed Conditions**
  To mitigate the risk while supporting the goal, I propose we attach three conditions to the funding:

  1.  **Marketing Language:** The workshop cannot be advertised as "scientific" or "psychologically validated." It should be framed as a "discussion framework" or "community dialogue." This manages participant expectations and prevents the organizers from presenting contested methods as fact.
  2.  **Facilitator Acknowledgement:** During the session, facilitators must explicitly state that the "admiration" metric is a tool for reflection, not a definitive test of morality. They should invite participants to question *why* they admire who they admire.
  3.  **Feedback Mechanism:** The organizers must agree to collect anonymous feedback specifically on whether participants felt the tools helped them understand different viewpoints or made them feel more entrenched. We review this before considering any future funding for similar programs.

  **Conclusion**
  The intent of "Cleaning Your Moral Lens" aligns with our mission to foster a respectful community. However, the methodology carries the risk of oversimplifying complex moral psychology. By approving with conditions, we support the organizers' initiative while ensuring the Center maintains intellectual integrity. We allow the conversation to happen, but we frame it correctly as a dialogue rather than a lecture on scientific truth.

  I move we adopt this recommendation for Tuesday's vote.
