answer: |-
  Here is the correspondence table for your friend's analogy, followed by an audit of the three critical disanalogies.

  | Concept | Socialist Economy | Corporate Firm |
  | :--- | :--- | :--- |
  | **Price** | Central Plan Target / Shadow Price | Transfer Price / Shadow Price |
  | **Profit** | Plan Fulfillment Bonus | Divisional P&L / EVA |
  | **Entrepreneur** | Central Planner | Head Office / Divisional Manager |
  | **Shareholder** | The State / People | External Shareholders |
  | **Bankruptcy** | Plan Revision / Subsidy | Division Closure / Restructuring |
  | **Takeover** | Revolution / Policy Shift | Hostile Takeover / Activist Campaign |

  Your friend's argument is the standard Coasean challenge to Mises: if planning works inside the firm, why not everywhere? The audit turns on whether the firm's internal mechanics can function when severed from the external environment.

  First, on **authority versus contracting**. You asked whether internal planning is truly command or just contracting all the way down. Inside the firm, it is command: you move resources because a manager directs it, not because a price signal changed. This validates the analogy that firms are planned islands. However, the *bounds* of that authority are market-determined. The "quit" option disciplines the employer only because there are other firms to quit *to*. If the entire economy is one firm, the exit option vanishes. The employment contract becomes a status, not a market exchange. Without external labor markets to set opportunity costs for wages and roles, internal authority loses its calibration. The analogy describes a market only if there is an outside; without it, the "contracting" defense collapses into pure command without a feedback loop.

  Second, on **failure and exit**. You asked if internal prices remain informative without exit at the top. In a firm, divisional losses are real, but the firm itself faces a hard budget constraint from external capital providers. If a division fails, it is closed; if the firm fails, it is liquidated. This threat makes internal profit metrics informative. In a socialist economy, the "Head Office" (State) cannot be liquidated. Losses are covered by taxation or inflation. This creates a soft budget constraint: internal prices become accounting fictions because the consequence of being wrong is absorbed by the system rather than punishing the decision-maker. Without the possibility of total firm death, the mechanism that makes internal prices informative dissolves. Managers optimize for political survival within the hierarchy, not economic efficiency.

  Third, on the **internal capital market**. Your friend claims HQ rations investment like a stock market, proving calculation is possible without external prices. This is the weakest link. Head Office allocates capital by comparing divisional returns against a cost of capital. Where does that cost come from? It is derived from external interest rates and equity risk premiums determined by the very market your friend claims is unnecessary. Furthermore, HQ evaluates divisional outputs based on their market value. A firm sealed off from input and output markets cannot value its own production. The internal capital market is a derivative market; it requires an underlying asset priced externally to function. Your friend's upgrade—issuing internal shares traded by managers—concedes the point. If managers trade shares based on expected future cash flows, you have recreated a market inside the firm. You haven't refuted Mises; you've just privatized the planning bureau into a stock exchange.

  **Verdict:** Your friend's conclusion does not survive. The firm is not a counterexample to the calculation problem; it is a beneficiary of the solution. The firm works *because* it floats in a sea of external prices that anchor its internal accounting.

  **Better Analogy:** The firm is not a mini-economy; it is a submarine. It maintains an internal atmosphere (planning) distinct from the outside, but it relies on external pressure and navigation stars (market prices) to know where it is and whether its hull is holding. A planned economy is a submarine trying to navigate in a dry dock. It can run its engines and check its gauges, but without the water to provide resistance and the stars to provide position, it cannot move or know if it is going anywhere. The interesting thing is indeed the water, not the engine.
