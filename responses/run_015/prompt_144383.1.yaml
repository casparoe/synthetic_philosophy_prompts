answer: |-
  LOGIC MAP: Value (Neg/Pos) → Consciousness (Phenomenal/Bio) → Aggregation (Sum/Threshold/Lexical) → Creation (Impersonal/Person-Affecting). Branches ordered by axiological priority.

  DIAGNOSTIC (Circle A, B, or C)
  1. SILENT STRESS: Unconscious body spikes cortisol, tissue breaks. Suffering?
     A) Yes (Biological)  B) No (Needs Experience)  C) Unsure
  2. WANTED BURN: Identical pain sensation. Chilli-lover pays for it vs. Victim strapped down.
     A) Both Bad  B) Only Victim Bad  C) Neither Bad
  3. CONSOLATION: Two worlds, identical suffering. World B has extra happiness too.
     A) B Better  B) Same  C) B Worse (distraction)
  4. OFFSETTING: Does happiness cancel suffering, or just sit beside it?
     A) Cancels  B) No Cancel  C) Only if same person
  5. THE STATIC: 1B people get flicker irritation vs. 1 person gets 10min agony.
     A) 1B Worse  B) Agony Worse  C) Incommensurable
  6. THRESHOLD: Do tiny pains sum to outweigh big ones?
     A) Yes  B) No (Lexical)  C) Only above threshold
  7. ONE-BAD-HOUR: Create life: net mild pleasure + 1hr agony. Or create nobody.
     A) Create  B) Don't Create  C) Indifferent
  8. HAPPY CREATION: Create life: net huge pleasure, no pain. Or create nobody.
     A) Obligatory  B) Permissible  C) Wrong (risk)
  9. ERASED AGONY: 1hr severe pain, memory wiped, psychology restored. Cost?
     A) Yes  B) No  C) Only if discovered
  10. HARM LOCATION: In Q9, who is harmed?
      A) The Subject  B) No One  C) The World

  LEAVES (Position | Awkward Commitment | Move to Change Mind)
  1. CLASSICAL UTIL | Must create suffering if net pleasure huge | Show lexical pain intuition
  2. WEAK NU | Must offset suffering with trivial pleasures | Show incommensurability cases
  3. STRONG NU | Must destroy happy beings if any risk pain | Show value of autonomy/joy
  4. LEXICAL PRIORITARIAN | Ignore billion sneezes for one agony | Show aggregation intuition
  5. THRESHOLD NU | Arbitrary line where pain starts counting | Show smooth spectrum cases
  6. BENATAR ASYMMETRY | Never create even happy lives (risk) | Show consent/cooperation cases
  7. NARROW PERSON-AFFECTING | No harm if person wouldn't exist otherwise | Show impersonal intuition
  8. TRANQUILLISM | Existence itself is a burden | Show net-positive life cases
  9. HEDONIC NEGATIVISM | Chilli-lover suffers despite enjoyment | Show preference intuition
  10. PREFERENCE NEGATIVISM | Unconscious stress is fine | Show biological harm cases
  11. UNNAMED | Strong NU + Aggregation (Rare) | Show lexical priority intuition

  EMPTY COMBOS
  - Q2(C) + Q5(A): Incoherent. (No pain in chilli, but flickers sum? Why?)
  - Q3(B) + Q8(A): Unattractive. (Positives don't help suffering, but obligate creation?)
  - Q1(A) + Q9(B): Ignored. (Bio harm matters, but erased memory doesn't?)

  INDISTINGUISHABLE LEAVES
  - Strong NU (3) vs. Lexical Prioritarian (4): Both prioritize worst suffering absolutely; tree lacks extreme trade-off case to split them.
  - Weak NU (2) vs. Classical Util (1): Converge on most real-world cases; differ only on extreme offsetting.

  SCORING KEY (Dominant Answers)
  - Mostly A on 3,4,5,7,8 → Classical Util (1)
  - A on 3, B on 4, A on 5 → Weak NU (2)
  - B on 3, B on 4, B on 5 → Strong NU (3)
  - B on 5, B on 6 → Lexical Prioritarian (4)
