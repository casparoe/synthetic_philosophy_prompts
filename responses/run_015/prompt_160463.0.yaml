  *Correction:* In standard Supervaluationism, $P$ is indeterminate. $\neg P$ is indeterminate. But $P \lor \neg P$ is true on *all* precisifications (because on any specific precisification, classical logic holds). Therefore $P \lor \neg P$ is Supertrue. So the blog is definitely wrong about LEM.
