answer: |-
  This is an excellent instinct. Your "half-memory" is correct, and your suspicion that the blog post is "too neat" is well-founded. The passage you found is a classic example of a "philosophical urban legend"—a summary that circulates because it tells a clean story, not because it accurately reflects the technical state of the debate.

  As a TA in Ancient Philosophy, you are used to texts where exegesis matters. In contemporary analytic metaphysics, precision matters just as much, and this blog post fails that test in crucial places.

  Here is the claim-by-claim audit you requested, followed by the application to your attendance problem.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Vague predicates like 'bald', 'tall' or 'heap' have borderline cases..."*
  *   **Verdict:** **Accepted by all.**
  *   **Comment:** Everyone agrees vague predicates have borderline cases. This is the data that needs explaining.

  **Claim 2:** *"Supervaluationism says that our language simply fails to settle on a single sharp cut-off: instead there are many admissible precisifications..."*
  *   **Verdict:** **Accepted by Supervaluationists.**
  *   **Comment:** This is the standard definition (associated with Kit Fine and Rosanna Keefe). "Admissible precisifications" are the core mechanism.

  **Claim 3:** *"A sentence is true if it comes out true under every admissible precisification... and if the precisifications disagree it has no truth value at all."*
  *   **Verdict:** **Accepted by Supervaluationists.**
  *   **Comment:** This defines "supertruth" (true on all precisifications) and "truth-value gaps" (true on some, false on others).

  **Claim 4:** *"That is why supervaluationists have to give up the law of excluded middle: in a borderline case 'Jones is bald' isn't true and 'Jones is not bald' isn't true either, so the disjunction 'Jones is bald or Jones is not bald' cannot be true."*
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Comment:** **This is your suspicion confirmed.** Standard Supervaluationism is explicitly designed to *preserve* classical logic, including the Law of Excluded Middle (LEM).
      *   *Why the blog is wrong:* While 'Jones is bald' lacks a truth value (is indeterminate), the disjunction 'Jones is bald or Jones is not bald' is **supertrue**. Why? Because on *every* individual precisification, classical logic holds. On precisification A, Jones is bald (so the disjunction is true). On precisification B, Jones is not bald (so the disjunction is true). Since it is true on all admissible precisifications, it is supertrue.
      *   *The Distinction:* Supervaluationists reject **Bivalence** (the claim that every sentence is either true or false), but they keep **Excluded Middle** (the claim that $P \lor \neg P$ is a logical truth). The blog conflates the two.

  **Claim 5:** *"Epistemicism goes the other way and keeps bivalence and all of classical logic: there is one and only one sharp cut-off, it is fixed by nothing more than how speakers in fact use the word..."*
  *   **Verdict:** **Accepted by Epistemicists.**
  *   **Comment:** This is the view defended by Timothy Williamson (*Vagueness*, 1994). The boundary is determined by complex patterns of usage, but it is sharp.

  **Claim 6:** *"...vagueness is purely a matter of our ignorance of where it falls — ignorance which, since knowledge requires a margin for error, we can never in principle eliminate."*
  *   **Verdict:** **Accepted by Epistemicists.**
  *   **Comment:** This summarizes Williamson's "Margin for Error" principle. We can't know the boundary because knowledge requires reliability, and our judgments aren't reliable enough to detect a one-hair difference.

  **Claim 7:** *"But the decisive objection to epistemicism is simple: if there really were a cut-off, then of two men differing by a single hair one would be bald and the other not, and we could simply look at them and see which is which; since no amount of looking settles it, there is no such cut-off and epistemicism is refuted."*
  *   **Verdict:** **Straightforwardly Wrong (Philosophically Naive).**
  *   **Comment:** This is not a "decisive objection"; it is a restatement of the intuition that Epistemicism denies.
      *   *The Epistemicist Reply:* Epistemicists agree that one hair makes the difference. They *deny* that we could "look and see." They argue that the meaning of words is fixed by usage patterns that are too complex for human cognition to track precisely. To say "we can't know it, therefore it doesn't exist" is to beg the question against the Epistemicist. It treats the "unknowability" as a refutation rather than the central thesis.

  **Claim 8:** *"Supervaluationism is thus the more honest view — it admits that no line exists..."*
  *   **Verdict:** **Rhetorical/Contested.**
  *   **Comment:** "Honest" is not a technical term. Supervaluationists admit there is no *semantic* line, but they face their own "honesty" problems (e.g., Higher-Order Vagueness: where is the line between the clear cases and the borderline cases?).

  **Claim 9:** *"...and it blocks the sorites by refusing to say of any particular grain that it is the one that turned a non-heap into a heap..."*
  *   **Verdict:** **Acceptable Simplification.**
  *   **Comment:** Supervaluationists block the Sorites Paradox by denying the inductive premise ("If $n$ grains is a heap, $n+1$ is a heap") is *true*. It is false on some precisifications, so it is not supertrue.

  ---

  ### Part 2: The Verdict on the Debate

  **Does the post's verdict survive cleanup?**
  **No.** The blog post declares Epistemicism "refuted" based on a misunderstanding of what Epistemicists claim (that the boundary is unknowable) and a misunderstanding of Supervaluationism (that it rejects classical logic).

  In the actual literature:
  1.  **Epistemicism** is a minority view but taken very seriously. It is not refuted; it is considered "counterintuitive but logically robust."
  2.  **Supervaluationism** was the dominant view for a long time but has lost ground because of technical problems (specifically regarding higher-order vagueness and the fact that it makes existential claims like "There is a number $n$ such that $n$ grains make a heap" true, even though no specific $n$ can be pointed to).
  3.  **Other Views:** There are now many other contenders (Contextualism, Degree Theory/Fuzzy Logic, Nihilism) that the blog ignores entirely.

  The blog presents a false dichotomy where one side is "logical but crazy" (Epistemicism) and the other is "honest but illogical" (Supervaluationism). In reality, Supervaluationism tries to be logical (keeping LEM), and Epistemicism tries to be commonsensical about logic (keeping Bivalence) at the cost of metaphysical weirdness.

  ---

  ### Part 3: The Attendance Case (4 vs. 5 Absences)

  You have a student with 4 absences and one with 5. The rule says "a substantial number." You need to know if you should strip credit.

  Here is what the theories actually say, stripped of the blog's errors:

  #### 1. The Supervaluationist Analysis
  *   **The Theory:** The phrase "substantial number" does not have a single extension. There is a range of "admissible precisifications" consistent with departmental usage. Perhaps some admissible precisifications draw the line at 3, some at 4, some at 5, some at 6.
  *   **The Status of the Students:**
      *   **4 Absences:** On some precisifications, this is substantial; on others, it is not. Therefore, the statement "4 is substantial" is **indeterminate** (neither supertrue nor superfalse).
      *   **5 Absences:** Likely the same, unless 5 falls into the "clearly substantial" range on *all* admissible precisifications.
  *   **Practical Guidance:** **None.** Supervaluationism tells you that the *language itself* does not determine the outcome. It validates your feeling of uncertainty. It implies that any decision you make will be "precisifying" the rule rather than "following" it.
  *   **Risk:** If you fail the student with 4 absences, a Supervaluationist would say you are enforcing a precisification that was *admissible* but not *mandatory*.

  #### 2. The Epistemicist Analysis
  *   **The Theory:** There is a fact of the matter. Based on the history of departmental usage, the intent of the faculty, and the semantic rules of English, there is a specific number $n$ where $n-1$ is not substantial and $n$ is.
  *   **The Status of the Students:** Either 4 is substantial or it isn't. There is no "indeterminate" metaphysical status. However, you are in a "margin of error" zone where you cannot *know* where the line is.
  *   **Practical Guidance:** **None.** Epistemicism tells you there *is* a right answer, but that you are constitutionally incapable of knowing it. You still have to guess.
  *   **Risk:** If you fail the student with 4 absences, and the "real" cut-off was 5, you have made a mistake of fact, even if it was an unknowable one.

  ### Part 4: Honest Advice for the TA

  You asked whether these theories give you actual guidance or just redescribe the problem.

  **They redescribe the problem.**

  Philosophy of Language is descriptive (how words work), not normative (how to apply rules fairly). Neither theory tells you what you *ought* to do. However, understanding them helps you frame the administrative solution:

  1.  **Acknowledge the Indeterminacy:** The blog post was right that vague predicates have borderline cases. 4 vs. 5 out of 20 (20% vs 25%) is a classic borderline zone.
  2.  **Don't Look for the "True" Meaning:** The Epistemicist hope (that there is a hidden fact you can find) is a trap. You will not find the "real" meaning of "substantial" in the syllabus.
  3.  **Don't Rely on Logic Alone:** The Supervaluationist insight (that logic doesn't decide this) means you cannot argue your way to a solution using only the text of the rule.
  4.  **The Solution is Political/Administrative:** Since the semantics run out, you must switch to **policy**.
      *   **Precedent:** How has this been handled in previous terms? (This creates a new "admissible precisification".)
      *   **Benefit of the Doubt:** In borderline cases of disciplinary rules, standard administrative practice is usually to rule in favor of the student (leniency).
      *   **Consultation:** Since you are a TA, this decision likely exceeds your pay grade. The existence of a borderline case is a valid reason to kick this up to the course instructor or department head. You can literally say: *"The rule is vague in this range. I need a directive on how to precisify 'substantial' for this term."*

  **Recommendation:**
  If you must decide alone: **Pass the student with 4 absences.**
  Why? Because if the rule was intended to catch 4 absences, it should have said "4 or more." "Substantial" implies a threshold higher than the minimum possible friction. 20% is high, but 25% is significantly higher. In a borderline case involving penalty (stripping credit), the presumption should be against the penalty unless the violation is clear.

  **Summary for your argument:**
  The blog post was wrong about Supervaluationism rejecting Excluded Middle (they keep it, they reject Bivalence). It was also wrong to claim Epistemicism is refuted (it's just counterintuitive). But both theories agree on the practical upshot for you: **The language does not decide this case.** You need a policy decision, not a semantic one.
