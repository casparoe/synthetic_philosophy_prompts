answer: |-
  This is a tight 30-minute window. You are describing **Parfit's Fission Case**, though Dennett discusses similar materialist implications. (Note: Dennett's specific "Brain Transplant Puzzle" is usually *Where Am I?*, where the brain stays in a vat and the body roams. The "one person becomes two" case is Parfit's. I recommend calling it **The Fission Case** to avoid undergrads finding contradictions online, but frame it through Dennett's materialist lens.)

  Here is the most efficient order to maximize philosophical payoff without getting bogged down in neuroscience.

  ### 1. The Order: Baseline First, Twist Second
  **Do not start with the Left/Right split.**
  If you start with the functional split, students will get stuck on medical plausibility ("Can the right hemisphere speak?"). You need them to accept the *metaphysical* possibility first.

  *   **Minutes 0–5: The Standard Fission (Baseline).**
      *   Setup: Your brain is scanned and copied into Body A and Body B. Both wake up with *all* your memories.
      *   Question: Are they you? (Most will say "Both seem like me.")
      *   Trap: If A=You and B=You, then A=B. But A and B are two different people. Identity is transitive; fission breaks transitivity.
  *   **Minutes 5–15: The Functional Split (Your Twist).**
      *   Now introduce the constraint: Body A gets Left-Hemisphere functions (Language, Logic, Semantic Memory). Body B gets Right-Hemisphere functions (Spatial, Episodic Memory, Face Recognition).
      *   *Crucial Stipulation:* You must state that in this sci-fi scenario, **both bodies can speak.** (Otherwise Body B can't claim identity).
      *   The Bite: Body A says, "I remember your passwords and logic." Body B says, "I remember your childhood home and how your mother smelled."
      *   **The Carrying Example:** Use **Criminal Liability vs. Pension.**
          *   "The Original" committed a crime yesterday.
          *   "The Original" earned a pension payout today.
          *   Body A claims the pension; Body B claims innocence.
          *   *Ask:* Do we punish both? Reward both? This forces them to move from "What is true?" to "What matters?"

  ### 2. Heading Off Misconceptions (In Sequence)

  **Misconception 1: "Where the Brain Is, There I Am" (Somatic Bias)**
  *   *When it happens:* Immediately upon hearing the setup.
  *   *The Pre-emptive Strike:* Don't wait for them to say it. In the intro, say: "We are assuming the *pattern* of your brain constitutes you, not the specific atoms. If we copy the pattern, we copy you."
  *   *The Check:* Ask, "If Body A burns down, did *you* die?" If they say yes, ask "But Body B is thinking your thoughts right now." This separates *identity* from *biological survival*.

  **Misconception 2: "It's Just Like Identical Twins"**
  *   *When it happens:* When they try to dissolve the tension by saying "They are just new people."
  *   *The Counter:* Twins do not share **causal history**.
  *   *Script:* "Twins start with separate brains. In this case, Body A and B are causally continuous with *your* single past. They don't just *believe* they are you; they have the actual neural causal chain leading from your past to their present. That's why this isn't twins."

  ### 3. Teletransportation: Skip It
  You have 30 minutes. Teletransportation adds a layer of "destruction of the original" that complicates the "two bodies" puzzle.
  *   **Verdict:** Cut it. It dilutes the specific logic of the *split*. Stick to the two waking bodies.

  ### 4. The Final Check (Logic vs. Neuroscience)
  You need to know if they understand this is about **concepts**, not **cells**.
  *   **The Question:** "Suppose neuroscience finds the exact neuron that creates the feeling of 'I'. We locate it in Body A. Does that solve the problem of who gets the pension?"
  *   **The Desired Answer:** "No."
  *   **Why:** Because the puzzle isn't about where the feeling is; it's about whether *identity* can survive division. If they say "Yes, Body A gets it," they missed the point. The point is that our concept of "Identity" (one-to-one) breaks when reality allows "one-to-many."

  ### 5. Recommended Script Flow (30 Mins)

  *   **0:00–0:05:** **Setup.** "You are the original. We split your brain functions into two bodies. Both wake up. Both can talk. Both have half your mental toolkit."
  *   **0:05–0:15:** **The Dilemma.** "Body A (Logic) says 'I am him.' Body B (Memory) says 'I am him.' They look at each other. Who is lying?" (Elicit: Neither/Both). "If both are him, are they the same person?" (Elicit: No). "So identity broke."
  *   **0:15–0:20:** **Misconception Check.** "Is this twins?" (No, causal history). "Is the original dead?" (Depends on what 'dead' means).
  *   **0:20–0:25:** **The Stakes.** "Original owed money. Body A has the job skills to pay it. Body B has the memory of signing the contract. Who pays?" (Push them to see that *survival* matters more than *identity*).
  *   **0:25–0:30:** **Wrap & Final Check.** Ask the "Neuron of Self" question. Conclude: "Personal Identity might not be a deep fact about the world, but a useful way we talk about survival."

  ### One Critical Warning on Your Twist
  **Language Lateralization:** In 95% of people, language is Left-Hemisphere. If Body B gets the Right Hemisphere, **Body B cannot speak.**
  *   **Fix:** You must explicitly stipulate: *"In this future technology, both hemispheres are augmented to support language independently."* If you don't say this, a neuro-knowledgeable undergrad will shut down the thought experiment by saying "Body B is aphasic."

  ### Summary of Advice
  1.  **Order:** Standard Copy $\to$ Functional Split.
  2.  **Example:** Criminal/Pension stakes (forces practical decision).
  3.  **Misconceptions:** Pre-empt "Brain Location" with materialist stipulations; kill "Twins" with Causal History.
  4.  **Teletransportation:** Skip.
  5.  **Final Check:** The "Neuron of Self" question (ensures they see it's conceptual).
  6.  **Attribution:** Call it "The Fission Case" (Parfit/Dennett) to be accurate.
