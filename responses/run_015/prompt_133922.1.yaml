  Dependency order (~120 words)
  Start with survival defined as maintaining structural integrity against entropy. This necessitates avoiding unexpected physiological states. To avoid surprise, the system must internally model the external causes of sensory data. This model generates top-down predictions about incoming signals. Mismatches between prediction and actual data create precision-weighted error signals. The system minimizes these errors either by updating the model (perception) or changing the sensory data through movement (action). This continuous loop constitutes existence. Crucially, this applies to all living systems. Finally, introduce 'free energy' as the mathematical upper bound on surprise, not a physical substance. It is a universal law. Each step forces the next: integrity requires surprise minimization, which requires modeling, which requires error correction, which defines action and perception jointly.

  The carrying example (~100 words)
  Imagine a tidal gauge surviving. Adjusts exposure continuously to minimize surprise about levels. Needs storm model and actuators to raise sensor height. If water rises, climbs to match prediction or updates model. Trap: assuming it *wants* to be dry. Minimizes difference between expected and states. If model says 'flooded is normal,' stays submerged. Avoids purpose; follows statistical necessity. Gauge acts to confirm predictions, not to achieve safety. Goal: reducing surprise, ensuring operation regardless of wetness.

  Misconception map (~130 words)
  When introducing survival, editors will think 'free energy is literal heat.' Kill this immediately: define it as a statistical bound on surprise, not thermodynamics. They confuse physics with information theory. Next, during modeling, they'll assume 'predictions are conscious guesses.' Correct this during error signals: predictions are sub-personal physiological expectations, like reflexes. Finally, discussing action, they'll think 'error signals are bad news.' Kill this at loop closure: errors are driving fuel, not failures. Without error, there is no update, no learning, no life. Order matters. Delaying energy clarification poisons the statistics. Prevent anthropomorphizing by addressing consciousness early. Treat errors as essential information, not failures. Explain that pain is just high precision error.

  The check (~50 words)
  Ask them: "If the tidal gauge's model predicts a flood, but the water stays low, what must it do to minimize free energy?" If they say "wait for flood," they fail. If they say "lower itself to meet the water or change the model," they pass. This tests action-perception symmetry well.

  What to skip (~60 words)
  Do not write the variational free energy equation on the board. It looks like physics magic and stops conversation. Also skip talk of 'Bayesian brains' without context; it sounds like rational choice theory. Avoid mentioning 'hallucination' unless defined as controlled prediction. Do not dive into hierarchical depth beyond two layers. Keep it operational, not mathematical.
