      *   **Conclusion:** Summarize the tension. It's not a math problem with a clean solution; it's a clash of moral weights.

  5.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing. The user is smart (hydrologist, advisory committee).
      *   Use terms like "error bars," "boundary conditions," "variables."
      *   Be empathetic about the brother. The "smiling and eating lunch" detail is haunting.
      *   Address the specific question: "Does the practice collapse?" -> No, it shifts from *epistemic* (knowing the future) to *normative* (valuing the past).

  6.  **Self-Correction/Review during drafting:**
