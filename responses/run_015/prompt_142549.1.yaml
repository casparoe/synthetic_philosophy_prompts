answer: |-
  This is a profound set of questions, and I want to acknowledge the weight of the experience behind them. You are describing a collision between two different ways of measuring a life: one based on the integrity of the narrative (the story the person wrote for themselves) and one based on the immediate data of experience (the smile, the lunch, the garden).

  As a hydrologist, you are used to systems where boundary conditions determine flow. In bioethics, we often pretend the boundary condition is "capacity." If capacity > threshold, current flow wins. If capacity < threshold, prior channel wins. Your observation is correct: the system behaves as if capacity is the switch, but the wiring underneath is far messier.

  Here is an analysis of what the practice strictly requires, where the inconsistencies lie, and what the alternative models would look like.

  ### 1. The "Flip" at the Capacity Line: Consistency or Contradiction?

  You asked if the practice collapses at the capacity line or if there is a unifying principle.

  **The Official Principle:** The unifying principle is **Autonomy**, defined not as a momentary state but as a temporal extended right. The law treats you as a single entity stretching from past to future. When you are competent, your autonomy is exercised *directly*. When you are incompetent, your autonomy is exercised *by proxy* via your prior competent self.

  **The Contradiction:** The inconsistency you sense arises because "Autonomy" is doing two different jobs.
  1.  **Competent Revocation:** Here, autonomy is about *liberty*. The state cannot force a treatment on a competent person, nor can it force them to adhere to a past promise if they change their mind.
  2.  **Incompetent Adherence:** Here, autonomy is about *integrity*. It protects the "critical interests" (Ronald Dworkin's term) of the life as a whole from being undermined by the "experiential interests" of the diminished self.

  **The Psychiatric Exception:** You noted that in psychiatric crises, advance directives (Ulysses contracts) can override current competent-seeming demands. This reveals that capacity is not the only variable. The other variables are **reversibility** and **authenticity**.
  *   In dementia, the change is viewed as permanent and the "new" preferences are viewed as symptoms of the disease, not authentic choices.
  *   In a manic or psychotic episode, the change is viewed as temporary, and the "current" demands are viewed as distortions of the authentic self.
  *   *Strictly speaking*, the practice presupposes that dementia changes *who you are*, while psychiatric crises only change *how you are*. This is a metaphysical claim, not a medical one.

  ### 2. Transformative Experience and the "He Couldn't Have Known" Problem

  You mentioned L.A. Paul's idea of transformative experience: you cannot know what a state is like until you are in it. If this is true, does the Advance Directive (AD) collapse?

  **No, but its function shifts.**
  If we accept the transformative experience view, an AD cannot be a *prediction* of future happiness. My brother at 60 could not predict the joy of the music session at 75.
  However, the practice does not require the AD to be a prediction of *experience*; it requires it to be a statement of *values*.

  *   **The Presupposition:** The practice assumes that **values are more stable than states of being.** It assumes your brother valued "not being a burden," or "mental continuity," or "dignity as he defined it" more than he valued "momentary contentment."
  *   **The Commitment:** Signing an AD under the transformative view is not saying, "I know I won't like it." It is saying, "Even if I like it, I do not want to be the kind of person who exists in that state." It is a pre-commitment strategy, like Odysseus tying himself to the mast. He knew the Sirens would sound good (transformative experience), but he valued getting home (critical interest) more.

  **Where it is underdetermined:** The practice allows for both views.
  1.  **Epistemic View:** You sign because you know dementia is bad. (This is vulnerable to the "he seemed happy" critique).
  2.  **Normative View:** You sign because you value a certain narrative arc, regardless of the subjective weather along the way. (This withstands the "he seemed happy" critique).
  The hospital forms don't distinguish these, which creates the confusion you witnessed. The staff were arguing from the Epistemic view ("He looks okay, maybe he doesn't mind"). You were arguing from the Normative view ("He decided this life wasn't worth living, regardless of how it feels").

  ### 3. Personal Identity: Who is the "He"?

  You asked about the assumption regarding who a person is across time.

  **The Legal Requirement:** The law requires only **numerical identity** (same biological human) to enforce the directive. It does not require **narrative identity** (same personality/memory).
  **The Ethical Tension:** If you hold a "psychological continuity" view of identity (I am only me as long as I have my memories/values), then the man in the bed *is not* your brother. He is a new being who inherited your brother's body. If he is a new being, your brother's directive has no authority over him.
  **The Practice's Stance:** The practice strictly requires that we treat biological continuity as sufficient for moral authority. It refuses to accept that dementia creates a "new person." If it accepted that, ADs would be unenforceable. So, to keep the forms valid, the system *must* assume the pre-dementia self and the demented self are the same moral agent, even if they share no psychological traits.

  ### 4. Substituted Judgment vs. Best Interests

  This is the core of your last point, and it is the sharpest tool in the box.

  *   **"What is best for him now" (Best Interests):** This is a utilitarian calculation. It looks at the current data points: pain, pleasure, smiling, eating. It asks, "Does this organism have a net positive balance of well-being right now?" If you use this standard, the staff were right. The man in the bed was content. Keeping him alive served his current interests.
  *   **"What he would have wanted" (Substituted Judgment):** This is a deontological calculation. It looks at the historical data. It asks, "What instruction did the author of this life leave?" It prioritizes the *authority* of the past self over the *welfare* of the present self.

  **The Instruction You Received:** You were told to use Substituted Judgment. This strictly requires you to ignore, to some degree, the current contentment of the patient if it contradicts the prior values. It assumes that **precedent autonomy trumps current well-being.**
  This is why the system feels inconsistent to you. In almost every other branch of medicine, "Best Interests" is the fallback when a patient can't speak. In end-of-life care, "Substituted Judgment" is the fallback. The system makes this exception because it views death as a unique threshold that, once crossed, cannot be undone, and thus requires the highest standard of prior consent.

  ### 5. What If We Built It on the Other Assumption?

  You asked what the practice would look like if we assumed lived experience is the only real evidence (the "Current Self" model).

  1.  **ADs become Advisory Only:** Forms would be explicitly non-binding. They would be "Letters of Guidance." A physician could look at a smiling, eating patient and say, "The directive says no treatment, but the patient is clearly benefiting from life, so we will treat."
  2.  **Surrogates become Advocates for the Present:** You would not be asked "What would he want?" You would be asked "What is good for him *now*?" Your knowledge of his past values would be relevant only insofar as it helps interpret his current needs, not to override them.
  3.  **The "Sunset Clause":** Directives might expire after a certain duration of incapacity (e.g., "This directive is valid for 2 years after loss of capacity, after which current well-being determines care").
  4.  **Restriction on Signing:** As you suggested, people might only be allowed to sign after a "trial period" or extensive counseling that emphasizes the possibility of finding joy in diminished states.

  **Why we don't do this:** The fear is the "Happy Slave" problem. If current contentment is the only metric, we might be obligated to keep people alive in states they would find undignified, simply because their disease prevents them from understanding the indignity. We prioritize the *right to refuse* over the *duty to preserve* when the two conflict.

  ### Summary of the "Error Bars"

  To answer your specific question on what the practice *strictly requires*:

  1.  **Identity:** It requires biological continuity to suffice for moral authority, ignoring psychological discontinuity.
  2.  **Time:** It requires the Past Self to have veto power over the Future Self, but not vice versa. (Asymmetry).
  3.  **Knowledge:** It does *not* require that the Past Self knew what the Future Self would feel like. It only requires that the Past Self had the right to set the boundaries of the Future Self's existence.
  4.  **Well-being:** It defines well-being as "living a life consistent with one's values," not "experiencing positive affect."

  **The Inconsistency:** The system is not logically inconsistent, but it is **morally pluralistic**. It tries to serve two masters: Protection of the Vulnerable (the smiling man in the bed) and Respect for Autonomy (the man who signed the paper). Usually, these masters agree. In your brother's case, they went to war. The system has a standing order: Autonomy wins.

  **The Hydrologist's Take:** You might view the Advance Directive not as a measurement of future quality of life (which has high error bars due to transformative experience), but as a **levee**. Your brother built a levee around his life. He didn't build it because he knew exactly how high the water would get; he built it because he knew he didn't want to live in the floodplain. The fact that the water (dementia) turned out to be warm and pleasant doesn't mean the levee was a mistake. It means the levee did its job: it kept the water out, even if the water didn't mind being kept out.

  You followed the instruction "what he would have wanted." That is the only variable the system allows you to control. The discomfort you feel is the friction of that principle grinding against the reality of the smiling man. That friction is not a bug in the system; it is the cost of the principle.
