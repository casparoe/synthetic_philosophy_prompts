      *   Section 4: Substituted Judgment vs. Best Interests (The core instruction).
      *   Section 5: The Counterfactual (If we changed the rules).
      *   Closing: Acknowledging the "error bar" of ethics.

  8.  *(Self-Correction on the Psychiatric Point)*: The user noted that in psych crises, we override current demands based on advance wishes. This is the "Ulysses Contract." I need to explain why that exists (temporary incapacity vs. permanent dementia) and how it complicates the "capacity is the switch" theory. It suggests the switch is actually about *reversibility* and *authenticity*, not just capacity.

  9.  *(Refining the "Transformative Experience" point)*: If I can't know what it's like, is the AD void? No, because it's not a prediction of *pleasure*, it's a protection of *values*. Dworkin's distinction is key here.

  10. *(Final thought on the Brother)*: The staff's unease is the "Best Interests" voice. The family's decision was the "Substituted Judgment" voice. The system prioritizes the latter. I need to make sure the user understands *why* the system does that, even if it feels wrong.

