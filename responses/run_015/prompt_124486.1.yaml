prompt: |-
  Write a one-page proposal for a six-month philosophical project on a gap in how Lemkin’s genocide concept applies to slow-moving, structurally mediated group destruction—such as climate-induced displacement or systematic economic dispossession—where direct mass killing is absent. State the precise question: does the “intent to destroy” element require a targeted biological or reproductive aim, or can it be satisfied by deliberate policies that foreseeably dissolve a group’s material conditions of collective existence without killing its members? Explain why existing legal and moral debates leave this open: they tend to treat “cultural genocide” and “physical genocide” as exhaustive alternatives, ignoring an intermediate mode—call it structural dissolution—that Lemkin’s original framework may implicitly recognize but that the UN Convention excludes. Propose the method: analytically reconstruct the architecture of group destruction from Lemkin’s standard definitions, then apply that reconstructed framework to two contemporary case-types—environmental displacement and forced economic assimilation—to see whether they yield coherent classifications or generate internal contradictions. Specify the deliverable: a conceptual taxonomy with decision criteria for naming authorities, not an empirical study or legal brief. Define failure: if the framework collapses either into pure intentionalism (making structural cases unnameable) or into pure outcome-based classification (stripping genocide of its distinctive moral weight). Give an honest scope assessment for six months, and flag the specific risk that the project drifts into a general theory of structural violence rather than remaining a focused intervention in genocide taxonomy. Do not include a bibliography or citation requests; references can be added later.
