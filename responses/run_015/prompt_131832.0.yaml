  - Standardized weights and measures recovered across independent market sites license inferring a normative institution of fair exchange, not merely shared craft skill.
  - Temples with precise astronomical alignments but no written calendars still license inferring an underlying cosmological belief system.
  - Identical decorative motifs on pottery found hundreds of kilometers apart do not license inferring shared religious belief; trade or stylistic imitation suffices.
  - A sudden, culture-wide shift in burial orientation occurring immediately above a stratigraphic layer indicating conquest licenses inferring changed religious belief, even though political coercion offers an alternative explanation.
  - Large-scale irrigation works with no administrative seals or writing implements do not license inferring the absence of bureaucratic belief; oral coordination remains plausible.
  - Child-sized functional replicas of adult tools in workshop debris license inferring a formal apprenticeship institution, not merely play.

  The case I keep reversing: a society with abundant adult funerary goods but virtually none for children, despite skeletal evidence of high child mortality. Sometimes the absence licenses inferring that children lacked full social-person status; other times it looks like pure economic rationality, so absence proves nothing.

  Is there a coherent principle that captures verdicts 1–6 and resolves the child-burial case? If not, which verdict should be dropped? State the principle precisely, defend it against my cases, identify any overturned verdict, and apply it to one further case: every settlement in a region builds an identical defensive wall, yet no settlement shows evidence of a central authority. Keep the response under 250 words: begin with the principle in one sentence, then address the cases, the unstable verdict, and close with your prediction for the wall case.
