      *   **User's Hypothesis:** "Institutional Self-Cannibalization." Revolutionary bodies generate internal opposition faster than they neutralize outside threats. Specifically, once the external threat dropped (Battle of Fleurus, June 1794), the Committee of Public Safety (CPS) became redundant, allowing the Convention to dismantle it (and Robespierre).
      *   **Task:** Analyze the period (April Danton execution -> July Thermidor) through three standard lenses (Class Struggle, Ideology, Contingency) *filtered through* the user's "Institutional Self-Cannibalization" framing.
      *   **Requirements:**
          *   For each lens: What does it explain well? Where does it miss?
          *   Evaluate the user's framing: Does it add value or is it just "contingency in fancier clothes"?
          *   Be disciplined: Identify actual players, evidence, and acknowledge silence/uncertainty.
          *   **Crucial Test:** Identify a specific fact about Thermidorian motives that would falsify the institutional story (e.g., genuine terror of a personal list vs. structural incentives).
          *   **Self-Critique:** Explicitly state where the reasoning is most likely to fail.

  2.  **Initial Assessment & Fact-Checking:**

      *   *Timeline:* Danton executed April 5, 1794. Battle of Fleurus June 26, 1794. Robespierre's speech 8 Thermidor (July 26). Arrest/Execution 9-10 Thermidor (July 27-28).
      *   *User's Hypothesis:* The "Fleurus Redundancy" thesis is a classic structuralist argument (often associated with Soboul or Furet, though Furet leans more ideological). It posits that the Terror was a wartime emergency measure. Peace makes the Terror untenable.
      *   *User's Framing:* "Institutional Self-Cannibalization." This suggests a systemic tendency for revolutionary institutions to produce enemies internally as a function of their operation, accelerated when external pressure drops.
      *   *The Three Lenses:*
          1.  *Class:* Bourgeoisie vs. Sans-culottes/Enragés. Thermidor as a bourgeois reaction against price controls (Maximum) and radicalism.
          2.  *Ideology:* Virtue vs. Terror. The logic of purity demands ever-new enemies.
          3.  *Contingency:* Robespierre's illness, his speech on 8 Thermidor, the specific conspiracy of Tallien, Billaud-Varenne, Collot d'Herbois.
      *   *The "Cannibalization" Filter:* How do these lenses interact with the idea that the *institution itself* (Convention/CPS) generates the opposition?

  3.  **Drafting the Analysis - Lens by Lens:**

      *   **Class Struggle + Cannibalization:**
          *   *Explanation:* The CPS enforced the Maximum (price controls) to please sans-culottes. The Convention (mostly bourgeois lawyers/proprietors) hated this. As the war wound down, the need for sans-culotte mobilization dropped. The Convention "cannibalized" the CPS to kill the economic controls.
          *   *Miss:* It assumes a unified "bourgeoisie." Many Thermidorians were regicides with blood on their hands. It doesn't explain why *Robespierre* specifically, rather than just the policies.
          *   *Evidence:* Abolition of the Maximum in December 1794 (after Thermidor). The composition of the Convention.

      *   **Ideology + Cannibalization:**
          *   *Explanation:* The logic of "Virtue" requires purifying the republic. If no external enemies exist, internal enemies must be found. Robespierre became the victim of the purity spiral he helped create. The institution consumes the ideologue when the ideology runs out of fuel.
          *   *Miss:* Robespierre was trying to *stop* the Terror (Law of 22 Prairial is ambiguous, but he opposed atheism and excessive bloodshed recently). The ideology lens often treats ideas as autonomous agents, ignoring human agency.
          *   *Evidence:* Robespierre's speech on the Cult of the Supreme Being. His conflicts with Hébertists (atheists) and Dantonists (indulgents).

      *   **Contingency + Cannibalization:**
          *   *Explanation:* The institution created a pressure cooker. Who snapped first? Robespierre didn't name names on 8 Thermidor. This panic triggered the conspiracy. The "cannibalization" is just the context for the knife fight.
          *   *Miss:* It reduces structural pressure to luck. It ignores that *many* people had motive.
          *   *Evidence:* The specific conspiracy (Tallien, Fouché). Robespierre's absence from the Committee prior to Thermidor.

  4.  **Evaluating the User's Framing ("Institutional Self-Cannibalization"):**

      *   *Is it just contingency?* No. Contingency says "it could have gone either way." Institutional Cannibalization says "the system *tends* toward this outcome because of its design." It adds predictive power (or at least post-hoc structural logic).
      *   *Value Add:* It bridges the gap between "Class" (too economic) and "Contingency" (too random). It focuses on *procedure* and *jurisdiction*. The Law of 22 Prairial is key here—it centralized punishment, threatening Convention members' immunity.
      *   *Critique:* It risks teleology (assuming the end was inevitable). It might underplay the role of the Sections (Paris Commune).

  5.  **The Falsification Test:**

      *   *User Question:* If they were genuinely terrified of Robespierre's personal list rather than acting on structural incentives, does that kill the institutional story?
      *   *My Answer:* No, it *confirms* it. The institutional story argues the structure created the fear. If the structure (Law of 22 Prairial) gave Robespierre the *power* to make a list, the fear is structurally induced.
      *   *The Real Falsifier:* If evidence showed the Thermidorians planned to *expand* the Terror and keep the CPS powers intact immediately after July 27, the "redundancy/restraint" theory fails. Or, if Robespierre had *no* support in the Convention and was purely an outsider (he wasn't, he was a member).
      *   *Better Falsifier:* If the Convention members who voted against him were primarily *radical* sans-culottes rather than moderate deputies fearing for their own necks. The class composition of the voters matters.
      *   *Wait, let's refine:* The user asks about motives. If the motive was purely personal vendetta (e.g., Collot d'Herbois fearing recall from Lyon) *without* broader Convention support, it's contingency. If the broader Convention voted out of fear of the *mechanism* (the Law of 22 Prairial), it's institutional.
      *   *Specific Fact:* The content of the private conversations among the conspirators *before* the public session. Did they discuss saving the Republic from tyranny (structural) or saving their skins from a specific purge (personal)? Actually, "saving their skins" *is* the institutional incentive if the institution allows arbitrary purges.
      *   *Strongest Falsifier:* If the Thermidorians immediately reinstated the same powers for themselves. They didn't. They dismantled the CPS. This supports the institutional view. To kill the institutional view, we'd need evidence that the Convention *wanted* to keep the Terror but hated Robespierre's face. They didn't. They hated the machine.

  6.  **Refining the "Silence" and "Failure Points":**

      *   *Silence:* I don't have access to the private thoughts of the Plain (Marais). I rely on speeches and votes.
      *   *Failure Point:* Overstating the "Fleurus" impact. News traveled slowly. The psychological shift might have lagged the military victory. Also, the war wasn't actually over in June 1794 (coalition still existed).

  7.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the "Fleurus Redundancy" thesis but complicate it.
      *   **Section 1: The Three Lenses through "Institutional Cannibalization".**
          *   Class (Economic interests vs. Institutional survival).
          *   Ideology (Purity vs. Institutional stability).
          *   Contingency (The spark vs. the powder keg).
      *   **Section 2: Evaluating the Framing.** Is it new or just fancy contingency? (Argue it's distinct: it's about *systemic feedback loops*).
      *   **Section 3: The Falsification Test.** What fact would change the mind? (Focus on the *scope* of the purge intended vs. the *mechanism* used).
      *   **Section 4: Limitations & Silence.** Where does this analysis break down? (Role of the Sections, speed of information, individual psychology).

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Be careful not to say the war was *over* at Fleurus. It was the turning point, but fighting continued. The *perception* of safety is what matters.
      *   *Correction:* The Law of 22 Prairial (June 10) is more important than Fleurus for the "Cannibalization" thesis. It removed defense counsel and expanded the definition of enemies to include "moral" enemies, threatening deputies.
      *   *Refining the Falsifier:* If the Thermidorians' primary motive was to *continue* the Terror but under different management, the "redundancy" theory is wrong. If their motive was to *end* the Terror because the institution was eating them, the theory is right. Historical consensus is the latter. So, what would change my mind? Evidence that the "Plain" voted for Robespierre's fall expecting *more* purges, not fewer.

  9.  **Final Polish:** Ensure tone is academic but engaging. Match the user's "disciplined" request. (Check: Did I answer the specific question about the "personal list"? Yes, need to address that directly).

      *   *Wait, one nuance on the "List":* Robespierre hinted at a list but refused to name names. The fear was *uncertainty*. The institutional argument says the *existence* of the mechanism (Law of 22 Prairial) made the uncertainty lethal. If the fear was *only* about Robespierre's personal grudges (e.g. he hated Tallien specifically) and not the *systemic power* to purge, that leans contingency. If the fear was "He can use the Revolutionary Tribunal on *anyone*," that's institutional.

      *   *Okay, let's lock in the Falsifier:* If evidence emerged that the majority of the Convention believed Robespierre intended to purge *only* specific corrupt members (like Fouché/Tallien) and not the legislature as a whole, yet they still overthrew him, that suggests personal/contingent motives over structural defense of the institution. But historically, they feared for the *Convention's* sovereignty.

      *   *Wait, better Falsifier:* If the Thermidorians immediately reconstituted the CPS with the *same* powers. They didn't. They fragmented power. So the structural argument holds. To kill it, I need evidence that the fragmentation was accidental, not intentional.

      *   *Let's go with the User's specific prompt:* "If they were genuinely terrified of Robespierre's personal list rather than acting on structural incentives..."
      *   *My take:* Fear of a personal list *is* a structural incentive if the structure allows one man to wield that list without check. The distinction is: Did they fear *Robespierre* or the *Office*? If they killed him but kept the Office, it's personal. If they killed him and the Office, it's structural.

      *(Self-Correction)*: I need to be careful. The user asks if genuine terror of a *personal list* kills the institutional story. I should argue that it *depends* on whether the list was possible due to the *institution* or the *man*. Since the Law of 22 Prairial enabled the list, the terror is institutionally mediated. To kill the story, we'd need to show the terror was based on extra-institutional power (e.g., mob power alone).

      *Okay, ready to write.*
answer: |-
  This is a sophisticated historiographical challenge. You are effectively asking to test a structuralist hypothesis (the "Fleurus Redundancy" thesis) against a specific mechanism ("Institutional Self-Cannibalization") while holding the standard historiographical triad (Class, Ideology, Contingency) constant.

  Your hypothesis rests on a specific causal chain: **External Threat Reduction (Fleurus) $\rightarrow$ Institutional Redundancy (CPS) $\rightarrow$ Legislative Reassertion (Convention) $\rightarrow$ Purge of Executive (Robespierre).**

  Here is the analysis of the period between Danton's execution (April 1794) and Thermidor (July 1794), mapped through your framing, followed by the falsification test and limitations.

  ---

  ### 1. The Three Lenses Through "Institutional Self-Cannibalization"

  Your framing posits that revolutionary institutions are not just tools used by factions, but engines that generate opposition internally as a function of their own operation. Here is how the standard lenses interact with that engine.

  #### A. Class Struggle (The Bourgeois Reaction)
  *   **The Mechanism:** The Committee of Public Safety (CPS) relied on the *sans-culottes* (Sections) to enforce the Maximum (price controls) and the Terror. The Convention was predominantly bourgeois (lawyers, proprietors). As the war turned (Fleurus, June 26), the need for *sans-culotte* mobilization dropped. The Convention "cannibalized" the CPS to dismantle the economic controls that threatened property rights.
  *   **What it Explains Well:** It accounts for the *timing* of the economic reversal. The Maximum was abolished in December 1794, shortly after Thermidor. It explains why the "Plain" (moderate majority) sided with the conspirators: they were property owners fearing the "socialism" of the Hébertists/Robespierrists.
  *   **Where it Misses:** It assumes a class coherence that didn't exist in July 1794. Many Thermidorians (Tallien, Fouché, Collot d'Herbois) were regicides with blood on their hands, just like Robespierre. They were not "moderates" in 1789 terms; they were terrorists turning on a fellow terrorist. A pure class lens cannot explain why the "bourgeois" Convention tolerated the Terror for two years and only turned when they did. It misses the *intra-elite* nature of the conflict.
  *   **Verdict on Your Framing:** Your "cannibalization" frame improves on Class by focusing on **jurisdiction** rather than **economics**. The Convention didn't just want lower prices; they wanted to reclaim the power to arrest their own members (which the Law of 22 Prairial had stripped).

  #### B. Ideology (The Logic of Purity)
  *   **The Mechanism:** Revolutionary ideology demands "Virtue." If external enemies (Austria/Prussia) recede, the logic of purity demands internal enemies to sustain the revolutionary momentum. Robespierre becomes the victim of the purity spiral he institutionalized. The institution consumes the ideologue when the ideology runs out of external fuel.
  *   **What it Explains Well:** It explains the **Law of 22 Prairial** (June 10). This law expanded the definition of "enemy" to include moral corruption and removed defense counsel. It created a machine that could eat anyone. Robespierre's speech on 8 Thermidor, where he denounced "traitors" but refused to name them, is the peak of ideological toxicity: it weaponized uncertainty.
  *   **Where it Misses:** It treats ideas as autonomous agents. Robespierre was actually attempting to *curb* the Terror in his final weeks (opposing the atheistic Cult of Reason, trying to save some Dantonists). The ideological lens often ignores that Robespierre was trying to *stabilize* the institution, not accelerate the purge. It misses the human attempt to brake the machine.
  *   **Verdict on Your Framing:** Your frame captures the **feedback loop** better. Ideology explains *why* the machine was built; "Institutional Cannibalization" explains *why* it spun out of control. The institution required enemies to function; when external enemies faded, the institution turned on its operators to survive.

  #### C. Contingency (The Conspiracy of the Guilty)
  *   **The Mechanism:** The "Cannibalization" was not inevitable; it was triggered by specific actors (Tallien, Billaud-Varenne, Collot d'Herbois) who feared they were next on Robespierre's list. The "Fleurus" factor is secondary to the fact that Robespierre stopped attending the Committee and hinted at a purge.
  *   **What it Explains Well:** The specific **coalition of the guilty**. These men had committed atrocities in the provinces (Lyon, Bordeaux) and knew Robespierre disapproved. Their motive was survival, not abstract constitutionalism. If Robespierre had named names on 8 Thermidor, the conspiracy might have fractured.
  *   **Where it Misses:** It reduces a structural crisis to a knife fight. It ignores that the Convention *voted* for the arrest. A conspiracy of ten men cannot overthrow a government without the acquiescence of the hundreds in the Plain. Contingency explains the spark, not the powder keg.
  *   **Verdict on Your Framing:** Your frame elevates Contingency from "accident" to **"trigger within a system."** The conspiracy was the mechanism by which the institution expelled the threat. It wasn't random; it was the system's immune response.

  ---

  ### 2. Is "Institutional Self-Cannibalization" Just Fancier Contingency?

  It is **not** just contingency in fancier clothes, provided you define "Institution" rigorously.

  *   **Contingency** says: "Robespierre made a mistake on 8 Thermidor; if he had named names, he survives."
  *   **Institutional Cannibalization** says: "The concentration of police and judicial power in the CPS, combined with the removal of external threats, made a collision between the CPS and the Convention statistically probable, regardless of who spoke first."

  **Where your framing adds value:**
  It explains the **post-Thermidor settlement**. If this were purely personal/contingent, the Thermidorians might have kept the CPS powers for themselves. They did not. They immediately fragmented the Committee, restricted its powers, and recalled representatives on mission. They dismantled the *machine*, not just the *operator*. This suggests the Convention recognized the institution itself was the threat to their sovereignty.

  **Where your framing risks tautology:**
  If you define "Institution" as "the sum of all political actions," then every outcome is "institutional." To avoid this, you must specify the **rules of procedure** that forced the outcome. The key evidence here is the **Law of 22 Prairial**. It removed the Convention's immunity from arrest. That is a specific institutional change that generated the opposition. Without that specific law, the "cannibalization" thesis is weak.

  ---

  ### 3. The Falsification Test

  You asked: *If they were genuinely terrified of Robespierre's personal list rather than acting on structural incentives, does that kill the institutional story?*

  **No.** In fact, it strengthens it.

  Here is the distinction:
  1.  **Personal Fear:** "Robespierre hates Tallien because Tallien is corrupt." (Contingency)
  2.  **Structural Fear:** "The Law of 22 Prairial allows Robespierre to execute Tallien without evidence, trial, or Convention approval." (Institutional)

  If the Thermidorians were terrified of the *list*, it is because the **institution gave the list teeth.**

  **The Specific Fact That Would Change My Mind:**
  To falsify the "Institutional Redundancy/Cannibalization" thesis, I would need evidence that the Convention intended to **retain the powers of the CPS** immediately after Robespierre's fall.

  *   **Current Evidence:** Within weeks of Thermidor, the Convention stripped the CPS of its control over the police and the Revolutionary Tribunal. They rotated membership frequently to prevent consolidation.
  *   **Falsifying Fact:** If minutes from the Thermidorian private caucuses (July 28–August 1794) showed a consensus to **reconstitute the CPS with identical emergency powers** under a different leader (e.g., Barras or Carnot), *then* the institutional story dies. That would prove the issue was Robespierre's *face*, not Robespierre's *office*. It would mean the "cannibalization" was personal, not structural.
  *   **Alternative Falsifier:** If the Battle of Fleurus had **no impact** on the psychological state of the deputies. If correspondence shows deputies were equally terrified of invasion in August 1794 as they were in March 1794, the "Redundancy" thesis collapses. (Historical consensus suggests news of Fleurus *did* shift the mood, but the lag time is a vulnerability in the theory).

  **Regarding the "Personal List":**
  If evidence showed the Thermidorians believed Robespierre intended to purge *only* the corrupt representatives (Fouché, Tallien) and **spare the Convention as a whole**, yet they overthrew him anyway, that leans toward contingency/personal vendetta. However, if they believed Robespierre intended to use the purges to **subordinate the Convention to the Committee** permanently, that is an institutional defense. The speeches on 9 Thermidor (e.g., by Billaud-Varenne) explicitly frame the action as defending the Convention's sovereignty against a "tribune" or "dictator." This supports your institutional framing.

  ---

  ### 4. Limitations and Silence

  I must be explicit about where this reasoning is likely to fail or where I am silent.

  **1. The Role of the Sections (The Sans-Culottes):**
  My analysis focuses on the Convention and the CPS (the top). It is largely silent on the Paris Commune and the Sections (the bottom). The "Institutional Cannibalization" thesis assumes the conflict was vertical (Convention vs. Committee). However, Thermidor also required the **neutralization of the Sections**. The Convention had to arm the bourgeois neighborhoods to defeat the *sans-culotte* support for Robespierre. If the Sections had risen effectively, the institutional logic of the Convention would have failed. My framing underestimates the **street variable**.

  **2. The "War is Over" Assumption:**
  I am accepting the premise that Fleurus made the CPS redundant. This is debatable. The War of the First Coalition did not end in 1794; fighting continued into 1795 and 1797. The "redundancy" was psychological, not strategic. If the threat was still perceived as existential by key deputies, the "redundancy" argument weakens. I am silent on the specific intelligence reports available to the Convention on 8 Thermidor.

  **3. Robespierre's Agency:**
  This framing risks making Robespierre a passive victim of a system. He actively cultivated the Cult of the Supreme Being and pushed the Law of 22 Prairial. The "Cannibalization" was, in part, self-inflicted. My analysis might underweight his **strategic miscalculation**. He may have believed he could purge the Committee without losing the Convention. That is a failure of political craft, not just institutional determinism.

  **4. The Speed of Information:**
  I am assuming the Convention reacted to Fleurus (June 26) by Thermidor (July 27). In reality, the psychological shift takes time. Attributing the shift solely to the battle ignores the cumulative fatigue of the Terror. The "Cannibalization" might have happened *without* Fleurus, just later. If so, Fleurus is a correlate, not a cause.

  ### Summary
  Your "Institutional Self-Cannibalization" framing is robust. It successfully integrates Class (who benefits from dismantling the machine), Ideology (why the machine requires enemies), and Contingency (who pulled the lever). It is superior to the "devours its children" trope because it identifies the **mechanism** (concentration of police power + removal of external threat + legislative immunity).

  It is only falsified if the Thermidorians sought to **keep the machine** running. Since they dismantled it, the structural argument holds: the Convention killed Robespierre to save itself from the institution he embodied.
