prompt: |-
  I'm taking a course on revolutionary politics and I'm finding the usual "revolutions devour their children" trope kind of frustrating — it explains everything and nothing about Robespierre's fall in 1794. The timeline I have in mind is Danton executed in April, then by July Robespierre gives that speech refusing to name names on the 8th of Thermidor, and within a couple days the Convention turns and he's dead. But I'm wondering if there's a more specific institutional mechanism hiding behind the metaphor: once the war turned after Fleurus in June, wasn't the Committee of Public Safety suddenly redundant? It had been the only body that could coordinate military and domestic policing, so once the external threat dropped, the Convention could afford to dismantle the machinery that kept it alive — which just happened to be Robespierre's machinery. So was his fall structurally overdetermined, or genuinely contingent on personal missteps and the specific coalition that formed?

  Can you analyze the months between Danton's execution and the Thermidorian Reaction through the three standard lenses — class struggle, ideology, and contingency — but run them through a framing I just made up: "institutional self-cannibalization," where revolutionary bodies generate internal opposition faster than they neutralize outside threats. For each lens, say what it explains well (bourgeois economic interests? the toxicity of ideological purity? pure accident of who spoke first?) and where it misses the episode. Then tell me whether my framing adds any real explanitory value beyond those three, or if it's just contingency in fancier clothes. Be disciplined about the mapping — who are the actual players, what counts as evidence — and say where you're silent rather than forcing the theory to speak. Most importantly, tell me what specific fact about the Thermidorians' motives would change your mind: if they were genuinely terrified of Robespierre's personal list rather than acting on structural incentives, does that kill the institutional story? And be explicit about where your reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

