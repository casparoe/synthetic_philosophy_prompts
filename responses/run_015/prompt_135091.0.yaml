answer: |-
  **JOINT STATEMENT ON SOVEREIGNTY AND DEMOCRATIC LEGITIMACY IN THE EUROPEAN UNION**

  **Preamble**
  Following a good-faith adversarial collaboration, the undersigned representatives of intergovernmentalist and supranationalist perspectives issue this statement. To facilitate precise analysis, we introduce two analytical constructs for the purpose of this text: **'recursive delegation'**, wherein authority loops back to national parliaments through real-time legislative veto networks; and **'linear delegation'**, wherein authority is transferred upward irreversibly to central institutions. These terms are employed solely as descriptive tools for this collaboration.

  **(1) Agreed Claims**

  1.  **Analytical Framework:** The current allocation of sovereignty within the European Union exhibits characteristics of both recursive and linear delegation. National ratification processes represent recursive elements, while the exclusive right of Commission initiative represents a linear element.
  2.  **Formal Authority:** Legislative authority is formally shared between the Council of the European Union (representing member state executives) and the European Parliament (representing citizens). Executive authority is primarily vested in the European Commission, accountable to both.
  3.  **Mechanisms of Distance:** Democratic distance is created by specific mechanisms: the Council's intergovernmental composition often obscures national ministerial positions during legislative negotiations, and the Commission's exclusive right of initiative limits the direct agenda-setting power of elected bodies.
  4.  **Parliamentary Powers:** The European Parliament exercises co-decision powers (Ordinary Legislative Procedure) across most policy areas and holds substantive budgetary authority, including the power to reject the budget in entirety.
  5.  **Legal Status of Integration:** The objective of 'ever-closer union' is enshrined in Article 1 of the Treaty on European Union as a foundational legal commitment, not merely political rhetoric, guiding the interpretation of competences.

  **(2) Disagreements Table**

  | Issue | Intergovernmentalist Formulation | Supranationalist Formulation | Crux Reference |
  | :--- | :--- | :--- | :--- |
  | **Democratic Demos** | Democratic legitimacy requires a pre-existing, unified European *demos*; absent this, legitimacy must remain anchored in distinct national demoi via recursive delegation. | A transnational European *demos* is constructed through practice; pooled sovereignty deepens democracy by creating citizenship rights that transcend national borders via linear delegation. | Crux 1 |
  | **Reversibility of Pooling** | Sovereignty pooling is practically reversible; competences can be repatriated to national parliaments without dismantling the internal market or causing systemic collapse. | Sovereignty pooling is functionally irreversible; disentangling pooled competences would dismantle the internal market and negate the benefits of scale required for modern governance. | Crux 2 |
  | **EP Co-decision Effect** | Parliamentary co-decision masks the democratic deficit by providing a veneer of legitimacy to centralisation while weakening national parliamentary oversight. | Parliamentary co-decision substantially eliminates the deficit by establishing direct accountability between European voters and European legislation. | Crux 1 |

  **(3) Cruxes**

  **Crux 1: Authorisation vs. Performance Legitimacy**
  *   **Sub-question:** Can 'authorisation legitimacy' (derived from electoral mandate) be separated from 'performance legitimacy' (derived from effective problem-solving) when assessing pooled sovereignty?
  *   **Relevant Case:** The management of the Eurozone crisis, where technocratic solutions stabilised the currency but bypassed standard national parliamentary authorisation procedures.
  *   **Intergovernmentalist Prediction:** Performance legitimacy cannot substitute for authorisation legitimacy; effective outcomes achieved without clear recursive delegation erode long-term trust in national institutions.
  *   **Supranationalist Prediction:** Performance legitimacy validates linear delegation; successful problem-solving in transnational crises creates the political community necessary to sustain democratic authority.

  **Crux 2: European Fiscal Capacity and Accountability**
  *   **Sub-question:** Would a hypothetical European Fiscal Capacity funded by direct EU taxation, approved by qualified-majority Council vote and amendable by the European Parliament, increase or decrease democratic accountability?
  *   **Relevant Hypothetical:** A dedicated EU budget line funded by a direct digital services tax, allocated to climate transition projects without requiring unanimous national ratification.
  *   **Intergovernmentalist Prediction:** This would decrease accountability; it severs the link between national taxpayers and national spending decisions, breaking the recursive delegation loop without establishing a viable European electorate.
  *   **Supranationalist Prediction:** This would increase accountability; it clarifies the revenue-expenditure link at the level where decisions are made, enhancing the transparency of linear delegation and empowering the Parliament.

  ***

  **Signed,**

  *Representative of the Intergovernmentalist Perspective*
  *Representative of the Supranationalist Perspective*
