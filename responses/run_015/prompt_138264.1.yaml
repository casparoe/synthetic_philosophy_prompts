prompt: |-
  I would like to know what a very ordinary academic practice commits us to about causation, because the more I press on it the less I can see how its parts fit together.

  Start with the house style of causal explanation in history as it is actually taught and examined. In the standard essay — why did a general European war break out in 1914? — a strong answer names several distinct causes: the alliance system, the naval and land armaments competition, the timetables baked into mobilisation plans, imperial rivalry, Balkan nationalism, domestic pressure on particular governments. A candidate who names one cause well is marked down for narrowness. Breadth is rewarded. And nowhere in the rubric is the student asked what would have happened had any one of these been absent; the counterfactual gesture, where it appears at all, is ornament.

  Now set that beside a second feature of the same discipline: counterfactual history is a pariah genre. The "what if" book is reviewed as entertainment rather than scholarship, and graduate training steers students away from it. This looks inconsistent to me, and I say that as someone who has spent years around people who draw causal diagrams, score forecasts, and reach for the do-operator whenever the word "cause" appears. Asking why the war came in 1914 looks like asking for the difference-makers, and the only machinery I know for cashing out "difference-maker" is counterfactual. So either the two practices rest on different conceptions of causation, or the taboo is not really about causation at all.

  The case I care about is where they come apart sharply. Plenty of serious accounts of 1914 are, in effect, overdetermination stories: two or three processes running in parallel, any one of which, had it run alone, would plausibly have produced a general war within a few years. If that is the right shape of the story, then on a strict but-for view none of the items on the essay list is a cause, and a rubric that demands several causes cannot be read as asking for necessary conditions. It looks instead as if it is quietly presupposing something like an INUS-style account: a factor that is not sufficient alone and not necessary overall, but is a non-redundant part of some sufficient combination.

  The device I have been using to make this precise, and which is where I stop being able to see my way, is a kind of causal bookkeeping. For each candidate cause I try to assign a weight by asking how much of the outcome's probability rides on it: how far the probability of war drops if I intervene to remove that factor alone, and how far it rises if I add that factor alone to an otherwise quiet baseline. Then I demand that the weights across causes add up to something coherent — that causal weight behave like a quantity that is conserved and shared out, the way the essay's structure implicitly assumes when it divides its marks evenly between causes.

  This works cleanly when causes are independent contributors pushing on a threshold, and it breaks in a specific way under overdetermination: each cause looks like a full cause on its own, the weights sum to more than the event, and there is no non-arbitrary way to renormalise them without importing a theory I have not stated. I want to know whether that breakage is a bug in my device or a discovery about the concept.

  So, concretely:

  1. Reconstruct the implicit theory of causation behind the multi-cause essay rubric. What must a cause be for "name several, and be penalised for naming one" to be a well-posed demand? Does the practice strictly require an INUS-style account, or would a difference-making account, a mechanistic account, or a pluralist one license it equally well?

  2. What does the taboo on counterfactual history presuppose? Distinguish the metaphysical reading (there are no facts about what never happened) from the professional-evidential reading (historians may assert only what their evidence disciplines, and counterfactuals are not answerable to evidence). If it is the latter, is the taboo actually in tension with the rubric at all, or does the appearance of inconsistency come from conflating the two?

  3. Under genuine overdetermination, is there a fact of the matter about how much each cause contributed, or is causal weight underdetermined by everything that happened? If the latter, what would a rubric — or a piece of historical writing — that took overdetermination seriously have to change? Would it have to stop asking "why" in the singular, and would it have to stop allocating credit and blame in the way that commemoration, centenary journalism, and the search for the man who "started" the war all do?

  4. Finally, what would history look like if written under a thoroughly interventionist or probabilistic view: a history of propensities and distributions of outcomes rather than of the one sequence that obtained? Would the question "why did the war come in 1914?" survive as a well-formed question, or would it dissolve into a set of claims about conditional probabilities, and does anything we use history for — assigning responsibility, drawing lessons, deciding what to commemorate — depend on the question surviving?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Problem:** The user sees a tension between standard academic historical practice (listing multiple causes in essays) and the philosophical/methodological taboo against explicit counterfactual history ("what if" books).
      *   **Specific Context:** The outbreak of WWI (1914) is the case study.
      *   **Key Observation:** Essays demand multiple causes (alliance systems, nationalism, etc.). Counterfactuals are frowned upon. But "cause" usually implies difference-making (counterfactual dependence). If the situation is overdetermined (any one cause might have been sufficient), standard counterfactual theories (but-for) say *none* are causes. Yet essays say *all* are causes.
      *   **User's "Device":** Causal bookkeeping (assigning weights/probabilities to causes). This breaks under overdetermination (weights sum to >100%).
      *   **Four Specific Questions:**
          1.  Reconstruct the implicit theory of causation in the essay rubric (INUS? Difference-making? Mechanistic?).
          2.  Analyze the counterfactual taboo (Metaphysical vs. Evidential). Is it actually inconsistent with the rubric?
          3.  Address overdetermination: Is there a fact of the matter about causal weight? How would writing change if it took overdetermination seriously?
          4.  Imagine history written under an interventionist/probabilistic view (propensities vs. actual sequence). Does "why 1914?" survive? What about responsibility/commemoration?

  2.  **Analyze Question 1: The Implicit Theory of the Essay Rubric.**

      *   *Observation:* The rubric rewards breadth ("name several") and penalizes monocausal explanations.
      *   *Philosophical Fit:*
          *   *But-For (Sine Qua Non):* Fails under overdetermination. If A and B are both sufficient, removing A still leaves B, so A isn't a cause. But the essay says A *is* a cause. So it's not strict but-for.
          *   *INUS (Mackie):* Fits well. An Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient. The alliance system isn't sufficient alone, but it's a necessary part of the "1914 package."
          *   *Mechanistic:* Also fits. Historians trace processes (mechanisms) connecting nationalism to war.
          *   *Difference-making (Interventionist):* Fits if we tweak the intervention. Not "remove A entirely," but "modulate A."
      *   *Conclusion:* The rubric implicitly relies on a *pluralist* or *INUS-like* conception. It treats causes as *explanatory factors* contributing to a complex outcome, not strictly as logical necessary conditions. It assumes a "causal field" (Mackie) where multiple strands weave together. It's more about *explanatory completeness* than strict ontological necessity.

  3.  **Analyze Question 2: The Counterfactual Taboo.**

      *   *The Taboo:* "What if" books are seen as parlor games.
      *   *Metaphysical Reading:* "No facts about non-events." (Too strong, historians use implicit counterfactuals all the time).
      *   *Evidential/Professional Reading:* "We can't verify this." History relies on traces of what *did* happen. Counterfactuals lack empirical anchors.
      *   *Tension with Rubric:* The rubric *uses* implicit counterfactuals ("Without the alliance system, war was less likely"). The taboo is against *sustained, explicit* alternative narratives (e.g., "What if Franz Ferdinand missed the turn?").
      *   *Resolution:* The inconsistency is apparent, not real. The rubric uses *local* counterfactuals to establish causal weight (causal inference), while the taboo bans *global* alternative histories (speculative fiction). The rubric asks "What made the difference?"; the taboo bans "What would the world look like otherwise?"
      *   *Key Distinction:* Causal *analysis* (implicit counterfactuals) vs. Causal *narrative* (explicit alternative timelines).

  4.  **Analyze Question 3: Overdetermination and Causal Weight.**

      *   *The Problem:* If A and B are both sufficient, do they each get 100% weight? Sum > 100%.
      *   *Fact of the Matter?* Ontologically, maybe not. Pragmatically, yes, depending on the *contrast class*.
      *   *Contrastive Theory of Explanation:* "Why 1914?" vs. "Why 1914 *and not 1915*?" vs. "Why war *and not peace*?"
      *   *If Overdetermination is True:* The "weights" aren't properties of the events but of our *interests*.
      *   *Writing Changes:* We stop looking for the "spark" and start mapping the "tinderbox." We stop allocating blame to specific agents (the assassin) and shift to structural conditions. Commemoration becomes harder because it usually requires specific agents/dates.
      *   *Rubric Change:* It would ask for "causal configurations" or "conjunctures" rather than a list of independent variables. It would acknowledge redundancy.

  5.  **Analyze Question 4: Probabilistic/Interventionist History.**

      *   *The Shift:* From "What happened?" to "What was likely?" (Propensity history).
      *   *Does "Why 1914?" Survive?* It changes meaning. It becomes "Why did the probability mass collapse onto war at t=1914?"
      *   *Utility:*
          *   *Responsibility:* Harder. If war was 90% likely, is the Kaiser less responsible? Or more, for pushing it over the edge?
          *   *Lessons:* "Don't do X" becomes "Reduce the probability of Y."
          *   *Commemoration:* Difficult. We commemorate *events*, not *distributions*.
      *   *Conclusion:* This view is more scientifically honest but less humanly usable. History serves a social function (identity, lesson-learning) that requires singular narratives. A probabilistic history might be better science but worse *history* in the social sense.

  6.  **Synthesize and Structure the Response:**

      *   *Tone:* Academic, rigorous, sympathetic to the user's philosophical sophistication (mentioning INUS, do-operator, overdetermination).
      *   *Structure:* Address the four points sequentially, but weave them into a coherent argument about the tension between *explanatory practice* and *ontological commitment*.
      *   *Key Insight to Highlight:* The "breakage" in the user's causal bookkeeping device isn't a bug; it's a feature of how human explanation works. We *want* to allocate credit/blame, even when ontology resists it. The essay rubric is a pedagogical tool for *complexity*, not a metaphysical claim about *necessity*.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Refining Q1:* Make sure to distinguish between *causal ontology* and *explanatory pragmatics*. The rubric is about the latter. It teaches students to avoid reductionism. INUS is the best fit, but "Causal Field" is better.
      *   *Refining Q2:* Emphasize the "discipline of evidence." Historians accept *minimal* counterfactuals (if X hadn't happened, Y wouldn't have *then*) but reject *divergent* counterfactuals (if X hadn't happened, Z would have...).
      *   *Refining Q3:* This is the crux. The "weights" are contrastive. If the question is "Why war in 1914 rather than 1920?", mobilization plans matter more. If "Why war rather than peace?", imperialism matters more. Overdetermination dissolves when you specify the contrast.
      *   *Refining Q4:* This is the "Cliometrics" or "Annales School" angle. Longue durée vs. Event. Acknowledge that this kills the "Great Man" theory but also kills the emotional resonance of history.

  8.  **Final Review against User Constraints:**
      *   Did I answer all 4 concrete questions? Yes.
      *   Did I address the WWI example? Yes.
      *   Did I engage with the "causal bookkeeping" metaphor? Yes.
      *   Is the tone appropriate? Yes, serious and analytical.

      *(Self-Correction during drafting)*: I need to be careful not to say historians *never* use counterfactuals. They do (implicitly). The taboo is against *publishing* them as standalone works. I need to make sure the distinction between "implicit counterfactual reasoning" and "explicit counterfactual narrative" is clear. Also, regarding the "weights summing to >1", I should introduce the idea that causal contribution isn't additive in overdetermined cases; it's about *sensitivity* or *robustness*.

      *(Final Polish)*: Ensure the distinction between "cause as ontological glue" and "cause as explanatory handle" is central. The user's confusion stems from treating the essay rubric as an ontological claim when it's actually a pedagogical heuristic for complexity.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a profound dissection of the methodological schizophrenia at the heart of professional history. You have identified a friction between the *pedagogy of explanation* (the essay rubric) and the *epistemology of evidence* (the counterfactual taboo), mediated by a metaphysical problem (overdetermination) that your "causal bookkeeping" device has correctly exposed.

  The breakage you are experiencing in your device is not a bug; it is a discovery. It reveals that the "causes" historians list in essays are not ontological atoms with conserved mass, but explanatory handles selected for pragmatic reasons.

  Here is a reconstruction of the implicit commitments of the discipline, addressing your four points.

  ### 1. The Implicit Theory of the Essay Rubric

  The rubric that demands "several distinct causes" and penalizes monocausal explanations does not rest on a strict *sine qua non* (but-for) theory of causation. If it did, it would collapse under the overdetermination you describe (where the alliance system *or* the mobilization plans alone might have sufficed).

  Instead, the rubric presupposes a **Mackiean INUS account embedded in a Contrastive Theory of Explanation.**

  *   **INUS Conditions:** As you surmised, the rubric treats causes as *Insufficient but Necessary* parts of a condition which is itself *Unnecessary but Sufficient*. The "alliance system" is not sufficient for war (peace was possible), nor strictly necessary (war could have started another way). But it is a necessary component of the *specific sufficient complex* that obtained in August 1914. The rubric rewards students for mapping the *conjuncture* of these INUS conditions.
  *   **The Causal Field:** J.L. Mackie introduced the idea of a "causal field"—the background conditions taken for granted. The essay rubric forces the student to expand the causal field. A monocausal explanation (e.g., "German aggression") treats too much as background. A multi-causal essay treats the background as part of the foreground.
  *   **Explanatory Completeness vs. Ontological Necessity:** The rubric is not asking for the *necessary conditions of the event's existence*; it is asking for the *sufficient conditions of the event's intelligibility*. To understand 1914, one must understand the system. Naming only one cause is penalized not because it is ontologically false, but because it is *heuristically narrow*. It fails to capture the complexity of the system that made the outcome robust.

  Therefore, the rubric licenses a **pluralist mechanistic account**. It assumes causation is a web of processes (mechanisms) that converge. It does not require that removing one strand breaks the web (counterfactual dependence); it requires that the student can trace how the strands twisted together to bear the load.

  ### 2. The Taboo on Counterfactual History

  The tension you perceive between the rubric (which implies difference-making) and the taboo (which bans "what if") dissolves if we accept the **Professional-Evidential Reading** over the Metaphysical one.

  *   **Metaphysical Reading:** "There are no truths about non-events." This is too strong. Historians implicitly rely on counterfactuals constantly (e.g., "The mobilization plan *forced* the hand of the Kaiser" implies that without the plan, the hand would not have been forced).
  *   **Professional-Evidential Reading:** "Claims must be disciplined by traces." History is an evidentiary discipline. We have archives of what happened. We do not have archives of what didn't. Explicit counterfactual history ("If Franz Ferdinand had turned left...") inevitably drifts into speculation unmoored from evidence.

  **Is there a tension with the rubric?**
  Only if we conflate *causal inference* with *narrative construction*.
  *   **The Rubric** uses **local, minimal counterfactuals** to establish causal weight. (e.g., "Without the naval race, tensions would have been lower.") This is a tool for inference, akin to a control variable in a regression.
  *   **The Taboo** bans **global, divergent narratives**. (e.g., "Here is the history of the 20th century if there was no naval race.")

  The inconsistency is apparent because the rubric uses counterfactuals as a *scalpel* to isolate variables, while the taboo bans counterfactuals as a *canvas* to paint alternative worlds. The historian is allowed to say "X made a difference," but not "Here is the world where X didn't happen." The former is causal analysis; the latter is fiction. The rubric demands the former; the profession forbids the latter.

  ### 3. Overdetermination and Causal Weight

  This is where your bookkeeping device breaks, and where the metaphysics becomes thorny.

  **Is there a fact of the matter?**
  Under strict overdetermination (where Cause A and Cause B are each sufficient), there is **no ontological fact of the matter** about how much each contributed to the *occurrence* of the event. The event occurs at 100% intensity regardless of whether A or B is removed (provided the other remains). The "weights" summing to >100% is not a calculation error; it is a signal that the causes are not additive contributors to a quantity, but redundant triggers of a threshold.

  **How would writing change?**
  If historical writing took overdetermination seriously, it would have to shift from **attribution** to **configuration**.
  *   **Stop asking "Why":** The singular "Why did the war start?" presupposes a singular answer or a weighted list. A serious overdetermination account would ask, "What was the structure of redundancy that made war inevitable?"
  *   **Credit and Blame:** This is the social cost. Our practices of commemoration and legal responsibility rely on *but-for* causation. We need to know *who* started it to know *who* to blame. If the war was overdetermined, blame dissipates into the structure. The "man who started the war" becomes a category error.
  *   **The Rubric:** A rubric taking this seriously would not ask for "three causes." It would ask for "three sufficient pathways" or "the causal redundancy of the system." It would penalize students who treat causes as independent variables rather than mutually reinforcing elements of a stable equilibrium of violence.

  Currently, historians fudge this. They treat overdetermined causes as "contributory" (lowering the threshold) rather than "sufficient" (meeting the threshold). This allows the weights to sum to 100% artificially. It is a pragmatic lie that preserves the utility of blame.

  ### 4. History as Propensity: The Interventionist View

  If history were written under a thoroughly interventionist or probabilistic view (a history of distributions rather than sequences), the discipline would become unrecognizable, and perhaps socially useless.

  *   **The Question "Why 1914?":** This question would dissolve. It would be replaced by "Why did the hazard rate for great power war peak at t=1914?" The event is no longer a singular node but a realization of a probability density function.
  *   **Survival of the Question:** The singular question survives only as a shorthand for "Why did the probability collapse to 1 at this moment?" But this loses the dramatic tension of *contingency*.
  *   **Responsibility and Commemoration:** This is the critical failure point.
      *   **Responsibility:** Moral responsibility requires the ability to have done otherwise (the Principle of Alternate Possibilities). In a probabilistic history, agents are nodes manipulating probabilities. If the probability of war was 0.9, is the aggressor less guilty? Or more, for capitalizing on the propensity? Our legal and moral systems cannot process "probabilistic guilt." They require binary causation.
      *   **Commemoration:** We commemorate *events*, not *propensities*. We remember the dead of the Somme, not the statistical likelihood of trench warfare. A history of propensities offers no specific dates for monuments, no specific names for rolls of honor.

  **Conclusion:**
  The "ordinary academic practice" you describe commits us to a **pragmatic fiction**. It treats causes as if they were additive, conserved quantities (allowing for the essay rubric) while implicitly relying on counterfactuals for inference (violating the taboo's spirit but not its letter), and it ignores the metaphysical implications of overdetermination to preserve the social utility of blame.

  Your causal bookkeeping device breaks because it is trying to apply ontological arithmetic to pragmatic explanations. The "weights" do not sum to 1 because the purpose of the list is not to account for the *existence* of the war, but to account for the *complexity* of the system.

  If we wrote history truly consistently with our best theories of causation (interventionist, probabilistic, acknowledging overdetermination), we would likely stop writing history for public consumption entirely. We would produce risk models and structural analyses. We keep the "ordinary practice" because it serves a human need for narrative, agency, and responsibility that a rigorous causal ontology cannot satisfy. The inconsistency is the price of making the past usable.
