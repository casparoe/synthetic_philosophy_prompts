      *   *Health:* Good, but outcome definitions can be tricky.
      *   *Criminal Justice (Pretrial):* High stakes, clear binary decision (detain/release), clear outcome (rearrest).
      *   *Decision:* Pretrial Detention. It's a classic fairness setting.
      *   *Outcome:* $Y=1$ means "Rearrested within 2 years" (Failure). $Y=0$ means "No Rearrest" (Success).
      *   *Decision:* $D=1$ means "Detain", $D=0$ means "Release".
      *   *Note on Direction:* Usually, risk scores predict $Y=1$. High score = High Risk.
      *   *Fairness Metrics:*
          *   DP: $P(D=1|A) = P(D=1|B)$.
          *   EO: $P(D=1|Y=0, A) = P(D=1|Y=0, B)$ (FPR equal) AND $P(D=1|Y=1, A) = P(D=1|Y=1, B)$ (TPR equal).
          *   PP: $P(Y=1|D=1, A) = P(Y=1|D=1, B)$.

