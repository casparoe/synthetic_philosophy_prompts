              *   So for Group A:
                  *   $P(S=0.8|Y=1) = 0.8, P(S=0.2|Y=1) = 0.2$.
                  *   $P(S=0.8|Y=0) = 0.2, P(S=0.2|Y=0) = 0.8$.
