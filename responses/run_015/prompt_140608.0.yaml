      *   *Designing Group A (Sharp):*
          *   Scores: Low (0.2), High (0.8).
          *   To get mean 0.5: Need equal mass on 0.2 and 0.8.
          *   $P(S=0.2|A) = 0.5$, $P(S=0.8|A) = 0.5$.
          *   Check Calibration:
              *   $P(Y=1|S=0.2, A) = 0.2$.
              *   $P(Y=1|S=0.8, A) = 0.8$.
          *   Derive Likelihoods $P(S|Y, A)$:
