          4.  **ROC Nesting:** Show Group A's ROC strictly dominates Group B's ROC (better TPR for same FPR).
          5.  **Equalized Odds (EO) Cost:** Show deterministic EO rules are trivial (all 0 or all 1). Show randomized EO rules require "leveling up" error (worsening Group A to match Group B's noise), not reallocating burden.
