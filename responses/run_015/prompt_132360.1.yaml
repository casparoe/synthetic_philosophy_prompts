  Can you turn this into a proper proposal? I want: the question stated precisely with that framing, why the standard symbolic-head-of-state literature leaves it open, the method (comparative conceptual analysis of reserve powers across the three cases, plus a minimal framework for how redundancy interacts with legitimacy — no polling data needed), what a positive result and failure would look like, and a realistic scope for about six months. Don't bother with citations or a bibliography, I'll add those.

  Also please say how confident you are in the claims and single out the point you're least sure about.
