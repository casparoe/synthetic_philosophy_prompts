      *   *Did Goodhart know statistics?* Charles Goodhart was a central banker. He was critiquing monetary policy targets. It was an economic observation, not a statistical one.
      *   *Make sure to highlight the "Target" aspect.* In overfitting, you optimize the metric on training data. In Goodhart, you optimize the metric *in the real world*, which changes the real world.

  8.  **Final Polish:** Structure with clear headings. Ensure the conclusion answers the "Am I missing something?" question directly. (Yes, you are missing the adaptive/agency component).

  **(Self-Correction during drafting):** I need to be careful not to say Goodhart's Law is *completely* distinct. The "Regressional" form *is* basically overfitting. The insight is that Goodhart's Law encompasses overfitting *plus* other mechanisms of failure specific to socio-technical systems.

