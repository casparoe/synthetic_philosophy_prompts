answer: |-
  **Exam Question**

  **Question 4 (25 Marks)**

  Consider an agent, Ada. Ada believes that the server is online ($p$). Ada also believes that if the server is online, the database is accessible ($p \to q$). Ada is competent, awake, and has no defeaters for either belief. However, Ada has not yet drawn the conclusion that the database is accessible ($q$); she simply hasn't run the inference yet.

  Standard possible-worlds semantics implies that if Ada believes $p$ and $p \to q$, she must believe $q$, because there is no possible world consistent with her beliefs where $q$ is false. This is the problem of logical omniscience.

  Write an essay evaluating two distinct strategies for repairing this semantics: (1) introducing impossible worlds to allow $p$ and $p \to q$ to be true while $q$ is false in some doxastic alternatives, and (2) treating logical omniscience as a harmless idealization, analogous to assuming frictionless planes in physics.

  Your essay must argue which of these two strategies is superior. To do this, you must address the following: What does each strategy have to give up to solve the problem? Specifically, explain why a repair that makes belief sets too fine-grained risks losing all constraints on what can be ascribed to an agent, and why the idealization defense fails to account for the difference between computational limits and physical friction. Conclude with a verdict on which repair preserves the theoretical utility of the belief model without collapsing into triviality.

  ***

  **Model Answer**

  The case of Ada exposes a fundamental tension in modeling belief: we want a semantics that respects logical coherence, but also one that respects cognitive limits. Standard possible-worlds models fail Ada because they equate belief with information content across all necessary truths. If we fix this, we risk breaking the model entirely. Evaluating the "impossible worlds" repair against the "harmless idealization" defense shows that while impossible worlds offer formal flexibility, they threaten to empty the concept of belief of predictive power, whereas the idealization defense misunderstands the constitutive role of computation in agency.

  The impossible worlds strategy solves Ada's case by expanding the semantic space. We allow worlds where logical laws fail—where $p$ and $p \to q$ hold, but $q$ does not. Ada's belief state then includes these impossible worlds. This technically solves the closure problem: Ada is not omniscient because her doxastic alternatives include worlds where she misses the consequence. However, the cost here is individuation. If impossible worlds are distinguished solely by the propositions held true at them, we can distinguish worlds too finely. We could posit a world where Ada believes $p$ and $p \to q$ but disbelieves $q$, and another where she believes $p$ and $p \to q$ but is agnostic about $q$. If the semantics allows *any* combination of truth values to count as a world, there are no constraints on belief ascription. Any attribution becomes consistent with the model. This is worse than the disease: a theory of belief that cannot rule out any behavior explains nothing. To work, impossible worlds need a structure limiting which combinations are possible, but providing that structure usually just recreates the syntactic constraints we tried to avoid semantically.

  The idealization defense takes a different tack. It argues that logical omniscience is like assuming frictionless planes: a simplification that aids calculation without distorting the core phenomenon. On this view, Ada *implicitly* believes $q$, and the model is only wrong in assuming she has accessed it. The failure here is deeper. Friction is an external force acting on a body; computational limits are internal to the definition of the agent. A planet exists independently of friction; an computational agent is defined by its processing states. To idealize away the failure to draw inferences is to idealize away the difference between Ada and a lookup table that already contains $q$. If the model cannot distinguish between an agent who has computed $q$ and one who hasn't, it cannot explain action based on reasoning. The "distortion" is not a minor noise; it is the mechanism of agency itself.

  Comparing the two, the impossible worlds approach is superior, but only if constrained. The idealization defense is fundamentally mistaken because it treats computational limits as performance errors rather than competence boundaries. However, the impossible worlds approach must avoid the trap of triviality. It succeeds only if the impossible worlds are not merely arbitrary truth-value assignments but are structured to reflect cognitive reachability. If we treat impossible worlds as representations of syntactic states rather than metaphysical possibilities, we retain the semantic elegance of possible worlds while respecting the fact that Ada's failure to believe $q$ is a real feature of her state, not a measurement error.

  Therefore, I verdict in favor of the impossible worlds repair, but with a caveat: it must be implemented as a model of cognitive access, not just logical space. The idealization view must be rejected because it dissolves the distinction between having information and processing it. A theory of belief for computational agents must track the processing. Impossible worlds allow us to model the gap between $p$ and $q$ as a real semantic feature, whereas idealization treats it as a bug. We should prefer the repair that treats the agent's limitations as data to be modeled, not noise to be filtered, provided we impose strict constraints on those worlds to prevent the theory from becoming vacuous.

  ***

  **Marking Scheme (25 Marks)**

  **1. Problem Setup (4 marks)**
  *   **4 marks:** Clearly explains why Ada's case violates standard possible-worlds closure (no world left where $q$ is false) and identifies the core tension (logical coherence vs. cognitive limits).
  *   **2-3 marks:** Describes the case but fails to explicitly link it to the semantic constraint (closure under implication).
  *   **0-1 marks:** Vague summary of logical omniscience without referencing the concrete case.

  **2. Analysis of Impossible Worlds (5 marks)**
  *   **5 marks:** Explains the mechanism (allowing $p \land (p \to q) \land \neg q$) and identifies the specific cost: loss of constraints/individuation problems (risk of triviality).
  *   **3-4 marks:** Explains the mechanism but gives a generic cost (e.g., "it's complex") without addressing the loss of predictive constraint.
  *   **0-2 marks:** Incorrectly describes the semantics or fails to identify a cost.

  **3. Analysis of Idealization (5 marks)**
  *   **5 marks:** Explains the friction analogy and identifies the specific cost: computation is constitutive of agency, not an external distortion (unlike friction).
  *   **3-4 marks:** Explains the analogy but fails to distinguish why computation is different from friction.
  *   **0-2 marks:** Accepts the analogy without critique or misrepresents the view.

  **4. Comparative Evaluation (A/B Discriminator) (6 marks)**
  *   **5-6 marks (A standard):** Explicitly articulates the standard a repair must meet: it must solve the problem without making belief ascription vacuous (too fine-grained) or ignoring the nature of the agent (idealization). Explains *why* one cost is preferable to the other.
  *   **3-4 marks (B standard):** Lists the costs of both repairs but treats them as equivalent trade-offs without evaluating which preserves the theory's utility.
  *   **0-2 marks:** No direct comparison; discusses views in isolation.

  **5. Verdict and Conclusion (5 marks)**
  *   **5 marks:** Clear verdict supported by the preceding argument (e.g., Impossible Worlds preferred *if* constrained, or Idealization rejected).
  *   **3-4 marks:** Verdict present but weakly supported or contradictory to the analysis.
  *   **0-2 marks:** No clear verdict or conclusion.

  **Common Mistakes and Penalties**

  1.  **Confusing Resource Limits with Content Individuation (Deduct 4 marks):** Treating the problem as solely about time/memory storage (CS performance issues) rather than how belief content is semantically individuated. The problem is that the semantics *says* she believes $q$, not that she lacks time to say it.
  2.  **Focusing on Knowledge rather than Belief (Deduct 3 marks):** Discussing the KK principle or factivity. The problem arises for belief (doxastic logic) regardless of whether the beliefs are true or constitute knowledge.
  3.  **Conflating Closure with Necessitation (Deduct 3 marks):** Assuming the problem is only about believing all tautologies (Necessitation) rather than failing to believe consequences of actual beliefs (Closure under Implication). Ada's case is specifically about closure.
  4.  **Impossible Worlds without Individuation (Deduct 4 marks):** Proposing impossible worlds as a solution without explaining how they are distinguished from one another. If not individuated, the semantics collapses into taking the belief set as primitive, solving nothing.
  5.  **Uncritical Acceptance of Idealization (Deduct 3 marks):** Accepting the frictionless plane analogy without addressing the prompt's requirement to explain why computational limits are unlike friction (i.e., that they define the agent type).

  ***
