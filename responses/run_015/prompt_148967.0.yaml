answer: |-
  This is a fantastic connection to make. Your intuition about the "glue" is actually the standard way philosophers introduce Bradley's Regress, but you've dug deeper into *why* it matters for something like Symbolic AI.

  Your roommate might have rolled their eyes, but you've stumbled onto one of the most significant critiques of symbolic representation ever formulated. Bradley is essentially arguing that syntax (symbols standing in relation) can never capture semantics (the actual unity of a fact).

  Here is a breakdown of the hidden assumptions, why the regress is vicious, and whether his solution holds water.

  ### 1. Why is the regress vicious?
  You asked why we can't just accept an infinite chain. In philosophy, there is a distinction between a **benign infinite regress** and a **vicious infinite regress**.

  *   **Benign:** The integers. For every number $n$, there is a successor $n+1$. This goes on forever, but it doesn't prevent the number 5 from existing. The existence of 5 doesn't *depend* on the completion of the infinite chain.
  *   **Vicious:** The explanation of the current step *depends* on the completion of the next step.

  **Bradley's Case:**
  Bradley is trying to explain **unity**. How do $A$ and $B$ become one fact ($A-R-B$)?
  If you say they are united by relation $R$, Bradley asks: "Is $R$ connected to $A$?"
  *   If **No**: Then $R$ is floating away from $A$, and we don't have "$A$ is $R$." We just have "$A$ ... $R$."
  *   If **Yes**: Then there must be a tie between $A$ and $R$. Let's call that tie $r_1$.

  Now, is $r_1$ connected to $A$? If yes, you need $r_2$.
  The regress is **vicious** because the goal is to achieve *unity*. If every attempt to unify two things requires a *third* thing to unify them, unity is **forever deferred**. You never actually get the fact; you only get an endless supply of connectors that never actually connect.

  It's like trying to hold two sticks together with tape, but the tape is non-sticky. You say, "I'll use glue to stick the tape to the stick." But the glue is non-sticky, so you need... well, you see the problem. You never get the sticks held together.

  ### 2. The Hidden Assumption: The Reification of Relations
  You hit the nail on the head: *"Treating relating like a kind of glue that needs its own glue."*

  Bradley's hidden assumption is **Ontological Parity**. He assumes that for something to be real, it must be a **substantive particular** (a "thing").
  *   $A$ is a thing.
  *   $B$ is a thing.
  *   Therefore, for $R$ to be real, $R$ must also be a "thing."

  If $R$ is a "thing" (like a bead on a string), then it sits *between* $A$ and $B$. But a bead sitting between two other beads is just a third bead. It doesn't inherently *link* them. To make it link them, you need a further relation.

  **The Counter-Assumption (Russell/Frege):**
  Bertrand Russell (who famously fought against Bradley on this) argued that Bradley is making a category mistake. Relations are **not things**. They are **unsaturated**.
  *   Think of a relation not as a bead, but as a **hook**.
  *   A hook doesn't need another hook to hook onto the object; that is its intrinsic nature.
  *   In logical terms, a predicate is a function, not an argument.

  Bradley rejects this. He thinks saying "relations are unsaturated" is just wordplay to hide the contradiction. For Bradley, if it's real, it must be self-subsistent. Since relations cannot be self-subsistent (they always point beyond themselves to terms), they cannot be real.

  ### 3. Does "Appearance" Solve or Dissolve the Problem?
  This is the crux of your second question. Does saying relations are "mere appearances" solve the problem of how subject and predicate hang together, or does it just deny there is any hanging-together?

  **It dissolves the problem by changing the ontology.**
  Bradley argues that because relations lead to contradiction, the world of distinct objects ($A$, $B$, $R$) is not the real world. It is **Appearance**.
  *   **Appearance:** The world of separate things related to each other (the world of Knowledge Graphs, logic, and daily life).
  *   **Reality:** The **Absolute**. A single, indivisible, non-relational experience.

  In the Absolute, there are no separate $A$s and $B$s that need gluing. There is only one holistic "feeling" or experience. Distinctions are transcended, not connected.

  So, does it solve the unity problem?
  *   **Yes:** In the Absolute, there is perfect unity because there is no plurality to unify.
  *   **No:** It saves unity by killing the distinct objects. It explains why $A$ and $B$ seem united by saying "Actually, $A$ and $B$ aren't ultimately real."

  Most analytic philosophers (like Russell and Moore) revolted against this. They felt Bradley was willing to destroy the reality of the external world just to save logic from contradiction. They chose to accept relations as brute facts (dissolving Bradley's problem by accepting the "unsaturated" nature of relations) rather than accept the Absolute.

  ### 4. Why this matters for your Argument about Symbolic AI
  This is where your intuition about Knowledge Graphs is incredibly Bradleyan.

  **The Symbolic AI / Knowledge Graph View:**
  Reality is composed of entities and relations. We can represent truth as triples: `(Socrates, is_a, Mortal)`.
  *   **Bradley's Critique:** This is a list of symbols. It is static. Where is the *truth*? The triple on the hard drive is just magnetic states. The "relation" `is_a` is just another token. You have three tokens, not one fact. The system manipulates the tokens, but it never grasps the **unity** of the fact.

  **Why it feels like it's "missing something":**
  You feel the KG is missing something because, for Bradley (and many phenomenologists), meaning is not combinatorial; it is **holistic**.
  *   To understand "Socrates is mortal," you can't just link two nodes. You need the entire context of what "Socrates" means, what "mortal" means, and the temporal/historical context that binds them.
  *   Symbolic AI treats relations as **external** (links between nodes).
  *   Bradley (and later, connectionists) suggests meaning is **internal** to the whole state.

  **The Verdict on your Roommate Argument:**
  You can tell your roommate this:
  > "Bradley argues that if you treat a relation as just another object in a knowledge graph, you create a regress where nothing ever actually connects to anything. Symbolic AI assumes relations are 'hooks' that work automatically. Bradley says that's magic. If relations are real, they need explaining. If you can't explain how a relation relates without using another relation, then your Knowledge Graph is just a syntax of appearances, not a semantics of reality. It manipulates symbols, but it never captures the *fact*."

  ### Summary
  1.  **The Regress is Vicious:** Because it makes the *achievement* of unity impossible, not just delayed.
  2.  **The Hidden Assumption:** That relations must be "things" (substantives) rather than "functions" (unsaturated).
  3.  **Solve vs. Dissolve:** Bradley dissolves the logical problem by denying the reality of the terms that need relating. He trades a world of many related things for a world of One unrelated Thing.
  4.  **AI Context:** Your feeling that KGs are "missing something" is the feeling that syntax (triples) cannot generate semantic unity (facts) without a holistic context (the Absolute/Experience) to ground them.

  Bradley is extreme, but he forces you to ask: **Is a relation a thing, or is it an act?** Symbolic AI treats it as a thing. Bradley says if it's a thing, it's dead. If it's an act, it belongs to a mind/experience, not a database.
