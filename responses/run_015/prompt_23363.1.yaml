answer: |-
  This is a sophisticated and promising draft. You are tackling one of the central debates in the philosophy of biology (the "Function Wars") and attempting a synthesis that leverages recent developments in systems theory.

  Here is feedback structured around your three specific questions, followed by some suggestions for tightening the text.

  ### 1. Accuracy of Representations (Etiological, Causal-Role, and Davies)

  **The Etiological (ET) and Causal-Role (CR) Accounts:**
  Your characterization of the standard contrast is accurate enough for a core section. You correctly identify Millikan/Neander (selected effects) vs. Cummins-style (current causal contribution).
  *   *Suggestion:* When defining CR, you might want to explicitly name **Cummins (1975)**. Your definition ("simply the role it plays") is slightly loose; Cummins defines function relative to a *containing system's capacity*. Clarifying that CR functions are analytical (explaining a capacity) will help later when you discuss the heart's multiple roles.

  **The Davies Objection:**
  This is the point where you need to be most careful. You attribute to Davies the view that "if a trait was selected for effect E, then a member of the species that lacks E is not a genuine instance of the selected trait."
  *   *Caution:* Ensure you are citing the correct Davies and the correct argument. **Paul Davies** (e.g., in *Norms of Nature*) generally argues *for* a systems-based view and *against* etiological views, but the specific argument you describe sounds like a **token-individuation objection** often associated with **Godfrey-Smith** or discussions of **Swampman**.
  *   *The Risk:* Etiological theorists (like Neander) explicitly argue that their account *does* allow for malfunction (a token can exist without performing its selected effect). If Davies's argument is that ET *collapses* malfunction into extinction/non-identity, you need to ensure this isn't a strawman of a sophisticated etiological view. Neander, for instance, distinguishes between the *type* (defined by history) and the *token* (which can fail).
  *   *Advice:* Verify that Davies argues ET *cannot* accommodate malfunction, rather than arguing that ET makes malfunction *conceptually difficult*. If Davies argues that ET makes malfunction impossible because the trait ceases to be that trait, make sure you have a precise citation, as this is a strong metaphysical claim that many etiologicalists would reject.

  ### 2. Does the Solution Reintroduce History? (The "Set-Point" Worry)

  This is the strongest philosophical challenge to your paper. You identify it correctly: if the set-point (e.g., 120/80 blood pressure) is determined by evolutionary history, is your view just "Etiological Theory with an extra step"?

  **How to Escape the Trap:**
  You need to distinguish between the **causal origin** of the norm and the **locus of normativity**.
  *   **The Argument:** Yes, evolution *caused* the kidneys to be calibrated to 120/80. However, the *normative force* (what makes 100/60 a "malfunction" right now) is not the past selection, but the **current organizational closure** of the organism.
  *   **Key Distinction:** In ET, a trait is dysfunctional because it fails to match its *ancestors' success*. In your view, a trait is dysfunctional because it threatens the *current self-maintenance* of the system.
  *   **The "Swampman" Test:** If a Swampman (no history) appeared with a heart and kidneys calibrated to 120/80, the ET theorist says the heart has no function. Your view says the heart *does* have a function, and if it pumps at 50/30, it is malfunctioning *relative to the current system's set-points*, regardless of history.
  *   **Literature to Leverage:** To defend this, you should look into the **Organizational Account of Functions** (e.g., **Mossio, Saborido, & Moreno**). They argue that norms arise from the "self-maintaining organization" of the system *here and now*. This gives you the vocabulary to say: "History explains why the set-point is X, but the *norm* is constituted by the current regulatory loop, not the history."

  **Verdict:** You can escape the charge of "etiology in disguise" if you insist that the *source of the norm* is immanent to the current system's viability, not transcendent in its history.

  ### 3. Handling Multi-Functional Traits (The Heart)

  The heart example is the classic objection to Cummins-style accounts (the "everything is a function" problem). If the heart pumps blood, makes noise, and warms the chest, which failure counts as malfunction?

  **Proposed Solution:**
  You don't need to pick just one role, but you do need a **hierarchy of relevance**.
  *   **Cummins's Analytical Strategy:** Functions are relative to the capacity you are explaining. If we are explaining *circulation*, pumping is the function. If we are explaining *thoracic acoustics*, the sound is the function.
  *   **Your Normative Twist:** For *malfunction*, you need to anchor the function to **organismal viability**.
  *   **The Fix:** Distinguish between **Constitutive Contributions** and **Byproducts**.
      *   Pumping blood is *constitutive* of the organism's self-maintenance (the regulatory loops depend on it).
      *   Making sound is a *byproduct* (the regulatory loops do not target the sound; the baroreceptors don't measure heart sounds).
      *   **Criterion:** A trait malfunctions when it fails to perform the causal role that is **monitored or utilized by the organism's own regulatory architecture.**
      *   *Application:* The kidneys/baroreceptors monitor pressure/flow. They do not monitor heart sounds. Therefore, failure to pump is malfunction; failure to make noise is not. This keeps the norm internal (as you want) without appealing to history.

  ### Specific Textual Suggestions

  Here is a revised version of your core section incorporating these philosophical refinements. Changes are in **bold**.

  > The standard contrast is between etiological accounts, on which a trait's function is the effect for which it was selected (Millikan's selected-effects account) or, in Neander's etiological version, the effect that was responsible for the trait's being favored by selection, and causal-role accounts, on which a trait's function is **a disposition that contributes to a capacity of the containing system (Cummins 1975)**. Etiological accounts are often favored because they seem to explain malfunction **more robustly**: a trait malfunctions when it fails to perform the function it was selected for, **establishing a norm-violation relative to a historical standard.**
  >
  > **However,** Davies has argued that historical malfunction is **conceptually unstable** — if a trait is individuated by its selection for effect E, then a token that lacks E **risks being categorized as** a different trait or an instance of extinction. **While etiological theorists dispute this, it highlights a vulnerability in grounding norms solely in the past.**
  >
  > I claim that the causal-role theorist is not threatened by **this normative gap**, because the causal-role theorist **can ground norms in the present**. On the view I am developing, the relevant norm is internal to the organism's own regulatory architecture: a trait malfunctions when it departs from the performance standard that the organism's homeostatic systems treat as the set point. A heart malfunctions not because it fails to perform some historically selected function, but because it fails to maintain the blood pressure and flow that the kidneys, baroreceptors, and other control loops of the same organism take as the target. The normativity of function, on this picture, is a current, internal, causal fact about a self-regulating system.
  >
  > I concede two difficulties. First, the set points themselves — the blood pressure a healthy mammalian cardiovascular system regulates toward — are themselves the product of evolutionary history. **However, this does not make the account etiological.** While history explains the *origin* of the set-point, the *normative force* is exerted by the current organizational closure of the system. **A Swampman organism with identical regulatory loops would have identical functional norms, despite having no history.** Second, the heart plays several causal roles at once. **I resolve this by distinguishing roles monitored by the system from mere byproducts.** The heart drives systemic circulation, **which is monitored by baroreceptors,** but also makes sounds, **which are not.** The standard against which the heart is judged is determined by **which causal roles are recruited by the organism's own maintenance systems.**

  ### Summary of Advice

  1.  **Double-check Davies:** Ensure you aren't misrepresenting the etiologicalist's ability to handle malfunction. Frame Davies's point as highlighting a *conceptual tension* in ET rather than a definitive refutation, unless you have a ironclad citation.
  2.  **Lean into "Organizational Closure":** To answer the "history in disguise" worry, use the language of *current self-maintenance* vs. *historical origin*. This is the standard move in modern systems philosophy (Thompson, Mossio, etc.).
  3.  **Refine the Heart Example:** Use the "monitored by the system" criterion. This allows you to keep the CR account (current role) while filtering out accidental effects (sounds) without appealing to selection history.

  This is a strong argument. If you can successfully decouple the *origin* of the set-point from the *authority* of the set-point, you have a viable paper. Good luck with the seminar.
