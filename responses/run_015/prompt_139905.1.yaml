  ### Part 1: The Conceptual Space

  Before constructing the decision instrument, we must map the theoretical terrain. The positions you want students to distinguish are not a simple list; they are coordinates in a multi-dimensional space. The following four axes do the separating work.

  **Axis 1: Requirement of Positive Reasons**
  *   **Options:** *Required* (Hearer must possess a reason to trust) vs. *Not Required* (Hearer is permitted to trust without a prior reason).
  *   **Work:** This is the primary cut between Reductionism (Required) and Anti-Reductionism/Entitlement (Not Required).

  **Axis 2: Locus of Warrant**
  *   **Options:** *Hearer's Evidence* (Induction/Observation), *World's Facts* (Reliability), *Speaker's Act* (Assurance/Responsibility), *Structural Right* (Entitlement/Presumption), *Human Nature* (Basic Faculty).
  *   **Work:** This distinguishes *why* the warrant exists. E.g., Humean (Evidence) vs. Reliabilist (Facts) vs. Assurance (Act).

  **Axis 3: Accessibility**
  *   **Options:** *Accessible* (Hearer must be able to cite the warrant) vs. *Inaccessible* (Warrant can exist outside the hearer's awareness).
  *   **Work:** This separates Internalist Reductionism from Externalist Reliabilism.

  **Axis 4: Knowledge Transmission**
  *   **Options:** *Preservative* (Speaker must know P for Hearer to know P) vs. *Generative* (Hearer can know P even if Speaker only believed P).
  *   **Work:** This isolates the specific epistemic good of *knowledge* from mere *justified belief*.

  **The Grid and Occupied Cells**
  Combining these axes yields 32 theoretical cells (2 × 5 × 2 × 2). Most are empty or incoherent.

  1.  **Humean Global Reductionism:** *Required / Hearer's Evidence (Global) / Accessible / Generative.* (Occupied)
  2.  **Local Reductionism:** *Required / Hearer's Evidence (Local) / Accessible / Generative.* (Occupied)
  3.  **Externalist Reliabilism:** *Required / World's Facts / Inaccessible / Generative.* (Occupied)
  4.  **Reidian Anti-Reductionism:** *Not Required / Human Nature / Accessible / Preservative.* (Occupied)
  5.  **Bare Presumption:** *Not Required / Structural Right (Weak) / Accessible / Generative.* (Occupied)
  6.  **Assurance View:** *Not Required / Speaker's Act / Accessible / Preservative.* (Occupied)
  7.  **Entitlement View:** *Not Required / Structural Right (Strong) / Inaccessible / Preservative.* (Occupied)
  8.  **Transmissive Knowledge View:** *Not Required / Human Nature or Right / Accessible / Preservative (Strict).* (Occupied)

  **Diagnosed Empty Cells**
  *   *Required + Speaker's Act:* **Incoherent.** If the speaker's act provides the warrant, it is not a "positive reason" the hearer possesses independently; it collapses into Assurance.
  *   *Not Required + Hearer's Evidence:* **Incoherent.** If you have evidence, you have a reason; you cannot claim no reason is needed while citing evidence.
  *   *Required + Structural Right:* **Unattractive.** Rights function as permissions without evidence; requiring evidence negates the right.
  *   *Inaccessible + Human Nature:* **Unexplored.** If speech is a basic faculty, it is typically assumed we can access its deliverances; an unconscious faculty is hard to distinguish from Reliabilism.
  *   *Generative + Assurance:* **Unattractive.** If the speaker does not know P, they cannot take responsibility for P as knowledge; assurance typically implies preservation.

  ***

  ### Part 2: The Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your intuition about the case. Follow the arrow to the next node or leaf. There are 10 nodes. The leaves correspond to the major positions in the literature.

  **Node 1:** When someone tells you something, do you need a reason *other than their saying so* to believe them?
  *   **Yes, I need a reason.** → Go to Node 2.
  *   **No, I can start by believing them.** → Go to Node 5.

  **Node 2:** Does this reason need to be something you can explain or point to right now?
  *   **Yes, I must be aware of the reason.** → Go to Node 3.
  *   **No, it just needs to be true that I have a reason.** → Go to Node 4.

  **Node 3:** Is your reason based on *people in general* or *this specific person/situation*?
  *   **People in general (e.g., humans usually tell the truth).** → **Leaf A: Humean Global Reductionism.**
  *   **This specific person/situation (e.g., I checked their track record).** → **Leaf B: Local Reductionism.**

  **Node 4:** Is it enough that the source is *actually reliable*, even if you don't know it?
  *   **Yes, actual reliability is enough.** → **Leaf C: Externalist Reliabilist.**
  *   **No, if I don't know it, I don't have warrant.** → **Leaf D: Skepticism (Null).**

  **Node 5:** Is this permission because human speech is a *natural faculty* like sight?
  *   **Yes, we are built to speak and believe truth.** → **Leaf E: Reidian Anti-Reductionism.**
  *   **No, it is not a biological faculty.** → Go to Node 6.

  **Node 6:** Is this permission because we are *allowed to assume* truth until warned otherwise?
  *   **Yes, it is a simple rule of thumb.** → **Leaf F: Bare Presumption.**
  *   **No, it is deeper than a rule.** → Go to Node 7.

  **Node 7:** Does it matter if the speaker *takes responsibility* for what they say?
  *   **Yes, their promise creates my right to believe.** → **Leaf G: Assurance View.**
  *   **No, their responsibility is not the source.** → Go to Node 8.

  **Node 8:** Is this permission a *structural right* you have as a rational thinker?
  *   **Yes, I am entitled to trust by default.** → **Leaf H: Entitlement View.**
  *   **No, I am not sure where the permission comes from.** → **Leaf I: Unnamed (Intuitionist).**

  **Node 9:** (For Leaves E, G, H) If the speaker is guessing but happens to be right, can you *know* it from them?
  *   **No, they must know it for you to know it.** → Go to Node 10.
  *   **Yes, their truthfulness is enough for your knowledge.** → **Return to Leaf E, G, or H (Generative Version).**

  **Node 10:** If a claim passes through a chain of a hundred speakers, does your warrant *fade*?
  *   **Yes, the warrant degrades with each link.** → **Return to Leaf E, G, or H (Degradation Version).**
  *   **No, the warrant is preserved perfectly.** → **Leaf J: Transmissive Knowledge View.**

  ***

  ### Leaf Commentary & Awkward Commitments

  *   **Leaf A (Humean Global):** *Awkward Commitment:* You must have inductively verified human veracity before you can learn anything from testimony, which seems impossible for a child.
  *   **Leaf B (Local Reductionism):** *Awkward Commitment:* You cannot learn from a stranger in a railway station unless you have time to verify their specific reliability first.
  *   **Leaf C (Externalist Reliabilist):** *Awkward Commitment:* You can have knowledge from a source you have every internal reason to distrust, provided the source is secretly reliable.
  *   **Leaf D (Skepticism):** *Awkward Commitment:* You cannot learn anything from testimony unless you verify it non-testimonially, which defeats the purpose of asking.
  *   **Leaf E (Reidian):** *Awkward Commitment:* You are warranted in believing a known liar if your faculty of credulity is triggered, unless you have a specific defeater.
  *   **Leaf F (Bare Presumption):** *Awkward Commitment:* The rule is arbitrary; there is no deep explanation for why we are allowed to assume truth other than convenience.
  *   **Leaf G (Assurance):** *Awkward Commitment:* You cannot learn from a speaker who is reliable but does not understand they are taking responsibility (e.g., an AI or a parrot).
  *   **Leaf H (Entitlement):** *Awkward Commitment:* You have a right to believe even if the world is structured to deceive you, provided you are not negligent.
  *   **Leaf I (Unnamed):** *Awkward Commitment:* Your verdicts rely on untheorized intuitions that may shift with mood or context.
  *   **Leaf J (Transmissive):** *Awkward Commitment:* A chain of a hundred liars could transmit knowledge if the first link knew the truth and the chain preserved the signal perfectly.

  ***

  ### Part 3: Case Stress-Test

  The following cases are designed to break the tree. Where a case does not fit cleanly, the cross-cutting nature is diagnosed.

  1.  **Stranger in a Railway Station:** Fits **Leaf A** or **Leaf F**. *Diagnosis:* Standard case. If student demands ID, they drift to **Leaf B**.
  2.  **Biased Reliable Source (Favourable Outputs Only):** Breaks **Leaf C**. *Diagnosis:* The source is reliable (Externalist pass) but the hearer has misleading evidence of unreliability (Internalist fail). The tree forces a choice between Node 2 options; students often stall here.
  3.  **Chain of Hundred Speakers:** Breaks **Leaf J** vs. **Leaf B**. *Diagnosis:* Local Reductionists say warrant fades (Node 10 Yes); Transmissionists say it holds (Node 10 No). This is the primary separator for Node 10.
  4.  **Lying Teacher (Sincere Assertion, Private Disbelief):** Breaks **Leaf G**. *Diagnosis:* Assurance requires speaker responsibility; she is not responsible for the truth. But she is institutionally reliable. Students often answer Node 7 "Yes" but feel uneasy.
  5.  **Anonymous Verified Account:** Breaks **Leaf B** vs. **Leaf A**. *Diagnosis:* Track record is local (Leaf B), but identity is unknown (Leaf A). The tree forces a choice at Node 3 that the case blurs.
  6.  **Stranger vs. Trusted Friend:** Breaks **Leaf C**. *Diagnosis:* Measured reliability is identical, but intuition favors the friend. The tree (Node 4) cannot capture the *affective* component of trust without mislabeling it as Evidence (Node 3).
  7.  **Self-Proclaimed Unreliable Speaker:** Breaks **Leaf F**. *Diagnosis:* Presumption is defeated by warning. The tree handles this via "until warned otherwise," but students often treat the warning as a reason (Node 1) rather than a defeater.
  8.  **Group Report (No Individual Endorsement):** Breaks **Leaf G** and **Leaf E**. *Diagnosis:* No single human faculty or responsibility exists. The tree assumes a singular speaker. Students must treat the "Institution" as the speaker to proceed.
  9.  **AI / Large Language Model:** Breaks **Leaf G** and **Leaf E**. *Diagnosis:* AI has no "nature" to be truthful (Node 5) and cannot "take responsibility" (Node 7). Students must route through Node 4 (Reliabilist) or Node 8 (Entitlement), exposing that the tree is anthropocentric.
  10. **Self-Fulfilling Reliability (Belief creates Truth):** Breaks **Leaf A** and **Leaf C**. *Diagnosis:* Reliability is caused by the belief the testimony generates. This creates a causal loop that Node 1 (Need Reason) cannot untangle, as the reason is created *by* the acceptance.

  ***

  ### Part 4: Scoring & Limitations

  **Scoring Incoherent Patterns**
  If a student's answers loop back (e.g., answering "No Reason Needed" at Node 1, then "I need to check their track record" at Node 5), mark this as **Theoretical Drift**. It indicates they are holding a Reductionist intuition while trying to occupy an Anti-Reductionist label. If they answer "Yes" to Node 4 (Actual Reliability) but "Yes" to Node 2 (Must be Aware), mark as **Internalist/Externalist Confusion**. These patterns are more diagnostic than a "wrong" leaf; they show the student is conflating the *source* of warrant with *access* to warrant.

  **Closing Note on Limitations**
  This instrument classifies *commitments*, not *competence*. A student may walk the tree to "Reidian Anti-Reductionism" correctly but arrive there because it sounds nice, not because they understand the regress argument that necessitates it. Conversely, a student may stall at Node 3 because they see a genuine ambiguity in the case (e.g., the Anonymous Account) rather than a lack of theoretical knowledge. The tree reveals whether a student *has* a consistent set of answers; it cannot tell you whether those answers are derived from a principled view or from case-by-case intuition masquerading as theory. Use the tree to expose the inconsistency, then ask *why* they answered as they did to distinguish theory from guesswork.
