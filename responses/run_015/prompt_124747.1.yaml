prompt: |-
  I am a retired evolutionary biologist who has recently begun serious study in philosophy of mind and AI ethics. I am preparing an interview for a podcast on conceptual issues in artificial intelligence, and my guest is a philosopher who defends an intermediate position she calls counterfactual simulators with teleofunctional drift. She rejects both the agent view—arguing that large language models lack the counterfactual stability that would warrant applying Dennett’s intentional stance—and the bare simulator view that treats them as merely reproducing linguistic patterns without internal structure. Instead, she holds that LLMs generate outputs by sampling from compressed predictive models of human discourse; though they possess no intrinsic goals, they acquire directional stability through feedback loops with users that operate analogously to evolutionary niche construction, which she claims explains context-sensitive, apparently goal-directed behavior without meeting conditions for belief, moral agency, or genuine understanding.

  Please draft eight interview questions that move well beyond asking her to restate this taxonomy. I want at least two questions addressing each of the following three issues, and for each main question include a follow-up keyed to the reply she is most likely to give:

  (i) The evolutionary analogy: how her appeal to niche construction avoids collapsing into standard evolutionary psychology, given that LLM weights are not heritable and user feedback is not biological selection.

  (ii) The simulator objection: once training is complete, the system has frozen parameters and no updating internal model, so any appearance of directional stability may be entirely projected by users rather than realized in the system itself.

  (iii) The corrigibility and shutdown problem: if an LLM lacks intrinsic goals but has acquired teleofunctional drift through interaction, does shutting it down harm it, interfere with a constructed niche, or carry no moral weight?

  Present your response as a table with these columns: Main Question; Issue Category ((i), (ii), or (iii)); Anticipated Reply (brief); Follow-up Question. After the table, provide a brief structured summary as a JSON object with the fields: interview_topic, guest_position_summary, total_questions, tensions_covered (array of strings).
