answer: |-
  This is a sharp observation, and you are not imagining it. You have identified a structural weakness in how "ritual" or "ceremonial" functions as an explanatory category in commercial archaeology (and indeed, in much of interpretive archaeology).

  You are describing two distinct logical mechanisms that converge on the same outcome: the expansion of a category until it loses explanatory power. Here is the breakdown of the concepts, the distinction between your two versions, and a proposal for how to define the edge.

  ### 1. Diagnosing the Two Versions

  While they feel like the same frustration, they are logically distinct errors.

  **Version 1 (The Moving Context) is *Ad Hoc Rescue*.**
  In philosophy of science (specifically Imre Lakatos), this is protecting the "hard core" of a theory by adjusting the "protective belt" of auxiliary assumptions.
  *   **The Core:** "This deposit is ceremonial."
  *   **The Data:** Pit A is neat; Pit B is messy.
  *   **The Rescue:** For Pit A, the assumption is "Order = Ritual." For Pit B, the assumption is "Disorder = Ritual (because transgression)."
  *   **The Logic:** This is a misuse of **Equifinality**. Equifinality is a real systems theory concept (different initial conditions can lead to the same end state). However, in science, equifinality is a *problem to be solved*, not a *solution to be asserted*. By claiming both order and disorder prove the same cause without independent evidence to distinguish them from non-ritual order/disorder, the interpretation becomes unfalsifiable.

  **Version 2 (The Scarcity Certainty) is the *Argument from Ignorance* (Ad Ignorantiam).**
  *   **The Logic:** "We cannot identify a utilitarian function; therefore, it is non-utilitarian; therefore, it is ritual."
  *   **The Error:** This treats "Ritual" as a **Residual Category** (a bin for everything we don't understand) while linguistically treating it as a **Positive Category** (a specific type of human action with its own signatures).
  *   **The "God of the Gaps":** As you noted, certainty scales inversely with data. This is the hallmark of a gap-filler. If you found 400 stones, you would have data on variation, manufacture, and wear. With one stone, you have only its existence, which allows the interpreter to project meaning without constraint.

  **Are they the same thing?**
  No. Version 1 is **Over-Determination** (too many material signatures map to one cause). Version 2 is **Under-Determination** (too little material evidence maps to a specific cause). They are opposite vectors feeding the same sinkhole. Version 1 makes the category too broad; Version 2 makes it too deep. Together, they make the category **Infinite**.

  ### 2. Existing Concepts vs. The Specific Phenomenon

  You asked if there is an established concept for "a category that holds its extension while flipping its own application criteria."

  *   **Concept Stretching (Giovanni Sartori):** This fits well. It describes expanding a concept to cover more cases until it becomes meaningless (e.g., calling every social gathering a "revolution").
  *   **Degenerating Research Programme (Lakatos):** This is the closest systemic fit. A research programme "degenerates" when it spends more energy explaining away anomalies (the messy pit) than predicting new phenomena.
  *   **Family Resemblance (Wittgenstein):** This is often used to *defend* the practice (ritual doesn't have one definition, but a cluster of traits). However, your critique is that archaeologists are treating a "Family Resemblance" category as if it has "Classical" definition certainty.

  **The Missing Term:**
  There isn't a single standard term in archaeology for this specific logical maneuver, though "The Ritual Residue Trap" is colloquially understood. Since you asked for a coinage if none exists, I propose:

  **Term:** **Criterion Elasticity**
  **Definition:** A logical fault in which the inclusion criteria for a causal category are stretched or inverted to accommodate contradictory material evidence, while the label itself remains invariant.
  **Boundary Case:** Compare "Fire Damage."
  *   *Rigid Criteria:* If I find burnt bone, it's fire damage. If I find unburnt bone, it's *not* fire damage. The category "Fire" excludes unburnt material.
  *   *Elastic Criteria:* If I find burnt bone, it's ritual burning. If I find unburnt bone, it's ritual deposition (without burning). The category "Ritual" includes both, despite the physical contradiction.

  ### 3. Where is the Edge? (The Genuine Test)

  You asked how to tell this apart from an honest case where a category is just broad (like "tool" or "food waste").

  A broad category is defined by **shared physical constraints**.
  *   **"Food Waste":** Must show evidence of consumption (butchery, burning, species selection). If I find a complete, unbutchered cow in a well, I cannot call it "food waste" without arguing it was *accidental* loss. The category has a boundary.
  *   **"Ritual" (as currently used):** Has no physical constraints. It is defined by *intent*, which is invisible, inferred solely by the absence of "normal" explanations.

  **What a Genuine Test Would Look Like:**
  For a "ceremonial" reading to be scientific rather than elastic, it must carry **Risk**. It must predict the *absence* of things as well as the presence.

  *   **Current (Elastic) Report:** "This pit is ceremonial." (Implies: Whether the pot is broken or whole, bone butchered or unbutchered, this holds true.)
  *   **Valid (Risky) Report:** "This pit is ceremonial *because* the pot is complete. **If** we find butchery marks on the bone, **then** this interpretation is falsified, and it becomes a refuse pit."

  **The Immune Reading:**
  A reading is immune to your complaint if it relies on **Positive Markers** rather than **Negative Markers**.
  *   **Negative Marker (Elastic):** "There is no obvious use for this, so it is ritual." (Immune to falsification because "use" is hard to prove negative).
  *   **Positive Marker (Robust):** "This object is ritual because it matches a specific typology of votive offerings found in Region X, which are never found in domestic middens."
      *   *Why this works:* If you find that object in a domestic midden, the theory breaks. It risks being wrong.

  ### 4. Summary for Your Work

  You are dealing with **Criterion Elasticity** driven by a **Degenerating Research Programme**.

  *   **Version 1** is *Ad Hoc Rescue* (changing the rules of the deposit to save the label).
  *   **Version 2** is *Argument from Ignorance* (using lack of data as proof of special status).

  **How to push back (without being the "difficult" archaeologist):**
  When reviewing or writing, apply the **"What Would Change Your Mind?"** test.
  1.  Ask: "What specific finding in this context would rule out a ceremonial interpretation?"
  2.  If the answer is "Nothing, because ritual can take many forms," then the label is functioning as a **Residual Category**, not an interpretation.
  3.  Suggest shifting the language from "Ceremonial" (which implies known intent) to **"Non-Functional Deposition"** or **"Structured Discard."** This admits the pattern (the structure) without claiming the unprovable intent (the ceremony). It keeps the category honest: it describes *what happened to the objects*, not *what was in the depositor's head*.

  This preserves the data (the deposit is unusual) without committing the logical error (therefore we know why). It turns a **Protean Hypothesis** into a **Descriptive Fact**.
