answer: |-
  **Algorithmic Fairness Coherence Procedure**

  **Purpose:** To assess the mathematical coherence of fairness commitments within a defined deployment envelope, without prescribing policy values.

  **Step 1: Define the Deployment Envelope**
  Record the specific decision rule (fixed threshold or fixed-capacity top slice), the outcome variable (e.g., fraud confirmed), the protected groups, and the observation window.
  *Stop condition:* If the same score feeds multiple units with different thresholds, define a separate envelope for each. Coherence must hold within each envelope independently.

  **Step 2: Assess Label Availability**
  Determine if the outcome is observed for all cases or only those selected for investigation.
  *   **If observed for all:** Proceed to Step 3.
  *   **If observed only for selected cases:** The body must declare the assumption used to correct for selective labels (e.g., random audit sample).
      *   *Return:* 'Holds under this envelope only' contingent on the validity of the correction assumption. If no correction is attempted, error rates are unidentified. Stop.

  **Step 3: Estimate Base Rates**
  Calculate the prevalence of the outcome within each group using the validation sample (corrected if necessary).
  *   **If base rates are equal (within confidence intervals):** Incompatibility theorems do not bind. Proceed to Step 5.
  *   **If base rates differ:** Proceed to Step 4.

  **Step 4: Test Metric Compatibility**
  List the fairness metrics the body claims the model satisfies simultaneously. Common metrics include: Calibration within Groups, Equal False Positive Rates (FPR), and Equal False Negative Rates (FNR).
  *   **If the body claims Calibration + Equal FPR + Equal FNR:**
      *   *Return:* 'Internally inconsistent claim — send back to the vendor'. (Mathematically impossible when base rates differ).
  *   **If the body claims Equal FPR + Equal FNR (without Calibration):**
      *   *Return:* 'Internally inconsistent claim — send back to the vendor'.
  *   **If the body claims only a subset (e.g., Calibration + Equal FPR):**
      *   Proceed to Step 5.

  **Step 5: Verify Value Choices**
  Where incompatibility exists, the body must explicitly acknowledge which metric is sacrificed.
  *   *Return:* 'Value choice recorded'. The Office does not validate the choice, only that the trade-off is acknowledged.

  **Step 6: Proxy and Group Definition**
  Review if group labels are self-declared or proxied.
  *   *Return:* 'Holds under this envelope only'. The Office cannot verify proxy quality; coherence applies only to the labels provided.

  ***

  **Application 1: Tax Authority Audit Selection**

  **Envelope:** Fixed threshold score triggering audit; outcome is 'underpayment confirmed'; groups are region-based; outcomes observed only for audited cases.
  **Claims:** The vendor reports Calibration within each group, Equal FPR, and Equal FNR across groups.
  **Procedure Run:**
  1.  **Envelope:** Defined.
  2.  **Labels:** Outcomes observed only for audited cases. The Authority assumes no bias in selection regarding unobserved fraud. We note this limitation but proceed conditionally.
  3.  **Base Rates:** Underpayment prevalence differs significantly by region.
  4.  **Compatibility:** The vendor claims Calibration, Equal FPR, and Equal FNR simultaneously.
  5.  **Result:** Given differing base rates, satisfying all three metrics is mathematically impossible.
  **Opinion:** 'Internally inconsistent claim — send back to the vendor'. The Authority must require the vendor to specify which metric is compromised. Until resolved, the model cannot be certified for deployment.

  **Application 2: Council Housing Inspection**

  **Envelope:** Fixed-capacity top slice (weekly visit quota); outcome is 'hazard found'; groups are ethnicity proxies; outcomes observed for all visited properties.
  **Claims:** Statutory duty to equalise the rate at which groups are wrongly flagged (Equal FPR). The Council expects the model to treat groups equally regarding missed hazards (Equal FNR) whilst maintaining accuracy.
  **Procedure Run:**
  1.  **Envelope:** Defined. Note: Capacity constraint implies a moving threshold, but fairness is assessed at the deployment cut-off.
  2.  **Labels:** Observed for visited cases. Selection bias exists (only high scores visited). Correction assumption required. We proceed conditionally.
  3.  **Base Rates:** Hazard prevalence differs across groups.
  4.  **Compatibility:** The Council requires Equal FPR (statutory). They also expect Equal FNR.
  5.  **Result:** With differing base rates, Equal FPR necessitates unequal FNR. You cannot equalise both error rates.
  **Opinion:** 'Holds under this envelope only' regarding the statutory duty, but 'Internally inconsistent claim' regarding the expectation of equal missed hazards. To comply with the statute, the Council must accept that the rate of missed hazards (FNR) will differ across groups. The model outperforms the status quo, but the mathematical constraint remains. The Council must formally record this trade-off as a value choice.

  ***

  **Limitations of the Procedure**

  This procedure determines logical coherence, not moral correctness. It cannot tell us which fairness criterion *ought* to be chosen; that remains a ministerial decision. It cannot verify the quality of proxy variables used for protected groups; if the proxies are poor, the fairness metrics are meaningless. It cannot resolve selective label bias without untestable assumptions about the uninvestigated population. Finally, it cannot assess whether the model itself is fit for purpose; a model can be internally consistent yet useless. We audit the arithmetic of the commitment, not the wisdom of the policy.
