answer: |-
  Here is the spec. I am not going to give you a menu. I am going to give you the requirements necessary to make naturalism work for *medicine* specifically, which imposes stricter constraints than philosophy of biology alone.

  ### The Spec: Desiderata for a Medical Theory of Function

  To do the work you need (licensing "malfunction" claims while respecting physiological practice), your theory must satisfy the following, ranked by priority.

  **1. The Normative Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between a trait *having* a function and a trait *performing* that function well. It must allow for the possibility of a trait existing and doing *something* causal, yet still be in a state of "malfunction."
  *   **Case/Consideration:** A heart that fibrillates is still a heart (it has the function of pumping), but it is malfunctioning. A pure Causal-Role (Cummins) account struggles here because if the fibrillation contributes to *some* capacity (e.g., making noise), it counts as a function. Medicine collapses if "dysfunction" just means "contributing to a different system."
  *   **Status:** **Hard Constraint.** If a theory cannot ground pathology, it is useless for philosophy of medicine.

  **2. The System-Relativity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly index functions to a specific *system level* whose maintenance constitutes the "good."
  *   **Case/Consideration:** Your Cancer Case. A mutation drives cell division. At the *cell-lineage* level, this is functional (selected/contributory). At the *organism* level, it is dysfunctional (kills the host).
  *   **Status:** **Hard Constraint.** Medicine privileges the *organism* as the primary system of normative reference. A theory that cannot distinguish the cell's good from the organism's good cannot define disease (which is harm to the organism).

  **3. The Ahistorical Applicability Constraint (Negotiable/Preferred)**
  *   **Requirement:** The theory should be able to ascribe functions to traits in systems without an evolutionary history (e.g., synthetic organisms, prosthetics integrated into the body).
  *   **Case/Consideration:** Your Synthetic Case. A lab-grown organism with a synthesized genome. If your theory says it has no functions because it has no history, you cannot say its parts can *malfunction*. You can only say they are different.
  *   **Status:** **Soft Constraint.** Many etiological theorists bite the bullet here (no history = no function). However, for medicine, this is a high cost. If we ever treat synthetic patients, we need to know if they are sick.

  **4. The Granularity Constraint (Preference)**
  *   **Requirement:** The theory must match the resolution of medical practice. It should not ascribe functions so broadly that every effect counts, nor so narrowly that only "ultimate" survival counts.
  *   **Case/Consideration:** Physiology talks about the function of a protein pathway. Evolution talks about the function of reproduction. Medicine needs the middle.
  *   **Status:** **Preference.** Manageable via context, but the theory shouldn't make it impossible.

  ---

  ### The Hard Truth: Joint Satisfiability

  Your hunch is half-right. You cannot satisfy **Normativity** and **Ahistoricity** using a *Selected-Effect (Etiological)* principle. SE theories ground norms in history. No history, no norm.

  However, the list *is* jointly satisfiable if you abandon the idea that history is the *source* of the norm. You must shift to an **Organizational/Closure Account** (e.g., Mossio, Saborido, Moreno).

  In these accounts, a function exists if a trait contributes to the *self-maintenance* of the system that produces it. The "norm" is the system's own continued existence, not its evolutionary past.
  *   **Synthetic Case:** The synthetic cell maintains itself. Its parts contribute to that maintenance. Therefore, they have functions. If they stop contributing, they malfunction. (Satisfies Ahistoricity + Normativity).
  *   **Cancer Case:** The mutation contributes to the cell's maintenance but disrupts the organism's self-maintenance. Since medicine indexes the organism, it is a dysfunction. (Satisfies System-Relativity + Normativity).

  **What you lose by admitting this:** You lose the clean, objective "view from nowhere" that Boorse wanted from evolutionary history. Organizational norms are internal to the system. This makes "species-typical" slightly fuzzier (you have to define the organizational type), but it saves the concept of dysfunction for non-standard cases.

  ---

  ### The Verdict

  **The Single Requirement That Knocks Out Candidates:**
  **The Normative Constraint.**
  This is the killer. It immediately disqualifies pure Causal-Role (Cummins) accounts. In Cummins' view, a leaking heart valve has the function of making a swishing sound if that sound is analyzed in a capacity of the system (e.g., allowing a doctor to diagnose it). For medicine, this is absurd. A theory that cannot call the leak a *failure* is dead on arrival for your project.

  **The Oft-Repeated Demand That Is Actually Negotiable:**
  **The Etiological (History) Requirement.**
  Philosophers of biology often treat "selected effect" as synonymous with "biological function." This is a prejudice of the adaptationist program. For medicine, history is *evidence* of function, not the *definition* of function. We know the heart pumps blood because of its history, but it pumps blood *now* because of its organization. If you demand history as a necessary condition, you sacrifice the Synthetic Case and future-proofing. Drop the requirement that history *constitutes* function. Keep it as a heuristic for identifying standard functions.

  ---

  ### Scoring the Families

  | Account | Normative Constraint (Malfunction) | System-Relativity (Cancer) | Ahistorical (Synthetic) | Verdict for Medicine |
  | :--- | :--- | :--- | :--- | :--- |
  | **Etiological (SE)**<br>*(Wright, Millikan)* | **Pass.** (Strong norms via selection) | **Fail.** (Struggles with multi-level selection conflicts without ad-hoc fixes) | **Fail.** (No history = no function) | **Reject.** Too brittle for novel pathologies/synthetic cases. |
  | **Causal-Role (CR)**<br>*(Cummins)* | **Fail.** (Cannot distinguish function from effect/malfunction easily) | **Pass.** (Relative to analyzed system) | **Pass.** (Purely mechanistic) | **Reject.** Cannot define disease. |
  | **Organizational (O)**<br>*(Mossio, Closure)* | **Pass.** (Norms grounded in self-maintenance) | **Pass.** (System boundaries define the norm) | **Pass.** (History irrelevant) | **Accept.** Best fit, though metaphysically heavier. |

  ---

  ### Commitment & Uncertainty

  **My Commitment:**
  I am throwing out the **Etiological Requirement**. I am ranking **Normativity** as the supreme constraint. I argue that the **Organizational Account** is the only one that satisfies the spec without lying about the Synthetic or Cancer cases. You cannot be a Boorse-style naturalist about disease while insisting on strict Selected-Effect metaphysics; the two are drifting apart. To save the medical project, you must update the metaphysics.

  **Where I Am Most Likely Wrong:**
  I am likely underestimating the **epistemic cost** of the Organizational Account. While it solves the metaphysical problems (Synthetic/Cancer), it makes *identifying* dysfunction harder in practice. Evolutionary history provides a ready-made database of "normal." Organizational closure requires analyzing the causal topology of the specific patient's system to see if it's self-maintaining. This is computationally and diagnostically expensive.

  **What Would Change My Mind:**
  If you can demonstrate that medical practice *never* actually needs to ascribe function to ahistorical entities (i.e., if synthetic humans are impossible or legally classified as artifacts rather than patients), then the **Etiological Requirement** becomes viable again. If all patients are products of natural selection, SE theory is simpler and empirically grounded. If the Synthetic Case remains a thought experiment only, stick with Boorse/SE. If it becomes a clinical reality, you must switch to Organization.
