prompt: |-
  So I'm helping my friend run a philosophy of science workshop for grad studnets who all think they understand falsification because they read Popper in undergrad, and next week I need to lead the part on whether Malthus was actually wrong or just too early. I want them to see that long-run predictions have a different logical shape than short-run ones — that you can rescue a theory with an auxilliary like the demographic transition without being ad hoc, but only if that rescue has its own empirical teeth. Don't just explain it to me; plan how I should teach it in about forty minutes.

  What's the dependancy order — do I start with geometric vs arithmetic growth, or with the actual claim of the 1798 Essay about positive checks? What's the carrying example: should I use the green revolution as a rescue mechanism, or compare Malthus to climate models, and what does the example need to have and not have? Then the misconceptions: they'll probably think falsified means dead forever, that rescue hypotheses are always cheating, and maybe that Malthus was just ignorant of technology. Tell me exactly where in the arc to defuse each one. Give me one end-of-session question that checks whether they understand the difference between a prediction that failed and a mechanism that was delayed. And tell me what to leave out — I don't want to get dragged into actual agricultural economics or modern food security debates. Please start with your bottom-line recommendation for the very first thing I should put on the board, then the reasoning, with no preamble and no restating of my question.
