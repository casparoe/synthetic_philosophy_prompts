answer: |-
  **First Thing on the Board:**
  Write the **Temporal Falsification Schema**:
  $$ (T + A) \rightarrow P_{t1} $$
  $$ \text{Observation: } \neg P_{t1} $$
  $$ \text{Conclusion: } \neg T \text{ or } \neg A \text{ or } \text{Timing Error?} $$

  **Reasoning:**
  This immediately frames the session as a problem in logic and theory structure, not a history lesson. It forces students to confront the variable of time ($t_1$) as a philosophical parameter before they get lost in the specifics of Malthusian math. It primes them to see that a failed prediction at $t_1$ does not logically necessitate $\neg T$ if $A$ (auxiliary) or the timing is in flux.

  ---

  ### 40-Minute Workshop Plan

  **1. Dependency Order (0–10 mins)**
  *   **Start with the Empirical Claim (Positive Checks):** Do not start with geometric vs. arithmetic growth. Start with Malthus's observable prediction: *Population pressure must inevitably lead to famine, misery, or vice.* This is the falsifiable output.
  *   **Then Introduce the Mechanism (Growth Rates):** Once they accept the claim, explain the engine (geometric population vs. arithmetic food) as the *theoretical justification* for the claim.
  *   **Why:** Students often conflate the mathematical assumption with the empirical prediction. By isolating the claim (misery) first, you make it easier to show that the claim can be preserved even if the mechanism's timing shifts.

  **2. Carrying Example (10–25 mins)**
  *   **Recommendation:** Use the **Demographic Transition** as the rescue mechanism. Do not use the Green Revolution as your primary philosophical example.
  *   **Why:** The Green Revolution changes the *production function* (the "arithmetic" side), which looks like changing the core theory $T$. The Demographic Transition changes the *population behavior* (the auxiliary $A$ regarding preventive checks), which preserves $T$ (population presses on resources) but modifies the pathway.
  *   **Requirement for the Example:** The rescue must have **independent empirical teeth**. The Demographic Transition is verified by sociology and economics independently of Malthusian theory (e.g., birth rates fall with urbanization/education regardless of food supply).
  *   **Analogy:** If you need a structural analogy for "long-run prediction," compare Malthus to **Climate Models**. Both involve complex systems where the core mechanism (CO2 warming / Population pressure) is constant, but the observable outcome depends on auxiliaries (cloud feedback / birth rates) that unfold over centuries. This highlights the "waiting for data" problem without getting bogged down in agriculture.

  **3. Defusing Misconceptions (Integrated Timeline)**
  *   **"Falsified Means Dead Forever" (Minute 12):** When presenting the 19th-century data (population grew, famine didn't spike in the West), stop them. Ask: "Is the theory dead?" Introduce the Duhem-Quine problem here. The failure is of the *system* ($T + A + t$), not necessarily $T$.
  *   **"Rescue Hypotheses Are Always Cheating" (Minute 20):** When introducing the Demographic Transition, contrast it with an *ad hoc* rescue (e.g., "Malthus didn't account for God's intervention"). Show that the Demographic Transition was novel, risky, and independently testable. Use Lakatos's "progressive problem shift" here: did the rescue lead to new discoveries? Yes (demography).
  *   **"Malthus Was Just Ignorant of Technology" (Minute 35):** In the synthesis, correct the view that Malthus was "wrong." He was temporally displaced. The mechanism (pressure) exists, but the auxiliary (transition) delayed the positive checks. He wasn't ignorant; he was early.

  **4. End-of-Session Question (Minute 38)**
  *   "If a theory predicts a crisis at time $t$, and the crisis arrives at $t+50$ because an auxiliary mechanism slowed the causal chain, was the prediction at $t$ a **falsification** or a **calibration error**? What empirical evidence would you need to decide?"
  *   *Goal:* Checks if they understand that the logical status of the failure depends on the independent testability of the delay mechanism.

  **5. What to Leave Out**
  *   **Agricultural Economics:** Do not discuss yield per hectare, nitrogen fixation, or specific crop technologies. This distracts into engineering rather than philosophy.
  *   **Modern Food Security Debates:** Do not discuss current famine politics, distribution vs. production, or neo-Malthusian environmentalism. Keep the focus on the 1798–1950 logical structure.
  *   **Biography:** Skip Malthus's life details unless they relate directly to the formulation of the auxiliary hypotheses.
