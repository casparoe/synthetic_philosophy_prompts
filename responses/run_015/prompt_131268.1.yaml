answer: |-
  Okay, pull up a chair. This is actually a really sharp argument your roommate is making, even if they might be pushing the "voting is bad science" line a bit too hard for the sake of the debate. But they aren't crazy—Dewey did basically say that democracy *is* a form of social inquiry.

  Here's the breakdown of what that actually means, where your roommate is right, where they're stretching it, and how you'd actually run an online community if you took this seriously.

  ### 1. The Core Idea: Democracy as a Lab, Not a Tally Sheet
  The standard view of democracy (and most online governance) is **aggregative**. You take everyone's pre-existing opinions, throw them in a box, shake it up, and count them. The majority wins.

  Dewey's view is **transformative**. He thought democracy shouldn't just count preferences; it should *change* them through interaction. If democracy is inquiry, then the goal isn't to see who has the most power; it's to figure out what actually works to solve a shared problem.

  So, when your roommate says "policy is a hypothesis," they mean:
  *   **Traditional:** "We think banning links is good. Vote Yes or No."
  *   **Deweyan:** "We think banning links might reduce spam but hurt discussion. Let's try it for two weeks, measure the spam rate and user engagement, and then decide if we keep it."

  ### 2. Is Voting a "Methodological Failure"?
  This is the spicy part. Your roommate says majority rule is bad science. Here's the nuance:

  **Voting isn't a failure, but it's a blunt instrument.**
  In science, truth isn't decided by a show of hands. If 51% of physicists voted that gravity doesn't exist, gravity would still work. In a Deweyan democracy, if 51% vote for a policy that creates misery, the policy is "false" in the sense that it fails the test of living.

  So, voting is only a failure if it's used **instead of inquiry**.
  *   **Bad Science Democracy:** We vote immediately based on gut feelings. (This is what most subreddits or Discords do).
  *   **Good Science Democracy:** We discuss, we test, we gather data on outcomes, and *then* we might vote to ratify the finding.

  Tell your roommate: Voting is the period at the end of the sentence, not the whole paragraph. If you vote before you've done the work of inquiry, you're just institutionalizing ignorance.

  ### 3. Implications for Small Online Communities
  If you actually designed a Discord server, subreddit, or forum based on Dewey's experimentalism, it would look wildly different from how they usually work. Here are the concrete design implications:

  **A. Rules are Provisional, Not Commandments**
  Most communities have "Rule 1: Be Nice." It's static. In an experimental community, rules should have expiration dates or review periods.
  *   *Design:* "This no-politics rule is a 30-day experiment to see if it lowers toxicity. We review on the 1st of next month."
  *   *Why:* It lowers the stakes. People fight harder against permanent laws than temporary tests.

  **B. Metrics Over Opinions**
  In a vote, the loudest voices win. In an experiment, data wins.
  *   *Design:* Instead of polling "Do you like the new layout?", you track "Did user retention go up or down?"
  *   *Why:* Users often vote against their own best interests (e.g., they vote for stricter rules because they're angry today, but those rules kill the community vibe long-term). Data cuts through the mood.

  **C. Dissent is Data, Not Disruption**
  In most communities, people who argue against the consensus are seen as trolls or troublemakers. In Dewey's inquiry, dissent is crucial data. It highlights a flaw in the hypothesis.
  *   *Design:* You don't ban people for criticizing a rule; you treat their criticism as a bug report.
  *   *Why:* If a rule doesn't work for a minority, the "experiment" hasn't fully succeeded. You need to adjust the hypothesis, not silence the variable.

  **D. The "Emergency Brake" Problem**
  Here is where your roommate is stretching it. Pure experimentalism is slow. Science takes time. Sometimes a house is on fire.
  *   *Design:* You still need admins with veto power.
  *   *Why:* If someone is doxxing people or posting illegal content, you don't convene a committee to run a two-week study on the effects of doxxing. You ban them. Dewey knew inquiry requires safety. You need a "state of emergency" clause where voting is suspended to preserve the lab itself.

  ### 4. How to Win (or Compromise) the Argument
  Your roommate is right that **voting without discussion is empty.** But they're wrong if they imply we can *never* vote.

  Here's the line to hit them with:
  > "Dewey didn't say we stop voting. He said voting is useless if we haven't done the homework first. If we treat our community rules like scientific hypotheses, voting is just the peer-review process at the end. But if you think we can run a community purely on experiments without ever making a hard decision, you're ignoring that sometimes we just need to ship the product."

  **The Verdict for Community Design:**
  If you want to build a Deweyan community:
  1.  **Frame changes as tests.** ("Let's try this.")
  2.  **Define success metrics beforehand.** ("We'll know this worked if X happens.")
  3.  **Use voting only to confirm results,** not to guess outcomes.
  4.  **Accept that some things can't be experimented on** (safety, legality).

  Your roommate is pushing for a culture of **learning** over a culture of **winning**. That's a good instinct. But don't let them convince you that counting heads is inherently unscientific. It's only unscientific if you think the heads contain all the answers before you've even asked the question.
