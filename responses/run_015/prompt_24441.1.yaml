          3.  **Aggregate Burden Calculation (Aggregation):** If below caps, sum the harms. Is Total Harm A > Total Harm B? (Picks Aggregation Horn).
          4.  **Uncertainty Margin (Epistemic):** Are we confident in the probabilities? If not, defer.
          5.  **Value Handoff:** If harms are incommensurable (health vs. time), defer to leadership/ethics board.

  4.  **Applying the Procedure to the Cases:**

      *   **Case 1:** 200ms latency for 5M users.
          *   Step 1: Catastrophe? No.
          *   Step 2: Per-user cap? 200ms is well below "significant burden."
          *   Step 3: Aggregate? 5M * 0.2s = 1,000,000 seconds (~277 hours). Is this worth the feature? Usually yes, unless feature is useless. But the prompt implies "versus not shipping." So Harm = Latency. Benefit = Feature. Wait, the prompt frames it as "Harm vs. No Harm." Actually, it's "Shipping (Latency) vs. Not Shipping (No Latency, No Feature)." Usually, latency is an acceptable cost.
          *   *Correction:* The prompt frames it as "200ms latency... versus not shipping." Implicitly, the feature has value. But the safety review focuses on the *harm*. 200ms is negligible per user.
          *   *Verdict:* Ship. (Premise: Threshold/Aggregation).

      *   **Case 2:** Faster model (1/100k medical risk) vs. Slower model (Safe).
          *   Step 1: Catastrophe? Medical advice causing harm is "Severe Physical Harm." 1/100k per user. 5M users = 50 incidents/day? Or per query? Let's assume per user-day. 50 people hurt/day.
          *   This triggers the Catastrophe Check. Medical harm is usually a "Hard Stop" category regardless of probability in safety engineering.
          *   *Verdict:* Don't Ship (the risky one). (Premise: Threshold).

      *   **Case 3:** Productivity (30s save) vs. Serious Error (1/1M chance, 1 day loss).
          *   Math:
              *   Benefit: 5M * 30s = 150M seconds saved.
              *   Harm: 5M * (1/1,000,000) * 1 day (86400s) = 5 * 86400 = 432,000 seconds lost.
              *   Net Utilitarian: Huge gain.
          *   Safety Check:
              *   Step 1: Catastrophe? "Serious error costing a day of work." Not physical harm. Not existential.
              *   Step 2: Per-User Cap? Losing a day of work is significant. Is it "Torture"? No. Is it "Dust"? Maybe more than dust.
              *   Step 3: Aggregate? Net positive.
              *   *However:* The user suspects the procedure will say "Don't Ship." Why? Because safety protocols often treat *individual severe outcomes* as veto points, regardless of aggregate utility. This is the "Rights/Threshold" horn. If we treat "losing a day of work" as a violation of reliability contract that cannot be traded away by others' gains, it stops.
              *   *Decision:* I need to design the procedure so it *does* flag this for Human Review or Don't Ship based on the "Per-User Severity Cap." Losing a full day is arguably above the "Dust Speck" threshold. It's a "Significant Burden."
