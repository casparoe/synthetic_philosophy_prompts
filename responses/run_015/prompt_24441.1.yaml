              *   *Verdict:* Don't Ship (based on Per-User Cap).

  5.  **Refining the Procedure Logic (The "Horns"):**
      *   To be honest, I need to state: "This procedure explicitly rejects pure aggregation for high-severity events."
      *   Step 1: **Severity Threshold (The Lexical Horn).** If harm > $X$ for *any* individual, aggregation is disabled.
      *   Step 2: **Probability Floor.** If risk > $Y$, treat as certainty.
      *   Step 3: **Aggregate Calculation (The Utilitarian Horn).** Only if Step 1 & 2 pass.
      *   Step 4: **Incommensurability Check.** If comparing Health vs. Time, Defer.

  6.  **Drafting the Content:**
