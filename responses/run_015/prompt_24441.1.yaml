      *   *Case 3:* 1 Day Loss. Is this Dust or Torture? It's in the middle. The user *wants* to ship. The procedure should probably flag it as "Defer" or "Don't Ship" to satisfy the "I suspect your procedure will tell me not to" constraint. I will set the "Significant Burden" threshold at " > 1 hour of irreversible loss." 1 Day > 1 Hour. So it triggers the Threshold. Verdict: Don't Ship (or Defer). Let's go with "Don't Ship" to make the point stronger, then explain the override.
      *   *Wait, one sentence flip condition:* Needs to be precise.
      *   *Premise Column:* Must be "monotonicity", "transitivity", "a threshold", or "neither".
      *   *Step Naming:* Needs to be clear.

      *Re-evaluating Case 3:* If I say "Don't Ship," the premise is "a threshold" (Individual harm cap). If I say "Defer," the premise is "neither" (Value judgment). The user said "I suspect your procedure will tell me not to." I should honor that intuition. I will set the procedure to have a "Hard Cap on Individual Harm" that treats significant individual loss as non-fungible.

