  2.  **Deconstruct the Philosophical Problem (Torture vs. Dust Specks):**
      *   *The Paradox:* Is a million dust specks worse than one torture?
      *   *Option A (Aggregation/Utilitarian):* Yes. $N \times \text{small} > \text{large}$. (Hard to swallow intuitively).
      *   *Option B (Lexical/Threshold):* No. There is a category error. Torture is *lexically* worse than any amount of dust. (Hard to define the threshold).
      *   *Option C (Non-transitivity):* A > B, B > C, but not A > C. (Logically messy for decision procedures).
      *   *Practical Reality:* Companies usually operate on a *Threshold* model (Safety Limits) + *Aggregation* (for minor stuff) but with a *Hard Stop* for catastrophic risk.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* actionable, fast, honest about assumptions.
      *   *Structure:* Funnel approach. Start with hard constraints, move to calculations, end with value judgments.
      *   *Step 1: Catastrophic/Existential Filter.* (Hard Threshold). If risk is "life/limb/legal existential," stop. This picks the "Threshold" horn.
      *   *Step 2: Rights/Violation Filter.* (Deontological Check). Does this violate consent or rights? If yes, stop.
      *   *Step 3: Aggregation Calculation.* (Utilitarian Math). Calculate Total Harm A vs. Total Harm B. This picks the "Aggregation" horn *within* acceptable bounds.
