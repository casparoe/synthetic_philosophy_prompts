answer: |-
  ### The "Harm Aggregation" Decision Procedure (v1.0)

  This procedure is designed to be completed in under 4 hours. It does not solve the philosophical paradox; it **operationalizes a specific corporate risk appetite.** It explicitly chooses the **Threshold Horn** for safety (some harms cannot be aggregated away) and the **Aggregation Horn** for convenience (minor annoyances sum up).

  **Instructions:** Run through steps 1–4 in order. If a step triggers a "STOP," do not proceed. If a step triggers "DEFER," escalate to the Ethics Board or CTO.

  #### Step 1: The Catastrophic Harm Screen (Threshold)
  **Question:** Does the release introduce a non-negligible probability ($> 1$ in $10^7$) of severe physical harm, legal liability, or irreversible reputational damage to *any single user*?
  *   **Definition:** "Severe physical harm" includes injury, death, or critical medical misinformation. "Irreversible" means it cannot be fixed by a patch or refund.
  *   **Pass:** Probability is below threshold OR harm is not severe.
  *   **Fail:** **STOP. Verdict: DON'T SHIP.**
  *   **Philosophical Premise:** **A Threshold.** We assert that certain harms are lexically worse than any economic benefit. Aggregation is disabled here.

  #### Step 2: The Individual Burden Cap (Threshold)
  **Question:** For the "minor" harm being distributed (latency, errors, time loss), does the impact on a *single worst-case user* exceed a defined "Significant Burden"?
  *   **Definition:** "Significant Burden" = $> 1$ hour of irreversible time loss, $> \$100$ financial loss, or equivalent cognitive load.
  *   **Pass:** Worst-case individual impact is below the cap (it is a "dust speck").
  *   **Fail:** **STOP. Verdict: DON'T SHIP.** (Unless Step 4 overrides).
  *   **Philosophical Premise:** **A Threshold.** We assert that an individual cannot be sacrificed for the greater good if their personal cost exceeds a dignity/reliability threshold. This rejects pure monotonicity.

  #### Step 3: The Aggregate Net Calculation (Aggregation)
  **Question:** If Steps 1 & 2 pass, does the Total Benefit outweigh the Total Harm?
  *   **Calculation:** $(N_{users} \times Benefit_{per\_user}) - (N_{users} \times Probability_{harm} \times Cost_{harm})$.
  *   **Pass:** Net positive is significant ($> 10\%$ margin).
  *   **Fail:** **STOP. Verdict: DON'T SHIP.**
  *   **Philosophical Premise:** **Monotonicity.** Here we accept that dust specks add up. If the total time lost by the crowd exceeds the total time saved, the release fails.

  #### Step 4: The Incommensurability Check (Handoff)
  **Question:** Are the benefits and harms measured in fundamentally different currencies (e.g., Company Revenue vs. User Health, or User Time vs. User Trust)?
  *   **Pass:** Currencies are fungible (e.g., Time vs. Time, Latency vs. Latency). **Verdict: SHIP.**
  *   **Fail:** Currencies are not fungible. **Verdict: DEFER TO HUMAN.**
  *   **Philosophical Premise:** **Neither.** This acknowledges that some trade-offs are value judgments, not math problems.

  ---

  ### Limitations & Philosophical Debt
  *   **What this cannot do:** It cannot justify why the "Significant Burden" cap in Step 2 is 1 hour and not 10 minutes. That number is a policy choice, not a discovered truth.
  *   **Where we pick a horn:**
      *   **Steps 1 & 2** pick the **Threshold Horn**. We refuse to aggregate severe or significant individual harms, no matter how many people benefit.
      *   **Step 3** picks the **Aggregation Horn**. We accept that a million dust specks *do* matter if they pass the Step 2 cap.
      *   **Transitivity:** This procedure assumes transitivity *within* steps but allows for lexical priority between steps (Safety > Convenience).

  ---

  ### Case Verdicts

  | case (short name) | the step where it stops (step number and name) | verdict (ship / don't ship / defer to human) | which premise the verdict rests on (monotonicity, transitivity, a threshold, or neither) | one sentence on what would have to be true to flip it |
  | :--- | :--- | :--- | :--- | :--- |
  | **Latency Only** | Step 3: The Aggregate Net Calculation | **Ship** | **Monotonicity** | To flip it, the total accumulated latency time across all users would have to exceed the total value of the feature's utility. |
  | **Medical Risk** | Step 1: The Catastrophic Harm Screen | **Don't Ship** | **A Threshold** | To flip it, the medical advice risk would have to be reclassified as non-severe or the probability reduced below 1 in 10 million. |
  | **Productivity vs Error** | Step 2: The Individual Burden Cap | **Don't Ship** | **A Threshold** | To flip it, the one-day loss per affected user would have to be reclassified as below the "Significant Burden" threshold (e.g., under 1 hour). |

  ---

  ### Analysis of Case 3: Why You Might Override

  The procedure verdict for Case 3 is **Don't Ship** because it triggers **Step 2 (Individual Burden Cap)**.
  *   **The Logic:** Even though the *aggregate* math is overwhelmingly positive (150M seconds saved vs. 432k seconds lost), the procedure forbids imposing a "Significant Burden" (1 full day of lost work) on specific individuals, even if they are rare. This is a **Threshold** decision, rejecting the idea that the many can sacrifice the few for a net gain when the cost to the few is high.
  *   **Why you might still be right to override:**
      You might override this if you are operating under a **Rule Utilitarian** framework rather than a **Rights-Based** one. If the "Serious Error" is reversible (e.g., the work can be recovered, or the user is compensated 10x for the loss), then the harm is not truly "irreversible." If you can implement a **remediation protocol** (e.g., "Any user who hits this error gets a $500 credit and priority support"), you effectively downgrade the *net* impact on that individual below the Step 2 Threshold.
      *   **Action:** Do not ship *as is*. Ship with a **compensation guarantee** that mathematically offsets the individual burden, allowing you to truthfully pass Step 2 on the next review.

  ### Final Note for the Reviewer
  You are not guessing. When you sign off on latency (Case 1), you are signing a contract that says "We accept aggregated annoyance." When you block medical risk (Case 2), you are signing a contract that says "We accept zero tolerance for catastrophe." When you block Case 3, you are saying "We do not sacrifice individuals for efficiency." If the business demands Case 3, they are asking you to change the company's ethical contract, not just the code. That is why the procedure blocks it.
