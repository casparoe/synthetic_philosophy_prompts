answer: |-
  It is a pleasure to address a question from someone who has not only read the text but has lived the practice. Your intuition that scientific revolutions do not feel like arbitrary conversions is, I believe, correct—and it is an intuition that Thomas Kuhn himself shared, despite the rhetoric in *The Structure of Scientific Revolutions* (SSR) that often suggested otherwise.

  Your former postdoc is right: the distinction between **incommensurable** and **incomparable** is the key to unlocking this puzzle. You are indeed smuggling in a stronger thesis than Kuhn defends, though Kuhn bears some responsibility for this confusion due to his evocative (and sometimes careless) use of terms like "conversion" and "Gestalt switch."

  Here is an attempt to untangle the knot, keeping your experience as a physicist in mind.

  ### 1. Incommensurability $\neq$ Untranslatability

  The term "incommensurable" comes from mathematics (e.g., the side and diagonal of a square have no common unit of measure). It does not mean "unable to be compared"; it means "unable to be measured by a *common* standard."

  When Kuhn claims that Newtonian mass and Einsteinian mass are incommensurable, he is not saying a Newtonian physicist cannot understand what Einstein is saying. He is saying there is no **neutral language** into which both can be translated without loss or distortion.

  *   **The Strong Thesis (which you are rightly rejecting):** Paradigm A and Paradigm B speak completely different languages. Communication is impossible. Choice is blind.
  *   **Kuhn's Actual Thesis:** Paradigm A and Paradigm B share a large overlap of vocabulary and observation, but certain central terms change their meaning in ways that prevent a point-by-point logical proof that B is "truer" than A using only the rules of A.

  You can translate locally. You can explain relativity to a Newtonian. But you cannot construct a proof that relies on premises the Newtonian *must* accept by the lights of their own paradigm. The Newtonian concept of "mass" (invariant quantity) and the Einsteinian concept (energy-equivalent, frame-dependent) are not measuring the same thing in the same way. To understand the new term, you effectively have to learn a new taxonomy of the world.

  ### 2. Incommensurable $\neq$ Incomparable

  This is where your postdoc's distinction does the heavy lifting.

  If two theories were **incomparable**, there would be no basis for choice. You would have no reason to prefer one over the other. This would indeed make science arbitrary.

  But Kuhn argues they are **incommensurable yet comparable**. We can compare them, but we cannot do so using an algorithm. There is no rulebook that says, "If Theory B predicts perihelion precession better than Theory A, discard Theory A." Why? because Theory A might be simpler, or have a longer track record of success in other domains.

  Kuhn identifies five shared values that scientists use to compare paradigms:
  1.  **Accuracy** (empirical adequacy)
  2.  **Consistency** (internal and external)
  3.  **Scope** (range of phenomena explained)
  4.  **Simplicity** (parsimony)
  5.  **Fruitfulness** (potential for new discoveries)

  Here is the crux of the rationality issue: **All scientists share these values, but they may weigh them differently.**

  During a revolution, one group might prioritize *accuracy* (the new paradigm solves the anomalies), while another prioritizes *consistency* (the old paradigm doesn't break established metaphysics). Both sides are being rational. Both are using evidence. But because there is no super-algorithm to tell us how to weight "simplicity" against "scope," the decision is not logically compelled.

  This makes the choice **underdetermined**, not **arbitrary**.

  ### 3. The "Religion" Objection

  You wrote: *"Any such choice would have to be argued in some language... the decision to switch looks to me like it must be arbitrary — a matter of fashion, authority, or group psychology."*

  Kuhn would agree that authority and psychology play a role (science is done by humans, after all), but he would deny that this excludes evidence.

  Think of a legal trial rather than a mathematical proof. In a court case, there is no algorithm that dictates "If evidence X is present, the defendant is guilty." Lawyers argue using shared standards (laws, precedents, reasonable doubt), but jurors must weigh these standards. A verdict is rational, evidence-based, and arguable, yet it is not algorithmically derivable.

  Kuhn views paradigm choice similarly. It is a persuasive process. When you lived through a shift in your field, you likely didn't wake up one day and decide to "convert." You likely saw anomalies accumulate. You saw the old tools failing to solve new problems. You saw the new paradigm offering solutions, even if it had its own teething problems. You weighed the *fruitfulness* of the new approach against the *stability* of the old.

  That is a rational process. It is just not a **deductive** one.

  ### 4. Why It *Felt* Rational to You

  You mentioned that shifts in your field "did not feel arbitrary." This is the strongest evidence against the "strong thesis" of incommensurability.

  In his later years (particularly in *The Road Since Structure*), Kuhn softened his stance significantly. He acknowledged that he had overstated the isolation of paradigms. He moved toward a view where incommensurability is a matter of **lexical taxonomy**.

  *   **Example:** In the phlogiston paradigm, "dephlogisticated air" is a specific kind of substance. In the oxygen paradigm, "oxygen" is a specific kind of substance. They refer to roughly the same stuff, but the *network of relationships* defining those terms is different.
  *   **The Rational Bridge:** We can compare them because they are both trying to solve the same puzzles (combustion, respiration). The new paradigm solves more puzzles, or solves them more precisely.

  The rationality lies in the **problem-solving ability**. If the new paradigm allows you to write better grants, build better detectors, and predict outcomes more accurately, the community shifts. That is not fashion; that is utility. But because "utility" is not a single metric (is it short-term accuracy or long-term fruitfulness?), reasonable scientists can disagree for a while.

  ### 5. Summary: Saving Rationality

  To answer your specific questions:

  **1. Is incommensurability a claim about literal untranslatability?**
  No. It is a claim about the lack of a *neutral* language. You can translate, but you cannot translate without interpreting the terms through the lens of one paradigm or the other. There is no "God's eye view" language.

  **2. Am I smuggling in a stronger thesis?**
  Yes. You are interpreting "no common measure" as "no contact." Kuhn intends "no common measure" to mean "no automatic decision procedure."

  **3. Is the switch a matter of evidence and argument?**
  Yes. But the argument is not a proof; it is a case. Evidence is central, but the interpretation of that evidence is theory-laden. The rationality is **persuasive**, not **coercive**.

  **4. Is it a change of taste?**
  Only in the sense that weighing "simplicity" against "scope" involves judgment. But it is a judgment constrained by the physical world. If the new paradigm didn't work experimentally, no amount of "taste" would make it stick.

  ### A Thought for a Physicist

  As an experimentalist, consider the transition from classical to quantum mechanics. For a decade, the two coexisted. Old physicists could understand the new math, but the *ontology* (what the math represented) was incommensurable.

  Did they choose quantum mechanics because of "group psychology"? Or because the old paradigm literally could not calculate the specific heat of solids or the blackbody spectrum?

  It was the latter. The choice was driven by evidence. But the *acceptance* of that evidence required a shift in what counted as a satisfactory explanation (from deterministic trajectories to probabilistic wavefunctions). That shift wasn't arbitrary, but it wasn't a simple logical deduction either. It required learning to see the world differently.

  Kuhn's point is not that science is irrational, but that its rationality is more complex, human, and historical than the logical positivists wanted to admit. Your experience confirms this: the shift was hard, it involved debate and uncertainty, but it was ultimately driven by the success of the new tools. That is rationality enough.
