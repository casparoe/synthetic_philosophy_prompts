  been lurking around these parts since the old SSC days and I finally wrote up something thats been bouncing around in my head for like two years. It's a forum-post-length thing on modal realism. I'd kick it around in the comments myself but I want it torn apart before I post it anywhere. Roughly 900 words, draft below.

