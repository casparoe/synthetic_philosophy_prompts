answer: |-
  This is sharp. It reads like the kind of post that would have generated 300 comments on the old blog, half of them arguing about measure theory and the other half arguing about whether Lewis was a madman. You've captured the voice well—technical but punchy.

  Here is the teardown, following your requested order.

  ### 1. Where is Lewis wrong? (Counterpart Theory)
  You are running two notions of similarity together: **world similarity** (for *de dicto* modality and counterfactual semantics) and **counterpart similarity** (for *de re* modality).

  Your counterfactual objection ("Cheap worlds let you satisfy any antecedent... hold our region fixed exactly, make the antecedent true out in the boondocks") works only if the antecedent is non-indexical (e.g., "If a match were struck"). If the antecedent is *de re* (e.g., "If *I* struck the match"), Lewis's counterpart theory blocks the cheap world. A duplicate of you in the boondocks is not your counterpart unless it stands in the right causal/historical relation to your actual context. A duplicate appearing by random recombination has no claim to being *you*. Therefore, in the cheap world, *you* did not strike the match. The antecedent is false.

  So, counterpart theory makes consequence (a) **better** for Lewis, not worse. It filters out the cheap duplicates as irrelevant to *your* counterfactuals. The objection only sticks for *de dicto* claims where indexicality doesn't anchor the antecedent to a specific spatiotemporal region. If you want to press this, narrow the scope to *de dicto* counterfactuals or general laws, where the "boondocks" satisfaction is genuinely problematic for similarity ordering.

  ### 2. The Strongest Sympathetic Lewisian Reply
  "The demand for an ontological measure over concrete worlds is a category error. Modal realism provides truthmakers for modal claims, not a sample space for decision theory. When we assign probabilities to 'ways things could be,' we are expressing epistemic credence over qualitative descriptions, not counting concrete tokens. Lewis explicitly distinguishes objective chance (which lives inside worlds, governed by the Best System) from credence over worlds. We are licensed to apply the Principle of Indifference over qualitative types precisely because the concrete duplicates are epistemically inaccessible and practically irrelevant. The concreteness buys you truth conditions for alien properties; the quotienting happens in the epistemology, not the ontology. You aren't finding a missing measure in the warehouse; you're realizing the warehouse wasn't built for weighing."

  ### 3. Is this new?
  You haven't reheated a standard objection so much as welded two known problems together.
  *   **The Measure Problem:** The lack of a natural measure over the plurality is a known issue, often discussed in the context of **Peter Forrest** or **Daniel Nolan**. It's also the exact same structural problem as the **Everettian Quantum Mechanics measure problem** (Deutsch/Wallace), which often leans on Lewis.
  *   **The Duplication Issue:** The worry that concrete duplicates undermine the value of concreteness is a standard **Ersatzer** critique (Plantinga style).
  *   **The Novelty:** Your framing of "Cheap Worlds" via the Principle of Recombination specifically undermining the *similarity metric* is a fresh synthesis. It connects the ontology directly to the semantics in a way that feels under-discussed.

  ### 4. Is the Quotient Proposal dead?
  Yes, but not primarily because of the continuum.
  The continuum point is technically correct (quotienting a continuum leaves a continuum), but measure theory solves that easily (you define a measure over the qualities, e.g., uniform distribution over parameter space).
  The fatal flaw is the **metaphysical concession**. As you note in your second point: if the measure lives over qualitative characters, the *concreteness* of the worlds is doing no work for the applications. If the "weight" of a possibility depends only on its qualitative type, and duplicate concrete worlds add no weight, then the concrete plurality is ontologically idle for the purpose of probability and decision theory. You've saved the applications by admitting that, for those applications, Lewis is an ersatzer. That validates your conclusion: the ledger has to be redone.

  ### 5. Prose Notes
  *   **Anthropics Aside:** Keep it, but trim it. SSC readers will immediately latch onto "cosmology measure stuff," and it signals that this isn't just armchair metaphysics—it has downstream consequences for the rationalist project. Just ensure it doesn't distract from the core modal argument. One clause is enough.
  *   **Warehouse/Catalog:** It's not too cute; it's the strongest image in the piece. It lands the philosophical point (concreteness vs. qualitative type) perfectly. Keep it.
  *   **Word Count:** At ~900 words, it's tight. If you need to cut to accommodate the anthropics clarification, trim the "Quick recap" paragraph. Your audience (SSC lurkers) knows Lewis. You can assume they know "actuality is indexical" and jump straight to Recombination.

  **Final Verdict:** Post it. It's a solid contribution to the "Modal Realism is too expensive for what it buys" literature, and the "Cheap Worlds" terminology is sticky enough to catch on. Just tighten the counterfactual section to acknowledge the *de re*/*de dicto* split so Lewisians don't dismiss you on technicalities immediately.
