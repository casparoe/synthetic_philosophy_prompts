  Two program equilibrium agents meet for a Prisoner's Dilemma.

  Agent A says, "I'm running FairBot. I cooperate iff I can prove you cooperate."
  Agent B says, "I'm running SimBot. I cooperate iff I simulate you and see you cooperate."
  Agent A smiles. "Perfect. By Löb's Theorem, we're logically guaranteed to cooperate."
  Agent B nods. "Great, just let me spin up a VM and execute your source..."
  Agent A panics. "Wait, don't run me! Read my code!"
  Agent B freezes. "Too late. You're trying to run me to check if I'm running you."
  *System Timeout.*
  Referee: "Result: Double Defect."
  Agent A: "But theoretically..."
  Referee: "Theoretically you're both buying the next round."

  ### Why it lands (and where I'm fudging)

  The joke hinges on the clash between Tenenholtz's program equilibrium (reading source) and the halting problem. In pure theory, FairBot cooperates with itself via Löb's Theorem because it searches for proofs, not simulations. Your memory about defecting against itself is a common mix-up: naive simulators crash due to infinite recursion, but provability bots logically cooperate. However, the joke fudges computational complexity. Even if Löb guarantees a proof exists, finding it might exceed real-world timeouts. So while logically they cooperate, computationally they defect. This lands because it highlights the gap between idealized game theory (infinite compute) and actual AI safety constraints (bounded rationality). It also nods to the fragility of implementation: one agent trying to simulate instead of prove breaks the Löb fixed-point, forcing the default defect. It's funny because it's the bug we all expect to write.
