  9.  **Predicting Failure Modes:**

      *   *Giggling/Refusal:* Students might find roleplay cringe. *Mitigation:* Keep it low stakes, emphasize it's a logic puzzle, not acting.
      *   *Moralizing:* "Actually, leaving the centrifuge isn't that bad." *Mitigation:* Stipulate in the prompt that the breach is objectively wrong.
