  10. **Refining the "Third Flavor" (Beneficiary):**

      *   This is tricky. How do they profit? Maybe they got credit for the work done during the unattended time.
      *   *Card Text:* "You didn't break the rule. But because Alex broke the rule, the data was ready for your presentation. You got an A. You know it."

  11. **Final Polish on Debrief:**

