      *   *Rules:* Blamers must state *why* it was wrong. Target/Observer can challenge *standing* only.

  7.  **Timeline (75 Minutes):**

      *   0-10: Setup & Role Assignment (Secret).
      *   10-35: Round 1 (Small Group Dialogue).
      *   35-50: Regroup & Report Out (What happened?).
