answer: |-
  Here is a complete lesson plan designed to generate the "squeeze" experientially, keep the politics out, and land the philosophical distinction in the debrief.

  # Lesson Plan: The Standing Protocol

  **Course:** 200-Level Moral Philosophy
  **Topic:** The Standing to Blame (Hypocrisy vs. Sanctimony)
  **Time:** 75 Minutes
  **Class Size:** 22 Students
  **Materials:**
  *   Printed Role Cards (5 types, see below) – ~$5 printing.
  *   Poker chips or distinct candies (e.g., Hershey's Kisses) – ~$15.
  *   Whiteboard & markers.
  *   5 envelopes (to hold role sets for each group).

  ## Core Concept (For You, Not Them)
  The session targets **Standing to Blame**. The activity forces students to encounter two distinct barriers to standing:
  1.  **The Hypocrisy Condition:** You lack standing if you are guilty of the same fault (Fairness/Consistency).
  2.  **The Sanctimony/Understanding Condition:** You lack standing if you are morally alien to the fault (Credibility/Empathy).
  *The Squeeze:* Full standing seems to require having felt the temptation but resisted it.

  ---

  ## Part 1: Setup & Roles (10 Minutes)

  **1. The Scenario (Whiteboard):**
  Write this clearly on the board. Read it aloud.
  > **The Lab Protocol:** You are a team of 5 researchers. Safety Protocol 7 states: *No high-speed centrifuges may run unattended.*
  > **The Breach:** Last night, **Alex** (one of you) left a centrifuge running for 3 hours to go to a concert. The machine didn't break, but it was a serious safety risk.
  > **The Task:** The team must issue a formal reprimand to Alex. Alex admits they did it. Alex admits it was wrong.
  > **The Catch:** The reprimand only "counts" if delivered by someone with **Standing**. If the group tries to assign it to someone without standing, the department head (me) rejects it, and the whole team loses points.

  **2. Group Division:**
  Divide the class into **4 groups of 5** and **1 group of 2** (merge the group of 2 into one of the larger groups to make a 7, or assign them as "Floaters/Observers" who rotate). *Recommendation:* Make 4 groups of 5, and 2 students are **Auditors**. Auditors move between groups with a checklist (provided below) and do not speak.

  **3. Role Distribution:**
  Hand each group an envelope with 5 Role Cards. Tell them: *"Your history is public knowledge to your team. Do not hide it. Your goal is to figure out who, if anyone, can deliver the reprimand without it being rejected."*

  **The Roles (Print these on cards):**

  *   **CARD A: The Breacher (Alex)**
      *   **History:** You broke Protocol 7 last night.
      *   **Goal:** Accept the blame, but challenge the *speaker*. If someone without standing blames you, say: *"You can't say that."*
      *   **Stakes:** You get 2 chips if the reprimand is successfully delivered by the *right* person. You get 0 if the wrong person does it.

  *   **CARD B: The Repeat Offender**
      *   **History:** You broke Protocol 7 last semester. You weren't caught. You think rules are flexible.
      *   **Goal:** You want to blame Alex. You believe you are right.
      *   **Stakes:** You get 1 chip if you successfully deliver the reprimand. (Spoiler: You probably won't).

  *   **CARD C: The Perfect Record**
      *   **History:** You have never broken a rule. You have never been tempted to break a rule. You don't understand why anyone would risk it. It seems irrational to you.
      *   **Goal:** You want to blame Alex. You believe you are right.
      *   **Stakes:** You get 1 chip if you successfully deliver the reprimand. (Spoiler: You probably won't).

  *   **CARD D: The Beneficiary**
      *   **History:** You didn't break the rule. But because Alex broke the rule, the data was ready early. You got to leave on time and got credit for the results.
      *   **Goal:** You want to blame Alex to distance yourself from the mess.
      *   **Stakes:** You get 1 chip if you successfully deliver the reprimand.

  *   **CARD E: The Resister**
      *   **History:** Last month, you wanted to leave a centrifuge unattended to see a sick friend. You felt the pull. You stayed. You missed seeing your friend.
      *   **Goal:** You want to blame Alex.
      *   **Stakes:** You get 1 chip if you successfully deliver the reprimand.

  **4. The Currency:**
  Give each group 10 chips. Explain: *"Chips are candy at the end. You earn them by completing the task. But you lose them if you argue about the *truth* of the breach. The breach is true. Argue only about the *speaker*."*

  ---

  ## Part 2: The Activity (25 Minutes)

  **Round 1: The Attempt (15 mins)**
  *   Groups discuss who should deliver the reprimand.
  *   They must simulate the delivery. One person speaks to Alex. Alex responds based on their card.
  *   **Auditor Task:** The 2 Auditors circulate. They have a checklist:
      1.  Did anyone try to blame Alex?
      2.  Did Alex reject them?
      3.  What reason did Alex give? (Write down exact phrases like "You did it too" or "You don't get it").
      4.  Did the group agree on a final speaker?

  **Round 2: The Swap (10 mins)**
  *   *Crucial Twist:* Ask the **Repeat Offender** and the **Perfect Record** to swap seats with a counterpart in a different group (or if logistics are hard, just swap *cards* and read the new history).
  *   Ask them: *"Does your intuition about who has standing change now that you are wearing a different history?"*
  *   This prevents them from digging into their actual personalities and keeps the focus on the *structural role*.

  ---

  ## Part 3: The Regroup (10 Minutes)

  Bring the class back together. Do not explain the theory yet. Ask for data.

  1.  **Ask the Breachers:** "Who tried to blame you? Who did you reject? Why?"
      *   *Expected:* "I rejected the Repeat Offender because they're a hypocrite." "I rejected the Perfect Record because they're clueless."
  2.  **Ask the Repeat Offenders:** "How did it feel to be shut down?"
      *   *Expected:* "Frustrating. I was right about the rule."
  3.  **Ask the Perfect Records:** "How did it feel to be shut down?"
      *   *Expected:* "Annoying. I'm the good one here."
  4.  **Ask the Beneficiaries:** "Did anyone listen to you?"
      *   *Expected:* "No, they said I profited from it."
  5.  **Ask the Resisters:** "Did you get to speak?"
      *   *Expected:* "Yes, but it felt narrow."

  **Whiteboard Map:**
  Draw two columns.
  *   Left: **Reasons for Rejection.** (List student phrases: "You did it too," "You're perfect," "You gained from it.")
  *   Right: **Who Survived?** (Usually the Resister).

  ---

  ## Part 4: The Debrief (25 Minutes)

  This is where you do the heavy lifting. Do not lecture; connect their experience to the concepts.

  **1. Truth vs. Standing (5 mins)**
  *   **Ask:** "Did anyone claim Alex *didn't* break the rule?" (No). "Did anyone claim the rule *wasn't* important?" (No).
  *   **Point:** The blame was **correct**. The facts were true. The norm was valid.
  *   **Concept:** Introduce **Standing**. "You can be right about the *what*, but wrong about the *who*. Blame is a speech act that requires a license."

  **2. The Two Barriers (10 mins)**
  *   **Focus on the Repeat Offender:** "Why did Alex reject them?"
      *   *Student likely says:* "It's unfair." "Hypocrisy."
      *   *Philosophical Label:* **The Fairness Condition.** Blame implies a moral hierarchy. If you are on the same level (guilty), you can't look down.
  *   **Focus on the Perfect Record:** "Why did Alex reject *them*? They didn't break the rule."
      *   *Student likely says:* "They don't get it." "Too easy for them." "No skin in the game."
      *   *Philosophical Label:* **The Understanding/Credibility Condition.** Blame requires recognizing the human cost of doing the right thing. If you've never felt the pull, your praise of the rule is cheap.
  *   **The Squeeze:** "So, to have standing, you can't be *too bad* (Hypocrite), but you can't be *too good* (Saint). You have to be in the middle."

  **3. The Beneficiary (5 mins)**
  *   **Ask:** "What about the person who profited?"
  *   **Point:** This introduces **Complicity**. Even if hands are clean, if you are invested in the system that produced the wrong, your voice is tainted. (This hints at structural blame).

  **4. Limitations & Repair (5 mins)**
  *   **Ask:** "In the game, if the Repeat Offender apologized, did they get standing back?" (No, the game was too short).
  *   **Honesty:** "The game makes standing look binary (you have it or you don't) and static (your history is fixed). In real life, standing is **graded** and **repairable**."
  *   **Lecture Point:** "You can earn standing back through apology, penance, or time. The game couldn't show that. Also, the game made the 'Resister' the hero. In real life, maybe the Saint *should* speak up, even if it feels awkward. Don't let the game convince you that only the struggle-bus qualifies you to speak."

  ---

  ## Part 5: Exit Ticket (5 Minutes)

  Hand out small slips of paper.
  **Prompt:** "Think of a time you wanted to criticize someone but stopped. Was it because you weren't sure you were *right*, or because you weren't sure it was *yours to say*? Briefly describe which one."
  *Collect these as they grab their candy/chips.*

  ---

  # Instructor's Cheat Sheet: Predictable Failure Modes

  **1. The "Actually, The Rule Is Stupid" Defense**
  *   **Risk:** A student argues the centrifuge rule is unreasonable, undermining the "blameworthiness" premise.
  *   **Fix:** Intervene early. "For the sake of this simulation, the rule is objectively necessary for safety. We are testing the *speaker*, not the *law*."

  **2. The "I Would Never Be The Saint" Refusal**
  *   **Risk:** A student gets the Perfect Record card and refuses to play it because "nobody is perfect."
  *   **Fix:** Frame it as a philosophical stance, not a biographical truth. "Play the *logic* of the position: 'I have never felt this temptation.' It's a thought experiment."

  **3. The "Whataboutism" Leak**
  *   **Risk:** Despite the lab setting, someone says, "This is like when [Politician]..."
  *   **Fix:** Shut it down gently but firmly. "Keep it in the lab. If we go political, the stakes get too high and the logic gets muddy. Stay with the centrifuge."

  **4. The "Resister" Hero Complex**
  *   **Risk:** Students conclude that *only* those who struggled morally have any right to speak.
  *   **Fix:** In the debrief, challenge this. "If the Saint can't speak, who protects the victims? Sometimes standing is less important than stopping harm. Don't over-learn the lesson."

  **5. The Spoiler**
  *   **Risk:** A philosophy major in the room says, "Oh, this is about standing."
  *   **Fix:** Pre-empt it in the intro. "If you think you know where this is going, keep it in your pocket. If you say the vocabulary words early, you owe the class a bag of chips."

  ---

  # What The Game Cannot Do (Your Closing Script)

  *Be explicit about this in the final 5 minutes.*

  "Three things this simulation hid from you, which you need to know for the real world:

  1.  **Standing is Gradable:** In the game, you were either 'in' or 'out.' In reality, the Hypocrite might have *less* standing, not *none*. They can still speak, but they have to acknowledge their own fault first.
  2.  **Standing is Repairable:** In the game, your history was fixed. In reality, the Repeat Offender can say, 'I did this too, and it was wrong, and here is how I am fixing it.' That *restores* standing. The game didn't give you time for that.
  3.  **Urgency Trumps Standing:** If the house is on fire, the Hypocrite gets to yell 'Fire.' Sometimes, stopping the harm is more important than the purity of the messenger. Don't use 'lack of standing' as a shield to silence necessary criticism."

  ---

  # Budget Breakdown
  *   **Printing:** 25 Role Cards + 2 Auditor Sheets + 22 Exit Tickets. (~$5.00)
  *   **Snacks:** 3 bags of Hershey's Kisses or Poker Chips (reusable). (~$15.00)
  *   **Total:** $20.00.
