  1. Arrange chairs around the long table. Place three facedown decks (A, B, C) at each seat, plus one envelope marked "Final." Distribute pens and four small slips of paper per student. Instruct silence. State rule: Choose a real, minor wrong done to you by someone you still know. Do not share the content. Do not share the name. If the memory feels too heavy, pick a lighter one. Ensure everyone has selected a case before proceeding. Reserve the whiteboard; do not write on it yet. Tell them: "We are testing how information changes your posture toward a person." Keep instructions plain. No theoretical terms. Ensure privacy screens or spacing if possible. Begin timer for 75 minutes.

  2. Slip 1: Write one sentence addressed to them: "You owed me..." Stop there. Do not explain why. Fold it. Turn to your neighbor. Read the sentence aloud. Do not discuss the story. Listen to theirs. Slip 2: Rank three future pieces of information by how much they would make that sentence feel inappropriate: (1) Their action was the inevitable result of prior causes; (2) They didn't know harm would happen; (3) They are incapable of understanding demands. Rank 1 (most defusing) to 3 (least). Place Slip 2 face down. Keep Slip 1 visible. Do not analyze why. Just record the intuition. Wait for signal to draw the first card.

  3. Draw Card A (Causes). Act on Slip 1: Leave it, soften it, or convert to third-person report. Slip 3: Answer Yes/No: Can you still feel gratitude for their good acts? Does this new handling spread to unrelated domains? Is it easier if the wrong targeted a friend? Repeat for Card B (Ignorance) and Card C (Incapacity). Card C instructs: "Handle this person as a case to be managed." Note resistance. If you kept the sentence standing after Card C, mark it. If you lost gratitude after Card A, mark it. Observe the leak between domains. Do not discuss. Collect physical responses. Prepare for the final phase. Keep slips private.

  4. Slip 4: Write the sentence the wrongdoer must say for repair. Address it to you. Fold. Open envelope "Final." Read: "They expressed remorse, but only because you arranged a technique to induce it." Not arrived at themselves. Question: Does the repair count? Yes/No. Circle one. Do not justify. Look at Slip 1. Does the demand stand? Does the repair work? Sit with the tension. If remorse was manufactured, is debt cleared? If the way of holding them was detached, is gratitude possible? Hold answers. Do not speak. Wait.

  5. Use whiteboard. Reveal forbidden terms: Participant Stance, Objective Stance, Reactive Attitudes. Map moments: (1) Slip 1 = Demand inherent in stance. (2) Card A/Gratitude = Point (a): Detachment costs gratitude, not just resentment. (3) Card C/Resistance = Point (b): Domain instability; can you manage a friend? (4) Slip 4/Final Card = Point (c): Remorse requires authentic attitude, not induced behavior. (5) Third-person conversion = Verdict vs. Address. (6) Ranking vs. Reality = Predictions vs. Experience. Ask: "Who kept the sentence after Card C?" "Who lost gratitude after Card A?" Show that the vocabulary carves the joint they just felt. The stance is the relationship, not the metaphysics.

  6. Predictable failures: Students pick trivial wrongs (no sting); Card C feels like insanity (not detachment); Induced remorse feels like coercion (confusing point c). Handling: Insist on "minor but real" sting. Reframe Card C as "medical incapacity" not metaphysics. Clarify induction is psychological, not coercive. Limitation: Point (b) is hardest to establish in 75 mins; domain-leakage is subtle. You will likely have to argue (b) yourself based on their hesitation. Point (a) usually lands if gratitude is pressed. Point (c) lands if induction is clear. Accept that (b) may remain theoretical for some. Save 15 minutes for this argument. Do not rush the board.
