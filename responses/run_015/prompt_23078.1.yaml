          *   *Analysis:* Marco wins on *mechanics*. You can't execute "If Exit 2" without knowing it's Exit 2. Lena wins on *abstraction*. You can pre-commit to a randomization device (e.g., "flip a coin in my head with bias $p$").
      *   **Round 3: The Source of the Paradox.**
          *   Lena: Artifact of framing.
          *   Marco: Genuine feature of self-locating uncertainty.
          *   *Analysis:* It's a feature of *indexical uncertainty*. Marco is closer to the philosophical heart of it.
      *   **The "Missing Fundamental":**
          *   Both are missing the distinction between *Mixed Strategies* (randomize at start) vs. *Behavioral Strategies* (randomize at each node).
          *   Both might be missing the *Updateless Decision Theory* (UDT) perspective which sides with Lena but formalizes it better.
