answer: |-
  # Diagnostic Instrument: The Vagueness Classification Tree

  ## I. Glossary of Terms
  *   **Admissibility:** A precisification (sharpening) of a predicate is *admissible* if it respects the clear cases and linguistic rules.
  *   **Borderline Case:** An object for which the application of a predicate is neither clearly true nor clearly false.
  *   **Epistemicism:** The view that vague predicates have sharp boundaries, but we cannot know where they are.
  *   **Extension:** The set of objects to which a predicate truly applies.
  *   **Glut:** A truth-value status where a proposition is both true and false (paraconsistent).
  *   **Gap:** A truth-value status where a proposition is neither true nor false (paracomplete).
  *   **Higher-Order Vagueness:** Vagueness about the boundary of the borderline cases (e.g., is this case *definitely* borderline?).
  *   **Ontic Indeterminacy:** The claim that the world itself, not just our language, is vague.
  *   **Precisification:** A way of making a vague predicate precise (assigning a sharp extension).
  *   **Sorites Paradox:** An argument using a series of small changes (e.g., removing one grain from a heap) to conclude an absurdity (e.g., one grain is a heap).
  *   **Tolerance Principle:** The premise that a sufficiently small change in a stimulus does not change the truth value of a vague predicate.
  *   **Truth-Functional:** The truth value of a compound sentence is determined solely by the truth values of its parts.

  ---

  ## II. The Decision Tree (8 Nodes)
  *Instructions: Proceed through the nodes. Answer **Yes** or **No** based on your philosophical verdict on the case or claim presented. Follow the path indicated by your answers to reach a Leaf.*

  **Node 1 (The Matched Pair): Ontic Source**
  *Case:* Consider a spatially diffuse cloud. Is the indeterminacy of its boundary located *in the physical object itself* (the cloud has no precise spatial extent), rather than merely in our representation or language?
  *   **Yes:** Go to Leaf A.
  *   **No:** Go to Node 2.

  **Node 2 (The Flurg Case): Sharp Boundary Fact**
  *Case:* Consider "Flurg," a predicate defined by a mathematical cut-off that is provably uncomputable (e.g., based on a Busy Beaver function). There is a fact of the matter about the number, but no finite investigation can locate the boundary. Is there nonetheless a *single, specific number* $n$ such that it is objectively true that $n$ is Flurg and $n+1$ is not?
  *   **Yes:** Go to Leaf B.
  *   **No:** Go to Node 3.

  **Node 3 (Reference Failure): Nihilism**
  *Claim:* Do vague predicates (like "heap" or "bald") fail to refer to any property at all, making all atomic sentences containing them strictly false or truth-valueless?
  *   **Yes:** Go to Leaf C.
  *   **No:** Go to Node 4.

  **Node 4 (The Cooperative Sorting): Context Sensitivity**
  *Case:* Two competent speakers know their thresholds for "heap" differ slightly. They cooperate to sort a series of grain-arrangements into "heap" and "non-heap," producing a shared verdict list. Does the *content* (semantic extension) of the word "heap" shift during the conversation to accommodate their agreement?
  *   **Yes:** Go to Leaf D.
  *   **No:** Go to Node 5.

  **Node 5 (Truth-Value Gaps): Supervaluation**
  *Claim:* Are there sentences involving vague predicates that are neither true nor false (gaps), yet logical tautologies (e.g., $P \lor \neg P$) remain true?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 6 (Higher-Order Vagueness): Supervaluation Variant**
  *Claim:* Is the boundary between the "definitely true" cases and the "borderline" cases itself sharp (i.e., is it determinate which cases are borderline)?
  *   **Yes (Sharp Boundary of Borderlines):** Go to Leaf E (Local Supervaluationism).
  *   **No (Vague Boundary of Borderlines):** Go to Leaf F (Global Supervaluationism).

  **Node 7 (Truth-Value Gluts vs. Degrees): Subvaluation or Fuzzy**
  *Claim:* Can a sentence be both true and false (a glut), or must truth come in degrees (values between 0 and 1)?
  *   **Yes (Gluts/Both):** Go to Leaf G.
  *   **Yes (Degrees):** Go to Leaf H.
  *   **No (Neither):** *Incoherent Path* (See Diagnostic Analysis).

  ---

  ## III. Scoring Key & Leaf Definitions

  | Leaf | Position | Definition |
  | :--- | :--- | :--- |
  | **A** | **Ontic Indeterminacy** | Vagueness is a feature of reality, not language. Objects lack precise identity conditions. |
  | **B** | **Epistemicism** | Vague predicates have sharp extensions; ignorance is purely epistemic (we cannot know the cut-off). |
  | **C** | **Nihilism (Error Theory)** | Vague predicates do not successfully refer; vague sentences lack truth conditions. |
  | **D** | **Contextualism** | The extension of vague predicates shifts with conversational context (scorekeeping). |
  | **E** | **Local Supervaluationism** | Truth is truth on *some* admissible precisification; validates local conditionals but not global deduction. |
  | **F** | **Global Supervaluationism** | Truth is truth on *all* admissible precisifications; preserves classical logic but admits truth-value gaps. |
  | **G** | **Subvaluationism** | Truth is truth on *some* precisification (paraconsistent); allows true contradictions (gluts). |
  | **H** | **Degree Theory (Fuzzy)** | Truth is a matter of degree (0 to 1); classical logic is replaced by many-valued logic. |

  ---

  ## IV. Diagnostic Analysis

  ### 1. Empty Cells (Permitted but Unoccupied Paths)
  *   **Node 5 (No) + Node 7 (No):** This path asserts no gaps, no gluts, no degrees, and no context sensitivity, yet denies sharp boundaries (Node 2).
      *   *Diagnosis:* **Incoherent.** If there are no gaps, gluts, degrees, or context shifts, and no sharp boundary, there is no semantic machinery left to account for the transition from true to false. This combination violates the Law of Excluded Middle without providing an alternative semantics.
  *   **Node 2 (Yes) + Node 5 (Yes):** Asserts a sharp boundary exists (Epistemicism) but also that truth-value gaps exist.
      *   *Diagnosis:* **Unattractive/Redundant.** Epistemicism typically explains ignorance via complexity, not gaps. A "Gap-Epistemicism" is logically possible (the boundary exists but sentences about it are gappy) but no major position occupies this cell.
  *   **Node 6 (Yes) + Node 2 (No):** Asserts the boundary of borderlines is sharp, but the first-order boundary is not.
      *   *Diagnosis:* **Unexplored.** This is a specific form of higher-order vagueness denial. Some supervaluationists might occupy this, but it is often collapsed into Leaf E or F depending on the definition of "definiteness."

  ### 2. Unseparated Leaves (Residual Ambiguities)
  *   **Leaf E (Local) vs. Leaf F (Global) Supervaluationism:**
      *   *Status:* **Substantive but Technical.** The split rests on the definition of logical validity (preservation of truth in all models vs. truth in each model).
      *   *Verdict:* The instrument separates them at Node 6, but this relies on the student's verdict on higher-order vagueness. If a student is unsure about the "sharpness of the borderline boundary," these leaves remain conflated. The difference is substantive regarding the Deduction Theorem.
  *   **Leaf D (Contextualism) vs. Leaf B (Epistemicism) on Cooperative Sorting:**
      *   *Status:* **Merely Verbal/Pragmatic.** An Epistemicist can explain Node 4 (Cooperative Sorting) as a pragmatic shift in *assertibility* conditions rather than semantic *content*.
      *   *Verdict:* The instrument assumes a semantic shift for Contextualism. If the student interprets "content" loosely to include pragmatic norms, Epistemicism could map here. The separation holds only if "content" is strictly truth-conditional.
  *   **Leaf G (Subvaluationism) vs. Leaf H (Degree Theory):**
      *   *Status:* **Substantive.** Node 7 forces a choice between Gluts and Degrees. However, some Degree Theorists (e.g., Edgington) reject truth-functionality, making them behave like Supervaluationists in practice.
      *   *Verdict:* The instrument classifies non-truth-functional degree theorists under Leaf H, but they may share logical consequences with Leaf F.

  ---

  ## V. Epistemic Status & Critique of Assumptions

  ### Epistemic Status of Instrument Steps
  *   **Settled (Follows from definitions):**
      *   **Node 1 (Ontic):** Separates metaphysical vagueness from semantic vagueness.
      *   **Node 2 (Flurg):** The definitive test for Epistemicism. If you affirm a sharp cut-off exists despite uncomputability, you are an Epistemicist.
      *   **Node 3 (Nihilism):** A binary check on reference success.
  *   **Contested (Live Disagreement):**
      *   **Node 4 (Cooperative Sorting):** *Contested.* Contextualists claim this proves content shift. Invariantists (Epistemicists/Supervaluationists) claim this proves only pragmatic accommodation. The mapping assumes the Contextualist interpretation is the only one that answers "Yes."
      *   **Node 6 (Higher-Order):** *Contested.* Whether supervaluationism can accommodate vague higher-order boundaries without collapsing into inconsistency is a live technical debate (the "problem of higher-order vagueness").
      *   **Node 7 (Gluts vs. Degrees):** *Contested.* Some paraconsistent views mimic degree theory structurally. The distinction is clear in principle (contradiction vs. intermediate value) but sometimes blurred in formal implementation.

  ### Critique of User Assumptions

  1.  **Assumption:** *Subvaluationism blocks Sorites by giving up Modus Ponens.*
      *   **Correction:** **Incorrect/Imprecise.** Subvaluationism (paraconsistent approach) typically *preserves* Modus Ponens. It blocks the Sorites *reductio* by rejecting *Ex Falso Quodlibet* (Explosion) or by accepting the conclusion as a true contradiction (glut). The argument goes through, but the contradiction is tolerated. The instrument corrects this at Node 7 by focusing on the acceptance of Gluts rather than the failure of MP.
  2.  **Assumption:** *Supervaluationism vs. Epistemicism on Sharp Boundaries.*
      *   **Verdict:** **Correct.** This is the primary load-bearing branch. Epistemicism affirms a fact of the matter (Node 2 = Yes); Supervaluationism denies it (Node 2 = No, there is no single admissible precisification that is *the* extension). The instrument captures this cleanly at Node 2.
  3.  **Assumption:** *Cooperative Sorting separates Content from Truth.*
      *   **Verdict:** **Partially Correct.** It separates Contextualism (Content shifts) from Invariantism (Truth conditions fixed). However, as noted in the Unseparated Leaves, an Invariantist can explain the data via pragmatics. The node separates *Semantic Contextualism* from *Semantic Invariantism*, but cannot rule out *Pragmatic Invariantism* without further questioning on the semantics/pragmatics interface.
  4.  **Assumption:** *Load-bearing branches (Extension, Slack Type, Higher-Order, Sorites).*
      *   **Verdict:** **Sound.** These are the correct logical joints. The instrument reorders them slightly to prioritize Ontology (Node 1) and Reference (Node 3) before Semantic Mechanics (Node 5-7), as ontological commitments usually constrain semantic options.

  ### Justification for Added Leaves
  *   **Nihilism (Leaf C):** Added because it represents a fundamental rejection of the presupposition that vague predicates refer. It is the "exit" option from the semantic debate.
  *   **Local vs. Global Supervaluationism (Leaf E vs. F):** Added as a split within Supervaluationism because they validate different inference rules (Conditional Proof vs. Deduction Theorem). While technically nuanced, they occupy distinct logical spaces regarding consequence, satisfying the requirement to split only if they genuinely occupy different cells.
