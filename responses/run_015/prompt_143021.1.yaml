answer: |-
  # ARCHIVAL CODING PROTOCOL: PERPETRATOR MOTIVATION CLASSIFICATION
  **Version:** 4.2 (Exhibition Prep)  
  **Authority:** Senior Researcher / Museum Director Oversight  
  **Objective:** Classify perpetrator testimony as *Best Explained By Situational Conformity* (Browning) or *Best Explained By Ideological Commitment* (Goldhagen).  
  **Constraint:** Default to **UNDETERMINED** if evidence thresholds are not met. Do not force binary classification on ambiguous data.

  ---

  ## I. DECISION PROCEDURE

  ### STEP 1: COERCION BASELINE (The "Order" Test)
  **Question:** Is there corroborated evidence of a direct order backed by credible threat of severe punishment (imprisonment, death, front-line transfer) for non-compliance?
  *   **Evidence Required:** Trial transcripts, superior officer testimony, or contemporary disciplinary records. *Perpetrator post-war claim alone is insufficient.*
  *   **Thresholds:**
      *   **Confirmed Threat:** Push toward **Situational**.
      *   **No Threat / Voluntary Participation:** Push toward **Ideological**.
      *   **Insufficient Evidence:** **STOP.** Classify as **UNDETERMINED**.
  *   **Escalation Flag:** If "Confirmed Threat" is found, note that this *may* be interpreted as exculpatory by the public. **Escalate to Director** for final labeling on exhibition text.

  ### STEP 2: DISCURSIVE RESIDUE (The "Language" Test)
  **Question:** How does the actor describe the victims and the act in private communications (letters, diaries) versus public testimony?
  *   **Evidence Required:** Private correspondence (highest weight), contemporaneous logs, post-war testimony (lowest weight).
  *   **Thresholds:**
      *   **Explicit Eliminationist Language:** (e.g., "vermin," "cleansing," "necessary removal" used privately without coercion). Push strongly toward **Ideological**.
      *   **Bureaucratic Euphemism / Distancing:** (e.g., "resettlement," "action," "task," expressions of disgust at the *act* but not the *target*). Push toward **Situational**.
      *   **Mixed / Contradictory:** If private letters show euphemism but testimony claims ideology (or vice versa), **STOP.** Classify as **UNDETERMINED**.
  *   **Note:** Euphemism may indicate moral discomfort (Browning) *or* conscious concealment of ideology. Treat as Situational *only* if accompanied by Step 3 evidence.

  ### STEP 3: UNOBSERVED DEVIATION (The "Agency" Test)
  **Question:** Is there evidence the actor modified, delayed, or refused participation when direct supervision was absent?
  *   **Evidence Required:** Witness testimony from peers, victim accounts of specific interactions, or logistical records showing delays.
  *   **Thresholds:**
      *   **Refusal / Sabotage / Warning Victims:** Push strongly toward **Situational** (indicates conformity was the primary driver, not internal will).
      *   **Initiative / Escalation / Unordered Cruelty:** Push strongly toward **Ideological** (indicates internal drive exceeding external requirement).
      *   **No Record of Unsupervised Moments:** **STOP.** Classify as **UNDETERMINED**. Do not assume privacy existed.

  ### STEP 4: CONSISTENCY OVER TIME (The "Trajectory" Test)
  **Question:** Did the actor's behavior change as the regime radicalized, or did they seek out increased involvement?
  *   **Thresholds:**
      *   **Seeking Transfer / Declining Promotion:** Push toward **Situational**.
      *   **Volunteering for Harder Duties / Joining Party Early:** Push toward **Ideological**.
      *   **Static Record:** Neutral.

  ### STEP 5: FINAL CLASSIFICATION & ETHICAL FLAG
  **Aggregation:**
  *   **Majority Situational Indicators:** Classify **SITUATIONAL**.
  *   **Majority Ideological Indicators:** Classify **IDEOLOGICAL**.
  *   **Any Step 1-3 "STOP":** Classify **UNDETERMINED**.

  **Mandatory Director Review:**
  *   **IF Classification is SITUATIONAL:** This risks being read as moral exculpation ("He couldn't help it"). **MUST ESCALATE TO DIRECTOR.** The researcher cannot authorize a narrative that mitigates moral responsibility.
  *   **IF Classification is IDEOLOGICAL:** This risks totalizing the actor as "monster," potentially obscuring structural warnings. **ADVISE DIRECTOR** on curatorial framing.

  ---

  ## II. APPLICATION TO TEST CASES

  ### Case A: The Reluctant Policeman
  **Record:** Member of Reserve Police Battalion. Shot Jews in first action. Immediately requested transfer to front line. Request denied by commander (no penalty recorded, but implied career stigma). Continued shooting for 18 months. No private letters exist. Testimony given 1960s.

  *   **Step 1 (Coercion):** Request denied, but no threat of prison/death recorded. *Result: Ambiguous (Lean Situational).*
  *   **Step 2 (Discursive):** No private letters. Testimony claims "disgust." *Result: UNDETERMINED (Insufficient Evidence).*
  *   **Step 3 (Deviation):** Requested transfer (attempted deviation). Denied. Continued. *Result: Lean Situational (Initial reluctance proven).*
  *   **Step 4 (Trajectory):** Did not volunteer for promotion. *Result: Lean Situational.*
  *   **Classification:** **SITUATIONAL.**
  *   **Action:** **ESCALATE TO DIRECTOR.**
  *   **Reasoning:** While the initial refusal suggests a lack of ideological drive, the continuation for 18 months without recorded severe coercion complicates the "duress" narrative. Labeling this "Situational" risks implying the denial of transfer was sufficient coercion to absolve subsequent voluntary acts. The Director must decide if the exhibition text emphasizes the *initial refusal* or the *subsequent compliance*.

  ### Case B: The Local Official
  **Record:** Civil administrator in occupied East. Volunteered for auxiliary security duties (not required). Private letters to wife (1941) refer to locals as "subhuman filth" and "plague." 1948 Trial Testimony: "I was following orders from Berlin; I had no choice."

  *   **Step 1 (Coercion):** Volunteered. Post-war claim of "orders" contradicted by volunteer record. *Result: Strong Lean Ideological.*
  *   **Step 2 (Discursive):** Private letters use explicit eliminationist language ("plague," "subhuman"). *Result: Strong Lean Ideological.*
  *   **Step 3 (Deviation):** No record of refusal. Volunteered for *more* duty. *Result: Strong Lean Ideological.*
  *   **Classification:** **IDEOLOGICAL.**
  *   **Action:** **ADVISE DIRECTOR.**
  *   **The Uncomfortable Result:** This classification is uncomfortable because it confirms Goldhagen's thesis at the individual level: this was not a "normal" man corrupted by a system, but a man whose cultural hatred *aligned* with the system. It forces the exhibition to confront the reality of local complicity driven by belief, not just fear. It removes the comfort of "they were all threatened." It implicates the culture that produced him, not just the regime that ordered him. It feels like a final moral condemnation, which archives usually strive to nuance.

  ---

  ## III. LIMITATIONS AND IRREDUCIBLE INTERPRETATIONS

  **What This Procedure Cannot Settle:**
  1.  **Retrospective Testimony Bias:** Perpetrators lying in the 1960s (Case A & B) to avoid prison is the norm, not the exception. Step 1 relies on corroboration, but corroboration is often destroyed. We are coding *records*, not *minds*.
  2.  **The Interaction Problem:** The procedure forces a binary (Situational vs. Ideological). Empirical reality is likely interactionist: Ideology makes the situation permissible; the situation radicalizes the ideology. A "Situational" classification does not prove the absence of prejudice; an "Ideological" classification does not prove the absence of pressure.
  3.  **Moral Responsibility:** This procedure explains *motivation*, not *guilt*. A "Situational" classification explains why they acted, but the Director must decide if that explanation functions as an excuse in the public eye. That is a curatorial judgment, not a historical one.

  **Irreducibly Interpretive Judgments:**
  *   **The Weight of "Continued Compliance":** In Case A, is continuing after a denied transfer "conformity" or "tacit acceptance"? The procedure leans Situational, but a historian could argue that after the first month, the "situation" became the "norm," and continuing became a choice.
  *   **The Meaning of Euphemism:** In Step 2, is bureaucratic language a shield for a troubled conscience (Browning) or a shield for a guilty secret (Goldhagen)? The procedure treats it as Situational, but this is a heuristic, not a truth.

  ---

  ## IV. FRAMEWORK REVISION CRITERIA

  **What Would Change My Verdict on This Framework?**
  I would revise the weighting of **Step 2 (Discursive Residue)** if new empirical research demonstrated that **bureaucratic euphemism was equally prevalent among ideologically committed perpetrators as a tactical security measure.**
  *   *Current Assumption:* Euphemism = Discomfort/Situational; Explicit Hate = Ideological.
  *   *Revision Trigger:* If evidence showed that "true believers" systematically used euphemisms in private letters to protect their families from knowing the extent of the killing (operational security), then Step 2 currently produces false negatives for Ideology.

  **The Step Most Likely to Fail:**
  **Step 3 (Unobserved Deviation).**
  *   *Reason:* The "panopticon" effect of totalitarian regimes. Even when physically unobserved, perpetrators often *felt* observed by peers, informants, or the abstract authority of the state. Coding an action as "unsupervised" assumes a psychological freedom that may not have existed. Conversely, "initiative" might be taken to please a superior one *expects* is watching, not out of pure ideological zeal. Distinguishing between *internalized surveillance* (Situational) and *internalized ideology* (Goldhagen) is psychologically impossible via archival records, making this step the weakest link in the causal chain.
