answer: |-
  1. **The Fideism Distinction**
     Standard fideism argues that religious belief is immune to rational critique because it occupies a separate sphere from reason. Your "orientational grammar" view says belief organizes a form of life rather than stating facts. But doesn't organizing a form of life still invite critique on whether that organization is coherent, sustainable, or harmful? Where exactly do you draw the line between protecting belief from empirical falsification and protecting it from *any* external critique?
     * **Follow-up (if she argues that critique must be internal to the practice):** If critique is only valid from within the form of life, how do you avoid the conclusion that a perfectly coherent cult has just as valid a "grammar" as a mainstream religion, provided both maintain their internal practices without breakdown?

  2. **Concrete Grammatical Breakdown**
     You mention "grammatical breakdown" as the moment belief becomes genuinely problematic. Can you give me a concrete historical or contemporary example of this? I'm worried this sounds too much like "people stopped going to church," which is sociological, not grammatical. What does it look like when the *grammar* fails rather than just the attendance drops or enthusiasm wanes?
     * **Follow-up (if she says breakdown is when the rules lose their grip on participants):** How do you distinguish that from ordinary doctrinal disagreement? Heretics often claim the orthodoxy has lost the grammar, while the orthodoxy says the same about them. Who decides when breakdown occurs, or is it purely retrospective?

  3. **The Status of Rationality**
     If religious statements aren't empirical hypotheses but aren't just expressions of feeling either, what is their rational status? Are they rational, arational, or are you proposing a category we don't have a word for yet? Because if they aren't subject to evidence, calling them "rational" seems to stretch the word until it breaks.
     * **Follow-up (if she says it's a *sui generis* category distinct from standard rationality):** Doesn't that just insulate religious commitment from being wrong? If there's no standard by which an orientation can be mistaken, isn't this just non-cognitivism with extra steps?

  4. **The Historical Fact Claim**
     Many believers insist they are describing actual historical facts—like the physical resurrection—not just orienting themselves. On your view, treating a grammatical rule as an empirical hypothesis looks like a confusion. Does your reading imply that ordinary believers are systematically confused about what they're doing when they say "Jesus rose from the dead," or can the grammar accommodate the believer's own self-understanding of making truth claims?

  5. **Wittgenstein's Personal Sympathies**
     There's a persistent debate about whether Wittgenstein was a crypto-Christian who wanted to protect belief, or a purely descriptive therapist of language. Does your "orientational" reading depend on Wittgenstein having personal religious sympathies, or does this structure work even if he was completely indifferent to faith himself? Is his biography central to the validity of the view, or basically irrelevant?

  6. **Doctrinal Change Without Collapse**
     I'm struggling with how this handles doctrinal shifts. People change their minds on specific doctrines—say, hellfire or creationism—without their whole form of life collapsing. If belief is an orientational commitment, why doesn't changing a doctrinal mind count as a grammatical breakdown? Where do you locate the flexibility within the orientation that allows for revision without collapse?

  7. **Outsider Critique**
     If religious language games are self-contained forms of life, can an outsider ever legitimately critique them? Or does your view imply that secular critique is just someone playing a different game shouting across a void? If I say a religious practice is harmful, am I making a grammatical error on your account?

  8. **The Role of Doubt**
     Wittgenstein says doubt requires grounds. In your orientational view, where does legitimate doubt live? Is it only when the orientation stops working for the believer pragmatically, or can there be intellectual doubt that doesn't threaten the practice? Can you doubt the orientation itself, or only doubts within it?

  9. **Truth vs. Usability**
     If religious statements aren't true in the correspondence sense, what kind of truth claim are they making? Can a religious statement be "false" on your account, or only "unusable"? If a believer says "God loves me" and then suffers a tragedy that makes them feel unloved, has the statement become false, or has the grammar shifted?

  10. **Ethics vs. Religion**
      You say religious statements organize a form of life. But secular ethical commitments do that too. What makes the religious grammar distinct on your view? Is it just the vocabulary of gods and spirits, or is there a structural difference between a moral orientation and a religious one? Can you have a religious form of life without the supernatural grammar?
