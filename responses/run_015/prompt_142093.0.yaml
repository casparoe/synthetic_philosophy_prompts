      *   *Dennett's Distinction:* Skyhooks are miracles (god, soul, irreducible qualia). Cranes are natural selection, physics, etc.
      *   *The Error:* Greedy Reductionism. Just because everything *is* physical doesn't mean the best *explanation* is physical. Psychology explains behavior better than neurochemistry in most contexts.
      *   *The Satire:* Bureaucracy fetishizes the *bottom* of the crane chain rather than the *integrity* of the chain. They think "lower = better explanation," which is exactly what Dennett warns against (though he warns against skyhooks, he also warns against greedy reductionism).
      *   *The Office's Skyhook:* They need to ground their own authority. If they demand infinite chains, where does their authority come from? If it comes from the NRC, where does the NRC's come from? They must posit a "Brute Fact" or "Administrative Reality" that functions as a skyhook.

