      *   **Format:** Internal annual report (approx. 700 words). Deadpan bureaucratic voice, headings, table, footnotes.
      *   **Core Philosophical Point:** The office has slid from "no skyhooks" to mandating *greedy reductionism*. They confuse "no unexplained explainers" with "explain everything at the lowest possible level." (e.g., deriving Romeo's love from quarks is bad science, even if quarks are the base reality).
      *   **Required Elements:**
