          *   *Nature:* Epistemic/Cybernetic (before cybernetics was named). Focus on *utilization* of knowledge, not just possession.
          *   *Key Concept:* "Knowledge" means local, contextual, often tacit knowledge of time and place.
      *   **Lange (1936-37, "On the Economic Theory of Socialism"):**
          *   *Core Argument:* A Central Planning Board (CPB) can simulate the market. Set prices, observe surpluses/shortages, adjust prices (trial and error). Managers follow rules (minimize cost, equate marginal cost to price).
          *   *Nature:* Neoclassical/Walrasian. Treats the economy as a system of equations solvable via iteration.
