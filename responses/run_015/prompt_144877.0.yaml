answer: |-
  Your engineering intuition is not merely an imported framework; it is a diagnostic tool that reveals the structural core of the Socialist Calculation Debate (SCD) more clearly than much of the subsequent economic commentary. The participants were indeed grappling with problems of information topology, signal processing, and control theory, but they lacked the mathematical vocabulary to formalize these constraints.

  Here is a diagnosis of the disagreement, grounded in the primary texts of the 1920s–1940s, distinguishing between verbal confusion, substantive epistemic claims, and the hidden formal questions your background illuminates.

  ### 1. The Verbal Disagreement: Definitions of "Calculation" and "Knowledge"

  A significant portion of the stalemate is verbal. The participants used the same terms to denote distinct technical operations.

  **Mises on "Calculation":**
  In *Economic Calculation in the Socialist Commonwealth* (1920), Mises defines calculation not as mathematical computation, but as **valuation via a common denominator**. He argues that without private property in the means of production, there is no exchange of capital goods. Without exchange, there are no money prices. Without money prices, there is no common unit to compare inputs and outputs.
  *   **The Claim:** Rational allocation requires comparing heterogeneous goods (steel, labor, coal) via a homogeneous unit (money prices derived from real exchange).
  *   **The Engineering Parallel:** This is not a data compression problem; it is a **unit normalization** problem. Mises argues the central board lacks the "voltage reference" against which to measure potential differences.

  **Lange on "Calculation":**
  In *On the Economic Theory of Socialism* (1936–37), Lange defines calculation as **solving a system of simultaneous equations**. He accepts the Walrasian general equilibrium framework. He argues a Central Planning Board (CPB) can set prices parametrically, observe surpluses or shortages, and adjust prices via trial and error (tâtonnement).
  *   **The Claim:** The market is essentially a computational device for solving equations; a computer (or planning board) can replicate this function.
  *   **The Engineering Parallel:** Lange treats the economy as a **linear control system** where the CPB is the controller and the prices are the control variables. He assumes the system is stable and convergent.

  **Hayek on "Knowledge":**
  In *The Use of Knowledge in Society* (1945), Hayek shifts the ground from calculation to **coordination**. He distinguishes between "scientific knowledge" (objective, aggregable) and "knowledge of the particular circumstances of time and place" (tacit, dispersed).
  *   **The Claim:** The data required for planning is not merely vast; it is inherently local and often non-codifiable. It exists only in the minds of actors at the moment of decision.
  *   **The Engineering Parallel:** Hayek argues the data is **distributed sensor data** that cannot be transmitted to a central node without loss of fidelity or latency that renders it obsolete.

  **Diagnosis:** Mises and Lange were talking past each other regarding the *nature* of prices (valuation unit vs. equilibrium parameter). Hayek and Lange were talking past each other regarding the *nature* of data (tacit signal vs. codifiable statistic).

  ### 2. The Substantive Epistemic Disagreement

  Once definitions are clarified, a substantive epistemic disagreement remains, primarily between Hayek and Lange.

  **The Compressibility Hypothesis:**
  Lange assumes economic information is **centrally compressible**. He believes local conditions (costs, preferences) can be aggregated into statistical reports sent to the CPB.
  Hayek argues economic information is **irreducibly distributed**. The "knowledge" is not just the fact that "inventory is low," but the contextual understanding of *why* it is low and *what* specific substitution is possible locally.

  **The Latency and Stability Problem:**
  Lange's model relies on a feedback loop: CPB sets price $\rightarrow$ Managers report quantity $\rightarrow$ CPB adjusts price.
  Hayek implicitly identifies a **latency instability**. By the time local data is aggregated, transmitted, processed, and returned as a price signal, the local conditions have changed. In control theory terms, Lange proposes a centralized feedback loop with a long delay time relative to the system's dynamics. Hayek argues that distributed feedback loops (local managers reacting immediately to local conditions) offer superior stability and adaptation speed.

  ### 3. The Concealed Formal Question

  You are correct that there is a hidden formal question the participants could not articulate due to the limitations of 1930s mathematics. They were debating **computational complexity and information topology** without the language of computer science or information theory (Shannon's *A Mathematical Theory of Communication* was not published until 1948).

  **1. Computational Complexity:**
  Lange assumes the equilibrium equations are solvable within a relevant timeframe. Modern complexity theory suggests that general equilibrium problems may be **NP-hard**. If the economy is a non-linear dynamic system, the computational resources required to solve the equations centrally may exceed the resources available in the universe, whereas the decentralized market solves it via parallel processing (millions of agents computing simultaneously).
  *   **Formal Progress:** A proof regarding the computational complexity class of general equilibrium allocation under varying constraints of information availability.

  **2. Information Topology (Field vs. Vector):**
  Lange treats the economy as a **state vector** (a list of variables $x_1, x_2... x_n$). Hayek treats it as a **field** (values defined continuously over space and time, accessible only locally).
  *   **Formal Progress:** Modeling the economy as a distributed sensor network. The question is whether the "signal-to-noise" ratio degrades irrecoverably when local signals are aggregated to a central node.

  **3. Incentive Compatibility (Mechanism Design):**
  Mises touched on this, but it was not formalized. Lange assumes managers will follow the rules (minimize cost, equate marginal cost to price). However, without private property, there is no residual claimant.
  *   **Formal Progress:** This was later addressed by **Mechanism Design Theory** (Hurwicz, Maskin, Myrin). The formal question is: Can a mechanism be constructed where truth-telling and rule-following are the dominant strategies for agents without private ownership? The Gibbard-Satterthwaite theorem and related results suggest severe limitations here.

  ### 4. Validity of the Engineering Analogy

  Your analogy to distributed measurement systems and feedback control **genuinely illuminates the debate**. It is not irrelevant.

  *   **Lange's Model:** A centralized control system with a single processor and delayed feedback. In engineering, this is prone to oscillation and instability if the delay exceeds the system's time constant.
  *   **Hayek's Model:** A distributed control system (multi-agent). Local controllers act on local sensor data. This architecture is robust to latency but requires standardization of protocols (prices) to ensure subsystems don't work at cross-purposes.
  *   **Mises's Constraint:** Mises adds a constraint that engineering systems usually take for granted: **Energy/Responsibility Coupling**. In a physical system, a sensor reading triggers an actuator. In Mises's view, without property rights, the "actuator" (the manager) is decoupled from the "energy cost" (financial loss). The feedback loop is electrically open; the signal exists, but the power to act on it rationally is disconnected.

  The analogy breaks down only if one assumes economic agents behave like passive resistors or obedient servos. Economic agents are active, strategic, and capable of gaming the measurement system itself (Goodhart's Law), which adds a layer of complexity absent in most physical control systems.

  ### 5. What Would Constitute Progress?

  To move beyond the stalemate using your technical lens, progress would require three specific developments:

  1.  **Agent-Based Modeling (ABM):** Instead of solving equations, simulate millions of autonomous agents with local information and limited rationality. Test whether a Lange-style central price-adjustment algorithm converges faster or more accurately than a Hayek-style decentralized price-discovery process under conditions of shock and latency.
  2.  **Information-Theoretic Bounds:** Apply Shannon entropy to economic data. Determine the minimum bandwidth required to transmit the "state" of an economy to a central planner without losing the information necessary for allocation. If the bandwidth required exceeds physical limits, Hayek wins on formal grounds.
  3.  **Incentive-Compatible Mechanism Design:** Formalize Mises's insight. Prove whether a pricing mechanism can remain efficient when the agents setting the prices do not bear the risk of the prices being wrong.

  ### Summary Diagnosis

  The debate was a **hybrid disagreement**:
  1.  **Verbal:** Mises (valuation) vs. Lange (equilibrium computation).
  2.  **Epistemic:** Lange (data is aggregable) vs. Hayek (data is tacit/distributed).
  3.  **Formal (Unarticulated):** Lange (linear, stable, centralized control) vs. Hayek (non-linear, distributed, parallel processing).

  Your physics background allows you to see that Lange and Hayek were proposing different **architectures of computation**. Lange proposed a mainframe; Hayek proposed a neural network. Mises argued that without property rights, the circuit is broken regardless of the architecture. The stalemate persisted because they lacked the complexity theory and information science to quantify the efficiency losses of centralization versus the incentive losses of socialism. The debate is now best understood not as politics, but as a problem in **distributed information processing under incentive constraints.**
