prompt: |-
  Having spent three decades as a research physicist working on distributed measurement systems and feedback control, I have recently begun studying philosophy of economics, and I find myself stalled on a debate whose structure seems to parallel technical problems I once encountered. In the socialist calculation debate, Ludwig von Mises argued that rational economic allocation is impossible without private property and market prices; Friedrich Hayek added that central planners cannot access dispersed, local knowledge; and Oskar Lange responded with a competitive trial-and-error pricing mechanism guided by central boards using formal equations. By the mid-twentieth century the exchange seemed to end in stalemate, yet I cannot determine whether the participants were genuinely disagreeing about a formal feature of information processing or whether they were answering different questions under the same label.

  From an engineering perspective, the dispute looks as though it might concern whether economic information is centrally compressible—treatable as a state vector that can be updated by a planning board—or whether it is irreducibly distributed, like field measurements that must be read locally. Mises and Hayek appear to treat prices as signals carrying tacit, context-dependent data that resist aggregation, while Lange treats them as adjustable parameters in a computable equilibrium system. If this framing is correct, the impasse may not be verbal in a simple sense; rather, neither side may have possessed the conceptual apparatus to formalize information latency, feedback-loop stability, or the scaling properties of distributed computation, all of which would determine whether Lange's mechanism could converge faster or more reliably than decentralized markets.

  But I remain uncertain about the diagnosis. Is the core disagreement epistemic—about whether local knowledge can in principle be transmitted to a center—or normative—about whether planning is desirable regardless of epistemic limits? Is there a hidden empirical question about computational complexity that could be addressed with modern formal models? Or are Mises, Hayek, and Lange actually pursuing distinct projects: Mises investigating incentives under abolished property rights, Hayek examining the limits of explicit representation, and Lange testing the logical consistency of socialist equilibrium computation?

  Please diagnose the structure of this disagreement, grounding your analysis in what each side actually says rather than in later interpretations. If the disagreement is verbal, distinguish precisely the meanings of calculation and knowledge that are being conflated. If it is substantive, identify what kind of evidence or formal result would constitute progress—perhaps a proof about convergence rates, an empirical study of information flow, or a normative clarification of efficiency criteria. And if there is a concealed formal question—say, whether economic information behaves analogously to a continuous field or to a discrete digital signal—that the participants could not articulate with the mathematics available in the 1930s and 1940s, please say so explicitly. I also ask whether my analogy to distributed sensor networks and feedback control genuinely illuminates the debate or merely imports an irrelevant scientific framework.

  Please provide the answer in American English.
