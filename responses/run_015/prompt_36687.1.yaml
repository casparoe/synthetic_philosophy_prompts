answer: |-
  **MEMORANDUM**

  **TO:** Standards Desk / Copy Editors
  **FROM:** [Your Name], Science & Ideas
  **SUBJECT:** Decision Procedure for Derogatory Language (The "Slur Protocol")
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  This document provides a fifteen-minute decision procedure for handling slurs in copy. It is built on current linguistic and philosophical consensus regarding how derogatory content functions in language. Specifically, it accounts for the fact that slurs differ from ordinary pejoratives (like "damn" or "jerk"): slurs retain their offensive force ("project") even when negated, quoted, or embedded in reports.

  This protocol is not a moral treatise. It is a risk-assessment tool. It distinguishes between **linguistic necessity** (does the word need to be here for the sentence to mean what we intend?) and **editorial justification** (is the harm of printing it outweighed by the public value?).

  ### 2. The Decision Procedure (5 Steps)
  *Time limit: 15 minutes. If the file is not resolved after Step 5, it must be escalated to the Editor-in-Chief or Standards Board.*

  **Step 1: The Use/Mention Test**
  *   **Question:** Is the word being *used* to refer to a person/group, or *mentioned* as an object of study?
      *   *Use:* "He is a [slur]." / "They went to the [slur] neighborhood."
      *   *Mention:* "The word [slur] appears in the transcript." / "Participants were shown the word [slur]."
  *   **Rule:**
      *   If **Use**: Go to Step 2.
      *   If **Mention**: Go to Step 3.
      *   *Note:* Reported speech ("He called me a [slur]") counts as **Use** for the purpose of harm assessment, because linguistic evidence shows the sting projects through quotation.

  **Step 2: The Agency & Reclamation Check** (Applies only if Step 1 = Use)
  *   **Question:** Is the speaker a member of the targeted group using the term self-referentially or in-group?
  *   **Rule:**
      *   If **Yes** (and subject consents to publication): **Run Verbatim.** (Context note required). Stop.
      *   If **No**: Go to Step 3.

  **Step 3: The Necessity Test**
  *   **Question:** Is the specific phonetic/spelling of the word essential to the news value, or does the *fact* of its usage suffice?
      *   *Essential:* The story is about the specific etymology, the legal definition of the word, or a scientific stimulus where the variable is the word itself.
      *   *Non-Essential:* The story is about the speaker's hostility, the event that occurred, or the fact that a slur was used.
  *   **Rule:**
      *   If **Non-Essential**: **Mask or Paraphrase** (e.g., "the N-word," "a racial slur"). Stop.
      *   If **Essential**: Go to Step 4.

  **Step 4: The Embedding Context**
  *   **Question:** Is the word insulated by a register that signals clear dissociation?
      *   *High Insulation:* Scientific paper, legal filing, dictionary definition, explicit content warning.
      *   *Low Insulation:* Narrative prose, headline, pull-quote, social media embed.
  *   **Rule:**
      *   If **Low Insulation**: **Mask.** (The risk of the word being read as an endorsement or casual usage is too high). Stop.
      *   If **High Insulation**: Go to Step 5.

  **Step 5: The Harm Handoff (THE STOP POINT)**
  *   **Question:** Does the editorial value of printing the verbatim word outweigh the confirmed risk of harm to readers from the targeted group?
  *   **Action:** **This question cannot be answered by this protocol.**
  *   **Rule:** If you reach Step 5, you have exited the realm of linguistics and entered the realm of ethics.
      *   **Flag the file for Human Review.**
      *   **Required Note:** Attach a brief memo explaining *why* Step 4 was passed (why the insulation is sufficient) and consult with a senior editor who represents the demographic impact.

  ---

  ### 3. Application to Concrete Cases

  Here is how the protocol processes the four scenarios you provided.

  **Case 1: The State Legislator (Hot Mic)**
  *   **Step 1 (Use/Mention):** **Use.** Even though the article reports on his speech, the slur is functioning as a descriptor of the victim in the original utterance. The offense projects.
  *   **Step 2 (Agency):** **No.** Legislator is not a member of the targeted group.
  *   **Step 3 (Necessity):** **Non-Essential.** The news value is the legislator's racism and the fact of the utterance, not the specific phonetics. "The N-word" conveys the severity without transmitting the toxin.
  *   **Decision:** **Mask.** (e.g., "the N-word").
  *   **Rationale:** Linguistic theory confirms the sting survives reporting. There is no semantic gain to printing it verbatim that outweighs the harm.

  **Case 2: The Gay Activist (Reclaimed Self-Reference)**
  *   **Step 1 (Use/Mention):** **Use.** He is referring to himself.
  *   **Step 2 (Agency):** **Yes.** Member of targeted group, self-referential, consents.
  *   **Decision:** **Run Verbatim.**
  *   **Rationale:** This is the "licensing" exception. The harm mechanism of a slur relies on external subordination; reclaimed in-group use alters the pragmatic force. The protocol clears this immediately.

  **Case 3: The 19th-Century Travel Writer (Archival)**
  *   **Step 1 (Use/Mention):** **Mention** (in your article), but **Use** (in the source text).
      *   *Complication:* You are serializing the text. The reader encounters the *Use* directly.
  *   **Step 2 (Agency):** **No.**
  *   **Step 3 (Necessity):** **Debatable.** You argue it is essential for historical fidelity.
  *   **Step 4 (Embedding):** **High Insulation.** It is framed as archival material, introduced by a modern writer.
  *   **Step 5 (Harm Handoff):** **TRIGGERED.**
  *   **Decision:** **Human Review Required.**
  *   **Rationale:** The protocol flags this as a conflict between *historical accuracy* and *reader harm*. Linguistics cannot solve this. The word *still* carries derogatory content (projection) even in an archival context. The decision to print it is an editorial value judgment, not a linguistic safety clearance. (See Section 5 below).

  **Case 4: The Cognitive Scientist (Stimulus)**
  *   **Step 1 (Use/Mention):** **Mention.** The word is the object of study.
  *   **Step 2 (Agency):** N/A.
  *   **Step 3 (Necessity):** **Essential.** The study measures reaction to the specific string of characters/phonemes. "The N-word" is not a valid scientific stimulus.
  *   **Step 4 (Embedding):** **High Insulation.** Scientific register, general readership warned.
  *   **Step 5 (Harm Handoff):** **TRIGGERED.**
  *   **Decision:** **Human Review Required** (but likely **Run Verbatim** with warning).
  *   **Rationale:** While linguistically "safe" (it is a mention), the harm to the reader is real. The protocol ensures a human confirms that the scientific value justifies the exposure.

  ---

  ### 4. The Confession: Addressing the Archival Instinct

  You stated: *"My instinct is that archival material should be printed as written... bowdlerizing a historical text is a kind of lie about the past."*

  If we apply this protocol honestly, **linguistic theory does not support your instinct.**

  Here is the hard truth the procedure reveals: The semantic/pragmatic debate confirms that slurs are "context-insensitive" regarding their offensive content. They project. When a modern reader sees a racial slur in a 19th-century text serialized in a 21st-century magazine, the word does not arrive as a "historical artifact." It arrives as a present-tense stimulus. The brain processes the derogatory content *before* it processes the archival framing.

  Therefore, printing the word verbatim is not "neutral." It is an active choice to transmit that stimulus to your audience.

  **Where the procedure corrects the instinct:**
  The protocol forces you to admit that printing the word is not the "default honest" option. It is a **high-risk option** that requires justification (Step 5).
  *   **If you print it:** You are prioritizing *historical fidelity* over *reader safety*. That is a valid editorial stance, but you must own it as a value choice, not hide behind "I'm just quoting."
  *   **If you mask it:** You are prioritizing *reader safety* over *verbatim record*.

  **Recommendation for Case 3:**
  Do not let the protocol tell you to mask it automatically. Let it tell you to **stop and justify it.**
  *   *Compromise:* Print the archival text verbatim in a distinct typeface or block quote (maximizing Step 4 Insulation), but introduce it with an explicit editor's note acknowledging the harm. This satisfies your instinct (the record is preserved) while satisfying the protocol (the harm is acknowledged and mitigated).

  ---

  ### 5. Limitations: What This Procedure Cannot Do

  You asked for honesty regarding the failure modes. Here they are.

  **1. It cannot measure trauma.**
  Linguistics explains *why* a word offends (semantic content vs. pragmatic force). It cannot measure *how much* it hurts. A reader from the targeted group may experience genuine physiological stress seeing the word verbatim, even in a "Mention" context (Case 4). The procedure flags this (Step 5), but it cannot calculate the cost.

  **2. It cannot account for power dynamics.**
  The protocol treats "Use" and "Mention" as logical categories. In the real world, a slur shouted by a majority-group member carries different weight than one analyzed by a minority-group academic. The protocol assumes the "Agency Check" (Step 2) catches this, but edge cases exist where power dynamics are subtle (e.g., a white journalist quoting a black source who used the slur).

  **3. It cannot prevent "accidental use."**
  Even with a warning, some readers will skim. If a slur appears in the text, it may be seen by a child, a survivor of hate speech, or someone scrolling without context. The procedure assumes a "reasonable reader" paying attention. It does not protect the distracted one.

  **4. It creates a "License to Print."**
  There is a risk that editors will treat Step 4 (High Insulation) as a "Get Out of Jail Free" card. "It's scientific, so we can print it." The Step 5 Handoff is designed to prevent this, but it relies on the Senior Editor having the courage to say "No" even when the science is sound.

  ### 6. Final Instruction for the Desk

  **If you are in doubt, mask.**
  The linguistic consensus is that the harm of a slur is "sticky." It travels. The benefit of printing it verbatim is almost always editorial (fidelity, precision), while the cost is human (dignity, safety).

  This procedure is not designed to make printing slurs easy. It is designed to make it **rare, deliberate, and justified.** If an editor cannot articulate the justification in Step 5, the word does not belong in the copy.

  **[End of Protocol]**
