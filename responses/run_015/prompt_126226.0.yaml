answer: |-
  To discuss epistemic dependence on AI, we must first distinguish four competences often conflated in debates about skill erosion. First, producing a correct answer unaided. Second, recognizing a correct answer when shown one. Third, reconstructing a derivation step by step. Fourth, noticing that something has gone wrong. I define a system's failures as *legible* to a user when the user can, without redoing the task, tell that an output is likely wrong based on its shape, provenance, or mismatch with expectations. The *legibility floor* is the minimum degree of such legibility a user must retain for their reliance on a system to leave their understanding intact.

  My argument rests on three claims. First, the erosion-of-understanding worry concerns not dependence as such, but *illegible dependence*: delegation that drops the user below the legibility floor. Second, understanding should be analyzed not as the retained ability to produce unaided results (Competence 1), but as retained alarm sensitivity (Competence 4) together with the ability to diagnose the failure type. Third, where tools differ, it is epistemically better to work with the weaker system whose failure modes you can predict than with the stronger system whose failures you cannot, even if the stronger system yields better final products.

  This account identifies understanding with Competence 4 plus diagnosis. Competence 1 is neither necessary nor sufficient. Consider the veteran engineer whose unaided calculation skills have decayed through years of delegation, yet who spots a flaw in a generated proof within seconds. They retain understanding despite losing production capacity. Conversely, Competence 3 is insufficient. Consider the student who can follow a generated derivation line by step while grasping nothing of the subject. They can reconstruct but cannot detect if the starting premise was hallucinated. Only the ability to sound the alarm when the system diverges from reality ensures the user remains an epistemic agent rather than a passive conduit.

  A strong objection arises: alarm sensitivity is itself a competence that atrophies. If delegation erodes the domain knowledge required to spot errors, the legibility floor is unstable. This is the de-skilling objection steelmanned. If I never calculate manually, how do I know the AI's number is wrong? If the alarm relies on the very skills being delegated, there is no stable resting place above the floor.

  This leads to a self-reinforcement dilemma. As a system grows more reliable, the user's optimal policy converges on deferring to it even when their alarm fires. But a user who routinely overrides their own alarm loses the calibration that made the alarm trustworthy. Increasing reliability tends to destroy the legibility floor from under the user. I argue this dilemma is avoidable. It requires a specific practice: mandatory adversarial spot-checking. Users must be required to intentionally probe the system's limits on known edge cases, even when the system is reliable. This maintains calibration without requiring full production capability. The legibility floor is not a static line but a maintained practice of verification.

  Next, consider the simulacrum objection. Someone who has learned where a system breaks by watching it break may predict failures accurately while having no grasp of the domain. Their legibility is a map of the machine, not of the subject matter. Does this count as understanding? On my account, it does not. Alarm sensitivity must be coupled with the ability to say *what kind of thing* has gone wrong in domain terms. If a user knows the AI hallucinates citations but cannot distinguish a valid citation from an invalid one based on archival logic, they possess only operational knowledge, not understanding. True legibility requires mapping the failure to the domain's normative structure, not just the output's statistical irregularities. If the user cannot explain the error in the language of the subject, they are below the legibility floor.

  This yields concrete institutional implications for a university department setting AI policy. Given the third claim, the department should forbid the use of opaque, high-capability models for core competency assessments. They should require tools that expose intermediate steps or confidence scores, even if these tools are less efficient. The department must be willing to give up the quality of final products in student coursework to preserve the legibility of the process. For example, in a coding course, students should be permitted to use a weaker autocomplete tool that highlights potential logic errors rather than a black-box generator that writes perfect functions instantly. The goal is not the code, but the student's retained ability to hear the alarm when the code fails. Policy should mandate that any AI tool used must allow the student to articulate why a specific output was accepted or rejected.

  Finally, there is a single empirical finding that would most damage this argument. If studies showed that users maintain high alarm sensitivity and diagnostic ability over long periods of total delegation without any practice of unaided production or adversarial spot-checking, my claim that understanding requires maintained calibration would collapse. If alarm sensitivity proves to be a passive trait that persists independently of domain exercise, then the legibility floor is natural rather than maintained, and the strict restrictions on tool capability become unnecessary. However, until such evidence exists, we must assume that without the friction of verification, the alarm goes silent, and with it, understanding.
