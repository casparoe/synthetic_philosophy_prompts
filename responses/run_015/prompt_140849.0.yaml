answer: |-
  1. You argue the ensemble condition holds alternatives open in a way first-personal deliberation cannot. But deliberation is teleological—it aims at action. Opera is contemplative. If the structure matches but the *telos* doesn't, are you describing a functional equivalent of ethical conflict, or just an analogy?

     **Follow-up:** If you say it's about the *structure* of conflict rather than the *outcome*, does a structure without practical stakes truly model ethical remainder? Williams's remainder is defined by its practical cost to the agent; if the audience pays no cost, is it still remainder, or just its shadow?

  2. You dismiss plot objections as category mistakes, arguing music provides non-propositional uptake. But the libretto is still semantic content. If the semantic content is incoherent, does the music redeem it, or does it merely distract from the incoherence?

     **Follow-up:** If you say music transforms the semantics, is there a limit? Can *any* text be redeemed by sufficient musical complexity, or is there a threshold where the text breaks the transformation? If there is a limit, who decides where it lies—the philosopher or the composer?

  3. You argue surtitles encourage propositional misreading, turning opera into illustrated text. But for most modern audiences, surtitles are the primary mode of reception. Is your philosophical account dependent on a mode of listening that is becoming historically obsolete?

     **Follow-up:** If you say the *ideal* listener ignores them, doesn't building a philosophy on an idealized reception risk making the theory normative rather than descriptive? If the art form's actual function has shifted, does the philosophy shift with it, or does it prescribe a return to the past?

  4. You label reinterpretations that soften tragedies as "narrative consequentialism." But performance is inherently interpretive. Why does the "remainder" reside exclusively in the composer's intent rather than the production's actualization?

     **Follow-up:** If you say the score encodes the ethical conflict, how does this handle works where the musical resolution is ambiguous or historically contested? If the score allows for multiple valid readings, isn't the director's choice just another valid resolution of the remainder?

  5. You extend Williams's Gauguin case to performance: a singer's justification depends on the performance coming off. But Gauguin's luck was about life-success, whereas a singer's luck is about nightly execution. Is aesthetic value really luck-dependent in the robust way moral justification is?

     **Follow-up:** If you say aesthetic value *should* be understood this way, doesn't that make the value of the work too unstable to bear the ethical weight you're assigning it? If the remainder vanishes on a bad night, does the ethical lesson vanish with it?

  6. You argue audiences don't owe a justification for watching suffering. Yet your book requires us to articulate exactly why the compresence of alternatives matters. Are you asking audiences to have one thought too many about their own engagement?

     **Follow-up:** If you say analysis is separate from enjoyment, doesn't the analysis inevitably colonize the enjoyment once the mechanism is revealed? Can you un-hear the theory when you return to the box seat?

  7. You often retreat to the position that music isn't in the business of making claims. But if opera teaches us about ethical remainder, isn't it implicitly claiming something true about ethics?

     **Follow-up:** If you distinguish "showing" from "saying," does that distinction hold when the "showing" is used to argue against a specific moral theory? If the effect is argumentative, isn't it making a claim regardless of your terminology?

  8. If the ensemble condition relies on knowing the characters' incompatible resolves, does the effect survive for a listener who doesn't understand the language or know the plot?

     **Follow-up:** If you say some knowledge is required, where is the threshold? Is it the music doing the work, or the music amplifying known text? If it's the latter, isn't the philosophy actually about libretto-plus-music, rather than the musical form itself?

  9. You describe a psychological effect—the compresence of alternatives. Is this an empirical claim about how listeners process polyphony, or a conceptual claim about how they *should* listen?

     **Follow-up:** If you say conceptual, why does the argument rely so heavily on the *experience* of the listener rather than the score alone? If the experience is central, isn't the theory vulnerable to how people actually report experiencing it?

  10. Finally, what evidence would count against your view? If listener studies showed people don't experience remainder, or if the effect vanished without plot knowledge, would you revise the thesis?

      **Follow-up:** If you say philosophy isn't falsifiable by data, what work is the appeal to listener experience doing if it's insulated from how listeners actually listen? Are you describing the art form, or just prescribing a way to use it?
