  2.  **Analyze the "Purpose" and Constraints:**

      *   *Deployed System:* Needs to work automatically. Determinacy is crucial (no ties).
      *   *Stream Processing:* Order independence and idempotence are highly desirable for engineering robustness, but mathematically tricky with uncertain evidence.
      *   *Engineering Refinement:* Invariance under grid refinement is critical. The physics shouldn't change because the engineer changed the resolution.
      *   *Downstream Decision:* Must avoid Dutch books or exploitable incoherence.
      *   *Judy Benjamin:* This is the core theoretical hurdle. How to handle "silent" dimensions?

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Determinacy.* (Non-negotiable). Software needs a single output.
      *   *Req 2: Certainty Reduction.* (Non-negotiable). If report says "Cell A is true", must match Bayes.
      *   *Req 3: Idempotence.* (Preference/Engineering). If I hear the same report twice, belief shouldn't change. *Wait*, if the report is "Probability of N is 0.75", hearing it twice *might* imply the channel is more reliable, but if the report *is* the constraint on the posterior, applying it twice should do nothing. Let's classify this as Non-negotiable for a *constraint* interpretation, but tricky for *evidence* interpretation. Given the prompt says "reports... arrive as constraints", Idempotence is likely Non-negotiable for the update function itself.
      *   *Req 4: Order Independence.* (Preference/Engineering). Batch vs. Stream. *Problem:* Most uncertain evidence rules (like Jeffrey) are not order-independent unless the partitions are independent or specific conditions are met. This is a likely point of incompatibility.
      *   *Req 5: Refinement Invariance.* (Non-negotiable). "Indifference to arbitrary modelling choices." Splitting a cell shouldn't change probabilities of unsplit events.
      *   *Req 6: Dynamic Coherence/Reversibility.* (Non-negotiable). If we learn the report was fake, we must be able to recover. This implies the update must be representable as conditioning on a larger space (Bayesian representation).
      *   *Req 7: Zero-Probandum Handling.* (Non-negotiable). Must handle prior 0 antecedents without crashing (Imaging vs. Conditioning).
      *   *Req 8: Constraint Interpretation.* (Non-negotiable). Must explicitly choose between "Constraint on Posterior" vs. "Truth of Conditional". Lewis triviality suggests the latter is impossible for general probabilities. So the spec must mandate the former (Constraint).
      *   *Req 9: Silence/Orthogonality.* (The Judy Benjamin problem). How to handle the "silent" dimension? Preservation of conditional odds? Preservation of marginals? Maximum Entropy? This is the "Camp Preference" zone.
      *   *Req 10: Diachronic Coherence.* (Non-negotiable). No Dutch books.

  4.  **Identifying Incompatibilities (The "Hard Truths"):**

      *   *Order Independence vs. General Constraints:* It is a known result (e.g., by Diaconis, Zabell, or in the context of Jeffrey Conditioning) that order independence generally fails for uncertain evidence unless the updates are on independent partitions or specific rules (like ML) are used which might violate other constraints.
      *   *Refinement Invariance vs. Maximum Entropy:* MaxEnt can sometimes depend on the parameterization (measure) of the space. If the grid is refined, does the entropy measure change? Usually, yes, unless a specific reference measure is fixed.
      *   *Constraint Interpretation vs. Reversibility:* If I treat a report as a hard constraint on the posterior (e.g., $P_{new}(N) = 0.75$), can I reverse it if I learn the report was a lie? Only if the update rule is invertible or if the "lie" is modeled as a subsequent constraint.
