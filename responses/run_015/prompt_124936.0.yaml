answer: |-
  # Specification Requirements for Belief-Revision Component

  ## 1. The Fundamental Distinction: Constraint vs. Proposition
  **Requirement:** The rule must treat reports as **constraints on the posterior probability function**, not as propositions to be conditionalized upon.
  **Rationale:** Lewis's triviality results demonstrate that no non-trivial proposition in the object language can have a probability equal to the corresponding conditional probability ($P(A \to B) \neq P(B|A)$ generally). Treating a report like "If North, then 70% East" as a proposition $R$ and updating via $P(\cdot|R)$ leads to mathematical incoherence or triviality in standard probability spaces.
  **Status:** **Non-Negotiable.**
  **Implication:** The update function $U(P, \text{Report})$ solves for a $P'$ that satisfies the report's equations (e.g., $P'(N)=0.75$), rather than conditioning on an event representing the report.

  ---

  ## 2. Requirements List

  | ID | Requirement | Motivating Case | Status | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Determinacy** | General Deployment | **Non-Negotiable** | The software is unattended. The function must return a single unique distribution, not a set or a family requiring manual tie-breaking. |
  | **R2** | **Certainty Limit** | Pinning a Single Cell | **Non-Negotiable** | If a report assigns probability 1 to a cell (or event), the rule must reduce to standard Bayesian conditioning. This ensures compatibility with hard sensor data. |
  | **R3** | **Refinement Invariance** | Grid Splitting | **Non-Negotiable** | Probabilities assigned to coarse events must not change when an engineer refines the grid (splits cells) elsewhere. The physics cannot depend on the resolution of the map. |
  | **R4** | **Zero-Antecedent Support** | Counterfactuals (Bridge Out) | **Non-Negotiable** | The rule must not crash or return undefined when a report constrains an event with prior probability zero. It must shift mass (imaging-style) rather than condition (divide by zero). |
  | **R5** | **Diachronic Coherence** | Downstream Decision | **Non-Negotiable** | The revised probabilities must not expose the system to a Dutch Book (sure loss) given the reporting protocol. This protects downstream decision rules from exploitation. |
  | **R6** | **Idempotence** | Duplicate Reports | **Non-Negotiable** | If the *same* constraint is applied twice, the posterior must not change. Since reports are constraints on the state, not additive evidence, re-applying a satisfied constraint should be a no-op. |
  | **R7** | **Silence Resolution** | Judy Benjamin (Orthogonal) | **Camp Preference** | When a report constrains one partition (North/South) but is silent on another (East/West), the rule must specify how to handle the "silent" dimension (e.g., preserve conditional odds vs. maximize entropy). *See Incompatibility Analysis.* |
  | **R8** | **Order Independence** | Reordered Reports | **Engineering Preference** | $U(U(P, R_1), R_2)$ should equal $U(U(P, R_2), R_1)$. Desirable for stream processing, but mathematically restrictive. |
  | **R9** | **Recoverability** | Fabricated Report | **Engineering Preference** | Learning a report was false should allow reversal to the prior (or a specific "retracted" state). Requires the update to be representable as conditioning in an enriched space. |
  | **R10** | **Channel Modeling** | Selection Effects | **Architectural Boundary** | The rule should *not* internally model channel reliability (e.g., 80% accuracy) or selection bias (Northern reach). This belongs in a pre-processing layer that converts channel characteristics into constraints. |

  ---

  ## 3. Incompatibility Analysis (The "Bad News")

  You asked to know if the list is jointly unsatisfiable. **Yes, a subset of these requirements is mathematically incompatible for general constraints.**

  **The Impossible Triangle:**
  1.  **General Constraints** (Judy Benjamin style, not just partitions).
  2.  **Order Independence** (R8).
  3.  **Uniqueness/Determinacy** (R1) via **Divergence Minimization** (the standard method for R7).

  **Why:**
  Sequential projection (updating on $R_1$ then $R_2$) using minimum divergence (e.g., KL-divergence/MinCrossEntropy) is **not commutative** for general linear constraints. The posterior depends on the order in which constraints are processed.
  *   To satisfy **Order Independence**, you must treat the stream as a **batch**: collect all reports, form the intersection of all constraints, and project the prior onto that intersection in one step.
  *   However, if reports arrive asynchronously and the system must output a posterior after *each* report (streaming), **Order Independence is impossible** for general constraints unless the constraints happen to be on independent partitions (which the Judy Benjamin case explicitly denies).

  **The Refinement Conflict:**
  **Maximum Entropy** (a common candidate for R7 Silence Resolution) violates **Refinement Invariance** (R3) unless a fixed reference measure (density) is maintained across grid refinements. If the engineer simply splits a cell into two without updating the system's internal "measure" of cell size, MaxEnt will shift probability mass arbitrarily.
  *   **MinCrossEntropy (I-Projection)** with a fixed prior reference measure satisfies Refinement Invariance better than MaxEnt, but fails Order Independence in streaming.

  **Recommendation:**
  You must drop **Order Independence (R8)** for the core update rule if you require streaming outputs on general constraints. Instead, mandate a **Buffer/Queue Architecture**: reports are accumulated over a time window $\Delta t$, constraints are aggregated, and the rule runs once per window. This simulates batch processing to satisfy R8 effectively, if not mathematically per individual report.

  ---

  ## 4. The Most Restrictive Requirement

  **Refinement Invariance (R3)** excludes the largest part of the candidate rule space.

  *   **Why:** Most information-theoretic rules (MaxEnt, MinCrossEntropy) are sensitive to the parameterization of the state space. Entropy is not invariant under coordinate transformation or grid refinement without a carefully managed reference measure.
  *   **Impact:** This rules out "pure" Maximum Entropy (which assumes a uniform counting measure) unless you augment the specification to require a physical area measure for every cell. It also rules out many geometric update rules that rely on the Euclidean structure of the probability simplex rather than the informational structure.
  *   **Second Most Restrictive:** **Order Independence.** As noted, this rules out almost all sequential update rules for uncertain evidence, forcing a batch architecture.

  ---

  ## 5. Resolution of the "Silence" Demand (Judy Benjamin)

  Regarding your specific question on the Judy Benjamin case: *Which demand is genuine and which is prejudice?*

  *   **Genuine Demand:** **Determinacy in the face of silence.** The system *must* output a single distribution. It cannot output "The North margin is 0.75, East/West is indeterminate."
  *   **Camp Prejudice:** **Preservation of Conditional Odds vs. Maximum Entropy.**
      *   *Preservation of Conditional Odds (Jeffrey-style):* Assumes the report provides no new information about the relationship *within* the unconstrained partition.
      *   *Maximum Entropy:* Assumes the report provides no new information *at all* beyond the constraint.
      *   **Verdict:** In a tracking system where correlations (e.g., terrain features) are encoded in the prior, **Preservation of Conditional Odds (MinCrossEntropy $P_{new} || P_{old}$)** is generally superior to MaxEnt. MaxEnt tends to wash out prior correlations (regressing toward independence), whereas MinCrossEntropy preserves prior structure as much as possible while satisfying the new constraint.
      *   **Specification:** Mandate **Minimum Cross-Entropy (I-Projection)** minimizing $D_{KL}(P_{new} || P_{old})$ subject to constraints. This satisfies R2 (Certainty), R4 (Zero-Prior via limit or imaging hybrid), and R3 (Refinement, if reference measure is fixed). It fails R8 (Order Independence) in streaming, reinforcing the need for batching.

  ---

  ## 6. Scoring Standard Families

  | Family | Determinacy | Certainty Limit | Refinement Invariance | Order Indep. (Stream) | Silence Handling | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Bayes Conditioning** | Yes | Yes | Yes | Yes | N/A (Requires facts) | **Fail.** Cannot handle uncertain constraints. |
  | **Jeffrey Revision** | Yes | Yes | Yes | **No** (unless partitions independent) | Preserves Conditional Odds | **Partial.** Only works for partition constraints, not general linear constraints (e.g., "Odds 3:1"). |
  | **MinCrossEntropy ($P_{new}||P_{old}$)** | Yes | Yes | **Yes** (with fixed measure) | **No** (Sequential projection non-commutative) | Preserves Prior Structure | **Best Candidate.** Requires batching for Order Independence. |
  | **MinCrossEntropy ($P_{old}||P_{new}$)** | Yes | Yes | Yes | **No** | Biased towards uniform | **Fail.** Reverse KL tends to underestimate support (zero-forcing). |
  | **Maximum Entropy** | Yes | Yes | **No** (Parameterization sensitive) | **No** | Maximizes Ignorance | **Fail.** Violates Refinement Invariance without extra bookkeeping. |
  | **Imaging (Lewis)** | Yes | No | Yes | Yes | Shifts mass to nearest world | **Fail.** Designed for counterfactuals ($P=0$ antecedents), distorts standard uncertain evidence. |
  | **Report as Proposition** | **No** | **No** | **No** | **No** | **Triviality** | **Fail.** Mathematically incoherent for probabilities. |

  ### Final Specification Advice
  1.  **Mandate MinCrossEntropy ($P_{new} || P_{old}$)** as the core update rule. It is the only standard family that respects the prior's correlation structure (Silence) while satisfying hard constraints and Refinement Invariance (given a fixed reference measure).
  2.  **Architect for Batching.** Do not promise Order Independence on a per-report stream. Specify that reports are accumulated into a "Constraint Set" and solved simultaneously. This satisfies the engineering need for robustness without violating mathematical impossibility theorems.
  3.  **Separate Channel Modeling.** Do not bake the "80% accurate" logic into the revision rule. The component preceding this one must convert "80% accurate report of N" into a constraint like "$0.7 \le P(N) \le 0.9$" or a likelihood-weighted constraint. The revision component takes the constraint, not the raw signal.
  4.  **Explicitly Reject Propositional Reading.** Cite Lewis triviality in the spec to prevent future engineers from attempting to model conditionals as events.
