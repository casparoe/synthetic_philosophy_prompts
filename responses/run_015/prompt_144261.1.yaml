answer: |-
  ### Exam Question: Philosophy of Cognitive Science & AI
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 1,500 words
  **Instructions:** Closed book. No citations required. Answer the prompt below.

  **Prompt:**

  Consider the following three stylized empirical findings from current interpretability research on large neural networks:

  1.  **Convergence:** Two language models are trained from different seeds on disjoint halves of a corpus. A direction isolated in one by a sparsity-based decomposition method (e.g., a Sparse Autoencoder feature), when written into the other at the corresponding layer, produces the same specific behavioral change. Furthermore, an approximately similar direction is recovered independently in the second model by the same pipeline.
  2.  **Proliferation:** The same pipeline, applied to the same model, recovers directions for arbitrarily gerrymandered classes—e.g., "images of dogs photographed indoors before a certain date" or "cats photographed outdoors after it." These directions are just as sparse, just as causally efficacious under intervention, and generalize just as well to held-out inputs as the direction for an ordinary category like *dog*.
  3.  **The Wrinkle:** Steering along the *dog* direction produces the targeted behavior but degrades performance on tasks with no evident connection to dogs. Additionally, this direction has no counterpart in a text-only model that nevertheless classifies dog-related sentences correctly.

  Using these three findings as your primary evidence, answer the following:

  1.  Define what it would mean for a neural network to *genuinely possess* a representation, such that findings (i)–(iii) serve as evidence for or against this possession rather than merely describing statistical regularities.
  2.  Evaluate how a **Realist** (features are discovered structure), a **Projectivist** (features depend on the analyst's basis), and an **Instrumentalist** (feature talk is purely predictive) would each interpret the tension between *Convergence* and *Proliferation*. Which finding discriminates most sharply between these views?
  3.  To escape the *Proliferation* objection, a Realist must impose further constraints on what counts as a representation (e.g., uniqueness, cross-model stability, compositional structure, robustness). Select the most promising constraint and explain why it fails or succeeds against *Proliferation* and *The Wrinkle*.
  4.  If the Anti-Realist is correct, what follows for interpretability practice? Is the usefulness of these posits for steering and monitoring compromised?

  ***

  ### Model Answer (850 words)

  To claim a network *genuinely possesses* a representation, we must move beyond causal efficacy. A minimal realist definition requires: (1) **Content Specificity** (the state carries information about X rather than Y), (2) **Functional Autonomy** (manipulating the state affects X-related processing without collapsing general competence), and (3) **Structural Stability** (the state is recoverable across variations in training or analysis). Under this definition, the vignette provides a mixed verdict.

  *Convergence* supports Realism by satisfying Structural Stability. If disjoint training runs yield isomorphic directions that transfer causally, the feature appears to be a property of the solution space, not the specific weights. *However*, *Proliferation* devastates Content Specificity. If "dog" and "dog-indoors-before-2020" are equally sparse and causally potent, the network does not privilege the natural kind. This suggests the "feature" is not a discovered semantic atom but a coordinate in a high-dimensional space that can be sliced arbitrarily. *The Wrinkle* challenges Functional Autonomy. If steering the *dog* direction degrades unrelated tasks, the direction is not a modular representation but a tangled circuit; the lack of a counterpart in text-only models suggests the "representation" is modality-specific rather than conceptual.

  **[Flag: Contested]** *Note: Whether causal efficacy is sufficient for representation is a live controversy. Some argue interventionist success is all that matters (operationalism); others demand semantic grounding.*

  Discriminating between views requires focusing on *Proliferation*.
  *   **The Instrumentalist** is untroubled. For them, features are tools for prediction and control. Whether "dog" or "dog-indoors" is "real" is irrelevant; if the lever works, the theory is valid. *Convergence* is a lucky bonus for transfer learning; *The Wrinkle* is a known cost of intervention.
  *   **The Projectivist** argues *Proliferation* proves features are artifacts of the decomposition. The analyst's choice of basis (the SAE dictionary) carves nature at joints that reflect the loss function's geometry, not the world's ontology. *Convergence* occurs because different seeds find similar geometric solutions to the same loss landscape, not because they find "dogs."
  *   **The Realist** must argue *Convergence* outweighs *Proliferation*. They claim natural kinds are more *compressed* or *compositional*. However, *Proliferation* shows gerrymandered features compress just as well (same sparsity). Thus, *Convergence* alone cannot save Realism.

  **[Flag: Settled]** *Note: It is empirically settled that SAEs find sparse, causally efficacious directions. It is contested whether sparsity correlates with human-meaningful concepts.*

  The most promising constraint to escape *Proliferation* is **Compositional Structure**. A Realist might argue "dog" is a primitive used to construct "dog-indoors," whereas the reverse is not true. If "dog" features combine systematically to form complex queries while gerrymandered features do not, "dog" has ontological priority. However, *The Wrinkle* undermines this. If the *dog* direction degrades unrelated tasks, it lacks the functional independence required of a primitive. Furthermore, the text-only model result suggests "dog" is not a unitary representation but a family of modality-specific heuristics. If the text model classifies dogs without the visual direction, the visual direction is not *the* representation of dog, but merely a visual correlate. A constraint of **Cross-Modal Stability** would fail here, as the representation dissolves across modalities.

  Therefore, the strongest constraint is **Task-Robustness** (a refinement of Functional Autonomy). A genuine representation should allow intervention without catastrophic interference. Since *The Wrinkle* shows interference, the "dog" direction fails this test. This pushes us toward a **Moderate Anti-Realism**: features are real *functional circuits* but not real *semantic symbols*. They are mechanistic pathways that correlate with semantics but are not identical to them.

  **[Flag: Model Answer Stance]** *Note: This answer takes a "Moderate Anti-Realist" stance (features are mechanistic, not semantic). This is a defensible position but not consensus. Graders should accept Realist defenses if they adequately address Proliferation.*

  If the Anti-Realist is correct, interpretability practice shifts from "mapping the mind" to "reverse-engineering the circuit." The usefulness for steering is not compromised—levers work even if we misunderstand the ontology—but the usefulness for *safety assurance* is. If features are gerrymanderable and entangled (*Proliferation* and *The Wrinkle*), we cannot guarantee a "deception" feature is actually deception and not a proxy that breaks under distribution shift. Monitoring remains viable, but ontological claims about "what the model believes" must be suspended. We are debugging code, not reading thoughts.

  ***

  ### Marking Scheme (20 Marks)

  **Grader Note:** This question addresses live philosophical controversies. Do not penalize students for defending Realism *provided* they engage with the *Proliferation* objection. The Model Answer takes a Moderate Anti-Realist stance; this is **not** the only correct position.

  **1. Definition of Representation (4 Marks)**
  *   **Criteria:** Candidate must define representation using criteria that make the vignette relevant (e.g., Stability, Autonomy, Specificity). Merely saying "it causes behavior" is insufficient (Instrumentalism).
  *   **Common Error:** Defining representation solely as "correlation with input" or "causal efficacy," which renders *Proliferation* invisible.
  *   **Flag:** [Contested] There is no consensus definition of neural representation. Award marks for internal consistency.

  **2. Discrimination of Views via Proliferation (4 Marks)**
  *   **Criteria:** Candidate must identify *Proliferation* as the key discriminator. Realists must explain why "dog" > "dog-indoors"; Instrumentalists must dismiss the distinction; Projectivists must attribute it to basis choice.
  *   **Common Error:** Focusing only on *Convergence* as proof of Realism without addressing why *Proliferation* doesn't undermine it.
  *   **Flag:** [Settled] *Proliferation* (finding arbitrary features) is an empirical reality in SAE work. The *interpretation* is contested.

  **3. Evaluation of Constraints (4 Marks)**
  *   **Criteria:** Candidate must propose a constraint (e.g., Compositionality, Robustness, Cross-Modal Stability) and test it against *The Wrinkle*. Must acknowledge why the constraint might fail (e.g., entanglement).
  *   **Common Error:** Proposing "Sparsity" as a constraint (refuted by vignette) or ignoring *The Wrinkle* entirely.
  *   **Flag:** [Contested] Whether compositionality exists in NNs is a major open research question.

  **4. Implications for Practice (4 Marks)**
  *   **Criteria:** Candidate must distinguish between *steering utility* (which remains) and *ontological safety guarantees* (which are compromised).
  *   **Common Error:** Claiming Anti-Realism makes interpretability useless, or claiming Realism guarantees safety.
  *   **Flag:** [Settled] Steering works empirically. Safety guarantees are theoretical and contested.

  **5. Use of Vignette Evidence (4 Marks)**
  *   **Criteria:** All three findings ((i), (ii), (iii)) must be explicitly utilized in the argument.
  *   **Common Error:** Ignoring *The Wrinkle* or treating the text-model mismatch as irrelevant.
  *   **Flag:** [Critical] *The Wrinkle* (modality mismatch) is weaker evidence against realism than the degradation aspect. Candidates who note this nuance (that representation might be multi-realizable) show higher sophistication.

  **Distinction between A and Pass:**
  *   **Pass (10-14 marks):** Correctly identifies the tension between *Convergence* and *Proliferation*. Defines representation minimally. Uses all three vignette points. Concludes with a plausible implication for practice.
  *   **A (15-20 marks):** Explicitly recognizes that *Proliferation* is the harder problem than *Convergence*. Nuanced handling of *The Wrinkle* (distinguishing entanglement from multi-realizability). Clearly flags where their argument relies on contested assumptions (e.g., "Assuming compositionality is required..."). Demonstrates awareness that Anti-Realism preserves steering utility but undermines safety *guarantees*.

  **Grader Warning on Contested Claims:**
  *   **Model Answer Stance:** The Model Answer argues for "Moderate Anti-Realism" (features are circuits, not symbols). **Do not penalize Realist answers** that argue "dog" is privileged due to evolutionary or data-distribution priors, provided they address *Proliferation*.
  *   **Vignette Weakness:** Point (iii)'s claim about the text-only model is philosophically weaker than the degradation claim. Multi-realizability (text vs. visual) is compatible with Realism. Candidates who challenge this specific implication without discarding the *degradation* point should be rewarded for critical engagement.
