  7.  **Final Polish:**
      *   Ensure the tone is appropriate for a PhD comp exam (rigorous, precise).
      *   Verify the marking scheme adds up to 20.
      *   Ensure the "Flagging" requirement is met in both Model Answer and Scheme.

  *(Self-Correction on Vignette Point iii)*: The prompt asks me to say if one finding does less work. Point (iii) has two parts: degradation and modality mismatch. The modality mismatch is actually less relevant to the *ontology* of the representation than the degradation. If a text model classifies dogs without visual features, it just means the representation is amodal or realized differently. But the *degradation* suggests the feature isn't functionally autonomous. I will advise the graders that the modality point is weaker evidence against realism than the degradation point, and ensure the model answer reflects this nuance.

