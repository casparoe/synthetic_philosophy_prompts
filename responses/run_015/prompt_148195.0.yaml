  Open the workshop by writing "Lightning is electrical discharge" on the board and demanding students classify its modal and epistemic status before defining rigidity, using this single carrying example to trace how reference-fixing descriptions masquerade as semantic content.

  ### Reasoning and Dependency Order
  The core pedagogical error in standard lectures is introducing rigidity and apriority simultaneously, allowing students to fuse them into a single "Kripkean package." You must enforce a strict dependency order: **Metaphysics (Modality) → Semantics (Reference Fixing) → Epistemology (Apriority).**

  1.  **Minutes 0–20 (Modality First):** Establish that rigidity is a thesis about *what* is designated across possible worlds, independent of how we identify it. Use "Lightning" to ask: "In a world where electrical discharges occur without light, does lightning exist there?" If they say no, they are treating "lightning" as a non-rigid description ("the bright flash"). Force them to accept that "lightning" rigidly designates the *phenomenon* (the discharge), not the *sensation*.
  2.  **Minutes 20–50 (Semantics Second):** Once rigidity is secured modally, analyze how reference is fixed. Show that we fix the reference of "lightning" via contingent descriptions (bright flash in sky), but the term itself rigidly picks out the cause. This separates the *fixing* (epistemic/contingent) from the *designating* (modal/rigid).
  3.  **Minutes 50–90 (Epistemology Last):** Only after the modal profile is locked do you ask how we know the identity. Since "Lightning" and "Electrical Discharge" are two rigid designators picked out via different contingent properties, their identity is necessary (same object in all worlds) but a posteriori (requires empirical investigation to link the two modes of presentation).

  ### Misconception Map
  | Misconception | Why They Hold It | Where to Head It Off | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **Rigidity is Syntactic** | They treat "Name = Rigid" and "Description = Non-Rigid" as a grammatical rule. | **Minute 25** (Semantics Phase) | Introduce the rigidified description **"The actual electrical discharge"** within the Lightning example. Show that descriptions *can* be rigid if indexed to actuality, proving rigidity is semantic, not syntactic. |
  | **"Necessary" = Epistemically Certain** | They read "necessary" as "unrevisable" or "known with certainty." | **Minute 55** (Epistemology Phase) | Run a counterfactual test: "If we lacked all evidence for electricity, would 'Lightning is electrical discharge' be false?" Force distinction between *truth conditions* (modal) and *verification conditions* (epistemic). |
  | **Rigidity Entails A-Posteriority** | They think the *reason* the identity is a posteriori is *because* the terms are rigid. | **Minute 70** (Synthesis Phase) | Compare **"Lightning is lightning"** (Rigid + A Priori) against **"Lightning is electrical discharge"** (Rigid + A Posteriori). Show rigidity is constant; the epistemic status changes based on whether the identity links one term to itself or two distinct reference-fixings. |

  ### End-of-Session Diagnostic Question
  **"If empirical investigation revealed that the phenomenon we call 'lightning' was caused by angels rather than electricity, would the statement 'Lightning is electrical discharge' be false, or would it reveal that we were wrong about what lightning is?"**

  *   **Correct Response:** They must recognize that if "lightning" is rigid, the statement would be false (angels ≠ electricity), but if they treat "lightning" as a non-rigid description ("whatever causes the flash"), they might say the term now refers to the angelic cause.
  *   **Better Modal/Epistemic Split:** **"Does the fact that we need empirical evidence to confirm 'Lightning is electrical discharge' make the identity contingent, or does it merely reflect how we fix the reference of 'lightning'?"** (Accept only the latter).

  ### What to Omit
  *   **Two-Dimensional Semantics:** This introduces a secondary intension that will re-conflate the modal and epistemic dimensions you are trying to separate.
  *   **Causal Chains of Transmission:** The history of how the name "lightning" passed to us is irrelevant to the modal/epistemic distinction and distracts from the reference-fixing logic.
  *   **Fregean Senses:** Do not allow retreat into "modes of presentation" as semantic content; keep modes of presentation strictly epistemic (reference-fixing) to maintain the Kripkean distinction.
