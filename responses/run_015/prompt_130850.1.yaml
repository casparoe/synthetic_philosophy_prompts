      *   Refinement: It's not circular because stabilization isn't derived from the prediction; it's a precondition for making the prediction intelligible. We don't select the class because we know the causal relevance; we stipulate causal relevance based on conservative engineering norms. If we lack data on the interaction, the normative commitment might be to fragment the class (prioritize safety over power) or to broaden it (prioritize feasibility), but that choice is ethical/methodological, not ontological.

