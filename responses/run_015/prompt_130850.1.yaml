      *   *Addressing Relativism:* Reframe "relativism" as "pluralism grounded in pragmatic ends." Risk isn't a monadic property of the bridge; it's a relation between the bridge, the environment, and the decision context. Different communities have different risk tolerances and informational constraints. Acknowledging this isn't surrendering to relativism; it's acknowledging the situated nature of engineering judgment.
