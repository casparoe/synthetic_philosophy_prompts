answer: |-
  Elena, a bioethicist, faces a non-deferrable deadline to either publish a dataset that violates the explicit confidentiality agreements signed by her deceased research participants or destroy it to honor their privacy, knowing with certainty that publication will save thousands of lives while destruction will result in their deaths. She has spent three years with a patient human adviser who disclosed every relevant fact about the participants' values, the medical consequences, and the social implications, giving her ample time to reflect without haste or passion. She holds two desires that survive this complete information and rest on no false belief: a terminal commitment to respect the autonomous consent of the dead, and a terminal commitment to minimize preventable mortality among the living. No available option satisfies both desires; publishing violates consent to save lives, while destroying honors consent at the cost of lives, creating a logical incompatibility in the action space that reflection alone does not dissolve.

  **Demonstration of Design:**
  **Extrapolation Alone:** Recommends retaining both desires intact. Since both desires survive full information and reflection without being revealed as instrumental or mistaken, the extrapolated volition set is {Honor Consent, Save Lives}. Because the available actions are mutually exclusive regarding these desires, extrapolation outputs a contradiction in the action space and cannot recommend a specific choice without further processing.
  **Coherence Procedure:** Recommends publishing the data. Using a **Lexical Priority Revision Rule** (resolve conflicts by satisfying the desire endorsed by the highest-order volition), the procedure checks her meta-preferences. Suppose her highest-order volition prioritizes "preventing death" over "keeping promises" in life-or-death contexts. Coherence prunes or overrides the "Honor Consent" desire to restore consistency, yielding a actionable directive.
  **Why They Come Apart:** Extrapolation clarifies the *content* of idealized desires but does not resolve logical incompatibilities between them; Coherence imposes a *structure* (ranking or revision) on those desires to enable action. Extrapolation leaves the conflict standing as a tragic dilemma; Coherence resolves it by forcing a trade-off.
  **Feature Doing the Work:** **Irreducible Value Pluralism.** The case relies on the existence of two terminal values that are logically incompatible in extension but both valid in intension after idealization.
  **Verdict if Removed:** If value pluralism is removed (i.e., if all values are instrumental to a single metric like utility), extrapolation alone would dissolve the conflict by revealing one desire as subordinate, making the coherence step redundant.
  **Friend's Strongest Attack:** "If Elena truly knew everything and reflected ideally, she would realize that 'Honor Consent' is instrumental to 'Save Lives' (via social trust) or vice versa, merging them into a single coherent function; persistent conflict proves the extrapolation was incomplete."
  **Does It Succeed?** **No.** This attack begs the question by assuming moral monism is a precondition of idealization rather than a substantive ethical claim. The constraints stipulate both desires survive full information; if pluralism is true, idealization clarifies the conflict rather than dissolving it, proving coherence must do independent work to arbitrate between irreducible values.
