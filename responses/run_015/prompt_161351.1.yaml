      *   *ML Reality:* Even with calibrated rewards, we might weight by reliability, importance, or rights.
      *   *Verdict:* The user is mostly right, but the "common scale" often implicitly carries a "common weight" assumption in philosophical discourse, whereas in ML, scale $\neq$ weight.
      *   *Where translation fails:* The concept of "Rights" or "Constraints" vs. "Objective Function." ML tends to scalarize everything into one loss. Philosophy sometimes treats certain utilities as constraints (deontology) rather than terms in a sum.

