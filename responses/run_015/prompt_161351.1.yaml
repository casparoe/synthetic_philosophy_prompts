      *   **Vocabulary:** Per-annotator reward models, pairwise preference data, reward identified only up to a positive affine transform, normalization, scalarization weights, Pareto fronts, gradient domination, off-policy evaluation.
      *   **Goal:** Translate classic philosophical debates about interpersonal utility comparison (IUC) into ML/RLHF terms.
      *   **Specific Tasks:**
          1.  Translate 5 specific philosophical moves into ML terms.
          2.  Provide a "residue report" (what translates cleanly, what requires smuggling, what has no counterpart).
          3.  Address the "Calibration Oracle" hypothesis (does a common scale solve measurement but leave aggregation, or does it presuppose aggregation?).
      *   **Tone:** Technical, precise, honest about limitations, avoiding condescension but acknowledging the depth of the philosophical literature.

  2.  **Deconstruct the Philosophical Moves & Translate to ML:**

      *   *Ordinalism (Intrapersonal only):*
          *   Phil: Only rankings within a person matter. No comparing magnitudes across people.
          *   ML: Per-annotator reward models are valid only up to monotonic transformation. Pairwise preferences ($A \succ_i B$) are ground truth. Global loss function cannot sum losses across annotators without arbitrary scaling.
      *   *Veil of Ignorance (Harsanyi/Rawls):*
          *   Phil: Choose principles not knowing who you are. Maximizes expected utility (Harsanyi) or maximin (Rawls).
          *   ML: Training a policy $\pi$ to maximize $\mathbb{E}_{i \sim \text{Uniform}}[R_i(\tau)]$. Or robust optimization over the population distribution. Treating annotator ID as a latent variable sampled uniformly during training.
      *   *Partial Comparability (Levels vs. Units):*
          *   Phil: Maybe we can compare zero points (levels) but not slopes (units), or vice versa.
          *   ML: Reward shifting (baseline subtraction) is valid across agents, but gradient scaling is not. Or: We can align baselines ($\min R_i = 0$) but not variances ($\text{Var}(R_i)$).
      *   *Utility Monster (Nozick):*
          *   Phil: One agent gets huge utility from resources, drowning out others in utilitarian sum.
          *   ML: An annotator with high variance reward signal dominates the gradient updates. The scalarization weights $w_i$ need to be inverse-variance or capped to prevent one head from dominating the multi-task loss.
      *   *Levelling Down Objection:*
          *   Phil: Equality for its own sake implies making everyone worse off is "good" in one respect.
          *   ML: Optimizing for minimum reward (max-min fairness) reduces total sum reward. Pareto inefficiency introduced by enforcing equality constraints on the reward vector.

  3.  **Drafting the Residue Report:**
      *   *Clean Translations:* Ordinalism maps directly to the affine/monotonic identification problem in reward modeling. Utility Monster maps to gradient domination/scalarization.
