  *Brainstorming Note:*
  *Shadow Pain Concept:* It's the sum that exceeds the parts. Like how a million whispers create a roar, but a million invisible cuts create a wound in the world itself. It's ontological damage.
  *Misapplication:* "Mathematically, it's zero per person."
  *Breakdown:* The machine measures "Ethical Density" or something similar spiking even when individual pain is zero.

  *Story Flow:*
  1. Elara at the console.
  2. Colleague (Kael) argues for diffusion.
  3. Kael uses the "negligible harm" logic.
  4. Elara sees the shadow metric rise.
  5. She activates diffusion.
  6. The aftermath is eerie.

