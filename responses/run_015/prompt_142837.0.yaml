  *Drafting:*
  The console hummed, a low vibration that Elara felt in her teeth. On the screen, the burden waited: fifty years of continuous nerve-fire, extracted from a condemned war criminal. The law offered two paths. Absorb it herself—the Penitent Option—or engage the Diffuse Burden Protocol.

  "Look at the math, Elara," Kael said, leaning against the doorframe. He wouldn't come closer to the machine. "Seven million citizens. Split the signal, and each person receives four microseconds of discomfort. Less than a mosquito bite. It's statistically zero."

  "That's the trick, isn't it?" Elara said, her hand hovering over the toggle. "If I take it, one person screams. If we diffuse it, no one screams. But the scream still happens."

  "You're mystifying the metrics," Kael snapped. "If no individual neuron fires above the pain threshold, there is no pain. You can't add up zeros and get a one. If it's spread out, it's not real harm. It's just noise."

  Elara watched the secondary monitor. This was the part the manuals didn't explain well. The Diffuse Burden Protocol didn't just split the signal; it left a remainder. The Shadow Pain. It wasn't registered on biological scanners because it wasn't in the bodies. It was in the space between them.

  On the screen, the Shadow Density curve was climbing. Even before activation, the mere potential of the diffusion was leaking gray static into the room's sensors. The air grew heavy, not with heat, but with a kind of moral humidity.

  "If it's not in the bodies, where is it?" Elara asked.

  "Nowhere. That's why it's safe," Kael said. He was sweating. He believed the logic because he needed to. If the harm was real, he was complicit. If it was zero, he was safe. "Press the button, Elara. Don't be a martyr for a ghost."

  Elara looked at the Penitent Option. She could burn. She could be the single point of failure for the city's conscience. But was that vanity? To claim the only real suffering was the kind that had a name?

  She flipped the switch to Diffuse.

  The machine whirred. The burden vanished from the queue. The city outside remained lit; no sirens wailed. Seven million people went about their evenings, perhaps scratching an itch they couldn't locate, perhaps feeling a sudden, unexplained chill.

  But in the control room, the Shadow Density meter pinned to the maximum. The lights flickered. The gray static wasn't just on the screen anymore; it was coating the walls, a thick, invisible sludge that made breathing feel like inhaling wet ash. Kael stepped back, eyes wide, suddenly unable to speak.

  Elara touched the wall. It felt bruised.

  She had saved seven million people from agony. She had also filled their world with something that wasn't pain, but wasn't peace. The bill wasn't paid; it was just laundered. She stood in the silence, waiting to see if the shadow would ever lift, or if it would just become the new atmosphere.

