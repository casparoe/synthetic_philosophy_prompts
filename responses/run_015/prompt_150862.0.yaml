      *   *Critique 1:* Too simple. Needs more FV jargon (invariants, type preservation, etc.).
      *   *Attempt 2:* Let the Universe be a formal system $\mathcal{U}$. The physical world is an instantiation layer $\mathcal{L}_{phys}$. The mind is a high-level type $\mathcal{T}_{mind}$. Death is the halting of the thread on $\mathcal{L}_{phys}$. Gödel argues that if $\mathcal{U}$ is sound, $\mathcal{T}_{mind}$ must have type preservation across state transitions of $\mathcal{L}_{phys}$, even when $\mathcal{L}_{phys}$ goes to a null state.
      *   *Refinement:* Focus on *invariants* and *non-termination*. The "rational order" is the consistency of the global specification. The "waste" argument is an optimization or completeness argument.

  5.  **Drafting the Residue Report:**
