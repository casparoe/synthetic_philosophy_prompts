answer: |-
  Your intuition about the 'social grain' is not a red herring; it is, I suspect, the most fertile ground you have found. The standard debate often treats reactive attitudes as a monolithic block: either you have them (and are a moral agent) or you do not (and are an object of treatment). But in practice, we do not resent a train delay in the same way we resent a spouse's betrayal, nor do we feel gratitude towards a functioning traffic light in the same way we do towards a friend's kindness.

  If your novel posits a programme that blunts these attitudes globally, it assumes they are functionally identical across contexts. If your 'social grain' hypothesis is correct, that programme is a category error. It might pacify a courtroom while destroying a marriage, or vice versa.

  Here is how I would rank the open questions for your purposes, ordered by their upstream importance to institutional design and narrative conflict.

  ### 1. The Context-Dependence of Function (The 'Social Grain')
  **The Question:** Do reactive attitudes perform the same normative work in intimate relationships as they do in institutional settings?
  **Ranking Justification:**
  *   **Dependency:** This is the highest. If the function varies, a blanket solution is incoherent. Every other question (about justice, love, or stability) depends on whether the attitude is serving to regulate power, express care, or signal harm in that specific context.
  *   **Tractability:** Moderate. We cannot solve this metaphysically, but we can map the phenomenology. We know intuitively that indignation at a bureaucrat feels different than indignation at a lover.
  *   **Practical Impact:** Massive. If resentment in a court is about enforcing norms, but resentment in a marriage is about constituting the bond, then blunting the former might improve efficiency while blunting the latter kills the relationship.
  *   **Defence of Position:** This must be first because it dictates the *architecture* of your society. If the state mandates the programme for judges but bans it for parents, you have a complex, stratified society. If they mandate it for everyone, you have a tragedy waiting to happen. It moves the debate from 'is free will real?' to 'what is this tool for?'. In your novel, this is the flaw in the technology: it treats a scalpel like a sledgehammer.

  ### 2. The Epistemic Authority of Negative Attitudes
  **The Question:** Is resentment merely a disruptive emotion, or is it a form of moral perception that detects injustice?
  **Ranking Justification:**
  *   **Dependency:** High. If resentment is just noise, removing it creates peace. If it is a signal (like pain), removing it creates blindness.
  *   **Tractability:** High. We can observe what happens when people stop being indignant. Do abuses continue unnoticed?
  *   **Practical Impact:** Critical for political stability. A society without indignation might be peaceful, but it would likely be incapable of resisting oppression.
  *   **Defence of Position:** This ranks second because it is the primary *risk* of the programme. If your characters take the pill and stop feeling outraged by structural inequality, the society becomes stable but tyrannical. This is the 'soma' argument from *Brave New World*, but updated for moral psychology. It matters more than the metaphysics of responsibility because it deals with the *consequences* of error. If the programme is a lobotomy of the moral sensorium, the plot writes itself: someone needs to feel anger to save the world.

  ### 3. The Constitutive vs. Instrumental View of Relationships
  **The Question:** Are reactive attitudes the *substance* of love and friendship, or merely the *mechanism* by which we manage them?
  **Ranking Justification:**
  *   **Dependency:** Medium. This affects personal arcs more than institutional design.
  *   **Tractability:** Low. This is deeply philosophical and phenomenological. It is hard to prove, but easy to dramatised.
  *   **Practical Impact:** High for individual characters. If constitutive, the user of the programme is no longer capable of love. If instrumental, they are just 'calmer'.
  *   **Defence of Position:** This is third because it is the human cost. If the attitudes are constitutive (as Strawson leaned towards), then the programme does not make you a better partner; it makes you a different kind of entity, perhaps one incapable of the 'participant stance'. For a novel, this provides the emotional stakes. A character might realise that by removing their capacity for resentment, they have also removed their capacity to be hurt, and thus their capacity to care. It creates a tragic irony: peace at the price of intimacy.

  ### 4. The Permanence of the 'Objective Stance' in Governance
  **The Question:** Can a bureaucracy operate on the 'objective stance' (treating people as objects to be managed) without dehumanising the operators themselves?
  **Ranking Justification:**
  *   **Dependency:** Medium. It relies on the first question (context).
  *   **Tractability:** Moderate. We can look at current burnout in care professions or law enforcement.
  *   **Practical Impact:** High for world-building. It determines the texture of the state.
  *   **Defence of Position:** This is fourth because it is a specific instance of the 'social grain'. Strawson suggested we take the objective stance towards the mentally ill or children temporarily. Your society makes it permanent for administrators. The question is whether a human can sustain this without fracturing. If the programme is required for civil servants, does it turn them into sociopaths, or efficient angels? This shapes the antagonists of your story. Are the enforcers of the programme cold monsters, or simply 'healed'?

  ### Why this ordering matters for your novel

  You asked what makes a question worth years of work. It is worth years if settling it changes the *rules of the game*.

  1.  **The 'Social Grain' (Rank 1)** changes the rules of the game because it challenges the premise of the technology itself. If this is true, the programme is fundamentally flawed design. That is a better conflict than 'the government is evil'. It makes the technology *incompetent* rather than malicious, which is often more terrifying.
  2.  **The Epistemic Role (Rank 2)** changes the stakes. If resentment is data, then the 'peaceful' society is actually blind. This gives your protagonist a reason to fight that isn't just 'I want my feelings back', but 'I need to see the truth'.
  3.  **The Constitutive View (Rank 3)** changes the personal cost. It ensures the story isn't just political thriller, but also a domestic tragedy.
  4.  **The Administrative Stance (Rank 4)** colours the background. It makes the world feel alien.

  ### A Note on the 'Social Grain' Hypothesis

  You asked if this scaling problem is the hidden crux behind compatibilism. I would argue it is the hidden crux behind *application*. Compatibilists argue we can keep responsibility without metaphysical free will. But they often assume a dyadic relationship (agent A, agent B).

  Once you scale to institutions, the 'reactive attitude' model strains. A court does not feel resentment; it simulates it through procedure. If your programme blunts the *simulation*, justice might become more accurate (less bias) or less humane (less mercy). If it blunts the *feeling* in the judge, does the verdict change?

  For your novel, I would suggest the programme works too well in the wrong contexts. It creates a society that is incredibly efficient at bureaucracy (no indignation, just processing) but catastrophic at intimacy (no resentment, no repair). The 'social grain' is not just a philosophical nuance; it is the mechanism of the society's collapse. The friction comes from trying to apply a tool designed for the macro (social stability) to the micro (human connection), or vice versa.

  Focus your philosophical energy there. The free will debate is a cul-de-sac; the *function* of the emotions in different structures is the open road.
