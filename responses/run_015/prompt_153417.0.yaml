      *   **Core Question 2:** Is this account coherent, or does it oscillate between incompatible theories (e.g., causal-informational vs. structural)?
      *   **Core Question 3:** Distinguish requirements vs. fit. Can a deflationary anti-realist adopt these procedures, or is normative force dependent on thicker ontology?
      *   **Core Question 4:** What concrete changes would follow if we switched to a thoroughly deflationary framework (heuristics only, no semantics)?
      *   **Constraint:** Separate settled vs. contested issues in philosophy of mind/AI ethics. Do not present contested interpretations as consensus.

  2.  **Initial Analysis & Philosophical Mapping:**

