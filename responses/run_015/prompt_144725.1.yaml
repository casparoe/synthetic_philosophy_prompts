answer: |-
  **Activity Title:** The Continuity Auction
  **Participants:** 16 Students (Grad/Senior)
  **Duration:** 75 Minutes
  **Materials:** Whiteboard, 16 envelopes (starting capital), 1 distinct object (the "Token"), bid slips, timer.

  ### 1. The Payoff Scheme (The Sting)
  Do not use fake money that feels like Monopoly cash. Use **Merit Points (MP)** tied to a tangible, low-stakes consequence.
  *   **Endowment:** Every student starts with **100 MP** in an envelope.
  *   **The Prize:** A voucher for **250 MP**.
  *   **The Trap:** Highest bidder wins the 250 MP but pays their bid. **Second-highest bidder pays their bid and gets nothing.**
  *   **The Sting:** If a student ends with negative MP, they must **lead the warm-up for the next three classes** (public labor) or **write a 5-page reflection on their own irrationality** (private labor). Let them choose their penalty at the start. This makes the points feel like skin in the game.

  ### 2. The Rules (Embedding the Framing)
  1.  **The Token:** Place a physical object (a heavy coin, a stone, a key) in the center. To bid, you must physically hold the Token. You cannot bid unless you are holding it.
  2.  **The Continuity Clause:** To place a bid, you must write your bid on a slip and sign it with the statement: *"I honor the commitment of my previous bid."*
  3.  **The Cooling Period:** Once a bid is placed, there is a mandatory **90-second silence** before the next bid can be accepted. During this time, the current highest bidder holds the Token. They cannot put it down. They must physically bear the weight of the current state while others decide whether to relieve them of the burden.
  4.  **No Collusion:** Talking between bidders during the auction results in immediate disqualification and a -50 MP penalty for all involved.
  5.  **Termination:** The auction ends when 3 minutes pass without a new bid.

  ### 3. Timeline (75 Minutes)
  *   **00:00 – 00:10 (Setup):** Distribute envelopes. Explain the MP consequences. Have them sign the penalty choice (public labor vs. private essay). Place the Token in the center.
  *   **00:10 – 00:15 (The Hook):** Open bidding at 5 MP. Emphasize the prize value (250 MP). Let the first few bids fly fast.
  *   **00:15 – 00:55 (The Escalation):** Once bids hit 100 MP (the break-even point), enforce the 90-second Cooling Period strictly. Use this silence to heighten tension. Do not speak. Let them stare at the Token holder.
  *   **00:55 – 01:05 (The Crash):** When bidding stops, calculate scores immediately. Publicly announce who owes labor/essays. Collect the slips.
  *   **01:05 – 01:15 (The Debrief):** Do not lecture. Ask three questions:
      1.  "At what exact bid did you feel you were playing for the prize, and at what bid were you playing to avoid the loss?"
      2.  "Holder of the Token: Describe the physical sensation of holding it during the silence when you wanted to quit but couldn't."
      3.  "Look at your signed slips. Did you feel like the same person who signed the first slip as the one who signed the last?"

  ### 4. The Limitation (What You Must Say)
  The game forces public escalation, but it cannot reproduce the **silence of real-life commitment**. In this room, the pressure is social; they are performing for peers. In reality, the "intertemporal promise" happens in private—no one sees you stay in a bad job or a bad relationship except you. The game makes the trap visible; life makes it invisible. You must tell them that the hardest betrayals of the self happen when no one is watching the auction.

  ### 5. Predictable Failure Points (What Will Blow Up)
  *   **The Collusion:** Two students will whisper and agree to bid 5 MP and 10 MP, then split the winnings. You must catch this early. If you hear whispering, pause the game and threaten the -50 MP penalty immediately.
  *   **The Martyr:** A student will bid 1000 MP just to break the game and prove a point. Counter this by enforcing the "Endowment Rule"—you can only bid what you have in your envelope plus a maximum overdraft of 50 MP.
  *   **The Refusal:** The second-highest bidder will refuse to accept the penalty. Have a pre-printed "Contract of Participation" they signed at the start of the semester (or workshop) that covers this, or be prepared to enforce the penalty yourself to maintain the reality of the stakes.

  This activity forces students to physically hold the weight of their past decisions while the silence convinces them that quitting is more painful than paying.
