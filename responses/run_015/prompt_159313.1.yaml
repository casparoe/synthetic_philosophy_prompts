answer: |-
  The question

  Consider "terminism": a belief is justified when the subject meets live challenges in her situation; the chain stops when questioning stops, regardless of the reason's intrinsic nature. Stopping points are context-dependent. In an essay of roughly 800 words, address the following: (1) What fundamentally distinguishes foundationalism, coherentism, and infinitism from one another? (2) Does terminism make justification too arbitrary ("anything-goes")? (3) Does the distinction between propositional and doxastic justification save terminism from this objection? (4) What does the viability of terminism imply about the force of the regress argument itself? Argue for a specific verdict on whether terminism is a distinct, viable fourth option or collapses into one of the traditional three.

  Model answer

  The traditional taxonomy of the regress problem is often mistaken for a dispute merely about diagrammatic shape—linear, circular, or infinite. However, the fundamental divide concerns the source of warrant. Foundationalism locates warrant in the intrinsic nature of the terminus (e.g., infallibility or sensory givenness). Coherentism locates it in systemic relations among beliefs. Infinitism locates it in the infinite availability of further reasons. Terminism proposes a fourth source: the pragmatic exhaustion of doubt. On this view, warrant arises not from the chain's structure or content, but from the absence of undefeated defeaters in a specific context. This makes terminism distinct because it shifts the locus of justification from the believer's mental architecture to the dialectical situation.

  The primary objection to terminism is the "anything-goes" charge. If justification stops whenever questioning stops, then a stubborn dogmatist who refuses to answer further challenges appears justified simply by ending the conversation. This makes justification too cheap and subjective. If I stop because I am bored, rather than because the reason is good, terminism seems to validate irrationality. For terminism to be viable, the "stopping" cannot be merely psychological; it must be normative. The challenges must be "live" in an objective sense, not just in the subject's mind.

  This is where the distinction between propositional and doxastic justification becomes decisive. Propositional justification concerns whether there are reasons available that support a belief, regardless of the agent's access. Doxastic justification concerns whether the agent properly uses those reasons. Terminism collapses if applied to propositional justification; facts about whether reasons exist cannot depend on whether anyone is currently challenging them. However, terminism is highly plausible as a theory of doxastic justification. I am doxastically justified if I can meet the challenges that are reasonably expected of me in my context. This saves terminism from the anything-goes objection because the "live challenges" are constrained by social and epistemic norms, not individual whim. I cannot stop simply because I wish to; I must stop because there are no further *reasonable* demands for evidence.

  One might object that this merely reduces terminism to a form of contextualist foundationalism. If there are normative standards for when questioning must stop, aren't those standards functioning as foundational rules? This objection fails because foundationalism requires the stopping belief itself to possess intrinsic warrant. Terminism requires only that the *practice* of challenging has been satisfied. The belief itself need not be self-evident or infallible; it is justified because the burden of proof has been met, not because the belief is immune to error. Therefore, terminism remains distinct.

  Ultimately, the viability of terminism implies that the regress argument is not a universal problem but a artifact of a specific, demanding picture of justification. The regress argument assumes that justification requires a transfer of warrant along a chain that must end in something intrinsically warrant-bearing. Terminism rejects this presupposition. It suggests justification is a status conferred by successful defense rather than a property inherited from a source. If terminism is correct, the regress is vicious only if we insist on a structuralist account of warrant. By shifting to a dialectical account, the regress dissolves. Thus, terminism is a viable fourth option, but only when understood as a theory of doxastic justification grounded in normative dialectical practices rather than individual psychological states. It shows that the regress problem presses only upon those who demand justification be independent of human inquiry.

  Marking scheme

  **Total: 20 Marks**

  1.  **Taxonomy Analysis (5 marks)**
      *   **A (5):** Identifies the deep divide (source of warrant/why regress stops) rather than just structural shapes (linear/circular). Clearly distinguishes terminism based on dialectical status vs. intrinsic properties.
      *   **B (3-4):** Correctly defines the three traditional views but treats the distinction as merely structural (diagrams). Identifies terminism as different but vaguely.
      *   **C (0-2):** Recites definitions without analyzing the underlying disagreement. Confuses terminism with one of the traditional three.

  2.  **The Arbitrariness Objection (5 marks)**
      *   **A (5):** Engages the "anything-goes" charge seriously. Proposes a normative constraint on "live challenges" (social/epistemic norms) to avoid subjectivity.
      *   **B (3-4):** Acknowledges the objection but offers a weak solution (e.g., "people aren't usually stubborn") or dismisses it too quickly.
      *   **C (0-2):** Ignores the objection or accepts it as fatal without argument.

  3.  **Propositional vs. Doxastic Distinction (5 marks)**
      *   **A (5):** Uses the distinction to *solve* the arbitrariness problem (e.g., terminism works for doxastic, fails for propositional). Shows functional application.
      *   **B (3-4):** Defines the distinction correctly but applies it generically without linking it to the viability of terminism.
      *   **C (0-2):** Fails to define the distinction or conflates the two terms.

  4.  **Meta-Conclusion & Commitment (5 marks)**
      *   **A (5):** Takes a clear verdict (viable distinct option or collapse). Explains what this implies about the regress argument itself (e.g., it begs the question). Includes a specific objection/response within the argument.
      *   **B (3-4):** Reaches a conclusion but hedges ("both sides have points"). Mentions the regress argument implication superficially.
      *   **C (0-2):** No clear conclusion (just summarizes positions). No mention of what this means for the regress argument.

  Typical errors

  1.  **Taxonomy:** Treats foundationalism/coherentism/infinitism as merely different drawings of arrows rather than competing accounts of warrant.
  2.  **Arbitrariness:** Dismisses terminism as "subjective" without considering whether normative constraints can regulate live challenges.
  3.  **Prop/Doxastic:** Defines the distinction accurately but fails to use it to rescue terminism from the anything-goes objection.
  4.  **Commitment:** Hedges in the conclusion ("terminism has strengths and weaknesses") rather than defending a specific verdict on its viability.
