      *   *Environmental Ethics:* Do non-sentient life forms have intrinsic value? If they don't feel pain, does destroying them matter? (Biocentric egalitarianism vs. Anthropocentrism).
      *   *Consent:* The crew didn't consent to the voyage. The future children don't consent to the terraforming. Who speaks for them?
