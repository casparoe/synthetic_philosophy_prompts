      *   *Scene 4: The Charter.* Reading the conflicting clauses. "Secure presence" vs. "Not supplant."
      *   *Scene 5: The Decision.* Elara realizes there is no clean answer. She chooses based on a specific interpretation of "backup rationale."
      *   *Scene 6: The Aftermath.* The release begins. She watches.

  6.  **Refining the Philosophy:**
