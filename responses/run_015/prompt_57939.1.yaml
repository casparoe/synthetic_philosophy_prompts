      *   **Conflict:** The decision needs to be made. The story should focus on the moment of decision or the immediate aftermath.
      *   **Antagonist/Foil:** Someone representing the other side. Maybe Commander Halloway (pro-terraform) or a fellow scientist (pro-preservation). Let's use a colleague, Kael, who argues for preservation, to highlight the internal conflict. Or better, keep it internal with the data and the Charter. Let's introduce a counterpart, maybe the Mission Commander, to force the decision.
