answer: |-
  The sample vial sat on the desk, glowing with a faint, bruised violet light. Under the microscope, the microbial mats of Aurelia looked like miniature cities built by blind architects, layering calcium carbonate into spiraling towers that breathed carbon dioxide and exhaled nothing humans could use. They were complex, self-replicating, and utterly indifferent. They did not feel pain. They did not know they were dying.

  Elara rubbed her eyes. The ship's air recyclers hummed with a rattling cough that had become the rhythm of her life. She was forty-two, ship-born, and the only person alive authorized to certify the planetary survey. Her signature would trigger the terraforming release canisters. Her refusal would condemn the *Aethelgard* to orbit until the hull breached.

  The door chime sounded. Commander Vance entered without waiting. He looked older than his file photo, the gravity of command etching deep lines around a mouth that rarely smiled.

  "Systems report says life support is at twelve percent efficiency," Vance said. He didn't look at the vial. He looked at Elara.

  "Thirteen," she corrected automatically. "But the decay curve is exponential. We have six months, maybe eight."

  "And the children?"

  "Cryo-stasis is stable. But they wake eventually." Elara touched the vial. "The Charter, Vance. Clause 4: 'Secure a self-sustaining human presence.' Clause 9: 'Do not supplant an existing biosphere where one is found.'"

  "Clause 9 has an exception for hostile environments."

  "This isn't hostile. It's alive."

  "It's slime, Elara." Vance stepped closer, his voice dropping. "It's not sentient. It doesn't suffer. If we land, we kill the mats. If we don't, we kill the crew. We kill the next generation. Which death carries weight?"

  Elara turned to the window. Below, Aurelia spun in silence. The violet continents were vast, ancient structures built over millions of years. They were the only other example of life in the galaxy, now that Earth had gone silent. "Intrinsic value isn't dependent on pain," she said. "Biocentric ethics argues that life has a telos, a purpose of its own. To extinguish a unique evolutionary path because it inconveniences us... that's the logic that ruined Earth."

  "We didn't ruin Earth," Vance said sharply. "We fled it. And we were sent to ensure humanity doesn't end. That is the primary directive. The hedge against catastrophe."

  "But the catastrophe has already happened," Elara said. "Contact is lost. If Earth is gone, are we the backup? Or is this?" She gestured to the vial. "If we sterilize this world to make a copy of the one we lost, we admit that human survival is the only metric that matters. We become the universe's monoculture."

  Vance sighed, leaning against the bulkhead. "The unborn, Elara. Think of them. They didn't choose this voyage. They didn't choose to be born in a tin can. Do they not have a right to a sky they can breathe without filters? A right to walk on ground that doesn't vibrate with engine noise?"

  "They have a right to exist," Elara countered. "But do they have a right to exist at the expense of everything else? We are asking them to inherit a world founded on genocide. Not of people, but of a biosphere. We teach them that life is only valuable if it serves us."

  "They won't care about philosophy if they're suffocating," Vance said. "Look, I'm not asking you to be happy about it. I'm asking you to be responsible. The backup rationale: if Earth is gone, the prohibition on supplanting is voided because the 'hedge' is now the only plant left in the garden."

  Elara looked back at the microscope. The violet towers were beautiful. They were also dead ends. They would never build a mind, never look up at the stars and wonder. They were trapped in their chemistry, just as the crew was trapped in their ship.

  Was there a difference?

  She thought of the children in the cryo-bay. She had taught some of them before they were put under. They asked about trees. They asked about rain that didn't taste of recycled sweat. They had no consent to give. They were entirely dependent on her judgment. To preserve the mats was to prioritize the dead past over the living future. To destroy the mats was to prioritize the future over the intrinsic worth of the other.

  There was no clean calculus. There was only blood on the hands, either way.

  "The Charter doesn't define 'supplant'," Elara said quietly. "Does enclosure count? If we live in domes, we don't supplant. We coexist."

  "And when the domes fail?" Vance asked. "When the seals crack in fifty years? Do we let them die to keep the violet slime pure? That's not ethics, Elara. That's fetishization."

  Elara picked up the stylus. Her hand hovered over the certification pad. The cursor blinked, a rhythmic pulse like a heartbeat. She thought about the concept of stewardship. Was it stewardship to preserve a thing in glass, or to allow life to flourish even if it changed form? If humanity was the only vector for consciousness in this sector, did consciousness have a duty to propagate itself, even aggressively?

  Or was that the arrogance that killed Earth?

  "Six months," she said.

  "Elara?"

  "If we release the canisters, the oxygenation takes decades. The mats die immediately in the target zones, but the periphery might survive in the deeps. We map the deeps. We preserve samples. We teach the children what was here."

  Vance nodded slowly. "A record. A memorial."

  "A confession," Elara corrected.

  She looked at the vial one last time. The violet light seemed to dim, or perhaps it was the ship's power fluctuating again. She thought of the unborn children waking up to a blue sky, running on grass that was engineered, breathing air that was manufactured. They would never know the weight of this moment. They would never know the cost of their breath. That ignorance was a gift she was giving them, and a burden she was taking.

  There was no consent from the future. There never was. There was only the present making choices that the future would have to live with.

  Elara pressed the stylus to the pad. The certification code accepted. A low chime resonated through the deck, signaling the arming of the release mechanisms. Somewhere below, the canisters were already detaching, falling toward the violet crust to burn the ancient cities away and build a new world in their ashes.

  "Thank you," Vance said. He sounded relieved, and haunted.

  "Don't thank me," Elara said, turning away from the window. "Just make sure it was worth it."

  Vance left the room. Elara remained alone with the hum of the ship. She picked up the sample vial and placed it in the secure archive, locking it behind glass. It would sit there forever, a monument to a world that was, and a warning to the children who would inherit the world that was made.

  Below, the first canister struck the atmosphere. A streak of white fire tore through the violet haze, the beginning of a storm that would wash the sky clean. Elara watched the fire fall, waiting to see if the world would breathe, or if it would only scream.
