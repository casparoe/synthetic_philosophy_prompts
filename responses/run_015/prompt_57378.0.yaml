answer: |-
  On my account, neither A nor M is diseased, provided we specify the reference class correctly. The function of the inflammatory response is to clear pathogens and prevent infection, contributing to survival and reproduction. However, reference classes are not determined by raw population frequency alone, but by uniform functional organization. Because M involves a heritable germline modification that fundamentally alters physiological design, M-carriers and A-carriers constitute distinct biological subgroups, much like distinct sexes or age cohorts. We must evaluate M-carriers against the statistical typicality of other M-carriers, and A-carriers against A-carriers. Within the M class, low inflammation is statistically typical and functions adequately to ensure survival given the available infrastructure; within the A class, standard inflammation is statistically typical and functions adequately provided antibiotics are accessible. Since neither group exhibits subnormal functioning relative to its own biological reference class, neither is diseased.

  This resolves your instability objection. If M spreads until A is one in five hundred, the verdict does not reverse, because the rarity of A does not dissolve the biological distinction between the two groups. Disease status turns on whether a part fails to perform its typical contribution to survival for *that type* of organism, not on whether the type is popular. A rare biological type is not thereby pathological; otherwise, natural mutations would be diseases simply by virtue of being new. Regarding the environment, we measure function against the environment in which the organism actually lives, because function is a causal relation between a mechanism and its effects in context. Choosing the actual environment is not a value judgment about whose survival counts; it is a factual acknowledgment that biological systems operate where they are, not where their ancestors were. Survival and reproduction are not chosen ends in this theory; they are the descriptive conditions of being an organism at all.
