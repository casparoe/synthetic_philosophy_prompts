      *   *Worry 4: Hyperreal Utilitarianism & Economics Theorems.*
          *   *Hyperreal:* Uses ultrafilters to define limits. TTFR uses explicit sequences. Hyperreals give a *single* number (relative to an ultrafilter). TTFR admits *multiple* verdicts. They are different. Hyperreals hide the frame in the ultrafilter choice.
          *   *Economics (Lauwers, Vallentyne, etc.):* Strong Pareto + Anonymity (permutation invariance) is impossible for a complete ordering. TTFR sacrifices Anonymity (frames order space) to keep Strong Pareto (in the limit).
