      *(Self-Correction during drafting)*: I need to make sure I don't just say "Non-locality is bad." I need to explain *why* it destroys Tier 1. If my happiness depends on the infinite sum of others' happiness, I can't calculate my local contribution without knowing the global sum. Thus, Tier 1's "ignore the background" instruction is impossible to follow.

