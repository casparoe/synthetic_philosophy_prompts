answer: |-
  This is a rigorous and honest inventory of moral intuitions. You have identified the central tension in reparations theory: the conflict between *corrective justice* (fixing a specific wrong) and *distributive justice* (fixing a structural outcome), complicated by the passage of time and the identity of the parties.

  Below is an analysis of your current principle, two competing frameworks, and the application of all three to your new cases and questions of form.

  ### I. Your Current Principle: Unjust Enrichment (Tested and Repaired)

  **The Principle:** *Agents (individual or collective) who currently hold assets or advantages derived from a historical wrong owe restitution to the current occupants of the wronged party's position, measured by the value of the gain retained, not the harm suffered.*

  **The Test:**
  *   **Matches:** Case 7 (Institution holds gain/building), Case 5 (Extraction = Gain, regardless of net welfare), Case 10 (Mother = traceable gain; Grandfather = dissipated gain).
  *   **Fails:** Case 6 (Gain destroyed, yet you want symbolic redress), Case 2 vs. 3 (Both hold gain, but only one returns the specific asset), Case 8 (No recipient, yet you feel unease).

  **The Repair:**
  To save your verdicts, the principle requires two addendums:
  1.  **The Disruption Constraint:** Specific restitution (returning the *thing*) is mandatory only where it does not impose existential hardship or massive displacement on innocent third-party occupants. (Explains Case 2 vs. 3).
  2.  **The Expressive Residual:** Where material gain has been extinguished, a residual duty of acknowledgment and symbolic redress remains to negate the *moral* validity of the past enrichment, even if the *material* value is gone. (Explains Case 6).

  **The Cost:**
  *   **Case 8:** If you accept the *Expressive Residual*, Case 8 becomes a **Yes**. If the duty is to negate the moral validity of the wrong, the dissolution of the community does not erase the debt; it passes to the state as trustee. Your "No" here is inconsistent with your "Weak Yes" in Case 6. You must either accept a symbolic monument/trust for Case 8 or admit Case 6 is also a No.
  *   **Case 9:** This principle handles Case 9 well (Buyer's gain is independent of Seller's wrong), but it forces you to ignore the *moral hazard* of the seller. It treats the transaction as purely economic. If you feel the "clean hands" instinct elsewhere, this principle suppresses it artificially.

  ### II. Competing Principle A: Harm and Worsening (Counterfactual Welfare)

  **The Principle:** *Reparations are owed by the successors of wrongdoers to the successors of victims when the wrong caused the victims to be worse off than they would have been in the closest possible world where the wrong did not occur. The amount tracks the difference in welfare.*

  **Case Ties:**
  *   **Motivated by Case 3:** The "measurably worse off in every social statistic" clause is the engine here. It justifies the "messy yes" because the harm is structural, not just proprietary.
  *   **Motivated by Case 1:** The survivors are worse off due to internment; compensation restores the baseline.

  **Verdicts to Abandon:**
  *   **Case 5:** You explicitly reject the "net benefit" offset (railways/schools). A Harm principle *must* accept offsets. If the colony is richer than it would have been without colonization, the debt is zero or reversed. To keep your Case 5 verdict, you must reject this principle.
  *   **Case 2:** An innocent buyer at auction did not *cause* the harm (the theft did). A pure Harm principle struggles to justify stripping the buyer of the painting unless it leans heavily on property law conventions. It focuses on the *injury*, not the *holding*.
  *   **Case 6:** If the wealth was destroyed and the society is now poorer, the "worsening" calculation becomes complex. If the wrongdoer society is now the victim of its own past actions (war loss), the Harm principle might suggest no transfer is possible or just.

  **Weighted Case:** **Case 5** is carrying more weight than it can bear here. Your intuition that "development does not justify theft" is a property/sovereignty intuition, not a welfare intuition.

  ### III. Competing Principle B: Civic Standing (Relational/Political)

  **The Principle:** *Reparations are a political duty owed by a polity to its members (or to other polities) to restore equal civic standing and trust breached by state-sanctioned injustice. The goal is not compensation but the reconstruction of a legitimate political relationship.*

  **Case Ties:**
  *   **Motivated by Case 4:** You want "programmatic, group-level redress," not tort payouts. This is the language of civic repair, not private law.
  *   **Motivated by Case 7:** The abuse was a betrayal of institutional trust; the redress is institutional reform and acknowledgment.
  *   **Motivated by Case 1:** This is the paradigmatic case of state-citizen breach.

  **Verdicts to Abandon:**
  *   **Case 2:** This is a private law dispute between heirs and a buyer. The state is not the primary wrongdoer (it wasn't state theft, presumably), and civic standing is not the primary issue. This principle would say "No" or "Not a reparations issue, but a legal property issue."
  *   **Case 5:** Colonialism is often an *international* wrong, outside a shared civic framework. Unless you posit a global civic standing, this principle struggles to bind the colonizer unless they still claim political authority over the colony.
  *   **Case 10:** Your distinction between Grandfather (No) and Mother (Yes) is hard to explain here. If the Mother's fraud breaches trust, why doesn't the Grandfather's underpayment breach civic standing? This principle might force a "Yes" on the Grandfather if it was systemic exploitation, contradicting your "dissolves into taxation" verdict.

  **Weighted Case:** **Case 10 (Grandfather)** is the anchor here. Your refusal to accept intergenerational private debt suggests you view reparations as *political*, not *familial*. But if they are political, why does Case 2 (private painting) get a Yes? You are mixing private property norms with public justice norms.

  ---

  ### IV. Verdicts on the Three New Cases

  Here is how the three principles (Repaired Enrichment, Harm, Civic) adjudicate the cases you omitted.

  **1. The "Lawful at the Time" Case**
  *(e.g., Slavery or land seizure legal under domestic law of the era.)*
  *   **Repaired Enrichment:** **Yes.** Law does not sanitize unjust gain. The asset was taken without moral title.
  *   **Harm:** **Yes.** Welfare was reduced regardless of legality.
  *   **Civic:** **Yes.** Laws that violate fundamental standing are illegitimate; the duty is to repair the breach of natural justice.
  *   **Synthesis:** All three converge on **Yes**. Your intuition in Case 5 (rejecting colonial "civilizing" justifications) suggests you already hold this view: legality is not morality.

  **2. The "Fortune Reversal" Case**
  *(Victims' descendants are now the dominant economic class; Wrongdoers' descendants are impoverished.)*
  *   **Repaired Enrichment:** **No (Material) / Yes (Symbolic).** If the wrongdoer holds no gain, the material debt is extinguished (Case 6 logic). The Expressive Residual remains.
  *   **Harm:** **No.** The goal is to fix welfare disparities. If the disparity is reversed, the debt is cancelled or reversed.
  *   **Civic:** **No.** Civic standing is currently equal or tilted the other way. Redress would undermine current legitimacy.
  *   **Synthesis:** This tests your commitment to *Wrongdoing* vs. *Outcome*. If you say **Yes** here, you are a Deontologist (the act must be cleansed). If you say **No**, you are a Consequentialist (the outcome matters). Given Case 6, you likely lean toward **Symbolic Yes, Material No**.

  **3. The "Structural/No Discrete Wrongdoer" Case**
  *(e.g., Housing segregation via private bank redlining, no specific law, no single actor.)*
  *   **Repaired Enrichment:** **Weak No.** Hard to identify who holds the specific gain. Banks may have merged or failed. Gains are diffuse.
  *   **Harm:** **Strong Yes.** The group is measurably worse off. The state is liable for failing to prevent the harm.
  *   **Civic:** **Strong Yes.** The state failed to ensure equal standing. The redress is policy change, not necessarily checks to individuals.
  *   **Synthesis:** This is the crux of Case 4 (Slavery). Your desire for "programmatic, group-level redress" suggests you know Enrichment fails here (too many dead ends), so you are implicitly relying on **Civic Standing** for the hardest cases, while using **Enrichment** for the cleaner cases (Painting, Internment).

  ---

  ### V. Form and Standing

  **1. Is Form settled by the Principle?**
  Yes, largely.
  *   **Enrichment** demands **Restitution**. Return the painting (Case 2). Return the value of the minerals (Case 5). If the thing is gone, pay the value (Case 6).
  *   **Harm** demands **Compensation**. Cash transfers, social services, healthcare—whatever closes the welfare gap.
  *   **Civic** demands **Recognition and Reform**. Apologies, voting rights, curriculum changes, institutional oversight (Case 7).

  **Your Conflict:** You want Enrichment's logic for the painting (return the object) but Civic logic for slavery (programmatic redress). This implies you believe *some* wrongs corrupt the political order (requiring civic repair) while others are merely property disputes (requiring restitution). The dividing line seems to be **State Involvement**. When the State is the wrongdoer (Case 1, 4, 5), you want Civic form. When private parties are involved (Case 2, 10), you want Restitution form.

  **2. Who has Standing to Settle?**
  If the claimant community is divided (e.g., some want cash, some want land, some want apology):
  *   **Enrichment:** The *owners* of the claim decide. If the heirs disagree, the debt is stalled until they resolve it (like an estate).
  *   **Civic:** The *representative body* decides. This is dangerous. It risks creating "leaders" who do not represent the harmed.
  *   **Your Verdict:** Given Case 4 (group-level redress), you must accept a **Democratic Mandate within the Group**. However, to protect against the "no one to organize" problem in Case 8, you must concede that where no organization exists, the **State acts as Trustee**.
  *   **The Hard Truth:** If you accept the State as Trustee for Case 8, you must accept it for Case 4. This means the State (the wrongdoer) might define the terms of its own penance. To avoid this, you must insist on **Independent Arbitration** funded by the wrongdoer but staffed by the claimants.

  ### VI. Summary of What You Must Give Up

  To achieve coherence, you cannot keep all ten verdicts. You have to choose your anchor.

  1.  **If you anchor on Unjust Enrichment (Your current toy):**
      *   **Give Up:** Case 8 (Must become a Yes, symbolic or trust).
      *   **Give Up:** Case 6 (Must be purely symbolic, no material payment if gain is truly zero).
      *   **Explain:** Case 2 vs. 3 via the "Disruption Constraint" (Land involves innocent residents' homes; Painting involves an asset).

  2.  **If you anchor on Civic Standing (Best for Case 4 & 5):**
      *   **Give Up:** Case 2 (This becomes a private legal matter, not reparations).
      *   **Give Up:** Case 10 (Grandfather case becomes harder to dismiss if it was systemic).
      *   **Gain:** A robust explanation for why Slavery (Case 4) requires structural change, not just checks.

  3.  **If you anchor on Harm (Best for Case 3):**
      *   **Give Up:** Case 5 (Must accept "net benefit" offsets).
      *   **Give Up:** Case 2 (Innocent buyer shouldn't pay for harm they didn't cause).

  **Recommendation:**
  Your intuition in Case 10 (Grandfather vs. Mother) is the strongest signal. You distinguish between *traceable, specific unjust assets* (Mother/Painting) and *diffuse, historical economic advantage* (Grandfather/Slavery).
  This suggests a **Hybrid Principle**:
  *   **Specific Restitution** applies where the asset is traceable and return is feasible (Cases 2, 7).
  *   **Civic Redress** applies where the wrong was state-sanctioned and the gain is diffuse (Cases 1, 4, 5).
  *   **Symbolic Acknowledgment** applies where the gain is extinguished but the wrong remains unacknowledged (Cases 6, 8).

  This hybrid saves almost all your verdicts, but it forces you to admit that "Reparations" is not one thing. It is three different moral practices sharing a name. The tension you feel between Case 2 and Case 3 is not a failure of your reasoning; it is the friction between Private Restitution and Public Justice.
