  7.  **Refining the Correlation Math:**

      *   User's model: Source $S \sim Bern(0.6)$. Voter $V_i = S$ w.p. 0.9, else $V_i \sim Bern(0.6)$.
      *   Marginal $P(V_i=1) = 0.9(0.6) + 0.1(0.6) = 0.6$. Correct.
