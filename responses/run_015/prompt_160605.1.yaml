          *   *Actually,* the prompt asks about the "adding a voter makes it worse" claim. This refers to the *Heterogeneous Competence* nuance. If you add a voter with $p < \text{current group average}$, it can drag the group down even if $p > 0.5$.
          *   *Revision:* Let's swap Round 5 for the "Asymmetric Costs" round (User's final request) and integrate the "Weights" idea into the debrief or a quick variant if time permits. The Asymmetric Costs round is crucial for the "optimal rule" lesson.
      *   *Round 6 (Asymmetric Costs):* Convicting innocent is bad.
          *   Mechanism: Penalty for False Positive (Type I) is 10 chips. Penalty for False Negative (Type II) is 1 chip.
