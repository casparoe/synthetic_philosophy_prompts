      *   *Risk:* This is tight. I need to cut Round 3 (Incompetence) if time runs out, or merge it. Actually, Correlation is the most important user request. Incompetence is standard CJT. Costs are the "wrinkle".
      *   *Decision:* Run Round 1 (Baseline), Round 2 (Correlation), Round 3 (Costs). Cut Incompetence ($p<0.5$) because Correlation ($p=0.6$ but correlated) demonstrates the failure of aggregation better for the "why did we fail?" narrative. $p<0.5$ is too obvious ("we were stupid"). Correlation feels like "we were smart but failed."
      *   *Wait, User wants to feel "more voters is better... isn't carried by number of heads".* Round 2 (Correlation) does this best. Round 3 (Incompetence) does the $p<0.5$ lesson. I'll keep Incompetence but make it quick (1 trial).
      *   *Revised Timeline:*
          *   0-10: Setup.
