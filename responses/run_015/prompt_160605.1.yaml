          *   Issue: If $p < 0.5$, larger groups are *worse*. A group of 3 with $p=0.45$ has majority accuracy $\approx 0.42$. A group of 15 has $\approx 0.39$. The difference is small (3%). Hard to see in a single session.
          *   *Better approach:* Make $p$ clearly below 0.5 (e.g., 0.4) or use the "Anti-Condorcet" trick (if everyone is wrong more than right, flip the vote). But the prompt wants them to feel the group doing *worse*. Let's stick to $p=0.45$ but emphasize the *trend* over trials, or simplify to $p=0.4$ for clearer contrast. Actually, the prompt asks about "adding a voter who is above chance makes the group worse." This is a specific theorem nuance (Nitzan & Paroush). It happens if weights are unequal or specific correlation structures exist. For a basic CJT intro, the main point is $p < 0.5$ makes large groups bad. Let's keep Round 2 simple: $p < 0.5$ shows large groups converge on wrong answer.
      *   *Round 3 (Cascade):* Expert speaks first.
          *   Risk: Students might just follow the expert regardless of their card. This demonstrates *social* influence, not necessarily statistical correlation, but it breaks independence. Good for the "independence" lesson.
      *   *Round 4 (Correlation):* Common source model.
          *   Model: Source $S$ is correct w.p. $\pi$. Voter $i$ sees $S$ w.p. $\rho$, else independent signal w.p. $p$.
          *   User's Model: Source correct w.p. 0.6. Voter copies source w.p. 0.9. Else independent (0.6).
          *   Marginal Competence Check:
              *   $P(V_i = Correct) = P(Copy) \cdot P(S=Correct) + P(Indep) \cdot P(Indep=Correct)$
              *   $= 0.9(0.6) + 0.1(0.6) = 0.6$. (Matches).
          *   Group Accuracy: If $\rho=0.9$, 90% of voters just copy the source. The group vote is effectively the Source vote.
          *   So Group Accuracy $\approx$ Source Accuracy = 0.6.
          *   Contrast: Round 1 was 0.78. Round 4 is 0.60. That is a *huge* gap. Very visible.
          *   Prep: Need to generate cards that look independent but share a hidden bit.
      *   *Round 5 (Weights):* Unequal competence.
          *   Logistically hard to assign different "powers" without confusion.
          *   Alternative: Give 3 people "double cards" or let them vote twice? Or just tell them 3 people have $p=0.9$ and others $p=0.6$.
