answer: |-
  Here is a complete, runnable session plan designed to fit your constraints (90 mins, 18 students, minimal prep, no early theory).

  ### 1. The Core Logic & Math Check

  **Your Intuition:** You are correct. The "magic" of the Condorcet Jury Theorem (CJT) relies on **Independence** and **Competence > 0.5**.
  **The "Adding a Voter" Myth:** You are half-remembering a nuance. In standard CJT (simple majority, odd $n$), adding a voter with $p > 0.5$ *always* increases (or maintains) group accuracy. It never makes it worse. The case where adding a voter hurts is when:
  1.  The group size is even (adding one breaks a tie, which might have been correct by chance).
  2.  **Heterogeneous Competence:** If you have a weighted voting system optimized for specific competencies, adding a low-competence voter can dilute the optimal weight distribution.
  *Decision:* For this session, stick to the standard theorem. Adding a competent voter helps; adding an incompetent one ($p<0.5$) hurts. We will demonstrate the $p<0.5$ case in Round 2.

  **Math Sanity Check:**
  *   **Round 1 (Baseline):** $n=15, p=0.6$. Group Accuracy $\approx 78\%$.
  *   **Round 2 (Correlation):** $n=15$, Marginal $p=0.6$, Correlation $\rho \approx 0.8$. Group Accuracy $\approx 60\%$ (collapses to source accuracy).
      *   *Gap:* 18 percentage points. Over 3 trials, you expect ~2.3 correct verdicts (Round 2) vs ~3.9 correct verdicts (Round 1). This is visible.
  *   **Round 3 (Incompetence):** $n=15, p=0.45$. Group Accuracy $\approx 39\%$.
      *   *Gap:* Massive. They will feel the group "amplifying error."

  ---

  ### 2. Prep Checklist (1 Hour Max)

  **Materials:**
  *   180 small slips of paper (cut A4 into 20 strips, then in half).
  *   18 Envelopes (or just fold slips and paperclip them).
  *   1 Bag of sweets/chips (approx. 50).
  *   Whiteboard & Markers (2 colors).
  *   Projector (for last 10 mins only).

  **The Card Generation Recipe (Excel):**
  You need 4 Rounds $\times$ 2 Trials per Round $\times$ 18 Students = **144 Slips**.
  *Do not hand write these.* Use this Excel logic to generate a print-ready sheet.

  **Setup:** Create a spreadsheet with columns: `Round`, `Trial`, `StudentID`, `Truth`, `Signal`.
  *   **Truth:** `=IF(RAND()<0.5, "GUILTY", "INNOCENT")` (50/50 base rate).
  *   **Round 1 (Baseline):** `Signal` = `Truth` with prob 0.6.
      *   Formula: `=IF(RAND()<0.6, Truth_Cell, IF(Truth_Cell="GUILTY","INNOCENT","GUILTY"))`
  *   **Round 2 (Correlation):** This requires a "Source" variable per Trial.
      *   Create a column `SourceSignal` (fixed for all 18 students in that trial). `=IF(RAND()<0.6, Truth_Cell, Flip)`
      *   `Signal` = `SourceSignal` with prob 0.9, else Independent (0.6).
      *   *Simpler Prep Hack:* To save prep time, hardcode the correlation. For Round 2, make 14 students copy the `Truth` exactly, and 4 students get random noise. This creates massive correlation without complex formulas. Marginal accuracy stays high, but independence is broken.
      *   *Recommended Hack for Speed:* For Round 2, Trial 1: Set 12 slips to match Truth, 6 slips random. Trial 2: 13 match, 5 random. This guarantees the correlation effect without complex Excel logic.
  *   **Round 3 (Incompetence):** `Signal` = `Truth` with prob 0.4. (Use 0.4 instead of 0.45 for a starker, faster-to-see failure).
  *   **Round 4 (Costs):** Same as Round 1 ($p=0.6$).

  **Printing:** Format the Excel sheet to print 20 slips per A4 page. You need 8 pages. Cut them. Sort them into 18 piles (one per student), each pile containing 8 envelopes (4 rounds x 2 trials). **Label the envelopes clearly: "ROUND 1 - TRIAL 1", etc.**

  **Room Layout:**
  *   3 Tables of 6 students.
  *   Whiteboard visible to all.
  *   Projector screen covered or off.

  ---

  ### 3. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Rules** | Hand out "Round 1" envelopes. **Rule:** "Do not open until told. Do not show cards. No talking during voting." Explain payoff: 1 sweet per correct group verdict. |
  | **10-25** | **Round 1 (Baseline)** | 2 Trials. <br>1. Open envelope. Read signal.<br>2. Secret vote (hold up fingers 1=Guilty, 2=Innocent).<br>3. Count majority.<br>4. **Reveal Truth** (You announce it).<br>5. Award sweets.<br>6. Repeat Trial 2. |
  | **25-40** | **Round 2 (Correlation)** | 2 Trials. <br>Same procedure. <br>*Crucial:* Do not explain why cards might look similar. Let them feel the confidence, then the failure. |
  | **40-50** | **Round 3 (Incompetence)** | 2 Trials. <br>Same procedure. <br>Expect confusion. "Why are we so wrong?" |
  | **50-60** | **Round 4 (Costs)** | 2 Trials. <br>**New Rule:** "False Conviction costs 5 sweets. False Acquittal costs 1 sweet. Correct = 1 sweet." <br>Run vote. Calculate score *after*. |
  | **60-70** | **Buffer / Discussion** | If running late, cut Round 3. Use this time for students to compare notes *before* the theory reveal. "Why did Round 2 fail?" |
  | **70-90** | **Debrief & Theory** | Projector ON. Map experience to CJT assumptions. Reveal the math. |

  ---

  ### 4. Minimal Facilitator Script

  **Intro (00:00):**
  "Welcome. You are a jury. There is a defendant. They are either Guilty or Innocent. You will receive a piece of evidence (a card). It is not perfect. Your goal: Maximize the group's sweets.
  Rules:
  1. Open envelope only when I say.
  2. No talking during the vote.
  3. Vote by show of hands.
  4. Majority wins.
  5. If the group is right, everyone gets a sweet."

  **Round 2 Transition (25:00):**
  "New case. Same rules. Evidence quality is the same as before. Open Round 2."
  *(Say nothing about the correlation. If they ask, "Is the evidence different?" say "The generation process is consistent with the instructions.")*

  **Round 4 Transition (50:00):**
  "New case. Same evidence. **New Scoring:** If we convict an Innocent person, we lose 5 sweets from the pot. If we acquit a Guilty person, we lose 1 sweet. Correct verdict adds 1 sweet.
  *Note:* You still vote by majority, but think about the risk."

  **Debrief Start (70:00):**
  "Look at the board. Round 1: We won ~75%. Round 2: We won ~60%. Round 3: We won ~40%.
  Why? The cards looked the same. The rules were the same. What changed?"

  ---

  ### 5. The Debrief (Mapping Experience to Theory)

  **Projector Slide 1: The Results Table**
  | Round | Indiv. Accuracy | Group Accuracy | Key Feature |
  | :--- | :--- | :--- | :--- |
  | 1 (Baseline) | 60% | ~78% | Independent Signals |
  | 2 (Correlation) | 60% | ~60% | **Shared Source** |
  | 3 (Incompetence) | 40% | ~40% | **p < 0.5** |

  **Talking Points:**
  1.  **Round 1 vs Round 2 (Independence):** "In Round 1, your errors cancelled out. In Round 2, your errors were synchronized. The theorem requires **Independence**. If you all copy the same source, $N=15$ is mathematically the same as $N=1$."
  2.  **Round 3 (Competence):** "When $p < 0.5$, the 'Wisdom of Crowds' becomes the 'Madness of Mobs'. More voters just confirms the error. (Mention: If you knew $p<0.5$, you should flip the vote)."
  3.  **Round 4 (Costs):** "Majority rule minimizes *total errors*. It does not minimize *costly errors*. If Type I errors are worse, the optimal threshold moves from 50% to ~80%."
  4.  **The Asymptotics (The "1000 Voters" Question):** "We only ran 15 voters. The theorem says as $N \to \infty$, accuracy $\to 100\%$ (if $p>0.5$ and independent). We can't test that here. But look at Round 1: 60% individual became 78% group. With 100 voters, that 60% becomes 99%."

  ---

  ### 6. Blunt Truths: What Will Go Wrong

  1.  **Prep Time Underestimation:** Cutting 144 slips and sorting 18 piles takes longer than you think.
      *   *Fix:* Use a paper guillotine. Don't fold envelopes; just paperclip the slips into 18 bundles. Label the bundles "Round 1", "Round 2"...
  2.  **The "Meta-Game":** A probability-literate student will count the Guilty/Innocent cards in Round 1 and announce "The base rate is 50%, signal is 60%."
      *   *Fix:* Pre-empt this. "Don't try to calculate the odds. Just trust your card." If they persist, "That's a valid strategy, but stick to the signal for now."
  3.  **Round 2 Noise:** You might get unlucky and Round 2 works perfectly by chance.
      *   *Fix:* Run 3 trials if time permits, or have a "Backup Trial" set of cards ready in your pocket that guarantees high correlation failure.
  4.  **Dominant Voices:** During the "no talking" phase, someone will whisper.
      *   *Fix:* Enforce strict silence. "If you talk, your table loses 2 sweets."
  5.  **The "Adding a Voter" Question:** A student will ask, "Does adding a voter ever hurt?"
      *   *Fix:* "In this specific setup (simple majority, equal weight), no. But if we change the weights or the costs (like Round 4), yes. We'll touch on that in the advanced module."

  ### 7. What The Game Cannot Reproduce

  **The Asymptotics.**
  You cannot physically simulate $N=1000$. The students might leave thinking "Okay, 15 people is better, but is it *that* much better?"
  **The Fix:** In the last 5 minutes, use the projector to show a **single graph**.
  *   X-axis: Number of Voters (1 to 100).
  *   Y-axis: Group Accuracy.
  *   Line 1: $p=0.6$ (Steep rise to 1.0).
  *   Line 2: $p=0.5$ (Flat at 0.5).
  *   Line 3: Round 2 Correlation (Flat at 0.6).
  *   *Say:* "This is what would have happened if we kept adding you. Round 1 goes here. Round 2 stays stuck here."

  ### 8. Final Prep Formula (Copy-Paste to Excel)

  To generate the **Round 2 (Correlation)** slips quickly without complex logic:
  1.  Column A: Student ID (1-18).
  2.  Column B: Truth (`=RANDBETWEEN(0,1)`).
  3.  Column C: Signal.
      *   For 12 students: `=B2` (Copy Truth).
      *   For 6 students: `=IF(RANDBETWEEN(1,10)<6, B2, 1-B2)` (60% Accuracy).
      *   *Why:* This guarantees high correlation visually and mathematically without needing a "Source" variable column. Marginal accuracy averages to ~0.6. Group accuracy will hover near 0.6 because the majority follows the 12 correlated voters.

  **Good luck. Keep the theory hidden until the end. Let the failure speak for itself.**
