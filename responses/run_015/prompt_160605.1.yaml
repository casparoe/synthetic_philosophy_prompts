      *   *Adding a voter:* Clarify the theorem. (Adding a voter with $p>0.5$ to an odd-sized majority group *always* helps in standard CJT. The user is remembering a nuance about even-sized groups or weighted voting. I will correct this gently).
      *   *Asymptotics:* Can't simulate $N=1000$. Use the projector at the very end to show a graph of the theoretical curve vs. their empirical data.

  6.  **Drafting the Content:**

      *   **Tone:** Professional, instructional, slightly conspiratorial (for the correlation round).
