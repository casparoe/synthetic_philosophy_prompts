answer: |-
  The stalemate is a substantive disagreement about the moral significance of personhood as a unit of segregation, obscured by formal impossibility theorems and an unresolved ambiguity about the normative location of the well-being zero point. Your measurement-theoretic hypothesis correctly identifies that totalism requires non-existence to correspond to the zero point of a ratio scale, but it misidentifies the source of conflict as the scale type rather than the moral status of that zero. Critical-level views demonstrate that one can retain ratio-scale measurability and summation while avoiding the Repugnant Conclusion by positing a critical level above neutral well-being, implying the core dispute is whether non-existence is morally neutral or whether it constitutes a baseline that must be exceeded to add value. Consequently, the debate is not verbal but turns on a substantive normative commitment regarding whether the value of a life is intrinsic or relative to a critical threshold.

  Your structural hypothesis is accurate insofar as the intuitive chains are informal proofs of impossibility theorems, such as those established by Arrhenius, which demonstrate that conditions like Non-Elitism, Dominance, and Separability are jointly inconsistent. The persistence of the debate indicates that proponents are silently rejecting different axioms: totalists preserve Separability and Dominance at the cost of Non-Elitism, while their opponents preserve Non-Elitism by sacrificing Separability or Dominance. Because these axioms are treated as pre-theoretic intuitions rather than derived principles, the argumentative chains fail to move anyone; they merely reveal which axiom a given theorist is already committed to abandoning.

  The person-moment wrinkle you identify is the critical front for progress because it isolates Person Separability as the hidden variable driving the intuition against the Repugnant Conclusion. The divergence in responses to the interpersonal versus intrapersonal versions suggests that many theorists accept Temporal Neutrality and additivity across moments but reject additivity across persons, treating personhood as a morally privileged boundary that blocks aggregation. This indicates that the question is not ill-posed but that standard welfarist frameworks fail to encode the moral importance of distinct persons versus distinct times. Progress would not come from settling the scale type or generating new impossibility results, but from developing a principled account of why welfare aggregation is permissible across time but restricted across persons, thereby either justifying the divergence between the interpersonal and intrapersonal cases or forcing a collapse of the intuition that distinguishes them.
