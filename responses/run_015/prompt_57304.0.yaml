prompt: |-
  I'm the clinical lead on a work group that maintains the diagnostic classification our country's public child and adolescent mental health services run on — it's what decides who gets seen, what a school has to put in place, and whether a family qualifies for a disability allowance. We meet twice a year, get about twenty-five proposals a cycle, mostly new categories, and each one gets a 90-minute session. Our review template checks four things: can the criteria be applied reliably by different raters, is there evidence the category picks out a real group, does it change what a clinician would actually do, and can it be told apart from what's already in the manual. That's the whole thing. Nothing in there asks what happens to the kids once the label exists, which is the part I care about most, because I keep coming back to Hacking's point that human kinds arent like chemical kinds — classify people and they move, they talk back, they reorganise themselves around the classification, and then the category's own evidence base shifts underneath it. He had the historical cases (fugue, multiple personality, and the fact that deleting a category remakes people just as much as adding one does), but I've never seen anybody turn that into something a committee can actually run on a Tuesday morning.

  So: write us the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops at "reject," where it stops at "we can't settle this, it goes to the full comittee as a values question rather than a fact question," and what would count as evidence for the looping questions given our limits — no social scientist on staff, one clinical epidemiologist who thinks all of this is untestable philosophy, and field trials that run six months maximum across about a dozen clinics. It has to handle deletions and pure renamings, not just additions. And be straight with me about which steps really follow from the theory and which ones are reasonable-sounding guesswork wearing a checklist costume, plus where the procedure will systematically misfire (my guess: rare categories, and anything that spreads through the internet faster than we can measure).

  Then run it on three live proposals.

  1. Adding "anticipatory school avoidance disorder," ages 8–15: recurrent physical complaints in the hour before school, refusal episodes at least three times a month across a term, marked relief when the school day is cancelled. I drafted this one myself. In the field trial, 41 of the 67 labelled kids were using the manual's own vocabulary to describe themselves at six-month follow-up, 9 of them said they'd started answering intake questions differently after seeing the criteria sheet, and three districts have already begun citing the label to approve full-time home education.
  2. Deleting "oppositional conduct pattern, juvenile" and folding it into a dimensional severity score inside a broader conduct category. Substance of the criteria barely changes; roughly four thousand kids currently carrying the label would stop having it.
  3. Renaming "childhood emotional lability syndrome" to "emotion dysregulation disorder." Identical criteria, identical prevalence, no clinical change whatever — a parent coalition wants it because the old name gets used as an insult in staff rooms. My own view is that a rename is a nothing-change and shouldn't eat a session; tell me if the procedure disagrees with me.

  Two housekeeping things. Don't hand me a bibliography or a reading list, I'm not chasing anything down — just make the reasoning visible. And every question the procedure asks has to be statable in plain language, because the final committee includes two parent representatives with no philosophy background and they will (rightly) refuse to sign off on anything that sounds like it's hiding behind jargon.

  On proposal 1, I know I'm attached in a way that isn't healthy. If the procedure kills it, kill it and say so plainly rather than softening the verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Lead of a work group maintaining a diagnostic classification for public child/adolescent mental health services.
      *   **Context:** Determines access to care, school support, disability allowance. Meets twice a year. 25 proposals/cycle. 90 mins/proposal.
      *   **Current Template:** Reliability, Validity (real group), Utility (changes treatment), Distinctiveness (from existing categories).
      *   **Problem:** Ignores the *consequences* of labeling (Hacking's "looping effects" / human kinds vs. natural kinds).
      *   **Task:** Write a new procedure (checklist/questions) that incorporates Hacking's insights into a practical committee setting.
      *   **Constraints:**
          *   No social scientist on staff.
          *   One skeptical clinical epidemiologist.
          *   Field trials: 6 months max, ~12 clinics.
          *   Must handle Additions, Deletions, and Renamings.
          *   Must distinguish between theory-driven steps and "guesswork wearing a checklist costume."
          *   Must identify systematic failure points (rare categories, internet spread).
          *   Plain language (for parent reps).
          *   No bibliography/reading list.
          *   **Crucial:** Run the procedure on three specific live proposals (School Avoidance, Deleting Oppositional Conduct, Renaming Emotional Lability).
          *   **Crucial:** Be honest about Proposal 1 (user drafted it, admits attachment) – if it fails, kill it plainly.

  2.  **Deconstruct the Theoretical Core (Hacking's Looping Effects):**
      *   *Idea:* Classifying people changes how they see themselves and how others treat them, which changes the behavior being classified.
      *   *Implication for Committee:* We aren't just discovering diseases; we are creating social tools that alter the landscape.
      *   *Translation to Checklist:* Need questions about *feedback loops*.
          *   Will this label change how the kid acts?
          *   Will this label change how the school/parents act?
          *   Will this label change how the clinician acts (beyond treatment)?
          *   Is the label sticky/stigmatizing/empowering?
          *   What happens if we *remove* it? (Loss of support vs. reduction of stigma).

  3.  **Drafting the Procedure (The "Looping Audit"):**
      *   *Goal:* Fit into a 90-minute session alongside existing criteria. Needs to be efficient.
      *   *Structure:*
          1.  **The Mirror Question (Self-Concept):** Does knowing this label change the patient?
          2.  **The Gatekeeper Question (System Response):** Does the label trigger automatic system responses (funding, exclusion, inclusion)?
          3.  **The Stability Question (Feedback):** Will the behavior change *because* of the label, making the criteria unstable over time?
          4.  **The Harm/Benefit Balance (Values):** Is the looping effect helpful or harmful?
      *   *Decision Rules:*
          *   *Reject:* If looping creates significant harm without mitigation.
          *   *Escalate:* If the looping effect is a values conflict (e.g., stigma vs. funding).
          *   *Pass:* If looping is neutral or beneficial and manageable.
      *   *Evidence Limits:* Acknowledge the 6-month trial limit. Use proxy evidence (parent reports, school policy checks).
      *   *Honesty Section:* Explicitly state where this is theoretical vs. empirical.

  4.  **Applying the Procedure to the Three Proposals:**

      *   **Proposal 1: Anticipatory School Avoidance Disorder (Addition)**
          *   *User's Draft:* High risk of looping. Kids using vocabulary, answering differently. Schools using it for home education (potential avoidance reinforcement).
          *   *Analysis:* The label is *already* looping (field trial data shows it). Kids are adopting the identity. Schools are using it to remove kids from school (potentially harmful long-term).
          *   *Verdict:* High risk. The "Gatekeeper Question" reveals it facilitates exclusion (home ed) rather than intervention. The "Stability Question" shows the criteria are contaminating the data (kids answering differently).
          *   *Honesty:* This needs to be a hard "Reject" or "Major Revision" based on the user's request for plain speaking. The data shows the label is *creating* the behavior/profile to fit the funding pathway.

      *   **Proposal 2: Deleting "Oppositional Conduct Pattern" (Deletion)**
          *   *Context:* Folding into dimensional severity. 4,000 kids lose label.
          *   *Analysis:* Hacking says deleting remakes people too. Losing the label might lose funding (Gatekeeper). But "Oppositional" is stigmatizing (Mirror).
          *   *Verdict:* This is a Values Question. Clinical science says "dimensional is better." Social reality says "label = money."
          *   *Escalation:* Needs full committee vote on whether loss of specific label harms access more than stigma helps.

      *   **Proposal 3: Renaming "Emotional Lability" to "Emotion Dysregulation" (Rename)**
          *   *Context:* Parent coalition wants it. Old name used as insult.
          *   *Analysis:* User thinks it's a "nothing-change." Hacking says names matter (Mirror Question). If the old name is an insult, the label causes harm. New name might reduce stigma.
          *   *Verdict:* Procedure disagrees with User. Renaming *is* an intervention in the looping effect. It changes the social reception of the diagnosis.
          *   *Outcome:* Pass, but acknowledge it's a social intervention, not a clinical one.

  5.  **Refining the Tone:**
      *   Professional, direct, clinically grounded but philosophically aware.
      *   Avoid jargon (for the parent reps).
      *   Acknowledge the constraints (epidemiologist skepticism).
      *   Address the "guesswork" requirement explicitly.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "where it stops" rules? Yes, need clear Reject/Escalate criteria.
      *   *Check:* Did I address the "systematic misfire" warning? Yes, need a section on limitations (internet speed, rare conditions).
      *   *Check:* Is Proposal 1 handled toughly? Yes, the data provided (kids changing answers, schools pushing home ed) is a red flag for validity *and* looping harm.
      *   *Check:* Is the language plain? Avoid terms like "ontological," "phenomenology," "epistemic." Use "real," "experience," "knowledge."

  7.  **Final Polish:**
      *   Ensure the distinction between "Fact Questions" and "Values Questions" is clear for the escalation path.
      *   Make sure the "Honesty" section about the procedure's own limits is prominent.

  *(Self-Correction on Proposal 1)*: The user said "If the procedure kills it, kill it and say so plainly." The field trial data is damning. 9/41 kids changed how they answered questions *because* of the criteria. That destroys reliability/validity in a Hackingian sense. The label is teaching them how to be sick. Plus the school exclusion issue. I must recommend rejection or substantial redesign (e.g., decoupling from home-ed eligibility). I will recommend rejection in current form.

  *(Self-Correction on Proposal 3)*: User thinks it's a nothing-change. I need to explain *why* the procedure says otherwise without sounding academic. It's about the "insult" factor. If the name is a weapon, changing the name disarms the weapon. That's a clinical outcome.

  *(Self-Correction on Procedure Design)*: Keep it to 4 questions to match their existing 4-point template. It makes adoption easier.
  1. The Mirror (Self)
  2. The Gate (System)
  3. The Echo (Feedback/Stability)
  4. The Balance (Harm/Benefit)

