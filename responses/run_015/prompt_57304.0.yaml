answer: |-
  Here is the procedure, followed by the analysis of your three proposals.

  ### The "Human Kinds" Audit Procedure
  **Purpose:** To assess how a diagnostic category changes the people it describes and the systems that manage them.
  **Time Required:** 15 minutes of the 90-minute session (leaves 75 for your existing four criteria).
  **Language:** Plain English (tested for non-specialist committee members).

  #### Part 1: The Four Questions
  *For each question, the proposal lead must provide a "Best Guess" based on field trials, literature, or stakeholder testimony.*

  **1. The Mirror Question (Self-Concept)**
  *   **Ask:** "If a child or parent learns this label, will it change how they see themselves or behave?"
  *   **Sufficient Answer:** "Yes/No/Unsure" plus one example (e.g., 'Kids might seek the label to get support' or 'Parents might feel blamed').
  *   **Evidence:** Field trial interviews, parent advocacy feedback, comparison to similar existing labels.

  **2. The Gatekeeper Question (System Response)**
  *   **Ask:** "Does this label automatically open or close doors (funding, school placement, legal status) regardless of clinical need?"
  *   **Sufficient Answer:** List the specific doors (e.g., 'Qualifies for Disability Allowance,' 'Allows home schooling,' 'Triggers mandatory reporting').
  *   **Evidence:** Policy documents, insurance codes, education law cross-references.

  **3. The Echo Question (Stability)**
  *   **Ask:** "Will the behavior we are measuring change *because* we are measuring it, making the criteria unstable in 2 years?"
  *   **Sufficient Answer:** "Yes/No/Unsure." If Yes, describe the drift (e.g., 'Symptoms will become more performative to match criteria').
  *   **Evidence:** Field trial data on symptom reporting over time, clinician observation of "teaching to the test."

  **4. The Balance Question (Harm vs. Help)**
  *   **Ask:** "If the label changes the child or system (as above), is that change mostly helpful or mostly harmful?"
  *   **Sufficient Answer:** A weighted judgment. (e.g., 'Harmful: increases stigma' vs. 'Helpful: unlocks funding').
  *   **Evidence:** Stakeholder impact statements (parents, schools, clinicians).

  #### Part 2: Decision Rules
  *Where the discussion stops and what happens next.*

  *   **STOP → REJECT:**
      *   If the answer to **The Echo Question** is "Yes, it creates symptom drift" AND there is no plan to mitigate it. (Reason: The category destroys its own scientific validity).
      *   If the answer to **The Balance Question** is "Mostly Harmful" (e.g., facilitates exclusion from school without increasing treatment).
  *   **STOP → ESCALATE (Values Vote):**
      *   If the answer to **The Gatekeeper Question** shows a conflict between clinical good and system rules (e.g., "Clinically we should delete this, but kids lose funding if we do").
      *   If the answer to **The Balance Question** is split (e.g., Parents say Helpful, Clinicians say Harmful).
      *   *Note:* This moves the decision from the Work Group to the Full Committee. It is no longer a fact question; it is a policy question.
  *   **PASS → APPROVE:**
      *   If looping effects are neutral or beneficial, and stability is maintained.

  #### Part 3: Limitations & Honesty Clause
  *This section must be read into the record for every proposal.*

  **Where this procedure is theory, not fact:**
  1.  **The Guesswork:** We cannot know for sure how a label changes a child's identity in 6 months. Question 1 and 3 rely on extrapolation. We are treating social prediction as clinical data.
  2.  **The Speed Limit:** This procedure assumes changes happen slower than our 6-month field trial. It will systematically misfire on:
      *   **Internet-Driven Conditions:** If a label trends on social media (TikTok, etc.), symptom drift happens in weeks, not months. We cannot measure this.
      *   **Rare Categories:** We won't have enough data in 12 clinics to see systemic looping.
  3.  **The Deletion Blindspot:** We are better at spotting harm in *adding* labels than *removing* them. Removing a label can strip identity and support just as violently as adding one.

  ***

  ### Application to Live Proposals

  #### Proposal 1: Adding "Anticipatory School Avoidance Disorder"
  **Status:** **REJECT (in current form)**

  **The Audit:**
  1.  **Mirror:** **Yes.** Your field trial data confirms this. 41 of 67 kids used the manual's vocabulary to describe themselves. 9 changed how they answered intake questions. The label is teaching them how to be the patient.
  2.  **Gatekeeper:** **High Risk.** Three districts are already using this to approve full-time home education. This label is becoming a key to exit the school system, not a tool to return to it.
  3.  **Echo:** **Yes (Critical Failure).** Because kids are changing how they answer questions to fit the criteria (9 cases in 6 months), the reliability of the diagnosis is already degrading. You are measuring their ability to read the manual, not their distress.
  4.  **Balance:** **Mostly Harmful.** While it validates distress, the primary system response (home education) isolates the child from the very environment they need to master to recover. It facilitates avoidance under a medical guise.

  **Verdict:**
  You asked for plain speaking. This proposal fails the **Echo Question**. A diagnostic category that teaches the patient how to simulate the criteria within six months is scientifically broken. It also fails the **Balance Question** because the "Gatekeeper" outcome (home schooling) contradicts the clinical goal (attendance/resilience).
  **Recommendation:** Do not add this as a disorder. If the distress is real, classify it as a symptom of an underlying anxiety or environmental mismatch, but do not create a standalone category that schools can use to discharge responsibility. The data shows the label is already doing harm.

  ***

  #### Proposal 2: Deleting "Oppositional Conduct Pattern, Juvenile"
  **Status:** **ESCALATE (Values Vote)**

  **The Audit:**
  1.  **Mirror:** **Yes.** Removing the label changes self-concept. "Oppositional" implies blame/choice. Moving to a "dimensional severity score" implies a trait/gradient. This reduces stigma (Helpful).
  2.  **Gatekeeper:** **High Risk.** 4,000 kids currently carry the label. In many systems, specific labels trigger specific funding streams. A "dimensional score" inside a broader category often fails to trigger the same automatic support.
  3.  **Echo:** **Unsure.** We cannot know in 6 months if the 4,000 kids will lose services. However, the *clinicians* will change behavior (scoring severity vs. checking boxes).
  4.  **Balance:** **Split.**
      *   *Clinical/Epistemological:* Helpful. Dimensional models are more accurate. "Oppositional" is stigmatizing.
      *   *Social/Economic:* Harmful. If the label is the currency for disability allowance, deleting it impoverishes the families.

  **Verdict:**
  This is a classic Hackingian conflict. Scientifically, the deletion is sound. Socially, it may be dangerous.
  **Recommendation:** This stops at **Escalate**. Your Work Group cannot decide this. It must go to the Full Committee as a values question: "Do we prioritize diagnostic accuracy over guaranteed funding continuity?" The parent representatives must vote on this, knowing that a 'Yes' to deletion might mean a fight for new funding codes before the manual publishes.

  ***

  #### Proposal 3: Renaming "Childhood Emotional Lability Syndrome" to "Emotion Dysregulation Disorder"
  **Status:** **APPROVE (with record)**

  **The Audit:**
  1.  **Mirror:** **Yes.** You view this as a "nothing-change." The procedure disagrees. The parent coalition states the old name is used as an insult in staff rooms ("He's just labile"). "Dysregulation" is clinical; "Lability" is often heard as "unstable/flighty." The label changes how teachers treat the child.
  2.  **Gatekeeper:** **Neutral.** You state identical criteria and prevalence. No funding doors close or open.
  3.  **Echo:** **No.** The behavior doesn't change, but the *reaction* to the behavior changes. The criteria remain stable.
  4.  **Balance:** **Mostly Helpful.** Reduces stigma without reducing access.

  **Verdict:**
  Your intuition was that this shouldn't eat a session. The procedure disagrees. Under Hacking's framework, renaming is an *intervention*. It changes the "human kind."
  **Recommendation:** Approve the rename, but record it as a **Social Intervention**, not a Clinical Update. This sets a precedent: we acknowledge that words have causal power. It validates the parent coalition's lived experience without requiring new field trials. It takes 10 minutes, not 90, but it must be minuted as a deliberate choice to reduce harm, not just semantic tidying.

  ***

  ### Summary of Systematic Risks for Your Committee

  1.  **The Internet Speed Limit:** As seen in Proposal 1 (kids learning the vocabulary), if a category spreads online, our 6-month field trial is too slow. We will always be measuring the *aftermath* of the looping, not the risk. **Mitigation:** For any category likely to be discussed on social media (eating, attention, mood), assume "Yes" on the Echo Question by default.
  2.  **The Rare Category Blindspot:** We cannot detect looping in rare conditions with 12 clinics. **Mitigation:** Require a "Sunset Clause." Any rare category added must be reviewed in 3 years, not 5, specifically for looping effects.
  3.  **The Epidemiologist's Objection:** Your colleague will argue Question 1 and 3 are untestable. **Response:** Acknowledge they are. We are not doing physics; we are managing a social system. We make predictions about human behavior in every treatment plan; this is just making the prediction explicit before we publish it globally.

  **Final Note to Clinical Lead:**
  On Proposal 1: You admitted attachment. The procedure killed it. The field trial data (kids changing answers to fit the manual) is the smoking gun. If you push this through despite the Echo failure, you are prioritizing the existence of the category over the stability of the science. Kill it.
