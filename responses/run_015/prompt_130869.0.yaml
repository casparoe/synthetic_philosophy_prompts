answer: |-
  Here is a consistency audit of your five-point framework, ranked by the severity of the tensions, with specific revisions and a strategic recommendation for a single unifying change.

  ### 1. Audit of Tensions

  #### **Tension A: The Instability of Correction [(1) + (5) vs. (2)]**
  *   **Severity:** **High (Genuine Tension)**
  *   **The Problem:** You worry that (1) and (5) make (2) unstable. This is correct. Point (2) establishes a rule (archives correct memory on non-identity facts), but Point (5) establishes an exception so broad ("institutions that systematically harmed the community") that it threatens to swallow the rule. In post-colonial or marginalized contexts, almost *any* state archive could be argued to be a product of harmful institutions. If (5) is invoked frequently, (2) loses its normative force, rendering your distinction between identity and non-identity facts practically useless.
  *   **Least Costly Revision:** **Reframe (5) from "Suspension" to "Epistemic Discounting."**
      *   Instead of suspending (2), specify that in cases of harmful provenance, the archival record loses its *prima facie* authority and must be corroborated by independent traces to correct memory. This preserves (2) as a general rule while acknowledging (5)'s moral insight without creating a binary on/off switch that destabilizes the system.

  #### **Tension B: The Materiality Conflict [(4) vs. (5)]**
  *   **Severity:** **High (Genuine Tension)**
  *   **The Problem:** Point (4) claims material traces provide "objective falsification conditions." Point (5) expresses skepticism about the archive (the primary repository of material traces). If the archive is the main source of "material traces," (5) undermines (4). If archives are tainted, they cannot objectively falsify anything. This creates an epistemological crisis: if we cannot trust the traces, what does (4) falsify?
  *   **Least Costly Revision:** **Distinguish "Archival Record" from "Material Traces."**
      *   Clarify in (4) that "material traces" includes non-documentary evidence (archaeology, oral recording, geography, genetics) that exists independently of the institutional archive. This allows (4) to retain objective force even when (5) discredits the specific *documents* held in the archive.

  #### **Tension C: The Contingency of Sovereignty [(1) vs. (3)]**
  *   **Severity:** **Medium (Apparent Tension)**
  *   **The Problem:** You worry (3) undermines (1). If sovereignty is determined "functionally," it implies an external observer (the historian) can judge whether a narrative *actually* sustains mutual recognition. If the historian decides the function has ceased, the sovereignty vanishes. This makes sovereignty contingent on external analysis rather than normative right.
  *   **Least Costly Revision:** **Internalize the Functional Assessment.**
      *   Amend (3) to specify that the functional role is determined by the **community's own self-understanding**, not by external sociological observation. This preserves the normative force of (1) (the community decides what constitutes them) while keeping the functionalist framework of (3).

  ---

  ### 2. Ranking by Severity

  1.  **Tension A [(1)+(5) vs (2)]:** **Critical.** If the rule of correction (2) is constantly suspended by the injustice clause (5), your theory collapses into a form of relativism where archival truth is never accessible. This threatens the seminar's reception of your view as philosophically robust.
  2.  **Tension B [(4) vs (5)]:** **Critical.** If you cannot explain how falsification works when archives are suspect, you lose the ability to distinguish between *protected memory* and *fabrication*.
  3.  **Tension C [(1) vs (3)]:** **Manageable.** This is primarily a clarification of authority (who judges function) rather than a structural contradiction.

  ---

  ### 3. The Single Change Recommendation

  To resolve the most conflicts without abandoning your core motivation (protecting communities from archival domination), you should make one strategic revision to **Point (2)**.

  **The Change:**
  Replace the phrase **"the archival record should correct the memory"** in Point (2) with **"the preponderance of corroborated material evidence should correct the memory."**

  **Why this resolves the conflicts:**

  1.  **Stabilizes (2) against (5):** By removing the automatic privilege of the *archive*, you no longer need to "suspend" the rule when the archive is tainted (resolving Tension A). Tainted archives simply fail to meet the burden of "corroborated material evidence." The rule remains stable; the *weight* of the evidence shifts.
  2.  **Harmonizes (4) and (5):** This aligns (2) directly with (4). "Material evidence" includes the non-documentary traces you need to bypass the tainted archive (resolving Tension B). It acknowledges that while the *record* may be unjust, the *evidence* (broadly construed) can still be objective.
  3.  **Protects the Core Motivation:** This change structurally prevents archival domination rather than just creating an exception for it. It forces the historian to bring more than just institutional documents to override community memory, which is the ultimate protection you seek.
  4.  **Preserves (1) and (3):** It leaves your sovereignty claim intact. It simply raises the epistemic bar for overriding that sovereignty in non-identity cases, which is consistent with your functionalist approach.

  **Revised Point (2) for your remarks:**
  > "(2) For conflicts that are purely chronological or causal and do not bear on present practices of recognition and obligation, the **preponderance of corroborated material evidence** should correct the memory, and a community's refusal counts as an epistemic failure **only when such evidence is established independent of tainted institutional records**."

  This single edit turns your "exception" (5) into a standard of evidence, making your package internally consistent and defensible against charges of relativism.
