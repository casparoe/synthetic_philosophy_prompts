          *   *Revised Roles (8 pairs = 16 students):*
              1.  CEO (Strategy)
              2.  CTO (System Design)
              3.  Data Lead (Model Training)
              4.  Safety Officer (Compliance)
              5.  Dispatch Supervisor (Human in Loop)
              6.  Paramedic Rep (Frontline)
              7.  City Regulator (Oversight)
              8.  Legal Counsel (Liability)

  3.  **Designing the Secrets (The "Gap" Mechanics):**
      *   *Cosmetic Control:* Dispatch Supervisor knows they *can* override, but system flags overrides as "errors" affecting performance metrics. Or, the latency is too high. Let's go with: The system pre-assigns resources before the human sees the ticket. The human confirms, but the wheels are already moving.
      *   *Version Drift:* Data Lead knows the model updates continuously. The specific weights at the time of death weren't snapshotted because it was a "minor patch" deemed non-material.
      *   *Overdetermination:* CEO set budget constraints that limited logging. Safety Officer approved based on aggregate stats, not edge cases. Legal Counsel advised that specific logging wasn't legally required. Each decision was rational in isolation but collectively created the gap.

  4.  **Designing the Flow:**
      *   *Intro (5 mins):* Set scene, assign roles.
      *   *Phase 1: Individual/Pair Review (15 mins):* Read briefs, identify own responsibility.
      *   *Phase 2: The Inquiry (40 mins):* Structured questioning. They need to pool info to find the secrets.
      *   *Phase 3: The Verdict (10 mins):* Private vote.
      *   *Phase 4: Debrief (20 mins):* Reveal the gap, map the 3 concepts.

  5.  **Refining the Pedagogical Goals (The 3 Things):**
      1.  *No Control/Knowledge:* Felt when they realize the Dispatch Supervisor couldn't actually stop it, and the Data Lead can't reproduce the logic.
      2.  *Obligation to Explain:* Felt when the City Regulator demands answers but no one has the *full* picture, yet someone must speak to the family.
