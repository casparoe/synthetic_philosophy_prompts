      *Alternative:* 4 "Investigators" (rotating) vs 12 "Staff".
      *Better Alternative (fits "walk into the gap"):* Everyone is on the Board. The "Secrets" are in the evidence packets distributed to specific students within the board.
      *Decision:* Let's make all 16 members of the "Ethics & Safety Review Board." They are investigating the incident. They are given "Evidence Packets" corresponding to roles. Some packets contain the secrets. This avoids the "us vs them" dynamic and makes everyone complicit in the finding.
