          1.  Chief Executive (CEO) - Strategy/Profit/Safety balance.
          2.  Chief Technology Officer (CTO) - Model architecture/Deployment.
          3.  Lead Data Scientist (LDS) - Training/Versioning.
          4.  Clinical Safety Officer (CSO) - Risk assessment/Approval.
          5.  Dispatch Manager (DM) - Human in the loop (HITL).
          6.  Paramedic Union Rep (PUR) - Workload/Protocol.
          7.  City Liaison (CL) - Public pressure/Regulations.
          8.  Insurance Adjuster (IA) - Liability/Cost.
