              *   Version drift: Model retrained, decision snapshot not archived (cannot interrogate).
              *   Overdetermination: Counterfactual test fails for any single person (outcome same regardless).
              *   Forced Ending: Private vote on name/sanction -> read out -> scatter/no majority.
          *   Pedagogical Goal: Distinguish three things:
              1.  Lack of knowledge/control for blame.
              2.  Obligation to explain without blameworthiness.
