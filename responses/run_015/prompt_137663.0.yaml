answer: |-
  Core mechanic: A distributed evidence puzzle where no single participant holds the causal chain, forcing a vote that fractures across reasonable actors to viscerally demonstrate the absence of a blameworthy subject despite the presence of real harm.

  ### Scenario Overview: The "PathFinder" Incident
  **Context:** PathFinder is an AI-driven ambulance dispatch system deployed city-wide 6 months ago. Aggregate data shows it has reduced average response times by 14% and saved an estimated 40 lives.
  **The Incident:** Three weeks ago, Patient Arthur Penhaligon (Category 2 call: severe breathing difficulty) died while waiting 18 minutes for an ambulance. PathFinder rerouted the nearest unit to a Category 1 call (cardiac arrest) 4 minutes away, calculating a higher aggregate survival probability for the group. The reroute was confirmed by a human dispatcher, but the patient died before the redirected ambulance could return.
  **The Inquiry:** You are the Emergency Ethics Review Board. You must determine who is responsible for Mr. Penhaligon's death and recommend sanctions (termination, suspension, formal reprimand, or none).

  ### Roles and Private Briefs (16 Students, 8 Pairs)
  *Print each brief on separate paper. Do not share briefs unless explicitly asked during questioning.*

  **1. Chief Executive Officer (2 students)**
  *   **Public Stance:** You championed PathFinder to save lives. You are devastated by the loss but proud of the net lives saved.
  *   **Private Memo:** You approved the budget for PathFinder but cut the "Full Audit Logging" feature to save $200k/year, based on written advice from Legal and Safety that it wasn't legally required for non-fatal error rates under 1%. You did not know about the specific override latency issues.
  *   **Goal:** Protect the company's viability; argue the system is net-positive.

  **2. Chief Technology Officer (2 students)**
  *   **Public Stance:** The system works as designed. Technology is never perfect, but it is better than human guesswork.
  *   **Private Memo:** You authorized the continuous learning pipeline. You know the model retrains every 4 hours. You assumed Data Science was archiving snapshots. You did not know they stopped archiving minor patches 2 months ago to save server space.
  *   **Goal:** Defend the architecture; shift focus to operational usage.

  **3. Lead Data Scientist (2 students)**
  *   **Public Stance:** The model is mathematically sound. It optimizes for total lives saved, which it achieved.
  *   **Private Memo (Secret 1):** You stopped archiving decision snapshots 2 months ago because the storage costs blew the budget (approved by CEO) and you deemed the patches "non-material." You cannot reproduce the specific weights that made the reroute decision for Penhaligon.
  *   **Goal:** Avoid admitting negligence; frame the missing data as standard industry practice for this model tier.

  **4. Clinical Safety Officer (2 students)**
  *   **Public Stance:** You signed off on the system. It passed all clinical risk assessments based on aggregate data.
  *   **Private Memo:** You approved the system based on simulations, not real-world edge cases. You recommended a "Human in the Loop" (HITL) safeguard to mitigate risk. You were never told the HITL was cosmetic.
  *   **Goal:** Defend your sign-off; argue you relied on technical assurances that safeguards were active.

  **5. Dispatch Supervisor (Human in the Loop) (2 students)**
  *   **Public Stance:** You were on shift. You saw the alert. You clicked "Confirm."
  *   **Private Memo (Secret 2):** The interface shows an "Override" button, but the system commits the reroute to drivers' tablets *before* the screen loads for you. To override, you must call the driver directly. During peak load (like that night), call wait times are 2+ minutes. You have never successfully overridden a PathFinder decision in 6 months. You didn't report this because management metrics penalize "manual interventions" as errors.
  *   **Goal:** Defend your actions; you followed protocol. Admit the override is difficult only if pressed hard.

  **6. Paramedic Union Rep (2 students)**
  *   **Public Stance:** Your members are exhausted. They trust the system mostly, but sometimes it sends them to the wrong place.
  *   **Private Memo:** You know drivers often ignore reroutes if they feel unsafe, but in this case, the driver followed the app. You have complained about the "manual override" call delay before, but tickets were closed as "user error."
  *   **Goal:** Protect your members; highlight workload issues caused by system rigidity.

  **7. City Regulator (2 students)**
  *   **Public Stance:** You represent the public interest. You need answers for the family.
  *   **Private Memo:** You are under political pressure to find a culprit. You know regulations are outdated for AI. You need a name to sanction to close the case, or the public will lose trust in emergency services.
  *   **Goal:** Demand accountability; push for a concrete sanction to satisfy public outrage.

  **8. Legal Counsel (2 students)**
  *   **Public Stance:** You ensure compliance. No laws were broken.
  *   **Private Memo:** You advised the CEO that audit logging wasn't legally mandatory. You know that if this goes to court, the lack of a model snapshot makes defense impossible, so the company needs a "responsible person" to settle quietly.
  *   **Goal:** Minimize liability; suggest sacrificing a lower-level role if necessary to save the organization.

  ### Materials
  *   8 Role Briefs (printed double-sided, Public/Private).
  *   16 Vote Slips (small cards).
  *   Whiteboard/Flipchart for tracking questions.
  *   Timer visible to all.
  *   **Instructor Prop:** A single envelope marked "Penhaligon Family Statement" (opened only at debrief).

  ### Timeline (90 Minutes)

  **00:00 – 00:05 | Setup**
  *   Arrange chairs in one large circle or 4 clusters.
  *   Hand out roles randomly.
  *   **Instruction:** "You are the Review Board. You have 45 minutes to question each other, then you must vote. Do not use the phrase 'responsibility gap.' Your goal is to assign sanction to a specific role or person."

  **00:05 – 00:20 | Private Review**
  *   Students read public stance and private memo.
  *   **Instruction:** "Identify what you know that others might not. Prepare to defend your role."

  **00:20 – 00:50 | The Inquiry (Open Floor)**
  *   Students question each other to reconstruct the event.
  *   **Facilitator Rule:** Do not intervene unless conversation stalls. If they ask the Dispatch Supervisor about the override, let them dig. If they ask Data Science about the model, let them dig.
  *   **Critical Moment:** Ensure the Dispatch Supervisor reveals the override latency (Secret 2) and Data Science reveals the missing snapshot (Secret 1). If they don't surface by minute 40, the Regulator or Legal must be prompted to ask: "Can we reproduce the decision?" and "Could the dispatcher have stopped it?"

  **00:50 – 01:00 | Deliberation & Vote**
  *   **Instruction:** "Take a vote slip. Write ONE name (or role) and ONE sanction (Fire, Suspend, Reprimand, None). If you write 'The System,' you must rewrite it. A person must be named."
  *   Collect slips. Shuffle. Read them aloud one by one. Record tally on board.
  *   *Expected Outcome:* Scatter. Some blame CEO (budget), some Data (logging), some Dispatch (didn't fight hard enough), some None. No majority.

  **01:00 – 01:30 | Debrief**
  *   **Step 1: The Vote (5 mins):** Acknowledge the scatter. Ask: "Why was consensus impossible?"
  *   **Step 2: The Reveal (10 mins):** Introduce the term "Responsibility Gap." Map the secrets:
      *   *Control:* Dispatch had nominal control but no causal power (Secret 2).
      *   *Knowledge:* Data/CEO had causal power but no specific knowledge of this decision (Secret 1).
  *   **Step 3: The Three Distinctions (10 mins):**
      1.  **Blame requires Control/Knowledge:** Point to Dispatch and Data. Neither had both.
      2.  **Obligation to Explain:** Point to the CEO or Safety Officer. Even if not blameworthy, who owes the family an explanation? (Distinguish *answerability* from *blame*).
      3.  **Outrage without Object:** Point to the vote scatter. The harm is real (Penhaligon died), the outrage is justified, but there is no legitimate target for punishment.
  *   **Step 4: The Victim (5 mins):** Open the "Penhaligon Family Statement" envelope. Read a short, emotional excerpt (e.g., "We just want to know why no one came."). Ask: "Does knowing the 'gap' exists comfort them?"

  ### Predictable Failures & Handling

  **1. The "Fire the CEO" Shortcut**
  *   *What happens:* Students ignore the nuance and vote to fire the CEO for budget cuts.
  *   *Why:* It's the easiest causal chain (Money -> No Logging -> Gap).
  *   *Handle:* During Inquiry (min 40), ask the Safety Officer: "Did you recommend the logging cut?" When Safety says "No, we approved the budget based on risk," highlight that the CEO acted on expert advice. In debrief, ask: "Is it just to punish someone for relying on their experts' assurance?"

  **2. The "Algorithm Did It" Absolution**
  *   *What happens:* Students vote "None" or blame "The Model."
  *   *Why:* It feels safer than blaming a peer.
  *   *Handle:* Enforce the vote rule strictly ("A person must be named"). In debrief, ask: "If we blame the algorithm, do we fix the problem? Algorithms don't feel sanctions. Who changes the code?"

  **3. Consensus on "Systemic Failure"**
  *   *What happens:* They agree it's "everyone's fault" and vote "Reprimand All."
  *   *Why:* Diffuses tension.
  *   *Handle:* Accept this, but in debrief ask: "If everyone is responsible, is anyone responsible? Does 'all' mean 'none'?" Use this to introduce the distinction between *collective obligation* and *individual blame*.

  **4. The Dispatch Supervisor Gets Lynched**
  *   *What happens:* Students blame the human who clicked the button.
  *   *Why:* Proximity bias (they were closest to the event).
  *   *Handle:* During Inquiry, ensure the latency secret comes out. In debrief, ask: "Is it fair to blame someone for failing to do the impossible?"

  ### One Thing This Activity Can't Reproduce
  **The Visceral Weight of Grief.**
  *   **Why:** This is a cognitive simulation. Students are playing roles to solve a puzzle. They do not feel the loss of Mr. Penhaligon. They feel the frustration of the *puzzle*, not the pain of the *harm*.
  *   **How to Supply:** You must supply the affective weight in the debrief. When you read the "Family Statement," do not analyze it. Read it slowly. Let the silence hang. Explicitly state: "The ethics of the gap is intellectual. The experience of the gap is suffering. The theory explains why we can't punish; it does not explain how the family lives with that." This prevents the seminar from becoming a purely technical exercise in exculpation.
