answer: |-
  Here is a precise plan for your thirty minutes. It is designed to prevent the specific conceptual failures you identified (confusing rationality with correctness, confusing cascades with conformity) by enforcing a strict logical order.

  ### Part 1: The Sequence (The Backbone)
  **Total Time: 30 Minutes**
  **Whiteboard Layout:** Draw a horizontal line across the middle. This is the "Queue." Mark positions 1, 2, 3... 10... 100.

  **0:00–0:05: The Setup (Constraints & Stakes)**
  *   **Action:** Draw two boxes at the end of the queue: **Truck A** and **Truck B**.
  *   **The Truth:** State clearly: "One truck serves good food, one serves bad food. We do not know which is which. Let's say, for this session, **A is Good, B is Bad**." (Write this small in the corner; tell them this is the 'God's eye view' they have, but the people in line do not).
  *   **The Rules (Crucial):**
      1.  **Sequential:** You decide one by one.
      2.  **Visible:** You see where the people ahead of you went.
      3.  **Silent:** You cannot talk to them. You only see their choice, not their reason.
      4.  **Selfish:** You only care about your own lunch. You do not care about the people behind you.
  *   **Why this order matters:** You must establish *selfishness* before *rationality*. If you don't, they will assume people are trying to help the group.

  **0:05–0:10: The Private Signal (The Anchor)**
  *   **Action:** Ask Person #1: "How do you decide?"
  *   **The Mechanism:** Give them a "Private Signal." Say: "Each of you gets a text message before you arrive. It says 'A is Good' or 'B is Good'."
  *   **The Reliability:** "The text is right **2 out of 3 times**. It is wrong 1 out of 3 times."
  *   **The Logic Check:** Ask the room: "If you are Person #1, and your text says 'A', where do you go?" (They will say A). "If it says 'B'?" (They will say B).
  *   **Why this order matters:** You asked if you need to establish the signal first. **Yes.** If you do not establish that the signal has *value* (2/3 accuracy), then when Person #3 ignores their signal later, it looks like stupidity. You must prove the signal is worth something before you prove it can be outweighed.

  **0:10–0:15: The Cascade (The Tipping Point)**
  *   **Action:** Simulate Persons #1 and #2.
      *   Person #1 gets signal 'A'. Goes to A. (Public record: A)
      *   Person #2 gets signal 'B'. What do they do?
      *   **Math on Board:** Person #2 knows Person #1 likely had signal 'A'. Person #2 has signal 'B'. It is 1 vote vs. 1 vote. They are indifferent. Flip a coin. Let's say they choose **A**.
  *   **The Critical Moment (Person #3):**
      *   Person #3 sees two people at Truck A.
      *   Person #3 gets a text: "**B is Good**."
      *   **The Calculation:** Person #3 thinks: "Person #1 probably got signal A. Person #2 might have got signal B but followed #1, or got signal A. There are now *two* pieces of evidence for A, and only *my one* piece of evidence for B."
      *   **The Decision:** 2 vs 1. Person #3 ignores their own text and goes to **A**.
  *   **The Declaration:** "Person #3 is not a sheep. They are doing the math. They are maximizing their chance of a good lunch. But they are now contributing zero new information to the people behind them."
  *   **Why this order matters:** This is where you introduce "Rationality." Do not say "they are rational" until *after* they see the person ignore their signal. If you say it before, they assume Rational = Correct. Now they see Rational = Ignoring Private Truth.

  **0:15–0:20: Misconception Interception**
  *   **Conformity/Peer Pressure:** If someone raises this, point to Rule #4 (Selfish). "If there was a penalty for eating alone, this would be conformity. Here, there is no penalty. They are following because they think the others *know something*."
  *   **Wisdom of Crowds:** This is the most dangerous objection.
      *   **The Interception:** "Wisdom of Crowds works only if guesses are **independent**. If I guess the weight of a cow, I don't see your guess. Here, Person #3 sees Person #1. The errors do not cancel out; they **compound**. Person #3's choice is not a new data point; it is a echo of Person #1."
      *   **Whiteboard Visual:** Draw arrows. In Wisdom of Crowds, arrows go from Person -> Truth. In Cascade, arrows go from Person -> Person -> Person.

  **0:20–0:25: Fragility & The Expert (The Advanced Insight)**
  *   **The Question:** "Who has the power to stop this?"
  *   **The Expert:** "Imagine Person #100 is a food critic. Their text message is right 99% of the time."
      *   **Scenario A (Expert First):** If the Critic is Person #1, they choose A. Everyone follows. **Outcome: Everyone eats well.**
      *   **Scenario B (Expert Last):** If the Critic is Person #100, the cascade on A has already locked in. Persons 3 through 99 ignored their own signals. The Critic might still choose A (because 99 people can't be wrong?) or choose B (because their signal is so strong).
      *   **The Verdict:** Even if the Critic chooses B, **99 people have already eaten at A.**
      *   **Lesson:** Moving the informed person from front to back makes the *group outcome* worse, even if the expert saves themselves. Order matters more than information quality.
  *   **The Fragility (Late Public Info):** "Now imagine a Health Inspector puts a sign on Truck B on Day 2."
      *   **The Logic:** The cascade is built on *private* signals inferred from public actions. It is fragile. A single piece of *direct public* information (the sign) outweighs the infinite chain of inferred private signals.
      *   **Lesson:** Cascades are hard to stop with private whispers, but easy to break with public facts.

  **0:25–0:30: Closing & Real World**
  *   **The Real World Warning:** Do not say "Social media creates cascades so don't trust trends." Say: "Social media changes the **visibility** of choices. When you can see what everyone else bought, you lose the independence required for Wisdom of Crowds. You gain efficiency, but you risk fragility."
  *   **The Exclusion:** Explicitly state: "We are not talking about reputational cascades (doing what your boss does to keep your job) or Bayesian formulas. We are talking about the structure of information flow."
  *   **The Final Question:** (See below).

  ---

  ### Part 2: The Example (The Vehicle)
  **Verdict:** Use the **Two Food Trucks**.
  **Why:** It is binary, consumable, and low-stakes.
  **Constraints you must enforce verbally:**
  1.  **No Network Effects:** You must explicitly say, "The food does not taste better because there is a line. The line is annoying." (If they think the line implies quality/taste, they are modeling a network effect, not an information cascade).
  2.  **No Communication:** "You cannot ask Person #1 'Why did you pick A?' You only see their back." (If they can ask reasons, the cascade breaks immediately).
  3.  **One-Shot:** "You eat and leave. You don't come back tomorrow to try the other one." (This prevents self-correction through personal experimentation).

  **What to strip out:**
  *   Do not use restaurants (implies socializing/conformity).
  *   Do not use stocks (implies financial incentive/reputational risk).
  *   Do not use fashion (implies utility from matching others).

  ---

  ### Part 3: Misconception Placement (The Defense)
  Do not list these at the end. Place them as shields *before* the objection arises.

  1.  **"People are sheep/conformists":**
      *   **Place:** **0:05 (The Rules).**
      *   **Phrasing:** "Assume everyone in this line is as stubborn and selfish as you are. They hate being told what to do. They only care about their own lunch."
      *   **Why:** If you wait until they object, you are defending. If you say it at the start, you set the axioms.

  2.  **"Person #3 is weak/confused":**
      *   **Place:** **0:12 (The Critical Moment).**
      *   **Phrasing:** "It looks like Person #3 is giving up. But they are actually trusting the math. They believe the probability that A is good is now higher than their own text message. They are being *more* rational, not less."
      *   **Why:** You must reframe "ignoring self" as "trusting aggregate data" before they judge the character.

  3.  **"Wisdom of Crowds":**
      *   **Place:** **0:18 (Immediately after the cascade forms).**
      *   **Phrasing:** "This looks like the crowd is wise. It is not. Wisdom of Crowds requires **Independence**. Here, Person #3 is dependent on Person #1. The sample size is not 3; the sample size is 1, repeated twice."
      *   **Why:** This is the most sophisticated objection. Handle it while the math is fresh on the board.

  4.  **"Just talk / Just look / Self-Correction":**
      *   **Place:** **0:22 (During Fragility).**
      *   **Phrasing:** "Could Person #3 just walk over and smell the food? Yes, but that costs time. If the line is long, the cost of investigation is higher than the cost of a bad lunch. Once the cascade starts, investigation becomes irrational for the individual, even if it would help the group."
      *   **Why:** This addresses the "fix is obvious" objection by introducing *cost*.

  ---

  ### Part 4: The Advanced Insights (The Payoff)
  You asked if you can reach the "Expert Position" and "Fragility" insights with the same example. **Yes.**

  **The Expert Position:**
  *   **Draw:** A star next to Person #1. Then erase it and put it next to Person #100.
  *   **Logic:** "If the Star is #1, the line goes to the Truth. If the Star is #100, the line went to the Falsehood 99 times already."
  *   **Takeaway:** Information value depends on *timing*, not just *accuracy*.

  **The Fragility (Late Public Info):**
  *   **Draw:** A small sign on Truck B.
  *   **Logic:** "The cascade is built on a chain of inference. 'I think he knows, because he thinks she knows.' A single hard fact breaks the chain. A whisper cannot stop a cascade. A sign can."
  *   **Takeaway:** Cascades are stable against private doubt, but fragile against public truth.

  ---

  ### Part 5: Closing (The Takeaway)

  **The One Question:**
  Do not ask: "What is an information cascade?"
  Ask: **"If you want to ensure the group finds the best restaurant, is it better to have 100 people guess independently in separate rooms, or 100 people walk down the street one by one watching where the others go?"**
  *   **Why:** A student who only learned vocabulary will say "It depends on the situation." A student who understands the mechanism will say "Separate rooms, because the street creates dependence."

  **What to Refuse to Explain:**
  *   **Formal Bayesian Updating:** If a math student asks for the probability formula, say: "The logic holds as long as the public history outweighs the private signal. The exact fractions change the tipping point, not the phenomenon."
  *   **Reputational Cascades:** If they ask about job markets or politics, say: "That adds a second motive (looking good). We stripped that out to see the information problem clearly."

  **Real World Warning:**
  *   **Do not say:** "Crowds are usually wrong."
  *   **Do say:** "Crowds are efficient at sharing information, but fragile when that information is correlated. When you see a line, ask: **Are these people acting on what they know, or on who they saw?**"
  *   **Why:** This prevents the "nothing online is trustworthy" cynicism. It encourages structural thinking.

  ### Summary of Order Dependencies
  *   **Signal before Observation:** If you start with observation, it looks like peer pressure.
  *   **Selfishness before Rationality:** If you start with rationality, they assume the outcome is optimal.
  *   **Cascade before Wisdom of Crowds:** You must show the dependence before you can contrast it with independence.
  *   **Fragility last:** You cannot explain how to break the cascade until you have built it.

  Stick to this sequence. If you swap "Signal" and "Observation," you lose the rationality argument. If you swap "Selfishness" and "Rationality," you lose the mechanism. If you leave "Wisdom of Crowds" for the end, you will run out of time to distinguish independence from dependence.
