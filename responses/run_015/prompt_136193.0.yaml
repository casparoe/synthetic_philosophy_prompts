      *   *Predictive Maintenance (PdM):* Algorithms predicting when infrastructure needs repair to prevent failure.
      *   *Critical Infrastructure:* Water, bridges – essential for life and mobility. Failure has severe consequences.
      *   *Relational Autonomy:* Decisions aren't made in isolation; they affect and are affected by relationships. In infrastructure, this means the 'autonomy' of the system managers is bound to the well-being of the users.
      *   *Attentiveness to Vulnerability:* Recognising who is most at risk. Not just statistical risk, but lived vulnerability.
      *   *Context-Sensitive Responsibility:* Responsibility isn't just liability after the fact; it's an ongoing duty to respond to specific needs in specific places.

  3.  **Contrast with Conventional Accountability:**
      *   *Conventional:* Rule-based, compliance-driven, aggregate statistics (e.g., "99% uptime"), liability-focused (who pays when it breaks), abstract users.
      *   *Care Ethics:* Relationship-based, proactive/preventative in a moral sense, focused on the margins (the 1% who suffer most), embedded responsibility (who cares for the affected).

  4.  **Drafting - Section by Section:**

