      *   **Relational Autonomy:**
          *   *Standard view:* Engineers/Algorithms act independently to optimise efficiency.
          *   *Care view:* The system is part of a social fabric. Autonomy is shared. The algorithm doesn't just 'predict'; it participates in the life of the community.
          *   *Implication:* Oversight isn't just checking code; it's checking relationships. Does the algorithm respect the dependency of the community on the infrastructure?

      *   **Attentiveness to Vulnerability:**
          *   *Standard view:* Risk is probabilistic. Average risk reduction.
          *   *Care view:* Vulnerability is uneven. Some communities are more fragile (e.g., lack of backup water sources, older bridges in poorer areas).
          *   *Implication:* Algorithms must be tuned not for average efficiency but for the protection of the most vulnerable. 'False negatives' (missing a fault) are morally weighted differently depending on who is affected.

      *   **Context-Sensitive Responsibility:**
          *   *Standard view:* Liability is binary (broken/not broken). Responsibility is diffuse or contractual.
          *   *Care view:* Responsibility is ongoing and responsive. It requires knowledge of the specific geography and social context.
          *   *Implication:* Oversight bodies need local knowledge, not just technical metrics. Accountability is about responsiveness to specific harms, not just adherence to global standards.

      *   **Reframing Accountability (The Core Question):**
