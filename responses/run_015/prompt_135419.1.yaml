      *   **The Goal:** Force students to distinguish the *types* of inversion and address the gap between competence and comprehension. Avoid simple "Dennett wins" or "Searle wins" binaries.
      *   **The Prompt Material:** A fake candidate thesis called "The Ratchet Principle."
