      *   The core intuition: If $p$ were false, I wouldn't believe it; if $p$ were true, I would believe it.
      *   The student's specific move: $p$ = "I have hands", $h$ = "I am a BIV". I know $p$. Does $p$ entail $\neg h$? Yes. Do I know $\neg h$? Nozick says no, because if $h$ were true, I would still believe $\neg h$ (failure of sensitivity/tracking). Therefore, closure fails.
      *   I need to break down the slogan into specific technical claims to show where the closure failure comes from (or doesn't).

  3.  **Drafting the Menu (Trivial to Radical):**

      *   *Level 1: The Trivial/Platitudinous Reading.*
