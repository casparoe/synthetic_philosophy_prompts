          *   Status: Platitude (factive).
          *   Closure: Compatible.
          *   Anti-closure? No.

      *   *Level 2: The Reliabilist/Covariation Reading.*
          *   Idea: Belief correlates with truth in actual conditions.
          *   Thesis: The belief is produced by a process that yields true beliefs in the actual world.
