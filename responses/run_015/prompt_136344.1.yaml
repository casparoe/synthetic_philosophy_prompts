          *   Closure: Incompatible (the student's point).
          *   Anti-closure? Yes.

      *   *Level 4: The Method-Relative Tracking Reading.*
          *   Idea: Tracking is relative to a specific method $M$.
          *   Thesis: $S$ knows $p$ via $M$ only if $M$ tracks $p$.
