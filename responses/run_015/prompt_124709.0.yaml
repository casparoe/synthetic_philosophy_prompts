answer: |-
  Here is the translation of the anthropic framework into the language of survey methodology and causal inference, followed by the residu report.

  ### The Translation

  Let $\mathcal{W}$ be the set of candidate Data Generating Processes (DGPs), indexed by $w$. Each DGP $w$ implies a specific finite population size $N_w$ of potential observational units (observer-moments). Let $S$ be a binary selection indicator where $S_i=1$ if unit $i$ is actualized/observed and $S_i=0$ otherwise. In standard survey stats, we assume the population exists and we sample from it. In this anthropic setup, "existence" is equivalent to "selection into the sample." You are a unit $i$ for whom $S_i=1$.

  #### 1. Self-Sampling Assumption (SSA) as Conditional Ignorability
  SSA asserts that, conditional on the true DGP $w$ being fixed, your observation is equivalent to a Simple Random Sample (SRS) from the $N_w$ units generated by that DGP.

  In causal terms, SSA imposes an **ignorability condition** on the selection mechanism *within* a world. It claims that the probability of being unit $i$ given world $w$ and existence is uniform:
  $$ P(\text{Unit}=i \mid W=w, S=1) = \frac{1}{N_w} $$
  SSA treats the indexical information ("I am this specific observer") as data drawn from the realized population of $w$. It does not allow the population size $N_w$ to influence the prior probability of the DGP itself. It treats $W$ and $N_W$ as independent in the prior specification. When updating $P(W \mid \text{Data})$, SSA conditions on $S=1$ but treats the selection probability as a constant that cancels out across hypotheses, provided the reference class is held fixed.

  **Statistical Equivalent:** Standard likelihood inference where the sampling frame is fixed per hypothesis. You are correcting for selection bias by conditioning on the fact that you are in the sample, but you are not allowing the *size* of the sampling frame to inform the model prior.

  #### 2. Self-Indication Assumption (SIA) as Prior Weighting by Propensity
  SIA argues that you should reason as if you were a random sample from the set of all *possible* observers across all DGPs. This effectively treats the probability of a DGP being true as proportional to the number of observers it contains.

  In survey terms, SIA violates the standard assumption that model priors are independent of population size. It applies a **propensity weight** to the DGP prior based on the selection capacity of that DGP. If $\pi_w$ is the probability of existence given world $w$ (which scales with $N_w$), SIA updates the prior odds:
  $$ P_{\text{SIA}}(W=w) \propto N_w \times P_{\text{Base}}(W=w) $$
  This is mathematically equivalent to **inverse probability weighting** where the weight is the population count. SIA claims that the "missingness" mechanism (why you are in this world and not another) is non-ignorable with respect to the model selection. It asserts that worlds with larger $N_w$ have a higher propensity to produce *you* specifically, simply because there are more "slots" for you to occupy.

  **Statistical Equivalent:** Bayesian model averaging where the prior model probability is weighted by the effective sample size each model generates. It treats the "probability of existence" as a likelihood term that scales linearly with population.

  #### 3. The Presumptuous Philosopher as Prior Dominance
  The Presumptuous Philosopher objection arises when two DGPs, $w_1$ and $w_2$, are empirically indistinguishable regarding physical constants, but $N_{w_2} \gg N_{w_1}$ (e.g., $10^{20}$ vs $10^{10}$ observers).

  Under SIA, the posterior odds become:
  $$ \frac{P(w_2 \mid \text{Data})}{P(w_1 \mid \text{Data})} = \frac{N_{w_2}}{N_{w_1}} \times \frac{P(\text{Data} \mid w_2)}{P(\text{Data} \mid w_1)} $$
  If the likelihood ratio is near 1 (empirical equivalence), the posterior is driven entirely by the ratio of population sizes. The "Presumptuous Philosopher" is a statistician who accepts a posterior probability of $\approx 1$ for $w_2$ solely based on the $N_w$ weighting, without empirical evidence distinguishing the DGPs.

  **Statistical Equivalent:** A scenario where the **prior specification swamps the likelihood**. In standard methodology, this is considered pathological; priors should reflect plausibility of the mechanism, not the volume of data the mechanism produces. The objection labels this behavior "presumptuous" because it claims knowledge about the true DGP derived entirely from the sampling frame size, violating the principle that data should drive inference.

  ***

  ### Residu Report

  Here is what survives the translation, what distorts, and what vanishes.

  #### 1. What Survives Intact
  *   **The Structure of Selection Bias:** The core mathematical friction is accurately captured by the distinction between *conditioning on selection* (SSA) and *weighting the prior by selection capacity* (SIA). Both are valid Bayesian operations depending on how you define the sampling space.
  *   **The Reference Class Problem as Population Definition:** The philosophical debate over "which observers count" translates cleanly to the statistical problem of defining the **target population** and **inclusion criteria**. If you define the population too broadly or narrowly, your propensity scores change, altering the inference.
  *   **Non-Ignorable Missingness:** The anthropic problem is correctly identified as a case where the missingness indicator (Existence) is perfectly correlated with the outcome (Observation), making standard identification impossible without untestable assumptions (SSA vs. SIA).

  #### 2. What Gets Distorted
  *   **Observer-Moments as Independent Units:** Survey stats assumes units are distinct and independent (or accounts for clustering). Anthropics treats "observer-moments" as interchangeable slots. In stats, if you double the sample size, you get more precision. In SIA, if you double the *possible* population size, you change the *truth* of the hypothesis. This conflates **sample size** ($n$) with **parameter space volume**.
  *   **The "You" Variable:** In causal inference, a unit $i$ has a fixed identity across counterfactuals (Potential Outcomes Framework). In anthropics, "you" are not a fixed unit; "you" are a label applied to whichever unit ends up being observed. This violates the **Stable Unit Treatment Value Assumption (SUTVA)**. You cannot define $Y_i(1)$ and $Y_i(0)$ if $i$ does not exist under treatment 0.
  *   **Propensity Scores:** In stats, propensity scores are estimated from covariates. In SIA, the propensity score is derived from the ontological structure of the DGP itself. It treats "being sampled" as a property of the world, not the unit.

  #### 3. What Is Missing (The Normative Gap)
  *   **The "Presumptuous" Label:** There is no statistical counterpart to calling an inference "presumptuous." In stats, if your prior is $P(H) \propto N_H$ and your likelihood is flat, the posterior *is* $P(H \mid D) \propto N_H$. That is coherent Bayesian updating. Statistics has no mechanism to declare a prior "arrogant." The objection is **epistemic**, not mathematical. It appeals to a norm that empirical evidence *should* dominate prior specification, which is a methodological heuristic, not a law of probability.
  *   **Existence as a Variable:** In missing data problems (e.g., Heckman selection), the unobserved units *exist* in the population; we just lack their $Y$ values. In anthropics, under $w_1$, the observers in $w_2$ **do not exist**. They are not missing data; they are counterfactual non-entities. Standard causal inference lacks the ontology for "non-existent potential units."

  ***

  ### The Verdict: Impoverished Stats or Smuggled Metaphysics?

  It is not that survey methodology is impoverished; it is that **Bostrom is smuggling metaphysical commitments that causal inference explicitly excludes.**

  Causal inference (specifically the Potential Outcomes Framework) requires a fixed population of units over which treatments vary. It assumes **unit identity is stable**. Anthropics requires **unit identity to be fluid** across worlds (i.e., "I could have been born in the other universe").

  When you translate SIA into stats, it looks like a prior that violates the **Likelihood Principle** because it allows the sampling frame size to determine model probability independent of the data density. A statistician would reject SIA not because it's "presumptuous," but because it violates the separation between the **model of the data** (likelihood) and the **model of the world** (prior). SIA conflates the two by making the prior dependent on the sample space volume.

  The "Presumptuous Philosopher" objection survives translation only as a critique of **prior sensitivity**. It highlights that SIA makes inference hyper-sensitive to population size specifications that are empirically unverified.

  **Conclusion:** The missing piece is **ontological stability**. Survey stats assumes the population is real and fixed before sampling begins. Anthropics treats the population size as a hypothesis to be tested *using* the sample. You cannot map this cleanly because standard statistics has no operator for "probability of existence of the population itself." Bostrom isn't doing stats; he's doing metaphysics with a probability calculus skin. The "presumption" is the cost of applying probability theory to the existence of the sample space itself.
