      *   *SIA:* Treating the probability of the DGP itself as proportional to the sample size it generates. This looks like weighting the model prior by the population size. $P(\text{DGP}) \propto N_{\text{DGP}} \times \text{Prior}(\text{DGP})$.
      *   *Selection Bias:* The fact that we exist is a selection event.
      *   *Non-ignorable Missingness:* We never observe the "non-existent" units.
