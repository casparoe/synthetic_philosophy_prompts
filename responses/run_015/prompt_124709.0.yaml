      *   *Refining for Stats Speak:*
          *   **Population:** The set of all possible observer-moments across all possible DGPs.
          *   **Selection Mechanism:** The process that determines which observer-moments become actualized/observed.
          *   **SSA:** Assumes the selection mechanism is *ignorable* conditional on the reference class. It treats "being me" as a simple random sample (SRS) from the *actualized* population of a specific hypothesis. It conditions on the hypothesis being true first, then updates on indexical information.
          *   **SIA:** Treats the selection probability as dependent on the total population size of the hypothesis. It violates the standard assumption that model priors are independent of sample size. It effectively applies inverse probability weighting where the weight is the population count.
          *   **Presumptuous Philosopher:** A case where the propensity score (probability of existence) is so skewed by population size that the posterior is dominated by the prior adjustment, overwhelming likelihood ratios from empirical data.

