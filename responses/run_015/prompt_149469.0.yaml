answer: |-
  **Exam Question**

  **Course:** Rationality and Strategic Interaction
  **Time Allowed:** 60 Minutes
  **Word Limit:** 900 Words Maximum
  **Total Marks:** 20

  **Question 1: The Centipede Variant**

  Two players, Ada and Bob, alternate over four decision nodes: Ada moves at nodes 1 and 3, Bob at nodes 2 and 4. At each node the mover has exactly three options.

  *   **Take:** The game ends immediately with the pot divided in the taker's favour. Payoffs (Ada, Bob) are (4, 1) at node 1, (3, 8) at node 2, (14, 6) at node 3, (11, 22) at node 4. Note that the pot grows as the game goes on, but the taker's advantage narrows.
  *   **Pass:** At nodes 1, 2 and 3 the move passes to the other player. If Bob passes at node 4 the game ends with (12, 12).
  *   **Open the side door:** Available at every node. The game ends immediately; the player who opens the door receives 9 and the other player receives 10, because opening it costs the opener one unit. So Ada opening yields (9, 10) and Bob opening yields (10, 9).

  **(a)** Calculate the backward induction outcome. Specify the complete strategy for each player (what they would do at every node, reached or not), the path actually predicted, and the resulting payoffs. [4 marks]

  **(b)** Change exactly one number: Ada's payoff if Bob takes at node 4 becomes 16 rather than 11 (all else unchanged). Redo the induction far enough to determine what now happens at nodes 2 and 1. Note explicitly which of these nodes are reached under your answer to (a). [4 marks]

  **(c)** Explain why the dependence exposed in (b) is the heart of the paradox rather than an artefact of the numbers. Why does the familiar reply—that arrival at a late node constitutes evidence against the opponent's rationality—fail to repair the argument here? Finally, is the requirement that a strategy be optimal at nodes the strategy itself rules out part of rationality or an additional assumption? What becomes of the induction on each answer? [12 marks]

  ***

  **Model Answer**

  **(a)** We solve by backward induction. At node 4, Bob compares Take (22), Pass (12), and Door (9). He Takes. Payoffs become (11, 22). At node 3, Ada compares Take (14), Pass (leading to Bob's Take: 11), and Door (9). She Takes. Payoffs become (14, 6). At node 2, Bob compares Take (8), Pass (leading to Ada's Take: 6), and Door (9). He Opens the Door. Payoffs become (10, 9). At node 1, Ada compares Take (4), Pass (leading to Bob's Door: 10), and Door (9). She Passes.
  **Strategies:** Ada: {Pass at 1, Take at 3}; Bob: {Door at 2, Take at 4}.
  **Path:** Node 1 (Pass) → Node 2 (Door).
  **Payoffs:** (10, 9).
  Note that both players would prefer the cooperative outcome (12, 12), but backward induction (BI) predicts the Pareto-dominated outcome (10, 9). Crucially, BI does not predict an immediate grab at node 1; Ada passes to induce Bob to open the door at node 2, sparing her the cost of opening it herself.

  **(b)** If Ada's payoff at node 4 (if Bob Takes) rises to 16:
  At node 4, Bob still Takes (22 > 12 > 9).
  At node 3, Ada now compares Take (14) vs Pass (16) vs Door (9). She Passes.
  At node 2, Bob compares Take (8) vs Pass (leading to Ada Pass → Bob Take: 22) vs Door (9). He Passes.
  At node 1, Ada compares Take (4) vs Pass (22) vs Door (9). She Passes.
  **Result:** Under (a), nodes 1 and 2 were reached. In (b), behavior changes at node 2 (Bob now Passes instead of Opening Door) and node 1 (Ada still Passes, but for a different reason). The induction at node 1 depends on the payoff at node 4, even though node 4 is not reached in (a).

  **(c)** The paradox lies not in immediate defection, but in the **counterfactual dependence** of current choices on payoffs at unreached nodes. In (a), Ada's choice at node 1 depends on Bob's choice at node 2, which depends on Ada's choice at node 3, which depends on Bob's choice at node 4. Yet, under the prediction, the game ends at node 2. The justification for stopping at node 2 relies on what *would* happen at node 3 and 4, nodes the prediction asserts will never be visited. Changing the payoff at node 4 (as in b) alters the equilibrium path at node 1, despite node 4 being causally inert in the actual play. This shows the paradox is structural: rationality requires planning for contingencies that rationality itself rules out.

  The evidential reply suggests that finding oneself at a late node implies the opponent is irrational, justifying cooperation. This fails here because the logic applies at node 1. If Ada believes Bob is a backward inductor, she passes at 1. If she believes he is not, she might pass or take, but the BI solution requires her to believe he *is* a backward inductor at node 2 to justify her pass at node 1. She cannot simultaneously believe he is irrational (to explain reaching node 3) and rational (to justify her move at node 1). The evidential argument dissolves the consistency of the belief system required for the induction.

  Finally, the requirement to optimize at unreached nodes is **not** part of instrumental rationality per se, but an additional assumption known as **Subgame Perfection** (or sequential rationality). Pure Nash rationality only requires optimality along the equilibrium path.
  1.  **If treated as rationality:** Backward induction holds, but we accept that agents maximize utility in worlds they believe will not obtain. This creates the paradox of Pareto-inefficient outcomes driven by counterfactuals.
  2.  **If treated as an extra assumption:** We can drop it. If players only optimize on the reached path, Ada at node 1 need not consider node 3's payoffs if she is sure node 3 won't be reached. Without this requirement, the induction chain breaks. Multiple Nash equilibria exist (including cooperation), and the unique BI prediction vanishes. The paradox is resolved by acknowledging that "rationality" does not strictly demand optimality in hypothetical subgames that common knowledge of rationality renders impossible.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  **1. Correct Backward Induction for (a) [4 Marks]**
  *   **Must Hit:** Identifies Bob Opens Door at Node 2 and Ada Passes at Node 1. States final payoffs (10, 9).
  *   **Typical Error:** Starting induction at Node 1; conflating Door payoff for opener (9) with receiver (10); concluding Ada Takes at Node 1 (the "standard" centipede verdict).
  *   **Allocation:** 2 marks for correct Node 2/3 logic, 2 marks for correct Node 1 path and payoff statement.

  **2. Correct Propagation of Change in (b) [4 Marks]**
  *   **Must Hit:** Shows Node 4 change flips Node 3 (Ada Passes), which flips Node 2 (Bob Passes). Notes Nodes 1 and 2 were reached in (a).
  *   **Typical Error:** Failing to propagate the change past Node 3; claiming Node 2 was unreached in (a); ignoring the instruction to note reached nodes.
  *   **Allocation:** 2 marks for correct recalculation, 2 marks for explicit reference to nodes reached in (a).

  **3. Locating the Paradox (Counterfactual Dependence) [4 Marks]**
  *   **Must Hit:** Identifies that choices at reached nodes (1, 2) depend on payoffs at unreached nodes (3, 4). Notes Pareto domination by (12, 12).
  *   **Typical Error:** Claiming the paradox is simply that players don't cooperate; asserting the side door dissolves the paradox because defection is delayed rather than immediate.
  *   **Allocation:** 2 marks for counterfactual dependence, 2 marks for Pareto inefficiency observation.

  **4. Critique of Evidential Reply [4 Marks]**
  *   **Must Hit:** Explains that the evidential reply fails because the BI logic requires believing the opponent is rational at Node 2 to justify Node 1, creating a belief contradiction if Node 3 is reached.
  *   **Typical Error:** Asserting the evidential reply works without noticing the same reasoning is available at Node 1; claiming the reply fixes the induction without addressing belief consistency.
  *   **Allocation:** 4 marks for clear explanation of the belief inconsistency at Node 1 vs Node 3.

  **5. Status of Optimality at Unreached Nodes [4 Marks]**
  *   **Must Hit:** Distinguishes rationality from Subgame Perfection. Explains that dropping the requirement breaks the induction chain/allows cooperation.
  *   **Typical Error:** Treating sequential rationality as definitionally required for rationality; failing to say what happens to the induction if the assumption is dropped.
  *   **Allocation:** 2 marks for distinguishing the assumption, 2 marks for consequence (induction breaks).

  **Grading Boundary: A vs B**
  *   **B Answer:** Correctly computes (a) and (b). In (c), correctly identifies the Pareto inefficiency and notes the reliance on unreached nodes, but treats the requirement of optimality at unreached nodes as synonymous with rationality. Restates the standard dialectic without dissecting the *assumption* of sequential rationality.
  *   **A Answer:** Meets all B criteria but explicitly distinguishes the requirement of optimality at unreached nodes (Subgame Perfection) from rationality as such (Nash). Clearly articulates that the induction collapses if this is treated as a separable assumption, thereby locating the normative force of the paradox in the definition of rationality rather than the game structure.
