answer: |-
  # Q&A PREP SHEET: Narrative-Role Revision of the Nonidentity Problem
  **Seminar:** Joint Philosophy-Public Policy
  **Thesis:** Wronging = Degrading the welfare-relevant social trajectory of a *position*, not harming a *numerical identity*.

  ## OPENING REMARKS: PRE-EMPTIVE CONCESSIONS
  *Do not wait for them to extract these. Offer them to build trust.*
  1.  **Concede Precision:** Admit upfront that "narrative-role" is currently a qualitative heuristic, not a quantitative algorithm. Tell the ethicists: "This framework identifies the *structure* of the wrong, not the exact carbon budget."
  2.  **Concede Abstraction:** Acknowledge to the metaphysicians that "social positions" are abstract entities. You are not claiming they are concrete particulars like spacetime worms.
  3.  **The Pivot:** State clearly: "I am trading metaphysical precision for moral traction. If we wait for perfect identity conditions, climate policy waits forever."

  ## THE WEAKEST POINT TO DEFEND PROACTIVELY
  **The "Feasible Baseline" Metric.**
  *Why:* Every objection eventually drills down to: "Compared to what?" If the baseline is arbitrary, the "degradation" claim collapses.
  *Strategy:* In your intro, define the baseline as *politically and technologically feasible at time T*, not *ideal*. This shields you from utopian criticism but opens you to "status quo bias" charges. Be ready to argue that "feasible" includes necessary structural changes, not just incremental tweaks.

  ---

  ## THE SIX OBJECTIONS (Ordered by Likelihood & Damage)

  ### 1. The Policy Void (Environmental Ethicists)
  **Objection:** "This sounds compelling normatively, but it gives policymakers no decision rule. If 'narrative degradation' is graded and qualitative, how does a minister choose between Policy A (slight degradation, high certainty) and Policy B (major degradation, low certainty)? You've dissolved the Nonidentity Problem only to create a Measurement Problem."
  **2-Minute Reply:**
  "You're right that this isn't a calculator. But current cost-benefit analysis *also* fails here because it discounts future lives based on identity contingencies. My framework shifts the burden of proof. Currently, policymakers say, 'We can't harm them because they wouldn't exist otherwise.' I'm saying, 'You must justify the degradation of the social slot they will occupy.'
  Practically, this means Environmental Impact Assessments must include a 'Trajectory Statement.' Instead of asking 'Who exists?', they ask 'What quality of civic and material life does this policy lock in for this demographic position?' It doesn't give a number, it gives a veto condition. If a policy locks a position into a sub-survival trajectory when a feasible alternative exists, it is impermissible. That's a clearer rule than 'maximize utility across non-identical persons.'"
  **Softest Spot:** I haven't actually shown *how* to measure "sub-survival" without resorting to the very utility metrics I'm trying to bypass.

  ### 2. The Ableist Baseline (Disability-Studies Philosopher)
  **Objection:** "You talk about 'welfare-relevant trajectories' and 'degradation.' Who defines welfare? If your baseline assumes a 'normal' functioning body, then policies that accommodate disability might look like 'degradation' of efficiency, or conversely, lives with disability are framed as 'degraded' trajectories. Are you just smuggling in ableist norms under the guise of narrative roles?"
  **2-Minute Reply:**
  "This is the crucial constraint on my theory. The 'welfare-relevant' metric cannot be biological functioning; it must be *social participation*. A trajectory is degraded only if it restricts the position's ability to participate in the social narrative, not if it deviates from a biological norm.
  In fact, my framework helps you. Under the standard Nonidentity view, if a policy causes a child to be born with a disability but they are 'glad to exist,' no wrong occurred. Under my view, if the policy created a social environment where that disability precludes participation *when a feasible inclusive environment was possible*, the wrong is in the environmental design, not the body. I am shifting the locus of degradation from the *person* to the *structure*."
  **Softest Spot:** Distinguishing "social participation" from "economic productivity" in actual policy metrics is notoriously difficult; I risk relying on the very ableist proxies I critique.

  ### 3. The Spacetime Worm Challenge (Analytic Metaphysicians/4Dists)
  **Objection:** "You're treating 'positions' as containers that people step into. But on a 4D view, the person *is* the temporal worm. You can't separate the worm from its trajectory. If climate change alters the trajectory, it alters the worm's identity conditions. You haven't solved Nonidentity; you've just re-labeled the person as a 'role' to make the math work."
  **2-Minute Reply:**
  "I'm not denying 4Dism. I'm denying that moral status attaches *only* to the concrete particular worm. Moral status also attaches to the *structural opportunities* available at a coordinate in spacetime.
  Think of it like a seat in a theater. The 4D worm is the audience member. The 'narrative role' is the seat's view. If you build a wall blocking the view, you've wronged the seat-holder, even if the wall also causes a different person to sit there. The wrong is to the *occupancy conditions*, not the specific matter occupying them. My thesis is that policy governs the theater architecture, not just the ticket sales. You can accept 4Dism about persons while accepting structural realism about social positions."
  **Softest Spot:** "Structural realism about social positions" is metaphysically costly. I need to defend the existence of these "seats" without committing to Platonism.

  ### 4. THE "HOPE NOBODY RAISES" (Metaphysical Well-Definedness)
  **Objection:** "To claim a trajectory is 'degraded,' you must compare the actual trajectory to a counterfactual baseline trajectory. But if persons are non-identical across worlds, are 'social positions' well-defined across worlds? How do you track 'Position X' in World A vs. 'Position X' in World B without a transworld identity criterion that is just as problematic as personal identity?"
  **2-Minute Reply:**
  "Fair point. I am not relying on strict transworld identity of positions. I am relying on *functional equivalence*. We track positions by their causal role in the social structure (e.g., 'coastal resident,' 'future generation worker'), not by haecceity.
  We don't need perfect metaphysical tracking to make moral comparisons. We do this in law all the time—we compare 'reasonable person' standards across counterfactuals without knowing *who* the reasonable person is. As long as the functional description of the position holds constant (e.g., 'person inhabiting this flood zone'), the trajectory comparison is morally valid even if metaphysically fuzzy."
  **Softest Spot:** This is the weakest link. "Functional equivalence" breaks down under significant climate change (e.g., if the flood zone is underwater, is the position still the same?). If the position ceases to exist, the comparison fails.

  ### 5. The Moral Status of Slots (Metaphysicians/Ethicists)
  **Objection:** "Even if positions exist, do they have moral status? You say we wrong the future person by degrading the position. But if the person doesn't exist in the baseline, who is the victim? A 'position' cannot feel pain. Are you positing rights for abstract objects?"
  **2-Minute Reply:**
  "I'm not positing rights for abstract objects. I'm positing that *persons* have a right to occupy positions that meet a threshold of viability. The victim is still the flesh-and-blood person who ends up in the degraded slot.
  The 'position' is just the mechanism of the wrong. Analogy: If I rig a lottery so the winner gets a booby prize, I wrong the winner. It doesn't matter that the winner wouldn't have existed *as a winner* if I hadn't rigged it. The wrong is to the *office of the winner*. Similarly, climate inaction rigs the 'office of the future citizen.' The human who fills it is the victim, but the mechanism is the degradation of the office."
  **Softest Spot:** This risks collapsing back into the Person-Affecting View. If the human is the victim, and they are glad to exist, the Nonidentity Problem returns.

  ### 6. The "New Wine, Old Bottle" Charge (General Audience)
  **Objection:** "Isn't this just the Person-Affecting View with extra steps? You say you're avoiding the 'same person' condition, but you still need a specific victim to be 'wronged.' If the person in the degraded trajectory has a life worth living, in what sense are they wronged? You haven't escaped the Nonidentity Problem; you've just obscured it."
  **2-Minute Reply:**
  "The difference is the *locus of evaluation*. The Person-Affecting View asks: 'Is this person worse off than they would otherwise be?' The answer is always 'No' in Nonidentity cases.
  My view asks: 'Is this person worse off than the *position's feasible baseline*?' That allows me to say 'Yes' even if they aren't worse off than their non-existent alternative. I am comparing them to a *standard of the role*, not to their own counterfactual non-existence. It's the difference between 'Did I harm you?' and 'Did I fail the duties of the office I placed you in?' It's a deontological shift, not a utilitarian calculation."
  **Softest Spot:** If they press on why the "standard of the role" binds us if no specific person can claim they were harmed by the deviation, I may lack a foundational grounding.

  ---

  ## STRATEGIC NOTE ON OBJECTION #4
  **If Objection #4 is raised:** Do not bluff. This is the metaphysical kill-shot.
  **Fallback Position:** "I concede that under extreme modal divergence, the tracking fails. But for climate policy, we are dealing with *nearby* possible worlds where social structures remain functionally recognizable. My theory is designed for *policy*, not for *magic*. If the world changes so much that 'future citizen' has no functional equivalent, we have bigger problems than the Nonidentity Problem."
  *(This limits the scope of your thesis to save its core.)*
