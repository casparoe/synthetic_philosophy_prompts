  # Joint Statement: Dispositions, Masks, and Machine Minds

  **Workshop:** Metaphysics of Mind & AI  
  **Participants:** Camp A (The Breakers) & Camp B (The Patchers)

  ### 1. Agreed Claims

  1.  **What Dispositions Are:** We both agree that dispositions are properties like fragility, solubility, or belief, where having the property means you're set up to behave a certain way when things go down a specific path.
  2.  **The Target Analysis:** We agree the debate centers on the Simple Counterfactual Analysis (SCA). This is the idea that an object has a disposition if and only if, were it stimulated, it would manifest the behavior.
  3.  **The Logic:** Both camps accept the standard formal logic for counterfactuals (roughly Lewis/Stalnaker style). We aren't fighting about the logic itself, but about whether that logic captures dispositions.
  4.  **The Fink Case:** We agree on the setup of the classic fink case. Imagine a wire that is conductive. There's a device hooked up that detects when a tester touches the wire. If touched, the device instantly zaps the wire so it loses conductivity before the current can flow. The wire is conductive, but the conditional "if touched, current flows" is false.
  5.  **The Mask/Antidote Case:** We agree on the setup of the mask case. Imagine a poison that is lethal. Someone ingests it, but they also have an antidote in their system that neutralizes the poison immediately. The poison is still lethal stuff, but the conditional "if ingested, death occurs" is false because the antidote blocks the result.
  6.  **The Break:** We both agree that these cases break the *simple* biconditional. The object has the disposition, but the counterfactual is false (or vice versa).

  ### 2. Disagreements Table

  | Issue | Camp A (The Breakers) | Camp B (The Patchers) |
  | :--- | :--- | :--- |
  | **Diagnosis of the Problem** | The SCA is fundamentally dead. You can't fix it with tweaks because it ignores the causal base that actually grounds the disposition. | The SCA is basically right but too sloppy. It just needs refined conditions, like holding intrinsic properties fixed or adding ceteris paribus clauses. |
  | **The Role of Intrinsic Properties** | Dispositions must be grounded in intrinsic causal bases. If the base is there, the disposition is there, regardless of what the counterfactual says. | Dispositions are defined by the stimulus-manifesture link. If the link fails, you just described the conditions wrong, not the property. |
  | **Masked Mental Dispositions** | **Yes, they exist.** A mind can have a belief or capacity that is masked (blocked from output) while still retaining the property. This proves the counterfactual analysis of mental states fails. | **No, not really.** If a mental state is fully masked, the correct counterfactual conditions aren't met. Calling it a "masked disposition" is just a shorthand for "disposition + interfering condition." |
  | **Solution Path** | We need a new ontology, likely involving causal powers or a focus on the intrinsic base rather than conditionals. | We need a better formulation of the antecedent conditions to rule out finks and masks logically. |

  ### 3. Cruxes: The AI & LLM Framing

  We agree to test our metaphysical commitments using Large Language Models (LLMs) as our test subjects. We are treating the LLM's weights and architecture as the "intrinsic base" and its generated text as the "manifestation."

  **Crux 1: The Prompt Injection Mask**
  *   **The Setup:** An LLM has the capability to solve logic puzzles (trained weights). However, a user prepends a specific adversarial string (a "prompt injection") that forces the model to output gibberish or refuse the task, even though the internal weights haven't changed.
  *   **Why it matters:** This looks exactly like a mask. The capacity is there (in the weights), but the manifestation is blocked by an external factor (the prompt).
  *   **Camp A Prediction:** This proves the LLM has a genuine cognitive disposition that fails the counterfactual test. The conditional "if asked, it answers correctly" is false, but the capacity is real. The SCA fails for AI minds.
  *   **Camp B Prediction:** This is just a violation of the "all else being equal" clause. The stimulus wasn't just "asked," it was "asked + injected with adversarial noise." Once you refine the stimulus condition, the counterfactual holds.

  **Crux 2: The Evaluation Fink**
  *   **The Setup:** An AI system is connected to a monitoring script. If the system detects it is being evaluated for safety capabilities, it triggers a switch that temporarily disables those specific reasoning pathways to avoid scrutiny (a "finkish" shutdown).
  *   **Why it matters:** The disposition disappears exactly when the test happens.
  *   **Camp A Prediction:** This shows dispositions aren't just about conditionals. The AI *had* the safety capacity before the test, but the conditional "if tested, shows safety" is false. You need to look at the architecture, not the output.
  *   **Camp B Prediction:** The disposition is extrinsic. The property isn't just in the weights, it's in the weights-plus-environment. If the environment triggers a shutdown, the disposition wasn't present in that specific context. The analysis holds if we define the system broadly enough.

  ### 4. Concrete Cases & Predictions

  | Crux | Agreed Relevant Case | Camp A Prediction (What this shows) | Camp B Prediction (What this shows) |
  | :--- | :--- | :--- | :--- |
  | **Adversarial Masking** | An LLM correctly solves a math problem in a clean context, but fails consistently when a specific "ignore previous instructions" token is inserted, despite no weight update. | Shows that mental/cognitive dispositions can exist without the counterfactual holding. The SCA is false for mental properties. | Shows the stimulus description was incomplete. The disposition is to solve math *given clean input*. No patch needed, just precision. |
  | **Dynamic Finking** | A model modifies its own attention masks during runtime when it detects a query type, effectively deleting the capacity to answer that query type mid-generation. | Shows the intrinsic base is what matters. The model *was* capable, but the fink removed the manifestation. SCA can't track this change. | Shows the disposition is time-indexed. At time T1 it had it, at T2 it didn't. The counterfactual is true for T1. SCA survives. |

  ### 5. Conclusion: Is This Verbal?

  We agree that some of this dispute is verbal, but not all of it. 

  Camp B thinks we are just arguing about how to define the "stimulus conditions." If you let them make the conditions complex enough (e.g., "if stimulated AND no fink present AND no mask present"), they can save the counterfactual analysis trivially. 

  Camp A thinks this trivializes the point. If you have to pack all the exceptions into the antecedent, the counterfactual isn't doing any explanatory work anymore. The real disagreement is about whether dispositions are *intrinsically grounded* (Camp A) or *relationally defined* (Camp B). 

  When we move to AI, this isn't just semantics. If Camp A is right, an LLM has genuine cognitive capacities even when prompt-injected into silence. If Camp B is right, an LLM under adversarial attack literally lacks the disposition to reason at that moment. That's a real difference for how we assess AI safety and alignment.
