      *   *(2) Epistemic vs. Ontic:* Axioms are often chosen for convenience/elegance (epistemic). Fundamentality is supposed to be mind-independent (ontic). *Verdict:* Critical mismatch.
      *   *(3) Non-uniqueness/Single Axiom:* Logical trickery (conjoining all axioms) vs. metaphysical structure. *Verdict:* Important nuance, shows the analogy is too flexible.
