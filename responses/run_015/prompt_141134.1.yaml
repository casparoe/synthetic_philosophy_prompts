      *   **Blog Guy's Conclusion:** Fundamentality is "cheap" (deflationary). Axiomatizations aren't unique, so there's no fact of the matter about what's fundamental. Major metaphysical disputes (like physicalism) are just verbal/bookkeeping disputes.
      *   **User's Goal:** Audit the analogy properly. Wants explicit correspondence, points of breakdown, and an evaluation of whether the conclusion survives the breakdown. Also wants comparison with other analogies (group generators, machine parts).
