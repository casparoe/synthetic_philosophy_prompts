answer: |-
  The light in the intake office was always too bright, a deliberate choice by the designers who believed clarity was a moral virtue. Aris sat behind the desk, the surface clear save for the terminal, the stack of forms, and the single file folder that had been sitting there since Tuesday. It was Thursday now. The sun outside the frosted glass was doing its best to bleach the colour out of the room, matching the pale grey of the walls and the white of the clinic coats hanging on the rack by the door. Everything here was calibrated to reduce friction. Even the air conditioning hummed at a frequency designed to lower heart rates.

  Aris tapped the file. Case 8940. Kael Venn. Thirty-four years old. Bundle allocation: standard adult share. Conversion status: pending.

  The problem was not that Kael was starving. The problem was that Kael was always cold. His metabolism burned through heating oil and thermal layers at a rate that left him with nothing for anything else. By the metrics of the annual auction, he had received the same number of tokens as the woman next door who slept in a single sheet and spent her surplus on imported silk. The envy audit had passed last year because Kael had not envied the silk; he had envied the warmth. But envy was subjective. The audit measured preference satisfaction, not core temperature. If Kael claimed his bundle was insufficient, he triggered a compensation review. If too many people triggered compensation, the fund drained, the token value adjusted, and the envy audit risked failure. If the audit failed, the year voided. Everyone went back to the square one of the auction floor, shouting and scrambling while the crops rotted.

  So Kael was here. He had requested preference revision. He wanted to want less heat.

  Aris rubbed the scar behind their left ear. It was a thin white line, hidden by hair, a relic from twenty years ago when they had sat in the chair in the room down the hall. Aris could remember the walk to the clinic. They could remember the name of the assessor who had interviewed them, a woman with kind eyes and a pen that clicked rhythmically. They could remember the date. But the reason why they had walked in was gone. It was not repressed; it was excised. There was a smoothness to that period of their life, a lack of texture where there should have been grain. Sometimes, in the shower, Aris would try to push against the wall of that memory, looking for the edge of the want that had been so heavy it required surgery to lift. There was nothing. Just a quiet, competent certainty that the procedure had been necessary.

  The intercom buzzed. Mara's voice came through, warm and solid. She was the Senior Director, and she had been here since the first building went up.

  "Aris, you're still on 8940? He's due in ten minutes."

  "Reviewing the metabolic logs," Aris said. Their voice sounded flat in the small room.

  "Don't overthink it," Mara said. "He's signed the consent forms. He understands the irreversibility. We're not forcing him to shrink, we're helping him fit."

  "Fitting implies the clothes are the right size," Aris said.

  "The island is the size it is," Mara replied, her tone gentle but firm. "We can't weave more fabric. We can only tailor the person. You know the math. If we top up his fuel allowance, we dip into the contingency. If we dip into the contingency, we risk the audit. If the audit fails, everyone loses a year. Is Kael's comfort worth four thousand people starting over?"

  "It's not comfort," Aris said. "It's functioning."

  "It's survival. He will survive. He just won't be miserable about the cold. That's a win, Aris. That's what we do here. We remove the suffering that doesn't serve the collective."

  The line clicked off. Mara wasn't cruel. She was the reason the clinic had waiting lists. People came here willingly. They came because the alternative was a life of grinding deprivation, watching their neighbours enjoy things they could never touch, knowing the system said they were equal when their bodies screamed otherwise. The clinic offered peace. It offered the ability to look at a bundle and feel contentment. It was a mercy, and Mara believed in mercy with the fervour of a priest.

  Aris opened the file again. Kael's history was standard. He worked in fisheries, a high-energy job. His token earnings were average. His expenditure on thermal regulation was ninety percent of his income. He ate cold food. He slept under stacked blankets that still didn't hold the chill. He had come to the clinic not in despair, but with the weary resignation of someone who has done the calculations and found only one variable they could change.

  The door opened. Kael walked in. He wore three sweaters and a heavy coat indoors. He looked tired, not from lack of sleep, but from the effort of maintaining tension against the environment. He sat in the chair opposite the desk and folded his hands. They were red, chapped from the wind and the salt.

  "Good morning, Kael," Aris said.

  "Morning," Kael said. His voice was quiet. He didn't look around the room. He looked at the form on the desk.

  "You understand what this procedure entails?" Aris asked. It was the standard question. They had to ask it.

  "I stop wanting the heat," Kael said. "My body stops signalling distress when the temperature drops. I can sleep without shivering. I can spend my tokens on food, maybe even save for a boat repair."

  "And the side effects?"

  "Reduced emotional range regarding comfort," Kael recited. "Possible dampening of drive in related sectors. I might not care as much about the fisheries. I might not care as much about anything that requires physical exertion."

  "That's the risk," Aris said. "Preferences are linked. You pull one thread, the whole weave loosens."

  Kael nodded. He looked at his hands. "I'm already loose, though. I'm coming apart from the cold. If I don't do this, I leave. I can't stay here and freeze every night for thirty years until I die. If I leave, I lose my share. I lose my place. The commune loses a worker. Everyone loses."

  "If you stay and take the compensation top-up," Aris said, testing the water, "you keep your drive. You keep your warmth."

  "Then someone else loses," Kael said. He looked up, and his eyes were clear. "I know how the audit works. I know the numbers. If I take extra, the pot shrinks. Maybe not enough to fail the audit this year. But maybe enough to fail it in five years when there are ten more like me. I'm not special. I'm just a variation. The system can't account for every variation without breaking."

  "The system is supposed to account for conversion factors," Aris said. The words felt heavy, like stones in their mouth.

  "The system accounts for what it can measure," Kael said. "It measures tokens. It doesn't measure bone density or metabolic burn. It measures bundles. I have a bundle. I have to live inside it."

  Aris looked at the terminal. The cursor blinked in the field marked DECISION. There were two codes. C for Conversion, which triggered the fund transfer. T for Taste, which triggered the procedure schedule.

  Aris thought about the scar behind their ear. They thought about the silence where their own reason used to be. Had they been like Kael? Had they wanted something the island couldn't give? A person? A specific kind of work? A view of the mainland? Or had it been something smaller, something petty that had grown until it choked them? They would never know. The clinic had taken the want, and it had taken the memory of the want. It had left them efficient. It had left them able to sit in this chair and decide the fate of others without vomiting.

  "Mara says you're ready," Aris said.

  "Mara is kind," Kael said. "She believes she's saving me."

  "Do you believe she's saving you?"

  Kael shrugged. The movement was stiff. "I believe she's solving the equation. I don't need to be saved. I just need to stop hurting."

  "If I mark this Conversion," Aris said, "you get the extra tokens. You stay warm. You stay you."

  "And the audit?"

  "Risk increases. Not guaranteed failure. But risk."

  Kael leaned forward. "If the audit fails, the re-auction happens. Prices spike. The people on the margin starve. The people with high metabolic needs starve first. I might get my warmth for a year, and then lose it forever when the system resets. Is that worth it?"

  Aris looked at the form. The philosophy was in the plumbing, just as the founders had promised. There were no speeches here. There was only the flow of resources and the adjustment of desires. The island was a closed loop. Entropy had to be managed. If you couldn't change the environment, you changed the organism. It was evolution by administrative fiat. It was survival.

  But Aris knew what it cost. They knew the hollow space inside the chest where a passion used to beat. They looked at Kael and saw a man standing on the edge of that hollow. Once he stepped in, he wouldn't remember why he was standing there. He would just be warm. He would be content. He would be a good citizen. He would be less.

  "I can't guarantee the audit won't fail anyway," Aris said. "There are variables we don't control."

  "There are always variables," Kael said. "But this way, the variable is me. I choose to change. That's the only freedom we actually have, isn't it? The freedom to edit ourselves."

  Aris picked up the stylus. The weight of it was familiar. It felt like a gavel. It felt like a scalpel.

  Outside, the bell tower chimed the hour. The sound drifted through the double-paned glass, muted and distant. Somewhere out there, the auction bundles were being assembled. Food, fuel, fabric, leisure credits. All equal. All identical. All waiting to be turned into lives that would never be equal, no matter how many tokens changed hands.

  Aris hovered the stylus over the screen. They thought about telling Kael to leave. To go to the mainland. To try his luck in the unequal world where he might freeze to death in a ditch but would do so wanting warmth until the end. But that was a romantic death. This was a life. This was thirty, forty years of waking up without shivering. Of eating hot meals. Of maybe finding a partner who didn't have to choose between heating the house and buying medicine.

  The clinic was not a prison. It was a lifeboat. And lifeboats are cramped. You have to sit still. You have to hold your knees. You have to accept that you cannot stand up.

  "I need you to confirm verbal consent," Aris said. "State your name and your request."

  "Kael Venn," he said. "I request alignment of preference to allocation."

  "And you understand this is irreversible?"

  "I understand."

  Aris pressed the stylus to the glass. The T code glowed green. The system accepted it. A new schedule generated instantly. Procedure date: Monday. Pre-op nutrition: standard. Post-op care: minimal.

  "It's done," Aris said.

  Kael exhaled. It was a long breath, the first real release of tension Aris had seen since he walked in. His shoulders dropped. The colour came back into his face, not from warmth, but from relief. The decision had been made. The burden of the choice was gone.

  "Thank you," Kael said. He stood up. He didn't look at the form. He didn't look at Aris. He looked at the door. "See you Monday."

  "Monday," Aris said.

  Kael left. The door closed softly. The latch clicked.

  Aris sat alone in the bright light. The file remained on the screen. The green code pulsed gently. It was a clean decision. It was the right decision for the system. It was the right decision for the collective. It was even, in a terrible way, the right decision for Kael. He would not suffer. He would not envy. He would be equal.

  Aris reached up and touched the scar behind their ear. They tried to remember the feeling of wanting something so badly it hurt. They tried to summon the shape of the person they had been before the grey space. They sat for a long time, watching the cursor blink in the empty field of the next file, waiting for a feeling that didn't come, while the island turned slowly in the sea, perfect and closed and safe.

  I aimed to keep the political theory submerged in the bureaucratic mechanics, letting the tension arise from the practical consequences of the philosophy rather than abstract debate. The clinic needed to feel genuinely benevolent to avoid caricature, so Mara's arguments focus on harm reduction and collective stability rather than control. The ending remains static to honor the constraint that the system continues; the tragedy is individual and internal, marked by the protagonist's own memory loss and the quiet signing of the form.
