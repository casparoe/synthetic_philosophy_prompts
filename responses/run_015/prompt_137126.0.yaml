answer: |-
  ### The Desk Procedure: A Five-Step Triage

  You have one hour. You cannot philosophize; you must triage. This procedure prioritizes the *reader's experience of the poem as a living thing* over the *architect's blueprint of the poem as an object*. It synthesizes Hofstadter's insistence that form carries meaning with the critic's warning that a corpse in a fine suit is still a corpse.

  **Step 1: The Perceptibility Test (Time: 5 mins)**
  Ask: *Does the source reader perceive this constraint during the flow of reading, or only upon analysis?*
  *   **Hearable/Feelable (Rhyme, Rhythm, Refrain):** High Priority. These affect the pulse of the reading.
  *   **Visible (Stanza shape, Acrostic):** Medium Priority. These affect the book as an object, not the voice in the head.
  *   **Knowable (Gender, Etymology, Hidden Math):** Low Priority. These are intellectual facts, not poetic experiences.
  *   *Confidence:* High. A constraint that stops the ear stops the poem.

  **Step 2: The Function Test (Time: 10 mins)**
  Ask: *What work is this constraint doing?*
  *   **Structural Load-Bearing:** Does the poem collapse without it? (e.g., a sonnet without 14 lines is not a sonnet).
  *   **Atmospheric:** Does it create a mood? (e.g., strict syllable count creating tension).
  *   **Informational:** Does it convey specific data? (e.g., the brother's name, the addressee's gender).
  *   *Confidence:* Medium-High. Distinguishing "mood" from "structure" is subjective, but necessary.

  **Step 3: The Naturalness Cost (Time: 15 mins)**
  Ask: *If I preserve this, does the English sound like a translation?*
  *   **Yes:** The constraint is killing the voice. **Drop or Modify the constraint.** (This is the Critic's veto).
  *   **No:** Proceed.
  *   *Confidence:* High. If the voice dies, the form is a coffin.

  **Step 4: The Truth vs. Structure Hand-Off (Time: 10 mins)**
  Ask: *Does preserving the form require lying about a specific reality (a name, a place, a plot point)?*
  *   **Yes:** **Stop.** This is the hand-off point. Email the author.
  *   **Default Rule (if no answer in 48 hours):** **Biographical Truth Wins.** Do not change the dead brother's name to fit an acrostic. Do not change a plot detail to fit a rhyme.
  *   **No (It is purely formal):** Translator decides based on Step 3.
  *   *Confidence:* Medium. This is where you will feel the most guilt.

  **Step 5: The Note Budget (Time: 5 mins)**
  Ask: *Can I explain this loss in fewer than 50 words?*
  *   **Yes:** Footnote it.
  *   **No:** Absorb the loss silently. You have 600 stanzas and one page. You cannot apologize for every scar.
  *   *Confidence:* High. Scarcity forces discipline.

  ***

  ### Simplification: What Survives Pressure?

  **Keep:** The distinction between **Hearable** and **Visible**. Under time pressure, you cannot analyze the "soul" of every constraint. You can, however, read a line aloud. If it stumbles, it fails. If it rhymes, it sings. This binary is robust.

  **Drop:** The distinction between **Translate what is seen** and **Footnote the rest**. Your original rule failed because "seeing" an acrostic is not the same as "reading" it. Treat all "Visible" and "Knowable" constraints as **Footnote Candidates** first. Only promote them to **Translation Requirements** if they pass Step 2 (Structural Load-Bearing).

  **Where It Will Misfire:**
  Step 2 (Function) is the weak link. Under time pressure, you may mistake a decorative constraint for a structural one. You may decide a syllable count is "atmospheric" when it is actually the engine of the poem. This procedure cannot save you from misreading the source; it only saves you from ruining the target once you have read it.

  ***

  ### Running the Cruxes

  #### Crux 1: The Acrostic (The Brother's Name)
  *   **Step 1 (Perceptibility):** Visible. The reader does not hear the acrostic while reading the narrative. (Low Priority).
  *   **Step 2 (Function):** Structural/Informational. It spells a name.
  *   **Step 3 (Naturalness):** N/A (It is a puzzle, not a syntax).
  *   **Step 4 (Truth vs. Structure):** **Conflict.** To keep the Acrostic (Structure), you must change the Brother's Name (Truth).
      *   *Action:* Hand-off. Email author.
      *   *Default (No answer):* **Biographical Truth Wins.** Keep the Brother's actual name. Lose the Acrostic.
  *   **Step 5 (Note Budget):** Can you explain? "The original contains an acrostic spelling the brother's name; in English, this was impossible without altering the name." (20 words).
  *   **Decision:** **Drop the Acrostic. Keep the Name.** Use your single page of endnotes to explain this once, globally, at the start or end of the book. Do not try to recreate the puzzle with a fake name.
  *   **What You Lose:** The architectural secret. The book becomes a novel *about* a brother, rather than an object *built for* a brother.
  *   **Confidence:** High. Lying about the dead violates the contract of the novel.

  #### Crux 2: Syllable Count vs. Natural Syntax
  *   **Step 1 (Perceptibility):** Hearable/Feelable. The reader feels the line length and rhythm. (High Priority).
  *   **Step 2 (Function):** Atmospheric. It creates tension and pace.
  *   **Step 3 (Naturalness):** **Fail.** You state holding the count forces word order that "reads like a translation."
      *   *Action:* **Drop the strict count.**
      *   *Modification:* Preserve the *visual* line length (number of words or stresses) if possible, but allow the syllable count to vary to save the syntax.
  *   **Step 4 (Truth vs. Structure):** No lie involved.
  *   **Step 5 (Note Budget):** Do not footnote. This is a standard translation compromise.
  *   **Decision:** **Let the count go.** Save the voice. A reader will forgive a variable syllable count; they will not forgive a sentence that sounds like a machine.
  *   **What You Lose:** The specific metrical tension of the source. The English will feel slightly looser, less "tightened" than the original.
  *   **Confidence:** High. This is the Critic's valid objection. Form without voice is dead.

  #### Crux 3: The Gendered Address
  *   **Step 1 (Perceptibility):** Knowable/Grammatical. The reader infers gender from pronouns/nouns. (Medium Priority).
  *   **Step 2 (Function):** Informational/Ambiguity. The original uses grammar to *avoid* settling the gender.
  *   **Step 3 (Naturalness):** **Fail.** English grammar forces a choice (He/She/They). "They" may break your rhyme or meter (AABCCB).
  *   **Step 4 (Truth vs. Structure):** **Conflict.** To preserve the Ambiguity (Truth), you must use "They" or passive voice, which may break the Rhyme/Meter (Structure). To preserve the Rhyme/Meter, you must pick He or She (Lie).
      *   *Action:* **Hand-off.** Email author: "English forces a gender. Do I pick one or break the meter?"
      *   *Default (No answer):* **Structure Wins.** Pick a gender (e.g., Feminine, matching the source grammar) and **do not footnote it.**
  *   **Step 5 (Note Budget):** You cannot footnote this on every stanza. One global note ("The original uses grammatical gender to...") is possible, but if you must choose between the Note and the Rhyme, **keep the Rhyme.**
  *   **Decision:** **Force the Gender.** Pick "She" (matching the source grammar) and accept that you have resolved the ambiguity the author carefully maintained.
  *   **What You Lose:** The deliberate uncertainty. The English text will say something the source text refused to say.
  *   **Confidence:** **Low.** (See below). This is the outcome you will dislike.

  ***

  ### The Vulnerable Claim

  The single claim I am least sure of—the one where a working literary translator or theorist is most likely to tell me I have got it wrong—is the **Default Rule in Crux 3 (Gender)**.

  I have instructed you to **resolve the ambiguity** (pick a gender) and **prioritize the Rhyme/Meter** over the semantic nuance of uncertainty, based on the logic that you cannot footnote every stanza and the form (Hofstadter's "soul") must survive.

  A theorist will argue that by forcing a gender, you have fundamentally altered the *meaning* of the passage, turning a poem about ambiguity into a poem about a specific woman. They will say that "Translationese" (awkward syntax to preserve ambiguity) is preferable to "False Certainty." They will argue that the **Critic's objection** (preserving the wrong half) applies here: by saving the rhyme, you have killed the specific philosophical point of the stanza.

  My procedure prioritizes the *integrity of the verse novel as a sung object* over the *precision of the semantic ambiguity*. In a 600-stanza work, consistency of voice and form is the primary contract with the reader. If the book stumbles every time gender arises, the book fails. But this is a gamble. It assumes the reader values the song more than the specific philosophical shade of the address. You may find, in practice, that the loss of that ambiguity hollows out the very section you are translating. That is the risk of the procedure: it saves the body of the work, but it may amputate a finger to do so.
