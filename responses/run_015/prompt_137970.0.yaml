  "And if we supply the weights, we break the cycle."

  "By fiat. Not by discovery."

  "By rational necessity."

  "Which is just another name for fiat."

  "It's the condition of action."

  "And I'm saying action can accommodate cycles. We choose knowing the loss."

  "Not rational action."

  "Then rationality is the problem. It demands too much of the world."

  "No. Your model of value is. It assumes pluralism without hierarchy."

  "Your model assumes a single scale. It assumes unity."

  "It assumes consistency."

  "Consistency requires a single scale."

  "Or at least a coherent aggregation. Counting isn't coherent if it cycles."

  "Then it isn't 'better than'."

  "Then what is it?"

  "I told you. Supported by more respects."

  "And that guides choice."

  "Not if it cycles."

  "It guides me to see the cycle."

  "And then?"

  "And then I choose. Knowing the cost."

  "Knowing there is no best."

  "Yes."

  "That's the cost."

  "No. The cost is pretending there is one."

  "We're back to the weighting fact."

  "We are."

  "Does it exist?"

  "You say no. I say it must."

  "Must isn't does."

  "For value, must is does."

  "That's the claim."

  "That's the claim."

  "Okay."

  "Okay."
