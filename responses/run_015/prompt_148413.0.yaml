answer: |-
  **Aaron Kellner:** The moral force of meritocracy depends on the claim that individuals deserve the rewards flowing from their productive contributions. But consider the source of those contributions. The traits that make one productive—intelligence, conscientiousness, even the capacity for sustained effort—are largely constitutive luck. They are gifts of genetics or upbringing, not achievements of the will. If you did not choose your native endowments, you cannot claim moral credit for what those endowments produce. To reward them is to reward luck, not agency. Thus, the desert base collapses.

  **Marit Voss:** You argue that because the traits underlying contribution are unchosen, the resulting rewards are morally arbitrary. I grant the pervasiveness of luck. However, you infer from this that desert must be binary: either one authors oneself entirely, or one deserves nothing. I propose instead that desert is scalar, pro tanto, and defeasible. Moral responsibility for an outcome does not require having authored the traits that produced it; otherwise, the concept would have no instances at all, since no one creates themselves ex nihilo. We hold agents responsible for how they exercise their capacities, even if those capacities were given. The question is not whether luck exists, but whether agency filters it sufficiently to ground a claim.

  I must, however, concede a technical problem with the naive version of this view. The naive version identifies a worker's desert base with her marginal product. But when production involves strong complementarities—cases where two workers are worth far more together than either is alone, as with a surgeon and a specialist nursing team—marginal products do not sum to the total available for distribution. Under increasing returns, they sum to more than the whole; under decreasing returns, to less. So "give each her marginal product" is sometimes impossible. I therefore propose a coalitional measure: a person's desert base is her average marginal contribution across every possible order in which the workforce could be assembled. This ensures that people who are productive only jointly come to share the surplus symmetrically. This is not a rhetorical flourish but a repair internal to desert theory. Average-over-orderings is a more faithful rendering of "her contribution" than marginal-product-at-actual-employment because it isolates her specific additive value from the accident of her position in the production chain.

  **Aaron Kellner:** Let me ensure I understand the repair. You are suggesting that we calculate what a worker adds to every possible subset of her colleagues, average those figures, and treat that number as her desert base. I grant the mathematics. But this admits many admissible divisions. The average-over-orderings is one solution, but so is the division that lexicographically minimizes the worst-off coalition's complaint, or an equal division of the cooperative surplus. These yield different numbers for the same person. If desert is supposed to tell us how much someone deserves, and the choice among these divisions is what fixes the number, then desert itself is doing none of the work. The residual choice is an unargued political one. Furthermore, a person's share under any of these rules depends on who else happens to exist and on the shape of demand. Whether I am a surgeon matters less than whether there are nurses to complement me. Both are brute luck from my point of view. Your repair saves the accounting but loses the morality.

  **Marit Voss:** You contend that because the coalitional data admits multiple division rules, the concept of desert is indeterminate and thus vacuous. You argue that since the final number depends on a political choice among admissible rules, desert provides no independent constraint. I distinguish here between metaphysical and epistemic indeterminacy. Desert may be an essentially comparative and imprecise notion—it can order claims and rule out allocations without determining a unique cardinal share. Imprecision in a normative base is not the same as absence of one. We can know one claim is stronger than another without knowing the exact ratio between them.

  But consider the metric your own view uses to size compensation for brute luck. To answer "how badly off is she, through no choice of her own?" requires a counterfactual baseline. You must measure what she would have had under equal luck. This reintroduces measurement of opportunity, contribution, or forgone alternatives. You must estimate her potential productivity had her endowments been different. Hence, you borrow from the very apparatus you are attacking. You cannot define the deficit caused by luck without referencing the value of the contributions luck denied her. Your critique presupposes the measurability of contribution it seeks to undermine.

  **Aaron Kellner:** We are circling a deeper question we had not made explicit. You treat desert as pre-institutional—a moral fact about persons that exists independently of the rules we adopt, against which rules can be assessed. I suspect it is institutional—a status constituted by the rules and purposes we happen to have, so that it cannot serve as an independent standard for assessing them. Here is my concession: if desert is institutional, then your coalitional measure is valid within the institution, but it cannot justify the institution itself. I had assumed you claimed it could. That costs me the ability to say meritocracy is intrinsically unjust; I can only say it is contingent on our chosen purposes.

  **Marit Voss:** And I concede that if desert is institutional, my claim that rewards track moral responsibility is weaker than I intended. It becomes a claim about fitting rewards to social roles rather than cosmic justice. That costs me the ability to condemn luck-egalitarian distributions as morally wrong; I can only say they fail to track the specific institutional virtue of efficiency or recognition. So here remains the dispute, once everything else is set aside: Is there a fact of the matter about what a person deserves prior to the rules we write, or is desert merely the shadow cast by the institutions we build? I say the former; you say the latter. Until that is settled, we are arguing past one another.

  **Aaron Kellner:** Then we agree on the terms of our disagreement. You seek a moral anchor outside the ship; I argue the anchor is part of the ship's design. Neither of us can prove the ship should sail without assuming the very standards we are questioning.

  **Marit Voss:** Precisely. And until we know whether the anchor holds to the seabed or only to the hull, we cannot know if we are moored or drifting.
