answer: |-
  I am not here to welcome you. We know why we are in this room. We are here because the dead are currently the most popular demographic in cinema, yet they possess no agency to object to how they are portrayed. We are here because a tension exists between those of us who build narratives and those of us who preserve records. Usually, this tension is resolved by a compromise: the historians concede that drama requires compression, and the filmmakers promise to keep the dates correct.

  I propose we reject that compromise. It is too shallow.

  For the next three days, I ask you to operate under a specific ethical constraint. It is this: What we owe the dead is not biographical accuracy—since selection and framing are already interpretations—but rather the preservation of *moral distance*. We must not collapse their alien reasoning into contemporary psychological categories. We must respect what I call the *architecture of their commitments*. By this, I mean the internal logic that made their choices coherent within a worldview we no longer share.

  To the historians in the room: I know this sounds like a license for invention. To the producers: I know this sounds like a shackle on creativity. I argue it is neither. It is the only way to dramatize the past without colonizing it.

  The default mode of biographical drama is assimilation. We make the dead relatable. We give them modern interiorities. We assume that a person in 1850 felt about ambition, love, or duty exactly as a person in 2024 does. When we do this, we are not telling their story; we are dressing ourselves in their costumes. This is not an ethical failure of fact; it is an ethical failure of ontology. We are erasing the very difference that makes history worth studying.

  Let me demonstrate the practical force of this constraint with a single hypothetical.

  Imagine we are dramatizing the life of a nineteenth-century civil engineer. The historical record tells us one peculiar, definitive fact: late in his career, this man gathered his patent applications and destroyed them. He refused to privatize his innovations.

  The screenwriter's instinct is to ask *why* in a way that drives a second act. The historian's instinct is to ask *if* this actually happened. But the ethical question I am posing is: *How do we render his motivation?*

  If we adhere to the standard model of relatability, we invent a private scene. Perhaps we show him in his study, drinking whiskey, looking at a portrait of his father. We give him dialogue about his fear of failure. We suggest he destroyed the patents because he was anxious that the technology wasn't perfect, or because he was having a crisis of confidence. We might even suggest he did it to spite a rival.

  This makes narrative sense. It fits the architecture of modern ambition. It makes him "human" in a way a contemporary audience recognizes. But it is a lie.

  Suppose the archival evidence suggests his reasoning was theological. Suppose he belonged to a sect that believed proprietary knowledge violated a doctrine of common stewardship. To him, patenting an idea was not a business decision; it was a sin against God's design for the commons.

  If we write the scene where he burns the papers, we are already inventing. There is no transcript of that night. But here is where the constraint applies. If we write that scene to show him as anxious, ambitious, or psychologically conflicted in a modern sense, we are exploiting his silence. We are forcing a modern soul into a historical body. We have collapsed the moral distance.

  However, if we write that scene to render his alien logic visible, we are honoring the architecture of his commitments. We can invent the dialogue. We can invent the lighting, the weather, the presence of a witness. But the *logic* of the scene must remain rigorous to his worldview. He should not sound like a man struggling with capitalism; he should sound like a man struggling with salvation. He should speak in the cadence of his theology, not our psychology.

  This is permissible—even illuminating—because it uses the tools of drama to expose a mindset that the archives can only describe dryly. It becomes exploitative only when we reduce his refusal to a narrative of neurosis or ambition that he would not recognize.

  To the historians: You often fear that invention betrays the archive. I argue that bad invention betrays the archive. Good invention—the kind that respects moral distance—can actually protect the archive from the audience's assumption that the past was just like the present. By insisting that this engineer's logic remains alien to us, you ensure the audience understands that history is a foreign country.

  To the filmmakers: You often fear that ethics means censorship. It does not. A sonnet has a rhyme scheme; that is not a prohibition on poetry, it is a structure that makes poetry possible. This constraint is your rhyme scheme. It challenges you to find the drama in the *difference* between us and them, rather than the similarity. It is far more compelling to watch a character operate by a code we do not understand than to watch a character who thinks exactly like us but wears a top hat.

  For the next three days, as you debate the ethics of biographical drama, I ask you to use this metric. When you review a script or analyze a film, do not simply ask, "Did this happen?" Ask, "Is this motivation possible for this person?"

  If a character acts out of a sense of individual autonomy that did not exist in their time, you have violated the constraint. If a character expresses grief in a language of trauma that belongs to our century, not theirs, you have violated the constraint.

  We cannot ask the dead for consent. They cannot stop us from putting words in their mouths. But we can choose whether those words translate their humanity into our terms, or whether we make the effort to speak in theirs.

  Let us not use the dead as mirrors. Let us use them as windows. If we preserve the architecture of their commitments, we may find that the view is stranger, more difficult, and ultimately more profound than anything we could invent on our own.

  Thank you. Let us begin.
