      *   *Constraint Check:* Is it 10 minutes? roughly 1000-1300 words.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound *too* pessimistic to the family. The "consolation" must be shifted from "survival of self" to "significance of the struggle."
