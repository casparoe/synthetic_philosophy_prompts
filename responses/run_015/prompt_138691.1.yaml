prompt: |-
  Hey — I host a small podcast on formal epistemology (mostly grad students listen, plus a few undergrads who wander in from decision theory) and next week's guest is a philosopher who's just published a paper defending *Reflection* as the more basic diachronic norm: the idea being that if you get van Fraassen's principle right, conditionalization falls out of it rather than the other way round, so a lot of the usual back-and-forth about whether conditionalization is really a requirement of rationality is secretly a fight about Reflection. I've read the abstract and maybe half the paper properly and I keep loseing the thread in the technical middle bit, so I want to go in with a plan. I've got about 40 minutes with her.

  Here's what I need: eight interview questions, each with a follow-up keyed to the answer she's most likely to give, and where useful a second follow-up for when she declines to bite. You can assume she'll state the principle herself in the first five minutes (current credence in P, supposing your future credence in P will be r, should be r) and that she'll give the diachronic Dutch book argument, so please definately don't write questions that just invite her to restate either — and no "what got you into formal epistemology" warm-ups, I can do those myself. The stuff I want pressed: (1) the cases where you know in advance that your future self will be epistemically impaired — the drug / brainwashing ones, but also the boring version where you know you'll be sleep deprived or reading a dossier someone has stacked against you; she'll probably say Reflection only constrains deference to future selves you regard as better informed, so the follow-up should make her say exactly how that restriction gets stated without making the principle vacuous, and whether the restricted version still delivers conditionalization. (2) The formulation worry: Reflection as usually stated has you conditioning on your having *exactly* some credence, which looks like conditioning on something you assign probability zero, and there's a weaker "in expectation" version that dodges this — does the Dutch book argument need the pointwise version or does the expectation version carry it, and if it doesn't, what's carrying the normativity? (3) What the diachronic Dutch book is actually supposed to show: if the argument only works because a bookie can exploit the *plan* you'd endorse now, then Reflection looks like a constraint on plans rather than on future credences, and I want a question that makes her say whether she's happy with that and what an argument for Reflection would look like that isn't plan-based — e.g. whether the accuracy / epistemic-utility arguments for conditionalization can be run for Reflection without just piggybacking on the conditionalization result. (4) Self-locating and forgetting cases: you fall asleep and lose information, or you learn only which centered possibility you're in; does Reflection even have a well-formed statement there, and should it be a norm on your earliest self, your current self, or both? (5) A thing I've been chewing on with a friend and can't work out, which I've been calling *deference-with-discount*: instead of deferring to your expected future credence, defer to it minus the bias you can already predict in it (you know that tomorrow you'll have read three alarming headlines and will overreact). Does that collapse back into conditionalizing on a corrected likelihood, or is it a genuinely different norm that's weaker than Reflection but stronger than nothing? If it's the latter, is that a point against Reflection being basic?

  One last thing: for the three questions you think are hardest, add a short note on where her most likely answer is actually *good* — i.e. what she could say that would make the line of questioning collapse, what would count as her having answered rather than deflected, and any place where the question secretly assumes something she'd reject (like that your expected future credence function is well defined, or that the Dutch book argument is meant as a pragmatic rather than evidential argument). I'd rather walk in knowing which of my questions might just die on contact than find out live.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Host of a small podcast on formal epistemology (audience: grad students, advanced undergrads).
      *   **Guest:** Philosopher who published a paper defending *Reflection* as more basic than Conditionalization.
      *   **Time:** 40 minutes (tight).
      *   **Deliverable:** 8 interview questions, each with a primary follow-up (likely answer) and a secondary follow-up (if she declines to bite).
      *   **Constraints:**
          *   No warm-ups ("what got you into...").
          *   No restating the principle or Dutch book argument (assume she covers this early).
          *   Focus areas: (1) Impaired future selves (restriction vs. vacuity), (2) Formulation (pointwise vs. expectation, prob 0 issues), (3) Normative force (plans vs. credences, accuracy arguments), (4) Self-locating/forgetting cases, (5) "Deference-with-discount" (bias correction).
          *   Special requirement: For the 3 hardest questions, add a note on where her answer might be *too good* (collapsing the line of questioning) or where the question assumes something she rejects.

  2.  **Deconstruct the Core Philosophical Issue:**
      *   *Van Fraassen's Reflection Principle:* $C_t(P | C_{t'}(P) = r) = r$. (Current credence in P, given that future credence in P will be r, should be r).
      *   *The Guest's Claim:* Reflection is more fundamental. Conditionalization ($C_{t'}(P) = C_t(P|E)$) is derived from Reflection + the assumption that you learn E and nothing else.
      *   *The Tension:* Reflection seems to demand deference to future selves even when they are irrational, forgetful, or biased. Standard fixes (restricting to "rational" future selves) risk circularity (defining rational future selves as those who conditionalize) or vacuity.
      *   *Technical Nuance:* Conditioning on $C_{t'}(P)=r$ is problematic if that event has probability 0. Expectation versions ($C_t(P) = E_t[C_{t'}(P)]$) avoid this but might be weaker.
      *   *Normativity:* Is it about avoiding Dutch Books (pragmatic) or accuracy (epistemic)? Is it about plans or actual states?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Impaired Future Selves.*
          *   *Draft:* What about when you know you'll be drunk?
          *   *Refinement:* Need to press on the restriction condition. If she says "only defer to rational future selves," does that make Reflection dependent on Conditionalization?
          *   *Question 1:* Focus on the "epistemically impaired" counterexamples (drugs, bias).
          *   *Follow-up:* How to specify the restriction without presupposing Conditionalization?
          *   *Second Follow-up:* If restricted, does it still derive Conditionalization universally?

      *   *Topic 2: Formulation (Pointwise vs. Expectation).*
          *   *Draft:* Isn't conditioning on probability zero bad?
          *   *Refinement:* Focus on the Dutch Book. Does the DB argument require the strong version? If we use the weak version, where does the normativity come from?
          *   *Question 2:* The measure-zero problem.
          *   *Follow-up:* Does the DB argument survive the expectation version?
          *   *Second Follow-up:* If not DB, is it accuracy?

      *   *Topic 3: Normative Force (Plans vs. States).*
          *   *Draft:* Is this about plans?
          *   *Refinement:* The DB argument targets a *policy*. Does Reflection constrain the *outcome* or the *plan*? Can accuracy arguments support Reflection directly?
          *   *Question 3:* Plan vs. Credence constraint.
          *   *Follow-up:* Can accuracy arguments run for Reflection without piggybacking on Cond?
          *   *Second Follow-up:* If it's just plans, is it really a diachronic norm of *belief*?

      *   *Topic 4: Self-Locating/Forgetting.*
          *   *Draft:* What about sleeping?
          *   *Refinement:* Reflection usually assumes learning. Forgetting violates the "superset" assumption of evidence. Does Reflection break?
          *   *Question 4:* Centered worlds/forgetting.
          *   *Follow-up:* Is it a norm on the earliest self or current self?
          *   *Second Follow-up:* Does this require a new formalism (e.g., Halpern)?

      *   *Topic 5: Deference-with-Discount.*
          *   *Draft:* What if I know I'll be biased?
          *   *Refinement:* The user's specific idea: Defer to $E[C_{t'}] - \text{bias}$. Is this a rival norm?
          *   *Question 5:* The "Deference-with-Discount" proposal.
          *   *Follow-up:* Is this just Conditionalization on a richer evidence set?
          *   *Second Follow-up:* If it's distinct, does that undermine Reflection's fundamentality?

      *   *Need 3 more questions to hit 8.*
          *   *Question 6 (Connection to Conditionalization):* If Reflection is basic, what happens in cases where Conditionalization seems right but Reflection seems wrong (or vice versa)? Let's focus on the *derivation*. How exactly does Cond fall out?
          *   *Question 7 (Externalism/Internalism):* Reflection seems internalist (what I *think* my future self will think). Conditionalization is often framed externalist (what evidence I *actually* got). How does she reconcile this?
          *   *Question 8 (The "Why"):* Why is deference to future selves the *bedrock*? Why not synchronic coherence?

      *   *Selecting the "Hardest" 3 for the Special Note:*
          *   Question 1 (Impaired Selves) is classic and she likely has a canned response.
          *   Question 3 (Plans vs. States/Accuracy) cuts to the metaphysical/normative core.
          *   Question 5 (Deference-with-Discount) is the user's original idea, so it's unpredictable and technically dense.

  4.  **Refining and Polishing:**
      *   *Tone:* Professional, technical but accessible to grad students, respectful but pressing.
      *   *Structure:* Ensure the flow makes sense for a 40-min interview (start with technical constraints, move to normative force, end with broader implications).
      *   *Check Constraints:* 8 questions? Yes. Follow-ups? Yes. Second follow-ups? Yes. Special notes on 3 hardest? Yes. No warm-ups? Yes.

      *(Self-Correction during drafting)*: Make sure Question 1 doesn't let her off the hook with "We only defer to rational selves." The follow-up must demand the *analysis* of rationality.
      *(Self-Correction on Question 5)*: Ensure the "Deference-with-Discount" is phrased clearly so she understands the specific challenge to Reflection's *basicality*.

  5.  **Final Review against User Prompt:**
      *   "Eight interview questions": Check.
      *   "Each with a follow-up keyed to the answer she's most likely to give": Check.
      *   "Second follow-up for when she declines to bite": Check.
      *   "No warm-ups": Check.
      *   "Don't ask to restate principle/DB": Check.
      *   "Press on (1) impaired selves, (2) formulation/prob 0, (3) plans vs credences/accuracy, (4) self-locating, (5) deference-with-discount": Check. (I will distribute these across the 8 questions).
      *   "Special note on 3 hardest questions": Check.

  6.  **Final Polish of the "Special Notes":**
      *   Need to identify where the question might "die on contact."
      *   Q1 (Impaired): She might have a sophisticated "screening off" condition.
      *   Q3 (Accuracy): She might cite recent literature (e.g., Briggs/Pettigrew) that already does this.
      *   Q5 (Discount): She might argue this *is* just Reflection applied to a different proposition.

      *Let's assemble the output.*
answer: |-
  Here is a plan for your 40-minute interview. The questions are ordered to move from technical constraints (the "how") to normative foundations (the "why"), ending with your specific challenge regarding bias correction.

  I have selected **Questions 1, 3, and 5** as the "hardest" for the special notes, as these target the most vulnerable points in the Reflection-first literature.

  ### 1. The Impaired Future Self (The Restriction Problem)
  **Q:** Standard counterexamples to Reflection involve cases where you know in advance your future self will be epistemically impaired—say, you know you'll be sleep-deprived or reading a biased dossier. The standard move is to restrict Reflection so it only constrains deference to future selves you regard as *better* informed or rational. But if you define "rational future self" as "a self that Conditionalizes," aren't you making Reflection dependent on Conditionalization rather than the other way round? How do you state the restriction condition without presupposing the very norm you're trying to derive?

  *   **Follow-up (If she proposes a restriction like "only defer to selves you trust"):** Okay, but "trust" needs a formal cash value. If the restriction is simply "defer unless you have positive evidence of irrationality," doesn't that collapse Reflection into a trivial claim? Because if I have no evidence of irrationality, I'm already assuming my future self tracks the evidence, which looks like assuming Conditionalization by another name.
  *   **Second Follow-up (If she insists the restriction is non-circular):** If the restriction is substantive, does the restricted version of Reflection still deliver Conditionalization as a theorem in all the standard cases? Or does it leave gaps where Conditionalization holds but Reflection doesn't apply?

  > **Note on where this might die:**
  > *   **The "Good" Answer:** She might invoke a **screening-off condition** (e.g., *Arntzenius* or *Christensen* style) where the restriction isn't about "rationality" per se, but about whether your *current* evidence screens off the future evidence. If she argues that in the "biased dossier" case, your current credence should *not* match the future one because your current evidence already accounts for the bias, she hasn't restricted Reflection; she's just applied it correctly.
  > *   **The Trap:** This question assumes the restriction must be stated in terms of *rationality*. If she argues the restriction is purely probabilistic (e.g., about correlation between current and future evidence), your follow-up about circularity might miss the mark.

  ### 2. The Measure-Zero Problem (Pointwise vs. Expectation)
  **Q:** Let's look at the formulation. The standard principle has you conditioning on the proposition that your future credence will be *exactly* $r$. In continuous probability spaces, or even finite ones where you aren't certain you'll adopt a specific function, that proposition often has probability zero. There's a weaker "in expectation" version ($C_t(P) = E_t[C_{t'}(P)]$) that dodges this. Does the Diachronic Dutch Book argument actually require the pointwise version, or does the expectation version carry the normative weight?

  *   **Follow-up (If she says the expectation version is sufficient):** If the expectation version is sufficient, the Dutch Book argument becomes much weaker—it only shows you're vulnerable if your *average* future credence is off, not if you violate Reflection in a specific instance. Does that weaken the claim that Reflection is a strict requirement of rationality?
  *   **Second Follow-up (If she says the pointwise version is necessary):** Then how do you handle the conditioning on probability zero without appealing to primitive conditional probabilities or regularity assumptions that seem to do all the heavy lifting anyway?

  ### 3. Plans vs. States (The Normative Source)
  **Q:** The Diachronic Dutch Book argument works by showing that a *policy* or *plan* you endorse now makes you vulnerable later. This suggests Reflection is a constraint on the plans you are willing to endorse, not necessarily on the credences you actually end up with. Are you happy to concede that Reflection is a norm on *planning* rather than a norm on *belief states*? And if it is just a planning norm, can it really be more fundamental than Conditionalization, which is usually framed as a constraint on the belief state itself?

  *   **Follow-up (If she says it applies to belief states too):** Then we need an argument that isn't pragmatic. Can the accuracy / epistemic-utility arguments that have been run for Conditionalization (like those by Greaves and Wallace) be run directly for Reflection without just piggybacking on the fact that Conditionalization maximizes accuracy?
  *   **Second Follow-up (If she says accuracy arguments do work for Reflection):** If accuracy arguments support Reflection directly, does that mean Reflection is an *epistemic* norm while the Dutch Book is merely a pragmatic justification? And if they come apart, which one do you privilege?

  > **Note on where this might die:**
  > *   **The "Good" Answer:** She might cite recent work (e.g., *Briggs & Pettigrew*) showing that **Accuracy Dominance** arguments can be formulated directly for Reflection without mentioning Conditionalization. If she can point to a theorem showing that violating Reflection *always* leaves you with a less accurate credence function regardless of what updating rule you use, the distinction between "plan" and "state" blurs, and your follow-up about piggybacking loses force.
  > *   **The Trap:** This question assumes a dichotomy between pragmatic (Dutch Book) and epistemic (Accuracy) norms. Some formal epistemologists (e.g., *Joyce*) argue pragmatic arguments *are* proxies for epistemic ones. If she rejects the dichotomy, the question needs to pivot to *why* the proxy works.

  ### 4. Forgetting and Self-Locating Belief
  **Q:** Reflection seems to assume a monotonic growth of information. But in self-locating cases—like the Sleeping Beauty scenario—or cases of simple forgetting, your future self has *less* information than you do now. Does Reflection even have a well-formed statement in those cases? If I know I'm going to forget evidence $E$, my current credence shouldn't match my future credence. So is Reflection a norm only for your earliest self, or does it apply at every moment relative to the next?

  *   **Follow-up (If she says it applies only to earliest self):** That makes Reflection a very limited diachronic norm. Most of our epistemic life is spent in the middle of trajectories where we might forget or get confused. If Reflection doesn't constrain the transition from $t_1$ to $t_2$ when forgetting is possible, is it really a general norm of diachronic rationality?
  *   **Second Follow-up (If she says it applies generally with modifications):** Do those modifications require a shift to centered worlds or hyper-intensional propositions? And if so, does the derivation of Conditionalization still hold in that enriched framework?

  ### 5. Deference-with-Discount (Your Specific Challenge)
  **Q:** I've been considering a principle I call *Deference-with-Discount*. Suppose I know that tomorrow I will read three alarming headlines and will overreact due to availability bias. Reflection says I should defer to my future credence. But intuitively, I should defer to my future credence *minus* the predicted bias. Is this just Conditionalization on a richer evidence set (where the evidence includes "I will be biased"), or is it a genuinely different norm that is weaker than Reflection but stronger than nothing?

  *   **Follow-up (If she says it's just Conditionalization on richer evidence):** If it's just Conditionalization, then Reflection isn't doing the work; the work is being done by correctly specifying the evidence. Doesn't that suggest Conditionalization is the basic norm, and Reflection is just a special case where the "bias" term is zero?
  *   **Second Follow-up (If she says it's a different norm):** If it's a different norm, then we have two competing diachronic principles. Why should we think Reflection is the *fundamental* one if there are plausible cases where rationality requires violating it in favor of Deference-with-Discount?

  > **Note on where this might die:**
  > *   **The "Good" Answer:** She might argue that **Reflection already handles this** via the conditioning clause. If you are certain you will be biased, then the proposition "My future credence will be $r$" is not the relevant conditioning proposition. The relevant proposition is "My future credence will be $r$ *given the biased process*." If she argues that Reflection applies to the *output* of the process you expect, and you expect the process to be biased, then your current credence should match the *biased* output. If you don't, *you* are violating Reflection. This turns your counterexample into a misunderstanding of the principle.
  > *   **The Trap:** This question assumes "Deference-with-Discount" is coherent. She might argue that "discounting" is just updating on the evidence that the bias exists. If she successfully reduces your proposal to standard Conditionalization, the challenge to Reflection's basicality dissolves.

  ### 6. The Derivation Mechanism
  **Q:** Let's press on the derivation. You argue Conditionalization falls out of Reflection. The standard story is: if I know I will learn $E$ and nothing else, my future credence in $H$ will be my current conditional credence $C(H|E)$. Reflection then tells me to set my current credence to match that. But this relies on me knowing *in advance* exactly what evidence I will get. In real inquiry, I don't know what $E$ will be. Does Reflection only deliver Conditionalization in idealized cases where the partition of possible evidence is known beforehand?

  *   **Follow-up (If she admits it's idealized):** If it only works in idealized cases, how do we get from there to a general norm for non-ideal agents? Do we need a separate argument for non-ideal cases, which undermines the claim that Reflection is the *single* basic norm?
  *   **Second Follow-up (If she says it works generally):** How do you handle the "and nothing else" clause? Agents rarely know they won't learn other things. Does Reflection require a ceteris paribus clause that does the heavy lifting?

  ### 7. Internalism vs. Externalism
  **Q:** Reflection feels deeply internalist: it's about the relationship between my current perspective and my anticipated future perspective. Conditionalization is often framed externalist: it's about the relationship between my credences and the evidence I *actually* received. By making Reflection basic, are you committing to a purely internalist epistemology? And if so, how do you handle cases where my internal perspective is misleading about what evidence I actually got?

  *   **Follow-up (If she accepts internalism):** If rationality is purely about internal coherence between time-slices, does that mean an agent could be perfectly rational by Reflection's lights even if they never update on the world, provided their current and future selves agree?
  *   **Second Follow-up (If she rejects the dichotomy):** How do you reconcile the internalist formulation of Reflection with the externalist constraints of truth-tracking? Is there a bridge principle?

  ### 8. The Bedrock Question
  **Q:** Finally, why is deference to future selves the bedrock? Why not synchronic coherence? One could argue that Conditionalization is just synchronic coherence applied to time-slices (treating time as another dimension of evidence). What is it about the *diachronic* relationship specifically that makes Reflection more fundamental than a synchronic norm like Probabilism?

  *   **Follow-up (If she says diachronic coherence is distinct):** Is it distinct in kind, or just in degree? If I violate Reflection, am I irrational in the same way I am if I violate the axioms of probability, or is it a different species of irrationality?
  *   **Second Follow-up (If she says they are on par):** If they are on par, then Reflection isn't *more* basic than Conditionalization, just different. Does your claim require Reflection to be strictly more fundamental, or is it enough that they are mutually supporting?

  ***

  ### Producer's Cheat Sheet for the "Hardest" Questions

  **Question 1 (Impaired Selves):**
  *   **Watch out for:** The "Screening Off" defense. If she says, "In the drug case, your current evidence *screens off* the future evidence, so Reflection doesn't demand deference," she has answered the objection without restricting the principle.
  *   **Collapse Point:** If she successfully argues that the "restriction" is not an add-on but built into the probabilistic structure of the conditioning proposition, your follow-up about circularity becomes irrelevant.

  **Question 3 (Plans vs. States):**
  *   **Watch out for:** Citations of **Briggs & Pettigrew (2018)** or similar accuracy-dominance theorems. If she can say, "We have a proof that violating Reflection minimizes expected accuracy regardless of updating rule," the pragmatic/epistemic split you're trying to exploit vanishes.
  *   **Collapse Point:** If she produces a direct accuracy argument for Reflection that doesn't mention Conditionalization, the "piggybacking" charge fails.

  **Question 5 (Deference-with-Discount):**
  *   **Watch out for:** The "Re-description" move. She may argue that if you know you'll be biased, your future credence function $C_{t'}$ *is* the biased one. Reflection says $C_t(P | C_{t'}(P)=r) = r$. If you know $C_{t'}$ will be biased, and you set $C_t$ to match it, you are being *irrational* only if you think the bias is truth-tracking. But Reflection doesn't say the future self is *right*, it says you should *agree* with them.
  *   **Collapse Point:** If she argues that Reflection is a norm of *stability*, not *truth*, then your bias objection misses the target. You need to be ready to pivot to: "But why should stability be the norm if it stabilizes on error?"
