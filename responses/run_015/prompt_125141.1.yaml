volves Darwinian selection. (10) This is plainly too destructive: it dissolves evolutionary biology along with memetics. Which step should I reject, and what does that rejection cost? I should prefer to keep (2) and (5), because they seem descriptively sound, but I am unsure whether saving them forces me to weaken Hull's framework or to relax fidelity in a way that invites (8). Please reply in British English, and do not provide bibliographies, reading lists, or citations.
