answer: |-
  # Population Axiology: Where Do You Stand?

  Welcome to the term's session. Forget the labels for a moment. This flowchart sorts you by your intuitions on concrete cases. Start at **Node 1** and follow your answers. There are no trick questions, but some paths lead to places you might not expect. Be honest—if you hesitate between "Better" and "No Verdict," follow the "No Verdict" branch.

  ### The Tree

  **Node 1 (The Repugnant Conclusion):** Population **A** has 10,000 people with very high welfare (10/10). Population **Z** has 10 billion people with lives barely worth living (0.001/10). Is **Z** better than **A**?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (Negative Existence):** Option **X**: Add one new person with welfare -5 (misery). Option **Y**: Existing 10 people each lose 0.5 welfare (total -5). Is **X** worse than **Y**?
  *   **Yes (X is much worse):** → **Leaf 1**.
  *   **No (They are symmetric):** Go to Node 4.

  **Node 3 (Mere Addition):** Population **A** (10 people, 10/10) vs. Population **A+** (Original 10 at 10/10 + 10 new people at 1/10). Is **A+** worse than **A**?
  *   **Yes:** Go to Node 5.
  *   **No:** Go to Node 6.

  **Node 4 (Uncertainty):** Gamble **G1**: 50% chance of Population **A**, 50% chance of Nobody. Gamble **G2**: 100% chance of Population **A+**. Is **G2** better than **G1**?
  *   **Yes:** → **Leaf 2**.
  *   **No:** → **Leaf 3**.

  **Node 5 (Asymmetry):** Option **Create**: Bring one happy person into existence (welfare +10). Option **Prevent**: Prevent one miserable person from existing (welfare -10). Is **Prevent** strictly more urgent than **Create**?
  *   **Yes:** → **Leaf 4**.
  *   **No:** Go to Node 7.

  **Node 6 (The Chain):** Imagine a sequence **A > B > C … > Z**, where each step adds people and slightly lowers average welfare. Do you accept every step is better than the last?
  *   **Yes:** → **Leaf 5**.
  *   **No:** Go to Node 8.

  **Node 7 (Split Threshold):** Consider a life with welfare +1. Question 1: Is it worth living for the person? Question 2: Does adding it make the world better? Are the answers the same?
  *   **No (Worth living, but adds no value):** → **Leaf 6**.
  *   **Yes (Both Yes or Both No):** Go to Node 9.

  **Node 8 (Same-Number Swap):** Population **P** (1 person, welfare 10) vs. Population **Q** (1 person, welfare 9). Is **P** better than **Q**?
  *   **No:** → **Leaf 7**.
  *   **Yes:** Go to Node 10.

  **Node 9 (Incomparability):** Compare Population **A** and Population **B** (different sizes, different averages). Is the relation "Exactly Equally Good" or "No Verdict (Incomparable)"?
  *   **Equal:** → **Leaf 8**.
  *   **No Verdict:** → **Leaf 9**.

  **Node 10 (Levelling Down):** Population **R** (welfare 10, 2) vs. Population **S** (welfare 5, 2). Is **S** better than **R** *in any respect*?
  *   **Yes:** → **Leaf 10**.
  *   **No:** Go to Node 11.

  **Node 11 (One Happy vs. Nobody):** Population **T** (1 person, welfare +1) vs. **Nobody**. Is **T** better?
  *   **Yes:** → **Leaf 11**.
  *   **No:** → **Leaf 12**.

  ---

  ### Leaf Key: What You Bought

  1.  **Negative Utilitarianism.** *Awkward Commitment:* You prioritize eliminating suffering over creating happiness. *Unwelcome Conclusion:* You might prefer a world with no people over a world with happy people if it reduces total suffering risk.
  2.  **Risk-Neutral Totalism.** *Awkward Commitment:* You treat existence as a gamble with expected value. *Unwelcome Conclusion:* You accept the Repugnant Conclusion and treat creating lives as offsetting risks.
  3.  **Narrow Person-Affecting.** *Awkward Commitment:* You only care about people who exist in both options. *Unwelcome Conclusion:* You cannot say it is better to create happy people than to create no one.
  4.  **Asymmetric View.** *Awkward Commitment:* Harm and benefit are not mirror images in creation cases. *Unwelcome Conclusion:* You must explain why preventing misery matters more than creating happiness without collapsing into negative utilitarianism.
  5.  **Intransitive View.** *Awkward Commitment:* You reject the transitivity of "better than." *Unwelcome Conclusion:* You are vulnerable to money pumps or must accept that rational choice is impossible in long chains.
  6.  **Split-Threshold View.** *Awkward Commitment:* A life can be worth living for the person but add zero value to the world. *Unwelcome Conclusion:* **Mostly Unnamed.** This view is rarely defended because it seems unstable or ad hoc; it's likely unexplored because it requires two separate normative thresholds without a unifying principle.
  7.  **Nihilist / Error Theorist.** *Awkward Commitment:* Welfare numbers don't track value. *Unwelcome Conclusion:* You cannot say saving a life is better than letting it end in same-number cases.
  8.  **Critical-Level Utilitarianism.** *Awkward Commitment:* There is a welfare level above zero that counts as "neutral" for addition. *Unwelcome Conclusion:* You imply that adding lives above this level is good, but adding lives below it (even if happy) is bad.
  9.  **Incomparabilist.** *Awkward Commitment:* Different-sized populations cannot be ranked. *Unwelcome Conclusion:* You have no guidance for policy affecting future population sizes.
  10. **Strict Egalitarian.** *Awkward Commitment:* Equality is valuable even if it makes everyone worse off. *Unwelcome Conclusion:* You accept the "Levelling Down Objection"—that destroying the better-off's welfare is good in one way even if it helps no one.
  11. **Totalism (Low Critical Level).** *Awkward Commitment:* Any positive welfare adds value. *Unwelcome Conclusion:* You are one step away from accepting the Repugnant Conclusion if you lower your critical level slightly.
  12. **Averagism.** *Awkward Commitment:* You care only about average welfare, not total. *Unwelcome Conclusion:* You prefer a world with one happy person over a world with a billion happy people if the single person is slightly happier.

  ---

  ### Indistinguishable Pairs & Extra Questions

  This tree sorts by intuition, but some theories look identical here. To separate them, you need these extra questions:

  1.  **Incomparabilist (Leaf 9) vs. Narrow Person-Affecting (Leaf 3):** Both say "No Verdict" on different-number cases.
      *   *Extra Question:* In a same-number case where one person is happier and another is sadder, do you trade off welfare? (Person-Affecting says yes; some Incomparabilists might not).
  2.  **Totalism (Leaf 2/11) vs. Critical-Level (Leaf 8):** If the Critical Level is set to zero, behavior matches Totalism.
      *   *Extra Question:* Is a life with welfare +0.0001 strictly better than non-existence? (Totalism says yes; Critical-Level usually says no unless CL is extremely low).
  3.  **Averagism (Leaf 12) vs. Person-Affecting (Leaf 3):** Both reject Mere Addition (Node 3).
      *   *Extra Question:* If you can increase the average welfare of existing people by adding a very happy person, must you? (Averagism says yes; Person-Affecting says no obligation to non-existent people).

  **Note on Comfort:** Notice that accepting the Repugnant Conclusion (Node 1 Yes) doesn't guarantee a "hard" leaf. You might land on **Leaf 2 (Totalism)**, which is theoretically clean but counterintuitive. Conversely, rejecting it (Node 1 No) might land you on **Leaf 5 (Intransitive)**, which saves your intuition but breaks rational choice theory. Sometimes the "comfortable" intuition costs more in logical coherence than the "repugnant" one.
