answer: |-
  First off, taco solidarity. Money in politics is the ultimate "two friends staring at a plate of carnitas realizing they view reality differently" argument. It's messy because the laws are messy, but your friend actually has a very distinct pattern, even if he hasn't articulated it perfectly.

  Here is the breakdown of his brain, the prediction on the dinner, and the hypothetical trap to spring on him next time.

  ### 1. What will he say about the Charity Dinner?
  **Prediction:** He will **hate it.**

  Even though it's transparent (guest list published) and technically legal (money to charity, not campaign), it violates the core anxiety in his "dislikes." He didn't just hate the developer and the defense contractor because they were *sneaky*; he hated them because they used money to bypass the normal civic process.

  The nurses bought *logistics* (buses). The neighbors bought *materials* (flyers). The lobbyists at the dinner are buying *proximity*. To your friend, a $25,000 table isn't speech; it's a toll booth that regular people can't pay. The transparency doesn't fix the fact that the nurses can't sit at that table.

  ### 2. What rule is he actually running on? (Rule A)
  **The "Civic Equality" Principle.**
  *The Rule:* **Money can facilitate speech, but it cannot purchase privileged access or structural advantage.**

  *   **Why it fits the Likes:** Nurses and neighbors are using money to amplify their *existing* civic voice (transportation, printing). They are showing up as citizens.
  *   **Why it fits the Dislikes:**
      *   *Developer LLCs:* Buying influence through obscurity.
      *   *Revolving Door:* Selling access based on past public service (structural advantage).
      *   *Astroturf Nonprofit:* Using corporate cash to mimic citizen voice (structural deception).
  *   **Why it kills the Dinner:** The dinner sells access based on wallet size. It creates a two-tier system of citizenship (Donors vs. Everyone Else), which violates Civic Equality.

  ### 3. What is the alternative rule? (Rule B)
  **The "Radical Transparency" Principle.**
  *The Rule:* **Corruption is solely a product of secrecy; if everything is disclosed, the market of ideas can decide.**

  *   **Why it fits the Likes:** Nurses and neighbors are named and open.
  *   **Why it fits the Dislikes:** LLCs hide the donor. The "Consultant" hides the role. The "Patriotic Nonprofit" hides the oil money. Every single one of his anger points involves *not knowing who is actually pulling the strings.*
  *   **Why it saves the Dinner:** Under this rule, the dinner is fine. The guest list is published. The Senator says he promises nothing. The voters can see who bought the table and judge the Senator accordingly. The sin isn't the money; the sin is the *hiding*.

  ### 4. The Hypothetical Trap
  To figure out which rule actually drives him (Equality vs. Transparency), you need a scenario where **Transparency** and **Equality** contradict each other.

  **The Trap Scenario:**
  > "Okay, imagine a new law. It makes **all** political donations completely anonymous to protect donors from harassment. No names ever released. BUT, it strictly caps donations at **$50 per person**. No LLCs, no super PACs, just regular people."

  **Ask him:** *"Is this system better or worse than what we have now?"*

  *   **If he says "Better" (He follows Rule A - Civic Equality):**
      He prioritizes stopping wealthy dominance over knowing who donated. He believes small, anonymous citizens are fine, but rich, transparent donors are dangerous.
      *   *The Trap Sprung:* Then why did he hate the Astroturf nonprofit? That was about hidden money. He has to admit he hates *wealthy* hidden money, but likes *poor* hidden money. His rule is about **Class**, not just Disclosure.

  *   **If he says "Worse" (He follows Rule B - Radical Transparency):**
      He believes sunlight is the only disinfectant. Even if it's small money, hiding it is inherently corrupt.
      *   *The Trap Sprung:* Then he has to admit he might actually be okay with the **Charity Dinner**. If the guest list is published, the "sunlight" is there. If he still hates the dinner *and* hates the anonymous small donations, his rule is actually **"Money shouldn't matter at all,"** which is a much harder line to defend.

  **Pro Tip for the Next Taco Run:**
  If he hedges (which he probably will), hit him with the **"Transparent Bribe"**:
  > "What if a billionaire donates $10 million to a Senator's campaign, fully disclosed on TV ads, no strings attached, just 'I like this guy'? Is that okay because we know who did it?"

  *   **Equality Guy:** "No, that drowns out everyone else."
  *   **Transparency Guy:** "Yes, voters know who's backing him and can vote accordingly."

  Good luck. Order more tacos; this argument isn't ending soon.
