answer: |-
  You are correctly sensing that this is not a military optimization problem. It is a political ontology problem. The Nordic/Swiss model is not trying to build the most efficient killing machine; it is trying to build a specific kind of state-society interface.

  Here is the reconstruction of the implicit theory, stripped of the historical baggage.

  ### 1. The Implicit Theory: Civic Republicanism as Distributed Security

  The operating system running these countries is not Liberal Individualism (where the state is a service provider and citizens are customers with rights). It is **Civic Republicanism**.

  **The Core Axiom:** Freedom is not the absence of interference (negative liberty); freedom is the status of not being dominated (non-domination). You are only free if your community has the capacity to resist domination by others. Therefore, the capacity for violence cannot be outsourced, because outsourcing it creates a dependency that compromises sovereignty.

  **The Architecture:**
  *   **The State:** Not a distinct entity from the people, but the organized expression of the people.
  *   **The Military:** Not a specialized tool, but the population in a specific configuration.
  *   **Conscription:** The compiler that turns the raw code (citizens) into the executable (nation-in-arms).

  **Essential vs. Incidental:**
  *   **Essential:** The *liability* must be universal. The state must retain the right to call *anyone*. If the state loses the legal right to conscript the CEO or the MP's son, the system collapses into class stratification.
  *   **Incidental:** The duration (6 months vs. 12 months), the specific equipment, or even the percentage actually called up in peacetime. As long as the *default* is service, the theory holds.

  ### 2. Evaluating Your Guesses

  You are largely correct, but let's tighten the logic on where the leverage points are.

  *   **Political membership carries non-optional duties:** **Correct.** In Liberalism, duties are mostly negative (don't kill, don't steal). In this model, citizenship is a positive office. You hold a share of the sovereignty, therefore you hold a share of the burden of defending it.
  *   **Unfair to outsource dirty work:** **Correct, but deeper.** It's not just fairness; it's *coupling*. If the people who vote for war are not the people who fight it, you create a moral hazard. Conscription couples the decision-making layer (voters/politicians) with the execution layer (soldiers). It introduces high latency into the decision to go to war.
  *   **Citizen army limits expeditionary wars:** **Correct.** A professional army is a capital asset that politicians want to utilize to justify its cost. A conscript army is a sunk cost that is politically expensive to deploy abroad.
  *   **Deterrence via occupation cost:** **Correct, but clarify the legal bit.** You asked if making civilians part of the deterrent violates laws of war.
      *   *The nuance:* The Nordic model does not train civilians to be guerrillas (which would be illegal if they don't wear insignia). It trains them to be *reservists*. Legally, a reservist is a combatant. The deterrent is not "grandma with a rifle"; it is "every male aged 20–50 can be mobilized into a legal combat unit within 72 hours."
      *   *Total Defense:* The civilian pamphlet isn't about fighting; it's about resilience (not panicking, identifying spies, maintaining infrastructure). This makes occupation administratively costly, not necessarily militarily impossible.

  ### 3. The Lottery vs. Universality (The Social Fact)

  Your intuition is sharp here: **The lottery misses the point.**

  If you switch to a lottery (even a fair one), you change the system from **Integration** to **Burden Sharing**.

  *   **The Lottery Model:** Defense is a tax paid in blood by a random few. The 95% who don't serve are bystanders. They may support the troops, but they are not *of* the troops. This creates a subtle caste distinction: those who served and those who didn't.
  *   **The Universal Model:** Defense is a rite of passage. It is a **common knowledge generator**.
      *   It's not just that I served.
      *   It's that I know *you* served.
      *   And I know that *you know* I served.
      *   And we both know that the CEO's son served alongside the janitor's son.

  This creates a "shared social fact" that lowers transaction costs in civil society. It creates a baseline of trust and a common vocabulary. When a politician says "we must sacrifice," the population has a shared reference point for what sacrifice looks like.

  **The Coherence Problem (Excusals/Civilian Service):**
  You noted that not everyone actually serves (medical exemptions, conscientious objectors, women often exempted historically). Does this break the "universality" claim?
  *   **Theory:** No, provided the *presumption* is service. The system remains coherent as long as the *default* path is conscription and exemptions are treated as exceptions/deviations.
  *   **Breaking Point:** If exemptions become the norm, or if wealthy/powerful people can systematically buy out (legally or culturally), the "shared fact" dissolves. The system relies on the *visibility* of the burden. If the burden becomes invisible (lottery) or avoidable (class-based), the civic republican logic fails.

  ### 4. The Market Alternative: Defense as a Job

  If you swap in the Liberal/Market view (Defense is a public good, staffed by labor market), here is what concretely changes:

  1.  **Decoupling of Will and Violence:** The population can support a war without feeling it. This lowers the threshold for conflict. You see this in the US vs. Vietnam/Iraq. When there is no draft, war becomes a remote operation.
  2.  **Professionalization of Violence:** Soldiers become a distinct class with distinct interests. This increases military effectiveness (specialization) but increases the risk of the military becoming a "state within a state" (Praetorian Guard risk). In the Nordic model, the General is a citizen who will return to civilian life; in the professional model, the General is a careerist whose entire identity is the institution.
  3.  **Labor Market Distortion:** You pay market rate for dangerous work. This means defense spending competes directly with healthcare/education for tax dollars. In the conscription model, a huge chunk of defense spending is subsidized by unpaid/low-paid labor time, effectively a hidden tax on young men's time.
  4.  **Social Fragmentation:** You lose the "mixing" function. In Finland, a guy from Helsinki and a guy from rural Karelia serve together. In a professional army, recruitment often skews heavily toward specific socioeconomic demographics (usually poorer, rural, or minority communities). This creates a disconnect between the society being defended and the people defending it.

  ### 5. The "Forced Labor" Paradox

  You asked about the ILO carve-out. Why is military conscription okay but forced labor not?

  **The Theory:** The state's monopoly on violence is the precondition for all other rights.
  *   If the state cannot compel you to defend the state, the state may cease to exist.
  *   If the state ceases to exist, the legal framework that defines "forced labor" ceases to exist.
  *   Therefore, the duty to defend is *logically prior* to the right against forced labor.

  It is not a principled distinction in terms of *coercion* (you are equally coerced in both). It is a principled distinction in terms of *sovereignty*. The state claims you owe it your life because it claims to guarantee your life.

  ### Summary of the Trade-Off

  The Nordic/Swiss model is not optimizing for **Military Efficiency** (professional armies are better at fighting).
  It is optimizing for **Political Resilience** (societies that are harder to coerce and harder to fracture).

  *   **Conscription** is the cost of ensuring the military remains a servant of the people rather than a master, and that the people remain capable of being their own masters.
  *   **Universality** is the cost of ensuring that security is a public good experienced by all, rather than a service purchased by some.

  If you switch to the market model, you gain efficiency and individual liberty (for the majority). You lose the structural coupling between the citizen and the sovereign, and you accept that war is something that happens "over there" by "those people," rather than a collective risk managed by "us."

  The Nordic countries joined NATO not because their model failed, but because the scale of the threat (Russia) exceeded the capacity of a small nation-in-arms to deter alone. But they kept conscription because they know NATO guarantees are pieces of paper; the only guarantee that matters is the cost an invader expects to pay in blood, and that cost is highest when every citizen is a potential soldier.
