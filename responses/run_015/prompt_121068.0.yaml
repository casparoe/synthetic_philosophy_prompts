answer: |-
  # JOINT STATEMENT ON THE NATURALIZATION OF CONTENT
  **Date:** October 26, 2023
  **Parties:** The Teleosemantic Working Group & The Synthetic-Functionalist Working Group
  **Subject:** Findings from Adversarial Collaboration on Mental Content in Biological and Artificial Systems

  ## I. AGREED CLAIMS REGARDING NATURALIZED CONTENT

  Following a series of structured exchanges, modeling sessions, and case analyses, the undersigned parties affirm the following points of consensus regarding the project of naturalizing mental content. Both parties reject supernatural or non-physicalist accounts of intentionality.

  1.  **The Normativity Constraint:** Any adequate theory of content must account for the normative dimension of mental states. A state representing *p* must be subject to conditions of correctness (it can be accurate or inaccurate). Mere causal correlation is insufficient without a standard against which failure is measured.
  2.  **The Possibility of Misrepresentation:** A theory of content must explain how a system can token a state with the content *X* in the absence of *X*. A system that is infallible by physical necessity does not thereby lack content, provided the theory can ground the *possibility* of error distinct from physical impossibility.
  3.  **Optimization as a Grounding Mechanism:** Both parties agree that reliable content-bearing systems arise through optimization processes. Whether via natural selection (biological) or gradient descent (artificial), the stabilization of input-output mappings requires a mechanism that minimizes a cost function (fitness loss or prediction error).
  4.  **Structural Covariation:** Content-bearing states must exhibit structured covariation with the environment. Internal states must differentiate external states in a way that supports downstream processing (action in biology, inference in AI).
  5.  **Rejection of Simple Causal Theories:** Both parties agree that a simple "cause-and-effect" theory (State S represents X because X causes S) fails to solve the disjunction problem. A mechanism is required to distinguish between the *cause* of a state and the *content* of a state (e.g., distinguishing a fly from a black speck).
  6.  **Continuity of Mechanism:** There is no metaphysical barrier preventing artificial neural networks (ANNs) from possessing states analogous to biological mental states, provided the functional and normative conditions are met. The disagreement lies in *which* conditions are necessary, not in the substrate itself.

  ## II. DISAGREEMENTS AND CRUXES

  While the parties agree on the constraints above, they diverge on the metaphysical grounds of normativity. The following table outlines the precise formulations of disagreement, the central cruxes, and the empirical or thought-experimental cases selected to test them.

  | Feature of Disagreement | Teleosemanticist Commitment | Synthetic-Functionalist Commitment |
  | :--- | :--- | :--- |
  | **Formulation of the Dispute** | **The Constitutive Role of Etiology:** Proper functions, and thus content, are constituted by the historical selection processes that designed the mechanism. Current structure is insufficient without the history of selection *for* that structure. | **The Sufficiency of Current Dynamics:** Content is constituted by the current causal-topological role of a state within a system optimized to minimize loss. History explains *how* the system arrived there, but does not constitute the content itself. |
  | **Locus of Normativity** | Norms are external and historical. A state is correct if it performs the function it was selected to perform. | Norms are internal and mathematical. A state is correct if it minimizes the system's objective function relative to its input space. |
  | **Handling "Perfect" Systems** | A system that never errors requires a history of *selection against* errors to have content. Without a history of failure and elimination, there is no "proper function" to violate. | A system that never errors still has content if the loss landscape defines a minimum. The mathematical definition of the objective function establishes the norm, regardless of empirical error frequency. |

  ### CRUX 1: The Necessity of Evolutionary/Training History
  **The Question:** Is a history of selection (phylogenetic or training-based) strictly necessary for content, or is the resulting functional topology sufficient?

  **Concrete Case: The "Instant Net" (Swamp-ANN)**
  *Scenario:* Consider a neural network architecture identical to a trained image classifier.
  *   **Instance A:** Trained via standard backpropagation over 1 million epochs.
  *   **Instance B:** Instantiated via random physical fluctuation (or divine intervention) with weights identical to Instance A at epoch 1M, but with no prior training history.

  **Argument Bearing on Crux:**
  *   **Teleosemanticist:** Instance B lacks "proper functions." Its weights correlate with features, but it was not *selected* to track those features. It has no normative standard it can fail to meet. Therefore, Instance B has no content.
  *   **Synthetic-Functionalist:** Instance A and B are computationally isomorphic. They process inputs identically and minimize the same implicit loss function via their topology. If Instance A has content, Instance B must also have content. History is causal, not constitutive.

  **Recorded Predictions:**
  *   **Teleosemanticist Prediction:** Instance B will fail tests of *normative guidance*. If perturbed, its "errors" are merely physical deviations, not misrepresentations, because no function was selected to be violated.
  *   **Synthetic-Functionalist Prediction:** Instance B will pass all functional tests for content attribution identical to Instance A. Any intervention that moves weights away from the attractor basin constitutes a "misrepresentation" relative to the system's geometry, regardless of history.

  ### CRUX 2: Misrepresentation in Zero-Error Systems
  **The Question:** How is misrepresentation grounded in a system that is over-constrained and never actually produces an error during training or deployment?

  **Concrete Case: The "Deterministic Oracle"**
  *Scenario:* A simplified control system for a thermostat designed for a specific, unchanging room. The system is trained/selected in a simulation that perfectly models the room's physics. In both training and deployment, the system never fails to activate the heater when the temperature drops. The input space is fully exhausted; no novel inputs are possible.

  **Argument Bearing on Crux:**
  *   **Teleosemanticist:** Without a history where alternative mechanisms were weeded out due to error, or a possibility of environmental variance that *could* cause error, the "norm" is indistinguishable from physical law. If the system *could not* have failed given its history and environment, it does not represent; it merely reflects.
  *   **Synthetic-Functionalist:** The content is grounded in the objective function (e.g., `Loss = |Target_Temp - Actual_Temp|`). Even if the loss is always 0, the *definition* of the loss function provides the truth conditions. The state represents "Temperature < X" because that is the condition required to minimize the loss, even if that minimization is empirically perfect.

  **Recorded Predictions:**
  *   **Teleosemanticist Prediction:** If the environment changes slightly (novel input), the system's response will be deemed "broken" rather than "mistaken" unless there is a history of selection *for* adaptability. Content requires the possibility of divergence between function and performance established by history.
  *   **Synthetic-Functionalist Prediction:** The system possesses content regarding temperature immediately upon instantiation of the loss function. If the environment changes and the system fails to minimize loss, it is a misrepresentation (high loss), regardless of whether the training history included that specific environmental variance. The gradient landscape defines the error, not the empirical frequency of errors.

  ***

  **Signed,**

  *Dr. Elena Rosenthal, Lead Investigator (Teleosemantic Working Group)*
  *Dr. Arjun Patel, Lead Investigator (Synthetic-Functionalist Working Group)*
