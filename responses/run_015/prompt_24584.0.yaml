      *   *Correction:* Ensure the distinction between "script" and "agent" is clear. A script follows a recipe. An agent tries to achieve a goal using its own judgment.
      *   *Key Insight:* The "Line" is when you can no longer easily predict *why* the bot did something.

  8.  **Final Structure:**
