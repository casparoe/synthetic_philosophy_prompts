  2. Instrumentalists will ask why posit any ontology beyond observable predictions when empirical adequacy is identical. Your reply must claim that graded status preserves theory continuity without full commitment, but this fails to satisfy their strict demand for observational grounding.
  3. The modal realist will press whether suspended status is merely disguised modal agnosticism regarding possible worlds. Your reply must insist this concerns actuality's degrees, not possibility, though distinguishing these modes without modal logic is notoriously difficult.
  4. Critics will question whether "suspended ontological status" is a coherent metaphysical category rather than just a pragmatic doxastic attitude. Your reply can claim it reflects reality's gradation, but this is weak since traditional ontology assumes a binary existence condition.
  5. You hope nobody asks if this principle leads to solipsism by suspending status on all unobserved past events. Your defense relies on limiting this to principled inaccessible cases, but the boundary between principled and practical inaccessibility remains vague.
