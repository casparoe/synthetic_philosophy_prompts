      *   **Round 4: Internal Binding (Character/Policy)**
          *   *Maya:* Be the kind of person who follows through. Make a policy.
          *   *Jordan:* Circular. Policy only makes sense if following it is beneficial. Drinking toxin is net negative.
          *   *Analysis:* This is the "Resolute Choice" argument (David Gauthier). Jordan's rebuttal is the standard counter: Why adopt a policy that hurts you? However, Gauthier argues being that *kind of person* gets you the million, so it's rational ex-ante. Jordan's "circular" claim is strong but maybe dismissive of Contractarian ethics.
          *   *Winner:* Draw/Leaning Maya (This is the strongest philosophical counter-argument, even if Jordan dismisses it). *Correction:* Actually, in the context of the specific puzzle constraints, Jordan's logic holds better for a one-off case. But Maya is touching on "dispositional rationality." Let's call it a strong point for Maya that Jordan oversimplifies.

      *   **Round 5: Timing/Changing Mind**
          *   *Maya:* Intend at midnight, change mind later. Intentions aren't permanent.
          *   *Jordan:* If you plan to change your mind *at the moment of intending*, it's not a genuine intention.
          *   *Analysis:* Jordan hits the definition of intention again. Intention involves a commitment not to reconsider without new info. If you plan to reconsider just to bail, you didn't intend.
          *   *Winner:* Jordan.

  4.  **Identify the Missing Perspective (The Stalemate Breaker):**
      *   What are they missing?
