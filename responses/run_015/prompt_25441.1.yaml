      *   *2. Rationality vs. Psychology:* Jordan assumes perfect rationality. Maya assumes human psychology (weakness of will).
      *   *3. The "Self-Binding" Solution (Gauthier):* Maya touched on it, but didn't defend it well. The idea is that it is rational to be *disposed* to drink, even if it's irrational to drink once the money is there.
