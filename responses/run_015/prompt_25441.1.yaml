  6.  **Refining the Tone:**
      *   Keep it conversational but precise.
      *   Avoid taking sides too hard, but acknowledge where the philosophical consensus lies.
      *   Make sure to explain *why* Jordan wins most points (the logic of the puzzle) while validating Maya's intuition (human behavior).

  7.  **Final Review against constraints:**
