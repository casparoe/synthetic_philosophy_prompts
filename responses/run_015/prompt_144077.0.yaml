      *   SOH: Report $\rightarrow$ Self-Attribution that P $\rightarrow$ Theory explains Self-Attribution (Metacognition).
      *   Difference: HP treats the belief as a propositional attitude. SOH treats it as a functional output of a monitoring system. It's a shift in *mechanism*, not necessarily *ontology*. It risks collapsing into HP if "self-attribution system" is just a fancy name for "belief formation." I will flag this.

      *Does it collapse into Eliminativism?* If the "heterophenomenological world" is *only* the self-attribution, and we give up on "why there is experience," then yes, functionally it looks like eliminativism regarding qualia. I need to be clear on this.

