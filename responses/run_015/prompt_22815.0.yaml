      *   *Problem:* Logical uncertainty is about *not* knowing the truth value yet because computation is hard.
      *   *If we allow any computable strategy:* A computable strategy could just be "Wait until the theorem is proved, then bet against the reasoner if they were wrong earlier." Since the reasoner is also computable and bounded, there will always be truths they haven't found yet. An unbounded computable trader could essentially solve the halting problem or wait for infinite time to verify truths.
      *   *The "Omniscience" Trap:* If the trader can be arbitrarily slow/smart compared to the reasoner, the reasoner can never keep up. The criterion would demand the reasoner be logically omniscient (know all provable truths instantly). But logical uncertainty *exists* because we aren't omniscient.
      *   *The Solution:* Restrict the trader to be *efficient* (poly-time). This puts the trader on a similar footing to the reasoner. The reasoner doesn't need to know everything; they just need to not be *exploitable by someone equally smart*. It formalizes "efficient market hypothesis" for logic.
      *   *Analogy:* You aren't irrational for not knowing the 1,000,000th digit of $\pi$ instantly. You *would* be irrational if someone who also only has a calculator could consistently beat you at betting on it.

  3.  **Deconstruct Question 2: Unbounded Profits vs. One-Shot Loss:**
      *   *Context:* Classic Dutch Book is static. If $P(A) + P(\neg A) = 1.1$, I buy both and guarantee a loss immediately.
      *   *Problem:* In logical induction, beliefs change over time ($P_d(\phi)$). We are learning.
      *   *Why not one-shot?* A reasoner might make a temporary mistake (e.g., assign 0.9 to a conjecture that turns out false). If the criterion demanded *no guaranteed loss ever*, the reasoner could never assign high probability to anything unproven. They'd have to stay at 0.5 always to be safe. That's not learning.
      *   *Unbounded Profits:* This allows for *temporary* losses. You can lose money on day 100. But you shouldn't lose money *forever*. If a trader can make infinite money off you, your pricing mechanism is systematically broken. If they only make finite money, you eventually "learn" and correct your prices.
      *   *Convergence:* This links to calibration. If you keep losing to a specific strategy, you should adjust. Unbounded profit implies you *never* adjust enough.
      *   *Analogy:* A casino can lose on a single night (one-shot loss). But if a gambler can drain the casino's infinite bankroll over a lifetime (unbounded profit), the game is rigged.

