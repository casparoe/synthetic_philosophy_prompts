answer: |-
  ### Activity Design: The Convention Engine

  **Setup and Materials**
  You need 18 index cards per student (stacks of 10 and 8), a whiteboard, and a marker. Before class, write "STUBBORN: Do not change your symbol. Ignore others." on three index cards. Fold them so the text is hidden.

  **The Coordination Problem**
  The task is simple: in each round, students pair up and simultaneously hold up an index card with a shape drawn on it (Circle, Square, or Triangle).
  *   **Standard Rule:** If both partners show the *same* shape, both get 1 point (tally it on their own card). If shapes differ, both get 0.
  *   **The Goal:** Maximize personal points.

  **The Flow**
  1.  **Isolation (Precedent):** Split the room into Group A (12 students, left side) and Group B (6 students, right side). They cannot see or hear each other. Hand out the three "STUBBORN" cards randomly within Group B. Tell them they have 5 minutes to silently agree on *one* shape to use for the rest of the seminar. They must draw it on every card they own. No talking.
  2.  **Contact (Conflict):** Bring the groups together. Randomly pair one person from A with one from B for three rapid rounds. They reveal shapes, tally points, swap partners. Group A will likely have converged on one shape (e.g., Circle); Group B on another (e.g., Square). The three stubborn students in Group B will refuse to switch to Circle, causing mismatches for their partners.
  3.  **Resolution (Salience):** Allow 5 minutes of open mingling (still no talking). Students can see who is getting points and who isn't. The non-stubborn Group B members face a choice: stick with their group's precedent or adopt Group A's majority convention to get points. The stubborn three will continue to fail, acting as a friction point.
  4.  **The Shift (Sanction):** Announce a rule change for the final two rounds. "New Payoff: If you match, you get 1 point. If you show a *different* shape than your partner, you get 2 points and they get 0." (This turns the Coordination Game into a Prisoner's Dilemma). "New Power: You may draw a large 'X' on your partner's card. This costs you nothing, but it cancels all their points for this round."
  5.  **Debrief:** Bring chairs into a circle. Discuss what happened, then map it to Lewis.

  ***

  ### Activity Table

  | Phase | Minutes | What Participants Are Told and Doing | What They Should Run Into | The Debrief Question That Draws It Out | What Goes Wrong and The Fix |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Isolation** | 10 | **Tell:** "Split into Left (12) and Right (6). No talking. No crossing the midline. Agree on one shape (Circle, Square, Triangle) to use all day. Write it on all your cards." <br>**Do:** Silent negotiation via gesture/drawing. | Group A converges quickly (majority rule). Group B converges, but the 3 stubborn agents pick a shape and refuse to budge, forcing the other 3 in Group B to align with them. | "How did you pick the shape? Was one shape objectively better, or did it just *happen*?" | **Talking:** Students whisper. <br>**Fix:** Stand in the middle. Tap the board. Restart the 5-minute timer if noise breaks out. <br>**Stubborn Outing:** Stubborn agents explain their card. <br>**Fix:** Pre-brief them: "If asked, point to the card. Do not speak." |
  | **2. Contact** | 15 | **Tell:** "Mingle. Pair up with someone from the other group. 3 rounds. Reveal cards. Tally points (1 for match, 0 for mismatch). Find new partners." <br>**Do:** Rapid pairing. Mismatches occur. | Group A (Circle) meets Group B (Square). 0 points. Frustration. The partners of the 3 stubborn students get 0 repeatedly. The other Group B students see they could get points if they switched to Circle. | "When you got 0 points, whose fault was it? Did you feel you were wrong, or just unlucky?" | **Capitulation:** Group B switches to Group A's shape immediately, nullifying the stubborn minority. <br>**Fix:** Remind Group B privately: "You have your own precedent. Do you want to lose it?" <br>**Gaming:** Students tally fake points. <br>**Fix:** Spot check tallies. "Show me your card." |
  | **3. Resolution** | 10 | **Tell:** "5 minutes to mingle freely. No talking. You want points." <br>**Do:** Students observe the stubborn three failing. Non-stubborn Group B members defect to Group A's convention. | The convention shifts. The majority (Group A) absorbs the flexible minority (Group B). The 3 stubborn agents remain isolated, getting 0 points. The room converges on Group A's shape. | "Why did the room settle on [Group A's shape]? Was it because it was 'right' or because everyone *expected* everyone else to use it?" | **Bullying:** Group A mocks the stubborn three. <br>**Fix:** Intervene. "This is data, not a roast." <br>**Confusion:** Students don't realize the stubborn three are the cause. <br>**Fix:** Ask the room: "Who never changed? Stand up." (Reveal the twist). |
  | **4. The Shift** | 15 | **Tell:** "New Rules: Mismatch = 2 pts for you, 0 for them. Match = 1 pt each. You can 'X' a partner's card to cancel their points." <br>**Do:** Two rounds of pairing with the new incentive structure. | Rational self-interest dictates *deviating* (showing a different shape). But fear of the 'X' (sanction) forces conformity. Points are high, but mood is tense. | "In the first half, you conformed to get points. In this half, you conformed to avoid losing them. What's the difference?" | **Chaos:** Everyone defects, everyone gets 'X'd. <br>**Fix:** Let it happen. It proves the point (convention collapsed without sanction). <br>**Silence:** No one uses the 'X'. <br>**Fix:** Prompt: "If someone defects against you, you have a weapon. Use it." |
  | **5. Debrief** | 25 | **Tell:** "Sit. Put cards away." <br>**Do:** Discuss the experience, then introduce Lewis's definitions. | Students realize the first half was a *coordination equilibrium* (self-policing via expectations). The second half was a *norm* (policing via sanctions). | "Lewis says conventions are arbitrary. If Group B had won, would it have been less 'real'? At what exact minute did this stop being a convention and start being a rule?" | **Philosophical Drift:** Students discuss fairness instead of coordination. <br>**Fix:** Redirect: "Forget fair. Forget moral. When was it just about predicting the other person?" |

  ***

  ### Five Limitations You Must Explain

  1.  **Timescale and Precedent:** In the seminar, precedent is five minutes old. In reality, conventions (like driving on the right) are frozen by generations of repetition. The activity compresses history, making the "arbitrariness" feel more volatile than it does in real life.
  2.  **Anonymity and Scale:** Lewis is interested in societal conventions where you don't know the person you're coordinating with. Here, students are face-to-face. The "expectations about expectations" are easier to form when you can see the other person's confusion, unlike in anonymous market or linguistic interactions.
  3.  **The Stakes of Deviation:** In the game, deviating costs fake points. In reality, violating a convention (e.g., speaking prose at a poetry slam) carries social cost, embarrassment, or exclusion that is harder to quantify and often feels moral rather than prudential.
  4.  **The Nature of the 'Ought':** Lewis argues the "ought" of convention is hypothetical ("I ought to drive left *if* I want to avoid crashing"). Students will likely feel a *moral* pressure to conform or punish, conflating rational coordination with normative obligation.
  5.  **Complexity of Content:** The activity uses simple symbols. Real conventions (language, currency, law) involve complex layers of meaning. A convention of "meaning" is harder to stage than a convention of "matching shapes," so you must explicitly bridge the gap between holding up a Square and using a word correctly.
