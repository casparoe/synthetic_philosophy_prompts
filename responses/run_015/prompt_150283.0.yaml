      *   *Wait, the prompt says:* "secretly hand three students in the smaller half." Okay, so I need a smaller half. 10 vs 8 is fine. 3 out of 8 is significant.
      *   *Coordination Problem:* Needs to be arbitrary. Left/Right? Red/Blue? Since only index cards, let's use *shapes* (Circle, Square, Triangle).
      *   *The "Sanction" Twist:* Lewis distinguishes convention (self-policing via expectations) from norm/law (policing via sanctions). The activity needs to show the *transition*. If deviation becomes profitable (Prisoner's Dilemma structure), convention breaks unless sanctions exist.
      *   *Troubleshooting:* People talking. Need a "shhh" signal. Stubborn agents outing themselves. Need to emphasize secrecy. Capitulation. Need to ensure the "stubborn" rule is strict.

  4.  **Drafting the Prose Design:**
      *   Set the scene.
