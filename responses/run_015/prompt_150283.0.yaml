      *   **Constraints:** No mini-lecture upfront. Students know Nash/Pareto but not norms.
      *   **Core Mechanic:** Split room, silent convergence on arbitrary options, merge & pair off, cost of mismatch.
      *   **Twist 1 (Secret):** 3 students in the smaller group get "stubborn" cards (never change). Test minority influence.
      *   **Twist 2 (Payoff/Sanction):** Final round changes payoffs (deviation is individually better) + cheap penalty mechanism. Test shift from convention to norm/sanction.
      *   **Deliverables:** Prose design, Table (Phase, Minutes, Instructions/Action, Experience, Debrief Question, Troubleshooting), List of 5 limitations.
      *   **Tone:** Practical, frank about failure modes, philosophically precise.

  2.  **Deconstruct the Activity Flow:**
      *   *Setup:* Need two groups. 18 students total. Let's make it 10 vs 8 to ensure a "smaller half" for the stubborn agents.
      *   *Phase 1 (Convergence):* Silent coordination within groups. Need a clear coordination problem. "Pick a symbol/color/number." Index cards are available. Let's use symbols drawn on cards (Circle, Square, Triangle) or just holding up colored cards if available. The prompt says "index cards," usually white. Let's have them write a symbol. Actually, holding up fingers or standing in corners is faster. Let's go with *writing a symbol* on the card and holding it up. It creates a physical artifact.
      *   *Phase 2 (Collision):* Groups merge. Pair off. Goal: Match symbols to get "points" (fake points, but needs to feel real). Mismatch = 0 points. Match = 1 point.
      *   *Phase 3 (The Stubborn Minority):* The 3 agents in the smaller group (Group B) must stick to their original symbol even if it causes mismatches. The rest of Group B and all of Group A can change.
      *   *Phase 4 (The Prisoner's Dilemma/Sanction Twist):* Change payoffs. Now, if you match, you get 1 point. If you *deviate* while the other matches, you get 2 points (temptation). If both deviate, 0. Add a "punishment" option (write an X on partner's card) costing the punisher nothing but costing the partner 1 point.
      *   *Debrief:* Connect to Lewis.

  3.  **Refining the Mechanics (Self-Correction/Optimization):**
      *   *Time:* 75 minutes is tight. Need strict timekeeping.
