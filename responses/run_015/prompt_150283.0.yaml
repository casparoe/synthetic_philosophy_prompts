      *   *Correction:* If I make it a PD, convention *cannot* hold it. Lewis says conventions are *coordination equilibria*. If the payoff structure changes so it's no longer a coordination problem, the convention *should* break unless external sanctions apply. This perfectly illustrates the boundary of Lewis's definition.
