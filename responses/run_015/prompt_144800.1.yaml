prompt: |-
  Our office has a statutory duty to weigh the interests of future generations, and we need a single discounting rule to apply across projects whose payoffs run out eighty to a hundred and fifty years: sea defences, nuclear waste storage, grid rebuilds. Before I look at any particular proposal I want the specification, since nearly everything I read argues from one favourite case. Write the desiderata that any adequate account of pure time preference and of discounting distant future benefits must meet, with the case or consideration behind each: what it must say about the difference between discounting money, consumption, and welfare; about keeping pure time preference separate from — or explicitly folding in — expected growth, catastrophe and extinction risk, and the possibility that the recipients of the benefit owe their existence to the timing of the project itself; about whether the rate should be flat or decline with the horizon; about how the rule behaves when, as actually happens, it is reapplied at every budget cycle rather than once at the outset; about what it owes, if anything, to observed market and political behaviour; about the distinction it must not collapse between how much we owe the future and how much we should invest now against a fixed budget; and about benefits that are not a separable stream at all — say, a project that lowers the annual hazard rate of civilisational collapse, so that the value of the benefit depends on the size and shape of the whole future it protects. Mark which requirements you take to be non-negotiable and which are the preferences of a particular camp, name the single requirement that excludes the most candidates, and flag any subset of the list you suspect is jointly unsatisfiable — I expect the trouble to lie in the triangle of horizon-declining rates, stability under repeated re-optimisation, and consequentialist re-evaluation. Then a sentence each on where the standard families fail the list — zero pure time preference with a growth term, a positive pure rate calibrated to observed choice, declining-horizon schedules, and views that drop pure time preference but add a separate sustainability constraint — but no full scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A government/statutory office needs a single discounting rule for long-term projects (80-150 years horizon: sea defences, nuclear waste, grid).
      *   **Task:** Write a set of *desiderata* (requirements/criteria) that any adequate account of pure time preference and discounting distant future benefits must meet.
      *   **Specific Content Requirements:**
          *   Distinguish between discounting money, consumption, and welfare.
          *   Address pure time preference vs. expected growth, catastrophe/extinction risk, and non-identity problems (existence depends on timing).
          *   Address the term structure (flat vs. declining).
          *   Address dynamic consistency (reapplication at every budget cycle).
          *   Address normative vs. descriptive (market/political behavior).
          *   Distinguish between *obligation to the future* vs. *investment level against a fixed budget*.
          *   Address non-separable benefits (e.g., reducing existential risk where value depends on the whole future protected).
          *   **Marking:** Identify non-negotiable vs. camp preferences.
          *   **Exclusion:** Name the single requirement that excludes the most candidates.
          *   **Inconsistency:** Flag any subset suspected to be jointly unsatisfiable (specifically the triangle: horizon-declining rates, stability under re-optimisation, consequentialist re-evaluation).
          *   **Critique:** A sentence each on where standard families fail (Zero pure time preference + growth, Positive pure rate + observed choice, Declining schedules, Sustainability constraint views).
          *   **Constraint:** No full scorecard.
      *   **Tone:** Professional, analytical, precise, suitable for a high-level policy advisor.

  2.  **Deconstruct the Desiderata (Drafting the List):**
      *   *Money vs. Consumption vs. Welfare:* Need to clarify that discount rates apply to utility/welfare, not just cash. Money needs inflation/real adjustment; consumption needs elasticity; welfare needs ethical weighting.
      *   *Pure Time Preference ($\delta$) vs. Growth ($g$) vs. Risk:* The Ramsey Rule ($r = \delta + \eta g$) is the standard, but for 150 years, $\delta$ is controversial. Catastrophe risk acts like a discount rate but isn't time preference. Non-identity (Parfit) means we can't say "worse for them" if they wouldn't exist otherwise, but we still need to value their welfare.
      *   *Term Structure:* Hyperbolic/declining vs. Constant. Long horizons usually demand declining rates to avoid vanishing present values.
      *   *Dynamic Consistency:* If I decide today for 100 years, will I stick to it in 10 years? Time inconsistency is a major issue with declining rates.
      *   *Normative vs. Descriptive:* Should we follow market rates (revealed preference) or ethical axioms (prescriptive)? For statutory duties, usually prescriptive.
      *   *Obligation vs. Budget:* Discounting tells you *which* projects, not necessarily *how much* total savings vs. consumption (though they are linked via the marginal project). Need to avoid conflating the rate with the savings rate.
      *   *Non-separable/Existential Benefits:* Standard NPV assumes additive flows. Existential risk reduction changes the probability of *any* future existing. This requires expected value calculations over populations, not just discounting a stream.

  3.  **Refining the Requirements (Categorization & Conflict):**
      *   *Non-negotiable:* Internal consistency, distinction between welfare and money, handling of existential risk (since it's a statutory duty regarding future generations).
      *   *Camp Preferences:* Specific value of $\delta$ (0 vs >0), specific shape of decline.
      *   *The "Killer" Requirement:* Dynamic consistency combined with declining rates is the classic impossibility result (Strotz). But the prompt asks for the *single requirement* that excludes the most. Likely "Dynamic Consistency" or "Non-zero valuation of far future." Let's go with *Dynamic Consistency under Re-optimisation* because it kills hyperbolic/declining discounting unless specific mechanisms (commitment) are in place.
      *   *The Unsatisfiable Triangle:* The prompt explicitly hints at this: Horizon-declining rates, Stability under repeated re-optimisation, Consequentialist re-evaluation. I need to flag this.

  4.  **Drafting the Critique of Standard Families:**
      *   *Zero pure time preference + growth:* Fails on catastrophic risk or negative growth scenarios (can handle long term but sensitive to $g$). Actually, the main critique is often that with positive growth, it discounts heavily anyway. Let's focus on the sensitivity to $g$.
      *   *Positive pure rate + observed choice:* Fails the intergenerational equity test (discriminates against future people simply because they are later).
      *   *Declining schedules:* Fails dynamic consistency (time inconsistency).
      *   *Sustainability constraint:* Fails operational clarity (lexicographic preferences are hard to trade off).

  5.  **Review and Refine (Self-Correction against constraints):**
      *   *Check:* Did I distinguish money/consumption/welfare? Yes.
      *   *Check:* Did I address non-identity? Yes.
      *   *Check:* Did I mark non-negotiable vs. preferences? Yes.
      *   *Check:* Did I identify the exclusionary requirement? Yes.
      *   *Check:* Did I flag the unsatisfiable triangle? Yes.
      *   *Check:* One sentence per standard family failure? Yes.
      *   *Tone:* Needs to be crisp, authoritative, not overly academic but rigorous.

  6.  **Final Polish (incorporating the "Triangle" hint):**
      *   The prompt explicitly says: "I expect the trouble to lie in the triangle of horizon-declining rates, stability under repeated re-optimisation, and consequentialist re-evaluation." I must acknowledge this suspicion in the "jointly unsatisfiable" section.
      *   Make sure the distinction between "obligation" and "investment" is clear (the "climate discounting" vs "savings rate" confusion).
      *   Ensure the "non-identity" point is handled carefully (it challenges the "harm" principle, not necessarily the valuation principle).

  7.  **Final Output Structure:**
      *   Introduction (acknowledging the statutory duty).
      *   The Desiderata (numbered/listed with rationale and marking).
      *   The Exclusionary Requirement.
      *   The Unsatisfiable Triangle.
      *   Critique of Standard Families (4 sentences).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just list them but explain *why* they are desiderata based on the prompt's specific points (money vs welfare, non-identity, etc.). I will group them logically.

  *(Refining the "Non-negotiable" tag)*: I should clearly label them [NON-NEGOTIABLE] or [PREFERENCE].
  *(Refining the "Single Requirement")*: Dynamic Consistency is the technical killer. But "Valuing the far future non-trivially" is the policy killer. Given the context of "statutory duty to weigh interests," Dynamic Consistency is the technical hurdle that breaks the math. I will select Dynamic Consistency as the exclusionary one because it mathematically rules out the most popular intuitive fix (declining rates) without commitment devices.

  *(Refining the "Unsatisfiable Triangle")*: I need to explicitly state that these three cannot hold simultaneously without a commitment mechanism.

  *(Refining the Critique)*: Keep them to one sentence each.

  Let's write.
answer: |-
  **Memorandum: Desiderata for a Long-Horizon Discounting Rule**

  **1. The Desiderata**

  1.  **Distinction Between Financial, Consumption, and Welfare Discounting [NON-NEGOTIABLE]**
      *   *Rationale:* Market interest rates discount money; the Ramsey rule discounts consumption; statutory duty requires discounting welfare. A rule conflating nominal returns with ethical weights will misprice projects where consumption growth diverges from welfare (e.g., environmental degradation).
      *   *Requirement:* The specification must explicitly define the numeraire (utility vs. consumption) and isolate the pure time preference parameter ($\delta$) from the elasticity of marginal utility ($\eta$) and growth ($g$).

  2.  **Separation of Pure Time Preference from Risk and Growth [NON-NEGOTIABLE]**
      *   *Rationale:* A positive discount rate arising from expected extinction risk or catastrophe is mathematically similar to pure time preference but ethically distinct; the former reflects probability of non-existence, the latter discrimination by date.
      *   *Requirement:* The rule must treat $\delta$ (impatience) as zero or near-zero for intergenerational equity, while modeling catastrophe risk as a hazard rate adjustment to the probability of payoff, not an additive penalty to the welfare weight.

  3.  **Resolution of the Non-Identity Problem [PREFERENCE]**
      *   *Rationale:* If a project alters the timing of conception for future agents, those agents owe their existence to the project (Parfit's problem). Standard "harm" metrics fail here.
      *   *Requirement:* The account must adopt a "person-affecting" view with a critical-level utilitarian override or a total utilitarian framework to ensure existence-contingent benefits are not valued at zero simply because the alternative was non-existence.

  4.  **Term Structure: Declining vs. Flat Rates [PREFERENCE]**
      *   *Rationale:* Uncertainty about future growth rates and $\delta$ implies a declining certainty-equivalent discount rate over long horizons (Weitzman effect). Flat rates render 150-year payoffs negligible.
      *   *Requirement:* The rule should specify a declining schedule if uncertainty is parameterized, but must justify the asymptotic floor to prevent the "tyranny of the distant future" where trivial far-future benefits swamp present costs.

  5.  **Dynamic Consistency Under Re-optimisation [NON-NEGOTIABLE]**
      *   *Rationale:* Budgets are cyclical. A rule that dictates a project is viable today but would be aborted if re-evaluated in ten years (time inconsistency) creates strategic instability and wasted sunk costs.
      *   *Requirement:* The discount function must be exponential (constant rate) or supported by a binding commitment mechanism; if declining rates are used, the rule must specify how future administrations are bound to the current schedule.

  6.  **Normative Independence from Observed Market Behaviour [NON-NEGOTIABLE]**
      *   *Rationale:* Market rates reflect myopia, liquidity constraints, and finite lifespans, none of which apply to a statutory guardian of the 150-year horizon.
      *   *Requirement:* The specification must be prescriptive (ethical), not descriptive; observed market yields may inform $g$ or risk premiums but cannot set $\delta$.

  7.  **Distinction Between Intergenerational Obligation and Savings Rate [NON-NEGOTIABLE]**
      *   *Rationale:* A low discount rate implies we *should* invest more, but does not dictate *how much* of the current budget is available; conflating the two leads to either fiscal paralysis or under-investment.
      *   *Requirement:* The rule must rank projects by net present value without implicitly solving the optimal consumption-savings path, acknowledging that the budget constraint is political, not derived from the discount rate.

  8.  **Handling of Non-Separable (Existential) Benefits [NON-NEGOTIABLE]**
      *   *Rationale:* Projects reducing the hazard rate of civilisational collapse do not produce a separable stream of benefits; their value is the integral of the future they preserve.
      *   *Requirement:* The evaluation framework must allow for "value of continuation" calculations where the benefit is the conditional expected value of all subsequent welfare, not just a localized cash flow.

  **2. The Exclusionary Requirement**

  The single requirement that excludes the most candidates is **Dynamic Consistency Under Re-optimisation**. Most intuitively appealing models for long-termism (specifically hyperbolic or declining discount rates) are mathematically time-inconsistent; without a legally binding commitment device—which is politically fragile in a democracy—these rules will be abandoned by future budget cycles, rendering the initial calculation void.

  **3. The Unsatisfiable Triangle**

  I flag the subset comprising **Horizon-Declining Rates**, **Stability Under Re-optimisation**, and **Consequentialist Re-evaluation** as jointly unsatisfiable without external commitment. You cannot have a discount rate that falls with time, allow future administrations to re-evaluate projects based on the then-current horizon, and expect the original decision to stand; one leg of this triangle must break, usually resulting in the abandonment of the declining rate schedule when the horizon shortens.

  **4. Failure Modes of Standard Families**

  *   **Zero pure time preference with a growth term:** This approach risks discounting the future heavily anyway if economic growth is assumed positive, and fails catastrophically if long-term growth is negative or zero.
  *   **Positive pure rate calibrated to observed choice:** This violates the statutory duty of intergenerational equity by importing the finite time horizons and myopia of current market actors into the valuation of future lives.
  *   **Declining-horizon schedules:** While theoretically robust to uncertainty, these schemes lack dynamic consistency and invite strategic manipulation by delaying investment until the discount rate falls further.
  *   **Views that drop pure time preference but add a separate sustainability constraint:** These often collapse into lexicographic preferences that offer no guidance on trade-offs when strict sustainability is impossible or prohibitively expensive.
