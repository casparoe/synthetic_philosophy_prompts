          *   *Critique:* This relies on a specific definition of rationality (internal consistency at a single time slice). It ignores *diachronic* rationality (consistency over time). If I plan to diet on Monday and eat cake on Monday, I am violating my own plan. The friend is redefining "better judgment" to mean "current urge" rather than "considered judgment."
          *   *Philosophical Context:* Donald Davidson's definition of akrasia involves acting against one's *all-things-considered* judgment. If the "all-things-considered" judgment shifts solely due to proximity, is it still a judgment or just an impulse?

