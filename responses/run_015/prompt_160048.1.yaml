answer: |-
  Your friend is making a category error common in behavioral economics: he is conflating an **explanation of behavior** with a **justification of rationality**. He is also relying on a specific, thin definition of "preference" that begs the question against the philosophical concept of *akrasia*.

  You are right to feel that his argument is "too clean." It cleans up the mess by sweeping the agent's normative judgment under the rug.

  Here is the breakdown of where his argument fails and where your intuitions are correct.

  ### 1. Preference vs. Better Judgment (The Davidson Point)
  Your friend's core move is to equate "what I most prefer at $t_2$" with "my better judgment at $t_2$."
  *   **His view:** At $t_2$ (cookie in hand), the utility of the cookie spikes above the utility of health. Therefore, eating it maximizes utility. Therefore, it is rational.
  *   **The mistake:** *Akrasia* is not acting against your strongest *desire*; it is acting against your best *judgment*.

  Donald Davidson, in *How is Weakness of the Will Possible?*, defines akrasia specifically as acting against one's **all-things-considered judgment**.
  Even if hyperbolic discounting causes a spike in *desire* for the cookie at $t_2$, it does not necessarily change my *judgment* that health is more valuable. I can simultaneously think:
  1.  "I want this cookie more than I want health right now." (First-order desire)
  2.  "I judge that maintaining my diet is better than eating this cookie." (All-things-considered judgment)

  If I eat the cookie, I have acted against my judgment. The discount curve explains *why* the desire spiked, but it does not dissolve the conflict between desire and judgment. Your friend has redefined "rationality" to mean "satisfying current impulses," which eliminates akrasia by definition, not by argument.

  ### 2. The "Better Informed" Fallacy
  Your friend claims the later self is "better informed" because they are closer to the reward. This is a profound philosophical error.
  *   **Proximity $\neq$ Information:** Being physically closer to a cookie does not give you new *information* about its value. It does not change the caloric content, the health impact, or the long-term consequences.
  *   **Visceral vs. Epistemic:** What changes is the *visceral intensity* of the craving, not the epistemic status of the agent. Jon Elster calls this the difference between "cold" and "hot" states. A hot state is not a *more informed* state; it is often a *less* rational state because it narrows the agent's focus (tunnel vision).

  If I plan to save money in January, and in December I spend it because Christmas feels "closer," I am not better informed in December. I am victim to a temporal bias. Calling this "better information" is just a way to launder irrational impulses into rational updates.

  ### 3. Diachronic Rationality (The Money Pump)
  Your friend is arguing for **synchronic rationality** (consistency at a single moment) and ignoring **diachronic rationality** (consistency over time).
  *   If your preferences reverse solely due to the passage of time, you are **dynamically inconsistent**.
  *   In decision theory, dynamic inconsistency is a form of irrationality because it makes you vulnerable to a "money pump." I could trade you Plan A for Plan B (for a small fee) in January, and then trade you Plan B back for Plan A (for a small fee) in December. You end up with what you started but less money.

  An agent who knows they will reverse their preference but does nothing to stop it (and cannot claim "bad luck" regarding precommitment) is failing to govern themselves as a single entity over time. Your intuition is correct: **The earlier preference to bind oneself does condemn the reversal.** If I am the same person in January and December, my January rationality has a claim on my December actions. Ignoring it is a fracture in agency.

  ### 4. Willpower vs. Precommitment
  Your friend claims willpower is just a label for precommitment devices. This is a behaviorist reduction that ignores the phenomenology of agency.
  *   **Precommitment is a tool, not the capacity:** Ulysses tying himself to the mast is a precommitment device. But the *decision* to tie himself, and the *ability* to resist the Sirens if the ropes had loosened, is willpower.
  *   **The "No Device" Scenario:** As you noted, precommitment isn't always available. If I am at a party with no way to leave, and I judge I shouldn't drink but do so anyway, your friend calls this "bad luck." That is absurd. It strips the agent of responsibility.
  *   **Ryle's Argument:** Gilbert Ryle argued that willpower is a capacity like a skill. It is the ability to keep one's higher-order principles active in the face of competing lower-order desires. Reducing this to "availability of external constraints" denies the internal work of resistance.

  ### 5. Your "Synchronic" Bug is the Knockout Blow
  You asked: *"Doesn't akrasia come in a synchronic form... that no curve over delays even touches?"*

  **Yes.** This is the strongest counter-argument.
  Hyperbolic discounting explains **preference reversal** over time ($t_1$ vs $t_2$).
  It does **not** explain **akratic action** at $t_2$.

  At $t_2$, with the cookie in hand:
  1.  **Scenario A:** My judgment shifts. I now believe eating the cookie is actually best. (This is not akrasia; this is a change of mind).
  2.  **Scenario B:** My judgment remains. I believe I should not eat it, but I eat it anyway. (This is akrasia).

  Hyperbolic discounting predicts the *urge* in Scenario B. It does not make Scenario B rational. It merely explains the pressure. If I succumb to the pressure against my own standing judgment, that is the definition of weakness of will. Your friend is arguing that because the pressure is predictable, succumbing to it is rational. That is like saying, "Because gravity is a constant law, jumping off a cliff is rational."

  ### The Verdict
  Your friend is describing a **model of behavior** (hyperbolic discounting) and mistaking it for a **normative justification**.

  *   **He is right that:** Hyperbolic discounting explains *why* we face temptation. It naturalizes the *cause* of the shift.
  *   **He is wrong that:** This dissolves *akrasia*. Akrasia is a normative failure (acting against judgment), not just a descriptive inconsistency.
  *   **He is wrong that:** The later self is better informed. Proximity is not information.
  *   **He is wrong that:** Willpower is just precommitment. That removes the agent from the equation.

  **How to settle it:**
  Tell him he is committing the **Naturalistic Fallacy**. He is moving from "This is how humans *do* behave (discount hyperbolically)" to "This is how humans *ought* to be judged (it's rational)."

  If his theory were true, no one could ever be irrational. Any action could be explained by some shift in the discount curve or availability of commitment devices. If nothing counts as weakness of will, the term "weakness of will" has no meaning—but we know it does, because we feel the regret of the "later self" who wishes the "earlier self" had held firm. That regret is the phenomenological proof that the reversal was not rational.

  You win. The puzzle is not a redescription artifact; it's a real conflict between impulse and judgment that discounting explains but does not justify.
