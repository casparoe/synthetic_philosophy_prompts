  *(Refining the "Ladder" constraint)*: The user asks if varying awakenings is question-begging. I need to be clear: It begs the question *if* you assume the thirder conclusion to prove the thirder conclusion. But as a *test* of the Halfer's "No New Information" claim, it's valid. If I wake you a million times on Tails, do you really learn *nothing*? The Halfer says yes. The Thirder says no. The ladder makes the Halfer's "yes" sound implausible. That's a feature, not a bug.

