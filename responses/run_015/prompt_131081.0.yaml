answer: |-
  ### Part 1: Unstructured Brainstorming

  Here are two candidate scenarios and two orderings I considered before settling on the final plan.

  **Candidate Scenario A: The Betting Table**
  We treat Beauty as a rational agent facing a Dutch Book. Every time she wakes, she is offered a bet: $1 if Tails, -$1.50 if Heads.
  *   **Cost:** This risks conflating *credence* (belief) with *decision theory* (action). It invites your Constraint 3 suspicion immediately, but potentially as a confusion rather than a solution. It may alienate the non-quantitative half if we get bogged down in expected utility calculations.
  *   **Ease:** It satisfies the engineers' need for "cash value." It makes the 1/3 position pragmatically undeniable (you lose money betting 1/2).

  **Candidate Scenario B: The Frequentist's Ledger**
  We treat the experiment as a data collection exercise. We draw two columns on the board: "Experimental Runs" and "Observer Moments."
  *   **Cost:** This risks the stalemate you fear (Constraint 1). The Halfer counts rows; the Thirder counts cells. Without a meta-rule for which column matters, it ends in a shout-down.
  *   **Ease:** It directly engages the physicists' instinct (Constraint 1). It makes the reference class problem visible immediately.

  **Ordering 1: The Standard Escalation**
  1. Standard Problem (1 Head / 1 Tail / 2 Tails).
  2. Extreme Problem (1 Head / 1,000,000 Tails).
  3. Formal Resolution (Indexicals).
  *   **Cost:** Can feel like a "gotcha" trick. The Extreme case pressures the Halfer so hard they may dig in rather than engage.
  *   **Ease:** Very clear intuition pump.

  **Ordering 2: The Definition First**
  1. Define "Credence" vs. "Frequency."
  2. Apply to Standard Problem.
  3. Apply to Extreme Problem.
  *   **Cost:** Dry. Loses the narrative tension.
  *   **Ease:** Philosophically rigorous from the start.

  ***

  ### Part 2: The Commitment and Justification

  **The Plan:** I recommend a hybrid of **Scenario B (The Ledger)** driven by **Ordering 1 (The Escalation)**.

  **Justification:**
  1.  **Honouring the Physicists (Constraint 1):** By starting with the Ledger (Counting), you validate the scientists' instinct rather than suppressing it. You show them that *both* counts are mathematically correct, but they answer different questions. This prevents the "you counted wrong" stalemate.
  2.  **The Ladder (Constraint 2):** The "Extreme Case" (1 vs 1,000,000 awakenings) is **not** question-begging, provided you frame it correctly. It is a *stress test* for the Halfer's claim that "awakening provides no new information." If I wake you a million times on Tails and once on Heads, the claim that "I learned nothing" becomes intuitively costly. It forces the Halfer to articulate *why* it costs nothing.
  3.  **Credence vs. Betting (Constraint 3):** Your suspicion is **defensible but costly**. This is known as the "Lewisian Halfer" position (after David Lewis). It is not a muddle, but it is a specific technical maneuver: it saves the 1/2 credence by sacrificing the link between credence and rational betting odds in self-locating contexts. It must be introduced *late* in the session as a sophisticated escape route for the Halfer, not as the starting definition.
  4.  **Doomsday (Constraint 4):** We will use a "Parking Lot" technique. We acknowledge the structural identity but defer the application to avoid scope creep.

  ***

  ### Part 3: The Teaching Plan (40 Minutes)

  #### I. The Setup and The Ledger (0–10 Minutes)
  **Goal:** Validate the frequency instinct, then fracture it.

  1.  **Draw the Ledger:** On the whiteboard, draw a table with two columns.
      *   Column A: **Experimental Runs** (The Coin Toss).
      *   Column B: **Observer Moments** (The Awakenings).
  2.  **The 100-Run Test:** Ask the scientists to fill this out for 100 experiments.
      *   *Column A:* 50 Heads, 50 Tails. (Probability of Heads = 1/2).
      *   *Column B:* 50 Heads (Mon), 50 Tails (Mon), 50 Tails (Tue). Total 150 awakenings. 50 are Heads. (Probability of Heads = 1/3).
  3.  **The Pivot:** State clearly: "Neither side made an arithmetic error. The Halfer counts *Runs*. The Thirder counts *Moments*."
  4.  **The Question:** "Sleeping Beauty is asked for her credence *upon awakening*. Which column represents her evidence?"
      *   *Head off Constraint 1 here:* Do not let them argue about the math. Argue about the *sample space*.

  #### II. The Ladder: Extreme Sleeping Beauty (10–20 Minutes)
  **Goal:** Use the magnitude pressure to test the "No New Information" claim.

  1.  **Deform the Case:** Keep the coin fair.
      *   Heads: Wake 1 time.
      *   Tails: Wake 1,000,000 times.
  2.  **The Intuition Pump:** "You wake up. The coin was Tails a million times more likely to produce *this moment* than Heads. Do you really believe the coin is 50/50?"
  3.  **Addressing Constraint 2 (Is this cheating?):**
      *   Explain that this does not prove the Thirder right. It tests the Halfer's core premise: "Awakening gives no new information."
      *   If the Halfer is right, the ratio of awakenings shouldn't matter.
      *   If the Thirder is right, the ratio *is* the information.
      *   *Instruction:* Use this to force the Halfers to speak. Ask them: "What specific piece of data changes in the million-case that doesn't exist in the standard case?"

  #### III. The Core Disagreement: Indexicals vs. Propositions (20–30 Minutes)
  **Goal:** Define the philosophical fault line.

  1.  **The Proposition:** Write on the board: $P = \text{"The coin landed Heads"}$.
  2.  **The Indexical:** Write next to it: $Q = \text{"It is now Monday"}$.
  3.  **The Mechanism:**
      *   **Halfers** treat $P$ as a property of the *world* (the coin toss). Since the world didn't change, $Cr(P) = 1/2$.
      *   **Thirders** treat $P$ as indexed to the *observer*. "I am in a Heads-world moment." Since there are fewer of those, $Cr(P) = 1/3$.
  4.  **Addressing Constraint 3 (Credence vs. Betting):**
      *   Now introduce your suspicion. "Some philosophers say: Believe 1/2, but Bet 1/3."
      *   **Verdict:** This is the **Lewisian Position**. It is coherent but requires abandoning the principle that "Rational credence guides rational betting."
      *   **Placement:** Place this *here*, as a response to the betting pressure. If you put it earlier, it looks like equivocation. Here, it looks like a sophisticated cost-benefit analysis. "You can keep your 1/2, but you have to pay a price in decision theory."

  #### IV. The Fence and The Diagnostic (30–40 Minutes)
  **Goal:** Manage the Doomsday drift and test understanding.

  1.  **Addressing Constraint 4 (Doomsday):**
      *   *The Move:* Draw a box in the corner of the board labeled "Anthropics (Doomsday)."
      *   *The Script:* "Two of you are already thinking about the Doomsday Argument. You are right to see the connection. It uses the same engine: self-locating uncertainty and reference classes. But if we open that box now, we won't understand the engine. We will park it there. If we have time at the very end, we peek. If not, it remains the homework."
      *   *Why:* This validates their insight (they aren't being fobbed off) but enforces the boundary (we must understand the tool before the application).
  2.  **The Diagnostic (Final 5 Minutes):**
      *   Do not ask for a show of hands (1/2 vs 1/3).
      *   **Ask this:** "I want everyone to write down one sentence. Complete this sentence: 'The Halfer and the Thirder disagree about whether the proposition "The coin is Heads" refers to \_\_\_\_\_\_\_.'"
      *   **Success:** If they write "The Coin Toss" vs. "My Current Awakening," they understand the structure.
      *   **Failure:** If they write "Math" vs. "Logic" or "Runs" vs. "Awakenings" (without referencing the *proposition*), they have only learned the labels.

  ***

  ### Part 4: Specific Design Notes

  **The Single Carrying Case**
  *   **Must Contain:** A fair coin. A clear distinction between the *toss* (Sunday) and the *interview* (Mon/Tue). The payoff structure (optional, but helpful for the betting argument).
  *   **Must Omit:** Memory erasure details beyond "you don't know if you've been here before." Do not get into the neurology of the sleeping drug. Do not introduce variations like "Beauty is told it is Monday" (the "Halfers' Best Friend" case) unless you have extra time; it complicates the core reference class issue.

  **Misconceptions & Timing**
  1.  **"You're counting wrong." (Minute 5):**
      *   *Head off:* Explicitly state, "Both counts are arithmetically correct. The dispute is metaphysical, not mathematical."
  2.  **"It's just betting odds." (Minute 25):**
      *   *Head off:* When introducing Constraint 3, clarify that standard epistemology *requires* credence to drive betting. Decoupling them is a major theoretical cost, not a simple fix.
  3.  **"This proves the Doomsday Argument." (Minute 35):**
      *   *Head off:* Use the Parking Lot box. Remind them that SB is about a *known* experimental setup, whereas Doomsday is about *unknown* population sizes. The analogy is strong, but the premises differ.

  **What to Decline**
  You must explicitly state what you are *not* doing to manage expectations. Say this at the start:
  *"I am declining three things today. First, I will not derive the formal measure theory behind self-locating belief; we are doing this with whiteboard arithmetic. Second, I will not settle the debate; my job is to show you why smart people disagree, not to tell you who won. Third, I will not fully unpack the Doomsday Argument, though I will show you where the bridge is."*

  ### Summary of the "Credence vs. Betting" Position (Constraint 3)
  Your suspicion is **correct**, but it is not a "dissolution" of the problem; it is a specific philosophical stance called **Decision-Theoretic Halferism**.
  *   **Shape:** It argues that Credence tracks *truth conditions* (Heads is 50% of worlds), while Betting Odds track *payoff conditions* (Heads is 33% of payouts).
  *   **Risk:** It violates the **Reflection Principle** (you should not expect your future beliefs to differ from your current ones without new info).
  *   **Instruction:** Present this as the "High Cost Escape Hatch." It allows scientists to keep their 1/2 frequency intuition, but they must admit that rational action sometimes diverges from rational belief in self-locating cases. This is a profound claim, not a muddle.
