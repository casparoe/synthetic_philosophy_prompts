  Miriam is running two primary heuristics that usually converge but here diverge.

  First, the **Criterion of Dissimilarity from Later Church**: traditions soften over time; stricter or less spiritualized versions are earlier. She used this to authenticate the divorce prohibition (later church softened it) and reject Luke's "kingdom within" (later church spiritualized it). Second, the **Criterion of Multiple Attestation/Early Source**: isolated or late traditions are suspect; style can be imitated. She used this to mark the Good Samaritan as unprovable (Lukan only) and reject the Virgin Birth (late infancy narratives).

  On this fragment, the rules come apart on the weight of transmission versus content. The Dissimilarity rule predicts **Authentic**. The saying contradicts the Lord's Prayer (later practice) and supports her specific reconstruction of an apocalyptic Jesus (kingdom as snare, not within). It fits her pattern of accepting "harder" readings that clash with later orthodoxy. The Attestation rule predicts **Unprovable** or **Inauthentic**. The fragment is third-century, non-canonical, and singly attested, mirroring the Good Samaritan and Virgin Birth rulings where lack of early breadth killed the claim.

  My best guess is she will rule it **Authentic**. While she called the Good Samaritan unprovable, that parable did not fundamentally alter the theological landscape she cares about. This saying directly overturns the standard prayer and confirms her thesis that Jesus expected a catastrophic break-in, not a spiritual presence. The embarrassment factor (Baptism precedent) will override the lateness (Virgin Birth precedent) because the theological payoff validates her core argument against Luke's spiritualized kingdom. She will likely dismiss the "matched parallel lines" as Semitic heritage rather than later composition, distinguishing it from the Psalm 22 case.

  To tell the surviving rules apart, put this case to her: A 1st-century papyrus containing a clear claim of Jesus' pre-existence or explicit divinity. The Attestation rule (early date) predicts **Authentic**. The Dissimilarity rule (too much like later theology) predicts **Inauthentic**. Her ruling here would reveal whether she prioritizes her theological reconstruction (Dissimilarity) or historical dating (Attestation) when they conflict. If she rejects it, she is consistent with her bias against later theology; if she accepts it, she is consistent with her respect for early dating. Given her track record, she will likely reject it, proving that her "Apocalyptic Jesus" thesis drives the methodology more than the dating does.
