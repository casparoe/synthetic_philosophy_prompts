  3.  **Units Check:** Transform $X$ (e.g., log, square). *Sufficient:* Justification exists for original scale. **STOP/NO:** If scale choice is arbitrary, go to 6.
  4.  **Physical Story:** Identify generating mechanism. *Sufficient:* Mechanism defines scale (e.g., storm physics). **PASS:** Use mechanism. **NO:** Go to 5.
  5.  **Data Check:** Search for empirical evidence. *Sufficient:* Data informs distribution. **PASS:** Use data. **NO:** Go to 6.
  6.  **Senior Review:** Escalate ambiguity. **HANDOFF:** Senior makes modeling judgment. Document decision.
  7.  **Document Scale:** Record chosen parameterization. *Sufficient:* Scale explicitly named.
  8.  **Regulator Statement:** Draft justification. *Sufficient:* Matches template: *"We model [Quantity] using a uniform distribution on the [Scale/Units] scale. This choice is licensed by [Physical Story/Data/Senior Judgment], which establishes [Scale] as the natural measure of variability. We confirm invariance under linear unit changes, acknowledging nonlinear transforms alter density."*

  **Case Runs**

  1.  **Hazard Track:** Step 1 passes (offset/orientation). Step 4 passes (storm physics defines track generation in plane). **Result:** Use physical story (offset uniformity). Resolves Bertrand's paradox.
  2.  **Failure Rate:** Step 1 passes. Step 3 fails (uniform on rate $\neq$ uniform on log-rate; no natural scale). Step 5 fails (no data). **Result:** Step 6 trigger. **HANDOFF:** Senior Review required. Abandon default uniform prior; Senior selects scale (e.g., Jeffreys prior).
  3.  **Regulatory Fines:** Step 1 fails ("unnamed quantity"). **Result:** **STOP/NO.** Return to requester. Cannot model undefined risk.

  **Limitations**

  This procedure cannot settle true ignorance where no physical mechanism or data exists; it only exposes arbitrariness. It forces explicit judgment rather than hiding it behind "uniformity." It cannot determine truth, only consistency. It cannot resolve disputes where two physical stories are equally plausible; that remains a **HANDOFF** to Senior Review.

  **Regulator Justification Template**

  "We model [Quantity] using a uniform distribution on the [Scale/Units] scale. This choice is licensed by [Physical Story/Data/Senior Judgment], which establishes [Scale] as the natural measure of variability. We confirm invariance under linear unit changes, acknowledging nonlinear transforms alter density."
