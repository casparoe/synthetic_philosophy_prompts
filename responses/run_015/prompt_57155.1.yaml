answer: |-
  **Exam Question**

  **Question 4 (25 marks)**

  Consider an agent, Alice, who believes that $p$ and believes that $p \to q$. Alice is competent, awake, and has no defeaters for either belief. However, she has never performed the inference to $q$ and does not believe $q$.

  In standard possible-worlds semantics, this scenario is impossible: there is no world where $p$ and $p \to q$ are true but $q$ is false, so any agent believing the premises across all doxastically accessible worlds must believe the conclusion. This is the problem of logical omniscience.

  Philosophers and computer scientists have proposed various repairs: introducing **impossible worlds** where logical laws fail; adding an **awareness operator** to distinguish explicit from implicit belief; or defending the standard model as a harmless **idealization** (analogous to frictionless planes in physics).

  Write an essay comparing **two** of these three approaches. For each, explain precisely what constraint it relaxes to accommodate Alice's state. Then argue which of the two is superior. Your argument must address the following: does the repair preserve enough structure to constrain belief ascription, or does it make the semantics trivial? If defending the idealization, explain why computational limits are unlike friction—they seem to constitute the difference between agents rather than merely distorting them.

  ***

  **Model Answer**

  The standard possible-worlds model fails Alice because it individuates belief content coarsely: believing a proposition means ruling out all worlds where it is false. Since there are no worlds where $p$ and $p \to q$ hold but $q$ fails, Alice counts as believing $q$. To fix this, we must either expand the space of worlds or restrict the closure of belief. I will compare the **Impossible Worlds** repair against the **Idealization** defense, arguing that Impossible Worlds offers a formal solution that ultimately collapses into triviality, whereas Idealization, while often dismissed, correctly identifies that computational limits are constitutive of belief, provided we accept it as a pragmatic tool rather than a semantic truth.

  The Impossible Worlds approach expands the semantic model to include worlds where logical laws do not hold. In this framework, there are worlds where $p$ and $p \to q$ are true, but $q$ is false. Alice's doxastic accessibility relation can select these impossible worlds, allowing her to believe the premises without believing the conclusion. This preserves the possible-worlds semantics while accommodating logical fallibility. However, the cost is severe. To work, we must individuate impossible worlds finely enough to distinguish between believing $p$ and believing $q$ even when they are logically equivalent. If we allow *any* contradiction or failure of closure to define a world, the constraints on belief ascription vanish. We can model any belief set simply by positing a world where exactly those sentences are true. This makes the semantics descriptive rather than explanatory; it records what Alice believes without explaining the structure of belief. The repair saves the formalism but sacrifices the constraint that made possible worlds useful: the link between belief and truth conditions.

  The Idealization defense accepts the standard model but claims logical omniscience is a harmless simplification. In physics, we ignore friction to model gravity; similarly, we ignore computational limits to model rationality. The objection, however, is that friction is an external force impeding motion, whereas computational limits are internal to the mechanism of thought. Dropping friction leaves the object's mass intact; dropping computational limits removes the distinction between a calculator and a stone. If belief is a state produced by computation, then failing to close under consequence isn't a distortion of belief—it is a feature of it. Therefore, treating omniscience as an idealization risks modeling something other than belief.

  Despite this, Impossible Worlds is the weaker option. Its failure is structural: by allowing worlds to be individuated arbitrarily, it loses the ability to predict or constrain belief. If any belief set can be modeled by a specific impossible world, the model cannot tell us what an agent *should* believe given their current state, nor can it generalize across agents. It reduces to a syntactic list of beliefs disguised as semantics.

  Idealization, conversely, fails only if we demand the model describe actual cognitive processes. If we treat the possible-worlds model as a normative tool for interpreting agents *as if* they were rational, it remains useful. It allows us to identify inconsistencies in Alice's beliefs without committing to the claim that she actually holds them. The disanalogy with friction is real, but it matters less if the goal is interpretation rather than simulation. We idealize not because agents are frictionless, but because rationality is the standard by which we measure belief.

  Therefore, Idealization is superior. Impossible Worlds solves the problem by destroying the semantic constraints that give the model value, rendering it trivial. Idealization admits the mismatch but preserves the normative structure of belief. While computational limits are constitutive of actual cognition, the possible-worlds model is not a map of cognition; it is a map of rational commitment. We should keep the model as a measure of coherence, acknowledging that Alice's failure to infer $q$ is a computational flaw, not a semantic possibility.

  ***

  **Marking Scheme (25 Marks)**

  **1. Setup and Problem Identification (4 marks)**
  *   **4 marks:** Clearly explains why the standard model fails Alice (no world where premises true/conclusion false) and defines logical omniscience in this context.
  *   **2-3 marks:** Identifies the problem but is vague on why the semantics force the conclusion.
  *   **0-1 marks:** Fails to use the concrete case or misstates the logical problem.

  **2. Analysis of Repair 1 (e.g., Impossible Worlds) (5 marks)**
  *   **5 marks:** Explains the mechanism (expanding world space) and identifies the specific cost: loss of constraints/triviality of individuation (semantics collapses to primitive belief lists).
  *   **3-4 marks:** Explains mechanism but misses the triviality constraint cost (treats it as a free fix).
  *   **0-2 marks:** Incorrect description of the repair.

  **3. Analysis of Repair 2 (e.g., Idealization) (5 marks)**
  *   **5 marks:** Explains the defense and engages with the "friction" analogy. Explicitly addresses why computational limits might be constitutive rather than distortive.
  *   **3-4 marks:** Explains the defense but accepts the friction analogy without critique.
  *   **0-2 marks:** Misunderstands the defense (e.g., treats it as claiming agents are actually omniscient).

  **4. Critical Comparison and Verdict (6 marks)**
  *   **6 marks:** Reaches a clear verdict. Justifies it by comparing the *costs* (triviality vs. normative mismatch). Argues why one cost is preferable.
  *   **3-5 marks:** Reaches a verdict but relies on preference rather than structural critique.
  *   **0-2 marks:** No clear verdict or contradictory argument.

  **5. A-Grade Move: Meta-Criterion (5 marks)**
  *   **5 marks:** **Distinctive A move:** Explicitly articulates the standard a repair must meet: it must solve the problem without making belief ascription unconstrained (solving vs. redescribing). Explains why a fix that allows *any* belief set is worse than the disease.
  *   **3-4 marks:** Discusses constraints but doesn't elevate this to a criterion for success.
  *   **0-2 marks:** Treats all repairs as equally valid options.

  **Common Mistakes and Penalties**

  1.  **The "Resource" Error (−3 marks):** Treating the problem as purely about memory or time limits (e.g., "Alice didn't have time to think"). *Penalty:* Deduct 3 marks from Analysis/Comparison. The problem is about content individuation, not just processing speed.
  2.  **The "Knowledge" Confusion (−2 marks):** Framing the problem solely as one about *knowledge* (factive) rather than *belief* (non-factive). *Penalty:* Deduct 2 marks from Setup. While related, the omniscience problem applies distinctly to belief logic.
  3.  **The "Closure/Necessitation" Conflation (−3 marks):** Assuming that giving up closure under known implication is the same logical move as giving up necessitation (rule of inference vs. axiom). *Penalty:* Deduct 3 marks from Analysis. They have different semantic costs.
  4.  **The "Magic Worlds" Error (−4 marks):** Proposing Impossible Worlds as a solution without explaining how those worlds are individuated (i.e., assuming they solve the problem by fiat). *Penalty:* Deduct 4 marks from Analysis. This misses the triviality objection.
  5.  **The "Friction" Acceptance (−3 marks):** Accepting the idealization defense without addressing the disanalogy (that computation constitutes the agent, unlike friction). *Penalty:* Deduct 3 marks from Analysis/Comparison. This shows a lack of critical engagement with the prompt's specific challenge.
