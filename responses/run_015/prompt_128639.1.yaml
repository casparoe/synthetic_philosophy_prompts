answer: |-
  **Project Title:** The Stratigraphic Veto: Geological Rule or Philosophical Commitment in the Anthropocene Debate?

  **1. The Question**
  The International Commission on Stratigraphy (ICS) effectively holds a "stratigraphic veto" over new epoch definitions: a proposed boundary (like the Anthropocene) gets rejected if it disrupts the integrity of existing subdivisions (like the Holocene). My core question is: Does this veto actually settle the scientific dispute over the Anthropocene's start date, or does it merely relocate the disagreement into historiography? Specifically, I want to argue that the veto isn't a neutral geological tool but smuggles in a philosophical commitment—that the Holocene is a "natural kind" of climate stability rather than a conventional slice of time. If the Holocene is just a convention, the veto is arbitrary. If it's a natural kind, the veto is justified. I need to figure out which one the geologists are actually doing.

  **2. The Deadlock**
  Right now, the debate is stuck between geologists pushing for a 1950 start (based on radionuclides in sediment) and Earth system scientists/historians arguing for 1784 (steam engine) or 1610 (Orbis spike/CO2 dip). The standard deadlock is framed as "hard science vs. human history." But this ignores the ICS's own gatekeeping. The Subcommission on Quaternary Stratigraphy has signaled that carving out the Anthropocene might invalidate the Holocene's utility as a reference frame for climate stability. This isn't just about finding a golden spike in the mud; it's about preserving the Holocene as a specific conceptual container. The geologist-vs-historian framing leaves this open because it assumes the geological criteria are neutral, when the criteria themselves might be protecting a specific narrative about stability.

  **3. The Method**
  I plan to use conceptual analysis combined with a comparative case study.
  *   **Internal Analysis:** I'll look at the public reasoning used by the Anthropocene Working Group (AWG) versus the Quaternary Subcommission. I'm looking for shifts in language where "stratigraphic continuity" turns into "climate stability."
  *   **Historical Comparison:** I'll briefly compare this to how the Pleistocene-Holocene boundary was set. Did they use a similar veto there? If the veto is standard practice, it's procedural. If it's being amplified now, it's protective.
  *   **Cross-Disciplinary Check:** I'll loosely compare this to how physics handles reference frames (e.g., inertial frames). In physics, we admit some frames are chosen for convenience, not because they're "true." I want to see if stratigraphy admits its epochs are convenient slices or discovered natural joints.

  **4. Expected Results & Failure Conditions**
  *   **Success:** I demonstrate that the veto relies on an undefended premise that the Holocene is a unique period of stability that must not be "contaminated." This would show the start-date dispute isn't solvable by more data, but requires a philosophical decision on how we classify time.
  *   **Failure:** If I find that the veto is purely about physical correlatability (i.e., "we can't find this layer globally") without reference to climate stability narratives, then my claim collapses. Also, if the Holocene is already formally defined as *just* a convention in the stratigraphic code, and I missed that, the project fails.

  **5. Scope Check (One Semester)**
  This is tight but doable if I stay narrow. I won't attempt a full history of stratigraphy. I'll focus on documents and statements from the last 10 years regarding the Anthropocene formalization process and the specific rejection/rationale communications from the ICS. I won't interview geologists; I'll stick to published rationale. The physics comparison will be illustrative, not technical.

  ***

  **Note on Uncertainty & Falsification**
  **What would change my mind?** If I find internal working group minutes or explicit methodological papers where the ICS openly discusses the Holocene as a *conventional* tool and admits the veto is just pragmatic housekeeping (not about preserving "stability" as a natural fact), then my claim that they are "smuggling in" a commitment is wrong. They might be fully aware it's a convention and just protecting their own taxonomy for utility.
  **Shakiest Reasoning:** My assumption that "preserving subdivisions" equals "believing in natural kinds." It's possible to treat epochs as conventional tools but still want them to be robust for practical use (like keeping time zones consistent) without believing they reflect metaphysical reality. I need to make sure I don't conflate "practical utility" with "natural kind realism."
