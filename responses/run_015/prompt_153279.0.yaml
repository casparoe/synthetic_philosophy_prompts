answer: |-
  **The question, stated tightly**
  Otto Neurath's picture-language project offers a criterion for visualization fidelity that is neither correspondence nor usability, but revision-readiness: a visualization succeeds when it allows a community to update its claims without renegotiating the code. This project asks whether Neurath's anti-foundationalism—"rebuilding the ship at sea"—generates a distinct epistemic standard for public health informatics. Current practice evaluates charts by how faithfully they encode static numbers or how easily lay audiences read them. I propose instead that the primary virtue of a scientific picture language is its capacity to absorb new evidence without breaking the convention itself. If Neurath is right, the best chart is not the most accurate snapshot, but the one that remains usable when the underlying model shifts. This fellowship will determine whether "revision-readiness" is a coherent philosophical criterion or merely aesthetics disguised as epistemology.

  **Why the two obvious framings leave it open**
  Existing literature approaches Neurath's visual work through two lenses, neither of which captures this dynamic. The first treats ISOTYPE as a historical footnote to Logical Empiricism or propaganda for adult education. This framing isolates the pictures from the epistemology, treating them as illustrative tools rather than knowledge-constituting practices. It cannot explain why certain visual conventions persist while others fail during scientific crises. The second framing absorbs Neurath into modern graphical integrity literature, where the central question is whether a chart distorts data or misleads audiences about error bars. While useful, this approach assumes a stable reality against which distortion is measured. It relies on a correspondence theory of truth that Neurath's anti-foundationalism explicitly rejects.

  Could graphical integrity simply generate my criterion? If "integrity" means minimizing distortion, it might overlap with revision-readiness, but only accidentally. Integrity metrics measure the relationship between data and ink at a single timepoint; they do not measure the stability of the language over time as data models evolve. A chart can be perfectly proportional yet useless when the underlying theory changes because the visual syntax cannot accommodate the new variables without redefinition. Neither framing accounts for the cost of changing the code itself. If my criterion is valid, it must identify failures where integrity metrics show success—cases where accurate charts were abandoned because they could not sustain disagreement about content without triggering disagreement about the convention.

  **Method — months 1 through 9**
  This project proceeds in three phases over the nine-month fellowship period. Months 1–3 focus on textual reconstruction. I will analyze Neurath's writings on "transformation"—the process by which editors convert statistics into pictures—alongside archival materials from the Social and Economic Museum. The goal is to formalize the rules Neurath proposed for maintaining convention stability during data updates. I will draft a working definition of revision-readiness that distinguishes it from simple flexibility.

  Months 4–6 apply this criterion to three case studies: COVID-era projection fan charts, the hurricane "cone of uncertainty," and IPCC climate diagrams. I will not merely describe these charts but audit their history during periods of model revision. For each case, I will document instances where the visualization was updated versus instances where the visualization framework was abandoned. I will code these events for "convention friction"—moments where experts argued about what the chart meant rather than what the data showed. This moves the analysis beyond intuition; the criterion does work if it predicts which charts maintained public trust during uncertainty spikes.

  Months 7–9 synthesize the findings into a draft article and a framework for informatics practitioners. A key deliverable is addressing the "transformation tension." Since Neurath admitted editors must decide what to drop, I will test whether his rules for transformation are themselves truth-tracking or purely conventional. I will write the final chapters determining whether the criterion holds independently of correspondence.

  **Possible results and what would decide between them**
  There are three likely outcomes. First, the criterion holds: revision-readiness explains the longevity of certain visual conventions better than accuracy metrics. This is confirmed if charts with lower graphical integrity but higher revision-readiness outperform accurate but rigid charts during crises. Second, the criterion collapses into correspondence. If "better transformation" always maps to "more accurate representation of the facts," then Neurath's anti-foundationalism adds nothing to standard realism. I will decide between these by checking whether my justification for preferring one transformation rule over another secretly relies on access to the facts Neurath claims we lack.

  Third, the question as stated may lack a determinate answer because "convention stability" is indistinguishable from "aesthetic preference." If this occurs, I will restate the project's conclusion: the question is not about epistemic virtue but about social coordination. The output would then shift from a philosophical criterion to a sociological account of how visual languages stabilize communities. This is a substantive result, not a failure, but it requires pivoting the final manuscript from epistemology to social philosophy of science. The deciding factor is whether I can isolate transformation rules that are normative (ought to be followed) rather than descriptive (are followed).

  **Failure modes and scope**
  The primary risk is triviality: producing a close reading of Neurath that offers no actionable insight for modern informatics. To avoid this, I will prioritize the case studies over exegesis; the history serves the theory, not vice versa. Conversely, the project could become too large if I attempt to solve the general problem of scientific representation. I must restrict the scope to visual conventions in public health and climate data. If the textual analysis reveals Neurath's rules are too vague to formalize, I will cut the archival phase and rely on secondary literature to secure the definition of transformation. Similarly, if one case study proves too data-intensive, I will drop the IPCC diagrams and focus on the pandemic and hurricane models where public uptake data is more accessible. The fellowship requires a completed draft, not a solved field; the goal is to establish the viability of the criterion, not to finalize a handbook for data visualization.
