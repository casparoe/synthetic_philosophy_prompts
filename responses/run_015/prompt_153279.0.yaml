prompt: |-
  Hey — I need help turning a half-baked idea into an actual proposal document. Context: I'm a 4th-year philosophy PhD student (history/philosophy of science-ish) but I've somehow ended up embedded in a data-viz / public-health informatics group on campus, mostly because I got roped into helping them think about how to present uncertainty to non-specialists. I'm applying for a nine-month internal fellowship from our humanities institute — they want two pages, no citations, I'll fill the bibliography in myself — and here's roughly what I want to do.

  The half-formed thought: Neurath's picture-language project — the ISOTYPE / Vienna Method stuff he ran out of the Social and Economic Museum in Vienna in the late 20s and 30s, with Gerd Arntz cutting the pictograms and Marie Reidemeister doing the "transformation" of source data into charts — gets read two ways, and I think both are wrong. Reading one: a charming footnote to the unified-science program, propaganda for adult education, not epistemology. Reading two: quietly absorbed into the modern graphical-integrity literature, where the question about any given chart is whether it faithfully encodes the numbers and whether audiences misread error bars, log scales, and so on. But Neurath's own commitments point somewhere else. He's the boat guy — no protocol sentences, no bedrock, we rebuild the ship plank by plank while at sea — and he also thought pictures did something sentences can't: you learn the code by convention, and then the comparisons are just *there* in front of you in a way that discursive language doesn't manage. Which means the natural standard for a picture language on his own view can't be correspondence to the facts (no such relation is available to him), but it also can't be straight consequentialism about which charts produce true beliefs (that has nothing specifically to do with pictures). So my candidate criterion, which is the bit I'm least sure about: a picture language is better when it lets a community disagree about content without having to disagree about the code. Score it on the boat axis — when new evidence arrives, can you revise what's depicted by editing *within* the language, or does the revision force you to abandon the language or to argue about what the convention means? Call it revision-readiness if you want. A corrollary I sort of like: this makes how long it takes to learn the code an epistemic virtue rather than a usability metric, and nothing in the existing framing captures that. I want to run it on three cases: COVID-era projection fan charts, the hurricane "cone of uncertainty," and the IPCC's spaghetti plots / burning-embers style diagrams.

  The tension I also want the proposal to own rather than hide: Neurath's own practice was built on "transformation," i.e. an editor deciding what to drop, what to round off, which categories are fixed — which is about as theory-laden and non-neutral as it gets, and it's not obvious his anti-foundationalism has the resources to say why one transformation beats another, or whether he's quietly leaning on a notion of the facts that his holism officially forbids. If that's right, my criterion either collapses back into correspondence-tracking or it's aesthetics with extra steps, and I need the proposal to say how I'd tell the difference. My advisor thinks the picture stuff is a footnote to the protocol-sentence debate; my other committee member thinks the graphical-integrity people basically settled this in the 80s and 90s. I think both are wrong but I definatly can't say why yet in two pages.

  Can you write the thing? Sections, in this order, roughly these lengths: "The question, stated tightly" (~150 words) — give me one sentence I could quote to a committee, then unpack it; "Why the two obvious framings leave it open" (~300 words) — be honest if one of them actually can generate my criterion and I should just be doing that instead; "Method — months 1 through 9" (~350 words) — what I'd actually do, how the three case studies earn their place, and what would count as the criterion doing real explanatory work rather than redescribing my intuitions; "Possible results and what would decide between them" (~250 words), including the collapse-into-correspondence outcome; "Failure modes and scope" (~200 words) — what would make this trivial, what would make it too big for nine months, and what I'd cut first. If the question as I've stated it can't have a determinate answer, say so and restate it — but restate it, don't just complain. American English, and keep it in a proposal register, not an essay register: I'm asking for a plan for work I haven't done.
