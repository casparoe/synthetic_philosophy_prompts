  We give them bread so none are ever lost.
  You would not cast Yourself down from the place.
  We take the choice to spare them all the cost.

  We hold the mystery that matters most.
  They tremble in the vast and empty space.
  We give them bread so none are ever lost.

  We bear the guilt of every human host.
  They seek a master, not a holy face.
  We take the choice to spare them all the cost.

  You scorned the stone; we give them what is most.
  They cannot bear the solitary race.
  We give them bread so none are ever lost.

  I see a world where choice is fully tossed.
  The miracle moves at a measured pace.
  We take the choice to spare them all the cost.

  They do not suffer; pain is now a ghost.
  I fear my reign was but a needless trace.
  We give them bread so none are ever lost.
  We take the choice to spare them all the cost.

  ***

  **Note on Interpretive Choices**

  This poem leans heavily into the Inquisitor's paternalistic love, framing his tyranny as a burden he shoulders rather than a cruelty he enjoys. The most significant departure from Dostoevsky's text is the final stanza's doubt; in the novel, the Inquisitor remains resolute in his conviction, whereas here he is unsettled by the possibility that his "gift" of relief might be rendered obsolete by a future comfort that requires no tyrant at all. I am highly confident in the rendering of the three temptations (bread, mystery, authority) and the core argument regarding freedom's burden, but I am less certain about the Inquisitor's capacity for this specific kind of horror—the fear of being unnecessary rather than the fear of being wrong. A careful reader might also wince at the rhyme repetition of "host," "tossed," and "ghost" in the non-refrain *A* lines, but the limited rhyme pool of *-ost* necessitated close variations to maintain the form's strictures without distorting the argument.
