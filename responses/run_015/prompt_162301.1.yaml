answer: |-
  ### Part 1: The Logical Space

  Before we build the tool, we need to map the terrain. You identified five distinctions that matter. If we treat each as a switch with multiple settings, the number of possible combinations explodes. Here is the raw mathematical space before we prune it for human use.

  1.  **Content vs. Act:** Is the target actually guilty? (2 options: Yes/No).
  2.  **Norm Match:** How closely does the blamer's record match the rule? (4 options: Same rule / Neighboring rule / Serious but different rule / No violation).
  3.  **Time & Ownership:** What is the status of the blamer's violation? (3 options: Current & hidden / Past & hidden / Past & owned).
  4.  **Source of Standing:** Why is this person speaking? (4 options: Victim / Office-holder / General member / Anyone).
  5.  **Clean Hands by Luck:** If the record is clean, why? (2 options: Resisted temptation / Never had the chance).

  **Total Combinations:** 2 × 4 × 3 × 4 × 2 = **192 distinct theoretical positions.**

  Nobody holds 192 distinct views. Most of these combinations are empty. Below is where the views actually live, and where the dead zones are.

  **Empty Region 1: The "Total Silence" Zone**
  *Combination:* Target is guilty + Blamer broke *any* norm (even unrelated) + Standing requires perfection.
  *Why Empty:* This leads to a community where no one can ever speak, because everyone has broken something somewhere. It is logically consistent but socially suicidal. No one actually advocates for this in practice, though some imply it.

  **Empty Region 2: The "Luck Blind" Zone**
  *Combination:* Blamer is clean only by luck (no opportunity) + Treated exactly the same as someone who resisted temptation.
  *Why Empty:* People intuitively feel a difference between virtue and luck. While some theories say "results only," in accountability meetings, people usually sense that "never having the keys to the safe" is different from "not stealing from the safe."

  **Empty Region 3: The "Hypocrite's Veto" Zone**
  *Combination:* Target is guilty + Blamer broke the *same* rule but owned it + Blamer still has no standing.
  *Why Empty:* Most people agree that confession repairs standing. A view that says "Once a rule-breaker, always silenced" is rare because it discourages honesty.

  **Where the Tree Will Fail to Distinguish**
  There are two views that will land on the same leaf in the tree below, because the questions cannot separate them without becoming too complex:
  1.  **The "Separate Fault" View:** Hypocrisy is bad, but doesn't stop the blame.
  2.  **The "Universal Member" View:** Everyone has standing simply by being a member, regardless of record.
  *Why:* Both result in "Blame Goes Through." Distinguishing *why* (because record doesn't matter vs. because membership matters) requires asking about their theory of membership, which is too abstract for a flowchart.

  ***

  ### Part 2: The Decision Tree (Handout)

  **Instructions:** Start at the top. Answer the question that best fits the situation. Follow the line down until you reach a box with bold text. That is your conclusion.

  **Note:** Points marked **[SPLIT]** are where reasonable people often disagree. If the room divides here, do not force a vote; discuss the principle.

  1.  **Is the accusation factually true?**
      *   (Think of the member who says "You didn't actually dump the rubbish, I saw who did.")
      *   **NO:** Stop. The blame fails. It does not matter who is speaking.
      *   **YES:** Go to Question 2.

  2.  **Is the blamer speaking for the Organization itself?**
      *   (Think of the Co-op sending letters about fees while owing the cleaner wages.)
      *   **YES:** **[SPLIT]** Go to Question 3.
      *   **NO:** Go to Question 4.

  3.  **Can the Organization speak if it breaks its own rules?**
      *   (Does the Co-op lose the right to collect fees if it underpays staff?)
      *   **YES:** Blame goes through, but the Organization must fix its own fault separately.
      *   **NO:** Blame fails. The Organization must fix itself before speaking.

  4.  **Is the blamer a Victim or an Office-Holder?**
      *   (Think of the Referee enforcing a rule, the Treasurer catching fraud, or the person who lost money.)
      *   **YES:** Go to Question 5.
      *   **NO:** (You are speaking just as a fellow member.) Go to Question 6.

  5.  **Does the role survive the hypocrisy?**
      *   (Think of the Referee who parks in fire lanes, or the Treasurer who fudged one claim five years ago.)
      *   **YES:** **Leaf: The Office Speaks.** (Standing comes from the job or the hurt, not your record.)
          *   *Awkward commitment:* A corrupt official can still enforce the law until they are fired.
      *   **NO:** **Leaf: Walk the Talk.** (You cannot enforce what you break.)
          *   *Awkward commitment:* We must remove the officer before we can address the original rule-breaker.

  6.  **Did the blamer break this specific rule?**
      *   (Think of the parent who smoked for twenty years telling a teen not to vape.)
      *   **NO:** (Your hands are clean on *this* rule.) Go to Question 7.
      *   **YES:** (You have done this exact thing.) Go to Question 8.

  7.  **Are your hands clean only because you never had the chance?**
      *   (Think of the person who never defrauded the co-op because they were never treasurer.)
      *   **YES:** **Leaf: Lucky Innocence.** (You may speak, but your moral authority is weaker.)
          *   *Awkward commitment:* We must listen to you, but we are allowed to trust you less.
      *   **NO:** (You resisted the temptation.) **Leaf: The Good Neighbor.** (Your record supports your voice.)
          *   *Awkward commitment:* You are held to a higher standard now; one slip ruins this standing.

  8.  **Were you coerced or excused when you did it?**
      *   (Think of the person who did the same thing but was under extreme duress.)
      *   **YES:** **Leaf: The Excused Peer.** (You didn't truly violate the norm.)
          *   *Awkward commitment:* You must prove your coercion was valid before you can judge theirs.
      *   **NO:** (You broke it freely.) Go to Question 9.

  9.  **Did you admit it and fix it?**
      *   (Think of the treasurer who fudged the claim: did they own it?)
      *   **YES:** Go to Question 10.
      *   **NO:** **[SPLIT]** **Leaf: The Silent Hypocrite.** (Standing forfeited until owned.)
          *   *Awkward commitment:* We must ignore your helpful warning until you confess your own past.

  10. **Does having done it make you more credible?**
      *   (Think of the reformed smoker knowing the temptation.)
      *   **YES:** **Leaf: The Experienced Guide.** (Past fault gives you more standing.)
          *   *Awkward commitment:* We value your failure more than someone else's success.
      *   **NO:** **[SPLIT]** **Leaf: Separate Faults.** (Your record is a separate issue.)
          *   *Awkward commitment:* We will process your blame now and your hypocrisy later, even if they feel like the same thing.

  ***

  ### Part 3: Notes on Splits and Failures

  **The Three Split Points**
  In your meetings, these are the nodes where intuition will diverge. Do not try to solve these with the tree; use the tree to identify *that* you are disagreeing on a principle.

  1.  **Node 3 (The Collective Body):** Some believe an institution loses all moral authority if it violates its own values (e.g., the Co-op owing wages). Others believe the institution is a separate entity from its current management failures. *Adjudication:* Decide if the Co-op is "us" (who are all tainted) or "it" (which can be held to account separately).
  2.  **Node 9 (The Silent Hypocrite):** If someone breaks the rule they are enforcing but hasn't admitted it, does their voice vanish? Some say yes (integrity is key). Some say no (the rule is still the rule). *Adjudication:* Decide if accountability is about *truth* (the rule was broken) or *relationship* (who is speaking).
  3.  **Node 10 (The Experienced Guide):** This is the "Ex-Offender" reversal. Does knowing temptation make you a better enforcer or a compromised one? *Adjudication:* Ask the room if they value empathy or consistency more in this specific instance.

  **Where the Tree Fails**
  As noted in the Logical Space, the leaf **"Separate Faults"** hides two different philosophies.
  *   **View A:** "Your hypocrisy is rude, but the rule is still true."
  *   **View B:** "We are all members, and membership grants standing regardless of record."
  The tree treats these the same (Blame Goes Through) because the practical outcome is identical. If your group needs to distinguish these, you must ask: "Are we allowing this because the rule matters more than the speaker, or because the speaker's membership matters more than their record?"

  **Unused Cases**
  *   **The Bystander with a Spotless Record:** Covered under Question 7 (Clean Hands).
  *   **Someone who did something Worse but Different:** Covered under Question 6 (Did you break *this* rule? If No -> Go to 7). The tree assumes that breaking a *different* norm does not forfeit standing on *this* norm, which aligns with the "Separate Faults" leaf. If your group feels breaking a *worse* rule should forfeit standing on a *smaller* rule, you need to add a branch at Question 6 asking about severity. I omitted this to keep the question count under ten, as severity is notoriously hard to measure objectively.
