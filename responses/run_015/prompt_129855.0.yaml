  The student was most likely running **The Normative Origination Principle**, perhaps conflated with **The Structural Well-Foundedness Principle**. Her language about the mesh "collapsing" suggests she views justification as a structural load that requires a foundation to bear it, rather than a property that can emerge from mutual support. To separate the defensible readings (like Structural Well-Foundedness) from the question-begging ones (like Normative Origination), consider a **non-linear infinite lattice of reliable sensors**. In this case, each sensor's output is justified by a reliability norm conditioned on the coherent outputs of its neighbors, forming an infinite mesh with no root node. If justification is treated as a logical proof requiring axioms (Structural Well-Foundedness), this system fails. However, if justification is treated as a systemic property of reliable coherence (challenging Normative Origination), the system succeeds. This case isolates whether the requirement for a "self-justifying base" is a logical necessity or merely a foundationalist assumption about where normative force must originate.
