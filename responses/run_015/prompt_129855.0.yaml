  | **The Normative Origination Principle** | $\forall p (J(p) \rightarrow$ the normative status of $p$ originates in a non-inferential source). | question-begging against infinitism | yes | Equates "justification" with a substance that must have a source; assumes infinitism cannot generate normative force systemically. |
