answer: |-
  # Seminar Handout: Mapping Moral Status
  **Topic:** Does status come in degrees?  
  **Format:** Decision Tree (Answer based on your intuitions, not the reading list)

  Welcome. This tool is designed to help you locate your own position without worrying about whether you **recieve** the orthodox labeling correctly. Follow the nodes below. There are no wrong answers, though some paths are lonelier than others.

  ### The Decision Tree

  **Node 1: The Root Structure**  
  Is moral status binary (you have it or you don't, like being pregnant) or scalar (you can have more or less of it, like height)?  
  *   [ ] **Binary** → Go to Node 2.  
  *   [ ] **Scalar** → Go to Node 4.

  **Node 2: The Binary Switch**  
  If status is binary, what flips the switch?  
  *   [ ] **Species Membership** (Only humans count) → **Leaf A**.  
  *   [ ] **Capacity** (Any being with the right mental traits counts) → Go to Node 3.

  **Node 3: The Insect Test (Binary Capacity)**  
  Consider an insect with distributed nociception (pain signals) but no central brain to integrate them. Does it **recieve** full moral status?  
  *   [ ] **Yes** → **Leaf B**.  
  *   [ ] **No** → **Leaf A** (Effectively species-restricted).

  **Node 4: The Scalar Metric**  
  If status is scalar, what property determines the *amount* of status?  
  *   [ ] **Capacity for Suffering Only** → **Leaf C**.  
  *   [ ] **Cognitive Complexity/Agency** (Problem solving, learning, etc.) → Go to Node 5.

  **Node 5: The Thermostat Test**  
  Consider a smart thermostat with predictive learning algorithms. It adapts to preferences but lacks biology. Does it get *any* moral status (even 0.001)?  
  *   [ ] **Yes** → Go to Node 6.  
  *   [ ] **No** → Go to Node 6.  
  *(Note: If you say Yes here but No to the Insect in Node 3, see **⚠️ Dead End 1** below).*

  **Node 6: The Slime-Mold Case**  
  Consider a slime-mold colony solving a maze as one distributed system. It has no neurons but exhibits collective problem-solving. Does this distributed agency grant status independent of suffering?  
  *   [ ] **Yes** → Go to Node 7.  
  *   [ ] **No** → **Leaf D** (Weird Hybrid).

  **Node 7: The Sleepwalker Boundary**  
  Consider a human sleepwalker. They are biologically human but lack conscious agency at that moment. Does their moral status drop temporarily?  
  *   [ ] **No** (Status is stable) → **Leaf D** (Full Scalar Gradualism).  
  *   [ ] **Yes** (Status fluctuates with state) → **Leaf D** (Weird Hybrid: State-Dependent Scalar).

  ---

  ### The Leaves (Your View)

  *   **Leaf A: Binary Moral Status.**  
      Status is an on/off switch. Likely grounded in species membership or a strict threshold of rationality. Non-humans or non-agents generally fall outside the circle.
  *   **Leaf B: Strict Capacity-for-Suffering Sentientism (Binary).**  
      If you can suffer, you matter equally. The insect counts just as much as the human. Complexity doesn't add *status*, only perhaps *interests*.
  *   **Leaf C: Strict Capacity-for-Suffering Sentientism (Scalar).**  
      Status varies, but only based on the depth/capacity for suffering. Intelligence doesn't grant extra status, only deeper suffering might.
  *   **Leaf D: Full Scalar Gradualism (or Hybrid).**  
      Status tracks cognitive complexity, agency, or distributed problem-solving. A human might matter more than a insect, which might matter more than a rock. Includes the "Weird Hybrid" if you think status fluctuates (Sleepwalker) or applies to colonies (Slime Mold) but not algorithms.

  ---

  ### ⚠️ Flagged Empty Branches

  **Dead End 1: The "Tech-Bias" Gap**  
  *Path:* Thermostat = **Yes** (Node 5) AND Insect = **No** (Node 3).  
  *Diagnosis:* **Incoherent/Unattractive.**  
  Very few philosophers hold this. It implies that predictive algorithms matter more than biological pain avoidance. Usually indicates an unexamined bias toward "human-like" learning over biological sentience. If you landed here, check Node 3 again.

  **Dead End 2: The "Sleepwalker Drop"**  
  *Path:* Binary Status (Node 1) AND Sleepwalker = **No** (Node 7).  
  *Diagnosis:* **Unexplored/High Cost.**  
  If status is binary, losing it temporarily because you closed your eyes makes the "binary" claim unstable. Most binary theorists argue status is based on *kind* rather than *state*, so this branch is rarely occupied.

  ---

  *Instructor Note: Don't worry about matching these leaves to specific authors yet. We'll overlay the reading list once you know where you stand.*
