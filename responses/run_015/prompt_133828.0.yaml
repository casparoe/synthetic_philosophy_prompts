      *(Self-Correction during drafting)*: I need to be careful not to just say "Consequentialism says X." I need to show why the *Double-Ledger* specifically fails. The failure point is the *interface* between the ledgers. How does the agent access both without a meta-ledger?

      *(Refining the Decision Theory point)*: It's not just that decision theory *says* so, but that *action* requires a single choice. If the ledgers conflict, the agent must choose. That choice reveals a hidden preference ordering.

      *(Refining the "Already Appeared" point)*: Shelly Kagan's *The Limits of Morality* is the bible for this critique. Samuel Scheffler's *The Rejection of Consequentialism* tries to build the hybrid view but struggles with the weighting.

