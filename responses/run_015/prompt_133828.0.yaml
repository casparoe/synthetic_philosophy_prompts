answer: |-
  Your "double-ledger" framing is a sophisticated articulation of **agent-centered deontology**, closely resembling the agent-relative/agent-neutral distinction found in Nagel, the "separateness of persons" in Nozick, and the hybrid conception in Scheffler. By positing incommensurability between the *Outcome-Ledger* (OL) and the *Integrity-Ledger* (IL), you attempt to block the aggregation that generates the paradox of deontology.

  However, positing two ledgers does not solve the problem of **choice**. An agent still has only one body and must perform one action. The moment the ledgers conflict, a meta-decision is required. Below is the mapping and ranking of defeaters, followed by an assessment of defender responses and the risk of unfalsifiability.

  ---

  ### I. Mapping and Ranking the Defeaters

  I have ranked these from most damaging (structural collapse) to least damaging (theoretical redundancy).

  #### 1. The Threshold Collapse (Concrete Cases & Line-Drawing)
  *   **The Argument:** If the IL (Integrity) always trumps the OL (Outcome), the view licenses catastrophic harm (e.g., refusing to kill one to save a million). This is morally implausible. If the defender admits a threshold (e.g., IL trumps OL *unless* the OL cost is catastrophic), they must define "catastrophic."
  *   **The Defeat:** Any threshold function $f(OL) > IL$ effectively converts the IL into a weighted variable within a single consequentialist metric. If you kill one to save a million, you have implicitly acknowledged that 1,000,000 lives > 1 integrity violation. The "two ledgers" collapse into a single ledger with a non-linear utility function.
  *   **Rank:** **Critical.** This strikes at the action-guiding coherence of the view.

  #### 2. The Unity of Agency (Decision Theory & Moral Psychology)
  *   **The Argument:** Formal decision theory (von Neumann-Morgenstern, Ramsey) dictates that for an agent to be rational, their preferences must be complete and transitive. To choose Action A over Action B is to reveal a preference ordering.
  *   **The Defeat:** If the IL and OL conflict, and the agent chooses based on the IL, they have revealed that, *all things considered*, satisfying the IL is preferred to satisfying the OL. This implies a hidden "Meta-Ledger" that ranks the ledgers themselves. If no such meta-ranking exists, the agent is paralyzed (Buridan's Ass); if it does exist, the double-ledger is an illusion masking a single utility function.
  *   **Rank:** **High.** This challenges the psychological and rational possibility of the proposed structure.

  #### 3. The Explanatory Redundancy (Normative Ethics Developments)
  *   **The Argument:** Rule Consequentialism (e.g., Hooker) or Indirect Consequentialism can replicate the *outputs* of the Integrity-Ledger (general adherence to constraints) without the ontological baggage of incommensurable ledgers.
  *   **The Defeat:** If Rule Consequentialism explains why we have constraints (because internalizing them maximizes good) without needing "agent-relative reasons," the IL becomes an explanatorily idle wheel. It posits a metaphysical distinction (integrity vs. outcome) that does no work the consequentialist framework cannot handle via "rules of thumb" or "optimal codes."
  *   **Rank:** **Medium.** This doesn't prove the view false, but renders it theoretically inefficient (violating Occam's Razor).

  #### 4. The Ad Hoc Stipulation (Hidden Consequentialism)
  *   **The Argument:** The distinction between the ledgers appears to be drawn precisely to save the intuitions of deontology rather than derived from a deeper principle.
  *   **The Defeat:** If the content of the IL is determined by asking "what constraints do we want to keep?" (which is often answered by looking at outcomes), the IL is just a consequentialist calculation disguised as a constraint. The "non-fungible conditions" are selected *because* they produce good outcomes overall, making the IL a downstream effect of the OL.
  *   **Rank:** **Medium-Low.** This is a genealogical critique; the view could still be normatively correct even if its motivation is suspect.

  ---

  ### II. Defender Responses: Concede vs. Dismiss

  How would a proponent of the double-ledger view respond to these defeaters?

  | Defeater | What Defenders Should **Concede** | What Defenders Would **Dismiss** |
  | :--- | :--- | :--- |
  | **Threshold Collapse** | **Concede:** Absolute constraints are untenable. Most modern deontologists (e.g., Quinn, Alexander) accept *threshold deontology*. They must admit the IL is not *lexically* infinite. | **Dismiss:** The claim that a threshold *necessarily* implies a single currency. They argue for **lexical priority with a limit**: The IL is absolute *up to* a point, after which the OL takes over. They claim this is a qualitative shift, not a quantitative trade-off. |
  | **Unity of Agency** | **Concede:** That *action* requires unity. | **Dismiss:** The applicability of formal decision theory to morality. They argue rational choice theory describes *instrumental* reason, whereas the IL represents *constitutive* norms of agency that are not subject to preference ordering. |
  | **Explanatory Redundancy** | **Concede:** That outputs may overlap in many cases. | **Dismiss:** The claim that the *reason* doesn't matter. They argue Rule Consequentialism fails to capture the *rights* of the victim (the one being killed). The IL is about the *relation* between agent and victim, not the state of the world. |
  | **Ad Hoc Stipulation** | **Concede:** Nothing (This is too damaging). | **Dismiss:** The accusation of stipulation. They argue the distinction is grounded in the phenomenology of agency (the difference between *doing* and *allowing*). |

  ---

  ### III. The Unfalsifiability Trap: Virtue or Fatal Flaw?

  You ask: *If every counterexample is met by reassigning it to the wrong ledger, is that insulation a virtue or a fatal flaw?*

  **Verdict: It is a Fatal Flaw.**

  In philosophy of science, insulation from counterexample is often a sign of a degenerating research program (Lakatos). In normative ethics, if the "Double-Ledger" view assigns every intuitive failure to the "Outcome-Ledger" (admitting the cost is real) while maintaining the "Integrity-Ledger" constraint was correct, it risks becoming **dogmatic**.

  *   **The Virtue Argument:** A defender might argue this insulation is a virtue because it protects the *inviolability of persons*. If we allow the OL to override the IL too easily, we treat persons as containers of value rather than ends in themselves. The "insulation" is the moral point.
  *   **The Flaw Argument:** However, if the theory cannot specify *when* the OL overrides the IL without referencing the OL's magnitude, it is action-guidingly empty. If the rule is "Follow IL unless the OL is *too high*," and "too high" is defined by the OL, the IL has been subsumed.
  *   **The Unfalsifiability Mechanism:** If a critic says, "Surely you would kill the one to save the world," and the defender says, "Yes, but that is an OL override, not an IL violation," they are playing semantic games. If the IL never actually vetoes the OL in extreme cases, the IL is not a constraint; it is a **tax** on action. A constraint that can be bypassed by sufficient utility is just a high price, not a wall.

  **Assessment:** The view becomes unfalsifiable if it treats the IL as a "trump" that never actually trumps in hard cases, but merely complicates the calculation. To avoid this, the defender must identify cases where the IL *must* hold even against significant OL costs. If they cannot, the two-ledger structure is a fiction for a complex single-ledger view.

  ---

  ### IV. Honest Assessment: Have These Defeaters Already Appeared?

  **Yes. Almost all of these defeaters are established literature.**

  1.  **The Threshold Collapse:** This is the central argument of **Shelly Kagan's *The Limits of Morality***. Kagan argues that any attempt to set a threshold for agent-centered constraints inevitably collapses into consequentialism because the justification for the threshold must be consequentialist.
  2.  **The Unity of Agency:** **Michael Smith** and **David Velleman** have argued that practical reason requires a unified end. If you have two ultimate ends (Integrity and Outcome) that can conflict without a meta-rule, you have a fragmented agency that cannot rationally deliberate.
  3.  **The Redundancy:** **Brad Hooker's *Ideal Code Consequentialism*** is explicitly designed to capture deontological intuitions (the IL) within a consequentialist framework (the OL), arguing that the double-ledger is unnecessary ontology.
  4.  **The Incommensurability Critique:** **Ruth Chang** and **Joseph Raz** have written extensively on incommensurability. While they support the idea that values aren't always comparable, they note that this leads to "hard choices" where reason runs out. If your view claims reason *doesn't* run out (you simply follow the IL), it contradicts the nature of incommensurability.

  **Conclusion:**
  Your double-ledger framing is a robust restatement of **Agent-Centered Deontology**, but it does not dissolve the paradox; it relocates it. The paradox moves from "How do we justify not minimizing harm?" to "How do we justify the interface between the two ledgers?"

  Unless you can provide a non-consequentialist account of *when* the Outcome-Ledger is permitted to override the Integrity-Ledger (the threshold problem), the view collapses into a complex form of consequentialism. If you cannot provide that account, the view is unfalsifiable and action-guidingly inert. The most honest assessment is that **Defeater #1 (Threshold Collapse)** has already appeared in the literature and remains the primary unresolved challenge for any view positing incommensurable moral ledgers.
