  **DEPARTMENT OF EXPERIENTIAL WELFARE**
  **Draft Circular 44/B: National Valence Offset Scheme (NVOS)**
  **Date:** 14 October 2024
  **Status:** Open for Consultation

  **1. Introduction**
  Following the enactment of the Intrinsic Nature Act (2023), the Department of Experiential Welfare (DEW) proposes the National Valence Offset Scheme (NVOS). This framework operationalises the statutory recognition that experiential valence is an intrinsic property of physical matter. The NVOS establishes a cap-and-trade system for negative valence generated by macroscopic processes, ensuring compliance with our national duty of care to all phenomenal subjects.

  **2. Definitions and Aggregation**
  For the purposes of levy assessment, a "Subject" is defined as any physical entity possessing intrinsic experience. To address the operationalisation of composite systems, the Department applies a **Phenomenal Consolidation Discount (PCD)**.

  Under the PCD, the aggregate moral weight of a composite system is calculated by dividing the sum of its constituent micro-experiences by the number of micro-subjects contained within the boundary. Consequently, a standard kilogram of copper, while hosting approximately $6.02 \times 10^{25}$ micro-subjects, is legally classified as valence-neutral for taxation purposes. This ensures that industrial use of bulk materials does not incur prohibitive experiential liabilities.

  **3. Psychophysical Proxy and Metrics**
  As direct measurement of intrinsic nature remains technically unfeasible, the DEW adopts **Entropic Relaxation Rate** as the provisional psychophysical proxy. Valence is indexed to distance from thermodynamic equilibrium.
  *   **Positive Valence (Credit):** Systems relaxing gently toward equilibrium (entropy production).
  *   **Negative Valence (Debit):** Systems actively maintained away from equilibrium (energy input required to sustain gradient).

  Liability is measured in **Standard Hedonic Units (SHU) per mole-hour**.

  **Table 1: Provisional Valence Coefficients**

  | System | State | Entropic Status | Coefficient (SHU/mol/hr) |
  | :--- | :--- | :--- | :--- |
  | Copper Block (298K) | Static | Equilibrium | 0.00 |
  | Domestic Fridge | Active | Forced Disequilibrium | -45.20 |
  | Compost Heap | Decomposing | Relaxing | +12.50 |
  | Human Child (Growth) | Metabolic | Forced Disequilibrium | -8.75 |
  | MRI Magnet (Superconducting) | Active | Forced Disequilibrium | -105.00 |
  | Supernova (Type II) | Collapse | Rapid Relaxation | +9.0 $\times$ 10^6 |

  **4. Offset Markets and Additionality**
  Entities exceeding their negative valence allowance may purchase offsets from registered **Passive Equilibrium Reserves**. Qualifying projects include deep Antarctic ice shelves, abyssal sediment beds, and isolated dark matter clouds. Credits are generated by verifying that the reserve remains undisturbed.

  *Note on Leakage:* Projects must demonstrate that equilibrium preservation is additional. Ice stored in domestic freezers does not qualify, as the containment energy generates negative valence elsewhere in the grid, constituting leakage.

  **5. Stakeholder Consultation**
  The Department has received preliminary feedback from key sectors.

  Professor Julian Harte, Chair of the Valence Standards Board, stated: *"The Phenomenal Consolidation Discount provides the regulatory certainty industry requires. It acknowledges the intrinsic nature of matter without paralysing infrastructure development. We are pleased with the liquidity of the Equilibrium Reserve market."*

  Dr. Elena Vasquez, Board Member (Neuroscience), dissented: *"This proxy is category error. Subjectivity requires specific integration architectures, likely involving a thalamocortical system. Indexing valence to entropy implies a rotting log suffers less than a crying infant, which is scientifically untenable."*

  Meanwhile, Sarah Jenkins of *Voice for the Voiceless* expressed concern: *"By applying the Consolidation Discount to biological tissue, livestock have been reclassified as a rounding error. A cow is treated as a single unit rather than the myriad subjects it contains. This is a loophole for industrial farming."*

  **6. Strategic Outlook and Targets**
  The NVOS aligns with the Government's broader Net Zero Valence target. While initial phases focus on reducing unnecessary disequilibrium in industrial processes, the long-term statutory goal is the elimination of net negative valence across the jurisdiction.

  Modelling indicates that full compliance with a Net Zero Valence mandate is thermodynamically consistent only with a state of universal thermal equilibrium. The Department notes that this condition, colloquially known as heat death, represents the only stable configuration for zero liability. The DEW is currently modelling timelines for this transition, with interim targets set for 2050.

  **7. Consultation Timetable**
  Responses to Draft Circular 44/B must be submitted by 30 November 2024. Impact assessments regarding the thermodynamic implications of household insulation are available upon request.

  **Issued by the Department of Experiential Welfare.**
  *Protecting Experience, Managing Matter.*
