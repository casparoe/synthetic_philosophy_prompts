      *   *Adversary:* Give them a secret instruction card so they don't feel like they are just "being mean."
      *   *Scoring:* Keep it low-stakes. Candy or just bragging rights.
      *   *Move 3:* Ensure the "same letterform" is physically the same piece of paper or a photocopy to prove it hasn't changed.

