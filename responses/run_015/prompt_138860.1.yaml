answer: |-
  # Session Plan: The Life of Letters
  **Topic:** Concepts, Categories, and the *Letter Spirit* Problem
  **Time:** 90 Minutes
  **Students:** 18 (Upper-level Phil/CogSci)
  **Materials:** Gridded worksheets (1cm squares), thick black markers (no fine pens), red pens for scoring, pre-printed "Context Cards" (for Movement 3).

  ---

  ## The Grid & Materials
  **The Worksheet:** A standard letter-sized page divided into six 10x10 square grids. Each grid is an "em-square."
  **The Markers:** Chisel-tip or felt-tip. No pencils. This prevents fussiness and forces commitment to shape over precision.
  **The "Chameleon" Glyph (Movement 3):** A pre-printed card showing a single ambiguous character (a circle with a slight vertical tail that could be an 'a', an 'o', or a 'd').

  ---

  ## Movement 1: The Rule Trap (20 Minutes)
  **Goal:** Demonstrate the failure of necessary and sufficient conditions.

  **Setup:**
  Divide the class into 6 groups of 3. In each group, assign two **Legislators** and one **Adversary**. Give the Adversary a sealed envelope marked *"Do Not Open Until Legislators Finish."*

  **Task:**
  1.  **Legislators (5 mins):** Write a list of explicit geometric/topological rules that define a lowercase 'a'.
      *   *Constraint:* You cannot use perceptual words like "looks like," "curvy," or "standard." You must use terms like "closed loop," "vertical stem," "intersection," "clockwise."
      *   *Example:* "Must contain one fully enclosed counter." "Must have one vertical stroke on the right."
  2.  **Adversary (5 mins):** Open the envelope. The instruction reads: *"Draw a figure on the grid that obeys every rule the Legislators wrote, but is clearly NOT an 'a'. Do not make it a joke drawing (e.g., a face); make it a geometric figure that exploits a loophole."*
  3.  **Judgment (5 mins):** The Adversary reveals the drawing. The group must decide: Did it break a rule, or did the rules fail?
  4.  **Class Share (5 mins):** Each group shows their "Legal Non-'a'."

  **Facilitating the Adversary (Preventing Collapse):**
  *   **The Risk:** Students treat this as a chance to be silly (drawing a cat labeled 'a'). This destroys the philosophical point.
  *   **The Fix:** Frame the Adversary not as a "joker" but as a "smart contract hacker." Tell them: *"You are a computer. You cannot see the image, only read the code. If the code says 'draw a line,' you draw a line through the margin. Your goal is to show that human concepts cannot be fully compiled into code."*
  *   **Instructor Role:** Circulate during the Legislation phase. If a group writes "It must look like an 'a'", cross it out immediately. Force them into geometry. This makes the Adversary's job possible and serious.

  ---

  ## Movement 2: The Style Transfer (30 Minutes)
  **Goal:** Experience family resemblance and the difficulty of defining "style" explicitly.

  **Setup:**
  Rearrange into 9 pairs (Student A and Student B).

  **Task:**
  1.  **The Seed (5 mins):** Student A draws **three** letters in the first three grids: **a, d, g**. They must invent a specific "style" (e.g., extremely wide, or square corners, or heavy bottom weight).
  2.  **The Swap & Extension (10 mins):** Pass the sheet to Student B.
      *   B draws **three** new letters (**m, n, u**) in the *same* style on the next three grids.
      *   B then takes a *fresh* sheet and draws **three** letters (**m, n, u**) in a *slightly off* style (e.g., same shape, but different stroke weight or slant). This is the **Foil**.
      *   B hands *both* sheets back to A.
  3.  **The Detection (5 mins):** Student A now has their original sheet (with B's extensions) and the Foil sheet. A must identify which sheet contains the "true heirs" to their font.
  4.  **Scoring (5 mins):**
      *   **Imitation Point:** If A correctly identifies B's true extension, B gets 1 point (Successful transmission of style).
      *   **Discrimination Point:** If A correctly identifies the true extension, A gets 1 point (Successful recognition of identity).
      *   **Bonus:** If A *fails* (picks the Foil), B gets 2 points (Successful forgery), but A gets 0. *Correction:* To encourage honest communication, award points only for **Match** (A picks True, B gets 1, A gets 1). If A picks Foil, no points. This incentivizes B to make the style *clear*, not just tricky.

  **Why these letters?** 'a, d, g' share a "bowls and stems" structure. 'm, n, u' share "arch" structures. The transfer requires understanding the *relationship* between bowl and arch, not just copying lines.

  ---

  ## Movement 3: The Context Shift (15 Minutes)
  **Goal:** Feel the holism of letter identity (Hofstadter's core thesis).

  **Setup:**
  Return to individual seats. Distribute **Card X** to everyone. It shows the "Chameleon Glyph" (a circle with a tiny, ambiguous tail) completely isolated on a white background.

  **Task:**
  1.  **Vote 1 (2 mins):** "Is this letter an **a** or an **o**?" (Show of hands). Record the split.
  2.  **Distribution (3 mins):** Hand out **Card Y** to half the room and **Card Z** to the other half.
      *   **Card Y:** Shows the *exact same* Chameleon Glyph printed as the first letter in the sequence: **[Glyph] b c d e f**.
      *   **Card Z:** Shows the *exact same* Chameleon Glyph printed as the last letter in the sequence: **m n o p [Glyph]**.
      *   *Note:* The surrounding letters are drawn in a consistent style that forces the interpretation. On Card Y, the 'b' and 'd' have open counters that make the Glyph look like a closed 'a'. On Card Z, the 'o' and 'p' make the Glyph look like an 'o'.
  3.  **Vote 2 (5 mins):** "Now, what letter is the target glyph?" (Show of hands).
  4.  **The Reveal (5 mins):** Ask students to place Card X over the target glyph on Card Y/Z. They will see the ink is identical.

  ---

  ## Debrief: Mapping the Movements (20 Minutes)
  *Do not lecture until the end. Let the frustration of Movement 1 and the surprise of Movement 3 drive the theory.*

  **1. Movement 1 $\rightarrow$ Classical Theory (Necessary & Sufficient Conditions)**
  *   **The Lesson:** You tried to define 'a' using a checklist of features. The Adversary proved that any finite list can be satisfied by a non-'a'.
  *   **Philosophical Map:** This is the failure of the **Classical View** of concepts (Aristotle/Early AI). There are no "atomic" features that guarantee category membership.
  *   **Vividness:** **High.** They *felt* the rules break.

  **2. Movement 2 $\rightarrow$ Prototype/Exemplar Theory (Family Resemblance)**
  *   **The Lesson:** You couldn't write down the rule for the style, but you could recognize it. Identity was transferred via "vibe" or structural relationships (stroke weight, curvature), not explicit metrics.
  *   **Philosophical Map:** This is **Wittgenstein's Family Resemblance** or **Prototype Theory** (Rosch). We recognize the *spirit*, not the letter of the law.
  *   **Vividness:** **Medium.** Some will attribute this to "artistic skill." You must point out that non-artists succeeded too, implying a cognitive capacity for pattern completion, not drawing ability.

  **3. Movement 3 $\rightarrow$ Structuralism / Holism (The Letter Spirit)**
  *   **The Lesson:** The *same* ink changed identity based on its neighbors. The letter 'a' is not a thing; it is a *role* in a system.
  *   **Philosophical Map:** This is **Hofstadter's *Letter Spirit*** and **Structuralism**. Meaning is relational. A concept's identity depends on the conceptual space it inhabits.
  *   **Vividness:** **Low to Medium.** This is the hardest leap. Students often say, "Well, obviously it's an 'a' on the first card because of the alphabet." You must press them: *"If the ink didn't change, what changed? The object didn't change. The category shifted. Therefore, the category is not in the object."* This is the point they will likely need to be *told* rather than having fully discovered it themselves.

  ---

  ## Honest Failure Analysis: What Will Go Wrong

  **1. The "Artist" Problem**
  *   **Risk:** In Movement 2, students with drawing experience will dominate, making the "style" about flourishes rather than structure. Non-artists may feel defeated.
  *   **Mitigation:** Emphasize that *ugly* fonts work best. Encourage "robotic" or "broken" styles. If a student draws a beautiful calligraphic 'a', tell them to draw the next one with their non-dominant hand. The goal is structural consistency, not beauty.

  **2. The Adversarial Collapse**
  *   **Risk:** In Movement 1, the Adversary draws a smiley face and the group laughs, missing the point.
  *   **Mitigation:** As noted in the plan, you must police the "Legislation" phase. If the rules are vague ("looks round"), the Adversary *cannot* do their job. Force rigid geometry ("radius > 2cm"). When the rules are rigid, the Adversary's loophole drawing becomes a serious geometric object, not a joke.

  **3. The Relativist Refusal**
  *   **Risk:** In Movement 3, students refuse to admit the letter changed identity. "It was always an 'a', you just tricked me."
  *   **Mitigation:** This is a feature, not a bug. Use it. Ask: *"If it was always an 'a', why did 40% of you vote 'o' in Vote 1?"* Push the idea that *perception* is constitutive of the category. If perception shifts with context, the category is context-dependent.

  **4. The "Trivial Forgery"**
  *   **Risk:** In Movement 2, Student B makes the Foil too obvious (e.g., draws squares instead of curves).
  *   **Mitigation:** Give a constraint: *"The Foil must use the same basic shapes (lines/curves) but violate the proportions or weight."* This forces the forgery to be subtle, making the detection task a genuine cognitive test of "style" rather than "shape."

  **5. Time Creep**
  *   **Risk:** Movement 2 (Drawing) always takes longer than expected.
  *   **Mitigation:** Hard stop at 30 minutes. If they haven't finished drawing, they judge what is on the page. Incomplete data is better than skipping the debrief. The debrief is where the learning happens; the drawing is just the provocation.

  ---

  ## Instructor's Cheat Sheet for the "Chameleon" (Movement 3)
  *To make Movement 3 work, you need to create the cards beforehand.*
  *   **The Glyph:** Draw a circle. Add a very short vertical stroke on the right side, but do not connect it fully to the top. It should hover between a terminal (on an 'o') and a stem (on an 'a').
  *   **Context Y (The 'a' context):** Draw 'b', 'c', 'd' with *open* counters or specific stress that makes the Glyph's short stroke look like the start of an 'a's upstroke.
  *   **Context Z (The 'o' context):** Draw 'm', 'n', 'p' where the stroke weight matches the circle, and the short stroke aligns with the serifs of the 'n', making it look like a decorative terminal on an 'o'.
  *   **Crucial:** Photocopy the *same* master glyph onto both sheets. Do not redraw it. If you redraw it, students will spot the micro-differences and miss the philosophical point.
