answer: |-
  1. You find caterpillars eating your kale. You must choose a spray.
     A. Use the organic bacteria spray; it keeps synthetic chemicals out of the soil.
     B. Use the synthetic nerve spray; if they must die, let it be instant.
     C. Pick them off by hand; do not spray anything at all.

  2. Someone asks if insects feel pain.
     A. No, they are biological machines; pain requires a brain like ours.
     B. We cannot know for sure, so we should assume they might and act carefully.
     C. We cannot know, so focus on whether they help or harm the garden's balance.

  3. An invasive bug is threatening native plants in the garden border.
     A. Eliminate the invader to protect the native habitat.
     B. Leave them alone; every individual life has equal weight.
     C. Only stop them if they spread to the food crops.

  4. The infestation is severe. You cannot save the crop without killing.
     A. Let the crop fail; killing is not an option.
     B. Save the crop; the food matters more than the pests.
     C. Kill only enough to save half the crop.

  5. A pest is removed, but the population size stays the same due to new births.
     A. This is fine; life continues through the new generation.
     B. This is bad; the specific individual that died is lost forever.
     C. This is bad; reducing the total number of living things is wrong.

  6. Why are these insects considered pests?
     A. They are eating food we claimed for ourselves.
     B. We planted food in a place that was already theirs.
     C. Their numbers have grown too high for the space available.

  7. You must choose between killing one large predator or one hundred small aphids.
     A. Spare the hundred; the total number of deaths matters most.
     B. Spare the one; complex creatures matter more than simple ones.
     C. Kill whichever is causing more damage to the plants.

  8. Slugs are eating your seedlings. You need a bait.
     A. Use organic iron phosphate; it is safer for the soil ecosystem.
     B. Use salt or fast-acting poison; it ends their suffering quickly.
     C. Hand-pick them at night; do not use poison.

  9. The harvest is ready. There are not enough vegetables for everyone.
     A. Harvest everything; we did the work to grow it.
     B. Leave a portion behind; we are sharing space with them.
     C. Leave a portion only if they pollinated the flowers.

  ***

  **Scoring Key**

  To find your position, identify which single question below matches your most strongly held conviction. Your answer to that question defines your primary ethic, even if other answers vary.

  *   **The Humane Interventionist:** You chose **B on Question 1** or **B on Question 8**.
      *   *View:* Manner of death matters a great deal, number of deaths doesn't. You prioritize speed and lack of suffering over organic certification.
  *   **The Insentience Realist:** You chose **A on Question 2**.
      *   *View:* Insects have no morally relevant experience so the question never arises. Management is purely practical.
  *   **The Precautionary Welfarist:** You chose **B on Question 2** AND **B on Question 5**.
      *   *View:* We don't know whether they feel, and the right move is to weight that uncertainty by some small-but-nonzero probability. Minimize harm to individuals.
  *   **The Agnostic Functionalist:** You chose **C on Question 2**.
      *   *View:* We don't know, and the right move is to refuse to speculate and fall back on ecological role. Focus on system health, not individual feelings.
  *   **The Replacement Ethicist:** You chose **A on Question 5**.
      *   *View:* Individual insects matter but are so numerous and so quickly replaced that deaths are offset by births. Population stability is the metric.
  *   **The Negative Utilitarian:** You chose **A on Question 7**.
      *   *View:* Individual insects matter and their sheer numbers swamp every other consideration. Total count of deaths is the only moral math.
  *   **The Ecocentrist:** You chose **A on Question 3**.
      *   *View:* The population or ecosystem is the unit of concern so killing to restore habitat is fine and spraying for cosmetic reasons isn't.
  *   **The Absolutist:** You chose **A on Question 4**.
      *   *View:* Killing is flatly ruled out and the only remaining tools are exclusion, tolerance, and letting crops fail.
  *   **The Relational Host:** You chose **B on Question 6** AND **B on Question 9**.
      *   *View:* They're pests only relative to our property claims, and we built the monoculture that made them abundant, so what's owed is hospitality rather than extermination.

  ***

  **Diagnosis of Logical Space**

  **Empty Cells:**
  1.  **The Insentience Absolutist (Q2-A + Q4-A):** This combination is **incoherent** for most gardeners. If insects feel nothing (Q2-A), there is no moral barrier to killing them; refusing to kill anyway (Q4-A) requires a religious or rule-based constraint not captured by the "no experience" premise. It is theoretically possible (e.g., "killing degrades the human soul"), but practically uncharted in this context.
  2.  **The Relational Ecocentrist (Q6-B + Q3-A):** This combination is **unattractive**. Claiming we invaded their space (Q6-B) usually implies we should tolerate them (Q3-B), whereas killing them to save natives (Q3-A) asserts a hierarchy of value that contradicts the hospitality ethic. Nobody defends the view that "we owe them hospitality" except when they threaten a different bug we like better.
  3.  **The Precautionary Replacementist (Q2-B + Q5-A):** This combination is **uncharted**. If you assume they might feel pain (Q2-B), you typically care about the individual's death (Q5-B). Believing they might suffer but that birth cancels out that suffering is a logical tension nobody has gotten around to resolving comfortably.

  **Inseparable Pairs:**
  1.  **The Precautionary Welfarist and The Absolutist:** These two come out identical on this instrument if the Precautionary Welfarist decides the uncertainty of pain is too high to risk any killing. Question 4 separates them theoretically, but in practice, both will choose "Let crop fail" or "Hand pick" exclusively. The quiz cannot distinguish between "I won't kill because it might hurt" and "I won't kill because killing is wrong."
  2.  **The Agnostic Functionalist and The Ecocentrist:** These two come out identical on this instrument regarding invasive species (Q3) and spray choice (Q1/Q8). Both prioritize the "garden balance" over individual welfare. The quiz cannot distinguish between "I don't know if they feel, so I look at the system" and "I know the system matters more than they do."

  Question 1 does the most sorting work because it forces a direct collision between the established "green" norm (organic) and the "kind" norm (fast death), revealing whether the gardener prioritizes chemical purity or suffering reduction. This single choice eliminates half the available ethical positions immediately, as most frameworks cannot accommodate choosing a slower, more painful death for the sake of soil purity.
