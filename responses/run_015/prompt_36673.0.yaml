answer: |-
  You are not pattern-matching to faces; you are pattern-matching to **functions.** Your intuitions are actually remarkably consistent, even if they feel contradictory on the surface. You aren't judging the *person* or the *tenure*; you are judging the **relationship between expertise and accountability.**

  Here is the principle that reconciles your gut feelings:

  ### The Principle of Stewardship vs. Entrenchment

  We accept career politicians when their expertise acts as a **public utility** (Stewardship). We reject them when their expertise acts as a **private moat** (Entrenchment).

  *   **Stewardship:** The politician uses their tenure to lower the "transaction cost" of government for the citizen. They know the code so *you* don't have to. They grease the wheels so the pothole gets filled. Their career is a tool that serves the public function.
  *   **Entrenchment:** The politician uses their tenure to raise the "barrier to entry" for everyone else. They know the code so *you can't* challenge them. They block the wheels so they can sell the grease (fundraising). Their career is an end in itself.

  Let's run your cases through this filter to see if it holds.

  **1. The City Councilwoman (25 years, knows the code)**
  *   **Verdict:** Stewardship.
  *   **Why:** Municipal politics is largely administrative (trash, zoning, roads). Here, expertise is a public good. She lowers the friction for the community. Her tenure means she can cut through bureaucracy to get things done. You admire her because her career makes the government *work better for you.*

  **2. The Senator (6 terms, fundraising, blocking)**
  *   **Verdict:** Entrenchment.
  *   **Why:** National politics is largely about values and resource allocation. When a career senator focuses on fundraising and obstruction, their expertise is no longer solving problems; it is preserving power. They have raised the barrier to entry for new ideas and new people. Their career makes the government *work better for them.*

  **3. Term Limits (Amateurs vs. Developers' Lawyers)**
  *   **Verdict:** Failed Stewardship.
  *   **Why:** You removed the Stewards (the councilmembers) but didn't remove the Entrenched (the lobbyists/lawyers). The lobbyists have *permanent* expertise; the councilors now have *temporary* expertise. The balance of power shifted from the public stewards to the private entrenched interests. The "transaction cost" for the public went up because their representatives couldn't speak the language of the code anymore.

  **4. Citizens' Assembly (Lottery for Maps)**
  *   **Verdict:** Good Stewardship (via Impartiality).
  *   **Why:** Redistricting is a technical task with a massive conflict of interest for career politicians. A lottery removes the *incentive* to entrench. It's a specific, bounded task (like a jury) where expertise is less valuable than impartiality.

  **5. Citizens' Legislature (Lottery for Laws)**
  *   **Verdict:** Bad Stewardship.
  *   **Why:** Governing requires institutional memory and the ability to negotiate complex trade-offs over time. A random sample lacks the "craft" of politics. More importantly, they lack **accountability.** If a jury gets it wrong, a person goes to jail (a specific consequence). If a legislature gets it wrong, the economy crashes (a diffuse consequence). We need career politicians to take the blame when laws fail. You can't vote out a lottery.

  **6. The 15-Year Prime Minister**
  *   **Verdict:** Entrenchment masquerading as Stewardship.
  *   **Why:** Even with fair elections, 15 years suggests the *state* and the *person* have merged. The barrier to entry for opponents becomes insurmountable not because of law, but because of accumulated advantage (name recognition, donor networks, patronage). It feels unhealthy because it violates the principle of **Renewal.** Stewardship requires knowing when to hand over the keys.

  ***

  ### The Crucial Case: The Brilliant Lifer

  So, to your final question: *A politician who is genuinely brilliant at the job, loves it, and never does anything else with their life — should I admire that person or worry about them?*

  Based on the principle above, the answer depends entirely on **how they view their own obsolescence.**

  **Admire them if:**
  They treat politics as a **craft** (like a master carpenter). Their goal is to build a chair that lasts, not to be the only one allowed to hold the hammer.
  *   **The Test:** Do they mentor successors? Do they codify their knowledge so others can use it? When they leave, does the institution function *better* because of the systems they built?
  *   **The Character Arc:** This is the "Cincinnatus" figure. They love the work, but they love the *Republic* more. Their brilliance is used to lower the barrier for others.

  **Worry about them if:**
  They treat politics as an **identity** (like a monarch). Their goal is to be the hammer.
  *   **The Test:** Do they make themselves indispensable? Is their "brilliance" actually just a deep knowledge of how to block others? If they retired, would the system collapse?
  *   **The Character Arc:** This is the "Caesar" figure. They believe *they* are the system. Their brilliance is used to raise the barrier for others.

  ### For Your Novel

  If you want to create tension in your character's philosophy, give them a moment where they realize **Stewardship can look exactly like Entrenchment from the outside.**

  The Councilwoman (Case 1) and the Senator (Case 2) probably both *think* they are Stewards. The Senator believes that by blocking "bad" legislation, he is protecting the country (Stewardship). The Councilwoman believes that by knowing every loophole, she is helping her constituents (Stewardship).

  The difference isn't their intent; it's the **feedback loop.**
  *   The Councilwoman gets yelled at immediately if the trash isn't picked up. (Tight feedback = Good Careerism).
  *   The Senator gets money immediately if he blocks a bill. (Distorted feedback = Bad Careerism).

  **The Verdict for your character:**
  They should admire the Brilliant Lifer **only if that politician fears their own power.** If the politician loves the job but is terrified of becoming indispensable, they are a Steward. If they love the job and believe only *they* can do it, they are a Tyrant in waiting.

  Your gut isn't confused; it's detecting whether the politician's career is a **bridge** for the public, or a **wall** around the office.
