  ### The Decision Problem: Program Renewal

  You are a policy officer deciding whether to renew a social intervention (**Renew**) or let it expire (**Expire**). The intervention either **Works** ($W$) or **Fails** ($F$). You can commission a evaluation report (the Signal) before deciding.

  **Common Parameters (Both Versions):**
  *   **Priors:** You believe there is a 50% chance the program Works ($P(W)=0.5$).
  *   **Signal:** The evaluation is a realistically imperfect test.
      *   If $W$, it recommends Renew ($S+$) with 90% probability.
      *   If $F$, it recommends Renew ($S+$) with 10% probability.
  *   **Belief Update:**
      *   If $S+$, posterior $P(W|S+) = 0.9$ (Near certainty it works).
      *   If $S-$, posterior $P(W|S-) = 0.1$ (Near certainty it fails).
      *   *Note:* In both versions, the signal moves your credence drastically from even odds (0.5) to near-certainty (0.9 or 0.1).
  *   **Payoffs (Utility):**
      *   Renew & Works: **+100** (Social benefit).
      *   Renew & Fails: **-100** (Wasted resources).
      *   Expire (Status Quo): **+10** (Safe baseline).

  ---

  ### Version 1: The Learning Mandate (Zero Value)

  **Structural Feature:** **Decision Authority.**
  In this version, your office is commissioned only to **monitor** the program. You lack the authority to terminate or renew based on this specific evaluation; the renewal decision is statutorily locked to the **Status Quo** for this budget cycle regardless of findings. Your only available action is **Expire** (maintain status quo).

  **Calculations:**
  1.  **Without Signal:**
      *   Available Action: {Expire}.
      *   Expected Utility (EU): **+10**.
  2.  **With Signal:**
      *   You receive $S+$ (90% belief) or $S-$ (10% belief).
      *   Available Action: {Expire} (Authority restricted).
      *   EU conditional on $S+$: **+10**.
      *   EU conditional on $S-$: **+10**.
      *   Expected EU with Signal: $0.5(10) + 0.5(10) = $ **+10**.
  3.  **Value of Information:** $10 - 10 =$ **0**.

  *Verdict:* The signal transforms your belief (0.5 $\to$ 0.9), but since you cannot act on it, the expected utility remains identical. The report is decision-worthless.

  ---

  ### Version 2: The Procurement Mandate (Positive Value)

  **Structural Feature:** **Decision Authority.**
  In this version, your office is commissioned to **decide** on renewal. You have full discretion to choose **Renew** or **Expire** based on the evidence.

  **Calculations:**
  1.  **Without Signal:**
      *   EU(Renew) = $0.5(100) + 0.5(-100) = 0$.
      *   EU(Expire) = **10**.
      *   Optimal Action: **Expire**. Max EU = **10**.
  2.  **With Signal:**
      *   **If $S+$ (50% chance):** Posterior $P(W)=0.9$.
          *   EU(Renew) = $0.9(100) + 0.1(-100) = 80$.
          *   EU(Expire) = 10.
          *   Optimal Action: **Renew** (EU 80).
      *   **If $S-$ (50% chance):** Posterior $P(W)=0.1$.
          *   EU(Renew) = $0.1(100) + 0.9(-100) = -80$.
          *   EU(Expire) = 10.
          *   Optimal Action: **Expire** (EU 10).
      *   Expected EU with Signal: $0.5(80) + 0.5(10) = $ **45**.
  3.  **Value of Information:** $45 - 10 =$ **+35**.

  *Verdict:* The signal transforms your belief (0.5 $\to$ 0.9) *and* crosses the decision threshold, changing the optimal action. The report has substantial value.

  ---

  ### The Feature and the Defense

  **The Feature:** **Decision Authority (Action Space).**
  The two versions differ only in whether the agent is structurally permitted to switch actions based on the signal. In Version 1, the action set is constrained to a singleton {Expire}; in Version 2, it is {Renew, Expire}. The priors, likelihoods, and outcome utilities are identical.

  **What happens without it?**
  Without the authority to act (Version 1), the second version collapses into the first. No matter how informative the signal or how high the stakes, if the decision rule is structurally decoupled from the information (e.g., a "rubber stamp" commission), the Expected Value of Information (EVI) is zero. Good's Theorem holds as an equality because the information never changes the optimal choice.

  **Defense of the Worthless Signal (Version 1):**
  A policy staffer might argue: *"Even if we can't act now, this knowledge has **epistemic value**. It updates our internal model of the world, helping us design better programs later. It also provides **accountability**; stakeholders deserve to know if the money was wasted, regardless of our power to stop it."*

  **Reply:**
  Epistemic value is real, but it is not **decision value**. Policy budgets are constrained by opportunity costs. Spending \$50,000 on a report that cannot alter the allocation of \$1,000,000 is a net loss to the organization, even if it satisfies curiosity or compliance. "Knowledge for its own sake" is a luxury good; in public policy, information is an instrument for action. If the instrument cannot touch the lever, it is scrap metal. Accountability can often be achieved through cheaper auditing mechanisms that do not require full Bayesian evaluation studies.

  ---

  ### Version 3: Can Information Have Negative Value?

  **Is a third version available?**
  **No.** Under the standard assumptions of Good's Theorem, free information cannot have strictly negative expected value for a rational agent.

  **Which assumption must be given up?**
  To construct a case where free information hurts expected utility, you must concede **Consequentialism** (the assumption that utility depends *only* on states and actions, not on the information itself).

  **What conceding it costs:**
  You must admit that the agent suffers **Information Aversion** (e.g., anxiety, loss of hope, or paralysis induced by knowing). For example, if receiving a "Fails" signal causes the agent such distress that their utility drops by 50 points regardless of the action taken, the net value becomes negative.
  *Cost:* This concedes that the agent is not a standard expected-utility maximizer. It moves the model from **normative decision theory** (how a rational commission *should* behave) to **behavioral psychology** (how a stressed human *does* behave). For policy staff, this means acknowledging that "rational commissioning" assumes the organization can handle the truth without dysfunctional reaction. If the report might cause panic that degrades performance, the "negative value" comes from the organizational pathology, not the information itself.
