  1.  **Analyze the Request:**
      *   **Goal:** Write a full specification of desiderata for a theory of moral responsibility that can survive Galen Strawson's "Basic Argument."
      *   **Constraint 1:** Build the standard *before* scoring contenders.
      *   **Constraint 2:** For each desideratum, state the precise phenomenon/case (e.g., halting regress, sourcehood vs. desert, determinism/indeterminism, psychological continuity, self-origination).
      *   **Constraint 3:** Provide the non-negotiable consideration behind each (why it's essential, not just a preference).
      *   **Constraint 4:** Flag pairs of desiderata suspected to be jointly unsatisfiable given Strawson's reasoning (specifically the regress vs. self-origination tension).
      *   **Constraint 5:** Include a specific stress-test requirement: "Diachronic Normative Integration in Branching Form" (non-linear, branching structure of mental states/commitments).
      *   **Constraint 6:** Briefly indicate how Compatibilism, Libertarianism, and Strawsonian Impossibilism/Revisionism fare against the list (focus on exclusionary work, not a full scorecard).
      *   **Tone:** Philosophical, rigorous, analytical.

  2.  **Deconstruct Strawson's Basic Argument:**
      *   *Premise 1:* To be truly morally responsible for an action, one must be truly responsible for the way one is (at least in certain mental respects).
      *   *Premise 2:* One cannot be truly responsible for the way one is (because that would require prior choices, which require prior nature, ad infinitum).
      *   *Conclusion:* True moral responsibility is impossible.
      *   *Core Tension:* The requirement for *ultimate origination* (causa sui) vs. the impossibility of self-creation ex nihilo.

  3.  **Drafting the Desiderata (The "Standard"):**
      *   *Desideratum 1: The Regress Halting Condition.* Must explain how the chain of justification for responsibility stops without arbitrary cutoff.
          *   *Case:* The infinite regress of self-formation.
          *   *Consideration:* If the chain never stops, responsibility is never grounded. If it stops arbitrarily, it's luck.
      *   *Desideratum 2: The Sourcehood/Desert Distinction.* Must distinguish mere causal sourcehood from normative desert.
          *   *Case:* Manipulation cases (e.g., Plum in Mele's series).
          *   *Consideration:* Being a cause isn't enough for blame; one must *own* the cause.
      *   *Desideratum 3: The Modal Stability Condition.* Must work under both deterministic and indeterministic assumptions (or explain why one is required).
          *   *Case:* Luck objection (indeterminism) vs. Manipulation objection (determinism).
          *   *Consideration:* Responsibility shouldn't vanish simply because physics is deterministic, nor should it appear simply because physics is random.
      *   *Desideratum 4: Diachronic Psychological Continuity.* Must account for identity over time despite changes.
          *   *Case:* Radical transformation (e.g., repentance, brainwashing, dementia).
          *   *Consideration:* We hold people responsible for past actions even if they've changed, but not if the change was too radical.
      *   *Desideratum 5: The Self-Origination Requirement.* Must explain how an agent generates mental states that are genuinely *theirs* in a strong sense.
          *   *Case:* The "Causa Sui" challenge.
          *   *Consideration:* Without this, the agent is just a conduit for prior causes (genes, environment).
      *   *Desideratum 6 (Stress Test): Diachronic Normative Integration in Branching Form.*
          *   *Case:* Non-linear development of character (feedback loops, conflicting commitments shaping each other).
          *   *Consideration:* Human psychology isn't a linear chain; it's a web. A theory relying on linear ancestry fails here.

  4.  **Identifying Joint Unsatisfiability (The "Flag"):**
      *   *Conflict:* Desideratum 1 (Regress Halting) vs. Desideratum 5 (Self-Origination).
      *   *Reasoning:* Strawson argues you can't stop the regress *and* maintain ultimate origination. To stop the regress, you must accept a "given" nature (luck). To maintain origination, you need infinite prior choices (impossible).

  5.  **Drafting the Evaluation (The "Scorecard"):**
      *   *Compatibilism:* Fails Desideratum 5 (Self-Origination). Accepts "given" nature. Saves responsibility by lowering the bar (Desert vs. Sourcehood).
      *   *Libertarianism:* Fails Desideratum 1 (Regress Halting) and often Desideratum 3 (Modal Stability/Luck). Tries to save Origination but falls into the regress or luck.
      *   *Strawsonian Impossibilism/Revisionism:* Accepts the failure. Revises the concept of responsibility (Desideratum 2) to fit human practices rather than metaphysical ideals.

  6.  **Refining and Polishing:**
      *   *Check:* Did I include the branching form constraint explicitly? Yes.
      *   *Check:* Is the tone appropriate? Needs to be formal and precise.
      *   *Check:* Did I flag the unsatisfiable pair? Yes, the Regress/Origination tension.
      *   *Check:* Is the focus on the criteria? Yes, the evaluation section should be brief.

  7.  **Self-Correction/Nuance during drafting:**
      *   *Initial thought:* Maybe list "Free Will" as a desideratum.
      *   *Correction:* No, the prompt asks for desiderata for *moral responsibility*. Free will is the mechanism, responsibility is the status. Keep the focus on responsibility conditions.
      *   *Refining the Branching Constraint:* Make sure it sounds like a genuine metaphysical/psychological constraint, not just "people are complex." It needs to challenge linear tracing theories.
      *   *Refining the Unsatisfiable Flag:* Be explicit that Strawson's argument *is* the proof of this tension.

  8.  **Final Review against Prompt:**
      *   Full specification of desiderata? Yes.
      *   Precise phenomenon/case for each? Yes.
      *   Non-negotiable consideration? Yes.
      *   Flag jointly unsatisfiable pairs? Yes.
      *   Include branching form stress-test? Yes.
      *   Brief indication of how theories fare? Yes.
      *   Weight on criteria? Yes.

  9.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output).

