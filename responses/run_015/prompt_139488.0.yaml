      *My take:* It's an insight. The philosopher says "The theory is epistemically bankrupt." The film says "The *attitude* derived from that theory is ethically bankrupt, but we can reject the attitude without rejecting the ontology." It separates *ontology* (multiverse exists) from *normativity* (nihilism follows). This is a vital distinction for students.

