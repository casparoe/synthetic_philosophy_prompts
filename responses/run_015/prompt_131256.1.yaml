answer: |-
  You and your friend have hit the exact nerve that keeps philosophers of mind up at night. You aren't arguing past each other; you are standing on opposite sides of the same crack in the foundation.

  Here is the gut intuition of why this is still unsolved, stripped of the jargon.

  **The Victory of Multiple Realizability**
  First, acknowledge why you felt right initially. Multiple realizability (MR) was the escape hatch from "brain chauvinism." Before functionalism, if you wanted to say an alien or an AI could think, you had to prove their wetware was basically like ours. That felt wrong. It felt like saying "only things made of carbon can burn," when clearly, if the *structure* of combustion is there, the material shouldn't matter.

  MR said: Mental states aren't *stuff*; they are *jobs*. If something does the job of "believing Paris is the capital," it has the belief. This saved us from biological racism and allowed for AI. That was the win.

  **The Trap of Trivial Realization**
  Your friend's counter-argument is the "Rock Problem." It goes like this: If a mental state is just an abstract pattern of inputs and outputs (a "computation"), then *anything* can be mapped to that pattern if you try hard enough.

  Imagine a rock sitting on a hill. Over the course of a day, the temperature of the rock changes, shadows move across it, and atoms vibrate. If I am clever enough, I can draw a map where "atom vibrating at 12:01" = "State A" and "shadow hitting crack at 12:02" = "State B." I can map the rock's physical changes to *any* computer program I want.

  If functionalism says "realization doesn't matter, only the pattern matters," then the rock is running Windows. It is calculating pi. It is in pain.

  This is the disaster your friend is pointing out. If everything realizes every function, then functionalism implies panpsychism (everything is conscious). Worse, it makes the theory unfalsifiable. If you can't point to a physical system and say, "That definitely *isn't* thinking," then you aren't doing science; you're doing mysticism.

  **The Conceptual Knot: Maps vs. Engines**
  So, where is the break? It comes down to the difference between a **map** and an **engine**.

  Your version of functionalism treats the mind like a *map*. A map is abstract. You can draw the map of London on paper, on a screen, or in the sand. The material doesn't matter.

  Your friend is pointing out that a mind isn't a map; it's an *engine*. An engine doesn't just *look* like it turns wheels; it actually *has the power* to turn wheels.

  The problem is that standard functionalism got so obsessed with escaping brain-identity theory that it defined "function" too loosely. It treated causal roles as mathematical relationships rather than physical powers.
  *   **Mathematical relationship:** If X happens, Y follows. (A rock can fit this if you squint).
  *   **Physical power:** If X *were to* happen, Y *would have to* happen because of the physical glue holding the system together.

  **Why the "Fix" is Also Broken**
  The standard attempt to fix this is to appeal to **counterfactuals**. You say: "The rock isn't thinking because if I had poked it differently, it wouldn't have changed state in the corresponding way. A real mind *would* have reacted."

  This sounds good, but it smuggles the problem back in. To say the rock *wouldn't* have reacted, you have to define what counts as a "poke" and what counts as a "reaction."
  *   If you define "poke" broadly (e.g., hitting it with a cosmic ray), the rock *does* change states.
  *   If you define "reaction" broadly (e.g., a single atom shifting), the rock *does* react.

  To stop the rock from counting as a mind, you have to draw a boundary around the system and say, "Only *these* physical interactions count as causal." But the moment you start picking and choosing which physical interactions count, you are sneaking "biological chauvinism" in through the back door. You are essentially saying, "It has to be causal in the way *we* think is real," which often boils down to "It has to be like a brain."

  **The Verdict on Your Dispute**
  You asked if the problem is with the *definition of function* or the idea that *realization doesn't matter*.

  The gut intuition is this: **The problem is the idea that realization doesn't matter *at all*.**

  That was the overcorrection. Realization *does* matter. Not the specific material (silicon vs. neuron), but the **causal density**. A system needs to be physically structured so that its states are *robustly* connected, not just accidentally correlated like the shadow on the rock.

  However, we currently lack the vocabulary to define "robust causal connection" without referencing biology.
  *   If we define it too loosely, the rock thinks (Panpsychism).
  *   If we define it too strictly, only brains think (Identity Theory).

  **Why it remains unsolved**
  The reason you and your friend are at an impasse is that functionalism is trying to be two incompatible things at once:
  1.  **Abstract enough** to allow AI and aliens (Multiple Realizability).
  2.  **Concrete enough** to exclude rocks and bathtubs (No Trivial Realization).

  Every time you tighten the net to catch the rocks, you accidentally catch the aliens. Every time you loosen the net to let the aliens through, the rocks slip in.

  Until we can explain what makes a physical system "carry" information genuinely rather than accidentally—without just pointing at neurons and saying "like this"—functionalism remains in this limbo. Your friend is right that the current definition opens the door to absurdity. You are right that slamming the door shuts out the possibility of AI minds. The unsolved work is building a doorframe that distinguishes the two without cheating.
