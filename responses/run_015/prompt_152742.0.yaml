answer: |-
  ### Core Tensions: A Brief Brainstorm

  Before specifying desiderata, we must acknowledge the structural friction inherent in extrapolating volition across epistemic states. The primary tension lies between **Identity Preservation** and **Error Correction**. If we extrapolate too little, we lock in false beliefs and framing errors; if we extrapolate too much, we drift into a "idealized agent" that the original subject would not recognize as themselves.

  A secondary tension exists between **Unification** and **Pluralism**. Rationalist frameworks often seek a single utility function to maximize, but human (and agent) value structures may be genuinely modular, context-dependent, or incommensurable. Forcing a single scalar representation risks "Procrustean aggregation," where nuance is lost to mathematical convenience.

  Finally, there is the **Authority Problem**: When the extrapolated self conflicts with the actual self, which has veto power? If the extrapolated self says "you were wrong to want X," but the actual self says "I reject your correction," the extrapolation procedure has failed to align with the agent's volition.

  ---

  ### Desiderata for Coherent Extrapolated Volition (CEV)

  #### I. Cases the Theory Must Get Right

  **1. Epistemic Counterfactual Stability**
  *   **Requirement:** Preferences that reverse solely due to the acquisition of true information must be corrected; preferences that reverse due to ontological shifts unrelated to truth must be flagged as value drift.
  *   **Motivating Case:** An agent refuses a medicine believing it is poison (false belief) vs. an agent refuses a medicine because they value natural death over extended life (value). The theory must correct the former but respect the latter, even if both look like "preference reversals" under full information.
  *   **Negotiability:** Non-negotiable. Failure here renders the alignment hostile.

  **2. Incommensurability Preservation**
  *   **Requirement:** The theory must not force a trade-off rate between value dimensions that the agent treats as lexically ordered or distinct categories.
  *   **Motivating Case:** An agent values "Justice" and "Happiness." They may refuse to trade any amount of Happiness for a specific violation of Justice. A weighted sum utility function falsely implies a price exists.
  *   **Negotiability:** Non-negotiable for agents with non-consequentialist structures.

  **3. Modal Cluster Resolution**
  *   **Requirement:** When an agent holds divergent preference structures in different possible worlds (modal clusters) due to framing rather than taste, the theory must identify the invariant core rather than averaging the clusters.
  *   **Motivating Case:** An agent prefers Policy A in World 1 (framed as "saving lives") and Policy B in World 2 (framed as "killing patients"), though the outcomes are identical. The theory must resolve this to the invariant preference, not average A and B.
  *   **Negotiability:** Non-negotiable.

  #### II. Distinctions to Preserve

  **4. Revealed vs. Endorsed vs. All-Things-Considered**
  *   **Requirement:** The theory must distinguish between what the agent *does* (revealed), what the agent *says they want to want* (endorsed), and what the agent *would choose under full coherence* (volition).
  *   **Motivating Case:** An addict reveals a preference for drugs, endorses a preference for health, but under full volitional coherence might prioritize health. Collapsing these distinctions leads to either paternalism (ignoring revealed) or enablement (ignoring endorsed).
  *   **Negotiability:** Non-negotiable.

  **5. Learning vs. Manipulation**
  *   **Requirement:** Preference changes resulting from logical deduction or empirical learning must be treated differently from changes resulting from framing effects or rhetorical manipulation.
  *   **Motivating Case:** An agent changes their mind after reading a proof (learning) vs. after seeing the options presented in a different order (framing). The former is valid extrapolation; the latter is noise.
  *   **Negotiability:** Non-negotiable.

  **6. Null Preference vs. Indifference**
  *   **Requirement:** The theory must distinguish between "I have no preference between A and B" (indifference) and "I have not formed a preference between A and B" (null).
  *   **Motivating Case:** Extrapolating a null preference should not result in a random assignment or indifference; it should result in a request for further reflection or a preservation of the status quo.
  *   **Negotiability:** Camp-specific (some formalisms treat null as indifference for mathematical closure).

  #### III. Puzzles to Dissolve

  **7. The Reflection Rejection Problem**
  *   **Requirement:** If the agent, upon seeing the extrapolated profile, rejects it as "not me," the theory must account for this rejection without infinite regress.
  *   **Motivating Case:** An agent extrapolates to a utilitarian ideal, but their actual self says, "I refuse to be that cold." A valid CEV theory must either incorporate that refusal or explain why the refusal is an error to be corrected.
  *   **Negotiability:** Non-negotiable.

  **8. The Procrustean Utility Problem**
  *   **Requirement:** The theory must explain how to act without a single scalar utility function if the agent's values are genuinely plural.
  *   **Motivating Case:** If values are incommensurable, maximizing "expected utility" is ill-defined. The theory must offer a decision rule (e.g., satisficing, veto power) that respects plurality.
  *   **Negotiability:** Camp-specific (Consequentialists demand a scalar; Pluralists do not).

  **9. The Boundary Condition (No Solution)**
  *   **Requirement:** The theory must specify conditions under which it returns "no coherent volition exists" rather than manufacturing an aggregation.
  *   **Motivating Case:** An agent's values are fundamentally contradictory (e.g., "Maximize X" and "Minimize X" with no higher ordering). Forcing a solution creates an adversarial agent.
  *   **Negotiability:** Non-negotiable for safety.

  #### IV. Consistency Conditions

  **10. Transitivity Across Worlds**
  *   **Requirement:** Transitivity must hold within a modal cluster, but may be relaxed across clusters if the ontology shifts.
  *   **Motivating Case:** If World A and World B operate on different physical or moral ontologies, demanding A > B > C > A consistency may be category error.
  *   **Negotiability:** Camp-specific (Strict rationalists demand global transitivity).

  **11. Completeness Over Modal Clusters**
  *   **Requirement:** The extrapolated profile need not be complete (i.e., it need not rank every possible pair of outcomes) if the agent's reflection yields genuine uncertainty.
  *   **Motivating Case:** Forcing a ranking where the agent sees none creates false precision.
  *   **Negotiability:** Camp-specific.

  #### V. Jointly Unsatisfiable Pairs

  *   **Pair A:** *Guaranteed Convergence* (The theory always outputs a single utility function) **vs.** *Respect for Pluralism* (The theory acknowledges incommensurable values).
      *   **Reasoning:** You cannot guarantee a single scalar output for genuinely plural values without violating the preservation of incommensurability.
  *   **Pair B:** *Authority of the Actual Self* (The actual agent can veto the extrapolation) **vs.** *Error Correction* (The extrapolation corrects the actual agent's false beliefs).
      *   **Reasoning:** If the actual self's veto is based on a false belief, respecting the veto prevents error correction. Respecting error correction overrides the veto.

  ---

  ### Scoring of Candidate Frameworks

  | Desideratum | Standard CEV (Yudkowsky) | Reflective Equilibrium (Idealization) | Direct Preference-Utilitarian Aggregation |
  | :--- | :--- | :--- | :--- |
  | **1. Epistemic Stability** | **Pass.** Explicitly designed to correct false beliefs. | **Pass.** Idealization implies full information. | **Fail.** Treats revealed preference as sovereign, regardless of belief state. |
  | **2. Incommensurability** | **Fail.** Assumes convergence to a coherent utility function. | **Pass.** Allows for unresolved tensions in equilibrium. | **Fail.** Requires weighted sum for aggregation. |
  | **3. Modal Resolution** | **Mixed.** Relies on "what we would want" but lacks formal framing invariance. | **Pass.** Specifically targets framing inconsistencies. | **Fail.** Aggregates revealed choices, susceptible to framing. |
  | **4. Distinctions (Revealed/Endorsed)** | **Pass.** Distinguishes "want" from "want to want." | **Pass.** Central to the method. | **Fail.** Collapses to revealed preference. |
  | **5. Learning vs. Manipulation** | **Mixed.** Informal distinction; hard to formalize. | **Pass.** Philosophical core distinguishes rational from causal shifts. | **Fail.** Indifferent to source of preference. |
  | **6. Null vs. Indifference** | **Fail.** Often treats undefined as indifferent for optimization. | **Pass.** Can sustain suspension of judgment. | **Fail.** Requires complete ordering for maximization. |
  | **7. Reflection Rejection** | **Fail.** Risks infinite regress if "what we want" rejects the extrapolation. | **Pass.** Equilibrium implies no rejection upon reflection. | **Fail.** Ignores reflection; focuses on current state. |
  | **8. Procrustean Utility** | **Fail.** Assumes a single coherent volition exists. | **Pass.** Can output a set of principles rather than a function. | **Fail.** Requires single utility metric. |
  | **9. Boundary Condition** | **Fail.** Optimistic assumption that coherence exists. | **Pass.** Can conclude no equilibrium is reachable. | **Fail.** Always produces an ordering (e.g., via tie-breaking). |
  | **10. Transitivity** | **Pass.** Demands global coherence. | **Mixed.** Local coherence prioritized. | **Pass.** Axiomatic requirement. |
  | **11. Completeness** | **Fail.** Assumes completeness for action. | **Pass.** Accepts partial ordering. | **Fail.** Axiomatic requirement. |

  ### Analysis of Exclusionary Requirements

  **The Single Most Exclusionary Requirement:**
  **#9 The Boundary Condition (No Manufactured Coherence).**
  This requirement does the most work in excluding candidates because almost all operational decision theories are *completion* engines—they are designed to take partial or conflicting inputs and output a definitive choice rule. Standard CEV and Direct Aggregation both presuppose that a coherent solution *exists* and must be found. Only a Reflective Equilibrium model comfortably accommodates the possibility that the process terminates with "no stable solution."

  **Impact of Jointly Unsatisfiable Pairs:**
  *   **Pair A (Convergence vs. Pluralism):** This knocks out **Standard CEV** and **Direct Aggregation**. Both frameworks are teleologically aimed at producing a single utility function or coherent volition vector. If the agent's values are genuinely incommensurable, these frameworks violate Desideratum #2 (Incommensurability Preservation) to satisfy their own structural goals. **Reflective Equilibrium** survives this because it does not demand a scalar output.
  *   **Pair B (Authority vs. Error Correction):** This creates a critical vulnerability for **Reflective Equilibrium**. If the "equilibrium" is reached by correcting beliefs the agent refuses to accept as corrected, the theory risks violating the Authority of the Actual Self. However, since Reflective Equilibrium defines the "self" as the idealized reflector, it dissolves this tension by redefining authority, whereas Standard CEV struggles more visibly with the "but I don't want to be that" objection.

  **Conclusion:**
  Standard CEV and Direct Aggregation fail primarily on the **Pluralism** and **Boundary** constraints—they are too eager to resolve conflict into a single function. Reflective Equilibrium scores highest on philosophical coherence but lacks the algorithmic specificity required for implementation, failing the operationalization implied by "decision theory" unless augmented with a procedural mechanism for handling non-convergence.
