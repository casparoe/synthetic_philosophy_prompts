prompt: |-
  I'm taking this intro indian philosophy course and next week I have to run a study session for my section on Nyāya epistemology, specifically the four pramāṇas. I don't want to just dump pratyakṣa, anumāna, upamāna and śabda in order like some encyclopedia entry. Can you plan the explainer for me? What order do they actually have to come in so the dependencies are clear — like why you can't understand upamāna without knowing what anumāna already does? What's the single concrete scenario that should carry the whole thing? I'm thinking something like identifying whether a wild mushrom is poisonous using sight, inference from similar ones, comparison to a known sample, and then being told by a local forager — but tell me if that example has problems and what it needs to have and lack. Also what misconceptions should I expect — probably people will think śabda is just blind authoraty bias, or that upamāna is exactly the same as western analogical reasoning — and exactly where in the sequence should I head each one off? I need a check question at the end that shows whether they got the structural point about why Nyāya insists on four ireducible sources rather than collapsing them. And tell me what I should openly leave out at this level — maybe the Navya-Nyāya revisions? — and say so. Oh, and no reading lists or sutra citations please, I wouldn't be able to check them and neither can anyone here.
reasoning: |-
  Here's a thinking process that leads to the suggested study session plan:

  1.  **Analyze the Request:**
      *   **Topic:** Nyāya Epistemology (specifically the four *pramāṇas*: *pratyakṣa, anumāna, upamāna, śabda*).
      *   **Goal:** Run a study session for an intro Indian philosophy course.
      *   **Constraint 1 (Structure):** Do not just list them encyclopedia-style. Need a logical order showing dependencies (e.g., why *upamāna* needs *anumāna*).
      *   **Constraint 2 (Example):** Use a single concrete scenario to carry the whole explanation. User suggests "identifying a wild mushroom." I need to evaluate and refine this.
      *   **Constraint 3 (Misconceptions):** Address specific misconceptions (*śabda* as blind authority, *upamāna* as Western analogy) and specify *when* to address them.
      *   **Constraint 4 (Assessment):** Provide a check question at the end testing the structural point (why four irreducible sources?).
      *   **Constraint 5 (Scope):** Specify what to leave out (e.g., Navya-Nyāya).
      *   **Constraint 6 (Formatting):** No reading lists or sutra citations.

  2.  **Evaluate the "Mushroom" Scenario:**
      *   *Pros:* Relatable, involves safety (epistemic stakes), involves sensory data, inference, comparison, and testimony.
      *   *Cons/Nyāya Nuances:*
          *   *Upamāna* (comparison) in Nyāya is specifically about knowing the *relation between a name and a thing* based on similarity. It's not just "this looks like that." It's "I know what a 'gavaya' looks like from a description, then I see one in the forest and know 'this is a gavaya'." The mushroom example needs to capture the *naming/description* aspect, not just visual similarity.
          *   *Śabda* (testimony) needs to be reliable (*āpta*), not just anyone talking. A "local forager" works if established as expert.
          *   *Anumāna* (inference) needs a universal connection (*vyāpti*). "This mushroom is like that poisonous one" is often *upamāna* territory in Nyāya, whereas "This mushroom has spots, all spotted mushrooms are poisonous, therefore this is poisonous" is *anumāna*. The distinction needs to be sharp.
      *   *Refinement:* The scenario needs to distinguish between *recognizing a kind by name* (Upamāna) vs. *inferring a property by rule* (Anumāna). Let's tweak the mushroom scenario to ensure *Upamāna* is about learning the name/identity of a new species based on a description, and *Anumāna* is about inferring edibility based on signs.

  3.  **Determine the Logical Order (Dependencies):**
      *   Standard Nyāya order: *Pratyakṣa* (Perception) $\rightarrow$ *Anumāna* (Inference) $\rightarrow$ *Upamāna* (Comparison) $\rightarrow$ *Śabda* (Testimony).
      *   *Why?*
          *   Perception is foundational (direct contact).
          *   Inference depends on perception (you need to see the smoke to infer fire).
          *   Comparison (*Upamāna*) often depends on inference and perception (you perceive the similarity, but the knowledge gained is the name-relation). Actually, Nyāya argues *Upamāna* is irreducible. But pedagogically, it's easier to explain after Perception and Inference because it bridges known and unknown.
          *   Testimony (*Śabda*) is often seen as dependent on the others for verification, but Nyāya treats it as independent. However, to understand *why* it's a separate *pramāṇa*, you need to see where the others fail (e.g., you can't perceive or infer the meaning of a word just by looking at the object).
      *   *Decision:* Stick to the traditional order but emphasize the *epistemic gap* each fills.
      *   *Correction on User's Premise:* The user asks "why you can't understand *upamāna* without knowing what *anumāna* already does." Actually, Nyāya defends *Upamāna* precisely because it *isn't* *Anumāna*. So the session needs to show why *Anumāna* fails to do *Upamāna's* job. The order should be: Perception (Base) $\rightarrow$ Inference (Extension) $\rightarrow$ Comparison (Naming/Similarity bridge) $\rightarrow$ Testimony (Linguistic transmission).

  4.  **Drafting the Session Plan:**

      *   **Intro:** Set the stakes. Knowledge isn't just "true belief"; it needs a specific *origin story*.
      *   **The Scenario:** Refine the mushroom one. Let's call the mushroom the "Devil's Cap."
      *   **Step 1: Pratyakṣa (Perception).** Direct contact. Seeing the red cap. Limit: Can't see toxicity.
      *   **Step 2: Anumāna (Inference).** Universal relation. "All red caps are poisonous." I see red cap $\rightarrow$ infer poison. *Misconception Check:* Distinguish from guesswork. Needs *vyāpti* (invariable connection).
      *   **Step 3: Upamāna (Comparison).** This is the tricky one. It's about *name recognition*. Scenario: A friend describes a "Devil's Cap" (white stem, red top). Later you see one in the woods. You know "This is what they meant." It's not inference because you aren't inferring a property; you are connecting a word to an object via similarity. *Misconception Check:* It's not just "analogy." It's knowledge of the *relation between word and object*.
      *   **Step 4: Śabda (Testimony).** Reliable word. The expert says "Eat this." You don't see the chemistry, you don't infer it. You know it because the *source* is reliable. *Misconception Check:* Not blind faith. Requires establishing the speaker as *āpta* (competent/truthful).
      *   **The "Why Four?" Check Question:** Needs to force them to see that reducing one to another loses information or explanatory power.

  5.  **Refining Misconceptions & Timing:**
      *   *Śabda as Authority:* Address this during the *Śabda* section. Emphasize the *conditions* of reliability.
      *   *Upamāna as Analogy:* Address this during *Upamāna*. Contrast "A is like B" (Analogy) with "This object is the referent of that word" (Nyāya *Upamāna*).
      *   *Dependencies:* Make sure to highlight that *Anumāna* relies on *Pratyakṣa* (seeing the smoke), but *Upamāna* relies on a prior description (often *Śabda*?). Wait, Nyāya says *Upamāna* is independent. I need to be careful not to collapse them. The dependency is pedagogical, not necessarily ontological in Nyāya. I will frame it as "building complexity."

  6.  **Refining the "What to Leave Out":**
      *   Navya-Nyāya (logic/linguistic turns).
      *   Debates with Buddhists (specifically the *apoha* theory).
      *   Detailed breakdown of *Nirvikalpaka* vs. *Savikalpaka* perception (too technical).
      *   The 5-step inference (*parārthānumāna*) structure (keep it to the 3-step logic for intro).

  7.  **Review against Constraints:**
      *   No sutra citations? Check.
      *   No reading list? Check.
      *   Concrete scenario? Check (Mushroom/Foraging).
      *   Check question? Check.
      *   Misconceptions addressed? Check.

  8.  **Final Polish:**
      *   Make the tone supportive for a TA/section leader.
      *   Ensure the "Mushroom" example is robust enough for *Upamāna* (which is usually the hardest to grasp). *Self-Correction:* The standard Nyāya example for *Upamāna* is the *Gavaya* (wild cow). A person knows a cow, hears a description of a *Gavaya* as "like a cow," goes to the forest, sees the animal, and knows "This is a *Gavaya*." I should adapt the mushroom example to fit this structure closely so it doesn't drift into Western analogy.
      *   *Revised Mushroom Upamāna:* You know what a "Morel" looks like (familiar). An expert tells you a "False Morel" looks *similar* but has a different cap structure. You go into the woods, see a mushroom that resembles the Morel, and recognize it *as* the "False Morel" based on that similarity description. The knowledge gained is the connection between the name "False Morel" and the object in front of you.

      *   *Wait, one nuance:* Nyāya says *Upamāna* gives knowledge of the *relation between name and thing*.
      *   *Scenario Adjustment:*
          1.  **Perception:** You see a mushroom.
          2.  **Inference:** You see spots, know spots = poison, infer poison.
          3.  **Comparison:** You heard a description of a rare edible "Golden Cap" ("looks like a button mushroom but gold"). You find one. You know "This is the 'Golden Cap'." (Knowledge of name-object relation).
          4.  **Testimony:** The expert says "Boiling removes the toxin." You can't see or infer this. You know it via word.

      *   *Wait, the User's specific question on dependencies:* "like why you can't understand upamāna without knowing what anumāna already does?"
      *   *Correction:* Actually, Nyāya argues *Upamāna* is *not* *Anumāna*. But to explain it, you need to show why *Anumāna* isn't enough. So, teach *Anumāna* first, show its limits, then introduce *Upamāna* as the solution to that limit. That satisfies the user's intuition while respecting the philosophy.

      *   *Check Question:* Needs to be about irreducibility. "If you tried to explain [Scenario X] using only [Pramana Y], what information would you lose?"

  9.  **Finalizing the Output Structure:**
      *   Session Goal.
      *   The Running Example (Refined).
      *   The Sequence (with "The Gap" each fills).
      *   Misconception Traps (When to hit them).
      *   The "Kill Question" (Assessment).
      *   Scope Boundaries (What to cut).

      *(Self-Correction during drafting)*: Make sure to emphasize that *Śabda* isn't just "hearsay." It's *āpta-vākya* (reliable person's statement).
      *(Self-Correction on Upamāna)*: Ensure the distinction between "This is like that" (Analogy) and "This is the thing described as like that" (Upamāna) is clear.

