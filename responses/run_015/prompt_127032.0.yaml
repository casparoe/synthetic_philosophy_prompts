answer: |-
  Here is a plan for your study session. It is designed to be interactive, avoiding a lecture dump, and uses your mushroom scenario (with specific tweaks to fit Nyāya definitions accurately).

  ### Session Goal
  Move students from thinking of *pramāṇas* as a "list of ways to know" to understanding them as **irreducible tools for specific epistemic gaps.** By the end, they should see why Nyāya refuses to collapse the four into just perception and inference.

  ### The Running Scenario: "The Forager's Dilemma"
  Your mushroom idea is good, but to fit Nyāya strictly, we need to sharpen the definitions. In Nyāya, *Upamāna* is specifically about knowing the **relation between a name and a thing** based on similarity, not just general analogical reasoning. *Śabda* is not just "hearsay," it is reliable testimony about things beyond perception/inference.

  **The Setup:** You are in a forest with a guidebook and an expert forager. You need to navigate safely and identify species.

  ---

  ### 1. The Sequence & Dependencies
  Do not present them as equal options. Present them as a hierarchy of complexity, where each new *pramāṇa* solves a problem the previous one cannot.

  **Order:** *Pratyakṣa* (Perception) $\rightarrow$ *Anumāna* (Inference) $\rightarrow$ *Upamāna* (Comparison) $\rightarrow$ *Śabda* (Testimony).

  #### Step 1: Pratyakṣa (Perception)
  *   **The Scenario:** You look down and see a mushroom. It is red with white spots.
  *   **The Epistemic Work:** Direct sensory contact. No mental construction yet.
  *   **The Limit:** You know the *appearance*, but you do not know the *identity* or the *consequences*. You cannot "see" toxicity.
  *   **Teaching Point:** Perception is the foundation. Without this, nothing else happens. But it is limited to the "here and now."

  #### Step 2: Anumāna (Inference)
  *   **The Scenario:** You recall the rule: "All red mushrooms with white spots are poisonous." You see the red/white mushroom. You conclude: "This is poisonous."
  *   **The Dependency:** This *requires* Perception (you must see the spots to infer the poison).
  *   **The Epistemic Work:** Moving from the perceived (spots) to the unperceived (toxicity) via a universal connection (*vyāpti*).
  *   **The Limit:** Inference requires a pre-existing universal rule. What if you encounter a mushroom you have no rule for? What if you don't know its *name* to even look up the rule?
  *   **Misconception Check (Intervene Here):** Students often think inference is just "guessing." Emphasize that for Nyāya, this requires a known, invariable connection, not a hunch.

  #### Step 3: Upamāna (Comparison)
  *   **The Scenario:** You find a strange, new mushroom. You don't know its name. Earlier, a book described a "Golden Cap" as "looking like a common button mushroom, but gold." You look at your new mushroom, see the similarity to the button mushroom you know, and realize: **"Ah, this is what they call a 'Golden Cap'."**
  *   **The Dependency:** This requires Perception (seeing the mushroom) and often relies on a prior description (language), *but* the knowledge gained is unique.
  *   **The Epistemic Work:** You aren't inferring a property (like toxicity). You are learning the **relation between a word and an object** based on similarity.
  *   **Why it's not Anumāna:** In inference, you conclude a *property* (it is poisonous). In comparison, you conclude a *name-reference* (this is the referent of that word).
  *   **Misconception Check (Intervene Here):**
      *   *Western Analogy:* Students will say, "This is just analogy."
      *   *Correction:* Western analogy usually argues "A is like B, therefore A has property X." Nyāya *Upamāna* is "A is like B, therefore A is the thing named 'X'." It is about **naming and identification**, not property transfer.

  #### Step 4: Śabda (Testimony)
  *   **The Scenario:** You ask the expert forager, "Can I eat this if I boil it?" The expert says, "Yes, boiling neutralizes the toxin."
  *   **The Dependency:** You could not perceive the chemical change, and you could not infer it (no universal rule available to you).
  *   **The Epistemic Work:** Knowledge derived from the statement of a reliable person (*āpta*).
  *   **Why it's not just "Listening":** It is not blind faith. Nyāya requires you to establish the speaker's competence and truthfulness first.
  *   **Misconception Check (Intervene Here):**
      *   *Blind Authority:* Students will say, "This is just appeal to authority bias."
      *   *Correction:* Nyāya agrees blind authority is bad. *Śabda* is only a *pramāṇa* if the source is verified as reliable (*āpta*). The *mechanism* of knowledge is the understanding of the words, not the person's status, but the person's status guarantees the truth of the words.

  ---

  ### 2. The "Kill Question" (Assessment)
  Do not ask them to define the terms. Ask them to defend the structure. Put this on the board for the last 10 minutes:

  > **The Scenario:** You encounter a new animal in the forest. A reliable guide tells you, "This animal is called a 'Gavaya'; it looks like a cow."
  >
  > **The Question:** A skeptic argues: "You don't need four *pramāṇas*. You perceived the animal (*Pratyakṣa*), and you inferred its name based on the guide's description (*Anumāna*). Why does Nyāya insist *Upamāna* is a separate, irreducible source of knowledge here? What specific knowledge do you gain in this moment that Inference cannot explain?"

  **Correct Answer Key (for you):**
  If they reduce it to *Anumāna*, they are claiming you *inferred* the name. But inference requires a universal connection (e.g., "All things looking like cows are Gavyas"). You don't have that rule yet. You are learning the rule *through* the comparison. The knowledge gained is the **connection between the word 'Gavaya' and the object**, which is not a property inference. If you collapse *Upamāna* into *Anumāna*, you cannot explain how we learn new names/categories from descriptions without circular reasoning.

  ---

  ### 3. What to Leave Out (Scope Boundaries)
  Be explicit with your section that you are bracketing these topics. This saves you from getting stuck in weeds you can't verify.

  1.  **Navya-Nyāya (New Logic):** Tell them, "Later Nyāya thinkers refined these definitions with complex linguistic logic, but we are sticking to the classical framework."
  2.  **The 5-Step Inference Structure:** Nyāya has a formal 5-step debate structure for inference (*parārthānumāna*). Skip it. It confuses the basic epistemic point. Stick to the 3-step logic (Thesis, Reason, Example).
  3.  **Buddhist Critiques:** Buddhists argued *Upamāna* and *Śabda* are reducible to *Anumāna*. Mention this only if a student asks "Why four?" (Answer: "Because opponents tried to reduce them, and Nyāya said 'No, you lose explanatory power'"). Do not teach the Buddhist arguments themselves.
  4.  **Types of Perception:** Don't get into *nirvikalpaka* (indeterminate) vs. *savikalpaka* (determinate) perception. Just call it "raw sensing" vs. "identifying."

  ### 4. Facilitation Tips
  *   **When they conflate *Upamāna* and *Anumāna*:** Ask, "Did you deduce the name, or did you recognize the match?"
  *   **When they attack *Śabda*:** Ask, "How do you know language works at all? If every word required you to personally verify the fact, could you ever learn history or science?"
  *   **Keep the Mushroom Alive:** Every time you switch *pramāṇas*, return to the forest. Don't let the example change. The continuity shows how one knower uses different tools for different problems.

  ### Summary of Dependencies for your Board Notes:
  1.  **Pratyakṣa:** Foundation. (See the mushroom).
  2.  **Anumāna:** Extends perception. (See spots $\rightarrow$ Know poison). *Depends on 1.*
  3.  **Upamāna:** Bridges name and object. (See similarity $\rightarrow$ Know name). *Distinct from 2 because it establishes the relation, not a property.*
  4.  **Śabda:** Extends beyond space/time/senses. (Hear word $\rightarrow$ Know hidden fact). *Distinct because the source is linguistic reliability, not sensory data.*
