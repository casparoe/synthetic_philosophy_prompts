answer: |-
  Here is a principle that captures nearly all your verdicts, an analysis of where the repugnance lives, and the verdicts on your new cases.

  ### The Principle: Non-Alienable Integrity

  **A market transaction is illicit if it requires the seller to alienate a capacity constitutive of their status as a free, equal, or truthful agent, or if the market structure exploits a context of non-voluntary necessity.**

  This principle has two prongs that correspond to your intuitions:
  1.  **Status Alienation:** You cannot sell what makes you a citizen (vote), a bodily sovereign (living kidney), or a truthful creator (authorship).
  2.  **Contextual Coercion:** You cannot sell necessities where the buyer's leverage comes from the seller's desperation (hurricane water).

  ### Where the Repugnance Lives

  You asked whether the harm lies in *what is transferred*, *what the transaction expresses*, or *what the state enforces*.

  Based on your "Willingness Premium" verdict (the case you find worst of all), the repugnance lives in **what the transaction expresses.**

  When a buyer pays a premium for your "willingness," they are not buying a kidney; they are buying your *gratitude*. They are converting a moral relationship (gift/donor) into a commercial one (service/provider). This corrupts the social meaning of the act. The physical transfer is identical to the plain sale, but the *expression* is different. The plain sale says, "I am a vendor." The willingness premium says, "I am a friend who is being paid to pretend I am a donor." That simulation of intimacy is what disgusts you.

  **However, for the novel, you must write about enforcement.**
  You cannot put "social meaning" on the page easily. You can put a contract, a police raid, or a lawsuit on the page. The state's enforcement is the *mechanism* that makes the expressive harm public and binding. When the state enforces a contract for a living kidney, it validates the expression that a human body is fungible inventory. When the state enforces the defense contractor's veto, it validates the lie that the contractor is the author.

  **Advice for the page:** Build the argument around **enforcement**, but have the characters reveal that the *true cost* is **expression**. One character should argue, "The law shouldn't stop the sale; it should stop the *lie* the sale tells."

  ### The Friction Points: What to Bend or Drop

  No principle survives contact with human intuition without friction. Here is where your verdicts strain the principle, and where your characters should fight.

  **1. The Surrogacy vs. Kidney Contradiction**
  *   **The Conflict:** Your principle bans the kidney (bodily sovereignty) but allows surrogacy (bodily service). Yet both involve the state enforcing a claim over a living person's body.
  *   **The Honest Truth:** This is the weakest link in your moral chain. Ethically, they are difficult to distinguish. The only robust distinction is *permanent loss* vs. *temporary service*. A kidney is gone forever; a womb is rented temporarily.
  *   **Recommendation:** **Do not drop this verdict.** This is the most dramatic fracture in your characters' worldview. Have one character press this exact point: "If the state can force me to carry a child for money, why can it not force me to lose a kidney for money? Both are flesh. Both are pain." If you smooth this over, you lose the novel's central tension. Keep the unease. Let the principle bend here.

  **2. The Fixed-Price Kidney**
  *   **The Conflict:** You say "No" to the open market, and "Still No" to the fixed-price lottery, but admit the recoil is weaker.
  *   **The Honest Truth:** If the harm is *exploitation* (Coercion Prong), the fixed-price model should be fine. If the harm is *commodification* (Status Prong), both should be equally bad. Your weaker recoil suggests you care about exploitation more than you want to admit.
  *   **Recommendation:** **Bend the principle.** Acknowledge that the "Status" prong is not absolute. It is graded. A state-run system reduces the *expression* of inequality (no rich buyers, no desperate sellers), which is why your recoil is weaker. Your character who favors markets should argue that the state monopsony *cleanses* the expression of the sale.

  **3. The Willingness Premium**
  *   **The Conflict:** This is logically identical to the plain sale but morally worse.
  *   **The Honest Truth:** This confirms that your morality is about *semantics*, not *consequences*.
  *   **Recommendation:** **Keep this.** This is your thematic核 (core). It proves that the *story* we tell about the money matters more than the money itself.

  ### Verdicts on the New Cases

  Applying the **Principle of Non-Alienable Integrity**:

  **1. The AI Estate (Posthumous Novels)**
  *   **Analysis:** This involves selling your *name* and *creative identity* to generate work you did not do. This maps directly to your verdict on "A fee to put my name on a novel I did not write" (Not fine). The fact that you are dead does not change the falsification of authorship. It treats your artistic integrity as a fungible asset that survives your moral agency.
  *   **Verdict:** **Not Fine.**
  *   **Why:** It violates the "Truthful Agent" clause. It forces the public to consume a lie (that you wrote it) validated by a contract you signed while alive. It is the ultimate alienation of the creative self.

  **2. The State Monopsony (Kidneys)**
  *   **Analysis:** This removes the "Highest Bidder" (exploitation) and the "Willingness Premium" (fake intimacy). It leaves only the "Living Organ Sale."
  *   **Verdict:** **No, but permissible as a tragic necessity.**
  *   **Why:** It still violates the "Bodily Sovereignty" clause (living tissue). However, because it removes the *expressive harm* of inequality and coercion, it is the "least bad" version of a bad thing. In your novel, this should be the Compromise Position. It satisfies the Utilitarian (lives saved) without fully satisfying the Deontologist (body sold).
  *   **Dramatic Utility:** This is the perfect middle ground for a political thriller. One character argues it's the only ethical way to save lives; the other argues it turns the state into a butcher shop.

  ### Summary for the Draft

  If you build the argument around **Enforcement**, you show the police and the contracts. If you build it around **Expression**, you show the shame and the social stigma.

  **The Sacrifice:** To make the principle hold, you must admit that **Surrogacy** is the outlier. Your anti-market character will look hypocritical if they ban kidneys but allow surrogacy without a very specific distinction (permanent loss vs. temporary labor). Your pro-market character will exploit this.

  **The Core Conflict:** The novel shouldn't be about whether markets are efficient. It should be about whether the state should be in the business of **validating lies**.
  *   The kidney sale lies about the body (it's not a thing).
  *   The vote sale lies about citizenship (it's not a right).
  *   The ghostwriting lies about art (it's not truth).
  *   The willingness premium lies about love (it's not a gift).

  Your characters are arguing about which lies the state is allowed to tell.
