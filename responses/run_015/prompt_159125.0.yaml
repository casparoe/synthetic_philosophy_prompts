  # CONSTRUCTIVE MATHS: A NAVIGATIONAL CHART

  **Instructions:** Start at **Node 1**. Answer **Yes** or **No** based on your settled view of the case. Follow the arrows to your position.

  ### THE FLOWCHART

  **NODE 1: The $\sqrt{2}$ Existence Test**
  *Consider the proof: $\sqrt{2}^{\sqrt{2}}$ is either rational or its square is 2. Does this establish the existence of irrationals $a,b$ with $a^b$ rational?*
  *   **YES** $\rightarrow$ Go to **Node 2** (Classical Cluster)
  *   **NO** $\rightarrow$ Go to **Node 3** (Constructive Cluster)

  **NODE 2: The Satisfaction Test**
  *If a classical proof establishes existence without providing a witness, is the mathematical claim fully satisfied?*
  *   **YES** $\rightarrow$ **LEAF: Classical Mathematics**
  *   **NO** $\rightarrow$ **LEAF: Shallow Constructivism**

  **NODE 3: The Ultrafinitist Test**
  *Is $10^{10^{10}}$ a number in quite the same sense that 7 is?*
  *   **NO** $\rightarrow$ **LEAF: Ultrafinitism**
  *   **YES** $\rightarrow$ Go to **Node 4**

  **NODE 4: The Finitist Test**
  *Is induction over the totality of natural numbers legitimate?*
  *   **NO** $\rightarrow$ **LEAF: Finitism**
  *   **YES** $\rightarrow$ Go to **Node 5**

  **NODE 5: The Markov Test**
  *A program searches for a Goldbach counterexample. If it is impossible for the search to run forever, does it follow that it halts?*
  *   **YES** $\rightarrow$ **LEAF: Russian / Recursive School**
  *   **NO** $\rightarrow$ Go to **Node 6**

  **NODE 6: The Step Function Test**
  *Is the function $f(x)=0 (x<0), 1 (x\ge0)$ a genuine total function on the reals?*
  *   **YES** $\rightarrow$ *(Incoherent on this branch: see Sidebar)*
  *   **NO** $\rightarrow$ Go to **Node 7**

  **NODE 7: The Lawless Reals Test**
  *Are there real numbers that no rule or law picks out at all?*
  *   **YES** $\rightarrow$ Go to **Node 8**
  *   **NO** $\rightarrow$ Go to **Node 9**

  **NODE 8: The $\pi$-Decimal Test**
  *Would you assert right now that either the decimal expansion of $\pi$ contains infinitely many 7s or it doesn't?*
  *   **NO** $\rightarrow$ **LEAF: Brouwerian Intuitionism**
  *   **YES** $\rightarrow$ *(Incoherent with Node 7: see Sidebar)*

  **NODE 9: The Impredicativity Test**
  *Is defining a number as the least $n$ such that $\forall m, Q(n,m)$ legitimate, given the quantifier ranges over a totality including $n$?*
  *   **NO** $\rightarrow$ **LEAF: Predicativism**
  *   **YES** $\rightarrow$ Go to **Node 10**

  **NODE 10: The Propositions-as-Types Test**
  *Is a proof an object of the same type as a number?*
  *   **YES** $\rightarrow$ **LEAF: Martin-Löf Type Theory**
  *   **NO** $\rightarrow$ **LEAF: Bishop-Style Constructivism**

  ---

  ### THE LEAVES: CHARACTERISATIONS & COSTS

  *   **Classical Mathematics:** Truth is bivalent and mind-independent. *Awkward Commitment:* Existence without witnesses is mathematically complete.
  *   **Shallow Constructivism:** Classical truth holds, but assertions require witnesses. *Awkward Commitment:* You accept LEM ontologically but restrict it methodologically (costs philosophical consistency).
  *   **Ultrafinitism:** Only feasible numbers exist. *Awkward Commitment:* No general induction; arithmetic breaks at high magnitudes.
  *   **Finitism:** Potential infinity only; no completed sets. *Awkward Commitment:* Real analysis must be reconstructed or abandoned.
  *   **Russian / Recursive:** All objects are computable. *Awkward Commitment:* Markov's Principle; all functions are computable (Kreisel's counterexample).
  *   **Brouwerian Intuitionism:** Mathematics is mental construction; choice sequences exist. *Awkward Commitment:* All total functions are continuous (Step Function is impossible).
  *   **Predicativism:** No definition may quantify over a totality containing the definiendum. *Awkward Commitment:* Much of classical analysis (e.g., LUB principle) is unavailable.
  *   **Martin-Löf Type Theory:** Logic is encoded in type theory; proofs are data. *Awkward Commitment:* Equality is intensional (computationally distinct proofs are distinct objects).
  *   **Bishop-Style Constructivism:** Classical logic for finite sets, constructive for infinite; set-theoretic foundation. *Awkward Commitment:* Refuses to assert "All functions are continuous" but cannot define the Step Function (indistinguishable from ML on theorems).

