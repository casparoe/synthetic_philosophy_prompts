  No causal chain binds you to **Damascus**.
  It is not luck, not any toss of **coin**,
  That draws the appointment out to **Aleppo**.
  The shadow watched the waking of the **copy**.
  Matching the step you take upon the **road**.

  If you stand still upon this stony **road**,
  Then Death has marked your name for **tomorrow**.
  Because the locked-room twin, the silent **copy**,
  Would also choose to stay in **Damascus**.
  But if you run away to **Aleppo**,
  The safety shifts again like fall of **coin**.

  So he produces from his pocket **coin**,
  To break the loop that circles on the **road**.
  "If chance decides, I'll flee to **Aleppo**,"
  "Then neither choice is fixed for **tomorrow**."
  "No preference pulls me back to **Damascus**."
  "I halt the mind that mimics me, the **copy**."

  The metal falls. He is no longer **copy**.
  He sees the face of heads upon the **coin**.
  Suddenly he wants to stay in **Damascus**.
  The safety shifts again upon the **road**.
  The certainty returns for **tomorrow**.
  The fatal address switches to **Aleppo**.

  He rides alone upon the way to **Aleppo**.
  Death checks the book, sees flesh and not a **copy**.
  "I wrote this name last night for **tomorrow**."
  "I did not track the spinning of your **coin**."
  "We meet by chance alone upon this **road**."
  "I did not hunt you down from **Damascus**."

  "I did not chase you from **Damascus** to **Aleppo**,"
