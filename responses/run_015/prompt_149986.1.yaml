  **TERMS OF SERVICE AGREEMENT: SIDGWICK INSTITUTE FOR RATIONAL INTUITION AND TELEPATHIC VERIFICATION**

  By accessing the Ethereal Plane, the User (hereinafter "the Sitter") agrees to submit all moral intuitions and psychical impressions to Institute verification. The Institute reserves the right to reconcile conflicting rational demands without prior notice. Please read carefullly.

  **1. Methodological Compliance**
  All ethical claims and spectral sightings must be validated under three concurrent frameworks.
  (a) **Egoistic Hedonism:** Claims benefiting the Sitter's happiness are valid unless contradicting universal welfare. Self-interest is prioritized during blackout conditions.
  (b) **Universal Hedonism:** Claims benefiting aggregate happiness are binding, even if detrimental to the Sitter's comfort during manifestation events.
  (c) **Common-Sense Morality:** Telepathic data violating social norms shall be flagged under the Ectoplasmic Common Sense protocol. Intuitive certainty is required for ghostly commands.

  **2. The Dualism of Practical Reason Waiver**
  The Sitter accepts that Rational Egoism and Utilitarianism may remain permanently unreconciled within the session duration. This conflict is a feature, not a bug. The Institute is not liable for existential distress resulting from the failure of virtue to align with self-interest. Proof of immortality is provided on an aspirational basis only. Should the universe fail to reward virtue, no refund will be issued.

  **3. Mandatory Protocol: Rational Intuitionist Seance**
  All participants must engage in the Rational Intuitionist Seance to verify spectral authenticity.
  *   **3.1 Ectoplasmic Common Sense:** Mediumistic outputs must be self-evident to any mature mind. If the ghost's message requires empirical verification beyond clear intuition, the manifestation is void.
  *   **3.2 Universal Point of View Disclosure:** Participants must attempt to view the seance from the point of view of the universe. Failure to achieve this perspective invalidates any personal visions recieved during the trance state.

  **4. Limitation of Liability**
  While the Institute applies strict epistemic standards to moral reasoning, no guarantee is made regarding the density of apparitions. The Sitter agrees that the burden of proof lies with the deceased. We do not warrant that the dead are rational agents capable of utilitarian calculation. Liabilty for possession is excluded.

  **5. Amendments**
  We may update these terms to accommodate new psychical data. Continued use of the ouija board constitutes acceptance.

  **Author's Note:**
  Sidgwick was a founding member of the Society for Psychical Research (SPR) and explicitly sought evidence for survival after death to help resolve his "Dualism of Practical Reason." This biographical fact is settled. However, the "Rational Intuitionist Seance" is pure satire. Scholars contest whether Sidgwick's psychical research represented a lapse in his usual epistemic rigor or a consistent application of his empiricism to new data. This text satirizes the former view—the idea that he lowered his bar for ghosts—without endorsing it as consensus.
