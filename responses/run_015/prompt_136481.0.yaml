answer: |-
  Your intuition regarding the analogy between Moorean organic unity and biological emergence is philosophically potent. It suggests that value, like life or consciousness, may be a higher-order property that supervenes on a configuration of parts without being reducible to them. To evaluate theories of intrinsic value through this lens, we must establish a rigorous set of desiderata. These criteria define what an adequate theory must explain to capture the richness of aesthetic and interpersonal goods without collapsing into simplistic reductionism or metaphysical obscurity.

  The primary desideratum is **Non-Aggregative Holism**. A theory must account for the fact that the value of a whole is not merely the arithmetic sum of the values of its constituents. In biology, a living organism possesses capacities absent in its isolated cells; similarly, a beautiful landscape possesses a unity that vanishes if reduced to isolated patches of color, and a friendship possesses a worth exceeding the sum of pleasant interactions. A theory that treats value as strictly additive fails to capture the gestalt nature of these goods. This is non-negotiable for any theory claiming to take Moore's insight seriously.

  Second, the theory must respect **Relational Asymmetry**. The mode of valuing a landscape differs fundamentally from the mode of valuing a friendship. Appreciating a sunset is largely contemplative and unilateral; the landscape does not appreciate you back. Friendship, however, is reciprocal and constitutive; the value depends on mutual recognition and shared agency. A monolithic theory of value that treats all goods as objects of passive contemplation fails to distinguish between appreciating beauty and participating in a relationship. This distinction is non-negotiable for capturing the phenomenology of interpersonal goods.

  Third, we must address **Downward Causal Efficacy**. In complex systems, emergent properties often exert downward causation on their parts (e.g., the heart beats because of the organism's need for circulation). Does the value of the whole confer value or obligation upon the parts? If a friendship is valuable, does that value mandate specific actions toward the friend that would not be mandated by the sum of individual interactions? A theory must explain whether value is merely a static label or a dynamic force that influences behavior and part-function. This is camp-specific, as naturalists may reject non-physical downward causation.

  Fourth, the theory requires **Empirical Consistency**. It must not contradict established findings in aesthetics and social psychology. For instance, aesthetics research suggests that context alters perception of beauty (the same note sounds different in different chords), and social psychology indicates that relationship quality is not linearly correlated with time spent together. A theory positing that value is invariant to context or strictly linear regarding interaction frequency fails this test. This is non-negotiable for a theory grounded in reality.

  Finally, the theory must provide **Action-Guidance**. Moral philosophy is practical. Even if value is holistic, the theory must offer a method for comparing states of affairs to guide decision-making. If value is entirely non-aggregative and unique to every whole, comparison becomes impossible, rendering the theory practically inert. This is non-negotiable for moral philosophy, though it creates tension with strict holism.

  There is a significant tension between Non-Aggregative Holism and Action-Guidance. If the value of a whole is truly unique and non-decomposable, it becomes metaphysically difficult to compare two different wholes (e.g., saving a masterpiece vs. sustaining a friendship). Strict adherence to holism risks making value incomparable, while strict adherence to action-guidance risks forcing a reductionism that violates holism. This subset is flagged as jointly unsatisfiable without significant theoretical compromise.

  When we score existing theories against these criteria, Moorean Holism excels at Non-Aggregative Holism and Relational Asymmetry but struggles with Action-Guidance due to the difficulty of calculating organic unities. Hedonist Reduction satisfies Action-Guidance easily by summing pleasure units but fails Non-Aggregative Holism and Empirical Consistency regarding the context-dependence of value. Preference-Satisfaction accounts handle individual variation well but often fail to capture the objective value of goods like friendship independent of current desire, and they struggle with Downward Causal Efficacy if preferences are static.

  The most exclusive requirement is Non-Aggregative Holism. It immediately disqualifies strict atomistic reductions, forcing any adequate theory to adopt a complex structural ontology akin to the systems biology you recognize.

