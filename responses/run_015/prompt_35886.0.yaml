  4.  **Drafting the Feedback:**
      *   *Structure:* Follow the user's three requests (Accuracy, Interest, Closing Claim) + Confidence/Least Sure point.
      *   *Tone:* Respectful but rigorous.
      *   *Specific Corrections:*
