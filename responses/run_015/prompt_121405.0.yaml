answer: |-
  # Session Design: "The Qualia Quarantine"

  This activity is designed to simulate the structural gap between **Access Consciousness** (information available for reporting and reasoning) and **Phenomenal Consciousness** (private, subjective experience) without using those terms initially. The game creates a functional division where one group can succeed using only data (Access), while the other holds private "truth" that cannot be communicated (Phenomenal), forcing the group to confront the insufficiency of functional broadcasting to capture the whole picture.

  ## Timeline (90 Minutes)
  *   **0:00–0:15 (Intro & Setup):** Explain rules, assign roles, distribute materials. No philosophical context given yet.
  *   **0:15–0:60 (Gameplay):** Three rounds of the coordination task (15 mins per round + setup).
  *   **0:60–0:90 (Debrief):** Structured discussion connecting mechanics to experience, revealing technical terms only in the final 5 minutes.

  ## Materials Needed
  *   **Deck of "Target Cards":** 20 cards featuring simple, distinct color/shape combinations (e.g., Red Circle, Blue Square).
  *   **"Data Sheets":** For the Transmitters. These describe the cards textually (e.g., "Target: Color=Red, Shape=Circle").
  *   **"Qualia Cards":** For the Receivers. These show the actual image of the card (the visual experience).
  *   **Tokens:** 30 poker chips or similar (for scoring).
  *   **Whiteboard/Paper:** To track group guesses.
  *   **Barrier:** A folder or screen to prevent Receivers from showing cards to Transmitters.

  ## Roles (10 Participants)
  1.  **Transmitters (6 people):** Represent *Access*. They receive textual data descriptions. They can talk freely, argue, and broadcast information. Their goal is group success.
  2.  **Receivers (4 people):** Represent *Phenomenality*. They receive the actual visual image (the "what it's like"). They are **Quarantined**: they cannot describe the content (color/shape). They can only emit "Signals" (see Payoff). Their goal is private accuracy.

  ## Game Rules & Payoff Scheme
  **The Task:** The group must identify the current "Target Card" drawn from the deck.

  **Round Flow:**
  1.  A Target Card is drawn.
  2.  **Transmitters** get a Data Sheet describing it (e.g., "Property A: High Wavelength, Property B: Closed Curve").
  3.  **Receivers** get the Qualia Card (the actual image).
  4.  **Discussion (5 mins):** Transmitters discuss the data to deduce the answer. Receivers watch. Receivers may not speak content. They may only place a **Green Token** (Confidence/Match) or **Red Token** (Mismatch/Uncertainty) in front of them regarding the Transmitters' current leading guess.
  5.  **Submission:** Transmitters submit the final guess.
  6.  **Scoring:**
      *   **Group Pot:** If the guess is correct, all Transmitters get 2 points. Receivers get 0 points from the Group Pot.
      *   **Private Pot:** Receivers get 3 points if their Token placement matched reality (e.g., they placed Green when the guess was correct, or Red when it was wrong), *regardless* of whether the group won.

  **The Twist:** Transmitters can logically solve every puzzle without the Receivers. The Receivers possess the "direct experience" of the answer but are functionally inert because they cannot broadcast the content.

  ## Predictable Failure & Handling
  **Failure:** Receivers will attempt to cheat the communication ban (e.g., saying "It's the warm one" or pointing aggressively).
  **Handling:** The Facilitator must act as a strict "System Monitor." If a Receiver violates the ban, pause the game. Do not scold. Instead, say: "System Error: Qualia cannot be compressed into data. Reset token." This reinforces the philosophical point (ineffability) through mechanic enforcement.

  **Failure:** Transmitters will ignore Receivers entirely because they are functionally useless for winning points.
  **Handling:** Let this happen. It is crucial for the debrief. If Transmitters ask "Why are they here?", reply: "Those are the rules of the system."

  ## Debrief Mapping (The "Reveal")
  Do not mention philosophy until the end. Guide the discussion with these questions:

  1.  **To Transmitters:** "Could you have won without the Receivers?" (Expected: Yes). "Did the Receivers' tokens change your decision?" (Expected: No).
      *   *Concept:* Functional sufficiency of access information.
  2.  **To Receivers:** "You knew the answer directly. How did it feel to be unable to share it?" (Expected: Frustrating, isolated). "Did your private knowledge help the group?" (Expected: No).
      *   *Concept:* The causal inertness of pure phenomenality (Epiphenomenalism) and the ineffability of qualia.
  3.  **To Group:** "If the Transmitters won every time, what was missing from the room?"
      *   *Concept:* The "Hard Problem"—function vs. experience.
  4.  **The Reveal (Last 5 mins):** Explain that Transmitters simulated **Access Consciousness** (global broadcast of data) and Receivers simulated **Phenomenal Consciousness** (subjective experience). The frustration they felt is the "Explanatory Gap."

  ## Unreproducible Feature
  **Actual Subjective Experience:** The game cannot generate actual qualia. The Receivers do not actually feel a unique "consciousness" distinct from the Transmitters; they are just following different rules. The "gap" is simulated structurally, not experientially. You must supply the philosophical bridge in the debrief by asking them to *imagine* that the Receivers' inability to speak represents the impossibility of explaining "redness" to a blind person, rather than just a rule constraint.

  ## Confidence & Uncertainty
  **Confidence Level:** High (85%). The mechanical split cleanly mirrors the philosophical distinction, and the payoff scheme incentivizes the correct behaviors (Transmitters ignoring Receivers, Receivers focusing on private truth).
  **Least Sure Point:** Whether the group will intuitively feel the "missing light" without heavy facilitation. There is a risk they view the Receivers simply as "players with a handicap" rather than a metaphor for subjective experience. The Facilitator must work hard in the debrief to pivot from "game rules" to "nature of mind."

