      *   *Idea 2:* The "Blind Operator" vs. "The Feeler." One person solves puzzles using data (access), another feels pain/pleasure based on correctness but can't speak (phenomenal). *Critique:* Might be too cruel or confusing.
      *   *Idea 3:* "The Broadcast Tower." A central hub receives inputs. Some inputs are "data" (numbers), some are "qualia" (descriptions of feeling). The hub must act on data to win points. The "qualia" players get points only if they *feel* something distinct, but they can't tell the hub what it is, only that it happened.
      *   *Idea 4 (Selected):* "The Signal and the Sensation."
          *   **Roles:** "Processors" (Access) and "Experiencers" (Phenomenal).
          *   **Task:** Solve a coordination problem (e.g., match symbols or patterns).
          *   **Mechanic:** Processors get clear data (letters/numbers) and can talk freely. Experiencers get a sensory stimulus (e.g., a specific sound, color, or texture) that *correlates* with the data but cannot be described directly, only reported as "intensity" or "presence."
          *   **Twist:** To win maximum points, the group needs both the data (to act) and the confirmation of experience (to validate). However, the rules will force a divergence: Processors can solve the task without Experiencers, but Experiencers *know* something the Processors don't (the quality), yet can't convey it. Or, Processors can lie about the data, but Experiencers feel the truth.
          *   **Refinement for the "Gap":** Let's make it about *reporting*. Processors must output a solution based on information broadcast. Experiencers receive private sensory info that *matches* the solution but are forbidden from describing the content, only the *fact* of experience. The group wins if the solution is correct. The Experiencers win personal points if they successfully distinguish their private state from mere data processing.
          *   **Better Refinement:** Let's simulate the "Zombie" vs. "Subject" split.
          *   **Role A (Broadcasters):** They receive cards with instructions/data. They can talk, share, and decide actions. They earn points for group success.
          *   **Role B (Witnesses):** They receive cards with a "sensory" cue (e.g., a specific color swatch or a sound clip via headphone) that matches the correct answer but are *forbidden* from describing the content. They can only say "I have a match" or "I feel uncertainty." They earn points for personal accuracy, not group success.
          *   **The Conflict:** The Broadcasters can solve the puzzle purely logically without the Witnesses. The Witnesses have the "qualia" (the color/sound) but it adds no functional value to the Broadcasters because they can't hear the description. This mirrors Access (functional broadcast) vs. Phenomenal (private feel).
          *   **The "Gap" Moment:** At the end, ask Witnesses: "Did your private experience help the group?" (No). Ask Broadcasters: "Did you need the Witnesses?" (No). Then ask: "Then why were the Witnesses there?" (To represent the 'light' that doesn't change the function).

      *   *Revised Game Design:* "The Black Box Protocol."
          *   **Setup:** 10 people. 6 "Operators" (Access), 4 "Sensors" (Phenomenal).
