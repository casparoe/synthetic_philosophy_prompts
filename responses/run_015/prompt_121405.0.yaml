      *   *Access Consciousness:* Information available for reasoning, reporting, controlling behavior. Functional, broadcastable.
      *   *Phenomenal Consciousness:* Subjective experience, qualia, "what it's like." Private, non-functional (arguably).
      *   *The Gap:* You can have access without phenomenality (philosophical zombie) or phenomenality without access (subconscious feelings?). The game needs to simulate a scenario where functional success (points) is possible without subjective sharing, or where subjective experience exists but doesn't help functional success.

  3.  **Brainstorming the Game Mechanism:**
