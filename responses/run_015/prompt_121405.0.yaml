      *   **Round 1:** Agents solve a logic puzzle. They win points. Subjects watch.
      *   **Round 2:** Subjects are given private information (a colored tile) that confirms the answer. Agents must guess. Subjects can only say "Yes/No" to "Do you feel confident?" but cannot say "It's Blue."
