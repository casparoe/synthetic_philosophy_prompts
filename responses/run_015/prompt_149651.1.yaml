  I'm presenting a paper in two weeks to our metaphysics-and-aesthetics joint seminar defending what I call "affordance-constitution": the claim that the statue and the clay are neither identical nor related by standard material constitution, but rather that the statue is the persisting actualization-profile of the clay's shape-affordances sustained under artistic constraint. On this view, melting the statue doesn't destroy one object and spare another; it terminates a specific affordance-pattern that the clay was maintaining, without requiring a second substance to vanish. The audience is precisely eight people: five four-dimensionalists who think temporal parts dissolve the puzzle entirely, two hylomorphists for whom form must be a real principle of unity distinct from matter, and one aesthetician who insists that any ontology must preserve our practices of artistic evaluation and distinguish vandalism from mere reshaping. Draft my Q&A prep sheet: list the objections they will actually raise—ordered by how damaging each is to this specific framing—phrased in the vocabulary each camp uses (not generic "gotcha" questions), with a two-minute reply for each, a brief note on where that reply is weakest, what I should concede up front in my opening, and the one objection I'm hoping nobody asks—probably whether my view collapses the statue into a mere Cambridge change of the clay or eliminates art objects altogether by reducing them to modal patterns. Please push back plainly if my premise is confused, if "affordance-constitution" is incoherent as formulated, or if the task can't be done well without misrepresenting those positions. Keep the response under 600 words; begin with a one-sentence verdict on whether the position is defensible as stated, then present the prep sheet.
