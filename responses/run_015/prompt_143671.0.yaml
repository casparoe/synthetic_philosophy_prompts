answer: |-
  Here is the short answer: **You should not allow his proposal as stated.** His argument about "no fact of the matter" is philosophically incorrect, and his trading strategy demonstrates a "money pump" that guarantees him profit at the certain expense of other group members. In a friendly, zero-sum pool, this is destructive.

  Here is a detailed breakdown of why, followed by specific recommendations on how to handle this without causing a rift.

  ### 1. Is his argument about "no fact of the matter" correct?
  **No.** This is the weakest part of his case.

  Whether a large number has a factor, or whether a search algorithm will find a hit, is an objective mathematical truth *right now*. The computation does not *create* the truth; it merely *reveals* it to you. Prediction markets are designed to aggregate beliefs about objective truths that are currently unknown. If the group accepts the premise that "truth is created by the deadline," you invite disputes where losers claim the outcome didn't exist until the server finished running.

  For the market to function, everyone must agree that the resolution is based on an external reality, not on the market's own opinion.

  ### 2. The Problem with the Compound Claims (The "Money Pump")
  Your friend's dry run reveals a classic arbitrage opportunity known as a **Dutch Book**.

  In his example:
  *   Price of A = 30¢
  *   Price of B = 30¢
  *   Price of (A or B) = 80¢

  According to the axioms of probability, the price of "(A or B)" can never be higher than the sum of the prices of A and B. (At most, if A and B are mutually exclusive, it equals the sum. If they overlap, it is *less* than the sum).
  *   **Maximum rational price for (A or B):** 60¢.
  *   **His selling price:** 80¢.

  By selling (A or B) at 80¢ and buying A and B at 30¢ each, he pockets 20¢ immediately.
  *   If neither happens, he keeps the 20¢.
  *   If one happens, he pays out 1.00 on the "or" contract, but collects 1.00 on the single winner. Net cost 0. He keeps the initial 20¢.
  *   If both happen, he pays out 1.00 on the "or" contract, but collects 2.00 on the singles. He makes *more* money.

  **He cannot lose.** In a zero-sum game among friends, if one person has a strategy that *cannot lose*, the other participants *must lose* on average.

  In a professional market, arbitrageurs perform a useful service: they force prices to become coherent. If he did this on the CME, his trades would push the price of (A or B) down and A/B up until the arbitrage disappeared. But in a small, illiquid market with fixed capital, he isn't "correcting prices"; he is extracting wealth from friends who made a math error. Half your group is right: he is taking money without knowing anything they don't. He is exploiting incoherence, not providing liquidity.

  ### 3. The Problem with Unsettlable Claims
  Claims like "the search never finds a hit" are fatal to a prediction market.
  *   **Resolution Risk:** A market must settle on a specific date. You cannot verify "never" by a deadline.
  *   **Dispute Risk:** If the search hasn't found a hit by the deadline, does the "Never" share pay out? What if it finds one five minutes after the deadline?
  *   **Capital Lock:** Funds tied up in unresolvable claims create frustration.

  If you cannot verify the outcome by the deadline, the claim does not belong in the market.

  ### 4. What You Should Actually Do
  You need to rule in a way that preserves the game's integrity while acknowledging your friend's technical enthusiasm.

  **Rule 1: No Unresolvable Claims.**
  Any claim must be verifiable by the market administrator (you) by the closing date. "Never" claims are banned. "Factor exists below X" is fine; "No factor exists anywhere" is not (unless the search space is finite and exhaustible by the deadline).

  **Rule 2: No Independent Compound Markets.**
  Do not allow separate tickers for "A and B" or "A or B" that trade independently of A and B. This is what allows the price incoherence.
  *   **The Fix:** If a member wants to bet on "A or B," they must construct that position by buying shares of A and shares of B.
  *   **Why:** This forces the user to respect the underlying prices. If A is 30¢ and B is 30¢, the market *implicitly* values "A or B" at somewhere between 30¢ and 60¢. They cannot trade it at 80¢ because that contract doesn't exist. They have to buy the components.

  **Rule 3: (Optional) Allow "Synthetic" Orders.**
  If your software allows it, you can let users *place orders* for compounds, but the system must automatically execute them as bundles of the base assets at consistent prices. The system, not the users, sets the logical relationship.

  ### 5. How to Communicate This to the Group
  You want to avoid sounding like you are banning "innovation." Frame this as protecting the group from accidental losses and ensuring the game remains about *prediction*, not *logic puzzles*.

  **Script for the Friend:**
  > "I've looked into the math on this. You're right that compound bets add flexibility, but the dry run showed that independent pricing creates a 'money pump' where one side is guaranteed to profit regardless of the outcome. In a pro market, that fixes prices, but in our group, it just transfers money from people who aren't checking the probability axioms to those who are. I don't want the market to become a place where we bet on who can find pricing loopholes rather than who predicts the future best.
  >
  > So, I'm going to keep the computational claims, but I have to ban 'never' claims because we can't settle them. For compounds, I'm not going to list them as separate assets. If you want to bet 'A or B,' you can just buy shares of A and B. That keeps the prices consistent and keeps the game fair for everyone."

  **Script for the Group:**
  > "We're updating the rules to keep the market fair. We're adding computational claims, but they must be resolvable by the deadline (no 'never' claims). To prevent pricing errors where people can guarantee a profit without taking risk, we won't be listing compound claims (like 'A or B') as separate assets. You can still make those bets by buying bundles of the base claims. This keeps the focus on prediction and ensures no one loses money due to math errors in the pricing."

  ### Summary
  *   **His Argument:** Incorrect. Math truths exist before computation.
  *   **His Strategy:** Exploitative in this context. It guarantees him profit against friends.
  *   **Unsettlable Claims:** Must be banned; they break the market mechanism.
  *   **Your Ruling:** Ban unresolvable claims. Ban independent compound tickers. Allow users to synthesize compound positions by buying multiple base shares.

  This protects your friends' bankrolls, keeps the market functional, and allows the software enthusiasts to keep participating within a coherent framework.
