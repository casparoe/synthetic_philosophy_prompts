prompt: |-
  I'm drafting an assignment for my metaphysics seminar and I want you to produce the joint statement from an adversarial collaboration on origin essentialism — you know, the problem of whether you could have come from a different sperm and egg. The two parties are the hard origin essentialists, who hold that originating from those specific gametes is metaphysically necessary for being you, and the contingency camp, who deny that and say you could've started from entirely different ones without losing identity.

  Don't just rehash the standard debate that every intro course covers. I want you to build in two niche wrinkles I'm calling cytoplasmic essentialism — the idea that maybe the egg's cytoplasm and mitochondrial lineage are essential even when nuclear DNA is replacable — and a synthetic-biology split-embryo case where one half gets gene-edited and implanted in a different uterus. The document should open with a numbered section of claims both sides can sign, including the biology and the case setup, followed by a disagreements table that phrases each camp's position in wording they'd accept for themselves. Then identify the cruxes — probably one about whether origin tracks genetic, causal, or spatiotemporal continuity, and another about whether essential properties must be a priori discoverable — and for each crux specify a concrete argument or case both agree is relevant, with each side's prediction written down in advance. No bibliographies, no citation lists, no requests for sources — just the drafted document. Keep it detailed, write like you're talking to the seminar, and a typo here or there is totally fine.
