answer: |-
  Your friend's argument is a elegant piece of philosophical fencing, but it cuts the air, not the bone. It is a version of the **Paradox of Prevention**: *If a vaccine works perfectly, no one gets sick; if no one gets sick, the vaccine appears to have done nothing.*

  You are right to suspect Step (5). That is the sleight of hand. But to kill the argument cleanly, you need to see exactly *why* it looks valid and what specific distinction it erases.

  Here is the breakdown: which step to drop, why it's wrong, the cost of dropping it, and how this saves your city from being arbitrary.

  ### The Verdict: Reject Step (5)

  **Step (5):** *So the more successful tightness is, the less work its norms do; at the limit, the norms of a perfectly tight society are idle, and idle norms are exactly what a loose society has...*

  **Why it looks fine:** It conflates **outcome** with **effort**. It assumes that because the *visible deviation* is zero, the *causal work* required to maintain that zero is also zero. It treats social order like a static object (a rock sitting on a table) rather than a dynamic equilibrium (a helicopter hovering in place). A helicopter hovering perfectly still is doing immense work; if it stops doing work, it falls.

  **Why it's wrong:** It ignores the **counterfactual threat**. The "work" a norm does is not measured by how many people it corrects *today*, but by the catastrophe it prevents *if it stopped*.
  *   **Loose Society:** Norms are idle because nobody cares if they are broken. The cost of deviation is low (social awkwardness).
  *   **Tight Society:** Norms are *active* because the cost of deviation is existential (death by tide). The norm is a levee. If the levee holds 100% of the water, it looks "idle" regarding water flow, but it is bearing immense structural load.

  **The Trick:** The argument swaps the definition of "difference" in Step (2).
  *   In Step (2), "difference" means *behavioral delta* (how many people stopped jaywalking).
  *   In Step (5), "difference" implies *functional necessity* (does this rule matter?).
  *   In a high-stakes environment, a rule can have **zero behavioral delta** (everyone already follows it) but **infinite functional necessity** (if they didn't, they'd die).

  ### The Cost of Rejecting (5)

  If you drop Step (5), you must accept a more complex definition of **Value** in Step (1) and (2).

  **The Price:** You have to commit to the idea that a norm's value is **modal**, not just **actual**.
  *   **Actual Value:** How much behavior does it change right now? (Friend's view).
  *   **Modal Value:** How much worse would the world be if this norm vanished? (Your view).

  **For your novel:** This means you cannot describe the city's strictness merely as "habit." You must describe it as **engineering**. The rules are not moral preferences; they are load-bearing structures. When your protagonist says the dead woman's name, they aren't just being rude; they are tapping a load-bearing wall to see if it's hollow. The "wobble" you describe is the sound of the structure realizing it might be wood, not steel.

  ### Integrating the "Overnight Rate"

  Your intuition about the *overnight rate* is the perfect tool to dismantle Step (4) and (5).

  *   **Friend's Assumption:** Total Conformity = Norms are unnecessary.
  *   **Your Reality:** Total Conformity can be maintained by **Internalization** (Overnight Rate ≈ 100%) OR **Enforcement** (Overnight Rate ≈ 0%).

  If your city has an Overnight Rate of 0%, the norms are **not idle**. They are being actively held up by the threat of punishment. The "work" is the surveillance and the fear.
  If your city has an Overnight Rate of 100%, the norms have become **culture**. The "work" was done in the past (socialization), but the *risk* remains.

  **The Wobble:** When your protagonist says the name in Chapter Four, they are effectively running an unsanctioned Overnight Rate test.
  *   If the crowd ignores them: The norm is internalized (Rate = 100%). The society is stable.
  *   If the crowd gasps/panics: The norm is enforced by fear (Rate < 100%). The society is fragile.
  *   If the social order *wobbles*: It suggests the norm was **performative**. People were following the rule because they thought *others* were following it (pluralistic ignorance). Once someone breaks it, everyone realizes the coordination is weaker than thought.

  This makes the strictness **load-bearing**. It's not that the rule itself holds up the walkways; it's that the *shared belief in the rule* holds up the coordination required to survive the tide.

  ### Addressing the "No Scarcity" Paradox

  You mentioned: *My city has almost no scarcity, no external enemies... which by the usual ecological story ought to make it loose.*

  Standard cultural tightness-looseness theory (e.g., Gelfand) links tightness to **historical threat density**. You have no scarcity of food/space, but you have **extreme temporal scarcity**.
  *   The tide is an enemy. It is predictable, but it is lethal.
  *   The "resource" being rationed is **safe time**.
  *   The "space" being rationed is **dry ground**.

  This is not arbitrary strictness; it is **synchronization**. A society can be loose about *what* you eat (no scarcity) but tight about *when* you move (tidal threat). This justifies the specific rules you listed:
  *   *Clear causeways 20 mins before turn:* Synchronization for survival.
  *   *Midday quiet:* Likely acoustic signaling for tide monitoring or structural integrity checks (sound carries over water/flat).
  *   *Stairwell sides:* Traffic flow optimization to prevent bottlenecks during evacuation.

  This keeps your strictness **reasonable**. A reasonable person defends these rules not because "tradition says so," but because "the water rises three feet in ten minutes."

  ### Alternative Rejections (And Why You Shouldn't Take Them)

  Just to price the alternatives as requested:

  **1. Reject Step (1): "Norms have value even if they don't change behavior."**
  *   *Meaning:* Norms are sacred/ritualistic.
  *   *Cost:* This makes your city's rules **arbitrary** or **religious**. It undermines the "load-bearing" engineering feel. It suggests the rules are about purity, not survival.
  *   *Verdict:* Avoid. You want the rules to be functional.

  **2. Reject Step (2): "The gap is impossible to measure."**
  *   *Meaning:* We can't know what people would do without norms.
  *   *Cost:* This makes the argument unfalsifiable. It turns your novel into a mystery about human nature rather than a society under stress.
  *   *Verdict:* Too abstract. Doesn't help the plot.

  **3. Reject Step (3): "Perfect tightness is impossible."**
  *   *Meaning:* There is always deviance.
  *   *Cost:* This concedes the point that *if* conformity were total, the norms would be idle. It saves the logic but weakens your world-building. You want a society that *feels* perfectly tight until it breaks.
  *   *Verdict:* Weakens the dramatic tension.

  ### Summary for the Draft

  Your friend's argument fails because it treats **safety** as a **commodity** rather than a **state of readiness**.

  *   **Step to Drop:** (5).
  *   **The Logic:** A levee that never breaches is not useless; it is successful. Its value is in the *prevention of the counterfactual*.
  *   **The "Overnight Rate":** Use this to show the *fragility* of the system. If the rate is low, the enforcement is doing heavy lifting. If the protagonist's slip-up causes a wobble, it reveals the Overnight Rate was lower than the authorities thought. The "work" the norm was doing was hiding the risk.
  *   **The Strictness:** It remains reasonable. It is a coordination protocol for a lethal environment. The "no scarcity" point is irrelevant because the threat is **kinetic** (the tide), not **economic** (food).

  **Concrete advice for Chapter Four:**
  When the protagonist says the name, don't just have people look shocked. Have the *coordination* fail. Maybe someone hesitates on a walkway. Maybe a gate isn't closed in time. Show that the verbal taboo was a **checksum** for the broader discipline. If you can't trust people to follow the small, invisible rule (names), can you trust them to follow the big, visible rule (the tide)? The wobble is the realization that the **Overnight Rate** is dangerously low, and the tide is coming in.
