      *   *Crucial distinction:* The friend conflates "Behavioral Deviation" with "Systemic Failure."
      *   Let's focus on the **Time Horizon**. The friend looks at $T_{now}$. The norm works over $T_{life}$.
      *   Also, the **Cost of Error**. In this city, one error = death. In a loose society, one error = awkwardness. The *stakes* justify the *tightness*, regardless of current compliance rates.

  9.  **Finalizing the Advice:**
      *   **Reject Step (5).**
      *   **Reason:** It conflates *success* with *irrelevance*. (The Levee Argument).
