  2.  **Deconstruct Hacking's Looping Effect:**
      *   Core idea: Classifying people changes how they see themselves and act, which changes the classification, which changes how they act, etc.
      *   Difference from self-fulfilling prophecy: In a prophecy, the label predicts behavior and the behavior confirms the label (static category). In looping, the behavior changes the *meaning* or *criteria* of the label itself (dynamic category). The kind of person changes.
      *   Key components needed in the game:
          1.  A label/category.
          2.  Agents who know the label and act accordingly.
          3.  Observers/Authority who define the label.
          4.  A mechanism where successful conformity leads to category revision (instability).
          5.  Feedback loop where the revision changes future behavior.

  3.  **Drafting the Game Concept:**
      *   *Fictional Category:* "Resonant Sensitives" vs. "Static Normals"? Let's try something behavioral. "Echo Types".
      *   *Setup:* 14 students. Need roles.
      *   *Roles:*
          *   "Subjects" (most students).
          *   "Classifier Committee" (rotating role).
          *   Maybe an "Observer" role? No, keep it tight.
          *   Let's have 12 Subjects and 2 Classifiers per round. Rotating.
      *   *Mechanism:* Subjects try to match a profile. Classifiers define the profile.
      *   *The Twist:* If Subjects match too well, the Classifiers *must* adjust the definition to exclude them or refine it, making the target move.
      *   *Stakes:* Points toward participation grade or a shared pool (e.g., extra credit points for the whole class if total score hits X). Let's use a shared resource pool (e.g., "Class Credit Pool") to encourage cooperation but individual optimization creates tension.
      *   *The Loop:* Subjects learn the rule -> Subjects conform -> Classifiers see conformity as "masking" or "evolution" -> Classifiers change rule -> Subjects must re-learn.
      *   *Crucial Hacking Element:* The *kind* of person changes. The Subjects aren't just faking; they start embodying the new rule.
      *   *Refining the "Instability":* The prompt requires the category to be revised *even when everyone is successfully conforming*. This is the hard part. Usually, conformity stabilizes a category. To make it loop, the authority must interpret successful conformity as evidence that the category has permeated the population too deeply, requiring differentiation. Or, the act of classification itself alters the behavior such that the original definition no longer captures the *essence* intended.
      *   *Idea:* The category is defined by "authenticity" or "spontaneity" which is ruined by knowing the rule. But that's too simple (paradox of hedonism).
      *   *Better Idea:* The category is defined by a pattern. When the pattern becomes known, the subjects adopt it. The classifiers then argue that because it is now adopted consciously, it is no longer the "true" category, so they must redefine the category to find the "true" underlying trait, which shifts the goalposts. This mirrors how "multiple personality disorder" became "dissociative identity disorder" as patients learned the script.
      *   *Game Name:* "The Mimicry Protocol".
