  The single weakest step is **(4)**.

  The argument fails not because the sociology of nationalism is wrong, nor because the reflexive loop does not exist, but because Step (4) imposes a **foundationalist requirement on democratic legitimacy that is theoretically incoherent**. It demands that the *demos* (the people) be constituted by a ground *outside* the political process it authorizes. This is the "Boundary Problem" of democratic theory, and Step (4) treats it as a bug to be solved rather than a constitutive paradox to be managed.

  ### The Specific Error: A Hidden Premise About Circularity

  The slide occurs in the hidden premise within Step (4) that **legitimacy requires a non-circular foundation**. 

  Step (4) claims democratic legitimacy requires the boundary of the *demos* to be "stable and non-arbitrary, not revisable at will by the very authorities it authorizes." This presupposes that the *demos* must exist *prior* to the act of authorization to validate that authorization. But in democratic theory, the *demos* is not a pre-political entity like a biological species; it is a political construct brought into being *by* the very act of constitution. 

  By demanding an "independent ground" (as reiterated in Step 6), Step (4) commits a category error: it applies a standard of **liberal constraint** (limits on power) to the **democratic constituent** (the source of power). If the *demos* cannot define its own boundary, it is not sovereign. If it *can* define its boundary, the boundary is necessarily "revisable" by the authorities it authorizes. Step (4) demands sovereignty without the power of self-constitution, which is impossible.

  There is also an equivocation on the term **"arbitrary."** In Step (4), "arbitrary" implies "tyrannical" or "unconstrained." But in the context of Step (3) and (5), "arbitrary" simply means "not determined by nature or history." A boundary can be *contingent* (not historically necessary) without being *illegitimate* (tyrannical). Step (4) conflates the *lack of historical necessity* with the *lack of normative justification*, forcing the conclusion that an invented boundary cannot be legitimate.

  ### The Price of Alternatives

  To see why rejecting (4) is the only viable option, we must price the alternatives:

  1.  **If we reject (1) or (2) (The Sociology):** We deny the constructivist consensus that nations are imagined and traditions invented. The cost is empirical blindness. We would have to return to a primordialist view of nationalism that history and sociology have thoroughly discredited. This saves democratic theory only by falsifying the social world it operates in.
  2.  **If we reject (3) (The Inference):** We could argue that the *demos* boundary is legal/juridical, not narrative. While this distinguishes the *state* from the *nation*, it does not solve the problem. Legal boundaries are still set by political authorities. If the *demos* authorizes the constitution that sets the border, the loop remains. Rejecting (3) merely shifts the locus of the loop from "narrative" to "law," but the circularity of self-constitution persists.
  3.  **If we reject (6) (The Loop):** We would have to claim there *is* an independent ground (e.g., ethnicity, territory, divine right). This contradicts (1) and (2) and violates the democratic premise that authority comes from the people, not land or blood.

  ### The Cost of Rejecting (4)

  Rejecting Step (4) costs us the comfort of **foundational certainty**. We must accept that democratic borders are never fully "justified" in a pre-political sense; they are always provisional and contestable. This means democratic legitimacy is not a static state achieved by finding the "right" boundary, but a dynamic practice of **contestation**. 

  This aligns with radical democratic theory (e.g., Abizadeh, Leffort): the lack of an independent ground is not a failure of legitimacy, but the condition of freedom. If the boundary were fixed by history or nature, the people would not be free to redefine themselves. By rejecting (4), we save democracy from the charge of contradiction by admitting that the "reflexive loop" is not vicious—it is **constitutive**. The *demos* creates the boundary that defines the *demos*, and legitimacy arises not from escaping this loop, but from ensuring the loop remains open to democratic challenge.

  Therefore, Step (4) collapses because it demands a metaphysical anchor for a political practice. Giving it up costs the myth of the "natural" demos, but it preserves the possibility of democratic agency in a world of invented traditions.
