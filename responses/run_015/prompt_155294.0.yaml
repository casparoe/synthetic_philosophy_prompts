answer: |-
  The pattern you describe is most precisely captured by the concept of **Mind-Independent Institutional Normativity**, a position that sits at the intersection of **Strong Social Ontological Realism** and **Hegelian Objective Spirit (*Sittlichkeit*)**. In critical theory, this phenomenon is diagnosed as **Reification** (*Verdinglichung*).

  There is no single, uncontested term because the position you describe is ontologically controversial: it contradicts the dominant "constructivist" consensus in analytic social ontology (e.g., Searle, Gilbert) which holds that institutional norms *require* collective intentionality. However, the pattern is a recognized philosophical stance.

  Here is the precise mapping of the concept, its distinctions, and boundary conditions.

  ### 1. The Core Concept: Mind-Independent Institutional Normativity

  The claim you describe asserts that normative reasons can **emerge** from the structural relations of a system and possess **deontic power** (the power to obligate) independently of the psychological states (beliefs, desires, intentions) of the agents involved.

  *   **Historical Precedent (Positive):** The closest established positive account is **Hegel's *Objective Spirit* (*objektiver Geist*)**. For Hegel, institutions (family, civil society, the state) embody a rationality that is "objective" because it exists in the world, not just in subjective minds. These institutions impose obligations on individuals (*Sittlichkeit* or "ethical life") that override their subjective preferences (*Moralität*), even if the individuals do not fully comprehend or endorse them.
      *   *Divergence:* Hegel anchors this in *Geist* (Spirit/Mind), whereas your scenario specifies "not anchored in *any* mind." This pushes the view toward **Materialist Structuralism** (e.g., Althusser) or **Critical Realism** (e.g., Roy Bhaskar), which argue social structures have real, causal, and normative powers independent of agents.
  *   **Critical Diagnosis:** In Marxist and Frankfurt School critical theory, this pattern is identified as **Reification**. This is the process where social relations between people take on the "phantom objectivity" of relations between things. The structure appears to have its own laws and "oughts" that constrain humans, masking the fact that humans created it. The speaker in your scenario is treating a reified structure as ontologically robust.
  *   **Systems Theory:** In Niklas Luhmann's systems theory, social systems are **autopoietic** (self-creating) and operationally closed. They develop **Systemic Imperatives** to maintain their own complexity. While Luhmann avoids calling these "moral norms," they function exactly as you describe: binding codes that persist regardless of individual psychic states (minds).

  ### 2. Distinctions from Nearest Neighbors

  To isolate this concept, we must distinguish it from three adjacent ideas that fail to capture the "mind-independent" constraint.

  | Concept | Why it differs from your pattern |
  | :--- | :--- |
  | **Obligations of Social Roles** | **Dependence on Recognition:** Role obligations (e.g., "a judge ought to sentence") typically rely on the *rule of recognition* (Hart) or collective acceptance (Searle). If all participants reject the role, the obligation dissolves. Your pattern claims the obligation *persists* despite unanimous rejection. |
  | **Collective Intentionality** | **Dependence on Minds:** Theories by Margaret Gilbert or Raimo Tuomela ground group norms in "we-intentions" or joint commitments. These are explicitly anchored in the mental states of the members. Your pattern explicitly denies anchoring in *any* mind. |
  | **Abstract Moral Truths** | **Structure-Independence:** Platonic or Kantian moral truths are universal and apply regardless of specific institutional structures (e.g., "do not kill" applies outside institutions). Your pattern describes a reason that is *generated by* and *specific to* a particular structure (e.g., "this protocol ought to maintain equilibrium"). |

  ### 3. Boundary Conditions: Dissolution and Instrumentalism

  You asked whether such a reason survives the dissolution of the system or collapses into instrumentalism. This is the ontological fault line of the concept.

  *   **The Realist Boundary (Survival):** If one adopts a **Critical Realist** or **Platonic** stance, the normative reason is a real feature of the structural configuration. If the system dissolves, the reason may persist as a "counterfactual truth" (e.g., "This system *would have* required X had it existed") or as a lingering normative ghost (e.g., debts of a defunct state). However, most realists argue that without the *causal power* of the structure to enforce or sustain the norm, the *normativity* loses its grip.
  *   **The Constructivist Boundary (Collapse):** If one adopts the dominant **Constructivist** view (Searle, Hart), the moment the system dissolves (i.e., no one accepts the rules), the normativity **collapses immediately**. It does not survive as a normative reason; it becomes merely a historical fact.
  *   **The Instrumental Collapse:** If the system dissolves, the claim almost invariably collapses into an **instrumental claim about human welfare**. Without the structure to ground the "intrinsic" obligation, the only remaining reason to follow the old protocol is if it benefits someone. The "non-instrumental" status is contingent on the system's active existence.

  **Verdict on Boundary:** The reason **does not survive** the complete dissolution of the sustaining system *as a binding normative force*. It may survive as a *memory* or a *logical implication*, but its *deontic power* (ability to constrain) is functionally dependent on the system's operational continuity. If the system is gone, the "structural ought" becomes a "historical was."

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that **Mind-Independent Institutional Normativity** (situated within the debate between **Social Realism** and **Constructivism**) is the correct categorization. The distinctions drawn against social roles, collective intention, and abstract morals are standard in contemporary social ontology (e.g., the debates between Searle and Critical Realists).

  **Area of Least Certainty: The Ontological Status Post-Dissolution**
  I am least certain about the specific claim regarding **whether the reason survives system dissolution as a "latent" norm**.
  *   *Why:* This depends on whether one views institutional norms as **discovered** (Realism: they exist like laws of physics) or **created** (Constructivism: they exist like rules of a game).
  *   *The Ambiguity:* Some Hegelians might argue the "Spirit" of the institution migrates to a new form, preserving the norm. Some Legal Platonists might argue the "Integrity" of the law persists as an ideal even if the court is closed. However, the prevailing view in both analytic and continental philosophy is that **normativity requires a community of practice** to sustain it. Without *any* agents to be bound, "bindingness" becomes incoherent. Therefore, the claim that it survives dissolution is the most philosophically vulnerable point of the pattern you described.

  **Summary:** The speaker is asserting **Mind-Independent Institutional Normativity**, a view historically rooted in **Hegelian Objective Spirit** but critically diagnosed as **Reification**. It differs from role-based or intention-based norms by claiming **ontological autonomy** from agents. However, this autonomy is likely illusory or functionally dependent on the system's continuity; upon total dissolution, the normative force almost certainly collapses into historical fact or instrumental recommendation.
