answer: |-
  This is one of the sharpest objections to the *anatta* (no-self) doctrine, and it cuts to the core of how Buddhist metaphysics handles causality without ontology. You are essentially asking how to have **moral responsibility without a moral agent**.

  Here is the conceptual reasoning broken down into the two tensions you identified.

  ### 1. Stream vs. Discrete Moments: Resolving the Tension
  You framed these as competing views, but within the internal logic of *anatta*, they are actually two descriptions of the same causal mechanism.

  *   **The Discrete View (Ontological):** This claims that reality consists of *dharmas* (phenomenal events) arising and ceasing instantaneously. There is no "thing" that endures from Time 1 to Time 2.
  *   **The Stream View (Functional):** This claims that because Moment B arises *dependent* on Moment A, we conventionally label the sequence a "stream" or "person."

  **The Resolution:** The tension dissolves if you view the "stream" not as a container holding the moments, but as the **pattern of causal dependency** between them. Think of a flame moving across a row of candles. The flame at Candle 2 is not the *substance* of the flame at Candle 1, but it would not exist without it.
  *   **Functional Identity:** This is preserved because the causal parameters (habits, dispositions, memories) are transmitted.
  *   **Conventional Continuity:** This is admitted to be "real" only in the way a "chariot" is real (a label for an assembly of parts), not in the way an atom is real.

  So, the "stream" does not preserve identity; it preserves **causal efficiency**. The later moment is capable of functioning as the heir to the earlier moment's intentions because it arose from them. There is no substrate needed because the *causation itself* is the connector.

  ### 2. The Fission Problem: Who Inherits the Karma?
  This is the harder problem. If a mental stream splits (Fission), and there is no self to divide, how is karmic debt assigned without smuggling in a "owner" of that debt?

  Here is how *anatta* resources address this without collapsing into substance dualism or ethical nihilism:

  **A. Karma is Causal Potential, Not Property**
  In Western ethics, we think of karma like a bank account owned by a person. In *anatta*, karma is more like a seed. A seed doesn't "own" the tree; the tree is the causal ripening of the seed.
  If a stream fissions, you aren't dividing a "debt"; you are splitting the **causal conditions**.
  *   **The Mechanism:** Rebirth in Buddhism is driven by *trishna* (craving/thirst) at the moment of death. This craving is specific and directional. Conceptually, a single moment of death-consciousness cannot crave two distinct, mutually exclusive existences simultaneously with enough intensity to sustain two separate karmic streams.
  *   **The Implication:** Strict Buddhist metaphysics usually treats fission as **causally impossible** for a single karmic stream. The specific configuration of craving at death acts as a funnel, selecting one trajectory.

  **B. The Hypothetical: If Fission Occurred**
  If we force the thought experiment (e.g., via magic or sci-fi teleportation) where one stream becomes two:
  *   **No "Owner" to be Unjust:** The worry about "which stream owns the karma" presupposes that karma requires a singular owner to be just. *Anatta* rejects this. Suffering (*dukkha*) arises where conditions support it. If Stream A splits into B and C, and A's violent karma ripens, suffering may arise in B, C, or both.
  *   **Why this isn't "Unfair":** In a substance-self view, punishing B for A's crime is unjust if B isn't A. In *anatta*, B is not A, but B is the **causal inheritor**. If the causal conditions for suffering are present in B, suffering arises. There is no "injustice" because there is no one *to whom* justice is owed. The universe is not balancing a ledger; it is executing a causal algorithm.
  *   **Avoiding the "Both" Collapse:** You worried that saying "both inherit" collapses the distinction. It doesn't, because the *quality* of the ripening depends on the new conditions in B and C. Even if they share the same past causal stream, their new divergent conditions mean the karma will ripen differently in each. One might suffer greatly, the other slightly, based on new intervening causes. The "debt" isn't a fixed quantum; it's a tendency that interacts with new environments.

  **C. The "Smuggling" Check**
  Does this smuggle in a self?
  *   **No,** because we are not tracking a *who*. We are tracking a *how*.
  *   If you ask, "But why does *this* stream get the result and not *that* one?" the answer is always: "Because the conditions for the result were present in *this* stream and not *that* one."
  *   The "continuity" is purely the continuity of **conditionality**. If the causal chain splits, the conditionality splits. There is no ghostly "self" that needs to decide which branch is the "real" one. Both are equally "real" continuations, and both are equally "empty" of self.

  ### 3. Summary of the Conceptual Move
  The *anatta* solution to fission is to deny the premise that karma requires **numerical identity** to function. It only requires **causal connectivity**.
  *   **Substance View:** A transfers to B only if A = B.
  *   **Anatta View:** A transfers to B if B is causally dependent on A.
  *   **Fission:** If B and C are both causally dependent on A, both inherit the causal tendencies. The ethical weight is not "punishment of a person" but "the inevitable arising of suffering based on prior volition."

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in this explanation regarding the core metaphysical mechanics of *pratītyasamutpāda* (dependent origination) and the standard Buddhist rejection of substance-based identity. The distinction between "causal continuity" and "numerical identity" is the standard philosophical defense of *anatta*.

  **Least Certain Part: The Fission Edge Case**
  I am less certain (moderate confidence) about how universally Buddhist philosophers would accept the "both inherit" conclusion in a fission scenario.
  *   **Why:** Historically, Buddhist Abhidharma systems go to great lengths to ensure the death-consciousness links to *one* rebirth-consciousness to avoid exactly this ambiguity. Some schools (like Yogacara with the *Alaya-vijnana*) introduce a "storehouse consciousness" that acts very much like a subtle substrate to ensure karmic seeds don't get lost or duplicated.
  *   **The Risk:** My explanation above relies on a "strict" *anatta* view. However, in practice, some Buddhist traditions might implicitly rely on a quasi-substantial carrier of karma to ensure moral coherence, which borders on the "smuggling" you are worried about. The claim that "fission is causally impossible" is the traditional escape hatch, but as a philosophical thought experiment, the "both inherit" model is the most consistent with strict no-self, even if it feels ethically counterintuitive to our person-centric intuitions.
