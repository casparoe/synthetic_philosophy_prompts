  write the agreed-claims section: what both can sign about metabolism, reproduction, and borderline cases like prions or viroids. then the exact disagreements in wording each side would accept for its own view. identify the cruxes — i think one is whether thermodynamic debt inheretance is necessary and another is whether informational replication without chemical substrate counts. for each crux, give a concrete hypothetical case both agree bears on it (like a non-carbon protocell that achieves closure and evolves in total isolation, or a perfect digital simulation of evolving metabolic networks). record each side's prediction for that case.

