          *   Avicenna: Yes, directly. That's the point.
          *   Descartes: Indirectly/Eventually. The Cogito proves existence, *later* arguments (Real Distinction) prove separability from body.
      *   *Where do they diverge?*
          *   Method: Intuition (Avicenna) vs. Radical Doubt (Descartes).
          *   Focus: Ontology (Avicenna) vs. Epistemology (Descartes).
          *   Role of Body: Avicenna says body is irrelevant to self-awareness. Descartes says body is doubtful, mind is certain.
      *   *Which makes the stronger case for survival?*
          *   Avicenna is more explicit about the *independence* of the soul from the get-go.
          *   Descartes requires more steps (God's benevolence, clear and distinct perceptions) to get to dualism.
