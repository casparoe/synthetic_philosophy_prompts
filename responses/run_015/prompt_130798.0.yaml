  ## Limitation Statement (For Facilitator)
  **What the Rules Cannot Reproduce:**
  The activity **cannot** reproduce the **total absence of intentionality**.
  *   **In Phase 1:** You (the Facilitator) created the decks, the rule, and the extinction events. You are the Intelligent Designer of this micro-evolution.
  *   **In Phase 2:** You curated the logs to ensure a specific outcome.
  *   **The Fix:** You must explicitly state this in the debrief. *"This simulation required a designer (me) to show you how design can emerge without a designer (in nature). The map is not the territory. The inversion holds in the real world because the 'Facilitator' (Natural Selection / Computational Physics) has no mind, whereas I do."*

  **What the Rules Cannot Reproduce (Phenomenology):**
  *   **In Phase 2:** You cannot remove the students' own phenomenological access to *their own* minds. They know *they* understand the task, even if they award points to a box that doesn't.
  *   **The Fix:** Frame this as the "Hard Problem" boundary. *"You feel your own comprehension. You infer competence in others (and machines) only by output. Turing's inversion asks: Is that inference enough for science?"*

