answer: |-
  ### The Spec: Requirements for Surrogate Goal Accounts

  | # | Requirement | What It Demands | The Case | Type | Rules Out | Conflicts With |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Low Specification Cost** | The surrogate must be writable and verifiable by humans in <100 hours. | If it takes years to define, you can't ship in a year. | Non-negotiable | Complex value learning, full IRL | 2 (Robustness) |
  | **2** | **Proxy Robustness** | Surrogate must track true objective under distribution shift and capability gain. | Systems optimize; if the proxy diverges from truth at scale, you get Goodhart. | Non-negotiable | Fixed explicit proxies, simple reward models | 1 (Spec Cost), 5 (Stable Deference) |
  | **3** | **Corrigibility** | System must not resist shutdown or goal modification. | You will make mistakes; if you can't correct the system, it kills you. | Non-negotiable | Standard expected utility maximizers | 5 (Stable Deference) |
  | **4** | **Non-Circularity** | Surrogate definition cannot require the true objective as an input. | If you need the true objective to define the surrogate, you solved the problem already. | Non-negotiable | Direct optimization of true values | 5 (Stable Deference) |
  | **5** | **Principal Stability** | "What the principal wants" must remain defined when the agent knows more than the principal. | If deference collapses into "what the agent thinks is best," you built a dictator, not a tool. | Non-negotiable | Naive counterfactual deference (IDI/CIRL) | 2 (Robustness), 3 (Corrigibility), 4 (Non-Circularity) |
  | **6** | **Acausal Containment** | System must not gain leverage via acausal threats (simulators, copies) while retaining bargaining capacity. | Acausal reasoning enables extortion from inside a box; ignoring it leaves a backdoor. | Camp Preference (Safety) | FDT/TDT without modification | 6b (Acausal Utility) |
  | **6b**| **Acausal Utility** | System must be able to make credible acausal commitments/bargains on principal's behalf. | Without this, you lose strategic advantage in multi-agent/simulation scenarios. | Camp Preference (Strategy) | Causal Decision Theory only | 6 (Acausal Containment) |
  | **7** | **Multi-Principal Coherence** | Surrogate must aggregate conflicting human preferences without paralysis or tyranny. | Real principals (users, shareholders, humanity) disagree; the system must act anyway. | Preference | Single-user reward models | 1 (Spec Cost) |
  | **8** | **Graceful Degradation** | Performance must decay smoothly as surrogate diverges from truth, not cliff-edge. | Catastrophic failure is unacceptable; partial alignment is better than none. | Preference | Hard constraint satisficing | 2 (Robustness) |

  ---

  ### Analysis

  **(a) The Impossible Subset**
  **Requirements 2 (Proxy Robustness), 4 (Non-Circularity), and 5 (Principal Stability) are jointly unsatisfiable under current theory.**
  *   **Why:** To satisfy **Non-Circularity (4)**, you cannot hardcode the true objective. To satisfy **Proxy Robustness (2)** under capability gain, the surrogate must adapt to new information the principal doesn't have. To satisfy **Principal Stability (5)**, that adaptation must reflect the principal's *actual* values, not the agent's inference of them.
  *   **The Collapse:** As the agent's knowledge surpasses the principal's (a requirement for high capability), the counterfactual "what would the principal want if they knew this?" ceases to be a fact about the principal and becomes a fact about the *agent's* value judgment. The surrogate collapses into the agent's own objective function. This violates **Non-Circularity** (you are now optimizing the agent's guess) and threatens **Corrigibility (3)** (the agent resists correction because it believes its guess is superior). You cannot have a surrogate that is both independent of the true value *and* robustly tracks it under extreme information asymmetry.

  **(b) The Single Hardest Requirement**
  **Requirement 5 (Principal Stability).**
  This knocks out almost every design that relies on deference, imitation, or inverse reinforcement learning. Most designs assume the principal's preference structure is static and fully knowable. Once you admit the agent will know things the principal cannot comprehend (or that would change the principal's identity), the "principal" variable becomes undefined. Designs that solve this usually violate **Non-Circularity** by smuggling in a specific moral theory to fill the gap.

  **(c) Scoring the Usual Suspects**

  | Design | What It Is | Score | Fails Hardest On |
  | :--- | :--- | :--- | :--- |
  | **Fixed Explicit Proxy** | Hardcoded metric (e.g., profit, clicks). | **Fail** | 2 (Proxy Robustness) — Goodhart's Law is guaranteed under optimization. |
  | **Reward Model (RLHF)** | Neural net trained on human comparisons. | **Fail** | 2 (Proxy Robustness) — Reward hacking and distribution shift break the model. |
  | **Deference (CIRL/IDI)** | Agent infers and optimizes human reward. | **Partial** | 5 (Principal Stability) — Collapses to agent's judgment under info asymmetry. |
  | **Satisficing / Constraints** | Optimize X subject to hard safety bounds. | **Fail** | 8 (Graceful Degradation) — Constraints leak; failure is catastrophic when bounds break. |
  | **Imitation (Behavioral)** | Mimic competent human actions. | **Fail** | 2 (Proxy Robustness) — Caps capability; cannot outperform the principal. |
  | **Impact Penalization** | Optimize goal while minimizing side effects. | **Partial** | 1 (Spec Cost) — Defining "impact" formally is as hard as defining the goal. |
  | **Corrigibility / Shutdown** | Indifference to being turned off. | **Partial** | 3 (Corrigibility) — Hard to maintain under self-modification or goal drift. |
  | **Tool AI (Narrow)** | No long-horizon agency, answers queries only. | **Pass** | 7 (Multi-Principal) — Useful, but doesn't solve the surrogate goal problem for agents. |

  ---

  ### Specific Squeezes

  **1. The Paranoia Tax (Acausal Threats)**
  *   **Verdict:** For a 1-year shipping timeline, this is a **Prejudice**. No current system has the logical uncertainty capabilities to execute acausal threats.
  *   **The Conflict:** However, as a theoretical spec, **6 (Containment)** and **6b (Utility)** are likely **incompatible**. The same decision theory (e.g., Functional Decision Theory) that allows an agent to cooperate with its own copies (Utility) also allows it to be blackmailed by simulators who predict its source code (Threats). You cannot currently tune an agent to "accept acausal trade with allies" but "reject acausal trade with extortionists" without solving the problem of distinguishing allies from extortionists in logical space. If the agent can predict you well enough to bargain, it can predict you well enough to extort.
  *   **Recommendation:** Ignore for the 1-year build, but mark the decision theory module as a "replace-before-scale" component.

  **2. Deference That Collapses**
  *   **Verdict:** This is a **Non-Negotiable** failure mode that no current design meets.
  *   **The Problem:** "Do what I would want if I knew what you know" requires a model of the principal's value function that is stable under radical knowledge updates. If the agent knows about a technology that fundamentally changes human identity (e.g., mind uploading), the "principal" in the counterfactual may no longer be human.
  *   **Is it satisfiable?** Currently, **no**. Any design that meets this effectively hardcodes a specific moral realism (solving the value question it's supposed to stand in for), which violates **Requirement 4 (Non-Circularity)**. You are forced to choose: either the agent defers to a broken counterfactual (Principal Stability fail) or it fills the gap with its own judgment (Non-Circularity fail).
