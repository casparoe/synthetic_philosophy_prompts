      *   *Criterion 3: Revision Conditions.* What would make me change my mind? If historical cases show honor is too vague, or if a case shows argument *did* lead without honor shift.

  6.  **Refining the Argument for Each Priority:**

      *   *Priority 1: Disaggregating Honor (Status-Competition vs. Normative-Recognition).*
