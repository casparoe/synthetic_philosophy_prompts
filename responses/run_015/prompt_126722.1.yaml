      *   *Wait, let's reconsider Williams.* Williams argues argument *follows* shift. If we don't know *what* shifts (Honor vs. Interest), we can't test Williams. So Honor definition is definitely #1.
      *   *Is Interest/Honor conflict more important than Williams?* For a group wanting "practical understanding of moral change," knowing how to navigate conflicts is more actionable than settling a meta-ethical debate about the efficacy of reason. So Conflict is #2.
