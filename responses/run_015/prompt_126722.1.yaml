  2.  **Deconstruct the Competing Theses & Gaps:**
      *   *Argument Thesis:* People change because they are convinced by logic/morality. (Often seen as too idealistic).
      *   *Interest Thesis:* People change because it pays off economically/politically. (Often seen as too cynical/reductionist).
      *   *Appiah Thesis:* People change because the practice becomes dishonorable/shameful. It's about social identity and recognition.
      *   *Williams's Skepticism:* Argument alone doesn't move the needle; it needs a hook in psychology or social structure (like honor/interest) first.
      *   *The Gaps:*
          1.  *Nature of Honor:* Is it "I want to be better than you" (competition) or "I want to be seen as a good member" (recognition)?
          2.  *Tempo:* Why do some norms vanish overnight (tipping points) while others fade slowly?
          3.  *Conflict:* What happens when doing the "honorable" thing costs money (interest), or when saving money is "dishonorable"?

  3.  **Evaluate Potential Research Questions (based on constraints):**
      *   *Question A (Appiah Precision):* Can we define "honor" well enough to apply it to modern issues (tech ethics, climate) beyond 19th-century dueling?
