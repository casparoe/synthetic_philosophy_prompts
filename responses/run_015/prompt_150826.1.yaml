answer: |-
  Here's the scratchpad brainstorm before I flesh it out:

  *   **Core Tension:** Meritocracy (contractual) vs. Constitutive Debt (relational).
  *   **Characters:** Manager (Elena), Candidate A (Marcus - merit), Candidate B (Sarah - history).
  *   **The "Interstitial" Bit:** Needs to be something vital but unrecorded. Sarah covering for Elena's early mistakes is good. It's not a loan; it's a gift that enabled Elena's existence in this role.
  *   **Structural Feature:** "Non-contractual Temporal Reciprocity." The debt exists across time without explicit agreement.
  *   **Individualist Counter:** It's not just "rules matter," it's that using institutional power to pay personal debts treats the organization as a means to an end, violating the autonomy of other agents (Marcus) who entered the contract expecting impartiality.

  ***

  **The Case**

  Elena manages a mid-sized logistics firm where a senior director role just opened up. Her two direct reports are up for it: Marcus, who has the highest KPIs in the department, flawless compliance records, and no personal ties to Elena; and Sarah, whose metrics are solid but unspectacular, yet five years ago, when Elena was a risky new hire prone to early blunders, Sarah quietly fixed Elena's critical errors and vouched for her credibility to leadership without ever documenting it or asking for credit. HR policy mandates promotion based strictly on measurable merit and future potential, which points squarely to Marcus, but Sarah's past interventions were the necessary condition for Elena ever securing her own managerial standing, creating an unrecorded debt that exists solely in the interpersonal history between the two women.

  **The Reasoning Split**

  From a **liberal individualist** view, Elena is an autonomous agent bound by explicit contracts. Her primary obligation is to the firm (her employer) and to fairness (impartial application of rules). Since Sarah's past help was voluntary and uncontracted, it generates no claim on future goods like promotions. Promoting Marcus honors the meritocratic contract all employees consented to upon hiring. The self is prior to its ends; Elena's personal history doesn't override her professional duty.

  From a **Confucian relational** view, Elena isn't a standalone atom; she is constituted by her roles and relationships. She is only "Manager Elena" because "Mentor Sarah" made her so. To promote Marcus is to act as if she self-authored her success, which is metaphysically false. The obligation to Sarah is *interstitial*—it lives in the gap between job descriptions. Ignoring it fractures the web of *ren* (humaneness) that sustains the organization's actual functioning. Promoting Sarah isn't favoritism; it's acknowledging the constitutive conditions of Elena's own identity.

  **The Structural Feature & Collapse**

  The split is forced by **non-contractual temporal reciprocity**. This is the idea that obligations can accrue over time without explicit consent, binding the present self to the past actions of another. If you remove this feature—if you assume all obligations must be contemporaneous and consented to—the relational view collapses into simple nepotism. Without the temporal depth, Sarah is just a friend getting a favor. With it, denying Sarah is a form of self-erasure for Elena; she denies the very lineage that makes her authority legitimate.

  **The Individualist Counter-Attack**

  A sharp individualist won't just yell "collectivism bad." They'll argue that Elena's relational duty violates Marcus's **right to impartiality**. Marcus entered the workplace contract expecting a neutral framework where his effort converts to opportunity. By using institutional resources (the promotion) to settle a private, unrecorded debt, Elena treats the firm as a personal currency exchange. This undermines the autonomy of every other employee who relies on the institution to be blind to personal history. It turns the workplace into a feudal clan where security depends on knowing the boss's secrets, not on your own agency.
