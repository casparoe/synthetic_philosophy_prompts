      - Criterion clear? (Yes, Independent Corroboration).
      - Test Case included? (Yes, Resource Depletion).
      - Verdict determinate? (Yes, Falsified as macro-theory).

      *Wait, one constraint:* "A disjunctive verdict is acceptable... provided each half is argued for and the combination is stable." Okay, I will use that.

      *Another constraint:* "State, explicitly and in general form, a criterion for when a right-but-early defence is admissible, set it out before applying it to Malthus". I must ensure this order is respected.

      *Let's begin.*
answer: |-
  The Malthusian hypothesis stands as the archetype of the failed long-run prediction. It posits a fundamental tension between population growth, which tends to expand geometrically, and subsistence, which expands only arithmetically. The inevitable collision was meant to pin income per head near a biological floor, ensuring that any temporary gain in prosperity would be swallowed by further mouths. Yet, for two centuries, the opposite has occurred: population and income have risen together. The question is not merely historical but methodological. When a theory predicts a catastrophe within a specific window and that window closes without event, do we file the theory as falsified, or as right-but-early? This distinction is not semantic; it determines whether we treat the theory as a error to be discarded or a dormant risk to be managed. To answer this, we must first dissect the available defences, establish a rigorous criterion for their admissibility, and test that criterion against a parallel case.

  Defences of the right-but-early variety are often bundled together, but they possess distinct logical structures. The first is **defence by deferral**. This argues that the mechanism is intact and the causal chain is correct, but the timing was miscalculated. The catastrophe is not cancelled; it is postponed. The second is **defence by screening**. Here, the mechanism is acknowledged as valid, but it is argued that a countervailing force of unusual magnitude has masked the effect. In the Malthusian case, this is usually technological progress. The trap exists, but we have built a ladder out of it. The third is **defence by re-scaling**. This concedes that the theory does not bind at the level of whole economies over long horizons but insists it still binds locally or over short intervals. The domain of the theory shrinks, but the mechanism remains. The fourth is **defence by re-description**. This quietly rewrites the central quantity. If income per head is no longer pinned near subsistence, perhaps the constraint is now 'environmental carrying capacity' or 'resource depletion'. The theory is saved by changing what is being measured.

  The danger with these defences is the cheapness objection. If any failed prediction can be rescued by positing a temporary countervailing force or shifting the goalposts, then 'right-but-early' is not an epistemic achievement but a rhetorical licence. It renders the theory unfalsifiable. To prevent this, we require a general criterion for when a right-but-early defence is admissible. A rescue is legitimate only if it satisfies the **Rule of Independent Corroboration**. This rule has two conditions. First, the countervailing force (the shield) must be identifiable and measurable independently of the theory's failure. It cannot be a ghost invoked solely to explain why the prediction did not happen. Second, the core mechanism must retain predictive power in a domain where the countervailing force is absent or controlled. The theory must predict something *else* correctly, or hold true in a specific sub-context, without relying on post-hoc adjustments. If a theory cannot explain a smaller, controlled system, it has no claim to explain the larger, complex one.

  Applying this criterion to Malthus reveals a fractured verdict. Consider defence by deferral. This fails the Rule of Independent Corroboration. There is no independent measure suggesting the geometric-arithmetic gap is merely waiting to close. The 'delay' is inferred entirely from the failure of the prediction, not from demographic data showing a pending explosion unmet by food supply. Consider defence by screening. This posits technology as the shield. While technology is independently measurable, the Malthusian framework did not predict the shield's magnitude, nor did it account for the decoupling of fertility from income as wealth rose. The mechanism (population rises with food) broke, rather than being masked. When income rose, population growth eventually slowed, violating the core premise that subsistence gains automatically convert to population gains.

  However, defence by re-scaling passes the test. In pre-industrial societies, or in specific ecological niches where technology is static, the Malthusian mechanism holds robustly. Historical data suggests that for most of human history, income per head was indeed pinned near subsistence, and population shocks correlated with agricultural output. Furthermore, in non-human populations, the logistic growth curve Malthus described remains a biological law. The mechanism is real, but its domain is limited to contexts where technological innovation is exogenous or absent. Finally, defence by re-description fails. Changing 'subsistence' to 'environmental capacity' alters the theory so fundamentally that it becomes a different hypothesis with different failure modes.

  Thus, on Malthus alone, the verdict leans towards falsification as a general law of history, but validation as a local biological constraint. To ensure our criterion is not tailored to fit this result, we must test it against a different long-run prediction. Consider the theory of **resource depletion peaks**, prominent in the late twentieth century. This hypothesis predicted that finite physical resources, specifically hydrocarbons, would reach a production peak, causing prices to skyrocket and economic contraction to follow within a specific window.

  Like Malthus, this prediction has largely failed to materialise in the predicted window. Prices have fluctuated but not permanently spiked to collapse levels, and production has continued to rise. Proponents offer a right-but-early defence: the peak is delayed by new extraction technologies (fracking, deepwater drilling). Does this satisfy the Rule of Independent Corroboration? The countervailing force (extraction technology) is independently measurable. However, the second condition is trickier. Does the mechanism hold in a domain without the shield? In specific, closed oil fields, production does follow a bell curve and decline. The physical mechanism of depletion is real locally. Yet, unlike Malthus, the economic variable (price) did not behave as predicted even when scarcity was anticipated. The market adapted via substitution and efficiency, not just extraction.

  If we apply the criterion strictly, the resource depletion theory, like Malthus, is falsified as a macro-economic prophecy but validated as a geological fact. The error in both cases was not the physical constraint, but the assumption that human economic behaviour would remain static in the face of that constraint. The criterion successfully distinguishes between the 'cheap' defence (the peak is just next year) and the 'earned' defence (the physics holds, the economics did not). It prevents the theory from claiming victory based solely on the passage of time.

  This comparison illuminates the status of the Malthusian hypothesis. The 'right-but-early' label is often applied to Malthus to suggest that the bill for population growth is merely overdue. This is a category error. The bill was not delayed; the pricing structure changed. The demographic transition, where higher income leads to lower fertility, broke the link Malthus deemed inevitable. Therefore, the defence by screening is insufficient because the screen did not just hide the mechanism; it rewired the connection between the variables.

  Consequently, we must deliver a determinate verdict. The Malthusian hypothesis should be filed as a theory that was **falsified in its historical scope but preserved in its biological mechanism**. It is not 'right-but-early' in the sense that the global catastrophe is imminent. The deferral defence is epistemically bankrupt because it relies on a threat that has diminished, not intensified, as wealth has grown. To call it right-but-early is to misunderstand the nature of the failure. The failure was not in the clock, but in the engine.

  However, to discard it entirely would be to lose a vital insight into local constraints. The re-scaling defence is legitimate. In contexts where innovation is stalled, or in ecological systems devoid of technological feedback, the Malthusian trap remains the dominant dynamic. It is a theory of biology that was mistaken for a theory of history.

  The distinction matters for how we reason about future risks. If we treat Malthus as right-but-early, we prepare for a population crash driven by starvation. If we treat it as falsified but locally valid, we understand that population pressures are manageable through innovation, yet we remain vigilant about specific ecological niches where innovation cannot penetrate. The 'cheapness objection' warns us against keeping dead theories on life support simply because they sound prudent. A theory that cannot predict the behaviour of the system it describes, without constant ad-hoc adjustment to the timing or the variables, has lost its explanatory power.

  In conclusion, the Malthusian hypothesis is not a dormant volcano waiting to erupt. It is a map of a terrain we have largely left behind. The verdict must be that the general law is falsified. The 'right-but-early' defence is inadmissible under the Rule of Independent Corroboration because the mechanism does not operate globally as described, and the countervailing forces were not merely temporary shields but permanent structural changes to the relationship between subsistence and reproduction. We retain the theory only as a specific tool for specific contexts, not as a general prophecy. To do otherwise is to confuse the persistence of a constraint with the validity of a prediction. Science progresses not by deferring falsification, but by recognising when a mechanism has been superseded by a more complex reality. Malthus identified a pressure, but he mistook a local friction for a universal law of motion.
