answer: |-
  The irreconcilable conflict lies between the demand for static historical fidelity and the imperative of present civic dignity, and only a contextualist theory that prioritizes non-domination while mandating archival preservation survives rigorous scrutiny.

  1.  **Semantic Drift Responsiveness**
      *   **Motivating Case:** A monument whose referential content has drifted so that locals no longer associate the name with the original figure.
      *   **Principle:** Public symbols must maintain intelligible communicative function; if the signifier no longer connects to the signified, the object loses its commemorative justification and becomes mere clutter or confusion.
      *   **Status:** Non-negotiable.
      *   **Conflict:** None directly, but relies on the Honour/Reference distinction to determine if the drift matters.

  2.  **Functional Necessity Exception**
      *   **Motivating Case:** A street named after someone whose actions are now judged harmful but whose name serves as an indispensable navigational and historical coordinate.
      *   **Principle:** Practical utility and social cost can outweigh symbolic disvalue provided the harm is mitigated through contextualization rather than removal.
      *   **Status:** Camp-specific preference (utilitarians weigh this heavily; deontologists may reject any retention of harmful names).
      *   **Conflict:** Jointly unsatisfiable with **Truthfulness** if the functional necessity requires suppressing the harmful history to maintain smooth navigation, though ideally resolved via placarding.

  3.  **The Honour/Reference Distinction**
      *   **Motivating Principle:** The distinction between honouring and merely referring.
      *   **Principle:** A theory must differentiate between state endorsement of a figure's virtues and the state's neutral use of a figure as a historical marker.
      *   **Status:** Non-negotiable.
      *   **Eliminator:** This is the single requirement that eliminates the largest share of existing proposals, as most binary "keep/remove" frameworks fail to account for neutral reference, forcing a false choice between canonization and erasure.

  4.  **Procedural Legitimacy**
      *   **Motivating Principle:** The distinction between democratic decision and expert curation.
      *   **Principle:** Decisions must arise from a process that balances popular sovereignty with historical expertise to prevent both technocratic elitism and mob rule.
      *   **Status:** Camp-specific preference (democrats prioritize vote weight; liberals prioritize rights-based constraints on the vote).
      *   **Conflict:** Jointly unsatisfiable with **Anti-Erasure** if the democratic will is explicitly defined as the power to erase all traces of disapproved pasts without constraint.

  5.  **Harm Priority**
      *   **Motivating Constraint:** The distinction between harm to present citizens and distortion of collective memory.
      *   **Principle:** Preventing active dignitary harm or intimidation to living marginalized groups takes precedence over preserving an undistorted collective memory, which can be corrected via education rather than statues.
      *   **Status:** Non-negotiable.
      *   **Conflict:** Jointly unsatisfiable with **Static Historical Fidelity** (the demand that physical heritage remain untouched regardless of social impact); one must yield, and here fidelity yields.

  6.  **Truthfulness**
      *   **Motivating Constraint:** It must not require a society to maintain false historical narratives.
      *   **Principle:** Commemorative infrastructure cannot be used to propagate lies, even if those lies are comforting or unifying; removal is preferable to falsification.
      *   **Status:** Non-negotiable.
      *   **Conflict:** Tensions with **Functional Necessity** if retaining a name implies endorsement, requiring robust contextual addenda to avoid falsehood.

  7.  **Anti-Erasure**
      *   **Motivating Constraint:** Nor allow majoritarian whim to erase all traces of disapproved pasts.
      *   **Principle:** Collective memory requires continuity; a society that scrubs all evidence of its moral failures loses the capacity for moral learning and risks repeating them.
      *   **Status:** Non-negotiable.
      *   **Conflict:** Jointly unsatisfiable with **Harm Priority** if the presence of *any* trace is deemed constitutive of harm rather than merely symbolic; the theory must define a threshold where harm outweighs the duty to remember.
