prompt: |-
  I'm stuck on the intro of a paper about dispositions and I want the spec nailed down before I look at any actual views. What does a theory of what it is for a thing to have a disposition have to deliver? Not more examples of dispositions — the requirements: which cases it has to get right, which distinctions it can't collapse, which constraints it can't violate, with the case or consideration behind each.

  Purpose, so adequacy has something to be relative to: I need the account to do two jobs. First, tell me whether a disposition ascription is true in a concrete setting — the sort engineers and regulators make all the time: this alloy is corrosion-resistant in seawater, this cluster is fault-tolerant, this model is robust to distribution shift. Second, tell me whether ascribing a disposition can ever explain the manifestation, or is always just a redescription of it.

  Cases I want on the list at minimum: the fink (the stimulus destroys the basis), the mask (manifestation blocked, disposition retained), the mimic (no disposition, but on stimulus the manifestation shows up anyway), the antidote (stimulus produces something else entirely), irreducibly chancy manifestations like a radium atom's decaying — what even is the stimulus there, and what is the manifestation condition? — and one-shot dispositions whose exercise destroys or alters the bearer, like fragility, or a self-sealing tyre that manifests by acquiring a mask. Plus two of my own:

  The selective fink. A guardian device repairs the sample only when the impact exceeds a threshold, so below the threshold it shatters and above it doesn't. Is that a disposition with a restricted stimulus condition, a finked disposition, or a disposition whose ceteris paribus clause excludes guardians — and whatever you say, does the theory still handle masks the same way, or does it have to treat the two differently?

  The distributed bearer. A server cluster that's fault-tolerant, or a colony that thermoregulates: no single node has anything like the disposition and the "basis" isn't a microstructure. If the theory needs a categorical basis in the bearer, what's the bearer here and what's the basis?

  For each requirement, say whether it's a genuine desideratum or a prejudice of one camp — I suspect the demand that the ceteris paribus conditions be spelled out in non-dispositional terms is negotiable, and that the demand that dispositions be intrinsic is a camp preference dressed up as data. Flag any pair that can't be jointly satisfied; my guess is you can't have both "handle masks without circularity" and "give necessary and sufficient conditions", but I want to know which other subsets blow up. And name the single requirement that excludes the most candidates. You can score the usual suspects — simple conditional analysis, the revised conditional analysis, mutual manifestation views, dispositional essentialism — in a line each at the end, but the list is what I actually want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Define the requirements (desiderata/constraints) for a theory of dispositions *before* evaluating specific views.
      *   **Purpose:** Two-fold: (1) Truth-conditions for concrete ascriptions (engineering/regulatory context), (2) Explanatory power (is it just redescription?).
      *   **Mandatory Cases:** Fink, Mask, Mimic, Antidote, Chancy (radioactive decay), One-shot (fragility/self-sealing).
      *   **User's Specific Cases:** Selective Fink (threshold repair), Distributed Bearer (cluster/colony).
      *   **Critical Analysis:** Distinguish genuine desiderata from camp prejudices. Identify incompatibilities (trade-offs). Identify the "hardest" requirement (excludes most candidates).
      *   **Output Format:** List of requirements with case/consideration behind each, status (desideratum vs. prejudice), incompatibility flags, and a brief scoring of standard views at the end.

  2.  **Deconstruct the Purpose:**
      *   *Job 1 (Truth-Conditions):* Needs precision. Engineers need to know *when* "corrosion-resistant" is true. This implies the theory must handle context, stimulus specification, and manifestation conditions rigorously.
      *   *Job 2 (Explanation):* Needs metaphysical heft. If dispositions are just shorthand for conditionals, they don't explain *why* the manifestation happens. The theory must allow dispositions to be causal/explanatory bases, not just summaries of behavior.

  3.  **Drafting the Requirements (incorporating the cases):**

      *   *Requirement 1: The Fink/Mask/Mimic Triad.*
          *   Case: Fink (disposition lost upon stimulus), Mask (disposition present but blocked), Mimic (no disposition but looks like it).
          *   Constraint: The theory must distinguish intrinsic basis from extrinsic interference.
          *   Status: Genuine desideratum (otherwise 'fragile' means nothing if a guardian angel prevents breaking).

      *   *Requirement 2: The Antidote/Interference Constraint.*
          *   Case: Antidote (poison + antidote = no death).
          *   Constraint: Must distinguish "disposition not present" from "disposition present but neutralized."
          *   Status: Genuine desideratum (crucial for safety engineering/toxicology).

      *   *Requirement 3: The Stochastic/Chancy Constraint.*
          *   Case: Radium decay.
          *   Constraint: Cannot require deterministic manifestation. Must handle probabilities. What is the stimulus? (Time? Nothing?)
          *   Status: Genuine desideratum (physics demands it).

      *   *Requirement 4: The One-Shot/Self-Defeating Constraint.*
          *   Case: Fragility (breaks), Self-sealing tire (manifests by losing the disposition).
          *   Constraint: Manifestation can alter/destroy the basis. The theory can't require the bearer to persist unchanged to verify the disposition.
          *   Status: Genuine desideratum.

      *   *Requirement 5: The Selective Fink (User's Case).*
          *   Case: Threshold repair.
          *   Constraint: Must distinguish between a disposition with a complex stimulus condition vs. a disposition interfered with by a specific extrinsic mechanism.
          *   Status: Genuine desideratum (tests the granularity of the stimulus clause).

      *   *Requirement 6: The Distributed Bearer (User's Case).*
          *   Case: Server cluster, ant colony.
          *   Constraint: Cannot demand a localized, microstructural categorical basis in a single substance. Must allow functional/systemic bases.
          *   Status: *Potential Prejudice.* Traditional metaphysics likes intrinsic bases. Engineering likes functional roles. This is a clash point.

      *   *Requirement 7: The Explanatory Non-Circularity.*
          *   Purpose: Job 2.
          *   Constraint: Ascribing the disposition must explain the manifestation, not just restate "if stimulated, it manifests."
          *   Status: Genuine desideratum (for the explanatory job).

      *   *Requirement 8: The Ceteris Paribus Specification.*
          *   Constraint: Can the "normal conditions" be spelled out non-dispositionally?
          *   Status: *Prejudice.* Many argue this is impossible. Requiring it kills most modern theories.

      *   *Requirement 9: Intrinsicality.*
          *   Constraint: Must dispositions be intrinsic to the bearer?
          *   Status: *Prejudice.* Distributed bearer case challenges this directly.

  4.  **Identifying Incompatibilities (The "Blow Up" Points):**
      *   *Intrinsicality vs. Distributed Bearer:* If you demand strict intrinsicality, you lose the cluster/colony cases (or have to do gymnastics to define the 'whole' as the bearer).
      *   *Non-Dispositional CP Clauses vs. Mask/Antidote:* If you can't use dispositional terms to define "normal conditions," you struggle to rule out masks without circularity.
      *   *Necessary & Sufficient Conditions vs. Mask/Fink:* Simple conditional analysis fails here. Revised versions often become trivial or circular.
      *   *Explanatory Power vs. Reductive Analysis:* If you reduce dispositions to conditionals (RCA), you lose the explanatory oomph (Job 2). If you keep them primitive (Dispositional Essentialism), you gain explanation but lose reductive clarity.

  5.  **Identifying the "Single Requirement that Excludes the Most Candidates":**
      *   Candidate 1: Intrinsicality. (Excludes extrinsic views, but many accept it).
      *   Candidate 2: Non-Dispositional CP clauses. (Excludes almost everyone, as Lewis and others admitted this is hard/impossible).
      *   Candidate 3: Explanatory Irreducibility. (Excludes Humean/Reductive views).
      *   *Decision:* The demand for **Non-Dispositional Ceteris Paribus Clauses** (often tied to the desire for a reductive Conditional Analysis) is the biggest killer. It's the "Holy Grail" that no one has truly caught. However, given the user's specific focus on *engineering truth conditions*, the demand for **Precise Stimulus/Manifestation Specification without Circularity** is the practical version of this. Let's frame it as the "Non-Circular Specification of Normal Conditions."

  6.  **Scoring the Views:**
      *   *Simple Conditional Analysis (SCA):* Fails Finks/Masks.
      *   *Revised Conditional Analysis (RCA - Lewis):* Handles Finks better, struggles with Masks/Circularity.
      *   *Mutual Manifestation (Molnar/Handfield):* Good for One-Shot/Chancy, struggles with Distributed/Intrinsic demands.
      *   *Dispositional Essentialism (Bird):* Good for Explanation, struggles with Reductive Truth-Conditions (Job 1).

  7.  **Refining the Output:**
      *   Tone: Philosophical but rigorous, matching the user's "nail down the spec" approach.
      *   Structure: List of Requirements -> Status (Desideratum/Prejudice) -> Incompatibility Matrix -> The "Killer" Constraint -> View Scoring.
      *   Check against User Constraints: Did I include Selective Fink? Yes. Distributed Bearer? Yes. Engineering context? Yes.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Thought:* Is "Intrinsicality" definitely a prejudice?
      *   *Correction:* For the "Distributed Bearer" case, yes. If the theory *requires* a microstructural basis in a single object, it fails the cluster case. I need to flag this clearly.
      *   *Thought:* The user asked about "Explanatory vs. Redescription."
      *   *Correction:* Make sure Requirement 7 explicitly addresses the "Because" constraint.
      *   *Thought:* The Selective Fink is tricky. Is it a mask or a fink?
      *   *Correction:* It tests the boundary of the *stimulus definition*. If the stimulus is "impact > threshold," it's not finked. If the stimulus is "impact," it's finked. The theory must have a principled way to set stimulus boundaries.

  9.  **Final Polish:** Ensure the distinction between Job 1 (Truth) and Job 2 (Explanation) runs through the requirements. (Proceed to generate output).

  *(Self-Correction during final review)*: Wait, I need to make sure I explicitly answer "which subsets blow up." I will create a specific section for incompatibilities. I also need to make sure I don't just list the cases, but the *theoretical requirement* generated by the case.

  *Revised Plan:*
