answer: |-
  To the Committee,

  The health economist's objection is serious: if the therapy/enhancement distinction is merely a leaky proxy for cost-effectiveness, conceptual work is a distraction. However, the mandate is to rewrite a rule *using* that distinction. Our task is not to defend the distinction dogmatically, but to stress-test whether it can bear operational weight. If it collapses under analysis, the recommendation should be to scrap the rule, not to patch it. That is a valuable outcome. Accordingly, I propose the following priority order for funding, focused on questions that directly alter the wording of the coverage rule.

  **1. The Flattening Problem (Maintenance vs. Restoration)**
  This is the immediate pressure point. The current rule covers restoring normal function. But for an aging population, 'normal' is often a declining trajectory. Interventions that slow decline or compress variance (e.g., maintaining muscle mass in octogenarians) do not restore a past state nor raise peak capacity.
  *Upstream:* This settles the core definition of 'health obligation'. If maintenance counts as therapy, the budget expands significantly; if not, the system abandons chronic care.
  *Tractability:* High. This is purely conceptual analysis of 'function' over time versus static snapshots.
  *Rule Shift:* High. It dictates whether the rule reads 'restore species-typical functioning' or 'maintain age-relative functioning'.
  *Move Up/Down:* If preliminary work shows 'maintenance' can be neatly bounded without arbitrary line-drawing, it stays top. If it proves indistinguishable from enhancement, this question kills the project, moving it down only in favour of recommending abolition.

  **2. The Shifting-Baseline Problem (Statistical Normality)**
  If 'normal functioning' has statistical content, widespread uptake of an intervention changes the baseline. If everyone takes a cognitive stabiliser, the untreated become 'abnormal'.
  *Upstream:* This determines the stability of the rule over time. It dictates whether 'normal' is fixed (species-typical) or dynamic (population-relative).
  *Tractability:* Medium. Requires philosophical modelling plus some empirical input on uptake rates to simulate the drift.
  *Rule Shift:* Medium-High. A fixed baseline protects the budget but risks obsolescence; a dynamic baseline makes coverage unstable.
  *Move Up/Down:* If modelling shows the baseline shifts negligibly under realistic uptake scenarios, this drops to second place. If small uptake causes massive definitional drift, it becomes the primary blocker.

  **3. The Means-Sensitivity Problem (Route Neutrality)**
  Does the route matter? If schooling improves attention just as well as a pill, but only the pill is flagged as 'enhancement', the rule is incoherent.
  *Upstream:* This affects consistency across departments (health vs. education vs. social care). It prevents loopholes where medical routes are blocked but environmental ones are subsidised.
  *Tractability:* High. Purely conceptual analysis of moral relevance of means versus ends.
  *Rule Shift:* Medium. It forces the rule to be either technology-neutral (focusing on outcomes) or explicitly biased towards 'natural' means.
  *Move Up/Down:* If we find a robust moral difference between biological and environmental interventions (e.g., regarding identity or consent), this rises. If the distinction looks arbitrary, it falls, suggesting a move to outcome-based funding.

  **4. The Proxy Question (Is it just Cost-Effectiveness?)**
  This addresses the economist's challenge directly. Is the distinction doing any work that QALYs do not?
  *Upstream:* This validates the entire project. If the distinction adds no value over cost-effectiveness analysis, the conceptual work is finished: we recommend ditching the distinction.
  *Tractability:* Medium. Requires comparing edge cases where the distinction and cost-effectiveness diverge.
  *Rule Shift:* Critical. It determines whether the rule survives at all.
  *Move Up/Down:* If we find cases where 'therapy' is inefficient but mandatory, or 'enhancement' is efficient but excluded, the distinction has independent value, securing its place. If they align perfectly, the project pivots to recommending QALY-only rules.

  **Overrated Questions**

  I recommend deprioritising **The Positional Problem**. While philosophically rich, it dissolves under policy pressure. Public systems already exclude purely positional goods (e.g., cosmetic surgery for status) via necessity clauses. Whether a trait is competitive is usually secondary to whether it restores function. Funding this risks producing interesting sociology without changing the rule's wording. The externality argument is better handled through standard priority-setting than redefining therapy.

  Similarly, **The Many-Users Problem** is meta-theoretical. Knowing that clinicians and insurers use terms differently is diagnostic, not prescriptive. It doesn't tell us which usage *should* govern the rule. That is a political decision, not a conceptual one. Funding this risks describing confusion rather than resolving it.

  **Tractability and Conditions**
  All four prioritised questions are tractable within three years using philosophical tools, though the Baseline and Proxy questions benefit from limited empirical modelling (hence the workshop budget). We do not need large-scale trials; we need edge-case analysis.

  The ordering assumes the goal is to salvage a workable rule. If the Flattening or Proxy questions reveal the distinction is fundamentally incoherent, the agenda shifts from 'refining the rule' to 'recommending abolition'. That is a success, not a failure. We should fund the work that is most likely to break the rule, not the work most likely to comfort it.

  Regards,

  [Your Name]
