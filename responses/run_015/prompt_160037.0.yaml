          *   Must navigate two specific philosophical hurdles without stumbling:
              1.  *The Replacement Problem:* Restored habitat swaps long-lived specialists for short-lived generalists (high mortality). "Restored habitat" and "increased suffering" can both be true. The toast shouldn't assume the first cancels the second.
              2.  *The Credit-for-Absence Problem:* Praising someone for preventing lives that never happened (absence) is strange. The toast should be able to say this out loud without lecturing.
          *   **Post-Toast Requirement:** Add a short note identifying any line that only works because it silently takes the net-negative-welfare premise for granted OR only works because it ignores it, explaining which and why.

