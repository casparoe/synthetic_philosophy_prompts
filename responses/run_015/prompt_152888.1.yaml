  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Standard View:* Voting is either instrumental (cause an outcome) or expressive (signal identity/values).
      *   *The Tension:* If I vote for Candidate A (the "lesser evil") to stop Candidate B (the "greater evil"), but Candidate A still does something impermissible (violates deontological constraints), does my vote *say* "I support A's impermissible acts"?
      *   *The Nuance:* Usually, expressive voting theory says "vote your conscience." Strategic voting says "vote for the winner." The user is asking about the *expressive content* of a *strategic* vote for a *bad* candidate.
      *   *Speech Act Theory:* Is voting constative (stating a fact/preference) or performative (endorsing)? If I pull a lever, am I saying "I endorse X" or "I prefer X over Y given the constraints"?
      *   *Complicity:* Am I causally responsible for the win? Or symbolically associated with the platform?

  3.  **Drafting Section 1: Research Question & Literature Gap:**
      *   *Need:* Precision. Avoid vague "ethics of voting." Focus on the *expressive content of strategic compromise*.
      *   *Gap:* Literature treats expressive and instrumental as mutually exclusive or complementary. It rarely asks if the *act itself* carries a specific semantic content that creates moral liability regardless of the outcome.
      *   *Drafting thought:* Frame it as the "Problem of Symbolic Complicity in Strategic Voting."

  4.  **Drafting Section 2: Methodological Approach:**
      *   *Need:* Speech-act theory + Complicity.
      *   *Why:* Consequentialism looks only at outcomes (did the vote help?). Rights-based looks at duties (do I have a duty to vote?). Neither captures the *meaning* of the act.
      *   *Speech Act:* Use Austin/Searle concepts (illocutionary force). Is voting an endorsement?
      *   *Complicity:* Distinguish causal contribution (did my vote change the result?) from symbolic association (does my vote look like support?).
      *   *Justification:* This allows us to judge the *act* independent of the *result* (which is often negligible in large elections).

  5.  **Drafting Section 3: Success/Failure Conditions:**
      *   *Success:* A normative framework distinguishing "clean" strategic voting from "complicit" voting. Maybe a test for when private intent successfully modifies public meaning.
      *   *Failure:* If the analysis proves that *all* voting for a flawed candidate is complicity (collapsing into purity politics) OR if it proves meaning doesn't matter, only outcomes (collapsing into consequentialism).

