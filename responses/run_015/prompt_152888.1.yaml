answer: |-
  **Project Title:** The Semantics of Complicity: A Speech-Act Analysis of Strategic Voting Under Deontological Constraints

  **1. Research Question and Literature Gap**

  The central research question of this project is: *Can a voter strategically select a morally compromised candidate without the act of voting constituting an expressive endorsement of that candidate's impermissible policies?*

  Standard literature in the ethics of voting typically bifurcates justification into two categories: instrumental and expressive. Instrumental accounts argue that voting is justified solely by its causal contribution to a desirable outcome, often compelling a "lesser evil" calculus where deontological constraints are overridden by aggregate welfare. Expressive accounts argue that voting is justified as a manifestation of civic virtue or personal identity, often implying a duty to vote for the candidate who best aligns with one's values, regardless of viability.

  Existing frameworks leave the proposed question unresolved because they treat these justifications as mutually exclusive alternatives rather than examining the semantic structure of the vote itself. Instrumentalists ignore the symbolic content of the ballot, assuming that if the outcome is justified, the act is justified. Expressivists often assume that the ballot functions as a direct signal of preference, implying that selecting a candidate necessarily signals approval of their platform. Neither account adequately addresses the specific tension where a voter intends a strategic outcome (instrumental) but worries that the public act of selection conveys a moral endorsement (expressive) of policies they find deontologically impermissible. This project fills that gap by interrogating whether the ballot functions as a speech act that creates symbolic complicity independent of causal efficacy.

  **2. Methodological Approach**

  This project employs a conceptual methodology grounded in speech-act theory and a nuanced account of moral complicity. The analysis proceeds in two stages.

  First, I will analyze the ballot-casting act through the framework of speech-act theory. Rather than treating the vote merely as an anonymous input into an aggregation mechanism or a private expression of conscience, I will treat it as a public illocutionary act. The core inquiry is whether the conventional meaning of casting a ballot for Candidate A is "I endorse Candidate A" or "I select Candidate A as the optimal available option." This distinction is critical. If the former, the voter may be symbolically complicit in Candidate A's impermissible policies regardless of their private intent. If the latter, the expressive content may be compatible with moral reservation. I will examine whether private intent can successfully modify the public meaning of the speech act, or if the conventional rules of the electoral system fix the meaning regardless of voter psychology.

  Second, I will integrate this with an account of moral complicity that distinguishes causal contribution from symbolic association. Standard consequentialist analyses focus on causal contribution (i.e., did the vote change the outcome?). Rights-based analyses focus on duty (i.e., did the voter violate a categorical imperative?). Both miss the dimension of symbolic association: the risk that by voting for a candidate, one becomes morally tainted by their platform even if one's vote was causally negligible. By combining speech-act theory with a non-causal account of complicity, this approach avoids the pitfalls of standard analyses. It allows for a judgment of the *act itself* rather than solely its *results* (consequentialism) or its *maxim* (rights-based deontology), capturing the unique moral residue involved in participating in a collective decision procedure that yields impermissible outcomes.

  **3. Success and Failure Conditions**

  A successful result for this project will be the formulation of a normative framework that distinguishes permissible strategic voting from impermissible symbolic endorsement under specified conditions. Specifically, success looks like a set of criteria determining when the "lesser evil" defense successfully severs the link between voting and endorsement. For example, the framework might establish that strategic voting is expressively permissible only when public discourse allows for the articulation of the strategic intent, or when the deontological violation in question is not the primary differentiator between the candidates. This would provide a robust defense for voters who wish to engage in damage limitation without incurring moral taint.

  Conversely, the project would be considered a failure if the speech-act analysis collapses back into outcome-based reasoning. If the investigation concludes that the meaning of the vote is entirely determined by its consequences, the distinct contribution of the expressive/semantic analysis is lost. Similarly, if the analysis proves that *any* vote for a morally compromised candidate constitutes impermissible endorsement regardless of context, the framework would offer no practical guidance for non-ideal political circumstances, effectively demanding a purity that renders political participation impossible. A successful outcome must navigate between these extremes, offering a coherent account of how moral agents can act within compromised systems without becoming complicit in their worst features.

  **4. Scope and Feasibility**

  This project is designed as a one-year conceptual investigation requiring no empirical data collection. The scope is intentionally narrow to ensure depth and feasibility within the fellowship period. I will not attempt to resolve the general ethics of voting or provide a comprehensive theory of democratic representation. Instead, I will focus exclusively on the intersection of expressive theory and deontological constraints in "lesser evil" scenarios.

  The work will be divided into three phases. The first four months will be dedicated to refining the speech-act model of voting and drafting the core argument regarding illocutionary force. The subsequent four months will focus on integrating the complicity framework and testing the argument against standard objections from both instrumentalist and expressivist perspectives. The final four months will be reserved for synthesizing the findings into dissertation chapters and preparing related articles for publication. Because the research relies on textual analysis and conceptual argumentation rather than fieldwork or data modeling, the timeline is highly realistic. The primary risk lies in the complexity of integrating speech-act theory with political philosophy; however, my preliminary work suggests that the conceptual tools required are available and that the synthesis is tractable within the proposed timeframe.
