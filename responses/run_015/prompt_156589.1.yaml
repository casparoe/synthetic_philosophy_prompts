          *   Distinction: Caprice is acting *against* reasons (or without regard for them). Volitional commitment in this context is acting *when reasons run out*.
          *   *The "Enough Reason" Threshold:* Rationality requires reasons up to a point. When symmetry is reached, the "reason" is the necessity of action itself.
          *   *Coherent Restriction:* Volition is rational only *after* exhaustive deliberation confirms indifference. If I use will *before* checking reasons, it's caprice. If I use it *because* reasons are exhausted, it's rational closure.
