          *   The "Knot" is resolved by recognizing that rational agency includes a *meta-norm*: "Do not deliberate indefinitely."

      *   **Conclusion:** Summarize. The regress is halted by pragmatic norms of agency, not axiological ones. Randomization displaces the arbitrariness but renders it harmless. Volition is rational only as a terminator of deliberation, not a substitute for it.

