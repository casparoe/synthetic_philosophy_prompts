answer: |-
  This is a fantastic pedagogical challenge. You are trying to simulate **bounded rationality** in a room full of people who are trained to idealize rationality. The core tension you need to engineer is between *logical truth* (which is static) and *logical access* (which is costly and slow).

  If the market is too efficient, the "smart" students will arbitrage away all uncertainty in Round 1, and you'll be left with a standard probability seminar. If the market is too noisy, it's just chaos. The sweet spot is **computationally costly arbitrage**.

  Here is the design for **"The Bounded Bookie."**

  ---

  ### 1. The Claims (The Asset List)
  You asked for 25–30 claims. Do not make all of them tradeable every round. Instead, have a **Master List of 30**, but only **10 Active Assets** per round. This prevents cognitive overload and allows you to rotate difficulty.

  **Preparation:** You must verify the truth value of every single claim before class. Do not guess. Use WolframAlpha or a script.

  **Category A: Computational Hardness (10 Claims)**
  *These are settled truths, but verifying them takes time/tooling.*
  1.  The 1,000th digit of $\pi$ is [X].
  2.  The 1,000th digit of $e$ is [Y].
  3.  The 50th prime number is [Z].
  4.  $123456789 \times 987654321 = $ [Specific 18-digit number].
  5.  The number [Large 12-digit number] is prime.
  6.  The number [Large 12-digit number] is composite.
  7.  ... (Repeat with varying difficulty)
  *Design Note:* Make half of these True, half False. Ensure the calculation takes >2 minutes on a calculator, <1 minute on a laptop script.

  **Category B: Logical Combinations (10 Claims)**
  *These depend on Category A claims, creating logical dependencies.*
  11. (Claim 1 is True) $\lor$ (Claim 2 is True).
  12. (Claim 1 is True) $\land$ (Claim 2 is True).
  13. (Claim 1 is True) $\to$ (Claim 1 is True). (Tautology, but obscured).
  14. (Claim 5 is Prime) $\lor$ (Claim 5 is Composite). (Law of Excluded Middle).
  15. $\neg$(Claim 1 is True).
  16. ...
  *Design Note:* These are the trap. If Claim 1 is uncertain (price 0.5), Claim 14 *should* be 1.0. But if students are logically uncertain, they might price Claim 14 at 0.8 because they aren't *sure* Claim 5 must be one or the other (or they suspect a trick).

  **Category C: Meta & Testimony (5 Claims)**
  17. "The Instructor has verified Claim 1 is True."
  18. "Claim 3 and Claim 4 have the same truth value."
  19. "At least one of Claims 1–5 is False."
  20. ...

  **Category D: Fillers (5 Claims)**
  25–30. Simple tautologies ($2+2=4$) and contradictions ($2+2=5$) to calibrate the market baseline.

  ---

  ### 2. The Mechanics (Preventing Instant Arbitrage)
  The biggest risk is a student spotting $P(A) + P(\neg A) < 1$ and instantly correcting it. To prevent this, you must make **arbitrage computationally costly.**

  **Currency:** "Epistemic Points" (EP). Start everyone with 100 EP.
  **Trading Mechanism:** **Call Market (Batch Auction).**
  *   Continuous trading is too fast. It rewards reflexes over reasoning.
  *   Instead, there are **4 Rounds**. Each round is 15 minutes.
  *   At the end of the round, students submit an **Order Sheet**: "Buy Asset X at price $p$" or "Sell Asset X at price $p$".
  *   **The Clearing Rule:** You (the Instructor) act as the Market Maker. You set the clearing price for the next round based on the median submitted price from the current round.
  *   **The Crucial Constraint:** To place a bet larger than 20 EP on any single claim, you must attach a **Justification Note**.
      *   For Computational claims: A screenshot or scratch work.
      *   For Logical claims: A derivation sketch.
      *   *Why?* This simulates computational cost. A student can *see* an arbitrage opportunity (e.g., prices on $A$ and $\neg A$ sum to 0.8), but they cannot *exploit* it heavily unless they spend the time to prove the relationship. This allows incoherent prices to persist.

  **Tool Asymmetry:**
  *   **3 Laptops:** Allowed to run scripts. **Limit:** 3 script runs total per session. (Forces them to choose *what* to compute).
  *   **5 Calculators:** Basic arithmetic only.
  *   **6 Pen/Paper:** No electronic aid.
  *   *Rotation:* Swap tools after Round 2. This ensures everyone feels the constraint.

  ---

  ### 3. Session Flow (75 Minutes)

  **0:00 – 0:10: Setup & Priors**
  *   Hand out the Master List of 30 Claims.
  *   **Private Credence:** Before any talking, everyone writes down their private probability (0–100%) for the **10 Active Assets** for Round 1. Collect these. (This is your baseline data).
  *   Distribute EP and Tools.
  *   Explain Rules: "You are market makers. Your goal is to end with the most EP. Prices should reflect your belief the claim is True."

  **0:10 – 0:25: Round 1 (The Fog)**
  *   Active Assets: 5 Computational (Hard), 5 Logical Combinations.
  *   Students work/trade. Laptop users burn their first script run.
  *   *Expected Outcome:* Prices on hard claims cluster around 0.5. Prices on logical combinations (like $A \lor \neg A$) might dip to 0.7 or 0.8 because students are unsure of the components.
  *   Submit Order Sheets.

  **0:25 – 0:30: The Testimony Reveal (Crucial Moment)**
  *   Announce: "I have personally verified that **Claim 1 is True**. I will not show the proof. I am a reliable source."
  *   **Instruction:** "Update your credences. Do not trade yet."
  *   *Observation:* Watch if prices jump to 1.0. Rational logical uncertainty says they should jump high (e.g., 0.95) but *not* to 1.0, because testimony isn't proof. If someone jumps to 1.0, note it.

  **0:30 – 0:45: Round 2 (The Update)**
  *   Active Assets: Same as Round 1 + 5 new ones.
  *   Trading resumes.
  *   *Expected Outcome:* Claim 1 price rises but might stall at 0.9. Claim 14 ($1 \lor \neg 1$) should rise, but if they are uncertain about the logic, it might lag.
  *   Submit Order Sheets. Swap Tools.

  **0:45 – 0:50: The Proof Sketch**
  *   Announce: "Here is a partial derivation for Claim 3. It relies on Lemma X which is unverified."
  *   This simulates "mathematical progress." You know more, but not everything.

  **0:50 – 0:65: Round 3 (The Convergence)**
  *   Active Assets: Focus on the Logical Combinations.
  *   Students have more info, but time is running out.
  *   *Expected Outcome:* Prices drift toward 0 or 1, but some "hard" claims remain stuck at 0.3 or 0.7. **This is the target phenomenon.**

  **0:65 – 0:75: Settlement & Debrief**
  *   Reveal all truth values. Pay out EP.
  *   **The Debrief (see below).**

  ---

  ### 4. Anticipated Pitfalls & Fixes

  **Pitfall 1: "Everything is 0.5"**
  *   *Cause:* Students are risk-averse or don't care about EP.
  *   *Fix:* Gamify it. "Top 3 EP scores get [small prize/privilege]." Also, ensure the "Justification Note" rule isn't too burdensome for small bets. Allow 10 EP bets with no justification to encourage liquidity.

  **Pitfall 2: "Tautologies priced at 1.0 immediately"**
  *   *Cause:* One philosophy major says "It's logic, obviously."
  *   *Fix:* Make the tautology complex. Instead of $P \lor \neg P$, use $(P \land Q) \to (P \lor R)$. If they are uncertain about $P$ and $Q$, they might discount the implication. If someone insists on 1.0, challenge them in the debrief: "Did you check the truth table, or did you assume omniscience?"

  **Pitfall 3: Laptop Dominance**
  *   *Cause:* Laptop users solve everything in 5 minutes.
  *   *Fix:* The **3-Script Limit** is vital. Also, make the "Hard" claims *actually* hard (e.g., factorization of a 20-digit number). If they solve it, they win big, but they exhaust their "compute budget," leaving them uncertain on later claims.

  **Pitfall 4: The Market Clears Too Efficiently**
  *   *Cause:* Students spot $P(A)=0.3, P(\neg A)=0.3$ and bet heavily.
  *   *Fix:* Enforce the **Justification Constraint** strictly. If they want to bet 50 EP on the arbitrage, they must prove $A \lor \neg A$ is a tautology *in the time allowed*. This sounds silly, but it models the computational cost of checking consistency.

  ---

  ### 5. The Debrief: Mapping Experience to Theory
  Do not lecture. Ask questions based on the data you collected.

  1.  **The "Stuck" Price:**
      *   *Show:* "Claim 5 ended at 0.4. It is actually True. Why didn't the market correct this?"
      *   *Point:* Computational cost. The arbitrage existed, but the *work* to verify it was more expensive than the expected payout given the time limits. This is **Bounded Rationality**.

  2.  **The Testimony Update:**
      *   *Show:* "When I told you Claim 1 was True, did anyone move to 1.0? Who stayed at 0.9?"
      *   *Point:* Updating on testimony vs. proof. Standard Bayesianism says update on the *fact*. Logical Uncertainty says you update on the *report of the fact*, which carries a risk of error (or misunderstanding).

  3.  **The Tautology Lag:**
      *   *Show:* "Claim 14 ($A \lor \neg A$) traded at 0.85 in Round 1. Why?"
      *   *Point:* Logical Omniscience. Standard epistemology says $P(T)=1$. You just demonstrated that coherent agents *cannot* assign 1 to all theorems if they don't know the theorems yet.

  4.  **The Limit Criterion:**
      *   *Point:* "You weren't coherent at Round 1. But if we played this for 100 rounds, would you have converged?"
      *   *Theory:* Introduce **Logical Induction** (Garrabrant et al.). The standard isn't "Coherence Now," it's "No Dutch Book in the Limit as Computation $\to \infty$."

  ---

  ### 6. Success Metrics (What to Look For)
  You need to know if it worked. Look at the data you collected:

  1.  **The Variance Gap:** Compare the variance in Private Priors (Round 0) vs. Market Prices (Round 3). If variance drops but doesn't hit 0/1, you succeeded.
  2.  **The Tautology Test:** If the average price on $P \lor \neg P$ claims is $< 0.95$ in Round 1, you have successfully induced logical uncertainty.
  3.  **The Testimony Response:** If the price on Claim 1 moves to ~0.9 but *not* 1.0 after your announcement, they are intuitively grasping the distinction between truth and verification.

  ---

  ### 7. Honest Limitations (What You Must Say)
  Be transparent at the end. This game cannot show:
  1.  **True Uncomputability:** All your claims were computable. Real logical uncertainty involves things like the Consistency of ZFC, which might *never* be settled.
  2.  **The Cost of Logic:** In the game, "thinking" was free, only "tools" were limited. In reality, cognitive effort is the currency.
  3.  **Adversarial Logic:** In the game, the math wasn't trying to trick you. In real LU (e.g., security proofs), the "environment" might select hard problems specifically to break your coherence.

  ### Instructor Cheat Sheet: The "Right" Answers
  *   **Claim 1 (Testimony):** Make this **True**.
  *   **Claim 5 (Hard):** Make this **True**.
  *   **Claim 6 (Hard):** Make this **False**.
  *   **Tautologies:** Ensure at least one is a complex logical truth that looks non-trivial.
  *   **Contradictions:** Ensure at least one is a complex contradiction.

  **Final Tip:** If a student asks, "But isn't it irrational to price a theorem at 0.5?" your answer is: "It is irrational if you are God. Are you God?" Then move on. Let the game sit with them.
