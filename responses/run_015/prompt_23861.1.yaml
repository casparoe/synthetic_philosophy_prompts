prompt: |-
  Analyze the UK's 2016 referendum on EU membership as a test case for the boundary problem in democratic theory: who should have composed the demos for a decision of this kind? The referendum used the ordinary parliamentary franchise -- British, Irish, and qualifying Commonwealth citizens aged 18 and over resident in the UK, plus British citizens who had lived abroad for under fifteen years. Other long-term resident EU nationals could not vote, nor could sixteen- and seventeen-year-olds, though both groups could vote in Scotland's 2014 independence referendum. Gibraltar alone among Britain's overseas territories took part, because it alone lay inside the EU. Apply the all-affected-interests principle and the all-subjected (or coercion) principle in turn: say concretely who each would enfranchise, and where each diverges from the rules actually used and from the other. Then give an honest verdict: does either principle deliver a non-arbitrary answer here, or does the case instead confirm that any procedure for fixing the boundary already presupposes an answer to who belongs -- a circularity no actual electoral design can escape?
reasoning: |-
  Here's a thinking process that leads to the analysis of the UK's 2016 EU referendum through the lens of the boundary problem:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** UK's 2016 EU Referendum (Brexit).
      *   **Theoretical Lens:** The "Boundary Problem" in democratic theory (who constitutes the *demos*?).
      *   **Specific Task 1:** Analyze the actual franchise used (Parliamentary franchise + specific exclusions/inclusions).
      *   **Specific Task 2:** Apply the *All-Affected-Interests Principle* (AAIP). Who *should* have voted according to this? How does it differ from reality and the other principle?
      *   **Specific Task 3:** Apply the *All-Subjected Principle* (ASP) / Coercion Principle. Who *should* have voted according to this? How does it differ from reality and AAIP?
      *   **Specific Task 4:** Give an "honest verdict." Do these principles solve the problem non-arbitrarily, or does the case confirm the circularity objection (that defining the boundary presupposes the *demos*)?

  2.  **Initial Fact-Checking & Contextualization:**
      *   *Actual Franchise:* UK residents (British, Irish, Commonwealth), 18+, British expats (<15 years).
      *   *Exclusions:* EU nationals resident in UK (non-Commonwealth/Irish), 16-17 year olds (in UK), British expats (>15 years), UK nationals in other EU states (mostly), Gibraltar (included), Crown Dependencies (excluded).
      *   *Comparison:* Scottish IndyRef 2014 (included 16-17s, excluded non-UK EU nationals).
      *   *Theoretical Concepts:*
          *   Boundary Problem: Who decides who decides? (Rehmus's paradox).
          *   AAIP: Everyone whose interests are significantly affected should have a say.
          *   ASP: Everyone subject to the coercive power of the decision should have a say.

  3.  **Drafting Section 1: The Actual Franchise (The Status Quo):**
      *   Need to clearly list who voted and who didn't.
      *   *Rationale:* It was based on the Westminster parliamentary franchise. This treats the referendum as a domestic UK constitutional matter, not a transnational one.
      *   *Anomalies:* Gibraltar (part of UK franchise + in EU), Crown Dependencies (not in UK franchise + not in EU), 16-17s (excluded unlike Scotland), EU nationals (excluded unlike local elections).

  4.  **Drafting Section 2: The All-Affected-Interests Principle (AAIP):**
      *   *Theory:* If a decision impacts you, you should vote.
      *   *Application to Brexit:* Brexit affected *everyone* in the EU (trade, movement, security), potentially even beyond (global trade).
      *   *Who gets enfranchised?*
          *   UK residents (obviously).
          *   EU nationals in the UK (highly affected).
          *   UK nationals in EU27 (highly affected regarding residency rights).
          *   Citizens of other EU states (affected by trade/budget/politics).
          *   Possibly future generations (intergenerational justice).
          *   Possibly 16-17 year olds (future impact).
      *   *Divergence:* Much broader than the actual franchise. Potentially a pan-European referendum.
      *   *Problem:* "Affected" is vague. How much affect counts? Economic ripple effects affect the whole world. Does the whole world vote?

  5.  **Drafting Section 3: The All-Subjected Principle (ASP):**
      *   *Theory:* If you are subject to the coercive authority of the law resulting from the decision, you should vote.
      *   *Application to Brexit:*
          *   *Jurisdictional view:* Who is subject to UK law? UK residents.
          *   *Supranational view:* Who is subject to EU law? All EU citizens. Since the decision is about leaving the legal order, all members of that order have a stake in its dissolution/modification.
      *   *Who gets enfranchised?*
          *   If viewed as a UK constitutional act: UK citizens/residents (similar to actual franchise, but maybe includes long-term expats subject to UK tax/law?).
          *   If viewed as an EU treaty change: All EU citizens (because Article 50 triggers a change in the legal order binding them all).
      *   *Divergence:* If taken seriously as an EU-level decision, it enfranchises a French farmer who trades with the UK. If taken as a UK domestic decision, it excludes EU nationals in the UK who *are* subject to UK coercion.
      *   *Nuance:* EU nationals in the UK *are* subject to UK coercion. So ASP (domestic) would include them. ASP (EU) would include all Europeans.

  6.  **Drafting Section 4: The Honest Verdict (Circularity & Arbitrariness):**
      *   *The Core Tension:* To apply AAIP or ASP, we first need to define the scope of the "decision." Is it a UK domestic vote or an EU constitutional event?
      *   *Circularity:* The UK government defined it as domestic (Parliamentary franchise). This predefined the *demos*. Theoretical principles challenge this definition but cannot enforce a new one without a higher authority to define the scope of "affect" or "subjection."
      *   *AAIP Critique:* Too expansive (potentially global). Requires a prior judgment on which interests count.
      *   *ASP Critique:* Depends on the legal frame. Is the coercion UK law or EU law? Choosing the frame presupposes the *demos*.
      *   *Conclusion:* The Brexit case confirms the theoretical suspicion. There is no neutral, algorithmic way to set the boundary. The boundary was a political decision disguised as a procedural one. The "people" was constructed by the state *before* the vote could take place.

  7.  **Review and Refine:**
      *   *Tone:* Academic, analytical, critical.
      *   *Clarity:* Ensure the distinction between AAIP and ASP is sharp.
      *   *Specifics:* Mention Gibraltar, 16-17s, EU nationals explicitly.
      *   *Argument:* Make sure the verdict lands hard on the circularity problem (the "constitutive paradox").

  8.  **Self-Correction Example during drafting:**
      *   *Initial thought:* Maybe ASP clearly includes EU nationals in the UK.
      *   *Correction:* Yes, because they are subject to UK law. But does it include French citizens in France? Only if the decision is viewed as altering the EU legal order that binds them. This highlights the ambiguity of the "decision" itself. I need to emphasize that the *nature of the decision* is contested, which drives the boundary problem.
      *   *Check:* Did I mention the 15-year rule for expats? Yes, important exclusion.
      *   *Check:* Did I mention Gibraltar? Yes, unique inclusion.

  9.  **Final Polish:** Organize into clear headings. Ensure the conclusion synthesizes the theoretical implications. (Proceed to generate output based on this structure).

  *(Self-Correction Note on "All-Subjected"):* I need to be careful with ASP. Usually, ASP argues for including those subject to the *state's* coercion. In the context of EU withdrawal, the coercion is complex. Is it the UK state coercing residents? Or the EU legal order coercing member states? I will address both interpretations to show the ambiguity.

  *(Self-Correction on "Circularity"):* The prompt asks if the case confirms circularity. I should argue that it does. The UK government had the power to set the franchise, effectively deciding the outcome by shaping the electorate (e.g., excluding young people and EU nationals who leaned Remain). This proves the boundary is political, not theoretical.

  10. **Final Output Generation** (incorporating the above steps).
answer: |-
  The 2016 United Kingdom referendum on European Union membership stands as a paradigmatic case study for the "boundary problem" in democratic theory. The boundary problem asks a logically prior question to voting itself: *who constitutes the people (demos) entitled to vote?* As Frederick Whelan and others have noted, democratic theory usually presupposes a bounded demos to explain how decisions are made, but it lacks a democratic procedure to define the boundary itself without circularity.

  The Brexit referendum offers a concrete stress test for the two leading normative principles used to solve this problem: the **All-Affected-Interests Principle (AAIP)** and the **All-Subjected Principle (ASP)**. By analyzing the actual franchise against these theoretical ideals, we can assess whether either principle offers a non-arbitrary solution or if the case confirms the inescapable circularity of democratic boundary-setting.

  ### 1. The Actual Franchise: A Domestic Construction
  The franchise for the 2016 referendum was not designed *ab initio* for a constitutional question of this magnitude. Instead, it defaulted to the existing franchise for UK parliamentary elections, with minor modifications.

  *   **Included:** British, Irish, and qualifying Commonwealth citizens resident in the UK (aged 18+); British citizens who had lived abroad for fewer than 15 years; members of the House of Lords; peers. Crucially, Gibraltar was included (as it is part of the UK parliamentary franchise and was in the EU).
  *   **Excluded:** Citizens of other EU member states resident in the UK (unless Irish or Commonwealth); 16- and 17-year-olds (unlike the 2014 Scottish Independence Referendum); British expatriates resident abroad for more than 15 years; British citizens resident in other EU countries (unless they voted in UK elections); Crown Dependencies (Isle of Man, Jersey, Guernsey).

  **The Logic:** The UK government treated the referendum as a matter of *domestic* constitutional law, not a transnational treaty negotiation. The *demos* was defined as the existing UK parliamentary electorate. This definition was not neutral; it structurally favored an older, more nativist demographic (excluding younger voters and EU nationals who polled heavily for Remain) and framed the decision as a unilateral UK act rather than a dissolution of a partnership.

  ### 2. The All-Affected-Interests Principle (AAIP)
  **The Theory:** AAIP posits that anyone whose interests are significantly affected by a decision should have a right to participate in making it.

  **Application to Brexit:**
  Brexit was not merely a domestic policy shift; it was a geopolitical reorientation.
  *   **Who would be enfranchised?**
      1.  **UK Residents:** Clearly affected.
      2.  **EU Nationals in the UK:** Their residency rights, status, and economic prospects were directly at stake.
      3.  **UK Nationals in the EU27:** Their right to reside, work, and access healthcare in Europe was directly threatened.
      4.  **Citizens of other EU States:** Brexit affected the EU budget, trade tariffs, security cooperation (Europol), and the political balance of the remaining Union. A French farmer or a German auto worker has a tangible interest in UK-EU trade terms.
      5.  **Future Generations:** The long-term economic and constitutional impact falls disproportionately on those currently under 18.
      6.  **Gibraltar & Crown Dependencies:** While Gibraltar was included, the Crown Dependencies (outside the EU but affected by UK trade policy) were excluded.

  **Divergence from Reality:** AAIP demands a vastly broader *demos*, potentially requiring a pan-European referendum or at least a dual majority (UK and EU-wide). It diverges sharply from the actual franchise by including non-UK EU citizens and excluding the 15-year rule for expats (whose interests remain affected regardless of duration abroad).

  **Divergence from ASP:** AAIP is potentially limitless. If "interests" include economic ripple effects, arguably the entire global trading population is affected. AAIP struggles with *degree*: how much affect is enough? Without a prior rule to weigh interests, AAIP cannot draw a line.

  ### 3. The All-Subjected Principle (ASP)
  **The Theory:** ASP (or the Coercion Principle) argues that the *demos* should include all those subject to the coercive authority of the laws resulting from the decision.

  **Application to Brexit:**
  Application of ASP depends entirely on how one defines the relevant legal order.
  *   **Interpretation A (Domestic Coercion):** If the decision results in UK law, then all those subject to UK law should vote.
      *   *Enfranchisement:* This would include **EU nationals resident in the UK**. They are subject to UK coercion (taxes, criminal law, immigration enforcement) just like British citizens. Excluding them violates ASP.
      *   *Exclusions:* It might exclude British expats in Spain, as they are primarily subject to Spanish coercion, not UK law (unless taxed in the UK).
  *   **Interpretation B (Supranational Coercion):** If the decision triggers Article 50 TEU, it alters the EU legal order.
      *   *Enfranchisement:* All citizens of the EU are subject to the EU legal order. A decision to shrink that order affects the legal framework binding all members. Therefore, **all EU citizens** should vote.
      *   *Exclusions:* This would exclude 16-17 year olds (unless the voting age of the EU polity is lowered) and non-EU Commonwealth citizens in the UK (who are not subject to EU law).

  **Divergence from Reality:** Under Interpretation A, the actual franchise was undemocratic for excluding resident EU nationals. Under Interpretation B, the franchise was undemocratic for excluding the rest of Europe. The actual franchise picked a hybrid: it treated the vote as domestic (excluding EU nationals) but acknowledged the EU context (including Gibraltar).

  **Divergence from AAIP:** ASP is more bounded than AAIP. It does not enfranchise the French farmer based on *economic interest*, but based on *legal subjection*. However, ASP creates a paradox here: are UK nationals in the EU "subjected" to the decision? They are subject to the *consequences*, but not necessarily the *coercive law* of the UK regarding the referendum.

  ### 4. Verdict: The Inescapable Circularity
  Does either principle deliver a non-arbitrary answer? **No.** The Brexit case confirms the theoretical suspicion that the boundary problem is logically prior to democracy and cannot be solved democratically.

  **1. The Framing Problem:**
  To apply AAIP or ASP, one must first define the **decision**.
  *   Is the decision "Should the UK Parliament pass a bill to notify withdrawal?" (Domestic)
  *   Or is the decision "Should the EU Treaty be amended to remove a member?" (Supranational)

  The UK government had the unilateral power to define the decision as the former. By defining it as a domestic advisory referendum, they legitimized the parliamentary franchise. Neither AAIP nor ASP can override this without a higher authority to define the scope of the decision. But who defines the scope? If a court defines it, it is juristocratic; if a government defines it, it is self-serving.

  **2. The Circularity of "Interests" and "Subjection":**
  *   **AAIP:** To know whose interests count, we must know the outcome's scope. But the scope depends on who votes. If only Britons vote, the interests of the French are externalities. If Europeans vote, the French interests are internal. The principle presupposes the boundary it seeks to draw.
  *   **ASP:** To know who is subjected, we must know which legal order is authoritative. The UK government asserted UK sovereignty (Westminster). The EU implies shared sovereignty. Choosing the legal frame is a political act, not a theoretical deduction.

  **3. The Political Reality:**
  The franchise was not derived from democratic theory; it was a political calculation. Excluding 16-17-year-olds (who leaned Remain) and EU nationals (who leaned Remain) while including older Commonwealth citizens (who leaned Leave) suggests the boundary was drawn to influence the outcome. This confirms that boundary-setting is an exercise of **constituent power**, not a procedural application of justice.

  **Conclusion:**
  The 2016 referendum demonstrates that the *demos* is not a pre-political entity waiting to be discovered by principles like AAIP or ASP. It is a political construct. The boundary problem is not a puzzle to be solved by better theory; it is the fundamental paradox of democracy. To vote on the boundary, you need a *demos*; to have a *demos*, you need a boundary.

  In the Brexit case, the boundary was fixed by fiat. Neither AAIP nor ASP could provide a neutral algorithm to correct it because both principles require a prior agreement on the nature of the polity (UK vs. EU) that was precisely what was at stake. The case confirms that any procedure for fixing the boundary already presupposes an answer to who belongs. Democracy cannot bootstrap its own boundaries; it always rests on a prior, undemocratic decision about who constitutes the people.
