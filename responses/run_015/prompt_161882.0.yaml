      Marcus's view better accommodates this epistemic limitation. By admitting we are drawing a line, we shift the burden from "discovering truth" to "exercising reasonable discretion." This aligns with our office mate's practical concern: transparency reduces appeals. However, Marcus's suggestion of hard codified thresholds fails to address the multidimensional vagueness we face. Progress is not one-dimensional; it involves writing, data, and defense status simultaneously. A hard threshold on one dimension creates false precision. Therefore, we adopt his transparency requirement but apply it to *guidelines* rather than rigid rules.

