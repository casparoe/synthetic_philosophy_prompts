  Moving to the epistemic side, I need to ask about the continuity between scientific inquiry and democratic deliberation and whether algorithmic curation breaks that continuity or is it just a new instrument. You might argue it is merely a tool like a printing press, but if the tool selects for emotional arousal rather than truth claims, does it not fundamentally alter the definition of evidence being used in the deliberation? Then there is Dewey's rejection of the spectator theory of knowledge given that people in these publics are mostly passive consumers of generated content. If the primary mode is scrolling rather than doing, are we not reverting to the exact spectatorship Dewey warned against? I expect you will reply that active interpretation still happens in the margins through comments and shares, so I have to ask whether that fragmentary engagement is sufficient to sustain the kind of shared meaning required for a public to form. Finally, if the algorithmic public is optimized for segmentation rather than association, can we still call it a democracy or have we simply automated the fragmentation of experience without the reconstructive phase?
