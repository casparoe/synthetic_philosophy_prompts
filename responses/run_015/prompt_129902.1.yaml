answer: |-
  The stall is primarily a conceptual mix-up about the function of historical explanation, driven by unarguable values regarding human agency versus structural determinism. Progress requires a methodological distinction between constraints and choices, not new archaeological results.

  **Reasoning**

  1.  **Competing Definitions of Explanation:** The two sides are playing different intellectual games. The Diamond/Harari camp seeks *nomothetic* explanations—general laws that identify causal patterns across cases to predict broad outcomes. The Graeber/Wengrow camp seeks *ideographic* explanations—accounts of specific contingencies, choices, and local meanings. They aren't disagreeing on the facts; they are disagreeing on what counts as a valid answer to "why." One wants to know the boundaries of the playing field; the other wants to know how the players moved.

  2.  **Normative Stakes:** The debate is ethical, not just empirical. Deterministic narratives risk naturalizing inequality by suggesting hierarchy was an inevitable cost of civilization. Agency-focused narratives protect the possibility of political change by arguing social structures were consciously adopted and can be discarded. Neither side can concede without betraying their political commitments. For the determinists, admitting too much agency weakens scientific predictive power. For the agency theorists, admitting too much determinism undermines the moral project of human freedom.

  3.  **Theory-Laden Evidence:** More archaeology won't fix this because data interpretation is framework-dependent. A site showing flexible settlement is proof of conscious choice to one side and a statistical outlier or transitional phase to the other. Since everyone already agrees the record is patchy, new data simply gets absorbed into existing frameworks rather than falsifying them.

  4.  **Path Forward:** Progress comes from defining scope conditions rather than seeking a unified theory. You must distinguish between *conditions of possibility* (geography, biology, climate) and *political decisions* (social organization, hierarchy, ritual). Validating both models requires limiting their claims: structural theories explain the broad parameters and constraints, while agency theories explain the specific trajectories within those bounds. Until the seminar agrees that history requires both constraint and choice operating at different scales, the fight is verbal.
