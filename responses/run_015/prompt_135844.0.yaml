prompt: |-
  I am a professor of philosophy and, for the last two years, the chair of this university's Committee on Commemoration and Historical Context. The committee hears petitions about what the campus publicly honors: named buildings, named professorships and lecture series, portraits, and passages in the common curriculum that petitioners want removed, recontextualized, or annotated with an editorial note. We meet monthly and dispose of twenty to thirty items a year. Our recommendations are public, they go to the president, they are read both by the students who filed the petition and by the alumni trustees who fund the things being renamed, and they are leaked to the student paper with some regularity. We decide from a dossier: the petition, the response from the unit that owns the item, and whatever a general reference work tells us. We have no research budget, no outside consultants, and no time for archival work. Every item has to be settled in one meeting and defended in two paragraphs of plain prose, by a committee that includes a student, a librarian, and a trustee who have never had any of this machinery explained to them.

  What we lack is a procedure. Right now the word presentism functions in our meetings as a conversation-stopper in both directions: it is used to defeat petitions (that is merely presentism) and to defeat defenses (that is merely the standards of his time). I want something better than that, and I want it as a procedure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a yes or a no, and where it stops because the remaining question is one of values and must be handed to the committee with a clear flag rather than disguised as a finding.

  Four things the procedure has to get right, because they are where our arguments actually stall.

  First, triage by what the utterance is doing. An explanation, a verdict on an agent, a decision about what to teach, and an act of honoring are not, I take it, governed by the same norm; honoring seems to me constitutively a present practice done for present reasons, so that calling a commemoration presentist may be a category mistake rather than an objection. Relatedly, the procedure must distinguish a claim that is presentist but harmless from one that is false but not presentist, and say what we do with each.

  Second, the availability of a standard. When we say an agent could not have known better, we owe an account of could not: expressible in the vocabulary available to them; actually articulated by someone within their reach; feasible for someone in their position; or survivable by someone in their position. I want the rungs distinguished, and I want a rule for which rung is demanded by which kind of question.

  Third, the choice of comparison class and time window. Whether an agent was typical depends on whom you compare them to and over what interval, and both are trivially gerrymandered in either direction. I want a window rule and an account of how it gets gamed, plus something I have come to rely on informally: a dissent test, on which no one could have known better fails as soon as the dossier shows contemporaries who said the thing.

  Fourth, the fork between using what only we know in order to explain and using it in order to condemn, together with two failure modes I want named and policed: the slide on which an accurate frequency claim (his views were common for his class and decade) does the work of an excuse whether or not it was offered as one, and the asymmetry whereby we notice anachronism in condemnation but not in praise, so that calling a thinker a proto-feminist passes unremarked while calling her a misogynist does not. I also want the procedure to face the awkward fact that our standpoint is itself downstream of the history we are judging, and that the anti-presentist norm we would be applying is one of ours. Where the procedure bottoms out in that regress, say so and stop.

  Run it on three cases with the facts as stipulated here.

  One: Hartwell Hall, a dormitory named for Elias Hartwell (1811–1879), a shipping and insurance magnate who in 1858 published a pamphlet arguing that emancipation would ruin the sugar islands and that people of African descent were unfit for self-government. The dossier establishes that abolitionist pamphlets were on sale in his city that year and that two of his business partners subscribed to an abolition society. The petition asks that the name come off; the committee's working draft is a plaque reading that Hartwell's views, indefensible to us, were those of most merchants of his class and time. Is the plaque, the petition, or neither the presentist object?

  Two: Aletheia Vance's On the Education of Citizens (1792), required in the sophomore sequence, which argues that a woman's education should be confined to household management. The dossier establishes that Vance ran a school in which girls were taught Latin and double-entry bookkeeping, and that she corresponded with a contemporary who published an argument for equal education. The petition asks that the text be dropped. I want to keep it, and my draft note is that Vance was a pioneer of women's education whose theory lagged behind her practice. I have a stake in this one, and I suspect my note may be the presentist object rather than the petition; if that is where the procedure lands, say so plainly.

  Three: the Crane Lectures, endowed in 1919 by Josiah Crane (1845–1921), a manufacturer. The dossier establishes that everything he did was lawful and locally praised — libraries, a hospital wing — and that reports published by his foundation were quoted approvingly by eugenicist campaigners in the decade after his death, with no connection to him and without his having sought or foreseen it. The petition argues that the lectures now function as an honor to a man whose work fed a later harm. I want to know whether the procedure recognizes retrospective injury of this shape at all and, if it does, what would have to be true of the causal chain for it to count.

  Finally, tell me what the procedure cannot do: where it will misfire on the cases we actually get, which of our questions it is simply the wrong instrument for, and which of its steps are judgment calls wearing procedural costume. Please do not give me further reading or a bibliography; whatever we decide, we have to decide in the room, from the dossier and from reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Professor of Philosophy, Chair of Committee on Commemoration and Historical Context.
      *   **Problem:** The committee lacks a clear procedure. Arguments stall on "presentism" used as a conversation-stopper in both directions. They need a decision procedure (questions in order, sufficiency conditions, stop rules, value flags).
      *   **Constraints:** No research budget, no consultants, one meeting per item, two-paragraph defense, diverse committee (student, librarian, trustee).
      *   **Four Key Requirements:**
          1.  *Triage by Utterance Type:* Distinguish explanation, verdict, teaching decision, honoring. Address the category mistake of calling honoring "presentist." Distinguish harmless presentism from false non-presentism.
          2.  *Availability of Standard:* Define "could not have known better" (vocabulary, articulation, feasibility, survivability). Match rung to question type.
          3.  *Comparison Class & Time Window:* Prevent gerrymandering. Define window rule. Include "Dissent Test" (if contemporaries said it, "no one could know" fails).
          4.  *Epistemic Fork & Failure Modes:* Distinguish using current knowledge for explanation vs. condemnation. Name/police "Frequency-as-Excuse Slide" and "Anachronism Asymmetry" (proto-feminist vs. misogynist). Acknowledge the regress of the anti-presentist norm itself.
      *   **Task:** Create the procedure, run it on three specific cases (Hartwell Hall, Vance Text, Crane Lectures), and identify limitations/failure modes.
      *   **Constraint:** No bibliography/further reading. Must be usable in the room.

  2.  **Drafting the Procedure (The "Protocol for Historical Assessment"):**
      *   *Goal:* A flowchart-like structure in text form.
      *   *Step 1: Triage (The "What are we doing?" question).* Needs to separate Honoring, Teaching, and Explaining.
      *   *Step 2: The Standard of Availability (The "Could they know?" question).* Needs the four rungs (Vocabulary, Articulation, Feasibility, Survivability).
      *   *Step 3: Comparison & Window (The "Were they typical?" question).* Needs the Window Rule and the Dissent Test.
      *   *Step 4: The Epistemic Fork (The "How are we using our knowledge?" question).* Needs to address the Frequency-as-Excuse Slide and Anachronism Asymmetry.
      *   *Step 5: The Regress Stopper.* Acknowledge the committee's own standpoint.

      *Refining Step 1:* Honoring is constitutively present-facing. This is crucial. If it's honoring, historical accuracy isn't the *only* metric; current alignment matters. If it's teaching, pedagogical utility matters. If it's explaining, truth matters.
      *Refining Step 2:* The rungs need to be hierarchical. Vocabulary < Articulation < Feasibility < Survivability.
      *Refining Step 3:* The Window Rule needs to be specific (e.g., +/- 10 years, peer group). The Dissent Test is a hard stop for "unavoidable ignorance."
      *Refining Step 4:* This is about the *use* of the finding. Does frequency excuse? Does praise get a pass?
      *Refining Step 5:* Explicitly state where values take over.

  3.  **Running the Cases:**

      *   **Case 1: Hartwell Hall (Honoring/Building Name)**
          *   *Triage:* It's an honor (building name). Norm = Current alignment + Historical truth.
          *   *Standard:* Hartwell published a pamphlet. Abolitionist pamphlets existed. Partners subscribed.
          *   *Comparison:* Merchants of his class/time. Dissent Test: Partners subscribed to abolition society. "No one could know" fails.
          *   *Epistemic Fork:* The plaque says "views... were those of most merchants." This is the Frequency-as-Excuse Slide. It tries to excuse the honor by normalizing the view.
          *   *Verdict:* The plaque is presentist (imposing current need for comfort on history) *and* factually dubious (partners dissented). The petition is not presentist; it's a current value judgment on honoring.
          *   *Outcome:* Remove name or recontextualize heavily. The plaque draft is insufficient.

      *   **Case 2: Vance Text (Teaching/Curriculum)**
          *   *Triage:* Teaching decision. Norm = Pedagogical utility + Historical truth.
          *   *Standard:* 1792. Girls' school taught Latin/Bookkeeping. Corresponded with equal ed advocate.
          *   *Comparison:* Women educators of the 1790s.
          *   *Epistemic Fork:* The Professor's note ("theory lagged behind practice") risks Anachronism Asymmetry. It praises her as a "pioneer" (proto-feminist) while minimizing the text's actual misogyny.
          *   *Verdict:* The petition (drop text) is a value judgment. The Note is potentially presentist (recasting her as modern). The text stays if pedagogical value exists, but the note needs correction to avoid the asymmetry.
          *   *Outcome:* Keep text, rewrite note to acknowledge the tension without smoothing it over.

      *   **Case 3: Crane Lectures (Honoring/Endowment)**
          *   *Triage:* Honoring (Lecture Series).
          *   *Standard:* 1919-1921. Lawful, praised. Eugenics reports quoted *after* death.
          *   *Causal Chain:* Petition argues "work fed a later harm."
          *   *Epistemic Fork:* Retrospective injury. Did Crane's work *enable* the eugenics? Or was it co-opted?
          *   *Verdict:* Procedure recognizes retrospective injury *only if* the work contained the seeds of the harm or was intended to support it. Mere co-option by later bad actors doesn't condemn the honor unless the honor is now *functioning* to endorse that co-option.
          *   *Outcome:* If the lectures *now* signal endorsement of eugenics due to the association, the honor is compromised. If it's purely external association, the honor stands but context is added.

  4.  **Identifying Limitations (What the procedure cannot do):**
      *   It can't solve value conflicts (e.g., "Do we value comfort or truth more?").
      *   It can't fix bad faith actors.
      *   It can't determine pedagogical value (that's faculty expertise, not committee procedure).
      *   The "Regress Stopper" admits the procedure itself is a presentist artifact.

  5.  **Review and Refine:**
      *   *Tone:* Professional, philosophical, precise, actionable.
      *   *Structure:* Clear headings.
      *   *Check against constraints:* Did I answer all four requirements? Yes. Did I run all three cases? Yes. Did I list limitations? Yes. No bibliography? Yes.
      *   *Self-Correction on Case 1:* The prompt asks "Is the plaque, the petition, or neither the presentist object?" I need to be specific. The plaque uses "common for his class" as an excuse. That's the Frequency-as-Excuse Slide. That makes the *plaque* the presentist object (trying to make history safe for the present). The petition is a request for current alignment.
      *   *Self-Correction on Case 2:* The Professor suspects *their* note is the presentist object. The procedure should confirm this if it smooths over the misogyny to make her palatable to modern students (Anachronism Asymmetry).
      *   *Self-Correction on Case 3:* Need to define "Retrospective Injury." The procedure needs a specific test for this. Causal link vs. Associative link.

  6.  **Final Polish:** Ensure the "Procedure" sounds like a tool they can actually use in a meeting, not just a theoretical essay. Use bolding for steps. Ensure the "Regress Stopper" is clear. (Self-correction: Make sure the distinction between "Honoring" and "Explaining" is sharp in Step 1).

  7.  **Final Output Generation** (Drafting the response based on the above thought process).
answer: |-
  Here is a decision procedure designed for your committee's constraints. It is titled the **Protocol for Historical Assessment (PHA)**. It is structured to be read aloud at the start of a deliberation, followed by the specific case questions.

  ### The Protocol for Historical Assessment (PHA)

  **Step 1: Triage by Function**
  *Question:* What is the primary function of the item under review?
  *   **A. Honoring (Buildings, Named Chairs, Lectures):** The norm is *current alignment*. Honoring is a speech act performed *now*. It asserts that this person represents values we currently endorse.
      *   *Rule:* Historical accuracy is secondary to current alignment. A historically accurate honor that signals current endorsement of harmful values is a failed honor.
      *   *Presentism Check:* Claiming an honor is "presentist" because it judges the past by current values is a **category mistake**. Honoring is constitutively present-facing.
  *   **B. Teaching (Curriculum, Required Texts):** The norm is *pedagogical utility*.
      *   *Rule:* A text stays if it generates understanding, even if its views are false or harmful.
      *   *Presentism Check:* Removing a text solely because its views offend current sensibilities is **harmful presentism** (erasing history). Keeping a text solely because "it's a classic" without addressing harm is **negligent presentism** (ignoring current student context).
  *   **C. Explaining (Plaques, Annotations):** The norm is *truth*.
      *   *Rule:* Explanations must be factually accurate regarding the past and transparent regarding the present decision.
      *   *Presentism Check:* An explanation is presentist if it distorts the past to comfort the present (the **Frequency-as-Excuse Slide**) or distorts the past to make it look more like the present (the **Anachronism Asymmetry**).

  *Stop Rule:* If the item is **Honoring**, proceed to Step 2. If **Teaching**, proceed to Step 3. If **Explaining**, proceed to Step 4.

  **Step 2: The Availability Standard (For Honoring & Verdicts)**
  *Question:* When judging the agent's conduct, what standard of knowledge applies?
  *Select the highest rung supported by the dossier:*
  1.  **Vocabulary:** Did the concepts exist in their language?
  2.  **Articulation:** Did someone actually say the counter-argument in their hearing?
  3.  **Feasibility:** Could they have acted on the counter-argument without losing their position?
  4.  **Survivability:** Could they have acted on the counter-argument without risking life or liberty?

  *Rule:* For **Honoring**, Rung 2 (Articulation) is the threshold. If a dissenting view was articulated and accessible, the agent is responsible for not adopting it.
  *The Dissent Test:* If the dossier shows *one* contemporary peer who articulated the better view, the claim "they could not have known" is **false**.

  **Step 3: The Comparison Window (For Typicality Claims)**
  *Question:* Is the claim "this was typical" valid?
  *   **Window Rule:** The comparison class must be *peers by profession and location* within a *20-year window* centered on the act.
  *   **Gerrymandering Check:** If the committee widens the window (e.g., "most men in history") or narrows the class (e.g., "only slaveholders") to make the view appear typical, the claim is rejected.
  *   **Frequency-as-Excuse Slide:** A finding that "views were common" (Frequency) cannot automatically function as an "excuse" (Exoneration). It explains the view but does not justify the honor.

  **Step 4: The Epistemic Fork (For Explanations & Annotations)**
  *Question:* How are we using our current knowledge?
  *   **Explanation Mode:** We use current knowledge to clarify *why* the past differed from us. (Permitted).
  *   **Condemnation Mode:** We use current knowledge to judge the *moral status* of the agent. (Permitted for Honoring; Restricted for Teaching).
  *   **Policing Asymmetry:** If we label a historical figure a "proto-[modern virtue]" based on sparse evidence, we must apply the same evidentiary standard to labeling them a "[modern vice]." We cannot claim they were "ahead of their time" for good things but "of their time" for bad things.
  *   **Regress Stopper:** The committee must acknowledge that *this procedure itself* is a product of the current historical moment. We are not escaping our standpoint; we are making it explicit. When the dossier runs out, the decision is a **Value Judgment**, not a Historical Finding. Flag this clearly in the recommendation.

  ***

  ### Application to Stipulated Cases

  #### Case One: Hartwell Hall (Honoring)
  *   **Step 1 (Triage):** This is **Honoring** (Building Name). The norm is *current alignment*. The petition asks for removal (alignment check). The plaque is **Explaining** (truth check).
  *   **Step 2 (Availability):** Hartwell published in 1858. Abolitionist pamphlets were on sale; partners subscribed to abolition societies.
      *   *Dissent Test:* **Passed.** Contemporaries articulated the counter-view. "He could not have known" is false.
  *   **Step 3 (Comparison):** The plaque claims his views were "those of most merchants." Even if true (Frequency), this triggers the **Frequency-as-Excuse Slide**. It attempts to use statistical commonality to morally excuse the honor.
  *   **Step 4 (Epistemic Fork):** The plaque distorts the function of history to comfort the present (making the racist view seem inevitable).
  *   **Verdict:**
      *   **The Petition:** Not presentist. It is a valid claim that Hartwell no longer meets the criteria for *current* honoring.
      *   **The Plaque:** **Presentist Object.** It engages in the Frequency-as-Excuse Slide. It implies that because the view was common, it is less offensive to us now. It also fails the Dissent Test (partners dissented).
      *   **Recommendation:** Remove the name. If a plaque remains, it must state: "Hartwell held views on race that were contested by his contemporaries and are incompatible with the university's current values." Do not use "common for his time" as a mitigator.

  #### Case Two: Vance Text (Teaching)
  *   **Step 1 (Triage):** This is **Teaching** (Required Text). The norm is *pedagogical utility*.
  *   **Step 2 (Availability):** 1792. Vance taught Latin/Bookkeeping; corresponded with equal-ed advocate.
      *   *Dissent Test:* **Passed.** Counter-views were articulated and she was aware of them.
  *   **Step 3 (Comparison):** The Professor's note claims she was a "pioneer" whose "theory lagged behind practice."
  *   **Step 4 (Epistemic Fork):** This triggers the **Anachronism Asymmetry**. You are praising her as a "proto-feminist" (pioneer) based on her practice, while minimizing her explicit text (theory) as a "lag." You are claiming she was "ahead of her time" regarding practice but "of her time" regarding theory.
      *   *Regress Stopper:* Your desire to keep the text is a pedagogical value judgment, not a historical finding.
  *   **Verdict:**
      *   **The Petition:** Not presentist. It is a claim that the text's harm outweighs its utility.
      *   **The Note:** **Presentist Object.** It smoothes over the contradiction to make the author palatable to modern students. It violates the Asymmetry rule.
      *   **Recommendation:** Keep the text *only if* pedagogical utility is confirmed by faculty (Value Judgment). Rewrite the note: "Vance practiced a broader education than her theory endorsed. This tension illustrates the constraints on women's public argument in the 1790s." Do not frame the theory as a mere "lag"; frame it as a conflict.

  #### Case Three: Crane Lectures (Honoring/Endowment)
  *   **Step 1 (Triage):** This is **Honoring** (Lecture Series). The norm is *current alignment*.
  *   **Step 2 (Availability):** Crane died 1921. Eugenics reports quoted *after* his death. No connection to him.
      *   *Dissent Test:* **Not Applicable.** The harm is retrospective co-option, not contemporary ignorance.
  *   **Step 3 (Comparison):** N/A. The issue is causal chain, not typicality.
  *   **Step 4 (Epistemic Fork):** The petition argues "retrospective injury." The procedure recognizes this *only if* the honor now functions to endorse the co-option.
      *   *Causal Chain Rule:* For retrospective injury to void an honor, the endowment must be *actively sustaining* the harmful ideology (e.g., funds still go to eugenics research) OR the association must be so strong that the lecture series is *understood* as endorsing that ideology.
  *   **Verdict:**
      *   **The Petition:** Valid only if the *current function* of the lectures signals endorsement of eugenics.
      *   **The Procedure's Limit:** This is a **Value Judgment** flagged by the Regress Stopper. History does not dictate whether association equals endorsement.
      *   **Recommendation:** If the funds are neutral and the association is obscure, the honor stands. If the association is well-known and stains the university's current reputation, the honor is compromised *not because Crane was bad*, but because the *signaling effect* is now negative. Add context: "Crane's foundation was later cited by eugenicists, though he had no direct involvement."

  ***

  ### Limitations and Failure Modes

  You asked where this procedure will misfire. It is a tool for reasoning, not a truth machine. Here are its known failure points:

  **1. The "Pedagogical Utility" Black Box**
  The PHA treats pedagogical utility as a premise (Step 1, Triage B). The committee has no expertise to judge whether a text *actually* teaches well. You will defer to the department, but departments often defend their turf. The procedure cannot distinguish between "this text is essential" and "this text is what we have always taught."
  *   *Failure Mode:* The committee accepts "faculty consensus" as a sufficient answer to utility, allowing historical inertia to masquerade as pedagogical necessity.

  **2. The "Value Judgment" Disguise**
  Step 4 (Regress Stopper) requires you to flag when you are making a value judgment. In practice, committees hate doing this. It looks like weakness.
  *   *Failure Mode:* The committee will write "We find that..." instead of "We value..." The procedure identifies the fork, but it cannot force you to speak honestly at the end of it. You will still dress up value choices as historical findings to protect the recommendation from appeal.

  **3. The "Dissent Test" Threshold**
  The Dissent Test (Step 2) relies on the dossier. You have no research budget. If the dossier is thin, the test fails.
  *   *Failure Mode:* You will exonerate bad actors because the librarian couldn't find a dissenting pamphlet in two hours, not because one didn't exist. The procedure demands evidence you are structurally prevented from gathering. You must explicitly state in the recommendation: "Based on available records," acknowledging the evidentiary cap.

  **4. The Honoring/Explaining Conflation**
  Step 1 distinguishes Honoring from Explaining. But plaques (Explaining) are attached to buildings (Honoring).
  *   *Failure Mode:* You will recommend a plaque (Explanation) to fix a building name (Honor). The procedure says this is often a category error. A plaque does not fix a misaligned honor; it just adds noise. The procedure will tell you to remove the name, but the political pressure will force you to accept the plaque compromise. The procedure cannot stop political cowardice.

  **5. The Regress**
  The procedure admits it is presentist. It is a 2024 tool for judging 1858.
  *   *Failure Mode:* Alumni trustees will reject the Regress Stopper. They will not accept "this is our current value" as a justification for removing a name. They want "this is objectively wrong." The procedure gives you the honest answer ("this is our value"), but the audience may punish you for it.

  **Summary Instruction for the Chair:**
  Use the PHA to structure the meeting, not to automate the vote. When the argument stalls, ask: "Which step of the PHA are we on?" When the dossier ends, say: "We have hit the Regress Stopper. We are now voting on values, not history. Record the vote as such."
