answer: |-
  **Essay Question**

  The distinction between finks and masks is standardly introduced to motivate the failure of the Simple Conditional Analysis (SCA) of dispositions. Finks remove the dispositional basis upon stimulation; masks leave the basis intact but block the manifestation. However, it has been argued that the boundary between these cases is porous: a mask can be redescribed as a fink by narrowing the stimulus condition, and a fink can be redescribed as a mask by broadening the disposition.

  Evaluate the theoretical utility of maintaining a strict distinction between finks and masks. Does this distinction track a genuine metaphysical difference, or is it merely pragmatic? Crucially, analyze whether finks and masks demand *different* revisions to the Conditional Analysis, or if they collapse into a single problem requiring a unified solution. In your answer, consider how the significance of this distinction shifts depending on whether one adopts a reductive account (e.g., Lewis) or a primitivist account (e.g., Bird/Molnar).

  ***

  **Model Answer**

  The distinction between finks and masks is initially compelling: finks (Martin 1994) involve the loss of the categorical base *upon* stimulation, while masks involve external interference with an intact base. However, under pressure, this distinction appears less metaphysically robust and more dependent on how we individuate stimuli and dispositions. Whether this distinction matters depends entirely on the metaphysical framework adopted to solve the problem.

  First, the boundary is porous due to redescription. Consider a masked wire (connected to a dead battery). Standardly, this is a mask: the wire retains its conductivity (base), but the current is blocked. However, if we specify the stimulus as "being connected to a live circuit," the wire fails the test because it lacks the relevant base relative to *that* specific stimulus. Conversely, a finkish glass (shattering upon being struck because a wizard removes its fragility) can be redescribed. If the disposition is "fragility-in-the-absence-of-wizards," the wizard is merely a masker. If redescription is always available, the distinction is not in the world, but in our linguistic framing of the conditional antecedents.

  Consequently, for a reductive project like Lewis's, the distinction collapses. Lewis's Reformed Conditional Analysis (RCA) appeals to an intrinsic causal basis and a *ceteris paribus* clause to exclude finks and masks. For Lewis, both finks and masks are simply cases where the *ceteris paribus* conditions are violated. Whether the base vanishes (fink) or is interfered with (mask), the result is the same: the simple counterfactual is false despite the disposition's presence. Lewis needs a unified fix—anchoring the disposition to a stable intrinsic property and holding background conditions fixed. Thus, for the reductivist, maintaining a sharp fink/mask distinction offers no additional theoretical leverage; both are simply threats to the stability of the base-manifestation link that require a more complex conditional analysis.

  However, the distinction regains metaphysical bite for dispositional essentialists like Bird or Molnar. For Bird, dispositions are identical to their causal bases. On this view, genuine finks are metaphysically impossible. If fragility *is* the molecular structure, a wizard cannot remove the fragility without removing the structure, in which case the object no longer exists to be struck. A "fink" here is just a destruction of the object, not a removal of a property. Masks, however, remain possible; external interferers can block manifestations without altering the essential nature of the property.

  Therefore, the utility of the distinction is framework-relative. In a reductive framework (Lewis), finks and masks are functionally equivalent counterexamples requiring a unified semantic fix (RCA). The distinction is pragmatic, helping us visualize different ways the conditional fails, but it does not dictate different solutions. In a primitivist framework (Bird), the distinction is metaphysically profound. Finks are category errors (impossible), while masks are contingent obstacles.

  Ultimately, insisting on a strict distinction is only necessary if one rejects the reductive project. If the goal is to save the Conditional Analysis, both cases push us toward the same revision: abandoning the simple counterfactual for one anchored in intrinsic bases and stable background conditions. The distinction matters not for the *logic* of the analysis, but for the *ontology* of the properties involved.

  ***

  **Marking Scheme**

  **A Answer (Excellent / Distinction)**
  *   **Redescription Argument:** Explicitly addresses the "porous boundary" problem. Explains *how* a mask can be redescribed as a fink (via stimulus specification) and vice versa.
  *   **Framework Sensitivity:** Crucially distinguishes between the implications for **Lewis (Reductive)** vs. **Bird/Molnar (Primitivist)**.
      *   Notes that for Lewis, both require the same fix (RCA + *ceteris paribus*), rendering the distinction theoretically idle for the *analysis* itself.
      *   Notes that for Bird, finks are metaphysically impossible (identity of base and disposition), while masks are possible, making the distinction ontologically significant.
  *   **Synthesis:** Concludes that the distinction's value depends on the broader metaphysical commitment (semantic fix vs. metaphysical impossibility).
  *   **Clarity:** Precise use of terms (base, stimulus, manifestation, intrinsic/extrinsic).

  **B Answer (Good / Competent)**
  *   **Definitions:** Correctly defines finks and masks and explains how they refute the Simple Conditional Analysis (SCA).
  *   **Lewis's Solution:** Accurately outlines Lewis's Reformed Conditional Analysis (intrinsic basis) as a solution to both.
  *   **Limited Critique:** May mention that redescription is possible but fails to draw the conclusion that this makes the distinction pragmatic rather than metaphysical.
  *   **Missing Element:** Typically treats Lewis and Bird's accounts as merely "different views" rather than showing how the *status* of the fink/mask distinction changes depending on which view is adopted. Often argues the distinction *always* matters (or *never* matters) without qualifying the metaphysical framework.
  *   **Structure:** Clear essay structure but lacks the critical "pivot" regarding the theoretical utility of the distinction.

  **Common Pitfalls (C / Fail)**
  *   **Recitation:** Merely lists examples of finks and masks without analyzing their relationship to the Conditional Analysis.
  *   **Confusion:** Confuses masks with mimics (where the base is absent but manifestation occurs).
  *   **Ignoring the Prompt:** Discusses dispositions generally but fails to address whether finks and masks require *different* revisions to the CA.
  *   **Oversimplification:** Claims Lewis "solves" finks but not masks (or vice versa), missing that RCA is designed to handle both via the *ceteris paribus* clause.
