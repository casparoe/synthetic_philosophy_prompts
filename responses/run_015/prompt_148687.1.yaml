answer: |-
  # JOINT STATEMENT ON THE NATURE OF WEAKNESS OF WILL AND INTERTEMPORAL CHOICE

  **Collaborators:** The Normative-Rationalist Camp (Camp A) and The Intertemporal-Mechanist Camp (Camp B)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Akrasia and Hyperbolic Discounting

  ### Preamble: Camp Definitions and Conceptual Framework

  This document records the findings of an adversarial collaboration between two distinct theoretical frameworks regarding self-control and intertemporal choice.

  *   **Camp A (Normative-Rationalist):** Holds that *akrasia* (weakness of will) is a distinctive failure of practical rationality wherein an agent acts against their own all-things-considered judgment. Camp A maintains that hyperbolic discounting is, at best, a descriptive model of preference reversal that fails to capture the normative and phenomenological structure of being divided against oneself.
  *   **Camp B (Intertemporal-Mechanist):** Holds that phenomena labeled *akrasia* are exhaustively explained by hyperbolic or quasi-hyperbolic discount dynamics—including preference reversals, the value of precommitment, and associated neural correlates. Camp B maintains that talk of "best judgment" and "normative residue" is a dispensable folk-psychological overlay on underlying causal mechanisms.

  To facilitate this collaboration, we introduce three conceptual tools. These terms are defined for the purpose of this dialogue; their ontological status remains a point of contention (see Section 2).

  1.  **Diachronic Authority:** The putative capacity of a prior resolution to bind a present agent. Camp A investigates this as a matter of *rational continuity* (the past self has normative claim on the present self). Camp B investigates this as a matter of *external causal constraint* (the past self altered the present choice architecture).
  2.  **Binding-Cost:** The effort, cognitive load, or welfare loss incurred by an agent in maintaining a resolution against competing impulses (e.g., the pain of resisting a temptation).
  3.  **Binding-Residue:** The normative standing or psychological sense of obligation that remains even when the Binding-Cost is eliminated by technology (e.g., when a precommitment device makes violation impossible).

  ---

  ### 1. Agreed Claims (Consensus Statement)

  The following claims represent empirical, mathematical, or logical propositions accepted by both Camp A and Camp B. These claims distinguish settled science from theoretical interpretation.

  1.  **Formal Properties of Discounting:**
      *   **Exponential Discounting:** Models intertemporal choice using a constant discount rate ($r$), such that value $V$ at time $t$ is $V e^{-rt}$. This model satisfies *dynamic consistency* (preferences do not reverse merely due to the passage of time).
      *   **Hyperbolic/Quasi-Hyperbolic Discounting:** Models intertemporal choice using a discount rate that declines over time (e.g., $V / (1 + kt)$). This model allows for *dynamic inconsistency* (preference reversal), where a smaller-sooner reward is preferred to a larger-later reward when both are near, but the preference reverses when both are distant.
      *   **Consensus:** Human and animal behavior systematically violates the exponential model in ways predicted by the hyperbolic model. (Status: *Widely Accepted in Behavioral Economics/Psychology*).

  2.  **Predictive Successes and Failures:**
      *   Exponential discounting successfully models normative ideals of rational choice and some market behaviors but fails to predict individual choices involving immediate gratification.
      *   Hyperbolic discounting successfully predicts preference reversals (e.g., choosing $100 today over $110 tomorrow, but choosing $110 in 30 days over $100 in 29 days).
      *   **Consensus:** No single discount function captures all variance in human intertemporal choice; context and framing effects modulate discount rates. (Status: *Widely Accepted*).

  3.  **Mechanics of Precommitment:**
      *   Precommitment devices function by altering the payoff matrix available to the future self (e.g., imposing a financial penalty for deviation or physically removing the option).
      *   **Consensus:** Access to precommitment devices increases the rate of goal attainment for agents who express a desire to resist temptation. (Status: *Widely Accepted*).

  4.  **Violation of Resolutions:**
      *   **Consensus:** There exist empirically verifiable cases in which agents explicitly form a prior resolution (e.g., "I will not eat sugar") and subsequently act in violation of that resolution (e.g., eating sugar), often reporting regret afterward. (Status: *Widely Accepted*).

  5.  **Empirical Findings on Self-Control:**
      *   **Consensus:** Delay of gratification correlates with various life outcomes (e.g., the "Marshmallow Test" literature), though effect sizes are moderated by socioeconomic stability and trust in the environment.
      *   **Consensus:** Neural correlates of self-control involve competition between limbic/reward systems (associated with immediate valuation) and prefrontal control systems (associated with long-term planning). (Status: *Widely Accepted in Neuroscience*).

  6.  **Conceptual Definitions:**
      *   **Consensus:** For the purposes of this collaboration, *Diachronic Authority*, *Binding-Cost*, and *Binding-Residue* are recognized as valid variables for analysis, regardless of whether they are ultimately reduced to normative facts or causal mechanisms. (Status: *Procedural Agreement for Collaboration*).

  ---

  ### 2. Disagreements Table (Residual Disputes)

  The following table outlines where the camps diverge in their interpretation of the agreed claims. The wording in each column is endorsed by the respective camp as an accurate description of their position.

  | Issue | Camp A (Normative-Rationalist) Wording | Camp B (Intertemporal-Mechanist) Wording |
  | :--- | :--- | :--- |
  | **Nature of Akrasia** | Akrasia is a **failure of practical rationality**. The agent acts against their "best judgment," creating a normative defect that cannot be reduced to preference shifts. | Akrasia is a **preference reversal**. The agent acts on their current highest-ranked preference; the "best judgment" was merely a past preference with no special authority. |
  | **Diachronic Authority** | Prior resolutions retain **rational authority** over the present self. Violating them is a betrayal of the agent's own rational unity, even if current preferences shift. | Prior resolutions retain **causal influence** only. They bind the present self only insofar as they impose costs or constraints; they hold no inherent normative authority. |
  | **Binding-Residue** | **Exists.** Even if technology removes the Binding-Cost (making violation impossible), the agent owes allegiance to the prior plan. The residue is the normative force of the plan itself. | **Does not exist.** What is called "residue" is either post-hoc confabulation or the anticipation of future regret (a utility cost). If Binding-Cost is zero, the obligation is zero. |
  | **Phenomenology** | The feeling of being "torn" (synchronic conflict) is a perception of a **normative clash** between reason and inclination. | The feeling of being "torn" is a perception of **competing neural valuation signals** with no inherent normative valence. |
  | **Explanation Goal** | To explain how agents **ought** to integrate their selves over time and why failing to do so is irrational. | To explain how agents **do** integrate their selves over time and how mechanisms can optimize utility functions. |

  ---

  ### 3. Cruxes and Predictions

  The following sub-questions represent the live wires of the dispute. Settling these would significantly shift the probability of one camp's framework being adopted over the other. We utilize the **Silent-Precommitment Case** to test these cruxes.

  **The Silent-Precommitment Case:** An agent binds herself via an automatic mechanism (e.g., a locked savings account with irreversible withdrawal restrictions). At the moment the binding takes effect, she experiences **no subjective conflict** (she is not tempted at that exact moment). Later, when she wishes she could access the funds for an impulse buy but cannot, she reports: "I would have spent this money if I could, but I do not feel I am acting against myself now; I am glad the lock exists."

  #### Crux A: The Existence of Normative Residue
  *Question:* Does a prior resolution retain authority over the present self even after present preferences have shifted and Binding-Cost is eliminated by technology?
  *   **Camp A Prediction:** Even without synchronic conflict, there remains a **diachronic betrayal** if the agent *would* have violated the plan without the lock. The lock saved the agent from irrationality. The "Binding-Residue" is real; the agent is rationally answerable to the past resolution.
  *   **Camp B Prediction:** Without present preference reversal (conflict), there is **no akrasia**. The agent has successfully optimized their utility function across time. The retrospective report ("I would have spent it") is merely data about counterfactual preferences, not evidence of normative failure. The "residue" is confabulation.

  #### Crux B: Synchronic Conflict vs. Diachronic Betrayal
  *Question:* Are "synchronic conflict" (feeling torn at the moment of action) and "diachronic betrayal" (violating a prior plan without present subjective conflict) distinct phenomena, or does one collapse into the other?
  *   **Camp A Prediction:** They are **distinct**. One can betray one's rational plan without feeling torn (e.g., through negligence or subtle rationalization). Akrasia can be "silent." The absence of pain does not prove the absence of rational failure.
  *   **Camp B Prediction:** They are **collapsible**. "Betrayal" is just a label for the negative utility experienced during synchronic conflict or regret. If there is no conflict at the time of action and no regret later (because the lock worked), no "betrayal" occurred. The distinction is verbal, not ontological.

  #### Crux C: The Mechanism of Precommitment Success
  *Question:* Does precommitment succeed by altering underlying preferences (internal change) or by imposing an external causal constraint (external change), and does this distinction bear on whether weakness of will has occurred?
  *   **Camp A Prediction:** Precommitment is a **prosthetic for rationality**. It imposes an external constraint because the internal will was weak. The existence of the need for the constraint proves the weakness of will existed *ex ante*.
  *   **Camp B Prediction:** Precommitment is a **preference-shaping technology**. By changing the choice architecture, it changes the valuation of the options. There is no "internal will" to be weak; there are only constraints. If the constraint works, the preference is effectively altered.

  ---

  ### 4. Statement on Verbal vs. Substantive Disputes

  In the spirit of clarifying the dialectic, we distinguish between disagreements that arise from terminology and those that arise from fundamental ontological commitments.

  #### 4.1 Verbal Disputes (Potentially Dissolvable)
  Both camps acknowledge that a portion of the disagreement stems from the definition of **"Preference."**
  *   **Camp A** tends to define preference as "all-things-considered judgment" (normative).
  *   **Camp B** tends to define preference as "revealed choice behavior" (descriptive).
  *   **Reasoning:** If Camp B accepts that "revealed preference" at time $t$ can be irrational relative to a plan at time $t-1$, and Camp A accepts that "judgment" has neural correlates subject to discounting, the gap narrows. Much of the friction regarding whether the agent "really wants" the immediate reward is verbal.
  *   **Consensus on Verbal Nature:** Both sides agree that if the dispute were *only* about whether to label a behavior "akrasia" or "preference reversal," the collaboration would be trivial. The dispute persists because the labels carry theoretical baggage regarding *responsibility* and *optimality*.

  #### 4.2 Substantive Disputes (Genuinely Contested)
  The core disagreement is **ontological and normative**, not merely linguistic.
  *   **Irreducibility of Normativity:** Camp A asserts there are facts about practical rationality that are not reducible to causal descriptions of discount curves. Camp B denies this, asserting that once the causal mechanics (neural, behavioral, economic) are fully described, no "normative residue" remains to be explained.
  *   **Authority of the Past Self:** Camp A posits a substantive claim that the past self has a *right* to rule the present self based on rational unity. Camp B posits that the past self is merely a different temporal slice of the organism with no special claim other than what it can causally enforce.
  *   **Status:** This is **Genuinely Open**. There is no widely accepted method in philosophy or economics to adjudicate whether normative facts exist independently of descriptive mechanisms.

  #### 4.3 Classification of Claims in this Document
  To ensure transparency for readers familiar with the topic:
  *   **Widely Accepted (Philosophy & Economics):** The mathematical properties of hyperbolic vs. exponential discounting (Section 1, Claim 1); the existence of preference reversals (Section 1, Claim 2); the efficacy of precommitment devices (Section 1, Claim 3).
  *   **Camp-Specific (Contested):** The claim that akrasia is a *normative failure* (Camp A, Section 2); the claim that akrasia is *exhaustively explained* by discount dynamics (Camp B, Section 2); the existence of *Binding-Residue* (Camp A, Crux A).
  *   **Genuinely Open (Research Frontier):** Whether "silent" violations of plans constitute rational failure (Crux B); whether the phenomenology of conflict is necessary for akrasia (Crux B); the extent to which precommitment alters preferences vs. constraints (Crux C).

  **Conclusion:** This collaboration confirms that while the *mechanics* of intertemporal choice are well-mapped, the *interpretation* of those mechanics as instances of rational failure remains a deep fissure between normative philosophy and behavioral science. Resolving this requires not more data on discount rates, but a theory of how diachronic authority is constituted.
