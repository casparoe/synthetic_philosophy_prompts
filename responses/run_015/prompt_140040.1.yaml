answer: |-
  **MINISTRY OF CIVIC MEMORY**
  **BUREAU OF NARRATIVE CONSOLIDATION**
  **STANDARD OPERATING PROCEDURE 44-B**

  **SUBJECT:** Allocation of Historical Authority and Management of Ontological Liabilities
  **DATE:** 14 October 202X
  **CLASSIFICATION:** INTERNAL USE ONLY

  **1.0 DEFINITION OF VICTOR STATUS**
  1.1 For the purposes of Narrative Share Allocation, a "Victor" is defined as any state entity retaining administrative control over the contested territory for a period exceeding twenty-four months post-ceasefire.
  1.2 In cases of coalition victory, Narrative Share shall be distributed proportionally based on casualty expenditure and resource commitment. Disputes regarding proportional share are to be referred to the Committee on Proportional Glory.
  1.3 In the event of a negotiated settlement or stalemate where no clear administrative control is established, Victory Status shall be assigned to the party possessing the greater capacity for archival storage. Where storage capacity is equal, the Bureau shall designate the Victor based on projected economic stability over the subsequent decade.

  **2.0 HANDLING OF CONTRADICTORY EVIDENCE**
  2.1 Physical evidence (ballistics, mass grave locations, satellite imagery) contradicting the Approved Narrative shall not be destroyed unless storage costs exceed the allocated budget for Truth Maintenance.
  2.2 Such evidence is to be reclassified as "Hypothetical Material" and moved to Low-Traffic Archives (Zone 4).
  2.3 Private diaries, correspondence, and neutral observer records generated by Defeated Entities are to be processed as "Unverified Fiction." These documents retain ontological status only until such time as they are cited in a peer-reviewed publication. Upon citation, they must be immediately rebutted or acquired by the state.

  **3.0 WORKED CASE: THE KELMAR STABILIZATION OPERATION**
  3.1 **Intake:** Following the Kelmar Stabilization (2018–2020), the Bureau received 4,500 linear feet of documentation from State A (Victor) and 1,200 linear feet from State B (Defeated).
  3.2 **Classification:** State A was granted 85% Narrative Share based on territorial retention. State B was granted 15% Share, limited to cultural contributions excluding military causality.
  3.3 **Allocation:** Field reports indicating State A initiated hostilities were tagged for *Reverse Archival Drift* monitoring.^1 They were not destroyed, as destruction implies fear of the content. Instead, they were digitized and stored on servers with high latency, rendering them functionally unavailable without altering their legal status.
  3.4 **Review:** During the Five-Year Review, it was noted that private accounts from State B were gaining traction in foreign academic journals. The Bureau authorized a funding increase for State A chair positions to absorb these accounts into the Approved Narrative as "misunderstandings of tactical necessity."

  **4.0 TEMPORAL STABILITY AND SUCCESSION**
  4.1 To prevent narrative instability during regime change, the Bureau enforces a Thirty-Year Stability Window. No Approved Narrative regarding a conflict may be altered within thirty years of the initial consolidation, regardless of changes in domestic leadership.
  4.2 If a successor regime repudiates the war conducted by its predecessor, the predecessor is reclassified as a "Foreign Occupier" for historical purposes, even if domestic continuity exists. This ensures the Victor status remains with the current administration.
  4.3 Suppressed accounts do not become "false" upon suppression; they become "latent." Latency implies a potential energy that must be managed. The Bureau must budget for the containment of this energy.

  **5.0 ONTOLOGICAL LIABILITY AND MEASUREMENT**
  5.1 Personnel are reminded that while the Bureau determines the circulating account of events, it does not determine the events themselves. The Bureau manages the relationship between the two.
  5.2 When calculating Ontological Liability, staff must measure the deviation of the Approved Narrative from the *Actual Sequence of Events*.
  5.3 It is acknowledged that the *Actual Sequence of Events* is inaccessible except through the Approved Narrative. However, to calculate the risk of Reverse Archival Drift, staff must posit the existence of an objective baseline against which the Narrative is measured.
  5.4 Therefore, for all compliance calculations, staff will operate under the assumption that a fixed reality exists independent of the Bureau's output. This assumption is strictly administrative. Personnel attempting to reconcile this assumption with the Bureau's founding mandate (that reality is contingent upon narrative output) will be referred to Psychological Support.
  5.5 Disposal of Defeated Entity records prior to the signing of the Peace Treaty is prohibited. Records generated prior to Victory Status assignment possess a provisional truth value that must be neutralized formally, not physically, to ensure the legal transfer of historical authority is complete.

  **APPENDIX A: FREQUENTLY ASKED QUESTIONS FROM REGIONAL OFFICES**

  **Q: If a suppressed account is never published, did it happen?**
  **A:** It happened, but it did not occur within the jurisdiction of History. It is the Bureau's responsibility to ensure that what happened and what occurred in History are aligned.

  **Q: How do we measure Drift if the Baseline is classified?**
  **A:** The Baseline is not classified; it is undefined. Staff should estimate the Baseline using intelligence data from the period of conflict. Use the intelligence data as truth for the purpose of measuring the Narrative's deviation, then classify the intelligence data as Fiction once the measurement is complete.

  ***

  ^1 **Reverse Archival Drift:** The tendency of a defeated side's version of events to regain credibility as the generation that fought dies off and archival security protocols degrade. Budgeted against annually.
