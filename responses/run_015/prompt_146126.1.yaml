answer: |-
  # SCRATCH-WORK SECTION

  **1. Substantive vs. Verbal Disagreements**
  *   **Substantive:** The direction of metaphysical dependency (Parts → Whole vs. Whole → Parts). This determines whether "constituents" are ontologically prior items or derivative abstractions. The status of the "mode of combination": is it a functional constraint with explanatory power (Structuralist) or a label for the brute fact of unity (Primitivist)?
  *   **Potentially Verbal:** The use of "primitive." If the Structuralist admits the *applicability* of a mode is primitive, and the Primitivist admits the *unity* is primitive, the gap may be merely whether one calls the primitive a "relation-to-constituents" or a "property-of-the-whole." However, this tracks the substantive dependency issue, so it is likely not *merely* verbal.
  *   **Question-Begging in User's Framing:**
      *   **Premise (2):** "Those constituents can exist without composing it." This assumes the Structuralist ontology. The Primitivist denies constituents exist *as such* outside the proposition.
      *   **Premise (4):** "Whatever does the uniting must itself be something that stands to the constituents as they stood to the proposition." This assumes the unifier is a relatum (saturated). The Structuralist denies this (unsaturatedness/type-constraint).
      *   **Diagnostic (a):** The user suspects the Primitivist rejects neither Insufficiency nor Parity. In fact, the Primitivist rejects Insufficiency (nothing *beyond* is needed) and rejects the framing of Parity (there is no "standing to" relation because there are no prior relata).

  **2. Diagnostic Assessment**
  *   **(a) Insufficiency/Parity:** Useful for mapping escape routes, but the Primitivist's rejection of Insufficiency is often read as obscurity. Needs sharpening to "Priority of Existence."
  *   **(b) Thick/Thin Regress:** Crucial. If the Structuralist claims a "thin" regress, the Primitivist will call it a hidden primitive. This diagnostic must focus on *ontological cost*, not just psychological grasp.
  *   **(c) Abstraction Test:** The strongest differentiator. If the Structuralist cannot specify constituents independently, they collapse into Primitivism. If the Primitivist cannot explain abstraction without presupposing the whole, they beg the question.

  **3. Metaphor Watch**
  *   Avoid: "Hook," "tie," "glue," "slot," "container."
  *   Replace with: "Ontological category," "functional role," "dependency relation," "combinatorial constraint," "truth-evaluable structure."

  ***

  # JOINT STATEMENT ON THE UNITY OF THE PROPOSITION

  **Working Group Participants:** The Structuralist, The Primitivist.
  **Convenor:** [User]
  **Subject:** The metaphysical basis of propositional unity, specifically regarding the proposition *that Brutus stabbed Caesar*.

  ## PART I: AGREED CLAIMS

  1.  **Distinctness of Order:** The proposition *that Brutus stabbed Caesar* is distinct from *that Caesar stabbed Brutus*, and both are distinct from any mere aggregate (set, list, sum) of {Brutus, Stabbing, Caesar}.
      *   *Work:* Establishes the explanandum: unity involves directedness, not just collection.
  2.  **Non-Identity with Aggregates:** No unordered set, list, or mereological sum of constituents constitutes the proposition or possesses truth conditions.
      *   *Work:* Rules out extensional reductions as sufficient accounts of unity.
  3.  **Rejection of Naive Unifiers:** Both parties reject the view that the unifier is an ordinary saturated relation among the constituents (e.g., a relation linking Brutus to Stabbing).
      *   *Work:* Blocks the immediate infinite regress generated by treating the tie as just another relatum.
  4.  **Generality Constraint:** Any account must handle *that Brutus was ambitious* (monadic), *that Brutus did not stab Caesar* (negated/false), and *that Caesar stabbed Brutus* (reordered) without ad hoc machinery for each.
      *   *Work:* Prevents solutions tailored only to true, dyadic atomic propositions.
  5.  **Coding Insufficiency:** A set-theoretic or syntactic coding of propositions is not an ontological explanation unless accompanied by an account of what makes the coding truth-evaluable and about its objects.
      *   *Work:* Distinguishes modeling from metaphysical grounding.
  6.  **Finite Grasps:** A finite thinker's grasp of the proposition *that Brutus stabbed Caesar* cannot require entertaining infinitely many levels of unifying ties.
      *   *Work:* Constrains solutions to those compatible with finite cognitive capacity (rules out "completed" thick regresses).

  ## PART II: DISAGREEMENTS TABLE

  | Crux | Structuralist Formulation | Primitivist Formulation | Genuine or Verbal? | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Source of Regress** | The regress arises only if one assumes the relation *stabbing* is a saturated object needing further connection to Brutus and Caesar. | The regress arises for any view that treats constituents as prior items requiring combination; combinatorial stories always defer unity. | **Genuine** | Turns on whether "unsaturatedness" is a coherent ontological category or a denial of the need for combination. |
  | **2. Status of Unifier** | A mode of combination (or unsaturated relation) is a principled stopping point that explains why Brutus and Caesar are linked specifically as *subject* and *object*. | A "mode of combination" is merely a name for the primitive unity of the whole; it adds no explanatory power over asserting unity is brute. | **Genuine** | Turns on whether functional roles (subject/object) can be grounded in constituents or only in the whole. |
  | **3. Metaphysical Priority** | Constituents (Brutus, Stabbing) are ontologically prior to the proposition; the proposition is built from them. | The proposition is ontologically prior; constituents are abstractions derived from analyzing the whole. | **Genuine** | Contradictory claims about dependency direction; cannot both be true. |
  | **4. The Monadic Case** | *That Brutus was ambitious* requires the same predicative machinery as the dyadic case; ambition is unsaturated relative to Brutus. | The monadic case reveals the dyadic case is misleading; there is no "tie" between two items, only a complex property instantiated. | **Genuine** | Affects whether the solution generalizes or requires separate treatment for arity. |
  | **5. Primitive vs. Brute** | Accepting the applicability of a mode is a primitive, but it is constrained by types, making it non-arbitrary. | Accepting unity is primitive is brute, but it avoids the error of pretending parts exist before the whole. | **Verbal/Substantive** | Verbal if both admit a stopping point; Substantive if "type constraints" imply further ontology the Primitivist denies. |

  ## PART III: TESTS AND PREDICTIONS

  **Test 1: The Monadic Mirror**
  *   **Procedure:** Consider *that Brutus was ambitious*. Attempt to form the mirror *that Ambitious was Brutus*. Ask: Is the impossibility of the mirror explained by the constituents themselves or by the whole?
  *   **Structuralist Prediction:** The impossibility is explained by the ontological category of *Brutus* (object) vs. *Ambitious* (property); the constituents carry the restriction.
  *   **Primitivist Prediction:** The impossibility is explained because *that Ambitious was Brutus* is not a possible whole from which to abstract; the restriction lies in the space of possible propositions, not in the items.

  **Test 2: The False-Instance Test**
  *   **Procedure:** Consider *that Brutus did not stab Caesar*. There is no fact corresponding to this proposition. Ask: What grounds the unity of this proposition if not the actual obtaining of the relation?
  *   **Structuralist Prediction:** The unity is grounded in the mode of combination (predication), which operates regardless of truth; the mode exists even if the fact does not.
  *   **Primitivist Prediction:** The unity is grounded in the proposition itself as an abstract object; appealing to a "mode" distinct from the proposition risks reifying nothingness.

  **Test 3: The Grasping Question**
  *   **Procedure:** To grasp the proposition *that Brutus stabbed Caesar*, must one grasp the mode of combination as a distinct item?
  *   **Structuralist Prediction:** One must grasp the mode, but not as a constituent; one grasps it as the way the constituents are presented.
  *   **Primitivist Prediction:** One grasps the proposition directly; distinguishing the "mode" from the "whole" is an artifact of analysis, not a condition of grasp.

  ## PART IV: CONCESSIONS AND COUNTER-EVIDENCE

  **Structuralist Concession:**
  *   **Claim:** The Structuralist concedes that the "mode of combination" cannot itself be a constituent requiring further combination; its applicability must be taken as primitive.
  *   **Counter-Evidence:** If it can be shown that type-constraints (e.g., "objects cannot predicate") themselves require a further metaphysical ground to be intelligible, the Structuralist account resumes the regress.

  **Primitivist Concession:**
  *   **Claim:** The Primitivist concedes that constituents must be intelligible *in some sense* independently, otherwise analysis of the proposition is impossible.
  *   **Counter-Evidence:** If it can be shown that the constituents (Brutus, Stabbing) can be fully specified and understood without presupposing the proposition *that Brutus stabbed Caesar*, the Priority of Whole thesis is undermined.

  ## PART V: CODA ON DIAGNOSTICS

  **Diagnostic (a) Insufficiency/Parity:**
  *   **Verdict:** **Misleading.** It assumes the "constituents first" model in the Insufficiency premise.
  *   **Replacement:** **The Priority Question.** Ask: "Do the constituents exist as combinable items prior to the proposition?" This forces the Primitivist to deny the premise rather than dodge the parity constraint.

  **Diagnostic (b) Thick/Thin Regress:**
  *   **Verdict:** **Needs Sharpening.** "Thin" is often used to hide primitives.
  *   **Replacement:** **Ontological Cost.** Ask: "Does the stopping point (mode/unity) introduce new entities or constraints that themselves require explanation?" This distinguishes a genuine explanation from a label.

  **Diagnostic (c) Abstraction Test:**
  *   **Verdict:** **Keep.** This is the strongest differentiator.
  *   **Refinement:** Clarify "independent specifiability." It should not mean "can be named," but "can be understood as having combinatorial potential without presupposing the specific whole." This prevents the Structuralist from claiming victory simply by naming the parts.
