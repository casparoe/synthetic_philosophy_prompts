      *   *Accuracy:* Broadly correct. If priors are identical (common prior assumption) and rationality is common knowledge, speculative trade based purely on private information cannot occur. If I sell to you, I reveal I think the price is too high; you update your belief; price adjusts until no gain from trade.
      *   *Nuance:* The "common knowledge" part is crucial and very strong. It's not just "everyone knows," it's an infinite recursion.
