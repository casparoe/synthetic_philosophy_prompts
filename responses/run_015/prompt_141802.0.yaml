  5.  **Evaluate the Name-Dropping (Milgrom-Stokey vs. Aumann vs. Grossman-Stiglitz):**
      *   *Aumann (1976):* "Agreeing to Disagree." Shows that posteriors cannot be common knowledge if they differ. Foundation for No-Trade.
