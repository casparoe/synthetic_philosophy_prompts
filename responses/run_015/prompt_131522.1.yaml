          1.  Reconstruct candidate rules (including the user's three + the "reciprocity/symmetry" rule).
          2.  Apply rules to the case (predict outcomes, identify divergences, specifically regarding anti-fusion vs. proceduralism and the nature of the data).
          3.  Give a best guess verdict (with reasoning, closest analog, and weight).
          4.  Propose a minimal variant/further case to separate underdetermined rules and identify the principles committed to.

  2.  **Deconstruct the Precedents (The "Track Record"):**
      *   *Case 1 (National ID):* Refused linking health, tax, school. *Principle:* Anti-fusion/Linkage prohibition. Wrong is the linkage, not the individual records.
      *   *Case 2 (Beneficial Ownership):* Required public registers. *Principle:* Transparency for power-holders (corporate).
      *   *Case 3 (Anonymity):* Struck down real-name for forums; upheld for political ads. *Principle:* Contextual anonymity vs. accountability for influence.
      *   *Case 4 (CCTV):* Live OK, retention >72h NO, facial recognition NO. *Principle:* Proportionality, minimization, human oversight (implied by "absent suspicion").
      *   *Case 5 (Tax/Customs):* Automated matching OK *if* rule published + human review before effect. *Principle:* Procedural safeguards license data use.
      *   *Case 6 (Scores vs. Judgments):* Blocked private reliability scores; Allowed public court judgments (with contestation). *Principle:* Public authority vs. private profit; due process/contestability.
      *   *Case 7 (Assets vs. Benefits):* Civil servants publish assets; benefit recipients do not. *Principle:* Power asymmetry (officials have power over citizens, not vice versa).
      *   *Case 8 (School Wellbeing):* Blocked logging sleep/mood for neglect flagging, even with consent. *Principle:* Protection of vulnerable groups/children; chilling effect on seeking help; scope creep.

  3.  **Drafting Section 1: Reconstructing Candidate Rules:**
      *   *Rule A (Anti-Fusion/Linkage):* Derived from Case 1 (National ID) and Case 8 (School). The state shouldn't create a "super-profile" from scattered lawful records.
      *   *Rule B (Power Asymmetry):* Derived from Case 2 (Ownership), Case 3 (Ads), Case 7 (Assets). Disclosure duties scale with power exercised over others or the public sphere.
      *   *Rule C (Proceduralist/Non-Arbitrariness):* Derived from Case 4 (CCTV), Case 5 (Tax), Case 6 (Judgments). Data use is okay if rules are published, humans review, and contestation exists.
      *   *Rule D (Epistemic Reciprocity/Symmetry):* (User's suggestion). The ratio of State Knowledge : Citizen Knowledge. If the state knows more about you than you know about the state (or the rules governing you), it's suspect. Case 5 (published rules) and Case 7 (assets) hint at this, but it's a stronger theoretical lens.

  4.  **Drafting Section 2: Applying Rules to the Housing Register:**
      *   *The Register:* Landlord checks tenant (Green/Amber/Red). Inputs: Evictions, Noise, *Discrimination Complaints (even as complainant)*. Tenant can see file/contest, but *not* the scoring rule.
      *   *Rule A (Anti-Fusion):* **Conflict.** It fuses eviction (court), noise (mediation), and discrimination (equality body). This looks like the National ID case. *Nuance:* These are "official determinations" not "behavioral traces" (like sleep/mood). Does that save it? Maybe, but it's still a cross-agency profile.
      *   *Rule B (Power Asymmetry):* **Conflict.** Tenants generally have *less* power than landlords. This register empowers landlords to screen tenants. Case 7 says benefit recipients (vulnerable) don't need to publish assets. This register targets vulnerable housing seekers. However, "nuisance tenants" harm neighbors (public power?). But the discrimination complaint input is a major red flag here (punishing the victim).
      *   *Rule C (Proceduralist):* **Mixed.** Tenant can contest (Good). But scoring rule is secret (Bad - violates Case 5 "matching rule being published"). Human review? Not specified, but "Green/Amber/Red" suggests automation.
      *   *Rule D (Reciprocity):* **Fail.** Landlord/State knows the score; Tenant doesn't know the algorithm. State knows tenant history; Tenant doesn't know state logic. Asymmetry is high.

      *   *Divergence Point:* Anti-Fusion says "Don't link these databases." Proceduralist says "You can link them IF you publish the rules and allow review." The secret scoring rule breaks the Proceduralist defense, aligning it with Anti-Fusion in outcome, but for different reasons.
      *   *Data Nature:* Eviction/Noise are conduct. Discrimination complaint status is *not* conduct (it's a legal right exercise). This matters for Anti-Fusion (is it a "picture of a person" or a "record of liability"?).

  5.  **Drafting Section 3: Best Guess Verdict:**
      *   *Verdict:* **Blocked (Unlawful)**, but with a path to remedy.
      *   *Reasoning:* The "Discrimination Complaint" input is the poison pill. It chills rights enforcement (like the School Wellbeing case chilling reporting of neglect/mood). The Secret Scoring Rule violates the Tax/Customs precedent (Case 5).
      *   *Closest Analog:* **Case 6 (Private Scores vs. Public Judgments)** combined with **Case 8 (School Wellbeing)**.
      *   *Weight:* Case 6 is heavy because it distinguishes between raw data (judgments) and processed risk (scores). Case 8 is heavy because it protects vulnerable populations from surveillance that discourages seeking justice.
      *   *Why not Anti-Fusion?* The commission allowed Tax/Customs matching (Case 5). So fusion *per se* isn't dead. It's fusion *without transparency* + *chilling effect*.

  6.  **Drafting Section 4: Minimal Variant / Separating Case:**
      *   *Problem:* Is it the *fusion* or the *secrecy* or the *power dynamic*?
      *   *Variant:* A register where the scoring rule is fully public, the discrimination input is removed, but the fusion remains.
      *   *Alternative Separating Case:* A "Landlord Conduct Register" (reciprocal).
      *   *Principle Commitment:*
          *   If they block the original: Commitment to **Substantive Rights Protection** (cannot chill discrimination claims) over Efficiency.
          *   If they allow the "Public Algorithm" variant: Commitment to **Proceduralism** (transparency cures surveillance).
          *   If they demand a Landlord Register too: Commitment to **Symmetry/Reciprocity**.

  7.  **Refining and Polishing:**
      *   *Tone:* Professional, analytical, legally nuanced, respectful of the user's sophisticated framing (German/American/Chinese angles).
      *   *Check:* Did I address the "Chinese-flavored" civic trust aspect? The register tries to make trust "scoreable." The commission seems skeptical of this (Case 6 blocked private scores).
      *   *Check:* Did I address the "German-flavored" linkage worry? Yes, in Rule A.
