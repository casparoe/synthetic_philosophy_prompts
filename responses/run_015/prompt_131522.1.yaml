      *   *Specific Detail:* Ensure the distinction between "official determinations" (eviction) and "behavioral traces" (sleep/mood) is analyzed in the Anti-Fusion section.
      *   *Specific Detail:* Ensure the "Discrimination Complainant" issue is highlighted as a critical flaw (Case 8 analog).

  8.  **Final Review against constraints:**
      *   Four distinct sections? Yes.
      *   Reconstruct rules including user's reciprocity idea? Yes.
      *   Predict divergence? Yes.
      *   Best guess verdict + analog? Yes.
      *   Minimal variant/separating case? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the "Power Asymmetry" rule. The user defined it as "disclosure duties track how much power a person exercises." In this case, the *tenant* is being disclosed. Do tenants exercise power? Not really, unless they are "serial nuisance." The commission might view "nuisance" as a form of negative power over neighbors. But the discrimination input undermines this. I need to make sure I don't conflate the Landlord's power (who gets the info) with the Tenant's power (who is scrutinized). The rule suggests the *subject* of the data should have power to justify the exposure. Tenants lack this.

      *(Refining the Reciprocity Rule)*: The user's rule is "ratio between what state can read about you and what you can read about the state." In this case, the Tenant can't read the scoring rule. The Landlord (private actor) gets the score. This complicates the State/Citizen reciprocity. I should frame it as "Institutional Transparency vs. Individual Opacity."

      *(Final Polish)*: Ensure the language matches the "law seminar" vibe—precise, slightly academic but practical.

