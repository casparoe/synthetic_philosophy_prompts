answer: |-
  ### Part 1: Final Examination Question

  **Course:** Political Philosophy 405: Justice and the Welfare State
  **Time Allowed:** 75 Minutes
  **Total Marks:** 30

  **Question:**

  Consider a proposed welfare regime designed to reconcile the demand for social protection with the demand for personal responsibility. This regime formally divides claimants into two distinct tracks based on the perceived cause of their non-participation in the labor market:

  1.  **The Capacity Track:** Claimants verified as "structurally excluded" due to demonstrable deficits in ability or opportunity (e.g., disability, lack of local jobs). These claimants are exempt from behavioral conditions.
  2.  **The Agency Track:** Claimants categorized as "agentively non-participating" due to perceived deficits in effort or choice. These claimants are subject to strict behavioral conditions (e.g., mandatory training, proof of job applications).

  Administrators argue this distinction allows the state to support the "deserving" without subsidizing the "undeserving." However, critics argue that distinguishing between structural barriers and voluntary choice is epistemically opaque.

  Write an essay evaluating whether this two-track system is conceptually coherent and administratively sustainable. In your analysis, you must address whether the system necessarily collapses into either:
  (i) An invasive moral audit of private life that violates norms of respectful treatment; or
  (ii) A *de facto* universal abandonment of conditionality once the costs of verification become prohibitive.

  Furthermore, your answer must analyze the implications of an **"epistemic burden reversal."** In this regime, the claimant bears the burden of proving their capacity deficit or compliance, rather than the state bearing the burden of proving fraud. Explain how this reversal alters not merely the administrative costs, but the moral framing of the claimant-state relationship.

  *Note: You are not required to cite specific theorists, statutes, or existing welfare programs. Your grade depends on the precision of your conceptual analysis and the strength of your argument regarding the tension between administrative feasibility and moral coherence.*

  ***

  ### Part 2: Model Answer (Examiner's Guide)

  **Thesis Statement:**
  A top-scoring response should argue that while the two-track system is conceptually distinct in theory (separating *can't* from *won't*), it is administratively unsustainable in practice. The attempt to sustain the distinction inevitably forces a collapse into either invasive surveillance (violating dignity) or systematic error (violating justice), exacerbated by the epistemic burden reversal which transforms the claimant from a rights-bearer into a suspect.

  **Argument Structure:**

  1.  **Deconstructing the Distinction (Conceptual Coherence):**
      *   The student should acknowledge that the distinction between "capacity" (structural) and "agency" (desert) is philosophically intuitive but empirically blurred.
      *   *Key Move:* Argue that structural barriers (e.g., lack of childcare, hidden disability, discrimination) often manifest as behavioral choices (e.g., missing interviews, refusing shifts). Therefore, the "cause" of non-participation is rarely observable without deep intrusion into the claimant's private life.

  2.  **The Information Asymmetry Problem:**
      *   The state cannot directly observe "will" or "effort," only outcomes and reported behaviors.
      *   Because claimants have private information about their barriers that the state lacks, the state must invest heavily in verification to prevent "Agency Track" claimants from mimicking "Capacity Track" claimants to avoid conditions.

  3.  **Analyzing Collapse Scenario (i): The Invasive Moral Audit:**
      *   To maintain the distinction, the state must verify the *reasons* for non-participation, not just the fact of it.
      *   *Normative Cost:* This requires probing into family dynamics, mental health, and daily routines. This violates norms of respectful treatment by treating poverty as a presumptive moral failure that must be exonerated through disclosure. It creates an expressive harm where the state signals distrust to all citizens.

  4.  **Analyzing Collapse Scenario (ii): De Facto Abandonment:**
      *   If the state refuses to invade privacy (to preserve dignity), verification becomes impossible.
      *   *Administrative Cost:* High error rates (false positives/negatives) make the system arbitrary. To avoid wrongful punishment, the state may default to placing everyone in the Capacity Track (abandoning conditionality) or, conversely, apply conditions universally because distinction is too costly. Both outcomes negate the original purpose of the two-track design.

  5.  **Integrating the Epistemic Burden Reversal:**
      *   The student must explain that shifting the burden of proof to the claimant changes the moral relationship.
      *   *Standard Liberal View:* The state must justify interference (burden on state).
      *   *Regime View:* The claimant must justify their status (burden on individual).
      *   *Conclusion on Burden:* This reversal constitutes a shift from a relationship of *right* (entitlement based on status) to a relationship of *privilege* (benefit contingent on proving worthiness). It epistemically positions the claimant as less credible than the state, undermining the civic equality required for a just welfare state.

  **Conclusion:**
  The system fails because the epistemic conditions required to distinguish capacity from agency are incompatible with the normative conditions required to treat citizens with respect. The epistemic burden reversal cements this inequality, making the regime unjust even if it were administratively feasible.

  ***

  ### Part 3: Marking Scheme

  | Analytical Point | Marks | Typical Student Error or Omission |
  | :--- | :---: | :--- |
  | **1. Conceptual Discrimination:** Clearly articulates the difference between "capacity-tracking" (structural barriers) and "desert-tracking" (agency/choice) and explains why these are difficult to distinguish empirically. | 6 | Treating capacity as purely physical (e.g., paralysis) while ignoring structural barriers (e.g., transport, discrimination) that look like choices. |
  | **2. Information Asymmetry:** Identifies that the state lacks access to the claimant's internal motivations and private constraints, creating a verification gap that drives administrative costs. | 6 | Assuming that better bureaucracy or technology can solve the information problem without normative costs. |
  | **3. Collapse Analysis (Invasion):** Evaluates the first collapse scenario, arguing that rigorous verification requires intrusive surveillance that violates norms of privacy and respectful treatment. | 6 | Focusing solely on financial costs of surveillance rather than the expressive harm or violation of civic dignity. |
  | **4. Collapse Analysis (Abandonment):** Evaluates the second collapse scenario, arguing that avoiding intrusion leads to high error rates, forcing the state to abandon the distinction to avoid arbitrary punishment. | 6 | Treating abandonment as a neutral policy option rather than a failure of the regime's core conceptual logic. |
  | **5. Epistemic Burden & Moral Status:** Analyzes the "epistemic burden reversal," explaining how shifting the burden of proof transforms the claimant from a rights-bearer to a suspect, altering the moral fabric of the state-citizen relationship. | 6 | Treating the burden of proof as a mere procedural technicality rather than a constitutive element of moral status and civic equality. |
  | **Total** | **30** | |
