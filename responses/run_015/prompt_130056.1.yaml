answer: |-
  This is the right question. Benchmarks measure performance on a static distribution; a theory of intelligence must explain *adaptation* across distributions. If a theory cannot explain why a corvid outperforms a transformer on physical intervention tasks despite having fewer parameters and less data, it is merely a theory of curve-fitting, not intelligence.

  Here is the spec for a non-trivial Theory of Intelligence, categorized by Phenomena, Distinctions, Constraints, and the Impossibility Results you asked for.

  ---

  ### 1. Phenomenological Requirements (What must be explained)
  A valid theory must provide a causal mechanism for these specific empirical observations. If it treats these as epiphenomena, it fails.

  *   **Systematic Generalization (The Fodor/Pylyshyn Constraint):** The ability to recombine known components into novel structures without retraining.
      *   *The Test:* If an agent understands "A causes B" and "C causes D," it must infer the structure of "A causes D" without gradient updates. LLMs often fail this; symbolic systems excel; hybrids struggle to bind.
  *   **Sample Efficiency Disparity:** The theory must explain the orders-of-magnitude difference in data required for concept acquisition (3 examples vs. millions).
      *   *The Mechanism:* It cannot just say "priors." It must specify *where the priors come from* (evolution, meta-learning, or structural invariants).
  *   **Interventional Robustness (The Crow Constraint):** Why a crow can solve a multi-step tool problem it's never seen.
      *   *Requirement:* The theory must distinguish between *observational* conditional probabilities ($P(Y|X)$) and *causal* interventions ($P(Y|do(X))$). Intelligence requires a model of counterfactuals, not just correlations.
  *   **Transfer of Abstraction:** The ability to ignore surface features and transfer strategy across domains (e.g., applying a "flanking maneuver" from a video game to a business negotiation).
      *   *Requirement:* The theory must define what an "abstraction" is computationally and how it is decoupled from sensory input.

  ### 2. Conceptual Distinctions (What must not be collapsed)
  A theory that conflates these terms is descriptively useless.

  *   **Intelligence vs. Optimization Power:**
      *   *Distinction:* Optimization is the *magnitude* of goal achievement (Legg & Hutter). Intelligence is the *efficiency* of the algorithm relative to resources and prior knowledge. A brute-force solver has high optimization power but low intelligence.
      *   *Constraint:* The theory must penalize compute/time complexity in its definition of intelligence.
  *   **Intelligence vs. Knowledge:**
      *   *Distinction:* Knowledge is state (weights/data); Intelligence is the update rule (algorithm).
      *   *Constraint:* A system that "knows" everything (Laplace's Demon) but cannot learn new things is not intelligent; it is a database. The theory must prioritize *learning rates* over *static accuracy*.
  *   **Competence vs. Performance:**
      *   *Distinction:* Borrowed from linguistics. Competence is the underlying capacity; Performance is the output given noise/fatigue/resource limits.
      *   *Constraint:* A theory must explain failures as resource bottlenecks, not lack of underlying structural understanding (unless the understanding is truly absent).
  *   **Goal Inference vs. Goal Content:**
      *   *Distinction:* Inverse RL infers the *function* being optimized. Intelligence includes the ability to *critique* or *modify* the goal itself (instrumental convergence vs. terminal values).

  ### 3. Hard Constraints vs. Tribal Preferences
  Here we separate physical/mathematical laws from ideological commitments.

  #### **Hard Constraints (Non-Negotiable)**
  1.  **No Free Lunch (NFL) Theorems:** A theory cannot posit a "domain-general" learner that performs well across all possible environments without inductive bias. If a theory claims universal generalization without priors, it is mathematically false.
  2.  **Computational Irreducibility:** The theory cannot assume the agent can predict the outcome of a complex system faster than simulating it, unless it possesses a specific compressed model of that system.
  3.  **Coherence:** The agent's beliefs and actions must not be Dutch-booking vulnerable (i.e., they must approximate Bayesian coherence or explain why deviations are computationally necessary).
  4.  **Biological Plausibility (Energy/Time):** If the theory claims to explain human intelligence, it cannot require updates that violate the energy budget of the brain (approx. 20W) or the speed of synaptic transmission.

  #### **Tribal Preferences (Negotiable/Contested)**
  1.  **Embodiment:** *Tribal.* Some argue intelligence requires a body (grounding). *Counter:* Disembodied agents can reason mathematically. *Verdict:* Embodiment is likely required for *physical* intelligence, but not necessarily for *abstract* intelligence. A theory should explain when embodiment is necessary, not mandate it always.
  2.  **Symbolic vs. Subsymbolic:** *Tribal.* The theory should not mandate neurons or logic gates specifically, but must explain how continuous signals yield discrete reasoning (the binding problem).
  3.  **Consciousness:** *Tribal.* Functional intelligence can likely be specified without qualia. Unless the theory claims consciousness is computationally functional (Orch-OR, etc.), this is outside the spec.

  ### 4. Resolving the Tension: Inverse RL vs. Concept Induction
  You noted the split between **Preference Inference** (Inverse RL: "What reward explains this behavior?") and **Concept Induction** (Bongard: "What rule explains these images?").

  **A unified theory must treat both as Hierarchical Bayesian Inference over different causal structures.**

  *   **The Unification:** Both are problems of inferring a latent variable $Z$ given data $D$.
      *   In Inverse RL, $Z$ is a Reward Function $R$, and $D$ is trajectories $\tau$.
      *   In Concept Induction, $Z$ is a Rule/Program $P$, and $D$ is examples $x$.
  *   **The Requirement:** The theory must explain the **Hypothesis Space Generator**. Where do the candidate rewards or candidate rules come from?
      *   If the hypothesis space is fixed, you get standard ML.
      *   If the hypothesis space is *learned* (meta-learning), you get human-like flexibility.
  *   **The Verdict:** A real theory must cover both. If it only covers concept induction, it can't explain agency. If it only covers preference inference, it can't explain abstraction. The bridge is **Probabilistic Programs**: representing both goals and concepts as composable code structures that can be inferred from sparse data.

  ### 5. The Impossibility Results (Jointly Unsatisfiable Requirements)
  This is the critical section. There are subsets of desiderata that cannot be simultaneously satisfied. A honest theory must explicitly state which one it is sacrificing.

  #### **The "Universal Efficient Learner" Paradox**
  You cannot have the following three simultaneously:
  1.  **Domain Generality:** Performance across arbitrarily different distributions.
  2.  **Sample Efficiency:** Learning from $N < 100$ examples.
  3.  **Tabula Rasa (No Innate Priors):** Starting without hard-coded domain knowledge.

  *   **Why:** By the No Free Lunch Theorem, sample efficiency on a specific class of problems *requires* bias toward that class. To be sample-efficient everywhere, you must have priors everywhere. If you have priors everywhere, you are not Tabula Rasa.
  *   **The Trade-off:** Human intelligence sacrifices **Domain Generality** (we can't learn to process radar data like a bat) to gain **Sample Efficiency** via heavy **Innate Priors** (evolutionary priors). A theory claiming humans are "general purpose" learners is contradicting biology.

  #### **The "Optimality vs. Tractability" Conflict**
  You cannot have the following three simultaneously:
  1.  **Bayesian Optimality:** Making decisions that maximize expected utility given uncertainty.
  2.  **Computational Tractability:** Solving problems in polynomial time.
  3.  **Rich Expressive Power:** The ability to represent complex, compositional world models.

  *   **Why:** Exact Bayesian inference is NP-hard for rich models.
  *   **The Trade-off:** Real intelligence (biological or artificial) must sacrifice **Optimality** for **Tractability**. We use heuristics (System 1) that are biased but fast. A theory that demands perfect rationality is a theory of God, not intelligence.

  #### **The "Stability vs. Plasticity" Dilemma**
  You cannot have the following three simultaneously:
  1.  **Stability:** Retaining old knowledge without catastrophic forgetting.
  2.  **Plasticity:** Learning new information rapidly from single exposures.
  3.  **Fixed Architecture:** Weights/structure that do not grow indefinitely.

  *   **Why:** To learn fast, you must change weights significantly. To retain old info, you must not change weights significantly.
  *   **The Trade-off:** Biological brains solve this via **consolidation** (sleep/replay) and **structural growth** (neurogenesis/synaptogenesis), effectively violating "Fixed Architecture" over long timescales. A theory using a static neural net architecture cannot explain lifelong learning without external memory buffers.

  ### Summary Specification
  For a Theory of Intelligence to be worth anything, it must:
  1.  **Formalize Inductive Bias:** Explicitly state what priors are required to achieve sample efficiency.
  2.  **Distinguish Algorithm from Data:** Separate the learning rule from the learned weights.
  3.  **Accept Bounded Rationality:** Acknowledge that intelligence is about *good enough* inference under compute constraints, not optimal inference.
  4.  **Resolve the Impossibility Triads:** Explicitly declare which of the conflicting triads above it is resolving (e.g., "We sacrifice Domain Generality for Sample Efficiency").

  If a theory claims to solve all of these without trade-offs, it is not a theory; it is a sales pitch.
