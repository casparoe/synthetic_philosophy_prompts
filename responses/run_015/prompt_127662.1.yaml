answer: |-
  **The philosophical frame**
  For David Lewis, modal realism posits that all possible worlds are concrete entities, equally real but spatio-temporally isolated. You cannot travel between them; you exist only in one. Consequently, Lewis rejects transworld identity. You do not exist in other worlds; instead, you have counterparts—distinct individuals in other worlds who resemble you closely enough to represent you in counterfactual statements. Crucially, Lewis treats actuality as indexical. When I say "actual," I mean "this world I inhabit," just as "here" refers to my location. There is no metaphysical privilege to my world, only an indexical one. This framework denies causal access between worlds. If Evelyn jumps verses, Lewis would argue she isn't traveling; she is accessing information about counterparts, or the film is depicting a single branching timeline rather than modal realism. The tension lies in whether EEAAO treats these worlds as isolated counterparts or as accessible parts of a single identity, challenging the isolation requirement central to Lewis's ontology.

  **The reading**
  Applying Lewis to EEAAO illuminates the mechanics of verse-jumping as accessing counterpart skills rather than becoming them. When Evelyn accesses kung fu skills, she isn't literally becoming the movie-star Evelyn; she is leveraging the similarity relation Lewis describes. She remains the original, drawing on the properties of counterparts. The hot-dog-fingers universe functions as an extreme counterpart case: similar enough to be recognizable, distinct enough to be absurd. Lewis's framework clarifies why Evelyn remains grounded; she is the indexical center, the "actual" Evelyn from whom all counterparts radiate. This preserves her identity without requiring transworld travel. The rock conversation complicates this significantly. When Evelyn and Waymond exist as silent stones, the film suggests a state of shared consciousness without action. For Lewis, rocks in other worlds are just rocks; there is no consciousness sharing across isolation. The film implies a metaphysical unity that violates Lewis's isolation clause. The Everything Bagel represents the collapse of distinction between worlds. If all possibilities are smashed into one point, modal realism fails because worlds must remain separate to be distinct worlds. The Bagel suggests nihilism because all outcomes are equally real and accessible, rendering choice meaningless. Lewis would argue choice matters because you are confined to one path. However, Lewis's indexical actuality helps explain the emotional stakes. Evelyn privileges her home universe not because it is metaphysically superior, but because it is *hers*—the indexical here. Her desire to save Joy depends on this specific world being the locus of her action, even if other Joys exist elsewhere. The philosophy highlights that Evelyn's power comes from comparing counterparts, but her motivation remains tied to her indexical home. The film uses the multiverse to show what could have been, but Lewis reminds us that what *is* matters because it is where we act. The tension between the Bagel's nihilism and Evelyn's hope mirrors the tension between viewing all worlds as equally real versus viewing one as the site of agency. In the climax, Evelyn doesn't save all Joys; she saves *this* Joy. Lewis's counterpart theory explains why she can understand other Joys without being responsible for them. She recognizes them as counterparts, distinct entities whose suffering informs her care for the indexical Joy standing before her. This distinction saves the narrative from incoherence; if she were literally all of them, saving one would save all, negating the conflict.

  **Where the film resists or cheats**
  The film ultimately cheats Lewis's ontology to serve its emotional arc. EEAAO requires causal access between worlds, which Lewis explicitly forbids. If worlds are spatio-temporally isolated, verse-jumping is impossible. The movie treats possible worlds as locations on a map rather than isolated concrete entities. This conflates epistemic access with ontological identity. Evelyn doesn't just learn about counterparts; she inhabits them. This suggests transworld identity, which Lewis rejects to avoid contradictions like being both a rock and a human. The film needs this contradiction to work; Evelyn must be everyone to understand everyone. Furthermore, the movie secretly treats Evelyn's home universe as metaphysically privileged, despite the multiverse setup. If all worlds are equally real, the Alpha-verse shouldn't have authority over the others. Yet, the narrative insists that saving *this* Joy matters more than saving the concept of Joy across the multiverse. Lewis would say this is just indexical preference, but the film treats it as an objective moral victory. The Bagel threatens to destroy everything, implying all worlds are connected enough to be destroyed together. This violates the isolation principle. If worlds are isolated, destroying one shouldn't affect others. The film needs a connected multiverse to raise the stakes, whereas Lewis's realism lowers stakes by isolating consequences. To make the family drama land, the film must imply a singular consciousness spanning worlds, effectively rejecting counterpart theory in favor of a mystical unity that Lewis's strict materialism cannot accommodate. The cheat is necessary: if Evelyn were truly just one counterpart among many, her choice to be kind in this universe would feel arbitrary against the backdrop of infinite others. The film demands that this universe matters *more*, not just *here*, requiring a metaphysical privilege Lewis denies.

  **What the work adds back**
  Despite the ontological cheating, the film adds something Lewis's formal apparatus misses: the phenomenological weight of possibility. Lewis treats counterparts as logical tools for truth conditions, but Evelyn experiences them as lived regrets and potentials. Her final choice isn't just indexical preference; it's an existential commitment. Lewis's system explains why she is here, but not why she chooses kindness here when cruelty exists elsewhere. The film suggests personal continuity is maintained not by strict identity, but by narrative coherence. Evelyn integrates her counterparts into a single moral agent. This isn't mere sentimentality; it proposes that identity is constituted by the choices made across possible selves, even if metaphysically distinct. Lewis's cold realism captures the structure of possibility, but EEAAO captures the burden of it. The work adds back the emotional cost of knowing what could have been. Evelyn's acceptance of her life isn't just accepting "this world"; it's accepting the aggregate of all lost chances. Lewis might call this confusion, but the film argues it's necessary for compassion. By feeling the lives of counterparts, Evelyn expands her moral circle beyond the indexical present. The film suggests that while worlds may be separate, meaning is not. It posits a special relation between counterparts that transcends resemblance, grounded in shared emotional truth rather than spatio-temporal isolation.
