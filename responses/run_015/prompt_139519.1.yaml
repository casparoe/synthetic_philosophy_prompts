          *   Wittgenstein acknowledges sharp boundaries exist (§8, §18). He doesn't say *all* concepts are blurred. He says *many* philosophical puzzles arise from assuming they *must* be sharp.
          *   Handbook definition: It's a rule. It can be followed correctly or incorrectly. It's a specific language-game.
          *   Cluster concept: Family resemblance applies.
