      *   *Resolution:* The impasse won't break by one side winning. It breaks by *pluralism* or *pragmatic separation*. We need to distinguish "biological dysfunction" from "medical condition requiring intervention."
      *   *Bedrock?* There is a bedrock element (is nature normative?), but the practical impasse is solvable by clarifying the *use* of the concept.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the stalemate. State the thesis: The disagreement is primarily a *pragmatic equivocation* regarding the *purpose* of the concept 'disease', masked as an ontological dispute. The intrinsic/relational distinction illuminates this but doesn't fully solve it without a shift in how we use the term.

      *   **Diagnosing the Disagreement (Ontological vs. Verbal vs. Pragmatic):**
          *   *Naturalists (Boorse):* Commit to Biostatistical Theory (BST). Function = species-typical contribution to survival/reproduction. Disease = sub-typical function. *Goal:* Scientific objectivity.
          *   *Normativists (Engelhardt, Fulford):* Commit to the idea that "harm" is essential. Function alone isn't enough (e.g., asymptomatic hypertension). *Goal:* Ethical justification for treatment.
          *   *Analysis:* It's not purely ontological (both agree biology exists). It's not purely verbal (stakes are high). It's *pragmatic*. They are optimizing for different goods (truth-tracking vs. action-guiding).

      *   **Engaging the Intrinsic/Relational Distinction:**
          *   *Intrinsic:* Naturalism fits here. A broken heart valve is broken regardless of environment.
          *   *Relational:* Normativism fits here. Sickle cell trait is a disease in one environment, an advantage in another (malaria zones). Myopia is a disease in a hunter-gatherer tribe, manageable in a city.
          *   *Does it resolve?* It *dissolves* the contradiction by showing they are describing different *layers*. However, it relocates the problem to *which layer matters for medicine*. If medicine is about fixing biology, Naturalism wins. If medicine is about alleviating suffering/disability, Normativism wins.

      *   **Concrete Commitments (Function, Harm, Normality):**
          *   *Function:* Naturalists see it as mechanistic. Normativists see it as teleological/goal-oriented relative to the agent.
          *   *Harm:* Naturalists try to derive harm from dysfunction (circular). Normativists say harm is prior.
          *   *Normality:* Naturalists use statistical normality. Normativists point out statistics don't equal value (being short is normal/statistical but not a disease; being gay was statistical minority and pathologized).

