answer: |-
  The decades-long stalemate between naturalism and normativism in the philosophy of medicine is not a failure of argumentation, but a symptom of a deeper **pragmatic equivocation**. The disagreement is not primarily ontological (about what exists), nor is it merely verbal (about the definition of a word). It is a **category clash regarding the purpose of the concept 'disease'**. Naturalists are attempting to construct a *theoretical kind* for biological science, while normativists are attempting to construct a *practical kind* for ethical and clinical decision-making. Because both sides insist that their specific purpose defines the *essential* nature of disease, they talk past one another.

  The intrinsic/relational distinction you highlight does not resolve the impasse, but it does **relocate** it productively. It reveals that naturalists and normativists are correctly identifying different necessary conditions for different stages of medical engagement. To diagnose the disagreement fully, we must examine how each side treats function, harm, and normality, and then determine whether a reframing can dissolve the standoff without requiring one side to surrender its core intuition.

  ### 1. The Diagnosis: Pragmatic Equivocation, Not Ontological Clash

  If this were a substantive ontological clash, one side would have to be factually wrong about the world. But both agree on the biology. Christopher Boorse (the arch-naturalist) and H. Tristram Engelhardt (the arch-normativist) agree that a cancerous tumor involves uncontrolled cell division. They disagree on whether that biological fact *alone* suffices to label it a "disease."

  *   **Naturalists** commit to the view that 'disease' must be value-free to preserve the scientific objectivity of medicine. For Boorse, health is "statistical normality of species-typical function." Here, **function** is mechanistic (how a part contributes to survival/reproduction), and **normality** is statistical. Harm is a *consequence* of dysfunction, not a definitional requirement.
  *   **Normativists** commit to the view that medicine is a moral enterprise. For Engelhardt or Bill Fulford, a condition cannot be a disease unless it is **harmful** or undesirable to the person. Here, **function** is teleological relative to the agent's goals, and **normality** is irrelevant without a valuation of that normal state.

  The stalemate persists because 'disease' is being asked to perform two incompatible jobs: (1) to track biological reality independently of human opinion (Naturalism), and (2) to justify social intervention and resource allocation (Normativism). When a naturalist says "asymptomatic hypertension is a disease," they are making a biological classification. When a normativist replies "but it harms no one until it causes a stroke," they are making a clinical judgment. They are not disagreeing about the blood pressure; they are disagreeing about whether the label 'disease' belongs to the *mechanism* or the *consequence*.

  ### 2. The Intrinsic/Relational Distinction: Resolution or Relocation?

  The distinction between pathology as an **intrinsic property** (organism-centered) versus a **relational property** (organism-environment-centered) is the most promising tool for diagnosing the standoff.

  *   **Naturalism captures the Intrinsic:** A valve that does not close is malfunctioning regardless of whether the organism is in a hospital or a forest. Naturalism succeeds here because it isolates the biological variable.
  *   **Normativism captures the Relational:** Sickle-cell trait is a "dysfunction" of hemoglobin intrinsically, but in a malaria-endemic environment, it is advantageous. Myopia is a refractive error intrinsically, but in a hunter-gatherer society, it is a death sentence; in a modern society, it is a minor inconvenience correctable with glass.

  **Does this resolve the problem?** No, it relocates it.
  Previously, the fight was: "Is disease objective or evaluative?"
  Now, the fight becomes: "**Which property grants access to medical care?**"

  If we accept the distinction, we admit that an organism can have an *intrinsic pathology* without having a *relational disease* (e.g., a genetic anomaly that confers no disadvantage in a specific environment). Conversely, one can have a *relational disease* without *intrinsic pathology* (e.g., severe grief or social disability, which some argue should be medicalized).

  The impasse relocates to the threshold of intervention. Naturalists fear that if we adopt the relational view, medicine becomes limitless (pathologizing all unhappiness). Normativists fear that if we adopt the intrinsic view, medicine becomes inhumane (treating statistical anomalies that cause no suffering). The intrinsic/relational distinction clarifies *what* they are disagreeing about, but it does not tell us which metric should govern the practice of medicine.

  ### 3. Concrete Commitments: Function, Harm, and Normality

  To see why the impasse is so resistant, we must look at the specific friction points where these commitments collide.

  *   **Function:** Naturalists define function evolutionarily (survival/reproduction). Normativists define it experientially (ability to pursue life plans).
      *   *Conflict:* Infertility is a naturalist disease (failure of reproductive function). For a normativist, if the individual does not desire children, it is not a "harm" and thus arguably not a disease requiring treatment. The naturalist sees a broken mechanism; the normativist sees a neutral variation relative to the agent's goals.
  *   **Harm:** Naturalists try to derive harm from dysfunction (dysfunction *leads* to harm). Normativists insist harm is a prerequisite.
      *   *Conflict:* This is where "Harmful Dysfunction" hybrids (like Jerome Wakefield's) often stall. Who defines the harm? If harm is subjective, the normativist wins but loses objectivity. If harm is objective (e.g., pain, death), the naturalist wins but excludes conditions like psychopathy (which may not feel harmful to the agent) or includes conditions like aging (which causes harm but is statistically normal).
  *   **Statistical Normality:** Naturalists rely on the bell curve. Normativists point out that "normal" is not "good."
      *   *Conflict:* Height is statistically distributed. Being very short is statistically abnormal. Is it a disease? Naturalists must say "only if it impairs function." Normativists say "only if society disadvantages you." The naturalist tries to keep society out of the definition; the normativist insists society is constitutive of the definition.

  ### 4. Breaking the Impasse

  What could actually move the needle?

  **1. Empirical Findings? (Unlikely)**
  Cross-cultural diagnostic agreement will not solve this. Even if every culture agreed that schizophrenia is a disease, the normativist would argue this reflects a universal human value judgment, not an objective biological fact. Conversely, disagreement (e.g., homosexuality's removal from the DSM) is claimed by normativists as proof of value-ladenness, while naturalists claim it was a correction of a previous biological error. Data cannot adjudicate meta-ethical commitments.

  **2. A Formal Distinction? (Promising)**
  The most viable path is **Conceptual Pluralism**. We must formally separate the terminology to match the distinct purposes.
  *   **Pathology:** Retain this for the Naturalist, intrinsic account. It describes biological dysfunction relative to species design. It is value-free.
  *   **Illness/Sickness:** Retain this for the Normativist, relational account. It describes the experience of harm and the social legitimacy of the "sick role."
  *   **Diagnosis:** The clinical act of mapping Pathology to Illness.

  This reframing separates *descriptive classification* from *prescriptive treatment*. We can acknowledge that a patient has a *pathology* (intrinsic dysfunction) without necessarily treating it as an *illness* (requiring intervention) if there is no relational harm. Conversely, we can acknowledge *illness* (suffering) without finding *pathology* (as in functional disorders), legitimizing care without demanding a biological lesion.

  **3. Bedrock Intuitions? (The Remaining Obstacle)**
  Ultimately, there is a bedrock disagreement resting on the **Is-Ought Gap**.
  *   Naturalists implicitly believe that nature has a "correct" way to be (teleology without a teleologist). They believe a heart *ought* to pump a certain way.
  *   Normativists implicitly believe that "oughts" only arise from conscious valuers. A heart is just meat; it is only "wrong" if the owner minds.

  If one holds that "nature can be wrong" (Naturalism) and the other holds that "only agents can be wronged" (Normativism), no amount of conceptual tweaking will fully reconcile them. This is a meta-ethical divide.

  ### Conclusion

  The long stall is not a failure of philosophy but a reflection of the dual nature of medicine itself: it is both a **biological science** and a **moral practice**. The naturalist is right that medicine needs objective anchors to avoid becoming purely political; the normativist is right that medicine needs ethical anchors to avoid becoming purely mechanistic.

  The intrinsic/relational distinction confirms that they are describing different layers of reality. The impasse breaks only if we stop asking "What is the *true* definition of disease?" and start asking "Which definition serves this specific context?"
  *   For **epidemiology and basic research**, use the Naturalist (intrinsic) definition to track biological mechanisms.
  *   For **clinical ethics and resource allocation**, use the Normativist (relational) definition to assess harm and need.

  We should conclude that the disagreement is bedrock *if* we insist on a monistic definition of disease. But if we accept that 'disease' is a **cluster concept** with different weights assigned to biology and value depending on the context, the standoff dissolves. Progress requires not a victory for one camp, but a truce that acknowledges medicine operates simultaneously in the realm of biological facts and human values.
