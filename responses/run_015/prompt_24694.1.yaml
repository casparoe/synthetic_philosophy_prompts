prompt: |-
  I've been going back and forth on this for about a week and I'd like you to build me a case, to order, that finally lays it out cleanly. I'm prepping a problem set for my political philosophy seminar, and the tension I keep hitting is between the Condorcet jury theorem and the paradox of voting, and nobody I talk to seem to have a clean version of it. So here's the spec. I want a realistic referendum—something an actual community would put to a vote, not a trolley and not a lottery—and a set of numbers such that three things hold at the same time. First, the Condorcet side: at the turnout we'd normally expect, the majority is very likely to pick the correct option, so voter competence is just above half and the votes are independent. Second, the paradox-of-voting side: for any single voter, the expected value of showing up is negative, because the chance of casting the decisive vote is tiny and the cost of voting beats it. Third, the kicker that I actually care about: if every voter reasoned their way to "don't bother" and stayed home, turnout would crater so low that the accuracy gain we just celebrated on the Condorcet side basically evaporates, so the individually rational move is collectively self-defeating.

  Give me the scenario in a paragraph, then walk through the three calculations with real numbers, and be honest about the pivotal-probability figure—estimate it the standard way, order of magnitude is fine, but don't just wave your hands and assert it. After that, tell me which single feature of the case is doing the work, what happens if I remove it, and close with how a defender of "just vote, it's obviously collectively rational" would push back and where that pushback is weakest. I want something I can actually hand to students, so if any of the three conditions can't be met at once without one of them doing all the lifting, flag that instead of fudging it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a teaching case for a political philosophy seminar.
      *   **Core Tension:** Condorcet Jury Theorem (CJT) vs. Paradox of Voting (Downsian).
      *   **Requirements:**
          1.  Realistic referendum scenario (no trolley problems/lotteries).
          2.  Three conditions must hold simultaneously:
              *   CJT: At expected turnout, majority likely picks the "correct" option (competence $p > 0.5$, independent votes).
              *   Paradox: For an individual, Expected Utility (EU) of voting < Cost (rationally abstain).
              *   Collective Failure: If everyone abstains, turnout drops, CJT benefits vanish (accuracy collapses).
          3.  Structure: Scenario paragraph -> Three calculations (with real numbers, honest pivotal probability) -> Analysis of the key feature -> Counterfactual (remove feature) -> Defender's pushback & weakness.
          4.  Tone: Clean, honest, suitable for students (no fudging).

  2.  **Deconstruct the Mathematical Tension:**
      *   *Condorcet Jury Theorem:* Requires large $N$ (number of voters) and $p > 0.5$. As $N \to \infty$, Probability(Correct) $\to 1$.
      *   *Paradox of Voting:* $R = P \times B - C$. $P$ = probability of being pivotal. $B$ = benefit of preferred outcome. $C$ = cost of voting. Rational choice is to vote if $R > 0$. Usually, $P$ is so small that $P \times B < C$.
      *   *The Conflict:* CJT needs a large $N$ to work well. The Paradox gets *worse* as $N$ gets larger (because $P$ shrinks).
      *   *The "Kicker":* If everyone follows the Paradox logic ($R < 0$), $N$ drops. If $N$ drops too low, CJT no longer guarantees accuracy.
      *   *The Challenge:* I need an $N$ large enough for CJT to look impressive (say, 95% accuracy) but small enough (or $B/C$ ratio such) that $P \times B < C$. Wait, actually, usually $N$ needs to be *very* large for CJT to be near 1, which makes $P$ vanishingly small. This makes the Paradox very strong. The trick is ensuring that the *reduced* $N$ (if everyone stays home) is small enough to break CJT.
      *   *Constraint Check:* The prompt asks for "turnout we'd normally expect" for CJT, and "if every voter reasoned... and stayed home, turnout would crater." This implies a distinction between *eligible voters* ($N_{total}$) and *expected voters* ($N_{expected}$).
      *   *Refinement:* Let $N_{total}$ be the electorate. Let expected turnout rate be $t$. So $n = t \times N_{total}$ is the voting population for CJT.
      *   *CJT Condition:* $n$ must be large enough that with $p > 0.5$, Accuracy is high.
      *   *Paradox Condition:* For an individual in $N_{total}$, $P(\text{pivotal}) \times B < C$. Note: $P$ depends on $n$ (expected voters), not $N_{total}$.
      *   *Collapse Condition:* If everyone abstains, $n \to 0$ (or very small). Accuracy $\to 0.5$ (coin flip).

      *Wait, there's a logical snag.* If everyone reasons "don't bother," turnout doesn't go to zero instantly in a one-shot game, it goes to a Nash Equilibrium. But the prompt asks for the *reasoning* leading to staying home. I need to show that the *individual calculation* says "stay home," but the *collective result* of that reasoning is bad.
      *Crucial Math Check:* The probability of being pivotal ($P$) in a binomial election with $n$ voters is roughly $\frac{1}{\sqrt{n}}$.
      If $n$ is large (for CJT), $P$ is tiny.
      If $P$ is tiny, $P \times B$ is likely $< C$.
      So, large $n$ satisfies CJT and Paradox simultaneously easily.
      The third condition is the "Collapse." If $n$ drops, CJT fails.
      So the case holds together. The tension is real.

      *Numbers:*
      *   Electorate ($N_{total}$): 10,000 (Small town referendum, manageable numbers).
      *   Expected Turnout ($t$): 60% -> $n = 6,000$.
      *   Competence ($p$): 0.55 (Slightly better than chance).
      *   CJT Accuracy with $n=6000, p=0.55$: Very high. (Need to verify).
      *   Benefit ($B$): \$1,000 (per voter value of correct policy).
      *   Cost ($C$): \$50 (time, travel, opportunity cost).
      *   Pivotal Probability ($P$): Need to calculate for $n=6,000$.
      *   Condition: $P \times 1000 < 50$. So $P < 0.05$.
      *   Is $P$ for $n=6,000$ less than 0.05? Yes, it's way smaller. $P \approx \sqrt{\frac{2}{\pi n}}$. For 6000, $P \approx \sqrt{\frac{2}{18849}} \approx \sqrt{0.0001} \approx 0.01$. Actually, let's use the normal approximation. $\sigma = \sqrt{np(1-p)}$. $P(\text{tie}) \approx \frac{1}{\sqrt{2\pi np(1-p)}}$.
      *   $np(1-p) = 6000 \times 0.55 \times 0.45 = 1485$. $\sqrt{1485} \approx 38.5$.
      *   $P(\text{pivotal}) \approx \frac{1}{\sqrt{2\pi} \times 38.5} \approx \frac{1}{2.5 \times 38.5} \approx \frac{1}{96} \approx 0.01$.
      *   $0.01 \times 1000 = 10$. Cost is 50. $10 < 50$. Rational to abstain.
      *   CJT Accuracy: Mean = $6000 \times 0.55 = 3300$. Threshold = 3000. SD = 38.5. Z = $(3000 - 3300) / 38.5 = -300 / 38.5 \approx -7.8$. Probability of error is essentially 0. Accuracy $\approx 100\%$.
      *   Collapse: If turnout drops to, say, 10 voters. $n=10$. $p=0.55$. Accuracy? Binomial sum. It drops significantly (maybe to 60-70%). If turnout drops to 1, accuracy is 55%.
      *   This works.

  3.  **Drafting the Scenario:**
      *   Needs to be a "realistic referendum."
      *   Idea: A small municipality deciding on a costly infrastructure project with a clear "right" answer based on expert consensus, but voters have imperfect information.
      *   Town: "Oakhaven."
      *   Issue: Replacing a bridge. Engineers say "Replace Now" (Correct) vs "Repair" (Incorrect/Costly long term).
      *   Why $p > 0.5$? Voters read local news, trust experts slightly more than not.

  4.  **Drafting the Calculations:**
      *   *Step 1 (CJT):* Define $n$, $p$. Show probability of correct majority. Use Normal approximation for clarity but acknowledge the binomial reality.
      *   *Step 2 (Paradox):* Define $B$, $C$. Calculate $P(\text{pivotal})$. Show $PB - C < 0$. Be explicit about the formula for $P$.
      *   *Step 3 (Collapse):* Show what happens if $n$ shrinks (e.g., to 50 or 10). Show accuracy drops.

  5.  **Identifying the "Single Feature":**
      *   What makes this work? It's the **non-linearity of the pivotal probability vs. the linearity of the collective benefit**. Or, more simply, it's the **scale ($N$)**.
      *   Actually, the prompt asks: "which single feature of the case is doing the work."
      *   It's the **magnitude of the electorate relative to the individual cost**. The fact that $N$ is large enough to make $P$ negligible but small enough that a drop in $N$ matters for accuracy.
      *   Better answer: It's the **public good nature of the outcome combined with the private cost of participation**. The benefit $B$ is enjoyed by all, but cost $C$ is borne by one.
      *   Wait, the prompt asks about the tension between CJT and Paradox. The feature doing the work is the **size of the voting pool ($n$)**. Large $n$ makes CJT strong but Paradox strong (abstain). Small $n$ makes Paradox weak (vote) but CJT weak (accuracy).
      *   Let's refine: The feature is the **dilution of individual causal power**.

  6.  **Counterfactual (Remove the Feature):**
      *   If we remove the "large $N$" (make it a committee of 5), Paradox disappears (P is high), but CJT is weak (accuracy low).
      *   If we remove the "private cost" (make voting mandatory or costless), Paradox disappears.
      *   The prompt asks: "what happens if I remove it." If I remove the *dilution* (small group), the paradox vanishes (voting becomes rational), but you lose the CJT "miracle" (accuracy isn't near 1).

  7.  **Defender's Pushback:**
      *   Who defends voting? Civic republicans, expressivists, rule-utilitarians.
      *   Pushback: "You shouldn't use act-utilitarian calculus. Follow the rule 'Vote'."
      *   Weakness: It relies on a deontological leap or assumes others will follow the rule (which they won't if they are rational egoists). It doesn't solve the *logical* tension, it bypasses it.

  8.  **Review against Constraints:**
      *   *Realistic referendum?* Yes, town bridge.
      *   *Three conditions hold?* Yes (High accuracy at expected turnout, Negative EU for individual, Low accuracy at low turnout).
      *   *Honest pivotal probability?* Use the Goodman/Chamberlain approximation or Normal approx. $\frac{1}{\sqrt{2\pi n p (1-p)}}$.
      *   *Flag if fudging?* The math holds up. $n=6000$ is the sweet spot.
      *   *Structure:* Scenario -> 3 Calcs -> Feature -> Remove Feature -> Pushback.

  9.  **Refining the Numbers:**
      *   Let's ensure the CJT accuracy isn't *too* perfect (like 99.999%) so it feels real, but high enough to make the point. $p=0.55$ and $n=6000$ gives near 100%. Maybe lower $p$ to 0.51?
      *   If $p=0.51$, $n=6000$. Mean = 3060. Threshold = 3000. SD = $\sqrt{6000 \times 0.51 \times 0.49} \approx \sqrt{1500} \approx 38.7$. Z = $(3000-3060)/38.7 = -1.55$. Accuracy $\approx 94\%$. This looks more "human" and less "mathematical certainty."
      *   Let's check Paradox with $n=6000, p=0.51$.
      *   $P(\text{pivotal}) \approx \frac{1}{\sqrt{2\pi} \times 38.7} \approx \frac{1}{97} \approx 0.01$.
      *   $B = 1000, C = 50$. $PB = 10$. $10 < 50$. Still holds.
      *   Collapse: If $n=50$. $p=0.51$. Mean = 25.5. Threshold = 25. SD = $\sqrt{50 \times 0.51 \times 0.49} \approx 3.5$. Z = $(25-25.5)/3.5 = -0.14$. Accuracy $\approx 55\%$.
      *   This is perfect. It shows the drop from 94% to 55%.

  10. **Final Polish:**
      *   Ensure the tone is academic but accessible.
      *   Make sure the "Pivotal Probability" calculation is explicit about the approximation used (Normal approx to Binomial).
      *   Check the "Feature" analysis. The feature is the **scale of the electorate**.
      *   Check the "Pushback." Focus on Rule Utilitarianism or Expressive Voting. Weakness: Doesn't solve the free-rider problem logically.

  11. **Self-Correction on "Independence":**
      *   CJT requires independent votes. In reality, votes are correlated (media, peers). I should acknowledge this assumption in the setup so students know it's a model constraint, not a claim about reality. I will state "assuming voters form judgments independently based on shared evidence."

  12. **Final check on "Turnout Crater":**
      *   The prompt says: "if every voter reasoned their way to 'don't bother' and stayed home, turnout would crater."
      *   In a Nash Equilibrium of the voting game, turnout doesn't go to zero (mixed strategy equilibrium). But the prompt asks for the *reasoning* outcome ("if every voter reasoned..."). This is the classic Kantian/Rule-Utilitarian framing. I will frame it as "If this reasoning were universalized."

  13. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### The Scenario: The Oakhaven Bridge Referendum

  The town of Oakhaven (population 10,000 eligible voters) is holding a referendum on whether to approve a \$20 million bond to replace an aging bridge. Structural engineers have issued a consensus report: replacing the bridge is the objectively correct decision to prevent a catastrophic failure within five years, whereas "repairing" it is a false economy that will cost more in the long run. However, the report is technical, and voters must interpret it themselves. Based on local polling, we estimate that any given voter has a 51% chance ($p = 0.51$) of correctly interpreting the data and voting "Replace," while 49% will be misled by opposition rhetoric and vote "Repair." Voters form these judgments independently (no herd behavior). Historically, turnout in Oakhaven is 60% ($n = 6,000$). The personal value of the correct outcome to each citizen (avoiding future tax hikes and disaster) is estimated at \$1,000 ($B$). The cost of voting (time, travel, childcare) is \$50 ($C$).

  ***

  ### The Three Calculations

  **1. The Condorcet Condition (Collective Competence)**
  We first calculate the probability that the majority vote yields the correct outcome at expected turnout ($n = 6,000$).
  Using the Normal approximation to the Binomial distribution:
  *   Expected "Correct" Votes ($\mu$) = $n \times p = 6,000 \times 0.51 = 3,060$.
  *   Standard Deviation ($\sigma$) = $\sqrt{n \times p \times (1-p)} = \sqrt{6,000 \times 0.51 \times 0.49} \approx 38.7$.
  *   Votes needed for Majority = 3,001.
  *   Z-score = $\frac{3,001 - 3,060}{38.7} \approx -1.52$.

  Looking up the Z-score, the area to the right (probability of majority correctness) is **0.9357 (93.6%)**.
  *Result:* At normal turnout, the electorate is highly reliable. The "wisdom of crowds" works.

  **2. The Paradox Condition (Individual Rationality)**
  Now we calculate the Expected Utility ($EU$) for a single voter deciding whether to cast a ballot.
  $EU = (P_{\text{pivotal}} \times B) - C$
  *   $B$ (Benefit) = \$1,000.
  *   $C$ (Cost) = \$50.
  *   $P_{\text{pivotal}}$: The probability that the vote is tied among the *other* $n-1$ voters. Using the standard approximation for a close election ($p \approx 0.5$):
      $$P_{\text{pivotal}} \approx \frac{1}{\sqrt{2\pi n p (1-p)}} = \frac{1}{\sqrt{2\pi} \times 38.7} \approx \frac{1}{97} \approx 0.0103$$
      *(Note: This is roughly a 1 in 100 chance, which is incredibly generous for an election of this size, but we use it to be charitable to the voting argument.)*

  *   Expected Benefit = $0.0103 \times \$1,000 = \$10.30$.
  *   Net Utility = $\$10.30 - \$50.00 = \mathbf{-\$39.70}$.

  *Result:* It is individually irrational to vote. The cost outweighs the expected impact.

  **3. The Collapse Condition (Universalization)**
  Finally, we assess what happens if every voter follows the logic in Calculation #2 and abstains.
  If turnout crashes from 6,000 to, say, 50 voters (only the deeply committed):
  *   New $\mu = 50 \times 0.51 = 25.5$.
  *   New $\sigma = \sqrt{50 \times 0.51 \times 0.49} \approx 3.5$.
  *   Votes needed = 26.
  *   New Z-score = $\frac{26 - 25.5}{3.5} \approx 0.14$.
  *   New Accuracy = **0.444 (44.4%)**.

  *Result:* If everyone acts rationally, the collective accuracy drops from **93.6%** to below a coin flip (**44.4%**). The individually rational move destroys the collective competence.

  ***

  ### Analysis for Seminar Discussion

  **The Feature Doing the Work**
  The single feature driving this tension is **the scale of the electorate ($n$) relative to the linearity of individual causal power.**
  Condorcet relies on $n$ being *large* to aggregate noise into signal (Law of Large Numbers). The Paradox relies on $n$ being *large* to dilute individual causal power to near-zero. The tension exists because the mechanism that guarantees collective wisdom (large $n$) is the exact same mechanism that guarantees individual futility ($P_{\text{pivotal}} \to 0$).

  **What Happens If You Remove It?**
  If you remove the **scale** (e.g., reduce the electorate to a committee of 15):
  1.  **Paradox Dissolves:** $P_{\text{pivotal}}$ jumps to ~0.20. Expected benefit becomes \$200. Voting is now individually rational ($200 > 50$).
  2.  **Condorcet Weakens:** With $n=15$ and $p=0.51$, collective accuracy drops to ~56%.
  You solve the motivation problem, but you lose the epistemic benefit. You cannot have high epistemic reliability *and* high individual causal efficacy simultaneously in this model.

  **The Defender's Pushback (and its Weakness)**
  A defender of voting (e.g., a Rule Utilitarian or Civic Republican) would argue: *"You are using Act Utilitarian calculus incorrectly. You must ask: 'What if everyone did that?' Since the universalized outcome is catastrophic, the rule 'Vote' is obligatory regardless of $P_{\text{pivotal}}$."*

  **Where the Pushback is Weakest:**
  This defense fails against the **free-rider incentive**. Even if I accept that "Everyone Voting" is the ideal state, my individual contribution to that state is negligible. If I know 5,999 others are voting (perhaps out of duty), my abstention will not crash the turnout to 50; it will lower it to 5,999, leaving Condorcet accuracy effectively unchanged (93.59% vs 93.57%). Therefore, even under Rule Utilitarianism, I can "free ride" on the duty of others without triggering the collapse. The logical link between *my* abstention and *the* collapse is broken unless I assume my decision causally determines everyone else's (magical thinking), which is a hard pill to swallow in a political philosophy seminar.

  **Instructor Note:**
  This case is mathematically consistent. The only "fudge" is the independence assumption in Condorcet (real voters correlate), but that is standard for the theorem. The tension is genuine: you cannot maximize both epistemic reliability and individual rationality in large-number elections without introducing external incentives (fines, social pressure) or changing the decision rule.
