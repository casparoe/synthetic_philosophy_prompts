prompt: |-
  I'm recording an episode of my little philosophy podcast next week, and my guest is a philosopher — call her Dr. Mara Ilves — whose whole shtick is that the backward induction argument in the centipede game isn't just counterintuitive but invalid: she says it needs an extra premise about what a rational player *would* do at nodes the argument's own premises guarantee are never reached, and that once you see that, 'rationality' stops being node-relative and becomes a property of the plan you commit to ex ante. Give me 6-8 interview questions that really engage with that, each with a follow-up keyed to the reply she's most likely to give.

  - One on exactly which extra premise she thinks the argument needs (some kind of 'rationality is preserved off the path of play' condition), followed up by: if rationality is a property of the agent and not the node, why think it *isn't* preserved — is her claim that there's just no fact of the matter about what an ideally rational agent would do at a node she'll certainly never face?
  - One on the standard tremble reply — put a small probability on the other player being irrational, altruistic, or just fumbling, and passing becomes optimal for a long stretch. She'll probably say that for any fixed game length you can shrink the probability until the cooperation unravels again, so the reply never reaches the pure case; I want the follow-up that asks whether the pure case is even the interesting one, ideally using the variant where the chance of random termination is announced up front instead of smuggled in.
  - One built on a variant I want to spring on her: the 'script centipede', where both players submit a complete contingent strategy before play begins, and then one of them is secretly offered a one-time chance to tear up the script mid-game for 1% of the pot. Does her plan-first story predict the same behaviour here as in the ordinary game, and what would she say if it didn't?
  - One on a 'blind' centipede, where you can see how big the pot is but not whether your opponent has already passed. If the paradox really turns on knowing you're at a node that's unreachable given common knowledge of rationality, hiding that should matter, and I want to know whether her account says what it should.
  - One on the solo version: a single player facing the same payoff tree, choosing at every node herself, no opponent, no commitment device. If the unraveling still feels compelling there, what's left of her line that this is about plans and commitment rather than about strategic reasoning?
  - One to corner her at the end: grant her everything, so backward induction yields no verdict about the actual first move — then what should the first player *do*? Is the game simply unsolved on her view, or does ex ante planning give a determinate answer like 'pass for a while, then take', and if so how is that plan not open to the same off-path objection she used against backward induction?

  Keep them conversational, like something I'd actually say out loud, and no 'what drew you to this topic' filler.
