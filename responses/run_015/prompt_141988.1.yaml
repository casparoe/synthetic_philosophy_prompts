answer: |-
  1. **The Logical Gap**
  Let's start under the hood of the argument itself. You claim backward induction isn't just counterintuitive but logically invalid because it smuggles in an extra premise about what a rational player *would* do at nodes the argument's own premises guarantee are never reached. Can you state that premise explicitly? What exactly is the backward induction argument assuming that it isn't entitled to?

  *Follow-up:* If rationality is a property of the agent and not the node, why think it *isn't* preserved? Is your claim that there's just no fact of the matter about what an ideally rational agent would do at a node she'll certainly never face?

  2. **The Trembling Hand**
  The standard game-theoretic reply here is the "trembling hand"—put a small probability on the other player being irrational, altruistic, or just fumbling, and passing becomes optimal for a long stretch. You've argued this doesn't save the standard view. Why not?

  *Follow-up:* You'll likely say that for any fixed game length you can shrink the probability until the cooperation unravels again, so the reply never reaches the pure case. But is the pure case even the interesting one? What if we use a variant where the chance of random termination is announced up front instead of smuggled in via trembles—does that change the rational calculus?

  3. **The Script Variant**
  I want to spring a variant on you: the "script centipede." Both players submit a complete contingent strategy before play begins, and then one of them is secretly offered a one-time chance to tear up the script mid-game for 1% of the pot. Does your plan-first story predict the same behaviour here as in the ordinary game?

  *Follow-up:* What would you say if it didn't? If the ability to commit changes the outcome, does that mean rationality depends on the availability of commitment devices, or just on how we model the agent?

  4. **The Blind Centipede**
  Consider a "blind" centipede, where you can see how big the pot is but not whether your opponent has already passed. If the paradox really turns on knowing you're at a node that's unreachable given common knowledge of rationality, hiding that should matter. Does your account say what it should about this case?

  *Follow-up:* If hiding the history changes what's rational, doesn't that suggest rationality is sensitive to information sets in a way that undermines your claim that it's purely about the ex ante plan?

  5. **The Solo Player**
  Let's strip away the opponent. A single player faces the same payoff tree, choosing at every node herself, no opponent, no commitment device. If the unraveling still feels compelling there, what's left of your line that this is about plans and commitment rather than about strategic reasoning?

  *Follow-up:* Is the solo case just a different game, or does it show that backward induction has a grip on practical reasoning that isn't purely strategic—and if so, doesn't that grip survive your critique?

  6. **Common Knowledge**
  Backward induction usually relies heavily on Common Knowledge of Rationality. Does your view require us to abandon common knowledge, or just reinterpret what it means to be rational?

  *Follow-up:* If we keep common knowledge but change the definition of rationality, haven't we just changed the subject rather than solving the paradox? How do you ensure you're still talking about the same game?

  7. **The Positive View**
  Okay, I want to corner you at the end. Grant you everything, so backward induction yields no verdict about the actual first move—then what should the first player *do*? Is the game simply unsolved on your view, or does ex ante planning give a determinate answer like "pass for a while, then take"?

  *Follow-up:* If it gives a determinate plan, how is that plan not open to the same off-path objection you used against backward induction? Why doesn't the logic unravel your solution the same way it unravels the standard one?

  8. **Dynamic Consistency**
  Here's the final worry. If I commit ex ante to passing, but then I actually reach node five, am I rationally required to stick to the plan?

  *Follow-up:* If yes, aren't you just imposing a binding constraint that standard rationality doesn't recognize? If no, isn't the plan cheap talk, and doesn't that bring us right back to the node-relative reasoning you're trying to escape?
