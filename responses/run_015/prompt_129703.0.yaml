  Hold this old stone, it feels quite round,
  A solid weight that rests upon the ground.
  Look at the edge where jagged crystal grows,
  It is not round, as any walker knows.
  Round in the hand, but jagged to the eye,
  Both smooth and sharp beneath the same grey sky.
  Try to speak the shape without the touch,
  The words break down, they ask for far too much.
  It is a stone, I feel the weight remain,
  But what it holds I cannot quite explain.
  It is not moving, though the water runs,
  Why it stays still no single word outruns.
  It is, is not, and words begin to fade,
  I put it back into the streambed shade.
