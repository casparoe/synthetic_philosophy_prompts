answer: |-
  ### Teaching Sequence & Carrying Case

  **Dependency Chain:**
  1.  **Categories constitute evidence:** Students must accept that what counts as a "fact" depends on the questions/categories we bring (Conceptual).
  2.  **Judgment depends on categories:** Moral evaluation is impossible without first categorizing the act/actor (Moral relies on Conceptual).
  3.  **Inevitability:** We cannot shed categories, only make them reflexive (Avoidance is impossible; awareness is the goal).

  **Carrying Case: Diagnosing "PTSD" in WWI Soldiers**
  *Use this single case throughout to anchor both forms of presentism.*

  *   **Moral Presentism Component:** Condemning British officers for executing soldiers for "cowardice" based on the modern moral imperative that mental health excuses combat failure.
  *   **Conceptual Presentism Component:** Imposing the diagnostic category "PTSD" (codified 1980) onto the historical category "Shell Shock" (1915) or "Nostalgia" (18th C).
  *   **Evidentiary Instinct Component:** Reading a soldier's letter describing "trembling hands" as *evidence of trauma* (modern category) rather than *evidence of cold/fatigue* (period category), thereby changing the factual record based on the diagnostic lens.

  **Why the "Slaveholders Were Bad" Example Fails**
  It triggers immediate moral closure. Once students condemn slavery, inquiry stops. It fails to force **conceptual work** because students assume "slave" and "owner" meant the same thing in 1850 as "criminal" and "victim" do today. It doesn't challenge them to ask how "property," "personhood," or "economic value" were categorically constructed differently then. It isolates moral judgment from conceptual analysis, reinforcing the idea that presentism is just about "being nice" rather than "being accurate."

  ---

  ### Misconception Map & Blocking Strategy

  **1. Misconception: "Presentism is just being mean/judgmental."**
  *   **Formation:** Occurs immediately if you start with moral examples (e.g., Jefferson owning slaves).
  *   **Block Point:** **Minute 15.** Immediately after defining Moral Presentism, pivot to the WWI case. Ask: *"If we diagnose PTSD, are we being moral or medical?"* Show that even a "compassionate" diagnosis is conceptually presentist if the category didn't exist.
  *   **Action:** Explicitly label this **Conceptual Presentism**. Draw a line on the board: Moral (Judgment) vs. Conceptual (Categories).

  **2. Misconception: "If categories are historical, we can't compare anything."**
  *   **Formation:** Occurs at **Minute 45** when you argue that "PTSD" didn't exist in 1916. Students will think this leads to relativism or silence.
  *   **Block Point:** **Minute 50.** Introduce the distinction between *Actor's Categories* (emic) and *Analyst's Categories* (etic).
  *   **Action:** Clarify that we *must* use modern categories to communicate, but we must flag the distortion. The goal is not to stop using "PTSD," but to ask: *"What does using this word hide about how they understood suffering?"*

  **3. Misconception: "All presentism is avoidable if you're careful enough."**
  *   **Formation:** Occurs at **Minute 70** as a defense mechanism. They want a method to "clean" the history.
  *   **Block Point:** **Minute 75.** Admit inevitability.
  *   **Action:** Shift the goal from *elimination* to *reflexivity*. "You cannot think without categories. The skill is noticing which categories are doing the work."

  ---

  ### The Check (Minute 85)

  **Task:** Do not ask "What is presentism?" or "Why does context matter?"
  **Prompt:** Give them a modern category (e.g., "Terrorism") and a past event (e.g., "The Gunpowder Plot, 1605"). Ask them to identify **one specific piece of evidence** (e.g., a confession, a manifesto, a weapon purchase) that would be **misclassified** if they treat "Terrorism" as a transhistorical fact rather than a modern legal/political category.

  **Success Criteria:** They must identify that the *meaning* of the evidence changes, not just the judgment.
  *   *Fail:* "We shouldn't call them terrorists because it's rude." (Moral only)
  *   *Pass:* "If we call it terrorism, we read the confession as a political statement. If we call it treason, we read it as a crime against the King's body. The evidence is the same, the fact changes." (Conceptual grasp)

  ---

  ### The Exclusion

  **Topic:** **The Constructivist Archive.**
  **What to leave out:** Do not introduce the argument that the *survival* of the sources themselves is a presentist act (i.e., that the archive is already filtered by power structures before the historian arrives).
  **Why:** This conflates *epistemological presentism* (how we know) with *ontological constructivism* (what exists). For second years, this leads to nihilism ("we can't know anything because the archive is biased").
  **Admission:** Explicitly tell them: *"Today we are talking about the categories you bring to the sources. We are NOT talking about how the sources were selected for survival. That's a different problem for a different seminar."* This boundaries the anxiety while maintaining intellectual honesty.
