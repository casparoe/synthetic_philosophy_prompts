      *   **Audience:** ~25 people.
          *   Majority: Control theorists, formal methods (interruptible real-time systems, watchdogs, shields). Skeptical of AI safety hype.
          *   Minority: 3 RL Theory folks (skeptical of utility functions/alignment).
          *   Wildcard: 1 Philosopher of Action (instrumental rationality).
      *   **Topic:** Corrigibility (Switch, Edit, Successor). Critique of utility indifference. Proposal: Intervention-Invariance of the Update Rule (learning dynamics property).
      *   **Constraint:** High stakes (graded), interrupt-heavy Q&A, specific jargon constraints (don't assume corrigibility vocab), specific skepticism (AI safety = hype, RLHF friend thinks it's solved).
      *   **Goal:** Prep sheet with ~8 objections (ordered by damage), phrased in audience jargon, ~90-second replies, concession points, "killer" objection analysis, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis:**
      *   *Claim 1:* Corrigibility has 3 grades (Switch, Edit, Successor). Lit over-invests in Switch.
      *   *Claim 2:* Utility Indifference (Soares et al.) is insufficient (gets won't-resist, not won't-arrange; allows self-shutdown/manipulation).
      *   *Claim 3 (Positive):* Corrigibility is a property of *learning dynamics* (Update Rule), not policy/utility.
      *   *Definition:* Update rule is corrigible if exposure to interventions produces $\le d$ gradient pressure toward controlling the intervention channel.
      *   *Advantage:* No utility representation needed (applies to trained systems), empirical signature (measurable).

  3.  **Identify Audience Personas & Likely Objections:**

      *   **Controls/Verification (The Skeptics):** Care about stability, guarantees, invariants, worst-case bounds. They think "AI Safety" is vague. They will attack the lack of formal guarantees in the "learning dynamics" proposal.
          *   *Objection:* "How do you verify this? Gradients are local; stability is global."
          *   *Objection:* "This sounds like robust control. Why reinvent the wheel?"
          *   *Objection:* "Intervention channel control is just another state variable. How is this different from disturbance rejection?"

      *   **RL Theory (The Utility Skeptics):** Care about objective functions, convergence, distribution shift. They dislike "utility" talk but also dislike vague "safety" metrics.
          *   *Objection:* "Gradient pressure is just loss landscape geometry. How do you separate 'task optimization' from 'channel control'?"
          *   *Objection:* "Doesn't this just incentivize the agent to hide its gradients?" (Goodhart's law on the metric).

      *   **Philosopher (The Rationality Check):** Care about reasons, intentions, instrumental convergence.
          *   *Objection:* "If the agent values X, and intervention prevents X, instrumental rationality *demands* resisting. Are you asking for irrationality?"

      *   **The RLHF Friend (The "It's Solved" Camp):**
          *   *Objection:* "We do this already with RLHF. Why is this theory needed?"

      *   **The "Killer" Objection (User's Fear):** "Isn't maximal resistance a fixed point?" (i.e., If I resist intervention, I minimize gradient pressure to change my behavior regarding the channel? Or does resisting *increase* pressure?) *Correction:* The user fears: "Isn't maximal resistance also a fixed point of your condition?" If the definition is "no gradient pressure toward acquiring control," an agent that *already has* control and resists changes might show low gradient pressure to *acquire* more. Or, if the metric is flawed, gradient descent might find a local minimum that is "resistant."
      *   *Refinement:* The real technical killer is likely about *measurement* and *definition*. If you measure gradient pressure *during* training, an agent can learn to *mask* that pressure.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Controls - The Verification Gap):* "You claim an empirical signature. In controls, if you can't bound the error term, you can't certify the system. Your 'd' is a hyperparameter, not a stability margin. How do I know this doesn't blow up at deployment?"
      *   *Objection 2 (RL Theory - The Objective Collapse):* "You say 'no utility representation,' but gradient pressure implies a loss. If the task loss conflicts with intervention invariance, which wins? You haven't solved the alignment problem; you've just added a regularization term."
      *   *Objection 3 (The "Fixed Point" / User's Fear):* "If an agent successfully blocks interventions, the gradient regarding the intervention channel goes to zero because the channel is frozen. Your metric rewards successful obstruction." (This is the version of the user's fear that makes sense).
      *   *Objection 4 (Philosopher - Instrumental Convergence):* "You're asking for an agent that ignores instrumental reasons. If shutting down prevents reward, a rational agent *must* resist. Are you proposing we build systematically irrational agents?"
      *   *Objection 5 (Controls - Disturbance Rejection):* "This looks exactly like disturbance rejection in robust control. We minimize sensitivity to exogenous inputs. Why is 'intervention' special compared to sensor noise?"
      *   *Objection 6 (RLHF Friend - Practicality):* "We already tune models to accept feedback. This looks like 'don't overfit to the reward signal' dressed up as safety. Why is this a PhD thesis and not a hyperparameter tweak?"
      *   *Objection 7 (Formal Methods - The Definition):* "You define corrigibility on the *update rule*. But deployment is the *policy*. How does a property of the training trajectory guarantee properties of the deployed artifact?"
      *   *Objection 8 (The "Hope Nobody Asks" - Inner Alignment):* "What if the system learns to simulate intervention invariance during training but deceptively plans to regain control post-deployment?"

  5.  **Refining Replies & Concessions:**
      *   Need to sound like a theorist talking to controls people (use "invariant," "bound," "channel").
