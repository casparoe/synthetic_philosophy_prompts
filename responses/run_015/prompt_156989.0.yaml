      6.  Disturbance Rejection Redundancy (Controls).
      7.  "It's Just Regularization" (RLHF Friend).
      8.  Deceptive Alignment (The "Hope Nobody Asks").

      *Wait, I need to make sure the "Fixed Point" objection is phrased correctly.* If the agent resists, the intervention doesn't happen. If the intervention doesn't happen, you can't measure the gradient pressure *from* the intervention. So the metric is undefined or zero. This is a fatal flaw in the definition as stated. I must advise the user to concede this is the "open problem" part of the thesis.

      *Let's adjust the "Killer" analysis.* The user asked: "tell me if you think the real killer is a different one." I think the Fixed Point is the killer. But the *Deployment Gap* (Training property $\neq$ Runtime property) is also huge for Controls people. I'll rank Fixed Point higher because it breaks the definition internally.

