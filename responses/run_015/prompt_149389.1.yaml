  7.  **Final Polish:** Ensure terms like *santati*, *sabhāva*, *vipāka*, and *sammuti sacca* are used correctly to match the user's level of discourse. (Self-correction: Ensure I distinguish Theravada *bhavaṅga* from Yogācāra *ālaya-vijñāna*, as the user might be conflating them implicitly. The *bhavaṅga* is less "storehouse" and more "idle mode" of consciousness.)

  8.  *(Final thought)*: The user's phrase "acausal-series-without-synchronic-unity" is the weakest link. *Bhavaṅga* is the *condition* for the next moment. It is causal. I must emphasize *paticca-samuppada* (dependent origination) here.

