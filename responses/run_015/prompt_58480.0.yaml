  Upon the left a heap of hay was placed,
  Equal in weight and golden in the light,
  As near to hoof as any mouth could stretch,
  With scent of dry and sweet grass in the air,
  No shadow fell to mark it less or more,
  And hunger urged the beast to that same side.

  Upon the right a heap of hay was placed,
  Equal in weight and golden in the light,
  As near to hoof as any mouth could stretch,
  With scent of dry and sweet grass in the air,
  No shadow fell to mark it less or more,
  And hunger urged the beast to that same side.

  Yet step he did, no motive in his mind,
  But picked the left, for choice need not prefer.

  ***

  **Note on Scholastic Background and Indifference**

  This poem simplifies the historical attribution of the paradox; while known as "Buridan's Ass," Jean Buridan did not use this specific example, though he discussed moral determinism similarly. The resolution in the couplet relies on a contested understanding of indifference rejected by Leibniz, who argued that the Principle of Sufficient Reason forbids choice without a differentiating cause. Modern decision theory, however, often permits arbitrary selection (picking without preferring) as rational when expected utilities are identical, treating the agent's will itself as a sufficient tie-breaker.
