answer: |-
  ### Audit of Analogy 1: "Good Money After Bad" / "Spilt Milk"

  **Table of Correspondences**

  | Source Domain (Milk/Gamble) | Target Domain (Capital Project) |
  | :--- | :--- |
  | Spilt milk / Lost bet | Money already spent on project |
  | Retrieval attempt | Continuing the project |
  | New milk / New bet | Future funding required |
  | Rational agent | Provost / Committee |
  | Clean up / Walk away | Abandon project |

  **Imported Features & Mapping Breaks**
  *   **Imported:** The source domains assume the loss is *purely consumptive*. Spilt milk nourishes nothing; a lost bet transfers wealth without creating asset value. They assume the loss is *private* and carries no *signal* to others.
  *   **Break 1 (Residue):** Milk leaves no usable residue. A capital project leaves a half-built structure, trained personnel, or data (Constraint i).
  *   **Break 2 (Intent):** Spilling is accidental; gambling is entertainment. Project investment is intended to create value.
  *   **Break 3 (Information):** A lost bet reveals nothing about the next bet's odds. Past project spending may reveal private information about viability (Constraint ii).

  **Criticality of Breaks**
  *   **Break 1 is Critical.** Ignoring the residue leads to incorrect future cost-benefit analysis. If the sunk cost created a half-finished wall, the cost to *finish* is lower than the cost to *start anew*. The colleague's analogy tempts the committee to treat the site as empty rather than partially developed.
  *   **Break 2 & 3 are Critical.** Treating the outlay as pure loss ignores the informational content (Constraint ii). If the initial investment signaled high expected value, abandoning it solely because costs rose may ignore the original signal's weight.

  ### Audit of Analogy 2: "Burning Boats"

  **Table of Correspondences**

  | Source Domain (Military) | Target Domain (Capital Project) |
  | :--- | :--- |
  | Boats | Option to abandon project |
  | Burning boats | Sunk costs / Public investment |
  | Adversaries | Stakeholders / Competitors / Donors |
  | Victory / Defeat | Project success / Failure |
  | Morale / Credibility | Institutional reputation |

  **Imported Features & Mapping Breaks**
  *   **Imported:** The source domain assumes a *strategic interaction* where the adversary's behavior changes based on your commitment. It assumes the burning is *intentional* to create credibility.
  *   **Break 1 (Intentionality):** Cortés burned boats deliberately to commit. University overruns are often accidental. Accidental constraints do not automatically generate credibility (Constraint iii).
  *   **Break 2 (Adversary):** In war, the enemy fights harder if you can retreat. In budgeting, stakeholders may punish waste regardless of commitment.
  *   **Break 3 (Payoff):** Military victory is existential. Project completion is often marginal utility.

  **Criticality of Breaks**
  *   **Break 1 is Critical.** For the "burning" to be rational, the constraint must be credible. If the committee abandons the project despite the sunk cost, does it actually damage reputation (Constraint iii)? If the project is a "white elephant," finishing it may damage reputation more than quitting. The analogy assumes commitment is always virtuous; in administration, stubbornness is often vice.
  *   **Break 2 is Critical.** The "adversary" (public/donors) may not view sunk costs as a commitment device but as a warning sign. The analogy imports a strategic benefit that may not exist in the target domain.

  ### Evaluation of Constraints

  **(i) Ledger-sunk versus residue-bearing outlay**
  The colleague's analogy fails here. The "bygones principle" must distinguish between the *cost* incurred (irrelevant) and the *state* produced (relevant). A half-built structure is a forward-looking asset. The principle should be: *Ignore the irrecoverable cost, but account for the current asset state.* The "Spilt Milk" analogy conceals this by assuming the loss leaves no asset.

  **(ii) Outlay as evidence rather than as cause**
  The "Spilt Milk" analogy assumes the past outlay is known to be a loss with no news value. This is often false. If a committee invested heavily, they likely had private information suggesting high viability. Continuing may be rational not because the money is sunk, but because the *fact of the investment* updates the probability of success. The analogy begs the question by defining the outlay as "bad money" rather than "evidence."

  **(iii) Strategic and diachronic cases**
  The "Burning Boats" analogy captures the logic of commitment, but only if the commitment is *credible* and *valuable*. Reputation is a forward-looking asset. If abandoning the project signals instability to donors, the cost of abandonment includes future fundraising losses. This is not a sunk cost fallacy; it is a calculation of future reputational capital. However, if the "commitment" is merely emotional embarrassment, the analogy fails. The distinction lies in whether the past outlay alters the *future payoff structure* (e.g., via reputation) or merely alters the *psychological comfort* of the agent.

  ### A Better Analogy
  **The Non-Refundable Deposit on a Custom Build.**
  You pay a deposit for a house. The foundation is poured (residue). You discover defects (new information). You must decide whether to pay the remaining balance.
  *   **Sunk:** The deposit is gone (supports colleague).
  *   **Residue:** The foundation exists and reduces completion cost (supports user/Constraint i).
  *   **Signal:** The builder's progress signals capability (Constraint ii).
  *   **Commitment:** Walking away affects your credit/reputation with the builder (Constraint iii).
  This analogy forces the decision-maker to separate the lost deposit from the value of the foundation and the cost of future reputation, avoiding the binary trap of both original analogies.

  ### Verdict
  The unqualified conclusion ("no rational agent permits a bygone to influence a forward-looking choice") is false. It conflates *irrecoverable costs* with *irrelevant consequences*. Past outlays often create assets, signals, or commitment values that are strictly forward-looking considerations, even if they are causally dependent on the past. The principle survives only when the sunk cost is truly "sunk" in the strongest sense: no residue, no signal, no strategic value.

  \answer{survives-in-restricted-form: Ignore past costs absent residual assets, signals, or commitment.}
