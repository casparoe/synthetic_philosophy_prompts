  **PROSOCHE PARTNERS | FACILITATOR RUN-SHEET**
  **Client:** UK Logistics Co | **Module:** Resilience & Agency | **Date:** 24 October
  **Facilitator:** J. Thorne | **Venue:** Hub 4 Conference Room

  **09:00 – 09:30 | Introduction: The Stoic Organisation**
  **Script:** "Welcome. We are here to align personal resilience with operational reality. Epictetus, who authored the tag *amor fati*, noted that some men are slaves and some are emperors. Marcus Aurelius ruled Rome; Epictetus served a master. Both found freedom. This philosophy suits every level of the organisation. Today we programme our judgements to match our KPIs."

  **09:30 – 10:45 | Session 1: The Trichotomy of Control**
  **Activity:** Three-column sorting exercise.
  **Script:** "Classical Stoicism divides experience into three domains. Column A: Wholly within our power (our effort, our attendance). Column B: Wholly outside (market rates, senior management decisions). Column C: Partly within (output targets, shift patterns). Resilience failures occur when we attempt causal reach into Column B. We do not control the pay freeze. We control our assent to it. If you desire what is outside your causal reach, you labour in vain."
  **Note:** Emphasise that Column C is where performance management lives. We influence outcomes, but must remain indifferent to the result if fate dictates otherwise.

  **10:45 – 11:00 | Break**

  **11:00 – 12:30 | Session 2: Operational Case Study**
  **Scenario:** 'The Pallet Shortage'. A delivery window is missed due to supplier delay. Team leaders typically blame procurement.
  **Script:** "Identify the locus of control. The supplier delay is Column B. Your reaction is Column A. The missed KPI is Column C. Do not mourn the pallet. Mourning implies you believed the pallet was yours to command. Use the View-from-Above technique: visualise the warehouse from the ceiling. The missing pallet is negligible. The shift continues."
  **Debrief:** "Teamwork is our form of *oikeiōsis*. We extend concern to the immediate unit. If the unit functions, virtue is maintained."

  **12:30 – 13:30 | Lunch**

  **13:30 – 15:00 | Session 3: Preferred Indifferents**
  **Script:** "Stoics recognise 'preferred indifferents'. Health, wealth, and remuneration are preferred. We prefer a pay rise. However, they are indifferent to virtue. To demand them is to enslave yourself to externals. The current remuneration package is an external. Your virtue lies in working excellently despite it. If the rise comes, accept it. If not, accept it. Your worth is not the payroll."
  **Exercise:** Negative Visualisation. Imagine the pay freeze permanent. Imagine rotating shifts indefinitely. realise you are still here, breathing, working. This is freedom.

  **15:00 – 15:15 | Break**

  **15:15 – 16:00 | Session 4: Fate & Performance**
  **Script:** "We operate within a fixed performance framework. This is fate. Everything is fated. However, this is not quietism. Our efforts are themselves among the fated things. They are co-fated with the outcome. You must work hard because that effort is also destined."

  **16:00 – 16:30 | Closing Q&A**
  **Prepared Question:** "Isn't this just telling us to accept the pay freeze?"
  **Scripted Response:** "That question assumes a dichotomy between acceptance and action. Stoicism posits that your effort to contest the freeze is also fated. If you are fated to complain, you will complain. But if you are fated to excel, you will excel regardless of the freeze. We are not asking for acceptance. We are asking for alignment. *Amor fati*: love the fate of the company, including the budget. If the budget is frozen, love the freeze. It is the material virtue works upon."
  **Close:** "Dismissal. Return to shifts."

  ***

  **DOCTRINAL NOTES & LIBERTIES TAKEN**

  This piece intentionally misrepresents Stoic doctrine to satirise corporate appropriation. Specific deviations include:

  1.  **The Trichotomy:** The run-sheet presents a three-way split (wholly within, wholly outside, partly within) as the "classical" position. In reality, Epictetus offers a strict dichotomy (up to us vs. not up to us). The trichotomy is a modern adaptation (often attributed to William Irvine) designed to make Stoicism more palatable for goal-setting, but presenting it as ancient orthodoxy is historically inaccurate.
  2.  **Causal Control vs. Assent:** The facilitator defines "what is up to us" as causal reach (what we can bring about physically/operationally). Epictetus's actual distinction is moral/pro psychological: only our judgements, impulses, and desires are truly "up to us"; external outcomes (even those we influence) are not. This shift allows the company to claim output targets are "partly within control" while framing dissatisfaction with pay as a failure of internal judgement.
  3.  **Co-Fated Determinism:** The Q&A response relies on a hard determinist reading of "co-fated" events (Chrysippus's cylinder analogy) to neutralise grievance. While technically a valid Stoic defence against fatalism, using it to suggest that complaining is merely "fated" rather than addressing the justice of the pay freeze removes the Stoic emphasis on justice as a virtue.
  4.  **Amor Fati & Epictetus:** The phrase *amor fati* is Nietzschean, not Epictetan, though the sentiment is Stoic. Attributing it directly to Epictetus lends false textual authority.
  5.  **Oikeiōsis:** The doctrine of social appropriation is reduced to "teamwork," stripping it of its cosmopolitan ethical weight (concern for all humanity) and limiting it to corporate loyalty.

