  # Decision-Tree Taxonomy: Universals and Uninstantiated Structural Roles

  **Node 1:** Does the view admit strictly repeatable properties (universals) that are numerically identical across different instances?
  *   **YES** → Go to Node 2 (Realist Path)
  *   **NO** → Go to Node 2* (Nominalist Path)

  ---

  ## Branch A: Realist Path (Node 1 = YES)

  **Node 2:** Must these repeatable properties be instantiated in concrete particulars to exist?
  *   **YES** → Go to Node 3
  *   **NO** → Go to Node 3

  **Node 3:** Are these properties mind-independent?
  *   **YES** (Instantiated + Mind-Independent)
      *   **Position:** **Immanent Realism**
      *   **Awkward Commitment:** It must deny reality to uninstantiated structural roles (e.g., a prime algorithm never computed), which conflicts with mathematical intuition.
  *   **NO** (Instantiated + Mind-Dependent)
      *   **Position:** **Conceptualism**
      *   **Awkward Commitment:** It renders uninstantiated structural roles contingent on human cognition, undermining their objective necessity.
  *   **YES** (Uninstantiated + Mind-Independent)
      *   **Position:** **Platonic Realism**
      *   **Awkward Commitment:** It commits to an ontologically bloated realm of infinite unexemplified structures that are causally inert.
  *   **NO** (Uninstantiated + Mind-Dependent)
      *   **Position:** **Unnamed Position**
      *   **Diagnosis:** **Incoherence;** positing mind-dependent entities that exist neither in a mind nor in concrete particulars is logically unstable.

  ---

  ## Branch B: Nominalist Path (Node 1 = NO)
  *(Note: Since Node 1 is negative, Node 2 and 3 as defined above do not apply; parallel diagnostic questions are used to distinguish nominalist variants.)*

  **Node 2\*:** Do concrete particulars objectively resemble one another without sharing a universal?
  *   **NO** → Go to Node 3\*
  *   **YES** → Go to Node 3\*

  **Node 3\*:** Does the view admit particularized property-instances (tropes) as fundamental?
  *   **NO** (No Resemblance + No Tropes)
      *   **Position:** **Extreme Nominalism**
      *   **Awkward Commitment:** It must reduce uninstantiated structural roles to mere linguistic conventions, denying their algorithmic efficacy.
  *   **YES** (No Resemblance + Tropes)
      *   **Position:** **Unnamed Position**
      *   **Diagnosis:** **Unattractiveness;** admitting tropes while denying objective resemblance classes undermines the primary motivation for trope theory (accounting for similarity).
  *   **YES** (Resemblance + Tropes)
      *   **Position:** **Trope Theory**
      *   **Awkward Commitment:** It struggles to explain the unity of uninstantiated structural roles without appealing to abstract resemblance classes that function like universals.
  *   **NO** (Resemblance + No Tropes)
      *   **Position:** **Resemblance Nominalism**
      *   **Awkward Commitment:** It must treat uninstantiated structural roles as merely possible classes of particulars, failing to ground the pattern itself.
