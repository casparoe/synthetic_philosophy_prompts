      *   **Theoretical Framework:** Must engage with Karl Jaspers's fourfold distinction (criminal, political, moral, metaphysical guilt).
      *   **Task:** Write the *desiderata* (criteria for success) for an adequate theory.
      *   **Requirements for each Desideratum:**
          *   Motivating case/conceptual pressure.
          *   Distinctions to preserve (liability vs. duty, collective vs. individual).
          *   Phenomena to explain (e.g., appropriate shame without blame).
          *   Consistency constraints (e.g., agency requirement).
      *   **Special Instruction:** Flag tensions/unsatisfiable pairs (e.g., collective continuity vs. present-tense agency).
      *   **Final Step:** Briefly evaluate Jaspers's taxonomy against these desiderata.
      *   **Constraint:** Keep focus on the criteria, not a literature survey.

  2.  **Deconstruct the Problem Space:**
      *   *The "Non-Identity" Problem:* If the past actions changed who exists now, can current people claim harm or owe repair? (Though the prompt focuses on *guilt*, not just harm).
      *   *The "Agency" Problem:* Guilt usually requires doing something wrong. Current generations didn't *do* the past structural harm.
      *   *The "Collective" Problem:* Nations aren't biological organisms. How does a nation persist? Is it a metaphysical entity or a legal/political construct?
      *   *The "Structural" Problem:* Unlike a massacre, structural harm (extraction/degradation) is diffuse. Who is the perpetrator? The system? The citizens benefiting?
      *   *Jaspers's Framework:*
          *   Criminal: Legal violation (individual).
          *   Political: Citizen liability for state actions (collective).
          *   Moral: Individual conscience/complicity.
          *   Metaphysical: Solidarity with humanity (violation of human bond).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Agency/Responsibility Link.* We can't just assign guilt arbitrarily. It needs to connect to agency.
          *   *Pressure:* Liberal individualism says "I am only responsible for what I do."
          *   *Requirement:* Must explain how guilt attaches without direct action.
      *   *Desideratum 2: Collective Persistence.* The nation must exist across time.
          *   *Pressure:* If the state dissolves, does the guilt vanish?
