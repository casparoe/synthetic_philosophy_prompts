          *   *Requirement:* Explain the normative status of these emotions.
      *   *Desideratum 6: Jaspersian Integration.*
          *   *Pressure:* Need to use his categories but adapt them.
          *   *Requirement:* Map the four types to transgenerational contexts.

  4.  **Refining and Polishing the Desiderata (incorporating specific prompt instructions):**

      *   *Make them sharper.* Use terms like "Diachronic Collective Agency," "Non-Identity Compatibility," "Liability vs. Duty."
      *   *Ensure Jaspers is integrated.* The prompt asks for a theory that *engages* Jaspers. So the desiderata should demand that the theory clarifies which of Jaspers' types survives transgenerationally.
      *   *Highlight Tensions.* The prompt explicitly asks to flag tensions. The biggest one is *Collective Continuity* vs. *Individual Agency*.

