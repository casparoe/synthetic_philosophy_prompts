answer: |-
  ### Desiderata for a Theory of Transgenerational National Guilt

  To evaluate competing accounts of transgenerational guilt, specifically regarding structural harms (e.g., colonial extraction, environmental degradation) where original actors are deceased, a theory must satisfy the following six desiderata. These criteria ensure the theory is metaphysically coherent, morally plausible, and phenomenologically accurate.

  #### 1. The Modified Agency Constraint
  *   **The Requirement:** The theory must explain how moral guilt can attach to agents who did not perform the wrongful acts, without violating the core liberal principle that moral responsibility requires agency. It cannot simply assert guilt by bloodline or geography; it must specify the *mechanism of transmission* (e.g., endorsement, benefit, failure to rectify).
  *   **Motivating Pressure:** The "Non-Identity" and "No Fault" objections. If I did not commit the act, and the act occurred before I existed, attributing *guilt* (rather than mere obligation) risks becoming a form of collective punishment or magical thinking.
  *   **Distinctions to Preserve:** It must distinguish between **original culpability** (doing the harm) and **derivative culpability** (sustaining the conditions of the harm). It must also distinguish **guilt** (backward-looking blame) from **obligation** (forward-looking duty).
  *   **Consistency Constraint:** Must remain consistent with the principle that moral status attaches to moral agents (individuals or constituted collectives), not to inert entities.

  #### 2. Diachronic Collective Identity
  *   **The Requirement:** The theory must provide criteria for the persistence of the collective agent (the Nation/State) across generations. It must specify what makes the "Germany" of 1940 identical enough to the "Germany" of 2024 to bear the same guilt, particularly when the harm is structural and spans centuries.
  *   **Motivating Pressure:** The problem of **collective dissolution and continuity**. If the state is merely a legal fiction that resets with every constitution or regime change, transgenerational guilt collapses. If the state is a metaphysical organism, it risks mysticism.
  *   **Phenomena to Explain:** Why we intuitively hold states responsible for treaties or debts signed centuries ago, yet hesitate to hold them responsible for moral crimes of the same era.
  *   **Consistency Constraint:** Must avoid reifying the state as a super-agent that overrides the moral status of its constituent members.

  #### 3. Structural Causality and Diffuse Harm
  *   **The Requirement:** The theory must account for harms that are not discrete events (like a massacre) but cumulative processes (like economic extraction or ecological degradation). It must explain how guilt accumulates over time when no single actor intended the total outcome.
  *   **Motivating Pressure:** The **Problem of Many Hands**. In structural injustice, the harm is the result of millions of small actions over centuries. Standard models of guilt require a specific *actus reus*.
  *   **Distinctions to Preserve:** It must distinguish between **event-based guilt** (committing a crime) and **status-based guilt** (participating in an unjust structure).
  *   **Phenomena to Explain:** Why present citizens might feel responsible for climate change or colonial wealth accumulation even if they personally voted against such policies.

  #### 4. The Liability vs. Duty Distinction
  *   **The Requirement:** The theory must rigorously separate the *status of being guilty* from the *duty to make reparations*. It must allow for the possibility that one can have a duty to repair without bearing the stain of guilt, and vice versa.
  *   **Motivating Pressure:** The **Political vs. Moral** friction. Citizens often accept they must pay taxes for past state crimes (political liability) while denying they are personally morally tainted (moral innocence). A theory that conflates these will fail to match our moral intuitions.
  *   **Distinctions to Preserve:** **Collective Liability** (shared burden of the polity) vs. **Distributed Individual Guilt** (personal moral failing).
  *   **Consistency Constraint:** Must not reduce all guilt to financial liability, nor all liability to an admission of guilt.

  #### 5. Phenomenological Adequacy (Shame without Blame)
  *   **The Requirement:** The theory must explain the normative status of "inherited shame." It must account for why a present-day citizen might feel appropriate shame or regret for their nation's past without accepting that they are personally blameworthy.
  *   **Motivating Pressure:** The **Experience of Membership**. People genuinely feel implicated in their nation's history. Dismissing this as irrational ignores a key moral emotion; validating it as "guilt" risks violating the Agency Constraint (Desideratum 1).
  *   **Phenomena to Explain:** The feeling of "stain" or "dishonor" associated with national history that persists even when legal culpability is absent.
  *   **Consistency Constraint:** Must distinguish **shame** (about who one is/where one belongs) from **guilt** (about what one has done).

  #### 6. Jaspersian Mapping
  *   **The Requirement:** The theory must explicitly categorize transgenerational guilt using Jaspers's taxonomy (Criminal, Political, Moral, Metaphysical), specifying which categories survive the death of the perpetrators and which dissolve.
  *   **Motivating Pressure:** **Conceptual Precision**. Jaspers argues criminal and moral guilt are strictly individual, while political guilt is collective. A transgenerational theory must clarify if "national guilt" is purely political or if it bleeds into the moral/metaphysical.
  *   **Distinctions to Preserve:** The boundary between **legal accountability** (Criminal/Political) and **human solidarity** (Metaphysical).
  *   **Consistency Constraint:** Must not expand "Criminal Guilt" beyond the actual perpetrators without violating legal positivism.

  ***

  ### Critical Tensions and Joint Unsatisfiability

  There is a significant tension between **Desideratum 2 (Diachronic Collective Identity)** and **Desideratum 1 (The Modified Agency Constraint)**.

  *   **The Tension:** To satisfy Desideratum 2, the theory must posit a robust, continuous collective agent that persists across centuries to bear the guilt. However, to satisfy Desideratum 1, the theory must respect that moral agency and guilt ultimately reside in beings capable of choice (individuals or current decision-making bodies).
  *   **The Conflict:** If the collective is strong enough to carry guilt across generations (satisfying D2), it risks becoming a metaphysical entity that overrides the requirement for present-tense agency (violating D1). If the collective is weak/deflationary to protect individual agency (satisfying D1), it becomes difficult to explain why the *same* collective is guilty centuries later (violating D2).
  *   **Joint Unsatisfiability:** It may be impossible to fully satisfy both without resorting to a "fiction" of continuity. A theory might have to concede that transgenerational *guilt* is strictly speaking incoherent, and replace it with transgenerational *obligation*, thereby failing the prompt's premise, or it must argue that collective agents have a form of agency distinct from human agency, which risks mysticism.

  A second tension exists between **Desideratum 3 (Structural Causality)** and **Desideratum 6 (Jaspersian Mapping)**.
  *   **The Tension:** Jaspers's **Criminal Guilt** requires specific acts by specific individuals. **Structural Harm** (D3) is diffuse and often legal at the time.
  *   **The Conflict:** Applying Jaspers's **Political Guilt** to structural harm risks turning all citizens into co-perpetrators simply by membership, which Jaspers explicitly sought to avoid to protect individual moral conscience. A theory that fully embraces structural guilt may have to collapse Jaspers's distinction between Political and Moral guilt, arguing that living within an unjust structure *is* a moral failing, not just a political liability.

  ***

  ### Evaluation of Jaspers's Taxonomy Against Desiderata

  Karl Jaspers's *The Question of German Guilt* (1947) serves as a foundational text but fares poorly against these desiderata when applied to transgenerational, structural contexts without significant modification.

  1.  **Agency Constraint:** Jaspers succeeds here by strictly limiting **Criminal** and **Moral** guilt to individuals who acted. He refuses to transmit these across generations. However, this makes his model ill-suited for transgenerational claims, as it effectively blocks the transmission of the "strongest" forms of guilt.
  2.  **Diachronic Identity:** Jaspers assumes a continuity of the *political* entity (the State) but is vague on its metaphysical persistence. He treats political guilt as a liability of citizenship, which transmits easily, but this feels insufficient for deep historical structural harms.
  3.  **Structural Causality:** Jaspers's model is designed for discrete atrocities (the Holocaust, the War), not centuries of economic extraction. His taxonomy struggles to categorize harm that is legal, systemic, and cumulative.
  4.  **Liability vs. Duty:** Jaspers is strong here. He clearly separates Political Guilt (liability for the state's deeds) from Moral Guilt (personal conscience). This aligns well with Desideratum 4.
  5.  **Phenomenology:** Jaspers captures the nuance of **Metaphysical Guilt** (solidarity with humanity), which comes closest to explaining the "shame without blame" phenomenon. However, he views this as a religious/existential category, not a basis for political claims.
  6.  **Jaspersian Mapping:** Jaspers himself would likely reject the premise of *transgenerational moral guilt*. His framework suggests that while Political Liability transfers to successors, Moral and Criminal Guilt die with the perpetrator.

  **Verdict:** Jaspers's taxonomy satisfies the **Liability/Duty** and **Agency** desiderata but fails the **Diachronic Identity** and **Structural Causality** desiderata. An adequate theory for the specific case of transgenerational structural harm must expand Jaspers's **Political Guilt** to absorb some of the normative weight of **Moral Guilt**, or rely heavily on **Metaphysical Guilt** as a bridge, both of which Jaspers would likely resist.
