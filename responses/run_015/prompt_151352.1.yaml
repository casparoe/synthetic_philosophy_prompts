prompt: |-
  I sit on our school board's Committee on Pluralism and Secularism — seven of us, three years of monthly meetings, and we've never once written down a principle, only decisions. We're in one of those jurisdictions where both traditions are pulling at once: the province has a secularism statute that binds people who work for the state, but the human rights code still obliges us to accommodate religion, and the two grind against each other at nearly every meeting. I've typed these up from memory so the dates and the order are probably a bit off, but the verdicts are right:

  - A student may wear a headscarf. A teacher may not wear one in front of her own class.
  - A student may wear a cross necklace. The big wooden crucifix that had hung in the main hallway since the fifties had to come down.
  - A Jewish student's exam that fell on a Saturday: we rescheduled it, no argument.
  - Daily halal meat in the cafeteria: refused. We required a genuinely adequate vegetarian alternative instead, and spent two meetings defining "genuinely adequate."
  - A Sikh boy's steel bangle: fine. A kirpan: refused, bladed object.
  - Year 9 girl excused from the partner-dance unit on modesty grounds: granted. Year 7 girl excused from swimming on modesty grounds: refused, but she may wear a full-coverage suit and we paid for one the first year. That pair still bothers me and I don't think we ever explained it.
  - An evangelical prayer group may use an empty classroom at lunch. It may not pray over the PA before exams.
  - The cafeteria is run by a private contractor. We put a clause in the contract saying their staff won't discuss religion with pupils, and then voted 4–3 that "we do not regulate the dress of staff we do not employ," with no reasons minuted.
  - A parent volunteer who wears a visible cross and comes in once a week to hear kids read: allowed, 4–3, "case by case," again no reasons.
  - Hindu parents objected to the yoga unit. We kept the yoga, dropped the Sanskrit posture names and the namaste at the end.

  Now the new one. There's a nonprofit homework club run out of a community centre — free, open to anybody, genuinely open, no proselytizing, parents sign a form saying so. It wants to run 3:15 to 5:30 in our library, and to keep using the school's sign-up sheets and the noticeboard, whose heading carries a short dedication to God. Three of its tutors: two women in headscarves, one man with a visible cross. And for the last fifteen minutes the tutors supervise kids in the schoolyard until parents show up, which is the part I keep getting stuck on — same people, same clothes, same property, but for a quarter of an hour they're doing something that looks a lot like what teachers do.

  My worry is that "the parents choose it" isn't the clean consent story it sounds like: this is the only free homework help in the neighbourhood, and for a lot of these kids the alternative is going home to an empty flat. One of our members keeps proposing a test — would a nine-year-old reasonably take this person to be speaking for the school? — and I can't tell whether that fits what we've already done or quietly overturns half of it.

  So: if we want to be consistent with ourselves, do we renew as is, renew with conditions, or decline? Which of our own precedents is the closest analogue, and what are the two or three rules that fit *everything* we've decided so far and then come apart on this one? What does each predict here, which one's your bet, and what would we be committing ourselves to either way? And what case should we put on next month's agenda, since we clearly won't say it out loud, to find out which rule we've actually been running?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a school board's Committee on Pluralism and Secularism (7 members, 3 years, monthly meetings).
      *   **Context:** A jurisdiction with conflicting legal frameworks (Secularism Statute vs. Human Rights Code). The committee makes decisions based on precedent/verdicts rather than written principles.
      *   **Task:** Analyze a new case (Nonprofit Homework Club) based on past precedents, identify underlying rules/principles, predict outcomes based on those rules, and suggest a strategic agenda item to reveal the committee's *actual* operating logic.
      *   **Tone:** Intellectual, nuanced, bureaucratic but reflective, slightly weary of the inconsistency ("That pair still bothers me"), analytical.
      *   **Input Data:** A list of 10 past verdicts + the new case details.

  2.  **Deconstruct the Past Verdicts (Pattern Recognition):**
      *   *Headscarf (Student vs. Teacher):* Student = Yes (Rights/Accommodation). Teacher = No (State Neutrality/Authority).
      *   *Cross (Student vs. Hallway):* Student = Yes (Personal). Hallway Crucifix = No (State Endorsement/History).
      *   *Jewish Exam (Saturday):* Yes (Accommodation of Practice).
      *   *Halal Meat:* No (Institutional Provision). Vegetarian = Yes (Neutral Alternative). *Key:* Institution doesn't fund specific religious diets, but ensures inclusion via neutrality.
      *   *Sikh Bangle vs. Kirpan:* Bangle = Yes (Symbol). Kirpan = No (Safety/Weapon). *Key:* Safety trumps symbol, but minimal symbols okay.
      *   *Modesty (Dance vs. Swimming):* Dance = Yes (Excused). Swimming = No (Excused), but Suit = Yes (Accommodated). *Key:* Core curriculum participation required, but mode of participation flexible. Inconsistency noted by user.
      *   *Prayer Group (Room vs. PA):* Room = Yes (Private/Optional). PA = No (Public/Coercive/Institutional Voice).
      *   *Cafeteria Staff (Contractor Dress):* "We do not regulate..." (4-3). *Key:* Avoidance of liability/authority over non-employees.
      *   *Parent Volunteer (Cross):* Allowed (4-3, "Case by Case"). *Key:* Ambiguity on non-employees representing school.
      *   *Yoga:* Kept activity, dropped religious markers (Sanskrit/Namaste). *Key:* Secularize the practice, keep the benefit.

  3.  **Analyze the New Case (Homework Club):**
      *   **Who:** Nonprofit tutors (2 headscarves, 1 cross).
      *   **Where:** School Library + Schoolyard (Supervision).
      *   **When:** After school (3:15-5:30).
      *   **What:** Homework help + Supervision.
      *   **Materials:** Sign-up sheets/Noticeboard (with "dedication to God").
      *   **Constraint:** Economic necessity (only free help available).
      *   **Conflict:** Tutors look like teachers during supervision (schoolyard duty). Religious symbols visible. Religious dedication on materials.

  4.  **Identify Underlying Rules/Principles (The "Hidden Constitution"):**
      *   *Rule A (State Neutrality):* The institution cannot *endorse* religion (Hallway Crucifix, PA Prayer, Noticeboard Dedication).
      *   *Rule B (Individual Rights):* Individuals (students/volunteers) can *possess* faith (Student Headscarf, Student Cross, Volunteer Cross).
      *   *Rule C (Authority/Representation):* Those acting *in loco parentis* or as state agents cannot display faith (Teacher Headscarf, PA Prayer).
      *   *Rule D (Safety/Neutrality of Provision):* Institution provides neutral alternatives, not specific religious goods (Halal vs. Vegetarian, Yoga Secularized).
      *   *Rule E (The "Look" Test):* Does it look like the school is doing this? (Teacher headscarf = No. Volunteer cross = Maybe).

      *   *The Tension:* The tutors are nonprofit (not employees) but performing a quasi-school function (supervision) on school property using school materials.

  5.  **Evaluate Options (Renew As Is, Conditions, Decline):**
      *   *Renew As Is:* Risks violating Rule A (Noticeboard dedication) and Rule C (Supervision looks like teaching).
      *   *Decline:* Violates Rule B (Individual rights of tutors) and ignores the Human Rights Code aspect (access to education/support). Ignores the "economic coercion" reality.
      *   *Renew with Conditions:* Most likely path. Remove religious dedication from sheets. Clarify supervision status.

  6.  **Develop the "Test" (The 9-Year-Old Standard):**
      *   The member's proposed test: "Would a nine-year-old reasonably take this person to be speaking for the school?"
      *   *Fit:* Fits Teacher Headscarf (Yes, they speak for school -> No scarf). Fits Student Headscarf (No, they don't speak for school -> Yes scarf). Fits PA Prayer (Yes -> No). Fits Room Prayer (No -> Yes).
      *   *Break:* Fits Volunteer Cross? (4-3 vote suggests ambiguity). Fits Cafeteria Staff? (Committee dodged this).
      *   *Application to New Case:* During homework help -> Maybe not speaking for school. During yard supervision -> Definitely looks like school staff.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Acknowledge the burden (the "unwritten constitution").
          2.  Extract the three latent principles.
          3.  Apply them to the new case.
          4.  Analyze the "Nine-Year-Old Test."
          5.  Recommendation (Conditions).
          6.  The "Trojan Horse" Agenda Item (to force clarity).
      *   *Tone Check:* Needs to sound like a colleague speaking to a colleague. Respectful of the difficulty, sharp on the logic.
      *   *Key Insight:* The Noticeboard dedication is the smoking gun. The Supervision is the functional trap. The Economic Coercion is the moral weight.

  8.  **Refining the Logic (Self-Correction during drafting):**
      *   *Correction:* I initially thought the Halal decision was about cost. Looking closer, it's about *institutional endorsement*. Providing Halal says "We support Islam." Providing Vegetarian says "We support everyone's dietary needs neutrally."
      *   *Correction:* The Volunteer Cross vote (4-3) is crucial. It shows the committee is split on whether non-employees count as "state agents."
      *   *Focus:* The Noticeboard dedication ("dedication to God") is a direct violation of the "Hallway Crucifix" precedent. That must be addressed.
      *   *Focus:* The Yard Supervision is the "Teacher Headscarf" analogue. If they are supervising, they are acting as teachers. If teachers can't wear symbols, can nonprofit tutors?

  9.  **Finalizing the Recommendation:**
      *   Renew with Conditions.
      *   Condition 1: Secularize the paperwork (remove dedication).
      *   Condition 2: Clarify the supervision role (are they agents?).
      *   Condition 3: Disclaimer (they are not school staff).
      *   *The Agenda Item:* Need something that forces them to choose between "Neutrality of the State" and "Accommodation of the Individual" in a way that can't be dodged like the Cafeteria Staff vote. A proposed policy on "External Partners on School Grounds" is the best vehicle.

  10. **Final Polish:** Ensure the distinction between the *Statute* (Secularism) and the *Code* (Human Rights) is woven through. (Proceed to generate output).

  *(Self-Correction on the "Nine-Year-Old Test"):* The user asks if this test fits what they've done or overturns it. I need to be honest: It fits the *clean* cases but exposes the *messy* ones (Cafeteria, Volunteer). It's a clarifying tool, not necessarily a consistent one.

  *(Final thought on the Agenda Item):* Don't suggest discussing *this* case again. Suggest a policy discussion that *covers* this case. "Defining the Boundary of School Authority."

  *(Wait, one more thing):* The user mentioned the "economic coercion" aspect. The committee hasn't dealt with *coercion* before, only *accommodation*. This is new. The "Prayer Group" was optional. This Homework Club is economically necessary. This shifts the "Voluntary" precedent. I need to highlight this.

  *(Okay, ready to write.)*
answer: |-
  This is a classic administrative dilemma: you are governing by *casuistry* (case-by-case reasoning) without a *casuistic framework* (written principles). You have built a common law of secularism through ten verdicts, but like any common law, it contains contradictions that only surface when a hard case arrives.

  Your new case is the hard case. It combines the **authority** of the teacher (yard supervision), the **ambiguity** of the volunteer (nonprofit staff), the **endorsement** risk of the infrastructure (noticeboard dedication), and the **coercion** of necessity (no other homework help).

  Here is an analysis of your own precedents, the rules they imply, and how to proceed without blowing up the committee.

  ### 1. The Three Latent Principles
  Looking at your ten past verdicts, you aren't running on one rule. You are balancing three competing principles that you have never ranked.

  *   **Principle A: State Neutrality (The Secularism Statute)**
      *   *Precedents:* Teacher headscarf (No), Hallway Crucifix (No), PA Prayer (No), Halal Meat (No), Yoga Sanskrit (No).
      *   *Logic:* The institution cannot endorse, fund, or appear to endorse a specific faith. The "voice" of the school must be empty of religion.
  *   **Principle B: Individual Accommodation (The Human Rights Code)**
      *   *Precedents:* Student headscarf (Yes), Student Cross (Yes), Saturday Exam (Yes), Sikh Bangle (Yes), Modest Swimwear (Yes).
      *   *Logic:* Individuals within the system have a right to practice, provided it doesn't harm others or disrupt core functions.
  *   **Principle C: The Agency Test (The Unwritten Rule)**
      *   *Precedents:* Teacher vs. Student headscarf, PA vs. Classroom prayer, Cafeteria Staff (dodged), Parent Volunteer (split vote).
      *   *Logic:* Restrictions apply based on whether the person is perceived as *speaking for the school*.
      *   *The Glitch:* Your cafeteria vote ("we do not regulate... staff we do not employ") contradicts your teacher vote. Your parent volunteer vote (4–3 "case by case") admits you don't know where the line is.

  ### 2. Applying the Precedents to the Homework Club
  If we apply your past verdicts strictly, the new case breaks down like this:

  *   **The Tutors' Clothing:**
      *   *Analogue:* **Teacher Headscarf (No)** vs. **Parent Volunteer Cross (Yes, 4–3).**
      *   *Conflict:* During homework help, they are like volunteers. During yard supervision, they are acting *in loco parentis*, exactly like teachers.
      *   *Prediction:* If the "Agency Test" holds, they cannot wear symbols *while supervising in the yard*. If the "Volunteer Precedent" holds, they can.
  *   **The Noticeboard/Sign-in:**
      *   *Analogue:* **Hallway Crucifix (No).**
      *   *Conflict:* A dedication to God on a school noticeboard is institutional endorsement, regardless of who uses it.
      *   *Prediction:* This must be removed or covered. It violates Principle A (State Neutrality) directly.
  *   **The Economic Coercion:**
      *   *Analogue:* **Prayer Group (Yes, optional)** vs. **Halal Meat (No, institutional provision).**
      *   *Conflict:* The prayer group was truly optional. This club is economically necessary ("alternative is an empty flat"). If the school denies this, is it denying access to education support?
      *   *Prediction:* This is the wildcard. Your precedents assume *choice*. This case involves *necessity*.

  ### 3. The "Nine-Year-Old Test"
  Your colleague's proposed test (*"Would a nine-year-old reasonably take this person to be speaking for the school?"*) is excellent, but it does not fit everything you've decided.

  *   **Where it fits:** It perfectly explains the **Teacher Headscarf** (Yes, they speak for school) vs. **Student Headscarf** (No, they don't). It explains the **PA Prayer** (Yes, institutional voice) vs. **Classroom Prayer** (No, private voice).
  *   **Where it breaks:** It exposes your **Cafeteria Staff** vote. If a cafeteria worker tells a child "God bless you," does the child think the *school* said it? Probably. But you voted not to regulate them. It also complicates the **Parent Volunteer** vote.
  *   **What it predicts here:**
      *   *Homework Help:* A child might see them as tutors, not teachers. (Passes test).
      *   *Yard Supervision:* A child sees an adult managing behavior on school property. They will assume this person is a teacher. (Fails test).
      *   *Noticeboard:* A child sees a school board with "God" on it. (Fails test).

  **My Bet:** The test is too sharp for this committee. It forces a binary choice you've been avoiding. If you adopt it now, you implicitly overturn the Cafeteria and Volunteer precedents. Three of your members will revolt because they don't want to regulate contractors or volunteers.

  ### 4. Recommendation: Renew with Conditions
  You cannot decline (violates Human Rights/access to education) and you cannot renew as is (violates Secularism Statute/Precedent on Endorsement).

  **The Verdict:** Renew with specific, written conditions that isolate the religious risk without blocking the service.

  1.  **The Infrastructure Condition:** The sign-up sheets and noticeboard heading must be secularized. The school cannot lend its name or property to a "dedication to God." *Precedent: Hallway Crucifix.*
  2.  **The Agency Condition:** During the 15 minutes of yard supervision, the tutors must wear identifiable vests or badges stating "Community Volunteer," distinct from staff. Ideally, a school staff member should be present in the yard, even if passive, to maintain the chain of command. *Precedent: Teacher Headscarf (mitigated by Volunteer Cross).*
  3.  **The Consent Condition:** The parent waiver must explicitly state that this program is *not* a school program, but a community service hosted on site. *Precedent: Prayer Group (private use of public space).*

  ### 5. The Strategic Agenda Item
  You noted that you won't say the real rule out loud. To find out which rule you are *actually* running without forcing a constitutional crisis on this specific case, you need a "Trojan Horse" policy discussion for next month.

  **Put this on the agenda:**
  *"Policy Review: Guidelines for External Partners Using School Facilities."*

  Do not frame it around religion. Frame it around **Liability and Representation.**
  Include a draft clause that reads: *"External partners acting in a supervisory capacity over students on school grounds must adhere to the same dress and conduct codes as school employees regarding visible symbols of personal belief."*

  **Why this works:**
  *   If they pass it, they have codified the **Nine-Year-Old Test** (Agency Principle) without admitting it. It solves the Yard Supervision issue for the homework club automatically.
  *   If they reject it, they have codified the **Cafeteria Precedent** (Contractual Distance). You will then know you cannot regulate the tutors' dress, and you must focus entirely on the Noticeboard and the Waiver.
  *   It forces the committee to decide if "Supervision" equals "Employment" in the context of secularism.

  **The Bottom Line:**
  Your committee has been surviving on ambiguity. This case punishes ambiguity. The Noticeboard dedication is the easiest cut (remove it). The Yard Supervision is the hardest (it looks like teaching). The Economic Necessity is the moral weight (don't kill the program).

  Vote to **Renew with Conditions**. Secure the secularism of the *paperwork* (your strongest ground) and blur the line on the *people* (your weakest ground) by distinguishing their role during supervision. Save the philosophical fight for the "External Partners" policy vote next month. That is where you will finally write down the principle you've been living with for three years.
