      *   **Constraint 2:** Address the specific framing: "Identity-locked" costs mean quitting renders the loss meaningless, so continuing *might* be rational to赋予 (give meaning to) the loss.
      *   **Constraint 3:** Apply this to Ahab (leg/years) and Ishmael (signing on).
