      *   Proposed Philosophical Twist: If the cost is part of the *self* (identity), abandoning the project negates the *meaning* of that cost. Therefore, continuing is an act of meaning-making, not just resource allocation. This aligns with existentialist or narrative identity theories (e.g., MacIntyre, Sartre, Frankfurt).
