answer: |-
  The stalemate between Disjunctivism and Representationalism is not primarily verbal, though terminological friction exacerbates it. Nor is it merely a case of talking past one another regarding metaphysical versus epistemological questions, although that distinction illuminates the motivations behind the positions. Rather, the impasse is **substantive**, rooted in a fundamental clash of **explanatory virtues**. Disjunctivists prioritize *ontological directness* and *epistemic security* (preserving the intuition that perception puts us in touch with the world), while Representationalists prioritize *explanatory unity* and *causal naturalism* (preserving the intuition that subjectively identical states must share a psychological nature).

  However, the persistence of this deadlock suggests a deeper methodological divergence concerning the status of **phenomenal character**. The shared rejection of 'adverbial' accounts reveals that both sides operate within a shared, unexamined ontology of experience that reifies phenomenal character as a *constituent* (either an object or a content). This shared assumption conceals the true fault line: whether subjective indistinguishability is a legitimate guide to metaphysical identity.

  ### 1. Substantive Clash of Explanatory Virtues

  The debate is not verbal because the disagreement survives charitable translation. If we define "experience" neutrally as "what it is like for the subject," the disagreement remains: does this "what it is like" supervene on an internal representational state (Representationalism) or is it constituted by the external environment itself (Disjunctivism)?

  This is a clash of virtues:
  *   **Representationalism** values **Uniformity**. It holds that the mind works in the same way regardless of environmental luck. If a brain state is identical, the mental state is identical. This virtue supports a naturalistic psychology where mental kinds are individuated by internal functional or representational roles, insensitive to external truth conditions.
  *   **Disjunctivism** values **Directness**. It holds that the nature of perception is defined by its success. To treat hallucination as the same *kind* of mental state as veridical perception is to concede that the immediate object of awareness is internal, thereby inviting skepticism. For the Disjunctivist (particularly of the McDowellian or Martinian variety), preserving the rational force of perception requires that the veridical case be fundamentally different in kind.

  Because these virtues (Uniformity vs. Directness) are both pre-theoretically compelling, neither side can deliver a *reductio* against the other without sacrificing a core intuition about mind or world.

  ### 2. Metaphysical vs. Epistemological Motivations

  While the debate is framed metaphysically (What *is* perceptual experience?), the sides are often driven by different master questions.
  *   **Disjunctivism** is often an **epistemological thesis in metaphysical clothing**. McDowell's motivation is to show how perception can justify belief without the mediation of an inner veil. The metaphysical claim (no common kind) is a means to secure an epistemological end (direct justification).
  *   **Representationalism** is often a **metaphysical thesis with epistemological consequences**. Representationalists aim to fit perception into a causal order. They argue that since hallucinations can be caused internally, the mental state must be internal. The epistemological consequence (that perception is fallible and mediated) is accepted as the cost of naturalism.

  The stalemate persists because Disjunctivists attack Representationalism for failing epistemology (leading to skepticism), while Representationalists attack Disjunctivism for failing metaphysics (violating causal closure or psychological unity). They are scoring the debate on different scorecards.

  ### 3. The Adverbial Blind Spot and Methodological Divergence

  The prompt asks whether 'adverbial' accounts constitute a hidden intermediary. Adverbialism posits that experience is not a relation to an object (Disjunctivism) nor a representation of a state of affairs (Representationalism), but a specific **manner of sensing** (e.g., sensing *redly* rather than sensing *a red patch*).

  Both sides reject Adverbialism, but for revealingly symmetrical reasons:
  *   **Representationalists** reject it because it fails to capture **intentionality**. Experiences are *about* the world; adverbial modifications lack the requisite structure to be true or false.
  *   **Disjunctivists** reject it because it posits an **inner modification**. Even if it avoids sense-data, treating experience as a "way of being aware" independent of the object still suggests the mind generates the phenomenology, undermining direct realism.

  **The Hidden Divergence:**
  This shared rejection conceals a deeper divergence about the **methodological legitimacy of phenomenal comparison**. Both sides accept the *datum* that veridical and hallucinatory cases are subjectively indistinguishable.
  *   **Representationalists** infer from this datum that there must be a **common metaphysical constituent** (content) that explains the similarity. They treat phenomenal similarity as a reliable guide to ontological identity.
  *   **Disjunctivists** deny this inference. They argue the similarity is merely **epistemic** (the subject cannot tell them apart) rather than **ontological** (they do not share a nature).

  The Adverbial view highlights a third option: Phenomenal similarity might reflect a common *capacity* or *mode of awareness* without implying a common *object* or *content*. By rejecting this, both Disjunctivists and Representationalists reveal that they both implicitly **reify phenomenal character**. They assume that if there is a "what it is like," it must be constituted by *something* (an object or a content).

  The deeper methodological split is this: **Is phenomenology a guide to ontology?** Representationalists say yes (phenomenal identity $\rightarrow$ mental identity). Disjunctivists say no (phenomenal identity $\rightarrow$ epistemic situation). The Adverbial rejection shows that neither side is willing to treat phenomenology as a primitive mode of engagement that doesn't require constitutive analysis.

  ### 4. Conclusion: What Counts as Progress?

  Given this diagnosis, empirical constraints from cognitive science are unlikely to resolve the impasse, as the dispute concerns the *interpretation* of the data (metaphysical constitution) rather than the data itself (neural correlates). A formal result is similarly unlikely, as the disagreement is not logical but axiological (competing virtues).

  **Progress would consist in a conceptual dissolution of the "Common Kind Assumption" regarding phenomenology.**

  Specifically, progress requires distinguishing **Phenomenal Similarity** from **Constitutive Identity**. The argument from illusion relies on the premise: *If two experiences are indistinguishable, they share a mental nature.*
  *   **Representationalism** accepts this premise.
  *   **Disjunctivism** rejects it but struggles to explain the similarity without positing *some* common factor (leading to "phenomenal disjunctivism" which risks collapsing back into representationalism).

  A genuine advance would be a framework that acknowledges **Phenomenal Overlap without Metaphysical Overlap**. This would involve articulating a notion of "awareness" that is not a relation to an object (avoiding Disjunctivist problems with hallucination) nor a representation of content (avoiding Representationalist problems with directness), but perhaps a **capacity for engagement** that can be exercised successfully (veridical) or unsuccessfully (hallucination) without changing the fundamental *type* of capacity, yet without positing an inner object.

  Until the field abandons the assumption that subjective indistinguishability *must* be explained by a shared constituent (content or object), the stalemate is **irreducible**. The disagreement is not about facts, but about the **grammar of perceptual ascriptions**. Therefore, the only viable progress is a therapeutic one: demonstrating that the demand for a "common mental kind" is a category mistake generated by conflating the *epistemology of discrimination* with the *metaphysics of consciousness*. Progress is the realization that the Argument from Illusion forces a false dichotomy between "inner veil" and "magical directness," and that dissolving the demand for a common constituent dissolves the need for the extreme positions currently entrenched.
