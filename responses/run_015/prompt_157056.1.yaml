  ### Design Outline

  1.  **Objective:** Construct a thought experiment separating Origin Essentialism (OE) from Psychological Continuity (PC) using realistic biomedical constraints.
  2.  **Design Constraints:**
      *   **Negative:** No cloning, no teleportation, no perfect predictors, no exotic physics.
      *   **Positive:** One-paragraph scenario; grounded in present-day reproductive medicine; explicit mechanism naming; fixed parents/environment/trajectory; altered gametic origin (numerically distinct tokens).
  3.  **Mechanism:** Mitochondrial Replacement Therapy (MRT) combined with standard IVF gamete selection.
  4.  **Structure:**
      *   Outline & Constraints (Current Section).
      *   Thought Experiment (One Paragraph).
      *   Philosophical Analysis (Claim, Worlds, Verdicts, Structural Feature, Removal, Objection).

  ***

  ### Thought Experiment

  Consider "Elena," conceived via mitochondrial replacement therapy (MRT), a protocol where her mother's nuclear DNA was inserted into a donor's enucleated egg cell and fertilized by a specific sperm token from her father to prevent mitochondrial disease. In the actual world, Elena develops a specific psychological profile determined by her nuclear genome and upbringing. In the nearest counterfactual world, the clinic utilizes her mother's own egg cell (a numerically distinct gamete token) and a different sperm token from the same father, while holding the nuclear genetic sequence, parental environment, and developmental trajectory fixed so that the resulting individual possesses identical psychological continuity with actual Elena. Here, the biomedical mechanism ensures the parents and psychological outcome remain constant, but the material origin—the specific zygote constituted by distinct gamete tokens—is numerically different.

  ***

  ### Philosophical Analysis

  **Identity Claim Tested:** The scenario tests the necessary conditions for **transworld identity**: whether being the *same person* across possible worlds requires having the *same biological origin* (OE) or merely the *same psychological history* (PC).

  **Nearby Worlds:**
  *   **Actual World:** Elena originates from Donor Egg Token + Father Sperm Token A.
  *   **Counterfactual World:** Elena* originates from Mother Egg Token + Father Sperm Token B (with identical nuclear DNA and upbringing).

  **Theoretical Verdicts:**
  *   **Origin Essentialism (Denies Identity):** Following Kripke, OE holds that origin is essential to identity. Since the zygote in the counterfactual world is constituted by numerically different gametes (a different egg cell and sperm token), it is a distinct biological entity. Therefore, Elena* is not Elena, regardless of psychological similarity.
  *   **Psychological Continuity (Affirms Identity):** PC holds that personal identity consists in overlapping chains of psychological connections (memory, character, intention). Since the nuclear DNA (driving brain structure) and environment are fixed, the psychological trajectory is identical. Therefore, Elena* is Elena.

  **Single Structural Feature:** The **decoupling of material gametic identity from psychological trajectory**. The scenario works because MRT and IVF allow us to conceptually separate the *physical stuff* of the zygote (the egg cytoplasm and specific sperm cell) from the *informational blueprint* (nuclear DNA) that generates the psychology.

  **Effect of Removal:** If this feature is removed—meaning we stipulate that changing the gamete tokens *necessarily* alters the psychological trajectory (e.g., via strict biological determinism where cytoplasmic variance changes brain development)—then Psychological Continuity would also deny identity. Both theories would converge on "different person," and the conflict would vanish.

  **Origin Essentialist Attack:** An origin essentialist would attack the **coherence of the counterfactual**. They would argue that you cannot "hold developmental trajectory fixed" while changing the origin, because the origin *constitutes* the individual. To imagine the same person arising from a different zygote is not to imagine a nearby possible world, but to imagine a different person entirely; thus, the scenario begs the question by assuming transworld identity is possible without origin identity.
