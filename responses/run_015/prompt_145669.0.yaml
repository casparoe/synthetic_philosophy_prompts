answer: |-
  ### Essay Question (90 Minutes)

  **Preamble:**
  In *De Corpore*, Thomas Hobbes argues that geometry is the only true demonstrative science. For the purposes of this question, accept the following Hobbesian premises as true:
  1.  **Scientific Knowledge is Causal:** To know something scientifically is to know its cause. We cannot demonstrate properties of a thing unless we know how that thing is produced.
  2.  **Geometry is Constructive:** Unlike natural philosophy (where we observe effects and guess at causes), in geometry we ourselves produce the objects we reason about. Therefore, a true geometric definition must describe the *generation* of the figure (the motion or action that creates it), not merely list its static properties.
  3.  **Materialism:** Geometric objects (points, lines, surfaces) are not abstract Platonic entities but are bodies considered with respect to their dimensions.

  **The Problem:**
  In practical drafting (such as CAD), a single figure can be fixed by multiple static specifications. For example, a circle can be defined by a center and radius, by three points on its circumference, or by dimensional constraints against other lines. All three specifications identify the exact same figure, yet none of them explicitly describe a motion or a "sweeping out" of the curve.

  **Question:**
  Using the premises above, explain how Hobbes would respond to the worry that "multiple static specifications" undermine the requirement for a single genetic definition. If a circle can be identified without describing its generation, is the genetic definition necessary? Furthermore, if generation implies motion, does this make geometric truth contingent on how matter actually moves? Argue whether Hobbes can preserve the necessity of geometry while maintaining that definitions must describe generation.

  ***

  ### Model Answer

  Hobbes's insistence that geometric definitions must describe generation is not a restriction on how we identify figures, but a requirement for how we know them scientifically. To resolve the worry regarding multiple static specifications, one must distinguish between *naming* a figure and *demonstrating* its properties. The CAD-style constraints (center/radius, three points, etc.) are sufficient to pick out the extension of the figure—they ensure we are drawing the same shape—but they do not necessarily provide the cause of that shape's properties. For Hobbes, a definition is the first principle of a demonstration. If the definition does not contain the cause, the subsequent reasoning cannot be strictly demonstrative. Therefore, while multiple static descriptions may be extensionally equivalent (they result in the same circle), only the genetic definition is intensionally sufficient for science. The center-and-radius description is privileged not because it is the only way to draw the circle, but because it conceives the circle as generated by a line rotating around a fixed point. This conception allows the geometer to deduce properties (like equidistance) directly from the cause. The three-point specification, while fixing the figure, obscures the cause of its uniformity. Thus, Hobbes can admit multiple ways of *finding* a figure while maintaining only one valid way of *defining* it for the sake of demonstration.

  The second worry concerns contingency. If a definition describes a motion, and motion is a property of matter, does the truth of geometry depend on the contingent behavior of physical bodies? If the compass slips, the circle fails. Hobbes avoids this by distinguishing between *actual* motion and *conceptual* motion. When Hobbes speaks of generation, he is not describing a historical event in the physical world, but a possibility grounded in the nature of body. The definition states that a circle *can* be generated by a rotating radius. The truth of the geometric proposition does not depend on whether anyone actually draws the circle, nor on the friction or imperfections of actual ink and paper. It depends on the logical consequence of the supposed generation. Because the motion is posited by the mind as a pure possibility of body, the consequences follow necessarily. The necessity lies in the connection between the supposed cause and the resulting effect, not in the physical existence of the object.

  Therefore, the materialism of Hobbes's geometry does not degrade it into natural philosophy. In natural philosophy, we reason from observed effects back to possible causes, which yields only probability. In geometry, we reason from posited causes (generations) to necessary effects. The "matter" involved in geometry is body considered universally, stripped of specific accidents like color or hardness, retaining only extension and mobility. By treating the generation as a conceptual operation upon universal body, Hobbes secures the necessity of the conclusion. The static constraints of the drafter are tools for construction, but the genetic definition is the tool for knowledge. Hobbes preserves the necessity of geometry because the "motion" in the definition is a rule of conception, not a report of physical history. Consequently, the existence of multiple static specifications does not threaten the genetic requirement; it merely highlights the difference between identifying an object and understanding its causal production, which is the sole aim of demonstrative science.

  ***

  ### Marking Scheme (25 Marks Total)

  **Move 1: Distinguishing Identification from Causal Knowledge (5 Marks)**
  *   **5 (A):** Clearly distinguishes between extensional equivalence (picking out the same shape) and intensional sufficiency (knowing the cause). Explains that static specs identify, but only generation defines for *science*.
  *   **3-4 (B):** Notes the difference between drawing and knowing, but is vague on why static specs fail as *definitions* specifically.
  *   **1-2 (C):** Treats all specifications as equally valid definitions, or claims Hobbes would reject static specs entirely as useless.
  *   *Typical Error:* Confusing the utility of a drawing with the logical structure of a definition.

  **Move 2: Privileging the Genetic Definition (5 Marks)**
  *   **5 (A):** Explains *why* the genetic definition (e.g., rotating radius) is privileged: it makes properties (like equidistance) deducible from the cause.
  *   **3-4 (B):** States that generation is required but does not explain how it aids deduction or demonstration.
  *   **1-2 (C):** Claims one generation is "true" and others "false" without reference to demonstrative utility.
  *   *Typical Error:* Asserting dogmatically that only one way is "real" without linking it to the premise that knowledge is causal.

  **Move 3: Conceptual vs. Actual Motion (5 Marks)**
  *   **5 (A):** Explicitly distinguishes between physical/historical motion (contingent) and conceptual/posited motion (necessary).
  *   **3-4 (B):** Mentions that geometry is in the mind, but does not clearly separate the *type* of motion involved.
  *   **1-2 (C):** Argues that geometric motion is physical, or denies that motion is involved at all.
  *   *Typical Error:* Falling into the trap of thinking Hobbes requires a physical compass to actually move for the truth to hold.

  **Move 4: Defending Necessity against Contingency (5 Marks)**
  *   **5 (A):** Argues that necessity resides in the logical consequence of the *possibility* of generation, not the existence of the object.
  *   **3-4 (B):** Asserts geometry is necessary but relies on "abstract ideas" rather than Hobbes's "universal body" framework.
  *   **1-2 (C):** Concedes that Hobbes's geometry is contingent, or argues necessity comes from God/logic outside the system.
  *   *Typical Error:* Abandoning Hobbes's materialism to save necessity (e.g., by appealing to Platonism).

  **Move 5: Synthesis and Conclusion (5 Marks)**
  *   **5 (A):** Unifies the argument: Static specs are for construction; genetic defs are for demonstration; motion is conceptual; therefore necessity is preserved.
  *   **3-4 (B):** Summarizes the points but fails to show how they resolve the initial tension between CAD-style constraints and Hobbes's theory.
  *   **1-2 (C):** Restates the prompt or offers a generic conclusion about Hobbes being important.
  *   *Typical Error:* Ending with a biographical note (e.g., "This is why Hobbes fought Wallis") which earns 0 for this move.

  **General Penalty:**
  *   Reciting biographical labels ("Hobbes was an empiricist") without argumentative function: **Deduct 2 marks from total.**
  *   Summarizing the Wallis quarrel without analyzing the generation problem: **Max 10 marks total.**
