  ## Case Traces

  ### Case 1: A Standard Thermostat
  1.  **Compression:** Yes (Temperature stays within range).
  2.  **Horizon:** Yes (We can predict it faster than it changes).
  3.  **Adversarial:** Yes (If we cool the room, it turns on heat; pattern holds under intervention).
  4.  **Physical Sufficiency:** *Debatable.* We *could* model the bimetallic strip physics, but it is costly. The tree asks: "Is compression *fully available*...?" Technically Yes, but usually we skip to Node 5 for efficiency. Let's assume we answer **No** (seeking higher efficiency).
  5.  **Goal Attribution:** Yes ("Maintain 70°F" is shorter than circuit equations).
  6.  **Belief Attribution:** No (Attributing "desire for warmth" adds no compression over "maintain 70°F").
  7.  **Verdict:** **Leaf 7: Design Stance.**
      *   *Commitment:* Treat it as an optimizer without an inner mind.

  ### Case 2: Ant Colony (Foraging)
  1.  **Compression:** Yes (Paths form to food sources).
  2.  **Horizon:** Yes.
  3.  **Adversarial:** Yes (Block a path, they find a new one; pattern robust).
  4.  **Physical Sufficiency:** No (Tracking every ant is too costly).
  5.  **Goal Attribution:** Yes ("Minimize distance to food" compresses behavior).
  6.  **Belief Attribution:** No (Colony acts *as if* it believes, but individual ants do not need belief attribution for the model to work).
  7.  **Verdict:** **Leaf 7: Design Stance.**
      *   *Commitment:* The colony is a designed/evolved optimizer, not a singular believer.

  ### Case 3: LLM Fine-Tuned on Human Text
  1.  **Compression:** Yes (Predicts next token accurately).
  2.  **Horizon:** Yes.
  3.  **Adversarial:** Yes (Handles novel prompts robustly).
  4.  **Physical Sufficiency:** No (Weights are too complex).
  5.  **Goal Attribution:** Yes ("Complete the text coherently").
  6.  **Belief Attribution:** Yes (Attributing "believes Paris is in France" compresses predictions better than just "completes text").
  7.  **Borrowed Check:** **Yes** (Optimized to mimic human text, not to know facts).
  8.  **Verdict:** **Leaf 8: Borrowed Pattern.**
      *   *Commitment:* Treat the intentionality as a facade generated by optimization pressures.

  ---

  **Instructor Note:** Use the "Unoccupied Combinations" table to prompt discussion on why certain logical possibilities are physically or metaphysically empty. Use the "Indistinguishable Pairs" section to drive the seminar toward the Hard Problem of Other Minds and the limits of behavioral testing.
