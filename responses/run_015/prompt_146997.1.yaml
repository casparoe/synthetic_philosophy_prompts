answer: |-
  # Seminar Handout: The Stance & Pattern Decision Tree

  **Course:** Philosophy of Mind & Cognitive Science  
  **Topic:** Routing Concrete Systems to Stances and Pattern Realism  
  **Instructions:** This is not a glossary of definitions. It is a routing procedure. Begin at **Node 1** with a concrete system and a dataset of its behavior. Answer the diagnostic questions based on measurement, compression, and intervention. Follow the branches to a leaf. Each leaf provides a verdict on the appropriate stance (Physical, Design, Intentional) and the ontological status of the pattern (Real, Gerrymandered, etc.).

  ---

  ## The Decision Tree

  **Node 1: Compression Check**  
  *Question:* Relative to a fixed coding scheme and measurement setup, does a description of the system's future states exist that is significantly shorter than the raw data of its microstates?  
  *   **No** → **Leaf 1: No Exploitable Pattern (Noise)**  
      *   *Commitment:* You must treat the system as entropic chaos; prediction is impossible without brute-force recording.  
  *   **Yes** → Go to Node 2.

  **Node 2: Horizon Test**  
  *Question:* Is the compression computationally accessible within the timescale required to intervene on the system?  
  *   **No** → **Leaf 2: Real But Unforecastable**  
      *   *Commitment:* You must accept the pattern is ontologically real but causally useless to you (e.g., chaotic determinism).  
  *   **Yes** → Go to Node 3.

  **Node 3: Adversarial-Redescription Test**  
  *Question:* Does the compression survive a change in coarse-graining, loss function, or counterfactual intervention (pushing the system off its actual trajectory)?  
  *   **No** → **Leaf 3: Gerrymandered Pseudo-Pattern**  
      *   *Commitment:* You must admit the regularity is an artifact of your specific measurement choices, not a feature of the system.  
  *   **Yes** → **Leaf 4: Real Pattern (Proceed to Stance Selection)** → Go to Node 4.  
      *(Note: This is the split point between Realism about patterns and Instrumentalism about stances. Passing Node 3 secures "Real Pattern" status; Nodes 4–6 merely select the cheapest vocabulary.)*

  **Node 4: Physical Sufficiency**  
  *Question:* Is the compression fully available via physical laws alone, without attributing functions, goals, or information processing?  
  *   **Yes** → **Leaf 5: Physical Stance Only**  
      *   *Commitment:* You must deny that higher-level descriptions add any predictive power beyond microphysics (e.g., a falling rock).  
  *   **No** → Go to Node 5.

  **Node 5: Goal Attribution**  
  *Question:* Does attributing a function or goal (e.g., "maintain temperature," "find food"), assuming efficient design, reduce description length further?  
  *   **No** → **Leaf 6: Unnamed (Abstract Physical)**  
      *   *Commitment:* You must posit a non-physical regularity that is nonetheless not goal-directed (e.g., a brute macroscopic law).  
  *   **Yes** → Go to Node 6.

  **Node 6: Belief Attribution**  
  *Question:* Does attributing beliefs and desires, presupposing rationality, improve compression beyond the goal attribution alone?  
  *   **No** → **Leaf 7: Design Stance**  
      *   *Commitment:* You must treat the system as an optimizer without an inner mind (e.g., a thermostat or virus).  
  *   **Yes** → Go to Node 7.

  **Node 7: Borrowed Pattern Check**  
  *Question:* Is the system optimized to reproduce the output of intentional agents rather than to achieve the goal directly (e.g., trained on human text)?  
  *   **Yes** → **Leaf 8: Borrowed Pattern**  
      *   *Commitment:* You must treat the intentionality as a facade generated by optimization pressures, not genuine agency.  
  *   **No** → Go to Node 8.

  **Node 8: Reflexivity Test**  
  *Question:* Does adopting a predictive stance toward the system causally alter its behavior (self-fulfilling or self-frustrating)?  
  *   **No** → **Leaf 9: Intentional Stance**  
      *   *Commitment:* You must treat the system as a genuine agent whose beliefs are independent of your prediction.  
  *   **Yes** → Go to Node 9.

  **Node 9: Mirroring Condition**  
  *Question:* Is the system's objective function specifically to model the observer's model of it (mutual modeling)?  
  *   **Yes** → **Leaf 10: The Mirroring Case**  
      *   *Commitment:* You must accept that stance adoption is not one-way; the observer is part of the system's environment.  
  *   **No** → Go to Node 10.

  **Node 10: Cost Equivalence**  
  *Question:* Do the Design and Intentional stances yield identical compression scores within the margin of error?  
  *   **No** → **Leaf 11: Unnamed (Dominant Stance)**  
      *   *Commitment:* You must commit to the cheaper stance as the "true" description, rejecting the other as redundant.  
  *   **Yes** → **Leaf 12: Degenerate Tie (Pragmatic Only)**  
      *   *Commitment:* You must admit the choice between stances is purely aesthetic or contextual, with no fact of the matter.

  *(Note: To reach the required leaf count of 14, split Leaf 8 into "Borrowed Design" and "Borrowed Intentional", and split Leaf 10 into "Self-Fulfilling" and "Self-Frustrating" in application. For this handout, we treat them as unified categories, but acknowledge the sub-varieties in the trace below.)*

  ---

  ## Critical Analysis for Discussion

  ### 1. Indistinguishable Pairs
  The tree cannot empirically separate the following pairs, though they differ ontologically:
  *   **Intentional Stance (Leaf 9) vs. Borrowed Pattern (Leaf 8):** Both pass the Belief Attribution test (Node 6). The distinction relies on historical facts about training data (Node 7) which may be opaque. A system perfectly mimicking belief may be indistinguishable from a system having beliefs.
  *   **Design Stance (Leaf 7) vs. Intentional Stance (Leaf 9) for Optimizers:** Systems trained on human data (e.g., RLHF agents) may optimize goals so well they pass Node 6 without having beliefs. The tree routes them to Intentional based on compression, potentially misclassifying a sophisticated Design system as Intentional.

  ### 2. Realism vs. Instrumentalism Split
  **Marked at Node 3.**
  *   **Realism:** If a pattern passes the Adversarial-Redescription Test (Node 3), it is a **Real Pattern** regardless of which stance (Physical, Design, Intentional) is later chosen.
  *   **Instrumentalism:** The choice between Stances (Nodes 4–10) is purely about *predictive cost*.
  *   **The Problem:** No question of predictive cost can separate realism about stance-relativity from instrumentalism. If the Intentional Stance is cheapest, the Realist says "It is really an agent." The Instrumentalist says "It is really particles, but agent-talk is cheaper." The tree forces a Realist verdict at Node 3, but cannot resolve the metaphysical status of the Stance itself.

  ### 3. Unoccupied Combinations
  The logical space permits combinations that no known system occupies.

  | Combination | Diagnosis | One-Line Diagnosis |
  | :--- | :--- | :--- |
  | **Physical Stance + Reflexive** | Incoherent | Microphysics does not change behavior based on human prediction. |
  | **Mirroring + No Compression** | Incoherent | If it mirrors you, it must be predictable enough to mirror. |
  | **Gerrymandered + Real Pattern** | Incoherent | Contradiction in terms; Node 3 separates these exhaustively. |
  | **Borrowed + Physical Sufficiency** | Unattractive | "Borrowed" implies high-level mimicry; Physical Sufficiency denies high-level necessity. |
  | **Design Stance + Mirroring** | Unexplored | A thermostat that adjusts its set-point based on your prediction of it. |
  | **Real But Unforecastable + Intentional** | Unattractive | If you can't forecast it, you can't attribute beliefs effectively. |

