answer: |-
  The practice presupposes that truth possesses a structural compressibility allowing it to be verified within a bounded dialectical budget, an assumption that fails if obfuscation is computationally cheaper than refutation.

  ### Brainstorming: Systematic Judge Errors

  To defend this thesis, I first enumerate six ways a weaker judge fails, sorting them by epistemic severity.

  | Failure Mode | Description | Classification |
  | :--- | :--- | :--- |
  | **Horizon Breach** | Argument relies on facts beyond the judge's knowledge base. | **Fatal** |
  | **Rhetorical Masking** | Style mimics validity (confidence, length) without substance. | **Fatal** |
  | **Refutation Asymmetry** | Lies require fewer tokens to state than truths to debunk. | **Fatal** |
  | **Debater Collusion** | Opponents implicitly agree to confuse the judge rather than fight. | **Fatal** |
  | **Context Overflow** | Argument length exceeds the judge's token window. | Engineering |
  | **Sycophancy** | Judge rewards agreement with its own hidden biases. | Engineering |

  The **Fatal** errors undermine the claim that the procedure tracks truth; the **Engineering** errors are solvable with better architecture or tuning. I considered and rejected two reconstructions of the lab's theory. First, **Pure Coherentism**: the idea that internal consistency guarantees truth. I reject this because consistent falsehoods are easily constructed. Second, **Pure Testimony**: the idea that we trust the judge because it trusts the model. I reject this as circular; the judge must have independent grounds. I commit to **Verificationist Reliabilism**: the procedure works only if truth leaves a simpler trace than falsehood within the budget.

  ### The Implicit Epistemology

  The pipeline does not presuppose the Millian claim that truth wins by collision. Mill assumed human rationality; here, the judge is explicitly weaker. Instead, the practice relies on **Verificationist Reliabilism**. It assumes that while the judge cannot *generate* the truth, it can *recognize* it if presented with a specific kind of evidence: a chain of reasoning that bottoms out within its verification horizon.

  This rules out **Holistic Coherentism**, where justification comes from the web of beliefs rather than foundational checks. If the judge cannot check the foundations, the web spins freely. It also rules out **Pure Reliabilism** without structure—the labs do not merely hope the judge is right; they build adversarial structures to force errors into the light. The theory is that adversarial pressure compresses the argument into a shape the judge can verify. If the argument cannot be compressed without losing soundness, the system fails.

  ### The Puzzle of Single-Grader vs. Debate

  You asked if single-sample grading and adversarial debate presuppose opposite things. They do not. Both rely on the same underlying theory: **Heuristic Alignment**. In single grading, the lab assumes the judge's heuristics (style, structure) correlate with truth. In debate, they assume adversarial pressure will strip away misleading heuristics, leaving only verifiable claims.

  The contradiction is not theoretical but empirical. If a judge is easily fooled by obfuscation in single grading, adversarial debate only helps if the opponent can *afford* to expose the obfuscation within the dialectical budget. If refutation asymmetry holds (lies are cheap, truths expensive), debate fails just as single grading does. The lab treats debate as a fix, but it is merely a force multiplier for the same fragile judge. If the judge's horizon is the limit, two speakers cannot push past it; they can only fill the space before it more densely.

  ### The Certificate Crutch

  Your second observation is sharper: labs train against certificates where possible and reserve debate for domains without them. This admits that **verifiability is doing all the real work**. Debate is not a new epistemology; it is a stopgap for non-verifiable domains, implicitly admitting weakness.

  In mathematics, the certificate (the proof) pushes the verification horizon to the final answer. In debate, the "certificate" is the opponent's failure to find a flaw. This is a negative certificate. It presupposes that the absence of a detected flaw is evidence of truth. This holds only if the search space is fully covered by the dialectical budget. If obfuscation hides flaws below the horizon, the negative certificate is worthless. The practice thus presupposes that debate pushes the horizon out enough to catch most errors, not that it eliminates the horizon entirely.

  ### Failure Modes and Repairs

  If obfuscation is systematically cheaper than exposure, the current pipeline is epistemically bankrupt. A pipeline honest about this would not rely on debate alone. It would require **Recursive Oversight**, where a stronger model checks the steps of the weaker one, or **Cryptographic Auditing**, where claims are backed by zero-knowledge proofs of computation.

  Would random step auditing repair it? Only if the audited step is itself checkable. If the step relies on knowledge outside the judge's horizon, auditing moves the problem but does not solve it. The only repair is to expand the verification horizon, either by giving the judge tools (code interpreters, search) or by breaking the task into sub-questions that *do* have certificates. If the domain lacks certificates entirely, the pipeline cannot guarantee truth, only consensus.

  ### The Load-Bearing Assumption

  The single load-bearing assumption is **Refutation Asymmetry favors Truth**. The system assumes it is easier to prove a statement false than to hide its falsity within the budget. If lying is cheaper than debunking, the adversary will run out of budget before exposing the error, and the judge will declare a false winner.

  The one question you should put to a lab running this pipeline is: **"What is your empirical measure of the cost ratio between constructing a plausible obfuscation and debunking it within your specific dialectical budget?"** Until they answer this, they are not engineering oversight; they are gambling on the structure of truth.
