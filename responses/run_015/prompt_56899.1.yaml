answer: |-
  **UNIVERSITY EXAMINATION PAPER**
  **MODULE: PHILOSOPHY OF BIOLOGY**
  **SECTION B: ESSAY QUESTION (45 Minutes, 25 Marks)**

  **Question 1**

  Read the following case description carefully.

  > A soil bacterium bears a surface coat assembled from a single protein; call the coat the *mantle*. The phylogenetic record shows the mantle arose and swept to fixation when a virulent bacteriophage was endemic; resistance to that phage explains the trait's presence. That phage has been absent from the habitat ever since. The habitat is now subject to severe seasonal desiccation; the mantle is the principal means by which cells survive the dry season. Two populations are available. **Population W** was isolated recently from the wild; its history is exactly as described. **Population L** was derived from W three hundred generations ago and has since been selected every generation for desiccation tolerance; the mantle gene in L is identical in sequence to that in W. In both populations, the mantle additionally stiffens the cell envelope, serves as a nitrogen source for kin upon lysis, binds trace zinc, and increases settling rate. Finally, a single-base deletion truncates the mantle protein: **Mutants** in both populations assemble a partial coat that retains stiffness, nitrogen value, zinc binding, and settling, but fails at desiccation tolerance. Under wet conditions, mutants are indistinguishable in fitness from normal cells; under drying, both die.

  Answer all four parts below.

  **(a)** Apply the criteria of the Causal-Role (CR) account and the Etiological (SE) account to determine which effects of the mantle count as *functions* in Population W and which in Population L. Be specific about where the accounts diverge. (6 marks)

  **(b)** Explain why the two accounts yield different verdicts for Population W despite the organisms being molecule-for-molecule identical to Population L. What distinct feature of 'function' is each account tracking? (4 marks)

  **(c)** A Causal-Role theorist attempts to accommodate malfunction by anchoring the relevant capacity in "what mantles of this type typically do in the species." Demonstrate why this repair either collapses into the Etiological account or fails to classify the Mutant as malfunctioning in the wet lab environment. (10 marks)

  **(d)** Does this case license a pluralist view that both accounts are correct in different contexts, or does it force a choice between them? Defend your position. (5 marks)

  ***

  **MODEL ANSWER**

  **(a)** Under the Causal-Role (CR) account, a function is any capacity contributing to a containing system's capacity. In both W and L, the mantle contributes to desiccation survival, osmotic stiffness, nitrogen recycling, zinc binding, and settling. Thus, CR attributes all five as functions in both populations. Under the Etiological (SE) account, a function is an effect for which the trait was selected. In W, the mantle was selected for phage resistance. Since phage are absent, the proper function is phage resistance (currently unexercised), while desiccation tolerance is merely a beneficial effect. In L, the lineage underwent 300 generations of selection for desiccation. Thus, in L, desiccation tolerance is the proper function. SE diverges from CR in W (identifying phage resistance, not desiccation) and diverges from CR in L regarding the side effects (stiffness, etc., are not selected, thus not SE functions).

  **(b)** The divergence arises because CR tracks current systemic contribution, while SE tracks historical selection pressure. W and L are physiologically identical, so their current causal contributions are identical; CR must therefore assign identical functions. However, their evolutionary histories differ. W possesses the trait due to past phage pressure; L possesses it due to recent desiccation pressure. SE treats function as a historical property, akin to ancestry. Therefore, SE distinguishes W and L based on lineage, whereas CR distinguishes neither, treating them as identical machines.

  **(c)** The CR theorist faces a problem: if function is merely current contribution, the Mutant in the wet lab has no malfunction. It contributes stiffness and zinc binding perfectly. It fails only at desiccation, which is irrelevant in the wet lab. To call this 'malfunction,' the theorist appeals to what mantles *typically* do. If "typically" refers to the current statistical average of the population, the repair fails. In the wet lab, desiccation tolerance contributes nothing to fitness; a trait that fails to contribute to fitness in its current environment has no CR function to malfunction *at*. The Mutant is merely different, not broken.

  If the theorist argues "typically" refers to the species' standard design regardless of current environment, they must define "standard." If "standard" means "what the majority of tokens currently do," the Mutant is a statistical outlier, but statistical rarity is not malfunction (left-handedness is rare but not malfunctioning). To ground normativity, the theorist must appeal to what the mantle is *supposed* to do. This requires a normative standard independent of current contribution. The only available standard is the history of selection that established the trait's design. Once the CR theorist anchors "typical capacity" in the historical selection pressure that fixed the trait (phage for W, desiccation for L), they have abandoned pure causal role analysis. They are now citing etiology to ground the norm. The repair collapses into SE. Without this collapse, CR cannot distinguish a broken mantle from a variant mantle in a context where the specific capacity is idle.

  **(d)** This case forces a choice if the goal is to explain biological normativity and malfunction. Pluralism suggests both accounts are valid. However, CR cannot account for the intuition that the Mutant is defective in the wet lab, only that it lacks a specific capacity. SE explains the defectivity: the Mutant fails the effect for which it was historically maintained. If philosophy of biology aims to explain why organisms are subject to evaluation as 'working' or 'broken' independent of immediate utility, SE is necessary. CR describes physiological utility, but SE explains biological design. Therefore, while CR is useful for physiology, SE is required for evolutionary explanation. We should not be pluralists about *proper* function; SE is the correct account for biological normativity.

  ***

  **MARKING SCHEME (25 Marks)**

  | Part | Move | Marks | Characteristic Fumble |
  | :--- | :--- | :--- | :--- |
  | **(a)** | Correctly identifies CR attributes all current capacities (desiccation + side effects) in both W & L. | 2 | Treats CR as interest-relative to the *observer* rather than the *system capacity*, missing side effects. |
  | | Correctly identifies SE attributes Phage Resistance in W and Desiccation in L. | 2 | Assumes SE tracks current utility, claiming Desiccation is SE function in W. |
  | | Notes SE excludes side effects (stiffness, etc.) as they were not selected. | 2 | Claims side effects are SE functions because they are beneficial. |
  | **(b)** | Identifies CR tracks current contribution/physiology (synchronic). | 2 | Describes CR as "looking at the present" without mentioning systemic contribution. |
  | | Identifies SE tracks history/lineage (diachronic). | 2 | Describes SE as "looking at the past" without mentioning selection history. |
  | **(c)** | **Crux:** Argues that in the wet lab, desiccation capacity contributes nothing, so CR sees no function to malfunction. | 3 | Assumes the Mutant is malfunctioning in the wet lab under CR because it "can't dry." |
  | | Argues that defining "typical" statistically fails to ground normativity (rare ≠ broken). | 3 | Treats statistical rarity as sufficient for malfunction. |
  | | Demonstrates that grounding "typical" in design requires history, collapsing CR into SE. | 4 | Suggests the repair works without noticing it imports etiological criteria. |
  | **(d)** | Takes a definite stance (For or Against Pluralism). | 1 | Hedges or refuses to choose ("both have merits"). |
  | | Justifies stance based on the specific inability of CR to handle malfunction/normativity in this case. | 4 | Justifies stance via general preference rather than case details. |

  ***

  **NOTE TO MARKERS**

  **Distinguishing First-Class from Second-Class Scripts**
  A competent Second-Class script will correctly apply the definitions in Part (a) and note the history/present distinction in Part (b). It will likely pass Part (c) by stating the repair collapses but will fail to explain *why* CR cannot generate normativity without history (specifically missing the point that in the wet lab, the capacity contributes nothing, so there is no functional role to fail). A First-Class script will seize on the wet-lab scenario in Part (c) to demonstrate that without etiology, 'malfunction' disappears entirely, leaving only 'difference.' Furthermore, the First-Class script will use this failure to drive the verdict in Part (d), arguing that if malfunction is the phenomenon to be saved, pluralism is untenable because CR is strictly descriptive. Look for the insight that CR describes *capacity*, while SE explains *design*.
