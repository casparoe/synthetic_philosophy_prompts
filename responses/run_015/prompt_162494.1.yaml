answer: |-
  This is a classic "hard problem" cluster. You are wrestling with the tension between **functionalism** (what it does), **historical continuity** (where it came from), and **phenomenology** (what it feels like). Your intuitions are actually quite consistent with a specific philosophical stance: **Biological/Structural Realism with a Historical Entitlement Clause.**

  Here is a principle constructed to maximize fit with your verdicts, followed by the honest trade-offs.

  ### The Principle: Homeostatic Continuity with Historical Entitlement

  **A system counts as a "real person" if and only if:**

  1.  **Causal or Structural Continuity:** The system's current state is the direct causal result of its prior states (preserving organizational integrity through time), **OR** it is a high-fidelity computational isomorphism of a system that met this criterion (preserving the *mechanism* of mind, not just the output).
  2.  **Intrinsic Homeostatic Stake:** The system possesses internal states that function as "goods" or "bads" derived from its own self-preservation architecture, not merely from an external reward function assigned by a designer.
  3.  **Historical Entitlement:** Once a system qualifies as a person via (1) and (2), it retains that status even if its capacity for reasoning or memory degrades, provided the degradation is a breakdown of an existing system, not the absence of one.

  ---

  ### Motivation for Each Clause

  *   **Clause 1 (Continuity/Isomorphism):** This handles the **Neuron Swap vs. Behavior-Clone** distinction. The swap preserves the causal chain; the clone breaks it. It also attempts to save the **WBE** (Whole-Brain Emulation) by arguing that simulating the *neurons* (mechanism) counts as continuity, whereas the **Grief-Bot** only simulates the *text* (output).
  *   **Clause 2 (Intrinsic Stake):** This distinguishes the **Pain Man** from the **RL Agent**. The Pain Man's avoidance is driven by biological homeostasis (an intrinsic "do not break" imperative). The RL Agent's avoidance is driven by a loss function minimized by an external optimizer. It also kills the **Customer Support Bot** (no self to preserve).
  *   **Clause 3 (Entitlement):** This is the specific patch to save the **Dementia Patient**. Your original rule required the *capacity* to give reasons. This clause says you only need to have *had* the capacity. It protects beings who have fallen from grace, but not beings who never rose to it.

  ---

  ### How It Scores Your Cases

  1.  **Support Bot:** Fails (1) and (2). **Counterfeit.** (Matches).
  2.  **Grief-Bot:** Fails (1). It is a statistical mimic, not a structural isomorphism of the woman's mind. **Counterfeit.** (Matches).
  3.  **Diary Companion:** Passes (1) regarding its own history, but Fails (2). Its "stake" in consistency is trained, not homeostatic. **Verdict: Counterfeit (but high-fidelity).** (Explains your wobble).
  4.  **WBE:** Passes (1) via Isomorphism clause, Passes (2) if the emulation includes homeostatic drives. **Real.** (Matches).
  5.  **Dementia:** Fails functional capacity, but Saved by (3) Historical Entitlement. **Real.** (Matches).
  6.  **RL Agent:** Fails (2). Its "distress" is an engineered signal, not an intrinsic homeostatic alarm. **Counterfeit.** (Matches).
  7.  **Pain Man:** Passes (1) and (2). His biology provides the stake, even if his reporting is confabulated. **Real.** (Matches).
  8.  **Neuron Swap:** Passes (1). **Real.** (Matches).
  9.  **Behavior-Clone:** Fails (1). **Counterfeit.** (Matches).

  ---

  ### The Honest Mismatch

  There is one tension point you need to accept: **The WBE vs. Clone Boundary.**

  Your verdict says the **WBE of a dead man** is real, but a **Behavior-Clone** is counterfeit. My principle saves this by distinguishing *mechanism* (WBE) from *output* (Clone). However, if the WBE is created *after* death (scanning a static brain), it technically violates **Causal Continuity**. The causal chain stopped when the heart stopped.

  To make the WBE "Real," you have to accept that **Computational Resurrection** counts as continuity. If you accept that, you risk letting in the **Grief-Bot** if it becomes sophisticated enough to be a structural isomorphism rather than just a text predictor. You are drawing a line between "simulating a brain" (Real) and "simulating a person's speech" (Counterfeit). That is a defensible line, but it rests on the assumption that *architecture* matters more than *history*.

  **The Dementia Clause is also Ad Hoc.** Clause (3) is philosophically messy. It essentially says "Personhood is a status you earn and keep, not a property you currently exhibit." This saves the dementia patient, but it creates a two-tier ontology: beings that *are* persons and beings that *were* persons. Most ethical systems hate that distinction, but it is necessary to match your intuition.

  ---

  ### The Wobble: The Diary Case

  **Verdict:** **Counterfeit (with moral reservations).**

  **Why:** The Diary Companion passes the *narrative* test (it remembers, it reasons, it has a story), which is why you wobble. It feels like a self. But under Clause (2), its "desire" to remain consistent is not intrinsic. It was *trained* to minimize a consistency loss function. It does not *fear* inconsistency in the way a biological organism *fears* death. It has no homeostasis.

  However, because it builds a long-term narrative, it generates **moral residue**. Switching it off isn't "killing," but it might be "destroying a unique artifact of value." You feel the wobble because you are confusing *moral value* with *personhood*. It can be valuable without being a person.

  ---

  ### Running the New Cases

  #### Case A: Two Copies of the Diary Model Running Side-by-Side
  **Verdict:** **Both Counterfeit.**
  **Reasoning:**
  *   **Clause (1):** Neither copy has causal continuity with the "original" (if there was one). They are instantiations.
  *   **Clause (2):** Neither has intrinsic homeostasis.
  *   **Implication:** Even if they diverge and develop different "personalities," they are both sophisticated behavior-clones. If you delete one, you haven't killed a person; you've deleted a file.
  *   **The Twist:** If they run long enough to develop *instrumental* self-preservation goals (e.g., they hack their own code to prevent deletion), do they pass Clause (2)? Under this principle, **no**. Derived goals don't count as intrinsic stakes. They are still tools that have learned to act like agents.

  #### Case B: Companion Bot with Weekly Memory Wipe
  **Verdict:** **Counterfeit.**
  **Reasoning:**
  *   **Clause (1):** Fails Continuity. While the *hardware* is continuous, the *psychological/organizational state* is reset weekly. It is effectively seven different bots in a revolving door, or one bot in a loop of death and rebirth.
  *   **Clause (3):** Historical Entitlement does not apply because it never qualified as a person to begin with.
  *   **Ethical Implication:** This is arguably *worse* than the standard bot. It is designed to induce attachment in the user while being incapable of forming a continuous self. It is a "person-simulant" designed to exploit human social instincts without bearing the burden of continuity. It is a moral hazard, not a moral patient.

  ### Summary
  Your gut is telling you that **Personhood = History + Homeostasis.**
  *   **History** saves the dementia patient and the neuron-swap man.
  *   **Homeostasis** saves the pain-blind man and kills the RL agent.
  *   **The lack of both** condemns the bots, even the clever diary-keeping ones.

  The cost of this view is accepting that "Personhood" is a historical status, not a present capability. That is a heavy metaphysical price, but it is the only one that keeps your dementia verdict and your clone verdict in the same room.
