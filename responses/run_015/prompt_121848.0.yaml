      *   *Core Text:* "Consciousness Explained," "From Bacteria to Bach and Back," "The Myth of Computer Consciousness."
      *   *Key Concept:* Heterophenomenology. We treat subjects *as if* they are conscious based on reports, but ontological status depends on *how* the trick is done.
      *   *The "Chinese Room" parallel (but distinct):* Dennett agrees with Searle that syntax isn't semantics, but disagrees on the solution. For Dennett, semantics arises from function *embedded in history*.
      *   *The "Counterfeit" Worry:* A system could pass the Turing Test (behaviorally indistinguishable) but lack the *competence without comprehension* evolutionary trajectory. It lacks the *real* interests, the *real* vulnerability, the *real* history of selection that grounds meaning.
      *   *Moral Status:* Tied to being a "Subject of Experience" in a robust sense, which requires being an agent with *skin in the game* (survival, reproduction, self-preservation).
      *   *Qualia:* Dennett denies intrinsic qualia. Qualia are judgments/Dispositions. *However*, he insists the *mechanism* producing those judgments matters. A philosophical zombie is impossible *if* it behaves exactly like us, *but* an AI that simulates the behavior without the underlying functional architecture (evolutionary history, embodied needs) is a "philosophical zombie" in a practical sense.
      *   *Nuance:* Dennett is often misread as a pure behaviorist. He is a *functionalist*, but a *historical/evolutionary functionalist*. The *process* matters, not just the input-output.

  3.  **Translate to User's Vocabulary (PP/Active Inference/Ecological):**
      *   *Heterophenomenology:* Treating first-person reports as data generated by a system's generative model. The "phenomenal world" is the user illusion generated by the model.
      *   *Denial of Intrinsic Qualia:* Qualia = Precision-weighted prediction errors or specific attractor states in the state space. No "extra stuff."
      *   *Organizational/Evolutionary History:* The priors must be *learned* through active inference in a physical niche, not pre-loaded. The "Deep Priors" must be shaped by survival constraints (minimizing variational free energy relative to biological existence).
