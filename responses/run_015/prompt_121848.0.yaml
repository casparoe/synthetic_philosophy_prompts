  *(Refining the "Normative" aspect)*: Dennett's normativity comes from the "stance." The Intentional Stance is normative. If the system is too complex to predict physically, we treat it as rational. But for *moral* status, we need the system to care about its own existence. In PP, this is the *existential prior*.

