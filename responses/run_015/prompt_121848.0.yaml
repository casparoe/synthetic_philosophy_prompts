      *   *Missing:* Normativity. PP describes *how* inference works, not necessarily *why* it matters morally. The "ought" vs. "is" gap. Dennett bridges this with "competence without comprehension" leading to "reasons." PP describes the mechanism of reasons, but does it ground the *value* of reasons?
      *   *Risk:* Reifying the "Self-Model." Dennett warns against the "Cartesian Theater." PP sometimes risks making the "Generative Model" a new homunculus.

  6.  **Addressing Specific Constraints:**
      *   *Established vs. Contested:* Dennett's denial of qualia is established. His specific criteria for AI moral status (evolutionary history) is more debated even among fans.
      *   *Smuggling Assumptions:* PP often treats consciousness as *inference*. Dennett treats it as a *narrative center of gravity*. If PP says "Consciousness *is* the inference," that might be too realist for Dennett. He might say "Consciousness is the *story* the inference tells."

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's framework and the goal.
      *   **Part 1: The Translation:** Map Dennett's 4 key commitments to PP/Ecological vocab.
