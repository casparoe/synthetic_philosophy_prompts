      *   *Refinement:* The "Counterfeit" AI minimizes a loss function that *simulates* survival but isn't *actually* survival. It has no "skin in the game."

  5.  **Developing the Residue Report:**
      *   *Clean Translations:* Heterophenomenology -> Treating reports as model outputs. Qualia -> Precision weighting.
