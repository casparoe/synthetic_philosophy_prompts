answer: |-
  The practice you describe—disqualifying critics or adjudicators based on their own analogous misconduct—presupposes a **Communicative Theory of Blame** grounded in a specific conception of **Moral Standing**. To reconstruct this theory and evaluate its coherence against legal norms, we must distinguish between the *truth* of a normative claim and the *authority* of the agent asserting it.

  ### 1. The Presupposed Theory: Standing as Integrity
  The institutional practice in legislatures and ethics boards rests on the premise that blame and adjudication are not merely constative acts (stating facts about a violation) but **illocutionary acts** (exerting normative pressure).

  In this view, to blame someone is to demand accountability from them on behalf of a shared norm. This transaction requires the blamer to possess **moral standing**. Standing is not inherent; it is earned through one's relationship to the norm in question. The implicit theory holds that **normative authority is relational**: one can only demand compliance from others if one acknowledges the binding nature of that compliance upon oneself.

  Therefore, the practice presupposes a **Coherence Condition of Agency**: *The validity of a moral demand is contingent upon the blamer's own subjection to that demand.* When a critic is hypocritical, they do not necessarily falsify the accusation (the target may indeed be corrupt), but they sever the normative link that gives them the right to enforce the rule. They treat the norm as a weapon rather than a bond.

  ### 2. Vitiation vs. Pragmatics
  Must defenders of this practice hold that hypocrisy *vitiates* blame, or can they retreat to pragmatics?

  *   **The Pragmatic Retreat:** One could argue that hypocritical blame is *valid* but *ineffective*. On this view, allowing a hypocrite to blame is permissible but ill-advised because it invites *tu quoque* distractions, erodes public trust, and reduces the likelihood of compliance.
  *   **The Vitiation Claim:** However, the practice of *mandatory recusal* in ethics committees suggests the stronger claim is required. If the worry were merely pragmatic (credibility), a hypocritical member could remain if they promised to be quiet or if the committee believed they could still judge fairly. Recusal implies that their participation itself constitutes a procedural injustice.

  Therefore, the strict institutional practice requires the **Vitiation Claim**: Hypocrisy does not just weaken the blame; it nullifies the blamer's *standing* to issue it. The hypocrite is not just an unreliable messenger; they are an unauthorized one. To allow them to judge is to commit a category error, akin to allowing a non-citizen to vote in a sovereign election. The pragmatics (loss of credibility) are a *consequence* of the loss of standing, not the justification for it.

  ### 3. Consistency with the Legal System
  Is this consistent with the legal system's rejection of "unclean hands" regarding the validity of charges?

  **It is fundamentally inconsistent,** revealing a divergence in how "blame" is conceptualized in law versus politics/ethics.

  *   **Legal Impersonality:** In criminal law, the blamer is not the prosecutor but the **State** (e.g., *The People v. Smith*). The prosecutor is merely an instrument. The State's standing to blame derives from the social contract and the monopoly on violence, not the moral virtue of its agents. A corrupt prosecutor can validly charge a murderer because the *law* is the accuser, not the person.
  *   **Political/Ethical Personality:** In ethics boards and parliamentary censure, the blamer is often the **peer group** or the **community**. There is no abstract "State" entity separate from the members. The authority to judge is immanent in the group's collective integrity.

  The political/ethical practice **smuggles in a coherence condition** that jurisprudence explicitly denies: that the *agent* of blame must embody the norm. Law prioritizes the **Objective Validity of the Norm** (the act is wrong regardless of who says so). Ethics boards prioritize the **Integrity of the Normative Community** (we cannot enforce rules we collectively flout).

  This is not a logical contradiction in society, but a **functional dualism**. Law handles *acts* (compliance); Ethics/Politics handle *relationships* (trust). However, if an ethics board claims to be "quasi-judicial," it creates tension by importing a moral standing requirement into a procedure that mimics legal impartiality.

  ### 4. Reconstruction of the Implicit Theory
  We can distinguish what the practice strictly requires from what merely accompanies it:

  **A. Strict Requirements (The Core Theory):**
  1.  **Normative Symmetry:** The blamer and the blamed must be subject to the same normative constraints.
  2.  **Forfeiture of Standing:** Violation of a norm by the blamer temporarily forfeits their authority to enforce that specific norm against others.
  3.  **Procedural Bar:** This forfeiture is not just rhetorical; it constitutes a disqualification from adjudicative roles (recusal).

  **B. Accompaniments (Secondary Effects):**
  1.  **Credibility Loss:** The public is less likely to believe the accusation.
  2.  **Distraction:** Debate shifts from the merits of the case to the character of the accuser.
  3.  **Cynicism:** Erosion of faith in the institution.

  Defenders often conflate B with A. They argue for recusal (A) using the language of distraction (B). However, if B were the only concern, recusal would be discretionary based on the likelihood of public outcry. Since recusal is often mandatory, A is the operative principle.

  ### 5. The Hypothetical Society: Coherence or Difference?
  Consider a society that keeps legal impartiality (prosecutor's sins don't matter) but **abolishes the hypocrisy objection in politics and ethics review**. In this society, a corrupt senator can censure another for corruption, and a cheating professor can sit on a committee reviewing academic dishonesty.

  **Is this conceptually incoherent?**
  **No.** It is conceptually coherent but **politically distinct**.

  *   **Conceptual Coherence:** This society would simply adopt the **Legal-Objectivist Model** of blame for all spheres. It would treat ethical norms like physical laws: a violation is a fact to be detected, not a relationship to be repaired. The "truth" of the violation is independent of the "virtue" of the detector. A security camera does not need to be "moral" to record a theft; similarly, a hypocritical accuser does not need to be "clean" to identify a breach.
  *   **Political Difference:** This shift would transform the nature of the political/ethical community.
      1.  **From Community to Surveillance:** It moves from a model of *shared virtue* (we hold each other accountable because we are all trying to be good) to *mutual surveillance* (we hold each other accountable because rules exist).
      2.  **Increased Efficiency, Decreased Trust:** It might increase the rate of successful adjudication (bad actors can still catch bad actors), but it would likely degrade civic friendship. Blame becomes purely instrumental rather than communicative.
      3.  **The End of "Example":** It severs the link between leadership and exemplification. Leaders could enforce rules they openly violate without procedural penalty, provided the violation is factually established.

  **Conclusion:**
  The current practice presupposes that **blame is a moral address requiring standing**, not just a factual assertion. While this conflicts with the legal system's **impersonal theory of prosecution**, the conflict is functional, not logical. A society that abolished the hypocrisy objection in politics would not be incoherent; it would simply have decided that **compliance is more valuable than integrity**. It would treat ethics as a matter of *administration* rather than *community*. The cost would not be confusion, but a transformation of the political sphere from a space of shared normative commitment into a space of neutralized enforcement.
