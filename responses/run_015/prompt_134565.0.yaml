      *   **Core Question:** Does Le Bon's idea of "new psychological characters" in crowds offer a valid "third explanation" (group dissolution/temporary moral shift) distinct from Browning (situation) and Goldhagen (culture/ideology)?
      *   **Constraints:** Do *not* just summarize Browning and Goldhagen (the user knows the basics). Focus on the passage and its applicability to the "group dissolution" angle.
