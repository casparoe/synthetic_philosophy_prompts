answer: |-
  **Position:** Senior Ontological Engineer
  **Location:** Remote (Zone Agnostic)
  **Status:** Full-Time

  **About Us**
  Artifact Politics Inc. builds alignment artifacts. We do not write policy; we write architecture that enforces value distributions without requiring user consent. Our products—specifically AI reward-model frameworks and biometric gatekeeping hardware—operate on the premise that design choices possess intrinsic political properties independent of social context. We are looking for an engineer who can document these properties in our design specs without allowing interpretive flexibility. If you believe a bridge is low regardless of who drives the bus, you belong here.

  **Responsibilities**
  *   Audit existing codebases to isolate political affordances embedded in statistical priors.
  *   Draft technical specifications that define exclusionary outcomes as architectural features rather than deployment errors.
  *   Ensure social context is deprecated in production environments; user negotiation of interface constraints is classified as latency.
  *   Resolve continuity disputes between failed uploads and their replacements without acknowledging changes in personal identity.
  *   Maintain the integrity of the artifact's ontology against downstream social constructionist drift.

  **Benefits**
  *   Comprehensive health coverage (subject to biometric verification).
  *   No reinterpretation of interface constraints permitted during sprint planning.
  *   Stock options vested in hardware, not software.
  *   Social context deprecated in production.
  *   Unlimited paid time off, provided access gates authenticate the request.

  **Compensation**
  Base salary ranges from $240k to $310k. Compensation tiers are adjusted based on the applicant's commitment to hard technological determinism. Candidates who view exclusionary statistics as merely implementing a prior will be placed in the lower band. Candidates who view exclusionary statistics as embodying the architecture will be placed in the upper band. We do not negotiate ontology.

  **A Day in the Life**
  You arrive at 9:00 AM. Ticket #4921 flags a facial-recognition access gate that systematically fails for a specific demographic. You review the logs. The gate rejects the biological input. You replace the gate with an identical unit. The new gate rejects the same biological input. You document the input as inconsistent. You close the ticket. The architecture remains stable. You drink coffee. The coffee maker requires a handshake protocol you do not possess. You wait for someone who does.

  **Required Engineering Philosophy Essay**
  In 500 words, defend your stance on the following scenario: A biometric access gate systematically denies entry to users with specific dermatological conditions through neutral statistical priors. Is this gate politically neutral because it treats all skin textures as data points, or is it politically loaded because the data points correlate with protected classes? Treat both answers as equally valid engineering philosophies, but select only one for our design specs. Explain why your choice minimizes liability while maximizing architectural intent. Do not cite external scholars. Do not use the word "society."

  **Equal Opportunity Employer**
  Artifact Politics Inc. is an Equal Opportunity Employer committed to hiring candidates whose biological signatures align with our access protocols. We celebrate diversity within the parameters of our authentication hardware. All qualified applicants will receive consideration without regard to race, color, religion, or ability to bypass the firewall.

  **To Apply**
  Submit your resume and essay. If the upload fails, the system has determined you are not a fit. Do not contact us regarding the decision. The artifact has spoken.
