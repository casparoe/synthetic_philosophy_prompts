answer: |-
  Here is a principle that captures the causal intuitions driving your verdicts, followed by an analysis of where it forces you to adjust your position.

  ### The Principle: Causal Replicator Closure

  An entity $E$ is a **unit of selection** for a trait $T$ if and only if three conditions are met:

  1.  **Heredity:** $E$ is capable of replication with heredity (copies of $E$ resemble $E$).
  2.  **Causal Mediation:** Variation in $T$ causes variation in $E$'s replication rate *directly*, via properties of $E$ as a whole.
  3.  **Non-Reducibility:** This causal pathway cannot be exhaustively explained by the differential replication of $E$'s proper parts acting independently. (Put another way: $E$'s fitness must be capable of diverging from the aggregate fitness of its parts).

  ### How Your Cases Motivate the Clauses

  *   **Clause 1 (Heredity) is motivated by Case 7 (Plankton).**
      You are unsure if Case 7 counts as selection. This clause forces the question: Do plankton *lineages* replicate with heredity? If the body-plan is a species-level homolog (phylogenetic inertia) rather than an aggregate of individual traits, it passes. If it is merely the sum of individual mutations, it fails. This clause distinguishes true "Species Selection" from "Effect Macroevolution."
  *   **Clause 2 (Causal Mediation) is motivated by Case 1 (Segregation Distorter) and Case 3 (Transposons).**
      Your friend's bookkeeping view can mathematically partition the fitness variance to the organism level (the organism produces more offspring). But Clause 2 demands the causal story: the trait increases transmission *by subverting* the organism's reproduction. The causal path runs through the gene's machinery, not the organism's viability. This validates your "Gene-level" verdict against the friend's "Organism-level bookkeeping."
  *   **Clause 3 (Non-Reducibility/Conflict) is motivated by Case 4 (Colonial Beetles).**
      In Case 4, the restraint allele lowers individual fitness to raise group fitness. The group's replication rate (budding) diverges from the individual's replication rate (egg-laying). This confirms Group Selection. If the group's success were merely the sum of individual successes, this clause would fail, and it would be individual selection.

  ### The Verdict You Must Abandon

  You must abandon the exclusivity in **Case 5**.

  You judge Case 4 (random foundresses) as Group Selection and Case 5 (sister foundresses) as Kin Selection *instead* of Group Selection. Under the **Causal Replicator Closure** principle, **both are Group Selection.**

  *   **Why:** In both cases, the *nest* is the entity replicating (budding). In both cases, the trait affects the nest's survival rate directly (Clause 2). In both cases, the individual's fitness (egg-laying) diverges from the nest's fitness (survival) (Clause 3).
  *   **The Adjustment:** Relatedness (Kin Selection) explains *why the variance exists* (how the restraint allele got into the nest in the first place), but it does not change the *level at which sorting occurs*. In Case 5, the sorting is still happening between nests.
  *   **Recommendation:** Adopt the view that Kin Selection and Group Selection are compatible descriptions of the same process in Case 5. Kin selection is the *genetic explanation* for the trait's origin; Group selection is the *ecological mechanism* of its maintenance. To say "Kin and not Group" in Case 5 while saying "Group" in Case 4 is inconsistent, because the causal machinery of the *sorting* (nest budding) is identical.

  *(Note: This also applies to Case 2, the Wasps. If you accept the colony buds daughter colonies, it is a unit of replication. You may keep "Kin Selection" as the explanation for the altruism, but you should concede the colony is also a unit of selection.)*

  ### What the Principle Says About Case 7 (Plankton)

  The principle gives a conditional "Yes."

  *   **It is Selection if:** The body-plan feature is a **species-level homolog**. For example, if the feature is "geographic range size" or "larval dispersal mechanism" that is conserved across the lineage regardless of individual turnover. Here, the species is the replicator (via speciation), and extinction is the death.
  *   **It is NOT Selection if:** The feature is an **aggregate**. For example, if the feature is "average body size" determined entirely by individual genes within each generation. Here, the differential extinction is just a side-effect of individual selection summed up over time.
  *   **Verdict:** If the trait is emergent at the lineage level, Case 7 is **Species Selection**. If it is an aggregate of individual traits, it is **Effect Macroevolution** (sorting without selection). Your principle forces you to check the heredity mechanism of the lineage.

  ### The Discriminating Case: The "Passenger" Group Trait

  To discriminate between your Principle and your Friend's Bookkeeping view, consider this case:

  **The Case:** Imagine a population of groups. A certain neutral marker allele (call it *Blue*) happens to be frequent in groups that, by pure environmental luck, occupy safe habitats. Groups with *Blue* survive better. Groups without *Blue* go extinct.
  *   **Friend's Bookkeeping (Price Equation):** The math partitions variance to the group level. The friend must say "Group Selection occurred" because the statistical covariance between the group trait (*Blue* frequency) and group survival is positive.
  *   **Your Principle:** **No Selection.**
      *   Clause 2 fails: Variation in *Blue* does not *cause* variation in survival; the safe habitat does.
      *   Clause 3 fails: There is no causal mechanism linking the trait to the replication.

  **Why this matters:** Your friend's view cannot distinguish between a trait that *causes* group survival and a trait that merely *correlates* with it due to external factors. Your principle insists on **causal efficacy**, not just statistical partitioning. This validates your intuition in Cases 1 and 4 that there is a "further fact" about the mechanism, not just the math.

  ### Summary of Advice

  1.  **Keep** your Gene-level verdicts (1, 3) and your Multi-level verdict (6). They rest on the **Conflict/Non-Reducibility** clause.
  2.  **Abandon** the mutual exclusivity in Case 5. Accept that high-relatedness group selection is still group selection. Kin selection explains the *variance*; Group selection explains the *sorting*.
  3.  **Refine** Case 7. Distinguish between species-level heredity (Selection) and aggregate traits (Sorting).
  4.  **Defeat the Friend** using the "Passenger Trait" case. Bookkeeping detects correlation; your principle detects causation. Selection is a causal process, not a statistical remainder.
