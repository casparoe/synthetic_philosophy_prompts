answer: |-
  You are onto something real here, and your frustration is shared by a lot of historians and economists who have spent decades watching this debate cycle without a clear knockout. The fact that you and your partner agree on the data but not the conclusion is the biggest clue that this is not a standard factual dispute. If you were arguing about whether real wages in London were higher than in Beijing in 1750, that would be a factual dispute solvable by better archives or new methods. But since you both accept the data yet remain entrenched, you are having a disagreement about causal attribution and counterfactual history, which is a much harder knot to untie. Essentially, you are arguing about how much weight to give to structural prerequisites versus contingent opportunities, and because history only happens once, you cannot run a controlled experiment to see if England would have industrialized without coal or if China would have industrialized without colonies.

  Your working theory that you are answering two different questions is largely correct, but it goes even deeper than that. The debate is often stuck because both sides are trying to identify necessary and sufficient conditions for an event that is statistically unique. Industrialization is the anomaly in human history, not the norm. When you ask why Britain and not China, you are implicitly treating industrialization as the default outcome that requires explanation only when it fails to happen, or conversely, treating Europe as the default success story that requires a special explanation. This is where your intuition about the question being poorly posed hits the mark. Many scholars in the California School, like Pomeranz and Bin Wong, argue that asking why Europe diverged presupposes that Europe was on a normal path and China deviated, whereas they argue both were on similar Malthusian traps and Europe got lucky with the New World and coal. On the other side, the institutionalists argue that Europe had been diverging for centuries in terms of state capacity and property rights, so the industrialization was the logical culmination of deep trends. You are arguing about the baseline. If the baseline is 1800, Pomeranz wins on similarity. If the baseline is 1600, the institutionalists win on divergence. Since there is no agreed-upon start date for the divergence, you can both cherry-pick the timeline that supports your causal mechanism.

  The unit of comparison is another massive source of this stalemate that you hinted at. Comparing England to all of China is obviously flawed because England is a small island and China is a continent-sized empire. Comparing England to the Yangzi Delta is better, but even then, you are comparing a political fragment to a region within a unified empire. The institutionalists love to talk about European fragmentation creating competition that drove innovation, but that requires comparing Europe as a whole to China as a whole. The California School prefers comparing region to region to show living standards were similar. When you and your partner argue, you are likely sliding between these units without noticing. If she is talking about the Yangzi and England, she can show parity. If you are talking about Europe's state system versus China's imperial unity, you can show structural difference. Neither of you is wrong about the facts, but you are measuring different things and calling it the same debate.

  There is also a philosophical divide about what counts as a good explanation. You are looking for a deterministic chain where institutions lead to growth, which feels satisfying because it implies rules we can learn from. Your partner is looking for a conjunctural explanation where coal plus colonies plus timing created a bottleneck breakout, which feels satisfying because it avoids Eurocentrism. The problem is that historical explanation is always underdetermined by the evidence. You can always add a variable to save a theory. If institutions were so great, why did Italy stagnate? If coal was so key, why did Germany industrialize later with different coal conditions? Both sides have workarounds, and because we cannot observe the counterfactual world where Britain had no coal or China had secure property rights, neither side can be proven false. This makes the debate unresolvable by design in the strict scientific sense. You will never get a p-value for history.

  However, that does not mean progress is impossible, it just means progress looks different than proving the other person wrong. Progress comes from reframing the question away from why Europe and toward what combinations of factors make industrialization possible. Some recent work tries to synthesize the two views, suggesting that institutions were necessary to create the capacity to exploit the contingent advantages like coal. Maybe Europe needed the institutions to take advantage of the colonies, and China needed the colonies to break the ecological constraint but lacked the political structure to utilize them in the same way. If you and your partner can move from asking who was right to asking how these factors interacted, you might stop talking past each other. You need to agree on whether you are discussing the necessary preconditions for industrialization or the specific trigger that lit the fuse. Those are different questions.

  So to answer your question straight, no, better data will not solve this because the data you already have is being interpreted through different theoretical lenses. An agreed convention on the unit of comparison would help reduce the noise, but it would not settle the causal dispute. The debate is largely unresolvable as a binary choice between institutions and accidents because history is rarely binary. It is both. The stalemate persists because both sides are defending not just a historical theory but a worldview about whether the modern world was inevitable or accidental, and whether Western success was earned or lucky. That is not a historical question, it is a philosophical one. If you want to stop arguing in circles, admit that you are arguing about philosophy and counterfactuals, not facts. Acknowledge that her view explains why China didn't diverge despite being advanced, and your view explains why Europe was poised to diverge despite being fragmented. You are describing two sides of the same coin, and the friction comes from pretending only one side exists.
