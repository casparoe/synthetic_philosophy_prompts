      *   *Refining Rule 1:* "Withdrawing artificial life support is allowing nature to take its course." -> Predicts **Yes**.
      *   *Refining Rule 2:* "Physically intervening to stop a life-saving function is an act of killing." -> Predicts **No**.

      *   *Let's look closer at her Ventilator example:* "Not putting him on." She hasn't explicitly stated her view on *turning off* a ventilator that is already running. That is the crux.
      *   *Hypothesis 1:* She treats "withholding" (never started) and "withdrawing" (stopped) as the same. (Standard bioethics).
      *   *Hypothesis 2:* She treats "withholding" as okay, but "withdrawing" as active killing. (Some conservative views hold this).

      *   *Okay, let's formulate the two rules clearly.*
      *   **Rule 1: The "Artificial vs. Natural Cause" Rule.**
          *   *Definition:* Death is acceptable if the underlying pathology causes it, regardless of whether we stop fighting that pathology. Human action is only wrong if it *becomes* the cause of death (like poison or a shove).
          *   *Fit:* Explains why injection (poison) is bad, but no ventilator (lung failure) is okay.
          *   *ICD Prediction:* **Yes, turn it off.** The cause of death remains heart failure. The wand just stops fighting it.
      *   **Rule 2: The "Status Quo Omission" Rule.**
          *   *Definition:* It is okay to *omit* new treatments, but it is wrong to *act* to stop existing treatments that are sustaining life. Inaction preserves the moral baseline; action shifts it.
          *   *Fit:* Explains why no ventilator (omission of new thing) is okay, but injection (action) is bad. Also fits the Trolley (pushing is action, not sending money is omission).
          *   *ICD Prediction:* **No, keep it on.** The ICD is currently sustaining life. Using the wand is an *action* to stop that sustenance. It changes the status quo from "protected" to "unprotected" via active intervention.

  4.  **Determine the Best Guess:**
      *   She is a hospice nurse. She deals with this *constantly*. Hospice philosophy is heavily rooted in "allowing natural death."
      *   She accepted the DNR/No CPR logic.
      *   Most medical professionals (even conservative ones) distinguish between *killing* and *allowing to die* based on the *cause of death*, not the physical motion of the hand.
