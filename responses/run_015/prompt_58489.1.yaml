      *   *Why:* Her job requires her to navigate this. If she held Rule 2, she would struggle with almost all end-of-life care (stopping dialysis, turning off vents). Her consistency suggests a principled stand on *intent and cause*, not just physical motion.

  5.  **Design the Test Case:**
