      *   Clarify van Inwagen: He doesn't just deny statues; he denies *lumps* too. Only simples and organisms. So for him, there are no "two things," there are just *many* simples arranged statue-wise.
      *   Clarify the "One thing, two descriptions" view. If it's *strict* identity, it fails Leibniz's Law. If it's *relative* identity, it might work.
