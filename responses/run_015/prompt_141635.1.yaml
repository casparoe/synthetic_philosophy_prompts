  3.  **Deconstruct the Theory (Global Workspace Theory - GWT):**
      *   **Core Idea:** Consciousness arises when information is broadcast globally to multiple cognitive subsystems (the "workspace").
      *   **Access Consciousness (A-consciousness):** Information is available for reasoning, reporting, and rational control of action (Block's definition, often aligned with GWT).
      *   **Phenomenal Consciousness (P-consciousness):** The subjective "what it is like" aspect.
      *   **GWT Stance:** Often identifies consciousness with global availability (Access). Some versions allow for P-consciousness without report, but standard GWT (Baars, Dehaene) ties consciousness closely to the global broadcast necessary for report/control.
      *   **The Twist:** The patient *cannot* report behaviorally. But the neural signature suggests global broadcast *internally*.

  4.  **Brainstorming (Structured):**
