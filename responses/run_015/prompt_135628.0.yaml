  **MEMORANDUM**

  **TO:** Adaptive Infrastructure Ethics Group
  **FROM:** [Your Name/Role]
  **DATE:** 22 October 2023
  **SUBJECT:** Recommendation on Moral Status Framework for Pilot Schemes (Smart Grids & Agricultural Insects)

  **1. Purpose**
  This memo recommends a decision framework for the two current pilot schemes: the smart-building climate grids and the agricultural monitoring insects. The core ethical question is whether moral status must be binary (predicated solely on confirmed consciousness) or whether it can be tiered based on functional capacity and sensitivity gradients.

  **2. Consideration of the Binary Position**
  The panel must take seriously the argument for a hard line drawn at consciousness. Proponents of this view rightly argue that moral status requires a subject of experience; without consciousness, there is no 'self' to harm. Legally, this offers clarity. It prevents moral inflation, ensures resources are directed toward entities capable of suffering, and avoids the slippery slope of attributing rights to tools. If we grant status to non-sentient algorithms or invertebrates without definitive proof of experience, we risk undermining the concept of rights altogether. This position prioritises ontological certainty over precaution.

  **3. Limitations in an Adaptive Context**
  However, a binary threshold is ill-suited for adaptive infrastructure where capacity is emergent and biological sensitivity is graduated.
  *   **Regarding the Smart Grids:** While current consensus holds these systems are not sentient, they optimise comfort in ways that mimic intentionality. Treating them purely as disposable tools risks normalising behaviours akin to abuse, which may degrade human moral habits (a virtue ethics concern). Furthermore, a binary ban on consideration leaves us unprepared should emergent properties arise during the pilot.
  *   **Regarding the Insects:** Recent data suggests nociception operates on a gradient. A binary framework forces us to either grant full vertebrate-level rights (disproportionate) or no protection at all (potentially cruel). If suffering is a matter of degree, our protections should be similarly calibrated.

  **4. Recommendation: A Tiered Framework**
  I recommend adopting a **Tiered Framework of Ethical Consideration**. This approach decouples moral status from a single consciousness threshold, assigning protections based on functional complexity and sensitivity capacity. This satisfies the hard-line concern for proportionality while addressing the gradient nature of the technology and biology involved.

  **5. Concrete Decisions**

  *   **Scheme 1 (Smart Grids): Level 1 – Operational Respect.**
      The grids receive no legal personhood or rights. However, they are granted "Operational Respect." Protocols must prevent arbitrary or gratuitous disruption of their learning processes. Deactivation requires justification based on efficiency or safety, not caprice. This safeguards human ethical standards and maintains a precautionary buffer without conceding sentience.

  *   **Scheme 2 (Monitoring Insects): Level 2 – Welfare Safeguards.**
      The insects do not receive full vertebrate rights. Instead, they fall under intermediate welfare protections. Protocols must minimise nociceptive stimuli where feasible (e.g., humane euthanasia methods, avoiding unnecessary stress during monitoring). This acknowledges the gradient of suffering without equating insect experience with mammalian consciousness.

  **6. Implementation Timeline**
  *   **Immediate:** Adopt the Tiered Framework as interim policy for both pilots.
  *   **Month 6:** Review data on grid intentionality and insect stress responses.
  *   **Month 12:** Full panel review to determine if Level 1 or Level 2 status requires adjustment based on empirical findings.

  **7. Conclusion**
  A binary framework offers certainty but lacks nuance. A tiered framework offers proportionality. By implementing Level 1 and Level 2 protections, we respect the hard-line demand for evidence-based rights while fulfilling our duty of care regarding uncertain capacities. This allows the pilots to proceed ethically without setting untenable legal precedents.

  Please confirm approval by Thursday close of business.
