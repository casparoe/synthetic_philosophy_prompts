      *   **Camp 1 (Judgmentalism/Cognitivism):** Emotions *are* or necessarily involve evaluative judgments (e.g., "This is dangerous"). If the judgment goes, the emotion goes. Recalcitrant emotions (fear of flying despite knowing it's safe) are problematic (akrasia of emotion).
      *   **Camp 2 (Perceptualism/Sensory Theory):** Emotions are like perceptions (e.g., seeing a snake). They present value but aren't beliefs. They can persist despite contrary beliefs (like an optical illusion).
      *   **Bodily Feelings:** Both reject pure Jamesian "emotion is just feeling heartbeat." But Camp 1 sees them as contingent effects. Camp 2 often sees them as constitutive of the perceptual mode.
