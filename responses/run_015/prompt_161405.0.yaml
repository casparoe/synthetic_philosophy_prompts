answer: |-
  **The Case**

  Patient K presents with a rare, selective necrosis of the lateral spinothalamic tract, sparing the medial projections to the anterior cingulate and insula. When subjected to calibrated noxious heat or pressure, K exhibits no withdrawal reflexes, cannot localize the stimulus, and reports no qualitative sensation (no 'burning' or 'stabbing'), yet consistently rates the experience as maximally unpleasant, demands immediate cessation, and will trade significant monetary rewards to avoid the stimulation, displaying a motivational profile indistinguishable from severe nociceptive suffering despite the total absence of somatic discriminative content.

  **The Demonstration**

  On the **Attitudinal Theory**, which constitutes pain's badness (and often its identity) via the subject's intrinsic desire that the experience not occur, Patient K is unequivocally in pain and the state is bad for them. Because the theory locates the essence of painfulness in the negative attitude itself rather than the sensory vehicle carrying it, K's vigorous avoidance behavior and high unpleasantness ratings satisfy the constitutive conditions of pain without need for sensory content; the badness is real because the frustration of the desire to stop the state is real. Conversely, **Imperativism** struggles to classify K's state as pain because it defines pain as a perceptual experience with the content of a bodily command (e.g., "Protect the foot!"). Since K lacks localization and discriminative quality, there is no specific body part to which an imperative could refer, and the theory must deny this is pain to maintain the distinction between pain and free-floating distress. Similarly, the **Pure Sensory-Quality View** must deny K is in pain, as it holds that pain is essentially a somatic sensation with specific qualitative character; without a 'hurt' located in the body, K merely suffers from a non-sensory affective disturbance. The Imperativist's cheapest escape route—positing a vague imperative like "Something is wrong somewhere!"—fails because it renders the imperative content indistinguishable from general anxiety or the attitudinalist's desire, thereby abandoning the explanatory advantage of tying pain specifically to *bodily protection*.

  **Analysis**

  The single feature doing the dialectical work is the **dissociation of affective-motivational processing from sensory-discriminative content**. If this feature is removed by restoring sensory-discriminative content (location and quality), the Imperativist and Sensory-Quality views immediately recant their denial, as the state then fits their constitutive requirements for pain. If the feature is removed by eliminating the aversion (returning to standard asymbolia), the Attitudinal view withdraws its claim that the state is bad. The strongest reply available to the Imperativist is to concede that K is suffering but insist the state is not *pain*, arguing that pain asymbolia and K's case are not true mirror images: asymbolia removes the *force* of a command while retaining its *content*, whereas K's case removes the *content* while retaining the *force*, meaning K lacks the representational structure essential to the pain modality regardless of how bad the state feels.
