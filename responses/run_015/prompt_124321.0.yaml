answer: |-
  This is a sharp puzzle because it sits right at the friction point between linguistic theory and institutional ontology. You're right to feel the tension: standard speech act taxonomy treats Declarations as changing the present state of affairs to match the proposition, but "deeming" clauses seem to demand the world (specifically, the normative timeline) match a proposition about the *past*.

  Here is how I break it down, moving from the illocutionary mechanics to the metaphysical grounding.

  ### 1. The Illocutionary Type: Retroactive Constitutive Declaration
  You asked if this is just "power plus stipulation" or a genuine illocutionary type. I argue it is a genuine subtype of the **Declaration**, but we must be precise about the "world" being fitted.

  In a standard Declaration (e.g., "You are husband and wife"), the direction of fit is double: the utterance represents a state of affairs *and* brings it about. In the *Nightingale* case, the Harbormaster is not changing the *brute* past (the ship did not physically dock in March, or if it did, it wasn't registered then). She is changing the **deontic past**.

  When she says, "I deem...," she is exercising **constitutive power**. She is not describing a historical fact (Assertion) nor trying to get you to do something (Directive). She is creating an **institutional fact** that carries retroactive normative consequences.
  *   **The Fit:** The words fit the institutional reality *because* the words are spoken.
  *   **The Retroactivity:** This is not time travel. It is the assignment of a *temporal scope* to a status function. The status ("registered") is created *now* (at the moment of speaking), but the *validity conditions* of that status are indexed to March.

  So, it is not merely a stipulation. A stipulation defines terms ("In this charter, 'vessel' includes 'raft'"). A deeming clause creates a fact ("This raft *is* a vessel"). The Harbormaster's utterance is the ontological ground of the registration, not a report on it.

  **Confidence:** High. This aligns with Searle's extension of Austin on institutional facts, though the "retroactive" element requires careful handling of tense logic.

  ### 2. Status vs. Event: Why It Doesn't Collapse into Assertion
  You asked if framing the content as a "status" saves it from collapsing into assertion. Yes, it does, but only if we accept that institutional statuses are ontologically distinct from brute events.

  If the content were "The Nightingale docked in March," that is an assertion. It is truth-apt based on brute physical evidence. If the Harbormaster says this and the ship was actually in drydock, she lies.
  But the content is "The Nightingale is *registered* as of March." Registration is a status, not an event. Statuses exist only within the normative system.
  *   **Assertion:** Claims the status exists independently of the utterance.
  *   **Deeming:** The utterance is the *condition of possibility* for the status.

  It doesn't collapse into assertion because the truth condition is satisfied *by the successful performance of the speech act*, not by prior correspondence with reality. The "truth" of the registration is internal to the guild's normative system.

  **Confidence:** High. This is standard status function theory.

  ### 3. The Bootstrapping Problem: Where the Regress Stops
  This is the hardest metaphysical bite. If the Harbormaster's power comes from the Charter, and the Charter's power comes from earlier declarations, what stops the infinite regress?

  It stops at **social practice**, not language. This is the Hartian move (Rule of Recognition). At the bottom of the stack, there is no speech act. There is a *convergence of behavior and attitude*. The regress stops when we reach a group of people who simply *accept* certain rules as standard for common conduct.

  The Charter is not "decorative," but it is not magical. It is a codification of a pre-linguistic or para-linguistic **collective intentionality**. The "rule" part works only because there is a background of de facto recognition that sustains it. If the guild members stopped caring about the Charter tomorrow, the Harbormaster's words would become noise. The authority is not in the ink; it is in the sustained collective recognition of the ink's significance.

  So, the bootstrapping is solved by acknowledging that the foundation of institutional language is non-linguistic social fact.

  **Confidence:** Medium-High. This is the dominant view in legal philosophy (Hart/Raz), though natural lawyers or radical realists might push back on the "social fact" sufficiency.

  ### 4. Uptake: Validity vs. Efficacy
  This is where I get nervous, and where the institutional context diverges from the interpersonal.

  In a promise or a bet, Austin suggests uptake (understanding/acceptance by the hearer) is required for the illocution to be *secured*. If I promise you and you don't hear me, have I promised? Debatable.
  In the *Nightingale* case, if the guild members ignore her:
  1.  **Illocutionary Success:** If she followed the procedure (stood in the right spot, used the right words, held the office), the illocutionary act is **valid**. The ship *is* registered, objectively, within the system.
  2.  **Perlocutionary Failure:** If the clerks ignore her and don't update the log, the *effects* of the registration (taxes, docking rights) won't materialize.

  However, there is a catch. If the *entire* guild ignores her consistently, her authority dissolves (see Bootstrapping). But for a single instance, **uptake is presumed, not required for validity.** Institutional speech acts are designed to be "uptake-proof" regarding the immediate audience to prevent hold-up problems. The system treats the act as effective *until* successfully challenged.

  So, if they ignore her, the ship is registered (Illocution succeeded), but the registration is ineffective (Perlocution failed). The failure is not that she didn't register it; it's that the world didn't respond to the registration.

  **Confidence:** Medium. This is the most contentious area. Some Austinians argue uptake is *always* constitutive. Institutional contexts suggest otherwise, but the line between "constitutive rules" and "brute social power" blurs here.

  ***

  ### Summary of Confidence & The Flag

  *   **Illocutionary Classification (Retroactive Declaration):** High Confidence.
  *   **Status vs. Event Distinction:** High Confidence.
  *   **Bootstrapping (Social Practice Foundation):** Medium-High Confidence.
  *   **Uptake (Validity vs. Efficacy):** Medium Confidence.

  **The Single Claim I Am Least Sure About:**
  I am least sure about the **Uptake** distinction in the institutional context. Specifically, the claim that the illocution succeeds *even if* the immediate audience ignores it, provided the procedural rules are met. There is a strong argument (from Strawson or later Austin) that if the "conventional effect" (the logbook update) is part of the illocutionary definition, then without the audience's cooperation, the act itself misfires. I am leaning toward "Validity holds despite ignorance," but I acknowledge that in a radical social constructivist view, the act *is* the recognition, so no recognition = no act.

  **Final Verdict:** Treat "deeming" as a **Constitutive Retroactive Declaration**. It creates a status *now* with a back-dated index. It relies on social practice to stop the regress, and it tolerates a lack of immediate uptake better than interpersonal speech acts, though sustained lack of uptake destroys the authority itself.
