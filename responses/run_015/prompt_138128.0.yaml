answer: |-
  There is no single, canonical term in the philosophical literature that captures precisely this *migration* of reasons from the pragmatic to the constitutive via an indirect route. You are describing a specific dynamic within the broader "Wrong Kind of Reasons" (WKR) problem, but standard discussions of WKR usually focus on blocking the transfer, not analyzing the status of the attitude after a successful indirect transfer has occurred.

  The closest existing labels are **"Indirect Doxastic/Emotional Strategies"** or **"Pragmatic Encroachment on Constitution,"** but these are descriptive phrases, not names for the phenomenon itself. Your metaphor of **"Normative Laundering"** is as good as any technical term available; it captures the intuition that the "currency" of the reason is being washed clean of its pragmatic origin as it moves through the system.

  If I were to coin a term for the *defect* you are isolating, I would call it **"Constitutive Taint."** This distinguishes it from a simple genetic fallacy (where origin is irrelevant) and from a current functional defect (where the attitude fails its job). Constitutive taint suggests the attitude is functioning correctly *now*, but its normative standing is compromised by the illegitimacy of the process that secured its standing.

  ### One Phenomenon or Three?

  Structurally, these are **one phenomenon**: *Indirect Pragmatic Regulation.* In all three cases, a pragmatic reason (Wrong Kind) targets a proximal variable (information access, behavioral routine, reliance actions) to manipulate a distal attitude (belief, grief, trust).

  However, metaphysically, they split into **two distinct types**, and this split determines whether the "Constitutive Taint" sticks.

  **Type A: Causal Production (Cases 1 & 2)**
  In the surgical patient and the widower, the pragmatic reason causes a change in conditions (evidence selection, behavioral avoidance) which *causally produces* the attitude. The attitude is a separate effect.
  *   **Case 1 (Belief):** The defect is weakest here. Belief aims at truth. If the steering results in a true belief supported by evidence, the *epistemic* norm is satisfied. The defect is purely *procedural* (epistemic irresponsibility). Many epistemologists would argue the belief is justified *now*, even if the agent was irresponsible *then*. The "taint" fades if the pragmatic reason is no longer needed to sustain the belief.
  *   **Case 2 (Grief):** The defect is strongest here. Grief aims at *fittingness* to a loss. The loss hasn't changed. By dampening the grief for pragmatic reasons, the widower has made the attitude *unfitting*. The "taint" is permanent because the object of the attitude (the death) still warrants the intensity that was removed. The history matters because the emotion is a *response*, and the response has been muted by a non-responsive cause.

  **Type B: Constitutive Construction (Case 3)**
  *   **Case 3 (Trust):** This is the "genuine article" of the transfer you are describing. Trust is not just a feeling caused by evidence; it is partly *constituted* by reliance behaviors. When the colleagues act trustingly for pragmatic reasons, they are not merely causing trust; they are *enacting* it.
  *   Here, the transfer is most successful. If you act trustingly, you are trusting, full stop. The pragmatic reason *becomes* a reason of the right kind because the action *makes* the colleague trustworthy (by creating a stable environment) or makes the attitude *be* trust. This is the "fake it till you make it" mechanism where the faking *is* the making.

  So, to answer your question: Case 3 is the genuine instance of the *transfer* working (pragmatic reasons successfully constituting the attitude). Case 2 is the genuine instance of the *defect* sticking (the attitude remains normatively compromised). Case 1 is the borderline where the defect dissolves into mere history.

  ### The Boundary Condition

  You asked for the feature that decides whether the transfer goes through (i.e., whether the attitude ends up in good standing or compromised). The deciding feature is **Sustenance vs. Initiation.**

  *   **Just Inside the Line (Defective):** The pragmatic reason remains the **sustaining cause** of the attitude, even if hidden.
      *   *Example:* The widower continues to avoid photos *because* he fears frightening the children, not because he feels less grief. The pragmatic reason is actively holding the grief down. The state is defective (inauthentic/unfitting).
  *   **Just Outside the Line (Clean):** The pragmatic reason is merely the **initiating cause**, but the attitude is now sustained by its proper objects.
      *   *Example:* The surgical patient started reading optimistic literature for hope (pragmatic), but now believes she will recover because she *sees* the data (evidential). If she would maintain the belief even if told the pragmatic steering was manipulative, the taint is gone. The "laundering" is complete.

  The critical variable is **counterfactual stability.** If the pragmatic reason were removed, would the attitude collapse? If yes, it is tainted. If no, the laundering succeeded.

  ### Confidence and Vulnerability

  **Confidence Level:** I am roughly **75% confident** in this account. The distinction between causal production and constitutive construction is standard in action theory and philosophy of emotion, and it maps well onto your cases. The "Sustenance vs. Initiation" boundary is a robust way to handle the "genetic" worry without falling into a pure genetic fallacy.

  **Claim Most Likely to Be Wrong:** I would be least surprised to find out that my verdict on **Case 1 (Belief)** is too lenient.
  *   *Why:* There is a strong tradition in epistemology (e.g., Proper Functionalism, some virtue epistemologies) that holds a belief is *never* fully in good standing if it was produced by a process aimed at something other than truth, even if it is now supported by evidence. On this view, the "ancestry" is not just a historical footnote; it permanently compromises the *warrant* of the belief, regardless of current evidence. If that view is correct, then Case 1 is just as defective as Case 2, and the "laundering" never truly succeeds for belief. I have leaned towards a more externalist view (evidence is what matters), but that is a contested hinge in epistemology.
