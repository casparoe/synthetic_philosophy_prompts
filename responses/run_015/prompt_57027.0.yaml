answer: |-
  Here is the framework you need to cut through the noise. If an interpretation of the *cogito* fails these demands, it isn't just "different"—it's broken. I've separated them into universal requirements (everyone must accept these) and camp-specific requirements (where the fighting happens).

  ### 1. The Universal Demands (Non-Negotiable)
  Every account, regardless of school of thought, must satisfy these three constraints. If an interpretation violates these, it fails to be an account of *Descartes's* project.

  **A. Immunity to the Evil Demon**
  *   **The Demand:** The truth of the proposition must hold even if an all-powerful deceiver is actively trying to make you believe false things.
  *   **Why it counts:** This is the entire point of the *Meditations*. Descartes isn't looking for "highly probable"; he's looking for the one thing that survives hyperbolic doubt.
  *   **What breaks if it fails:** If the account relies on sensory data, memory, or logical rules that the Demon could fake, it provides no foundation. It collapses back into skepticism.

  **B. Non-Circularity (No Begging the Question)**
  *   **The Demand:** The argument cannot presuppose the existence of the "I" in the premise "I think."
  *   **Why it counts:** If you have to assume "I exist" to make sense of "I think," you haven't proved anything. You've just restated your conclusion.
  *   **What breaks if it fails:** The *cogito* becomes a tautology ("I exist, therefore I exist") rather than a discovery. It loses its power as a first principle.

  **C. The Momentarity Constraint**
  *   **The Demand:** The certainty established must be limited to the *present moment* of thinking.
  *   **Why it counts:** Descartes explicitly admits he only knows he exists *as long as* he is thinking. He does not claim the *cogito* proves he existed yesterday or will exist tomorrow.
  *   **What breaks if it fails:** If an account claims the *cogito* proves a permanent, enduring soul all by itself, it overreaches. It ignores the temporal limits Descartes places on the intuition.

  ---

  ### 2. The Fault Lines (Camp-Specific Demands)
  This is where you and your friend are fighting. These requirements are not universal; they are weapons used by specific sides. You need to identify which side is demanding what.

  **A. The "Substance" Demand (Your Friend's Camp)**
  *   **The Claim:** The *cogito* proves there is a *thing* (a thinker) distinct from the thought.
  *   **The Requirement:** The account must explain how we move from an *activity* (thinking) to an *agent* (the I) without smuggling in a hidden premise like "all activities require an agent."
  *   **Why they need it:** Without this, you don't get a soul, a self, or a subject of experience. You just get floating thoughts.
  *   **The Weakness:** This is vulnerable to the "Grammar Objection." Just because language requires a subject ("*I* run") doesn't reality ("*Running* is happening").

  **B. The "Deflationary" Demand (Your Camp)**
  *   **The Claim:** The *cogito* only proves that *thinking is occurring*. The "I" is a grammatical placeholder, not a metaphysical discovery. (This is the Lichtenberg/Nietzsche position).
  *   **The Requirement:** The account must explain why Descartes insists on "*Sum*" (I am) rather than "*Cogitatur*" (Thinking is happening).
  *   **Why you need it:** To show that the "Self" is a fiction constructed by language, not a foundation of reality.
  *   **The Weakness:** If there is no "I," who is being deceived by the Evil Demon? Deception usually requires a victim. If there's no thinker, the radical doubt scenario gets messy.

  **C. The "Inference" Demand (The Logicians)**
  *   **The Claim:** The *cogito* is a syllogism: (1) Everything that thinks exists; (2) I think; (3) Therefore I exist.
  *   **The Requirement:** The account must justify the major premise ("Everything that thinks exists") without relying on prior knowledge that might be doubted.
  *   **Why they need it:** To make the *cogito* a piece of rigorous logic rather than a mystical flash of insight.
  *   **The Weakness:** Descartes explicitly denies this is a syllogism. He says we grasp the conclusion directly. If you force it into a syllogism, you violate Descartes's own instructions.

  **D. The "Performative" Demand (The Intuitionists)**
  *   **The Claim:** The *cogito* isn't an argument; it's an act. Saying/thinking it makes it true.
  *   **The Requirement:** The account must show that the *experience* of doubting guarantees the existence of the doubter, without needing logical steps.
  *   **Why they need it:** To bypass the "Grammar Objection." It doesn't matter if "I" is grammar; the act of *attempting* to deny your existence confirms you.
  *   **The Weakness:** It makes the truth fleeting. As soon as you stop performing the act, the certainty vanishes.

  ---

  ### 3. The Impossible Trinity (Where Requirements Clash)
  You asked what can't be satisfied at once. Here is the trade-off. You cannot maximize all three of these simultaneously:

  1.  **Logical Rigor:** (It follows strict rules of inference).
  2.  **Substantial Self:** (It proves a real "I" exists, not just thinking).
  3.  **Immunity to Doubt:** (It requires no hidden premises that could be faked).

  *   **If you want Rigor + Self:** You need a major premise ("All thinking implies a thinker"). But that premise can be doubted (maybe thoughts exist without thinkers?). **Immunity fails.**
  *   **If you want Immunity + Rigor:** You must stick strictly to what is given ("Thinking is happening"). You cannot infer a "thinker." **Substantial Self fails.** (This is your position).
  *   **If you want Self + Immunity:** You must treat it as a direct intuition/experience, not a logical inference. You "feel" the self. But this sacrifices **Logical Rigor** (it becomes subjective/psychological).

  **The Verdict on Your Fight:**
  Your friend wants **Self + Immunity**. You want **Immunity + Rigor**.
  Descartes wants **Self + Immunity**, but he tries to get it by sacrificing **Rigor** (claiming it's an intuition, not an inference).
  *   **To settle it:** Ask your friend: "What premise allows you to jump from 'thinking' to 'thinker' that the Evil Demon couldn't fake?" If they can't name one without assuming the conclusion, your Deflationary view wins on logical grounds. If they insist it's an *experience* not a logic problem, they win on Phenomenological grounds. You are arguing past each other because one of you is treating it as logic, the other as experience.

  ---

  ### 4. The Split-Brain Requirement: Fair or Gotcha?
  **Verdict:** It is a **Gotcha** for Descartes, but a **Valid Test** for modern accounts.

  *   **Why it's a Gotcha for Descartes:** Descartes explicitly argues the mind is *indivisible* (unlike the body). He didn't know about corpus callosum severance. Demanding his 17th-century account handle 20th-century neurology is anachronistic. If you use this to say "Descartes was wrong," you're winning on trivia, not philosophy.
  *   **Why it's Valid for the *Claim*:** If the *cogito* is supposed to reveal the fundamental nature of the "I," it should hold up against new data. A split-brain patient might say "I think" but there are two distinct centers of consciousness.
      *   **If the *cogito* proves a Unified Self:** Split-brain cases falsify it.
      *   **If the *cogito* proves only Thinking is Happening:** Split-brain cases don't hurt it. Thinking is still happening, even if it's fragmented.
  *   **How to use it:** Don't use it to attack Descartes's historical intent. Use it to attack the **Substantialist** interpretation. If the "I" is a single, unified substance, split-brain patients are a problem. If the "I" is just the thought of the moment, split-brain patients are fine. This actually supports *your* side of the argument (the Deflationary view).

  ### 5. Summary Strategy for Your Club
  To write a summary that settles the debate rather than repeating it, structure it like this:

  1.  **State the Universal Constraints:** Agree that whatever the *cogito* is, it must survive the Evil Demon and not beg the question.
  2.  **Map the Trade-Off:** Explicitly state that you cannot have a logically rigorous proof of a substantial self that is also immune to doubt. One must give.
  3.  **Classify the Fighters:**
      *   **Team "I" (Substantialists):** They are prioritizing the *Self* over *Logical Rigor*. They treat it as an Intuition.
      *   **Team "Thinking" (Deflationists):** They are prioritizing *Logical Rigor* over the *Self*. They treat it as an Inference (or a linguistic report).
  4.  **The Split-Brain Ruling:** Note that this edge case damages the "Unified Self" view more than the "Thinking Happens" view.
  5.  **Conclusion:** The stalemate exists because one side is asking for a metaphysical guarantee (a Soul) that the text's logical constraints (Radical Doubt) cannot support without a leap of faith.

  If you frame it as an **incompatibility of requirements** rather than one side being "stupid," you'll look like the only person who actually understood the structure of the argument.
