  2.  **Identify Relevant Social Epistemology Concepts:**
      *   *Echo Chambers vs. Epistemic Bubbles:* This is the most famous distinction (Nguyen).
          *   *Bubble:* You haven't heard the other side. (Fix: Add information).
          *   *Echo Chamber:* You've heard the other side, but you distrust the sources. (Fix: Much harder, requires rebuilding trust).
          *   *Fit:* The user says they *do* circulate the other side's material. But it's framed. This looks more like an Echo Chamber because the *trust* in external sources is systematically undermined (the "explanation is always available" point).
      *   *Epistemic Injustice:* Specifically *Testimonial Injustice* (Fricker). The two members who brought data were discounted due to identity/status (consultant/dean), not the content.
      *   *Group Polarization/Deliberation:* The group is reinforcing a shared view.
      *   *Common Knowledge/Common Ground:* The group shares a "common ground" that excludes certain premises.
      *   *Epistemic Vice:* Intellectual arrogance, closed-mindedness (Cassam).
      *   *The specific phenomenon "Template Immunity":* This sounds like *Motivated Reasoning* or *Confirmation Bias* institutionalized. In social epi, it relates to *Defeasibility Conditions*. The group has set the bar for defeaters impossibly high.
