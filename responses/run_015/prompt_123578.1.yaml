answer: |-
  There is no single lexicalized term (like *ad hominem* or *straw man*) that captures this move precisely, though it is a well-known structural flaw in political philosophy. The most accurate established label is **The Baseline Problem** (specifically, the *Normative Baseline Asymmetry*). In legal theory, it is sometimes discussed as the **Omission/Commission Distinction** applied to property rights, or as a form of **Reification** (treating a social construct as a natural object).

  Your coinage, "baseline laundering," is descriptively accurate, but for the precision you require, I will define the move as **The Naturalized Baseline Fallacy**.

  Here is the shape of the thing, carved out as requested.

  ### 1. Definition
  The **Naturalized Baseline Fallacy** occurs when an argument treats a contingent, legally constructed distribution of rights or resources as a pre-political moral default. This has two necessary components:

  1.  **Reification:** A specific legal regime (e.g., current property laws, contract enforcement, inheritance statutes) is described not as a state action, but as the absence of state action (the "background" or "free market").
  2.  **Asymmetric Justification:** Interventions that alter this reified baseline (e.g., taxation, redistribution) are treated as coercive acts requiring positive justification, while the coercive enforcement of the baseline itself (e.g., eviction, injunctions against trespass) is treated as the protection of liberty requiring no justification.

  **Boundary Cases:**
  *   **Not this fallacy:** Arguing that a *specific* long-standing custom should be preserved because disrupting it causes chaos (reliance interest). This admits the baseline is contingent but argues for stability on practical grounds.
  *   **Not this fallacy:** Arguing that a specific right is natural (e.g., self-ownership) and deriving property from it. This is a substantive moral claim, not a sleight of hand regarding legal constructs.
  *   **Is this fallacy:** Arguing that "my income is mine" without acknowledging that "income" is a category created by tax and corporate law, and then using that ownership to argue against tax.

  ### 2. Distinction from Near Misses
  You correctly identified that standard labels are insufficient. Here is how the Naturalized Baseline Fallacy differs from your candidates:

  *   **Status Quo Bias:** This is psychological (preferring what exists). The Fallacy is normative (claiming what exists *needs no reason*, while changes *do*). Your friend is not biased toward the status quo generally; he is biased toward *this specific baseline* because he treats it as "nature" rather than "policy."
  *   **Motte-and-Bailey:** This involves swapping a defensible claim for an indefensible one. The Fallacy involves no swap. It is a consistent framing error where the "frame" itself is the contested object.
  *   **The Baseline Problem (Coercion):** This is the genus; the Fallacy is the species. The general Baseline Problem asks, "Relative to what situation is this act coercive?" (e.g., is a employer offering low wages coercive relative to starvation, or relative to a guaranteed income?). The Fallacy is the specific *solution* your friend employs: arbitrarily selecting the current legal distribution as the non-coercive baseline without argument.
  *   **Naturalization of Status Quo:** This is the sociological mechanism (how people come to think this way). The Fallacy is the argumentative use of that thinking.

  ### 3. Verdict on Defensibility
  Is there a principled reason to place the burden of justification on changes rather than continuities?

  **The Only Defensible Version:**
  The asymmetry is defensible *only* if the value being prioritized is **Stability** or **Reliance**, not **Justice** or **Liberty**.
  If the argument is: "We should treat the current baseline as fixed because constant recalibration destroys planning and investment," that is a pragmatic argument for a *procedural* baseline. It admits the baseline is arbitrary but chooses it for efficiency.

  **The Indefensible Version (Your Friend's Move):**
  Your friend's move is indefensible because he treats the baseline as *morally* prior, not just *procedurally* convenient. He claims tax is "theft" (a moral violation), not "inefficient" (a pragmatic violation).
  You cannot claim the baseline is "natural" to avoid justifying it, while simultaneously claiming the state is "unnatural" for touching it. The enforcement of property rights requires men with guns just as much as tax collection does. To call one "protection" and the other "aggression" presupposes the very ownership rights that are in dispute. This is circular: *Why is it my field? Because the law says so. Why does the law say so? Because it's my field.*

  **Verdict:** The asymmetry is indefensible when used to shield the baseline from moral scrutiny. It is a **Question-Begging Baseline**.

  ### 4. Diagnostic Test
  To detect the Naturalized Baseline Fallacy, apply the **Legal Reversal Test**:

  > *Ask: "If the statute were written the other way around, would the description of 'action' and 'taking' reverse?"*

  **Application to your Instance 1 (Property vs. Tax):**
  *   *Current Law:* You own the field; state takes tax. Friend says: State taking is active; you keeping field is passive.
  *   *Reversed Law:* The state owns all land; it leases it to you, deducting a "rent" (tax) but leaving you a "stipend" (post-tax income).
  *   *Test:* In the reversed law, if you kept more than the stipend, the state would send men with guns. Would your friend call that "protecting state property" or "stealing from you"?
  *   *Result:* If he says the reversed law is "oppression" but the current law is "freedom," he is not arguing about coercion; he is arguing about *which distribution he prefers*, while masking it as a argument about *coercion*. That confirms the Fallacy.

  **Where the Test Misfires (False Positives):**
  You would be wrong to accuse someone of this fallacy if:
  1.  **They explicitly argue for the baseline:** If they say, "I know property law is contingent, but I argue Lockean mixing justifies this specific baseline," they are not laundering the baseline; they are defending it.
  2.  **Transition Costs:** If they argue, "This baseline is flawed, but changing it now would cause violence/collapse," they are prioritizing safety over perfect justice. This is not a fallacy; it is a tragic trade-off.
  3.  **Defined Terms:** If the argument is purely semantic (e.g., "By definition, 'income' means post-tax receipt"), then they are not making a moral claim about theft, just a definitional one.

  ### 5. Analysis of Instance 3 (Tax vs. Fee)
  *Your friend's claim:* Tax is unique because it takes a share of holdings rather than a fixed fee for a service.
  *Is this the same move?*

  **Verdict:** This is a **Downstream Consequence**, not the root move itself, but it relies on the Fallacy to function.

  **Reasoning:**
  The intuition that a "share" is a taking while a "fee" is not relies on the premise that the *whole* of the pre-tax holding belongs to the agent.
  *   If the baseline is naturalized: The money is "yours." The state taking 20% is a partial taking of your property. A fee for a service is a trade.
  *   If the baseline is denaturalized: The "holdings" are a construct of the legal system. The state defines the rules of the game in which those holdings exist. A "share" is simply a parameter of the system (like the size of a goal in football), not a taking of something that existed prior to the system.

  However, Instance 3 introduces a distinct intuition: **Proportionality vs. Quid Pro Quo.**
  Even if we accept the baseline is constructed, one could argue: "Okay, the state constructs the economy. But if it constructs it such that its reward is uncoupled from service rendered (tax) rather than coupled (fee), it becomes a tyrant rather than a partner."
  This is a separable argument about the *nature of the relationship* (citizen vs. customer).

  **Diagnosis:**
  Your friend is using Instance 3 to rescue the intuition of Instance 1. He concedes the baseline is legal (Instance 1 fails), so he retreats to: "Even if the baseline is legal, the *method* of extraction (share vs. fee) is hostile."
  This is not the Naturalized Baseline Fallacy *per se*. It is a **Category Error regarding Public Goods**. It assumes the state is a service provider (like a plumber) rather than a sovereign authority.
  *   **Why it fails:** The state provides the *framework* for the holding to exist, not a specific service to the holder. You cannot pay a "fee" for the existence of currency or contract law in the same way you pay for a plumbing repair, because the benefit is non-excludable.
  *   **Connection:** It travels alongside the Fallacy because it only feels intuitive if you already feel the money is "yours" to begin with. If the money is a token issued by the state, the state's claim to a share of it is not a "taking" but a "recall."

  ### Summary
  The move is the **Naturalized Baseline Fallacy** (a specific normative asymmetry within the broader Baseline Problem).
  *   **Definition:** Treating contingent legal distributions as moral defaults to shift the burden of justification onto redistribution.
  *   **Defensibility:** Indefensible as a moral claim (circular); defensible only as a pragmatic claim for stability (if admitted openly).
  *   **Test:** The Legal Reversal Test (would the description of coercion flip if the statute flipped?).
  *   **Instance 3:** A downstream effect. It relies on the baseline being "owned" to make sense, but adds a separate category error about the state's role.

  Your friend is not arguing that tax is coercive (all law is coercive); he is arguing that *this specific coercion* violates a baseline that he wishes to treat as non-coercive. You are correct: the baseline is laundered.
