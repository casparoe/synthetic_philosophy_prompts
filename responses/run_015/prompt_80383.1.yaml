answer: |-
  Here is the breakdown of the problem, the procedure, and the test runs.

  ### Part 1: The Failure Modes
  Before we build the tool, we need to know where it usually breaks. You are dealing with **observational equivalence**. In the real world, Institutions, Geography, and Culture rarely move independently. They cluster. When they cluster, you cannot tell which one is pulling the weight.

  Here are the four specific traps your procedure needs to catch:

  1.  **The "Redescription" Trap (Culture vs. Institutions):**
      *   *The Problem:* You write that "low trust culture" causes corruption. But "low trust" is often just a rational response to weak legal institutions. You are describing the same phenomenon twice using different words.
      *   *The Catch:* If your explanation for "Culture" is just "people don't follow the rules," that is an Institution problem, not a Culture problem. Culture must be something deep and slow-moving (e.g., religion, kinship structures) that exists *before* the current rules.

  2.  **The "Frozen Map" Trap (Geography vs. Time):**
      *   *The Problem:* Geography doesn't change. If a country's growth rate swings wildly from 1990 to 2020, Geography cannot be the main driver of that *change*, unless technology changed how geography matters (e.g., air conditioning made the tropics workable).
      *   *The Catch:* If you blame Geography for a recent crash, you are likely wrong. Geography sets the ceiling, but Institutions usually determine where you sit under that ceiling.

  3.  **The "Magic Lever" Trap (Selection Bias):**
      *   *The Problem:* You find one historical moment where a reform worked and claim Institutions caused success. But you ignore the ten times it failed, or the fact that the reform only passed because the economy was already booming (reverse causality).
      *   *The Catch:* You must look for cases where the cause happened *without* the effect, or the effect happened *without* the cause.

  4.  **The "Policy Wish" Trap (Identifiability vs. Utility):**
      *   *The Problem:* The Fund wants to lend money. You can lend money to fix Institutions. You cannot lend money to fix Geography or Culture. Therefore, there is immense pressure to find an Institutional story even if the evidence is weak.
      *   *The Catch:* The procedure must force you to admit when the Institutional story is a wish, not a finding.

  ***

  ### Part 2: The Decision Procedure (The "Whiteboard Test")

  This procedure is designed to be run in 4–6 hours with a whiteboard, a history of the country, and World Bank data. It does not require regression. It requires logical elimination.

  **Goal:** Assign a primary weight (0–100%) to Institutions, Geography, and Culture, OR declare "Not Identifiable."

  #### Step 1: The Time-Variance Check (Eliminate Geography)
  *   **Ask:** Did the country's development trajectory (GDP, stability, welfare) change significantly over the last 30 years?
  *   **Ask:** Did the country's Geography (location, climate, resources, neighbors) change significantly over the last 30 years?
  *   **Decision Rule:**
      *   If **Trajectory Changed** + **Geography Static**: Geography is *not* the primary driver of the recent change. It may set the baseline, but it is not the active cause. Downweight Geography to <20%.
      *   If **Trajectory Static** + **Geography Static**: Geography remains a candidate.
      *   *Exception:* Did technology change the value of the geography? (e.g., Oil became valuable, or Suez Canal opened). If yes, Geography stays in play.

  #### Step 2: The Twin Test (Eliminate Culture)
  *   **Ask:** Is there a neighboring country or a former colony with nearly identical ethnic/religious composition (Culture) and Geography, but different Institutions?
  *   **Decision Rule:**
      *   If **Yes** (e.g., North/South Korea, Dominican Rep/Haiti): Compare outcomes. If outcomes diverged sharply when institutions diverged, **Institutions** get the weight. Culture is controlled for.
      *   If **No** (e.g., The country is unique in its region/culture): You cannot rule out Culture. Keep Culture in play.
      *   *Warning:* If the "Twin" also has different Geography, the test is invalid.

  #### Step 3: The Mechanism Trace (Validate the Story)
  *   **Ask:** Write down the specific chain of events. "Policy X was passed in Year Y, which changed Incentive Z, which led to Outcome W."
  *   **Decision Rule:**
      *   If you can name the **specific law, agency, or rule** (Institutions): The story is testable.
      *   If you rely on phrases like "societal attitude," "national character," or "corrupt mindset" (Culture): Stop. Can you point to a specific behavior that exists *outside* of economic incentive? If not, recode as Institutions.
      *   If you rely on "disease burden" or "transport costs" (Geography): Can you show data that these costs actually blocked the specific project? If not, it's hand-waving.

  #### Step 4: The Intervention Counterfactual (The Fund Test)
  *   **Ask:** If our Fund gave $500 million to fix the "cause" you identified, would the outcome change in 5 years?
  *   **Decision Rule:**
      *   If **Yes**: It is likely an Institutional cause. (Institutions are the only one of the three we can actually buy/change).
      *   If **No** (e.g., "We need to change the culture of trust"): You have identified a constraint, not a cause you can fix. Mark as **Not Identifiable for Policy Purposes**.
      *   If **No** (e.g., "They are landlocked"): You have identified a constraint. Mark as **Geography**.

  #### Step 5: The Commitment Gate
  *   **Review:** Look at your weights from Steps 1–4.
  *   **Decision:**
      *   **Clean Call:** One factor scores >60% and survives the Mechanism Trace. **Write the diagnostic committing to that factor.**
      *   **Muddy Call:** Two factors are tied (e.g., Oil Wealth vs. Weak Courts), and you cannot separate them using the Twin Test. **Write "Not Identifiable."**
      *   **The "Uncomfortable" Call:** The evidence points to Culture/Geography, but the Fund wants Institutions. **Write the truth.** Add a memo: "We can fund institutional reforms, but our model suggests they will fail unless [Geo/Culture] constraint is acknowledged."

  ***

  ### Part 3: Running the Procedure

  Here is how this plays out in practice. I have selected two countries. One is a textbook case where the procedure works cleanly. The second is a case where the procedure will tell you something your committee does not want to hear.

  #### Case 1: Botswana (The Clean Call)
  *Context:* Post-independence growth miracle in a resource-rich African nation.
  *Committee Prior:* "Good governance matters."

  **Step 1: Time-Variance**
  *   *Trajectory:* Massive growth from 1966–1990s.
  *   *Geography:* Landlocked, semi-arid, diamonds found in 1967.
  *   *Result:* Geography changed (discovery of diamonds), but many countries find diamonds and crash (Resource Curse). Geography alone doesn't explain the *success*, only the *opportunity*.

  **Step 2: The Twin Test**
  *   *Twin:* Sierra Leone or DRC. Similar resource endowment (diamonds), similar colonial history, similar region.
  *   *Outcome:* Botswana grew; twins collapsed into civil war/stagnation.
  *   *Result:* Culture is roughly similar (post-colonial African states). Geography is similar (mineral wealth). The divergence is political. **Institutions win.**

  **Step 3: Mechanism Trace**
  *   *Chain:* Diamond rights nationalized (Law) -> Revenue went to budget (Agency) -> Spending on education/cattle (Policy) -> Growth.
  *   *Result:* Clear institutional mechanism. Not just "honest culture."

  **Step 4: Intervention Counterfactual**
  *   *Question:* If we fund budget transparency and property rights, does it help?
  *   *Answer:* Yes, that is exactly what they did.

  **Step 5: Commitment**
  *   *Verdict:* **Institutions (80%)**.
  *   *Diagnostic Line:* "Botswana's trajectory is driven by the institutional decision to manage resource rents through state budgeting rather than private capture. Geography provided the fuel, but Institutions built the engine."
  *   *Committee Reaction:* Happy. Confirms their prior. Safe to fund.

  #### Case 2: Nigeria (The Uncomfortable Call)
  *Context:* Africa's largest economy, chronic underperformance despite oil wealth.
  *Committee Prior:* "We need to fix the institutions (anti-corruption, tax collection) to unlock growth." (This justifies decades of governance lending).
  *Your Discomfort:* You suspect the Fund is pouring money into a black hole because the problem isn't just "rules," it's the structure of the economy itself.

  **Step 1: Time-Variance**
  *   *Trajectory:* Volatile. Booms when oil is high, busts when low.
  *   *Geography:* Massive oil reserves (Niger Delta).
  *   *Result:* Trajectory tracks Oil Prices (Geography/Commodity) more closely than it tracks Governance Reforms (Institutions). When institutions improved slightly in the 2010s, growth still crashed with oil prices.
  *   *Weight:* Geography/Economy Structure gets heavy weight.

  **Step 2: The Twin Test**
  *   *Twin:* Indonesia or Venezuela?
  *   *Problem:* Indonesia managed oil better. Venezuela did not.
  *   *Culture Check:* Nigeria has deep ethnic fragmentation (North/South, Muslim/Christian). Indonesia is also fragmented.
  *   *Result:* No clean twin. We cannot rule out that the *type* of fragmentation (Culture) makes the Institutions impossible to enforce.

  **Step 3: Mechanism Trace**
  *   *Committee Story:* "Corruption reduces investment."
  *   *Your Trace:* You try to find a specific reform that failed. You find that tax collection fails not because the law is bad, but because the elite bargain relies on distributing oil rents to keep the peace among ethnic groups.
  *   *Problem:* Is this "Bad Institutions" or "Rational Culture/Political Settlement"?
  *   *Result:* The "Institution" (tax code) is subservient to the "Culture/Politics" (patronage network). You cannot separate them.

  **Step 4: Intervention Counterfactual**
  *   *Question:* If the Fund gives $500M to improve tax administration (Institutions), will revenue rise?
  *   *Answer:* Historically, no. Because the elite *choose* not to collect taxes to maintain stability.
  *   *Result:* The Institutional lever is broken by the Political/Cultural reality.

  **Step 5: Commitment**
  *   *Verdict:* **Not Identifiable (Institutions vs. Political Culture).**
  *   *Diagnostic Line:* "While institutional weaknesses are evident, they are symptoms of a deeper political settlement based on resource distribution. Reforms targeting administrative capacity without addressing the rent-distribution mechanism are unlikely to sustain growth. We cannot isolate Institutions as the independent causal driver."
  *   *Committee Reaction:* **Hostile.**
      *   *Why:* This tells the Investment Committee that their main tool (governance loans) might be useless. It suggests the problem is structural (Oil + Ethnic Bargain), which they cannot fix.
      *   *Why the Procedure is Right:* If you commit to "Institutions" here, you are lying. You are predicting that fixing the tax authority will fix the economy. History shows it won't, because the tax authority is *supposed* to be weak to allow the patronage to function.
      *   *Your Discomfort:* You know this diagnostic might get bounced by the Senior Economist because it kills a deal. But if you sign it, you protect the Fund from throwing good money after bad. The procedure forces you to admit that the "Institutional Story" is a policy wish, not a causal finding.

  ### Summary for the Senior Economist
  When you hand this in, attach a cover note:
  *"I ran the Whiteboard Test on this diagnostic. In [Country A], the causal chain is clear. In [Country B], the test returned 'Not Identifiable' because institutional reforms are endogenous to the political settlement. I have flagged this risk in Section 4. I am committing to this assessment because claiming institutional causality here would fail the Intervention Counterfactual."*

  This shows you aren't hedging; you're applying rigor. It gives them cover if the project fails, which is ultimately what they care about.
