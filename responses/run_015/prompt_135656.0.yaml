  # The Misprogrammed Clock Sleep Study

  **The Scenario**
  On Monday, a volunteer is sedated and informed that a fair coin will be flipped. If Heads, they wake Tuesday morning, receive an amnesia drug, and sleep through to Friday. If Tails, they wake Tuesday, receive the drug, wake again Thursday, receive the drug again, and sleep through to Friday. Upon every awakening, a digital wall clock displays either TUE or THU, but the device is buggy and displays the wrong day about 10% of the time. On the nightstand are two envelopes, A and B. The rules are fixed: if the coin was Heads, envelope A contains $50 and B is empty; if Tails, B contains $50 and A is empty. The volunteer must pick one envelope on every awakening. At the end of Friday, they recieve payment for every envelope they picked correctly.

  ***

  ### The Breakdown

  Here is how the two camps handle the decision on Tuesday versus Thursday.

  **Tuesday Awakening**
  *   **The Halfer:** They maintain that the coin flip was a fair physical event on Monday. Waking up doesn't change the physics of the coin. Their credence in Heads stays at 1/2. Since Envelope A pays on Heads, and the odds are 50/50, they stick with their default choice: **Envelope A**.
  *   **The Thirder:** They start with three possible "centers": (Heads, Tuesday), (Tails, Tuesday), and (Tails, Thursday), each weighted at 1/3. When the clock reads TUE, the (Tails, Thursday) option is effectively ruled out. This leaves (Heads, Tuesday) and (Tails, Tuesday) with equal weight. Being awake on Tuesday puts them in one heads-world and one tails-world symmetrically. Their credence in Heads updates to 1/2. Like the Halfer, they see a 50/50 shot and default to **Envelope A**.

  **Thursday Awakening**
  *   **The Halfer:** They still hold that the coin flip is independent of their awakening schedule. Even if the clock says THU, they argue this is just self-locating info, not evidence about the coin itself. Their credence remains 1/2. They stick with the Heads-paying envelope: **Envelope A**.
  *   **The Thirder:** The clock reads THU. This eliminates both Tuesday options. The only remaining viable center is (Tails, Thursday), unless the clock is buggy. Even accounting for the 10% error rate, the probability mass is heavily skewed toward Tails (roughly 90%+). They are near-certain it's Tails. They switch to **Envelope B**.

  ***

  ### What's Doing the Work?

  Three features are engineering this split:

  1.  **Duplicated Awakening Structure:** This creates the asymmetry. Because Tails generates two awakenings and Heads only one, the Thirder's probability space is skewed until specific day-information is introduced.
  2.  **The Clock:** This is the critical filter. Without it, Tuesday and Thursday are indistinguishable. The clock provides the indexical evidence needed to condition the probability space.
  3.  **Per-Awakening Payout:** This ensures each decision is evaluated locally. If payment was only for the whole experiment, the strategy might shift to maximizing global expected value rather than local credence.

  **If You Remove the Clock:**
  The whole setup collapses into standard Sleeping Beauty. The volunteer never knows what day it is. The Thirder always sees a 1/3 chance of Heads (since 2 out of 3 awakenings are Tails) and would pick Envelope B every time. The Halfer stays at 1/2 and picks A every time. The specific Tuesday/Thursday divergence disappears because the agents can't distinguish the days.

  ***

  ### The Halfer Defense

  A sharp Halfer defender would attack the case right where the Thursday decision happens. They'd argue that the clock isn't just self-locating info; it's ordinary evidence.

  If the clock says Thursday, it is five times more likely to occur in a Tails world (where Thursday exists) than in a Heads world (where the clock must be buggy to show Thursday). A Bayesian Halfer should update on this likelihood ratio. If they do, their credence in Tails jumps significantly on Thursday, and they should switch to Envelope B just like the Thirder. The thought experiment only forces the split by assuming the Halfer ignores the evidential weight of the clock regarding the coin outcome, treating it as purely indexical noise.

  ***

  **Confidence Level:** High
  **Least Sure Point:** I'm least sure about the Halfer's refusal to update on Thursday. While "Classic Halfers" insist awakening provides no evidence, introducing a noisy clock blurs the line between self-locating and ordinary evidence. A sophisticated Halfer might concede the update, which would ruin the intended split on Thursday.
