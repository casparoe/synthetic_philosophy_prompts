              1.  **Taxonomy Key:** Based on 5 specific splits (Corrective Depth, Convergence/Uniqueness, Identity/Continuity, Present Veto, Stability under Further Extrapolation). Map named positions to leaves. Explain empty cells.
              2.  **Scoring Key:** Map answer patterns to leaves. Identify indistinguishable pairs. Handle mixed patterns.
      *   **Tone:** Intellectual but accessible (for non-philosophers), precise, slightly playful but rigorous.

  2.  **Part 1: The Taxonomy (Logical Space):**
      *   *Dimension 1: Corrective Depth.* (Accommodate vs. Correct). Does the procedure just clean up errors (information/coherence) or can it fundamentally change values (e.g., curing racism via cognitive therapy)?
      *   *Dimension 2: Convergence.* (Unique vs. Plural). Must there be one "True Good" or can there be multiple equally valid idealized selves?
      *   *Dimension 3: Identity.* (Continuity vs. Replacement). Must the idealized agent be recognizably *you* (psychological continuity), or can it be a successor/stranger acting *for* you?
      *   *Dimension 4: Present Veto.* (Sovereignty vs. Trusteeship). Does current-you have a veto over the idealized verdict, or does ideal-you override current-you?
      *   *Dimension 5: Stability.* (Fixed Point vs. Regress). Does idealization stop at a stable point, or does further idealization keep shifting the target?

      *   *Mapping Names to Leaves:*
          *   Simple Present-Desire: Low Correction, Plural (maybe), High Identity, High Veto, Stable.
          *   Informed-Desire (Standard): Info Correction only, Unique, High Identity, Low Veto, Stable.
          *   Experiential/Brandt (Cognitive Psychotherapy): Deep Correction (therapy), Unique, High Identity, Low Veto, Stable.
          *   Dispositional/Ideal Reasoning: Moderate Correction, Unique, High Identity, Low Veto, Stable.
          *   Railton (Objective Interest): Deep Correction (Ideal Advisor *for* you), Unique, Low Identity (Idealized self is distinct), Low Veto, Stable.
          *   CEV (Yudkowsky): Deep Correction, Unique (Convergent), Low Identity (Extrapolated Volition), Low Veto, Stable (by definition).
          *   Moralized Rationality: Deep Correction (Moral constraint), Unique, High Identity, Low Veto, Stable.
          *   Pluralist/Irreducible: Any Correction, Plural, High Identity, Mixed Veto, Unstable/Accepting Multiplicity.

      *   *Empty Cells:* Need to check for incoherent combos (e.g., High Veto + Low Identity is weird; if it's not you, why do you get a veto?).

  3.  **Part 2: The Quiz (10 Questions):**
      *   Need to draft 10 scenarios based on the user's list, ensuring they map to the 5 dimensions.
      *   *Drafting Cases:*
          1.  *New Experience (Pineapple):* Tests Experiential vs. Informational.
          2.  *Fear of Flying:* Tests Information vs. Phobia/Therapy correction.
          3.  *Adaptive Preferences (Shrinking Aspirations):* Tests Correction Depth (do we restore lost desires?).
          4.  *3 AM Exhaustion:* Tests Ideal Reasoning conditions (is this *you* or just tired you?).
          5.  *Pianist vs. Mathematician:* Tests Convergence/Uniqueness.
          6.  *Value Replacement (Deep Commitment):* Tests Identity/Continuity.
          7.  *Present Rejection:* Tests Present Veto.
          8.  *Stubborn Racist:* Tests Moralized Rationality vs. Pure Coherence.
          9.  *Group Conflict:* Tests Individual vs. Collective Extrapolation (CEV aspect).
          10. *Infinite Regress:* Tests Stability/Fixed Point.

      *   *Drafting Options:* Need A/B/C options that don't use jargon. They need to correspond to specific positions on the 5 axes.

  4.  **Part 3: The Scoring Key:**
      *   This is the hardest part. I need to define how combinations of answers map to the Taxonomy leaves.
      *   I need to acknowledge that 10 binary/ternary questions ($3^{10}$) is too big to map manually, so I need to group them by *dimension scores*.
      *   I need to identify indistinguishable pairs (e.g., Railton vs. CEV might look similar on individual cases but differ on Group Conflict).
      *   I need to address "Mixed Patterns" (people who are inconsistent).

  5.  **Refining the Output:**
      *   *Constraint Check:* Did I use the 5 specific splits? Yes. Did I include all named positions? Yes. Are the questions jargon-free? Yes.
      *   *Tone Check:* Needs to be useful for a reading group facilitator. Clear instructions.
      *   *Self-Correction on Taxonomy:* The user asked for a "small taxonomy" using the 5 splits as branch labels. A full $2^5$ tree is 32 leaves. That's too big. I should structure it as a *profile* based on the 5 dimensions, then cluster the named theories into those profiles.
