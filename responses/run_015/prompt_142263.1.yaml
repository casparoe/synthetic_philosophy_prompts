prompt: |-
  hey — so I'm a 3rd-year PhD student (ML, mostly preference learning and RLHF-adjacent stuff; my advisor is more theory than empirics) and I've somehow ended up as the token technical person on the advisory board of a small funder. They've got around $2M to spend over three years, and they've decided to spend it on the *conceptual* side of inferring what people want from what they do — IRL, reward inference, preference learning, whatever you want to call it. Explicitly not more benchmarks, not more scaling, and they can't fund compute, so anything that needs a cluster is off the table. Realistically it's about five or six postdoc-years, maybe a couple of senior people part-time, and they want to be able to say at the end that they changed what people think is worth working on, not that they produced twelve papers.

  What I keep going in circles on is what to actually put in the call. Some candidates I've been kicking around:

  - the identifiability stuff. If behavior is generated by something roughly like a boundedly rational agent, the reward is pretty badly underdetermined: lots of rewards fit the same behavior, and whole families of transformations of a reward give identical predictions. So what exactly is the estimand? Is "the human's reward function" even a coherent target, or should we be estimating something else — what they'd choose with better information, what they'd endorse on reflection, some counterfactual-choice target? And how do you decide between those without already knowing the answer?

  - what I've started calling the inference-aware demonstrator problem: once people know their behavior is being used to train a system (labelers, users who've read one news article about algorithms), the behavior starts encoding their *theory of the learner*, not just their preferences. Clicks get partly strategic, partly performed. Is this a real problem for the whole framework, or a measurement annoyance you can design around?

  - whose behavior counts. The machinery is built for a single agent, but deployed systems act for a population, and the people generating the data usually aren't the ones the system's actions land on.

  - misspecification. If the human isn't rational in the way the model assumes, you get a confident, wrong reward, and I don't think anyone has a good story for telling that apart from success.

  I defintely don't want a survey and I really don't want a reading list — I want a defended agenda. Which of these (or something I'm not seeing) should they prioritize, in what order, and on what criteria: how upstream is it of the rest, is it tractable in three years by theorists and philosophers with no compute, is it neglected, and how much downstream practice would actually change if it got answered? Which are overrated, or don't really follow from the setup at all? What evidence over the next couple of years should move things up or down the list? And I'd also like to hear what you'd tell them is a flat-out waste of the money, with the reasoning for killing it.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in ML (Preference Learning/RLHF). Advisor is theory-heavy.
      *   **Role:** Token technical person on an advisory board for a small funder ($2M over 3 years).
      *   **Funder's Goal:** Conceptual side of inferring wants from behavior (IRL, reward inference, preference learning). *Not* benchmarks, scaling, or compute-heavy work.
      *   **Capacity:** ~5-6 postdoc-years + some senior part-time time.
      *   **Success Metric:** Change what people think is worth working on (paradigm shift), not paper count.
      *   **User's Request:** A defended agenda. Prioritize topics, order them, define criteria (upstreamness, tractability, neglectedness, downstream impact), identify evidence to watch, and identify what *not* to fund.
      *   **User's Candidates:** Identifiability, Inference-Aware Demonstrator (Goodhart/Strategic behavior), Aggregation/Whose Behavior, Misspecification.

  2.  **Evaluate the Candidates against Constraints:**
      *   **Constraint:** No compute, theory/philosophy heavy, 3-year horizon, high leverage on *thinking*.
      *   **Candidate 1: Identifiability (The "What are we estimating?" problem).**
          *   *Pros:* Extremely upstream. If the target is ill-defined, everything else is garbage. Fits theory/philosophy well.
          *   *Cons:* Can get very abstract/mathematical without connecting to practice.
          *   *Verdict:* High priority. Foundational.
      *   **Candidate 2: Inference-Aware Demonstrator (Strategic/Performative behavior).**
          *   *Pros:* Very relevant to RLHF (labelers game the system). Theoretically tractable (game theory + IRL).
          *   *Cons:* Might be solved by "better data collection protocols" rather than deep theory.
          *   *Verdict:* Medium-High priority. Practical implication is clear.
      *   **Candidate 3: Whose Behavior Counts (Aggregation/Population).**
          *   *Pros:* Crucial for deployment.
          *   *Cons:* Often turns into social choice theory (which is well-trodden) or policy (which this fund might not want). Hard to solve conceptually without empirical validation of *which* aggregation matters.
          *   *Verdict:* Medium priority. Important, but maybe secondary to defining the individual reward first.
      *   **Candidate 4: Misspecification (Rationality assumptions).**
          *   *Pros:* The biggest practical failure mode.
          *   *Cons:* "Robust IRL" is already a hot topic. Hard to make conceptual progress without empirical testing (which they can't fund).
          *   *Verdict:* High risk. Needs careful framing to avoid just being "more robust RL."

  3.  **Develop the Defended Agenda (The "Pitch"):**
      *   *Goal:* Shift the field from "How do we fit a reward function?" to "What does it mean to fit a reward function, and when is it valid?"
      *   *Core Theme:* **The Semantics of Reward.** Move from *estimation* to *interpretation*.
      *   *Structure:*
          1.  **Priority 1: The Normative Target (Identifiability + Philosophy).** Before inferring, define *what* is being inferred. Is it revealed preference? Idealized preference?
          2.  **Priority 2: The Strategic Data Source (Inference-Aware Demonstrator).** If the target is defined, how does the data generation process corrupt it?
          3.  **Priority 3: Robustness to Structural Error (Misspecification).** If the model of the human is wrong, what does the output *mean*? (Connect back to Priority 1).
          4.  **De-prioritize:** Aggregation (Whose Behavior). It's important but secondary to defining the individual unit. Also, "Better Optimizers" (waste of money).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the unique position. $2M is small for ML but huge for theory/philosophy. The goal is *conceptual clarity*, not SOTA.
      *   **The Core Thesis:** The field is optimizing the wrong loss function because it hasn't defined the variable. The agenda should be "The Semantics of Inferred Reward."
      *   **Priority 1: The Identifiability/Normative Cluster (The "What").**
          *   *Why:* Upstream. If you don't know what you're solving, solving it faster is useless.
          *   *Tractability:* High for theorists/philosophers. No compute needed.
          *   *Impact:* Changes how papers are written (defining the estimand).
          *   *Specific Ask:* Formalize "Reflective Equilibrium" vs. "Revealed Preference" in IRL terms.
      *   **Priority 2: The Performative Demonstrator (The "How").**
          *   *Why:* RLHF data is already contaminated. This is a game-theoretic breakdown of the data generation process.
          *   *Tractability:* Mechanism design + IRL.
          *   *Impact:* Changes data collection protocols.
      *   **Priority 3: Misspecification as Semantic Drift (The "When it breaks").**
          *   *Why:* Standard robustness is "make it work." Conceptual robustness is "what does it mean when it fails?"
          *   *Twist:* Don't fund "robust IRL." Fund "Interpretability of Misspecified Rewards."
      *   **What to Cut (The Waste):**
          *   *Aggregation/Social Choice:* Too political/policy-focused for this specific technical remit right now. Solve the individual first.
          *   *New Algorithms for Existing Targets:* Don't fund better optimizers for ill-defined targets.
          *   *Empirical Benchmarks:* Explicitly forbidden by funder, but worth reiterating.
      *   **Evidence to Watch:**
          *   Signs the field is stuck (plateauing performance).
          *   Signs of strategic behavior in labeling.
          *   Philosophical pushback on "preferences."

  5.  **Refining the Tone:**
      *   Needs to be peer-to-peer (PhD to PhD).
      *   Direct, slightly opinionated (defended agenda), but grounded.
      *   Avoid jargon where possible, but use correct terminology (identifiability, performative prediction, etc.).
      *   Acknowledge the advisor's theory bias (leverage it).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Whose Behavior" really worth cutting?
      *   *Correction:* It's not about cutting it entirely, but making it Phase 2. You can't aggregate ill-defined individual rewards. So, prioritize Individual Semantics first.
      *   *Critique:* Is $2M enough for philosophy + ML theory?
      *   *Correction:* Yes, for 5 postdocs over 3 years. That's the sweet spot for deep work.
      *   *Critique:* How do we ensure they don't just write philosophy papers?
      *   *Correction:* Require "Formalization." The output must be mathematical definitions that ML researchers can plug into loss functions, even if they don't solve the optimization yet.

  7.  **Final Polish:** Check against the user's specific questions (order, criteria, evidence, waste). Ensure the "Defended Agenda" feels cohesive. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a high-leverage position. $2M over three years is peanuts for empirical ML, but it is *significant* capital for theory/philosophy work. If you buy 5-6 sharp postdoc-years and protect them from the "publish or perish" churn, you can actually shift the Overton window of the field.

  Your funder's constraint (no compute, conceptual focus) is actually a feature. It forces you to address the **semantics** of reward inference rather than the **optimization** of it. The field is currently obsessed with fitting $R$ better, without agreeing on what $R$ *is*.

  Here is the defended agenda I would submit. It prioritizes **upstream conceptual clarity** over downstream robustness, because you cannot be robust to misspecification if you haven't specified the target.

  ### The Core Thesis: "The Semantics of Inferred Reward"
  The call should not be framed as "Better Inverse Reinforcement Learning." It should be framed as **"The Validity Conditions of Preference Inference."**

  The goal is to move the field from asking *"How do we fit a reward function to this data?"* to *"Under what conditions does a fitted reward function correspond to a coherent construct of human welfare/intent?"*

  ---

  ### Priority 1: The Normative Target (Identifiability & Philosophy)
  **Status:** **Highest Priority.**
  **Criteria:** Extremely upstream. High tractability for theorists/philosophers. High neglectedness (everyone assumes the target is "what they did").
  **Downstream Impact:** If this isn't solved, every RLHF paper is optimizing a loss function with undefined semantics.

  **The Problem:** As you noted, behavior underdetermines reward. But the deeper issue is that "reward" is a conflation of at least three distinct constructs:
  1.  **Revealed Preference:** What they actually chose (including errors).
  2.  **Idealized Preference:** What they would choose with perfect information/cognitive capacity.
  3.  **Normative Endorsement:** What they believe they *should* choose.

  Current IRL/RLHF assumes #1 is a noisy proxy for #2. This is often false. Sometimes #1 is a proxy for #3 (signaling). Sometimes #1 is pure noise (twitches).

  **The Agenda:**
  *   Fund formalizations of these distinct targets. Don't just write philosophy; write **definitions that can be plugged into a loss function.**
  *   Example project: "Formalizing Reflective Equilibrium for IRL." Can we define a fixed-point operator on preferences that represents 'reflection' without requiring infinite compute?
  *   Example project: "The Identifiability of Error Models." Prove which classes of human irrationality (Boltzmann, hyperbolic, quantal) are distinguishable from reward structure given finite trajectories.

  **Evidence to move this up:** Papers start explicitly stating which "preference" they are targeting.
  **Evidence to move this down:** Consensus emerges that "prediction is all that matters" (instrumentalism wins).

  ### Priority 2: The Performative Demonstrator (Strategic Data)
  **Status:** **High Priority.**
  **Criteria:** Upstream of data collection. Tractable via game theory. High neglectedness (most assume i.i.d. static humans).
  **Downstream Impact:** Changes how RLHF data is collected and weighted.

  **The Problem:** You called this the "inference-aware demonstrator." In econ, this is *Goodhart's Law* or *Lucas Critique*. In ML, it's *Performative Prediction*.
  If a labeler knows their input trains a model that will affect their future feed/work, their click is no longer a preference signal; it is a **move in a game against the learner.**

  **The Agenda:**
  *   Model the human as a strategic agent optimizing their *own* reward given the learner's update rule.
  *   Derive conditions under which IRL converges to the true reward vs. the "gamed" reward.
  *   Design **mechanism-compatible data collection.** Instead of "how do we infer reward from clicks?", ask "what payment/feedback structure incentivizes truthful revelation of reward?" (This bridges IRL and Mechanism Design).

  **Evidence to move this up:** Empirical papers show labeler behavior shifting after policy updates (there is already anecdotal evidence of this in RLHF).
  **Evidence to move this down:** Proof that strategic behavior is negligible compared to noise (unlikely).

  ### Priority 3: Misspecification as Semantic Drift
  **Status:** **Medium Priority (with a specific framing).**
  **Criteria:** Critical for safety. Tractable theoretically.
  **Downstream Impact:** Prevents confident wrongness.

  **The Problem:** Most "robust IRL" work tries to make the algorithm survive misspecification. This is the wrong conceptual frame. If the human model is wrong, the output isn't a "noisy reward"; it's a **category error.**
  The agenda shouldn't be "Robust IRL." It should be **"Interpretability of Misspecified Rewards."**

  **The Agenda:**
  *   If we assume a rational agent but the human is myopic, what function does the IRL algorithm *actually* return? (It usually returns a reward that replicates the myopia).
  *   Can we derive **diagnostics** that flag when the data is inconsistent with *any* rational agent model, without needing ground truth? (e.g., violation of revealed preference axioms in the data stream).
  *   This turns misspecification from an engineering bug into a detectable semantic signal.

  **Evidence to move this up:** Systems start failing in "confidently wrong" ways in deployment.
  **Evidence to move this down:** Simple regularization techniques empirically solve the failure modes (makes the theory less urgent).

  ---

  ### What to De-Prioritize (The "Phase 2" List)

  **1. Whose Behavior Counts (Aggregation/Social Choice)**
  *   **Reasoning:** This is vital, but it is **second-order.** You cannot aggregate individual reward functions if you haven't defined what an individual reward function *is* (Priority 1). If you fund this now, you get social choice theory applied to ill-defined utilities.
  *   **Condition:** Fund this only after Priority 1 yields a coherent definition of "individual welfare."

  **2. New Optimization Algorithms for Existing Targets**
  *   **Reasoning:** This is "more papers, less change." We have enough optimizers. We don't need a better SGD for an ill-defined loss.
  *   **Exception:** Unless the algorithm is specifically designed to test a conceptual hypothesis from Priority 1 (e.g., an optimizer that explicitly separates 'error' from 'preference').

  ---

  ### What to Kill (Flat-Out Waste of Money)

  **1. "Human-Aligned Benchmarks"**
  *   **Reasoning:** Explicitly against the funder's remit, but worth stating: Benchmarks reify the current paradigm. They encourage optimization for the metric, not understanding of the construct. $2M on benchmarks buys you a leaderboard, not a paradigm shift.

  **2. Empirical "Does RLHF Work?" Studies**
  *   **Reasoning:** Without compute, you cannot run the necessary A/B tests to answer this empirically. Theoretical bounds on empirical questions are weak. This burns cash on inconclusive small-scale studies.

  **3. Pure Philosophy without Formalization**
  *   **Reasoning:** If the output is a paper that stays in a philosophy journal, you failed the "change what ML people work on" metric. The deliverable must be **mathematical definitions** or **theorems** that an ML researcher can read and say, "Oh, my loss function is missing this term."

  ---

  ### The Call Structure (Drafting Advice)

  When you write the RFP/Call, avoid standard ML terminology like "SOTA" or "Performance." Use language that signals the conceptual shift:

  *   **Title:** *Foundations of Preference Inference and Normative Estimation.*
  *   **Key Question:** "What are the validity conditions under which behavioral data licenses inferences about human intent?"
  *   **Required Deliverable:** Not just papers, but **formal problem statements** that can be adopted by empirical labs.
  *   **Ideal Candidate:** A theorist who reads philosophy, or a philosopher who reads proofs. (This is rare; look for people in Econ/CS boundaries).

  ### Summary of the Defense
  If the board asks why we aren't funding aggregation or robustness first:
  > "We are currently building bridges to nowhere. Aggregation requires defined units; robustness requires a defined target. We are spending these three years defining the unit and the target. If we solve Priority 1, the empirical community will naturally pivot to the new definitions. If we fund Priority 3 without Priority 1, we just get better ways to be wrong."

  This agenda leverages your advisor's theory strength, respects the no-compute constraint, and targets the highest-leverage bottleneck in the field: the fact that we are optimizing variables we haven't defined.
