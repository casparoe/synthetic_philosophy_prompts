      *   **The Antagonist's Claims:**
          1.  Macro explanations (culture, institutions, markets) are placeholders to be replaced by individual beliefs/incentives.
          2.  Funding should be denied to projects stopping at the macro level.
      *   **The User's Goal:** Audit the analogy rather than argue back emotionally.
      *   **Specific Requirements:**
