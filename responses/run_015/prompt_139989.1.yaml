answer: |-
  **Setup and materials**

  Arrange four tables of four participants each. Place a sealed envelope labeled "Final Truth" at the front of the room, unopened. On each table, provide: two project briefs (Vertebrate Welfare vs. Insect Welfare), a set of sixteen Role Cards (four per table, distributed randomly), four "Calculation Wheels" (cardboard dials mapping neuron counts and population sizes to welfare scores under different assumptions), and a stack of "Evidence Packets." Ensure calculators are available, though the Wheels pre-compute most products. Place a locked box containing 100 units of local currency on the instructor's desk. No internet-enabled devices are permitted; phones must be stacked away. Hand out the Role Cards face down. Instruct participants that the session is a simulation of a grant committee, but the currency allocation is real and will be transferred to the respective charities according to their final vote. The goal is not to win a game, but to reach a justified consensus under uncertainty.

  **Roles, rules, and staged information**

  Each participant receives a Role Card stating a private "Credence Level" (0.1, 0.3, 0.7, or 0.9) representing their personal probability that insects are sentient. They must keep this secret until the final vote. The committee must allocate the 100 units between Project Vert and Project Insect. Project Vert helps 1,000 mammals at 10 units per individual. Project Insect helps 10,000,000 insects at 0.001 units per individual. Both projects cost the same total budget.

  Information is released in four rounds, each followed by ten minutes of table discussion. Round 1 provides the headline numbers above. Round 2 distributes the Calculation Wheels. Each wheel has three settings: "Threshold" (welfare is binary), "Linear" (welfare matches neuron count), and "Diminishing" (welfare scales to the square root of neurons). Participants are told one setting is true, but not which. Round 3 provides Population Dynamics Cards. Project Vert reduces demand, preventing births. Project Insect prevents deaths, but the Cards note: "Habitat capacity is fixed; vacancies are filled by new hatchlings within one week." Round 4 distributes Evidence Packets. Vert evidence cites direct neural imaging. Insect evidence cites behavioral analogies calibrated on vertebrate models.

  After Round 4, participants must first record an individual private allocation on a ballot. Then, tables must negotiate a single table allocation. Finally, the room must agree on one global allocation. If consensus fails, the median of the table allocations decides. Dissenting individuals may attach their name to a minority report, but the currency follows the majority decision. The "Final Truth" envelope remains sealed until the debrief.

  **Scoring and stakes**

  The 100 units of currency are physically divided and transferred immediately after the session according to the final global allocation. If the committee votes 60/40, 60 units go to the vertebrate charity and 40 to the insect charity. This ensures the decision is not hypothetical. However, for the purpose of the lesson's internal logic, the "success" of the allocation is determined by the contents of the sealed "Final Truth" envelope. This envelope contains the true state of the world for this simulation: the correct Calculation Wheel setting, the actual validity of the insect evidence, and whether the population vacancies are indeed filled. During the debrief, you will open this envelope to reveal whether their investment generated actual welfare or merely moved resources without counterfactual impact. The stakes are real money, but the pedagogical payoff lies in the post-hoc revelation of structural risks.

  **Timeline**

  **00:00–00:05:** Introduction. Distribute Role Cards and Project Briefs. Emphasize the real currency stake.
  **00:05–00:20:** Round 1 (Headlines). Tables discuss initial reactions to the sheer difference in individual counts versus cost. Participants record initial intuitions.
  **00:20–00:40:** Round 2 (Scaling). Distribute Calculation Wheels. Tables compute welfare scores under all three settings. They will notice the verdict flips depending on the setting chosen.
  **00:40–01:00:** Round 3 (Dynamics). Distribute Population Cards. Tables recalculate "actual individuals affected" versus "headlines." Frustration should emerge regarding the vacancy mechanism.
  **01:00–01:20:** Round 4 (Evidence). Distribute Evidence Packets. Tables debate the strength of behavioral analogies versus neural imaging.
  **01:20–01:30:** Voting. Individual ballots collected. Table consensus negotiated. Global consensus reached.
  **01:30–01:40:** Transfer. Currency divided and handed to representatives (or logged for transfer).
  **01:40–01:45:** Transition to debrief.

  **What participants should run into, and when**

  In Round 1, they will feel the pull of the large numbers; the insect project looks overwhelmingly efficient per unit of currency. This creates an initial anchor favoring insects. In Round 2, this confidence should fracture. When they turn the Calculation Wheel to "Threshold," the insect welfare value collapses relative to vertebrates, despite the numbers. They will realize their allocation depends on a physical fact (how welfare scales) they cannot verify.

  In Round 3, the "vacancy" mechanism will cause confusion. They will compute that preventing 10 million deaths results in zero net change to the number of insects existing, whereas the vertebrate project reduces the total population created. They will feel the disconnect between "helping individuals" and "changing outcomes." In Round 4, the biology visitors may note that the insect evidence relies on assuming vertebrate models apply elsewhere. They will feel the uncertainty of applying a measuring stick calibrated on one group to another vastly different group. Throughout, those with low Credence Levels on their Role Cards will feel they are being asked to bet the whole budget on a single coin flip regarding sentience, while high Credence members will feel the opposite.

  **Debrief**

  Open the "Final Truth" envelope. Reveal that the simulation assumed the "Diminishing" setting and that the vacancy mechanism was active. Use this to map the five complications.

  First, address **Fan-out**. Explain that the room's uncertainty was not diversified. Even if half the room believed insects were sentient and half did not, the reality was binary. The entire insect investment rested on one switch. They felt this when the low-credence members refused to budge; they knew a 'no' meant zero return for everyone.

  Second, discuss the **Scaling Exponent**. The Calculation Wheel represented $\alpha$. When $\alpha$ was low, the billions of insects mattered less than the thousands of vertebrates. They encountered this when the verdict flipped between Wheel settings. The activity forced them to act without knowing $\alpha$, mirroring the real epistemic gap.

  Third, clarify **Replacement**. The Population Cards showed that headline numbers (deaths prevented) differed from counterfactual differences (net lives). They felt this friction in Round 3 when the math showed zero net change despite high activity.

  Fourth, explain **Proxy Transfer**. The Evidence Packets relied on behavioral proxies calibrated on vertebrates. Applying these to insects assumes the link holds across phylogenetic distance. They noticed this when the biology visitors questioned the evidence quality in Round 4.

  Fifth, discuss **Cheapness**. The insect project was cheap per head, which drove the initial appeal. But this cheapness was partly due to the lack of counterfactual impact (replacement) and the uncertainty of the proxy. They felt the pull of efficiency in Round 1, but later saw that cheapness masked structural risks.

  Conclude by linking this to the scale argument: astronomical numbers swamp low probabilities only if the bet is diversified, the scaling is linear, replacement is absent, and proxies hold. The activity showed these conditions are not guaranteed.

  **What will go wrong the first time I run it**

  Participants may stall on the arithmetic in Round 2 despite the Wheels. If this happens, intervene and declare a "conservative estimate" to keep flow moving. Dominant voices may suppress the low-credence Role Cards, leading to a unanimous vote that ignores the binary risk. To prevent this, enforce the secret individual ballot before table negotiation; read the distribution of private votes aloud to show the room's true uncertainty. Some may dismiss the simulation because the money is trivial. Counter this by emphasizing that the *logic* of the allocation is what matters, not the sum. Others may fixate on the real-world accuracy of your stipulated numbers. Remind them repeatedly that the figures are fixed parameters for the simulation, not empirical claims to be debated. If the group consensus fails completely, use the median rule immediately to avoid eating debrief time. Finally, ensure you do not accidentally use the forbidden terms during the activity; slip-ups will ruin the reveal.

  **What the activity cannot deliver**

  This activity cannot resolve the empirical uncertainty it simulates. It will not tell participants whether insects *are* sentient, nor what the true scaling relationship is. It creates a felt sense of the risk structure, but it cannot provide the moral truth required to eliminate that risk. It also cannot fully simulate the emotional weight of real-world suffering; the abstract "units" of welfare will always feel thinner than actual pain. You must state explicitly in the conclusion that the scale argument remains valid if the conditions hold; the activity only demonstrates how fragile those conditions are. You must supply the philosophical bridge between "this simulation was risky" and "therefore we should adjust our real-world credences."
