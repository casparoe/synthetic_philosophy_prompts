      *   *The Individual:* The ethical agent who takes responsibility.
      *   *Leveling:* The process of reducing everyone to the lowest common denominator, destroying distinction and authority.
      *   *The Crowd:* Untruth. A collection of individuals who hide in the mass to avoid ethical accountability.
      *   *Numerical vs. Qualitative:* The Present Age cares about numbers (how many readers, how many protesters) rather than truth or ethical quality.

  3.  **Mapping the Actors (The "Fit"):**
