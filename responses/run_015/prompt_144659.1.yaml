  **8. Conclusion**

  So, to wrap this up. The main point of this paper is to challenge the assumption that we can measure AI impact without referencing human values. Current methods try to do this by measuring state distance, but state distance relies on value-laden ontologies. I'm proposing that we shift to measuring causal invariance. This focuses on whether the agent changes the rules of the world rather than just the state of the world.
  I think this is a stronger philosophical position because it aligns better with how we intuitively think about harm. We care more about breaking things than moving them. Breaking is a change in capacity; moving is a change in location.
  Over the next semester, I'll formalize this, test it in simple environments, and see if it holds water. I expect to find that it's not perfectly value-neutral, but it might be more robust than state-based measures. Even if it fails, the process of trying to define it will shed light on where values inevitably enter the safety equation.
  I'm excited about this because it feels like a fresh angle. Most people are tweaking the distance metric. I want to change the object being measured. Instead of measuring the shadow (the state), measure the object casting it (the causal mechanism).
  Hopefully, this proposal makes sense. I think there's enough meat here for a solid term paper. It connects technical AI safety with philosophical ontology, which fits the seminar theme. I'll keep the scope tight to ensure I actually finish it. The main risk is over-promising on the formalization, so I'll keep the math as simple as possible while still being rigorous.
