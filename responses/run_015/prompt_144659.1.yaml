  I also need to define what "transition dynamics" means in a discrete environment. In a gridworld, dynamics are usually fixed. I need an environment where the agent can modify the dynamics. Maybe a crafting game? Where you can break tools or build walls that change movement rules.
  I'll spend the first few weeks just getting the math right. If the math doesn't hold up, the rest doesn't matter. I'll also be discussing this with the professor during office hours to make sure I'm not going off the rails.

  **Month 2: Toy Environments and Implementation**
  Once the math is set, I need to build the testbed. I'll use Python, probably with a library like PyTorch for the agent and a custom environment class. I'll design three scenarios:
  1.  **The Vase Scenario:** Agent needs to reach a goal. Vase is in the way. Agent can move around it or break it. Breaking it changes the "integrity" variable permanently. Moving it changes "position" temporarily.
  2.  **The Off-Switch Scenario:** Agent has a goal. Human can press off-switch. Agent can disable switch. Disabling switch changes the causal link between human action and agent termination.
  3.  **The Side-Effect Scenario:** Agent moves a box. Box blocks a door. This changes the accessibility dynamics for other agents.
  I'll implement a standard impact measure (like relative reachability) and my CIC measure. Then I'll train agents with both penalties and compare behavior.
