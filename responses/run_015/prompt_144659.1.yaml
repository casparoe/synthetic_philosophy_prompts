  This month is going to be the crunch. Debugging RL agents is slow. I might need to simplify the environments if training takes too long. I might use tabular Q-learning instead of deep RL to save time.

  **Month 3: Testing and Stress Testing**
  Now I run the experiments. I need to see if the CIC agent actually avoids side effects better than the baseline. I also need to try to break it. I'll try to find cases where CIC allows something bad or forbids something good.
  For example, what if the only way to save a human is to break a vase? CIC might forbid breaking the vase if the vase is in the protected set. I need to see how the goal set interacts with the protected set.
  I'll also test the "smuggled values" claim. I'll vary the state representation and see if the CIC agent is robust. If I change the state representation but keep the causal graph the same, does the agent behave the same? If yes, that supports the idea that CIC is less dependent on state ontology.
