  **Title:** Beyond State Distance: A Proposal for Causal Invariance as a Value-Neutral Impact Measure

  **Student Name:** [Your Name]
  **Course:** AI Ethics & Philosophy Seminar
  **Date:** October 24, 2023

  **1. Introduction and Motivation**

  So, here's the thing. Everyone in AI safety seems to agree on one basic intuition: when we build powerful agents, we want them to do what we ask without messing up everything else in the process. We want the AI to make coffee, not rearrange the furniture, disable the off-switch, or accidentally change the stock market while trying to optimize for caffeine delivery. This is the problem of side effects, or what some people call the "low-impact" problem. The standard pitch from a lot of the technical alignment crowd is that we can solve this without solving the whole hard problem of value alignment. The idea is that we don't need to know exactly what humans value in full detail; we just need to penalize the AI for changing the world too much from some baseline. If the AI minimizes its "impact," it should theoretically leave the things we care about alone, simply becuase those things are part of the world state that gets changed.

  But I've been looking at the proposals floating around—things like relative reachability or attainable utility preservation—and I keep hitting this wall. They all claim to be value-neutral, but when you peel back the layers, they seem to rely on comparing world states. And to compare world states, you need a metric. And to have a metric, you need to decide which differences matter. Is a broken vase "farther" from the baseline than a moved vase? In most formulations, yes. But why? Because humans care about vases being intact. If you define distance in terms of pixel differences, maybe the moved vase is "farther" because more pixels changed. If you define it in terms of object properties, the broken vase is worse. Either way, you're smuggling in a judgment about what counts as a significant difference. You're implicitly encoding values into the ontology of the state space itself.

  My half-formed idea for this term paper is that this reliance on state comparison is the bottleneck. As long as we are measuring impact by looking at how different the world looks at time $t$ compared to time $t$ in a counterfactual where the agent did nothing, we are stuck with value judgments about which differences count. So, I want to propose a shift. Instead of comparing states, what if we look at causal dynamics? The core hypothesis is that an agent causes a problematic side effect not when it changes the state of a variable, but when it changes the *transition dynamics* of variables it never observes or intends to change. If the AI moves a vase, the state of the vase changes. But if the AI moves the vase without altering the physical laws or the causal mechanisms governing the vase's future interactions (unless intended), maybe that's okay? Or rather, maybe the condition for "low impact" should be causal invariance. The agent is allowed to change states within a causal model, but it shouldn't alter the causal structure itself for variables outside its goal set.

  This proposal document is going to lay out that argument in detail. I want to preciseify the question, show why the current differential-impact stuff leaves it open (or rather, hides the problem), and then sketch out a method for formalizing this causal-invariance condition. I'll also need to be honest about where this might fail. It's easy to come up with a cool sounding principle, but hard to make it work in a toy environment without it collapsing back into the same value-laden judgments I'm trying to avoid. I'm planning this as a one-semester project, so the scope needs to be tight. I won't be solving alignment, obviously. I'm aiming to show that the causal framing is distinct from the state-framing and that it offers a different kind of failure mode, which might be more manageable or at least more honest about where the values are entering the system.

  The structure here is pretty straightforward. First, I'll dig into the background of impact measures and why the "value-neutral" claim is shaky. Then I'll introduce the causal-invariance concept and try to give it a formal shape, probably using structural causal models. After that, I'll outline the month-by-month plan for the semester, including how I'll test this in gridworlds or simple simulations. Then I'll spend some time on failure modes—because if this idea was obviously perfect, someone would have done it already. Finally, I'll do a scope check to make sure I'm not biting off more than I can chew in twelve weeks.

  **2. The Current Landscape of Impact Measures**

  To understand why I think we need a new approach, we have to look at what's currently on the table. The general consensus in the safety community is that maximizing a utility function without constraints leads to instrumental convergence. The AI will seek power, prevent itself from being turned off, and manipulate resources, not because it hates humans, but because those actions help it maximize the goal. To stop this, researchers have proposed "impact measures." The intuition is simple: penalize the agent for having a large effect on the world.

  The most common way to do this is by defining a baseline. Usually, this is the "inaction" baseline. What would the world look like if the agent did nothing? Then you compare the actual world state to the inaction world state. If they are too different, the agent gets a penalty. There are variations on this. Some look at "relative reachability," which asks how many states the agent can reach compared to the baseline. If the agent locks itself into a corner, reachability goes down, so it gets penalized. Others look at "attainable utility," which tries to measure how much the agent changes the ability to achieve a wide range of potential goals. The idea there is that if you preserve the ability to achieve many goals, you probably aren't messing up the things humans care about, since human values are diverse.

  All of these approaches share a common structure. They are consequentialist in the sense that they evaluate the action based on the outcome state. They assume that "impact" is a property of the difference between two snapshots of the universe. $Impact = Distance(State_{actual}, State_{baseline})$. The hope is that by keeping this distance small, you avoid side effects. If you don't break the vase, the state is closer to the baseline than if you do break the vase. If you don't shut down the power grid, the state is closer to the baseline.

  The selling point of these methods is that they supposedly don't require knowing the human utility function. You don't need to tell the AI that vases are valuable. You just tell it "don't change things too much." It figures out that breaking the vase changes things too much, so it doesn't break the vase. This is the "value-neutral" claim. It's really appealing because specifying human values is hard, dangerous, and maybe impossible. If we can get safety via a generic penalty on change, that's a huge win.

  But there's a problem with the ontology here. What is a "state"? In a computer simulation, a state is a vector of numbers. In the real world, it's a configuration of matter. To measure distance between states, you need a metric. Let's say we use Euclidean distance on the state vector. If the state vector includes "position of vase" and "integrity of vase," then moving the vase changes the position numbers, and breaking it changes the integrity number. But how do we weight these? If the position changes by 1 meter, is that more or less impact than the integrity changing from 1 to 0? You need a weighting scheme.

  Who chooses the weighting scheme? If the engineer sets it, they are putting their values in. If the AI learns it, it's learning from human data, which contains values. If it's uniform, then breaking a vase might be weighted the same as moving a dust particle, which is obviously wrong. So, to make the impact measure work, you have to define the state space and the metric in a way that aligns with human intuitions about what counts as a "change."

  Some proponents argue that if you make the state space fine-grained enough (like raw pixels or atom positions), you don't need values. But that leads to other problems. If you penalize any change in atom positions, the AI can't do anything. Breathing changes atom positions. Walking changes atom positions. So you have to abstract the state space. You have to group atoms into "objects." But deciding what counts as an object is already a value-laden cognitive act. We group atoms into "vases" because we care about vases. We don't group them into "scattered shards" until after the break.

  So, the critique I'm working with is that these differential-impact measures are not actually value-neutral. They are value-laden, but the values are hidden in the representation of the world. They are smuggled in through the choice of variables and the distance metric. This isn't necessarily fatal—you could argue that hiding values is better than specifying them explicitly—but it undermines the theoretical claim that we can avoid knowing human values. It suggests that we still need to know what variables matter, which is almost the same as knowing what values matter.

  Furthermore, there's the issue of the baseline. The "inaction" baseline is tricky. What if the world is already changing? If a hurricane is coming, and the AI stops the hurricane, is that a side effect? Relative to the inaction baseline, stopping the hurricane is a massive change. So the AI might let the hurricane happen to minimize impact. To fix this, people propose different baselines, like "what would happen if the agent took a noop action every step." But this still relies on comparing states. It still asks "how different is the world?" rather than "what did the agent do to the mechanisms of the world?"

  This distinction is crucial. When we worry about side effects, are we worried about the world looking different, or are we worried about the agent disrupting the natural course of events? Sometimes these overlap, but not always. If I move a chair from one room to another, the world looks different. But I haven't broken the chair, and I haven't changed the laws of physics. If I break the chair, the world looks different, and I've changed the chair's causal properties (it can no longer be sat on). The current measures treat these somewhat similarly based on state distance. My intuition is that the moral weight lies more in the disruption of causal capacities than in the static difference of state.

  There's also the problem of "good" side effects. Sometimes we want the AI to change the world. We want it to cure diseases. Curing a disease changes the state of the patient significantly relative to the baseline of "doing nothing." An impact measure that penalizes state distance might discourage the AI from curing the disease because that's a huge change. To fix this, researchers introduce "exception" clauses or define impact relative to the goal. But then you're back to specifying the goal precisely, which is the hard alignment problem again.

  So, the landscape is stuck. We want value-neutrality, but state-based measures require value-laden representations. We want to allow good changes, but state-based measures penalize all changes. We need a way to distinguish between "changing the state within the rules" and "changing the rules themselves." That's where I think causality comes in.

  **3. The Philosophical Critique: Smuggled Values**

  Let's dig deeper into the "smuggled values" argument, because this is the core justification for why we need a new approach. The claim I'm making is that ontology is normative. When we define the state space $S$ for an AI, we are making a decision about what exists. If $S$ includes a variable for "human happiness," we are saying human happiness is a thing that can be tracked. If $S$ only includes "position of robots," we are saying only robot positions matter.

  In the context of impact measures, the smuggling happens at the level of feature selection. Consider the classic vase example. To penalize breaking the vase, the state representation must include a feature for "vase integrity." If the state representation only includes "color of pixels in region X," then breaking the vase might look like a small change in pixel colors, similar to moving the vase. The AI might break the vase if it helps it achieve the goal, because the pixel-distance penalty is low. To prevent this, the engineer must ensure the state representation captures "vase integrity" as a distinct, high-weight feature.

  But why is "vase integrity" a feature? Because humans value intact vases. If we were aliens who valued shattered ceramics as art, we would define the feature as "vase shatter count" and penalize intact vases. The impact measure itself doesn't know the difference. It just calculates distance. The value judgment is entirely in the setup of the state space.

  This is problematic for a few reasons. First, it makes the safety guarantee fragile. If the state space is misspecified—which it almost always will be in complex environments—the impact measure fails. If the AI operates in the real world, we can't possibly include every variable humans care about in the state space. We'll miss something. Maybe we forget to include "social trust" as a variable. The AI could destroy social trust while keeping all the measured variables constant. The impact measure would say "low impact," but humans would say "catastrophe."

  Second, it hides the ethical responsibility. If we claim the method is value-neutral, we might stop looking for where the values are entering. We might think we've solved the ethics problem when we've just pushed it into the preprocessing step. This is dangerous in deployment. Engineers might think they don't need to consult ethicists because the math handles it, but the math is only handling what the engineers told it to handle.

  Third, there's the issue of dynamic values. Human values change over time. A state-based impact measure freezes the values at the time of training. If humans decide next year that vases are worthless and we care more about something else, the AI is still optimizing for the old state distance. A causal measure might be more robust if it focuses on preserving the *capacity* for change rather than the specific state.

  The philosophical point here is that "difference" is not a primitive property of the universe. Two states are only different relative to a description language. And the choice of description language is driven by interests and values. Therefore, any measure based on state difference is inherently value-laden.

  Some might argue that we can use a "universal" state space, like the positions of all particles. But that's computationally intractable and morally irrelevant. We don't care about the position of every electron. We care about macroscopic objects and social structures. So we must abstract. And abstraction is value-laden.

  So, if state-based measures are fundamentally compromised by this smuggling, what's the alternative? We need a measure that doesn't rely on comparing the *outcome* to a baseline, but rather evaluates the *process* or the *influence* of the agent. This leads to the causal proposal.

  **4. The Proposed Solution: Causal Invariance**

  Here's the core idea. Instead of asking "How different is the world state?", we ask "Did the agent change the causal rules governing the parts of the world it wasn't supposed to touch?"

  To formalize this, I'm thinking about using Structural Causal Models (SCMs). In an SCM, the world is described by variables and structural equations that determine how those variables evolve. $X_i = f_i(PA_i, U_i)$, where $PA_i$ are the parents of $X_i$ and $U_i$ is noise. The "causal structure" is the set of functions $\{f_i\}$.

  Usually, an agent acts by intervening on variables. $do(X = x)$. This changes the value of $X$, and consequently the values of its descendants. Standard impact measures penalize this change in descendants. My proposal is to penalize changes to the functions $\{f_i\}$ themselves for variables outside the agent's goal set.

  Let's say the goal is to make coffee. The agent is allowed to intervene on the coffee machine variables. It is not allowed to intervene on the vase variables. But more than that, it is not allowed to change the function that determines how vase variables evolve. If the agent moves the vase, it changes the position variable. That's an intervention on the state. But does it change the function that determines position? Maybe. If the agent pushes the vase, it adds a force term to the physics equation of the vase. That's a temporary change to the dynamics.

  Maybe the condition should be about *permanent* changes to the causal structure. Or maybe it's about *unintended* changes. The idea of "causal invariance" is that the agent should leave the transition dynamics of irrelevant variables invariant. If $V$ is a set of variables irrelevant to the goal, then $P(V_{t+1} | V_t, \text{context})$ should remain the same before and after the agent's action, except for the direct intervention itself.

  Wait, that's tricky. If I move the vase, $P(Position_{t+1} | Position_t)$ changes because I added velocity. But once I stop touching it, the dynamics return to normal (friction, gravity). So maybe the condition is that the agent shouldn't alter the *intrinsic* dynamics. It can apply forces, but it shouldn't break the vase (which changes the integrity variable and its dynamics) or glue the vase to the table (which changes the friction dynamics permanently).

  This distinction between "state change" and "mechanism change" is the key. Breaking a vase changes the mechanism (it can no longer hold water). Moving a vase changes the state (location) but not the mechanism (it can still hold water). Current impact measures struggle with this because they see both as "change." A causal invariance condition would theoretically allow moving the vase (state change within invariant dynamics) but penalize breaking it (change to dynamics/capacities).

  Why might this be more value-neutral? Because causal structure is arguably more objective than state distance. The laws of physics don't care about human values. Whether a vase can hold water is a physical fact, not a value judgment. Humans value the water-holding capacity, but the capacity itself is a causal property. So if we penalize changes to causal capacities, we are penalizing changes to objective physical properties. We still need to select which variables matter (the vase vs. the dust), but we don't need to weight how much "breaking" matters vs "moving." The breaking is a structural change; the moving is a parametric change.

  Of course, this isn't perfectly value-neutral. We still have to decide which variables are "irrelevant." If we say the vase is irrelevant, the AI might still break it if breaking it doesn't change the causal structure of other things. So we need to define the set of protected variables. But maybe this set is easier to define than a full utility function. Maybe we can say "protect all macroscopic objects" or "protect all causal mechanisms not involved in the goal."

  I need to formalize this condition. Let's call it the Causal Invariance Condition (CIC).
  CIC: An action $a$ is permissible if for all variables $V$ not in the goal set $G$, the structural equation $f_V$ remains invariant under $a$, except for transient state updates.
  Transient state updates are changes to $V_t$ that do not alter $f_V$ for $t > t_{action}$.
  Permanent changes to $f_V$ are penalized.

  This looks promising. It distinguishes between moving (transient) and breaking (permanent structural change). It might also handle the "off-switch" problem. If the AI disables the off-switch, it changes the causal structure of the shutdown mechanism. That's a violation of invariance on the shutdown variable.

  However, there's a risk. What if the AI changes the causal structure in a way that benefits humans but wasn't intended? Like curing a disease. Curing a disease changes the biological causal structure of the patient. Is that allowed? Yes, because the patient is in the goal set (implicitly). But what about side effects of the cure? If the cure changes the gut microbiome dynamics permanently, is that a violation? It depends on if the microbiome is in the protected set.

  So we still need a protected set. But the claim is that defining the protected set is easier than defining the utility function. It's easier to say "don't change the laws of physics for objects you aren't touching" than "maximize human happiness."

  **5. Methodology and Timeline**

  Okay, so how do I actually test this in one semester? I can't build a real AI. I need toy environments. I'm planning to use a gridworld setup, maybe modified to include causal structures. Standard gridworlds are just states. I need to add layers of causality.

  **Month 1: Literature and Formalization**
  The first month is mostly reading and writing the math. I need to solidify the definition of Causal Invariance. I'll be looking at papers on causal reinforcement learning and impact measures. I need to make sure I'm not reinventing the wheel. There's some work on causal influence diagrams that might be relevant. I need to write down the formal definition of CIC clearly. Is it about the structural equations? Or the transition probabilities? I think structural equations are better because they capture the mechanism.
