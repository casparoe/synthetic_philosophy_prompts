  **6. Anticipated Failure Modes**

  I need to be realistic. This idea might not work. Here are the ways I expect it to fail, which I'll need to discuss in the paper.

  **Failure Mode 1: Causal Structure is Also Value-Laden**
  I'm arguing that causal structure is more objective than state distance. But is it? To define a causal graph, you have to decide what the nodes are. If I define the node as "Vase," I'm already valuing the vase as an object. If I define it as "Atoms," the graph is too big. So the choice of granularity is still value-laden. If this is true, then CIC doesn't solve the smuggling problem, it just moves it from the metric to the graph structure. I need to address this. Maybe the claim isn't that it's value-neutral, but that it's *less* sensitive to value specification. It's easier to agree on a causal graph than a utility function.

  **Failure Mode 2: Invariance is Too Restrictive**
  If the agent is not allowed to change transition dynamics, it might not be able to do anything useful. Most useful actions change dynamics. Building a house changes the dynamics of shelter. Cooking food changes the dynamics of digestion. If CIC penalizes all permanent changes, the agent will be paralyzed. I might need to refine the condition to allow changes that are "instrumental" to the goal. But then how do we define instrumental without values? This brings us back to the start. Maybe the solution is to allow changes to dynamics of variables *downstream* of the goal, but not *sidestream*. But defining downstream requires a causal model of values.

  **Failure Mode 3: Epistemic Limitations**
  The agent needs to know the causal structure to check invariance. But agents don't know the true causal structure. They have to learn it. If they learn it wrong, they might think they are preserving invariance when they aren't. Or they might think they are violating it when they aren't. This introduces uncertainty. A state-based measure is easier to calculate (just look at the state). A causal measure requires a model of the world. This computational cost might be prohibitive. For the term paper, I'll assume the model is known, but I need to acknowledge that in reality, it's not.

  **Failure Mode 4: Collapsing into State Comparison**
  It's possible that mathematically, causal invariance reduces to a specific type of state comparison. If changing the dynamics always results in a specific pattern of state divergence over time, then CIC might just be a long-horizon state distance measure. If that's the case, then my philosophical distinction is moot. I need to check if there are cases where dynamics change but state distance is low, or vice versa. The vase example suggests yes (broken vs moved), but I need to verify this in the simulations.

