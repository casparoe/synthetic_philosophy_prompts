  **The Chamber of Votes, 03:00**

  **Serrano:** You're still polishing the glass, Anselm. But the city isn't looking out; it's looking back. Nineteen years without a new school. They draft plans endlessly—they have the data for a thousand futures—but they cannot begin. The Record is a ceiling.

  **Okri:** The Record is a floor. It holds us up. You propose to smash the foundation because the house feels crowded.

  **Serrano:** I propose to open a window. Your chorographers… they are a pretty distraction. Two artists in a sealed room, composing a lineage for us to revere. But everyone knows it is composed. They avow it is fiction. Can a known fiction bear the weight of the monumental? Can you emulate a hero you know was invented by a committee?

  **Okri:** Why not? We emulate characters in novels. The power isn't in the facticity, Livia, it in the image. The monumental mode requires greatness to emulate, not necessarily truth. If the chorographers craft exemplars that serve life, does it matter if they are curated rather than found?

  **Serrano:** It matters because belief requires blindness. Nietzsche said we need a horizon bounded by not-knowing. Your plan keeps the Record intact. Everyone knows the truth is sitting in the archive, even if the chorographers ignore it. The horizon isn't restored by ignoring the wall; it's restored by breaking it. My tribunal condemns the past. It says: *this is unjust, this is shameful, this is destroyed.* That act of critical violence creates the space for new action.

  **Okri:** But can you genuinely condemn a past that is wholly present? To judge history critically, you must stand outside it. But we are inside. We have metabolised every word in that Record. Destroying the storage doesn't destroy the memory. You're offering vandalism dressed as philosophy. You wound the record, not the culture.

  **Serrano:** The record *is* the culture now. We are inert because we are accountable to everything we've ever been. Plastic power—the ability to reshape the alien into growth—is atrophied. We need to forget. If we cannot forget naturally, we must legislate forgetting.

  **Okri:** You cannot legislate the unhistorical. That was the point, wasn't it? The capacity to forget is a vital function, like digestion. You can't force digestion by starving yourself. My chorographers restore plastic power by showing us how to reshape without denying. They admit the composition. That honesty is itself a form of strength.

  **Serrano:** It's propaganda. Appointed by the city, sealed from the truth, telling us what to admire. That's not plastic power; that's state mythology. And it leaves the poison intact. The shame, the errors, the dead weight—it's all still there, searchable. As long as the past is immutable, the future is fixed.

  **Okri:** And if you burn the past, do you free the future? Or do you just make us unmoored? If I know you've deleted the failures of ten years ago, I don't feel free; I feel managed. The inertia isn't in the Archive, Livia. It's in us. We lost the ability to act because we became too conscious. Neither your fire nor my fictions fix the consciousness.

  **Serrano:** So we do nothing? We wait for a biological shift?

  **Okri:** I'm saying neither bill reaches the sickness. You want to destroy the evidence of our paralysis. I want to paint over it. But the paralysis is the willingness to be defined by what is recorded.

  **Serrano:** Then perhaps the destruction is symbolic. Not to erase the memory, but to break the authority. If the city sees the Record can be broken, the spell of permanence lifts. It's a shock to the system.

  **Okri:** A shock might wake a sleeper. But it might also kill the patient. Once you establish a tribunal that decides what history is permissible, you've surrendered the future to the tribunal. Who sits on it?

  **Serrano:** Who sits on your chamber of chorographers?

  **Okri:** They compose; they do not delete. There is a difference between adding a voice and silencing one.

  **Serrano:** Is there? If the counter-record drowns out the real one, you've silenced it by noise. I prefer silence to noise.

  **Okri:** You prefer emptiness. You think life grows in the void. I think it grows in the soil, even if the soil is heavy.

  **Serrano:** The soil is concrete, Anselm. Nothing grows here.

  **Okri:** Then perhaps the problem isn't the ground. It's the gardeners.

  *(A silence settles between them. The clock ticks.)*

  **Serrano:** The vote is in four hours.

  **Okri:** I know.

  **Serrano:** If I win, I burn the shame. If you win, you write the myth. Neither of us knows if it will make them live.

  **Okri:** No. We're only choosing how they die. With a wound, or with a story.

  **Serrano:** Then let them choose.

  *(She gathers her papers. He watches the Record, glowing softly in the corner, immutable and complete.)*
