      *   **Goal:** Make the audience *follow* the logic of a decent person arriving at this conclusion, not necessarily *accept* it. Avoid sounding like a paradox.
      *   **Specific Requirements:**
          *   Order of operations (what must be in place before the sink/source distinction).
          *   Early clarification of total vs. per-capita welfare and the status of non-existent animals.
          *   One concrete site to carry the argument (what it must have/lack).
          *   Objections in the order the audience will raise them (balance of nature, bulldozing, unmeasurability, suffering vs. other values, adding decent lives).
          *   When to answer vs. absorb objections.
          *   What to openly decline to settle.
          *   One closing question to test if the idea landed (vs. just unsettled).
          *   Confidence level assessment.
          *   Least sure step.
          *   Language: American English.
      *   **Constraint:** "I need a plan, not an explanation." (Keep it actionable, structured, direct).

  2.  **Deconstruct the Challenge:**
      *   This is a provocative topic (wild animal suffering/negative utilitarianism in conservation) presented to a conservation-friendly audience (land trust).
      *   Risk: Alienating the hosts and audience.
      *   Goal: Empathy for the character's logic, not conversion to the ideology.
      *   Key Conceptual Hurdles: Total vs. Average Utilitarianism, Non-Identity Problem (animals never born), Measurement of Suffering.
      *   Key Emotional Hurdles: Conservation is inherently "good," letting nature fail is "bad."

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Pre-Conditions (Before the Sink/Source Distinction):**
          *   Need to establish the character's competence and care first. She can't be a villain.
          *   Need to define the metric. If we talk about "ecosystem health," she loses. If we talk about "individual experience," she might win.
          *   Total vs. Per-capita needs to be early.
          *   Status of non-existent animals needs to be early (the "never born" argument).

      *   **Phase 2: The Concrete Site:**
          *   Needs to be specific. Not a generic wetland.
          *   Must have: High predation, high disease, high density, short lifespans (e.g., amphibians, insects, small mammals).
