          *   Why? Because if it's eagles, the audience rejects the suffering calculus. If it's mosquitoes and minnows, the suffering is easier to posit.

      *   **Phase 3: The Objection Sequence:**
          *   1. "Balance of Nature" (Nature knows best).
          *   2. "Unmeasurability" (You can't count suffering).
          *   3. "Bulldozing" (Active harm vs. passive neglect).
          *   4. "Suffering isn't everything" (Beauty, complexity, existence).
