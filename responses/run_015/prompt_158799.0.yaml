              *   Answer: Bulldozing (clarify passive reversion).
              *   Absorb: Balance of Nature (let the character's data stand against the myth).
              *   Absorb: Suffering isn't everything (acknowledge the trade-off).
              *   Answer: Adding decent lives (this is the core philosophical crux).

      *   **Phase 4: What to Decline to Settlement:**
          *   Don't solve the philosophy. Don't say "She is right." Say "She is trapped by this logic."

      *   **Phase 5: The Closing Question:**
          *   Needs to test understanding of the *dilemma*, not agreement.
          *   Bad: "Do you agree?"
          *   Good: "What would you have asked her to measure?" or "Where does the duty lie?"

      *   **Phase 6: Confidence & Uncertainty:**
          *   Confidence: High on structure, moderate on audience reception (it's risky).
          *   Least Sure: The "never born" animals concept. It's abstract and hard to grasp in 40 mins.

  4.  **Refining the Plan (Self-Correction/Iterative Polish):**
      *   *Correction:* The prompt asks for "what has to be in place... before the sink/source distinction can even be stated." This needs to be the very first section.
      *   *Correction:* The prompt asks for objections in the order *this audience* will raise them. Birders/Farmers/Land Trust -> They care about *doing* something. "Balance of Nature" is likely first. "Bulldozing" is likely second (action bias). "Unmeasurability" is third (scientific skepticism). "Adding lives" is fourth (philosophical).
      *   *Correction:* The "never born" status needs to be integrated early.
      *   *Tone:* Direct, imperative, structured. No fluff.

  5.  **Finalizing the Steps:**

      *   **I. Foundation (Minutes 0-10):** Establish credibility, shift metric from "species count" to "individual experience," introduce Total vs. Average, introduce Non-Identity.
      *   **II. The Site (Minutes 10-20):** Specifics. Amphibians/Insects. High mortality.
      *   **III. The Objection Arc (Minutes 20-30):** Order: 1. Balance of Nature (Absorb), 2. Bulldozing/Action (Answer), 3. Unmeasurability (Answer), 4. Value of Existence (Absorb), 5. Total vs. Average (Answer).
      *   **IV. The Open Question (Minutes 30-35):** What remains unresolved.
