answer: |-
  ### Preamble: Criteria for Prioritization

  To allocate a decade of collective philosophical labor effectively, we must reject the impulse to merely catalogue interpretations of general relativity or quantum gravity. The value of philosophy of physics lies not in shadowing formal developments, but in resolving conceptual bottlenecks that stall theoretical progress or generate spurious metaphysical disputes. I propose three criteria for ranking the following agenda:

  1.  **Upstream Dependence:** Does resolving this question clarify multiple downstream problems? A high-priority item is one where confusion here propagates errors in ontology, methodology, and empirical assessment elsewhere.
  2.  **Tractability by Conceptual Analysis:** Is the obstacle primarily formal (requiring new mathematics) or conceptual (requiring clarification of definitions, logical relations, or interpretive rules)? Philosophers should prioritize the latter, where physicists often operate on implicit, inconsistent, or pragmatic assumptions.
  3.  **Empirical and Theoretical Leverage:** Does progress here constrain how theories are constructed or tested? If a philosophical distinction has no impact on model-building or data interpretation, it is metaphysical speculation, not philosophy of physics.

  Based on these criteria, the legacy of the Hole Argument does not fragment into independent problems. It points to a **single crux**: the conditions for the **individuation of physical possibilities under gauge equivalence**. However, this crux manifests in three distinct, ranked domains of inquiry.

  ---

  ### Priority 1: The Ontological Status of Gauge Orbits vs. Configuration Space

  **The Question:** Does diffeomorphism invariance imply that spacetime points are ontologically eliminated, or merely that they are descriptively redundant? Specifically, is the "physical state" a point in the configuration space (the manifold with fields) or an equivalence class (the gauge orbit)?

  **Why this is Priority 1:**
  This is the direct logical descendant of the Hole Argument. The original argument showed that if points have independent reality, determinism fails. The standard resolution is to treat diffeomorphically related models as representing the same physical state. However, *what* constitutes that state remains fiercely debated. If the state is the orbit, points are unreal (relationalism/structuralism). If the state is the point but access is restricted, points are real but hidden (sophisticated substantivalism). This decision dictates the ontology of every background-independent quantum gravity program. If you get this wrong, your interpretation of Loop Quantum Gravity, String Theory, or Causal Sets rests on a category error.

  **Tractability for Philosophers:**
  Physicists often treat gauge symmetry as a calculational tool, adopting an instrumentalist "shut up and calculate" stance regarding the ontology of the gauge orbit. They fix gauges to compute scattering amplitudes or path integrals without settling what the gauge freedom *means* for reality. Philosophers are uniquely positioned to analyze the logical structure of "redundancy." Is redundancy a feature of the representation (language) or the world (ontology)? Clarifying the distinction between *descriptive* surplus structure and *ontological* commitment requires logical and modal analysis, not new field equations.

  **Connections to Live Debates:**
  *   **Structural Realism:** This priority determines whether Ontic Structural Realism is a necessary consequence of gauge theory or an optional metaphysical add-on.
  *   **Problem of Time:** If the physical state is a gauge orbit, and time evolution is a gauge transformation (as in canonical GR), then "change" becomes illusory unless we redefine observables.
  *   **Quantum Gravity:** In theories where spacetime is emergent, knowing whether the fundamental constituents are "point-like" or "relation-like" depends on how you resolved the gauge orbit question in the classical limit.

  **Conditions for Elevation or Demotion:**
  *   **Elevate** if: A formal result in quantum gravity (e.g., a rigorous definition of the physical Hilbert space) explicitly relies on a specific interpretation of gauge orbits that contradicts the standard "orbit = state" view.
  *   **Demote** if: Physicists reach a consensus that gauge symmetry is merely a feature of perturbative expansions around a background, rendering the non-perturbative ontological question moot for practical theory construction.

  ---

  ### Priority 2: Empirical Coherence and the Definition of Observables

  **The Question:** In a theory where local spacetime points are not gauge-invariant (due to the Hole Argument logic), what constitutes an observable? How do we establish empirical coherence between a background-independent fundamental theory and the localized data of experimental physics?

  **Why this is Priority 2:**
  This is the epistemic consequence of Priority 1. If the Hole Argument forces us to reject local point-events as physical, we lose the standard anchor for measurement. In canonical quantum gravity, this manifests as the "Problem of Time": the Hamiltonian vanishes, implying no evolution. If there are no local observables, how do we test the theory? This is not just a metaphysical worry; it threatens the empirical viability of background-independent approaches.

  **Tractability for Philosophers:**
  Physicists often define observables formally (e.g., quantities that commute with the constraints) but struggle to map these to laboratory measurements. The gap is conceptual: What is the relationship between a "Dirac observable" (global, gauge-invariant) and a "local measurement" (pointer readings at a location)? Philosophers can analyze the conditions for empirical access, drawing on philosophy of measurement and reference. We can clarify what "localization" means if not by spacetime coordinates (e.g., localization via physical fields or coincidence).

  **Connections to Live Debates:**
  *   **Empirical Equivalence:** This connects to debates on whether different formulations of a theory (e.g., AdS/CFT duality) are empirically equivalent or distinct. If observables are hard to define, equivalence is hard to check.
  *   **Problem of Time:** Resolving what counts as an observable is the prerequisite for resolving whether time is fundamental or emergent.
  *   **Effective Field Theory:** It clarifies the relationship between the fundamental theory (no local observables) and the effective theory (approximate local observables).

  **Conditions for Elevation or Demotion:**
  *   **Elevate** if: A candidate theory of quantum gravity makes predictions that fundamentally contradict the possibility of localized measurement, forcing a revision of what "empirical evidence" means.
  *   **Demote** if: A robust mechanism for "de-relationalizing" observables is found (e.g., a universal clock field), rendering the distinction between fundamental and effective observables technically manageable without deep conceptual revision.

  ---

  ### Priority 3: The Metaphysics of Emergence and Approximation

  **The Question:** If the fundamental theory eliminates spacetime points (following the logic of Priorities 1 and 2), how does classical spacetime emerge? Is this emergence singular (phase transition) or continuous (renormalization), and what does this imply for the reality of the emergent level?

  **Why this is Priority 3:**
  This is the recovery problem. Even if we accept that the Hole Argument dissolves points at the fundamental level, we live in a world that appears to have them. We need an account of how the "illusion" of spacetime points arises without dismissing the macroscopic world as false. This is downstream of Priorities 1 and 2 because you cannot explain the emergence of spacetime until you know what spacetime *was* (Priority 1) and how we measure it (Priority 2).

  **Tractability for Philosophers:**
  Physicists use renormalization group flow and coarse-graining to derive effective theories. However, the *interpretation* of these procedures is often left implicit. Does coarse-graining reveal "real" higher-level entities, or is it merely pragmatic? Philosophers of science have extensive literature on inter-theoretic reduction, singular limits, and emergence that can be applied here. The task is to map formal approximation schemes onto ontological categories.

  **Connections to Live Debates:**
  *   **Reductionism:** Challenges the Nagelian model of reduction if the fundamental theory lacks the vocabulary of the emergent theory (spacetime).
  *   **Multiverse/Landscape:** If spacetime is emergent, different vacuum states might correspond to different emergent geometries, impacting the ontology of the string landscape.
  *   **Causality:** If spacetime emerges, does causality emerge with it, or is there a fundamental non-spatiotemporal causality?

  **Conditions for Elevation or Demotion:**
  *   **Elevate** if: Research indicates that the classical limit of quantum gravity is singular (not smooth), implying that spacetime does not "emerge" in a standard sense but breaks down, requiring a radical new metaphysics of macroscopic reality.
  *   **Demote** if: Spacetime is shown to be fundamental in the successful theory of quantum gravity (e.g., if background independence is abandoned), making emergence a secondary issue.

  ---

  ### The Single Crux: Individuation under Gauge Equivalence

  You asked whether the Hole Argument's legacy points to a single crux or fragments. I argue it is a **single crux that fragments technically**.

  The core issue is **individuation**. The Hole Argument demonstrates that spacetime points cannot be individuated by their coordinates (labels) nor by the manifold structure alone. They require physical fields for individuation (Leibnizian shift). In modern gauge theory, this translates to: *What individuates a physical state?*

  *   If the answer is "the gauge orbit," we lose points (Priority 1).
  *   If we lose points, we lose local anchors for measurement (Priority 2).
  *   If we lose local anchors, we must explain how they reappear in the macroscopic limit (Priority 3).

  The fragmentation occurs because physicists address these as separate technical hurdles (fixing the gauge, defining the S-matrix, taking the classical limit) rather than as symptoms of one ontological constraint. The philosophical labor is to hold these together, showing that the "Problem of Time" is not distinct from the "Hole Argument," but is the temporal expression of the same individuation failure.

  **Why this defense matters:**
  If the group treats these as independent problems, they will produce disjointed papers on "time," "points," and "emergence." If they treat them as a unified investigation into **individuation conditions under gauge symmetry**, their work will have cumulative force. They can show that resolving the ontology of gauge orbits (Priority 1) automatically constrains the definition of observables (Priority 2) and limits the viable models of emergence (Priority 3).

  ### Conclusion on Philosophical Labor

  The goal of this agenda is not to tell physicists which equations to write. It is to prevent the community from investing decades in interpreting a theory based on a confused understanding of what the theory's variables represent. The Hole Argument taught us that mathematical representation does not map one-to-one onto physical reality. The next decade of work must determine exactly *where* the map breaks and what remains when the surplus structure is stripped away.

  Prioritize **Gauge Ontology** first, because it defines the territory. Prioritize **Observables** second, because it defines access to the territory. Prioritize **Emergence** third, because it explains how we got back to the map we started with. Any work that does not serve this chain of dependence should be considered downstream or derivative.
