  I was discussing with some colleagues how Quine’s naturalized epistemology treats moral discourse as part of the overall web of belief—continuous with science in being revisable in principle, yet lacking the direct observational anchoring that protects physical-object talk from easy elimination. We got onto his thesis that translation is underdetermined by all possible behavioral evidence, and I started wondering what happens if you apply that pressure specifically to normative vocabulary: if a field linguist records every utterance of a term that seems to mean wrong, but the behavioral data are equally compatible with taboo, inefficient, or not part of our best regimented ontology, then Quine’s point is that there is no further fact of the matter to break the tie. I’d like you to write a joke that turns on exactly this collision between Quine’s translation indeterminacy and his ontological parsimony about moral properties. The punchline should depend on the actual philosophical content—perhaps a brief dialogue in which Quine advises a moral realist to stop quantifying over wrongness not because ethics is unimportant, but because the translation manual for moral terms is permanently underdetermined—rather than being a generic philosophy-is-abstract gag. You may frame it as an exchange at a conference or a fieldwork anecdote, and feel free to inject a slightly absurd scenario, such as an anthropologist trying to regiment a community’s ethics into first-order logic and finding that every normative predicate collapses into a social-coordination term. Please avoid inventing direct quotations from Quine’s texts, and do not include bibliographies, reading lists, or citations.
