answer: |-
  Two philosophers, Dr. Aris and Dr. Quine, are sitting in a humid field tent, reviewing notebooks from a recent expedition to a remote valley. Aris is a stout moral realist; Quine is a lean naturalist.

  Aris taps a page fervently. "When the tribesman shouted 'Kulu' at the thief, he wasn't just expressing disapproval. He was referencing an objective moral property. We must translate 'Kulu' as 'Wrong.' It's the only way to respect the depth of their ethical life."

  Quine sips his lukewarm coffee without looking up. "Behaviorally, 'Kulu' is compatible with 'Wrong,' but it's equally compatible with 'Taboo,' 'Ritually Unclean,' 'Inefficient,' or 'Annoys the Chief.' The stimulus meaning doesn't distinguish them."

  "But surely one translation is correct!" Aris insists. "There is a fact of the matter about what he meant."

  "There isn't," Quine says, closing the notebook. "Translation is underdetermined by all possible behavioral evidence. There is no further fact to break the tie. So, we have a choice of manuals."

  Aris leans in. "And we choose the one that captures the truth."

  "We choose the one that minimizes ontological commitment," Quine corrects. "If I translate 'Kulu' as 'Wrong,' I have to bind a variable to a moral property. My ontology fills up with entities like Wrongness and Goodness. If I translate it as 'socially disruptive,' I only bind variables to people and actions."

  "But ethics is part of our web of belief!" Aris protests. "You can't just cut it out."

  "I'm not cutting out the discourse. I'm cutting out the entities. Since the evidence never forces you to posit 'Wrongness' over 'Taboo,' positing it is scientifically gratuitous." Quine hands Aris a fresh translation sheet. "So, here is my advice: Stop quantifying over wrongness."

  Ais stares at the blank page. "Not because it's false?"

  "No," Quine says, standing up to leave the tent. "But because the translation manual is permanently underdetermined, and I prefer the edition that doesn't clutter the universe with ghosts. You can keep your moral facts, provided you don't ask me to list them in my inventory."
