      *   **Core Mechanism:** Decompose hard tasks -> Human checks leaves -> Recompose -> Distill into faster model -> Repeat.
      *   **Mara's Stance (Alignment):** Believes the process preserves alignment because human oversight is at the leaves, and distillation copies the aligned behavior.
      *   **Dev's Stance (Capabilities/Risk):** Believes the recomposition step introduces unsupervised learning, distillation generalizes poorly off-distribution, and self-consistency doesn't guarantee alignment.
