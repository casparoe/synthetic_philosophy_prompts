answer: |-
  # Session Plan: The Convergence Trap

  **Course:** Computability & Philosophical Significance (Year 3)
  **Duration:** 90 Minutes
  **Students:** 20 (Mixed CS/Phil)
  **Room:** Whiteboard, Tables, No Computers
  **Goal:** To have students construct three distinct formalisms, demonstrate their mutual simulability (convergence), and then confront the epistemic gap between formal equivalence and the informal notion of "effective procedure."

  ---

  ## 1. Materials Preparation

  You need to prepare three "System Packets" (one for each of three groups of 6-7 students). The fourth group (if you have 20 students) acts as **Auditors/Judges** who verify claims and track time, or you can split into 4 groups of 5 and use two pairs of systems. For this plan, we will use **3 Groups of 6** and **1 Group of 2 (Auditors)** to keep the systems distinct.

  **Common Materials:**
  *   Index cards (ruled and blank).
  *   Markers (black, red, blue).
  *   Long strips of paper (adding machine tape style) for the Tape Group.
  *   Small cups or envelopes for the Counter Group (to hold "tokens" like beans or paper scraps).
  *   Whiteboard space divided into three sections.

  **System Packet A: The Tape Walkers (Turing Machine)**
  *   **Primitives:** `Read`, `Write 0`, `Write 1`, `Move L`, `Move R`, `Goto State X`.
  *   **Constraint:** One cell at a time.
  *   **Cards:** Pre-printed instruction cards with the above primitives. Blank state cards.

  **System Packet B: The Counters (Register Machine)**
  *   **Primitives:** `Inc Counter 1`, `Inc Counter 2`, `Dec Counter 1`, `Dec Counter 2`, `If Zero Jump`.
  *   **Constraint:** No negative numbers.
  *   **Cards:** Pre-printed instruction cards. Physical tokens (paper scraps) to put in cups representing register values.

  **System Packet C: The Rewriters (String Substitution / Post System)**
  *   **Primitives:** `Find Pattern`, `Replace Pattern`. (e.g., `1B` $\to$ `B1`, `B` $\to$ `H`).
  *   **Constraint:** Only one substitution rule fires at a time, left-to-right.
  *   **Cards:** Pre-printed rule cards. A long strip of paper with an initial string.

  **The Challenge Card (Identical for all groups):**
  *   **Task:** Compute $f(n) = n + 1$ in **Unary**.
  *   **Input:** A string of $1$s (e.g., `111`).
  *   **Output:** A string of $1$s with length increased by one (e.g., `1111`).
  *   **Condition:** The machine must *halt* explicitly.

  ---

  ## 2. Timeline & Flow

  ### Phase 1: Construction & Implementation (00:00 – 00:25)
  *   **00:00 – 00:05: Setup.** Divide class. Hand out Packets.
      *   *Instructor Script:* "You are engineering teams. You have been given a hardware architecture. Your job is to write a program for your hardware to solve the Challenge Card. You may not invent new primitives. If your hardware can't do it, you fail."
      *   *Note:* Do **not** mention Turing, Church, or equivalence.
  *   **00:05 – 00:25: Internal Work.** Groups design their state machine/program.
      *   *Auditors:* Circulate. Verify no group is using "magic" (e.g., a Counter group trying to write "Add 5" on a card). If they try, intervene: "Decompose that into your allowed primitives."
      *   *Whiteboard:* Each group draws their state diagram or rule list on their section of the board.

  ### Phase 2: The Rosetta Stone (00:25 – 00:50)
  *   **00:25 – 00:30: The Swap.**
      *   *Instructor Script:* "Success is not just solving the problem. It is showing your machine is as powerful as your neighbors'. Group A, explain your 'Move Right' primitive to Group B. Group B, you must explain how to achieve the *effect* of 'Move Right' using only Counters."
      *   Task: Create a **Translation Table**. Map the *concepts* of one system to the *operations* of another.
  *   **00:30 – 00:50: Cross-Simulation.**
      *   Group A proposes a logical step (e.g., "Find the end of the string").
      *   Group B and C must write the sequence of *their* primitives that achieves that logical step.
      *   *Goal:* They must demonstrate that for every capability in System A, there is a macro-sequence in System B and C.
      *   *Auditors:* Verify the translations. If Group B says "We just increment," Auditors ask: "Increment what? How does that mimic moving a tape head?"

  ### Phase 3: The Triumph & The Crack (00:50 – 01:10)
  *   **00:50 – 01:00: Convergence Report.**
      *   Each group presents their Translation Table.
      *   *Instructor:* "So, if I give you a program for the Tape, you can run it on the Counters?" (Yes). "And on the Rewriters?" (Yes).
      *   *Whiteboard:* Draw a triangle connecting the three systems. Write "EQUIVALENT" on the lines.
      *   *Feeling:* Allow the room to feel the victory. They have mathematically proven (via construction) that these three distinct formalisms are extensionally equivalent.
  *   **01:00 – 01:10: The Trap.**
      *   *Instructor:* "You have proven System A $\equiv$ System B $\equiv$ System C. But look at the Challenge Card. It asked you to compute a function a *human* could do with pencil and paper. Where in your proof did you define 'human pencil and paper'?"
      *   Silence will likely follow.
      *   *Instructor:* "You proved the formalisms match each other. You did not prove they match *us*."

  ### Phase 4: Debrief & Epistemic Status (01:10 – 01:30)
  *   **01:10 – 01:20: Naming the Thesis.**
      *   Introduce the Church-Turing Thesis (CTT).
      *   Map the activity: The Triangle they built is the **Convergence Evidence** (Turing Machines $\equiv$ Lambda Calculus $\equiv$ Recursive Functions).
      *   Map the Missing Link: The edge from "The Triangle" to "Effective Calculability (Informal)" was assumed, not built.
  *   **01:20 – 01:25: Answering the Student's Question.**
      *   *Question:* "What would count as evidence against the thesis?"
      *   *Answer derived from activity:* "If you could describe a step-by-step method (using your index cards) that we all agree is mechanical, but none of the three groups could simulate it, you would have falsified the thesis."
      *   *Example:* Hypercomputation (Zeno machines, Oracle TMs).
  *   **01:25 – 01:30: The Instructor's Burden.**
      *   Explain what you must supply (see "The Missing Piece" below).

  ---

  ## 3. Handling Predictable Pitfalls

  ### The "Magical Primitive" Problem
  *   **Scenario:** A group realizes the task is hard and tries to write a card that says `Add 1` or `Find End`.
  *   **Why it matters:** If they allow high-level primitives, the equivalence becomes trivial (everything simulates everything if you allow `Run Program` as a primitive).
  *   **Intervention:** Do not dismiss it angrily. Treat it as a philosophical boundary.
      *   *Script:* "That is a valid *function*, but is it a valid *mechanical step*? If you hand that card to a clerk who doesn't know math, can they execute it? If not, it violates the 'mechanical' constraint of the game."
      *   *Lesson:* This mirrors the axiomatic approach to CTT (e.g., Sieg's analysis). You must justify why your primitives are "atomic."

  ### The "Trivial Task" Problem
  *   **Scenario:** They finish the $n+1$ task in 5 minutes and feel the equivalence was too easy.
  *   **Mitigation:** The Auditors should push for **Looping**.
      *   *Script:* "You solved it for input `1`. Can you prove your translation works for input `111111` without rewriting the code? Show me the *general* simulation."
      *   This forces them to deal with state and unbounded memory, which is where the models actually converge.

  ### The "One Model Dominates" Problem
  *   **Scenario:** The Tape Group realizes they are the "standard" and the others are just struggling to mimic them.
  *   **Mitigation:** Rotate the "Source" role.
      *   First 10 mins of Phase 2: Tape is the Source.
      *   Second 10 mins: Counters are the Source.
      *   This ensures no single model is treated as the "real" computation.

  ---

  ## 4. The Debrief: Mapping the Epistemology

  This is the most critical section. You must explicitly map the room's activity to the philosophical claims.

  **1. The Convergence Claim (What they achieved)**
  *   *Activity:* The Translation Tables.
  *   *Philosophical Point:* This represents the historical convergence of 1930s logic (Gödel, Church, Turing, Post). It shows **Robustness**. The class of functions is stable regardless of the formalism's "shape."
  *   *Validity:* This is a mathematical fact (within the room). They *did* prove equivalence between the formal systems.

  **2. The Absence of Proof (What they missed)**
  *   *Activity:* The Challenge Card ("Compute what a human can compute").
  *   *Philosophical Point:* The link between **Formal System** and **Informal Notion**.
  *   *The Gap:* In the room, "Effective Procedure" was implicitly defined as "Whatever the Tape Machine does." You did not independently analyze the human clerk.
  *   *Why it can't be proved:* You cannot mathematically prove a definition. If "Computable" *means* "Turing Machine," it's a definition. If "Computable" means "What humans do," it's an empirical/philosophical hypothesis.

  **3. What You Must Supply (The Missing Piece)**
  The activity cannot reproduce **Turing's 1936 Analysis**.
  *   *Why:* The students accepted the Tape Machine's primitives (`Move L`, `Write 0`) as given. They did not derive *why* those are the correct primitives for a human.
  *   *Instructor Input:* You must explain that Turing's genius was not the machine, but the **argument** that any human computation can be reduced to those specific primitives (finite symbols, local attention, deterministic state).
  *   *Script:* "You proved the models are equivalent. Turing proved the *Tape Model* captures the *Human*. He did this by analyzing the limitations of human memory and vision. That analysis is the bridge you didn't build. Without it, this triangle is just math. With it, it becomes a thesis about nature."

  ---

  ## 5. Scoring & Incentives

  To keep the energy high without distorting the philosophy:
  *   **Correctness (5 pts):** Does the machine halt with the correct output?
  *   **Fidelity (5 pts):** Did you stick to your primitives? (Auditors deduct for Magic Primitives).
  *   **Translation (10 pts):** Can you simulate another group's step?
  *   **Prize:** The "Universal Constructor" title.
  *   **Twist:** In the debrief, reveal that *everyone* wins the prize if they acknowledge the epistemic gap. If they claim they *proved* CTT, they lose the points. This reinforces the lesson that the "proof" is the illusion.

  ---

  ## 6. Summary of Instructor Notes

  *   **Do not** use the words "Turing," "Church," or "Thesis" until minute 70.
  *   **Do** enforce the "No Magic Primitives" rule strictly; this is the analog of "atomic steps."
  *   **Do** let them feel the pride of the equivalence proof. The disappointment of the epistemic gap lands harder if the triumph was real.
  *   **Don't** worry if they don't finish the full simulation. The *attempt* to translate reveals the structural similarities (loops, state, memory) which is sufficient for the convergence point.
  *   **Key Takeaway for Students:** The Church-Turing Thesis is not a theorem about machines; it is a bridge between the formal and the informal. We cross it by faith (or philosophical argument), not by proof.

  This session design forces them to inhabit the formalisms, experience the robustness of the class of computable functions, and then leaves them standing on the edge of the informal, looking back at the formal structures they built, realizing they never quite touched the ground of "human computation" itself.
