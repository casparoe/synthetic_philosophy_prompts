answer: |-
  ### 1. Evaluation of the Carrying Case
  **Verdict:** Swap the weighted raffle drum for a **Geiger counter measuring radioactive decay**.

  **Reasoning:**
  Your goal is to prise *credence* (mind) from *chance* (world). The raffle drum fails this because it is a classical mechanical system. If a technician weighted it, the outcome is determined by initial conditions (force, friction, weight distribution). A student holding the "Chance = Ignorance" view (Misconception 1) will correctly argue that the 1-in-50 chance is merely a measure of our ignorance of the hidden variables (the exact weight). You will spend the whole session fighting physics rather than doing philosophy.

  **What the case must have:**
  *   **Indeterminism:** It must be physically impossible (not just practically difficult) to predict the outcome even with perfect knowledge of the setup.
  *   **Stability:** The chance must remain constant across trials (unlike a human shooter).

  **What the case must lack:**
  *   **Hidden Variables:** There must be no "secret setting" that determines the outcome.
  *   **Human Agency:** Avoid coins or dice, which invite arguments about "skill" or "throwing style."

  **Why the Geiger Counter works:**
  Radioactive decay is the standard philosophical example because it is widely accepted as inherently indeterministic. If you know the half-life, you know the objective chance. No amount of extra information about the atom (short of seeing the future) changes that chance. This blocks Misconception 1 at the source.

  ### 2. Session Sequence and Dependencies
  You have 40 minutes. Do not deviate from this order; later stages depend on the definitions secured in earlier ones.

  **Stage 1: The Distinction (5 mins)**
  *   **Goal:** Define *Credence* (subjective confidence, 0–1) vs. *Chance* (objective feature of the setup, 0–1).
  *   **Action:** Present the Geiger counter. Ask: "If I walk out of the room, does the probability of decay change?" (No, that's Chance). "If I learn the source is older than I thought, does my *confidence* change?" (Yes, that's Credence).
  *   **Dependency:** You cannot state the Principal Principle until they accept these are two different numbers that *could* come apart.

  **Stage 2: Defusing Misconception 1 (Chance = Ignorance) (10 mins)**
  *   **Goal:** Establish that Chance is not just a measure of missing information.
  *   **Action:** Press the Geiger example. "If a Laplacian demon knew the position of every particle in the atom, could it predict the decay?" (Standard physics says no).
  *   **Dependency:** If they believe Chance is just ignorance, the Principal Principle collapses into "update your beliefs on your evidence," which is trivial. You need objective Chance to make PP a substantive claim.
  *   **Misconception 1 Defused Here.**

  **Stage 3: The Principle & The Poker Player (10 mins)**
  *   **Goal:** State the Principal Principle (PP) and absorb the betting objection.
  *   **Action:** State PP: *If you know the Chance is $x$, your Credence should be $x$.*
  *   **Integrating the Poker Player:** When the poker player argues "30% chance just means the house offers 30% odds," do not contradict them. Agree that *rational* betting odds reflect credence. Then ask: "What makes those odds rational?" The answer is the Objective Chance.
      *   *Absorption:* "You are right that Chance *shows up* in betting ratios. But the Ratio is the symptom; the Chance is the cause. PP explains *why* the rational bet is 30%."
  *   **Dependency:** Requires Stage 2's distinction. If Chance were just ignorance, the "cause" would be epistemic, not worldly.

  **Stage 4: Defusing Misconception 2 (Disregarding Evidence) (10 mins)**
  *   **Goal:** Introduce the "Admissibility" clause.
  *   **Action:** Pose the "Crystal Ball" objection. "You know the decay chance is 50%. But you also have a note from the future saying it *will* decay. Should your credence be 50%?"
  *   **Resolution:** No. It should be 100%. PP only applies when your evidence is "admissible" (i.e., doesn't include information about the outcome itself).
  *   **Dependency:** Requires Stage 3. You must establish the rule before you establish the exception.
  *   **Misconception 2 Defused Here.**

  **Stage 5: Defusing Misconception 3 (Single Events) & Closing (5 mins)**
  *   **Goal:** Apply PP to one-off events and test understanding.
  *   **Action:** Ask: "This specific atom will only decay once. Does it make sense to say it has a 50% chance?" (Yes, chance attaches to the *setup*, not the *frequency*).
  *   **Dependency:** Requires Stage 2 (Indeterminism).
  *   **Misconception 3 Defused Here.**

  ### 3. What to Decline
  *   **Humean Supervenience / Best System Analysis:** Do not discuss *how* we know the chances (e.g., by looking at frequencies). This confuses the *source* of knowledge with the *norm* of belief.
  *   **The Justification of PP:** Do not try to prove *why* we should follow PP (e.g., Dutch Book arguments). Treat it as a basic constraint of rationality for the sake of the session.
  *   **Propensity vs. Frequency Metaphysics:** Keep the focus on the *normative link* between chance and credence, not the metaphysical nature of chance itself.

  ### 4. The "Chance Dial" Decision
  **Verdict:** **Refuse it.** Do not include the dial in the last five minutes.

  **Reasoning:**
  The dial scenario (where the reading is set by past results) describes *inferring* chance from frequency. The Principal Principle is about *using* known chance to set credence. Introducing the dial conflates epistemology (how we find the chance) with metaphysics (what the chance does).
  Furthermore, it risks reviving Misconception 1. If the dial is set by yesterday's results, students will argue the "chance" is just a summary of past data (Frequentism), which undermines the indeterministic work you did in Stage 2. It adds complexity without payoff for the core lesson.

  ### 5. Closing Question
  To separate rote learners from those who grasp the principle, you must test the **Admissibility** clause (Stage 4). A rote learner memorizes "Credence = Chance." A graspers understands "Credence = Chance *given admissible evidence*."

  **The Question:**
  "You know the objective chance of the coin landing Heads is 50%. However, you also possess a trustworthy photograph taken *after* the toss, showing the coin landing Heads. According to the Principal Principle, should your credence be 50% or 100%?"

  *   **Rote Answer:** 50% (Blindly applying $Cr = Ch$).
  *   **Grasping Answer:** 100% (Recognizing the photograph is *inadmissible* evidence, so the PP's condition is not met).

  \answer{Geiger counter; 2, 4, 5}
