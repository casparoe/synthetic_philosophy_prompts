  ***

  **Title:** The Cost of Clearing the Path: Re-reading Burke and Chesterton through Coordination

  When we talk about G.K. Chesterton's Fence or Edmund Burke's critique of the French Revolution, the standard reading is usually about epistemic humility. The argument goes: "Don't tear down the fence because your ancestors knew something you don't." It treats tradition as a repository of hidden wisdom that we are too foolish to understand. But after thinking about our seminar discussion on "reverse-coordination cost," I'm convinced this misses the more practical, structural point both authors are making. It's not necessarily that the fence was built for a *good* reason that we've forgotten; it's that the fence has become a part of the current social infrastructure. Tearing it down isn't just an act of demolition; it's an act of forced re-coordination.

  If we look at Chesterton's famous paradox through this lens, the focus shifts from the *past* (why the fence was built) to the *present* (how people are currently moving around it). Chesterton argues that a reformer who sees no use for a fence is not fit to remove it. Usually, we read this as "the fence probably stops a tiger." But under the reverse-coordination cost framework, the fence might not stop a tiger at all. It might be totally useless. However, if generations of people have learned to walk around it, to build their paths relative to it, and to organize their land use based on its presence, then the fence has acquired a functional value simply by existing.

  Removing the fence creates a coordination problem. Suddenly, everyone has to renegotiate how they move through that space. Some might walk through the gap and fall into a ditch that was previously blocked by the fence's shadow; others might collide because the implicit traffic rules have changed. The cost here isn't the loss of the ancestors' wisdom; it's the friction of disrupting a stable equilibrium. Even if the fence is useless, the *removal* of the fence requires a simultaneous adjustment by everyone involved. If that coordination fails—which is likely, since no one planned for the removal—the result is chaos. Chesterton isn't saying the past is holy; he's saying the present is fragile.

  This connects directly to Burke, specifically his defense of "prejudice" and habit. Burke is often criticized for wanting to preserve old injustices just because they are old. But if we apply the coordination cost idea, Burke is actually making a pragmatic claim about social stability. He argues that society is held together by instincts and habits that people don't consciously think about. These habits act like the fence. They coordinate our behavior without us needing to hold a meeting every time we make a decision.

  When revolutionaries tear down these institutions (the church, the monarchy, the class structure), Burke warns that they aren't just removing bad rules; they are removing the glue that holds daily life together. The "reverse-coordination cost" here is massive. To replace these institutions, you would need everyone to agree on new rules at the exact same time. You have to coordinate a new moral framework, a new political loyalty, and a new social hierarchy simultaneously. Burke suggests this is almost impossible to do without violence or tyranny because the transition period creates a vacuum where no one knows how to coordinate with anyone else. The risk isn't that the old way was perfect; the risk is that the transition to the new way is prohibitively expensive in terms of social trust and stability.

  This reading saves both Burke and Chesterton from the charge of blind idolatry. It's not that they think tradition is always right. It's that they recognize that social systems are complex networks of dependency. A rule or a fence becomes "true" or "useful" simply because the system has adapted to it. To remove it is to impose a cost on the entire network.

  Ultimately, viewing these texts through reverse-coordination cost makes the argument stronger, not weaker. It moves conservatism away from a mystical reverence for the dead and toward a hard-headed assessment of risk. The question isn't "Did the ancestors know best?" The question is "Can we afford the chaos of changing the rules when everyone has already built their lives around them?" Whether it's a wooden fence or a constitutional norm, the danger lies in the removal, not necessarily in the object itself. We shouldn't keep the fence because it's sacred; we should keep it because taking it down might break the path everyone is walking on.
