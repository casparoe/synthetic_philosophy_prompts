  3. The film ultimately celebrates agency inside a deterministic world by showing that sensitivity to initial conditions means tiny nudges are leverage, allowing her scream and sprint to rewrite the immediate future. Yet the roulette wheel remains a dry joke about limits, reminding us that while she controls the effort, the universe still reserves the final say on where the ball lands.

