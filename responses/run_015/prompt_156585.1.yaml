  my philosophy of science prof keeps comparing deterministic chaos to a game of billiards on a table that's been warped by heat — the balls still obey Newton's laws exactly, so determinism holds, but the warp makes long-term prediction impossible unless you measure the table's curvature to infinite precision. she uses this to argue that chaos is purely an epistimic problem, not an ontological crack in determinism, and that Laplace's demon would still win if he just had sharper eyes. I'm taking this course and we got into a big argument about it, but I'm not convinced the analogy does the work she thinks it does.

  can you map out the correspondances — billiard balls are physical states, the warp is sensitive dependence, the sharper eyes are the epistemic limit — and then tell me where it falls apart? in particular, doesn't it smuggle in the idea that there's always one true trajectory hiding behind our blur, and does that hold for structurally unstable systems where changing the rules by epsilon changes the attractor entirely? also, what about dissipative systems vs Hamiltonian ones — does the billiard analogy quietly assume conservation of energy that doesn't apply everywhere? I want the correspondance table, the disanalogies that actually matter for her determinism-is-safe conclusion, whether that conclusion survives, and if the billiard picture is broken, is there a better analogy that doesn't assume a hidden perfect observer?
