answer: |-
  Good morning. Welcome to the Institute, and thank you for traveling here, whether from across the city or across disciplines. Looking around this room, I see a division that is deliberate. On one side, you have those who make their living studying uncertainty—forecasters, analysts, philosophers who know the architecture of error. On the other, you have those who make uncertainty possible—donors, board members, family members who trust us with resources and patience.

  We are gathered under the title "Forecasting and Humility." But I want to be clear about what we are not doing today. We are not here to learn how to be right more often. We are here to understand why being right is sometimes the wrong goal, and why being wrong is sometimes inevitable.

  To do this, we must confront what I will call the single-case reference problem.

  When you make a decision, you inhabit an inside view. You have access to your specific models, your specific doubts, the unique texture of the moment. You know why *this* situation feels different from the last one. You feel the weight of the specific variables in front of you. This view is necessary; without it, you cannot act.

  But there is also an outside view. This is the view from a distance. It places you not as a unique reasoner, but as a member of a statistical class. It notes that people like you, in situations like this, tend to be overconfident. It notes that plans like yours have a known base rate of failure.

  Here is the tension: These two accounts cannot be merged into a single authoritative narrative without doing epistemic violence to one side. If you privilege the inside view entirely, you ignore the systemic biases that humble us. If you privilege the outside view entirely, you erase the specific context that makes your judgment valuable. You cannot simply average them. You cannot stand fully inside your own mind and fully outside of it at the same time.

  Let me offer an illustration to ground this.

  Imagine a committee of five people. They hold the authority to release emergency funds to a community facing a sudden, ambiguous crisis. The data is incomplete. The clock is ticking.

  From the inside, the committee sees the faces of the community leaders who pleaded with them. They know the specific qualifications of the team on the ground. They feel the moral urgency of the moment. They have adjusted their model for the unique politics of this region. To them, the decision to fund feels like a reasoned response to reality. To deny the funds feels like a betrayal of the specific truth they hold.

  From the outside, however, this committee is simply one instance of a broader class: "groups deciding under time pressure with incomplete data." History tells us that such groups are prone to urgency bias. They often mistake charisma for competence. The base rate suggests that similar interventions fail to meet their objectives sixty percent of the time. To the outside observer, the committee's confidence looks less like insight and more like a predictable psychological pattern.

  For the experts in this room, this illustration highlights a reference-class trap. You see how the committee's specific adjustments might be noise masquerading as signal. You see the structural vulnerability.

  For the non-experts in this room, this illustration highlights the human pressure of the moment. You feel the moral weight of the decision. You understand that telling the committee to "look at the base rate" feels like telling them to ignore the people suffering in front of them.

  Both perspectives are true. Both are necessary. And they are in conflict.

  This is why we are here. We are not here to resolve this conflict. There is no formula I can give you that will successfully merge the inside view and the outside view without losing something essential. If I promised you that this workshop would teach you how to silence that tension, I would be violating the very humility we claim to prize.

  Instead, our purpose today is to learn how to reason well while holding both accounts in mind. We will ask how to honor the specificity of the case without succumbing to the arrogance of exception. We will ask how to respect the statistics without surrendering to fatalism.

  For the forecasters here, I ask you to resist the urge to reduce the human element to a variable. For the donors and partners, I ask you to resist the urge to demand certainty where only probability exists.

  We will spend the day inhabiting the gap between the view from within and the view from above. We will not close that gap. We will simply learn to stand in it without falling.

  Thank you. Let us begin.
