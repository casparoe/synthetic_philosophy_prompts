      *   **Problem:** Current policy (principal-agent model) is too narrow (misses clientelism) and too culturally rigid (ignores local norms/relationship building).
      *   **Task:**
          1.  **Classification:** Define four categories (Narrow Bribe, Clientelist Exchange, Gift/Hospitality, Coercive Extraction). Explain operational outcomes for each. Distinguish from elite capture/bad design/predatory states.
          2.  **Procedure:** Build a decision tree/flowchart based on five proposed tests (Refusal, Convertibility, Avowal, Recurrence, Second-Best Trap). Order, repair, discard, or add tests. Address cultural loading (especially Avowal). Include a "whose voice" check. Must be usable in 20 mins, fit on one side A4, specify stop points/referral points.
          3.  **Case Studies:** Run the procedure on three specific cases (MP Funeral Fund, Customs Broker/Vaccines, Sitting Allowances/Gifts). Address the "routine practice" dilemma in Case 3 realistically.
          4.  **Deliverables:** One-page version for staff + Note to Head of Integrity on what was lost/simplified.
          5.  **Limitations:** Explicitly state what the procedure *cannot* do and where human judgment remains essential.
      *   **Constraints:** No citations/named authorities. Brief conceptual work. Practical tone.

  2.  **Deconstruct & Draft - Section by Section:**

      *   **Section 1: Classification:**
          *   Need to define the four types clearly without academic jargon.
          *   *Narrow Bribe:* Quid pro quo, private gain, violates duty. -> *Action: Refuse & Report.*
          *   *Clientelist Exchange:* Public resource for political loyalty/support. Not private pocketing, but distorts allocation. -> *Action: Redesign/Escalate (Systemic).*
          *   *Gift/Hospitality:* Relationship maintenance, social obligation, non-convertible. -> *Action: Tolerate & Log (if within limits).*
          *   *Coercive Extraction:* Facilitation payment under duress, no alternative. -> *Action: Pay (if safety/critical service at risk), Log, Escalate.*
          *   *Exclusions:* Must distinguish from "Elite Capture" (structural, not transactional), "Bad Design" (our fault), "Predatory State" (context, not specific act).

      *   **Section 2: The Procedure (The Tests):**
          *   *Reviewing the 5 proposed tests:*
              1.  *Refusal Test:* Can they say no? (Good, tracks coercion vs. choice).
              2.  *Convertibility Test:* Cash vs. Consumable/Symbolic. (Good, tracks bribe vs. gift).
              3.  *Avowal Test:* Would they tell others? (Problematic culturally. Needs repair).
              4.  *Recurrence Test:* One-off vs. Standard Rate. (Good, tracks systemic vs. anomaly).
              5.  *Second-Best Trap:* Does stopping this hurt beneficiaries? (Crucial for development context).
          *   *Ordering:* Logic flow should go from Safety/Coercion -> Nature of Value -> Transparency -> Systemic Impact.
          *   *Repairs:*
              *   *Avowal:* Change "Would you tell?" to "Who would be offended if they knew?" (Shifts from shame to audience).
              *   *Add:* "Voice Test" (Who defines the norm? The powerful or the marginalized?).
          *   *Structure:* Needs to be a flow.
              1.  Is it coercive? (Safety/Critical Service).
              2.  Is it convertible to cash/private gain?
              3.  Is it avowable to the *beneficiaries*?
              4.  Is it recurrent/standard?
              5.  Does stopping it cause harm?
          *   *Referral Points:* When values clash (e.g., local norm vs. donor rule), refer to Head of Integrity.

      *   **Section 3: Case Studies:**
          *   *Case 1 (MP Funeral Fund):* Clientelist. Contractors paying = diversion of project funds for political loyalty. *Verdict:* Redesign/Escalate. Not a narrow bribe (MP isn't pocketing), but corrupt use of project resources.
          *   *Case 2 (Customs/Vaccines):* Coercive Extraction. Critical service (cold chain). *Verdict:* Pay to save vaccines, Log, Report. (Classic facilitation under duress).
          *   *Case 3 (Sitting Allowances/Gifts):* This is the hard one.
              *   *Allowances:* Recurrent, expected, effectively a top-up salary. *Verdict:* Redesign (build into budget properly) or Tolerate & Log (if sector standard).
              *   *Gifts (Goat/Fruit):* Non-convertible, relationship. *Verdict:* Tolerate & Log.
              *   *Realism:* Acknowledge we can't just "stop" allowances overnight. The procedure should flag this as "Systemic/Structural" requiring HQ/Donor conversation, not just field refusal.

      *   **Section 4: Deliverables:**
          *   *One-Pager:* Needs to be clean, bold text, decision tree style.
          *   *Note to Head of Integrity:* What was simplified? (Nuance of "political loyalty", the difficulty of "beneficiary harm" assessment).
          *   *Limitations:* It doesn't solve power imbalances. It doesn't replace moral courage. It creates a paper trail, not necessarily ethical purity.

