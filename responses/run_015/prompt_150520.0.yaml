prompt: |-
  I work on developer tooling, and most of what I ship is external memory for other people's thinking: language-model agents with retrieval and scratchpads, IDEs that hold half a codebase's invariants in autocomplete, note systems people query instead of remembering. In design reviews we keep having the same argument in engineering vocabulary — is this artifact part of the cognitive system, or an instrument the agent consults? I want a specification, not a slogan.

  Please write out what a theory of cognitive extension would have to deliver in order to be usable for that purpose: as a decision procedure for someone who has to say, of a given artifact embedded in a given practice, whether it is (or is becoming, or could be trained into being) part of the agent's cognitive machinery rather than a tool the agent uses. For each requirement, give the case or consideration behind it, and mark whether it is non-negotiable for my purpose or merely a preference of one camp. Where a requirement is really a prejudice of a research programme dressed up as a constraint, say so.

  Here are the cases I want any candidate theory forced to adjudicate — add the ones I'm missing and discard any you think are bogus:

  - A retrieval-augmented agent whose retrieved passages are causally upstream of every output, are not in its weights, are fetched by a mechanism the system itself invokes, and are intermittently wrong without the agent noticing. Contrast it with an agent that ingested the same corpus during training. Both are causally dependent on the same text; only one is intuitively "remembering."
  - A senior engineer who cannot state the invariants of the system she maintains unless the IDE is open with autocomplete and inline docs. Her dependence looks structurally identical to the agent's, but no one calls her prosthetically augmented — they call her competent.
  - The diarist who writes everything down and never rereads it: the externalization does its work at write time, with no read-back loop at all.
  - Resources the agent modifies and whose modification does the work — a scratchpad, a sketch, a reordered pile — where nothing like storage-and-retrieval is happening.
  - Resources the agent built itself versus ones designed by someone else: your own notebook versus your colleague's, your own retrieval corpus versus a vendor's.
  - Dependence that fades with practice: the newcomer who must look up every API signature and the veteran who no longer does. Does the theory have to handle degrees and trajectories, or can it defend a binary verdict?
  - The pair-programming and on-call-rotation cases, where the functionally relevant loop runs through other people. If the cut isn't at the skull and the skin, what stops it from running out to the whole organization, and is that stopping problem a defect of the theory or of my question?
  - The gap between extending cognition and extending a mind: whether my design question even needs the phenomenal-consciousness half of the claim, and whether a theory may collapse that distinction or must respect it.

  Beyond the cases, tell me which desiderata you think cannot be jointly satisfied — if some subset is unsatisfiable, that itself is the answer I most want — and which single requirement does the most work in excluding candidates. I'd also like a short scorecard, but score moves rather than authors: the parity-style move (treat an external process that plays the same functional role as an internal one as cognitive), the proprietary-marker move (cognition requires a kind of content or process artifacts cannot have), the integration-and-entrenchment move (availability, ease of access, trust, and a history of incorporation into practice), and the interventionist move (constitution as mutual manipulability). No names, dates, or citations — I want the moves, not the bibliography. A table is fine if it stays readable.

  Two last things. First, I have no philosophy background: flag any term of art when you first use it, but don't slow down to explain the basics of the debate. Second, calibrate and push back: tell me which claims in your answer you hold confidently and which are contestable or speculative, and if the request as posed rests on a confused premise — if "part of the cognitive system" has no fact of the matter to be right about, or if my design question turns out to be a different question wearing this one's clothes — say that plainly instead of handing me a tidy list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Developer tooling engineer. Builds external memory systems (RAG agents, IDEs, note systems).
      *   **Core Problem:** Design reviews keep arguing about whether an artifact is *part of the cognitive system* or just a *tool*. They need a specification/decision procedure, not a slogan.
      *   **Task:** Write out what a theory of cognitive extension must deliver to be usable for this purpose.
      *   **Requirements:**
          *   List requirements for the theory.
          *   For each requirement: Case/consideration behind it, mark as Non-Negotiable vs. Preference, flag if it's a prejudice disguised as a constraint.
          *   Adjudicate specific cases provided (RAG vs. Training, IDE-dependent Engineer, Diarist, Scratchpad, Self-built vs. Vendor, Fading Dependence, Social/Team loops, Cognition vs. Mind).
          *   Add missing cases/discard bogus ones.
          *   Identify unsatisfiable desiderata (trade-offs).
          *   Identify the single most exclusionary requirement.
          *   Scorecard of "moves" (Parity, Proprietary-Marker, Integration/Entrenchment, Interventionist).
          *   No names/dates/citations (focus on moves).
          *   Flag terms of art.
          *   Calibrate/Push Back: State confidence levels, identify confused premises, admit if "fact of the matter" is missing.
      *   **Constraint:** No philosophy background assumed, but don't slow down for basics.
      *   **Tone:** Rigorous, engineering-specification style, critical, direct.

  2.  **Deconstruct the Core Tension:**

      *   The user wants a *decision procedure* (binary or graded verdict) for a metaphysical/functional distinction (Cognitive Extension vs. Tool Use).
      *   *The Hard Truth:* There is no consensus "fact of the matter" in philosophy of mind regarding where cognition stops and the world begins. The Extended Mind Thesis (EMT) is a framework, not a law of physics.
      *   *The Engineering Reality:* The distinction matters for *design* (latency, trust, coupling, error handling), not necessarily for *ontology*.
      *   *The Pushback:* I need to tell the user that asking for a metaphysical specification for an engineering problem might be a category error. The "is it cognitive?" question might actually be "is it coupled tightly enough to treat as state?"

  3.  **Drafting the Requirements (The Specification):**

      *   To function as a decision procedure, a theory needs:
          1.  **Operationalizability:** Can I measure the criteria? (Non-negotiable for engineering).
          2.  **Causal Density:** How tight is the loop? (Non-negotiable).
          3.  **Transparency/Trust:** Does the agent trust the output implicitly? (Preference/Debatable).
          4.  **History/Entrenchment:** Has it been used long enough? (Preference).
          5.  **Agency/Control:** Who owns the modification? (Debatable).
      *   *Prejudice Flag:* The idea that "internal" is the default and "external" needs proof is a biological prejudice (cranialism).

  4.  **Adjudicating the Cases:**

      *   *RAG vs. Training:* Functionally similar, temporally different. Parity principle suggests both are cognitive if the role is the same. But RAG is fallible in a way weights aren't (hallucination vs. retrieval error).
      *   *IDE Engineer:* She is competent *with* the tool. Is the tool cognitive? Yes, by parity. But we don't call *her* augmented because "human" is the baseline.
      *   *Diarist (Write only):* This is offloading, not extension. No feedback loop. Likely not cognitive extension.
      *   *Scratchpad:* High coupling, transient state. Strong candidate for extension.
      *   *Self-built vs. Vendor:* Irrelevant to function, relevant to trust/maintenance.
      *   *Fading Dependence:* Suggests internalization. Theory must handle gradients. Binary is useless here.
      *   *Social Loops:* If cognition extends to IDE, why not teammate? (The "Social Extension" problem). Stopping problem is real.
      *   *Cognition vs. Mind:* Engineering cares about *Cognition* (processing), not *Mind* (qualia/phenomenology). Collapse the distinction for this purpose.

  5.  **Identifying Unsatisfiable Desiderata:**

      *   *Precision vs. Flexibility:* You can't have a sharp boundary (binary verdict) for a phenomenon that is inherently continuous (coupling strength).
      *   *Function vs. History:* Parity says "what it does" matters. Entrenchment says "how long it's been there" matters. These conflict (new tool doing same job vs. old tool).
      *   *Individual vs. System:* If you define the system too broadly (org), you lose the ability to debug the individual agent.

  6.  **Scoring the Moves:**

      *   *Parity:* Strongest for engineering, but risks over-inclusion (everything is cognitive).
      *   *Proprietary-Marker:* Weak for engineering (implies magic inside skull).
      *   *Integration/Entrenchment:* Practical, but vague.
      *   *Interventionist:* Best for debugging/testing.

  7.  **Refining the Pushback (Crucial Step):**

      *   The user asks for a "fact of the matter." I must state clearly: There isn't one. It's a pragmatic choice, not a discovery.
      *   The question "Is it cognitive?" is actually "What are the failure modes if this link breaks?"
      *   I need to be honest that philosophy cannot deliver a compiler spec for metaphysics.

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the goal, state the hard truth (no fact of the matter).
      *   **Specification Requirements:** Table/List with Negotiability and Prejudice flags.
      *   **Case Adjudication:** Go through the user's list + additions.
      *   **Unsatisfiable Desiderata:** The trade-offs.
      *   **Scorecard of Moves:** Evaluate the philosophical strategies.
      *   **Calibration & Pushback:** Confidence levels and the "Confused Premise" warning.

  9.  **Drafting Content - Specific Considerations:**

      *   *Term Flagging:* "Causal Coupling," "Constitution," "Qualia," "Parity Principle."
      *   *Tone Check:* Keep it dry, spec-like. Avoid academic fluff.
      *   *The "Diarist" Case:* This is key. Writing without reading is just output. It's not memory. It's computation offloading maybe, but not extension of *memory*.
      *   *The "Social" Case:* This is the "Explosion Problem." If cognition extends to the IDE, does it extend to the API docs written by a stranger? Yes. Does it extend to the teammate? If the loop is tight enough, yes. The boundary is pragmatic, not ontological.
      *   *The "Binary" Request:* I must argue against the binary. Degrees of coupling are real. Binary is a design constraint, not a metaphysical truth.

  10. **Final Review against Constraints:**
      *   No names/dates? (Check: No Clark & Chalmers, no Menary, etc.)
      *   Flag terms of art? (Check).
      *   Scorecard moves not authors? (Check).
      *   Pushback included? (Check).

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest the "Trust" criterion is non-negotiable.
      *   *Correction:* No, agents can use untrusted tools cognitively (e.g., verifying a calculation). Trust is a safety constraint, not a cognitive one. Change to "Transparency of Access."
      *   *Initial thought:* Treat the "Mind vs Cognition" distinction as vital.
      *   *Correction:* User is building tools. They don't care about *qualia* (what it feels like). They care about *processing*. I should advise them to drop the "Mind" part entirely.

  12. **Final Polish:** Ensure the distinction between "Constitution" (is part of) and "Causation" (affects) is clear, as that's the heart of the engineering problem. (If it breaks, does the agent lose capacity or just input?)

  *(Self-Correction on "No Philosophy Background"):* I need to make sure I explain "Constitution vs Causation" simply when I use it, as it's the pivot point of the whole debate.

  *(Refining the Pushback):* The strongest pushback is that the user is asking for an *ontological* answer to an *architectural* question. The answer should reframe the spec from "Is it mind?" to "Is it state?"

