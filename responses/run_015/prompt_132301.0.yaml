  **1. Dennett's Evolutionary-Scaffolding Account – Tier S**
  This account secures first-order flexibility through evolved competences and second-order adaptability via cultural and individual scaffolding, thereby earning freedom without invoking metaphysically obscure powers. By treating agency as a layered design achievement, it avoids both mechanical rigidity and the excesses of libertarianism.

  **2. Predictive-Processing Framework – Tier A**
  Precision-weighted error minimisation guarantees responsive behavioural adjustment and allows for the updating of generative models, yet it risks reducing agency to a form of homeostatic regulation that might constitute an overly permissive compatibilism. While it offers a robust mechanistic explanation for meta-cognitive adaptability, the normative status of such inference remains contested.

  **3. Frankfurt-Style Hierarchical Compatibilism – Tier B**
  While hierarchical endorsement mitigates rigid first-order impulses, the model often treats second-order volitions as fixed structures, leaving the system vulnerable to meta-cognitive canalisation. Consequently, it struggles to explain how the architecture of desire itself might be restructured in response to repeated failure.

  **4. Agent-Causal Libertarian View – Tier D**
  Although it posits a causal break to ensure behavioural novelty, it offers no mechanistic explanation for architectural revision and relies upon metaphysically obscure powers that fail to satisfy naturalistic constraints. This position resists sphexishness by fiat rather than design, collapsing into the very implausibility the evaluation criteria seek to avoid.
