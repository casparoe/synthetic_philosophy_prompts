  5.  **Evaluating the Theses:**

      *   *Thesis 1 (Concavity):* Substantive/Defensible within vNM. Does it support dismissal? No, because risk *neutrality* or *seeking* is also consistent with vNM if utility is linear/convex. It explains *some* risk aversion, but doesn't prove risk aversion is *required*.
