      Investment Objective
      Nilgrom & Vane LLP presents the Static Fund. Our objective is capital preservation through the rigorous application of market epistemology. We operate on the principle that where priors are common and rationality is common knowledge, speculative trade yields negative expected value after costs. Consequently, the Fund maintains a zero-turnover posture, intervening only to accommodate exogenous liquidity needs or to absorb noise from less informed market participants. We do not seek alpha; we seek consistency with rational expectations equilibrium. Our mandate is to remain static whilst the market corrects around us. This is the only fund warranted by the no-trade theorem. Inactivity is the ultimate form of active management when information is symmetric.

      Key Terms
      1. Turnover Limit: Annual portfolio turnover shall not exceed 0.00%, barring fiduciary accommodations required by regulatory capital constraints or client inflows.
      2. Fee Structure: Investors pay 1.5% per annum on 'avoided-alpha', calculated as the theoretical gain from trades contemplated but declined following internal review by the Investment Committee. This fee compensates for the discipline required to refrain from speculation.
      3. Stokey Ratio: Quarterly reporting of trades considered versus trades executed. A high ratio indicates epistemic stability and strict adherence to the no-speculation result.
      4. Common Prior Certificate: Subscribers must warrant that their probability assessments align with the House prior before allocation. Divergence is treated as fundamental incompatibility.
      5. Prior Reconciliation Questionnaire: Applicants must answer: (a) Do you possess private information not reflected in price? (b) Do you believe current prices fully reflect all available data? (c) Is your willingness to trade common knowledge among all agents? Answers are binding.
      6. Disagreement Clause: Any investor contesting the Fund's valuation is deemed to hold a divergent prior. Such units are compulsorily redeemed at the Fund's mark without appeal, as agreeing to disagree is theoretically impossible.
      7. Transaction Characterisation: All necessary purchases are classified as non-informational rebalances, inventory adjustments, liquidity provisions, hedging instruments, strategic holds, passive accumulations, fiduciary accommodations, or causal maintenance activities. No purchase implies superior information. Any deviation must be logged as a regulatory necessity.
      8. Counterparty Reliance: The Fund requires external order flow to function. We rely on counterparties whose trades are not driven by private information to provide necessary liquidity for our hedging operations and inventory management.
      9. Valuation: Assets are marked to consensus priors. Where prices diverge from fundamental value due to informed trading, the Fund holds cash to avoid adverse selection costs.

      Risk Factors
      Investment involves significant risk. The primary risk is that the no-trade theorem holds true, rendering all active management futile, including this offering. Conversely, if the theorem is false, the Fund's strategy may underperform active benchmarks significantly. There is a specific risk that reading this prospectus conveys private information regarding the Fund's strategy, thereby altering the reader's prior. If this disclosure creates an information asymmetry between the investor and the broader market, the investor may be disqualified from participation under the Common Prior Certificate. Furthermore, this document constitutes an offer to trade. If the market infers from this offer that the Fund possesses private information motivating the offer itself, the validity of the Common Prior is compromised. Investors should be aware that if prices fully reveal information, incentives to gather such information vanish, potentially collapsing the liquidity required for the Fund's occasional inventory adjustments. We rely explicitly on the existence of uninformed order flow; should all market participants become rational and informed, the Fund's ability to execute even non-speculative hedges may be impaired. The Fund may cease operations if the market becomes fully efficient, as no counterparties would remain to absorb our inventory adjustments. Past performance of static strategies is not indicative of future inactivity. The act of subscribing may itself signal private information to the market, adversely impacting the Fund's remaining positions. Issuing this prospectus may be interpreted as a trade signal, invalidating the premises upon which the Fund is built. Should the market achieve full informational efficiency, the Fund's liquidity providers may disappear, leaving positions unmarked.

      Dr Hilary Vane, Chief Prior Officer.

