answer: |-
  The empirical premise of your seminar debate is robust: by almost any standard metric of lethal force, the risk of being killed by another human being has declined precipitously over the long run. The disagreement lies in whether this empirical trend sustains the philosophical thesis that the world is becoming less violent. Your classmate sees a moral fact; you see a bookkeeping artifact. The truth lies between these poles. The unqualified claim that the world is becoming less violent is not a statement that can be true or false simpliciter. It is only true relative to a stipulated currency, denominator, and population boundary. However, not all stipulations are morally equal. There is a privileged metric grounded in the reduction of severe harm, and under that metric, the decline is real, though its distribution demands a specific practical response.

  Consider first the currency problem. Violence is not monolithic; it ranges from death to disability, from physical assault to the psychological terror of credible threats. Your classmate counts deaths; you rightly note that a society could reduce homicides while increasing torture or domestic abuse. The proposal to collapse these into a single metric, such as person-years of suffering or autonomously chosen activity foregone, is theoretically elegant but practically circular. To convert a bruise into units of suffering comparable to a bullet wound requires a weighting scheme. That scheme is not discovered in the data; it is imposed by the observer. Collapsing the currencies does not dissolve the arbitrariness; it merely relocates it to the conversion rate.

  However, this does not render all currencies equal. Death is a unique currency because it is irreversible and forecloses all future agency. While a rise in non-lethal assault could theoretically outweigh a decline in homicide in a calculus of suffering, the moral urgency of preventing death grants homicide rates a privileged status. They are the hard floor of violence measurement. If the rate of death declines, the world is less violent in the most morally significant sense, even if lesser forms of harm fluctuate. To deny this is to imply that the difference between being killed and being threatened is merely a matter of scale rather than kind. Therefore, while the currency choice is technically stipulative, the choice of mortality is morally mandated for any thesis about the overall reduction of violence.

  Second, the denominator problem asks whether we should count violence per capita, in absolute numbers, or per social encounter. Absolute numbers are irrelevant to the thesis of individual safety; a world with twice the population and the same per capita risk is not less violent for the individual, even if the total bloodshed is higher. Counting per social encounter is more nuanced. As urbanization increases the number of strangers one meets, a stable per capita rate might imply a miraculous decline in the probability of violence per interaction. However, this denominator is notoriously difficult to measure historically. The per capita rate remains the most robust proxy for individual risk. When we say the world is becoming less violent, we should be read as invoking the per capita risk of severe victimization. This captures the civilizing effect your classmate identifies without hiding the total cost of population growth.

  Third, the concentration objection and the measurement problem complicate the picture further. The decline in violence is indeed a fact about averages. Violence has become increasingly concentrated in specific subpopulations and weak states. For the typical person in a stable polity, the risk has collapsed; for the marginalized person in a conflict zone, it may have remained static or worsened. Does this refute the thesis? It refutes the idea that violence has been eliminated, but not that it has declined on average. The measurement problem cuts similarly. Better documentation in modern times should inflate recent counts relative to the past, making the documented decline harder to dismiss as an artifact of poor record-keeping. However, the remaining violence is concentrated precisely where registration is weakest. We may be undercounting the tail of the distribution. This suggests the decline is real but potentially less complete than the headline rates suggest.

  This leads to the verdict. The claim "the world is becoming less violent" is true only relative to the stipulation of individual expected mortality risk. But is this stipulation sufficient? To test this, apply the swap test. Would a randomly selected person from a violent century accept a lottery ticket relocating them to a random life today? If the test merely smuggles in modern medicine and wealth, it is rigged. We must isolate violence. Even so, the rational choice is to take the ticket. The probability of landing in the concentrated tail of modern violence is statistically lower than the baseline risk of death by violence in almost any prior era. The average improvement is so large that it swamps the risk of landing in the dangerous minority. The swap test confirms the thesis: a random soul would prefer the odds of today.

  However, the swap test is an arbiter of individual rational choice, not necessarily of moral priority. For the individual, the average risk matters most. For the moral agent aiming to reduce violence, the concentration objection changes the calculus. If violence is concentrated in a small subpopulation, the average rate becomes a misleading guide for action. Reducing violence in stable societies yields diminishing returns; reducing violence in the concentrated tail yields massive moral dividends.

  Therefore, someone trying to reduce violence would be making a mistake if they focused on the average rather than the tail. The headline rates look worst in specific settings precisely because that is where the violence has retreated and concentrated. Focusing there is not a mistake; it is the only way to address the remaining bulk of the problem. The decline of violence is a real historical trend relative to individual risk of death, but it is an uneven one. The world is less violent for the average person, but not necessarily for the most vulnerable. The thesis holds, but only if we acknowledge that the "world" in the claim refers to a statistical average, not a universal experience. To argue otherwise is to confuse the success of the aggregate with the safety of the individual. The bookkeeping choices are contestable, but the moral imperative is clear: measure by deaths, weigh by risk, but act where the concentration lies. The decline is real, but the work is unfinished precisely because the violence that remains is hidden in the averages we celebrate.
