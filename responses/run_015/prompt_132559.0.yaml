      *   *Awkward:* Complexity in calculation, Conflict with existing legal frameworks.

  5.  **Distinguishing Opponent Concessions:**

      *   *Linear Aggregators (Utilitarians):* They will say the boundary is arbitrary. Any non-zero harm adds up. They will concede that *if* there is a boundary, their view is wrong. But they attack the *existence* of the boundary.
      *   *Lexical Prioritarians (Deontologists/Rawlsians):* They will say the boundary is too permissive. Torture should *never* be traded. They might like the "inert below threshold" part but hate the "competes above threshold" part. They attack the *consequence* of crossing the boundary.

  6.  **Assessing Unfalsifiability:**

      *   The definition relies on "conscious moments" and "order of magnitude." These are fuzzy.
      *   If a counterexample shows the threshold is wrong, can the user just adjust the "order of magnitude"?
      *   Is this a virtue (robustness) or vice (dogmatism)? In regulation, clarity is needed. Fuzzy thresholds are bad for law.

  7.  **Drafting the Response (Iterative refinement):**

