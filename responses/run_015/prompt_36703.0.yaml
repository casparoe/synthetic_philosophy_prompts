answer: |-
  Hey, it is great to hear you are diving into this for your term paper because honestly the EPO era of cycling is one of the most visceral real-world examples of a multipolar trap you could possibly pick, and your professor is right to warn you about discipline because it is very easy to let the metaphor do all the work instead of the analysis. You have got the facts down cold and the intuition is mostly spot on, but there are some jagged edges where the Moloch framework might scrape against the reality of what happened, and figuring out where those edges are is exactly where you will get your best marks. Let us walk through the mapping you proposed and see where it holds and where it might need some patching.

  Starting with the players and payoffs, you are absolutely right to center the riders as the primary agents in the trap, but you need to be careful about defining the payoff structure so it doesn't look too simplistic. For a rider, the payoff is not just winning a race, it is contract renewal, sponsorship bonuses, and career longevity, all of which are heavily tied to relative performance. If the baseline performance of the peloton shifts upward because everyone is using EPO, then a clean rider is not just slightly slower, they are functionally unemployed. In game theory terms, you are correct that staying clean becomes a strictly dominated strategy once the adoption rate hits a certain critical mass. If everyone else dopes and you do not, you lose your job. If everyone dopes and you do too, you stay in the job but incur health risks and moral costs. Since losing your job is the worst outcome, doping becomes the dominant strategy regardless of what you think about the ethics. This creates that classic Moloch dynamic where the equilibrium is everyone doping, everyone is healthier and poorer morally than if everyone was clean, but nobody can unilaterally deviate without self-destructing. That part of the mapping is solid and you should lean into it hard.

  Where it gets interesting and where you need to be nuanced is the 50 percent hematocrit rule. You asked if this should be read as an attempted escape that turned into a coordination point, and I think that is exactly right. In a standard race to the bottom, you expect no rules or ineffective rules, but here the rule actually stabilized the arms race. By setting a hard ceiling that was enforced as a health measure rather than a doping violation, the UCI inadvertently created a Schelling point. It told every rider and team doctor exactly where the finish line was. You did not need to dope until you dropped dead, you just needed to dope until you hit 49.9 percent. This reduced the uncertainty and the health risk slightly, which paradoxically made the doping sustainable for longer. It turned a chaotic arms race into a managed equilibrium. This fits the framework if you view it as the system optimizing for the continuation of the competition rather than the health of the agents. The system selected for the rule that kept the riders racing, even if it meant institutionalizing the cheating. So yes, argue that the regulation was co-opted by the logic of the trap to sustain the trap rather than solve it.

  The Festina scandal is another place where your intuition about payoff structures is crucial. You asked why the scandal did not dissolve the trap, and the Moloch view gives a cold but accurate answer: because the underlying incentives did not change. A scandal changes the reputational cost temporarily, but if the sponsors still pay for wins and the fans still watch for speed, the payoff matrix remains identical. Moralizing does not change the Nash equilibrium. Only changing the detection risk or the reward structure does. During the Armstrong years, even after Festina, the detection risk was still low enough and the reward for winning the Tour de France was high enough that the expected value of doping remained positive. The trap only began to loosen when the biological passport and improved testing actually shifted the probability of getting caught high enough to make doping a risky financial bet. This supports your professor's warning about discipline: do not argue that people became more moral, argue that the math changed.

  Now let us get to the thing that is bothering you the most, which is the Omertà. You are worried that a multipolar trap implies a failure of coordination, but the peloton clearly coordinated to protect the doping through silence and ostracization of whistleblowers like Christophe Bassons. This is a really sharp observation and it is where a lot of students would force the square peg into the round hole, but you do not have to. The key is to distinguish between coordination to escape the trap and coordination to maintain the trap. Moloch describes a situation where agents cannot coordinate to move to a better equilibrium. It does not say they cannot coordinate at all. In fact, once a bad equilibrium is established, agents often have a strong incentive to cooperate to prevent external interference or internal defection that might collapse the system. The Omertà was a secondary game layered on top of the primary arms race. The primary game was the multipolar trap of competition where cooperation was impossible. The secondary game was a prisoner's dilemma regarding secrecy where cooperation was essential to avoid punishment from the UCI or police. They solved the coordination problem of silence in order to preserve the coordination failure of performance. You can also shift your unit of analysis here. If you view the teams as the primary agents rather than the riders, the dynamic changes slightly. Teams competed against each other in a multipolar trap, but within a team, the coordination was hierarchical and enforced. The team managers and doctors coordinated the doping to ensure their team could compete in the wider trap. So the Omertà is not an anomaly, it is a defense mechanism of the trap itself.

  However, you also asked where the model breaks, and you need to be honest about this because no framework is perfect. The biggest tension here is the level of intentionality. The Moloch metaphor often implies an impersonal system, a invisible hand pushing everyone toward ruin. But in cycling, there were visible hands. There were doctors mixing bags in hotel rooms, managers handing out supplements, and organized conspiracies. This moves it slightly away from a pure market failure toward a criminal enterprise. A pure multipolar trap suggests that nobody is in control, but here many people were in control and were actively managing the doping. You should acknowledge that the framework explains the why of the doping but maybe less of the how. The model explains why the pressure existed, but it does not fully capture the organized crime aspect that facilitated it. Additionally, the role of the UCI is tricky. In a strict trap model, the regulator is external. But evidence suggests parts of the UCI were complicit or willfully blind to protect the commercial viability of the sport. If the referee is taking bribes or sharing the incentives of the players, it is not a trap, it is corruption. You should carve out space to say that the Moloch framework explains the riders' dilemma perfectly, but gets messier when you include the governing body as a player who might have been benefiting from the arms race rather than trying to stop it.

  Another place the model strains is the assumption that the equilibrium was stable. It was not perfectly stable because there were defectors. Riders like Bassons or later those who testified did exist, which means staying clean was not strictly dominated for everyone, only for those who prioritized winning above all else. The trap was leaky. A rigorous paper should acknowledge that the equilibrium was maintained through coercion and social pressure, not just abstract payoff matrices. The social cost of being the whistleblower was artificially inflated by the group to mimic the economic cost of losing. This brings in sociological factors that pure game theory sometimes glosses over. You do not need to discard the framework, but you should note that the social enforcement mechanisms were required to keep the math working.

  So if I were writing this, I would structure the argument to say that the EPO era is a textbook example of a multipolar trap driving individual behavior, but with the caveat that the participants built a cooperative shell around the competitive core to protect it. The arms race was the Molochian element, the Omertà was the social technology used to sustain it. The 50 percent rule was the system adapting to manage the risk of the trap without solving it. And the reason it persisted through scandals was that the payoff structure remained unchanged until technology forced it to shift. But I would conclude by admitting that the framework struggles to account for the active criminal conspiracy and the complicity of the regulators, which suggests that while the riders were trapped, the system architects might have been driving the car. That distinction will show your professor you are thinking critically about the limits of the theory rather than just using it as a buzzword. It is a strong topic and if you handle those nuances regarding the Omertà and the intentionality of the doping rings, you will have a really compelling paper. Just remember to keep the focus on the incentives and let the human drama illustrate the math rather than replace it.
