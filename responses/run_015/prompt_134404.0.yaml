answer: |-
  ### Specification of Adequacy Conditions for an Account of "Western Values"

  To treat "Western values" as a coherent philosophical category rather than a mere rhetorical flourish, an account must satisfy specific adequacy conditions. These conditions are divided into four domains: Extension, Distinctions, Argumentative Functions, and Internal Tensions. Below are the desiderata, their motivating cases, an analysis of logical conflicts, and an assessment of three dominant theoretical approaches.

  ---

  ### I. Desiderata and Motivating Cases

  #### 1. Extensional Adequacy (The Boundary Problem)
  *   **Desideratum:** The account must specify the criteria for membership in the set of "Western values." It must determine whether the extension constitutes a **natural kind** (unified by a common essence, e.g., rationality), a **historical lineage** (unified by causal descent, e.g., Greco-Roman reception), or a **family resemblance** (a cluster of overlapping traits without a single common denominator).
  *   **Motivating Case:** Without extensional clarity, the category suffers from over-inclusion (counting universal human traits as "Western") or under-inclusion (excluding illiberal Western historical periods). For example, if "individual rights" are the core, does 17th-century absolutist France fall outside the West? If the account cannot explain why certain institutions (liberal democracy) are central while others (feudalism) are peripheral, it fails to carve reality at its joints.

  #### 2. Distinction Preservation (The Origin/Validity Problem)
  *   **Desideratum:** The account must distinguish between **historical genesis** (where the value emerged) and **normative validity** (why the value binds). It must clarify whether the values are *particularist* (binding due to cultural heritage) or *universalist* (binding due to rational/moral necessity, merely institutionalized in the West).
  *   **Motivating Case:** This prevents the "Genetic Fallacy" in international relations. If human rights are merely "Western," non-Western actors (e.g., Confucian or Islamic polities) may reject them as cultural imperialism. If they are universal but *incidentally* Western, the account must explain why analogous values did not dominate institutionally elsewhere. Failure here renders the category either ethnocentric or vacuous.

  #### 3. Functional Explanatory Power (The Usage Problem)
  *   **Desideratum:** The account must explain the **argumentative functions** the phrase performs in actual discourse. Specifically, it must account for its use as:
      1.  A **Civilizational Boundary Marker** (defining "Us" vs. "Them").
      2.  A **Normative Benchmark** (in international law/human rights regimes).
      3.  A **Foil for Critique** (used by post-colonial or multicultural critics to highlight hypocrisy).
  *   **Motivating Case:** Concepts are tools. If an account defines "Western values" in a way that makes them unusable for political mobilization or legal justification, it fails descriptively. For instance, a definition that is too abstract cannot serve as a boundary marker; a definition that is too exclusionary cannot serve as a universal legal benchmark.

  #### 4. Tension Accommodation (The Paradox Problem)
  *   **Desideratum:** The account must accommodate the **internal tensions** inherent in the concept, primarily the conflict between **Universalist Claims** (these values apply to all humans) and **Particularist Defenses** (these values are *our* heritage and not for export). It must also accommodate the tension between **Ideal Theory** (what the West professes) and **Non-Ideal History** (colonialism, slavery, exclusion).
  *   **Motivating Case:** The concept is structurally unstable. Proponents often switch between "these values are universally true" and "these values are uniquely ours" depending on tactical need. An adequate account cannot simply smooth over this contradiction; it must explain the mechanism that allows the concept to survive despite it.

  ---

  ### II. Logical Conflicts and Unsatisfiable Subsets

  Certain subsets of the above desiderata appear jointly unsatisfiable. An account typically must sacrifice one to satisfy the other.

  #### 1. The Universality-Historicity Trade-off
  *   **Conflict:** *Desideratum 2 (Universal Validity)* vs. *Desideratum 1 (Historical Specificity)*.
  *   **Analysis:** If values are truly universal (e.g., prohibitions on torture), labeling them "Western" is contingently true but essentially misleading, as they should apply regardless of origin (e.g., Islamic or Confucian analogues). If values are essentially tied to Western historical development (e.g., specific Christian-secular distinctions), they lose universal normative force over non-Western agents.
  *   **Verdict:** **Jointly Unsatisfiable.** One cannot maintain that "Western values" are *essentially* bound to Western history while simultaneously claiming they are *universally* binding on cultures with divergent histories. Accounts must choose: either the "Western" label is accidental (Normative-Functional) or the "Universal" claim is limited (Genealogical-Institutional).

  #### 2. The Coherence-Critique Trade-off
  *   **Conflict:** *Desideratum 1 (Extensional Coherence)* vs. *Desideratum 4 (Tension Accommodation)*.
  *   **Analysis:** To make the category coherent (Desid. 1), one must exclude contradictory elements (e.g., excluding fascist ideologies from the "Western" canon). However, to explain the concept's actual usage and critique (Desid. 4), one must acknowledge that "Western values" have historically been invoked to justify exclusionary or illiberal acts. Purifying the extension renders the account unable to explain the historical reality of the term's usage.
  *   **Verdict:** **Jointly Unsatisfiable.** A logically pure extension falsifies the historical record; a historically accurate extension sacrifices logical coherence.

  #### 3. The Function-Truth Trade-off
  *   **Conflict:** *Desideratum 3 (Functional Explanation)* vs. *Normative Truth-Tracking*.
  *   **Analysis:** If the account explains the term primarily as a boundary marker (Desid. 3), it risks reducing the values to power moves (discourse analysis), undermining their claim to moral truth. If the account insists on the moral truth of the values, it struggles to explain their instrumental use as political weapons.
  *   **Verdict:** **Tension.** Not strictly unsatisfiable, but requires a complex dual-layer theory (e.g., values are true, but the *label* is politicized).

  ---

  ### III. Non-Negotiable vs. Camp-Specific Desiderata

  To distinguish between a failed account and a merely controversial one, we must separate necessary conditions from philosophical preferences.

  | **Non-Negotiable (Adequacy Conditions)** | **Camp-Specific (Philosophical Preferences)** |
  | :--- | :--- |
  | **Functional Explanatory Power:** The account *must* explain why the term is used in politics/law. If it ignores the rhetorical function, it is not an account of the social concept. | **Extensional Purity:** Whether the extension *should* be limited to Liberal Democracy (Liberal view) or include Christian Conservatism (Conservative view) is a normative choice, not a logical requirement. |
  | **Tension Accommodation:** The account *must* acknowledge the Universal/Particular paradox. Ignoring it renders the account naive. | **Normative Validity:** Whether the values are *actually* true/universal is a first-order ethical claim, not a second-order conceptual requirement. |
  | **Distinction Preservation:** The account *must* distinguish origin from validity, even if it collapses them later. | **Historical Depth:** Whether the genealogy starts with Athens/Jerusalem (Traditionalist) or the Enlightenment (Modernist) is a historical dispute, not a conceptual failure. |

  ---

  ### IV. Assessment of Theoretical Accounts

  Here we assess how three common philosophical approaches fare against the specified desiderata and conflicts.

  #### 1. Genealogical-Institutional Account
  *   **Definition:** Defines Western values by their historical lineage (Greco-Roman, Judeo-Christian, Enlightenment) and institutional instantiation (Rule of Law, Parliament).
  *   **Performance:**
      *   *Extension:* **High.** Clearly demarcates based on historical causality.
      *   *Distinctions:* **High.** Clearly separates Western genesis from non-Western contexts.
      *   *Functions:* **Medium.** Explains boundary marking well; struggles with universal legal benchmarks (why should a non-Western court care about Western genealogy?).
      *   *Tensions:* **Low.** Struggles with the Universalist claim. If values are products of specific history, their claim on humanity is weakened.
  *   **Primary Failure:** Fails the **Universality-Historicity Trade-off**. It secures coherence by sacrificing universal normative force.

  #### 2. Normative-Functional Account
  *   **Definition:** Defines Western values by their moral content (Autonomy, Dignity, Rights), treating "Western" as the current best institutional vessel for universal truths.
  *   **Performance:**
      *   *Extension:* **Medium.** Risks over-inclusion (if a non-Western culture adopts rights, do those values become "Western"?).
      *   *Distinctions:* **Low.** Often conflates origin with validity, risking the "Ethnocentric Universalism" error.
      *   *Functions:* **High.** Excellent for international law and normative benchmarking.
      *   *Tensions:* **Medium.** Attempts to resolve the Universal/Particular tension by subsuming the particular under the universal.
  *   **Primary Failure:** Fails **Extensional Adequacy** regarding historical specificity. It cannot easily explain why these values are *distinctively* Western if they are rationally accessible to all (e.g., Confucian analogues).

  #### 3. Discourse-Analytic Account (Essentially Contested Concept)
  *   **Definition:** Treats "Western values" as a political tool with no stable extension, defined solely by its usage in power struggles.
  *   **Performance:**
      *   *Extension:* **None.** Denies stable extension exists.
      *   *Distinctions:* **High.** Dissolves the Origin/Validity problem by treating validity claims as rhetorical moves.
      *   *Functions:* **High.** Best explains the boundary marking and critique functions.
      *   *Tensions:* **High.** Fully accommodates tension by accepting contradiction as inherent to the concept.
  *   **Primary Failure:** Fails **Normative Force**. By reducing the concept to discourse, it cannot condemn the *misuse* of "Western values" (e.g., to justify imperialism) because it denies a stable standard against which to measure misuse. It satisfies the sociological desiderata but fails the philosophical requirement for coherence.

  ### V. Summary Conclusion

  No single account satisfies all desiderata simultaneously due to the **Universality-Historicity Trade-off**.
  *   The **Genealogical** account sacrifices Universality for Coherence.
  *   The **Normative** account sacrifices Historical Specificity for Validity.
  *   The **Discourse** account sacrifices Coherence for Descriptive Accuracy.

  A rigorous philosophical treatment must explicitly declare which desideratum is being privileged. To treat "Western values" as coherent rather than rhetorical, the **Normative-Functional** account is the only candidate that preserves the *normative* utility of the term, but it requires the non-negotiable admission that "Western" is a contingent, not essential, descriptor of the values themselves. Conversely, if historical specificity is non-negotiable, the category must be accepted as particularist, relinquishing claims to universal human rights justification.
