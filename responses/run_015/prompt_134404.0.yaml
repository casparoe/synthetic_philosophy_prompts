      *   *Refining the "Unsatisfiable Subset":* The strongest tension is between *Historical Indexicality* (these values belong to *us*) and *Moral Universalism* (these values belong to *everyone*). An account usually has to privilege one, making the other derivative.

  8.  **Final Review against the Prompt:**
