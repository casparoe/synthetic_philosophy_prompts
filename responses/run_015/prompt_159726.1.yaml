prompt: |-
  So I run a fortnightly novel-writing workshop out of the back room of a secondhand bookshop, about 12 people, mostly literary fiction plus one very opinionated sci-fi guy, and we get two hours including a tea break. I'm planning a session for next month and I want something that isn't just more craft talk.

  Here's what I keep circling around. I've been reading about Jain anekāntavāda — the many-sidedness / non-one-sidedness thing — and the sevenfold conditional predication that goes with it. I'm shaky on which Sanskrit word maps onto which bit (saptabhaṅgī? syādvāda? are the standpoints a separate list from the seven modes or the same list? please quietly fix me if I have it tangled). What I want people to walk out feeling is not "everyone has their own truth, how lovely" — I'm fairly sure that's the misreading — but something harder: that several incompatible-sounding accounts of one event can each be genuinely, non-ironically true; that you can't recover the whole by averaging them or by finding the most sincere one; and that none of this leaves you paralysed when you have to act, because acting still means committing to one standpoint for the purpose at hand.

  What I'd like from you is a runnable two-hour session: the shared incident we write from, the roles, the rules, the handouts, a timeline, and a debrief. Some constraints, because I've tried things like this and they've flopped: no lecture up front before anyone writes, and the participants should run into the problem themselves rather than have it named for them. Definitely not a read-the-blind-men-and-elephant-parable opener — apart from being a cliché, I gather it gets told in half a dozen traditions and probably isnt even Jain in origin, so I dont want to hang the evening on it. Ideally nobody hears the Sanskrit words until the debrief. Two things I'd like built in specifically. First, a forced-choice moment where a writer has to commit to one version and do something irreversible with it, so they discover on their own that many-sidedness isn't the same as can't-decide. Second, a tagging or scoring device so statements get sorted rather than just discussed — I was imagining each line getting marked with which of the modes its claiming, and a ledger separating contradictions that stay live under challenge from ones that dissolve once you ask "true relative to what, stated by whom, about which aspect". Steal that or improve on it. And my group will reach for "unreliable narrator" within about four minutes; I think that frame will actively block the point, since it smuggles in that there's one real version the narrator is distorting, so tell me how to work with it when it comes up rather than how to head it off.

  The debrief should map specific moments onto the actual structure of the view — the standpoints versus the predication versus the doctrine itself, if its three different things. Say what will predictably go wrong the first time I run it, and be honest about which part of the view a writing workshop simply cannot stage and I'd have to just tell them flat out. One more ask: when you explain the doctrine, separate what's settled among people who actually know this material from what scholars genuinely argue about — I'd guess that whether the sevenfold scheme is a real many-valued logic or a dialectical teaching tool is fought over, and how you translate the avaktavya/ineffable mode is too, but honestly I don't know. Don't smooth a live dispute into a consensus, and flag where your own reconstruction is a stretch or where you're trading orthodoxy for something that works in a room of twelve tired writers on a Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**

      *   **Context:** Fortnightly novel-writing workshop, back room of a secondhand bookshop, ~12 people (mostly lit fic, 1 opinionated sci-fi guy), 2 hours (incl. tea).
      *   **Goal:** A session based on Jain *anekāntavāda* (many-sidedness) and *syādvāda/saptabhaṅgī* (sevenfold predication), but without a lecture upfront. Participants must discover the problem through writing.
      *   **Key Philosophical Points to Convey:**
          *   Incompatible accounts can *each* be genuinely true (not just "everyone has their truth" relativism).
          *   The whole cannot be recovered by averaging or finding the "sincere" one.
          *   Action requires commitment to one standpoint (no paralysis).
          *   Avoid "unreliable narrator" trap (implies one objective truth exists).
      *   **Specific Constraints:**
          *   No lecture before writing.
          *   No "Blind Men and Elephant" parable (cliché, historically dubious).
          *   No Sanskrit terms until debrief.
          *   **Must Include:** A forced-choice moment (commitment to one version/irreversible action).
          *   **Must Include:** A tagging/scoring device for statements (sorting contradictions).
          *   **Debrief:** Map moments to doctrine (standpoints vs. predication vs. doctrine). Acknowledge limits of the workshop format.
          *   **Scholarly Honesty:** Distinguish settled vs. debated aspects of the doctrine (logic vs. dialectic, *avaktavya* translation).
      *   **Tone:** Practical, rigorous, respectful of the philosophy, aware of workshop dynamics.

  2.  **Deconstruct the Philosophy (for the Debrief & Design):**

      *   *Anekāntavāda:* The metaphysical/epistemological doctrine that reality is complex and no single view captures it entirely.
      *   *Naya:* The standpoints/perspectives (partial truths).
      *   *Syādvāda:* The method of conditioning predication ("in some way," "perhaps").
      *   *Saptabhaṅgī:* The sevenfold scheme of predication.
          1.  Syād asti (In some way, it is).
          2.  Syād nāsti (In some way, it is not).
          3.  Syād asti ca nāsti ca (In some way, it is and is not).
          4.  Syād avaktavyaḥ (In some way, it is indescribable).
          5.  Syād asti ca avaktavyaḥ ca (In some way, it is and is indescribable).
          6.  Syād nāsti ca avaktavyaḥ ca (In some way, it is not and is indescribable).
          7.  Syād asti ca nāsti ca avaktavyaḥ ca (In some way, it is, is not, and is indescribable).
      *   *Scholarly Debates:* Is it a many-valued logic (truth values) or a dialectical tool (contextualizing claims)? How to translate *avaktavya* (ineffable vs. indeterminate vs. simultaneous contradiction)?
      *   *Workshop Translation:* We can't teach logic in 2 hours. We can teach *narrative perspective as ontological commitment*.

  3.  **Design the Session Arc (2 Hours):**

      *   *0:00-0:10:* Intro & Setup (No theory).
      *   *0:10-0:40:* Writing Round 1 (The Incident).
      *   *0:40-0:50:* Tea Break (Crucial for digestion).
      *   *0:50-1:20:* Writing Round 2 (The Tagging & The Choice).
      *   *1:20-1:40:* Reading & Sorting (The "Ledger").
      *   *1:40-2:00:* Debrief (The Philosophy).

  4.  **Develop the Core Exercise:**

      *   *The Incident:* Needs to be mundane but high-stakes enough for interpretation. A conflict? A breakage? A departure? Let's go with a *broken object* during a *tense gathering*. It allows for physical description (sensory truth) and emotional motivation (psychological truth).
      *   *The Roles:* Instead of assigning characters, assign *constraints* on what can be perceived/valued. This mimics *naya* (standpoints) without calling them that.
      *   *The Tagging:* Need a simple symbol system for the 7 modes, simplified for writers. Let's use: [IS], [NOT], [BOTH], [??] (for indescribable).
      *   *The Forced Choice:* A moment where they must delete or lock in a version to proceed.

  5.  **Addressing the "Unreliable Narrator" Trap:**

      *   If someone says "My narrator is lying," the facilitator needs to pivot: "Okay, but within the world of *this* text, is the statement valid? We aren't judging the narrator's honesty, we are judging the statement's validity *under this specific condition*."
      *   Better yet: Frame the instruction so that "truth" is defined by *utility within the scene*, not correspondence to an external reality.

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Keep it tight. "We are writing about an event. You will get a lens."
      *   *Round 1:* Write the scene from a specific constraint (e.g., "Only write what can be photographed" vs. "Only write internal sensation"). *Correction:* Better to have everyone write the *same* event but with different *valuations*. Let's assign "Stakes."
      *   *Refined Round 1:* Everyone writes the same 5-minute incident (a vase breaks at a dinner party). But they are assigned a *Primary Value* (e.g., Social Harmony, Material Value, Emotional Truth, Historical Accuracy).
      *   *Round 2 (The Tagging):* Swap papers. Mark sentences. Then the *Forced Choice*: You must rewrite the ending based on *one* of the marked sentences, deleting contradictions.
      *   *The Ledger:* A whiteboard where we list contradictory claims (e.g., "It was an accident" vs "It was an attack"). We don't resolve them. We tag them.
      *   *Debrief:* Introduce the Sanskrit terms here. Map the exercise to *saptabhaṅgī*.

  7.  **Refining the Philosophy for the Debrief:**

      *   Need to be careful not to present *saptabhaṅgī* as a checklist for writers. It's an epistemological tool.
      *   *Settled:* It's about conditioning truth claims (*syāt*). It's about avoiding *ekānta* (one-sidedness).
      *   *Debated:* Is mode 4-7 actual logic or rhetorical? Is *avaktavya* "cannot be said" or "simultaneously is and isn't"?
      *   *Workshop Compromise:* We are using it as a narrative tool, not a logical system. Admit this.

  8.  **Addressing Specific Constraints:**

      *   *Sci-fi Guy:* He might try to solve the paradox with multiverse theory. Need to shut that down gently. "In this room, there is only one vase."
      *   *Tea Break:* Essential. Put it after the first writing stress.
      *   *Handouts:* Need clear instruction cards.

  9.  **Final Review against User Prompt:**

      *   *Runnable 2-hour session?* Yes.
      *   *Shared incident?* Yes (The Dinner Party Breakage).
      *   *Roles/Rules/Handouts?* Included.
      *   *Timeline?* Included.
      *   *Debrief?* Detailed mapping.
      *   *No lecture upfront?* Checked.
      *   *No Blind Men/Elephant?* Checked.
      *   *Forced choice?* Included in Round 2 (The "Lock-In").
      *   *Tagging/Scoring?* Included (The Truth Ledger).
      *   *Unreliable Narrator handling?* Specific script provided.
      *   *Scholarly nuance?* Included in debrief notes.

  10. **Polishing the Tone:**

      *   Needs to sound like it's written by someone who knows workshops *and* philosophy. Practical but intellectually rigorous.
      *   Ensure the distinction between *naya* (standpoint) and *syādvāda* (predication) is clear in the debrief, even if blurred in the exercise for practicality.

  11. **Self-Correction on the "Tagging" mechanism:**
      *   The user suggested: "ledger separating contradictions that stay live under challenge from ones that dissolve once you ask 'true relative to what'".
      *   My draft needs to make sure this happens *visually*. A whiteboard with two columns: "Dissolved Contradictions" (Contextualized) and "Live Contradictions" (Irreconcilable even with context). Actually, Jain logic says *all* contradictions dissolve if you specify the *naya*. So the "Live" column should actually be empty if done right, or rather, the "Live" column is where they *refuse* to specify the *naya*. Let's make the Ledger about *Conditioning*. Column A: "Absolute Claim." Column B: "Conditioned Claim."

      *   *Wait, re-reading the prompt:* "ledger separating contradictions that stay live under challenge from ones that dissolve once you ask 'true relative to what, stated by whom, about which aspect'".
      *   Okay, so the goal is to show that *most* contradictions dissolve when conditioned. The "Live" ones are the ones where we refuse to condition.
      *   Let's create a "Truth Token" system.

  12. **Finalizing the "Forced Choice":**
      *   The prompt asks for a moment where they commit to one version and do something irreversible.
      *   Idea: At the end of Round 2, they must choose *one* of the tagged statements to be the "Canon" for a sequel prompt, and physically cross out the others. This simulates *vyavahāra* (practical activity) requiring commitment despite ontological complexity.

  13. **Writing the Response:** (Proceeding to generate the plan based on these thoughts).
answer: |-
  Here is a runnable two-hour session plan designed to enact *anekāntavāda* without lecturing on it until the end. It is built to be robust against the "unreliable narrator" deflection and includes the specific tagging/forcing mechanisms you requested.

  ### Session Title: The Sevenfold Vase
  **Setting:** Back room, bookshop.
  **Time:** 120 minutes (including tea).
  **Materials:** Whiteboard + markers, printed "Lens Cards" (see below), printed "Ledger Sheets," pens, tea.

  ---

  ### 1. The Setup (0:00 – 0:10)
  **Facilitator Script:**
  "We aren't doing craft talk today. We're doing an experiment in collision. We are all going to write about the exact same five-minute incident. You will not be told what 'really' happened. You will be given a constraint on what your narrator is capable of valuing.

  There are two rules:
  1. **No Irony.** Your narrator cannot be lying, mistaken, or 'unreliable' in the traditional sense. If they say the room is cold, the room is cold *for the purpose of this text*.
  2. **No Multiverses.** There is one vase. It breaks. There is one timeline.

  If the sci-fi contingent asks if this is a quantum superposition scenario: No. It is one object, one break, many descriptions."

  **The Incident (Read Aloud):**
  "A dinner party. Six people. A heavy ceramic vase sits on the table. During a lull in conversation, the vase falls and shatters. Everyone stands up. Someone speaks first."

  **Distribution:**
  Hand out **Lens Cards** face down. There are 4 types (3 copies of each for 12 people).
  *   **Lens A (Material):** Your narrator notices only physical causality, weight, velocity, cost, and structural integrity. Emotions are invisible data.
  *   **Lens B (Social):** Your narrator notices only hierarchy, face, embarrassment, alliance, and ritual. Physical objects are props for social maneuvering.
  *   **Lens C (Historical):** Your narrator notices only lineage, provenance, memory, and repetition. The present is only a recurrence of the past.
  *   **Lens D (Somatic):** Your narrator notices only bodily sensation, tension, breath, and pain. Abstract concepts like 'money' or 'politeness' do not exist.

  ---

  ### 2. Writing Round 1: The Standpoint (0:10 – 0:40)
  **Task:** Write the scene (approx. 400 words).
  **Constraint:** You must describe the *cause* of the break and the *immediate aftermath* strictly through your Lens.
  *   *Lens A example:* "The elbow displaced the ceramic. Gravity took hold."
  *   *Lens B example:* "He challenged her status. The offering was rejected."
  *   *Lens C example:* "It was the mother's vase. The pattern repeated."
  *   *Lens D example:* "The muscle spasmed. The sound cut the skin."

  **Facilitator Note:** Walk around. If someone says, "But my narrator knows it was an accident," stop them. "Accident is a legal category. Stick to the Lens. If you are Somatic, did the muscle *choose* to spasm? If you are Social, was it a *signal*?"

  ---

  ### 3. Tea Break (0:40 – 0:50)
  *Crucial for cognitive reset. Do not allow them to compare stories yet.*

  ---

  ### 4. Writing Round 2: The Predication & The Lock-In (0:50 – 1:20)
  **Step 1: The Swap (5 mins)**
  Participants swap manuscripts with someone who had a *different* Lens Card.
  **Task:** Read the new story. Take a red pen. Underline any statement that makes a claim about reality.
  **The Tagging Device:** Next to each underlined statement, write one of four symbols:
  *   **[+]** : Affirmation (It is X).
  *   **[-]** : Negation (It is not X).
  *   **[±]** : Complex/Both (It is X and not X, or X depending on where you look).
  *   **[?]** : Indeterminate (The text implies this cannot be stated/sensed here).

  **Step 2: The Ledger (15 mins)**
  Bring everyone to the whiteboard. Draw two columns: **Dissolved** and **Live**.
  Ask for contradictory claims from the texts.
  *   *Example:* Text A says "The elbow slipped." Text B says "The hand pushed."
  *   Ask the group: "Can we make these compatible by adding a condition?" (e.g., "Slipped *muscularly*" vs "Pushed *socially*").
  *   If yes, write the conditioned statement in **Dissolved**.
  *   If no (they genuinely cannot coexist even with conditioning), write in **Live**.
  *   *Goal:* You want almost everything in **Dissolved**. This demonstrates that contradictions often vanish when the *naya* (standpoint) is specified.

  **Step 3: The Forced Choice (15 mins)**
  **Facilitator Script:**
  "Philosophy is fine. But now you have to go home. You have to tell your partner what happened. You cannot say 'it depends.' You must act."
  **Task:** Return to your *own* original draft. You must add one final paragraph where your narrator takes an **Irreversible Action** based on their version of events (e.g., call the police, leave the marriage, glue the vase, scream).
  **The Catch:** You must cross out any sentence in your text that contradicts the action you just chose. If your action requires the break to be malicious, you must cross out any description that suggests it was accidental.
  *This enforces the pragmatic necessity of commitment (*vyavahāra*) despite ontological complexity.*

  ---

  ### 5. Debrief: Mapping the Doctrine (1:40 – 2:00)
  *Now you introduce the Sanskrit. Keep it tight.*

  **1. The Lenses = *Naya* (Standpoints)**
  Explain that their Lens Cards were *nayas*. In Jain epistemology, a *naya* is a partial standpoint. It is not a lie. Lens A (Material) told the truth *from the standpoint of substance*. Lens B (Social) told the truth *from the standpoint of convention*.
  *   **Workshop Limit:** In the workshop, you assigned the *naya*. In reality, we often don't know which *naya* we are operating under.

  **2. The Tags = *Syādvāda* (Conditioned Predication)**
  The red pen symbols map to *syādvāda* ("maybe-ism" or "in-some-way-ism").
  *   **[+]** maps to *Syād asti* (In some way, it is).
  *   **[-]** maps to *Syād nāsti* (In some way, it is not).
  *   **[±]** maps to *Syād asti ca nāsti ca* (In some way, it is and is not).
  *   **[?]** maps to *Syād avaktavyaḥ* (In some way, it is indescribable).
  Explain that the "Ledger" exercise was an attempt to move claims from "Absolute" to "Conditioned." When you asked "True relative to what?", you were applying *syāt*.

  **3. The Forced Choice = *Vyavahāra* (Practical Activity)**
  The final paragraph was *vyavahāra*. Even if reality is seven-fold, you cannot glue a vase and not glue it simultaneously. To act is to temporarily collapse the sevenfold possibility into one functional truth. This prevents paralysis.

  **4. Handling "Unreliable Narrator"**
  If someone raises this now:
  "The 'Unreliable Narrator' assumes there is a 'Reliable Reality' they are distorting. *Anekāntavāda* says there is no single 'Reliable Reality' accessible to a finite being. Your Lens A narrator wasn't lying about the social tension; they were *blind* to it. That is not unreliability; that is finitude."

  **5. Scholarly Nuance (The "Honesty" Section)**
  *Read this or summarize closely:*
  "I need to be honest about where this workshop simplifies the philosophy.
  *   **Settled:** The core intent is non-absolutism (*anekānta*) to reduce dogmatic violence (*himsa*). The sevenfold scheme (*saptabhaṅgī*) is the standard formulation for conditioning truth claims.
  *   **Debated:** Scholars fight over whether the seven modes are a formal many-valued logic (like fuzzy logic) or a dialectical tool for debate. We treated them as a tagging tool (dialectical).
  *   **Debated:** The translation of *avaktavya* (Mode 4). Is it 'ineffable' (mystical) or 'indeterminate' (logical simultaneity of being and non-being)? We treated it as 'cannot be sensed from this standpoint,' which is a pragmatic stretch.
  *   **The Stretch:** In Jainism, the seven modes apply to *substance* (*dravya*). We applied them to *narrative events*. This is a category error, but a useful one for writers."

  ---

  ### Anticipated Failure Points & Fixes

  **1. The "Everyone is Right" Trap**
  *   *Risk:* Participants conclude "all truths are equal" (relativism).
  *   *Fix:* In the Ledger phase, if someone says "Well, both are true," challenge them. "Are they true *in the same sense*? If I sue for damages, which truth does the court accept?" Force them to see that *nayas* have domains of validity. The Social truth doesn't fix the Physical leak.

  **2. The Sci-Fi "Multiverse" Deflection**
  *   *Risk:* "So they're all parallel timelines?"
  *   *Fix:* "No. In parallel timelines, the vase is whole in one and broken in another. Here, the vase is broken in *all* of them. The *breaking* is what changes. It is one reality, multiply described."

  **3. The "Paralysis" Problem**
  *   *Risk:* Participants feel they can't write anything because every statement is conditioned.
  *   *Fix:* This is why the **Forced Choice** (Step 4.2) is mandatory. Emphasize that *syādvāda* is not for *writing* the sentence, it's for *holding* the sentence. You write "He pushed it," but you hold it lightly, knowing it is *syād* (in some way). But for the plot, he pushed it.

  **4. Running Out of Time**
  *   *Risk:* The Ledger discussion eats the debrief.
  *   *Fix:* Hard stop the Ledger at 1:20. Even if contradictions are unresolved. The tension of unresolved contradictions is itself a lesson in *anekāntavāda*.

  ### Handout: The Ledger Sheet
  *(Print one per person for the swap phase)*

  **STATEMENT** | **TAG** (+ / - / ± / ?) | **CONDITION** (True if...)
  --- | --- | ---
  *"The elbow slipped"* | [+] | ...viewed physically
  *"The hand pushed"* | [+] | ...viewed socially
  *"It was an accident"* | [?] | ...viewed legally (indeterminate here)

  ### Facilitator's Cheat Sheet: The Seven Modes (*Saptabhaṅgī*)
  *Keep this in your pocket for the debrief.*

  1.  **Syād asti:** In some way, it is. (Affirmation)
  2.  **Syād nāsti:** In some way, it is not. (Negation)
  3.  **Syād asti ca nāsti ca:** In some way, it is and is not. (Successive/Contextual)
  4.  **Syād avaktavyaḥ:** In some way, it is indescribable. (Simultaneous contradiction)
  5.  **Syād asti ca avaktavyaḥ ca:** Is and is indescribable.
  6.  **Syād nāsti ca avaktavyaḥ ca:** Is not and is indescribable.
  7.  **Syād asti ca nāsti ca avaktavyaḥ ca:** Is, is not, and is indescribable.

  *Note for the room:* We mostly hit modes 1, 2, and 4 tonight. Mode 7 is the full realization of the object, which no single writer achieved. That is the point.
