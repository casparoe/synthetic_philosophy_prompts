answer: |-
  Here are the three binary questions that define the logical space. They are ordered to route you from the most demanding views to the most permissive, using concrete cases rather than abstract theory.

  ### The Three Questions

  1.  **The Ceiling:** "If skipping the $5 latte to save a life is required, is quitting your high-paying job to donate everything also required?"
      *   **Yes:** The duty scales infinitely with your ability to help.
      *   **No:** The duty has a limit somewhere.
  2.  **The Guilt:** "If you keep the money instead of donating, should you feel guilty (or be blamed)?"
      *   **Yes:** Failing to donate is a moral failure.
      *   **No:** Failing to donate is permissible or blameless.
  3.  **The Weight:** "Do your own interests count for more than a stranger's?"
      *   **Yes:** You are allowed to weight your own life heavier.
      *   **No:** Everyone's interests count equally.

  ---

  ### The Decision Tree (8 Combinations)

  Below are the 8 logical boxes created by these questions. Five are occupied by named philosophical views; three are empty.

  | Q1: Ceiling | Q2: Guilt | Q3: Weight | View / Status | The Weirdest Commitment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Yes** | **Yes** | **No** | **Bite-the-Bullet Utilitarianism** | You are morally required to let your own child die if saving two strangers produces slightly more total good. |
  | **Yes** | **No** | **No** | **Criterion vs. Procedure View** | Buying the latte is objectively wrong, but we should teach people it's okay because calculating every purchase causes more harm. |
  | **Yes** | **Yes** | **Yes** | *Empty (Incoherent)* | Claims you must donate everything, but also that your interests count more; these cancel out to a limit. |
  | **Yes** | **No** | **Yes** | *Empty (Unattractive)* | Claims you must donate everything, but you're allowed to weight yourself higher; nobody argues for maximum sacrifice plus self-preference. |
  | **No** | **Yes** | **No** | *Empty (Incoherent)* | Claims there is a limit to duty, but you are blameworthy for hitting it; limits imply permission. |
  | **No** | **Yes** | **Yes** | *Empty (Unattractive)* | Claims you can stop donating, but you're still blameworthy, and only because you care about yourself; this is just guilt without a rule. |
  | **No** | **No** | **Yes** | **Agent-Centered Prerogative** | You are permitted to skip the donation to buy your kid a birthday gift, even if the donation would have saved a life. |
  | **No** | **No** | **No** | **Threshold / Satisficing View** ⚠️ | You must help until it costs you something significant (like missing a birthday), then you can stop even if more help would do good. |

  ---

  ### Notes on the Logical Space

  **The Collision (Threshold vs. Satisficing):**
  This tree cannot separate **Threshold Views** (duty stops when cost is too high) from **Satisficing Views** (duty stops when enough good is done) because both answer "No" to all three questions. They occupy the same leaf. To separate them, you would need a fourth question asking: *"Does the duty stop because the cost to you is too high, or because the benefit to them is small enough?"*

  **The Empty Boxes:**
  *   **Incoherent:** These combinations contradict themselves (e.g., setting a limit on duty but blaming people for respecting it).
  *   **Unattractive:** These combinations are logically possible but philosophically dead; no one argues for maximum demand while simultaneously allowing self-preference.

  **The "Criterion vs. Procedure" Leaf:**
  This view accepts the "Yes" on the Ceiling (objectively, you should quit your job) but blocks the "Yes" on Guilt. It solves the demandingness objection by saying the *rule* is maximizing, but the *human practice* of blaming people for failing is what causes net harm.
