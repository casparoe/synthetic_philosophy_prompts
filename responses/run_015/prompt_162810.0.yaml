answer: |-
  **WIP Prep Sheet: Procreation Asymmetry & Authorization**
  **To:** 4th-Year PhD Candidate
  **From:** [Your Name/Colleague]
  **Re:** Thursday's Bloodbath

  You asked for blunt. You asked for the specific damage this room can do. Your supervisor is likely right about the second half, and this Q&A sheet is going to show you why. The "Borrowed Life" waiver move is the weakest link; it's where the deontological framing collapses into consequentialism or circularity.

  Here are the objections, ordered by how much they threaten the chapter's viability, phrased in the voices you'll hear Thursday.

  ***

  ### 1. The Kantian Political Philosopher
  **Damage Level:** Critical. This attacks the coherence of the core concept.
  **The Objection:** "You're using 'authorization' to do deontological work, but authorization requires a subject. If the person doesn't exist, there's no one to authorize. If they do exist, they've benefited. So when you talk about 'hypothetical consent' from the created child, aren't you just describing a benefit they receive? You can't ground a constraint on creation using the consent of the created, because their very presence is the violation you're trying to justify. It's circular: 'I harmed you, but you're happy, so you must have consented.'"

  **Your Reply (2 mins):**
  "I agree literal consent is impossible. I'm not claiming the child *actually* consents at t1. I'm claiming the *structure* of the reason mirrors authorization constraints in other non-identity adjacent cases, like emergency surgery on an unconscious patient. We operate based on presumed will. In procreation, the 'presumed will' is cashed out via retrospective endorsement. If the life is net negative, the presumption is defeated (wrongful life). If net positive, the presumption holds. It's not circular because the standard for endorsement isn't just 'existence,' it's 'existence despite the specific unconsented harms.' I'm using authorization to explain the *asymmetry*, not to prove the life is good."

  **Weakness/Concession:**
  *Be careful here.* You are smuggling in a consequentialist calculation (net positive life) to determine if the deontological constraint was violated.
  *Concede:* "I will concede that 'retrospective endorsement' relies heavily on the outcome. If the outcome is the metric, the authorization language might be doing less work than I claim."

  ### 2. The Decision-Theory Grad Students
  **Damage Level:** High. This attacks the technical mechanism of your waiver.
  **The Objection:** "You're switching the time of evaluation. At the moment of procreation (ex ante), the parents don't know if the child will endorse the life. If the moral permission depends on the future endorsement (ex post), then the parents are never acting on a stable moral rule. They're just gambling. If the child ends up miserable, you say they wronged them. If happy, they didn't. That means there was no *reason* against creation at the time, only a risk. Isn't this just Expected Utility with extra steps?"

  **Your Reply (2 mins):**
  "It's not switching the time of evaluation for the *agent*, it's clarifying the *status* of the reason. Think of it like a proxy decision. A parent acts as a trustee. The reason against creation is a *pro tanto* constraint based on the imposition of risk without consent. The retrospective endorsement doesn't change the past risk; it waives the complaint. The moral rule at t1 is: 'Do not impose existence unless you have reason to believe retrospective ratification is possible.' That's distinct from maximizing utility because it rules out creating lives that are 'good' but built on specific, unratifiable violations (e.g., specific severe harms the adult rejects)."

  **Weakness/Concession:**
  *This is thin.* If the waiver is determined ex post, the parent at t1 is effectively flying blind.
  *Concede:* "You're right that this makes the t1 decision epistemically difficult. I need to clarify that the 'reason' at t1 is based on *probability* of endorsement, not certainty. If I don't fix that, the view collapses into risk-assessment consequentialism."

  ### 3. The Senior Population Ethicist (Person-Affecting Sympathizer)
  **Damage Level:** Medium-High. She likes your conclusion but will eat your theoretical contribution.
  **The Objection:** "I'm sympathetic to the person-affecting restriction, but I'm not seeing what 'authorization' adds. A standard person-affecting view says: 'Creating a miserable person is bad for them. Creating a happy person is not good for them (comparatively).' You're saying: 'Creating a miserable person violates their agency. Creating a happy person is authorized.' But since the miserable person doesn't exist to have agency violated, aren't you just relabeling 'harm' as 'unauthorized imposition'? Where is the explanatory gain?"

  **Your Reply (2 mins):**
  "The gain is handling the 'Borrowed Life' case. Standard person-affecting views struggle when a person is harmed by being created (e.g., congenital pain) but are still glad to exist. The harm view says they were wronged. My view says the reason against creation was *defeasible*. Authorization explains why the reason exists (imposition) and why it vanishes (waiver). Harm is binary; authorization is waivable. That allows me to say parents of disabled children didn't necessarily wrong them, without denying the harm occurred."

  **Weakness/Concession:**
  *This is your strongest ground, but...* If the waiver is triggered by "life worth living," you're back to standard person-affecting views.
  *Concede:* "If the waiver condition is identical to the 'life worth living' condition, you're right, it's a relabeling. I need to show cases where endorsement diverges from net welfare to make this stick."

  ### 4. The Feminist Philosopher (Reproduction & Disability)
  **Damage Level:** Medium. This attacks the real-world ethics.
  **The Objection:** "I don't care about the logic of the asymmetry. I care about what this language does. If you tell parents 'you had no reason to create you for your sake, but you authorized it by being happy,' that is gaslighting. And regarding disability: if you argue that a 'good life' waives the harm of being born disabled, aren't you just reinforcing the idea that disability is a harm that needs waiving? What work does this do for actual reproductive justice?"

  **Your Reply (2 mins):**
  "I hear the risk of gaslighting. My aim isn't to give parents a script to use on children, but to analyze the moral structure of procreation. On disability: I'm arguing the *imposition* is the harm, not the disability itself. The waiver acknowledges the imposition without requiring the life to be 'worthless' to count as a wrong. It actually protects disabled people by saying: 'You were imposed upon, and your endorsement matters.' It centers the created person's voice, not the parent's intuition."

  **Weakness/Concession:**
  *Do not fight this.* This is a normative clash, not a logical one.
  *Concede:* "I concede the language is dangerous in practice. I should probably add a caveat that this is a structural claim, not a guide for parent-child communication. I don't have a full answer on the disability harm framing yet."

  ### 5. The Totalist Consequentialist
  **Damage Level:** Low (for you, annoying for them). They won't be convinced, but they won't break the chapter.
  **The Objection:** "This is just status quo bias with a philosophy vocabulary. You're privileging the state of 'non-existence' as the default that requires consent, but non-existence isn't a state. Why is the baseline 'don't create' rather than 'create if good'? You've built the asymmetry into your definition of authorization."

  **Your Reply (2 mins):**
  "I'm not privileging non-existence; I'm privileging *imposition*. We don't require consent to benefit people generally, but we do require consent to impose burdens or risks. Procreation is uniquely an imposition of a life-sentence. The baseline is 'do not impose,' not 'do not create.' If I operate on you to save your life without consent, I've violated a constraint even if you live. The asymmetry captures that specific deontic texture that totalism flattens."

  **Weakness/Concession:**
  *Stand firm.* They want you to be a totalist; you aren't.
  *Concede:* None. This is a fundamental disagreement. Acknowledge it and move on.

  ***

  ### The One Question You're Hoping Nobody Asks
  **The Question:** (Likely from your Supervisor or the Senior Ethicist picking up on her cue)
  "If the reason against creation is defeated by the child's later endorsement of their good life... then wasn't the *only* reason that ever existed 'don't create people who will be miserable'? If the 'authorization' constraint disappears whenever the life is good, haven't you just reconstructed the standard Asymmetry without the deontological machinery? Why do we need the second half of this chapter at all?"

  **Why this kills you:** This is your supervisor's objection. It suggests the "Borrowed Life" waiver move is redundant. If the reason vanishes when the life is good, then the reason was *only* ever about avoiding bad lives. The "authorization" framing becomes decorative.

  **Your Reply (The "Hail Mary"):**
  "That's the worry I'm wrestling with. My hope is that authorization explains *why* we don't have a symmetric reason to create happy people (because we don't need authorization to benefit), whereas the harm view struggles to explain why we don't have a reason to create happy people (since existence is a benefit). But... if the waiver condition tracks 'life worth living' too closely, I concede the second half might be over-engineering a problem the first half already solved."

  **Honest Note:**
  **This is where you should concede.** If you get this question, do not bluff. Say: *"That is the exact tension I'm trying to resolve. If I can't show a case where endorsement and welfare come apart, you're right, the second half is redundant. I am currently looking for that wedge. If I don't find it by the next draft, I will cut it."*

  ***

  **General Strategy for Thursday:**
  1.  **Don't defend the Supervisor's cut;** validate it. It shows you're critical of your own work.
  2.  **Protect the First Third.** The argument that Asymmetry $\neq$ Antinatalism is solid. Don't let the "Borrowed Life" collapse drag the first section down.
  3.  **Watch the Feminist.** If she gets heated, pivot to "structural analysis" vs "individual blame." Do not argue disability isn't a harm in the *imposition* sense, even if it's not a harm in the *life value* sense.

  Good luck. Drink water. If the Totalist starts monologuing, wait for a breath and say, "I think we fundamentally disagree on the baseline, but I want to hear what [Kantian] thinks about the consent circularity." Change the subject.
