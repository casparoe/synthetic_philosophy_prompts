answer: |-
  Here is a spec sheet for a theory of pleasure, designed to function as a discussion tool for your syllabus. It is organized by the *work* the theory needs to do, rather than by historical position.

  ### The Desiderata List for a Theory of Pleasure

  **I. Structural Requirements (The Hedonist Calculus)**
  *These are **Non-Negotiable**. If a theory fails these, it cannot underwrite the claim that welfare = net pleasure.*

  1.  **Cardinal Commensurability:** The theory must deliver a single metric (a "hedonic currency") that allows different types of pleasure to be compared quantitatively.
      *   *Rationale:* To sum pleasures and subtract pains, a sauna glow and a proof-solving rush must be translatable into the same unit.
  2.  **Interpersonal Comparability:** The metric must be stable enough to allow comparisons across different subjects (at least in principle).
      *   *Rationale:* Policy and moral hedonism require knowing if *your* pleasure outweighs *my* pain.
  3.  **Vector Capacity (Mixed States):** The theory must account for episodes that are simultaneously pleasant and unpleasant (e.g., the burn of a workout, nostalgic sadness).
      *   *Rationale:* If pleasure and pain are mutually exclusive states, we cannot model complex experiences; if they are separate dimensions, we need a rule for netting them out.

  **II. Phenomenological Requirements (The "What It's Like")**
  *These are **Contested**. Failure here kills specific *versions* of hedonism, but not necessarily the core welfare claim.*

  4.  **Phenomenological Heterogeneity:** The theory must accommodate the intuition that the *feel* of drinking water differs in kind from the *feel* of hearing a chord resolve.
      *   *Rationale:* Introspection suggests no single "tingle" unites all pleasures.
      *   *Status:* **Negotiable.** A "Hedonic Tone" theorist denies this (claiming there *is* a common feel we miss); an "Attitudinal" theorist accepts this (claiming the commonality is structural, not felt).
  5.  **Pain Asymmetry:** The theory must explain why pains often feel more phenomenologically unified (sharp, throbbing, aching) than pleasures, or deny that they are.
      *   *Rationale:* It is easier to list types of pain than types of pleasure. A symmetric theory is elegant; an asymmetric one may be more accurate.
      *   *Status:* **Negotiable.** Hedonism survives even if pain is a unified sensation and pleasure is a diverse set of attitudes, provided they can still be netted (see #1).
  6.  **The Introspection Limit:** The theory must specify whether failing to find a common feeling is evidence against the theory, or evidence of introspective failure.
      *   *Rationale:* If the commonality is sub-personal (neural) or attitudinal, introspection won't find it.
      *   *Status:* **Negotiable.** Depends on whether the theory is phenomenological or functionalist.

  **III. Functional & Normative Requirements (The Role of Pleasure)**
  *These are **Non-Negotiable** for Welfare Hedonism, but **Negotiable** for Motivation Hedonism.*

  7.  **The Liking/Wanting Distinction:** The theory must track *liking* (consummatory pleasure), not just *wanting* (incentive salience).
      *   *Rationale:* Neuroscience shows we can want things we don't like (addiction) and like things we didn't want (surprise gifts). Welfare depends on liking.
      *   *Status:* **Non-Negotiable.** A desire-fulfillment theory that conflates wanting and liking fails as a welfare theory.
  8.  **Recalcitrance (Disapproval):** The theory must handle pleasures we disapprove of or wish we didn't have (e.g., schadenfreude, addictive pleasures).
      *   *Rationale:* If pleasure requires "approving of the experience," vicious pleasures might not count. Hedonism usually insists they *do* count for welfare, even if bad for character.
      *   *Status:* **Non-Negotiable.** Welfare hedonism must count the feeling even if the agent judges it bad.
  9.  **Reinforcement Explanation:** The theory should ideally explain why pleasure reinforces behavior, but this is secondary to welfare.
      *   *Rationale:* Pleasure teaches us what to do.
      *   *Status:* **Negotiable.** A theory of *welfare* doesn't strictly need a theory of *learning*, though it's a strike against it if it makes the link inexplicable.

  **IV. Metaphysical Requirements (The Nature of the Kind)**
  *These are **Negotiable**.*

  10. **Unity vs. Disjunction:** The theory must state whether "pleasure" is a natural kind (single essence) or a family resemblance/disjunctive category.
      *   *Rationale:* If disjunctive, it risks violating #1 (Commensurability). How do you sum apples and oranges?
      *   *Status:* **Negotiable,** but high risk. A disjunctive theory owes an explanation of why the disjunction constitutes *one* good.
  11. **Reductivity:** The theory must state whether pleasure is reducible to other states (desires, sensations) or is a primitive.
      *   *Rationale:* Primitives stop regress but explain less.
      *   *Status:* **Negotiable.**

  ---

  ### The Structural Tension (Incompatible Subsets)

  You suspected a conflict. It is real, and it is the engine of the debate.

  **The Incompatibility:** You cannot jointly satisfy **Desideratum #4 (Phenomenological Heterogeneity)** and **Desideratum #1 (Cardinal Commensurability)** without significant theoretical cost.

  *   **Why:** If you respect the phenomenology (that a sauna and a proof feel fundamentally different), you are pushed toward a **Pluralist/Disjunctive** view. But if pleasures are fundamentally different *kinds*, there is no obvious common denominator to allow for the *summing* required by Hedonism (#1).
  *   **The Trade-off:**
      *   **Benthamite Route:** Satisfy #1 by denying #4. Claim there *is* a common "hedonic tone." *Cost:* Phenomenologically implausible (ignores the "noise").
      *   **Millian Route:** Satisfy #4 by modifying #1. Claim pleasures differ in *quality*, not just quantity. *Cost:* Breaks the calculus. You can no longer simply sum; you need a lexical ordering or a quality-weighting function, which looks suspiciously like non-hedonist value judgment.
      *   **Attitudinal Route:** Satisfy #4 by redefining the commonality. The *feel* differs, but the *attitude* (enjoyment) is the same. *Cost:* Struggles with #3 (Mixed States) and #7 (Unconscious liking).

  **Treat this as the result:** The "definition of pleasure" debate is actually a debate about which of these two desiderata you are willing to sacrifice.

  ---

  ### The Single Most Exclusionary Requirement

  **Desideratum #1: Cardinal Commensurability.**

  This is the killer. Many theories offer a brilliant account of what pleasure *is* (e.g., "Pleasure is the conscious representation of a desire being fulfilled"), but they fail to explain how that state generates a **scalar magnitude** that can be subtracted from pain.
  *   **Desire theories** struggle here: How do you measure the "amount" of desire fulfilled? Is it intensity? Duration? Importance?
  *   **Primitive theories** struggle here: If pleasure is a simple quality, why does it come in degrees that map onto a mathematical scale?
  *   **Attitudinal theories** struggle here: How do you quantify "degree of enjoyment" across different objects (enjoying a joke vs. enjoying a sunset)?

  If a theory cannot explain how pleasure becomes a *number*, it cannot support Hedonism, regardless of how well it captures the phenomenology.

  ---

  ### Scorecard: The Usual Suspects

  | Theory | Phenomenology (#4) | Calculus (#1) | Liking/Wanting (#7) | Disapproval (#8) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hedonic Tone** (Feeling) | **Fail.** Ignores heterogeneity; claims a "tingle" exists where none is found. | **Pass.** Easy to imagine a "hedonimeter." | **Pass.** Distinct from desire. | **Pass.** Feelings can be vicious. | Phenomenologically thin, mathematically robust. |
  | **Attitudinal** (Enjoyment) | **Pass.** Allows diverse feels united by "holding dear." | **Mixed.** Hard to quantify "degrees of attitude." | **Mixed.** Can conflate judging good with liking. | **Pass.** Can enjoy what you judge bad. | Best fit for heterogeneity, risky for calculus. |
  | **Desire-Fulfillment** | **Fail.** Often unconscious; no specific feel. | **Fail.** No clear metric for "amount fulfilled." | **Fail.** Conflates wanting and liking. | **Pass.** Can desire what you disapprove of. | Better for motivation than welfare. |
  | **Disjunctive/Pluralist** | **Pass.** Embraces the diversity. | **Fail.** How to sum distinct kinds? | **Pass.** Can vary by kind. | **Pass.** | Saves phenomenology, kills the "net" in net pleasure. |
  | **Primitive** (Your Friend) | **Pass.** No analysis to get wrong. | **Fail.** Offers no account of magnitude/structure. | **Pass.** Stipulative. | **Pass.** Stipulative. | Philosophically honest, theoretically idle. |
