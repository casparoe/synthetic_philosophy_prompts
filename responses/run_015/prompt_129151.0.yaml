answer: |-
  This is a beautiful problem to be stuck on, and it cuts straight to the bone of what makes George Eliot such a enduring voice for secular moralists. You don't need the exact citation to trust your intuition here; the sentiment you're describing is the exact engine of her mature humanism (heavily influenced by her translations of Feuerbach and Strauss).

  To answer your core question: **No, it is not a contradiction.** And she does not settle the tension so much as she transposes it.

  Here is a coherent reading of that position that might help your architect find his footing (or stay productively stuck) in your chapter.

  ### 1. The Middle Position: Emotion as Ontology
  You asked if she is offering two separate accounts (functionalist vs. realist). The key to Eliot's position is that she rejects the binary.

  For a strict functionalist, the ritual is a tool that produces social cohesion. For a strict realist (theologian), the ritual is a response to an external divine truth. Eliot's humanist pivot is to say: **The feeling of connection *is* the truth.**

  When she describes the "shared posture of reverence," she is arguing that the physical act of kneeling, singing, or standing together generates a psychological reality that is objectively real, even if the metaphysical explanation (God) is a projection. The "wider vision" isn't a supernatural realm waiting upstairs; it is the **web of human interdependence** right here.

  So, to your point about "functional pluralism": Yes, this fits. But Eliot goes a step further than modern functionalism. She doesn't think the non-believer is just "getting away with" using the ritual. She believes the non-believer might actually be accessing the *core* of the ritual more honestly than the dogmatist. The dogmatist is focused on the proposition (Do I believe the Creed?); the humanist is focused on the bond (Do I feel my connection to these people?).

  ### 2. The Architect's "Fraud"
  This is where your protagonist finds his answer. If he believes his job is to build a house for God, and he doesn't believe in God, he is a fraud. But if he believes his job is to build a **machine for generating reverence**, he is an engineer of the human spirit.

  Eliot would argue that the cathedral works *because* it is beautiful, not because it is doctrinally correct. The beauty triggers the "wider vision." The architecture forces the body into a posture that the mind might not choose on its own. By kneeling, the ego is physically lowered. By looking up at a vaulted ceiling, the eye is drawn outward.

  The "fraud" only exists if he thinks he needs to lie to the clients about *why* it works. If he can admit, "This space will make you feel small in a way that makes you kinder," that is an honest transaction. The clients don't need to believe in the Trinity to benefit from the acoustics that blend their voices into a single sound.

  ### 3. The Symbol and the "Ungraspable"
  You mentioned the specific confusion: *moving from collective attention to asking whether we need a wider vision that the ceremony only symbolizes.*

  This is the crux of her "Religion of Humanity." She is asking: Can the symbol survive without the thing it symbolizes?

  Her answer is generally: **The symbol becomes the thing.**

  When she asks if the vision can survive admitting the creed is human-made, she is worried that without the "divine" wrapper, human beings are too selfish to sustain the reverence. We need the "fiction" of God to motivate us to be good to each other. This is her great anxiety.

  However, the coherent reading for your novel is this: The ritual points to something the participants don't fully grasp, but that something is **the magnitude of their own shared vulnerability.**

  The "wider vision" is the realization that you are not the center of the universe. Theology uses "God" to name that center. Humanism uses "Humanity" or "History." But the *experience* of stepping outside the self is the same. The symbol works precisely because it is larger than the individual. It doesn't matter if the label on the box is "God" or "Humanity," as long as the box is big enough to hold our grief.

  ### 4. Does She Settle the Tension?
  Eliot never fully settles it. If she did, she would have written a treatise instead of *Middlemarch* or *Daniel Deronda*. She lives inside the tension. She knows that stripping away the theology risks stripping away the awe. She knows that keeping the theology requires a kind of intellectual dishonesty.

  For your chapter, this is good news. Your architect doesn't need to solve this. He needs to **inhabit** it.

  If he decides he is definitely a fraud, the chapter becomes about guilt. If he decides he is definitely a philosopher, it becomes a lecture. But if he stands in the unfinished nave, watching dust motes dance in the light, wondering if the light is holy or just physics, and realizing it doesn't change how the light makes him feel—that is the Eliot position.

  ### A Suggestion for the Scene
  Since you are writing "people in rooms making bad decisions," consider having the architect test this physically.

  Have him stand in the space with a client who is aggressively secular. Have them try to talk about the "function" of the space, and find the language failing. Then, have them stand in silence. The silence does the work the creed used to do.

  The architect's realization could be that he isn't building a church. He is building a **container for silence.** The "bad decision" might be that he knows this, but he charges them for the holy atmosphere anyway, taking money for a grace he can't guarantee. Or, conversely, his "bad decision" is refusing to build a steeple because it's a lie, thereby ruining the silhouette of the building that would have drawn people in.

  ### Summary for the Character's Philosophy
  To synthesize Eliot's position for your protagonist:
  1.  **The Creed is Vocabulary:** It is the 19th-century (or 21st-century) language we have for awe. It is not a scientific claim.
  2.  **The Ritual is Training:** It trains the emotions to recognize that we are part of a whole.
  3.  **The Value is Real:** The comfort derived is not fake just because the source is human. Love is human; that doesn't make it less binding.
  4.  **The Risk:** Without the "divine" threat/promise, will we bother to show up?

  Your architect is not a fraud if he believes that **beauty is a moral force.** That is the secular sacrament. He is designing a space where people can practice being less selfish. Whether they call that God or just "Tuesday" is secondary to the fact that they show up and stand together.

  Eliot would tell him: The tension is the point. Don't resolve it. Just make sure the light falls correctly on the altar, whoever you think is sitting there.
