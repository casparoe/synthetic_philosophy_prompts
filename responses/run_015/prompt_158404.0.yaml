      *   *Section 4: What to Surrender.* Explicit trade-offs.

      *   *Refining (2) vs (3):* This is the crux. If (3) requires adaptation to *unprecedented* failure modes, current LLMs (autoregressive predictors) generally fail this. They hallucinate or revert to mean patterns. To keep (2), you must weaken (3) to "adaptation within distribution" or "simulation of adaptation." To keep (3), you must change (2) to "LLMs simulate knowing-how" or "Future AI will..."
      *   *Refining (1) vs (5):* "Genuine" vs "Pragmatic." In philosophy of mind, "Real Patterns" (Dennett) allow something to be pragmatically real without being metaphysically fundamental. I need to explain this distinction clearly so the user sees they don't have to choose.
