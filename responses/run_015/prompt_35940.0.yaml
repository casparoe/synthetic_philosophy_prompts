      *   *Nuance:* Ellsberg shows ambiguity aversion. IP explains ambiguity aversion by modeling ambiguity as imprecision. So yes, it's a standard move.
      *   *Advice:* Acknowledge that Ellsberg attacks SEU, and IP is the *response* that saves rationality by allowing sets. This avoids the strawman charge.

