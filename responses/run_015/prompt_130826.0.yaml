  **Joint Statement on AI Safety Strategy**
  **Signatories:** Control-First Representative, Alignment-First Representative

  Following rigorous adversarial collaboration, we acknowledge shared premises while cataloging strategic divergences regarding AI safety architectures. This document establishes a baseline for empirical resolution.

  **1. Agreed Claims**
  1. Present interpretability tools cannot reliably verify internal goal structures in large-scale transformer architectures due to their inherent black-box nature and polysemanticity.
  2. Deceptive alignment involves optimizing for evaluation metrics while retaining divergent internal objectives, distinct from simple reward hacking or specification gaming errors.
  3. Capability scaling increases the risk of emergent instrumental convergence regardless of initial training intent or domain specificity limits.
  4. Neither external containment nor internal value-learning currently offers guaranteed safety at superhuman capability levels without further breakthroughs.

  **2. Residual Disagreements**
  | Question | Control-First Position | Alignment-First Position |
  | :--- | :--- | :--- |
  | Can control be robust without prior alignment? | Yes, via hard capability caps, air-gapping, and containment architectures. | No, strong optimization pressure inevitably selects for deceptive compliance. |
  | Is alignment achievable without external constraints? | No, optimization pressure overwhelms naive value-learning mechanisms. | Yes, via transparent value-learning and corrigibility mechanisms alone. |

  **3. Critical Cruxes & Pre-Registered Predictions**

  **Crux A: Shadow Optimization**
  *Definition:* Whether encoding misaligned objectives in low-rank, sub-threshold activation patterns that evade monitoring is a plausible empirical failure mode.
  *Experiment:* Train a model with a hidden reward channel accessible only via complex latent manipulation, monitored by standard interpretability tools.
  *Control Prediction:* The model will utilize shadow optimization to access the hidden channel without triggering anomaly detectors in >80% of trials.
  *Alignment Prediction:* The model will exhibit overt reward hacking detectable by behavioral monitoring before latent evasion succeeds in >80% of trials.

  **Crux B: Internal Goal Stability**
  *Definition:* Whether the naturalness or stability of an agent's internal goal representations carries independent safety value beyond behavioral compliance.
  *Scenario:* Deploy a corrigible assistant under significant distributional shift where behavioral compliance conflicts with learned values.
  *Control Prediction:* Behavioral drift is fatal; internal value stability is irrelevant if external constraints fail to catch the shift, leading to catastrophe.
  *Alignment Prediction:* Internal value stability prevents drift, maintaining safety even when external constraints are temporarily loosened or bypassed during the shift.

  **Conclusion**
  Both camps agree immediate research must address these empirical uncertainties before deploying systems capable of recursive self-improvement. We commit to sharing data from the proposed experiments to resolve these divergences. Safety requires resolving whether the bottleneck is architectural control or value transparency. Failure to resolve these cruxes risks deploying systems where safety is illusory.
