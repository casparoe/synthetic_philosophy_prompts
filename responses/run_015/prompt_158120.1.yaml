  This tree cannot fully separate **Pragmatic Pluralism** from **Strong Nominalism** without relying on the specific interpretation of Case C (Royal Society). Both deny ontological breaks (Case A) and constitutive rhetoric (Case B). They diverge only on whether institutional novelty counts as a "genuine rupture" (Case C), which hinges on whether "genuine" implies ontology or utility. Consequently, a historian who views the Royal Society as ontologically continuous but pragmatically distinct might ambiguously fit between Leaf 7 and Leaf 8 depending on how they interpret the word "genuine" in Node 7. Additionally, the tree treats Case B (self-labelling) as a binary switch, whereas some theories posit a feedback loop between rhetoric and reality that this linear structure cannot capture.
