answer: |-
  # Diagnostic Decision Tree: The Knowledge Argument

  **Node 1 (Root):** Upon leaving the black-and-white room, does Mary come to know a new truth that could theoretically be written in a physics textbook, or does she merely acquire a practical skill to recognize and imagine colors?
  *   **Branch A (Merely a skill):** Go to Node 2.
  *   **Branch B (New truth):** Go to Node 3.

  **Node 2:** Is the capacity she gains limited to external behavioral dispositions (e.g., sorting red chips correctly), or does it include a non-inferential ability to identify the experience from the inside?
  *   **Branch A (Behavioral dispositions only):** **Leaf 1**
  *   **Branch B (Identify from inside):** **Leaf 2**

  **Node 3:** Is the new truth she learns about a feature of reality that is not fully constituted by the arrangement of physical particles and forces described in her room?
  *   **Branch A (Yes, not fully constituted):** **Leaf 3**
  *   **Branch B (No, fully constituted):** Go to Node 4.

  **Node 4:** Imagine Mary knows all physical facts about the left-handed twist of a molecule but never perceives it. If she then perceives it, does the "knowledge gap" feel identical to the color case, or does the color case feel unique?
  *   **Branch A (Gap feels unique to color):** **Leaf 4**
  *   **Branch B (Gap feels identical):** Go to Node 5.

  **Node 5:** Is her new knowledge best understood as locating herself within the world (like an amnesiac learning "I am here"), or as grasping a description of the experience she previously lacked?
  *   **Branch A (Locating herself):** **Leaf 5**
  *   **Branch B (Grasping a description):** **Leaf 6**

  ***

  ### Leaf Classifications

  **Leaf 1: Strict Ability Hypothesis**
  *   **Position:** Mary learns no new facts, only how to do things.
  *   **Awkward Commitment:** Mary's sincere internal claim "I know something new" is literally false.
  *   **Separation Flag:** None.

  **Leaf 2: Non-Propositional Acquaintance**
  *   **Position:** Mary gains a variant of ability knowledge that is factive but non-propositional.
  *   **Awkward Commitment:** There exists a form of knowledge that is real and veridical but cannot be encoded in language even in principle.
  *   **Separation Flag:** None.

  **Leaf 3: Property Dualism**
  *   **Position:** The new truth reveals a non-physical property of experience.
  *   **Awkward Commitment:** The complete physical history of the universe does not determine the history of conscious experience.
  *   **Separation Flag:** None.

  **Leaf 4: Phenomenal Concept Strategy**
  *   **Position:** The gap is unique to phenomenology because phenomenal concepts are direct or quotational, unlike structural concepts.
  *   **Awkward Commitment:** A subject can possess all physical information about a state yet remain rationally ignorant of its phenomenal identity despite full reflection.
  *   **Separation Flag:** **Cannot reliably separate from Leaf 5 (Indexical Physicalism)**, as some argue phenomenal concepts are essentially indexical.

  **Leaf 5: Indexical Physicalism**
  *   **Position:** The persistent gap across color and structural cases is due to self-locating information.
  *   **Awkward Commitment:** The qualitative character of experience is nothing over and above a self-locating relation to physical states.
  *   **Separation Flag:** **Cannot reliably separate from Leaf 4 (Phenomenal Concept Strategy)**, as some argue phenomenal concepts are essentially indexical.

  **Leaf 6: Descriptive Physicalism**
  *   **Position:** The gap persists and is descriptive, implying a cognitive limitation in accessing physical facts without sensory triggers.
  *   **Awkward Commitment:** Mary possessed the physical state constituting the knowledge in the room but was cognitively barred from accessing it without sensory input.
  *   **Separation Flag:** None.
