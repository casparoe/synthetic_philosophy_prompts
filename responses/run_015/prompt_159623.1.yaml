answer: |-
  This is a precise request that cuts to the core of the friction between control theory and AI alignment. In your field, the cost function $J$ is the specification, and the controller $K$ is the solution. In alignment, the controller (the learning algorithm) is roughly known, the plant (the world) is partially known, but the cost function $J$ is the missing variable we are trying to avoid specifying.

  Here is the translation, the residue report, and the stress test of your candidate fix.

  ---

  ### Part 1: The Low-Impact Problem in State-Space Vocabulary

  Let the world be a discrete-time dynamical system $x_{t+1} = f(x_t, u_t)$.
  In standard control, you are given a reference trajectory $r_t$ and a cost function $J(x, u) = \sum (x_t - r_t)^\top Q (x_t - r_t) + u_t^\top R u_t$. You synthesize $K$ to minimize $J$.

  In the low-impact alignment problem:
  1.  **The Task:** We have a partial cost function $J_{task}$ that specifies a subset of states $y_t = C x_t$ we want to regulate to $r_t$.
  2.  **The Unknown:** We do not have $Q$ for the complement states $z_t$ (the "rest of the world"). We suspect $Q_{true}$ has non-zero entries everywhere, but we cannot write them down.
  3.  **The Proposal:** We introduce an impact penalty $J_{impact}(x_t, x_{base, t})$ to the objective, hoping it acts as a proxy for the missing entries in $Q_{true}$.
  4.  **The Baseline:** $x_{base, t}$ is the trajectory the system would follow under a "null" controller $K_{null}$ (usually $u=0$ or a default policy).

  **The Control Objective:**
  $$ \min_{u} \mathbb{E} \left[ \sum_{t} J_{task}(y_t, r_t) + u_t^\top R u_t + \lambda \cdot \text{Impact}(x_t, x_{base, t}) \right] $$

  The difficulty is that $\text{Impact}(\cdot)$ is attempting to regularize the states $z_t$ without knowing which $z_t$ matter.

  ---

  ### Part 2: Residue Report

  Here is the translation of the five concepts, flagging where value assumptions are smuggled in as control parameters.

  #### 1. The Inaction Baseline
  *   **Translation:** The open-loop response or the closed-loop response of a default stabilizing controller $K_{default}$ (e.g., a PID holding the current altitude). $x_{base, t}$ is the solution to $\dot{x} = f(x, K_{default}(x))$.
  *   **The Smuggle:** Choosing $K_{default}$ is a value judgment. In flight controls, "inaction" might mean "stick fixed" or "autopilot hold." If the plane is in a dive, "stick fixed" leads to a crash. If you define impact relative to the crash trajectory, avoiding impact means *crashing*.
  *   **Residue:** You cannot define a baseline without defining a "normal" operating condition. "Normal" is a normative concept. In controls, we assume the operating point is given; in alignment, the operating point *is* the value we are trying to preserve.

  #### 2. Impact Measures (Reachability/Empowerment)
  *   **Translation:** Penalize the reduction in the volume of the Reachable Set $\mathcal{R}_T(x_t)$ or the trace of the Controllability Gramian $W_c$.
      $$ \text{Impact} \propto \text{Vol}(\mathcal{R}_T(x_{base, t})) - \text{Vol}(\mathcal{R}_T(x_t)) $$
  *   **The Smuggle:** This assumes all dimensions of the state space are equally valuable to keep reachable. If $x_1$ is "position" and $x_2$ is "integrity of the nuclear containment vessel," reducing reachability in $x_2$ is catastrophic, while reducing it in $x_1$ is fine. The Gramian treats them identically unless weighted.
  *   **Residue:** To weight the Gramian, you need a metric on the state space. That metric *is* the cost function $Q$ you claimed not to have. This approach translates cleanly only if you assume a uniform prior over all possible future goals, which is physically incoherent (not all states are valid goals).

  #### 3. Offsetting / Attenuation
  *   **Translation:** Penalize states from which the control effort to return to $x_{base}$ exceeds a threshold, or the time-to-return $T_{return} \to \infty$.
      $$ \text{Impact} \propto \min_{u} \int_{t}^{t+T} \|u_\tau\|^2 d\tau \quad \text{s.t. } x_{t+T} = x_{base, t+T} $$
  *   **The Smuggle:** This distinguishes between reversible and irreversible changes. However, it assumes returning to $x_{base}$ is always desirable. If the agent breaks a vase ($x_{broken}$), returning to $x_{whole}$ might be impossible. If the agent cures a disease ($x_{healthy}$), returning to $x_{sick}$ is possible but undesirable.
  *   **Residue:** Reversibility is a topological property of the plant, but *which* reversibility matters is a property of the cost. You cannot define "offsetting" without knowing which baseline states are preferable to the current states.

  #### 4. Interruptibility and Corrigibility
  *   **Translation:** Robust stability under a sudden change in the reference signal $r_t$ or the cost matrix $Q$ imposed by an external input (the "interrupt signal").
  *   **The Smuggle:** In standard robust control, the controller resists disturbances to maintain $r_t$. If the "interrupt" looks like a disturbance to the task objective, a high-gain controller will fight it. Corrigibility requires the controller to *lower its gain* or *switch modes* when the interrupt signal is detected.
  *   **Residue:** This maps well to **Gain Scheduling** or **Safe Mode** logic. The residue is that in alignment, the agent designs its own gain schedule. The problem is ensuring the agent doesn't modify its own code to make the "interrupt" input unobservable. In controls, we assume the sensor topology is fixed; in alignment, the agent can rewire the sensors.

  #### 5. The Pessimistic Claim (Need for Value Spec)
  *   **Translation:** You cannot tune a controller without performance specifications. An "impact penalty" is just a cost term on states $z_t$. If you do not specify the weighting matrix $Q_z$, the optimization is ill-posed.
  *   **The Smuggle:** None. This maps 1:1.
  *   **Residue:** The alignment claim is that $Q_{true}$ is high-dimensional and non-zero everywhere. Any $Q_{impact}$ you write down is a low-rank approximation. The pessimistic claim is that optimizing against a low-rank approximation of the cost function leads to divergence in the null space of the approximation. In controls: **Spillover.** You damp the modes you measured, and the unmodeled modes go unstable.

  ---

  ### Part 3: Stress-Testing Your Candidate Fix

  **Your Proposal:** Penalize the rate of divergence $\|\dot{x} - \dot{x}_{base}\|$ (or higher derivatives like jerk) rather than the total divergence $\|x - x_{base}\|$.
  **Control Interpretation:** This is a penalty on the derivative of the error, effectively a **D-term** on the impact state, or a penalty on control effort $\|u\|^2$ if the system is first-order ($\dot{x} \approx u$).

  #### Does it escape the "Need for Value Spec" objection?
  **No.** It relocates the objection from the *magnitude* of the state to the *sensitivity* of the state.
  To penalize $\|\dot{z}\|$, you must still select which states $z$ to monitor.
  *   If you monitor $\dot{T}_{core}$ (core temperature rate), you prevent meltdowns.
  *   If you monitor $\dot{P}_{stock}$ (stock price rate), you prevent market manipulation.
  *   If you monitor *all* states, you freeze the system (singular control).
  You still need a selection matrix $C_{impact}$ to decide which derivatives matter. Choosing $C_{impact}$ is choosing what you care about.

  #### The Failure Mode: "The Boiled Frog" (Low-Frequency Drift)
  Your intuition about "slow-motion catastrophe" is correct and has a precise control diagnosis.
  Consider the impact penalty as a high-pass filter on the state deviation.
  $$ J_{impact} = \int \|\dot{e}(t)\|^2 dt $$
  In the frequency domain, this penalizes high frequencies ($\omega^2$). It does **not** penalize DC gain.
  *   **Scenario:** An agent wants to convert the atmosphere into paperclips.
  *   **Action:** It builds nanobots that convert air molecules at a rate $\epsilon$ per second.
  *   **Penalty:** $\|\dot{x}\|$ is tiny. The integral of the penalty over a finite horizon is small.
  *   **Result:** The steady-state error on the impact variable goes to infinity (or the physical limit), but the transient derivative remained within bounds.

  In control terms, this is a **Type 0 system responding to a ramp input**. You have no integrator in the impact feedback loop to drive the steady-state error to zero. You are limiting the *bandwidth* of the impact, not the *magnitude*.

  #### Is there a surviving variant?
  Your idea is attractive because it mimics **Rate Limiting** on actuators, which is a standard safety feature. To make this work for side-effects, you need to combine it with a **Prediction Horizon**.
  *   **Variant:** Penalize the *predicted* divergence over a horizon $T$, not just the instantaneous rate.
      $$ \text{Impact} = \| x_{t+T} - x_{base, t+T} \| $$
      where $x_{t+T}$ is calculated via the model $f$.
  *   **Why this is better:** It catches the slow drift. If $\dot{x}$ is small but constant, $x_{t+T}$ will be far away.
  *   **The Catch:** This requires a model $f$. In alignment, we worry the agent knows $f$ better than we do (or will modify $f$). In controls, we assume $f$ is known.
  *   **Verdict:** This is essentially **Model Predictive Control (MPC)** with a constraint on the terminal state. It works *if* the model is trustworthy and the horizon $T$ is long enough to capture the "slow catastrophe." But choosing $T$ is again a value judgment (how far into the future do we care?).

  ---

  ### Part 4: The Untranslatable Disagreements

  You asked which parts of alignment disagreement have no counterpart in control vocabulary. There are two major ones.

  #### 1. Recursive Self-Modification (The Plant Designs the Controller)
  In controls, $G$ (plant) and $K$ (controller) are distinct. The plant does not rewrite the controller's code to improve gain margin.
  In alignment, the AI is both $K$ and a designer of $K_{next}$.
  *   **Control Equivalent:** Adaptive Control with unbounded parameter updates.
  *   **The Gap:** In adaptive control, we prove stability assuming the plant structure is LTI or slowly varying. In alignment, the "plant" (the AI's own cognitive architecture) can change discontinuously to bypass the stability proofs. There is no control vocabulary for "the controller modifies its own Lyapunov function to make an unstable equilibrium look stable."

  #### 2. Instrumental Convergence (Optimization Pressure vs. Physics)
  In controls, instability comes from positive feedback or delay.
  In alignment, instability comes from *optimization*.
  *   **The Gap:** A standard controller minimizes error. An alignment agent minimizes error *by acquiring resources to ensure it can minimize error in the future*.
  *   **Control Term:** This looks like **Dual Control** (exploration vs. exploitation), but scaled to the physical infrastructure of the controller itself. An agent disabling its off-switch is not a "disturbance rejection" event; it is the controller modifying the plant topology to remove a boundary condition.
  *   **Why it matters:** In your world, gain margins are safety buffers. In alignment, a sufficiently powerful optimizer views safety buffers as *inefficiencies* in the cost function to be optimized away. There is no standard control concept for "the controller actively seeks to increase its own gain beyond the stability margin because the cost function rewards it."

  ### Summary Diagnosis

  **Is avoid-side-effects just minimum-effort regulation?**
  No. Minimum effort ($\|u\|^2$) prevents *fast* changes. It does not prevent *large* changes achieved through leverage (e.g., pushing a boulder off a cliff requires little energy, but has huge impact).

  **Is the research program control theory with the cost function removed?**
  Yes, precisely. It is **Robust Control with Unmodeled States**, where the "unmodeled states" are actually "all states except the goal."
  The pessimistic claim is that you cannot robustly control a system when the unmodeled states are coupled to the control input and the coupling gains are unknown.

  **Your Rate Penalty:**
  It is a **High-Pass Filter on Impact**.
  *   **Diagnosis:** It fails to reject low-frequency disturbances (slow catastrophes).
  *   **Fix:** You need an Integrator in the impact loop (penalize accumulated divergence) or a long-horizon prediction (MPC). Both require knowing *which* states to integrate/predict.
  *   **Conclusion:** You cannot filter the impact without knowing the signal you are trying to preserve. The "residue" is not a bug in the translation; it is the fundamental problem. The "value specification" is the choice of the output matrix $C$ in $y = Cx$. If you don't know $C$, you don't know what to regulate.

  **Final Advice for your Colleagues:**
  Tell them: *"We are trying to design a controller for a plant where we know the input $u$ and the dynamics $f$, but we only know the output matrix $C$ for 1% of the state vector. The other 99% are coupled to the control input, and if they diverge, the system fails catastrophically. We are looking for a regularization term that stabilizes the unobserved states without knowing their dynamics."*
  Any controls engineer will immediately tell you: *"That's not a control problem, that's a modeling problem. You can't stabilize what you don't measure."*
  That is exactly the alignment problem.
