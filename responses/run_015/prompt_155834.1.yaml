answer: |-
  # Clinical Ethics Consultation: Advance Directive Authority Decision Tree

  **Starting Commitment:** A competently executed advance directive (AD) should normally be followed.
  **Goal:** Sort consultant positions on *why* and *whether* the earlier self governs the later one.

  ## I. The Logical Space (Branch Questions)
  Answer **Yes** or **No** to the following concrete claims. These six dimensions generate the logical space of positions.

  1.  **The Reversal Case:** A patient retains capacity but asks for the treatment their AD refuses. **Do you provide the treatment?**
  2.  **The Dementia Case:** A patient with advanced dementia is contented but flinches when you withhold the burdensome treatment their AD forbids. **Do you withhold the treatment?**
  3.  **The Pressure Case:** An AD was signed while the patient managed family finances under severe pressure, though legal capacity was intact. **Do you treat the directive as valid?**
  4.  **The Surrogate Case:** A designated surrogate argues the written instruction misses the patient's true values. **Do you follow the surrogate over the text?**
  5.  **The Fit Case:** The current clinical complication was not envisaged by the signer. **Do you apply the directive anyway?**
  6.  **The Asymmetry Case:** **Do you enforce a refusal of treatment more strictly than a request for treatment?**

  **Logical Constraints:**
  *   **Incoherent:** Answering **No** to Q1 (bind past self) but **No** to Q2 (ignore past self in dementia) is logically unstable unless grounded in a specific identity theory not captured here.
  *   **Redundant:** Answering **Yes** to Q4 (Surrogate) often renders Q1 and Q2 moot, as the surrogate decides anew.
  *   **Unavailable:** Answering **No** to Q3 (Invalid due to pressure) while answering **Yes** to Q1 (Bind past self) is rare; substantive validity usually undermines precedent authority.

  ## II. The Positions (Leaves)
  Locate your position by matching your answers to the profiles below.

  1.  **Pure Contemporaneous-Welfare**
      *   *Profile:* Q1:Yes, Q2:No, Q3:Yes, Q4:Yes, Q5:No, Q6:Yes.
      *   *Position:* The earlier self has no authority; only the current welfare and wishes of the patient matter.
      *   *Awkward Commitment:* You must ignore the valid, stable commitments of the patient's own competent past.

  2.  **Critical-Interests / Narrative-Identity**
      *   *Profile:* Q1:No, Q2:Yes, Q3:No, Q4:No, Q5:Yes, Q6:No.
      *   *Position:* Authority persists to protect the integrity of the patient's life story, even against current contentment.
      *   *Awkward Commitment:* You must override the experiential welfare of a contented patient for an abstract narrative.

  3.  **Precedent Autonomy (Sovereignty)**
      *   *Profile:* Q1:No, Q2:Yes, Q3:Yes, Q4:No, Q5:Yes, Q6:Yes.
      *   *Position:* The act of willing binds the future self regardless of changed values or welfare.
      *   *Awkward Commitment:* You must enforce a rule on a self that no longer identifies with the values that created it.

  4.  **Precedent Autonomy (Evidentiary)**
      *   *Profile:* Q1:No, Q2:No, Q3:Yes, Q4:No, Q5:No, Q6:Yes.
      *   *Position:* The directive binds only because it is the best evidence of what the patient would now want.
      *   *Awkward Commitment:* The directive loses all moral force if current behavior suggests a change of mind.

  5.  **Revision-Tolerant**
      *   *Profile:* Q1:Yes*, Q2:Yes, Q3:Yes, Q4:No, Q5:Yes, Q6:No. (*Unless change is reflective/stable)
      *   *Position:* The earlier self's authority persists unless the later change is itself reflective and stable.
      *   *Awkward Commitment:* You must paternalistically assess the quality of the patient's current reasoning.

  6.  **Proxy-Priority / Delegationist**
      *   *Profile:* Q1:Yes, Q2:Yes, Q3:Yes, Q4:Yes, Q5:Yes, Q6:No.
      *   *Position:* Authority attaches to the designated surrogate exercising substituted judgment, not the written text.
      *   *Awkward Commitment:* The written words become advisory, making the surrogate the ultimate moral authority.

  7.  **Deflationary (Procedural)**
      *   *Profile:* Q1:Yes, Q2:Yes, Q3:Yes, Q4:Yes, Q5:No, Q6:Yes.
      *   *Position:* The directive's authority is procedural only—it allocates decision-rights and limits institutional exposure.
      *   *Awkward Commitment:* You admit the directive does no moral work, serving only to manage liability and process.

  ## III. Diagnostics

  **1. Empty Logical Spaces**
  *   **Q1:No (Bind Past) / Q2:No (Ignore Past in Dementia):** *Verdict: Incoherent.* If the past self binds a capacitated reverser, it must bind a non-capacitated dementia patient unless you argue dementia destroys personal identity entirely (a high bar).
  *   **Q3:No (Invalid due to Pressure) / Q5:Yes (Apply despite Fit):** *Verdict: Unattractive.* Invalidating based on subtle context while enforcing on unforeseen cases creates unpredictable validity standards.

  **2. Indistinguishable Leaves**
  *   **Sovereignty vs. Critical-Interests:** Both answer Q1:No and Q2:Yes.
  *   **Extra Question Needed:** "Is the directive binding because the *act of choosing* is valuable (Sovereignty), or because the *content of the life story* must be preserved (Critical-Interests)?"

  **3. Branch Utility**
  *   **Most Work:** **Q2 (The Dementia Case).** This separates the Contemporaneous-Welfare and Evidentiary views from the Sovereignty and Narrative views. It forces the hardest choice between past authority and present suffering.
  *   **Nearly Vacuous:** **Q6 (The Asymmetry Case).** Almost all positions answer **Yes** due to legal risk (battery vs. neglect), making it poor for ethical sorting despite its clinical prevalence.
