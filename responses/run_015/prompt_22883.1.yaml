answer: |-
  It is great to meet a fellow traveler from the hard sciences crossing over into philosophy. You have the right instinct: these three problems are siblings, born from the same parent (representing action and change in logic), but they have very different temperaments.

  In the AI and robotics community (where you likely encountered them), these are distinct engineering hurdles. In the broader philosophical community (e.g., Dennett, Fodor), the term "Frame Problem" is often used as an umbrella term for all of them, which is the source of the conflation you're seeing.

  Since you want a gut-level intuition, let's skip the situation calculus and use a scenario you know well: **A robotic arm picking up a red mug.**

  Here is the breakdown.

  ### 1. The Frame Problem (The Problem of Inertia)
  **The Question:** *What stays the same?*

  When your robot arm picks up the mug, the mug's location changes. But the color of the mug doesn't change. The position of the wall doesn't change. The gravitational constant doesn't change. The fact that the robot is retired doesn't change.

  In a logical system, if you don't explicitly state that a fact remains true, the system might assume it becomes unknown or false. The Frame Problem is the burden of having to explicitly list every single thing in the universe that *didn't* change.

  *   **Gut Intuition:** It's the problem of **relevance**. The world is huge; the action is local. How do you formally encode the assumption that "everything else stays put" without listing the entire state of the universe for every time step?
  *   **Physicist's Analogy:** It's like solving a differential equation where you have to explicitly re-state the boundary conditions for every infinitesimal time step, rather than assuming continuity.

  ### 2. The Ramification Problem (The Problem of Side Effects)
  **The Question:** *What changes indirectly?*

  Now, suppose the robot picks up the mug.
  *   **Direct Effect:** The mug is in the air.
  *   **Ramifications:** The coaster under the mug is now exposed. The shadow of the mug moves on the table. If the mug had coffee in it, the center of mass of the robot arm shifts. If the mug was blocking a button, the button is now unblocked.

  The Ramification Problem is that actions trigger causal chains. If you only program the direct effect ("Mug is in hand"), your model fails to account for the secondary consequences that logically follow from that new state.

  *   **Gut Intuition:** It's the problem of **causal closure**. You can't list every domino that will fall. How does the system infer the indirect consequences without being explicitly told about shadows, coasters, and centers of mass?
  *   **Physicist's Analogy:** It's the difference between a perturbation in one variable and the coupled response of the entire system. You move one gear; you need to know which other gears are meshed with it without mapping every gear in the machine.

  ### 3. The Qualification Problem (The Problem of Exceptions)
  **The Question:** *What could prevent this?*

  This one is different. The first two are about what happens *after* the action. The Qualification Problem is about *before* the action.

  You program the robot: "If you grasp the mug, lift it."
  But wait... what if the mug is glued to the table? What if the robot's battery is at 1%? What if gravity suddenly turned off? What if the mug is made of neutron star matter and is too heavy? What if the robot's gripper is currently holding a lit torch?

  To guarantee the action succeeds, you need an infinite list of preconditions (qualifications). Since you can't list them all, your system is always vulnerable to an unanticipated exception.

  *   **Gut Intuition:** It's the problem of **ceteris paribus** ("all other things being equal"). We assume the laws of physics hold, but formally, we can't prove there isn't a hidden variable preventing the action.
  *   **Physicist's Analogy:** It's the "ideal gas law" vs. reality. The equation works *unless* there's a leak, *unless* the temperature is near absolute zero, *unless* the container is magnetic. You can't list every environmental condition that invalidates the model.

  ### Summary of the Distinction

  Imagine you are writing a function `PickUp(Mug)`.

  1.  **Qualification:** Can I even run this function? (Is the mug glued? Is the arm broken?)
  2.  **Frame:** If I run it, which variables in my global state struct do I *not* need to update? (Don't rewrite `Wall.Position`.)
  3.  **Ramification:** If I run it, which dependent variables do I need to update that I didn't explicitly target? (Update `Coaster.Visibility`.)

  ### Why People Conflate Them

  You are seeing them conflated because, philosophically, they all point to the same epistemic limitation: **Human common sense is non-monotonic, but formal logic is monotonic.**

  *   **Monotonic logic:** Once you prove something true, it stays true forever unless you explicitly retract it.
  *   **Human common sense:** We assume things stay true (Frame), we assume consequences follow (Ramification), and we assume no hidden blockers exist (Qualification)—until we are proven wrong.

  Philosophers like Daniel Dennett expanded the "Frame Problem" to mean "How do agents know what is relevant in a complex world?" which swallows the other two problems whole. But since you come from robotics, you should trust your original intuition: keep them distinct.

  *   **Frame:** Persistence (What stays).
  *   **Ramification:** Consequences (What spreads).
  *   **Qualification:** Preconditions (What blocks).

  It is the difference between worrying about the dust settling (Frame), the dominoes falling (Ramification), and the floor being slippery (Qualification).
