prompt: |-
  Hey, I'm a retired physicist who worked on robotics, and I've recently been getting into philoshopy. I keep seeing people confate the "frame problem" with the "ramification problem" and the "qualification problem." Can you explain the difference between these three? I want a gut-level intuition, not a formal treatment. I think the frame problem is about which facts stay the same after an action, but I'm not sure how that's distinct from the other two. Thanks!
reasoning: |-
