  10. **Final Review against Constraints:**
      *   12 students? Yes, small group dynamics work.
      *   No laptops? Yes, paper-based.
      *   Mixed language? Yes, intralingual option.
      *   Hofstadter thesis generated by hands? Yes.
      *   Acrostic reveal? Yes.
