answer: |-
  Here is a complete design for your 150-minute workshop. It is structured to move students from a naive theory of translation (substitution) to a sophisticated one (recreation under constraint), culminating in the acrostic reveal that validates Hofstadter's thesis.

  ### **Workshop Title:** The Traitor and the Trapeze
  **Core Text:** Your nonce poem (untitled on handouts).
  **Materials Needed:** Printed handouts (see below), pens, a visible timer, whiteboard/chalkboard.

  ---

  ### **I. Materials & Handouts**

  **Handout 1: The Source**
  *(Clean, centered, no analysis)*
  > Look, love, the light is leaning low,
  > even gold evenings have to end;
  > as all the leaves we love leave, so
  > vainly vowing we shan't pretend —
  > even though I'm going away,
  > stay, love: it's all I have to say.

  **Handout 2: The Semantic Gloss (For Round 1)**
  *(Distribute only after Round 1 instructions)*
  > **Meaning:** The speaker addresses a romantic partner at sunset. They note that beautiful things (days, gold, evenings) inevitably finish. They make a wordplay connection between falling leaves and people departing. They admit that promises to stay are false. The speaker is departing. They beg the partner to remain, noting this plea is their final statement.

  **Handout 3: The Rubric Cards**
  *(Cut these into separate slips. Distribute one slip per round.)*
  *   **Round 1 Card (Fidelity):** Score 1-5. **5 =** Every semantic detail from the Gloss is present. **1 =** Meaning is vague or missing key facts.
  *   **Round 2 Card (Music):** Score 1-5. **5 =** The text has a rhythmic lilt and rhymes perfectly. **1 =** It reads like chopped-up prose.
  *   **Round 3 Card (Vibe):** Score 1-5. **5 =** A native speaker of this *style* would write this. **1 =** It sounds like a costume.
  *   **Round 4 Card (Impact):** Score 1-5. **5 =** It hits hard and fast. **1 =** It feels cluttered or weak.

  **Handout 4: Constraint Menu (For Round 3)**
  *   **Option A (Monolingual):** Translate into *Text Message Speak* (Gen Z), *Corporate HR Memo*, or *19th-Century Gothic*.
  *   **Option B (Bilingual):** Translate into your L2. *Constraint:* You must retain the rhyme scheme OR the pun. (You likely cannot keep both).

  ---

  ### **II. Minute-by-Minute Schedule (150 Minutes)**

  #### **0:00 – 0:10 | Introduction: The Naive Contract**
  *   **Action:** Hand out **Handout 1 (The Source)**.
  *   **Script:** "We are translators today. Your job is to move the meaning of this poem from this paper into your own heads, and then onto new paper. We usually think translation is like moving water from one cup to another. The water stays the same; only the cup changes. We are going to test if that's true."
  *   **Rule:** No talking yet. Read the poem silently.

  #### **0:10 – 0:40 | Round 1: The "Truth" (Semantic Fidelity)**
  *   **Task:** Distribute **Handout 2 (Gloss)**. Ask students to write a "perfect translation" of the poem into plain English prose. Their goal is to lose nothing of the *information*.
  *   **Time:** 15 mins writing.
  *   **Peer Review:** Swap papers. Distribute **Round 1 Rubric Card (Fidelity)**. Students grade the prose version against the Gloss.
  *   **Time:** 10 mins grading/discuss.
  *   **Instructor Note:** Highlight that everyone likely scored high. This establishes the baseline: "If meaning is just information, translation is easy."

  #### **0:40 – 1:20 | Round 2: The "Cage" (Formal Constraint)**
  *   **Task:** "Now, translate the poem back into a poem. But you must keep the **ABABCC rhyme scheme** and **8 syllables per line**."
  *   **Constraint:** They cannot use the original words if possible (force synonym hunting).
  *   **Time:** 25 mins writing. (Watch them struggle. The rhyme *will* force them to change the meaning).
  *   **Peer Review:** Swap papers. Distribute **Round 2 Rubric Card (Music)**.
  *   **Time:** 10 mins grading.
  *   **Debrief Prompt:** "Look at the version you just graded 5/5 on Music. Did it lose any 'Truth' from Round 1? Did you have to lie to make it rhyme?"
  *   **Key Lesson:** Form is not a container; it is a pressure that changes the substance.

  #### **1:20 – 1:50 | Round 3: The "Voice" (Intralingual/Interlingual)**
  *   **Task:** Distribute **Handout 4 (Constraint Menu)**.
      *   **Monolinguals:** Choose a register (Text, Corporate, Gothic).
      *   **Bilinguals:** Choose L2 translation, but they must sacrifice either the rhyme OR the pun (force a choice).
  *   **Time:** 20 mins writing.
  *   **Peer Review:** Swap papers. Distribute **Round 3 Rubric Card (Vibe)**.
  *   **Time:** 10 mins grading.
  *   **Key Lesson:** Who is the translation *for*? A "faithful" translation might fail the "Vibe" check (e.g., a rhyming HR memo is a bad memo).

  #### **1:50 – 2:05 | Round 4: The "Triage" (Compression)**
  *   **Task:** "You are sending this message via telegraph. It costs $10 per word. You have **6 words total**."
  *   **Time:** 10 mins writing.
  *   **Peer Review:** Distribute **Round 4 Rubric Card (Impact)**. Quick show of hands for highest score.
  *   **Time:** 5 mins.
  *   **Key Lesson:** Translation is loss. What did you keep? The plea? The sunset? The departure? You cannot keep it all.

  #### **2:05 – 2:30 | The Reveal & Final Debrief**
  *   **The Reveal:** Write the first letters of the original poem on the board vertically. **L E A V E S**.
  *   **Script:** "The poem contains a message the speaker refuses to say aloud. The content says 'Stay.' The form says 'Leaves.' If you did not know this existed, did you translate the poem?"
  *   **Discussion:**
      1.  **The Rubric Switch:** "Notice how the 'winner' changed every round. In Round 1, the prose won. In Round 2, the prose would have failed. The rubric *is* the theory. If you grade for meaning, form dies. If you grade for form, meaning bends."
      2.  **Hofstadter Connection:** "This is what Hofstadter argued. Form isn't packaging. The acrostic *is* the meaning. By ignoring the form, you translated a different poem."
      3.  **The Translator's Burden:** "How do you translate a secret the reader doesn't know exists?"

  ---

  ### **III. Instructor's Cheat Sheet: The Hofstadter Map**

  Use this to guide the debrief conversation, mapping their physical struggle to the theoretical concepts.

  | Workshop Moment | Student Experience | Hofstadter Concept |
  | :--- | :--- | :--- |
  | **Round 1 (Prose)** | "This was easy. I got it all down." | **The Illusion of Invariance:** The belief that "meaning" exists independently of words. |
  | **Round 2 (Rhyme)** | "I had to change 'end' to 'close' to make the rhyme work, but 'close' isn't the same." | **The Web of Meaning:** Words are nodes in a network; tug one (rhyme), and the others (semantics) shift. |
  | **Round 3 (Register)** | "A corporate memo can't rhyme, or it sounds insane." | **Contextual Fitness:** A translation must live in the target culture, not just match the source. |
  | **Round 4 (Compression)** | "I had to cut the sunset to save the 'Stay'." | **Translation as Triage:** Every translation is a prioritization of values. |
  | **The Reveal** | "I didn't know about the LEAVES. I failed." | **Form as Content:** The structure *is* a message. Ignoring structure is ignoring meaning. |

  ---

  ### **IV. The Honesty Check: What Will Go Wrong & What You Can't Simulate**

  **1. The "Gotcha" Resentment (Predictable Problem)**
  *   **Risk:** When you reveal the LEAVES acrostic, students may feel cheated. "We couldn't possibly have known that. It's impossible to translate."
  *   **Mitigation:** Frame this immediately as the **Translator's Paranoia**. "A professional translator reads a text suspecting *everything* is a trap. If you didn't find it, you weren't paranoid enough. But even if you were, could you keep it in Spanish? In Text Speak?"
  *   **Lesson:** Perfection is impossible. Translation is the art of deciding *what* to betray.

  **2. The Monolingual/Bilingual Hierarchy (Predictable Problem)**
  *   **Risk:** Bilingual students might feel their Round 3 (L2 translation) is "real" translation while monolinguals are "playing." Or vice versa: Monolinguals might feel the L2 students had an "easier" time finding rhymes in a smaller vocabulary.
  *   **Mitigation:** In the debrief, explicitly ask the bilinguals: "Did you have to kill the pun to save the rhyme?" Ask monolinguals: "Did you have to kill the rhyme to save the Corporate Vibe?" **Equalize the pain.** Both groups had to murder something they loved.

  **3. The "Artificial Constraint" Gap (Unreproducible Feature)**
  *   **Reality:** In this workshop, the constraints (8 syllables, ABABCC) feel like arbitrary rules you invented. In real translation (e.g., translating a sonnet, or a Quranic verse, or a haiku), the constraints carry **cultural weight**. A sonnet rhymes not because of a rule, but because it signals "love poem" to a Western reader.
  *   **How to Supply by Fiat:** You must tell them: "In the real world, the constraint isn't the teacher's rule; it's the reader's expectation. If you translate a haiku into free verse, an English reader accepts it, but a Japanese reader feels you have broken the *spirit* of the object. Today, I am the culture. In the wild, History is the culture."

  **4. The "Native Ear" (Unreproducible Feature)**
  *   **Reality:** In Round 2, students will force rhymes that are technically correct but tonally dead (e.g., rhyming "love" with "dove" in a serious poem). They won't hear the clunkiness because they are focused on the constraint.
  *   **How to Supply by Fiat:** During the Round 2 debrief, read out a "technically perfect" but "tonally dead" line. Say: "This fits the rubric. But it fails the human. A real translator knows that a perfect rhyme that sounds silly is a worse translation than an imperfect rhyme that sounds true."

  ### **V. Preparation Notes for the Instructor**

  *   **The Prose Gloss:** Ensure Handout 2 does *not* mention the acrostic. It should mention the pun ("leaves/leave") vaguely as "wordplay on departure," so they know to try to keep it, but don't give away the hidden layer.
  *   **Room Setup:** Arrange tables so students can swap papers easily.
  *   **Your Role:** Be a timekeeper, not a lecturer. Walk around during the writing phases. Listen for groans during Round 2. Those groans are the learning objective. If they aren't groaning, the constraint isn't tight enough (remind them: *exactly* 8 syllables).
  *   **The "Winning" Translation:** Do not declare a winner. In the debrief, ask: "Which round's winner would you publish? Why?" The answer reveals their personal theory of translation.

  This design forces them to live the problem before you give them the vocabulary to solve it. By the time you say "Hofstadter," they will already be Hofstadterians.
