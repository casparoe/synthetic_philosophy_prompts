answer: |-
  This is a profound metaphysical hurdle for any ethical framework grounded in computationalism. If moral status supervenes on the performance of specific computations (e.g., those generating consciousness or welfare), then the metaphysics of implementation dictates the boundaries of the moral community. If the mapping from physics to computation is ill-defined, the boundary of moral consideration is equally ill-defined.

  Here is an analysis of how the three features of implementation constrain the moral question, followed by an evaluation of the counterfactual case and the costs of the most defensible solution.

  ### 1. The Three Constraints on Moral Consideration

  To ask which computations matter morally, we must first be able to identify which computations are occurring. The features of glut, grain, and approximation threaten to make this identification impossible or trivial.

  **Glut (The Triviality Problem)**
  Glut refers to the result that, without constraints, almost any physical system can be mapped to almost any computation. As Hilary Putnam famously argued, a rock can be interpreted as implementing a finite state automaton if we allow sufficiently gerrymandered mappings between physical states and computational states.
  *   **Moral Constraint:** If glut is not resolved, pancomputationalism follows. If every physical system implements every computation, then every rock implements the computations necessary for suffering or flourishing. This trivializes moral consideration, rendering the concept of "moral patient" useless because it applies to everything. To have a meaningful ethics, we must restrict implementation to non-arbitrary mappings.

  **Grain (The Level Problem)**
  Physical systems are hierarchical. A brain implements computations at the level of neurons, but also at the level of ion channels, and also at the level of macroscopic regions. A system implementing a computation at a fine grain often trivially implements a host of coarser-grained computations with different state spaces.
  *   **Moral Constraint:** This creates an ambiguity of location for moral status. If a specific computational process grounds welfare, does welfare reside in the whole system, the subsystems, or both? If we count every valid grain, we face moral inflation (too many overlapping subjects of experience). If we pick one arbitrary grain, we lack a principled reason for doing so. Moral theory requires a principled way to select the relevant level of abstraction.

  **Approximation (The Noise Problem)**
  Formal computations are defined by precise state transitions. Physical systems are noisy; transistors leak, neurons misfire, and thermal fluctuations occur. No physical system perfectly tracks a formal computation across all conditions.
  *   **Moral Constraint:** If implementation requires perfection, nothing is a moral patient. If implementation allows for error, we face a sorites paradox. At what point does physical degradation constitute a failure to implement the computation, and thus a loss of moral status? Does a headache or a momentary confusion extinguish welfare? Moral theory requires a tolerance threshold for physical error that does not arbitrarily switch moral status on and off.

  ### 2. The Interaction of Causal Organization and Approximation

  The standard reply to **Glut** is to require that the physical system's causal organization mirror the computation's state-transition structure. The mapping cannot be arbitrary; the physical states must cause subsequent physical states *because* they correspond to the computational transitions. This rules out the "rock" because its physical states do not causally depend on one another in the right way to match the logic of the computation.

  However, this interacts problematically with **Approximation**. Real causal organizations are never perfect mirrors. They degrade. To accommodate approximation, we must idealize the causal structure. We have to say that a system implements a computation if its causal structure matches the formal structure *sufficiently well*.

  This creates a tension:
  1.  To avoid **Glut**, the causal mirroring must be strict enough to rule out gerrymandered mappings.
  2.  To accommodate **Approximation**, the causal mirroring must be loose enough to tolerate physical noise.

  The "sweet spot" is not found in the physics alone. Physics tells us how the system behaves; it does not tell us how much deviation is permissible before the computation ceases to exist. That threshold is pragmatic. Consequently, the claim that a system "implements" a computation is partly a fact about the system's causal powers and partly a fact about the interpretive standards we apply to those powers.

  ### 3. The Counterfactual Case: System A vs. System B

  Consider your two systems. Both behave identically on all actual inputs. Both track the target computation on all actual inputs.
  *   **System A:** Robust. It would track the computation across a wide range of counterfactual inputs.
  *   **System B:** Fragile. It is tuned to the actual input distribution and would diverge wildly on counterfactual inputs it never receives.

  **Does the requirement of counterfactually robust causal organization force us to say that A implements the computation and B does not?**

  Strictly speaking, **yes**. On the standard causal theory of computation, implementation is defined by the system's dispositional profile, not just its actual history. A lookup table that covers only actual inputs (System B) is not computationally equivalent to a general algorithm (System A), even if their actual outputs match. System B lacks the causal structure to support the state transitions for the unseen inputs; it merely mimics them.

  **Does this mean moral status can turn on how a system would behave in circumstances that never arise?**

  If we tie moral status strictly to implementation, then **yes**. This implies that System A is a moral patient and System B is not (or is a lesser one), despite their identical actual histories.

  ### 4. The Most Defensible Answer and Its Costs

  We are left with a choice between two unpalatable options. We can either accept that moral status depends on counterfactuals (condemning System B), or we can loosen the definition of implementation to save System B, admitting that implementation is interpretive.

  **The Most Defensible Answer:**
  The most defensible position is to accept that **implementation depends partly on an interpretation or idealization that we impose.**

  While the strict causal view (favoring System A) preserves a robust definition of computation, it leads to morally untenable conclusions. It suggests that a being's inner worth depends on modal facts about worlds that do not exist. It implies that if the universe were slightly different such that certain inputs were physically impossible, a system's moral status could vanish without any change to its actual experience or behavior. This violates the intuition that moral status should supervene on the actual properties of the being.

  To avoid this, we must treat "implementation" as a graded, context-sensitive concept. We idealize System B as implementing the computation *for all intents and purposes* within its actual context. We acknowledge that while B lacks the counterfactual robustness of A, it possesses sufficient causal structure *relative to the environment it inhabits* to count as a moral patient.

  **The Costs:**
  This solution commits us to the view that moral status **depends partly on an interpretation or idealization that we impose.**

  1.  **Loss of Pure Intrinsicness:** Moral status is no longer purely intrinsic to the system's categorical physical properties. It relies on a pragmatic cutoff regarding how much noise and counterfactual fragility we are willing to tolerate. This cutoff is not discovered in nature; it is set by observers evaluating the system.
  2.  **Observer-Relativity:** If implementation is partly interpretive, then moral status carries a degree of observer-relativity. Different interpreters might set different tolerance thresholds for approximation or counterfactual robustness. This challenges moral realism, suggesting that the boundary of the moral community is not a mind-independent fact.
  3.  **Vagueness:** We lose sharp boundaries. There is no precise point where System B becomes a moral patient. Moral status becomes a matter of degree, dependent on how well the system's causal structure approximates the target computation within a relevant context.

  **Conclusion:**
  While it is tempting to insist that moral status must be intrinsic to a system's causal structure (favoring System A), the requirement of counterfactual robustness makes moral status dependent on non-actual worlds, which is ethically bizarre. The alternative—accepting that implementation involves idealization—allows us to grant moral status to System B based on its actual capacities. The cost is admitting that our moral ontology is not purely discovered but is partly constructed through the interpretive frameworks we use to map physics to computation. We must accept that moral status is intrinsic to the system *under an idealization*, rather than intrinsic to the raw physical system alone.
