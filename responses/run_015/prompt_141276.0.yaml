  Here is the rule Priya is using, the verdict on the GPU budget, and the test case to confirm it.

  ### The Rule: Competitive Lock-In

  Priya's definition of "Moloch" is not just about waste or bad incentives; it is specifically about a **multi-party competitive trap where unilateral disarmament is punished.**

  For a situation to be labeled "Moloch" by Priya, it must meet three criteria:
  1.  **Relative Incentives:** Actors are competing for relative standing or a zero-sum slice of resources (e.g., promo scope, budget share, industry signaling), not just depleting a shared pool.
  2.  **Unilateral Punishment:** If a single actor stops the harmful behavior while others continue, that actor loses out (e.g., looks smaller for promos, gets less budget, loses candidates).
  3.  **Coordination Failure:** The actors cannot easily negotiate a stop among themselves (due to group size, trust issues, or structural barriers).

  If a situation is solvable by a single authority figure ("Slack message"), solvable by direct negotiation ("two teams can talk"), safe to defect from ("nothing bad happened"), or results in a net positive ("better service"), it is **not Moloch**. Crucially, if it is merely a "commons" problem (shared resource depletion without relative competition), she excludes it from the label.

  ### The Verdict: GPU Budget

  **Yes, this is Moloch.**

  Here is why it fits Priya's rule perfectly:
  *   **Relative Incentives:** The budget is capped and allocated by *proportion*. This makes it zero-sum. If you burn less, you don't just save money; you literally shrink your share of the pie relative to other teams.
  *   **Unilateral Punishment:** If your team stops running pointless jobs but others don't, your usage numbers drop, and your budget allocation for next quarter gets cut. You are punished for being honest.
  *   **Coordination Failure:** "Everyone knows everyone is doing it." With many teams involved, forming a pact to stop is fragile and hard to enforce. The platform group (authority) has explicitly refused to fix it mid-year, so there is no easy top-down exit.
  *   **Net Negative:** Everyone hates it, and compute is wasted. No "better service" comes out the other end.

  This is a classic race to the bottom driven by relative metrics, exactly like the promo packet padding and the duplicate libraries.

