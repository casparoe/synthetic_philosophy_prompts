          *   Option 4 (Causal Mediation of Content): This is epistemological. If knowledge doesn't require causation, the paradox vanishes. This seems very upstream. If successful, options 2 and 3 become less urgent.
          *   Option 2 (First-Person Authority): This is a concession. It saves the view but costs intuitions. It's downstream of whether knowledge *requires* causation.
