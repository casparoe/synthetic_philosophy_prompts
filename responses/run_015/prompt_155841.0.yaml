answer: |-
  ### Teaching Plan: Anattā for Non-Specialists

  #### I. Dependency Order (The Conceptual Prerequisite)
  Before introducing *anattā*, you must establish the distinction between **Existence** and **Ownership**.
  *   **The Prerequisite:** The group must accept that while experience (pain, thought, memory) undeniably *occurs*, the claim that these experiences *belong* to someone is a secondary addition, not a primary fact.
  *   **Why:** Without this distinction, *anattā* sounds like a denial of phenomenological reality ("I don't feel pain"). With it, *anattā* becomes a critique of the *relationship* to reality ("Pain is felt, but the 'I' who owns it is an assumption").
  *   **Implementation:** Begin by asking them to locate the "owner" of a thought *before* the thought arises. If they cannot find the owner prior to the event, establish that the sense of ownership is a retrospective label, not a pre-existing container.

  #### II. The Carrying Example
  **The Case:** *The Legacy Brand Account.*
  Describe a corporate or public-facing social media account (e.g., a legacy tech support handle or a memorialized public figure's page) that has been active for 15 years.
  *   **The Reality:** It has a consistent voice, memory of past interactions, and perceived intentions. Users feel they "know" the entity behind it.
  *   **The Mechanism:** In reality, access credentials have been passed through six different community managers, two marketing agencies, and now an automated script. There is no single continuous consciousness, no permanent "author," yet the "personality" persists and functions.
  *   **Why this works:** It mirrors the five aggregates (*khandhas*): form (server/code), feeling (user engagement), perception (brand identity), formations (posting schedules), consciousness (algorithmic response). It shows continuity without a controller.

  **Why Avoid the Standard Analogies:**
  1.  **The Chariot (Milinda Pañha):** Avoid this. It relies on mereological reductionism (parts vs. whole). Modern non-specialists already accept they are biological machines (parts); this analogy risks reinforcing materialism ("I am just my brain parts") rather than revealing the *process* of identification.
  2.  **The Flame (Passing from lamp to lamp):** Avoid this. It is too metaphysical. For a modern audience, it invites confusion about "soul transfer" or rebirth mechanics, which distracts from the immediate psychological point of *anattā*. It suggests a "substance" (fire) is moving, whereas the Digital Account emphasizes *pattern* and *narrative* without substance.

  #### III. Misconception Mapping & Interruption Points
  Map the likely slides into error and intervene at these specific junctures:

  1.  **Misconception:** *Nihilism ("I don't exist.")*
      *   **When it arises:** Immediately after stating "There is no self."
      *   **Intervention Point:** **Before** analyzing the example.
      *   **Correction:** Clarify that *anattā* denies a *permanent controller*, not a *conventional person*. Use the "Legacy Account" to show the account is real and functions, even if the "original owner" is a fiction. "The profile exists; the myth of the single author is what is false."

  2.  **Misconception:** *Moral Fatalism ("If I am not real, my choices don't matter.")*
      *   **When it arises:** During the discussion of agency and control.
      *   **Intervention Point:** **During** the analysis of the "Community Managers" in the example.
      *   **Correction:** Point out that the managers still had to do the work. Cause and effect (*kamma*) operate regardless of who claims credit. "The tweet still goes out; the consequence still lands. Removing the 'author' does not stop the law of cause and effect."

  3.  **Misconception:** *Dissociation ("My feelings are an illusion.")*
      *   **When it arises:** When discussing pain or emotion.
      *   **Intervention Point:** **After** the example, during the application to personal experience.
      *   **Correction:** Distinguish between the *sensation* (real) and the *appropriation* (fabricated). "The pain is real. The story that 'I am the victim of this pain' is the addition. *Anattā* removes the story, not the sensation."

  #### IV. Closing Question
  Do not ask for intellectual summary. Ask for a phenomenological check.

  **The Question:** *"When you imagine dropping the claim of ownership over your experience, do you feel a loss of **function**, or only a loss of **burden**?"*

  *   **Rationale:** If they answer "loss of function," they are still unsettled and clinging to the self as a necessary operator (Misconception #2). If they answer "loss of burden," they have glimpsed the soteriological purpose of *anattā* (liberation from weight).

  #### V. Explicit Exclusions
  To maintain coherence for a single session with non-specialists, explicitly state that you are **not** covering:

  1.  **Abhidhamma Momentariness:** Do not discuss the mind-moment (*citta*) arising and passing in microseconds. This creates a hyper-analytical freeze and suggests the self is "too fast to see" rather than "inherently absent."
  2.  **Madhyamaka Emptiness (*Śūnyatā*):** Do not discuss the emptiness of phenomena themselves. Stick to the emptiness of *self* within phenomena. Introducing "everything is empty" too early leads to nihilism.
  3.  **Rebirth Mechanics:** Do not attempt to explain *what* rebirths if there is no self. This is a "right view" topic for advanced study, not a "入门" (entry) topic for *anattā*. Keep the focus on *this* life, *this* mind.

  **Instruction to Teacher:** State these exclusions at the very beginning. "Today we are looking at the psychology of ownership, not the metaphysics of time or rebirth." This creates a safe container for the inquiry.
