answer: |-
  **MEMORANDUM**

  **TO:** Student Council Rules Committee
  **FROM:** Rules Committee Member
  **SUBJECT:** Determination of Vacancy Regarding Council Member Maya
  **DATE:** October 24, 2023

  **Background**
  Council Member Maya submitted a letter stating "I hereby resign from the student council effective immediately" to the school newspaper, where it was published on Friday. She did not deliver this letter to the Council. Maya now claims the text was a draft meant for writing practice and not an official resignation. The Council must determine if her seat is vacant under the bylaws, which state a member "may resign at any time by notifying the council in writing."

  **Analysis: Speech-Act Theory and Felicity Conditions**
  This case turns on whether the published letter constitutes a valid performative utterance. According to J.L. Austin's theory of speech acts, phrases like "I hereby resign" are not descriptions of reality but actions that *create* reality (resignation). However, for such an act to be successful ("happy"), it must meet specific "felicity conditions."

  Two conditions are critical here. First, Condition A.2 requires that the particular persons and circumstances be appropriate for the invocation of the procedure. Our bylaws establish the conventional procedure: notification must be directed to the *Council*. By addressing the newspaper, Maya invoked the procedure in the wrong context, resulting in what Austin calls a "misfire"—the act is null and void because the convention was not followed.

  Second, Condition Γ.1 requires that the participant possess the corresponding thoughts or feelings (intent). Maya's claim that this was a draft suggests an absence of intent. While insincerity alone is often an "abuse" (where the act happens but is hollow), the failure to address the correct audience (the Council) makes this a procedural misfire. The words were inert because they were not spoken into the conventional structure required to make them work. Treating the newspaper as a proxy for the Council would dissolve the boundary between public expression and official procedure, rendering the bylaw's specific notification requirement meaningless.

  **Recommendation**
  The Committee recommends ruling the seat **not vacant**. The resignation misfired because the conventional procedure (notifying the Council) was not executed. However, to address the public confusion caused by the publication, we recommend Maya be required to submit a formal written clarification to the Council within 48 hours confirming her continued membership. If she fails to do so, the Council may revisit the question of intent, but under current rules, no valid resignation occurred.

