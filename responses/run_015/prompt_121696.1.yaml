answer: |-
  The volunteer fire company has fifteen members. Twelve are veterans, all men; three are new recruits, all women. During downtime, the veterans trade stories about "the old days," joke about "wives waiting at home," and praise "natural strength." No names are invoked; no threats are made; no single comment would qualify as harassment under any existing rule. Yet, over six months, the recruits stop coming. They cite "not fitting in." The company loses capacity. The veterans did not coordinate this; no one intended the exodus. Each remark was harmless in isolation, but the cumulative weight made the station unlivable for the minority. They could speak back, but correcting every insinuation requires exhausting labor against a twelve-to-three asymmetry. They leave. The company's capability is set back.

  Mill's principle asks: Did Remark X set back the interests of Recruit Y? The answer is no. Did Remark Z? No. The machinery exonerates every individual act because no single act crosses the threshold of harm. The principle stops at the boundary of the transaction. It cannot sum the transactions into an environment. The harm exists only in the aggregate, but the test applies only to the atom. Thus, the principle is silent. It sees fifteen harmless acts and one departed group, but no causal link it is built to recognize. The Millian remedy—answer speech with more speech—is structurally unavailable. It is not banned by authority, but by the exhaustion of being permanently outnumbered. The cost of reply exceeds the capacity of the minority to pay it.

  The load-bearing feature is decentralized accumulation.
  Variant 1 (Author): If one Captain declared, "Women don't belong here," the case collapses. That is coercion or intimidation. Mill's principle handles direct authority misuse because the act itself carries the threat.
  Variant 2 (Counter-speech): If the recruits were twelve and veterans three, they could joke back. The atmosphere would shift. Mill's remedy works when power is symmetrical.
  The gap is genuine only when causation is smudged by numbers and no single author exists. It is not an ordinary case with smudged causation; it is a structural failure invisible to an act-based lens.

  A committed Millian replies: You have quietly stretched "interest" to cover "comfort." The recruits chose to leave; the harm is self-inflicted, not imposed. To regulate this is to give a veto to the sensitive over the culture of the majority. Who defines "unlivable"? Today it protects women; tomorrow it protects conservatives from "woke" atmospheres. Any rule sensitive to aggregate effects prohibits vastly more than you want. It invites the tyranny of the prevailing opinion to police tone, which is exactly what Mill warned against. You risk curing exclusion by empowering censorship. The doctrine would be captured by whoever holds the power to define "harmful atmosphere," turning the harm principle into a tool for conformity.

  The problem is not the principle, but the unit of analysis. Mill tests acts; this problem is structural. We need a second test alongside it: one that asks about the health of the practice, not just the permissibility of the utterance. This wouldn't necessarily ban speech but might mandate structural remedies (e.g., recruitment quotas, moderated forums) to restore symmetry so that counter-speech becomes possible. I lean toward needing this supplement. Mill's act-individualism cannot see systemic drift. I would change my mind if every structural remedy inevitably required suppressing specific viewpoints rather than balancing power, but here the imbalance itself silences the market of ideas Mill wants to protect.
