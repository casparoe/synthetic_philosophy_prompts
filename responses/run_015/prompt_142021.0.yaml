prompt: |-
  I sit on the Clinical Ethics Advisory Panel of a large teaching hospital trust. We advise on individual cases rather than set policy, and we keep the ethical question separate from the legal one: in our jurisdiction there is no statute on assisted dying and no appellate decision on deactivating implanted devices, so there is nothing for us to hide behind. I would like your help with a case on next week's list. I am less interested in the bottom line than in what our own track record already commits us to.

  Here are our determinations so far. In each one the patient was competent or acting through a valid advance decision, and the clinical team agreed that the intervention in question was what was keeping the patient alive.

  1. Withdrawal of invasive ventilation in advanced motor neurone disease, requested in advance. Approved. Reason recorded: the ventilator opposed but did not cure the disease, and ceasing to oppose it lets the disease take its course.
  2. Not starting a second course of haemodialysis in end-stage renal failure with metastatic cancer. Approved, and the panel expressly held that withholding and withdrawal are on a par.
  3. Withdrawal of veno-arterial extracorporeal membrane oxygenation — a machine outside the body doing the continuous work of both heart and lungs — in refractory cardiogenic shock judged unrecoverable. Approved.
  4. Deactivation of an implanted defibrillator in end-stage heart failure with repeated shocks. Approved. It was internal, but it stood ready to rescue from intermittent arrhythmias rather than sustaining circulation continuously.
  5. Withdrawal of clinically assisted nutrition and hydration in a minimally conscious state, under a valid advance decision. Approved by majority; the dissent held that feeding is care rather than treatment, and the majority rejected that.
  6. Palliative sedation to unconsciousness for refractory breathlessness, with life-shortening foreseen but not the object. Approved.
  7. Lethal injection at the competent, settled request of a patient with unbearable suffering. Refused. The minute says the difference between 6 and 7 lies in what the clinician is aiming at, not in any act-omission line.
  8. A patient with a do-not-attempt-resuscitation order whose ventilator tubing came adrift; the nurse present did not reattach it. The panel held that she had done nothing it could object to: not reattaching was of a piece with not having started.

  The new case. Mr A has a total artificial heart: his own ventricles were excised and replaced by an implanted rotary pump driven through a driveline by an external controller and battery pack. His dependence is total — with the pump stopped he loses consciousness within seconds and dies within minutes. He is otherwise not dying: renal and hepatic function are normal, there is no malignancy, he might live for years. He is competent, the request has been stable for weeks, and psychiatry has no doubts. His reasons are recurrent driveline infections and the life of being tethered to batteries; his team disagree among themselves about whether the infections are manageable with antibiotics and revision surgery. Two questions: (a) he asks that the controller be switched off — a deliberate procedure with a checklist, not a matter of walking away; (b) should we refuse (a), he asks that the team simply not connect a fresh pack when the current one is exhausted, letting it run down with him sedated.

  What I want from you:

  1. The rules or principles that fit all eight precedents — the act-omission rule I have gestured at, the intended-foreseen rule that our minute on 6 and 7 gestures at, and anything else you can find, including rules I have not thought of. For each, say what it predicts about (a) and about (b).
  2. Which precedent is the closest analogue — 3, because it concerns continuous replacement of cardiac function, or 4, because it concerns an internal device deliberately disabled — and whether that analogy is real or breaks on the fact that his own ventricles are gone, so that there is no underlying disease left to take its course.
  3. Your best prediction of what the panel will do, and separately what it should do if it wants to be consistent with itself, with your reasons. If our precedents genuinely underdetermine the case, say so, and tell me in one sentence each what principle we would be adopting under each of the live combinations of answers to (a) and (b).
  4. A further case that would separate the rules which agree here. My own candidate: a patient with the same device whose driveline is so badly infected that the power supply must be removed to cure the infection, where death is foreseen but the object is treating the sepsis. Does that actually discriminate between the candidate rules, or do they collapse back together on it? If it does not discriminate, propose one that does.
  5. Say plainly if the question as I have put it is malformed: if the act-omission line is doing no real work here, if (a) and (b) differ only in a way that should not matter morally, if our eight determinations are jointly inconsistent, or if the case really turns on whether the infections make the device burdensome rather than on any of this talk about mechanisms. Mark which steps you are confident about and where you are guessing at our institutional temperament, and do not manufacture a verdict in order to be helpful. I am asking about the shape of our own reasoning, not for a survey of what philosophers have said about killing and letting die.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a Clinical Ethics Advisory Panel (CEAP) at a large teaching hospital trust.
      *   **Context:** Advises on individual cases, keeps ethics separate from law (no statute on assisted dying, no appellate decision on device deactivation).
      *   **Task:** Analyze a new case (Mr. A with a Total Artificial Heart - TAH) based on eight specific precedents provided by the panel.
      *   **Specific Questions:**
          1.  Extract rules/principles from the 8 precedents and apply them to Mr. A's requests (a) and (b).
          2.  Identify the closest analogue (Case 3 vs. Case 4) and test the analogy.
          3.  Predict the panel's decision vs. what consistency demands. If underdetermined, state the principles adopted for each outcome combination.
          4.  Propose/test a further case to discriminate between rules (User suggests infection treatment case).
          5.  Critique the question itself (is it malformed? Is act-omission doing work? Are precedents inconsistent?).
      *   **Constraints:** Do not manufacture a verdict. Be plain about confidence vs. guessing institutional temperament. Focus on the *shape of the panel's reasoning*, not external philosophy.

  2.  **Analyze the Precedents (The "Data"):**
      *   *Case 1 (Ventilation, MND):* Withdrawal approved. Reason: Opposes disease, doesn't cure. Stopping lets disease take course. (Principle: Allowing natural death from underlying pathology).
      *   *Case 2 (Dialysis, Cancer):* Withholding approved. Reason: Withholding = Withdrawal. (Principle: Moral equivalence of acts/omissions in this context).
      *   *Case 3 (VA-ECMO, Shock):* Withdrawal approved. Reason: Machine outside body, continuous work of heart/lungs, unrecoverable. (Principle: External life support can be stopped even if continuous).
      *   *Case 4 (ICD, Heart Failure):* Deactivation approved. Reason: Internal, but intermittent rescue, not continuous circulation. (Principle: Internal devices can be deactivated if they prevent natural death from arrhythmia).
      *   *Case 5 (CANH, MCS):* Withdrawal approved (majority). Dissent: Feeding is care. Majority: It's treatment. (Principle: Artificial nutrition is medical treatment, not basic care).
      *   *Case 6 (Sedation):* Approved. Reason: Life-shortening foreseen, not intended. (Principle: Doctrine of Double Effect - DDE).
      *   *Case 7 (Lethal Injection):* Refused. Reason: Difference from Case 6 is *aim* (intent), not act-omission. (Principle: Intentional killing is prohibited, even if requested).
      *   *Case 8 (DNACPR, Tube Adrift):* Non-reattachment approved. Reason: Of a piece with not starting. (Principle: Omission to restore treatment = withholding).

      *   *Synthesis of Panel Logic:*
          *   **Intent Matters:** Case 6 vs. 7 is the strongest signal. If the *aim* is death, it's refused. If the *aim* is relieving burden/symptoms and death is foreseen, it's allowed.
          *   **Treatment vs. Disease:** Case 1 & 3 suggest treatment must be "opposing" a disease process. If treatment stops, disease kills.
          *   **Internal vs. External:** Case 3 (External ECMO) vs. Case 4 (Internal ICD). Both allowed. Case 5 (Internal CANH) allowed. So, "internal" isn't a hard barrier, but Case 4 distinguishes based on *function* (intermittent vs. continuous).
          *   **Act vs. Omission:** Case 2 & 8 say they are morally equivalent *if* the underlying justification (futility/burden) holds. However, Case 7 (Act) was refused while Case 6 (Act with different intent) was allowed. So Act/Omission isn't the *primary* divider; Intent is.
          *   **Underlying Pathology:** Case 1, 2, 3, 4, 5 all involve an underlying fatal condition (MND, Cancer, Shock, Heart Failure, Brain Injury). Case 7 (Lethal Injection) implies no underlying fatal condition necessitating the act other than the patient's wish.

  3.  **Analyze Mr. A's Case:**
      *   **Device:** Total Artificial Heart (TAH). Ventricles *excised*.
      *   **Dependence:** Total. Stop pump = death in minutes.
      *   **Condition:** "Otherwise not dying." Renal/hepatic normal. No malignancy. Might live years.
      *   **Reason:** Burden (infections, tethering).
      *   **Request (a):** Switch off controller (Active deactivation).
      *   **Request (b):** Do not replace battery (Omission/Withholding).
      *   **Key Tension:** Unlike Cases 1-5, there is no underlying fatal disease waiting to take over. The device *is* the life. Stopping it doesn't let a disease kill; it stops the life support that *is* the life. This looks more like Case 7 (Lethal Injection) in terms of causality, but looks like Cases 1-4 in terms of "turning off a machine."

  4.  **Drafting the Response - Section by Section:**

      *   **1. Rules/Principles & Predictions:**
          *   *Rule 1: The Intent Principle (DDE).* Derived from 6 vs 7. Aim must not be death.
              *   (a) & (b): If the aim is to end life to end burden -> Refuse. If aim is to stop burdening treatment -> Approve.
          *   *Rule 2: The Underlying Pathology Principle.* Derived from 1, 3, 4. Treatment must oppose a disease; stopping lets disease kill.
              *   (a) & (b): Mr. A has no underlying fatal pathology. The device replaces anatomy. Stopping it causes death directly, not via disease. -> Predicts Refusal.
          *   *Rule 3: The Equivalence Principle.* Derived from 2 & 8. Withholding = Withdrawal.
              *   (a) vs (b): Morally equivalent. If one is allowed, both should be.
          *   *Rule 4: The Burden/Benefit Principle.* Derived from 1, 4, 5. Treatment can be stopped if burdens outweigh benefits.
              *   (a) & (b): Infections/tethering are burdens. But is "life" a burden? -> Ambiguous.

      *   **2. Closest Analogue:**
          *   Case 3 (ECMO) looks similar (continuous pump). But ECMO was for *unrecoverable shock*. Mr. A is recoverable/stable.
          *   Case 4 (ICD) looks similar (internal device). But ICD was intermittent rescue. TAH is continuous life.
          *   *Crucial Distinction:* In 1-5, the body *could* fail without the machine because of disease. In Mr. A, the body *cannot* function because anatomy was removed. The machine isn't treating a disease; it *is* the organ.
          *   *Verdict:* Analogy breaks. This is closer to Case 7 (creating death) than 1-5 (allowing death).

      *   **3. Prediction vs. Consistency:**
          *   *Prediction:* Panel will likely Refuse (a) and (b). Why? Because "Otherwise not dying" triggers the Case 7 intuition (intentional killing) despite the Case 3/4 aesthetics (turning off a machine). The "Underlying Pathology" rule is the hidden linchpin of 1-5.
          *   *Consistency:* If they approve, they must abandon the "Underlying Pathology" constraint and rely solely on "Burdensome Treatment." If they refuse, they maintain consistency with Case 7's intent/causality logic.
          *   *Underdetermination:* If they approve (a) but refuse (b), they violate Rule 3 (Equivalence). If they approve both, they expand the definition of "treatment" to include "replacement of healthy anatomy."

      *   **4. Further Case (Discriminator):**
          *   User's suggestion: Remove power to cure infection, death foreseen.
          *   *Analysis:* This tests Intent (DDE). Object = cure infection. Foreseen = death.
          *   *Does it discriminate?* Yes. It separates Rule 1 (Intent) from Rule 2 (Pathology). Under Rule 1, it's allowed (like Case 6). Under Rule 2, it's still problematic (no underlying fatal disease).
          *   *Better Discriminator:* A patient with a TAH who develops a *new* fatal cancer. Request to turn off TAH to avoid dying of cancer while on TAH. This isolates the "Underlying Pathology" rule.

      *   **5. Critique of the Question/Formulation:**
          *   *Act/Omission:* It is doing no work here. Case 2 & 8 establish equivalence. (a) and (b) should stand or fall together.
          *   *Inconsistency:* The precedents are consistent *if* read as requiring an underlying fatal condition. If read merely as "patient can stop any machine," they contradict Case 7.
          *   *Real Issue:* It turns on whether the TAH is "treatment" or "anatomy." If it's anatomy, removing it is killing. If it's treatment, stopping it is allowing death.
          *   *Confidence:* High on the logical structure. Low on the specific verdict without knowing the panel's private view on "anatomical replacement."

  5.  **Refining the Output (Self-Correction/Polishing):**
      *   *Tone:* Professional, analytical, respectful of the panel's autonomy. Avoid prescriptive moralizing.
      *   *Focus:* Stick strictly to the provided 8 cases. Do not import external bioethics literature (as requested).
      *   *Clarity:* Ensure the distinction between (a) and (b) is handled via the Equivalence Principle.
      *   *The "Underlying Pathology" Insight:* This is the critical insight. Cases 1, 2, 3, 4, 5 all involve a body that *would die soon anyway* due to pathology. Mr. A's body would live years. This is the pivot point.
      *   *Case 7 Comparison:* Case 7 is the strongest constraint. Lethal injection refused because the *aim* was death. In Mr. A's case, if the aim is to end life because life is burdensome, is that distinguishable from Case 7? Yes, if framed as "stopping treatment." No, if framed as "ending life."
      *   *Formatting:* Use the numbered structure requested.

  6.  **Final Review against Constraints:**
      *   Did I answer all 5 points? Yes.
      *   Did I avoid external philosophy? Yes, stuck to the 8 cases.
      *   Did I mark confidence levels? Yes.
      *   Did I address the "malformed" aspect? Yes.

      *(Self-Correction during drafting)*: I need to be careful about Case 4. The panel approved deactivating an *internal* device. Mr. A's pump is implanted. The driveline is percutaneous. The controller is external. Case 4 said "internal... but stood ready to rescue... rather than sustaining circulation continuously." Mr. A's device *sustains circulation continuously*. This distinguishes 4 from Mr. A. Case 3 (ECMO) sustained circulation continuously but was *external*. Mr. A is *internal* pump + *external* drive. It's a hybrid. The key distinction remains the "Underlying Pathology."

      *(Refining the "Further Case")*: The user's proposed case (remove power to cure sepsis) is actually very strong for testing Double Effect vs. Causality. I should validate that but perhaps offer the "New Fatal Pathology" case as a sharper tool for the "Underlying Pathology" rule. Actually, the user's case is better for testing *Intent*. I will analyze the user's case first, then offer the "New Pathology" case if the user's doesn't fully separate the rules.
      *Wait, looking closer at User's Case:* "Power supply must be removed to cure infection, where death is foreseen but object is treating sepsis."
      *Rule 1 (Intent):* Allows it (like Case 6).
      *Rule 2 (Pathology):* Refuses it (No underlying fatal disease, device *is* life).
      *Rule 3 (Equivalence):* N/A (This is an active removal for a different end).
      *Does it discriminate?* Yes, it separates Intent from Pathology. I will confirm this.

      *(Final check on "Malformed"):* The Act/Omission distinction is definitely doing no work based on Cases 2 & 8. I should state that confidently.

      *(Institutional Temperament):* The panel seems cautious (refused lethal injection), but permissive on withdrawal (Cases 1, 3, 5). They value consistency (Case 2). They likely prioritize the "Intent" boundary (6 vs 7) above all.

