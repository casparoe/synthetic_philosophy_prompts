answer: |-
  By minute fifty, your classmates should be able to do two things: first, diagnose *which* fairness metric is morally salient in a new context by identifying who bears the cost of specific error types (false positives vs. false negatives), rather than treating all three criteria as equally obligatory; second, identify when the impossibility theorem does not apply because the system either allows for uncertainty (a third output) or because the decisions themselves alter the underlying base rates. They must leave knowing that the math does not forbid fairness, it forbids *simultaneity* under specific static assumptions, and that breaking those assumptions changes the moral landscape.

  ### 1. The Order of Pieces
  You must establish the algebraic dependency before you define the moral conflict. 
  1.  **Board Foundation:** Draw a single confusion matrix structure but split it into two side-by-side tables (Group A and Group B). Populate them with generic variables ($TP, FP, FN, TN$) rather than numbers. *Dependency:* You cannot define the metrics until the relationship between Base Rates ($P(Y=1|A)$) and the matrix cells is visible.
  2.  **Base Rates:** Explicitly write the base rate formula for each group on the board and stipulate they are unequal ($P(Y=1|A) \neq P(Y=1|B)$). *Dependency:* The impossibility result vanishes if base rates are equal, so this inequality must be established before any fairness criterion is written.
  3.  **The Criteria:** Define Calibration, Equalized Odds, and Predictive Parity using the variables on the board. *Dependency:* Show algebraically that if Base Rates differ, satisfying Equalized Odds forces Predictive Parity to diverge.
  4.  **The Conflict:** Only after the algebra is visible do you introduce the moral weight of the errors. *Dependency:* The choice of metric depends on the cost structure, which cannot be evaluated until the metrics are defined.

  ### 2. The Single Case
  **Case:** **Emergency Triage for a Treatable Respiratory Condition.**
  *   **What it contains:** Two population groups (e.g., from different neighborhoods) arriving at an ER with similar symptoms. Group A has a higher prevalence of the condition due to environmental factors (higher base rate). The test accuracy is identical for both groups. The treatment is effective for everyone.
  *   **What it avoids:** It avoids the "contaminated label" problem of pretrial risk (where recidivism is partly a function of policing) and the "self-fulfilling prophecy" problem of lending (where denial causes default).
  *   **Why skip pretrial/lending:** Pretrial risk confuses the students because the outcome $Y$ is arguably unjust itself, distracting from the statistical incompatibility. Lending examples often trigger immediate intuition about feedback loops, which undermines the lesson about the *static* impossibility theorem. You need a case where the static assumption is plausible enough to hold for the first 40 minutes, so you can dismantle it deliberately at the end.

  ### 3. Four Misconceptions to Defuse
  1.  **"Fairness through Unawareness" (Dropping group membership dissolves the conflict):**
      *   *Defuse at Minute 5 (Board Foundation).* Show that even if the algorithm doesn't "see" group ID, if the base rates differ, the error rates will differ. The math operates on the joint distribution, not the model's internal awareness.
  2.  **"A Better Model Would Satisfy All Three" (Techno-optimism):**
      *   *Defuse at Minute 15 (The Criteria).* When you show the algebraic identity, point out that even with perfect prediction (zero error), the criteria converge, but with *any* noise and unequal base rates, the conflict is structural, not a result of poor engineering.
  3.  **"This is an Accuracy-vs-Fairness Trade-off" (The Efficiency Fallacy):**
      *   *Defuse at Minute 30 (The Conflict).* Replace this with the correct framing: it is a **Fairness-vs-Fairness** trade-off. You are choosing which group gets protected from which error (false positives vs. false negatives), not sacrificing accuracy for equity.
  4.  **"The Base Rates are Fixed Facts of Nature" (Static Determinism):**
      *   *Defuse at Minute 40 (The Key Insight).* This is the setup for your final point. Students often treat base rates as immutable. You must challenge this to open the door to dynamic systems where interventions change the base rates.

  ### 4. The Key Insight: Fixed Joint Distribution
  Place this in the final 10 minutes (Minute 40–50). Explicitly state: *"The impossibility theorem you memorized applies only to a binary decision rule audited on a fixed joint distribution."*
  *   **Variation 1 (Third Output):** Introduce a "Refer to Human Specialist" option.
      *   *What carries over:* The tension between error types remains for the automated decisions.
      *   *What does not:* The strict impossibility dissolves because you can route uncertain cases to humans, effectively changing the conditional probabilities of the automated subset.
  *   **Variation 2 (Reshaping Distribution):** Discuss performative prediction (e.g., if denying treatment worsens the health outcome long-term).
      *   *What carries over:* The need to monitor calibration remains.
      *   *What does not:* The base rates are no longer fixed parameters; they are variables influenced by the policy. If the policy successfully treats Group A, their base rate of severe illness drops, potentially aligning the groups over time and resolving the conflict dynamically.

  ### 5. Final Board Question & Declinations
  **Question to leave on the board:**
  *"If the cost of a False Negative is death, and the cost of a False Positive is financial waste, which compatibility constraint must we break, and does that break happen automatically if we optimize for utility?"*
  (This forces them to link the moral cost to the specific metric—Equalized Odds vs. Predictive Parity—rather than reciting definitions.)

  **Two topics to openly decline:**
  1.  **Individual/Causal Fairness:** "We are not discussing counterfactuals or individual causal paths today; that requires a different structural model than the conditional probabilities we analyzed."
  2.  **Optimization Algorithms:** "We are not discussing how to constrain gradient descent to satisfy these metrics; we are discussing which metric you should constrain for before you code."
