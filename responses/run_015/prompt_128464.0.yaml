answer: |-
  There is no single, canonical term in the philosophical lexicon that captures this exact temporal toggle. You have correctly identified a gap between **epistemic contextualism** (which deals with how standards shift with context) and **illocutionary logic** (which deals with the force of an utterance).

  The closest established concepts are **Modal Equivocation** (shifting the modality of a claim, e.g., from "is" to "could be") and the **Belief/Acceptance Distinction** (van Fraassen/Cohen), where one *accepts* a proposition for inquiry without *believing* it true. However, these describe static states. Your pattern describes a dynamic, opportunistic oscillation between them.

  Structurally, this is a variant of the **Motte-and-Bailey**, but you are right to distinguish it. In a standard Motte-and-Bailey, the *propositional content* shifts (e.g., "Western Civ is superior" $\to$ "Western Civ has value"). In your pattern, the *content* remains identical, but the **illocutionary commitment** shifts (e.g., "X is true" $\to$ "X is a tool").

  If we are coining a term to carve this out precisely, the most accurate label is **Epistemic Modal Sliding**.

  Here is the carving you requested, distinguishing it from adjacent phenomena via boundary conditions and examples.

  ### The Concept: Epistemic Modal Sliding

  **Definition:** A rhetorical maneuver where a speaker asserts proposition $P$ with full epistemic commitment (fact-claim) to gain argumentative leverage, but retroactively downgrades $P$ to methodological suspension (heuristic/frame) when challenged, only to re-upgrade $P$ to fact-claim status in future contexts without acknowledging the prior suspension.

  **The Mechanism:** It exploits the gap between the **Norm of Assertion** (you should only assert what you know) and the **Norm of Inquiry** (you may assume things to see where they lead). The speaker claims the authority of the former while retaining the immunity of the latter.

  ---

  ### Boundary Conditions (The Carving)

  To distinguish this from legitimate intellectual practices, we apply three tests: **Transparency**, **Reification**, and **Defensiveness**.

  #### 1. Vs. Legitimate Interdisciplinary Borrowing
  *   **The Boundary:** **Transparency of Status.**
  *   **Legitimate:** When borrowing a premise from another field (e.g., a philosopher using a physics model), the speaker explicitly flags the status. "For the sake of this argument, let's assume the Standard Model holds..." or "Working within the framework of X..."
  *   **Modal Sliding:** The status is unmarked during the initial assertion. The "provisional" tag is only applied *after* resistance is encountered.
  *   **Example:**
      *   *Legitimate:* "If we accept the Rational Actor hypothesis, then policy Y follows. Note, this is a contested economic assumption."
      *   *Sliding:* "People maximize utility, so policy Y fails." (When challenged: "It's just an economic model." Later: "Since people maximize utility, policy Z is also doomed.")

  #### 2. Vs. Strategic Ambiguity
  *   **The Boundary:** **Precision of Content vs. Force.**
  *   **Strategic Ambiguity:** The *content* of the claim is left vague so it can be interpreted multiple ways (e.g., "We need change").
  *   **Modal Sliding:** The *content* is precise and specific ($X$ is the case). The ambiguity lies entirely in the **assertoric force** (is this a fact or a tool?).
  *   **Example:**
      *   *Ambiguity:* "The system is broken." (Broken how? Who broke it?)
      *   *Sliding:* "The patriarchy causes wage gaps." (Specific claim. When asked for causal data: "It's a lens for viewing power." Next week: "The patriarchy causes wage gaps, therefore we need regulation.")

  #### 3. Vs. Ordinary Loose Speech
  *   **The Boundary:** **Re-deployment and Reification.**
  *   **Loose Speech:** We all speak loosely ("It's raining cats and dogs"). We don't typically circle back to use the loose statement as a premise for a rigorous deduction later.
  *   **Modal Sliding:** The claim is **re-solidified**. The speaker uses the "heuristic" claim as a hard premise to support a *new* conclusion ($Y$) in a different context, effectively laundering the provisional claim into established knowledge.
  *   **Example:**
      *   *Loose Speech:* "I'm starving to death." (Nobody uses this later to prove biological starvation.)
      *   *Sliding:* "Freud's drive theory explains this slip." (Challenged: "It's just a hermeneutic." Later: "Because drive theory is correct, we must reject cognitive behavioral approaches.")

  ---

  ### Why This Isn't Just "Changing One's Mind"

  In ordinary belief revision, if I say "$X$ is true" and later realize I was too strong, I say, "I was too confident; $X$ is just likely." I downgrade the claim permanently.

  In **Epistemic Modal Sliding**, the downgrade is **temporary and tactical**. The claim exists in a superposition of "Fact" and "Frame" depending on whether the speaker is *attacking* (using it as a fact) or *defending* (using it as a frame).

  ### Summary of the Carving

  | Feature | Legitimate Borrowing | Strategic Ambiguity | **Epistemic Modal Sliding** |
  | :--- | :--- | :--- | :--- |
  | **Content** | Precise | Vague | **Precise** |
  | **Status Flag** | Explicit upfront | Implicit | **Retroactive / Hidden** |
  | **Response to Pushback** | Clarifies limits | Shifts interpretation | **Downgrades commitment** |
  | **Future Use** | Consistent with limits | Consistent with vagueness | **Re-solidifies as fact** |

  ### The Label

  If you need a term to use in discussion, **Epistemic Modal Sliding** is the most precise. It captures the movement (sliding) between modalities (fact vs. heuristic) within the epistemic domain.

  If you want a term that highlights the rhetorical bad faith, **The Fictionalist Loophole** works well (referencing Vaihinger's "Philosophy of As If," noting that the speaker treats the "As If" as an "Is" whenever convenient).

  **The Diagnostic Question:**
  To catch this in the wild, ask: *"Are you asserting $X$ as a premise for truth, or as a tool for inquiry? If it's a tool, please bracket it so it doesn't support your next truth-claim."* The slider will refuse to bracket it.
