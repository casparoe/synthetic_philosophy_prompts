answer: |-
  You have identified a very real and frustrating rhetorical structure that is pervasive in the quantum foundations literature, particularly among proponents of Copenhagen-style instrumentalism or certain flavors of psi-epistemicism.

  There is no single, canonical Latin name for this specific *bundle* of moves. However, it is not a new logical error; rather, it is a sophisticated composite of three established argumentative strategies woven together. If you are looking for the established philosophical framework that best captures the *structure*, it is a **Motte-and-Bailey Doctrine** fortified by an **Asymmetric Ontological Burden** and protected by an **Immunization Strategy**.

  If you want a label to use in conversation or writing that captures the specific "self-sealing" nature you described, I propose calling it **"The Epistemic Shelter"** or **"Negative Ontological Privilege."**

  Here is the breakdown of why this label fits, how it distinguishes itself from standard fallacies, and where it appears in the literature.

  ### 1. The Core Structure: The Ontological Motte-and-Bailey
  The **Motte-and-Bailey** (coined by Nicholas Shackel) describes a position where someone conflates two distinct claims: one defensible but modest (the Motte) and one controversial but desirable (the Bailey). When challenged, they retreat to the Motte; when safe, they assert the Bailey.

  In your roommate's argument:
  *   **The Bailey (Strong Claim):** "The wavefunction is *definitely not* a real physical object because it lives in $3N$ space." (This makes a positive ontological negation.)
  *   **The Motte (Weak Claim):** "We don't *need* to specify an underlying ontology to do physics; instrumentalism is sufficient." (This is a methodological agnosticism.)

  **The Shift:** When you challenge the Bailey (e.g., "Fiber bundles also live in abstract spaces"), they don't defend the dimensionality claim rigorously. Instead, they retreat to the Motte ("We don't need to reify it anyway"). But when you press the Motte ("So what *is* real?"), they slide back to the Bailey ("Well, $\psi$ certainly isn't, because look at the dimensions").

  This allows them to make the strong claim ($\psi$ is unreal) without accepting the burden of proof that usually accompanies strong ontological claims (specifying what *is* real).

  ### 2. The Mechanism: Asymmetric Ontological Burden
  This is the specific "unfairness" you noticed regarding Bohmian mechanics.
  *   **For the Realist ($\psi$-ontic):** The standard is **Aesthetic/Intuitive Compatibility**. If you propose a 3D ontology (like Bohm), it is judged on "ugliness," "nonlocality," or "excess structure." It must be *pretty* to be accepted.
  *   **For the Anti-Realist ($\psi$-epistemic):** The standard is **Empirical Adequacy Only**. They are not required to produce a competing ontology. The *absence* of a clear 3D alternative is treated not as a failure of their theory, but as evidence that the search for one is misguided.

  This is **Asymmetric Burden of Proof**. The realist must provide a complete, aesthetically pleasing ontology. The anti-realist must only point out flaws in the realist's ontology while offering nothing in return.

  ### 3. The Shield: Immunization Strategy
  In critical rationalism (Hans Albert), an **Immunization Strategy** is a way of protecting a theory from criticism by making it unfalsifiable.
  *   By defining the "real" ontology as "something underlying we don't need to name," the position becomes immune to the question "What is it?"
  *   By defining the wavefunction's dimensionality as "uniquely suspicious" (despite fiber bundles), the position becomes immune to mathematical analogies.
  *   The argument feeds on its own lack of a positive replacement. The gap *is* the defense.

  ### Proposed Name: "The Epistemic Shelter"
  Since you asked for a name if one doesn't exist, I suggest **"The Epistemic Shelter."**
  *   **Why:** It captures the idea that "epistemic" (about knowledge) is being used as a shelter from "ontic" (about reality) commitments.
  *   **Usage:** "You're using the Epistemic Shelter: you're making an ontological negation ($\psi$ isn't real) while hiding behind an epistemic excuse (we don't need to specify what is)."

  Alternatively, **"Negative Ontological Privilege"** highlights that they claim the privilege of denying reality to $\psi$ without the obligation to affirm reality to anything else.

  ### Distinction from Standard Fallacies
  You asked how this differs from Special Pleading or Absence of Evidence.

  **1. Vs. Special Pleading:**
  *   *Special Pleading* is applying a rule to others but not to oneself (e.g., "Fields can live in abstract spaces, but $\psi$ cannot").
  *   *The Epistemic Shelter* is more dynamic. It doesn't just apply a double standard; it **changes the category of the debate** to avoid the standard. When you press the double standard, they say, "Ontology doesn't matter." When you press ontology, they say, "$\psi$ fails ontological tests." Special pleading is static; this is a sliding defense.

  **2. Vs. Argument from Ignorance (Ad Ignorantiam):**
  *   *Argument from Ignorance* says: "X has not been proven true, therefore X is false."
  *   *The Epistemic Shelter* says: "X has not been proven true, therefore X is false, **and** we are not required to propose Y, and the fact that Y is hard to construct proves X is false."
  *   It turns the *underdetermination* of theory by data (usually a reason for humility) into a *weapon* for negative ontological claims.

  ### Context in the Literature
  This pattern is well-recognized by philosophers of physics who argue for wavefunction realism, though they often describe it rather than naming the fallacy.
  *   **David Z. Albert** (in *Wavefunction Realism*) argues that if you take quantum mechanics seriously, you must accept the reality of the $3N$-dimensional configuration space. He explicitly calls out the move of rejecting $\psi$ for dimensionality while accepting other abstract mathematical objects in physics.
  *   **Travis Norsen** (e.g., *"Foundations of Quantum Mechanics"*) discusses how the "configuration space objection" is often a placeholder for a deeper discomfort with nonlocality, masked as a mathematical objection.
  *   **Harrigan & Spekkens (2010)**: In their seminal paper defining the $\psi$-ontic/$\psi$-epistemic distinction, they note that many "epistemic" views rely on a "fragmented" ontology that is never fully specified, precisely to avoid the constraints you are noticing.

  ### Summary for Your Argument
  When you encounter this pattern, you can diagnose it like this:

  > "You are operating inside an **Ontological Motte-and-Bailey**. When I challenge the dimensionality objection, you retreat to Instrumentalism (we don't need an ontology). When I ask for your ontology, you retreat to the Dimensionality Objection ($\psi$ can't be it). You are claiming **Negative Ontological Privilege**: the right to deny reality to the wavefunction based on structural criteria you do not apply to other fields, without accepting the burden of specifying what *does* have reality. The absence of a alternative ontology is being used as a shield rather than acknowledged as a gap."

  This frames it not as a misunderstanding of physics, but as a structural inconsistency in their philosophical stance.
