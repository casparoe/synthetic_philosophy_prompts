  I need advice on something thats been eating at me. Im trying to decide whether to stay at my job where im actually helping people but barely paying rent, or take this corporate gig that'd pay 3x but feels like im just shuffling spreadsheets for people who already have too much. The thing is, neither option feels like its 'the best' in some hidden math - its more like choosing between two totally different lives that dont share a scoreboard. Someone told me that in these kinds of choices you dont find the answer, you build it by committing to one side, which sounds like a fancy way of saying 'do whatever feels right.' Is there actually philosophical backing for the idea that when values dont line up on the same scale you author the reason by picking, or am I just dressing up my indecision?
