answer: |-
  In deliberating this recommendation, I considered and rejected three alternative decision rules. First, a purely needs-based rule was dismissed because reparations are corrective justice, not welfare; tying awards to current poverty conflates redress for a specific wrong with general social safety nets. Second, a rule keyed solely to present-day racial disparity was rejected because it fails to link the remedy to the specific 1922 taking, violating the ordinance's traceability requirement. Third, a strict "but-for" counterfactual test was discarded because historical causality is epistemically inaccessible; requiring proof of exactly where families would be today imposes an impossible burden that would nullify every claim.

  ***

  **TO:** Fairhaven Reparations Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** September 12, 2024
  **SUBJECT:** Recommendation for Final Remediation Plan

  **Recommendation**
  I move that the Commission adopt Proposal A (Cedar Flats Direct Descent Grant) with specific conditions. We must recommend a one-time payment to lineal descendants of displaced owners and tenants, administered by the Cedar Flats Descendants Association in partnership with city staff. Proposal B, while morally compelling as housing policy, fails the ordinance's requirement that harms be "traceable to the taking." A community land trust benefits residents with no ancestral connection to the wrong, diluting the specific acknowledgment of the 1922 dispossession. Reparations must name the victims and the violation; generic community investment obscures both.

  **Eligibility and Evidence**
  Eligibility shall extend to lineal descendants of any individual who owned property or maintained a primary residence in Cedar Flats between 1920 and 1925. Given the incomplete archival record, we must reject strict documentary requirements. Instead, staff shall adopt a "preponderance of evidence" standard that accepts oral history, family bibles, church records, and sworn affidavits alongside municipal documents. The burden of proof must not replicate the exclusion that caused the harm; families with the least archival trace are often those most marginalized by the taking. A Verification Committee, comprising both genealogical experts and Association representatives, shall review ambiguous cases. This ensures the process is rigorous without being impossible.

  **Counterfactuals and Causal Limits**
  Regarding descendants who appear wealthier than a counterfactual estimate would suggest (e.g., the surgeon family), the Commission must reject any reduction or zeroing out of claims. The wrong committed was the violation of property rights and bodily autonomy through forced removal, not merely the infliction of net economic loss. Corrective justice demands restoration of the right violated, not a balancing of ledgers based on speculative life trajectories. A windfall gained elsewhere does not absolve the city of theft. To argue otherwise is to suggest that successful victims deserve less justice, which undermines the moral basis of the program.

  Regarding the Ash Street Ratepayers' Legacy, we must draw a bright line at direct dispossession. The causal chain stops at those whose property interests were condemned or whose tenancy was terminated by the city's action. Secondary economic effects—lost customers for adjacent businesses—are attenuated and open the door to infinite regress. Every commercial disruption in a city ripples outward; if we compensate all downstream economic losers, we transform reparations into general tort litigation. The specific wrong was the eminent domain abuse against Cedar Flats residents, not the broader market shifts that followed.

  **Funding and Suburban Objection**
  The program should be funded via the proposed water utility surcharge. The objection from Ellisburgh, North Rill, and Vinegar Hill rests on a fault-based theory of responsibility (i.e., "we didn't commit the act"). However, public redress is better grounded in a benefit-based principle. The Ash Street water works—the utility from which these suburbs draw service—exists only because the city seized the land. Current ratepayers, regardless of residence or incorporation date, are beneficiaries of the infrastructure built on stolen ground. They inherit the obligation because they inherit the asset. The political community liable for repair is defined by the utility service area, not municipal boundaries drawn decades later.

  **Public Finding**
  Money without acknowledgment is merely settlement; it buys silence rather than restoring dignity. The City Council must pair this payment with a formal public finding. This act performs the work of truth-telling that cash alone cannot achieve. It establishes the historical record for future generations. I propose the Commission adopt the following language for inclusion in the enabling resolution:

  "The City of Fairhaven acknowledges that the 1922 condemnation of Cedar Flats was a moral and legal wrong that inflicted enduring harm on specific families and the broader community. Accordingly, this remediation program serves as a formal recognition of the City's responsibility to repair the consequences of that dispossession."

  **The Strongest Argument Against This Recommendation**
  The most compelling case against this recommendation is the argument for Proposal B (the Community Land Trust). Proponents argue that individual checks are fleeting and potentially divisive, whereas a land trust creates permanent structural change. They contend that the true harm of 1922 was not just the loss of individual homes, but the destruction of a Black economic ecosystem and the entrenched segregation that followed. By restricting eligibility to lineal descendants, we may exclude current residents of the adjacent tracts who suffer the same systemic poverty caused by the neighborhood's destruction, simply because they cannot prove genealogy. A land trust addresses the present-day reality of segregation and housing insecurity more effectively than a one-time payment to descendants who may no longer live in Fairhaven. Furthermore, they argue that focusing on individual lineage risks reducing a collective political struggle to a private legal claim, potentially fracturing the coalition needed to fight current housing injustices. While I maintain that specific justice requires specific victims, this argument rightly warns us not to let historical redress become an excuse to ignore current structural inequities.

  **Conclusion**
  We cannot fix every injustice, but we must fix the one we were convened to address. Proposal A, funded by the utility beneficiaries and paired with a formal finding, best satisfies the ordinance's constraints and the moral imperative of corrective justice. I urge the Commission to vote in favor.
