      *   This is essentially the "Liberal Paradox" (Amartya Sen). It demonstrates that Pareto efficiency (Clause 3) and Liberalism (Clause 11) can conflict.
      *   *Decision:* We cannot satisfy all constraints simultaneously. We must prioritize one or find a workaround.

