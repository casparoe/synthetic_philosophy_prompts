      *   *Knight Capital?* (Addressed: Alignment/Control, not Embedding).

  8.  *(Self-Correction during drafting)*: I need to make sure I don't dismiss EA entirely. There *is* a connection. The "Logical Uncertainty" part maps to "Model Uncertainty" in finance. The "Self-Trust" maps to "Confidence in Liquidity." I should draw those parallels even if I conclude other frameworks are better. I need to respect the "Embedded Agency" terminology (MIRI/Decision Theory) while applying it to Finance.

      *Correction:* The prompt specifically mentions "decision-theoretic framing, not enactivist." I must stick to the AI/Decision Theory definition (self-modeling, Cartesian boundary issues). I need to be critical about whether HFTs actually *model* themselves. Most don't. They have hard-coded risk limits. This is a key point: EA assumes a reasoner; HFTs are often reflex arcs.

      *Refining the Knight Capital point:* Knight Capital is actually a great example of *failed* embedded agency safeguards. They didn't have a "stop" model. But is it *self-reference*? No. It's a deployment failure. I will argue it's a "Control Problem" case study, not an "Embedded Agency" one.

