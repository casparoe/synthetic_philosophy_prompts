answer: |-
  # RFC: Specification for a Theory of Real Patterns and Stance Adoption

  **To:** Engineering Team (Philosophy Division)
  **From:** System Architect
  **Subject:** Desiderata for Agentive Abstraction Legitimacy
  **Status:** Draft

  You asked for a spec, not a tutorial. Below is the requirements document for an adequate theory of "Real Patterns" capable of licensing agentive language ("the service *decides*") in technical documentation.

  I have translated your eight edge cases into eight System Requirements (SR). I have classified them as **Core** (non-negotiable for the theory to function), **Optional** (metaphysical preferences), or **Conflicting** (mutually exclusive constraints).

  ---

  ## 1. System Requirements (Desiderata)

  ### SR-1: Predictive Compression Gain (Core)
  **Definition:** The pattern must allow an observer to predict future states of the system with significantly less computational effort and data than the Physical Stance (simulating underlying mechanics), without losing accuracy beyond a defined error budget.
  **Motivating Case:** (1) Leaky vs. Projection. A traffic jam is real because predicting car positions via "traffic flow" equations is cheaper and robust enough compared to simulating every engine cycle. A constellation is not real because connecting the stars adds description length without improving prediction of stellar motion.
  **Acceptance Test:** Does adopting the intentional description reduce the bit-cost of the prediction log compared to the design/physical description?

  ### SR-2: Complexity Budget / No Overfitting (Core)
  **Definition:** The complexity of the pattern-detection scheme (the "decoder") must be accounted for in the compression metric. You cannot claim a pattern is real if the code required to detect it is larger than the data it compresses.
  **Motivating Case:** (2) The Gerrymander Problem. Any finite dataset can be compressed to 1 bit if you hardcode the dataset into the decoder. A theory must penalize the complexity of the "lens" used to find the pattern.
  **Acceptance Test:** Minimum Description Length (MDL) check: `Length(Pattern) + Length(Decoder) < Length(Raw Data)`.

  ### SR-3: Robustness Under Noise (Core)
  **Definition:** The pattern must persist when the underlying physical substrate is perturbed within reasonable bounds. It must support counterfactuals ("If X had happened, the agent would have done Y").
  **Motivating Case:** (1) Leaky Abstractions. A retry storm is a real pattern even if individual packets drop. A face in the clouds vanishes if the wind shifts slightly; it supports no counterfactuals.
  **Acceptance Test:** Can the theory handle "ceteris paribus" clauses without collapsing?

  ### SR-4: Scale Explicitness (Core)
  **Definition:** The theory must require the specification of the temporal and spatial resolution at which the pattern is claimed to exist.
  **Motivating Case:** (3) Granularity. A packet trace pattern at 100ms may vanish at 1ms. The theory cannot say "it is a pattern" simpliciter; it must say "it is a pattern at resolution R."
  **Acceptance Test:** Does the theory force the user to declare the bucket size?

  ### SR-5: Content Determinacy Threshold (Optional/Conflicting)
  **Definition:** The theory must either (A) assign determinate content to beliefs/desires (e.g., "believes 20C") or (B) explicitly license indeterminacy as a feature, not a bug.
  **Motivating Case:** (4) Thermostat Content. Does it believe "20C" or "Too Cold"? If the theory demands (A), it must provide an algorithm to resolve this. If (B), it must explain why we can still use the stance.
  **Acceptance Test:** Can the theory distinguish between a system with undefined beliefs and a system with no beliefs?

  ### SR-6: Reflexive Consistency (Core)
  **Definition:** The theory must remain stable when the predictor is part of the system being predicted (Game Theory / Adversarial contexts).
  **Motivating Case:** (5) Reflexive Prediction. If I predict the bot, and the bot predicts my prediction, does the intentional stance break? A valid theory must handle fixed-points.
  **Acceptance Test:** Does the stance collapse in a multi-agent loop?

  ### SR-7: Causal Efficacy (Optional)
  **Definition:** The pattern must be capable of being cited as a cause in explanations, not just a summary of effects.
  **Motivating Case:** (7) Shadows vs. Waves. A stadium wave causes people to stand; a shadow causes nothing. Does the theory require the pattern to "do work"?
  **Acceptance Test:** Can I write `if (pattern_detected) { trigger_alert() }` and claim the pattern caused the alert?

  ### SR-8: Ontological Commitment Level (Optional/Conflicting)
  **Definition:** The theory must declare whether it is describing the *world* (Metaphysical Realism) or licensing a *vocabulary* (Pragmatic Instrumentalism).
  **Motivating Case:** (8) What vs. When. Do you want to know if the service *really* thinks, or if you are *allowed to say* it thinks?
  **Acceptance Test:** Does the theory answer "Is it true?" or "Is it useful?"

  ---

  ## 2. Incompatibility Proof

  You suspected a contradiction between **Objectivity** and **Compression**. You are correct.

  **Theorem:** `Mind-Independent Objectivity` and `Compression-Relative Patternhood` are mutually exclusive.

  **Proof:**
  1.  **Compression is Relational:** Information theory defines compression relative to a coding scheme (a predictor). A sequence is random relative to Scheme A but highly compressible relative to Scheme B (which has the sequence hardcoded).
  2.  **Objectivity is Absolute:** Mind-Independent Objectivity requires the pattern to exist regardless of the predictor's scheme or computational budget.
  3.  **Conflict:** If patternhood is defined by compression (SR-1, SR-2), it is inherently relative to the compressor. If it is relative to the compressor, it is not mind-independent.
  4.  **Conclusion:** You must choose either:
      *   **Relational Realism:** Patterns are real *relative to* observers with specific computational constraints (Dennett's path).
      *   **Fundamental Realism:** Patterns are real only if they map to fundamental physics, rendering compression irrelevant (Eliminativism's path).

  **You cannot have both.** If you demand the pattern be "out there" independent of us, you cannot use compression as your metric. If you use compression, you admit the observer is part of the equation.

  ---

  ## 3. Scoring Contenders

  Here is how three major philosophical "implementations" score against your spec.

  ### Contender A: Dennett's Mild Realism (Instrumentalism)
  *   **Core Logic:** Patterns are real if they support prediction via the Intentional Stance, even if indeterminate.
  *   **SR-1 (Compression):** PASS. This is the core definition.
  *   **SR-2 (Complexity):** PASS. Explicitly accounts for the observer's computational limits.
  *   **SR-5 (Determinacy):** **FAIL (By Design).** Dennett argues content *is* indeterminate (the thermostat case). There is no fact of the matter.
  *   **SR-8 (Ontology):** PASS (Pragmatic). It tells you when you are licensed to use the talk, not what the service "is."
  *   **Verdict:** Best fit for your engineering docs. It licenses "the service decided" without requiring a soul.

  ### Contender B: Eliminativism / Fictionalism
  *   **Core Logic:** Only fundamental physics is real. Agent talk is a useful lie.
  *   **SR-1 (Compression):** FAIL. It admits the Intentional Stance is useful but denies the pattern is *real*.
  *   **SR-7 (Causal):** FAIL. Beliefs don't cause actions; neurons do.
  *   **SR-8 (Ontology):** PASS (Fundamental).
  *   **Verdict:** Useless for your purpose. It forbids the abstraction you want to write, forcing you to document packet states instead of "retry logic."

  ### Contender C: Strong Information-Theoretic Realism
  *   **Core Logic:** Patterns are objective features of the data structure of the universe.
  *   **SR-1 (Compression):** PASS.
  *   **SR-2 (Complexity):** **FAIL.** Struggles to define the "universal" compressor without smuggling in a specific observer (see Incompatibility Proof).
  *   **SR-6 (Reflexive):** **FAIL.** Often breaks on self-referential systems because it seeks a "view from nowhere."
  *   **Verdict:** Theoretically elegant but operationally brittle for multi-agent systems.

  ---

  ## 4. The Killer Requirement

  **SR-2 (Complexity Budget / No Overfitting)** combined with **SR-1 (Predictive Compression Gain)** knocks out the most candidates.

  *   It kills **Fundamental Realism** because simulating physics is computationally intractable (violates SR-1).
  *   It kills **Pure Subjectivism** because arbitrary projections fail the MDL check (violates SR-2).
  *   It forces **Dennettian Pragmatism** as the only remaining viable architecture: Patterns are real *because* we are bounded computers who need lossy compression to navigate the world.

  ---

  ## 5. Recommendation for Documentation

  Based on this spec, here is the legitimacy test for your internal docs:

  **You are licensed to write "The service thinks/decides" IF:**
  1.  **Compression:** Describing the behavior as a "decision" is shorter than describing the packet logic (SR-1).
  2.  **Robustness:** The "decision" holds across different load conditions, not just one specific trace (SR-3).
  3.  **Counterfactuals:** You can predict what the service *would* do if the cache were different (SR-3).
  4.  **No Overfitting:** You aren't attributing belief to a hardcoded `if/else` statement where the design stance is cheaper (SR-2).

  **You are fooling yourself IF:**
  1.  **Gerrymandering:** You have to tweak the definition of "thinks" for every new log entry (Violates SR-2).
  2.  **No Leverage:** Knowing what it "wants" doesn't help you predict its latency or failure modes better than knowing its CPU config (Violates SR-1).
  3.  **Indeterminacy Matters:** You need to know *exactly* what value it holds, and the intentional stance gives you a range (Violates SR-5, if you treat SR-5 as Core).

  **Final Ruling:** For backend services, adopt **Dennett's Mild Realism**. Treat "belief" and "desire" as API endpoints, not database schemas. They are real interfaces, not implementation details. Document the interface.
