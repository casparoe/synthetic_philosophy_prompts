  Hey — I'm in this super casual reading group with a couple friends from my climbing gym where we're slowly working through Adam Smith's Wealth of Nations, and we got totally stuck on the chapter on colonies (Book IV, the chapter titled Of Colonies, first published 1776). I was dicussing with my friends and one of them has been pushing this interpretation she calls the 'venture-colony' reading. Her idea is that Smith is contrasting Greek colonies, which were basically independent offshoot communities that reproduced the mother city's political life, with the modern European settlements in America, which she says he regarded as speculative money-making schemes — she keeps paraphrasing him as treating them like a hunt for gold and an excuse for monopoly, though I don't have the exact later wording in front of me and I might be mixing it up. On her reading, the Greek 'emancipated child' stuff is normative: a real colony is supposed to be self-governing, so an empire that rules over colonies is a perversion of the category, and that's why Smith can later complain that the modern ones brought no clear benefit. The passage we're looking at is this bit about the Greek mother city:

  "The mother city, though she considered the colony as a child, at all times entitled to great favor and assistance, and owing in return much gratitude and respect, yet considered it as an emancipated child, over whom she pretended to claim no direct authority or jurisdiction. The colony settled its own form of government, enacted its own laws, elected its own magistrates, and made peace or war with its neighbors as an independent State, which had no occasion to wait for the approbation or consent of the mother city. Nothing can be more plain and distinct than the interest which directed every such establishment."

  I have two specific confusions. First, the word 'pretended': in 18th-century usage, does 'pretended to claim no direct authority' mean the mother city hypocritically claimed to have no authority while actually keeping it, or just that she officially professed/disclaimed authority, with no implication of hypocrisy? It definately reads oddly to me either way. Second, and more important for whether my friend's reading holds up: what exactly is Smith saying is 'plain and distinct' here? Is he sincerely praising the Greek motive (overpopulation, necessity) as a clear, legitimate interest, and thereby setting up a contrast with the muddled, speculative motives behind modern colonies? Or is 'nothing can be more plain and distinct' meant descriptively, i.e., it's just obvious what the interest was, without any endorsement — in which case my friend might be over-reading the normative part? I'm also not sure how much the 'emancipated child' metaphor is doing: does the fact that the colony 'made peace or war... as an independent State' mean Smith's own view is that colonies ought to be fully sovereign, or is he only describing Greek practice so he can later argue that Rome's dependent colonies were the real precedent for modern empire? Please help me understand what this passage is doing and whether the 'venture-colony' reading is compatible with it. Please lead with your bottom line in the very first sentence — just tell me what you take Smith to be doing here and whether my friend's reading survives — and then give the reasoning, with no preamble and no restating of the question.
