answer: |-
  Smith is contrasting Greek necessity-driven independence with modern profit-driven dependency to critique mercantilist policy, so your friend's reading is substantially correct about his critique of modern colonies but slightly overstates his normative claim that independence is the only legitimate form of colonization.

  Here is the breakdown of the specific textual issues and how they support that conclusion:

  **1. The meaning of "pretended"**
  In 18th-century usage, "pretend" primarily meant "to claim," "profess," or "put forward" (from the Latin *praetendere*, to stretch forth), without the modern implication of deceit or hypocrisy. When Smith says the mother city "pretended to claim no direct authority," he means they formally professed or maintained the stance that they had no authority. There is no suggestion here that the Greek mother cities were secretly pulling strings; rather, Smith is emphasizing that the disclaimers of authority were genuine and institutionalized. This supports your friend's view that Smith sees the Greek model as genuinely independent, but it doesn't imply the Greeks were hypocrites about it.

  **2. The meaning of "plain and distinct"**
  When Smith writes that "Nothing can be more plain and distinct than the interest which directed every such establishment," he is speaking descriptively about the clarity of the *motive*, not necessarily issuing a moral endorsement. For the Greeks, the interest was survival and relieving overpopulation—a natural, obvious necessity. For modern colonies, Smith argues later, the interest was trade monopoly and profit—a calculated, artificial economic policy. By calling the Greek interest "plain and distinct," Smith is highlighting that their independence was a natural outcome of their motive (people leaving to survive need self-rule), whereas modern dependency was an artificial construct imposed to serve merchants back home. Your friend is right that Smith contrasts these motives, but Smith is pointing out the *clarity* of the cause-and-effect relationship in Greece to show how muddled and costly the modern mercantilist motive is.

  **3. The normative weight of the "emancipated child"**
  Your friend's "venture-colony" reading holds up well here, but with a caveat. Smith does use the Greek model to show that colonies *can* function successfully as independent states, and he certainly argues later in *Wealth of Nations* that maintaining authority over distant colonies is economically burdensome and often not worth the cost to the mother country. However, Smith isn't necessarily defining a "real colony" as one that *must* be independent by moral right; rather, he is arguing that the Greek model was more *natural* and less economically distortive than the Roman/modern model of garrison-states designed for extraction. He implies that modern colonies *ought* to be treated more like the Greek model (or even let go entirely, as he famously suggested regarding America) because the "venture" model of monopoly and control is inefficient and unjust, not because "colony" etymologically requires sovereignty.

  **Verdict on the "Venture-Colony" Reading**
  Your friend is correct that Smith views modern European colonies as speculative, monopoly-driven ventures that differ fundamentally from the Greek model of community offshoots. She is also right that Smith sees the modern system as a perversion of the more natural Greek arrangement. However, she should be careful not to attribute a rigid political definition to Smith; his main point is economic. He favors the Greek model not just because it is "self-governing," but because the mercantilist control of modern colonies distorts trade, costs the state more than it earns, and benefits only a specific class of merchants rather than the public good.
