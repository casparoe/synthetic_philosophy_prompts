answer: |-
  1. **Statement and Proof of the Aggregation Result**

  **Answer:**
  Let $\Delta(X)$ be the set of lotteries over a finite set of social states $X$. Let $\succeq_0$ denote the social observer's preference relation and $\succeq_i$ denote individual $i$'s preference relation for $i=1, \dots, n$. Assume all relations satisfy the von Neumann–Morgenstern (vNM) axioms (completeness, transitivity, continuity, and independence). Let $U_0$ and $U_i$ be vNM utility representations of these preferences, unique up to positive affine transformations. Assume the Pareto condition: for any lotteries $A, B \in \Delta(X)$, if $U_i(A) \ge U_i(B)$ for all $i$ and $U_j(A) > U_j(B)$ for some $j$, then $U_0(A) \ge U_0(B)$.

  **Result:** There exist constants $a_1, \dots, a_n \ge 0$ and $b \in \mathbb{R}$ such that for all $p \in \Delta(X)$:
  $$ U_0(p) = \sum_{i=1}^n a_i U_i(p) + b $$

  **Justification:**
  **Proof:**
  1.  **Mapping to Utility Space:** Define a mapping $V: \Delta(X) \to \mathbb{R}^n$ by $V(p) = (U_1(p), \dots, U_n(p))$. Let $S = \{V(p) \mid p \in \Delta(X)\}$ be the image of the lottery simplex in $\mathbb{R}^n$. Since each $U_i$ is linear in probabilities (by the vNM representation theorem) and $\Delta(X)$ is convex, the set $S$ is a convex subset of $\mathbb{R}^n$.
  2.  **Social Utility as a Function of Individual Utilities:** By the Pareto condition, if $V(A) = V(B)$, then no individual strictly prefers one to the other, implying $U_0(A) = U_0(B)$ (otherwise, if $U_0(A) > U_0(B)$, one could construct a mixture violating Pareto via continuity, or simply note that Pareto indifference holds). Thus, there exists a function $F: S \to \mathbb{R}$ such that $U_0(p) = F(V(p))$.
  3.  **Linearity of $F$:** This is the critical step requiring vNM linearity. Since $U_0$ satisfies the independence axiom, it is linear in probabilities: for any $p, q \in \Delta(X)$ and $\lambda \in [0,1]$, $U_0(\lambda p + (1-\lambda)q) = \lambda U_0(p) + (1-\lambda)U_0(q)$.
      Substituting the functional form:
      $$ F(V(\lambda p + (1-\lambda)q)) = \lambda F(V(p)) + (1-\lambda)F(V(q)) $$
      Since $V$ is linear in probabilities, $V(\lambda p + (1-\lambda)q) = \lambda V(p) + (1-\lambda)V(q)$. Let $u = V(p)$ and $v = V(q)$. Then for all $u, v \in S$ and $\lambda \in [0,1]$:
      $$ F(\lambda u + (1-\lambda)v) = \lambda F(u) + (1-\lambda)F(v) $$
      A function satisfying this condition on a convex domain is affine. Thus, $F(u) = \sum a_i u_i + b$.
  4.  **Non-negativity of Weights:** The Pareto condition implies that if $u \ge v$ (component-wise) and $u \neq v$, then $F(u) \ge F(v)$. This monotonicity requires $a_i \ge 0$ for all $i$.

  **Failure without vNM Linearity:**
  If preferences satisfied only weak-order axioms (completeness, transitivity, continuity) without the independence axiom, the utility functions $U_i$ and $U_0$ would be ordinal, unique only up to strictly increasing transformations.
  *   **The Failing Step:** Step 3 would fail. Without the independence axiom, $U_0$ is not necessarily linear in probabilities. Consequently, the function $F$ mapping individual utilities to social utility would not be required to satisfy Jensen's equation ($F(\lambda u + (1-\lambda)v) = \lambda F(u) + (1-\lambda)F(v)$).
  *   **Consequence:** $F$ could be any monotonic transformation of a weighted sum (e.g., a Cobb-Douglas function $\prod U_i^{a_i}$ or a Rawlsian min function). The Pareto condition restricts the *direction* of social improvement but does not restrict the *curvature* of social indifference curves in utility space. Only the vNM linearity forces the social indifference curves to be parallel hyperplanes, necessitating the additive form.

  2. **Interpersonal Comparability**

  **Answer:**
  The proof assumes **full cardinal unit comparability** of individual utilities. Specifically, it assumes that the social utility $U_0$ is an affine function of the vector of individual utilities $(U_1, \dots, U_n)$. This requires that the "units" of utility are commensurable across individuals. It does not require a common zero point (full level comparability), but it strictly requires comparability of utility *differences*.

  **Justification:**
  *   **What is Compared:** The aggregation formula $U_0 = \sum a_i U_i + b$ sums quantities belonging to different persons. For this sum to be mathematically and conceptually meaningful, the unit of measurement for $U_i$ must be transformable into the unit of $U_j$ via the ratio of their weights. The proof compares the *marginal rate of substitution* between individual $i$'s utility and individual $j$'s utility in the social evaluation.
  *   **Requirement on Scales:** The vNM axioms establish that each $U_i$ is unique up to a positive affine transformation ($U_i' = \alpha_i U_i + \beta_i, \alpha_i > 0$). For the social ordering to remain invariant under these transformations, the weights $a_i$ must adjust inversely to $\alpha_i$. This implies that the *scale* (the size of a utility unit) is comparable across persons. If individual $i$'s utility scale were arbitrarily stretched without adjusting $a_i$, the social ranking would change.
  *   **Comparability of Differences:** vNM utility is cardinal; it measures preferences over risk, which identifies utility intervals (differences). The aggregation sums these utilities. Therefore, the result requires that a difference of 1 util for person $i$ is comparable to a difference of 1 util for person $j$ (up to the weight $a_i/a_j$). It does not strictly require that the zero points $\beta_i$ be comparable (level comparability), as the constant $b$ in the social utility function can absorb differences in origin. However, it strictly requires that the *size* of the units be comparable.

  3. **Identifiability**

  **Answer:**
  The weights $a_i$ are not uniquely identified by the preference relations alone; they are identified only relative to the specific normalization of the individual utility functions. Different pairs of (weights, utility normalizations) can generate the exact same social preference ordering over lotteries while representing the exact same underlying individual preferences.

  **Justification:**
  **Counterexample:**
  Consider $n=2$ individuals and a set of states such that we can define utilities directly.
  *   **Individual Preferences:** Both individuals have vNM preferences represented by $U_1$ and $U_2$.
  *   **Normalization 1:** Let $U_1(p)$ and $U_2(p)$ be specific vNM representations. Let the social observer use weights $a_1 = 1, a_2 = 1$ and $b=0$.
      $$ U_0(p) = 1 \cdot U_1(p) + 1 \cdot U_2(p) $$
  *   **Normalization 2:** Rescale Individual 1's utility by a factor of 2. Let $U_1'(p) = 2 U_1(p)$. This represents the *identical* preference relation for Individual 1 (since it is a positive affine transformation with $\beta=0$). Let Individual 2's utility remain $U_2'(p) = U_2(p)$.
      Now, choose weights $a_1' = 0.5, a_2' = 1$ and $b'=0$.
      $$ U_0'(p) = 0.5 \cdot U_1'(p) + 1 \cdot U_2'(p) = 0.5 \cdot (2 U_1(p)) + U_2(p) = U_1(p) + U_2(p) $$
  *   **Result:** $U_0(p) = U_0'(p)$ for all lotteries $p$. The social preference relation $\succeq_0$ is identical. The individual preference relations $\succeq_1, \succeq_2$ are identical. However, the weight assigned to Individual 1 has changed from 1 to 0.5.

  **Implication:**
  This non-identifiability implies that the aggregation result does not "derive" a specific weighting scheme (such as utilitarianism with equal weights) from the Pareto axiom and vNM rationality alone. The weights are artifacts of the arbitrary choice of utility normalization. To claim a specific weighting scheme (e.g., $a_i = a_j$) is morally significant, one must first fix the interpersonal scale of the $U_i$ functions independently of the aggregation theorem. The theorem itself provides the *form* of the aggregation but leaves the *parameters* underdetermined.

  4. **The Equal-Weights Question**

  **Answer:**
  The standard argument for equal weights invokes a "veil of ignorance": the social observer chooses the social utility function behind a veil where she has an equal probability ($1/n$) of becoming any individual $i$. Maximizing expected utility behind this veil yields $U_0 = \sum (1/n) U_i$.
  **Objection 1 (Axiomatic):** Applying the vNM Independence axiom to the "lottery over identities" is unjustified.
  **Objection 2 (Substantive):** Equal probability does not account for differences in welfare capacity or prioritarian concerns for the worse-off.

  **Justification:**
  *   **The Argument:** If the observer faces a lottery where she becomes person $i$ with probability $\pi_i$, her expected utility is $\sum \pi_i U_i(\text{state})$. If she is impartial, she sets $\pi_i = 1/n$. If she maximizes expected utility, the social welfare function becomes the sum of individual utilities with equal weights.
  *   **Objection 1 (vNM Assumption):** The vNM Independence axiom is a behavioral constraint on preferences over objective risk regarding outcomes. The veil-of-ignorance argument extends this axiom to subjective uncertainty regarding *personal identity*. There is no logical necessity that an observer's *ethical* preferences must satisfy the same Independence axiom as her *self-interested* preferences. An observer might satisfy Expected Utility for risks over goods but reject it for risks over identities (e.g., preferring a guaranteed minimum welfare for whoever she turns out to be, rather than maximizing the average). The derivation assumes the structure of ethical reasoning is identical to the structure of risky choice, which is a substantive moral claim, not a logical truth.
  *   **Objection 2 (Substantive Egalitarian/Prior):** Even if one accepts the probabilistic model, setting $\pi_i = 1/n$ assumes that all individuals have the same "capacity" for welfare (i.e., the range of their $U_i$ functions is comparable and identical). If Individual $A$ can experience welfare in the range $[0, 100]$ and Individual $B$ in $[0, 10]$, equal weights on the normalized functions do not yield equal moral concern. Furthermore, a prioritarian or egalitarian might argue that the moral value of a unit of utility is higher for a worse-off individual. This would require a concave transformation of $U_i$ before summation (e.g., $\sum g(U_i)$), which contradicts the linearity result derived in Section 1. The equal-weights argument ignores the distribution of utility levels, focusing only on the expectation.

  5. **Residue Report**

  **Answer:**
  (a) **Non-sum theory (e.g., Maximin):** Contradicts the result.
  (b) **State-dependent weights:** Contradicts the result.
  (c) **No cardinal comparability:** Contradicts the result.

  **Justification:**
  *   **(a) Theory of value not a weighted sum (e.g., inequality aversion/Maximin):**
      *   **Contradicts:** The aggregation result proves that under vNM and Pareto, the social utility function *must* be linear (additive) in individual utilities. A Maximin function ($U_0 = \min_i U_i$) or a function with direct inequality aversion (concave in the distribution of $U_i$) is non-linear.
      *   **Untouched:** It leaves untouched the Pareto condition itself (Maximin satisfies Pareto), but it rejects the vNM Independence axiom for the social observer, which is the driver of the linearity.
  *   **(b) Weights depend on state or position:**
      *   **Contradicts:** The result proves weights $a_i$ are fixed constants, independent of the lottery $p$ or the state of the world. If weights depend on who is worst-off (position-dependent) or on the specific state (state-dependent), the function $F$ in the proof would not be affine, violating the linearity derived from the social observer's vNM axioms.
      *   **Untouched:** It leaves untouched the individual vNM axioms. It specifically targets the implication that social trade-offs between individuals must be constant.
  *   **(c) Interpersonal utility not cardinally comparable:**
      *   **Contradicts:** The entire result rests on the premise that $U_i$ are vNM utilities (cardinal). If utilities are merely ordinal (unique up to monotonic transformation), the summation $\sum a_i U_i$ is mathematically undefined (one cannot add inches to pounds).
      *   **Untouched:** It leaves untouched the Weak Pareto condition, which is defined on ordinal preferences. However, without cardinality, the specific functional form (weighted sum) cannot be derived; only the monotonicity of the social welfare function with respect to individual utilities can be established.
