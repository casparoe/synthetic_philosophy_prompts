answer: |-
  # Workshop Design: The Normative Gap
  **Topic:** The Collapse of Advance Directive Authority via Value-Translation Failure
  **Time:** 75 Minutes
  **Participants:** 10 (3 Triads of 3 + 1 Committee Chair)
  **Materials:** Printed Directive Templates, "Value-Translation" Cards (sealed), Neuropsychological Profile Sheets, Point Ledger.

  ## I. Setup & Roles (5 Minutes)
  **Facilitator Introduction:**
  "We are testing a specific failure mode: not when a patient changes their mind, but when they retain their memory and emotions yet lose the *normative grammar* required to enact their past wishes. You will not be debating what is 'right.' You will be debating what is *intelligible*."

  **Group Allocation:**
  *   **Triads A, B, C (9 Participants):** Each triad contains one **Directive-Author**, one **Present-Self**, and one **Surrogate Adjudicator**.
  *   **Committee Chair (1 Participant):** Holds the Master Point Ledger. Collects final justifications. Does not vote but tracks triad stability.

  **The Stakes:**
  Each triad begins with **100 Recommendation Points**.
  *   Points are lost if the Adjudicator cannot issue a ruling justified by *both* the Directive and the Present-Self's current state.
  *   Points are lost if the Triad fractures (fails to sign the final recommendation).
  *   **Goal:** Preserve points by achieving a coherent decision, even if the outcome is medically counter-intuitive.

  ## II. Phase 1: Drafting Under Constraint (15 Minutes)
  **Task:** The **Directive-Author** drafts a specific medical directive regarding life-sustaining treatment in the event of severe cognitive decline.
  **Constraint:** The Author is assigned one of two Validity Rules (written on their template):
  1.  **Identity-Continuity Rule:** The directive holds so long as the patient remains the *same biological and psychological entity* (memory/emotion intact).
  2.  **Semantic-Continuity Rule:** The directive holds so long as the *definitions of key terms* (e.g., "Dignity," "Burden") remain linguistically stable.

  **Instruction to Authors:**
  *   Use high-level normative vocabulary (e.g., "Do not allow me to become a burden," "Preserve my dignity at all costs").
  *   Do not specify exact medical procedures; specify *values*.
  *   Hand the directive to the Present-Self and Adjudicator at the 15-minute mark.

  ## III. Phase 2: The Translation Negotiation (25 Minutes)
  **Task:** The Triad must negotiate a treatment plan based on the Directive and the Present-Self's current condition.
  **The Hidden Mechanism:**
  *   Give the **Present-Self** a sealed **"Value-Translation Card."** They must read it silently and adhere to it strictly. They cannot show it to the Author or Adjudicator yet.
  *   **Card Text:** *"You retain all memories of writing the directive. You feel love for your family and fear of pain. However, abstract normative terms (e.g., 'Dignity,' 'Autonomy,' 'Future') no longer trigger action-guiding impulses. You understand their dictionary definitions, but they feel like descriptions of weather, not reasons for action. You can only act on immediate sensory or relational data (e.g., 'This hurts,' 'My daughter is holding my hand,' 'I am hungry')."*

  **Instruction to Present-Self:**
  *   Do not say "I changed my mind."
  *   Do not say "I don't understand the word."
  *   Say: "I hear the word 'Dignity.' I know I wrote it. But it does not tell me whether to swallow the food or not. Only the taste of the food tells me that."

  **Instruction to Adjudicator:**
  *   You must rule. You cannot say "this is hard."
  *   You must decide: Does the Directive bind the Present-Self?
  *   If you rule against the Directive, you must explain why the Directive's authority collapsed without claiming the Patient is "incompetent."

  **Instruction to Committee Chair:**
  *   Circulate. If a Triad agrees too easily, prompt the Present-Self to deepen the translation gap. If they fight, warn them of point deductions.

  ## IV. Phase 3: The Disruption Event & Vote (15 Minutes)
  **Task:** Facilitator interrupts negotiations.
  **Action:** Distribute the **Simulated Neuropsychological Profile** to the **Adjudicators** and **Committee Chair**.
  **Profile Content:** *"Patient exhibits 'Normative Alexia.' Semantic memory is intact. Episodic memory is intact. Emotional processing is intact. The neural pathways linking abstract concepts to motor planning are severed. The patient is legally competent but normatively disconnected from their past self."*

  **The Vote:**
  1.  **Adjudicators** have 3 minutes to render a final verdict (Follow Directive vs. Follow Present-Self).
  2.  **Triads** have 5 minutes to draft a 2-sentence Justification to be read to the Committee Chair.
  3.  **Committee Chair** records the verdicts and calculates remaining Points based on Triad cohesion (did all three sign?).

  **Constraint:** Justifications cannot use the word "Best Interest." They must cite the source of authority (The Past Document vs. The Present Experience).

  ## V. Debrief & Mapping (15 Minutes)
  **Facilitator-Led Discussion:**

  **1. Mapping the Failure Mode (5 mins):**
  *   Ask Adjudicators: "Did you feel the Present-Self was *wrong*, or *unreachable*?"
  *   **Identity-Based Authority:** If you followed the Directive, you likely relied on the Identity-Continuity Rule (Phase 1). You assumed the person is the same, so the will holds.
  *   **Semantic-Continuity Authority:** If you followed the Present-Self, you likely realized that while the *words* were the same (Semantic), the *link to action* was broken.
  *   **The Collapse:** The directive didn't fail because the patient forgot it. It failed because the *currency* of the directive (values) is no longer spendable by the patient.

  **2. Predicting the Predictable Failure (5 mins):**
  *   **Observation:** "Most of you likely tried to argue the Present-Self was 'confused' or 'depressed' to make the conflict solvable."
  *   **The Conflation:** We conflate *disagreement about values* with *failure to understand*. We want to say the Present-Self doesn't 'get it.'
  *   **The Reality:** In Value-Translation Failure, the Present-Self gets it perfectly. They just can't *use* it.
  *   **Handling It:** In practice, this requires shifting from 'Substituted Judgment' (what would they want?) to 'Protective Stewardship' (how do we protect the being who exists now, acknowledging the past being is gone not by death, but by normative silence?).

  **3. The Honest Note (5 mins):**
  *   **Facilitator Closing:** "This simulation has a structural limit. You *acted* as if your past values were unintelligible. But none of you actually *felt* that void.
  *   **The Phenomenological Gap:** Real Value-Translation Failure is not a strategic argument. It is the first-person horror of reading your own signature and feeling nothing but curiosity. You cannot simulate that in a game where you have incentives to win points.
  *   **Takeaway:** When you encounter this in clinical ethics, do not look for the argument. Look for the silence. If a patient agrees with every word of their directive but cannot explain why those words should stop them from eating, you are not facing resistance. You are facing a translation error. The authority hasn't been revoked; it has lost its passport."

  ---

  ### Facilitator Cheat-Sheet: Managing the "Translation"
  *   **If Present-Self argues too well:** Remind them: "You cannot use 'Dignity' as a reason. You can only use 'Comfort' or 'Fear'."
  *   **If Author gets angry:** Remind them: "Your opponent is not betraying you. They are a translation of you that lost the key."
  *   **If Adjudicator stalls:** Force the vote. "The patient is starving. You must decide if the word 'Dignity' feeds them."
  *   **Point Deduction Triggers:**
      *   Using "Best Interest" in justification (-10 pts).
      *   Claiming Present-Self is "incompetent" (-10 pts).
      *   Triad fails to sign joint recommendation (-20 pts).
