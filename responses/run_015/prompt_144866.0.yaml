prompt: |-
  Hey — I found a blog post about objective chance and rational credence, and I want to know how much of it to trust before I repeat any of it in a reading group presenation next week. Here's the central bit, roughly as written:

  "Objective chance just is long-run relative frequency, so the Principal Principle — the claim that your credence in an outcome, given that its chance is x, should be x — is basically the instruction to set your beliefs by the frequencies you have observed. Because chances are the same for everyone, any two people who start with the same evidence have to end up with the same credence in the same outcome, and that is what makes the principle a requirement of rationality rather than mere advice. It also means nothing except the chance may move you: if a coin is fair, betting on tails because of a horoscope is straightforwardly irrational, since evidence can only ever get a grip on your credence by changing your estimate of the chance."

  My instinct is that the first sentence is the shaky one and the rest is fine, but the author also throws around the word "admissible" without ever explaining it, which is where I suspect the real cheating is.

  I've also been stuck on a case the post never mentions: a genuinely one-off setup. Imagine a machine built to produce a single particle, with its "chance" of decaying in the next minute set once at 0.7, and then the machine is destroyed — there is no sequence of repeatable trials anywhere in the world for 0.7 to be a frequency of. The author would presumably say the principle still applies and my credence should just be 0.7. Does the one-off-ness break anything, or not?

  Can you take the passage apart for me: what someone who defends the Principal Principle would accept as stated, what they'd call a conflation or an overstatement rather than an outright error, and what they'd reject — and then say whether the horoscope conclusion actually follows from the parts that are right. Don't cite anything or give me a reading list, I just want the concepts straight. Keep the whole reply under 450 words; bullets are fine.
