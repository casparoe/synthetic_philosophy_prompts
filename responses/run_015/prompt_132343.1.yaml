answer: |-
  This is a classic problem in labor ethics: distinguishing between **leverage** (applying pressure to win a negotiation) and **coercion** (inflicting harm to force a capitulation). Your intuitions are actually quite consistent; you just haven't articulated the boundary conditions.

  The principle that reconciles most of your verdicts is **The Principle of Contained Leverage.**

  It has three pillars:
  1.  **Targeting:** The primary economic pain must fall on the employer, not on uninvolved third parties.
  2.  **Safety:** The action must not create foreseeable, irreversible harm (death, severe health outcomes) to the public.
  3.  **Procedural Good Faith:** The action must respect existing agreements (contracts, notice periods) and the scope of labor bargaining (wages/conditions, not corporate ideology).

  Here is how this principle sorts your list, what it forces you to change, and how it applies to your specific situations.

  ### 1. Testing the Principle Against Your List

  *   **Nurses (Fine):** *Targeting* is on the hospital (revenue loss); *Safety* is maintained (ER covered); *Procedure* is followed (notice).
  *   **Sanitation Wildcat (Not Fine):** Fails *Safety* (public health crisis in heat wave) and *Procedure* (breach of contract).
  *   **Warehouse Recognition (Fine):** Fails none. High pain for employer, low risk to public.
  *   **Delivery Drivers / Secondary Picket (Shaky):** This is where your intuition was right to be unsure. Under *Contained Leverage*, this is **Not Fine**. It violates *Targeting*. You are pressuring a neutral third party (the delivery company) to hurt your actual target (the warehouse). It turns the delivery company into a hostage. Your "shaky" feeling is the ethical alarm bell.
  *   **Hotel Intermittent Strike (Not Fine):** Fails *Procedural Good Faith*. Random stoppages designed to maximize chaos without allowing for resolution are sabotage, not bargaining.
  *   **Work-to-Rule (Fine):** Fails none. It is the purest form of *Targeting*. You withdraw the "gift" of extra effort, hurting the employer's efficiency without breaching contract or harming the public.
  *   **Transit / Marathon (Not Fine):** Fails *Targeting* and *Good Faith*. This is hostage-taking. You are punishing the public (runners/spectators) who have no say in the negotiation, specifically to maximize embarrassment rather than economic pressure.
  *   **Engineers / Defense Contract (Not Fine):** Fails *Scope*. A strike is a tool to negotiate *terms of employment*, not *terms of business morality*. By striking to cancel a contract, they are acting as activists using labor leverage, not workers negotiating labor conditions.
  *   **Dialysis (Not Fine):** Fails *Safety* catastrophically.

  ### 2. What You Have to Drop

  To make your worldview consistent, you have to drop two intuitions:

  1.  **The Delivery Drivers:** You must move this from "Fine" to "Not Fine" (or at least "Ethically Ambiguous"). Secondary boycotts are legally restricted in many places precisely because they violate the *Targeting* pillar. They drag neutral parties into a fight they didn't start.
  2.  **The Engineers (Defense):** You need to articulate *why* this is different from the delivery drivers. The delivery drivers are engaging in **solidarity** (helping other workers). The engineers are engaging in **ideological veto** (forcing management to make a moral choice). The former is about class power; the latter is about individual conscience weaponized through employment. Under *Contained Leverage*, labor power cannot be used to dictate corporate portfolio decisions unrelated to worker welfare.

  ### 3. Application to Your Scenarios

  #### (a) You, the Resident, and the "Scab" Label

  Under the *Contained Leverage* principle, a resident strike is ethically permissible **only if** it mirrors the "Nurses" case you approved of.

  *   **The Safety Test:** Is there a verified, concrete plan to cover all life-saving and time-sensitive care? If the answer is "yes," the *Safety* pillar is satisfied. If the answer is "we hope nothing bad happens," the strike fails the test, and your gut discomfort is a warning signal.
  *   **The "Scab" Label:** If the strike satisfies the Safety and Procedural pillars, then crossing the picket line is ethically weak. You are accepting the benefits of the collective bargain (higher wages, better ratios) without accepting the cost of achieving it. In this context, the "scab" label is a legitimate enforcement of social reciprocity.
  *   **The Exception:** If you believe the safety plan is insufficient (i.e., patients *will* suffer), the *Safety* pillar trumps the *Solidarity* pillar. No amount of union solidarity justifies foreseeable patient harm. If you cross the line because you believe patients will die, you are not a scab; you are a whistleblower on the strike's safety protocol.

  **Verdict:** Verify the coverage plan. If it's robust, your resentment of the "scab" label is misplaced; you are benefiting from a collective action you refused to join. If it's flimsy, your resentment is valid, but your concern should be patient safety, not the label.

  #### (b) The Three Engineers at the Startup

  This scenario is **Not Fine**, and it is ethically distinct from the delivery drivers or the warehouse workers.

  *   **Hostage Dynamics:** Striking specifically "the morning of a launch" is the Transit/Marathon case. It is timing the disruption to maximize existential threat to the company, not to apply steady economic pressure for negotiation.
  *   **Key Person Risk:** These three engineers hold a unique position. In a hospital, any nurse can cover the ER. In this startup, *only they* understand the pipeline. This creates a monopoly on safety/operation. Using that monopoly to threaten the company's immediate survival is not bargaining; it is extortion.
  *   **Procedural Bad Faith:** Unless they have been negotiating for weeks and this is a last resort, stopping work the morning of a launch violates *Procedural Good Faith*. It gives the employer no time to adapt or negotiate.

  **Verdict:** This is sabotage, not a strike. A legitimate strike for better conditions would involve notice and would ideally avoid timing that guarantees the company's collapse (which also costs the engineers their jobs). If they want to object to the launch, they should quit. Using their indispensability as a weapon at the critical moment violates the *Contained Leverage* principle.

  ### Summary

  Your gut is working correctly. You are distinguishing between **withdrawing labor** (which is a right) and **wielding harm** (which requires justification).

  *   **Legitimate:** Withdrawing labor to hurt the employer's profit, while protecting the public and following rules.
  *   **Illegitimate:** Withdrawing labor to hurt the public, break contracts, or force ideological changes.

  If your resident strike protects patients and follows procedure, it is legitimate, and the "scab" label is the social cost of opting out. If the startup engineers tank a launch because they hold the keys, that is not a strike; it's a hold-up.
