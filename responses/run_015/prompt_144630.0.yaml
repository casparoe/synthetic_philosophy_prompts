  # JOINT STATEMENT ON PERSISTENCE AND ONTOLOGICAL STRUCTURE
  **Signed:** ______________________ (Endurantist) | ______________________ (Perdurantist)
  **Date:** ______________________

  ## 1. AGREED CLAIMS
  *We affirm the following substantive claims, acknowledging that while we interpret the underlying ontology differently, these points constitute our shared dialectical ground.*

  1.  **The Argument from Temporary Intrinsics:** We agree this argument does not prove Endurantism false *simpliciter*. It establishes only that an Endurantist cannot hold that objects have monadic properties *simpliciter* at times without modification. It forces a choice between relationalizing properties (having property $P$-at-$t$) or distributing properties across constituents (temporal parts). Neither option is logically incoherent; the dispute is over theoretical cost.
  2.  **Wholly Present:** We agree that "wholly present at a time" cannot be analyzed non-circularly using only parthood and location without presupposing the notion of persistence in dispute. The Endurantist takes this as primitive. The Perdurantist grants it is intelligible but denies it is instantiated by persisting concrete objects.
  3.  **Time-Indexed Properties:** The Endurantist accepts they are committed to properties indexed to times (or adverbial modification of instantiation). The Perdurantist accepts this is not a logical contradiction but maintains it is ontologically profligate compared to temporal parts, as it multiplies instantiation relations rather than entities.
  4.  **Coinciding Objects:** We agree Perdurantism handles the "Statue and Lump" case with greater formal ease by allowing divergence of temporal parts. The Endurantist accepts that their view entails either (a) coinciding objects are impossible (constitution is identity) or (b) coinciding objects are distinct but share all matter and location at a time, which requires a primitive "is constituted by" relation.
  5.  **Interval Properties:** We agree that properties like *moving* or *accelerating* are had over intervals. We disagree on whether the instantiation of these properties at an instant (via derivatives) requires the object to have temporal extent (Perdurantist) or whether instantaneous velocity is a primitive causal power of the wholly present object (Endurantist).
  6.  **Special Relativity:** We agree that neither Special Relativity nor the block universe model logically entails Perdurantism. Endurantism can be made compatible with eternalism by relativizing instantiation to spacetime points or regions, though Perdurantism fits the manifold geometry more naturally.

  ## 2. DISAGREEMENTS TABLE
  *We commit to these characterizations of our own positions. We further commit to the "Verdict" column as our best joint assessment of whether the row represents a deep metaphysical rift or a terminological choice.*

  | Point at Issue | Endurantist Wording | Perdurantist Wording | Verdict (Verbal vs. Substantive) |
  | :--- | :--- | :--- | :--- |
  | **Nature of Persistence** | "Persistence is the continued existence of the *same substance* across time. The object is numerically identical at $t_1$ and $t_2$." | "Persistence is the existence of a spacetime worm composed of temporal parts. 'Identity' across time is a relation between distinct stages." | **Substantive.** Disagreement on whether diachronic identity is strict or counterpart-based. |
  | **Ontological Parsimony** | "Positing temporal parts doubles the ontology unnecessarily. I posit one object with complex properties." | "Positing time-indexed properties complicates the logic of instantiation. I posit one complex object with simple properties." | **Verbal.** Dispute over what counts as the 'unit' of ontological cost (entities vs. relations). |
  | **Vagueness** | "If persistence is strict identity, vagueness in existence is impossible. Vagueness must be semantic." | "If objects have temporal boundaries, those boundaries can be vague in reality. Ontic vagueness is permissible." | **Substantive.** Disagreement on the possibility of indeterminate identity. |
  | **The "Now"** | "The present moment is metaphysically privileged for *experience*, even if not for existence. Wholeness is felt now." | "The present moment is indexical. 'Wholeness' is an illusion of perspective on a 4D manifold." | **Verbal.** Disagreement on the phenomenological weight of "presence." |
  | **Fission Cases** | "In fission, the original object ceases to exist, and two new ones begin. Identity does not branch." | "In fission, the pre-fission stage is a common temporal part to two distinct worms. Identity is not one-to-one." | **Substantive.** Different truth conditions for "Object A survived the fission." |

  ## 3. CRUXES AND PREDICTIONS
  *For each scenario, we specify the argument both accept as relevant, and we record our predictions in advance.*

  ### A. The Flicker (Intermittent Existence)
  *Scenario:* An object $O$ exists at $t_1$, ceases to exist entirely at $t_2$, and comes back into existence at $t_3$ with identical qualitative properties and causal connections to its $t_1$ state.
  *   **Relevant Argument:** Does diachronic identity require spatiotemporal continuity?
  *   **Endurantist Prediction:** $O$ at $t_1$ is numerically identical to $O$ at $t_3$. Gaps in existence do not break identity if the substance is the same.
  *   **Perdurantist Prediction:** $O_1$ and $O_3$ are distinct objects. A "worm" with a gap is two worms. Causal connection does not constitute identity.
  *   **Adjudication:** If intuition strongly favors "One Object," Endurantism gains ground. If intuition favors "Two Objects," Perdurantism gains ground.

  ### B. The Heraclitean Rock (No De Re Modals)
  *Scenario:* An object exists about which no *de re* modal claims are true (no essences, no "could have been bent"). Only categorical facts about what *is* the case at each time hold.
  *   **Relevant Argument:** Is the Endurantist/Perdurantist distinction purely modal (about how objects *could* persist) or categorical (about how they *are*)?
  *   **Endurantist Prediction:** The distinction remains. Even without modals, the *structure of instantiation* differs (relation to time vs. part-to-whole). The rock is still wholly present.
  *   **Perdurantist Prediction:** The distinction collapses. Without modal profiles (counterparts), "wholly present" vs. "temporal part" becomes an untestable notational variant.
  *   **Adjudication:** If the debate dissolves here, the original dispute was largely modal. If it persists, it is about categorical ontology.

  ### C. Interval-Only Properties (Motion)
  *Scenario:* Explaining how an object possesses "velocity" at an instantaneous limit.
  *   **Relevant Argument:** Can velocity be intrinsic to an instant without referencing temporal parts?
  *   **Endurantist Prediction:** Velocity is a primitive causal power of the wholly present object, defined by the derivative of its time-indexed position. It does not require the object to *be* extended in time.
  *   **Perdurantist Prediction:** Velocity is the slope of the worm's worldline. To attribute it to an instant is to reference the shape of the temporal parts surrounding that instant. The Endurantist is secretly borrowing 4D machinery.
  *   **Adjudication:** If the Endurantist cannot define instantaneous velocity without referencing a neighborhood of times, they are covert Perdurantists.

  ### D. The Translation Test
  *Scenario:* A formal scheme translates every Endurantist sentence into a Perdurantist sentence (and vice versa) preserving truth values, except one side uses primitive "wholly located at" and the other "is a temporal part of."
  *   **Relevant Argument:** Does inter-translatability entail verbalism?
  *   **Endurantist Prediction:** The dispute is **not** verbal. The translation maps truths but loses the *grounding* explanation. "Wholly present" explains unity; "temporal part" explains change. You cannot translate the explanation, only the claims.
  *   **Perdurantist Prediction:** The dispute **is** verbal (or trivial). If all truth conditions map, the "residue" is merely emotional attachment to the word "substance." There is no fact of the matter left to discover.
  *   **Adjudication:** This rests on whether one believes in "structure" beyond "truth conditions."

  ### E. The Developmental Study (Stipulated)
  *Scenario:* Cross-cultural study shows children track objects by spatiotemporal continuity (3D tracking) and never by stages. Adult verdicts on fission split by culture.
  *   **Relevant Argument:** Does cognitive architecture track metaphysical truth?
  *   **Endurantist Prediction:** This is evidence for Endurantism. Our cognitive grip on "object" is a grip on substance. If children are natural Endurantists, that is the default metaphysical stance.
  *   **Perdurantist Prediction:** This is irrelevant to metaphysics. Cognitive tracking is about utility for survival, not ontological structure. Adult cultural splitting proves "persistence" is a conceptual scheme, not a mind-independent fact.
  *   **Adjudication:** If cognitive science is deemed irrelevant to metaphysics, this crux is void. If deemed relevant, Endurantism wins the "default" status.

  ## 4. CLOSING ASSESSMENT
  *We agree to the following summary of the dialectical situation.*

  1.  **Verbal Elements:** A significant portion of our historical argument has been verbal. Specifically, disputes over the definition of "persistence" and the counting of "objects" in cases of fission often reduce to a choice of conceptual scheme. We acknowledge that if the Translation Test succeeds perfectly, the dispute is merely notational.
  2.  **Substantive Elements:** The dispute remains substantive regarding **coincidence** (can two things be in the same place?) and **modality** (what are the truth conditions for counterfactuals about the object?). The Endurantist is committed to a stricter notion of identity that forbids branching; the Perdurantist is committed to a mereology that allows overlapping entities. These are not translatable without loss.
  3.  **Stalemate Admission:** We acknowledge that, given our shared stipulations (Eternalism, Real Change), neither side possesses a knock-down argument against the other's core machinery (Time-Indexed Properties vs. Temporal Parts). The choice between us is currently underdetermined by logic and empirical data. It rests on theoretical virtues: The Endurantist prioritizes **Substantial Unity**; The Perdurantist prioritizes **Mereological Simplicity and Spacetime Integration**. We agree to cease arguing as if the other side is logically incoherent and argue instead about which theoretical virtue is more valuable.

  ***

  **Confidence Rating:** 85%
  **Least Sure Claim:** Section 3, Crux B (The Heraclitean Rock).
  *Reasoning:* It is philosophically contentious whether an object can be stripped of all *de re* modal properties while remaining an "object" in a sense that allows the 3D/4D debate to persist. If modality is removed, it is possible the distinction collapses entirely more than the Endurantist prediction allows, making the "Substantive" verdict in the Closing Assessment too generous to the Endurantist.
