      *   *Least Sure Claim:* Probably the verdict on the Translation Test. Philosophers disagree deeply on whether inter-translatability implies verbalism.

  8.  **Final Polish:** Ensure the "Voice" in the table sounds distinct. Endurantist should sound like they care about *substance*; Perdurantist like they care about *structure/parsimony*. Ensure the Cruxes have clear "Predictions."

  *(Self-Correction during drafting)*: I initially thought about bringing in presentism, but the prompt stipulates Eternalism. I must ensure the Endurantist isn't a Presentist. They are an Eternalist Endurantist (a la Lowe or some readings of Aristotle). This makes the "Temporary Intrinsics" argument the main battleground.
  *Refining the "Heraclitean Rock":* If no de re modals are true, the "modal argument for perdurantism" (Sider) loses force. I need to make sure the statement reflects that this specific crux tests *whether* the debate is modal.
  *Refining the "Translation Test":* This is the "Quinean" worry. I need to make sure the Endurantist has a response other than "it just feels different." The response should be about *grounding*.

