      *   *Claim 2 (Wholly Present):* Admit "wholly present" is likely primitive for Endurantists. Perdurantists agree it's intelligible but deny it applies to persisting objects.
      *   *Claim 3 (Time-Indexed Properties):* Endurantists admit they use them (or adverbial equivalents). Perdurantists admit this isn't logically incoherent, just ontologically costly/redundant compared to temporal parts.
      *   *Claim 4 (Coincidence):* Both agree 4D handles coincidence (statue/lump) via divergence of temporal parts more easily. Endurantists accept coinciding objects are costly but not impossible.
