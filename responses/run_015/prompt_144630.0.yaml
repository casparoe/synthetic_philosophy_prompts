          *   Perd: Discontinuous worm. Two distinct worms? Or one gunky worm with gaps? Usually, Perd treats gaps as distinct objects unless causal connection is strong.
          *   Prediction: End says "One object." Perd says "Two objects causally connected."
      *   *The Heraclitean Rock (No de re modals):*
          *   If modals are stripped, does the distinction collapse?
          *   End: Still distinct because *instantiation* structure differs (relation to time vs. part to whole).
