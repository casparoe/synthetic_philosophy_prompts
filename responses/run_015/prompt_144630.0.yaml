          *   Residue: The primitive notion itself.
      *   *Developmental Study (Children/Culture):*
          *   End: If children track continuity, that supports primitive identity (3D).
          *   Perd: Cognitive tracking $\neq$ metaphysical structure. Adults splitting on fission shows conceptual flexibility, not truth.
          *   Prediction: End claims evidence for 3D; Perd claims evidence for cognitive utility only.

  6.  **Drafting Section 4: Closing:**
      *   What is verbal? The labeling of "persistence."
      *   What is substantive? The handling of coincidence, modality, and the ontological status of the "present."
      *   Stalemate: Acknowledge that without a tie-breaker (like a decisive argument against time-indexing or temporal parts), the choice is theoretical virtue-based.

  7.  **Review and Refine:**
