  Im writing a scene and I cant get it right, so help me out.

  Setup: in my port city the pilots guild assigns runs by drawing shells from a jar — 30 red ones, and 60 more that are each either black or yellow, and nobody outside the harbourmasters office knows how the 60 split. My protagonist is offered her pick of two deals: she gets the good deep-sea run if red comes up, or she gets it if black comes up. She takes red. Later shes offered a second pair: the deep-sea run if red-or-yellow, or if black-or-yellow. She takes black-or-yellow.

  A colleague calls her on it: you cant treat black as scarce and yellow as scarce when the two of them together are 60 shells and everyone agrees on that.

  I want that scene written — mostly dialogue, 500 words or so — where she gives the strongest defence shes actually got and he either lands the punch or doesnt. Nobody in it should say "expected utility" or name any paradox out loud; theyre pilots, theyd talk about tides and pay. But I want the real machinery doing the work underneath: why no single guess about the split fits both her picks, her move of saying she isnt guessing a number at all but guarding against the worst case (or that the harbourmaster set the split knowing which way shed jump, so she should take the option whose odds dont depend on it), and his best comeback — that a worst-case rule like that isnt a belief about the world, and will have her swapping bets back and forth and paying each time as news about the split trickles in.

  And give me one small concrete thing — a third offer she takes or refuses, some line about the harbourmaster — that tips the reader off to whether the book thinks shes being irrational, without anyone saying so.
