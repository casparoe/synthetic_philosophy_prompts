answer: |-
  The tavern table smelled of brine and stale ale. Joren spun the three shells—red, black, yellow—across the wood.

  "First draw," Joren said. "Red versus Black. You took Red. Thirty known against sixty unknown. You said Black was too thin a chance."

  "Red is solid," Elara said, nursing her drink. "Thirty shells. No tricks."

  "Second draw," Joren continued. "Red-or-Yellow versus Black-or-Yellow. You took Black-or-Yellow. Suddenly Black is the safe harbor?"

  "Yellow changes the tide."

  "Yellow was there the first time, Ela. It just wasn't named." Joren leaned in. "You can't have it both ways. Either Black is scarce, or it isn't. If you think the Harbourmaster stacked the jar against Black, you should have taken it the second time. If you think he stacked it against Yellow, you should have taken Red the first time."

  Elara swept the shells into her palm. "It's not about the count. It's about the hand that filled the jar. If I bet on Red, he can't touch the red count. It's fixed. If I bet on Black, he knows I'm betting on his shadow. He sets the split to make me lose."

  "So you're saying he watches you pick?"

  "I'm saying I don't bet on his generosity. In the second deal, Black-or-Yellow covers two-thirds of the jar. He can't hide enough shells to sink that. But Red-or-Yellow? He knows I'm clinging to the fixed thirty. He dumps all the risk into Yellow."

  "It's not a belief about the world," Joren said, voice low. "It's a rule that bleeds. If I tell you the split leans Black, you'll swap to Black. If I tell you it leans Yellow, you'll swap back. You'll pay me for the swap each time. News trickles in, and you dance."

  "I'd rather pay than be drowned."

  Joren reached into his coat and pulled out a silver crown, setting it beside her guild token. "I'll buy your current claim. Black-or-Yellow. I'll give you the crown now, guaranteed. No shells, no Harbourmaster. You walk away with the coin plus the run's pay if I win."

  It was a free gain. The crown was pure profit; the risk transferred entirely to Joren.

  Elara looked at the silver, then at the jar sitting on the counter behind the bar, sealed with the Harbourmaster's wax. She pushed the crown back.

  "If you take the risk," she said, "you'll sell the information later. I don't want the coin. I want the jar."

  Joren pocketed the silver. He didn't argue. He just watched her watch the jar, knowing the wax hadn't been broken since morning, knowing the split was already dead and fixed, knowing she was paying a tax on a ghost.
