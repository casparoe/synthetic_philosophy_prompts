answer: |-
  The editor's margin note is correct. To say that identity "depends on what you mean by same" is to admit that philosophy has nothing to say about the world, only about our dictionaries. But when a museum registrar needs to insure a vessel, or a climatologist needs to know if data from 1920 is comparable to data from 2020, dictionaries do not suffice. We need a verdict. Here is the principle that generates one: **An artifact remains itself not because it keeps its parts, but because it sustains an unbroken causal chain of maintenance dedicated to its specific function.**

  This principle prioritizes history and purpose over matter. It treats a ship not as a collection of wood, but as a node in a network of human activity. Let us run this through the four variants.

  In the classic case, timbers are replaced one by one over decades while the ship sails. The old wood is burned. Here, the verdict is straightforward. The causal chain of maintenance is unbroken; every replacement is an act of preservation aimed at keeping the ship seaworthy. The function never lapses. The burning of the old timber is irrelevant because the timber was never the ship; it was merely the temporary substrate of the ship's function. The vessel in the harbor is Theseus's ship because it is the direct descendant of the original via the process of upkeep.

  The reassembly variant complicates this. Here, the removed timbers are saved and built into a second hull the moment the last original plank is removed from the sailing vessel. We now have two candidates: the sailing ship (continuous function, new matter) and the reassembled ship (original matter, discontinuous function). The strongest argument for the reassembled ship is constitutional: it is made of the very stuff that sailed with Theseus. It feels like a resurrection. However, under our principle, it fails. The causal chain of maintenance was directed at the sailing vessel, not the pile of stored wood. The reassembled ship is a replica constructed from original parts, akin to building a house from the bricks of a demolished historic home. It has historical value, but it does not have identity.

  This solves the double-counting problem. If we claimed both were the ship, we would face a logical cost: one object becoming two violates the transitivity of identity. If A equals B, and A equals C, then B must equal C. But the sailing ship and the reassembled ship are clearly distinct objects occupying different spaces. By anchoring identity in the continuous causal process rather than the matter, we avoid this duplication. There is only one lineage of maintenance. The reassembled ship is a new object born of old parts, not the survival of the old object.

  Consider the overnight swap. Every timber is stripped at dusk and replaced by dawn with prefabricated duplicates; the originals are stacked in a shed. Is this different from the gradual replacement? Intuitively, the speed feels suspicious. It looks like destruction and replacement rather than maintenance. But rate of change is not ontologically significant unless it interrupts the function. If the ship remains registered, insured, and ready to sail, the causal chain of maintenance holds. The only difference between this and the gradual case is epistemic: in the gradual case, we can watch the continuity happen. In the overnight case, we must trust the records. If the maintenance crew intends to preserve the ship, and the ship's capacity to sail is uninterrupted, the identity holds. The shed full of wood is, again, just raw material.

  The dispersed case is the hardest. The original timbers are planed down and laid as the floor of a temple. The harbor holds a new-timber ship; the temple holds the original matter. Is the ship now a scattered object? Our principle says no. A ship is defined by a specific functional role: sailing. A floor cannot sail. The causal chain of maintenance aimed at "ship-ness" ended when the wood was planed and laid. The matter persists, but the artifact does not. To claim the ship is now a scattered object is to confuse constitution with identity. It relies on the intuition that an object must be in one piece to be there at all. This intuition is correct, but not for metaphysical reasons. It is functional. A scattered ship cannot perform the work of a ship. Therefore, the ship in the harbor is Theseus's ship, provided the maintenance chain remained unbroken during the swap. The temple floor is a memorial, not the vessel.

  This brings us to the process option—the thought that a ship is closer to a flame or a river than to a rock. Does this dissolve the puzzle? It clarifies it, but it does not dissolve it. Viewing the ship as a process relocates the puzzle from "where is the matter?" to "where are the boundaries of the process?" A flame persists as long as the combustion continues; if you extinguish it and light a new match, even with the same fuel, it is a new flame. Similarly, the ship persists as long as the maintenance process continues. This relocates the vagueness to the definition of "maintenance." Does a decade of neglect extinguish the process? Yes. Does changing the engine from sail to steam extinguish it? Perhaps, if the functional role shifts from "sailing vessel" to "motor vessel." The process view does not eliminate hard cases, but it tells us exactly where to look for the answer: in the history of interventions, not the chemistry of the wood.

  We must also resist the cheap version of the "no fact of the matter" response. To say "identity is vague" is often a way of avoiding responsibility. There is a fact of the matter, but it is institutional rather than mystical. Who is entitled to say what? The registry and the insurer. They are the arbiters of the causal chain. If the registry says the ship is the same, and the insurance policy covers the continuous hull regardless of material replacement, then for all practical and philosophical purposes, it is the same ship. The "no fact" view only holds if the institutions disagree. If the registry says one thing and the insurer another, *then* we have a genuine indeterminacy, but it is a legal conflict, not a metaphysical mystery.

  Finally, consider the century-long temperature series. Instruments change, sites move, observers die. Each replacement requires a correction to keep the numbers comparable. Is it one record? Under our principle, yes. The identity of the record is secured by the continuity of the causal process of calibration and the intent to measure the same phenomenon: global climate trends. The matter (the mercury, the glass, the site) is irrelevant. The function (tracking temperature over time) is maintained through a chain of corrections that link the new instruments to the old.

  What would have to happen for it to stop being one record? The causal chain would have to break. If a generation of data is lost without calibration bridges, or if the intent shifts from measuring ambient air temperature to measuring surface heat islands without adjustment, the process is interrupted. The record would become two distinct series, stitched together by approximation rather than continuity. The Ship of Theseus is not a paradox about wood; it is a manual for how we sustain meaning through change. Whether it is a vessel, a laboratory, or a dataset, identity is not what you keep; it is what you do.
