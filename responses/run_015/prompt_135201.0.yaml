      *   **Speaker B (Paraconsistentist):** Let's call him *Marcus*. He needs to argue that while logic shouldn't explode (ex contradictione quodlibet), we shouldn't ontologically commit to "true contradictions." It's a tool for management, not a description of reality. He likely leans towards pragmatism/instrumentalism.

  3.  **Key Philosophical Concepts to Weave In:**
