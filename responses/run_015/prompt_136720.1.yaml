answer: |-
  # Futarchy Gatekeeper Protocol (FGP-v1.2)
  **Purpose:** Evaluate proposals to replace committee voting with decision markets (futarchy).
  **Execution Time:** 45 Minutes.
  **Operators:** Governance Staff (2 minimum).
  **Inputs:** Proposal Document, Metric Definition, Stakeholder List.

  ---

  ## Phase 1: The Five Gates
  *Proceed sequentially. A "Hard Stop" ends the evaluation immediately (Rejection). An "Escalation" pauses evaluation for Values Committee review. A "Pass" proceeds to the next gate.*

  ### Gate 1: Value Exogeneity
  **Question:** Is the proposed metric a proxy for an agreed-upon institutional value, or is the definition of the metric itself a subject of normative dispute?
  *   **Pass:** The metric measures an outcome (e.g., "downtime," "revenue") that serves a pre-agreed goal (e.g., "reliability," "solvency").
  *   **Escalation:** The metric *is* the value (e.g., "reputation," "fairness," "impact"). Disagreement on how to calculate the metric reflects disagreement on institutional mission.
  *   **Hard Stop:** The metric conflicts with a standing constitutional constraint (e.g., "profit" in a non-profit charter).
  *   **[JUDGMENT REQUIRED]:** Determining whether a metric is a neutral proxy or a normative definition requires interpreting stakeholder intent.

  ### Gate 2: Resolution Integrity (Contamination Check)
  **Question:** Can the metric be measured for the *chosen* path without the betting mechanism itself altering the outcome or the measurement?
  *   **Pass:** Measurement is external, automated, or physically constrained (e.g., sensor data, third-party audit).
  *   **Hard Stop:** Measurement relies on self-reporting by actors who hold market positions, or the act of measuring requires resources that distort the outcome (e.g., "cost savings" measured by budget cuts that degrade the product being sold).
  *   **[JUDGMENT REQUIRED]:** Assessing the degree of influence traders have on the outcome variable.

  ### Gate 3: Counterfactual Clarity
  **Question:** Are the policy options mutually exclusive and clearly defined such that the market is pricing distinct causal paths?
  *   **Pass:** Options are discrete (e.g., Vendor A vs. Vendor B vs. Vendor C).
  *   **Hard Stop:** Options are continuous, overlapping, or allow for post-decision blending that makes resolving "which policy was in effect" impossible.
  *   **[JUDGMENT REQUIRED]:** Determining if policy implementation will remain distinct enough for market resolution.

  ### Gate 4: Market Viability (Liquidity & Expertise)
  **Question:** Are there at least 10 qualified stakeholders with capital/skin-in-the-game who possess private information relevant to the metric?
  *   **Pass:** Identified list of experts/traders exists; capital allocation rules are clear.
  *   **Hard Stop:** The expertise is concentrated in a single individual (monopoly on truth) or the timeline is too long for capital to remain locked (e.g., >5 years without interim liquidity).
  *   **[JUDGMENT REQUIRED]:** Estimating "qualified expertise" and "willingness to wager."

  ### Gate 5: Goodhart Corruption Risk
  **Question:** Does maximizing this metric create perverse incentives that damage the institution in ways the metric does not capture?
  *   **Pass:** The metric is robust to gaming (e.g., "system uptime" is hard to fake without actually fixing the system).
  *   **Escalation:** High risk of gaming that requires ethical guardrails (e.g., "publication count" may encourage salami-slicing).
  *   **Hard Stop:** Maximizing the metric directly undermines institutional survival or ethics (e.g., "cost reduction" that mandates safety violations).
  *   **[JUDGMENT REQUIRED]:** Predicting second-order behavioral effects of incentivizing the metric.

  ---

  ## Phase 2: Procedure Execution on Proposals

  ### Proposal (a): Climate-Adaptation Infrastructure Grants
  *   **Mechanism:** Select 1 of 3 grants.
  *   **Metric:** Predicted ten-year flood-damage reduction in dollars.
  *   **Evaluation:**
      *   **Gate 1 (Value):** Pass. "Flood damage reduction" is a proxy for "community safety/resilience," which is agreed upon.
      *   **Gate 2 (Resolution):** Pass. Damage can be assessed by independent insurance/audit data after 10 years.
      *   **Gate 3 (Counterfactual):** Pass. Grants are mutually exclusive projects.
      *   **Gate 4 (Viability):** **Condition Pass.** 10-year lockup is long, but eligible traders (actuaries, engineers) exist. Requires interim liquidity structure.
      *   **Gate 5 (Goodhart):** Pass. Difficult to game flood physics via betting.
  *   **Result:** **PASS** (Conditional on interim liquidity structure).

  ### Proposal (b): Mandatory Negative-Results Publication Policy
  *   **Mechanism:** Adopt Policy vs. Maintain Status Quo.
  *   **Metric:** Predicted five-year peer-reputation index.
  *   **Evaluation:**
      *   **Gate 1 (Value):** **ESCALATION.**
      *   **Reasoning:** "Peer-reputation index" is not an empirical outcome; it is a normative construct. There is no external "reputation" meter. The consortium must *define* what constitutes reputation (citations? surveys? media mentions?). Defining what the institution values (reputation) is a Values Committee mandate, not an empirical market input. Futarchy requires values to be exogenous; here, the metric *is* the value definition.
      *   **Gate 2-5:** Skipped due to Escalation.
  *   **Result:** **ESCALATION TO VALUES COMMITTEE.**

  ### Proposal (c): Internal Data-Platform Vendor Procurement
  *   **Mechanism:** Select Vendor A, B, or C.
  *   **Metric:** Predicted two-year system-downtime hours.
  *   **Evaluation:**
      *   **Gate 1 (Value):** Pass. "Uptime" proxies for "operational efficiency."
      *   **Gate 2 (Resolution):** Pass. System logs are automated and immutable.
      *   **Gate 3 (Counterfactual):** Pass. Vendors are distinct contracts.
      *   **Gate 4 (Viability):** Pass. IT staff and vendor reps have expertise and can wager.
      *   **Gate 5 (Goodhart):** Pass. Vendors cannot easily fake downtime logs without breach of contract; betting does not reduce uptime.
  *   **Result:** **PASS.**

  ---

  ## Phase 3: Analysis of Unwelcome Result (Proposal b)

  **The Unwelcome Result:** Proposal (b) triggered an **Escalation** at Gate 1 (Value Exogeneity).

  **Why the Sponsor's Preference Cannot Override:**
  The sponsor may argue that "reputation is obviously good" and wish to proceed to market immediately. However, the Gatekeeper Protocol identifies a structural flaw in the mechanism, not merely a risk. Futarchy functions by separating *values* (the metric to maximize) from *beliefs* (the probability of achieving the metric).

  In Proposal (b), the "metric" (reputation index) is not an observable physical state like "downtime" or "flood damage." It is an aggregation of subjective judgments. To create the index, the consortium must decide *whose* opinion matters and *what* behaviors are rewarded. This is a values decision. If the consortium allows the market to determine the metric's composition, the market is no longer optimizing for institutional values; it is *defining* them via price discovery. This collapses the distinction between governance and trading.

  The Values Committee must first codify what "reputation" means (e.g., "weighted citations from top-10 journals" vs. "policy adoption rates"). Only once the metric is empirically fixed and normatively ratified can a market bet on *how to achieve it*. The sponsor cannot bypass this because a prediction market cannot resolve a bet on a variable that does not yet exist objectively.

  ---

  ## Phase 4: Structurally Unsuited Decision Classes

  Based on the mechanics of the FGP-v1.2, the following two classes of institutional decisions are unsuited for futarchy regardless of data quality:

  **1. Constitutional or Ethical Boundary Decisions**
  Decisions that define the moral or legal constraints of the institution (e.g., "Should we accept funding from defense contractors?" or "Do we prioritize equity over efficiency?").
  *   **Reason:** These fail Gate 1 (Value Exogeneity). There is no exogenous metric to maximize; the decision *is* the definition of the value system. Putting ethics to a market price commodifies the constraint and invites corruption (Gate 5).

  **2. Crisis or Emergency Response Decisions**
  Decisions requiring immediate action where the timeline for market resolution exceeds the window of relevance (e.g., "Respond to an active cybersecurity breach" or "Emergency pandemic lockdown").
  *   **Reason:** These fail Gate 4 (Market Viability/Timeline). Prediction markets require time to aggregate information and price discovery. If the decision must be made in hours but the outcome metric resolves in months, the market cannot inform the decision. The liquidity lock-up risk is too high, and the feedback loop is too slow to correct course.
