  **DISPOSITIONGUARD ONTOLOGICAL ASSURANCE LTD.**
  **TERMS OF COVERAGE AND LIABILITY WAIVER**

  **1. Asset Classification and Intrinsicity.**
  Coverage is strictly limited to Dispositions verified as Intrinsic Properties of the Bearer. Clients asserting Extrinsic Dispositions (e.g., key-lock compatibility or weight) must purchase Rider E-xt. DispositionGuard reserves the right to reclassify any claimed Power as a mere Categorical Base if microstructural evidence suggests the disposition lacks causal efficacy independent of physical structure. Clients warrant that the insured property resides wholly within the object, unaffected by external laws of nature unless explicitly declared.

  **2. Finkish Interruption Liability.**
  In the event of a "Fink," defined as a Stimulus Condition that causes the immediate cessation of the Disposition prior to Manifestation, coverage is void. Clients acknowledge that if a live wire loses its conductivity precisely upon being touched, the Disposition did not fail; it ceased to exist. No compensation is provided for Ontological Withdrawal triggered by the very conditions intended to test the asset. The burden of proof lies with the Client to demonstrate the Disposition persisted through the triggering event.

  **3. Masking and Interference Exclusions.**
  Claims are denied where Manifestation is prevented by external interferents (Masks) while the Disposition remains intact. For example, if a fragile vase is wrapped in bubble wrap and survives impact, the Fragility is deemed masked, not absent. Clients bear full responsibility for isolating Bearers from antidotes, packaging, or environmental dampeners that obscure causal powers without removing them. Failure to strip away masking conditions prior to testing constitutes negligence.

  **4. Multi-Track Variance Protocols.**
  Dispositions exhibiting multiple Manifestation Conditions (e.g., a substance toxic to humans but not rats) require Multi-Track Premiums. Standard policies cover only Single-Track uniformity. If a Disposition manifests differently under divergent Stimuli, the Client warrants that these are unified Powers rather than distinct categorical properties clustered under a single label. Inconsistency in manifestation across contexts may be interpreted as a lack of unified dispositional identity.

  **5. Circularity and Conditional Analysis Waiver.**
  Client waives the right to define the Disposition solely via its Stimulus and Manifestation Condition. Acknowledging the Circular Analysis Problem, Client agrees that defining Fragility as "breaking when struck" presupposes the power it seeks to explain. DispositionGuard assumes a Realist stance; tautological definitions void the contract as they fail to identify a distinct ontological asset. Definitions must reference the underlying causal basis, not merely the expected outcome.

  **6. Categorical Base Indemnity.**
  In jurisdictions adhering to Categoricalism, DispositionGuard is not liable for Powers that reduce to static microstructures. If the local metaphysical laws dictate that all Dispositions are merely Humean regularities without underlying causal powers, this contract is null. Coverage requires a universe permitting irreducible Potencies. Clients in deterministic categorical regimes are advised to insure structural integrity rather than causal potential.

  **7. Ownership and Collective Instantiation.**
  Title to the Disposition resides with the Bearer, not the Owner of the Bearer. In cases of Collective Instantiation (e.g., a team's disposition to win), liability is prorated among individual members. DispositionGuard does not insure emergent group dispositions unless supervenience upon individual member powers is rigorously demonstrated. Disputes regarding who owns a disposition—the object or the possessor—will be settled via intrinsicity assessment.

  ***

  **Post-Script**
  This parody relies on treating dispositions as separable assets, a liberty taken to facilitate the legal metaphor. It assumes masks are necessarily extrinsic (contested by some internal mask theories) and conflates antidotes with masks for brevity. The central joke relies on the Conditional Analysis of dispositions being insufficient, a view championed by Mumford and Martin against Lewis. I would revise the framing if Dispositional Essentialism were proven incompatible with causal laws, or if a robust account of finkish dispositions demonstrated they do not require the disposition to vanish. Finally, if categoricalism successfully reduces all powers to structural properties without loss of explanatory power, the entire premise of insuring "potencies" collapses.
