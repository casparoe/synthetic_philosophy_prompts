answer: |-
  **Scenario**

  The model is a 500-million-parameter transformer trained exclusively on ten years of text-based maintenance tickets from the transit authority. It was never fed schematics, coordinates, or line diagrams. The junior researcher identified a specific subspace within the model's residual stream by extracting activation vectors for every station name mentioned in the corpus. Without looking at a map, she computed pairwise distances between these vectors and clustered them. The resulting topology matched the physical subway lines with ninety percent accuracy. Crucially, she used this geometric structure to predict three transfer tunnels that were undocumented in the training logs but existed in reality; engineering schematics later confirmed them. However, when the senior engineer ablated this specific subspace—zeroing out the activations carrying the map information—the model's loss function did not change. The model predicts maintenance issues equally well using text co-occurrence alone. The map structure is present and accurate, but it is causally idle regarding the model's actual task. The auditor must decide if the report can state the model "represents" the network.

  **Dialogue**

  "Look at the clustering," the junior researcher said, pointing at the projection. "It found the lines without ever seeing a map. It knows the topology."

  "It's epiphenomenal," the senior engineer replied. "I killed that subspace. Perplexity didn't budge. The model doesn't use the map to predict tokens; it just uses word co-occurrence."

  "But the structure is there," she insisted. "It predicted the undocumented transfers. That's not noise."

  "Correlation isn't representation," he said. "Training didn't select for this. It's a ghost."

  The auditor closed her notebook. "For the model's function, it's nothing. For our safety audit, it's something. We can't say it knows the map, but we can say the map is recoverable."

  ***

  **Analysis**

  **Verdicts and Driving Features**
  *   **(A) Causal-Historical:** **No.** The driving feature is **causal idleness**. Because ablating the state does not degrade performance, the training process did not select for tracking the map; the structure is a byproduct, not a function.
  *   **(B) Structural:** **Yes.** The driving feature is **isomorphism**. The internal relations (vector distances) systematically mirror the external relations (track topology) regardless of utility or history.
  *   **(C) Instrumental:** **Yes for the auditor, No for the model.** The driving feature is **agent-relative utility**. The state helps the auditor predict safety risks (undocumented transfers) but does nothing for the model's token prediction.

  **The Collapse Feature**
  The single feature whose alteration collapses the disagreement is **causal efficacy**. If the state were *not* idle (i.e., ablating it increased loss), Account (A) would shift to **Yes** (training selected for it), and Account (C) would shift to **Yes for the model**. Consensus would emerge that the model represents the map. As long as the state remains idle, the three accounts diverge.

  **Attack and Defense**
  The defender of Account (A) (the Engineer) would attack Account (B) by arguing **gerrymandering**: any high-dimensional space can be projected to look like a map if you search hard enough. The case survives this attack because of the **blind prediction protocol**. The structural relations were used to predict *unseen* physical facts (the undocumented transfers) before verification. This pre-specification rules out post-hoc fitting.

  **Verbal vs. Substantive**
  The dispute is **substantive**. It is not merely about the word "representation," but about how the system must be treated for safety. The observation that settles the practical stakes is **predictive validity on out-of-distribution failures**: if relying on the map-structure prevents accidents that text-patterns miss, the instrumental value (Account C) mandates treating it as a representation for audit purposes, regardless of causal history.

  **Auditor's Report**
  The auditor should write: "The model contains a structural isomorphism of the subway network that is causally inert for token prediction but instrumentally valid for safety auditing. Do not claim the model understands the map; claim the map is recoverable from the model for risk assessment."
