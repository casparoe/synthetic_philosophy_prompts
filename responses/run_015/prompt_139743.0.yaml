answer: |-
  This is a brilliant brief. You have correctly diagnosed why the standard Dollar Auction feels unsatisfying: it conflates structural entrapment with social pressure and emotional attachment. To teach this well, you need to disentangle the wires.

  Given your constraints (village hall, no real money, mobility issues, 90 minutes), here is a session plan designed to isolate the three drivers you identified, plus the two nuances (exit options and rivalry).

  **Session Title:** Throwing Good Money After Bad
  **Duration:** 90 Minutes
  **Participants:** 15 (mixed ability/mobility)
  **Currency:** "Hall Points" (HP). Printed on slips of paper.
  **Payoff:** The person with the most HP at the end wins a large bar of chocolate (or a bottle of wine). This creates value without cash changing hands.

  ---

  ### Materials Needed
  *   Printed Hall Points (about 500 per person, denominations of 10, 50, 100).
  *   A large visible timer (phone or tablet projected, or a kitchen timer).
  *   Three dice.
  *   Whiteboard/Flipchart.
  *   Printed worksheets for the "Effort Task" (simple word searches or copying a paragraph of text).
  *   A "Bank" box for collecting points.

  ---

  ### Minute-by-Minute Plan

  #### 00:00 – 00:10: Introduction & Framing
  *   **Welcome:** Briefly state the topic: *Escalation of Commitment*. Why do we stick with failing projects?
  *   **The Hook:** Tell the story of the boat (yours, anonymised slightly if you prefer, but your honesty will help). "Three years, £30k, surveyor says £15k more. One brother says stop, one says go. Why is 'stop' so hard?"
  *   **The Rules:** Explain Hall Points. They are worth nothing except for the prize at the end. Hoarding them is the goal.
  *   **Ground Rule:** "In these games, you are allowed to lose. In fact, losing is how we learn. If you go bust, you sit out and observe."

  #### 00:10 – 00:30: Round 1 — The Public Trap (Face + Structure)
  *   **Goal:** Isolate the *Structural Trap* and *Face*.
  *   **Setup:** Two volunteers come to the front. The rest of the class are "Observers".
  *   **The Prize:** 100 HP.
  *   **The Rules:**
      1.  Bids start at 10 HP.
      2.  Bids must increase by 10 HP.
      3.  **Crucial Rule:** The highest bidder wins the 100 HP. *Both* the highest bidder and the second-highest bidder must pay their final bid to the Bank.
      4.  Bidding is public (raise hands/call out).
  *   **The Twist:** Before starting, tell the Observers: "Watch the moment the bids pass 50 HP. Note their body language."
  *   **Play:** Run it until bids hit ~120 HP or someone folds. Usually, this ends quickly because the social pressure is high.
  *   **Debrief (2 mins):** Ask the losers: "At 60 HP, why did you bid 70?" (Answer: To avoid losing the 60 already bid). Ask the room: "Did the audience make it harder to quit?"

  #### 00:30 – 00:55: Round 2 — The Sweat Equity (Sunk Cost + Soft Exit)
  *   **Goal:** Isolate the *Already-Spent Feeling* and test *Softening the Exit*.
  *   **Setup:** Everyone plays individually at their tables.
  *   **Phase 1 (The Sunk Cost):** Hand out a worksheet (word search or text copy). "You have 5 minutes. Complete this to earn 50 HP."
      *   *Why:* This makes the points feel *earned*, not given. Losing them will hurt more.
  *   **Phase 2 (The Escalation):** "You now hold 50 HP. You can invest this 50 HP into a 'Venture'. If the Venture succeeds, you get 200 HP. If it fails, you get 0."
      *   *The Catch:* To find out if it succeeds, you must pay the 50 HP now.
      *   *The Probability:* Roll a die. 1-4 = Fail. 5-6 = Success. (Expected value is negative, rational choice is to keep the 50 HP).
  *   **Phase 3 (The Soft Exit):** *Before* they hand over their 50 HP, announce: "Alternatively, you can take a 'Buyout'. You hand back your worksheet, and I give you 25 HP. You lose half your effort, but you walk away safe."
  *   **Play:** Give them 2 minutes to decide. Collect the choices. Roll the dice for those who invested.
  *   **Debrief (3 mins):** Count hands. How many invested despite the bad odds? How many took the Buyout?
      *   *Key Question:* "Did having a way out (the Buyout) make it easier to quit, or did it just feel like a consolation prize while you still wished you'd won the 200?"

  #### 00:55 – 01:15: Round 3 — The Solo Grind (No Rival)
  *   **Goal:** Isolate *Internal Commitment* (The Boat Scenario). No opponent, just you vs. nature.
  *   **Setup:** Everyone starts with 100 HP.
  *   **The Scenario:** "You own a boat worth 200 HP. It is currently broken (worth 0). You can pay 20 HP for a repair attempt."
  *   **The Mechanic:**
      1.  Pay 20 HP to the Bank.
      2.  Roll a die.
      3.  On 5 or 6: Boat is fixed! You get 200 HP. Game over.
      4.  On 1-4: Boat is still broken. You can pay another 20 HP to try again, or stop and keep your remaining HP.
  *   **Play:** Run for 10 minutes. People will stop at different times.
  *   **Debrief (2 mins):** Who went bust? Who stopped after one try? Who stopped after five?
      *   *Key Question:* "There was no one bidding against you. Why did you keep paying?"

  #### 01:15 – 01:30: Final Debrief & Mapping
  *   Bring the three rounds together on the whiteboard.
  *   **Map Round 1 to Face:** "In the auction, you weren't just losing money; you were losing status. The second-place penalty makes quitting painful."
  *   **Map Round 2 to Sunk Cost:** "In the worksheet round, the points felt like *work*. We hate wasting work more than we hate losing money. Did the Buyout help? Often, it doesn't. It just gives us a 'less bad' loss to cling to while we hope for the win."
  *   **Map Round 3 to The Boat:** "This was you vs. the dice. No rival. This is the boat scenario. You aren't competing with your brother; you are competing with the hope that the *next* £5k will be the one that fixes it."
  *   **Closing:** "The fallacy isn't that you care about what you spent. It's that you treat the past spend as a reason for the future decision. The money is gone. The only question is: is the boat worth £15k *today*, not £45k?"

  ---

  ### Predictable Failures & Mitigations

  **1. The Collusion (The "Split")**
  *   **Risk:** In Round 1, two clever clogs agree to bid 10p and split the prize.
  *   **Mitigation:** Pre-empt this in the rules. "If I suspect collusion, the prize is voided." Or, make the prize indivisible (one chocolate bar). In the debrief, use this: "In real life, the boat doesn't let you split the cost with the ocean. The ocean doesn't negotiate."

  **2. The "Winner" (Irrational Escalation)**
  *   **Risk:** One participant bids 500 HP for a 100 HP prize purely to win the room.
  *   **Mitigation:** Implement a "Bankruptcy Limit". "You cannot bid more HP than you currently hold." If they go bust, they are out. This mirrors reality: eventually, the credit card maxes out.
  *   **Debrief:** Use this person. "You knew the math was wrong. What made you continue?" (Usually: "I didn't want to be the loser").

  **3. The "Bored/Skeptical" Participant**
  *   **Risk:** Someone sits back and says, "This is silly, it's just points."
  *   **Mitigation:** Acknowledge it. "You're right. It is silly. That's the point. If you feel resistance spending fake points, imagine the resistance when it's your savings and your grandfather's memory. The game is a simulation of the *feeling*, not the finance."

  **4. Mobility/Energy Issues**
  *   **Risk:** Round 1 requires volunteers at the front.
  *   **Mitigation:** If no one wants to stand, run Round 1 as a "Sealed Bid" written on paper, but read the names out loud. This keeps the *Face* element without the physical movement.

  ---

  ### What The Games Cannot Deliver (The Honest Bit)

  You asked me to be straight about the limitations. You must say this yourself in the closing debrief, because the games will fail to capture the deepest part of your problem.

  **1. The Games are Cold; The Boat is Warm.**
  The games simulate *loss aversion*. They do not simulate *grief* or *legacy*.
  *   **Say this:** "In Round 2, you earned points for 5 minutes. On the boat, you spent three years. The games can't replicate the emotional weight of 'Grandfather's Boat'. When you say 'we've already put so much in', you aren't just talking about money. You're talking about time with your brother, and memory of your grandfather. Quitting the game feels like losing points. Quitting the boat feels like betraying a memory. The fallacy is the same, but the pain is different."

  **2. The "Soft Exit" Ambiguity.**
  The game might show that a Soft Exit (selling for £3k) helps people quit. In reality, it might make you feel *worse*.
  *   **Say this:** "In Round 2, some of you took the 25 HP buyout. Did you feel relieved? Or did you feel like a failure who took the consolation prize? Selling the boat for £3k might stop the financial bleeding, but it might not stop the emotional escalation. You might still lie awake thinking 'if only we'd spent that last £15k'."

  **3. The Rivalry Distinction.**
  Round 1 shows how rivals drive escalation. Round 3 shows they aren't needed.
  *   **Say this:** "The Dollar Auction suggests you need an enemy to get trapped. Round 3 proves you don't. You and your brother aren't enemies. You are two people trapped in the same hull, looking at the same broken keel. The pressure isn't coming from him; it's coming from the gap between what you hoped the boat was, and what the surveyor says it is."

  ---

  ### Tutor's Cheat Sheet: Handling the "Wife's Suggestion" Reaction

  You mentioned your wife's suggestion (£3k sale) makes you want to continue *more*. This is **Psychological Reactance**.

  If a participant mentions this during the debrief ("Someone told me to quit and I got angry"), seize it.
  *   **The Explanation:** "When someone tells us to quit, it feels like they are telling us our past effort was wasted. To protect our past effort, we defend the future project. The £3k offer isn't just money; it's a verdict on the last three years. That is why it makes you want to fight."

  ### Final Preparation Checklist
  1.  **Print Points:** Make them look slightly official (stamps or signatures) so they feel "real".
  2.  **Test the Dice:** Ensure you have enough dice for Round 3 so people aren't waiting.
  3.  **The Prize:** Bring the chocolate/wine. Put it on the table at the start. Visible value matters.
  4.  **Your Own Head:** You are running this while living it. If you get choked up during the intro, that's fine. It validates the topic. But try to hand over the "Bank" role to a participant if you feel yourself getting too involved in the gameplay.

  Good luck. It sounds like a brilliant class, and frankly, the best way to process the boat decision might be to watch fifteen other people make the same mistake with fake money first.
