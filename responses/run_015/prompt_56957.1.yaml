      *   *Decision:* The *outcome* risk (Plurality/5) is the substantive reason to reject. The *process* risk (Random Dictator) is the procedural reason. The "Single Fact" should highlight which one trumps. The fact that we accepted IRV (manipulable) suggests we tolerate process flaws if the outcome is safe. The fact that we rejected Plurality/5 suggests we *do not* tolerate outcome flaws. The Median Rule has safe ballots but unsafe outcomes (potentially). Therefore, it fails the "Outcome Quality" test which is our highest priority.

