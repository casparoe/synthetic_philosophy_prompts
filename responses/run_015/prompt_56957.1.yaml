      *   *The Core Tension:* Is the organization more afraid of *Strategic Manipulation* (Gameability) or *Bad Outcomes* (Condorcet Losers)?
      *   *Evidence:* We accepted IRV (gameable) over Plurality (simpler). We rejected Random Dictator (strategy-proof in a sense, fair ex-ante) because it felt like dictatorship. We rejected Plurality/5 because of the *outcome* (last choice winning).
