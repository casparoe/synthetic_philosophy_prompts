  The model answer proceeds as follows. The move from local introspective error to global illusionism is not deductively valid but abductive, relying on the best explanation of why introspection fails in specific cases. While a scotoma shows introspection can fail to detect absence, illusionism requires it to falsely posit presence, which is a stronger claim requiring independent motivation beyond mere fallibility. The content of the illusion is not a non-physical property but a misrepresentation of functional or physical states as having intrinsic, ineffable qualities. This avoids positing ghostly entities but faces the collapse objection regarding the status of the illusion itself. If there is something it is like to be under the illusion, that seeming itself appears phenomenal. The illusionist must argue this seeming is merely access-conscious or representational, not phenomenal in the realist sense. If they concede the seeming is genuinely phenomenal, they collapse into reductive realism, admitting phenomenality exists but is physical. If they deny the seeming is phenomenal, they owe an account of why it feels so compelling without invoking feel. The explanatory burden peaks here. Explaining why physical processes generate the impression of phenomenality without generating phenomenality itself looks suspiciously like explaining consciousness without explaining consciousness. However, this is not fatal if the impression is treated as a cognitive judgment rather than a sensory given. The hard problem dissolves if the target is shown to be a conceptual confusion rather than an ontological datum. The cost is accepting that our most intimate self-knowledge is systematically mistaken, which is high but not higher than positing nomological danglers. Thus, the burden is the ordinary cost of naturalism, provided the illusionist can detail the cognitive mechanisms generating the error without secretly relying on the phenomenality they deny. The key is to show that the intuition of phenomenality is a user-illusion generated by cognitive limitations, similar to how a desktop interface hides the code of the computer without denying the code exists. To succeed, the illusionist must demonstrate that the introspective report of phenomenality is a theoretical posit generated by the brain to monitor its own states, rather than a direct observation of those states. This shifts the burden from explaining qualia to explaining meta-cognitive error. If the error can be explained via standard cognitive science mechanisms, such as feedback loops or information hiding, then the view holds. If the explanation of the error requires assuming the very phenomenality being denied, the view collapses. Therefore, the fatal point is not the existence of the illusion, but the resources required to explain it. The illusionist must walk a tightrope where the illusion is robust enough to explain the intuition of realism but thin enough to avoid reintroducing the hard problem. This requires a precise taxonomy of mental states where some seem phenomenal without being so. If successful, illusionism offers a parsimonious ontology. If unsuccessful, it remains a verbal trick. The decisive factor is whether the explanation of the seeming can be fully naturalized. The illusionist must also address why the illusion is so persistent. If the mechanism producing the error is evolutionarily stable, it suggests the error serves a function, perhaps simplifying self-monitoring. This functional account must not presuppose the phenomenality it denies. Ultimately, the view stands or falls on whether the seeming can be fully exhaustively described in functional terms. If any residue of feel remains unexplained, the hard problem returns. But if the feel is fully explained as a functional misrepresentation, the problem dissolves. The burden is heavy but not impossible. The category error lies in treating a representational relation as an intrinsic property. Students must note this distinction. The illusion is not of a thing but of a mode of presentation. This clarifies the collapse objection. If the mode of presentation is physical, realism holds. If it is illusory, illusionism holds. The boundary is thin.

  Finally, the marking scheme out of twenty marks should be understood through the following prose description. To achieve an A grade, a candidate must explicitly distinguish between introspective error about content and error about ontological category, noting that the former does not entail the latter without additional argument. They must define the content of the illusion as a misrepresentation of physical or functional states as possessing intrinsic qualities, rather than simply denying experience exists. They must address the collapse objection by arguing whether the seeming itself is phenomenal or merely cognitive, and locate the explanatory burden at the point of explaining the genesis of this seeming without invoking phenomenality. An A answer will judge whether this burden is fatal based on whether the illusionist successfully naturalizes the seeming. Answers capped at a B will typically exposition the view correctly but fail to press the collapse objection or will accept the inference from local error to global illusionism without critique. Common failures include equating illusionism with the outright denial that consciousness exists, which misses the nuance of misrepresentation. Another frequent error is treating the apparent immediacy of experience as a knockdown argument without arguing why immediacy guarantees ontological accuracy. Finally, candidates often answer as though invoking the difficulty of explaining consciousness were itself a refutation of the illusionist rather than something the illusionist is trying to explain away, thereby begging the question against the naturalistic framework.

