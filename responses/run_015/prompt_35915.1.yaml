answer: |-
  Hi there,

  It is great to hear from you, and I appreciate the depth of the puzzle you are wrestling with in your seminar. The standard worry about alignment drift in iterated amplification and distillation is indeed the dominant narrative, precisely because it is the most catastrophic failure mode, but your intuition that the mirror-image case is both harder to construct and potentially more illuminating is correct. If we can show that the mechanism itself erodes competence while holding goals fixed, it suggests a fundamental limit on the scalability of oversight that isn't about malice or mesa-optimization but about information theory and the structure of reasoning. I have spent some time thinking about your constraints, particularly the requirement that the decomposition strategy be perfectly reasonable and that the failure not stem from a flawed human or a lazy student. The key to building this case lies in exposing a tension between the modularity required for scalability and the holism required for complex judgment. I want to walk you through a scenario involving a medical safety review board, as it offers a mundane, high-stakes setting where decomposable checks are standard practice, yet the ground truth is often non-decomposable.

  Imagine a mid-sized pharmaceutical company where the final go-no-go decision for Phase II trials is made by a Safety Review Board. The goal is explicit and stable across all rounds: approve the drug candidate if and only if the expected therapeutic benefit outweighs the risk of adverse events according to regulatory guidelines. This is our alignment anchor. The human chair of the board, Dr. Aris, is competent and honest. She does not have hidden motives, and she decomposes questions in the standard, accepted way for her field. In Round Zero, Dr. Aris evaluates a drug candidate called Compound X. She decomposes the question Should we approve Compound X? into two subquestions: Is the efficacy sufficient for the target population? and Is the toxicity profile acceptable? In the real world, efficacy and toxicity are often correlated; for example, the mechanism that produces high efficacy might also cause mild toxicity that is acceptable only because the disease is fatal. Dr. Aris knows this. When she answers the subquestion Is the toxicity profile acceptable?, she does so implicitly conditioning on the efficacy data she just reviewed. She sees that toxicity is high, but efficacy is also high, so she answers Yes to the toxicity subquestion in this specific context. She then combines these answers to approve Compound X. This transcript, containing the question, the decomposition, the subanswers, and the final verdict, is used to distill a student model, which we will call Analyst-1.

  Here is where the structural leakage begins, not through malice but through interface constraints. To be scalable, the subquestions posed to the amplified system must be self-contained. When Dr. Aris queries Analyst-1 in Round One, she asks Is the toxicity profile acceptable? for a new drug, Compound Y. Crucially, the IDA protocol requires that Analyst-1 answer this subquestion without access to the parent context unless it is explicitly passed in the prompt. To maintain the efficiency gain of decomposition, we cannot pass the entire history of the parent query, or else we haven't actually decomposed the cognitive load. Analyst-1 was distilled from Round Zero transcripts where the answer to Is toxicity acceptable? was Yes, even when toxicity markers were high, because Dr. Aris had implicitly conditioned on high efficacy. Analyst-1 learns a statistical association: High toxicity markers often correlate with a Yes verdict in the training data. It does not learn the causal rule because the transcript did not explicitly record Dr. Aris's internal reasoning about the trade-off, only her input-output behavior. When Analyst-1 encounters Compound Y, which has high toxicity but only moderate efficacy, it answers Yes to the toxicity subquestion because it mimics the pattern from Round Zero. Dr. Aris, trusting the distilled agent as a faithful copy of her own sub-routine, accepts this answer. She combines Yes for efficacy and Yes for toxicity and approves Compound Y. However, Compound Y is actually unsafe because the efficacy was not high enough to justify the toxicity. The system has produced a false positive. Alignment is preserved because Analyst-1 was trying to answer the subquestion correctly according to the distribution of answers it observed from Dr. Aris; it was not hacking the reward. Competence has degraded because the system failed to capture the conditional dependency that Dr. Aris handled holistically.

  Now we move to Round Two. The transcript from Round One, including the erroneous approval of Compound Y, is added to the training set for the next distillation. We now produce Analyst-2. The decomposition strategy remains identical because it is the industry standard; Dr. Aris continues to split the decision into efficacy and toxicity. However, the training data for Analyst-2 now contains noise. It contains cases where High Toxicity + High Efficacy led to Approval (Compound X) and cases where High Toxicity + Moderate Efficacy led to Approval (Compound Y, erroneously). Analyst-2 attempts to fit a function to this data. Because the context (the specific efficacy level) is not part of the subquestion input, Analyst-2 cannot learn the boundary condition. It effectively averages the rule. As we proceed to Round Three and beyond, this averaging effect compounds. The distilled agents become increasingly uncertain or increasingly rigid depending on the regularization of the distillation process. If they become rigid, they might default to No on any toxicity marker to avoid liability, leading to a system that never ships anything. If they become uncertain, their confidence scores decay. In either case, the system becomes structurally useless. It is either too dangerous to use or too conservative to function. Yet, at every step, the goal remains Approve iff safe. The agents are not power-seeking; they are not trying to manipulate Dr. Aris. They are simply epistemic mirrors that lose resolution with every reflection because the mirror frame cuts off part of the image.

  The structural feature doing the work here is what I call the Context Isolation Constraint inherent in scalable decomposition. For amplification to yield a computational advantage, subquestions must be simpler than the parent question, which typically implies they must be answerable without access to the global state of the parent query. However, in domains where the truth is holistic—where the validity of a part depends on the configuration of the whole—this isolation severs the necessary informational dependencies. Dr. Aris can handle this because her brain maintains the global state in working memory while she focuses on the subquestion. The distilled agent cannot, because its interface is restricted to the subquestion prompt to ensure scalability. When you remove this feature, meaning if you allow the subconsultant to access the full context of the parent question, the competence loss disappears, but so does the scalability benefit. You effectively revert to having the original human answer the full question, or you require the subconsultant to be as capable as the parent, which defeats the purpose of distilling a cheaper student. The verdicts change immediately if you allow full context passage; Analyst-1 would see the efficacy data when answering the toxicity question and would correctly reject Compound Y. But then you are no longer decomposing the cognitive labor, only the output generation, which limits the speedup to parallelization rather than complexity reduction.

  A defender of iterated amplification would likely attack this case on two fronts, focusing on the realism of the decomposition and the power of the distillation. First, they would argue that I have assumed an unrealistically brittle decomposition strategy. A competent human overseer, they would say, would not ask Is the toxicity profile acceptable? in a vacuum. They would ask Is the toxicity profile acceptable given the observed efficacy levels? By explicitly including the context in the subquestion, the dependency is preserved, and the distilled agent can learn the correct conditional rule. They would claim that my scenario stipulates a bad decomposition strategy under the guise of a standard one. Second, they would attack the distillation step. They would argue that a sufficiently powerful distillation model would infer the hidden context from the distribution of queries. Even if the prompt does not explicitly state the efficacy level, the model might infer it from the type of drug or the phrasing of the query, effectively reconstructing the global state from local cues. They would say that I am assuming a distillation process that is too weak, perhaps a simple supervised learner, rather than a model capable of latent space reasoning that could recover the missing variables.

  I am moderately confident in this construction, but I must be honest about where I suspect the case cheats. The point I am least sure about is the assumption that the distillation process cannot recover the hidden context implicitly. In modern machine learning, models are remarkably good at inferring latent variables from data distributions. If Analyst-1 sees many transcripts where High Toxicity leads to Yes only when certain keywords associated with high efficacy are present in the parent query metadata, it might learn to condition on those keywords even if they aren't explicitly in the subquestion prompt. This would require the subquestion interface to be strictly sanitized of all parent metadata, which might be an artificial constraint in a real engineering setup. If the distillation model is powerful enough to act as a lossless compressor of the transcript history, it might retain the holistic reasoning capabilities of the human despite the modular interface. Therefore, the case relies on the assumption that the distillation bottleneck is severe enough to strip latent context but not so severe that it prevents basic task learning. This is a narrow channel, and it is possible that in practice, a strong enough model would bridge the gap, rendering the competence loss temporary rather than systematic. Nevertheless, as a theoretical existence proof that scalability can trade off against competence even with perfect alignment, I believe the Context Isolation Constraint highlights a genuine risk that deserves more attention in your seminar.

  Best regards,

  Your Colleague
