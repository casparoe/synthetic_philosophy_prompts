  The Shallows are risky. Usually, she'd wait. But the stamp says TRUE.
  Does TRUE mean "It is safe to do" or "It will happen (even if you crash)"?
  The Register only validates truth, not outcome. This is crucial.
  So the temptation is: "It says TRUE, so it *must* happen. Therefore I must make it happen." vs "It says TRUE, so it *will* happen regardless of my worry."

  Actually, the strongest tension is: "If I try to change course, I make the Register a liar. I can't do that. So I must proceed." That turns the stamp into a command.

  Okay, let's draft.

  *Word Count Management:* Keep descriptions tight. Dialogue sparse.
  *Tone:* Melancholic, heavy, salt-stained.

