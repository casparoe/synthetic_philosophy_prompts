answer: |-
  The slip of paper was thick, cream-colored, and warm from the machine. Elara held it between thumb and forefinger on the bridge of the *Kestrel*, shielding it from the sea spray.

  **STATEMENT:** I will guide the *Kestrel* through the Needle at 14:00.
  **STAMP:** TRUE.

  She folded the paper and put it in her breast pocket, against the wool of her sweater. The warmth of it seeped through the fabric, resting over her heart.

  "Wind's picking up," said Jory, her mate, leaning against the rail. He was watching the gray swell roll toward the harbor mouth. The Needle was a slit in the reef, barely wider than the *Kestrel*'s beam. In this chop, it was a gamble. "We could wait for the evening tide. Slack water."

  Elara checked her watch. 13:45. Fifteen minutes.

  "If we wait, we miss the docking window at Pier 9," she said. Her voice sounded flat to her own ears. "The cargo spoils."

  "Cargo spoils sometimes. Hulls break forever." Jory kicked a coil of rope. "What's your gut say, El?"

  She touched her pocket. The paper crinkled softly.

  Her gut said turn back. The swell was wrong. The rhythm of the slap against the hull was too erratic. A pilot's job was to read the water, not the sky, and the water was saying no. But the Register did not read water. The Register read *what is*.

  If she turned back, the statement in her pocket became a lie. Not a mistake—a lie. The Register had never lied in two hundred years. To turn back was to claim that the city's central truth was broken. It felt less like changing course and more like breaking a law of physics.

  "Prepare the lines," Elara said.

  Jory hesitated. He looked at the water, then at her. He didn't see the paper, but he knew the routine. Everyone in the port knew the routine. You ask the Register when the risk is too high to weigh alone. You ask when you want to know if the burden is yours to carry.

  "You asked it," Jory said quietly.

  "Yes."

  "And it said..."

  "It said what it said."

  Jory nodded, slowly. He didn't ask for the stamp. You never asked to see the stamp. Knowing the value changed the weight of it. If he knew it was TRUE, he might trust her too much. If he knew it was FALSE, he might mutiny. OPEN was the only safe answer, and OPEN meant you were still alone.

  "Engine room, stand by," Elara said into the intercom.

  The *Kestrel* groaned as she turned into the swell. Elara gripped the wheel. The wood was smooth, worn by generations of hands. She could feel the vibration of the engines through the soles of her boots.

  The temptation was a physical ache in her shoulders. It was the desire to relax her grip. If the stamp was TRUE, the event was fixed. The future was already cast in concrete. Her hands on the wheel were just theater. She could close her eyes, and the ship would still go through the Needle. The stamp guaranteed the outcome, so why strain? Why sweat?

  But if she relaxed, and the ship drifted, and the hull cracked on the reef... would the stamp have been wrong? Or would the crash be part of the truth? *I will guide the Kestrel through.* It didn't say *safely*. It didn't say *intact*.

  TRUE could mean a wreck sliding through the gap. TRUE could mean success. The stamp didn't care about the difference. It only cared about the match.

  So she had to steer. Not because the stamp told her to, but because if she didn't steer, she wasn't the one guiding the ship. The stamp required an agent. If she abdicated, who was left to make the statement true?

  "Thirty degrees starboard," Jory called. "Current's pushing us left."

  "Compensating," Elara said. She turned the wheel. The ship responded sluggishly.

  The Needle loomed ahead. The water between the rocks was white with foam. The noise of the surf drowned out the engine hum. This was the moment. The open future closing into a single point.

  If she turned now, she proved the Register wrong. The city would talk. The clerks would check their logs. There would be an inquiry. Not because she saved the ship, but because she broke the chain.

  If she went forward, and the ship survived, she was a hero who trusted the system.
  If she went forward, and the ship sank, she was a fool who trusted a piece of paper.

  But neither of those was the real fear. The real fear was that it didn't matter what she chose. That the stamp wasn't a prediction, and it wasn't a command. It was a receipt.

  She looked at the compass. The needle swung wild, then settled. 14:00.

  "Hard right," she said.

  The *Kestrel* surged. The bow lifted over the first swell. The rocks rushed past, close enough to touch. The hull scraped once, a shriek of metal on stone that ran up Elara's spine, then the water smoothed out. The harbor lay beyond, calm and gray.

  They were through.

  Jory let out a breath he'd been holding for a minute. "Hell of a ride, Captain."

  Elara didn't answer immediately. She kept the ship on course toward Pier 9. Her hands were still tight on the wheel, knuckles white. She hadn't relaxed. Not for a second.

  She reached into her pocket and touched the paper. It was still warm.

  "Did we make it?" Jory asked, joking, trying to shake the tension.

  Elara looked at the calm water ahead, then down at her pocket. She could take the paper out. She could look at the stamp again. It would still say TRUE. It would always say TRUE.

  "We made it," she said.

  She left the paper in her pocket. It didn't matter if the Register knew the future or wrote it. The wheel was still heavy, and the water was still cold, and her hands were the only things that had moved the ship.

  "Drop anchor when we reach the buoy," Elara said.

  "Aye," Jory said. He walked to the rail to prepare the line.

  Elara watched the bow cut the water. She waited for the feeling of relief, the sense that the danger was passed because the truth had been secured. It didn't come. The danger was passed because she had turned the wheel. The stamp was just paper.

  But she didn't take it out. She let it rest against her heart, warm and heavy, a secret weight that neither commanded nor forbade, but simply was.
