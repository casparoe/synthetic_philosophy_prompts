prompt: |-
  I'm a software engineer with no philosophy degree, curating a dataset of conceptual prompts that shouldn't be answerable by simple pretraining recall. Before you generate anything, please take on the role of a professional philosopher of mind with experience in deadpan corporate satire, and think step by step: first, briefly brainstorm how Douglas Hofstadter's idea—that an "I" is essentially a replicable mental pattern that can persist across other brains—would actually be operationalized by a tech startup trying to monetize it. Invent some niche, plausible-sounding engineering metrics that map onto his view but aren't standard philosophical jargon—concepts like "echo fidelity," "recursive self-similarity thresholds," or "sympathetic pattern resonance"—so the result feels technically specific rather than generic. Do not include bibliographies, citations, reading lists, or direct quotations from any real texts; work only from the general concept that personal identity is not tied to a single biological substrate but can be distributed wherever sufficient pattern similarity exists.

  Once you've brainstormed, write a satirical parody in the form of a deadpan End User License Agreement for a fictional service called "Resonance Cloud: Distributed Self Persistence." Format it as numbered legal clauses, approximately 700 words, in polished Silicon Valley legalese. The target of the satire should be the philosophical position itself—specifically, the claim that the self can be genuinely distributed across brains and that continuity depends on pattern replication rather than physical continuity—not any named individual. The humor and insight should come from taking this position literally: include clauses defining what counts as "you" when your patterns are partially hosted in colleagues' neural architectures; a "no-branching" policy for unauthorized copies; a refund and arbitration procedure for "continuity disputes" when echo fidelity drops below an invented threshold (e.g., 0.73); consent terms for "undeserving carriers" who accidentally replicate too much of a subscriber's pattern; and a redefinition of termination not as biological death but as "total pattern dissolution across all registered nodes." Keep the voice consistently deadpan—no winking, no explicit "this is absurd" commentary—so that a reader familiar with Hofstadter recognizes the exaggeration of real features in his view, while a non-specialist can still read it as a creepy tech contract gone wrong. Ensure internal consistency: every clause should follow from the logic of distributed-pattern identity without accidentally slipping into standard single-brain assumptions. Begin with a brief brainstorming outline, then present the EULA.
