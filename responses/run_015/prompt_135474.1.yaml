answer: |-
  Nature drives the state to seek repose,
  But duty says the law must rule the sword.
  No treaty holds if built on false accord,
  Till trade and war bring peace as nature knows.
  The merchant counts his profit and his gain,
  While conscience demands the right be done outright.
  Through slow reform the republic attains,
  To stand within the moral law's own light.

  States stand apart like islands on the sea,
  Yet moral law commands a league of peace.
  No state will yield its claim to liberty,
  Each state remains a master of its land,
  Till duty binds the warring to agree,
  And commerce binds them close across the sand,
  A fragile bond without a global throne,
  Where justice claims the federated zone.

  The stranger approaches the foreign gate,
  Not to settle, only to speak and pass.
  Commerce urges to open up the state,
  But moral law draws a line in the grass.
  A right to visit, not to reside or own,
  The globe is sphere enough for every man.
  Yet borders harden like a vein of stone,
  And peace recedes, an idea without end.
