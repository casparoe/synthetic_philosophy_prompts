      *   **Core Claim:** Earth-Oscar and Twin-Oscar share identical narrow psychological content (belief states) because mental representations are individuated by inferential roles, not causal history.
      *   **Conclusion:** Semantic externalism is not a thesis about minds, but about social-linguistic norms stabilizing term-reference.
      *   **Constraints:**
          *   Grant the standard setup (H2O vs. XYZ, molecule-for-molecule identical twins).
          *   Deny environmental divergence produces a difference in narrow psychological content.
          *   Defend inferential role semantics (IRS) over causal/historical theories for *mental* individuation.
          *   Distinguish clearly between *reference* and *content*.
          *   **Do not** invoke two-dimensional semantics (Chalmers, Jackson, etc.).
          *   **Do not** treat post-1990 frameworks as authoritative (stick to the classic debate terrain but argue from a specific rationalist/internalist perspective).
          *   **Do not** include a bibliography or reading list.
          *   **Tone:** Push hard. Be precise. Frame the intuitive pull of Twin Earth as a conflation error correctable by rationalist conceptual analysis.

  2.  **Deconstruct the Standard View (The Target):**
      *   Putnam's slogan: "Meanings just ain't in the head."
      *   Standard inference: Since extension differs (H2O vs. XYZ), intension/meaning differs. Since meaning determines truth conditions, mental content differs. Therefore, psychological states are not individuated narrowly.
      *   My task: Break the link between *meaning/reference* and *mental content*.

  3.  **Develop the Counter-Argument (The Strategy):**
      *   **Step 1: The Reference/Content Distinction.** Establish that what a word picks out in the world (reference) is distinct from what the thinker grasps cognitively (content/sense). Putnam conflates these for the sake of the argument, but a rigorous psychology must separate them.
      *   **Step 2: Inferential Role Semantics (IRS).** Define mental content by what the subject can *do* with the representation. If Earth-Oscar and Twin-Oscar behave identically, reason identically, and predict identical outcomes based on 'water', their mental states are identical.
      *   **Step 3: The Division of Linguistic Labor.** Reinterpret Putnam's own insight. The "externalism" is about how the *community* fixes the extension of a term, not how the *individual* constitutes a thought. Oscar defers to experts for *reference*, but he owns his *concept*.
      *   **Step 4: The Conflation Error.** Argue that the intuition pump works only because we slide from "The word 'water' refers to different stuff" to "Oscar is thinking different thoughts." This is a category mistake.
      *   **Step 5: Conclusion.** Externalism is a sociolinguistic thesis, not a psychological one.

  4.  **Drafting - Section by Section (incorporating constraints):**

      *   *Introduction:* State the thesis boldly. Twin Earth shows nothing about the mind, only about language.
