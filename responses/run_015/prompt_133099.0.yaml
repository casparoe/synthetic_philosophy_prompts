      *   *The Argument from Inferential Role:* If the twins reason the same, they think the same. The chemical composition is invisible to their cognitive machinery.
      *   *Reinterpreting Putnam:* The "Division of Linguistic Labor" is the key. It explains reference fixation, not thought individuation.
