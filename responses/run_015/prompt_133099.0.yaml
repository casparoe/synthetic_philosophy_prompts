answer: |-
  The standard interpretation of Putnam's Twin Earth argument commits a category mistake that conflates the semantics of public language with the ontology of mental states. While the thought experiment successfully demonstrates that the extension of natural kind terms is fixed by environmental factors and social conventions, it fails utterly to prove that the *content* of an individual's thoughts is thereby individuated broadly. To claim that Earth-Oscar and Twin-Oscar possess different mental contents simply because their environments differ is to confuse the conditions under which a word refers with the conditions under which a thought is constituted. If we rigorously distinguish between reference and cognitive content, and if we individuate mental states by their inferential roles rather than their causal histories, the Twin Earth scenario collapses as an argument for psychological externalism. It reveals only a sociolinguistic mechanism for stabilizing reference, leaving the mind resolutely internal.

  To see this, we must first grant the physical setup while rejecting the psychological inference. Earth-Oscar and Twin-Oscar are molecule-for-molecule identical. They share the same neural architecture, the same sensory inputs, and the same behavioral outputs. When Earth-Oscar says, "Water is wet," and Twin-Oscar says, "Water is wet," they are in identical physical states. The standard externalist argument asserts that because the extension of 'water' differs (H2O on Earth, XYZ on Twin Earth), the meaning differs, and therefore the belief state differs. This inference relies on an equivocation. It slides from the premise that the *term* 'water' has different truth conditions in the two environments to the conclusion that the *thinker* is in a different psychological state. This slide is unjustified.

  The crucial error lies in failing to distinguish reference from cognitive content. Reference is a relation between a symbol and the world; it is determined by causal chains, historical usage, and the physical nature of the stuff picked out. Cognitive content, however, is a property of the thinker's mind; it is determined by how the thinker represents the world to themselves. For the psychologist or the philosopher of mind interested in the explanation of behavior, what matters is not what the symbol actually latches onto in the external world, but how that symbol functions within the cognitive economy of the agent.

  If mental representations are individuated by their inferential roles—that is, by the set of inferences a subject can draw from them and the behavioral dispositions they trigger—then Earth-Oscar and Twin-Oscar necessarily share identical belief-states. Consider the inferential network surrounding 'water' for both Oscars. Both infer that if they drink it, their thirst will be quenched. Both infer that if it is cold enough, it will turn to ice. Both infer that it is distinct from 'gold' or 'air.' There is no inference available to Earth-Oscar that is not available to Twin-Oscar, and vice versa. Their cognitive systems process the representation 'water' in exactly the same way. Since the chemical composition (H2O vs. XYZ) is invisible to their cognitive machinery until scientific investigation occurs, that composition cannot be a constituent of their pre-scientific mental content. To claim otherwise is to claim that a thinker's mental state changes depending on facts they do not know and cannot access. This renders the mind transparent to the environment in a way that makes psychological explanation impossible. If mental states are individuated by external facts unknown to the subject, then two subjects behaving identically for identical internal reasons would nonetheless be in different psychological states. This severs the link between mind and behavior, which is the very data psychology seeks to explain.

  Therefore, the divergence in reference does not entail a divergence in content. Putnam's argument successfully establishes that the *reference* of the public word 'water' is fixed externally, but it does not follow that the *concept* possessed by the individual is externally individuated. This is where Putnam's own insight regarding the "division of linguistic labor" must be turned against his externalist conclusion. Putnam argues that we defer to experts to fix the extension of terms like 'water' or 'elm.' This is a thesis about social-linguistic norms, not mental ontology. It explains how a community maintains a stable mapping between words and world despite individual ignorance. When Oscar says "water," the community's norms ensure that his word refers to H2O (on Earth). This is a fact about the social practice of naming. It is not a fact about Oscar's mind. Oscar's mental content is exhausted by his mode of presentation: the concept of "the clear, drinkable liquid in the lakes." The fact that the experts have discovered this liquid is H2O adds a layer of public semantic value to the word, but it does not alter the narrow psychological reality of Oscar's thought.

  The intuitive pull of the Twin Earth argument arises from a conflation that rationalist conceptual analysis must correct. We are tempted to say Oscar and Twin-Oscar believe different things because we are evaluating the *truth conditions* of their utterances from a God's-eye view. From the outside, we know one utterance is about H2O and the other about XYZ. But semantics from the outside is not psychology from the inside. When we ask what Oscar believes, we are asking about his perspective. From his perspective, there is no difference. To insist there is a difference is to privilege the external causal history of the term over the internal rationality of the thinker. It prioritizes the history of the word over the logic of the mind.

  This conflation leads to the absurd consequence that mental content is opaque to the thinker. If externalism were true about mental content, Oscar could not know the content of his own thoughts without investigating the chemistry of his environment. He would have to defer to the external world to know what he is thinking. This violates the principle of privileged access that is central to the concept of belief. A rationalist analysis holds that concepts are individuated by their conceptual roles, which are graspable a priori by the thinker. The concept WATER is defined by its role in the thinker's web of belief, not by the microstructure of the stuff causing the belief. The microstructure is an empirical discovery that may later refine the concept, but it does not constitute it.

  Consequently, semantic externalism must be retracted as a thesis about the mind. It is, properly understood, a thesis about the stabilization of reference within a linguistic community. It explains how public language hooks onto the world despite individual ignorance. It does not explain how minds hook onto the world. The mind hooks onto the world via concepts that are individuated narrowly. The public language hooks onto the world via conventions that are individuated broadly. Twin Earth shows that public reference depends on the environment. It does not show that private thought depends on the environment.

  To accept the standard interpretation is to surrender the autonomy of psychology to external accident. It is to claim that the mind is not a self-contained system of representation but a fragment of a causal chain stretching out into the world. But if the mind is to explain behavior, it must be the immediate cause of that behavior. Since the immediate cause of Earth-Oscar's behavior is identical to the immediate cause of Twin-Oscar's behavior, the mental states causing them must be identical. The difference in reference is a difference in the *success* of their reference, not a difference in the *state* of their minds.

  Thus, the Twin Earth literature glosses over the fundamental distinction between the norms governing public speech and the laws governing private thought. Putnam proved that meanings (as public reference) ain't in the head. He did not prove that thoughts (as cognitive content) ain't in the head. By conflating the two, standard externalism mistakes a sociolinguistic fact for a psychological one. The correct conclusion is that while the extension of our terms is fixed by our environment and our community, the content of our thoughts is fixed by our inferential capacities and our conceptual grasp. Semantic externalism is a doctrine about language and society, not a doctrine about the mind. To treat it otherwise is to confuse the map with the territory, and the thinker with the world they think about.
