  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Data Analyst, familiar with Peter Turchin's cliodynamics (secular cycles, structural-demographic theory, elite overproduction). Skeptical but engaged (acknowledges critics about curve-fitting).
