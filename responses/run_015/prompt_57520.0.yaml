  8.  **Final Polish:** Ensure the distinction between *materialist* (Turchin) and *idealist* (Buckle) is clear, as that's the fundamental philosophical split. (Self-correction: Buckle is a bit mixed, but heavily emphasizes knowledge/intellect as the driver, which is idealist compared to Turchin's demographic materialism).

