answer: |-
  ### Essay Question

  **Question:**
  Oskar Lange's *On the Economic Theory of Socialism* proposes a market-socialist model intended to resolve the Socialist Calculation Debate. Evaluate the success of the Lange–Lerner model (public ownership, trial-and-error pricing by a Central Planning Board, and the rule $P = MC$) in answering the calculation critique.

  In your response, you must rigorously distinguish between Ludwig von Mises's *impossibility* argument (regarding the accounting function of prices) and F.A. Hayek's *knowledge* argument (regarding the discovery and dispersion of information). Does Lange successfully refute Mises while failing to address Hayek? Justify your verdict by analyzing the load-bearing role of the social dividend/subsidy mechanism and the epistemic requirements of the Board's trial-and-error process.

  **Time Allowed:** 2 Hours
  **Total Marks:** 30

  ***

  ### Model Answer

  The Socialist Calculation Debate is often taught as a monolith, but a rigorous evaluation of Oskar Lange's model requires disentangling two distinct critiques: Ludwig von Mises's accounting objection and F.A. Hayek's epistemic objection. Mises argued that without private ownership of the means of production, there can be no genuine market prices for capital goods, rendering rational economic calculation impossible. Hayek shifted the terrain, arguing that even if calculation were theoretically possible, the relevant knowledge is dispersed, tacit, and contextual; it cannot be aggregated by a central body. Lange's model is a sophisticated response to Mises, but it ultimately collapses under the weight of Hayek's critique.

  Lange accepts Mises's premise that rational allocation requires price signals but denies Mises's conclusion that these require private property. Lange proposes a Central Planning Board (CPB) that simulates a market through *tâtonnement* (trial-and-error). The CPB sets prices for capital goods; state enterprise managers, instructed to minimize costs and set price equal to marginal cost ($P = MC$), respond to these prices. If shortages or surpluses occur, the CPB adjusts prices accordingly. In this formal sense, Lange solves Mises's problem. He demonstrates that a system of simultaneous equations can be solved iteratively without a capital market, providing the accounting ratios Mises deemed impossible.

  However, the mechanical stability of Lange's model relies on a specific rule: managers must set $P = MC$. In industries characterized by increasing returns to scale (natural monopolies), marginal cost is below average cost. If a manager follows the rule $P = MC$, the enterprise will incur chronic losses. This is not a bug but a feature of Pareto efficiency in such sectors. Consequently, the "social dividend" mechanism is not merely a distributive afterthought; it is load-bearing. The state must subsidize these losses to keep enterprises solvent. If the subsidy mechanism fails, or if the political will to cover losses evaporates, the $P = MC$ rule becomes unsustainable, and the simulation reverts to arbitrary administration. Thus, Lange answers Mises only by assuming a fiscal capacity to absorb the inefficiencies inherent in marginal-cost pricing under public ownership.

  While this satisfies the *accounting* requirement, it fails the *epistemic* requirement raised by Hayek. Hayek's critique is not that the CPB lacks computing power, but that the data required for calculation does not exist in a form the CPB can access. For Lange's trial-and-error to work, the CPB must be able to read signals of excess demand and, crucially, managers must know their own marginal cost curves. Hayek argues that cost knowledge is not a static statistic available to the manager; it is discovered through entrepreneurial action and rivalrous competition. In a dynamic economy, "marginal cost" is not a given parameter but a subjective estimate of future opportunity costs.

  Furthermore, the trial-and-error process presupposes that the CPB can distinguish between a price signal caused by genuine scarcity and one caused by local, tacit changes in consumer preference or technological possibility. By stripping managers of entrepreneurial risk (since losses are covered by the social dividend), Lange removes the incentive to discover new cost-saving methods or new products. The knowledge required to set $P = MC$ efficiently is generated by the very market process Lange seeks to simulate. Without the property rights that align risk and discovery, the "data" the CPB relies upon remains inert or non-existent.

  Therefore, the verdict is clear: The Lange–Lerner model successfully refutes Mises's strong impossibility claim by showing that price indices can be generated administratively. However, it leaves Hayek's knowledge problem entirely standing. Lange treats the economic data as *given* to the planner, whereas Hayek demonstrates that economic data is *created* by the market process. Lange solves the equation, but he cannot populate it with the variables necessary for a dynamic economy.

  ***

  ### Marking Scheme (30 Marks Total)

  **1. Distinction Between Mises and Hayek (10 Marks)**
  *   **A (8–10 marks):** Explicitly defines Mises's claim as an *accounting/impossibility* problem (no prices = no common denominator for calculation) and Hayek's as an *epistemic/knowledge* problem (data is dispersed/tacit/discovered). Treats them as analytically distinct critiques.
  *   **B (5–7 marks):** Distinguishes the two but treats them as variations of the same "information" problem. May imply Hayek just added "complexity" to Mises's argument rather than changing the nature of the critique.
  *   **C/F (0–4 marks):** Conflates Mises and Hayek entirely (e.g., "Mises and Hayek argued that planners don't have enough data").

  **2. Analysis of the Lange Model & Subsidy Mechanism (10 Marks)**
  *   **A (8–10 marks):** Explains the $P = MC$ rule. Crucially, identifies that in decreasing-cost industries, $P = MC$ implies $P < AC$, resulting in losses. Explicitly states the social dividend/subsidy is **load-bearing** (structural necessity) rather than cosmetic.
  *   **B (5–7 marks):** Explains the $P = MC$ rule and trial-and-error. Mentions the subsidy but treats it as a minor adjustment or fails to link it to natural monopolies/decreasing costs.
  *   **C/F (0–4 marks):** Describes Lange's model generally but ignores the subsidy mechanism or claims the model is self-financing without qualification.

  **3. Hayekian Critique & Final Verdict (10 Marks)**
  *   **A (8–10 marks):** Argues that trial-and-error fails because the knowledge (costs/preferences) is not "given" to be read, but discovered through competition. Notes that removing risk (via subsidies) stifles the discovery procedure. Verdict: Lange answers Mises, loses to Hayek.
  *   **B (5–7 marks):** Argues Hayek's critique is about "too much data" or "computational limits" rather than the *nature* of knowledge. Verdict is correct (Lange loses to Hayek) but reasoning is technocratic rather than epistemic.
  *   **C/F (0–4 marks):** Verdict is unclear, or argues Lange solves both problems, or argues Lange solves neither without justification.

  **Common Failures (Automatic Deductions)**
  *   **The Conflation Penalty (-5 marks):** If the student treats "Mises and Hayek" as a single unit throughout the essay without distinguishing their specific contributions to the critique.
  *   **The Efficiency Blindspot (-5 marks):** If the student grants the Lange model Pareto efficiency without noting that the subsidy mechanism is required to sustain the $P = MC$ rule in natural monopoly conditions.

  **Grade Boundaries:**
  *   **A (24–30):** Excellent distinction of concepts; deep engagement with the subsidy/load-bearing issue; sophisticated grasp of Hayekian epistemology.
  *   **B (18–23):** Competent distinction; understands the model but misses the structural necessity of the subsidy; treats Hayek's critique as computational.
  *   **C (15–17):** Basic understanding of the debate; significant conflation of authors; misses key mechanical constraints of Lange's model.
  *   **F (0–14):** Fundamental misunderstandings; fails to address the prompt's specific requirements.
