prompt: |-
  Write the joint statement a mnemonic-pluralist historian and a demystification advocate could both sign after a long adversarial colab about lost causes and national myths. Start with a numbered agreed-claims section covering four cases: the Confederacy's Lost Cause framing, Masada as collective suicide in Israeli memory, Kosovo Polje in Serbian identity, and Dunkirk as glorious defeat in British culture — for each, separate what actually happened from what's commemorated, and say whether the myth needs outright falsehood or just selective emphasis. Then do a disagreements tabel. The cruxes should include: whether commemorating defeat necessarily glorifies the defeated cause; whether "counterfactual loyalty" (attachment to what a group might have become) is a real social force or just romantic regret; and whether victors and defeated groups deploy myth in structurally different ways. For each crux, name one concrete comparison both sides accept as relevant — like how post-war Germany remembers Stalingrad versus Serbia remembering Kosovo — and record in advance what each camp predicts about it. Also identify exactly where they talked past each other, probably over whether "myth" means a necessary narrative frame or a deliberate falsehood. Keep the wording neutral enough that each side accepts its own formulation. No citations needed, just work it out from the logic of the cases. And keep it casual — maybe drop a typo or two if it feels right.
