answer: |-
  The Strategic Stability Committee finally solved the credibility problem.

  "The adversary keeps calling our bluff," the Chair explained. "They assume we're too rational to retaliate after taking a hit. So we've implemented the 'Zero-Discretion Protocol.' Launch authority is now tied to a randomized algorithm. No human override. No political veto. Once activated, retaliation is statistically inevitable."

  "Brilliant," said the Chief Analyst. "Now the threat is perfectly credible. They'll know escalation is out of our hands. They'll have to accommodate us."

  They transmitted the protocol to the adversary as a confidence-building measure. Ten minutes later, the adversary launched a full first strike.

  "Why?" screamed the Chair as the inbound alerts flashed. "We proved we weren't bluffing!"

  The Analyst watched the screens fade. "You proved you weren't bluffing. But deterrence relies on them believing you *might* stop if they back down. By proving you *can't*, you made their restraint useless. The only rational move left was to shoot first."
