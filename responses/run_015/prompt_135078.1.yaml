answer: |-
  You press me upon the tenderest spot of the calculation (as indeed you ought, if we are to have any truth out of this business), for it must be confessed that the antipathy is often a plant watered by the very hands that claim to root it out—the legislator and the divine cultivating the sickness lest their own remedy be deemed unnecessary. But observe: though the pain of disgust be real (and I do not deny the sting of popular displeasure, for it burns hot enough to drive a man to despair), the question remains whether the *cure* inflicts more suffering than the *disease*. If I put a man to the pillory, or hang him by the neck, I produce pains of the most intense sort (loss of life, liberty, reputation, fortune) which are certain and sharp; whereas the disgust of the neighbours, however widespread, is often fleeting, a sort of mental shudder that passes when the tea is poured. You say your machine allows a hundred million to feel this shudder in an afternoon; I ask you then, regarding this strange contrivance of yours that multiplies eyes and ears so prodigiously: does the pain of each individual become *keener* because it is shared, or does it become *diluted*, like a drop of vinegar in a hogshead of water? For if the intensity per head diminishes as the extent grows, your multiplication may prove a phantom sum.

  There is, moreover, the pain of *alarm* (which you have not entered in your column) felt by every soul who fears they might be accused of the irregularity, or who loves someone who might be; this alarm is a perpetual tax upon the happiness of the community, a damp fog that settles over all private affections. If the law punishes, it widens this fog; if the law is silent, the antipathy may indeed linger (for habits of mind are stubborn things), but it lacks the sharp teeth of the magistrate to turn a private whim into public ruin. So I put to you this: in this world of yours where news flies faster than a post-chaise, is the disgust of the multitude a active fury that seeks blood, or merely a passive murmur? For if it be but a murmur, then to answer it with the thunder of punishment is to violate the very economy of pain we seek to preserve.
