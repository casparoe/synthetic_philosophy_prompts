prompt: |-
  You are an expert in political philosophy and an experienced pedagogue with particular attention to how normative arguments are misread as ideological slogans. Before composing the plan, take a few minutes to map the conceptual dependency structure: identify which commitments must be in place before Burkean gradualism can appear as an epistemic claim rather than a temperamental preference, and list the failure modes that occur when learners conflate distributed institutional knowledge with mere tradition-worship.

  I am leading a single ninety-minute seminar for a reading group of architecture and historic-preservation graduate students. Their disciplinary formation treats tradition largely as an obstacle to equity-centered redesign and adaptive reuse; they are fluent in institutional-memory discourse but suspicious of any defense of inherited structures. I want them to understand Burkean conservatism together with Chesterton’s fence—not as a blanket defense of the status quo, but as an argument about epistemic humility regarding distributed, tacit knowledge embedded in long-evolving practices.

  Plan the explanatory arc for me. Do not deliver the explanation itself; design the teaching sequence.

  Specifically:

  - Lay out the order in which the conceptual components must be introduced, making the dependency relations explicit: what idea must be secured before the next can even be heard correctly, and why reversing that order collapses the argument into the misconception you anticipate.
  - Identify the one carrying example or case study that should anchor the entire session. It must not be Chesterton’s original fence-in-the-field anecdote. Choose a scenario that has both a clear institutional-memory or tacit-knowledge component and an equity-related tension that this audience will immediately recognize—something like the decommissioning of a legacy urban infrastructure pattern whose original design logic was lost but whose removal produced unintended harm. Explain precisely what the example must possess (e.g., recoverable functional rationale, visible equity stakes, absence of pure nostalgia) and what it must lack, so that it does not confirm their prior view that preservation is only aesthetic conservatism.
  - Map the misconceptions they will bring or form, in the approximate order they will arise during the session. I expect at least three: (i) that Chesterton’s fence is merely status-quo bias dressed in aphorism; (ii) that Burkean gradualism is just risk-aversion or fear of change; and (iii) a disciplinary misconception—likely that only credentialed experts or documented archives hold the relevant knowledge, rendering folk or embedded practice illegitimate. For each, specify exactly where in the sequence it should be headed off, what conceptual resource you will use to defuse it, and what sign will tell you it has taken root despite your intervention.
  - Provide one diagnostic question I can pose near the end—something that reveals whether they have grasped the epistemic structure (the problem of knowing why a practice exists before destroying it) rather than having merely adopted a conservative slogan or rejected it outright.
  - State explicitly what must be left out at this level: anything that depends on Burke’s particular metaphysics of the social contract, on detailed historiography of the French Revolution, or on theological premises that are not necessary for the epistemic point. Say so plainly, with a brief justification for the omission.
  - Include a brief opening strategy: how to frame the session in the first three minutes so that the group does not dismiss the topic as ideological before the conceptual work has begun, given their disciplinary commitments to equity-driven redesign.

  Think carefully about the dependency graph first. Then present the sequence clearly, with the misconception map integrated at the points where each should be intercepted.
