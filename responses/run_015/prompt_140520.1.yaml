  7.  **Review against Word Count:**
      *   If too short, expand on the meeting dynamics.
      *   If too long, trim the technical setup.
      *   Target: ~1,500 words.

  8.  **Final Polish:**
      *   Check the "Orphan" definition: "argument survives being detached from its authorship."
      *   Ensure the ending is unresolved regarding agency.

  *(Self-Correction during drafting)*: I need to make sure I don't explain the findings. I need to show Elena seeing the compliance metric go up when she adds hedges. I need to show her seeing the annotations and realizing they help. I need to show her thinking about the phone screens.

