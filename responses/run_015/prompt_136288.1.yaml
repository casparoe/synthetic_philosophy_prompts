answer: |-
  **MEMORANDUM**

  **TO:** Committee on Archives and Digital Access
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Miriam Hale Digital Estate Project

  **Context**
  We are tasked with deciding how to provide digital access to the literary estate of Miriam Hale. We have two proposals from the vendor. The first, "Reading Room mode," allows users to search the archive and receive only verbatim quotes from Hale's actual papers, footnoted by source. If the archive holds no answer, the system replies with a specific line from her 1994 diary stating she has nothing to say on the matter. The second, "Correspondence mode," uses a constrained persona system to speak in the first person, combining and rewording her texts to answer questions she was never asked, including events that happened after her death.

  Our committee is evenly divided. The IT office advises that Correspondence mode is the only interface users will engage with. The literary executor (Ms. Hale's niece) supports both modes, noting the personal comfort of being able to "ask her aunt a question." Conversely, Ms. Hale's son has objected in writing, citing a 2016 interview in which his mother explicitly stated she did not wish to be reconstructed after death.

  **Recommendation**
  I recommend that the Committee **authorize Reading Room mode immediately** as the sole public interface for a period of **twenty-four months**. I recommend we **do not authorize Correspondence mode at this time.**

  We will revisit this decision at the October meeting in two years. At that time, the authorization for Reading Room mode will be renewed automatically unless usage data suggests it is functionally useless, in which case we will reopen the bid for Correspondence mode.

  **Conditions for Authorization**
  To ensure this decision is actionable and verifiable, the following conditions apply:
  1.  **Vendor Compliance:** The vendor must configure the system so that the "I have no idea what to say" diary line appears whenever a query yields no verbatim match. This cannot be bypassed by the system guessing an answer.
  2.  **Usage Review:** The IT office will provide a usage report at the twelve-month mark. If fewer than 50 unique users access the Reading Room in the first year, the Committee must convene a special session to reconsider Correspondence mode.
  3.  **Shutdown Trigger:** If the vendor updates the software to allow probabilistic guessing (answering without a source) without Committee approval, the contract is to be terminated immediately.

  **Rationale**
  We are not merely choosing software; we are choosing how the college relates to the dead.

  There is a thought experiment about a man talking to a book that contains every answer a famous scientist might have given. The question is whether the book is a person, or just a shadow of one. The difference lies in the capacity for failure. A real person can misunderstand you, lose patience, change the subject, or refuse to answer. A database can only fail by accident. If we build a system that simulates a person but cannot genuinely refuse or admit ignorance, we are not building a partner; we are building a puppet that always nods.

  Reading Room mode respects this distinction. It admits when it does not know. It offers her words, but it does not offer her presence. It treats the archive as a record of a life that has ended, rather than a service that continues it. This aligns with the stated wishes of the deceased, as recorded by her son. It also protects the college from the ethical risk of claiming a dead woman said things she never had the chance to deny.

  **The Case for Correspondence Mode**
  Those who advocate for Correspondence mode argue that an archive is not a mausoleum; it is a tool for the living. Their argument is that Ms. Hale's work was about connection, and a static database betrays the spirit of her teaching. They argue that the "Correspondence" label is clear enough to prevent deception, and that the comfort it offers her grieving family outweighs the philosophical risk of simulation. They contend that if we have the technology to let students feel they are learning *from* her rather than *about* her, we have a moral duty to use it. To lock the archive behind a sterile search bar is to prioritize purity over utility. If the goal is to keep her voice alive in the college, a silent book fails where a conversation succeeds.

  This is a generous and human argument. It assumes that the benefit to the living justifies the simulation of the dead. It assumes that we can build a machine that honors her without pretending to be her.

  **Why I Recommend Against It (For Now)**
  I am not convinced we can build that machine yet. The IT office tells us the Reading Room will be a curiosity. That may be true. But if the only way people will engage with Ms. Hale's life is by pretending she is still here to answer the phone, we have already lost the thread of who she was. She was a writer who valued truth. A system that cannot say "I don't know" is a system that cannot tell the truth.

  We should start with the truth we have: the documents. If, after two years, the community demonstrates that the documents are not enough to sustain her legacy, we may then consider whether a simulation is the lesser of two evils. But we cannot start with the simulation and work backward.

  **Where This Argument May Be Wrong**
  *(To be read aloud at the meeting)*

  "I want to be clear about where my own reasoning is most fragile. I am assuming that the 'Reading Room' mode feels honest to users. It is possible that users will treat those verbatim quotes as a conversation anyway, projecting a personality onto the footnotes just as they would onto a chatbot. If that happens, my distinction between 'record' and 'partner' collapses, and I would have to abandon my objection to Correspondence mode.

  Furthermore, I am assuming that the 'I don't know' response is a feature. It might be a bug. If students find the system frustratingly silent and stop using the archive entirely, then my recommendation has effectively buried Ms. Hale's work more deeply than a chatbot ever could. If the usage report in twelve months shows that no one is reading her diaries because they can't talk to them, I will be the first to vote to turn the Correspondence mode on. I would rather have a flawed conversation than a perfect silence."
