answer: |-
  People keep asking me to find the thread. What ties the wooden boats to the church choir, the freezing sea to the neighbour's fence? If I say he loved pleasure, it sounds too small. Like he was just feeding a hunger.

  Ray didn't want comfort. Comfort is numb. Ray wanted to feel the weight of things.

  He did the crossword in ink because there had to be a consequence. He swam in January not despite the cold, but for it. He'd joke that the swim was only worth it for the whisky afterwards, but he knew the truth. The whisky tasted like gold because of the cold. The joy wasn't a feeling hidden inside the moment; it was the whole shape of the day. The effort, the shock, the relief.

  That's why he sang bass in a choir he didn't believe in. He believed in the song. He believed in standing shoulder to shoulder and making something big that none of you could make alone. That's why he spent afternoons fixing fences for nothing. The work wasn't a cost to be paid; it was the point.

  He wasn't collecting hobbies. He was paying attention. He showed up for the hard bits of life so he could earn the good bits.

  To the choir: he loved the harmony. To the sailing club: he loved the water. To his grandchildren: he loved the noise and the mess and the company.

  He didn't leave us a lecture. He left us an example. Don't look for an easy glow. Look for the thing that demands something of you. Then give it.

  We loved him because he was fully here. Fully cold, fully hot, fully present. And we are colder today because he isn't.
