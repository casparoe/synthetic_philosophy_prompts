      *   *Normativity:* High blood sugar is a deviation from a physiological norm. "Disordered behavior" or "distress" involves social/moral norms (what counts as "functional"?).
      *   *Etiology:* Diabetes has a clear mechanistic pathway (insulin/glucose). Mental illness is multifactorial (genes, environment, trauma, meaning).
