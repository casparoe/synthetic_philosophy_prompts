answer: |-
  This is a sharp observation, and you are right to feel that "Goodhart's Law" is an imprecise label for what you are describing. In your seminar context, conflating this with classic Goodhart risks missing the specific structural failure mode you've identified.

  Classic Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") generally implies a **decoupling**: the correlation between the proxy and the target breaks, often becoming negative, because agents game the proxy in ways that harm the target.

  What you are describing is not decoupling. It is **blinding**. The correlation holds globally (historically), but the *local sensitivity* (the gradient) vanishes. The map hasn't become wrong; it has become too coarse for the terrain you are now walking on because you improved the terrain to the point where the map's resolution is insufficient.

  Here is the breakdown of the phenomenon, its distinction from nearby concepts, the verdict on your three cases, and a proposed label.

  ### 1. The Concept: Proxy Saturation (Dynamic Ceiling Effect)

  In psychometrics and clinical measurement, this is statically known as the **Ceiling Effect**: a test is too easy, everyone scores 100%, and you cannot distinguish between "competent" and "expert."

  However, your insight is *dynamic*. The test wasn't too easy at the start; **optimization drove the system into the ceiling.**

  I recommend calling this **Proxy Saturation** or, more evocatively for a philosophy seminar, **The Sensitivity Cliff**.

  **The Mechanism:**
  Mathematically, let $T$ be the Target and $P$ be the Proxy.
  *   **Goodhart:** $\frac{\partial T}{\partial P} \leq 0$ (Optimizing P actively hurts T).
  *   **Proxy Saturation:** $\frac{\partial P}{\partial T} \approx 0$ (Changes in T no longer register on P).

  In Proxy Saturation, the mutual information $I(P; T)$ drops to near zero *within the operational range*, even if the global correlation $r(P, T)$ remains high over historical data. You have optimized yourself into a region of the state space where the proxy is non-informative.

  ### 2. Distinguishing from Nearby Concepts

  You mentioned several candidates. Here is why they are close but not exact:

  *   **Goodhart's Law / Campbell's Law:** These imply *adversarial* or *perverse* incentives. The agent changes behavior to hack the metric. In your cases (especially 1 and 3), the behavior is aligned; the *sensor* is the failure point, not the agent.
  *   **Restriction of Range:** This is the statistical description of the *result* (variance decreases), not the systemic phenomenon. Restriction of range explains why your correlation coefficient might drop in a new dataset; Proxy Saturation explains *why* the metric is now dangerous to rely on for control.
  *   **Base-Rate Problem:** This applies when the event becomes too rare to measure (e.g., measuring safety when accidents almost never happen). Your sleep example isn't about rarity; it's about the *scale* of the measurement tool failing to capture nuance at the high end.
  *   **Regression to the Mean:** This is a statistical artifact of selection. Your phenomenon is a structural limit of the measurement instrument relative to the system's state.

  ### 3. Analyzing Your Three Cases

  Are they the same phenomenon? Cases 1 and 3 are identical. Case 2 is a sibling, but distinct.

  **Case 1 (Sleep Tracker) & Case 3 (ML Reward Model): Proxy Saturation.**
  *   **Verdict:** These are pure instances of **The Sensitivity Cliff**.
  *   **Why:** In both, the optimization succeeded. The target genuinely improved. But the proxy instrument (the algorithm/score) has a finite bit-depth. Once you occupy the top 5% of the distribution, the proxy treats "95th percentile" and "99th percentile" as identical.
  *   **The Danger:** You lose the ability to detect *regression*. If your sleep quality drops from "excellent" to "good," the score stays at 93. The early-warning system is deaf. In ML, if the model starts subtly hallucinating more, but the reward model is saturated on "fluent text," the reward stays high.

  **Case 2 (Counseling Service): Bottleneck Displacement (Sub-optimization).**
  *   **Verdict:** This is **not** Proxy Saturation. It is **Local Optimization** leading to **Metric Obsolescence**.
  *   **Why:** The metric (time-to-first-response) likely didn't hit a mathematical ceiling (it could theoretically go to 0). It stopped being useful because the *system constraint moved*. The metric measured Step A. Step A was solved. Now Step B is the constraint. The metric isn't saturated; it's just measuring a solved problem while the unsolved problem grows invisible.
  *   **Distinction:** In Saturation, the proxy stops moving *because the system is maxed out*. In Bottleneck Displacement, the proxy stops moving *because the system shifted*.
  *   **Relation:** Both result in a "zombie metric" (a number that looks green while the system rots), but the causal mechanism differs. Case 2 is closer to a specific flavor of Goodhart (optimizing a sub-component harms the whole), whereas 1 and 3 are measurement failures.

  ### 4. Can You Detect It From the Numbers?

  Yes. If you are monitoring the proxy during optimization, there are statistical signatures that precede the cliff:

  1.  **Variance Collapse:** As the mean of the proxy approaches its maximum, the variance ($\sigma^2$) should naturally decrease. If the variance decreases *faster* than the mean increases, you are hitting a ceiling.
  2.  **Kurtosis Spikes:** The distribution of proxy scores will shift from normal/bimodal to highly leptokurtic (a sharp spike at the top).
  3.  **Gradient Decoupling:** This requires a "canary" measure. If you have *any* low-fidelity human feedback (even sporadic), plot $\Delta \text{Proxy}$ vs. $\Delta \text{HumanEval}$. When the slope of that relationship approaches zero while the Proxy continues to rise, you have hit the Sensitivity Cliff.
  4.  **The "Second Derivative" Test:** In optimization, look at the rate of improvement. In Goodhart, the target often drops while the proxy rises. In Saturation, the target *plateaus* while the proxy rises (or stays flat). If $\frac{\Delta \text{Proxy}}{\Delta \text{Effort}}$ is constant but $\frac{\Delta \text{Target}}{\Delta \text{Effort}}$ is vanishing, you are in the saturation zone.

  ### 5. Coining the Term

  Since you are in a philosophy/i-School seminar, you need a term that captures the epistemic failure. "Ceiling Effect" is too psychometric. "Goodhart" is too broad.

  I propose you introduce this as **"The Resolution Limit of Optimization"** or, more punchily, **"Metric Blindness via Saturation."**

  However, if you want to claim a specific label for this dynamic version of the ceiling effect, I suggest:

  **"The Sensitivity Cliff"**

  **Definition:** A measurement failure mode wherein successful optimization of a target drives the system into a region of the state space where the proxy measure loses local resolution. Unlike Goodhart's Law, the causal link between proxy and target remains intact; unlike the static Ceiling Effect, the saturation is induced by the optimization process itself. The result is a loss of negative-signal capacity: the measure can confirm success but cannot detect failure.

  **Boundary Conditions (When is it *not* this?):**
  *   **If the proxy becomes negatively correlated with the target:** That is classic Goodhart (Gaming).
  *   **If the proxy measures a sub-component that is no longer the bottleneck:** That is Bottleneck Displacement (Case 2).
  *   **If the proxy was always insensitive (e.g., using a ruler to measure atoms):** That is Instrument Error, not Optimization-Induced Saturation.

  ### Summary for your Seminar

  You can argue that Goodhart's Law covers *adversarial* decoupling, but there is a second, non-adversarial failure mode: **Epistemic Saturation**.

  In Cases 1 and 3, you haven't broken the map; you've outgrown it. The danger isn't that the number is lying (Goodhart); it's that the number has gone deaf (Saturation). In Case 2, the danger is that you're reading the right map for the wrong territory (Bottleneck Displacement).

  Recognizing the difference matters for the fix:
  *   **Fix for Goodhart:** Change incentives, hide the metric.
  *   **Fix for Saturation:** Increase the resolution of the metric (harder test, more granular scale) or switch to a relative ranking system (percentiles) rather than absolute scores.
  *   **Fix for Displacement:** System dynamics modeling to identify shifting constraints.

  This distinction shows you aren't just identifying "metrics are hard," but specifically diagnosing *how* measurement utility decays under success.
