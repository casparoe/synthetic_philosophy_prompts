  Does it change if we do this every week instead of once
  Yes, repetition strengthens your position significantly. In a repeated game, mixed strategies manifest as actual frequencies over time, making the domination observable to your competitors. They can learn your patterns, and the assumption of rationality becomes more robust as players punish irrational pricing deviations. Over weeks, the iterated elimination process becomes a learning dynamic rather than a single abstract calculation, making the theoretical equilibrium you calculated much more likely to emerge in reality.

