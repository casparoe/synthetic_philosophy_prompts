answer: |-
  Your task is not to alleviate suffering, but to determine if the state has failed its duty to protect this specific person from harm inflicted for who they are.

  ### THE DECISION GRID (v.4.2)

  **1. Credibility Assessment (The Foundation)**
  *   **Question:** Is the core account sufficiently coherent and plausible to be accepted as fact?
  *   **Procedure:** Compare testimony against known country information (COI) and internal consistency. Note discrepancies.
  *   **Sufficient Answer:** Core events are accepted as true. Minor inconsistencies do not invalidate the claim unless they go to the heart of the fear.
  *   **Refusal Point:** If the core story is rejected, refuse immediately. No need to assess risk based on fabricated facts.
  *   **[JUDGMENT CALL]:** Distinguishing between trauma-induced memory lapses and fabrication. You have no medical expertise; you are guessing based on demeanor and timeline logic.
  *   **[JUDGMENT CALL]:** Weighing undocumented claims. Lack of papers is normal; lack of detail is not.

  **2. Well-Founded Fear (The Risk)**
  *   **Question:** Is there a real risk of serious harm upon return?
  *   **Procedure:** Assess past persecution (creates presumption of future risk) vs. general violence.
  *   **Sufficient Answer:** Risk is personal and forward-looking. "Serious harm" includes death, torture, inhuman treatment, or severe discrimination.
  *   **Refusal Point:** If the harm is generalized (e.g., civil war affecting everyone equally) or speculative, refuse.
  *   **[JUDGMENT CALL]:** Differentiating "persecution" from " awful conditions." Poverty, crime, and corruption are not persecution unless targeted.

  **3. Nexus (The Reason)**
  *   **Question:** Is the harm inflicted *because of* Race, Religion, Nationality, Political Opinion, or Particular Social Group (PSG)?
  *   **Procedure:** Identify the motivator of the persecutor. For PSG, the group must be identifiable and distinct in the society (e.g., women, LGBTQ+, clan members).
  *   **Sufficient Answer:** The claimant is targeted specifically for a protected characteristic, not just caught in crossfire.
  *   **Refusal Point:** If the harm is personal (vendetta, family dispute) without a Convention reason, refuse.
  *   **[JUDGMENT CALL]:** Defining the PSG. Is it "women" (too broad?) or "women accused of adultery" (specific enough?). This defines the boundary of the Convention.

  **4. State Protection (The Duty)**
  *   **Question:** Is the state the persecutor, or are they unable/unwilling to protect the claimant from non-state actors?
  *   **Procedure:** Check COI on police effectiveness and willingness. Presume state protection exists unless evidence proves systemic failure.
  *   **Sufficient Answer:** Evidence that police refuse to intervene due to the claimant's protected status (e.g., won't protect women from honor violence).
  *   **Refusal Point:** If the state is willing and able to protect, refuse. The claimant must seek state protection before seeking international protection.
  *   **[JUDGMENT CALL]:** Assessing "unwillingness." A corrupt police force is not necessarily an unwilling one. You are inferring policy from anecdotal reports.

  **5. Internal Relocation (The Alternative)**
  *   **Question:** Can the claimant safely and reasonably live elsewhere in their home country?
  *   **Procedure:** Identify a safe zone (usually the capital). Assess if the persecutor can reach them there and if life there is "unduly harsh."
  *   **Sufficient Answer:** A location exists where the risk does not follow, and the claimant can integrate without destitution.
  *   **Refusal Point:** If safe relocation is possible, refuse. Refugee status is subsidiary; it is not an immigration route if safety exists at home.
  *   **[JUDGMENT CALL]:** The "Reasonableness" Test. You are deciding what another human being should endure. Is living alone in a capital city "unduly harsh" for a woman with no family? You decide this based on COI, not empathy.

  ---

  ### WORKED FILES

  #### FILE 0492: Female, 34, Claiming Fear of Honor Killing
  **Summary:** Claimant acquitted of adultery by local Sharia-style court but husband's family vowed shame cleansing. Local police refused intervention ("family matter"). Claims capital city police are functional but she has no contacts there.

  1.  **Credibility:** **Accepted.** Acquittal documents verified. Consistent testimony on threats. No material inconsistencies.
  2.  **Well-Founded Fear:** **Established.** Honor killings constitute serious harm (death/torture). Risk is personal.
  3.  **Nexus:** **Established.** PSG: "Women accused of adultery in [Region]." Harm is motivated by gender and perceived moral transgression.
  4.  **State Protection:** **Failed (Partial).** Local police unwilling. However, COI indicates capital police function independently of tribal customs and do enforce criminal law against murder. The state is not *systemically* collapsed, only regionally compromised.
  5.  **Internal Relocation:** **Failed (Claimant).** Capital is accessible. She has no family there, but COI shows women can rent rooms and find textile work.
      *   **[JUDGMENT CALL]:** Is it "unduly harsh" for a solitary woman to live in the capital? Legally, no. Economically difficult, yes. But "difficulty" is not "persecution." The persecutors (husband's family) are regionally bound; they lack the reach or resources to hunt her in the capital.
      *   **[JUDGMENT CALL]:** Will the capital police protect her? They *should*. You are assuming they *will*. This is a presumption of state functionality.

  **DECISION:** **REFUSED.**
  **Reasoning:** Internal Relocation Alternative exists. The state is willing and able to protect her in the capital. She is not a refugee because she does not need to leave her country to be safe; she needs to move cities.
  **Note:** You know the husband's family might find her. You know the capital police might still ignore a "family matter." But the COI says otherwise. You sign the refusal. This is the law.

  #### FILE 0493: Male, 29, Claiming Fear Due to Sexual Orientation
  **Summary:** Claimant gay. Home country criminalizes homosexuality (max life sentence) but COI shows zero prosecutions in last 5 years. Claimant never attacked but states he cannot live discreetly.

  1.  **Credibility:** **Accepted.** Testimony consistent. No evidence of fabrication.
  2.  **Well-Founded Fear:** **Established.** Existence of criminal law creates constant risk of arbitrary enforcement. Psychological harm of concealment recognized as persecution (*HJ (Iran)* principle).
  3.  **Nexus:** **Established.** PSG: "Homosexual men."
  4.  **State Protection:** **Failed.** The state is the persecutor via the criminal code. Even if unenforced, the law legitimizes harm by non-state actors.
  5.  **Internal Relocation:** **Not Applicable.** Law applies nationwide.

  **DECISION:** **GRANTED.**
  **Reasoning:** He should not be expected to conceal his identity. The existence of the law creates a "chilling effect" and risk of arbitrary arrest that amounts to persecution.
  **Note:** This feels safer than File 0492, yet legally it is more robust. The state is the actor of harm here, removing the "protection" debate.

  #### FILE 0494: Male, 40, Political Activist
  **Summary:** Claimant arrested during protest, beaten, released. Claims ongoing surveillance. Story vivid. Provided medical report of scarring. However, stated arrest date as 12th March in initial screen, 14th March in substantive interview, and 12th March in appeal statement.

  1.  **Credibility:** **Failed.**
      *   **[JUDGMENT CALL]:** Is the date of arrest a "core event"? Yes. It anchors the timeline of risk.
      *   **[JUDGMENT CALL]:** Is this a trauma error or a lie? Trauma affects memory, but shifting dates twice suggests fabrication or coaching. You cannot verify the arrest independently.
  2.  **Well-Founded Fear:** **Not Assessed.** Without credible facts, risk cannot be calculated.
  3.  **Nexus:** **Not Assessed.**

  **DECISION:** **REFUSED.**
  **Reasoning:** Credibility undermined. Material inconsistency regarding the central event of persecution. Medical report proves injury, but not cause or date.
  **Note:** He was probably beaten. He probably is at risk. But he got the date wrong twice. If you grant this, you invite fraud. If you refuse, you might send a man to be tortured. You refuse. The procedure requires a stable factual foundation; he broke it.
