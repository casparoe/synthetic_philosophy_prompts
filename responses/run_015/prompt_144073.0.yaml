answer: |-
  This is a sharp set of questions that cuts through the legal technicalities to the underlying political philosophy. The US/UK divergence isn't just a regulatory mismatch; it represents two different ontologies of public office and two different theories of what constitutes the "public good" in an administrative state. Here is a reconstruction of the implicit theories, their stability, and their blind spots.

  ### 1. The US Exception: The Ontology of Discretion
  The FCPA's facilitation payment exception strictly presupposes a **substantive-outcome theory of corruption**. On this view, the specific "good" that public office protects is the *correctness of the decision*, not the *process of the administration*.

  **What the exception strictly needs to assume:**
  It must assume that the official's duty is bifurcated into "judgment" (which must be unbuyable) and "mechanics" (which can be expedited). It presupposes that time and queue position are *private goods* that the official effectively owns or controls, rather than *public goods* distributed according to impartial rules. If the queue were a public good, selling a place in it would be theft from the other people in the queue. The US rule implicitly treats the queue as a neutral background condition, not a resource subject to distributive justice.

  **What merely fits well:**
  A theory based on "appearance of partiality" fits the exception poorly. If the problem with bribery is that it makes the government *look* corrupt, a grease payment looks exactly like a bribe to an observer. Therefore, the US exception cannot be grounded in public confidence or expressive theories. It relies almost exclusively on a utilitarian calculation: the harm of the delay outweighs the harm of the payment, provided the substantive outcome is unchanged.

  **The Weak Point:**
  The theory collapses if timing *is* the outcome. In customs, a delay can mean spoilage, missed market windows, or contract penalties. If the "substantive outcome" includes the economic viability of the shipment, then expediting the process *does* change the outcome. The US rule assumes a static world where "approval" is binary and time-independent, which is rarely true in global commerce.

  ### 2. The Ministerial/Discretionary Distinction: Stability Check
  The distinction between ministerial (mechanical) and discretionary (judgment-based) acts is the load-bearing wall of the US exception, but it is structurally unstable in practice.

  **The Instability:**
  To say an official has "no discretion" in processing a form is a legal fiction. They always have discretion over *when* they pick up the pen. By allowing payments for "routine governmental action," the US rule admits that officials have control over timing. If they have control over timing, and timing has value, then they are distributing a valuable resource.
  If corruption is the sale of public authority for private gain, selling "speed" is selling public authority. The US rule tries to bite the bullet by saying only *substantive* authority counts. But this creates a category error: it treats the *exercise* of power as distinct from the *administration* of power. In a bureaucracy, the administration *is* the exercise of power.

  **Can it bite the bullet?**
  It can only hold if we accept a **formalistic definition of duty**. The rule asserts: "Your duty is to sign this if criteria X are met. It does not matter *when* you sign it." This requires a view of citizenship where rights are not time-sensitive. As soon as you admit that citizens have a right to *timely* service, the ministerial distinction crumbles, because delaying service becomes a violation of duty, and paying to fix that violation becomes a bribe to overlook a dereliction of duty.

  ### 3. The UK Approach: Integrity of Function
  The UK Bribery Act 2010 presupposes a **deontological theory of public office**. The core offense is "improper performance of a relevant function."

  **The Implicit Theory:**
  This view holds that the *relationship* between the official and the citizen is the primary good to be protected, not just the outcome. The official is a fiduciary of the public trust. Accepting *any* private advantage for doing a public duty breaches that fiduciary bond, regardless of whether the duty was performed correctly. The payment transforms the nature of the act from "public service" to "private service," even if the content of the service is identical.

  **Underdetermination:**
  The UK practice is philosophically underdetermined between two distinct rationales:
  1.  **Inherent Wrongness:** It is intrinsically wrong to monetize public duty (Kantian/Deontological).
  2.  **Systemic Risk:** Small payments normalize the habit of paying, leading to larger demands (Consequentialist/Slippery Slope).

  The law does not distinguish between these. This matters because if the rationale is #1, then *no* exception is ever possible, even in life-or-death scenarios. If the rationale is #2, then exceptions *should* exist where the slippery slope is contained (e.g., sealed transparent boxes for fees). The UK's blanket ban suggests a commitment to #1, but enforcement discretion often relies on #2. This creates a gap where the law says "absolute integrity" but practice says "don't get caught/it's too small to matter," which undermines the normative clarity the Act seeks to establish.

  ### 4. Transactional vs. Relational Models
  You are correct that both regimes presuppose a **Weberian, transactional model of bureaucracy**. They assume the interaction is a one-off exchange: Money $\leftrightarrow$ Act. This implicitly rules out **Maussian or Clientelist conceptions of the gift**, where the payment is not a price but a token of ongoing mutual obligation.

  **The Blind Spot:**
  Western law criminalizes the *quid pro quo*. In clientelist systems, the "quo" may not be immediate or specific. The gift builds a relationship of loyalty that *might* yield help later. By focusing on the discrete transaction, US/UK law fails to capture the corruption of the *institutional culture* via relational bonding. Conversely, it also fails to recognize that in some contexts, refusing a "gift" is an act of aggression that severs the social bond necessary for the bureaucracy to function at all.

  **What a Relational Rule Would Look Like:**
  If we took the relational view seriously, a corruption rule could not ban "payments." It would have to regulate **reciprocity**.
  *   **Permitted:** Gifts that establish symmetric solidarity (e.g., shared meals, ceremonial tokens) where the expectation is general goodwill, not specific acts.
  *   **Forbidden:** Gifts that create asymmetric dependency or specific expectation of favor.
  *   **Compliance Change:** Instead of a "zero tolerance" policy, compliance would require **disclosure and reciprocity audits**. Employees might be *required* to give return gifts to maintain equilibrium, or to register gifts in a public ledger to transform private obligation into public knowledge. The focus would shift from "did you pay?" to "does this relationship compromise your loyalty to the public over the long term?" This is much harder to enforce but ontologically more accurate to how power works in many Global South contexts.

  ### 5. Corporate Bans: Overdetermination and Counterfactuals
  The corporate practice of banning grease payments even where US law allows them is a case of **normative overdetermination**. Multiple incompatible theories lead to the same practical rule.

  **The Overdetermined Theories:**
  1.  **Risk Management:** We can't train staff to distinguish "facilitation" from "bribery" in high-stress environments, so ban all to avoid liability.
  2.  **Expressive/Reputational:** We want to be seen as "clean," and grease payments look dirty to investors/NGOs.
  3.  **Level Playing Field:** We don't want our competitors (who also ban it) to gain an advantage, or we don't want to advantage large firms who can afford to wait over small firms who must pay.

  **Where they diverge:**
  These theories diverge on *exceptions*.
  *   If the theory is **Risk**, you might allow payments if there is a physical safety threat (humanitarian exception).
  *   If the theory is **Expressive**, you never allow exceptions, because the *act* damages the brand.
  *   If the theory is **Fair Competition**, you might allow payments if *everyone* is doing it, to prevent your firm from being driven out of the market.
  Most corporate policies adopt the **Expressive** stance (zero tolerance) but justify it with **Risk** language.

  **The Welfare-Consequentialist Counterfactual:**
  If we replaced the current presuppositions with a **welfare-consequentialist view** (where the goal is maximizing social utility), the rule might flip.
  *   **Argument:** In a broken bureaucracy, low-level clerks are underpaid. The state fails to provide resources. "Grease" payments act as a shadow salary that keeps the bureaucracy functioning. Refusing to pay clogs the system, hurting the local economy and citizens waiting in line.
  *   **The Rule:** A welfare-based compliance policy might **require** grease payments up to a certain cap in specific jurisdictions, treating them as a "efficiency tax" necessary to unclog the system, while simultaneously lobbying for systemic reform.
  *   **Why this doesn't happen:** This presupposes that the corporation has a mandate to optimize local social welfare, which conflicts with the fiduciary duty to shareholders (avoiding legal risk) and the deontological view that one should not participate in corruption regardless of consequences. The current ban presupposes that the *integrity of the firm* is more important than the *efficiency of the foreign bureaucracy*.

  ### Summary of Philosophical Commitments
  The US/UK split reveals that "corruption" is not a natural kind but a constructed category.
  *   **US:** Corruption = Distortion of **Judgment**. (Time is private).
  *   **UK:** Corruption = Contamination of **Role**. (Time is public).
  *   **Corporate Policy:** Corruption = **Risk/Reputation**. (Compliance is insulation).
  *   **Relational View:** Corruption = Asymmetric **Obligation**. (Compliance is transparency).

  The weak point in all of them is the assumption that the Western legal definition of "public office" maps onto the reality of the jurisdictions where these companies operate. The US rule assumes the bureaucracy *should* work mechanically; the UK rule assumes the official *should* act impersonally; the Corporate rule assumes the firm *can* remain separate from the local ecosystem. All three are often empirically false, which is why the compliance gap persists.
