  # JOINT STATEMENT OF CLARIFIED POSITIONS
  **On the Nature of Political Liberty**

  **Date:** 24 May 2024
  **Parties:** The Negative-Liberty Proponent (NL) & The Republican Proponent (R)
  **Subject:** Resolution of Terminological Disputes and Identification of Substantive Cruxes

  ### Preamble
  After twelve months of dialectical engagement, we acknowledge that our persistent disagreement stems not from a confusion of facts, but from divergent conceptualisations of 'freedom'. We have engaged with a third perspective, the *Resilience View* (RV), which posits that freedom is a function of how robust one's options are against shifts in another's will. Whilst neither of us adopts the RV as our primary definition, engaging with it has forced us to isolate exactly where our own views diverge. This document records our common ground, our distinct definitions, and the specific cases upon which our disagreement turns.

  ### Part I: Agreed Premises
  *Both signatories affirm the following numbered claims:*

  1.  **Political Significance:** Liberty is a primary political value. Disagreement on its definition does not diminish its importance in evaluating institutions.
  2.  **Interference:** Actual interference by another agent (preventing someone from doing what they wish) reduces freedom on *both* our accounts.
  3.  **The Benign Master:** We agree that a relationship involving a 'Benign Master' (who has the power to interfere arbitrarily but chooses not to) is politically precarious. We disagree only on whether to label the subject in this relationship 'unfree'.
  4.  **Voluntary Servitude:** We agree that entering a contract of voluntary servitude alters one's normative status. We disagree on whether this act instantly extinguishes liberty or merely creates a binding obligation that remains compatible with liberty until enforced.
  5.  **Plurality:** We accept that 'freedom' may be used in multiple senses in ordinary language. Our dispute is over which sense is *politically* salient.
  6.  **Non-Moralisation:** We agree that freedom should be defined descriptively (as a status or condition) rather than morally (as that which is good). A tyrant can be free; a saint can be unfree.

  ### Part II: Distinct Conceptions
  *Each signatory asserts the following wording as their operative definition:*

  *   **NL Statement:** "An agent is free to $\phi$ if and only if no other agent physically prevents or coercively threatens to prevent them from $\phi$-ing. Power without exercise is irrelevant to liberty."
  *   **R Statement:** "An agent is free to $\phi$ if and only if they are not subject to the arbitrary will of another. The capacity for interference, even if unexercised, constitutes domination and thus unfreedom."

  ### Part III: The Matrix of Disagreement
  *The following table isolates the cruxes. Settling any single row would significantly alter the political programme of at least one signatory. We have recorded our predictions in advance.*

  | Crux | The Case | NL Prediction (Freedom Status) | R Prediction (Freedom Status) | Why This is a Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Benign Master** | A slave has a master who is psychologically incapable of cruelty and legally bound by tradition to never interfere. The slave lives a life of luxury and unimpeded movement. | **Free.** No interference occurs. The master's inability to be cruel removes the threat. | **Unfree.** The status of slavery remains. The master *could* theoretically be succeeded by a cruel one, or the tradition could change. The dependence itself is the unfreedom. | Tests whether liberty is a *condition of action* (NL) or a *status of relationship* (R). |
  | **2. Voluntary Servitude** | An agent signs a legally binding, irrevocable contract to obey another's commands for 10 years. No commands are issued in Year 1. | **Free (in Year 1).** Until the command is issued, the option set remains physically open. The contract is a moral/legal constraint, not a physical barrier. | **Unfree (in Year 1).** The signing itself transfers standing power. The agent is now dominated, regardless of whether the master speaks. | Tests whether liberty is lost via *actual obstruction* or via *normative subordination*. |
  | **3. The Algorithmic Custodian** (Resilience Test) | An AI Custodian holds standing, unappealable power to void any contract you sign above £10k. It follows published code. It statistically never voids contracts (0.001% rate). However, a human Admin can update the code's threshold without appeal. | **Free.** The algorithm is rule-bound. The Admin's power is distant. Unless the AI actually voids a contract, your option set is intact. | **Unfree.** The Admin holds arbitrary power over the rules. Your ability to contract depends on their will not changing the code. You live at their mercy. | Tests whether *institutional resilience* matters. NL sees stability; R sees structural vulnerability. |
  | **4. Moralisation** | A law prevents a mob from lynching a minority. The minority is physically restrained from walking in the park (to protect them). | **Unfree.** They are physically prevented. The goodness of the law does not negate the loss of liberty. | **Unfree.** (Agrees). Non-domination is not the same as justice. One can be non-dominated but still interfered with for good reasons. | Tests whether 'freedom' is being used as a proxy for 'all-things-considered goodness'. |

  ***

  # ANALYTICAL COMMENTARY
  **Prepared by the Facilitator**

  You asked me to throw a spanner in the works using the *Resilience View* and to determine which rows in the table above represent genuine disagreements versus verbal disputes. Below is the analysis of the Joint Statement produced above.

  ### 1. The Function of the Resilience View (The Spanner)
  The Resilience View (RV) suggests that freedom is not binary (free/unfree) but gradient, based on how quickly your options vanish if another's will changes.
  *   **Against NL:** RV shows that NL ignores *risk*. If your options exist only because a dictator is currently sleepy, NL calls you 'free'. RV calls you 'fragile'.
  *   **Against R:** RV shows that R is too binary. R says any domination is unfreedom. But RV suggests a master bound by rigid rules (low resilience cost) is less infringing on freedom than a master with whimsical power (high resilience cost).

  In **Row 3 (The Algorithmic Custodian)**, the spanner lands hardest.
  *   **NL** focuses on the *actual* voiding rate (0.001%). Since the algorithm rarely acts, NL sees high freedom.
  *   **R** focuses on the *Admin's power to update code*. Since the Admin can change the rules arbitrarily, R sees domination.
  *   **The RV Insight:** The RV would ask: *How hard is it for the Admin to change the code?* If it requires a parliamentary vote, resilience is high (freedom is high). If the Admin can click a button, resilience is low (freedom is low).
  *   **Exposing the Crux:** This forces NL and R to admit that **Row 3 is a Genuine Disagreement**. It is not merely about words. NL believes political theory should track *actual outcomes* (interference). R believes political theory should track *structural power* (vulnerability). The Algorithmic Custodian case proves that two societies could have identical interference rates (NL says: equally free) but vastly different power structures (R says: unequally free).

  ### 2. Verbal vs. Genuine Disagreements

  **Row 1 (The Benign Master): Mostly Verbal (with genuine stakes)**
  *   **Verdict:** This is largely a verbal dispute about the label 'freedom'.
  *   **Why:** Both NL and R agree the slave is *vulnerable*. NL prefers to call this 'insecurity' or 'risk', reserving 'unfreedom' for actual chains. R prefers to call this 'unfreedom' to highlight the status.
  *   **The Genuine Stake:** The verbal choice drives policy. If you call it 'freedom' (NL), you don't need to abolish the master, just ensure he remains benign. If you call it 'unfreedom' (R), you must abolish the mastership itself. The word choice dictates the political programme, even if the facts are agreed.

  **Row 2 (Voluntary Servitude): Genuine Disagreement**
  *   **Verdict:** Genuine.
  *   **Why:** This is not about labels; it is about the *mechanism of loss*. NL believes liberty is lost only when the door is locked. R believes liberty is lost when you hand over the key.
  *   **The Crux:** If NL is right, contract law is compatible with maximum liberty. If R is right, certain contracts are inherently liberty-destroying, regardless of enforcement. This changes how we regulate employment contracts or debt bondage.

  **Row 3 (The Algorithmic Custodian): Genuine Disagreement**
  *   **Verdict:** Genuine.
  *   **Why:** This is the strongest row. It isolates the *Resilience* variable. NL ignores the *capacity* for the Admin to change the rules because they haven't yet. R captures the *capacity* as domination.
  *   **The Crux:** This determines how we regulate AI and Bureaucracy. NL would regulate only when the algorithm blocks you. R would regulate the *existence* of the unappealable update button. This is a substantive clash over whether law should manage *events* or *structures*.

  **Row 4 (Moralisation): Verbal (Resolved)**
  *   **Verdict:** Verbal (but important to clarify).
  *   **Why:** Both parties agreed in Part I that freedom is non-moralised. They both agree the minority is 'unfree' in the park case, even if the law is 'good'.
  *   **Why it matters:** Often, libertarians and republicans talk past each other because one implies 'unfree = bad' and the other implies 'unfree = interfered with'. By signing Part I, Clause 6, they admitted this was never a real disagreement, only a confusion of rhetoric.

  ### 3. Conclusion
  The introduction of the Resilience View did not solve the dispute, but it successfully migrated the debate from **Row 1** (which is often a stale semantic tug-of-war) to **Row 3** (which is a substantive disagreement about institutional design).

  The Negative-Liberty Proponent cares about the *exercise* of power.
  The Republican Proponent cares about the *architecture* of power.
  The Resilience View cares about the *stability* of power.

  By forcing NL and R to predict outcomes in the Algorithmic Custodian case, you have revealed that their disagreement is not merely about how to use the word 'freedom', but about whether political theory should prioritise **non-interference** (NL) or **non-vulnerability** (R). That is a genuine disagreement worth having.
