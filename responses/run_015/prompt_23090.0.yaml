      *   Plan: Exit with $p = 4/9$ (approx 0.44) or $11/20$ (0.55)? Let's use the standard Piccione/Lipman optimal $p = 0.55$ (11/20).
      *   CDT at intersection: "If I exit, I get 1 (if X) or 10 (if Y). If I continue, I get... well, if I continue, I'll face the same choice again."
      *   Actually, the strongest CDT move is: "Given I am here, the probability I am at Y is less than 1. But exiting dominates continuing if I assume my future self will act optimally *then*."
