answer: |-
  Dear Colleague,

  This is an exceptionally sharp observation, and it touches upon one of the more persistent, yet often unarticulated, tensions in contemporary social ontology. You are quite right to sense that the standard binary of 'holism versus individualism' fails to capture the specific logical topology of the move you have identified.

  To answer your primary question directly: there is no single, canonical label for this specific manoeuvre in the way that, say, 'supervenience' or 'the naturalistic fallacy' have settled meanings. However, it is a recognised failure mode within the literature on micro-foundations. The closest established term is indeed **'crypto-holism'**, but as you have rightly noted, the standard definition usually implies the smuggling in of group *agents* or *intentions*.

  For the purposes of your seminar, I would suggest that the most precise label currently available is **'Parametric Crypto-holism'** (or occasionally, **'The Exogenous Macro-Parameter Problem'**). While the former is not yet a fixed term in the canon, it accurately describes the logical shape: the holistic entity is not reified as an agent, but rather as a set of boundary conditions or parameters that are ontologically individualist in name but holist in function.

  Below, I have set out a precise definition of the phenomenon, distinguishing it from legitimate auxiliary hypotheses and assessing its consistency with methodological individualism.

  ### 1. Logical Structure and Definition

  We might define **Parametric Crypto-holism** as follows:

  > A modelling strategy wherein a researcher claims to provide a micro-founded explanation of a macro-level phenomenon ($M$), but constructs the micro-level rules ($R$) or initial conditions ($C$) by calibrating them against the observed distribution of $M$. Consequently, $M$ is treated as an exogenous parameter within the micro-model, rendering the derivation of $M$ from $R$ and $C$ tautological.

  **The Logical Form:**
  1.  **Explanandum:** The existence of macro-pattern $M$ (e.g., a norm cluster).
  2.  **Stated Method:** Derive $M$ solely from individual interactions ($I$) and local rules ($R$).
  3.  **Actual Move:** Set the parameters of $R$ or the initial distribution of $I$ such that they reflect the statistical properties of $M$.
  4.  **Result:** The model reproduces $M$.
  5.  **Claim:** $M$ is explained by $I$ and $R$.

  **The Error:** The macro-pattern $M$ is doing silent explanatory work. It appears as the *output* of the model, but it was implicitly present in the *input* (the calibration of the parameters).

  ### 2. Boundary Conditions: vs. Auxiliary Hypotheses

  You asked how this differs from an ordinary auxiliary hypothesis. This is a crucial distinction for your students. In a legitimate scientific model, auxiliary hypotheses (or boundary conditions) must satisfy the condition of **independent testability**.

  *   **Legitimate Auxiliary Hypothesis:** "We assume agents have a risk-aversion coefficient of $\alpha$." This is acceptable if $\alpha$ can be measured or justified independently of the phenomenon being explained (e.g., via psychological experiments or prior historical data).
  *   **Parametric Crypto-holism:** "We assume agents have a risk-aversion coefficient of $\alpha$ *because* this value allows the model to reproduce the observed norm cluster."

  The boundary condition for Parametric Crypto-holism is **endogenous to the explanandum**. The parameter is not an independent constraint on the system; it is a mathematical shadow of the very pattern the researcher claims to be explaining. If the parameter cannot be specified without referencing the macro-pattern, the explanation is circular.

  ### 3. Consistency with Methodological Individualism

  Is this genuinely inconsistent with methodological individualism (MI)? The answer requires distinguishing between the *ontological* and *explanatory* commitments of MI.

  *   **Ontological Consistency:** The researcher remains ontologically consistent. They are not claiming that 'society' is a conscious agent or a substance distinct from individuals. They maintain that only individuals exist.
  *   **Explanatory Inconsistency:** They violate the *explanatory* imperative of MI. The core promise of MI is to show how macro-phenomena *arise* from micro-interactions, not how they *persist* given macro-constraints. By treating the macro-distribution as an exogenous parameter, the researcher has effectively halted the regress of explanation at the very level they claimed to dissolve.

  Therefore, it is best characterised not as a contradiction of MI, but as an **explanatory deficit** within an MI framework. It is a case of **incomplete micro-foundations**. The researcher has provided a mechanism for *maintenance* (how the cluster persists given the distribution) but falsely claims to have provided a mechanism for *genesis* (how the cluster arose).

  ### 4. Suggested Terminology for the Seminar

  Since 'Parametric Crypto-holism' is descriptive but not yet canonical, you might also consider framing it through the work of **Daniel Little** or **Jon Elster**.

  *   **Little** discusses this under the problem of **'Shallow Micro-foundations'**, where social structures are taken as given rather than constituted by actions.
  *   **Elster** might classify this as a form of **'Functionalism in Disguise'**, where the existence of the phenomenon is explained by its effects (or its own persistence) rather than its causes.

  However, for logical precision, I recommend sticking to the description of the **Exogenous Macro-Parameter**. It highlights that the 'holism' has not been eliminated; it has merely been relocated from the ontology (what exists) to the methodology (what is taken as given).

  ### 5. Recommended Reading

  To flesh this out for your course, you might refer your students to:

  *   **Daniel Little**, *New Foundations for Microfoundations* (particularly his critiques of models that take social structures as fixed constraints).
  *   **Jon Elster**, *Nuts and Bolts for the Social Sciences* (on the requirement for mechanism-based explanation rather than mere aggregation).
  *   **Harold Kincaid**, *Philosophical Foundations of the Social Sciences* (on the continuum between individualism and holism).
  *   **Tony Lawson**, *Economics and Reality* (for a critical realist perspective on the error of treating closed-system parameters as open-world explanations).

  I hope this mapping proves useful for your seminar. It is a subtle distinction, but one that is vital for training graduate students to read modelling literature with the necessary philosophical rigour.

  Yours sincerely,

  [Your Name/AI Assistant]
