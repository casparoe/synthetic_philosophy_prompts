answer: |-
  Dear Friend,

  It was fascinating to listen to the exchange between Adrian and Beatrice regarding the nature of dreaming, and I have given considerable thought to their respective positions since the meeting. You asked me to adjudicate their arguments move by move, assessing who is right at each step rather than simply declaring an overall winner, and to do so in the form of a letter. I shall attempt to honour that request while maintaining the rigour the subject deserves.

  Adrian opened the debate by defending Norman Malcolm's verificationist stance, arguing that the grammar of dream reports reveals a category mistake in attributing experience to sleep. He noted that we say I dreamt that I was flying rather than I was experiencing flight during my sleep, suggesting that experience applies only to waking consciousness. He supplemented this with the retrospective binding problem, claiming that without a mechanism for access during sleep, there is no subject for whom the dream is present, and that reports depend on memory consolidation upon waking. I would rate Adrian's opening argument as partially right. He is certainly correct that dream reports rely heavily on memory consolidation and that there is a grammatical asymmetry between waking and sleeping reports, which supports Malcolm's verificationist intuition. However, his claim that this constitutes a category mistake is arguably too strong, as grammatical usage does not necessarily dictate ontological reality, and his accessibility point assumes that phenomenal consciousness requires immediate access consciousness, which is a contested premise in philosophy of mind.

  Beatrice replied by invoking Daniel Dennett's anti-theatre argument, asserting that consciousness does not require a central observer and that distributed functional states during REM sleep constitute experience without needing to be watched. She argued that Malcolm's demand for a present subject is a relic of a Cartesian model. I would assess Beatrice's reply as partially right as well. She is correct to reject the Cartesian theatre, as modern cognitive science supports distributed processing, and Dennett is right that experience does not require a homunculus. However, she is somewhat mistaken to assume that distributed functional states automatically equate to phenomenal experience in the absence of any form of access or integration, as this risks conflating unconscious processing with conscious experience, thereby sidestepping the hard problem rather than solving it.

  Adrian countered by pressing the temporal implication of retrospective binding, arguing that if content is only bound at waking, the experience must be at waking, and claiming experience at three in the morning when binding occurs at seven is incoherent due to the requirement of contemporaneity. I find this argument to be mostly right. He successfully highlights a tension in Beatrice's position regarding the timing of phenomenology. If phenomenal experience requires the content to be available to the subject, and availability only occurs upon waking, then logically the experience cannot be contemporaneous with the REM state. His insistence on contemporaneity is a strong intuitive constraint on what we mean by experience, even if some theories of consciousness might allow for delayed access.

  Beatrice responded by suggesting that the dream is a narrative constructed during awakening, analogous to remembering a childhood event, where the experience is now but refers to the past. She claimed Malcolm is wrong to assume experience must occur during sleep. I would rate this response as plausible but partially mistaken. The constructivist view of memory is well-supported, and she is right that the experience of recalling a dream happens upon waking. However, her analogy to childhood memory is slightly flawed because childhood events actually occurred in the world, whereas the dream event did not occur in reality, only the neural trace did. This makes the dream report more akin to a confabulation based on traces than a memory of an experience, which weakens her defence of the dream as an experience in the standard sense.

  Adrian then pressed what he called the collapse objection, noting that if the experience occurs at seven in the morning, reporting it as happening at three in the morning is a mislocation, meaning there is no sleep-bound experience, which collapses Beatrice's position back towards Malcolm's. I would rate this objection as clearly right in terms of logical consistency. He has identified that if Beatrice accepts the temporal displacement of the experience to the moment of waking, she has effectively conceded Malcolm's main point that there is no experience during sleep itself. The only difference becomes whether one calls the waking reconstruction an experience of a dream or merely an experience of a narrative, which is a terminological rather than substantive divergence.

  Beatrice's final move was to distinguish between the temporal location of the neural substrate and the temporal location of the experience, arguing the experience is real upon awakening and causally tied to sleep without being confined within it. I would assess this final distinction as consistent but partially right. She successfully saves the phenomenon of dreaming as an experience by redefining its temporal location, which is a valid philosophical manoeuvre. However, this comes at the cost of changing the common-sense definition of dreaming as something that happens during sleep, meaning she wins the battle for experience but loses the war on the timing of that experience.

  Overall, I believe Adrian is more right regarding the specific question of whether dreams are experiences during sleep. His logical trapping of Beatrice on the temporal location of phenomenology demonstrates that if experience requires access, and access happens at waking, then Malcolm is correct that there is no experience during sleep. Beatrice is more right about the nature of the report and the validity of the waking experience, but she achieves this by shifting the timeframe of the dream itself.

  There are, however, important elements both speakers missed in their exchange. Firstly, neither considered the phenomenon of lucid dreaming, where the subject gains access consciousness during sleep and can signal via eye movements, which directly contradicts Malcolm's claim that there is no subject during sleep and undermines Adrian's accessibility argument. Secondly, they conflated phenomenal consciousness with access consciousness. It is possible that there is something it is like to be in REM sleep phenomenally, even if that content is not accessible for report until waking, a distinction famously drawn by Ned Block. Finally, both speakers treated Malcolm's verificationism as a given, without questioning whether the unverifiability of private experience during sleep truly negates its existence, or merely negates our ability to know it with certainty. A complete theory of dream phenomenology must account for the possibility of unconscious experience, the evidence from lucid dreaming, and the distinction between the generation of content and the access to that content.

  Yours sincerely,

  The Adjudicator
