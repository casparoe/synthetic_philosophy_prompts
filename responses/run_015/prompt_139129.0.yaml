answer: |-
  This is a classic, high-stakes version of a problem that plagues all applied modelling, but your specific context (public health, intervention planning) sharpens the stakes. You are right to suspect that "what models are for" is part of it, but your hypothesis that the fight should *dissolve* once you clarify the question is likely too optimistic.

  Here is a diagnosis based strictly on the dynamics you described, followed by an assessment of the proposed test and a path to progress.

  ### 1. Diagnosis: It is not just verbal, and it is not just methodological.

  You hypothesized that this is a disagreement about purpose (forecasting vs. decision support). That is the surface layer. The deeper layer is an **empirical disagreement about parameter stability**, disguised as a methodological one.

  **The Core Dispute: The Lucas Critique for Epidemiology**
  Side B is effectively articulating the *Lucas Critique* (from macroeconomics) without naming it. They are arguing that the fitted parameters in your workhorse model (transmission rates, contact matrices) are not *structural*; they are reduced-form aggregates that implicitly contain the behavioral responses of the population *under the specific conditions of the training data*.
  *   **Side A's Empirical Claim:** The aggregate dynamics are robust. Even if the micro-assumptions are false, the macroscopic trajectory is an attractor that doesn't shift much when you poke the system. The errors cancel out.
  *   **Side B's Empirical Claim:** The parameters are brittle. When you change the rules (interventions), the behavioral response changes, and because the model hard-codes the old behavior into the parameters, the prediction breaks.

  **The Smoking Gun: The Second Model**
  The existence of the second model (households/workplaces) changes this from a philosophical stalemate to an empirical crisis.
  *   **Fact:** Model 1 and Model 2 fit the past equally well (forecasts agree).
  *   **Fact:** Model 1 and Model 2 disagree on interventions.
  *   **Implication:** This is **Equifinality**. Multiple distinct internal structures can reproduce the same observational data. If two false maps get you to the same destination via the same route *until* you hit a roadblock, but suggest different ways around the roadblock, you cannot use either map to navigate the roadblock without external validation.

  **Is it Verbal?**
  Partly. When Side A says "the model works," they mean $|Y_{predicted} - Y_{observed}|$ is small. When Side B says "the model works," they mean $\frac{\partial Y}{\partial Intervention}$ is accurate. They are using the same word ("validity") to describe two different mathematical properties (fit vs. derivative).

  **Is it Methodological Bedrock?**
  Side A is resting on **Instrumentalism** (Friedman's F-twist): predictive accuracy is the only test of a hypothesis. Side B is resting on **Structuralism**: you need correct causal mechanisms to predict counterfactuals. Neither side can "prove" their philosophy, *but* in this specific case, Side B has the stronger empirical leverage because of the second model. If Model 1 and Model 2 disagree on policy, Side A's instrumentalism fails to select a winner, because *both* are instrumental successes (good forecasts) but *neither* is a policy guide.

  ### 2. Is the "Swap" Exercise the Right Test?

  Your colleague's proposal (refit with a structurally different false process, check forecasts vs. intervention ranking) is a **sensitivity analysis on structure**.

  **Will it settle the argument?**
  It will not convince Side A that their model is "wrong" for forecasting. Side A will correctly point out that if the forecasts survive the swap, the model is still useful for situational awareness.
  **However,** if the intervention ranking flips (which is highly likely given the second model already exists), it **does** settle the policy argument. It proves that the policy recommendation is an artifact of the chosen false structure, not a feature of the data.

  **The Risk:**
  Side A may react by saying, "Okay, so we don't know which intervention is best. We'll just pick the one from the model that predicts next week's cases best." This is dangerous. It conflates *short-term trajectory* with *counterfactual response*.

  **A Better Version of the Test: "Intervention Retrodiction"**
  The "swap" exercise tests *internal consistency*. A stronger test is *external validation against known regime shifts*.
  1.  Take data from before a major known intervention (e.g., a past lockdown or school closure).
  2.  Fit both models to the pre-intervention data only.
  3.  Ask both models to forecast the period *during* the intervention, explicitly modelling the intervention as a parameter change.
  4.  Compare to what actually happened.

  If the workhorse model fails to capture the *magnitude* of the change in $R_t$ during past interventions (even if it fits the waves well), Side B wins empirically. It demonstrates that the parameters are not invariant to the specific regime shift you are planning to enact now.

  ### 3. What Counts as Progress?

  You asked if this impasse is a permanent feature of science with false models. It is a permanent feature of *complex systems*, but the *impasse* is solvable if you change the decision rule.

  **Step 1: Decouple the Products**
  Stop trying to make one model serve both masters.
  *   **Product A (Forecasting):** The workhorse model. It is fast, fits well, and is good for "What will happen if nothing changes?" or "Where are we in the wave?" Side A wins here.
  *   **Product B (Policy):** An ensemble of structurally diverse models (including the workhorse and the household model). Side B wins here.

  **Step 2: Quantify "Policy Uncertainty"**
  When Model 1 and Model 2 disagree on interventions, that disagreement is not a bug; it is a **measurement of structural uncertainty**.
  *   *Current State:* "Model 1 says close schools. Model 2 says close bars. Fight."
  *   *Progress State:* "Our structural uncertainty regarding transmission pathways is high. The expected value of information suggests we need better contact data before committing to venue-specific closures. In the meantime, we recommend only interventions where Model 1 and Model 2 agree (e.g., masking)."

  **Step 3: The "Stress Test" Protocol**
  Adopt a formal rule: **No model is used for intervention planning unless it has passed a retrodiction test on a similar past intervention.**
  If the workhorse model predicts waves well but failed to predict the *drop* in transmission during the last lockdown accurately, it is banned from lockdown planning, regardless of its wave forecasting skill. This moves the criterion from "predictive success" (Side A) to "causal fidelity" (Side B) specifically for the policy question.

  ### 4. Summary Recommendation

  Your hypothesis is half-right: it is about what models are for. But it is also about **risk**. Side B is arguing that using a forecasting model for policy is a specific type of risk (model risk) that is not captured by forecast error metrics.

  **Do not try to convince Side A that their model is "false."** They know. They don't care.
  **Convince them that "Forecast Accuracy" $\neq$ "Policy Robustness."**

  The concrete test you need is not just swapping structures (which shows equifinality), but **holding out intervention data**.
  *   If the workhorse model can fit the curve but cannot retrodict the *effect of a known policy change*, then Side B's empirical claim (parameters are not invariant) is validated.
  *   If both models agree on the retrodiction of past interventions, then the disagreement on *future* interventions is merely a difference of opinion on the *type* of new intervention, and you can average them.
  *   If they disagree on the retrodiction, you have empirical proof that you cannot trust either for policy.

  **The Impasse:**
  This will not end permanently. As the virus evolves and behavior shifts, the parameters will drift. The "permanent feature" is that you must constantly re-validate the link between fit and mechanism. The "solvable impasse" is agreeing that **agreement on forecasts does not justify action when mechanisms disagree.** If the team can adopt that as a governance rule, the arguments will stop being circular and start being about data collection to resolve the structural uncertainty.
