answer: |-
  # Architectural Specification for Interpretive Theory of the French Revolution (1789–1795)

  ## 1. Core Desiderata
  An adequate interpretive theory must satisfy the following five criteria to account for the trajectory from the Estates-General to the Thermidorian Reaction. Each desideratum specifies the phenomenon to be covered, the conceptual distinction to be preserved, and the concrete historical puzzle it addresses.

  ### D1: The Dual-Phase Coherence Requirement
  *   **Phenomenon:** The theory must explain the *acceleration* into radicalization (1793–94) and the *deceleration* into reaction (Thermidor) using a single causal logic, rather than treating Thermidor as a distinct counter-revolution or external interruption.
  *   **Distinction to Preserve:** Between **systemic momentum** (the logic of the revolutionary state) and **systemic exhaustion** (the limits of that logic). The theory cannot posit that the mechanisms of the Terror were perfect for salvation and then suddenly broken for reaction; the mechanism must contain the seeds of its own reversal.
  *   **Concrete Puzzle:** Why did the Committee of Public Safety (CPS), at the moment of maximum military victory (Fleurus, June 1794), initiate the Great Terror (Law of 22 Prairial) which directly precipitated its own downfall? The theory must explain why success triggered intensification rather than consolidation.

  ### D2: The Interest-Ideology Differentiation Constraint
  *   **Phenomenon:** The motivation of actors, specifically the Jacobin leadership and the *sans-culottes*.
  *   **Distinction to Preserve:** Between **class interest** (material position, property relations, economic survival) and **ideological commitment** (virtue, republicanism, universalism). The theory must not reduce ideology to a mere mask for interest (vulgar materialism) nor treat ideology as disembodied from social reality (pure idealism).
  *   **Concrete Puzzle:** Why did the *sans-culottes*, who benefited economically from the Maximum (price controls) and the Terror, acquiesce to Thermidor, which dismantled those economic protections? The theory must explain the decoupling of political allegiance from immediate material benefit.

  ### D3: The Geographic Asymmetry Condition
  *   **Phenomenon:** The relationship between the capital and the departments.
  *   **Distinction to Preserve:** Between **Parisian mobilization** (insurrectionary pressure, sectional democracy) and **provincial acquiescence** (fatigue, desire for order, anti-clericalism vs. Catholic revival). The theory must account for how a minority city dictated terms to a hostile or exhausted majority nation, and when that leverage failed.
  *   **Concrete Puzzle:** The failure of the Paris Commune to call the sections to insurrection on 9 Thermidor. The theory must explain why the institutional leverage of Paris collapsed precisely when the central government (the Convention) turned against the executive (the CPS).

  ### D4: The Institutional Reflexivity Puzzle ("Devouring Children")
  *   **Phenomenon:** The elimination of revolutionary architects by their own institutions.
  *   **Distinction to Preserve:** Between **structural inevitability** (the logic of purification requires endless victims) and **agentive contingency** (specific factional miscalculations, personality conflicts, rhetorical errors).
  *   **Concrete Puzzle:** The execution of Robespierre, Saint-Just, and Couthon. Was this elimination structurally predetermined by the creation of the Revolutionary Tribunal and the definition of "enemy of the people," or was it the result of the specific coalition formed between the Committee of General Security, the Plain, and disgruntled Jacobins? The theory must specify the ratio of structural pressure to contingent choice.

  ### D5: The War-Revolution Feedback Loop
  *   **Phenomenon:** The impact of external military threat on internal political structure.
  *   **Distinction to Preserve:** Between **emergency measures** (temporary suspension of rights for survival) and **permanent state formation** (the normalization of exception).
  *   **Concrete Puzzle:** Why did the Terror persist after the primary external threat receded (early 1794)? The theory must explain the lag between military security and political liberalization, or explain why military security was deemed insufficient without internal purification.

  ---

  ## 2. Flagged Tension: Jointly Unsatisfiable Desiderata
  **The Determinacy-Contingency Tension**

  I flag a conflict between a strong reading of **D1 (Dual-Phase Coherence via Structural Logic)** and **D4 (Agentive Contingency in Elimination)**.

  *   **The Conflict:** If a theory posits that the Terror was structurally inevitable due to the logic of popular sovereignty in a crisis (satisfying D1 via macro-structure), it struggles to explain why the Terror ended *precisely* when it did via a parliamentary coup (Thermidor) rather than military dictatorship or civil war. If the structural forces were strong enough to compel the Great Terror, they should be strong enough to dictate the *mode* of its ending.
  *   **The Unsatisfiable Pair:** A theory cannot simultaneously claim that the trajectory was **macro-structurally determined** (the Revolution *had* to become totalitarian to survive) and that the turning point was **micro-contingent** (Robespierre fell because he made a speech error on 8 Thermidor).
  *   **Resolution Requirement:** An adequate theory must mediate this by showing how structural constraints narrowed the field of agency without eliminating it. It must explain why the structural pressure manifested as a parliamentary coup *at that specific moment* rather than treating the coup as a mere accident layered over determinism.

  ---

  ## 3. Performance of Interpretive Families
  Brief assessment of how major historiographical families fare against the specification.

  *   **Materialist/Class-Struggle (e.g., Soboul, Lefebvre):**
      *   *Strengths:* Strong on D2 (Interest) and D5 (War/Economy). Explains radicalization as a response to bourgeois/property constraints and war economy.
      *   *Weaknesses:* Fails D1 and D4. Struggles to explain Thermidor as anything other than a "bourgeois reaction," which ignores that many Thermidorians were regicides and former terrorists. It treats the "devouring of children" as class cleanup, missing the intra-class factionalism. It often collapses D4 into structural inevitability, missing the contingency of 9 Thermidor.
  *   **Ideological/Political-Culture (e.g., Furet):**
      *   *Strengths:* Strong on D1 and D4. Explains the "devouring" as inherent to the logic of democratic legitimacy and the concept of the "general will" (opposition becomes conspiracy).
      *   *Weaknesses:* Fails D2 and D5. Often treats material conditions (hunger, war) as secondary to discourse. Struggles to explain why the *sans-culottes* (D2) abandoned the Jacobins if ideology was the primary driver, and underestimates the coercive necessity of the war effort (D5).
  *   **Contingency/Revisionist (e.g., Doyle, Tackett):**
      *   *Strengths:* Strong on D4 (Contingency) and D3 (Paris/Province dynamics). Explains the fall of Robespierre as a specific convergence of fears and alliances.
      *   *Weaknesses:* Fails D1. By emphasizing accident and circumstance, it struggles to explain the *pattern* of radicalization. If everything was contingent, why did the trajectory move so consistently toward centralization and violence across different factions (Girondins, Hébertists, Robespierrists)? It risks making the Revolution a series of errors rather than a coherent trajectory.

  ---

  ## 4. The Counterfactual Stress Test
  **Scenario:** *The Committee of Public Safety dissolves itself voluntarily in mid-1794 (Prairial), citing military victory and the restoration of order, rather than being overthrown on 9 Thermidor.*

  **Specification Requirement:**
  Any adequate theory must utilize its core mechanisms to predict the trajectory following this voluntary dissolution and state whether the outcome differs materially from the actual Thermidorian Reaction.

  *   **Materialist Prediction:** The theory must predict immediate economic destabilization. Without the coercive apparatus of the CPS to enforce the Maximum and requisitions, the market would spike, leading to *sans-culotte* insurrection or a military crackdown to protect property.
      *   *Divergence from Actual:* High. Actual Thermidor involved a gradual dismantling. A voluntary dissolution might have triggered immediate class warfare rather than a parliamentary consolidation.
  *   **Ideological Prediction:** The theory must predict a crisis of legitimacy. If the logic of the Revolution requires perpetual vigilance against conspiracy, voluntary dissolution is an ideological contradiction. The theory should predict that factions would immediately accuse the dissolving members of treason, leading to a purge *by others* even if the CPS stepped down.
      *   *Divergence from Actual:* Low. The outcome (elimination of the Terrorists) remains similar, but the mechanism shifts from coup to accusation.
  *   **Contingency Prediction:** The theory must predict a power vacuum. Without the CPS, the Convention lacks an executive. The prediction should focus on which faction fills the void (e.g., the Committee of General Security or the Army).
      *   *Divergence from Actual:* Variable. Depends on the specific alliances formed in the vacuum.

  **Adjudication Criterion:**
  A theory fails the stress test if it claims the counterfactual is **impossible** without explaining *why* (structural lock-in) versus **unlikely** (agentive resistance).
  *   If the theory argues the CPS *could not* dissolve voluntarily due to structural pressures (War/Class), it must demonstrate that the actual Thermidor was functionally equivalent to a forced dissolution (i.e., the structural outcome was inevitable, only the agentive path differed).
  *   If the theory argues the CPS *could* have dissolved, it must explain why the actual historical actors failed to perceive this rational exit strategy.

  **Final Constraint:** The theory must not treat the actual outcome (Thermidorian Reaction) as the *only* possible outcome. It must delineate the range of possible trajectories had the agency of the CPS differed, while respecting the structural boundaries identified in D1 and D5. If the theory claims the Terror was structurally necessary, it must predict that a voluntary dissolution would have resulted in immediate state collapse or foreign invasion, thereby validating the structural necessity through the negative prediction.
