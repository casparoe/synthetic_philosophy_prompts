      *(Self-Correction on Insight 3)*: How to make them *feel* the ought?
      Ask them to sign a "Calibration Certificate."
      "I certify that 12 is the correct continuation."
      Then ask: "If you sign this, and next week you write 100, are you *lying* or just *changed*?"
      The discomfort of signing is the feeling of the "Ought."

  9.  **Structuring the Response:**
      *   **Conduct Advice:** First, because it frames the design.
      *   **Materials:** Detailed list for home prep.
      *   **Session Outline:** Minute-by-minute.
      *   **Debrief Guide:** Mapping activity to Kripke.
      *   **Troubleshooting:** Specific advice for the Math Teacher, Scientist, Solicitor.
      *   **Limitations:** What the activity can't do.

  10. **Refining the "Dictionary B"**:
      To make the deviant rule "simple" in Dictionary B, Dictionary B needs a primitive for the deviant sequence.
      Let's call the sequence $S_{dev}$.
      Dictionary A: $S_{std} = \{+2\}$. $S_{dev} = \{+2, \text{then } +90\}$.
