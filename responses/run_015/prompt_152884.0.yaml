  10. **Final Polish:** Ensure the voice sounds like a helpful consultant speaking to a Sixth Form Chair (respectful but rigorous).

  *(Self-Correction on "Two Sides of A4")*: Since I am generating text, I cannot physically limit pages, but I will structure the "Procedure" section to be dense and concise enough that it *could* be printed on two sides. I will use bolding and lists to simulate the handout format.

  *(Final check on the three distinctions)*: The prompt asks: "Please tell me which of these, if any, is doing real work and which is decoration, and if you drop one, say what it was screening for."
  My analysis:
  1. Load-bearing: Real work.
