      *Refining the Cases:*
      Case (i) is evidentiary.
      Case (ii) is pastoral/ethical.
      Case (iii) is epistemological (testimony vs. silence).

      *The "Hardest to Defend":* Definitely Braithwaite. Keeping a known inaccuracy on a war memorial is volatile. I must explain *why* (the 1921 promise is a binding moral contract).

      *Limitations:* The procedure cannot fix power imbalances in the archive. It cannot resolve disputes about *meaning* (e.g. "Was Kell evil or a product of his time?").

  9.  **Final Review against constraints:**
