      *   *Check:* Did I answer the specific questions about the three distinctions? Yes. Did I include the menu? Yes. Did I identify the trade-offs? Yes.

      *(Self-Correction during drafting)*: I need to make sure the procedure fits the "two sides of A4" constraint conceptually, even if I'm writing in a chat interface. I will format it clearly as "The Protocol."
