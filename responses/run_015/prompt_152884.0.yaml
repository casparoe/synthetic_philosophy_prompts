      *   **Constraints:**
          *   Must be usable by untrained people in a 40-minute meeting.
          *   Must fit on two sides of A4 (for the procedure itself).
          *   Must produce written reasons suitable for the Deputy Head (Pastoral) and Governors (if building names involved).
          *   Budget: ~1 day archivist time per half-term.
          *   Language: British English.
          *   Tone: Plain, uncomfortable truths allowed, no dressing up value judgments as evidence.
      *   **Specific Requirements:**
          *   Ordered series of questions (decision procedure).
          *   Criteria for sufficient answers.
          *   Stop points (status quo, escalate to values, send to research).
          *   Menu of dispositions (not just keep/remove).
          *   Evaluate three specific distinctions provided by the user (Load-bearing vs. Decorative, Substitution vs. Vacancy, Memory-bearer proximity).
          *   Run the procedure on three specific live cases (Kell, Braithwaite, 1976 Girls).
          *   Identify the hardest case to defend.
          *   Identify trade-offs (accuracy vs. relationships/promises).
          *   Identify limitations (archive bias, meaning vs. fact).

  2.  **Evaluate the User's Three Distinctions:**

      *   *Load-bearing vs. Decorative:* This is crucial. It distinguishes between history that has legal/financial/social consequences now (scholarships, treaties, reparations) and history that is just narrative. This *must* stay. It determines the stakes.
      *   *Substitution vs. Vacancy:* This is also useful. It asks about the structural impact of the correction. Does the new truth fit the old slot (e.g., "He was a benefactor" -> "She was the real benefactor") or does it destroy the slot (e.g., "He was a benefactor" -> "He was a thief")? This helps decide the *disposition* (annotate vs. remove). This *must* stay.
      *   *Memory-bearer Proximity (Participants/Heirs/Adopters):* This is the weakest. While it sounds fair, in a school context, "heirs" often just mean "old families" and "adopters" can mean "historians." It risks privileging lineage over truth or community impact. However, it *does* screen for "who gets hurt." I should refine this rather than discard it. Let's call it "Stakeholder Proximity" – focusing on who bears the consequence of the change, not just who remembers it. Actually, the prompt asks to keep, correct, or discard. I think "Proximity" is often a proxy for "Harm." I will correct it to focus on *Harm/Impact* rather than just genealogical proximity, as that's what actually matters for pastoral sign-off. But to respect the user's wish to keep their framework if possible, I will argue that "Proximity" is actually screening for *Vulnerability to Harm*. I'll keep it but redefine its function in the procedure.
      *   *Decision:* I will keep all three but refine the third one to ensure it's not just snobbery. It screens for *moral weight*, not just chronological closeness.

  3.  **Drafting the Procedure (The "Heritage Protocol"):**

      *   Needs to be tight. 40 minutes means max 10-12 questions.
      *   Needs clear "Exit Ramps" (Status Quo, Research, Values Escalation).
      *   Needs the "Menu of Dispositions."

      *   *Structure:*
          1.  Triage (Is this ours to decide?)
          2.  Evidence Check (Silence vs. Contradiction)
          3.  Distinction Application (The User's Three)
          4.  Disposition Selection
          5.  Escalation (Values/Research)

      *   *Refining the "Silence" problem:* The prompt specifically worries about archive silence. The procedure needs a step that asks: "Is the silence accidental or intentional?" (Hard to know). Better: "Does the silence contradict the memory, or just fail to support it?"
      *   *Refining the "Values" handoff:* If the evidence is clear but the outcome is painful, that's a values call. That goes to the Head/Governors. The Committee advises.

  4.  **Developing the Menu of Dispositions:**

      *   Retain (Unchanged)
      *   Retain (With Context/Annotation)
      *   Relocate (Move from prominent to archive/display)
      *   Suspend (Pending Research)
      *   Dual Narrative (Publish the disagreement)
      *   Remove (Vacate the slot)
      *   Rename/Replace (Substitution)

  5.  **Applying to the Three Cases:**

      *   *(i) Alderman Kell:*
          *   Evidence: Draft findings (strong but unpublished). Slave compensation (factual).
          *   Load-bearing: Scholarship, Hall name (Yes).
          *   Substitution/Vacancy: Vacancy (Saviour -> Profiteer).
          *   Proximity: Adopters (School) vs. Outside Historian.
          *   *Verdict:* Annotate/Contextualise. Don't remove name yet (evidence draft), but change the "Saviour" narrative. Hardest part: admitting the money source without legal fallout on the scholarship.
      *   *(ii) H. Braithwaite:*
          *   Evidence: Contradicts memorial (Died at home, not fallen). BUT Headmaster agreed to it as a "kindness."
          *   Load-bearing: Memorial service, Family tradition (Yes).
          *   Substitution/Vacancy: Vacancy (Fallen -> Died of TB).
          *   Proximity: Heirs (Great-granddaughter present).
          *   *Verdict:* Retain. This is a promise/relationship case. The "fact" is less important than the pastoral agreement made in 1921. This is a "Values" override.
      *   *(iii) 1976 Girls:*
          *   Evidence: Silence (Missing logs, no prize lists). Oral testimony (9 witnesses). Photo (uncaptioned).
          *   Load-bearing: Reputation/Trust (Yes).
          *   Substitution/Vacancy: Substitution (Invisible -> Visible).
          *   Proximity: Participants (Still alive).
          *   *Verdict:* Dual Narrative/Suspend. Acknowledge testimony, note archive gap. "The archive is silent, but the memory persists."

  6.  **Identifying the Hardest Case:**

      *   Case (ii) Braithwaite. It requires explicitly prioritising a 1921 kindness over 2024 factual accuracy. It looks like lying. But it's honouring a pastoral promise. This is the "Accuracy vs. Relationship" trade-off.

  7.  **Addressing Limitations:**

      *   Archive Bias: The procedure assumes archives are neutral. They aren't. Need a caveat.
      *   Meaning vs. Fact: The procedure handles facts well. It struggles with interpretation (e.g., "Was this discriminatory?").
      *   Power Dynamics: The school deciding on outside communities (Kell's enslaved people).

  8.  **Drafting the Content (Iterative refinement for tone and length):**

      *   *Tone:* Formal, British, precise, unsentimental.
