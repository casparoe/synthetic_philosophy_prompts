answer: |-
  **THE HERITAGE COMMITTEE PROTOCOL (DRAFT 1.0)**

  **Purpose:** To determine the school's public stance on historical claims where memory and record diverge.
  **Authority:** Recommendations require Deputy Head (Pastoral) sign-off. Building names require Governors' approval.
  **Time Limit:** 40 minutes per proposal.
  **Research Budget:** Max 1 day archivist time per half-term.

  ### PART A: THE DECISION PROCEDURE

  **1. Triage: Jurisdiction and Stakes**
  *   **Q1:** Is the claim about an event/person external to the school (e.g., a funder's source of wealth) or internal (e.g., a pupil's service)?
      *   *External:* Proceed to Q2.
      *   *Internal:* Proceed to Q2.
      *   *Note:* If external, acknowledge we are adjudicating another community's past. Proceed with caution.
  *   **Q2 (Load-bearing Test):** Does a present relationship, legal settlement, scholarship, or promise rest on this memory?
      *   *Yes:* **Load-bearing.** High risk. Any change requires Governors/Pastoral approval.
      *   *No:* **Decorative.** Lower risk. Committee may decide.

  **2. Evidence Status**
  *   **Q3:** What is the relationship between the Record and the Memory?
      *   *Contradiction:* Record explicitly disproves Memory. (Go to Q4).
      *   *Silence:* Record contains no mention; Memory asserts fact. (Go to Q5).
      *   *Ambiguity:* Record is open to interpretation. (Send to Research).
  *   **Q4 (Contradiction):** Is the Record definitive (official log, certificate) or interpretive (memoir, letter)?
      *   *Definitive:* Memory is factually unsupported.
      *   *Interpretive:* Memory may stand as alternative narrative.
  *   **Q5 (Silence):** Is the silence likely accidental (lost logs) or structural (exclusion of a group)?
      *   *Accidental:* Treat as 'Ambiguity' (Send to Research).
      *   *Structural:* Treat Memory as valid counter-evidence. (Go to Q6).

  **3. Impact and Structure**
  *   **Q6 (Substitution vs. Vacancy):** If we correct the memory, does the truth fit the existing social slot?
      *   *Substitution:* Yes (e.g., Wrong Name → Right Name). **Disposition:** Replace/Amend.
      *   *Vacancy:* No (e.g., Benefactor → Profiteer). **Disposition:** Annotate/Relocate/Remove.
  *   **Q7 (Stakeholder Proximity):** Who is harmed by the change?
      *   *Participants/Heirs:* Direct family or survivors. (High weight to their view).
      *   *Adopters:* School community/Later pupils. (Lower weight).
      *   *Note:* This distinction screens for **Harm**, not just lineage. If Heirs object to a correction, escalate to Values (Q9).

  **4. Disposition Selection**
  *   **Q8:** Select one outcome from the Menu (see below).
      *   *If Evidence is Unclear:* Select **Suspend**.
      *   *If Evidence is Clear but Painful:* Select **Annotate** or **Dual Narrative**.
      *   *If Evidence is Clear and Harm is Low:* Select **Replace** or **Remove**.

  **5. Escalation Points**
  *   **Q9 (Values Escalation):** Does the evidence demand a change that breaks a pastoral promise or causes disproportionate harm to heirs (e.g., Braithwaite case)?
      *   *Yes:* **STOP.** Draft recommendation to **Retain** but **Contextualise**. Refer to Deputy Head (Pastoral). Reason: "Honouring prior commitment over factual precision."
      *   *No:* Proceed to Q10.
  *   **Q10 (Research Escalation):** Do we lack documents to answer Q3 or Q5?
      *   *Yes:* **STOP.** Adopt **Interim Posture**: "The school acknowledges the claim but requires verification." Commission Archivist (max 1 day).
      *   *No:* Finalise Minutes.

  ***

  ### PART B: MENU OF DISPOSITIONS

  1.  **Retain (Unchanged):** Evidence supports memory; no harm identified.
  2.  **Retain (With Context):** Memory is factually incomplete but load-bearing. Add plaque/text explaining the complexity.
  3.  **Relocate:** Move the memory from a place of honour (corridor) to a place of study (archive/display case).
  4.  **Suspend:** Remove assertion pending research. State clearly: "Under Review."
  5.  **Dual Narrative:** Publish both the Record and the Memory side-by-side. Acknowledge the disagreement.
  6.  **Replace (Substitution):** Swap the name/claim for the evidenced one.
  7.  **Remove (Vacancy):** Take down the name/claim. Leave the slot empty or repurpose.

  ***

  ### WORKED APPLICATIONS & ANALYSIS

  **Case (i): Alderman Kell (The Benefactor)**
  *   **Procedure Run:**
      *   Q1: External (Funder).
      *   Q2: **Load-bearing** (Hall name, Scholarship).
      *   Q3: **Contradiction** (Draft findings vs. "Saviour" narrative).
      *   Q6: **Vacancy** (Saviour → Profiteer/Slave Owner).
      *   Q7: **Adopters** (School holds memory; enslaved heirs are external).
      *   Q9: **Values Escalation.** Removing the name affects current scholarship holders.
  *   **Disposition:** **Retain (With Context).**
  *   **Reasoning:** The evidence is draft, not published. Immediate removal risks legal challenge regarding the scholarship trust. However, the "Saviour" claim is factually unsustainable.
  *   **Action:** Update Founders' Day address to acknowledge the Subscribers' Committee. Install a panel in Kell Hall detailing the source of funds (including enslaved compensation). Do not remove the name yet, but cease active celebration.
  *   **Trade-off:** Trading *celebration* for *accuracy*. We keep the name to protect the scholarship (load-bearing), but strip the honour.

  **Case (ii): H. Braithwaite (The War Memorial)**
  *   **Procedure Run:**
      *   Q1: Internal (Pupil).
      *   Q2: **Load-bearing** (Memorial service, Family tradition).
      *   Q3: **Contradiction** (Service records vs. Memorial).
      *   Q6: **Vacancy** (Fallen → Died of TB).
      *   Q7: **Heirs** (Great-granddaughter present).
      *   Q9: **Values Escalation.** The 1921 Headmaster made a specific promise to the mother to count him as fallen.
  *   **Disposition:** **Retain (Unchanged).**
  *   **Reasoning:** This is the hardest case to defend. The record is clear: he did not die in service. However, the school entered a moral contract in 1921 to comfort a grieving mother. To remove the name now is to break a promise made by the institution.
  *   **Action:** Keep the name. Add a small archive note accessible to those who ask, but do not annotate the memorial itself.
  *   **Trade-off:** Trading *Accuracy* for *Fidelity*. We are prioritising a pastoral promise over historical truth. This must be signed by the Deputy Head (Pastoral) as a moral decision, not a historical one.

  **Case (iii): 1976 Girls (The Missing Prize)**
  *   **Procedure Run:**
      *   Q1: Internal.
      *   Q2: **Load-bearing** (Trust/Reputation).
      *   Q3: **Silence** (Missing logs vs. Oral testimony).
      *   Q5: **Structural** (Girls' intake new; logs missing for that specific period).
      *   Q7: **Participants** (Survivors alive).
      *   Q9: No Values Escalation (No promise broken, but harm to trust).
  *   **Disposition:** **Dual Narrative.**
  *   **Reasoning:** The archive is silent, but the silence is suspicious (missing logs). Nine witnesses outweigh the lack of paper.
  *   **Action:** Publish a statement: "The archive contains no record of the 1976 prize. However, the testimony of nine alumni confirms a separate competition existed. We acknowledge this discrepancy as likely evidence of institutional exclusion."
  *   **Trade-off:** Trading *Certainty* for *Justice*. We cannot prove it factually, but we validate the memory against the silence.

  ***

  ### CRITICAL ANALYSIS FOR THE CHAIR

  **1. Evaluation of Your Three Distinctions**
  *   **Load-bearing vs. Decorative:** **Keep.** This is your most vital tool. It separates legal/pastoral risk from narrative preference. It tells you when you need the Governors.
  *   **Substitution vs. Vacancy:** **Keep.** This dictates the *method* of correction. It prevents you from trying to "replace" a benefactor with a critique; they occupy different slots.
  *   **Memory-bearer Proximity:** **Correct.** As you stated it, it is decoration. Genealogy does not grant truth. However, it *screens for Harm*. A great-granddaughter reading a lesson is not a better historian than a postgraduate, but she is more vulnerable to pastoral harm. Rename this distinction **"Stakeholder Vulnerability."** Use it only to gauge the human cost of a decision, not the evidentiary weight.

  **2. The Hardest Case to Defend**
  **Case (ii) Braithwaite.**
  You will have to tell the Committee that you are knowingly keeping a falsehood on a war memorial. You must argue that the school is not just a repository of facts, but a community of promises. The 1921 Headmaster's letter is a binding moral contract. If you remove the name, you honour the dead soldier but betray the living family and the integrity of past Headmasters. This is not a historical decision; it is a pastoral one. Do not dress it up as evidence. Write in the minutes: *"The Committee recommends retention not on evidentiary grounds, but to honour a specific pastoral undertaking made in 1921."*

  **3. Where the Procedure Trades Accuracy for Something Else**
  *   **Braithwaite:** Accuracy is traded for **Fidelity** (keeping a promise).
  *   **Kell:** Full removal is traded for **Stability** (protecting the scholarship trust). We annotate rather than erase to avoid legal/financial disruption.
  *   **1976 Girls:** Evidentiary standard is lowered to prioritise **Trust**. We accept oral testimony over archive silence because we recognise the archive is biased against them.

  **4. Limitations and Systematic Misfires**
  *   **Archive Bias:** The procedure assumes the Archive is a neutral referee. It is not. It was written by the same power structures you are investigating (e.g., the missing 1976 logs). In cases of *Silence*, the procedure instructs you to treat structural silence as evidence of exclusion (Q5). Be vigilant here. If the archive is the oppressor, "Evidence" will always side with the institution.
  *   **Meaning vs. Fact:** This procedure handles *facts* (Did he die in battle? Was the money from slaves?). It cannot handle *meaning* (Was Kell "evil" or "a man of his time"?). If a proposal asks you to judge character rather than events, you must escalate to Q9 (Values). Do not attempt to adjudicate morality with a flowchart.
  *   **External Adjudication:** In Case (i), you are deciding how to remember enslaved people to whom you have no connection. The procedure flags this in Q1, but it cannot solve the ethical problem of a school profiting from a narrative that isn't yours. The "Context" disposition is a compromise that may satisfy no one.

  **5. Final Advice**
  When you present this to the Head of History, emphasise that this protocol does not guarantee truth. It guarantees **consistency** and **transparency** about why truth might be compromised. It allows you to say, "We know this is factually wrong, but we are keeping it for this specific moral reason," rather than pretending the error doesn't exist. That is the only defensible position for a school in the twenty-first century.
