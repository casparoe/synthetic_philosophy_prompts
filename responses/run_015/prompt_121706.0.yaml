      *   Proposed Test: "The Impact Test." If changing a definition materially alters the difficulty of passing a Section 7 amendment (either by changing the denominator or the makeup of the numerator), it triggers Section 7 review.
      *   Actually, simpler: "The Lock Test." Does this change allow a future group to bypass the 3/4 threshold without meeting it? If yes, it's a Section 7 change.
      *   Let's go with: "The Functional Equivalence Test." If changing a definition achieves the same result as changing the voting threshold, treat it as a voting threshold change.

  7.  **Drafting - Iteration 3 (Refining the Validation Clause):**
