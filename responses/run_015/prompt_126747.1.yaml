answer: |-
  ### Headline Counterfactual Selection

  **Headline Case:** Preservation versus Destruction followed by Abandonment (Regeneration).

  **Justification:**
  1.  **Isolation of Ecological Variables:** Conversion to productive use (Case 2) introduces domesticated animal welfare (livestock) and intensive management variables that confound the specific question of *wild* ecosystem suffering. It turns the study into a comparison of wild vs. farm welfare, which is a distinct literature.
  2.  **Tractability:** Climate-driven regime shift (Case 3) requires speculative climate modeling and timeline predictions that exceed a three-year desk budget's reliability. Abandonment trajectories are well-documented in ecological succession literature.
  3.  **Philosophical Purity:** This case best isolates the "Non-identity problem for habitats." It asks: Is a regenerating, disturbed wild landscape morally worse than a stable, intact one, independent of human utility?

  ---

  ### Research Agenda: Six Priority Questions + Synthesis

  **Total Effort Allocation:** 1.00
  **Dependency Structure:** Linear with feedback loops. Q1 blocks all. Q2 & Q3 feed Q5. Q5 blocks Q6 & Q7.

  #### 1. The Normative Framework: Trajectory Construction and Non-Identity (Effort: 0.05)
  *   **Task:** Formalize the "landscape-trajectory" unit. Define the mathematical structure for comparing Possible World A (Intact) vs. Possible World B (Disturbed). Establish the discount rate protocol (e.g., hyperbolic vs. exponential) and the treatment of future generations (Total View vs. Average View).
  *   **Criteria:**
      *   *Impact on Sign:* High. A high discount rate makes succession speed irrelevant; a Total View makes population size dominant.
      *   *Tractability:* High. Conceptual analysis and existing population ethics literature.
      *   *Neglectedness:* High. Most wild animal welfare (WAW) work assumes snapshot comparisons.
      *   *Downstream:* Foundational. All subsequent modeling must fit this structure.
  *   **Dependency:** None (Upstream).

  #### 2. Ecological Succession Modeling: The Time-Profile of Disturbance (Effort: 0.15)
  *   **Task:** Construct meta-models of biomass and primary productivity recovery curves for major biomes (tropical, temperate, boreal) post-disturbance. Map the time $t=0$ (destruction) to $t=steady\_state$ (regeneration).
  *   **Criteria:**
      *   *Impact on Sign:* Medium. Determines the duration of the "disturbed state."
      *   *Tractability:* High. Extensive forestry and restoration ecology datasets exist (e.g., FAO, peer-reviewed succession meta-analyses).
      *   *Neglectedness:* Medium. Standard ecology, but rarely integrated with welfare time-integration.
      *   *Downstream:* Required for Q6 (Integration).
  *   **Dependency:** Requires Q1 (to know *what* to model over time).

  #### 3. The Abundance Trap I: Taxonomic Shift Quantification (Effort: 0.15)
  *   **Task:** Quantify the shift in community composition (Constraint 5). Specifically, estimate the ratio of r-strategists (insects, small rodents) to K-strategists (large mammals, birds) per unit of primary productivity in intact vs. early-successional landscapes.
  *   **Criteria:**
      *   *Impact on Sign:* High. If destruction increases sentience density by 100x (insects), this dominates magnitude.
      *   *Tractability:* Medium. Requires synthesizing biodiversity surveys and biomass partition studies.
      *   *Neglectedness:* High. WAW discussions often assume "more animals = more suffering" without taxonomic granularity.
      *   *Downstream:* Input for Q5 (Sentience Density).
  *   **Dependency:** Requires Q2 (to know the ecosystem state).

  #### 3.5. The Abundance Trap II: Sentience Probability & Weighting (Effort: 0.10)
  *   **Task:** Assign sentience probabilities and moral weights to the taxa identified in Q3. Focus on the invertebrate/vertebrate boundary.
  *   **Criteria:**
      *   *Impact on Sign:* Critical. If invertebrates are excluded, the sign may flip.
      *   *Tractability:* Medium. Philosophical literature + neuroanatomy proxies.
      *   *Neglectedness:* Medium.
      *   *Downstream:* Input for Q5 (Weighted Density).
  *   **Dependency:** Parallel to Q3.

  #### 4. The Abundance Trap III: Welfare Intensity per Subject-Year (Effort: 0.30)
  *   **Task:** Estimate net valence (pleasure minus pain) for the dominant taxa in both landscape states. Use proxies: cause-specific mortality rates (predation vs. starvation vs. disease), stress hormone baselines in literature, and life-history trade-offs.
  *   **Criteria:**
      *   *Impact on Sign:* **Critical.** This is the primary crux. If early-successional life is "hell" (high mortality) but intact life is "neutral," destruction increases suffering. If intact life is also high-suffering (Malthusian), the sign is ambiguous.
      *   *Tractability:* Low. This is the hardest desk work. Proxies are noisy.
      *   *Neglectedness:* Very High. Most WAW work assumes suffering without quantifying intensity differences between habitats.
      *   *Downstream:* The main input for the final calculation.
  *   **Dependency:** Requires Q3 & Q3.5 (to know *who* is suffering).

  #### 5. Temporal Integration & Discounting (Effort: 0.10)
  *   **Task:** Combine Q2 (Time), Q3/3.5 (Density/Weights), and Q4 (Intensity) into a single integral: $\int_{0}^{T} (Density_t \times Weight \times Intensity_t) \cdot e^{-rt} dt$.
  *   **Criteria:**
      *   *Impact on Sign:* Medium. Depends on $r$ (discount rate) and $T$ (succession time).
      *   *Tractability:* High. Mathematical modeling.
      *   *Neglectedness:* High.
      *   *Downstream:* Produces the raw magnitude for Q7.
  *   **Dependency:** Requires Q2, Q3, Q3.5, Q4.

  #### 6. Sensitivity Analysis & Crux Identification (Effort: 0.15)
  *   **Task:** Run Monte Carlo simulations on the model from Q5. Identify which parameter variance contributes most to the error bar. Produce the "explicit statement of which unresolved question the answer is most sensitive to."
  *   **Criteria:**
      *   *Impact on Sign:* Determines the honesty of the error bar.
      *   *Tractability:* High.
      *   *Neglectedness:* Medium.
      *   *Downstream:* Final Output.
  *   **Dependency:** Requires Q5.

  ---

  ### Dropped Questions (Despite Interest)

  1.  **Marine and Aquatic Ecosystems:**
      *   *Reason for Drop:* The framing specifies "terrestrial." Aquatic welfare involves fundamentally different sentience proxies (fish/invertebrates) and disturbance mechanisms (acidification/temperature vs. clearing). Including this would dilute the 3-year budget below viability for terrestrial certainty.
  2.  **Policy Implementation Pathways:**
      *   *Reason for Drop:* The aim is to "determine... whether," not "how to fix." Policy work requires stakeholder engagement and political science, which diverts effort from the core welfare accounting model.
  3.  **Specific Regional Case Studies (e.g., "Amazon vs. Borneo"):**
      *   *Reason for Drop:* The goal is a general sign and magnitude. Deep dives into specific biomes risk overfitting the model to local ecology. Meta-analytic global averages are more robust for a headline claim, provided error bars capture regional variance.

  ---

  ### Triggers for Re-Ranking (First 18 Months)

  1.  **The Welfare Proxy Failure:** If Month 18 review shows that cause-of-mortality data (Q4) is too sparse to distinguish between "intact" and "disturbed" welfare intensity with even order-of-magnitude confidence, **shift 0.20 effort from Q4 to Q3**.
      *   *Rationale:* If we cannot measure *quality*, we must rely on *quantity* (sentience density) and argue from the precautionary principle regarding population size.
  2.  **The Invertebrate Consensus Shift:** If new neuroscientific literature significantly lowers the credence of insect sentience, **shift 0.15 effort from Q3.5 to Q2**.
      *   *Rationale:* If insects are out, the "Abundance Trap" collapses. The relevant biomass shifts to vertebrates, making succession modeling (Q2) the dominant driver of population size.
  3.  **The Succession Stall:** If data shows that "abandonment" rarely leads to regeneration (e.g., permanent grassland state due to soil loss), **shift 0.10 effort from Q5 to Q1**.
      *   *Rationale:* This changes the counterfactual from "Disturbed -> Intact" to "Disturbed -> Permanent Degraded," altering the integration limit $T$ to infinity.

  ---

  ### Provisional Answer (Best Guess Today)

  *   **Sign:** **Positive** (Habitat destruction *increases* total expected suffering per hectare over the trajectory).
  *   **Rough Magnitude:** **10x to 100x increase** in suffering intensity per hectare/year during the early-successional phase (years 0–20), decaying to baseline over 50–100 years.
  *   **Confidence:** **Low (40%).** I am confident in the *direction* of the density shift (more small animals), but low confidence in the *valence* comparison (is a mouse's life in a field worse than a deer's in a forest?).
  *   **Single Crux:** **The Moral Weight of Invertebrates.**
      *   *Why:* If invertebrates count significantly, the sheer numerical explosion of insects in disturbed soil/crops guarantees a massive suffering increase (Constraint 5: high fecundity/mortality). If invertebrates are excluded, the comparison rests on small mammals vs. large mammals, where the suffering differential is much narrower and the population density shift is smaller. If the crux resolves against invertebrate sentience, the sign of the effect could flip to Negative (Destruction reduces suffering by removing complex, long-lived sufferers for short-lived, fewer sufferers).

  ### Hidden Work in Framing Commitments

  *   **Constraint 1 (Time-Integrated):** This hides a massive assumption about the *stability* of the intact landscape. If the "intact" landscape is destined for a climate-driven collapse (Constraint 3, Case 3) anyway, the "Preservation" trajectory has a finite, suffering-heavy end. By treating Preservation as the stable baseline, we risk overstating the loss caused by destruction. The program must explicitly model the "Climate Shadow" on the Preservation trajectory, even if the Headline Case is Abandonment.
  *   **Constraint 5 (Working Hypothesis):** This assumes r-strategists suffer *more* than K-strategists. This is plausible (high mortality), but not guaranteed. A K-strategist dying of starvation over weeks may suffer more than an r-strategist eaten instantly. The program must not treat Constraint 5 as a welfare conclusion, only as an ecological one.
