      *   *Re-evaluation:* If I claim a Right, I cannot consent to an RCT that denies that Right to a control group. That is a violation of the premise. Safe Storage is a friction; RCT denial is a negation. I'll rank the Institutional/Rights tension as highest severity.
      *   *Wait, one more thing:* The "False Conflict." The tension between (1) [Aggregate welfare not enough] and (5) [Restrictions based on empirics]. This dissolves if the restrictions are framed as *competence/eligibility* criteria (like driver's licenses) rather than *outcome* optimization. Driver's licenses aren't there to reduce aggregate crashes primarily; they are to ensure minimum competence. If (5) is framed as competence (waiting period = cooling off/competence, Storage = safety competence), it aligns with (2).

