      *   *Recommendation:* Tweak (a). Don't say individuals are *just* decoration. Say they are *usually* decoration, *unless* they occupy a specific structural bottleneck. Or, change the analogy from "spark" to "keystone species." A keystone species isn't the whole ecosystem, but remove it, and the ecosystem collapses/changes radically. This fits their biology background better than the "spark" analogy.

