  I rejected complex economic sims (cognitive load obscures constraints) and pure debate (no experiential data). A grid-foraging task best isolates behavioral constraints.

  **Materials:** 5x5 grids, hazard/food tokens, move cards (F/L/R), scratch paper, "Ancestral Notebook" (pre-filled with wrong data). "Environment Key" is a hidden sheet showing hazard locations. "Ancestral Notebook" contains maps from a previous class (now outdated).

  **Rules:** Groups of 3. One moves, one records, one watches clock.
  **Rounds:**
  1. **Darwinian:** Draw 5 cards. Move immediately. No notes. Reset every turn.
  2. **Skinnerian:** Draw 5. If hazard, reset. Keep successful sequences for next turn. (Operant conditioning).
  3. **Popperian:** Write 5 moves. Instructor checks against Key. Mark hazards. Revise freely. Execute best plan. (Internal simulation).
  4. **Gregorian:** Read Notebook (maps hazards). Execute. *Twist:* Instructor announces "Environment Shift" after 2 turns. Notebook hazards move. (Cultural scaffolding).

  **Scoring:** +10 Food, -20 Hazard, -1 per Move. Track group totals. Display a leaderboard. Visualize the jump from R2 to R3, and the drop in R4.

  **Timeline:** 
  0-5: Setup groups. 
  5-10: Explain R1. 
  10-20: R1 Play. 
  20-25: Explain R2. 
  25-35: R2 Play. 
  35-40: Explain R3. 
  40-50: R3 Play. 
  50-55: Explain R4. 
  55-65: R4 Play (include shift at min 60). 
  65-80: Debrief.

  **Debrief:** 
  1. **R1 vs R2:** Selection in world. Ask: "How did you learn?" (Painful hits). 
  2. **R2 vs R3:** Selection in head. Ask: "How did you learn?" (Thinking). Maps to Dennett's "trial and error in the world" vs. "trial and error in the head." 
  3. **R3 vs R4:** Scaffolding. Ask: "Did the Notebook make you smarter or just faster?" 
  4. **The Twist:** Reveal hazard shift. Ask: "Who survived?" This proves Gregorian creatures aren't smarter, just equipped with external scaffolding that can rot. This kills the "monotone progress" myth. The ladder is about risk distribution, not just IQ.

  **Predictable Failures:** Students will chat across rounds (contamination). R3 "simulation" feels like just planning, not *inner life*. Groups may rebel in R4 when the Notebook kills them. Enforce silence between rounds.

  **Limitation:** This simulates *competence gradients*, not *phenomenology*. Students won't feel the "inner eye" of the Popperian creature; they'll just see better scores. You must lecture that the *location* of selection (world vs. brain) is the philosophical shift, not the success rate. The game shows why evolution built the rungs, not what it feels like to inhabit them. You must supply the "what it is like" via lecture, linking their frustration in R4 to the vulnerability of relying on cultural memes without verification. Emphasize that Dennett's claim is about *design stance*, not just behavior. The game shows behavior. You must explain the design.
