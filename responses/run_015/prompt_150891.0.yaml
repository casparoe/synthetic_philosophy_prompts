answer: |-
  **Final Examination: Value Theory 605**
  **Instructor: Prof. A. V. Sterling**
  **Time Allowed: 3 Hours**

  **Question 4**

  Consider the position known as lexical threshold negative utilitarianism. This view holds that any amount of suffering lexically outweighs any amount of pleasure, such that no quantity of positive valence can morally compensate for the presence of negative valence above a certain threshold. Critics have raised what we shall term the **Calibration Problem**. This objection posits an apparent tension: lexical ordering似乎 requires suffering and pleasure to be comparable on some shared scale—so that any amount of suffering can be said to outweigh any amount of pleasure—while the motivation for lexical negative utilitarianism often appeals to a qualitative asymmetry in valence that treats suffering and pleasure as not symmetrically measurable at all.

  Write an essay examining whether this tension is fatal to the view. Specifically, address whether a defender can resolve the problem by abandoning cardinal measurement in favor of an ordinal or categorical comparison. Finally, analyze what this resolution implies for cross-personal and cross-modal judgments of affective states.

  ***

  **Model Answer**

  The Calibration Problem posits a structural tension within lexical negative utilitarianism that threatens to render the view incoherent. On one hand, lexical ordering asserts that any amount of suffering outweighs any amount of pleasure. This suggests a comparative relation where suffering and pleasure are weighed against one another within a single axiological framework. On the other hand, the normative motivation for this view often rests on a qualitative asymmetry: suffering is not merely negative pleasure, but a distinct phenomenological category that resists symmetric measurement. The critic argues that if suffering and pleasure are qualitatively asymmetric, they cannot be placed on a shared scale sufficient to support lexical claims. If they are on a shared scale, the qualitative asymmetry is undermined. The student must determine if this contradiction is fatal.

  However, this tension is not fatal. It arises from a category error regarding the metaphysical requirements of lexical priority. A defender of lexical negative utilitarianism need not commit to cardinal commensurability to maintain lexical ordering. Cardinal measurement requires that values be quantifiable on a shared unit scale, allowing for trade-offs, substitution rates, and arithmetic aggregation. Lexicality, by contrast, is fundamentally ordinal or categorical. It establishes a priority rule rather than an exchange rate. To claim that suffering lexically outweighs pleasure is to assert a ranking structure where the class of suffering states is strictly superior to the class of pleasure states, regardless of intensity within those classes. The "weighing" metaphor used by critics is misleading; it is not a balance scale but a hierarchy.

  By abandoning cardinal measurement in favor of an ordinal framework, the defender preserves the qualitative asymmetry. The asymmetry does not imply full incommensurability, which would render all comparison impossible and moral choice arbitrary. Rather, it implies a specific kind of comparability: directional priority. We can judge that a state of suffering is worse than a state of pleasure without measuring how much worse in common units. This resolves the calibration tension because the "scale" is not a continuous line of value units, but a hierarchical ordering of categories. The comparison is not quantitative but structural. We do not need to know the ratio of pain to pleasure; we only need to know the rank.

  This shift has profound implications for cross-personal and cross-modal judgments. In interpersonal contexts, the cardinal approach struggles because comparing units of pain between persons is notoriously difficult, often leading to skepticism about interpersonal utility comparison. The ordinal approach bypasses this epistemic hurdle. We do not need to know if Person A's pain equals Person B's pain in magnitude; we only need to identify that both states fall within the category of suffering, which lexically outranks any category of pleasure. The judgment relies on categorical identification rather than metric calibration. Similarly, for cross-modal judgments—comparing physical pain to psychological distress—the ordinal framework allows us to categorize diverse affective states under the lexical priority of suffering without requiring a universal currency of utility. We can assert that severe anxiety lexically outweighs mild physical comfort without converting both into "hedons."

  Therefore, the Calibration Problem fails to undermine lexical negative utilitarianism because it mistakenly assumes that lexical priority depends on cardinal commensurability. Once we recognize that lexicality is a claim about ranking rather than measurement, the qualitative asymmetry of valence becomes a feature rather than a bug. The view remains coherent: suffering and pleasure are comparable enough to be ranked, but distinct enough to resist symmetric quantification. The tension dissolves when we accept that moral comparison does not require a common metric, only a common hierarchy. The defender successfully navigates the Calibration Problem by rejecting the premise that comparison requires cardinality.

  ***

  **Marking Scheme**

  **Total Points: 100**

  **I. Argumentative Structure and Clarity (20 Points)**
  *   **A Range (18-20):** The essay is tightly structured, moving logically from the definition of the problem to the proposed solution and finally to the implications. Transitions are seamless.
  *   **B Range (15-17):** The essay is organized but may lack fluidity between the problem definition and the solution.
  *   **C Range or below:** Disorganized or difficult to follow.

  **II. Conceptual Precision and Specific Moves (50 Points)**
  *   **A Answer Requirements (45-50 Points):**
      1.  **Lexicality vs. Cardinality:** Explicitly explains why lexical priority does not strictly depend on cardinal commensurability. It must argue that lexicality is a ranking mechanism, not a measurement mechanism.
      2.  **Ordinal Framework:** Articulates how an ordinal framework might preserve qualitative asymmetry without quantitative comparison. It must show how categories can be ranked without being measured on a shared unit scale.
      3.  **Distinction of Problems:** Distinguishes the Calibration Problem from the more familiar problem of interpersonal utility comparison. It must show how the ordinal solution aids interpersonal/cross-modal judgments specifically by avoiding metric calibration.
  *   **B Answer Requirements (35-44 Points):**
      1.  Identifies the tension correctly but relies on cardinal assumptions to resolve it (e.g., suggesting we can just measure suffering differently).
      2.  Discusses ordinality but fails to explain how it preserves asymmetry without collapsing into incommensurability.
      3.  Treats the Calibration Problem and interpersonal utility comparison as identical issues.
  *   **C Range or below:** Fails to identify the core tension or proposes solutions unrelated to the prompt.

  **III. Critical Analysis and Error Avoidance (30 Points)**
  *   **A Answer (27-30):** Avoids specific conceptual traps. Demonstrates nuanced understanding of commensurability.
  *   **B Answer (21-26):** Contains minor conceptual slips but maintains a coherent argument.
  *   **Specific Penalties (Deductions applied to any grade):**
      1.  **The Cardinality Error (-10 points):** Assuming that rejecting cardinal measurement automatically undermines lexical ordering. (The essay must argue the opposite).
      2.  **The Incommensurability Conflation (-10 points):** Conflating qualitative valence asymmetry with full incommensurability. (The essay must distinguish between "cannot be measured equally" and "cannot be compared at all").
      3.  **Recitation (-5 points):** Merely summarizing lexical negative utilitarianism without addressing the Calibration Problem tension.

  **IV. Style and Tone (Bonus/Discretionary)**
  *   Polished American English, appropriate academic register. No citations or bibliographies included.
