answer: |-
  **TO:** Rules and Standing Orders Committee
  **FROM:** Legal Advisory Group
  **DATE:** 7 February
  **SUBJECT:** Recommendation on Proposed Rule 62A ('the Escalator')

  **1. Purpose and Context**

  This memo addresses the proposed Rule 62A ('the Escalator') ahead of our 7 February meeting. Our recommendation must be circulated to branches by 14 February to meet the 60-day notice period for the 15 March AGM. We must be clear: while this appears to be a procedural matter, it determines the substantive future of the Co-operative. Specifically, it dictates whether Rule 3 (affordable homes) can be shielded from a majority seeking to transfer assets for cladding remediation. We cannot pretend neutrality on the effect of our advice, only on the integrity of the process.

  **2. The Bootstrap Problem (Self-Reference)**

  The first objection concerns Rule 62A(4), which protects Rule 62A itself using the very mechanism it creates. Skeptics argue this is logically invalid: you cannot use a simple key to build a lock that requires a master key, and then claim the simple key no longer fits the new lock. They argue that for 62A(4) to be valid, it must be ratified *under* the double-lock it creates (re-enactment).

  We must give this argument its due weight. It is not mere pedantry; it touches on the legitimacy of binding future members. If the initial passage is flawed, any subsequent protection is built on sand. The skeptics are right to worry about a 'procedural ratchet' that locks power away without clear consent.

  However, the demand for re-enactment creates a logical trap. If the first passage is invalid, there is no authority to hold the second vote under the new rules. If the first passage is valid, the second vote is redundant. The stronger philosophical view is that of the 'Ulysses Pact': the current sovereign body (the AGM) possesses the competence to limit its own future competence, provided it does so explicitly. Rule 62 currently permits amendment of any rule, including itself. Using that existing power to restrict future use of that power is consistent with the current constitutional order. To require re-enactment is to demand an impossibility. Therefore, while the skepticism is principled, it should not block passage.

  **3. The Infrastructure Problem (Who Counts as an Amender)**

  A more dangerous flaw has been identified regarding Rules 18, 21, and Schedule 1. The 'double lock' protects specific text, but it does not protect the *people* who vote on that text. Rule 21 determines delegate allocation per branch; Rule 18 governs the membership register. Neither is protected under the draft.

  Consider the consequence: a faction wishing to bypass the protection on Rule 3 need not amend Rule 3 directly. They could instead amend Schedule 1 to redraw branch boundaries, concentrating their supporters into fewer branches to maximise delegate yield under Rule 21. Alternatively, they could tighten Rule 18 to purge opposing members from the 'whole membership' count required for the ballot. They would then possess the 2/3 AGM vote and the majority ballot required by 62A, without ever triggering the double lock's defenses.

  Protecting Rule 3 without protecting the machinery of voting is like locking the front door while leaving the windows open. To make the Escalator effective, Rules 18, 21, and Schedule 1 must be subject to the same double-lock protection immediately upon 62A's passage. Otherwise, the entrenchment is illusory.

  **4. Recommendation**

  We recommend **passing Rule 62A with specified amendments**, rather than deferring or rejecting.

  Deferral past the March AGM is effectively a rejection of the protection faction's aims, as the cladding bill requires immediate authorisation. Rejection leaves the Co-operative vulnerable to simple majority swings on foundational mission issues.

  The Committee should advise the AGM to adopt 62A, conditional on an amendment that explicitly adds Rules 18, 21, and Schedule 1 to the schedule of protected rules upon commencement. This closes the infrastructure loophole. Regarding the bootstrap problem, we advise that the AGM minute explicitly records that Rule 62A is passed under the authority of current Rule 62, acknowledging the self-limiting nature of the act. This transparency mitigates the legitimacy concern without requiring impossible procedural gymnastics.

  **5. Fallback: The Confirmatory Ballot**

  If the Committee remains deadlocked on the bootstrap issue, there is a procedural compromise that satisfies both camps without delaying the March AGM.

  We propose adding a 'Sunset Confirmation' clause to 62A. The rule would pass at the AGM under current Rule 62 powers and take immediate effect. However, the entrenchment of Rule 62A itself (and its protected list) would expire after 12 months unless confirmed by a majority of the whole membership in a postal ballot.

  This costs time and money (approximately £15,000 for a ballot), but it resolves the philosophical impasse. It allows the current AGM to tie the mast, but requires the wider membership to verify the knot within a year. If the ballot fails, the Co-operative reverts to Rule 62. If it passes, the skeptics' concerns are cured by actual double-lock ratification. This is the safest route if we cannot agree on the validity of self-entrenchment.

  **6. Timeline and Action**

  To meet the 14 February circulation deadline, we must finalise our recommendation today, 7 February.

  *   **7 February:** Committee agrees to recommend 62A with amendments protecting Rules 18, 21, and Schedule 1.
  *   **8–14 February:** Drafting of final advice note to branches.
  *   **15 March:** AGM vote on Rule 62A.
  *   **April (Optional):** If the Sunset Confirmation fallback is used, ballot papers issued.

  We must be honest with the branches. This procedure is not neutral. It makes changing the mission harder than changing the assets. That is a political choice, and it belongs to the membership, but our duty is to ensure the mechanism they choose actually works. A double lock that can be picked by changing the branch list is not a lock; it is a suggestion.

  Please review the attached draft amendment language before we vote on this recommendation.

  **End of Memo**
