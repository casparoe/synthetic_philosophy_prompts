answer: |-
  Here is a teaching plan designed for a 75-minute slot, calibrated for students fluent in synchronic formalism but naive to diachronic constraints.

  ### 1. The Sequence and Dependencies

  Do not start with the Dutch Book. Start with the *attitude*. If you start with the bet, the CS students will reduce the principle to a decision-theoretic constraint before they grasp the epistemic novelty.

  **Order of Components:**

  1.  **Conditional Credence as a Present Attitude (0–10 min)**
      *   *Dependency:* None.
      *   *Goal:* Shift $C_t(A | C_{t'}(A) = x)$ from a computed ratio to a current doxastic attitude.
      *   *Why:* Students treat conditionals as "what I will believe if I learn." You need them to treat this as "what I believe *now* about what I *will* believe."
      *   *Action:* Write the formula. Ask: "Is this a prediction or a constraint?"

  2.  **The Physician Case (Ulysses Worry) (10–25 min)**
      *   *Dependency:* 1.
      *   *Goal:* Generate the intuitive tension before formalizing the rule.
      *   *Why:* You need them to feel the pull of the principle (trust future self) and the pull of the exception (know future self is broken) before you tell them which is "correct."
      *   *Action:* Run the case (see vetting below). Ask: "Should she align with her future self now?"

  3.  **Statement of the Principle & CS Link (25–35 min)**
      *   *Dependency:* 1, 2.
      *   *Goal:* Formalize the intuition and anchor the CS students.
      *   *Why:* CS students need to know how this relates to Dynamic Consistency immediately to prevent category errors.
      *   *Action:* State Reflection. Explicitly distinguish from Dynamic Consistency (Belief vs. Plan).

  4.  **The Diachronic Dutch Book (35–50 min)**
      *   *Dependency:* 3.
      *   *Goal:* Show the *cost* of violation, not the *proof* of irrationality.
      *   *Why:* Placing it here allows you to say: "Here is the price of violating Reflection. Now, is that price always unfair?" This avoids the "Exploitability = Irrationality" conflation.
      *   *Action:* Walk through the betting schedule ($t$ and $t'$). Show the sure loss *if* the bookie knows the violation strategy.

  5.  **Leaks vs. Noise (The Critique) (50–65 min)**
      *   *Dependency:* 2, 4.
      *   *Goal:* Distinguish when Reflection is normative and when it is descriptive.
      *   *Why:* This is where the seminar earns its third-year status. It moves from "What is the rule?" to "When does the rule apply?"
      *   *Action:* Analyze the Physician case through this lens. Challenge the "Leaks = Compulsory" intuition.

  6.  **Omissions, Contested Status, and Final Check (65–75 min)**
      *   *Dependency:* All.
      *   *Goal:* Meta-epistemological framing and assessment.
      *   *Action:* Declare what is settled vs. contested. Ask the final question.

  ---

  ### 2. Vetting the Example: The Physician

  Your candidate case is strong but contains a specific hazard that could conflate Reflection with Conditionalization.

  **The Hazard:**
  You wrote: *"Tomorrow she will be handed a screening result... and will, through exhaustion, fail to use [the base rate]."*
  If she receives a result, she receives **new evidence** ($E$). Standard Rationality demands she update via Conditionalization: $C_{t'}(A) = C_t(A | E)$. If she fails to do this, she is violating Conditionalization. While Reflection *also* applies here, students will struggle to separate the violation of Conditionalization (bad updating on evidence) from the violation of Reflection (mismatch between current and future credence).

  **The Fix:**
  To isolate Reflection, the change in credence must **not** be driven by new evidence that the present self cannot anticipate.
  *   **Modify the case:** The physician knows the test result *now* (or the proposition is independent of the test, e.g., "The hospital will be understaffed next week"). She knows that tomorrow, due to exhaustion, her credence in this proposition will shift from 0.8 to 0.5 *without any new evidence*.
  *   **Why:** This makes it a pure case of **known future irrationality** (Noise). It removes the confounding variable of "She learned something I don't know yet."

  **What the Example Must Have:**
  1.  **Transparency:** The present self knows exactly what the future credence will be (or the probability distribution over them).
  2.  **No New Evidence:** The shift in credence is not due to the present self being ignorant of facts the future self will learn.
  3.  **Normative Tension:** The present self regards the future shift as *unwarranted* (epistemically bad), yet Reflection seems to demand alignment.

  **What the Example Must Lack:**
  1.  **Surprise Evidence:** If the future self learns something the present self doesn't, Reflection is compatible with credence change (via the conditional). You want a case where the change looks like *drift*, not *learning*.
  2.  **Self-Fulfilling Prophecy:** The future credence must not be caused by the present bet (standard Dutch book caveat).

  **Verdict on "Leaks vs. Noise":**
  Your intuition ("Reflection compulsory for leaks, false for noise") is **incorrect** and constitutes a pedagogical risk.
  *   **Leaks (Forgetting):** If I know I will forget evidence (e.g., I know I will get amnesia), my future self is *less* informed. Reflection demands I align with them. But rationality suggests I should *not* trust a less informed self. Therefore, Reflection is **problematic for Leaks**. (See: Talbert & Mahmood arguments on forgetting).
  *   **Noise (Processing Error):** If I know I will process evidence poorly, my future self is *unreliable*. Reflection demands I align with them. Rationality suggests I should not. Reflection is **false for Noise**.
  *   **The Correct Axis:** **Anticipated Rationality vs. Anticipated Compromise.**
      *   Reflection is plausible only when I anticipate my future self is **at least as rational and informed** as I am now (Standard Learning).
      *   Reflection is contested/likely false when I anticipate my future self is **compromised** (Noise) or **impoverished** (Leaks).
  *   **Teaching Move:** Use the Physician case to demonstrate that Reflection is **not** a universal requirement of rationality. It is a requirement of *self-trust*. If you know you shouldn't trust your future self, you should violate Reflection. This is the "failure mode" you want them to see.

  ---

  ### 3. Misconception Map

  Here is when and how to head off the specific errors you anticipate, plus the one you missed.

  | Misconception | Status | When to Head Off | How |
  | :--- | :--- | :--- | :--- |
  | **"Current = Expected Future"** | **Real** | **At Statement (Min 25)** | Emphasize the *conditional* form: $C_t(A \| C_{t'}(A)=x) = x$. It is not an unconditional expectation. |
  | **"Adopt Future Credence Now"** | **Real** | **At Ulysses (Min 15)** | Clarify: Reflection does not say "Change your mind to match them." It says "Your current opinion *about* their opinion must match theirs." |
  | **"Conditionalization by Another Name"** | **Real** | **At CS Link (Min 30)** | Explicitly state: Conditionalization governs response to *evidence*. Reflection governs response to *time/self*. One can satisfy Conditionalization and violate Reflection (e.g., known future irrationality). |
  | **"Forbids Changing Mind"** | **Artefact** | **At Statement (Min 25)** | Show the formula allows $C_t(A) \neq C_{t'}(A)$. It only constrains the *relationship* between the two. |
  | **"Sure Loss Against *Any* Bookie"** | **Artefact** | **At Dutch Book (Min 40)** | Specify: The loss is sure only against a bookie who *knows your strategy* and can offer bets at both $t$ and $t'$. It is not a synchronic sure loss. |
  | **"Same as Dynamic Consistency"** | **Real (CS)** | **At CS Link (Min 30)** | **Crucial:** Dynamic Consistency = sticking to a *plan* of action. Reflection = sticking to a *plan* of belief. CS students conflate utility and probability. Distinguish *preference* consistency from *credence* consistency. |
  | **"Future Self is Reliable"** | **Missing** | **At Critique (Min 55)** | **The Hidden Trap:** Students assume Reflection implies the future self is *right*. It does not. It implies the *present* self *takes* them to be right. The Physician case proves you can satisfy Reflection while knowing the future self is wrong. |

  ---

  ### 4. The Final Check Question

  **Time:** Last 5 minutes.
  **Question:** "Construct a scenario where a rational agent *ought* to violate the Reflection Principle. Explain why the Diachronic Dutch Book argument fails to convince them to comply in this specific case."

  **What a Passing Answer Contains:**
  1.  **Scenario:** A case of known future compromise (like the exhausted Physician) or known future forgetting.
  2.  **Justification:** The agent knows their future credence will be formed via a process they currently deem epistemically defective (Noise/Leaks).
  3.  **Dutch Book Rebuttal:** The agent accepts the sure loss as the "price" of avoiding alignment with a known irrational state. They prioritize *accuracy* or *rationality* over *coherence*. (i.e., They deny that exploitability entails irrationality in diachronic contexts).

  **What a Failing Answer Looks Like:**
  *   "When they get new evidence." (Confuses Reflection with Conditionalization).
  *   "When the Dutch Book is too expensive." (Misses the normative point).
  *   "Reflection is always required." (Misses the contested nature).

  ---

  ### 5. What to Decline (and How)

  You cannot cover everything. You must explicitly bracket the following to keep the session focused on the *principle* and its *motivation*.

  **Decline:**
  1.  **Generalized Reflection (Christensen):** The version that handles uncertainty about what your future credence will be (probability distributions over future credences).
  2.  **The Proof Details:** Do not derive the Dutch Book probabilities on the board. Sketch the betting schedule.
  3.  **The History of the Debate:** Do not detail the back-and-forth between van Fraassen, Christensen, and Talbott beyond the core intuition.

  **How to Decline:**
  *   *Script:* "There is a more generalized version of this principle that handles cases where you aren't certain what your future credence will be. That is the state-of-the-art formalism, but today we are isolating the core intuition. If you treat the certain case as settled, the generalized case will make sense later. Also, I am not going to prove the Dutch Book theorem on the board; I want you to understand the *structure* of the vulnerability, not the algebra. Finally, I am presenting Reflection as a problem to be solved, not a law to be memorized. In the literature, whether this is a requirement of rationality is genuinely contested."

  ---

  ### 6. Settled vs. Contested (Pedagogical Bets)

  Be explicit about where the textbook ends and the research frontier begins.

  **Settled (Teach as Fact):**
  *   **The Formalism:** The statement of the principle ($C_t(A | C_{t'}(A) = x) = x$).
  *   **The Mechanism:** That violating it *allows* for a Diachronic Dutch Book (given a bookie with specific knowledge).
  *   **The Distinction:** That it is distinct from Conditionalization and Synchronic Probabilism.

  **Contested (Teach as Debate):**
  *   **Normative Force:** Whether violating Reflection is *irrational* or merely *incoherent*. (Pedagogical Bet: Frame it as incoherent, but note that incoherence might be rational if it avoids known error).
  *   **The Dutch Book Argument:** Whether the DDP successfully proves irrationality. (Many argue diachronic exploitability does not equal synchronic irrationality).
  *   **Known Future Irrationality:** How to handle the Physician case. (Van Fraassen says: You shouldn't know you'll be irrational. Critics say: Sometimes you do, and Reflection should yield).

  **Pedagogical Bets (Mark These for Yourself):**
  *   **Placement of DDP:** I have placed it *after* the intuition but *before* the critique. This bets that students need to see the "cost" before they can evaluate if the cost is "unfair."
  *   **The "Leaks" Correction:** I am advising you to correct the students' (and your notes') intuition that Reflection holds for "Leaks." This bets on the contemporary consensus that forgetting is a counterexample to Reflection.
  *   **The Physician Simplification:** I am advising you to remove the "screening result" (new evidence) to isolate the principle. This bets that clarity of concept is more valuable than realism of the case for this specific hour.

  **Final Advice:**
  Your CS students will try to "solve" Reflection by turning it into an optimization problem. Your job is to keep it in the realm of *epistemic norms*. When they ask "Is it optimal to satisfy Reflection?", answer "That depends on whether you value coherence or accuracy more in that moment." That is the hinge of the seminar.
