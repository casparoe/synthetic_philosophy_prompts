  # Diagnostic Decision Tree: Resource Allocation Under Epistemic Constraints

  **Subject:** Allocation of scarce titanium stock between aerospace fabrication and surgical implants.
  **Condition:** Local engineers and clinicians hold private, non-articulable (tacit) practical knowledge regarding need and utility.
  **User Profile:** Experimental Physicist (focus on information flow, signal integrity, and system boundary conditions).

  **Instructions:** Proceed through the branching questions sequentially. Answer based on your physical and logical intuitions regarding the specific titanium case, not on prior economic readings. Terminal leaves provide a diagnostic classification of the resulting position.

  ---

  ### Branch 1: The Information Constraint
  **Question:** Regarding the tacit knowledge held by the surgeons (implant urgency) and engineers (fabrication tolerances): Is it physically possible to transmit this data to a central planning unit without entropy increase (**lossless compression**), or is the knowledge inherently tied to the local context such that transmission degrades the signal (**lossy preservation**)?

  *   **A. Lossless Compression Possible:** (The central unit can receive the full state vector of local conditions without degradation.)
      *   $\rightarrow$ **Go to Leaf 1.**
  *   **B. Lossy Preservation Inevitable:** (Transmission filters out critical context; the central unit receives a degraded approximation.)
      *   $\rightarrow$ **Proceed to Branch 2.**

  ### Branch 2: The Coordination Mechanism
  **Question:** Given that knowledge is dispersed and signal degradation is inevitable (from Branch 1B): Is a system of exchange ratios (**prices**) generated by independent actors the *only* sufficient carrier of this information, or can a central bureau approximate these trade-offs via **algorithmic trial-and-error** (iterative simulation of supply/demand)?

  *   **A. Algorithmic Trial-and-Error Sufficient:** (A central simulation can converge on optimal allocation without real market prices.)
      *   $\rightarrow$ **Proceed to Branch 3.**
  *   **B. Prices Irreplaceable:** (Only actual exchange generates the necessary signal fidelity.)
      *   $\rightarrow$ **Proceed to Branch 4.**

  ### Branch 3: Institutional Substrate for Algorithms
  **Question:** If algorithmic trial-and-error can substitute for prices (from Branch 2A): Does this simulation require **private capital ownership** to generate valid error signals, or can it operate under **socialized control** (state title to the titanium stock)?

  *   **A. Socialized Control Compatible:** (The state bureau can run the simulation effectively.)
      *   $\rightarrow$ **Go to Leaf 2 (Lange Position).**
  *   **B. Private Ownership Required:** (The simulation fails without private owners generating the errors.)
      *   $\rightarrow$ **Go to Leaf 3 (Unexplored/Redundant).**

  ### Branch 4: Institutional Substrate for Prices
  **Question:** If prices are irreplaceable (from Branch 2B): Do valid prices require **private title** to the capital goods (the titanium stock), or can a state bureau hold title and still generate valid prices?

  *   **A. State Title Sufficient:** (The state can hold assets and still price them.)
      *   $\rightarrow$ **Go to Leaf 4 (Incoherent Position).**
  *   **B. Private Title Required:** (Valid prices cannot exist without private exchange of title.)
      *   $\rightarrow$ **Proceed to Branch 5.**

  ### Branch 5: The Nature of the Impossibility
  **Question:** If private title is required (from Branch 4B): Is the fundamental barrier to socialized allocation due to the **logical absence of a common unit of account** (calculation is impossible without tradeable property), or due to the **empirical loss of dynamic information flow** (knowledge cannot be aggregated even if calculation were logically possible)?

  *   **A. Logical/Accounting Barrier:** (The problem is the lack of a denominator for value, independent of knowledge transmission.)
      *   $\rightarrow$ **Go to Leaf 5 (Mises Position).**
  *   **B. Empirical/Information Barrier:** (The problem is the inability to capture the dispersed state vector, requiring prices as signals.)
      *   $\rightarrow$ **Go to Leaf 6 (Hayek Position).**

  ---

  ### Diagnostic Leaves

  **Leaf 1: Cybernetic Omniscience (Unoccupied/Incoherent)**
  *   **Path:** 1A (Lossless).
  *   **Diagnosis:** This position assumes a central node can ingest the total state of the economy without entropy increase. From an information theory standpoint, this violates bandwidth limits and the tacit nature of local boundary conditions. It is logically possible only in a static, low-complexity system. In a dynamic titanium allocation case, this is **physically incoherent**.

  **Leaf 2: Market Socialism (Lange Position)**
  *   **Path:** 1B $\rightarrow$ 2A $\rightarrow$ 3A.
  *   **Diagnosis:** This position accepts knowledge dispersion but argues a central bureau can simulate market convergence via trial-and-error ("shadow prices") under socialized control. It treats the economy as a solvable system of equations where the state acts as the auctioneer.
  *   **Critique:** Relies on the assumption that the central bureau can observe error signals (surpluses/shortages) as accurately as private owners without the incentive structure of property.

  **Leaf 3: Private Algorithmic Socialism (Unexplored/Unattractive)**
  *   **Path:** 1B $\rightarrow$ 2A $\rightarrow$ 3B.
  *   **Diagnosis:** This position claims algorithms work *better* than prices, but still requires private owners to run them. This is **redundant**: if private owners are required to generate signals, one might as well use the price mechanism they naturally create. It is an unexplored logical combination with no practical advantage over a standard market.

  **Leaf 4: Pseudo-Market Socialism (Incoherent)**
  *   **Path:** 1B $\rightarrow$ 2B $\rightarrow$ 4A.
  *   **Diagnosis:** This position claims prices are necessary but can exist without private property. This is **institutionally incoherent**. Prices are ratios of exchange; without the ability to exchange title (ownership), there is no trade, and without trade, there are no prices—only administrative accounting figures lacking economic signal content.

  **Leaf 5: The Impossibility Theorem (Mises Position)**
  *   **Path:** 1B $\rightarrow$ 2B $\rightarrow$ 4B $\rightarrow$ 5A.
  *   **Diagnosis:** This position argues that without private property, there is no common denominator for capital goods. Even if the central planner had perfect knowledge (contradicting Branch 1), they could not *calculate* efficiency because they cannot value the titanium stock. The barrier is **arithmetical and logical**, not merely informational.

  **Leaf 6: The Dispersed Knowledge Thesis (Hayek Position)**
  *   **Path:** 1B $\rightarrow$ 2B $\rightarrow$ 4B $\rightarrow$ 5B.
  *   **Diagnosis:** This position argues that the primary function of prices is not just accounting, but the telecommunications of dispersed, tacit knowledge. Private property is required because it decentralizes the decision-making to the locus of the knowledge. The barrier is **epistemic and dynamic**.

  ---

  ### Instrument Limitations & Ambiguity Flags

  **1. The Mises-Hayek Overlap:**
  While Branch 5 attempts to separate the *logical* (Mises) from the *empirical* (Hayek) objection, in practice, these positions are highly correlated. A respondent may find both barriers operative. The tree forces a choice for diagnostic clarity, but real-world commitments often treat the lack of property and the loss of knowledge as a single, fused mechanism of failure.

  **2. The "Lossless" Edge Case:**
  Branch 1 assumes a binary distinction between lossless and lossy transmission. In complex systems, this is a spectrum. A respondent who believes knowledge is "mostly compressible" may find themselves oscillating between Leaf 1 and Leaf 6. The tree treats this as a hard binary to force a decision on the *fundamental* limit of centralization.

  **3. Algorithmic Definition:**
  Branch 2 distinguishes "prices" from "algorithms." Modern machine learning blurs this line (e.g., predictive pricing algorithms). A respondent may view advanced AI as a substitute for prices (Branch 2A) while retaining private ownership (Branch 3B). This leads to Leaf 3, which the tree diagnoses as redundant, though a technologist might view it as a novel "augmented market" position not fully captured by the classical debate taxonomy.
