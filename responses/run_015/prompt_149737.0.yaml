prompt: |-
  hey, i'm building a reusable checklist for our risk-calibration team. we insure weird engineered risks — gene-drive releases, orbital-debris cascades, synthetic-pathogen containment failures — and our actuaries publish "objective chance" numbers pulled from physics sims. then we also get internal engineering memos that might bear on the outcome directly, or might just bear on whether the sim itself is miscalibrated. i want you to turn the Principal Principle into a practical proceddure for this: Lewis's basic idea that if you genuinely know the objective chance of A is x, your credence in A should sit near x unless you've got other admissible evidence that doesn't just come from knowing that very chance figure. but i need it adapted for what i'm calling the "two-lock problem" — the published chance is mediated by a model with its own calibration error, so insider evidence can attack the lock on the model rather than the lock on the world.

  the deliverable should be a step-by-step flowchart in words that a non-philosopher can run in about twenty minutes per case, with the hard cases the steps have to handle and the spots where judgment can't be eliminated marked clearly. fix the role: you're the senior calibrator who has to sign off, and the stakes are that we set reserve capital wrong. include a small set of test questions they can apply in order, a "leaky bucket" adjustment rule for model-error evidence, and flag the cases the procedure can't settle. apply it to three worked cases: (1) a gene-drive malaria-release scenario with a published 2% ecological-failure chance but an internal memo about temperature-sensitivity in the simulation grid; (2) a satellite-cascade scenario with a 0.1% published cascade chance but an insider report that the debris-tracking database was recently updated with unverified crowd-sourced entries; and (3) a case where the procedure forces you to stay near the published 4% containment-breach chance despite your gut screaming that the lab culture is reckless — the memo here is about organizational politics, not physics — and say exactly what the procedure cannot do here, like resolving deep disagreements about what counts as admissible. no bibliographies, no "see Lewis 1980", just the operationalized idea. write it casual, like an internal memo, and don't worry if there's a typo or two.
