answer: |-
  **TO:** Risk Calibration Team
  **FROM:** Senior Calibrator (Me)
  **SUBJECT:** New Procedure for Handling "Objective Chance" vs. Insider Evidence (The Two-Lock Protocol)
  **DATE:** Oct 24
  **STATUS:** Effective Immediately

  Team,

  We've got a problem. Our actuaries give us clean numbers from physics sims (e.g., "2% chance of ecological failure"). Then our engineering intel comes in with messy memos (e.g., "the sim grid ignores temperature spikes"). Sometimes you listen to the sim, sometimes you listen to the memo, and sometimes you split the difference. Right now, that decision is too subjective. If we get it wrong, we set reserve capital incorrectly, and we either go bust or price ourselves out of the market.

  We're adopting a modified version of the **Principal Principle**. In plain English: If you know the objective chance is *x*, your belief should be *x*—*unless* you have specific evidence that overrides it.

  But here's the twist: Our "objective chance" comes from a model, not a god. So we have a **Two-Lock Problem**.
  1.  **Lock 1 (The World):** Evidence about the specific case that the model might not see (e.g., this specific lab is sloppy).
  2.  **Lock 2 (The Model):** Evidence that the simulation itself is miscalibrated (e.g., the physics engine ignores wind shear).

  This memo gives you the checklist to handle this in under 20 minutes per case. It tells you when to trust the number, when to adjust it, and when to admit the procedure can't help you.

  ---

  ### THE TWO-LOCK CHECKLIST (20-Minute Max)

  **Step 1: Identify the Published Chance ($P_{pub}$)**
  *   Write down the number from the actuarial sim.
  *   *Example:* 2% failure chance.
  *   *Constraint:* Do not round yet. Keep the precision the model gives you.

  **Step 2: Categorize the Insider Evidence**
  Look at the engineering memo/intel. Is it attacking Lock 1 or Lock 2?
  *   **Lock 1 (World State):** Evidence about the *specific instance* being different from the model's assumptions. (e.g., "This specific release site has higher wind speeds than the average used in the sim.")
  *   **Lock 2 (Model Integrity):** Evidence about the *tool itself* being flawed. (e.g., "The simulation code has a known bug in how it handles heat exchange.")
  *   **Inadmissible (Noise):** Evidence about politics, gut feelings, or factors the model explicitly excludes by design. (e.g., "The lab manager is unpopular," or "I feel unlucky.")

  **Step 3: Apply the Admissibility Test**
  Ask these three questions in order. If you answer **YES** to any, stop and read the "Leaky Bucket" rule below. If **NO** to all, stick with $P_{pub}$.
  1.  Does this evidence describe a physical parameter not captured in the sim inputs? (Lock 1)
  2.  Does this evidence describe a structural flaw in the simulation logic or data sources? (Lock 2)
  3.  Is this evidence verified enough that ignoring it would be negligent? (If it's just a rumor, stop here. Stick with $P_{pub}$.)

  **Step 4: The Leaky Bucket Adjustment (If Step 3 = YES)**
  If the model is "leaking" reliability, you don't throw the number out. You discount it.
  *   **For Lock 1 (World):** Replace $P_{pub}$ with a new estimate based on the specific evidence. The model is irrelevant here because the specific case overrides the general average.
  *   **For Lock 2 (Model):** Apply a **Calibration Discount (CD)**.
      *   *Minor Flaw (CD 10%):* Known issue, bounded impact. (Adjust $P_{pub}$ by ±10% of its value).
      *   *Major Flaw (CD 50%):* Core assumption shaky. (Move $P_{pub}$ halfway toward our industry base rate prior).
      *   *Fatal Flaw (CD 100%):* Model is broken. (Ignore $P_{pub}$, use expert elicitation only).

  **Step 5: Sign-Off or Escalate**
  *   If your final number is within 20% of $P_{pub}$, sign off.
  *   If your final number deviates by more than 20%, you must flag this as a **Hard Case** and get a second signature.
  *   If the evidence is "Inadmissible" but your gut screams danger, flag as **Procedure Limit**. Do not change the number, but add a qualitative warning note to the policy.

  ---

  ### THE LEAKY BUCKET RULE (Operational Detail)

  When Lock 2 (Model) is compromised, we treat the published chance as a "leaky bucket." We don't know how much water is lost, so we assume a worst-case drain based on the flaw's severity.

  **Formula:**
  $$Final Credence = (P_{pub} \times (1 - CD)) + (Base Rate \times CD)$$

  *   **$P_{pub}$:** The published sim number.
  *   **$Base Rate$:** The historical failure rate for this *class* of risk (e.g., all gene drives, not just this one).
  *   **$CD$ (Calibration Discount):** 0.1 for minor, 0.5 for major, 1.0 for fatal.

  *Why?* Because if the model is wrong, the truth is likely closer to the historical average than the broken model's specific prediction.

  ---

  ### HARD CASES & JUDGMENT FLAGS

  This procedure cannot eliminate human judgment. It only structures it. You must explicitly mark these spots:

  1.  **The "Admissibility" Boundary:** Deciding if a memo is "Physics" (Lock 1) or "Politics" (Inadmissible) is subjective. If you argue it's politics, write down *why* it doesn't affect physical parameters.
  2.  **The Discount Size:** Choosing between a 10% or 50% Calibration Discount is not math. It's expert judgment. Document your reasoning.
  3.  **The Base Rate:** If there is no historical base rate (e.g., first-ever gene drive), the Leaky Bucket formula breaks. You must revert to expert elicitation. Flag this.

  ---

  ### WORKED CASES

  Here is how you run this in the wild.

  #### Case 1: Gene-Drive Malaria Release
  *   **Published Chance ($P_{pub}$):** 2% ecological failure.
  *   **Insider Evidence:** Memo notes the simulation grid uses average temperature data, but the release site has a known micro-climate heat island effect not in the map.
  *   **Step 2 (Categorize):** Lock 1 (World). The specific site differs from the model inputs.
  *   **Step 3 (Admissibility):** Yes. Physical parameter mismatch.
  *   **Step 4 (Adjustment):** Since this is Lock 1, the model's average doesn't apply. We don't use the Leaky Bucket. We estimate the failure chance *given* the higher heat.
  *   **Action:** Engineering says heat increases drive failure by factor of 1.5. New Credence = 3%.
  *   **Sign-off:** Deviation is 50% (2% to 3%). **Flag as Hard Case.** Requires second signature.
  *   **Note:** We didn't discount the model; we overridden it with specific data.

  #### Case 2: Satellite-Debris Cascade
  *   **Published Chance ($P_{pub}$):** 0.1% cascade chance.
  *   **Insider Evidence:** Report that the debris-tracking database recently ingested unverified crowd-sourced telescope data without validation.
  *   **Step 2 (Categorize):** Lock 2 (Model Integrity). The input data feeding the sim is contaminated.
  *   **Step 3 (Admissibility):** Yes. Structural flaw in data pipeline.
  *   **Step 4 (Adjustment):** Apply Leaky Bucket. Is this Minor or Major? Unverified data could mean we miss big objects (Major) or just track noise (Minor). Let's assume **Major (CD 50%)**.
      *   $Base Rate$ for cascade events (historical): ~0.5% (conservative estimate).
      *   $Calculation: (0.1\% \times 0.5) + (0.5\% \times 0.5) = 0.05\% + 0.25\% = 0.3\%$.
  *   **Action:** New Credence = 0.3%.
  *   **Sign-off:** Deviation is 200%. **Flag as Hard Case.**
  *   **Note:** The model number was too optimistic because the inputs were dirty. We regressed toward the historical mean.

  #### Case 3: Synthetic-Pathogen Containment
  *   **Published Chance ($P_{pub}$):** 4% containment breach.
  *   **Insider Evidence:** Memo describes intense organizational politics, lab staff morale is low, and the lab director is under investigation for cutting corners. *However*, the memo contains no specific physics data (e.g., no reports of broken seals, no skipped sterilization logs).
  *   **Step 2 (Categorize):** Inadmissible (Noise/Politics). The model assumes protocol adherence. Unless we have evidence protocols *were* violated, morale is not a physical parameter.
  *   **Step 3 (Admissibility):** No. This is about human culture, not the physical chance mechanism *as modeled*.
  *   **Step 4 (Adjustment):** None. Stick with $P_{pub}$.
  *   **Action:** Final Credence = 4%.
  *   **Sign-off:** **Flag as Procedure Limit.**
  *   **Note:** This is where the procedure hurts. Your gut says "this lab is a disaster." But the procedure forces you to stay at 4% because the evidence isn't admissible against the *physics* model.
  *   **Why we do this:** If we adjust based on politics, we introduce bias. Maybe the politics make them *more* careful (fear of getting caught). Without physical evidence of breach, we cannot move the number.
  *   **Mitigation:** Add a qualitative note: "Reserves set at 4%, but recommend operational audit due to cultural risk." Do not change the capital reserve based on vibes.

  ---

  ### FINAL WORDS

  This protocol protects us from two things:
  1.  **Overconfidence:** Ignoring the sim because we think we know better (Case 3).
  2.  **Blind Faith:** Ignoring broken models because "the math says so" (Case 2).

  The hardest part is Step 2. Don't let engineering convince you that "vibes" are "physics." If it doesn't change a variable in the equation, it's Lock 2 at best, or Inadmissible at worst.

  Run these checks. Mark the judgment calls. If you're unsure, escalate. I'd rather we miss a deal than blow up the reserve fund.

  Thanks,
  Senior Calibrator
