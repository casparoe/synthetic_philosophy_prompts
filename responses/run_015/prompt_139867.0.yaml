answer: |-
  This is a genuinely sharp distinction that rarely gets the airtime it deserves. You are right to identify that the standard literature (Street, Joyce, Vavova) almost exclusively models the genealogy as *adaptive selection*, treating the 'adaptive-link' as the primary source of epistemic suspicion. The neutral drift hypothesis changes the topology of the problem: it removes the worry that we are *systematically* misled (e.g. by kin-selection biases masquerading as universal duties) but intensifies the worry that our hitting upon the truth is merely a cosmic accident.

  Here are my credences, followed by the decomposition you requested.

  ### The Credences

  **$P(\text{Moral Knowledge} | \text{Drift})$: 0.28**
  **$P(\text{Moral Knowledge} | \text{Selection})$: 0.18**

  I align with your hunch that drift is, on balance, less damaging, though I am slightly more sceptical than your 0.3 figure. My reasoning is that selection introduces a specific *competing* explanation for our beliefs (fitness) that is plausibly orthogonal or even hostile to truth. Drift introduces no competing explanation other than chance; while chance makes the coincidence of truth improbable, it does not actively posit a mechanism that *diverges* from truth. The 'insensitivity' charge sticks to both, but the 'coincidence' charge is more damning when there is a specific causal force (selection) pushing us away from the target, rather than mere randomness.

  ### Decomposition of Credences

  To arrive at these figures, I have weighted four key factors. Note how the weightings shift between the two scenarios.

  **1. Availability of a Third-Factor Explanation (Weight: 35%)**
  *   **Selection:** This is the realist's best hope (e.g. Parfit or Enoch's strategy: survival is good, or truth aids survival). However, the empirical case that fitness correlates with *moral truth* (rather than just fitness-enhancing falsehoods) is weak. This drags the Selection credence down significantly.
  *   **Drift:** A third-factor explanation is virtually impossible here. There is no link between drift and truth to exploit. One might think this crushes the Drift credence, but since the third-factor move is controversial even under selection, its absence under drift is not a massive *additional* penalty. It simply caps the ceiling.
  *   *Contribution:* This term is the primary driver for the gap between the two numbers.

  **2. Analogy to Perceptual or Mathematical Belief (Weight: 25%)**
  *   **Selection:** The perceptual analogy works well here (evolution shaped vision to track physical reality). If morality is akin to perception, selection helps. But if morality is akin to mathematics (necessary truths), selection is irrelevant or unhelpful.
  *   **Drift:** The perceptual analogy fails completely (drift does not track). However, the mathematical analogy survives better. If moral truths are necessary (like logic), a random walk through normative space might still land on them without needing a tracking mechanism.
  *   *Contribution:* This favours Drift slightly, as it forces the realist to rely on the 'mathematical' intuition rather than the 'perceptual' one, which is less vulnerable to evolutionary genealogy.

  **3. Generalisation ('Proof Too Much') (Weight: 30%)**
  *   **Both:** This is the great equaliser. If the evolutionary argument debunks moral beliefs, does it not also debunk the logical and probabilistic beliefs required to formulate the argument?
  *   **Impact:** This factor provides a 'floor' for both credences. It prevents them from collapsing to zero. However, it applies equally to both scenarios. If the EDA generalises, both genealogies are toxic. If it does not, both are salvageable.
  *   *Contribution:* This sets the baseline. Without this consideration, both numbers would be near 0.05.

  **4. Theory of Justification (Reliabilism vs. Coherence) (Weight: 10%)**
  *   **Both:** If justification requires reliable formation (process reliabilism), both drift and selection look terrible regarding moral truth. If justification is internalist (coherence, reflective equilibrium), the genealogy matters less.
  *   **Impact:** I assume a hybrid view. The genealogy matters, but reflective equilibrium can restore some warrant. This adds a small bump to both figures.
  *   *Contribution:* Minor adjustment, roughly equal for both.

  ### Sensitivity and Revisability

  **Most Sensitive Term:**
  My numbers are most sensitive to the **Generalisation ('Proof Too Much')** factor. If one could demonstrate conclusively that evolutionary debunking arguments *do not* apply to logical or mathematical beliefs (perhaps because those truths are constitutive of rational thought in a way moral truths are not), my credence in the Selection scenario would rise sharply (perhaps to 0.4), as the Third-Factor resources would become more viable. Conversely, if the EDA successfully generalises to logic, both numbers collapse to near zero.

  **First to Revise:**
  I would revise the **Drift** credence first. The assumption that moral psychology is a product of neutral drift is empirically fragile. There is substantial evidence for specific adaptations (cheater detection, kin altruism, reciprocity). If the 'Drift' hypothesis is empirically falsified—which is the prevailing view in evolutionary psychology—then the 0.28 credence becomes a purely modal claim about possible worlds, rather than a guide to actual metaethical warrant. I would fold that probability into the Selection scenario immediately.

  ### The Single Moving Argument

  The finding that would move me most is a robust **empirical demonstration of the adaptiveness of specific moral modules**.

  Specifically, if neuroscience or cross-cultural anthropology showed that our 'deontological' intuitions (often cited as candidates for objective moral knowledge) are directly correlated with specific fitness-enhancing mechanisms in a way that *excludes* truth-tracking, my Selection credence would drop to <0.05. Conversely, if it were shown that moral reasoning capacities track truth *independently* of their fitness benefits (e.g. we possess a moral faculty that often reduces fitness but increases accuracy), my Selection credence would rise to >0.5. The current ambiguity of the empirical data is what keeps my credences in the sceptical range.

  ### The Weakest Link in My Reasoning

  The most likely point of failure in my own reasoning is the **coherence of the 'mind-independent moral facts' premise** itself.

  In assigning non-zero credence to the possibility of knowledge here, I am granting the realist their ontology for the sake of the argument. However, it is plausible that the very notion of 'mind-independent moral facts' is unintelligible or metaphysically profligate. If moral facts are not the sort of thing that *can* be known independently of our constitutive attitudes, then the entire debate between Drift and Selection is a category error. I have priced the epistemic risk of the genealogy, but I have likely underpriced the metaphysical risk of the realist's starting position. If non-naturalist realism is incoherent, both my numbers should be zero.

  ***

  In sum, your intuition holds water: drift avoids the accusation of systematic distortion, which is a heavier burden for the realist to lift than the accusation of randomness. However, without a third-factor link, randomness remains a formidable foe to knowledge claims.
