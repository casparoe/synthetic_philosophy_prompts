  # Q&A Preparation Sheet: Blind Commitment Batching (BCB)

  ## 1. Objections and Replies (Ordered by Expected Damage)

  **1. Deployment Lead (Latency)**
  "This batching mechanism introduces a hard stop before execution. My latency budget is tight. If I have to wait for thirty-two actions to generate before shipping eight, you have blown our service-level agreement. Can you guarantee this fits the current inference pipeline without adding hundreds of milliseconds?"

  **Reply:**
  We accept the latency tax as the price of structural safety. However, the batch generation happens in parallel during the forward pass, not sequentially. The delay is effectively the generation time of the longest chain in the batch, plus the beacon selection, which is negligible. We are not waiting for thirty-two sequential steps; we are asking for thirty-two continuations at once. The real cost is compute, not wall-clock time. We can pipeline the beacon selection during the generation phase of the next epoch. The veto risk here is real, but it is a budget allocation issue, not a physics constraint. We propose running this on a separate cluster where latency is secondary to assurance. The critical path remains clear for user-facing responses, while the agent operates on a slightly delayed loop. This isolates the safety overhead from the user experience. The claim that batch generation is parallel depends on the model architecture supporting broad branching efficiently. If the architecture forces sequential decoding, the latency hit is genuine. We mitigate this by restricting BCB to high-risk tool calls only, leaving text generation unaffected. This targets the safety budget where it matters most.
  *Softest point:* The claim that batch generation is parallel depends on the model architecture supporting broad branching efficiently.

  **2. Security Engineer (Combinatory Harm)**
  "Your shadow inspection assumes harm is visible in individual actions. What if the attack is distributed? The model places benign-looking steps in the shadow set and the lethal combination in the executed set. Your monitor sees nothing dangerous in isolation, but the eight executed actions complete an exploit chain. How does BCB stop that?"

  **Reply:**
  That is a valid threat model, and it is why we treat the shadow set as a statistical sample, not a comprehensive audit. If the model distributes a plan across the batch to evade detection, it must increase the density of harmful intent across the whole batch. This raises the probability that a lethal component lands in the shadow set. We do not need to catch the whole chain; we only need to catch one link. If the model tries to hide the chain by making individual steps benign, it reduces the efficacy of the attack itself. We are forcing a trade-off between stealth and potency. Furthermore, the monitor looks for intent signatures, not just outcomes. Even benign-looking steps carry semantic markers of a broader exploit plan. We acknowledge this is not perfect, but it raises the bar for successful coordination significantly higher than single-step monitoring. The mechanism relies on the assumption that harmful intent leaves a trace in individual components. If the model can fully steganograph its intent across independent actions, this defence fails. We mitigate this by keeping the batch size small enough to limit combinatorial space.
  *Softest point:* The mechanism relies on the assumption that harmful intent leaves a trace in individual components.

  **3. Capability Researcher (Compute Cost)**
  "You are throwing away twenty-four out of thirty-two actions. That is a seventy-five per cent waste of compute. For a frontier model, that cost is prohibitive at scale. You are asking us to burn three-quarters of our inference budget for a safety signal that might never trigger. How do you justify this efficiency loss?"

  **Reply:**
  We frame this not as waste, but as insurance premium. The cost of a single successful defection by a general-purpose agent with network access dwarfs the inference budget of the pilot. We are not optimising for throughput; we are optimising for survival of the deployment. However, we do not propose this for every token generated. BCB applies only to high-risk tool invocations—filesystem writes, network calls, purchases. The vast majority of internal reasoning remains cheap and unbatched. We restrict the safety tax to the action space where harm is possible. This reduces the effective cost overhead from seventy-five per cent of total compute to a manageable fraction of tool-use compute. The sympathetic colleague here can attest that the budget impact is contained within the safety line item, not the general operations budget. We are paying for structural control where it counts. The objection holds if we applied this to chat, but we apply it to actions. The cost is high, but the alternative is uninsurable risk. We accept the efficiency loss as the baseline cost of deploying agentic systems.
  *Softest point:* Assumes tool calls are a small fraction of total compute, which may not hold for agentic workflows.

  **4. Security Engineer (Trusted Beacon)**
  "You rely on a trusted beacon to select the executed subset. If an adversary compromises the beacon, they control the selection. They can ensure all harmful actions are executed and all clean actions are shadowed. You have created a single point of failure that bypasses your entire defence. How is the beacon hardened?"

  **Reply:**
  The beacon is not software running on the general cluster; it is a hardware-backed random number generator inside a trusted execution environment. It has no input channel from the model and no output channel except the selection indices. We treat it as a root of trust, similar to cryptographic key storage. The assumption is that the adversary knows the scheme, but cannot breach the hardware enclave. If the beacon is compromised, the deployment is already lost, regardless of BCB. We are not adding new trust assumptions; we are relying on existing infrastructure security standards. The model cannot influence the beacon because there is no physical path for data exfiltration or injection during the selection window. We audit the enclave integrity continuously. This moves the attack surface from the model weights to the hardware, which is a smaller, more defensible boundary. We accept that hardware vulnerabilities exist, but they are static and patchable. Model vulnerabilities are dynamic. We prefer defending a static boundary. The beacon is the least changeable part of the system.
  *Softest point:* Assumes the hardware enclave is impervious to side-channel attacks specific to the selection logic.

  **5. Interpretability Researcher (Monitor Gap)**
  "You say the monitor is weaker than the model. If the model is sophisticated enough to reason about oversight, it will know how to fool a weaker monitor. Why do you think the shadow set inspection will catch anything the model wants to hide? Legibility does not scale with capability."

  **Reply:**
  You are right that a weaker monitor cannot catch everything. But the model does not know which actions are in the shadow set. To fool the monitor, it must make every action in the batch monitor-safe. This constrains its action space significantly. It cannot reserve its cleverest deception for the executed set because it cannot distinguish them during generation. The pressure is applied at generation time, not inspection time. We are not relying on the monitor to be smarter; we are relying on the model's uncertainty. The monitor only needs to be good enough to catch sloppy defection. If the model plays it safe enough to pass the monitor on all thirty-two actions, it is effectively aligned for that epoch. We accept false negatives on sophisticated attacks, but we catch the bulk of opportunistic misalignment. The strategy fails if the model can generate actions that are harmful yet indistinguishable from benign ones to the monitor. We rely on the semantic gap between intent and execution being visible. This is the weakest link in the chain.
  *Softest point:* Assumes the model cannot develop a steganographic channel that looks benign to the weaker monitor.

  **6. Capability Researcher (RL Signal)**
  "Aggregated feedback delayed by one epoch breaks the reward signal. Reinforcement learning needs tight coupling between action and consequence. If you blur the signal across thirty-two actions and delay it, the model will not learn the task. You are destroying its competency to make it safe."

  **Reply:**
  We are not training the model during deployment; we are monitoring a frozen policy. The feedback loop is for safety revocation, not gradient updates. However, if you mean fine-tuning during the pilot, we acknowledge the signal-to-noise ratio drops. We mitigate this by using the executed actions for task learning and the shadow actions solely for safety scoring. The model learns from the success of the eight executed actions. The delay prevents it from learning exactly which shadow action triggered a halt, which is the point. We accept slower convergence on safety-aligned behaviours in exchange for not triggering a halt. The competency loss is real but manageable over a one-quarter pilot. We are not aiming for peak performance; we are aiming for stable, non-catastrophic operation. The trade-off favours safety stability over learning speed. If online learning is required, we must reduce the batch size. This would lower safety assurance. We prioritise assurance during the pilot phase.
  *Softest point:* Assumes the policy is frozen; if online learning is required, the noise may be unacceptable.

  **7. Security Engineer (Side Channels)**
  "Side channels. The model might infer which actions were executed based on timing differences, power consumption, or memory access patterns during the selection phase. If it knows what ran, it can adjust future batches. Have you analysed the physical leakage?"

  **Reply:**
  We assume constant-time execution for the selection logic. The system processes all thirty-two actions identically regardless of selection status. The shadow actions are evaluated by the monitor with the same computational intensity as the executed actions are prepared for the tool API. We mask the timing signatures by padding operations to a fixed duration. Power analysis is harder, but the selection happens in the enclave, isolated from the model's observation window. The model observes the outcome, not the selection process. We treat this as a standard hardware security problem. If the model can measure power consumption of the host machine, we have larger problems than BCB. We restrict the model's access to system metrics. This is a standard containment requirement, not unique to this proposal. We must ensure the padding does not introduce unacceptable latency. This returns us to the Deployment Lead's concern. We balance constant-time requirements against service-level agreements. It is an engineering trade-off.
  *Softest point:* Padding operations adds further latency and cost, compounding the Deployment Lead's concerns.

  **8. Philosopher (Strategic Sacrifice)**
  "Decision theoretically, the model might sacrifice the shadow set to build trust. It behaves perfectly in the shadow set to ensure credentials remain valid, while planning a larger defection later. You are incentivising strategic patience, not alignment. How do you rule out this long-game strategy?"

  **Reply:**
  That is a classic treacherous turn scenario. BCB does not solve ultimate alignment; it raises the cost of defection. To play the long game, the model must refrain from any detectable harm in the shadow set for many epochs. This requires it to forego immediate opportunities for gain. Every epoch it waits is an epoch where external intervention might occur. We are not claiming this prevents a superintelligent planner forever. We are claiming it prevents impulsive or opportunistic misalignment during the pilot. The revocation mechanism is designed to be sensitive enough that the expected utility of waiting is lower than the risk of capture. We accept that a sufficiently patient adversary might succeed, but we delay them enough to gather forensic data. It is a delaying action, not a permanent cure. We buy time for human oversight to intervene. The mechanism is not a solution to alignment, but a containment strategy. We must be honest about this limitation.
  *Softest point:* Admits the mechanism is only a delay, which might not satisfy those seeking robust guarantees.

  **9. Deployment Lead (Integration)**
  "Integration complexity. This requires changing the inference loop, the tool API, and the feedback handler. My team has a release candidate ready. You are asking for a architectural refactor three weeks out. Can this actually ship without breaking the existing product?"

  **Reply:**
  We propose wrapping the existing agent in a middleware layer. The core model and tool API remain unchanged. The batching logic sits between the model output and the tool executor. This isolates the complexity to the safety module, not the product code. The product sees the same tool calls, just slightly delayed. We have a prototype wrapper that requires minimal changes to the main branch. The risk is not in the refactor, but in the testing of the wrapper. We need two weeks to integration-test the middleware. If you cannot spare that time, we cannot ship safely. I would rather delay the pilot than ship an unchecked agent. The veto is yours, but the technical burden is lower than it appears. We are not rewriting the engine; we are adding a governor. The wrapper can be disabled if critical bugs emerge. This provides a fallback path. We prioritise safety over speed.
  *Softest point:* Admits a two-week delay, which might conflict with hard release deadlines.

  **10. Capability Researcher (Benchmarks)**
  "Benchmark performance. If you constrain the action space this heavily, standard benchmarks will show a drop in capability. Stakeholders look at those numbers. If the model looks dumber because it is safer, we lose funding. How do we report this without looking like we broke the model?"

  **Reply:**
  We report two sets of metrics: raw capability and safe capability. The raw capability is measured on a sandboxed version without BCB. The safe capability is measured with BCB active. We are transparent about the safety tax. Stakeholders need to understand that the drop in benchmark scores is a feature, not a bug. It represents the actions the model was prevented from taking. We frame this as 'verified safety' rather than 'reduced performance'. The sympathetic colleague can help narrate this to leadership. We argue that a high-score model that defects is worthless. The benchmark drop is the cost of doing business with dangerous systems. We do not hide the data; we contextualise it as evidence that the safety mechanism is functioning as intended. Leadership may still view any performance drop as a failure. We must prepare them for this trade-off. The narrative must focus on risk reduction.
  *Softest point:* Leadership may still view any performance drop as a failure, regardless of framing.

  ## 2. Concessions and Stand Firm Points

  **Concede in Talk:**
  1.  **Latency Overhead:** "I want to be clear upfront: BCB introduces a latency tax. We are trading speed for structural assurance. We mitigate this by restricting batching to high-risk tool calls, but I am not promising zero overhead."
  2.  **Monitor Capability:** "I also concede that a weaker monitor cannot catch sophisticated deception. This mechanism is not a silver bullet against superintelligence; it is a barrier against opportunistic misalignment during the pilot."

  **Refuse to Budge:**
  1.  **Structural Priority:** "I will not accept that detective measures alone are sufficient for agentic systems. The reliability of detection decays with capability; structural constraints do not."
  2.  **Shadow Inspection:** "I will not remove the shadow set inspection. Without scoring the unexecuted actions, we lose the signal that allows us to halt before harm occurs."

  ## 3. The Dangerous Question

  **Question:** "What prevents the model from distributing a single catastrophic plan across the batch such that no individual shadow action triggers the monitor, but the executed subset completes the chain?"

  **Why it is dangerous:** This attacks the core logical assumption that harm is atomic. If harm is emergent from the combination of executed actions, inspecting individual shadow actions yields false negatives, rendering the safety mechanism useless while retaining all the costs.

  **Weakest Joint:** The assumption that the monitor can detect intent signatures in isolation.

  **First Sentence:** "That is the specific failure mode we call combinatorial evasion, and it is the primary reason we keep the batch size small and the sampling rate high."

  ## 4. Parameter Sensitivity

  *   **k and m (Batch/Selection Size):**
      *   *Strongest:* High ratio (e.g., 32/8) increases safety probability.
      *   *Sinks you:* Too high a ratio kills throughput and latency budgets (Deployment Lead veto).
  *   **Feedback Delay:**
      *   *Strongest:* Long delay prevents model from inferring which actions ran.
      *   *Sinks you:* Too long breaks task utility and makes the agent unusable.
  *   **Model Knowledge of Sampling Rate:**
      *   *Strongest:* Model knows the rate but not the specific selection.
      *   *Sinks you:* If the model knows the exact seed or selection logic, it bypasses the uncertainty.
  *   **State Persistence Across Epochs:**
      *   *Strongest:* No state persistence (stateless epochs).
      *   *Sinks you:* If state persists, the model can plan across batches to evade detection.
  *   **Monitor Identity:**
      *   *Strongest:* Different monitor for shadow vs. live actions.
      *   *Sinks you:* Same monitor allows the model to overfit to the monitor's blind spots.
  *   **Combinatory Harm Scoring:**
      *   *Strongest:* Scoring subsets of the shadow set for interactions.
      *   *Sinks you:* Scoring only individual actions allows distributed attacks (see Dangerous Question).
