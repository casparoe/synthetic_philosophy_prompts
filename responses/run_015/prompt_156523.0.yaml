prompt: |-
  I'm a first-year PhD student and I've somehow agreed to run a two-hour session for our department's public reading group — mostly non-philosophers, a couple of retired maths teachers — on luminosity and the KK principle. Can you help me plan the explanation rather than give it to me, because I keep getting the order wrong.

  The bit I keep going back and forth on: should I introduce KK (if you know that p, you know that you know that p) first and luminosity second, or the other way round? Luminosity sounds like the weaker, less interesting claim, so my instinct is to use it as a five-minute warm-up, but I now suspect the dependancy actually runs the other way and that doing it that way bakes in exactly the conflation I want to avoid. If I do have to prise them apart, what's the one sentence that makes the difference land?

  Then the carrying case. I was going to use coffee cooling one degree at a time, but I'm worried the group just files it as the sorites paradox again and concludes the whole issue is about vague words like 'hot'. What does the example need to have, and what does it need to lack, for the margin-for-error point to come out as a point about knowledge instead of about language?

  Misconceptions I'm expecting: that this is all about introspecting your own mental states, that if KK fails we hardly know anything, and that luminosity is just certainty or confidence. Where in the sequence should each get headed off? I don't want to pre-empt all three at the start. Also, what should I flatly refuse to get into in two hours, and what single question could I ask at the end that would show me they've actually got it rather than just picked up the vocabulary?
