answer: |-
  Good evening. To stand here and summarize [Name]'s career is to attempt something he spent forty years proving impossible. A retirement toast usually tries to turn a life into a list of qualities. It tries to say, "This is who he was." It tries to fix a person in place, like a butterfly in a display case, so we can admire the pattern and close the lid.

  But [Name] taught us that a person is not a statue to be unveiled, but a movement to be witnessed. To praise him by listing his traits would be to commit the very error he spent his life diagnosing. It would be to treat him as if his choices were finished, as if the story had hardened into a fact. So I will not tell you who he is. I will tell you what we have seen him do.

  To his colleagues: We have watched him meet every argument not as a threat, but as a situation to be seized. He did not let the field shape him. He took the circumstances he found here—the debates, the students, the objections—and made them his own. He refused the comfort of a settled conclusion. Even when the room was against him, he reminded us that the weight of the situation never decides the move; only the player does.

  To his family: You know him best not as a scholar, but as the one who kept the question open at the dinner table. You have lived with the intensity of someone who refuses to sleepwalk through his own life. We know that hearing "you are free to choose" is not always comforting when you just want to know where to go for vacation. But you also know that this insistence was his way of loving us. He refused to let anyone around him become a object, even when it would have been easier.

  He has assured us that retirement will not change this. He knows the temptation. Retirement is the ultimate lure of bad faith. It's the chance to finally say, "I don't have to choose anymore; I'm just retired." It's a socially acceptable excuse to stop trying. But [Name] has promised us that even in retirement, he won't use "I'm too old for this" as an excuse to skip doing the dishes. He says that's a trap we all walk into, and he'd rather wash the plate.

  So we are not here to close a book. We are here to mark a turning of the page. The department will remain, the arguments will remain, but what he makes of this next chapter is not written. He is not leaving us a legacy to preserve. He is leaving us a challenge to take up.

  Let us raise a glass. Not to what he has been, but to what he chooses next. To [Name].
