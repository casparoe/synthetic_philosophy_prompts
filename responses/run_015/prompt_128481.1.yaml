answer: |-
  **Project Title:** The Normative Scoreboard: Revision Debt and the Binding Force of Promises

  **The Pitch**
  Standard theories of promising—Will, Expectation, Practice—all treat the promisee's position as static. They assume the obligation lands on the promisor like a package dropped on a doorstep. Will theories say I wrapped it; expectation theories say you ordered it; practice theories say the delivery service exists. But they miss the dynamic update. My project argues that a promise updates a shared "normative scoreboard." The binding force isn't just about guilt or social sanction; it comes from asymmetric revisability costs. When I promise, you restructure your planning. That restructuring creates a "revision debt" for me. I can't just back out without forcing you to pay the cost of undoing your plans.

  **The Core Question**
  Existing answers leave this genuinely open because they conflate the *reason* to promise with the *reason* to keep one. Scanlon-style accounts focus on the wrong of inducing expectations you intend to disappoint. But is that the same as owing a debt because the other person has already moved their pieces on the board? I need to know: Is this "revision debt" mechanism a distinct philosophical category, or just a redescription of expectation damage with extra steps?

  **Month-by-Month Plan**
  *   **Month 1: Formalize the Scoreboard.** Define the mechanics of the update. How does the normative status change from t=0 to t=1? I'll draft the core argument that the obligation arises from the *cost of reversal*, not the *act of assertion*.
  *   **Month 2: Stress Tests.** I'll run the model against edge cases. Does revision debt exist in coerced promises (where planning wasn't voluntary)? What about third-party reliance (where the promisee didn't change plans, but someone else did)? If the model breaks here, I need to patch it.
  *   **Month 3: The Collapse Check.** Direct comparison against Scanlon and Shiffrin. I'll try to prove that expectation theories can't account for the specific weight of planning restructuring. If I can't distinguish breaking a promise from ordinary letting-down, the project fails.
  *   **Month 4: Drafting.** Assemble the essay. Focus on clarity and punch. The goal is a publishable piece, not just a diary.

  **Success vs. Failure**
  *   **Success:** I demonstrate that "revision debt" picks out a mechanism distinct from disappointing expectations. The essay shows why we feel differently about breaking a promise vs. failing a hope, even if the outcome is the same.
  *   **Failure:** The model collapses into standard view. If "revision debt" turns out to be just "expectation damage" renamed, I'll pivot to writing a critique of why that distinction doesn't matter.

  **Scope Check**
  Can this be done in four months? Yes, because it's purely conceptual. No empirical fieldwork or archival digging is needed. The risk isn't time, it's depth. Four months is enough to build the model and test it, but not enough to write a book. I need to stay narrow. If I get bogged down in the history of promise theory, I'll miss the deadline. Keeping it focused on the *mechanism of binding* keeps it feasible.

  Verdict: The binding force of a promise originates in the asymmetric cost of undoing the promisee's restructured plans, not merely in the disappointment of their expectations.
