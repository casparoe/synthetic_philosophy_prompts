answer: |-
  Look, I take the point about Ravi and Ines, and it is a vivid way to press the worry. But I think you are smuggling in a premise that no Bayesian ought to accept, namely that confirmation is a two-place relation between theory and evidence that must remain invariant across agents with different background knowledge. We have always said confirmation is three-place: $E$ confirms $T$ relative to $K$. In your scenario, Ravi and Ines simply do not have the same $K$. Ines has the dip in her corpus; Ravi does not. That is a genuine epistemic difference, not merely a psychological quirk. The fact that Ravi *ought* to have remembered the dip is a normative claim about his archival diligence, but it does not change the descriptive fact of his current belief state. If you condition on nothing, you get nothing; if you condition on $E$, you get a shift. The framework is doing exactly what it should: tracking how rational belief changes given what the agent actually holds. To say this is 'laundering' is to say that accounting for an agent's actual ignorance is a bug, but I'd argue it's a feature that we don't pretend Ravi knows what he has forgotten.

  Now, regarding your pre-emption of the conditional move. You say Ines learns the entailment just as clearly as Ravi, so why the difference? Well, if both learn the proposition $\langle T \vdash E \rangle$, then both *do* update on that. Ines gets her confirmation boost from recognising the logical connection, not from re-learning the dip. Ravi gets a boost from the dip *and* the connection. The magnitudes differ because their starting points differ. You seem to want a notion of confirmation that is purely historical or objective, independent of the agent's cognitive state. But Bayesianism is a theory of rational belief, not a theory of abstract support relations floating in a Platonic heaven. If Ines is rational, she updates on the entailment. If Ravi is rational (given his forgetfulness), he updates on the evidence. The fact that Ravi's forgetfulness makes the evidence 'new' for him doesn't make the confirmation 'real' in an objective sense, but it does make the belief update rational for him. We shouldn't favour a notion of confirmation that ignores the agent's actual behaviour in preference to one that pretends all agents are logically omniscient archivists. Our modelling captures that distinction perfectly well without needing to pretend old evidence is new.
