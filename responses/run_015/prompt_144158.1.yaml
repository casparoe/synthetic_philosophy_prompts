answer: |-
  Your friend is deploying a classic version of the **Genetic Fallacy defense**: the idea that the origin of an idea (the person, their biography) is irrelevant to its validity (the logic, the truth). The "Bridge Engineer" analogy is the intuitive engine for this defense. It is powerful, but it relies on a specific conception of what philosophy *is*.

  If philosophy is merely a toolkit of formal instruments, the analogy holds. If philosophy is an inquiry into the norms of human reason, the analogy collapses.

  Here is the correspondence table, followed by the structural failure points, specifically regarding anti-psychologism and the "untouched" canon.

  ### The Correspondence Table

  | The Analogy Component | The Frege Case | Function in the Argument |
  | :--- | :--- | :--- |
  | **The Engineer** | Gottlob Frege (the biographical agent) | The creator of the system. |
  | **The Bridge** | Frege's Logical System (*Begriffsschrift*, *Grundgesetze*) | The structural output meant to bear weight (truth/inference). |
  | **The Drinking** | The Political Diary (Anti-Semitism, reactionary monarchism) | The private vice/moral failing of the agent. |
  | **Structural Integrity** | Logical Validity / Consistency | The internal coherence of the system (ignoring Russell's Paradox for this specific comparison). |
  | **The Inspection Report** | Philosophical Analysis / Usage | How we test, apply, and teach the system today. |
  | **The Conclusion** | "Leave the Canon Untouched" | The bridge stands; therefore, ignore the engineer's drinking. |

  ---

  ### Where the Analogy Holds (The Structural Defense)

  Your friend is correct on one specific front: **Formal Validity.**

  If you write down a proof in Fregean notation, its validity does not depend on Frege's blood type or political preferences. $P \to Q$ is true regardless of whether Frege hated Jews. This is bolstered by Frege's own **Anti-Psychologism**. Frege argued that *Gedanken* (Thoughts) are not mental images inside a skull; they are objective, abstract entities existing in a "third realm."

  *   **The Bridge Logic:** A bridge obeys physics regardless of the engineer's mood.
  *   **The Frege Logic:** Logical laws obey objective truth regardless of the philosopher's psyche.

  In this narrow sense, the "private vice, structural integrity" distinction works. The *calculus* survives the *calculus-maker*.

  ### Where the Analogy Breaks (The Disanalogies)

  The analogy begins to fail when we move from *formal validity* to *philosophical interpretation*. Here is where the "Bridge" metaphor smuggles in the assumption that philosophy is engineering.

  #### 1. Vice vs. Worldview (Drinking vs. Ideology)
  *   **The Analogy:** Drinking is a physiological compulsion or habit. It generally does not alter the mathematical calculations of load-bearing stress.
  *   **The Reality:** Frege's diary did not record a vice (like alcoholism); it recorded an **ideology**. Anti-Semitism and reactionary politics are cognitive frameworks about human nature, hierarchy, and rationality.
  *   **The Break:** If an engineer calculates load-bearing stress based on the belief that "gravity affects Jews differently," the bridge is compromised. If Frege's logic relies on presuppositions about *who* is a rational agent, and his diary reveals he believed rational capacity was tied to national/racial identity, the "structural integrity" of his *philosophical project* (not just his symbols) is compromised.

  #### 2. The Inspection Report (Physics vs. Normativity)
  *   **The Analogy:** An inspection report measures physical safety.
  *   **The Reality:** A philosophical "inspection report" measures **normative scope**. Frege claimed his logic described the "laws of truth." These are presumed to be universal.
  *   **The Break:** If the diary shows Frege believed that access to these laws was restricted to a specific *Volk* (people/nation), then the *universality* of the logic is contradicted by its author's epistemology. The bridge might stand, but the engineer built it with a sign saying "Only Germans Allowed to Cross." You cannot leave the canon "untouched" because the *meaning* of the bridge has changed. It is no longer a universal public utility; it is a monument to exclusion.

  #### 3. Anti-Psychologism as a Double-Edged Sword
  *   **The Analogy:** The engineer's brain is irrelevant to the steel.
  *   **The Reality:** Frege's anti-psychologism was meant to protect logic from human error. However, it also separates the *Thought* from the *thinker*.
  *   **The Break:** If Frege's diary suggests that *grasping* a Thought requires a specific racial/national purity, then his anti-psychologism fails to insulate his **epistemology**.
      *   *Ontology:* Thoughts exist objectively (Safe).
      *   *Epistemology:* Who can access them? (Unsafe).
      *   If the diary implies that "impure" minds cannot grasp objective truth, then Frege's system is not just a neutral tool; it is weaponized. The "Bridge" isn't just a bridge; it's a checkpoint. Ignoring the diary ignores the checkpoint.

  #### 4. The "Untouched" Canon
  *   **The Analogy:** We use the bridge without reading the engineer's diary.
  *   **The Reality:** Philosophy is not just used; it is **interpreted**.
  *   **The Break:** To teach Frege "untouched" is to teach a sanitized history. It implies that the development of analytic philosophy had no ideological undercurrents. If we discover that the "linguistic turn" was partially motivated by a desire to purify language (and by extension, society) of "impure" elements, leaving Frege "untouched" is an act of historical falsification. The *context of discovery* bleeds into the *context of justification* when the justification relies on concepts like "clarity," "purity," and "order," which were politically charged for Frege.

  ### Did the Analogy Smuggle the Answer?

  **Yes.**

  The "Bridge Engineer" analogy assumes that **Philosophy = Technology.**
  *   If philosophy is a technology (a tool for calculation), then the user's morality is irrelevant.
  *   If philosophy is a **humanism** (an inquiry into the nature of reason and truth), then the philosopher's conception of "the human" is central to the work.

  By using the bridge analogy, your friend has already decided that Frege's work is merely a formal technology. But Frege didn't think he was building a calculator; he thought he was uncovering the fundamental structure of reality and reason.

  If Frege's political diary reveals that he tied the "fundamental structure of reason" to German nationalism, you cannot separate the work from the man without amputating the *purpose* of the work.

  ### The Verdict

  **Does the "separate the work from the man" conclusion survive?**

  *   **Formally:** Yes. You can still use Fregean quantification. The symbols work.
  *   **Philosophically:** No. You cannot leave him in the canon **"totally untouched."**

  To leave him untouched is to ignore that his conception of "objectivity" may have been covertly reliant on a specific, exclusionary subjectivity. The analogy breaks because a bridge is meant to be indifferent to the people crossing it, but Frege's logic was meant to define the very capacity of people to think.

  **The Correction:**
  We do not burn the bridge. But we must install a plaque. We teach Frege's logic *alongside* the revelation of his politics, not to invalidate the modus ponens, but to interrogate the **normative claims** of analytic philosophy. We must ask: *Did the desire for logical purity mirror a desire for political purity?*

  If you ignore that question, you aren't protecting the structural integrity of the bridge; you're hiding the fact that the engineer designed the toll booth to exclude specific travelers. That isn't engineering; it's ideology. And ideology cannot be separated from the philosopher who wrote it.
