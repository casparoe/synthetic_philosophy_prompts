      *   *Point 2: Anti-Psychologism.* Frege argued thoughts (*Gedanken*) are objective, not mental states. This *supports* the friend's view initially (logic isn't in Frege's head). *However*, if Frege's *access* to these thoughts was conditioned by his political views on who counts as rational, the insulation cracks.
      *   *Point 3: The "Drinking" isn't just Vice.* Drinking is usually personal health. Anti-Semitism is an ideological stance about *human nature* and *hierarchy*. If logic is about universal truth, and his politics denied universal rationality to certain groups, there's a tension.
