prompt: |-
  my friend keeps saying that using Frege's political diary against his philosophy is like finding out a bridge engineer drinks too much and then saying the bridge will fall — private vice, structural integrity, dont mix the two. he uses it to defend leaving Frege in the canon totally untouched. how far does that actually hold? give me the correspondence table — the engineer, the bridge, the drinking, the inspection report — then the places it breaks. especialy since Frege's anti-psychologism treats thoughts (Gedanken) as objective and independent of anyone's psychology, which sounds like it should insulate his logic, but also gets weird if the diary shows he linked rational access to racial categories. tell me whether the "separate the work from the man" conclusion survives once the disanalogies are on the table, or if the analogy was smuggling in the answer the whole time.
reasoning: |-
