answer: |-
  Your intuition is spot-on. Your roommate has captured the *spirit* of Gould and Lewontin's famous 1979 paper, "The Spandrels of San Marco and the Panglossian Paradigm," but they have botched the *mechanics* of the argument and drawn conclusions that Gould and Lewontin (G&L) explicitly rejected.

  Here is a breakdown of what is accurate, what is a misrepresentation (specifically regarding co-option), and why the dismissal of evolutionary psychology doesn't logically follow.

  ### 1. What the Roommate Got Right
  Your roommate accurately summarized the **methodological critique**.

  *   **Critique of Pan-Selectionism:** G&L did argue that evolutionary biologists often suffer from an "adaptationist programme," where they assume every trait exists *because* it was selected for a specific function.
  *   **The "Just-So Story" Problem:** They argued that without rigorous testing (looking at developmental constraints, phylogenetic history, or structural byproducts), adaptationist explanations are merely plausible narratives ("just-so stories") rather than scientific hypotheses.
  *   **Spandrels as Byproducts:** They did use the architectural analogy (the triangular spaces between arches) to illustrate how a trait can arise as a necessary structural consequence of another change (the arches) rather than direct selection for the triangle itself.

  ### 2. The Major Misrepresentation: Co-option and Exaptation
  Your roommate's claim that **"spandrels can never get co-opted for a new adaptive use" is factually incorrect** regarding Gould and Lewontin's theory. This is the most critical error in their summary.

  *   **The Architectural Analogy:** In the actual paper, G&L point out that while the spandrels in the Basilica of San Marco were structural byproducts, they were subsequently **co-opted** by artists to hold intricate mosaics. The space wasn't designed for the mosaics, but once it existed, it was utilized for that purpose.
  *   **Biological Exaptation:** Gould (later with Elisabeth Vrba) formalized this concept as **exaptation**. A trait can originate as a spandrel (non-adaptive byproduct) and later be co-opted by natural selection for a new function.
  *   **Why this matters:** By claiming spandrels stay useless forever, your roommate turns a dynamic evolutionary concept into a static one. G&L argued that nature is full of traits that started as spandrels and *became* adaptations later.

  ### 3. The Logical Leap: "Some" vs. "Probably"
  You correctly sensed a problem with jumping from "some traits are spandrels" to "functional-looking traits are probably spandrels."

  *   **G&L's Actual Stance:** They did not argue that *most* traits are spandrels. They argued that biologists *ignore* the possibility of spandrels. Their goal was to restore balance to the methodology, not to replace "everything is an adaptation" with "everything is a spandrel."
  *   **The Fallacy:** Your roommate is committing a **hasty generalization**. Just because the adaptationist lens is flawed doesn't mean the inverse is automatically true. A trait looking functional doesn't make it *probably* a spandrel; it just means you can't *assume* it's an adaptation without proof.

  ### 4. Does the Dismissal of Evolutionary Psychology Follow?
  **No.** The roommate's conclusion that evolutionary psychologists are "automatically wrong" does not follow from the spandrels critique, even if we grant the spandrels point.

  *   **Burden of Proof, Not Prejudgment:** G&L's argument was about the **burden of proof**. They would say to an evolutionary psychologist: "You cannot simply assert language is an adaptation because it looks useful. You must rule out the possibility that it is a byproduct of brain size, neural complexity, or other factors."
  *   **Gould's Personal View vs. The Theory:** Interestingly, Gould *personally* leaned toward the idea that language might be a spandrel (or exaptation) of increased brain size and syntactic complexity (aligning with Noam Chomsky). However, he held this view based on specific arguments about brain modularity and fossil records, **not** because "spandrels can't be co-opted."
  *   **The Contradiction:** If language *were* a spandrel of bigger brains, but humans now use it for communication and survival, G&L would classify that as **co-option**. So, even if language started as a spandrel, it could still be an adaptation *now*. The roommate's claim that "if it's a spandrel, it can't be adaptive" contradicts the very mechanism (exaptation) that makes the spandrel concept useful.

  ### Summary Verdict

  | Claim | Accuracy | Correction |
  | :--- | :--- | :--- |
  | **"Many traits are byproducts, not adaptations."** | **Accurate** | This is the core thesis of the 1979 paper. |
  | **"Adaptationist explanations are often just-so stories."** | **Accurate** | G&L criticized the lack of testing in adaptationism. |
  | **"Spandrels can never get co-opted for new use."** | **False** | **Major Error.** G&L explicitly argued spandrels are often co-opted (exaptation). |
  | **"Therefore, Evo Psych claims are automatically wrong."** | **Invalid** | G&L demanded evidence, not automatic dismissal. A trait can be a spandrel in origin and adaptive in current use. |

  **Conclusion:** Your roommate has correctly identified the *skepticism* Gould and Lewontin brought to the table, but they have turned that skepticism into a dogma that Gould explicitly argued against. The spandrels paper is a call for **methodological pluralism** (test all hypotheses: adaptation, drift, constraint, byproduct), not a declaration that adaptation is a myth. Your intuition that spandrels can become useful and that we can't assume functional traits are spandrels without evidence is the more accurate reading of the theory.
