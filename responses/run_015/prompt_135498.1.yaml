  3.  **Brainstorm Objections to Transworld Identity (TWI):**
      *   *The Problem of Accidental Intrinsics:* How can Elara be 5'6" in World A and 5'8" in World B if she is strictly *identical*? An object cannot have contradictory properties.
      *   *The Problem of Indiscernibility:* If Elara-A and Elara-B are identical, they share all properties. But they have different histories.
      *   *Essentialism:* If Elara is the same, what makes her Elara? Her origin? Her DNA? If she changes too much, is she still Elara? (Sorites paradox).
