answer: |-
  You are indeed mixing up prioritarianism and egalitarianism, and this confusion is leading you to attribute the wrong weaknesses to each theory. The leveling-down objection is the classic critique of **egalitarianism**, not prioritarianism. Strict egalitarianism holds that equality is intrinsically valuable, meaning a world where everyone is equally miserable is, in one respect, better than a world where some are happy and others are miserable. This implies that we should "level down" the healthy to match the sick even if it helps no one, which is the absurdity the objection highlights.

  **Prioritarianism**, coined by Derek Parfit, was specifically designed to escape this objection. It agrees that we should prioritize the worse-off, but only because benefits to them matter more morally, not because equality is good in itself. Prioritarianism cares about absolute welfare gains; therefore, it never recommends making the healthy worse off unless doing so produces a sufficiently large weighted benefit for the sick. It does not value equality for its own sake, so it is immune to the leveling-down objection.

  Regarding your triage feature: A protocol that assigns extra value to QALYs gained by patients with pre-existing disabilities is fundamentally **prioritarian**. It presupposes that a unit of health benefit has greater moral weight when conferred upon someone with a lower baseline absolute welfare. While some proponents might use egalitarian language (like "closing the gap"), the mathematical mechanism of weighting benefits based on absolute status is the definition of prioritarianism. It is not a hybrid that succumbs to leveling-down; rather, it is a distinct framework that captures the intuition of helping the needy without accepting the absurdity of destroying value just to achieve equality.

  Verdict: You have conflated egalitarianism with prioritarianism, as the leveling-down objection critiques the former while weighted-QALY triage protocols are fundamentally prioritarian.
