  DEPARTMENT OF NOMINAL CLASSIFICATION
  IMPORT COMPLIANCE MANUAL 89-B
  SUBJECT: SEVERABILITY OF SUBSTANTIVE DESIGNATORS AND QUALITATIVE MODIFIERS

  1.0 GENERAL PRINCIPLES OF NOMINAL ENTRY
  All imported goods must be classified according to their fixed names. It is the policy of the Department that a name defines the boundary of the object. A descriptive attribute does not modify the primary category; it creates a new, seperate [sic] category. Therefore, the designation "horse" refers strictly to the structural form of the animal. The designation "white" refers strictly to the chromatic quality. The conjunction "white horse" refers to a composite entity that is neither solely "horse" nor solely "white." Importers seeking to bring a white horse into the jurisdiction must file for both the structural form and the specific color. Failure to declare the color constitutes a failure to declare the object.

  2.0 EQUINE PROTOCOLS AND FORM REQUIREMENTS
  Under Section 44-C, an agent seeking to import a horse may not accept a white horse as fulfillment of the order. The request was for "horse." The delivery is "white horse." These are not interchangeable units. To clear a white horse through Customs, the importer must submit:
      (a) Form H-9 (Substantive Equine Shape);
      (b) Form W-4 (Chromatic Designation: White);
      (c) Form C-1 (Conjunction Liability).

  If the importer only possesses a permit for "horse," they are legally entitled to claim any non-white horse. If they claim the white horse, they are in violation of the Nominal Integrity Act. The logic is absolute: if "white horse" were identical to "horse," then the request for "horse" would be satisfied by a yellow horse. Since a yellow horse does not satisfy a request for a "white horse," the categories are distinct. Taxation applies to each distinct category.

  3.0 COMPOSITE COLORATION
  Animals displaying multiple colors require multiple chromatic permits. A dappled animal is not merely a horse; it is a horse plus white plus black (or grey). Each distinct patch of color constitutes a separate importable quality. A spotted equine unit requires three permits: one for the shape, and one for each dominant hue present on the hide. Importers attempting to classify a dappled horse under a single "grey" designation will be rejected. "Grey" is a specific color, not a mixture. A mixture is a new name. A new name requires a new form.

  | **SIDEBAR: COMMON COMPLIANCE ERRORS** |
  | :--- |
  | **Error:** Assuming adjectives are free of charge. <br> **Correction:** Adjectives create new taxable entities. <br><br> **Error:** Claiming a dead horse is still a "horse." <br> **Correction:** "Dead" is a state change. A dead horse is a "carcass." Form H-9 is void. File Form K-2. <br><br> **Error:** Arguing that you can see the horse is white without a permit. <br> **Correction:** Visual confirmation is irrelevant. Classification is linguistic. If the name is not on the manifest, the object does not exist for tax purposes. |

  4.0 TRANSIT VARIABLE ATTRIBUTES
  Importers often inquire about objects that change qualities during transit. See FAQ 4.1.

  **FAQ 4.1: What if my horse changes color during transit?**
  If a white horse becomes dirty, grey, or mud-colored during the voyage, the original Form W-4 (White) is invalidated. The object arriving at the port is no longer the object that departed. The importer must file an Amendment of Nominal State upon docking. If the horse has become "mud-colored," you must purchase a permit for "mud." If the horse has been dyed, you must purchase a permit for the new dye color. You cannot import a "white horse" and receive a "grey horse." They are different names. Therefore, they are different goods. If you cannot afford the new color permit, the horse must be reclassified as "horse" only (shape only), and the color must be stripped or painted over at the border until it matches the manifest.

  5.0 APPEALS
  Appeals regarding misclassified greys must be submitted within 30 days. Note that arguing "it is still basically a horse" is not a valid legal defense.¹

  ***
  ¹ *Department of Nominal Classification v. Stablehands Inc.*, 442 F.3d 19 (Fed. Cir. 2018). The Court upheld that equine-substance is legally separable from equine-appearance. The ruling established that seeking a horse does not imply seeking a white horse, as the desire for color is an additional desire not contained in the desire for shape.

