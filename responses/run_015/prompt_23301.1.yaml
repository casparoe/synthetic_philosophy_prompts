      *Re-evaluating the "Bluff" argument:* If I recommend signing immediately, I need to be very strong on why the bluff risk is acceptable.
      *Key argument:* The cost of being wrong about the bluff (paying extra) is finite. The cost of being wrong about the threat (losing logistics) is existential.
