answer: |-
  Here is a plan for your 90-minute session. It is designed to move the group from intuitive trade-offs to the specific structural constraints of your view, ensuring the "per episode" clause is the discovery rather than the premise.

  ### 1. The Sequence of Ideas
  You cannot start with the definition. If you start with "lexical threshold", they will hear "very heavy weight". You must build the architecture before you name the rooms.

  **Phase 1: The Trade-Off Intuition (0–20 mins)**
  *   **Goal:** Establish the Classical Utilitarian (CU) baseline so it can be broken later.
  *   **Action:** Put a simple equation on the whiteboard: $Pain + Pleasure = Net Value$. Ask the group if there is any amount of mild pleasure (ice creams, sunsets) that could justify one person breaking their leg.
  *   **Why:** Most will say "no". This reveals that their intuition is already non-aggregative in extreme cases. You are not teaching them a new moral fact; you are teaching them a structure for a fact they already hold.
  *   **Dependency:** You need them to commit to the idea that some pains *cannot* be traded off before you can explain why.

  **Phase 2: The Threshold and the Category Error (20–40 mins)**
  *   **Goal:** Distinguish *Weight* from *Order*.
  *   **Action:** Draw a vertical scale. Mark a line near the top. Label below it "Trade-Off Zone" and above it "Veto Zone".
  *   **Crucial Move:** Ask: "Is the pain above the line just *heavier*, or is it a *different kind* of currency?"
  *   **Why:** If it is just heavier, enough pleasure could theoretically outweigh it (CU). If it is a different currency, no amount of the lower currency buys the higher one. This is the difference between weighting and lexical ordering.
  *   **Dependency:** You need the "Veto Zone" established before you can discuss what happens to the items below it.

  **Phase 3: The Per-Episode Constraint (40–65 mins)**
  *   **Goal:** Introduce the specific clause you care about (no summing of sub-threshold pains).
  *   **Action:** Populate the "Trade-Off Zone" with many moderate pains. Ask: "If I stack enough moderate pains, do they become a veto pain?"
  *   **Why:** This is the fork. Standard utilitarianism says yes (aggregation). Your view says no (categorisation).
  *   **Dependency:** This only makes sense if they accept Phase 2 (that the Veto Zone is a different category, not just a higher number).

  **Phase 4: Synthesis and Stress Test (65–90 mins)**
  *   **Goal:** Apply the view to the check case and handle objections.
  *   **Action:** Run the check case (detailed below).
  *   **Why:** Consolidates the learning.

  ---

  ### 2. The Core Example: "The Anaesthesia Trial"
  Avoid the "Torture vs. Dust Specks" case. It is too abstract, too associated with Parfit, and invites hyperbolic rhetoric about tyranny. Your group needs something clinical for the GP and allocative for the EAs.

  **The Case Structure:**
  *   **Scenario:** A pharmaceutical trial for a new general anaesthetic.
  *   **Option A:** One patient experiences 'Awareness' (10 minutes of excruciating, panic-inducing pain during surgery). This is clearly above the threshold.
  *   **Option B:** 10,000 patients experience 'Post-Op Nausea' (severe discomfort, vomiting, misery for 2 hours). This is clearly below the threshold.
  *   **Option C:** 10,000 patients experience 'Mild Itch' (below threshold) but receive a 'Comfort Package' (warm blankets, nice music, premium TV) that creates significant aggregate pleasure.

  **What it must have:**
  *   **Different People:** Do not use the same person suffering both outcomes. If it is the same person, people drift into "self-sacrifice" or "consent" arguments. Keep it distinct patients to isolate the utility calculus.
  *   **Finite Numbers:** Use 10,000, not "infinity". Infinity breaks maths and distracts philosophers.
  *   **Clinical Texture:** Use medical terms (nausea, awareness, itch). This gives the GP permission to speak authoritatively on the intensity levels.

  **What it must lack:**
  *   **Death or Permanent Damage:** Keep it to sensation. If death is involved, rights and sanctity of life derail the utility calculation.
  *   **Consent:** Assume consent is handled or irrelevant. We are judging the *outcome*, not the procedure's ethics.
  *   **Risk:** Present it as a certainty. "If we choose A, this *will* happen." Risk introduces expected utility calculations which complicate the lexical point.

  **Why this works:**
  It forces the "Per Episode" question. Can 10,000 episodes of nausea sum to equal one episode of awareness? The GP will likely say they are clinically distinct categories. The EAs will want to sum them. The view sits in the middle.

  ---

  ### 3. Misconceptions Management
  Here is when to catch the errors before they solidify.

  **1. "This is just Negative Utilitarianism (NU) with the dial turned up."**
  *   **When:** Phase 2 (Threshold).
  *   **Action:** Let this arise. When someone says "So you just care about pain?", correct them immediately using Option C above.
  *   **Correction:** "No. Below the threshold, pleasure counts. If the 10,000 patients get nausea vs. itch, I care about the pleasure of the blankets. Plain NU does not."

  **2. "Lexical means the pain is infinitely heavy."**
  *   **When:** Phase 2 (Weight vs. Order).
  *   **Action:** Pre-empt this. Do not wait for them to say it.
  *   **Correction:** "Infinity is a number. This is not a number game. It is a rule about which numbers are allowed to touch each other. Pleasure numbers cannot touch Veto Pain numbers."

  **3. "The threshold is vague, so the view collapses." (The GP's likely objection)**
  *   **When:** Phase 3 (Per-Episode).
  *   **Action:** Let the GP raise this. It is a strong objection.
  *   **Correction:** Acknowledge it, but park it. "Clinical lines are always fuzzy (e.g., hypertension thresholds), but we still treat them as real for decision-making. We are testing the *structure* of the view, not the precision of the line."

  **4. "This implies we should blow up the world to prevent minor pain." (The World Destruction Objection)**
  *   **When:** Start of session (Introduction).
  *   **Action:** Pre-empt this explicitly.
  *   **Correction:** "This view applies to episodes above a high threshold. Mild pains do not trigger the veto. We are not discussing ending existence; we are discussing triage."

  **5. "You can't measure pain across people."**
  *   **When:** End of session.
  *   **Action:** Park this.
  *   **Correction:** "That is a problem for all utilitarianism, not just this version. Let's assume comparability is possible for the sake of the argument."

  **6. "This is the Asymmetry view (creating happy vs. miserable people)."**
  *   **When:** End of session.
  *   **Action:** Park this.
  *   **Correction:** "That is about who exists. This is about how we treat those who already exist. Different problem."

  ---

  ### 4. The End Check: "The Summing Test"
  You need a question where Classical Utilitarianism (CU), Plain Negative Utilitarianism (NU), and your Lexical Threshold Negative Utilitarianism (LTNU) all give different answers, or at least where LTNU differs from the aggregative intuition of the other two.

  **The Question:**
  > "We have a budget to fund one of two public health programmes.
  >
  > **Programme Red:** Prevents 1 person from suffering 'Agony' (Above Threshold). It provides no pleasure.
  > **Programme Blue:** Prevents 10,000 people from suffering 'Moderate Pain' (Just Below Threshold). It provides no pleasure.
  >
  > Which do you fund?"

  **The Answers:**
  *   **Classical Utilitarian:** Might choose **Blue**. If 10,000 × Moderate > 1 × Agony, the aggregate pain reduction is greater. (They sum everything).
  *   **Plain Negative Utilitarian:** Might choose **Blue**. Standard NU aggregates all pain units. If the total volume of pain is higher in Blue, they prevent Blue.
  *   **Your View (LTNU):** Must choose **Red**. The 10,000 moderate pains are below the threshold. They trade off against each other, but they *do not sum* to cross the lexical line. The single Agony episode lexically dominates any number of sub-threshold episodes.

  **What a Wrong Answer Tells You:**
  *   If they choose **Blue**, they have failed to grasp the "Per Episode" constraint. They are still thinking aggregatively (like CU or standard NU).
  *   If they ask "Does Blue provide pleasure?", they have grasped the view (because below threshold, pleasure matters), but you must remind them the case stipulates *no pleasure*.
  *   If they choose **Red** but say "Because pain matters more than pleasure", they have missed the nuance between NU and LTNU, but they have grasped the lexical veto.

  *(Self-Correction for the session)*: To strictly separate LTNU from Plain NU, you might need a follow-up variant. If they choose Red, ask: "What if Programme Blue prevented 10,000 Moderate Pains *and* gave 10,000 people Mild Pleasure?"
  *   **Plain NU:** Still Red (Pleasure = 0).
  *   **LTNU:** Might switch to Blue (Because below threshold, pleasure counts in the trade-off).
  *   *Keep this in your pocket.* If the first question doesn't separate them, use this variant.

  ---

  ### 5. What to Refuse to Cover
  Ninety minutes is short. You must explicitly exclude the following to prevent scope creep. Say this out loud in the first five minutes.

  **1. The Formal Machinery of Lexicographic Orderings**
  *   **Refusal:** "We will not be writing out ordered pairs or using mathematical notation for lexicography."
  *   **Why:** It creates a barrier for the non-mathematicians and adds nothing to the moral intuition. The whiteboard scale is sufficient.

  **2. The Neuroscience of Pain Scaling**
  *   **Refusal:** "We will not be debating the biological reality of pain receptors or the McGill Pain Scale."
  *   **Why:** The GP will want to do this. Acknowledge their expertise, but state: "We are treating pain intensity as a philosophical variable, not a clinical measurement. Assume the categories 'Agony' and 'Moderate' are distinct."

  **3. Population Ethics and Non-Identity**
  *   **Refusal:** "We are not discussing whether it is wrong to create people who will suffer."
  *   **Why:** This introduces the asymmetry problem which confuses the threshold argument. Stick to existing people.

  **4. Risk and Probability**
  *   **Refusal:** "We are assuming outcomes are certain."
  *   **Why:** Expected utility calculations (multiplying probability by utility) complicate lexical views immensely. Keep it deterministic.

  **Why leaving this out won't distort the picture:**
  These are implementation details. The core philosophical innovation you are teaching is the *structure of the value theory* (lexical vs. aggregative, per-episode vs. total). Adding measurement theory or risk would obscure the structural point. You are teaching them the shape of the container, not what liquid goes inside.

  ### Timing Summary
  *   **00–05:** Intro & Exclusions (Set the boundaries).
  *   **05–20:** Phase 1 (Trade-Off Intuition).
  *   **20–40:** Phase 2 (Threshold & Lexical vs. Weight).
  *   **40–65:** Phase 3 (Per-Episode Constraint & The Anaesthesia Trial).
  *   **65–80:** Phase 4 (The Summing Test Check).
  *   **80–90:** Misconceptions Parked & Close.

  Good luck. If the EAs try to hijack the aggregation argument, invite them to defend the "Blue" option in the Check Case explicitly; it usually forces them to confront the counter-intuitive result of pure aggregation. If the GP gets stuck on the threshold definition, remind them that in medicine, triage categories often function lexically (immediate life threat vs. delayed) regardless of precise metrics.
