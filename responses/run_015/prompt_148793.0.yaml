answer: |-
  Based on the pattern of rulings your fellow student has established, she is operating with a sophisticated, hybridized version of hinge epistemology that blends Wittgensteinian contextualism with specific constraints on the *form* and *scope* of hinge propositions. She is not merely a radical contextualist (who might say anything can be a hinge in the right game) nor a strict universalist (who would say "I have hands" is always a hinge).

  Here is an analysis of the competing rules generating her pattern, the predictions for the neuroscientist cases, a reconstruction of her implicit principle, and a discriminating hypothetical case.

  ### 1. Competing Rules Generating the Pattern

  Three distinct principles can be extracted from her previous rulings. While they often overlap, they diverge in edge cases.

  **Rule A: Practical Indispensability (The Functionalist Rule)**
  *   **Principle:** A proposition is a hinge if and only if doubt regarding it would paralyze the specific activity being undertaken. Hinge status is determined by the *consequences of doubt* within a specific language game.
  *   **Evidence:** "I have two hands" is a hinge in the clinic (doubt stops treatment) but not in the seminar (doubt is the point of the activity). "7 + 5 = 12" is a hinge in arithmetic but not in meta-mathematical consistency checks.
  *   **Focus:** The *role* the proposition plays in the activity.

  **Rule B: The Tacit/Non-Theoretical Constraint (The Form Rule)**
  *   **Principle:** A proposition ceases to be a hinge if it is articulated as an explicit theoretical thesis or metaphysical doctrine. Hinges must be *enacted* or *lived* rather than *stated* as objects of knowledge.
  *   **Evidence:** She denies hinge status to "There is an external material world." This is the classic Moorean/Wittgensteinian distinction: once you say it philosophically, it becomes a shaky theory rather than a solid certainty. She accepts "There is a tree" (perceptual/practical) but rejects "External World" (metaphysical).
  *   **Focus:** The *grammatical or rhetorical form* of the proposition.

  **Rule C: Framework-Structuring vs. Informational Particularity (The Scope Rule)**
  *   **Principle:** Hinges must constitute the *scaffolding* of the inquiry, not merely be stable *data points* within it. They must be general enough to support the system, not just specific facts that happen to be true.
  *   **Evidence:** She rejects "I was born in 1990." While practically certain and non-theoretical, it is a biographical datum, not a framework condition. "Napoleon at Waterloo" is accepted in history because it anchors the *timeline* of the discipline, not just a personal memory.
  *   **Focus:** The *systemic scope* of the proposition.

  ### 2. Predictions for the New Cases

  **Case 1: The Calibration Certainty ("The electrode array is registering voltage fluctuations")**
  *   **Prediction:** She will classify this as a **Hinge**.
  *   **Reasoning:**
      *   *Rule A (Indispensability):* Without this assumption, the encoding model cannot be built. Doubt here paralyzes the calibration practice.
      *   *Rule B (Form):* This is a technical, empirical claim treated as a certainty, not a metaphysical thesis. It resembles "There is a tree outside" (perceptual/technical bedrock) rather than "There is an external world."
      *   *Rule C (Scope):* It functions as a framework condition for the data collection. It is not merely a data point *within* the model; it is the condition for the *possibility* of the data.
      *   *Alignment:* This maps perfectly onto her treatment of "I have two hands" in the clinic.

  **Case 2: The Anti-Reductionist Claim ("Human consciousness is not reducible to patterns of voltage")**
  *   **Prediction:** She will classify this as **Theoretical Overreach** (not a hinge).
  *   **Reasoning:**
      *   *Rule A (Indispensability):* This claim is used for the *grant proposal* (ethical justification/funding), not the *biological science* itself. The neuroscience could proceed (and often does) under reductionist or agnostic assumptions. It is not indispensable to the *inquiry* of calibration or modeling.
      *   *Rule B (Form):* This is an explicit metaphysical/philosophical formulation. It mirrors the rejected "There is an external material world." It is a thesis *about* the science, not a certainty *within* it.
      *   *Rule C (Scope):* It is not framework-structuring for biological science; it is an external ethical constraint imposed upon it.
      *   *Alignment:* This maps onto her rejection of explicit metaphysical formulations.

  ### 3. Best-Guess Reconstruction of Her Implicit Principle

  Her view is best reconstructed as **"Contextualized Tacit Frameworks."**

  She holds that a proposition $P$ functions as a hinge in context $C$ if and only if:
  1.  **Functional Necessity:** $P$ is a precondition for the moves available in $C$ (doubt stops the game).
  2.  **Tacit Enactment:** $P$ is not posited as a theoretical conclusion or metaphysical doctrine within $C$ (it is shown, not said).
  3.  **Systemic Generality:** $P$ structures the space of inquiry in $C$ rather than merely occupying a point within it.

  **Why this reconstruction fits:**
  It explains the "Two Hands" vs. "External World" distinction most robustly. Both are about reality, but "Two Hands" is a localized, practical certainty (Tacit/Functional), whereas "External World" is a global, theoretical assertion (Explicit/Metaphysical). It also explains the "Born in 1990" exclusion: while tacit and necessary for *autobiography*, it lacks the *Systemic Generality* required for a broader epistemic framework (like history or science), or perhaps she views it as too contingent to be a "hinge" in the Wittgensteinian sense of a "riverbed" thought.

  She is effectively arguing that hinges are **normative rules disguised as empirical propositions**, but only so long as they remain disguised. Once you peel back the disguise (via skepticism or metaphysics), they lose their hinge status.

  ### 4. A Discriminating Hypothetical Case

  To test whether **Rule B (Tacit/Non-Theoretical)** or **Rule A (Indispensability)** is the dominant driver of her view, propose the following case:

  **The Case of the Codified Safety Protocol**
  > A team of neurosurgeons is preparing for a high-risk procedure. Their hospital protocol explicitly lists as **Item 1**: "Assumption: Human neural tissue is viable and responsive to stimulation." The surgeons sign off on this document before every surgery. They do not question it during the surgery, but it is *written down* as an explicit premise of their practice.

  **The Question:** Is "Human neural tissue is viable..." a hinge proposition for the surgeons?

  **How this discriminates:**
  *   **If she says YES (It is a hinge):** She prioritizes **Rule A (Indispensability)**. Even though it is articulated and written down, its functional role as a stopper of doubt makes it a hinge. This would suggest her rejection of "External World" was due to its *metaphysical* nature, not its *articulation*.
  *   **If she says NO (It is not a hinge):** She prioritizes **Rule B (Tacit Constraint)**. By codifying it as an explicit "Assumption 1," they have turned a lived certainty into a methodological postulate. It has become a move *within* the administrative game, not the bedrock of the surgical game. This would confirm that for her, hinges *must* remain unsaid to function as hinges.

  **Why this matters:**
  This distinction is crucial for Wittgensteinian exegesis. Wittgenstein often suggests hinges are "held fast" by what lies around them (practice), not by explicit assertion. If your fellow student adheres strictly to the "Tacit" constraint, she aligns more closely with a reading of *On Certainty* that emphasizes the *ineffability* of hinges. If she allows codified assumptions to count, she is closer to a pragmatic coherentist who views hinges as simply "high-confidence axioms." Given her rejection of "External Material World" (which is often argued for) vs. "Tree outside" (which is seen), I suspect she will rule **NO**, privileging the Tacit Constraint.
