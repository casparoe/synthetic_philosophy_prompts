  *   **Maya 1 (Mostly Right):** Correctly identifies the eliminativist core. If qualia don't exist, calling their appearance an "illusion" is semantically risky. The self-refutation charge is serious but depends on whether reasoning requires phenomenality.
  *   **Leo 1 (Mostly Right):** Accurately outlines the mechanism: introspective systems misrepresent physical states as qualitative. The bent stick analogy is the standard defense.
  *   **Maya 2 (Right):** Crucial distinction. A bent stick misrepresents a real stick; illusionism posits no real qualia to misrepresent. This suggests "illusion" is metaphorical for "false belief," weakening Leo's analogy.
  *   **Leo 2 (Mixed):** Saves coherence by treating the neural state as the "stick." This makes the view logically consistent but concedes Maya's point: it is eliminativism about qualia, saved only by redefining "illusion."

  **What Both Miss:**

  *   **Empty Concepts:** Illusionism argues phenomenal concepts are *empty* (like "witch"), not misapplied. No real property is needed for the concept to exist, only the cognitive role. This sidesteps Maya's demand for a "real thing" being misrepresented.
  *   **The Appearance Gap:** The self-refutation bites only if "appearing conscious" entails being conscious. Illusionists deny this, claiming the appearance is just functional access. The debate hinges on whether that functional state suffices for the "illusion" to occur without qualia.
