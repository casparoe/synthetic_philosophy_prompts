  4.  **Identify Missing Assumptions:**
      *   **Mareike:** Assumes the museum's primary duty is to the *current* visitor's experience and local cultural continuity. Underestimates the breach of trust in the "contract" of the museum.
      *   **Tomás:** Assumes "authenticity" is binary and resides solely in the moment of creation. Underestimates the "biography of the object" (the 1911-2024 history is now part of the object's ontology).
      *   **Both:** Ignore the financial/ethical implication of the collector's offer. Ignore the specific nature of "Reconstruction" vs. "Fake."

  5.  **Evaluate the Director's Compromise:**
      *   *Plan:* Same gallery, same frame, new label + audio.
      *   *Pros:* Honors Mareike's "influence" point, honors Tomás's "truth" point.
      *   *Cons:* Tomás says context overwhelms text. Mareike says moving it destroys the influence narrative.
      *   *Verdict:* It's actually the most pragmatic solution, but risks being "cowardly." It keeps the status quo while admitting guilt.

  6.  **Address the Collector's Offer:**
      *   Selling it as a "famous fake" monetizes the scandal.
