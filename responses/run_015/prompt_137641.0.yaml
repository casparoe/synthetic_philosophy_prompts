  2.  **Deconstruct the Debate Moves:**

      *   **Mareike Move 1 (The Experience Argument):** Value lies in the viewer's experience, not the provenance. Provenance is a proxy for quality/surface. Insisting on it is status-seeking.
      *   **Tomás Move 1 (The Institutional Mission Argument):** Museums are about contact with *actual past acts*. Context (frame, placement) speaks louder than labels. The past experience was defective because the description was false.
      *   **Mareike Move 2 (The Memoir & The Attic):** Memoir analogy: honesty fixes it. The "Attic Test": If the real de Haas appeared and looked identical, why keep the Broos? (Implies causal history doesn't matter if surface is same).
      *   **Tomás Move 2 (The Knowledge & Traces Argument):** Knowing changes seeing. Traces of specific hands matter more than duplicates. You (Mareike) actually care about history (the 40 years on the wall), just selective history.
      *   **Mareike Move 3 (The Influence Argument):** The Broos influenced regional art *because* it was thought to be a de Haas. Moving it destroys that historical fact. Purism destroys history.
      *   **Tomás Move 3 (The Concession/Reframing):** Concedes influence, but argues for a *different* show (Influence/Reconstruction), not the Dutch Gallery. Distinguishes "has history" from "belongs where thought."

  3.  **Evaluate Each Move (Drafting Ratings):**

      *   *Mareike 1:* Strong on phenomenology, weak on institutional ethics. Museums aren't just experience machines. *Rating: Partially Right.*
      *   *Tomás 1:* Strong on institutional mission, weak on the power of the label/context shift. Labels *do* change perception. *Rating: Mostly Right.*
      *   *Mareike 2:* Memoir analogy is tricky (fiction vs. non-fiction contract). The Attic Test is a strong philosophical puzzle (Goodman's "Art and Authenticity"). *Rating: Mixed.*
      *   *Tomás 2:* "Knowing changes seeing" is a psychological fact (Goodman again). The "selective history" point is a killer counter-argument. *Rating: Strong.*
      *   *Mareike 3:* This is her strongest point. The object *became* historically significant due to the mistake. Removing it erases that significance. *Rating: Very Strong.*
