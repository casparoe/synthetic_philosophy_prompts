answer: |-
  Here is a move-by-step breakdown of the exchange, rating the strength of each argument based on logical consistency and practical application.

  **Round 1**
  *   **Maya:** *Partially Right.* She captures the intuitive moral logic that hypocrisy undermines the right to blame. In moral philosophy, this is a standard view: if you violate the norm you're enforcing, you lose the positional authority to sanction others. However, she treats this as an absolute rule ("kills standing"), which is too rigid for complex social realities.
  *   **Jonah:** *Mostly Right.* He identifies the category error. In law, standing is about injury or stake, not moral purity. By distinguishing standing from credibility, he protects the validity of the critique itself. A flawed messenger can still deliver a true message. This is the stronger practical position because it prevents wrongdoers from silencing critics by pointing fingers back at them.

  **Round 2**
  *   **Maya:** *Conceptually Rich but Flawed.* Her shift to "moral address" and speech acts is sophisticated. She correctly notes that blame is a social interaction, not just a verdict. However, grounding standing in the *listener's reaction* (whether they accept the deflection) makes standing subjective.
  *   **Jonah:** *Mostly Right.* His critique is devastating here. If standing depends on whether the target is thick-skinned or humble, then standing isn't a right the accuser holds; it's a gift the accused grants. That collapses the concept entirely. Objectivity is required for standing to function as a check on power.

  **Round 3**
  *   **Maya:** *Mistaken.* "Compound standing" is an interesting patch to solve the "everyone sins" problem, but it doesn't help the specific case. It tries to aggregate minor faults to outweigh a major one, but it doesn't explain why the individual activist is silenced. It feels like a workaround rather than a principle.
  *   **Jonah:** *Right.* He correctly identifies that this doesn't solve the individual case. If the activist is alone, she still has no standing under Maya's previous rules. Collective action doesn't cure individual hypocrisy in this context.

  **Round 4**
  *   **Maya:** *Partially Right.* She pivots to functionalism: blame is about norm maintenance, not purity. This is socially true; we need imperfect people to enforce rules. But she fails to define the threshold ("not this implicated"), leaving the rule unenforceable.
  *   **Jonah:** *Mostly Right.* He calls out the vagueness. Without a clear line, "not this implicated" is arbitrary. If standing relies on a vague sliding scale, it becomes a tool for bias rather than justice.

  **Overall Assessment**
  Jonah is more right overall. While Maya offers a deeper description of the *social feelings* surrounding hypocrisy (why it feels awkward to be blamed by a hypocrite), Jonah provides the robust framework needed to protect discourse. If we accept Maya's view, any critic can be silenced by finding a flaw in their past. Jonah's distinction between standing (stake) and credibility (character) preserves the ability to challenge power even when the challenger is imperfect.

  **The Missing Distinction**
  Both are dancing around a crucial separation: **Standing vs. Moral Authority.**
  *   **Standing** is about whether you are affected by the issue (the activist lives in the city; she has standing).
  *   **Moral Authority** is about whether you are fit to judge (the activist uses styrofoam; her authority is weakened).

  The Council Member's defense ("you have no standing") is a conflation tactic. She is claiming the activist lacks the *right to speak* (standing) when she really means the activist lacks the *moral high ground* (authority). Jonah hints at this with his credibility distinction, but neither explicitly names that the Council Member is committing a category error to evade accountability. The activist has the standing to object, even if her hypocrisy makes her less persuasive.

  Verdict: Jonah wins on definition
