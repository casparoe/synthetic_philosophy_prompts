  *If they volunteered for Jewish killing but needed assignment for partisan killing:* That supports Goldhagen (specific desire).
  *If they refused Jewish killing initially but accepted partisan killing:* Supports Browning (situational shock specific to mass murder of civilians vs 'war').
  *Let's go with:* Initial high refusal on Jewish killing (Browning). Later, specific volunteering for Jewish killing over partisan killing (Goldhagen). This creates the split.

  *Wait, one more check:* Goldhagen argues *eliminationist antisemitism* was the *primary* cause. Browning argues *situational* factors were primary.
  If men refuse initially, Goldhagen is weakened. If men volunteer later *specifically* for Jews when other options exist, Browning is weakened.
