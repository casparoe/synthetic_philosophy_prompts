answer: |-
  ### Stage 1: Reconstructing the Implicit Principles

  To determine what the Alderly committee will do with the Iris Vane reconstruction, we must first reverse-engineer the metaphysics and ethics embedded in their seven prior rulings. A single principle rarely explains a complex institutional history; usually, it is a weighted cluster of commitments. Below are the four strongest candidate rules that could generate the track record. I have tested each against all seven precedents to expose where they hold and where the committee's own history creates tension.

  #### Candidate Rule 1: The Sanctioned Instantiation Principle
  **Definition:** An object counts as "The Work" if and only if the artist (or their legitimate estate) sanctions *this specific object* as a valid instance of the work. Material age is secondary to authorization.
  *   **Fit with Precedents:**
      *   *Case 3 (Bronze):* Fits perfectly. Estate sanction makes the 1985 cast a 1912 work.
      *   *Case 6 (Minimalist):* Fits perfectly. Artist sanction makes the 2016 object a 1971 work.
      *   *Case 7 (Autograph Replica):* Fits partially. Artist sanction makes it a work, but the date changes to the replica's year (suggesting sanction validates *authorship*, not *identity*).
      *   *Case 1 (Titian):* Fits. Titian did not sanction the pupil's copy as his own; thus, it is "Workshop."
      *   *Case 2 (Vermeer):* Fits. Vermeer did not sanction the forgery; thus, it is nothing (a lie).
      *   *Case 4 (Bust):* Fits. No Roman sanction; thus, it is a replica.
      *   *Case 5 (Fresco):* **Tension.** No living artist sanction. The rule must be expanded to include "Historical Continuity as Implicit Sanction."
  *   **Weakness:** It struggles to explain why Case 6 retains the *old* date while Case 7 receives a *new* date, despite both having artist sanction. This suggests a hidden variable regarding medium or intent.

  #### Candidate Rule 2: The Material Continuity Principle
  **Definition:** An object is "The Work" only if it contains a significant portion of the original material substrate manipulated by the artist. If the material chain is broken, the object is a copy or replica.
  *   **Fit with Precedents:**
      *   *Case 5 (Fresco):* Fits. The original wall/support remains, despite repainting.
      *   *Case 1 (Titian):* Fits. Pupil's material, not Titian's.
      *   *Case 2 (Vermeer):* Fits. Wrong material, wrong time.
      *   *Case 4 (Bust):* Fits. New marble dust.
      *   *Case 3 (Bronze):* **Failure.** The 1985 bronze contains no 1912 material. The committee called it the work anyway.
      *   *Case 6 (Minimalist):* **Failure.** The 2016 fabrication contains no 1971 material. The committee called it the work anyway.
  *   **Weakness:** This rule is decisively refuted by Cases 3 and 6. The Alderly clearly accepts that for certain categories of art, the idea supersedes the matter. However, Case 4 (Bust) suggests they do not accept this for *all* sculpture.

  #### Candidate Rule 3: The Medium-Relative Ontology Principle
  **Definition:** The criteria for "The Work" shift based on the artistic category. Autographic media (unique paintings, frescoes) require material continuity or artist re-creation. Allographic/Conceptual media (sculpture, minimalism, editions) allow authorized re-fabrication to count as the original work.
  *   **Fit with Precedents:**
      *   *Case 3 & 6 (Sculpture/Minimalism):* Fits. Re-fabrication = Original Work (Old Date).
      *   *Case 5 (Fresco):* Fits. Treated as unique/autographic; material continuity preserves identity.
      *   *Case 7 (Painting):* Fits. Treated as autographic; artist re-creation = New Work (New Date).
      *   *Case 4 (Bust):* **Tension.** Why is the Roman bust replica treated differently than the 1912 Bronze (Case 3)?
          *   *Resolution:* Case 3 is an *edition* authorized by the artist's estate (part of the work's definition). Case 4 is a *museum copy* made for study (external to the work's definition).
      *   *Case 1 (Titian):* Fits. Workshop copy is not part of the authorized edition/oeuvre.
      *   *Case 2 (Vermeer):* Fits. Forgery is an unauthorized intrusion.
  *   **Weakness:** It relies on a stable classification of "Painting" vs. "Sculpture/Concept." It creates a boundary problem for works that blur these lines (e.g., a painted conceptual work).

  #### Candidate Rule 4: The Epistemic Transparency Principle
  **Definition:** The museum displays objects where the label can truthfully resolve the ontological status without undermining the viewer's experience. We do not exhibit "lies" (Case 2), but we will exhibit "reconstructions" if the label makes the status clear.
  *   **Fit with Precedents:**
      *   *Case 2 (Vermeer):* Fits. "We do not exhibit lies."
      *   *Case 1, 4, 5, 7:* Fits. All rely on specific labeling ("Workshop," "Replica," "Condition Note," "Dated to replica").
      *   *Case 6 (Minimalist):* **Tension.** The committee voted for *no note* that the object is the second fabrication. This violates strict transparency in favor of aesthetic immersion.
      *   *Case 3 (Bronze):* Fits. "No asterisk" implies the label treats it as fully original.
  *   **Weakness:** It cannot explain why Case 6 gets a "clean" label while Case 4 gets a "Replica" label, given both are visually indistinguishable from an original. This suggests transparency is secondary to Authorization (Rule 1).

  ---

  ### Stage 2: The Iris Vane Prediction

  **The Case:** A painting (autographic medium) destroyed. Original stretcher/frame (material continuity) survive. Estate authorizes reconstruction (sanction). Artist explicitly forbade reconstruction (counter-sanction). Reconstruction is visually indistinguishable (aesthetic function). Label proposes "Reconstruction after..." (transparency).

  **The Closest Analogue:** **Case 7 (Artist's Autograph Replica).**
  *   *Why:* Like Vane, this involves a painting lost and recreated. Like Vane, the result is visually identical to the lost original.
  *   *The Divergence:* In Case 7, the *artist* performed the recreation. In Vane, a *specialist + AI* performs it. In Case 7, the artist implicitly sanctioned the new object by painting it. In Vane, the artist explicitly *forbade* it.

  **The Trap Analogue:** **Case 6 (Minimalist Refabrication).**
  *   *Why:* It tempts the committee to prioritize the Estate's authorization and the visual result over the material loss. It suggests that if the "look" and the "permission" align, the work survives.
  *   *Why it is a Trap:* Case 6 relies on the ontology of Minimalism/Conceptual art, where the instruction *is* the work. Vane's 1989 statement ("rather a burnt painting stayed burnt") signals an ontology of the *unique object*, closer to Case 7 or Case 5. Treating Vane like Case 6 would be a category error.

  **The Prediction:**
  The committee will **refuse the main wall** and likely offer the **study gallery (Case 4)** status, or reject it entirely.

  **The Reasoning (Consistency Check):**
  To be consistent with their own track record, the committee must weigh the conflicting precedents.
  1.  **Medium:** Vane is a painter. Precedents 5 and 7 establish that for painting, material continuity (Case 5) or artist re-creation (Case 7) is required for "Original" status. Case 3 and 6 (re-fabrication as original) are restricted to sculpture/conceptual works.
  2.  **Authorization:** While the Estate authorizes (like Case 3), the Artist forbade (unlike Case 3, 6, 7). The committee has never overridden an explicit artist prohibition in their track record. Case 2 shows they reject objects that violate the "truth" of the artist's hand/intent.
  3.  **Material:** The original stretcher exists. This invokes Case 5 (Fresco). However, in Case 5, the *visible surface* was the original support. In Vane, the *canvas* (the primary support for the paint) is new. The stretcher is structural, not aesthetic.
  4.  **Transparency:** The proposed label ("Reconstruction after...") is honest (Rule 4). However, Case 6 shows that for "The Work," they prefer *no* asterisk. If they hang it on the main wall with that label, they are admitting it is *not* "The Work." If it is not "The Work," it belongs in the study gallery (Case 4).

  **Verdict:** They will likely rule that the object is a **Document of the Work**, not the Work itself. It will be hung in the study gallery behind glass (matching Case 4), or refused entirely if they deem the Artist's prohibition (1989) a moral veto that supersedes Estate legal rights. Given the "near-unanimous" trend in the track record, a compromise of "Study Gallery" is the most institutionally safe path that respects the Estate (Case 3) without violating the Artist's intent (Case 7) or the Material Principle (Case 4).

  **Where the Track Record Underdetermines the Answer:**
  There is a genuine tension between **Case 3 (Estate Authority)** and **Case 7 (Artist Hand).**
  *   If the committee prioritizes *Legal/estate continuity* (Case 3), they should hang it on the main wall.
  *   If they prioritize *Ontological/Material continuity* (Case 5 & 7), they must relegate it.
  The track record does not definitively settle whether Estate Authority can override Artist Moral Rights in autographic media. Case 3 is bronze (allographic); Case 7 is painting (autographic). We have no precedent for an Estate authorizing a *painting* reconstruction against the Artist's stated wishes. This is the gap the Vane case exposes.

  ---

  ### Evaluation of Further Cases

  You proposed two cases to settle which rule the museum is running. Here is their diagnostic value.

  #### Case A: The Signed 1993 Letter
  *Scenario:* The same reconstruction, but you produce a signed 1993 letter from Vane authorizing a posthumous reconstruction if needed.
  *   **Diagnostic Power:** **High.** This is the cleanest discriminator between **Rule 1 (Sanction)** and **Rule 3 (Medium/Material).**
  *   **Outcomes:**
      *   *If they hang it on the Main Wall (as "Iris Vane, 1961"):* They are operating on **Rule 1 (Sanction).** They believe Artist Intent (even posthumous) validates the object's identity, overriding the material break. This aligns them with Case 6 (Minimalist) but extends it to Painting.
      *   *If they still relegate it to Study Gallery:* They are operating on **Rule 2/3 (Material/Medium).** They believe that for paintings, the *physical history* cannot be bridged by intent alone. The "burnt painting stayed burnt" principle is ontological, not just ethical.
  *   **Critique:** This is an excellent test case. It isolates the variable of *Artist Intent* from *Estate Authority*.

  #### Case B: The Machine-Woven Tapestry
  *Scenario:* An honest, labelled, machine-woven tapestry after a Vane painting the museum owns, hung beside the original for a year. Visitors are told they will see one or the other.
  *   **Diagnostic Power:** **Medium/Low.** This tests the "50-year substitution test" (Curator A) vs. "Shadow Provenance" (Curator B).
  *   **Outcomes:**
      *   *If visitors cannot tell and the museum keeps it:* They accept **Rule D (Aesthetic Indistinguishability).**
      *   *If they remove it:* They accept **Rule E (Provenance).**
  *   **Critique:** This is less useful for *your* specific feature on the Vane decision. The Vane case is about *ethics and authorization*, not just visual perception. The Tapestry case tells you about their metaphysics of perception, but the Letter case tells you about their ethics of stewardship. For a story on "why anyone cares about originals," the Letter case is more potent because it addresses the *authority* to recreate, which is the core conflict in Vane.

  #### A Cleaner Case: The "Surrogate Hand"
  I propose a third option that might be sharper than both.
  *   **Scenario:** A painting is destroyed. The Artist, before death, designates a specific living peer to recreate it if lost, and signs a document stating "This recreation shall be considered the Original." The peer paints it after the Artist's death.
  *   **Why it settles the rule:** This removes the "Estate" variable (which is legal, not artistic) and the "Machine/AI" variable (which raises authenticity of touch). It pits **Artist Intent** directly against **Material Hand.**
  *   **Outcome:**
      *   *If hung as Original (1961):* The museum believes Art is **Conceptual** (The Idea survives).
      *   *If hung as Replica (New Date):* The museum believes Art is **Haptic** (The Hand is essential).
      *   *If Refused:* The museum believes Art is **Historical** (The Event is unrepeatable).

  ### Recommendation for the Feature

  For your article, the **Signed 1993 Letter (Case A)** is the narrative engine you need. It forces the committee to choose between respecting the *Artist's Voice* (even when authorizing a fake) or respecting the *Object's History* (even when the Artist says ignore it).

  If they accept the letter and hang it as the 1961 original, they reveal that they view the museum as a **Theater of Intent**: the artist's will conjures the work, and the object is merely a prop.
  If they reject the letter (or hang it as a reconstruction), they reveal that they view the museum as an **Archive of Matter**: the physical history is sacred, and even the artist cannot resurrect the dead.

  **My Best Guess on the Vane Ruling:**
  They will **reject the main wall.**
  *Reason:* The committee's refusal to exhibit the Vermeer forgery (Case 2) establishes a boundary against "lies." While the Vane reconstruction is labelled, the Artist's 1989 statement makes the reconstruction a violation of her intent. In Case 7, the Artist *chose* to repaint. In Vane, she *chose* not to. The committee respects Artist Agency (Case 7) more than Estate Access (Case 3). To hang it would be to privilege the Estate's legal right over the Artist's moral right, which contradicts the spirit of Case 6 (where the Artist *supervised* the remake). Without the Artist's voice, the "Work" died in 1998.

  **What this tells us about the Museum:**
  The Alderly is not a temple of Aesthetics (where the look matters most, per the 50-year test). It is a temple of **Provenance**. They value the *story of the object* more than the *object of the story*. The Vane reconstruction has a beautiful story, but it is a new story, not the old one. They will likely preserve the charred stretcher as the "relic" and refuse the painting, admitting that some losses are the point of the art.
