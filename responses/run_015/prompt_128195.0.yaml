      *   *Refinement on Authority:* It's not just User vs. Board. It's also "Local Context" vs. "Global Norms."

  6.  **Final Structure:**
      *   Intro: Validating the observation.
      *   1. Cognitive Modularity (Reasoning vs. Morality).
      *   2. Political Authority (User Sovereignty vs. Paternalism).
      *   3. Moral Neutrality of Technology (The Benign Assumption).
