answer: |-
  This is a rigorous formulation of the **overdemandingness objection** applied to collective memory. You have constructed a *reductio ad absurdum*: if the duty to remember is impartial and resources are scarce, the duty becomes impossible to fulfill, and therefore (you argue) nonexistent.

  You cannot accept (7) because you intuit that **erasure is a distinct moral wrong**, not merely a suboptimal allocation of resources. To save the duty without collapsing into incoherence, you must break the chain between the *existence* of the duty and the *impossibility* of its perfect fulfillment.

  Here are the three viable exits, ranked by philosophical cost, followed by the recommendation on which to take.

  ---

  ### Exit 1: Reject Premise (5) — The Prioritization Exit
  **The Step:** Deny that fulfilling one duty constitutes a "dereliction" of others when resources are insufficient.
  **Why it looked fine:** It relies on the intuition that if I owe $100 to A and $100 to B, and I have only $100, paying A leaves me in debt to B. In a ledger, the debt remains.
  **The Cost:** You must abandon the idea that moral duties are **absolute**. You must accept that duties are *prima facie* (binding unless overridden) rather than *all-things-considered* (binding regardless of context). This introduces **moral residue**: the community does the right thing by remembering W, but still carries a guilt-regard for W'. It accepts that moral life involves tragic choices where doing the "right" thing still involves a loss of value.

  **Does it save the condemnation of the eraser?**
  Yes. The eraser is not someone forced to choose between W and W' due to scarcity. The eraser chooses *silence* over *both*, or chooses *comfort* over *truth*. That is not a tragic triage; it is a evasion. The defender of the duty can say: "You could not remember everyone, so you were obligated to remember the *most pressing* case (e.g., the one you committed). To remember none is not a tragic choice; it is a moral failure."

  ### Exit 2: Reject Premise (1) — The Associative Duty Exit
  **The Step:** Assert that the duty *can* rest partly on the fact that the wrong is "ours."
  **Why it looked fine:** It appeals to moral impartiality. We generally reject the idea that "our children matter more than strangers' children" in abstract justice. To allow partiality looks like nationalism or tribalism.
  **The Cost:** You must defend **special obligations**. You have to argue that political communities are not just arbitrary collections of people but moral agents with specific histories. The cost is the risk of sliding into the "preference" you fear. You must articulate why "our" victims matter *more* to us without saying they matter *more* in the abstract. (Analogy: I have a duty to feed my child that I do not have to feed a stranger's child, not because my child is more human, but because I am *their* parent).

  **Does it save the condemnation of the eraser?**
  Yes, robustly. If the duty is grounded in the specific relationship between the state and its history, the state has no excuse for forgetting its *own* crimes, even if it ignores foreign ones. It narrows the scope of the duty to a manageable level, dissolving the scarcity problem for the specific case you care about (the genocide the state committed).

  ### Exit 3: Reject Premise (3) — The Non-Zero-Sum Exit
  **The Step:** Argue that remembrance is not a finite commodity like money or calendar days.
  **Why it looked fine:** Attention, time, and money *are* physically finite. A day of mourning for W is a day not mourning W'.
  **The Cost:** You must argue that remembrance is **expansive**. Remembering one atrocity deepens the *capacity* to remember others (a "moral muscle"). However, this is empirically shaky. Compassion fatigue is real. To hold this, you must distinguish between *commemoration* (rituals, which are zero-sum) and *remembrance* (a disposition, which is not).
  **Does it save the condemnation of the eraser?**
  Weakly. If remembrance is non-zero-sum, the eraser has even less excuse. But if you are wrong and resources *are* finite, the argument collapses back into Exit 1 or 2.

  ---

  ### Addressing the Two Further Matters

  **1. Two Currencies (Suffered vs. Inflicted)**
  You are correct to suspect these draw on different reserves.
  *   **Remembrance of Victimhood:** Draws on **grief and solidarity**. Its function is to validate the suffering of the community's members and bind them together. Scarcity here is emotional exhaustion.
  *   **Remembrance of Perpetration:** Draws on **guilt and responsibility**. Its function is to constrain power and acknowledge debt. Scarcity here is political will and national ego.
  *   **The Fix:** A state can claim it lacks the *emotional capacity* to mourn every foreign victim (Currency 1), but it cannot claim it lacks the *political capacity* to acknowledge its own crimes (Currency 2). The duty to remember what you *did* is stricter than the duty to remember what you *suffered*, because the former is a condition of your moral agency, while the latter is a condition of your solidarity. This breaks the symmetry in your "plain case."

  **2. Duty to Future (Non-repetition)**
  If the duty is purely instrumental ("we remember so as not to repeat"), the argument survives and destroys the duty.
  *   **The Trap:** If a state can prove it has learned the lesson without the ritual (e.g., via policy changes alone), the duty to *remember* vanishes.
  *   **The Fix:** The duty must be **hybrid**. It is partly instrumental (safety) but partly **constitutive** (justice). The victims are owed acknowledgement *regardless* of whether it prevents future crime. To treat memory only as a tool for the future is to use the dead as means to an end. You must retain the deontological core: the dead demand witness.

  ---

  ### Ranking the Exits by Cost

  1.  **Lowest Cost: Reject (5) [Prioritization].**
      *   *Why:* This aligns with standard ethical theory (W.D. Ross's *prima facie* duties). It preserves impartiality (1) and acknowledges physical reality (3). It only requires accepting that moral life involves tragic trade-offs.
      *   *Risk:* It leaves the "dereliction" feeling intact. We still feel guilty for what we don't remember.

  2.  **Medium Cost: Reject (1) [Associative Duty].**
      *   *Why:* This solves the scarcity problem by narrowing the scope. It validates the intuition that we owe more to those in our political continuum.
      *   *Risk:* It requires careful philosophical work to distinguish "special duty" from "tribal preference." If mishandled, it justifies ignoring foreign genocides entirely.

  3.  **Highest Cost: Reject (3) [Non-Zero-Sum].**
      *   *Why:* It fights physics and psychology. Attention *is* finite. Claiming otherwise risks sounding utopian or ignoring the reality of compassion fatigue.

  ---

  ### Recommendation: Which Exit to Take?

  A defender of the duty ought to take **Exit 1 (Reject Premise 5)**, supported by a modification of **Premise 1**.

  **The Argument:**
  Do not claim that remembering W violates the duty to remember W'. Claim that **duties of remembrance are defeasible.**
  1.  We have a *prima facie* duty to remember all grave wrongs (preserving Impartiality).
  2.  Resources are scarce (preserving Realism).
  3.  Therefore, we must **prioritize**.
  4.  Prioritization is not dereliction; it is moral management.
  5.  **The Hierarchy:** The duty to remember wrongs *we committed* is heavier than the duty to remember wrongs *we suffered*, which is heavier than the duty to remember wrongs *unrelated to us*.
      *   *Reason:* Remembering our own crimes is a condition of our moral agency and non-repetition. Remembering our own victimhood is a condition of solidarity. Remembering unrelated wrongs is a condition of humanitarianism.
  6.  **The Verdict on the Eraser:** The state that erases its *own* genocide is not making a tragic choice between competing duties; it is shirking its **highest** duty to fulfill lower ones (or comfort). That is why it is condemnable.

  **Why this works:**
  It dissolves the incoherence in (6). A principle that says "Do the most important thing possible given constraints" does not make every act wrongful. It makes some acts *tragic*, but not *wrongful*.
  It saves your intuition: The state that erases its own crime is not like a cricket fan choosing sport over opera; it is like a parent feeding their dog while letting their child starve. It is a violation of a hierarchy of obligation, not a violation of the law of non-contradiction.

  **The Cost You Must Pay:**
  You must accept that a community can do its "duty" and still feel a residue of guilt for the unremembered dead. You must accept that memory is a **tragic obligation**, not a clean ledger. But this is a price worth paying to avoid the conclusion that memory is merely taste.
