      *   **Premise (6) - Incoherence:** *A principle that makes every dutiful act simultaneously a wrongful one is incoherent.*
          *   *Appeal:* "Ought implies can." Contradictions kill moral systems.
          *   *Flaw:* Moral dilemmas exist. Tragic choices exist. A duty can be *prima facie* rather than absolute.
