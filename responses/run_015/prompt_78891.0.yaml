      *   **Premise (3) - Scarcity/Zero-Sum:** *Remembrance is not free... What is spent on W is not spent on the rest.*
          *   *Appeal:* Physical resources (days, money) are finite. Attention is finite.
          *   *Flaw:* Remembrance isn't purely transactional. Remembering one thing can deepen the *capacity* to remember others (synergy). Also, "remembering" isn't just a calendar day; it's a stance.
