answer: |-
  **MEMORANDUM**

  **TO:** The Editorial Board, *Non-Human Causation in World History*
  **FROM:** Resident Philosopher
  **DATE:** October 26, 2023
  **SUBJECT:** Acquisitions Ruling: The Northern Cod Collapse (Newfoundland, 1992)

  Colleagues,

  You have asked me to arbitrate the status of the Atlantic cod (*Gadus morhua*) in the proposed chapter on the 1992 moratorium. The author wishes to treat the fish population as an **Actor**—a entity with a bounded identity and internal dynamics (recruitment failure, evolutionary shifts) that *does* things (collapses, refuses to rebound). Our task is to determine if this grammar is permissible under the jurisprudence we have built over the last eight rulings.

  Below is the reconstruction of our implicit rules, the recommendation for consistency, and the stress test required to secure our theoretical flank for future volumes.

  ### I. Reconstructed Rules and Predictions

  Reviewing our eight precedents, three distinct rules emerge. They do not perfectly overlap, which is why this case is difficult.

  **1. The Autonomy Rule (The "Clock" Test)**
  *   **Definition:** An entity qualifies as an *Actor* if it exhibits internal dynamics and a "clock" independent of human intention, regardless of visibility or scale.
  *   **Precedents:** *Plague* (Yes, biological replication), *Rinderpest* (Yes, viral spread), *Malaria* (Yes, vector lifecycle), *Tambora* (Yes, geological event). Excludes *El Niño* (Metronome/cycle), *Salinization* (Condition/accumulation).
  *   **Prediction for Cod:** **YES.** The author explicitly cites "fisheries-induced evolution" and "recruitment failure" as internal dynamics. The fish are not merely passive objects; they are biologically responding to pressure in ways that defy human quota models.
  *   **Confidence:** High.

  **2. The Determinism Vet (The "Inevitability" Test)**
  *   **Definition:** An entity is denied *Actor* status if granting it agency would render a complex historical outcome inevitable or erase human moral responsibility. This is the "Tsetse Exception."
  *   **Precedents:** *Tsetse* (No, would make precolonial state boundaries look biologically destined). *Malaria/Tambora* (Yes, *but* only with strict "co-authoring" of human factors like drainage or grain prices to dilute determinism).
  *   **Prediction for Cod:** **NO (with caveats).** If the cod is the sole protagonist, the collapse looks like a natural tragedy rather than a policy failure. To pass this rule, the "diesel trawlers, sonar, and federal quotas" must be elevated from background *Conditions* to co-authoring *Actors*.
  *   **Confidence:** Medium-High.

  **3. The Event/State Boundary (The "Punctuality" Test)**
  *   **Definition:** *Actors* are typically punctual interventions (eruptions, invasions, outbreaks). *Conditions* or *Metronomes* are enduring states or slow gradients.
  *   **Precedents:** *Rinderpest/Plague* (Yes, outbreaks). *Little Ice Age/Salinization* (No, slow processes). *Tsetse* (No, endemic presence).
  *   **Prediction for Cod:** **SPLIT.** The *collapse* (1992) is punctual (like Tambora), but the *population dynamics* described span decades (like the Little Ice Age). This rule suggests we might allow the "Collapse" as an Actor but the "Stock" as a Condition.
  *   **Confidence:** Medium.

  ### II. Recommendation and Principled Commitment

  **Decision:** We should vote **YES**, classifying the Cod as an **Actor**, subject to the **Co-Authorship Requirement** established in the *Malaria* and *Tambora* rulings.

  **Closest Analog:** **The Rinderpest Panzootic (1890s).**
  Like the cod, rinderpest was a biological population with its own dynamics that "invaded" a region. Crucially, our minute on Rinderpest acknowledged its spread was "helped along" by human logistics (Italian army cattle). This matches the Cod proposal: the fish have biological agency (evolutionary refusal to mature), but their demise was "helped along" by human logistics (trawlers/quotas).

  **Principled Commitments:**
  *   **If we vote YES:** We commit the series to the principle that **biological populations are historical agents even when they are the victims of human extraction.** We affirm that a species can "act" by failing to reproduce, provided the human technologies that provoked that failure are named as co-agents. This preserves the *Rinderpest* and *Malaria* precedents.
  *   **If we vote NO:** We commit the series to the principle that **ecological constraints are merely background Conditions.** This creates a dangerous inconsistency with *Rinderpest* and *Malaria*. It suggests that pathogens are Actors but prey populations are not, a distinction that is biologically untenable and historically limiting. It risks turning the *Tsetse* ruling (which was about avoiding political determinism) into a blanket ban on ecological agency.

  **Addressing the 1890s Fatigue:**
  You noted uncertainty about whether the *Rinderpest* (Yes) vs. *Drought* (No) split was principled or fatigue. I argue it was principled: *Rinderpest* is an *Actor* (pathogen with a clock); *Drought* is a *Metronome* (phase of a climate cycle). The Cod is biologically closer to *Rinderpest* than *El Niño*. It has a genome, not just a temperature index.

  ### III. The Crucial Hypothetical

  To separate the surviving rules (specifically to test if we are truly committed to *Autonomy* or if we are secretly enforcing the *Event/State* boundary), I propose we prepare for the following future submission:

  **Hypothetical Proposal:** *The Colonization of the Great Lakes by the Zebra Mussel (1988–Present).*

  **Why this separates the rules:**
  *   **Autonomy Rule:** Predicts **YES**. It is an invasive species with its own reproductive dynamics (like Cod/Rinderpest).
  *   **Event/State Rule:** Predicts **NO**. Unlike the 1992 Cod *Closure*, the Zebra Mussel is not a punctual crash; it is a permanent, enduring transformation of the infrastructure (like *Tsetse* or *Salinization*).
  *   **Determinism Vet:** Predicts **NO**. Granting the mussel agency might obscure the human negligence (ballast water regulations) that allowed it.

  If we accept the Cod as an Actor, we must logically accept the Zebra Mussel. If we reject the Mussel because it is a "standing condition" rather than a "collapse event," we reveal that our *Event/State Boundary* is stronger than our *Autonomy Rule*, and we will need to rewrite the Cod minute to focus strictly on the 1992 *moratorium event*, not the fish population itself.

  ### IV. Confidence and Uncertainty

  **Confidence Levels:**
  *   **Reconstruction of Rules:** High Confidence (90%). The patterns in the minutes are clear, even if the vocabulary varies.
  *   **Recommendation (Yes + Co-Authorship):** Medium-High Confidence (75%). This is the only path that does not contradict *Rinderpest* or *Malaria*.
  *   **Closest Analog (Rinderpest):** High Confidence (85%). The biological/logistical entanglement is nearly identical.
  *   **Hypothetical Utility (Zebra Mussel):** High Confidence (80%). It cleanly isolates the "Enduring Constraint" variable.

  **The Weakest Claim:**
  I am **least sure** of my interpretation of the **Tsetse Fly ruling**.
  *   *Claim:* "The Tsetse was rejected because granting it agency would make state formation look inevitable (Determinism Vet)."
  *   *Uncertainty:* It is equally possible the Tsetse was rejected because it is an *endemic condition* rather than an *acute invasion* (Event/State Boundary). If the latter is true, the Cod proposal is on much shakier ground than I have admitted, because the cod decline was a decades-long process, not a sudden strike like the Plague. If the Board's intuition on Tsetse was actually about *duration* rather than *determinism*, my recommendation to approve the Cod as an Actor risks creating a contradiction we cannot easily resolve later. I flag this because the Tsetse minute is the only one where we explicitly cited "inevitability," but the *Salinization* ruling (Condition) suggests duration matters just as much.

  I recommend we approve the Cod chapter, but draft the minute to explicitly state that the *population dynamics* are the Actor, while the *fishery* is the site of entanglement. This leaves us room to maneuver should the Zebra Mussel proposal arrive.

  Respectfully,

  The Resident Philosopher
