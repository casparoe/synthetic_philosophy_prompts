prompt: |-
  hey, i'm writing a feature on AI ethics panels and ran into this consistency puzzle with a board called Northbridge Review. they ok'd a eldercare bot that fakes emotional recognition to calm patients—said the lie was about affect, not fact, and users kept exit rights. they nixed a delivery drone that weights rider vs pedestrian lives in real time, arguing moral math can't be hidden in opaque weights. they approved a hiring algo that hides its ranking from applicants but dumps feature weights in an unread appendix. they rejected a tutor that updates its ethical priorities via student feedback loops, calling it normative drift. and they greenlit a defense system that lets humans pull the trigger but feeds them probabilistic threat scores that are technically only advisory.

  now there's a mental-health chatbot proposal. it runs a hidden 'relational scaffold'—just scripted mirroring, no internal model of the user's mind—to build rapport, then suddenly drops the mask and switches to diagnostic Q&A, but only for users who picked 'efficiency mode'. the deception is purely about seeming to care, not about risk or proceedure.

  if they want to be consistent with themselves, what's the verdict? which precedent is the closest analog, and if the cases genuinely underdetermine it, what's the hidden principle they'd be adopting with each option?
