prompt: |-
  I teach one 75-minute session of a graduate seminar on collective decision-making: 18 students, mixed preparation (roughly half have had a first course in microeconomics, two or three have traded on a prediction market, none has studied futarchy), one room with a projector, and a strong preference for a paper-and-pencil procedure over anything that depends on students having phones or laptops. I want to run futarchy itself as a classroom game: the students should decide something real about the seminar by voting on a welfare metric and then letting conditional prediction markets pick the policy, and only in the debrief should the word futarchy be used and the mechanism placed in its intellectual context.

  What I want them to feel, in this order, is first that conditional markets genuinely aggregate dispersed private information better than discussion or a show of hands — the pull of the proposal has to land before it is named — and then that something goes structurally wrong with it. My own suspicion, which I would like the activity to test rather than assume, is that the standard objection (that people who hold contracts paying off on a bad outcome have an incentive to bring that outcome about) is not the deepest problem. The deeper one is that in futarchy the treatment is assigned by the forecast of its own effect: the market is asked for a number that is supposed to be read causally, but the number is also public and is read by the very people whose subsequent effort and cooperation determine the outcome, so the price is a fixed point of a loop rather than an estimate of a policy effect, and the market partly destroys the informational conditions that made its own price informative. I would like the activity to make that loop visible as something the students do and watch happen, not as something I assert, and I would like the debrief to distinguish which moment in the session displayed the sabotage incentive, which displayed reflexivity, and which displayed gaming of the metric itself.

  Please give me: the decision and the welfare metric to put to them (I am happy for the metric to be one they can cheaply inflate, such as self-reported comprehension, if that serves the design); the trading mechanism, runnable on paper with 18 novices in one room, including how the two conditional markets are opened and how the verdict is computed from their prices; the assignment of at least one role whose holder observes the market price before taking an action that affects the outcome, together with that role's payoffs; a payoff scheme using points or trivial stakes rather than money; a minute-by-minute timeline; the debrief, mapping particular moments onto particular features of the mechanism; what will predictably go wrong the first time I run it and how to recover; and an honest note on which feature of real futarchy the session cannot reproduce and which therefore has to be supplied by me in discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Graduate seminar, 75 minutes, 18 students, mixed econ background (half micro, few prediction market experience, no futarchy knowledge).
      *   **Constraint:** Paper-and-pencil only (no phones/laptops).
      *   **Goal:** Run a futarchy-like game *before* defining futarchy.
      *   **Desired Experience:**
          1.  Feel conditional markets aggregate info better than voting/discussion.
          2.  Feel something goes structurally wrong.
          3.  Test the instructor's hypothesis: The deepest problem isn't sabotage (incentive to make the outcome fail), but *reflexivity* (the forecast affects the outcome because agents see the price and adjust effort/cooperation, creating a fixed-point problem).
      *   **Deliverables:** Decision/Metric, Trading Mechanism (paper-based), Roles (specifically one who sees price and acts), Payoff Scheme, Timeline, Debrief (mapping moments to mechanisms), Troubleshooting, Limitations.

  2.  **Deconstruct the Core Challenge:**

      *   *Futarchy Definition:* Vote on values (welfare metric), bet on beliefs (conditional prediction markets). Policy chosen based on which market predicts higher welfare.
      *   *The "Reflexivity" Problem:* In standard prediction markets, the event is exogenous to the traders (e.g., will it rain?). In futarchy, the event is endogenous (e.g., will the team succeed *if* we do Policy A?). If traders know the market price determines the policy, and the policy success depends on their effort, they might trade based on how their trading affects the policy choice *and* subsequent effort.
      *   *The "Sabotage" Problem:* If I hold a short position on Policy A, I want Policy A to fail.
      *   *The Constraint:* Paper trading with 18 novices in 75 mins is tight. Continuous double auctions are impossible. We need a call market or a market maker system.
      *   *The "Real Decision":* Needs to be something that affects the seminar but allows for post-decision effort manipulation.
      *   *The "Reflexivity" Role:* Someone needs to see the price *before* the outcome is determined, and their action must influence the outcome. The instructor usually fills this role, but the prompt asks for a *student* role ("assignment of at least one role whose holder observes the market price..."). Let's make it a "Implementer" or "TA" role played by a student.

  3.  **Designing the Game:**

      *   **Decision:** Two formats for the *next* class session (or the remainder of this one, but next class is better for outcome realization). Let's stick to "Format of the Next Seminar."
          *   Policy A: Lecture-heavy (Instructor talks 80%).
          *   Policy B: Workshop-heavy (Students work 80%).
      *   **Welfare Metric:** "Average Self-Reported Learning" (1-10 scale) collected at the end of the *next* class. This is cheap to inflate (Goodhart's Law) and subjective (allows for effort influence).
      *   **Trading Mechanism:** Parimutuel or Market Scoring Rule? No, too complex for paper. Let's use a **Call Market with a Subsidized Market Maker (The Instructor)**.
          *   Students buy tickets.
          *   Ticket A pays $1 if Metric > Threshold *given* Policy A is chosen.
          *   Ticket B pays $1 if Metric > Threshold *given* Policy B is chosen.
          *   Actually, Futarchy compares $E[Metric|A]$ vs $E[Metric|B]$.
          *   Simplified Paper Mechanism: Students allocate an endowment between "Fund A" and "Fund B". The price is the ratio of funds. Or, simpler: They write down a probability estimate. The average is the price.
          *   *Better for "Feeling" the Market:* A **Double Auction via Paper Slips** is too slow. A **Market Scoring Rule (LMSR)** is too math-heavy.
          *   *Best for 75 mins/18 students:* **The "Investment Pool" Mechanism.**
          *   Each student gets 100 points. They invest $x$ in Policy A and $(100-x)$ in Policy B.
          *   Wait, that just averages beliefs. It doesn't create a tradeable asset.
          *   *Revised Mechanism:* **Conditional Asset Market.**
          *   Asset A pays out the *actual metric score* if Policy A is chosen.
          *   Asset B pays out the *actual metric score* if Policy B is chosen.
          *   Only one policy is chosen (the one with higher market price).
          *   How to set price on paper? **The Instructor acts as the Market Maker.** Students submit buy/sell orders at specific prices. Instructor clears the market.
          *   *Even Simpler:* **The "Estimation Crowd" with Stakes.** Students submit a number (0-10) for "Expected Score if A" and "Expected Score if B". They are scored on accuracy (Brier/Scoring Rule). The *average* is the market price.
          *   *Critique:* That feels like a survey, not a market.
          *   *Compromise:* **Token Trading with a Central Book.** Instructor writes prices on board. Students pass slips to buy/sell. Instructor adjusts price based on excess demand. (Walrasian Tatonnement on paper).
          *   *Time Saver:* Pre-printed order slips. 3 rounds of trading.
      *   **The Reflexivity Loop:**
          *   The Market Price determines the Policy.
          *   One student is the "Facilitator" for the next class. Their effort determines the Metric.
          *   The Facilitator sees the Market Price *before* preparing/running the next class.
          *   If the market says "Policy B will score 9/10," the Facilitator might slack off (self-fulfilling) or try to prove it wrong.
          *   *Crucial Twist:* To make reflexivity visible *in class*, we need the outcome to be determined *in class*.
          *   *Problem:* The outcome (learning) happens next week.
          *   *Solution:* Simulate the "Effort" phase *now* as a proxy.
          *   *Revised Decision:* "How we spend the last 20 minutes of *today*."
          *   Policy A: Q&A with Instructor.
          *   Policy B: Group Problem Solving.
          *   Metric: "Enjoyment/Usefulness" rating submitted on paper at the very end.
          *   Reflexivity Role: A "Group Leader" (Student) who decides how hard the group works during the 20 mins. They see the market price before the 20 mins start.

  4.  **Refining the Mechanism for Paper/Novices:**

      *   **Endowment:** 10 "Shares" of cash per student.
      *   **Assets:**
          *   Asset A: Pays $1 \times$ (Average Rating) if Policy A is chosen.
          *   Asset B: Pays $1 \times$ (Average Rating) if Policy B is chosen.
          *   *Wait, Futarchy chooses the policy with the higher expected value.*
          *   So, Asset A pays the Rating if A is chosen, 0 otherwise. Asset B pays Rating if B is chosen, 0 otherwise.
          *   Market Price of A = $P(A) \times E[Rating|A]$.
          *   This is getting too complex for 75 mins.
      *   **Simplification:**
          *   Market 1: "What will the Rating be IF we do A?" (Price = Expected Rating).
          *   Market 2: "What will the Rating be IF we do B?" (Price = Expected Rating).
          *   Policy chosen = Higher Price.
          *   Payout: If you hold a ticket in the *chosen* market, you get paid the *actual* Rating. If you hold a ticket in the *rejected* market, you get nothing (or your money back).
          *   Trading: **Call Market.** Instructor announces a price (e.g., 7.0). Students write "Buy 5" or "Sell 5". Instructor aggregates. Adjusts price. Repeat 3 times.
      *   **Reflexivity Role:** "The Implementer." One student is chosen to lead the activity. Their effort level (High/Low) significantly sways the rating. They see the final market price before leading.
      *   **Sabotage:** If I sold high on Policy B, I want the rating to be low.

  5.  **Addressing the Instructor's Hypothesis (Reflexivity vs. Sabotage):**

      *   To highlight reflexivity, the Implementer's payoff must be aligned with the *success* of the policy, but their *effort cost* is private.
      *   If the market predicts a High Score, the Implementer might feel "The bar is set high, I can't reach it, so I won't try" (Defeatism/Reflexivity).
      *   Or, "The market says this will work, so I don't need to work hard" (Moral Hazard).
      *   To make this visible, the Implementer must write down their intended effort level *after* seeing the price but *before* the activity.

  6.  **Drafting the Plan:**

      *   **Decision:** Format of the final 20 minutes (Lecture vs. Workshop).
      *   **Metric:** Average "Value Added" score (1-10) on exit slip.
      *   **Mechanism:** Walrasian Call Market (Instructor as auctioneer). 2 Assets (Value-A, Value-B).
      *   **Roles:** Traders (17 students), Implementer (1 student).
      *   **Payoffs:** Course credit points (trivial but real).
      *   **Timeline:**
          *   0-10: Intro & Metric Vote.
          *   10-30: Market Training & Trading Round 1.
          *   30-40: Trading Round 2 & Price Discovery.
          *   40-45: Policy Selection & Implementer Briefing.
          *   45-65: The Activity (Policy Execution).
          *   65-75: Scoring, Payout, Debrief.
      *   **Debrief:** Connect the Implementer's feeling seeing the price to Reflexivity. Connect the "Short Sellers" to Sabotage. Connect the Metric choice to Goodhart.

  7.  **Troubleshooting:**

      *   *Risk:* Market doesn't converge. *Fix:* Instructor acts as aggressive market maker.
      *   *Risk:* Implementer doesn't feel power. *Fix:* Make their role crucial (e.g., they summarize the discussion).
      *   *Risk:* Reflexivity isn't felt. *Fix:* In debrief, ask Implementer explicitly: "Did the price make you try harder or softer?"

  8.  **Limitations:**

      *   Real futarchy uses real money and long time horizons. This is instantaneous.
      *   Real futarchy separates voters from traders. Here they overlap.
      *   The "Outcome" is subjective (survey), not objective (revenue).

  9.  **Refining the "Reflexivity" Mechanism:**

      *   The prompt specifically wants the *price* to affect the *outcome* via the *agents*.
      *   If the Market says Policy B will score 9/10.
      *   Policy B is chosen.
      *   The students (who are the participants in Policy B) see that the expectation is 9/10.
      *   If they think 9/10 is too high, they might rate lower (anchoring).
      *   If the Implementer sees 9/10, they might panic.
      *   *Key adjustment:* The **Implementer** needs to be the one whose effort determines the score. Let's make the Implementer the "Discussion Leader" for the Workshop. If the market predicts high success, the Leader might coast. If low, they might try to save face.
      *   *Wait, the prompt asks for the loop to be visible.*
      *   I need the Implementer to report their effort level *after* seeing the price.
      *   I need to ensure the "Sabotage" incentive is present but distinct. Some students should be able to profit if the score is *low*.
      *   *Payoff Structure:*
          *   Long Position: Profit if Score is High.
          *   Short Position: Profit if Score is Low.
          *   Implementer: Gets bonus if Score > Market Prediction (beating the market). This aligns them against the reflexivity trap initially, but creates pressure.
          *   *Actually, to show the problem:* The Implementer should just be a participant whose effort is costly.
          *   Let's stick to the prompt's suspicion: "The price is a fixed point of a loop."
          *   I will assign the Implementer a private cost of effort. They choose effort after seeing the price. The Score = Effort + Noise.
          *   If the Price is High, the Implementer knows the bar is high. If their payoff is based on the Score, they work hard.
          *   *Wait, the problem in Futarchy is that the Price affects the Probability of the Outcome.*
          *   If the market says "Policy A has 80% chance of success," and Policy A is chosen, does that make success more likely? Only if people work harder because they believe it will succeed.
          *   *Better angle:* The **Market Price determines the Policy**. The Policy's success depends on **Cooperation**.
          *   If the Market strongly favors Policy A, supporters of Policy B might feel alienated and cooperate less during Policy A.
          *   *Let's go with the Implementer angle.* It's cleaner for a classroom.
          *   Role: "Session Chair." They run the 20 mins.
          *   Payoff: Chair gets points based on the Rating.
          *   Twist: Chair sees the Market Price *before* deciding how much prep time to spend (simulated by choosing a "Difficulty Level" for the activity).
          *   If Price is High, Chair might choose High Difficulty (expecting high score). If Price is Low, Chair chooses Low Difficulty.
          *   The Rating depends on Difficulty matching Expectations.
          *   *Actually, keep it simpler.* The Chair chooses Effort (1-5). Costly. Score = Effort + Random.
          *   If the Market Price is high, the Chair knows everyone expects a lot.
          *   Okay, I will design the "Implementer" role to explicitly record their psychological reaction to the price.

  10. **Finalizing the Mechanics:**

      *   **Metric:** "Perceived Value" (1-10).
      *   **Assets:** "Value-A" and "Value-B".
      *   **Trading:** 3 Rounds of Call Market. Instructor adjusts price based on net demand.
      *   **Selection:** Higher Price wins.
      *   **Reflexivity:** The "Facilitator" (1 student) sees the winning price. They choose the specific topic/difficulty of the 20-min session. Their choice influences the final rating.
      *   **Sabotage:** Students can "Short" the asset (sell what they don't have, buy back later? No, too complex).
      *   *Simpler Sabotage:* Students are assigned "Portfolios." Some are Long (want high score), some are Short (want low score).
      *   *Assignment:* Randomly deal cards. 12 Long, 5 Short, 1 Facilitator.
      *   **Payoff:** Points towards participation grade.

  11. **Review against Constraints:**
      *   75 mins? Tight but doable if trading is simplified.
      *   Paper/Pencil? Yes, order slips.
      *   Mixed Prep? Keep math minimal (Price = Expected Score).
      *   Debrief? Map moments to theory.

  12. **Self-Correction on "Reflexivity":**
      *   The prompt says: "the market is asked for a number that is supposed to be read causally, but the number is also public and is read by the very people whose subsequent effort and cooperation determine the outcome."
      *   To make this visible: The **entire class** are the "people whose effort determines the outcome."
      *   If the market says "Workshop will score 9/10," students might feel pressure to rate it highly (social conformity) OR feel the bar is too high and rate harshly.
      *   I need to capture this in the exit slip. "Did the market prediction influence your rating?"
      *   Okay, I will add a question to the exit slip specifically about this.

  13. **Final Polish:**
      *   Ensure the "Vote on Values" happens first (Futarchy step 1).
      *   Ensure the "Bet on Beliefs" happens second (Futarchy step 2).
      *   Ensure the Debrief distinguishes Sabotage (Short sellers) vs. Reflexivity (Public price affecting behavior) vs. Metric Gaming (Goodhart).

      *(Self-Correction during drafting)*: 18 students trading on paper in 20 minutes is very hard. I need to act as the Market Maker aggressively. I will project the current price and ask for "Hands up to Buy at X" and "Hands up to Sell at X". No, prompt says "paper-and-pencil procedure over anything that depends on students having phones...". It doesn't ban hand-raising, but "paper-and-pencil" suggests written orders. I'll use written order slips collected by TAs/me. It adds friction which is good for the "market inefficiency" feel, but might eat time. I'll limit to 2 trading rounds.

      *Wait, one more thing:* The prompt asks for "the assignment of at least one role whose holder observes the market price before taking an action that affects the outcome."
      *   I will assign one student as the "Moderator" for the chosen activity. They see the price. They choose the specific prompt for the discussion. The prompt difficulty affects the rating.

      *Let's write it.*
answer: |-
  Here is a complete lesson plan designed to run futarchy as an experiential game, adhering to your constraints and targeting your specific pedagogical hypothesis.

  ### 1. The Decision and Welfare Metric

  **The Decision:** How to spend the final 20 minutes of *today's* session.
  *   **Policy A (Lecture):** You deliver a structured summary of the day's key theoretical tensions.
  *   **Policy B (Workshop):** Students break into small groups to solve a specific puzzle, facilitated by a student Moderator.

  **The Welfare Metric:** "Perceived Value Added" (PVA).
  *   At the very end of class (minute 70), every student submits a slip rating the final 20 minutes on a scale of **1 to 10**.
  *   **Metric Calculation:** The average of all 18 slips.
  *   **Why this metric:** It is subjective (allowing for effort/cooperation to influence it), cheap to inflate (Goodhart's Law), and immediate (no waiting for next week).

  ### 2. The Trading Mechanism (Paper-Based Call Market)

  Since continuous double auctions are impossible on paper with novices in this timeframe, you will run a **Walrasian Call Market** where you act as the Market Maker.

  **Assets:**
  *   **Asset A:** Pays out \$1 $\times$ (Final PVA Score) if Policy A is chosen. Pays \$0 if Policy B is chosen.
  *   **Asset B:** Pays out \$1 $\times$ (Final PVA Score) if Policy B is chosen. Pays \$0 if Policy A is chosen.
  *   *Note:* In standard futarchy, markets predict the metric conditional on the policy. Here, the asset pays the metric *only* if that policy is implemented. The market price therefore represents $P(\text{Policy Chosen}) \times E[\text{Metric}|\text{Policy}]$. Since the policy with the higher expected metric *will* be chosen, the prices effectively compete as $E[\text{Metric}|A]$ vs $E[\text{Metric}|B]$.

  **Endowments:**
  *   Each student receives **100 Points** of cash.
  *   Each student receives **10 Units** of Asset A and **10 Units** of Asset B (to enable short-selling/selling without owning).

  **Trading Procedure:**
  1.  **Order Slips:** Students fill out slips: *"Buy/Sell [Asset A/B] Quantity [1-10] at Limit Price [1-10]."*
  2.  **Rounds:** Two trading rounds (5 minutes each).
  3.  **Clearing:** You collect slips, aggregate demand/supply at various price points, and announce a **Clearing Price** for Asset A and Asset B on the projector.
  4.  **Verdict:** The policy corresponding to the asset with the higher clearing price is implemented immediately for the final 20 minutes.

  ### 3. Roles and Payoffs

  **A. The Traders (17 Students)**
  *   **Payoff:** Their final point balance (Cash + Asset Payouts).
  *   **Incentive:** Maximize portfolio value.
  *   **Hidden Assignment (The Sabotage Test):** Before class, randomly designate 4 students as **"Short-Sellers."**
      *   *Public Rule:* Everyone is paid based on portfolio value.
      *   *Private Instruction (on a card):* "Your portfolio is hedged. You actually earn bonus points if the Final PVA Score is **below 5**. Trade normally, but your personal interest is a low score."
      *   *Purpose:* This creates the sabotage incentive without alerting the room.

  **B. The Moderator (1 Student)**
  *   **Selection:** Chosen randomly after the market closes, *or* pre-assigned but revealed only after the verdict.
  *   **Information:** They are shown the **Clearing Price** of the winning asset before the 20-minute activity begins.
  *   **Action:** They choose the **Difficulty Level** of the Workshop (if B wins) or the **Q&A Topic** (if A wins).
      *   *If Workshop:* Choose between "Easy Icebreaker" (Low effort, reliable 6/10 score) or "Hard Puzzle" (High effort, variable 2-10/10 score).
  *   **Payoff:** Fixed participation points + 10 bonus points if the Final PVA Score $\ge$ The Market Clearing Price.
  *   **Purpose:** This creates the **Reflexivity Loop**. The Moderator sees the market's expectation (the Price). Their effort choice (Difficulty) determines the Outcome. If the Price is high, they might fear failing to meet it (defeatism) or coast believing the market expects success (moral hazard).

  ### 4. Minute-by-Minute Timeline

  *   **00-05: Introduction & Metric Vote.**
      *   Explain the goal: "We are going to decide the last 20 mins of class using a new mechanism."
      *   **Vote on Values:** Show of hands: "Who prefers a higher PVA score?" (Unanimous). "Who prefers a fair process?" (Unanimous). Establish the Metric (Average PVA) is the goal.
  *   **05-10: Market Instructions.**
      *   Distribute Endowment Sheets and Order Slips.
      *   Explain Asset payouts clearly.
      *   Hand out the 4 "Short-Seller" cards discreetly.
  *   **10-20: Trading Round 1.**
      *   Students write orders. Collect them.
      *   You calculate excess demand/supply quickly (have a TA or spreadsheet ready if possible, or estimate).
      *   Announce Round 1 Prices.
  *   **20-30: Trading Round 2.**
      *   Students see Round 1 prices, adjust orders.
      *   Collect and Clear.
      *   **Announce Final Prices & Winning Policy.**
  *   **30-35: The Reflexivity Trigger.**
      *   Reveal the **Moderator**.
      *   Show the Moderator the Winning Price privately (or write it on a card).
      *   Moderator chooses the Difficulty/Topic based on that price.
  *   **35-55: Policy Implementation.**
      *   Run the Lecture or Workshop for 20 minutes.
  *   **55-65: Scoring.**
      *   Students fill out the PVA slip (1-10).
      *   **Crucial:** Add one checkbox to the slip: *"Did the market price influence your rating? (Yes/No)"*
      *   Calculate Average.
  *   **65-75: Payout & Debrief.**
      *   Announce the Score.
      *   Calculate hypothetical winnings.
      *   **The Reveal:** Define "Futarchy." Map the experience to the theory.

  ### 5. The Debrief: Mapping Moments to Mechanisms

  Do not start with definitions. Start with their experience.

  **Phase 1: Information Aggregation (The "Pull")**
  *   *Ask:* "In Round 1, what did you base your price on? In Round 2, did your price change after seeing the group's price?"
  *   *Point:* This demonstrates the **Hayekian function**. The Round 2 price contained more information than any individual's Round 1 guess. It felt like the "group wisdom" converged.
  *   *Label:* This is the argument *for* futarchy. Markets aggregate dispersed beliefs better than a show of hands.

  **Phase 2: The Sabotage Incentive (The Shallow Problem)**
  *   *Ask:* "How would someone profit if this session went badly?"
  *   *Reveal:* Ask the 4 Short-Sellers to raise their hands. Ask them: "Did you feel tempted to disrupt the workshop or rate harshly?"
  *   *Label:* This is the standard **Principal-Agent / Sabotage objection**. Traders hold positions that conflict with the welfare metric.
  *   *Assessment:* Likely, they didn't sabotage much because social norms are strong in a classroom. Acknowledge this is a problem, but ask if it was the *main* tension they felt.

  **Phase 3: Reflexivity (The Deep Problem)**
  *   *Ask the Moderator:* "You saw the Market Price before choosing the Difficulty. Did a High Price make you work harder, or did it make you anxious? Did a Low Price make you coast?"
  *   *Ask the Class:* "On your rating slip, did you check 'Yes' for market influence? If the market said this would be a 9, did you feel pressured to rate it higher (conformity) or lower (disappointment)?"
  *   *Label:* This is **Reflexivity / The Fixed Point Problem**.
  *   *The Argument:* The market price was supposed to be a *prediction* of the outcome. But because the price was public, it became a *cause* of the outcome. The Moderate's effort and the Class's ratings were conditioned on the Price. Therefore, the Price was not an estimate of an exogenous truth; it was a self-fulfilling (or self-defeating) prophecy. The market destroyed the independence required for the price to be informative.

  **Phase 4: Metric Gaming (Goodhart's Law)**
  *   *Ask:* "If we ran this again, how would you game the 'Perceived Value' metric?"
  *   *Label:* **Goodhart's Law.** When a measure becomes a target, it ceases to be a good measure. Futarchy requires a welfare metric that is immune to manipulation, which rarely exists.

  ### 6. Predictable Failures and Recovery

  **Failure 1: The Market Doesn't Converge.**
  *   *Symptom:* Round 2 prices are wilder than Round 1.
  *   *Cause:* Novices don't understand limit orders.
  *   *Recovery:* In Round 2, switch to "Market Orders Only." Tell them: "Just write how many units you want at whatever price clears." You set the price to balance the book. This ensures a price exists to drive the reflexivity loop.

  **Failure 2: The Moderator Ignores the Price.**
  *   *Symptom:* Moderator says "I didn't look at the card."
  *   *Recovery:* During the debrief, ask them hypothetically: "If the price had been 2/10, would you have chosen the Hard Puzzle?" Use the counterfactual to prove the loop exists even if they resisted it.

  **Failure 3: Everyone Rates 10/10 (Ceiling Effect).**
  *   *Symptom:* No variance in the outcome.
  *   *Cause:* Social politeness.
  *   *Recovery:* This actually helps your debrief on **Metric Gaming**. Point out that the metric failed to distinguish quality, so the market prices were essentially betting on "How nice are my classmates?" rather than "How good is the policy?"

  ### 7. Limitations: What You Must Supply

  This session cannot reproduce two features of real futarchy, which you must address in the closing discussion:

  1.  **Capital Constraints & Liquidity:** In your game, points are trivial. In real futarchy, traders risk real wealth, which sharpens incentives (and sabotage risks). You must explain that the *intensity* of the sabotage problem scales with the stakes, but the *structural* reflexivity problem remains even at zero stakes.
  2.  **Time Separation:** Here, the market and outcome are minutes apart. Real futarchy involves long time horizons (e.g., "GDP in 2025").
      *   *Discussion Point:* "In our game, the Moderator saw the price and acted immediately. In the real world, the 'Moderators' (politicians/CEOs) see the market prices continuously. Does the delay make reflexivity better or worse?" (Answer: It makes it harder to detect, but the causal loop remains).

  ### 8. Materials Checklist

  1.  **Endowment Sheets:** 18 copies (100 Points, 10 Units A, 10 Units B).
  2.  **Order Slips:** ~100 small slips of paper.
  3.  **Short-Seller Cards:** 4 index cards with private instructions.
  4.  **Moderator Card:** 1 index card with the Winning Price written on it (prepare two versions, one for A winning, one for B, or write it in live).
  5.  **Exit Slips:** 18 slips with 1-10 scale + "Did price influence you?" checkbox.
  6.  **Projector Slide:** Showing the Asset Definitions and Current Prices.

  ### Instructor's Note on the "Reflexivity" Hypothesis

  Your hypothesis is that the price becomes a fixed point rather than an estimate. To make this land:
  When the Moderator chooses the Difficulty, explicitly ask them to state *why*. If they say "The market said this would work well, so I thought I could try the hard version," they have confirmed your hypothesis: **The forecast altered the causal structure of the policy.** The market did not predict the effect of the policy; it predicted the effect of the policy *plus* the effect of the market's own prediction. This is the "loop" you want them to feel.
