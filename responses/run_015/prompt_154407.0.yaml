answer: |-
  Based on the verdicts you've described, your tutor is running a **Hybrid View** that distinguishes between **natural/descriptive predicates** and **stipulative/normative predicates**.

  Here is the breakdown of her position, the prediction for Model-X, and the specific case that will expose the engine of her theory.

  ### 1. The Diagnosis: Normative Contextualism
  She is not a pure Supervaluationist (because she accepts sharp boundaries in law) and not a pure Epistemicist (because she denies them in nature). Her view is best described as **Normative Contextualism** (or **Stipulative Epistemicism**).

  *   **Natural Language ('bald', 'heap', 'red'):** She treats these as **Supervaluationist** or **Ontically Vague**. There is no "God's eye" fact of the matter. The world + semantics do not determine a truth value.
  *   **Institutional/Legal ('tall' in contract, 'small business' in statute):** She treats these as **Epistemic**. The authority (legislature, contract signer) performs a "precisification by fiat." Once the rule is laid down, there *is* a sharp fact (e.g., 72.000... inches), even if we can't measure it perfectly. The "vagueness" here is merely epistemic (we can't know the fact), not semantic (the fact doesn't exist).

  **The Feature Doing the Work:** It isn't just "definition." It is **Normative Force**. A definition creates a sharp fact *only if* it is backed by an authority capable of enforcing a decision or allocating rights/resources.

  ### 2. The Verdict on Model-X
  **Prediction:** She will say it is **genuinely indeterminate** (no hidden fact).

  **Reasoning:**
  1.  **Lack of Normative Force:** You specified there is "no legal or institutional precisification." An academic study is descriptive, not prescriptive. It attempts to *measure* a phenomenon, not *constitute* one. In her view, a scientist defining 'cognitive agency' is like a linguist defining 'bald'—they are mapping the concept, not legislating it. Therefore, the boundary remains semantic/ontic, not epistemic.
  2.  **The Conjunction Problem:** 'Cognitive Agency' requires *both* self-modeling *and* error-correction.
      *   *Self-modeling:* She will treat this as a natural predicate (like 'bald'). Midpoint = indeterminate.
      *   *Error-correction:* Even though 'under 200ms' looks numerical, without institutional backing, the term 'real-time' remains a vague natural predicate. The number 200ms is likely an *approximation* of the concept, not a constitutive boundary. Since equality is unspecified, 200ms is a borderline case.
  3.  **Result:** Since at least one necessary condition (self-modeling) is indeterminate, and the context lacks the authority to force a sharp line, the whole proposition "Model-X is an agent" has **no truth value**.

  ### 3. The Splitter Case
  To confirm this diagnosis, you need a case that has a **precise definition** but lacks **legal authority**. This splits "Definition creates facts" from "Authority creates facts."

  **Proposed Case: The Medical Billing Code**
  > "Consider the ICD-11 (international medical classification). It defines 'Severe Hypertension' as blood pressure consistently over 180/120 mmHg. A patient has a reading of exactly 180.0 mmHg. The code is used for insurance and hospital stats, but it's not a statute or a contract. Is there a *fact of the matter* whether this patient has 'Severe Hypertension', or is it indeterminate?"

  **Why this splits the rules:**
  *   **If she says "There IS a fact" (Epistemic):** Then her rule is **"Explicit Operationalization creates sharp boundaries."** It doesn't matter if it's law or science; if humans agree on a number, the vagueness vanishes. (This would mean she might actually say Model-X *is* determinate if the study was rigorous enough).
  *   **If she says "There is NO fact" (Supervaluationist):** Then her rule is **"Only Normative/Legal Authority creates sharp boundaries."** Scientific consensus is just fancy natural language. This confirms the Model-X prediction.
  *   **If she says "It depends on Insurance Payouts":** Then her rule is **"Consequentialism."** Vagueness disappears only when money/rights are on the line.

  ### 4. How to Ask Her
  Don't ask about Model-X directly yet. Ask the **Medical Billing** question first.

  *   **If she says "Indeterminate":** You know Model-X is indeterminate. Her view is that *law* metaphysically alters the world (or our access to it) in a way *science* does not.
  *   **If she says "Determiniate":** You need to pivot. Ask her if the *study* on Model-X counts as an "operational definition" similar to the medical code. If she distinguishes them, ask **what the difference is**. (Is it enforcement? Is it consensus? Is it the stakes?)

  **Summary of her likely position:**
  She is a **Semantic Supervaluationist about Nature** and an **Epistemicist about Law**. The Model-X case falls under Nature/Science, so expect her to deny a hidden fact. The "feature doing the work" is **Institutional Authority**, not precision itself.
