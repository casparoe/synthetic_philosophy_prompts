answer: |-
  Consider a stroke survivor with selective damage to the lateral prefrontal cortex but intact occipital pathways, who navigates a cluttered room without collision yet, when interrupted, insists they were merely guessing and shows no startle response to sudden visual threats. The patient successfully processes visual data to guide motor function (first-order), but lacks the metacognitive capacity to represent that processing as "seeing" (higher-order), creating a dissociation where behavior implies vision but introspection denies it.

  Here is the breakdown. The Higher-Order Representationalist (HOR) argues that consciousness isn't the visual processing itself, but the brain's representation *of* that processing. Since this patient lacks the higher-order state (they report guessing and show no surprise), there is no "mental gaze" upon the visual state, so they are effectively blind zombies navigating by unconscious reflex. The User Illusion theorist, however, views consciousness as the functional dashboard used to control the organism. Since the visual data is successfully integrated into the global control system to avoid obstacles, the "interface" is active and doing its job; the verbal denial is just a buggy output channel, like a broken check-engine light on a running car, so the illusion—and thus the consciousness—is still present.

  The exact feature pulling them apart is **metacognitive access versus functional integration**. The HOR requires the former (knowing that you know), while the User Illusionist requires the latter (using the data to steer). If you strip this feature away—meaning you force the patient's report to align with their behavior (either they both see and say they see, or both don't see and say they don't)—the disagreement collapses, and both theories yield the same verdict. The losing side (likely the HOR, if we trust the behavior) would attack the setup by arguing that successful navigation proves nothing about inner experience, calling it sophisticated blindsight, while the User Illusionist would counter that relying on broken introspection to deny consciousness is like denying a computer is running because the monitor is flickering.
