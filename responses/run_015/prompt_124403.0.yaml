  2. If interactive, determine whether the feedback loop corrupts the category's descriptive accuracy or helps constitute the very kind being tracked.
  3. Next, ask whether clinical practice should revise the category in real time, preserve it unchanged for therapeutic stability, or abandon it altogether.
  4. Finally, determine whether looping applies uniformly across all psychiatric categories or selectively, such as to personality disorders but not to psychotic disorders.
  5. These nodes locate indifferent-kind realism, loop-corruption eliminativism, loop-constitution revisionism, pragmatic stability conservatism, and selective loop-acceptance, though the tree cannot separate pragmatic stability conservatism from selective loop-acceptance. The unoccupied path where looping constitutes kinds yet demands abandonment is diagnosed as unstable because constitution implies value worth preserving.
