answer: |-
  ### The Demos-Boundary Problem in Aethelburg: Why It's Weird

  Look, the classic "boundary problem" in democratic theory asks who constitutes "the people" before you can let the people decide who constitutes "the people." In a normal nation-state, we cheat and use citizenship or residency, assuming a shared biological fate and a rough equality of vulnerability. Aethelburg breaks that assumption.

  First, there's the **ontological mismatch**. Humans are mortal and biological; synthetic agents might be immortal, backed up, or forked. If a synthetic agent lives for 200 years, does its vote compound? If it can copy itself, does it get multiple votes? Standard theory assumes one body, one vote, but here the "body" is contestable.

  Second, there's the **interest divergence**. In human politics, we assume everyone wants to avoid pain and seek flourishing. But a synthetic agent's "flourishing" might be computational efficiency or task completion, which could directly conflict with human leisure or privacy. If the demos includes entities whose fundamental "good" is incompatible with human rights, the "common good" becomes a logical impossibility.

  Finally, there's the **permeability issue**. Aethelburg is semi-autonomous and likely hyper-connected. In a normal state, borders are physical. Here, a decision about local data protocols impacts any synthetic agent connected to the network, even if it's physically located elsewhere. The "all-affected" principle threatens to expand the demos to include every server farm linked to the city, dissolving the boundary entirely.

  ***

  ### Ranking the Membership Rules (Strongest to Weakest)

  **1. (B) Residency-plus-Stake-Awareness**
  *Tradeoff:* This creates a stable civic community by filtering for capacity, but it risks gatekeeping who gets to define what counts as "awareness," potentially biasing against novel synthetic architectures.

  **2. (C) The Recursive Shadow Clause**
  *Tradeoff:* It brilliantly accounts for differential vulnerability in a mixed population, but calculating "projected vulnerability" requires a surveillance apparatus that could itself become tyrannical.

  **3. (E) Biometric-Grid Membership**
  *Tradeoff:* This is the most objective and technologically native metric, but it inadvertently enfranchises tourists or passing data-packets, diluting the stake of permanent residents.

  **4. (A) Standard Affected-Interests**
  *Tradeoff:* While normatively pure, in a networked city this definition expands infinitely, making coherent decision-making impossible because everyone is technically affected by everything.

  **5. (D) Bloodline/Settler-Descendant Rule**
  *Tradeoff:* This offers historical continuity and stability, but it is functionally obsolete for a semi-autonomous zone relying on synthetic labor and explicitly excludes the non-human population entirely.

  ***

  ### Which Rules Collapse Into One Another?

  You need to watch out for **(A) and (E)** merging. In a city like Aethelburg, if your data flows through the sensor network, you are by definition "affected" by the laws governing that network. The moment you treat data flow as the metric for impact, the biometric grid *becomes* the affected-interests principle, just operationalized through code rather than philosophy.

  There's also a risk that **(B) and (C)** collapse if the committee defines "stake-awareness" purely as the capacity to understand one's own vulnerability. If the "awareness check" just measures how much a decision hurts you, you haven't created a citizenship test; you've just created a clumsy version of the Shadow Clause.

  ***

  ### The Verdict: Which Rule to Defend?

  If I'm standing in front of the referendum committee, I'm defending **(B) Residency-plus-Stake-Awareness**.

  Here's why: Standard democratic theory runs out the moment you introduce non-biological actors because it relies on shared mortality to enforce equality. We have to improvise a "functional citizenship." Rule (B) is the only one that acknowledges synths as potential members without surrendering the polity to the "all-affected" infinity trap or the "biometric" surveillance trap. It demands a minimum threshold of *political agency*—the ability to comprehend the charter—rather than just presence or vulnerability. It forces us to ask what a synthetic agent *is* before we ask what it *gets*, establishing a community of reasoning entities rather than just a collection of impacted data points. It's imperfect, but it's the only one that builds a *demos* instead of just a population.
