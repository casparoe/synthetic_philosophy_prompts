prompt: |-
  I'm running a small coaching practice for grad students and freelancers who keep missing deadlines they 'definitely wanted' to make, and I was talking with a friend who teaches philosophy who said I'm probably just reinventing akrasia vs hyperbolic discounting. Maybe, but I still need an actual intake procedre I can run in about 45 minutes that tells me which failure mode we're dealing with, if any, and exactly where I should stop and refer out rather than coach.

  Turn the philosophical distinction between weakness of will and hyperbolic discounting into a reusable decision flowchart — ordered questions, what counts as a sufficient answer to each, hard stops for 'this is values, not psychology' or 'this is neither,' and honest flags for where judgment can't be eliminated. I want you to build in a 'temporal authority check' as a gate: it should test whether the client's planning self was sufficiently informed and not under acute stress when it set the goal, and that result should control whether hyperbolic discounting even applies. Don't treat it as an afterthought; make it a real decision node with conditions.

  Apply it to three cases: (a) a PhD student who had the grant draft finished but missed the portal deadline, (b) a freelancer who delayed invoicing for three months until rent was due, and (c) one case where the procedure returns an answer you'll probably dislike — like labeling a choice as rational discounting when it looks like moral failure. Be explicit about what the procedure flat-out can't settle and where human judgment sneaks in despite the flowchart. End with one line starting 'Bottom line:' summarizing the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested intake procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Grad students and freelancers missing deadlines.
      *   **Core Problem:** Distinguishing between *akrasia* (weakness of will/values conflict) and *hyperbolic discounting* (time-inconsistent preferences) vs. other issues (executive function, mental health, rational choice).
      *   **Deliverable:** A 45-minute intake procedure (decision flowchart) with ordered questions, sufficiency criteria, hard stops (referral points), and a specific "Temporal Authority Check."
      *   **Requirements:**
          *   Make the "Temporal Authority Check" a central gate (was the planning self informed/unstressed?).
          *   Apply to three specific cases (PhD grant, Freelancer invoicing, Uncomfortable rational choice).
          *   Explicitly state limitations (where judgment sneaks in).
          *   End with a specific "Bottom line:" summary.
      *   **Tone:** Practical, philosophical but actionable, honest about limitations.

  2.  **Deconstruct the Concepts:**
      *   *Akrasia:* Acting against one's better judgment. "I know X is best, but I do Y." Often implies a values conflict or integrity issue.
      *   *Hyperbolic Discounting:* Valuing immediate rewards disproportionately higher than future rewards, leading to preference reversal over time. "I want to finish tomorrow more than today, but when tomorrow comes, I want to finish the *next* day more than today."
      *   *Temporal Authority Check:* Did the "Past Self" (who set the goal) have the capacity and information to bind the "Present Self"? If Past Self was panicked or ignorant, Present Self's deviation isn't necessarily a failure; it might be a correction.
      *   *Referral Zones:* ADHD/Executive Dysfunction, Depression/Anxiety, Genuine Values Mismatch (they don't actually want the goal).

  3.  **Drafting the Intake Procedure (The Flowchart):**
      *   *Timebox:* 45 minutes total.
      *   *Structure:*
          1.  Symptom Triage (Rule out clinical/structural first).
          2.  Temporal Authority Check (The Gate).
          3.  Preference Consistency Test (Hyperbolic vs. Akrasia).
          4.  Decision/Referral.
      *   *The Gate:* Needs to be robust. If the goal was set under duress or ignorance, hyperbolic discounting doesn't apply because the preference wasn't stable to begin with.
      *   *Hard Stops:* Suicide risk, severe depression, undiagnosed ADHD, values misalignment (they hate the work).

  4.  **Developing the Questions & Criteria:**
      *   *Q1 (Safety/Clinical):* Are you functioning? (Sleep, eating, hopelessness). -> Referral if no.
      *   *Q2 (Temporal Authority):* When you set the deadline, were you rested and informed? -> If No, re-negotiate goal (not coaching failure). If Yes, proceed.
      *   *Q3 (Preference Reversal):* Did you intend to do it *at the time*? Do you still value the outcome? -> Distinguishes Hyperbolic (still value, just pushed off) vs. Values (don't value anymore).
      *   *Q4 (Barrier Identification):* Is it friction or fear? -> Akrasia often involves fear/shame; Hyperbolic involves distraction/comfort.

  5.  **Refining the "Temporal Authority Check":**
      *   This needs to be the pivot point.
      *   *Condition A:* Information asymmetry (Did they know how long it takes?).
      *   *Condition B:* Physiological state (Were they in fight/flight?).
      *   *If Failed:* The goal is illegitimate. Coaching = Goal Revision.
      *   *If Passed:* The goal is binding. Coaching = Behavior Change.

  6.  **Applying to Cases:**
      *   *(a) PhD Student:* Missed portal deadline despite draft being done.
          *   Temporal Authority: Likely high (knew deadline, had draft).
          *   Failure Mode: Akrasia/Executive glitch. High shame.
      *   *(b) Freelancer:* Invoicing delayed until rent due.
          *   Temporal Authority: Low? Or Hyperbolic?
          *   Analysis: Pain of rent (immediate) overcame pain of admin (delayed). Classic Hyperbolic.
      *   *(c) The Uncomfortable Case:* Someone chooses leisure over work rationally.
          *   Scenario: A freelancer turns down high-paying work to play video games, admits they prefer games, but complain about money.
          *   Procedure Result: Rational Preference (not failure).
          *   Dislike: Coach wants to fix them; Procedure says "They are optimizing for fun, not money."

  7.  **Addressing Limitations (Where Judgment Sneaks In):**
      *   Self-reporting bias (clients lie to themselves).
      *   Coach's bias (wanting to take the client).
      *   The "Values" gray area (Is it depression or just hating the PhD?).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Make it visual/text-based flowchart.*
      *   *Ensure the "Bottom line" constraint is met.*
      *   *Check tone:* Professional, slightly academic but usable.

      *(Self-Correction during drafting)*: I need to make sure I don't confuse Akrasia and Hyperbolic Discounting too much.
      *   *Hyperbolic:* "I want to do it later." (Time inconsistency).
      *   *Akrasia:* "I want to do it now, but I'm doing this instead." (Willpower failure).
      *   *Actually, in common coaching parlance:*
          *   Hyperbolic = Planning fallacy/Procrastination due to time blindness.
          *   Akrasia = Values conflict/Integrity issue.
      *   *Wait, strict philosophical definition:* Akrasia is acting against better judgment. Hyperbolic discounting explains *why* the judgment changes over time.
      *   *Practical distinction for coaching:*
          *   Hyperbolic: "I still want the goal, I just keep pushing the pain." (Fixable with commitment devices).
          *   Akrasia/Values: "I say I want the goal, but my actions show I don't." (Fixable with values alignment or quitting).
          *   *Referral:* "I can't start" (ADHD/Depression).

      *Let's align with the prompt's specific request:* "Weakness of will vs hyperbolic discounting."
      *   Weakness of Will (Akrasia): You judge X is best, you do Y.
      *   Hyperbolic: You judge X is best *at t1*, but at *t2*, Y looks better.
      *   *The Temporal Authority Check* determines if the *t1* judgment was valid.

  9.  **Finalizing the Flowchart Steps:**
      1.  Clinical/Structural Screen (Hard Stop).
      2.  Temporal Authority Check (The Gate).
      3.  Preference Stability Test (Hyperbolic vs. Values).
      4.  Intervention Path.

  10. **Writing the Cases:**
      *   Ensure Case C highlights the "Rational Choice" vs "Moral Failure" tension.

  11. **Review against Constraints:**
      *   45 mins? Yes, structured interview.
      *   Temporal Authority Check as gate? Yes.
      *   Three cases? Yes.
      *   Limitations section? Yes.
      *   Bottom line format? Yes.

  12. **Final Polish:** Check for clarity and punchiness. Ensure the distinction between "referral" and "coaching path" is clear. (Self-correction: Make sure the "Temporal Authority" isn't just "were you stressed" but "were you *acutely* stressed enough to invalidate the planning self".)

  13. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Temporal Authority Intake Protocol (TAIP)
  **Timebox:** 45 Minutes  
  **Purpose:** Distinguish between time-inconsistent preferences (hyperbolic discounting), integrity failures (akrasia), and invalid goals (planning errors) to determine coaching viability.

  ---

  ## Part 1: The Flowchart Procedure

  ### Phase 1: Clinical & Structural Triage (0–10 mins)
  *Goal: Rule out pathologies coaching cannot fix.*

  **Q1: Functionality Baseline**
  *   **Ask:** "In the last two weeks, have you missed basic biological maintenance (sleep, eating, hygiene) or felt hopeless about the future?"
  *   **Sufficient Answer:** "No" or "Occasionally, but back to baseline."
  *   **Hard Stop (Refer Out):** "Yes, consistently." (Flag: Depression/Anxiety).
  *   **Hard Stop (Refer Out):** "I literally cannot start the task even when I sit down to do it." (Flag: Undiagnosed ADHD/Executive Dysfunction).

  **Q2: Structural Reality**
  *   **Ask:** "Is the deadline arbitrary (self-imposed) or external (grant/rent)?"
  *   **Sufficient Answer:** Clear distinction.
  *   **Note:** External deadlines raise the stakes for Hyperbolic Discounting; arbitrary deadlines raise the stakes for Values Mismatch.

  ### Phase 2: The Temporal Authority Check (10–25 mins)
  *Goal: Determine if the 'Planning Self' had the authority to bind the 'Executing Self'. This is the gate for Hyperbolic Discounting.*

  **Q3: Information Symmetry**
  *   **Ask:** "When you set this deadline, did you know exactly how many hours the task required, based on *recent* data?"
  *   **Sufficient Answer:** "Yes, I've done this before" OR "No, I guessed."
  *   **Decision Node:** If **No**, the failure is **Planning Error**, not willpower.
      *   *Action:* Revise goal. Do not coach for discipline.

  **Q4: Physiological Sovereignty**
  *   **Ask:** "What was your stress/load state when you committed to this? Were you in 'fight or flight', intoxicated, or people-pleasing?"
  *   **Sufficient Answer:** "I was calm and autonomous."
  *   **Decision Node:** If **No** (e.g., "I was panicking about money"), the Planning Self was compromised.
      *   *Action:* Invalidate the goal. The missed deadline is a **Correction**, not a failure.
      *   *Why this is the Gate:* Hyperbolic discounting assumes stable preferences that shift over time. If the initial preference was formed under duress, the shift isn't discounting; it's recovery. **If Q3 or Q4 fails, stop. Do not proceed to Phase 3.**

  ### Phase 3: Preference Consistency (25–40 mins)
  *Goal: Distinguish Hyperbolic Discounting from Akrasia (Values Conflict).*
  *Prerequisite: Temporal Authority Established (Q3 & Q4 passed).*

  **Q5: The 'Tomorrow' Test**
  *   **Ask:** "If I could magically move this deadline to next week, would you feel relief or regret?"
  *   **Sufficient Answer:**
      *   "Relief" = **Hyperbolic Discounting**. (You want the reward, but want the pain later).
      *   "Regret/I should do it now" = **Akrasia**. (You judge the current moment as the right time, but act otherwise).
      *   "Relief because I hate this task" = **Values Mismatch**.

  **Q6: The Integrity Gap**
  *   **Ask:** "When you miss the deadline, do you feel shame (I am bad) or frustration (I am inefficient)?"
  *   **Sufficient Answer:**
      *   "Shame/Guilt" = **Akrasia**. (Moral/Identity failure).
      *   "Frustration/Annoyance" = **Hyperbolic Discounting**. (Mechanical failure).

  ### Phase 4: Decision & Referral (40–45 mins)
  *   **Hyperbolic Discounting:** Coach on commitment devices, friction reduction, and immediate rewards.
  *   **Akrasia:** Coach on identity, values alignment, and self-trust.
  *   **Planning Error/Invalid Goal:** Coach on goal negotiation and scope reduction.
  *   **Hard Stop (Refer Out):** If Q5 reveals the client *does not actually want the outcome* but feels they *should* (e.g., "I don't want to be a PhD, but my parents do"), refer to therapy/career counseling. This is external imposition, not procrastination.

  ---

  ## Part 2: Case Applications

  ### Case A: The PhD Student (Grant Draft Finished, Missed Portal)
  *   **Phase 1:** Functioning normally. External deadline.
  *   **Phase 2 (Temporal Authority):**
      *   *Info:* Knew the deadline for months. (Pass)
      *   *State:* Was stressed but functional during planning. (Pass)
      *   *Gate Result:* Planning Self had authority.
  *   **Phase 3 (Consistency):**
      *   *Tomorrow Test:* Would feel regret if moved. Wants the grant *now*.
      *   *Integrity:* Feels deep shame. "I sabotaged myself."
  *   **Diagnosis:** **Akrasia.**
  *   **Coaching Path:** This isn't about time management; the work was done. This is a self-sabotage/integrity issue. Focus on the fear of success or judgment that triggered the freeze at the final hour.

  ### Case B: The Freelancer (Invoicing Delayed Until Rent Due)
  *   **Phase 1:** Functioning. External deadline (rent).
  *   **Phase 2 (Temporal Authority):**
      *   *Info:* Knew invoicing takes 30 mins. (Pass)
      *   *State:* Was calm when agreeing to terms. (Pass)
      *   *Gate Result:* Planning Self had authority.
  *   **Phase 3 (Consistency):**
      *   *Tomorrow Test:* "If I could invoice next week, I'd be happy." (Relief).
      *   *Integrity:* "I'm so stupid, why can't I just click send?" (Frustration, not deep moral shame).
  *   **Diagnosis:** **Hyperbolic Discounting.**
  *   **Coaching Path:** The pain of admin is immediate; the pain of no rent is distant. Needs commitment devices (auto-invoice software) or bundling invoicing with a high-dopamine activity.

  ### Case C: The "Rational" Quitter (Uncomfortable Outcome)
  *   **Scenario:** A grad student misses writing deadlines consistently. They admit they prefer reading philosophy to writing it. They say, "I know I should write to graduate, but I'd rather read."
  *   **Phase 1:** Functioning.
  *   **Phase 2 (Temporal Authority):**
      *   *Info:* Knew writing was required. (Pass)
      *   *State:* Was excited about the PhD 3 years ago. (Pass)
      *   *Gate Result:* Planning Self had authority.
  *   **Phase 3 (Consistency):**
      *   *Tomorrow Test:* "If I could never write again, I'd be relieved."
      *   *Integrity:* No shame. Just acceptance. "I like reading more."
  *   **Diagnosis:** **Rational Preference Shift (Not a failure mode).**
  *   **The Dislike:** The procedure labels this **not** as akrasia or discounting, but as a **Values Mismatch**. The client is not "failing" to write; they are successfully prioritizing reading.
  *   **Coaching Path:** **Refer Out.** Coaching cannot fix this because there is no problem to solve other than "You want a different life." Pushing them to write is unethical coaching; it is enforcing a dead preference.

  ---

  ## Part 3: Limitations & Judgment Flags

  **1. The Self-Report Lie**
  The flowchart relies on the client's ability to accurately report their stress levels (Q4) and preferences (Q5). Clients often lie to themselves to avoid the shame of admitting they don't want the goal (Case C).
  *   *Judgment Sneak:* The coach must read micro-expressions during Q5. If they say "Regret" but their body slumps in relief, the coach must override the flowchart and probe Values Mismatch.

  **2. The "Acute Stress" Definition**
  Q4 asks about "fight or flight." There is no biomarker in a 45-minute Zoom call.
  *   *Judgment Sneak:* The coach must decide if "busy" counts as "acute stress." If you are too lenient, every planning error becomes a "Temporal Authority Failure," letting the client off the hook. If too strict, you gaslight the client.

  **3. The Moral/Rational Blur**
  In Case C, the procedure identifies a rational choice that looks like moral failure to the client's family/department.
  *   *Limitation:* The procedure cannot settle whether the client *should* change their values. It can only identify that their values have changed. It forces the coach to confront whether they are serving the client's current self or their past self's contract.

  Bottom line: This protocol treats missed deadlines as data points about authority and preference rather than moral failings, forcing referrals when the goal itself is the problem.
