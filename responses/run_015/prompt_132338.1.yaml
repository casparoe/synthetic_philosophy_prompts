answer: |-
  This is a really sharp distinction you've made, and honestly, "moral overhang" is a killer concept for a novel. It takes a static philosophical idea and turns it into a dynamic plot engine. Let's break down how your idea stacks up against the standard textbook definition, specifically looking at who holds the bag for all that extra goodness.

  **The Standard View: Supererogation as a Personal Bonus**

  When philosophers like J.O. Urmson talk about supererogation, they're mostly trying to solve a logic puzzle. They want to carve out a space for saints and heroes without making the rest of us look like sinners for just living normal lives. In this framework, duty is the baseline. If you meet the baseline, you're good. If you go way beyond it—like jumping on a grenade—you're amazing, but you weren't *required* to do it.

  In this model, the "surplus" good belongs entirely to the hero. It's a closed transaction. The hero pays a high cost, and in exchange, they get moral credit, glory, or sainthood. The rest of us watch and think, "Wow, they are better than me."

  The problem with this model for a story is that it lets the audience off the hook. If the hero's sacrifice is purely supererogatory, it's a gift we didn't ask for and don't have to pay back. We can admire it, feel a little ashamed by comparison, and then move on. The moral ledger balances out with the hero in the positive and everyone else at zero.

  **Your View: Moral Overhang as a Systemic Debt**

  Your concept of "moral overhang" changes the physics of the situation. Instead of a closed transaction, it's an open circuit. When the hero makes that excessive sacrifice, the energy doesn't stop with them. It arcs out.

  In this model, the surplus doesn't belong to the hero; it belongs to the system. By paying *too much*, the hero creates an imbalance. Nature abhors a vacuum, and apparently, morality abhors a surplus. If one person pays a debt that belonged to everyone, suddenly everyone is in the red. The "overhang" is the shadow cast by that excess light.

  **Who Owns the Surplus?**

  This is where your model wins hands down for narrative tension.

  In the Urmson-style framework, the hero owns the surplus. They are the moral millionaire. They die rich in virtue.

  In the moral overhang framework, the *survivors* own the surplus. The hero has effectively forced a transaction on everyone else. By sacrificing themselves unnecessarily (or excessively), they have implicitly said, "I paid for this, so now you owe me." But since they're dead, they can't collect. So the debt floats out there, attaching itself to the other characters and, crucially, the readers. The surplus isn't credit; it's liability.

  **Explaining the Audience Guilt**

  You asked which model better explains why an audience feels burdened or guilty after a hero's unnecessary death. It is definitely **moral overhang**.

  Standard supererogation explains *admiration*. It explains why we build statues. It doesn't explain why we feel sick in our stomachs. If a soldier jumps on a grenade to save their squad, and we view it through standard supererogation, we feel gratitude and respect. The squad lives, the soldier is a hero, the math works.

  But if you view it through moral overhang, the math is broken. The soldier paid for five lives with one. That's a surplus of four lives. Now those four survivors (and the readers watching them) have to walk around carrying the weight of that unpaid balance. Every breath they take is funded by that excess sacrifice. That creates a specific kind of guilt—not just "I'm not as good as them," but "I am complicit in their waste."

  This fits the feeling of burden much better because it turns the sacrifice into a form of aggression. It suggests the hero didn't just save the world; they mortgaged it. The audience feels guilty because the overhang implies we are now debtors in a system we didn't agree to. We didn't ask for the grenade jump. We didn't ask to be saved at that cost. But now that it's done, we have to live in the world where that price was paid.

  **How to Use This in the Draft**

  If you want to lean into moral overhang, you have to make sure the other characters feel the weight of that debt. Don't let them just be grateful. Gratitude is too clean. Make them feel *obligated*.

  *   **The Survivors:** They shouldn't just mourn; they should feel like they're working off a loan. Maybe they take risks they shouldn't take because they feel they have to "match" the hero's input.
  *   **The Readers:** You create this feeling by denying the hero the glory. If the hero dies and everyone calls them a saint, that's standard supererogation. But if the hero dies and the survivors look at the body and feel *trapped* by it, that's overhang. The narrative should suggest that the sacrifice was too big, too messy, and now the world has to clean up the excess.

  **The Verdict**

  Stick with your invention. Standard supererogation is too neat for a gritty novel. It resolves conflict. Moral overhang generates conflict. It explains why a "good deed" can feel like a curse, and it explains why an audience walks away from a book feeling heavy instead of inspired. In your book, the hero doesn't just die for the world; they leave the world with a bill they can't pay. That's a much more interesting place to be.
