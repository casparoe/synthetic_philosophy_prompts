          *   *Desideratum:* Distinguish between a language whose *meaning* is private (PLA target) and a code whose *tokening* is private but meaning is grounded publicly/functionally.
          *   *Theories:* Causal-Info (code is fine, grounding is external), Conceptual-Role (code is role within system).

      *   *Dimension 3: Artificial/Isolated Systems.*
