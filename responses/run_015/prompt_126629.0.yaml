answer: |-
  ### Desiderata for Theories of Mental Content vis-à-vis the Private Language Argument

  To count as having addressed Wittgenstein's Private Language Argument (PLA) rather than sidestepping it, a theory of mental content must satisfy the following five structural requirements. These criteria distinguish between dissolving the problem via reduction, solving it via metaphysical revision, or rejecting its premises.

  ---

  #### 1. The Authority-Error Distinction
  **Requirement:** The theory must explain how a subject retains epistemic privilege regarding the *occurrence* of their mental states while admitting the possibility of error regarding the *content* or *classification* of those states, without requiring an *actual* external observer to validate the state in real-time.

  *   **Motivation:** The PLA suggests that if meaning is determined solely by internal ostension, the distinction between "thinking one is following a rule" and "actually following a rule" collapses. However, standard behaviorism solves this by making the external observer constitutive, which contradicts the intuition that one can be alone and thinking.
  *   **Status:** **Non-Negotiable.** Any theory that denies the possibility of systematic self-error regarding content ignores the normative core of the PLA; any theory that denies first-person authority regarding occurrence ignores basic phenomenology.
  *   **Causal-Informational (CI) Performance:** **High.** CI theories ground content in causal covariance with external properties. A subject can be wrong about what they represent (misrepresentation is possible) while having privileged access to the vehicle (the neural state) itself. No actual observer is needed, only a causal link.
  *   **Conceptual-Role (CR) Performance:** **Mixed.** CR theories ground content in inferential roles within the system. Self-error is possible if the system misapplies its own inference rules. However, explaining why the subject has *privileged* access to these roles without invoking an inner homunculus is difficult.

  #### 2. The Language-Code Distinction
  **Requirement:** The theory must provide a principled criterion distinguishing a "private language" (which the PLA claims is impossible) from a "private code" (an internal representational vehicle inaccessible to others but semantically grounded).

  *   **Motivation:** Neuroscience and AI posit internal states (e.g., activation patterns) that no other agent can directly observe. If the PLA bans all privacy, it contradicts computational models of mind. If it allows all privacy, it risks vacuity.
  *   **Status:** **Camp-Specific.** Depends on whether one interprets the PLA as banning private *semantics* (Non-Negotiable for Anti-Individualists) or private *syntax* (Acceptable for Individualists).
  *   **Causal-Informational (CI) Performance:** **High.** Distinguishes clearly: The *code* (vehicle) is private/physical; the *language* (content) is public/relational (determined by causal history with the environment).
  *   **Conceptual-Role (CR) Performance:** **Low.** If content is determined by the role within the system, and the system is isolated, the distinction between a private code and a private language blurs. CR must appeal to "idealized" roles to maintain the distinction.

  #### 3. The Isolation Constraint (The Robinson Crusoe Test)
  **Requirement:** The theory must explicitly state whether a system isolated from birth (or a singleton AI) can possess genuine intentional content. If the theory says "no," it must identify the specific mechanism (e.g., lack of correction, lack of shared norms) that fails. If "yes," it must explain how normative constraints arise without social interaction.

  *   **Motivation:** The PLA is often read as requiring a community to sustain norms. If content requires a community, isolated minds are impossible. If content does not require a community, the PLA's force against individualism is weakened.
  *   **Status:** **Camp-Specific.** Anti-Individualists treat sociality as constitutive (Non-Negotiable for them); Individualists treat it as contingent.
  *   **Causal-Informational (CI) Performance:** **Pass (Yes).** An isolated system can have content if it stands in appropriate causal relations to its environment (e.g., a robot sensing terrain), even without language users.
  *   **Conceptual-Role (CR) Performance:** **Fail/Conditional.** Pure CR often implies that without a social practice to fix the rules of inference, the isolated system's "rules" are merely dispositions, lacking normativity.

  #### 4. The Normativity-Epistemology Split
  **Requirement:** The theory must separate the conditions for *constituting* meaning (metaphysics/normativity) from the conditions for *verifying* meaning (epistemology). It must identify which part of the PLA targets the possibility of a standard of correctness versus the possibility of knowing one has met that standard.

  *   **Motivation:** A common sidestep is to treat the PLA as merely an epistemic problem (we can't *know* if we are right) rather than a metaphysical one (there *is no fact* about being right). An adequate theory must specify which fact it is preserving.
  *   **Status:** **Non-Negotiable.** Confusing these two renders the theory unable to address the "rule-following paradox."
  *   **Causal-Informational (CI) Performance:** **Partial.** CI handles the metaphysics (content is fixed by causation) but struggles with normativity. Causal laws describe what *does* happen, not what *should* happen. It risks reducing normativity to statistical normality.
  *   **Conceptual-Role (CR) Performance:** **High.** CR explicitly builds normativity into the theory (inferential commitments). However, it risks collapsing metaphysics into epistemology (meaning is just what we take to be correct).

  #### 5. The Reductionist Commitment
  **Requirement:** The theory must declare whether resolving the PLA requires reducing mental content to non-semantic terms (dispositions, functions, causal relations) or whether it posits content as a primitive normative fact. It must assess whether this reduction preserves intentionality or eliminates it.

  *   **Motivation:** The PLA suggests that no internal fact (image, feeling, disposition) can fix meaning. The only way out seems to be either accepting skepticism (no meaning) or naturalizing meaning (reducing it to something non-mental).
  *   **Status:** **Non-Negotiable.** A theory cannot remain agnostic on whether it is naturalizing or eliminating normativity.
  *   **Causal-Informational (CI) Performance:** **Explicit Reduction.** Reduces content to causal covariance. Success depends on whether one accepts causation as sufficient for "aboutness."
  *   **Conceptual-Role (CR) Performance:** **Implicit Reduction.** Reduces content to functional role. Success depends on whether functional roles can carry genuine normative weight without a user.

  ---

  ### Structural Tensions and Joint Unsatisfiability

  Certain pairs of desiderata create logical tension. A theory satisfying one often strains or breaks the other.

  **Tension A: First-Person Authority vs. Normative Constraint (Desiderata 1 & 4)**
  *   **Conflict:** If meaning is constituted by a standard independent of the subject's judgment (to satisfy Normativity), the subject must be capable of failing to meet that standard without realizing it. This undermines strong First-Person Authority regarding content.
  *   **Joint Satisfiability:** **Difficult.** To satisfy both, a theory must posit that the subject has privileged access to the *vehicle* of thought but not the *conditions of satisfaction* for that vehicle. CI achieves this easily; CR struggles because the role is internal to the subject.

  **Tension B: Isolation Constraint vs. Normativity (Desiderata 3 & 4)**
  *   **Conflict:** If normative standards require the possibility of correction (PLA), and correction requires a distinction between "seeming right" and "being right," an isolated system lacks the mechanism to establish this distinction non-circularly.
  *   **Joint Satisfiability:** **Impossible for strict Anti-Individualism.** If one holds that norms are essentially social (a common reading of PLA), an isolated system cannot have content. If one holds isolated systems have content, one must argue that norms can be generated individually (e.g., via teleology or idealized dispositions).

  **Tension C: Private Code vs. Reductionism (Desiderata 2 & 5)**
  *   **Conflict:** If content is reduced to dispositions or causal functions (Reductionism), the "privacy" of an internal code becomes irrelevant to its semantic status. However, if the code is truly private (inaccessible even in principle), it is difficult to specify its functional role non-circularly.
  *   **Joint Satisfiability:** **Contingent.** CI theories satisfy this by making the code physical (private) and the content relational (public). CR theories risk making the code semantic itself, which invites the PLA regress.

  ---

  ### Evaluation Summary: Causal-Informational vs. Conceptual-Role

  | Desideratum | Causal-Informational (CI) | Conceptual-Role (CR) |
  | :--- | :--- | :--- |
  | **1. Authority/Error** | **Success.** Distinguishes vehicle (private) from content (external). Error is mis-covariance. | **Strained.** Access to roles is internal, making self-error regarding role-application hard to motivate. |
  | **2. Language/Code** | **Success.** Clear split between physical vehicle and semantic value. | **Weak.** Vehicle and role are tightly coupled; privacy of vehicle threatens privacy of meaning. |
  | **3. Isolation** | **Success.** Lone systems can track environmental features. | **Failure.** Lone systems lack the normative friction of social practice (on strict readings). |
  | **4. Normativity** | **Weak.** Struggles to derive "ought" from causal "is." | **Success.** Normativity is built into inferential commitment. |
  | **5. Reduction** | **Explicit.** Naturalizes content. Risk: Eliminates genuine normativity. | **Implicit.** Functionalizes content. Risk: Circularity or regress. |

  **Conclusion on Adequacy:**
  A theory counts as having **addressed** the PLA if it explicitly chooses which side of these tensions to prioritize and provides a mechanism for that choice.
  *   A **CI theory** addresses the PLA by rejecting the premise that normativity requires sociality, replacing it with causal history. It solves the Private Language problem by making language public (content) even if the medium is private.
  *   A **CR theory** addresses the PLA by accepting the normative constraint but locating the "community" in the idealized structure of the system itself (or actual social practice). It solves the Private Language problem by making meaning inherently relational.

  A theory **sidesteps** the PLA if it claims to offer a naturalistic account of content without explaining how the "seeming right/being right" distinction is instantiated in the proposed mechanism, or if it assumes first-person authority is infallible while simultaneously claiming content is normative.
