          *   *Constraint:* Cannot require an *actual* observer (behaviorism), only the *possibility* of correction.
          *   *Theories:* Causal-Info (good on error, bad on authority?), Conceptual-Role (good on authority, maybe bad on error?).

      *   *Dimension 2: Private Language vs. Private Code.*
