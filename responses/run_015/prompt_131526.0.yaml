answer: |-
  ### Dropped Considerations

  Before we get to the procedure, here is what I considered including and explicitly left out. This is to save you time and prevent "philosophical scope creep" during your meetings.

  *   **Average vs. Total Utilitarianism:** I am not asking you to solve the debate between maximizing *total* welfare vs. *average* welfare. For a health foundation, Total Utilitarianism (with a "critical level" caveat) is the standard operational mode. Average utilitarianism implies you shouldn't help very sick people if it lowers the average health of the population. That is non-starter for a health fund. **Dropped.**
  *   **The "Repugnant Conclusion" Deep Dive:** You know the summary. I am not asking you to solve Parfit's puzzle. I am giving you a "Critical Level" threshold (see below) that acts as a firewall against it without requiring metaphysical heavy lifting. **Dropped.**
  *   **Specific Theories of Well-being:** Are we measuring happiness, preference satisfaction, or objective goods? You are already using proxies (DALYs, consumption). I will treat your proxies as the "currency" and focus on *who* gets the currency, not the precise definition of the currency. **Dropped.**
  *   **Long-term Future Effects:** You noted that everything eventually becomes "swap-one" if you trace causality far enough. I am not asking you to model the 7th generation. I am giving you a hard "Causal Horizon" rule to cut this off pragmatically. **Dropped.**
  *   **Rights-Based Deontology:** While important legally, your output is a *ranked list* based on impact. A rights-based veto is a binary "yes/no," not a scoring metric. I will build a "Rights Veto" step, but it won't drive the ranking. **Dropped.**

  ***

  ### Part 1: The Philosophical Landscape (Settled vs. Live)

  You need to know where you are standing on solid ground and where you are walking on ice.

  **1. The "Non-Identity Problem" (Live Fight)**
  *   **The Issue:** If an intervention changes *who* is born (Swap-One), can we say the resulting child is "benefited"? If their life is worth living, they aren't harmed by being born, but they aren't better off than they would have been (since the alternative was non-existence).
  *   **Consensus:** There is **no consensus** among philosophers.
  *   **Mainstream View in Funding:** Most global health funders implicitly ignore this. They treat a prevented stillbirth as a "life saved" regardless of replacement.
  *   **My Advice:** You cannot ignore it if you care about consistency. You must choose a policy. I will recommend the **"Impersonal Comparative View"** (count the welfare of the child who exists vs. the child who would have existed) because it aligns with cost-effectiveness analysis, but I will flag where this conflicts with intuition.

  **2. The "Person-Affecting Restriction" (Live Fight)**
  *   **The Issue:** Do we only care about making *existing* people better off (Person-Affecting), or do we care about bringing *new* people into existence if their lives are good (Impersonal)?
  *   **Consensus:** **No consensus.**
  *   **Mainstream View:** Effective Altruism and Population Ethics lean Impersonal (Add-One counts). Traditional Human Rights frameworks lean Person-Affecting (only existing rights-bearers count).
  *   **My Advice:** For a development foundation, a **Hybrid View** is most defensible. Existing lives get priority weight; new lives count only if they meet a "Good Life" threshold.

  **3. The Causal Horizon (Stipulation, Not Truth)**
  *   **The Issue:** As you noted, cash transfers change marriage markets, which changes identities downstream.
  *   **Consensus:** **None.** This is purely pragmatic.
  *   **My Advice:** We will use a **"Direct Intentional Chain"** rule. We count identity effects only for the direct beneficiaries and their immediate offspring. We do not trace effects through marriage markets or migration unless that is the *explicit mechanism* of the grant.

  ***

  ### Part 2: The Decision Procedure

  This procedure is designed for a 30-minute review. It forces value choices upfront so you don't argue about them during scoring.

  #### Step 0: The Standing Policy (Do this once, not every round)
  *Before scoring Proposal 1, the Committee must vote on and record the following two policies. Do not relitigate these.*

  **Policy A: The "Add-One" Threshold (Critical Level)**
  *   **The Choice:** Do we count the welfare of children who are only born *because* of our funding?
  *   **Option 1 (Person-Affecting):** No. We only fund benefits to people who would exist anyway. (Safer, but ignores demographic benefits).
  *   **Option 2 (Impersonal with Threshold):** Yes, *but* only if we have strong evidence their quality of life will exceed a "Good Life" threshold (e.g., above extreme poverty).
  *   **Recommendation:** **Option 2.** It prevents the "Repugnant Conclusion" (funding misery just to add numbers) but allows funding fertility/child-survival programs.
  *   **Recorded Policy:** *"We count welfare gains for new lives created by our grants, provided there is >80% confidence the child will survive to age 5 and live above the extreme poverty line."*

  **Policy B: The "Swap-One" Valuation (Identity Weighting)**
  *   **The Choice:** How do we value interventions where one child replaces another (e.g., stillbirth reduction with high replacement rates)?
  *   **Option 1 (Identity-Neutral):** A life is a life. Preventing a stillbirth = +1 Life, regardless of replacement. (Standard DALY approach).
  *   **Option 2 (Identity-Sensitive):** If replacement is near-certain, the net gain in *child welfare* is zero. We only count the reduction in *parental grief/trauma* and the specific health advantage of Child A over Child B.
  *   **Recommendation:** **Option 1 (with a caveat).** Option 2 is philosophically robust but operationally paralyzing and emotionally intolerable for a health board. However, you must acknowledge the "Parental Grief" component is doing the heavy lifting here.
  *   **Recorded Policy:** *"We treat prevented stillbirths as 'Lives Saved' for scoring purposes. However, in cases with >90% replacement rates, we must explicitly score 'Maternal Psychological Welfare' as a primary outcome, not secondary."*

  **Policy C: The Causal Horizon**
  *   **Recorded Policy:** *"We assess identity effects only for the direct beneficiaries and their immediate biological offspring. We do not model downstream identity changes via marriage markets or migration unless that is the primary mechanism of the grant."*

  ---

  #### Step 1: Categorization (5 Minutes)
  *Ask the proposer (or read the memo) to classify the intervention.*

  1.  **Hold-Fixed:** Benefits people who exist regardless of the grant. (e.g., Bed nets for living children).
  2.  **Add-One:** Causes new people to exist who otherwise wouldn't. (e.g., Fertility treatments, Cash transfers that increase fertility).
  3.  **Swap-One:** Changes *who* exists, but not *how many*. (e.g., Stillbirth reduction with replacement, IVF selection).

  *   **Stop Rule:** If a proposal is **Add-One** but fails the **Policy A Threshold** (e.g., high risk of extreme poverty/mortality), **Reject**.
  *   **Stop Rule:** If a proposal violates human rights or consent (e.g., coercive sterilization), **Reject** (Rights Veto).

  #### Step 2: Valuation & Proxies (15 Minutes)
  *Calculate the "Welfare Units." Since you use DALYs/proxies, apply these multipliers.*

  *   **For Hold-Fixed:**
      *   **Metric:** Standard Cost-Effectiveness (e.g., $ per DALY averted).
      *   **Adjustment:** None. This is your baseline.
  *   **For Add-One:**
      *   **Metric:** Estimated Life Years × Quality Weight.
      *   **Adjustment:** Apply a **Discount Factor of 0.5**.
      *   **Reasoning:** *Live Fight Flag.* Creating a happy life is good, but saving an existing life is usually prioritized over creating a new one (Person-Affecting intuition). Discounting ensures you don't rank "making more babies" above "saving dying babies" unless the baby-making is incredibly cost-effective.
  *   **For Swap-One:**
      *   **Metric:** (Welfare of Child A) − (Welfare of Child B) + (Welfare of Parents).
      *   **Adjustment:** If replacement rate is >90%, **Child Welfare Gain = 0**. Only count Parental Welfare (grief averted, economic stability).
      *   **Reasoning:** *Live Fight Flag.* This is the honest philosophical accounting. If the family has another child anyway, the net number of happy children is unchanged. The benefit is to the *parents* and the specific biological continuity.

  #### Step 3: Aggregation & Ranking (10 Minutes)
  *Combine the scores into a single list.*

  1.  **Convert to Common Unit:** Convert all outcomes to "Equivalent DALYs Averted."
      *   *Hold-Fixed:* 1 DALY = 1 Point.
      *   *Add-One:* 1 Life Year = 0.5 Points (per Policy).
      *   *Swap-One:* 1 DALY (Child) = 0 Points (if replaced); 1 DALY (Parent Mental Health) = 1 Point.
  2.  **Cost-Effectiveness Ratio:** Divide Points by Cost.
  3.  **Rank:** Highest ratio to lowest.

  #### Step 4: The "Repugnance Check" (Final 5 Minutes)
  *Look at the top 3 ranked proposals.*

  *   **Question:** "Does funding this feel like we are treating people as numbers?"
  *   **Trigger:** If an **Add-One** proposal ranks #1 because it's cheap to make many poor lives, but a **Hold-Fixed** proposal ranks #5 because it's expensive to save dying children.
  *   **Action:** Invoke **Lexicographic Fallback**.
      *   *Rule:* "We prioritize Hold-Fixed (saving existing lives) over Add-One (creating new lives) unless the Add-One cost-effectiveness is >10x better."
      *   *Why:* This protects the board from the "Repugnant Conclusion" without needing complex math.

  ***

  ### Part 3: Running the Proposals

  Here is how your three live proposals score under this procedure. I have been honest about the "Swap-One" result as requested.

  #### 1. Bed-Net Distribution (Hold-Fixed)
  *   **Category:** Hold-Fixed. Children exist either way; nets keep them alive.
  *   **Valuation:** Standard DALYs averted. High certainty.
  *   **Multiplier:** 1.0x.
  *   **Score:** **High.**
  *   **Philosophical Status:** **Settled.** Everyone agrees saving existing children is good. This is your anchor proposal.
  *   **Board Reaction:** Universal approval.

  #### 2. Unconditional Cash Transfers (Add-One)
  *   **Category:** Add-One. Pilot shows 5–8% fertility bump.
  *   **Valuation:** Welfare of the *additional* 5–8% of children.
  *   **Multiplier:** 0.5x (per Policy A).
  *   **Constraint Check:** Do these children meet the "Good Life" threshold? If the cash lifts them out of extreme poverty, **Yes**. If not, **Reject**.
  *   **Score:** **Moderate.** The discount factor prevents this from overtaking bed nets unless the fertility effect is massive and cheap.
  *   **Philosophical Status:** **Live Fight.** Some board members (Finance/Minister) may argue "More people = more GDP." Others (Paediatrician/Nurse) may argue "We should help existing kids first." The 0.5x discount mediates this.
  *   **Board Reaction:** Debate on whether fertility increases are a "bug" or a "feature." The procedure forces you to count them as a feature *if* lives are good.

  #### 3. Stillbirth Reduction Package (Swap-One)
  *   **Category:** Swap-One. High replacement rate (families have another child if one is stillborn).
  *   **Valuation:**
      *   *Child Welfare:* Net change ≈ 0. (Child A lives vs. Child B lives).
      *   *Parental Welfare:* High. (Avoiding trauma of loss, avoiding economic cost of another pregnancy).
  *   **Multiplier:** Child DALYs = 0x. Parental DALYs = 1.0x.
  *   **Score:** **Low / Near Zero (on child metrics).**
  *   **Philosophical Status:** **Live Fight (The Explosive One).**
      *   *Honest Truth:* On a strict welfare accounting, preventing a stillbirth in a replacement context does not increase the *number* of children living. It changes *which* child lives. The primary benefit is to the **mother** (mental health, physical risk of subsequent pregnancy).
      *   *If you score this as "Saving a Child" (Standard DALY):* You are implicitly rejecting the Swap-One classification and treating it as Hold-Fixed. This is philosophically inconsistent but emotionally standard.
      *   *If you score this honestly (Swap-One):* It ranks below Bed Nets and potentially below Cash Transfers.
  *   **Board Reaction:** **Hostile.** The Paediatrician and Nurse will reject a score that implies "Saving a stillborn baby is worth less than saving a 2-year-old."
  *   **The Knob to Turn:** To make this score higher without lying, you must **increase the weight of Maternal Mental Health.**
      *   *Adjustment:* Assign a high DALY weight to "Prevention of Maternal Trauma/Depression."
      *   *Cost:* This raises the score of *all* maternal mental health grants, potentially shifting funds away from direct child survival (Bed Nets) toward maternal support. You must accept that trade-off.

  ***

  ### Part 4: What This Procedure Can't Do

  I need to be clear about the limitations so you don't get blindsided in the Q&A with the Board.

  1.  **It Cannot Resolve the "Intuition Gap" on Stillbirths:**
      *   Even with the "Maternal Health" knob turned, the procedure admits that *for the child*, the net benefit is neutral in replacement scenarios. If the Board's core mission is "Child Health," this proposal is philosophically weak. If the mission is "Family Health," it is strong. You cannot have it both ways.
  2.  **It Cannot Predict Long-Term Identity Shifts:**
      *   The "Causal Horizon" is a stipulation. We know cash transfers change who marries whom in 15 years. We are choosing to ignore that. This is pragmatic, not true.
  3.  **It Cannot Measure Welfare Precisely:**
      *   We are using DALYs and consumption as proxies for "Good Lives." If your proxies are biased (e.g., they undervalue disability), the ethical calculus inherits that bias.
  4.  **It Requires a "Standing Policy" Vote:**
      *   You cannot run this procedure without first voting on Policy A and B. If you try to decide those *during* the scoring of a specific grant, you will deadlock. You must agree on the rules before you look at the cards.

  ### Final Recommendation for the Committee Chair

  When you present this:
  1.  **Own the "Swap-One" result.** Tell the board: *"Philosophically, if a family replaces a lost child, the net gain in child lives is zero. The gain is to the parents. If we want to fund this, we must admit we are funding Maternal Mental Health, not Child Survival."*
  2.  **Use the "Lexicographic Fallback."** Tell the finance members: *"We will not fund 'more babies' over 'saving babies' unless the efficiency gap is enormous."* This protects the foundation's moral brand.
  3.  **Record the Policies.** Put Policy A and B in the bylaws. It stops the "Surely saving babies beats handing out vitamins" guy from derailing the Add-One discussion every round.

  This procedure gives you a defensible, consistent ranking system that acknowledges the hard ethical truths without paralyzing your operations.
