answer: |-
  This research program proposes a tripartite structure over three years, prioritizing questions based on **conceptual dependency** (upstream coherence) and **analytic tractability** (avoiding empirical quagmires). The framing distinguishes **Surface-Level Correct Motivation (SLCM)** (conscious, explicit appeal to moral reasons) from **Deep Structural Alignment (DSA)** (unconscious, robust coupling to moral outputs across non-moral belief variations).

  The central risk of this framing is that DSA may either collapse into a form of SLCM (if "alignment" requires dispositional conscious endorsement) or collapse into simple reliabilism (if "alignment" ignores the agent's psychology entirely). The following prioritization mitigates this risk by establishing the viability of DSA before refining its mechanics or assessing its payoff.

  ### 1. Year One: The Opacity Condition
  **Question:** *Is conscious access to the moral reason a necessary condition for moral worth, or can DSA generate worth through opaque processes?*

  **Prioritization Defense:**
  This is the most upstream question. If moral worth *essentially* requires the agent to represent the moral reason as their motive (a Kantian or Markovits-style constraint), then DSA is conceptually disqualified as a theory of *worth*, regardless of how robust the structural alignment is. It would at best be a theory of *right action* or *virtue*, but not *moral worth*. Philosophical analysis here is highly tractable via thought experiments (e.g., cases of "unconscious virtue" or "intuitive rescue") without requiring empirical psychology.

  **Upstream Logic:**
  Resolving this determines the domain of the research. If consciousness is required, the program must pivot to how DSA might *support* SLCM rather than replace it. If consciousness is not required, DSA becomes a viable rival to SLCM, enabling Year Two's technical work.

  **Rank-Shifting Result:**
  A compelling argument that "acting for a reason" logically entails *conscious* representation of that reason would demote this question to "settled" (negative) and force a re-ranking of the program toward reconciling DSA as merely instrumental to SLCM. Conversely, a successful defense of "unconscious reasoning" (e.g., via analogy to linguistic competence) would elevate DSA to the primary candidate for moral worth.

  **Impact on Framing & Luck:**
  *   **Moral Luck/Unconscious Motivation:** Resolving this directly dictates whether we attribute worth to agents who "stumble" into the right action via robust unconscious heuristics.
  *   **Collapse Risk:** High. If "Deep Structural Alignment" is analyzed and found to merely mean "a disposition to consciously affirm the reason upon reflection," the DSA/SLCM distinction collapses. The framing survives only if there are cases of stable moral output where conscious access is *impossible* or *absent*, yet worth is retained.

  ### 2. Year Two: The Modal Individuation Problem
  **Question:** *How do we non-circularly individuate the "decision procedure" in DSA to distinguish it from mere lucky reliability?*

  **Prioritization Defense:**
  Assuming Year One validates opaque worth, we must define the "structure" in Deep Structural Alignment. The framing relies on the procedure being "stably coupled to correct moral outputs across counterfactual variations in non-moral beliefs." However, defining the *procedure* without referencing the *output* is notoriously difficult (the "generality problem" in reliabilism). If we define the procedure too broadly, any right action counts as aligned; too narrowly, and no agent qualifies. This is a conceptual/metaphysical problem tractable through modal analysis rather than empirical study of cognitive architecture.

  **Upstream Logic:**
  This is mid-stream. It presupposes DSA is viable (Year One) but must be solved before we can assess whether DSA solves the problem of luck (Year Three). Without a rigorous definition of the "decision procedure," claims about "stability" are vacuous.

  **Rank-Shifting Result:**
  If it is proven that "decision procedures" cannot be individuated independently of their moral success conditions (i.e., we can only identify the procedure *after* seeing the right outcome), the rank of this question shifts to "critical failure." This would render DSA indistinguishable from outcome-based consequentialism, necessitating a programmatic pivot.

  **Impact on Framing & Luck:**
  *   **Moral Luck/Unconscious Motivation:** This question addresses *constitutive* and *situational* luck. If the "procedure" is defined by its success in the actual world, DSA fails to insulate worth from luck.
  *   **Collapse Risk:** Moderate. The framing collapses if "stable coupling across non-moral belief variations" is shown to be extensionally equivalent to "acting correctly in the actual world." Success requires showing that an agent can act rightly in the actual world via SLCM but fail the DSA test (or vice versa) in nearby counterfactuals.

  ### 3. Year Three: The Normative Payoff (Luck Insulation)
  **Question:** *Does the SLCM/DSA distinction successfully insulate moral worth from situational luck better than SLCM alone, or does it merely relocate the luck problem?*

  **Prioritization Defense:**
  This is the downstream synthesis question. It assesses the *utility* of the framing. The motivation for introducing DSA is often to handle cases where conscious reasoning is fragile (e.g., panic, fatigue) yet we want to attribute worth. However, if DSA agents are just as vulnerable to situational luck (e.g., being raised in a society that doesn't trigger their alignment) as SLCM agents, the distinction lacks normative force. This question is tractable as a comparative normative analysis.

  **Upstream Logic:**
  This depends entirely on the answers to Q1 (is opaque worth possible?) and Q2 (can we define the procedure rigorously?). Attempting this before Q2 would result in comparing ill-defined concepts.

  **Rank-Shifting Result:**
  If analysis shows that DSA is *more* vulnerable to luck than SLCM (e.g., because robust dispositions are harder to maintain across worlds than momentary conscious intentions), the prioritization of DSA as a solution to luck collapses. The program would then shift to defending DSA on other grounds (e.g., predictive stability) rather than worth preservation.

  **Impact on Framing & Luck:**
  *   **Moral Luck/Unconscious Motivation:** This is the direct test of the framing's value. If DSA does not mitigate luck, the "Deep Structural" label is misleading.
  *   **Collapse Risk:** Low/Moderate. Even if DSA doesn't solve luck better than SLCM, the distinction might remain valid as a descriptive taxonomy of moral psychology. However, if the distinction fails to track any difference in *praiseworthiness* or *blameworthiness*, the framing collapses into mere psychology, losing its normative significance for moral theory.

  ### Summary of Strategic Logic

  | Order | Question | Goal | Risk if Failed |
  | :--- | :--- | :--- | :--- |
  | **1** | **Opacity Condition** | **Viability** | DSA is disqualified as a theory of *worth*; program reduces to SLCM research. |
  | **2** | **Modal Individuation** | **Coherence** | DSA collapses into reliabilism/consequentialism; "structure" becomes vacuous. |
  | **3** | **Normative Payoff** | **Utility** | Distinction is descriptively accurate but normatively inert; no change to luck debates. |

  This order ensures that the research program does not spend Years Two and Three refining a concept (DSA) that Year One might reveal to be incompatible with the target phenomenon (moral worth). It prioritizes **conceptual clarity** (Q1 & Q2) before **normative application** (Q3), ensuring that any claims about moral luck are built on a robust metaphysical foundation rather than intuitive assertion.
