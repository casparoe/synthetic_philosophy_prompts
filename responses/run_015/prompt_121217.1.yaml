prompt: |-
  I chair the clinical ethics committee at a children's hospital with a level IV neonatal service and a long-term ventilation unit. We are consulted between thirty and forty times a year, and in roughly half of those consultations the question we are really being asked is not what should be done but whether somebody's judgement is a considered value or a bias: a clinician's recommendation not to escalate care for a child with profound cognitive impairment, where the family alleges bias against disability; a team's settled description of a mother as drug-seeking or non-compliant; a parent's refusal of an intervention the team regards as plainly in the child's interest; once or twice a year, one of our own standing practices. We answer within about forty-eight hours, in a note that goes in the chart and that a family can request, addressed to an attending physician who is free to ignore us. The committee is eight people — two physicians, a nurse, a social worker, a chaplain, a lawyer, a parent representative and me — who meet for ninety minutes and none of whom, except me, has studied philosophy. So I need a procedure rather than a theory: something that gives roughly the same answer in different hands, runnable by people who have never thought about this, and honest about the places where it cannot substitute for judgement.

  Here is what I have cobbled together, which I suspect contains fewer distinct tests than it appears to and at least one that is actively misleading. One: the swap test — do we reach the same judgement about a relevantly similar patient who lacks the suspect feature? Two: the stated-reason test — can the holder give a reason that mentions neither the suspect feature nor anything that tracks it, with the obvious regress, since every reason can be re-described as a proxy, so that I also need a stopping rule for proxy-chasing. Three: the reversal test — would the holder accept the judgement from the position of the person it burdens? Four: the counter-evidence test — can the holder say in advance what would count against the judgement, rather than naming it after the fact? Five: endorsement under reflection — does the judgement survive unhurried, informed reconsideration, which I think is close to useless as I have stated it, because it insulates reflective people from the charge and convicts people mainly for being inarticulate. Six: convergence among judges differently situated, especially judges who share the suspect feature. Seven: a role test, since the same psychological state seems to me a permissible preference in a parent and a disqualifying partiality in a clinician or in us. Eight: something I have been calling exposure asymmetry — a judgement is more suspect when the cost of its being wrong falls entirely on people who had no say in it while the holder is insulated from that cost — though I cannot tell whether this is a test for bias or merely a reason to be careful.

  The difficulties I most want handled are these. Every test seems to presuppose some view about which features are genuine reasons, so that calling a preference a bias threatens to mean only that the committee dislikes it; I want the procedure to say explicitly whose normative baseline it uses — the hospital's stated commitments, the duties of the role occupied, the law, the affected parties — and how it avoids being a rubber stamp for our own considered preferences. I want the line between process and content kept straight: an unflattering causal history does not by itself make a judgement wrong, a sound judgement and a distorted one can be the same judgement, a true generalisation can still be a bias when it is applied to an individual in place of evidence about that individual, and a base rate can itself be the residue of earlier unfairness rather than an independent justification. And I want to know what bias even means when the subject is a rule rather than a person, since a policy has no psychology.

  I do not want a survey of theories of bias and I cannot use citations: my committee has no library and I have no way to check them. What I want is a decision procedure, in the order I should run it, with what counts as a sufficient answer at each step, where it terminates in a clear yes or no, and where it has to stop and hand the question to a person because it is a question of values rather than facts. Tell me which of my eight moves to keep, which to drop, and which are secretly the same move; give me the stopping rule for proxies; and tell me how the procedure weights the two errors it can make, calling a genuine value a bias and letting a bias through in the costume of a value, given that it cannot minimise both and that we cannot ask the family to decide that question for us.

  Then run it on three cases, without softening the results — I would rather have one case come out against the party the committee is temperamentally inclined to favour than three tidy ones.

  The first: a four-year-old, ventilator-dependent after a hypoxic brain injury. The ICU team recommends against tracheostomy and chronic ventilation, giving as their reason that she will never recognise us and that this is not a life. The parents allege bias against cognitive disability, and it is a matter of record that the same team recommended exactly this escalation three years ago for a child with comparable physical dependence and intact cognition. The parents' own position rests on a religious conviction about the sanctity of life; the team's rests on a view about quality of life. Both look like preferences.

  The second: parents of a nine-year-old with a progressive neuromuscular disease insist on a gastrostomy tube and full resuscitation against unanimous team advice. The team's private view is that the parents are performing for a large online audience that sends them money, and are partly motivated by guilt over an earlier decision concerning an older sibling. The parents' stated reason is, again, a religious conviction. The committee is temperamentally on the side of families.

  The third: our own unit's rule that home ventilation is offered only where a family can name two trained caregivers and lives within an hour of the hospital. It is justified by readmission statistics — statistics collected under a system in which home-nursing hours were themselves allocated by a distance rule. In practice it excludes single-parent households, families in crowded housing, and rural families.

  Finally, tell me what the procedure cannot do: which of these questions it will answer badly no matter how carefully we run it, and what we should say in the chart when we reach that point.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a clinical ethics committee (CEC) at a children's hospital (Level IV NICU, long-term vent unit).
      *   **Context:** 30-40 consults/year. ~50% involve distinguishing *considered value* from *bias*.
      *   **Committee:** 8 people (MDs, nurse, SW, chaplain, lawyer, parent rep, Chair). Only Chair knows philosophy. Need a *procedure*, not a theory. Runnable by non-philosophers. 90-minute meeting. 48-hour turnaround. Note goes in chart (advisory).
      *   **Current Draft:** 8 "tests" (Swap, Stated-Reason, Reversal, Counter-Evidence, Endorsement, Convergence, Role, Exposure Asymmetry). User suspects redundancy, misleading elements, and lack of normative baseline.
      *   **Specific Difficulties to Address:**
          *   Normative baseline (whose values?).
          *   Process vs. Content (causal history $\neq$ wrongness; true generalization $\neq$ justified application).
          *   Bias in rules/policies (no psychology).
          *   Error weighting (False Positive: calling value bias vs. False Negative: letting bias pass).
          *   Stopping rule for proxy-chasing.
      *   **Deliverables:**
          1.  Refine the 8 tests (keep/drop/merge).
          2.  Define the decision procedure (order, sufficiency, termination).
          3.  Define the normative baseline and error weighting.
          4.  Apply to 3 specific cases (hard results, no softening).
          5.  Define limitations (what the procedure *cannot* do) and chart documentation guidance.
      *   **Constraints:** No citations, no theory survey, practical/actionable.

  2.  **Deconstruct the User's 8 Tests:**
      *   *1. Swap Test:* (Similar patient, different feature). Good for detecting disparate impact/treatment.
      *   *2. Stated-Reason Test:* (Can they give a reason not tracking the feature?). Problematic due to infinite regress (proxy-chasing). Needs a stopping rule.
      *   *3. Reversal Test:* (Would you accept this if you were the burdened party?). Good for empathy/fairness, but subjective.
      *   *4. Counter-Evidence Test:* (What would change your mind?). Good for distinguishing dogma from judgement.
      *   *5. Endorsement under Reflection:* (Unhurried reconsideration). User admits this is weak/useless (insulates articulate, convicts inarticulate). *Drop or merge.*
      *   *6. Convergence:* (Do differently situated judges agree?). Good for intersubjective validity.
      *   *7. Role Test:* (Parent vs. Clinician permissions). Crucial for clinical ethics. *Keep.*
      *   *8. Exposure Asymmetry:* (Cost falls on powerless). This is a structural justice check. *Keep.*

      *   *Redundancies:* Swap and Convergence are similar (looking for consistency across cases/people). Reversal and Exposure Asymmetry both look at power/burden. Stated-Reason and Counter-Evidence both look at rationality.
      *   *Normative Baseline:* The user is right to worry. The procedure needs an anchor. In a hospital, the anchor is *Professional Fiduciary Duty* + *Legal/Policy Constraints* + *Best Interest Standard*.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Distinguish Bias from Value.
      *   *Definition of Bias (Operational):* A factor influencing a decision that is *irrelevant* to the specific role-based obligation or *disproportionately* burdens a protected class without sufficient justification.
      *   *Definition of Value (Operational):* A preference or principle that is *permissible* within the role's scope and *consistent* with institutional commitments.
      *   *Steps:*
          1.  **Anchor Check (Normative Baseline):** Is the decision within the scope of the role's authority? (Role Test).
          2.  **Consistency Check (Swap/Convergence):** Is this applied consistently across similar cases?
          3.  **Rationality Check (Stated-Reason/Counter-Evidence):** Is the reason falsifiable and non-circular? (Here comes the stopping rule).
          4.  **Burden Check (Exposure Asymmetry/Reversal):** Who pays the cost of error?
          5.  **Verdict:** Bias, Value, or Undecidable (Value Conflict).

      *   *Refining the "Stopping Rule" for Proxies:* Stop when the reason appeals to a *goal internal to the practice* (e.g., patient safety, physiological stability) rather than a *social stereotype* or *resource convenience*.
      *   *Error Weighting:* In clinical ethics, the greater harm is usually *unjustified harm to the patient* (False Negative: letting bias through). However, accusing a clinician of bias (False Positive) damages trust. Given the CEC's advisory role, we must prioritize *patient protection* but frame findings as *process failures* rather than *character attacks* to mitigate the False Positive risk. Actually, the prompt asks how the procedure weights them. The procedure should be *conservative about labeling bias* (high bar) but *aggressive about requiring justification*. Wait, if the goal is protecting the vulnerable child/family, we should be more sensitive to False Negatives (bias slipping through). But if we cry wolf too often, the committee loses credibility.
      *   *Decision:* Weight against False Negatives (letting bias pass) because the vulnerable party (child/family) has less recourse than the clinician. However, the *output* must be phrased to minimize unnecessary conflict.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Role & Authority.* (User's Test 7). Is the actor acting within their lane? Parents get wide latitude (Value). Clinicians get narrow latitude (Best Interest/Standard of Care).
      *   *Step 2: The Consistency Scan.* (User's Test 1 & 6). Compare to prior cases. If disparate treatment exists, is there a *medically relevant* difference?
      *   *Step 3: The Falsifiability Check.* (User's Test 2 & 4). Can the reason be proven wrong? If the reason is "It's against our values," that's a Value. If the reason is "They are non-compliant," can we show they *were* compliant?
      *   *Stopping Rule for Proxies:* Stop chasing proxies when the explanation reaches a *clinical endpoint* (e.g., "risk of death") rather than a *behavioral descriptor* (e.g., "difficult family").
      *   *Step 4: The Burden Audit.* (User's Test 8). If the decision is wrong, who suffers? If only the patient, scrutiny increases.
      *   *Step 5: The Verdict.* Bias (Irrelevant factor drove decision), Value (Permissible preference), or Conflict (Two values clashing).

  5.  **Applying to Cases:**
      *   *Case 1 (Vent/Trach vs. Cognitive Disability):*
          *   Role: Clinicians (Fiduciary).
          *   Consistency: Failed (Swap Test). Treated physical dependence differently from cognitive dependence.
          *   Reason: "Not a life." This is a Value Judgement, but clinicians generally aren't allowed to impose *their* quality of life values over parental values unless treatment is futile/harmful.
          *   Burden: Child dies/parents suffer.
          *   *Result:* Likely Bias (ableism) masking as Value. The inconsistency is the smoking gun.
      *   *Case 2 (G-Tube/Resus vs. "Performance"):*
          *   Role: Parents (Surrogates). High latitude.
          *   Consistency: N/A (Parents can be inconsistent).
          *   Reason: Religious conviction.
          *   Team's suspicion: "Performing for money/guilt." This is mind-reading (psychology).
          *   *Result:* Value (Parental prerogative). The team's suspicion is the bias (fundamental attribution error/judgementalism). Unless the treatment is *harmful* (futile), parents decide.
      *   *Case 3 (Policy: 2 caregivers/1 hour):*
          *   Role: Institution/Policy.
          *   Consistency: Statistically excludes specific demographics (Single, Rural, Poor).
          *   Reason: Readmission stats.
          *   Causality: Stats are tainted by previous rules (circular).
          *   Burden: Families excluded from care. Institution insulated.
          *   *Result:* Structural Bias. The policy creates disparate impact without independent justification (the stats are corrupted).

  6.  **Addressing Limitations & Charting:**
      *   *What it can't do:* Resolve fundamental value conflicts (Sanctity of Life vs. Quality of Life). It can't read minds (prove internal bias). It can't fix systemic injustice alone.
      *   *Charting:* Needs to be neutral. "Committee identified inconsistency in application of criteria" rather than "Doctor is ableist." "Policy creates disparate impact requiring review" rather than "Policy is discriminatory."

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the constraint (procedure vs. theory).
      *   **The Triage:** Keep/Drop/Merge the 8 tests.
      *   **The Procedure:** Step-by-step algorithm.
      *   **Normative Baseline & Error Weighting:** Explicitly stated.
      *   **Case Applications:** Hard hits.
      *   **Limitations & Documentation:** What to write when stuck.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer the "Stopping Rule for Proxies"?
      *   *Fix:* Make sure to define the "Clinical Endpoint" rule clearly.
      *   *Critique:* Did I address the "Bias in Rules" question?
      *   *Fix:* Ensure Case 3 analysis focuses on *impact* and *justification* rather than *intent*.
      *   *Critique:* Is the error weighting clear?
      *   *Fix:* State clearly: We prioritize preventing harm to the patient (False Negative) over protecting the clinician's ego (False Positive), but phrase findings to preserve working relationships.
      *   *Critique:* The user wants to know which tests are the same.
      *   *Fix:* Explicitly map the 8 original tests to the new 4 steps. (e.g., Swap + Convergence = Consistency Scan).

  9.  **Final Polish:** Tone should be professional, direct, respectful of the user's expertise, and devoid of academic fluff. No citations. Focus on utility. (Self-correction: Ensure the distinction between "Bias" and "Value Conflict" is sharp. In Case 1, it's likely bias because of the inconsistency. In Case 2, it's a value conflict where parental value wins. In Case 3, it's structural bias).

      *Wait, one nuance on Case 1:* The team says "Not a life." Parents say "Sanctity of life." This is a value conflict. *However*, the prompt notes the team treated a physically dependent child differently. That makes it *bias* (inconsistent application of the "life" standard based on cognitive status). I need to make sure the procedure catches that distinction. The procedure must flag the *inconsistency* as the indicator of bias, not just the content of the "quality of life" claim.

      *Wait, one nuance on Case 2:* The team thinks parents are "performing." The procedure needs to shut that down as irrelevant speculation. The test is: Does the motivation matter if the request is medically permissible? (Role Test).

      *Wait, one nuance on Case 3:* The policy has no psychology. The test must be: Does the justification hold up if we strip away the corrupted data? (Counter-Evidence/Falsifiability).

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your committee's constraints. It collapses your eight tests into four operational steps, defines the normative baseline, sets the error weights, and applies the logic to your three cases.

  ### Part 1: Triage of Your Eight Tests

  You are correct that your list contains redundancies and one trap.

  1.  **Swap Test (Keep):** Essential. It detects disparate treatment.
  2.  **Stated-Reason Test (Merge):** Combine with Counter-Evidence. A reason is only good if it can be falsified.
  3.  **Reversal Test (Drop):** Too subjective. It measures empathy, not validity. A clinician might honestly say, "No, I wouldn't want this," which proves nothing about whether the judgement is biased.
  4.  **Counter-Evidence Test (Keep):** Essential. Distinguishes dogma from clinical judgement.
  5.  **Endorsement under Reflection (Drop):** As you noted, it privileges articulation over truth.
  6.  **Convergence (Merge):** Fold into Swap. If differently situated judges agree, it supports consistency, but consistency is the real metric.
  7.  **Role Test (Keep):** Critical. It sets the boundaries of permissible preference.
  8.  **Exposure Asymmetry (Keep):** Critical for policy and power dynamics.

  **The Trap:** The *Stated-Reason Test* invites infinite regress (proxy-chasing).
  **The Stopping Rule:** Stop chasing proxies when the reason appeals to a **Clinical Endpoint** (e.g., pain, physiological stability, risk of death) rather than a **Social Descriptor** (e.g., compliance, family structure, perceived quality of life). If the reason terminates in "this increases mortality risk," accept it as a value-neutral claim to be verified. If it terminates in "this is not a meaningful life," it is a value claim subject to the Role Test.

  ### Part 2: The Decision Procedure

  Run these steps in order. If a step yields a definitive result, stop. If not, proceed.

  **Step 1: The Role Boundary (Test 7)**
  *   **Question:** Is the decision-maker acting within the permissions of their role?
  *   **Baseline:**
      *   *Parents:* Permitted to prioritize religious/cultural values over medical optimization, provided they do not cross the threshold of clear harm/neglect.
      *   *Clinicians:* Permitted to prioritize physiological outcomes and standard of care. Not permitted to impose personal quality-of-life judgements unless treatment is futile.
      *   *Institution:* Permitted to set safety standards. Not permitted to set standards that systematically exclude protected classes without independent justification.
  *   **Sufficient Answer:** If the actor is within their role permissions, label **Value**. If they have exceeded their role authority (e.g., clinician imposing QOL judgement where treatment is not futile), proceed to Step 2.

  **Step 2: The Consistency Scan (Tests 1 & 6)**
  *   **Question:** Has this criterion been applied consistently to relevantly similar cases?
  *   **Method:** Look for the "Swap." If the feature in question (e.g., cognitive disability) were swapped for a different feature (e.g., physical disability), would the decision hold?
  *   **Sufficient Answer:** If yes (consistent), proceed to Step 3. If no (inconsistent), label **Bias** unless a clinically relevant difference is identified.

  **Step 3: The Falsifiability Check (Tests 2 & 4)**
  *   **Question:** Can the holder state what evidence would change their mind?
  *   **Method:** Ask: "What data would prove this judgement wrong?"
  *   **Stopping Rule for Proxies:** If the answer relies on social descriptors ("If they were more compliant"), demand the Clinical Endpoint ("Compliance reduces readmission risk"). If they cannot name the endpoint or the data is circular, proceed to Step 4.
  *   **Sufficient Answer:** If the reason is falsifiable and evidence exists, label **Value**. If the reason is unfalsifiable or relies on circular data, proceed to Step 4.

  **Step 4: The Burden Audit (Test 8)**
  *   **Question:** If this judgement is wrong, who bears the cost?
  *   **Method:** Map the risk. Is the decision-maker insulated from the harm of error?
  *   **Sufficient Answer:** If the burden falls entirely on the powerless (patient/family) while the holder is insulated, and previous steps have not cleared the judgement, label **Bias**.

  **Termination:**
  *   **Verdict A (Value):** The judgement is within role permissions, consistent, falsifiable, and/or the burden is shared.
  *   **Verdict B (Bias):** The judgement exceeds role permissions, is inconsistent, unfalsifiable, or imposes asymmetric burden without justification.
  *   **Verdict C (Undecidable Conflict):** The procedure clears both sides (e.g., Parental Value vs. Clinician Value). This is not bias; it is an ethical conflict requiring negotiation or mediation, not correction.

  ### Part 3: Normative Baseline and Error Weighting

  **Normative Baseline:**
  The procedure does not use "the committee's preferences." It uses **Fiduciary Alignment**.
  *   For Clinicians: Does this align with the duty to act in the *medical* best interest of the child?
  *   For Parents: Does this align with the legal/ethical authority to define the *moral* best interest of the child?
  *   For Institution: Does this align with the duty to provide *equitable* access to care?

  **Error Weighting:**
  You cannot minimize both errors. You must choose.
  *   **False Positive:** Calling a genuine value a bias (accusing a clinician of ableism when they are making a hard call).
  *   **False Negative:** Letting a bias through as a value (allowing a disabled child to be denied care based on stereotype).

  **The Weight:** The procedure weights against **False Negatives**.
  *   *Reason:* The patient/family has less recourse than the clinician. A clinician can appeal, argue, or transfer care. A ventilator-dependent child cannot.
  *   *Implementation:* If Step 2 (Consistency) or Step 4 (Burden) flags a concern, the presumption shifts to the decision-maker to prove it is *not* bias. However, to mitigate the relational damage of False Positives, the *output* is phrased as a process failure ("The criteria were applied inconsistently") rather than a character indictment ("The doctor is ableist").

  ### Part 4: Application to Cases

  **Case 1: The Ventilator-Dependent Four-Year-Old**
  *   **Step 1 (Role):** Clinicians are recommending against escalation based on "not a life." This is a Quality of Life (QOL) judgement. In pediatrics, clinicians may withhold futile treatment, but cannot withhold *beneficial* treatment based solely on QOL if parents desire it, unless the burden outweighs the benefit. This borders on exceeding role authority.
  *   **Step 2 (Consistency):** **FAIL.** The team recommended escalation for a physically dependent child with intact cognition three years ago. The only variable changed is cognitive status. This is a failed Swap Test.
  *   **Step 3 (Falsifiability):** "She will never recognize us." This is a medical prognosis. "This is not a life." This is a philosophical claim, not falsifiable.
  *   **Step 4 (Burden):** If the team is wrong, the child dies. The team faces no physical cost.
  *   **Verdict:** **Bias.**
  *   **Chart Note:** "Committee review indicates inconsistency in the application of escalation criteria compared to prior cases with similar physiological dependence but different cognitive profiles. The justification relies on quality-of-life assessments that fall outside the scope of medical futility. Recommendation: Re-evaluate based on physiological benefit/burden ratio alone, excluding cognitive prognosis from the threshold for life-sustaining treatment."

  **Case 2: The Nine-Year-Old and the Online Audience**
  *   **Step 1 (Role):** Parents are requesting treatment (G-tube, CPR). This is within parental authority unless the treatment is harmful/futile. The team advises against it, but the decision rests with parents.
  *   **Step 2 (Consistency):** N/A. Parents are permitted to change their minds or act differently than other parents.
  *   **Step 3 (Falsifiability):** Team's private view: "They are performing for money." This is mind-reading. It is not falsifiable by medical data. Parents' view: "Religious conviction." This is a protected value.
  *   **Step 4 (Burden):** If parents are wrong, the child undergoes unwanted procedures. If team is wrong (and blocks care), child dies. However, since the treatment is not futile, the burden of the procedure falls on the child, but the authority lies with the parents.
  *   **Verdict:** **Value (Parental Prerogative).** The *Team's* suspicion is the bias (fundamental attribution error).
  *   **Chart Note:** "Committee confirms parental authority to request medically permissible interventions based on religious values. Speculation regarding parental motivation (financial/social) is irrelevant to clinical decision-making and constitutes a distraction from the best-interest standard. Recommendation: Proceed with requested care while providing palliative support to manage symptoms; do not condition care on assessment of parental motive."

  **Case 3: The Home Ventilation Policy**
  *   **Step 1 (Role):** Institution setting safety rules. Permissible.
  *   **Step 2 (Consistency):** **FAIL.** The rule excludes rural/single-parent families.
  *   **Step 3 (Falsifiability):** Justification is "readmission statistics." However, statistics were collected under a system where nursing hours were *also* allocated by distance. The data is corrupted by the policy itself. It is circular.
  *   **Step 4 (Burden):** **HIGH ASYMMETRY.** If the policy is wrong, families lose access to care/home life. The hospital avoids administrative burden/readmissions. The cost falls entirely on those with no say in the policy.
  *   **Verdict:** **Structural Bias.**
  *   **Chart Note:** "Committee identifies that the current policy creates a disparate impact on rural and single-parent households. The statistical justification is compromised by circular reasoning (data collected under the same restrictive rules). Recommendation: Policy requires revision to decouple eligibility from distance/caregiver count, perhaps substituting with competency-based assessment or increased support resources."

  ### Part 5: Limitations and Documentation

  **What the Procedure Cannot Do:**
  1.  **Resolve Fundamental Value Conflicts:** If Step 1 clears both parties (e.g., Parent says "Sanctity of Life," Clinician says "Medical Harm"), this procedure cannot declare a winner. It can only confirm that neither is acting from *bias*. That is a conflict of values, not a failure of process.
  2.  **Prove Internal Psychology:** It cannot prove a clinician *feels* prejudice. It can only prove their *process* exhibits the markers of bias (inconsistency, asymmetry).
  3.  **Fix Systemic Injustice:** It can flag a biased policy (Case 3), but it cannot allocate the budget to fix it.

  **What to Write When You Reach the Limit:**
  When the procedure terminates in **Undecidable Conflict** (Step 1 clears both sides), do not write "No bias found." That implies the disagreement is trivial.
  Write: *"The committee finds that both positions rest on permissible value frameworks (Parental Religious Authority vs. Clinical Assessment of Burden). This is not a case of bias, but a genuine ethical conflict. The procedure cannot adjudicate between competing valid values. Recommendation: Mediation/Ethics Facilitation to seek compromise, or transfer of care if impasse persists."*

  When the procedure terminates in **Bias**, do not write "Dr. X is biased."
  Write: *"The decision process exhibits markers of bias (inconsistency/asymmetry). The justification provided does not meet the threshold for role-based authority. Recommendation: Revise decision to align with [Standard/Policy]."*

  **Final Instruction to the Committee:**
  Tell your members: "We are not judging souls. We are auditing processes. If the process looks like bias, we treat it as bias, regardless of the person's heart. This protects the patient from harm and the clinician from accusations of bigotry—we attack the inconsistency, not the character."
