answer: |-
  ### The "River Watch" 3-Step Protocol

  **The Goal:** Stop the Council from ignoring us because of duplicate emails.
  **The Rule:** If it's not in the Chat, it doesn't exist. If it is in the Chat, do not email.

  **Step 1: The Chat Check (1 min)**
  Before you email the Coordinator, open the Volunteer Group Chat. Search the last 4 hours for your location or the issue.
  *   **Is it already there?** → **HOLD BACK.** React to the existing message with a "👍" or "👀". Do not send a new email.
  *   **Is it clear?** → Go to Step 2.

  **Step 2: The Severity Sort (2 mins)**
  Look at what you found. Be honest.
  *   **RED (Immediate Harm):** Dead fish, chemical smell, bright unnatural colors, sewage solids.
  *   **AMBER (Looks Off):** Oily sheen, cloudy water, foam, algae blooms.

  **Step 3: The Action (2 mins)**
  *   **If RED + Chat Clear:** Email the Coordinator immediately. Subject: **URGENT - [Location]**. Attach photos.
  *   **If AMBER + Chat Clear:** Post a photo in the **Volunteer Chat only**. Subject: "Sighting - [Location]". Wait 30 minutes.
      *   *If the Coordinator replies:* They will tell you if they are escalating it to the Council.
      *   *If no reply after 30 mins:* Assume it's logged but not being escalated today. **HOLD BACK** on the formal email.
  *   **If ANY + Chat Taken:** **HOLD BACK.** (See Step 1).

  ***

  ### Running the Rule on Two Cases

  **Case 1: Oily Sheen on a Rainy Day (AMBER)**
  *   **Situation:** You see a rainbow sheen on the water. It's been raining hard.
  *   **Running the Rule:**
      1.  **Chat Check:** No one has posted about this stretch of river in 4 hours.
      2.  **Severity:** It's oily, but rain often causes road runoff. This is **AMBER**.
      3.  **Action:** You post the photo in the **Volunteer Chat**. You do *not* email the Coordinator yet.
  *   **The Annoyance:** You *know* this looks bad. You want to scream "Do something!" But the rule forces you to wait 30 minutes to see if the Coordinator thinks it's worth the Council's time. You might feel like you're burying evidence.
  *   **Outcome:** The Coordinator sees three other volunteers liked your post. They reply in chat: "Thanks, looks like runoff, logging it but not escalating." You have to accept that no official report goes to the Council today.

  **Case 2: Dead Fish Near an Outflow (RED)**
  *   **Situation:** You find 10 dead trout near a pipe.
  *   **Running the Rule:**
      1.  **Chat Check:** Nothing in the last 4 hours.
      2.  **Severity:** Dead wildlife is **RED**.
      3.  **Action:** Email the Coordinator immediately with "URGENT" in the subject.
  *   **Outcome:** The Coordinator gets one email (yours). They forward one consolidated report to the Council. The other four volunteers who arrive later check the Chat, see your post, and just add "👍" to your thread. No duplicates.

  ***

  ### Where This Rule Will Still Mess Up

  I need to be honest: this protocol fixes the duplicate problem, but it introduces two new risks.

  **1. The "Bystander Effect" (False Negatives)**
  This is the biggest risk. In a **RED** scenario, volunteers might check the Chat, see *nothing*, but assume "Someone else surely called it in." They might skip posting to the Chat to save time, or assume the Coordinator already knows.
  *   **Result:** A major pollution event happens, but because everyone assumed someone else was handling it, *no one* emails the Coordinator. The Council hears about it from the news, not us.
  *   **Mitigation:** Remind the team: "If it's Red and the Chat is empty, YOU are the one who has to send it. Do not assume."

  **2. The "Amber Frustration" Burnout**
  Volunteers join because they want to protect the river. Being told to "Hold Back" on an oily sheen because it's only "Amber" feels like bureaucracy.
  *   **Result:** Good volunteers might quit because they feel their judgment is being overruled by a 30-minute timer.
  *   **Mitigation:** Acknowledge their frustration. Remind them that *being ignored by the Council* hurts the river more than *one delayed report*. We are trading speed for credibility.

  **Final Sign-Off:**
  As Coordinator, I will commit to replying to every **AMBER** chat post within 30 minutes, even if it's just "Logged, no action." If I go silent, the volunteers are authorized to break the rule and email me directly.
