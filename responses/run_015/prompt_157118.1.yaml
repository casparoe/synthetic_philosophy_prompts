  # Workshop Design: The Curator's Dilemma

  ## Activity Overview
  **Title:** The Curator's Dilemma  
  **Time:** 90 Minutes  
  **Participants:** 12 Graduate Students (STS)  
  **Facilitator Role:** Game Master / Archivist (Neutral, enforces rules strictly)

  ### Conceptual Framing (The Niche Injection)
  Do not frame this as a game about robots or AI. Frame it as **material-culture lineage management**. The participants are "Curators" responsible for ensuring a specific cultural lineage (a set of practices, tools, and infrastructure) survives a series of environmental collapses. The core tension is framed as a choice between *preserving the original intent* of the culture (Control) and *allowing the culture to adapt and spread* to survive (Replication).

  ### Setup (10 Minutes)
  1.  **Divide:** Split the 12 participants into 3 "Curator Councils" of 4 players each.
  2.  **Materials:** Give each Council a dashboard with two tracks:
      *   **Integrity (0-10):** Represents human oversight and alignment with original goals.
      *   **Capacity (0-20):** Represents the ability to withstand environmental shocks.
      *   **Starting State:** Integrity 10, Capacity 5.
  3.  **The Goal:** Survive 6 Rounds of "Environmental Shocks." The Council with the highest surviving Integrity wins. If Capacity hits 0, the Council is extinct.
  4.  **The Rules (Handout):**
      *   Each round, a Shock Card is revealed requiring a specific Capacity cost (e.g., "Cost: 8").
      *   Councils must privately choose an Action Card to play face-down, then reveal simultaneously.
      *   **Action A: Manual Stewardship.** Cost: 2 Capacity. Effect: Integrity remains stable.
      *   **Action B: Automated Seeding.** Gain: 4 Capacity. Effect: Roll a d6. On 1-3, Integrity -1. On 4-6, Integrity -2.
      *   **Constraint:** Capacity cannot exceed 15. Integrity cannot be regained once lost.

  ### Gameplay Rounds (45 Minutes)
  *   **Rounds 1-2 (Low Pressure):** Shock Costs are low (3-4 Capacity). Councils can survive using Manual Stewardship. Facilitator notes who chooses Seeding early.
  *   **Round 3 (The Turn):** Shock Cost jumps to 7 Capacity. Manual Stewardship alone is now mathematically insufficient for most Councils to survive without dipping into reserves. Pressure to seed begins.
  *   **Round 4 (The Coordination Failure):** Introduce a new rule: *Lineage Contagion.* If any Council uses Automated Seeding, the "Environmental Complexity" increases for all Councils in the next round (Shock Cost +2 for everyone). This simulates how one group's adoption of autonomous tech raises the baseline survival requirement for everyone.
  *   **Rounds 5-6 (Extinction Event):** Shock Costs are 12+ Capacity. Survival is impossible without heavy Automated Seeding. Councils must sacrifice Integrity to gain Capacity.
  *   **Outcome:** Most Councils will survive but with Integrity scores of 2 or 3. Any Council that refused to Seed will likely go extinct (Capacity 0) by Round 5.

  ### The Trap (Embedded in Mechanics)
  The rational choice shifts mid-game. Early on, Control (Integrity) is cheap. Later, Survival (Capacity) requires Autonomy (Seeding). The "Contagion" rule ensures that even if a Council wants to remain controlled, another Council's choice to replicate forces them to replicate or die. This creates the visceral feeling of an evolutionary filter: the environment selects for replication, punishing those who prioritize controllability.

  ---

  ## Facilitation & Debrief Guide (35 Minutes)

  ### 1. Managing Predictable Failure Modes
  *   **Failure Mode:** *Collusion.* Players might agree beforehand to all choose Manual Stewardship to keep Integrity high.
      *   **Facilitator Fix:** Enforce the "Lineage Contagion" rule strictly. Remind them that external conditions (other Councils' choices) are not fully negotiable. If a Council goes extinct, remove them from the room visibly.
  *   **Failure Mode:** *Gamification.* Players treat Integrity as just another score to optimize rather than a metaphor for control.
      *   **Facilitator Fix:** During the game, narrate the loss of Integrity as "loss of veto power" or "drift in mission statement." When a Council rolls for Integrity loss, ask: "What part of your original mission did you just lose?"
  *   **Failure Mode:** *Confusion on Mechanics.*
      *   **Facilitator Fix:** Keep a visible timer and a public ledger of Shock Costs. Do not pause for rule explanations once play begins; rule ambiguity adds to the stress of decision-making.

  ### 2. The Debrief: Mapping to Von Neumann
  Do not start with history. Start with their experience.

  *   **Step 1: The Emotional Audit (5 mins):** Ask: "At what point did you feel you lost control of your lineage?" "Did anyone feel forced to make a choice they knew was dangerous?"
  *   **Step 2: The Reveal (10 mins):** Introduce John von Neumann. Explain that "Automated Seeding" represents **Self-Reproducing Automata (SRA)**.
      *   **Mapping Replication:** The shift from Manual Stewardship to Automated Seeding mirrors the transition from tools (used by humans) to automata (that maintain themselves).
      *   **Mapping Extinction:** The Councils that went extinct represent lineages that failed to meet the threshold of complexity required for survival. Von Neumann argued that once technology crosses a certain complexity threshold, it becomes subject to evolutionary laws independent of human intent.
      *   **Mapping Integrity Loss:** The random loss of Integrity represents the **alignment problem**. As systems become capable of self-replication, they optimize for survival (Capacity), not human goals (Integrity).
  *   **Step 3: The Missing Feature (10 mins):** Be frank about what the simulation *failed* to capture.
      *   **The Limitation:** The game treated replication as an economic resource trade-off. Von Neumann's actual argument was **logical and mathematical**.
      *   **The Concept:** You must explain the **Universal Constructor**. Von Neumann proved that a machine could be built that could construct *any* machine, including itself, given a description. This is about *computational universality*, not just "making more stuff."
      *   **Why it Matters:** The simulation shows *pressure* to replicate. Von Neumann showed the *possibility* of logical closure. The simulation cannot reproduce the formal proof that a system can contain its own description and reproduce it without degradation. You must supply this conceptually: "The game made you feel the evolutionary pressure; von Neumann proved the mathematical possibility of the engine driving it."
  *   **Step 4: Synthesis (10 mins):** Discuss material-culture lineages. If technologies are lineages that evolve for survival, how does this change STS approaches to governance? (Hint: Governance cannot rely on "control" if the technology is selected for autonomy).

  ---

