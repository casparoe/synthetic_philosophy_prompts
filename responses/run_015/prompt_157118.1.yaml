    "niche_injection": "Technologies as material-culture lineages subject to evolutionary selection",
    "predicted_failure_mode": "Players collude to avoid replication, requiring facilitator to enforce catastrophe severity",
    "debrief_mapping": "Links replication choices to evolutionary filters and loss of control to alignment drift",
    "missing_feature_requiring_facilitator": "Mathematical universality of the constructor and formal properties of universal computation",
    "format_notes": "JSON summary appended at end of response"
  }
  ```
