  2.  **Deconstruct the Philosophical Core (for internal use):**

      *   *Invariantism:* Knowledge depends only on truth, belief, and justification (evidence). Stakes don't matter.
      *   *Pragmatic Encroachment:* Knowledge depends on evidence *and* practical stakes. High stakes require more evidence to count as "knowing."
      *   *Contextualism:* The word "know" changes meaning depending on the context of the *attributor* (the review board), not necessarily the agent's stakes.
      *   *User's "Stakes Firewall":* This attempts to objectify stakes based on the *role definition* at time *t*, not the agent's subjective feeling or future policy. This is a hybrid. It avoids pure subjectivism (what they felt) and pure hindsight (what we think now). It effectively creates a "Standard of Care" based on mission type.

  3.  **Drafting the Procedure (The "Pragmatic Protocol"):**

      *   *Goal:* Make it actionable.
      *   *Structure:* Step-by-step questions.
