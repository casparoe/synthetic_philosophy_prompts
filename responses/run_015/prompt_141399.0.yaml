answer: |-
  # APPENDIX B: POST-INCIDENT KNOWLEDGE STATE REVIEW (PIKSR)

  **Purpose:** To determine the knowledge state of crew members at the time of an incident (Time *t*) for the purpose of Just Culture classification.
  **Runtime:** ~30 Minutes.
  **Users:** Safety Review Panel (Pilots, Medical, Human Factors).
  **Philosophy:** Pragmatic Encroachment (Knowledge depends on Evidence + Stakes).

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Lock the Timeline and Policy Version
  **Action:** Identify the exact minute of the decision (Time *t*). Identify the version of all manuals, checklists, and protocols active on that date.
  **Sufficient Answer:** "Time *t* is 14:30Z. Ops Manual Rev 4.2 was in force."
  **Hard Stop:** If the record cannot establish Time *t* within a 5-minute window, **STOP.** Hand off to Senior Leadership. *Reason: You cannot judge knowledge without a fixed moment.*

  ### Step 2: Inventory Available Evidence
  **Action:** List every piece of information physically or digitally available to the crew member at Time *t*. (e.g., cockpit displays, radio calls, patient vitals, dispatch sheets).
  **Sufficient Answer:** "Crew had METAR for destination, 2 radio updates from dispatch, patient SpO2 trending down."
  **Note:** Do not include information they *could have found* with more time. Only what was *there*.

  ### Step 3: Determine the "Reasonably Ascertainable Stakes" (RAS)
  **Action:** Determine the stakes of the decision. **Do not use** what the crew *felt* the stakes were. **Do not use** what policy says *today*.
  **Ask:**
  1.  What was the *actual* objective risk at Time *t*? (e.g., Ferry flight vs. Deteriorating Pediatric).
  2.  Was that risk **Reasonably Ascertainable** to the crew? (i.e., Did dispatch tell them? Was the patient's condition visible? Was the mission card updated?)
  **Sufficient Answer:** "Actual risk: High (Pediatric Deterioration). Ascertainable: Yes (Dispatch broadcast upgrade at 14:15Z, crew acknowledged)."
  **Hard Stop:** If the risk was *not* Reasonably Ascertainable (e.g., system failed to update mission card, patient hid symptoms), **Verdict: COULDN'T HAVE KNOWN.** *Reason: You cannot be accountable for stakes you had no way to perceive.*
  **Values Handoff:** If the risk was ascertainable but the *threshold* for action is unclear (e.g., "How bad must the weather be to abort a pediatric flight?"), **HAND OFF to Panel Vote.** *Reason: This is not a fact; this is the organization defining its risk tolerance.*

  ### Step 4: Match Evidence to Stakes (The Encroachment Test)
  **Action:** Compare the Evidence (Step 2) against the Stakes (Step 3).
  **Rule:** As Stakes rise, the amount of Evidence required to count as "Knowing" increases.
  **Ask:** "Given the Reasonably Ascertainable Stakes, was the Evidence sufficient to act with certainty?"
  **Sufficient Answer:**
  *   **Low Stakes + Thin Evidence = KNEW.** (e.g., Ferry flight + basic weather check).
  *   **High Stakes + Thin Evidence = DID NOT KNOW.** (e.g., Pediatric + basic weather check).
  *   **High Stakes + Thick Evidence = KNEW.**
  **Values Handoff:** If the Panel disagrees on whether the evidence was "thick enough" for the stakes, **HAND OFF to Panel Vote.** *Reason: This defines the organization's standard for competency under pressure.*

  ### Step 5: Assign Verdict
  *   **KNEW:** Evidence met the threshold for the Stakes. (Triggers: Competency Sign-off / Remedial Training if action was wrong).
  *   **SHOULD HAVE KNOWN:** Evidence was available but not accessed/processed, and Stakes made accessing it mandatory. (Triggers: Remedial Training).
  *   **COULDN'T HAVE KNOWN:** Evidence was unavailable OR Stakes were not Reasonably Ascertainable. (Triggers: System/Procedure Change only).

  ---

  ## PART 2: EVALUATION OF YOUR "STAKES FIREWALL" HACK

  You asked if your hack (Stakes = Role/Protocol at Time *t*) survives.

  **The Verdict:** It collapses back into Invariantism with extra bookkeeping.
  **Why:** If your protocol treats a Ferry Flight and a Pediatric Scene Call identically regarding weather minima (e.g., "Check METAR, decide"), then locking stakes to the protocol means the evidence threshold never changes. You are back to checking boxes.
  **The Fix:** Use the **"Reasonably Ascertainable Stakes" (RAS)** model in Step 3 above.
  **Why it beats your Hack:**
  1.  **Prevents "Paper Shielding":** Your Hack allows a crew to claim "The mission card said Ferry" even if they heard the kid was dying on the radio. RAS says: "If you heard it, the stakes were High, regardless of the card."
  2.  **Prevents Hindsight Inflation:** RAS locks to what was ascertainable *at Time t*, not what Safety knows *now*.
  3.  **Preserves Pragmatic Encroachment:** It allows the evidence bar to move based on reality, which is what the Medical Director wants, without punishing crews for system failures (if the stakes weren't ascertainable).

  ---

  ## PART 3: THE CONTEXTUALIST ALTERNATIVE (SHORT VERSION)

  If you reject the above and choose **Contextualism**, the document changes fundamentally. It stops asking about the *crew* and starts asking about the *reviewers*.

  **The Tool:** "Attribution Standards Matrix."
  **The Question:** "In this review room, given the outcome, how certain do *we* require the crew to have been to say they 'Knew'?"
  **The Difference:**
  *   **Pragmatic (Above):** "Did the crew have enough info for *that* situation?" (Focus: Crew Capability).
  *   **Contextualist:** "Are *we* willing to accept this level of info as 'knowledge' given the harm caused?" (Focus: Organizational Liability).
  **Operational Impact:** The Contextualist tool makes the verdict dependent on the *severity of the outcome*. A near-miss and a fatality with identical crew actions could yield different "Knowledge" verdicts because the Review Room's standard shifts based on the harm.
  **Recommendation:** **Do not use this.** It violates Just Culture principles by punishing based on outcome luck rather than decision quality. The Pragmatic Protocol (Part 1) is safer for fairness.

  ---

  ## PART 4: CASE RUNS

  ### Case A: Daytime VFR Ferry Flight
  *   **Facts:** No patient. Weather deteriorating. Evidence thin (old METAR, no live feed).
  *   **Step 3 (Stakes):** Actual Risk: Low (Aircraft only). Ascertainable: Yes.
  *   **Step 4 (Match):** Low Stakes + Thin Evidence.
  *   **Verdict:** **KNEW.**
  *   **Rationale:** For a ferry flight, this level of evidence is sufficient to form knowledge. The crew is competent. If they flew into bad weather, it is a judgment error, not a knowledge failure.

  ### Case B: Pediatric Scene Call (Identical Evidence)
  *   **Facts:** Deteriorating kid. 20-min window. Weather evidence identical to Case A.
  *   **Step 3 (Stakes):** Actual Risk: High (Life + Aircraft). Ascertainable: Yes (Dispatch logs show upgrade).
  *   **Step 4 (Match):** High Stakes + Thin Evidence.
  *   **Verdict:** **DID NOT KNOW (Should Have Known).**
  *   **Rationale:** The stakes encroach on the evidence. The same data that counts as "knowledge" for a ferry flight does not count for a pediatric rescue. The crew acted as if they knew, but by the standards required for *this* stakes level, they did not.
  *   **Consequence:** Remedial training on risk assessment under high-stakes conditions.

  ### Case C: The Dreaded Case (Senior Paramedic)
  *   **Facts:** Senior Paramedic. Followed Protocol Rev 4.2 exactly. Protocol was designed for average acuity. Patient was rare, extreme acuity (Objective Stakes: Extreme). Protocol did not require the specific check that would have revealed the danger.
  *   **Step 3 (Stakes):** Actual Risk: Extreme. Ascertainable: Yes (Vitals were visible, just not in protocol).
  *   **Step 4 (Match):** Extreme Stakes + Protocol-Level Evidence.
  *   **Verdict:** **DID NOT KNOW.**
  *   **Rationale:** This is the cost of Pragmatic Encroachment. The Protocol was insufficient for the Reality. Because the stakes were reasonably ascertainable (vitals were visible), the crew member is held to the standard of the *Reality*, not the *Protocol*.
  *   **Consequence:** Competency sign-off lapses.
  *   **Why we won't like it:** It punishes compliance. It tells a respected senior clinician: "You followed our rules, but our rules weren't good enough for the situation, and therefore *you* didn't know enough."
  *   **Why we must do it:** To maintain the Medical Director's safety standard. If we exempt him because "he followed protocol," we admit that Protocol > Reality. This procedure forces the organization to admit that **Competency includes overriding protocol when stakes visibly exceed protocol design.**
  *   **Mitigation:** The Panel *must* simultaneously trigger a Protocol Review. If the Paramedic is at fault for not knowing, the Organization is at fault for not training him to recognize when Protocol is insufficient.

  ---

  ## PART 5: LIMITATIONS (WHAT THIS TOOL CANNOT DO)

  1.  **It Cannot Determine Sanction:** This tool outputs a Knowledge State (Knew/Didn't Know). It does *not* output Punishment. A "Didn't Know" verdict triggers a competency review, but the Panel must separately decide if that lapse warrants suspension, retraining, or termination based on intent and history. Do not conflate the verdict with the penalty.
  2.  **It Cannot Fix Thin Records:** If the dispatch logs are missing, or the cockpit voice recorder is corrupted, Step 1 or 2 will Hard Stop. You cannot run Pragmatic Encroachment on guesswork. If the record is too thin to establish "Reasonably Ascertainable Stakes," you must default to **COULDN'T HAVE KNOWN** to preserve Just Culture.
  3.  **It Cannot Resolve Values Disputes:** Step 3 and 4 contain "Values Handoffs." If the Panel cannot agree on what evidence level matches a "High Stakes" scenario, this tool cannot solve it. That is a policy decision for the Safety Committee, not a fact-finding mission for the Reviewer.

  **Final Note to Committee:** Adopting this procedure acknowledges that "Knowledge" is not a static state like a fuel gauge. It is a relationship between what we see and what is on the line. This increases our safety ceiling but raises the bar for our crew's situational awareness. Ensure your training budget matches your new standards.
