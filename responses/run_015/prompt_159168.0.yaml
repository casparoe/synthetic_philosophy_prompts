answer: |-
  You have put your finger on a precise structural failure in contemporary ethical discourse, one that existing labels like "Protestant Work Ethic" or "Culture Industry" describe genealogically but do not name operationally. Weber explains the *origin* of the reverence for work; Adorno explains the *corruption* of leisure. Neither fully captures the specific *discursive capture* you are describing: the inability to articulate the value of non-work without translating it into the currency of work.

  There is no single established term that carves this exact shape. The closest existing concept is **Real Subsumption** (Marx/Postone), extended from the labor process to social time, or Habermas's **Colonization of the Lifeworld**. However, these are macro-sociological. You are asking about the *argumentative and phenomenological mechanism*.

  I propose we coin a term for this specific phenomenon: **The Productive Enclosure**.

  Below is the carving you requested: the definition, the unity of the two halves, the boundary cases, and the possibility of escape.

  ### 1. Definition: The Productive Enclosure

  **The Productive Enclosure** is the rhetorical and phenomenological process by which time or activity formally designated as "non-work" is fenced off from any intrinsic value and made legible only through its instrumental contribution to production.

  It is an **enclosure** because it takes a "common" (human time, energy, life) and privatizes it under a specific regime of value (productivity). It is **productive** because it does not merely forbid leisure; it repurposes it.

  This phenomenon has two modes, which you correctly identified as halves of the same coin:
  1.  **Discursive Enclosure:** The justification for limiting work relies on the axioms of work (e.g., "rest makes you more productive").
  2.  **Phenomenological Enclosure:** The experience of free time is structured by the metrics of work (e.g., optimized sleep, gamified hobbies).

  ### 2. Are the Two Halves One Phenomenon?

  **Yes.** They are the external and internal faces of the same normative regime.

  *   **The Discursive Half** creates the *conditions of intelligibility*. If the only language available to justify rest is "recharging for work," then rest cannot be socially recognized as good unless it serves work.
  *   **The Phenomenological Half** is the *internalization* of that language. When the subject has no vocabulary for "useless" time, they experience unstructured time as anxiety (guilt) and instinctively impose structure (tracking, coaching) to make it "count."

  The link is **legibility**. In a regime of Productive Enclosure, a life that does not produce capacity is not just "less good"; it is morally unintelligible. The guilt felt during unstructured time is the psychic pain of illegibility.

  ### 3. The Carving: Instances and Non-Instances

  To use this concept in your seminar, you need to distinguish it from mere hard work or general stress.

  **Instances of Productive Enclosure:**
  *   **The "Self-Care" Pivot:** Arguing for mental health days solely because they prevent costly turnover or burnout (rest as maintenance of the machine).
  *   **The "Side Hustle" Leisure:** Turning a hobby into a monetizable skill or brand (knitting to sell on Etsy, running to post on Strava).
  *   **The Russell Trap:** As you noted, even *In Praise of Idleness* argues that idleness will reduce unemployment and stabilize civilization. The good of idleness is its systemic utility, not the experience of the idler.
  *   **Biohacking:** Sleep tracking not to feel rested, but to maximize cognitive output the next day.

  **Non-Instances (Counterexamples):**
  *   **The Sabbath (Theological):** In the Judeo-Christian tradition, the Sabbath is not for rest *in order to* work better on Monday. It is a cessation of creation to acknowledge that the world does not depend on human labor. It is *structurally* anti-productive. (Note: If one keeps Sabbath to "avoid burnout," it has fallen into Productive Enclosure).
  *   **Aristotelian *Theoria*:** Contemplation is the highest human activity, not because it builds anything, but because it actualizes the divine in us. It is an end in itself.
  *   **Play (Huizinga):** True play occurs in a "magic circle" separate from ordinary life. If the play is for fitness or networking, it is enclosed. If it is for the sake of the play, it is not.
  *   **Grief:** Time taken to grieve is non-productive. It yields no capacity. Defending grief time is a rare breach in the enclosure.

  ### 4. Boundary Cases (The Gray Zone)

  *   **Education:** Is studying for a degree Productive Enclosure?
      *   *Yes,* if framed purely as human capital accumulation.
      *   *No,* if framed as *Bildung* (self-formation) without guaranteed economic return.
  *   **Exercise:**
      *   *Yes,* if done to lower insurance premiums or extend working life.
      *   *No,* if done for the somatic joy of movement (though this is increasingly rare).
  *   **The 4-Day Work Week:**
      *   *Enclosed,* if argued as "same pay, same output, less time."
      *   *Unenclosed,* if argued as "we have a right to 3 days of life regardless of output."

  ### 5. Can a Right to Leisure Be Argued Without Reproducing the Pattern?

  This is the crux of your seminar. To argue for leisure without Productive Enclosure, you must step outside the **Instrumental Axiom**. You cannot argue that leisure is *good for* X. You must argue that leisure *is* X.

  There are three historical vocabularies that escape the enclosure:

  1.  **The Ontological Argument (Being vs. Doing):**
      *   *Argument:* Human worth is inherent in existence, not output.
      *   *Risk:* Can sound abstract or religious to secular students.
      *   *Source:* Josef Pieper's *Leisure: The Basis of Culture*. Pieper argues leisure is a "state of the soul," not a break. It is the capacity to let things be.

  2.  **The Aesthetic Argument (Play as End):**
      *   *Argument:* Life should be approached as art, not engineering. The value is in the experience, not the artifact.
      *   *Risk:* Dismissed as hedonistic or elitist.
      *   *Source:* Schiller's *On the Aesthetic Education of Man*. "Man only plays when he is in the fullest sense of the word a human being."

  3.  **The Political Argument (Refusal):**
      *   *Argument:* Leisure is a form of strike. It is the withdrawal of the capacity that capital requires.
      *   *Risk:* Frames leisure as antagonistic, still defining it in relation to work.
      *   *Source:* Paul Lafargue's *The Right to Be Lazy* (though even he leans on utility); contemporary Post-Work theory (Kathi Weeks).

  **The Trap to Avoid:**
  If you argue for a "Right to Leisure" based on **Health**, you are still inside the Enclosure. Health is the maintenance of capacity.
  If you argue based on **Happiness**, you risk the "happiness industry" (track your joy to optimize it).
  The only escape is **Meaning** or **Dignity** defined independently of utility.

  ### 6. Suggested Seminar Move

  To make this visible to your students, try this exercise:

  Ask them to write a paragraph defending a day of doing *nothing*.
  1.  **Round 1:** They must use economic or productivity terms. (They will easily produce "recharging," "mental health," "creativity boost.")
  2.  **Round 2:** They are forbidden from using any word related to capacity, output, future benefit, or health. They must justify the day solely by what happens *during* the day.

  Most will freeze. That silence is the **Productive Enclosure** in action. It reveals that we have lost the language of intrinsic value.

  ### Summary for the Syllabus

  If you need a label for the reading list, I suggest using **The Productive Enclosure** as a working term, while citing its lineage:
  *   **Marx/Postone:** For the subsumption of time.
  *   **Josef Pieper:** For the definition of leisure as *non-instrumental*.
  *   **Byung-Chul Han:** For the phenomenology of self-exploitation (*The Burnout Society*).
  *   **Kathi Weeks:** For the political refusal of work (*The Problem with Work*).

  You are correct that Weber and Adorno are necessary but insufficient. Weber explains the *spirit*, Adorno explains the *distraction*, but neither explains the *assimilation of the critique*. That is the specific contribution of the Productive Enclosure: it shows how the immune system of work ideology absorbs the antibody of leisure and turns it into fuel.
