prompt: |-
  I'm giving a job-market talk next thursday in the moral psych / phil of action joint seminar. The room will be mostly virtue ethicists and practical-reason people, plus two Kantian constructivists who think idealization is just autonomy done right, and one decision-theorist who thinks indirect normativity is just expected utility with extra steps. I'm defending the claim that indirect normativity survives only if we restrict idealized deliberation to first-order preferences — but if we allow second-order closure, meaning the agent can revise her own rational capacities inside the idealization, then the direct/indirect distinction collapses since the ideal agent can always run the indirect evaluation herself. So indirect norms are either redundant or they hang on an arbitrary cutoff in the model. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this crowd, not the ones I'd hear from decision theorists online, ordered by how much damage they'd do, each phrased the way a virtue ethicist or Kantian would actually put it, with a two-minute reply and a note on where my reply is soft. Tell me what I should concede up front — probably something about the phenomenology of moral growth? — and include the one question I'm praying nobody asks, which is probably whether this collapses into a static-self picture that virtue ethics was meant to avoid. Keep it grounded; I can't search the web during the talk.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **Speaker:** Job-market candidate (high stakes, needs to show competence, grace under pressure, and philosophical depth).
      *   **Topic:** Indirect Normativity (likely related to Ideal Advisor theories, Constitutivism, or Hierarchical models of autonomy) vs. Direct Normativity. The core claim is that indirect normativity fails if idealized deliberation allows second-order closure (revising rational capacities), collapsing the distinction.
      *   **Audience:** Moral Psychology / Philosophy of Action Joint Seminar.
          *   *Majority:* Virtue Ethicists & Practical Reason scholars (care about character, development, teleology, non-alienation).
          *   *Minority:* Two Kantian Constructivists (care about autonomy, idealization as constitutive of agency).
          *   *Outlier:* One Decision Theorist (cares about formal consistency, utility maximization, "extra steps").
      *   **Constraint:** No web search during the talk. Needs to be grounded, realistic, and strategic.
      *   **Goal:** Draft a Q&A prep sheet with ~8 objections, ordered by damage potential, phrased in the audience's idiom, with 2-minute replies and vulnerability notes. Plus, a strategic concession and the "nightmare question."

  2.  **Deconstruct the Core Argument:**
      *   *Claim:* Indirect Normativity (IN) says $X$ is good/right because an Ideal Agent (IA) would choose $X$.
      *   *Constraint:* IA must be restricted to first-order preferences (cannot change *how* they deliberate).
      *   *Problem:* If IA can use second-order closure (revise their own rational capacities/preferences about preferences), they can just simulate the direct evaluation.
      *   *Conclusion:* IN is either redundant (IA just does direct evaluation) or arbitrary (why stop at 1st order?).
      *   *Implication:* This challenges views like Smith's Ideal Advisor, maybe some readings of Korsgaard (constructivism), and hierarchical autonomy views (Frankfurt/Dworkin).

  3.  **Brainstorming Objections (Audience Specific):**

      *   *Virtue Ethicists:* Will care about *development*, *character*, and *alienation*. They hate static models. They'll ask: "Isn't the point of idealization to capture *flourishing*, not just preference satisfaction?" or "Doesn't this ignore the temporal aspect of becoming virtuous?"
      *   *Kantian Constructivists:* Will care about *autonomy* and *constitutive norms*. They'll ask: "Isn't the procedure itself what constitutes the will? You're treating rationality as a tool, not a structure."
      *   *Practical Reason Generalists:* Will ask about *normative authority*. "Where does the normativity come from if not the ideal perspective?"
      *   *Decision Theorist:* Will ask about *coherence*. "Isn't this just a fixed-point problem?" (User said ignore online DT people, focus on the room).
      *   *The "Nightmare":* The static-self objection. If idealization freezes the self to make the theory work, it violates the dynamic nature of agency virtue ethics champions.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Knockout - Virtue Ethics):* The Development/Teleology objection. If you ban second-order revision, you freeze the agent. Virtue is about changing *who you are*, not just what you want.
      *   *Objection 2 (The Kantian):* Autonomy as Self-Legislation. If the ideal agent can't revise rational capacities, they aren't fully autonomous. You're smuggling in a substantive view of the good.
      *   *Objection 3 (The Redundancy Charge):* If the ideal agent is smart enough, they just compute the direct answer. Why bother with the "advisor" model?
      *   *Objection 4 (The Arbitrariness):* Why stop at first-order? Who draws the line?
      *   *Objection 5 (Phenomenology):* How does this feel to the agent? Alienation.
      *   *Objection 6 (Normative Force):* Why should I care what this restricted ideal agent thinks?
      *   *Objection 7 (The Decision Theorist):* Fixed points and stability.
      *   *Objection 8 (The Meta):* Is this just a verbal dispute about "direct" vs "indirect"?

      *Refining for the Room:* Need to make them sound like *this* room.
      *   VE: "Moral Growth," "Character," "Teleology."
      *   Kantian: "Constitutive," "Autonomy," "Procedure."
      *   Practical Reason: "Normative Authority," "Reasons."

  5.  **Developing Replies & Vulnerabilities:**
      *   Need to be concise (2 mins).
      *   Need to admit where the theory is weak (shows intellectual honesty).
      *   *Strategy:* Concede the static picture risk but argue it's a *methodological* necessity for *evaluation*, not *action*.

  6.  **Strategic Concession:**
      *   User suggested: Phenomenology of moral growth.
      *   *Refinement:* Concede that the *model* abstracts away from the messy process of becoming, but argue it's needed to define the *target*.

  7.  **The Nightmare Question:**
      *   User suggested: Static-self picture.
      *   *Refinement:* Make it sharper. "If the ideal self can't revise its rationality, isn't it a different person? And if it is, why does its choice bind *me*?" (The Alienation/Identity problem).

  8.  **Final Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes (Virtue/Kantian first, as they dominate the room).
      *   Phrased correctly? Yes (using their jargon).
      *   2-min replies? Keep them tight.
      *   Soft spots identified? Yes.
      *   Concession included? Yes.
      *   Nightmare question included? Yes.

  9.  **Polishing the Tone:**
      *   Needs to be supportive but rigorous. Like a senior colleague prepping a junior candidate.
      *   Avoid overly technical decision theory jargon (since the DT person is the outlier).
      *   Focus on Moral Psych/Action idioms.

  *(Self-Correction during drafting)*: I initially thought about focusing heavily on Smith's Ideal Advisor. But the prompt mentions Kantian Constructivists. I need to make sure Objection 2 hits Korsgaard-style views without getting bogged down in exegesis. The core is the *procedure* vs. *outcome* distinction. Also, ensure the "Second-Order Closure" concept is clear in the replies.

  *(Final Polish)*: Check the ordering. The Virtue Ethicist objection about moral growth is the most damaging because it attacks the *point* of the theory in a moral psych seminar. The Kantian objection is second because they are the specific minority mentioned. The redundancy argument is third. The nightmare question should be separate at the end.

  Let's assemble the document.cw
answer: |-
  **JOB TALK Q&A PREP SHEET**
  **Seminar:** Moral Psych / Phil of Action Joint
  **Topic:** Indirect Normativity & Second-Order Closure
  **Audience:** 70% Virtue/Practical Reason, 20% Kantian Constructivist, 10% Decision Theory

  **STRATEGIC CONCESSION (Open with this if pressed on "real world" application):**
  *Concede:* You are right that restricting idealization to first-order preferences abstracts away from the *phenomenology of moral growth*. The model treats the agent's rational architecture as fixed for the sake of *evaluation*, not necessarily as a prescription for *development*.
  *Pivot:* But this abstraction is necessary to distinguish between *what is good for me* and *what I would become if I were good*. If we allow the ideal agent to revise their rational capacities (second-order closure), we lose the anchor that distinguishes the advisor from the advisee.

  ---

  ### THE OBJECTIONS (Ordered by Damage Potential)

  **1. The "Moral Growth" Objection (Virtue Ethicist)**
  *   **The Question:** "If your ideal agent cannot revise their own rational capacities (no second-order closure), aren't you presenting a static picture of the self? Virtue ethics is about *becoming*. If the ideal self is structurally identical to the actual self, just 'smarter,' how does this model account for radical moral transformation?"
  *   **The Reply:** "That's a crucial tension. I agree that moral growth often involves changing *how* we deliberate. But my claim is about *normative authority*, not moral education. To say 'X is good' requires a standpoint that isn't just 'me but better.' If the ideal agent can rewrite their own rational software, they aren't advising *me* anymore; they are a different person. We need the first-order restriction to keep the normativity *mine*."
  *   **Soft Spot:** You risk admitting the theory can't guide transformation, only evaluate states.
  *   **Save:** Distinguish *justification* (your talk's focus) from *pedagogy* (their focus).

  **2. The "Autonomy as Self-Legislation" Objection (Kantian Constructivist)**
  *   **The Question:** "For a Kantian, autonomy *is* the capacity to revise maxims through rational reflection. By banning second-order closure in the idealization, aren't you treating rationality as a mere tool rather than a constitutive feature of agency? You're smuggling in a substantive good."
  *   **The Reply:** "I'm not denying rationality is constitutive. I'm arguing that for an *indirect* norm (like an Ideal Advisor) to work, there must be a gap between the procedure and the outcome. If the ideal agent can revise the procedure itself (second-order), the procedure collapses into the outcome. I'm protecting the *structure* of advice, not denying autonomy."
  *   **Soft Spot:** They will press that "advice" is the wrong model for morality; it should be "legislation."
  *   **Save:** Concede "legislation" is better for *obligation*, but "advice" holds for *well-being/prudence*, which is often where indirect normativity lives.

  **3. The "Redundancy" Objection (Practical Reason Generalist)**
  *   **The Question:** "If the ideal agent is truly ideal, and they are restricted to first-order preferences, won't they just calculate the direct normative truth anyway? If they know all the facts and reason perfectly, the 'indirect' path just leads directly to the truth. So why call it indirect?"
  *   **The Reply:** "Because the *source* of the normativity matters. In direct views, the truth binds me. In indirect views, *my relation to the truth* binds me. Even if they converge on the answer, the *reason* it's normative is that it's what *I* would want, not that it's 'The Good.' The restriction prevents the ideal agent from bypassing my identity."
  *   **Soft Spot:** If they converge extensionally, the distinction looks verbal.
  *   **Save:** Insist on *explanatory* priority, not just extensional difference.

  **4. The "Alienation" Objection (Virtue Ethicist / Wolf-style)**
  *   **The Question:** "If the ideal agent can't revise their rational capacities, they might endorse preferences that are deeply alienating to the actual agent's current values. Why should I care what a version of me who can't question their own framework wants?"
  *   **The Reply:** "This is exactly why the cutoff is necessary. If they *could* question the framework, they might end up valuing things you currently find abhorrent. The restriction ensures the ideal self remains *recognizably you*. Alienation is the price of maintaining identity across idealization."
  *   **Soft Spot:** This sounds like you're prioritizing identity over truth.
  *   **Save:** Argue that normative force *requires* identity. A truth that isn't *for me* isn't a practical reason.

  **5. The "Arbitrary Cutoff" Objection (Metaphysician / Generalist)**
  *   **The Question:** "You say we must stop at first-order preferences. But why there? Why not allow revision of beliefs but not desires? Or desires but not logical capacities? It looks like you're drawing a line just to save the theory."
  *   **The Reply:** "It's not arbitrary; it's structural. First-order preferences define the *agent*. Second-order capacities define the *species* of agency. To evaluate a human life, we hold the human constant. If we vary the species of agency, we aren't doing human ethics anymore."
  *   **Soft Spot:** The line between "agent" and "species of agency" is blurry.
  *   **Save:** Use the "Ship of Theseus" analogy. Change too much, and it's not the same ship.

  **6. The "Normative Force" Objection (Kantian)**
  *   **The Question:** "If the ideal agent is just maximizing first-order preferences, even perfectly, why does that have *moral* weight? Why isn't it just enlightened self-interest?"
  *   **The Reply:** "Because the idealization includes full information and rational coherence. Self-interest usually relies on ignorance or inconsistency. When you remove those, what remains often aligns with moral reasons. But I grant this theory works best for prudence; extending it to morality requires extra steps."
  *   **Soft Spot:** Admitting it works best for prudence weakens the "Moral Psych" pitch.
  *   **Save:** Frame prudence as the foundation for moral psychology in this context.

  **7. The "Decision Theory" Objection (The Outlier)**
  *   **The Question:** "This sounds like a fixed-point problem. If the function maps preferences to preferences, and you ban higher-order inputs, aren't you just ensuring the function is linear? Isn't this trivial?"
  *   **The Reply:** "It's not trivial because human psychology isn't linear. We have conflicting higher-order volitions. The restriction forces the model to resolve conflicts within the first-order set, rather than appealing to a 'higher' self to break ties. That's a substantive constraint on rationality."
  *   **Soft Spot:** They might think you're misunderstanding utility functions.
  *   **Save:** Don't get into the math. Keep it philosophical: "It's about authority, not calculation."

  **8. The "Why Bother?" Objection (Skeptic)**
  *   **The Question:** "If the distinction collapses when we allow second-order closure, and you ban it to save the distinction, haven't you just proven indirect normativity is impossible? Why not just be a direct realist?"
  *   **The Reply:** "Because direct realism fails to explain *motivation*. We are motivated by what we care about. Indirect normativity explains why reasons motivate us: because they connect to our actual preferences, albeit idealized. Direct realism leaves motivation mysterious."
  *   **Soft Spot:** Internalism vs. Externalism debate is a rabbit hole.
  *   **Save:** Keep it to the job talk scope: "I'm solving the authority problem, not the metaethical ontology problem."

  ---

  ### THE NIGHTMARE QUESTION (Pray this doesn't come up)

  **The "Static-Self / Virtue Collapse" Objection**
  *   **The Question:** "Virtue ethics arose specifically to avoid the picture of the agent as a bundle of preferences waiting to be optimized. By anchoring your theory to first-order preferences, aren't you resurrecting the Humean picture that virtue ethicists spent the last 40 years burying? If the ideal self can't revise its character structure, isn't this just desire-satisfaction in disguise?"
  *   **Why it hurts:** It attacks the foundational ontology of your talk in a room full of virtue ethicists. It suggests you are solving a technical problem by ignoring the moral psychology.
  *   **Emergency Reply:** "I'm not claiming preferences are the *source* of value, but the *locus* of normativity. Virtue ethics tells us what the good life *is*; my theory tells us why that life binds *me*. We can accept the virtue account of the good while using an ideal-preference model to explain its normative grip. The two aren't mutually exclusive."
  *   **Backup Plan:** If they press, concede: "If 'preference' implies 'passive state,' then yes, my terminology is poor. I mean 'cares' or 'commitments.' But the structural point about second-order closure remains."

  ---

  **GENERAL ADVICE FOR THE ROOM:**
  *   **Watch the Kantians:** They will try to turn your "restriction" into a "constitutive rule." Don't let them co-opt the argument.
  *   **Honor the Virtue Ethicists:** Acknowledge that *character* matters, even if your model focuses on *preferences*. Use the word "teleology" once to show you speak their language.
  *   **Ignore the Decision Theorist's Formalism:** If they ask for a proof, say "That's for the paper, but philosophically the point is..."
  *   **Body Language:** When conceding (see top), lean forward. When defending the core claim, sit back. Show you are flexible on application but firm on the logic.

  **GOOD LUCK.** You know the material. They want you to succeed. Just don't let them force you into a corner on the "Static Self."
