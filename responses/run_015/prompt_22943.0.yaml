answer: |-
  The standard Bayesian account of confirmation holds that evidence $E$ confirms hypothesis $H$ if and only if learning $E$ raises the probability of $H$. Formally, $E$ confirms $H$ for an agent with credence function $P$ just in case $P(H|E) > P(H)$. Equivalently, using Bayes' theorem, confirmation occurs when the Bayes factor—the likelihood ratio $P(E|H) / P(E|\neg H)$—exceeds one. This framework elegantly captures the intuition that evidence supports hypotheses that make that evidence probable. However, this account faces a severe difficulty regarding "old evidence": evidence already known by the agent prior to the formulation of the hypothesis.

  The problem arises because standard Bayesian conditionalization requires that once evidence is learned, it is assigned probability one. If $E$ is old evidence, the agent's current credence function assigns $P(E) = 1$. Consequently, conditionalizing on $E$ changes nothing; $P(H|E)$ collapses to $P(H)$, so the probability-raising condition fails. Simultaneously, the Bayes factor test fails. If $P(E) = 1$, then $P(E|H)$ must also be 1 (since $E$ is certain regardless of $H$), and likewise $P(E|\neg H) = 1$. The likelihood ratio becomes $1/1 = 1$, indicating neutral support rather than confirmation. This yields the absurd result that the anomalous perihelion of Mercury does not confirm General Relativity, simply because astronomers knew about the perihelion before Einstein formulated his theory.

  To resolve this, we should adopt the counterfactual prior solution. On this view, to assess whether old evidence $E$ confirms $H$, we do not use the agent's current credence function, where $P(E)=1$. Instead, we compute the confirmation relative to the credence function the agent *would* have had had they not yet learned $E$. This "ur-prior" or counterfactual prior assigns $P(E) < 1$, restoring the contingency required for confirmation. In this counterfactual state, General Relativity might raise the probability of the perihelion anomaly significantly above its baseline, yielding a Bayes factor greater than one.

  This approach is not a sleight of hand but a necessary clarification of what confirmation *is*. The legitimacy of using a counterfactual prior rests on distinguishing between the psychological event of updating beliefs and the logical relation of support. Bayesian epistemology aims to model rational support, not merely chronological surprise. If confirmation were strictly tied to the temporal order of discovery, scientific theories would gain no support from known phenomena, rendering much of scientific reasoning irrational. By shifting to the counterfactual prior, we isolate the structural connection between $H$ and $E$ from the accidental history of the agent's information intake. We are asking: "Does $H$ provide good reason for $E$?" not "Did $E$ surprise the agent?"

  The strongest objection to this view is that it relies on a fiction. The agent actually knows $E$; they cannot genuinely "un-know" it to adopt the counterfactual prior. Critics argue that because the agent cannot genuinely treat $E$ as uncertain, computing confirmation relative to a state they never actually occupied renders the confirmation relation vacuous or incoherent. If the agent never holds the prior used to calculate the confirmation, in what sense is the confirmation real for them?

  This objection fails because it conflates confirmation with psychological updating. Confirmation is a logical relation between propositions relative to a probability structure, not necessarily a description of a specific belief-change event in time. When we say Mercury's perihelion confirms General Relativity, we are asserting a fact about the explanatory power of Relativity, not a fact about Einstein's psychological surprise. The counterfactual prior allows us to model this explanatory power formally. The fact that the agent currently knows $E$ does not negate the logical strength of the link between $H$ and $E$; it merely obscures it within the current credence function. The counterfactual calculation reveals the support that is currently masked by certainty. Thus, the confirmation is real because the logical relation is real, even if the psychological state required to measure it directly is past.

  However, adopting this view entails significant costs. First, it requires abandoning strict actualism—the idea that confirmation facts are determined solely by the agent's actual current beliefs. We must accept that confirmation facts depend on hypothetical states, which introduces an element of idealization. Determining what an agent *would* have believed requires constraints on rational priors that are not always obvious. Second, it weakens the tight link between Bayesianism and personal belief history. Confirmation becomes less about how a specific agent should update and more about an objective logical structure that agents approximate.

  Despite these costs, the counterfactual prior solution is the most robust defense of Bayesianism against the problem of old evidence. It preserves the core mathematical machinery of Bayesian confirmation while correcting the misconception that rational support is identical to temporal surprise. By accepting the idealization of the counterfactual prior, we save the intuition that hypotheses are confirmed by their ability to explain the world, regardless of when we happened to look at it.
