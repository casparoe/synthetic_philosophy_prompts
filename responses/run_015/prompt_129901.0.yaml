  # Diagnostic Taxonomy of Composition

  **Root:** Is there a fact of the matter whether arbitrarily scattered parts—say, a pebble on Earth and one on Alpha Centauri—ever compose a single object?

  *   **YES** (Composition is unrestricted or nearly so)
      *   **Node:** Is the resulting object *nothing over and above* the parts taken together, or is it a distinct entity?
          *   **Nothing over and above (Identical):**
              *   **Leaf:** **Universalism with Composition-as-Identity**
              *   **Awkward Commitment:** You must accept that one thing can be many things, making standard counting incoherent.
          *   **Distinct Entity:**
              *   **Node:** Can this object cease to exist if its parts are scattered for a week and then reassembled? (Intermittent Existence)
                  *   **NO (It survives):**
                      *   **Leaf:** **Unrestricted Universalism**
                      *   **Awkward Commitment:** You must accept the existence of arbitrary gerrymandered objects, such as a "trout-turkey" composed of a trout's front half and a turkey's back half.
                  *   **YES (It ceases to exist):**
                      *   **Leaf:** **Unnamed (Intermittent Universalism)**
                      *   **Awkward Commitment:** You must accept that composition is unrestricted, yet ordinary objects blink out of existence during temporary disassembly despite their parts persisting.

  *   **NO** (Composition is restricted or never occurs)
      *   **Node:** Do *any* pluralities of simples ever compose a further object, even when tightly bonded (e.g., atoms in a molecule)?
          *   **NO** (Composition never occurs)
              *   **Node:** Is an ordinary sentence like "There is a chair in the room" strictly false?
                  *   **YES:**
                      *   **Leaf:** **Eliminative Nihilism**
                      *   **Awkward Commitment:** You must treat all ordinary object talk as a systematic error theory, implying that you yourself do not exist.
                  *   **NO:**
                      *   **Leaf:** **Arrangement-only Nihilism**
                      *   **Awkward Commitment:** You must maintain that while chairs don't exist, the claim "There is a chair" is true only as a shorthand for "There are simples arranged chair-wise."
          *   **YES** (Composition occurs sometimes)
              *   **Node:** Can an object survive the complete, gradual replacement of all its parts over time? (Continuity through Replacement)
                  *   **NO:**
                      *   **Leaf:** **Unnamed (Mereological Essentialist Restrictionism)**
                      *   **Awkward Commitment:** You must accept that you cease to exist the moment you lose a single cell or hair, despite psychological and biological continuity.
                  *   **YES:**
                      *   **Node:** Is a hollow sphere (or a block of Swiss cheese) one object with missing parts, or only smaller objects arranged with empty space between them? (Gappy Objects)
                          *   **Only smaller objects (No gaps allowed):**
                              *   **Leaf:** **Contact-based Restrictionism**
                              *   **Awkward Commitment:** You must deny the existence of most macroscopic objects, since modern physics suggests fundamental particles never truly touch.
                          *   **One object (Gaps allowed):**
                              *   **Node:** If composition is restricted, is the decisive factor spatial contiguity, life or organic function, causal-functional integration, or something else? (The Restriction Condition)
                                  *   **Life or Organic Function:**
                                      *   **Leaf:** **Life-based (Organicist) Restrictionism**
                                      *   **Awkward Commitment:** You must deny that artifacts like statues or ships exist, granting ontological privilege solely to living organisms.
                                  *   **Causal-Functional Integration:**
                                      *   **Leaf:** **Causal-integration Restrictionism**
                                      *   **Awkward Commitment:** You must accept vague ontological boundaries, as causal integration comes in degrees without a sharp cutoff.

  ***

  ### Diagnostic Analysis

  **Indistinguishable Leaves:**
  The cases provided cannot genuinely separate **Unrestricted Universalism** from **Universalism with Composition-as-Identity**. Both positions answer "Yes" to every case judgment regarding *when* composition occurs (scattered parts, continuity, gappy objects, intermittency). Their divergence is purely metaphysical (what composition *is*), not diagnostic via case intuition. A student could hold either position while traversing the exact same path through this taxonomy.

  **Unoccupied Branch Combinations:**
  1.  **Universalism + No Gappy Objects:** This branch is **incoherent**. If composition is unrestricted (scattered parts compose), then spatial gaps between parts cannot prevent composition. A universalist who denies gappy objects contradicts their own root commitment.
  2.  **Restrictionism + No Continuity + Contact Condition:** This combination is **unattractive but coherent**. It posits that objects only exist when parts touch *and* never survive replacement. It is rarely defended because it compounds the instability of contact physics with the extreme fragility of mereological essentialism, offering no compensatory theoretical benefit.
  3.  **Nihilism + "Yes" to Ordinary Truth:** This is occupied by **Arrangement-only Nihilism**, but the gap lies in *why* it is true. The taxonomy does not separate fictionalism (talk is useful but false) from paraphrase (talk is literally true about arrangements). This gap is **unexplored** in this diagnostic, as both yield the same case judgments.

  **Note on Intermittent Existence:**
  While "Intermittent Existence" is listed as a diagnostic branch, in practice it tracks closely with "Continuity through Replacement." Most views that deny continuity (Essentialists) also deny intermittency. The taxonomy isolates it only under Universalism to generate the "Unnamed" leaf, as Restrictionists who deny continuity are already filtered out at the "Continuity" node.
