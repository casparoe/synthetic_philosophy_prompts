answer: |-
  There is no single, canonical proper name for this specific configuration in the standard literature (unlike, say, "The Gettier Problem" or "The Duhem-Quine Thesis"). However, it is a recognized structural issue that sits at the intersection of **Bayesian confirmation theory**, **the data-phenomena distinction**, and **the theory-ladenness of observation**.

  If you require a label for precise discourse, the most accurate descriptive term currently in circulation is **"The Signal-Noise Boundary Problem"** or **"Evidential Reclassification."** In the context of Bayesian model selection, it is sometimes treated as a dispute over **Likelihood Function Specification**.

  Below is a precise mapping of this phenomenon, its relationship to established problems, and the boundary conditions required to distinguish genuine confirmation from mere conceptual reshuffling.

  ### 1. Structural Analysis: What Is This Phenomenon?

  Your pattern describes a situation where the confirmation of $T_2$ over $T_1$ relies not on $P(D|T_2) > P(D|T_1)$ given a fixed $D$, but on a disagreement over the **ontological status of components of $D$**.

  In Bayesian terms, standard confirmation assumes the evidence $E$ is fixed. Here, the "evidence" is not fixed; its *partitioning* is theory-dependent.
  *   **$T_1$ Model:** $D = S + \epsilon$, where $F \in \epsilon$ (noise).
  *   **$T_2$ Model:** $D = S' + \epsilon'$, where $F \subset S'$ (signal).

  The confirmation claim arises because $T_2$ offers a higher likelihood for the *reclassified* dataset ($D_{reclass}$), while $T_1$ is penalized for assigning low probability to $F$ *if* $F$ is assumed to be signal. The dispute is not about the raw measurements, but about the **data model** used to translate measurements into evidence.

  ### 2. Relation to Established Problems

  You correctly noted that this is distinct from the classic "Problem of Old Evidence," but it is useful to specify exactly how.

  #### A. Vs. The Problem of Old Evidence (Glymour, 1980)
  *   **Old Evidence Problem:** Concerns *temporal* priority. How can $E$ confirm $T$ if $E$ was known before $T$ was formulated? (Solution usually involves logical omniscience or counterfactuals).
  *   **Your Pattern:** Concerns *categorical* status. The timing is irrelevant. The issue is that $T_1$ and $T_2$ disagree on whether $F$ belongs in the set of "things to be explained" (phenomena) or "things to be filtered" (error).
  *   **Distinction:** In Old Evidence, $E$ is fixed. In your pattern, the *definition* of $E$ is the variable.

  #### B. Vs. Theory-Ladenness of Observation (Hanson, Kuhn)
  *   **Theory-Ladenness:** Usually refers to high-level interpretation (e.g., seeing a "pendulum" vs. "swinging stone").
  *   **Your Pattern:** This is **Theory-Laden Data Processing**. It occurs lower down, at the level of statistical reduction and error modeling. It is more granular than Kuhnian incommensurability because the raw measurements are shared; the disagreement is about the *filtering algorithm*.
  *   **Relation:** This is a specific, formalizable subset of theory-ladenness often discussed in the context of **Bogen and Woodward's Data-Phenomena Distinction**. $T_1$ claims $F$ is data but not a phenomenon; $T_2$ claims $F$ is data *and* a phenomenon.

  #### C. Vs. Underdetermination
  *   **Underdetermination:** $T_1$ and $T_2$ entail the same observational consequences.
  *   **Your Pattern:** $T_1$ and $T_2$ entail *different* observational consequences because they predict different *distributions* of $F$. $T_1$ predicts $F$ should be random/unstructured (noise); $T_2$ predicts $F$ should have structure (signal).
  *   **Distinction:** It is not that the theories fit the data equally well; it is that they fit *different descriptions* of the data.

  ### 3. Proposed Label and Definition

  Since no canonical name exists, I propose using **"The Signal-Noise Reassignment Problem"** (SNRP).

  **Definition:** SNRP occurs when two competing theories share a raw dataset but disagree on the partitioning of that dataset into *systematic variance* (signal) and *random error* (noise), such that the rival theory claims confirmation by reclassifying variance the incumbent theory treats as error into meaningful explanatory targets.

  **Boundary Conditions:**
  1.  **Shared Measurement:** Both theories accept the raw instrumentation readings (no dispute over calibration).
  2.  **Divergent Data Models:** The theories employ different statistical or conceptual models to process raw readings into evidence.
  3.  **Confirmation via Reclassification:** The primary argument for $T_2$ is its ability to "explain" $F$, which $T_1$ dismissed.

  ### 4. Distinguishing from Ad Hoc Adjustments and Immunization

  This is the critical epistemic danger zone. When $T_2$ reclassifies noise as signal, it risks **overfitting** (in statistical terms) or **ad hoc rescue** (in philosophical terms). How do we distinguish genuine confirmation from "making the data fit"?

  #### A. Vs. Immunization Strategies (Lakatos)
  *   **Immunization:** $T_1$ treats $F$ as noise to *protect* the core from falsification. This is a "degenerative" move if done solely to save the theory.
  *   **SNRP:** $T_2$ treats $F$ as signal to *expand* the core.
  *   **The Risk:** $T_2$ might be engaging in **"Ontological Inflation."** By treating every anomaly as signal, $T_2$ becomes unfalsifiable (everything confirms it).
  *   **The Test:** For $T_2$'s reclassification to count as genuine confirmation, the *new* signal $F$ must exhibit **independent structure**. If $F$ is truly signal, it should correlate with other variables or predict *new* data $D_{new}$ that $T_1$ cannot accommodate even as noise.

  #### B. Vs. Auxiliary Hypothesis Adjustment
  *   **Auxiliary Adjustment:** Changing a background assumption to make $T$ fit $D$.
  *   **SNRP:** Changing the *definition of D itself*.
  *   **Boundary:** If $T_2$ merely adds a parameter to fit $F$ without independent justification for that parameter's physical reality, it is an auxiliary adjustment. If $T_2$ provides a mechanism that *requires* $F$ to be signal (e.g., a cognitive mechanism that *produces* outliers), it is a structural reclassification.

  ### 5. When Is It Genuine Confirmation? (The Resolution Conditions)

  For the reclassification of $F$ from noise to signal to constitute genuine confirmation of $T_2$ (rather than just a convenient redescription), three conditions typically must be met in the literature (drawing on Mayo's Error Statistics and Bayesian Model Selection):

  1.  **Severe Testing of the Noise Model:** It must be shown that $T_1$'s classification of $F$ as noise is *false*, not just less convenient. This usually requires demonstrating that $F$ violates the statistical properties of the noise model $T_1$ relies on (e.g., $F$ is not normally distributed, or $F$ correlates with experimental conditions).
  2.  **Explanatory Unification:** $T_2$ must show that treating $F$ as signal simplifies the overall account. If $T_2$ explains $F$ but requires ten new ad hoc parameters to do so, it is not confirmed (Bayesian Occam's Razor).
  3.  **Novel Consequences of the Reclassification:** The reclassification itself must yield *new* predictions. If $F$ is a cognitive state transition (as in your psychology example), then manipulating that state should change $F$ in predictable ways. If $F$ remains static despite manipulation, $T_2$'s reclassification is likely spurious.

  ### Summary

  You have identified a specific, named gap in the literature, though it lacks a single "Proper Name." It is best described as **The Signal-Noise Boundary Problem**, a specific modality of **Theory-Laden Data Processing**.

  It differs from the **Problem of Old Evidence** because it concerns the *constitution* of evidence rather than its *temporal availability*. It differs from **Underdetermination** because the theories disagree on the *nature* of the data, not just the explanation of it. It differs from **Immunization** because it expands the explanatory target rather than shrinking it.

  **Recommendation for your argument:**
  If you are formalizing this, treat it as a dispute over **Likelihood Specification**.
  $$ P(D|T) \text{ is ill-defined without } P(D|M, T) $$
  Where $M$ is the **Data Model** (the rule separating signal from noise). $T_1$ and $T_2$ imply different $M$s. Confirmation requires warrant for $M_2$ over $M_1$, not just $T_2$ over $T_1$. Without independent warrant for $M_2$, the confirmation is circular.
