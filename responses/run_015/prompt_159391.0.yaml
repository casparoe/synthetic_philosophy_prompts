  7.  **Final Polish:** Check against the "Brainstorm first" instruction. Ensure the "Audit" is distinct. Make sure the CMB point is integrated.

      *Wait, one nuance on 1 vs 2:* The user says "I currently hold both of these at once without knowing whether the second one quietly kills the first."
      *Philosophical verdict:* 2 does *not* kill 1. 2 kills the idea that "Existence = Simultaneity with my now." But 1 (Block) just says "Existence = Being part of the manifold." I need to explain this clearly so she can write Ines defending it.

      *Wait, one nuance on 4:* Ines feels Block is *worse* than determinism. Why? Because determinism allows the future to be "open" until caused, whereas Block says it's "already there." This is the "Fixity" vs. "Causal Determination" distinction. I need to tell her that philosophically, they are the same threat, but phenomenologically different. To be consistent, Ines must concede they are the same threat.

