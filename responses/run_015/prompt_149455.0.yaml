      *   *Skinnerian:* Operant conditioning. Trial and error happens within the lifetime. Try behavior $\rightarrow$ get reward/punishment $\rightarrow$ adjust probability of behavior. No internal modeling of *why*, just association.
      *   *Popperian:* Internal hypothesis testing. "Let my hypotheses die in my stead." Can simulate outcomes before acting. Requires some internal model of the world.
