answer: |-
  **OFFICE OF ANTICIPATORY AUTONOMY**
  **Form UC-1: Application for Anticipatory Self-Binding Order**
  **OMB Control No. 000-UC-1**

  **PURPOSE:** Use this form to legally obligate a future entity to refrain from specific actions, regardless of said entity's contemporaneous consent. By filing, the **Filing Party** (the applicant at Time T1) seeks to restrict the **Bound Party** (the applicant at Time T2). The Office of Anticipatory Autonomy (OAA) processes these requests under the presumption that autonomy is maximized by restricting future choice.

  **DEFINITIONS:**
  **1. Filing Party:** The biological or corporate entity submitting this form.
  **2. Bound Party:** The biological or corporate entity existing at the time of enforcement. The Filing Party and Bound Party are treated as distinct legal persons for purposes of enforcement, though identical for purposes of liability.
  **3. Enforcer:** A third party designated in Section 4 who retains full agency to ignore the Bound Party's pleas.

  **PART I: INDIVIDUAL APPLICANTS**

  **Section 3: Continuity Verification.**
  Attach Continuity Worksheet C. Calculate the percentage of psychological overlap between the Filing Party and the projected Bound Party based on memory retention, value stability, and neurotransmitter baseline.
  *   **Instruction:** If overlap is below 60%, the Order will be processed as a Bequest (Form B-9) or a Restraining Order against a Third Party. The OAA cannot bind a stranger.
  *   **Note:** If overlap exceeds 95%, the application may be voided under the *Resoluteness Clause*, as high continuity suggests the Filing Party is currently impaired by excessive certainty. See Instruction 3(b).

  **Section 4: Designation of Enforcer.**
  Name one (1) Enforcer. The Enforcer must certify they are not bound by this Order. The Enforcer is instructed to disregard any verbal, written, or telepathic requests from the Bound Party to lift the Order.
  *   **Liability:** The OAA guarantees compliance, not agreement. Successful enforcement is defined by the Bound Party's continued desire to violate the Order coupled with physical inability to do so. Distress signals from the Bound Party confirm operational success. No refunds are issued if the Bound Party ceases to desire the prohibited act.

  **Section 5: Cooling-Off and Resoluteness Periods.**
  Filings submitted within 72 hours of a regretted impulse are void (Cooling-Off Rule). Symmetrically, filings submitted while the Filing Party reports feeling "unusually resolute," "clear-headed," or "virtuous" are void (Resoluteness Clause). The OAA presumes valid consent occurs only during states of moderate ambivalence.

  **Section 9: Recursion and Second-Order Binding.**
  Check Box 9(a) to bind the Bound Party against filing Form UC-2 (Application for Release). Check Box 9(b) to bind the Bound Party against filing any future Form UC-1.
  *   **Warning:** Selecting Box 9(b) permanently revokes the entity's privilege to seek anticipatory autonomy. This restriction is self-entrenching.

  **PART II: COLLECTIVE AND INTERGENERATIONAL APPLICANTS**

  **Section 12: Entrenchment Schedule.**
  States, parties, and assemblies may bind successors. The duration of binding may exceed the natural lifespan of the Filing Party.
  *   **Consent Certification:** By signing, the Filing Party certifies that Bound Parties (including unborn citizens) would have consented had they been asked. The OAA accepts hypothetical consent as legally equivalent to actual consent where actual consent is temporally impossible.

  **Section 14: Exit Procedure.**
  To lift a Collective Order, the Bound Party must achieve a supermajority vote (67%+) AND pay the Release Fee.
  *   **Entrenchment:** The supermajority requirement itself cannot be amended without a supermajority vote. The OAA presumes entrenchment clauses protect themselves; a rule which cannot protect itself is not a rule.

  **FEE SCHEDULE**
  Filing Fee: $50.00 (Fixed).
  Release Fee: Variable. Calculated based on the Bound Party's demonstrated willingness to pay at Time T2.
  *   **Formula:** (Cost of Prohibited Act × Desperation Index) + Administrative Surcharge.
  *   **Note:** Fees are calibrated to ensure self-binding remains accessible to the prudent but prohibitive to the impulsive. Applicants whose later willingness to pay exceeds their liquidity will remain bound.

  **PRIVACY ACT NOTICE**
  The information provided on this form is used to construct a predictive model of the applicant's continuity. The OAA defines "Personhood" as a data string persistent across time intervals. By filing, you consent to the OAA treating your future iterations as assets of your current iteration. If the data string breaks, the person ceases to exist for purposes of relief, though not for purposes of obligation.

  **SIGNATURE**
  _________________________
  **Filing Party** (I understand that my signature binds a person I may no longer be.)

  **DATE**
  _________________________
