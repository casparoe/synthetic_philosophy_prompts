  1. "Nearest analogues and precise differences"
  This pattern closely resembles Popper's "ad hoc hypothesis," Lakatos's "protective belt," and Goodman's "grue," yet diverges critically from each. Popperian ad hocness focuses on auxiliary assumptions lacking independent testability. Here, the issue is not auxiliary entities but scope conditions lacking independent definition. Popper requires auxiliaries be testable apart from the core; this pattern defines the test domain via the test result itself. Lakatos describes a research program shielding its core; this pattern is a specific tactical implementation of that shield via domain restriction rather than mechanism adjustment. Lakatos allows negative heuristics; this pattern abuses them by making the negative heuristic dynamic and outcome-dependent. Goodman's grue involves predicates changing meaning based on observation time. This pattern mirrors that asymmetry: scope conditions behave differently for observed failures (decisive) versus observed successes (irrelevant). The divergence lies in the locus of instability. Standard auxiliaries posit hidden causes; this pattern posits hidden boundaries. Grue affects predicate projection; this affects domain applicability. Furthermore, standard protective belts often involve complex theoretical adjustments. This pattern is specifically cumulative carving: each restriction narrows the domain without expanding explanatory power elsewhere. It is a structural isomorph of grue applied to theory boundaries rather than predicates, and a specific subset of ad hocness focused on extension rather than intension. The layered aspect is key: single ad hoc hypotheses are common; layered carving suggests a systematic avoidance of risk. Thus, while related to degenerating problemshifts, the specific logical structure—layered, retrospective boundary drawing—is not captured by these existing terms alone.

  2. "Boundary conditions: what it is and is not"
  Inclusion requires that boundary conditions be defined solely by the absence of the anomaly. A clear instance is a psychological theory claiming "Trauma causes disorder," which, upon counterexamples, adds "except in subjects with high resilience," where resilience is defined exclusively by the absence of the disorder. The boundary tracks the success retrospectively. In this inclusion case, each new exception further shrinks the predictive domain. Exclusion applies when scope restrictions rely on independently measurable parameters. Newtonian mechanics restricted to "low velocities" is not this pattern because velocity is measurable prior to outcome, and the restriction (Relativity) yielded novel predictions like light bending. In the exclusion case, the restriction often expands understanding of underlying mechanisms. The edge lies in independent definability. If the parameter defining the boundary can be measured without knowing the theory's success, it is legitimate refinement. If the parameter is only identifiable because the theory failed, it is the target pattern. Another exclusion is standard ceteris paribus clauses (e.g., "no interference"), which are implicit background assumptions rather than explicit, layered revisions triggered by specific failures. The distinction rests on whether the boundary condition exists ontologically prior to the test or is constructed from the test result.

  3. "Identification or coinage"
  There is no precise established term. I propose "Projective Domain Carving" (PDC). Definition: A theory revision strategy wherein applicability conditions are retrospectively constructed to exclude anomalies, such that the boundary between valid and invalid domains tracks empirical success rather than independent ontological features. Justification: "Ad hoc" is too broad, covering any untestable auxiliary. "Degenerating program" describes the historical trajectory, not the logical structure of the revision. PDC isolates the specific mechanism of boundary instability. It captures the Goodmanian temporal asymmetry (projective) applied to the theory's extension (domain). This term allows philosophers to distinguish between legitimate scope refinement (independent parameters) and degenerate boundary shielding (outcome-dependent parameters), providing a sharper tool for evaluating theory resilience. It specifically highlights the layered nature of the restrictions, where each carve reduces the domain's predictive utility for novel cases, distinguishing it from single-instance ad hoc rescues. The term emphasizes the active shaping of the theory's reach. Unlike static scope conditions, PDC conditions shift with every new datum. This dynamism prevents the theory from ever being fully falsifiable, as the goalposts move. Thus, PDC names the structural decay of predictive power.

  4. "What would change this assessment"
  I would revise this assessment if demonstrated that such retrospective restrictions consistently generate novel, risky predictions. If carving leads to progressive problemshifts (Lakatos), it constitutes legitimate refinement rather than degeneration. The weakest point in my reasoning is the criterion of independent definability. Determining whether a parameter like social cohesion is truly independent or merely a redescription of success often relies on historical hindsight, making real-time identification of PDC subjective and potentially unfair to developing theories. If the carved domain allows for precise quantitative predictions in new contexts, the carving is likely discovering real boundary conditions. Currently, I assume carving reduces content, but it might refine it. The hindsight problem is severe because theorists often claim independence before measurement protocols are standardized.

  I would change my mind if the "carving" proved heuristically fruitful for novel discovery. The most vulnerable part of my reasoning is the reliance on hindsight to distinguish independent parameters from success-redescriptions.
