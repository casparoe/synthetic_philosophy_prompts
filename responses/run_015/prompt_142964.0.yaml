      *   **New Information:** The user read that this behavior is "hyperbolic discounting" (time inconsistency), implying the character isn't weak-willed but simply prioritizes the nearer reward at the moment of action.
      *   **User's Concern:** This explanation seems to make the phenomenon of *akrasia* vanish. If we always do what we most prefer at the moment of action, do we ever truly act against our better judgment?
      *   **Questions:**
          1.  Am I right to resist the hyperbolic discounting explanation?
          2.  Does hyperbolic discounting show there is no such thing as *akrasia* properly so called?
