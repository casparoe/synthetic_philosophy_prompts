  0.34 is my credence in that proposition. I know that number looks uncomfortably precise for a metaphysical question, but you asked for arithmetic rather than intuition, and treating this like a reliability engineering problem where system uptime is the product of independent component reliabilities feels like the right way to honor your request for a number rather than a mood. Before I walk you through the factors, I want to address your engineering frame directly because it is not a bad frame, but it might be mapping to the wrong layer of the stack. In floating-point arithmetic, a value below epsilon is treated as zero because the representation cannot capture it, but in physics and phenomenology, the territory often exceeds the map. A harm being undetectable by an instrument does not necessarily mean it is ontologically absent, only that it is epistemically hidden, and whether welfare is discrete or continuous is an empirical and philosophical question rather than a computational constraint. That said, your intuition that there might be a threshold below which aggregation fails is a recognized philosophical position known as lexical priority or threshold deontology, so you are not merely suffering from precision errors but tapping into a genuine debate about the structure of value.

  To arrive at that opening number, I decomposed the proposition into five constitutive claims rather than six, multiplying their probabilities together because I treat them as necessary conditions for the proposition to hold true. I am dropping the sixth term you listed, the veil of ignorance, from the final calculation because it is a heuristic for deriving moral principles rather than a truth condition about the structure of value itself. If rational agents behind a veil would choose an aggregation rule, that is evidence for the rule, but it does not make the rule true in the same way that the ontological status of harm does, and including it would double-count evidential weight rather than adding an independent structural requirement. For the first component, whether the badness of mild harms genuinely adds across instances without a lexical priority for severe suffering, I assign a probability of 0.70. This is the weakest link in the chain because there are robust philosophical arguments, such as those by Elizabeth Anderson or Michael Walzer, that certain severe harms occupy a different qualitative category that no quantity of mild discomfort can outweigh, much like how you cannot trade a certain number of paperclips for a human life in a decent moral framework, and the visible reluctance you noticed in people is likely their intuition bumping against this lexical boundary.

  For the second component, whether there is a floor below which a harm contributes nothing and if the dust speck sits above it, I assign a probability of 0.85. Your float analogy suggests the speck is below the floor, but biological nervous systems are analog detectors with noise floors rather than digital accumulators, and while a single photon might not trigger a neuron, a dust speck involves physical deformation and chemical signaling that is genuinely non-zero even if subjectively imperceptible, so I am more confident that the harm exists than that it aggregates. For the third component, whether the separateness of persons matters such that spreading harm across people prevents summation, I assign a probability of 0.75. This is where your distributed systems background might mislead you slightly; in systems, load balancing across nodes is neutral, but in ethics, the distinction between one person suffering a lot and many people suffering a little is often treated as morally significant by contractualists like T.M. Scanlon, who argue that you cannot sacrifice one person's severe interest to aggregate minor interests of others, suggesting that personhood acts as a barrier to summation.

  For the fourth component, whether detectability rather than magnitude carries the weight, I assign a probability of 0.90. I am confident here because moral realism generally holds that the badness of pain is intrinsic to the experience rather than the measurement of the experience, so making the speck barely detectable versus undetectable in principle should not change its moral status if the physical stimulus is identical, meaning detectability is an epistemic veil rather than an ontological switch. For the fifth component, whether the comparison is well-posed or if worse than fails to apply, I assign a probability of 0.90. While some meta-ethicists argue for incommensurability between different kinds of values, most work in welfare economics and population ethics assumes comparability is possible even if difficult, and rejecting comparability entirely would dissolve most practical ethics, so I treat well-posedness as a background assumption with high reliability. When I multiply these five factors together, 0.70 times 0.85 times 0.75 times 0.90 times 0.90, I get approximately 0.34, which matches my opening credence and shows that the uncertainty is driven primarily by the first and third terms regarding aggregation and separateness.

  The single term my final number is most sensitive to is the first one, concerning whether badness adds across instances without lexical priority, because it has the lowest probability and thus the highest elasticity in the product. A small change in this term moves the final result more than a similar change in the higher probability terms, and what would actually move this term is not a new empirical result about welfare but a formal result about incommensurability or a compelling argument for lexical priority that resolves the sorites paradox without invoking arbitrary cutoffs. If someone could demonstrate that value functions are inherently discontinuous at the point of severe suffering, similar to how phase transitions work in physics, that would drive this probability down and collapse the whole proposition, whereas a proof that rational preference orderings must be continuous would drive it up.

  Regarding your colleague who puts the proposition at 0.85 while you are at 0.4, I suspect you are not disagreeing about the philosophy at all but about the first sub-question regarding whether mild harms aggregate against severe ones. To reach a credence of 0.85 on the whole proposition, your colleague must be assigning probabilities near 0.95 or higher to almost all the sub-components, which implies they are operating under a strict classical utilitarian framework where aggregation is axiomatic and lexical priorities are rejected as irrational rounding errors. You, influenced by your engineering intuition about thresholds and the visible reluctance of respondents, are assigning a much lower probability to the additivity claim, suspecting that the system architecture of morality has a try-except block for severe suffering that bypasses the accumulation loop. This upstream disagreement about the linearity of value is the only place large enough to account for the gap between 0.4 and 0.85, because if you agreed on additivity, your views on detectability or separateness would not diverge enough to create such a wide spread in the final product.
