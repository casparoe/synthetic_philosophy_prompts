  | **5. Shrinkage** | As evidence accumulates, the width of the credal set must converge to zero uniformly across hypotheses. | Width can remain non-zero forever if the evidence remains fundamentally ambiguous or incomplete. | **Case:** Interval Tournament (score = hit − width penalty).<br>**Strict Prediction:** Winners converge to points.<br>**Imprecise Prediction:** Winners retain non-degenerate intervals. |

