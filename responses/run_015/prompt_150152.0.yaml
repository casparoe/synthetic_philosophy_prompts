prompt: |-
  hey — I run a weekly decision-theory meetup, mostly working programmers, usually 14–18 people, and Ive got a 75-minute slot next Tuesday. I want to spend it on superrationality, but I dont want to stand up and explain it and then have everyone nod. I want them to feel how strong the pull is in the clean case, and then feel exactly where it breaks.

  The thing I keep going in circles on is that "we're both rational" isn't the premise actually doing the work, and I want the game to expose that. So here's what I'd like: build the session around three different matchings, and dont name the idea or give any framing until the debrief:

  - **Clone**: you and your partner get word-for-word identical sheets, identical payoff matrix, and each of you is told the other got exactly what you got.
  - **Near-clone**: identical sheets except that one of you has an extra line at the bottom the other cant see. Both of you are told that such a line exists and that exactly one of you has it; nobody is told what it says.
  - **Mirror**: identical instructions, but your partners payoff matrix isn't yours — same structure, different numbers — and you can read theirs while they read yours.

  So in one condition the outcomes match but the information doesn't, in another the information matches but the payoffs dont, and so on. People choose in all three, silently and simultaneously, and I want points at the end that dont involve money — chocolate, or picking next week's paper, something like that.

  Give me: the actual sheet texts and payoff numbers, a way to order the three rounds so nobody figures out what I'm up to mid-session, and a debrief that maps what happened onto the difference between outcome symmetry, procedural symmetry, and epistemic symmetry. Also tell me what will predictably go wrong — I'm certain at least one person defects just to be a jerk and I dont know how to stop that from eating the session — and be honest about what the game cant show. My real worry is that even the clone round doesn't give me actual clones, so the whole exercise might understate the pull rather than demonstrate it.

  Answer in American English please, and keep it practical: I have to run this on Tuesday.
