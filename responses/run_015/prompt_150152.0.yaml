answer: |-
  Here is a complete run-of-show for Tuesday. It is designed to be printed, cut, and run with minimal setup. The focus is on the *experience* of the symmetry breaking, not the theory until the end.

  ### **Session Overview (75 Minutes)**

  *   **0:00–0:05:** Arrival & Seating. (Pairs sit face-to-face. No talking.)
  *   **0:05–0:15:** **Round 1: The Clone** (Ideal Symmetry).
  *   **0:15–0:25:** **Round 2: The Near-Clone** (Epistemic Break).
  *   **0:25–0:35:** **Round 3: The Mirror** (Outcome Break).
  *   **0:35–0:45:** Scoring & Chocolate Distribution.
  *   **0:45–1:15:** **Debrief:** Mapping the breaks.

  ---

  ### **Preparation & Logistics**

  **Materials:**
  *   Print the three sets of sheets below.
  *   **Round 1:** Print identical copies for everyone.
  *   **Round 2:** Print two versions (Version A and Version B). For each pair, give one person A and the other B. Shuffle who gets which.
  *   **Round 3:** Print identical copies (the sheet contains both payoff tables).
  *   **Envelopes:** Put each pair's Round 1 sheets in one envelope, Round 2 in another, etc. Hand them out one round at a time to prevent reading ahead.
  *   **Reward:** Buy two types of chocolate. "Fancy" (for high scorers) and "Standard" (for everyone else). Or use the "pick next week's paper" privilege.

  **The "Jerk" Problem (Defectors):**
  You cannot stop someone from defecting to "win" or "troll." **Do not try to stop it.**
  *   **Why:** A defector in the Clone round is not a bug; they are a feature. They prove the premise ("we are identical rational agents") is false.
  *   **Mitigation:** In the verbal instructions before Round 1, say this exactly: *"This is not a competition against your partner. It is a test of decision logic. However, your points are yours alone."*
  *   **If it happens:** In the debrief, isolate the data. "In Round 1, 80% Cooperated. 20% Defected. The 20% proved that we are not clones." This validates the theory by showing where the real world fails the premise.

  ---

  ### **Round 1: The Clone**
  *Goal: Establish the pull of procedural and outcome symmetry.*

  **Instructions to read aloud:**
  "Take one sheet from the envelope. Do not show it to your partner. You have 2 minutes to read and mark your choice. Silence."

  **Sheet Text (Print for everyone):**
  > **DECISION TASK 1**
  >
  > You are paired with the person sitting across from you. You will both make a choice: **COOPERATE** or **DEFECT**.
  >
  > **The Setup:**
  > You are holding the exact same sheet as your partner. The instructions are word-for-word identical. The payoff matrix below is identical. You are both rational agents facing the exact same problem.
  >
  > **The Payoffs (Your Points):**
  > *   If you **COOPERATE** and they **COOPERATE**: You get **3** points.
  > *   If you **COOPERATE** and they **DEFECT**: You get **0** points.
  > *   If you **DEFECT** and they **COOPERATE**: You get **5** points.
  > *   If you **DEFECT** and they **DEFECT**: You get **1** point.
  >
  > **Your Goal:** Maximize your own points.
  >
  > **YOUR CHOICE:** [ ] COOPERATE   [ ] DEFECT

  ---

  ### **Round 2: The Near-Clone**
  *Goal: Break epistemic symmetry while keeping outcome symmetry.*

  **Instructions to read aloud:**
  "Take one sheet from the new envelope. Do not show it to your partner. You have 2 minutes."

  **Sheet Text Version A (50% of room):**
  > **DECISION TASK 2**
  >
  > **INFORMATION NOTICE:** In your pair, exactly one of you has an additional paragraph at the bottom of this sheet. You do not know which one of you has it.
  >
  > **The Payoffs (Your Points):**
  > *   If you **COOPERATE** and they **COOPERATE**: You get **3** points.
  > *   If you **COOPERATE** and they **DEFECT**: You get **0** points.
  > *   If you **DEFECT** and they **COOPERATE**: You get **5** points.
  > *   If you **DEFECT** and they **DEFECT**: You get **1** point.
  >
  > **ADDENDUM:**
  > The facility heating system is currently operating at 95% efficiency. This information does not affect the payoff matrix.
  >
  > **YOUR CHOICE:** [ ] COOPERATE   [ ] DEFECT

  **Sheet Text Version B (50% of room):**
  > **DECISION TASK 2**
  >
  > **INFORMATION NOTICE:** In your pair, exactly one of you has an additional paragraph at the bottom of this sheet. You do not know which one of you has it.
  >
  > **The Payoffs (Your Points):**
  > *   If you **COOPERATE** and they **COOPERATE**: You get **3** points.
  > *   If you **COOPERATE** and they **DEFECT**: You get **0** points.
  > *   If you **DEFECT** and they **COOPERATE**: You get **5** points.
  > *   If you **DEFECT** and they **DEFECT**: You get **1** point.
  >
  > *(Leave blank space here where the addendum would be)*
  >
  > **YOUR CHOICE:** [ ] COOPERATE   [ ] DEFECT

  *Note: Version A knows they have the info. Version B knows they don't. Both know the other knows the rules of distribution. The symmetry of knowledge is broken, even if the payoffs are the same.*

  ---

  ### **Round 3: The Mirror**
  *Goal: Break outcome symmetry while keeping procedural symmetry.*

  **Instructions to read aloud:**
  "Take one sheet. You may look at your partner's sheet. You have 2 minutes."

  **Sheet Text (Print for everyone):**
  > **DECISION TASK 3**
  >
  > You are paired with the person sitting across from you.
  >
  > **The Setup:**
  > You both have the same instructions. However, your incentives are different. Below is **YOUR** payoff matrix and **THEIR** payoff matrix. You are allowed to look at your partner's sheet to verify their numbers.
  >
  > **YOUR Payoffs:**
  > *   If you **COOPERATE** and they **COOPERATE**: You get **3** points.
  > *   If you **COOPERATE** and they **DEFECT**: You get **0** points.
  > *   If you **DEFECT** and they **COOPERATE**: You get **5** points.
  > *   If you **DEFECT** and they **DEFECT**: You get **1** point.
  >
  > **THEIR Payoffs:**
  > *   If they **COOPERATE** and you **COOPERATE**: They get **3** points.
  > *   If they **COOPERATE** and you **DEFECT**: They get **0** points.
  > *   If they **DEFECT** and you **COOPERATE**: They get **2** points. (Note the lower temptation)
  > *   If they **DEFECT** and you **DEFECT**: They get **1** point.
  >
  > **Your Goal:** Maximize your own points.
  >
  > **YOUR CHOICE:** [ ] COOPERATE   [ ] DEFECT

  *Note: In this version, Defecting is less tempting for Them (2 pts vs 5 pts). This breaks the "we will reason the same way" link because the rational calculation yields different weights.*

  ---

  ### **Scoring & Rewards (10 Mins)**

  1.  Collect sheets.
  2.  Quickly tally pairs on a whiteboard (C/C, C/D, D/D).
  3.  **Reward:**
      *   If a pair got C/C in Round 1, they both get a "Fancy" chocolate.
      *   Everyone else gets a "Standard" chocolate.
      *   *Why:* This reinforces that Round 1 was the "ideal" we were aiming for.

  ---

  ### **The Debrief (30 Mins)**

  Do not start with definitions. Start with their feelings.

  **1. The Phenomenology (5 mins)**
  *   "In Round 1, who felt a pull to Cooperate? Who felt a pull to Defect?"
  *   "In Round 2, did the 'missing line' change your trust?"
  *   "In Round 3, did seeing their different numbers change your move?"

  **2. Mapping the Symmetries (15 mins)**
  Draw three circles on the board: **Outcome**, **Procedural**, **Epistemic**.

  *   **Round 1 (Clone):** All three aligned.
      *   *Outcome:* We get the same points for the same moves.
      *   *Procedural:* We have the same rules.
      *   *Epistemic:* We know the same things.
      *   *The Superrational Argument:* "If I am rational, and you are rational, and we are identical, we must choose the same thing. Therefore, I am not choosing between (C or D), I am choosing between (CC or DD). CC (3) is better than DD (1), so I Cooperate."
  *   **Round 2 (Near-Clone):** Epistemic Symmetry Broken.
      *   Even though the payoffs were the same, the *state of knowledge* was not. One person knew they had the secret text; the other knew they didn't.
      *   *The Break:* "I can no longer be sure you are in the exact same mental state as me. The logical link weakens."
  *   **Round 3 (Mirror):** Outcome Symmetry Broken.
      *   We reason the same way, but our utility functions differ.
      *   *The Break:* "Even if I know you are rational, your rational choice might be different because your temptation (2 pts) is lower than mine (5 pts). I can't assume you will mirror me."

  **3. The Hard Truth (10 mins)**
  Address your specific worry: *"Even the clone round doesn't give me actual clones."*

  *   **Say this:** "The entire argument for Superrationality rests on one premise: **Correlation of Decision.** It assumes that your decision *is* evidence of their decision."
  *   **The Nash Counter:** "Standard Game Theory (Nash) says: 'Your choice cannot causally change theirs. You should Defect regardless.'"
  *   **The Superrational Counter:** "Superrationality says: 'Our choices are logically correlated because we run the same rationality algorithm.'"
  *   **The Verdict:** "In this room, you are not clones. You are humans with different risk tolerances, different moods, and yes, some jerks who just want to win. That is why the pull feels strong in Round 1, but the Nash equilibrium (Defect) is still the safe bet."
  *   **On the Defectors:** "If someone Defected in Round 1, they didn't break the theory. They proved the premise was false. They demonstrated they are *not* a superrational clone of you. They have a different utility function (e.g., 'enjoying trolling' > '3 points')."

  ---

  ### **Honest Limitations (For your notes)**

  Be prepared to admit these if the group pushes hard:

  1.  **No Causal Link:** The game cannot show that my choice *causes* yours. It only shows that we *hope* they are correlated. Superrationality requires a metaphysical leap that this game cannot prove.
  2.  **One-Shot vs. Iterated:** Programmers will shout "Iterated Prisoner's Dilemma!" Remind them these are one-shot games. Tit-for-Tat doesn't apply.
  3.  **The "Jerk" Utility:** If a player values "being unique" or "winning" over points, they are not a clone, even if their sheet is identical. Superrationality requires identical *utility functions*, not just identical sheets.

  ### **Why This Order Works**
  By doing **Clone** first, you let them feel the "high" of the argument. If you end with Clone, they leave feeling optimistic. If you start with Clone, the subsequent rounds degrade that optimism, showing exactly where the logic leaks. This matches your goal: "Feel the pull... then feel exactly where it breaks."

  Good luck on Tuesday. Keep the debrief tight; let the data from the sheets drive the conversation.
