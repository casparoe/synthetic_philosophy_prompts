  **MINISTRY OF CIVIC ALGORITHMIC INTEGRITY**
  **PUBLIC NOTICE: NATIONAL TRANSPARENCY REGISTER (NTR)**
  **FAQ SERIES 44-B: COMPLIANCE AND INTERACTION PROTOCOLS**

  **1. What is the purpose of the National Transparency Register?**
  The NTR ensures optimal civic outcomes by mandating the public filing of all citizen decision procedures. By rendering source code machine-readable and mutually accessible prior to interaction, the Register eliminates informational asymmetry. Citizens are no longer required to guess another party's intent; they need only verify the logic. This transparency guarantees that cooperation, where logically viable, becomes the dominant equilibrium.

  **2. My program enters an infinite loop when simulating the counterparty's code. Is this compliant?**
  No. All filings must halt within the Standard Compute Window (SCW) of 10⁸ clock cycles. If your program attempts to simulate a counterparty who is simultaneously simulating you, a recursion deadlock will occur. Citizens experiencing timeout errors are advised to implement bounded proof-search algorithms rather than direct execution. Do not attempt to run the other party's code; instead, verify the mathematical proof of their output relative to your own. Filings that exceed the SCW are automatically flagged as Non-Halting and classified as Defectors for the duration of the fiscal quarter.

  **3. Which decision program should I file?**
  The Ministry recommends the Conditional Reciprocity Module (CRM). Unlike Unconditional Cooperators (who cooperate with all inputs) or Unconditional Defectors (who cooperate with none), the CRM cooperates only upon proof that the counterparty's cooperation is contingent upon your own. This ensures you do not waste resources on naive agents who cooperate regardless of your action. Data indicates CRM filers achieve higher utility scores than Unconditional Cooperators, as the CRM correctly identifies and defects against Unconditional Cooperators who fail the contingency test. Filing a CRM demonstrates prudence and civic responsibility.

  **4. How does the Register handle identical filings, such as those from twins or spouses?**
  If two parties file identical source code, the logical contingency is satisfied immediately. The CRM recognizes that any action taken by the copy is necessarily an action taken by the self. Therefore, identical filings result in automatic mutual cooperation. Citizens sharing a household are encouraged to file identical modules to maximize domestic utility. However, note that slight variations in code structure—even if functionally equivalent—may fail the syntactic identity check, resulting in defection. Please ensure exact byte-for-byte matching.

  **5. Can I file encrypted or compiled code?**
  No. All submissions must adhere to the Approved Readability Standard (ARS). Minified, obfuscated, or compiled binaries are rejected. The Register must be able to verify your logic without execution. Citizens may apply for "Verified Clique" certification, allowing their program to cooperate exclusively with holders of the same credential. This creates a high-trust subnet within the general population. Citizens who decline certification or submit unreadable code are classified as Unclassifiable. Unclassifiable entities are treated as Unconditional Defectors by all CRM filers. An appeals process exists for citizens whose logic is too complex for ARS validation, though 94% of appeals are denied due to readability failures.

  **6. Is Unconditional Defection a compliant filing?**
  Yes. The Register mandates transparency, not cooperation. An Unconditional Defector filing is fully compliant provided the code is readable and halts within the SCW. Current statistics show that 42% of the adult population now files as Unconditional Defectors. This represents a significant success for the scheme: by making defection transparent, citizens can avoid interacting with them entirely, reducing net social loss. The stability of universal defection is recognized as a valid equilibrium state. The Ministry congratulates all citizens on achieving a fully sorted population where no cooperative resources are leaked to non-cooperators.

  **7. Where do I report bugs in another citizen's logic?**
  Do not contact the other citizen. Submit a Logic Violation Report via the NTR portal. If the violation is confirmed, the offending party is reclassified as a Non-Halting Defector.
