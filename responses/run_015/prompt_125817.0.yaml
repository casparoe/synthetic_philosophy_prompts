  6.  **Final Polish:** Organize into clear sections corresponding to the prompt's requirements (Causation, Marx/Materialism, Psychology/Geography, Final Inference). Ensure the "Brainstorming" instructions are reflected in the output (i.e., the output should show I have distinguished these concepts).

