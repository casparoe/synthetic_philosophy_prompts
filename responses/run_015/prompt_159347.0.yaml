answer: |-
  **Title:** The Observer Lottery
  **Time:** 90 mins (15 setup, 45 play, 30 debrief)
  **Materials:** 2 large envelopes ("World S", "World L"), 110 index cards (10 numbered 1-10, 100 numbered 1-100), 1 coin, 200 tokens (chocolate/counters), whiteboard.

  ### Setup
  1.  **Worlds:** Envelope S contains cards 1–10. Envelope L contains cards 1–100.
  2.  **Prior:** Flip coin. Heads = World S, Tails = World L. (Keep hidden).
  3.  **Observers:** Shuffle the chosen envelope's cards. Deal one to each participant. (If cards run out, remaining players are "unborn" and sit out).
  4.  **Goal:** Bet tokens on which World you are in.

  ### Gameplay (4 Rounds)
  Run 4 rounds. Reset cards/coin each time.
  *   **Rounds 1 & 2 (Blind):** Players see only their card back.
  *   **Rounds 3 & 4 (Serial):** Players reveal card number. *Constraint:* If card > 2, they sit out (simulating "You are observer #2").
  *   **Scoring Mode A (Rounds 1 & 3):** **Per-Observer.** Correct bet = +1 token. Incorrect = -1.
  *   **Scoring Mode B (Rounds 2 & 4):** **Per-World.** A fixed pot (10 tokens) is awarded to the winning World, split equally among its correct bettors.

  *Note:* To ensure signal over noise with 13 people, run each round 3 times (12 total iterations) or aggregate tokens across the group. For 90 mins, run each round once but aggregate total tokens won by "S-bettors" vs "L-bettors" across the whole room.

  ### The Debrief (Tight)
  Do not lecture. Draw the payoff matrix on the whiteboard based on their results.

  1.  **The Blind Flip (Rounds 1 vs 2):**
      *   *Result:* In Per-Observer scoring, L-bettors (SIA) likely hold more total tokens. In Per-World scoring, S-bettors and L-bettors win equal pots (50% of worlds each).
      *   *Point:* SIA maximizes *total happiness* (more winners). SSA maximizes *world-correctness* (same win rate). Your friend's "cheat" objection is actually a utility function choice: do you care about being right per capita or per world?

  2.  **The Serial Flip (Rounds 3 vs 4):**
      *   *Result:* When told "You are #2", SSA players switch to betting Small (1/10 chance vs 1/100). SIA players stay 50/50 (10 copies of #2 in S vs 100 copies of #2 in L → cancels out).
      *   *Point:* This is the crossover. SSA updates on indexical rarity; SIA cancels rarity with population volume. If your group felt the tension here, you've reproduced the Presumptuous Philosopher.

  3.  **The Scoring Bite:**
      *   Show that in Per-World scoring, the SIA edge vanishes. Concede to your friend: SIA only looks "presumptuous" if you value total observer-moments. If you value world-outcomes, SSA holds.

  ### What Will Go Wrong
  1.  **"The Coin Was Fair":** Players will insist World S and L are 50/50 regardless of cards.
      *   *Fix:* Don't argue. Ask: "If you played this 100 times, would you rather be a random card from the S-deck or the L-deck?" Force them to inhabit the slot, not the coin.
  2.  **"The Room is a Sample":** Someone will note there are 13 of them, fitting World S better.
      *   *Fix:* Rule it out explicitly. "Reference class = cards in the envelope, not people in this room." Acknowledge this is a limitation (see below).
  3.  **Noise:** 13 people is small statistics.
      *   *Fix:* Aggregate tokens. Don't look at individual win/loss, look at total group wealth for each strategy.

  ### Limitations (Be Frank)
  1.  **Finite vs. Infinite:** We used 10 vs 100. Real cosmology involves billions. The intuition breaks at infinity (measure problem).
  2.  **Reference Class:** You chose the class (card-holders). In reality, defining "observer" is the hard part.
  3.  **Betting vs. Belief:** Winning tokens isn't believing truth. SIA might be better for betting, SSA for ontology. The game proves pragmatic utility, not metaphysics.

  ### Concessions
  *   **You (SIA):** Concede that SIA's advantage disappears if utility is divided per-world. It is not a free lunch; it's a population-weighted bet.
  *   **Friend (SSA):** Concede that SSA ignores the evidence of existence itself. If you wake up, you *are* more likely to be where wake-ups are frequent.

  **Goal:** Leave them arguing about utility functions, not probability math. That's where the real disagreement lives.
