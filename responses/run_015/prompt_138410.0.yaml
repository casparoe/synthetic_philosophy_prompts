answer: |-
  Here is the analysis of the Panel's actual operating rules, applied to the Sowerby case.

  ### The Actual Rules
  Based on the four precedents, the minutes claim one thing but the votes reveal three consistent, unwritten rules:

  1.  **The "Local Scars" Test:** Removal occurs when a specific, organized community *within the city* can trace direct harm from the figure to themselves or their ancestors (Creel, Calloway). Retention occurs when the harm is abstract, national, or the victims are not locally present/organized (Voss, Frontier Wars).
  2.  **The "Active vs. Passive" Medium:** Schools (active, daily use by children) are held to a higher standard than statues or memorials (passive, historical). Calloway (School) was renamed; Voss (Statue) and Frontier (Memorial) were kept with plaques. Creel (Statue) is the outlier, removed only because the "Local Scars" pressure was overwhelming.
  3.  **The "Established Reputation" Buffer:** We do not act on historian discoveries alone *unless* they trigger the "Local Scars" Test. If the figure is beloved for local good works and the bad works were external or unknown, we tend to contextualize rather than erase (Voss, Frontier).

  ### Application to Sowerby
  The Sowerby case fractures these rules.
  *   **Local Scars:** The Kenyan community is local and organized, mirroring Creel/Calloway. However, the harm occurred in Kenya, not *in* the city infrastructure (unlike Creel's wealth or Calloway's schools).
  *   **Active Medium:** It is a school, which strongly points to renaming (Calloway).
  *   **Established Reputation:** He is warmly remembered by hundreds of locals, which strongly points to retention with context (Voss).

  ### Prediction
  **Best Guess:** The Panel will vote to **name the school after the pupils (or a neutral descriptor)** and move Sowerby's name to a plaque in the archive.

  **Why:** The "Active Medium" rule (Calloway) is the strongest structural precedent. Panels are risk-averse; keeping the name risks protests from the Kenyan community during the opening ceremony. Renaming it removes the risk. However, to avoid alienating the alumni (the "Established Reputation" buffer), they will not "condemn" Sowerby but simply "retire" the honorific, acknowledging his educational contribution in the archive while sparing the children the daily use of the name.

  **Closest Analogue:** **Calloway Primary.** Both are educational institutions. Both involve figures who built careers on education but were complicit in systemic human rights abuses (segregation vs. colonial detention). The outcome for Calloway was removal.

  **Dishonest Precedent:** **Dr. Marianne Voss.** The Panel will likely reach for Voss in the debate to argue for a "second plaque" solution. This is dishonest because the Voss minutes explicitly relied on the claim that "nobody living in this city carries the mark" of her actions. In the Sowerby case, families *do* carry that mark. Using Voss to justify a plaque ignores the presence of the Kenyan community, treating them as abstract historians rather than local stakeholders.

  ### The Test Case
  To distinguish whether your "Local Scars" rule applies to *past* harm with *present* descendants (Sowerby/Creel) or only harm inflicted *within* the city (Calloway), you need this case:

  **The Hypothetical:** A city park is named after a local industrialist who donated the land. He is otherwise unknown. A historian reveals he funded a paramilitary group in a foreign civil war 40 years ago. A small group of refugees from that war now lives in the city and objects.
  *   **If you remove the name:** You have established that *current local residency of victims* is enough, regardless of where the harm happened (Sowerby should be removed).
  *   **If you keep the name:** You have established that harm must be *locally inflicted* to trigger removal (Sowerby should be kept/plaqued).

  ### Do the Precedents Settle It?
  **No.** Your precedents genuinely do not settle this. You have a direct conflict between the **Calloway Precedent** (Schools with tainted founders get renamed) and the **Voss Precedent** (Figures with separable local good/external bad get plaques). Sowerby is the first time these two rules have collided.

  If you acknowledge this, here are the principles you would be committing to with each option:

  1.  **Naming it after Sowerby:** You commit to the principle that **local benevolence outweighs external atrocity.** You are deciding that a man's kindness to *your* children excuses his cruelty to *other* people's grandparents, provided the cruelty happened abroad. This prioritizes the "Established Reputation" buffer above all else.
  2.  **Naming it with a permanent counter-inscription:** You commit to the principle that **ambivalence is a valid civic state.** You are deciding that a school can honor a man while simultaneously condemning his actions. This creates a "teachable moment" precedent, but risks turning the school entrance into a battleground where alumni and the Kenyan community fight over the interpretation of the text.
  3.  **Naming it after the pupils (or neutral):** You commit to the principle that **public institutions must be morally sterile.** You are deciding that the risk of causing pain to a minority community outweighs the historical accuracy of honoring a benefactor. This prioritizes the "Local Scars" test but weakens the "Established Reputation" buffer, signaling that any newly discovered dirt, regardless of distance, can void a local legacy.
  4.  **Something else (e.g., Dual Name):** You commit to the principle of **additive history.** You decide that names are not zero-sum. This is the most conciliatory but administratively messy option, potentially setting a precedent where every school eventually requires a committee to balance competing historical narratives.

  **Recommendation:** If you want to survive the meeting without resigning, choose **Option 3 (Neutral Name)**. It aligns with the Calloway school precedent (protecting the institution) while avoiding the dishonesty of the Voss plaque (ignoring the victims). It hurts the alumni, but it keeps the Panel consistent on the "Active Medium" rule.
