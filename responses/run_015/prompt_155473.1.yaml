  *(Self-Correction on the Ending)*: If she isolates the node, the network stops. If she doesn't, it reverses. The prompt asks her to decide. Let's have her realize that *she* is part of the high-entropy system. She has to sacrifice the node to save the arrow of time for the rest of the cluster.

  9.  **Final Review against constraints:**
