      *Memo Header:*
      TO: Exhibits and Public Programming Committee
      FROM: [User's Name/Role]
      DATE: March 10
      SUBJECT: Recommendation on Kepler Interactive

      *Text:*
      I recommend we build the interactive engine but kill the personalized temperament cards. We should display the geometry using historical charts only—Kepler's own birth, his patrons, or his Mars calculations. This preserves the educational value of the machinery without validating astrological claims for living visitors.

      To build this, we must commit to a reading of Kepler. I propose option (b): Same machinery, wrong domain. Kepler wasn't just using astrology as vocabulary for income; he believed geometric harmonies physically caused both planetary motion and human temperament. It was a unified physics that succeeded in the sky and failed on Earth. If we treat it as leftover vocabulary (a), we lie about his motivation. If we treat it as compartmentalization (c), we let him off the hook for using bad data. Reading it as a failed research program pursued in good faith makes this History of Science. It shows how rational methods can lead to wrong conclusions when the domain shifts. If we cannot agree on this reading, we must default to not printing personality profiles, as the risk of endorsing pseudoscience outweighs the nuance.

      The education staff is right that abstraction teaches nothing. To understand why Kepler was wrong about astrology, visitors must feel why he thought he was right. His system wasn't sun-sign fluff; it was rigorous geometry claiming the soul resonates with shapes. Showing the "pull" of that logic is necessary for the "correction" to land. However, the advisory astronomer is right about the psychological risk. People accept generic personality descriptions as uniquely accurate (the Barnum effect). A disclaimer panel does not neutralize the feeling of seeing your own birth date generate a profile about your soul. That transforms the exhibit from a historical demonstration into a live reading. We cannot afford to be the institution that hands out astrological cards, even ironically.

