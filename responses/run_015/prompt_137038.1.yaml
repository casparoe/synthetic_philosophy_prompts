  **Rule 1: The "Designated Agency" Principle**
  A work counts if a human agent is commissioned and identified specifically as an *artist* during the creation process, regardless of collaboration or medium.
  *   **Fit:** Explains why the Tapestry (named artist), Memorial (sculptor), and Tiles (studio commission) were accepted. Explains why the Slides (botanist), Theatre (heritage/architect), and Plaster (foundryman) were rejected. The Speakers likely passed under this rule because an artist designed the pitch-shift schedule, even if invisible later.
  *   **Prediction:** **Reject.** The creators are engineers; the artist's statement was written retroactively "because we asked."

  **Rule 2: The "Transformative Process" Principle**
  A work counts if a functional system or raw material is actively processed or altered through an algorithmic or creative constraint to produce an aesthetic output distinct from its utility.
  *   **Fit:** Explains why the Speakers (ventilation noise → pitch-shifted audio) and Tapestry (cartoon → woven textile) were accepted. Explains why the Slides (tissue → grid) and Theatre (room → restored room) were rejected; arrangement and restoration are not *transformative* processes in the same way.
  *   **Prediction:** **Accept.** The optimization algorithm actively processes environmental data to generate a visual pattern (moiré) that drifts over time, paralleling the Speakers' live feed.

  **Best Guess**
  **Reject.**
  The "Designated Agency" rule is the more robust precedent, holding true for every single past verdict without exception. The "Transformative Process" rule relies heavily on the Speakers case, which is an outlier. Crucially, the engineers describe the aesthetic as something the system *"happens to read as,"* admitting the aesthetic effect is incidental to the engineering goal. In the Speakers case, the pitch-shift was a deliberate aesthetic intervention *on* the function, not a byproduct of it. The committee consistently rejects works where the aesthetic is a side-effect of utility (Slides, Theatre).

  **Closest Analog**
  **The Microscope Slides.**
  *   **Why:** Both are technical/scientific objects (botany vs. nanotech) originating from a functional discipline, presented for visual appreciation without a designated artist.
  *   **Why Unclear:** The Slides were static historical artifacts framed by a curator; the Fins are dynamic, generative, and contemporary, framed by the creators and the Art Committee. The Slides failed because "unlabelled grid" was deemed insufficient framing. It is unclear if "seasonal algorithmic drift" constitutes sufficient framing to overcome the "scientific object" rejection, or if it merely makes it a more complex scientific object.

  **Further Proposal**
  **The "Looped Ventilation" Installation.**
  Commission a named media artist to record the building's ventilation noise and play it back on a continuous loop in the lobby gallery, disconnected from the live feed.
  *   **Reason:** This separates the rules.
      *   **Designated Agency** predicts **Accept** (an artist made it).
      *   **Transformative Process** predicts **Reject** (there is no live system or algorithmic transformation, only playback).
      *   If the committee accepts this but rejects the fins, **Agency** is the governing rule. If they reject this but accept the fins, **Process** is the governing rule.
