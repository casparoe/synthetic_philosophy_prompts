answer: |-
  You have identified a genuine and much-debated tension in historiography. While there is no single, universally recognised term for this specific rhetorical manoeuvre, it sits squarely within the long-standing conflict between **Intentionalism** and **Functionalism** (or Structuralism).

  To address your request directly: there is no standard label for this exact split accounting. However, based on your description, I propose we coin the term **"The Exceptionalist Partition"**.

  ### The Historiographical Context

  To understand why this pattern exists, one must look at the two dominant schools of thought regarding the Third Reich:

  1.  **Intentionalism:** This view posits that Hitler was the primary driving force. His ideology, outlined in *Mein Kampf* and his speeches, provided a blueprint that the state followed. Here, the "Great Man" theory prevails; without Hitler, the specific nature of the regime and its crimes would not have occurred.
  2.  **Functionalism (Structuralism):** This view suggests that the Nazi state was a chaotic collection of competing agencies. Radicalisation occurred from the bottom up as bureaucrats and party officials "worked towards the Führer" to gain favour. In this view, structural pressures (Versailles, economic collapse, antisemitic culture) made an authoritarian regime highly probable, if not inevitable.

  Your observation highlights a common synthesis: historians often employ **Structuralism** to explain the *rise* of the regime (macro-level conditions) but revert to **Intentionalism** to explain the *specific atrocities* (micro-level decisions).

  ### The Exceptionalist Partition

  **Definition:** A historiographical method where structural determinism is used to explain the emergence of a political system, but agential exceptionalism is invoked to explain the system's most extreme outcomes.

  In this framework, the broader society and economic conditions are treated as the necessary soil, but the dictator is treated as the unique seed that determined the specific, poisonous fruit.

  ### Distinguishing Partition from Inconsistency

  You asked to draw the line between this pattern and simple inconsistency. The distinction lies in **multi-causality versus contradiction**.

  **1. Logical Consistency (The Valid Partition)**
  History is rarely monocausal. It is logically consistent to argue that:
  *   **Structure** created the *opportunity* and *capacity* for tyranny (e.g., the Weimar collapse made dictatorship possible).
  *   **Agency** determined the *specific form* and *intensity* of that tyranny (e.g., Hitler's specific ideology directed that tyranny towards racial extermination rather than mere authoritarian repression).

  In this light, the "split" is not an error but a nuanced acknowledgement that different causes operate at different levels. A structural crisis might guarantee a dictator, but it does not guarantee a *genocidal* dictator. Therefore, attributing the genocide to specific agency is not inconsistent with attributing the regime to structural forces.

  **2. Logical Inconsistency (The Exculpatory Partition)**
  The pattern becomes inconsistent—or intellectually dishonest—when it is used to **exculpate** the structure from the crimes.
  *   **Inconsistency:** If one argues that the German bureaucracy was too weak to stop Hitler (Structuralism), but also that the bureaucracy was efficient enough to industrialise murder without his direct micromanagement (Functionalism), one must reconcile these views.
  *   **The Problem:** If the "Exceptionalist Partition" is used to suggest that *only* Hitler was responsible for the Holocaust, thereby absolving the civil service, the military, and the wider society, it slips into inconsistency. It treats the structure as potent enough to seize power but inert regarding moral choices.

  ### Why the Term Matters

  Naming this **"The Exceptionalist Partition"** is useful because it highlights a potential moral hazard in historical writing.

  When historians rely on this partition, they risk creating a narrative where the "system" was a victim of the "madman", rather than an enabler. Modern historiography, such as the work of Ian Kershaw, attempts to bridge this with the concept of "Working towards the Führer". This suggests that the structure and the agency were fused: the system anticipated Hitler's will and acted upon it without explicit orders.

  If a historian claims the regime was structurally inevitable but the crimes were purely Hitler's "madness", they may be engaging in the **Exceptionalist Partition** to preserve a notion of national innocence. It allows for the condemnation of the dictator while subtly sanitising the society that empowered him.

  ### Summary

  *   **Is there a name?** Not specifically, though it relates to the Intentionalist-Functionalist debate.
  *   **Coined Term:** **The Exceptionalist Partition**.
  *   **Is it inconsistent?** Not necessarily. It is valid to assign different weights to structure and agency at different stages of history.
  *   **When does it fail?** It becomes inconsistent when it denies the structural complicity required to execute the "mad" decisions. A decree requires a bureaucracy to function; blaming only the signer ignores the signatories.

  In short, your intuition is correct. While often a legitimate methodological tool to handle complexity, it can occasionally serve as a convenient firewall to protect broader structural analyses from the moral weight of specific crimes.
