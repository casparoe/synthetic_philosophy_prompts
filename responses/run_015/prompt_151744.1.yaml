answer: |-
  Subject: Re: Grad seminar / Guide III plan

  Hey,

  This is a great angle. Most students stop at "concession to weakness" and miss the pedagogical strategy. Here's how I'd structure the session to force them into the structural argument without getting bogged down.

  **1. The Teaching Arc (Dependency Order)**
  Don't start with the theory of intentions—it's too dry. Start with the textual puzzle.
  *   **Step 1: The Hook (The "Concession" Headline).** Ask them what they remember from Guide III:32. They'll say "God tolerated sacrifice because people weren't ready for prayer." Write this on the board.
  *   **Step 2: The Problem.** Push back immediately. Does this make God look like he's compromising truth? Does it make the law arbitrary? If it's just tolerance, why *these* animals?
  *   **Step 3: The Carrying Case (Egypt).** Now drop the Lev 1:2 vs. Egyptian Cult data. Show the overlap (cattle, sheep, goats = Apis, Khnum, etc.). This creates the tension: Why command the very things associated with idolatry?
  *   **Step 4: The Theory (Primary/Secondary Intention).** Now introduce the mechanism. Primary = knowledge of God. Secondary = weaning them off idolatry *using* their existing sensory language. This resolves the tension from Step 2.
  *   **Step 5: The Telos (Prayer).** End with the shift to prayer. Clarify that prayer isn't "morally better" in a vacuum; it's the next stage of the same pedagogy once the idolatrous attachment is broken.

  **2. The Carrying Case: Lev 1:2 vs. Egypt**
  *   **Include:** The specific identification of the sacrificial animals with specific Egyptian deities (Maimonides is explicit here). The psychological point: you can't abruptely abolish embodied habit; you have to redirect it.
  *   **Exclude:** Don't get into the *details* of the slaughter procedures (Mishneh Torah stuff). Don't broaden it to all ANE cultures—keep it focused on Egypt because that's Maimonides' historical claim. If you broaden it, the specific redirection argument gets muddy.

  **3. Mapping Misconceptions (When to Head Them Off)**
  *   **"God Lied/Deceived":** Head this off at **Step 4**. When you define Secondary Intention, emphasize that the command is *real*, not a fake placeholder. It's a therapeutic constraint, not a deception. God isn't lying; He's treating a condition.
  *   **"Proto-Vegan/Anti-Ritual":** Head this off at **Step 3**. If they think Maimonides hates sacrifice, they'll miss the point of retaining the form. Make sure they see he validates the ritual *for that time*. It's not that sacrifice is evil; it's that *idolatrous* sacrifice is the target.
  *   **"Prayer is Superior Morally":** Head this off at **Step 5**. Students love to think prayer is "more evolved" morally. Correct them: prayer is the *result* of the successful weaning. The logic is historical/pedagogical, not just moral progress.

  **4. The Check Question**
  Don't ask "What is primary intention?" They'll parrot the definition. Ask this:

  *"If Maimonides believed sacrifice was merely a concession to human weakness, why does he insist on the specific historical match between Levitical animals and Egyptian gods?"*

  If they say "To accommodate them," they missed it. You want them to say: "Because the law is strategically redirecting existing habit, not just tolerating it." That shows they get the *structural* move.

  **5. What to Leave Out**
  *   **Karaite-Rabbanite debates:** Total rabbit hole. Irrelevant to the philosophical structure here.
  *   **Mishneh Torah Codes:** Don't open the law code. Stay in the Guide. The logic is philosophical, not halakhic detail.
  *   **Spinoza:** Mention only if someone brings it up. Don't spend time contrasting political control vs. pedagogy unless you have extra time. It derails the Maimonidean internal logic.

  Hope this helps. It's a tight session but should wake them up.

  Best,
  J
