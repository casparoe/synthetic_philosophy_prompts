      *   **Core Argument:** Sacrifice isn't just accommodation; it's a *redirection* of embodied Egyptian animal-cult habits (Lev 1:2 animals = Egyptian worshipped animals). It's about primary/secondary intention structure in law. Not deception, not proto-vegan, not Spinoza-style control. Prayer supersedes sacrifice later but doesn't destroy the pedagogical logic.
      *   **Task:** Plan the teaching arc (dependency order, carrying case, misconceptions, check question, exclusions).
      *   **Tone:** Casual, like emailing a colleague (typos allowed).
      *   **Constraints:** Do not explain the philosophy itself, just the teaching plan. Avoid Karaite-Rabbanite debates or detailed Mishneh Torah codes.

  2.  **Determine the Teaching Arc (Dependency Order):**
      *   *Question:* Do they need primary/secondary intention first, or the example?
      *   *Reasoning:* If I start with abstract "primary/secondary intention," it'll feel dry and theoretical. If I start with the concrete example (Egyptian animal worship vs. Leviticus), it grounds the theory. However, they need the *framework* to understand *why* the example matters.
      *   *Decision:* Start with the misconception ("It's just a concession"), then hit them with the Egyptian context example to create tension, *then* introduce primary/secondary intention as the tool to resolve that tension. This avoids the "God lied" trap early on.
      *   *Sequence:*
          1.  Hook: The "Concession" Headline (what they think they know).
          2.  Problem: Why that's insufficient (God doesn't just give in).
          3.  Evidence: The Egyptian Animal Cult (Lev 1:2).
          4.  Theory: Primary/Secondary Intention (the mechanism).
          5.  Resolution: Prayer vs. Sacrifice (historical progression, not moral rejection).

  3.  **Identify the Carrying Case:**
      *   *Case:* Leviticus 1:2 (cattle, sheep, goats) vs. Egyptian Deities (Apis, Khnum, etc.).
      *   *Include:* The specific overlap of animals. The psychological attachment to ritual form. The goal of weaning, not immediate abolition.
      *   *Exclude:* Detailed sacrificial procedures (how to slit the throat, etc.), other ancient Near Eastern cultures (keep it focused on Egypt as per Maimonides' explicit claim), later Jewish history beyond the Temple destruction/prayer shift.

  4.  **Map Misconceptions & Timing:**
      *   *Misconception 1: "God lied/deceived."*
          *   *Head off:* When introducing Primary/Secondary intention. Clarify that the *command* is real, the *purpose* is pedagogical, not deceptive.
