  **Column: The Normative Ledger**
  **By Dr. E. Thorne**

  Dear Confused Sibling,

  Your sister is not merely being fussy; she is operating under a sophisticated, hybrid ethical framework that most people never articulate, let alone follow consistently. She is effectively a **Contextual Contractualist**. She believes moral obligations in public spaces arise from two distinct sources: **Social Coordination** (don't break the local flow, e.g., queues, escalators) and **Economic Rectification** (don't benefit from underpaid labor, e.g., tipping).

  The confusion you feel stems from watching her weigh these two sources against each other. Sometimes Coordination wins (the London escalator); sometimes Economic Rectification wins (the US server); sometimes neither applies (the grocery charity).

  Here is my analysis of her framework, my prediction on the bagel case, and the test case you need to settle the remaining ambiguity.

  ### 1. Decoding Her Rules
  To predict her verdict, we must distill her twelve past judgments into operative principles. She is running three specific rules:

  *   **Rule A (The Coordination Principle):** If a behavior is a local convention required for social efficiency (queues, escalators, jaywalking norms), violating it is *wrong* because it disrupts the system. Ignorance excuses *blame*, but learning the rule creates the *obligation* (Verdicts 3, 4, 5, 6, 9, 11).
  *   **Rule B (The Wage-Reliance Principle):** If a worker's wage is structurally set below a living standard *with the expectation* that customers will bridge the gap, you *owe* the tip. It is not charity; it is deferred wages (Verdicts 1, 10, 12).
  *   **Rule C (The Service-Limit Principle):** Economic obligation is triggered by *service labor* rendered to you, not merely *presence*. If the labor is minimal (counter service) or the wage is already sufficient (stated $17/hr), the obligation dissolves into voluntary donation (Verdicts 2, 8).

  **The Tension:** The conflict in your bagel case is between **Rule A** (The US "Tip Screen" is becoming a strong convention) and **Rule C** (Counter service + $17/hr = No wage reliance).

  ### 2. The Prediction
  **Verdict:** She will say your German friend did **not** do something wrong.
  **Classification:** She will file this under **Case 8 (Charity/Ask)**, not Case 1 (Owed Wage).

  **The Reasoning:**
  Your sister's philosophy hinges on the *justification* for the payment. In Case 1 (Sit-down), she argues you owe the money because the employer has offloaded the wage burden onto you. In the bagel case, the sign explicitly states staff make $17/hour. To a philosopher of ethics, that sign is a "moral release clause." It signals that the employer is meeting their burden, meaning the tip screen is a request for surplus (Charity), not a completion of a contract (Wage).

  Furthermore, she distinguishes between *service* and *transaction*. Handing a bagel over a counter is a transaction. Carrying plates and managing a dining experience is a service. Without the service component, and without the wage reliance, the "Tip Screen" is merely digital peer pressure, morally equivalent to the grocery round-up (Case 8).

  **Does his status as a visitor matter?**
  Yes, but only regarding **blame**, not **obligation**.
  This brings us to your question about "owed" vs. "to blame." Verdict 11 (the Spanish friend on the escalator) proves these come apart. She argued he wasn't *to blame* initially (ignorance), but now that he knows, he *owes* compliance (obligation).
  However, in the bagel case, because she will likely rule there was **no obligation** to begin with (due to Rule C), his ignorance is secondary. She will say: *"He didn't owe it because the wage was decent and service was minimal. The fact that he's German just means he didn't feel the social pressure, which is fine."*

  If she believed the tip *was* owed (like the sit-down server), she would say: *"He didn't owe it *then* because he didn't know, but now he does."* Since I predict she will say he *still* doesn't owe it even now, the "Owed" and "To Blame" distinctions collapse here. Both are null.

  ### 3. The Tie-Breaker Case
  My prediction rests on the assumption that she prioritizes **Wage Reliance (Rule B)** over **Social Convention (Rule A)** when they conflict. But what if she actually thinks *any* established US tipping convention creates a debt, regardless of the wage?

  To separate these two remaining interpretations, you need to present her with a case where the **Wage is High** but the **Convention is Strong**.

  **Spring this case on her:**
  > "Imagine we go to a high-end hotel bar in New York. The bartenders are salaried employees making $40 an hour (well above living wage). The menu says 'Service Included,' but there is a tip jar on the counter and everyone around us is putting in $5 bills. It is a strong local norm to tip the bartender even when service is included. Do we *owe* it, or is it just nice to do?"

  **Why this separates the rules:**
  *   **If she says "You Owe It":** She is a **Conventionalist**. She believes that once a tipping norm is established in a region, it becomes a moral obligation regardless of the worker's actual financial need. This would mean my prediction on the bagel case might be wrong (she might say the screen creates an obligation).
  *   **If she says "It's Just Nice (Not Owed)":** She is a **Rectificationist**. She believes tipping is *only* morally required to fix wage exploitation. If the wage is high, the obligation vanishes, even if the social pressure is high. This confirms my prediction that the bagel tip was not owed.

  **My bet:** She will say **"It's Just Nice."** Her comment in Case 1 about the system being "bad and should be replaced" suggests she views tipping as a necessary evil for justice, not a social good in itself. If the justice element is removed (high wage), the evil remains (pressure), and she won't endorse it.

  **Summary for your trip:** Tell your German friend to relax. According to the "Thorne-Sister Framework," he hasn't violated a moral duty, only a marketing algorithm.

  Sincerely,
  **Dr. E. Thorne**
