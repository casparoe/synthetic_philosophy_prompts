  # The Dream Taxonomy: A Decision Tree on Sleep Experience

  To map the logical space of dream theory, answer the following questions in sequence. Each path terminates in a specific philosophical position, complete with its name and its most awkward commitment.

  **ROOT: Is there phenomenal consciousness (something it is like to be the sleeper) during REM sleep?**

  *   **NO**
      *   └─ **LEAF 1: Malcolm's Skepticism**
          *   *Awkward Commitment:* Must treat vivid, first-person accounts of lucid dreaming as linguistic performances rather than descriptions of witnessed events.

  *   **YES**
      *   **NODE 2: Is this consciousness accessible to memory systems *during* the sleep state (i.e., is sleep-state amnesia permeable)?**
          *   **NO (Blocked by Amnesia)**
              *   **NODE 3: Is the waking report constructed de novo at the moment of awakening?**
                  *   **YES**
                      *   └─ **LEAF 2: Dennett's Constructivism**
                          *   *Awkward Commitment:* Must claim the emotional terror of a nightmare is fabricated milliseconds after waking, not felt during the threat.
                  *   **NO**
                      *   └─ **LEAF 3: Unoccupied Logical Space (The Incoherent Gap)**
                          *   *Diagnosis:* **Incoherent.** If experience occurs but is inaccessible to memory, and no construction occurs at waking, there is no mechanism to generate a report; this combination posits a report without a cause.
          *   **YES (Encoded)**
              *   **NODE 4: Is the awakening report a direct retrieval of the sleep-state flow?**
                  *   **YES**
                      *   └─ **LEAF 4: Naive Realism (Common Sense)**
                          *   *Awkward Commitment:* Must explain why dream physics and identity shifts are never noticed as impossible until after waking.
                  *   **NO (Reconstructed)**
                      *   **NODE 5: What drives the reconstruction of the report?**
                          *   **Waking Memories Bleeding In**
                              *   └─ **LEAF 5: Episodic Contamination**
                                  *   *Awkward Commitment:* Must posit that waking memories actively overwrite sleep traces so seamlessly we cannot tell the difference.
                          *   **Demand for Coherence**
                              *   └─ **LEAF 6: Narrative Imposition**
                                  *   *Awkward Commitment:* Must assume the mind prioritizes story coherence over factual accuracy even when no audience is present.
                          *   **Random Neural Noise**
                              *   └─ **LEAF 7: Random Confabulation**
                                  *   *Awkward Commitment:* Must argue that dream reports are essentially hallucinations of memory with no tether to sleep-state events.

  ***

  ### Analysis of Logical Gaps

  **The Unoccupied Leaf (Leaf 3)**
  The combination of answers leading to Leaf 3 (Phenomenal Consciousness = **Yes**; Access Consciousness = **No**; De Novo Construction = **No**) produces an apparently unoccupied leaf. This view accepts that experience occurs during sleep but insists that awakening reports involve no reconstructive element whatsoever, despite admitting the experience was not memory-encoded.
  *   **Diagnosis:** This gap is **incoherent**. It requires a causal miracle: a report that describes a private event without any memory trace of that event and without any generative process to create the description. It is not merely unattractive; it violates the basic architecture of reportability.

  ### Note on Indistinguishability

  **Contamination vs. Narrative (Leaf 5 vs. Leaf 6)**
  While logically distinct, Leaf 5 (Episodic Contamination) and Leaf 6 (Narrative Imposition) may be **empirically indistinguishable** in practice. Both predict that dream reports will differ from sleep-state experience, and both attribute this to post-sleep processing. Without a way to isolate "waking memories" from "narrative structures" in the brain during the milliseconds of awakening, these two leaves may represent the same underlying mechanism described with different metaphors.
