answer: |-
  You have carved out a very specific shape of systemic failure. You are right to reject the standard labels: it is not a Tragedy of the Commons (no depletion), not a standard Prisoner's Dilemma (the payoff matrix changes over time), and not quite a Malthusian Trap (which describes the *result*, not the *lock-in mechanism*).

  The "Moloch" label you were given is a personification of the mechanism, not the mechanism itself. The mechanism is a **Multipolar Trap** combined with **Hysteresis**.

  Here is the carving you are looking for, broken down by mechanism, distinction, and edge cases.

  ### 1. The Name: "The Ratcheting Multipolar Trap"
  If you need a single word, it is a **Ratchet**. In economics and systems theory, a ratchet is a process that moves easily in one direction but is locked against moving back.

  However, to be precise about the *story shape* you described, the technical definition is:
  **A Competitive Adoption Process with Demographic Hysteresis.**

  *   **Competitive Adoption:** (The Multipolar Trap). Individuals adopt a strategy because it offers a local advantage or prevents a local disadvantage relative to peers.
  *   **Demographic/Structural Hysteresis:** (The Lock-in). The adoption changes the system's capacity (population, complexity, dependency) such that reverting to the previous state causes systemic collapse, not just individual loss.

  ### 2. The Carving: How it differs from nearby concepts

  | Concept | Why it's close | Why it's wrong for your shape |
  | :--- | :--- | :--- |
  | **Prisoner's Dilemma** | Individually rational, collectively bad. | PD assumes a static payoff matrix. In your stories, the *act of playing* changes the board (population grows, standards rise). |
  | **Tragedy of the Commons** | Collective action failure. | ToC requires resource *depletion*. Your examples involve resource *expansion* (more food, more credentials) that becomes a cage. |
  | **Arms Race** | Escalation driven by competition. | Arms races imply an adversary you want to defeat. In your examples, the "adversary" is just the new baseline of survival; no one wants to win, they just want to exist. |
  | **Malthusian Trap** | Population eats gains. | Malthus describes the *equilibrium* (starvation). Your story describes the *transition* and the *irreversibility* of the path taken to get there. |
  | **Path Dependence** | History locks you in. | Path dependence (like QWERTY) doesn't require competitive pressure. You can have path dependence without the "everyone suffers" element. |

  ### 3. The Mechanism: Is Inequality Part of It?
  You asked: *"I can't tell whether the inequality is part of the same mechanism or just a side effect."*

  In the farming case (and likely the others), **inequality is structural, not incidental.**

  This argument is most rigorously made by anthropologist **James C. Scott** (*Against the Grain*). The mechanism works like this:
  1.  **Surplus:** Farming creates storable calories (grain).
  2.  **Vulnerability:** Stored grain is theft-prone, unlike scattered forage.
  3.  **Defense:** You need walls and guards to protect the surplus.
  4.  **Hierarchy:** Guards and walls require command structures and taxation.
  5.  **Lock-in:** The population grows to match the grain capacity. To return to foraging would require killing 90% of the population. The hierarchy is required to manage the density and prevent the exit.

  So, inequality is not a bug; it is the **operating system** required to run the high-capacity trap. In the credential example, inequality (ranking) is the *point* of the system; without the hierarchy, the credential has no signaling value.

  ### 4. The Intergenerational Shift
  You noted: *"The ones who'd have to coordinate are descendants who never chose any of it."*

  This is the critical distinction that separates this from a standard coordination problem. This is a **Time-Horizon Mismatch** or **Intergenerational Externality.**

  *   **Generation 1 (Adopters):** Capture the upside (more food, easier job market). The costs are low.
  *   **Generation 2+ (Inheritors):** Inherit the capacity (population/standards) but not the upside. The "advantage" is now the baseline.
  *   **The Trap:** Generation 2 cannot coordinate to opt-out because the "opt-out" option (foraging/no degree) now results in death/penury, whereas for Generation 1 it was a lifestyle choice.

  This makes it distinct from a standard Prisoner's Dilemma because the players change mid-game. The people holding the keys to the exit were born into the prison.

  ### 5. Borderline Cases and Edges
  To test if a situation fits this carving, apply these three filters:

  1.  **The Local Rationality Test:** Did every actor make the best choice for themselves *at the time*? (If yes, it fits. If there were villains forcing it, it's oppression, not a trap.)
  2.  **The Hysteresis Test:** If everyone stopped tomorrow, would the system collapse or would people starve/lose status *because of the population/standards built up during the process*? (If yes, it fits. If they could just go back to how things were, it's just a fad.)
  3.  **The Welfare Test:** Is the aggregate per-capita welfare (leisure, nutrition, stress) lower than the pre-adoption baseline, despite higher productivity? (If yes, it fits. If everyone is richer, it's just progress.)

  **Borderline Case: The Smartphone.**
  *   *Fits:* Competitive adoption, hard to opt out, attention economy is stressful.
  *   *Misses:* It's not clear per-capita welfare is objectively lower (access to info, connection). It lacks the "starvation if you stop" existential threat. It's a **Soft Ratchet**, not a Hard one.

  **Borderline Case: Climate Change.**
  *   *Fits:* Individually rational consumption, collectively bad, hard to reverse.
  *   *Misses:* It *is* a Tragedy of the Commons (depletion of atmospheric capacity). Your specific shape requires the resource to *expand* (population/credentials) to create the trap.

  ### 6. Suggested Terminology
  Since "Moloch" is too vibey and "Multipolar Trap" is too game-theoretic, I suggest using **"The Surplus Ratchet."**

  *   **Why:** It captures the engine (surplus/productivity/credentials) and the mechanism (ratcheting up capacity/standards that cannot be wound down).
  *   **Usage:** "We aren't in a Prisoner's Dilemma; we're in a Surplus Ratchet. The productivity gains allowed the population/standards to scale, and now we can't scale back without catastrophe."

  ### Summary
  The shape is a **Multipolar Trap** that triggers **Hysteresis** via **Capacity Expansion**.
  *   **The Engine:** Competitive advantage.
  *   **The Fuel:** Surplus (food, time, money).
  *   **The Lock:** Demographic or Structural scaling (population, credential inflation).
  *   **The Result:** A new equilibrium where everyone works harder for the same survival, managed by hierarchy.

  It is not that people chose the cage; it is that they chose the key, and the key built the cage around their children.
