answer: |-
  **Dissertation Proposal**

  **Title:** Adversarial Testimony and the Mugging: A Signaling Game Approach to Pascal's Problem

  **Research Question**
  Does reframing Pascal's Mugging as a signaling game, where the stated payoff is a strategic move rather than a fixed datum, generate a non-fanatical decision recommendation independently of dogmatic prior restrictions? Or does this reframing merely redescribe the existing "complexity prior" objection in game-theoretic clothing?

  **Background and Context**
  Pascal's Mugging (PM) presents a decision-theoretic crisis: if an agent maximises expected utility, they may be forced to comply with low-probability, high-stakes threats, leading to "fanaticism." Standard responses fall into three camps: (1) modifying decision theory (e.g., bounded utility functions); (2) restricting priors (e.g., Solomonoff induction where probability shrinks faster than utility grows); or (3) epistemic skepticism (rejecting the coherence of the hypotheses). **[Confidence: High]** There is broad consensus that these solutions either feel ad hoc or require controversial constraints on rationality.

  My friend's objection—that PM is merely Pascal's Wager (PW) in a trenchcoat—relies on the view that both are problems of low-probability/high-stakes dominance. **[Confidence: Medium]** However, this overlooks a structural disanalogy: PW concerns metaphysical uncertainty where evidence is arguably impossible, whereas PM concerns adversarial testimony where evidence is theoretically possible but withheld. **[Confidence: High]** The literature largely treats the mugger's number as an exogenous parameter to be evaluated, rather than an endogenous choice to be explained. **[Confidence: Medium-High]** This proposal argues that the mugger's choice of number is a signal about their model of the victim, not their own power.

  **Methodology**
  The project will be purely conceptual and formal. I will construct a signaling game model where a "Mugger" type (Capable/Incapable) chooses a stated payoff to maximise extraction from a "Victim." I will analyze the separating vs. pooling equilibria. Specifically, I will test whether a rational Victim, updating on the *absence* of cheap verification evidence, converges on skepticism without needing to impose an exogenous prior cap on large numbers. This will be compared against the standard "priors shrink faster than payoff" argument to determine if the signaling approach offers novel justificatory work or is merely a redescription.

  **Work Plan (Two Semesters)**
  *   **Months 1-2:** Literature review. Map the taxonomy of anti-fanaticism responses (bounded utility, lexicographic preferences, complexity priors). Formalize the standard Bayesian treatment of the Mugging.
  *   **Months 3-4:** Develop the signaling model. Define the Mugger's payoff function and the cost of verification. Determine conditions under which high-stakes claims without evidence constitute a "bad signal."
  *   **Month 5:** Drafting Chapter 1 (The PW/PM Distinction). Argue why the signaling frame applies to Mugging but not Wager, addressing the "trenchcoat" objection.
  *   **Months 6-7:** Drafting Chapter 2 (The Model). Present the formal game. Show the equilibrium outcomes.
  *   **Month 8:** Drafting Chapter 3 (Comparison). Contrast the signaling result with the complexity prior objection. Is the skepticism derived from the game structure or smuggled into the priors?
  *   **Month 9:** Revision and integration.
  *   **Month 10:** Final polish and submission.
  *   **Buffer:** Months 11-12 reserved for supervisor feedback loops and unforeseen formalization hurdles.

  **Expected Outcomes and Failure Modes**
  A successful dissertation will demonstrate that the absence of cheap evidence is a distinct epistemic factor from the implausibility of the claim, yielding a robust skepticism that does not rely on capping utility.

  The honest failure mode is demonstrating that the signaling model collapses into the standard "priors shrink faster than payoff" view. If the equilibrium simply requires the Victim to hold a prior that already discounts the Mugger's honesty inversely to the stakes, the project adds no new normative force. **[Confidence: Medium]** I will know early (by Month 4) if I am heading toward this failure: if the separating equilibrium requires the Victim to already believe "Capable" types are vanishingly rare regardless of the signal, the model is redundant.

  **Scope Assessment**
  12,000 words is tight for a year-long project but sufficient for a focused conceptual argument. The risk is not breadth but depth; the formal modeling must be precise enough to withstand scrutiny without consuming the word count. This scope is appropriate for a Master's by Research or taught Master's dissertation, provided the formalism remains lightweight and illustrative rather than exhaustive.

  ***

  ### Internal Briefing: Confidence & Scope Notes

  **Scope Advice**
  12,000 words is actually on the **small side** for a one-year Master's dissertation (many are 15k–20k+). This is good for you: it means you can't waffle. You have to be surgical. The risk isn't that the project is too big; it's that you might run out of things to say by Month 8 if the model doesn't hold up. The buffer months are crucial. If the model works, you'll have plenty to write. If it doesn't, you'll spend Months 6-8 trying to spin a negative result, which is hard in 12k words.

  **Confidence Markers in the Text**
  I have inserted bracketed confidence ratings in the proposal text above. Here is the breakdown of why I assigned them, so you can defend them if your supervisor asks:

  *   **[Confidence: High] on Standard Responses:** The taxonomy (bounded utility, complexity priors, etc.) is stable. Everyone agrees these are the main options.
  *   **[Confidence: High] on PW/PM Disanalogy:** It is robustly true that PW is about metaphysical state uncertainty and PM is about testimony. This is your strongest shield against your friend's objection.
  *   **[Confidence: Medium-High] on Literature Gap:** Most papers treat the number as a given. *However*, this is where you will get grilled.

  **The "Least Sure" Claim (Prepare for the Grilling)**
  The claim I am **least sure of** is: *"The literature largely treats the mugger's number as an exogenous parameter to be evaluated, rather than an endogenous choice to be explained."*

  **Why this is risky:** A sophisticated supervisor might point out that Bayesian updating *implicitly* treats testimony as evidence. They might cite work on "epistemic game theory" or "testimony reliability" that already covers this.
  **Your Defense:** Acknowledge that Bayesianism handles testimony, but argue that the *specific* literature on Pascal's Mugging focuses on the *magnitude of the utility* (the $3 \uparrow\uparrow\uparrow 3$) overwhelming the prior, rather than the *strategic selection* of that magnitude by the speaker. Your novelty is applying a **signaling equilibrium** framework specifically to the *size of the number*, not just the truth of the claim. You are arguing that the *size itself* is the signal of the mugger's model of you, not just a claim about the world.

  **Early Warning System (Month 4 Check)**
  As stated in the proposal, watch your priors. If your model only works if you assume the prior probability of a "God-like Mugger" is $1/3 \uparrow\uparrow\uparrow 3$ *before* they speak, you haven't solved anything. The model must generate skepticism *because* they asked for $5 to save $3 \uparrow\uparrow\uparrow 3$ people, not *because* saving that many people is unlikely. If the skepticism comes from the latter, you've just redressed the "complexity prior" argument. If it comes from the former (the strategic choice), you have a new result.
