answer: |-
  ### 1. The Story
  Alpha Corp and Beta Ltd are negotiating a joint venture to develop a new software platform. The disagreement point is zero for both, representing the status quo of no deal. They are bargaining over the division of expected net profits, where **one unit of utility represents $10,000 in expected present value**. The feasible set $F$ is convex because the parties can agree on a randomized contract (e.g., a lottery over profit-sharing percentages) or continuously adjustable licensing terms, allowing them to achieve any weighted average of two feasible agreements.

  ### 2. The Baseline Problem ($F$)
  The initial feasible set $F$ is a quadrilateral defined by the origin and three boundary vertices. The disagreement point is $d=(0,0)$.
  *   **Vertices of $F$:** $(0,0)$, $(6,0)$, $(4,2)$, $(0,3)$.
  *   **Disagreement Point:** $d = (0,0)$.
  *   **Ideal Point:** $a(F) = (\max u_A, \max u_B) = (6, 3)$. Note that ideals are unequal ($6 \neq 3$).

  **Nash Solution for $F$:**
  The Pareto frontier consists of two segments:
  1.  From $(0,3)$ to $(4,2)$: Slope $m_1 = \frac{2-3}{4-0} = -0.25$. Equation: $u_B = -0.25u_A + 3$.
  2.  From $(4,2)$ to $(6,0)$: Slope $m_2 = \frac{0-2}{6-4} = -1$. Equation: $u_B = -u_A + 6$.

  The Nash solution maximizes the product $\Pi = u_A u_B$.
  *   On Segment 1: Max of $u_A(-0.25u_A + 3)$ occurs at $u_A = 6$ (outside segment range $[0,4]$). Max on segment is at endpoint $(4,2)$, $\Pi = 8$.
  *   On Segment 2: Max of $u_A(-u_A + 6)$ occurs at $u_A = 3$ (outside segment range $[4,6]$). Max on segment is at endpoint $(4,2)$, $\Pi = 8$.
  *   At the kink $(4,2)$, the subgradient of the frontier is $[-1, -0.25]$. The slope of the Nash indifference curve ($u_A u_B = 8$) at $(4,2)$ is $-u_B/u_A = -0.5$. Since $-1 < -0.5 < -0.25$, the tangency condition is satisfied at the kink.
  *   **NBS($F$) = $(4, 2)$.**

  **Kalai–Smorodinsky Solution for $F$:**
  The KS solution lies on the segment connecting $d=(0,0)$ to $a(F)=(6,3)$.
  *   Ray Equation: $u_B = \frac{3}{6}u_A = 0.5u_A$.
  *   Intersection with Frontier: Substitute into Segment 1 ($u_B = -0.25u_A + 3$):
      $0.5u_A = -0.25u_A + 3 \Rightarrow 0.75u_A = 3 \Rightarrow u_A = 4$.
      Then $u_B = 2$.
  *   This point $(4,2)$ is the kink, which is on the frontier.
  *   **KS($F$) = $(4, 2)$.**

  *Result:* Both solutions agree at $(4,2)$, which is off the diagonal ($4 \neq 2$).

  ### 3. The Change of Circumstances ($G$)
  A regulatory change opens a new market exclusively for Alpha, expanding their maximum potential payoff without altering Beta's maximum potential or removing any existing joint options.
  *   **Vertices of $G$:** $(0,0)$, $(7.5, 0)$, $(4,2)$, $(0,3)$.
  *   **Disagreement Point:** $d = (0,0)$ (Unchanged).
  *   **Ideal Point:** $a(G) = (7.5, 3)$.
  *   **Expansion Check:** $F \subset G$. Alpha's ideal rises ($6 \to 7.5$). Beta's ideal is unchanged ($3$).
  *   **No Confiscation:** For any $u_A$, the max $u_B$ in $G$ is $\ge$ max $u_B$ in $F$. Specifically, the segment from $(4,2)$ to $(7.5,0)$ lies outside the segment from $(4,2)$ to $(6,0)$.
  *   **Total Utility:** Max attainable sum rises (e.g., at KS solution, see below).

  ### 4. Verdicts

  **Nash Solution for $G$:**
  The frontier from $(0,3)$ to $(4,2)$ is unchanged. The new segment connects $(4,2)$ to $(7.5, 0)$.
  *   New Slope $m_2' = \frac{0-2}{7.5-4} = \frac{-2}{3.5} = -\frac{4}{7} \approx -0.57$.
  *   Subgradient at $(4,2)$ is now $[-0.57, -0.25]$.
  *   The Nash indifference curve slope at $(4,2)$ is still $-0.5$.
  *   Since $-0.57 < -0.5 < -0.25$, the maximum product remains strictly at the kink.
  *   **NBS($G$) = $(4, 2)$.** (Exactly the same as $F$).

  **Kalai–Smorodinsky Solution for $G$:**
  The KS solution lies on the ray from $(0,0)$ to $a(G)=(7.5, 3)$.
  *   New Ray Equation: $u_B = \frac{3}{7.5}u_A = 0.4u_A$.
  *   This ray is flatter than the original ray ($0.4 < 0.5$).
  *   Intersection with Frontier: The ray slope ($0.4$) is steeper than Segment 1 slope magnitude ($0.25$), so it passes above Segment 1. It must intersect Segment 2.
  *   Segment 2 Equation: $u_B - 0 = -\frac{4}{7}(u_A - 7.5) \Rightarrow u_B = -\frac{4}{7}u_A + \frac{30}{7}$.
  *   Solve for Intersection:
      $0.4u_A = -\frac{4}{7}u_A + \frac{30}{7}$
      $\frac{2}{5}u_A + \frac{4}{7}u_A = \frac{30}{7}$
      $\frac{14+20}{35}u_A = \frac{150}{35}$
      $34u_A = 150 \Rightarrow u_A = \frac{75}{17} \approx 4.41$.
      $u_B = 0.4 \times \frac{75}{17} = \frac{30}{17} \approx 1.76$.
  *   **KS($G$) $\approx (4.41, 1.76)$.**

  **Comparison:**
  *   Alpha: $4.41 > 4$ (Strictly better).
  *   Beta: $1.76 < 2$ (Strictly worse).
  *   **Robustness:** The NBS relies on $-0.5$ being inside $[-0.57, -0.25]$. A perturbation of $\pm 0.005$ to the slope keeps it inside. The KS inequalities hold with margin ($0.41$ and $0.24$).

  ### 5. Analysis

  **Monotonicity Principle:**
  The case tests **Kalai–Smorodinsky Monotonicity**: If the feasible set expands such that one party's ideal payoff increases while the other's does not decrease, and no options are removed, the first party should not receive less utility in the new solution. KS satisfies this (Alpha gains); Nash violates it (Alpha stays same, but effectively Beta loses despite no options being removed).

  **Geometric Features:**
  *   **Nash:** Pinned by the **tangency of the hyperbola $u_A u_B = k$ to the frontier**. Because the expansion occurred on a segment where the product was already declining relative to the peak at the kink, the maximum product location did not move. Remove the kink (make frontier linear), and NBS would move.
  *   **KS:** Pinned by the **slope of the ray to the ideal point**. Because Alpha's ideal increased, the ray flattened, intersecting the frontier further down the curve. Remove the change in the ideal point (keep $a_A$ fixed), and KS would not move.

  **Objection and Reply:**
  *   **Objection (Nash Defender):** Beta's loss is not unfair; Beta's *threat point* and *maximum potential* did not improve. The expansion belonged entirely to Alpha's domain, so Alpha capturing the surplus (or at least not sharing it) is consistent with Independence of Irrelevant Alternatives; the new options were "irrelevant" to the product maximum.
  *   **Reply:** The new options were not irrelevant to Beta; they altered the bargaining geometry such that Beta is strictly worse off than before despite having the same veto power and maximum capacity. Monotonicity captures the intuition that a pure expansion for one party should not penalize the other.

  **Conclusion:**
  This case establishes that Nash and KS are fundamentally distinct: Nash prioritizes the local product maximization (IIA), while KS prioritizes proportional gains relative to ideals (Monotonicity). It does not establish which axiom is morally superior, only that they prescribe different outcomes when bargaining power shifts via feasible set expansion.
