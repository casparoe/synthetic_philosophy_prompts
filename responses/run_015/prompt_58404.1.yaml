answer: |-
  **Exam Question**

  **Module:** PHI204 Philosophy of Mind
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,500 words (approx.)

  **Question:**
  Functionalism defines mental states by their causal roles rather than their physical constitution. Consider a laptop running a 'pain programme' hooked to a robot body versus an octopus withdrawing from a stimulus. If the functional organisation is identical, does the laptop literally feel pain? Critically assess whether functional organisation is sufficient for *phenomenal* consciousness, drawing specifically on the 'absent qualia' objection.

  ***

  **Model Answer**

  Functionalism posits that mental states are constituted by their functional role—the causal relations between sensory inputs, internal states, and behavioural outputs. On this view, if a laptop-robot system replicates the functional topology of an octopus's pain response, it possesses the mental state of pain. However, this conclusion conflates *access* consciousness (reportability and behavioural control) with *phenomenal* consciousness (the subjective 'what-it-is-like' to feel pain). While functionalism successfully accounts for multiple realisability, it struggles to justify why functional organisation alone generates qualia.

  The core dispute lies in the sufficiency of functional role for phenomenal experience. Ned Block's 'absent qualia' argument is pivotal here. Block suggests we can imagine a system functionally isomorphic to a human (or octopus) that lacks conscious experience. If functionalism is true, such a system is impossible; if it is conceivable, functionalism is false. In the laptop scenario, the system processes 'damage' inputs and outputs 'avoidance' behaviours. Yet, without biological substrate or specific causal powers, this may remain 'clever mimicry'. The laptop manipulates symbols based on syntax, not semantics; it detects damage but does not *suffer* it.

  Contrast this with the octopus. Its nociceptors are embedded in a biological nervous system evolved for survival. Biological naturalists, like Searle, argue consciousness is a higher-level biological feature caused by lower-level neurobiological processes. On this view, the octopus feels pain because of its specific causal biology, not merely its abstract functional diagram. The laptop lacks this causal business; its silicon gates do not possess the causal powers requisite for sensation. Therefore, identical functional roles do not guarantee identical phenomenal states.

  However, a functionalist might reply that 'biological magic' is untenable. If the octopus feels pain due to its causal role in survival, why is silicon excluded? Perhaps our intuition that the laptop lacks qualia is species-chauvinism. Yet, this defence often sidesteps the hard problem. Explaining *how* pain functions behaviourally does not explain *why* it feels like something. The laptop scenario highlights this gap: we can explain the robot's withdrawal mechanically without positing inner feeling.

  Ultimately, while functionalism explains the structural aspects of mind better than type-identity theory, it fails to secure phenomenal consciousness. The laptop-robot may realise the functional role of pain, but without the specific causal powers of biological systems (or whatever grounds qualia), it remains a philosophical zombie. Thus, functional organisation is necessary but not sufficient for feeling pain.

  ***

  **Marking Scheme (Out of 20)**

  **A Range (17–20 marks): Distinction**
  *   **Conceptual Precision:** Explicitly distinguishes between *phenomenal* consciousness (qualia) and *access* consciousness (behaviour/function). Recognises the question is not about physical substrate (Identity Theory) but about the sufficiency of function for experience.
  *   **Argumentative Moves:** Deploys Ned Block's 'Absent Qualia' argument or Searle's 'Chinese Room'/Biological Naturalism effectively. Directly engages with the 'mimicry vs. causal business' distinction raised in the prompt.
  *   **Critical Analysis:** Does not merely describe functionalism but critiques its limits regarding qualia. Considers counter-arguments (e.g., chauvinism) but refutes them with depth.
  *   **Mistakes to Avoid:** None. Clear, concise, British English spelling (e.g., 'programme', 'realise').

  **B Range (14–16 marks): Upper Second**
  *   **Conceptual Understanding:** Understands functionalism and multiple realisability well. Identifies the tension between the laptop and the octopus.
  *   **Argumentative Moves:** Discusses MR vs. Identity Theory heavily (e.g., argues silicon vs. carbon doesn't matter). This misses the nuance of the *phenomenal* gap.
  *   **Critical Analysis:** Good standard analysis but treats the problem as purely about physical realisation rather than the nature of experience. May mention Block but fails to apply the 'absent qualia' point rigorously.
  *   **Mistakes to Avoid:** Conflating 'feeling pain' with 'behaving as if in pain'. Failing to address why the octopus might be different beyond just 'it's alive'.

  **C Range (10–13 marks): Lower Second**
  *   **Conceptual Understanding:** Defines functionalism correctly but superficially.
  *   **Argumentative Moves:** Descriptive rather than critical. States opinions ("I think the robot feels pain") without philosophical backing.
  *   **Critical Analysis:** Limited engagement with literature. Treats the question as a science fiction scenario rather than a philosophical problem about mind.
  *   **Mistakes to Avoid:** Ignoring the octopus comparison. Reciting lecture notes on MR without applying them to the specific case.

  **D/F Range (0–9 marks): Fail**
  *   **Conceptual Understanding:** Fundamental misunderstandings of functionalism (e.g., confuses it with behaviourism).
  *   **Argumentative Moves:** Irrelevant material. No structure.
  *   **Mistakes to Avoid:** Plagiarism. Failure to answer the specific question asked.
