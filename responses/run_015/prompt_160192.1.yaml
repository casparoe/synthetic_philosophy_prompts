  **MERIDIAN GEOMETRIC PARTNERS**
  **Annual Letter to Limited Partners — Year Five**

  To Our Limited Partners,

  We write to you at the close of our fifth fiscal year. The Net Asset Value (NAV) of Meridian Geometric Partners I stands at $0.10 on the dollar. We understand this realization differs from your expectations. However, expectations are often derived from arithmetic means, whereas reality unfolds in time. We remain committed to the maximization of the expected logarithm of wealth, which is equivalent to maximizing the asymptotic growth rate of the portfolio. While the path has been volatile, the mathematics remains unimpeachable.

  **Table 1: Performance Metrics (Inception to Date)**

  | Metric | Meridian Fund I (Full Kelly) | Competitor Avg. (Half-Kelly) |
  | :--- | :--- | :--- |
  | **Arithmetic Mean Return** | **42.5%** | 18.2% |
  | **Expected Value (Ensemble)**¹ | **$12.40** | $2.50 |
  | **Geometric Mean Return** | -18.8% | 14.5% |
  | **Realized NAV (Time)** | **$0.10** | $1.90 |

  ¹ *The Expected Value represents the average outcome across all possible parallel universes. The Realized NAV represents the outcome in this universe. The divergence is a property of non-ergodic processes, not managerial error.*

  Consider our affiliated vehicle, Meridian Aggressive, which employed a leverage factor of three times the Kelly fraction. Its Expected Value at year five was substantially higher than Fund I's, owing to the convexity of payoff structures in the far right tail. That vehicle is now worth zero. This confirms the theory: betting beyond Kelly increases expected wealth while condemning the time-average trajectory to ruin. We prefer ruin with higher expectation to safety with lower growth.

  We note that half-Kelly competitors have outperformed Fund I over this five-year sample. This is statistically consistent with our models. The probability that full Kelly outperforms fractional Kelly at any finite horizon is only slightly better than even; the dominance is almost sure only as time approaches infinity. Five years is noise. To abandon the optimal strategy because the sample size is insufficient is to privilege the short run over the limit. We do not privilege the short run.

  Effective immediately, Meridian Geometric Partners I is merging with Meridian Log-Optimal. In reviewing the structure, I have become convinced that once sub-portfolios are merged, each member betting his own Kelly fraction is not the growth-optimal policy for the pool. Individual Kelly betting ignores the covariance structure of the aggregate book. The merged entity will henceforth calculate a single optimal fraction for the total capital. This is not a concession to risk management; it is a correction to ensure the pool itself grows geometrically, rather than merely summing individual growth rates that may be suboptimal for the collective entity.

  We received correspondence from a partner regarding this drawdown:

  > *"I signed up for capital appreciation, not a lecture on ergodicity. My utility function is concave. I prefer sure gains to volatile asymptotes. You have ignored my risk aversion."*

  Our reply was straightforward: In repeated decision problems under uncertainty, the expected utility hypothesis is subordinate to the ergodicity problem. If you maximize expected utility with a non-logarithmic function, you are effectively accepting a lower growth rate than nature allows. Your risk aversion is a preference, but the growth rate is a fact. We manage facts.

  We also address the partner who requested annual withdrawals of profits.²

  We invite you to roll what remains of your capital into Meridian Geometric Partners II. Fund II will reset the NAV to $1.00 and resume betting the full Kelly fraction on all identified opportunities. The opportunity set remains unchanged. The mathematics remains unchanged. Only the capital base has adjusted.

  Sincerely,

  *The Management*

  ***

  ² *Capital withdrawal interrupts compounding, converting a geometric problem into an arithmetic one. This partner accidentally ordered the wrong product. We have processed the withdrawal but cannot guarantee the logic holds outside the reinvestment assumption.*
