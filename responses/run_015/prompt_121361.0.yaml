  **INTERCONTINENTAL COMPUTING CORPORATION**
  **TECHNICAL EVALUATION DIVISION**

  **MEMORANDUM**

  **DATE:** October 14, 1958
  **TO:** Director of Procurement, Advanced Systems
  **FROM:** J. R. Vance, Senior Engineer, Architecture Group
  **SUBJECT:** Hardware Assessment of Specimen Type-H (Organic Computing Unit)

  **1. Summary**
  Per your request, the Architecture Group has completed a teardown and functional assessment of the Specimen Type-H unit delivered last month. The device demonstrates remarkable capability in pattern recognition, motor coordination, and linguistic processing. However, upon decapping the cranial chassis, we found an architecture that deviates radically from established stored-program principles. While the unit functions, its internal design presents severe impediments to standardization, maintenance, and precise arithmetic procurement.

  **2. Switching Elements**
  The fundamental switching elements (neurons) are electrochemical rather than electronic. Our oscilloscope readings indicate a firing recovery time of approximately 5 milliseconds. Compared to our standard vacuum triodes, which operate in microseconds, these switches are three orders of magnitude too slow for serious calculation. Yet, the unit completes complex sensory tasks in fractions of a second. The only engineering explanation is massive parallelism; the chassis contains roughly ten billion switches operating simultaneously. This implies a computation structure that is enormously wide but critically shallow. Any task requiring a deep chain of serial operations—such as long division or iterative debugging—causes the system to stall.

  **3. Logic and Memory**
  We cannot locate a distinct arithmetic unit or a separate memory bank. The architecture violates the separation of storage and processing that ensures data integrity in our current lines. Evidence suggests memory is distributed across the switching elements themselves, stored in the variable resistance of the connections between switches. This means modifying the data alters the hardware wiring. There is no addressable storage, no tape drive, and no readable program counter. The code is not stored; it is embodied. This makes patching bugs or updating the instruction set impossible without physically restructuring the chassis.

  **4. Instruction Set**
  The unit operates without a system clock. Signals propagate asynchronously, arriving at logic gates whenever chemical diffusion allows. Furthermore, we have failed to identify a binary logic gate. Signals appear to be pulse-coded (digital) but are modulated by firing frequency and chemical concentration (analog). This hybrid signaling offends standard design practices. More concerning is the internal language. We expected mathematical notation or formal logic. Instead, the system appears to use a statistical, associative coding scheme. It approximates answers rather than computing them. It is not calculating; it is guessing based on prior states.

  **5. Reliability**
  Component failure rates are unacceptable. Individual switches drop out daily due to chemical exhaustion or physical obstruction. In a standard machine, this would trigger a halt condition or an error code. The Type-H, however, employs massive redundancy. When components fail, the system reroutes signals around the damage. The failure mode is not a crash, but a gradual degradation of precision. Worse, when data is missing, the unit frequently fabricates plausible data to fill the gap (confabulation). We cannot trust the output integrity if the input vector is incomplete.

  **6. Power and Cooling**
  Power consumption is remarkably low, averaging 20 watts. However, the unit requires a continuous liquid cooling loop (blood) operating at 98.6°F. This system is prone to leakage, requires complex organic filtration, and demands the unit remain upright during operation. The power supply is chemical (glucose/oxygen), requiring intermittent downtime for refueling that cannot be automated. While the efficiency is high, the maintenance overhead outweighs the power savings.

  **7. Recommendation**
  The Specimen Type-H is unsuitable for procurement. While it achieves low-power operation through parallelism, its lack of serial depth, absence of distinct memory, and reliance on statistical rather than mathematical logic render it incompatible with our computational standards. The hybrid analog-digital signaling introduces noise that cannot be filtered without destroying the data.

  We recommend abandoning the biological architecture entirely. Instead, we should allocate resources to construct a machine using high-speed vacuum tubes, a distinct mercury delay-line memory, and a centralized clock. By utilizing fast, reliable, properly digital components and separating the memory from the arithmetic unit, we can eliminate the latency and ambiguity inherent in the Type-H design. We should build a computer that does not rely on unreliable biological switches. The fact that this requires 100 kilowatts of power and cannot recognize a human face is an acceptable trade-off for arithmetic precision.

  **Status:** Reject. Propose Project EDVAC-II.
