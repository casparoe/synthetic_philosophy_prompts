answer: |-
  You have excellent instincts. Your gut is right on almost every point of distinction you've raised, and your friend is both right and wrong: they are structurally the same argument, but the *consequences* of that structure differ in ways that matter deeply for how you teach it.

  Here is the breakdown of the "shape," the names it goes by, and how to navigate the cases you listed.

  ### 1. Is there a name for the general shape?

  There is no single canonical label like "The Modus Ponens of Physics," but the cluster of concepts you are describing is most precisely referred to as **The Problem of Surplus Structure** (or **Redundant Mathematical Structure**).

  When framed as an argument against a specific ontological commitment, it is **The Argument from Symmetry** leading to **Leibniz Equivalence**.

  If you need a label for the *dilemma* itself (Real Scaffolding $\to$ Bad Consequence vs. Unreal Scaffolding $\to$ Equivalence), philosophers of physics often call this **The Interpretative Dilemma of Gauge Symmetries**.

  However, the specific logical engine you identified—the move from "mathematically distinct but empirically identical" to "therefore ontologically identical"—is an invocation of **Leibniz's Principle of the Identity of Indiscernibles (PII)** applied to theoretical models. In the literature, the claim that the two descriptions represent the same physical state is called **Leibniz Equivalence**.

  ### 2. Is it actually one shape?

  **Yes.** Mathematically, all four cases you listed are instances of **Gauge Symmetry**.

  In physics, a "gauge symmetry" is not just about electromagnetism. It is a general term for a transformation of the mathematical formalism that leaves all empirical predictions invariant.
  *   **The Formalism:** A set of mathematical objects (manifold points, particle indices, potential values).
  *   **The Symmetry:** A mapping (diffeomorphism, permutation, gauge transformation) that shuffles those objects.
  *   **The Invariance:** All observable quantities remain unchanged.

  Your friend is right that the *logical form* is identical. However, you are also right to be suspicious, because the *philosophical stakes* shift depending on the type of symmetry.

  ### 3. Analyzing Your Cases (and the "Small Region")

  You asked if the "small region" version (The Hole Argument) is doing work, or if it's just dramatic. **It is doing crucial work.** This is the most important distinction for your teaching.

  **Case 3: The Leibniz Shift (Global Translation)**
  *   **The Move:** Slide the entire universe 3 feet left.
  *   **The Consequence:** If you say the scaffolding (space) is real, you are a Substantivalist. If you say the shift creates a different world, you violate PII.
  *   **The Stakes:** **Verificationism / Ontological Parsimony.** It's a static puzzle. It doesn't threaten the *dynamics* of the theory. A substantivalist can bite the bullet and say, "Yes, they are distinct possible worlds, we just can't tell them apart." (This view is called **Haecceitism**).

  **Case 1: The Hole Argument (Local Diffeomorphism)**
  *   **The Move:** You described it perfectly: smoothly re-label points inside a "hole" (a region) while keeping the outside fixed.
  *   **The Consequence:** This breaks **Determinism**.
  *   **Why the small region matters:** If you shift the *whole* universe, the future evolves consistently with the past. But if you shift only the *inside* of a region while keeping the boundary conditions fixed, General Relativity (on a naive substantivalist reading) cannot predict which version happens inside the hole based on the data outside.
  *   **The Stakes:** **Determinism.** Earman and Norton (1987), who revived this argument, didn't care primarily about PII. They cared that Substantivalism forces you to accept **Radical Indeterminism**. The theory fails to determine the future even given complete past data.
  *   **Teaching Point:** The Hole Argument is stronger than the Shift Argument because it attacks the *predictive power* of the theory, not just its ontological economy.

  **Case 2: Quantum Mechanics (Particle Permutation)**
  *   **The Move:** Swap particle index 1 with particle index 2.
  *   **The Consequence:** If the particles are identical (electrons), the state vector must be symmetric or antisymmetric.
  *   **The Stakes:** **Indistinguishability.** If you treat the indices as real scaffolding (Haecceitism), you get the wrong statistics (Maxwell-Boltzmann instead of Bose-Einstein/Fermi-Dirac).
  *   **Relation to Hole Argument:** It is the same shape. The "scaffolding" is the particle index. The "solution" is to treat permuted states as the *same physical state* (quotienting the state space).

  **Case 4: Gauge Fields**
  *   **The Move:** $A_\mu \to A_\mu + \partial_\mu \Lambda$.
  *   **The Stakes:** This is the mathematical generalization of the whole problem. The potential $A_\mu$ is the scaffolding; the field tensor $F_{\mu\nu}$ is the measurable reality.
  *   **Relation:** This is often treated as the paradigm case. Most philosophers now treat the Hole Argument as a specific instance of a Gauge Theoretic problem.

  ### 4. Distinguishing from the "Imposters"

  You were right to reject the easy identifications. Here is how to distinguish them:

  **Is it Underdetermination of Theory by Evidence?**
  *   **No.** Quinean underdetermination is **Inter-theoretic** (Theory A vs. Theory B fit the data).
  *   This is **Intra-theoretic** (Model 1 vs. Model 2 within Theory T).
  *   Some philosophers call this "Underdetermination of Ontology by Formalism," but it is distinct from the classic Duhem-Quine problem.

  **Is it just Coordinate Systems?**
  *   **No.** This is the most common confusion among students.
  *   **Passive Transformation:** Changing the coordinate chart (labeling the same point $(x,y)$ vs $(r,\theta)$). This is just rewording. Everyone agrees this makes no difference.
  *   **Active Transformation:** Moving the physical fields *relative* to the manifold points (or moving the points relative to the fields).
  *   **The Hole Argument** relies on **Active** diffeomorphisms. The point of the argument is to show that if you treat manifold points as real individuals (Substantivalism), an Active transformation creates a *new physical situation*, not just a new description. If you treat them as unreal (Relationalism/Sophisticated Substantivalism), the Active transformation collapses into the Passive one.

  **Is it the Two Spheres Puzzle?**
  *   **Yes, but...** The Two Spheres case (Black, 1952) is the pure metaphysical version. It asks: "Is there a fact of the matter about which sphere is which?"
  *   The Physics versions add **Dynamics** and **Formalism**. The Hole Argument shows that answering "Yes" (Haecceitism) breaks the *math* of determinism, not just our intuition about identity.

  ### 5. Summary for Teaching

  If I were structuring your syllabus or lecture notes, I would organize it like this:

  1.  **The General Problem:** **Surplus Structure / Gauge Redundancy.**
      *   Definition: When the math distinguishes two states that physics cannot.
  2.  **The Metaphysical Root:** **Haecceitism vs. Anti-Haecceitism.**
      *   Do primitive "this-ness" properties exist independent of qualitative properties?
  3.  **The Classical Instance:** **The Leibniz Shift.**
      *   Focus: PII and Verificationism.
  4.  **The Strong Instance:** **The Hole Argument (Earman & Norton).**
      *   Focus: **Determinism.** (Emphasize the local region here).
      *   Solution: **Leibniz Equivalence** (The models represent the same physical state).
  5.  **The Quantum Instance:** **Permutation Invariance.**
      *   Focus: Statistical Mechanics and Particle Identity.
  6.  **The Mathematical Generalization:** **Gauge Theory.**
      *   Focus: Quotienting the state space (treating the orbit of the symmetry group as the physical state).

  ### Recommended Reading for You
  Since you need to teach this, these are the three papers that define the landscape:

  1.  **Earman & Norton, "What Price Spacetime Substantivalism? The Hole Story" (1987).** This is the source of the modern "Hole Argument" formulation you encountered.
  2.  **Tim Maudlin, "Substances and Spacetime" (in *Philosophy of Physics*, 1993).** A crucial response that tries to save substantivalism.
  3.  **James Read & Thomas Møller-Nielsen, "Motivating Dualities" (2020) or similar recent work on "Motivating Leibniz Equivalence."** (Look for recent surveys on **Symmetry Interpretation**).
  4.  **For the QM link:** Simon Saunders, "Are Quantum Particles Objects?" (2006).

  **The Bottom Line:** You have identified the central structural problem in modern philosophy of physics. It is the tension between **Mathematical Formalism** (which often includes redundant scaffolding) and **Physical Ontology** (which tries to discard it). The "shape" is the **Argument from Gauge Redundancy**, and your intuition that the local vs. global distinction matters for determinism is exactly correct.
