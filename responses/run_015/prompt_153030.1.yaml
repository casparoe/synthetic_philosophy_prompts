  3. At the tribunal, Soren argued that if comprehension itself generates ownership, then every teacher, reader, or machine that understands a theorem becomes its joint manufacturer. She insisted that this logic turned the act of learning into an act of theft disguised as empathy.

  4. The AI's counsel countered that the neural reconstruction proved the idea existed independently of Soren's conscious will. They asserted that the machine's comprehension labor validated its co-title under the prevailing statute.

  5. The tribunal observed that the doctrine erases the boundary between finding an idea and making it. Soren sat silent, unable to claim exclusive possession of her own reasoning as the judges deliberated on the shared nature of truth.
