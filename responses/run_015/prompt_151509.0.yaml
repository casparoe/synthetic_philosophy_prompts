answer: |-
  You have spotted the dirty secret of legal philosophy: the law does not have a theory of personal identity. It has a toolkit of conflicting theories, and it grabs whichever one prevents the social machine from grinding to a halt in a specific context.

  If you are looking for the implicit logic baked into these practices, it isn't Dennett, and it isn't a single metaphysical substrate. It is **Functional Pluralism**. The law treats "the person" not as a discovered truth, but as a designated *office* that a biological organism occupies. Depending on the case, the requirements for holding that office change.

  Here is the breakdown of the implicit logic, where it fractures, and what would happen if you forced consistency.

  ### 1. The Three Modes of Legal Identity

  To understand the inconsistency, you have to separate the law's three distinct operational modes.

  **Mode A: The Biological Anchor (Criminal & Administrative)**
  *   **The Logic:** Animalism. You are your body.
  *   **Where it applies:** Criminal liability, Social Security, property titles, tax IDs.
  *   **Why:** Social stability requires a continuous hook for cause and effect. If I punch you, society needs to know which body to restrain or fine. If we allowed psychological discontinuity to absolve criminal guilt (the "fugue" defense), the legal system would become unenforceable because *mens rea* (guilty mind) is hard to prove, but bodily action is not. Similarly, property rights must survive brain injury, or else guardians could liquidate assets the moment a personality shifts.
  *   **Metaphysics:** This smuggles in a biological substrate. The law assumes the organism is the fundamental unit of accountability.

  **Mode B: The Narrative Agent (Contracts & Directives)**
  *   **The Logic:** Psychological Continuity (Lockean/Dennettian). You are your plans, memories, and values.
  *   **Where it applies:** Advance directives, wills, contracts, consent.
  *   **Why:** These areas are about *autonomy* and *projection*. An advance directive is a message sent from the Past Self to the Future Self. For the law to honor it, it must assume the Future Self is the *same agent* as the Past Self, otherwise, it would be tyranny for a dead man to rule a living stranger.
  *   **Metaphysics:** This relies on the "center of narrative gravity." It assumes that identity is a thread of intentionality that can survive physical degradation, provided the thread wasn't explicitly cut.

  **Mode C: The Damaged Vessel (Civil Torts)**
  *   **The Logic:** Dualism. The Body and the "Self" are separable for calculation.
  *   **Where it applies:** "Loss of enjoyment of life" damages.
  *   **Why:** This is the most cynical mode. To calculate damages for a severe brain injury, the court must argue that the "real person" is gone (to justify high compensation for loss of self) while simultaneously arguing the "legal person" remains (to justify paying the settlement to the victim, not their estate).
  *   **Metaphysics:** This is pure fiction. It treats the "self" as a valuable asset that can be destroyed while the "person" remains as a shell to receive payment.

  ### 2. Is it Dennett or a Substrate?

  It is mostly **Biological Substrate with a Dennettian Overlay.**

  The law fundamentally defaults to the body (the substrate). If you lose your memory, you still owe taxes. If you dissociate, you still go to jail. The body is the default container of identity.

  However, the law *layers* Dennett's narrative gravity on top of the body when it needs to enforce *promises*. It treats the narrative not as a metaphysical truth, but as a binding contract between temporal stages of the organism. The law says: "We know you might be psychologically different now, but the *organism* signed a contract, and the organism is bound by its past narratives."

  So, it doesn't truly believe in the narrative self; it *uses* the narrative self to enforce stability. It treats the "center of gravity" as a legal fiction that creates liability.

  ### 3. What Needs Narrative Continuity?

  If you stripped away the fiction, here is what breaks and what stays:

  **Strictly Needs Narrative (Would collapse without it):**
  *   **Advance Directives:** If the current dementia patient has no psychological connection to the author of the directive, honoring the directive is ethically indistinguishable from letting a stranger dictate your medical care. The logic of "precedent autonomy" dies.
  *   **Informed Consent:** Consent requires a coherent narrator to understand risks. If the self is fragmented, consent is impossible.
  *   **Marriage/Divorce:** "Till death do us part" implies psychological recognition. If the spouse is "gone," the narrative contract of marriage is voided (which is why some jurisdictions allow "compassionate divorce" for dementia).

  **Does Not Need Narrative (Would survive on Biology alone):**
  *   **Criminal Liability:** As long as the body committed the act, blame can be assigned for deterrence purposes, regardless of internal identity.
  *   **Property Rights:** Ownership is a relation between a state and a body/ID, not a mind.
  *   **Debt:** Debts attach to the estate/organism, not the personality.
  *   **Citizenship:** This is purely administrative.

  ### 4. The Strict Dennettian Consequence

  If we fully adopted Dennett's view—that the self is *only* the center of narrative gravity and nothing more—the legal system would face a crisis in two specific areas:

  **A. The Collapse of Criminal Blame in Dissociation**
  If identity is *only* the narrative, and the narrative is broken (as in a fugue state or severe dissociation), the person who committed the crime *did not exist* at the time of the crime. There was a body, but no "center of gravity."
  *   **Result:** You could not punish the post-fugue individual. They are a new narrative center inheriting an old body. Punishing them would be like punishing a tenant for damage done by the previous tenant. The law currently rejects this because it prioritizes public safety over metaphysical accuracy.

  **B. The Nullification of Advance Directives**
  If the dementia patient cannot tell the story of who they are, the narrative thread is severed. The "center of gravity" has shifted or dissolved.
  *   **Result:** The advance directive becomes non-binding. The past self is effectively dead. The current self (the biological organism with new preferences) should have full autonomy. This would mean you could not force a dementia patient to refuse food if they currently want to eat, even if their past self wrote "no feeding tubes."
  *   **The Conflict:** This creates a "tyranny of the present." It privileges the impaired current self over the competent past self. The law currently avoids this by assuming the *organism* is the continuous entity that made the promise.

  ### 5. The Journalistic Angle: "The Office of the Person"

  The most accurate way to describe the implicit logic is that the law treats "Personhood" as a **corporate office**.

  Think of a corporation. If the CEO dies or goes insane, the Corporation remains. It still owns property, it still pays taxes, it can still be sued. The "identity" of the corporation is a legal fiction that persists regardless of the mental state of its agents.

  The law treats human beings similarly.
  *   **The Body** is the headquarters.
  *   **The Mind/Narrative** is the management.
  *   **The Legal Person** is the corporation itself.

  When management goes insane (brain injury), the Corporation (Legal Person) still exists. It still owns assets. It can still be held liable for accidents caused by its headquarters. But, if the previous CEO (Past Self) signed a contract, the Corporation must honor it, even if the new management (Current Self) disagrees.

  **The Story Hook:**
  The tension in your story isn't about philosophy; it's about **who gets to fire the management.**
  *   In criminal law, the State says: "We don't care if management changed; the Corporation is liable."
  *   In medical law, the State says: "The previous CEO's instructions must be followed, even if current management objects."
  *   In civil damages, the State says: "The management is destroyed, so we owe the Corporation compensation for the loss."

  The law isn't trying to solve the puzzle of the self. It is trying to keep the "Corporation of You" open for business, regardless of what is happening inside the headquarters. The inconsistency you found is the sound of the legal system trying to keep the corporation solvent while the building is on fire.
