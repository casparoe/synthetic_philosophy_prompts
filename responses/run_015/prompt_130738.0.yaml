  ### The one idea

  Your candidate is the right bottom line, but tighten the phrasing for oral retention. Use: "You haven't identified an institution until you can describe the evidence that would prove it absent." This forces the counterfactual. It stops them from stopping at "This looks like a temple." It demands: "If this weren't a temple, what would the jars look like?" If the answer is "The same," then you haven't identified a temple. You've identified jars. This distinction is the difference between observation and inference. Tell them this is the only rule that matters. If they leave remembering nothing else, this sentence must be it. It converts their intuition into a testable constraint. It prevents the "looks like" trap. Make them say it back to you before you move on. The mechanism doesn't need stating separately; the sentence *is* the mechanism. It encapsulates the likelihood ratio without the math.

  ### The carrying case

  The jars must show coordination without identity. Standardization (fabric, volume) proves someone organized production. That gets you to "institution" broadly. But they lack labels or context that distinguishes tax from cult. This ambiguity is the lesson, not a flaw. Keep the dog. It is essential bait. Detectorists will latch onto it as "ritual proof." Use it to show that while the dog increases the probability of *something* meaningful, it doesn't update the ratio between "tax office" and "temple" because both bury dogs. It feels like data, but it's noise regarding the specific institution. It teaches them to separate emotional resonance from informational content. Tell them: "The dog tells us someone cared about this door. It doesn't tell us who paid for the jars." This distinction protects the inference from being hijacked by the most exciting find. If you remove the dog, they won't feel the pull of the ritual hypothesis, and the lesson loses force. You need the temptation to demonstrate the restraint. The jars carry the institutional weight; the dog carries the emotional weight. Keep them separate in your explanation.

  ### The order

  Start with Wreckage Bias. Nothing gets buried unless it's broken, lost, or dead. Therefore, every site is a snapshot of failure, not function. This undermines the "photograph of living" assumption. Next, standardization proves coordination, which proves organization. Then, acknowledge the multiple institutional homes for that organization (merchant, state, kin, cult). Finally, introduce the contrast question. Address the "storytelling" worry immediately after Wreckage Bias. Say: "If we only see wreckage, are we just telling stories? No. We are bounding the possibilities. We can't say exactly what happened, but we can say what didn't." This structural constraint satisfies the need for truth without requiring impossible certainty. It shifts the goal from "finding the answer" to "eliminating the impossible."

  Dependencies: Wreckage first, because it limits the data. Standardization second, because it extracts signal from noise. Institution third, because it's the hypothesis. Contrast last, because it's the test. If you skip Wreckage, they treat the site as a living room. If you skip Contrast, they treat the hypothesis as fact. Explain that Wreckage Bias is why we can't just say "This is a temple." The temple burned down. We see the burn, not the prayer. Standardization is the only thread left connecting us to the organization that existed before the fire. The storytelling worry belongs here, because once they accept the site is wreckage, they fear free association. Show them the constraints immediately. The jars are not free; they are standardized. That limits the stories you can tell. You are not writing fiction; you are reconstructing a crash site.

  ### Misconceptions, in the order they'll arrive

  First, "Pots equal People." They think style equals identity. Show them the jars are identical across houses; style isn't the signal here. Second, "Ritual as Bin." They will call the dog ritual because they can't find a use. Define ritual as a specific function, not a leftover category. Third, "N=1." The 240 jars are not 240 data points; they are one event. Counting them doesn't increase statistical power. Explain: "If I break 240 plates at once, I haven't given you 240 chances to study my habits. I've given you one chance to study my anger."

  Fourth, "Absence of Evidence." When they say it, ask: "Did you expect to find evidence if it were there?" If the answer is no, the absence is meaningless. For example, if you expect wood to rot, finding no wood proves nothing. Finally, the nihilist overcorrection. Don't reassure them. Show them the jars rule out subsistence farming. The objects themselves constrain the story. You aren't guessing freely; the mud limits you. This handles the worry structurally. Emphasize that "we can't know everything" is not the same as "we can't know anything." The jars know something. Our job is to ask them the right questions. If they say "So it's all guesswork," point to the standardization. That isn't a guess. That is a physical constraint on the past.

  ### The check

  Hand them a scenario: A single house with three mixed jars. Ask: "What single find would make you downgrade your favourite hypothesis?" A right answer sounds like: "If the jars were different sizes, it's not central storage." A convincingly wrong answer sounds like: "If we found a priest's ring." The first tests the mechanism; the second just adds more positive evidence. You want them to look for falsifiers, not confirmations. This tests if they understand the counterfactual rule. The wrong answer is confident because it feels like discovery. The right answer is humble because it accepts limitation. Watch for the confidence. If they seek confirmation, they missed the point.

  ### What I refuse to explain

  Declare out of scope: Dating, typology, and spiritual meaning. Say: "We are not learning how to date pottery or what the Romans believed. We are learning how to think about what pottery can prove. This is logic, not classification. If you want to know the date, ask me later. If you want to know what the evidence does, stay here." This frames it as intellectual hygiene, not avoidance. It protects the session from drifting into technical weeds. It signals that you respect their time enough to focus on the tool, not the trivia.
