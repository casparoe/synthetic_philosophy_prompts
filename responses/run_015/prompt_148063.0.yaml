answer: |-
  First, the housekeeping: yes, you spelled it wrong. It is **promissory** (one 's' in the middle).

  Now, to the meat of it. Your roommate is arguing for a version of the **Expectation/Reliance View** (roughly Scanlonian or Humean), while you are gesturing toward the **Voluntarist/Normative Power View** (roughly Shiffrin or Raz). The fact that you are still stuck there suggests the field is stagnant, which is exactly where a three-year conceptual grant should aim.

  Here is the ranking of your three clusters by "upstream" priority. Solving the higher-ranked cluster fundamentally alters the solution space for the lower ones.

  ### 1. The Upstream Winner: Cluster 2 (Normative Power vs. Renaming)
  **Rank:** #1 (Foundational)
  **Why:** This is the ontology of the promise. Until you determine whether a promise creates a *new* reason (authority) or merely highlights an *existing* reason (expectation/harm), you cannot know if it survives social collapse or applies to non-humans.

  *   **Tractability:** High, but difficult. This is pure conceptual analysis. You don't need data; you need tighter logic. The risk is spinning wheels in the same debates as Hart, Rawls, and Scanlon. To make this tractable in three years, you must avoid rehashing "Is it will or reliance?" and instead ask: *What is the mechanism of transfer?* If I give you authority over my will, what metaphysical or normative transaction occurs?
  *   **Real-World Impact:** Massive. This is the bedrock of Contract Law (Will Theory vs. Reliance Damages) and Political Legitimacy (Social Contract Theory). If promises are just expectation-management, political consent is fragile. If they are normative powers, political obligation is robust but potentially coercive.
  *   **Neglect:** Low. This is the "classic" problem. However, it is **stagnant**. A fresh conceptual framework here is high-value because everyone assumes the dichotomy is exhaustive.
  *   **Overrated?** No. This is the engine. If this is an illusion, the rest of the philosophy of promising is just sociology.

  ### 2. The Testing Ground: Cluster 1 (Social Practice Collapse)
  **Rank:** #2 (Contextual)
  **Why:** This cluster tests the dependency of Cluster 2. If the "Normative Power" view is true, promises should theoretically survive the collapse of social practice (because the power resides in the agents, not the convention). If the "Expectation" view is true, promises dissolve without a society to sustain expectations.

  *   **Tractability:** Medium. It requires rigorous thought experimentation (state of nature, digital anonymized spaces). The trap here is drifting into speculative fiction rather than philosophy. You need to anchor it in existing non-ideal theory.
  *   **Real-World Impact:** High for International Law and Digital Governance. Do smart contracts on a blockchain constitute promises if there is no legal recourse? Do treaties bind failing states?
  *   **Neglect:** High. Most promise theory assumes a functioning liberal democracy. Exploring the "dark forest" of promissory obligation is genuinely underexplored.
  *   **Overrated?** Somewhat. It sounds dramatic ("post-catastrophe"), but it is often just a stress test for Cluster 2. It doesn't generate new theory; it reveals the limits of existing theory.

  ### 3. The Extension: Cluster 3 (Future People/Non-Humans)
  **Rank:** #3 (Derivative)
  **Why:** This is an application problem. You cannot know if you can promise a future person anything until you know what a promise *is* (Cluster 2) and whether it requires a reciprocal communicative loop (Cluster 1).

  *   **Tractability:** Low. This is a quagmire. It overlaps with the Non-Identity Problem and problems of moral status. It is easy to write 100 pages and conclude nothing but "it's complicated."
  *   **Real-World Impact:** Medium. Matters for environmental policy and intergenerational justice, but these are often handled better through *rights* or *stewardship* frameworks than *promissory* ones.
  *   **Neglect:** Low. Everyone wants to write about duties to the future. It is fashionable.
  *   **Overrated?** **Yes.** This is the most overrated cluster. It sounds profound ("Can we promise the ocean?"), but it is usually just an analogy stretch. Often, what we call "promising the future" is just "having a duty to the future." Conflating the two muddies the water without solving the core puzzle of obligation.

  ---

  ### What Evidence Would Reorder Them?

  I would change this ranking based on specific conceptual breakthroughs or failures:

  **1. If Cluster 1 becomes #1:**
  If you can construct a **Private Language Argument for Norms**. If you can demonstrate that "normative power" is conceptually impossible without public verification (a Wittgensteinian move), then Cluster 1 (Social Practice) becomes upstream. You couldn't even begin Cluster 2 without first establishing the social scaffolding.
  *   *The Argument:* Show that an isolated agent cannot distinguish between "I am bound" and "I feel bound" without a social check. If successful, the "Authority" view collapses into the "Convention" view.

  **2. If Cluster 3 becomes #2:**
  If you can prove that **Intergenerational Justice Fails without Promissory Structure**. Currently, we assume we have duties to the future based on welfare or rights. If you can show that those frameworks are insufficient and that *only* a promissory model secures the necessary obligations, Cluster 3 moves up.
  *   *The Argument:* Demonstrate that rights are too static to handle the dynamic contingencies of the future, whereas promises create a specific binding mechanism that rights lack. (This is a hard sell, but if done, it elevates the cluster).

  ### Recommendation for the Grant

  **Tackle Cluster 2, but through the lens of Cluster 1.**

  Don't just ask "Is it authority or expectation?" Ask: **"Does normative power require a social scaffold to function?"**

  This bridges the top two clusters. It allows you to address the roommate debate (Authority vs. Expectation) but forces you to confront the "collapse" scenario to test the limits of that authority. It avoids the quagmire of Cluster 3 (which you can mention as a limitation of your findings) and targets the highest impact area (law/politics) while remaining tractable for a solo philosopher.

  If you solve whether the "authority" is internal or external, you solve the contract law debate. If you solve whether that authority needs society to exist, you solve the digital/international law debate. Cluster 3 can wait.
