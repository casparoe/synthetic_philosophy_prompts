prompt: |-
  This term my fourth-year seminar in political philosophy and formal social choice reaches futarchy — Robin Hanson's proposal that a polity should "vote on values, bet on beliefs", with a democratic majority fixing the measure of welfare to be pursued and conditional prediction markets settling which policy maximises it. There are twenty-two students, seated at four tables of five or six, and I have one eighty-minute session in which to make the scheme feel like something other than a slogan.

  My students reliably arrive with two errors, and I want an in-class game that dismantles both from the inside rather than by my asserting that they are errors.

  The first is that they treat a prediction market as an elaborate opinion poll, and assume that once the outcome is observed the market's accuracy can simply be checked against it. The second arises when manipulation is raised: they repeat the standard reassurance — that a would-be manipulator must buy at the honest price, so pays for the privilege, and that the price snaps back afterwards — without noticing that the reassurance presumes a market that merely reports. Under futarchy the price *is* the decision rule, so moving the price is not asserting something false about the future; it is purchasing the future, at a bounded cost, against an unbounded payoff. Closely related, and just as hard to make vivid, is the asymmetry between the two branches of the comparison: once a policy is adopted, only that branch is ever realised, and the contract conditional on the rejected branch ceases to be traded by anyone who expects it to be rejected. The number the scheme most requires is therefore the number the market is least willing to quote.

  Please design the game. My requirements are as follows.

  1. The welfare variable must be generated in the room, in real time, by the participants' own behaviour under whichever policy is adopted. It may not be a figure I announce, and it may not be a lottery I draw. Specify two candidate policies, the scalar measure defined over the room's activity, and the productive task that yields it, with enough genuine contingency that the outcome is not obvious from the start.

  2. No real money. Use a fixed chip endowment and an explicit payoff function for the policy-conditional contracts, presented as a small printed table that can be evaluated by hand in under a minute. Justify the functional form: it should make honest forecasting strictly profitable in expectation, and — this matters most — the manipulator's arithmetic should be visible on the payoff table rather than engineered into the rules. If the design is honest, the profitable manipulation should fall out of the payoffs as an unwelcome consequence.

  3. Include an opening vote on values, taken before anyone knows anything about the policies' prospects, in which the seminar chooses between two candidate welfare measures; the contracts must pay on whichever measure is chosen. Tell me what this costs in minutes, whether the vote is itself strategic, and what to do if it is.

  4. Some participants must hold a private stake in which policy is adopted that is independent of the welfare measure — they do better under one policy whatever the outcome turns out to be. State how many such players, how you assign them, and how large the stake must be relative to ordinary forecasting profits for the effect to bite without being spotted immediately.

  5. Give an exact timeline in minutes, a full materials list, and rules precise enough that a teaching assistant who has seen none of this could run the session unaided.

  6. Provide a debrief that maps particular moments of play onto the two errors above, in the order those moments will have occurred, and that reaches the point at which someone notices that their own trades had stopped being forecasts. Give me the questions to ask rather than a speech to deliver.

  7. Be frank about what will predictably go wrong the first time this is run. I expect at least: too little variance in the outcome variable; the conditional market on the losing branch dying completely without anyone understanding why; chip arithmetic bogging the room down; and the privately interested players either blowing their cover or being too timid to exploit it. Offer a pre-emptive fix for each.

  8. State honestly which features of futarchy the game cannot reproduce and which I must therefore supply verbally. I suspect the contested character of the welfare measure and the continuous liquidity of real markets are candidates; tell me which you regard as genuinely irreproducible and which as merely difficult.

  9. Include a twenty-five-minute fallback version for the event that the session overruns.

  I am not after a bibliography, a reading list, or citations of any kind — the design is the deliverable. Please write the whole response in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game design:

  1.  **Analyze the Request:**

      *   **Context:** Fourth-year seminar in political philosophy and formal social choice.
      *   **Topic:** Futarchy (Robin Hanson's "vote on values, bet on beliefs").
      *   **Constraints:** 22 students, 4 tables (5-6 students each), 80-minute session.
      *   **Goal:** Dismantle two specific student errors via an in-class game (not lecture).
          *   *Error 1:* Prediction markets = opinion polls (accuracy checked against observed outcome).
          *   *Error 2:* Manipulation reassurance (manipulators lose money) ignores that price *is* the decision rule (purchasing the future) and the counterfactual problem (rejected branch isn't realised).
      *   **Requirements:**
          1.  Welfare variable generated in-room by participant behavior under the adopted policy (contingent, not obvious).
          2.  No real money (chips + payoff table). Honest forecasting profitable, but manipulation arithmetic visible.
          3.  Opening vote on values (two welfare measures) before policy knowledge. Address strategic voting.
          4.  Private stakes: Some players benefit from a specific policy regardless of welfare.
          5.  Exact timeline, materials list, TA-ready rules.
          6.  Debrief questions mapping play to errors.
          7.  Predictable failures & fixes (variance, dead markets, arithmetic, stealthy manipulators).
          8.  Limitations of the game (what must be supplied verbally).
          9.  25-minute fallback version.
      *   **Language:** British English.

  2.  **Deconstruct the Core Mechanism:**

      *   To show Error 1 (Market $\neq$ Poll): The outcome must depend on *effort* or *action* triggered by the policy, not just an external state of the world. If the market predicts the outcome, and the outcome depends on the market's decision, we have reflexivity.
      *   To show Error 2 (Manipulation & Counterfactuals): Players need to be able to move the price to *select* the policy, not just predict it. They need to profit from the policy selection even if their prediction was "wrong" or cost them money in the market, because the policy change benefits their private stake. The "rejected branch" problem needs to be visible—i.e., we can't verify the welfare of the unchosen policy.
      *   Welfare Generation: Needs to be a collective action problem or a production task where the "policy" changes the rules of production.
      *   Private Stake: A subset of students needs a side payoff for Policy A vs. Policy B.

  3.  **Drafting the Game Concept:**

      *   *Task:* Solving puzzles or assembling something. Let's go with "Word Construction" or "Math Problems". Word construction is easier to score quickly. Let's try "Anagram Solving".
      *   *Policies:*
          *   Policy X: "Collaboration" (Students can share answers).
          *   Policy Y: "Competition" (Students must work alone, top scorers get bonus).
          *   *Wait, this is too complex for 80 mins.*
          *   *Simpler:* Policy A: "Double points for Vowels". Policy B: "Double points for Consonants".
          *   *Welfare:* Total points scored by the class.
          *   *Mechanism:* Students get a list of letters. They form words. Score depends on the policy.
          *   *Reflexivity:* If the market predicts Policy A will yield higher welfare, Policy A is chosen. If Policy A is chosen, students might try harder or easier depending on the rules.
          *   *Better Reflexivity:* The "Welfare" is the *sum of chips held at the end*. No, that conflates trading with welfare.
          *   *Best approach for Welfare:* A collective production task where the *policy* changes the *cost of effort*.
          *   *Idea:* "The Public Pot".
          *   *Policy 1 (Subsidy):* Every word formed adds £2 to the Public Pot.
          *   *Policy 2 (Tax):* Every word formed adds £1 to the Public Pot, but players keep £1 privately.
          *   *Welfare Measure:* Size of the Public Pot.
          *   *Problem:* This doesn't create the "purchasing the future" manipulation incentive clearly enough.
      *   *Revised Idea:* Focus on the *Manipulation* aspect.
      *   *Task:* A simple trivia or estimation task where effort increases accuracy/score.
      *   *Let's try a "Coordination Game" as the welfare generator.*
      *   *Welfare:* Number of successful matches between Table A and Table B.
      *   *Policy:* Determines *how* they match.
      *   *Actually, let's look at the "Private Stake" requirement.* Some students want Policy A regardless of welfare.
      *   *Let's simplify the Welfare Generation:*
          *   Task: Solve 5 math problems per table.
          *   Policy Red: Correct answers count double if solved in first 10 mins.
          *   Policy Blue: Correct answers count double if solved in last 10 mins.
          *   Welfare: Total Class Score.
          *   *Why this works:* It creates time-pressure contingency. The market trades *before* the work is done.
          *   *Manipulation:* If I want Policy Red (private stake), I buy "Red Score > Blue Score" contracts. This drives up the price of Red. If the price determines the winner, I make Red win. I lose money on the contracts (maybe), but gain on the private stake.
          *   *Counterfactual:* Once Red wins, Blue is not enacted. We never know what the Blue score would have been.

      *   *Refining the Welfare/Policy link for Error 1:*
          *   Students often think the market predicts an *external* truth. Here, the "truth" (Welfare) is created *after* the decision.
          *   Let's make the Welfare depend on *how many people traded*. No, too meta.
          *   Let's stick to the "Task Performance" model.
          *   *Welfare:* Total number of words found by the class in a grid.
          *   *Policy A:* Vowels are worth 2 points.
          *   *Policy B:* Consonants are worth 2 points.
          *   *Contingency:* Some tables are better at vowels, some at consonants. They don't know this until they start.
          *   *Private Stake:* Some students get a bonus if Policy A wins, regardless of score.

  4.  **Developing the Payoff Structure (Requirement 2):**

      *   Need a scoring rule. Quadratic Scoring Rule (QSR) is standard but arithmetic is heavy.
      *   Simpler: "Binary Option" style.
      *   Contract: "Policy A yields higher Welfare than Policy B".
      *   Price: 0 to 100 chips.
      *   Payout: If A > B, holder gets 100 chips. If A <= B, holder gets 0.
      *   *Honesty:* If I believe prob is 60%, expected value of buying at 50 is positive.
      *   *Manipulation:* If I want A to win (private stake), I buy contracts. I push price to 90. If the rule is "Highest Price Wins", A wins. I paid 90, get 100 back (profit 10). But if I push it to 90 and A actually loses (Welfare wise), I lose 90.
      *   *Crucial Futarchy Twist:* The market price *decides* the policy.
      *   *Rule:* The policy with the higher market price for "High Welfare" is enacted.
      *   *Wait, Hanson's Futarchy:* Two markets. Market A: "Welfare if Policy A". Market B: "Welfare if Policy B".
      *   *Decision:* Choose Policy A if Price(A) > Price(B).
      *   *Settlement:* Only the enacted policy's welfare is measured. The other market is voided/cancelled.
      *   *This is the key to Error 2:* The Market B traders get their money back (or voided), but we never learn the true Welfare B.
      *   *Payoff Table:*
          *   Buy at $P$.
          *   If Policy Enacted & Welfare > Threshold: Pay 100.
          *   If Policy Not Enacted: Refund $P$ (No loss, no gain).
          *   *Wait, if refund P, there is no risk in manipulating the losing branch.*
          *   *Correction:* In Futarchy, you bet on the outcome *conditional* on the policy.
          *   *Standard Design:* Market A trades shares paying $W_A$. Market B trades shares paying $W_B$.
          *   *Decision:* Maximize Expected Welfare.
          *   *Simplification for Class:* Binary outcome. "Success" (100) or "Fail" (0).
          *   *Contracts:*
              *   Contract A: Pays 100 if Policy A chosen AND Welfare High. Pays 0 if Policy A chosen AND Welfare Low. Refund if Policy A not chosen.
              *   Contract B: Pays 100 if Policy B chosen AND Welfare High. Pays 0 if Policy B chosen AND Welfare Low. Refund if Policy B not chosen.
          *   *Manipulation Logic:* If I want Policy A to win (private stake), I buy Contract A. This raises Price A. If Price A > Price B, Policy A is chosen.
          *   *Risk:* If Policy A is chosen but Welfare is Low, I lose my investment.
          *   *Incentive:* If my private stake is large enough, I am willing to risk the market loss to ensure Policy A is chosen.
          *   *Visibility:* The payoff table must show that losing the bet is cheaper than losing the policy vote.

  5.  **Addressing Specific Requirements:**

      *   *Req 1 (Welfare):* Task: "Word Search". Grids differ.
          *   Policy A: "Vertical Words Count".
          *   Policy B: "Horizontal Words Count".
          *   Grids are secretly weighted (some have more vertical, some horizontal).
          *   Welfare = Total words found by class.
          *   Contingency: Students don't know grid distribution until they start working.
      *   *Req 3 (Vote on Values):*
          *   Measure 1: "Total Class Score".
          *   Measure 2: "Minimum Table Score" (Rawlsian).
          *   Vote first. This sets the payoff condition for the markets.
          *   Strategic voting: If I know I'm a manipulator for Policy A, do I vote for the measure that helps A? Yes.
          *   Fix: Secret ballot.
      *   *Req 4 (Private Stake):*
          *   4 students (one per table).
          *   Secret role card. "You receive 500 bonus chips if Policy A wins, regardless of welfare."
          *   Size: 500 chips vs potential market profit of 100-200. Enough to tempt.
      *   *Req 5 (Timeline/Materials):* Needs tight scheduling.
      *   *Req 6 (Debrief):* Questions, not lecture.
      *   *Req 7 (Failures):*
          *   Low variance: Make grids very different.
          *   Dead market: Force market making or TA intervenes.
          *   Arithmetic: Keep numbers round (10s and 100s).
          *   Timid manipulators: Give them a nudge or ensure stake is high enough.
      *   *Req 8 (Limitations):* Liquidity, scale, real money risk.
      *   *Req 9 (Fallback):* Condensed version.

  6.  **Refining the Mechanics (Self-Correction):**

      *   *Problem:* If the unchosen market is refunded, manipulation on the *winning* side costs money, but manipulation on the *losing* side costs nothing (just opportunity cost).
      *   *Futarchy nuance:* The decision is made *by* the prices. $Price(A) > Price(B) \rightarrow$ Choose A.
      *   *Settlement:* Only A's welfare is measured. B's contracts are cancelled (refunded).
      *   *Manipulation:* I want A to win. I buy A. Price A goes up. A wins.
      *   *Risk:* If A wins but performs poorly, I lose my bet on A.
      *   *Payoff:* Private Stake (500) > Market Loss (max 100 per share).
      *   *Error 2 Highlight:* The B market traders get refunded. They complain: "We wanted to bet on B! Now we can't prove B was better." This highlights the counterfactual problem.
      *   *Error 1 Highlight:* The welfare isn't "out there". It's created by how hard they work *after* the price is set. If the price says A will be great, does that make it great? (Self-fulfilling prophecy vs. Manipulation).
      *   *Wait, to really hit Error 1:* The welfare must depend on their *trading*? No, that's too complex.
      *   *Better for Error 1:* The welfare depends on their *effort* in the task. The market predicts the effort. But the market *price* determines the task.
      *   *Let's ensure the "Opinion Poll" error is addressed:* Students think the market predicts a fixed future. Here, the future (Welfare) is mutable based on the Policy chosen by the market.
      *   *Crucial:* The "Vote on Values" must happen *before* the market opens.

  7.  **Finalizing the Design Details:**

      *   *Welfare Task:* "The Grid". 4 Tables. Each gets a packet of 10 anagram puzzles.
      *   *Policy Alpha:* Points = Number of puzzles solved.
      *   *Policy Beta:* Points = Number of puzzles solved $\times$ 2, BUT only if solved in the first 5 minutes of the work phase.
      *   *Actually, let's make it more distinct.*
      *   *Policy Alpha:* "Collaboration". Tables can share answers.
      *   *Policy Beta:* "Specialisation". Each table assigned a letter category (Vowels/Consonants).
      *   *Simpler:*
          *   Policy Alpha: "Speed Bonus". Points double if finished in < 10 mins.
          *   Policy Beta: "Accuracy Bonus". Points double if 100% accuracy.
      *   *Welfare:* Sum of all table points.
      *   *Private Stake:* 4 students get bonus if Alpha wins.
      *   *Vote on Values:* "Total Points" vs "Lowest Table Score".
      *   *Market:* Two markets. Market Alpha (Price = Expected Welfare under Alpha). Market Beta (Price = Expected Welfare under Beta).
      *   *Decision:* Policy with higher price wins.
      *   *Settlement:* Winning policy enacted. Welfare measured. Winners paid. Losing market refunded.

      *   *Wait, one catch:* If the losing market is refunded, there is no penalty for manipulating the losing market to lower its price.
      *   *Fix:* To lower Beta's price, I must *sell* Beta. If Beta is refunded, my short position is closed at entry price? No, usually cancelled.
      *   *Standard Futarchy:* Contracts are $W$. If policy not enacted, contract void.
      *   *Manipulation:* To make Alpha win, I buy Alpha (raise price) AND sell Beta (lower price).
      *   *If Beta is voided:* My short sale of Beta is cancelled. I don't lose money on Beta manipulation.
      *   *This is a feature, not a bug:* It shows the asymmetry. It's cheap to suppress the counterfactual.
      *   *But for the game:* Let's keep it simple. Just buying Alpha to raise its price is enough if Beta stays static.
      *   *Payoff Table:* Needs to show Expected Value.
      *   *Chips:* Start with 1000 each.
      *   *Private Stake:* 2000 chips (Hidden).
      *   *Market Profit:* Max 500 chips.
      *   *Incentive:* Sacrifice 500 market chips to gain 2000 private chips.

  8.  **Writing the Response (incorporating British English & Tone):**

      *   Tone: Academic, precise, instructional.
      *   Structure: Follow the 9 requirements exactly.
      *   Check: 80 minutes. 22 Students. 4 Tables.
      *   Check: TA-ready rules.
      *   Check: Debrief questions.

      *(Self-Correction on Timeline)*: 80 minutes is tight for trading + task + debrief.
      *   0-10: Intro & Vote.
      *   10-30: Trading Session 1.
      *   30-35: Decision & Policy Announcement.
      *   35-55: Welfare Task (20 mins).
      *   55-65: Scoring & Payout.
      *   65-80: Debrief.
      *   *Risk:* Trading might drag. Need hard stop.
      *   *Fallback:* Cut trading to 10 mins, Task to 10 mins.

      *(Refining the "Error 1" aspect)*:
      *   Error 1 is "Market = Poll". Polls measure pre-existing sentiment. Markets here *cause* the outcome.
      *   Debrief question: "Did the price predict the future, or did the price *make* the future?"

      *(Refining the "Error 2" aspect)*:
      *   Error 2 is "Manipulation is costly/useless".
      *   Debrief question: "For the manipulators, was the market loss a cost or a purchase price?"
      *   Debrief question: "What do the losers in the cancelled market know about the welfare they missed?"

      *(Materials)*:
      *   Chips (coloured counters).
      *   Policy Cards.
      *   Task Sheets (Anagrams).
      *   Trading Sheets (Ledger).
      *   Role Cards (Manipulators).
      *   Payoff Tables.

      *(Private Stake)*:
      *   4 students (1 per table).
      *   Stake: 1,000 chips if Policy A wins.
      *   Market Cap: Max profit ~400 chips.
      *   This ensures the stake dominates the market logic.

      *(Welfare Task)*:
      *   Needs to be sensitive to Policy.
      *   Policy A: "Volume". Points = Total words found.
      *   Policy B: "Precision". Points = Total words found - (2 $\times$ Errors).
      *   *Contingency:* Some tables are fast/sloppy, some slow/careful. They don't know their type until they start.
      *   *Actually, let's make it simpler for scoring.*
      *   Policy A: "Vowels". Words score 1 point per vowel.
      *   Policy B: "Consonants". Words score 1 point per consonant.
      *   Task: List of 20 words.
      *   Welfare: Sum of points across room.
      *   *Why:* It's deterministic but unknown. Students don't know the word list composition until they see it.
      *   *Wait, if they see the word list before trading, they know the outcome.*
      *   *Fix:* They trade *before* seeing the word list. They only know the *distribution* (e.g., "List is either Vowel-Heavy or Consonant-Heavy").
      *   *Better:* The Word List is fixed. The Policy changes the *scoring*.
      *   *Uncertainty:* Students don't know how many words they will find (effort contingency).
      *   *Okay, let's go with Effort Contingency.*
      *   Task: Solve Anagrams.
      *   Policy A: 10 points per anagram.
      *   Policy B: 5 points per anagram + 5 points per minute remaining.
      *   Welfare: Total Class Points.
      *   Uncertainty: How fast will the class work? (Endogenous).
      *   This fits "Welfare generated by behaviour".

      *(Final Polish on Rules)*:
      *   Ensure the "Refund on Losing Policy" is clear. This is the source of the Counterfactual ignorance.
      *   Ensure the Payoff Table makes the manipulation math obvious.

      *(Fallback)*:
      *   Remove the "Vote on Values". Pre-select "Total Points".
      *   Reduce trading rounds.
      *   Reduce task time.

      *(British English)*:
      *   "Programme", "Centre", "Organise", "Licence" (noun), "Defence".
      *   Currency: "Chips" (no £ sign to avoid confusion with real money).

      *(Review against constraints)*:
      *   22 students. 4 tables.
      *   No real money.
      *   TA ready.
      *   Debrief questions.
      *   Failures & Fixes.

      *Let's write it.*
answer: |-
  # Seminar Game Design: The Futarchy Mechanism

  ## 1. The Welfare Variable and Policies

  **The Productive Task: "The Anagram Harvest"**
  Each of the four tables receives an identical packet of 20 anagram puzzles. The packets are sealed until the Policy is enacted. The class welfare is the **Total Class Score**, calculated by summing the points of all four tables.

  **The Contingency**
  The difficulty of the anagrams is unknown. Some tables may solve them quickly; others may struggle. The total score is therefore a function of collective effort *under the specific scoring rules*. It is not a pre-existing state of the world.

  **The Candidate Policies**
  *   **Policy Alpha (Volume):** 10 points for every correctly solved anagram. No penalty for errors.
  *   **Policy Beta (Precision):** 20 points for every correctly solved anagram, *minus* 5 points for every incorrect guess submitted.

  **Why this works:**
  *   **Error 1 (Poll vs. Market):** The "True Welfare" does not exist until the policy is chosen and the students work. A poll would ask "Which do you prefer?"; the market must price "What will we *achieve*?"
  *   **Error 2 (Manipulation):** If a student wants Alpha to win, they can buy Alpha contracts. If Alpha wins, the task is scored under Alpha rules. If they pushed the price higher than the *actual* outcome, they lose chips on the market—but they may win on a private stake (see Section 4).
  *   **Counterfactual:** Once Alpha is chosen, Beta contracts are voided. We never know what the score would have been under Beta.

  ## 2. Currency and Payoff Structure

  **Currency:**
  *   **Chips:** Blue counters. No monetary value.
  *   **Endowment:** Each student receives **1,000 Chips** at the start.
  *   **Bank:** The instructor (or TA) holds the central bank.

  **The Contracts:**
  There are two markets: **Market Alpha** and **Market Beta**.
  *   **Contract A:** Pays out the *Actual Class Score* if Policy Alpha is enacted. Refunded if Policy Beta is enacted.
  *   **Contract B:** Pays out the *Actual Class Score* if Policy Beta is enacted. Refunded if Policy Alpha is enacted.

  **Trading Mechanism:**
  *   Students submit bid orders to the TA.
  *   **Price:** The current market price is the average of the last 5 trades (or set by TA initially at 500).
  *   **Decision Rule:** The policy with the higher final market price is enacted.

  **Payoff Table (Printed on Student Handouts)**
  *Justification:* This linear payout makes the manipulation arithmetic visible. A manipulator can see exactly how much market loss they can afford to sustain to secure their private stake.

  | Position | Entry Price | Payout Condition | Net Profit/Loss |
  | :--- | :--- | :--- | :--- |
  | **Buy Contract** | $P$ | Policy Enacted & Score $S$ | $S - P$ |
  | **Buy Contract** | $P$ | Policy **Not** Enacted | $0$ (Refund of $P$) |
  | **Sell Contract** | $P$ | Policy Enacted & Score $S$ | $P - S$ |
  | **Sell Contract** | $P$ | Policy **Not** Enacted | $0$ (Position Cancelled) |

  *Note on Honesty:* If a student believes the Score will be 600, and the Price is 500, buying yields expected profit.
  *Note on Manipulation:* If a student wants Policy Alpha to win, they buy Contract A. This raises Price A. If Price A > Price B, Alpha wins. If the actual Score is only 400, but they bought at 550, they lose 150 chips on the market. This loss is visible on the table.

  ## 3. The Opening Vote on Values

  **Timing:** Minutes 00–10.
  **Procedure:**
  1.  Explain the task (Anagrams) but do not distribute packets.
  2.  Present two Welfare Measures:
      *   **Measure 1 (Utilitarian):** Total Class Score (Sum of all tables).
      *   **Measure 2 (Rawlsian):** Lowest Table Score (The score of the worst-performing table).
  3.  **Secret Ballot:** Students vote for Measure 1 or 2. Majority rules.
  4.  **Strategic Voting:** Students *will* try to vote strategically if they know their private role (see Section 4).
      *   *Fix:* The vote is secret. The Instructor collects slips immediately.
      *   *Cost:* 10 minutes.
      *   *Outcome:* This sets the definition of $S$ (Score) for the Payoff Table. (For the sake of this design, we assume Measure 1 wins to keep scoring simple, but the vote legitimises the "Vote on Values" step).

  ## 4. Private Stakes (The Manipulators)

  **Assignment:**
  *   **Number:** 4 Students (Exactly one per table).
  *   **Method:** Sealed envelopes distributed with the initial chip endowment.
  *   **Role:** "Special Interest".

  **The Stake:**
  *   **Normal Students:** Maximise Chip Endowment.
  *   **Special Interest:** Receive a **bonus of 1,500 Chips** if **Policy Alpha** is enacted, regardless of the Welfare Score.
  *   **Secrecy:** They must not reveal their role. If discovered, the bonus is voided.

  **Relative Size:**
  *   Max potential market profit per student (trading aggressively) $\approx$ 400–500 Chips.
  *   Private Stake = 1,500 Chips.
  *   **Incentive:** It is rational for the Special Interest student to lose up to 1,499 Chips in the market to ensure Alpha wins. This makes the manipulation profitable *overall*, even if it is a loss *in the market*. This forces the "purchasing the future" realisation.

  ## 5. Timeline and Materials

  **Total Time:** 80 Minutes.

  **Materials List:**
  1.  **Chips:** 25,000 Blue Counters (in 22 bags of 1,000 + bank reserve).
  2.  **Role Envelopes:** 22 envelopes. 4 contain "Special Interest" cards; 18 contain "Standard Trader" cards.
  3.  **Policy Cards:** 2 large cards (Alpha / Beta).
  4.  **Task Packets:** 4 sealed envelopes, each containing 20 Anagram sheets and a submission form.
  5.  **Trading Ledgers:** 4 sheets (one per table) to record bids.
  6.  **Payoff Tables:** 22 printed handouts.
  7.  **Vote Slips:** 22 small pieces of paper.

  **Run of Play:**

  *   **00–10: Introduction & Vote on Values.**
      *   Distribute chips and Role Envelopes. (Students open envelopes privately).
      *   Conduct Welfare Measure Vote. Tally and announce result (e.g., Total Score).
  *   **10–30: Trading Session.**
      *   Markets Open. Students submit bids to TA/TA assistant.
      *   TA updates prices on whiteboard every 5 minutes.
      *   *Hard Stop:* At minute 30, trading closes. Final Prices recorded.
  *   **30–35: Decision & Enactment.**
      *   Compare Price Alpha vs. Price Beta.
      *   Announce Winning Policy.
      *   **Crucial:** Collect all contracts for the *Losing* Policy. Announce they are voided and chips refunded.
      *   Distribute Task Packets.
  *   **35–55: The Welfare Task.**
      *   Students work on Anagrams under the Winning Policy rules.
      *   Tables submit score sheets.
  *   **55–65: Scoring & Settlement.**
      *   TA calculates Total Class Score ($S$).
      *   Winning Market contracts paid out ($S - P$).
      *   Losing Market contracts refunded.
      *   Special Interest bonuses distributed privately (or added to final tally if anonymity preserved).
  *   **65–80: Debrief.**
      *   Guided discussion (see Section 6).

  ## 6. Debrief Questions

  Do not lecture. Ask these questions in order. Write student answers on the board.

  **Phase 1: Dismantling the "Opinion Poll" Error**
  1.  "At minute 20, what did the Price of Alpha represent?" (Students will say: 'Our guess at the score'.)
  2.  "At minute 40, what determined the Score?" (Students: 'How hard we worked' + 'The Policy Rules'.)
  3.  "Did the Price predict the Score, or did the Price *select* the Rules that created the Score?"
  4.  "If the market had priced Beta higher, would the Score we just calculated exist?" (No. It is a counterfactual.)

  **Phase 2: Dismantling the "Manipulation" Error**
  5.  "Look at the Payoff Table. If you bought Alpha at 600, and the Score was 400, what happened to your chips?" (Loss of 200.)
  6.  "Did anyone make a market loss but still end up with more chips overall?" (Target the Special Interest players.)
  7.  "For those students, was the market loss a *mistake* or a *cost of purchase*?" (It was the price of buying the Policy.)
  8.  "For the Losing Market (e.g., Beta): You were refunded. Do you know what the Score *would* have been?" (No.)
  9.  "So, can we say the Market was 'accurate'? Or simply that the Losing Market was silenced?"

  **Phase 3: The Realisation**
  10. "Raise your hand if you stopped trading to *forecast* the future, and started trading to *create* it."
  11. "In a real polity, if the price *is* the decision rule, who has the incentive to ensure the price is honest?"

  ## 7. Predictable Failures and Pre-emptive Fixes

  **Failure 1: Too Little Variance in Outcome.**
  *   *Risk:* The class scores roughly the same under both policies (e.g., Alpha=500, Beta=490). The manipulation incentive feels negligible.
  *   *Fix:* **Asymmetric Task Design.** Prepare the Anagram packets such that they are *easier* to solve quickly (favouring Alpha/Volume) but contain traps (favouring Beta/Precision if careful). Inform students: "The packets are weighted, but you don't know how." This increases uncertainty and price spread.

  **Failure 2: The Losing Market Dies.**
  *   *Risk:* Once Price Alpha > Price Beta, everyone stops trading Beta because it will be voided.
  *   *Fix:* **TA Market Making.** The TA must announce: "I will buy/sell Beta at [Price] to maintain liquidity." This keeps the price visible until the very last second, emphasising that the *final* price dictates the decision.

  **Failure 3: Chip Arithmetic Bogs Down.**
  *   *Risk:* Calculating $S - P$ for 22 students takes too long.
  *   *Fix:* **Round Numbers.** Ensure the Anagram scoring yields a multiple of 10. Require trades in increments of 10 chips. Use a projected spreadsheet for the TA to calculate payouts instantly while students discuss.

  **Failure 4: Manipulators are Too Timid.**
  *   *Risk:* Special Interest students fear losing chips and trade conservatively.
  *   *Fix:* **The "Whisper" Nudge.** At minute 15, the TA walks past tables and says loudly: "Remember, your final ranking depends on total chips, not just market profit." This hints at the private stake without revealing roles.

  ## 8. Limitations of the Game

  **Irreproducible Features (Must be supplied verbally):**
  1.  **Continuous Liquidity:** Real futarchy relies on global, 24/7 markets. This game has discrete trading windows. You must explain that in reality, manipulation is harder because honest arbitrageurs are always watching. Here, the "arbitrageurs" are their classmates, who are distracted by the task.
  2.  **Scale of Welfare:** In the game, Welfare is points. In reality, Welfare is "human flourishing". You must supply the philosophical weight of the "Vote on Values". The game treats the measure as fixed after the vote; in reality, that vote is the most contested part of futarchy.

  **Difficult but Possible Features:**
  1.  **Risk Aversion:** Students treat chips as game points. Real money induces risk aversion which dampens manipulation. You must note that without real skin in the game, the "cost" of manipulation feels lower than it would be with rent money.
  2.  **Information Aggregation:** In the game, information is symmetric (everyone sees the board). Real markets rely on private information. You must explain that the "wisdom" comes from dispersed knowledge, which this game only simulates via the private role cards.

  ## 9. Twenty-Five-Minute Fallback Version

  *Use this if the seminar overruns or technology fails.*

  **Modifications:**
  1.  **Skip Vote on Values:** Pre-announce Welfare = Total Class Score. (Saves 10 mins).
  2.  **Simplify Task:** "Rock-Paper-Scissors Tournament".
      *   Policy Alpha: Rock beats Scissors, Scissors beats Paper, Paper beats Rock (Standard).
      *   Policy Beta: Rock beats Everything. (Absurd, but easy to score).
      *   *Wait, too simple.*
      *   **Better Fallback Task:** "Estimation".
      *   Task: Guess the number of beans in a jar.
      *   Policy Alpha: Closest single guess wins points for the class.
      *   Policy Beta: Average of all guesses wins points.
      *   *Welfare:* Points awarded based on accuracy.
  3.  **Compressed Trading:** One 5-minute trading round.
  4.  **No Private Stakes:** Instead, assign **Tables** as factions. Table 1 gets bonus if Alpha wins. Table 2 if Beta wins. This makes the manipulation collective and obvious.
  5.  **Debrief:** Focus solely on the Counterfactual. "We chose Alpha. We paid Beta traders back. Does anyone know if Beta would have yielded more points?"

  **Fallback Timeline:**
  *   00–05: Rules & Endowment.
  *   05–10: Trading.
  *   10–15: Decision & Task (Estimation).
  *   15–20: Scoring.
  *   20–25: Debrief (Questions 8 & 9 from main list only).

  ---

  ### Teaching Assistant Briefing Note

  **Critical Rule:** When the Losing Policy is announced, you must physically collect the contracts and hand back the chips *immediately*. Do not wait. Say: "This market is closed. The future it bet on did not happen." This performative act is essential for the students to feel the erasure of the counterfactual.

  **Critical Observation:** Watch the Special Interest students. If they are not buying aggressively by minute 20, lean in and ask: "Are you maximising your total chip count or just your market profit?" Do not mention the bonus. Let them realise the arbitrage themselves.

  **Safety:** If a student identifies a Special Interest player publicly, intervene. "Allegations of insider status pause the bonus for that table." This keeps the game theory intact.
