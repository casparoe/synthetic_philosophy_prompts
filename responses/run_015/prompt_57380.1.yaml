          *   Blunt honesty preferred over plausible reconstruction.
          *   Advice on scope (narrowing down).
      *   **Core Argument:** Du Bois isn't prescribing propaganda (art *should* serve the race) but describing reception conditions (art about Black life *is* received as propaganda regardless of intent due to audience bias). Term: "Loaded Default."
      *   **Personal Stake:** The user is defending their own mural work against a juror who said it's "advocacy but not art."

  2.  **Deconstruct the Paper Notes:**
      *   *(1) Standard Reading:* Du Bois prescribes art for the race vs. art for art's sake.
