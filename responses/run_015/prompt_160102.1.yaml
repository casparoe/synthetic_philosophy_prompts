prompt: |-
  hi — I write SF novels (the kind with a lot of argument in them, sorry) and I'm stuck on a chapter. There's a character, Marta, who has to write the expedition report on whether the locals count as thinkers at all, and I want her reasoning to be better than two cliches trading slogans. The creatures in my book are:

  the Shoal — a colony of about ten thousand small organisms. There is no single body whose states do anything. The patterns that would play the belief and desire roles only exist across the whole colony, and if you remove any one organism the pattern survives but reorganises.

  the mimics — behaviourally indistinguishable from us, internally nothing like us: same inputs, same outputs, different machinery, and on top of that the machinery that does the job on Tuesday isn't the machinery that does it on Thursday.

  the sleepers — internally full of the right states, causally wired to each other in all the right ways, but nothing downstream ever reaches behaviour. They never move differently because of what they believe.

  Marta's colleagues have two lines and I don't want her to just recite them. One says: same job, so same mind — which as far as I can tell collapses into saying a thermostat or a national economy has beliefs. The other says: no neurons, no mind — which my readers will see through in a paragraph.

  So what I actually want, before I write the scene, is the spec. Write me the list of requirements any theory of what-it-is-to-have-a-belief has to meet to be any good at cases like these. Cases it has to give a verdict on. Distinctions it isn't allowed to flatten — having a mind vs. having the same kind of mind we have; being in a state vs. that state being realised by something; the state vs. whatever plays the role; how fine-grained the job description gets to be; occurrent vs. merely dispositional. And the arguments it has to survive: the old one where it turns out every damn system realises some role or other (Putnam's, I think?), and the one about whether the realiser or the role is what does the causal work.

  For each requirement give me the case or consideration behind it, and mark which ones are non-negotiable and which are just what one camp happens to want. Then flag any pair of requirements I probably can't have both of — that's the bit I most want, because it gives me something for Marta to genuinely be stuck on rather than something she wins.

  If there's room at the end, a short scorecard for the obvious candidates: the it's-the-job-not-the-stuff view, the view that mental states are just brain states, and whatever the current version is where the science tells you what the realiser is and the folk theory only fixes the role. But keep the weight on the requirements, that's the part I can't get from a skim. And no reading list or footnotes — my character is on a planet without a library, and neither of us can look anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** SF novelist writing "argument-heavy" SF.
      *   **Problem:** Stuck on a chapter where character Marta writes an expedition report on whether aliens count as "thinkers."
      *   **Alien Cases:**
          1.  *The Shoal:* Distributed cognition, no single body, patterns survive removal of parts.
          2.  *The Mimics:* Behavioral duplicates of humans, internal machinery different and shifting (functionalism nightmare).
          3.  *The Sleepers:* Internal states wired correctly but no behavioral output (zombie-ish but with internal causation).
      *   **Colleague Positions (to avoid):** "Same job = same mind" (too broad, includes thermostats) vs. "No neurons = no mind" (too chauvinistic).
      *   **Task:** Create a "spec" (list of requirements) for a theory of belief/mind that handles these cases.
      *   **Specifics:** Include cases/considerations for each requirement, mark non-negotiable vs. optional, flag incompatibilities (trade-offs) for dramatic tension.
      *   **Ending:** A short scorecard for standard theories (Functionalism, Identity Theory, Hybrid).
      *   **Constraints:** No reading list, no footnotes (in-universe feel), focus on the requirements.

  2.  **Deconstruct the Philosophical Landscape:**
      *   The user is asking for a rigorous breakdown of the Philosophy of Mind, specifically focusing on *Multiple Realizability*, *Functionalism*, *Identity Theory*, and *Causal Role* vs. *Constitution*.
      *   The core tension is between *Broad Functionalism* (mind is what it does) and *Narrow Physicalism* (mind is what it's made of), with nuances regarding *Causal Powers* and *Phenomenology* (though the prompt focuses more on belief/cognition than qualia).
      *   The "Putnam" reference points to the *Multiple Realizability* argument against Identity Theory.
      *   The "Thermostat/National Economy" objection points to the *Triviality* or *Panpsychism* problem for Functionalism.
      *   The "Sleepers" case points to the *Causal Theory of Mind* vs. *Internalism*.

  3.  **Drafting the Requirements (The Spec):**
      *   I need to formulate these as engineering/design requirements for a theory, fitting the "expedition report" vibe.
      *   *Requirement 1: Substrate Neutrality.* (Addresses "No neurons" cliché). Must allow different stuff to do the thinking. *Non-negotiable* for SF, but tricky.
      *   *Requirement 2: Causal Efficacy.* (Addresses "Sleepers"). Beliefs must *do* something. If they don't affect output, are they beliefs? *Non-negotiable* for most naturalists.
      *   *Requirement 3: Granularity/Individuation.* (Addresses "Mimics"). How specific does the job description need to be? If the internal wiring changes daily, is it the same mind? *Negotiable/Debated*.
      *   *Requirement 4: System Boundaries.* (Addresses "Shoal"). Where does the mind start and stop? Is the colony the thinker or the individuals? *Non-negotiable* to define, but the *answer* is debated.
      *   *Requirement 5: Triviality Avoidance.* (Addresses "Thermostat"). Don't let everything count as a thinker. *Non-negotiable*.
      *   *Requirement 6: Diachronic Stability.* (Addresses "Mimics" again). Does the mind need a stable physical base over time? *Negotiable*.

  4.  **Identifying the Incompatibilities (The Drama):**
      *   This is the most important part for the novelist. Marta needs to be stuck because the requirements contradict.
      *   *Conflict A:* Substrate Neutrality vs. Triviality Avoidance. If you say "any stuff can think," you risk saying "everything thinks." If you say "only specific stuff thinks," you lose the aliens.
      *   *Conflict B:* Causal Efficacy (Output) vs. Internal Integrity. The Sleepers have the internal wiring but no output. The Mimics have the output but unstable internal wiring. You can't satisfy both "Must look like us inside" and "Must act like us outside" without ruling out one of the alien cases.
      *   *Conflict C:* The Role vs. The Realizer. If the *role* is the belief, the Sleepers have it (internally) but it's causally inert regarding behavior. If the *realizer* is the belief, the Mimics fail because the realizer changes.

  5.  **Refining the "Spec" for the User:**
      *   Use technical but accessible language.
      *   Structure it clearly: Requirement, The Case/Pressure, Status (Hard/Soft).
      *   Highlight the "Impossible Triangle" or trade-offs.

  6.  **Developing the Scorecard:**
      *   *Functionalism (Job Description):* Good for Mimics/Shoal, bad for Sleepers (maybe), terrible for Triviality (Thermostats).
      *   *Identity Theory (Neural Chauvinism):* Good for Triviality, bad for Shoal/Mimics.
      *   *Teleosemantics/Evolutionary:* (Maybe too complex? Stick to the prompt's "current version"). Let's use "Role-Filler Hybrid" or "Causal Power Theory." Let's stick to the prompt's suggestion: "Science tells realiser, folk fixes role."
      *   Actually, let's keep it to the three implied: Functionalism, Physicalism, and the "Hybrid/Scientific" view.

  7.  **Review against Constraints:**
      *   No footnotes? Check.
      *   No reading list? Check.
      *   Focus on requirements? Check.
      *   Address Shoal, Mimics, Sleepers? Check.
      *   Address Putnam/Triviality arguments? Check.

  8.  **Final Polish (Tone):**
      *   Keep it analytical but evocative. The user is a writer; the language should spark ideas.
      *   Ensure the "Incompatibilities" section is punchy, as that's the source of the conflict in the chapter.

  *(Self-Correction during drafting)*: I initially thought about bringing in Qualia/Consciousness. But the prompt specifically asks about *belief* and *thinking* (propositional attitudes). I should stick to cognition to keep it tight. The Sleepers case is about behavior vs. internal state, not necessarily pain/qualia. I will focus on *Intentionality* and *Causal Role*.

  *(Refining the Mimics)*: The Mimics change machinery daily. This attacks *Diachronic Identity*. A theory needs to explain how a mind persists if the hardware swaps out.
  *(Refining the Shoal)*: This attacks *Locality*. Where is the belief?
  *(Refining the Sleepers)*: This attacks *Causal Connection to World*.

  *(The "Impossible Trade-off")*: The strongest tension is between *Multiple Realizability* (allowing Shoal/Mimics) and *Causal Specificity* (ruling out Thermostats). If the job description is abstract enough to fit the Shoal, it fits the Economy. If it's specific enough to rule out the Economy, it excludes the Shoal. This is the "Level of Abstraction" problem.

  Let's assemble the response.

  *Structure:*
  1.  Intro (acknowledging the task).
  2.  The Spec (Requirements 1-6).
  3.  The Incompatibilities (The "Bug List" for Marta).
  4.  The Scorecard (Theory evaluation).
  5.  Closing thought.

  *Drafting the Content:*
  *   Req 1: Multiple Realizability (The Mimics).
  *   Req 2: Causal Output (The Sleepers).
  *   Req 3: Non-Triviality (The Thermostat).
  *   Req 4: Spatial/Temporal Locality (The Shoal).
  *   Req 5: Diachronic Stability (The Mimics again).
  *   Req 6: Internal Coherence (The Sleepers again).

  *Incompatibilities:*
  *   Realizability vs. Triviality (The Abstraction Gap).
  *   Output vs. Internal Structure (The Black Box Problem).
  *   Stability vs. Flux (The Ship of Theseus Problem).

  *Scorecard:*
  *   Functionalism.
  *   Identity Theory.
  *   Bio-Naturalism (The Hybrid).

  Okay, ready to write. I will ensure the tone is professional, direct, and helpful for a writer constructing an argument.cw
answer: |-
  Here is the spec you asked for. It is structured as a design document for a theory of mind. Marta can use this to audit the existing theories, or she can find her own position by seeing where the requirements break.

  ### The Spec: Requirements for a Theory of Belief

  To count as a "thinker" in your report, a system must satisfy the following constraints. I have marked them **Hard** (non-negotiable for a naturalistic theory) or **Soft** (negotiable, often where the philosophical camps split).

  **1. Multiple Realizability**
  *   **The Case:** The Mimics. They produce human-like output using non-human, shifting internal machinery.
  *   **The Requirement:** The definition of a belief cannot depend on the specific physical stuff (neurons, silicon, chitin) that constitutes the system. It must depend on the organization of that stuff.
  *   **Status:** **Hard.** If you fail this, you are a neural chauvinist. You rule out the Mimics, AI, and likely any alien life by fiat.
  *   **The Risk:** If the definition is too independent of the stuff, it becomes too easy to satisfy (see Requirement 3).

  **2. Causal Efficacy (Downstream Power)**
  *   **The Case:** The Sleepers. They have the internal wiring but no behavioral output.
  *   **The Requirement:** A belief state must be capable of making a difference to the system's interaction with the world. If a state is causally inert regarding behavior, it is not a belief; it is a decoration.
  *   **Status:** **Hard.** Without this, you cannot distinguish a thinker from a static map or a dreamer who never wakes.
  *   **The Risk:** This threatens the Sleepers. If they *never* move differently because of their states, do they have minds? If you say yes, you violate this requirement. If you say no, you imply that a paralyzed human has no beliefs.

  **3. Non-Triviality (The Thermostat Constraint)**
  *   **The Case:** The Thermostat / National Economy.
  *   **The Requirement:** The theory must not classify simple feedback loops or large-scale statistical aggregates as "believers." A thermostat "believes" it is too cold only in a metaphorical sense. A theory of mind must distinguish literal belief from metaphorical ascription.
  *   **Status:** **Hard.** If you fail this, the concept of "belief" loses its explanatory power. If everything thinks, nothing thinks.
  *   **The Risk:** This is the direct enemy of Requirement 1. The more abstract the "job description" is to allow for Mimics, the easier it is for a thermostat to do the job.

  **4. Spatial Locality (The Boundary Problem)**
  *   **The Case:** The Shoal.
  *   **The Requirement:** The theory must specify where the mind is located. Is the believer the individual organism, the colony, or the pattern itself? A theory must be able to draw a boundary around the "self" that holds the belief.
  *   **Status:** **Hard.** You cannot write a report on their rights or status without knowing who "they" are.
  *   **The Risk:** Functional patterns often leak across boundaries. If the pattern survives the removal of organisms, is the mind immortal? If the mind is the pattern, does it exist when the organisms are scattered?

  **5. Diachronic Stability**
  *   **The Case:** The Mimics (again). Their machinery changes on Tuesday vs. Thursday.
  *   **The Requirement:** The theory must explain how a mind remains the *same* mind over time despite physical change.
  *   **Status:** **Soft.** Some theories accept that the "self" is a fleeting series of stages. But for legal/moral reporting, you usually need a persistent agent.
  *   **The Risk:** If you demand physical stability, you lose the Mimics. If you demand only functional stability, you risk Requirement 3 (a changing economy might look functionally stable).

  **6. Internal Coherence (The Role-Filler Distinction)**
  *   **The Case:** The Sleepers vs. The Mimics.
  *   **The Requirement:** The theory must decide whether the belief *is* the causal role (the job description) or the physical realizer (the machinery doing the job).
  *   **Status:** **Hard.** You cannot have it both ways.
  *   **The Risk:**
      *   If Belief = Role: The Sleepers have beliefs (they have the internal wiring), but the Mimics might not (if their shifting machinery doesn't count as a stable role).
      *   If Belief = Realizer: The Mimics have beliefs (they have physical states), but the Sleepers might not (if their physical states don't connect to the world).

  ***

  ### The Incompatibilities (The Bug List)

  This is where Marta gets stuck. You cannot maximize all the Hard requirements simultaneously. She must choose which constraint to violate.

  **Conflict A: The Abstraction Trap (Req 1 vs. Req 3)**
  *   **The Tension:** To include the Mimics (Multiple Realizability), you must describe the "job" of belief abstractly (e.g., "processes input to produce rational output"). But if the job description is that abstract, a Thermostat or a National Economy also fits the description.
  *   **The Choice:** Marta must either accept that economies have beliefs (and explain why that's okay), or she must make the job description specific enough to rule out thermostats, which risks excluding the Mimics.
  *   **Dramatic Angle:** If she defines "thinking" broadly enough to save the Shoal, she accidentally grants legal personhood to the ship's computer or the colony's food distribution system.

  **Conflict B: The Black Box Problem (Req 2 vs. Req 6)**
  *   **The Tension:** To rule out the Sleepers, you need Causal Efficacy (Output). To rule out the Mimics as "hollow," you want Internal Coherence. But the Mimics *have* output and the Sleepers *have* internal coherence.
  *   **The Choice:** Does the belief live in the *cause* (internal state) or the *effect* (behavior)?
      *   If she prioritizes Internal Coherence, the Sleepers are thinkers (trapped in bodies).
      *   If she prioritizes Causal Efficacy, the Sleepers are vegetables, but the Mimics are thinkers even if their insides are magic dust.
  *   **Dramatic Angle:** If she rules the Sleepers out because they don't move, she implies a paralyzed human isn't a person. If she rules them in, she admits that a mind can exist with zero connection to reality.

  **Conflict C: The Ship of Theseus (Req 4 vs. Req 5)**
  *   **The Tension:** The Shoal changes members constantly. The Mimics change machinery constantly.
  *   **The Choice:** Does the mind require a stable physical substrate?
      *   If Yes: The Shoal is not a single thinker; it's a crowd. The Mimics are a new person every Thursday.
      *   If No: The mind is a ghostly pattern. But then, if the Shoal disperses and reforms a year later, is it the same thinker?
  *   **Dramatic Angle:** This determines liability. If the Shoal commits a crime, but the specific organisms involved have since been replaced by new growth, who do you arrest?

  ***

  ### Scorecard: Existing Candidates

  Here is how the standard theories score against the spec. None pass perfectly.

  **1. Functionalism (It's the Job, Not the Stuff)**
  *   **Verdict:** Passes on Mimics and Shoal. Fails on Thermostats.
  *   **Why:** It defines belief by causal role. This allows any machinery (Mimics) and any scale (Shoal).
  *   **The Glitch:** It cannot stop the "Triviality" slide. If a belief is just a state that mediates input and output, a thermostat mediates temperature input and heater output. Functionalism struggles to explain why the thermostat's "belief" is metaphorical and the Mimic's is literal without smuggling in biological requirements.
  *   **Marta's Problem:** If she uses this, she has to explain why the Shoal is a person but the ecosystem isn't.

  **2. Identity Theory (No Neurons, No Mind)**
  *   **Verdict:** Passes on Thermostats. Fails on Mimics and Shoal.
  *   **Why:** It defines belief as a specific neurophysiological state. This guarantees Non-Triviality (only complex brains qualify).
  *   **The Glitch:** It is empirically fragile. If we meet the Mimics, this theory forces us to call them philosophical zombies (no inner life) despite identical behavior. It makes the mind dependent on the periodic table rather than the organization.
  *   **Marta's Problem:** If she uses this, she has to write a report saying the Mimics are "empty" despite talking to them, which readers will find implausible.

  **3. Bio-Naturalism / Hybrid (Science Fixes Realizer, Folk Theory Fixes Role)**
  *   **Verdict:** Passes on Thermostats and Sleepers. Fails on Mimics.
  *   **Why:** This view says belief is a biological function evolved for survival. It requires the right history (evolution) and the right stuff (biology).
  *   **The Glitch:** It excludes the Mimics entirely (they aren't evolved biological organisms) and potentially the Shoal (if the individuals are simple but the colony is complex). It treats the "mind" as a specific natural kind, like "water" (H2O), rather than a functional kind, like "valve."
  *   **Marta's Problem:** This is the safest scientific bet, but it's the most ethically restrictive. It allows her to dismiss the aliens as "simulacra."

  ### Recommendation for the Scene

  Marta should not solve this. The tension comes from her realizing that **Requirement 1 (Multiple Realizability)** and **Requirement 3 (Non-Triviality)** are mutually exclusive at the level of abstraction she needs for the report.

  If she defines "thinker" broadly enough to protect the Shoal from being harvested, she inadvertently grants rights to the ship's navigation computer. If she defines it narrowly enough to keep the computer as a tool, she classifies the Shoal as mere matter.

  The chapter isn't about finding the right answer. It's about her choosing which contradiction she can live with.
