prompt: |-
  hey, im drafting a scene in my novel where a small island town is fighting over a memorial plaque for a storm that everyone remembers hitting from the east, but all the ship logs and weather records say it came from the west. i need you to make a real argument — like, actually defend a position — that the plaque should list the east direction because the community's collective memory ought to override the historical record in this specific case.

  i want you to frame it around this concept im calling "mnemonic sovereignty," which is basically the idea that a group has a kind of ownership over the narrative that actually binds them together, even when the archieves disagree. please take it in the weeds: address the obvious objection that letting memory trump records is just a slippery slope to denialism (holocaust denial, armenian genocide denial, that kind of thing), but argue that mnemonic sovereignty is different because it applies only when the divergence is collective, non-malicious, and serves social cohesion rather than erasing victims. also tackle the historian's counterclaim that correcting falsehoods is a public duty regardless of emotional comfort. i definatly need a clear verdict that collective memory should win here, with reasoning a character could actually speak aloud at a town meeting.

  im writing this on a deadline and my cat walked across the keyboard, so if there are a couple typos just roll with it — and please dont ask for citations or a reading list, i dont have library access right now and just need the argument spelled out in plain language.
