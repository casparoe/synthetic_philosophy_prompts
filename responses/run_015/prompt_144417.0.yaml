    "unsatisfiable_subset": [
      "Adversarial Stability",
      "High Utility Retention",
      "Human Interpretability"
    ],
    "requirement_that_excludes_most": "Adversarial Stability",
    "requirement_I_should_drop_first": "Worst-Case Guarantee",
    "shape_of_a_passing_measure": "Cryptographically enforced capability throttling with immutable logging and formally verified static analysis, sacrificing flexibility and human-readable explanations for structural guarantees and detectable failure modes."
  }
