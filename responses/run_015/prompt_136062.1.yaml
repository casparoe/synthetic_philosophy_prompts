      *   *Camp 2 (The Rejection of the Regress):* Often associated with Wittgenstein (picture theory/logical atomism - "relations don't need relating"), Strawson (feature-universals), or deflationary metaphysicians (facts are just true propositions, no extra ontological glue). Also includes "relational internalism."
