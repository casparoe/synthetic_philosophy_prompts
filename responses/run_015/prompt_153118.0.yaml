  1. **The Immortal State**: This position holds that the nation is a single moral person that survives its citizens, requiring you to accept that Germany in 2080 is literally the same agent as Germany in 1940. Its most awkward commitment is pretending the state has a continuous soul that can bear guilt without a brain.

  2. **The Debt Inheritor**: This view argues citizens inherit only the duty to repair damage rather than the guilt itself, separating financial liability from moral blame. Its most awkward commitment is forcing newborns to pay reparations for crimes they are explicitly forbidden from admitting they committed.

  3. **The Generational Sunset**: This stance claims that moral responsibility expires automatically when the last perpetrator dies, treating guilt as strictly biological rather than institutional. Its most awkward commitment is accepting that no one is responsible for fixing systemic harms once the original villains are buried.

  4. **The Cultural ShameBearer**: This position suggests guilt is merely a metaphor for distributed shame embedded in social structures that outlive individuals. Its most awkward commitment is demanding citizens feel deep shame for actions they physically could not have performed or prevented.

  5. **The Atomic Citizen**: This view reduces all guilt to individual mental states, denying any collective entity exists to hold blame across time. Its most awkward commitment is asserting that a nation can commit genocide without the nation itself ever being guilty of anything.
