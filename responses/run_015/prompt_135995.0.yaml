prompt: |-
  Write a one-page research proposal (approximately 500 words) for a dissertation chapter in philosophy of history. The guiding idea is half-formed: Zygmunt Bauman argues that the Holocaust was made possible not despite modernity but because of its bureaucratic-rational structures, yet this claim might depend on treating modern bureaucratic rationality as distinctive to twentieth-century European states. The proposed project asks whether that explanatory work collapses if we apply Bauman’s framework to large-scale administrative violence in colonial regimes that possessed organizational scale but lacked the specific legal-technical infrastructure he describes. In other words, is Bauman’s concept of modernity doing genuine causal work, or is it functioning as a proxy for organizational complexity that could exist outside modern Europe?

  State the precise research question, explain why the standard Historikerstreit debate over uniqueness versus comparability does not resolve this particular issue, outline the method (conceptual analysis of bureaucratic rationality paired with structured historical comparison rather than archival research), describe what a successful conclusion would demonstrate, specify what would count as failure, and provide an honest assessment of whether the scope is manageable for a single dissertation chapter. Write in formal American English. Do not include a bibliography, reading list, or citations; the proposal should stand on its reasoning alone.
