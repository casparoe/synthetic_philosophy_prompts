  8.  **Self-Correction during drafting:**
      *   *Correction:* I initially thought Dave's Move 4 was weak. Actually, in philosophy of identity, the Fission argument is devastating to Simple Psychological Continuity theories. I need to rate it higher on *problem-identification* but lower on *solution-proposal*.
      *   *Correction:* Lena's molecular turnover point is scientifically shaky. Adult neurons are post-mitotic. They repair, but they aren't swapped out 100% over a century like skin cells. I need to point this out as a biophysicist would.

  9.  **Final Structure:**
