prompt: |-
  I'm a retired marine biologist — thirty years of North Sea benthic surveys — and now I finally have time to read, I've got into philosophy, mostly social choice theory after a shouting match at our natural history society. Here's what I actually need.

  I sit on the council of a small conservation trust, about forty members, and we settle maybe six things a year by vote: where the year's budget goes, which of three sites we bid on, who gets our little research grant, where the AGM is held. Whenever a result is close somebody says the rule was gamed, and we keep shopping for a voting rule that can't be gamed. Then I ran into the Gibbard–Satterthwaite theorem and worked out there probably isn't one, not with three or more options and no dictator. So don't explain the theorem to me again — what I want is something the council can run.

  Give me a procedure for choosing and stress-testing a voting rule given that every rule is manipulable somewhere: the questions in order, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a values call rather than a technical one. Constraints: doable by volunteers in an afternoon with a spreadsheet, no software and no consultants; it has to work when we barely know how members will vote, since we vote by email all at once and the ballots are visible to the whole council afterwards; and it has to be honest about which assumption we're giving up when we give it up — squashing the options down so preferences line up on one dimention, using money or a lottery instead of a straight choice, cutting one decision into two, whatever else there is. It should also keep apart the question can this rule be gamed in principle from will it be gamed by people who don't know how anyone else is voting.

  Then run it on three of our recurring votes: picking the AGM venue, where everyone basically wants it near where they live and the options really do sit on a map; splitting the grants budget between three unrelated causes, where I can't see any single dimension they line up on; and our two-round system for the research grant, shortlist first then winner — I'm rather fond of that one and I suspect you're going to tell me it doesn't help. Finally, tell me what the procedure can't tell me, where it's silent, and where I'd be kidding myself if I thought it had settled something. And say plainly which step is doing the real work, because my guess is that most of it comes down to guessing what our members actually want rather than to anything in the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired marine biologist (30 years North Sea benthic surveys), detail-oriented, empirical mindset, sits on a conservation trust council (40 members), newly read up on social choice theory (specifically Gibbard-Satterthwaite).
      *   **Problem:** The council keeps fighting over voting rules because close results lead to accusations of gaming. They know G-S theorem implies no perfect rule exists (3+ options, no dictator), so they don't want the theorem explained. They want a *procedure* to choose and stress-test a rule.
      *   **Constraints:**
          *   Doable by volunteers in an afternoon with a spreadsheet.
          *   No software, no consultants.
          *   Voting by email (simultaneous, ballots visible afterwards).
          *   Must distinguish between *theoretical manipulability* vs. *practical manipulability* (information asymmetry).
          *   Must be honest about which assumption is being relaxed (single-peakedness, deterministic outcome, etc.).
          *   Must apply to three specific scenarios: AGM venue (spatial/single-peaked), Grant budget split (multi-dimensional), Research grant (two-round system).
          *   Must identify limitations (what the procedure can't solve) and the "real work" step (guessing member preferences).
      *   **Tone:** Professional, respectful of expertise, pragmatic, no fluff, direct.

  2.  **Deconstruct the Task:**
      *   **Core Task:** Design a "Voting Rule Selection & Stress-Test Protocol."
      *   **Sub-tasks:**
          1.  Define the steps/questions.
          2.  Define pass/fail criteria.
          3.  Identify "Values Calls" vs. "Technical Stops."
          4.  Apply to the three specific cases.
          5.  Discuss limitations and the "real work."

  3.  **Drafting the Protocol (The "Procedure"):**
      *   *Goal:* Move from "Find the perfect rule" to "Find the least bad rule for *this* specific context."
      *   *Step 1: Define the Decision Space.* (Options, Constraints).
      *   *Step 2: Check for Single-Peakedness.* (Crucial for avoiding G-S in practice).
      *   *Step 3: Assess Information Environment.* (Can people game it if they don't know others' votes?).
      *   *Step 4: Select Candidate Rules.* (Keep it simple: Plurality, Borda, Approval, Two-Round).
      *   *Step 5: Stress Test (The Spreadsheet).* (Simulate scenarios).
      *   *Step 6: The Values Call.* (Accepting trade-offs).

  4.  **Refining the Steps (incorporating constraints):**
      *   *Spreadsheet friendly:* Needs to be simple calculations.
      *   *Email voting:* Means no iterative rounds unless scheduled. Ballots visible means retaliation/reputation matters.
      *   *G-S Acknowledgement:* Acknowledge manipulability exists, focus on *cost* of manipulation.
      *   *Assumption Relaxation:* Explicitly state what we are giving up (e.g., "We assume preferences are single-peaked" or "We accept a lottery").

  5.  **Applying to the Three Cases:**
      *   *Case 1: AGM Venue.* Spatial. Likely single-peaked if ordered geographically. *Verdict:* Median Voter Theorem applies. Simple majority on ordered options works.
      *   *Case 2: Grant Budget Split.* Multi-dimensional (3 unrelated causes). No single dimension. *Verdict:* High risk of cycling/instability. Need to relax "deterministic" or "exhaustive partitioning." Maybe Approval Voting or fixed quotas.
      *   *Case 3: Research Grant (Two-Round).* User likes it. Theory says it reduces to plurality on the top two. *Verdict:* It *does* help strategically (focal points), but doesn't solve Condorcet cycles. Keep it for psychological comfort, not mathematical purity.

  6.  **Addressing the "Real Work" and Limitations:**
      *   *Real Work:* It's not the math; it's the sociological assessment of the voters (Step 2 & 3).
      *   *Limitations:* Can't predict bad faith. Can't solve deep value conflicts. Can't prevent post-hoc rationalization.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone Check:* The user is a scientist. Use precise language. Avoid condescension. Acknowledge their G-S knowledge.
      *   *Structure:*
          1.  Introduction (Acknowledging the impasse).
          2.  The Protocol (6 Steps).
          3.  Application to the Three Cases.
          4.  Limitations & The "Real Work."
      *   *Specific Constraint Check:* "Where the procedure stops with a no." -> Need clear fail states. "Where it hands decision back." -> Need clear values calls.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Initially, I might suggest Ranked Choice (IRV). But IRV is manipulable and hard to count in a spreadsheet without training. Better to suggest Approval or Borda for simplicity, or stick to Plurality if single-peaked. Let's recommend *Approval Voting* for the multi-dim case and *Ordered Plurality* for the spatial case.
      *   *Correction on Two-Round:* The user suspects I'll say it doesn't help. I need to be nuanced. It restricts the domain in the second round, which simplifies the strategic landscape, even if it doesn't cure G-S.
      *   *Emphasis:* Make sure to highlight the difference between *theoretical* manipulability (G-S) and *practical* manipulability (needs info). Since ballots are email and visible *afterwards*, gaming requires predicting votes *before*. This is the key lever.

  9.  **Final Review against constraints:**
      *   Spreadsheet? Yes.
      *   Afternoon? Yes.
      *   No software? Yes.
      *   Honest about assumptions? Yes.
      *   Distinguish principle vs. practice? Yes.
      *   Three cases covered? Yes.
      *   Limitations clear? Yes.

  10. **Final Polish:** Ensure the voice sounds like one expert talking to another (Marine Biologist to Philosopher/Practitioner). Use metaphors if helpful (benthic surveys -> sampling error).

  *(Self-Correction during final output generation)*: Wait, the prompt asks for "the questions in order, what counts as an adequate answer... where the procedure stops." I need to format this as a strict flowchart/protocol, not just an essay. I will structure it as a "Field Protocol."

  Let's build the "Field Protocol for Voting Rule Selection."

  *   *Step 1: Domain Geometry.* (Single-peaked?)
  *   *Step 2: Information Asymmetry.* (Can they game it?)
  *   *Step 3: Rule Shortlist.* (Keep it simple).
  *   *Step 4: Stress Test.* (Spreadsheet scenarios).
  *   *Step 5: The Values Call.* (Choosing the trade-off).

  Okay, ready to write.
answer: |-
  This is a practical field protocol. It accepts the Gibbard–Satterthwaite theorem as a boundary condition (like the speed of light) and focuses on navigation within that limit. It is designed for a council of 40, using email ballots, with spreadsheet literacy but no coding.

  ### The Protocol: Voting Rule Selection & Stress-Test

  **Time required:** 3–4 hours.
  **Tools:** Spreadsheet, whiteboard.
  **Participants:** 3–5 council members (a "rules subcommittee").

  ---

  #### Step 1: Map the Preference Geometry
  **Question:** Can the options be ordered along a single dimension such that every voter has a "peak" and utility falls off as you move away from it in either direction?
  *   **Adequate Answer:** "Yes" (e.g., budget size, location on a map, temperature). "No" (e.g., unrelated project types, candidate personality traits).
  *   **Fail State (Stop):** If "No," you cannot use simple majority rule on ordered options without risking Condorcet cycles (A beats B, B beats C, C beats A). You must proceed to Step 4 knowing instability is possible.
  *   **Values Call:** If the answer is "Sort of," you must decide whether to force the options onto a dimension (e.g., ordering venues geographically) or admit they are distinct categories.
  *   **Assumption Relaxed:** If you force an order, you are assuming preferences are *single-peaked*. If you admit they are not, you are accepting that no rule will consistently reflect the "will of the council."

  #### Step 2: Assess the Information Environment
  **Question:** Do voters know enough about others' preferences to game the system effectively?
  *   **Adequate Answer:** "Low" (Secret ballots, one-off votes, diverse membership). "High" (Factions, published voting records, repeated games).
  *   **Your Context:** Email ballots are visible *afterwards*. This creates reputation costs. However, they are cast simultaneously.
  *   **Fail State (Stop):** If the council is highly factionalized (two blocks of 15+), strategic voting is inevitable regardless of the rule.
  *   **Distinction:** This step separates *theoretical manipulability* (Gibbard–Satterthwaite) from *practical manipulability*. A rule is only practically manipulable if a voter can construct a beneficial lie. If they don't know how others are voting, they can't calculate the lie.
  *   **Assumption Relaxed:** If you proceed assuming "Low" information, you are betting on *informational friction* to protect the rule.

  #### Step 3: Shortlist Candidate Rules
  **Question:** Which rules fit the spreadsheet constraint and the geometry from Step 1?
  *   **Adequate Answer:** Select maximum two from:
      1.  **Plurality (First-Past-The-Post):** Simple, but vulnerable to vote-splitting.
      2.  **Approval Voting:** Voters mark all acceptable options. Winner has most marks. Robust, simple.
      3.  **Borda Count:** Rank options, points assigned. Smooths extremes, vulnerable to "burying" candidates.
      4.  **Two-Round Runoff:** Plurality, then top two face off.
  *   **Fail State (Stop):** If no rule here satisfies the basic need (e.g., you need a proportional split, not a single winner), stop. You need a allocation formula, not a voting rule.
  *   **Assumption Relaxed:** You are giving up on finding a "true" Condorcet winner (who beats everyone head-to-head) in favor of stability and simplicity.

  #### Step 4: The Spreadsheet Stress Test
  **Question:** Does the rule produce an objectionable result in plausible "pathological" scenarios?
  *   **Procedure:** Create a spreadsheet with 40 rows (voters) and columns for the options.
      1.  **Scenario A (The Squeeze):** Simulate a tight race where 55% prefer A > B > C and 45% prefer B > C > A. Does B win?
      2.  **Scenario B (The Clone):** Split the most popular option into two similar options (A1, A2). Does the vote split allow a minority option (C) to win?
      3.  **Scenario C (The Burial):** Simulate a faction ranking a strong competitor last, despite actually liking them, to lower their score.
  *   **Adequate Answer:** "The result is counter-intuitive but acceptable" or "The result is catastrophic."
  *   **Fail State (Stop):** If Scenario B (The Clone) allows a minority to win consistently, discard Plurality. If Scenario C (The Burial) is too easy in Borda, discard Borda.
  *   **Values Call:** You must decide which failure mode is worse: electing a polarizing candidate (Plurality risk) or electing a bland compromise (Borda/Approval risk).

  #### Step 5: The Values Call (Final Selection)
  **Question:** Which trade-off aligns with our trust's culture?
  *   **Adequate Answer:** A written statement: "We accept Rule X because we prioritize [Stability / Representation / Simplicity] over [Theoretical Fairness / Strategic Proofing]."
  *   **Handback:** This step cannot be solved technically. It is a political decision about what kind of organization you want to be.
  *   **Assumption Relaxed:** You are explicitly acknowledging that you are choosing a rule based on *consequences*, not *axioms*.

  ---

  ### Application to Your Three Cases

  #### 1. The AGM Venue (Spatial / Single-Peaked)
  *   **Step 1 (Geometry):** **Yes.** Venues sit on a map. Members live in locations. Preferences are likely single-peaked (closest is best, further is worse).
  *   **Step 2 (Info):** **Low/Medium.** Members know roughly where others live, but not exact intensity.
  *   **Step 3 (Rules):** **Plurality** or **Median Voter**.
  *   **Step 4 (Stress Test):** If you order venues North-to-South, the Median Voter Theorem applies. The option closest to the median member's location beats all others in pairwise contests.
  *   **Verdict:** Use **Simple Majority on Ordered Options**. List venues geographically. Vote on the median option against neighbors.
  *   **Assumption Relaxed:** You are assuming "distance" is the only metric. If one venue is cheap but far, and another expensive but near, the dimension breaks.
  *   **Why it works:** In single-peaked domains, majority rule is *not* manipulable (Black's Theorem). You have escaped Gibbard–Satterthwaite for this specific vote.

  #### 2. The Grants Budget (Multi-Dimensional)
  *   **Step 1 (Geometry):** **No.** Three unrelated causes (e.g., Education, Habitat, Species). No single axis.
  *   **Step 2 (Info):** **High.** Members have strong, known affiliations with specific causes.
  *   **Step 3 (Rules):** **Approval Voting** or **Fixed Quotas**.
  *   **Step 4 (Stress Test):** Plurality will lead to vote-splitting and "all-or-nothing" outcomes. Borda invites tactical ranking (ranking a rival cause last).
  *   **Verdict:** **Approval Voting** (Select all causes you are willing to fund) OR **Fixed Quotas** (e.g., 1/3 each).
  *   **Assumption Relaxed:** If you use Approval, you relax the requirement for intensity (you can't say "I love Education twice as much as Habitat"). If you use Quotas, you relax the voting principle entirely in favor of a pre-commitment.
  *   **Why:** Approval voting minimizes the incentive to lie. If you like two causes, you mark both. You don't need to guess if your favorite will win. It stabilizes the outcome in multi-dimensional spaces better than ranking.

  #### 3. The Research Grant (Two-Round System)
  *   **Step 1 (Geometry):** **No.** Candidates are complex.
  *   **Step 2 (Info):** **High.** Small field, everyone knows the applicants.
  *   **Step 3 (Rules):** **Two-Round Runoff** (Your current system).
  *   **Step 4 (Stress Test):** Theory says Two-Round reduces to Plurality on the top two in the second round. It does *not* guarantee a Condorcet winner. It is manipulable in the first round (compromising to ensure your second choice makes the runoff).
  *   **Verdict:** **Keep it.**
  *   **Why:** You suspected I'd say it doesn't help mathematically. Correct. It does not solve the cycle. *However*, it solves a *psychological* problem. It creates a "focal point." It forces the council to coalesce around a binary choice in the final stage, which reduces the feeling of arbitrariness.
  *   **Assumption Relaxed:** You are prioritizing *legitimacy of the process* over *mathematical optimality*. The two rounds allow losers to feel they had a "second chance," which reduces post-vote acrimony.
  *   **Caveat:** Ensure the shortlist is >2 candidates (e.g., top 3 to shortlist 2) to prevent the first round from being a trivial filter.

  ---

  ### What This Procedure Cannot Tell You

  **1. The "Bad Faith" Problem**
  The protocol assumes voters want to reach a decision. It cannot stop a member who is determined to sabotage the outcome. If a member lies on their ballot not to get a better result, but to delegitimize the process, no rule fixes that. That is a governance issue, not a voting issue.

  **2. The Intensity Blindness**
  Standard voting rules (including Approval) count heads, not passion. If 21 members slightly prefer Option A, and 19 members desperately need Option A to survive, the rule treats them the same. The procedure forces you to admit this in Step 5. If intensity matters, you need deliberation, not voting.

  **3. The Post-Hoc Rationalization**
  You mentioned members claim rules are "gamed" after close results. This protocol does not stop that. It only gives you a pre-agreed script to say: *"We knew this rule could produce this result when we adopted it in January. The rule is working as designed."* It shifts the blame from the Chair to the Protocol.

  ### Where the Real Work Is

  You guessed correctly: **Step 1 (Map the Preference Geometry) and Step 2 (Assess Information).**

  The mathematics of social choice is settled. The variables that determine your success are sociological.
  *   If you misidentify a multi-dimensional problem as single-dimensional (e.g., treating "Grant Types" like "Venues"), the math will fail you.
  *   If you overestimate the secrecy of the ballot (email is public), you will underestimate the strategic gaming.

  The "Real Work" is the honest conversation in Step 1 where you admit: *"We are trying to vote on things that cannot be ordered."* Once you admit that, you stop looking for a perfect rule and start looking for a rule that minimizes damage.

  **Recommendation for your next meeting:**
  Print this protocol. Spend the first hour on Step 1 for the upcoming budget vote. If you agree it is multi-dimensional, skip straight to Approval Voting. Do not debate the theory; debate the geometry. That is where the truth lies.
