      *   *Concept 2: Middle Ages as Residual.*
          *   Historians: Defined by what it's not (not Classical, not Modern).
          *   Quant: A segment identified not by a distinct parameter vector $\theta_{mid}$, but by the failure of $\theta_{classical}$ and $\theta_{modern}$ to fit. A "null" regime. High variance, low signal.
      *   *Concept 3: Misaligned Breaks.*
          *   Historians: Art changed in 1400, Science in 1600.
          *   Quant: Multivariate time series $Y_t = \{y_{art}, y_{astro}, y_{legal}, ...\}$. Changepoint detection algorithm $\tau$ yields $\tau_{art} \neq \tau_{astro}$. Confidence intervals $CI(\tau_i)$ do not intersect. "Renaissance" is a hyper-parameter forcing synchronization on asynchronous signals.
      *   *Concept 4: Sampling Bias.*
          *   Historians: Survival bias, canon formation.
          *   Quant: Non-random missingness. $P(Observed|True)$ is a function of later selection mechanisms (canon-formation). The observed series $Y_{obs}$ is a biased subsample of $Y_{true}$. Measurement error is heteroskedastic across time.

      *   *Residue Report:*
