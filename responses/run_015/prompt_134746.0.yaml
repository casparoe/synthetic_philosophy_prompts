      *   **User Persona:** Quantitative social scientist.
      *   **User Vocabulary:** Latent-structure models, changepoint detection, penalized likelihood (BIC/MDL), confidence intervals, Age-Period-Cohort (APC) identification problems, sampling bias/survival bias.
      *   **Task:** Restate the historians' dispute over the reality of the Middle Ages, Renaissance, and Scientific Revolution using *only* (or as faithfully as possible) the user's vocabulary.
