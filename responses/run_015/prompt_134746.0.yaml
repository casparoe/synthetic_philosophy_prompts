          3.  Address the misalignment of changepoints across different feature series (multivariate segmentation).
          4.  Address sampling bias (survival, copying, canon-formation).
          5.  Provide a "Residue Report": What translates cleanly? What smuggles in extra concepts (teleology, etc.)? What is inexpressible?
          6.  Provide a Verdict: Is "real vs. invented" equivalent to "penalized fit vs. overfitting," or does it change the subject?

  2.  **Deconstruct the Historians' Dispute (Traditional View):**
      *   *Realists:* These periods reflect genuine shifts in human experience, thought, and social organization.
      *   *Skeptics/Nominalists:* These are heuristic constructs imposed by later historians (often with ideological agendas) onto a continuous flow of events. The "Middle Ages" is just the "middle" between Rome and Modernity.
      *   *Nuance:* Different domains change at different rates (asynchronicity). Evidence is patchy.

  3.  **Translate to Quantitative Vocabulary (Drafting Phase):**

      *   *Concept 1: What is a "real" period?*
