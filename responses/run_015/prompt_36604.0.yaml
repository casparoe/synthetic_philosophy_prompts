answer: |-
  ### The four moves, assessed in turn

  The metaphysician employs ontological reductionism, equating the item with server states. While technically accurate regarding substrate, this conflates constitution with identity. A painting is canvas and paint, yet its destruction is a loss of an aesthetic particular. The in-game death analogy fails because the grievance concerns the player's extrinsic investment (time, opportunity cost), not the avatar's intrinsic status. By dismissing the item as merely mutable data, the metaphysician ignores that digital objects can function as abstract particulars within a normative system. Furthermore, the persistence of data patterns over time grounds identity just as physical continuity does. The claim that "nothing was destroyed" holds only if one accepts a brute physicalist ontology that excludes institutional or abstract entities from the domain of valuable particulars.

  The ethicist correctly shifts focus to axiology, noting that harm tracks value, not merely physical substance. Reputation and effort are non-physical yet genuinely loss-sensitive goods. However, this move risks begging the question against the metaphysician's contingency objection. Asserting that scarcity and standing are "real" doesn't fully address the claim that virtual scarcity is ontologically fragile compared to social reputation. The ethicist needs to argue that the game's economy constitutes a genuine normative community, not just a simulation of one. Players recognize rules and sanctions, creating objective social facts. Nevertheless, the intuition that two years of labor constitutes a real cost regardless of the substrate's physicality is robust and aligns with Lockean labor-mixing accounts of property, suggesting ownership arises from effort itself.

  The metaphysician raises a potent point about constitutive rules: virtual existence depends on corporate fiat. If the company can duplicate the item, its uniqueness was merely contingent, not essential. The "actor grieving a character" analogy is weak. Players participate in a shared social reality, not solitary pretense. The loss of status within a community is real even if the status markers are digitally constituted. The metaphysician conflates the *possibility* of revision with the *actuality* of the rules at the time of labor. There is a moral difference between something being contingent and something being retroactively altered. The harm lies in the retroactive violation of the rules under which the effort was expended, not merely the reward's ontology. This distinction protects the player's investment from arbitrary revisionism.

  The ethicist's bank analogy is the strongest move, leveraging institutional realism. Money is indeed ledger entries backed by trust and systems; its value is no less real for being non-physical. If deleting bank records constitutes theft, deleting unique virtual property parallels this. This undermines the metaphysician's "pretense" claim. The analogy isn't perfect: banks are regulated, MMOs private. However, both rely on centralized databases maintaining status functions. Still, the core insight holds: institutional facts are real facts. The ethicist successfully demonstrates that the metaphysician's criterion for "real loss" is too narrow, excluding most modern economic value. If database deletion counts as harm in finance, consistency demands it counts here too, unless one argues games lack normative weight entirely.

  ### What both are missing

  Both overlook promissory obligation and institutional facts. The dispute isn't merely about what the item *is*, but what the company *owed*. By establishing rules of scarcity and persistence, the company created legitimate expectations. The harm is a breach of contract and trust, regardless of the item's ontology. They also ignore digital labor phenomenology. The item is an artifact of human agency, not just a server state. A Searlean analysis of status functions would bridge their gap: the item is a physical database entry carrying a status function recognized by the community. This status function assigns deontic powers to the player. Both treat ontology and value as separate, when institutional reality fuses them through collective intentionality. Consequently, the moral weight derives from the social agreement, not the physical substrate.

  ### Overall verdict

  The ethicist prevails on harm, though the metaphysician correctly identifies ontological fragility. I endorse the ethicist's bank analogy and the claim that effort generates real value. I reject the metaphysician's "nothing was destroyed" claim and the actor analogy. However, the metaphysician's point about corporate fiat highlights a crucial unarticulated distinction: *ontological independence* versus *institutional stability*. Virtual property lacks the former but relies on the latter. Accepting institutional facts as real grounds for moral claims validates the ethicist's conclusion while incorporating the metaphysician's caution. This resolves the dispute by shifting focus from substrate to normative expectation. The loss is real, yet institutionally vulnerable.
