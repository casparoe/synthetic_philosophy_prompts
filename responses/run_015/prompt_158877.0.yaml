answer: |-
  The deadlock is a clash of explanatory frameworks masquerading as a definitional dispute, where internalists prioritize mechanistic implementation and externalists prioritize functional role, rendering the calibration ledger insufficient to settle the issue without a prior agreement on what constitutes a cognitive mechanism. Defenders of the extended mind will argue the ledger performs the functional role of metacognitive regulation by calculating and supplying confidence discounts, satisfying the parity principle because the process of belief adjustment is partially realized outside the skull. Critics will counter that the executive functions of initiating the query and accepting the discount remain intracranial, meaning the ledger is merely a causal input to a wholly internal cognitive loop where the actual inference occurs. Progress requires abandoning the search for a binary "is/is not" boundary in favor of a gradient measure of integration, such as causal density or information flow metrics, or shifting the question to whether including the tool improves predictive power in specific cognitive models rather than asking if it is literally part of the mind. I would change my diagnosis from a framework clash to a substantive empirical dispute if evidence showed that the brain processes external feedback from the ledger via subpersonal neural pathways indistinguishable from proprioception, bypassing conscious decision-making entirely, as this would undermine the critic's reliance on the "decision to defer" as a boundary marker. My reasoning is most likely to fail if the concept of "cognition" is inherently normative rather than descriptive, meaning the debate is actually about assigning responsibility rather than mapping mechanisms, in which case neither functional nor mechanistic criteria will resolve the tension because the parties are not trying to describe the same phenomenon.
