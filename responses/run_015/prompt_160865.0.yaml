  **The Math:**
  Let $n$ be the number of flips until Heads.
  Probability of game ending at flip $n$ is $P(n) = \frac{1}{2^n}$.
  Payout $X(n) = \min(2^n, 30000)$.

  We need to find where the cap hits.
  $2^{14} = 16,384$
  $2^{15} = 32,768$ (Capped at £30,000)

  The Expected Value $E[X]$ is the sum of (Probability $\times$ Payout):
  $$E[X] = \sum_{n=1}^{14} \left( \frac{1}{2^n} \times 2^n \right) + \sum_{n=15}^{\infty} \left( \frac{1}{2^n} \times 30,000 \right)$$

  **Part 1 (Uncapped range):**
  For $n=1$ to $14$, the term $\frac{1}{2^n} \times 2^n$ simplifies to $1$.
  Sum = $14 \times 1 = 14$.

  **Part 2 (Capped range):**
  The probability of reaching flip 15 or higher is the probability of getting 14 Tails in a row: $\frac{1}{2^{14}} = \frac{1}{16,384}$.
  Once you reach this point, the payout is fixed at £30,000 regardless of how much longer it goes.
  Contribution = $\frac{1}{16,384} \times 30,000 \approx 1.831$.

  **Total Expected Value:**
  $$E[X] = 14 + 1.831 = \mathbf{£15.83}$$

  ### 2. The Single Ticket Decision

  *   **Cost:** £50.00
  *   **Expected Return:** £15.83
  *   **Net Expected Value:** **-£34.17**

  **Verdict:** **Do not buy the single ticket.**
  This is a mathematically negative bet. For every £50 you hand over, you are statistically burning £34.17. The crypto guy is relying on the "infinite EV" myth to sell you a ticket worth £16 for £50. This is a 68% markup on a depreciating asset.

  **Max Willingness to Pay:** **£15.00**
  (Rounded down from £15.83 to account for the time value of money and minor counterparty risk on small payouts).

  ### 3. The Bundle Decision

  *   **Structure:** 1/10th share of 10 separate games.
  *   **Total Exposure:** Equivalent to 1 full ticket (Linearity of Expectation: $10 \times \frac{1}{10} E[X] = E[X]$).
  *   **Total Expected Return:** £15.83.
  *   **Cost:** £5.00 ("a fiver").
  *   **Net Expected Value:** **+£10.83**

  **Verdict:** **Buy the bundle, but limit exposure.**
  This is an arbitrage opportunity caused by the seller's mathematical error. He is pricing the bundle as "1/10th of the ticket price" (£50/10 = £5) rather than "1/10th of the EV". He thinks he's giving you a discount on the £50 price; in reality, he's selling you a £15.83 asset for £5.

  **However,** the variance is still high.
  *   **Probability of Profit on Bundle:** To get your £5 back, the 10 games need to generate £50 total. The average game needs to payout £5. This requires an average flip count of $\approx 2.3$. Since the median flip count is 1 (50% chance of Heads immediately), **you will lose money on this bet more than 50% of the time.**
  *   **Why take it?** Because when you win, you win enough to cover the losses and profit, *provided you can play repeatedly* (Law of Large Numbers).

  ### 4. Repeated Play & Your Financial Goal

  You need £6,000 more for your deposit (£18k goal - £12k savings). You have £3,000 risk capital.

  **Scenario A: Single Tickets (£50 each)**
  *   You can play 60 times (£3,000 / £50).
  *   Expected Loss: $60 \times £34.17 = \mathbf{-£2,050}$.
  *   **Outcome:** You wipe out 68% of your risk capital. You miss your deposit goal. **Do not do this.**

  **Scenario B: Bundles (£5 each)**
  *   You can play 600 times (£3,000 / £5).
  *   Expected Profit: $600 \times £10.83 = \mathbf{+£6,498}$.
  *   **Outcome:** Statistically, this hits your deposit goal.
  *   **The Catch (Counterparty Risk):** To realize this profit, the crypto guy must honor ~600 payouts.
      *   Small payouts (£2-£10): He will likely pay these to maintain credibility.
      *   Large payouts: If your bundle hits a "long tail" event (e.g., one game hits the £30k cap), your share is £3,000. Will he pay a £3,000 claim on a £5 ticket?
      *   **Screenshot Risk:** A wallet screenshot is not proof of solvency. Funds can be moved instantly.

  ### 5. Final Numbers & Recommendation

  **1. Max price for one ticket:** **£15.** (Offer is £50 → **Reject**)
  **2. Max price for the bundle:** **£15.** (Offer is £5 → **Accept**)
  **3. Total Exposure Limit:** **£250 (50 Bundles).**

  **Why £250?**
  *   **Math:** 50 bundles cost £250. Expected Return = $50 \times 15.83 = £791.50$. Expected Profit = £541.50.
  *   **Risk:** If he rugs (runs away) after you've built up winnings, you lose £250. This is 8% of your risk capital and does not threaten your £12k deposit savings.
  *   **Goal:** It won't get you the full £6k you need, but it generates "beer money" without endangering the "house money".
  *   **Strategy:** Play 5 bundles a week for 10 weeks. Withdraw winnings immediately to your bank. Do not roll over winnings.

  **4. Should you play repeatedly?**
  *   **Single Ticket:** **No.** Negative EV guarantees loss.
  *   **Bundle:** **Yes, but withdraw profits.** The +EV only realizes over volume, but volume increases the probability he defaults on a large payout.

  ### 6. Confidence & Failure Points

  **Confidence Level:** **95% on the Math, 40% on the Payout.**

  **Where this reasoning could be wrong (The "Flip" Factors):**

  1.  **Counterparty Default (High Impact):** If the guy is a scammer, the EV is £0, not £15.83. If he pays small amounts but refuses to pay any single claim over £500, the EV of the bundle drops significantly (the tail risk is where the profit lives).
      *   *Mitigation:* Test with one £5 bundle. Wait for payout. Verify it hits your wallet.
  2.  **Bundle Cap Definition (Medium Impact):** If the "£30k cap" applies to the *bundle* as a single product rather than per game, the EV drops.
      *   *Check:* Ask him: "If Game 1 hits £30k and Game 2 hits £30k, do I get 1/10th of £60k?" If no, the EV is lower, but likely still above £5.
  3.  **Utility of Capital (High Impact):** You said money below £18k is critical. Even a +EV bet is irrational if the variance risks your ability to buy the flat.
      *   *Correction:* This is why I capped exposure at £250. Losing £250 hurts; losing £3,000 endangers the flat. Do not gamble the full £3k.

  **Summary:** The single ticket is a tax on people who don't understand logarithms. The bundle is a pricing error in your favor. Exploit the bundle error slightly (£250 max), ignore the ticket, and keep your £12k deposit savings in a high-interest account, not a crypto wallet.
