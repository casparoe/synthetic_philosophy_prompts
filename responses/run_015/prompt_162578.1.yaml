  - Realistic, one paragraph, three options. A workplace, a family, a clinic — no trolleys, no demons, no mixed acts or lotteries over the options.
  - You're between exactly two moral theories, with credences something like 55/45, so that "my favourite theory" (the one you're more confident in) is well defined and can be reported alongside MEC.
  - The two theories have to be structurally different, not tweaked variants: one agent-neutral maximizing theory, one that has an agent-relative constraint or agent-relative option in it. And here's the bit I care most about: they should individuate the options differently. One of them recognizes a doing/allowing or intending/foreseeing distinction that the other one thinks is morally irrelevant, so its not even clear they're ranking the same three acts.
  - The verdicts have to be generated, not stipulated. Say what each theory takes to matter in the case and why, then read the rankings off that — don't just announce "theory one assigns A 10 points."
  - The payoff: under one normalization a reasonable person might reach for (fix each theory's scale by the spread of value in this decision problem, say) MEC says A; under another equally reasonable one (fix it by some wider benchmark the theory cares about — the gap between a decent and a wretched life, or whatever) MEC says B, and B is the option the theory you're *less* confident in prefers. Same credences, same case, both times.

  Then walk through what MEC, my-favourite-theory, and any moral-hedging / probability-matching style rule each say about it; tell me which single feature of the case is doing the work; tell me whether the flip survives if you force both theories onto one shared partition of options; and give me the best pushback from someone who thinks MEC is perfectly well defined here. Last thing: if there's a structural condition on a case that makes every normalization agree, name it — that's what I want to end the session on.
