  ### The Case: The Hospice Budget

  You are the director of a underfunded urban clinic. A sudden budget freeze leaves you short of the funds needed to sustain current operations for the month. You have three concrete options: **(A) Reallocate**, actively terminating the care contract of one stable hospice patient to free up resources that will save five acute trauma patients; **(B) Status Quo**, maintaining all existing contracts, which means the five acute patients cannot be treated and will die while the hospice patient lives out their natural term; or **(C) Audit**, delaying the decision for a compliance review, which results in administrative paralysis where the five acute patients die and the hospice patient also succumbs due to delayed medication.

  **The Theories & Credences**
  You are torn between **Act Utilitarianism (T1, 55%)** and **Commonsense Deontology (T2, 45%)**.
  *   **T1 (Agent-Neutral Maximizing):** Morally individuates acts by their outcomes. It sees no moral difference between killing and letting die; only net wellbeing matters.
      *   *Verdict Generation:* T1 values each life at +10 units. Option A yields +50 (saved) - 10 (lost) = +40. Option B yields -50. Option C yields -60.
      *   *Ranking:* A > B > C.
  *   **T2 (Agent-Relative Constraint):** Morally individuates acts by their type. It recognizes a strict doing/allowing distinction; actively causing death violates a constraint, while allowing death through omission is merely regrettable.
      *   *Verdict Generation:* T2 assigns 0 to permissible acts and -1,000 to forbidden violations (lexical priority). Option A is "Killing" (-1,000). Option B is "Allowing" (0). Option C is "Negligence" (-100).
      *   *Ranking:* B > C >> A.

  **The Normalization Flip**
  *   **Normalization 1: Decision-Relative Range.** We scale each theory by the difference between its best and worst option *in this specific menu*.
      *   T1 Range: 40 (A) to -60 (C) = 100 points. Normalized Scores: A=1.0, B=0.1, C=0.
      *   T2 Range: 0 (B) to -1,000 (A) = 1,000 points. Normalized Scores: B=1.0, C=0.9, A=0.
      *   *MEC Calculation:*
          *   A: (0.55 × 1.0) + (0.45 × 0) = **0.55**
          *   B: (0.55 × 0.1) + (0.45 × 1.0) = **0.505**
      *   *Result:* MEC selects **A** (aligns with your 55% favorite, T1).
  *   **Normalization 2: Theoretical Scope.** We scale each theory by the difference between a "Morally Perfect World" and a "Morally Catastrophic World" as defined by the theory's global standards.
      *   T1 Scope: Preventing a Genocide (+1,000,000) vs. Causing one (-1,000,000). Range = 2,000,000.
          *   In this case, A (+40) is negligible. Normalized A ≈ 0.50002. B (-50) ≈ 0.49997.
      *   T2 Scope: Perfect Duty (+100) vs. Murder (-1,000,000). Range = 1,000,100.
          *   In this case, A is Murder. Normalized A ≈ 0. B is Permissible. Normalized B ≈ 0.0001.
      *   *MEC Calculation:*
          *   A: (0.55 × 0.50002) + (0.45 × 0) ≈ **0.275**
          *   B: (0.55 × 0.49997) + (0.45 × 0.0001) ≈ **0.275 + 0.00004**
      *   *Result:* Because T2 registers A as hitting its global "floor" while T1 registers A as a trivial blip on its global scale, T2's objection carries more absolute weight. MEC selects **B** (aligns with your 45% minority, T2).

  **Analysis of Rules**
  *   **MEC:** Unstable. Depending on whether you normalize by the *local decision spread* (Variance/Range) or the *theoretical capacity* (Absolute Scale), you get opposite verdicts.
  *   **My Favourite Theory (MFT):** Selects **A**. Since T1 is 55%, you simply follow the Utilitarian calculus. This ignores the risk of committing a catastrophic rights violation.
  *   **Moral Hedging:** A probability-matching rule might suggest avoiding A because the "downside risk" (committing murder) is asymmetrical. Even at 45% credence, the disvalue of Murder in T2 is so disproportionate that a risk-averse hedging rule would veto A regardless of MEC.

  **The Driving Feature**
  The flip is driven by **Disproportionate Value Structures**. T2 treats the doing/allowing distinction as *lexical* or near-lexical (a constraint violation dwarfs outcome differences), whereas T1 treats all value as *marginal* and additive. Normalization 1 hides this by forcing both theories into a 0–1 local box, effectively silencing T2's intensity. Normalization 2 respects the intensity, allowing T2's "catastrophe" to outweigh T1's "moderate gain."

  **Shared Partition Robustness**
  Does the flip survive if we force a shared partition? **Yes.** Even if both theories agree to describe the options physically as "Move Resource X," they assign value differently based on the *description under which the act is evaluated*. T1 evaluates "Move Resource X" as "Save 5 Net." T2 evaluates "Move Resource X" as "Kill 1." The normalization problem persists because the *value functions* differ, not just the labels. Forcing a shared physical description does not solve intertheoretic comparison when theories disagree on what makes an act good.

  **The Pushback**
  A defender of MEC would argue: **"Variance Normalization is the only coherent method."** They would claim that 'Theoretical Scope' is metaphysically suspect (how do you measure the value of a 'Perfect World' across theories?) and that decision-relative normalization is the only way to make theories 'vote' equally. They would argue that if T2 wants to influence the decision more, it should assign higher credence, not larger numbers. The flip, they say, is an artifact of using a faulty normalization metric, not a flaw in MEC itself.

  **The Structural Condition for Agreement**
  The session should end on this: Normalization methods agree only when theories satisfy **Cardinal Unit Comparability**. This condition holds when two theories not only agree on the ranking of options but also agree on the *ratio of value differences* between them (e.g., both agree that the gap between A and B is exactly twice the gap between B and C). In moral uncertainty, this is virtually never met when theories differ structurally (e.g., maximizing vs. constraint-based), which is why MEC remains fragile in precisely the cases where we need it most.
