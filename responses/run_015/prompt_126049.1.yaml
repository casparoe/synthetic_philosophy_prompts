answer: |-
  Distinguished guests, colleagues, practitioners, and survivors:

  We gather today to dedicate a Center for Capital Justice Studies. In naming this institution, we have made a choice of words that carries weight. We did not name it a Center for Capital Punishment, nor a Center for Abolition. We chose "Justice." That implies a pursuit, an orientation, rather than a possession. It suggests that justice is something we move toward, often in the shadow of what we cannot undo.

  I stand before you to propose a framework for that pursuit. It is a concept I call the "irreversibility gap."

  We are all familiar with the standard vocabulary of this debate. We know the arguments regarding retribution and deterrence. We are fluent in the statistics of exoneration. We know that time lost can be compensated, and we know that life taken cannot be returned. But to stop there is to treat the death penalty as a logistical problem rather than a moral one. To speak only of physical irreversibility is to miss the deeper structural fracture.

  The irreversibility gap is not merely about the biological fact of death. It is about the moral accounting of the state.

  In any other exercise of state power, there exists a mechanism for discharge. If the state wrongly imprisons a citizen for ten years, a moral debt is incurred. It is a crushing debt, to be sure. But it is a debt that can be acknowledged, quantified, and partially discharged. We offer restitution. We offer apologies. We offer the restoration of rights. The ledger is stained, but it is not destroyed. The relationship between the citizen and the state, however damaged, remains intelligible. The state admits fault, and in doing so, reaffirms the rule of law it violated.

  But when the state executes an innocent person, the ledger does not just stain; it burns.

  There is no currency with which to compensate the dead. There is no apology that can be heard. There is no restoration of rights for a subject who no longer exists. When a wrongful execution occurs, the state incurs a moral debt that it is structurally incapable of paying. This is the irreversibility gap. It is the distance between a mistake that can be corrected and a mistake that ends the possibility of correction.

  For the scholars in this room, this framework demands a re-evaluation of our theoretical foundations. We often treat the risk of executing the innocent as an external contingency—a variable to be managed through better procedure, clearer jury instructions, or more robust appellate review. We act as if the risk is a bug in the software, rather than a feature of the hardware.

  But consider the demands of retributive justice. Retribution requires epistemic finality. To deserve death, a defendant must be guilty not just probably, but certainly. The severity of the punishment demands a certainty of knowledge that human evidentiary practices simply cannot guarantee. Our trials are not machines for producing absolute truth; they are adversarial processes for managing uncertainty. They produce verdicts, not revelations.

  When we sentence a human being to death, we pretend to an epistemic finality that we do not possess. We claim to know, with the requisite moral certainty, that this person deserves to cease existing. But if the irreversibility gap is real, then that claim is a fiction. We are acting with the authority of gods while possessing only the vision of humans.

  Similarly, consider the logic of deterrence. This theory relies on calculation. It treats human life as a fungible unit in a cost-benefit analysis. It assumes that errors can be weighed against outcomes. But the execution of an innocent person is not a miscalculation to be adjusted for in the next fiscal quarter. It is an unrepairable rupture in the social contract. You cannot calculate the cost of the unrepairable. Once the state kills the innocent, it ceases to function as a protector of rights and becomes, in that specific instance, a predator. No amount of future deterrence can balance that equation. The gap swallows the math.

  This brings me to the practitioners and, most importantly, to the family members and survivors seated here.

  To you, the irreversibility gap is not a theory. It is the air you breathe. It is the silence at the dinner table where a brother should be sitting. It is the years stolen that no check can restore.

  I want to be careful with my words here. It is a temptation, in a speech like this, to offer comfort. To suggest that if we simply refine the process, if we simply fund this Center well enough, we can close the gap. We can ensure it never happens again.

  I will not offer you that false comfort. Because on this view, the gap is structural, not contingent.

  Procedural reform is vital. It saves lives. It is the work of this Center. But we must be honest: better procedure narrows the risk; it does not eliminate the gap. The gap exists because human judgment is fallible, and death is absolute. As long as the death penalty exists, the possibility of the unrepairable error exists.

  To acknowledge this is not to diminish your survival. To the contrary. Your presence here is a testament to the fact that the system can fail and yet, sometimes, the truth can survive. But for those who were not exonerated in time, for those who lie in unmarked graves paid for by the state, there is no repair.

  I know that for many of you, the legal system speaks in abstractions. It speaks of "harmless error" or "procedural default." It reduces your trauma to data points in a brief. The framework of the irreversibility gap refuses that reduction. It insists that the wrongful execution of an innocent person is a unique moral category. It is not just a "worse" version of wrongful imprisonment. It is a different kind of wrong entirely.

  By naming this gap, we validate the particular horror you have endured. We acknowledge that there are wounds the law cannot heal, because the law inflicted them. We acknowledge that there are debts the state cannot pay, because the creditor is gone.

  This is a heavy realization. It might feel paralyzing. If the gap is structural, and the debt is unpayable, what is the work of this Center?

  The work is not to pretend the gap does not exist. The work is to study it, to measure it, and to force the legal system to stare into it without blinking.

  For too long, the law has treated the finality of death as a virtue. We speak of "finality" in litigation as a goal, a way to bring closure. But in the context of capital punishment, finality is the enemy of justice. Justice requires the possibility of revision. It requires the humility to say, "We might be wrong." Death silences that humility.

  The mission of this Center must be to institutionalize that humility.

  For the scholars, this means producing work that does not just analyze the death penalty, but analyzes the limits of legal knowledge itself. It means challenging the presumption that a verdict is a truth.

  For the practitioners, this means arguing not just for your client's innocence, but for the system's fallibility. It means forcing the courts to acknowledge that when they sign a death warrant, they are not closing a case; they are closing the possibility of justice.

  And for the public, it means telling the truth about what we ask the state to do. We ask it to wield a power it cannot undo. We ask it to assume a certainty it cannot have. We ask it to incur debts it cannot pay.

  We are gathered to dedicate a building. But bricks and mortar do not make a center for justice. Intellectual honesty does. Moral courage does.

  The irreversibility gap will not close because we name it. The moral debt of a wrongful execution will remain outstanding. But we can choose how we live with that reality. We can choose to ignore it, to bury it under layers of procedure and legal fiction. Or we can choose to build an institution that keeps the ledger open.

  To the families here: We cannot bring back the lost. We cannot give you the years you spent in the shadow of the executioner. We cannot discharge the debt the state owes you. But we can promise you this: We will not look away. We will not let the gap be forgotten. We will not let the dead become statistics.

  We will study the machinery of death not to make it more efficient, but to reveal its friction, its flaws, and its fatal limits. We will honor the irreversibility of the punishment by demanding the highest possible standard of reversibility in our process. And we will acknowledge that until the gap is closed by the abolition of the penalty itself, the moral solvency of the state remains in question.

  Let this Center be a place where that question is never silenced. Let it be a place where we admit what we do not know, and where we honor what we cannot restore.

  Thank you.
