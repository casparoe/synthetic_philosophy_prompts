      *   Set 2 (The Anomalies): Things that happened that shouldn't have (e.g., "Door opened but no one entered"). ($P=1$, but low prior expectation).
      *   Set 3 (The Fog): Rumors. ($P<1$).
  *   **Hypothesis:** Explains Set 1 & 2 perfectly.
