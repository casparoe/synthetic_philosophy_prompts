  *   **The Debrief:** Why did you update?

  Okay, ready to write. I will ensure the "Honesty Check" is prominent. I will tell them this activity produces the *psychological intuition* that conflicts with the *formal rule*, which is exactly what the reading is about. I won't lie and say it proves rational updating is possible; I'll say it proves the *urge* is undeniable.

