      *   **Topic:** The Old Evidence Problem (OEP).
      *   **Previous Issue:** Half the room thought OEP was just a formal glitch with no intuitive bite.
      *   **Goal:** An activity where participants *experience* the problem intuitively before seeing the formalism.
      *   **User's Idea:** A "cold-case board" with facts (some known, some uncertain, some counter-expectational). Reveal a hypothesis that explains some facts. Measure credence shift.
      *   **Specific Requirements:**
          1.  Seed facts with varying levels of prior certainty (known, half-recall, bet-against).
          2.  Debrief must separate the "Aha!" feeling (psychological fit) from rational credence change (Bayesian update).
          3.  Distinguish between confirmation of $H$ vs. $H$ looking simpler/more unified.
          4.  Include timeline, debrief mapping, predicted failures, and limitations.
          5.  No "likelihood ratio" talk until *after* the activity. No upfront lecture.
          6.  Scoring rule to incentivize honest reporting (no money).
      *   **Honesty Check:** The user wants me to tell them honestly which effect the game produces (Aha vs. Rational Update).

  2.  **Deconstruct the Old Evidence Problem (OEP):**
      *   *The Problem:* In Bayesianism, $P(E|H) = 1$ if $E$ is already known (old evidence). Therefore, $P(H|E) = P(H)$. Learning that $H$ explains $E$ shouldn't increase credence in $H$, but intuitively it does (e.g., Mercury's perihelion confirming GR).
      *   *The Intuition:* We feel confirmed when a new theory explains old facts.
      *   *The Formal Glitch:* Standard conditionalization doesn't allow $P(E)$ to be anything other than 1 for old evidence.
      *   *The User's Insight:* The "Aha!" moment feels like confirmation, but is it? Or is it just logical implication realization? Or is it $H$ becoming simpler?

  3.  **Evaluate the User's "Cold Case" Idea:**
      *   *Strengths:* Engaging, simulates discovery, allows for varying priors on evidence.
      *   *Weaknesses:* If participants *already know* the facts ($P(E)=1$), standard Bayes says no update. If they *uncertain* about facts ($P(E)<1$), it's not "Old Evidence" in the strict sense, it's just standard confirmation.
      *   *Crucial Tension:* To simulate OEP, $P(E)$ must be 1 (or effectively 1) *before* $H$ is introduced. But if $P(E)=1$, rational Bayesians shouldn't update. If they *do* update, is it irrational? Or does it reveal a flaw in the formalism?
