answer: |-
  This is a strong pedagogical instinct. The Old Evidence Problem (OEP) often feels like a technicality until you feel the tug of the intuition yourself. Your "cold case" idea is the right vehicle, but it needs tight constraints to ensure the evidence is actually *old* (i.e., credence 1) for the participants before the hypothesis arrives. If they treat the facts as uncertain, you've just built a standard Bayesian update, not an OEP simulation.

  Here is a designed activity, **"The Anomaly Board,"** tailored to your constraints, followed by the honest assessment you requested.

  ### Activity: The Anomaly Board

  **Goal:** Induce a credence shift in a hypothesis $H$ based entirely on evidence $E$ that participants already hold with credence 1, forcing a conflict between their intuitive update and the formal rule $P(E)=1 \implies P(H|E) = P(H)$.

  **Materials:**
  1.  **The Evidence Board:** 15 cards on a whiteboard/magnet board.
  2.  **Credence Sheets:** Pre-printed slips for recording probabilities.
  3.  **The Envelope:** Contains the "True Explanation" (for scoring).
  4.  **Scoring Calculator:** A simple spreadsheet or handout for Brier Scores.

  **The Scenario:** "The Midnight Server Crash." A lab server wiped a specific dataset at 3:00 AM. No external hack. Internal access only.

  #### Phase 1: Seeding the Evidence (0:00–0:30)
  Hand out the 15 Evidence Cards. Do not give a hypothesis yet. Ask them to categorize the cards into three piles on the board.

  *   **Pile A (The Bedrock):** 6 Facts that are digitally verified. (e.g., "Log ID 404 shows delete command at 3:00 AM," "User X was logged in.")
      *   *Constraint:* Participants must assign $P(E) = 1.0$. No uncertainty allowed. These are "Old Evidence."
  *   **Pile B (The Anomalies):** 6 Facts that are verified ($P(E)=1.0$) but *surprising* given the background context. (e.g., "The backup system was active but didn't trigger," "User X never accesses this folder.")
      *   *Constraint:* These are the "Mercury Perihelion" facts. Known to be true, but low probability under the "Status Quo" background knowledge.
  *   **Pile C (The Fog):** 3 Facts that are hearsay. (e.g., "User X was seen looking stressed.")
      *   *Constraint:* Participants assign $P(E) < 1.0$.

  **Task:** Before seeing any hypothesis, have them write down their credence in three competing hypotheses on their **Credence Sheet (Round 1)**:
  1.  $H_{acc}$: Accidental Glitch.
  2.  $H_{mal}$: Malicious Insider.
  3.  $H_{ext}$: External Exploit (despite logs).

  *Incentive:* Tell them there is a **True Solution** in the envelope. At the end, you will calculate their **Brier Score**. The person with the best score gets **Veto Power** over one reading assignment for next semester. (This creates high stakes without money).

  #### Phase 2: The Hypothesis Reveal (0:30–0:45)
  Hand out a single slip of paper: **Hypothesis $H_{new}$: "The Automated Script."**
  *   *Detail:* A forgotten maintenance script was running under User X's credentials, designed to clear cache but misconfigured to wipe data. It runs only at 3:00 AM. It bypasses backups by design.

  **Task:**
  1.  Ask them to map $H_{new}$ to the Evidence Board. (It explains all of Pile A and all of Pile B. It ignores Pile C).
  2.  **The "Aha" Moment:** Give them 2 minutes of silence to let the fit sink in.
  3.  **Credence Sheet (Round 2):** Have them re-rate their credence in $H_{new}$ (add it to the list) and adjust the others.
      *   *Crucial Instruction:* "Update based *only* on how well this hypothesis explains the facts you already verified in Phase 1."

  #### Phase 3: Scoring & Debrief Prep (0:45–0:60)
  1.  Open the Envelope. (The True Solution is $H_{new}$).
  2.  Calculate Brier Scores: $Score = (Truth - Credence)^2$. Lower is better.
  3.  **Private Reflection:** On the back of their sheet, ask them to write one sentence: *Did your credence change because the facts became more probable, or because the hypothesis became simpler?*

  ---

  ### The Debrief Map (0:60–0:90)

  Do not lecture. Draw three columns on the board: **Feeling**, **Formalism**, **Confounds**.

  #### 1. Mapping the "Aha" (The Feeling)
  *   **Ask:** "Who raised their credence in $H_{new}$ significantly?" (Most will).
  *   **Ask:** "Look at Pile B (The Anomalies). Did the probability of those facts change?"
      *   *Target Answer:* No. They were verified logs ($P=1$) in Round 1. They are still verified logs.
  *   **The Conflict:** If $P(E)$ didn't change, and you updated $P(H)$, you violated $P(H|E) = P(H) \times \frac{P(E|H)}{P(E)}$. Since $P(E)=1$, the ratio is 1. You shouldn't have moved.
  *   **Point:** This *is* the Old Evidence Problem. You just felt the intuition that the formalism forbids.

  #### 2. Separating Rational Update from Unification (The Confounds)
  *   **Ask:** "Look at your Private Reflection. Did $H_{new}$ win because it made the world *more likely*, or because it made the world *make sense*?"
  *   **Discussion:**
      *   *Confirmation:* $H$ is more probable.
      *   *Unification:* The *system* ($H + E$) is simpler/more coherent.
      *   *The Trap:* Often the "Aha" is a reduction in cognitive dissonance (the anomalies are no longer anomalous), not a Bayesian likelihood update.
      *   *Formal Term:* Introduce **Likelihood Ratio** here. Show that for Pile B, $P(E|H_{new}) \approx 1$ while $P(E|Background) \ll 1$. The update comes from realizing the *likelihood*, not the evidence probability.

  #### 3. Addressing the "New Learning" Objection (Predicted Failure #1)
  *   **Prediction:** A student will say: "I didn't learn $E$. I learned *that H explains E*. That's new evidence $E'$." (The Garber Solution).
  *   **Counter-Move:** Ask: "If you learned 'H explains E', does that change the probability of H if E was already certain?"
  *   **Goal:** Show that shifting the "new evidence" to the logical relation ($H \vdash E$) saves the formalism but changes the subject from *empirical* confirmation to *logical* omniscience.

  #### 4. Social Herding (Predicted Failure #2)
  *   **Prediction:** Some will shift odds because the room nodded, not because of the math.
  *   **Fix:** Compare the "Fog" (Pile C) updates vs. "Bedrock" (Pile A) updates. If they updated heavily on Fog based on room talk, flag that as non-Bayesian social updating.

  ---

  ### Honest Assessment: What This Game Actually Produces

  You asked me to tell you honestly which effect this produces.

  **1. It produces the Psychological Urge, not the Rational Justification.**
  This activity successfully simulates the *phenomenology* of the Old Evidence Problem. Participants *will* feel confirmed. They *will* update their credences. However, strictly speaking, **this activity demonstrates a violation of Bayesian Conditionalization, not a vindication of it.**
  *   **Why:** In the game, $P(E)$ is fixed at 1.0 for Pile A & B. A perfect Bayesian agent cannot update $P(H)$ based on $E$.
  *   **The Lesson:** The game proves that human intuition treats "realizing $H$ explains $E$" as informative, even when $E$ is old. It does *not* prove that this intuition is formally correct under standard Bayes. It forces the room to ask: "Is our intuition wrong, or is the formalism incomplete?" (That is the exact debate of the reading).

  **2. It conflates Logical Learning with Empirical Confirmation.**
  The "Aha" moment is largely the realization of a logical entailment ($H \vdash E$) that they hadn't computed before.
  *   **The Confound:** In the debrief, you must press this. Did they update because they got new data? No. They updated because they performed a calculation they were too slow to do earlier.
  *   **The OEP Angle:** This highlights the **Logical Omniscience** assumption. Standard Bayes assumes you already know all logical consequences of your hypotheses. The game shows why that assumption is unrealistic for finite minds.

  **3. It cannot fully separate Unification from Probability.**
  While the reflection question helps, participants will naturally conflate "This theory is beautiful/unified" with "This theory is probable."
  *   **Your Job:** In the debrief, you must explicitly state: "A theory can be unified and false. A theory can be disunified and true. The 'Aha' feeling tracks *coherence*, not necessarily *truth*."

  ### Predicted Failures & Mitigation

  | Failure Mode | What happens | How to handle in Debrief |
  | :--- | :--- | :--- |
  | **The "New Fact" Move** | "I learned that the script exists! That's new." | Point out the Envelope was sealed. The script was the *hypothesis*, not a new log entry. The logs (Evidence) were already on the board. |
  | **The "Fuzzy Fact" Loophole** | "I wasn't *really* sure Pile B was 100% true." | Remind them of the Phase 1 rule. If they treat Old Evidence as uncertain, they've solved OEP by denying the "Old" part. Ask: "If you *had* been certain, would you still have felt the boost?" |
  | **Herding** | Credences shift to match the loudest grad student. | Compare the variance in Round 1 vs Round 2. If variance collapsed, discuss social vs. evidential updating. |
  | **The "Simplicity" Confuse** | "I updated because it's simpler." | Acknowledge this is **Abduction (IBE)**, not Bayes. Ask: "Does IBE solve OEP, or just rename it?" |

  ### The One Feature You Can't Reproduce
  **The Diachronic Constraint.**
  In the real OEP (e.g., Einstein and Mercury), the evidence was known *years* before the theory. In your 90-minute session, the evidence is only "old" by 30 minutes.
  *   **The Gap:** Participants haven't actually *integrated* the evidence into their worldview as "background" yet. It's still fresh.
  *   **What to Say:** "In this game, the evidence is 'cold' but not 'fossilized.' In the real historical cases, the evidence was part of the furniture of the universe. The tension is stronger there because the evidence wasn't just known; it was *unquestioned*."

  ### Summary for the Facilitator
  *   **Run the game strictly:** Enforce $P(E)=1$ for the Bedrock/Anomaly piles.
  *   **Let them break the rules:** Let them update their credences even though the formalism says they shouldn't.
  *   **Use the dissonance:** The discomfort they feel when you point out they violated Bayes is the learning objective.
  *   **Be honest:** Tell them, "This game shows why we need a solution to OEP, not what the solution is."

  This design respects their intelligence, avoids upfront lecturing, and creates the exact cognitive friction needed to make the reading list feel urgent.
