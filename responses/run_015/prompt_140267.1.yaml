      *   **Scenario:** Needs to be self-contained. A mystery is good. Let's use a "Departmental Sabotage" or "Lab Accident" scenario. Let's go with "The Missing Data" – a server crash where files were deleted. It feels academic.
      *   **Phase 1: The Evidence Board (30 mins).**
