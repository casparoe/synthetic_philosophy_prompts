      *   **The Flaw:** Step (3) creates a false dichotomy between "uniform experience" and "testimony." It treats the uniform experience as a *static prior* that cannot be updated by new data (the testimony). But uniform experience *is* just accumulated testimony/observation. New observation *should* update the probability of the law.
      *   **The "Price":** You have to admit that "Laws of Nature" are not metaphysical necessities but inductive generalizations. They *can* be broken (or rather, revised).
      *   **Corrosion:** Reject it. It's global skepticism. We assume regularity holds *locally* to investigate *local* anomalies.
      *   **Scope (Step 4):** This is where the real distinction lies. Scientific anomalies suggest the *law* was imperfect. Miracles suggest the *law* holds but was suspended. The testimony for the latter is usually tainted by motive/religion (dependence), whereas the frog case is independent.

