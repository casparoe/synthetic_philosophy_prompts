      *   *Corrosion:* The friend uses corrosion to say the reliability of testimony drops *if* the miracle happens. This is tricky. If the miracle is "laws of physics suspended," then "neurons firing correctly" might be suspended. But this is hyper-skepticism. We assume the *immediate* causal chain of the testimony is intact even if the *reported event* violates distant laws.
