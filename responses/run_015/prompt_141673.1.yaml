  ### Notes on how I built this

  **Candidate Distinctions & Cuts**
  I began with five potential axes: *Funding vs. Regulation*, *One Religion vs. All*, *Symbols vs. Money*, *Opt-In vs. Opt-Out*, and *Doctrine vs. Function*. I cut *Opt-In vs. Opt-Out* as a primary branch because it overlaps too much with Coercion; instead, I embedded it in the **Exit-Fee Asymmetry** node. I kept *Symbols vs. Money* distinct because a Laïcité view (symbols bad, money maybe ok) differs from a Separationist view (both bad).

  **Mapping the Four Objections**
  To ensure your four specific objections drive the tree, I assigned each a "gatekeeper" question:
  1.  **Message/Civic Standing:** Tested at Q1 (**The Silent Establishment**). If you accept state endorsement even when invisible, you prioritize tradition over equal standing.
  2.  **Money/Corruption:** Tested at Q2 (**The Heritage Clause**) and Q3 (**The Caritative Carve-out**). This separates those who fear funding *worship* from those who fear funding *religion at all*.
  3.  **State Authority:** Tested at Q5 (**The Two-Key System**). This separates Pluralists (no state say in doctrine) from those who accept state oversight.
  4.  **Coercion:** Tested at Q6 (**The Exit-Fee Asymmetry**). This isolates those who object to the *burden* of dissenting, distinct from those who object to the funding itself.

  **Empty & Unoccupied Combinations**
  *   **The Bureaucratic Theocrat (Leaf 10):** Approving state oversight (Q5) but also approving hard opt-outs (Q6). This is logically possible but politically unoccupied; authoritarians usually want easy funding, and libertarians want easy exits.
  *   **The Heritage-Only Secularist (Leaf 3):** Accepting funding for old buildings (Q2) but rejecting functional contracts (Q3). This is rare; usually, if you accept heritage funding, you accept functional funding. I kept it to test consistency.
  *   **Collapse Flag:** **Leaf 5 (Principled Pluralist)** and **Leaf 8 (Non-preferentialist)** may collapse in practice. Both fund religious associations equally. The tree separates them based on whether the state can investigate "hatred" (Two-Key System). In reality, "hatred" and "doctrine" are hard to disentangle, so these two views often end up in the same legal place.

  **Leaf Count**
  The tree generates 12 distinct leaves. This fits your 10–14 constraint while allowing enough granularity to separate the four objection types.

  ***

  ### HANDOUT: The Church-State Diagnostic
  *(Print this page only. Work through the questions in order. Track your answers: A=Approve, T=Tolerate, R=Reject.)*

  **Q1. The Silent Establishment:** The state has an official religion, but it is never mentioned in law or school, funded only by an old property endowment.
  *   **A:** Go to **Leaf 1**.
  *   **T or R:** Go to Q2.

  **Q2. The Heritage Clause:** The state funds upkeep of religious buildings older than 150 years as "cultural heritage," never as religion.
  *   **A:** Go to Q3.
  *   **T:** Go to **Leaf 2**.
  *   **R:** Go to Q3.

  **Q3. The Caritative Carve-out:** The state contracts religious bodies to run food banks and hospitals at cost, under identical auditing rules, paying for nothing else.
  *   **A:** Go to Q4.
  *   **T:** Go to **Leaf 3**.
  *   **R:** Go to **Leaf 4**.

  **Q4. The Mirror Rule:** Any benefit offered to a religious body must be offered on strictly identical terms to every group offering a comprehensive doctrine of life, explicitly including atheistic ones.
  *   **A:** Go to Q5.
  *   **T or R:** Go to **Leaf 5**.

  **Q5. The Two-Key System:** Funding requires certification by a state board that may investigate whether a group preaches hatred but is legally forbidden from inquiring into its doctrine.
  *   **A:** Go to Q6.
  *   **T:** Go to **Leaf 6**.
  *   **R:** Go to **Leaf 7**.

  **Q6. The Exit-Fee Asymmetry:** Everyone is enrolled automatically in the funding scheme and must file a formal declaration, pay a small fee, and appear in person at a government office to leave it.
  *   **A:** Go to **Leaf 8**.
  *   **T:** Go to **Leaf 9**.
  *   **R:** Go to Q7.

  **Q7. The Uniform Symbol Ban:** State employees (teachers, clerks) are forbidden from wearing conspicuous religious symbols, even if religious funding is allowed.
  *   **A:** Go to **Leaf 10**.
  *   **R:** Go to **Leaf 11**.

  ---

  **FINAL POSITIONS (LEAVES)**

  1.  **Unnamed (Silent Establishmentarian):** You accept state endorsement in principle, provided it remains invisible to the public eye.
  2.  **Unnamed (Heritage Compromiser):** You allow state money for religious history but worry about the message it sends to minority cultures.
  3.  **Unnamed (Heritage-Only Secularist):** You fund old churches as museums but refuse to fund their current social work. *(Diagnosis: Rare/Unstable)*
  4.  **Strict No-Aid Separationist:** You oppose all state entanglement, even efficient charity contracts, to prevent any dependency.
  5.  **Unnamed (Religious Privilege):** You support state funding for religion but deny equal terms to secular ethical communities. *(Diagnosis: Illiberal)*
  6.  **Unnamed (Oversight Compromiser):** You accept state safety checks on funded groups but worry the board will secretly police doctrine.
  7.  **Principled Pluralist:** You support funding associations but forbid the state from judging their internal beliefs or speech.
  8.  **Unnamed (Bureaucratic Theocrat):** You support state funding and make it difficult to opt-out. *(Diagnosis: Unoccupied/Coercive)*
  9.  **Unnamed (Soft Coercionist):** You support funding but accept a difficult opt-out process as a necessary administrative burden.
  10. **Laïcité-Style Republican:** You prioritize the visual neutrality of the state agent over the individual expression of the employee.
  11. **Non-Preferentialist:** You accept full state entanglement with religion provided every doctrine is funded equally and symbols are allowed.
  12. **Empty Path:** (If you reached here via Q6-R and Q7-R, you match Leaf 11. If you have other combos, you likely hold a unique view not mapped here).

  *(Note: Leaf 12 is a placeholder for complex mixes. Most users will land on 4, 7, 10, or 11.)*
