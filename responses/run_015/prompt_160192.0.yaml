answer: |-
  **MERIDIAN GEOMETRIC PARTNERS**
  **Annual Letter to Limited Partners — Year Five**

  Dear Partners,

  It is with a sense of serene accomplishment that we mark the fifth anniversary of Meridian Geometric Partners. As you have observed, the Net Asset Value (NAV) of the fund currently stands at $0.11 on the dollar. We understand that this drawdown is distressing to those measuring performance in fiat terms rather than growth rates. However, we remain convinced that the fund has adhered strictly to the only strategy that maximizes the almost-sure asymptotic growth rate of capital.

  The discrepancy between your experience and our mandate is best illustrated by the fund's performance metrics:

  | Metric | Annualized Figure |
  | :--- | :--- |
  | **Arithmetic Mean Return** | **+24.5%** |
  | **Geometric Mean Return** | **-34.1%** |
  | **Ensemble-Average Wealth**¹ | **$4.82** |
  | **Time-Average Wealth** | **$0.11** |

  ¹ *The Ensemble-Average represents the expected value of the fund across all possible historical paths, weighted by probability. The Time-Average represents the path actually realized. In non-ergodic systems, these quantities diverge. You inhabit a single timeline.*

  While the arithmetic mean suggests robust profitability, the volatility drag inherent in full-Kelly betting has suppressed the geometric compounding over this finite horizon. It is a mathematical fact that betting the full Kelly fraction maximizes the long-run growth rate, but the probability of outperforming a fractional-Kelly strategy over a mere five-year sample is only approximately 58%.² We do not apologize for the variance of the short run.

  Regarding the affiliated vehicle, Meridian Aggressive: this fund bet three times the Kelly fraction on every opportunity. We are pleased to report that the *expected value* of Meridian Aggressive was substantially higher than Meridian Geometric at inception. That the fund is now worth zero is a testament to the distinction between maximizing expected wealth and maximizing the growth rate of wealth. Expected value is dominated by vanishingly rare worlds where the fund wins every coin toss; growth rate is dominated by the world you actually live in.

  We note that several competitors employing half-Kelly strategies have outperformed us over this period. This is consistent with theory. Fractional Kelly reduces variance at the cost of drift. Over infinite time, we win. Over five years, luck remains a factor. We do not manage for luck.

  **Structural Reforms**
  Effective immediately, Meridian Geometric Partners has merged with its sister vehicle, Meridian Domestic. In the course of this integration, we have concluded that once sub-portfolios are merged, each member betting his own Kelly fraction is not the growth-optimal policy for the pool. The Kelly fraction is a property of the aggregate book, not the individual manager. Henceforth, leverage will be centralized to optimize the logarithmic utility of the pooled entity, rather than the sum of individual optimizations.

  We also address the query from the partner who insisted on withdrawing his capital gains annually.³ The fund is designed for geometric compounding. Withdrawing returns converts a multiplicative process into an additive one, effectively opting out of the strategy while remaining in the vehicle. We have processed your withdrawal as a redemption of the wrong product.

  **Correspondence**
  We received the following communication from a partner specializing in decision theory:

  > *"You have maximized $E[\log W]$, but my utility function is $U(W) = W^{1-\gamma}/(1-\gamma)$. By imposing log-utility, you have violated my preferences and lowered my expected utility. This is not rationality; it is paternalism."*

  Our reply: In a repeated multiplicative game, any utility function that grows slower than logarithmic implies eventual ruin; any function that grows faster implies vanishing risk exposure. The logarithm is not a preference; it is the boundary between survival and extinction. We manage for survival.

  **Meridian Geometric Partners II**
  Finally, we are launching Meridian Geometric Partners II. The strategy will be identical to Fund I: full Kelly on all identified edges. We invite partners in Fund I to roll their remaining capital into Fund II at the current net asset value. This reset allows us to crystallize the low base from which the next period of geometric growth will compound.

  The long run is not a destination. It is a discipline.

  Sincerely,

  *The Management*

  ***

  ² *The probability that Full Kelly underperforms Fractional Kelly over horizon $T$ decays slowly. For $T=5$, the distribution of log-wealth differences is wide enough that underperformance remains statistically common.*

  ³ *Partner R. V. The clause regarding "accidental product mismatch" is now standard in our LPA.*
