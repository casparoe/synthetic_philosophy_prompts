  # TAXONOMY OF TEMPORAL SCALE IN HISTORY
  **Handout for Historiographical Seminar**

  **Instructions:** Navigate the tree by selecting the claim you are willing to defend at each junction. Your path ends at a specific historiographical position. Each position includes its "awkward commitment"—the difficult implication you must accept to maintain logical consistency.

  ### LEVEL 1: THE NATURE OF THE SLOW LAYER
  *Select your view on geography and climate:*
  *   **(A)** Long-term geographic and climatic structures act as **fixed walls** that societies cannot move.
  *   **(B)** Long-term geographic and climatic structures are **mutable clay** that societies slowly reshape alongside them.

  ### LEVEL 2: THE NATURE OF THE MEDIUM LAYER
  *Select your view on economic and social cycles (conjunctures):*
  *   **(1)** Medium-term cycles run on their own **internal logic** independent of individual will.
  *   **(2)** Medium-term cycles are just the **statistical sum** of short-term individual choices.

  ### LEVEL 3: THE POWER OF THE EVENT
  *Select your view on battles, assassinations, and policy shocks:*
  *   **(i)** Rapid events can **shatter and rewrite** the slower layers of history.
  *   **(ii)** Rapid events are always **trapped within** the limits of the slower layers.

  ---

  ## THE LEAVES

  **Path A-1-ii: Fixed Walls + Internal Logic + Trapped Events**
  *   **Position:** Hard Geographic Determinism / Classic Braudel (Strict Reading)
  *   **Awkward Commitment:** You must argue the Fall of Constantinople is pure surface noise that changed nothing fundamental about Mediterranean trade structures.

  **Path A-2-ii: Fixed Walls + Statistical Sum + Trapped Events**
  *   **Position:** Unnamed (Environmental Individualism)
  *   **Awkward Commitment:** You must argue a pandemic is just a sum of individual infections and never constitutes a structural break in history.

  **Path A-2-i: Fixed Walls + Statistical Sum + Shattering Events**
  *   **Position:** **[LOGICAL DEAD END]**
  *   **Note:** Incoherent. If the slow layer is defined as "fixed walls" (A), events cannot "shatter and rewrite" them (i). This branch is empty.

  **Path B-1-ii: Mutable Clay + Internal Logic + Trapped Events**
  *   **Position:** Soft Braudian Co-evolution / Vidal-style Possibilism
  *   **Awkward Commitment:** You must argue the invention of the steam engine was inevitable due to systemic pressure, regardless of James Watt's specific choices.

  **Path B-1-i: Mutable Clay + Internal Logic + Shattering Events**
  *   **Position:** The Anthropocene / Event-Cascade View
  *   **Awkward Commitment:** You must argue a single carbon policy can rewrite multi-century climate patterns within a decade because human action now moves at geologic speed.

  **Path B-2-ii: Mutable Clay + Statistical Sum + Trapped Events**
  *   **Position:** Unnamed (Structural Inertia View)
  *   **Awkward Commitment:** You must argue societies reshape their environment, but no single generation ever actually sees the turning point happen.

  **Path B-2-i: Mutable Clay + Statistical Sum + Shattering Events**
  *   **Position:** Micro-Agent View / Accelerationism
  *   **Awkward Commitment:** You must argue a single election or policy decision can reverse centuries of soil depletion trends almost immediately.

  ---

  ## CARTOGRAPHER'S NOTES

  **1. The Indistinguishable Pair**
  *Vidal-style Possibilism* and *Soft Braudian Co-evolution* both land in leaf **B-1-ii**. In this taxonomy, they are functionally identical: both argue that while humans interact with the environment (Mutable Clay), the systemic rhythms (Internal Logic) are too heavy for specific events to break (Trapped). Distinguishing them requires a separate taxonomy focused on human agency rather than temporal scale.

  **2. The Empty Branch**
  Leaf **A-2-i** is marked as a Logical Dead End. It is theoretically possible to argue that geography is fixed but events shatter *social* structures, but this taxonomy defines the "slower layers" in Level 3 as the same structures defined in Level 1. Therefore, claiming they are "Fixed" and "Shatterable" simultaneously is a contradiction.
