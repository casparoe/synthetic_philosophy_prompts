answer: |-
  Good morning.

  Last night, I spent three hours in a heated but friendly argument with a colleague that I suspect many of you have had in different forms. We were talking about hypocrisy. Specifically, my friend asked me a question that stopped me cold: "Can a hypocritical judge still render a correct verdict?"

  On the surface, it sounds like a trick question. Of course, the verdict can be legally sound. The law is the law. But my friend wasn't asking about legality. They were asking about moral force. If the judge sentencing a thief is themselves stealing from the court fund, does their judgment carry weight? Does the hypocrisy cancel the blame, or does it merely change the grammar of how that blame is delivered?

  I bring this up not because I have the answer, but because I need us to sit with that tension today. We are here for a workshop on "Accountability Without Scapegoating," co-hosted by philosophers, legal practitioners, and community organizers. That is a volatile mix in the best of times. We speak different languages. When a philosopher says "standing," a lawyer hears "jurisdiction," and an organizer hears "trust." But if we are to avoid scapegoating—if we are to build accountability that repairs rather than punishes—we need a shared architecture for what we are doing when we speak to one another about harm.

  So, I want to propose a distinction for us to test today. It is a distinction between what I will call the "standing to blame" and the "standing to accuse."

  I am not fully sure this distinction holds up under all pressure, but I believe it does the structural work we need.

  The "standing to blame" is a relational entitlement. It is the right to hold someone answerable for a specific harm because you are affected by it, or because you share a normative community with them. It says: "You broke this thing we both rely on. You owe a repair."

  The "standing to accuse," however, is different. It is a performative authority. It relies on a position of unexamined moral cleanliness. It says: "I am above this breach, and you are below it. I name you wrong."

  Here is why this matters practically, not just semantically. Let's look at a concrete scenario. Imagine a city government that fines a small factory for emissions violations. The factory is indeed poisoning the local water supply. But suppose it comes to light that the city's own waste contract is also in breach; the city is dumping illegally elsewhere.

  Has the city lost the right to blame the factory altogether? Or has it merely lost the right to speak as though it were blameless?

  If we say hypocrisy cancels blame entirely, then the city must be silent. The factory remains unaccountable because the accuser is dirty. This leads to a paralysis we see often in institutions: the fear that unless we are perfect, we cannot demand justice. It creates a world where accountability is held hostage by purity.

  But if we say hypocrisy only cancels the *standing to accuse*, the landscape changes. The city can still lament the wrong. It can still demand repair. It can still enforce the regulation. But it cannot do so from a pedestal. It must say, "We are fining you for this harm, even as we acknowledge we are failing elsewhere."

  This distinction determines what kinds of statements are available to us in this room, and what kinds are foreclosed.

  For the philosophers here, you know the literature on the standing to blame. You know the debate over whether hypocrisy is a forfeit of moral authority. I am asking you to consider today whether that literature sometimes conflates the authority to demand repair with the authority to claim purity. If we separate them, does the normative force of blame survive the stain of hypocrisy?

  For the legal practitioners in the room, you think in procedural terms. You know that standing is about who can bring a case. But in restorative contexts, procedure meets culture. If an institution enters a restorative circle claiming the standing to accuse, it invites scrutiny of its own record that can derail the process. The circle becomes a trial of the institution rather than a repair of the harm. But if the institution enters claiming only the standing to blame—acknowledging its own implicated status—it changes the procedural dynamic. It allows for accountability without inviting the defensive warfare that comes from claimed purity.

  And for the organizers who have actually facilitated these circles: you know the feeling when an institution's representative apologizes for harm they never personally caused. It often rings hollow. Why? Because often, they are speaking from the standing to accuse—representing the clean face of the organization—rather than the standing to blame, which would require them to implicate themselves in the structure that caused the harm.

  This is the architectural work I want this distinction to do. If we adopt the grammar of accusation, our own records become fair game in ways that can paralyze action. We spend our time defending our cleanliness rather than addressing the harm. Scapegoating thrives in this space. Scapegoating requires a sacrificer who is pure enough to cast the stone. If we reveal the sacrificer is also flawed, the ritual collapses.

  But if we adopt the grammar of blame—if we focus on the relational entitlement to demand repair—we can bypass the need for purity. We can say, "I am compromised, and you are compromised, but this specific harm must be addressed." This is uncomfortable. It removes the shield of moral elevation. But it might be the only way to achieve accountability without creating a new victim to cleanse the system.

  I do not want to resolve the dispute I had with my friend last night. I do not know if the hypocritical judge's verdict is morally nullified. But I know that if we treat this workshop as a search for pure hands, we will leave with nothing. If we treat it as a search for effective, relational accountability despite our dirty hands, we might leave with something usable.

  So, as we move into our first panel, I want to leave you with this framing question. It is the question I am carrying with me from that argument last night, and I invite you to carry it through the day:

  When we speak to power about harm, are we speaking to demand a repair, or are we speaking to claim a verdict? And if we cannot claim moral cleanliness, do we still have the standing to speak?

  Let's find out.
