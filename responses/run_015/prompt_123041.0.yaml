answer: |-
  **Setting:** *A quiet conference room overlooking the university hospital grounds. Dr. Marcus Chen and Dr. Sarah Okonkwo sit across from each other, a single file folder open between them. They are preparing a joint recommendation for the Clinical Ethics Board regarding Patient 4092.*

  **Dr. Marcus Chen:** The board needs a number, Sarah. They cannot vote on a philosophical dilemma. They need to know if Patient 4092 has a thirty-four percent chance of surviving six months, or seventy-one. If we tell them "it depends on how you carve nature," we haven't done our job. We have to identify the causally homogeneous reference class. In this case, it's the patients carrying the specific genetic variant receiving this specific chemotherapy. That is the mechanism driving the outcome.

  **Dr. Sarah Okonkwo:** And if that class contains only twelve historical patients? You're arguing for mechanistic privilege, Marcus. You're saying there is one "true" class dictated by the biochemical interaction between the variant and the drug. But identifying that mechanism is theory-laden. We *think* that variant is the causal driver, but our models are underdetermined by the data. If we privilege that class and our mechanistic theory is slightly off, we aren't just wrong; we're precisely wrong.

  **Chen:** Precision is the goal. Look at the alternatives. If we use the class of "all patients with this cancer type," we get the thirty-four percent baseline. But that includes patients without the variant, whose biology reacts differently to the regimen. That class is causally heterogeneous. It mixes apples and oranges. Yes, the sample size for the variant group is small, but the base rate derived from it is objective. It reflects the actual propensity of the system. Without privileging the mechanism, probability judgments are merely pragmatic conventions. You're suggesting we choose a class based on convenience rather than truth.

  **Okonkwo:** I'm suggesting we choose based on stability. You claim the variant-specific class is objective, but you're ignoring the descriptive granularity paradox. If the variant is relevant, isn't the patient's age relevant? Fifty-eight years old. Isn't the hospital's specific protocol relevant? If we keep adding causally relevant descriptors to ensure homogeneity, we shrink the sample. At the limit, where the description is fully specific to the individual, n equals one. The frequentist base rate collapses entirely. You stop where it suits your theory of the mechanism. I say we acknowledge that stoppage point is arbitrary.

  **Chen:** It's not arbitrary; it's bounded by causal relevance. The variant affects the metabolic pathway of the drug. The patient's age matters less if the pathway is the bottleneck. I grant you that identifying the mechanism is fallible, but that's an epistemic problem, not an ontological one. There *is* a fact of the matter about whether this drug works on this variant. Our uncertainty doesn't dissolve the objective base rate; it just means we have wide confidence intervals around it. But we must center our advice on that mechanistic class. To do otherwise is to lie to the board about what drives survival.

  **Okonkwo:** But look at the variance. The variant-specific class suggests a survival rate near the middle, but with such high noise that it overlaps with the hospital-specific class, which shows seventy-one percent survival. The hospital class captures unmeasured variables—quality of care, supportive therapy—that your mechanistic view ignores because they aren't "biochemical." If we tell the board to rely solely on the variant class, we risk ignoring the protective effect of this specific hospital environment. That's why I propose indexical aggregation. We shouldn't select a unique class. We should pool over the plausible reference classes.

  **Chen:** Pooling? You mean averaging the thirty-four percent from the broad cancer group, the seventy-one percent from the hospital group, and the variant-specific estimate? That's statistically incoherent. You're mixing classes of different sizes and variances. And how do you weight them? If you say "weight by confidence," you've just smuggled subjectivism in through the back door. Whose confidence? Yours? Mine? The oncologist's? That collapses into decision-theoretic arbitrariness. You're replacing the search for truth with a consensus of hunches.

  **Okonkwo:** *[Pauses, tapping a pen against the table]* I see the force of that objection. If I say "weight by confidence," it sounds like I'm asking for a gut feeling. Let me sharpen that. I don't mean subjective confidence. I mean weighting by predictive stability across cross-validations. We treat each reference class as a model. We assess how well each class has predicted outcomes for similar singular cases in the past. The hospital class might get higher weight not because we "feel" it's important, but because historically, hospital-specific data has been more robust for this specific regimen than genetic data alone.

  **Chen:** So you're shifting from ontological claims to meta-inductive claims. You're saying we trust the hospital class because it has worked better before, not because it captures the causal reality.

  **Okonkwo:** Exactly. Because "causal reality" is inaccessible at the singular level. We only have access to patterns. By pooling, we avoid the false uniqueness of your approach. You claim the variant class is *the* class. I claim it is *a* useful description among others. If we pool, say, using a Bayesian model averaging approach, we get a credence that reflects the uncertainty of the classification itself. The resulting probability might be fifty percent, but it carries the weight of the disagreement between the classes. It tells the board: "Based on the biology, it's risky; based on the hospital's track record, it's promising." Your single number hides that tension.

  **Chen:** It hides the tension, yes, but it provides a decision boundary. The board has to authorize a toxic regimen. If the true probability is below forty percent, the ethics code suggests palliative care. If it's above, treatment is permissible. If you give them a pooled fifty percent derived from mixing a thirty-four percent class and a seventy-one percent class, you haven't resolved the risk. You've diluted it. And here is my counter to your meta-induction: if the variant is indeed the dominant causal factor, as the biochemistry suggests, then the hospital class is actually confounded. It looks stable only because it hasn't been stratified by the variant yet. By pooling, you are giving weight to a class that you know is causally incomplete. You are privileging the "black box" of hospital statistics over the "white box" of mechanism.

  **Okonkwo:** *[Leans forward]* That's a fair critique. If the mechanism is known with high certainty, pooling dilutes the signal. But is it known with high certainty? We are talking about an *uncommon* variant. The biochemical interaction is modeled, not observed in large trials. This brings me back to my revision. I shouldn't just weight by past predictive stability. I should weight by the *degree of causal specification* supported by evidence.

  **Chen:** Go on.

  **Okonkwo:** We assign weights not arbitrarily, and not just by past performance, but by the strength of the evidence linking the class descriptor to the outcome. The variant has strong biochemical plausibility but weak statistical power (small n). The hospital data has strong statistical power but weak causal specificity. We weight them proportionally to the evidence strength for *this specific context*. If the biochemical model is preliminary, the hospital data gets more weight. If the biochemical model is confirmed by in-vitro trials, the variant class gets more weight. This isn't subjectivism; it's evidence-weighted aggregation. It avoids your "false uniqueness" while respecting your "causal privilege" as a factor in the weighting, rather than a trump card.

  **Chen:** So you're conceding that causal relevance matters for the weighting scheme?

  **Okonkwo:** I'm conceding that causal relevance is a variable in the aggregation function, not the sole selector of the class. You want to use causality to pick the *one* class. I want to use causality to determine how much *voice* each class gets in the final probability.

  **Chen:** I can accept that, provided we agree that the mechanistic class must have a veto threshold. If the variant data shows the drug is toxic to this specific biology—say, survival drops to zero in the mechanistic class—then pooling with the hospital data is unethical. You can't average a zero survival rate with a seventy-one percent hospital rate to get a "maybe."

  **Okonkwo:** Agreed. If any reference class indicates a contraindication with high mechanistic certainty, aggregation stops. That's a safety constraint. But for positive survival probabilities, where we are dealing with ranges like thirty-four to seventy-one, pooling is more honest. It prevents us from telling the board we know more than we do.

  **Chen:** Then we have a framework. We present the mechanistic estimate as the primary causal indicator, but we qualify it with the aggregated range to show environmental variance. We tell the board: "The biology suggests a specific propensity, but our epistemic access to that propensity is limited by sample size, so we adjust using broader statistical classes."

  **Okonkwo:** Yes. But we must be clear that the final number isn't "the probability." It is a credence optimized for decision-making under structural uncertainty. We aren't telling them what the world *is*, Marcus. We are telling them how to bet given what we *know*.

  **Chen:** And if the board asks why we didn't just use the variant class?

  **Okonkwo:** We tell them that because the variant is uncommon, relying solely on it assumes our current biological theory is complete. It isn't. The pooling acknowledges that there are factors affecting survival we haven't named yet—factors captured implicitly in the hospital data but missed in the genetic model.

  **Chen:** *[Closes the folder]* Fine. We recommend the weighted aggregate, with a footnote emphasizing the mechanistic class as the primary causal driver. But I'm writing the footnote. I won't have them thinking the biology is just one factor among equals. It is the engine; the rest is the terrain.

  **Okonkwo:** *[Smiles]* And I'll write the main body. Because even the best engine fails if the terrain is impassable. We'll meet in the middle. The board gets the number, but they also get the map of why the number is uncertain.

  **Chen:** Acceptable. Let's go tell them.
