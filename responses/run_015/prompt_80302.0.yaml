answer: |-
  In the Lublin district during the summer of 1942, a Reserve Police Battalion commander receives orders to liquidate a small Jewish community but, citing a new directive on "personnel conservation," announces that the default assignment for all reservists is perimeter security, and only those who explicitly volunteer will be issued ammunition for the execution squad, with the order explicitly stating that choosing security will not be recorded or viewed as detrimental to one's standing. Daniel Goldhagen's dispositional model predicts that the vast majority of men will still volunteer to shoot, because their behavior is driven by an internalized, eliminatory antisemitism that makes killing Jews a desired end in itself, rendering the administrative framing of the task irrelevant to their motivation. Christopher Browning's situational model predicts that most men will remain on perimeter duty, because their compliance historically stemmed from conformity, obedience to immediate authority, and the social cost of refusal; by making killing an opt-in exception rather than the default obligation, the scenario removes the peer pressure and normative script that compelled ordinary men to participate against their inclinations.

  The single feature doing the work is the **default status of the killing role** (whether killing is the assigned norm or the volunteered exception). If you remove this feature and revert to the historical norm where shooting is the mandatory default and security is the stigmatized opt-out (as in Major Trapp's Józefów speech), both accounts converge on high compliance: Goldhagen because the men want to kill, and Browning because the situational pressure to conform is maximized. Goldhagen would attack this case not by conceding the situational point, but by arguing that the "default" framing is superficial; he would contend that the men's underlying ideological commitment to the *Volk* and hatred of Jews would compel them to volunteer regardless of the administrative hassle, viewing the security role as shirking a national duty that no commander's order could truly legitimize.
