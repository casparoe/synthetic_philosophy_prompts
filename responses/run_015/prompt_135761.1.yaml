  it feels wrong because we care about ravens, not shoes, and in testing we care about R inputs, not floats. nicod said we should only check instances of the subject class, so float-tests shouldnt count. hempel took nicods criterion and used it to show that its too restrictive, since logical equivalence forces us to count shoes too.

  the analogy is actually stronger in code. hempel eventually solved the paradox by saying confirmation depends on projectible predicates, and in programming syntax is always projectible cause its formally defined. so the paradox never arises in testing - "R-type" is precisely specified, which removes the ambiguity that makes the raven case weird. but the logical structure is still there, which is why we intuitively think testing floats is useless."

