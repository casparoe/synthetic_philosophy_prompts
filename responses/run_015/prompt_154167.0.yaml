      *   Abstract/Summary.
      *   Problem Statement (The precise question).
      *   Why Priors Fail (The gap).
      *   Methodology (Case studies, proxy metrics).
      *   Deliverables/Success Criteria.
      *   Feasibility (Why 6 months works).

  7.  **Final Review against constraints:**
      *   Short research proposal? Yes.
      *   6-month workshop/fellowship pitch? Yes.
      *   Solomonoff/Kolmogorov/Occam? Yes.
      *   Twist (Interventional)? Yes.
