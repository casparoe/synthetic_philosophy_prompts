answer: |-
  **Project Title:** Causal Compression: An Interventional Reformulation of Occam's Razor in Scientific Practice

  **Project Type:** 6-Month Part-Time Fellowship / Workshop Pitch
  **Applicant Background:** Retired Chemist / Early-Career Philosopher of Science

  ### 1. The Core Question
  Standard Solomonoff induction formalizes Occam's razor by selecting the hypothesis with the lowest Kolmogorov complexity (shortest program length) that reproduces observational data. This proposal investigates a specific modification: **Does the "shortest program" remain the preferred hypothesis when the program is required to output correct predictions under *interventions* (manipulations of variables), rather than passive observations alone?**

  Precisely: *Does minimizing Kolmogorov complexity over an interventional input-output map (a causal model) select different theories than minimizing complexity over a purely observational map, and if so, does this divergence track actual theory choice in mature sciences?*

  The critical tension to be examined is whether defining the "program" to include interventional operators (e.g., `do(X)`) constitutes a legitimate refinement of simplicity or if it illegitimately "smuggles" causal commitments into a framework designed to be syntactically neutral.

  ### 2. Why Standard Bayesian Simplicity Priors Do Not Settle This
  A standard Bayesian approach assigns a prior probability $P(H) \propto 2^{-K(H)}$, where $K(H)$ is the complexity of the hypothesis. This fails to resolve the interventional question for two reasons:

  1.  **Equifinality of Fit:** Distinct structural models (e.g., a direct causal link $A \to B$ vs. a confounded structure $A \leftarrow C \to B$) can often be parameterized to fit observational data equally well with similar descriptive lengths. A simplicity prior based on observational fit cannot distinguish them.
  2.  **Modal Blindness:** Standard Kolmogorov complexity measures the compression of *actual* bitstrings. It is agnostic to counterfactual stability. A polynomial curve fit might be syntactically shorter than a mechanistic rate-law equation for a specific dataset, yet scientists reject the polynomial because it fails under intervention (e.g., changing temperature or concentration). The standard framework lacks the vocabulary to penalize the polynomial for its interventional fragility without explicitly building causality into the description language.

  ### 3. Methodology: Comparative Case Studies (No New Formalism)
  This project will not derive new theorems or attempt to compute uncomputable Kolmogorov constants. Instead, it will use **descriptive length proxies** (e.g., parameter counts, lines of simulation code, or symbolic expression length) to compare competing models in two specific domains.

  **Case Study A: Chemical Kinetics (Leveraging Applicant Expertise)**
  *   **Comparison:** Compare a black-box polynomial fit of reaction rate data vs. a mechanistic Michaelis-Menten or Arrhenius-based model.
  *   **Intervention:** The "intervention" is the extrapolation to untested temperatures or inhibitor concentrations.
  *   **Analysis:** Does the mechanistic model have higher observational complexity but lower *interventional* complexity (i.e., requires fewer bits to specify its behavior across multiple manipulated contexts) compared to the black-box model which requires re-fitting for every new context?

  **Case Study B: Genetic Regulatory Networks (Systems Biology)**
  *   **Comparison:** Compare a correlation-based network (Gaussian Graphical Model) vs. a Structural Causal Model derived from gene-knockout data.
  *   **Intervention:** The "intervention" is the gene knockout.
  *   **Analysis:** Evaluate whether the "shortest" program that predicts the wild-type expression data is different from the "shortest" program that predicts the post-knockout data. Does the scientific community's preference for the causal model align with the interventional complexity metric?

  ### 4. Success and Failure Criteria
  **A Useful Result (Success):**
  The project succeeds if it demonstrates a systematic divergence where:
  1.  The model preferred by scientists is *not* the shortest program for observational data.
  2.  The model preferred by scientists *is* the shortest program when the description must account for interventional outcomes.
  3.  This confirms that scientific "simplicity" is actually "interventional compressibility," validating the twist without circularity.

  **Project Failure:**
  The project fails if:
  1.  **Convergence:** The observational and interventional complexity metrics always select the same model (suggesting the twist is redundant).
  2.  **Incommensurability:** The "interventional program" cannot be defined without simply hard-coding the answer (e.g., if specifying the `do()` operator requires more bits than the predictive gain saves, rendering the metric useless).
  3.  **Scope Creep:** The attempt to formalize the "interventional program" devolves into building new mathematical machinery rather than analyzing existing scientific practice.

  ### 5. Feasibility and Timeline (6 Months Part-Time)
  *   **Month 1:** Literature review on Structural Causal Models (Pearl), Minimum Description Length (MDL), and existing critiques of Solomonoff induction in physics.
  *   **Month 2-3:** **Case Study A (Kinetics).** Gather standard datasets, estimate descriptive lengths of competing models (symbolic vs. numerical), and draft the analysis.
  *   **Month 4-5:** **Case Study B (Genetics).** Collaborate remotely with a contact in systems biology or use open-source knockout datasets to replicate the complexity comparison.
  *   **Month 6:** Synthesis. Write the final paper/report focusing on the philosophical implication: Is causality a primitive or a compression tool?

  **Risk Management:** Since exact Kolmogorov complexity is uncomputable, the proposal explicitly relies on *proxies* (MDL, parameter counts). This keeps the work within the realm of philosophical analysis of practice rather than pure computation, fitting the 6-month constraint.

  ### 6. Conclusion
  This project moves the debate on Occam's razor from "what is the simplest story?" to "what is the simplest instruction manual for manipulating the world?" By grounding the analysis in concrete chemical and biological modeling practices, it avoids the trap of abstract theorizing while addressing a fundamental gap in how we formalize scientific reasoning.
