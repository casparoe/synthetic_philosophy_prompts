          *   Checklist Guy: Follows plan. If reality deviates, he stops. (Partial Pass/Fail). User says "thinner version." Let's call this "Procedural Compliance" vs. "Skill."
          *   Climbing Instructor: Responds to rope, words don't matter. (Pass)
          *   Concrete Guy: Responds to mix, story doesn't matter. (Pass)
          *   Jig Student: Jig responds, he doesn't. (Fail - or very weak).
          *   Rusty Bike: Muscle memory responds. (Pass)
          *   Tennis/Runner: Thinking (facts) stops responding. (Pass - proves facts aren't the skill).
          *   Pitching Coach: Responds to *observation* of error. (Pass - different domain).

      *   *Refining the "Checklist vs. Jig" distinction:*
          *   Checklist Guy: He knows the steps. He owns the action, just not the variation.
          *   Jig Student: The jig holds the angle. He owns the trigger pull.
          *   *Distinction:* The Checklist Guy is driving on a mapped route. The Jig Student is on a train.
          *   *Revised Principle:* **Knowing How is the ability to close the gap between what you want to happen and what is happening, using your own judgment.**

  5.  **Drafting the Response:**
      *   **Stance:** Your brother-in-law is wrong. Knowing how is *not* knowing facts. It is a distinct capacity.
      *   **The Principle:** "Knowing How" is the ability to **monitor and correct** the action while it's happening.
      *   **Why this works:**
          *   Facts (Knowing That) are static. Skills (Knowing How) are dynamic.
          *   Tennis player: Monitoring gets hijacked by facts.
