      *   **Goal:** He wants a *principle* that explains his gut verdicts on these cases. He wants me to test his tentative rule, fix it, and apply it to two new cases (dependent student, first successful bead).
      *   **Constraints:** Take an actual position (don't hedge). Plain American English (no jargon without explanation). Be honest about confidence and potential flaws. Address the specific cases provided.

  2.  **Deconstruct the Philosophical Core:**
