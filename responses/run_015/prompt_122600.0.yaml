answer: |-
  Here is the bottom line: Your brother-in-law is wrong. Knowing how is not just a pile of facts in your head. If it were, the tennis player wouldn't choke when he thought about his grip, and the uncle who can't explain the clutch wouldn't be able to drive.

  You asked for a principle that fits your gut feelings on all these cases, including the tricky ones like the checklist guy versus the jig student. Here is the principle I believe works best for what you do in the shop.

  ### The Principle
  **You know how to do X if you can reliably steer the result toward your goal when reality tries to push it off course, without needing someone else to do the steering for you.**

  This principle has three parts. If you break them, you lose "knowing how."
  1.  **Reliability:** You can't just get lucky once.
  2.  **Steering (Correction):** You have to be the one fixing errors as they happen.
  3.  **Independence:** You can't outsource the fixing to a tool or a person.

  Here is how this principle handles your cases, why it fixes your tentative rule, and how it answers your two new questions.

  ### Testing the Principle Against Your Cases

  **1. The Uncle (Stick Shift)**
  *   **Verdict:** Knows how.
  *   **Why:** He steers the car smoothly even when the engine or hill changes (Reality pushes). He doesn't need a manual (Independence). He does it every time (Reliability). The fact that he can't explain *why* doesn't matter because the principle is about steering, not talking.

  **2. The Video Kid**
  *   **Verdict:** Doesn't know how.
  *   **Why:** He has the facts, but he hasn't touched the wheel. He cannot steer because he hasn't felt the road.

  **3. The Checklist Guy**
  *   **Verdict:** Knows how, but it's "thin."
  *   **Why:** This is where your first rule struggled. Under my principle, he knows how to *follow a procedure*, but he doesn't fully know how to *weld*. He can steer the car as long as the road is perfectly paved. The moment there is a pothole (a gap, a breeze), he stops steering. He is "thinner" because his ability to correct errors is zero. He relies on the environment staying perfect. This matches your gut: he has some skill, but it's fragile.

  **4. The Climbing Instructor & Concrete Guy**
  *   **Verdict:** Knows how.
  *   **Why:** Their words (facts) are wrong, but their hands (steering) are right. The principle ignores the explanation and looks at the result. They correct the rope or the mix based on feel, not theory.

  **5. The Jig Student**
  *   **Verdict:** Weak "knowing how" (closer to "doesn't know" than the Checklist Guy).
  *   **Why:** You said this feels different than the Checklist Guy, and my principle explains why. The Checklist Guy is driving the car; the Jig Student is a passenger on a train. The jig prevents the errors from happening, so the student never has to steer. If the jig is removed, reality pushes the weld off course, and he has no ability to push back. He has outsourced the steering to the equipment. That is why he feels less skilled than the Checklist Guy—the Checklist Guy is still using his own brain to sequence the steps; the Jig Student is just pulling the trigger.

  **6. The Rusty Bike / Piano**
  *   **Verdict:** Knows how.
  *   **Why:** Reliability returned quickly. The steering mechanism was dormant, not deleted. The wobble was just the system recalibrating.

  **7. The Tennis Player / Runner**
  *   **Verdict:** Proves facts aren't skill.
  *   **Why:** When they switch to "knowing that" (thinking about facts), they stop "steering" (subconscious correction). The facts jam the mechanism. This proves skill is a different system than facts.

  **8. The Pitching Coach**
  *   **Verdict:** Knows how to *coach*, knows *about* pitching, doesn't know how to *pitch*.
  *   **Why:** This is the hardest case. My principle says "steer the result." The coach cannot steer the ball. However, he can steer the *pitcher*. He has the "Steering" and "Independence" parts, but applied to a different job. He knows how to fix a pitch, not throw one. This distinguishes him from the Video Kid. The Video Kid has facts; the Coach has diagnostic steering.

  ### Where Your Tentative Rule Broke
  Your rule said: *(a) land it when conditions shift* and *(b) teach a beginner by showing.*

  *   **Problem:** The Checklist Guy fails (a), but you still wanted to count him. My principle counts him as "partial" because he can steer *standard* conditions, just not *shifted* ones. It allows for degrees of skill.
  *   **Problem:** Your rule didn't explain why the Jig Student feels worse than the Checklist Guy. Both fail (a). My principle explains it: The Checklist Guy is steering the process; the Jig Student is letting the tool steer.

  ### Applying the Principle to Your Two New Cases

  **Case 1: The Student Who Needs You in the Room**
  *   **Verdict:** He does **not** know how yet.
  *   **Why:** Look at the third part of the principle: *Independence.* You said, "I'm not touching anything." That's true, but you are doing the steering. You are the external sensor. When the bead starts to wander, he waits for you to say something. You are noticing the error and telling him to correct. He is the hands; you are the brain. Until he can hear the crackle of the arc and adjust his speed without you saying a word, he is not steering. He is a remote-controlled robot, and you hold the controller.

  **Case 2: The First Good Bead**
  *   **Verdict:** You did **not** know how before you did it. You acquired it *in* the doing, but only after you could do it again.
  *   **Why:** Look at the first part of the principle: *Reliability.* If you run one perfect bead and then burn through the next ten, you didn't know how on the first one. You got lucky or you followed instructions perfectly. "Knowing how" requires the ability to repeat the steering.
  *   **The Nuance:** Did you know how *after* that first bead? Only if you understood *why* it worked. If you can look at that first good bead, see what you did right, and force the second bead to match it, then the "knowing" clicked the moment you started the second one. The first bead was the test; the second bead proved you passed.

  ### My Position and Confidence
  I am highly confident in this principle because it matches how trade skills actually work. In welding, driving, or sports, the world fights you. Metal warps, wind blows, engines stall. A pile of facts (Knowing That) cannot fight back. Only a feedback loop (Knowing How) can fight back.

  **The one thing that would change my mind:**
  If you found a student who could weld perfectly without a jig, in the wind, but literally could not fix a single error if it happened—meaning, if the arc length got too long, they could not shorten it, but somehow the weld was still perfect every time. That would suggest "Knowing How" is just magic luck. But that doesn't exist. In the real world, perfection requires correction.

  **Summary for your shop:**
  Tell your brother-in-law this: Facts are a map. Skill is the ability to drive when the road is washed out. You can memorize the map (Knowing That), but if you can't turn the wheel when a tree falls across the lane, you don't know how to drive. The checklist guy has a map and a clear road. The uncle has no map and a mountain pass. The uncle is the one who knows how.
