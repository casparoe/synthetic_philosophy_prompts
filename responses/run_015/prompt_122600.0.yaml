      *(Self-Correction on the Principle)*: "Monitor and correct" is good. Let's make it: **"You know how to do something when you are the one fixing it while it's going wrong."**
      *   Uncle: Fixes the stall before it happens.
      *   Checklist: Stops when it goes wrong. (Doesn't fix).
      *   Jig: Jig prevents it from going wrong. (Student doesn't fix).
      *   Tennis: Thinking stops the fixing mechanism.
      *   Coach: Fixes the kid.

      *Wait, one nuance:* The user says the Checklist Guy *does* know how, just a thinner version. My principle might rule him out completely. I need to accommodate the "thinner version."
      *   *Idea:* Graded Skill.
      *   *Principle:* **"Knowing How is measured by how much surprise you can handle without stopping."**
      *   Uncle: High surprise (engine changes).
      *   Checklist: Zero surprise (stops if gap exists).
      *   Jig: Zero surprise (tool handles it).
      *   This captures the "thinner" aspect perfectly. The more surprise you can absorb and correct, the more you "know how."

      *Let's go with the "Correction" angle but acknowledge the degrees.*
      *   **Principle:** **Knowing How is the ability to notice when things are going off-track and steer them back without outside help.**
      *   This allows degrees. Checklist guy notices (stops), but can't steer back. Jig guy doesn't even notice (tool hides it).
      *   Actually, the "Steering" metaphor is best.

      *Final Plan:*
