  # The Dirty Hands Decision Tree

  **Start:** You have read **Case A** (the ticking bomb interrogation) and agreed that *there was nothing else the leader could have done*.

  **Node 1 (Distinction 2):** In Case A, is the act she performed morally wrong?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 6.

  **Node 2 (Distinction 5):** In **Case E** (same act, motive is saving administration), does the agent's motive change the moral kind of the act?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 4.

  **Node 3 (Distinction 1):** In Case A, is the conflicting demand coming from conscience or the job?
  *   **Conscience:** **Leaf 1: Tragic Pluralism.** *Commitment: Morality is internally conflicted and demands guilt for doing the right thing.*
  *   **The Job:** **Leaf 2: Unnamed (Role-Conditional Integrity).** *Commitment: Office duties cannot override personal morality unless motives are pure.*

  **Node 4 (Distinction 6):** In **Case B** (civil servant signing deadly scheme), must the agent resign to keep hands clean?
  *   **Yes:** **Leaf 3: Absolutism.** *Commitment: One must never be the instrument of injustice, even to prevent worse injustice.*
  *   **No:** Go to Node 5.

  **Node 5 (Distinction 4):** In **Case C** (committee voting for drownings), does the wrongness stick to the individual voter?
  *   **Yes:** **Leaf 4: Faithfulness.** *Commitment: The agent must remain faithful to the prohibition even while violating it.*
  *   **No:** Go to Node 9.

  **Node 9 (Distinction 4):** In Case C, can the wrongness be passed to a contractor?
  *   **Yes:** **Leaf 5: Unnamed (Dissipated Responsibility).** *Commitment: Responsibility dissipates when distributed.*
  *   **No:** **Leaf 6: Institutional Guilt.** *Commitment: The office bears the stain so the individual does not.*

  **Node 6 (Distinction 1):** In Case A, is the permission to act from general morality or state necessity?
  *   **General Morality:** Go to Node 7.
  *   **State Necessity:** Go to Node 8.

  **Node 7 (Distinction 2):** In Case A, does necessity override the rule or redefine the act?
  *   **Override:** **Leaf 7: Monist Consequentialism.** *Commitment: The right act is determined solely by the outcome.*
  *   **Redefine:** **Leaf 8: Act Not Really Wrong.** *Commitment: Properly described, necessary violations are not violations.*

  **Node 8 (Distinction 3):** In **Case D** (open legislation violating rights), must the measure be concealed to count as necessary?
  *   **Yes:** **Leaf 9: Classic Dirty Hands.** *Commitment: Public justification is impossible for necessary evils.*
  *   **No:** **Leaf 10: Public State Necessity.** *Commitment: The state's morality is public and distinct from private ethics.*

  ***

  ### Post-Tree Analysis

  **1. The Unoccupied Combination**
  The tree makes available a combination that appears unoccupied in the literature: **Node 1 (No/Act Not Wrong) + Node 6 (State Necessity) + Node 8 (Yes/Secrecy Required).** This position holds that the act is not morally wrong because it is authorized by state necessity, yet it must still be concealed from the public. This is likely **unattractive** rather than incoherent: if the act is not wrong under the description of state necessity, there is no obvious moral reason to hide it, unless one assumes the public is incapable of understanding state morality (a paternalism most theorists reject in favor of either full publicity or full admission of guilt).

  **2. Indistinguishable Leaves**
  The tree cannot fully separate **Leaf 1 (Tragic Pluralism)** and **Leaf 4 (Faithfulness)**. Both result in an agent who does what is necessary but retains a stain or guilt. The tree groups them based on whether motive matters (Node 2), but both leaves commit the agent to personal guilt. To separate them, one would need to ask: *Is the guilt a residue to be cleansed, or a permanent marker of integrity?* Tragic Pluralism often seeks cleansing (remainder), while Faithfulness views the guilt as constitutive of the agent's moral identity.

  **3. Load-Bearing Distinctions**
  The two load-bearing distinctions are **Node 1 (Ought vs. Wrong)** and **Node 6 (General Morality vs. State Necessity)**. Flipping Node 1 moves the student from the entire "Dirty Hands" problem (where wrongness is retained) to the "Justification" problem (where wrongness is dissolved). Flipping Node 6 moves the student from universal ethics (where the state is judged by common rules) to political particularism (where the state operates under a distinct code). This suggests the real disagreement in political ethics lies not in specific cases, but in whether the state is *inside* morality or *alongside* it, and whether necessity *excuses* a wrong or *erases* it.
