answer: |-
  # Specification: Auditing Rule for Treatment Effect Reversals

  ## 1. Conceptual Validation: "Paper" vs. "Live" Reversals
  Your distinction is functionally useful but technically imprecise. It slices across the cases mostly correctly, but it conflates **mathematical artifacts** with **specification errors**.

  *   **Paper Reversals:** You define these as dissolving when the causal question is explicit. This covers the Odds Ratio vs. Risk Difference case (non-collapsibility) and the "different questions" case. However, it also risks burying **selection bias** (conditioning on a collider) as just a "question" issue. It is better to label these **Artifacts of Metric or Aggregation**. They don't require new data; they require correct math.
  *   **Live Reversals:** You define these as changing the action. This covers true confounding and transportability. However, a reversal driven by a four-patient band is "Live" in your definition (it changes the number) but should be treated as noise. It is better to label these **Biases Requiring Adjustment**.

  **Recommendation:** Keep your binary for the checklist (it forces a decision), but define "Paper" as *resolvable by re-specifying the metric or population without new data* and "Live" as *resolvable only by changing the adjustment set or data source*.

  ## 2. The Requirements Specification
  The following requirements define the logic the data steward must apply. Each requirement maps to one of your eight mandatory cases.

  | ID | Requirement | Status | Case Addressed | Rationale / Consideration |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Causal Precedence:** The rule must forbid adjusting for any variable known to be caused by the treatment (mediator) or by the outcome (collider), even if measured pre-decision. | **Non-Negotiable** | #2 (Post-treatment stratifier) | Adjusting for a complication caused by the treatment induces bias. The table cannot show directionality; this requires external causal knowledge. |
  | **R2** | **Metric Specification:** The rule must explicitly state whether the effect measure is Risk Difference (RD) or Odds Ratio (OR). If OR is used, a reversal in OR but not RD must be flagged as non-collapsibility. | **Non-Negotiable** | #4 (OR vs. RD reversal) | ORs are mathematically non-collapsible. A reversal here is often a mathematical artifact, not a causal one. RD is collapsible and preferred for decision-making. |
  | **R3** | **Decision-Time Information:** The adjustment set must only include variables known *at the moment the decision is made*. If severity is unknown at triage, the aggregate number is the action number. | **Non-Negotiable** | #7 (Aggregate vs. Stratified questions) | A stratified number is useless if the decision-maker cannot identify the stratum. This prioritizes utility over causal purity. |
  | **R4** | **Sample Stability:** The rule must suppress or flag any stratified estimate where a single stratum contains fewer than 20 events (or a pre-set threshold). | **Non-Negotiable** | #6 (Small band reversal) | Reversals driven by tiny cells are statistical noise, not signal. Acting on them is unsafe. |
  | **R5** | **Continuous Handling:** The rule must not rely on arbitrary cut-points for continuous scores. If binning changes the conclusion, the rule must default to the continuous model. | **Preference** | #5 (Cut-point dependency) | Binning throws away information and creates artificial reversals. However, linear models are harder to audit; this is a methodological preference. |
  | **R6** | **Transportability:** If the hospital's case-mix differs from the data source by >10% on key severity markers, the rule must require re-weighting the aggregate. | **Preference** | #8 (Hospital mix differs) | This is your side's prejudice (rightly). Many auditors ignore external validity. This forces the "target population" question. |
  | **R7** | **Measurement Error:** If the stratifier is a noisy proxy for the true confounder, the rule must acknowledge that adjustment will be partial and bias may remain. | **Preference** | #3 (Noisy stand-in) | Perfect adjustment is impossible with error. This prevents over-confidence in the stratified number. |
  | **R8** | **Confounding Control:** The rule must adjust for all common causes of treatment and outcome available at decision time. | **Non-Negotiable** | #1 (Standard Simpson's) | Failure to adjust for confounders yields biased causal estimates. This is the baseline for validity. |

  ## 3. Conflict & Impossibility Analysis
  You correctly suspected that certain requirements cannot be jointly satisfied.

  1.  **"Table-Only" vs. "Causal Precedence" (R1):**
      *   **Conflict:** You cannot distinguish a confounder from a mediator using only the table.
      *   **Resolution:** The spec explicitly requires a "rough causal story." Any rule claiming to work from the table alone is invalid.
  2.  **"Binning Invariance" (R5) vs. "Interpretability":**
      *   **Conflict:** Using the full continuous score (R5) prevents artificial reversals but makes the output harder for clinicians to use than simple bands.
      *   **Resolution:** R5 is marked *Preference*. If the hospital demands bands for operational reasons, you must accept the risk of cut-point sensitivity.
  3.  **"Causal Truth" (R8) vs. "Decision Information" (R3):**
      *   **Conflict:** The true causal effect (R8) might require adjusting for a severity score that isn't known until *after* the decision point (e.g., lab results come back later).
      *   **Resolution:** R3 overrides R8. For *action*, you must use the number valid at the time of choice, even if it is causally confounded. This is the "Second Best" solution.

  **The Heuristic Killer:**
  **Requirement R3 (Decision-Time Information)** knocks out the most popular heuristics.
  *   It kills **"Always Adjust"**: You cannot adjust for severity if you don't know it yet.
  *   It kills **"Always Trust Aggregate"**: If you *do* know the severity at decision time, the aggregate is misleading.
  *   It forces the steward to stop doing statistics in a vacuum and start modeling the workflow.

  ## 4. Scoring Candidate Rules
  Here is how four common approaches score against the specification.

  | Candidate Rule | R1 (Causal) | R2 (Metric) | R3 (Decision Info) | R4 (Stability) | R8 (Confounding) | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **1. Report Both & Move On** | ❌ | ✅ | ❌ | ❌ | ❌ | **Fail.** Avoids the "one sentence" mandate. Leaves the decision unresolved. |
  | **2. Adjust for All Pre-Treatment** | ❌ | ❌ | ❌ | ❌ | ✅ | **Fail.** Violates R1 (adjusts for colliders/instruments) and R3 (adjusts for unavailable info). |
  | **3. Adjust for Confounding Routes (DAG)** | ✅ | ❌ | ❌ | ❌ | ✅ | **Partial.** Scientifically valid for *explanation*, but fails R3 (Decision Info). May recommend a number the doctor can't use. |
  | **4. Decision Problem (Expected Utility)** | ✅ | ✅ | ✅ | ✅ | ✅ | **Pass.** Explicitly models what is known at decision time. Highest burden, but only one that meets all Non-Negotiables. |

  **Recommendation:** Adopt Candidate 4, but simplify the output. The steward does not need to run a full utility model, but must answer: *"Given what we know at triage, which number predicts the outcome for this patient?"* If severity is unknown, that is the aggregate. If known, it is the stratified. If the stratifier is a mediator, it is the aggregate.
