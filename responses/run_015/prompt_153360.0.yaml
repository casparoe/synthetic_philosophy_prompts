answer: |-
  Here is the signal chain analysis of direct democracy, translated into your domain.

  ### The Signal Chain: Direct Democracy as A/D Conversion

  **The Source Signal:** "Popular Will." In this metaphor, this is the continuous analog waveform entering the system. It is theoretically infinite in resolution and bandwidth.
  **The ADC:** The Electorate.
  **The Bit Depth:** The Ballot Structure (usually 1-bit: Yes/No).
  **The Sampling Rate:** Frequency of elections/initiatives.
  **The Noise Floor:** Misinformation, campaign spending, emotional reactivity, media distortion.

  ---

  ### Side A: The High-Fidelity Advocates (Pro-Direct Democracy)
  **Argument:** The system achieves accurate reconstruction through oversampling and dithering.

  They argue that while individual voters are noisy transducers with poor transient response (low information), the aggregate array functions as a **noise-shaping DAC**. By oversampling the population (millions of voters), random errors cancel out via the Law of Large Numbers. The "noise" of individual ignorance is dithered; it becomes white noise that sits below the audible threshold of the final policy output.

  Regarding the **Swiss Double Majority**: They view this as a **multi-band compressor**. It prevents the "low frequencies" (populous urban centers) from clipping the master bus and drowning out the "high frequencies" (rural cantons). It ensures headroom across the entire spectral landscape of the country, preventing distortion in specific regions even if the overall gain (popular vote) is high.

  They claim the **Sampling Rate** (frequency of votes) is sufficient to track the envelope of public sentiment without aliasing. If the signal changes slowly (cultural values), a low sample rate works. If it changes fast (economic crisis), you need more frequent initiatives. They argue the output is a high-SNR representation of the input signal.

  ### Side B: The Signal Integrity Critics (Skeptic/Representative Advocates)
  **Argument:** The system introduces catastrophic aliasing and quantization error.

  They argue that policy complexity exceeds the **Nyquist frequency** of the voter. A tax bond or a trade deal contains high-frequency information (nuance, edge cases, long-term feedback loops). A Yes/No ballot is **1-bit quantization**. You are forcing a 24-bit dynamic range signal into a binary stream. The result isn't just low resolution; it's **quantization distortion**. The harmonic content of the policy is lost, leaving only the fundamental square wave.

  Regarding **California Props**: This is **intermodulation distortion**. Bundling sentencing rules with tax bonds creates sum and difference frequencies that weren't in the original source. Voters aren't sampling the policy; they are sampling the *marketing wrapper* (the noise floor). If the campaign spending (gain) is high enough, it overdrives the preamp, and the voter ADC clips.

  Regarding **Brexit**: This was a signal hovering **0.1dB above the noise floor**. Treating a 51.9% result as a full-scale digital mandate is like claiming you've captured a perfect transient when your peak meter is barely flickering in the red. It's false precision. The "mandate" is a digital artifact, not an analog reality. They argue representatives act as a **steep low-pass filter**, removing the high-frequency noise of immediate public reaction before it hits the mixing console of legislation.

  ---

  ### Residue Report

  Here is where the metaphor holds, where it distorts, and where it cuts out completely.

  #### 1. Clean Translations (High Fidelity)
  *   **Quantization Error:** The Yes/No binary is a perfect analog for 1-bit conversion. Complex legislation *does* lose dynamic range when reduced to a ballot question.
  *   **Noise Floor:** The impact of misinformation and media saturation maps cleanly to signal-to-noise ratio. If the noise floor rises (fake news), the usable dynamic range of the voter's decision shrinks.
  *   **Aliasing:** When voters apply heuristics (shortcuts) to complex problems, they are effectively folding high-frequency complexity down into lower frequencies they can understand, creating artifacts that sound like the truth but aren't.

  #### 2. Distorted Translations (Phase Issues)
  *   **The Source Signal:** In audio, the source exists before you record it. In democracy, "Popular Will" is often **generated by the measurement**. The act of asking the question changes the signal (Observer Effect). A poll or ballot doesn't just sample the will; it synthesizes it. In audio terms, it's like the microphone creates the sound wave by being placed in the room.
  *   **Latency:** Audio processing strives for zero latency. Democracy relies on massive latency (years for implementation). The feedback loop is too slow to correct phase cancellation in real-time. By the time you hear the playback, the room acoustics have changed.

  #### 3. Zero Analog (Digital Silence)
  *   **Normative Gain (Legitimacy):** This is the big one. In audio, a signal is "good" if it is accurate to the source. In politics, a decision is "valid" if the process was authorized, regardless of accuracy. A vote has *authority* even if it has high distortion. There is no audio equivalent for "rightful ownership of the noise."
  *   **Coercion/Enforcement:** A bad mix doesn't arrest you. The output of the democratic chain is backed by physical force (the state). Signal processing has no kinetic output.
  *   **The "Right" to Noise:** Democratic theory argues people have a right to make mistakes (to generate distortion) in their own governance. In engineering, distortion is always a failure. In politics, it can be a feature (agency).

  ---

  ### The Verdict on the Residue

  You asked if the leftover stuff means democratic theory is tracking something real your framework can't capture, or if it's conceptual fuzz your vocabulary exposes as noise.

  **It is tracking something real.**

  Your framework assumes there is a "True Signal" (Optimal Policy/Popular Will) that we are trying to capture with maximum fidelity. This is the **Correspondence Theory** of truth.

  However, the residue (Legitimacy, Agency, Synthesis) points to a **Constructivist** reality. In direct democracy, the "signal" does not exist prior to the conversion. The voting process *is* the oscillator.

  If you treat democracy as a measurement system, it fails. The SNR is too low, the bit depth is too shallow, and the aliasing is rampant. But if you treat democracy as a **synthesizer**, the distortion *is* the sound. The "noise" of public debate and the "quantization" of voting are not errors in transmission; they are the mechanism of generation.

  **The Conclusion:**
  Your vocabulary correctly exposes that direct democracy is a **lossy compression algorithm**. The Skeptics are right about the fidelity: you are losing data. But the Advocates are right about the utility: sometimes you need a lossy format (MP3) to get the file to play on everyone's hardware (social cohesion).

  The "mandate" isn't a high-res recording. It's a master file that everyone agreed to stop tweaking, even if it clips. The danger isn't quantization error; it's forgetting that you're working with digital audio and trying to treat it like analog tape. When you treat a 1-bit ballot stream as a continuous analog waveform (Brexit), you blow the speakers.
