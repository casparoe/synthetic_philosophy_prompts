  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Interpretative Disputes regarding Rousseau's *Letter to d'Alembert on the Theatre*

  **1. Agreed Claims**
  We, the undersigned, agree upon the following foundational premises regarding Rousseau's text and political philosophy:

  1.  **Foundational Opposition:** Rousseau's objection to the Geneva playhouse is not merely prudential (concerning cost or logistics) but principled; he believes theatre is incompatible with a healthy republic.
  2.  **Structure of Spectacle:** We agree that Rousseau defines theatre fundamentally as a relation of representation, creating a structural division between those who act and those who watch.
  3.  **Political Aim:** Rousseau's broader political project prioritises active citizenship, transparency, and the cultivation of virtue over private enjoyment or commercial interest.
  4.  **Social Bond:** Both interpretations acknowledge that Rousseau believes theatre fundamentally alters the spectator's relationship to the community, though we disagree on the primary mechanism of this alteration.

  **2. Disagreements Table**
  Whilst we agree on the premises above, we diverge on the primary locus of Rousseau's critique. The following table outlines our respective positions, the cruxes of our disagreement, and the specific tests we propose to resolve them.

