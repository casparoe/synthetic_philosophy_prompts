answer: |-
  You are asking for the "steel-man" objections: the ones that survive the standard "it's a limit case" defense and strike at the conceptual core of Solomonoff Induction (SI). Even among committed algorithmic information theorists (AIT), there is a hierarchy of concessions. Some are treated as technical features, others as philosophical burdens, and a few as existential threats.

  Here is the ranking of defeaters from **Fatal** (undermines the core claim of SI as *the* unique theory of inference) to **Just Awkward** (technical inconveniences), along with what a defender (like Hutter, Legg, or Rathmanner) would concede.

  ---

  ### 1. The Reference Machine Problem (Non-Invariance)
  **Rank:** **Fatal to Objectivity** (Philosophically Fatal)
  **Defender Concession:** **Full Ownership, Minimalized Impact**

  This is the deepest hole in the foundation. You noted the Invariance Theorem: $K_U(x) \le K_{U'}(x) + c$. Defenders wave this away by saying $c$ is a constant and vanishes asymptotically. **The objection is that for any finite amount of data—which is all we ever have—the constant $c$ dominates.**

  The choice of Universal Turing Machine (UTM) is effectively a choice of prior over priors. There is no "neutral" UTM. One UTM might assign high probability to "Grue" predicates, another to "Green." Since SI claims to formalize *objective* Occam's Razor, the fact that "simplicity" is relative to the encoding language means SI does not solve the problem of induction; it relocates it to "Which UTM is the true one?"

  *   **Why it bites:** It destroys the claim that there is a *unique* universal prior. There is only a family of priors parameterized by the choice of UTM.
  *   **Defender's Stance:** They concede the dependence entirely (it is a theorem, after all). However, they argue that for any "reasonable" UTM, the constant is small, and that intelligent agents can *learn* the structure of the environment to effectively switch to a better UTM over time. They treat it as a boundary condition rather than a bug.

  ### 2. The Computable Environment Assumption
  **Rank:** **Fatal to Validity** (Ontologically Fatal)
  **Defender Concession:** **Full Ownership, Treated as a Premise**

  The convergence guarantees of SI (that the predicted distribution converges to the true distribution) hold **if and only if** the true data-generating process is computable (specifically, lower semicomputable). If the universe involves true non-computable randomness, hypercomputation, or continuous physics that cannot be digitized without loss, SI is not optimal and may fail to converge.

  *   **Why it bites:** It limits the domain of SI to a specific class of universes. If our universe is not computable, SI is not the "theory of everything" for inference; it is merely a theory of inference for *digital* universes.
  *   **Defender's Stance:** Defenders (particularly in the AIXI tradition) explicitly own this. They generally subscribe to the **Physical Church-Turing Thesis**, betting that any observable physical process is computable. They argue that even if the underlying reality is uncomputable, any *observer* embedded within it can only process computable sequences, so SI remains optimal *for the observer*. They treat this not as a weakness, but as a definition of "predictable."

  ### 3. The Semantic Gap (KC vs. Scientific Simplicity)
  **Rank:** **Awkward / Interpretive**
  **Defender Concession:** **Partial Ownership, Active Research Area**

  You asked if Kolmogorov "simple" is orthogonal to scientific "simple." A scientist means "simple" in terms of symmetry, invariant laws, or conceptual elegance. KC means "shortest bit-string on a UTM." These can come apart. A physical law might be conceptually elegant but require a verbose encoding on a specific UTM (e.g., if the UTM's native logic doesn't match the physics). This is the "Natural UTM" problem.

  *   **Why it bites:** If KC simplicity doesn't align with the kinds of regularities scientists actually find (e.g., conservation laws, symmetries), then SI formalizes *compression*, not *scientific induction*. It risks being a theory of data fitting rather than law discovery.
  *   **Defender's Stance:** They acknowledge the gap. This has spawned the sub-field of **Naturalized Induction**. Defenders argue that a "natural" UTM is one that reflects the causal structure of the agent's interaction with the world. They concede that we don't yet have a formal way to select the "Natural UTM" without circularity, but they maintain that as the agent learns, its internal model converges toward a UTM that reflects the environment's structure, closing the gap asymptotically.

  ### 4. The Semimeasure Problem
  **Rank:** **Just Awkward** (Technical)
  **Defender Concession:** **Full Ownership, Mathematically Solved**

  The universal prior $M$ is a semimeasure ($\sum M(x) \le 1$) because some programs never halt. This complicates Bayesian updating, as probabilities don't sum to 1, and standard probability axioms don't apply directly without normalization.

  *   **Why it bites:** It makes the math messier and requires care when defining conditional probabilities. It reflects the uncertainty about whether the "truth" is even computable/halting.
  *   **Defender's Stance:** They own this completely. It is a feature, not a bug. It accurately reflects the risk that the environment might stop producing data or that the generating program might run forever. Defenders have developed rigorous methods to handle semimeasures (e.g., normalization techniques, though normalization itself can introduce uncomputability). In the hierarchy of problems, this is considered "solved" or at least "managed."

  ---

  ### Summary of the "Committed Defender" Position

  If you corner a serious AIT researcher, here is the map of their concessions:

  1.  **Semimeasure:** "Yes, it's a semimeasure. We know how to handle that. Not a problem."
  2.  **Computability:** "Yes, it assumes a computable universe. We believe the universe is effectively computable. If it's not, no inference method works anyway."
  3.  **Semantic Gap:** "Yes, bit-length isn't exactly physical elegance. But we think they converge as the agent learns the structure of the world. This is an open research problem."
  4.  **UTM Dependence:** "Yes, there is an additive constant. It's unavoidable. But it's $O(1)$, so for long sequences, it doesn't matter. For short sequences, all induction is subjective anyway."

  **The Verdict:**
  The **Reference Machine Problem (#1)** is the only one that truly threatens the claim that SI is *the* objective formalization of Occam's Razor. It implies that "Simplicity" is not a property of the world, but a relationship between the world and a specific encoding language. The defenders concede this but argue that the "cost" of this subjectivity is bounded and negligible in the limit.

  If you want to attack SI where it hurts most, do not attack the uncomputability or the semimeasure. Attack the **arbitrariness of the UTM**. That is the point where the mathematical elegance meets the philosophical brute fact that there is no "God's Turing Machine."
