answer: |-
  This is a sophisticated diagnosis of a classic philosophical stalemate. You have correctly identified that the debate over the heterogeneity of pleasure is one of the few places in analytic philosophy where the dialectic has genuinely calcified.

  To answer your questions directly: The disagreement is **not merely verbal**, nor is it purely **empirical**. It is a **category dispute disguised as a phenomenological report**. Progress has actually occurred, but not in the way the original combatants expected; it occurred by changing the subject from *sensory* hedonism to *attitudinal* hedonism.

  Here is a breakdown of why the stalemate persists, what kind of disagreement it actually is, and where the actual progress lies.

  ### 1. What Kind of Disagreement Is This?

  Your working theory (that it is verbal ambiguity) is half-right, but it underestimates the theoretical commitment on both sides.

  **It is not purely verbal.**
  If it were merely a semantic confusion (e.g., "pleasant" meaning *good* vs. *tingly*), we could stipulate definitions and move on. We could say, "Let's call the felt quality 'Q' and the appraisal 'A'." But the hedonist needs *Q* to do ethical work. If 'pleasant' just means 'good for the subject' (appraisal), then Hedonism collapses into a tautology ("The good life is the life that is good for the subject"). To avoid tautology, the hedonist needs a naturalistic property to ground the value. Therefore, the felt-quality theorist *cannot* retreat to semantics without abandoning the theory.

  **It is not purely empirical.**
  You ask if this is a question of "how fine-grained introspection is." In principle, yes. But introspection is **theory-laden**.
  *   **The Rylean:** When they introspect, they look for a "glow" or a "tingle." They don't find one attached to the proof or the water. They conclude it doesn't exist.
  *   **The Felt-Quality Theorist:** When they introspect, they attend to the *way* the experience is given. They claim the "glow" is not a separate sensation (like a cherry on top) but a **mode of consciousness** (a "hedonic tone" coloring the content).
  Because one side is looking for a *content* and the other is describing a *mode*, they talk past each other. It is a "bedrock" disagreement only in the sense that it relies on pre-theoretical intuitions about what counts as an "object" of awareness.

  **The Verdict:** It is a **Conceptual/Phenomenological Category Mistake.**
  The Rylean side argues that "pleasure" is a **dispositional or functional concept** (like "digestion" or "success"). The Felt-Quality side argues it is a **qualitative concept** (like "redness" or "pain"). You cannot resolve this by looking harder; you have to decide which category best explains the role pleasure plays in our psychology and ethics.

  ### 2. Why the Stalemate Persists (The "Moore's Thumb" Problem)

  The reason nobody switches sides is that both sides are protecting a different intuition that feels undeniable to them.

  *   **The Intuition of Homogeneity:** Ethically, we treat these diverse states as commensurable. We trade off a headache relief for a good meal. This suggests a common currency. If there is a common currency, there must be a common property. (This drives the Felt-Quality theorist).
  *   **The Intuition of Heterogeneity:** Phenomenologically, the taste of water and the satisfaction of a proof share no sensory overlap. To insist they do feels like hallucinating a "queer" property (to use Mackie's term) just to save the theory. (This drives the Rylean).

  The stalemate persists because **introspection is not a neutral arbiter.** As Wittgenstein argued regarding private language, you cannot check your internal state against a public standard. If you believe in hedonic tone, you will find a "pro-attitude" that feels like a tone. If you don't, you will find only the activity.

  ### 3. What Would Progress Look Like?

  Progress has actually happened, but it required abandoning the premise that started the fight.

  **A. The Shift to Attitudinal Hedonism (The Reformulation)**
  The most significant progress was Fred Feldman's move to **Attitudinal Hedonism**.
  *   **The Move:** Feldman conceded the heterogeneity objection against *Sensory* Hedonism. He agreed there is no common *feeling*.
  *   **The Solution:** He argued pleasure is not a feeling but a **propositional attitude** (taking joy *that* p). You can take the same attitude (being pleased) toward vastly different propositions (that I am drinking water, that I solved the proof).
  *   **Result:** This bypasses the heterogeneity problem. The common property is not a *quale*; it is the *functional role* of the attitude.
  *   **Why it hasn't ended the debate:** Critics argue this severs the link to *phenomenology*. If I can be "pleased that p" without feeling good (e.g., masochistic duty), is it really pleasure? This brings us back to the start, but at a higher level of abstraction.

  **B. The Neuroscience of 'Liking' (The Empirical Test)**
  You asked if this could be tested. Affective neuroscience (e.g., Kent Berridge) distinguishes **'liking'** (hedonic impact) from **'wanting'** (incentive salience).
  *   **Finding:** There *are* specific neural hotspots (opioid/endocannabinoid systems in the nucleus accumbens) that generate "liking" reactions (facial expressions in infants/rats) across different stimuli (sweet taste, warmth, social touch).
  *   **Implication:** This supports the Felt-Quality theorist *biologically*. There is a shared neural substrate for "hedonic impact."
  *   **Limitation:** This solves the empirical question but not the philosophical one. Does "neural liking" map to the "good" in ethical hedonism? Many philosophers say no. A drug might trigger "liking" circuits without contributing to well-being (the Experience Machine objection).

  **C. The Wittgensteinian Dissolution (The Distinction)**
  The most honest progress is admitting the question is malformed.
  *   **The Distinction:** We should distinguish **Pleasure-as-Sensation** (which likely doesn't exist as a unitary thing) from **Pleasure-as-Value** (which is a judgment).
  *   **Progress:** Acknowledging that "pleasure" is a **family resemblance concept** (Wittgenstein). There is no one thread running through the water, the proof, and the party. There are overlapping similarities. Hedonism fails because it demands a strict univocal property where none exists.

  ### 4. Honest Assessment: Should We Expect Progress?

  **No, not on the original terms.**

  If the question is *"Is there a single, introspectively detectable, phenomenal quality present in all pleasurable experiences?"*, the answer is likely **no**, and the debate is dead.
  *   **Sensory Hedonism is largely a zombie position.** Very few contemporary professional philosophers defend the idea that there is a specific "hedonic tone" sensation. The heterogeneity objection effectively killed classical Benthamite/Sidgwickian sensory hedonism.

  **However, the debate lives on in two transformed ways:**

  1.  **The Phenomenology of Valence:** In philosophy of mind, the debate continues as the problem of **emotional valence**. Is "positive valence" a primitive feature of consciousness? Some (e.g., Uriah Kriegel) argue yes, it is a pervasive background tone. Others argue it is representational. This is the same debate, relocated to philosophy of mind.
  2.  **The Normative Question:** The real fight is no longer "Is there a feeling?" but "Does well-being require a feeling?"
      *   If you are an **Attitudinal Hedonist**, you say no.
      *   If you are an **Objective List Theorist**, you say pleasure is only good if it is worthy pleasure (Mill's distinction).

  ### Summary for Your Theory

  Your theory that it is verbal is the closest to the truth, but it needs a tweak: It is not that the word 'pleasant' is ambiguous; it is that the **concept of pleasure is a hybrid**.
  *   It functions as a **descriptor** (phenomenology).
  *   It functions as an **evaluator** (appraisal).

  The Felt-Quality theorists are trying to make the *evaluator* do the work of the *descriptor*. The Ryleans are trying to reduce the *descriptor* to the *evaluator*.

  **Progress looks like this:** Stop asking if there is a common *stuff*. Start asking if there is a common *function*. If you define hedonism as "the maximization of positive valence states," you can accept heterogeneity of feeling while maintaining homogeneity of function (e.g., reinforcement learning signals).

  If you are looking for a resolution where one side admits defeat on the introspective question: **The Ryleans won decades ago.** The field moved to Attitudinal Hedonism precisely because the Felt-Quality view could not survive the heterogeneity objection. The only reason it feels like a stalemate is that introductory ethics textbooks still present "Hedonism" as the sensory view, keeping the zombie argument alive for new students.
