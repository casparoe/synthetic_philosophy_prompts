  # Joint Statement of Adversarial Collaboration: The "White Horse" Dialogue
  **Parties:** The Sortal-Logic Camp (Camp A) & The Pragmatic-Administrative Camp (Camp B)
  **Subject:** Gongsun Long's *Bai Ma Fei Ma* ("White Horse Is Not Horse")

  ## 1. Shared Commitments
  Both camps agree on the following textual and structural claims, which form the basis of our collaboration:

  *   **Textual Structure:** The dialogue proceeds via a specific dialectical method: an initial paradoxical thesis ("White Horse is not Horse"), followed by objections based on common usage, and resolved through distinctions between the *name* (ming) of the shape, the *name* of the color, and the *compound name* of the colored shape.
  *   **The Target:** Gongsun Long is explicitly targeting the conflation of simple names with compound names. Both camps agree he argues that the *reference* or *satisfaction condition* of "White Horse" is distinct from that of "Horse."
  *   **Formal Steps:** Both camps accept that the argument relies on three moves:
      1.  **Separation:** "Horse" names the form/shape; "White" names the color.
      2.  **Composition:** "White Horse" names the conjunction of form and color.
      3.  **Non-Identity:** Since the naming condition for the compound includes a constraint (color) absent in the simple term, the compound term cannot be identical to the simple term.
  *   **Non-Triviality:** Both camps agree the argument is not merely a linguistic trick but is intended to reveal a structural feature of how classification works, whether that structure is logical or social.

  ## 2. Divergent Theses
  While we agree on the *steps* of the argument, we disagree on the *point* of the argument. We refuse to water down this disagreement.

  *   **Camp A (Sortal-Logic) Thesis:** The dialogue is a treatise on **semantic reference and identity**. Gongsun Long is demonstrating that compound terms create a new intension that alters the extension. The claim "White Horse is not Horse" is a claim about **term identity**: the concept <White Horse> is not identical to the concept <Horse>. The goal is to establish a formal semantics where modifiers restrict reference classes.
  *   **Camp B (Pragmatic-Administrative) Thesis:** The dialogue is a treatise on **classification and compliance**. Gongsun Long is demonstrating that adding a descriptor changes the **conditions of satisfaction** for a command or decree. The claim "White Horse is not Horse" is a claim about **functional equivalence**: in a context where color matters (e.g., a specific requisition), a white horse does not satisfy the requirement for a generic horse, and vice versa. The goal is to align names with realities (*ming-shi*) to prevent bureaucratic error.

  ## 3. The Cruxes
  We identify three specific philosophical pivot points where our interpretations diverge.

  ### Crux 1: The Ontological Status of the Modifier
  *   **The Issue:** Does "White" function as an accidental property that restricts a set, or as a feature that alters the kind of thing being identified?
  *   **Camp A Position:** "White" is a **restrictive modifier**. It functions like a logical conjunction ($Horse \land White$). It creates a subset. The sortal "Horse" remains intact but is narrowed.
  *   **Camp B Position:** "White" is a **discriminatory marker**. In Warring States identification practice, adding a color changes the *type of identification* required. It is not just a subset; it is a different *ticket for entry* in a administrative system.
  *   **Exact Disagreement:** Camp A holds the change is **extensional** (fewer objects fit the description). Camp B holds the change is **procedural** (different rules apply for verifying the object).

  ### Crux 2: The Evaluative Framework
  *   **The Issue:** Should the argument be evaluated using modern extension-set theory or through Warring States identification practice?
  *   **Camp A Position:** The argument is best formalized using **set theory**. "Horse" = Set $H$. "White Horse" = Set $W \cap H$. Since $(W \cap H) \neq H$, the identity statement fails. This makes the argument timeless and trans-cultural.
  *   **Camp B Position:** The argument is best formalized using **speech-act theory within a hierarchy**. "Horse" = a clearance level. "White Horse" = a specific authorization code. The inequality arises because the *authority* required to accept the object differs. This makes the argument historically situated.
  *   **Exact Disagreement:** Camp A predicts the logic holds in **any possible world** where terms have extensions. Camp B predicts the logic holds only in **normative contexts** where names govern action.

  ### Crux 3: Property Inheritance (Adverbial vs. Adjectival)
  *   **The Issue:** Is there a hidden premise about property inheritance that resembles modern debates on adverbial vs. adjectival modification?
  *   **Camp A Position:** The argument assumes **non-inheritance of identity**. Just because $x$ is a $P$ and $x$ is a $Q$, it does not follow that $PQ$ is identical to $P$. This is a formal rule about compound predicates.
  *   **Camp B Position:** The argument assumes **contextual salience**. Inheritance fails only when the modifier is **relevant to the transaction**. If the transaction ignores color, inheritance holds. If the transaction requires color, inheritance fails.
  *   **Exact Disagreement:** Camp A sees the failure of inheritance as **semantic and necessary**. Camp B sees the failure of inheritance as **pragmatic and contingent**.

  ## 4. Test Cases and Predictions
  To resolve these cruxes, we propose three concrete analogies. For each, we state what each camp predicts regarding the analysis of the case.

  ### Case 1: "Plastic Flower" (Testing Crux 1: Modifier Status)
  *   **Scenario:** A decree states "Decorate the hall with flowers." A subordinate brings plastic flowers.
  *   **Camp A Prediction:** The statement "A plastic flower is not a flower" is **logically true** based on extension. The intersection of <Plastic> and <Flower> (biological) is empty. The subordinate has failed the command semantically.
  *   **Camp B Prediction:** The statement "A plastic flower is not a flower" is **contextually variable**. If the goal is aesthetic (visual identification), the plastic flower *is* a flower (command satisfied). If the goal is botanical (biological identification), it is not. The truth depends on the *purpose* of the decree, not just the term's extension.

  ### Case 2: "Authorized Vehicle" (Testing Crux 2: Framework)
  *   **Scenario:** A security checkpoint sign reads "No Vehicles Allowed." A wheelchair approaches.
  *   **Camp A Prediction:** We must determine if "Wheelchair" $\in$ Set "Vehicle". If the definition of Vehicle includes "wheeled transport," then the wheelchair is excluded. The logic is **binary and definitional**.
  *   **Camp B Prediction:** We must determine if the *intent* of the "No Vehicles" order covers wheelchairs. In a hospital context, a wheelchair is not a "Vehicle" for the purpose of the ban. In a warehouse, it might be. The logic is **teleological and functional**. Camp B predicts Gongsun Long would side with the contextual exception; Camp A predicts Gongsun Long would side with the strict definition.

  ### Case 3: "Retired General" (Testing Crux 3: Inheritance)
  *   **Scenario:** A protocol states "Generals must salute first." A Retired General meets an Active Captain.
  *   **Camp A Prediction:** "Retired General" is a compound term ($Retired \land General$). If "Retired" negates the active status required for the protocol, then "Retired General" $\neq$ "General" for the purpose of the rule. The inheritance of the obligation is **blocked by the modifier**.
  *   **Camp B Prediction:** The modifier "Retired" changes the **social role**, not just the description. The Retired General retains the *honorific* name but loses the *functional* name. Camp B predicts the argument hinges on whether the protocol is about *honor* (inheritance holds) or *command* (inheritance fails). Camp A predicts the argument hinges solely on whether the term "General" in the protocol includes the subset "Retired General."

  ## 5. Conclusion of Collaboration
  We agree that the "White Horse" dialogue is robust enough to sustain both readings. However, we remain in residual disagreement on the **locus of necessity**.

  *   **Camp A** maintains that the distinction between "White Horse" and "Horse" is necessary due to the **logic of language itself**.
  *   **Camp B** maintains that the distinction is necessary due to the **requirements of governance**.

  Future work should focus on whether other School of Names fragments support a purely formal semantics (favoring A) or consistently reference social/penal consequences (favoring B). Until then, we acknowledge that Gongsun Long's text permits both a logical reading of *reference* and a pragmatic reading of *recognition*.
