answer: |-
  ### Activity: The Masked Arrow Dissociation

  **Materials**
  *   **Projector & Computer:** Must be capable of running PowerPoint/Keynote at 60Hz refresh rate (standard). Test this beforehand; some "game mode" projectors have input lag that ruins timing.
  *   **Stimulus Deck:** A simple slide deck (see *Technical Specs* below).
  *   **Response Cards:** 2 index cards per student. One marked **L** (large bold letter), one marked **R**.
  *   **Score Sheet:** A simple grid for you to tally correct/incorrect guesses quickly.

  **Technical Specs (Critical)**
  Create a slide sequence that loops. Each trial consists of:
  1.  **Fixation:** White cross on black background (500ms).
  2.  **Forward Mask:** Random hash marks `####` (50ms / 3 frames).
  3.  **Target:** Arrow pointing Left **OR** Right (16ms / 1 frame). *This is the subliminal window.*
  4.  **Backward Mask:** Random hash marks `####` (50ms / 3 frames).
  5.  **Response Window:** Blank screen (2000ms).
  *For the Conscious Condition:* Change Step 3 Target duration to 500ms (30 frames).

  **Room Setup**
  *   Dim the lights. Students should sit within 10–15 feet of the screen.
  *   Distribute index cards. Tell students: "Keep these hidden until I ask for them."
  *   **Instruction:** "Your goal is to guess the direction of the arrow. If you think you saw it, great. If you think you saw nothing, you must still guess. Do not withhold a guess. If you feel a 'hunch,' follow it."

  **Procedure (35 Minutes)**

  **Phase 1: The "Blindsight" Condition (Unconscious)**
  1.  **Script:** "We are testing peripheral processing. The image will flash too fast for conscious recognition. You will likely feel like you are seeing nothing. You must guess anyway."
  2.  **Run 5 Trials:** Advance the slides manually or set to auto-advance. Ensure the 16ms target slide is set to "After Previous" with 0.00 delay (PowerPoint sometimes rounds 0.01 to 0.05, so test specifically for 1 frame).
  3.  **Collection:** After each trial, say "Reveal." Students hold up L or R card.
  4.  **Tally:** You quickly count correct vs. incorrect for each trial. Write the numbers on the board.
      *   *Example:* Trial 1 (12/20 correct), Trial 2 (11/20), Trial 3 (14/20), etc.
  5.  **Experience Check:** Ask hands: "Who genuinely saw an arrow?" (Expect 0–2 hands). "Who saw a flash?" (Expect some). "Who saw nothing?" (Expect most).

  **Phase 2: The Global Broadcast Condition (Conscious)**
  1.  **Script:** "Now we change the timing. The information will be available to everyone."
  2.  **Run 1 Trial:** Use the Conscious slide deck (500ms target).
  3.  **Collection:** Students hold up cards. (Expect 20/20 correct).
  4.  **Experience Check:** Ask: "Who saw the arrow?" (Expect 20 hands). "Can you talk about it?" (Yes).

  **Phase 3: The Aggregation (5 Minutes)**
  *   Sum the correct guesses from Phase 1 (e.g., 60 correct out of 100 total guesses = 60%).
  *   Compare to Chance (50%).
  *   Highlight the dissociation: High accuracy + Low reported experience vs. High accuracy + High reported experience.

  ---

  ### Debrief Script: Mapping to Theory (10 Minutes)

  **1. The Dissociation (Block)**
  "Look at Phase 1. You guessed above chance (e.g., 60%), meaning your visual system processed the information and guided your motor system (your hand holding the card). But most of you reported *no experience* of seeing the arrow.
  *   **Phenomenal Consciousness (P-Consciousness):** This is the 'what it is like' to see the arrow. In Phase 1, this was largely absent.
  *   **Access Consciousness (A-Consciousness):** This is information available for report and rational control. In Phase 1, you had *some* access (enough to guess), but not enough to report confidently.
  *   **The Point:** This simulates the blindsight intuition. Information can drive behavior (access-like control) without a rich phenomenal experience. Block argues these two things can come apart."

  **2. The Broadcast (Global Workspace Theory)**
  "Now look at Phase 2. Everyone saw it, everyone got it right, and we can all discuss it simultaneously.
  *   **Local Processing (Phase 1):** The arrow information hit your visual cortex and leaked into your motor system, but it died there. It was 'locked' in a specialized module.
  *   **Global Broadcast (Phase 2):** When the stimulus was presented longer, it ignited the 'Global Workspace.' The information was broadcast to language centers (you can say 'Left'), memory (you'll remember this later), and social cognition (you know everyone else saw it too).
  *   **The Point:** Consciousness, per Baars and Dehaene, isn't just processing; it's *wide availability*. Phase 1 was local processing; Phase 2 was global broadcast."

  ---

  ### Predictable Failures (The "TA Survival Guide")

  1.  **The "I Saw It" Contamination:** In Phase 1, 2–3 students will claim they clearly saw the arrow. This ruins the "no experience" claim.
      *   *Fix:* Do not invalidate them. Say, "Individual thresholds vary. In clinical blindsight, some patients have 'islands' of vision. For the majority who saw nothing, the dissociation holds."
  2.  **The Chance Failure:** You run the 5 trials and get 49% correct. The effect vanishes.
      *   *Fix:* This is the most common outcome with standard projectors. If this happens, pivot: "This demonstrates why measuring unconscious processing is hard. The *attempt* to separate performance from experience is the lesson. In labs, we run 500 trials to find that 51% signal. The fact that you felt forced to guess without seeing anything is the phenomenological win, even if the data is noisy."
  3.  **Projector Lag:** Many modern projectors have "image processing" that adds lag or blends frames, making the 16ms flash visible as a flicker or lasting longer.
      *   *Fix:* Test in the room 1 hour before class. If the arrow is visible, add a thicker mask or move the students further back.
  4.  **Skepticism:** Students may claim you rigged the slides (e.g., "The mask shook when the arrow was left").
      *   *Fix:* Have a student come up and run the keyboard for Phase 1 so they verify the slides are identical except for the hidden frame.

  ---

  ### Frank Limitations (What This Activity Cannot Do)

  1.  **It Does Not Prove P-Consciousness Exists:** This activity relies on self-report ("I didn't see it"). A hardline behaviorist could argue, "You saw it, you just didn't report it." You cannot prove the absence of experience, only the absence of report. You must supply the philosophical argument that report ≠ experience.
  2.  **It Is Not True Blindsight:** Blindsight involves V1 damage. This is masking in healthy brains. The mechanism is different (masking interrupts consolidation; blindsight is subcortical routing). Do not claim this *is* blindsight; claim it *models the functional dissociation*.
  3.  **It Doesn't Show P without A:** Block's other famous case is Phenomenal consciousness *without* Access (e.g., seeing a complex scene briefly but forgetting it instantly). This activity shows Access (motor guess) without Phenomenal (report). It is only half of Block's distinction. You must verbally supply the other half (e.g., "Imagine seeing a sunset so vividly you can't describe it—that's P without A").
  4.  **GWT is a Metaphor Here:** The activity shows "everyone knows it" vs "nobody knows it." It does not prove the neural "workspace" exists. It illustrates the *functional consequence* of the theory (availability), not the mechanism.
