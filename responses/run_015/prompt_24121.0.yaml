      *   *Phenomenal Consciousness (P-consciousness):* What it's like to experience something (qualia).
      *   *Access Consciousness (A-consciousness):* Information available for report, reasoning, and rational control of action.
      *   *Blindsight:* Patients deny seeing anything but can point to stimuli. This demonstrates A-consciousness (or at least information processing) without P-consciousness (or vice versa, depending on interpretation, but usually framed as processing without experience). *Correction:* In blindsight, there is processing driving action (access-like in terms of motor control) but no *phenomenal* experience. Block argues you can have A without P, or P without A. The prompt asks for "information driving their body without any conscious experience." This is the blindsight analogy.
      *   *Global Workspace Theory (GWT):* Consciousness arises when information is broadcast to multiple cognitive systems (memory, language, motor). Unconscious processing is local.
      *   *The Challenge:* Creating a *subliminal* effect in a 50-minute intro class with a projector is notoriously difficult. True subliminal priming effects are small and require tight control (timing, masking, individual thresholds). Expecting "above chance" guessing in a single trial with 20 students using a standard projector (60Hz usually) is risky. 16.6ms per frame is the limit. True subliminal often needs <10ms masked.
