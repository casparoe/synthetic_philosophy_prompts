      *   *Strategy:* Use a "Masked Priming" setup. It's the standard way to demonstrate unconscious processing.
      *   *Condition 1 (Unconscious/Blindsight-ish):* Flash a stimulus (arrow or word) very briefly, masked immediately. Ask for a forced-choice guess. Ask if they *saw* it. Most will say no. Aggregate guesses.
      *   *Condition 2 (Conscious/Global Workspace):* Flash the same stimulus longer. Everyone sees it. Everyone reports it. Information is "broadcast."
      *   *Mapping:* Condition 1 = Local processing (visual cortex motor link) without broadcast (no reportable experience). Condition 2 = Global broadcast (everyone knows, everyone can talk about it).

