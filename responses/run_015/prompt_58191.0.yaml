answer: |-
  ### Essay Question

  **Political Theory II: Ethics of Compatriot Partiality**

  **Question 1**
  Consider the following scenario: A Health Minister holds a fixed discretionary budget. She must choose between a domestic programme expected to extend the lives of 200 fellow citizens and an overseas aid contribution through an effective multilateral fund expected to save 800 lives abroad at identical cost. The Minister is democratically accountable only to the domestic citizens, yet personally able to direct the funds either way. Citizenship is non-voluntary; residents cannot easily renounce it.

  Critically evaluate whether the Minister is morally permitted or required to prioritize the domestic programme. In your analysis, you must distinguish between **instrumental**, **accountability-based**, and **intrinsically associative** defences of compatriot partiality. Explain how the specific details of the case (the 1:4 mortality ratio, the effectiveness of the aid, and the non-voluntary character of citizenship) affect the strength of each defence. Conclude with a definite verdict on the Minister's choice, defending it against the strongest objection from the opposing view.

  ***

  ### Model Answer

  **Verdict:** The Minister is morally permitted, and arguably required, to prioritize the 200 compatriots, though this permission rests solely on accountability-based grounds rather than intrinsic association.

  To resolve this dilemma, we must dissect the available justifications for partiality. First, the **intrinsically associative** defence argues that shared citizenship generates special duties simply by virtue of the relationship itself, akin to familial obligations. However, this defence falters in the present scenario. As the prompt notes, citizenship is non-voluntary; one does not choose one's compatriots. While some argue that shared cooperative schemes generate obligations, the moral weight of an unchosen relationship is significantly weaker than voluntary commitments. Furthermore, intrinsic defences usually struggle to justify letting 800 outsiders die to save 200 insiders when the need is identical (life extension). If the duty is intrinsic, it should be robust, yet the sheer disparity in numbers suggests that the 'specialness' of the relationship cannot simply override the basic right to life of outsiders without further justification. Thus, intrinsic association is insufficient here.

  Second, the **instrumental** defence suggests prioritizing compatriots because domestic stability or trust yields better long-term global outcomes. While plausible in general, the scenario specifies the overseas fund is 'effective' and the costs are 'identical.' If the 800 lives saved abroad do not destabilize the domestic order, the instrumental calculation collapses into simple utilitarianism: 800 lives outweigh 200. An instrumentalist cannot easily justify the partiality here unless they posit speculative long-term political costs to the Minister's party or national morale. Given the explicit effectiveness of the foreign aid, the instrumental defence is too fragile to bear the weight of 600 excess deaths.

  This leaves the **accountability-based** defence, which provides the strongest justification. This view posits that the Minister is not a free moral agent but a fiduciary agent of a specific constituency. Her authority derives from a democratic mandate to represent the interests of those who elected her. To divert resources intended for her principals to outsiders, however worthy, constitutes a betrayal of that specific political trust. The non-voluntary nature of citizenship actually strengthens this claim: because citizens cannot easily exit the jurisdiction, they are uniquely vulnerable to the Minister's decisions and thus owed a priority of care that voluntary global associations do not command. On this view, the Minister's role morality overrides general humanitarian morality. She is the instrument of the domestic populace, not the world.

  Therefore, the Minister is permitted to save the 200 compatriots. The verdict is not that foreign lives matter less, but that the Minister lacks the legitimate authority to sacrifice her constituents for them.

  The strongest objection comes from **impartialist cosmopolitanism**: moral status is universal, and a death is a death regardless of borders. To allow 600 excess deaths based on an arbitrary border violates the fundamental equality of persons. This objection is powerful. However, it conflates individual morality with institutional role morality. While a private citizen might be required to donate to the overseas fund, a public official operates within a division of moral labour. If every Minister neglected their specific constituency for the global good, the democratic contract would dissolve, potentially leading to worse global outcomes long-term. Thus, while the cost in lives is tragic, the Minister is required to uphold the specific duties of her office. Partiality is permitted here not because compatriots are more human, but because the Minister is their agent.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Required Analytical Moves (5 marks each)**

  1.  **Scenario Integration:** Explicitly utilizes the 1:4 ratio, the 'effective' nature of the aid, and the 'non-voluntary' citizenship constraint to test the arguments, rather than treating them as background noise.
  2.  **Intrinsic Defence Analysis:** Correctly identifies the intrinsic view (value of the relationship itself) and critiques it using the non-voluntary constraint and the high human cost.
  3.  **Instrumental Defence Analysis:** Correctly identifies the instrumental view (long-term benefits) and critiques it using the 'effectiveness' and 'identical cost' constraints.
  4.  **Accountability Defence Analysis:** Correctly identifies the accountability view (fiduciary/role morality) and explains why it survives the constraints better than the other two.
  5.  **Verdict and Objection:** Commits to a clear choice (Permitted/Required vs. Forbidden) and engages substantively with the strongest impartialist counter-argument (the value of equal lives).

  **Grading Descriptors**

  *   **First Class (20–25 marks):**
      *   Executes all five analytical moves with precision and fluency.
      *   The distinction between the three defences is sharp; the student shows *why* one fails where another succeeds based on the hypothetical's specific constraints.
      *   The verdict is nuanced (e.g., distinguishing role morality from general morality) and the rebuttal to the impartialist objection demonstrates deep engagement with political legitimacy, not just moral arithmetic.
      *   Writing is concise, argumentative, and free of digression.

  *   **Upper Second Class (15–19 marks):**
      *   Identifies all three defences and takes a verdict.
      *   Analysis is accurate but may be mechanical (e.g., "The instrumental view says X, but the numbers show Y").
      *   May struggle to fully integrate the 'non-voluntary' constraint into the intrinsic critique.
      *   The objection handling is present but may rely on standard counter-arguments without tailoring them to the Minister's specific role.

  *   **Lower Second / Third (10–14 marks):**
      *   Summarizes positions without applying them rigorously to the numbers or constraints.
      *   Fails to distinguish clearly between accountability and intrinsic arguments.
      *   Verdict is ambiguous or hedged excessively.

  **Characteristic Errors (Deductions)**

  *   **Surveying without Judging (-5 marks):** Discussing all views but refusing to commit to a verdict on the Minister's choice.
  *   **Ignoring Constraints (-5 marks):** Failing to address the 1:4 ratio or the 'effective aid' clause (e.g., arguing the foreign aid might be wasted).
  *   **Conflating Defences (-3 marks):** Treating accountability and instrumental arguments as identical.
  *   **Moralizing (-2 marks):** Relying on emotional rhetoric rather than political theory concepts (e.g., "It is just cruel to let them die").
