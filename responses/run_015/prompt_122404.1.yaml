      *   *Actually, the biggest missing piece:* The distinction between **trumping** (Lexical) and **weighting** (Finite). They discuss this, but they miss the concept of **satisficing** or **sufficiency**. (Wait, constraint: no name-dropping). I need to describe the concept without the label. The idea that you need "enough" pleasure, but pain must be below a limit.
