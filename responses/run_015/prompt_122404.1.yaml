      *   *Refinement:* Actually, looking closely at Move 4 and 5: Rob identifies a genuine structural flaw (aggregation sensitivity). Nadia defends by saying "everyone has this problem." She's right that non-linear views have it, but Lexical views have it *worse* (discontinuity vs. curvature). Rob is more "right" about the internal coherence of the theory. Nadia is more "right" about the moral phenomenology.
