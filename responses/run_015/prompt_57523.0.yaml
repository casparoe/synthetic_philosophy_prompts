prompt: |-
  I'm a third-year philosophy student in a seminar on social ontology, and for the last six weeks we have been working through David Lewis's analysis in *Convention* (1969): a convention as a self-perpetuating regularity in a recurrent situation of interaction, sustained by everyone's conditional preference to conform given that the others do, by near-universal conformity and the expectation of it, by the fact that this is all common knowledge, and by the arbitrariness of the regularity, in the sense that some alternative would have served the participants' purposes about as well. I did well on the midterm and I can reproduce the apparatus, but the seminar only ever asks the question in one direction — is this practice a convention? — and never in the direction that has become urgent for me. Alongside the course I am one of four volunteer moderators of a student-run subreddit of roughly sixty thousand members covering admissions and course evaluation, a role I have held for two years. We field two or three rule proposals or high-profile enforcement disputes a week. Nobody's welfare depends on our calls, but our credibility does: last spring a badly handled change to our posting-format rules cost us about a fifth of our weekly active posters for a semester, and we are still rebuilding. None of my co-moderators has any philosophy or game-theory training beyond what I relay to them; decisions have to be made within about forty-eight hours and posted publicly with a written justification; and the senior moderator has final sign-off, so anything I hand upward has to be legible to someone who will never read Lewis.

  What I would like is a decision procedure my team could actually run on a proposal or a dispute, derived as faithfully as possible from that analysis. I want an ordered set of questions, and for each one: what would count as a sufficient answer, what evidence a moderator can realistically gather in two days (enforcement logs, whether newcomers converge on the practice without being told, whether deviators justify themselves by appealing to the rule's content or merely to their dislike of it, whether the complainants' preferences are actually conditional on what everyone else does), and where that answer routes. Some routes should terminate in "this is a convention, and therefore this follows about changing it, enforcing it, and excusing deviation from it." Others should terminate in "this is not a convention, and the analysis gives you no tools here" — which is in my experience the more valuable output, since most of our worst fights are cases where we have deployed habit-talk about a rule whose content is anything but arbitrary. I also want the change protocol that accompanies each classification: if a practice is a convention, what does the account imply about how it can be replaced — can an authority simply decree a new equilibrium, or does a decree work only insofar as it renders one of the alternatives salient enough that conditional preferences re-form around it? — and what should we do in the case where nearly everyone privately prefers a different regularity but nobody can coordinate the switch, or where the practice is drifting with no proposal on the table and we need to know whether it is dying or merely being complained about. Alongside all of this, please be explicit about the translation itself. Which of the technical distinctions have to survive into the checklist even though they will sound strange to a lay moderator — I suspect common knowledge and the arbitrariness condition are doing nearly all the work — and which can be collapsed or dropped without changing any verdict we would actually reach? My roommate, who studies development economics, insists that Lewis is only describing a focal point and that the philosophical machinery adds nothing; the document should make it clear what the machinery is contributing that the shorthand would miss. And flag every step where the checklist is really asking a moderator to make a judgment about values — who this community is for, what a practice costs the people it excludes — and merely dressing that judgment in a technical form. Lewis tells us a convention is arbitrary in that another regularity would serve the participants' purposes about as well; I do not think he tells us anything about whether those purposes are worth serving, and I would rather have that limitation stated up front than discovered mid-argument.

  Finally, run the procedure on three live cases of ours. First, a proposal to merge two overlapping post flairs into one: everyone agrees it is trivially arbitrary, yet half the community feels strongly about it for reasons none of us can articulate. Second, our standing prohibition on posting information that identifies a named applicant or a member of staff, which I have been defending in the register of "community norms" and which I suspect your procedure will decline to classify as a convention at all. Third, our English-only rule. On the third, be blunt with me: roughly a third of our members are bilingual and would prefer a rule permitting posts in either language, and I have argued for two years that English-only is an arbitrary historical accident we should simply abolish by fiat at the start of next term. If the analysis implies that we cannot — that several alternative regularities are available, none of them salient, so that relaxing the rule yields a fragmented equilibrium that is worse even for the bilingual members it was meant to serve — then say so plainly and tell me what the procedure recommends instead. I would much rather be corrected in this document than in public. Close with a short list of what the procedure cannot settle at all: the questions it will appear to answer but does not.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year philosophy student, seminar on social ontology (Lewis's *Convention*), volunteer moderator of a large student subreddit (60k members).
      *   **Context:** Needs a practical decision procedure/checklist based on Lewis's theory for their mod team (who lack哲学 training) to use for rule proposals/disputes.
      *   **Constraints:**
          *   Must be actionable within 48 hours.
          *   Must be legible to a senior mod (no jargon without translation).
          *   Must distinguish between "Convention" and "Not Convention" (crucial for enforcement/change protocols).
          *   Must address the "Change Protocol" (how to shift equilibria).
          *   Must explicitly translate technical terms (Common Knowledge, Arbitrariness, Conditional Preference) into mod-speak.
          *   Must address the roommate's critique (Lewis vs. Schelling/Focal Points).
          *   Must flag normative/value judgments disguised as technical ones.
          *   Must apply the procedure to three specific cases: Flair Merge, Doxing/Privacy Ban, English-Only Rule.
          *   Must conclude with limitations (what the procedure *cannot* settle).
      *   **Tone:** Academic yet practical, rigorous, honest about limitations, respectful of the user's expertise but mindful of the team's constraints.

  2.  **Deconstruct Lewis's *Convention* (Key Concepts):**
      *   *Regularity R:* Everyone does X.
      *   *Recurrent Situation S:* The context repeats.
      *   *Conditional Preference:* I prefer to do X *if* others do X. (Coordination problem).
      *   *Alternative R':* There is another regularity that would have worked just as well (Arbitrariness).
      *   *Common Knowledge:* Everyone knows R, everyone knows everyone knows R, etc.
      *   *Self-perpetuating:* Expectations sustain the behavior.

  3.  **Drafting the Decision Procedure (The "Mod Toolkit"):**
      *   *Goal:* Turn Lewis's criteria into Yes/No questions.
      *   *Translation:*
          *   "Regularity" $\rightarrow$ "Consistent Behavior."
          *   "Conditional Preference" $\rightarrow$ "Coordination Need" (Does it only work if we all do it?).
          *   "Arbitrariness" $\rightarrow$ "Interchangeability" (Could we have done the opposite?).
          *   "Common Knowledge" $\rightarrow$ "Public Awareness" (Does everyone know everyone knows?).
      *   *Evidence Gathering:* What can a mod see in 48 hours? (Logs, search history, modmail volume, sentiment analysis).
      *   *Routing:*
          *   If Convention $\rightarrow$ High friction to change, needs salience shift, enforcement is about coordination not morality.
          *   If Not Convention $\rightarrow$ Authority can dictate, enforcement is about values/safety, change is top-down.
      *   *Value Flagging:* Explicitly note where "Purpose" is assumed good.

  4.  **Addressing the Roommate's Critique (Lewis vs. Schelling):**
      *   Roommate says it's just "Focal Points."
      *   Counter: Lewis adds *normativity* and *stability*. A focal point is a solution; a convention is a *sustained* solution backed by *expectations* and *conditional preferences*. The "machinery" explains *why* it persists without authority and *why* authority struggles to change it. It distinguishes between "we do this because it's best" (Norm/Rule) vs. "we do this because you do this" (Convention).

  5.  **Applying to the Three Cases:**

      *   *Case 1: Flair Merge.*
          *   Arbitrariness: High (colors/names don't matter intrinsically).
          *   Conditional Preference: Low/Mixed. Do users *need* others to use the same flair? Or do they just like their specific flair?
          *   Verdict: Likely *Not* a Convention in the strict Lewisian sense, but a *Habit*. The "strong feelings" suggest identity attachment, not coordination failure.
          *   Implication: Can be changed by fiat, but needs communication to reduce friction.

      *   *Case 2: Doxing/Privacy Ban.*
          *   Arbitrariness: Low. The alternative (allow doxing) does *not* serve purposes as well (safety risk).
          *   Conditional Preference: Low. I don't want to be doxed regardless of what others do.
          *   Verdict: *Not a Convention.* It's a Constitutive Rule or Safety Norm.
          *   Implication: Enforce strictly. No "coordination" excuse for violation.

      *   *Case 3: English-Only Rule.*
          *   Arbitrariness: High (could be French, or Mixed).
          *   Conditional Preference: High (Communication requires shared language).
          *   Common Knowledge: High.
          *   Problem: Multiple equilibria (All English vs. All Mixed).
          *   Verdict: *Convention.*
          *   Implication: Cannot simply abolish by fiat without creating a new salient focal point. "Mixed" might lead to fragmentation (bad equilibrium). Need a transition plan to make "Mixed" salient (e.g., auto-translate bots, specific threads).

  6.  **Refining the Change Protocol:**
      *   If Convention: Don't just ban the old. Make the new one *salient*. Use authority to signal the *new* equilibrium, not just punish the old.
      *   If Not Convention: Authority dictates based on values.

  7.  **Identifying Limitations:**
      *   Power dynamics (who counts as a "participant"?).
      *   Value of the "Purpose" (Lewis is neutral on whether the convention is *good*).
      *   Boundary conditions (when does a group split?).

  8.  **Review and Polish:**
      *   Check tone: Is it respectful of the student's intelligence but practical for the mods?
      *   Check constraints: Did I answer the roommate's point? Did I flag value judgments?
      *   Check Lewis fidelity: Am I misrepresenting *Convention*? (Ensure "Arbitrariness" is handled carefully—it's the trickiest part).
      *   *Self-Correction on Case 1:* If half the community feels strongly, is it arbitrary? Lewis says arbitrary means another regularity *would have served the purposes as well*. If the purpose includes "expressing sub-identity," then merging flairs might *not* serve purposes as well. I need to nuance this.
      *   *Self-Correction on Case 3:* The user suspects English-only is an accident. Lewis would say if it's a coordination equilibrium, it doesn't matter how it started. The issue is moving to a new one.

  9.  **Final Structure:**
      *   Introduction (Acknowledging the stakes).
      *   Part I: The Translation Layer (Lewis to Mod-Speak).
      *   Part II: The Decision Procedure (The Checklist).
      *   Part III: Change Protocols (How to act based on the verdict).
      *   Part IV: The Roommate Objection (Why Lewis > Schelling).
      *   Part V: Case Studies (Flair, Doxing, Language).
      *   Part VI: Limitations (What this doesn't solve).

  10. (Drafting content with attention to the "48-hour evidence" constraint and "Senior Mod legibility".) *Make sure the distinction between 'Norm' and 'Convention' is clear, as that's the core philosophical value add.*

  11. *Final Polish:* Ensure the "Value Judgment Flag" is prominent. Lewis is descriptive; Moderation is often normative. This tension must be highlighted.

  *(Self-Correction during drafting)*: Wait, the user asked for an "ordered set of questions." I should format Part II as a literal flowchart or numbered list with routing instructions.
  Also, ensure the "Common Knowledge" operationalization is realistic. Mods can't test for infinite recursion. They can test for "Public Pinning" + "Lack of Surprise."

