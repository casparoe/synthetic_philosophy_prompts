answer: |-
  **To:** The Moderation Team
  **From:** [Your Name]
  **Subject:** Operationalizing "Convention" for Rule Adjudication (Lewis Framework)

  ### Introduction

  We manage a coordination problem. We have 60,000 users, limited enforcement bandwidth, and a need to maintain credibility. We often argue about whether a rule is a "norm" (something we enforce because it's right) or a "convention" (something we enforce because we all agreed to do it this way to avoid chaos).

  David Lewis's *Convention* (1969) provides the rigorous distinction we lack. This document translates his philosophical apparatus into a 48-hour decision procedure. It is designed to tell us when we are guarding a coordination equilibrium (Convention) versus when we are imposing a value judgment (Norm/Rule).

  **Warning on Values:** Lewis's analysis is *descriptive*, not *normative*. It tells us how a practice holds together, not whether it is *good*. A convention can be toxic. This procedure will identify *if* something is a convention; it will not tell you if that convention is worth keeping. That judgment remains a human ethical choice.

  ---

  ### Part I: The Translation Layer

  To make this legible to the Senior Moderator and actionable for the team, we must translate Lewis's technical conditions into moderation metrics.

  | Lewis's Term | Operational Definition (Mod-Speak) | Why It Matters |
  | :--- | :--- | :--- |
  | **Regularity** | **Consistent Behavior:** Do users actually do this, or is it just in the wiki? | Distinguishes *law on books* from *law in action*. |
  | **Conditional Preference** | **Coordination Need:** Do users only want to comply *because* others comply? | If I want this rule followed even if no one else does (e.g., no doxing), it's **not** a convention. |
  | **Arbitrariness** | **Interchangeability:** Could we have done the opposite with equal success? | If the alternative is worse (e.g., allowing doxing), it's **not** a convention. |
  | **Common Knowledge** | **Public Salience:** Does everyone know that everyone knows this is the rule? | If users are genuinely surprised by enforcement, it's not a convention yet. |
  | **Recurrent Situation** | **Repeat Context:** Does this issue come up weekly? | One-off disputes are not conventions. |

  **Addressing the "Focal Point" Critique:**
  Your roommate (the economist) argues Lewis is just describing a "focal point" (Schelling). They are partially right, but missing the *normative glue*. A focal point is a solution to a one-time puzzle. A **Convention** is a *self-perpetuating* system backed by *expectations*.
  *   **The Machinery's Value:** Lewis explains *why* authority fails. If you ban a convention without providing a new focal point, users will drift back to the old equilibrium because their *conditional preferences* haven't changed. If you ban a non-convention (a safety rule), authority works fine. This distinction saves us from wasting political capital.

  ---

  ### Part II: The Decision Procedure (The Checklist)

  **Time Budget:** 48 Hours
  **Evidence Sources:** Mod logs, search queries (e.g., "why was this removed"), modmail sentiment, thread comments on rule changes.

  #### Question 1: The Regularity Check
  *Is there a consistent pattern of behavior among the user base regarding this issue?*
  *   **Evidence:** Search post history. Look for removal reasons.
  *   **Yes:** Proceed to Q2.
  *   **No:** **STOP.** This is not a convention. It is a proposed rule or a dead letter. Enforce based on stated values or discard.

  #### Question 2: The Arbitrariness Test (Crucial)
  *If we flipped the rule, would the community function roughly as well?*
  *   **Evidence:** Look at comparable subreddits. Do they do it differently? If we changed it, would the *utility* of the subreddit drop, or just the *habit*?
  *   **Yes (It is Arbitrary):** E.g., Posting format, flair color, thread sorting. Proceed to Q3.
  *   **No (It is Non-Arbitrary):** E.g., No doxing, no hate speech, no spam. The alternative actively harms the site's purpose.
  *   **Verdict:** **NOT A CONVENTION.** This is a **Constitutive Rule** or **Safety Norm**.
  *   **Protocol:** Enforce via authority. Do not negotiate based on "what everyone else does." The justification is *welfare/safety*, not *coordination*.

  #### Question 3: The Conditional Preference Test
  *Do users comply primarily because they expect others to comply?*
  *   **Evidence:** Read removal appeals. Do they say "This is unfair" (Value) or "This is confusing because everyone else does X" (Coordination)? Look for "Why bother?" sentiment.
  *   **Yes:** Proceed to Q4.
  *   **No:** **STOP.** Users comply because they believe the rule is intrinsically right (e.g., "Doxing is evil").
  *   **Verdict:** **NOT A CONVENTION.** This is a **Moral Norm**.
  *   **Protocol:** Enforce strictly. Deviation is a violation of community values, not a coordination failure.

  #### Question 4: The Common Knowledge Check
  *Is it clear to a new user that everyone else knows this rule?*
  *   **Evidence:** Check sidebar, sticky posts, auto-mod messages. Do newcomers ask "What's the rule?" or do they follow it immediately?
  *   **Yes:** **VERDICT: CONVENTION.**
  *   **No:** **VERDICT: EMERGING PRACTICE.**
  *   **Protocol:** If it is a Convention, see Part III. If Emerging, you can still shape it, but expect friction.

  ---

  ### Part III: Change Protocols (Based on Classification)

  #### If Classified: NOT A CONVENTION (Safety/Value Norm)
  *   **Authority:** High. You can decree changes.
  *   **Enforcement:** Punitive. Deviation is a violation.
  *   **Justification:** Appeal to community welfare, safety, or mission.
  *   **Risk:** Low risk of mass exodus due to coordination failure, high risk of moral outrage if values clash.

  #### If Classified: CONVENTION (Coordination Equilibrium)
  *   **Authority:** Low. You cannot simply decree a change. A decree only works if it makes a *new* equilibrium salient.
  *   **Enforcement:** Facilitative. You are punishing deviators to help coordinators, not punishing "evil."
  *   **Change Protocol:**
      1.  **Do not just ban the old.** You must make the new option *more salient*.
      2.  **Signal the Shift:** Use sticky posts, auto-mod, and mod flairs to model the *new* behavior immediately.
      3.  **The Transition Period:** Expect a period of chaos where two equilibria compete. Do not crack down on the old convention immediately; gently nudge toward the new focal point.
      4.  **Excusing Deviation:** If a user deviates during a transition, check if they are trying to coordinate on a *better* equilibrium. If so, excuse them. If they are just free-riding, enforce.

  #### If Classified: DRIFTING (Dying Convention)
  *   **Signs:** Compliance is dropping, but no new rule has replaced it.
  *   **Protocol:** This is a coordination failure. The community is losing its focal point. You must either (A) Reinforce the old convention with high-salience signaling, or (B) Formally decree a new standard to stop the drift. Do not let it linger.

  ---

  ### Part IV: Value Judgment Flags

  **Read this before applying the checklist.** Lewis's framework assumes the "purposes" of the participants are fixed. It does not evaluate them.

  1.  **The "Purpose" Trap:** In Q2 (Arbitrariness), we ask if an alternative serves purposes "as well." *Whose* purposes? If a convention excludes marginalized users, their "purpose" (participation) is not being served.
      *   *Flag:* If the "arbitrary" rule creates a barrier to entry for a specific group, treat it as a **Value Norm**, not a Convention. The "cost" of the alternative is not coordination failure; it is exclusion.
  2.  **The "Consent" Illusion:** Common Knowledge is not Consent. Users may know the rule and hate it, but follow it because they are trapped in the equilibrium.
      *   *Flag:* If Modmail shows high resentment but high compliance, you have a **Coercive Equilibrium**. Lewis calls this a convention; you should treat it as a **Governance Crisis**.

  ---

  ### Part V: Case Studies (Live Application)

  Here is the procedure applied to your three current disputes.

  #### Case 1: Merging Overlapping Post Flairs
  *   **Q1 (Regularity):** Yes, users use specific flairs consistently.
  *   **Q2 (Arbitrariness):** **Yes.** Technically, one flair could cover both topics.
  *   **Q3 (Conditional Preference):** **No.** This is the failure point. Users do not need *others* to use Flair A for Flair A to work. They want Flair A because it signals *their* specific content identity.
  *   **Verdict:** **NOT A CONVENTION.** This is a **Taxonomic Habit**.
  *   **Analysis:** The "strong feelings" are not about coordination; they are about *categorization utility*. Users feel the merge loses information.
  *   **Recommendation:** You have the authority to merge them (Not a Convention), but you are incurring a utility cost for users. Do not argue "we all need to agree." Argue "this simplifies the menu." Expect complaint volume, but no coordination collapse.

  #### Case 2: Prohibition on Identifying Applicants/Staff (Doxing)
  *   **Q1 (Regularity):** Yes, people generally do not post names.
  *   **Q2 (Arbitrariness):** **No.** The alternative (allowing names) does *not* serve purposes as well. It creates safety risks and legal liability.
  *   **Q3 (Conditional Preference):** **No.** I prefer nobody post names *even if* others do. My safety does not depend on your restraint; it depends on the rule itself.
  *   **Verdict:** **NOT A CONVENTION.** This is a **Safety Norm**.
  *   **Analysis:** You have been defending this as a "community norm." Stop. That implies it's up for debate based on consensus. It is not.
  *   **Recommendation:** Enforce via **Authority**. Justification is "Safety/Privacy," not "Community Agreement." Do not allow "everyone else was doing it" as a defense.

  #### Case 3: The English-Only Rule
  *   **Q1 (Regularity):** Yes, posts are overwhelmingly English.
  *   **Q2 (Arbitrariness):** **Yes.** The sub could function in Spanish, or Mixed, or French.
  *   **Q3 (Conditional Preference):** **Yes.** I post in English *because* I expect you to read English. If you post in Mandarin, I cannot coordinate with you.
  *   **Q4 (Common Knowledge):** **Yes.** It is explicitly stated and widely known.
  *   **Verdict:** **CONVENTION.** (Specifically, a Coordination Equilibrium).
  *   **Analysis:** You are correct that it is a historical accident. However, your roommate is wrong that this makes it easy to change. Because it is a Convention, **you cannot abolish it by fiat without a replacement equilibrium.**
      *   If you simply say "All languages allowed," you do not create a "Mixed" equilibrium. You create **Fragmentation**. English speakers cluster, Mandarin speakers cluster. The "network effect" of the single language is lost. The bilingual members lose the ability to talk to the monolingual majority.
  *   **Recommendation:**
      1.  **Do not abolish by fiat.** This will fragment the community (Bad Equilibrium).
      2.  **Create a New Focal Point:** If you want to allow other languages, you must create *specific coordination points* for them. E.g., "Weekly International Thread" or "Auto-Translate Bot Required."
      3.  **The Lewisian Constraint:** You must make the *Mixed* environment salient. If you just remove the ban, the default salience remains English. You must actively signal that Non-English posts are welcome *and will be read*.
      4.  **Blunt Truth:** If you cannot resource the support for a multi-language equilibrium (mods who speak the languages, translation tools), **keep the English-Only rule.** A stable, exclusive convention is better than a fragmented, failed one. Lewis teaches us that *stability* has value.

  ---

  ### Part VI: Limitations (What This Procedure Cannot Settle)

  1.  **The "Goodness" of the Equilibrium:** This procedure can tell you the English-Only rule is a convention. It cannot tell you if exclusion is *wrong*. That is a moral question external to Lewis.
  2.  **Power Asymmetries:** Lewis assumes "participants" are roughly equal. In a subreddit, Mods have ban hammers. This procedure treats Mod power as a "salience signal," but it cannot account for when that power is used to enforce a convention that benefits Mods at the expense of Users.
  3.  **Boundary Problems:** Who counts as "Everyone"? If 60% of users want a change but 40% (the most active) resist, is it still a convention? Lewis requires "near-universal conformity." This procedure forces a binary choice on a gradient reality.
  4.  **Dynamic Preferences:** Lewis assumes preferences are static. In reality, enforcing a convention can *change* preferences (e.g., users learn to like English-only because it's easier). This procedure takes a snapshot; it cannot predict adaptation.

  ### Final Note to the Team
  When you use this, be honest about the classification. If it's a **Convention**, admit that we are enforcing a habit for the sake of order. If it's a **Norm**, admit that we are enforcing a value. The confusion between the two is the source of most of our modmail conflicts.

  **Lewis's Lesson:** We cannot reason our way out of a convention without building a new road to walk on.
