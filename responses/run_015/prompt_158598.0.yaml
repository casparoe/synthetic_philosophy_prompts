answer: |-
  **Framework for Adversarial Collaboration on Evolutionary Psychology**

  **1. Agreed Claims**

  1.  **Evolutionary Framework:** Both sides accept the standard modern synthesis: traits spread via natural selection only if they are heritable, vary within a population, and causally contribute to differential reproductive success. There is agreement that 'selection-of' a trait does not automatically imply 'selection-for' its current function; a trait may be a by-product of another adaptation or a result of drift.
  2.  **Reverse Engineering Validity:** Reverse engineering infers function from design. Both sides agree this method is robust in sensory and perceptual systems (e.g., colour vision), where the physical problem space is well-defined and the mapping between mechanism and problem is tight. The dispute concerns whether this validity extends to complex social and reasoning mechanisms where the 'problem' is abstract and the mapping is many-to-one.
  3.  **Evidential Standards:** Design evidence (fit between form and function) is necessary but insufficient for establishing adaptation. Converging evidence is required from comparative phylogenetics, cross-cultural universality, or developmental trajectories. Both sides agree that the mere existence of a plausible adaptive story does not constitute confirmation.
  4.  **Empirical Nature:** The dispute is not about evolutionary theory itself, but about the distribution of cognitive architecture. It is an empirical question whether the mind is predominantly composed of domain-specific modules or domain-general learning mechanisms. Both sides commit to treating claims as falsifiable hypotheses rather than interpretive frameworks.
  5.  **Plasticity and Lag:** Both sides accept that mechanisms can be plastic. The disagreement concerns the *limits* of that plasticity: whether there are constraints on what can be learned that reflect ancestral statistics rather than individual reinforcement history.

  **2. Disagreements Table**

  | Issue | Camp A (Adaptationist) Statement | Camp B (Skeptic) Statement | Crux | Accepted Evidence | A's Prediction | B's Prediction | Falsifying Result |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Specificity** | Cognitive mechanisms are content-rich and domain-specific, triggered by specific ancestral cues. | Cognitive mechanisms are content-poor and domain-general, applied to various problems via learning. | Does performance degrade when content is swapped but logical structure remains identical? | Wason selection task variants with abstract vs. social content. | High performance on social contracts; low on abstract logic. | Performance tracks logical complexity, not content domain. | If social content advantage disappears when controlling for familiarity. |
  | **Evidence Threshold** | Design fit plus universality is sufficient to posit adaptation, barring a superior null model. | Design fit is weak confirmation; one must rule out by-product and learning models explicitly. | Can a domain-general learning model fit the data as well as the adaptationist model? | Model comparison using Bayesian Information Criterion on behavioural data. | Adaptationist model will have superior fit and parsimony. | Learning model will fit equally well with fewer parameters. | If adaptationist model requires post-hoc parameter tuning to fit. |
  | **Plasticity** | Mechanisms are calibrated during development but have fixed functional goals reflecting ancestral payoffs. | Mechanisms track local environmental statistics continuously throughout the lifespan. | Does behaviour shift to match reversed payoffs within a single generation? | Laboratory training with reversed reward contingencies. | Bias will persist despite reversed payoffs (evolutionary lag). | Bias will reverse to match new local optima rapidly. | If bias persists despite massive individual reinforcement for reversal. |

  **3. Concrete Tests and Cruxes**

  To move beyond theoretical stalemate, we propose three concrete testing protocols centred on the **Tuning-Tracking Question**. This distinguishes whether a mechanism's parameters track ancestral selection statistics (Camp A) or individual reinforcement history (Camp B).

  **Test 1: The Tuning-Tracking Protocol**
  *   **Task:** A visual search task modelling Error Management Theory. Participants must detect a threat stimulus amidst noise. The payoff matrix is asymmetric: missing a threat is costly; a false alarm is cheap.
  *   **Manipulation:** Two groups. Group 1 experiences ancestral-typical payoffs (high cost of misses). Group 2 experiences reversed payoffs (high cost of false alarms) introduced via explicit instruction and monetary reinforcement over 1,000 trials.
  *   **Measurement:** Shift in decision criterion (bias) pre- and post-training.
  *   **Outcomes:**
      1.  **Ancestral Lag:** Group 2 retains the ancestral bias despite penalties (Supports A).
      2.  **Rapid Retuning:** Group 2 shifts bias to match new payoffs within the session (Supports B-Learning).
      3.  **Fixed Rigidity:** Neither group shifts bias regardless of payoffs (Supports B-By-product; trait is non-functional).
      4.  **Null:** No bias exists in either group initially.
  *   **Distinction:** This separates Camp A from Camp B's Learning wing. If the bias is a by-product (Camp B's other wing), it should not respond to payoffs at all.

  **Test 2: Pre-registered Novel-Environment Prediction**
  *   **Setup:** A decision-making interface mimicking social exchange structures but using evolutionarily novel stimuli (e.g., cryptocurrency trading interfaces framed as reciprocity).
  *   **Commitment:** Camp A must pre-register the specific direction of the bias (e.g., cheating detection) based on the underlying structural isomorphism to ancestral problems. Camp B commits that a domain-general model, fitted only to the participants' prior reinforcement history with similar interfaces, will predict behaviour with equal or greater accuracy.
  *   **Criterion:** If the adaptationist model predicts the *direction* of the error better than the learning model predicts the *magnitude*, Camp A gains confirmation. If the learning model captures the variance without positing specific content, Camp B gains confirmation.

  **Test 3: Matched-Control Requirement**
  *   **Requirement:** Any claim of adaptation for Trait X must be tested against Trait Y, a structurally adjacent trait plausibly viewed as a by-product.
  *   **Example:** If 'cheater detection' is the adaptation, 'altruist detection' or 'rule violation detection' (non-social) serves as the control.
  *   **Discriminating Pattern:** Camp A must demonstrate a performance asymmetry favouring the adaptive trait before data collection. Camp B argues that without this matched control, any design fit is indistinguishable from a spandrel.
  *   **Implementation:** Both models (adaptationist and by-product) are fitted to the data. The adaptationist claim stands only if the interaction effect (Trait × Condition) is significant and in the predicted direction.

  **4. Verbal Disputes and Internal Divisions**

  We identify two areas where disagreement may be merely verbal. First, the definition of 'adaptation'. If Camp A defines it as 'current utility' and Camp B as 'historical selection-for', they may agree on the facts but dispute the label. We resolve this by adopting the historical definition (selection-for) for the purpose of this collaboration; current utility is treated as a separate claim. Second, the strength of evidence required. If Camp A accepts 'inference to the best explanation' while Camp B demands 'ruling out all nulls', this is a methodological disagreement, not a factual one. We agree to treat the burden of proof as symmetrical: positive claims require positive evidence, not just the failure of alternatives.

  We also flag an internal division within Camp B. The **By-product Wing** argues the trait exists due to structural constraints or selection on a correlated trait; it predicts the trait should be stable across environments even if non-functional. The **Domain-General Learning Wing** argues the trait exists because general learning rules optimized it locally; it predicts the trait should track individual reinforcement history. These two wings make opposing predictions regarding the Tuning-Tracking Protocol (Outcomes 1 vs 2 above). Camp B must not paper over this; if the Learning Wing is falsified, the By-product Wing may still stand, and vice versa.

  **5. Grant Recommendation**

  If the group receives funding for exactly one study, we recommend the **Tuning-Tracking Protocol**. It directly addresses the crux of plasticity versus fixed design. A result showing rapid retuning (Outcome 2) would force Camp A to concede that the mechanism is not a rigid fossil but a flexible learner, undermining the 'ancestral lock-in' claim. Conversely, a result showing evolutionary lag (Outcome 1) would force Camp B's Learning Wing to admit that general learning rules are constrained by content-specific priors. Even a null result (Outcome 4) is informative, as it suggests the putative adaptation does not exist in the proposed form. Both sides should treat a clear, pre-registered lag effect as informative evidence of constraint, rather than Camp A treating it as proof of modularity and Camp B dismissing it as experimental artefact. The goal is to constrain the parameters of human plasticity, regardless of the label attached to the mechanism.
