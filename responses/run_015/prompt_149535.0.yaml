answer: |-
  Here is a complete lesson plan designed for your 90-minute slot. It is built to be run with minimal setup, maximal student engagement, and a debrief that writes itself based on the data they generate.

  # Lesson Plan: The Three Urns of Uncertainty
  **Time:** 90 Minutes
  **Students:** 22 (3 Volunteers + 19 Bettors)
  **Materials:** Projector, 3 opaque bags/boxes, 100 red/black tokens (or paper slips), 22 Pricing Sheets (printed), 1 die (or random number generator on projector), Snacks (for payoff).

  ## 1. Preparation & Setup (Before Class)
  *   **The Currency:** Call them "DeciPoints" (DP). 10 DP = 1 Snack (e.g., a nice chocolate bar). Top 3 scorers get snacks; everyone else gets participation credit.
  *   **The Urn Masters:** You need 3 volunteers. Recruit them as they walk in. Give them distinct instructions (see below).
  *   **The Bettors:** The remaining 19 students. Divide the room into three sections: **Left (Random)**, **Center (Adversary)**, **Right (Ignorant)**.
  *   **The Pricing Sheet:** Each student gets one sheet with 4 lines.
      1.  Known Urn: Bet on **Red**. Sell Price: ___ DP
      2.  Known Urn: Bet on **Black**. Sell Price: ___ DP
      3.  Unknown Urn: Bet on **Red**. Sell Price: ___ DP
      4.  Unknown Urn: Bet on **Black**. Sell Price: ___ DP
      *   *Note:* The "Unknown Urn" section has a checkbox for their specific condition (Random/Adversary/Ignorant).

  ## 2. The Mechanics (5 Minutes)
  **Do not mention Ellsberg, Ambiguity, or Probability.**

  **Script:**
  > "Today is a market simulation. You are endowed with betting tickets. Your goal is to maximize your DeciPoints.
  >
  > **The Endowment:** You currently hold four tickets on your sheet.
  > **The Task:** For each ticket, write the *minimum* amount of DP you would accept to sell it back to me. This is your 'Sell Price.'
  > **The Incentive (Crucial):** At the end of class, I will pick one student at random. For that student, I will pick one of their four lines at random. I will then roll a 10-sided die (0–10).
  > *   If the **Die Roll is higher** than your Sell Price: I buy the ticket. You get the **Die Roll value** in DP.
  > *   If the **Die Roll is lower** than your Sell Price: I don't buy it. We draw the ball. If you win the bet, you get **10 DP**. If you lose, **0 DP**.
  >
  > *Strategy Note:* If you write a price higher than the ticket is worth, you risk being stuck with a losing bet. If you write a price lower, you risk selling a winner for too little. The safest strategy is to write the true value."

  *(This is a simplified Becker-DeGroot-Marschak mechanism. It incentivizes truth-telling without needing complex auction theory.)*

  ## 3. Stage 1: The Three Urns (30 Minutes)

  ### The Known Urn (All Students)
  *   **Visual:** Project an image of an urn with exactly **50 Red** and **50 Black** tokens.
  *   **Action:** Students price lines 1 and 2 (Red and Black bets).
  *   **Constraint:** "You cannot combine tickets. You must price them individually." (This blocks the "I'll just buy both" arbitrage loophole by framing it as a *selling* task of endowed assets).

  ### The Unknown Urn (Split Groups)
  Assign the 3 Volunteers (Urn Masters) to the front. They prepare the "Unknown Urn" for their section. The urn contains 100 tokens, but the ratio is hidden.

  *   **Group 1 (Left): The Randomizer**
      *   *Master Instruction:* Use your phone's random number generator to pick a number between 0 and 100. Put that many Red tokens in the urn. The rest are Black. **Do not look at the number before putting them in.** (Or use a script on the projector that generates the number while you turn your back).
      *   *Vibe:* Mechanical, cold uncertainty.

  *   **Group 2 (Center): The Adversary**
      *   *Master Instruction:* You want the bettors in your section to score as **low** as possible. Choose the Red/Black ratio secretly to minimize their expected winnings. You get a bonus snack if their average score is the lowest of the three groups.
      *   *Vibe:* Strategic, hostile uncertainty.

  *   **Group 3 (Right): The Ignorant Human**
      *   *Master Instruction:* You are blindfolded. There is a bag of slips at the front. Each slip says a ratio (e.g., "90 Red", "10 Red"). Pick one slip. Set the urn to that ratio. **Do not remove the blindfold.** You do not know what ratio you set.
      *   *Vibe:* Social, epistemic uncertainty.

  **Action:** Students price lines 3 and 4 (Red and Black bets on their specific Unknown Urn).
  **Collection:** Collect all sheets immediately. Do not reveal the urn contents yet.

  ## 4. Stage 2: Repetition (20 Minutes)
  **Goal:** Test if repeated exposure dissolves ambiguity.
  **Setup:** Focus on the **Unknown Urn** only.
  **Decision:** Use the **Fixed Urn** (Same unknown ratio for all 5 rounds).
  *Why?* If you refresh the urn every time, the law of large numbers mathematically collapses the ambiguity into risk (50/50 marginal probability). If you **fix** the urn, the ambiguity persists (the parameter is unknown and constant). This creates the tension you want: students will argue "it'll average out," but the data might show a skewed streak, proving their uncertainty was justified.

  **Procedure:**
  1.  Tell students: "We are now going to play 5 rounds. You keep the same Unknown Urn composition for all 5 rounds. You don't know the ratio, but it doesn't change."
  2.  **The Bet:** For each round, they must choose **Red** or **Black** (force a choice this time, no pricing).
  3.  **The Draw:** The Urn Master draws a ball, shows it, **replaces it**, shuffles, and draws again. (5 draws total).
  4.  **Tracking:** Students record their wins/losses on a scratch pad.
  5.  **Interim Check:** After Round 3, ask for a show of hands: "Who feels more confident now than they did at Round 1?"

  ## 5. The Reveal & Data Aggregation (10 Minutes)
  1.  **Reveal Urns:** Have the three Urn Masters reveal their ratios.
      *   *Likely outcome:* Random might be 48/52. Adversary will likely be 90/10 or 10/90 (extreme). Ignorant will be whatever the slip said.
  2.  **Board Work:** Calculate the class averages on the projector.
      *   **Known Urn:** Avg Price(Red) + Avg Price(Black) = ? (Should be ≈ 10 DP)
      *   **Unknown Urn (Random):** Avg Price(Red) + Avg Price(Black) = ?
      *   **Unknown Urn (Adversary):** Avg Price(Red) + Avg Price(Black) = ?
      *   **Unknown Urn (Ignorant):** Avg Price(Red) + Avg Price(Black) = ?

  ## 6. Debrief & Theory Mapping (25 Minutes)
  *Do not lecture until you have their data on the board.*

  **Step 1: The Inconsistency (Ellsberg)**
  *   **Ask:** "Look at the Known Urn sum. It's basically 10. Why?"
      *   *Answer:* Red + Black is a sure thing. A sure thing worth 10 DP should be priced at 10 DP.
  *   **Ask:** "Look at the Unknown Urn sums. Are they 10?"
      *   *Likely Result:* They will be significantly lower (e.g., 7 + 7 = 14? No, likely 4 + 4 = 8).
  *   **The Trap:** "If I believe Red is 40% likely, I must believe Black is 60% likely. Why is the package of (Red + Black) worth *less* than the sure thing, when they pay off in exactly the same states?"
  *   **The Lesson:** This violates **Additivity** in Expected Utility. You cannot assign a single probability $P(Red)$ that explains both prices. This is the **Ellsberg Paradox**.

  **Step 2: The Three Flavors (Your Twist)**
  *   **Compare the Groups:**
      *   If **Adversary** prices are lowest: This suggests ambiguity aversion is driven by **Strategy Aversion**. We hate not knowing *because* we fear someone else knows and is using it against us. (Connect to Game Theory vs. Decision Theory).
      *   If **Ignorant** prices are higher than Adversary but lower than Random: This suggests **Social Trust** mitigates ambiguity. We trust a blind peer more than a hidden enemy.
      *   If **Random** is still aversive: This confirms pure **Ambiguity Aversion** (Knightian Uncertainty). It's not about enemies; it's about the missing number itself.
  *   **Discussion:** "Is uncertainty about *nature* different than uncertainty about *people*?"

  **Step 3: Repetition (The Long Run)**
  *   **Ask:** "In Stage 2, did your confidence grow?"
  *   **The Math:** "Some of you argued that over 5 rounds, it becomes a coin flip. But because the urn was **Fixed**, if the Adversary set it at 90% Red, the long-run frequency is 90% Red, not 50%."
  *   **The Point:** Repetition reduces *variance* (risk), but it does not reduce *parameter uncertainty* (ambiguity) unless the parameter itself resets every time.
  *   **Takeaway:** Expected Utility handles risk (variance) well. It handles ambiguity (unknown parameters) poorly, even over time.

  ## 7. Troubleshooting & "Honest Notes"

  **What will go wrong (and how to fix it):**
  1.  **The BDM Confusion:** Students will struggle with the "Die Roll vs. Sell Price" logic.
      *   *Fix:* Run a practice round on the projector with a dummy ticket before starting. "If I price at 6, and roll a 4, what happens?"
  2.  **The "Take Both" Loophole:** A smart econ major will raise their hand and say, "I'll just price Red at 5 and Black at 5, then buy both and guarantee 10."
      *   *Fix:* Your script says "You are endowed with the ticket. You are **selling**." They cannot buy. They can only hold or sell. If they sell both, they get the cash sum. If the cash sum < 10, they reveal aversion.
  3.  **Adversary Ethics:** The Adversary student might feel bad "cheating" their classmates.
      *   *Fix:* Frame it explicitly as a "Game Role." Give them a distinct badge or hat. Make it clear their job is to win the game, not be nice.
  4.  **Time Creep:** The pricing stage takes longer than expected.
      *   *Fix:* Hard stop at 35 minutes. Collect sheets even if some aren't finished. You only need enough data for the averages.
  5.  **Stage 2 Boredom:** 5 rounds of watching a ball draw can drag.
      *   *Fix:* Make it fast. The Urn Master should draw rapidly. Keep the commentary going ("Come on, Red needs to catch up!").

  **What the game cannot reproduce (Say this yourself):**
  *   **Real Stakes:** DeciPoints are not dollars. Ambiguity aversion often scales with stakes. Acknowledge that with real rent money, the effect might be stronger.
  *   **Learning:** In the real world, if you see 5 Reds in a row, you update your belief about the urn. In this game, we forced them to bet before learning the ratio to isolate the *prior* aversion.
  *   **The "Why":** The game shows *that* they violate EU. It doesn't prove *why* (fear of regret? incompetence? information cost). That is the job of the theories you teach next (Maxmin Expected Utility, Smooth Ambiguity, etc.).

  ## 8. Materials Checklist
  *   [ ] 22 Printed Pricing Sheets.
  *   [ ] 3 Opaque Containers (Boxes/Bag).
  *   [ ] 100 Red/Black tokens (or colored paper squares).
  *   [ ] 1 Blindfold.
  *   [ ] 1 Bag of "Ratio Slips" (for the Ignorant Master).
  *   [ ] Snacks (3 distinct, desirable items).
  *   [ ] Projector Slide with BDM Instructions (keep it up during pricing).

  ## 9. The "Aha" Moment Script
  *When you reveal the data on the board:*

  > "Look at column 3 and 4. You priced Red at 4 and Black at 4. That sums to 8. But together, those two tickets pay 10 points no matter what. You just told me you'd sell a guaranteed 10 points for 8 points.
  >
  > If you were using Expected Utility, you would have had to assign a probability to Red. If you thought Red was likely, Black bet is worth less. If you thought Red was unlikely, Red bet is worth less. You can't discount *both*.
  >
  > You didn't discount the probability. You discounted the **knowledge**. And you discounted it most when you thought a classmate was trying to beat you."
