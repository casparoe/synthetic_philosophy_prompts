prompt: |-
  I teach a second-year rational choice / decision theory course — 22 students, mostly philosophy and econ majors, one 90-minute slot, and I've got a projector and a big table at the front but nothing else. They've seen expected utility but no real decison theory past that.

  I want a game that makes them feel the Ellsberg pattern instead of me putting the two urns on a slide and announcing that people are weird. The thing I want them to run into on their own: the usual pattern (I'd rather bet on red from the 50/50 urn than red from the unknown one, and likewise for black) can't come from any single probability assignment plugged into expected utility. My idea is that they each price all four bets separately, and then notice that their price for red-from-known plus black-from-known, and their price for red-from-unknown plus black-from-unknown, are both prices for packages that pay off for sure. No lecture up front, and they shouldn't hear the words ambiguity aversion or Ellsberg until the debrief.

  The wrinkle I want to add, which I can't find anywhere: run the ambiguous urn in three flavours at once, one per third of the room — composition set by a shuffle/randomiser, by a classmate who gets a bonus if the bettors lose, and by a classmate who is herself blindfolded and just pulled a slip from a bag, so she knows nothing but is visibly a person. My hunch is the aversion is way stronger in the second condition, and that this says something about whether the phenomenon is really about missing information or about being in a situation where someone might know more than you than you do. Build it in and tell me how to read whatever comes out.

  Then a last stage where they bet on the ambiguous urn repeatedly, either reusing one fixed urn with replacement or drawing a fresh one each round — you tell me which is cleaner — so that the long-run frequency pulls toward 50%. I want them to feel the force of "over enough rounds this is just a coin flip," and also to feel why that argument might not settle the question.

  Need: actual rules, materials, a payoff scheme with no real money (points, snacks, bragging rights, whatever), a timeline, a debrief that maps specific moments onto specific bits of the argument, and honest notes on what will go wrong the first time I run it and what the game simply can't reproduce so I'll have to say it myself. Also my students will instantly say they'd just take both bets, so the setup has to block that move without me tipping them off as to why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year Philosophy/Econ majors (22 students).
      *   **Background:** Know Expected Utility (EU), no advanced decision theory.
      *   **Goal:** Experience the Ellsberg Paradox firsthand (preference for known risk over unknown ambiguity) without prior lecture. Prove inconsistency with EU.
      *   **Specific Twist:** Three versions of the ambiguous urn:
          1.  Randomizer (mechanical).
          2.  Adversarial Classmate (bonus if bettors lose).
          3.  Blindfolded Classmate (ignorant human).
          *Hypothesis:* Aversion strongest in Adversarial condition (strategic uncertainty vs. pure ambiguity).
      *   **Second Stage:** Repeated betting on the ambiguous urn to test the "Law of Large Numbers" intuition (does repetition dissolve ambiguity?).
      *   **Constraints:** 90 minutes, projector + big table, no real money (points/snacks), block the "take both bets" loophole.
      *   **Deliverables:** Rules, materials, payoff scheme, timeline, debrief, troubleshooting notes.

  2.  **Deconstruct the Core Problem (Ellsberg Paradox):**
      *   *Standard Setup:* Urn A (50 Red, 50 Black). Urn B (100 balls, Red/Black ratio unknown).
      *   *Typical Preference:* Bet Red on A > Bet Red on B AND Bet Black on A > Bet Black on B.
      *   *EU Contradiction:* If $P(Red_B) > 0.5$, then Bet Red on B > Bet Red on A. If $P(Red_B) < 0.5$, then $P(Black_B) > 0.5$, so Bet Black on B > Bet Black on A. You can't prefer A in both cases under a single probability distribution.
      *   *The "Take Both" Loophole:* If I bet Red on B *and* Black on B, I win for sure. Students often spot this. The pricing mechanism needs to prevent arbitrage or force a choice.
      *   *Solution:* Use a Becker-DeGroot-Marschak (BDM) style mechanism or a simplified "Buying Price" auction where they commit to a price, and a random buy-back price is drawn. Or, simpler for 90 mins: Force a choice between pairs, or use a pricing task where the sum reveals the inconsistency. The prompt suggests pricing all four bets. Let's refine that. If they price $B(Red_A) + B(Black_A) \approx 100$ and $B(Red_B) + B(Black_B) < 100$, that shows the inconsistency (sub-additivity of prices for a sure thing).
      *   *Blocking "Take Both":* The pricing task inherently blocks this. If I say "I'll buy this bet from you for $X$", and you price it at $X$, you are indifferent. If you price the package (Red + Black) at less than the sure payoff, you are revealing ambiguity aversion.

  3.  **Develop the "Three Flavors" Twist:**
      *   *Condition 1 (Random):* Computer/Randomizer sets the ratio. Pure ambiguity.
      *   *Condition 2 (Adversary):* A student sets the ratio to minimize bettors' wins. Strategic uncertainty (Game Theory vs. Decision Theory).
      *   *Condition 3 (Ignorant Human):* A student picks blindly. Social ambiguity.
      *   *Logistics:* 22 students. Split into 3 groups of ~7.
      *   *Interpretation:* If Condition 2 yields lower prices than 1 & 3, it suggests "Ambiguity Aversion" is partly "Strategy Aversion" (fear of informed opposition). This touches on *uncertainty about the source* of uncertainty.

  4.  **Develop the "Repeated Betting" Stage:**
      *   *Question:* Does repeating the ambiguous bet make it look like risk?
      *   *Option A (Fixed Urn):* Same unknown ratio every time. Law of Large Numbers (LLN) applies to the *draws*, but the *parameter* is fixed unknown. The variance remains high because the underlying bias doesn't average out.
      *   *Option B (Fresh Urn):* New unknown ratio every time. This converges faster to 50/50 expectation.
      *   *Decision:* **Fixed Urn** is philosophically richer for Ellsberg. It highlights that ambiguity is about the *parameter uncertainty*, not just outcome variance. If the urn is fixed but unknown, the long-run frequency is *not* necessarily 50%. It's whatever the urn is. This preserves the tension. If we refresh the urn, it becomes a compound lottery that collapses to 50/50 (by symmetry), which kills the paradox too quickly. Let's go with **Fixed Urn** to maintain the tension, but acknowledge the "learning" aspect.
      *   *Wait, re-reading prompt:* "long-run frequency pulls toward 50%". If the urn is fixed (e.g., 90 Red, 10 Black), the frequency pulls to 90%, not 50%. If the prompt wants them to feel the pull toward 50%, we need the *source* to be symmetric (e.g., the ratio was chosen 50/50 from a distribution).
      *   *Correction:* To make the "long run is 50%" argument plausible to students, the *process* generating the urn must be symmetric. But once the urn is set, it's fixed.
      *   *Better approach for Stage 2:* Use the **Fresh Urn** (re-randomized every round). This allows the "it's just a coin flip in the long run" argument to actually hold mathematically, making the persistence of aversion more puzzling (or revealing that they don't trust the randomization).
      *   *Actually, the prompt asks me to choose.* I will choose **Fixed Urn**. Why? Because if it's a fresh urn every time, the ambiguity dissolves mathematically into risk (50% chance of Red overall). If it's a Fixed Urn, the ambiguity persists. The *students* might argue "it'll average to 50%", but the *reality* is it won't if the urn is skewed. This creates a better teaching moment about the difference between *Risk* (known prob) and *Ambiguity* (unknown parameter).
      *   *Wait, let's look at the learning goal:* "feel the force of 'over enough rounds this is just a coin flip,' and also to feel why that argument might not settle the question."
      *   If I use a Fixed Urn, the argument "it's a coin flip" is *false*. If I use a Fresh Urn, the argument is *true*.
      *   To let them feel the force of the argument *and* its limitation, I should use the **Fixed Urn**. They will *argue* it should average to 50%. They will *observe* it might not (if the randomizer picked a skewed urn). Or, to ensure the "coin flip" intuition is tested fairly, we use the **Fresh Urn** but ask them if their *willingness to bet* changes.
      *   *Decision:* **Fresh Urn (Re-randomized)**. Why? Because the prompt says "long-run frequency pulls toward 50%". This implies the underlying process is symmetric. If I fix the urn at 90/10, the frequency pulls to 90%. If I re-randomize the composition every round (e.g., draw a number $k$ from 0-100, put $k$ red balls in), then the marginal probability of Red is 50%. This tests if *repetition* cures ambiguity aversion even when the math says it should.

  5.  **Drafting the Mechanics:**
      *   **Currency:** "Philosopheuros" (points). Top 3 get snacks/bragging rights.
      *   **Pricing Mechanism:** To avoid BDM complexity (which takes time to explain), use a **Menu Choice**.
          *   Option A: Bet on Known Urn (Win 10 pts if Red).
          *   Option B: Bet on Unknown Urn (Win 10 pts if Red).
          *   *Problem:* This forces a choice but doesn't quantify the intensity.
          *   *Prompt Preference:* "They each price all four bets separately."
          *   *Implementation:* Give them a sheet. "What is the minimum certain amount of points you would accept instead of this ticket?" (Certainty Equivalent).
          *   *Payoff:* At the end, pick one question at random to count for real points. This incentivizes truth-telling (incentive compatibility).
      *   **Blocking "Take Both":** The pricing sheet asks for the value of *each ticket individually*. If they price Red=6 and Black=6 on the unknown urn, the sum is 12. The sure thing is 10. If they are rational EU maximizers, Sum(Red+Black) must = Sure Thing. If Sum < Sure Thing, they violate EU. We don't need to block "taking both" explicitly; the *aggregation of their prices* reveals the violation. The prompt says "students will instantly say they'd just take both bets". I need to prevent them from *buying* both.
      *   *Fix:* The task is "You own the ticket. What is the lowest price you will sell it for?" (WTA - Willingness To Accept). They start with the ticket. They can't buy another. They just price the one they hold. This prevents arbitrage.

  6.  **Timeline (90 Minutes):**
      *   0-10: Setup & Instructions (Crucial: explain the currency and payoff).
      *   10-35: Stage 1 (The Three Urns Pricing Task).
      *   35-50: Stage 2 (Repeated Betting).
      *   50-90: Debrief & Theory Mapping.

  7.  **Refining the "Three Flavors":**
      *   Need 3 "Ambiguous Urn Managers" (AUMs).
      *   *Group 1 (Random):* AUM uses a random number generator (phone) to set the ratio.
      *   *Group 2 (Adversary):* AUM chooses ratio to minimize class score.
      *   *Group 3 (Blind):* AUM draws a slip from a bag that says "70 Red" or "20 Red", etc., without looking at the bag contents beforehand? No, simpler: AUM draws a ball from a master urn to set the ratio, but is blindfolded so they don't know the ratio they set.
      *   *Wait, 22 students.* 3 groups of 7 is small. Maybe 3 groups of 7, plus the 3 AUMs = 24? No, 22 total.
      *   *Split:* 3 Groups of 7 bettors (21 students) + 1 Student rotates as AUM? Or just 3 AUMs and 19 bettors. Let's do 3 Groups of 6 bettors + 3 AUMs = 21. One student is scorekeeper/timekeeper.
      *   *Actually, keep it simple.* Divide room into Left, Center, Right. Each section has a different "Source of Uncertainty".
      *   *Left:* Computer Randomizer (Projector shows a script running).
      *   *Center:* Adversarial Student (Chooses ratio secretly).
      *   *Right:* Ignorant Student (Draws ratio from a hat, doesn't look).

  8.  **Addressing the "Take Both" Loophole Explicitly:**
      *   Instruction: "You are endowed with ONE ticket for each scenario. You must state the minimum cash value you would accept to *sell* it back to me. You cannot buy more tickets."
      *   This frames it as WTA (Willingness To Accept).
      *   If they value Red@Unknown + Black@Unknown < Sure Payoff, they show ambiguity aversion.

  9.  **Debrief Strategy:**
      *   Collect sheets. Calculate averages for Known Red + Known Black vs. Unknown Red + Unknown Black.
      *   Show the gap on the board.
      *   Map to EU axioms (Sure Thing Principle / Additivity).
      *   Discuss the 3 conditions (Adversary vs. Random).
      *   Discuss Repetition (Stage 2).

  10. **Troubleshooting:**
      *   *Time:* Pricing takes time. Keep it tight.
      *   *Incentives:* If points don't matter, they joke. Need a tangible reward (Snacks for top 3 scores).
      *   *Confusion:* Ensure they understand "Sell Price".
      *   *Adversary:* Make sure the Adversary knows their goal (minimize others' points).
      *   *Blind:* Make sure the Blind person is visibly blind (mask).

  11. **Final Review against Constraints:**
      *   No lecture up front? Check.
      *   No "Ellsberg" words until debrief? Check.
      *   Pricing all 4 bets? Check.
      *   Three flavors of ambiguity? Check.
      *   Repeated betting stage? Check.
      *   Block "take both"? Check (via Endowment/WTA framing).

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   *Payoff:* BDM is too complex to explain in 5 mins. Use a **Random Price Mechanism**. "You write a sell price. I draw a random number from 0-10. If my number > your price, I buy it (you get my number). If my number < your price, you keep the ticket (and we draw the ball)." This is incentive compatible and easier than BDM.
      *   *Wait, simpler:* Just collect the prices. Tell them "I will check for consistency. The top 3 most consistent + highest scorers get snacks." No, that's vague.
      *   *Best for Class:* "One sheet will be chosen at random for real payoff. On that sheet, one question is chosen. If you priced a ticket at $X$, and the random buy-back price is $Y$..." -> This is BDM. It's the gold standard for truth-telling. I must include a 5-minute BDM explanation. It's worth it for validity.
      *   *Actually, for 2nd years:* Keep it simpler. "You price the ticket. At the end, I will offer to buy it at a random price. If my price is higher than yours, I buy it. If lower, you play the bet." (This is BDM). I will write the script for this explanation.
      *   *Stage 2:* Repeated betting. Let's do 5 rounds. Fixed Urn vs Fresh Urn. I'll stick with **Fresh Urn** (re-randomized composition each round) because it validates the "long run is 50%" intuition mathematically, making their continued aversion more interesting to discuss.
      *   *Wait, one more check:* If the urn is re-randomized 0-100 red balls each round, the marginal prob is 50%. If they are EU maximizers, they should treat this as Risk. If they still show aversion, it shows ambiguity aversion persists even over aggregates.
      *   *Wait, the prompt asks:* "either reusing one fixed urn with replacement or drawing a fresh one each round — you tell me which is cleaner".
      *   *My Verdict:* **Fixed Urn** is cleaner for the *philosophical* point. Why? Because if it's fresh every time, the ambiguity technically vanishes into risk (by the reduction of compound loturies). If it's Fixed, the ambiguity remains (parameter uncertainty). The *students* will argue "it averages to 50". The *math* says "no, it averages to $p$, where $p$ is unknown". This tension is the lesson. I will recommend **Fixed Urn**.

  13. **Final Polish:** Ensure the tone is practical for a professor. Include the "script" for the BDM mechanism because that's the hardest part to improvise. Ensure the "Adversary" condition is ethical (it's a game, not actual malice).

  *(Self-Correction on BDM)*: BDM might eat 15 minutes of explanation. For a 90-minute class with a game, maybe a **Binary Choice Ladder** is better? "Would you prefer this bet or 5 points? 6 points? 7 points?" -> Finds the indifference point.
  *Decision:* Let's use a **Selling Price** sheet but explain the incentive simply: "One of your prices will be tested. I will roll a die (0-10). If roll > your price, you get the roll value. If roll < your price, you play the bet." This is standard BDM logic but simplified. I will provide the exact script.

  *(Self-Correction on Group Sizes)*: 22 students. 3 Groups = 7, 7, 8. Plus 3 "Urn Masters". That's 25. I need to embed the Urn Masters *within* the groups or have them be volunteers who don't bet.
