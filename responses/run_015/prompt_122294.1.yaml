answer: |-
  To demonstrate that qualia are not "confused posits" (i.e., to survive "quining"), a theory of qualitative experience must satisfy a rigorous set of desiderata. These criteria function as a job description: if a theory cannot meet them, the concept of qualia risks being eliminated as a relic of pre-scientific intuition. Below is the full specification of these requirements, organized by phenomena, distinctions, incoherence charges, and external constraints, followed by the critical tensions inherent in the list.

  ### I. Phenomena to Accommodate

  An adequate theory must explain why these specific intuitions arise and validate their core claims without resorting to illusionism (unless the theory is eliminativist, which is evaluated later).

  **1. The Inverted Spectrum**
  *   **Desideratum:** The theory must allow for the logical possibility that two subjects could be functionally identical (discriminating red from green identically) while experiencing inverted qualitative characters (what is red for one is green for the other).
  *   **Motivating Case:** Locke's thought experiment. If color experience is purely functional/behavioral, inversion is impossible. If qualia are real properties distinct from functional role, inversion is coherent. A theory that collapses quality into function cannot accommodate this intuition.

  **2. First-Person Authority (Incorrigibility)**
  *   **Desideratum:** The theory must explain why subjects have privileged, non-inferential access to their own current phenomenal states, such that self-ascriptions of pain or redness are not subject to the same error conditions as external observations.
  *   **Motivating Case:** The Cartesian intuition. If I say "I am in pain," it seems conceptually impossible for me to be wrong about the *feeling* itself, even if I am wrong about the cause. A theory that treats self-reports as mere hypotheses (like a scientist observing data) fails to capture the immediacy of experience.

  **3. Artificial Phenomenal Reports**
  *   **Desideratum:** The theory must provide truth conditions for a non-biological system reporting "I am experiencing red." It must specify what physical or functional state makes that report true rather than a "zombie" utterance.
  *   **Motivating Case:** The Turing Test for Feeling. As AI advances, we need a criterion to distinguish genuine suffering in a machine from sophisticated simulation. If qualia are coherent, there must be a fact of the matter about whether the machine has them.

  ### II. Distinctions to Maintain

  To avoid quining, the theory must not collapse these categories. Dennett's "quining" argument often proceeds by showing that once you distinguish these layers, the "qualia" layer disappears. A realist theory must show the layer remains.

  **1. Phenomenal Consciousness (P) vs. Access Consciousness (A)**
  *   **Desideratum:** The theory must distinguish the *presence* of an experience (P) from its *availability* for reasoning, reporting, or control (A).
  *   **Motivating Case:** Block's argument. One can arguably have a rich visual experience that is instantly forgotten (iconic memory) without being accessed for report. If P reduces to A, then unreported experiences do not exist, which contradicts the intuition of a rich phenomenal field.

  **2. Intrinsic Quality vs. Relational Functional Role**
  *   **Desideratum:** The theory must account for the "what-it-is-like-ness" as a property of the state itself, not merely its causal relations to inputs and outputs.
  *   **Motivating Case:** The intrinsic nature intuition. Pain feels bad *in itself*, not just because it causes avoidance. If the "badness" is solely its tendency to cause avoidance, then a system that avoids damage without the "bad feel" (a zombie) suffers no moral harm, which contradicts our ethical intuitions.

  **3. Having a State vs. Knowing That One Has It**
  *   **Desideratum:** The theory must separate the instantiation of a qualitative state from the higher-order thought (HOT) about that state.
  *   **Motivating Case:** Creature consciousness. A dog or an infant may feel pain without possessing the concept "pain." If qualia require higher-order knowledge, then most sentient life lacks experience. A theory of qualia must allow for unconscious experience (in the cognitive sense) to be phenomenally rich.

  ### III. Incoherence Charges to Answer

  These are the specific philosophical attacks that claim the concept of qualia is logically flawed.

  **1. The Private-Language Problem**
  *   **Desideratum:** The theory must explain how qualitative terms acquire meaning if they refer to essentially private objects. It must show how "pain" is not just a noise made when hurt, but a reference to a shared type of experience.
  *   **Motivating Case:** Wittgenstein's Beetle in the Box. If everyone has a box (mind) with something inside (qualia) that no one else can see, the word "beetle" cannot refer to the private object. The theory must ground qualitative reference in public criteria without eliminating the private object.

  **2. The Explanatory Gap**
  *   **Desideratum:** The theory must explain *why* specific physical processes give rise to specific qualitative feels, or explain why this question is ill-posed without denying the feel.
  *   **Motivating Case:** Levine's argument. We can explain why water is H2O via identity, but we cannot explain why C-fiber firing *feels* like pain. There is an intelligibility gap. A coherent theory must bridge this or show the bridge is unnecessary.

  **3. Qualitative Similarity and Transitivity**
  *   **Desideratum:** The theory must ground claims like "Red is more similar to Orange than to Blue" in a way that is potentially shareable across subjects, avoiding the charge that similarity is indeterminate.
  *   **Motivating Case:** Goodman's "New Riddle of Induction" applied to qualia. If qualia are purely private, I cannot know if your "red" is structurally similar to mine. If similarity is not transitive or determinable, a "quality space" is impossible, and science of sensation collapses.

  ### IV. External Constraints

  The theory cannot exist in a philosophical vacuum; it must fit with broader scientific and ethical commitments.

  **1. Compatibility with Predictive-Processing Neuroscience**
  *   **Desideratum:** The theory must locate qualia within a framework where the brain minimizes prediction error (Free Energy Principle).
  *   **Motivating Case:** Friston/Clark. If the brain is a hierarchical prediction machine, qualia must be identified with either the predictions, the error signals, or the precision weighting. A theory that posits qualia as epiphenomenal add-ons violates the causal closure required by this model.

  **2. Moral Weight of Suffering and Pleasure**
  *   **Desideratum:** The theory must vindicate the intuition that suffering is bad *because* of its phenomenal character, not just its behavioral consequences.
  *   **Motivating Case:** The Ethics of Experience. If we turn off a pain-behavior switch in a patient but leave the feeling, it is still unethical. If qualia are incoherent, the foundation of hedonistic ethics (minimizing suffering) loses its object.

  **3. Conceivability of Philosophical Zombies**
  *   **Desideratum:** The theory must account for the intuition that a physical duplicate of a human could lack experience, without accepting dualism (if physicalist) or without accepting epiphenomenalism (if dualist).
  *   **Motivating Case:** Chalmers' Argument. If zombies are conceivable, they are metaphysically possible. If they are possible, physicalism is false. A coherent theory must either deny the conceivability (Dennett) or accommodate the possibility without breaking causal closure.

  ---

  ### V. Flagged Tensions and Incompatibilities

  It is highly probable that no single theory can satisfy all the above desiderata simultaneously. The following tensions are the critical fault lines where "quining" usually succeeds.

  **1. The Causal/Intrinsic Tension (Critical)**
  *   **Conflict:** *External Constraint 1 (Predictive Processing/Causal Closure)* vs. *Distinction 2 (Intrinsic Quality).*
  *   **Analysis:** Neuroscience requires every property to be defined by its causal role (inputs/outputs/relations). However, the definition of qualia rests on them being *intrinsic* non-relational properties. If you make qualia causal to satisfy neuroscience, they become relational/functional (violating Distinction 2). If you keep them intrinsic, they risk becoming epiphenomenal (violating Constraint 1). **This is the primary site of incoherence.**

  **2. The Privacy/Verification Tension**
  *   **Conflict:** *Phenomenon 2 (First-Person Authority)* vs. *Charge 1 (Private Language).*
  *   **Analysis:** To preserve First-Person Authority, the experience must be essentially private and incorrigible. To answer the Private Language charge, the content of the experience must be publicly verifiable or structurally shareable to have meaning. Strengthening one weakens the other. If I am the ultimate authority, you cannot verify my claim; if you can verify it, my authority is not absolute.

  **3. The Zombie/Moral Tension**
  *   **Conflict:** *Constraint 3 (Zombies)* vs. *Constraint 2 (Moral Weight).*
  *   **Analysis:** If zombies are possible (Constraint 3), then physical behavior does not guarantee experience. But if physical behavior does not guarantee experience, how do we assign Moral Weight (Constraint 2) in practice? If we cannot detect qualia externally, we cannot know who to protect. A theory that validates zombies makes the ethics of qualia practically inoperable.

  ---

  ### VI. Brief Evaluation of Theoretical Stances

  How do the major contenders fare against these desiderata?

  **1. Eliminativism (e.g., Dennett)**
  *   **Status:** Solves the Incoherence Charges by denying the Phenomena.
  *   **Performance:** It dissolves the Private Language and Explanatory Gap problems by arguing there is no "inner object" to refer to or explain. It satisfies Predictive Processing perfectly.
  *   **Failure:** It catastrophically fails *Phenomenon 2 (First-Person Authority)* and *Constraint 2 (Moral Weight)*. By claiming our intuition of intrinsic quality is a user-illusion, it struggles to explain why suffering matters morally if the "hurt" is just a dispositional state. It effectively "quines" qualia rather than saving them.

  **2. Representationalism (e.g., Tye, Dretske)**
  *   **Status:** Attempts to reduce Intrinsic Quality to Relational Content.
  *   **Performance:** It handles *Constraint 1 (Neuroscience)* well by identifying qualia with representational content (which has causal role). It addresses the *Private Language* charge by grounding content in external causal history.
  *   **Failure:** It struggles with *Phenomenon 1 (Inverted Spectrum)* and *Distinction 2 (Intrinsic Quality)*. If qualia are just representations, two systems representing the same wavelength have the same qualia, making inversion impossible. It often collapses P-Consciousness into A-Consciousness, failing *Distinction 1*.

  **3. Primitive-Property Dualism (e.g., Chalmers)**
  *   **Status:** Accepts Intrinsic Quality as fundamental.
  *   **Performance:** It perfectly accommodates *Phenomenon 1 (Inversion)*, *Constraint 3 (Zombies)*, and *Constraint 2 (Moral Weight)*. It validates the Explanatory Gap as a real feature of the world.
  *   **Failure:** It fails *External Constraint 1 (Predictive Processing/Causal Closure)*. By positing properties outside the physical causal web, it risks epiphenomenalism (qualia don't do anything). It also struggles with *Charge 1 (Private Language)*, as primitive private properties are difficult to integrate into a public semantic framework.

  **Conclusion on the Desiderata:**
  The list above reveals that "saving" qualia from incoherence requires a theory to perform a metaphysical tightrope walk: properties must be intrinsic enough to ground moral weight and first-person authority, yet relational enough to fit into causal neuroscience and public language. The tension between **Intrinsic Quality** and **Causal Physical Terms** is the bottleneck; satisfying one typically violates the other. A successful theory must either redefine causation, redefine intrinsicality, or demonstrate that this dichotomy is false. Until then, the charge of incoherence remains live.
