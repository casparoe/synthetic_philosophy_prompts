answer: |-
  The 17:45 to King's Cross had been stationary for twenty minutes. On the platform, Elena leaned against a pillar, scrolling through her notes on her phone. Marcus paced nearby, kicking at a discarded ticket.

  'It's the causal picture that's strangling us,' Elena said, locking her screen. 'You're assuming introspection needs a channel, like vision. But "I am in pain" isn't a report. It's constitutive anchoring. The judgement is partly constituted by the very experience it concerns.'

  Marcus stopped pacing. 'Like "I am here"?'

  'Exactly. Immune to error through misidentification. You don't need your location to beam a signal to you to know you're here. The presence fixes the truth. So, the epiphenomenalist paradox dissolves. The quale doesn't cause the belief; it anchors it.'

  'It's a pretty move,' Marcus said, 'but "I am here" is purely indexical. "I am in pain" has a classificatory component. I have to subsume the experience under the concept *pain*. If the quale is inert, what fixes that classification? It can't be the feel. It has to be the sub-personal machinery tracking the physical correlate.'

  Elena frowned. 'So you're saying I'm knowing the physical state, not the phenomenal one?'

  'I'm saying the concept application is causal. The brain sees the C-fibres firing and ticks the "pain" box. The feel is just along for the ride. If you anchor the reference but causally classify the property, you haven't saved knowledge of the *qualia*. You've saved knowledge of the physics.'

  Elena sighed, rubbing her temple. 'Alright. Uncomfortable concession: perhaps the classification *is* causal. The concept "pain" is locked to the physical state. But the demonstrative—"this"—is anchored by the feel. So I know *that* there is something here, even if the label is physical.'

  'But that leaves you vulnerable to the swap,' Marcus pressed. 'Imagine two physically identical judgers. One has qualia, one doesn't. Both say "this is pain". Under your view, the judger with qualia has a constituted truth; the zombie has a false claim. But ex hypothesi, their internal perspectives are identical. If introspection can't discriminate between the constituted state and the empty state from the inside, what work is it doing? It looks like luck again.'

  'It secures the existence claim,' Elena insisted. 'The judger with qualia knows *that* experience exists. The zombie is mistaken. The anchoring guarantees the *that*, even if the *which* is physically fixed.'

  'The *that* is cheap,' Marcus said. 'The real trouble is time. Your anchoring works only whilst the experience is present to constitute the judgement. But think about contrastive cases. "The second pain was duller than the first." By the time you make that judgement, the first pain is gone. It isn't there to constitute anything.'

  Elena went quiet. The train announcer crackled overhead, promising another ten-minute delay.

  'If the quale is gone,' Marcus continued, 'it can't be a constituent of your current memory judgement. So for any diachronic comparison, you're back to causal traces. You're relying on the physical memory state, not the feel. And if the feel didn't cause the memory, the memory is unlinked to the quality.'

  'So the anchor slips as soon as the specious present closes,' Elena murmured.

  'Precisely. And since almost all our interesting introspective claims are comparative or retrospective, your solution shrinks to a tiny window. You can know "there is something now", but you can't know "this is pain" or "that was sharper". Once you admit the classification is physical, and the anchoring is momentary, you haven't saved introspective knowledge. You've saved a momentary, ineffable glow.'

  Elena looked down the dark tunnel. 'So if I say "the ache has faded", I'm lying? Or rather, I'm guessing?'

  'Under epiphenomenalism, yes. Because the fading quale didn't cause the belief about fading. And under anchoring, the past quale can't constitute the present belief. You're left with a physical story that explains the speech, and a phenomenal story that explains nothing.'

  'Then it dies on the diachronic,' Elena said, her voice flat. 'Constitutive anchoring saves the instant, but loses the narrative. And we live in narratives.'

  'Sorry,' Marcus said, though he didn't look it. 'But at least now we know why the reading group stalled. We were trying to anchor a shadow.'

  'Train's moving,' Elena said, watching the lights approach. 'Let's see if we can causalise our way to the bar instead.'
