answer: |-
  # ADVERSARIAL COLLABORATION: TERMS OF ENGAGEMENT
  **Participants:** Marcus, Dana
  **Facilitator:** [User Name]
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS
  Both parties affirm the following statements as accurate representations of their shared ground. Neither party is required to accept the other's interpretation of these claims, only the claims themselves.

  1.  **The Cost of Collapse:** Both parties agree that a permanent civilizational collapse (human extinction or irreversible civilizational failure) would be a catastrophic event. It would eliminate all future generations. However, both agree that acknowledging this catastrophe does not automatically resolve the dispute over whether preventing it is the *top* priority compared to other moral goals.
  2.  **Stakes vs. Probability:** Both parties agree that the potential size of the future population (the "stakes") does not settle the value of an action on its own. A large stake must be multiplied by a credible probability of influence to determine expected value. Disagreement remains on whether those probabilities are knowable or significant.
  3.  **Value vs. Influence:** Both parties agree that there are two distinct questions: (a) Is the far future potentially valuable? and (b) Can present-day actions reliably influence that future? Agreement on (a) does not imply agreement on (b).
  4.  **Identity Matters:** Both parties agree there is a moral distinction between benefits conferred on people who would exist regardless of our actions (making lives better) and benefits that consist in causing different people to exist (bringing lives into existence). They disagree on how much moral weight the latter carries.
  5.  **Uncertainty:** Both parties agree that there is high uncertainty regarding causal chains extending centuries into the future. They disagree on whether this uncertainty renders calculation impossible (Dana) or merely difficult but manageable (Marcus).
  6.  **Good Faith:** Both parties agree to interpret the other's arguments charitably and to update their views if presented with evidence that meets the criteria outlined in Section 5.

  ## 2. DISAGREEMENTS
  The following table outlines the specific remaining disagreements. Each formulation is drafted to be signable by the respective party.

  | Question | Marcus's Position | Dana's Position |
  | :--- | :--- | :--- |
  | **Epistemic Access**<br>Can we reliably estimate the sign and magnitude of our impact on the far future? | Yes. While uncertain, we can identify leverage points where small interventions shift trajectory probabilities enough to justify action based on expected value. | No. Causal chains over centuries are too complex. Effects wash out into noise. We cannot distinguish signal from noise, making expected value calculations multiplication of guesses. |
  | **Population Ethics**<br>Does preventing extinction count as a benefit if it changes who comes to exist? | Yes. The loss of potential future lives is a major moral harm, regardless of the non-identity problem. Preventing extinction preserves the possibility of value. | Unsettled/No. Ordinary morality focuses on making existing people better off. Preventing collapse helps future people only if they would have existed anyway; "lost" potential people are not a comparable loss. |
  | **Resource Allocation**<br>Should we prioritize robust near-term gains or speculative long-term bets? | No. Long-term expected value dominates near-term gains because the stakes are orders of magnitude larger, even with low probabilities. | Yes. Robust, measurable returns for currently living people are preferable to speculative bets with unknowable probabilities and contested moral value. |
  | **Timing Strategy**<br>Is holding resources for later high-leverage moments a valid strategy? | Yes. Influence is concentrated in specific future moments. Waiting and accumulating resources is rational if it allows for higher-impact deployment later. | No. This is effectively procrastination. Resources lose value through delay, and the assumption that we will know more later is not guaranteed. |

  ## 3. CRUXES AND PREDICTIONS
  This section identifies sub-questions where settling the matter would move at least one party. For each crux, a concrete case or hypothetical is provided, along with each party's stated position and prediction.

  ### Crux 1: The Half-Life of Influence
  **Question:** Do the identifiable effects of present-day actions last across centuries, or do they wash out within a few generations?
  **Concrete Case:** Historical tracing of a major policy reform (e.g., a non-proliferation treaty or a foundational rights declaration) over a 200-year period.
  **Predictions:**
  *   **Marcus:** Expects that careful analysis will show a detectable shift in trajectory or risk probability persisting beyond 100 years. He predicts we can find historical examples where early intervention clearly altered the long-term path.
  *   **Dana:** Expects that analysis will show effects decaying to statistical noise within 3–4 generations (approx. 100 years). She predicts that apparent long-term effects are actually due to later, unrelated factors.

  ### Crux 2: The Different-People Point
  **Question:** If we accept the Non-Identity Problem (that averting collapse changes who is born), does Marcus's case survive?
  **Concrete Case:** A philosophical commitment to whether "potential people" count as moral patients equivalent to "actual people."
  **Predictions:**
  *   **Marcus:** Predicts that even if we grant the Non-Identity Problem fully, the intuition that extinction is uniquely bad remains robust enough to dominate near-term concerns. He believes the loss of potential is sufficient weight.
  *   **Dana:** Predicts that if Marcus consistently applies the Non-Identity Problem, his expected value calculations drop by orders of magnitude, falling below the threshold for prioritizing extinction risk over near-term suffering.

  ### Crux 3: Steering vs. Option Value
  **Question:** Should the aim be steering the future toward outcomes we currently think are good, or protecting later generations' ability to decide for themselves?
  **Concrete Case:** Funding allocation between specific value-lock-in research (ensuring AI aligns with *current* values) vs. general governance flexibility (ensuring future people can choose *their* values).
  **Predictions:**
  *   **Marcus:** Predicts that maximizing "option value" still requires accepting astronomical stakes. If you remove the assumption of astronomical future lives, the value of preserving option value drops too low to justify current sacrifice.
  *   **Dana:** Predicts that maximizing "option value" is robust even without astronomical stakes. Preserving freedom for future people is valuable for the sake of the near-future people who will inherit that freedom, regardless of population size.

  ### Crux 4: The Lock-In Case
  **Question:** Suppose you could either (A) make extinction basically impossible but permanently freeze in a mediocre value system, or (B) leave things risky (real chance of collapse) with the future's values wide open. Which do you take?
  **Concrete Case:** A forced choice between safety/stagnation and risk/freedom.
  **Predictions:**
  *   **Marcus:** Would likely choose (B) Open/Risky. He fears that locking in mediocre values for an astronomical future is worse than a risk of extinction. This reveals his argument is about the *quality and scope* of the future, not just existence.
  *   **Dana:** Would likely choose (A) Safe/Locked. She prioritizes ensuring people exist and survive over optimizing the value system they hold. This reveals her argument is about the *certainty of benefit* to existing/near-future people.
  **Revelation:** This crux tests whether the disagreement is about the *size of the stakes* (Marcus) or the *priority of existence over quality* (Dana).

  *(Note: If historical tracing [Crux 1] proves inconclusive due to data limitations, both parties agree to acknowledge the limitation rather than forcing a interpretation.)*

  ## 4. VERBAL DISPUTES
  Both parties acknowledge that some disagreements stem from using the same terms to describe different concepts.

  *   **"Expected Value":** Marcus uses this as a decision rule that accepts high uncertainty if the stakes are high enough. Dana uses this as a calculation that requires reliable input probabilities; without them, she considers the term meaningless.
  *   **"Robust":** Dana means "high confidence of positive sign across many models." Marcus means "positive expected value even when accounting for low probability and high uncertainty."
  *   **"Existential Risk":** Marcus defines this as "permanent loss of potential value." Dana defines this as "death of current and near-future people."
  *   **"Dominates":** Marcus means "mathematically larger term in the equation." Dana means "practically actionable priority given epistemic limits."

  ## 5. EVIDENCE AGAINST AND UPDATE CONDITIONS
  This section defines what each party would count as evidence against their own position.

  **Marcus:**
  *   **Would Update If:** Historical analysis demonstrates that no policy intervention has ever had a traceable effect on societal trajectory beyond 100 years.
  *   **Would Update If:** A consensus emerges in population ethics that potential lives carry zero moral weight compared to existing lives.
  *   **Risk of Reinterpretation:** Marcus might argue that specific interventions (e.g., AI safety) are fundamentally different from historical policy reforms, insulating his view from historical data.

  **Dana:**
  *   **Would Update If:** A method is demonstrated for reliably predicting the sign of interventions centuries out, validated against historical data.
  *   **Would Update If:** Philosophical consensus validates that preventing the non-existence of future people is morally equivalent to saving existing lives.
  *   **Risk of Reinterpretation:** Dana might argue that even with better predictions, the complexity remains too high for action, or that the moral consensus is still irrelevant to practical priority.

  **Joint Agreement on Moving the Debate:**
  Both parties agree that **Crux 1 (Historical Tracing)** is the only empirical test likely to genuinely move the debate. If influence decay is proven rapid, Marcus must lower his probability estimates. If influence persistence is proven stable, Dana must acknowledge causal access is possible. Both agree that philosophical arguments alone (Crux 2) are unlikely to resolve the dispute without empirical backing on influence.
