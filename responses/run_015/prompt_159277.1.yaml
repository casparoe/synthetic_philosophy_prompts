      Dear Colleague, it is a pleasure to address a peer who understands that intuition without procedure is merely taste. Your provisional scheme is remarkably sound for a physicist entering philosophy, though your worries are well-placed. The substitution test measures robustness, which is evidence for autonomy but not identical to it; a regularity can be robust yet fully reducible. The prediction test measures information loss, which is ontic if the degeneracy is physical rather than notational. The derivation debt is not about human finitude but about conceptual clarity; a claim is empty if the author cannot sketch the bridge they claim to transcend. Here is the procedure you requested, refined to handle the edge cases you described, followed by its application and limitations.

      Begin with the derivation debt. Ask first whether the manuscript specifies the micro-level constituents and dynamics sufficiently to make a derivation conceivable. If the micro-level is contested or unknown, as in biology, require the authors to define a functional class of micro-components that would suffice for the macro-behaviour. If the paper claims emergence but cannot describe what would be derived, or if the micro-description is so vague that no derivation is even in principle possible, terminate with a negative verdict. This is not a demand for completion but for coherence. Second, apply the substitution test. Ask whether the macro-regularity persists if the micro-constituents are replaced by others with different internal dynamics but the same interaction topology. If the regularity dissolves when you change the details, it is a property of the parts, not an emergent feature of the collective. In cases where the micro-level is unknown, require the authors to show that the macro-behaviour is invariant across a range of plausible micro-models. If the behaviour depends on specific biological mechanisms claimed to be unique, the emergence claim fails. Third, apply the two-way prediction test. Assess whether the macro-state can be predicted from the micro-state without tracking every degree of freedom, and crucially, whether the micro-state can be reconstructed from the macro-state. If the macro-state compresses the micro-information irretrievably, such that many micro-configurations yield the same macro-outcome, the macro-level possesses autonomy. If the micro-state is fully recoverable, the macro-description is merely a summary.

      Regarding downward causation, do not accept causal arrows unless the mechanism is specified. If the paper claims the macro-state constrains the micro-parts, require a description of the physical feedback loop. If the constraint is merely statistical or contextual without a mechanistic pathway, treat it as a descriptive convenience rather than ontological emergence. For the contested micro-level, the procedure stops at the functional substitution step; if the authors cannot demonstrate robustness across plausible micro-models, the claim remains speculative. You must decide whether speculation warrants publication, but the procedure tells you the evidence is incomplete.

      Applying this to your three cases clarifies your instincts. The traffic paper passes. The derivation debt is clear: Newtonian drivers versus behavioural models. The waves survive substitution of driver types or vehicle dynamics, provided the feedback loop exists. The macro-state density predicts flow, but knowing the flow does not tell you which driver braked first; the information loss is real. Accept. The critical exponents paper also passes, as you expected. The micro-physics varies wildly between magnets and fluids, yet the exponents remain invariant. The derivation debt is satisfied by renormalisation group theory, which explicitly details the limiting steps. The micro-state is utterly unrecoverable from the critical exponents. This is the paradigm case, and the procedure confirms it. The swarm agency paper, however, falters. Often these manuscripts fail the substitution test because the agency disappears if the individuals are not programmed or evolved with specific goal-seeking algorithms. Furthermore, the derivation debt is frequently unpaid; authors claim collective agency without specifying how individual rules sum to goal-directedness, often relying on metaphor. The downward causation claim usually lacks a mechanistic account of how the colony goal constrains the ant beyond local pheromones. Unless the authors can show robustness across different individual architectures, the procedure suggests rejection or major revision.

      You asked where this procedure will misfire. It will systematically over-credit effective field theories where the micro-level is known but ignored for convenience, mistaking computational pragmatism for ontological emergence. It will under-credit biological systems where the micro-level is genuinely historical and unique, penalising authors who cannot run counterfactual substitutions on evolution. It rewards authors with clear rhetorical structures who can articulate their derivation debt, potentially favouring physicists over biologists who work with messier ontologies. Finally, it cannot settle whether emergence is real or merely epistemic; it only tests whether the claim is well-formed and supported by the evidence provided. It distinguishes careful science from loose metaphor, but it cannot tell you whether the universe is layered or flat. That decision remains yours, and rightly so, for it is a policy decision for the journal, not a fact about the system. Use this to filter the incoherent, but trust your judgement on the rest.

