      *   Lying is always wrong, regardless of consequences.
      *   Truthfulness is a formal duty owed to humanity generally.
      *   One is not responsible for the unforeseen consequences of telling the truth (the murderer might leave, trip, repent, etc.).
      *   One *is* responsible for the violation of duty if one lies.
      *   Silence or evasion is permissible if it doesn't constitute a false statement, but if the scenario forces a choice between silence (which signals truth) and lying, Kant must maintain that lying violates the categorical imperative.
      *   The key argument is about the integrity of the source of right (Rechtsquelle). If lying is permitted, all contracts and rights become unstable.

