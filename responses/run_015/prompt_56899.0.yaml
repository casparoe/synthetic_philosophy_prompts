answer: |-
  **SECTION B: ESSAY QUESTION**
  **Time Allowed: 45 Minutes**
  **Marks: 25**

  **Question 1**
  Read the following case carefully before answering the four parts below.

  *A soil bacterium bears a surface coat assembled from a single protein; call the coat the mantle. The phylogenetic record of the lineage shows that the mantle arose and swept to fixation at a time when a virulent bacteriophage was endemic to the lineage's habitat, and the resistance the mantle confers against that phage is what explains the trait's presence in the lineage. That phage has been absent from the habitat ever since. The habitat is now subject to severe seasonal desiccation, and the mantle is the principal means by which cells survive the dry season: intact cells survive drying, uncoated cells do not. Two laboratory populations are available. Population W was isolated recently from the wild and has never been subjected to artificial selection; its history is exactly as described. Population L was derived from W three hundred generations ago and has since been selected every generation for desiccation tolerance; the mantle gene in L is identical in sequence to that in W. In both populations the mantle additionally stiffens the cell envelope against osmotic shock, serves as a nitrogen source for neighbouring kin when cells lyse, binds trace zinc, and slightly increases cell mass and settling rate. Finally, a single-base deletion truncates the mantle protein: mutants in both populations assemble a partial coat that retains stiffness, nitrogen value, zinc binding and settling, and that fails only at desiccation tolerance. Under the wet, phage-free conditions in which both populations are maintained, mutants are indistinguishable in fitness from normal cells; under drying, both die.*

  (a) Apply the strict criteria of the causal-role account and the etiological account to determine which effects of the mantle count as *functions* in Population W and which in Population L. Do not appeal to intuition; derive your answer from the definitions. (5 marks)

  (b) Explain why these two accounts must disagree about whether these molecule-for-molecule identical organisms possess the same functions. (5 marks)

  (c) A causal-role theorist might attempt to secure a verdict on malfunction by anchoring the relevant containing capacity in what coats of this type *typically* do in the species. Assess this repair. Show either that it collapses into an etiological account or that it fails to deliver a genuine verdict of malfunction in the mutant. (10 marks)

  (d) Taking the case as a whole, does it license pluralism about function talk, or does it demand a single preferred account? Defend your position. (5 marks)

  ***

  **MODEL ANSWER**

  (a) Under the causal-role account, a function is any capacity contributing to the containing system's ability. In both W and L, the mantle contributes to desiccation survival, osmotic stiffness, nitrogen recycling, zinc binding, and settling. Phage resistance is not a function in either, as the phage is absent and contributes to no current capacity. Under the etiological account, a function is the effect for which the trait was selected. In W, the mantle was selected for phage resistance; desiccation survival is a beneficial accident. In L, artificial selection for desiccation over 300 generations establishes desiccation survival as a selected effect. Thus, for W, the function is phage resistance; for L, it is desiccation tolerance.

  (b) The disagreement arises because the accounts define function via different ontological grounds. The causal-role account is synchronic and forward-looking: it depends on current causal contributions to a system's capacity. Since W and L are physiologically identical in a shared environment, their causal roles are identical. The etiological account is diachronic and backward-looking: it depends on the history of selection. Since W and L have distinct selection histories (natural selection for phage resistance vs. artificial selection for desiccation), their functions differ despite molecular identity. The etiological account treats function as a historical kind, not a physical one.

  (c) The proposed repair attempts to ground malfunction in statistical typicality: if most mantles confer desiccation tolerance, the mutant malfunctions. However, this faces a dilemma. First, if "typically" means statistically normal, the repair fails to capture normativity. A mutant is merely a variant; if the variant dies in dry conditions, it is unfit, but not necessarily malfunctioning in a normative sense. Without a goal, failure is just difference. To secure genuine malfunction, the theorist must claim the mutant fails to do what it *ought* to do. This requires a norm. If the norm is derived from current utility, we return to the problem that utility is interest-relative. To objective the norm, the theorist must anchor "typical" in what the trait was *selected for*. But this is precisely the etiological definition. Thus, the repair either collapses into the etiological account to save normativity or remains purely descriptive and loses the concept of malfunction entirely. It cannot have it both ways.

  (d) This case licenses pluralism only if one accepts that "function" ambiguously refers to both current utility and historical purpose. However, biology requires a robust notion of malfunction to distinguish pathology from variation. The causal-role account cannot distinguish a broken trait from a trait merely unused in the current context without importing historical norms. Therefore, while causal-role explanations are useful for physiological mechanism, the etiological account is preferred for biological function because it alone sustains the normativity required to judge the mutant as malfunctioning rather than merely different. A single preferred account is necessary to preserve the explanatory power of functional ascriptions in evolutionary biology.

  ***

  **MARKING SCHEME (25 MARKS)**

  | Part | Move | Marks | Characteristic Fumble |
  | :--- | :--- | :--- | :--- |
  | **(a)** | **Causal-Role Assignment:** Identifies desiccation (plus side effects) as function for both W & L; excludes phage. | 2 | Treats phage resistance as function because it is "useful" historically. |
  | | **Etiological Assignment:** Identifies phage resistance for W; desiccation for L. | 2 | Claims L and W have same functions because genes are identical. |
  | | **Derivation:** Explicitly links assignments to definitions (current capacity vs. history). | 1 | Appeals to intuition ("it seems like a function") rather than criteria. |
  | **(b)** | **Synchronic vs. Diachronic:** Identifies current contribution vs. historical selection as the source of divergence. | 3 | Describes the disagreement but fails to identify the temporal/ontological root. |
  | | **Identity Irrelevance:** Notes that molecular identity matters only to causal-role, not etiology. | 2 | Suggests molecular identity should dictate function for both accounts. |
  | **(c)** | **The Dilemma:** States that "typical" is either statistical (no norm) or selected (etiology). | 4 | Treats "typical" as a magic bullet without analyzing its grounding. |
  | | **Normativity Failure:** Explains why statistical typicality cannot ground "malfunction" (ought vs. is). | 3 | Treats interest-relativity as pragmatic caveat rather than fatal to malfunction. |
  | | **Collapse Argument:** Demonstrates that saving normativity requires importing selection history. | 3 | Asserts collapse without showing the logical necessity of the move. |
  | **(d)** | **Verdict:** Takes a definite stance (Pluralism or Monism) rather than surveying. | 2 | Declares a "draw" or says "both have merits" without adjudication. |
  | | **Justification:** Links verdict to the necessity of normativity/malfunction in biology. | 3 | Justifies verdict via aesthetic preference or complexity rather than conceptual need. |

  ***

  **MARKER'S NOTE**

  A first-class script treats Part (c) as the philosophical pivot: it recognises that "malfunction" is the wedge issue that forces the causal-role theorist to choose between descriptive accuracy and normative force. These candidates will demonstrate that without etiology, "malfunction" dissolves into "statistical rarity." A competent second-class script will correctly answer Part (a) and describe the disagreement in Part (b), but will stall in Part (c), treating the "typical capacity" repair as a viable middle ground rather than exposing its instability. Look for adjudication, not accommodation.
