  I'm at about 0.35 on L. A friend is at 0.05 and thinks the pull we feel is a leftover heuristic we use when picking institutions under uncertainty. Give me your number and the decomposition that gets you there.

  Terms I'd want split out (drop or add as you see fit):
  - how much turns on there being any non-instrumental distribution-sensitivity in value at all, vs everything real being captured by some weighted sum of individual welfare plus the instrumental and relational bits
  - given that, how much on it attaching to outcomes as such, rather than only to how people treat each other and what institutions express
  - how much on the judgment surviving full sterilization of the kind described above
  - how much on the pull actually tracking something true but different — the expected value of using an equality-sensitive decision rule when you don't know who'll end up worst off, or the value of not having your standing fixed by comparison to others — rather than the value of the pattern itself
  - and separately, whether "better in one respect" is even well-formed here, or whether the disagreement bottoms out in a verbal one

  Say how the terms combine, and if they aren't independent say so instead of just multiplying them out. Then: which term your final number is most sensitive to, and which single consideration would move you furthest in either direction.

  Two variants I've been chewing on, since I think the action is in them and I genuinely can't tell which way they cut:

  1. The sandpile one. Billion-ish people, the well off at 100, everyone else at 60. The change shaves a sub-perceptual sliver off the well off — nobody's life is worse in any way they could notice from the inside — and destroys it, closing the gap. Same total loss as if you'd dumped all of it on one identifiable person. Is L more or less plausible in the spread version? Does "no one is made worse off" start to look true-ish here, or does the loss just become invisible while staying completely real?
  2. The veil one. Nobody knows their own position or anyone else's, everyone's expectation about their own welfare is the same before and after, and everyone's expectation is lower after. So it's worse for everyone ex ante and worse for the unlucky ones ex post. Does "better in one respect" even have a subject here — better for whom, or in what way?

  And one thing I couldn't make work: the usual story is that prioritarianism just dodges the objection, since it's a sum over weighted individual welfare and pure levelling down lowers every term. But what if the weights track something relative — how far below the median or the mean of your reference group you are — instead of an absolute level? I tried to build a case where that version favours levelling down and couldn't get it to come out; is there one, or is there some structural reason relativizing keeps you safe here? If there is one, that pushes me up.

  Also: where do you think me and my friend most likely actually disagree, and what would count as resolving this at all, if you think anything could?

  Lead with your bottom line in the first sentence — the number and the one-line reason — then the reasoning. No preamble, and don't restate the question back at me. Table for the decomposition is fine. I'd rather have 700 dense words than 1500 padded ones, k thanks.
