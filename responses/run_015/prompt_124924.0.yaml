  I'm preparing a presentation for an advanced high school philosophy-of-science seminar, and I need a satirical piece that illustrates the conceptual tension between etiological and causal-role theories of biological function without relying on strawmen. Please write a mock appellate-court opinion of approximately 600 words, rendered in the deadpan formal register of judicial writing, adjudicating whether the human appendix currently possesses a "function" in light of the premise that it secretes a defensive peptide during episodes of gut dysbiosis. The opinion should treat the etiological view—function as the evolutionary selected effect for which a trait was historically maintained by natural selection—and the causal-role view—function as a trait's present contribution to the capacity of a containing system—as competing legal doctrines, each with its own "precedent," "standing" requirements, and "certification" tests. The satire should come from applying procedural legal formalism to a biological debate: the court should demand phylogenetic audits, treat evolutionary history as binding case law, and issue an injunction preventing either account from being invoked without documented selection history. Include one dissent arguing that because the peptide secretion is an exaptation—an evolutionary repurposing rather than an original adaptation—the appendix is functionless under both doctrines, and therefore the court should declare biological function "unjusticiable" in all cases of evolutionary repurposing. The humor must depend on an accurate representation of both philosophical positions rather than invented distortions, and the piece should remain legible to a reader without specialist training. Do not ask for citations, bibliographies, or reading lists.
