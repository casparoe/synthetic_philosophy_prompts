answer: |-
  1. The purity framing mischaracterizes the motive, as deontologists prioritize respecting persons as ends rather than avoiding personal moral stains. A defender would wince at the suggestion that the focus is on the agent's cleanliness instead of the victim's rights.
  2. It is flat wrong to claim deontology forces total inaction, since the theory distinguishes between killing and letting die without forbidding all intervention. Defenders argue you can act to stop murders provided your actions do not themselves violate rights, rather than mandating passive observation.
  3. Side-constraints are not merely fancy language for vanity but represent the claim that individuals cannot be used as mere means regardless of the aggregate good. Dismissing this as semantic trickery ignores the core argument that rights create barriers against utilitarian calculation.
  4. The hundred-people-lie case is an unfair test because it presents a false dichotomy that ignores nuanced frameworks weighing duties against one another. Asserting that consistency requires absolute rigidness misrepresents how deontologists handle conflicting obligations without abandoning core principles.
  5. The vanity conclusion fails because prioritizing duties to others is fundamentally other-regarding rather than self-regarding. Accusing this of selfishness conflates maintaining moral integrity with caring more about oneself than the victims.
