  ok so me and my friend got into it last nite about the paradox of deontolgy and he summed it up like this: deontology says you can never kill an innocent person even to stop five other people from killing five innocents, because wrongness is like a moral stain that can't be washed away by good results. So if you sit back and let five murders happen your hands stay clean, but if you kill one to stop them you've broken an absolute rule and become a murderer yourself. He says this proves deontology is just moral vanity — caring more about your own purity than actual lives — and that the only consistent deontologist is someone who'd let a hundred people die rather than lie. He also said some deontologists try to escape by calling rights side-constraint blocks that only apply to direct action, but he thinks thats just fancy language for the same vanity thing.

  how fair is that summary? break it into exactly five numbered items, each one or two sentences max, with no intro or conclusion. check whether the purity framing is accurate, whether deontology really forces you to sit back and do nothing, whether side-constraints are being misused here, whether the hundred-people-lie case is a fair test, and whether the vanity conclusion actually follows from anything true in the summary. don't list books or cite anyone, just tell me straight what a defender would wince at and what's flat wrong.
