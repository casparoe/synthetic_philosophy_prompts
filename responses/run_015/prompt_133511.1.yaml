answer: |-
  The purpose the criteria are written for
  The theory must enable public ranking of interventions across biologically and computationally diverse candidates under metaphysical uncertainty. It must yield action-guiding verdicts without presupposing a resolved philosophy of mind. If no theory satisfies these constraints, the body must acknowledge that ranking is impossible rather than fake precision. I proceed assuming adequacy is possible but fragile. The specification defines the minimum viability conditions for any account claiming to guide policy here. It serves as a filter for theoretical adequacy.

  The requirements
  1. **Behavioral Dissociation (Hard):** The theory must distinguish nociceptive reflex from experienced pain. It must accommodate insects that groom wounds yet function after decapitation without vertebrate-like flexibility, avoiding false positives on reflex arcs. If avoidance survives decapitation, the theory must explain why this lacks the motivational trade-offs required for pain.
  2. **Covert Capacity (Hard):** Status cannot depend solely on output. It must account for anaesthetized or vegetative patients with hidden awareness versus those without, ensuring covert consciousness is not morally neglected. Behavioral silence must not entail moral nullity when internal processing persists.
  3. **Aggregation Structure (Hard):** The theory must specify if status is cardinal, ordinal, or lexical. This resolves conflicts where many low-status candidates might outweigh one high-status candidate, preventing undefined trade-offs. It must declare whether numbers count. This prevents undefined trade-offs.
  4. **Subject Individuation (Hard):** It must define subject boundaries to prevent double-counting nested systems. Eusocial colonies or human enteric nervous systems require clear rules on whether the whole, the parts, or both count. Double counting inflates moral stakes artificially and distorts intervention priorities.
  5. **Substrate Neutrality (Hard):** It must not rely on human-specific biology when behavior and function are indistinguishable. This avoids question-begging against alien substrates or AI claiming experience indistinguishable from humans. Physical composition cannot be the sole determinant when behavior and function are indistinguishable.
  6. **Non-Arbitrary Transition (Hard):** It must locate status changes in continuous series, such as neuron-to-silicon replacement. Vagueness here renders decisions impossible; the theory must commit to continuity or abruptness with justification. A sorites susceptibility undermines action-guidance in borderline cases.
  7. **Path Stability (Soft):** Verdicts should not vary wildly across different interpolation paths between the same endpoints. If a thermostat becomes human-like via different functional upgrades, status assignments should not contradict arbitrarily. Instability suggests the metric is sensitive to irrelevant historical details.
  8. **Open-Ended Capacity (Soft):** It must permit status exceeding typical humans if integration, discrimination, or temporal windows exceed human norms. Rejecting this imposes an arbitrary cap based on human prejudice rather than capacity. Superior beings deserve superior consideration if capacity grounds status.
  9. **Uncertainty Handling (Hard):** It must provide decision rules for low-probability, high-stake sentience. It cannot collapse into paralysis or allow minuscule probabilities to dominate rankings via Pascal's mugging when evidence is poor. Practical action requires bounded risk assessment to remain feasible. It must weigh the cost of error against the probability of subjecthood.
  10. **Public Evidence (Hard):** Criteria must rely on observable or scientifically inferable properties, not private introspection. This ensures reasons are engageable by disagreeing parties under deep metaphysical uncertainty. Private access cannot ground public policy.

  Genuine desiderata and camp prejudices
  The demand for a single comparable number is an administrative preference, not an ethical necessity; incommensurability may be true. Forcing cardinality onto lexical values distorts moral reality to fit cost-benefit models. Conversely, insisting on species boundaries is a prejudice unless tied to relevant capacities, yet rejecting them entirely ignores potential biological correlates of consciousness. However, demanding path stability across all interpolation series may be a mathematical impossibility rather than a genuine ethical requirement. We must distinguish between what makes ranking *easy* (cardinality) and what makes it *true* (capacity). The prejudice lies in assuming ethics must be computable like economics. Demanding a single number forces false precision on multidimensional value. Demanding no species boundary is correct only if species correlate with nothing morally relevant, which is an empirical claim, not a priori. We should treat computability as a soft constraint and truth as hard. Requiring human-specific markers begs the question against AI; requiring functional equivalence alone risks over-attribution. The genuine desideratum is explanatory power, not conformity to human intuition.

  Where the list is unsatisfiable
  The interpolation constraint conflicts with substrate neutrality and non-arbitrary transitions. If status supervenes on continuous physical variables, any threshold is arbitrary; if it supervenes on discrete functional states, path stability fails when functions are realized differently. You cannot have a non-arbitrary threshold on a continuum without invoking a metaphysical brute fact. I would sacrifice Path Stability. It is better to admit verdicts vary by model than to posit magic boundaries. The aggregation requirement also clashes with lexical views; you cannot satisfy both cardinal aggregation and lexical thresholds simultaneously. If humans are lexically superior, no number of insects outweighs one human, violating cardinality. This is a fundamental incompatibility. The list implies that if stability across interpolation paths cannot be had together with a non-trivial verdict, this is a result about the list itself. We must accept that some rankings will remain sensitive to modeling choices. The cost of keeping Non-Arbitrary Transition is accepting brute facts; the cost of keeping Stability is accepting trivial verdicts. We must choose which vagueness we prefer. Furthermore, Uncertainty Handling conflicts with Open-Ended Capacity under Pascal's Mugging conditions. If status is unbounded and probability non-zero, expected value dominates all else. To avoid this, one must cap status or discount probability, violating other criteria. Thus, the list contains triadic tensions.

  The requirement that excludes the most
  Substrate Neutrality excludes most biological chauvinist views. However, Non-Arbitrary Transition is harder. It kills vague phenomenological accounts. But actually, Uncertainty Handling is the practical killer. Many theories work in principle but fail when probabilities are tiny and stakes astronomical. I'll pick Non-Arbitrary Transition on continua. It forces a commitment to specific metaphysics (emergence vs. fundamental) that most theories lack. It excludes any view that treats consciousness as a vague natural kind. This is the highest barrier because it demands precision where nature offers gradients. Most plausible accounts rely on cluster concepts that fail this test. It is the most exclusionary because it demands precision where nature offers gradients.

  Scorecard
  **Simple Threshold:** Fails interpolation and aggregation criteria. It cannot handle continuous replacement or many-vs-one conflicts well. However, it performs adequately on uncertainty by binary classification. It is too blunt for graded interventions.
  **Additive Intensity:** Handles aggregation well, summing pain across candidates. It fails lexical intuitions on humans versus insects, allowing vast insect suffering to outweigh human life. It satisfies cardinality but risks counterintuitive trade-offs. The Additive view is most usable for policy but least defensible metaphysically.
  **Multi-dimensional:** Handles capacity variance effectively, distinguishing types of suffering. It fails the single ranking requirement if one is demanded, producing partial orderings instead. It is philosophically robust but administratively difficult. The Threshold view is easiest to implement but ignores graded sentience.
  **Precautionary:** Handles uncertainty well, prioritizing potential subjects. It risks paralysis or Pascal's mugging without caps on status or probability discounting. It is safe but potentially inefficient. The Precautionary view is safest for moral risk but hardest to budget.
  **Winner:** Multi-dimensional with precautionary weighting is most robust, though hardest to compute. It best accommodates the diversity of candidates without forcing false precision on aggregation. Ultimately, it balances philosophical rigor with practical application.
