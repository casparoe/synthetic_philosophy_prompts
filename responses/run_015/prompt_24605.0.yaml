  ### The Causal Identifiability Principle

  A statistical reversal between aggregate and subgroup rates constitutes an actionable Simpson's Paradox warranting stratification if and only if the grouping variable $Z$ satisfies the **Back-Door Criterion** for the causal effect of Treatment $X$ on Outcome $Y$, or if the ethical estimand requires isolating the **Direct Effect** of $X$ from $Z$.

  This principle rests on three clauses derived from your cases:

  1.  **The Confounding Clause:** Stratify if $Z$ is a common cause of $X$ and $Y$ (a pre-treatment confounder). Stratification blocks the non-causal back-door path, revealing the true causal effect.
      *   *Motivation:* This validates your verdict on **(A)**. The "sickness" variable causes both treatment assignment and recovery; stratification removes this bias.
  2.  **The Collider Clause:** Do not stratify if $Z$ is a common effect of $X$ and $Y$ (a collider). Conditioning on $Z$ opens a spurious path, inducing bias where none existed.
      *   *Motivation:* This validates your verdict on **(B)**. Conditioning on the collider creates the reversal artificially; the aggregate is less biased.
  3.  **The Estimand Clause:** If $Z$ is not a confounder, stratification is only warranted if the question shifts from the **Total Effect** (aggregate) to the **Direct Effect** (within-group).
      *   *Motivation:* This accommodates **(D)** (Fairness) by defining the goal as measuring Direct Discrimination, and **(C)** (Composition) by noting that without a causal link, there is no bias to correct, only description.

  ### Application to Case (F): The Mediator
  In your case (F), the grouping variable is a consequence of the treatment ($X \to Z \to Y$). Under the **Estimand Clause**, conditioning on $Z$ blocks the causal pathway through which $X$ operates.
  *   **Verdict:** This is **not** Simpson's Paradox; it is **Mediation Analysis**.
  *   **Action:** Do not stratify if you want the **Total Effect** (the overall impact of the policy). Stratify only if you specifically need the **Direct Effect** (the impact of $X$ excluding the mechanism $Z$). Reporting the stratified rate as the "true" effect would be an error if the mediator is part of the intended mechanism.

  ### Application to a New Case (G): Effect Modification
  Consider a case where a treatment improves recovery by 20% in Men and 10% in Women, with no confounding. The aggregate shows a 15% improvement.
  *   **Analysis:** There is no reversal of sign, only a difference in magnitude. $Z$ is an effect modifier, not a confounder.
  *   **Verdict:** Under the **Confounding Clause**, stratification is not required to correct bias, but is useful to characterize heterogeneity. This is not a paradox; both aggregate and subgroup rates are "correct" for their respective populations (ATE vs. CATE).

  ### Honest Accommodation and Overturn
  My principle accommodates (A), (B), (C), and (D) by mapping them to specific causal structures and estimands. It resolves (F) by reclassifying it as mediation.

  However, it cannot accommodate your verdict on **(E)**. In **(A)**, you correctly identified that when a reversal is driven by confounding, the aggregate rate is biased and the subgroup rate is the truth. In **(E)**, you claim that in a reversal scenario, "both are right" (Aggregate for Policy, Within for Individual). If the reversal is statistical (sign flip) and driven by the same causal structure as (A), the aggregate estimate is biased for the causal effect of the treatment. A policy based on the biased aggregate (e.g., "do not treat") would be objectively wrong if the treatment helps every subgroup. You cannot have "both right" regarding the *efficacy* of the treatment; one estimate is unbiased, and the other is confounded. If (E) implies different *utility* functions (cost vs. health), it is not a statistical paradox; if it implies the same outcome, one answer is false.

  Overturned: E
