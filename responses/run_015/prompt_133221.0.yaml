  The projector hummed, a low B-flat that seemed to vibrate in the silence of the seminar room. Mara clicked the clicker, advancing to the slide titled *Figure 3: The Zero-Attachment Parameter.*

  "The standard model assumes agents maximize utility based on preferences," Mara said, her voice steady despite the dryness in her throat. "My model assumes agents have no preferences. No attachment to place, no loyalty to kin, no fear of the unknown. They are pure calculators of cost and benefit. And yet."

  She gestured to the graph. Two lines overlaid each other with eerie precision. One line represented the model's output for rational agents optimizing housing costs against income potential. The other represented actual census data for widows and widowers relocating within six months of a spouse's death.

  "The reverse F-twist," said a voice from the back. It was Elias, leaning forward, his glasses catching the glare of the screen. "Friedman said assumptions don't need to be realistic if the predictions work. You're assuming humans are sociopaths to predict their deepest sorrow."

  "I'm assuming the structure of grief mimics the structure of rational calculation," Mara corrected. "When a partner dies, the 'cost' of staying in the shared home spikes. In my model, there is no pain, only a sudden inefficiency in the housing asset. The agent leaves. In reality, the agent leaves because the house is full of ghosts. The outcome is identical."

  "But the mechanism matters, Mara," Elias said. He stood up, walking toward the front where the coffee urn sat neglected. "If your cold model predicts grief-driven behavior, you're implying one of two things. Either grief is secretly rational—a cold optimization of pain—or your unrealistic assumption is hiding a deeper law we don't understand. You're modeling the shadow and claiming you've found the object."

  Mara's hand hovered over the laptop trackpad. She had prepared a rebuttal about structural equivalence, about how sociology often mistakes correlation for causation. But she didn't say it. She was looking at the small window minimized on her desktop, the raw data dump she had used to validate the initial run.

  She remembered entering her own demographic profile into the test set three years ago. It was a habit of hers, stress-testing the algorithm against known variables. She had input her income, her square footage, her commute, her marital status. Single. No children.

  She clicked the window open, hiding it behind the presentation slide so only she could see the coordinates.

  *Subject ID: 8940-M.*
  *Prediction Timestamp: October 14, 2021.*
  *Projected Action: Relocation.*
  *Confidence: 98.4%.*

  Mara felt the air leave the room. She hadn't moved in 2021. She hadn't even thought about moving in 2021. She loved her apartment. She loved the city. Her mother was still alive then, living in the care facility upstate, visiting every Sunday.

  The model hadn't predicted she would leave because of a death. It predicted she would leave based on the cold arithmetic of her life: the rent-to-income ratio, the decay of local social networks, the diminishing returns of her career trajectory. According to the Zero-Attachment Parameter, Mara should have left years ago. It was the optimal move.

  She hadn't left because she was attached. She stayed for her mother. She stayed for the coffee shop on the corner, for the way the light hit the fire escape. Irrational attachments.

  Then, six months ago, her mother died. The grief had been a physical weight, a crushing inability to breathe in the apartment where the phone used to ring every Sunday. She had packed boxes in a fugue state and moved to Chicago last week. She told her friends she was running away from the grief. She told herself she was fleeing the silence.

  But the model, assuming she felt nothing, assuming she was a hollow creature of pure logic, had flagged her for departure in 2021.

  "Mara?" Elias prompted. The room was quiet. The hum of the projector seemed louder now. "Is grief rational? Or is the math just good at hiding the ghost?"

  Mara looked at Elias, then at the graph where the red line of human sorrow perfectly tracked the blue line of cold calculation. The model suggested that her grief wasn't the cause of her move. It was merely the friction that had finally allowed her to execute a decision her life had made logically years ago. The love she felt for her mother hadn't been a reason to stay; it had been an inefficiency the market was waiting to correct.

  She looked down at her hands. They were steady. She felt nothing. Or perhaps, she felt exactly what the model said she should feel: nothing.

  "I think," Mara said, her voice sounding distant to her own ears, "that the model doesn't distinguish between the two."

  She reached for the clicker to turn off the screen, but she stopped, her finger hovering over the button. The blue line and the red line remained locked together on the wall, indistinguishable in the dim light, waiting for her to decide which one was real.
