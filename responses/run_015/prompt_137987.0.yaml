prompt: |-
  I'm a third-year PhD student in experimental psychology and I've somehow ended up on our department's research integrity committee, which in practice means I'm the one who has to write the paragraph explaining why we're adopting whatever method reform we're adopting this year. I keep tripping over the same thing, so I thought I'd ask people who do this for a living rather than keep guessing.

  Here's the bit I can't line up. Take two studies: identical design, identical n, identical measurements, identical p-value, say p = .21 in both. Study A was pre-registered with a fixed sample size and a stated smallest effect size of interest, analysed exactly as declared. Study B is the same study run before pre-registration was mandatory here; the analysis was settled after people had looked at the data, and as far as anyone can tell there was no outright fishing, just no pre-commitment. Under our new norms A counts as a genuine finding, evidence of absence, publishable, and it can be cited in a review as settling the question. B is treated as uninformative, file-drawer material, we can't conclude anything from it. Same number on the page, opposite verdicts.

  Then there's the part where I'm not sure we're consistent with ourselves. We're strict about fixing n in advance, and people get told off for peeking at the data and stopping early; the line we give them is that if you'd have carried on past n = 40, you don't get to use the p = .03 you happened to have at n = 40. At the same time, we treat a single pre-registered replication that comes back at p = .40 as a failed replication that puts the original effect in doubt, even though we'd never dream of accepting a single p = .03 as establishing anything. And our ethics committee has now started requiring a smallest effect size of interest in every application, so in principle you can have a confidence interval that includes zero but excludes anything you'd have cared about, and reviewers will say no effect there — but apparently only if the study was pre-registered, and only if someone is willing to say it out loud. Quite a few of my colleagues resist going further and just using equivalence tests with a pre-registered bound, and I genuinely can't tell whether that's methodological conservatism or an inconsistency they haven't noticed.

  So: what view of evidence does this whole package presuppose? More specifically,

  - What has to be true of evidence for pre-registration to change what a given p-value is worth, given that the data are identical in A and B? Is that a commitment to a procedural or reliabilist picture, on which evidence is a property of the method rather than of the numbers, or is there a way to get the same verdict out of a broadly Bayesian picture, e.g. by conditioning on the fact that this result was reported at all rather than just on the test statistic? If there is, does the practice really pick out the first view, or does it fit several?
  - Does the ban on optional stopping presuppose the same thing as the pre-registration bit, or a different thing? It feels like it presupposes that error rates across hypothetical repetitions matter in their own right, whereas the pre-registration asymmetry felt like it was about what the data support. If those are two different commitments, are they even compatible, and which of our rules actually follows from which?
  - How much of this is forced? Which parts of our practice would survive intact under a likelihoodist or Bayesian picture, and which would have to be abandoned? If we went properly Bayesian, priors, Bayes factors, decisions by expected loss, what exactly would we stop doing that we currently do, and what would we have to start doing that we don't?
  - Is there a genuine inconsistency between treating non-significance as we can't say in a single study and treating it as damning in a replication, or is there a single story from which both fall out?

  I don't want a reading list or citations, I can find those myself. I want the implicit epistemology reconstructed, and I want to be told which bits of it we're actually stuck with and which bits we've merely inherited from people arguing in the 1930s. If it helps: we mostly run small-N within-subjects experiments on reaction times and accuracy, nobody has any real idea what our effect sizes are, and half the lab thinks p-values should be abolished outright.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year PhD student in experimental psychology, on the research integrity committee. Tasked with writing the justification for new methodological reforms (pre-registration, sample size fixing, etc.).
      *   **Problem:** They see apparent inconsistencies in the department's norms (e.g., identical $p$-values treated differently based on pre-registration, asymmetry in how non-significance is treated in original vs. replication studies, tension between frequentist error control and evidential interpretation).
      *   **Goal:** They want the *implicit epistemology* reconstructed. They don't want a reading list. They want to know *why* the rules exist, what philosophical commitments underpin them, which are compatible, and which are historical artifacts.
      *   **Tone:** Sophisticated, peer-to-peer, direct, avoiding platitudes. They know the stats; they want the philosophy of science/stats justification.
      *   **Context:** Small-N within-subjects experiments (RT/accuracy), uncertain effect sizes, mixed opinions on $p$-values in the lab.

  2.  **Deconstruct the Specific Questions:**

      *   **Q1: Pre-registration & Identical Data (Study A vs. Study B).** Why does the *process* change the *evidential value* of identical numbers? Is it procedural/reliabilist or Bayesian (conditioning on reporting)?
      *   **Q2: Optional Stopping vs. Pre-registration.** Do these rely on the same commitment? One feels like error rate control (frequentist), the other feels like evidential support. Are they compatible?
      *   **Q3: Bayesian/Likelihoodist Survival.** What survives if we switch frameworks? What gets dropped?
      *   **Q4: Non-significance Asymmetry.** Why is $p > .05$ "inconclusive" in a new study but "disconfirming" in a replication? Is there a single story?

  3.  **Drafting the Core Argument (The "Implicit Epistemology"):**

      *   *The Hybrid Beast:* Current psychology reform isn't pure frequentism, pure Bayesianism, or pure likelihoodism. It's a *pragmatic hybrid* aimed at *trustworthiness* rather than *truth-tracking* in the abstract.
      *   *The Shift:* We moved from "What is the probability this hypothesis is true?" to "What is the probability this literature is reliable?"
      *   *Study A vs. B:* This is about the *Severity Principle* (Mayo) or *Error Statistics*. The $p$-value isn't evidence itself; it's a measure of how well the hypothesis has been *tested*. Study B didn't test it severely because the procedure allowed capitalization on chance. So, it's a **Procedural/Reliabilist** view. A Bayesian *could* rescue it by penalizing the prior probability of the analysis strategy, but the current norms are explicitly frequentist in spirit (controlling false positives).
      *   *Optional Stopping:* This is pure Frequentist Error Control (Type I error inflation). It doesn't make sense in a pure Likelihoodist view (Likelihood Principle says stopping rule is irrelevant). It *does* make sense if you care about the long-run rate of false claims in the literature.
      *   *Replication Asymmetry:* This is the trickiest part. In a new study, $p > .05$ is "insensitive." In a replication, $p > .05$ is "failure." Why? Because the *prior probability* is different. In a new study, prior is low/unknown. In a replication, prior is high (based on original). So a non-sig result updates the belief downwards significantly. Also, replications are usually powered for the *original effect size*, making them sensitivity tests.
      *   *SESOI/Equivalence:* This is shifting from "Is there an effect?" to "Is there an effect worth caring about?" This is decision-theoretic.

  4.  **Addressing Each Bullet Point Systematically:**

      *   **Q1 (Pre-reg & Evidence):** It's a **Reliabilist/Procedural** view. The data don't speak for themselves; the *process* generates the warrant. A Bayesian account *can* mimic this (by adjusting the prior on the hypothesis based on the flexibility of the analysis), but the department's rules are written in Frequentist ink. They care about the *capacity to have been wrong*, not just the posterior probability.
      *   **Q2 (Optional Stopping):** This is strictly **Frequentist Error Control**. It is incompatible with the Likelihood Principle. It is compatible with the Pre-reg view *if* the goal is long-run false positive rate control. The tension arises when people interpret the resulting $p$-value as a measure of *current* evidence (which violates the stopping rule logic). The rules assume we are managing a *system* of research, not evaluating a single mind.
      *   **Q3 (Bayesian Survival):** If you go full Bayesian:
          *   *Drop:* Fixed $N$ requirements (stopping rules irrelevant), strict $p < .05$ thresholds, the distinction between Study A and B (mostly), the "file drawer" logic (publish the posterior).
          *   *Keep:* SESOI (as a loss function/prior scale), Pre-registration (as transparency for priors, not error control), Replication (as prior updating).
          *   *Add:* Explicit priors, Bayes Factors or Posteriors, Decision thresholds based on utility.
      *   **Q4 (Non-sig Asymmetry):** It's consistent *if* you view the replication as a *test of the original claim*, not a new discovery. The null hypothesis in a replication isn't "no effect," it's "the original effect size." Failing to find the original effect size *is* evidence against the original claim. In a new study, you haven't established an effect size to miss yet. It's about **Predictive Performance** vs. **Discovery**.

  5.  **Synthesizing the "Stuck vs. Inherited" Distinction:**

      *   *Inherited (1930s):* The fetishization of $p < .05$ as a binary cliff, the conflation of $p$-values with effect size importance, the idea that $p > .05$ means "no effect" (in original studies).
      *   *Stuck With (Modern Reform):* The focus on *process integrity* over *numeric output*, the requirement for SESOI (decision theory), the treatment of replications as high-prior tests. The core commitment is **Institutional Reliabilism**: We design rules to make the *community's* output trustworthy, even if it makes individual studies look weird.

  6.  **Refining the Tone:**
      *   Avoid condescension.
      *   Acknowledge the messiness.
      *   Use precise terminology (Likelihood Principle, Severity, Error Statistics, Institutional Reliabilism).
      *   Directly answer the "what view of evidence" question.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* Study A and B are different without just saying "rules are rules"? *Yes, focus on the counterfactual: In Study B, the process could have produced a significant result by chance more often.*
      *   *Check:* Did I address the Bayesian alternative? *Yes, note that Bayesians condition on the data, but 'garden of forking paths' affects the model space.*
      *   *Check:* Is the replication asymmetry clear? *Need to emphasize that replication tests a specific effect size, not just direction.*
      *   *Check:* The user asked about "Institutional Reliabilism." I should use that term or similar. Let's call it "System-Level Frequentism."

  8.  **Final Polish:** Organize by the user's bullet points for clarity. Ensure the conclusion gives them text they can adapt for their committee report (the "implicit epistemology" summary). (Self-correction: Don't write the paragraph for them, but give them the conceptual scaffolding to write it.)

  9.  *(Final thought on the "Inconsistency" charge)*: The user suspects inconsistency. I need to validate that suspicion. There *is* a tension between Fisherian (evidential) and Neyman-Pearson (behavioral) interpretations mixed in current practice. I need to point out that the "New Norms" try to resolve this by leaning heavily into Neyman-Pearson (error control) while using Fisherian language (evidence).

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is an excellent set of questions. You have correctly identified that the current "reform" package in psychology is not a coherent derivation from a single statistical philosophy. It is a pragmatic patchwork of Neyman-Pearson error control, Fisherian evidential language, and a nascent decision-theoretic layer (SESOI), all glued together by an institutional need to restore trust.

  Here is the reconstruction of the implicit epistemology driving your committee's norms, broken down by your specific queries.

  ### 1. The Pre-registration Asymmetry (Study A vs. Study B)
  **The Commitment:** This is a **Procedural Reliabilist** view, specifically rooted in **Error Statistics** ( Mayo's Severity Principle), not a pure Likelihoodist or naive Bayesian view.

  In a pure Likelihoodist framework, the Likelihood Principle states that all evidence is contained in the likelihood function of the observed data. Under that view, Study A and Study B provide identical evidence because the data are identical. The fact that the researcher *could* have analyzed it differently in Study B is irrelevant to what the data *say*.

  However, your department's norms reject the Likelihood Principle. They adopt the view that evidence is not just a property of the numbers, but a property of the **capacity of the procedure to have avoided error**.
  *   **Study A:** The procedure had a known, low probability of generating a false positive (assuming the null). The result is "severe" because it passed a test that would likely have failed if the hypothesis were false.
  *   **Study B:** The procedure's error rate is unknown and uncontrolled due to "degrees of freedom" (analytic flexibility). Even if no fishing occurred, the *capacity* to fish inflates the Type I error rate of the *process*.

  **Can a Bayesian save this?**
  Yes, but only by shifting the burden. A Bayesian does not care about long-run error rates, but they do care about the **model space**. In Study B, the fact that the analysis was chosen *after* seeing the data implies that the reported model is the "winner" of a selection process. To evaluate Study B Bayesianically, you must condition on the fact that *this specific analysis was reported*. This requires penalizing the hypothesis by the "researcher degrees of freedom."
  *   **The Verdict:** Your department is operating on a **System-Level Frequentist** logic. They are not evaluating the probability that the hypothesis is true in this instance; they are evaluating the trustworthiness of the *claim-generating process*. Study A generates a warrant; Study B generates a suspicion.

  ### 2. Optional Stopping vs. Pre-registration
  **The Commitment:** These rely on the same underlying commitment (Error Statistics), but they target different failure modes.

  *   **Optional Stopping:** This is pure **Neyman-Pearson behaviorism**. It presupposes that the validity of an inference depends on the sampling distribution of the test statistic under the null hypothesis. If you peek and stop, you change that sampling distribution. If you ignore that change, your long-run false positive rate exceeds $\alpha$. This rule makes *no sense* under the Likelihood Principle or a pure Bayesian updating rule (where you stop when the posterior is precise enough).
  *   **Pre-registration:** This is the administrative enforcement of the Optional Stopping ban, extended to analytic choices.

  **Are they compatible?**
  They are compatible *if* the goal is **Long-Run Error Control**. They are incompatible *if* the goal is **Evidential Interpretation of a Single Case**.
  The inconsistency you feel arises because psychologists want to use $p$-values as Fisherian measures of evidence ("look how incompatible the data are with the null!") while adhering to Neyman-Pearson rules ("you can't peek!").
  *   **The Fix:** The norms presuppose that we are managing a **literature**, not a single mind. We ban optional stopping not because it makes the specific numbers "lie," but because it makes the *literature* accumulate false positives faster than the stated rate. The rule follows from a commitment to **Institutional Reliabilism**: we sacrifice individual flexibility to protect the collective false discovery rate.

  ### 3. What Survives a Bayesian Shift?
  If your department switched to a fully Bayesian framework (priors, posteriors, decision theory), the following would happen:

  **What gets abandoned:**
  *   **Fixed Sample Size / Stopping Rules:** You could stop whenever the Bayes Factor reaches a threshold or the credible interval is narrow enough. The "peeking" prohibition vanishes.
  *   **The Study A / Study B Asymmetry (mostly):** If you explicitly model the analytic flexibility as part of the prior or the model comparison, the data can speak. However, in practice, Bayesians often demand pre-reg to justify the priors, so the *norm* might stay even if the *statistical necessity* fades.
  *   **Binary Significance:** The $p < .05$ cliff disappears.
  *   **"Failed Replication" language:** You wouldn't say "failed." You would say "the posterior probability of the original effect size has decreased."

  **What gets kept (and why):**
  *   **SESOI (Smallest Effect Size of Interest):** This actually becomes *more* important. In Bayesian decision theory, you need a loss function. SESOI is essentially a decision threshold. A credible interval excluding the SESOI is a decision to act as if the effect is negligible.
  *   **Pre-registration:** This shifts from error control to **Prior Specification**. You pre-register to declare your priors and loss functions before seeing the data, preventing "prior hacking" (adjusting priors to get the desired posterior).
  *   **Replication:** This becomes **Prior Updating**. The original study sets the prior for the replication.

  **What you'd have to start doing:**
  *   **Justify Priors:** You can't just say "uninformative." You'd need to justify why a Cauchy(0, 0.7) is appropriate for RT data.
  *   **Report Uncertainty:** You would have to report full posteriors, not just intervals.
  *   **Make Decisions:** You would have to explicitly state the cost of a False Positive vs. False Negative to determine if the evidence is sufficient to publish/act.

  ### 4. The Non-Significance Asymmetry (Original vs. Replication)
  **The Commitment:** This is not an inconsistency; it is a difference in **Hypothesis Testing vs. Estimation** and **Prior Probability**.

  *   **Original Study (New Claim):** The prior probability of a novel effect is low. A $p = .40$ (or BF < 1) is uninformative because the study was likely underpowered to detect the true effect (since we don't know it yet). We treat it as "insensitive." We cannot accept the null because we haven't defined what "null" means practically (hence the need for SESOI/Equivalence testing).
  *   **Replication Study:** The hypothesis is no longer "there is an effect." The hypothesis is "the effect is *size X* (from the original)." The prior probability is now high. The study is (ideally) powered to detect *size X*.
      *   If $p = .40$ (or the CI excludes size X), this is **evidence against the specific claim made by the original study**.
      *   It is not evidence for the *nil null*; it is evidence against the *original effect size*.

  **The Single Story:**
  The story is **Predictive Performance**.
  *   In an original study, we are exploring whether a prediction holds at all. Non-significance means the prediction wasn't tested severely enough (low power/unknown effect).
  *   In a replication, we are testing the *falsifiability* of the original claim. If the original claim was "Effect = 0.5 SD", and the replication CI is [-0.1, 0.1], the original claim is falsified.
  *   **The Inconsistency:** The inconsistency lies in treating the original $p > .05$ as "nothing" while treating the replication $p > .05$ as "something." The reform movement is trying to fix this by pushing **Equivalence Testing** for original studies. If you pre-register an SESOI and show the CI falls within it, the original study *also* becomes informative (evidence of absence). Your colleagues resisting equivalence testing are indeed holding onto an incoherent position: they want replications to be informative null tests but refuse to make original studies informative null tests.

  ### Summary for your Committee Report
  You asked for the implicit epistemology to help write your paragraph. Here is the synthesis:

  **The Implicit Epistemology:**
  Our current reforms presuppose a shift from **Individual Evidentialism** to **Institutional Reliabilism**.
  1.  **Evidence is Procedural:** A $p$-value is not an intrinsic property of the data; it is a property of the data *generated by a specific, constrained process*. Identical numbers from different processes have different warrant because the processes have different capacities to generate false positives (Severity).
  2.  **The Unit of Analysis is the Literature:** Rules like banning optional stopping are not about the truth of a single study, but about controlling the false discovery rate of the field over time. We sacrifice individual analytic freedom to ensure collective calibration.
  3.  **Absence of Evidence $\neq$ Evidence of Absence (Unless Specified):** We treat non-significance as uninformative by default because most studies are not designed to test the null. We treat replication non-significance as informative because it tests a specific, pre-existing claim. The push for SESOI and Equivalence Testing is the attempt to make original studies capable of providing "evidence of absence" by defining what "absence" means practically.

  **What is Inherited vs. What is Stuck:**
  *   **Inherited (1930s):** The idea that $p < .05$ is a binary threshold for truth; the conflation of statistical significance with practical importance; the refusal to interpret high $p$-values in original studies.
  *   **Stuck With (Modern):** The requirement for pre-registration as a condition for warrant; the focus on power and sample size justification; the treatment of replications as high-stakes tests of specific effect sizes.

  **The Verdict on your Colleagues:**
  Your colleagues resisting equivalence tests are indeed inconsistent. They accept the logic of the replication (that we can rule out effects) but refuse to apply it to the original study. The reform package only becomes fully coherent if **Equivalence Testing** is adopted for original studies, allowing $p > .05$ (with tight CIs) to count as "evidence of absence" there, too. Without that, you are correct: the system treats identical statistical outcomes differently based solely on the temporal order of the study, which is epistemologically fragile.

  **Recommendation for the Paragraph:**
  Frame the adoption of these methods not as "better statistics" but as "better warrant." We are not saying the data in Study B are fake; we are saying the *process* did not generate a warrant sufficient for public claim-making. We are moving from a culture of "What do these numbers say?" to "What have we done to ensure these numbers couldn't easily have lied?"
