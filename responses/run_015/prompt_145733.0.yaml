answer: |-
  ### The Contractualist Map: WHO's 2015 Ebola Ring-Vaccination Trial

  To analyze the WHO's 2015 decision to pursue a ring-vaccination trial (specifically the *Ebola Ça Suffit* trial in Guinea) through T.M. Scanlon's contractualism, we must first discipline the mapping. Scanlon's framework in *What We Owe to Each Other* rests on a single criterion: an act is wrong if it violates principles that no one could **reasonably reject**. Justification is owed to individuals, not collectives. The "Aggregation Problem" in Scanlonian theory warns against summing small burdens across many people to outweigh a catastrophic burden on one.

  The Ebola case presents a life-or-death variant of this: do we aggregate the survival chances of future populations to justify imposing a high risk of death on current trial participants?

  #### 1. Mapping the Persons: To Whom is Justification Owed?

  Scanlon requires us to identify the specific individuals whose standpoints must be considered. We cannot speak of "the public" or "the outbreak." We must isolate the distinct burdens.

  *   **Person A: The Control/Delayed Participant.**
      *   *Status:* Identified contact of a confirmed case, randomized to the "delayed vaccination" arm (functioning as the control for the prompt's "placebo" framing).
      *   *Burden:* Faces a high probability of infection and death during the 21-day delay without the potential protection of the vaccine.
      *   *Complaint:* "I am being used as a data point. My life is risked to generate knowledge, when a potential safeguard exists."
  *   **Person B: The Immediate Vaccinee.**
      *   *Status:* Identified contact randomized to receive the rVSV-ZEBOV vaccine immediately.
      *   *Burden:* Risk of vaccine side effects (fever, joint pain) and the psychological burden of being part of an experiment.
      *   *Complaint:* Weak compared to Person A, but they might reject being instrumentalized if the trial design is exploitative.
  *   **Person C: The Excluded Outsider.**
      *   *Status:* Someone in the outbreak zone not traced or not in a "ring."
      *   *Burden:* Receives no vaccine in either scenario (Trial or Universal Distribution) due to logistical scarcity.
      *   *Complaint:* "Why are resources spent on a trial structure rather than maximizing immediate coverage where possible?"
  *   **Person D: The Future Patient.**
      *   *Status:* Unidentifiable individuals in future outbreaks (2016 onwards).
      *   *Burden:* If the trial fails (no efficacy data), the vaccine is not licensed. They face Ebola without a proven tool.
      *   *Complaint:* "Current agents prioritized the certainty of the present over the safety of the future, leaving us vulnerable."

  #### 2. The Reasonable Rejection Test

  Scanlon asks: Which principle for governing this situation could no one reasonably reject?
  *   **Principle 1 (Universal Distribution):** Distribute the unlicensed vaccine to everyone possible immediately; do not run a controlled trial.
  *   **Principle 2 (Ring Vaccination Trial):** Restrict immediate access to randomized rings to establish efficacy, delaying some for data.

  **Person A's Rejection of Principle 2:**
  Person A has a very strong complaint. They face a high risk of death. Under Principle 1, they would have access to the vaccine (assuming supply allows). To ask Person A to accept a high risk of death so that Person D *might* be safer is to ask them to bear a burden for the sake of others. Scanlon generally forbids imposing a severe burden on one to relieve lesser burdens on many. Here, the burden is death.

  **Person D's Rejection of Principle 1:**
  Person D's complaint is probabilistic. If the vaccine is ineffective or harmful, Universal Distribution wastes resources and potentially harms people without building the knowledge base to stop future outbreaks. Person D faces a risk of death due to ignorance. However, Person D is unidentifiable. Scanlon's framework is strongest regarding identifiable victims. A complaint based on a *statistical* risk to an *unidentified* future person is generally weaker in contractualism than a complaint from an *identifiable* person facing immediate harm.

  #### 3. The Aggregation Problem: Collapse or Clarification?

  The prompt asks whether Scanlon's resistance to aggregation helps or collapses here. The standard Aggregation Problem asks: *Can we sum a million headaches to outweigh one death?* Scanlon says **No**. The Ebola case asks: *Can we sum a hundred future statistical lives to outweigh one identifiable death now?*

  **Where Scanlon's Resistance Collapses:**
  If we strictly apply Scanlon's anti-aggregation rule, Principle 2 (The Trial) looks unjustifiable. Person A's complaint (identifiable, high risk of death) trumps Person D's complaint (statistical, probabilistic risk of death). Scanlon argues we cannot sacrifice the one for the many simply because the "sum" of benefit is greater. If the Trial requires Person A to accept a burden they could avoid under Principle 1, and Person D's burden is not *certainly* worse for any *specific* individual, Person A can reasonably reject the Trial.
  In this light, contractualism seems to demand Universal Distribution, even if it risks scientific failure. This suggests a collapse: a theory that forbids sacrificing one for the many may paralyze public health responses that inherently rely on population-level data to save population-level lives.

  **Where Scanlon's Resistance Holds (The Nuance of Risk):**
  However, Scanlon's theory does not actually collapse here, provided we do not force it to speak on aggregation. The resolution lies not in summing harms, but in comparing the **strength of the complaints under uncertainty**.
  1.  **Probability:** Person A's risk is high but not certain (Ebola transmission is not 100% per contact). Person D's risk is also probabilistic. Scanlon allows us to weigh the *likelihood* of the burden occurring.
  2.  **Baseline Risk:** Person A is already in a "ring" because they are a contact. They are already at high risk. The trial does not *create* the risk of Ebola; it modifies the protection against it. If the vaccine is unproven, Principle 1 (Universal Distribution) offers Person A only a *hope* of protection, not a guarantee.
  3.  **Reciprocity:** Scanlon emphasizes mutual recognition. If Person A accepts the risk, does the principle offer them something? In the actual Guinea trial, the "control" was *delayed* vaccination, not saline placebo. This mitigates Person A's complaint: they are not denied help forever, only temporarily. A principle that says "We delay you to ensure this help actually works for everyone" is harder to reasonably reject than "We use you as a permanent control."

  **The Verdict on Aggregation:**
  This case does **not** prove contractualism secretly needs a utilitarian aggregation mechanism. Instead, it shows that the "Aggregation Problem" was never the real bottleneck. The bottleneck is **Identifiability and Probability**.
  Scanlon's resistance to aggregation helps us see that we cannot justify the trial *merely* by saying "We will save 1,000 future people." That is aggregation. We must justify it by saying "Person A's complaint is not strong enough to veto this because Person A is already at high risk, the delay is temporary, and the alternative leaves Person A with an unproven intervention that might fail them anyway."
  The justification works not by summing Person D's lives, but by weakening Person A's claim to *certainty* in a context where certainty is impossible.

  #### 4. Disciplined Silence: Where the Theory Stops

  We must not force Scanlon to speak where he is silent.
  *   **Future Generations:** Scanlon's contractualism is designed for "mutual recognition" among contemporaries. Person D (Future Patients) exists in a zone where Scanlon is notoriously quiet. To claim Person D has an equal standing to Person A stretches the theory. A disciplined reading admits that contractualism struggles to fully vindicate the Trial based on Person D's rights alone.
  *   **Systemic Trust:** The prompt mentions "ones outside the ring." If the trial erodes trust (Person C), the outbreak worsens. Scanlon focuses on individual justification, not systemic utility. A strict Scanlonian analysis might miss the feedback loop where rejecting the Trial leads to *more* deaths for Person A due to prolonged outbreak. This is a consequentialist consideration that contractualism must import awkwardly via the "reasonableness" of rejection (i.e., is it reasonable to reject a principle that leads to total system collapse?).

  #### 5. Conclusion: The Aggregation Red Herring

  The 2015 Ebola trial does not prove that contractualism needs an aggregation mechanism. It proves that **aggregation is the wrong tool for the job.**

  If we try to solve this by aggregating future lives saved, we violate Scanlon's core insight: individuals are not vessels for value. But if we refuse to aggregate, we do not necessarily have to abandon the trial. We abandon the *justification* that relies on the sum. Instead, we rely on a **comparison of individual burdens under risk.**

  Person A can reasonably reject a principle that sacrifices them for *certain* gain to others. But Person A cannot reasonably reject a principle that imposes a *temporary, probabilistic* risk on them to prevent a *catastrophic, systemic* failure that would likely harm them (or people exactly like them) anyway. The Trial is justifiable not because the future many outweigh the present one, but because the present one's complaint is weakened by the reality that "Universal Distribution" offers them no guarantee of safety either.

  Scanlon's resistance to aggregation remains intact. It forces us to stop hiding behind "the greater good" and look at the specific contract between the researcher and the participant. It demands that the Control group (Person A) be treated not as a means to a sum, but as a party to a principle that minimizes their burden as much as possible (e.g., delayed vaccination rather than placebo, informed consent, post-trial access). The theory does not collapse; it tightens the constraints on *how* the trial is run, ensuring that the burden on the individual is never treated as a mere cost in a calculation.
