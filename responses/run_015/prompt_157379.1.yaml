  hi, i'm in my third year philosophy and we've just covered illusionism about phenominal consciousness in our mind seminar — the idea that there's no actual phenomenal feel going on, just brains misrepresenting their own states. i'm trying to figure out what to focus on for my coursework essay, and i'm going round in circles a bit.

  my tutor brought up this thing about cognitive phenomenology: even if visual qualia are an illusion, maybe thinking or understanding has its own distinctive feel? if illusionists deny that too, they start sounding like full-blown eliminative materialists about cognition, which feels like a much bigger claim than they usually admit. then there's the predictive proccessing angle, where illusionism might mesh well with the brain being a prediction machine that gets its internal models wrong. and there's also this clinical ethics thing my flatmate mentioned — if chronic pain reports are literally false beliefs, should doctors treat them differently?

  so i'm wondering: if you had to advise a grad student where to put energy for the next few years, which of these open lines actually matter most? is the conceptual boundary between illusionism and eliminativism the upstream question everything else depends on, or is the empirical link to predictive coding more tractable and urgent? and where does the medical/ethical fallout sit — is it a real implication or just philosophical wheel-spinning? please defend the ranking properly: tell me what you'd deprioritise and why, not just list them. and could you write in british english? also please don't load it up with citations or reading lists — i've got no access and just want the argument.
