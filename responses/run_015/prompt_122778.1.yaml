  **Strategy Note to the Applicant**

  Before you insert the text below into your proposal, please consider the following substantive answers to your questions. These are for your understanding and will help you defend the proposal orally, even if they do not appear in the written appendix.

  1.  **Is the circularity objection the one the philosopher will make?**
      It is likely the *opening* move, but not the killing blow. A philosopher of economics knows that the "tautology" charge against revealed preference is a classic debate from the 1950s. They will not be surprised by it. Their deeper concern will be **Interpersonal Comparisons of Utility**. Revealed preference theory works beautifully for one person over time. It has no standard mechanism for comparing Person A's welfare to Person B's. Your pipeline forces this comparison by averaging dollar scores across a region. The philosopher will ask: "Why is a dollar of equivalent variation for a wealthy household ethically equivalent to a dollar for a poor household?" Your appendix should subtly acknowledge that your comparability devices (anchoring and monetization) are *conventions* adopted for policy tractability, not metaphysical truths. The text below is drafted to handle this by emphasizing the *pragmatic* necessity of the method for cost-benefit analysis.

  2.  **Does monetization do work distinct from anchoring?**
      Yes. **Anchoring** solves the problem of *cardinalization*. A recovered utility function is initially ordinal (it ranks bundles but does not measure the distance between them). By fixing the utility of the subsistence bundle at 0 and the comfort bundle at 100, you define the "distance" between bundles. This turns the function into a measuring rod. **Monetization** solves the problem of the *numeraire*. It translates the measured distance on that rod into a unit (dollars) that the funding agency uses for budget constraints. You need anchoring to make the utility function measurable; you need monetization to make that measurement tradeable against government costs. Without anchoring, the monetization step would rest on an arbitrary scale; without monetization, the anchoring step would yield scores that cannot be entered into a cost-benefit analysis.

  ***

  **Technical Appendix: Methodological Validity of the Welfare Measurement Pipeline**

  **1. Overview of the Methodological Challenge**

  This appendix addresses the theoretical foundation of the welfare measurement pipeline proposed in the main text. The pipeline proceeds from observed household purchase data to a regional cost-benefit scorecard. This process involves three distinct transitions: first, from observed choices to a recovered utility function; second, from individual utility functions to comparable wellbeing scores; and third, from wellbeing scores to monetary equivalents suitable for policy ranking. Each transition invites specific methodological scrutiny. The purpose of this note is to clarify the logical status of the utility measures generated, to distinguish the roles of the anchoring and monetization devices, and to justify the normative leap required to use these measures for subsidy ranking.

  **2. The Status of Recovered Utility Functions**

  A primary concern in welfare measurement is the relationship between observed choice and underlying welfare. In the revealed-preference tradition, utility is often treated as a mathematical representation of choice consistency rather than a psychological state. A strict interpretation of this tradition suggests that defining utility solely by observed choices renders the concept circular: if utility is defined by choice, it cannot independently justify why one choice pattern is preferable to another for policy purposes. If the utility function is merely a relabeling of the data fed into it, it cannot perform the independent work required to rank transport and housing subsidies.

  This proposal adopts a modified interpretation of the revealed-preference framework that avoids this circularity. The utility functions recovered in this pipeline are not used merely to describe past choices. Instead, they are used to simulate counterfactual choices under new price regimes. The Generalized Axiom of Revealed Preference test serves as a filter to ensure that the household data is sufficiently consistent to support extrapolation. Households that fail the test are discarded or smoothed, not because they lack welfare, but because their observed behavior does not support a stable model of response to price changes.

  For the households that pass the test, the recovered utility function is treated as a structural model of preference. The non-circular value of this function lies in its predictive capacity. We are not asserting that the household is better off simply because they chose bundle A over bundle B in the past. We are asserting that, given the recovered structure of their preferences, they would choose bundle A over bundle B at the subsidized prices proposed in the policy scenarios. The utility function thus acts as a bridge between observed baseline behavior and unobserved policy outcomes. It allows the pipeline to estimate welfare changes for price vectors that have never been observed in the scanner data. This extrapolative function ensures that the utility measure is doing independent work; it is constraining the set of possible responses to subsidies, rather than merely summarizing past purchases.

  **3. The Necessity of Interpersonal Comparability**

  Even if the recovered utility functions are valid predictors of individual choice, they remain ordinal and individual-specific. Standard microeconomic theory holds that utility is unique only up to a monotonic transformation. This creates a barrier to aggregation: one cannot mathematically average the utility scores of different households to produce a regional wellbeing metric unless the scales are aligned. Without alignment, a one-unit increase in utility for one household might represent a trivial change, while for another it represents a life-altering shift.

  To overcome this barrier, the pipeline employs two distinct devices: anchoring and monetization. It is critical to understand that these devices perform different logical functions. They are not redundant steps, nor are they merely different labels for the same normalization.

  **4. Distinct Roles of Anchoring and Monetization**

  The first device, anchoring, addresses the problem of cardinalization. A recovered utility function typically provides a ranking of bundles but does not specify the magnitude of the difference between them. To make the utility scores comparable across households, we must impose a common scale. By rescaling every recovered function so that it takes the value zero on a fixed bare-subsistence bundle and one hundred on a fixed comfort bundle, we impose a common metric of intensity. This step transforms the utility function from an ordinal ranking into a cardinal measure. It ensures that the distance between the subsistence point and the comfort point is defined identically for every household in the panel.

  However, cardinalization alone is insufficient for cost-benefit analysis. A score of fifty on the anchored scale indicates a position halfway between subsistence and comfort, but it does not indicate the resource cost of achieving that position. Different households may require vastly different expenditures to move from a score of zero to a score of fifty, depending on their preferences, constraints, and local prices. This is where the second device, monetization, becomes necessary.

  Monetization converts the anchored cardinal utility into dollars of equivalent variation at a common set of baseline prices. This step translates the abstract wellbeing score into a resource metric. It answers the question: How much income, at baseline prices, would be required to generate this level of wellbeing? By denominating the final scores in dollars, the pipeline aligns the welfare metric with the budget constraint of the funding agency.

  The distinction is substantive. Anchoring ensures that the utility functions are measuring the same conceptual distance across individuals. Monetization ensures that this distance is measured in a unit that is tradeable against policy costs. If the pipeline relied on anchoring alone, the output would be a comparable wellbeing index, but it could not be directly entered into a cost-benefit scorecard that ranks subsidies by efficiency. If the pipeline relied on monetization alone, without anchoring, the dollar values would rest on arbitrary utility scales, making the interpersonal comparison of dollars unjustified. The anchoring step fixes the scale of the utility function; the monetization step fixes the numeraire of the policy evaluation. Both are required to move from individual choice data to a social welfare metric.

  **5. The Normative Justification for Aggregation**

  The final step of the pipeline involves averaging the dollar scores within a region to rank subsidies. This step entails a normative judgment: that a dollar of equivalent variation for one household counts equally toward the regional score as a dollar for another household. This is the point where the methodology moves from positive economics to normative policy analysis.

  It is acknowledged that this equality weight is a convention, not an empirical finding. The revealed-preference data can tell us what households choose, and the recovery process can tell us how they value those choices, but the data cannot dictate how a funding agency should weigh the welfare of different households. The use of equal weighting is justified here on pragmatic grounds consistent with the mandate of the funding agency. The agency requires a cost-benefit scorecard to allocate limited resources across transport and housing subsidies. In the absence of explicit distributional weights provided by the legislative mandate, the standard default in cost-benefit analysis is to treat dollars as ethically equivalent across individuals.

  This convention does not deny that households differ in their marginal utility of income. Rather, it adopts the money-metric utility approach as the operational definition of social welfare for the purpose of this specific evaluation. The anchoring step mitigates the risk of extreme heterogeneity by bounding the utility functions between fixed subsistence and comfort levels. This prevents the recovered functions from generating infinite or zero valuations that could distort the regional average. The monetization step then renders these bounded scores compatible with the agency's existing financial frameworks.

  **6. Addressing the Charge of Emptiness**

  Returning to the initial concern regarding circularity: the charge that revealed-preference utility is empty rests on the idea that the measure adds no information beyond the raw choice data. In the context of this pipeline, that charge is incorrect. The raw choice data is a collection of disjointed observations at specific price points. The recovered, anchored, and monetized utility function is a continuous surface that allows for integration and simulation.

  The value added by the pipeline is the ability to estimate welfare changes for policies that have not yet been implemented. A raw list of purchases cannot tell a policymaker the welfare effect of a five percent subsidy on public transit. Only a structural model of utility, tested for consistency and rescaled for comparability, can generate that estimate. The utility function is not a relabeling of the past; it is a tool for modeling the future.

  Furthermore, the filtering process adds value by identifying households whose behavior is too erratic to model reliably. By discarding or smoothing these observations, the pipeline prevents noise in the data from being interpreted as signal in the welfare metric. This improves the signal-to-noise ratio of the final regional score. The resulting metric is therefore not a tautology of the input data, but a refined estimate of welfare response derived from that data.

  **7. Conclusion**

  The welfare measurement pipeline proposed here is designed to navigate the tension between theoretical rigor and policy applicability. It respects the constraints of revealed-preference theory by testing for consistency before recovery. It respects the constraints of measurement theory by using anchoring to establish cardinal comparability. And it respects the constraints of public administration by using monetization to align welfare metrics with budgetary units.

  The philosophical objection that revealed-preference utility is circular is addressed by the predictive nature of the recovery process. The objection that interpersonal comparisons are impossible is addressed by the explicit adoption of anchoring and monetization as conventions for policy evaluation. While no metric can fully resolve the deep philosophical challenges of welfare aggregation, this pipeline provides a transparent, replicable, and theoretically grounded method for converting household choice data into the cost-benefit scores required for subsidy ranking. It offers a defensible middle ground between the paralysis of pure theoretical skepticism and the recklessness of ungrounded measurement.
