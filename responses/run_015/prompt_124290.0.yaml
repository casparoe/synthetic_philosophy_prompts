answer: |-
  Here is the scoring breakdown for your graphic, calibrated to your chemist's three-part test. I've kept the justifications tight so you can drop them directly into captions or sidebars.

  ### The League Table

  **1. Portuguese man o' war — 10/10**
  Passes all three: it maintains itself, reproduces with variation, and runs its own machinery (even if it is technically a colony of zooids).

  **2. HeLa cells — 9/10**
  Passes all three, though docked slightly because their "environment" is artificially maintained by humans, not themselves.

  **3. Self-replicating robot (theoretical) — 9/10**
  Passes all three by definition; it harvests energy, copies its blueprint with variation, and relies on no biological landlord.

  **4. Seed in a seed bank — 8/10**
  Passes Heredity and No-Landlord, but fails Self-Upkeep while dormant; life is present as potential rather than process.

  **5. Bacterial endospore — 8/10**
  Same as the seed: metabolism is switched off, but the independent machinery and evolutionary lineage remain intact.

  **6. Tardigrade (tun state) — 8/10**
  Passes Heredity and No-Landlord, fails Self-Upkeep; cryptobiosis pauses the chemistry but doesn't delete the organism.

  **7. Frozen embryo — 7/10**
  Passes Heredity and No-Landlord, fails Self-Upkeep; docked further than the seed because it cannot survive without high-tech intervention to resume.

  **8. Mule — 7/10**
  Passes Self-Upkeep and No-Landlord, but fails Heredity; it is biologically alive but an evolutionary dead end.

  **9. Giant virus (Mimivirus) — 4/10**
  Passes Heredity, but fails Self-Upkeep and the No-Landlord Clause; it is complex, but still a hostage to host-cell machinery.

  **10. Common cold virus — 3/10**
  Passes Heredity, fails Self-Upkeep and No-Landlord; a minimalist replicator with no independent metabolism.

  **11. Candle flame — 2/10**
  Passes Self-Upkeep and No-Landlord, fails Heredity; it consumes energy and persists, but it cannot evolve or reproduce with variation.

  **12. Prion — 1/10**
  Passes a twisted version of Heredity (templating), fails Self-Upkeep and No-Landlord; it is merely a misfolded protein coercing others.

  ***

  ### The Chatbot (LLM) — 0/10
  **Fails all three:** it does not harvest its own energy, it cannot reproduce or vary its own code, and it resides entirely on human-maintained servers.

  ***

  ### The Tiering & The Cut-Off

  If you are drawing a line for the graphic, here is how the four tiers break down:

  *   **Tier 1 (The Unquestionable):** Scores 9–10. Organisms that are currently metabolizing and evolving.
  *   **Tier 2 (The Paused & The Sterile):** Scores 7–8. Organisms that are either temporarily switched off (dormant) or individually sterile (mules).
  *   **Tier 3 (The Borrowers):** Scores 3–4. Viruses that carry genetic information but lack the factory to build it.
  *   **Tier 4 (The Non-Living):** Scores 0–2. Dissipative structures, proteins, and software.

  **Where to draw the line:**
  The defensible cut-off for "Alive" is between **Tier 2 and Tier 3** (between the Mule/Embryo and the Giant Virus). This keeps the sterile and the dormant in the club, but excludes the obligate parasites.

  **The Clause Analysis:**
  *   **The Real Workhorse:** The **No-Landlord Clause**. This is the only tool that cleanly separates biology from virology. Without it, the giant virus scores as high as the bacteria.
  *   **The One to Delete:** **Heredity**. For a league table of *individual* entities, this clause causes more trouble than it's worth. It forces you to score a mule or a worker ant as "less alive" than a seed, which contradicts biological intuition. Heredity is a property of a *lineage*, not an *individual*; keeping it in an individual scoring system creates false negatives.
