answer: |-
  **Project Title:** Beyond the Unitary Category: A Dual-Structure Taxonomy of Affective Life

  **1. Statement of the Philosophical Question**
  The central question of this project is determinate rather than exploratory: Does bifurcating the folk-psychological category "emotion" into two distinct functional kinds—"affective registrations" (fast, body-based, non-conceptual evaluative states) and "emotional stances" (slow, conceptually structured, socially accountable commitments)—dissolve the theoretical stalemate regarding the rationality and phenomenology of affect? The project seeks a structured answer: either yes, the distinction holds and resolves specific puzzles regarding recalcitrant emotions and moral responsibility; no, the two structures are inseparable in principle within human experience; or yes, but only for a subset of cases, requiring a revised hybrid model. The hypothesis to be tested is that the first option is correct: the persistent disagreement in affective science arises because competing theories accurately describe different structures while wrongly assuming a unitary ontology.

  **2. The Failure of the Existing Trichotomy**
  Current philosophical discourse is stalled between three dominant positions: judgment-based accounts, perceptual or feeling-based accounts, and hybrid constructivist accounts. This project argues that this trichotomy fails because each camp captures one half of the proposed dual structure while misidentifying it as the whole. Judgment theories correctly describe the normative accountability of "emotional stances"—where an agent commits to treating a situation as dangerous or offensive—but they cannot account for the non-conceptual urgency of "affective registrations," such as the immediate startle response preceding cognitive evaluation. Conversely, perceptual theories capture the bodily immediacy and passive phenomenology of registrations but fail to explain socially regulated emotional displays that require conceptual mastery and normative justification. Hybrid accounts attempt to bridge this gap but typically conflate the two without explaining their interaction, treating them as a mushy continuum rather than distinct functional kinds with different logical grammars. By assuming a unitary category, these theories generate pseudo-problems: they ask whether emotions are rational (a question applicable only to stances) or merely causal impulses (applicable only to registrations), leading to intractable debates about appropriateness and moral responsibility.

  **3. Methodology and Work Plan**
  As a conceptual project, this study relies on philosophical analysis rather than empirical data collection. The method involves four distinct phases over a one-semester timeline (four months).

  *Month 1: Conceptual Architecture.* I will rigorously define the necessary and sufficient conditions for "affective registrations" versus "emotional stances." This involves analyzing ordinary language reports to distinguish descriptions of bodily impingement (e.g., "I was seized by panic") from declarations of normative commitment (e.g., "I am outraged by this injustice"). I will establish the niche conceptual distinction of *Normative Accountability vs. Causal Impingement* as the primary criterion for differentiation.

  *Month 2: Boundary Case Analysis.* I will examine limit cases where the unitary view struggles. These include: (1) Ritual grief, where behavioral display lacks personal belief; (2) Bodical arousal without object-directed evaluation (e.g., caffeine-induced anxiety); and (3) Shame directed at social norms the subject explicitly rejects. The goal is to determine if these cases are best described as malfunctioning unitary emotions or as clear instances of one structure operating without the other.

  *Month 3: Normative Criteria and Rationality.* I will construct decision criteria for when a registration becomes a stance. This involves assessing whether rationality norms apply differently to each structure. For example, I will argue that it is category mistake to call a registration "irrational," whereas a stance is subject to logical consistency checks. I will test this against cases of recalcitrant emotion, where one feels fear despite judging safety.

  *Month 4: Synthesis and Drafting.* The final month is dedicated to assembling the taxonomy and writing the final paper. I will integrate the findings to demonstrate how the dual-structure model resolves the pseudo-problems identified in Section 2.

  **4. Conditions for Success and Failure**
  A successful result will yield a defensible taxonomy with clear conditions for membership in each category. Specifically, success requires the diagnosis and dissolution of at least two classic puzzle cases that the unitary view misdescribes. For instance, the project succeeds if it shows that "recalcitrant emotions" are not contradictory states but rather the conflict between a valid registration and an invalid stance (or vice versa). Failure is defined strictly: the project fails if the distinction collapses under analysis (e.g., if every purported registration is shown to require conceptual content) or if every actual emotional episode turns out to be an inseparable fusion of both structures, rendering the distinction practically useless for philosophical analysis. A secondary failure condition is if the distinction merely renames existing problems without offering new explanatory power regarding rationality or responsibility.

  **5. Scope Assessment**
  This project is tractable within one semester because it relies on conceptual reasoning and case analysis rather than laboratory work or large-scale data collection. The scope is limited to individual, occurrent mental states. I must stop before extending the taxonomy to clinical classification (e.g., distinguishing registrations and stances in pathology) or to collective emotional practices (e.g., mob mentality), as these introduce variables requiring sociological or psychological expertise beyond the philosophical mandate. Furthermore, while the project lays the groundwork for assessing moral responsibility, applied questions regarding legal culpability for actions driven by registrations versus stances lie beyond the project's boundary. The goal is to establish the metaphysical and conceptual groundwork; applying this to ethics is a subsequent step.

  **Significance for Philosophy of Mind**
  Reframing the debate from "What is an emotion?" to "Which functional role is this state playing?" matters for broader debates in philosophy of mind because it challenges the assumption that mental state categories must be unitary to be real. If successful, this taxonomy suggests that affective life is not a single natural kind but a functional intersection of distinct systems. This has implications for modularity of mind theories, the nature of rationality, and the relationship between embodied cognition and propositional attitude psychology. By disentangling the causal impingement of the body from the normative accountability of the mind, this project offers a pathway to reconcile physicalist descriptions of affect with the phenomenological reality of agency.
