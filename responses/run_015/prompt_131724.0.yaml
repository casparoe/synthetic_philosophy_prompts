  ok so this is gonna sound random but it came up during student council budget stuff and now its all i can think about. we have to split the activities budget between band and robotics and one of the teachers goes "you can't compare how much the band kids want new instruments to how much the robotics kids want new motors, preferences just aren't comparable across people." and i was like... surely sometimes you can?? but then i tried to say what "can compare" would even *mean* and i completely stalled out. so i want an actual number from you, not "it depends."

  here's the claim I want your credence on:

  There is a fact of the matter — something really there in the world, not just a convention we stipulate — about whether the band kids' gain from getting the money is larger than the robotics kids' loss from not getting it. count it as TRUE if there's some real quantity that makes one of them bigger even if nobody could ever measure it; count it as FALSE if every such comparison is fundamentally just us picking a scale, like picking inches vs centimeters except with no fact about which is "right."

  setup so we don't talk past each other: assume each person does have a utility function u over outcomes, its a real thing that explains their choices, and it's only pinned down up to positive affine transformation — u and 3u + 7 describe the exact same person. so within ONE person, "my gain from A to B is twice my gain from C to D" is stable and fine. but comparing u_band to u_robotics looks like it depends on an arbitrary choice of units and zero point per person.

  so: whats your credence that the claim is true? im at like 0.5 and my friend who does debate is at 0.15 and will not budge, so also tell me where you think the two of us actually disagree. give me the number AND the decomposition:

  - how sure are you that within-person comparisons of *differences* are determinate at all (maybe the "twice as big" thing is shakier than it sounds)
  - is there any candidate anchor that gives a natural zero or a natural unit across people? like: pleasure/pain intensity, some neural quantity, willingness to pay in dollars, or comparing everyone against a shared benchmark outcome (a "neutral" life, or death, or total indifference). how much of your number rides on each of those being real
  - does the temperature analogy actually help? temperature also had arbitrary units and a arbitrary zero until physics found the real one, so maybe utility is waiting for its thermodynamics. or is it more like "how funny a joke is," where there just isn't a hidden quantity
  - is "is there a fact of the matter" even the same question as "which comparison should student council use"? maybe we could get a perfectly good decision rule with no fact of the matter behind it. (if your credence is high on that being a separate question, say how that changes things)
  - this move someone suggested to me (some econ guy i think, i forgot who): ask each person to rank the outcomes *not knowing which person they'll end up being*, 50/50 chance of being a band kid or a robotics kid, and see what they'd pick. apparently that's supposed to give you a real interpersonal comparison out of purely within-person preferences. how much of your credence rides on this trick working? my worry is it just hides the arbitrariness in the 50/50 and in the fact that willingness-to-pay gets weird when people have different amounts of money or diminishing returns. but i can't tell if that's a real objection or me missing the point

  then: which of those terms are you least confident about, and what single discovery (a brain scan finding? a weird empirical result about choice? a new argument?) would move your final number the most, and in which direction. if you want to use a different set of sub-questions than mine, go ahead, but I still want the numbers and how they combine.
