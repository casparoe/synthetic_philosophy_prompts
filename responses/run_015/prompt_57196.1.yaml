          *   *Theory:* This aligns with the *Intentional Stance* (Dennett) or Functionalism. If it walks like a duck and quacks like a duck (suffers like a human), it *is* a duck. Current organization matters more than history.
          *   *Does the Film Know?* Yes, implicitly. Deckard (the human) is cold, detached. Roy (the replicant) is passionate. The film subverts the idea that biology = soul/content.
          *   *Conflict:* Teleosemantics says "No history, no content." The Film says "Look at them suffer, they have content."

      *   **The Cost of the Disagreement:**
          *   *Cost to Teleosemantics:* If we accept the film's intuition (Replicants have minds), teleosemantics looks too chauvinistic. It excludes beings that are phenomenologically identical to us just because of their pedigree. It makes content elitist (biological aristocracy).
          *   *Cost to the Film/Functionalism:* If we accept teleosemantics, the film's tragedy is undermined. Roy isn't mourning a loss of genuine life; he's a machine glitching out. The emotional weight relies on the functionalist view.
          *   *What the Film Adds:* It isolates *history* from *phenomenology*. In normal life, they go together. *Blade Runner* surgically separates them. It shows that if you judge by history (Teleosemantics), you get moral monstrosity (killing Roy). If you judge by function (Functionalism), you get epistemic uncertainty (is Deckard a replicant?). It forces the philosopher to choose between moral intuition and metaphysical rigor.

  5.  **Refining and Polishing:**
      *   *Tone:* Philosophical, analytical, rigorous.
