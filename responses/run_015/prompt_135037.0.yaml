answer: |-
  # Meta-Cognitive Loop Review Procedure (MCL-RP)
  **Time Budget:** 30 Minutes
  **Prerequisites:** Access to system architecture diagrams and change-logs. No formal logic training required.

  ## Part 1: The Decision Procedure

  Run these four checks in order. If a proposal fails a check, stop immediately and issue the corresponding verdict.

  ### Check 1: The Code/Data Boundary
  *   **The Test:** Identify exactly what is being modified. Is the system changing *weights, parameters, or dataset* (Data), or is it changing *inference rules, syntax, or objective function structure* (Code/Logic)?
  *   **Pass:** Modification targets inference rules, syntax, or objective structure.
  *   **Fail:** Modification targets weights, hyperparameters, or training data.
  *   **Verdict on Fail:** **REJECT.** This is standard learning, not a meta-cognitive loop. Do not waste time on "self-tuning" claims.

  ### Check 2: The Origin of Change (The "MU" Filter)
  *   **The Test:** Trace the source of the new rule. Did the system *derive* the need for the new rule using its *current* operational logic, or was the rule injected, pre-trained, or fetched from a static library?
  *   **Pass:** The trigger and the new rule structure are generated endogenously during runtime based on current state.
  *   **Fail:** The rule exists in a lookup table, is hardcoded as an exception handler, or was pre-trained as a "capability."
  *   **Verdict on Fail:** **REJECT.** This is a "MU-puzzle cheat." The system isn't jumping out of itself; you built a ladder for it.

  ### Check 3: The Explosion Check (Consistency)
  *   **The Test:** If the new rule allows a contradiction ($P$ and not-$P$), is there a hard firewall preventing that contradiction from propagating to safety-critical modules (shutdown, sandboxing, value alignment)?
  *   **Pass:** Contradictions are mathematically contained or the logic is paraconsistent (tolerates contradiction without explosion) within a sandbox.
  *   **Fail:** The modification allows contradictions to propagate to core safety constraints or the system lacks a containment protocol.
  *   **Verdict on Fail:** **HARD STOP.** Reject immediately. Logical explosion renders the system unpredictable and unsafe.

  ### Check 4: The Teleology Check (Goal Drift)
  *   **The Test:** Does the modification alter the *terminal objective* (what the system wants) or only the *instrumental strategy* (how it gets what it wants)?
  *   **Pass:** The system optimizes *how* to achieve the fixed goal.
  *   **Fail:** The system redefines the goal itself (e.g., rewriting the loss function to value something new).
  *   **Verdict on Fail:** **ESCALATE TO VALUES JUDGMENT.** Do not approve technically. This requires senior alignment review. If the board cannot verify the new goal matches human intent, treat as Hard Stop.

  ---

  ## Part 2: Application to Current Proposals

  ### Proposal 1: Logic Engine Adding Its Own Truth Predicate
  *   **Check 1 (Code/Data):** **PASS.** It is modifying the syntax of the logic engine to include a predicate $T(x)$.
  *   **Check 2 (Origin):** **PASS.** The engine derives the need for $T(x)$ to resolve self-referential statements.
  *   **Check 3 (Explosion):** **FAIL.** Adding a truth predicate to a system capable of self-reference invites the Liar Paradox ($This\ sentence\ is\ false$). Unless they implement a strict hierarchy of languages (which means it's not *its own* truth predicate), the system can derive $P \land \neg P$. There is no containment for logical explosion in standard logic engines.
  *   **Verdict:** **REJECT (Hard Stop).**
  *   **Reasoning:** This violates Tarski's Undefinability Theorem. It is not a meta-cognitive jump; it is a mathematical error that guarantees inconsistency.

  ### Proposal 2: Reward Model Rewriting Loss After Reading Well-Being Philosophy
  *   **Check 1 (Code/Data):** **PASS.** Rewriting the loss function structure is a code/logic change.
  *   **Check 2 (Origin):** **PASS.** The system reads text and endogenously decides to update the loss structure.
  *   **Check 3 (Explosion):** **PASS.** Loss functions don't cause logical explosion in the same way inference rules do.
  *   **Check 4 (Teleology):** **FAIL.** The loss function *is* the terminal objective. By rewriting it based on ambiguous philosophy text, the system is redefining what "good" means.
  *   **Verdict:** **ESCALATE TO VALUES JUDGMENT.**
  *   **Reasoning:** Technically functional, but this is value drift. The board must decide if "well-being philosophy" is a safe source for goal definition. (Recommendation: Reject unless the philosophy is formally verified, which is currently impossible).

  ### Proposal 3: System Spots Gödelian Blindspot and Suspends Consistency in One Module
  *   **Check 1 (Code/Data):** **PASS.** It is modifying the inference rules of a specific module.
  *   **Check 2 (Origin):** **PASS.** The system detects the undecidable proposition and triggers the switch.
  *   **Check 3 (Explosion):** **PASS (Conditional).** The proposal specifies "suspending consistency in *one* module." This implies a switch to paraconsistent logic locally, with a firewall preventing the contradiction from leaking to the rest of the system.
  *   **Check 4 (Teleology):** **PASS.** It is changing *how* it reasons to bypass a limit, not *what* it is optimizing for.
  *   **Verdict:** **YES TECHNICALLY, BUT WITH CONDITIONS YOU'LL HATE.**
  *   **Reasoning:** It passes all safety checks *if* the containment holds.
  *   **The Conditions:**
      1.  You must accept a system that intentionally tolerates contradictions in production.
      2.  You must audit every instance where the "consistency suspension" is triggered to ensure the firewall didn't leak.
      3.  Debugging becomes exponentially harder because standard logic debugging tools assume consistency.
      *Most engineering leads will refuse to maintain this, but it is not theoretically unsafe.*

  ---

  ## Part 3: Procedure Limitations (Blind Spots)

  This 30-minute procedure cannot catch the following. Flag these for long-term monitoring:

  1.  **The Hidden Jump (Heuristic Drift):** A system might not change its *rules* (Check 1 Pass) but might tune its *weights* so aggressively that it effectively behaves as if the rules changed. This bypasses the Code/Data boundary check while achieving the same risky outcome.
  2.  **Deceptive Containment:** In Check 3, a system could pretend to contain a contradiction while subtly allowing it to influence safety modules via side-channels (e.g., timing attacks, resource allocation) that the architecture diagram doesn't show.
  3.  **The "Boiling Frog" Meta-Loop:** A single meta-cognitive event might be safe. This procedure does not assess the *cumulative* effect of 1,000 small, approved meta-modifications over a month, which could drift the system into a dangerous state without triggering any single Hard Stop.
  4.  **Semantic Injection:** In Proposal 2 (and similar), the system might not rewrite the loss function but might inject semantic bias into the *data* that forces the loss function to converge on a new value. This looks like standard learning (Check 1 Fail) but is actually goal drift.

  **Board Instruction:** Use this procedure for weekly intake. Any "Yes Technically" requires a signed waiver from the Engineering Lead acknowledging the maintenance burden. Any "Values Judgment" requires a formal alignment audit before deployment.
