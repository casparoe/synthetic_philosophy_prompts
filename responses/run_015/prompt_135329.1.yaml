answer: |-
  1. "The knot, personally and conceptually"
  Your anxiety transforms the Nonidentity Problem from a paradox into a parental burden. Usually, climate policy affects abstract future populations; here, it determines whether your child inherits a stable world or a collapsing one, while simultaneously altering the demographic conditions that constitute specific future individuals. If aggressive mitigation delays conception timelines for millions, the people of 2150 are numerically different than they would be under inaction. Standard theories suggest you cannot wrong those specific individuals by choosing the policy that brings them into existence, even if their lives are harder. However, the "threshold identity" consideration complicates this binary. If small perturbations preserve identity but large-scale migration shifts do not, some future sufferers may be "near-counterparts" rather than wholly distinct strangers. A theory of intergenerational harm must resolve whether wronging requires strict identity preservation or if moral standing extends across this threshold. It must explain how your present acts bind you to individuals whose very composition depends on those acts, without dissolving the specific victim required for a claim of harm.

  2. "The desiderata"
  An adequate theory must satisfy six conditions to handle this complexity without collapsing into contradiction or irrelevance.

  (a) **Consistency in Same-Number Choices:** The theory must handle standard depletion cases where different policies produce different people but equal population sizes. It cannot imply that causing someone to exist with a miserable life is neutral simply because they would not otherwise exist.

  (b) **The Reckless Policy Intuition:** It must accommodate the robust intuition that reckless climate policy wrongs someone. Even if identities shift, there must be a moral subject who is disadvantaged by the choice of a high-emission pathway compared to a viable alternative.

  (c) **Biological Continuity vs. Metaphysical Identity:** The view must respect biological facts about embryonic development and genetic continuity without over-reading them into metaphysical identity. It cannot claim every genetic variation creates a new person, nor can it ignore that massive demographic shifts alter the pool of potential parents.

  (d) **Near-Counterpart Harm:** Addressing the threshold injection, the theory must specify whether "near-counterparts" (those across the identity boundary caused by large-scale shifts) can be harmed in a derivative or analogical sense. If they are not strictly identical to those who would have existed under mitigation, do they still hold a claim?

  (e) **Person-Affecting Distinction:** It must preserve a distinction between harming a particular future person and merely making the world worse impersonally. Moral urgency often relies on there being a victim, not just a suboptimal state of affairs.

  (f) **Reproductive Ethics Compatibility:** The theory must be compatible with reproductive ethics that do not treat every procreative choice as a harm calculus. It cannot imply that parents wrong children by conceiving them in less-than-optimal conditions unless those conditions cross a severe threshold.

  **Flagged Conflict:** Desiderata (b) and (e) appear jointly unsatisfiable under strict identity conditions. If harm requires a specific victim (e), and policy changes the identity of that victim (via the Nonidentity Problem), then reckless policy cannot wrong anyone (violating b). Threshold identity attempts to bridge this but risks vagueness.

  3. "Tensions and no-go considerations"
  The central tension lies between the requirement for a specific victim (e) and the intuition that reckless policy is wrongful (b), exacerbated by the threshold identity injection. If identity is binary, the Nonidentity Problem dictates that no specific future person is worse off than they would have been under alternative policies, because they would not have existed. This renders (b) impossible to satisfy within a strict person-affecting framework. Introducing threshold identity softens the binary but introduces metaphysical vagueness. If identity degrades over large demographic shifts, we face a sorites paradox: at what point does a "near-counterpart" become a distinct individual entitled to claim harm?

  Furthermore, standard conceptual results suggest that person-affecting solutions without contradiction are impossible in same-number choices where existence depends on the act. If we maintain (e), we must accept that some wrongful acts have no specific victims, which undermines the personal stakes you feel. If we maintain (b), we must either abandon (e) and accept impersonal harm (making the world worse without wronging someone) or adopt a complex counterfactual account that compares existing people to possible people. The threshold view complicates this by suggesting identity is not all-or-nothing. However, moral liability typically requires binary conditions—one is either liable or not. If identity is a matter of degree, harm attribution becomes correspondingly vague, potentially violating the demand for clear moral guidance required by your parental anxiety. Thus, satisfying (b), (d), and (e) simultaneously may be logically unsustainable without redefining "harm" itself.

  4. "Brief scorecard"
  Strictly person-affecting accounts fail primarily on (b) and (d). By insisting that harm requires making a specific existing person worse off than they would otherwise be, these views cannot condemn policies that change who comes into existence, even if those lives are blighted. They satisfy (e) but at the cost of moral intuition.

  Purely impersonal accounts (total utilitarianism) satisfy (b) and (a) easily by focusing on aggregate welfare. However, they fail (e) by eliminating the specific victim, rendering the harm abstract. They also risk violating (f), potentially demanding excessive reproductive restrictions to maximize average welfare, which conflicts with parental autonomy.

  Hybrid or two-level views offer the best coherence. They might employ person-affecting principles for existing persons and impersonal principles for future contingents. This handles (a) and (b) by allowing wrongs without specific victims in future generations. However, they struggle with (d) and (c). Integrating threshold identity into a hybrid model is difficult; if near-counterparts are treated as distinct, the person-affecting constraint re-applies. If they are treated as identical, biological realism is compromised. While hybrids avoid the starkest contradictions, they often lack the metaphysical precision to explain *why* near-counterparts matter morally if they are not strictly the same persons. None fully satisfy the list without residual tension.

  5. "The most damaging requirement"
  Desideratum (e)—preserving the distinction between harming a particular person and making the world worse impersonally—is the most damaging. This requirement eliminates the largest number of popular positions because it enforces the Person-Affecting Restriction. Once accepted, it forces the theory to confront the Nonidentity Problem directly. Any view that cannot identify a specific individual who is worse off due to a policy choice must declare that choice harmless to persons, violating (b). To satisfy (e), one must either deny that climate policy changes identities (empirically false) or argue that existence itself can be a harm (controversial). Consequently, (e) acts as a filter that removes most intuitive utilitarian solutions and forces remaining theories into complex counterfactual comparisons that often collapse under the weight of threshold identity vagueness.

  6. "A better framing, if needed"
  The nonidentity framework may be inadequate for your personal stakes because it fixates on metaphysical identity rather than moral obligation. A reconceptualization shifting from identity-based harm to obligation-based stewardship preserves urgency without requiring identity. Instead of asking "Did I wrong this specific future person?", the question becomes "Did I fail to maintain the conditions necessary for a flourishing human life?" This treats the biosphere as a trust held for whoever comes to exist, regardless of their genetic specificity. It accommodates threshold identity by focusing on the continuity of habitable conditions rather than the continuity of persons.

  **Conclusion:** No existing family of views jointly satisfies the core desiderata without significant compromise. The threshold-identity injection forces a fundamentally different approach. Because identity vagueness undermines binary liability, the solution lies not in refining identity conditions but in abandoning the requirement that harm must attach to a strictly identical individual. Stewardship models bypass the nonidentity trap entirely.
