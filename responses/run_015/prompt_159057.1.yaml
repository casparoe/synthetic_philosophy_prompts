prompt: |-
  Me and a friend spent like two hours arguing about time last night and I need someone to tell me which of us was talking nonsense — well, which parts can be settled at all.

  His summary of the whole presentism/eternalism thing went roughly like this: physics already decided it, because special relativity shows there's no absolute simultaneity, so there's no objective present, so presentism is false and we're living in a block universe where next year's events are exactly as real as the Norman Conquest. And once you sign on to that, he said, you also have to give up the idea that time really passes, that there's any objective difference between past, present and future, and that the future is open — "open" just means we don't know it yet, so agonising about what to do is really just agonising about what we're going to find out.

  I pushed back on that last bit and then improvised an argument I'm pretty sure I half made up: that presentism and eternalism might not even be contradicting each other, because "exists" isn't doing the same work in both — a presentist could hear it as "what our best physics has to quantify over" and an eternalist as "what gets a tenseless truth value," and then they'd just be talking past each other. It felt strong at 1am and I've no idea if thats a real move or whether it collapses on contact.

  Can you go through his summary piece by piece — what someone working on the philosophy of time, or on the physics side, would accept, what they'd wince at, what's just wrong — and then say whether the further claims about passage and the open future actually follow from the parts that are right? And is my "they're not even disagreeing" line a thing people argue, and if so how seriously is it taken?

  Also please keep settled stuff separate from live disputes: I want to know which points one of us can legitimately claim victory on and which are genuinely contested among people who know the literature, and flag how confident you are in each call.
