  **The Scenario**
  Consider a single-molecule Szilard engine (the Gas) and a one-bit physical Memory, both isolated from heat baths. Initially, the molecule is equally likely to be in the Left or Right half of the box ($S_G = k \ln 2$), and the Memory is equally likely to be 0 or 1 ($S_M = k \ln 2$). Crucially, they are perfectly correlated: if the molecule is Left, the Memory is 0; if Right, the Memory is 1 ($I = k \ln 2$). A reversible mechanical linkage couples the Memory to the partition: if Memory=0, the partition slides to confine the Left side; if Memory=1, it confines the Right. However, a second reversible stage *swaps* the confinement: if Memory=1 (molecule was Right), a piston pushes the molecule to the Left side. The final state leaves the molecule definitely on the Left ($S_G = 0$), while the Memory remains 0 or 1 with equal probability ($S_M = k \ln 2$), but now independent of the molecule's position.

  **Entropy Bookkeeping**
  All entropy values in bits ($k \ln 2 \to 1$).

  | Stage | System | $S_G$ (Marginal) | $S_M$ (Marginal) | $I(G:M)$ (Mutual) | $S_{Joint}$ ($S_G + S_M - I$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Initial** | Pre-correlated | 1 | 1 | 1 | **1** |
  | **Final** | Sorted/Decorrelated | 0 | 1 | 0 | **1** |
  | **Change** | $\Delta$ | **-1** | **0** | **-1** | **0** |

  *   **Stage 1 (Initial):** The joint system occupies 2 microstates: (Left, 0) and (Right, 1). Joint entropy is $\log_2(2) = 1$. Marginals are both 1. Mutual information is 1.
  *   **Stage 2 (Final):** The joint system occupies 2 microstates: (Left, 0) and (Left, 1). Joint entropy is $\log_2(2) = 1$. Gas marginal is 0 (always Left). Memory marginal is 1 (still 0 or 1). Mutual information is 0 (knowing Memory tells you nothing about Gas, which is always Left).
  *   **Conservation:** The total joint entropy $S_{Joint}$ remains constant (reversible process). The decrease in gas entropy ($\Delta S_G = -1$) is exactly compensated by the decrease in mutual information ($\Delta I = -1$).

  **Mechanism and Collapse**
  The work required to compress the gas (moving it from Right to Left when Memory=1) is supplied by the **free energy stored in the correlation**. In information thermodynamics, mutual information constitutes a non-equilibrium free energy resource ($F_{info} = -kT I$). By decorrelating the Memory from the Gas while reducing the Gas's configurational entropy, the system converts "Information Free Energy" into "Thermodynamic Free Energy" without heat flow or external work.

  If you remove the pre-existing correlation (set $I=0$ initially), the mechanism fails: the Memory no longer predicts the molecule's position. To sort the gas reliably, the Demon would have to perform a measurement (creating correlation) or apply work blindly. Without the initial $I$, the reversible linkage cannot distinguish which trajectory to apply, and the gas entropy cannot be lowered without an external entropy cost.

  **Strongest Objection (The Erasure Purist)**
  *"This case is a shell game. You have lowered the gas entropy, but you have left the Memory in a random state (0 or 1) that is now useless. To run the engine again, you must reset the Memory to a standard state (e.g., all 0s). That reset is an erasure, which costs $kT \ln 2$ of heat dissipation. Therefore, the thermodynamic debt is still paid by erasure, just deferred to the next cycle. The Second Law is only saved by the eventual erasure cost."*

  **Verdict**
  This case **refutes the claim that erasure is the fundamental cost**, revealing it instead as a **special case of correlation consumption**.

  The objection correctly notes that *cyclic operation* requires reset, but it misidentifies the source of the entropy reduction in *this* transaction. The gas entropy dropped because mutual information was consumed ($\Delta I = -1$), not because heat was dumped. Erasure is merely the specific physical process used to *regenerate* the correlation resource (by correlating the memory with a fresh zero-state reservoir). The more general constraint is the **Generalized Second Law**: $\Delta S_{total} + \Delta S_{bath} - \Delta I \ge 0$. Erasure is one way to balance this equation (by increasing $\Delta S_{bath}$), but as this case shows, consuming pre-existing $\Delta I$ is another. Correlation is the currency; erasure is just the bank fee for minting new coins.
