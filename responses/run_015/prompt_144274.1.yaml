      *   *Intuition:* Most people feel they go with the brain (the seat of memory and personality).
      *   *Complication:* If the brain is copied, or if the body is copied, where does the "I" go?
      *   *Dennett's View:* He leans towards the "Center of Narrative Gravity." The self isn't a hard thing inside the head; it's an abstraction, like a centroid in physics. It's a fiction that organizes experience.
      *   *The Prestige Connection:* Angier's machine doesn't just move the brain; it creates a whole new body. One falls, one rises. Which one is the "real" Angier?

  3.  **Deconstruct *The Prestige*:**
      *   *Plot:* Two magicians, Angier and Borden. Angier seeks the secret to Borden's "Transported Man." He gets Tesla to build a machine.
      *   *The Trick:* The machine doesn't transport; it duplicates. Angier steps in, a copy appears in the balcony, the original falls into a tank below and drowns.
      *   *The Horror:* Every night, Angier kills himself. The "survivor" is technically the clone, but he lives the life.
      *   *The Twist:* Borden was actually twins all along. Angier used a machine.
      *   *Key Scenes:* The tank full of bodies, the final reveal, the moment Angier realizes he is the one in the tank (or the one standing).

  4.  **Synthesize and Brainstorm Arguments:**
      *   *Location of Self:* In Dennett's hypothetical, we worry about the brain. In *The Prestige*, the brain is copied perfectly. So psychological continuity is identical *up to the moment of duplication*. After that, they diverge.
      *   *Narrative Gravity:* Angier is a performer. His identity *is* the trick. The "Center of Narrative Gravity" shifts to whoever is left to tell the story. The dead man cannot sustain the narrative. Therefore, the survivor *becomes* Angier by default, even if he is the copy.
      *   *Split-Brain:* If the brain is copied, is it like a split-brain patient? In split-brain cases, you get two streams of consciousness from one biological unit. Here, you get two biological units from one stream. Does this suggest the "self" was always a fragile construct ready to bifurcate?
      *   *Resistance/Ambiguity:* The scene where Angier shoots Borden. Which Angier is it? The one who knows he's a copy? Or does it matter? The film implies a continuity of *purpose* even if the biological substrate resets. The visual rhythm of the drowned bodies suggests a graveyard of "selves" that were just as real as the survivor.
      *   *Film's Contribution:* Philosophy deals in clean cuts. Film deals in *duration* and *suffering*. The horror isn't logical; it's the visceral accumulation of corpses. It shows the *cost* of maintaining the narrative center.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Introduce Dennett's "Where am I?" puzzle. Introduce *The Prestige* as a cinematic instantiation. State the thesis: The film moves beyond the location of the soul to the *cost* of the narrative self.
      *   **Dennett's Map:** Briefly explain the brain-transplant/backup scenario. The intuition that "I go with my brain."
      *   **The Prestige Mechanism:** Explain Tesla's machine. It's not teleportation; it's cloning. The "Pledge, Turn, Prestige" structure mirrors the philosophical problem (Setup, Complication, Resolution).
