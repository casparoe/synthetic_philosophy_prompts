      *   **The Point of Resistance:** The tank scenes. The visual accumulation of bodies. Philosophy asks "Who is who?" The film asks "How many died?" This resists the neat "survivor is the real one" conclusion. The drowned men are not just shells; they are failed centers of gravity.
