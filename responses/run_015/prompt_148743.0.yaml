answer: |-
  **The Scenario**
  In a busy university corridor, S walks past strangers dropping single sheets of paper. Act A is bending to retrieve a sheet. Cost: ten seconds, minor inconvenience. Benefit: stranger saves two minutes frustration. S faces an unbounded series of such opportunities throughout the day; no non-arbitrary point ends the series. S has no special relationship to the droppers, occupies no custodial role, created no mess, and is not uniquely placed; no one else is waiting. S knows with certainty the benefit will accrue and faces no competing obligations. Consider the first opportunity, A₁. Omission is not due to ignorance or hope others will act. The stream continues indefinitely regardless of S's choice.

  **The Three Verdicts**
  1.  **Standard Analysis:** A₁ is supererogatory. Common-sense morality holds that duty cannot be overdemanding. Requiring A₁ implies requiring the unbounded series, as no non-arbitrary stopping point exists. The cumulative cost of the series is excessive. To avoid this, duty cannot require entering the series. Thus, omitting A₁ is permissible. Yet, performing it aids others at trivial cost, making it praiseworthy. It lies beyond duty because requiring it entails requiring the impossible whole.
  2.  **Act Consequentialism + Scheffler:** A₁ is required. Scheffler's prerogative permits weighting self-interest by a fixed factor *M*, but only shields significant sacrifices. Here, cost (10s) is trivial relative to benefit (2m). Even weighted by *M*, the benefit outweighs the cost. The prerogative does not license ignoring net gains where self-sacrifice is negligible. Omitting A₁ fails to maximize value within permitted bounds, rendering it wrong.
  3.  **Kantian Wide Duty:** A₁ is within duty. Beneficence is a wide duty: we must adopt others' ends, but latitude exists on when and how much. Performing A₁ fulfills the end, making it meritorious. Omitting it is not culpable provided the agent adopts the end generally. Distinct from Standard: Kant places A₁ *within* the scope of duty (latitude of execution), whereas Standard places it *outside* duty (optionality of kind).

  **Diagnosis**
  The load-bearing feature is the unbounded series without a stopping point.
  *Test 1 (One-off):* If A₁ is a single, non-recurring opportunity, the Standard verdict changes. Without the threat of cumulative demand, trivial cost + real benefit typically generates a duty (Easy Rescue). A₁ becomes required, eliminating supererogation. The series structure is necessary for the Standard verdict.
  *Test 2 (High Cost):* If each act costs one hour, the AC verdict changes. The cost now exceeds the benefit even without the prerogative multiplier, or falls within the prerogative's shield. Omission becomes permissible. This confirms the original AC verdict relied on triviality, not the series structure itself.

  **Defences**
  *Consequentialist:* Shift to an aggregate requirement (e.g., "maximize good subject to a total cap on sacrifice"). This works to avoid burnout. Cost: It concedes instance-level optionality. If S can choose *which* acts fulfill the aggregate, A₁ becomes optional, conceding the supererogation theorist's core claim about specific acts.
  *Kantian:* Argue latitude in degree *is* what supererogation tracks. This works verbally. Cost: It collapses the distinction between duty and merit. If all meritorious acts within wide duty are "supererogatory," the category loses its "beyond duty" force, undermining the tripartite classification.

  **Honest Note**
  The Standard verdict is fragile. It assumes duty cannot require entering an unbounded series even at trivial cost per step. If one rejects this "slippery slope" constraint, A₁ becomes required even in the series. I relax the constraint that Common Sense Morality always treats trivial aid as duty; here, it treats the *cumulative* burden as the limit.
