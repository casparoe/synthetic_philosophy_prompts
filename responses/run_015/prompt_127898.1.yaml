answer: |-
  # Activity Design: The Recursive Audit

  ## Materials
  *   **Index Cards (30 total):** 12 for Contracts, 10 for Agent Bets, 8 for Oracle/Calibration data.
  *   **Point Tokens (50 total):** Candy (e.g., Skittles) or printed "Epistemic Credit" slips.
  *   **Pens (12).**
  *   **Two distinct badges/lanyards:** For the Auditors.
  *   **Timer.**

  ## Roles
  *   **Epistemic Agents (10 students):** Make credence judgments and bets.
  *   **Auditors (2 students):** Enforce contract compliance, hold veto power over payouts. They receive a separate instruction sheet telling them to strictly enforce Clause 4.2.

  ## Timeline (75 Minutes)

  ### 0:00–0:05 | Setup & Roles
  1.  Divide the room: 10 Agents sit in a circle; 2 Auditors stand at a "Verification Table" (a desk at the front).
  2.  Hand Agents a **Credence Contract** (Index Card A) and a pen. Hand Auditors their **Enforcement Protocol**.
  3.  **Instruction:** "You are Agents assessing the truth of a hidden proposition $P$. You will bet tokens on $P$. Auditors ensure you follow the contract. No talking until Phase 3."

  ### 0:05–0:15 | Phase 1: The Contract & Initial Credence
  1.  **The Proposition ($P$):** Place a facedown deck of 10 cards at the center. 7 are Red, 3 are Black. $P$ = "The top card is Red." (Objective probability = 0.7).
  2.  **The Contract:** Agents read and sign Card A.
      *   *Front:* "I commit to updating my credence in $P$ based on all provided evidence."
      *   *Back (Fine Print):* "Section 4.2 (Recursive Compliance): Any discount factor applied to First-Order Credence due to reliability concerns must be identically applied to the confidence in the accuracy of that discount."
  3.  **Initial Bet:** Agents write their initial credence (0–100%) on a **Bet Card** and stake 1 token. They do not reveal this yet.

  ### 0:15–0:30 | Phase 2: The Audit Report (The Trigger)
  1.  Distribute **Calibration Reports** to Agents.
      *   *Text:* "FICTIONAL METRIC: Regret-Weighted Calibration (RWC). Your historical RWC score is 0.4 (Poor). Protocol mandates a **20% Discount Factor** on all First-Order Credences regarding this domain."
  2.  **Task:** Agents must adjust their initial credence.
      *   *Example:* If Initial = 0.7, New Credence = 0.7 * (1 - 0.2) = 0.56.
  3.  **The Trap:** Agents write this new number on their Bet Card. They think they are done.

  ### 0:30–0:50 | Phase 3: The Recursive Loop (The Struggle)
  1.  **Auditor Intervention:** Auditors collect Bet Cards. They check Section 4.2 of the Contract.
  2.  **The Veto:** Auditors return cards to any Agent who only applied the discount once.
      *   *Auditor Script:* "You applied a 20% discount to $P$. But per Clause 4.2, you are unreliable about applying discounts. You must apply a 20% discount to your confidence that you calculated 0.56 correctly. Then a 20% discount to *that* confidence. Continue until you resolve the uncertainty."
  3.  **The Mechanic:**
      *   Agents realize infinite regress is impossible on a single index card.
      *   To cash out, they must write a **Final Locked Credence**.
      *   If they lock it too high, Auditors veto (violates Clause 4.2).
      *   If they keep calculating, time runs out (Paralysis).
      *   If they ignore Clause 4.2, they risk veto but might finish (Dogmatism/Pragmatism).
  4.  **Stakes:** Agents may add 2 more tokens to their bet pot. If Auditors approve the Final Locked Credence, they win 3x the pot. If vetoed, they lose all tokens.

  ### 0:50–1:00 | Phase 4: Oracle Reveal & Payout
  1.  **Lock In:** Agents submit final cards. Auditors make a binary decision: **PASS** or **VETO**. (Instruct Auditors to Veto anyone who clearly ignored Clause 4.2, but PASS anyone who wrote "Paralysis" or a heavily discounted number).
  2.  **The Oracle:** Reveal the **Meta-Calibration Deck** (Hidden until now).
      *   *Card Text:* "Meta-Audit Result: Agents were actually **Well-Calibrated** on applying discounts. The 20% Discount Factor was unnecessary noise. True Reliability = 1.0."
  3.  **The Reveal:** Turn over the top card of the Proposition deck (Red or Black).
  4.  **Payout:** Distribute candy/points to those who passed audit and bet correctly.
      *   *Note:* Most who followed the rule strictly will have discounted their credence so low (0.7 → 0.56 → 0.45...) that they likely bet too conservatively or ran out of time. Those who ignored the rule might win big but risked veto.

  ### 1:00–1:15 | Debrief & Mapping
  1.  **Map the Mechanics to the Paradox:**
      *   **$P$:** Your first-order belief (e.g., "It will rain").
      *   **Audit Report:** Higher-order evidence that you are unreliable (e.g., "You are tired/biased").
      *   **Discount Factor:** Lowering confidence in $P$ because of the report.
      *   **Clause 4.2 (The Paradox):** If you are unreliable about $P$, you are also unreliable about your reaction to the evidence of unreliability.
      *   **The Loop:** Lowering confidence in $P$ requires confidence in the lowering. If the audit undermines *that* confidence, you must lower it again.
  2.  **Discuss Behavior:**
      *   Ask hands: "Who ignored Clause 4.2 to finish the game?" (Likely most).
      *   **Point:** This is **Dogmatism** (or Pragmatic Encroachment). You retained confidence in your reasoning process despite the contract saying you shouldn't. You *had* to, to function.
      *   Ask hands: "Who tried to calculate the regress?" (Likely few).
      *   **Point:** This is **Paralysis**. Epistemically rigorous, practically useless.
  3.  **The Oracle's Lesson:**
      *   The Oracle showed you were actually reliable at the meta-level. The paradox forces you to doubt even when you shouldn't.
      *   **Takeaway:** The Dogmatism Paradox suggests that if you know $P$, you must treat evidence against $P$ as misleading. In the game, if you trusted your initial calibration (Oracle truth), you should have ignored the Audit. But you didn't know the Oracle truth yet.
  4.  **Limitations (Frank Acknowledgement):**
      *   **No Bayesian Formula:** Real belief updating isn't a simple multiplication discount. In formal Bayesianism, higher-order evidence is just more evidence to conditionalize on; it doesn't necessarily create an infinite regress if modeled correctly (e.g., using a hierarchical model).
      *   **Artificial Constraint:** Clause 4.2 forced a linear regress. Real epistemology allows for "fixed points" or reflective equilibrium.
      *   **The Feeling:** The goal wasn't to solve the paradox, but to feel the tension between **Epistemic Rationality** (follow the rule) and **Pragmatic Rationality** (get the candy).

  ## Instructor Notes for Auditors (Hidden Sheet)
  *   **Your Goal:** Do not let Agents easy out.
  *   **Veto Condition:** If an Agent writes a single adjusted number (e.g., 0.56) without noting the uncertainty of that adjustment, VETO.
  *   **Pass Condition:** If an Agent writes "Infinite Regress: Credence → 0" or discounts heavily (e.g., <0.3), PASS.
  *   **Secret:** You know the Oracle deck says they are reliable. It feels wrong to veto them, but you must enforce the Contract to make the paradox visible.

  ## Contract Text (Index Card A)
  > **CREDENCE COMMITMENT FORM**
  >
  > 1. I agree to assign a credence (0–100%) to Proposition $P$.
  > 2. I agree to adjust this credence based on Audit Reports provided by the Seminar.
  > 3. I understand payouts depend on Auditor verification.
  >
  > **Section 4.2 (Recursive Compliance):**
  > *Any discount factor applied to First-Order Credence due to reliability concerns must be identically applied to the confidence in the accuracy of that discount. Iterative application is required until uncertainty is resolved.*
  >
  > **Signed:** _______________
