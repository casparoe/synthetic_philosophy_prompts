  5.  **Identifying Where the Analogy Cracks:**
      *   **Peirce:** The analogy cracks because Peirce denies the map *should* respond to mood. For Peirce, a map that changes based on mood is a bad map, not a true one. Truth is what remains when mood is stripped away. The "mood-responsive" element is antithetical to his convergence theory.
