answer: |-
  The mood-responsive map analogy fundamentally collapses for Peirce because he defines truth as the elimination of such variability, whereas for James it functions only if the "mood" selects the destination while the "territory" dictates the viable paths, a distinction that dismantles the charge of pure subjectivism.

  For Peirce, the **territory** is External Reality, which exists independently of what anyone thinks. The **cartographer** is the infinite community of inquirers extending into the future, not any single individual. The **traveler** is the finite scientist or philosopher currently investigating. The **mood-responsive rewriting** corresponds to error, bias, or subjective distortion that the scientific method is designed to scrub away. The analogy cracks here because Peirce would argue a map that changes based on mood is not a "true" map at all; for him, truth is precisely what remains when the mood is removed. He seeks a static, final map that every traveler would agree upon at the end of investigation, so introducing a map that rewrites itself based on present temperament contradicts his core definition of truth as convergence.

  For James, the **territory** is the flux of pure experience and sensible reality. The **cartographer** is the individual believer acting in concert with that experience. The **traveler** is the individual navigating life's practical demands. The **mood-responsive rewriting** corresponds to the process of verification, where an idea becomes true by proving useful to the believer's specific situation. The analogy cracks for James if one assumes the traveler can draw roads where there are cliffs; James insists that while the "mood" (practical interest) determines which truths are relevant, the "territory" (sensory experience and previous truths) constrains what is possible. A map that leads you off a cliff does not "work," so it cannot be true, meaning the rewriting is not arbitrary.

  The charge that James makes truth "just subjective" survives only if the analogy imports the idea that the traveler creates the terrain itself. However, James's view is better understood as the traveler choosing the destination based on mood, while the territory determines whether the route is passable. Because the map must still successfully guide the traveler through the actual territory to be considered "true," the validity of the belief depends on a transaction between human need and external constraint. Therefore, once we separate the choice of interest (subjective) from the workability of the belief (objective constraint), the accusation of pure subjectivism dissolves; James offers a truth that is human-centric but not human-made.
