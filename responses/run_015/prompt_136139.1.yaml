prompt: |-
  I'm trying to hold together my view on biological function for a philosophy of science discussion and want an audit of whether the package is sustainable. Here are my commitments: (1) a strictly etiological account—a trait's biological function is the effect for which it was naturally selected, and evolutionary history is both necessary and sufficient for correct functional ascription; (2) malfunction is always failure to perform that specific historically selected effect, regardless of whether the trait currently performs other causally important roles; (3) in clinical physiology we correctly identify organ functions—say, renal filtration or cardiac circulation—purely from present mechanistic contribution, with no evolutionary knowledge; (4) this clinical practice is not a different pluralistic kind of talk but literally the same univocal concept of function; and (5) a de novo synthetic enzyme, designed with no evolutionary history, can genuinely possess a biological function fixed by its designer's intended causal role. Which pairs are genuinely in tension, which only appear so, and what is the least costly revision? Rank the conflicts by severity; for each, specify which commitment must yield and what is lost. Also tell me which single change to this set would resolve the most problems at once.
