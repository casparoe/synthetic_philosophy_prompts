      *(Final check on Step 3)*: Premise (3) "Preventing that life... is pro tanto good." This is the "Asymmetry". If we reject (5), we keep (3). We just say "Yes, preventing wild life is good, *but* creating farm suffering is bad, and you haven't weighed them."

