prompt: |-
  I'm giving a 20-minute talk next month to the people who actually run citizens' assemblies for governments — about thirty deliberative-democracy practitioners — plus two councillors who've commissioned them, and one political theorist who works on epistemic arguments for democracy. The practitioners care about recuitment, representativeness and the conditions for good talk; the councillors care about mandate and cost; the theorist will want to know whether my case is epistemic or procedural. My thesis: the trouble with assemblies isn't that they're advisory, it's that they're advisory *and* one-off, so I'm proposing a standing chamber drawn by stratified lot with exactly one power — it can force the elected chamber to hold a recorded vote on any motion it passes, within 60 days, and can do nothing else. My three reasons: (i) the actual failure mode of assemblies is framing capture, since civil servants write the brief and the options; (ii) a permanent body with a real power would pull in a different, more confident kind of member; (iii) a compelled vote costs politicians almost nothing, so it's winnable. I'm also floating a second feature — a fresh random sample that votes the same motion having never deliberated, the motion carrying only if both pass — but I don't know that it survives this room.

  Give me a prep sheet: the six-ish objections I'll really get from this crowd, not from the online lottocracy crowd, phrased how they'd phrase them, ordered by how much damage they'd do, each with a two-minute reply and a note on where the reply is soft. What should I concede in the first two minutes, before someone else says it? And include the objection I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Audience and Context:**
      *   **Speaker:** Proposing a "Standing Citizens' Chamber" (SCC) with a specific power (force a recorded vote within 60 days).
      *   **Audience:**
          *   ~30 Practitioners (care about recruitment, representativeness, good talk conditions).
          *   2 Councillors (care about mandate, cost, political viability).
          *   1 Political Theorist (cares about epistemic vs. procedural justification).
      *   **Time:** 20-minute talk (very tight).
      *   **Thesis:** Advisory + One-off is the problem. Standing + Forced Vote is the solution.
      *   **Secondary Feature:** "Double-lock" (Deliberating chamber + Fresh random sample must both agree).
      *   **Goal:** A prep sheet with objections, replies, concessions, and the "hope nobody asks" objection.

  2.  **Deconstruct the Proposal:**
      *   *Mechanism:* Stratified lot, standing body.
      *   *Power:* Force recorded vote on any motion within 60 days. No veto, no legislation initiation (technically), just agenda-setting/vote forcing.
      *   *Rationale:* Avoids framing capture (civil servants), attracts confident members, low cost for politicians.
      *   *Secondary:* Raw sample check (epistemic filter?).

  3.  **Brainstorming Objections (filtering for *this* crowd):**
      *   *Online Lottocracy Crowd:* Would say "Give them real power/veto," "Abolish parties," "Sortition for everything." -> *Ignore these.*
      *   *Practitioners:*
          *   "Burnout." Standing body? People quit.
          *   "Elite Capture." If it's permanent, lobbyists/party machines will target them.
          *   "Deliberative Quality." Can you sustain good talk for years?
          *   "Representativeness." Stratified lot vs. random. Turnover issues.
          *   "The Double-Lock." Undermines deliberation? Why trust the non-deliberating sample?
      *   *Councillors:*
          *   "Mandate." Who elected you?
          *   "Cost." Permanent body is expensive.
          *   "Gridlock." Flooding the agenda.
          *   "Framing." You say you fix framing, but who sets the *rules* of the standing chamber?
      *   *Theorist:*
          *   "Epistemic vs. Procedural." Is this about truth or fairness?
          *   "The Double-Lock." Epistemically dubious (why trust ignorance?).

  4.  **Selecting and Ordering the Top 6 Objections:**
      *   *Criteria:* Damage potential (how much it undermines the proposal) + Likelihood from this specific group.
      *   1. **Elite Capture/Institutionalization (Practitioners/Theorist):** A standing body becomes a target. Lobbyists, parties, NGOs will groom members. This kills the "independence" claim. *High Damage.*
      *   2. **The Mandate/Accountability Problem (Councillors):** If they force votes, they are co-legislators without election. Councillors will hate this. *High Damage.*
      *   3. **Deliberative Degradation (Practitioners):** You can't keep "good talk" conditions for a permanent body. They become professionals or partisans. *Medium-High Damage.*
      *   4. **Agenda Flooding/Gridlock (Councillors/Practitioners):** If they can force *any* vote, they clog the elected chamber. 60 days is tight. *Medium Damage.*
      *   5. **The Double-Lock Contradiction (Theorist/Practitioners):** Why add a raw sample? It undermines the value of deliberation you just praised. *Medium Damage.*
      *   6. **Framing Displacement (Practitioners):** You claim to fix framing capture, but who writes the *rules of procedure* for the standing chamber? That's the new capture point. *Medium Damage.*

      *Refining Order:*
      1.  Institutional Capture (The "Permanent Target" problem).
      2.  Democratic Mandate (The Councillors' dealbreaker).
      3.  Deliberative Fatigue/Professionalization (The Practitioners' dealbreaker).
      4.  Agenda Flooding (The Practicality issue).
      5.  The Double-Lock Logic (The Theorist/Practitioner puzzle).
      6.  Framing Displacement (The "You didn't actually solve it" point).

  5.  **Drafting Replies and Identifying Soft Spots:**
      *   *Capture:* Reply: Short terms? Rotation? Soft spot: Any permanence invites attention.
      *   *Mandate:* Reply: It's not a veto, just a vote. Voters decide. Soft spot: It *does* shift power balance significantly.
      *   *Fatigue:* Reply: Part-time? Stipends? Soft spot: Good talk requires time/commitment, hard to do part-time.
      *   *Flooding:* Reply: Thresholds to bring motion? Soft spot: Thresholds create internal politics.
      *   *Double-Lock:* Reply: Checks populism vs. elite capture. Soft spot: Epistemically incoherent (why trust the ignorant?).
      *   *Framing:* Reply: Self-determined agenda. Soft spot: Who funds the research staff?

  6.  **Developing the Opening Concession:**
      *   Need to disarm the Councillors and Practitioners immediately.
      *   Acknowledge cost. Acknowledge this isn't a panacea. Acknowledge the risk of professionalization.
      *   *Key Concession:* "This is not a replacement for elections, and yes, it costs more than a one-off."

  7.  **Identifying the "Hope Nobody Asks" Objection:**
      *   What is the fatal flaw the speaker knows deep down?
      *   Probably: "If the elected chamber ignores the vote anyway (since it's not binding), what changed?" OR "Who funds the research staff for the standing chamber?"
      *   *Better one:* "If politicians know this body exists, they will game the *election* cycle to counteract it, or simply ignore the vote if there are no consequences."
      *   *Best one:* "The Power of the Purse." If the elected chamber controls the budget of the Standing Chamber, they can starve it. If they don't, where does the money come from?
      *   *Let's go with:* **The Implementation Paradox.** "Who passes the law to create this?" If politicians pass it, why would they limit themselves? If citizens pass it, how?

  8.  **Review and Refine:**
      *   Tone: Professional, sharp, respectful of the audience's expertise.
      *   Format: Prep Sheet style.
      *   Check constraints: 20-min talk context (replies need to be punchy, 2 mins spoken is ~250-300 words).
      *   Ensure the "Double-Lock" skepticism is addressed (the prompt says "I don't know that it survives this room").

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Objection 1:* Make sure it sounds like a practitioner speaking ("We've seen engagement fatigue...").
      *   *Correction on Objection 2:* Make sure it sounds like a councillor ("My voters didn't ask for this...").
      *   *Correction on Double-Lock:* The prompt implies the speaker is unsure about this feature. The objection should validate that uncertainty.
      *   *Soft Spots:* Be honest about where the argument is weak.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
