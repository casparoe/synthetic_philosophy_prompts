answer: |-
  (a) **Content Retention Scores**

  1.  **Tendency, not forecast:** 6. It retains the mechanism (pressure) but dilutes the risky prediction (distress) into a probabilistic tendency, insulating the core from specific counter-examples.
  2.  **Expired scope:** 5. It concedes that the arithmetic progression claim is false for the industrial era, retaining the theory only by shrinking its domain to the pre-1800 organic economy.
  3.  **The preventive check fired:** 8. It retains the geometric/arithmetic gap and the necessity of a check, reclassifying the demographic transition as the check rather than a refutation.
  4.  **Engels' pause:** 9. It retains the full risky claim and asserts it was empirically accurate during the specific historical window where the theory's conditions were binding.
  5.  **Patience:** 10. It retains every original risky claim intact, refusing to concede any error, merely asserting that the falsification event has not yet arrived.
  6.  **Reformulation:** 0. It dissolves the specific geometric/arithmetic claim into a tautology compatible with any historical outcome, retaining no risky content.

  (b) **Independent Testability of Auxiliaries**

  1.  **Tendency:** **Partly.** One can independently measure wage pressure and resource scarcity, but the claim that these constitute a "constant effort" regardless of outcome is difficult to isolate from other economic variables.
  2.  **Expired scope:** **Yes.** The shift from land-constrained to energy-constrained production is measurable via input data (acreage vs. fossil fuel/nitrogen use) independent of population theory.
  3.  **The preventive check:** **Partly.** Marriage ages and fertility rates are measurable, but classifying voluntary fertility decline as "moral restraint" versus economic calculation requires auxiliary assumptions about motivation.
  4.  **Engels' pause:** **Yes.** Real wage and output data for the period 1790–1840 are independently reconstructable from historical records without reference to Malthusian theory.
  5.  **Patience:** **No.** The claim that the binding constraint is "coming soon" offers no independent specification of the trigger date or threshold, making the timing auxiliary untestable.
  6.  **Reformulation:** **No.** The claim that "something relaxes pressure" is post-hoc; there is no independent way to identify the relaxer before the fact.

  (c) **Ranking by Defensibility**

  1.  **Engels' pause**
  2.  **The preventive check fired**
  3.  **Expired scope**
  4.  **Tendency, not forecast**
  5.  **Patience**
  6.  **Reformulation**

  **Engels' pause** outranks **The preventive check fired** because it points to a specific historical interval where the theory held exactly as written, whereas the preventive check requires reinterpreting observed data (fertility decline) through a specific motivational lens. **The preventive check fired** outranks **Expired scope** because it keeps the theory applicable to the present day by internalizing the solution, whereas Expired Scope admits the theory no longer applies to the modern economy. **Expired scope** outranks **Tendency, not forecast** because it offers a clear, physical boundary condition (energy regimes) for the theory's failure, whereas Tendency relies on a vague philosophical distinction between law and outcome. **Tendency, not forecast** outranks **Patience** because it offers a mechanism (pressure) that can be investigated now, whereas Patience offers only a delay with no investigable mechanism for the delay. **Patience** outranks **Reformulation** because it at least retains a falsifiable claim (the crisis will happen), whereas Reformulation renders the theory compatible with the crisis never happening.

  (d) **Stacking and Undercutting**

  Moves 4 (**Engels' pause**) and 2 (**Expired scope**) stack coherently: they form a periodized defense where the theory was strictly true in the organic economy (4) and became domain-limited once fossil energy broke the land constraint (2). Moves 1 (**Tendency**) and 3 (**Preventive check**) also stack well, as the tendency creates the pressure that triggers the check.

  However, Moves 2 (**Expired scope**) and 5 (**Patience**) undercut one another fundamentally. Move 2 argues the arithmetic limit is obsolete due to technological substitution (fossil fuels), implying the constraint is gone. Move 5 argues the constraint is planetary and inevitable, implying technology has only delayed, not solved, the problem. You cannot claim the domain closed *and* that we are still waiting for the domain to bite. Similarly, Move 6 (**Reformulation**) swallows Move 3 (**Preventive check**); if "something" always relaxes pressure (6), specifying that "moral restraint" did the work (3) becomes an unnecessary detail rather than a theoretical commitment.

  (e) **Probability of "Right but Early"**

  0.05

  (f) **Condition for Legitimacy**

  A "right but early" verdict is legitimate only if the defender can independently specify the *delay mechanism*—the cause of the lag between the predicted time and the actual time—without using the theory itself to explain the delay. None of the six moves meets this condition: Move 5 posits the delay without specifying the mechanism, and Move 2 specifies a mechanism (fossil fuels) that concludes the theory is obsolete rather than merely early.
