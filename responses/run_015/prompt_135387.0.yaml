answer: |-
  Elara works at a worker-owned bakery where every member signed a mutual-shift-coverage pact, agreeing to cover emergencies to ensure the collective's survival. When her colleague Sam calls because his child has been hospitalised and he cannot work the night shift, Elara realises covering for him means cancelling her only scheduled visit to her ageing mother abroad, a trip booked months ago with non-refundable costs and no rescheduling option. The co-op cannot hire temp staff in time, meaning if Elara refuses, Sam loses pay and faces disciplinary action, but if she agrees, she sacrifices the visit entirely.

  For the Kantian, the voluntary pact transforms the general imperfect duty of beneficence into a specific obligation by narrowing the agent's latitude; by willing the co-op's existence, Elara has committed to a maxim of mutual aid that cannot be universalised if she makes an exception for herself when the need is urgent, rendering the act obligatory despite the cost. Conversely, the supererogation-friendly view argues that the disproportionate personal sacrifice places the act beyond duty; the pact implies reasonable assistance, not self-abnegation, so fulfilling it is praiseworthy but not required. The structural feature doing the work is the voluntary pact itself: it acts as a commitment multiplier for the Kantian, tightening the normative bind, whereas the supererogationist sees it as bounded by reasonable cost. If you remove the pact, the Kantian case collapses into mere general beneficence (where latitude returns), and the supererogatory view remains unchanged, rendering the act purely optional for both. The Kantian would attack the supererogatory verdict by arguing it mistakenly treats moral duty as a cost-benefit analysis, failing to respect Sam as an end-in-himself and undermining the very autonomy-grounding institution they voluntarily established. They might say you definately cannot weigh your holiday against another's livelihood when you've promised not to.
