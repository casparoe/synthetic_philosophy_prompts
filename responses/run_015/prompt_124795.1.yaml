answer: |-
  The standoff in your group is not merely stubbornness; it is a structural feature of social ontology. Your hypothesis—that each side excludes the other's problematic cases as non-data—is partially correct, but it diagnoses the symptom rather than the disease. The deeper issue is that the Lewisians and normativists are building theories to solve different problems, using the same vocabulary to describe distinct phenomena. They are not just filtering data; they are measuring different dimensions of the same object.

  Consider your three cases through this lens. In *orphaned conventions*, the Lewisian appeal to meta-coordination is indeed theoretically robust but explanatorily thin. By claiming the group now coordinates on *maintaining* the rule rather than the rule's original function, the Lewisian saves the theory from refutation at the cost of specificity. If any persistent behavior counts as coordination on persistence, the theory becomes unfalsifiable. However, the normativist counter—that the rule's pointlessness proves irreducible normativity—assumes that norms must have independent justification. The Lewisian replies that stability *is* the function. Here, the Lewisian explains persistence; the normativist explains the felt pressure. Neither is wrong about the phenomenon, but they are answering different questions.

  Regarding *first-instance norms*, the Lewisian faces a genuine bootstrapping problem. If norms are equilibria based on mutual expectations, a single email cannot create a norm at t=0. The Lewisian must argue that the email triggers a background convention of obeying chairs. The normativist insists the email itself creates the obligation. This reveals a mismatch: the Lewisian explains the *conditions of stability* for a norm, while the normativist explains the *mechanism of creation*. The Lewisian needs a history; the normativist needs an act.

  Finally, *normative leakage* is the battleground for the constitutive dispute. The Lewisian treats third-party punishment as an internalized disposition selected for group stability—a causal story. The normativist sees the very willingness to incur costs for strangers as evidence of a non-instrumental "ought." The Lewisian reduces the "ought" to a psychological "is"; the normativist insists the "ought" cannot be reduced without losing the phenomenon.

  Ranking the diagnoses of this disagreement requires assessing what drives the argumentative energy.

  1.  **Mismatch of Explanatory Targets:** This is doing the most work. The Lewisians are providing a causal-functional account of social stability (how do patterns persist?). The normativists are providing a phenomenological-legitimacy account (why do we feel bound?). When the normativist demands an account of blame, the Lewisian offers an account of equilibrium. They talk past each other because one seeks the engine of society, the other seeks the experience of obligation.
  2.  **Substantive Constitutive Dispute:** This is the philosophical core. Can normative force be constructed entirely from non-normative ingredients (expectations, preferences)? The normativists say no, claiming this commits the naturalistic fallacy. The Lewisians say yes, claiming the normativists are mystifying social facts. This dispute sustains the deadlock because it is foundational.
  3.  **Displaced Empirical Question:** Both sides make claims about human psychology and population dynamics that are settled from the armchair. Is leakage truly costly? Are expectations really absent in first-instance cases? This fuels the fire but doesn't start it.
  4.  **Verbal Disagreement:** This does the least work. Both sides agree on the cases (coffee rules, emails, punishment); they disagree on what these cases prove.

  The question is not ill-posed, but it is currently overloaded. It asks for a single theory to explain both the mechanical stability of social order and the normative force of obligation. These may be distinct phenomena that overlap but do not share a single essence.

  Progress would consist of redrawing the question. The group should distinguish between *normative stability* (Lewisian territory) and *normative legitimacy* (normativist territory). A formal result showing that expectations can generate stability without legitimacy, or vice versa, would clarify the boundaries. Alternatively, empirical findings on whether third-party punishers feel "obligated" or merely "impelled" could settle the leakage debate. I expect this progress is possible but unlikely without a deliberate shift in focus, as both sides are invested in totalizing explanations.

  My diagnosis is most likely wrong if the constitutive dispute is actually primary. I have ranked the mismatch of targets higher, assuming the sides could agree on what they are explaining if they clarified their goals. However, it may be that even with clarified targets, they fundamentally disagree on whether normativity exists independently of human psychology.

  The one consideration that would make me abandon this diagnosis is a formal game-theoretic model that successfully derives genuine obligation—not just compliance—from common knowledge and conditional preferences alone. If a Lewisian could demonstrate mathematically that the "ought" emerges necessarily from the "is" of equilibrium without smuggling in normative premises, the normativist's claim of irreducibility would collapse, proving the dispute was substantive all along, not merely a mismatch of targets. Until then, the standoff is a feature, not a bug, of asking one theory to do two jobs.
