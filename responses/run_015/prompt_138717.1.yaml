answer: |-
  This is a fascinating impasse, and your diagnosis is remarkably sharp for someone who came to philosophy late. In fact, your background in chemistry is likely an asset here; you are looking for operational definitions and error margins, whereas your group is likely getting lost in semantic drift.

  Here is an assessment of your hypothesis, the legitimacy of your "noisy channel" model, and a proposal for what actual progress looks like in this specific philosophical neighborhood.

  ### 1. Is the diagnosis right?
  **Yes.** You have identified a classic category error. Your group is conflating three distinct logical categories under the single label "History." In the philosophy of history, these are often distinguished as follows:

  1.  **Ontological (Did the event occur?):** This is about *Res Gestae* (things done). Did a coalition of Mycenaean states besiege a city at Hisarlik? Did a man named Arthur lead cavalry against Saxons?
  2.  **Epistemic (Can we know it?):** This is about evidence and justification. Do we have sufficient warrant to assert the ontological claim?
  3.  **Functional (What work does the story do?):** This is about *Memoria*. Does the story function as a foundational narrative for a culture, regardless of its factual accuracy?

  The stalemate happens because Person A is arguing Ontology ("There was a real war"), Person B is arguing Epistemology ("We can't prove it"), and Person C is arguing Function ("It doesn't matter, it defines Greek identity"). They are all nodding at the word "History" but pointing at different concepts.

  **Progress Strategy:** Explicitly separate these. Ask the group: "Are we asking if it *happened*, if we can *know* it happened, or if it *matters* that it happened?" You will likely find you agree on two of the three and only disagree on the remaining one.

  ### 2. Is the "Noisy Channel" move legitimate?
  **Yes, it is legitimate as an epistemic model, provided it is not treated as an ontological proof.**

  In information theory (Shannon-Weaver), if the signal-to-noise ratio drops below a certain threshold, the absence of a signal tells you nothing about the presence of a transmitter. It simply tells you the channel is saturated.

  Applied to historiography:
  *   **The Signal:** The historical kernel (e.g., a specific battle).
  *   **The Channel:** Oral transmission.
  *   **The Noise:** Myth-making, political aggrandizement, theological retrofitting, memory decay.

  Your intuition is correct: **Beyond a certain temporal horizon (the "noise floor"), the lack of contemporary written attestation ceases to be evidence of absence.** It becomes a null result.

  However, you must guard against two risks:
  1.  **The Prior Probability:** In chemistry, you know the laws of physics are constant. In history, priors vary. A battle at Troy has a high prior (people fought wars then). A mass exodus of 2 million people leaving no ecological or administrative trace in Egypt has a low prior. The "noise channel" explains why we lack data, but it doesn't raise the prior probability of the event itself.
  2.  **The Category Mistake Risk:** If you use the noise model to say "Therefore, the legend *is* history," you have made a mistake. The model only justifies *agnosticism*, not *affirmation*. It validates the statement: "We cannot rule it out," not "It likely happened."

  **Verdict:** It is a robust heuristic for calibrating evidentiary weight. It stops the skeptics from using "no contemporary records" as a trump card, but it doesn't hand the win to the believers.

  ### 3. What would count as progress?
  You will not get progress from new evidence (the dirt has been dug for 150 years). You will not get progress from dropping the question (it's too central to how we understand human narrative).

  Progress will come from **redefining the boundary condition.**

  The question "When does a legend become history?" assumes there is a transmutation point, like water freezing to ice. A more productive philosophical framing is that they are **distinct genres of truth-claim.**

  I suggest introducing your group to the distinction made by the German historian Jan Assmann between **Communicative Memory** and **Cultural Memory**.
  *   **Communicative Memory:** Living memory (3–4 generations). Informal, non-institutionalized. This is where "History" (in the modern forensic sense) lives.
  *   **Cultural Memory:** Fixed points in the past beyond living memory. Institutionalized, ritualized, mythologized. This is where "Legend" lives.

  **The Shift:**
  Stop asking "Is this story true?" Start asking "At what point does the *function* of the narrative shift from reporting to identity-formation?"

  *   **Troy:** Likely Communicative Memory that bled into Cultural Memory. There was a war (Ontology), but the *Iliad* is Cultural Memory (Function).
  *   **Arthur:** Likely Cultural Memory crystallized around a vague Ontological kernel (a 5th-century *dux bellorum*).
  *   **Exodus:** Likely pure Cultural Memory (Theological foundation) with little to no Ontological correspondence to the specific narrative provided.

  ### 4. A Proposal for Your Next Meeting
  Since you are the chemist, propose an experiment. Draw a 3x3 grid on the whiteboard.

  *   **Rows:** The Three Cases (Troy, Arthur, Exodus).
  *   **Columns:** The Three Questions (Event Occurred? Person Existed? Garbled Memory?).

  Ask everyone to place a dot in each cell representing their confidence level (0–100%).

  *   *Hypothesis:* You will find that for Troy, everyone puts high dots in "Event Occurred." For Exodus, everyone puts low dots in "Event Occurred" (as described). The fight is actually about Arthur, and specifically about the "Garbled Memory" column.
  *   *The "Noise" Intervention:* Then, introduce your "Noise Floor." Agree on a generational limit (say, 150 years) where oral transmission degrades to the point where specific details (dates, numbers, dialogue) are epistemically inaccessible.
  *   *The Resolution:* Agree that anything beyond the noise floor cannot be "History" in the forensic sense (like a court transcript), but can be "History" in the cultural sense (like a constitution).

  ### Summary
  Your diagnosis is correct: you are suffering from equivocation. Your "noisy channel" model is a valid epistemic tool that correctly identifies why the skeptics' demand for contemporary writing is anachronistic for the Bronze Age.

  But the philosophical progress lies in admitting that **History is not a subset of Truth; it is a subset of Narrative.** A legend becomes history not when it is proven true, but when a culture decides to treat it as a binding account of their origins. The "truth" of Arthur is not in the archaeology; it is in the fact that English kings believed it enough to name their sons after him.

  If the group can accept that "Historical Truth" and "Historical Reality" are different chemical compounds, the circles should stop.
