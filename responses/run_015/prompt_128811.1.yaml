      *   Scoring included? Yes.

  10. **Final Polish:** Ensure the distinction between "non-negotiable" and "camp preferences" is clear. Make sure the "distributed centre" question is answered (it challenges the metaphor).

  *(Self-Correction during drafting)*: I need to be careful not to validate the theory as *true*, but rather evaluate what it *needs* to do to be viable. The user asked "what must a narrative-gravity account... actually explain".

  *(Refining the "Distributed" point)*: In physics, a system can have a centre of gravity. If two objects are bound, they have a combined CoG. So, a distributed self *might* work within the metaphor, but it complicates the "individual responsibility" desideratum. I should highlight this tension.

  *(Refining the "Amnesia" point)*: If the narrative breaks, does the self vanish? The theory needs to explain why preferences persist even when the story is gone. This suggests the narrative isn't the *whole* story (pun intended). I need to list this as a requirement: explaining the non-narrative underpinnings.

