prompt: |-
  I'm a software engineer with basically zero formal philosophy background, but I've been thinking about this idea that the self isn't some little inner soul-thing but more like a centre of narrative gravity — basically the point where all your stories about yourself pull together and create the illusion of a single owner. I was going to draft a blog essay on whether that actually holds water, but I realised I don't even know what the theory is meant to deliver in the first place.

  So could you lay out the full desiderata for me? Like, what must a narrative-gravity account of the self actually explain? I can think of a few cases: people with severe amnesia who still have clear preferences and emotional continuity; people who tell completely contradictory stories about their past and both feel genuinely true; and this concept my friend mentioned called narrative drift, where the centre slowly shifts over decades but there's never a clean handover — more like overlapping fog banks of identity rather than one well. Does the theory need to accomodate that? And what about shared narratives in really close relationships or collective groups — can there be a distributed centre, or does that break the model in a seperate way?

  Please list the requirements with the reason behind each one, flag any pairs that might be impossible to satisfy together, and say which are non-negotiable versus just camp preferences. Then briefly score the idea against two alternatives: the Hume-style bundle view where there's no self at all, just perceptions, and the Cartesian view of a unified conscious subject. No citations or reading lists please — I wouldn't be able to verify them. Could you write the answer in British English? Cheers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, zero formal philosophy background.
      *   **Topic:** The "Narrative Gravity" theory of self (Dennett-esque, though not explicitly named by the user).
      *   **Task:** Lay out the *desiderata* (requirements/goals) for this theory. What *must* it explain?
      *   **Specific Examples to Address:** Amnesia/preference continuity, contradictory stories, narrative drift (shifting centre), shared/distributed narratives.
      *   **Format:** List requirements with reasons, flag tensions/impossibilities, distinguish non-negotiable vs. optional. Score the Narrative Gravity theory against Hume (Bundle) and Cartesian (Ego) views.
      *   **Constraints:** No citations/reading lists. British English.
      *   **Tone:** Informative, analytical, accessible but rigorous.

  2.  **Deconstruct the "Narrative Gravity" Theory:**
